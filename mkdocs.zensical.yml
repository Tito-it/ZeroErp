site_name: Zero ERP Documentation
repo_url: https://github.com/Tito-it/ZeroErp
repo_name: Tito-it/ZeroErp
dev_addr: 127.0.0.1:8010

docs_dir: .tmp/zensical_docs
site_dir: site-zensical

# Doc di sviluppo (brief, status, analisi WIP): escluse da build + ricerca.
# Allineato al pruning della build Zensical (DEFAULT_EXCLUDED_DOC_DIRS in scripts/build_docs_zensical.py).
exclude_docs: |
        work-in-progress/
        work-done/

theme:
        name: material
        language: it # lingua di default: Italiano
        features:
                - navigation.tabs
                - navigation.sections
                - navigation.expand
                - navigation.indexes
plugins:
        - include-markdown:
                  opening_tag: "{%"
                  closing_tag: "%}"
        - abs-to-rel
        - search
        - i18n:
                  docs_structure: folder

                  languages:
                          - locale: it
                            name: Italiano
                            default: true
                            build: true
                          - locale: en
                            name: English
                            build: true

markdown_extensions:
        - toc:
                  permalink: true
        - admonition
        - md_in_html
        - codehilite
        - pymdownx.superfences:
                  custom_fences:
                          - name: mermaid
                            class: mermaid
                            format: !!python/name:pymdownx.superfences.fence_code_format ""
extra_javascript:
        - assets/javascripts/mermaid.min.js
        - assets/javascripts/mermaid-init.js

