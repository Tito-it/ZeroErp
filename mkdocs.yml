site_name: Zero ERP Documentation
repo_url: https://github.com/Tito-it/ZeroErp
repo_name: Tito-it/ZeroErp

docs_dir: docs
site_dir: site

theme:
  name: material
  language: it            # lingua di default: Italiano
  features:
    - navigation.sections
    - navigation.expand
plugins:

  - search
  - include-markdown
  - i18n:
      docs_structure: folder
      
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true

nav:
  - Home: index.md
  - Introduzione:
      - Cos’è Zero ERP: it/introduzione.md
      - Manifesto: it/manifesto.md
      - Licenza: it/LICENSE.md
  - Installazione:
      - Prerequisiti: it/installazione.md
  - Architettura:
      - Panoramica: it/architettura.md
      #- Flusso Dati: it/flusso-dati.md
      - Database:
          - Liquibase Setup & Workflow: it/liquibase-setup-workflow.md
          - Linee Guida SQL: it/linee-guida-sql.md
  - DB Zero:
      - Panoramica: dbzero/index.md
      - Schemi:
          - Anagrafiche: dbzero/anagrafiche/index.md
          - Config:     dbzero/config/index.md
          - Dbops:      dbzero/dbops/index.md
          - Script:     dbzero/script/index.md
          - Storico:    dbzero/storico/index.md
         

  - Sviluppatori:
      - API: it/dev/api.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
