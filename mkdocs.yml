site_name: Zero ERP Documentation
repo_url: https://github.com/Tito-it/ZeroErp
repo_name: Tito-it/ZeroErp
dev_addr: 127.0.0.1:8010

docs_dir: docs
site_dir: site

theme:
        name: material
        language: it # lingua di default: Italiano
        features:
                - navigation.tabs
                - navigation.sections
                - navigation.expand
                - navigation.indexes
plugins:
        - include-markdown:
                  opening_tag: "{%"
                  closing_tag: "%}"
        - abs-to-rel
        - search
        - i18n:
                  docs_structure: folder

                  languages:
                          - locale: it
                            name: Italiano
                            default: true
                            build: true
                          - locale: en
                            name: English
                            build: true

markdown_extensions:
        - toc:
                  permalink: true
        - admonition
        - codehilite
        - pymdownx.superfences:
                  custom_fences:
                          - name: mermaid
                            class: mermaid
                            format:

                                    !!python/name:pymdownx.superfences.fence_code_format ""
extra_javascript:
        - assets/javascripts/mermaid.min.js
        - assets/javascripts/mermaid-init.js

nav:
        - Home: it/index.md
        - Visione e Filosofia:
                  - Manifesto: it/manifesto.md
                  - Sviluppo Concentrico: it/sviluppo-concentrico.md
                  - Cos’è Zero ERP: it/introduzione.md
                  - Perchè Zero ERP: it/perche-zeroerp.md
        - Installazione:
                  - Prerequisiti: it/installazione.md
                  - Licenza: it/LICENSE-GPL3.md
        - Architettura:
                  - it/architettura.md
                  - Database:
                            - Liquibase Setup & Workflow: it/liquibase-setup-workflow.md
                            - Linee Guida SQL: it/linee-guida-sql.md
                            - Linee Guida Trigger: it/linee-guida-trigger.md
                            - Db PostgresSQL:
                                      - Panoramica: it/postgresql/intro.md
                                      - Aggiornamento versione: it/postgresql/aggiornamento-versione-postgresql.md
                                      - Parametri personalizzati (GUC): it/postgresql/parametri-personalizzati-(GUC).md
                                      - Estensioni:
                                                - Utilizzate: it/postgresql/estensioni-utilizzate.md
                                                - dblink: it/postgresql/dblink.md
                                                - pgAgent: it/postgresql/pgAgent.md
