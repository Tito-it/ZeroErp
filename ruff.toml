# Doc: configurazione ruff
# Scopo: la PRIMA analisi statica del backend. Presidiata dall'hook pre-commit
#        `ruff-check`, che gira anche in CI (`ci-validate.yaml` lancia
#        `pre-commit run` sui file cambiati).
# ------------------------------------------------------------
#
# ⛔ PERCHE' LA SELEZIONE E' COSI' STRETTA, ed e' la decisione che conta.
#
# Misurato il 2026-09-09 su 258.000 righe di Python, prima che questo file
# esistesse:
#
#   --select F        ->    136 rilievi   (126 import morti)   ⇐ SCELTO
#   --select F,E9     ->    136 rilievi   (E9 = errori di sintassi: gratis)
#   --select E        ->  5.051 rilievi,  di cui 4.853 E501 (lunghezza riga)
#
# `E501` da solo vale il 96% del rumore, su un progetto che una lunghezza di
# riga dichiarata **non ce l'ha**. Un cancello che nasce con 4.853 righe di
# registro protegge solo cio' che avanza, e viene spento al secondo blocco
# inutile — e un presidio spento e' peggio di uno assente.
#
# ⭐ I 136 sono stati sanati PRIMA di accendere il cancello (129 con `--fix`,
#    7 `F841` a mano perche' ruff non poteva sapere se la chiamata contasse).
#    Questo cancello nasce quindi a **ZERO**, che e' la sola condizione in cui
#    un rosso significa davvero «hai introdotto tu un difetto».
#
# ⚠️ ALLARGARE LA SELEZIONE E' LEGITTIMO, ma si fa con la stessa disciplina:
#    prima si misura quante righe apre la regola nuova, poi si sana, poi si
#    accende. Mai il contrario.

# Fonte unica della versione: `.python-version` (3.14). Va tenuta allineata a
# mano: ruff non legge quel file.
target-version = "py314"

# ⚠️ Il default di ruff (88) qui non presidia niente, perche' `E501` non e'
#    selezionata. Resta dichiarata come intenzione per il giorno in cui il
#    progetto vorra' una lunghezza di riga.
line-length = 100

exclude = [
    ".git",
    ".tmp",
    "**/.venv",
    "**/node_modules",
    "site-zensical",
    # Migrazioni Django: generate, non scritte.
    "**/migrations",
    # Doc auto-generata e artefatti di build.
    "docs/it/dbzero",
]

[lint]
# F   = pyflakes — import morti, nomi non definiti, variabili inutilizzate,
#       ridefinizioni. Sono DIFETTI, non stile: nessuno di questi e' una
#       preferenza su cui si possa non essere d'accordo.
# E9  = errori di sintassi e di I/O. Costo zero, e un file che non si compila
#       deve fermare il commit.
#
# ⭐ ALLARGAMENTO DEL 2026-09-10, con la disciplina scritta qui sopra: misurato,
#    sanato, poi acceso. Ogni gruppo nasce a ZERO.
#
# T20 = nessun `print()` nel codice. ⭐ Era gia' a zero prima di accenderlo
#       (misurato: 0 rilievi su 940 file, controprova col grep): un cancello
#       che non chiede di sanare niente e chiude un'asimmetria — la regola
#       «nessun `console.log` in produzione» valeva per il solo frontend, e
#       quindi per meta' applicazione.
# C4  = costruzioni inutili di dict/list/set (`dict()` dove basta `{}`).
# A   = un argomento che ombreggia un builtin. ⚠️ Dove il nome e' imposto da
#       una firma altrui si marca `# noqa: A002` col perche' (un solo punto:
#       `fake_import`, che imita `builtins.__import__`).
# PIE = costruzioni ridondanti. ⭐ Fra queste `PIE794`, che ha trovato un
#       difetto vero: `stato_codice_interno` dichiarato DUE volte nello stesso
#       TypedDict (`OffertaRow`). In Python vince l'ultima e la prima e' morta,
#       senza errori e senza test rossi — la stessa specie della chiave i18n
#       duplicata che il progetto ha gia' pagato il 2026-08-26.
# G   = uso del logging (`logger.exception` dentro un `except`, non
#       `logger.error(..., exc_info=True)`).
# LOG = uso del logging, l'altra meta': `.exception()` FUORI da un except.
#
# ⭐ ALLARGAMENTO DEL 2026-09-28 — B = bugbear (brief
#    `brief-be-fe-sicurezza-header-token-mfa.md` §4). Rimandato il 2026-09-10
#    perche' chiedeva decisioni una per una, non una sostituzione; misurati il
#    2026-09-28 74 rilievi, sanati PRIMA di accendere:
#    - `B905` (50, `zip()` senza `strict=`): TUTTI `strict=True`. Nessuno
#      voleva la troncatura: 45 sono `dict(zip(colonne, riga))`, dove colonne
#      e valori hanno per costruzione la stessa lunghezza, gli altri coppie che
#      devono combaciare (cifre e pesi del codice fiscale, rate e metadati).
#      ⛔ La correzione automatica di ruff mette `strict=False`, cioe'
#      conserva il difetto: una `zip` nuova si scrive `strict=True`, e
#      `strict=False` solo dove la troncatura e' VOLUTA, col perche' accanto.
#    - `B023` (6, funzione nel ciclo che legge la variabile del ciclo): tutte
#      invocate subito, nessun difetto oggi; le variabili ora si LEGANO come
#      argomenti di default, cosi' restano giuste se un giorno la chiamata
#      viene rimandata (`commesse_service`, due test DB).
#    - `B007` (11, variabile del ciclo non usata): rinominate `_x`. Due erano
#      altro: in `test_ui_action_e_canale_campi` il sorgente «senza docstring»
#      era calcolato e mai letto (codice morto, tolto); in
#      `check_i18n_keys.py` le intestazioni rotte non dicevano DOVE, a
#      differenza delle altre due liste dello stesso script (corretto).
#    - `B904` (7, `raise` dentro `except` senza `from`): 3 punti veri
#      (utente non trovato, intero non valido) ora `from None`; 4 sono
#      `raise AssertionError("unreachable")` dopo `ErrorManager.raise_error`,
#      righe che non si eseguono mai, marcate `noqa: B904` sul punto. ⚠️ La
#      regola resta ACCESA: il 2026-09-10 era stata proposta da ignorare in
#      blocco, ma i rilievi di allora non erano quelli di oggi — tre erano
#      traduzioni d'errore vere.
#
# ⭐ ALLARGAMENTO DEL 2026-09-26 — S = regole di sicurezza (flake8-bandit, le
#    stesse di Bandit: niente dipendenza nuova). Misurate 883 rilievi, sanati
#    PRIMA di accendere, stessa disciplina:
#    - `S608` (SQL composto con stringhe): ogni punto guardato. Dove i pezzi
#      interpolati vengono da letterali o whitelist e i valori viaggiano come
#      parametri, `# noqa: S608 — <da dove arriva il pezzo>` sul punto. Il
#      motivo dice l'ORIGINE, non «sicuro»: e' cio' che il prossimo deve poter
#      ricontrollare.
#    - `S110`/`S112` (`except: pass`): ogni errore ingoiato e' stato ristretto
#      alla classe attesa, oppure ora si logga.
#    - `S701`: il render documentale girava con autoescape spento e i dati
#      utente nel context — era un difetto vero, chiuso in `render_service`.
#    - `S105`/`S106`: tutti falsi positivi (codici tipo token, messaggi con la
#      parola «password»), marcati sul punto.
#
# ⛔ `S101` (`assert`) e' SPENTA, ed e' una decisione, non una resa: circa 460
#    dei 575 `assert` applicativi restringono solo il tipo dopo un
#    `ErrorManager.require` o dopo una funzione SQL che ritorna sempre una riga
#    — 460 `noqa` sarebbero stati rumore. Il rischio della regola (con
#    `python -O` gli assert spariscono in silenzio) e' chiuso alla radice:
#    `settings.py` RIFIUTA l'avvio con gli assert disattivati.
#    ⚠️ Gli `assert` che proteggevano qualcosa (whitelist prima di scrivere
#    SQL, validazioni di input) sono stati convertiti in `raise` espliciti. Un
#    controllo si scrive `if ...: raise`, mai `assert`: S101 spenta non vuol
#    dire che l'assert sia diventato un controllo.
#
# RUF100 = `# noqa` che non serve piu' (la regola non scatta su quella riga, o
#          non e' accesa). ⭐ Accesa il 2026-09-26 a ZERO, dopo aver tolto 102
#          direttive morte: 61 `S608` messi sulla riga sbagliata o su SQL che
#          ruff non segnala, 41 su regole mai accese (BLE001, ARG, E731...).
#          Un `noqa` morto non e' innocuo: dice «qui c'e' un rischio
#          controllato» dove non c'e' niente, e il giorno che la riga cambia
#          nessuno sa piu' quale dei due fosse vero.
# ⚠️ Pulirli con `ruff --select RUF100 --fix` e' SBAGLIATO: con `--select` le
#    altre regole risultano spente, e ruff toglie TUTTI i `noqa` del repo
#    (427 il 2026-09-26, ripristinati). Si usa la configurazione intera
#    (`ruff check .`), e il motivo scritto dopo la direttiva va conservato.
# ⭐ DTZ = flake8-datetimez, ACCESA il 2026-10-09 a ZERO (brief
#    un-solo-fuso-aziendale B-9). Rifiuta `date.today()`, `datetime.now()`
#    senza fuso, `datetime(...)` e `strptime` senza fuso: sono il giorno o
#    l'ora del PROCESSO (`TIME_ZONE = 'UTC'`), che non e' il fuso dell'azienda.
#    L'«oggi» si chiede a `apps.core.services.fuso_aziendale.oggi_aziendale()`,
#    l'ora mostrata a `locale_formatters`. Sanati 64 rilievi PRIMA di accendere:
#    45 `date.today()` (quasi tutti test e smoke) -> `oggi_aziendale()`; le righe
#    finte del DB costruite naive -> `tzinfo=UTC`, come le consegna la
#    connessione; `noqa` col motivo sui naive costruiti apposta (i formattatori
#    che non devono convertire) e sulle tre `strptime` che leggono una DATA.
select = ["F", "E9", "T20", "C4", "A", "PIE", "G", "LOG", "S", "B", "DTZ", "RUF100"]
ignore = ["S101"]

[lint.per-file-ignores]
# Un import "inutilizzato" in `apps.py` o in `settings.py` e' spesso IL LAVORO:
# serve l'effetto collaterale della registrazione, non il nome. Dove capita si
# marca `# noqa: F401` sul punto — cosi' resta scritto che e' voluto — e non si
# spegne la regola per il file intero.
#
# ⭐ La sezione e' rimasta vuota fino al 2026-09-10, e la prima voce che entra
#    NON e' un'eccezione a quella disciplina: e' una classe di file in cui la
#    regola non si applica per NATURA.
#
# ⛔ In uno script da riga di comando `print()` E' l'interfaccia utente, non un
#    residuo di debug: e' il modo in cui lo script parla a chi lo ha lanciato.
#    Misurati il 2026-09-10: 352 `print` nel repo, TUTTI qui dentro (198 in
#    `scripts/`, 160 in `backend/scripts/`) e ZERO in `backend/apps/`, che e' il
#    codice servito da Django — cioe' il perimetro in cui un `print` e' davvero
#    un difetto (finisce sullo stdout di gunicorn invece che nel logger, senza
#    livello, senza `request_id`, e nessuno lo vede).
# ⚠️ Il `noqa` sul punto qui non e' una via: sarebbero 352 righe di rumore in
#    file dove la regola non ha nulla da dire.
#
# ⛔ Stesso ragionamento per `S603`/`S607` negli script: lanciare `git` o
#    `zensical` dal PATH con un argv fisso E' il lavoro dello script, e chi lo
#    lancia e' lo sviluppatore sulla sua macchina. Nel codice servito da Django
#    le due regole restano accese (l'unico `subprocess` di `backend/apps/` porta
#    gia' il suo `noqa` motivato).
"scripts/**" = ["T201", "T203", "S603", "S607"]
"backend/scripts/**" = ["T201", "T203", "S603", "S607"]
# Stessa natura: gli script allegati ai brief (collaudi da lanciare a mano con
# `manage-env.sh shell <`) parlano a chi li lancia con `print`. Solo T201/T203:
# non lanciano processi. Aggiunto il 2026-10-18
# (`work-done/allegati/collaudo-presidio-job-run-be.py`).
"docs/it/dev/*/allegati/*.py" = ["T201", "T203"]
#
# ⛔ Nei test le regole di sicurezza non si applicano per NATURA: `assert` e'
#    il linguaggio del test, le password sono finte per costruzione, e l'SQL
#    di preparazione e' composto da fixture. Misurati il 2026-09-26: 112 rilievi,
#    tutti di queste classi.
"**/tests/**" = ["S"]
"**/test_*.py" = ["S"]
"**/conftest.py" = ["S"]
[format]
# ⛔ Il formattatore NON e' acceso. Riformattare 258.000 righe in un colpo
#    renderebbe illeggibile ogni `git blame` del progetto, e non e' una
#    decisione che si prende di straforo dentro un file di configurazione.
#    Se un giorno si vorra': va fatto in un commit suo, dichiarato, e aggiunto
#    a `.git-blame-ignore-revs`.
quote-style = "preserve"
