name: CI

on: 
  push:
    branches: [ Tito-dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 17 con PostGIS 3.5 già preinstallato
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: zeroerp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeroerp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt


      - name: Install Liquibase CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip wget

          LIQUIBASE_VERSION=4.31.0
          wget https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -O liquibase.zip
          unzip -q liquibase.zip -d liquibase-temp

          sudo mkdir -p /opt/liquibase
          sudo mv liquibase-temp/* /opt/liquibase/
          rm -rf liquibase-temp liquibase.zip

          # Assicurati che lo script sia eseguibile
          sudo chmod +x /opt/liquibase/liquibase

          # Aggiorna il PATH **anche** per questo step
          export PATH=/opt/liquibase:$PATH

          # Ora funziona
          liquibase --version


      - name: Run pre-commit hooks
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Applica migrazioni Liquibase
        run: |
          source .venv/bin/activate
          liquibase \
            --url=jdbc:postgresql://localhost:5432/zeroerp \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master.yaml \
            update 
          
      - name: Genera doc DB
        # Qui sopra non serve più caricare i tuoi secrets, ma usiamo quelli del servizio
        env:
          DATABASE_DSN: "host=localhost port=5432 dbname=zeroerp user=zeroerp password=secret"
  
        run: |
          # Ora chiamiamo lo script: legge DB_HOST, DB_PORT, ecc. dall'env
          source .venv/bin/activate
          python scripts/gen_db_docs.py
       
      
      - name: Build MkDocs site
        run: |
          source .venv/bin/activate
          mkdocs build --strict

# Nuovo job per Docker
  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t zeroerp:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        # Usa Trivy (va installato via apt o GitHub Action specifica)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v0.45.0/trivy_0.45.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.45.0_Linux-64bit.deb
          trivy image zeroerp:${{ github.sha }}

      - name: Run container and smoke-test
        run: |
          # Avvia il container in background
          docker run --rm -d --name zeroerp_test -p 8000:8000 zeroerp:${{ github.sha }}
          # Attendi che l’app sia pronta
          for i in {1..10}; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed"
                break
              fi
              sleep 3
            done

      - name: Push to Docker Hub (solo su main)
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
          docker tag zeroerp:${{ github.sha }} your-dockerhub-user/zeroerp:latest
          docker push your-dockerhub-user/zeroerp:latest