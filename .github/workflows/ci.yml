name: CI

on:
  push:
    branches: [Tito-dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 17 con PostGIS 3.5 già preinstallato
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: zeroerp
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeroerp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    #  pgagent:
    #    image: chiavegatto/postgres-pgagent:latest

    #    env:
    #      PGAGENT_HOST: postgres
    #      PGAGENT_PORT: 5432
    #      PGAGENT_DATABASE: zeroerp
    #      PGAGENT_USER: zeroerp
    #      PGAGENT_PASSWORD: secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show MkDocs version
        run: |
          source .venv/bin/activate
          mkdocs --version
          pip list | grep mkdocs

      - name: Set custom GUCs for CI role
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD || 'secret' }}
        run: |
          psql --no-psqlrc -h localhost -p 5432 -U zeroerp -d zeroerp -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE zeroerp SET myapp.user_language = 'it';"
          psql --no-psqlrc -h localhost -p 5432 -U zeroerp -d zeroerp -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE zeroerp SET myapp.dblink_log_connection = 'hostaddr=127.0.0.1 port=5432 dbname=zeroerp user=zeroerp password=${PGPASSWORD}';"
           psql --no-psqlrc -h localhost -p 5432 -U zeroerp -d zeroerp -v ON_ERROR_STOP=1 -c \
             "SELECT name, setting FROM pg_settings WHERE name LIKE 'myapp.%' ORDER BY name;"

      - name: Install Liquibase CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip wget

          LIQUIBASE_VERSION=4.33.0
          wget https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -O liquibase.zip
          unzip -q liquibase.zip -d liquibase-temp

          sudo mkdir -p /opt/liquibase
          sudo mv liquibase-temp/* /opt/liquibase/
          rm -rf liquibase-temp liquibase.zip

          # Assicurati che lo script sia eseguibile
          sudo chmod +x /opt/liquibase/liquibase

          # Aggiorna il PATH **anche** per questo step
          export PATH=/opt/liquibase:$PATH

          # Ora funziona
          liquibase --version

      - name: Run pre-commit hooks
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Applica migrazioni Liquibase
        run: |
          source .venv/bin/activate

          # Se liquibase è installato in /opt/liquibase, aggiungilo al PATH
          export PATH=/opt/liquibase:$PATH

          # Attenzione imposto la disattivazione del dblink
          # 1) Migrazioni standard (no test, no CI)
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master.yaml \
            update --contexts="!test"
        # Attenzione si può usare solo una negazione context (non una lista di context negati)

        # 2) CI apply (runner di automazione)
      - name: Liquibase CI apply (run automations)
        run: |
          export PATH=/opt/liquibase:$PATH
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff%20-c%20app.env%3Dci" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master.yaml \
            update --contexts=ci_apply

        # attendiamo che pgAgent legga le nuove definizioni e lanci il job di test
      #- name: Wait for pgAgent to schedule jobs
      #  run: sleep 15

      #- name: Verify pgAgent test log
      #  env:
      #    PGPASSWORD: secret
      #  run: |
      #      psql -h localhost -p 5432 \
      #        -U zeroerp \
      #        -d zeroerp \
      #        -c "SELECT * FROM maintenance.test_pgagent_log ORDER BY id DESC LIMIT 1;"

      - name: Genera doc DB
        # Qui sopra non serve più caricare i tuoi secrets, ma usiamo quelli del servizio
        env:
          DATABASE_DSN: "host=localhost port=5432 dbname=zeroerp user=zeroerp password=secret"

        run: |
          # Ora chiamiamo lo script: legge DB_HOST, DB_PORT, ecc. dall'env
          source .venv/bin/activate
          python scripts/gen_db_docs.py

      # Inserisce la firma nei documenti Markdown
      - name: Applica signature ai documenti
        run: |
          source .venv/bin/activate
          python scripts/apply_signatures.py

      - name: Build MkDocs site
        run: |
          source .venv/bin/activate
          mkdocs build --strict

      - name: Upload generated site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  # Nuovo job per Docker
  docker:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t zeroerp:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        # Usa Trivy (va installato via apt o GitHub Action specifica)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/download/v0.45.0/trivy_0.45.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.45.0_Linux-64bit.deb
          trivy image zeroerp:${{ github.sha }}

      - name: Run container and smoke-test
        run: |
          # Avvia il container in background
          docker run --rm -d --name zeroerp_test -p 8000:8000 zeroerp:${{ github.sha }}
          # Attendi che l’app sia pronta
          for i in {1..10}; do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed"
                break
              fi
              sleep 3
            done

      - name: Push to Docker Hub (solo su main)
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
          docker tag zeroerp:${{ github.sha }} your-dockerhub-user/zeroerp:latest
          docker push your-dockerhub-user/zeroerp:latest

  publish-docs:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download generated site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      #- name: Checkout repository
      #  uses: actions/checkout@v4

      #- name: Set up Python
      #  uses: actions/setup-python@v4
      #  with:
      #    python-version: '3.x'

      #- name: Install MkDocs e tema Material
      #  run: |
      #   python -m pip install --upgrade pip
      #  pip install mkdocs mkdocs-material \
      #               mkdocs-include-markdown-plugin \
      #               mkdocs-static-i18n

      #- name: Ricostruisci sito MkDocs
      #  run: mkdocs build --strict

      # ----------------------------
      # Pubblica su GitHub Pages
      # ----------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          # il repo di destinazione (case-sensitive)
          external_repository: Tito-it/ZeroERP-Docs
          publish_branch: gh-pages
          publish_dir:
            ./site
            # opzionali:
            # user_name: GitHub Actions
          # user_name: GitHub Actions
          # user_email: actions@github.com

      # eventualmente mantieni anche l’S3 sync se ti serve
      - name: Configura credenziali AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Sincronizza su S3
        run: aws s3 sync site/ s3://zeroerp-docs-tid/ --delete
