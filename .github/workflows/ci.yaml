name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - db/** # migrazioni Liquibase
      - backend/** # Django backend
      - requirements.txt
      - backend/requirements.in
      - backend/requirements.txt
      - Dockerfile
      - .dockerignore
      - .github/workflows/ci.yaml
      - docs/**
      - mkdocs.yml
      - scripts/**
  workflow_dispatch: {} # esecuzione manuale su qualsiasi branch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # permette a peaceiris di pushare su gh-pages

    services:
      postgres:
        # Postgres 18 con PostGIS 3.6 già preinstallato
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    
    env:
      # ⚠️ Presidio percorsi (aggiunto 02-09-2026, Liquibase 5.0.4). Anticipa il
      #   default che una major futura adottera'. PERIMETRO MISURATO, non
      #   dedotto dalla documentazione: fallisce — ValidationFailedException,
      #   exit 1, con nome del file e del changeSet — sui percorsi con `..`
      #   risolti sulla RADICE del search path che da essa ESCONO.
      #   ⛔ RAMO CIECO: i percorsi con `relativeToChangelogFile: true` NON
      #   sono coperti dal flag, provato sia da argomento CLI sia da env. E'
      #   la forma dei 192 seed di `80_data`, che infatti passano identici col
      #   flag attivo (`calculate-checksum` = valore nel databasechangelog).
      #   Quindi: impedisce che nasca la PRIMA forma, non copre la seconda.
      LIQUIBASE_ALLOW_PARENT_DIRECTORY_REFERENCES: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip wheel
          python -m pip install -r requirements.txt
          

      - name: Set custom GUCs for CI role
        env:
          PGPASSWORD: postgres
        run: |
          # ⭐ I RUOLI DI SISTEMA (brief-db-ruoli-di-sistema, fase 2). Li crea lo
          #   stesso script dello scratch e di un'installazione:
          #   scripts/sql/provision_zeroerp.sql, fase `ruoli` — zeroerp_owner
          #   (proprietario di tutto e migratore), zeroerp_job (pgAgent: solo le
          #   procedure dei job), zeroerp_app (il backend) — e il database
          #   `zeroerp`, che il container crea di `postgres`, passa a zeroerp_owner.
          #   Le password sono letterali, come prima: il database vive dentro il
          #   runner per la durata del job (D-3).
          #   ⚠️ zeroerp_owner e' NOCREATEDB: il vecchio `zeroerp` aveva CREATEDB, ma
          #   nessuno lo usa — i test Django girano sul database configurato
          #   (backend/zeroerp_backend/test_runner.py), non ne creano uno.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v fase=ruoli -v db_name=zeroerp \
            -v owner_password=secret-owner -v job_password=secret-job -v app_password=secret-app \
            -v log_password=secret-log \
            -f scripts/sql/provision_zeroerp.sql
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE zeroerp_owner IN DATABASE zeroerp SET myapp.user_language = 'it';"
          # ⛔ CORRETTO il 2026-09-05. La riga precedente diceva
          #   `user=zeroerp password=postgres`: la password di `zeroerp` in
          #   questo workflow e' `secret` (riga sopra), quindi quel DSN non si
          #   sarebbe autenticato. Non se n'e' accorto nessuno perche' in CI non
          #   gira nessun job e il canale non viene mai aperto — una riga che
          #   sembrava configurare un canale e configurava un errore.
          # ⚠️ L'utente giusto e' `zeroerp_log`: privilegi minimi (scrive il
          #   giornale, non lo legge), ed e' quello che i GRANT di
          #   `90_end/20260905-38` si aspettano.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE zeroerp_owner IN DATABASE zeroerp SET myapp.dblink_log_connection = 'hostaddr=127.0.0.1 port=5432 dbname=zeroerp user=zeroerp_log password=secret-log';"
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
             "SELECT name, setting FROM pg_settings WHERE name LIKE 'myapp.%' ORDER BY name;"



 # Dicembre 2025 passaggio a Liquibase 5 Community
   # Versione Liquibase 5 (Community)       
      - name: Setup Liquibase 5 (oss)
        uses: liquibase/setup-liquibase@v3.0.0
        with:
          version: '5.0.4'
          edition: 'oss'

   # Istalla il driver PostgreSQL       
      - name: Install PostgreSQL driver for Liquibase 5
        run: |
          # Driver PostgreSQL da Maven Central (NIENTE LPM): evita il fallimento
          # "Checksum validation failed" del package manager LPM. Liquibase carica
          # automaticamente i .jar in LIQUIBASE_HOME/lib. 42.7.x è compatibile con PG 18.
          LB_HOME="${LIQUIBASE_HOME:-$(dirname "$(readlink -f "$(command -v liquibase)")")}"
          mkdir -p "$LB_HOME/lib"
          curl -fsSL -o "$LB_HOME/lib/postgresql.jar" \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          liquibase --version
 # Dicembre 2025 fine passaggio a Liquibase 5 Community
      

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    
          
      - name: Run pre-commit hooks
        run: |
          
          pre-commit run --all-files

     # Generate Liquibase changelog autogen (strict mode) ordered by timeline     
      - name: Generate Liquibase autogen master (timeline)
        run: |
          python scripts/gen_master_autogen.py \
            --root db/changelog/migrations_v2 \
            --out  db/changelog/migrations_v2/changelog-autogen.yaml \
            --strict


      - name: Liquibase admin (provision - pre)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.env%3Dci" \
            --username=postgres \
            --password=postgres \
            --changeLogFile=db/changelog/changelog-provision-pre.yaml \
            update --contexts=provision

      - name: Proprieta' a zeroerp_owner (provision_zeroerp.sql, fase pre)
        env:
          PGPASSWORD: postgres
        # ⭐ Al posto dei GRANT di raccordo (CREATE su public, DML sulle tabelle di
        #   Liquibase, pg_maintain): cio' che il provision-pre ha creato da superuser
        #   (tabelle di Liquibase, schema `internal`) passa a zeroerp_owner, che da
        #   proprietario non ha bisogno d'altro — nemmeno di pg_maintain per il job
        #   delle statistiche. Brief: brief-db-ruoli-di-sistema, fase 2.
        run: |
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -v fase=pre -f scripts/sql/provision_zeroerp.sql

      - name: Applica migrazioni Liquibase
        run: |
          

          # 1) Migrazioni standard (no test, no provision)
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff" \
            --username=zeroerp_owner \
            --password=secret-owner \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts="!provision and !dati_macchina"

      - name: Liquibase admin (provision - post)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.env%3Dci" \
            --username=postgres \
            --password=postgres \
            --changeLogFile=db/changelog/changelog-provision-post.yaml \
            update --contexts=provision
    
      
      - name: Liquibase CI apply (run automations - ci_apply)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff%20-c%20myapp.env%3Dci" \
            --username=zeroerp_owner \
            --password=secret-owner \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts=ci_apply
      
      # ⭐ La fase post del modello: EXECUTE di zeroerp_job sulle procedure dei
      #   job, la proprieta' ripassata e la VERIFICA «un owner solo» — se un
      #   oggetto del progetto non e' di zeroerp_owner (fuori dal registro
      #   dbops.sec_functions_owner) la build si ferma e lo nomina.
      - name: Ruoli di sistema - fase post e verifica «un owner solo»
        env:
          PGPASSWORD: postgres
        run: |
          # ⭐ L'ambiente della CI e' SVILUPPO (brief-db-processi-accensione-per-ambiente,
          #   R-2): si dichiara qui, una volta, e non cambia.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -v fase=post -v ambiente=SVILUPPO -f scripts/sql/provision_zeroerp.sql

      - name: Genera doc DB
        # Qui sopra non serve più caricare i tuoi secrets, ma usiamo quelli del servizio
        #  Attenzione la documentazione DB usa un env specifico per CI 
        env:
          DATABASE_DSN: "host=localhost port=5432 dbname=zeroerp user=zeroerp_owner password=secret-owner"
          DB_DOCS_MODE: "ci"

        run: |
          # Ora chiamiamo lo script: legge DB_HOST, DB_PORT, ecc. dall'env
          
          echo "DB_DOCS_MODE=$DB_DOCS_MODE"
          DB_DOCS_MODE=ci python scripts/gen_db_docs.py
          head -n 20 docs/it/dbzero/maintenance/funzioni/fn_run_and_log.md


      # Inserisce la firma nei documenti Markdown
      - name: Applica signature ai documenti
        run: |
          
          python scripts/apply_signatures.py
      
      - name: Build docs site (Zensical)
        run: |
          python scripts/build_docs_zensical.py

      - name: Deploy to GitHub Pages (no artifacts)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: Tito-it/ZeroErp-docs
          publish_branch: gh-pages
          publish_dir: ./site-zensical
          enable_jekyll: false
          # Ogni deploy sostituisce il sito con un commit solo: il repo e'
          # pubblico, e una pagina pubblicata per sbaglio non resta nella storia.
          force_orphan: true


      
  docker:
        needs: build
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write   # necessario per push su GHCR

        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: zeroerp

        steps:
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Read Python version from .python-version
            id: pyver
            run: echo "version=$(cut -d. -f1-2 .python-version)" >> $GITHUB_OUTPUT

          - name: Normalize image namespace
            id: imgvars
            run: |
              echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4

          - name: Login to GHCR
            uses: docker/login-action@v4
            with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          # -------------------------
          # Build per branch/PR (NO push)
          # -------------------------
          - name: Build Docker image (local, cached)
            if: github.ref != 'refs/heads/main'
            uses: docker/build-push-action@v7
            with:
              context: .
              file: ./Dockerfile
              build-args: |
                PYTHON_VERSION=${{ steps.pyver.outputs.version }}
              tags: |
                zeroerp:${{ github.sha }}
              load: true
              push: false
              cache-from: type=gha
              cache-to: type=gha,mode=max

          # -------------------------
          # Build&Push su main (GHCR)
          # -------------------------
          - name: Build and push Docker image (cached)
            if: github.ref == 'refs/heads/main'
            uses: docker/build-push-action@v7
            with:
              context: .
              file: ./Dockerfile
              build-args: |
                PYTHON_VERSION=${{ steps.pyver.outputs.version }}
              tags: |
                ${{ env.REGISTRY }}/${{ steps.imgvars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                ${{ env.REGISTRY }}/${{ steps.imgvars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:latest
              # Il pacchetto GHCR si collega al repo di `image.source`: dal
              # contesto, non scritto a mano, cosi' segue il repo in cui gira.
              labels: |
                org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                org.opencontainers.image.revision=${{ github.sha }}
              push: true
              cache-from: type=gha
              cache-to: type=gha,mode=max

          # -------------------------
          # Trivy scan da TAR (stabile)
          # -------------------------
          - name: Prepare image tar for Trivy
            run: |
              set -euo pipefail

              # Se l'immagine locale esiste (branch/PR), ok.
              # Su main, l'immagine non è loadata: la pulliamo da GHCR.
              if ! docker image inspect zeroerp:${{ github.sha }} >/dev/null 2>&1; then
                docker pull ${{ env.REGISTRY }}/${{ steps.imgvars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                docker tag  ${{ env.REGISTRY }}/${{ steps.imgvars.outputs.owner_lc }}/${{ env.IMAGE_NAME }}:${{ github.sha }} zeroerp:${{ github.sha }}
              fi

              docker save zeroerp:${{ github.sha }} -o image.tar

          - name: Scan image for vulnerabilities (Trivy)
            uses: aquasecurity/trivy-action@0.35.0
            with:
              input: image.tar
              version: v0.69.3
              format: table
              exit-code: 1
              ignore-unfixed: true
              severity: HIGH,CRITICAL

          # -------------------------
          # Smoke test
          # -------------------------
          - name: Run container and smoke-test
            env:
              # Chiave Fernet dei campi cifrati; obbligatoria (settings.py). E'
              # la base64 di «ci-placeholder-fernet-key-32byte»: un segnaposto
              # leggibile, non un segreto. Stesso valore di ci-validate.yaml.
              DJANGO_FIELD_ENCRYPTION_KEYS: "Y2ktcGxhY2Vob2xkZXItZmVybmV0LWtleS0zMmJ5dGU="  # gitleaks:allow
            run: |
              set -euo pipefail

              # Avvia SENZA --rm così possiamo leggere i log se crasha
              docker run -d --name zeroerp_test -p 8000:8000 \
                -e DJANGO_SECRET_KEY=ci-smoke-secret \
                -e DJANGO_FIELD_ENCRYPTION_KEYS \
                -e DJANGO_SECURE_HSTS_SECONDS=0 \
                -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
                -e DJANGO_TRUSTED_PROXY_COUNT=0 \
                -e FRONTEND_URL=https://localhost \
                -e DB_NAME=zeroerp \
                -e DB_USER=zeroerp \
                -e DB_PASSWORD=secret \
                -e DB_HOST=127.0.0.1 \
                -e DB_PORT=5432 \
                zeroerp:${{ github.sha }}

              # Se il container muore subito, stampiamo log e falliamo
              if ! docker ps --filter "name=^/zeroerp_test$" --format '{{.Names}}' | grep -q zeroerp_test; then
                echo "Container exited immediately."
                docker ps -a
                docker logs zeroerp_test || true
                docker rm -f zeroerp_test || true
                exit 1
              fi

              ok=0
              for i in {1..10}; do
                # se nel frattempo è morto, stampa log e fallisci
                if ! docker ps --filter "name=^/zeroerp_test$" --format '{{.Names}}' | grep -q zeroerp_test; then
                  echo "Container exited before becoming healthy."
                  docker ps -a
                  docker logs zeroerp_test || true
                  docker rm -f zeroerp_test || true
                  exit 1
                fi

                if curl -sf http://localhost:8000/health >/dev/null; then
                  echo "Health check passed"
                  ok=1
                  break
                fi
                sleep 3
              done

              if [ "$ok" -ne 1 ]; then
                echo "Health check failed"
                docker ps -a
                docker logs zeroerp_test || true
                docker rm -f zeroerp_test || true
                exit 1
              fi

              docker rm -f zeroerp_test

           #  Promemoria comando per scaricare l'immagine localmente (dopo push su main):
            #  docker pull ghcr.io/<tuo_owner>/zeroerp:latest
