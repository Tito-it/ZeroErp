name: CI-Validate

on:
  push:
    branches: [Tito-dev]
    paths:
      - db/**
      - zeroerp/zeroerp_backend/**
      - zeroerp/requirements/**
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: zeroerp
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zeroerp"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: venv + pip
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install Java & Liquibase
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre unzip wget
          LIQUIBASE_VERSION=4.33.0
          wget -q https://github.com/liquibase/liquibase/releases/download/v${LIQUIBASE_VERSION}/liquibase-${LIQUIBASE_VERSION}.zip -O liquibase.zip
          unzip -q liquibase.zip -d liquibase-temp
          sudo mkdir -p /opt/liquibase && sudo mv liquibase-temp/* /opt/liquibase/
          rm -rf liquibase-temp liquibase.zip
          sudo chmod +x /opt/liquibase/liquibase
          echo "/opt/liquibase" >> $GITHUB_PATH

      - name: Liquibase update (DB effimero del job)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20app.env%3Dci" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts="!test"

      - name: Install base requirements (backend)
        run: |
          source .venv/bin/activate
          pip install -r  requirements/base.txt

      - name: Django migrate (schema django, DB effimero)
        working-directory: ./zeroerp/zeroerp_backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: zeroerp
          DB_USER: zeroerp
          DB_PASSWORD: secret
          DJANGO_SECRET_KEY: ci-placeholder
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
          DJANGO_DEBUG: "0"
        run: |
          source ../../.venv/bin/activate
          python manage.py migrate --noinput
