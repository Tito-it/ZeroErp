name: CI-Validate

on:
  push:
    branches: [Tito-dev]
    paths:
      - db/**
      - backend/**
      - requirements/**
      - scripts/**
      - .github/workflows/ci-validate.yaml
  pull_request:
    branches: [Tito-dev, main]
    paths:
      - db/**
      - backend/**
      - requirements/**
      - scripts/**
      - .github/workflows/ci-validate.yaml

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d zeroerp"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      # requirements runtime backend
      REQ_FILE: backbase.txt

      # Django / DB
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: zeroerp
      DB_USER: zeroerp
      DB_PASSWORD: secret
      DJANGO_SECRET_KEY: ci-placeholder
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "0"
      CACHE_BACKEND: locmem

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history per pre-commit --from-ref/--to-ref

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.in
      # venv backend locale per gestire manage.py e deps
      - name: venv + pip (backend/.venv)
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel

      - name: Install backend requirements
        run: |
          source backend/.venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref ${{ github.event.pull_request.base.sha }} \
                           --to-ref ${{ github.sha }}
          else
            pre-commit run --from-ref ${{ github.event.before }} \
                           --to-ref ${{ github.sha }}
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Liquibase 5 (oss)
        uses: liquibase/setup-liquibase@v2.1.1
        with:
          version: '5.0.3'
          edition: 'oss'

      - name: Install PostgreSQL driver for Liquibase 5
        run: |
          # Driver PostgreSQL da Maven Central (NIENTE LPM): evita il fallimento
          # "Checksum validation failed" del package manager LPM. Liquibase carica
          # automaticamente i .jar in LIQUIBASE_HOME/lib. 42.7.x è compatibile con PG 18.
          LB_HOME="${LIQUIBASE_HOME:-$(dirname "$(readlink -f "$(command -v liquibase)")")}"
          mkdir -p "$LB_HOME/lib"
          curl -fsSL -o "$LB_HOME/lib/postgresql.jar" \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          liquibase --version

      - name: Generate Liquibase autogen master (timeline)
        run: |
          python scripts/gen_master_autogen.py \
            --root db/changelog/migrations_v2 \
            --out  db/changelog/migrations_v2/changelog-autogen.yaml \
            --strict

      - name: DB bootstrap (roles + grants)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE zeroerp LOGIN CREATEDB PASSWORD 'secret';"
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "GRANT USAGE, CREATE ON SCHEMA public TO zeroerp; GRANT CREATE ON DATABASE zeroerp TO zeroerp;"

      - name: Installa plpgsql_check nel container Postgres
        # Serve al guardrail «riferimenti morti» in fondo a questo workflow.
        # Il changeSet che crea l'estensione (20260804-36) e' CONDIZIONALE su
        # pg_available_extensions: se il pacchetto non c'e' viene saltato senza
        # essere marcato eseguito, quindi si riprende da solo appena c'e'. Per
        # questo il passo va PRIMA del giro provision.
        #
        # ⚠️ Si installa nel container del service, non sul runner: postgres
        # gira li' dentro e le estensioni le carica dal SUO filesystem.
        # L'immagine postgis/postgis:18-3.6 ha gia' il repo PGDG configurato
        # (ci prende postgis), quindi basta un apt-get.
        #
        # Se un giorno questo passo diventasse lento o fragile, l'alternativa
        # e' un'immagine custom costruita a monte: piu' pulita, ma vuole un
        # registry e un job di build: sproporzionata per un pacchetto solo.
        run: |
          set -euo pipefail
          CID="$(docker ps --filter 'ancestor=postgis/postgis:18-3.6' --format '{{.ID}}' | head -1)"
          if [ -z "$CID" ]; then
            echo "::error::container del service postgres non trovato"
            exit 1
          fi
          docker exec "$CID" bash -euo pipefail -c \
            "apt-get update -qq && apt-get install -y -qq postgresql-18-plpgsql-check"
          # Verifica che postgres lo veda davvero: senza, il changeSet -36
          # verrebbe saltato e il guardrail fallirebbe piu' tardi con un
          # messaggio meno chiaro di questo.
          docker exec "$CID" psql -U postgres -d zeroerp -tAc \
            "SELECT count(*) FROM pg_available_extensions WHERE name='plpgsql_check';" \
            | grep -qx 1

      - name: Liquibase admin (provision - pre)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.env%3Dci" \
            --username=postgres \
            --password="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --changeLogFile=db/changelog/changelog-provision-pre.yaml \
            update --contexts=provision

      - name: Grant Liquibase tables to zeroerp
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.databasechangelog TO zeroerp; \
             GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public.databasechangeloglock TO zeroerp;"

      - name: Liquibase update (standard, no provision)
        # NIENTE bypass_tx_id_check qui, ed e' voluto: questo step deve esercitare
        # davvero la validazione del tx_id, non spegnerla. Senza canale di log
        # fn_get_or_create_session_tx_id ritorna la sentinella uuid_nil SENZA
        # pubblicare la GUC, quindi il trigger trgfn_tx_id_managed non ha nulla da
        # rifiutare (migration 20260722-10/-11, brief-db-coerenza-tx-id-non-registrato.md).
        # Se un giorno questo step tornasse a fallire con W_TXID_NOT_REGISTERED,
        # la risposta NON e' rimettere il bypass: significa che qualcuno ha
        # ricominciato a pubblicare un tx_id non registrato.
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts="!provision"

      - name: Liquibase admin (provision - post)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.env%3Dci" \
            --username=postgres \
            --password="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --changeLogFile=db/changelog/changelog-provision-post.yaml \
            update --contexts=provision

      - name: Liquibase CI apply (run automations)
        # Come lo step "standard, no provision": nessun bypass, la validazione
        # del tx_id resta attiva.
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff%20-c%20myapp.env%3Dci" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts=ci_apply

      - name: Guardrail naming codice_interno/codice (definizioni live)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # Fallisce se una vista/funzione espone codice_interno con alias *_codice
          # (o la chiave jsonb speculare). Vedi linee-guida-sql §6c e
          # brief-naming-stato-codice-interno.md. RAISE -> exit !=0 con ON_ERROR_STOP.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -f scripts/sql/check_naming_stato_codice.sql

      - name: Guardrail codice errore strutturato (canale CONSTRAINT + convenzione codici)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # Presidia il contratto introdotto da 20260805-05: «SQLSTATE P0001 +
          # campo CONSTRAINT valorizzato = errore di dominio». Su quella
          # condizione il backend decide 409/404/403/400 e quale messaggio
          # legge l'operatore.
          #
          # (A) un solo mittente sul canale: solo script.fn_log_and_raise_error
          #     puo' scrivere CONSTRAINT in un RAISE. P0001 e' anche il default
          #     di qualunque RAISE EXCEPTION scritto a mano, e nel DB ce ne
          #     sono 135 in 46 funzioni: se uno di quelli usasse lo stesso
          #     campo per dire altro, il backend non fallirebbe — risponderebbe
          #     sbagliato, che e' peggio.
          # (B) il rubinetto sulla convenzione E_{MODULO}_{TIPO}: un codice
          #     senza prefisso E_ arriva al backend, non trova policy e cade su
          #     E_GENERICO -> HTTP 500. I 57 ereditati stanno nel registro
          #     dbops.messaggi_errore_codici_legacy; il 58esimo no.
          # (C) e il registro deve CALARE: una voce che non corrisponde piu' a
          #     nessun codice a seed va tolta.
          #
          # ⚠️ POSIZIONE: qui va bene prima del migrate di Django, al contrario
          # del guardrail dei riferimenti morti. Quello compila i corpi plpgsql
          # e ha bisogno dello schema `django`; questo legge solo pg_proc,
          # config.messaggi_errore e il registro, che Liquibase ha gia' messo.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -f scripts/sql/guardrail_codice_errore_strutturato.sql

      - name: Django check
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py check

      - name: Django migrate (schema django)
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py migrate contenttypes --noinput
          python manage.py migrate auth --noinput
          python manage.py migrate token_blacklist --fake
          python manage.py migrate --noinput

      - name: Guardrail riferimenti morti (funzioni plpgsql + dati di config)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # Compila con plpgsql_check ogni funzione plpgsql non-estensione e
          # fallisce se trova un riferimento che non si risolve (tabella o
          # colonna inesistente, variabile speciale sbagliata, ramo senza
          # RETURN) fuori dal registro del debito dbops.riferimenti_morti_esenzioni.
          #
          # ⚠️ PostgreSQL non ri-valida i corpi plpgsql quando si droppa o si
          # rinomina qualcosa: una funzione puo' restare rotta per mesi senza
          # che niente protesti, e si scopre quando qualcuno la esegue. Il
          # 2026-08-04 ce n'erano 34, la piu' vecchia rotta da undici mesi, e
          # una era l'autocomplete vie del backend.
          # Vedi brief-db-bonifica-riferimenti-morti.md.
          #
          # Fallisce anche se una voce del registro non serve piu': il debito
          # deve calare, non solo non crescere.
          #
          # ⚠️ POSIZIONE: DOPO il migrate di Django, e non e' un dettaglio.
          # Una decina di funzioni del DB leggono `django.auth_user` — lo
          # schema `django` lo crea `manage.py migrate`, non Liquibase.
          # Messo prima, il guardrail misurava un database a meta' e
          # segnalava dieci falsi difetti «relation django.auth_user does not
          # exist» (visto in CI il 2026-08-04). Il DB e' completo solo quando
          # entrambi i migratori hanno finito: e' li' che ha senso compilarne
          # i corpi.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -f scripts/sql/guardrail_riferimenti_morti.sql

      - name: Django tests
        working-directory: ./backend
        env:
          DJANGO_REQUEST_LOG_ENABLED: "0"
          # Allineato a manage-test.sh: neutralizza SearchBurstRateThrottle
          # (default 30/min). La LocMemCache non viene resettata tra
          # SimpleTestCase e il counter persiste tra test ravvicinati sugli
          # endpoint is_search_endpoint=True -> 429 falsi positivi.
          DJANGO_API_SEARCH_THROTTLE_RATE: "100000/min"
          # Gate deprecation Django 7.0: escala a errore i RemovedInDjango70Warning
          # emessi durante i test, cosi' un uso deprecato fa fallire il test che
          # lo tocca invece di scoprirli tutti al salto 6.x -> 7.0. Oggi la suite
          # ne emette 0: guard anti-regressione, non una bonifica. Il filtro e'
          # in settings.py (NON via PYTHONWARNINGS: la classe Django non e'
          # risolvibile all'avvio dell'interprete). Solo questa classe viene
          # escalata: le deprecation di terze parti (es. _UnionGenericAlias da
          # drf_spectacular) restano warning.
          DJANGO_DEPRECATION_GATE: "1"
          # Accende i 3 test end-to-end di apps/core/tests/services/test_db_error_fields:
          # RAISE nel DB -> psycopg -> django.db.DatabaseError -> ApiError -> HTTP status.
          # Sono l'UNICO punto che verifica la GIUNTURA fra le due meta' del
          # contratto del codice errore strutturato (20260805-05): che
          # `diag.constraint_name` sopravviva davvero al giro libpq/psycopg. I
          # pgTAP coprono il lato DB, i test unitari col diag finto coprono il
          # lato Python, ma nessuno dei due vede il pezzo in mezzo. Spenti di
          # default perche' richiedono un DB raggiungibile; qui c'e', ed e' stato
          # appena provvisto da Liquibase + manage.py migrate.
          #
          # ⚠️ PERCHE' FUNZIONANO, e quando smetteranno. Django crea il database
          # di test usa-e-getta SOLO se almeno un test dichiara di averne bisogno
          # (`django.test.TestCase` / `TransactionTestCase` / `databases = [...]`).
          # In questa suite NESSUNO lo fa — 114 `unittest.TestCase` e 86
          # `SimpleTestCase`, per la regola «i test devono girare senza DB reale»
          # di AGENTS.md — quindi il runner stampa «Skipping setup of unused
          # database(s)» e la connessione resta quella configurata, cioe' il DB
          # completo di schema Liquibase. Il giorno in cui un test dichiarera' un
          # database, il runner ne creera' uno vuoto per TUTTA la suite: li'
          # `script.fn_log_and_raise_error` non esiste e questi tre falliranno in
          # una PR che non c'entra niente. E' una dipendenza implicita, scritta
          # anche in .codex/AGENTS.md §Regole test Django.
          ZEROERP_TEST_DB_E2E: "1"
        run: |
          source .venv/bin/activate
          python manage.py test

  # Validazione artefatti di deploy dei worker (systemd timer). Job leggero e
  # indipendente: NON esegue i timer (la CI non è un host di runtime), ne
  # garantisce la VALIDITÀ prima che raggiungano un host. Vedi
  # brief-deploy-worker-riproducibilita-ci.md §3.
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint script bash (bash -n + shellcheck)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
          rc=0
          for f in backend/bin/*.sh; do
            echo "· $f"
            bash -n "$f" || rc=1
            shellcheck "$f" || rc=1
          done
          exit "$rc"

      - name: Valida unit systemd dei worker (render template + systemd-analyze verify)
        run: |
          command -v systemd-analyze >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y systemd; }
          OUT="$(mktemp -d)"
          # Render REALE tramite l'installer (stessa fonte di verità del deploy),
          # senza root né systemctl. APP_DIR = questo backend → gli ExecStart
          # puntano al wrapper committato (esiste ed è eseguibile) e la verify
          # passa; un unit malformato (OnCalendar rotto, ExecStart assente, ...)
          # fa fallire il job.
          bash backend/bin/install-timers.sh --render-only "$OUT"
          systemd-analyze verify "$OUT"/*.service "$OUT"/*.timer
          echo "Unit systemd dei worker validati."
