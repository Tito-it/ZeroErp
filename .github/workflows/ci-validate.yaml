name: CI-Validate

on:
  push:
    branches: [Tito-dev]
    paths:
      - db/**
      - backend/**
      - requirements/**
      - scripts/**
      - .github/workflows/ci-validate.yml
  pull_request:
    branches: [Tito-dev, main]
    paths:
      - db/**
      - backend/**
      - requirements/**
      - scripts/**
      - .github/workflows/ci-validate.yml

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: zeroerp
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zeroerp -d zeroerp"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      # requirements runtime backend
      REQ_FILE: backbase.txt

      # Django / DB
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: zeroerp
      DB_USER: zeroerp
      DB_PASSWORD: secret
      DJANGO_SECRET_KEY: ci-placeholder
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.in
      # venv backend locale per gestire manage.py e deps
      - name: venv + pip (backend/.venv)
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel

      - name: Install backend requirements
        run: |
          source backend/.venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Liquibase 5 (oss)
        uses: liquibase/setup-liquibase@v2
        with:
          version: '5.0.0'
          edition: 'oss'

      - name: Install PostgreSQL driver for Liquibase 5
        run: |
          liquibase lpm add postgresql --global
          liquibase --version

      - name: Generate Liquibase autogen master (timeline)
        run: |
          python scripts/gen_master_autogen.py \
            --root db/changelog/migrations_v2 \
            --out  db/changelog/migrations_v2/changelog-autogen.yaml \
            --strict

      - name: Liquibase update (standard, no test)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts="!test"

      - name: Liquibase CI apply (run automations)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff%20-c%20app.env%3Dci" \
            --username=zeroerp \
            --password=secret \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts=ci_apply

      - name: Django check
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py check

      - name: Django migrate (schema django)
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py migrate --noinput

      - name: Django tests
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py test
