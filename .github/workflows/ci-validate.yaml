name: CI-Validate

# ── ⭐ CONCURRENCY: le PR si soppiantano, i push NON si accodano ─────────────
#   Il principio resta quello:
#   · su una **pull_request** la corsa nuova SOPPIANTA la vecchia — quel commit
#     non e' piu' quello che verra' mergiato, e il suo verdetto non serve a
#     nessuno. Si annulla, e si risparmia un runner.
#   · su una **push a Tito-dev** ogni corsa e' il verdetto di uno STATO DI
#     INTEGRAZIONE che e' esistito. Annullarla vuol dire che di quel merge non
#     si sapra' mai niente — e li' gira la suite pgTAP, che non gira altrove.
#
#   ⛔ MA `cancel-in-progress: false` NON VUOL DIRE «gira comunque»: vuol dire
#     **«mettiti in fila»**. E' la trappola in cui questo file e' caduto il
#     2026-09-10, appena messo il gruppo: la corsa del merge #1555 e' rimasta
#     ferma **4 minuti e 8 secondi** ad aspettare quella del #1554.
#
#       #1554  creata 15:38:16   job partito 15:38:19   finito 15:43:23
#       #1555  creata 15:39:19   job partito 15:43:27 ← in coda   finito 15:50:04
#
#     Il job era diventato piu' VELOCE (7,6 -> 6,6 min, i sei cancelli da 53 s a
#     4 s col parser YAML in C) e la CORSA piu' LENTA (7,6 -> 10,8 min). Il
#     guadagno reale era nascosto da una coda che prima non c'era.
#
#   ⇒ Sui push il gruppo non porta NIENTE — non annulla, non risparmia un
#     runner — e aggiunge latenza pura. Quindi ogni push ha un gruppo **suo**
#     (`run_id`, unico per corsa) e non incontra mai nessuno; le PR restano
#     raggruppate per `ref`, dove il soppiantamento serve davvero.
#   ⚠️ Con un gruppo di uno solo, `cancel-in-progress: true` non ha niente da
#     annullare: e' vero solo dove conta, ed e' piu' onesto di un booleano
#     condizionale che sembrava dire un'altra cosa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || 'pr' }}
  cancel-in-progress: true

on:
  push:
    branches: [Tito-dev]
    paths:
      - db/**
      - backend/**
      - requirements.txt
      - .python-version
      - .pre-commit-config.yaml
      - .gitleaks.toml # config dell'hook gitleaks: cambiarla deve rimisurare
      - scripts/**
      - .github/workflows/ci-validate.yaml
  pull_request:
    branches: [Tito-dev, main]
    paths:
      - db/**
      - backend/**
      - requirements.txt
      - .python-version
      - .pre-commit-config.yaml
      - .gitleaks.toml # config dell'hook gitleaks: cambiarla deve rimisurare
      - scripts/**
      - .github/workflows/ci-validate.yaml

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: zeroerp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d zeroerp"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      # ⚠️ Presidio percorsi (aggiunto 02-09-2026, Liquibase 5.0.4). Anticipa il
      #   default che una major futura adottera'. PERIMETRO MISURATO, non
      #   dedotto dalla documentazione: fallisce — ValidationFailedException,
      #   exit 1, con nome del file e del changeSet — sui percorsi con `..`
      #   risolti sulla RADICE del search path che da essa ESCONO.
      #   ⛔ RAMO CIECO: i percorsi con `relativeToChangelogFile: true` NON
      #   sono coperti dal flag, provato sia da argomento CLI sia da env. E'
      #   la forma dei 192 seed di `80_data`, che infatti passano identici col
      #   flag attivo (`calculate-checksum` = valore nel databasechangelog).
      #   Quindi: impedisce che nasca la PRIMA forma, non copre la seconda.
      LIQUIBASE_ALLOW_PARENT_DIRECTORY_REFERENCES: "false"

      # Django / DB
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: zeroerp
      DB_USER: zeroerp_owner
      DB_PASSWORD: secret-owner
      DJANGO_SECRET_KEY: ci-placeholder
      # Chiave Fernet dei campi cifrati; obbligatoria (settings.py). E' la
      # base64 di «ci-placeholder-fernet-key-32byte»: un segnaposto leggibile,
      # non un segreto. Stesso valore di ci.yaml (smoke del container).
      DJANGO_FIELD_ENCRYPTION_KEYS: "Y2ktcGxhY2Vob2xkZXItZmVybmV0LWtleS0zMmJ5dGU="  # gitleaks:allow
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DEBUG: "0"
      # Obbligatoria con DEBUG=0 (settings.py). Qui non conta il valore: il
      # client di test parla HTTP e HSTS vale solo su HTTPS; il redirect lo
      # spegne il runner. Il valore di produzione lo prova `check --deploy`.
      DJANGO_SECURE_HSTS_SECONDS: "0"
      # Nessun proxy davanti al client di test: vale REMOTE_ADDR (settings.py,
      # «Quanti proxy fidati»). Obbligatorio, senza il backend non parte.
      DJANGO_TRUSTED_PROXY_COUNT: "0"
      # Base dei link nelle email; obbligatorio (settings.py).
      FRONTEND_URL: "https://localhost"
      CACHE_BACKEND: locmem

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history per pre-commit --from-ref/--to-ref

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.in
            backend/requirements-dev.txt
      # venv backend locale per gestire manage.py e deps
      - name: venv + pip (backend/.venv)
        working-directory: ./backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip setuptools wheel

      - name: Install backend requirements
        run: |
          source backend/.venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Strumenti dei cancelli (pre-commit + PyYAML)
        # ── ⚠️ DUE COSE, E NESSUNA E' UN DETTAGLIO ──────────────────────────
        #   1. PyYAML si nomina ESPLICITAMENTE. E' cio' con cui girano i sei
        #      guardrail qui sotto — che partono con `python scripts/X.py`,
        #      cioe' FUORI dal venv del backend — e oggi arriva soltanto perche'
        #      e' una dipendenza di `pre-commit` (`pyyaml>=5.1`). Funziona, ma
        #      per rimbalzo: il giorno in cui questo passo cambia, i cancelli
        #      muoiono con un `ImportError` che non li riguarda.
        #   2. Le versioni NON si scrivono qui. `-c` e' un file di VINCOLI, non
        #      di requisiti: pip installa i due pacchetti nominati alle versioni
        #      pinnate in `requirements.txt` e NON gli altri 42. La sede resta
        #      una sola, e il peso e' identico a prima.
        #
        #   ⛔ Perche' serviva: `ci.yaml` installa `-r requirements.txt`
        #     (pinnato), questo installava `pre-commit` a mano SENZA versione.
        #     Due workflow, due toolchain che possono divergere.
        #   ⚠️ Ed e' un difetto che ASPETTA, non uno in corso: provato in un venv
        #     pulito il 2026-09-10, con e senza vincolo pip risolve gli stessi
        #     `pre_commit==4.6.2` / `PyYAML==6.0.3`, perche' sono le ultime su
        #     PyPI. La divergenza compare alla prima versione nuova, e nessuno
        #     se ne accorgerebbe.
        run: pip install -c requirements.txt pre-commit PyYAML pip-audit

      - name: Audit dipendenze Python (pip-audit)
        # Controlla i pin contro i database di vulnerabilita' note (PyPI/OSV).
        # ⭐ Acceso il 2026-09-26 a ZERO: backend e root puliti con entrambi i
        #    database. Dependabot AVVISA dopo il merge; questo passo FERMA la
        #    PR che porta un pin vulnerabile — per esempio un `pip-compile` che
        #    ritorna a una versione vecchia, il caso di `cryptography` 49.x
        #    chiuso a mano il 2026-08-08.
        # ⚠️ `--no-deps --disable-pip`: i due file sono gia' pin completi, non
        #    serve risolverli in un venv temporaneo (che costerebbe un install).
        # ⚠️ Un CVE pubblicato su un pin che NON cambia non arriva qui: il
        #    workflow gira solo sui cambi. Quel caso resta a Dependabot.
        # ⛔ UNA CHIAMATA PER FILE (2026-11-01). I due file sono due AMBIENTI
        #    diversi (venv del backend da pip-compile, venv degli strumenti da
        #    freeze): un pacchetto puo' starci a due versioni, ed e' legittimo.
        #    Con i due `-r` in una sola chiamata pip-audit li fonde in un solo
        #    insieme di requisiti e si ferma («duplicate requirements»): e' caduto
        #    su `pillow` 12.3.0 (backend, `<13` per WeasyPrint) contro 13.0.0
        #    (root), un errore del cancello e non una vulnerabilita'.
        #    ⚠️ Si audita anche il secondo se il primo e' rosso: un rosso non
        #    deve nascondere l'altro.
        run: |
          rc=0
          for req in backend/requirements.txt requirements.txt; do
            echo "== pip-audit $req"
            pip-audit --no-deps --disable-pip -r "$req" || rc=1
          done
          exit $rc

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref ${{ github.event.pull_request.base.sha }} \
                           --to-ref ${{ github.sha }}
          else
            pre-commit run --from-ref ${{ github.event.before }} \
                           --to-ref ${{ github.sha }}
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Liquibase 5 (oss)
        uses: liquibase/setup-liquibase@v3.0.0
        with:
          version: '5.0.4'
          edition: 'oss'

      - name: Install PostgreSQL driver for Liquibase 5
        run: |
          # Driver PostgreSQL da Maven Central (NIENTE LPM): evita il fallimento
          # "Checksum validation failed" del package manager LPM. Liquibase carica
          # automaticamente i .jar in LIQUIBASE_HOME/lib. 42.7.x è compatibile con PG 18.
          LB_HOME="${LIQUIBASE_HOME:-$(dirname "$(readlink -f "$(command -v liquibase)")")}"
          mkdir -p "$LB_HOME/lib"
          curl -fsSL -o "$LB_HOME/lib/postgresql.jar" \
            https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar
          liquibase --version

      - name: Guardrail runOnChange (00_schema / 20_code)
        # ⚠️ POSIZIONE: prima di Liquibase, e non e' un dettaglio. Questo
        # controllo legge SOLO i file YAML — non gli serve un database — e
        # quello che presidia e' proprio il modo in cui la pipeline applica i
        # changeSet. Metterlo dopo il migrate significherebbe scoprire a valle
        # un difetto che ha gia' riscritto meta' schema.
        #
        # Cosa presidia: un changeSet di schema o di codice si applica UNA
        # volta, in ordine di timeline. Con `runOnChange: true` ri-esegue anche
        # nella SECONDA invocazione di Liquibase di questo workflow
        # (--contexts=ci_apply, piu' sotto), fuori ordine, e riscrive il proprio
        # corpo SOPRA le revisioni piu' recenti — che sono spente e non
        # ri-eseguono. Su un DB di sviluppo l'invocazione e' una sola: il
        # difetto non si vede fino a qui. Il 2026-08-06 riportava indietro 49
        # funzioni a ogni build, fra cui dbops.trgfn_tx_id_managed.
        #
        # ⚠️ PERCHE' riparte nella seconda invocazione, capito il 2026-09-17:
        # non e' `runOnChange` da solo. In Liquibase 5.0.4 un runOnChange con
        # `validCheckSums: ANY` e un change `dbms: postgresql` viene ri-eseguito
        # UNA volta senza che nessuno l'abbia toccato — il filtro che decide se
        # ri-eseguire calcola il checksum senza Database nello Scope e il change
        # `dbms:` ne esce — e poi salva «il checksum di niente», cosi' un edit
        # dell'SQL non ri-esegue mai piu'. Quel giorno e' morto 20260831-03,
        # ripartito qui sotto DOPO il seed della sesta famiglia. Da allora lo
        # stesso cancello pretende che i runOnChange di 80_data/85_pgagent/
        # 90_end NON portino `dbms:` (seconda regola, linee-guida-sql §11.1).
        #
        # Resta lecito in 80_data (mirror CSV), 85_pgagent, 90_end: la'
        # ri-eseguire e' il comportamento voluto — purche' il corpo regga una
        # ri-esecuzione DOPO changeSet piu' recenti (idempotente, precondizioni
        # per nome).
        run: python scripts/guardrail_run_on_change.py

      - name: Guardrail v1 congelato
        # La prima generazione (baseline/, migrations/, changelog-master.yaml)
        # rigira a ogni migrate da zero, e centinaia di quei file sono
        # runOnChange: il cancello qui sopra guarda solo migrations_v2/. Un
        # file v1 modificato ripartirebbe FUORI ordine, sopra le revisioni v2.
        # Il manifesto db/changelog/v1-congelato.json porta lo sha256 di ogni
        # file: aggiunto, tolto o cambiato = build rossa. Un'eccezione si
        # concorda con Tid e rigenera il manifesto nello stesso commit
        # (decisione del 2026-10-04, linee-guida-sql §11.11).
        run: python scripts/guardrail_v1_congelato.py

      - name: Guardrail preambolo pgTAP
        # Presidia le tre righe senza le quali un test pgTAP passa SMETTENDO di
        # verificare — «verde per sottrazione»: la transazione, la riga di
        # contesto applicativo (con la RLS attiva, senza veste la fixture legge
        # zero righe e le asserzioni finiscono nei rami skip) e
        # SET CONSTRAINTS ALL IMMEDIATE (i 365 vincoli DIFFERITI scattano al
        # COMMIT, che in un test non arriva mai).
        #
        # Statico e senza database: gira qui, prima di tutto il resto, perche'
        # e' un controllo di forma sui file e non ha bisogno che il DB esista.
        #
        # ⚠️ Presidia anche, A SOGLIA, il debito dei `throws_ok` che accettano
        # qualunque errore: la soglia puo' solo CALARE. Il 2026-08-07 una sonda
        # ha trovato tre test VERDI che collaudavano una cosa diversa da quella
        # dichiarata, proprio per quel difetto.
        #
        # ⚠️ E rifiuta `CURRENT_DATE` e affini nei test: «oggi» e' il giorno
        # dell'azienda (`script.fn_data_operativa()`), e la sessione pgTAP gira
        # apposta in un fuso che cade in un altro giorno (scripts/testpgtap.sh).
        #
        # Guida: docs/it/guide/pgtap-come-si-scrive-un-test.md
        run: python scripts/guardrail_pgtap_preambolo.py

      - name: Guardrail COMMENT al presente nei changeSet nuovi
        # Cosa presidia: un `COMMENT ON … IS '…'` scritto in un changeSet nuovo
        # (dal 20261111-18) non porta il nome di un brief, un marcatore di
        # revisione, l'id di un changeSet o l'hash di un commit
        # (linee-guida-sql §5d). Il COMMENT e' il primo paragrafo della scheda
        # auto-generata: una cronaca li' invecchia il giorno dopo.
        #
        # Il pregresso non blocca: si riscrive per famiglia, quando un lavoro
        # riapre gli oggetti. Per dbops e maintenance il database vivo lo guarda
        # il pgTAP dbops/test-comment-al-presente-v1, con le stesse marche.
        # Statico e senza database; solo `changes`, mai `rollback`.
        run: python scripts/guardrail_comment_al_presente.py

      - name: Guardrail letterali SQL nei changeSet
        # Presidia una classe sola, e basta quella: un apostrofo singolo dentro
        # una stringa SQL la CHIUDE, e il changeSet smette di essere quello che
        # sembra. Nel testo italiano scritto senza accenti — `e'`, `gia'`,
        # `piu'`, `la'`, `perche'` — l'apostrofo va RADDOPPIATO, e basta che ne
        # sfugga uno.
        #
        # Perche' esiste: il 2026-08-25 un migrate e' morto su un `la'` dentro
        # un COMMENT ON COLUMN di 1600 caratteri. ⚠️ Il difetto vive quasi
        # sempre nei COMMENT e nei GRANT, cioe' nei pezzi che «non sembrano
        # codice» e che una prova a mano ricopia per ultimi — o non ricopia
        # affatto.
        #
        # Statico e senza database: sta qui, prima del migrate, perche' e'
        # proprio il migrate che vogliamo non far morire.
        #
        # ⚠️ NON sostituisce l'esecuzione: prende il letterale che non si chiude
        # mai, non quello chiuso nel punto sbagliato. Quello lo vede solo il
        # parser di PostgreSQL, cioe' il migrate qui sotto.
        run: python scripts/guardrail_sql_letterali.py

      - name: Guardrail timestamp senza fuso nei changeSet nuovi
        # Cosa presidia: in PostgreSQL `TIMESTAMP` nudo e' `timestamp without
        # time zone`, cioe' l'orario LOCALE della sessione che scrive — e le
        # sessioni di questo progetto sono due (backend in UTC, psql/Liquibase
        # in Europe/Rome). Lo stesso now() vale due istanti diversi, e la riga
        # non ricorda quale.
        #
        # Perche' esiste: il 2026-09-20 (valutazione del modello, V-3) lo
        # schema `ui` aveva 22 colonne senza fuso e ZERO con, piu' 8 shadow di
        # storico, 4 colonne di config e due firme di funzione — tutte nate da
        # `data_insert TIMESTAMP NOT NULL DEFAULT now()`. Sanate da
        # 20260920-02..-07; questo cancello e' perche' non rinascano.
        #
        # Perimetro: i changelog con data >= 20260920 (quelli prima sono
        # mergiati e non si toccano), SOLO `changes` (la sezione di ripristino
        # che rimette il tipo vecchio e' legittima), istruzioni DROP esenti.
        # Statico e senza database; il database vivo lo guarda il pgTAP
        # dbops/test-nessun-timestamp-senza-fuso-v1 piu' avanti.
        run: python scripts/guardrail_timestamp_senza_fuso.py

      - name: Guardrail forme che muoiono all'apply
        # Cosa presidia: tredici forme scritte nella documentazione e ricadute
        # piu' volte, che si vedono leggendo il file e che la prova a mano spesso
        # non prende — una sqlCheck che attende t/f, il `;` mancante dopo un
        # corpo copiato dalla doc auto-generata, un BEGIN ATOMIC che divide il
        # suo `sql:`, fn_log_and_raise_error a cinque argomenti, il `where:` che
        # Liquibase ignora su addUniqueConstraint, l'operatore jsonb `?` nella
        # forma che si rompe, un riferimento a django risolto alla CREATE, un
        # %TYPE perso rispetto alla revisione precedente della funzione, un id
        # a tipo nudo senza ragione, un mirror che scrive '' in una colonna di
        # testo nullable, un segnaposto rotto nei messaggi d'errore, un CSV con fine riga misti, un
        # pgTAP che legge pgagent senza il runner owner. L'elenco, con la sede
        # di ogni regola, sta in testa allo script.
        #
        # ⚠️ POSIZIONE: prima del migrate, come gli altri: quasi tutte queste
        # forme lo fanno morire, e quelle che non lo fanno morire lasciano un
        # vincolo che non c'e'.
        #
        # Statico e senza database. Le eccezioni si dichiarano in testa al file.
        run: python scripts/guardrail_forme_changeset.py

      - name: Guardrail preCondition sul contenuto di 80_data
        # ⚠️ POSIZIONE: prima del migrate, e per lo stesso motivo degli altri
        # tre — il difetto che presidia UCCIDE il migrate, e scoprirlo dopo
        # significa averlo gia' pagato.
        #
        # Cosa presidia: un changeSet di `00_schema`/`20_code` non puo'
        # pretendere che una riga di seed esista gia'. Il changelog esegue
        # 00_schema + 20_code, POI 80_data: la corsa che introduce la riga e'
        # esattamente quella in cui la preCondition non la trova. Su un
        # database di sviluppo la riga c'e' da settimane e il cancello passa;
        # qui il database nasce vuoto a ogni build e il migrate muore con
        # «SQL Precondition failed. Expected '1' got '0'».
        #
        # Perche' esiste: il 2026-09-02, ripartita la CI dopo giorni di fermo,
        # il migrate si e' fermato su 20260820-12 — e dietro c'erano altre
        # QUINDICI mine identiche gia' committate, una build ciascuna per
        # scoprirle a mano.
        #
        # Restano leciti: `expectedResult: 0` (un DB vuoto lo soddisfa),
        # `onFail` diverso da HALT (i backfill del pregresso), e tutte le
        # preCondition sullo SCHEMA — tableExists, columnExists, pg_proc.
        #
        # Guida: docs/it/linee-guida-sql.md §11.4
        run: python scripts/guardrail_precondition_seed.py

      - name: Guardrail DDL su trigger generati da ci_apply
        # ⚠️ POSIZIONE: prima del migrate, come gli altri quattro — il difetto
        # che presidia uccide il migrate.
        #
        # Cosa presidia: i trigger di audit, tx_id e storico non li scrive
        # nessun changeSet, li genera il framework delle automazioni con
        # --contexts=ci_apply, cioe' la SECONDA invocazione di Liquibase (piu'
        # sotto). Durante la prima passata una tabella appena creata non li ha
        # ancora: un ALTER TRIGGER ... RENAME o un DROP TRIGGER senza IF EXISTS
        # su quei nomi passa su un DB di sviluppo — dove esistono da settimane —
        # e qui muore con «trigger ... does not exist».
        #
        # Perche' esiste: il 2026-09-02 il migrate si e' fermato su
        # 20260822-25-rename-compensazioni-in-sistemazioni, che aveva il fatto
        # scritto nella propria intestazione due paragrafi sopra il difetto.
        # Sapere la regola non basta: mentre si scrive la rinomina si guarda il
        # database che si ha davanti, e li' il trigger c'e'.
        #
        # Via d'uscita, e non e' una deroga: quell'istruzione va in un changeSet
        # suo con onFail: MARK_RAN, perche' l'operazione e' davvero condizionale
        # — su un DB nuovo le automazioni genereranno gia' il nome giusto.
        #
        # Guida: docs/it/linee-guida-sql.md §11.5
        run: python scripts/guardrail_ddl_su_trigger_automazione.py

      - name: Guardrail GRANT ai ruoli batch nei changeSet
        # ⚠️ POSIZIONE: prima del migrate, per la stessa ragione degli altri.
        #
        # Cosa presidia: i ruoli batch headless hanno BYPASSRLS, che vuole
        # superuser — Liquibase gira come `zeroerp` e non puo' crearli. Li crea
        # provision_db_role_batch_*.sql come `postgres`, e ci.yaml lo lancia
        # DOPO le migrazioni standard (deve concedere sul perimetro, e le
        # tabelle del perimetro devono esistere). Quindi per tutto il migrate
        # quel ruolo NON esiste, e un GRANT che lo nomina uccide la pipeline con
        # «role "zeroerp_batch_fatturazione" does not exist».
        #
        # ⭐ Ed e' anche inutile: il provisioning fa GRANT SELECT/EXECUTE ON ALL
        # ... IN SCHEMA sui 14 schemi applicativi piu' ALTER DEFAULT PRIVILEGES,
        # quindi copre anche gli oggetti che nascono dopo.
        #
        # Perche' esiste: la regola era gia' scritta parola per parola nel
        # changeSet 20260727-21, dopo lo stesso guasto del 2026-07-27. Nei 36
        # giorni successivi sono stati scritti 39 GRANT in 20 changeSet che la
        # violano — bonificati il 2026-09-02. Una regola in un commento la legge
        # chi apre quel file; un cancello la legge per tutti.
        #
        # ⚠️ Il GRANT a `zeroerp_app` accanto RESTA: quello e' un ruolo che
        # esiste durante il migrate, ed e' la riga da cui la sbagliata viene
        # copiata — sono adiacenti e identiche tranne il nome del ruolo.
        #
        # Guida: docs/it/linee-guida-sql.md §11.6
        run: python scripts/guardrail_grant_ruolo_batch.py

      - name: Generate Liquibase autogen master (timeline)
        run: |
          python scripts/gen_master_autogen.py \
            --root db/changelog/migrations_v2 \
            --out  db/changelog/migrations_v2/changelog-autogen.yaml \
            --strict

      - name: DB bootstrap (roles + grants)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # ⭐ I RUOLI DI SISTEMA (brief-db-ruoli-di-sistema, fase 2). Li crea lo
          #   stesso script dello scratch e di un'installazione:
          #   scripts/sql/provision_zeroerp.sql, fase `ruoli` — zeroerp_owner
          #   (proprietario di tutto e migratore), zeroerp_job (pgAgent: solo le
          #   procedure dei job), zeroerp_app (il backend) — e il database
          #   `zeroerp`, che il container crea di `postgres`, passa a zeroerp_owner.
          #   Le password sono letterali, come prima: il database vive dentro il
          #   runner per la durata del job (D-3).
          #   ⚠️ zeroerp_owner e' NOCREATEDB: il vecchio `zeroerp` aveva CREATEDB, ma
          #   nessuno lo usa — i test Django girano sul database configurato
          #   (backend/zeroerp_backend/test_runner.py), non ne creano uno.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v fase=ruoli -v db_name=zeroerp \
            -v owner_password=secret-owner -v job_password=secret-job -v app_password=secret-app \
            -v log_password=secret-log \
            -f scripts/sql/provision_zeroerp.sql
          # ⚠️ Il ruolo applicativo va creato ORA, PRIMA di Liquibase, e non dopo.
          # Molti changeSet di GRANT sono scritti «idempotenti e difensivi: skip
          # se il ruolo manca» — e finora in CI il ruolo mancava sempre, quindi
          # quei GRANT non sono MAI stati applicati ne' verificati. Creandolo
          # qui, la CI comincia a collaudare anche la matrice dei permessi.
          #
          # La password e' un letterale come quella di `zeroerp` qui sopra, e non
          # espone niente: questo database vive dentro il runner per la durata
          # del job e non e' raggiungibile da fuori. NON e' la password di
          # sviluppo — usare un ruolo con un NOME diverso sarebbe peggio, perche'
          # ogni GRANT del repo e' scritto sul nome letterale `zeroerp_app` e la
          # CI finirebbe per collaudare una matrice che non esiste altrove.
          # (zeroerp_app lo crea ora la fase `ruoli` qui sopra.)

          # ── Il ruolo del canale di log fuori transazione (dblink) ──────
          # ⭐ zeroerp_log lo crea la fase `ruoli` qui sopra (-v log_password), PRIMA
          #   di Liquibase: `90_end/20260905-38` gli concede USAGE su `maintenance`
          #   e INSERT sul giornale dei job, ma e' scritto «skip se il ruolo manca».
          #   Senza il ruolo i test 3, 4 e 5 di
          #   `db/pgtap/maintenance/test-job-run-log-failure-out-of-tx.sql` farebbero
          #   `skip()`: tre asserzioni che sembrerebbero coperte e non lo sono.
          # ⚠️ DSN ESPLICITO, non `service=zeroerp_log` come sul database di
          # sviluppo: la forma `service=` si risolve da `pg_service.conf` sul
          # SERVER, e nel container della CI quel file non esiste — il canale
          # sembrerebbe configurato e non si aprirebbe.
          # ⚠️ E l'utente del DSN e' `zeroerp_log`, non il migratore: e' l'unico
          # con i privilegi minimi giusti (scrive il giornale, non lo legge).
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "ALTER ROLE zeroerp_owner IN DATABASE zeroerp SET myapp.dblink_log_connection = 'hostaddr=127.0.0.1 port=5432 dbname=zeroerp user=zeroerp_log password=secret-log';
             ALTER ROLE zeroerp_app IN DATABASE zeroerp SET myapp.dblink_log_connection = 'hostaddr=127.0.0.1 port=5432 dbname=zeroerp user=zeroerp_log password=secret-log';"

      - name: Installa plpgsql_check nel container Postgres
        # Serve al guardrail «riferimenti morti» in fondo a questo workflow.
        # Il changeSet che crea l'estensione (20260804-36) e' CONDIZIONALE su
        # pg_available_extensions: se il pacchetto non c'e' viene saltato senza
        # essere marcato eseguito, quindi si riprende da solo appena c'e'. Per
        # questo il passo va PRIMA del giro provision.
        #
        # ⚠️ Si installa nel container del service, non sul runner: postgres
        # gira li' dentro e le estensioni le carica dal SUO filesystem.
        # L'immagine postgis/postgis:18-3.6 ha gia' il repo PGDG configurato
        # (ci prende postgis), quindi basta un apt-get.
        #
        # Se un giorno questo passo diventasse lento o fragile, l'alternativa
        # e' un'immagine custom costruita a monte: piu' pulita, ma vuole un
        # registry e un job di build: sproporzionata per un pacchetto solo.
        run: |
          set -euo pipefail
          CID="$(docker ps --filter 'ancestor=postgis/postgis:18-3.6' --format '{{.ID}}' | head -1)"
          if [ -z "$CID" ]; then
            echo "::error::container del service postgres non trovato"
            exit 1
          fi
          # ⚠️ pgTAP si installa QUI, nello stesso apt-get: serve a far girare la
          # suite pgTAP (passo in fondo al workflow). Nello stesso comando e non
          # in uno step suo perche' `apt-get update` e' il pezzo lento, e farlo
          # due volte raddoppierebbe il costo per niente.
          docker exec "$CID" bash -euo pipefail -c \
            "apt-get update -qq && apt-get install -y -qq postgresql-18-plpgsql-check postgresql-18-pgtap"
          # ⚠️ Riavvio OBBLIGATORIO dopo l'apt-get. Le dipendenze dei due
          #   pacchetti tirano su la minor PGDG piu' recente di postgresql-18,
          #   che sovrascrive i .so in /usr/lib/postgresql/18/lib mentre il
          #   postmaster della minor dell'immagine e' ancora in piedi: il primo
          #   backend che carica plpgsql.so muore con «undefined symbol» (12-11-2026,
          #   immagine 18.6, apt 18.7: heap_datum_update_type). Il riavvio
          #   allinea binario e librerie; pacchetti e dati restano, perche'
          #   restart non ricrea il container.
          docker restart "$CID" >/dev/null
          for _ in $(seq 1 60); do
            docker exec "$CID" pg_isready -U postgres -d zeroerp -q && break
            sleep 1
          done
          docker exec "$CID" pg_isready -U postgres -d zeroerp
          docker exec "$CID" psql -U postgres -d zeroerp -tAc "SELECT version();"
          # Verifica che postgres lo veda davvero: senza, il changeSet -36
          # verrebbe saltato e il guardrail fallirebbe piu' tardi con un
          # messaggio meno chiaro di questo.
          docker exec "$CID" psql -U postgres -d zeroerp -tAc \
            "SELECT count(*) FROM pg_available_extensions WHERE name='plpgsql_check';" \
            | grep -qx 1

      - name: Liquibase admin (provision - pre)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.env%3Dci" \
            --username=postgres \
            --password="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --changeLogFile=db/changelog/changelog-provision-pre.yaml \
            update --contexts=provision

      - name: Proprieta' a zeroerp_owner (provision_zeroerp.sql, fase pre)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        # ⭐ Al posto dei GRANT sulle tabelle di Liquibase e di pg_maintain: cio' che
        #   il provision-pre ha creato da superuser passa a zeroerp_owner, che da
        #   proprietario non ha bisogno d'altro. Come in ci.yaml e ci-local.sh.
        #   Brief: brief-db-ruoli-di-sistema, fase 2.
        run: |
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -v fase=pre -f scripts/sql/provision_zeroerp.sql

      - name: Liquibase update (standard, no provision)
        # NIENTE bypass_tx_id_check qui, ed e' voluto: questo step deve esercitare
        # davvero la validazione del tx_id, non spegnerla. Senza canale di log
        # fn_get_or_create_session_tx_id ritorna la sentinella uuid_nil SENZA
        # pubblicare la GUC, quindi il trigger trgfn_tx_id_managed non ha nulla da
        # rifiutare (migration 20260722-10/-11, brief-db-coerenza-tx-id-non-registrato.md).
        # Se un giorno questo step tornasse a fallire con W_TXID_NOT_REGISTERED,
        # la risposta NON e' rimettere il bypass: significa che qualcuno ha
        # ricominciato a pubblicare un tx_id non registrato.
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff" \
            --username=zeroerp_owner \
            --password=secret-owner \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts="!provision and !dati_macchina"

      - name: Liquibase admin (provision - post)
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.env%3Dci" \
            --username=postgres \
            --password="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --changeLogFile=db/changelog/changelog-provision-post.yaml \
            update --contexts=provision

      - name: Liquibase CI apply (run automations)
        # ⭐ L'`id` non e' decorativo: da lui dipendono «Django migrate» e, a
        #   catena, la «fase post» e la suite pgTAP piu' in basso. ⚠️ Qui il
        #   database NON e' ancora completo: manca il secondo migratore
        #   (`manage.py migrate`) e la fase post. Il database completo e'
        #   `steps.fase_post` (rev 2026-11-01).
        id: ci_apply
        # Come lo step "standard, no provision": nessun bypass, la validazione
        # del tx_id resta attiva.
        run: |
          liquibase \
            --url="jdbc:postgresql://localhost:5432/zeroerp?options=-c%20myapp.log_with_dblink%3Doff%20-c%20myapp.env%3Dci" \
            --username=zeroerp_owner \
            --password=secret-owner \
            --changeLogFile=db/changelog/changelog-master-v2.yaml \
            update --contexts=ci_apply

      - name: Guardrail naming codice_interno/codice (definizioni live)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # Fallisce se una vista/funzione espone codice_interno con alias *_codice
          # (o la chiave jsonb speculare). Vedi linee-guida-sql §6c e
          # brief-naming-stato-codice-interno.md. RAISE -> exit !=0 con ON_ERROR_STOP.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -f scripts/sql/check_naming_stato_codice.sql

      - name: Guardrail codice errore strutturato (canale CONSTRAINT + convenzione codici)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # Presidia il contratto introdotto da 20260805-05: «SQLSTATE P0001 +
          # campo CONSTRAINT valorizzato = errore di dominio». Su quella
          # condizione il backend decide 409/404/403/400 e quale messaggio
          # legge l'operatore.
          #
          # (A) un solo mittente sul canale: solo script.fn_log_and_raise_error
          #     puo' scrivere CONSTRAINT in un RAISE. P0001 e' anche il default
          #     di qualunque RAISE EXCEPTION scritto a mano, e nel DB ce ne
          #     sono 135 in 46 funzioni: se uno di quelli usasse lo stesso
          #     campo per dire altro, il backend non fallirebbe — risponderebbe
          #     sbagliato, che e' peggio.
          # (B) il rubinetto sulla convenzione E_{MODULO}_{TIPO}: un codice
          #     senza prefisso E_ arriva al backend, non trova policy e cade su
          #     E_GENERICO -> HTTP 500. I 57 ereditati stanno nel registro
          #     dbops.messaggi_errore_codici_legacy; il 58esimo no.
          # (C) e il registro deve CALARE: una voce che non corrisponde piu' a
          #     nessun codice a seed va tolta.
          #
          # ⚠️ POSIZIONE: qui va bene prima del migrate di Django, al contrario
          # del guardrail dei riferimenti morti. Quello compila i corpi plpgsql
          # e ha bisogno dello schema `django`; questo legge solo pg_proc,
          # config.messaggi_errore e il registro, che Liquibase ha gia' messo.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -f scripts/sql/guardrail_codice_errore_strutturato.sql

      - name: Codici errore — nessun codice allarga il proprio significato (B-7)
        env:
          # ⚠️ Come ogni altro passo psql di questo workflow: senza, il runner
          #   chiede la password in modo interattivo e muore con
          #   «fe_sendauth: no password supplied». La prima stesura l'aveva
          #   dimenticata perche' passava host/utente via PG* inline, e sembrava
          #   che bastasse: PGHOST e PGUSER dicono DOVE e CHI, non con che
          #   credenziale.
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # IL RUBINETTO DEGLI ACCUMULATORI.
          #
          # Il guardrail qui sopra presidia la FORMA del codice (convenzione,
          # canale, ritiro). Questo presidia il suo SIGNIFICATO: che un codice
          # non venga riusato per un tipo di condizione che prima non copriva.
          #
          # ⚠️ Non giudica se un codice E' generico — servirebbe leggere tutte
          # le guardie, e la misura ne legge 75 su 344. Giudica il CAMBIAMENTO,
          # che sui 75 sa dire con certezza. E' il modo in cui gli accumulatori
          # si formano davvero: nessuno crea un codice generico di proposito,
          # si allarga un codice esistente una volta sola e sembra ragionevole.
          #
          # ⚠️ Se diventa rosso NON si rigenera la baseline per far passare la
          # CI: la riga rossa e' la richiesta di una decisione (codice nuovo, o
          # baseline aggiornata con la ragione nel commit).
          #
          # ⚠️ POSIZIONE: dopo il guardrail e prima del migrate Django, per la
          # stessa ragione — legge solo pg_proc, config.codici_errore e la vista
          # dbops.vw_codici_errore_forme_condizione, che Liquibase ha gia' messo.
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGDATABASE=zeroerp \
            scripts/codici-errore-baseline.sh

      - name: Django check
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py check

      - name: Django check --deploy (completo)
        working-directory: ./backend
        # I controlli di Django sulla configurazione di produzione (cookie,
        # HSTS, SSL, SECRET_KEY, DEBUG, X-Frame-Options, ...) e quelli che
        # ogni app o libreria aggancia al ramo `--deploy` (drf-spectacular).
        # ⭐ COMPLETO dal 2026-10-08 (D3-b di migliorie-generali-BE-FE): fino ad
        #    allora girava `--tag security`, e un controllo di produzione nuovo
        #    portato da una libreria o da un aggiornamento di Django non
        #    l'avrebbe visto nessuno. `mail.E001`, che lo impediva, e'
        #    silenziato in `settings.py` PER PROGETTO (Django non spedisce
        #    posta in ZeroErp): il perche' sta accanto a `SILENCED_SYSTEM_CHECKS`.
        # ⚠️ drf-spectacular e' a ZERO dal 2026-09-26 e lo tiene a zero anche
        #    il registro a cricchetto `apps/core/tests/test_schema_openapi_registro.py`,
        #    che e' piu' fine di questo passo (confronta i rilievi PER NOME).
        # ⚠️ Un AVVISO (`W`) non cambia l'uscita di `check`, un errore (`E`)
        #    si'. Il cancello sugli avvisi lo fa il grep qui sotto, su
        #    QUALUNQUE famiglia, con l'elenco a cricchetto dei rilievi
        #    ACCETTATI. Si toglie una voce quando si chiude, mai si
        #    aggiunge per far passare una PR.
        #    - W005 (HSTS senza sottodomini) e W021 (HSTS senza preload):
        #      spenti PER SCELTA (brief-be-fe-sicurezza-header-token-mfa
        #      §1.3): riguardano il dominio intero, non ZeroErp, e il preload
        #      e' di fatto irreversibile. Non sono debito da chiudere.
        #    W004 (HSTS) e W008 (SSL_REDIRECT) chiusi il 2026-09-28 (§1).
        # ⭐ La chiave si GENERA qui: il segnaposto del job (`ci-placeholder`)
        #    fa scattare W009, come la farebbe scattare in produzione.
        # ⭐ HSTS e redirect con i valori di PRODUZIONE (un anno, redirect
        #    acceso), cosi' W004/W008 tornerebbero rossi se si spegnessero.
        run: |
          source .venv/bin/activate
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          export DJANGO_DEBUG=0
          export DJANGO_SECURE_HSTS_SECONDS=31536000
          export DJANGO_SECURE_SSL_REDIRECT=1
          out="$(python manage.py check --deploy 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          nuovi="$(grep -oE '\([a-z_]+\.[EW][0-9]+\)' <<<"$out" \
                   | grep -vE 'security\.(W005|W021)\)' || true)"
          if [ -n "$nuovi" ]; then
            echo "::error::check --deploy: rilievi non accettati: $nuovi"
            exit 1
          fi

      - name: Type checker (mypy, a cricchetto)
        working-directory: ./backend
        # Il type checker del backend (piano-be-type-checker, L1, 2026-10-08):
        # vede i difetti di GIUNTURA che una suite mockata non puo' vedere — un
        # metodo chiamato e non piu' esistente, `None` passato dove si vuole
        # un `int`. Il caso che lo ha fatto nascere: riallinea e sblocca prezzo
        # chiamavano un metodo tolto da sei mesi, e il test mockato lo fabbricava.
        # ⭐ A CRICCHETTO: l'arretrato sta in `backend/mypy.baseline.json`, e
        #    `scripts/check_mypy_baseline.py` e' rosso su un rilievo NUOVO, su
        #    una voce SANATA e non tolta, e su un'uscita di mypy illeggibile.
        #    Perimetro e regole in `backend/mypy.ini`, non qui.
        # ⚠️ Gli strumenti stanno in `requirements-dev.txt`, NON nel lock del
        #    backend: il `Dockerfile` installa solo quello, e mypy in
        #    produzione non serve. Il plugin Django importa le settings: per
        #    questo il passo gira nella venv del backend, con l'ambiente del job.
        # ⚠️ Gira sempre su TUTTO il perimetro, non sui file cambiati: una firma
        #    cambiata in un file rompe il chiamante in un altro, non toccato.
        run: |
          source .venv/bin/activate
          pip install -r requirements-dev.txt
          python ../scripts/check_mypy_baseline.py

      - name: Django migrate (schema django)
        # ⭐ `id` e `if` per la suite pgTAP (vedi la sua condizione): il secondo
        #   migratore dipende da `ci_apply`, non dal `success()` implicito.
        #   ⛔ Il 2026-11-01 (corsa 41325095742) il B-7 rosso lo ha saltato, la
        #   suite e' partita lo stesso e ha misurato un database senza
        #   `django.auth_user`: 909 rossi su 936, centinaia di finte regressioni.
        id: django_migrate
        if: ${{ !cancelled() && steps.ci_apply.outcome == 'success' }}
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          python manage.py migrate contenttypes --noinput
          python manage.py migrate auth --noinput
          python manage.py migrate token_blacklist --fake
          python manage.py migrate --noinput

      # ⭐ La fase post del modello, DOPO ENTRAMBI i migratori: Liquibase (con
      #   `ci_apply`) e `manage.py migrate`. Da' la postura di zeroerp_app (era il
      #   passo «provision_db_roles», unificato qui il 2026-10-15: fase 4), EXECUTE
      #   di zeroerp_job sulle procedure dei job, e la VERIFICA «un owner solo».
      # ⛔ «Entrambi» e' la parola che conta (2026-09-13): i `GRANT … ON ALL
      #   TABLES IN SCHEMA` sono una fotografia. Stava prima di «Django migrate»,
      #   e `zeroerp_app` restava senza un privilegio su `django.auth_user`: 47
      #   «permission denied» nel log della corsa 34723456630.
      #   Brief: brief-db-ruoli-di-sistema, fasi 2 e 4.
      - name: Ruoli di sistema - fase post e verifica «un owner solo»
        # ⭐ E' il passo che chiude il database: la suite pgTAP dipende da lui.
        id: fase_post
        if: ${{ !cancelled() && steps.django_migrate.outcome == 'success' }}
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # ⭐ L'ambiente della CI e' SVILUPPO (brief-db-processi-accensione-per-ambiente,
          #   R-2): si dichiara qui, una volta, e non cambia.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -v fase=post -v ambiente=SVILUPPO -f scripts/sql/provision_zeroerp.sql

      - name: Guardrail riferimenti morti (funzioni plpgsql + dati di config)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          # Compila con plpgsql_check ogni funzione plpgsql non-estensione e
          # fallisce se trova un riferimento che non si risolve (tabella o
          # colonna inesistente, variabile speciale sbagliata, ramo senza
          # RETURN) fuori dal registro del debito dbops.riferimenti_morti_esenzioni.
          #
          # ⚠️ PostgreSQL non ri-valida i corpi plpgsql quando si droppa o si
          # rinomina qualcosa: una funzione puo' restare rotta per mesi senza
          # che niente protesti, e si scopre quando qualcuno la esegue. Il
          # 2026-08-04 ce n'erano 34, la piu' vecchia rotta da undici mesi, e
          # una era l'autocomplete vie del backend.
          # Vedi brief-db-bonifica-riferimenti-morti.md.
          #
          # Fallisce anche se una voce del registro non serve piu': il debito
          # deve calare, non solo non crescere.
          #
          # ⚠️ POSIZIONE: DOPO il migrate di Django, e non e' un dettaglio.
          # Una decina di funzioni del DB leggono `django.auth_user` — lo
          # schema `django` lo crea `manage.py migrate`, non Liquibase.
          # Messo prima, il guardrail misurava un database a meta' e
          # segnalava dieci falsi difetti «relation django.auth_user does not
          # exist» (visto in CI il 2026-08-04). Il DB e' completo solo quando
          # entrambi i migratori hanno finito: e' li' che ha senso compilarne
          # i corpi.
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -f scripts/sql/guardrail_riferimenti_morti.sql

      - name: Librerie native di WeasyPrint (Pango)
        # I test di `test_render_service` sulla libreria VERA (fetcher a lista
        # chiusa: `file:`, `http:`, SVG annidato, `@import` ciclico) si
        # saltano con `skipUnless` se WeasyPrint non trova Pango. Il runner
        # `ubuntu-latest` non lo porta: fino al 2026-10-04 la CI li dava
        # «skipped» (`cannot load library 'libpango-1.0-0'`), cioe' il
        # presidio di sicurezza del render girava solo in locale.
        # ⚠️ Stesso elenco del Dockerfile: la sede e' quella, qui si ricopia
        #    perche' il runner non usa l'immagine. Se cambia la', cambia qui.
        # ⭐ L'import finale fa fallire il passo invece di lasciar saltare i
        #    test in silenzio: un «verde per sottrazione» e' il difetto da evitare.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libharfbuzz-subset0 \
            libfontconfig1 \
            libcairo2 \
            libgdk-pixbuf-2.0-0 \
            shared-mime-info
          source backend/.venv/bin/activate
          python -c "import weasyprint; print('WeasyPrint', weasyprint.__version__)"

      # ⭐ FUSO OSTILE PER I TEST DJANGO (brief-be-db-fe-un-solo-fuso-aziendale,
      #   T-5, decisione di Tid del 2026-10-09). La sessione PG dei test Django
      #   e' SEMPRE UTC (Django la imposta da se' con `USE_TZ`), quindi l'unica
      #   leva e' il fuso dell'AZIENDA: col seed (Europe/Rome) il giorno UTC e
      #   quello aziendale differiscono solo fra le 22 e le 24 UTC, e un errore
      #   di fuso nel backend sarebbe rosso quasi mai — com'e' nato il brief.
      #   Qui il parametro si sposta su un fuso il cui giorno ADESSO differisce
      #   da quello UTC: Kiritimati (+14) dalle 10 UTC in poi, Pago Pago (−11)
      #   prima — uno dei due differisce sempre, e la scelta lascia almeno
      #   un'ora di margine alla suite. Stessa idea di `scripts/testpgtap.sh`,
      #   che sceglie la SESSIONE ostile al parametro; qui la sessione e' fissa e
      #   si sceglie il parametro.
      #   ⚠️ Solo per questo passo: il passo dopo rimette il valore di prima,
      #   cosi' la suite pgTAP gira sul seed com'e'. Il backend legge il fuso
      #   all'avvio del processo dei test (`ZeroErpTestRunner`), quindi deve
      #   cambiare PRIMA di «Django tests».
      #   ⚠️ E' un presidio, non la prova: la prova sono i test che COSTRUISCONO
      #   gli istanti di confine. Un test che suppone Roma senza dichiararlo
      #   (`fuso_aziendale_forzato`) qui diventa rosso, ed e' giusto.
      - name: Fuso aziendale ostile per i test Django (T-5)
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          prima=$(psql --no-psqlrc -X -A -t -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "SELECT default_value FROM config.parameters WHERE code = 'SYSTEM_FUSO_ORARIO'")
          echo "FUSO_AZIENDALE_SEED=$prima" >> "$GITHUB_ENV"
          ostile=$(psql --no-psqlrc -X -A -t -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 -c \
            "SELECT CASE WHEN (now() AT TIME ZONE 'Pacific/Kiritimati')::date <> (now() AT TIME ZONE 'UTC')::date
                         THEN 'Pacific/Kiritimati' ELSE 'Pacific/Pago_Pago' END")
          # ⚠️ Da stdin e non con `-c`: psql sostituisce `:'fuso'` solo li'.
          psql --no-psqlrc -X -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -v fuso="$ostile" <<'SQL'
          UPDATE config.parameters SET default_value = :'fuso' WHERE code = 'SYSTEM_FUSO_ORARIO';
          SQL
          echo "fuso aziendale per i test Django: $ostile (seed: $prima, adesso UTC: $(date -u +%H:%M))"

      - name: Django tests
        working-directory: ./backend
        env:
          # ⭐ I TEST GIRANO COME L'APPLICAZIONE, non come l'owner. L'env del job
          # dice `DB_USER: zeroerp` perche' e' l'utente di Liquibase e di
          # `manage.py migrate` — l'OWNER degli oggetti — e l'owner di una
          # tabella SALTA la RLS finche' non c'e' `FORCE ROW LEVEL SECURITY`
          # (che il repo rifiuta apposta, vedi 20260829-27). Con quel ruolo un
          # test end-to-end che prova il 404 no-leak dell'altro emittente
          # (apps/magazzino/tests/db/test_documento_interno_db) vede TUTTO e
          # va rosso — «atteso un rifiuto, e' passato», 2026-09-19 — mentre in
          # sviluppo, dove `.env.systemd` connette `zeroerp_app`, e' verde.
          # E' la stessa scelta del runner pgTAP (PGTAP_RUNNER=app, default dal
          # 2026-08-07): la RLS si esercita solo con un ruolo NON owner e
          # NOBYPASSRLS. Il ruolo e i suoi privilegi arrivano dai passi
          # «DB bootstrap» e «Privilegi del ruolo applicativo», entrambi prima
          # di questo. La password e' il letterale del ruolo creato li'.
          DB_USER: zeroerp_app
          DB_PASSWORD: secret-app
          DJANGO_REQUEST_LOG_ENABLED: "0"
          # Allineato a manage-test.sh: neutralizza SearchBurstRateThrottle
          # (default 30/min). La LocMemCache non viene resettata tra
          # SimpleTestCase e il counter persiste tra test ravvicinati sugli
          # endpoint is_search_endpoint=True -> 429 falsi positivi.
          DJANGO_API_SEARCH_THROTTLE_RATE: "100000/min"
          # Gate deprecation Django 7.0: escala a errore i RemovedInDjango70Warning
          # emessi durante i test, cosi' un uso deprecato fa fallire il test che
          # lo tocca invece di scoprirli tutti al salto 6.x -> 7.0. Oggi la suite
          # ne emette 0: guard anti-regressione, non una bonifica. Il filtro e'
          # in settings.py (NON via PYTHONWARNINGS: la classe Django non e'
          # risolvibile all'avvio dell'interprete). Solo questa classe viene
          # escalata: le deprecation di terze parti (es. _UnionGenericAlias da
          # drf_spectacular) restano warning.
          DJANGO_DEPRECATION_GATE: "1"
          # Accende i 3 test end-to-end di apps/core/tests/services/test_db_error_fields:
          # RAISE nel DB -> psycopg -> django.db.DatabaseError -> ApiError -> HTTP status.
          # Sono l'UNICO punto che verifica la GIUNTURA fra le due meta' del
          # contratto del codice errore strutturato (20260805-05): che
          # `diag.constraint_name` sopravviva davvero al giro libpq/psycopg. I
          # pgTAP coprono il lato DB, i test unitari col diag finto coprono il
          # lato Python, ma nessuno dei due vede il pezzo in mezzo. Spenti di
          # default perche' richiedono un DB raggiungibile; qui c'e', ed e' stato
          # appena provvisto da Liquibase + manage.py migrate.
          #
          # ⚠️ PERCHE' FUNZIONANO, e quando smetteranno. Django crea il database
          # di test usa-e-getta SOLO se almeno un test dichiara di averne bisogno
          # (`django.test.TestCase` / `TransactionTestCase` / `databases = [...]`).
          # In questa suite NESSUNO lo fa — 114 `unittest.TestCase` e 86
          # `SimpleTestCase`, per la regola «i test devono girare senza DB reale»
          # di AGENTS.md — quindi il runner stampa «Skipping setup of unused
          # database(s)» e la connessione resta quella configurata, cioe' il DB
          # completo di schema Liquibase. Il giorno in cui un test dichiarera' un
          # database, il runner ne creera' uno vuoto per TUTTA la suite: li'
          # `script.fn_log_and_raise_error` non esiste e questi tre falliranno in
          # una PR che non c'entra niente. E' una dipendenza implicita, scritta
          # anche in .codex/AGENTS.md §Regole test Django.
          ZEROERP_TEST_DB_E2E: "1"
        run: |
          source .venv/bin/activate
          python manage.py test

      # Rimette il fuso del seed, anche se i test Django sono rossi: la suite
      # pgTAP (e ogni passo dopo) gira sul database com'e' nato.
      - name: Fuso aziendale del seed ripristinato
        if: ${{ !cancelled() && env.FUSO_AZIENDALE_SEED != '' }}
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          psql --no-psqlrc -X -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -v fuso="$FUSO_AZIENDALE_SEED" <<'SQL'
          UPDATE config.parameters SET default_value = :'fuso' WHERE code = 'SYSTEM_FUSO_ORARIO';
          SQL

      # ------------------------------------------------------------------
      # Suite pgTAP — 426 test DB, che fino al 2026-08-07 non giravano MAI in CI
      # ------------------------------------------------------------------
      # QUANDO GIRA, e perche' proprio cosi'. La suite costa ~7 minuti: farla a
      # ogni push sarebbe sproporzionato, farla solo verso `main` la farebbe
      # arrivare troppo tardi (il rosso spunta mescolato a giorni di lavoro
      # altrui, e bisecarlo costa piu' dei minuti risparmiati).
      #
      # Misurato sui 30 giorni al 2026-08-07, su Tito-dev: 656 commit, di cui
      # 155 toccano `db/` e 107 toccano SOLO `backend/`. Tito-dev e' anche il
      # ramo di scambio fra backend e DB, quindi buona parte del traffico non
      # riguarda il database: li' la suite girerebbe per niente.
      #
      #   - PR verso main      -> SEMPRE. E' il cancello prima dell'integrazione
      #   - push su Tito-dev   -> solo se la push tocca `db/` o `scripts/`
      #   - PR verso Tito-dev  -> mai (basta il cancello statico sul preambolo)
      - name: Il DB e' cambiato in questa push?
        id: db_cambiato
        # ⚠️ `!cancelled()` e non `always()`: deve girare anche dopo un passo
        #   rosso — altrimenti la suite pgTAP qui sotto resta senza la sua
        #   risposta e viene saltata per il motivo sbagliato — ma NON deve
        #   girare quando la corsa e' stata annullata a mano o soppiantata.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "esito=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE='${{ github.event.before }}'
          # ⚠️ Ramo appena creato o history non risolvibile: si sceglie di GIRARE.
          #   Un controllo che salta in silenzio quando non sa e' peggio di uno
          #   che gira di troppo — il costo e' 7 minuti, l'altro e' una
          #   regressione che passa.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "esito=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" -- db/ scripts/ | grep -q .; then
            echo "esito=si" >> "$GITHUB_OUTPUT"
          else
            echo "esito=no" >> "$GITHUB_OUTPUT"
            echo "::notice::push senza modifiche a db/ o scripts/: suite pgTAP saltata"
          fi

      - name: Suite pgTAP (PR verso main · push su Tito-dev che toccano il DB)
        # ⚠️ `event_name == 'push'` esplicito: senza, una PR verso Tito-dev
        #   passerebbe (il passo sopra risponde 'si' per ogni non-push).
        #   Trovato provando la tabella dei quattro casi a tavolino, non
        #   leggendo la condizione.
        #
        # ── 🔴 `!cancelled()` + `ci_apply`, e non `success()` implicito ──────
        #   Fino al 2026-09-10 questo passo ereditava il `success()` implicito
        #   di GitHub Actions: bastava che UN QUALUNQUE passo precedente fosse
        #   rosso perche' la suite venisse SALTATA. E il passo che precede e'
        #   «Django tests».
        #   ⛔ Successo davvero, quel giorno: un codice errore nuovo seminato da
        #     un changeSet DB ha fatto arrossire due presidi del backend
        #     (`test_error_codes_db_policy_guardrail`,
        #     `test_error_policies_divergenza_db`) — debito legittimo e di
        #     un'altra squadra — e la suite pgTAP non e' MAI PARTITA. Su una
        #     push che toccava solo `db/`, del database non si e' saputo niente.
        #   ⭐ *Un cancello non deve poter zittire un altro cancello*: sono due
        #     domande indipendenti e vogliono due risposte.
        #   ⚠️ Ma NON `always()`: il pgTAP ha senso solo su un database
        #     COMPLETO. La condizione e' `steps.fase_post.outcome == 'success'`,
        #     cioe' «i due migratori hanno finito, le automazioni sono passate
        #     e la postura dei ruoli e' data». Se e' il migrate a fallire,
        #     saltare e' giusto: una suite su un database a meta' non direbbe
        #     niente di vero, e direbbe rosso per il motivo sbagliato.
        #   ⛔ Fino al 2026-11-01 la condizione era `ci_apply`, che viene PRIMA
        #     di «Django migrate»: un rosso nel mezzo (il B-7, corsa
        #     41325095742) saltava il migrate e la suite girava lo stesso, su un
        #     database senza schema `django`. Per questo il migrate e la fase
        #     post hanno ora il loro `if` su `ci_apply`: un cancello in mezzo
        #     non li salta, e quindi non zittisce la suite.
        #   ⚠️ E il job resta ROSSO lo stesso: qui non si perdona niente, si
        #     smette solo di perdere una risposta. Non e' un `continue-on-error`
        #     — quello e' vietato due paragrafi piu' sotto, e per un'altra
        #     ragione ancora.
        if: >-
          ${{ !cancelled()
              && steps.fase_post.outcome == 'success'
              && (github.base_ref == 'main'
                  || (github.event_name == 'push' && steps.db_cambiato.outputs.esito == 'si')) }}
        # ⭐ ARMATO IL 2026-09-09, e fino a quel giorno non lo era: `continue-on-error`
        #   piu' una baseline mai committata tenevano questo passo nel ramo del
        #   bootstrap dal 2026-08-07. Per un mese la suite ha girato in CI e il
        #   suo esito e' stato buttato via — 601 file e ~6.200 asserzioni che non
        #   difendevano l'integrazione. Il sintomo non c'era: la corsa era verde.
        #   ⛔ Non rimetterlo. Se un rosso nuovo ferma un merge, il rosso e' il
        #   messaggio: o e' una regressione, o e' un file che va in baseline con
        #   la sua ragione scritta.
        env:
          # ⚠️ Baseline SEPARATA da quella di sviluppo, e non e' pigrizia.
          #   Quella committata (db/pgtap/baseline-rossi.tsv) e' misurata sul DB
          #   di sviluppo, che ha dati veri; qui il database e' ricostruito da
          #   zero, quindi i test che dipendono da dati preesistenti falliscono
          #   qui e non la'. Sono due popolazioni diverse: confrontarle
          #   produrrebbe decine di finte regressioni — lo stesso difetto di
          #   metro disomogeneo che ha originato tutto il cantiere.
          PGTAP_BASELINE: db/pgtap/baseline-rossi-ci.tsv
        run: |
          set -uo pipefail

          # pg_prove gira sul RUNNER (non nel container): e' Perl e parla col DB
          # via rete. L'estensione pgtap invece sta nel container, installata
          # insieme a plpgsql_check.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtap-parser-sourcehandler-pgtap-perl

          PGPASSWORD='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' \
          psql --no-psqlrc -h localhost -p 5432 -U postgres -d zeroerp -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

          # scripts/testpgtap.sh pretende un env file (db/internal.env e'
          # gitignored e in CI non esiste). Qui dentro l'OWNER degli oggetti e'
          # `zeroerp`, l'utente con cui gira Liquibase — non `titodb`.
          cat > db/internal.env <<'ENVEOF'
          PGUSER=zeroerp_owner
          PGPASSWORD=secret-owner
          PGHOST=localhost
          PGPORT=5432
          PGDATABASE=zeroerp
          ENVEOF
          sed -i 's/^[[:space:]]*//' db/internal.env

          # La password dell'utente applicativo il runner la vuole da ~/.pgpass:
          # in modalita' `app` toglie apposta PGPASSWORD, altrimenti userebbe
          # quella dell'owner sull'utente sbagliato.
          echo 'localhost:5432:zeroerp:zeroerp_app:secret-app' > ~/.pgpass
          chmod 600 ~/.pgpass

          echo "runner risolto: $(scripts/testpgtap.sh --print-runner)"

          if [ ! -f "$PGTAP_BASELINE" ]; then
            # ⛔ GENERA, STAMPA, E FALLISCE. Le tre cose insieme.
            #   Fino al 2026-09-09 questo ramo usciva 0: era giusto per il primo
            #   giro — la baseline non si puo' indovinare, dipende da quali test
            #   reggono su un database ricostruito da zero — ed e' diventato una
            #   mina il giorno dopo. Con il cancello armato bastava che il file
            #   sparisse (un rebase sfortunato, una cancellazione per sbaglio)
            #   perche' la CI tornasse in silenzio a non misurare niente: verde,
            #   e cieca. E' esattamente lo stato in cui e' rimasta per un mese.
            #   ⭐ La regola che il progetto si e' dato per i presidi e' «fai
            #   fallire il controllo quando non puo' misurare». Il servizio utile
            #   — stampare la baseline pronta da copiare — resta; a cambiare e'
            #   che la corsa NON passa. Chi la rigenera di proposito
            #   (`git rm db/pgtap/baseline-rossi-ci.tsv`) si aspetta un rosso e
            #   sa cosa farne; chi l'ha persa se ne accorge subito.
            echo "::error::baseline CI assente ($PGTAP_BASELINE): la suite non e' stata CONFRONTATA."
            scripts/pgtap-baseline.sh --update || true
            echo "----- 8< ----- db/pgtap/baseline-rossi-ci.tsv ----- 8< -----"
            cat "$PGTAP_BASELINE"
            echo "----- >8 ----------------------------------------- >8 -----"
            echo "Copia il blocco qui sopra nel file, committalo, e questa corsa tornera' verde."
            exit 1
          fi

          scripts/pgtap-baseline.sh

  # Validazione artefatti di deploy dei worker (systemd timer). Job leggero e
  # indipendente: NON esegue i timer (la CI non è un host di runtime), ne
  # garantisce la VALIDITÀ prima che raggiungano un host. Vedi
  # brief-deploy-worker-riproducibilita-ci.md §3.
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint script bash (bash -n + shellcheck)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
          rc=0
          for f in backend/bin/*.sh; do
            echo "· $f"
            bash -n "$f" || rc=1
            shellcheck "$f" || rc=1
          done
          exit "$rc"

      - name: Valida unit systemd dei worker (render template + systemd-analyze verify)
        run: |
          command -v systemd-analyze >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y systemd; }
          OUT="$(mktemp -d)"
          # Render REALE tramite l'installer (stessa fonte di verità del deploy),
          # senza root né systemctl. APP_DIR = questo backend → gli ExecStart
          # puntano al wrapper committato (esiste ed è eseguibile) e la verify
          # passa; un unit malformato (OnCalendar rotto, ExecStart assente, ...)
          # fa fallire il job.
          bash backend/bin/install-timers.sh --render-only "$OUT"
          systemd-analyze verify "$OUT"/*.service "$OUT"/*.timer
          echo "Unit systemd dei worker validati."

      - name: Prova il ramo che ACCENDE gli unit (systemctl finto)
        run: |
          # ⭐ L'ALTRA META', e finora mancava. Lo step qui sopra prova che gli
          # unit sono VALIDI; questo prova che si accendono QUELLI GIUSTI —
          # cioè il ramo che `--render-only` non attraversa.
          # 🔴 Il 2026-09-06 `zeroerp-listen-cambio-reparto` veniva installato e
          # mai avviato (slittamento di campi su un `oncalendar` vuoto), e la CI
          # non poteva vederlo: il difetto viveva dove la prova non arrivava.
          # Il test mette un `systemctl` finto in testa al PATH e sposta la
          # destinazione con ZEROERP_SYSTEMD_DIR: le righe eseguite sono le
          # STESSE della produzione, cambia solo dove atterrano.
          bash backend/scripts/tests/test-install-timers.sh
