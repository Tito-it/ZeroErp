            constraints:
              nullable: false
            defaultValue: CURRENT_USER
            name: user_insert
            type: TEXT
        - column:
            constraints:
              nullable: false
            defaultValueComputed: now()
            name: data_update
            type: TIMESTAMP WITH TIME ZONE
