            name: titolo_cortesia_id
            type: INTEGER
        - column:
            name: identificativo_old
            remarks: Utilizzare per conversione da altri applicativi
            type: VARCHAR
        - column:
            defaultValueComputed: GENERATED ALWAYS AS COALESCE(ragione_sociale, ((cognome
              || ' '::text) || nome)) STORED
            name: ragione_sociale_completa
            type: TEXT
        - column:
            name: default_contatto_id
            type: INTEGER
        - column:
            name: tipo_soggetto_dettaglio_id
            remarks: Riferimento a config.tipi_soggetto_dettaglio per controlli CF/P.IVA
            type: BIGINT
        - column:
            defaultValueComputed: "GENERATED ALWAYS AS CASE\n    WHEN ((codice_fiscale\
              \ IS NOT NULL) AND (partita_iva IS NOT NULL) AND (codice_fiscale <>\
              \ partita_iva)) THEN ((codice_fiscale || ' '::text) || partita_iva)\n\
              \    ELSE COALESCE(codice_fiscale, partita_iva)\nEND STORED"
            name: id_fiscale_univoco_cf_piva
            type: TEXT
        - column:
            name: tx_id
            type: UUID
        - column:
            constraints:
              nullable: false
            defaultValueBoolean: true
            name: storicizza
            remarks: Se true, il soggetto viene storicizzato in storico.soggetti
            type: BOOLEAN
        - column:
            constraints:
              nullable: false
            defaultValueBoolean: true
            name: attivo
            remarks: Stato attivo/inattivo del soggetto (DEFAULT TRUE)
            type: BOOLEAN
        remarks: Anagrafica soggetti (persone fisiche e giuridiche)
