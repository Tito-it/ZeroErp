# Il job pgAgent automations_guard_utility (Q14 ⑬, N5): il guard utility/tipo ruolo diventa un
#   processo come le altre automazioni, ogni notte alle 21:10 con il blocco delle cancellazioni.
#   Prima girava solo nel primo giro di ci_apply: invisibile al panorama dei processi, e una tabella
#   nuova fra due migrazioni restava senza guard. Il jobname e' il codice in dbops.processi.
#   Brief: brief-db-revisione-dbops, giro 10c, blocco 10c-2 (§28).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/85_pgagent/20261110-05-create-pgagent-job-automations-guard-utility-mctit.yaml

  - changeSet:
      id: 20261110-05-create-pgagent-job-automations-guard-utility
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea il job pgAgent automations_guard_utility (ogni giorno alle 21:10), che chiama
        maintenance.proc_automations_guard_utility_job(). Brief: brief-db-revisione-dbops, giro 10c.
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
              FROM pg_extension
              WHERE extname = 'pgagent'
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
                 DECLARE
                   v_classid INTEGER;
                   v_jobid   INTEGER;
                 BEGIN
                   SELECT jclid INTO v_classid
                     FROM pgagent.pga_jobclass
                    WHERE jclname = 'Routine Maintenance'
                    LIMIT 1;

                   IF v_classid IS NULL THEN
                     INSERT INTO pgagent.pga_jobclass (jclname, jcldesc)
                     VALUES ('Routine Maintenance', 'Default job class')
                     RETURNING jclid INTO v_classid;
                   END IF;

                   -- ⚠️ Il jobname DEVE essere identico al codice in dbops.processi, o
                   --   maintenance.fn_run_and_log non sa derivare l'attore.
                   DELETE FROM pgagent.pga_job WHERE jobname = 'automations_guard_utility';

                   INSERT INTO pgagent.pga_job(jobjclid, jobname, jobdesc, jobenabled)
                   VALUES (v_classid, 'automations_guard_utility',
                           'Porta il guard utility/tipo ruolo allo stato di dbops.automazione_guard_utility_tipo_ruolo',
                           true)
                   RETURNING jobid INTO v_jobid;

                   -- 21:10, con il blocco delle cancellazioni: dopo la famiglia delle 21:00.
                   INSERT INTO pgagent.pga_schedule(
                     jscjobid, jscname, jscenabled,
                     jscminutes, jschours, jscweekdays,
                     jscmonthdays, jscmonths, jscstart
                   ) VALUES (
                     v_jobid,
                     'daily_21_10',
                     true,
                     (SELECT array_agg((i = 10)::boolean) FROM generate_series(0,59) AS g(i)),
                     (SELECT array_agg((i = 21)::boolean) FROM generate_series(0,23) AS g(i)),
                     array_fill(TRUE, ARRAY[7])::boolean[],
                     array_fill(TRUE, ARRAY[32])::boolean[],
                     array_fill(TRUE, ARRAY[12])::boolean[],
                     now()
                   );

                   -- ⚠️ Il passo nasce GIA' avvolto nel cancello della sveglia, nella
                   --   stessa forma che scrive 85_pgagent/20261016-30: quel changeSet
                   --   avvolge solo i job che c'erano. Lo presidia
                   --   db/pgtap/dbops/test-installazione-ambiente-v1 (test 20-22).
                   INSERT INTO pgagent.pga_jobstep(
                     jstjobid, jstname, jstkind, jstcode, jstdbname
                   ) VALUES (
                     v_jobid, 'run_automations_guard_utility', 's',
                     format(
                       E'DO $sveglia$\nBEGIN\n    -- Cancello della sveglia (85_pgagent/20261016-30): da spento\n    -- il lavoro non parte e il giornale non scrive niente.\n    IF maintenance.fn_sveglia_accesa(%L) THEN\n        %s\n    END IF;\nEND\n$sveglia$;',
                       'automations_guard_utility',
                       'CALL maintenance.proc_automations_guard_utility_job();'),
                     current_database()
                   );
                 END;
                 $$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM pgagent.pga_job WHERE jobname = 'automations_guard_utility';
