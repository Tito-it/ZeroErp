databaseChangeLog:
  - changeSet:
      id: 20250808-11-create-pgagent-job-apply-storicizza-weekly
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comments: >
        Crea/aggiorna un job pgAgent che esegue ogni sabato alle 07:00
        il wrapper maintenance.proc_apply_storicizza_defaults_job().
      
      #preConditions:
      #  - onFail: CONTINUE
      #    onError: CONTINUE
      #    always: true
          #tableExists:
          #  schemaName: pgagent
          #  tableName: pga_jo
      
      preConditions:
        - onFail: MARK_RAN
          onError: CONTINUE
          sqlCheck:
             expectedResult: 1
             sql: |
                SELECT COUNT(*) 
                FROM pg_extension 
                WHERE extname = 'pgagent'
      
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
               DO $$
                  DECLARE
                    v_jobid   INTEGER;
                    v_classid INTEGER;
                  BEGIN
                    -- 1) Classe 'Routine Maintenance ' -- 

                    SELECT jclid INTO v_classid
                      FROM pgagent.pga_jobclass
                      WHERE jclname = 'Routine Maintenance'
                      LIMIT 1;

                      IF v_classid IS NULL THEN
                        INSERT INTO pgagent.pga_jobclass (jclname, jcldesc)
                        VALUES ('Routine Maintenance', 'Default job class')
                        RETURNING jclid INTO v_classid;
                      END IF;

                    -- 2) Elimina eventuale job omonimo
                    DELETE FROM pgagent.pga_job
                    WHERE jobname = 'apply_storicizza_weekly';

                    -- 3) Crea il job
                    INSERT INTO pgagent.pga_job(
                      jobjclid, jobname, jobdesc, jobenabled
                    ) VALUES (
                      v_classid,
                      'apply_storicizza_weekly',
                      'Setta DEFAULT=true su colonne "storicizza" ogni sabato ore 07:00',
                      true
                    )
                    RETURNING jobid INTO v_jobid;

                    -- 4) Schedule: sabato alle 07:00 precise
                    INSERT INTO pgagent.pga_schedule(
                      jscjobid, jscname, jscenabled,
                      jscminutes, jschours, jscweekdays,
                      jscmonthdays, jscmonths, jscstart
                    ) VALUES (
                      v_jobid,
                      'sat_07',
                      true,
                      (SELECT array_agg((i = 0)::boolean)  FROM generate_series(0,59) AS g(i)),  -- 60 elem, solo minuto 0 = TRUE
                      (SELECT array_agg((i = 7)::boolean)  FROM generate_series(0,23) AS g(i)),  -- 24 elem, solo ora 7 = TRUE
                      ARRAY[FALSE,FALSE,FALSE,FALSE,FALSE,FALSE,TRUE]::boolean[],                -- sabato
                      array_fill(TRUE, ARRAY[32])::boolean[],                                    -- giorni del mese tutti TRUE
                      array_fill(TRUE, ARRAY[12])::boolean[],                                    -- mesi tutti TRUE
                      now()
                    );

                    -- 5) Step: usa il wrapper maintenance.run_and_log con CALL (non SELECT)
                    INSERT INTO pgagent.pga_jobstep(
                      jstjobid, jstname, jstkind, jstcode, jstdbname
                    ) VALUES (
                      v_jobid,
                      'run_apply_storicizza',
                      's',  -- SQL
                      $step$
                         call maintenance.proc_apply_storicizza_defaults_job();
                      $step$,
                      current_database()
                    );
                  END;
                  $$;


