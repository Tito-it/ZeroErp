# ⭐ SPOSTATO il 2026-10-09 da 80_data/changelog/ a 70_dati_sistema/
#   (brief-be-db-fe-un-solo-fuso-aziendale, T-8). Il codice di 20_code legge
#   questo parametro (script.fn_fuso_operativo, fn_data_operativa: trigger,
#   DEFAULT, guard), e su un database da zero girava PRIMA del parametro: un
#   seed di 80_data anteriore a questo, che passasse da uno di quei trigger,
#   avrebbe fermato la creazione del database con E_CONFIG_MANCANTE. La fase
#   70_dati_sistema gira dopo il codice e prima di tutto 80_data.
#   ⚠️ Il logicalFilePath resta quello vecchio: e' l'identita' del changeSet,
#   e su ogni database gia' migrato risulta eseguito. Cambia solo il percorso
#   del CSV (relativo al file): il checksum cambia, e con runOnChange il
#   changeSet rigira una volta — un upsert della stessa riga, nessun dato
#   cambia. Il CSV resta in 80_data/sql/config/, sede unica del valore.
# DB-1 — SEED DEL PARAMETRO SYSTEM_FUSO_ORARIO (id 54)
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §4 DB-1
#
#   Il fuso orario dell'azienda. Lo legge script.fn_data_operativa(), che
#   sostituisce `current_date` sul percorso della data documento: `current_date`
#   segue il fuso DELLA SESSIONE, e la sessione di Django e' UTC mentre psql e
#   pgAgent sono Europe/Rome — lo stesso oggetto dava due date diverse secondo il
#   canale, e ogni documento nato fra mezzanotte e le 02:00 locali portava la
#   data del giorno prima (misurato: 7 fatture su 18).
#
# ── ⛔ PERCHE' UN CSV DEDICATO E NON UN APPEND A parameters.csv ─────
#   Perche' e' stato provato, ed e' ESPLOSO. `parameters.csv` e' una MINA
#   DORMIENTE: contiene la riga `DEFAULT_UTILITY` (id 12) con
#   `default_value = ''`, e quel valore **non e' piu' scrivibile**. Il dispatcher
#   `config.trgfn_parameters_fk_surrogate_dispatch` — entrato DOPO che quella
#   riga fu scritta — pretende che il valore esista in
#   `config.utilities.codice_interno`, e la stringa vuota non c'e'.
#
#   Il mirror `20250715-01-upsert_parameters` e' `runOnChange: true`: **dorme
#   finche' nessuno tocca il file**. Un semplice append in coda ne cambia il
#   checksum, lo sveglia, e la ri-lettura muore su una riga che non c'entra
#   niente con chi ha appeso — `E_PARAMETER_DEFAULT_VALUE_INVALID`, e il migrate
#   si ferma.
#
#   ⚠️ E non e' un problema di CSV disallineato dal database: il database ha
#   ESATTAMENTE lo stesso valore. La riga e' identica e **irriscrivibile lo
#   stesso**. Un confronto CSV-vs-DB non lo vede: l'unica verifica che lo
#   trovava era provare a RIESEGUIRE il loader.
#
#   ⛔ SUPERATO il 2026-10-25 (brief-db-parametri-senza-override, D-3): i CSV
#   «per famiglia» di 80_data sono confluiti in `parameters.csv` (una tabella,
#   un CSV). `parameters_sistema.csv` resta separato per una ragione d'ORDINE,
#   non di famiglia: lo carica questa fase, che gira prima di 80_data (vedi
#   sopra). La mina di DEFAULT_UTILITY e' disinnescata da 20260831-36.
#
# ── ℹ️ IL DISPATCHER QUI E' UN NO-OP ────────────────────────────────
#   `SYSTEM_FUSO_ORARIO` non corrisponde a nessuno dei quattro pattern attivi in
#   `config.parameter_fk_surrogate` (`DEFAULT_TIPO_SOGGETTO_DETTAGLIO_%`,
#   `DEFAULT_UTILITY`, `NOTE_DEFAULT_STILE`, `NOTE_DEFAULT_LINGUA`), quindi il
#   trigger esce subito. ⚠️ E non deve entrarci: il valore non punta a una
#   tabella di catalogo, punta a `pg_timezone_names` — che il catalogo non e' e
#   il framework non sa raggiungere. A validarlo e' `script.fn_data_operativa()`
#   stessa, che rifiuta un fuso non riconosciuto.
#
# Dipendenze: nessuna. ⚠️ La usa script.fn_data_operativa (20260825-02), che pero'
#             vive in 20_code e quindi esiste GIA' quando questo file gira: fra
#             il migrate di quella fase e questo seed la funzione solleva
#             E_CONFIG_MANCANTE. E' voluto — meglio un errore parlante che una
#             data presa da un fuso a caso — ma nessuno deve fatturare in mezzo
#             a un migrate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260825-12-upsert-parameter-system-fuso-orario-mctit.yaml

  - changeSet:
      id: 20260825-12-upsert-parameter-system-fuso-orario
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-1: parametro id=54, code='SYSTEM_FUSO_ORARIO', default_value='Europe/Rome'. E' il
        fuso dell'AZIENDA, che script.fn_data_operativa() usa al posto di current_date —
        current_date segue il fuso della SESSIONE, UTC da Django ed Europe/Rome da psql e
        pgAgent. ⛔ CSV DEDICATO e non un append a parameters.csv: quel file e' una mina
        dormiente (la riga DEFAULT_UTILITY ha default_value = '' e il dispatcher FK-surrogata,
        entrato dopo, non la accetta piu'), e un append ne cambia il checksum svegliando un
        mirror runOnChange che muore su una riga di qualcun altro. Un confronto CSV-vs-DB non
        lo vede: la riga e' identica al database e irriscrivibile lo stesso. ℹ️ Su questo
        parametro il dispatcher e' no-op: nessun pattern lo intercetta, e non deve — il valore
        punta a pg_timezone_names, che non e' una tabella di catalogo. Lo valida
        fn_data_operativa stessa.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameters
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT COUNT(*) FROM config.parameters
                   WHERE id = 54 AND code <> 'SYSTEM_FUSO_ORARIO';
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../80_data/sql/config/parameters_sistema.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,            type: NUMERIC }
              - column: { name: code,          type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description,   type: STRING }
              - column: { name: data_insert,   type: STRING }
              - column: { name: user_insert,   type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,   type: STRING }
              - column: { name: tx_id,         type: uuid }
              - column: { name: storicizza,    type: BOOLEAN }
              # 2026-10-25 (brief-db-parametri-senza-override, D-1): la famiglia
              # del parametro; i due SYSTEM_* sono senza override (false).
              - column: { name: ammette_override, type: BOOLEAN }
              # 2026-10-31 (brief-db-liste-datatable-grezze-secondo-giro, D-5): la
              # forma del valore; SYSTEM_FUSO_ORARIO e' TESTO (lo valida
              # fn_data_operativa), SYSTEM_IDEMPOTENZA_IN_CORSO_SECONDI INTERO_POSITIVO.
              - column: { name: tipo_valore, type: STRING }
