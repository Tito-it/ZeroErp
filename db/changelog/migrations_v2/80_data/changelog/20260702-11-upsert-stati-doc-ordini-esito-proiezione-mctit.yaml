# Proiezione stato di dominio — seed della colonna `esito` su
# config.stati_doc_ordini (roll-out §7; playbook 20260701-19).
#
# PERCHE' UPDATE E NON CSV: il changeset CSV 20250912-02 ha nullValue:"" e i
# molti stati di fulfillment (DRAFT/CONFERMATO/ALLOCATO/SPEDITO/CONSEGNATO)
# richiedono esito NULL -> non esprimibile in CSV
# (feedback_liquibase_csv_null_sentinel). fase/terminale (mai NULL) restano in CSV.
#
# ORDINE fresh-DB: 20250912-02 (load CSV) precede questo file dentro 80_data.
# Sul DB vivo il backfill 20260702-03 ha gia' valorizzato: UPDATE idempotente.
#
# Guard trg_stati_doc_ordini_a10_guard_esito_verdetto_ins_upd attivo: solo
# verdetti (POSITIVO/NEGATIVO). Keyed su codice_interno, mai id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260702-11-upsert-stati-doc-ordini-esito-proiezione-mctit.yaml

  - changeSet:
      id: 20260702-11-upsert-stati-doc-ordini-esito-proiezione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Seed della proiezione `esito` su config.stati_doc_ordini (UPDATE
        idempotente keyed su codice_interno): EVASO/FATTURATO=POSITIVO,
        ANNULLATO=NEGATIVO, tutti gli stati di fulfillment=NULL. In UPDATE e non
        in CSV perche' il changeset CSV (nullValue:"") non puo' esprimere NULL.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM information_schema.columns
               WHERE table_schema = 'config'
                 AND table_name   = 'stati_doc_ordini'
                 AND column_name  = 'esito';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Verdetti proiettati (mappa universale brief design §3).
              UPDATE config.stati_doc_ordini s
                 SET esito = m.esito
                FROM (VALUES
                        ('EVASO',     'POSITIVO'),
                        ('FATTURATO', 'POSITIVO'),
                        ('ANNULLATO', 'NEGATIVO')
                     ) AS m(codice_interno, esito)
               WHERE s.codice_interno = m.codice_interno
                 AND s.esito IS DISTINCT FROM m.esito;

              -- Nessun verdetto per gli stati non conclusivi (re-seed-safe).
              UPDATE config.stati_doc_ordini s
                 SET esito = NULL
               WHERE s.codice_interno IN ('DRAFT', 'CONFERMATO', 'ALLOCATO', 'SPEDITO', 'CONSEGNATO')
                 AND s.esito IS NOT NULL;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              UPDATE config.stati_doc_ordini
                 SET esito = NULL
               WHERE esito IS NOT NULL;
