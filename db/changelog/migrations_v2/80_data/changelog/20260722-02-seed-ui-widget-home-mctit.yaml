# Seed ui.widget — catalogo GLOBALE dei widget (mini-brief GRANT+seed §2).
# Quattro widget v1: una card di benvenuto non-gated + i tre cruscotti vendite.
#
# VINCOLO "MAI UNA HOME VUOTA" (brief DB §3.bis): 'home.benvenuto' ha
# area_id E azione_id NULL. Il filtro permessi della fn_resolve_dashboard_config
# e' ORTOGONALE alla cascata preset: senza almeno un widget non-gated puo'
# svuotare la home a un utente senza area vendite. Non toccare quei due NULL.
#
# INVARIANTE PERMESSI <-> DEEP-LINK (mini-brief §2 vincolo 3): l'area dichiarata
# dal widget e' quella che guarda la rotta di destinazione. I tre widget gated
# puntano a rotte del dominio 'vendite' (navigation.js gruppo 'vendite') ->
# area_id = 2 (config.aree_funzionali codice 'vendite', schema_db 'vendite',
# la chiave su cui il resolver valuta il gate). Un widget visibile che porta a
# una rotta bloccata sarebbe un vicolo cieco.
#
# DEEP-LINK (mini-brief §2 vincolo 2): deep_link.path deve combaciare con il
# 'to' della voce di menu in frontend/src/core/navigation.js (gruppo 'vendite'),
# perche' il FE risolve il link cercando quella voce per aprire tab e sidebar
# coerenti. Verificato 2026-07-22: /vendite/situazione-aperta,
# /vendite/dashboard-competenza, /vendite/dashboard-backlog esistono tutte e
# tre. Una path che non corrisponde da' una card non cliccabile (by design).
#
# soglia NULL su tutti: semafori neutri in v1 per decisione presa (si tarano
# sui dati reali). Il FE valuta gia' la soglia quando arrivera': bastera'
# popolare il campo, senza toccare il frontend.
#
# tipo_widget NON e' nel CSV: la colonna ha DEFAULT 'kpi' e tutti e quattro
# sono kpi. Ometterla evita di passare un parametro varchar a una colonna
# ENUM (ui.tipo_widget) da loadUpdateData.
#
# NULL da CSV: token letterale NULL + nullValue "NULL", non la cella vuota.
# Obbligatorio qui perche' deep_link/soglia sono JSONB: una cella vuota
# diventerebbe '' -> "invalid input syntax for type json".
#
# Sequenza identity riallineata in 90_end/20260722-07 (seed con id espliciti).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260722-02-seed-ui-widget-home-mctit.yaml

  - changeSet:
      id: 20260722-02-seed-ui-widget-home
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Catalogo widget v1 della dashboard 'home': benvenuto (non-gated, garanzia
        "mai vuota") + situazione aperta / da fatturare / documenti fermi (gated
        area vendite). soglia NULL: semafori neutri in v1.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: ui
            tableName: widget
        # L'area 'vendite' deve esistere: e' il gate dei tre widget gated e il
        # FK fallirebbe a valle in modo meno leggibile.
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM config.aree_funzionali
               WHERE id = 2
                 AND schema_db = 'vendite';
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/ui/widget.csv
            tableName: widget
            schemaName: ui
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,                  type: NUMERIC }
              - column: { name: codice,              type: STRING }
              - column: { name: etichetta,           type: STRING }
              - column: { name: etichetta_i18n_key,  type: STRING }
              - column: { name: deep_link,           type: CLOB }
              - column: { name: contatore_key,       type: STRING }
              - column: { name: soglia,              type: CLOB }
              - column: { name: area_id,             type: NUMERIC }
              - column: { name: azione_id,           type: NUMERIC }
              - column: { name: attivo,              type: BOOLEAN }
              - column: { name: data_insert,         type: STRING }
              - column: { name: user_insert,         type: STRING }
