databaseChangeLog:
  - changeSet:
      id: 20260410-11-upsert-config-area-model-overrides
      logicalFilePath: migrations_v2/80_data/changelog/20260410-11-upsert-config-area-model-overrides-mctit.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: area_model_overrides
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Popolare il catalogo dei model Django configurabili per
              --   gli override oggetto operatore.
              --
              -- Regole:
              --   - app_label + model_name sono identificatori logici Django
              --   - area_id punta a config.aree_funzionali
              --   - inserimento idempotente via ON CONFLICT
              -- =========================================================

              INSERT INTO config.area_model_overrides (
                  app_label,
                  model_name,
                  area_id
              )
              VALUES
                  -- anagrafiche (area_id = 1)
                  ('anagrafiche', 'soggetto',        1),
                  ('anagrafiche', 'cliente',         1),
                  ('anagrafiche', 'fornitore',       1),
                  ('anagrafiche', 'billing_account', 1),
                  ('anagrafiche', 'conto_bancario',  1),
                  -- vendite (area_id = 2)
                  ('vendite', 'fattura',             2),
                  ('vendite', 'preventivo',          2),
                  ('vendite', 'listino',             2),
                  -- pratiche (area_id = 12)
                  ('pratiche', 'pratica',           12),
                  -- catalogo (area_id = 4)
                  ('catalogo', 'articolo',           4),
                  ('catalogo', 'unita_misura',       4)
              ON CONFLICT (app_label, model_name) DO NOTHING;
