# C2-1 (coda) — registro indici FK per la famiglia del registro
#   Piano: brief-db-registri-di-numerazione-emittente-e-trasloco, C2-1 (§3.1)
#
# ── UN SOLO NO, e la ragione ──────────────────────────────────────
#   `fk_registri_fatturazione_famiglia` non prende un indice dedicato:
#     * `vendite.registri_fatturazione` e' una tabella di CONFIGURAZIONE con
#       una manciata di righe — il controllo referenziale scatta solo quando
#       qualcuno prova a cancellare una famiglia, e su quel volume una
#       scansione costa meno del mantenimento di un indice;
#     * l'ingresso vero dalla famiglia e' gia' servito da
#       `uq_registri_fatturazione_famiglia_emittente_utility`, che ha
#       `famiglia_documento` come PRIMA colonna — un btree serve i prefissi.
#       ⚠️ Quell'indice e' PARZIALE (`WHERE famiglia_documento <> 'FATTURA'`),
#       quindi non copre le righe FATTURA: e' la ragione per cui il no si
#       argomenta sul VOLUME e non solo sulla copertura.
#
# ── ⚠️ `dll_command` VALORIZZATO ANCHE CON `consentito = false` ────
#   Lo impone `chk_fk_index_policy_dll_command_forma`, e serve: con il flag a
#   falso la procedura ne estrae il NOME ed esegue il `DROP` su quello.
#   ⛔ Per questo il comando nomina l'indice DEDICATO canonico
#   (`ix_registri_fatturazione_famiglia_documento`) e non l'indice parziale che
#   esiste davvero: nominare quello farebbe cancellare, al primo `90_end`,
#   l'unicita' su cui si regge la risoluzione del registro — e nessuno
#   collegherebbe le due cose.
#
# ── ⛔ IL CSV SI FERMA A `data_insert`, E NON E' UNA DIMENTICANZA ──
#   `user_update` e `data_update` NON si caricano: valgono i default della
#   tabella. Caricarli con la CELLA VUOTA li manda al database come stringa
#   vuota, e un `''` dentro un `timestamptz` non e' un NULL — e' un errore di
#   sintassi che ferma il migrate a meta'.
#   ⚠️ E' successo davvero, al primo tentativo (2026-08-31): il CSV aveva dieci
#   colonne con le ultime due vuote, e il migrate si e' fermato su
#   «sintassi di input non valida per il tipo timestamp with time zone: ""».
#   ⭐ La forma giusta era gia' in casa e bastava guardarla:
#   `fk_index_policy_bonifica_ridondanze.csv` di colonne ne ha OTTO, e si ferma
#   esattamente qui. La regola generale e' quella gia' a registro: in un CSV
#   Liquibase il NULL e' un TOKEN dichiarato con `nullValue`, mai la cella vuota.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()`:
#    qui si tocca solo il flag.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260830-17-upsert-fk-index-policy-famiglia-documento-mctit.yaml

  - changeSet:
      id: 20260830-17-upsert-fk-index-policy-famiglia-documento
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_registri_fatturazione_famiglia: un solo NO. Non prende un indice
        dedicato perche'' vendite.registri_fatturazione e'' una tabella di configurazione con una
        manciata di righe — il controllo referenziale scatta solo quando si prova a cancellare una
        famiglia, e su quel volume la scansione costa meno del mantenimento — e perche'' l''ingresso
        dalla famiglia e'' gia'' servito per prefisso da
        uq_registri_fatturazione_famiglia_emittente_utility. ⚠️ Quell''indice e'' PARZIALE (esclude
        FATTURA), quindi il no si argomenta sul VOLUME e non solo sulla copertura. ⚠️ dll_command
        e'' valorizzato anche con consentito = false, come impone
        chk_fk_index_policy_dll_command_forma: con il flag a falso la procedura ne estrae il nome
        per il DROP. ⛔ Per questo nomina l''indice dedicato canonico e NON quello parziale che
        esiste: nominarlo farebbe cancellare al primo 90_end l''unicita'' su cui si regge la
        risoluzione del registro. Piano:
        brief-db-registri-di-numerazione-emittente-e-trasloco, C2-1.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: famiglia_documento
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_famiglie_documento.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
