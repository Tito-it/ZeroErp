databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260114-06-upsert-catalogo-articoli-table.yaml

  - changeSet:
      id: 20260114-06-upsert-catalogo-articoli-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: catalogo
            tableName: articoli
      changes:
        # Upsert dei dati nella tabella articoli
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/catalogo/articoli.csv
            tableName: articoli
            schemaName: catalogo
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: UUID }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: descrizione_breve, type: STRING }
              - column: { name: uom_id, type: STRING }
              - column: { name: tipo_voce_id, type: STRING }
              - column: { name: gruppo_voce_id, type: STRING }
              - column: { name: spesa_id, type: STRING }
              - column: { name: iva_id, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"

              - column: { name: user_update, type: STRING }
