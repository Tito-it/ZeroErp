# Seed pratiche.handler_flussi: handler 'vendita.post_smistamento' (id=9003).
# (brief-db-binding-handler-evento-smistamento, Fase 2 uniformita PREVENTIVI)
#
# E' l'azione di COMPLETATO del flusso SMISTAMENTO (9012) della catena PREVENTIVI:
# se lo smistamento ha prodotto un ordine merce lo aggancia alla pratica e crea
# on-demand i flussi CONFERMA_ORDINE/INVIO_COMMESSA. La LOGICA e' BE (vendite);
# questa riga e' solo il REGISTRO DB della handler_key (mappata in HANDLER_MAP
# lato BE via register_handler).
#
# CSV separato (additivo): NON tocca handler_flussi.csv ne'
# handler_flussi_accetta_preventivo.csv gia' mergiati.
# Deve caricare PRIMA del binding (FK fk_tfhe_handler): ordine NN 07 < 08.
# Gemello: 20260615-08 (accetta_preventivo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260630-07-seed-handler-flussi-post-smistamento-mctit.yaml

  - changeSet:
      id: 20260630-07-seed-handler-flussi-post-smistamento
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: pratiche
            tableName: handler_flussi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/handler_flussi_post_smistamento.csv
            tableName: handler_flussi
            schemaName: pratiche
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: handler_key, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Allineamento sequenza autoincrement post-seed (max id seed 9003).
              SELECT setval(
                  pg_get_serial_sequence('pratiche.handler_flussi', 'id'),
                  GREATEST(COALESCE(MAX(id), 1), 1),
                  true
              ) FROM pratiche.handler_flussi;
      rollback:
        - sql:
            sql: |
              DELETE FROM pratiche.handler_flussi
               WHERE handler_key = 'vendita.post_smistamento';
