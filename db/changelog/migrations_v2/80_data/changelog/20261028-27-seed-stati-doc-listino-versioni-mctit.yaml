# SEED DEL VOCABOLARIO DEGLI STATI DELLA VERSIONE DI LISTINO
#   Brief: brief-modello-documento-vendita §16 (L-1 di Tid, 2026-10-28).
#   Tabella: 20261028-03. Mirror del CSV (runOnChange, ANY): il CSV e' la
#   sorgente, una riga nuova o cambiata si scrive li'.
#   ⚠️ Gli id 2 (ATTIVA) e 3 (CHIUSA) sono scritti anche in
#   ex_listini_versioni_no_overlap e in chk_listini_versioni_chiusa_con_fine
#   (20261028-04): non si rinumerano.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261028-27-seed-stati-doc-listino-versioni-mctit.yaml

  - changeSet:
      id: 20261028-27-seed-stati-doc-listino-versioni
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_listino_versioni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_listino_versioni.csv
            tableName: stati_doc_listino_versioni
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: ordine, type: STRING }
              - column: { name: iniziale, type: BOOLEAN }
              - column: { name: terminale, type: BOOLEAN }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
