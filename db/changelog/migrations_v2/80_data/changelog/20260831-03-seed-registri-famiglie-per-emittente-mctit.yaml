# C2-12 — UN REGISTRO PER OGNI EMITTENTE E OGNI FAMIGLIA NON FISCALE
#   Piano: brief-db-registri-di-numerazione-emittente-e-trasloco, C2-12 (§3.5)
#   Corretto il 2026-09-17: brief-db-distinta-numerata-sul-registro, §9
#
# ── ⛔ VA PRIMA DEI GENERATORI, E NON E' UN DETTAGLIO D'ORDINE ─────
#   Dal C2-5 vendite.fn_get_registro_documento SOLLEVA quando un emittente non
#   ha il registro della famiglia richiesta: e' fail-closed, ed e' il verso
#   giusto — meglio fermarsi che numerare sul sezionale di un altro. Ma finche'
#   questo passo non e' fatto, quel «meglio fermarsi» significa che DDT, ordini,
#   resi e commesse NON NASCONO. I generatori (C2-8..11) si accendono dopo.
#
# ── ⚠️ PERCHE' NON E' UN CSV, e la deroga va argomentata ──────────
#   La regola di casa e' «il seed di 80_data sta in un CSV». Qui non si puo', e
#   non per comodita': queste righe DIPENDONO da quali emittenti esistono su
#   QUELLA macchina. Un CSV fotograferebbe gli emittenti di questo database e
#   su un'altra installazione creerebbe registri per emittenti che non ci sono
#   — o, peggio, ne lascerebbe senza. ⭐ Il catalogo delle famiglie, che invece
#   e' lo stesso ovunque, il CSV ce l'ha (20260830-14): la differenza fra i due
#   e' esattamente quella fra CATALOGO e DATO DI INSTALLAZIONE.
#
# ── ⭐ DAL 2026-09-17 IL CORPO E' LA PRIMITIVA, NON UN INSERT ──────
#   Il codice `<FAM3>-<soggetto_ruolo_id>` (l'id e non la sigla: 16 caratteri
#   contro 32, e troncare su una UNIQUE fa collidere due sigle simili), la
#   descrizione, `utility_id` NULL («vale per tutte», secondo livello del
#   fallback), prefisso e lunghezza dal catalogo famiglie: la regola vive in
#   vendite.fn_provision_registri (20260901-18) ed e' la stessa porta che usano
#   il trigger sull'emittente e il seed della DISTINTA (20260915-34). L'INSERT
#   che stava qui ne era la copia del 31-08, gia' senza prefisso ne' lunghezza.
#
# ── ⛔ IL CANCELLO CONTA LE QUATTRO FAMIGLIE PER NOME, NON «QUANTE SONO» ──
#   Fino al 2026-09-17 la preCondition pretendeva ESATTAMENTE 4 famiglie
#   attive ≠ FATTURA: una fotografia del catalogo di quel giorno, che la sesta
#   famiglia (DISTINTA, 20260915-33) ha smentito. Il corpo leggeva le famiglie
#   dal catalogo proprio per coprire da solo la sesta, e il cancello lo
#   contraddiceva. Adesso pretende che le QUATTRO per cui e' nato esistano
#   (`IN (...)`, expectedResult 4): e' il fail-closed che serve — il mirror
#   base deve essere passato, altrimenti la primitiva non troverebbe niente da
#   provvedere e nessun registro nascerebbe, in silenzio — senza pinnare il
#   totale. E' la forma dei quattro mirror laterali (`IN (...)`, 5 per nome).
#
# ── ⚠️ PERCHE' IL CANCELLO E' SCATTATO IN CI, E NON DOVE CI SI ASPETTAVA ──
#   Sulla carta, su un DB da zero questo passo gira PRIMA di 20260915-33:
#   l'ordine di 80_data lo garantisce, e la prova sullo scratch lo ha
#   confermato. Ma in Liquibase 5.0.4 un changeSet `runOnChange` con
#   `validCheckSums: ANY` che contiene un change con `dbms:` viene RI-ESEGUITO
#   UNA VOLTA all'update successivo alla sua prima esecuzione: con ANY la
#   validazione non calcola il checksum, e il filtro che decide se ri-eseguire
#   (ShouldRunChangeSetFilter) lo calcola FUORI dallo Scope che porta il
#   Database — ChangeLogIterator lo mette solo attorno alla visit — e senza
#   Database un change con `dbms: postgresql` viene ESCLUSO dal checksum
#   (ChangeSet.generateCheckSum → DatabaseList.definitionMatches con shortName
#   "null"). Il checksum salvato alla prima esecuzione (col Database) non
#   torna, il changeSet e' RERAN e da li' salva il checksum «di niente»: mai
#   piu' una ri-esecuzione, nemmeno editando l'SQL. In CI l'update successivo
#   e' la SECONDA invocazione di Liquibase (--contexts=ci_apply): li' questo
#   passo e' ripartito DOPO 20260915-33, ha contato 5 e ha ucciso la build
#   (2026-09-17, CI-Validate, «Expected '4' got '5'»). Su dbdev lo si legge dal
#   databasechangelog: 175 righe RERAN col checksum della stringa vuota.
#   ⛔ Per questo dal 2026-09-17 i change di questo passo NON portano `dbms:`
#   (bonifica dei 28 runOnChange di 80_data/90_end, guardrail in CI): il
#   cancello per nome resta comunque, perche' un cancello che regge solo
#   finche' nessuno lo ri-esegue e' un cancello rotto.
#
# ── ℹ️ L'EMITTENTE FUTURO ──────────────────────────────────────────
#   Lo provvede anagrafiche.trgfn_emittenti_fiscali_provision_registri
#   (trg_emittenti_fiscali_z90_provision_registri_ins_upd, 20260831-04): la
#   lacuna dichiarata nella prima stesura di questo passo e' chiusa.
#
# ⚠️ Idempotente: la primitiva inserisce solo la coppia (emittente, famiglia)
#   che manca. Ri-eseguirlo non duplica niente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260831-03-seed-registri-famiglie-per-emittente-mctit.yaml

  - changeSet:
      id: 20260831-03-seed-registri-famiglie-per-emittente
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      validCheckSums:
        - ANY
      # ⭐ rev 2026-10-20 (brief-db-grammatica-unica-documenti 2c, G-5): le famiglie si
      #    chiamano col codice della loro sorgente (20261020-32): DDT_VENDITA, ORDINE_VENDITA,
      #    RESO_VENDITA (COMMESSA resta). runOnChange + ANY: rigira, la primitiva e' idempotente.
      failOnError: true
      comment: >
        C2-12: un registro di numerazione per ogni emittente e ognuna delle quattro famiglie NON
        fiscali nate col catalogo (DDT, ORDINE, COMMESSA, RESO). ⛔ Va PRIMA dei generatori: dal
        C2-5 fn_get_registro_documento solleva quando il registro manca — fail-closed, verso
        giusto — e finche'' questo passo non e'' fatto quel «meglio fermarsi» significa che quei
        documenti non nascono. ⚠️ NON e'' un CSV, e la deroga e'' argomentata: queste righe
        dipendono da quali emittenti esistono su QUELLA macchina, e un CSV fotograferebbe questo
        database creando altrove registri per emittenti inesistenti — o lasciandone senza. Il
        catalogo delle famiglie, che invece e'' uguale ovunque, il CSV ce l''ha: e'' la differenza
        fra CATALOGO e DATO DI INSTALLAZIONE. ⭐ Dal 2026-09-17 il corpo chiama
        vendite.fn_provision_registri_famiglia per ciascuna delle quattro: la regola di come nasce
        un registro (codice con l''id, utility NULL, prefisso e lunghezza dal catalogo) vive nella
        primitiva, la stessa porta del trigger sull''emittente e del seed della DISTINTA. ⛔ Il
        cancello conta le quattro famiglie PER NOME: pretendere «esattamente 4 famiglie ≠ FATTURA»
        era una fotografia che la sesta (DISTINTA) ha smentito — e in Liquibase 5.0.4 un
        `runOnChange` con `validCheckSums: ANY` e un change `dbms:` viene ri-eseguito una volta
        all''update successivo alla prima esecuzione (il filtro calcola il checksum senza Database
        nello Scope e il change `dbms:` ne esce), cioe'' in CI nella seconda invocazione, DOPO il
        seed della DISTINTA: «Expected ''4'' got ''5''», 2026-09-17. Da allora i change non
        portano `dbms:` (bonifica dei 28 runOnChange di 80_data/90_end). ℹ️ L''emittente FUTURO lo provvede
        trgfn_emittenti_fiscali_provision_registri. Idempotente. Piano:
        brief-db-registri-di-numerazione-emittente-e-trasloco, C2-12; correzione in
        brief-db-distinta-numerata-sul-registro, §9.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: famiglia_documento
            # ⛔ Le QUATTRO famiglie per cui questo passo e' nato devono
            #    esistere: e' il segno che il mirror base (20260830-14) e'
            #    passato. Per NOME e non «quante sono»: il totale e' una
            #    fotografia, e la sesta famiglia l'ha smentita il 2026-09-17
            #    (vedi intestazione). Senza `attivo`: una famiglia spenta non
            #    e' una famiglia mancante, e la primitiva la salta da se'.
            - sqlCheck:
                expectedResult: 4
                sql: |
                  SELECT COUNT(*)
                    FROM vendite.famiglie_documento
                   WHERE codice_interno IN ('DDT_VENDITA', 'ORDINE_VENDITA', 'COMMESSA', 'RESO_VENDITA');
            # ⭐ La primitiva e' di 20_code (20260901-18) e su un DB da zero
            #    precede 80_data: il controllo costa niente e NOMINA la
            #    dipendenza, come fa 20260915-34.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_provision_registri_famiglia';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ⭐ La primitiva, non un INSERT ricopiato: la regola di come nasce
              --    un registro vive in vendite.fn_provision_registri.
              --    Una chiamata per famiglia, PER NOME: sono le quattro per cui
              --    questo passo e' nato. La sesta (DISTINTA) ha il suo passo
              --    (20260915-34), la settima avra' il suo.
              -- ⛔ La FATTURA resta fuori: il suo registro dipende da
              --    (tipo documento, natura) e passa da tipi_doc_fiscale_registri.
              --    Fabbricargliene uno «di famiglia» creerebbe un sezionale che
              --    nessuno risolve e che a video sembrerebbe configurazione —
              --    e la primitiva la esclude da se'.
              SELECT vendite.fn_provision_registri_famiglia('DDT_VENDITA'),
                     vendite.fn_provision_registri_famiglia('ORDINE_VENDITA'),
                     vendite.fn_provision_registri_famiglia('COMMESSA'),
                     vendite.fn_provision_registri_famiglia('RESO_VENDITA');
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- ⛔ Si cancellano SOLO le righe nate da questo passo, e solo se
              --   nessun documento le ha gia' usate: un registro che ha
              --   numerato non si toglie, perche' il numero resta scritto sul
              --   documento e il sezionale ne e' l'identita'.
              -- ⚠️ `origine = C2-12` lo scrive la primitiva per CHIUNQUE la
              --   chiami (trigger sull'emittente, seed della DISTINTA): il
              --   perimetro di questo passo sono le sue quattro famiglie.
              DELETE FROM vendite.registri_fatturazione r
               WHERE r.meta->>'origine' = 'C2-12'
                 AND r.famiglia_documento IN ('DDT_VENDITA', 'ORDINE_VENDITA', 'COMMESSA', 'RESO_VENDITA')
                 AND NOT EXISTS (SELECT 1 FROM vendite.fatture f WHERE f.registro_id = r.id);
