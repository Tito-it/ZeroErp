# I CINQUE TIPI DI FOGLIA DI MAGAZZINO ESCONO DALLE SORGENTI
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto M, giro M.3 (S-2, S-3: il tipo e' il
#   documento; una riga si scrive con sorgente_riga, il dettaglio con sorgente_dettaglio).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   INVENTARIO_RIGA, RETTIFICA_RIGA, TRASFERIMENTO_RIGA, DDT_VENDITA_PRELIEVO,
#   RESO_VENDITA_RIENTRO erano la grammatica del modello A sul magazzino (la
#   foglia come documento). Dal giro M.1 il registro e i sette verbi scrivono il
#   tipo del documento con riga e dettaglio, e il giro M.2 ha portato al modello
#   le testate e l'evento: nessuna funzione, vista o policy li scrive o li legge
#   come sorgente, nessuna riga li porta (perimetro di ogni FK verso
#   config.sorgenti, dbdev 2026-11-08). ⛔ L'ordine del piano e' rispettato:
#   prima i verbi (M.1: l'annullo di bolla e reso non salta piu' lo storno in
#   silenzio se un tipo manca), poi il ritiro.
#   EVENTO_ASSET resta: e' un oggetto senza righe, non una foglia.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Come il giro R.2 (20261106-60), in tre posti nell'ordine in cui girano:
#   1. tipi_entita.csv: is_sorgente = f sulle cinque righe (mirror 20260822-55):
#      l'ENTITA' resta (le note di magazzino hanno le loro partizioni
#      note_inventario_riga, note_rettifica_riga, note_trasferimento_riga, e
#      script.fn_scope_note_magazzino_ef_perimetro le nomina) e
#      sorgente_codice_interno, generata, torna NULL;
#   2. sorgenti.csv: le cinque righe tolte (mirror 20251002-21): da zero non nascono;
#   3. questo changeSet: le cancella dove esistono. In 80_data viene dopo i due
#      mirror (includeAll per nome).
#   La convergenza del lato «in uscita» (90_end, runAlways) non smonta niente:
#   ogni tabella dei cinque e' ancora la tabella delle righe o del dettaglio di
#   un tipo documento (INVENTARIO, RETTIFICA, TRASFERIMENTO, DDT_VENDITA,
#   RESO_VENDITA).
#   Lo storico conserva i vecchi id nei movimenti storicizzati: e' la storia,
#   senza FK.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261109-20-delete-sorgenti-tipi-foglia-di-magazzino-mctit.yaml

  - changeSet:
      id: 20261109-20-delete-sorgenti-tipi-foglia-di-magazzino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Cancella da config.sorgenti i cinque tipi di foglia di magazzino (le entita' restano in
        config.tipi_entita). brief-db-sorgente-documento-e-riga §7.2 lotto M, giro M.3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM (SELECT 1) x
               WHERE NOT EXISTS (SELECT 1 FROM config.tipi_entita e
                                  WHERE e.codice IN ('INVENTARIO_RIGA', 'RETTIFICA_RIGA', 'TRASFERIMENTO_RIGA', 'DDT_VENDITA_PRELIEVO', 'RESO_VENDITA_RIENTRO') AND e.is_sorgente);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Sul codice, non sull'id: e' la chiave naturale. Una riga che li citasse ancora
              -- ferma il migrate sulla sua FK: e' voluto.
              DELETE FROM config.sorgenti s
               WHERE s.codice_interno IN ('INVENTARIO_RIGA', 'RETTIFICA_RIGA', 'TRASFERIMENTO_RIGA',
                                          'DDT_VENDITA_PRELIEVO', 'RESO_VENDITA_RIENTRO');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Le righe tornano dal CSV di prima (sorgenti.csv) con un migrate di quel file.
              SELECT 1;
