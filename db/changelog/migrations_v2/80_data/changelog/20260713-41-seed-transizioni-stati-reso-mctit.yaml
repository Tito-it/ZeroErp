# Seed config.transizioni_stati_reso (brief §2.1): DRAFT->CONFERMATO,
# DRAFT->ANNULLATO, CONFERMATO->ANNULLATO (tutte manuali). Le azioni sono
# esposte data-driven da script.fn_available_actions_reso; enforcement grafo via
# trgfn_resi_guard_transizione.
# Dipendenza: config.transizioni_stati_reso (20260713-12) + stati (20260713-40).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260713-41-seed-transizioni-stati-reso-mctit.yaml

  - changeSet:
      id: 20260713-41-seed-transizioni-stati-reso
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: transizioni_stati_reso
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/transizioni_stati_reso.csv
            tableName: transizioni_stati_reso
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: stato_da_id, type: NUMERIC }
              - column: { name: stato_a_id, type: NUMERIC }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: meta, type: JSON, defaultValue: "{}" }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }
              - column: { name: azione_processo_codename, type: STRING }
