# DB-B (db-brief-lista-preventivi-offerte §0/§2): valori espliciti di priorita
# per le colonne della lista vendite.preventivi (lista_id risolto da codice).
#
# Stesso meccanismo del seed contratti 20260602-16: la colonna priorita non vive
# nel CSV lista_colonna.csv (il loader 20260507-07, gia' mergiato, non la espone),
# nasce con DEFAULT 50 (20260602-13) e qui si impostano i pesi di dominio. Il
# re-run del loader NON tocca priorita, quindi questi valori sopravvivono.
#
# Asse priorita (peso ritiro dinamico, piu' alto = resiste di piu'):
#   numero/azioni (100) identificatore/azione -> FE le tratta come infinite.
#   ragione_sociale(95), stato(90), rev(88: numero+rev non si separano nello
#   storico), totale(80), id_fiscale(75), utility(70), validita_al(60),
#   istanza(55) resistono; ba_codice(40), data(25) si ritirano per prime; extra
#   opt-in e tecniche basse (5..20).
#
# Gira DOPO il loader lista_colonna (20260507-07) che inserisce le righe
# preventivi: includeAll ordina per nome file (20260603-07 > 20260507-07).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260603-07-seed-ui-lista-colonna-priorita-preventivi-mctit.yaml

  - changeSet:
      id: 20260603-07-seed-ui-lista-colonna-priorita-preventivi
      author: mctit
      # ⚠️ Era `true`, spento il 2026-08-06. Questo UPDATE scrive `priorita` su
      #   ui.lista_colonna, che e' una tabella con mirror CSV: due sorgenti per lo
      #   stesso dato. Verificato riga per riga che il CSV dichiara GIA' gli stessi
      #   valori (zero divergenze sulle sei liste), quindi qui non si decide piu'
      #   niente. Restando `true` rigirava a ogni invocazione di liquibase, e in CI
      #   sono due: la seconda passata riscriveva SOPRA il loader.
      #   La priorita' delle colonne si cambia SOLO da 80_data/sql/ui/lista_colonna.csv.
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Imposta priorita (peso ritiro dinamico) per le colonne della lista
        vendite.preventivi. Valori di dominio dal piano lista-preventivi §4.
      preConditions:
        - onFail: HALT
        - and:
          - columnExists:
              schemaName: ui
              tableName: lista_colonna
              columnName: priorita
          - sqlCheck:
              expectedResult: "1"
              sql: SELECT COUNT(*) FROM ui.lista_definizione WHERE codice = 'vendite.preventivi'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE ui.lista_colonna lc
                 SET priorita = v.priorita
                FROM (
                  VALUES
                    ('numero',                     100),
                    ('ragione_sociale_completa',    95),
                    ('stato',                        90),
                    ('rev',                          88),
                    ('totale_documento',             80),
                    ('id_fiscale',                   75),
                    ('utility_codice',               70),
                    ('validita_al',                  60),
                    ('istanza_utility_codice',       55),
                    ('ba_codice',                    40),
                    ('data',                         25),
                    ('validita_dal',                 20),
                    ('totale_imponibile',            18),
                    ('totale_iva',                   18),
                    ('emittente_fiscale_codice',     15),
                    ('valuta',                       12),
                    ('utility_descrizione',          10),
                    ('competenza_mese',              10),
                    ('stato_codice_interno',          5),
                    ('data_insert',                   5),
                    ('azioni',                      100)
                ) AS v(codice, priorita)
               WHERE lc.codice = v.codice
                 AND lc.lista_id = (
                       SELECT id FROM ui.lista_definizione WHERE codice = 'vendite.preventivi'
                     );
