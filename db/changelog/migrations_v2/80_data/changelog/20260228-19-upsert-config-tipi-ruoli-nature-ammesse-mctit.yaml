databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260228-19-upsert-config-tipi-ruoli-nature-ammesse-mctit.yaml

  - changeSet:
      id: 20260228-19-upsert-config-tipi-ruoli-nature-ammesse
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_ruoli_nature_ammesse
      changes:
        # Upsert dei dati nella tabella tipi_ruoli_nature_ammesse
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_ruoli_nature_ammesse.csv
            tableName: tipi_ruoli_nature_ammesse
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: tipo_ruolo_id, type: STRING }
              - column: { name: tipo_soggetto_id, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: valido_dal, type: DATE }
              - column: { name: valido_al, type: DATE }

              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"

              - column: { name: user_insert, type: STRING }
              - column: { name: user_update, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: storicizza, type: BOOLEAN }
