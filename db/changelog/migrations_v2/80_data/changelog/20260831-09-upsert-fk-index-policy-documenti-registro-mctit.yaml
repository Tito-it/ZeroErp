# C2-8 (coda) — registro indici FK per il registro sul DDT
#   Piano: brief-db-registri-di-numerazione-emittente-e-trasloco, C2-8 (§3.4)
#
# ── UN NO, con la sua ragione ─────────────────────────────────────
#   `fk_ddt_registro` non prende un indice dedicato: l'ingresso «tutti i DDT di
#   questo registro» e' gia' servito per PREFISSO da
#   `uq_ddt_v_anno_serie_numero`, che dal 2026-08-31 ha `registro_id` come
#   PRIMA colonna — e un btree serve i prefissi.
#   ⚠️ Quell'indice e' PARZIALE (`WHERE numero IS NOT NULL`), quindi non copre
#   i DDT in bozza: e' accettabile perche' il controllo referenziale scatta
#   solo quando qualcuno prova a cancellare o disattivare un registro, e un
#   registro con dei DDT sopra non si cancella comunque.
#
# ── ⚠️ `dll_command` VALORIZZATO ANCHE CON `consentito = false` ────
#   Lo impone `chk_fk_index_policy_dll_command_forma`: con il flag a falso la
#   procedura ne estrae il NOME per il `DROP`.
#   ⛔ Per questo nomina l'indice DEDICATO canonico (`ix_ddt_registro_id`) e
#   NON `uq_ddt_v_anno_serie_numero`: nominare quello farebbe cancellare al
#   primo `90_end` l'unicita' del numero DDT — e nessuno collegherebbe le due
#   cose.
#
# ℹ️ Il CSV si ferma a `data_insert`: `user_update`/`data_update` non si
#   caricano, valgono i default. La cella vuota diventerebbe una stringa vuota,
#   e `''` in un `timestamptz` ferma il migrate (successo il 2026-08-31).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260831-09-upsert-fk-index-policy-documenti-registro-mctit.yaml

  - changeSet:
      id: 20260831-09-upsert-fk-index-policy-documenti-registro
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_ddt_registro: un NO. L''ingresso «tutti i DDT di questo registro»
        e'' gia'' servito per PREFISSO da uq_ddt_v_anno_serie_numero, che dal 2026-08-31 ha
        registro_id come prima colonna. ⚠️ Quell''indice e'' parziale (solo i numerati) e non copre
        le bozze: accettabile, perche'' il controllo referenziale scatta solo quando si prova a
        cancellare un registro, e un registro con dei DDT sopra non si cancella comunque. ⚠️
        dll_command valorizzato anche a false come impone chk_fk_index_policy_dll_command_forma, e
        ⛔ nomina l''indice dedicato canonico e NON quello dell''unicita'': nominarlo farebbe
        cancellare al primo 90_end l''unicita'' del numero DDT. Piano:
        brief-db-registri-di-numerazione-emittente-e-trasloco, C2-8.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: vendite
                tableName: ddt
                columnName: registro_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_documenti_registro.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
