# brief-db-processi-automatici-identita-e-perimetro §4 (fase 3b) — crea i
# QUATTRO utenti tecnici dei processi di dominio headless.
#
# ⛔ NESSUN PROFILO, e la decisione di Tid («per il momento prendiamo sempre
# amministrazione») e' caduta per un motivo strutturale, non per un ripensamento:
#   * un profilo REPARTO non si lega a un'identita' — il guard dei binding
#     impone REPARTO -> unita_organizzativa, e un profilo di reparto raggiunge
#     le persone passando da anagrafiche.risorse_umane, cioe' dal rapporto di
#     lavoro. Un processo non ce l'ha;
#   * ⭐ e soprattutto NON SERVE: i profili alimentano le liste, le dashboard e
#     il resolver dei permessi delle API. I quattro processi non passano da
#     nessuno di quei percorsi. Il loro potere viene dal PERIMETRO (la whitelist
#     emittenti sotto RLS), non dalle capability.
# ⇒ Zero capability e' MINIMO PRIVILEGIO, non una mancanza: dare a
#   send_pending_emails i permessi di fatturare sarebbe stato regalare potere
#   che nessuno gli aveva chiesto.
# ⚠️ Se un giorno un processo dovra' passare da un percorso capability-gated, la
#   fabbrica accetta un profilo AD_HOC — l'unico tipo legabile a un'identita'.
#
# ⚠️ `context: dati_macchina` — OBBLIGATORIO: crea righe in `django.auth_user`,
# cioe' utenti di QUESTA installazione. Un database ricostruito da zero non deve
# ereditarli.
#   ⭐ Dal 2026-09-04 il cancello e' armato davvero: `ci.yaml`, `ci-validate.yaml`
#   e `scripts/ci-local.sh` filtrano `--contexts="!provision and !dati_macchina"`.
#   Prima il solo `!provision` NON escludeva questo contesto — esclude cio' che
#   E' provision, non cio' che ha un contesto qualsiasi.
#
# ⭐ Ripetibile per costruzione: salta con NOTICE i processi che hanno gia' un
# utente attivo, cosi' un fallimento a meta' si recupera rilanciando invece di
# sanare a mano. E il salto non e' un silenzio —
# `dbops.vw_processi_dominio_senza_identita` resta rossa finche' i quattro
# utenti non ci sono.
#
# ⛔ Questo changeSet NON scrive config.user_emittenti_fiscali: il perimetro lo
# aggiunge una PERSONA (decisione D-9), e dbops.vw_emittenti_non_serviti dice
# quali emittenti mancano.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260904-27-crea-utenti-tecnici-processi-dominio-mctit.yaml

  - changeSet:
      id: 20260904-27-crea-utenti-tecnici-processi-dominio
      author: mctit
      context: dati_macchina
      failOnError: true
      comment: >
        Crea gli utenti tecnici dei 4 processi DOMINIO headless
        (chiusura_scadenze_daily, run_fatturazione_batch, draina_coda_stampa,
        send_pending_emails), SENZA profilo: un processo headless non passa da
        percorsi capability-gated, e il suo potere viene dal perimetro emittente.
        Ripetibile: salta con NOTICE i processi che hanno gia' l'utente.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: processi_identita }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $utenti$
              DECLARE
                  -- Nessun %TYPE su django.*: vale anche nei blocchi anonimi.
                  v_auth_user_id integer;
                  v_processo     dbops.processi.codice%TYPE;
              BEGIN
                  -- =====================================================
                  -- I quattro processi DOMINIO headless. ⛔ NON ci sono i tipi
                  -- della coda (FATTURAZIONE_GIRO, FATTURAZIONE_NUMERA):
                  -- girano con l'identita' dell'operatore che li accoda, e un
                  -- utente tecnico ne cancellerebbe il nome.
                  --
                  -- ⛔ Nessun profilo passato: vedi l'intestazione. La fabbrica
                  -- lo accetta facoltativo, e qui non serve.
                  -- =====================================================
                  FOREACH v_processo IN ARRAY ARRAY[
                      'chiusura_scadenze_daily',
                      'run_fatturazione_batch',
                      'draina_coda_stampa',
                      'send_pending_emails'
                  ]
                  LOOP
                      -- Salto se c'e' gia': serve a poter RIPETERE il changeSet
                      -- dopo un fallimento a meta' senza che i primi creati
                      -- facciano sollevare E_UTENTE_TECNICO_GIA_ESISTE.
                      IF EXISTS (SELECT 1
                                   FROM dbops.processi_identita pi
                                   JOIN dbops.processi p ON p.id = pi.processo_id
                                  WHERE p.codice = v_processo
                                    AND pi.attivo) THEN
                          RAISE NOTICE 'Utente tecnico gia'' presente per %: salto.', v_processo;
                          CONTINUE;
                      END IF;

                      v_auth_user_id := script.fn_crea_utente_tecnico(v_processo);
                      RAISE NOTICE 'Utente tecnico creato per % (auth_user_id=%), nessun profilo.',
                                   v_processo, v_auth_user_id;
                  END LOOP;
              END
              $utenti$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Si disattiva il legame, non si cancellano le identita': le
              -- righe di maintenance.job_run_log che nominano quegli utenti
              -- restano leggibili, ed e' il punto di tutto il cantiere.
              UPDATE dbops.processi_identita pi
                 SET attivo = false
                FROM dbops.processi p
               WHERE p.id = pi.processo_id
                 AND p.codice IN ('chiusura_scadenze_daily',
                                  'run_fatturazione_batch',
                                  'draina_coda_stampa',
                                  'send_pending_emails');
