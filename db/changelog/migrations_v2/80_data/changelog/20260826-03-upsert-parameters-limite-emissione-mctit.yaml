# DB-1 — I DUE DEFAULT DEL LIMITE DI EMISSIONE (id 55 e 56)
#   VENDITE_LIMITE_EMISSIONE_IMMEDIATA_GIORNI        = 12
#   VENDITE_LIMITE_EMISSIONE_DIFFERITA_GIORNO_MESE   = 15
#   Piano: brief-db-limite-emissione-e-data-verificata §11 DB-1 (decisione D-5)
#
# ── ⛔ PERCHE' UN CSV DEDICATO E NON UN APPEND A parameters.csv ─────
#   Perche' e' stato provato il 2026-08-25, ed e' ESPLOSO. `parameters.csv` e'
#   una MINA DORMIENTE: contiene la riga `DEFAULT_UTILITY` (id 12) con
#   `default_value = ''`, e quel valore NON e' piu' scrivibile — il dispatcher
#   `config.trgfn_parameters_fk_surrogate_dispatch`, entrato DOPO che quella riga
#   fu scritta, pretende un valore esistente in `config.utilities.codice_interno`
#   e la stringa vuota non c'e'.
#
#   Il mirror `20250715-01-upsert_parameters` e' `runOnChange: true`: dorme
#   finche' nessuno tocca il file. Un semplice append in coda ne cambia il
#   checksum, lo sveglia, e la ri-lettura muore su una riga di qualcun altro
#   (`E_PARAMETER_DEFAULT_VALUE_INVALID`), fermando il migrate.
#
#   ⚠️ E non e' un problema di CSV disallineato dal database: la riga e'
#   IDENTICA al database e irriscrivibile lo stesso. Un confronto CSV-vs-DB non
#   lo vede — l'unica verifica che lo trova e' provare a RIESEGUIRE il loader.
#
#   ⭐ Un CSV per famiglia e' comunque il pattern di casa
#   (`parameters_sistema.csv`, `parameters_note_defaults.csv`,
#   `parameters_documenti_storage.csv`, `parameters_vendite_defaults.csv`,
#   `parameters_default_tipo_soggetto_dettaglio.csv`). Questo apre la famiglia
#   `parameters_fatturazione.csv`. La sede resta un CSV: AGENTS.md §80_data
#   rispettato.
#
# ── ⭐ DUE PARAMETRI E NON UNO, E I NOMI SONO PER ESTESO ────────────
#   Il valore in GIORNI e il GIORNO DEL MESE misurano cose diverse: un `12`
#   letto come giorno del mese e' un valore plausibile e sbagliato. Due codici
#   distinti tolgono l'ambiguita'.
#
#   ⛔ Scartata la forma «componi il codice dalla politica»
#   (`'VENDITE_LIMITE_EMISSIONE_' || v_politica`): e' piu' corta e rende il
#   consumatore INVISIBILE a chi cerca per nome — e i consumatori di un valore di
#   configurazione si cercano con un grep sul nome, non leggendo le funzioni.
#
# ── ℹ️ IL DISPATCHER QUI E' UN NO-OP ────────────────────────────────
#   Nessuno dei due codici corrisponde ai pattern attivi in
#   `config.parameter_fk_surrogate` (`DEFAULT_TIPO_SOGGETTO_DETTAGLIO_%`,
#   `DEFAULT_UTILITY`, `NOTE_DEFAULT_STILE`, `NOTE_DEFAULT_LINGUA`): il trigger
#   esce subito. ⚠️ E non deve entrarci: il valore non punta a una tabella di
#   catalogo, e' un numero. A validarlo e' `vendite.fn_get_pavimento_emissione`,
#   che rifiuta un valore vuoto o non numerico con E_CONFIG_MANCANTE.
#
# ── ⚠️ GLI ID SONO UNA SEQUENZA A MANO ──────────────────────────────
#   Il massimo nei CSV del repo al 2026-08-26 e' 54 (`SYSTEM_FUSO_ORARIO`),
#   quindi 55 e 56. ⛔ Vanno RILETTI sul database prima di applicare: piu'
#   cantieri appendono nella stessa giornata, e una collisione di id e' gia'
#   successa il 2026-08-18 su `messaggi_errore`.
#
# Dipendenze: nessuna sullo schema. Li legge vendite.fn_get_pavimento_emissione
#             (20260826-05), che vive in 20_code e quindi esiste GIA' quando
#             questo file gira: fra il migrate di quella fase e questo seed la
#             funzione solleva E_CONFIG_MANCANTE. E' voluto — meglio un errore
#             parlante di un limite preso da un numero a caso — ma nessuno deve
#             numerare in mezzo a un migrate.
# Verifica: db/pgtap/vendite/test-limite-emissione-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260826-03-upsert-parameters-limite-emissione-mctit.yaml

  - changeSet:
      id: 20260826-03-upsert-parameters-limite-emissione
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-1 (decisione D-5): i due default del limite di emissione — id 55
        VENDITE_LIMITE_EMISSIONE_IMMEDIATA_GIORNI = 12 (la regola generale, vale su entrambe
        le politiche) e id 56 VENDITE_LIMITE_EMISSIONE_DIFFERITA_GIORNO_MESE = 15 (il permesso
        della sola differita). ⛔ CSV DEDICATO e non un append a parameters.csv: quel file e'
        una mina dormiente (la riga DEFAULT_UTILITY ha default_value = '' e il dispatcher
        FK-surrogata, entrato dopo, non la accetta piu'), e un append ne cambia il checksum
        svegliando un mirror runOnChange che muore su una riga di qualcun altro — successo il
        2026-08-25. Un confronto CSV-vs-DB non lo vede: la riga e' identica al database e
        irriscrivibile lo stesso. ⭐ Due codici per esteso e non uno composto dalla politica:
        un consumatore si cerca con un grep sul nome. ℹ️ Su questi codici il dispatcher
        FK-surrogata e' no-op, e non deve intercettarli: il valore e' un numero, non un
        riferimento a catalogo — a validarlo e' fn_get_pavimento_emissione.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameters
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT COUNT(*) FROM config.parameters
                   WHERE id IN (55, 56)
                     AND code NOT IN ('VENDITE_LIMITE_EMISSIONE_IMMEDIATA_GIORNI',
                                      'VENDITE_LIMITE_EMISSIONE_DIFFERITA_GIORNO_MESE');
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters_fatturazione.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,            type: NUMERIC }
              - column: { name: code,          type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description,   type: STRING }
              - column: { name: data_insert,   type: DATE }
              - column: { name: user_insert,   type: STRING }
              - column: { name: data_update,   type: DATE }
              - column: { name: user_update,   type: STRING }
              - column: { name: tx_id,         type: UUID }
              - column: { name: storicizza,    type: BOOLEAN }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: false
            sql: |
              DELETE FROM config.parameters
               WHERE code IN ('VENDITE_LIMITE_EMISSIONE_IMMEDIATA_GIORNI',
                              'VENDITE_LIMITE_EMISSIONE_DIFFERITA_GIORNO_MESE');
