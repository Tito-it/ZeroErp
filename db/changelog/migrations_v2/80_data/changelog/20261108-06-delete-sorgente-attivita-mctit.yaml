# ATTIVITA ESCE DALLE SORGENTI, L'ENTITA' RESTA
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.4 (D-2 di Tid,
#   2026-11-06: il tipo e' l'oggetto di provenienza; ATTIVITA esce dalle sorgenti
#   e resta in config.tipi_entita).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Nessun oggetto nasce da un'attivita' fatturabile: nessuna funzione, ne' BE ne'
#   FE, scrive o legge ATTIVITA come provenienza. La provenienza dell'attivita'
#   e' la sua riga di commessa (commessa_attivita_id, FK NOT NULL), e dal giro
#   C.1 la tabella non ha piu' colonne sorgente_*. Il tipo stava a catalogo solo
#   come genitore della FK di config.tipi_entita, che serve alle note.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Il ritiro e' in tre posti, nell'ordine in cui girano:
#   1. tipi_entita.csv: is_sorgente = f su ATTIVITA (mirror 20260822-55):
#      l'ENTITA' resta (note di vendite.note_attivita_fatturabili, scope
#      script.fn_scope_note_ef_perimetro) e sorgente_codice_interno, generata,
#      torna NULL: la FK verso config.sorgenti non la tiene piu'.
#   2. sorgenti.csv: la riga tolta (mirror 20251002-21): da zero non nasce.
#   3. questo changeSet: la cancella dove esiste. In 80_data viene dopo i due
#      mirror (includeAll per nome), quindi dopo il punto 1.
#   Il lato «in uscita» su vendite.attivita_fatturabili (trg_vendite_attivita_
#   fatturabili_a10_sorgente_in_uscita_dlt) lo smonta la convergenza di 90_end
#   (20261106-21, runAlways) nella stessa migrazione: la tabella non e' piu' il
#   documento, le righe o il dettaglio di nessun tipo. COMMESSA resta l'unico tipo
#   dello scope PIPELINE_MARKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261108-06-delete-sorgente-attivita-mctit.yaml

  - changeSet:
      id: 20261108-06-delete-sorgente-attivita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Cancella ATTIVITA da config.sorgenti (l'entita' resta in config.tipi_entita). brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.4.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM (SELECT 1) x
               WHERE NOT EXISTS (SELECT 1 FROM config.tipi_entita e
                                  WHERE e.codice = 'ATTIVITA' AND e.is_sorgente);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Sul codice, non sull'id: e' la chiave naturale.
              DELETE FROM config.sorgenti s
               WHERE s.codice_interno = 'ATTIVITA';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- La riga torna dal CSV di prima (sorgenti.csv) con un migrate di quel file.
              SELECT 1;
