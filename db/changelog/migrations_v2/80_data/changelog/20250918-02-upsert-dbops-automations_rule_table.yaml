#
# ⭐ REV 2026-11-12 — `nullValue: "NULL"` (brief-db-nullvalue-vuoto-cinque-mirror).
#   Con `nullValue: ""` Liquibase scriveva la cella vuota di `name_template`
#   come stringa vuota. Le regole che non montano trigger (CLEANUP_*,
#   STORICO_PROVISION) non hanno template: per il modello e' un'assenza, quindi
#   NULL, come gia' scrivono i pgTAP e le regole nate da SQL. Nel CSV le celle
#   vuote di `name_template` portano ora il token `NULL`. Il CHECK che vieta la
#   stringa vuota sta in 90_end/20261112-37, dopo questo mirror.
#   Giro 3 (stesso giorno): la riga `columns:` di `rules_type` diventa `rule_type`, il
#   nome della colonna nel CSV e nella tabella. La riga vecchia non agganciava
#   niente, perche' il loader legge l'intestazione del CSV: il render offline
#   e' identico prima e dopo.
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20250919-02-upsert-dbops-automation_rules_tbl
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automation_rules_tbl
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/automation_rules_tbl.csv
            tableName: automation_rules_tbl
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: enabled,  type: BOOLEAN }
              - column: { name: rule_type,     type: STRING }
              
              - column: { name: target_schema,  type: STRING }
              - column: { name: target_table,  type: STRING }
              - column: { name: exec_mode,  type: STRING }
              - column: { name: name_template,  type: STRING }
              # existence_strategy ritirata il 2026-11-08 (80_data/changelog/20261109-74,
              #   brief-db-revisione-dbops giro 10b): il trigger si riconosce dalla funzione.
              - column:
                  name: params
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: priority,    type: STRING }
              - column: { name: note,    type: STRING }             
              
  - changeSet:
      id: 20250918-90-upsert-automation_rules_tbl
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250918-01-upsert-automation_rules_tbl
