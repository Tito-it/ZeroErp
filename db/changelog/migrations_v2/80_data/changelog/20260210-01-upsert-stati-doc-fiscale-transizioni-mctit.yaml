# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260210-01-upsert-stati-doc-fiscale-transizioni
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_fiscale_transizioni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_fiscale_transizioni.csv
            tableName: stati_doc_fiscale_transizioni
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: stato_from_id, type: STRING }
              - column: { name: stato_to_id, type: STRING }
              - column: { name: ammesso, type: BOOLEAN }
              - column: { name: solo_lotto, type: BOOLEAN }
              - column: { name: solo_fattura, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
