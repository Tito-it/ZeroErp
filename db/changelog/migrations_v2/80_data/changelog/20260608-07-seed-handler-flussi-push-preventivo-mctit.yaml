# B7 — seed pratiche.handler_flussi: handler 'vendita.push_preventivo'.
# E' l'handler agganciato ai due flussi CONFERMA (B5): porta il preventivo
# accettato a commessa. I template_flussi.handler_id puntano a id=9001.
# Deve essere caricato PRIMA di template_flussi (FK fk_template_flussi_handler):
# garantito dall'ordine NN (07 < 08).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260608-07-seed-handler-flussi-push-preventivo-mctit.yaml

  - changeSet:
      id: 20260608-07-seed-handler-flussi-push-preventivo
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: pratiche
            tableName: handler_flussi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/handler_flussi.csv
            tableName: handler_flussi
            schemaName: pratiche
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: handler_key, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Allineamento sequenza autoincrement post-seed (max id seed 9001).
              SELECT setval(
                  pg_get_serial_sequence('pratiche.handler_flussi', 'id'),
                  GREATEST(COALESCE(MAX(id), 1), 1),
                  true
              ) FROM pratiche.handler_flussi;
      rollback:
        - sql:
            sql: |
              DELETE FROM pratiche.handler_flussi
               WHERE handler_key = 'vendita.push_preventivo';
