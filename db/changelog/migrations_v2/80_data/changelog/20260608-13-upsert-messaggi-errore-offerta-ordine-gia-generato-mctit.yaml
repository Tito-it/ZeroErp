# Aggiunge a config.messaggi_errore il codice NUOVO per la mutua esclusivita'
# offerta -> (contratto XOR ordine):
#   E_OFFERTA_ORDINE_GIA_GENERATO (id=478)
#
# Usato da:
#   - vendite.fn_push_offerta_a_contratto (20260608-13, guard mutua esclusivita'):
#     fallisce se l'offerta ha gia' generato un ordine.
#
# Specchio semantico di E_OFFERTA_CONTRATTO_GIA_GENERATO (id=462), che presidia
# la direzione opposta (ordine bloccato se esiste gia' un contratto, guard lato BE
# crea_ordine_da_offerta — fuori scope DB).
#
# Pattern simmetrico agli altri upsert-messaggi-errore (es. 20260607-06).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260608-13-upsert-messaggi-errore-offerta-ordine-gia-generato-mctit.yaml

  - changeSet:
      id: 20260608-13-upsert-messaggi-errore-offerta-ordine-gia-generato
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registra E_OFFERTA_ORDINE_GIA_GENERATO (id=478): mutua esclusivita'
        offerta->contratto/ordine, usato dal guard di
        vendite.fn_push_offerta_a_contratto.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: codice,    type: STRING }
              - column: { name: lingua,    type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: id,        type: NUMERIC }
              - column: { name: causa,     type: STRING }
              - column: { name: soluzione, type: STRING }
