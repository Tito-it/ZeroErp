# Seed dbops.fk_index_policy per la nuova FK fk_template_flussi_azione_ui
# (pratiche.template_flussi.azione_ui_id -> pratiche.azioni_ui).
#   consentito = false: template_flussi e' tabella di configurazione
#   minuscola (pochi template per tipo prestazione) -> indice FK non
#   necessario (seq scan piu' economico). Registrata esplicitamente per
#   non lasciare la FK fuori policy (apply_fk_index_policy garantisce
#   l'assenza/rimozione dell'indice; consentito=false estrae il nome
#   indice dal dll_command e fa DROP IF EXISTS).
# Creazione/rimozione indici delegata a dbops.apply_fk_index_policy()
# in 90_end (mai a mano, per policy).
# Pattern simmetrico a 20260611-14 (fk_index_policy pratiche-contesto).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260615-06-upsert-dbops-fk-index-policy-azioni-ui-mctit.yaml

  - changeSet:
      id: 20260615-06-upsert-dbops-fk-index-policy-azioni-ui
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: pratiche
            tableName: template_flussi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/fk_index_policy_azioni_ui.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,           type: STRING }
              - column: { name: constraint_name,      type: STRING }
              - column: { name: consentito,           type: BOOLEAN }
              - column: { name: dll_command,          type: STRING }
              - column: { name: generated_by_script,  type: BOOLEAN }
              - column: { name: user_insert,          type: STRING }
              - column: { name: data_insert,          type: STRING }
