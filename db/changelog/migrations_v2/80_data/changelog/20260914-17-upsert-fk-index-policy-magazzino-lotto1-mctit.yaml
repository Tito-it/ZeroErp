# LE DECISIONI SUGLI INDICI DELLE FK DEL LOTTO 1 DI MAGAZZINO — IN UN POSTO
#   dbops.fk_index_policy, CSV dedicato del lotto
#   Brief: brief-db-magazzino-lotto-1-terreno-vuoto (sezioni 4.3 → 4.7, 5)
#
# -- PERCHE' UN CSV DEL LOTTO E NON UN APPEND AL MIRROR BASE ------------------
#   fk_index_policy.csv e' un mirror di gennaio: svegliarlo rilegge 200 righe
#   (20260913-12, linee-guida-sql 11.2). Le righe nuove del lotto entrano
#   qui, una per FK nuova, man mano che i passi P-1 → P-8 le creano; le
#   dodici righe da RITIRARE (FK che spariscono con le colonne o cambiano
#   nome con le tabelle) si tolgono con un DELETE SQL forward-only nel
#   changeSet del passo che le fa sparire — loadUpdateData non cancella.
#   Mirror vivo: runOnChange + validCheckSums ANY, si allarga in place.
#
# -- LA POLICY E' OPT-IN, quindi il silenzio non e' una scelta ------------
#   fn_populate_fk_index_policy() registra le FK nuove con consentito=false
#   da sola. Il seed mette per iscritto PERCHE' si' o perche' no.
#
# -- P-1: fk_mag_lotti_articolo -> false ----------------------------------
#   Il brief (4.3) diceva `t` («i lotti di questo articolo» e' il primo
#   accesso). L'accesso c'e', ma l'indice dedicato NO: l'UNIQUE
#   (articolo_id, codice) ha articolo_id come prefisso e dbops.vw_fk_senza_indice
#   la considera gia' coperta — con `t` apply_fk_index_policy() la salterebbe
#   comunque (guardia 1), e un indice a mano sarebbe la ridondanza che il
#   27-07 ha bonificato su costo_medio (ix_mag_cmedio_articolo, coperto da
#   uq_mag_costo_medio_art_mag). Stessa forma della riga di valore_giacenza
#   (P-6). Registrato nel brief come scostamento.
#
# -- P-4: movimenti, cinque FK nuove -------------------------------------
#   fk_mag_movimenti_sorgente_tipo -> false: sorgente_tipo_id e' la PRIMA
#     colonna di uq_mag_movimenti_identita, che la copre (prefisso).
#   fk_mag_movimenti_lotto, _asset, _ubicazione -> true: la tracciabilita'
#     chiede «dove e' passato questo lotto / questo pezzo» e «cosa c'e' in
#     questa posizione», e nell'indice di identita' quelle colonne non sono
#     un prefisso. Sono le tre domande della vista per ubicazione e del
#     richiamo di un lotto.
#   fk_mag_movimenti_storno_di -> false: uq_mag_movimenti_storno_di la copre.
#   Le quattro righe ritirate (magazzino_dest, ubicazione_from/_to, uom) le
#   toglie il DELETE di fine lotto.
#
# -- P-5: movimenti_attesi, otto FK (tre rinominate, cinque nuove) ----------
#   _articolo, _magazzino, _ubicazione -> true: sono le tre di reservations,
#     rinominate col loro indice (ix_magazzino_movimenti_attesi_*); la riga
#     nuova prende il nome nuovo, la vecchia (fk_mag_reservations_*) esce col
#     DELETE di fine lotto. apply_fk_index_policy le trova gia' coperte.
#   _causale, _soggetto_ruolo, _sorgente_tipo, _lotto, _asset -> false: la
#     tabella e' piccola (attese vive) e la domanda della disponibilita' entra
#     da (articolo, magazzino) sulle APERTE, che ha il suo indice parziale
#     (20260915-07). Nessuna query entra oggi dalle altre cinque colonne.
#
# -- P-6: valore_giacenza ---------------------------------------------------
#   fk_mag_valore_giacenza_magazzino -> true: e' la FK di costo_medio
#     rinominata col suo indice (gia' coperta); la riga vecchia esce col
#     DELETE di fine lotto.
#   fk_mag_valore_giacenza_articolo -> false: la FK che mancava; l'UNIQUE
#     (articolo_id, magazzino_id) la copre (prefisso). Stessa forma di lotti.
#
# -- P-7: l'ancora -----------------------------------------------------------
#   fk_magazzini_emittente_fiscale, fk_mag_assets_emittente_fiscale -> false:
#     magazzini e' minuscola (una manciata di righe per emittente) e assets
#     entra per articolo, seriale o dal registro; la policy RLS filtra per
#     emittente con un EXISTS sulla riga, non con una scansione. Le righe
#     ritirate di assets (magazzino, ubicazione) escono col DELETE di fine
#     lotto.
#
# -- P-8: testate e righe ------------------------------------------------------
#   fk_mag_rettifiche_sorgente_tipo -> false: come le sorelle di inventari,
#     trasferimenti, eventi_assets (gia' a false nel mirror base).
#   Le sei FK lotto/asset delle tre righe -> true: la tracciabilita' chiede
#     «dove e' passato questo lotto / questo pezzo», e la risposta attraversa
#     le righe delle operazioni oltre al registro. Le due righe del doppione
#     di trasferimenti escono col DELETE di fine lotto.
#
# -- dll_command VALORIZZATO ANCHE A false ------------------------------
#   Lo impone chk_fk_index_policy_dll_command_forma, e serve: col flag a
#   falso apply_fk_index_policy() ne estrae il NOME ed esegue il DROP su
#   quello. Il nome e' quello canonico (ix_<tabella>_<colonna>), che non
#   esiste: il DROP e' un no-op.
# ⛔ Creazione e rimozione restano di dbops.apply_fk_index_policy() in
#   90_end: qui si tocca solo il flag.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260914-17-upsert-fk-index-policy-magazzino-lotto1-mctit.yaml

  - changeSet:
      id: 20260914-17-upsert-fk-index-policy-magazzino-lotto1
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK del Lotto 1 di magazzino (CSV dedicato, mirror vivo):
        una riga per FK nuova con la ragione del si' o del no. P-1: fk_mag_lotti_articolo
        a consentito=false (coperta dall'UNIQUE (articolo_id, codice)).
        Brief: brief-db-magazzino-lotto-1-terreno-vuoto.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - tableExists:
                schemaName: magazzino
                tableName: lotti
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/magazzino/fk_index_policy_magazzino_lotto1.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE schema_name = 'magazzino'
                 AND constraint_name IN (
                     'fk_mag_lotti_articolo',
                     'fk_mag_movimenti_sorgente_tipo', 'fk_mag_movimenti_lotto',
                     'fk_mag_movimenti_asset', 'fk_mag_movimenti_ubicazione',
                     'fk_mag_movimenti_storno_di',
                     'fk_mag_movimenti_attesi_articolo', 'fk_mag_movimenti_attesi_magazzino',
                     'fk_mag_movimenti_attesi_ubicazione', 'fk_mag_movimenti_attesi_causale',
                     'fk_mag_movimenti_attesi_soggetto_ruolo', 'fk_mag_movimenti_attesi_sorgente_tipo',
                     'fk_mag_movimenti_attesi_lotto', 'fk_mag_movimenti_attesi_asset',
                     'fk_mag_valore_giacenza_magazzino', 'fk_mag_valore_giacenza_articolo',
                     'fk_magazzini_emittente_fiscale', 'fk_mag_assets_emittente_fiscale',
                     'fk_mag_rettifiche_sorgente_tipo',
                     'fk_mag_inventari_righe_lotto', 'fk_mag_inventari_righe_asset',
                     'fk_mag_rettifiche_righe_lotto', 'fk_mag_rettifiche_righe_asset',
                     'fk_mag_trasferimenti_righe_lotto', 'fk_mag_trasferimenti_righe_asset'
                 );
