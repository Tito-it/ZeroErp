# Liquibase changelog per Zero ERP
# Upsert dati config.unita_organizzative
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260107-11-upsert-config-unita-organizzative-table.yaml

  - changeSet:
      id: 20260107-11-upsert-config-unita-organizzative-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: unita_organizzative
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/unita_organizzative.csv
            tableName: unita_organizzative
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: parent_id, type: INTEGER }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"

              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"

              - column: { name: user_update, type: STRING }
