# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260216-11-upsert-attivita-fatturabili-pipeline
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: attivita_fatturabili_pipeline
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/attivita_fatturabili_pipeline.csv
            tableName: attivita_fatturabili_pipeline
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_step, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: ordine, type: STRING }
              - column: { name: processi, type: JSON }
              - column: { name: rollback, type: JSON }
              - column: { name: utility_id, type: STRING }
              - column: { name: sorgente_tipo_id, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
