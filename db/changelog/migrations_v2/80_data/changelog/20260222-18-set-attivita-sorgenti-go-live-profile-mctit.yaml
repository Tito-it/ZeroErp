databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260222-18-set-attivita-sorgenti-go-live-profile-mctit.yaml

  - changeSet:
      id: 20260222-18-set-attivita-sorgenti-go-live-profile
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: attivita_fatturabili_sorgenti_branch_policy
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Definire profilo operativo iniziale (go-live) delle
              --   sorgenti attivita_fatturabili senza ambiguita`.
              --
              -- Regole:
              --   - in scope: PREVENTIVO, CONTRATTO, ORDINE_VENDITA,
              --     ATTIVITA, ATTIVITA_CONSUMI
              --   - fuori scope iniziale: *_RIGA, DDT*, FATTURA*
              -- =========================================================

              WITH src AS (
                SELECT id, codice
                FROM config.sorgenti
                WHERE codice IN (
                  'ATTIVITA',
                  'PREVENTIVO',
                  'PREVENTIVO_RIGA',
                  'CONTRATTO',
                  'CONTRATTO_RIGA',
                  'ORDINE_VENDITA',
                  'ORDINE_VENDITA_RIGA',
                  'DDT_VENDITA',
                  'DDT_VENDITA_RIGA',
                  'FATTURA',
                  'FATTURA_RIGA',
                  'ATTIVITA_CONSUMI'
                )
              )
              INSERT INTO vendite.attivita_fatturabili_sorgenti_branch_policy (
                sorgente_tipo_id,
                branch_code,
                abilitata,
                acquisizione_mode,
                block_scope,
                priorita,
                meta,
                attivo
              )
              SELECT
                s.id,
                CASE s.codice
                  WHEN 'ATTIVITA' THEN 'ATTIVITA_DIRETTE'
                  WHEN 'PREVENTIVO' THEN 'PREVENTIVI'
                  WHEN 'PREVENTIVO_RIGA' THEN 'PREVENTIVI'
                  WHEN 'CONTRATTO' THEN 'CONTRATTI'
                  WHEN 'CONTRATTO_RIGA' THEN 'CONTRATTI'
                  WHEN 'ORDINE_VENDITA' THEN 'ORDINI'
                  WHEN 'ORDINE_VENDITA_RIGA' THEN 'ORDINI'
                  WHEN 'DDT_VENDITA' THEN 'DDT'
                  WHEN 'DDT_VENDITA_RIGA' THEN 'DDT'
                  WHEN 'FATTURA' THEN 'POST_FATTURA'
                  WHEN 'FATTURA_RIGA' THEN 'POST_FATTURA'
                  WHEN 'ATTIVITA_CONSUMI' THEN 'CONSUMI'
                END AS branch_code,
                CASE
                  WHEN s.codice IN ('ATTIVITA', 'PREVENTIVO', 'CONTRATTO', 'ORDINE_VENDITA', 'ATTIVITA_CONSUMI') THEN true
                  ELSE false
                END AS abilitata,
                CASE
                  WHEN s.codice IN ('FATTURA', 'FATTURA_RIGA') THEN 'PULL'
                  ELSE 'PUSH'
                END AS acquisizione_mode,
                CASE
                  WHEN s.codice IN ('FATTURA', 'FATTURA_RIGA') THEN 'GLOBAL'
                  ELSE 'BRANCH'
                END AS block_scope,
                CASE s.codice
                  WHEN 'PREVENTIVO' THEN 10
                  WHEN 'ATTIVITA_CONSUMI' THEN 15
                  WHEN 'ATTIVITA' THEN 20
                  WHEN 'CONTRATTO' THEN 30
                  WHEN 'ORDINE_VENDITA' THEN 40
                  WHEN 'DDT_VENDITA' THEN 80
                  WHEN 'FATTURA' THEN 90
                  WHEN 'PREVENTIVO_RIGA' THEN 110
                  WHEN 'CONTRATTO_RIGA' THEN 120
                  WHEN 'ORDINE_VENDITA_RIGA' THEN 130
                  WHEN 'DDT_VENDITA_RIGA' THEN 140
                  WHEN 'FATTURA_RIGA' THEN 150
                  ELSE 999
                END AS priorita,
                jsonb_build_object(
                  'scope', 'ATTIVITA_FATTURABILI',
                  'seed_profile', 'GO_LIVE_INITIAL',
                  'source_code', s.codice
                ) AS meta,
                true AS attivo
              FROM src s
              ON CONFLICT (sorgente_tipo_id)
              DO UPDATE
                 SET branch_code = EXCLUDED.branch_code,
                     abilitata = EXCLUDED.abilitata,
                     acquisizione_mode = EXCLUDED.acquisizione_mode,
                     block_scope = EXCLUDED.block_scope,
                     priorita = EXCLUDED.priorita,
                     meta = EXCLUDED.meta,
                     attivo = EXCLUDED.attivo,
                     data_update = now(),
                     user_update = current_user;
