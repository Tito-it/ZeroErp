databaseChangeLog:
  - changeSet:
      id: 20250919-01-upsert-automation_scope
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY

      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automation_scope
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/automation_scope.csv
            tableName: automation_scope
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "schema_name,table_like"
            columns:
              - column: { name: schema_name, type: STRING }
              - column: { name: table_like, type: STRING }

  - changeSet:
      id: 20250919-90-upsert-automation_scope
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250919-01-upsert-automation_scope
