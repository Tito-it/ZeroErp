# ------------------------------------------------------------
# Il registro dbops.automazione_overlap dice la stessa cosa del vincolo:
# ex_listini_versioni_no_overlap vale per ATTIVA e CHIUSA (20260928-33).
#
# -- PERCHE' --------------------------------------------------------------
#   Il registro e' la sede da cui dbops.fn_apply_automazione_overlap ricrea i
#   vincoli anti-overlap (job pgAgent, 85_pgagent/20260602-12). Oggi il framework
#   SALTA un vincolo che esiste gia' con quel nome, quindi non riscriverebbe il
#   vincolo esteso; ma se un giorno lo ricreasse (un refactor che lo droppa),
#   ripartirebbe dal predicato vecchio «solo ATTIVA» — cioe' riaprirebbe il buco
#   in silenzio. Il predicato si allinea qui.
#
# -- FORMA ---------------------------------------------------------------
#   UPDATE sulla stessa chiave (target_schema, target_table) di 20260602-10, che
#   inserisce la riga e gira una volta sola (niente runOnChange): questo
#   changeSet viene dopo, sia su dev sia su un database ricostruito da zero.
#   Tocca solo `where_predicate` e `note`; gli altri campi sono quelli di oggi.
#   Il testo del predicato e' quello SCRITTO nel DDL di 20260928-33, non la
#   forma che PostgreSQL ristampa: e' cio' che il registro conserva anche per le
#   altre righe. Il pgTAP ne prova l'EQUIVALENZA con il vincolo vivo
#   (test-listino-versione-in-vigore-v1, test 3).
#
# Cantiere: brief-db-liste-righe-documento §8.15, passo a)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260928-42-update-automazione-overlap-listini-versioni-attiva-chiusa-mctit.yaml

  - changeSet:
      id: 20260928-42-update-automazione-overlap-listini-versioni-attiva-chiusa
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il registro dbops.automazione_overlap per vendite.listini_versioni prende il
        predicato del vincolo esteso (ATTIVA e CHIUSA), cosi' una ricreazione futura non
        riaprirebbe il buco.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM dbops.automazione_overlap
               WHERE target_schema = 'vendite' AND target_table = 'listini_versioni'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE dbops.automazione_overlap
                 SET where_predicate = 'attivo IS TRUE AND (stato)::text IN (''ATTIVA'', ''CHIUSA'')',
                     note            = 'refactor-overlap-v2 fase2: parziale attivo + ATTIVA/CHIUSA '
                                       '(esteso a CHIUSA il 2026-09-28, brief-db-liste-righe-documento §8.15)'
               WHERE target_schema = 'vendite'
                 AND target_table  = 'listini_versioni';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              UPDATE dbops.automazione_overlap
                 SET where_predicate = 'attivo IS TRUE AND (stato)::text = ''ATTIVA''::text',
                     note            = 'refactor-overlap-v2 fase2: parziale attivo+ATTIVA'
               WHERE target_schema = 'vendite'
                 AND target_table  = 'listini_versioni';
