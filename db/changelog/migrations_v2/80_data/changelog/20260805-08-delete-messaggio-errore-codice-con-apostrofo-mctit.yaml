# Riga morta in config.messaggi_errore: un APOSTROFO in coda al codice
#   Brief: brief-db-codice-errore-strutturato.md §7
#
#   id 76, codice `E_NOTE_RIGA_MISMATCH'` — con l'apostrofo dentro al codice.
#   Nessun call site puo' nominarlo: il codice vero e' `E_NOTE_RIGA_MISMATCH`,
#   e sta accanto (id 792, aggiunto da un seed successivo con un messaggio
#   migliore). La riga 76 non e' quindi un doppione ambiguo — e' irraggiungibile
#   e basta: `fn_get_messaggio` cerca per uguaglianza esatta del codice.
#
# ── PERCHE' ESCE ADESSO ─────────────────────────────────────────────────
#   Emersa costruendo il controllo (B) del guardrail
#   (scripts/sql/guardrail_codice_errore_strutturato.sql), che pretende
#   `^E_[A-Z0-9_]+$`: l'apostrofo non e' nell'alfabeto e la riga farebbe
#   fallire il presidio al primo giro. Le due strade erano registrarla come
#   debito o toglierla; toglierla e' l'unica onesta, perche' non e' un codice
#   fuori convenzione, e' un refuso.
#
#   Piccolo dividendo del presidio: e' rossa la prima volta che gira, e su una
#   cosa vera.
#
# ── ⚠️ DUE MOSSE, NON UNA ───────────────────────────────────────────────
#   Il DELETE da solo non basta. `config.messaggi_errore` e' caricata dal CSV
#   80_data/sql/config/messaggi_errore.csv tramite un `loadUpdateData` con
#   `runOnChange: true` (20260614-08): e' un mirror vivo, e al primo migrate
#   successivo rimetterebbe la riga.
#   Quindi: riga 88 tolta dal CSV (stesso commit) **+** questo DELETE per i DB
#   che ce l'hanno gia'. Il CSV impedisce che torni, il DELETE la toglie da qui.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260805-08-delete-messaggio-errore-codice-con-apostrofo-mctit.yaml

  - changeSet:
      id: 20260805-08-delete-messaggio-errore-codice-con-apostrofo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Elimina la riga morta id 76 di config.messaggi_errore, il cui codice
        contiene un apostrofo in coda ed e' quindi irraggiungibile da qualunque
        call site. La riga e' stata tolta anche dal CSV seed, che altrimenti la
        rimetterebbe al prossimo giro del loader runOnChange.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Filtro su id E su codice: se un giorno l'id 76 fosse riusato da
              -- altro, questo changeSet non deve poter cancellare una riga viva.
              DELETE FROM config.messaggi_errore
               WHERE id = 76
                 AND codice = 'E_NOTE_RIGA_MISMATCH''';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              INSERT INTO config.messaggi_errore (id, codice, lingua, messaggio, causa, soluzione)
              VALUES (76, 'E_NOTE_RIGA_MISMATCH''', 'it', 'La riga %s non appartiene a %s %s', '', '')
              ON CONFLICT (id) DO NOTHING;
