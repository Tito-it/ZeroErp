# Proiezione stato di dominio — seed della colonna `esito` su
# config.stati_doc_offerte (roll-out §7; playbook 20260701-19).
#
# PERCHE' UPDATE E NON CSV: il changeset CSV 20260524-04 ha nullValue:"" -> una
# cella vuota caricherebbe '' (viola la FK verso esiti_flussi_pratiche) e il
# token 'NULL' verrebbe caricato come stringa letterale
# (feedback_liquibase_csv_null_sentinel). BOZZA/EMESSA richiedono esito NULL ->
# la colonna esito NON sta nella CSV; fase/terminale (mai NULL) invece SI.
#
# ORDINE fresh-DB: dentro 80_data (includeAll alfabetico) 20260524-04 (load CSV
# con fase/terminale) precede questo file -> le righe esistono. Sul DB vivo il
# backfill 20260702-02 ha gia' valorizzato tutto: questo UPDATE e' idempotente
# (IS DISTINCT FROM) e non tocca nulla.
#
# Il guard trg_stati_doc_offerte_a10_guard_esito_verdetto_ins_upd e' attivo:
# qui si scrivono solo verdetti (POSITIVO/NEGATIVO) -> trasparente.
# Keyed su codice_interno, mai id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260702-10-upsert-stati-doc-offerte-esito-proiezione-mctit.yaml

  - changeSet:
      id: 20260702-10-upsert-stati-doc-offerte-esito-proiezione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Seed della proiezione `esito` su config.stati_doc_offerte (UPDATE
        idempotente keyed su codice_interno): ACCETTATA=POSITIVO,
        RIFIUTATA/SUPERATA/ANNULLATA=NEGATIVO, BOZZA/EMESSA=NULL. In UPDATE e
        non in CSV perche' il changeset CSV (nullValue:"") non puo' esprimere NULL.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM information_schema.columns
               WHERE table_schema = 'config'
                 AND table_name   = 'stati_doc_offerte'
                 AND column_name  = 'esito';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Verdetti proiettati (mappa universale brief design §3).
              UPDATE config.stati_doc_offerte s
                 SET esito = m.esito
                FROM (VALUES
                        ('ACCETTATA', 'POSITIVO'),
                        ('RIFIUTATA', 'NEGATIVO'),
                        ('SUPERATA',  'NEGATIVO'),
                        ('ANNULLATA', 'NEGATIVO')
                     ) AS m(codice_interno, esito)
               WHERE s.codice_interno = m.codice_interno
                 AND s.esito IS DISTINCT FROM m.esito;

              -- Nessun verdetto per gli stati non conclusivi (re-seed-safe).
              UPDATE config.stati_doc_offerte s
                 SET esito = NULL
               WHERE s.codice_interno IN ('BOZZA', 'EMESSA')
                 AND s.esito IS NOT NULL;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              UPDATE config.stati_doc_offerte
                 SET esito = NULL
               WHERE esito IS NOT NULL;
