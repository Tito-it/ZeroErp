# GLI INDICI DELLE FK DEL REGISTRO — passo S4-5 (lotto 7)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.3-bis S4-5
#
# ── ⭐ UN SI' E TRE NO, e ciascuno con la sua ragione ────────────────
#
#   | FK | | Perché |
#   | --- | --- | --- |
#   | `fattura_origine` | ✅ **sì** | `vw_eccedenze_da_sistemare` la interroga **per ogni riga dell'elenco** — due sottoquery per documento |
#   | `fattura_destinazione` | ⛔ no | nessuna interrogazione parte da lì: è un dato che si legge **avendo già l'atto** |
#   | `cliente` | ⛔ no | il raggruppamento per cliente della vista parte dalla **fattura**, non dall'atto |
#   | `emittente` | ⛔ no | lo legge la policy RLS, ma su una tabella di **atti** — poche righe, e il filtro costa meno dell'indice |
#
#   ⚠️ Le due FK dell'**esito** (`contabile_id`, `fondo_source_id`) non compaiono:
#   portano un vincolo `UNIQUE`, quindi hanno **già** il loro indice e
#   `dbops.vw_fk_senza_indice` non le conta. ⭐ Un'unicità è anche un indice: dirlo
#   due volte sarebbe pagarlo due volte.
#
# ── ⚠️ E SI RIPULISCE UNA RIGA CHE NON HA PIU' UN VINCOLO ───────────
#   `fk_vendite_contabili_compensazione` è stata seminata nel lotto 4 e il
#   changeSet `-34` ha eliminato il vincolo che nominava. La riga resterebbe a
#   registro puntando al nulla: innocua — la procedura fa `DROP ... IF EXISTS` —
#   ma è **debito**, e un registro che nomina oggetti inesistenti è un registro
#   di cui ci si fida di meno.
#
# ── ⚠️ `dll_command` va sempre valorizzato ───────────────────────────
#   `chk_fk_index_policy_dll_command_forma` lo impone su ogni riga, `false`
#   compreso: con il flag a falso la procedura ne estrae il **nome** ed esegue il
#   `DROP` su quello.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()` in
#    `90_end`. ✅ Dopo questo changeSet `dbops.vw_fk_senza_indice` per `pagamenti`
#    deve restare a **zero righe**, come dal lotto 4.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260822-39-upsert-dbops-fk-index-policy-sistemazioni-mctit.yaml

  - changeSet:
      id: 20260822-39-upsert-dbops-fk-index-policy-sistemazioni
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per pagamenti.sistemazioni: un si' e tre no. Si' su
        fattura_origine, che vw_eccedenze_da_sistemare interroga per ogni riga dell'elenco; no
        sugli altri tre, che nessuna interrogazione usa come punto di ingresso. Le due FK
        dell'esito non compaiono perche' portano un UNIQUE e quindi hanno gia' il loro indice.
        E si ripulisce la riga di fk_vendite_contabili_compensazione, il cui vincolo e' stato
        eliminato dal changeSet -34: innocua ma debito, e un registro che nomina oggetti
        inesistenti e' un registro di cui ci si fida di meno.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: pagamenti
                tableName: sistemazioni
            - columnExists:
                schemaName: pagamenti
                tableName: sistemazioni
                columnName: fattura_origine_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/fk_index_policy_sistemazioni.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ La riga di un vincolo che non esiste piu' (changeSet -34).
              DELETE FROM dbops.fk_index_policy
               WHERE schema_name = 'pagamenti'
                 AND table_name  = 'vendite_contabili'
                 AND constraint_name = 'fk_vendite_contabili_compensazione';
