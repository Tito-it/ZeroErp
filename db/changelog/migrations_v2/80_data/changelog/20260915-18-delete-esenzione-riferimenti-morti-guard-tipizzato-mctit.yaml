# LA VOCE DEL REGISTRO DEI RIFERIMENTI MORTI E' RIENTRATA: SI TOGLIE
#   dbops.riferimenti_morti_esenzioni, riga script.trgfn_guard_sorgente_polimorfa_tipizzata
#   Brief: brief-db-magazzino-lotto-1-terreno-vuoto, sezione 4.4 (P-4), 11
#
# -- PERCHE' ------------------------------------------------------------------
#   Il registro aveva UNA voce dal 2026-08-04 (20260804-65): la tipizzata era
#   «ORFANA DI PROPOSITO, decisione D6 aperta» — senza alcun trigger da quando
#   vendite.attivita_fatturabili perse il suo (20260225-45), e quel dominio e'
#   poi stato ritirato. La voce stessa dice come si esce: «se la risposta e'
#   "riaggancia", con il CREATE TRIGGER». Il Lotto 1 di magazzino e' quella
#   risposta, su un target diverso da quello di progetto: dal 2026-09-15 la
#   funzione e' montata su SEI tabelle (movimenti 20260915-05, movimenti_attesi
#   -07, inventari/rettifiche/trasferimenti/eventi_assets -11). Non e' piu'
#   orfana, vw_riferimenti_morti_rientrati la elenca e il test 4 di
#   dbops/test-riferimenti-morti-v1 fa quel che deve: rosso finche' la riga
#   non cala. Trovato il 15-09 col runner, dopo l'apply.
#
# -- LA LEZIONE, PER CHI LEGGE -------------------------------------------------
#   Montare una funzione registrata come orfana e' cambiare un FATTO che un
#   registro dichiara: chi la monta deve censire chi la dichiarava. Il
#   changeSet 20260915-05 scrive «e' il PRIMO montaggio di quella funzione» e
#   non ha guardato il registro — stessa forma di «cancellare una fonte =
#   censire i lettori».
#
# -- FORMA --------------------------------------------------------------------
#   DELETE in avanti, idempotente, sulle coordinate della chiave naturale
#   (schema_nome, funzione, esito_like) e non sull'id. Il seed 20260804-65 e'
#   runOnChange: false: non la rimette. Rollback: nessun INSERT — rimetterebbe
#   in piedi un debito che non esiste piu'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260915-18-delete-esenzione-riferimenti-morti-guard-tipizzato-mctit.yaml

  - changeSet:
      id: 20260915-18-delete-esenzione-riferimenti-morti-guard-tipizzato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Toglie da dbops.riferimenti_morti_esenzioni la voce
        script.trgfn_guard_sorgente_polimorfa_tipizzata («senza alcun trigger»): dal
        Lotto 1 di magazzino la funzione e' montata su sei tabelle, la voce e'
        rientrata (vw_riferimenti_morti_rientrati) e il registro deve calare. Brief:
        brief-db-magazzino-lotto-1-terreno-vuoto, sezione 4.4 (P-4).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: riferimenti_morti_esenzioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Sulla chiave naturale, non sull'id: e' UNIQUE (schema_nome, funzione, esito_like).
              DELETE FROM dbops.riferimenti_morti_esenzioni e
               WHERE (e.schema_nome, e.funzione, e.esito_like)
                   = ('script', 'trgfn_guard_sorgente_polimorfa_tipizzata', '%senza alcun trigger%');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Nessun INSERT: la funzione resta montata, la voce sarebbe falsa.
              SELECT 1;
