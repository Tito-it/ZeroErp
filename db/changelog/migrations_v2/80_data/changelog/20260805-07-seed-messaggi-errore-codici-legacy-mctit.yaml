# Le 57 voci del registro dei codici fuori convenzione
#   Tabella: 20260805-06 · Guardrail: scripts/sql/guardrail_codice_errore_strutturato.sql
#   Brief: brief-db-codice-errore-strutturato.md §7
#
#   Sono i codici di config.messaggi_errore che non seguono `E_{MODULO}_{TIPO}`
#   (api.md): PRATICHE_*, PREV_*, FLUSSI_*, DEFINIZIONE_*, TEMPLATE_FLUSSO_*,
#   ERRORE_PARAMETRI, CF_NON_VALIDO, SEQUENZA_NON_CONFIGURATA... piu' i due
#   fuori-famiglia MESSAGGIO_NON_DEFINITO e W_TXID_NOT_REGISTERED.
#   Tutti regolarmente a seed, usati da 77 call site nei corpi vivi.
#
# ── ⚠️ PERCHE' `DELETE` + `loadData` E NON `loadUpdateData` ─────────────
#   Il pattern standard dei seed (es. 20260614-08 su messaggi_errore) e'
#   `loadUpdateData`, cioe' un UPSERT: togliere una riga dal CSV non cancella
#   niente dal DB.
#
#   Qui non va bene, e non e' un dettaglio di gusto: questo registro deve
#   CALARE. Il giorno in cui uno dei 57 viene rinominato a `E_*` o eliminato,
#   il controllo (C) del guardrail chiede di toglierlo dal registro — e con un
#   upsert la riga resterebbe nel DB anche dopo essere sparita dal CSV, quindi
#   il guardrail continuerebbe a protestare per una voce che il CSV non ha piu'.
#   Un registro che si puo' solo allungare non e' un registro.
#
#   Con DELETE + loadData il CSV e' un mirror esatto, nei due versi. La riga si
#   toglie dal CSV e basta: `runOnChange: true` + `validCheckSums: ANY` fanno
#   ri-girare il changeSet al prossimo migrate.
#
#   ⚠️ L'id non sta nel CSV: e' `GENERATED BY DEFAULT AS IDENTITY` e si
#   rigenera a ogni giro. E' voluto — nessuno referenzia questa tabella, e
#   mettere in CSV un id stabile darebbe l'idea sbagliata che ci si possa
#   puntare.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260805-07-seed-messaggi-errore-codici-legacy-mctit.yaml

  - changeSet:
      id: 20260805-07-seed-messaggi-errore-codici-legacy
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Le 57 voci del registro del debito sui codici fuori convenzione. Mirror
        esatto del CSV (DELETE + loadData, non upsert) perche' il registro deve
        poter CALARE: togliere la riga dal CSV deve toglierla anche dal DB.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: messaggi_errore_codici_legacy
      changes:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.messaggi_errore_codici_legacy;
        - loadData:
            relativeToChangelogFile: true
            file: ../sql/dbops/messaggi_errore_codici_legacy.csv
            tableName: messaggi_errore_codici_legacy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            columns:
              - column: { name: codice,             type: STRING }
              - column: { name: data_registrazione, type: DATE }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.messaggi_errore_codici_legacy;
