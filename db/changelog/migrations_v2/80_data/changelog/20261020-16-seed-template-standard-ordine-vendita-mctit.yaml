# IL MODELLO STANDARD: ORDINE DI VENDITA (ORDINE_VENDITA / sorgente ORDINE_VENDITA)
#   Brief: brief-db-modelli-documento-standard, §8.2 (tranche 2), D-3
#
# -- IL CONTENUTO (D-3) ------------------------------------------------------------
#   Dalla versione pubblicata 4 del modello dell'emittente 32 su dbdev (letta il
#   2026-10-19), riletta da Tid. Modifiche, scelte di Tid del 2026-10-19:
#   * tolto il pie' di pagina a sinistra (@bottom-left «Zero ERP…»): un testo
#     fisso del software sulla carta dell'azienda;
#   Nessun richiamo ad asset (Q-4): lo standard stampa per qualunque emittente.
#
# -- LA FORMA ------------------------------------------------------------------------
#   Non un CSV: template_documenti e' una tabella mista (i modelli degli emittenti
#   nascono dall'applicazione). Un mirror con id espliciti collide con gli id
#   dell'applicazione; uno sulla chiave naturale aggiornerebbe le copie degli
#   emittenti con lo stesso codice interno. Lo standard nasce qui, forward-only, e
#   si fa evolvere con changeSet nuovi (una bozza e la sua pubblicazione), cercato
#   per (standard, sorgente, codice_interno).
#   Idempotente: se lo standard c'e' gia', non fa niente. La pubblicazione passa
#   da documenti.fn_pubblica_template_documento_versione, che verifica anche la
#   forma dei dati (2). Valido dal 2000-01-01: da sempre.
#   Scritto dal proprietario della tabella (il migrate): il guard di sola lettura
#   (20261020-07) lo lascia passare, e il default dell'emittente lo salta (-06).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261020-16-seed-template-standard-ordine-vendita-mctit.yaml

  - changeSet:
      id: 20261020-16-seed-template-standard-ordine-vendita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Seed del modello standard «Ordine di vendita» (ORDINE_VENDITA / ORDINE_VENDITA, codice interno ordine_vendita): riga in
        documenti.template_documenti senza emittente, una versione pubblicata (forma dei dati 2).
        Idempotente. Brief: brief-db-modelli-documento-standard §8.2, D-3.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: documenti
                tableName: template_documenti
                columnName: standard
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'documenti'
                     AND p.proname = 'fn_pubblica_template_documento_versione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $seed$
              DECLARE
                  v_tipo     documenti.template_documenti.tipo_documento_output_id%TYPE;
                  v_sorg     documenti.template_documenti.sorgente_tipo_id%TYPE;
                  v_render   documenti.template_documenti_versioni.render_engine_id%TYPE;
                  v_tpl      documenti.template_documenti.id%TYPE;
                  v_versione documenti.template_documenti_versioni.id%TYPE;
              BEGIN
                  SELECT o.id INTO v_tipo FROM documenti.tipi_documento_output o WHERE o.codice_interno = 'ORDINE_VENDITA';
                  SELECT s.id INTO v_sorg FROM config.sorgenti s WHERE s.codice_interno = 'ORDINE_VENDITA';
                  SELECT e.id INTO v_render FROM documenti.render_engine_documento e WHERE e.codice_interno = 'WEASYPRINT';
                  IF v_tipo IS NULL OR v_sorg IS NULL OR v_render IS NULL THEN
                      RAISE EXCEPTION 'seed standard ordine_vendita: vocabolario mancante (tipo ORDINE_VENDITA=%, sorgente ORDINE_VENDITA=%, render WEASYPRINT=%)',
                          v_tipo, v_sorg, v_render;
                  END IF;

                  -- Idempotente: lo standard si trova per chiave (standard, sorgente,
                  -- codice_interno), la stessa con cui lo troveranno le evoluzioni.
                  IF EXISTS (SELECT 1 FROM documenti.template_documenti t
                              WHERE t.standard AND t.sorgente_tipo_id = v_sorg AND t.codice_interno = 'ordine_vendita') THEN
                      RETURN;
                  END IF;

                  INSERT INTO documenti.template_documenti (
                      tipo_documento_output_id, codice, codice_interno, descrizione, sorgente_tipo_id,
                      context_builder_code, file_name_pattern, standard, is_default, attivo, meta)
                  VALUES (
                      v_tipo, 'ORDINE_VENDITA', 'ordine_vendita', 'Ordine di vendita (standard)', v_sorg,
                      'ORDINE_VENDITA', 'ordine-.pdf', true, true, true,
                      jsonb_build_object('brief', 'brief-db-modelli-documento-standard', 'origine', 'D-3'))
                  RETURNING id INTO v_tpl;

                  INSERT INTO documenti.template_documenti_versioni (
                      template_documento_id, versione, stato, titolo, formato_template, html_template, css_template,
                      render_engine_id, page_format, page_orientation,
                      margin_top_mm, margin_right_mm, margin_bottom_mm, margin_left_mm,
                      versione_contesto, meta)
                  VALUES (
                      v_tpl, 1, 'BOZZA', 'Ordine di vendita', 'HTML',
              $tpl$
              <!doctype html>
              <html lang="it">
              <head>
                <meta charset="utf-8">
                <title>Ordine {{ ordine.numero or ordine.id }}</title>
              </head>
              <body>
                <main class="document">
                  <header class="header">
                    <div class="brand">
                      <div class="brand-mark">ZE</div>
                      <div class="brand-name">{{ ordine.emittente.get("denominazione") or ordine.emittente.get("codice") or "Emittente fiscale" }}</div>
                    </div>

                    <div class="doc-title">
                      <h1>ORDINE DI VENDITA</h1>
                      <div class="doc-number">
                        N. {{ ordine.numero or ("ID " ~ ordine.id) }}
                        {% if ordine.serie %} / Serie {{ ordine.serie }}{% endif %}
                        {% if ordine.anno %} / {{ ordine.anno }}{% endif %}
                      </div>
                      <div class="status-pill">
                        {{ ordine.stato.descrizione or ordine.stato.codice_interno or "stato non indicato" }}
                      </div>
                    </div>
                  </header>

                  <section class="section two-columns">
                    <div class="column">
                      <div class="label">Cliente</div>
                      <div class="box">
                        <div class="box-strong">{{ cliente.denominazione or "Cliente non indicato" }}</div>
                        {% if cliente.id_fiscale %}
                          <div class="muted">ID fiscale: {{ cliente.id_fiscale }}</div>
                        {% endif %}
                        {% if cliente.ba_codice or cliente.billing_account_id %}
                          <div class="muted">
                            Billing account:
                            {{ cliente.ba_codice or ("ID " ~ cliente.billing_account_id) }}
                          </div>
                        {% endif %}
                        {% if indirizzi.consegna %}
                          <div class="muted">Luogo di consegna:</div>
                          {% if indirizzi.consegna.intestazione %}
                            <div>{{ indirizzi.consegna.intestazione }}</div>
                          {% endif %}
                          {% if indirizzi.consegna.via %}
                            <div>{{ indirizzi.consegna.via }}</div>
                          {% elif indirizzi.consegna.display %}
                            <div>{{ indirizzi.consegna.display }}</div>
                          {% endif %}
                          {% if indirizzi.consegna.cap or indirizzi.consegna.citta or indirizzi.consegna.prov %}
                            <div>
                              {{ [indirizzi.consegna.cap, indirizzi.consegna.citta] | select | join(" ") }}
                              {%- if indirizzi.consegna.prov %} ({{ indirizzi.consegna.prov }}){% endif %}
                            </div>
                          {% endif %}
                          {% if indirizzi.consegna.stato %}
                            <div>{{ indirizzi.consegna.stato }}</div>
                          {% endif %}
                        {% endif %}
                      </div>
                    </div>

                    <div class="column">
                      <div class="label">Dati ordine</div>
                      <div class="box">
                        <table class="facts">
                          <tbody>
                            <tr>
                              <th>Data</th>
                              <td>{{ ordine.data or "-" }}</td>
                            </tr>
                            <tr>
                              <th>Utility</th>
                              <td>{{ ordine.utility.descrizione or ordine.utility.codice or "-" }}</td>
                            </tr>
                            <tr>
                              <th>Pagamento</th>
                              <td>
                                {{ ordine.pagamento.modalita_codice or "-" }}
                                {% if ordine.pagamento.termine_codice %} / {{ ordine.pagamento.termine_codice }}{% endif %}
                              </td>
                            </tr>
                            <tr>
                              <th>Fatturazione</th>
                              <td>{{ ordine.fatturazione_trigger or "-" }}</td>
                            </tr>
                            <tr>
                              <th>Canale</th>
                              <td>{{ ordine.canale_origine or "-" }}</td>
                            </tr>
                            {% if ordine.agente_denominazione %}
                              <tr>
                                <th>Agente</th>
                                <td>{{ ordine.agente_denominazione }}</td>
                              </tr>
                            {% endif %}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </section>

                  {% if ordine.origine.tipo or ordine.origine.codice %}
                    <section class="section">
                      <div class="label">Origine documento</div>
                      <div class="box">
                        <strong>{{ ordine.origine.tipo or "Documento origine" }}</strong>
                        {% if ordine.origine.codice %}
                          <span class="muted"> - {{ ordine.origine.codice }}</span>
                        {% endif %}
                      </div>
                    </section>
                  {% endif %}

                  <section class="section">
                    <div class="table-title">Righe ordine</div>
                    <table class="lines">
                      <thead>
                        <tr>
                          <th style="width: 6%;">#</th>
                          <th>Descrizione</th>
                          <th class="num" style="width: 10%;">Q.ta</th>
                          <th style="width: 8%;">UoM</th>
                          <th class="num" style="width: 13%;">Prezzo</th>
                          <th class="num" style="width: 10%;">Sconto</th>
                          <th class="num" style="width: 10%;">IVA</th>
                          <th class="num" style="width: 15%;">Importo</th>
                        </tr>
                      </thead>
                      <tbody>
                        {% for r in righe %}
                          <tr>
                            <td>{{ r.get("riga_nr") or loop.index }}</td>
                            <td>
                              <div class="row-description">
                                {{ r.get("descrizione") or r.get("articolo_descrizione") or "Riga ordine" }}
                              </div>
                              {% if r.get("articolo_codice") %}
                                <div class="row-note">Articolo: {{ r.get("articolo_codice") }}</div>
                              {% endif %}
                            </td>
                            <td class="num">{{ r.get("quantita") or "-" }}</td>
                            <td>{{ r.get("uom_codice") or "-" }}</td>
                            <td class="num">{{ r.get("prezzo_unitario") or "-" }}</td>
                            <td class="num">
                              {% if r.get("sconto_percentuale") is not none %}
                                {{ r.get("sconto_percentuale") }}%
                              {% else %}
                                -
                              {% endif %}
                            </td>
                            <td class="num">
                              {{ r.get("iva_codice") or r.get("iva_descrizione") or "-" }}
                              {% if r.get("iva_aliquota") is not none %}
                                <br><span class="muted">{{ r.get("iva_aliquota") }}%</span>
                              {% endif %}
                            </td>
                            <td class="num">{{ r.get("importo_riga") or "-" }}</td>
                          </tr>
                        {% else %}
                          <tr>
                            <td colspan="8" class="muted">Nessuna riga disponibile nel context.</td>
                          </tr>
                        {% endfor %}
                      </tbody>
                    </table>
                  </section>

                  {% if riepilogo_iva %}
                    <section class="section">
                      <div class="table-title">Riepilogo IVA</div>
                      <table class="lines">
                        <thead>
                          <tr>
                            <th style="width: 18%;">IVA</th>
                            <th>Descrizione</th>
                            <th class="num" style="width: 16%;">Imponibile</th>
                            <th class="num" style="width: 16%;">Imposta</th>
                            <th class="num" style="width: 16%;">Totale</th>
                          </tr>
                        </thead>
                        <tbody>
                          {% for iva in riepilogo_iva %}
                            <tr>
                              <td>
                                {{ iva.get("iva_codice") or "-" }}
                                {% if iva.get("iva_aliquota") is not none %}
                                  <br><span class="muted">{{ iva.get("iva_aliquota") }}%</span>
                                {% endif %}
                              </td>
                              <td>
                                {{ iva.get("iva_descrizione") or "IVA non descritta" }}
                                {% if iva.get("natura_codice") %}
                                  <div class="row-note">Natura: {{ iva.get("natura_codice") }}</div>
                                {% endif %}
                              </td>
                              <td class="num">
                                {{ iva.get("imponibile") if iva.get("imponibile") is not none else "-" }}
                                {{ ordine.totali.valuta_codice or "" }}
                              </td>
                              <td class="num">
                                {{ iva.get("imposta") if iva.get("imposta") is not none else "-" }}
                                {{ ordine.totali.valuta_codice or "" }}
                              </td>
                              <td class="num">
                                {{ iva.get("totale_riga") if iva.get("totale_riga") is not none else "-" }}
                                {{ ordine.totali.valuta_codice or "" }}
                              </td>
                            </tr>
                          {% endfor %}
                        </tbody>
                      </table>
                    </section>
                  {% endif %}

                  <table class="totals">
                    <tbody>
                      <tr>
                        <th>Imponibile</th>
                        <td>{{ ordine.totali.imponibile or "-" }} {{ ordine.totali.valuta_codice or "" }}</td>
                      </tr>
                      <tr>
                        <th>Sconto</th>
                        <td>{{ ordine.totali.sconto or "-" }} {{ ordine.totali.valuta_codice or "" }}</td>
                      </tr>
                      <tr>
                        <th>IVA</th>
                        <td>{{ ordine.totali.iva or "-" }} {{ ordine.totali.valuta_codice or "" }}</td>
                      </tr>
                      <tr class="grand-total">
                        <th>Totale</th>
                        <td>{{ ordine.totali.documento or "-" }} {{ ordine.totali.valuta_codice or "" }}</td>
                      </tr>
                    </tbody>
                  </table>

                  <section class="conditions">
                    <strong>Note demo.</strong>
                    Template HTML di prova per stampa conferma d'ordine. Il contenuto usa solo il
                    document context ORDINE_VENDITA e non esegue query o chiamate esterne.
                  </section>
                </main>
              </body>
              </html>
              $tpl$,
              $tpl$
              @page {
                size: A4;
                margin: 18mm 16mm 18mm 16mm;


                @bottom-right {
                  content: "Pagina " counter(page) " di " counter(pages);
                  color: #6b7280;
                  font-size: 8pt;
                }
              }

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                color: #1f2937;
                font-family: "DejaVu Sans", Arial, sans-serif;
                font-size: 10pt;
                line-height: 1.45;
              }

              .document {
                width: 100%;
              }

              .header {
                display: table;
                width: 100%;
                padding-bottom: 14px;
                border-bottom: 2px solid #111827;
              }

              .brand,
              .doc-title {
                display: table-cell;
                vertical-align: top;
              }

              .brand {
                width: 52%;
              }

              .brand-mark {
                display: inline-block;
                min-width: 36px;
                min-height: 36px;
                padding: 8px 10px;
                background: #111827;
                color: #ffffff;
                font-size: 15pt;
                font-weight: 700;
                letter-spacing: 0;
                text-align: center;
              }

              .brand-name {
                margin-top: 8px;
                font-size: 12pt;
                font-weight: 700;
              }

              .brand-meta {
                margin-top: 2px;
                color: #6b7280;
                font-size: 8.5pt;
              }

              .doc-title {
                width: 48%;
                text-align: right;
              }

              h1 {
                margin: 0;
                color: #111827;
                font-size: 22pt;
                font-weight: 700;
                letter-spacing: 0;
              }

              .doc-number {
                margin-top: 6px;
                font-size: 11pt;
                font-weight: 700;
              }

              .status-pill {
                display: inline-block;
                margin-top: 8px;
                padding: 3px 8px;
                border: 1px solid #9ca3af;
                border-radius: 999px;
                color: #374151;
                font-size: 8pt;
                text-transform: uppercase;
              }

              .section {
                margin-top: 18px;
              }

              .two-columns {
                display: table;
                width: 100%;
                table-layout: fixed;
              }

              .column {
                display: table-cell;
                width: 50%;
                vertical-align: top;
              }

              .column + .column {
                padding-left: 18px;
              }

              .label {
                margin-bottom: 4px;
                color: #6b7280;
                font-size: 8pt;
                font-weight: 700;
                text-transform: uppercase;
              }

              .box {
                min-height: 62px;
                padding: 10px 12px;
                border: 1px solid #d1d5db;
                border-radius: 4px;
                background: #ffffff;
              }

              .box-strong {
                font-size: 11pt;
                font-weight: 700;
              }

              .muted {
                color: #6b7280;
              }

              table {
                width: 100%;
                border-collapse: collapse;
              }

              thead {
                display: table-header-group;
              }

              tr {
                page-break-inside: avoid;
                page-break-after: auto;
              }

              th,
              td {
                padding: 7px 6px;
                border-bottom: 1px solid #e5e7eb;
                vertical-align: top;
              }

              th {
                background: #f3f4f6;
                color: #374151;
                font-size: 8pt;
                font-weight: 700;
                text-align: left;
                text-transform: uppercase;
              }

              .facts th,
              .facts td {
                padding: 5px 0;
                border-bottom: 1px solid #e5e7eb;
              }

              .facts th {
                width: 42%;
                background: transparent;
                color: #6b7280;
                font-size: 8.5pt;
              }

              .facts td {
                text-align: right;
              }

              .table-title {
                margin: 22px 0 8px;
                color: #111827;
                font-size: 11pt;
                font-weight: 700;
              }

              .lines {
                page-break-inside: auto;
              }

              .num {
                text-align: right;
                white-space: nowrap;
              }

              .row-description {
                font-weight: 700;
              }

              .row-note {
                margin-top: 2px;
                color: #6b7280;
                font-size: 8.5pt;
              }

              .totals {
                width: 42%;
                margin-top: 18px;
                margin-left: auto;
              }

              .totals th,
              .totals td {
                padding: 6px 0;
                border-bottom: 1px solid #e5e7eb;
              }

              .totals th {
                background: transparent;
                color: #374151;
                font-weight: 700;
                text-align: left;
                text-transform: none;
              }

              .totals td {
                font-weight: 700;
                text-align: right;
                white-space: nowrap;
              }

              .grand-total th,
              .grand-total td {
                padding-top: 10px;
                border-bottom: 2px solid #111827;
                color: #111827;
                font-size: 13pt;
              }

              .conditions {
                margin-top: 24px;
                padding-top: 12px;
                border-top: 1px solid #d1d5db;
                color: #4b5563;
                font-size: 8.5pt;
              }
              $tpl$,
                      v_render, 'A4', 'PORTRAIT',
                      15, 15, 15, 15,
                      2, jsonb_build_object('brief', 'brief-db-modelli-documento-standard', 'origine', 'D-3'))
                  RETURNING id INTO v_versione;

                  -- Valida da sempre: la stampa sceglie la versione valida alla data
                  -- operativa, e un documento con una data passata deve trovarla.
                  PERFORM documenti.fn_pubblica_template_documento_versione(v_versione, DATE '2000-01-01', 2, NULL);
              END
              $seed$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Le versioni non si cancellano (trgfn_template_documenti_versioni_block_delete):
              -- per ritirare lo standard si spegne con un changeSet nuovo.
              SELECT 1;
