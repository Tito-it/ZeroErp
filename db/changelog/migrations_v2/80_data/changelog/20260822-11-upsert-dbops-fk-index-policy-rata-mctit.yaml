# GLI INDICI DELLE DUE FK DELLA RATA — passo S2-8 (lotto 5)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.2 S2-8
#
# ── ✅ DUE SI', ENTRAMBI PARZIALI ─────────────────────────────────────
#   Le due colonne `scadenza_id` sono **nullabili per disegno** e nulle sulla
#   maggior parte delle righe: ci sono incassi che saldano un documento senza
#   riferirsi a una rata, e la riga del fondo fattura e' il caso vivo. Su una
#   FK nullabile `WHERE <colonna> IS NOT NULL` copre il controllo referenziale
#   restando molto piu' piccolo (linee-guida-sql §8.4), e
#   `dbops.vw_fk_senza_indice` riconosce il caso.
#
#   ⚠️ **Ogni altro predicato no**: un parziale con, per dire,
#   `WHERE attivo IS TRUE` NON coprirebbe la FK, perche' il controllo
#   referenziale deve poter trovare qualsiasi riga figlia.
#
#   ⭐ E servono per davvero, non per completezza: `fn_get_saldo_rata` scandisce
#   **entrambe** le colonne a ogni domanda sul saldo di una rata — una per i
#   movimenti registrati, una per le righe in lavorazione — e la vista delle
#   rate fuori capienza le interroga per ogni rata toccata.
#
# ── ⚠️ `dll_command` va sempre valorizzato ────────────────────────────
#   `chk_fk_index_policy_dll_command_forma` lo impone su ogni riga,
#   `consentito = false` compreso: con il flag a falso la procedura ne estrae il
#   **nome** ed esegue il DROP su quello.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()` in
#    `90_end`. ✅ Dopo questo changeSet `dbops.vw_fk_senza_indice` per lo schema
#    `pagamenti` deve restare a **zero righe**, come l'ha lasciato il lotto 4.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260822-11-upsert-dbops-fk-index-policy-rata-mctit.yaml

  - changeSet:
      id: 20260822-11-upsert-dbops-fk-index-policy-rata
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Opt-in della policy indici FK per le due colonne scadenza_id (riga contabile e
        movimento). Entrambi PARZIALI su IS NOT NULL: le colonne sono nullabili per disegno
        e nulle sulla maggior parte delle righe, perche' ci sono incassi che saldano un
        documento senza riferirsi a una rata. Servono per davvero: fn_get_saldo_rata
        scandisce entrambe a ogni domanda sul saldo di una rata.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili_righe
                columnName: scadenza_id
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_movimenti
                columnName: scadenza_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/fk_index_policy_rata.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
