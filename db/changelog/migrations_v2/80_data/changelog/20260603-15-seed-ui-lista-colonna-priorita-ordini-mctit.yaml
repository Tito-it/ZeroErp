# DB-ORD (db-brief-ordini-vendita §4): valori espliciti di priorita per le
# colonne della lista vendite.ordini (lista_id risolto da codice).
#
# Stesso meccanismo dei seed preventivi/offerte (20260603-07/08): priorita nasce
# con DEFAULT 50 (20260602-13) e qui si impostano i pesi di dominio.
#
# ⚠️ RETTIFICA 2026-07-30 — il testo originale diceva che «la colonna priorita
# NON vive nel CSV lista_colonna.csv (il loader 20260507-07, gia' mergiato, non la
# espone)» e che «il re-run del loader NON tocca priorita». Era vero quando questo
# file e' stato scritto; NON lo e' piu': il loader espone tutte e 24 le colonne,
# priorita compresa, e il CSV ne porta i valori. Questo changeSet e' quindi oggi
# ridondante ma idempotente, e per una lista NUOVA non serve replicarlo: basta
# l'append a lista_colonna.csv con priorita valorizzata. Dettaglio e rettifica
# completa in 20260709-17 (gemello DDT) e in
# piano-migrazione-primevue-5.md §8-bis.
#
# Asse priorita (peso ritiro dinamico, piu' alto = resiste di piu'):
#   numero/azioni (100) identificatore/azione. ragione_sociale(95), stato(90),
#   totale_doc(80), id_fiscale(75), utility(70), data(60), ba_codice(40),
#   fatturazione_trigger(30: asse OdV ma di nicchia -> si ritira presto),
#   documento_origine(22)/agente(20) extra commerciali, importi/pagamento/valuta
#   (12..18), tecniche e audit basse (5..10).
#
# Gira DOPO il loader lista_colonna (20260507-07) che inserisce le righe ordini:
# includeAll ordina per nome file (20260603-13 > 20260507-07).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260603-15-seed-ui-lista-colonna-priorita-ordini-mctit.yaml

  - changeSet:
      id: 20260603-15-seed-ui-lista-colonna-priorita-ordini
      author: mctit
      # ⚠️ Era `true`, spento il 2026-08-06. Questo UPDATE scrive `priorita` su
      #   ui.lista_colonna, che e' una tabella con mirror CSV: due sorgenti per lo
      #   stesso dato. Verificato riga per riga che il CSV dichiara GIA' gli stessi
      #   valori (zero divergenze sulle sei liste), quindi qui non si decide piu'
      #   niente. Restando `true` rigirava a ogni invocazione di liquibase, e in CI
      #   sono due: la seconda passata riscriveva SOPRA il loader.
      #   La priorita' delle colonne si cambia SOLO da 80_data/sql/ui/lista_colonna.csv.
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Imposta priorita (peso ritiro dinamico) per le colonne della lista
        vendite.ordini. Valori di dominio dal brief DB-ORD §4.
      preConditions:
        - onFail: HALT
        - and:
          - columnExists:
              schemaName: ui
              tableName: lista_colonna
              columnName: priorita
          - sqlCheck:
              expectedResult: "1"
              sql: SELECT COUNT(*) FROM ui.lista_definizione WHERE codice = 'vendite.ordini'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE ui.lista_colonna lc
                 SET priorita = v.priorita
                FROM (
                  VALUES
                    ('numero',                     100),
                    ('ragione_sociale_completa',    95),
                    ('stato',                        90),
                    ('totale_doc',                   80),
                    ('id_fiscale',                   75),
                    ('utility_codice',               70),
                    ('data',                         60),
                    ('ba_codice',                    40),
                    ('fatturazione_trigger',         30),
                    ('documento_origine',            22),
                    ('agente',                       20),
                    ('imponibile_tot',               18),
                    ('iva_tot',                      18),
                    ('emittente_fiscale_codice',     15),
                    ('modalita_pagamento',           15),
                    ('canale_origine',               12),
                    ('termine_pagamento',            12),
                    ('valuta',                       12),
                    ('utility_descrizione',          10),
                    ('anno',                         10),
                    ('serie',                        10),
                    ('stato_codice_interno',          5),
                    ('data_insert',                   5),
                    ('azioni',                      100)
                ) AS v(codice, priorita)
               WHERE lc.codice = v.codice
                 AND lc.lista_id = (
                       SELECT id FROM ui.lista_definizione WHERE codice = 'vendite.ordini'
                     );
