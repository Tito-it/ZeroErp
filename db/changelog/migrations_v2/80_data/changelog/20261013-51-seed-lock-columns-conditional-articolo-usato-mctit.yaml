# ------------------------------------------------------------
# SEED dbops.lock_columns_conditional: le otto colonne strutturali
#   dell'articolo spente nel form quando l'articolo e' usato — e RITIRO della
#   regola «solo componente in bozza» (20261013-46)
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-10, §9.3 Lotto 3u)
#
#   E' il lato CAPABILITY (dbops.fn_non_editable_fields) di
#   catalogo.trgfn_articoli_guard_struttura_se_usato (20261013-48): la
#   condizione e' lo STESSO predicato, catalogo.fn_articolo_usato, non una
#   sua copia in testo (linee-guida-sql §12.2, punto 1).
#   Le regole della distinta sulle stesse colonne (20260522-04, 20261013-04)
#   restano: uq_lock_columns_conditional comprende condition_expr, e basta
#   una regola vera a spegnere il campo.
#   La regola del -46 si toglie: la comprende questa (un articolo in una riga
#   di bozza e' usato), e leggeva i documenti con la RLS di chi apre il form.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261013-51-seed-lock-columns-conditional-articolo-usato-mctit.yaml

  - changeSet:
      id: 20261013-51-seed-lock-columns-conditional-articolo-usato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.lock_columns_conditional (catalogo.articoli): le otto colonne strutturali spente nel form
        se catalogo.fn_articolo_usato; via la regola «solo componente in bozza» di 20261013-46. Brief:
        brief-db-articoli-ammessi-per-documento (§8.6 A-10).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: lock_columns_conditional
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DELETE FROM dbops.lock_columns_conditional
               WHERE schema_name = 'catalogo'
                 AND table_name  = 'articoli'
                 AND column_name = 'is_solo_componente'
                 AND condition_expr LIKE '%stati_doc_preventivi%';

              INSERT INTO dbops.lock_columns_conditional
                  (schema_name, table_name, column_name, condition_expr, descrizione)
              SELECT 'catalogo', 'articoli', c.colonna,
                     'catalogo.fn_articolo_usato($1::uuid)',
                     c.colonna || ' non modificabile se l''articolo e'' usato (documenti, listini, commesse, magazzino), simmetrico a trg_articoli_a10_guard_struttura_se_usato_upd (A-10)'
                FROM unnest(ARRAY['is_composito', 'is_solo_componente', 'natura_vendita_id',
                                  'causale_onere_id', 'listino_tipologia_id',
                                  'gestito_a_magazzino', 'requires_lotto', 'requires_serial']) AS c(colonna)
              ON CONFLICT ON CONSTRAINT uq_lock_columns_conditional DO UPDATE
                  SET descrizione = EXCLUDED.descrizione,
                      data_update = now(),
                      user_update = CURRENT_USER;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.lock_columns_conditional
               WHERE schema_name = 'catalogo'
                 AND table_name  = 'articoli'
                 AND condition_expr = 'catalogo.fn_articolo_usato($1::uuid)';
              -- ⚠️ La regola ritirata non torna da sola: va ri-applicato 20261013-46.
