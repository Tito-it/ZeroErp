# V-7 (ponte django, la policy) — dbops.fk_index_policy per le 11 FK verso
#   django.auth_user di 20260921-02..-12. Documento:
#   valutazione-modello-di-dominio-db, voce V-7.
#
# -- LA POLICY E' OPT-IN, quindi il silenzio non e' una scelta ----------------
#   fn_populate_fk_index_policy() registra da sola, a consentito=false, le FK
#   che trova SCOPERTE; le coperte non le vede. Qui si mette per iscritto la
#   decisione per tutte e undici, letta da pg_indexes il 21-09:
#   · 7 sono GIA' COPERTE da un indice esistente con la colonna in testa:
#     uq_auth_totp_device_auth_user, uq_user_emittente_attivo_auth_user,
#     uq_user_emittenti_fiscali_auth_user, uq_user_override_{aree,azioni,
#     oggetti}_*, ix_email_log_auth_user_id;
#   · token_monouso ha auth_user_id SECONDA in ix_token_monouso_tipo_user_
#     utilizzato (tipo, auth_user_id, utilizzato): per la policy e' scoperta,
#     ma il token si cerca per token e la tabella e' piccola → no;
#   · email_outbox (auth_user_id, creato_da_user_id) e vendite.event_log
#     (auth_user_id): nessuna lettura entra da quelle colonne (la coda si
#     legge per stato, il registro per entita' e per tempo) → no.
#   → consentito=false su dieci, con dll_command al nome canonico
#   (ix_<tabella>_<colonna>) che NON esiste: il DROP che la procedura fa sui
#   `false` e' un no-op.
#   ⚠️ email_log: consentito=TRUE. L'indice canonico ix_email_log_auth_user_id
#   ESISTE gia' (qualcuno lo ha voluto): un `false` lo farebbe DROPPARE alla
#   prima passata di apply_fk_index_policy() — e' la GUARDIA 2 al contrario,
#   che protegge solo UNIQUE/PK/replica. Col `true` la procedura vede la FK
#   coperta e salta (GUARDIA 1). Non e' una scelta sull'indice: e' non
#   toglierne uno che c'e'.
#
# -- rev 2026-09-25: una riga in piu' -------------------------------------------
#   config.email_log.creato_da_user_id (20260925-63, FK 20260925-70): chi ha
#   scritto la mail, gemella di quella dell'outbox e decisa come lei ->
#   consentito=false (la regola di visibilita' e' una funzione per riga, non
#   entra da un indice; nessuna lista legge per autore).
#   Brief: brief-db-email-visibilita-per-ambito.
#
# -- CSV DEDICATO, come 20260913-12 e 20260914-17 ----------------------------
#   fk_index_policy.csv e' un mirror di gennaio, dormiente: svegliarlo
#   rilegge 200 righe. La riga di deroga alla regola «una tabella, un CSV» e'
#   gia' scritta la', e questo file la eredita.
#
# -- ORDINE ---------------------------------------------------------------------
#   80_data gira PRIMA di 90_end: le righe entrano quando le FK ancora non
#   esistono. Va bene: la policy si legge per nome e la procedura (runAlways,
#   90_end/20250626-31) le incontra alla passata dopo, quando le FK ci sono —
#   o non ci sono mai (CI, MARK_RAN), e allora il no-op resta no-op.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260921-13-upsert-fk-index-policy-ponte-django-auth-user-mctit.yaml

  - changeSet:
      id: 20260921-13-upsert-fk-index-policy-ponte-django-auth-user
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per le 11 FK verso django.auth_user (20260921-02..-12): dieci a
        consentito=false (colonna gia' in testa a un indice, o nessuna lettura da li'),
        email_log a TRUE perche' ix_email_log_auth_user_id esiste gia' e un false lo
        dropperebbe. dll_command al nome canonico. Documento:
        valutazione-modello-di-dominio-db, voce V-7.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: vendite
                tableName: event_log
                columnName: auth_user_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/fk_index_policy_auth_user.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE constraint_name IN (
                 'fk_config_auth_totp_device_auth_user', 'fk_config_token_monouso_auth_user',
                 'fk_config_user_emittente_attivo_auth_user', 'fk_config_user_emittenti_fiscali_auth_user',
                 'fk_config_user_override_aree_auth_user', 'fk_config_user_override_azioni_auth_user',
                 'fk_config_user_override_oggetti_auth_user', 'fk_config_email_log_auth_user',
                 'fk_config_email_outbox_auth_user', 'fk_config_email_outbox_creato_da_user',
                 'fk_vendite_event_log_auth_user',
                 -- rev 2026-09-25 (20260925-70): la dodicesima.
                 'fk_config_email_log_creato_da_user');
