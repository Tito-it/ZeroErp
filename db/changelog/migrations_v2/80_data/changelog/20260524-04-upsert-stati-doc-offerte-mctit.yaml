# ------------------------------------------------------------
# Seed config.stati_doc_offerte: 5 stati del ciclo di vita
# dell'offerta commerciale.
#
#   id | codice_interno | descrizione          | ordine
#    1 | BOZZA          | Bozza                |  10
#    2 | EMESSA         | Emessa               |  20
#    3 | ACCETTATA      | Accettata            |  30
#    4 | RIFIUTATA      | Rifiutata            |  40
#    5 | SUPERATA       | Superata             |  50
#
# Transizioni ammesse (configurate in Step 4 - stati_doc_offerte_transizioni):
#   BOZZA -> EMESSA | RIFIUTATA
#   EMESSA -> ACCETTATA | RIFIUTATA | SUPERATA
#   Nessuna transizione uscente da stati terminali.
#
# Dipendenza: config.stati_doc_offerte deve esistere
#   (migration 20260524-02).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260524-04-upsert-stati-doc-offerte-mctit.yaml

  - changeSet:
      id: 20260524-04-upsert-stati-doc-offerte
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_offerte
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_offerte.csv
            tableName: stati_doc_offerte
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: STRING }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              # 2026-07-11: bottone PDF data-driven via capabilities
              - column: { name: pdf_mode, type: STRING }
              - column: { name: pdf_allow_allegati, type: BOOLEAN }
              # 2026-10-24 (20261024-07, brief-modello-documento-vendita P-1): lo stato in cui
              # un documento nasce. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: iniziale, type: BOOLEAN }
