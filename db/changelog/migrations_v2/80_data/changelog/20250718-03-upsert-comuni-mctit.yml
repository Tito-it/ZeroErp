databaseChangeLog:
  - changeSet:
      id: 20250718-02-upsert-comuni
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: comuni
            schemaName: config
      changes:
      

      # 2) Carico CSV: mappa geoloc -> geoloc_txt come STRING          
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/comuni.csv
            tableName: comuni
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id,            type: STRING }
              - column: { name: descrizione,   type: STRING }
              - column: { name: provincia_id,   type: STRING }
              - column: { name: data_insert,   type: STRING }
              - column: { name: user_insert,   type: STRING }
              - column:
                      name: data_update
                      type: STRING
                      defaultValue: "NOW()"
              - column: { name: user_update,      type: STRING }
              - column:
                  name: extra_country
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}" 
              - column: { name: storicizza,      type: STRING }
              - column: { name: tx_id,    type: uuid  }
             
    
  - changeSet:
      id: 20250718-90-upsert-comuni
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250718-03-upsert-comuni