# LA FK NUOVA DEL GIORNALE ENTRA SOTTO GOVERNO — L1 del Passo 0
#   dbops.fk_index_policy per fk_event_log_emittente
#   Brief: brief-db-event-log-scope-e-riga-parlante.md §4
#
# ── PERCHE' `consentito = false` ────────────────────────────────────
#   Un indice su `emittente_soggetto_ruolo_id` **non verrebbe usato**, e la
#   scrittura in piu' si pagherebbe su ogni evento:
#
#   * la query forense filtra per ENTITA' — `entity_type, entity_id` — ed e'
#     servita da `ix_event_log_entity_time`, che c'e' gia';
#   * il perimetro non entra come confronto in un piano: la policy chiama
#     `script.fn_scope_ef_whitelist_via_sr(...)`, e un indice su una colonna
#     passata a una funzione non viene scelto;
#   * il controllo referenziale verso `anagrafiche.soggetti_ruoli` scatta su
#     UPDATE/DELETE del padre, che su un'anagrafica stabile non succede.
#
#   ⚠️ **La policy e' OPT-IN**: senza una riga a `consentito = true`
#   l'automazione non crea niente. Questa riga serve comunque, per **dichiarare
#   la scelta**: senza, la FK comparirebbe in `dbops.vw_fk_con_indice_missing_policy`
#   come «candidata al governo» e qualcuno prima o poi ci pianterebbe sopra un
#   indice, non sapendo che era una decisione.
#
# ── ⚠️ `dll_command` VALORIZZATO ANCHE A `false` ────────────────────
#   Un CHECK lo impone, e il ramo `consentito = false` di
#   `dbops.apply_fk_index_policy()` **estrae da li' il nome dell'indice** per il
#   DROP. Un comando vuoto lo lascerebbe senza bersaglio; un nome inventato
#   diverso da quello reale gli farebbe creare un gemello sotto quel nome.
#
# ── ⛔ E L'INDICE NON SI CREA A MANO ────────────────────────────────
#   Gli indici governati dalla policy si accendono e si spengono dal flag:
#   `apply_fk_index_policy()` gira `runAlways` in `90_end`, e annullerebbe al
#   primo migrate qualunque CREATE o DROP scritto a mano.
#
# Dipendenze: vincolo fk_event_log_emittente (20260822-40).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260822-41-upsert-fk-index-policy-event-log-mctit.yaml

  - changeSet:
      id: 20260822-41-upsert-fk-index-policy-event-log
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_event_log_emittente, a consentito = false. La query
        forense filtra per entita' (servita da ix_event_log_entity_time), il perimetro
        entra nel piano come chiamata di funzione e non come confronto indicizzabile, e il
        padre e' un'anagrafica stabile: un indice non verrebbe scelto e la scrittura in
        piu' si pagherebbe su ogni evento. La riga serve a DICHIARARE la scelta, non a
        creare l'indice. dll_command valorizzato lo stesso: il CHECK lo impone e con il
        flag a falso la procedura ne estrae il nome per il DROP.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            schemaName: vendite
            tableName: event_log
            columnName: emittente_soggetto_ruolo_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_event_log.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
