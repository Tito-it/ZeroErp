databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260215-11-set-richiede-pdp-utilities-mctit.yaml

  - changeSet:
      id: 20260215-11-set-richiede-pdp-utilities
      author: mctit
      comment: "Imposta richiede_pdp=true per utilities GAS/ENERGIA/IDRICO"
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: utilities
        - columnExists:
            schemaName: config
            tableName: utilities
            columnName: richiede_pdp
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE config.utilities
                 SET richiede_pdp = CASE
                   WHEN codice_interno IN ('GAS', 'ENERGIA', 'IDRICO') THEN true
                   ELSE false
                 END;

