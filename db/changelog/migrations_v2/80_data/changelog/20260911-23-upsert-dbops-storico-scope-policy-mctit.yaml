# Seed di CATALOGO di `dbops.storico_scope_policy` — passo 2 del brief.
#   Brief: brief-db-rls-storico-scope-congelato.md §4b (D3)
#
# Una riga per ognuna delle 121 madri che portano il trigger di storico
# (letto dal catalogo il 2026-09-11): 37 protette dalla RLS con la loro strada
# verso l'emittente (6 EF, 3 SR, 3 BA, 25 PADRE), 84 dichiarate NESSUNO con la
# ragione. ⭐ Il CSV è stato GENERATO dal catalogo, non scritto a mano: il modo
# viene dalla funzione di scope della policy `ef_whitelist` della madre, e il
# padre dalla FK REALE sulla colonna di risalita — così il seed dice ciò che il
# database dice, e il pgTAP può smentirlo.
#
# ⚠️ Mirror `loadUpdateData`, `runOnChange`: si modifica il CSV, mai con un
#   UPDATE a parte (AGENTS §80_data). Il `NULL` è il token letterale.
# ⚠️ La FK differita su se stessa (padre → riga di mappa) si verifica al
#   COMMIT del changeSet: un CSV con un padre senza riga fallisce qui.
# ⚠️ Seed di catalogo, non di macchina: nomina tabelle del software, non
#   righe di questa installazione. Nessun `context`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260911-23-upsert-dbops-storico-scope-policy-mctit.yaml

  - changeSet:
      id: 20260911-23-upsert-dbops-storico-scope-policy
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Seed di catalogo di dbops.storico_scope_policy dal CSV (mirror
        loadUpdateData): le 121 madri col trigger di storico al 2026-09-11 — 37
        protette con la strada verso l'emittente (EF, SR, BA, PADRE), 84
        dichiarate NESSUNO con la ragione. Generato dal catalogo: modo dalla
        policy ef_whitelist, padre dalla FK reale.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: storico_scope_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/storico_scope_policy.csv
            tableName: storico_scope_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: schema_tabella, type: STRING }
              - column: { name: nome_tabella, type: STRING }
              - column: { name: modo, type: STRING }
              - column: { name: colonna, type: STRING }
              - column: { name: padre_schema, type: STRING }
              - column: { name: padre_tabella, type: STRING }
              - column: { name: ragione, type: STRING }
              # ⚠️ La data sta nel CSV e non si lascia al DEFAULT: su un
              #   database ricostruito da zero CURRENT_DATE direbbe «oggi», e
              #   l'orologio del debito ripartirebbe da capo a ogni build.
              - column: { name: data_registrazione, type: DATE }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.storico_scope_policy;
