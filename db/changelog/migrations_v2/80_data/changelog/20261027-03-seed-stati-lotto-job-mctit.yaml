# Seed config.stati_lotto_job: i tre stati del job di un lotto.
#   Brief: brief-modello-documento-vendita §15 (giro 11; F-4, P-1).
#   Tabella: 20261027-02. I codici sono quelli che vendite.fatturazione_lotti.stato_lotto
#   porta da sempre (prima nel CHECK chk_fatturazione_lotti_stato_job): la FK
#   sul codice (20261027-05, 90_end) li ritrova uguali.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261027-03-seed-stati-lotto-job-mctit.yaml

  - changeSet:
      id: 20261027-03-seed-stati-lotto-job
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_lotto_job
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_lotto_job.csv
            tableName: stati_lotto_job
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: ordine, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
