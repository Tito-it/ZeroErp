# L'INDICE DELLA FK NUOVA DI `enti_incasso` — passo S3-1 (lotto 6)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.3 S3-1
#
# ── ⛔ UN «NO» MOTIVATO, non una dimenticanza ────────────────────────
#   `pagamenti.enti_incasso` e' un **catalogo di canali**: oggi zero righe, a
#   regime **due o tre**. Un indice su una tabella cosi' non viene mai scelto dal
#   pianificatore, e il costo che avrebbe — una scrittura in piu' a ogni modifica
#   — sarebbe pagato per niente.
#
#   ⚠️ Le tre FK che questa tabella aveva gia' sono tutte a `consentito = false`
#   per la stessa ragione: la riga nuova **non introduce un'eccezione**, si
#   allinea.
#
#   ⭐ E la catena che il perimetro percorre — `contabile → ente → conto` — non
#   passa mai per **questa** direzione: si entra dall'ente per `id`, che e' la
#   chiave primaria.
#
# ── ⚠️ `dll_command` va sempre valorizzato ───────────────────────────
#   `chk_fk_index_policy_dll_command_forma` lo impone su ogni riga, `false`
#   compreso: con il flag a falso la procedura ne estrae il **nome** ed esegue il
#   `DROP` su quello.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()` in
#    `90_end`. ✅ Dopo questo changeSet `dbops.vw_fk_senza_indice` per lo schema
#    `pagamenti` deve restare a **zero righe**, come dal lotto 4.
#
# ── 📌 E l'esclusione del changeSet -15? ─────────────────────────────
#   `ex_src_bancari_conto_incasso_un_solo_soggetto` **porta con se' il proprio
#   indice GiST**: un vincolo di esclusione non esiste senza. Non e' una FK e non
#   passa da questo registro.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260822-23-upsert-dbops-fk-index-policy-ente-conto-mctit.yaml

  - changeSet:
      id: 20260822-23-upsert-dbops-fk-index-policy-ente-conto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_enti_incasso_conto_incasso, a consentito = false. E' un
        catalogo di canali: zero righe oggi, due o tre a regime — un indice non verrebbe mai
        scelto e la scrittura in piu' sarebbe pagata per niente. Le tre FK che la tabella
        aveva gia' sono tutte a false per la stessa ragione. dll_command valorizzato lo
        stesso: il CHECK lo impone, e con il flag a falso la procedura ne estrae il nome per
        il DROP.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            schemaName: pagamenti
            tableName: enti_incasso
            columnName: soggetto_ruolo_conto_bancario_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/fk_index_policy_ente_conto.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
