# brief-db-processi-automatici-identita-e-perimetro §2.3/§2.5 — i bersagli dei
# soli processi DOMINIO, con il percorso che porta all'emittente.
#
# Dichiarati solo per il DOMINIO: e' la classe su cui il presidio guarda, e i
# processi di manutenzione scrivono struttura ovunque — un elenco per loro
# sarebbe rumore che nessuno terrebbe aggiornato.
#
# ⚠️ La riga di config.email_outbox nasce SENZA percorso, di proposito: e' il
# «Caso B» (la separazione nel modello non c'e') dichiarato invece che
# nascosto. Fara' accendere vw_processi_dominio_senza_emittente finche' il
# cantiere email non chiude, ed e' il comportamento voluto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260904-14-upsert-dbops-processi-bersagli-mctit.yaml

  - changeSet:
      id: 20260904-14-upsert-dbops-processi-bersagli
      author: mctit
      runOnChange: true
      failOnError: true
      comment: >
        Seed di catalogo di dbops.processi_bersagli dal CSV (mirror
        loadUpdateData): le tabelle scritte dai processi DOMINIO e il percorso
        verso l'emittente.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: processi_bersagli
            - tableExists:
                schemaName: dbops
                tableName: processi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/processi_bersagli.csv
            tableName: processi_bersagli
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: processo_id, type: NUMERIC }
              - column: { name: schema_tabella, type: STRING }
              - column: { name: nome_tabella, type: STRING }
              - column: { name: emittente_via, type: STRING }
              - column: { name: emittente_colonna, type: STRING }
              - column: { name: note, type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.processi_bersagli;
