# Seed config.classi_utenze — il mirror CSV che nessuno caricava.
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   80_data/sql/config/classi_utenze.csv esisteva, ma nessun changelog lo
#   caricava (CSV orfano): su un database ricostruito dai changelog la
#   tabella era VUOTA. anagrafiche/test-istanze-dati-precontrattuali
#   pretende una classe utenza e moriva sulla precondizione
#   (brief-db-fixture-che-costruiscono-giro-2, §11). Tid, 2026-09-23: il
#   contenuto e' catalogo, si carica; il CSV e' stato ri-esportato con il
#   token NULL (linee-guida-sql §11.7).
#
# ── SPECIE DEL SEED (linee-guida-sql §11.7) ──────────────────────────
#   CATALOGO: le FK puntano solo a config.* (tipi_utenze, categoria_accisa,
#   tipi_tariffe_ee), nessuna ad anagrafiche.*. Nessun contesto dati_macchina.
#   ⚠️ id esplicito su una colonna identity: il riallineamento della
#   sequenza lo fa la passata globale di 90_end (20260818-72), come per
#   ogni mirror con id espliciti.
#   ⚠️ categoria_accisa_id e tipi_tariffa_ee_id sono NULL nella riga di oggi:
#   i loro CSV (vuoti, anch'essi orfani) non servono a questo seed.
#
# Ordine: dopo 20260923-52 (config.tipi_utenze).
# Brief: brief-db-fixture-che-costruiscono-giro-2.md §11.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260923-53-seed-classi-utenze-mctit.yaml

  - changeSet:
      id: 20260923-53-seed-classi-utenze
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Seed config.classi_utenze dal mirror 80_data/sql/config/classi_utenze.csv,
        che nessun changelog caricava. Catalogo (FK solo verso config.*).
        Mirror loadUpdateData, dopo tipi_utenze (20260923-52).
        Brief: brief-db-fixture-che-costruiscono-giro-2 §11.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: classi_utenze
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/classi_utenze.csv
            tableName: classi_utenze
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: descrizione_breve, type: STRING }
              - column: { name: tipo_utenza_id, type: NUMERIC }
              - column: { name: categoria_accisa_id, type: NUMERIC }
              - column: { name: pot_contratto_min_ee, type: NUMERIC }
              - column: { name: pot_contratto_max_ee, type: NUMERIC }
              - column: { name: tipi_tariffa_ee_id, type: NUMERIC }
              - column: { name: tipo_pod, type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Un mirror non si de-carica: le righe possono essere gia'
              -- referenziate da anagrafiche.istanze_dati_precontrattuali.
              SELECT 1;
