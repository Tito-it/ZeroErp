# Liquibase changelog per Zero ERP
# Seed parametri storage documenti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260429-59-upsert-parameters-documenti-storage-mctit.yaml

  - changeSet:
      id: 20260429-59-upsert-parameters-documenti-storage
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Registra i parametri non segreti del modulo documenti per storage e
        limiti dimensionali. Nessuna credenziale in chiaro. I parametri
        config.parameters.default_value restano sempre stringhe non NULL:
        stringa vuota per "non configurato", SQL NULL solo dove ammesso
        dal tracciato (es. tx_id).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: parameters
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters_documenti_storage.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: code, type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: tx_id, type: uuid }
              - column: { name: storicizza, type: STRING }

  - changeSet:
      id: 20260429-59-90-upsert-parameters-documenti-storage
      author: mctit
      changes:
        - tagDatabase:
            tag: 20260429-59-upsert-parameters-documenti-storage
