# ⭐ P-3 — L'INDICE CHE MANCAVA A fatturazione_lotti_log: quello su lotto_id.
#   dbops.fk_index_policy: fk_fatturazione_lotti_log_lotto -> consentito=true.
#   Brief: brief-db-osservabilita-lotto-fermo-r6-indici §4.1 (trovato
#   scrivendo P-1, non chiesto dal brief).
#
# ── IL FATTO, letto da pg_indexes il 19-09 ───────────────────────────
#   vendite.fatturazione_lotti_log ha la sola PK. Fra le quattro sorgenti del
#   giornale e del riepilogo e' l'unica senza un indice sulla colonna del
#   padre: fatture_log ha ix_fatture_log_fattura_id, task_runs ed esiti la
#   UNIQUE con lotto_id in testa, lotti_fatture la UNIQUE (lotto_id,
#   fattura_id). La riga di policy c'era (postgres, 2026-01-25, dallo script
#   di popolamento) a consentito=false — cioe' nessuno aveva mai deciso.
#
# ── PERCHE' SI' ─────────────────────────────────────────────────────
#   Ogni lettura del canale lotto entra da `lotto_id`: la Storia del lotto
#   (ramo LOTTO_LOG del giornale, WHERE ll.lotto_id = $1), il riepilogo per
#   un lotto (fn_get_lotto_segnalazioni_summary → il pushdown nella GROUP BY
#   della sede unica), fn_list_lotto_segnalazioni, il presidio. Senza
#   l'indice sono scansioni dell'intero registro per servire le otto righe di
#   un lotto — misurato con EXPLAIN il 19-09 sulla sede unica: Seq Scan,
#   1217 righe scartate per 8 tenute. E il registro cresce per 750 giorni
#   (Passo D). Si decide sulla query, non sulla FK (linee-guida-sql §8.7).
#
# ── ⚠️ Non e' un composto (lotto_id, data_ora) ─────────────────────────
#   La lettura per lotto ordina poche righe; la lettura per tempo la serve
#   ix_fatturazione_lotti_log_data_ora (20260919-05). Un composto sarebbe
#   coperto per prefisso dalla policy — che ne registrerebbe il nome canonico
#   a false — e servirebbe due domande a meta'. Due indici semplici, due
#   domande, due sedi che si spiegano da sole.
#
# ── CSV dedicato con loader suo: la forma del registro delle FK ───────
#   dbops.fk_index_policy non e' un catalogo con un mirror unico: il
#   popolamento lo fa dbops.fn_populate_fk_index_policy() a consentito=false,
#   e ogni DECISIONE e' un CSV di cantiere col suo perche' (la forma di tutte
#   le ventitre' decisioni in 80_data, l'ultima 20260913-12). ⚠️ La regola
#   del 18-09 «una tabella, un CSV» colpisce il laterale che RIPETE una riga
#   gia' in un altro CSV: questa riga non sta in nessun CSV (il mirror di
#   gennaio non la conosce), quindi non c'e' una seconda sorgente.
# ⛔ Creazione e rimozione restano di dbops.apply_fk_index_policy() in
#   90_end (runAlways): qui si tocca solo il flag. Con `true` la procedura
#   crea SOLO se la FK figura ancora in vw_fk_senza_indice — e ci figura.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260919-07-upsert-fk-index-policy-lotti-log-lotto-mctit.yaml

  - changeSet:
      id: 20260919-07-upsert-fk-index-policy-lotti-log-lotto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK: fk_fatturazione_lotti_log_lotto a consentito=true,
        con la ragione (ogni lettura del canale lotto — Storia, riepilogo,
        presidio — entra da lotto_id, e la tabella aveva la sola PK). L'indice
        lo crea dbops.apply_fk_index_policy() in 90_end. P-3 di
        brief-db-osservabilita-lotto-fermo-r6-indici.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - tableExists:
                schemaName: vendite
                tableName: fatturazione_lotti_log
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_lotti_log.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Torna al «nessuno ha deciso»: il flag a false, l'indice lo
              -- toglie apply_fk_index_policy() al migrate successivo.
              UPDATE dbops.fk_index_policy
                 SET consentito = false
               WHERE schema_name = 'vendite'
                 AND table_name = 'fatturazione_lotti_log'
                 AND constraint_name = 'fk_fatturazione_lotti_log_lotto';
