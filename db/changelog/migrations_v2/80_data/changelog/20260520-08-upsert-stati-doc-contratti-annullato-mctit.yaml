#
# Aggiunge ANNULLATO a config.stati_doc_contratti e upserta is_abortito.
#
# Prerequisito: migration 20260520-07 (colonna is_abortito aggiunta).
#
# Nuovo seed: id=8, codice_interno=ANNULLATO, is_abortito=TRUE.
# Righe esistenti: is_abortito=FALSE (già il default, upsert idempotente).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260520-08-upsert-stati-doc-contratti-annullato-mctit.yaml

  - changeSet:
      id: 20260520-08-upsert-stati-doc-contratti-annullato
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Aggiunge ANNULLATO (id=8, ordine=70, is_abortito=TRUE) a config.stati_doc_contratti.
        Upserta is_abortito su tutte le righe esistenti (FALSE per DRAFT/ATTIVO/CESSATO).
        Prerequisito: 20260520-07 (ADD COLUMN is_abortito).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: stati_doc_contratti
            - columnExists:
                schemaName: config
                tableName: stati_doc_contratti
                columnName: is_abortito
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_contratti.csv
            tableName: stati_doc_contratti
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id,             type: STRING }
              - column: { name: codice_interno,  type: STRING }
              - column: { name: codice,          type: STRING }
              - column: { name: descrizione,     type: STRING }
              - column: { name: attivo,          type: BOOLEAN }
              - column: { name: ordine,          type: STRING }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert,     type: STRING }
              - column: { name: user_insert,     type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,     type: STRING }
              - column: { name: is_abortito,     type: BOOLEAN }
              # 2026-07-11: bottone PDF data-driven via capabilities
              - column: { name: pdf_mode,           type: STRING }
              - column: { name: pdf_allow_allegati, type: BOOLEAN }
              # 2026-10-24 (20261024-07, brief-modello-documento-vendita P-1): lo stato in cui
              # un documento nasce. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: iniziale, type: BOOLEAN }
              # 2026-10-25 (20261025-37, brief-modello-documento-vendita §8): lo stato di
              # emissione. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: emissione, type: BOOLEAN }
