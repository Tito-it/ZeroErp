# Upsert dei parametri DEFAULT_TIPO_SOGGETTO_DETTAGLIO_<RUOLO>.
#
# Why: questi 2 parametri (CL/FO) sono validati dal guard trigger
# config.trgfn_parameters_guard_default_tipo_soggetto_dettaglio
# (creato in 20260427-05) che fa lookup su
# config.tipi_soggetto_dettaglio.codice_interno. L'upsert generale di
# parameters (20250715-01) e' alfabeticamente antecedente al seed di
# tipi_soggetto_dettaglio (20250717-12) -> al primo boot della CI il
# guard troverebbe la tabella di lookup vuota e fallirebbe con
# E_PARAMETER_DEFAULT_TIPO_SOGGETTO_INVALID + fallback "MESSAGGIO NON
# DEFINITO" (anche messaggi_errore.csv 20250717-22 e' caricato dopo).
#
# Fix: caricare le 2 righe DEFAULT_TIPO_SOGGETTO_DETTAGLIO_* in un
# changeset DOPO sia tipi_soggetto_dettaglio (20250717-12) sia
# messaggi_errore (20250717-22), via CSV dedicato. Cosi' al momento
# dell'upsert il lookup trova 'PR' e (in caso di violazione futura) il
# messaggio errore 399 e' gia' risolvibile.
#
# Pattern: stesso identico shape del 20250715-01 (loadUpdateData con
# stesse colonne, runOnChange + ANY checksum), solo CSV differente.
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20250717-23-upsert-parameters-default-tipo-soggetto-dettaglio
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameters
            - tableExists:
                schemaName: config
                tableName: tipi_soggetto_dettaglio
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM config.tipi_soggetto_dettaglio
                   WHERE codice_interno = 'PR';
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters_default_tipo_soggetto_dettaglio.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }
              - column: { name: code, type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: tx_id, type: uuid }
              - column: { name: storicizza, type: STRING }
