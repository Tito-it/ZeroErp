# P-1/P-2 — LA DECISIONE SULL'INDICE DELLA FK NUOVA: un NO, scritto
#   dbops.fk_index_policy: fk_articoli_modi_approvvigionamento -> consentito=false
#   Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3.2
#
# -- LA POLICY E' OPT-IN, quindi il silenzio non e' una scelta ------------
#   fn_populate_fk_index_policy() registra le FK nuove con consentito=false
#   da sola: senza questo file l'indice non nascerebbe comunque. Il seed
#   mette per iscritto PERCHE' no — una riga a false scritta apposta e una
#   messa da uno script si distinguono solo qui.
#
# -- PERCHE' NO --------------------------------------------------------------
#   Nessuna interrogazione dell'applicazione entra da modo_approvvigionamento_id:
#   la lista articoli filtra per tipologia/gruppo/attivo e ordina per codice,
#   il drawer legge per id. Il controllo referenziale scatta solo quando
#   qualcuno spegne un modo — quattro righe di catalogo — e costa meno del
#   mantenimento dell'indice su ogni scrittura di articoli. Se un giorno una
#   lista entrera' da qui («tutti gli articoli in PRODUZIONE»), si accende
#   il flag; accenderlo adesso sarebbe indicizzare su una previsione
#   (linee-guida-sql 8.7 e 10.9: si decide sulla query, non sulla FK).
#
# -- dll_command VALORIZZATO ANCHE A false ------------------------------
#   Lo impone chk_fk_index_policy_dll_command_forma, e serve: col flag a
#   falso apply_fk_index_policy() ne estrae il NOME ed esegue il DROP su
#   quello. Il nome e' quello dedicato canonico (ix_<tabella>_<colonna>),
#   che oggi non esiste: il DROP e' un no-op.
#
# ⚠️ CSV DEDICATO con loader suo, non un append a fk_index_policy.csv: quel
#   mirror e' di gennaio e sveglierlo rilegge 200 righe (linee-guida-sql
#   11.2). La riga di P-4 (fk_commesse_risorse_umane) entrera' in questo
#   stesso CSV quando P-4 sara' scritta.
# ⛔ Creazione e rimozione restano di dbops.apply_fk_index_policy() in
#   90_end: qui si tocca solo il flag.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260913-12-upsert-fk-index-policy-approvvigionamento-mctit.yaml

  - changeSet:
      id: 20260913-12-upsert-fk-index-policy-approvvigionamento
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK del cantiere approvvigionamento: fk_articoli_modi_approvvigionamento
        a consentito=false, con la ragione (nessuna query entra da quella colonna; quattro
        righe di catalogo dal lato padre). dll_command valorizzato col nome canonico per il
        DROP. Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3.2.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: catalogo
                tableName: articoli
                columnName: modo_approvvigionamento_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/catalogo/fk_index_policy_approvvigionamento.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE schema_name = 'catalogo'
                 AND table_name = 'articoli'
                 AND constraint_name = 'fk_articoli_modi_approvvigionamento';
