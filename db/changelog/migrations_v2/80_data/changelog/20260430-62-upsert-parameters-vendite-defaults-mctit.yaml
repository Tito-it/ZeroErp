# Liquibase changelog per Zero ERP
# Seed parametri vendite defaults non-BA (Fase 2 refactor frontend vendite)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260430-62-upsert-parameters-vendite-defaults-mctit.yaml

  - changeSet:
      id: 20260430-62-upsert-parameters-vendite-defaults
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Registra i parametri di default non-BA (globali) per i form di create
        in area vendite — Fase 2 refactor frontend vendite (2026-04-30,
        documento analisi-refactor.frontend-vendite.md sezione 2.D1).

        Sostituiscono i valori cablati in PreventiviDrawer.vue,
        ContrattoDrawer.vue, VersioneFormDrawer.vue, CloneVersioneDrawer.vue,
        ChiudiVersioneDialog.vue, PromoArticoloDrawer.vue.

        I default BA-dipendenti (categoria_cliente_snapshot, valuta dal BA,
        termine_pagamento dal BA) NON sono qui: vivono nell'endpoint
        dedicato form-defaults BE (Fase 2.B3/2.B4), che fa lookup contestuale
        per billing_account_id.

        Codici e valori (13 parametri):
          VENDITE_PREVENTIVO_DEFAULT_VALIDITA_GG              = 30
          VENDITE_PREVENTIVO_DEFAULT_FATTURAZIONE_IMMEDIATA   = false
          VENDITE_CONTRATTO_DEFAULT_AMBITO                    = COMMODITY
          VENDITE_CONTRATTO_DEFAULT_MODALITA                  = A
          VENDITE_CONTRATTO_DEFAULT_TIPO_VARIAZIONE_GLOBALE   = PERCENTUALE
          VENDITE_CONTRATTO_DEFAULT_DATA_LEAD_GG              = 0
          VENDITE_CONTRATTO_DEFAULT_VALIDO_DAL_LEAD_GG        = 0
          VENDITE_LISTINI_NEW_VERSIONE_LEAD_GG                = 0
          VENDITE_LISTINI_CLONE_VERSIONE_LEAD_GG              = 1
          VENDITE_LISTINI_CLONE_VERSIONE_CODICE_SUFFIX        = -clone
          VENDITE_LISTINI_CLOSE_VERSIONE_LEAD_GG              = 0
          VENDITE_PROMO_DEFAULT_VALIDO_DAL_LEAD_GG            = 1
          VENDITE_PROMO_DEFAULT_ATTIVO                        = true

        I valori sono sempre stringhe non-NULL come da pattern parameters
        (default_value text NOT NULL): boolean rappresentati come 'true'/'false'
        lowercase, numerici come '0'/'1'/'30'.

        runOnChange + validCheckSum ANY consentono retroactive update dei
        valori senza nuovo file (modificare il CSV e il changeset rigira).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: parameters
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters_vendite_defaults.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: code, type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: tx_id, type: uuid }
              - column: { name: storicizza, type: STRING }

  - changeSet:
      id: 20260430-62-90-upsert-parameters-vendite-defaults
      author: mctit
      changes:
        - tagDatabase:
            tag: 20260430-62-upsert-parameters-vendite-defaults
