databaseChangeLog:
  - changeSet:
      id: 20250812-01-upsert-valute
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: valute
            schemaName: config
      loadUpdateData:
        relativeToChangelogFile: true
        file: ../sql/config/valute.csv
        tableName: valute
        schemaName: config
        separator: ","
        encoding: UTF-8
        nullValue: ""
        primaryKey:
          - id
        columns:
          - column: { name: id,            type: STRING }
          - column: { name: iso_code,            type: STRING }
          - column: { name: codice,          type: STRING }
          - column: { name: iso_num_code,       type: NUMERIC }
          - column: { name: descrizione, type: STRING }
          - column: { name: simbolo,            type: STRING }

          - column: { name: data_insert,   type: STRING }
          - column: { name: user_insert,   type: STRING }
          - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
          - column: { name: user_update,      type: STRING }
          
  
  - changeSet:
      id: 20250812-90-upsert-valute
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250812-01-upsert-valute