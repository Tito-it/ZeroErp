              }

              .totals th,
              .totals td {
                padding: 6px 0;
                border-bottom: 1px solid #e5e7eb;
              }

              .totals th {
                background: transparent;
                color: #374151;
                font-weight: 700;
                text-align: left;
                text-transform: none;
              }

              .totals td {
                font-weight: 700;
                text-align: right;
                white-space: nowrap;
              }

              .grand-total th,
              .grand-total td {
                padding-top: 10px;
                border-bottom: 2px solid #111827;
                color: #111827;
                font-size: 13pt;
              }

              .conditions {
                margin-top: 24px;
                padding-top: 12px;
                border-top: 1px solid #d1d5db;
                color: #4b5563;
                font-size: 8.5pt;
              }

              /* Blocco firme DDT (conducente / vettore / destinatario) */
              .signatures {
                display: table;
                width: 100%;
                margin-top: 28px;
                table-layout: fixed;
                page-break-inside: avoid;
              }

              .signature-cell {
                display: table-cell;
                width: 33.33%;
                vertical-align: bottom;
              }

              .signature-cell + .signature-cell {
                padding-left: 18px;
              }

              .signature-line {
                height: 34px;
                border-bottom: 1px solid #374151;
              }
              $tpl$,
                      v_render, 'A4', 'PORTRAIT',
                      15, 15, 15, 15,
                      2, jsonb_build_object('brief', 'brief-db-modelli-documento-standard', 'origine', 'D-3'))
                  RETURNING id INTO v_versione;

                  -- Valida da sempre: la stampa sceglie la versione valida alla data
                  -- operativa, e un documento con una data passata deve trovarla.
                  PERFORM documenti.fn_pubblica_template_documento_versione(v_versione, DATE '2000-01-01', 2, NULL);
              END
              $seed$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Le versioni non si cancellano (trgfn_template_documenti_versioni_block_delete):
              -- per ritirare lo standard si spegne con un changeSet nuovo.
              SELECT 1;
