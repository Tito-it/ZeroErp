databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260215-13-upsert-dbops-automation-overrides-soggetti-storico-fk-mctit.yaml

  - changeSet:
      id: 20260215-13-upsert-dbops-automation-overrides-soggetti-storico-fk
      author: mctit
      comment: "Override STORICO_FK per anagrafiche.soggetti: soggetto_id."
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DELETE FROM dbops.automation_overrides_cols
              WHERE schema_name = 'anagrafiche'
                AND table_name = 'soggetti'
                AND col_role = 'STORICO_FK';

              INSERT INTO dbops.automation_overrides_cols (
                schema_name,
                table_name,
                col_role,
                col_name
              )
              VALUES (
                'anagrafiche',
                'soggetti',
                'STORICO_FK',
                'soggetto_id'
              );
