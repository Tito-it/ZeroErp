# Policy indici per le due FK del cantiere «classe dei codici errore»
#   Piano: docs/it/dev/work-done/piano-db-classe-codici-errore.md (D-7)
#   FK: 20260807-12 (codici_errore -> classi_errore), 20260807-14 (messaggi_errore -> codici_errore)
#
# ── PERCHE' ESISTE UNA RIGA PER UN INDICE CHE NON SI VUOLE ──────────────
#   Gli indici FK in questo progetto sono **opt-in**: `dbops.apply_fk_index_policy()`
#   crea solo i `consentito = true` e DROPpa i `false`. Quindi senza questo
#   changeSet i due indici non nascerebbero comunque.
#
#   Ma una FK **senza riga di policy** e' una decisione non presa: chi guarda la
#   tabella fra sei mesi non sa se e' stata valutata o dimenticata, e la
#   differenza conta — e' la stessa ragione per cui questo cantiere esiste. La
#   riga a `false` con la motivazione scritta e' la decisione; l'assenza e'
#   silenzio.
#
# ── PERCHE' ENTRAMBI A `false` ──────────────────────────────────────────
#   · `messaggi_errore.codice` e' gia' la **colonna di testa** dell'unico
#     `uq_messaggi_errore_codice_lingua`: un indice dedicato sarebbe una copia
#     del prefisso di quello, e PostgreSQL usa gia' l'indice composto per le
#     ricerche sulla sola prima colonna;
#   · `codici_errore.classe` ha **10 valori distinti su 689 righe**. Un indice a
#     cardinalita' cosi' bassa su una tabella cosi' piccola non viene scelto dal
#     planner: sarebbe peso di scrittura senza lettura.
#
#   ⚠️ Nessuna delle due e' una FK su cui si fa DELETE del padre — l'operazione
#   che di solito giustifica l'indice: i codici non si cancellano, si ritirano
#   con `obsoleto_dal`, e le classi nemmeno.
#
# ── NOTE ────────────────────────────────────────────────────────────────
#   · `dll_command` resta valorizzato anche a `false`: e' il comando che la
#     policy RIFIUTA, e serve a chi rilegge per capire di quale indice si parla.
#     E' la forma usata dalle 217 righe `false` gia' presenti.
#   · `MARK_RAN` invece di `HALT` sulla precondizione: se il registro della
#     policy non c'e', questo seed non ha senso e non deve bloccare il migrate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260807-15-upsert-fk-index-policy-codici-errore-mctit.yaml

  - changeSet:
      id: 20260807-15-upsert-fk-index-policy-codici-errore
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
          Registra a `consentito = false` le due FK del cantiere classe codici errore:
          l'indice su messaggi_errore.codice e' ridondante (prefisso di
          uq_messaggi_errore_codice_lingua), quello su codici_errore.classe e' inutile
          (10 valori distinti su 689 righe). La riga esiste perche' una FK senza policy
          e' una decisione non presa, non una decisione negativa.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: dbops
            tableName: fk_index_policy
        - tableExists:
            schemaName: config
            tableName: codici_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/fk_index_policy_codici_errore.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
