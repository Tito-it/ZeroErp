# Seed config.stati_doc_offerte_transizioni: 5 transizioni
# ammesse per il ciclo di vita dell'offerta commerciale.
#
# Transizioni (addendum A2 — BOZZA->RIFIUTATA rimossa):
#   id 1 | BOZZA(1)  -> EMESSA(2)     | manuale, emissione
#   id 2 | BOZZA(1)  -> ANNULLATA(6)  | manuale, ritiro interno (A2)
#   id 3 | EMESSA(2) -> ACCETTATA(3)  | manuale, accettazione cliente
#   id 4 | EMESSA(2) -> RIFIUTATA(4)  | manuale, no del cliente
#   id 5 | EMESSA(2) -> SUPERATA(5)   | automatico (trigger revisione step 6)
#
# Dipendenza: config.stati_doc_offerte_transizioni deve esistere
#   (migration 20260524-21). Phase 20_code (guard trigger) creata in
#   20260524-23, quindi il seed e' applicabile prima della code phase
#   purche' la tabella esista (verifica in preCondition).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260524-22-upsert-stati-doc-offerte-transizioni-mctit.yaml

  - changeSet:
      id: 20260524-22-upsert-stati-doc-offerte-transizioni
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_offerte_transizioni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_offerte_transizioni.csv
            tableName: stati_doc_offerte_transizioni
            schemaName: config
            separator: ","
            encoding: UTF-8
            # 2026-10-26 (20261026-14): "NULL", non "": la cella vuota sarebbe '' e
            # la FK di azione_processo_codename la rifiuterebbe (brief-modello-
            # documento-vendita §7.5). Nessun'altra cella del CSV e' vuota.
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: stato_da_id, type: STRING }
              - column: { name: stato_a_id, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              # 2026-10-26 (20261026-14, brief-modello-documento-vendita §13): l'azione
              # del passaggio (M-3, O-1). Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: azione_processo_codename, type: STRING }
