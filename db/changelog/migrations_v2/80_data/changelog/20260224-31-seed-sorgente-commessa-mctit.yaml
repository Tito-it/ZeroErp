databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260224-31-seed-sorgente-commessa-mctit.yaml

  - changeSet:
      id: 20260224-31-seed-sorgente-commessa
      author: mctit
      comment: "Seed sorgente COMMESSA per idempotenza pull commesse -> attivita_fatturabili."
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Inserire (o riallineare) la sorgente COMMESSA in
              --   config.sorgenti per supportare il pull idempotente.
              -- =========================================================
              -- Allinea la sequence PK in caso di ambienti con seed/manual insert.
              SELECT setval(
                pg_get_serial_sequence('config.sorgenti', 'id'),
                COALESCE((SELECT max(id) FROM config.sorgenti), 0),
                true
              );

              INSERT INTO config.sorgenti (
                codice_interno,
                codice,
                categoria,
                descrizione,
                attivo,
                meta,
                target_table,
                key_selector
              )
              VALUES (
                'COMMESSA',
                'COMMESSA',
                'DOCUMENTO',
                'Commessa (root pipeline attivita fatturabili)',
                true,
                jsonb_build_object(
                  'scope', 'COMMESSE',
                  'created_by', 'seed_20260224',
                  'idempotency_key', 'segment_key'
                ),
                'vendite.commesse_attivita'::regclass,
                'id'
              )
              ON CONFLICT (codice)
              DO UPDATE
                 SET codice_interno = EXCLUDED.codice_interno,
                     categoria = EXCLUDED.categoria,
                     descrizione = EXCLUDED.descrizione,
                     attivo = true,
                     target_table = EXCLUDED.target_table,
                     key_selector = EXCLUDED.key_selector,
                     meta = COALESCE(config.sorgenti.meta, '{}'::jsonb) || COALESCE(EXCLUDED.meta, '{}'::jsonb),
                     data_update = now(),
                     user_update = current_user;
