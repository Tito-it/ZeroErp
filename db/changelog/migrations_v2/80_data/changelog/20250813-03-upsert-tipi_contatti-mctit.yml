databaseChangeLog:
  - changeSet:
      id: 20250813-03-upsert-tipi_contatti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_contatti
      changes:
        # Upsert dei dati nella tabella tipi_contatti
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_contatti.csv
            tableName: tipi_contatti
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: descrizione,  type: STRING }
              - column: { name: codice_interno,    type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              - column: { name: codice,    type: STRING }

  - changeSet:
      id: 20250813-90-upsert-tipi_contatti
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250813-03-upsert-tipi_contatti
