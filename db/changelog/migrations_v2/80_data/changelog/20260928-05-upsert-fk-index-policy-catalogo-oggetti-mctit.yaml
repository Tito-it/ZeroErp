# REGISTRO INDICI FK — fk_user_override_oggetti_catalogo: NESSUN INDICE
#   Brief: brief-db-be-fe-catalogo-oggetti-permessi.md §3.1 punto 4 (D-4)
#
#   La FK composita nata in 20260928-02 si dichiara, anche per dire di no: una FK
#   senza riga di policy e' una FK che nessuno ha deciso. consentito = false: il
#   padre e' un catalogo di poche righe che cambia solo dal seed, e le letture
#   della figlia vanno per utente (uq_user_override_oggetti_user_app_model).
#   Il dll_command resta ben formato: con false la policy ne legge il NOME per il
#   DROP INDEX IF EXISTS.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260928-05-upsert-fk-index-policy-catalogo-oggetti-mctit.yaml

  - changeSet:
      id: 20260928-05-upsert-fk-index-policy-catalogo-oggetti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_user_override_oggetti_catalogo a consentito=false. Brief:
        brief-db-be-fe-catalogo-oggetti-permessi.md §3.1 (D-4).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: fk_index_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/fk_index_policy_catalogo_oggetti.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE constraint_name = 'fk_user_override_oggetti_catalogo';
