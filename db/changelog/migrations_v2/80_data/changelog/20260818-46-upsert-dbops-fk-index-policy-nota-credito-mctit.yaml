# Opt-in dbops.fk_index_policy per le DIECI FK del cantiere nota di credito
#   brief-design-note-credito-resi.md
#
# La policy e' **OPT-IN**: `fn_populate_fk_index_policy()` registra le FK nuove
# a `consentito=false`, quindi senza questo seed non nasce nessun indice. Ma la
# riga di policy va scritta **anche quando la risposta e' no**: una FK senza
# riga di policy e' una FK che nessuno ha deciso, e prima o poi qualcuno la
# «scopre scoperta» e ci pianta sopra un indice di troppo.
#
# ── ⛔ CINQUE NO, e sono ragionati ─────────────────────────────────────
#
#   `natura_doc_id` su `commesse_attivita`, `attivita_fatturabili`, `fatture` e
#   `tipi_doc_fiscale_registri`: una colonna con **tre valori distinti**, di cui
#   uno copre oggi il 100% delle righe, non e' selettiva. Un btree li' e' peso
#   in scrittura a ogni INSERT e nient'altro — e il controllo referenziale
#   scandisce i figli solo su DELETE di una natura, che e' un'operazione che non
#   avverra' mai (il vocabolario si deprecha, non si cancella).
#
#   `fk_resi_accrediti_resi_riga`: gia' **coperta per prefisso** dalla
#   `uq_resi_accrediti_pair (resi_riga_id, fattura_riga_rettificata_id)`. E' il
#   caso descritto in linee-guida-sql §8.7: pretendere l'uguaglianza esatta
#   delle colonne, invece del prefisso, e' cio' che nel luglio 2026 ha fatto
#   nascere 27 dei 48 indici ridondanti censiti. Qui si evita in partenza.
#
# ── ✅ CINQUE SI', tre dei quali PARZIALI ──────────────────────────────
#
#   I tre `fattura_riga_rettificata_id` / `riga_rettificata_id` sono FK
#   **nullabili e quasi sempre nulle** (le rettifiche saranno una minoranza
#   delle righe). Su una FK nullabile `WHERE <colonna> IS NOT NULL` e'
#   preferibile all'indice totale (§8.4): il controllo referenziale esegue
#   `WHERE fkcol = $1` con `$1` mai nullo, il planner lo dimostra e usa
#   l'indice parziale — che e' molto piu' piccolo, perche' non indicizza righe
#   che nessuno cerchera' mai. `dbops.vw_fk_senza_indice` riconosce questo caso
#   e considera la FK coperta.
#
#   ⚠️ **Ogni altro predicato no**: un parziale con, per dire,
#   `WHERE tipo_movimento = 'RETTIFICA'` NON coprirebbe la FK, perche' il
#   controllo referenziale deve poter trovare qualsiasi riga figlia.
#
#   Le due FK di `resi_righe_accrediti` verso `fatture_righe` e
#   `commesse_attivita` sono invece NOT NULL: indice pieno, senza predicato.
#   Servono per davvero — il tetto del documento fa
#   `SUM(qta) WHERE fattura_riga_rettificata_id = ?` a ogni riga scritta sul
#   ponte, e senza indice sarebbe seq scan dentro un guard.
#
# ── ⚠️ `dll_command` VA SEMPRE VALORIZZATO, anche sui NO ───────────────
#
#   `chk_fk_index_policy_dll_command_forma` impone la forma
#   `CREATE INDEX IF NOT EXISTS <nome> ON …` **su ogni riga**, `consentito`
#   compreso a `false`: una cella vuota fa fallire il migrate.
#
#   ⭐ Non e' una pedanteria del vincolo: con `consentito=false` la procedura
#   NON ignora il comando — ne estrae il **nome** ed esegue `DROP INDEX` su
#   quello. Un comando vuoto le toglierebbe il solo dato che le serve per
#   rimuovere un indice creato per errore. Sulle nostre cinque righe a `false`
#   il nome
#   punta a un indice che non esiste, quindi il DROP e' un no-op; il giorno in
#   cui qualcuno lo creasse a mano, la policy saprebbe toglierlo.
#
#   ⚠️ Ed e' il motivo per cui i nomi seguono la convenzione `ix_<table>_<col>`
#   anche dove l'indice non nascera' mai: se un giorno il flag passasse a
#   `true`, l'indice creato avrebbe il nome giusto.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()` in
#    `90_end`: mai un `CREATE INDEX` o un `DROP INDEX` scritto a mano su un
#    indice governato dalla policy — un DROP senza flag verrebbe annullato al
#    primo migrate successivo, perche' la procedura gira `runAlways`.
#
# Pattern simmetrico a 20260726-02 (resi_righe_rinunce).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260818-46-upsert-dbops-fk-index-policy-nota-credito-mctit.yaml

  - changeSet:
      id: 20260818-46-upsert-dbops-fk-index-policy-nota-credito
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Opt-in della policy indici FK per le dieci FK del cantiere nota di
        credito. Cinque NO ragionati (natura_doc_id non e' selettiva: tre
        valori, uno al 100%; e la FK del ponte verso resi_righe e' gia' coperta
        per prefisso dalla sua UNIQUE), cinque SI' di cui tre PARZIALI su FK
        nullabili quasi sempre nulle. Creazione delegata ad
        apply_fk_index_policy() in 90_end, mai a mano.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: vendite
                tableName: resi_righe_accrediti
            - columnExists:
                schemaName: vendite
                tableName: fatture_righe
                columnName: riga_rettificata_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_nota_credito.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
