# UN REGISTRO DISTINTA PER OGNI EMITTENTE CHE ESISTE — L12
#   vendite.registri_fatturazione <- vendite.fn_provision_registri_famiglia('DISTINTA')
#   Brief: brief-db-distinta-numerata-sul-registro, §4 P-4, §4-bis.12
#
# ── PERCHE' PRIMA DEI GENERATORI, E PERCHE' NON E' UN CSV ────────────────
#   Dal 2026-09-15 il numeratore della distinta chiede il registro DISTINTA
#   dell'emittente e SOLLEVA se manca (fn_get_registro_documento, fail-closed):
#   senza questo passo la prima distinta di ogni emittente esistente non
#   nascerebbe. ⚠️ NON e' un CSV, per la stessa ragione di 20260831-03: queste
#   righe dipendono da QUALI emittenti esistono su questa macchina, e un CSV
#   fotograferebbe questo database creando altrove registri per emittenti
#   inesistenti — o lasciandone senza. Il catalogo della famiglia, uguale
#   ovunque, il CSV ce l'ha (`famiglie_documento.csv`, mirror 20260830-14 — dal
#   18-09; era il laterale 20260915-33, ritirato: una tabella, un CSV).
#
# ── UNA CHIAMATA ALLA PRIMITIVA, NON UN INSERT RICOPIATO ────────────────
#   Forma di 20260831-03 (runOnChange + ANY, idempotente sulla COPPIA
#   emittente/famiglia), ma la regola di come nasce un registro — codice
#   `left(famiglia,3) || '-' || sr` (DIS-<sr>), descrizione, ANNUALE,
#   prefisso e lunghezza dal catalogo (DIS-/7), utility NULL = «per tutte» —
#   sta in vendite.fn_provision_registri e NON si copia.
#   Il trigger a10_set_anno_nel_numero_ins mette anno_nel_numero = true
#   all'INSERT (politica ANNUALE + anno_nel_numero_default della famiglia):
#   niente da scrivere. Gli emittenti FUTURI li prendono dal trigger z90
#   trgfn_emittenti_fiscali_provision_registri, che chiama la stessa primitiva.
#
#   Collisioni: uq_registri_fatturazione_codice (DIS-72 <> DDT-72),
#   uq_registri_fatturazione_prefisso_suffisso per emittente (DIS- <> CMM-/
#   DDT/ORD/RESO), uq_registri_fatturazione_famiglia_emittente_utility
#   (tripla nuova). Nessuna.
#
#   Su un database da zero: nessun emittente, crea 0 e passa. Gli emittenti
#   che le fixture pgTAP costruiscono prendono il registro dal trigger z90.
#
# Verifica: db/pgtap/pagamenti/test-distinta-numerazione-registro-v1.sql (test 2),
#   db/pgtap/vendite/test-numero-prefisso-registro-v1.sql (test 6)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260915-34-seed-registri-distinta-per-emittente-mctit.yaml

  - changeSet:
      id: 20260915-34-seed-registri-distinta-per-emittente
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      validCheckSums:
        - ANY
      # ⭐ rev 2026-10-20 (brief-db-grammatica-unica-documenti 2c, G-5): la famiglia della
      #    distinta si chiama DISTINTA_INCASSO, il codice della sua sorgente (20261020-32).
      #    runOnChange + ANY: rigira, la primitiva e' idempotente.
      failOnError: true
      comment: >
        Un registro di numerazione DISTINTA (DIS-<sr>, prefisso DIS-, 7 cifre, ANNUALE, anno
        nel numero) per ogni emittente fiscale che ancora non ce l'ha, chiamando la primitiva
        vendite.fn_provision_registri_famiglia('DISTINTA') — idempotente sulla coppia. Non un
        CSV: dipende da quali emittenti esistono su questa macchina. Dopo il seed della
        famiglia (-33). Brief: brief-db-distinta-numerata-sul-registro, L12.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: famiglia_documento
            # ⭐ Lecito in 80_data: la famiglia dev'esserci, e la semina -33
            #    che precede per nome file.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM vendite.famiglie_documento fd
                   WHERE fd.codice_interno = 'DISTINTA_INCASSO'
                     AND fd.attivo IS TRUE;
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_provision_registri_famiglia';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ⭐ La primitiva, non un INSERT ricopiato: la regola di come nasce
              --    un registro vive in vendite.fn_provision_registri.
              SELECT vendite.fn_provision_registri_famiglia('DISTINTA_INCASSO');
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- ⛔ Un registro che ha gia' numerato non si toglie: il numero resta
              --    scritto sul documento e il sezionale ne e' l'identita'.
              DELETE FROM vendite.registri_fatturazione r
               WHERE r.famiglia_documento = 'DISTINTA_INCASSO'
                 AND r.meta->>'origine' = 'C2-12'
                 AND NOT EXISTS (SELECT 1 FROM pagamenti.vendite_contabili c
                                  WHERE c.registro_id = r.id);
