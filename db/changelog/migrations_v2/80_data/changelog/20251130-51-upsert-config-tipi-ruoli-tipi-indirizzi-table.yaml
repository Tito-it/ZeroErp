databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20251130-11-upsert-config-tipi-ruoli-tipi-indirizzi-table.yaml

  - changeSet:
      id: 20251130-11-upsert-config-tipi-ruoli-tipi-indirizzi-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_ruolo_tipi_indirizzo
      changes:
        # Upsert dei dati nella tabella tipi_ruolo_tipi_indirizzo
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_ruolo_tipi_indirizzo.csv
            tableName: tipi_ruolo_tipi_indirizzo
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: tipo_ruolo_id, type: STRING }
              - column: { name: tipo_indirizzo_id, type: STRING }
              - column: { name: obbligatorio, type: BOOLEAN }
              - column: { name: valido_dal, type: DATE }
              - column: { name: valido_al, type: DATE }
              - column: { name: attivo, type: BOOLEAN }

              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"

              - column: { name: user_insert, type: STRING }
              - column: { name: user_update, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: storicizza, type: BOOLEAN }
              - column: { name: fallback_tipo_indirizzo_id, type: INTEGER }
