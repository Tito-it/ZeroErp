databaseChangeLog:
  - changeSet:
      id: 20250813-04-upsert-stati_clienti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_cliente
      changes:
        # Upsert dei dati nella tabella stati_cliente
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_cliente.csv
            tableName: stati_cliente
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: descrizione_breve, type: STRING }
              - column: { name: check_lettura, type: STRING }
              - column: { name: abilita_fattura, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: stato_cliente_ia, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }

  - changeSet:
      id: 20250813-90-upsert-stati_clienti
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250813-04-upsert-stati_clienti
