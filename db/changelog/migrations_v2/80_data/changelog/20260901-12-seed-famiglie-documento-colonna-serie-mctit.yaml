# QUALI FAMIGLIE SANNO REGISTRARE UNA SERIE — il seed
#   vendite.famiglie_documento.colonna_serie
#   Piano: brief-db-registri-numerazione-chiave-del-contatore, sezione 5 (S-1b)
#
#   FATTURA -> serie     (vendite.fatture.serie,  nel uq_fatture_numero)
#   DDT     -> serie     (vendite.ddt.serie,      nel uq_ddt_v_anno_serie_numero)
#   ORDINE  -> serie     (vendite.ordini.serie,   nel uq_ordini_v_anno_serie_numero)
#   RESO    -> NULL      ⛔ vendite.resi NON ha la colonna, e uq_resi_anno_numero
#                           non porta la serie
#   COMMESSA-> NULL      ⛔ l'unicita' e' su una stringa sola, uq_commesse_codice
#
# ── ⛔ PERCHE' UN CSV DEDICATO E NON famiglie_documento.csv ───────
#   Il mirror di quel file (20260830-14) e' gia' mergiato, e AGENTS.md vieta di
#   modificare un changelog mergiato: aggiungere la colonna alla sua lista
#   vorrebbe dire metterci mano. ⭐ Un CSV per colonna/sottoinsieme e' gia' il
#   pattern di casa — `parameters` sta su cinque file, `tipi_doc_fiscale_registri`
#   su due, `registri_fatturazione_politica_data` e' nato esattamente cosi'.
#   La sede resta un CSV, quindi AGENTS.md §80_data e' rispettato.
#
# ── ⛔ PERCHE' NON UN UPDATE IN 00_schema, dove nasce la colonna ──
#   Perche' su un database RICOSTRUITO DA ZERO non funzionerebbe, e su dev si':
#   00_schema gira PRIMA di 80_data, quindi quando l'ALTER passa la tabella e'
#   ancora VUOTA e l'UPDATE non tocca nessuna riga. Le famiglie arrivano dopo,
#   dal mirror, e la colonna resterebbe NULL in CI mentre su dev e' popolata.
#   ⚠️ E' la stessa divergenza CI-vs-dev che i changeSet 20260806-13/-14 hanno
#   dovuto riparare su un'altra tabella. Il seed sta dove stanno i dati.
#
# ── ⛔ SI SEMINA PER `codice_interno`, NON PER id ────────────────
#   §6b: riferimento per chiave naturale stabile. `codice_interno` e' UNIQUE e
#   immutabile; l'id e' un surrogato che su un database ricostruito puo' essere
#   un altro.
#
# ⚠️ ORDINE: `includeAll` ordina per nome file, quindi questo changeSet gira DOPO
#   il mirror delle famiglie (20260830-14) — che e' la ragione per cui esiste.
#   ⚠️ Gira invece DOPO anche il mirror dei registri (20260127-57): per quella
#   finestra il guard della serie ha un ramo dichiarato che tace, vedi
#   20260901-11.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260901-12-seed-famiglie-documento-colonna-serie-mctit.yaml

  - changeSet:
      id: 20260901-12-seed-famiglie-documento-colonna-serie
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Dichiara quali famiglie sanno registrare una SERIE sul documento: FATTURA/DDT/ORDINE ->
        `serie`, RESO/COMMESSA -> NULL. ⭐ CSV dedicato e non `famiglie_documento.csv`, il cui
        mirror e'' gia'' mergiato e non si tocca — un CSV per sottoinsieme e'' gia'' il pattern di
        casa. ⛔ E non un UPDATE in 00_schema: li'' la tabella e'' ancora vuota su un database
        ricostruito da zero, e il valore andrebbe perso in CI mentre su dev funziona. ⛔ Si semina
        per `codice_interno` (chiave naturale, §6b) e non per id.
        Piano: brief-db-registri-numerazione-chiave-del-contatore, sezione 5 (S-1b).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: famiglie_documento
                columnName: colonna_serie
            # ⛔ Le cinque famiglie devono esistere: se il mirror 20260830-14 non
            #    fosse ancora passato, loadUpdateData le INSERIREBBE con i soli
            #    due campi del CSV, cioe' righe monche che violano i NOT NULL.
            - sqlCheck:
                expectedResult: 5
                sql: |
                  SELECT COUNT(*)
                    FROM vendite.famiglie_documento
                   WHERE codice_interno IN ('FATTURA', 'DDT', 'ORDINE', 'RESO', 'COMMESSA');
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/famiglie_documento_colonna_serie.csv
            tableName: famiglie_documento
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            # ⚠️ Il token letterale NULL diventa SQL NULL: e' cosi' che RESO e
            #    COMMESSA dichiarano di NON avere una serie. Senza, ci
            #    finirebbe la stringa 'NULL' e la famiglia risulterebbe dotata
            #    di una colonna che si chiama cosi'.
            nullValue: "NULL"
            primaryKey: "codice_interno"
            columns:
              - column: { name: codice_interno, type: STRING }
              - column: { name: colonna_serie,  type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              UPDATE vendite.famiglie_documento
                 SET colonna_serie = NULL
               WHERE codice_interno IN ('FATTURA', 'DDT', 'ORDINE', 'RESO', 'COMMESSA');
