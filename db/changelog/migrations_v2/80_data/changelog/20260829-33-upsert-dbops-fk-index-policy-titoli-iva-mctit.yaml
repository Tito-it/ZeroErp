# I7 (Fase 2) del brief brief-db-be-iva-risolutore-e-regime-cliente —
# GLI INDICI DELLE FK DELLE TRE TABELLE NUOVE. Undici righe: UN si' e dieci no.
#
# ── ℹ️ LA POLICY E' OPT-IN, quindi il silenzio non e' una scelta ────────
#
#   `fn_populate_fk_index_policy()` registra le FK nuove con `consentito=false`
#   da sola: senza questo file gli indici non nascerebbero comunque. Il seed
#   serve a due cose diverse — accendere l'unico che serve, e mettere per
#   iscritto PERCHE' gli altri dieci non servono. Una riga a `false` scritta
#   apposta e una riga a `false` messa da uno script si distinguono solo qui.
#
# ── ⭐ L'UNICO SI': `fk_soggetti_titoli_iva_movimenti_fattura` ──────────
#
#   E' l'unica FK con una interrogazione che ci entra davvero: «quali movimenti
#   di plafond ha prodotto questa fattura». Serve alla nota di credito (P4), che
#   deve sapere quanto aveva consumato la fattura che sta rettificando, e serve
#   a qualunque riconciliazione fra registro e fatturato.
#   ⚠️ E non e' coperta da niente: in `uq_stiva_movimenti_documento` la colonna
#   `fattura_id` e' la TERZA, e un btree serve solo i PREFISSI.
#   ⭐ Parziale `WHERE fattura_id IS NOT NULL`, che e' l'unico predicato che
#   copre comunque il controllo referenziale (§8.4): le forzature hanno
#   `fattura_id` a NULL per costruzione, e nessuno le cerca da li'.
#
# ── I DIECI NO, e ciascuno con la sua ragione ──────────────────────────
#
#   | FK | perche' no |
#   | --- | --- |
#   | `..._soggetto` | gia' COPERTA per prefisso da `ix_soggetti_titoli_iva_soggetto_emittente`, che e' l'ingresso vero del risolutore |
#   | `..._emittente` | nessuna interrogazione parte dall'emittente: lo legge la policy RLS, ma come chiamata di funzione, che un indice non serve |
#   | `..._tipo`, `..._iva` | catalogo, poche righe: il controllo referenziale scatta solo quando qualcuno disattiva un codice, e costa meno del mantenimento |
#   | `..._ambiti_titolo` | COPERTA per prefisso da `uq_soggetti_titoli_iva_ambiti_oggetto` |
#   | `..._ambiti_articolo/gruppo/tipo_voce` | ⚠️ **decisione rimandata a I2, non un no definitivo**: il risolutore entra dal TITOLO e poi guarda le sue righe di ambito, quindi oggi l'ingresso e' `titolo_iva_id`. Se la query vera di I2 entrera' dall'articolo, si accende una riga di CSV — accenderla adesso sarebbe indicizzare su una previsione |
#   | `..._movimenti_titolo` | COPERTA per prefisso da `ix_stiva_movimenti_titolo` |
#   | `..._movimenti_fattura_riga` | nessuno entra dalla riga di fattura: si arriva sempre dal documento |
#
# ── ⚠️ `dll_command` VALORIZZATO ANCHE SULLE RIGHE A `false` ───────────
#
#   Lo impone `chk_fk_index_policy_dll_command_forma`, e serve: con il flag a
#   falso la procedura ne estrae il NOME ed esegue il `DROP` su quello.
#   ⛔ Per questo i comandi delle righe a `false` nominano l'indice DEDICATO
#   canonico (`ix_<tabella>_<colonna>`), mai un indice che esiste davvero: se
#   `fk_soggetti_titoli_iva_soggetto` nominasse
#   `ix_soggetti_titoli_iva_soggetto_emittente`, il primo `90_end` cancellerebbe
#   l'indice su cui il risolutore entra — e nessuno collegherebbe le due cose.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()` in
#    `90_end`: qui si tocca solo il flag.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260829-33-upsert-dbops-fk-index-policy-titoli-iva-mctit.yaml

  - changeSet:
      id: 20260829-33-upsert-dbops-fk-index-policy-titoli-iva
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per le tre tabelle dei titoli IVA: un si' e dieci no. Si' solo
        su fk_soggetti_titoli_iva_movimenti_fattura, l'unica con un ingresso vero (quali
        movimenti ha prodotto questa fattura - serve alla nota di credito e alla
        riconciliazione) e l'unica non coperta da nessun indice, perche' in
        uq_stiva_movimenti_documento fattura_id e' la terza colonna. Tre no sono
        RIMANDATI a I2: se la query del risolutore entrera' dall'articolo si accende una
        riga di CSV, ma accenderla adesso sarebbe indicizzare su una previsione.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_movimenti
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/anagrafiche/fk_index_policy_titoli_iva.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
