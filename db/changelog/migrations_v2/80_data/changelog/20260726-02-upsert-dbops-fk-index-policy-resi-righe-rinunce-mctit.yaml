# Opt-in dbops.fk_index_policy per la FK di vendite.resi_righe_rinunce
#   (brief-db-chiusura-riconsegna-reso-definitivo §4.1, Fase 1 voce 2-bis)
#
# fn_populate_fk_index_policy registra le FK nuove a consentito=false (default):
# questo seed decide esplicitamente. Senza, l'automation in 90_end NON crea
# l'indice (policy OPT-IN).
#
#   - fk_resi_rinunce_resi_riga (resi_riga_id) -> consentito=TRUE.
#     A differenza della gemella resi_righe_riconsegne — dove la
#     uq_resi_riconsegne_pair (resi_riga_id, ddt_riga_id) copriva gia' le query
#     per resi_riga_id come PREFISSO — qui la UNIQUE non esiste (rinunce
#     ripetute lecite, brief §4.1-bis), quindi l'indice serve per davvero:
#     vendite.fn_resi_riga_residuo_riconsegna fa SUM(qta) WHERE resi_riga_id = ?
#     e viene chiamata per OGNI riga di vw_resi_da_riconsegnare e
#     vw_resi_da_accreditare. Senza indice: seq scan per riga.
#     In piu' ON DELETE CASCADE scandisce i figli quando si cancella una riga
#     reso -> l'indice serve anche al controllo referenziale.
#
# Creazione/rimozione indici delegata a dbops.apply_fk_index_policy() in 90_end
# (mai a mano). Pattern simmetrico a 20260720-03.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260726-02-upsert-dbops-fk-index-policy-resi-righe-rinunce-mctit.yaml

  - changeSet:
      id: 20260726-02-upsert-dbops-fk-index-policy-resi-righe-rinunce
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: vendite
            tableName: resi_righe_rinunce
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_resi_righe_rinunce.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
