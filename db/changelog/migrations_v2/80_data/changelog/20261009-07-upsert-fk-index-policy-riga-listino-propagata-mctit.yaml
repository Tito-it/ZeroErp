# GLI INDICI DELLE DUE FK SU listino_riga_id: DA false A true, PARZIALI
#   dbops.fk_index_policy:
#     * vendite.commesse_attivita.commesse_attivita_listino_riga_id_fkey       -> true
#     * vendite.attivita_fatturabili.attivita_fatturabili_listino_riga_id_fkey -> true
#   tutti e due parziali `WHERE listino_riga_id IS NOT NULL` (linee-guida-sql §8.4).
#   Brief: brief-db-riga-listino-propagata-dalla-commessa (R-1, R-2)
#
# ── PERCHE' ORA ──────────────────────────────────────────────────
#   Finche' nessun percorso scriveva la colonna, le due FK erano registrate a
#   false dall'automazione e non servivano. Con R-1/R-2 la colonna si popola, e
#   vendite.trgfn_listini_righe_guard_stato la interroga a OGNI UPDATE e DELETE
#   di una riga di listino su versione ATTIVA (`WHERE listino_riga_id = OLD.id`
#   su entrambe le tabelle), come fa il controllo referenziale al DELETE di una
#   riga di listino. Senza indice sono due scansioni intere delle due tabelle
#   piu' grandi della fatturazione per ogni rettifica di listino.
#
# ── PARZIALE ─────────────────────────────────────────────────────
#   La colonna e' NULL su ogni riga che non viene da una riga di listino
#   (prezzo manuale, oneri, rettifiche, stadio BUNDLE): il guard e la FK cercano
#   sempre un valore, e `listino_riga_id = $1` implica `IS NOT NULL`. I nomi
#   restano quelli che l'automazione aveva registrato.
#
# ⚠️ CSV DEDICATO con loader suo, non un append a fk_index_policy.csv: quel
#   mirror e' di gennaio e non si sveglia (precedente: 20261008-73).
# ⛔ Creazione e rimozione restano di dbops.apply_fk_index_policy() in 90_end:
#   qui si tocca solo il flag (linee-guida-sql §8.7, «mai a mano»).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261009-07-upsert-fk-index-policy-riga-listino-propagata-mctit.yaml

  - changeSet:
      id: 20261009-07-upsert-fk-index-policy-riga-listino-propagata
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK di brief-db-riga-listino-propagata-dalla-commessa:
        indici parziali (IS NOT NULL) sulle FK listino_riga_id di
        commesse_attivita e attivita_fatturabili, che il guard
        trgfn_listini_righe_guard_stato interroga a ogni rettifica di una riga di
        listino ATTIVA.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: vendite
                tableName: commesse_attivita
                columnName: listino_riga_id
            - columnExists:
                schemaName: vendite
                tableName: attivita_fatturabili
                columnName: listino_riga_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/fk_index_policy_riga_listino_propagata.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              UPDATE dbops.fk_index_policy
                 SET consentito  = false,
                     dll_command = 'CREATE INDEX IF NOT EXISTS ix_' || table_name
                                   || '_listino_riga_id ON vendite.' || table_name
                                   || '(listino_riga_id);'
               WHERE schema_name = 'vendite'
                 AND table_name IN ('commesse_attivita', 'attivita_fatturabili')
                 AND constraint_name IN ('commesse_attivita_listino_riga_id_fkey',
                                         'attivita_fatturabili_listino_riga_id_fkey');
