#
# ⭐ REV 2026-11-13 — via `user_insert` e `user_update` (brief-db-token-null-dei-seed
#   D2, la forma di magazzino.causali). `user_insert` era vuota in tutte le 21
#   righe e arrivava come stringa vuota: un'audit che non dice chi ha scritto. Le
#   due colonne escono dal CSV e da `columns:`, e vale il default della tabella
#   (linee-guida-sql §7). Il default e il NOT NULL di `user_insert`, e la
#   conversione delle righe gia' scritte, stanno in 90_end/20261112-54.
# ------------------------------------------------------------
databaseChangeLog:
  - changeSet:
      id: 20250816-01-upsert-iva_natura
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: iva_natura
            schemaName: config
      changes:
     

      # 2) Carico CSV:         
      - loadUpdateData:
          relativeToChangelogFile: true
          file: ../sql/config/iva_natura.csv
          tableName: iva_natura
          schemaName: config
          separator: ","
          encoding: UTF-8
          primaryKey:
            - id
          columns:
            - column: { name: id,            type: STRING }
            - column: { name: codice,   type: STRING }
            - column: { name: descrizione,   type: STRING }
            - column: { name: data_insert,   type: STRING }
            - column:
                    name: data_update
                    type: STRING
                    defaultValue: "NOW()"
           
  - changeSet:
      id: 20250816-90-upsert-iva_natura
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250816-01-upsert-iva_natura