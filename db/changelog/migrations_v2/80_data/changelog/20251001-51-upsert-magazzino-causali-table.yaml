# Mirror vivo di causali.csv (runOnChange + validCheckSums ANY): si modifica
#   IN PLACE, come il 20260614-08.
# 2026-09-15 — brief-db-magazzino-lotto-1-terreno-vuoto, P-3: tolte dalla
#   lista `columns:` le otto colonne che il 20260915-02 elimina dalla tabella
#   (impatto_valorizzazione, richiede_lotto, richiede_seriale,
#   richiede_magazzino_dest, abilita_billing, richiede_odl, contabilizza_cdc,
#   ambito_causale_id); il CSV perde le stesse otto e prende le sei causali
#   nuove (id 23-28: CARICO_RESO_VEN, SCARICO_RESO_ACQ, ODL_VERSAMENTO_PF,
#   INV_INIZIALE, STORNO_POS, STORNO_NEG). Nessun loader nuovo.
#   ⚠️ nullValue "": una cella vuota e' NULL (tx_id, user_*, data_update, che
#   ha defaultValue NOW()).
#
# ⭐ REV 2026-11-12 — via `user_insert` e `user_update` (brief-db-nullvalue-vuoto-cinque-mirror).
#   Con `nullValue: ""` le due colonne di audit, vuote nel CSV, arrivavano come
#   stringa vuota: un'audit che non dice chi ha scritto. Il valore giusto e' il
#   default della tabella (linee-guida-sql §7, §11.2): le due colonne escono dal
#   CSV e dall'elenco `columns:`. Il default e il NOT NULL di `user_insert`, e la
#   conversione delle righe gia' scritte, stanno in 90_end/20261112-39.
#   ⚠️ La riga del 2026-09-15 qui sopra («una cella vuota e' NULL») era falsa per
#   le colonne STRING: valeva solo per tx_id (uuid) e data_update (defaultValue).
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20251001-06-upsert-magazzino-causali
      logicalFilePath: migrations_v2/80_data/20251001-06-upsert-magazzino-causali-table.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: magazzino
            tableName: causali
      changes:
        # Upsert dei dati nella tabella causali
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/magazzino/causali.csv
            tableName: causali
            schemaName: magazzino
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: segno, type: STRING }
              - column: { name: ordine, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: tx_id, type: uuid }
              - column: { name: data_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: storicizza, type: BOOLEAN }
              - column: { name: is_installazione_asset, type: BOOLEAN }
              - column: { name: is_rettifica, type: BOOLEAN }
              - column: { name: consente_stock_negativo, type: BOOLEAN }
