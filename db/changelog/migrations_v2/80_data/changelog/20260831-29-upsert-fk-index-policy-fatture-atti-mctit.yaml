# Registro indici FK per `vendite.fatture_atti` e per la FK nuova sulla riga
#   brief-db-fatture-atti-riferimenti-contratto §3.3 punto 4 (voce 4 dell'ordine
#   di lavoro brief-db-richieste-aperte-dal-backend)
#
# ── ⚠️ LA POLICY E' OPT-IN: SENZA QUESTO SEED NON NASCE NESSUN INDICE ─
#
#   `fn_populate_fk_index_policy()` registra le FK nuove con `consentito=false`.
#   Perche' un indice nasca serve un seed ESPLICITO che porti il flag a true —
#   e va in 80_data come CSV, mai come SQL inline.
#
# ── LE TRE RIGHE, UNA PER UNA ────────────────────────────────────────
#
#   1) `fk_fatture_atti_fattura` -> **NO**, ed e' una copertura, non una rinuncia.
#      La FK e' su `(fattura_id)`, e `uq_fatture_atti_fattura_contratto` e' un
#      btree su `(fattura_id, contratto_id)`: le colonne della FK coincidono
#      **come insieme** con le prime N colonne chiave, cioe' per PREFISSO. Il
#      controllo referenziale cerca `WHERE fattura_id = $1` e quel btree lo
#      serve. Un indice dedicato sarebbe un gemello — esattamente la specie che
#      ha prodotto 27 dei 48 indici ridondanti censiti il 2026-07-27.
#      ⭐ E anche a flag `true` non nascerebbe: la prima guardia di
#      `apply_fk_index_policy()` crea solo se la FK figura ancora in
#      `vw_fk_senza_indice`, e questa non ci figura.
#
#   2) `fk_fatture_atti_contratto` -> **SI'**. Non e' coperta da niente, e ha due
#      lettori veri: il LINEAGE («quali fatture citano quest'atto?») e il
#      controllo referenziale alla cancellazione di un contratto — che senza
#      indice diventa una scansione completa di questa tabella. I contratti in
#      bozza si cancellano davvero.
#
#   3) `fk_fatture_righe_fattura_atto` -> **SI'**, e l'indice e' su DUE colonne
#      perche' la FK e' COMPOSITA: `(fattura_atto_id, fattura_id)`. L'indice
#      elenca le stesse due colonne nello stesso ordine, quindi le copre per
#      prefisso.
#      ⭐ E' PARZIALE — `WHERE fattura_atto_id IS NOT NULL` — ed e' lecito: la
#      guida ammette il predicato quando e' una congiunzione di soli
#      `<colonna della FK> IS NOT NULL` (§8.4). Qui paga molto: la maggior parte
#      delle righe di fattura non nasce da un contratto, quindi l'indice pieno
#      sarebbe quasi tutto NULL. Stesso disegno di
#      `ix_fatture_righe_riga_rettificata_id`, che e' la FK gemella per forma.
#
# ── ⚠️ `dll_command` VALORIZZATO ANCHE CON `consentito = false` ──────
#
#   Lo impone `chk_fk_index_policy_dll_command_forma`, e serve: col flag a falso
#   la procedura ne estrae il nome per il `DROP`.
#   ⛔ Per questo la riga 1 nomina l'indice dedicato CANONICO — che non esiste —
#   e **non** la UNIQUE che copre la FK. Nominare la UNIQUE farebbe tentare al
#   primo `90_end` la cancellazione dell'unicita' su cui si regge «un blocco per
#   atto, per fattura». (La seconda guardia della procedura rifiuterebbe il DROP
#   con un warning, ma un presidio non e' una scusa per scrivere il comando
#   sbagliato.)
#
# ── ⛔ `onFail: HALT` e NON `MARK_RAN` ───────────────────────────────
#
#   `MARK_RAN` segnerebbe il changeSet come eseguito SENZA eseguirlo: su un
#   database dove la precondizione non regge, il seed non avverrebbe mai e
#   nessuno lo saprebbe — cioe' nessun indice, nessun errore. Su una policy
#   opt-in e' il modo peggiore di fallire. Le due tabelle esistono per forza a
#   questo punto della timeline (00_schema gira prima di 80_data): se non ci
#   sono, c'e' un problema vero e il migrate deve fermarsi.
#
# Dipendenze: 20260831-25 (vendite.fatture_atti), 20260831-26 (la colonna e la
#             FK composita su vendite.fatture_righe).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260831-29-upsert-fk-index-policy-fatture-atti-mctit.yaml

  - changeSet:
      id: 20260831-29-upsert-fk-index-policy-fatture-atti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per il satellite degli atti: due SI' e un NO.
        fk_fatture_atti_fattura NO perche' e' gia' coperta PER PREFISSO da
        uq_fatture_atti_fattura_contratto — un indice dedicato sarebbe un gemello,
        e a flag true non nascerebbe comunque (prima guardia di
        apply_fk_index_policy). fk_fatture_atti_contratto SI': non e' coperta da
        niente e serve al lineage e al controllo referenziale sulla cancellazione
        di un contratto. fk_fatture_righe_fattura_atto SI', con indice su DUE
        colonne perche' la FK e' composita, e PARZIALE su fattura_atto_id IS NOT
        NULL — la maggior parte delle righe non nasce da un contratto. ⚠️
        dll_command valorizzato anche sul NO, come impone
        chk_fk_index_policy_dll_command_forma, e nomina l'indice dedicato
        canonico: nominare la UNIQUE farebbe tentare il DROP dell'unicita' su cui
        si regge «un blocco per atto, per fattura».
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - tableExists:
                schemaName: vendite
                tableName: fatture_atti
            - columnExists:
                schemaName: vendite
                tableName: fatture_righe
                columnName: fattura_atto_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_fatture_atti.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
