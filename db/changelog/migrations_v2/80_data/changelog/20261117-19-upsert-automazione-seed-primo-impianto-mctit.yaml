# Mirror di dbops.automazione_seed_primo_impianto: le tabelle iscritte al seed
#   di primo impianto. Il CSV comanda (catalogo, linee-guida-sql §11.7): una
#   riga si spegne (enabled = false), non si toglie (§11.2).
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.4, Q11, Q19; §16.15,
#   QU1-QU2: le tabelle di ui e la forma figlia, colonne tabella_padre e
#   colonna_padre da 20261119-01)
#
# ⚠️ REGOLA D'INGRESSO. Il trigger nasce dopo 80_data (la rete di 90_end e la
#   convergenza del rilascio): una tabella si iscrive qui in un rilascio
#   PRECEDENTE al primo ritocco del suo CSV. Il giro che iscrive
#   config.email_account e config.email_template non tocca email_account.csv
#   ne' email_template.csv.
#
# ⚠️ Le colonne text[] (colonne_software, colonne_installazione,
#   colonne_derivate) arrivano come STRING nella forma di letterale di array
#   ("{a,b}"): il letterale senza tipo si converte in text[] all'assegnazione.
#   NULL nel CSV = forma per riga; colonne_derivate NULL = nessuna colonna che il
#   database deriva (00_schema/dbops/20261122-36, brief-db-revisione-ui, Q54).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261117-19-upsert-automazione-seed-primo-impianto-mctit.yaml

  - changeSet:
      id: 20261117-19-upsert-automazione-seed-primo-impianto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automazione_seed_primo_impianto
      comment: >
        Mirror di dbops.automazione_seed_primo_impianto dal CSV: config.email_account in solo inserimento,
        config.email_template per colonna; ui.lista_definizione, ui.lista_colonna e ui.lista_preset per colonna,
        ui.lista_preset_colonna figlia di ui.lista_preset. Brief: brief-db-seed-primo-impianto-non-si-riscrive.
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/automazione_seed_primo_impianto.csv
            tableName: automazione_seed_primo_impianto
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: schema_name, type: STRING }
              - column: { name: table_name, type: STRING }
              - column: { name: solo_inserimento, type: BOOLEAN }
              - column: { name: colonne_software, type: STRING }
              - column: { name: colonne_installazione, type: STRING }
              - column: { name: enabled, type: BOOLEAN }
              - column: { name: trigger_name, type: STRING }
              - column: { name: motivo, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: tabella_padre, type: STRING }
              - column: { name: colonna_padre, type: STRING }
              - column: { name: colonne_derivate, type: STRING }
