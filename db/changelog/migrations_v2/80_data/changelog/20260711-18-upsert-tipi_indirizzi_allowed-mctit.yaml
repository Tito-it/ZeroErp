# ------------------------------------------------------------
# Seed della whitelist tipi indirizzo per ambito documento.
# Prima carica di config.tipi_indirizzi_allowed (finora vuota: si viveva
# del fallback hardcoded nel trigger). Dopo questo seed la whitelist e'
# l'unica fonte di verita' (il fallback viene rimosso in 20260711-19).
#
# Codici -> id (config.tipi_indirizzi): FATT=8, CON=10, FORNITURA=9, RES=1.
# Decisioni D-2 (CON unico "dove va la merce", SPED ritirato dagli ambiti
# documento) e obblighi Q4 (CON obbligatorio su DDT, FATT su FATTURE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260711-18-upsert-tipi_indirizzi_allowed-mctit.yaml

  - changeSet:
      id: 20260711-18-upsert-tipi_indirizzi_allowed
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_indirizzi_allowed
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_indirizzi_allowed.csv
            tableName: tipi_indirizzi_allowed
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "ambito,tipo_indirizzo_id"
            columns:
              # rev 2026-10-20 (20261020-47, brief-db-grammatica-unica-documenti 2d, G-6):
              #   ambito e' il codice della sorgente del documento (FK verso config.sorgenti).
              - column: { name: ambito,             type: STRING }
              - column: { name: tipo_indirizzo_id,  type: NUMERIC }
              - column: { name: obbligatorio,       type: BOOLEAN }
              - column: { name: attivo,             type: BOOLEAN }
