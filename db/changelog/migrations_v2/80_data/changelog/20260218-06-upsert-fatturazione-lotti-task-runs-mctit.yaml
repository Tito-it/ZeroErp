# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260218-06-upsert-fatturazione-lotti-task-runs
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: fatturazione_lotti_task_runs
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fatturazione_lotti_task_runs.csv
            tableName: fatturazione_lotti_task_runs
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: lotto_id, type: STRING }
              - column: { name: pipeline_id, type: STRING }
              - column: { name: stato_doc_fiscale_id, type: STRING }
              - column: { name: task_code, type: STRING }
              - column: { name: fase, type: STRING }
              - column: { name: tentativo, type: STRING }
              - column: { name: task_stato, type: STRING }
              - column: { name: started_at, type: STRING }
              - column: { name: ended_at, type: STRING }
              - column: { name: error_code, type: STRING }
              - column: { name: error_message, type: STRING }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: tx_id, type: STRING }

