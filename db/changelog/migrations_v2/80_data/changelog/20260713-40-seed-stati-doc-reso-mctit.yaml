databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260713-40-seed-stati-doc-reso-mctit.yaml

  - changeSet:
      id: 20260713-40-seed-stati-doc-reso
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_reso
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_reso.csv
            tableName: stati_doc_reso
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: NUMERIC }
              - column: { name: meta, type: JSON, defaultValue: "{}" }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }
              # 2026-10-24 (20261024-07, brief-modello-documento-vendita P-1): lo stato in cui
              # un documento nasce. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: iniziale, type: BOOLEAN }
