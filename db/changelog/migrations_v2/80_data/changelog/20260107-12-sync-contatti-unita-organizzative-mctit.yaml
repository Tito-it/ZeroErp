# Liquibase changelog per Zero ERP
# Allinea contatti.unita_organizzativa_id da tipo_contatto_id
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260107-12-sync-contatti-unita-organizzative-mctit.yaml

  - changeSet:
      id: 20260107-12-sync-contatti-unita-organizzative
      author: mctit
      # runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: anagrafiche
            tableName: contatti
        - tableExists:
            schemaName: config
            tableName: unita_organizzative
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE anagrafiche.contatti c
                 SET unita_organizzativa_id = c.tipo_contatto_id
               WHERE c.unita_organizzativa_id IS NULL
                 AND c.tipo_contatto_id IS NOT NULL;
