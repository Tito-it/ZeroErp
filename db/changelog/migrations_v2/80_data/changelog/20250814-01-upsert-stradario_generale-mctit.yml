databaseChangeLog:
  - changeSet:
      id: 20250813-05-upsert-stradario_generale
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stradario_generale
      changes:
        # Upsert dei dati nella tabella stradario_generale
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stradario_generale.csv
            tableName: stradario_generale
            schemaName: config
            separator: ","
            encoding: UTF-8
            # nullValue: ""
            nullValue: "NULL"
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: toponomastica_id,    type: STRING }
              - column: { name: descrizione,  type: STRING }
              - column: { name: descrizione_breve,  type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              
              

  - changeSet:
      id: 20250813-90-upsert-stradario_generale
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250813-05-upsert-stradario_generale
