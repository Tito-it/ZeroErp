databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260207-01-insert-automation-rules-cleanup-mctit.yaml

  - changeSet:
      id: 20260207-01-insert-automation-rules-cleanup
      author: mctit
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automation_rules_tbl
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              INSERT INTO dbops.automation_rules_tbl
                (enabled, rule_type, target_schema, target_table, exec_mode,
                 name_template, existence_strategy, params, priority, note)
              SELECT
                true,
                'CLEANUP_AT',
                '*all',
                '*all',
                'AUTO',
                NULL,
                'BY_NAME',
                '{"ttl_days":30,"cleanup_column":"cleanup_at","apply_on_update":false}'::jsonb,
                200,
                'cleanup_at: calcolo TTL fisso (30 giorni)'
              WHERE NOT EXISTS (
                SELECT 1
                  FROM dbops.automation_rules_tbl
                 WHERE rule_type = 'CLEANUP_AT'
                   AND target_schema = '*all'
                   AND target_table = '*all'
              );

              INSERT INTO dbops.automation_rules_tbl
                (enabled, rule_type, target_schema, target_table, exec_mode,
                 name_template, existence_strategy, params, priority, note)
              SELECT
                true,
                'CLEANUP_PURGE',
                '*all',
                '*all',
                'AUTO',
                NULL,
                'BY_NAME',
                '{"cleanup_column":"cleanup_at","batch_limit":5000}'::jsonb,
                210,
                'cleanup_at: purge record scaduti (batch 5000)'
              WHERE NOT EXISTS (
                SELECT 1
                  FROM dbops.automation_rules_tbl
                 WHERE rule_type = 'CLEANUP_PURGE'
                   AND target_schema = '*all'
                   AND target_table = '*all'
              );
