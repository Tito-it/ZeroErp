databaseChangeLog:
  - changeSet:
      id: 20250915-01-upsert-stati_doc_ddt
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_ddt
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_ddt.csv
            tableName: stati_doc_ddt
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id,           type: STRING }
              
              - column: { name: codice,    type: STRING }
              
              - column: { name: descrizione,  type: STRING }
              - column: { name: attivo,  type: BOOLEAN }
              - column: { name: ordine,    type: STRING }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: codice_interno,    type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING 
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              # 2026-07-11: bottone PDF data-driven via capabilities
              - column: { name: pdf_mode,           type: STRING }
              - column: { name: pdf_allow_allegati, type: BOOLEAN }
              # 2026-10-24 (20261024-07, brief-modello-documento-vendita P-1): lo stato in cui
              # un documento nasce. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: iniziale, type: BOOLEAN }
              # 2026-10-25 (20261025-37, brief-modello-documento-vendita §8): lo stato di
              # emissione. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: emissione, type: BOOLEAN }
              # 2026-11-14 (20261113-42, brief-db-stati-documento-dal-vocabolario giro 3): terminale, e il
              # verdetto (NULL = nessuno). esito ha una FK verso config.esiti_flussi_pratiche, seminato
              # dopo questo mirror (20260701-04): qui si salta (SKIP), lo carica il mirror ri-ancorato
              # 20261113-50 (linee-guida-sql §11.2).
              - column: { name: esito, type: SKIP }
              - column: { name: terminale, type: BOOLEAN }


  - changeSet:
      id: 20250915-90-upsert-stati_doc_ddt
      author: mctit
      changes:
        - tagDatabase:
            tag: 220250915-01-upsert-stati_doc_ddt
