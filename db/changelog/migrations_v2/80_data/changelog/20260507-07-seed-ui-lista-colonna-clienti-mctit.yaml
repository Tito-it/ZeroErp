# Seed ui.lista_colonna — colonne del catalogo per tutte le liste.
# Attuale contenuto: 14 colonne per 'anagrafiche.clienti' (lista_id=1).
#
# Il trigger B2 (trgfn_ui_lista_colonna_a10_valida_campo_sorgente)
# valida campo_sorgente contro pg_catalog.pg_attribute: la view
# anagrafiche.vw_clienti_lista deve esistere prima di questo seed
# (migration 20260507-05 + 20260508-02 in 20_code/anagrafiche).
#
# Blocco F.2 (2026-05-08): aggiunta etichetta_i18n_key, fix campo_sorgente
# codice_fiscale -> id_fiscale_univoco_cf_piva, nuova riga sosp_riatt.
#
# 2026-07-26 — `priorita` entra nel CSV (24a colonna).
# Fino a ieri il peso del ritiro responsive NON era esprimibile qui: nasceva a
# DEFAULT 50 (20260602-13) e veniva impostato da changeset SQL separati, uno per
# famiglia di lista — 20260602-16 (contratti), 20260603-07 (preventivi),
# 20260603-08 (offerte), 20260603-15 (ordini), 20260709-17 (DDT), 20260718-20
# (resi). Sei file per UNA colonna, con il valore vivo non leggibile da nessun
# seed: ogni colonna nuova pretendeva il suo changeset.
# Ora `priorita` sta nel CSV come tutte le altre: cambiare un peso = editare una
# cella e ri-applicare. I sei changeset SQL restano nella storia e diventano
# inerti — riscrivono esattamente i valori che il CSV gia' porta (trascritti 1:1
# da quei file; tutto cio' che non nominavano e' rimasto a 50).
# Da qui in avanti NON creare changeset SQL per priorita.
#
# ⚠️ Questo changeSet e' `runOnChange: true` + `validCheckSums: ANY`, cioe' un
# mirror vivo del CSV: e' progettato per ri-girare a ogni modifica del file, ed
# e' per questo che l'aggiunta di una colonna alla lista qui sotto non rompe la
# sequenza dei checksum. Vale solo per i loader con questa forma.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260507-07-seed-ui-lista-colonna-clienti-mctit.yaml

  - changeSet:
      id: 20260507-07-seed-ui-lista-colonna-clienti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: ui
            tableName: lista_colonna
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/ui/lista_colonna.csv
            tableName: lista_colonna
            schemaName: ui
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id,               type: NUMERIC }
              - column: { name: lista_id,          type: NUMERIC }
              - column: { name: codice,            type: STRING }
              - column: { name: etichetta,         type: STRING }
              - column: { name: etichetta_estesa,  type: STRING }
              - column: { name: campo_sorgente,    type: STRING }
              - column: { name: tipo_colonna,      type: STRING }
              - column: { name: tipo_dato,         type: STRING }
              - column: { name: formato,           type: STRING }
              - column: { name: larghezza_default, type: NUMERIC }
              - column: { name: ordine_default,    type: NUMERIC }
              - column: { name: allineamento,      type: STRING }
              - column: { name: gruppo,            type: STRING }
              - column: { name: gruppo_ordine,     type: NUMERIC }
              - column: { name: filtrabile,        type: BOOLEAN }
              - column: { name: ordinabile,        type: BOOLEAN }
              - column: { name: esportabile,       type: BOOLEAN }
              - column: { name: ricercabile_full,  type: BOOLEAN }
              - column: { name: sensibile,         type: BOOLEAN }
              - column: { name: attivo,            type: BOOLEAN }
              - column: { name: data_insert,          type: STRING }
              - column: { name: user_insert,          type: STRING }
              - column: { name: etichetta_i18n_key,   type: STRING }
              # Peso del ritiro dinamico colonne (consumato da
              # ui.fn_resolve_lista_config): piu' alto = resiste piu' a lungo
              # allo stringersi dello schermo. NOT NULL, mai cella vuota.
              - column: { name: priorita,             type: NUMERIC }
