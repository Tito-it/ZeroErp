# Seed dei tre vocabolari dell'erogazione
#   config.erogazioni_fonti               (20261007-50, giro B1)
#   config.listini_tipologie_erogazioni   (20261007-51, giro B2)
#   config.nature_vendita_erogazioni      (20261007-51, giro B2)
#   Brief: brief-db-offerta-emissione-ed-erogazione §C.5.2, §C.7
#
# ── I VALORI ─────────────────────────────────────────────────────
#   · erogazioni_fonti: le combinazioni che i CHECK chk_*_coerenza_fonte_erogazione
#     ammettevano, una per una, e come default le fonti del CASE di
#     trgfn_righe_default_fonte_qta (CANONE e UNA_TANTUM -> FISSA, ORARIO ->
#     MANUALE, CONSUMO -> LETTURE). Il giro B1 non cambia il comportamento.
#   · tipologie e nature: la tabella del §C.5.2, confermata da Tid il
#     2026-10-07. ⛔ Rev 2026-10-29 (F-7 di Tid, brief-db-contratto-righe-
#     periodiche-in-commessa §6.6): senza generazione_canone, che portava
#     INIZIO_PERIODO sulle righe CANONE. Anticipati o normali li dice la
#     testata del documento; la colonna esce col 20261029-24, i CHECK col -16.
#   · ⛔ Rev 2026-10-29 (G-9 di Tid, Lotto 2): CANONE/MANUALE esce (id 2, lo
#     cancella il 20261029-32), entra CANONE/DURATA (id 14: gli id ritirati non
#     si riusano). CANONE/DURATA, mai di default, sulle tipologie QUOTA_FISSA e
#     SERVIZI e sulla natura SERVIZIO_RICORRENTE (Tid, 2026-10-29: non su
#     IMPOSTA ne' su ONERE_SISTEMA). Se l'articolo la puo' usare lo decide la sua
#     unita' di misura (vendite.fn_articolo_erogazioni, 20261029-33).
#   · ⛔ Rev 2026-10-29 (Tid, revoca della tabella del §C.5.2 del 2026-10-07):
#     IMPOSTA non ammette piu' CANONE/FISSA (id 5): un'imposta non e' un canone.
#     La riga la cancella il 20261029-34, con le due CANONE/DURATA (id 15, 16) che
#     il primo apply del Lotto 2 aveva messo su IMPOSTA e ONERE_SISTEMA.
#
# ── LA FORMA ─────────────────────────────────────────────────────
#   Mirror loadUpdateData chiavato sull'id (scritto nel CSV), nullValue "NULL"
#   (linee-guida-sql §11.7: il token, non la cella vuota). Un changeSet solo,
#   nell'ordine delle FK: erogazioni_fonti per prima.
#   Le tre tabelle si popolano SOLO da CSV (nessun CRUD): nessun resync della
#   sequence.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261007-53-seed-erogazioni-vocabolari-mctit.yaml

  - changeSet:
      id: 20261007-53-seed-erogazioni-vocabolari
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Seed di config.erogazioni_fonti, config.listini_tipologie_erogazioni e
        config.nature_vendita_erogazioni. Brief: brief-db-offerta-emissione-ed-erogazione §C.7.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: erogazioni_fonti
        - tableExists:
            schemaName: config
            tableName: listini_tipologie_erogazioni
        - tableExists:
            schemaName: config
            tableName: nature_vendita_erogazioni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/erogazioni_fonti.csv
            tableName: erogazioni_fonti
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: tipo_erogazione, type: STRING }
              - column: { name: fonte_quantita_attesa, type: STRING }
              - column: { name: e_default, type: BOOLEAN }
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/listini_tipologie_erogazioni.csv
            tableName: listini_tipologie_erogazioni
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: tipologia_id, type: NUMERIC }
              - column: { name: tipo_erogazione, type: STRING }
              - column: { name: fonte_quantita_attesa, type: STRING }
              - column: { name: e_default, type: BOOLEAN }
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/nature_vendita_erogazioni.csv
            tableName: nature_vendita_erogazioni
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: natura_vendita_id, type: NUMERIC }
              - column: { name: tipo_erogazione, type: STRING }
              - column: { name: fonte_quantita_attesa, type: STRING }
              - column: { name: e_default, type: BOOLEAN }
