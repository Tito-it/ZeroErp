# Liquibase changelog per Zero ERP
# Upsert dati config.email_account
# Seed: account SISTEMA (fallback per invii senza reparto).
# La password SMTP e' un placeholder — da configurare in produzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260329-60-upsert-config-email-account-mctit.yaml

  - changeSet:
      id: 20260329-60-upsert-config-email-account
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: email_account
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/email_account.csv
            tableName: email_account
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: unita_organizzativa_id, type: NUMERIC }
              - column: { name: smtp_host, type: STRING }
              - column: { name: smtp_port, type: NUMERIC }
              - column: { name: smtp_use_tls, type: BOOLEAN }
              - column: { name: smtp_use_ssl, type: BOOLEAN }
              - column: { name: smtp_username, type: STRING }
              - column: { name: smtp_password_encrypted, type: STRING }
              - column: { name: email_from, type: STRING }
              - column: { name: email_reply_to, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }
