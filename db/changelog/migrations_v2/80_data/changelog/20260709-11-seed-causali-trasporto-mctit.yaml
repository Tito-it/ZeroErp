# Seed config.causali_trasporto — set standard IT (brief §7 / §9 PDF).
#
# Il CSV era vuoto (solo header): senza valori il PDF DDT (D-3) non ha causale
# da stampare e ddt.causale_trasporto_id (FK) non ha voci selezionabili.
# Set base: VENDITA, CONTO_VISIONE, RESO, RIPARAZIONE, CAMPIONATURA,
#   TRASFERIMENTO, CONTO_LAVORAZIONE, OMAGGIO. Tutte attive.
#
# Primo caricamento (nessun loader preesistente per questa tabella).
# Dipendenza: config.causali_trasporto (tabella gia' esistente, referenziata da
#   vendite.ddt.causale_trasporto_id + trigger require_attivo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260709-11-seed-causali-trasporto-mctit.yaml

  - changeSet:
      id: 20260709-11-seed-causali-trasporto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: causali_trasporto
            # La colonna arriva da 20260718-03 (fase 00_schema, che gira prima di
            # 80_data): senza, il loadUpdateData fallirebbe sulla colonna ignota.
            - columnExists:
                schemaName: config
                tableName: causali_trasporto
                columnName: fatturabile
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/causali_trasporto.csv
            tableName: causali_trasporto
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              # 2026-07-18 (step 5b, DL-28): dichiara se la merce che viaggia con
              # questa causale e' una VENDITA da fatturare. Colonna aggiunta da
              # 20260718-03; qui si carica il valore delle otto causali di seed.
              # Il changeSet e' runOnChange -> ripesca il CSV da se'.
              - column: { name: fatturabile, type: BOOLEAN }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
