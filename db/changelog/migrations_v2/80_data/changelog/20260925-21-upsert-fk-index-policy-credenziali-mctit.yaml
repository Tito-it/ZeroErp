# P-1 — REGISTRO INDICI FK DELLE TABELLE DELLA CREDENZIALE
#   Brief: brief-db-blocco-login-per-credenziale, sezione 2.2
#
#   Tre FK, tutte a consentito=false:
#   · fk_config_credenziali_auth_user (90_end/20260925-22): coperta da
#     uq_credenziali_auth_user, che ha auth_user_id come unica colonna;
#   · fk_config_credenziali_bloccata_da_auth_user (90_end/20260925-23):
#     nessuna lettura entra da bloccata_da, e la tabella ha una riga per
#     credenziale che ha sbagliato o e' stata bloccata;
#   · fk_credenziali_provenienze_credenziali (00_schema/20260925-02): coperta
#     da uq_credenziali_provenienze_credenziale_provenienza, credenziale_id in
#     testa.
#   dll_command col nome di convenzione anche per un «no» (CHECK
#   chk_fk_index_policy_dll_command_forma): se l'indice non esiste il DROP e'
#   un no-op, e se un giorno il flag passasse a true nascerebbe col nome giusto.
#
# ⚠️ CSV dedicato e non fk_index_policy.csv: quello e' un mirror di gennaio,
# dormiente, e svegliarlo e' la trappola documentata in 20260921-25. Le due FK
# verso Django in CI non esistono (90_end, MARK_RAN): come le 11 del ponte
# 20260921-13, la riga di policy c'e' comunque.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260925-21-upsert-fk-index-policy-credenziali-mctit.yaml

  - changeSet:
      id: 20260925-21-upsert-fk-index-policy-credenziali
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per le tre FK delle tabelle della credenziale (credenziali.auth_user_id e
        .bloccata_da verso django.auth_user, credenziali_provenienze.credenziale_id), tutte a
        consentito=false: due coperte da una UNIQUE, la terza senza letture. dll_command al nome
        canonico. Brief: brief-db-blocco-login-per-credenziale §2.2.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: fk_index_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/fk_index_policy_credenziali.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE constraint_name IN ('fk_config_credenziali_auth_user',
                                         'fk_config_credenziali_bloccata_da_auth_user',
                                         'fk_credenziali_provenienze_credenziali');
