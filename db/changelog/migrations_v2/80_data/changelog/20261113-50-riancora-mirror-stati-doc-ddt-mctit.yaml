# IL MIRROR DEGLI STATI DELLA BOLLA, RI-ANCORATO DOPO IL SEED DEGLI ESITI
#   Brief: brief-db-stati-documento-dal-vocabolario, giro 3 (⑦).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Con il 20261113-42 config.stati_doc_ddt ha la colonna esito, con una FK
#   verso config.esiti_flussi_pratiche. Il mirror del vocabolario
#   (20250915-01) gira, da zero, prima del seed degli esiti (20260701-04):
#   li' esito non si puo' caricare, e il mirror lo salta (type: SKIP). Questo
#   mirror ri-applica lo stesso CSV dopo, con tutte le colonne, esito
#   compreso (linee-guida-sql §11.2, «una colonna con FK aggiunta a un CSV»).
#   La sede degli stati della bolla resta il CSV
#   80_data/sql/config/stati_doc_ddt.csv: nessun UPDATE qui.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261113-50-riancora-mirror-stati-doc-ddt-mctit.yaml

  - changeSet:
      id: 20261113-50-riancora-mirror-stati-doc-ddt
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Ri-applica il CSV di config.stati_doc_ddt dopo il seed di config.esiti_flussi_pratiche,
        con la colonna esito (FK), che il mirror del 20250915-01 salta. Brief:
        brief-db-stati-documento-dal-vocabolario, giro 3.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_ddt
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_ddt.csv
            tableName: stati_doc_ddt
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: STRING }
              - column: { name: meta, type: JSON, defaultValue: "{}" }
              - column: { name: codice_interno, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING, defaultValue: "NOW()" }
              - column: { name: user_update, type: STRING }
              - column: { name: pdf_mode, type: STRING }
              - column: { name: pdf_allow_allegati, type: BOOLEAN }
              - column: { name: fase, type: STRING }
              - column: { name: is_abortito, type: BOOLEAN }
              - column: { name: iniziale, type: BOOLEAN }
              - column: { name: emissione, type: BOOLEAN }
              - column: { name: esito, type: STRING }
              - column: { name: terminale, type: BOOLEAN }
