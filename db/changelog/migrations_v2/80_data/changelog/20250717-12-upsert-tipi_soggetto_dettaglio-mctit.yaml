databaseChangeLog:
  - changeSet:
      id: 20250717-12-upsert-tipi_soggetto_dettaglio
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
      changes:
        # 1) Disabilita tutti i trigger sulla tabella
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              ALTER TABLE config.tipi_soggetto_dettaglio DISABLE TRIGGER trg_tipi_soggetto_dettaglio_a10_lock_columns_upd;

        # 2) Upsert di tutte le colonne,
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_soggetto_dettaglio.csv
            tableName: tipi_soggetto_dettaglio
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }
              - column: { name: tipo_soggetto_id, type: STRING }
              - column: { name: stato_iso2, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: formato_cf, type: STRING }
              - column: { name: formato_piva, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: stato_id, type: STRING }
              - column: { name: dati_societari_policy, type: STRING }
              - column: { name: piva_obbligatoria, type: BOOLEAN }
              - column: { name: cf_obbligatorio, type: BOOLEAN }
              # 2026-10-09: quando serve il sesso (REQUIRED/OPTIONAL/NONE, tipo
              #   config.presenza_policy_enum, colonna del 20261009-19).
              #   Brief: brief-db-sesso-senza-default.
              - column: { name: sesso_policy, type: STRING }
              # 2026-10-10: quali nature ammettono «cliente PA» e «split payment»
              #   (colonne del 20261010-85). Brief:
              #   brief-db-dati-fiscali-e-societari-del-soggetto (A-1, A-2).
              - column: { name: cliente_pa_ammesso, type: BOOLEAN }
              - column: { name: split_payment_ammesso, type: BOOLEAN }

        # 3) Ri‐abilita tutti i trigger
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              ALTER TABLE config.tipi_soggetto_dettaglio ENABLE TRIGGER trg_tipi_soggetto_dettaglio_a10_lock_columns_upd;

  - changeSet:
      id: 20250717-90-upsert-tipi_soggetto_dettaglio
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250717-12-upsert-tipi_soggetto_dettaglio
