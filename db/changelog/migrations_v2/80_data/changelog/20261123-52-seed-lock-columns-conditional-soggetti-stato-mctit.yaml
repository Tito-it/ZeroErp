# ------------------------------------------------------------
# dbops.lock_columns_conditional: lo stato_id di anagrafiche.soggetti spento
#   nel form quando il guard lo rifiuterebbe.
#   Brief: brief-db-revisione-anagrafiche §20 (T5), D-T5-3 a (Tid, 2026-11-23).
#
# La condizione e' anagrafiche.fn_soggetto_id_fiscale_bloccato con la colonna
# stato_id (20_code -51), la stessa regola che il guard legge sul valore OLD:
# il form e il DB dicono la stessa cosa. Forma e chiave come 20261110-97, che
# ha scritto le righe di CF e P.IVA: qui si riscrivono anche quelle, perche'
# la loro descrizione nomina il guard, che cambia nome (fase a05, -51).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261123-52-seed-lock-columns-conditional-soggetti-stato-mctit.yaml

  - changeSet:
      id: 20261123-52-seed-lock-columns-conditional-soggetti-stato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.lock_columns_conditional (anagrafiche.soggetti): stato_id spento nel form se
        anagrafiche.fn_soggetto_id_fiscale_bloccato. brief-db-revisione-anagrafiche §20, D-T5-3 a.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: lock_columns_conditional
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_soggetto_id_fiscale_bloccato'
                 AND p.prosrc LIKE '%''stato_id''%';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              INSERT INTO dbops.lock_columns_conditional
                  (schema_name, table_name, column_name, condition_expr, descrizione)
              SELECT 'anagrafiche', 'soggetti', c.colonna,
                     'anagrafiche.fn_soggetto_id_fiscale_bloccato($1::uuid, ''' || c.colonna || ''')',
                     c.descrizione || ' Simmetrico a trg_soggetti_a05_guard_id_fiscale_immutabile_upd'
                FROM (VALUES
                        ('codice_fiscale', 'codice_fiscale non modificabile se gia'' scritto, salvo il SUPER_ADMIN; un campo vuoto si riempie.'),
                        ('partita_iva',    'partita_iva non modificabile se gia'' scritta, salvo il SUPER_ADMIN; un campo vuoto si riempie.'),
                        ('stato_id',       'stato_id non modificabile, salvo il SUPER_ADMIN: e'' meta'' della chiave d''unicita'' del soggetto con CF e P.IVA (D-T5-3 a, brief-db-revisione-anagrafiche §20).')
                     ) AS c(colonna, descrizione)
              ON CONFLICT ON CONSTRAINT uq_lock_columns_conditional DO UPDATE
                  SET condition_expr = EXCLUDED.condition_expr,
                      descrizione    = EXCLUDED.descrizione;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.lock_columns_conditional
               WHERE schema_name = 'anagrafiche'
                 AND table_name  = 'soggetti'
                 AND column_name = 'stato_id';
