databaseChangeLog:
  - changeSet:
      id: 20260419-81-backfill-bindings-super-admin
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Backfill §4.6.E.2 WIP multi-face-auth: crea un binding
        config.profili_accesso_bindings con profilo SUPER_ADMIN (id 9100)
        per ogni identita OPERATORE la cui controparte RUA ha
        ruolo_sistema='ADMIN'. Traduce gli ADMIN legacy nel nuovo modello
        "ADMIN come profilo". Idempotente via NOT EXISTS sul constraint
        "un solo binding per identita" (uq_profili_accesso_bindings_identita).

        Dipendenze:
          - 20260419-04: profilo SUPER_ADMIN id 9100 seedato
          - 20260419-80: identita_digitali OPERATORE popolate
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM config.profili_accesso
                 WHERE id = 9100 AND tipo = 'SUPER_ADMIN';
          - tableExists:
              schemaName: config
              tableName: profili_accesso_bindings
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Binding SUPER_ADMIN per operatori ADMIN legacy.
              -- NOT EXISTS sul constraint "un solo binding per identita":
              -- se un'identita ha gia' un binding (di qualunque tipo),
              -- il backfill non aggiunge SUPER_ADMIN. In pratica per gli
              -- ADMIN legacy questo vincolo e' sempre soddisfatto (non
              -- hanno binding AD_HOC). Il guard
              -- trgfn_profili_accesso_bindings_guard_coerenza verifichera'
              -- che identita_digitale_id sia valorizzato (gia' garantito
              -- dalla SELECT).
              INSERT INTO config.profili_accesso_bindings (
                  profilo_accesso_id,
                  identita_digitale_id,
                  attivo
              )
              SELECT 9100 AS profilo_accesso_id,
                     id.id AS identita_digitale_id,
                     true  AS attivo
                FROM anagrafiche.identita_digitali id
                JOIN anagrafiche.risorse_umane_auth_user rau
                  ON rau.auth_user_id = id.auth_user_id
               WHERE id.ruolo_applicativo = 'OPERATORE'
                 AND rau.ruolo_sistema = 'ADMIN'::config.ruolo_sistema
                 AND NOT EXISTS (
                     SELECT 1
                       FROM config.profili_accesso_bindings pab
                      WHERE pab.identita_digitale_id = id.id
                 );

              -- Allineamento sequenza (minore rischio: i bindings seed
              -- portali erano gia' 9001-9003, ma i REPARTO usano
              -- autoincrement da 1. Meglio sicurezza).
              SELECT setval(
                  pg_get_serial_sequence('config.profili_accesso_bindings', 'id'),
                  GREATEST(COALESCE(MAX(id), 0), 1),
                  true
              ) FROM config.profili_accesso_bindings;

      rollback:
        - sql:
            sql: |
              -- Rollback: rimuove i bindings SUPER_ADMIN creati dal
              -- backfill. Non tocca eventuali altri bindings SUPER_ADMIN
              -- creati manualmente (non dovrebbero esistere pre-PR1).
              DELETE FROM config.profili_accesso_bindings pab
               WHERE pab.profilo_accesso_id = 9100
                 AND pab.identita_digitale_id IS NOT NULL;
