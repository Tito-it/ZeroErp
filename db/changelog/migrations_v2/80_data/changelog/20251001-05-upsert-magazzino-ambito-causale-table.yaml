databaseChangeLog:
  - changeSet:
      id: 20251001-05-upsert-magazzino-ambito-causale-table
      logicalFilePath: migrations_v2/80_data/20251001-05-upsert-magazzino-ambito-causale-table.yaml
      author: mctit
      #runOnChange: true
      #validCheckSums:
      #  - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: magazzino
            tableName: ambito_causale
      changes:
        # Upsert dei dati nella tabella ambito_causale
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/magazzino/ambito_causale.csv
            tableName: ambito_causale
            schemaName: magazzino
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: codice,  type: STRING }
              - column: { name: codice_interno,    type: STRING }              
              - column: { name: descrizione,  type: STRING }
              - column: { name: ordine,  type: STRING }
              - column: { name: name_template,  type: STRING }
              - column: { name: existence_strategy,  type: STRING }
              - column: { name: attivo,  type: BOOLEAN }
              - column:
                  name: extra_info
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: tx_id,    type: uuid  }           
              - column: { name: user_insert,  type: STRING }
              - column: { name: user_update,  type: STRING }  
              - column: { name: data_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING 
                  defaultValue: "NOW()"
              - column: { name: storicizza,  type: BOOLEAN }