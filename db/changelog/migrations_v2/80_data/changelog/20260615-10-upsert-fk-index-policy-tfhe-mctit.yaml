# Seed dbops.fk_index_policy per le FK di
# pratiche.template_flussi_handler_eventi:
#   - fk_tfhe_template_flusso (template_flusso_id) -> consentito=true:
#     il dispatch legge i binding PER template/evento, e' l'access path.
#   - fk_tfhe_handler (handler_id) -> consentito=false: reverse lookup
#     ("quali template usano questo handler") raro, non vale l'indice.
# Creazione/rimozione indici delegata a dbops.apply_fk_index_policy()
# in 90_end (mai a mano). Pattern simmetrico a 20260611-14 / 20260615-06.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260615-10-upsert-fk-index-policy-tfhe-mctit.yaml

  - changeSet:
      id: 20260615-10-upsert-fk-index-policy-tfhe
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: pratiche
            tableName: template_flussi_handler_eventi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/fk_index_policy_tfhe.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,           type: STRING }
              - column: { name: constraint_name,      type: STRING }
              - column: { name: consentito,           type: BOOLEAN }
              - column: { name: dll_command,          type: STRING }
              - column: { name: generated_by_script,  type: BOOLEAN }
              - column: { name: user_insert,          type: STRING }
              - column: { name: data_insert,          type: STRING }
