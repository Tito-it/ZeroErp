# E-1 (seed) — I TRE MODI DI ESPORRE UN COMPONENTE DI KIT
#   config.esposizioni_componente: NASCOSTO, DESCRITTIVO, VALORIZZATO
#   Brief: brief-db-esposizione-componenti-kit-in-fattura, sezione 4.1
#
# ⚠️ Mirror `loadUpdateData`, `runOnChange`: un valore si cambia nel CSV, mai
#   con un UPDATE a parte (linee-guida-sql 11.2). Chiave del mirror: `id`,
#   fisso nel CSV (1..3) — le FK puntano a codice_interno, quindi un reseed con
#   id diversi non sposta niente.
# ⚠️ Colonne di audit lasciate ai DEFAULT del database.
# ⚠️ etichetta_key: la legge scripts/check_i18n_keys.py dai CSV, quindi le tre
#   chiavi config.esposizioni_componente.* devono esistere nei locale del FE
#   (richiesta nel brief, sezione 5, stesso giro).
# ⚠️ Deve girare PRIMA di 20261001-57 (le FK), che lo presuppone: in 80_data
#   l'ordine e' quello dei nomi dei file.
# ⚠️ Seed di CATALOGO: nessuna FK verso anagrafiche.*, nessun `context`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261001-56-seed-esposizioni-componente-mctit.yaml

  - changeSet:
      id: 20261001-56-seed-esposizioni-componente
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Seed config.esposizioni_componente: NASCOSTO, DESCRITTIVO, VALORIZZATO.
        codice_interno = chiave naturale stabile (puntata dalle FK); codice e descrizione
        per l'operatore, etichetta_key per il FE. Mirror loadUpdateData. Brief:
        brief-db-esposizione-componenti-kit-in-fattura (E-1).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: esposizioni_componente
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/esposizioni_componente.csv
            tableName: esposizioni_componente
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: etichetta_key, type: STRING }
              - column: { name: ordine, type: NUMERIC }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DELETE FROM config.esposizioni_componente
               WHERE codice_interno IN ('NASCOSTO', 'DESCRITTIVO', 'VALORIZZATO');
