databaseChangeLog:
  - changeSet:
      id: 20251002-21-upsert-config-sorgenti-table
      logicalFilePath: migrations_v2/80_data/20251002-21-upsert-config-sorgenti-table.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: sorgenti
      changes:
        # Upsert dei dati nella tabella sorgenti
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/sorgenti.csv
            tableName: sorgenti
            schemaName: config
            separator: ","
            encoding: UTF-8
            # nullValue: token LETTERALE "NULL", non la cella vuota.
            #   Con nullValue:"" una cella vuota produce la stringa '' e non un
            #   vero NULL (violerebbe i CHECK non-vuota). Cambiato il 2026-07-27
            #   per poter esprimere area=NULL sulle sorgenti che non sono
            #   documenti sfogliabili. ⚠️ Modifica INERTE per le 15 colonne
            #   preesistenti: verificato che nel CSV non esiste alcuna cella
            #   vuota ne' alcuna cella contenente la stringa "NULL".
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: categoria, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }

              - column: { name: target_table, type: STRING }
              - column: { name: key_selector, type: STRING }
              - column: { name: tipo_doc_fiscale_id, type: STRING }
              - column: { name: scope, type: STRING }

              # area: mappa sorgente -> area documentale, aggiunta 2026-07-27
              #   (colonna da 20260727-17, brief emissione mirata A7-bis / D-5).
              #   Loader esteso IN PLACE: e' runOnChange + validCheckSums ANY,
              #   quindi mirror vivo del CSV. Nessun loader nuovo.
              #   NULL (token) = sorgente non sfogliabile come documento.
              # ⛔ area RITIRATA il 2026-10-20 (20261020-48, brief-db-grammatica-unica-documenti
              #    2d, G-6 e L2d-1): al suo posto apribile (boolean NOT NULL), vero quando la
              #    sorgente e' un documento con una sua pagina. Nasce uguale a «area valorizzata».
              - column: { name: apribile, type: BOOLEAN }

              # label_selector: quale colonna della target_table porta il NUMERO
              #   LEGGIBILE del documento, aggiunta 2026-08-20 (colonna da
              #   20260820-03, brief nota di credito §40.1.4 — richiesta BE).
              #   Gemella di key_selector: quella dichiara la colonna CHIAVE,
              #   questa la colonna con cui il documento si NOMINA. Non e'
              #   uniforme (`numero` quasi ovunque, `codice` su offerte e
              #   commesse) e per questo e' un dato e non un CASE.
              #   Loader esteso IN PLACE, come per `area`: nessun loader nuovo.
              #   NULL (token) = la sorgente non ha un numero leggibile.
              #   ⚠️ Le cinque *_RIGA (id 3,5,7,9,11) esistono nel DB e NON nel
              #   CSV: loadUpdateData non le tocca e restano a NULL, che per
              #   loro e' il valore giusto.
              - column: { name: label_selector, type: STRING }

              # etichetta: il nome del tipo di documento come lo legge una
              #   persona, sulla carta («Offerta», «Ordine», «DDT»), aggiunta
              #   2026-10-20 (colonna da 20261020-22, NOT NULL da 20261020-23;
              #   brief-db-grammatica-unica-documenti §12.9, L2b-1).
              #   Loader esteso IN PLACE, come per `area` e `label_selector`.
              #   Nessun NULL: ogni riga del CSV ha la sua etichetta, e il
              #   NOT NULL di 90_end lo pretende.
              - column: { name: etichetta, type: STRING }

              # citato_in_fattura: il documento si cita fra le «origini» della
              #   fattura (DDT, ordine, contratto, offerta, preventivo); la
              #   commessa e le attivita' no, sono contenitori interni. Aggiunta
              #   2026-10-27 (colonna da 20261027-21, brief-modello-documento-
              #   vendita §15.10, Q-F6 = b). Loader esteso IN PLACE, come per
              #   `etichetta`. Nessun NULL: la colonna e' NOT NULL DEFAULT false.
              - column: { name: citato_in_fattura, type: BOOLEAN }

              # righe_table / righe_fk_column / dettaglio_table / dettaglio_fk_column:
              #   i livelli del documento sotto la testata (la tabella delle righe e
              #   quella del dettaglio, ognuna con la colonna FK verso il livello
              #   sopra), aggiunti 2026-11-06 (colonne da 20261106-04,
              #   brief-db-sorgente-documento-e-riga §7.2 lotto 0). Li legge il
              #   guard unico della provenienza per verificare che la riga sia del
              #   documento. Loader esteso IN PLACE, come per `etichetta`.
              #   NULL (token) = il livello non c'e'. Che la FK dichiarata esista
              #   lo verifica config/test-sorgenti-livelli-v1.
              - column: { name: righe_table, type: STRING }
              - column: { name: righe_fk_column, type: STRING }
              - column: { name: dettaglio_table, type: STRING }
              - column: { name: dettaglio_fk_column, type: STRING }
