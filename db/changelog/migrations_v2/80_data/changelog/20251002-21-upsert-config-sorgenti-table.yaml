databaseChangeLog:
  - changeSet:
      id: 20251002-21-upsert-config-sorgenti-table
      logicalFilePath: migrations_v2/80_data/20251002-21-upsert-config-sorgenti-table.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: sorgenti
      changes:
        # Upsert dei dati nella tabella sorgenti
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/sorgenti.csv
            tableName: sorgenti
            schemaName: config
            separator: ","
            encoding: UTF-8
            # nullValue: token LETTERALE "NULL", non la cella vuota.
            #   Con nullValue:"" una cella vuota produce la stringa '' e non un
            #   vero NULL (violerebbe i CHECK non-vuota). Cambiato il 2026-07-27
            #   per poter esprimere area=NULL sulle sorgenti che non sono
            #   documenti sfogliabili. ⚠️ Modifica INERTE per le 15 colonne
            #   preesistenti: verificato che nel CSV non esiste alcuna cella
            #   vuota ne' alcuna cella contenente la stringa "NULL".
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: categoria, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }

              - column: { name: target_table, type: STRING }
              - column: { name: key_selector, type: STRING }
              - column: { name: tipo_doc_fiscale_id, type: STRING }
              - column: { name: scope, type: STRING }

              # area: mappa sorgente -> area documentale, aggiunta 2026-07-27
              #   (colonna da 20260727-17, brief emissione mirata A7-bis / D-5).
              #   Loader esteso IN PLACE: e' runOnChange + validCheckSums ANY,
              #   quindi mirror vivo del CSV. Nessun loader nuovo.
              #   NULL (token) = sorgente non sfogliabile come documento.
              - column: { name: area, type: STRING }
