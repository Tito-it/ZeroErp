# ⭐ DAL 2026-10-25 E' IL MIRROR UNICO DI config.parameters IN 80_data
#   (brief-db-parametri-senza-override, D-3 di Tid). parameters.csv ha preso le
#   righe dei sei CSV laterali, ritirati coi loro changeSet (20250717-23,
#   20260429-59, 20260430-62, 20260520-03, 20260826-03, 20260925-20): una
#   tabella, un CSV. Fuori resta solo parameters_sistema.csv, caricato da
#   70_dati_sistema/20260825-12 perche' il codice lo legge prima di 80_data.
#   ⚠️ Da zero queste righe nascono qui, prima del registro FK-surrogata
#   (80_data/20260520-02): il dispatcher non le valida, come gia' DEFAULT_IVA e
#   STATO_PROPOSTO_ISO2; le valida al primo risveglio del mirror su un DB
#   popolato. Prima della fusione ogni riga e' stata confrontata col DB di
#   sviluppo: valori e descrizioni identici (storicizza a parte, che il trigger
#   dello storico rimette a false dopo la prima modifica).
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20250715-01-upsert_parameters
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: parameters
      changes:
        # Upsert dei dati nella tabella parameters
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            # nullValue: ""
            nullValue: "NULL"
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: code,    type: STRING }
              - column: { name: default_value,  type: STRING }
              - column: { name: description,  type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              - column: { name: tx_id,    type: uuid  }
              - column: { name: storicizza,    type: STRING }
              # 2026-10-25 (brief-db-parametri-senza-override, D-1): la famiglia
              # del parametro, dichiarata riga per riga (nessun DEFAULT nel modello).
              - column: { name: ammette_override, type: BOOLEAN }
              # 2026-10-31 (brief-db-liste-datatable-grezze-secondo-giro, D-5): la
              # forma del valore, dichiarata riga per riga (nessun DEFAULT nel modello).
              # Il guard a07 (20261031-56) la fa rispettare al caricamento.
              - column: { name: tipo_valore, type: STRING }

  - changeSet:
      id: 20250715-90-upsert_parameters
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250715-01-upsert_parameters
