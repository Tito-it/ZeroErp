# GLI INDICI CHE IL POSTING RENDE NECESSARI — passo S1-11 (lotto 4)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §1.4 C-7, §2.1 S1-11
#
# ── ⭐ TRE SI', E ADESSO SERVONO DAVVERO ───────────────────────────────
#   C-7 diceva *«nessun indice sulle colonne che le bilance interrogano»*, e
#   finche' le tabelle erano vuote era un rilievo teorico. Col lotto 4 non lo
#   e' piu': ogni lettura di saldo scandisce quelle colonne.
#
#   * `vendite_contabili_righe(fattura_id)` — la interroga
#     `fn_get_saldo_fattura_contabili` a ogni lettura di residuo, e
#     `fn_saldo_sorgente_fondo` a ogni giro dei fondi. **PARZIALE**
#     (`WHERE fattura_id IS NOT NULL`): la colonna e' nullabile per disegno —
#     una riga `DA_ABBINARE` non ha ancora una fattura — e su una FK nullabile
#     il parziale copre il controllo referenziale restando molto piu' piccolo
#     (linee-guida-sql §8.4);
#   * `vendite_contabili_righe(contabile_id)` — la madre del posting seleziona
#     le righe di UNA distinta, tre volte: per la quadratura, per le pronte,
#     per quelle rimaste indietro. NOT NULL, quindi indice pieno;
#   * `vendite_movimenti(fattura_id)` — e' la somma che `fn_get_saldo_fattura`
#     fa per rispondere «quanto resta». NOT NULL.
#
# ── ⛔ SEI NO, E SONO RAGIONATI ────────────────────────────────────────
#   ⭐ **Non erano «no»: erano FK che nessuno aveva deciso.** Sei vincoli di
#   `pagamenti` non avevano nessuna riga di policy — quattro nati col lotto 2 —
#   e `dbops.vw_fk_senza_indice` considera «da coprire» tutto cio' che non ha
#   una riga. Scrivere il no e' cio' che chiude il registro.
#
#   * `fk_vendite_movimenti_contabile_riga` e `fk_vendite_contabili_compensazione`
#     sono gia' **coperte da un indice unico** (`uq_vendite_movimenti_contabile_riga`
#     parziale, `uq_vendite_contabili_compensazione` pieno). Aggiungerne un
#     secondo sarebbe uno dei 48 indici ridondanti censiti nel luglio 2026;
#   * le **quattro FK delle due matrici di transizione** puntano a lookup da
#     cinque e sette righe. Un btree li' e' peso in scrittura e nient'altro, e
#     il controllo referenziale scandisce i figli solo sul DELETE di uno stato —
#     che non avviene, perche' un vocabolario si deprecha (`obsoleto_dal`) e non
#     si cancella. ℹ️ Le due `_da` sono comunque gia' coperte **per prefisso**
#     dalla UNIQUE sulla coppia; scoperte restano le due `_a`, ed e' voluto.
#
# ── ⚠️ `dll_command` VA SEMPRE VALORIZZATO, anche sui NO ───────────────
#   `chk_fk_index_policy_dll_command_forma` impone la forma su OGNI riga: una
#   cella vuota fa fallire il migrate. E non e' pedanteria — con
#   `consentito = false` la procedura ne estrae il **nome** ed esegue il DROP su
#   quello: un comando vuoto le toglierebbe il solo dato che le serve per
#   rimuovere un indice creato per errore.
#
# ✅ **Esito verificabile**: dopo questo changeSet `dbops.vw_fk_senza_indice`
#    per lo schema `pagamenti` deve tornare **zero righe** — ogni FK ha o il suo
#    indice o il suo no scritto.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()` in
#    `90_end`: mai un CREATE INDEX o un DROP INDEX a mano su un indice
#    governato dalla policy.
#
# Pattern simmetrico a 20260821-55 (fondo source) e 20260818-46 (nota credito).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260822-03-upsert-dbops-fk-index-policy-posting-mctit.yaml

  - changeSet:
      id: 20260822-03-upsert-dbops-fk-index-policy-posting
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Policy indici FK per lo schema pagamenti, chiusa. Tre SI' che il posting rende
        necessari (le due colonne su cui la madre e le bilance scandiscono le righe, e la
        somma dei movimenti per fattura), di cui uno PARZIALE su una FK nullabile per
        disegno. Sei NO scritti: due FK gia' coperte da un indice unico, e le quattro delle
        matrici di transizione, che puntano a lookup da cinque e sette righe. I sei non
        erano «no»: erano FK che nessuno aveva deciso, e senza una riga di policy
        vw_fk_senza_indice le conta come da coprire. Dopo questo changeSet quella vista, per
        pagamenti, torna a zero righe.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - tableExists:
                schemaName: pagamenti
                tableName: transizioni_stati_contabile_riga
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/fk_index_policy_posting.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
