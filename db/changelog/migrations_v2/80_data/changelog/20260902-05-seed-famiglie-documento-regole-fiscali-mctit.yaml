# CHI AMMETTE LE REGOLE FISCALI: una sola famiglia
#   vendite.famiglie_documento.ammette_regole_fiscali
#   Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.17
#
# ── ⭐ CSV DEDICATO, come per `colonna_serie` ────────────────────
#   Il mirror di famiglie_documento.csv (20260830-14) e' gia' mergiato e
#   dichiara le proprie colonne una per una: aggiungerne una vorrebbe dire
#   toccarlo. Un CSV per sottoinsieme e' gia' il pattern di casa.
#
# ── ⛔ E NON UN UPDATE IN 00_schema ──────────────────────────────
#   Li' la tabella e' ancora vuota su un database ricostruito da zero: il
#   valore andrebbe perso in CI mentre su sviluppo funzionerebbe. E' lo stesso
#   inciampo gia' evitato dal 20260901-12.
#
# ── ⚠️ UNA RIGA SOLA, E NON PUO' ESSERCENE UN'ALTRA ─────────────
#   Il CHECK `chk_famiglie_documento_regole_fiscali_solo_fattura` ammette il
#   `true` sulla sola FATTURA. Questo file non e' un elenco che crescera': e'
#   la dichiarazione di un fatto che il database gia' impone altrove.
#
# ⚠️ Le altre quattro famiglie restano al default `false` e non compaiono qui:
#   scriverle sarebbe ripetere il default, e un giorno qualcuno le leggerebbe
#   come una decisione presa riga per riga.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260902-05-seed-famiglie-documento-regole-fiscali-mctit.yaml

  - changeSet:
      id: 20260902-05-seed-famiglie-documento-regole-fiscali
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Dichiara quale famiglia ammette le regole fiscali: la FATTURA, e per costruzione solo lei —
        il CHECK chk_famiglie_documento_regole_fiscali_solo_fattura non ammette altro. ⭐ CSV dedicato
        e non una colonna in famiglie_documento.csv, il cui mirror e'' gia'' mergiato: e'' il pattern gia''
        usato per colonna_serie. ⛔ E non un UPDATE in 00_schema, dove la tabella e'' vuota su un
        database ricostruito da zero. ⚠️ Le altre quattro restano al default false e non compaiono:
        ripetere un default lo fa sembrare una decisione presa riga per riga.
        Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.17.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: famiglie_documento
                columnName: ammette_regole_fiscali
            # ⛔ La riga deve esistere: con due sole colonne un INSERT sarebbe
            #    monco e violerebbe i NOT NULL della tabella.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM vendite.famiglie_documento
                   WHERE codice_interno = 'FATTURA';
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/famiglie_documento_regole_fiscali.csv
            tableName: famiglie_documento
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            nullValue: ""
            # ⚠️ Si semina per `codice_interno`, chiave naturale e immutabile
            #    (c'e' il lock), non per id.
            primaryKey: "codice_interno"
            columns:
              - column: { name: codice_interno, type: STRING }
              - column: { name: ammette_regole_fiscali, type: BOOLEAN }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Si torna al default della colonna, non si cancella la riga.
              UPDATE vendite.famiglie_documento
                 SET ammette_regole_fiscali = FALSE
               WHERE codice_interno = 'FATTURA';
