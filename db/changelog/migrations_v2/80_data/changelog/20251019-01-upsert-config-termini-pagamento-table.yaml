databaseChangeLog:
  - changeSet:
      id: 20251019-01-upsert-config-termini-pagamento-table
      logicalFilePath: migrations_v2/80_data/20251019-01-upsert-config-termini-pagamento-table.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
      #  - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: termini_pagamento
      changes:
        # Upsert dei dati nella tabella termini_pagamento
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/termini_pagamento.csv
            tableName: termini_pagamento
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: codice,  type: STRING }
              - column: { name: codice_interno,    type: STRING }              
              - column: { name: descrizione,  type: STRING }
              - column: { name: numero_rate,  type: INTEGER }
              - column: { name: unita_intervallo,  type: STRING }
              - column: { name: intervallo,  type: INTEGER }
              - column: { name: primo_offset_giorni,  type: INTEGER }
              - column: { name: tipo_offset,  type: STRING }
              - column: { name: ripartizione,  type: STRING }
              - column: { name: arrotondamento_metodo,  type: STRING }
              - column: { name: arrotondamento_decimali,  type: INTEGER }
              - column: { name: attivo,  type: BOOLEAN }
              - column: { name: user_insert,  type: STRING }
              - column: { name: user_update,  type: STRING }  
              - column: { name: data_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING 
                  defaultValue: "NOW()"
              - column: { name: storicizza,  type: BOOLEAN }