#
# Aggiunge riga NOTE_DEFAULT_STILE al registry config.parameter_fk_surrogate.
#
# Contesto: il framework FK-surrogata (dispatcher config.trgfn_parameters_fk_surrogate_dispatch,
# migration 20260502-05/06) valida il default_value di config.parameters confrontandolo
# con la chiave naturale stabile della tabella target.
# Questa riga collega il parametro NOTE_DEFAULT_STILE (code EXACT) a
# config.note_stili.codice_interno: ogni INSERT/UPDATE su parameters con
# code='NOTE_DEFAULT_STILE' verificherà che default_value sia un codice_interno
# valido in config.note_stili.
#
# Prerequisito: 20260519-02 (riga DEFAULT in config.note_stili).
# Deve precedere 20260519-04 (insert del parametro NOTE_DEFAULT_STILE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260519-03-load-parameter-fk-surrogate-note-stile-mctit.yaml

  - changeSet:
      id: 20260519-03-load-parameter-fk-surrogate-note-stile
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Aggiunge riga id=3 (NOTE_DEFAULT_STILE, EXACT, config.note_stili.codice_interno)
        al registry config.parameter_fk_surrogate.
        Abilita la validazione FK-surrogata per il parametro NOTE_DEFAULT_STILE:
        default_value deve essere un codice_interno valido di config.note_stili.
        Le righe preesistenti (id=1,2) vengono upsertate idempotentemente.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameter_fk_surrogate
            - tableExists:
                schemaName: config
                tableName: note_stili
            - columnExists:
                schemaName: config
                tableName: note_stili
                columnName: codice_interno
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameter_fk_surrogate.csv
            tableName: parameter_fk_surrogate
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,            type: NUMERIC }
              - column: { name: code_pattern,  type: STRING }
              - column: { name: match_mode,    type: STRING }
              - column: { name: target_schema, type: STRING }
              - column: { name: target_table,  type: STRING }
              - column: { name: target_column, type: STRING }
              - column: { name: enabled,       type: BOOLEAN }
              - column: { name: note,          type: STRING }
              - column: { name: data_insert,   type: STRING }
              - column: { name: user_insert,   type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,   type: STRING }
