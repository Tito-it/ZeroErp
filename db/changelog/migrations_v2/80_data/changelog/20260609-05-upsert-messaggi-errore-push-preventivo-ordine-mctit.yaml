# Aggiunge a config.messaggi_errore i codici per il push preventivo->ordine
# (brief-preventivi-ordini.md D8), usati da vendite.fn_push_preventivo_a_ordine
# (20260609-06):
#   E_VENDITA_PREVENTIVO_PUSH_STATO_NON_AMMESSO (id=480) — preventivo non ACCETTATO
#   E_VENDITA_PREVENTIVO_NESSUNA_RIGA_ORDINE     (id=481) — nessuna riga merce residua
#
# Pattern simmetrico agli altri upsert-messaggi-errore (es. 20260609-01).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260609-05-upsert-messaggi-errore-push-preventivo-ordine-mctit.yaml

  - changeSet:
      id: 20260609-05-upsert-messaggi-errore-push-preventivo-ordine
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registra E_VENDITA_PREVENTIVO_PUSH_STATO_NON_AMMESSO (480) e
        E_VENDITA_PREVENTIVO_NESSUNA_RIGA_ORDINE (481), usati dal guard di
        vendite.fn_push_preventivo_a_ordine.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: codice,    type: STRING }
              - column: { name: lingua,    type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: id,        type: NUMERIC }
              - column: { name: causa,     type: STRING }
              - column: { name: soluzione, type: STRING }
