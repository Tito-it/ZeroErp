databaseChangeLog:
  - changeSet:
      id: 20250718-02-upsert-codici_postali
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: codici_postali
            schemaName: config
      changes:
      

      # 2) Carico CSV: mappa geoloc -> geoloc_txt come STRING          
      - loadUpdateData:
          relativeToChangelogFile: true
          file: ../sql/config/codici_postali.csv
          tableName: codici_postali
          schemaName: config
          separator: ","
          encoding: UTF-8
          primaryKey:
            - id
          columns:
            - column: { name: id,            type: STRING }
            - column: { name: codice,   type: STRING }
            - column: { name: comune_id,   type: STRING }
            - column: { name: regione_id,   type: STRING }
            - column: { name: data_insert,   type: STRING }
            - column: { name: user_insert,   type: STRING }
            - column:
                    name: data_update
                    type: STRING
                    defaultValue: "NOW()"
            
  - changeSet:
      id: 20250718-90-upsert-codici_postali
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250718-04-upsert-codici_postali