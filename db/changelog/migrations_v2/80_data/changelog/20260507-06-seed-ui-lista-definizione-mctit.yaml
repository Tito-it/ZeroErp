# Seed ui.lista_definizione — catalogo delle liste configurabili.
# Prima riga: 'anagrafiche.clienti' con sorgente vw_clienti_lista.
# runOnChange: aggiungere nuove liste al CSV e Liquibase le applica.
# ⛔ UNA TABELLA, UN CSV (Tid, 2026-09-18): una colonna nuova di questa tabella
#   si dichiara aggiungendola QUI (CSV + elenco `columns` qui sotto), come per
#   `multi_emittente` (18-08) e `perimetro_emittente` (18-09). Un CSV laterale
#   «per sottoinsieme» chiavato su `codice` e' una seconda sorgente di verita'
#   sulla stessa riga, e diverge in silenzio: e' il pattern con cui era nato
#   `perimetro_emittente` (20260902-02), ritirato lo stesso giorno in cui e'
#   servito per davvero.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260507-06-seed-ui-lista-definizione-mctit.yaml

  - changeSet:
      id: 20260507-06-seed-ui-lista-definizione
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: ui
            tableName: lista_definizione
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/ui/lista_definizione.csv
            tableName: lista_definizione
            schemaName: ui
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,          type: NUMERIC }
              - column: { name: codice,       type: STRING }
              - column: { name: descrizione,  type: STRING }
              - column: { name: schema_dati,  type: STRING }
              - column: { name: vista_sql,    type: STRING }
              - column: { name: attivo,       type: BOOLEAN }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              # P-2b (2026-08-18): il flag si dichiara QUI e solo qui — mai da
              # interfaccia. Presidiato dal trigger
              # trg_ui_lista_definizione_a10_guard_multi_emittente_ins_upd, che
              # ammette la scrittura solo dal proprietario della tabella (il migrate).
              - column: { name: multi_emittente, type: BOOLEAN }
              # Il TERZO CASO (2026-09-02, colonna da 20260902-01): la natura del
              # dato — le righe di questa lista appartengono a un emittente? —
              # `false` sui cataloghi globali. ⭐ Dal 2026-09-18 si dichiara QUI,
              # nella riga della lista, e non piu' in un CSV laterale chiavato su
              # `codice` (`lista_definizione_perimetro_emittente.csv`, changeSet
              # 20260902-02, ritirati): due CSV sulla stessa tabella sono due
              # sorgenti di verita', e divergono in silenzio — decisione di Tid,
              # brief-db-perimetro-emittente-cataloghi-globali. Sette liste a
              # `f`; tutte le altre `t`, che e' il default della colonna.
              - column: { name: perimetro_emittente, type: BOOLEAN }
              # La soglia della ricerca libera (2026-09-25, colonna da
              # 20260925-75): quanti caratteri servono perche' il termine
              # filtri. `1` sulle quattordici liste di configurazione a codici
              # corti (decisione di Tid del 2026-09-23), `3` — la soglia di
              # progetto, default della colonna — su tutte le altre. Sede unica:
              # la leggono il risolutore delle liste e il BB di ricerca del BE.
              # Brief: brief-db-be-fe-ricerca-soglia-per-lista, sezione 4.2.
              - column: { name: ricerca_min_caratteri, type: NUMERIC }
