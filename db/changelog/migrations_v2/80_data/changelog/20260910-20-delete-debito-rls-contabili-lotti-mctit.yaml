# C-3 — Il DEBITO PAGATO esce dal registro.
#   Brief: brief-db-perimetro-emittente-righe-documento.md §11.10
#   Slice 20260910-18..20, ultimo pezzo.
#
# ── ⭐ QUESTA RIGA NON ERA UN ARRETRATO: ERA UNA DOMANDA ──────────────
#   Le altre righe del registro dicono «manca un adattatore», «manca
#   l'armamento», «va con il cantiere X». Questa diceva un'altra cosa: *«due
#   perimetri diversi sulla stessa riga, va deciso quale comanda»*. ⇒ Esce dal
#   registro non perche' e' stato scritto del codice, ma perche' e' stata presa
#   una **decisione** — quella del 2026-09-10, scritta in 20260910-18.
#   ⚠️ E' il caso che dimostra a cosa serve la colonna `ragione`: una riga con
#   scritto «cantiere suo» e una con scritto «manca una decisione» chiedono a
#   chi legge due cose molto diverse.
#
# ── ⛔ PERCHE' UNA `DELETE` E NON SOLO LA RIGA TOLTA DAL CSV ──────────
#   `loadUpdateData` aggiorna e inserisce, **non cancella**. Le due cose vanno
#   insieme — il CSV perche' un database ricostruito da zero non la crei, questa
#   `DELETE` perche' dove c'e' gia' se ne vada. Senza, la riga esce come
#   `DEBITO_ESTINTO` e il test 2 di
#   `db/pgtap/rls/test-rls-perimetro-scoperto.sql` diventa rosso.
#
# ⚠️ La guardia sull'`id` E sulle coordinate della tabella: cancellare per solo
#   `id` sarebbe scommettere che nessuno abbia riusato quel numero.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260910-20-delete-debito-rls-contabili-lotti-mctit.yaml

  - changeSet:
      id: 20260910-20-delete-debito-rls-contabili-lotti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Toglie dal registro del debito la riga di
        pagamenti.vendite_contabili_lotti, armata dalla slice 20260910-18..19.
        Era l'unica riga che dichiarava una DECISIONE mancante e non un lavoro
        da fare: esce perche' la decisione e' stata presa.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: dbops
            tableName: rls_perimetro_debito
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Si cancella per id E per coordinate: sul solo id si
              --   scommetterebbe che nessuno abbia riusato quel numero.
              DELETE FROM dbops.rls_perimetro_debito d
               WHERE d.id             = 71
                 AND d.criterio       = 'FIGLIA_DI_TABELLA_PROTETTA'
                 AND d.schema_tabella = 'pagamenti'
                 AND d.nome_tabella   = 'vendite_contabili_lotti';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Rimette in piedi una domanda a cui e' gia' stata data una
              --   risposta. Ha senso solo insieme al rollback di 20260910-19,
              --   che disarma la tabella.
              INSERT INTO dbops.rls_perimetro_debito
                  (id, criterio, schema_tabella, nome_tabella, ragione, data_registrazione)
              VALUES (71, 'FIGLIA_DI_TABELLA_PROTETTA', 'pagamenti', 'vendite_contabili_lotti',
                      'Ripristino di rollback: ponte fra pagamenti.vendite_contabili e vendite.fatturazione_lotti con due perimetri diversi, in attesa della decisione su quale comandi.',
                      DATE '2026-09-09');
