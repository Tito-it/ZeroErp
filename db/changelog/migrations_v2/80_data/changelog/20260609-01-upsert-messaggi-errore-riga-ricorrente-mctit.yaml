# ------------------------------------------------------------
# Aggiunge a config.messaggi_errore il codice NUOVO per il blocco della natura
# ricorrente sul preventivo (MODALITA' A, brief-preventivi-ordini.md D9):
#   E_VENDITA_RIGA_RICORRENTE_USA_OFFERTA (id=479)
#
# Usato da:
#   - vendite.trgfn_preventivi_righe_set_natura_vendita (20260609-02): guard
#     fail-fast all'inserimento riga, se la natura dell'articolo ha
#     destinazione_tipo = 'CONTRATTO' (oggi SERVIZIO_RICORRENTE).
#
# La ricorrenza viaggia solo su offerta->contratto: un articolo ricorrente non
# puo' entrare in una riga di preventivo. Pattern simmetrico agli altri
# upsert-messaggi-errore (es. 20260608-13).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260609-01-upsert-messaggi-errore-riga-ricorrente-mctit.yaml

  - changeSet:
      id: 20260609-01-upsert-messaggi-errore-riga-ricorrente
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registra E_VENDITA_RIGA_RICORRENTE_USA_OFFERTA (id=479): un articolo a
        natura CONTRATTO (ricorrenza) non puo' essere inserito su un preventivo.
        Usato dal guard di vendite.trgfn_preventivi_righe_set_natura_vendita.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: codice,    type: STRING }
              - column: { name: lingua,    type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: id,        type: NUMERIC }
              - column: { name: causa,     type: STRING }
              - column: { name: soluzione, type: STRING }
