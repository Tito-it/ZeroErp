databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20251115-05-upsert-config-assets-ownership-table.yaml

  - changeSet:
      id: 20251115-05-upsert-config-assets-ownership-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: assets_ownership
      changes:
        # Upsert dei dati nella tabella assets_ownership
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/assets_ownership.csv
            tableName: assets_ownership
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }

              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
