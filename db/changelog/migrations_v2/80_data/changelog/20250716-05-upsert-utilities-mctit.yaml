# db/changelog/migrations/80_data/changelogs/20250716-05-upsert-utilities-with-cd_int_utility.yaml
databaseChangeLog:
  - changeSet:
      id: 20250716-05-upsert-utilities
      author: mctit
      # runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: utilities
      changes:
        # 1) Disabilita tutti i trigger sulla tabella
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              ALTER TABLE config.utilities DISABLE TRIGGER trg_utilities_a10_lock_columns_upd;

        # 2) Upsert di tutte le colonne, incluso cd_int_utility
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/utilities.csv
            tableName: utilities
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            # elenco esplicito di TUTTE le colonne,
            # inclusa cd_int_utility per l'INSERT
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }

              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }

        # 3) Ri‐abilita tutti i trigger
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              ALTER TABLE config.utilities ENABLE TRIGGER trg_utilities_a10_lock_columns_upd;

  - changeSet:
      id: 20250716-90-upsert-utilities
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250716-05-upsert-utilities
