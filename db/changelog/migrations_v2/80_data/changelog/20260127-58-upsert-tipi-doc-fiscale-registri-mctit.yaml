# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260127-08-upsert-tipi-doc-fiscale-registri
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: tipi_doc_fiscale_registri
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/tipi_doc_fiscale_registri.csv
            tableName: tipi_doc_fiscale_registri
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: tipo_doc_fiscale_id, type: STRING }
              - column: { name: registro_id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
