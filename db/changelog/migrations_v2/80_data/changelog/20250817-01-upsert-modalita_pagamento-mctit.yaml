databaseChangeLog:
  - changeSet:
      id: 20250817-01-upsert-modalita_pagamento
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: modalita_pagamento
      changes:
        # Upsert dei dati nella tabella modalita_pagamento
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/modalita_pagamento.csv
            tableName: modalita_pagamento
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: codice,    type: STRING }
              - column: { name: descrizione,  type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              

  - changeSet:
      id: 20250817-90-upsert-modalita_pagamento
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250817-01-upsert-modalita_pagamento
