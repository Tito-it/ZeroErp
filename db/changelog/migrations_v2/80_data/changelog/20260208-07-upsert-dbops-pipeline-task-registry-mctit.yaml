databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260208-07-upsert-dbops-pipeline-task-registry-mctit.yaml

  - changeSet:
      id: 20260208-07-upsert-dbops-pipeline-task-registry
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: pipeline_task_registry
      comment: "Upsert tabella dbops.pipeline_task_registry"
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/pipeline_task_registry.csv
            tableName: pipeline_task_registry
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: dominio_id, type: NUMERIC }
              - column: { name: task_code, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
