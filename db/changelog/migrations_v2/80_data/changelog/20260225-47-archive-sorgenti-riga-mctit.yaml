databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260225-47-archive-sorgenti-riga-mctit.yaml

  - changeSet:
      id: 20260225-47-archive-sorgenti-riga
      author: mctit
      comment: "Archivia sorgenti RIGA legacy: elimina branch_policy figli e disattiva i 5 record."
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Archiviare le 5 sorgenti RIGA (legacy, fuori scope
              --   commessa-v2) impostando attivo=false.
              --
              -- Pre-requisito:
              --   Eliminare le righe branch_policy figlie per evitare
              --   il blocco del trigger trgfn_prevent_deactivate_if_children.
              -- =========================================================

              -- Rimuove branch_policy RIGA (sblocca prevent_deactivate)
              DELETE FROM vendite.attivita_fatturabili_sorgenti_branch_policy
               WHERE sorgente_tipo_id IN (3, 5, 7, 9, 11);

              -- Disattiva sorgenti RIGA
              UPDATE config.sorgenti
                 SET attivo = false,
                     meta = COALESCE(meta, '{}'::jsonb)
                       || jsonb_build_object(
                            'archived', true,
                            'archived_at', now()::text,
                            'archived_reason', 'Sorgenti RIGA legacy fuori scope commessa-v2'
                          ),
                     data_update = now(),
                     user_update = current_user
               WHERE id IN (3, 5, 7, 9, 11);
