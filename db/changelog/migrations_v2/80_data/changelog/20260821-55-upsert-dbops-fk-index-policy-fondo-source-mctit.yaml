# Opt-in dbops.fk_index_policy per la FK del legame riga -> atto (lotto 3)
#   pagamenti.vendite_contabili_righe.fondo_source_id -> changeSet 20260821-48
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.1 S1-14, §1.4 C-7
#
# ── PERCHE' LA RIGA ESISTE ─────────────────────────────────────────────
#   La policy e' **OPT-IN**: `fn_populate_fk_index_policy()` registra le FK
#   nuove a `consentito = false`, quindi senza questo seed l'indice non nasce.
#   E la riga va scritta comunque, anche quando la risposta e' no: una FK
#   senza riga di policy e' una FK che nessuno ha deciso.
#
# ── ✅ QUI E' UN SI', E PARZIALE ───────────────────────────────────────
#   La colonna e' **nullabile e quasi sempre nulla**: la porta solo la riga
#   contabile che nasce da un fondo fattura, che sara' una minoranza delle
#   righe (le altre arrivano da incassi veri). Su una FK nullabile,
#   `WHERE <colonna> IS NOT NULL` e' preferibile all'indice totale
#   (linee-guida-sql §8.4): il controllo referenziale esegue
#   `WHERE fkcol = $1` con `$1` mai nullo, il planner lo dimostra e usa
#   l'indice parziale — molto piu' piccolo, perche' non indicizza righe che
#   nessuno cerchera' mai. `dbops.vw_fk_senza_indice` riconosce questo caso e
#   considera la FK coperta.
#
#   ⚠️ **Ogni altro predicato no**: un parziale con, per dire,
#   `WHERE meta->>'origine' = 'FONDO_FATTURA'` NON coprirebbe la FK, perche'
#   il controllo referenziale deve poter trovare qualsiasi riga figlia.
#
#   ⭐ E serve per davvero, non per completezza: **tutti e tre** i lettori del
#   legame interrogano proprio questa colonna —
#   `fn_sync_contabili_fondo_fattura` (la riga di QUESTO atto),
#   `fn_saldo_sorgente_fondo` (la quota propria da scorporare) e
#   `fn_reset_fondi_fattura` (le righe da cancellare, e quelle che bloccano).
#   Il reset ci passa dentro `= ANY(array)`.
#
# ── ⚠️ `dll_command` VA SEMPRE VALORIZZATO ─────────────────────────────
#   `chk_fk_index_policy_dll_command_forma` impone la forma
#   `CREATE INDEX IF NOT EXISTS <nome> ON …` su OGNI riga, `consentito = false`
#   compreso: una cella vuota fa fallire il migrate. E non e' pedanteria — con
#   `consentito = false` la procedura ne estrae il NOME ed esegue il DROP su
#   quello.
#
# ⛔ Creazione e rimozione restano delegate a `dbops.apply_fk_index_policy()`
#    in `90_end`: mai un CREATE INDEX o un DROP INDEX a mano su un indice
#    governato dalla policy — un DROP senza flag verrebbe annullato al primo
#    migrate successivo, perche' la procedura gira `runAlways`.
#
# Pattern simmetrico a 20260818-46 (nota di credito) e 20260726-02 (rinunce).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260821-55-upsert-dbops-fk-index-policy-fondo-source-mctit.yaml

  - changeSet:
      id: 20260821-55-upsert-dbops-fk-index-policy-fondo-source
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Opt-in della policy indici FK per fk_vendite_contabili_righe_fondo_source, la FK del
        legame riga contabile -> atto di fondo fattura creata dal changeSet 20260821-48. SI'
        e PARZIALE (WHERE fondo_source_id IS NOT NULL): la colonna e' nullabile e quasi
        sempre nulla, e su una FK nullabile il parziale copre il controllo referenziale
        restando molto piu' piccolo. Serve per davvero: tutti e tre i lettori del legame
        interrogano questa colonna. Creazione delegata ad apply_fk_index_policy() in 90_end.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili_righe
                columnName: fondo_source_id
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/fk_index_policy_fondo_source.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
