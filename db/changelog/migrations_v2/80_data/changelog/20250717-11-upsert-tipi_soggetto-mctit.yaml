databaseChangeLog:
  - changeSet:
      id: 20250717-11-upsert-tipi_soggetto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_soggetto
        # 2) Upsert di tutte le colonne
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_soggetto.csv
            tableName: tipi_soggetto
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: id
            #
            columns:
              - column: { name: id, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: natura_soggetto, type: STRING }

  - changeSet:
      id: 20250717-90-upsert-tipi_soggetto
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250717-11-upsert-tipi_soggetto
