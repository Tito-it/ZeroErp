# ------------------------------------------------------------
# SPDX-License-Identifier: AGPL-3.0-or-later
# Liquibase changelog per Zero ERP
#
# ⭐ REV 2026-11-13 — via `user_insert` e `user_update` (brief-db-token-null-dei-seed
#   D2, la forma di magazzino.causali). In 13 righe `user_update` era vuota e
#   arrivava come stringa vuota; la tabella non ha trigger di audit, quindi
#   restava ''. Le due colonne escono dal CSV e da `columns:`, e vale il default
#   della tabella (linee-guida-sql §7: tutte e due sono gia' NOT NULL DEFAULT
#   CURRENT_USER). La conversione delle righe gia' scritte sta in
#   90_end/20261112-56.
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260218-05-upsert-fatturazione-pipeline-task-policy
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: fatturazione_pipeline_task_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fatturazione_pipeline_task_policy.csv
            tableName: fatturazione_pipeline_task_policy
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: pipeline_id, type: STRING }
              - column: { name: task_code, type: STRING }
              - column: { name: annullabile, type: BOOLEAN }
              - column: { name: resume_mode, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"

