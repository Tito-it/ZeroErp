# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260218-05-upsert-fatturazione-pipeline-task-policy
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: fatturazione_pipeline_task_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fatturazione_pipeline_task_policy.csv
            tableName: fatturazione_pipeline_task_policy
            schemaName: vendite
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: pipeline_id, type: STRING }
              - column: { name: task_code, type: STRING }
              - column: { name: annullabile, type: BOOLEAN }
              - column: { name: resume_mode, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }

