#
# Aggiunge a config.messaggi_errore i codici per l'emittente
# fiscale su ordini:
#   E_ORDINE_EMITTENTE_NON_RISOLTO   (id=467)
#   E_ORDINE_EMITTENTE_BA_INCOERENTE (id=468)
#
# Usati da:
#   - vendite.trgfn_ordini_default_emittente   (20260601-21)
#   - vendite.trgfn_ordini_guard_emittente_ba  (20260601-22)
# Pattern simmetrico a 20260526-06 (contratti).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260601-20-upsert-messaggi-errore-ordini-emittente-mctit.yaml

  - changeSet:
      id: 20260601-20-upsert-messaggi-errore-ordini-emittente
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: codice,    type: STRING }
              - column: { name: lingua,    type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: id,        type: NUMERIC }
              - column: { name: causa,     type: STRING }
              - column: { name: soluzione, type: STRING }
