# Seed binding pratiche.template_flussi_handler_eventi: l'azione di
# completamento ACCETTA_PREVENTIVO (handler 9002) scatta sui due step
# APPROVAZIONE_CLIENTE delle pratiche PREVENTIVI:
#   template 9003 (tipo PREVENTIVI_IMMEDIATA) e 9007 (PREVENTIVI_DIFFERITA),
#   evento = COMPLETATO, esito_richiesto = POSITIVO.
# NB: APPROVAZIONE_CLIENTE = 9003/9007 (gli step 9002/9006 sono
# PREVENTIVAZIONE -> azione UI APRI_PREVENTIVO, altro concern).
# I binding di offerta/contratto/ordini/commesse si aggiungeranno qui
# (nuove righe) quando nasceranno i relativi flussi: zero schema-change.
# FK: richiede handler_flussi (08) e template_flussi (esistenti) -> NN 08 < 09.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260615-09-seed-template-flussi-handler-eventi-preventivo-mctit.yaml

  - changeSet:
      id: 20260615-09-seed-template-flussi-handler-eventi-preventivo
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: pratiche
            tableName: template_flussi_handler_eventi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/template_flussi_handler_eventi.csv
            tableName: template_flussi_handler_eventi
            schemaName: pratiche
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: template_flusso_id, type: NUMERIC }
              - column: { name: evento, type: STRING }
              - column: { name: esito_richiesto, type: STRING }
              - column: { name: handler_id, type: NUMERIC }
              - column:
                  name: handler_params
                  type: JSON
                  defaultValue: "{}"
              - column: { name: sequenza, type: NUMERIC }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Allineamento sequenza autoincrement post-seed (max id seed 9002).
              SELECT setval(
                  pg_get_serial_sequence('pratiche.template_flussi_handler_eventi', 'id'),
                  GREATEST(COALESCE(MAX(id), 1), 1),
                  true
              ) FROM pratiche.template_flussi_handler_eventi;
      rollback:
        - sql:
            sql: |
              DELETE FROM pratiche.template_flussi_handler_eventi
               WHERE handler_id = 9002
                 AND template_flusso_id IN (9003, 9007);
