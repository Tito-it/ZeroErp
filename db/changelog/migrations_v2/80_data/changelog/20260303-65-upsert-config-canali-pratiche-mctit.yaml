databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260303-65-upsert-config-canali-pratiche-mctit.yaml

  - changeSet:
      id: 20260303-65-upsert-config-canali-pratiche
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: canali_pratiche
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/canali_pratiche.csv
            tableName: canali_pratiche
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }
