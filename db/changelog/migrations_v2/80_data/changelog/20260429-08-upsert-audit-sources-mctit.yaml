# Loader CSV per dbops.audit_sources (Fase 5 P1 2026-04-29).
#
# Pattern coerente con 20250715-01-upsert_parameters: runOnChange
# rileva la modifica del CSV (aggiunta/rimozione/edit di righe) e
# riapplica via loadUpdateData con primaryKey:id.
#
# Per aggiungere una nuova storico audit-abile:
#   1. ALTER (se necessario) la tabella sorgente con storicizza/tx_id
#   2. dbops.fn_run_automations(... STORICO ...) -> crea storico.<table>
#   3. Append riga in 80_data/sql/dbops/audit_sources.csv
# Nessun cambio di schema richiesto.
#
# Rev 2026-11-07 (brief-db-revisione-dbops, giro 7, D37): via le quattro colonne
# di tracciamento, tolte dalla tabella da 00_schema/dbops/20261108-25 e dal CSV.
# Il mirror (runOnChange + ANY) rigira col CSV cambiato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260429-08-upsert-audit-sources-mctit.yaml

  - changeSet:
      id: 20260429-08-upsert-audit-sources
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY

      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: audit_sources
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/audit_sources.csv
            tableName: audit_sources
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }
              - column: { name: code, type: STRING }
              - column: { name: storico_table, type: STRING }
              - column: { name: storico_pk_col, type: STRING }
              - column: { name: label_key, type: STRING }
              - column: { name: area_funzionale, type: STRING }
              - column: { name: attivo, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              # ⛔ data_update, user_update, tx_id e storicizza non ci sono piu':
              #   le ha tolte 00_schema/dbops/20261108-25 (D37 di
              #   brief-db-revisione-dbops, giro 7). Da zero questo loader gira
              #   DOPO quel DROP: una colonna elencata qui farebbe morire il migrate.
