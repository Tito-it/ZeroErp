# B5/B-PREREQ (seed) — prerequisiti lineari delle due catene PREVENTIVI,
# esito-aware (esito_richiesto='POSITIVO').
# Ogni passo si abilita solo se il precedente e' COMPLETATO con esito
# POSITIVO (consumato da fn_check_prerequisiti_flusso, 20260608-02):
#   PREVENTIVAZIONE      <- RICHIESTA_CLIENTE     (POSITIVO)
#   APPROVAZIONE_CLIENTE <- PREVENTIVAZIONE       (POSITIVO)
#   CONFERMA             <- APPROVAZIONE_CLIENTE  (POSITIVO)
# Cosi' un APPROVAZIONE_CLIENTE chiuso NEGATIVO non abilita la CONFERMA.
# FK: richiede template_flussi (20260608-08) e la colonna esito_richiesto
# (20260608-01) gia' presenti (ordine NN garantito).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260608-09-seed-template-flussi-prerequisiti-preventivi-mctit.yaml

  - changeSet:
      id: 20260608-09-seed-template-flussi-prerequisiti-preventivi
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: pratiche
            tableName: template_flussi_prerequisiti
        - columnExists:
            schemaName: pratiche
            tableName: template_flussi_prerequisiti
            columnName: esito_richiesto
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/template_flussi_prerequisiti.csv
            tableName: template_flussi_prerequisiti
            schemaName: pratiche
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: template_flusso_id, type: NUMERIC }
              - column: { name: prerequisito_id, type: NUMERIC }
              - column: { name: esito_richiesto, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Allineamento sequenza autoincrement post-seed (max id seed 9006).
              SELECT setval(
                  pg_get_serial_sequence('pratiche.template_flussi_prerequisiti', 'id'),
                  GREATEST(COALESCE(MAX(id), 1), 1),
                  true
              ) FROM pratiche.template_flussi_prerequisiti;
      rollback:
        - sql:
            sql: |
              DELETE FROM pratiche.template_flussi_prerequisiti
               WHERE template_flusso_id IN (9002, 9003, 9004, 9006, 9007, 9008);
