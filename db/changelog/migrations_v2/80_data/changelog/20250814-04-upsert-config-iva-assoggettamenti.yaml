#
# ⭐ REV 2026-11-12 — `nullValue: "NULL"` (brief-db-nullvalue-vuoto-cinque-mirror).
#   Con `nullValue: ""` Liquibase scriveva la cella vuota di `note` come stringa
#   vuota: «nessuna nota» aveva due forme, '' dal seed e NULL da chi scrive la
#   riga per altra strada. Per il modello l'assenza e' NULL: nel CSV le celle
#   vuote di `note` portano ora il token `NULL`. Il CHECK che vieta la stringa
#   vuota sta in 90_end/20261112-36, dopo questo mirror.
#
# ⚠️ La sede di config.iva_assoggettamenti e' il CSV
#   `80_data/sql/config/iva_assoggettamenti.csv`: nessun UPDATE su questa tabella.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20250814-04-upsert-iva-assoggettamenti-table.yaml

  - changeSet:
      id: 20250814-04-upsert-iva-assoggettamenti
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: iva_assoggettamenti
      changes:
        # Upsert dei dati nella tabella iva_assoggettamenti
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/iva_assoggettamenti.csv
            tableName: iva_assoggettamenti
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: note, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: storicizza, type: BOOLEAN }
