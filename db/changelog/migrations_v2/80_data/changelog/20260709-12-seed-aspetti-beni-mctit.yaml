# Seed config.aspetti_beni — aspetto esteriore dei beni (brief §7 / §9 PDF).
#
# Il CSV era vuoto (solo header): senza valori il PDF DDT (D-3) non ha l'aspetto
# beni da stampare e ddt.aspetto_bene_id (FK) non ha voci selezionabili.
# Set base IT: SCATOLE, COLLI, PACCHI, BANCALI, PALLET, SFUSO, CARTONI, ROTOLI,
#   BOBINE, FUSTI. Tutte attive.
#
# Primo caricamento (nessun loader preesistente per questa tabella).
# Dipendenza: config.aspetti_beni (tabella gia' esistente, referenziata da
#   vendite.ddt.aspetto_bene_id + trigger require_attivo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260709-12-seed-aspetti-beni-mctit.yaml

  - changeSet:
      id: 20260709-12-seed-aspetti-beni
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: aspetti_beni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/aspetti_beni.csv
            tableName: aspetti_beni
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
