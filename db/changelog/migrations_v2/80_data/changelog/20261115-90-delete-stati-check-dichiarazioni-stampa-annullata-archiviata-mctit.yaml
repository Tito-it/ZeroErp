# PRESIDIO C1: GLI STATI DELLA STAMPA SENZA SCRITTORE SONO USCITI DAL CHECK
#   dbops.stati_check_dichiarazioni dichiarava ANNULLATO e ARCHIVIATO di
#   documenti.documenti_generati.stato come ESENTI: nessun verbo li scriveva,
#   «si scrivono insieme o si tolgono dal CHECK insieme». Il 20261115-85 li toglie
#   dal CHECK (D7, Q6 di Tid del 2026-11-14, brief di revisione di `documenti`):
#   le due righe sarebbero DEBITO_ESTINTO (test-stati-check-scrittori-v1, test 3).
#   Tolte anche dal CSV: il mirror loadUpdateData non cancella.
#   STORAGE_ORPHAN, uscito dal CHECK degli eventi nello stesso changeSet, nel
#   registro non c'era.
#   Da zero il CSV non le porta piu' e il DELETE tocca zero righe.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261115-90-delete-stati-check-dichiarazioni-stampa-annullata-archiviata-mctit.yaml

  - changeSet:
      id: 20261115-90-delete-stati-check-dichiarazioni-stampa-annullata-archiviata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Presidio C1: via da dbops.stati_check_dichiarazioni le due righe di
        documenti.documenti_generati.stato (ANNULLATO, ARCHIVIATO), usciti dal CHECK col
        20261115-85. Tolte anche dal CSV.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: stati_check_dichiarazioni
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DELETE FROM dbops.stati_check_dichiarazioni d
               WHERE (d.schema_tabella, d.nome_tabella, d.colonna) =
                     ('documenti', 'documenti_generati', 'stato')
                 AND d.valore IN ('ANNULLATO', 'ARCHIVIATO');
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Le righe tornano dal CSV di prima (git): i valori nel CHECK li rimette
              -- solo il rollback del 20261115-85.
              SELECT 1;
