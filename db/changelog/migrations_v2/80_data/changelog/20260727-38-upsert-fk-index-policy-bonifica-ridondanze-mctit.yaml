# dbops.fk_index_policy — chiusura della bonifica: 27 righe a false, 2 a true
#   (bonifica indici del 2026-07-27, PASSI C2 e C4)
#
# VENTISETTE A consentito=false (PASSO C2). Sono le FK per cui l'automazione
#   aveva creato un indice dedicato che il changeSet 20260727-37 ha appena
#   droppato, perche' gia' coperto per prefisso da una UNIQUE piu' larga.
#   Senza questa riga il DROP sarebbe carta straccia: CALL
#   dbops.apply_fk_index_policy() gira runAlways in 90_end, cioe' DOPO 80_data
#   nello stesso migrate, e con consentito=true li ricreerebbe tutti.
#   Portandole a false l'automazione diventa il guardiano: se uno di quegli
#   indici riapparisse fuori Liquibase — com'e' successo davvero a
#   ix_vendite_fatture_riepiloghi_iva_fattura_id — al primo giro verrebbe
#   ridroppato da solo.
#
#   Le righe conservano dll_command, generated_by_script, user_insert e
#   data_insert originali: si cambia SOLO il flag. Il comando resta li' apposta
#   — se un domani la UNIQUE coprente sparisse, basta rimettere true e
#   l'indice torna, con lo stesso nome di prima.
#
# DUE A consentito=true (PASSO C4). Sono le uniche FK realmente prive di
#   copertura in tutto l'automation_scope:
#     pratiche.pratiche_sorgenti.fk_pratiche_sorgenti_flusso
#       l'unico indice su flusso_id e' uq_pratiche_sorgenti_flusso_root, il cui
#       predicato contiene ruolo_link = 'ROOT': il controllo referenziale deve
#       poter trovare QUALSIASI riga figlia, anche non-ROOT, quindi non e'
#       coperta.
#     pratiche.sospensioni.fk_sospensioni_pratica
#       stesso schema con uq_sospensioni_attiva_pratica, predicato
#       data_fine IS NULL AND flusso_id IS NULL.
#   Per entrambe oggi ogni DELETE sulla tabella padre fa seq scan sulla figlia.
#   Le righe non esistono ancora in policy: loadUpdateData le INSERISCE.
#   L'indice NON viene creato qui: lo crea apply_fk_index_policy() in 90_end,
#   che e' il solo posto da cui devono nascere gli indici FK. Verificato che
#   i due nomi proposti — ix_pratiche_sorgenti_flusso_id e
#   ix_sospensioni_pratica_id — non collidono con nulla di esistente.
#
# ⚠️ ERANO UNDICI FINO A MEZZ'ORA FA. Il 20260727-22 ne segnalava undici,
#   perche' escludeva ogni indice parziale. Il 20260727-35 ha corretto: un
#   parziale "WHERE colonna IS NOT NULL" COPRE la FK, perche' il controllo
#   referenziale cerca "fkcol = $1" con $1 mai NULL. Nove delle undici erano
#   coperte cosi'. Se fossero finite in questo CSV a true, per due di esse
#   (fk_pratiche_istanza_utility, fk_pratiche_soggetto_ruolo) il nome
#   sintetizzato coincideva ESATTAMENTE con il parziale gia' esistente:
#   IF NOT EXISTS avrebbe reso il comando un no-op, la FK sarebbe rimasta a
#   figurare come scoperta e l'automazione avrebbe ritentato a ogni giro per
#   sempre. Le altre sette avrebbero preso un indice totale accanto a un
#   parziale che gia' bastava.
#
# ORDINE DI APPLICAZIONE nello stesso migrate:
#   20_code  20260727-35  vw_fk_senza_indice riconosce i parziali IS NOT NULL
#   20_code  20260727-36  apply non crea cio' che e' gia' coperto, non droppa vincoli
#   20_code  20260727-37  DROP dei 48 ridondanti
#   80_data  20260727-38  QUESTO: 27 a false, 2 a true
#   90_end   20250626-31  CALL apply -> conferma i drop, crea i 2 indici mancanti
#
# runOnChange + validCheckSums ANY: il CSV e' la fonte viva di queste 29
#   righe, come per gli altri upsert di fk_index_policy.
#
# Dipendenze: dbops.fk_index_policy, e le tabelle citate nel CSV.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260727-38-upsert-fk-index-policy-bonifica-ridondanze-mctit.yaml

  - changeSet:
      id: 20260727-38-upsert-fk-index-policy-bonifica-ridondanze
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Chiude la bonifica indici: 27 righe di dbops.fk_index_policy a
        consentito=false (i loro indici sono stati droppati dal 20260727-37 ed
        erano gia' coperti per prefisso), 2 righe nuove a consentito=true per
        le uniche FK davvero scoperte dell'automation_scope
        (fk_pratiche_sorgenti_flusso, fk_sospensioni_pratica). Gli indici li
        crea apply in 90_end, non questo changeSet.
      preConditions:
        - onFail: HALT
        - onError: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - tableExists:
                schemaName: pratiche
                tableName: pratiche_sorgenti
            - tableExists:
                schemaName: pratiche
                tableName: sospensioni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/fk_index_policy_bonifica_ridondanze.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
