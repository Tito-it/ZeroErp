# Liquibase changelog per Zero ERP
# Seed config.azioni_processo — azioni iniziali vendite/pagamenti
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260228-18-upsert-config-azioni-processo
      logicalFilePath: migrations_v2/80_data/20260228-18-upsert-config-azioni-processo-mctit.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: azioni_processo
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/azioni_processo.csv
            tableName: azioni_processo
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: area_id, type: STRING }
              - column: { name: permission_codename, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: pericolosa, type: BOOLEAN }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              # 2026-10-04 (20261004-50, brief-db-permessi-tetto-area R1): il minimo
              # d'area dell'azione. Colonna in coda al CSV principale (§11.2).
              - column: { name: livello_minimo_area, type: STRING }
