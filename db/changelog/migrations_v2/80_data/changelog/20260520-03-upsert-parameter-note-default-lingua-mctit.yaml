#
# Seed parametro NOTE_DEFAULT_LINGUA in config.parameters.
#
# Contesto: parametro cross-schema per il PartitionedNoteService (backend).
# Fornisce la lingua di default per le note documenti quando l'operatore
# non specifica una lingua esplicita nel drawer.
#
# Design FK-surrogata (linee-guida-sql §6b):
#   - default_value = 'it' (codice_iso di config.lingue, chiave naturale ISO stabile)
#   - NON viene salvato l'id numerico (instabile tra ambienti)
#   - Il trigger config.trgfn_parameters_fk_surrogate_dispatch valida che
#     'it' esista in config.lingue.codice_iso
#   - Il backend risolve: SELECT id FROM config.lingue WHERE codice_iso = <valore_risolto> AND attivo = TRUE
#
# Prerequisiti (garantiti dall'ordine filename in includeAll):
#   20260520-02 — riga NOTE_DEFAULT_LINGUA in config.parameter_fk_surrogate
#   lingue.csv  — 'it' gia' seedato (id=1, sempre presente dal seed iniziale)
#
# CSV DEDICATO (parameters_note_defaults.csv, id=51 e 52):
#   Stesso CSV usato per NOTE_DEFAULT_STILE (id=51). loadUpdateData e' idempotente
#   via primaryKey=id: aggiorna o inserisce entrambe le righe.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260520-03-upsert-parameter-note-default-lingua-mctit.yaml

  - changeSet:
      id: 20260520-03-upsert-parameter-note-default-lingua
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Aggiunge parametro id=52, code='NOTE_DEFAULT_LINGUA', default_value='it'
        a config.parameters. Lingua cross-schema per note documenti.
        default_value='it' e' il codice_iso di config.lingue:
        il trigger FK-surrogata valida l'esistenza (20260520-02 registra il pattern).
        Il backend risolve codice_iso -> id a runtime.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameters
            - tableExists:
                schemaName: config
                tableName: parameter_fk_surrogate
            - tableExists:
                schemaName: config
                tableName: lingue
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters_note_defaults.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,           type: NUMERIC }
              - column: { name: code,          type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description,   type: STRING }
              - column: { name: data_insert,   type: STRING }
              - column: { name: user_insert,   type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,   type: STRING }
              - column: { name: tx_id,         type: uuid }
              - column: { name: storicizza,    type: BOOLEAN }
