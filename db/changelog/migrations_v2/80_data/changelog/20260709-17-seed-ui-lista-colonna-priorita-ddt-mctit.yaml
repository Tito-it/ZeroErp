# Read-side DDT (brief §13) — priorita (peso ritiro dinamico) per le colonne
# della lista vendite.ddt (lista_id risolto da codice 'vendite.ddt').
#
# Stesso meccanismo dei seed ordini/preventivi/offerte (20260603-15/07/08):
# priorita nasce con DEFAULT 50 (20260602-13) e qui si impostano i pesi di dominio.
#
# ⚠️ RETTIFICA 2026-07-30 — il testo originale diceva che «la colonna priorita
# NON vive nel CSV lista_colonna.csv (il loader 20260507-07 non la espone)» e che
# «il re-run del loader NON tocca priorita». Era vero quando questo file e' stato
# scritto; NON lo e' piu'. Il loader 20260507-07 espone tutte e 24 le colonne,
# priorita compresa, e lista_colonna.csv ne porta i valori di dominio (verificato:
# per vendite.ddt il CSV ha 100/95/90... allineati a quanto c'e' nel DB).
# Conseguenze:
#   - questo changeSet e' oggi RIDONDANTE ma idempotente: scrive gli stessi valori
#     che il loader carica. Non fa danno e non va rimosso a cuor leggero, perche'
#     resta il presidio se il CSV tornasse a 50;
#   - per una lista NUOVA non serve un changeSet come questo: basta l'append a
#     lista_colonna.csv con priorita valorizzata, che il loader runOnChange
#     ripesca. Vedi piano-migrazione-primevue-5.md
#     §8-bis.
#
# Definizione lista + colonne: append a
#   80_data/sql/ui/lista_definizione.csv (riga 8 vendite.ddt -> vw_ddt_lista) e
#   80_data/sql/ui/lista_colonna.csv (colonne id 128..146), ripescati dai loader
#   runOnChange esistenti (20260507-06/07).
#
# Asse priorita (piu' alto = resiste di piu' al ritiro responsive):
#   numero/azioni (100), destinatario (95), stato (90), causale (70), ordine di
#   origine (65), data (60), id_fiscale (55), tracking (50), colli (40), vettore
#   (35), ba_codice (30), aspetto (25), peso_lordo (20), valuta (15), mittente
#   (12), anno/serie/peso_netto (10), audit (5).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260709-17-seed-ui-lista-colonna-priorita-ddt-mctit.yaml

  - changeSet:
      id: 20260709-17-seed-ui-lista-colonna-priorita-ddt
      author: mctit
      # ⚠️ Era `true`, spento il 2026-08-06. Questo UPDATE scrive `priorita` su
      #   ui.lista_colonna, che e' una tabella con mirror CSV: due sorgenti per lo
      #   stesso dato. Verificato riga per riga che il CSV dichiara GIA' gli stessi
      #   valori (zero divergenze sulle sei liste), quindi qui non si decide piu'
      #   niente. Restando `true` rigirava a ogni invocazione di liquibase, e in CI
      #   sono due: la seconda passata riscriveva SOPRA il loader.
      #   La priorita' delle colonne si cambia SOLO da 80_data/sql/ui/lista_colonna.csv.
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Imposta priorita (peso ritiro dinamico) per le colonne della lista
        vendite.ddt (brief §13). Mirror del seed priorita ordini (20260603-15).
      preConditions:
        - onFail: HALT
        - and:
          - columnExists:
              schemaName: ui
              tableName: lista_colonna
              columnName: priorita
          - sqlCheck:
              expectedResult: "1"
              sql: SELECT COUNT(*) FROM ui.lista_definizione WHERE codice = 'vendite.ddt'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE ui.lista_colonna lc
                 SET priorita = v.priorita
                FROM (
                  VALUES
                    ('numero',                     100),
                    ('destinatario_denominazione',  95),
                    ('stato',                        90),
                    ('causale_trasporto',            70),
                    ('ordine_origine_numero',        65),
                    ('data',                         60),
                    ('id_fiscale',                   55),
                    ('tracking_code',                50),
                    ('num_colli',                    40),
                    ('vettore_denominazione',        35),
                    ('ba_codice',                    30),
                    ('aspetto_bene',                 25),
                    ('peso_lordo',                   20),
                    ('valuta',                       15),
                    ('mittente_denominazione',       12),
                    ('anno',                         10),
                    ('serie',                        10),
                    ('peso_netto',                   10),
                    ('data_insert',                   5),
                    ('azioni',                      100)
                ) AS v(codice, priorita)
               WHERE lc.codice = v.codice
                 AND lc.lista_id = (
                       SELECT id FROM ui.lista_definizione WHERE codice = 'vendite.ddt'
                     );
