# Registro indici FK per fk_offerte_commerciali_revisione_radice (00_schema
# 20260927-06): consentito = true.
#   La catena delle revisioni si legge PER radice — il tab «Revisioni» filtra
#   `revisione_radice_id = <radice>` — e nessun indice esistente la copre per
#   prefisso. L'indice lo crea apply_fk_index_policy() in 90_end, mai a mano
#   (linee-guida-sql §8.7).
#   Brief: brief-db-liste-datatable-grezze.md §3.2.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260927-08-upsert-fk-index-policy-revisione-radice-mctit.yaml

  - changeSet:
      id: 20260927-08-upsert-fk-index-policy-revisione-radice
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_offerte_commerciali_revisione_radice a consentito=true: il tab
        Revisioni dell'offerta legge la catena per radice. Brief: brief-db-liste-datatable-grezze §3.2.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: fk_index_policy
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_revisione_radice.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE constraint_name = 'fk_offerte_commerciali_revisione_radice';
