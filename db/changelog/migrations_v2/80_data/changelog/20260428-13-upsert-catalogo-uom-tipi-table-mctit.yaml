# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260428-13-upsert-catalogo-uom-tipi-table-mctit.yaml

  - changeSet:
      id: 20260428-13-upsert-catalogo-uom-tipi-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: catalogo
            tableName: uom_tipi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/catalogo/uom_tipi.csv
            tableName: uom_tipi
            schemaName: catalogo
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: codice_interno, type: STRING }

              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_update, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
