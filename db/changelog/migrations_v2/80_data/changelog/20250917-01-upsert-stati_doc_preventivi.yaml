databaseChangeLog:
    - changeSet:
          id: 20250917-01-upsert-stati_doc_preventivi
          author: mctit
          runOnChange: true
          validCheckSums:
              - ANY
          failOnError: true
          preConditions:
              - onFail: HALT
              - tableExists:
                    schemaName: config
                    tableName: stati_doc_preventivi
          changes:
              # Upsert dei dati nella tabella tipi_indirizzi
              - loadUpdateData:
                    relativeToChangelogFile: true
                    file: ../sql/config/stati_doc_preventivi.csv
                    tableName: stati_doc_preventivi
                    schemaName: config
                    separator: ","
                    encoding: UTF-8
                    primaryKey: "id"
                    columns:
                        - column: { name: id, type: STRING }
                        - column: { name: codice, type: STRING }
                        - column: { name: descrizione, type: STRING }
                        - column: { name: attivo, type: BOOLEAN }
                        - column: { name: ordine, type: STRING }
                        - column:
                              name: meta
                              type: JSON
                              # se il CSV ha valore vuoto, usa {} come JSON valido
                              defaultValue: "{}"
                        - column: { name: codice_interno, type: STRING }
                        - column: { name: data_insert, type: STRING }
                        - column: { name: user_insert, type: STRING }
                        - column:
                              name: data_update
                              type: STRING
                              defaultValue: "NOW()"
                        - column: { name: user_update, type: STRING }
                        # 2026-07-11: bottone PDF data-driven via capabilities
                        - column: { name: pdf_mode, type: STRING }
                        - column: { name: pdf_allow_allegati, type: BOOLEAN }
                        # 2026-10-24 (20261024-07, brief-modello-documento-vendita P-1): lo stato in cui
                        # un documento nasce. Va dichiarata qui, o la cella del CSV non la governa.
                        - column: { name: iniziale, type: BOOLEAN }
                        # 2026-10-25 (20261025-37, brief-modello-documento-vendita §8): lo stato di
                        # emissione. Va dichiarata qui, o la cella del CSV non la governa.
                        - column: { name: emissione, type: BOOLEAN }
                        # 2026-10-31 (20261031-05, brief-modello-documento-vendita §17): lo stato di
                        # accettazione del cliente. Va dichiarata qui, o la cella del CSV non la governa.
                        - column: { name: accettazione, type: BOOLEAN }
                        # 2026-10-31 (20261031-60, brief-db-scadenza-preventivi §8.1): lo stato di
                        # scadenza, quello che scrive il job delle scadenze. Va dichiarata qui, o la
                        # cella del CSV non la governa.
                        - column: { name: scadenza, type: BOOLEAN }
                        # 2026-11-13 (20261112-59, brief-db-stati-documento-dal-vocabolario giro 2): lo
                        # stato di rifiuto del cliente. Va dichiarata qui, o la cella del CSV non la governa.
                        - column: { name: rifiuto, type: BOOLEAN }

    - changeSet:
          id: 20250917-90-upsert-stati_doc_preventivi
          author: mctit
          changes:
              - tagDatabase:
                    tag: 220250917-01-upsert-stati_doc_preventivi
