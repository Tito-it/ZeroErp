# D14 (quarta leva, giro 1) — le DUE FK che la chiusura attraversa e che
#   non hanno indice: brief-db-partita-merce-per-documento §2-bis.4.
#
# -- PERCHE' PROPRIO QUESTE DUE ------------------------------------------------
#   fn_partite_merce (20260921-21) risale dalle righe di un documento alle
#   ri-consegne che le riguardano in due verbi:
#   · «di quali righe sono ORIGINE le ri-consegne?» → resi_righe(ddt_riga_id):
#     e' la CTE `origini` (O) e il ramo ristretto di `riconsegne_in`;
#   · «questa riga E' una ri-consegna?» → resi_righe_riconsegne(ddt_riga_id):
#     e' l'EXISTS di `riga` (e_riconsegna), valutato per riga della chiusura.
#   Senza indice entrambe sono una scansione intera di resi_righe /
#   resi_righe_riconsegne PER OGNI lettura ristretta — cioe' proprio il
#   costo che la chiusura era nata per togliere, spostato di tabella. Le
#   altre chiavi del cammino sono gia' servite per prefisso
#   (uq_ddt_vendita_r_riga_nr, uq_ordini_r_ful_v_pair).
#
# -- LA POLICY E' OPT-IN ------------------------------------------------------
#   Le due FK sono in dbops.fk_index_policy su dev a consentito=false,
#   registrate dal job di popolamento (user_insert postgres, 2026-07-19), non
#   dal CSV. Qui si mette per iscritto il TRUE: l'indice lo crea
#   apply_fk_index_policy() (90_end, runAlways), col nome canonico che il
#   registro gia' porta. Mai a mano (linee-guida-sql §8).
#
# -- CSV DEDICATO, come 20260913-12, 20260914-17 e 20260921-13 ----------------
#   fk_index_policy.csv e' un mirror di gennaio, dormiente: svegliarlo
#   rilegge 350 righe. La riga di deroga alla regola «una tabella, un CSV» e'
#   scritta la' e questo file la eredita.
#
# -- ORDINE ---------------------------------------------------------------------
#   80_data gira PRIMA di 90_end: le righe entrano, la procedura le incontra
#   alla passata dopo, quando le FK ci sono. Su dev il primo migrate le crea.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260921-25-upsert-fk-index-policy-partite-merce-mctit.yaml

  - changeSet:
      id: 20260921-25-upsert-fk-index-policy-partite-merce
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D14 quarta leva: consentito=true per fk_resi_righe_ddt_riga e
        fk_resi_riconsegne_ddt_riga — le due FK che fn_partite_merce attraversa
        per salire dalle righe alle ri-consegne (origini e e_riconsegna). Indici
        creati da apply_fk_index_policy(). Brief: brief-db-partita-merce-per-documento.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - tableExists:
                schemaName: vendite
                tableName: resi_righe_riconsegne
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_partite_merce.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              UPDATE dbops.fk_index_policy SET consentito = false
               WHERE constraint_name IN ('fk_resi_righe_ddt_riga', 'fk_resi_riconsegne_ddt_riga');
