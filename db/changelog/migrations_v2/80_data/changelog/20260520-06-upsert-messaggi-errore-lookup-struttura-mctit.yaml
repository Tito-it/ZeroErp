#
# Aggiunge E_LOOKUP_STRUTTURA_TABELLA_INVALIDA (id=456) a config.messaggi_errore.
#
# Usato da dbops.fn_get_lookup_codici (migration 20260520-04) quando
# la tabella passata non ha la struttura attesa (id, codice/codice_interno,
# descrizione). Sostituisce E_GENERICO per errori struttura tabella.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260520-06-upsert-messaggi-errore-lookup-struttura-mctit.yaml

  - changeSet:
      id: 20260520-06-upsert-messaggi-errore-lookup-struttura
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: codice,    type: STRING }
              - column: { name: lingua,    type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: causa,     type: STRING }
              - column: { name: soluzione, type: STRING }
              - column: { name: id,        type: STRING }
