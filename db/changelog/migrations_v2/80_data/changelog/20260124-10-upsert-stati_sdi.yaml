# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260124-10-upsert-stati_sdi
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_sdi
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_sdi.csv
            tableName: stati_sdi
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: STRING }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: codice_interno, type: STRING }

  - changeSet:
      id: 20260124-90-upsert-stati_sdi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20260124-10-upsert-stati_sdi
