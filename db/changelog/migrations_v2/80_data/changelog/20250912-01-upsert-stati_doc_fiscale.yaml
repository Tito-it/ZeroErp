databaseChangeLog:
  - changeSet:
      id: 20250912-01-upsert-stati_doc_fiscale
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_fiscale
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/stati_doc_fiscale.csv
            tableName: stati_doc_fiscale
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"

            columns:
              - column: { name: id, type: STRING }

              - column: { name: codice, type: STRING }

              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: STRING }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: codice_interno, type: STRING }
              - column: { name: applica_lotto, type: BOOLEAN }
              - column: { name: applica_fattura, type: BOOLEAN }
              - column: { name: chiude_lotto, type: BOOLEAN }
              # 2026-10-24 (20261024-07, brief-modello-documento-vendita P-1): lo stato in cui
              # un documento nasce. Va dichiarata qui, o la cella del CSV non la governa.
              - column: { name: iniziale, type: BOOLEAN }

  - changeSet:
      id: 20250912-90-upsert-stati_doc_fiscale
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250912-01-upsert-stati_doc_fiscale
