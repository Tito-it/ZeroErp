databaseChangeLog:
  - changeSet:
      id: 20250813-01A-upsert-tipi_indirizzi
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_indirizzi
      changes:
        # Upsert dei dati nella tabella tipi_indirizzi
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_indirizzi.csv
            tableName: tipi_indirizzi
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey:
              - id
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: codice_interno,    type: STRING }
              - column: { name: descrizione,  type: STRING }
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING 
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }
              - column: { name: codice,    type: STRING }

  - changeSet:
      id: 20250812-90-upsert-tipi_indirizzi
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250812-02-upsert-tipi_indirizzi
