# Seed config.motivi_fermo (brief-db-fatturazione-due-lenti §3.2): i 10 codici
# motivo_fermo oggi emessi dai resolver vw_dash_fatturazione_* con la loro
# classe di azionabilita' (mappatura DL-6/DL-7, decisa da Tid 2026-07-04).
# Vocabolario verificato 10/10 contro le viste vive (2026-07-06).
#
# NULL nel CSV = token letterale "NULL" + nullValue: "NULL" (la cella vuota con
# nullValue:"" genererebbe '' — memoria feedback_liquibase_csv_null_sentinel).
# Nuovi codici futuri = append al CSV (mai nuovo loader: runOnChange ripescatura).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260706-02-seed-config-motivi-fermo-mctit.yaml

  - changeSet:
      id: 20260706-02-seed-config-motivi-fermo
      author: mctit
      runOnChange: true
      validCheckSums: [ANY]
      failOnError: true
      comment: >
        Seed config.motivi_fermo: 10 motivi di fermo della dashboard fatturazione
        con classe di azionabilita' (5 RECUPERABILE, 1 ANOMALIA,
        1 SOLLECITO_CLIENTE, 3 FISIOLOGICO). codice_interno = valore emesso
        dalle viste. azione NULL per i FISIOLOGICO (nessuna azione richiesta).
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: motivi_fermo }
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/motivi_fermo.csv
            tableName: motivi_fermo
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: classe, type: STRING }
              - column: { name: azione, type: STRING }
              - column: { name: ordine, type: NUMERIC }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: meta, type: JSON }
