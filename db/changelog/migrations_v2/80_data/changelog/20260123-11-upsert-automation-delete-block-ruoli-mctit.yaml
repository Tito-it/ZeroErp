databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260123-11-upsert-automation-delete-block-ruoli-mctit.yaml

  - changeSet:
      id: 20260123-11-upsert-automation-delete-block-ruoli
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automation_delete_block
      comment: "Upsert tabella dbops.automation_delete_block per ruoli anagrafici"
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/automation_delete_block_ruoli.csv
            tableName: automation_delete_block
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: schema_name, type: STRING }
              - column: { name: table_name, type: STRING }
              - column: { name: guc_key, type: STRING }
              - column: { name: enabled, type: BOOLEAN }
              - column: { name: trigger_name, type: STRING }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
