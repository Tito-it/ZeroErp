# Seed registry config.parameter_fk_surrogate.
#
# Why: alimenta il framework FK-surrogata (dispatcher 20260502-05/06).
# Righe iniziali:
#   - DEFAULT_TIPO_SOGGETTO_DETTAGLIO_% (LIKE) -> tipi_soggetto_dettaglio.codice_interno
#   - DEFAULT_UTILITY (EXACT) -> utilities.codice_interno
#
# Pattern loadUpdateData runOnChange + ANY checksum (pattern progetto
# per CSV seed di tabelle catalogo).
#
# preConditions: tabelle target esistenti CON codice_interno (entrambe
# gia' al loro posto in 00_schema).
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20260502-08-load-parameter-fk-surrogate
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameter_fk_surrogate
            - columnExists:
                schemaName: config
                tableName: utilities
                columnName: codice_interno
            - columnExists:
                schemaName: config
                tableName: tipi_soggetto_dettaglio
                columnName: codice_interno
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameter_fk_surrogate.csv
            tableName: parameter_fk_surrogate
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,             type: STRING }
              - column: { name: code_pattern,   type: STRING }
              - column: { name: match_mode,     type: STRING }
              - column: { name: target_schema,  type: STRING }
              - column: { name: target_table,   type: STRING }
              - column: { name: target_column,  type: STRING }
              - column: { name: enabled,        type: STRING }
              - column: { name: note,           type: STRING }
              - column: { name: data_insert,    type: STRING }
              - column: { name: user_insert,    type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,    type: STRING }
