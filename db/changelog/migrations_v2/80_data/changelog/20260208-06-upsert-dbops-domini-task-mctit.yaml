databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260208-06-upsert-dbops-domini-task-mctit.yaml

  - changeSet:
      id: 20260208-06-upsert-dbops-domini-task
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: domini_task
      comment: "Upsert tabella dbops.domini_task"
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/domini_task.csv
            tableName: domini_task
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
