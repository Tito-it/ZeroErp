# ------------------------------------------------------------
# Seed dbops.fk_index_policy per le FK dello schema ui.
#
# Copre le FK che necessitano di indice dedicato (non gia' coperti
# da UNIQUE/PK esistenti). La colonna consentito=true abilita la
# creazione dell'indice via dbops.apply_fk_index_policy().
#
# Escluse (gia' coperte da index esistente):
#   - lista_preferenza_utente.auth_user_id  -> UNIQUE (auth_user_id, lista_id)
#   - lista_colonna_permesso.colonna_id     -> UNIQUE (colonna_id, profilo_accesso_id)
#   - lista_preset_colonna.preset_id        -> PK (preset_id, colonna_id)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260506-09-upsert-dbops-fk-index-policy-ui-mctit.yaml

  - changeSet:
      id: 20260506-09-01-upsert-dbops-fk-index-policy-ui
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: ui
            tableName: lista_colonna
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/ui/fk_index_policy_ui.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,           type: STRING }
              - column: { name: constraint_name,      type: STRING }
              - column: { name: consentito,           type: BOOLEAN }
              - column: { name: dll_command,          type: STRING }
              - column: { name: generated_by_script,  type: BOOLEAN }
              - column: { name: user_insert,          type: STRING }
              - column: { name: data_insert,          type: STRING }

  - changeSet:
      id: 20260506-09-90-tag-fk-index-policy-ui
      author: mctit
      changes:
        - tagDatabase:
            tag: 20260506-09-upsert-dbops-fk-index-policy-ui
