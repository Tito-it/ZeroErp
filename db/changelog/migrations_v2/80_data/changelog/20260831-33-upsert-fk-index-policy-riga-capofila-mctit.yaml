# Registro indici FK per `fk_fatture_righe_riga_capofila`
#   voce 5 di brief-db-richieste-aperte-dal-backend
#
# ── ⚠️ LA POLICY E' OPT-IN ──────────────────────────────────────────
#
#   Senza questo seed nessun indice nasce: `fn_populate_fk_index_policy()`
#   registra le FK nuove con `consentito = false`.
#
# ── UN SOLO SI', E L'INDICE HA DUE COLONNE ──────────────────────────
#
#   La FK e' COMPOSITA — `(riga_capofila_id, fattura_id)` — quindi l'indice
#   elenca le stesse due colonne nello stesso ordine e le copre per prefisso.
#   ⛔ Un indice sulla sola `riga_capofila_id` NON coprirebbe la FK: la policy
#   confronta le colonne della FK **come insieme** con le prime N chiave del
#   btree, e li' l'insieme non tornerebbe.
#
#   ⭐ E' PARZIALE, `WHERE riga_capofila_id IS NOT NULL`, ed e' lecito: la guida
#   ammette il predicato quando e' una congiunzione di soli
#   `<colonna della FK> IS NOT NULL` (§8.4). Qui paga moltissimo — una riga
#   spezzata dal plafond e' l'eccezione, non la regola, quindi l'indice pieno
#   sarebbe quasi tutto NULL. Stesso disegno di
#   `ix_fatture_righe_riga_rettificata_id`, che e' la FK gemella per forma sulla
#   stessa tabella.
#
#   Il lettore vero e' la lettura CAPOFILA -> PARTI: chi somma gli importi di
#   un'attivita' attraversa `attivita_fatturabili.fattura_riga_id`, arriva alla
#   capofila e da li' deve trovare le sue parti. Senza indice quella discesa e'
#   una scansione di `vendite.fatture_righe`, che e' una delle tabelle piu'
#   grandi dello schema.
#
# ── 📌 COSA NON ENTRA NEL REGISTRO ──────────────────────────────────
#
#   `uq_fatture_righe_id_fattura` non e' una FK: e' il BERSAGLIO della FK
#   composita, e la policy governa gli indici DELLE FK. Il suo indice comparira'
#   in `dbops.vw_duplicate_indexes` come ridondante — e' dichiarato nel
#   changeSet 20260831-30 — e la seconda guardia di `apply_fk_index_policy()`
#   ne rifiuterebbe comunque il `DROP`, perche' sostiene un constraint.
#
# ── ⛔ `onFail: HALT` e NON `MARK_RAN` ──────────────────────────────
#
#   `MARK_RAN` segnerebbe il changeSet come eseguito senza eseguirlo: su una
#   policy opt-in vuol dire nessun indice e nessun errore, che e' il modo
#   peggiore di fallire.
#
# Dipendenze: 20260831-30 (la colonna e la FK composita).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260831-33-upsert-fk-index-policy-riga-capofila-mctit.yaml

  - changeSet:
      id: 20260831-33-upsert-fk-index-policy-riga-capofila
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per fk_fatture_righe_riga_capofila: un SI'. L'indice ha
        DUE colonne perche' la FK e' composita — uno sulla sola riga_capofila_id
        non la coprirebbe, la policy confronta le colonne come insieme con le prime
        N chiave del btree. PARZIALE su riga_capofila_id IS NOT NULL, come la FK
        gemella per forma ix_fatture_righe_riga_rettificata_id: una riga spezzata
        dal plafond e' l'eccezione, quindi l'indice pieno sarebbe quasi tutto NULL.
        Il lettore vero e' la discesa CAPOFILA -> PARTI, che senza indice e' una
        scansione di fatture_righe.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: vendite
                tableName: fatture_righe
                columnName: riga_capofila_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_riga_capofila.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
