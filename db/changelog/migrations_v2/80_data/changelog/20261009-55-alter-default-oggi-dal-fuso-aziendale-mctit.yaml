              ALTER TABLE magazzino.rettifiche ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
              ALTER TABLE magazzino.trasferimenti ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
              ALTER TABLE shop.ricevute ALTER COLUMN data_emissione SET DEFAULT script.fn_data_operativa();
              ALTER TABLE vendite.contratti ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
              ALTER TABLE vendite.contratti ALTER COLUMN valido_dal SET DEFAULT script.fn_data_operativa();
              ALTER TABLE vendite.ddt ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
              ALTER TABLE vendite.ordini ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
