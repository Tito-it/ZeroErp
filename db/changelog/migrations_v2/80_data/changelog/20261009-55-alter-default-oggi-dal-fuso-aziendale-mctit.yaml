            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE acquisti.ddt ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
              ALTER TABLE acquisti.ordini ALTER COLUMN data SET DEFAULT script.fn_data_operativa();
              ALTER TABLE anagrafiche.billing_account ALTER COLUMN valido_dal SET DEFAULT script.fn_data_operativa();
