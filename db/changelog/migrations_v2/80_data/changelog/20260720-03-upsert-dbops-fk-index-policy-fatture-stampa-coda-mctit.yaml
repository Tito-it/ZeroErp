# Opt-in dbops.fk_index_policy per le 2 FK di vendite.fatture_stampa_coda
# (brief-db-processi-fatturazione-cockpit §3). fn_populate le registra a
# consentito=false (default): questo seed decide esplicitamente.
#   - fk_fatture_stampa_coda_lotto (lotto_id) -> consentito=TRUE: la coda si
#     filtra/monitora per lotto (esito giri, drawer) e ON DELETE SET NULL
#     scandisce i figli -> indice utile.
#   - fk_fatture_stampa_coda_fattura (sorgente_id) -> consentito=TRUE: indice
#     pieno su sorgente_id per lookup/storico stampe per fattura su tutti gli
#     stati (l'unico parziale uq_fatture_stampa_coda_vivo copre solo i vivi
#     PENDING/IN_CORSO) e per il controllo FK su fattura.
# Creazione/rimozione indici delegata a dbops.apply_fk_index_policy() in
# 90_end (mai a mano). Pattern simmetrico a 20260615-06.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260720-03-upsert-dbops-fk-index-policy-fatture-stampa-coda-mctit.yaml

  - changeSet:
      id: 20260720-03-upsert-dbops-fk-index-policy-fatture-stampa-coda
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: vendite
            tableName: fatture_stampa_coda
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/vendite/fk_index_policy_fatture_stampa_coda.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
