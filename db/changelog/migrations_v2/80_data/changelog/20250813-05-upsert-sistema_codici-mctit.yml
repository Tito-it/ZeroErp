# ℹ️ NOTA 2026-11-13 (brief-db-token-null-dei-seed D1): la cella vuota di
#   `separatore` arriva come stringa vuota, ed e' il valore voluto («nessun
#   separatore»). Dal 90_end/20261112-53 la colonna e' NOT NULL DEFAULT '':
#   un `NULL` nel CSV fermerebbe il migrate. Lo stesso CSV lo legge 20260524-25.
# ------------------------------------------------------------

databaseChangeLog:
  - changeSet:
      id: 20250813-05-upsert-sistema_codici
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: sistema_codici
      changes:
        # Upsert dei dati nella tabella sistema_codici
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/sistema_codici.csv
            tableName: sistema_codici
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_interno, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: prefisso, type: STRING }
              - column: { name: separatore, type: STRING }
              - column: { name: lunghezza_numero, type: STRING }
              - column: { name: usa_sequenza, type: STRING }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: tx_id, type: uuid }
              - column: { name: schema_tabella, type: STRING }
              - column: { name: nome_tabella, type: STRING }
              - column: { name: nome_colonna, type: STRING }

  - changeSet:
      id: 20250813-90-upsert-sistema_codici
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250813-05-upsert-sistema_codici
