databaseChangeLog:
  - changeSet:
      id: 20250716-03-upsert-stati
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: stati
            schemaName: config
      loadUpdateData:
        relativeToChangelogFile: true
        file: ../sql/config/stati.csv
        tableName: stati
        schemaName: config
        separator: ","
        encoding: UTF-8
        nullValue: ""
        primaryKey:
          - id
        columns:
          - column: { name: id,            type: STRING }
          - column: { name: sigla_stato,   type: STRING }
          - column: { name: descrizione,   type: STRING }
          - column: { name: codice_iso2,   type: STRING }
          - column: { name: codice_iso3,   type: STRING }
          - column: { name: codice_telefono, type: STRING }
          - column: { name: regione,       type: STRING }
          - column: { name: data_insert,   type: STRING }
          - column: { name: user_insert,   type: STRING }
          - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
          - column: { name: user_update,      type: STRING }
          - column:
              name: extra_country
              type: JSON
              # se il CSV ha valore vuoto, usa {} come JSON valido
              defaultValue: "{}"
          # 2026-10-18 (D-2 di Tid): lo stato dichiara se il suo catalogo di
          # comuni e CAP e' completo. Acceso, l'indirizzo libero usa comune e
          # CAP del catalogo (guard anagrafiche.trgfn_indirizzi_guard_forma_libera).
          # Colonna NOT NULL creata da 20261018-80: ogni riga del CSV porta t o f.
          - column: { name: catalogo_comuni_completo, type: BOOLEAN }
  
  - changeSet:
      id: 20250716-90-upsert-stati
      author: mctit
      changes:
        - tagDatabase:
            tag: 20250716-03-upsert-stati