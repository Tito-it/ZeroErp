# Seed config.tipi_reso (brief-db-resi-vendita §1): RESO_A_CREDITO (riapre=false),
# RESO_PER_RICONSEGNA (riapre=true). Il motore legge il flag (nessun IF hardcoded).
# Dipendenza: config.tipi_reso (20260713-10).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260713-39-seed-tipi-reso-mctit.yaml

  - changeSet:
      id: 20260713-39-seed-tipi-reso
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_reso
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_reso.csv
            tableName: tipi_reso
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: riapre_residuo, type: BOOLEAN }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: NUMERIC }
              - column: { name: meta, type: JSON, defaultValue: "{}" }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }
