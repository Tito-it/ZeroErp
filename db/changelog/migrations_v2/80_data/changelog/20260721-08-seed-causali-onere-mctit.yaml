# Seed config.causali_onere (brief-db-immutabilita-quantita-e-porta-oneri §4c.3).
#   5 voci iniziali (elenco di partenza, Tid 2026-07-21). Aggiungere una causale
#   in futuro costa una riga di questo CSV (loadUpdateData runOnChange).
# Dipendenza: config.causali_onere (20260721-03).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260721-08-seed-causali-onere-mctit.yaml

  - changeSet:
      id: 20260721-08-seed-causali-onere
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: causali_onere
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/causali_onere.csv
            tableName: causali_onere
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: NUMERIC }
              - column: { name: codice_interno, type: STRING }
              - column: { name: codice, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: ordine, type: NUMERIC }
              - column: { name: meta, type: JSON, defaultValue: "{}" }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column: { name: data_update, type: STRING }
              - column: { name: user_update, type: STRING }
