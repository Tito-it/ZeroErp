databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260114-02-upsert-config-lingue-table.yaml

  - changeSet:
      id: 20260114-02-upsert-config-lingue-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: lingue
      changes:
        # Upsert dei dati nella tabella lingue
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/lingue.csv
            tableName: lingue
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: codice_iso, type: STRING }
              - column: { name: descrizione, type: STRING }
              - column: { name: descrizione_locale, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
