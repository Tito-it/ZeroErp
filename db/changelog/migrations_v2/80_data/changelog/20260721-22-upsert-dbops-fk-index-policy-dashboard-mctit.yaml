# Seed dbops.fk_index_policy per le FK delle tabelle dashboard (schema ui).
#
# consentito=true (seed esplicito, brief §3.ter): l'automation da sola
# registra consentito=false sulle FK di una tabella nuova; l'indice va
# quindi richiesto esplicitamente. Creazione/rimozione indici delegata a
# dbops.apply_fk_index_policy() in 90_end (mai a mano, per policy).
# Pattern simmetrico a 20260506-09 (fk_index_policy liste).
#
# Escluse (gia' coperte da PK/UNIQUE leading):
#   - dashboard_widget.dashboard_id          -> PK (dashboard_id, widget_id)
#   - dashboard_preset_widget.preset_id      -> PK (preset_id, widget_id)
#   - dashboard_preferenza_utente.auth_user_id -> UNIQUE (auth_user_id, dashboard_id)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260721-22-upsert-dbops-fk-index-policy-dashboard-mctit.yaml

  - changeSet:
      id: 20260721-22-upsert-dbops-fk-index-policy-dashboard
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: ui
            tableName: widget
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/ui/fk_index_policy_dashboard.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,           type: STRING }
              - column: { name: constraint_name,      type: STRING }
              - column: { name: consentito,           type: BOOLEAN }
              - column: { name: dll_command,          type: STRING }
              - column: { name: generated_by_script,  type: BOOLEAN }
              - column: { name: user_insert,          type: STRING }
              - column: { name: data_insert,          type: STRING }
