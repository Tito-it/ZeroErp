databaseChangeLog:
  - changeSet:
      id: 20251001-22-upsert-config-stati-assets-table
      logicalFilePath: migrations_v2/80_data/20251001-21-upsert-config-stati-assets-table.yaml
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: tipi_evento_assets
      changes:
        # Upsert dei dati nella tabella tipi_evento_assets
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/tipi_evento_assets.csv
            tableName: tipi_evento_assets
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id,           type: STRING }
              - column: { name: codice,  type: STRING }
              - column: { name: codice_interno,    type: STRING }              
              - column: { name: descrizione,  type: STRING }
              - column: { name: attivo,  type: BOOLEAN }
              - column: { name: ordine,  type: STRING }
              - column:
                  name: meta
                  type: JSON
                  # se il CSV ha valore vuoto, usa {} come JSON valido
                  defaultValue: "{}"
              - column: { name: data_insert,  type: STRING }
              - column: { name: user_insert,  type: STRING }
              - column:
                  name: data_update
                  type: STRING 
                  defaultValue: "NOW()"
              - column: { name: user_update,  type: STRING }  