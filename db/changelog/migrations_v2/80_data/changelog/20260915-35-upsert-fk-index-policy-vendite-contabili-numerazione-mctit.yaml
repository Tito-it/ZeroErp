# LA POLICY INDICI FK PER LE DUE FK NUOVE DELLA DISTINTA — L14
#   dbops.fk_index_policy <- fk_index_policy_vendite_contabili_numerazione.csv
#   Brief: brief-db-distinta-numerata-sul-registro, §4 P-10, §4-bis.14 (corretto)
#
# ── DUE RIGHE, ENTRAMBE UN «NO», E PER DUE RAGIONI DIVERSE ───────────────
#   * fk_vendite_contabili_registro: l'ingresso «tutte le distinte di questo
#     registro» e' gia' servito per PREFISSO da ix_vendite_contabili_registro_anno
#     (registro_id, anno), creato in 20260915-21 come ix_commesse_registro_anno.
#     Il dll_command nomina l'indice dedicato CANONICO (ix_…_registro_id) e
#     NON quello composto: nominarlo farebbe cancellare al primo 90_end
#     l'indice a due colonne (apply_fk_index_policy DROPPA cio' che nomina un
#     `false`).
#   * fk_vendite_contabili_emittente_sr: NESSUN indice, come le sorelle
#     fk_fatturazione_lotti_emittente_sr e fk_sistemazioni_emittente. ⚠️ Il
#     brief (§4 P-1/P-10) prevedeva un indice «perche' la policy filtra ogni
#     lettura su quella colonna»: verificato scrivendo, la policy la filtra
#     ATTRAVERSO una funzione (fn_scope_ef_whitelist_via_sr), non con un
#     confronto sulla colonna, e il planner non userebbe mai quell'indice. E
#     un indice col nome canonico accanto a una riga `false` che lo nomina
#     sarebbe in contraddizione: il 90_end lo dropperebbe a ogni corsa. Si
#     segue la sorella.
#
#   ⚠️ dll_command SEMPRE valorizzato (chk_fk_index_policy_dll_command_forma),
#   anche a false. ⚠️ onFail HALT e non MARK_RAN: MARK_RAN segna senza
#   eseguire, e la riga mancante finirebbe in vw_fk_con_indice_missing_policy
#   senza che nessun rosso lo dica.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260915-35-upsert-fk-index-policy-vendite-contabili-numerazione-mctit.yaml

  - changeSet:
      id: 20260915-35-upsert-fk-index-policy-vendite-contabili-numerazione
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK per le due FK nuove di pagamenti.vendite_contabili: due NO.
        fk_vendite_contabili_registro e' coperta per prefisso da ix_vendite_contabili_registro_anno
        (il dll_command nomina il canonico ix_…_registro_id, non il composto: nominarlo lo
        farebbe droppare al 90_end); fk_vendite_contabili_emittente_sr resta senza indice come
        fatturazione_lotti e sistemazioni — la policy RLS filtra via funzione, non sulla
        colonna. dll_command sempre valorizzato. Brief: brief-db-distinta-numerata-sul-registro, L14.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili
                columnName: registro_id
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili
                columnName: emittente_soggetto_ruolo_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/fk_index_policy_vendite_contabili_numerazione.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,        type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE schema_name = 'pagamenti'
                 AND table_name = 'vendite_contabili'
                 AND constraint_name IN ('fk_vendite_contabili_registro',
                                         'fk_vendite_contabili_emittente_sr');
