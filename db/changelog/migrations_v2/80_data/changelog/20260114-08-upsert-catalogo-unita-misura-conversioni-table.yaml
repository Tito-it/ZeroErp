databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260114-08-upsert-catalogo-unita-misura-conversioni-table.yaml

  - changeSet:
      id: 20260114-08-upsert-catalogo-unita-misura-conversioni-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: catalogo
            tableName: unita_misura_conversioni
      changes:
        # Upsert dei dati nella tabella unita_misura_conversioni
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/catalogo/unita_misura_conversioni.csv
            tableName: unita_misura_conversioni
            schemaName: catalogo
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: uom_from_id, type: STRING }
              - column: { name: uom_to_id, type: STRING }
              - column: { name: fattore, type: NUMERIC }
              - column: { name: valido_dal, type: DATE }
              - column: { name: valido_al, type: DATE }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: attivo, type: BOOLEAN }
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"

              - column: { name: user_update, type: STRING }
