# I CENTRI DI RISCOSSIONE NON ERANO SEMINATI: ERANO STATI INSERITI A MANO
#   passo P-2 — Piano: brief-db-posting-e-abbinamento-rata.md §2.0 P-2
#   Decisione: brief-incassi-riconciliazione-rate-promemoria.md, D9-d-1
#
# ── IL FATTO, MISURATO ──────────────────────────────────────────────────
#   `pagamenti.centri_riscossione` ha due righe, entrambe con
#   `user_insert = postgres` e `data_insert = 2026-02-17`: inserite a mano, non
#   da una migrazione. Nessun file di `80_data` nominava questa tabella — non
#   esisteva ne' CSV ne' loader.
#
#   🔴 Quindi su un database ricostruito da zero — cioe' IN CI — la tabella e'
#   VUOTA. Non manca solo la banca: mancano anche i fondi fattura e le
#   compensazioni, cioe' i due centri da cui dipendono
#   `vendite.fn_sync_contabili_fondo_fattura` e l'intero ramo compensazioni.
#
#   ⚠️ Ed e' invisibile per costruzione: tutti e quattro i pgTAP di `pagamenti`
#   usano il modulo «cerca il centro, se non c'e' inserilo». Si fabbricano il
#   dato che il seed non fornisce, quindi non se ne accorgono. E' la trappola
#   «il DB di sviluppo non e' un DB ricostruito da zero»: verificando solo su dev
#   si misura una macchina, non la riproducibilita'.
#
# ── ⚠️ PRIMA IL BACKFILL, POI LE RIGHE NUOVE ───────────────────────────
#   Le prime due righe del CSV sono quelle GIA' NEL DATABASE, con i loro valori e
#   i loro id NON SEQUENZIALI (37 e 38, assegnati a mano). E' la regola del
#   progetto: prima si porta nel CSV cio' che c'e' gia', poi si aggiunge. Un
#   mirror che partisse senza di esse le lascerebbe fuori su dev e non le
#   creerebbe in CI.
#   ℹ️ Oggi nessuna riga le referenzia (0 contabili, 0 movimenti, 0 enti), ma il
#   CSV e' la sede della verita' e deve DESCRIVERE il database, non correggerlo.
#
#   Le tre righe nuove (39 BANCA, 40 POSTE, 41 CASSA) sono i centri REALI: senza
#   di essi una contabile di incasso vero non e' creabile, perche' i due centri
#   esistenti sono entrambi interni.
#
# ── 🔴 IL PREREQUISITO DEL PREREQUISITO ────────────────────────────────
#   Questo seed NON ERA ESEGUIBILE prima del changeSet 20260821-11: il vincolo
#   `uq_centri_riscossione_compensazione` era un UNIQUE TOTALE su una colonna
#   booleana — il `where:` era stato scritto su un `addUniqueConstraint`, che
#   quell'attributo non ha, ed era stato ignorato in silenzio. La tabella non
#   poteva contenere piu' di DUE righe, e la terza sarebbe stata rifiutata.
#   L'ordine e' garantito dalla FASE: `00_schema` gira prima di `80_data`.
#
# ── COLONNE DI AUDIT: COSA SOPRAVVIVE DAVVERO ──────────────────────────
#   `script.trgfn_audit_data_user_generic` riscrive `user_insert` sull'INSERT e
#   `data_update`/`user_update` su ogni scrittura. L'unica colonna di audit che
#   il CSV riesce davvero a portare e' `data_insert` — ed e' quella che conta,
#   perche' conserva il 2026-02-17 delle due righe storiche anche su un database
#   ricostruito. Le altre tre restano nel CSV per simmetria col loader gemello
#   degli stati (20260213-04) e per non far sembrare mancante una colonna.
#
# ── LA SEQUENZA (il passo che il piano chiamava P-3) ───────────────────
#   `id` e' `GENERATED BY DEFAULT AS IDENTITY`: un `loadUpdateData` con id
#   ESPLICITI inserisce le righe ma NON avanza la sequenza, che resterebbe a 1
#   mentre il MAX e' 41 — e il primo INSERT auto-id collidera' sulla pkey.
#
#   ⭐ Il riallineamento sta QUI, nello stesso changeSet che crea la deriva: e' la
#   forma idiomatica del progetto (19 changeSet di `80_data` la usano) ed e' un
#   disegno migliore del rimandarlo a uno spazzino di fine migrate.
#
#   ℹ️ Il piano prevedeva un passo P-3 separato in `90_end`, sul modello di
#   `20260616-02` (che copre `config`), perche' misurava che `pagamenti` non
#   fosse coperto da nessun resync. La misura era superata dai fatti:
#   `90_end/20260818-72-resync-identity-sequences-globale` (2026-08-18,
#   `runAlways`) copre TUTTI gli schemi, `pagamenti` compreso, ed e' forward-only.
#   Un terzo meccanismo per un solo schema sarebbe stato una copia, non un
#   presidio. Quello resta la RETE; questo e' il presidio primario.
#
#   ⚠️ FORWARD-ONLY anche qui, e non e' un dettaglio: la forma corta
#   `setval(seq, COALESCE(MAX(id), 1), true)` — usata da alcuni seed piu' vecchi —
#   su una tabella da cui si cancellassero righe riporterebbe INDIETRO la
#   sequenza, e gli id verrebbero riusati. Qui si tocca solo cio' che e' rimasto
#   indietro. ⚠️ E si confronta il piu' alto valore GIA' EROGATO, non `last_value`:
#   una sequenza mai usata ha `last_value = 1` e `is_called = false`, e il
#   prossimo `nextval` restituisce 1, non 2.
#
# ── ⚠️ QUESTO CHANGESET E' `runOnChange: true`, ED E' LECITO ───────────
#   E' un mirror CSV di `80_data`: la ri-esecuzione e' il comportamento voluto —
#   si edita il CSV e il mirror riallinea. Il divieto di `runOnChange` vale per
#   `00_schema` e `20_code`, dove la seconda passata della CI riscriverebbe il
#   corpo sopra revisioni piu' recenti.
#   ⚠️ `validCheckSums` al PLURALE: il singolare e' una chiave che Liquibase
#   ignora, e non si nota finche' `runOnChange` e' `true`.
#
# ── DA QUI IN POI I DATI SI CAMBIANO DAL CSV ───────────────────────────
#   ⛔ Niente `UPDATE`/`INSERT` SQL su questa tabella: creerebbero una seconda
#   sorgente di verita', e le due divergerebbero fra dev e CI. Modifica di un
#   valore o riga nuova -> si edita il CSV. La cancellazione e' l'unica eccezione
#   (`loadUpdateData` non cancella).
#
# Verifica: db/pgtap/pagamenti/test-centri-riscossione-vincoli-ruolo.sql, che
#   asserisce anche la presenza dei centri dopo il solo giro delle migrazioni.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260821-20-upsert-pagamenti-centri-riscossione-mctit.yaml

  - changeSet:
      id: 20260821-20-upsert-pagamenti-centri-riscossione
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Semina pagamenti.centri_riscossione, che finora non aveva ne' CSV ne'
        loader: le due righe interne erano state inserite a mano e su un database
        ricostruito da zero la tabella era vuota. Backfill delle due esistenti
        (id 37, 38) con i loro valori, poi i tre centri reali (BANCA, POSTE,
        CASSA). Riallinea in coda la sequenza IDENTITY, forward-only.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: pagamenti
                tableName: centri_riscossione
            # ⚠️ Il vincolo dev'essere quello PARZIALE di 20260821-11: con il
            # vecchio UNIQUE totale su un booleano la terza riga verrebbe
            # rifiutata, e il migrate si fermerebbe su un messaggio che parla di
            # un indice invece che dell'ordine delle fasi.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)::text
                    FROM pg_index i
                    JOIN pg_class c ON c.oid = i.indexrelid
                   WHERE c.relname = 'uq_centri_riscossione_compensazione'
                     AND i.indisunique
                     AND i.indpred IS NOT NULL;
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pagamenti/centri_riscossione.csv
            tableName: centri_riscossione
            schemaName: pagamenti
            separator: ","
            encoding: UTF-8
            # Token letterale «NULL», non la cella vuota: la cella vuota genera
            # una stringa vuota, che viola i CHECK di non-vuoto. Oggi nessuna
            # cella di questo CSV e' nulla, ma la regola vale per chi lo estende.
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,               type: NUMERIC }
              - column: { name: codice,           type: STRING }
              - column: { name: codice_interno,   type: STRING }
              - column: { name: descrizione,      type: STRING }
              - column: { name: is_compensazione, type: BOOLEAN }
              - column: { name: is_fondo_fattura, type: BOOLEAN }
              - column: { name: attivo,           type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
              - column: { name: data_insert,      type: STRING }
              - column: { name: user_insert,      type: STRING }
              - column: { name: data_update,      type: STRING }
              - column: { name: user_update,      type: STRING }

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Riallineamento FORWARD-ONLY della sequenza IDENTITY, subito dopo
              -- il loader che ha inserito id espliciti. Stessa logica del resync
              -- globale di 90_end, ristretta a questa tabella: qui si ripara la
              -- deriva dove la si crea, invece di delegarla alla rete di coda.
              DO $$
              DECLARE
                v_seq     text;
                v_max     bigint;
                v_last    bigint;
                v_called  boolean;
                v_erogato bigint;
              BEGIN
                v_seq := pg_get_serial_sequence('pagamenti.centri_riscossione', 'id');
                IF v_seq IS NULL THEN
                  RAISE NOTICE 'centri_riscossione.id non ha una sequenza associata: niente da riallineare.';
                  RETURN;
                END IF;

                SELECT COALESCE(MAX(id), 0) INTO v_max FROM pagamenti.centri_riscossione;
                IF v_max <= 0 THEN
                  RETURN;
                END IF;

                EXECUTE format('SELECT last_value, is_called FROM %s', v_seq)
                   INTO v_last, v_called;

                -- Una sequenza mai chiamata ha last_value = 1 e is_called = false:
                -- li' last_value e' il PROSSIMO id, non l'ultimo erogato.
                v_erogato := CASE WHEN v_called THEN v_last ELSE v_last - 1 END;

                IF v_max > v_erogato THEN
                  PERFORM setval(v_seq, v_max, true);
                  RAISE NOTICE 'Resync pagamenti.centri_riscossione.id: erogato % -> %', v_erogato, v_max;
                END IF;
              END $$;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- ⛔ Nessun ripristino automatico. Cancellare le righe seminate
              --    lascerebbe il database senza i due centri interni, da cui
              --    dipendono i fondi fattura e le compensazioni; e riportare
              --    indietro la sequenza farebbe riusare gli id. Se questo seed va
              --    tolto, va tolto guardando i dati.
              SELECT 1;
