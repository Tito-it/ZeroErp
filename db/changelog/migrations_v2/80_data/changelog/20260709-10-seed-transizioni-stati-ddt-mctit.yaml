# Seed config.transizioni_stati_ddt — matrice A-3 (brief §5).
#
# Stati (stati_doc_ddt): DRAFT=1, EMESSO=2, SPEDITO=4, CONSEGNATO=5, RESO=7,
#   ANNULLATO=6.
#
# id 1 | DRAFT(1)      -> EMESSO(2)     | emetti   (gate componenti §6)   attivo=true
# id 2 | DRAFT(1)      -> ANNULLATO(6)  | annulla                        attivo=true
# id 3 | EMESSO(2)     -> SPEDITO(4)    | spedisci                       attivo=true
# id 4 | EMESSO(2)     -> ANNULLATO(6)  | annulla                        attivo=true
# id 5 | SPEDITO(4)    -> CONSEGNATO(5) | consegna                       attivo=true
# id 6 | SPEDITO(4)    -> RESO(7)       | reso                           attivo=true
# id 7 | CONSEGNATO(5) -> RESO(7)       | reso                           attivo=true
# id 8 | CONSEGNATO(5) -> ANNULLATO(6)  | annulla (post-consegna)        attivo=FALSE
#
# id 8 attivo=false: documenta il grafo ma disabilitato (annullo post-consegna
#   da valutare, come CONFERMATO->ANNULLATO degli ordini id 3). Riabilitabile.
#
# meta.ui: action_key/label_key/severity/icon/requires_confirm/outlined/manuale
#   (data-driven, letta da script.fn_available_actions_ddt read-side, §13).
#   Tutte manuali -> action_key+label_key obbligatori (ck_transizioni_stati_ddt_meta_ui).
#
# Dipendenza: config.transizioni_stati_ddt (00_schema 20260709-02).
#   Enforcement: vendite.trgfn_ddt_guard_transizione (20260709-04).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260709-10-seed-transizioni-stati-ddt-mctit.yaml

  - changeSet:
      id: 20260709-10-seed-transizioni-stati-ddt
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: transizioni_stati_ddt
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/transizioni_stati_ddt.csv
            tableName: transizioni_stati_ddt
            schemaName: config
            separator: ","
            encoding: UTF-8
            primaryKey: "id"
            columns:
              - column: { name: id, type: STRING }
              - column: { name: stato_da_id, type: STRING }
              - column: { name: stato_a_id, type: STRING }
              - column: { name: attivo, type: BOOLEAN }
              - column:
                  name: meta
                  type: JSON
                  defaultValue: "{}"
              - column: { name: data_insert, type: STRING }
              - column: { name: user_insert, type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update, type: STRING }
              - column: { name: azione_processo_codename, type: STRING }
