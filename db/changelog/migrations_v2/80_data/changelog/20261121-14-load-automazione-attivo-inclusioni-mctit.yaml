# Mirror del registro dbops.automazione_attivo_inclusioni (00_schema 20261121-10)
#
# Una tabella, UN CSV: ../sql/dbops/automazione_attivo_inclusioni.csv. Chiave
# del mirror = la chiave NATURALE (schema, tabella figlia, colonna FK), non
# l'id: una riga vale ovunque. Seed di catalogo (linee-guida-sql §11.7).
# Prime righe (Tid, 2026-11-21): regime_fiscale_rf di emittenti_fiscali e di
# fornitori, la coppia ATTIVO verso config.regimi_fiscali.
# ⚠️ Ritirare una riga: loadUpdateData non cancella -> DELETE forward-only
#   (linee-guida §11.2); i trigger li toglie il giro successivo
#   dell'automazione (dbops.fn_ritira_attivo_eccezioni).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261121-14-load-automazione-attivo-inclusioni-mctit.yaml

  - changeSet:
      id: 20261121-14-load-automazione-attivo-inclusioni
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Mirror di dbops.automazione_attivo_inclusioni dal suo CSV (chiave naturale). Prime righe:
        regime_fiscale_rf di emittenti_fiscali e fornitori.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automazione_attivo_inclusioni
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/automazione_attivo_inclusioni.csv
            tableName: automazione_attivo_inclusioni
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_figlia,tabella_figlia,colonna_fk"
            columns:
              - column: { name: schema_figlia,  type: STRING }
              - column: { name: tabella_figlia, type: STRING }
              - column: { name: colonna_fk,     type: STRING }
              - column: { name: motivo,         type: STRING }
