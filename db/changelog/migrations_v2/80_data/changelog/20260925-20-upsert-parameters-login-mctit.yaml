# P-1 — I PARAMETRI DELL'ATTESA CRESCENTE (D-B2): id 57, 58, 59
#   Brief: brief-db-blocco-login-per-credenziale, sezione 2.4 e D-B2
#
#   login_tetto_credenziale = 20, login_attesa_base_secondi = 2,
#   login_attesa_max_secondi = 60 (decisione di Tid, 2026-09-24). Li legge
#   script.fn_login_parametri, insieme ai due che c'erano gia'
#   (login_max_tentativi_falliti, login_blocco_minuti, in parameters.csv).
#
# ── ⛔ PERCHE' UN CSV DEDICATO E NON UN APPEND A parameters.csv ─────
#   parameters.csv e' una mina dormiente (vedi 20260825-12): un append ne
#   cambia il checksum, sveglia il mirror runOnChange, e la ri-lettura muore
#   sulla riga DEFAULT_UTILITY, che il dispatcher FK-surrogata non accetta piu'.
#   Un CSV per famiglia e' il pattern di casa; questo apre la famiglia
#   `parameters_login.csv`. ⚠️ I due parametri di prima restano dove sono:
#   spostarli vorrebbe dire svegliare proprio quel mirror.
#
# ── ⚠️ storicizza = false, come i due fratelli ──────────────────────
#   login_max_tentativi_falliti e login_blocco_minuti (id 9, 10) nascono con
#   storicizza = f, e questi li seguono. ⚠️ Non e' solo coerenza: su un database
#   ricostruito da zero (lo scratch, 2026-09-25) l'UPDATE di un parametro con
#   storicizza = t muore nel trigger di storico, che e' montato con
#   trgfn_storico_generic('parameters_id') mentre la colonna di
#   storico.parameters e' parameter_id (E_SNAPSHOT_CLOSE_ERROR). Difetto
#   preesistente, fuori da questo lavoro, segnalato nel brief.
#
# ── ℹ️ IL DISPATCHER QUI E' UN NO-OP ────────────────────────────────
#   Nessuno dei pattern di config.parameter_fk_surrogate intercetta login_*: i
#   valori sono interi, e a validarli e' fn_login_parametri stessa (fail-loud).
#
# Dipendenze: nessuna. ⚠️ fn_login_parametri vive in 20_code ed esiste gia'
# quando gira questo seed: fra le due fasi di un migrate da zero il login
# solleverebbe E_CONFIG_MANCANTE. E' voluto — meglio un errore parlante che un
# freno tarato a caso — ma nessuno fa login in mezzo a un migrate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260925-20-upsert-parameters-login-mctit.yaml

  - changeSet:
      id: 20260925-20-upsert-parameters-login
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D-B2: parametri id 57-59 dell'attesa crescente sulla credenziale — login_tetto_credenziale
        (20), login_attesa_base_secondi (2), login_attesa_max_secondi (60). Li legge
        script.fn_login_parametri. CSV dedicato (famiglia parameters_login) e non un append a
        parameters.csv, mina dormiente (vedi 20260825-12). Brief:
        brief-db-blocco-login-per-credenziale §2.4.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameters
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT COUNT(*) FROM config.parameters
                   WHERE (id = 57 AND code <> 'login_tetto_credenziale')
                      OR (id = 58 AND code <> 'login_attesa_base_secondi')
                      OR (id = 59 AND code <> 'login_attesa_max_secondi');
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/parameters_login.csv
            tableName: parameters
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: "NULL"
            primaryKey: "id"
            columns:
              - column: { name: id,            type: NUMERIC }
              - column: { name: code,          type: STRING }
              - column: { name: default_value, type: STRING }
              - column: { name: description,   type: STRING }
              - column: { name: data_insert,   type: STRING }
              - column: { name: user_insert,   type: STRING }
              - column:
                  name: data_update
                  type: STRING
                  defaultValue: "NOW()"
              - column: { name: user_update,   type: STRING }
              - column: { name: tx_id,         type: uuid }
              - column: { name: storicizza,    type: BOOLEAN }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM config.parameters
               WHERE id IN (57, 58, 59)
                 AND code IN ('login_tetto_credenziale', 'login_attesa_base_secondi',
                              'login_attesa_max_secondi');
