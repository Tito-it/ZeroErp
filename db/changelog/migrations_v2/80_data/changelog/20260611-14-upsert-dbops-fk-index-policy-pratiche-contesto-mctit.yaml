# A — seed dbops.fk_index_policy per le FK di contesto su
# pratiche.pratiche (lente D1, fn_lista_pratiche_per_contesto):
#   - fk_pratiche_soggetto_ruolo  -> ix_pratiche_soggetto_ruolo_id
#   - fk_pratiche_istanza_utility -> ix_pratiche_istanza_utility_id
# Indici parziali (WHERE NOT NULL): le colonne sono opzionali e le
# lenti filtrano sempre per valore. Creazione delegata a
# dbops.apply_fk_index_policy() in 90_end (mai a mano, per policy).
#
# Pattern simmetrico a 20260506-09 (fk_index_policy ui).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260611-14-upsert-dbops-fk-index-policy-pratiche-contesto-mctit.yaml

  - changeSet:
      id: 20260611-14-upsert-dbops-fk-index-policy-pratiche-contesto
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: pratiche
            tableName: pratiche
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/pratiche/fk_index_policy_pratiche.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,           type: STRING }
              - column: { name: constraint_name,      type: STRING }
              - column: { name: consentito,           type: BOOLEAN }
              - column: { name: dll_command,          type: STRING }
              - column: { name: generated_by_script,  type: BOOLEAN }
              - column: { name: user_insert,          type: STRING }
              - column: { name: data_insert,          type: STRING }
