#
# Cleanup dev: rimuove righe vendite.preventivi salvate durante la sessione
# 2026-05-01 (UI v5 §2.1) con BA NULL + istanza NULL. Pre-requisito per
# il NOT NULL su istanza_utility_id (fase 90_end).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260501-15-cleanup-preventivi-malformati-mctit.yaml

  - changeSet:
      id: 20260501-15-cleanup-preventivi-malformati
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        DELETE righe preventivi con BA NULL e istanza NULL (residui dev
        della sessione UI v5 §2.1). Risolve il crash della lista preventivi
        e prepara il SET NOT NULL su istanza_utility_id.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- Cleanup dev: preventivi con BA NULL + istanza NULL
              --
              -- Origine: drawer FE che permetteva save con solo utility_id
              -- valorizzato (BA e istanza nulli). La view vw_preventivi_list
              -- chiamava fn_get_emittente_fiscale_pk(NULL) -> E_PARAMETRO_INVALIDO
              -- e l'intera lista esplodeva.
              --
              -- Post-cleanup: nessun preventivo orfano residuo, base sana
              -- per il backfill emittente e il NOT NULL successivo.
              -- ==========================================================
              DELETE FROM vendite.preventivi
               WHERE billing_account_id IS NULL
                 AND istanza_utility_id IS NULL;
