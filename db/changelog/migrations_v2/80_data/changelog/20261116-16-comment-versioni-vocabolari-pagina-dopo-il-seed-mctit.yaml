# I COMMENT DI TRE COLONNE DELLE VERSIONI, AL PRESENTE, DOPO IL SEED
#   documenti.template_documenti_versioni.formato_template, .page_format,
#   .page_orientation
#
# -- PERCHE' QUI E NON IN 00_schema ---------------------------------------
#   I tre COMMENT portavano il nome di un brief (linee-guida-sql §5d). Li
#   scrive 80_data/changelog/20261004-22, insieme alle FK verso i tre
#   vocabolari; 80_data gira dopo tutto 00_schema e 20_code, quindi su un
#   database costruito da zero (la CI) una riscrittura in 00_schema
#   perderebbe contro il testo vecchio, e il presidio dei COMMENT sarebbe
#   rosso solo li'. Il testo giusto arriva dopo il 20261004-22 anche da zero:
#   in 80_data, che si ordina per nome (la trappola e' quella del
#   20261114-98). Su dbdev questo changeSet scrive lo stesso testo che si
#   leggerebbe dopo il 20261116-10, che queste tre non le tocca.
#   Censimento del 2026-11-17 su 70_dati_sistema, 80_data, 85_pgagent e
#   90_end: per gli oggetti riscritti dal giro 5, l'unico caso.
#   Questi COMMENT d'ora in poi si riscrivono qui o in un changeSet di
#   80_data che venga dopo.
#
#   Rollback: i COMMENT di prima, letti dal catalogo di dbdev il 2026-11-17.
#   Brief: brief-db-revisione-documenti, giro 5 (§15).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261116-16-comment-versioni-vocabolari-pagina-dopo-il-seed-mctit.yaml

  - changeSet:
      id: 20261116-16-comment-versioni-vocabolari-pagina-dopo-il-seed
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        documenti: i COMMENT di formato_template, page_format e page_orientation al presente, dopo il changeSet di 80_data che li scrive.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 3
            sql: >
              SELECT count(*) FROM pg_attribute WHERE attrelid = to_regclass('documenti.template_documenti_versioni') AND attname IN ('formato_template', 'page_format', 'page_orientation') AND NOT attisdropped
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN documenti.template_documenti_versioni.formato_template IS
                  'Il formato della sorgente: codice_interno di documenti.formati_template (FK, DEFAULT HTML). Fuori bozza non cambia (documenti.trgfn_template_documenti_versioni_protect_pubblicata).';
              COMMENT ON COLUMN documenti.template_documenti_versioni.page_format IS
                  'Il formato di pagina del PDF: codice_interno di documenti.formati_pagina (FK, DEFAULT A4). Fuori bozza non cambia (documenti.trgfn_template_documenti_versioni_protect_pubblicata).';
              COMMENT ON COLUMN documenti.template_documenti_versioni.page_orientation IS
                  'L''orientamento di pagina del PDF: codice_interno di documenti.orientamenti_pagina (FK, DEFAULT PORTRAIT). Fuori bozza non cambia (documenti.trgfn_template_documenti_versioni_protect_pubblicata).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN documenti.template_documenti_versioni.formato_template IS
                  'Formato della sorgente: codice_interno di documenti.formati_template (FK). Brief: brief-db-vocabolari-versione-template.';
              COMMENT ON COLUMN documenti.template_documenti_versioni.page_format IS
                  'Formato di pagina del PDF: codice_interno di documenti.formati_pagina (FK). Brief: brief-db-vocabolari-versione-template.';
              COMMENT ON COLUMN documenti.template_documenti_versioni.page_orientation IS
                  'Orientamento di pagina del PDF: codice_interno di documenti.orientamenti_pagina (FK). Brief: brief-db-vocabolari-versione-template.';
