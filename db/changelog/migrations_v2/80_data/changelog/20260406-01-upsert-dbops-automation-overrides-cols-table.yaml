databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260406-01-upsert-dbops-automation-overrides-cols-table.yaml

  - changeSet:
      id: 20260406-01-upsert-dbops-automation-overrides-cols-table
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: automation_overrides_cols
      comment: "Upsert tabella dbops.automation_overrides_cols"
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/automation_overrides_cols.csv
            tableName: automation_overrides_cols
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "schema_name,table_name,col_role"
            columns:
              - column: { name: schema_name, type: STRING }
              - column: { name: table_name, type: STRING }
              - column: { name: col_role, type: STRING }
              - column: { name: col_name, type: STRING }
