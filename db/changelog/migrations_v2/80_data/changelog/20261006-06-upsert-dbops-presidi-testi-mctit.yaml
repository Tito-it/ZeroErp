# brief-db-presidi-cosa-significa-cosa-fare §4.1 — il seed dei testi per chi
# agisce: una riga `it` per ognuno dei presidi che possono accendersi (tutte
# le nature tranne INVENTARIO).
#
# ── ⭐ CHIAVE DELL'UPSERT: (vista, lingua, variante) ─────────────────
#   (variante dal 2026-10-09, brief-db-presidio-processi-testo-per-causa.)
#   La chiave naturale (uq_presidi_testi_vista_lingua), non l'`id`, che e'
#   IDENTITY: il CSV non porta la colonna id. `vista` e' anche la FK verso
#   dbops.presidi, quindi il presidio si nomina come lo nomina il suo CSV.
#
# ── ⚠️ ORDINE ───────────────────────────────────────────────────────
#   La FK pretende la riga di dbops.presidi: il catalogo lo seminano
#   20260910-08 e -35, che in 80_data vengono prima (l'ordine e' quello dei
#   nomi dei file). config.lingue la semina 20260114-02, prima ancora.
#
# ⛔ La sede del testo e' il CSV: si edita il file, mai con UPDATE a parte
#   (linee-guida-sql §11.2). Una riga tolta dal CSV non sparisce dal database
#   (loadUpdateData non cancella): serve un DELETE forward-only — ed e' il caso
#   del ritiro di un presidio, che il pgTAP dbops/test-presidi-testi-v1
#   (test 2) pretende.
# ⚠️ CATALOGO PURO: nessuna FK verso anagrafiche.*, nessun dato di macchina
#   ⇒ nessun `context: dati_macchina`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261006-06-upsert-dbops-presidi-testi-mctit.yaml

  - changeSet:
      id: 20261006-06-upsert-dbops-presidi-testi
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Mirror di dbops.presidi_cause e poi di dbops.presidi_testi dai loro
        CSV: le cause dei presidi con colonna_variante (chiave vista, causa) e
        significato e azione in italiano per ogni presidio che puo' accendersi
        (chiave vista, lingua, variante). Catalogo puro.
        brief-db-presidi-cosa-significa-cosa-fare §4.1,
        brief-db-presidio-processi-testo-per-causa §5.5.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: presidi_testi
        - tableExists:
            schemaName: dbops
            tableName: presidi_cause
      changes:
        # ⭐ 2026-10-09, brief-db-presidio-processi-testo-per-causa §5.5 (b): PRIMA
        #   le cause, POI i testi. I testi di variante hanno la FK (vista,
        #   variante) → dbops.presidi_cause (00_schema/20261009-36): un mirror
        #   delle cause numerato oggi girerebbe DOPO questo (in 80_data l'ordine
        #   e' il nome del file), e la prossima causa aggiunta ai due CSV insieme
        #   farebbe fallire qui la FK. Due tabelle, due CSV, un changeSet: il
        #   runOnChange si sveglia se cambia l'uno o l'altro, e li ricarica
        #   nell'ordine giusto.
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/presidi_cause.csv
            tableName: presidi_cause
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "vista,causa"
            columns:
              - column: { name: vista,      type: STRING }
              - column: { name: causa,      type: STRING }
              - column: { name: chi_agisce, type: STRING }
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/presidi_testi.csv
            tableName: presidi_testi
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            # Token letterale `NULL`, non la cella vuota (linee-guida-sql §11.7).
            # Dal 2026-10-09 `variante` e' nullable (NULL = testo del
            # presidio): la cella vuota la renderebbe stringa vuota, e il
            # CHECK chk_presidi_testi_variante_non_vuota la rifiuterebbe.
            # 2026-10-09, brief-db-presidio-processi-testo-per-causa §3 B.2: la
            # chiave prende `variante` (00_schema/20261009-33). La riga
            # generica ha variante NULL: Liquibase la cerca con `variante is
            # NULL` (updateSQL offline, verificato), quindi la aggiorna invece
            # di duplicarla — e la UNIQUE e' NULLS NOT DISTINCT comunque.
            primaryKey: "vista,lingua,variante"
            columns:
              - column: { name: vista,       type: STRING }
              - column: { name: lingua,      type: STRING }
              - column: { name: variante,    type: STRING }
              - column: { name: significato, type: STRING }
              - column: { name: azione,      type: STRING }
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DELETE FROM dbops.presidi_testi;
              DELETE FROM dbops.presidi_cause;
