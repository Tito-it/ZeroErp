# Cleanup righe legacy in dbops.audit_sources dopo dismissione
# del modello profili_reparto_* (sostituito da profili_accesso_*).
#
# Il loader 20260429-08-upsert-audit-sources usa loadUpdateData,
# che fa UPSERT ma non DELETE delle righe rimosse dal CSV.
# Quindi le righe id 6,7 (profili_reparto_aree/_azioni) restano
# in tabella anche dopo che le abbiamo tolte dal CSV. Le cancello
# qui esplicitamente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260505-01-delete-audit-sources-profili-reparto-mctit.yaml

  - changeSet:
      id: 20260505-01-delete-audit-sources-profili-reparto
      author: mctit
      failOnError: true
      preConditions:
        - onFail: MARK_RAN
        - and:
          - tableExists:
              schemaName: dbops
              tableName: audit_sources
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT CASE WHEN EXISTS (
                  SELECT 1 FROM dbops.audit_sources
                   WHERE code IN ('profili_reparto_aree','profili_reparto_azioni')
                ) THEN 1 ELSE 0 END;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rimuove le sorgenti audit del modello legacy. Le tabelle
              -- storico.profili_reparto_* vengono droppate dal changeSet
              -- 20260505-02-drop-profili-reparto.
              DELETE FROM dbops.audit_sources
               WHERE code IN ('profili_reparto_aree','profili_reparto_azioni');
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Re-insert non eseguibile in modo affidabile: il rollback
              -- e' lasciato vuoto perche' le righe legacy sono fuori scope
              -- (il modello profili_reparto_* viene droppato).
              SELECT 1;
