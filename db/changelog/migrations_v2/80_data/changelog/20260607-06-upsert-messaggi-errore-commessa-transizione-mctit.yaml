# Aggiunge a config.messaggi_errore i codici NUOVI per la macchina di
# transizioni stato commessa:
#   E_COMMESSA_STATO_TRANSIZIONE_INVALIDA (id=472)
#   E_COMMESSA_NESSUNA_RIGA_APPROVATA     (id=473)
#
# E_COMMESSA_NON_TROVATA e' gia' registrato (id=376, "Commessa %s non trovata.")
# e viene RIUSATO dalle funzioni: queste referenziano il codice per stringa,
# non per id. NON va ri-aggiunto (violerebbe uq_messaggi_errore_codice_lingua).
#
# Usati da:
#   - vendite.trgfn_commesse_guard_transizione (20260607-02): 472, 473
#   - vendite.fn_cambia_stato_commessa (20260607-03): E_COMMESSA_NON_TROVATA
#     (376) + generici E_PARAMETRO_INVALIDO, E_STATO_SCONOSCIUTO gia' registrati
#   - vendite.fn_approva_commessa_attivita (20260607-04): E_COMMESSA_NON_TROVATA (376)
#
# Pattern simmetrico a 20260605-12 (ordini transizione, id 470/471) e agli
# analoghi di offerte/contratti.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260607-06-upsert-messaggi-errore-commessa-transizione-mctit.yaml

  - changeSet:
      id: 20260607-06-upsert-messaggi-errore-commessa-transizione
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: messaggi_errore
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/config/messaggi_errore.csv
            tableName: messaggi_errore
            schemaName: config
            separator: ","
            encoding: UTF-8
            nullValue: ""
            primaryKey: "id"
            columns:
              - column: { name: codice,    type: STRING }
              - column: { name: lingua,    type: STRING }
              - column: { name: messaggio, type: STRING }
              - column: { name: id,        type: NUMERIC }
              - column: { name: causa,     type: STRING }
              - column: { name: soluzione, type: STRING }
