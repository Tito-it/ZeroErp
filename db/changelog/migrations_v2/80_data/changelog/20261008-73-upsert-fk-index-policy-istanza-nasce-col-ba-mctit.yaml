# I TRE INDICI DELLE FK TOCCATE DA R-8 E R-9: DUE SI', UNO NO
#   dbops.fk_index_policy:
#     * anagrafiche.clienti.fk_clienti_istanze_utilities  -> true
#       la copriva uq_clienti_istanza_utility, ritirato dal 20261008-64; la
#       ricerca dei clienti di un'istanza e il controllo referenziale alla
#       cancellazione di un'istanza entrano da li';
#     * pratiche.pratiche.fk_pratiche_billing_account_istanza -> true (parziale
#       IS NOT NULL, linee-guida-sql §8.4)
#       nata col 20261008-63; «le pratiche di questo cliente» entra da li', e la
#       colonna e' NULL per le pratiche di altri ruoli;
#     * anagrafiche.gestori.fk_soggetti_ruoli_anagrafiche -> false
#       dal 20261008-65 la copre uq_gestori_soggetto_ruolo: l'indice dedicato
#       ix_anagrafiche_gestori_soggetto_ruolo_id e' ridondante e
#       apply_fk_index_policy() lo toglie (non e' un UNIQUE: la guardia lo
#       ammette).
#   Brief: brief-db-istanza-nasce-col-ba (R-8, R-9)
#
# ⚠️ CSV DEDICATO con loader suo, non un append a fk_index_policy.csv: quel
#   mirror e' di gennaio e non si sveglia (precedente: 20260913-12).
# ⛔ Creazione e rimozione restano di dbops.apply_fk_index_policy() in 90_end:
#   qui si tocca solo il flag (linee-guida-sql §8.7, «mai a mano»).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20261008-73-upsert-fk-index-policy-istanza-nasce-col-ba-mctit.yaml

  - changeSet:
      id: 20261008-73-upsert-fk-index-policy-istanza-nasce-col-ba
      author: mctit
      runOnChange: true
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Registro indici FK di R-8/R-9: indice sulla FK clienti -> istanze (persa la copertura di
        uq_clienti_istanza_utility), indice parziale sulla FK pratica -> BA, indice dedicato dei
        gestori sul ruolo a false (lo copre il UNIQUE nuovo). Brief: brief-db-istanza-nasce-col-ba.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: dbops
                tableName: fk_index_policy
            - columnExists:
                schemaName: pratiche
                tableName: pratiche
                columnName: billing_account_id
      changes:
        - loadUpdateData:
            relativeToChangelogFile: true
            file: ../sql/dbops/fk_index_policy_istanza_nasce_col_ba.csv
            tableName: fk_index_policy
            schemaName: dbops
            separator: ","
            encoding: UTF-8
            primaryKey: "schema_name,table_name,constraint_name"
            columns:
              - column: { name: schema_name,         type: STRING }
              - column: { name: table_name,          type: STRING }
              - column: { name: constraint_name,     type: STRING }
              - column: { name: consentito,          type: BOOLEAN }
              - column: { name: dll_command,         type: STRING }
              - column: { name: generated_by_script, type: BOOLEAN }
              - column: { name: user_insert,         type: STRING }
              - column: { name: data_insert,         type: STRING }
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DELETE FROM dbops.fk_index_policy
               WHERE (schema_name, table_name, constraint_name) IN (
                       ('anagrafiche', 'clienti',  'fk_clienti_istanze_utilities'),
                       ('pratiche',    'pratiche', 'fk_pratiche_billing_account_istanza'));
              UPDATE dbops.fk_index_policy SET consentito = true
               WHERE schema_name = 'anagrafiche' AND table_name = 'gestori'
                 AND constraint_name = 'fk_soggetti_ruoli_anagrafiche';
