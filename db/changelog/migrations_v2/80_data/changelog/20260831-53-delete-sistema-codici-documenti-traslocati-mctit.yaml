# P-13 — LE QUATTRO RIGHE ESCONO DAL CATALOGO DEI FORMATI
#   config.sistema_codici: ddt, ordine, reso, commessa
#   Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-13
#
# ── ⛔ PERCHE' NON BASTAVA LASCIARLE LI' ─────────────────────────
#   Dopo il trasloco quelle righe non generavano piu' niente
#   (`usa_sequenza = false`), ma restavano in una tabella EDITABILE DAL PANNELLO
#   DI CONFIGURAZIONE con un `prefisso` che nessuno legge piu'.
#   ⇒ Un amministratore che cambia `ORD` li' dentro non ottiene NIENTE, e non ha
#   modo di accorgersene. E' confusione gia' in circolo, e l'ha vista Tid.
#
# ── ⭐ IL PRECEDENTE E' IN CASA ──────────────────────────────────
#   `20260209-03-delete-sistema-codici-fatture`: quando la FATTURA passo' ai
#   registri, la sua riga fu tolta esattamente cosi'. Questo changeSet fa lo
#   stesso per i quattro documenti che l'hanno seguita.
#
# ── ⚠️ L'ORDINE E' PORTANTE, E NON E' UN CASO ───────────────────
#   Questo changeSet vive in `80_data`, che gira DOPO `00_schema` e `20_code`.
#   Quando arriva:
#     * il registro ha gia' prefisso, suffisso e lunghezza (P-2, P-9);
#     * le famiglie hanno gia' i default (P-11);
#     * le funzioni leggono gia' dal registro (P-10);
#     * il provisioning legge gia' dalle famiglie (P-12).
#   ⛔ Invertire un solo passo lascia qualcuno senza fonte, e il difetto sarebbe
#   MUTO: numeri nudi o piu' corti, senza errori.
#
# ⚠️ Il DELETE fa scattare `script.trgfn_config_sistema_codici_sync_gen_codice`,
#   che sul ramo DELETE fa `DROP TRIGGER IF EXISTS` e `DROP FUNCTION IF EXISTS`
#   degli oggetti generati. ⭐ Sono gia' stati smontati quando `usa_sequenza` e'
#   passato a false: il DROP e' innocuo, ed e' scritto qui perche' nessuno debba
#   scoprirlo leggendo il trigger.
# ⚠️ Le righe escono anche dal CSV `80_data/sql/config/sistema_codici.csv`: il
#   loader e' un `loadUpdateData`, che fa upsert e NON cancella — quindi senza
#   questo DELETE resterebbero, e senza toglierle dal CSV tornerebbero.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/80_data/changelog/20260831-53-delete-sistema-codici-documenti-traslocati-mctit.yaml

  # ── ⛔ 2026-09-02 — IL PASSO CHE MANCAVA AL CHANGELOG ─────────────────
  #
  #   Il migrate in CI si e' fermato sul changeSet qui sotto:
  #     SQL Precondition failed.  Expected '0' got '4'
  #   cioe' «tutte e quattro le righe hanno ancora usa_sequenza = true».
  #
  #   ⭐ E la preCondition ha ragione: il commento del changeSet dice «gia'
  #   smontati quando usa_sequenza e' passato a false», e quel passaggio non
  #   e' MAI ENTRATO NEL CHANGELOG. Su questa macchina le quattro righe sono
  #   state spente a mano; su un database ricostruito da zero le crea la
  #   baseline con `usa_sequenza = true` e nessuno le spegne — il CSV di
  #   `sistema_codici` non le contiene nemmeno piu'.
  #   ⚠️ E' la forma classica del difetto: il changelog descrive un mondo che
  #   esiste solo dove qualcuno ha messo le mani. Non si vede finche' non si
  #   ricostruisce.
  #
  # ── ⛔ PERCHE' SI AGGIUNGE UN PASSO E NON SI RILASSA IL CANCELLO ──────
  #
  #   La tentazione era portare la preCondition a MARK_RAN. Sarebbe stato
  #   sbagliato: su un database nuovo le quattro righe resterebbero ATTIVE, e
  #   accanto ai trigger nuovi del motore registri vivrebbero i generatori
  #   generici `gen_codice`. Due motori di numerazione sullo stesso documento —
  #   la finestra che 20260831-13 dichiara innocua per la durata di UN migrate
  #   diventerebbe permanente.
  #   ⇒ Il cancello va lasciato dov'e', e va data la condizione che pretende.
  #
  # ── ⭐ SPEGNERE E' LA MOSSA GIUSTA, NON UN AGGIRAMENTO ────────────────
  #
  #   `usa_sequenza = false` e' esattamente il meccanismo che il trasloco usa:
  #   `script.trgfn_config_sistema_codici_sync_gen_codice` scatta e fa DROP del
  #   trigger e della funzione generati, «senza DDL a mano» (20260831-13).
  #   ⚠️ Verificato il 2026-09-02 sul database, non dedotto: il trigger di sync
  #   e' montato `AFTER INSERT OR DELETE OR UPDATE` e la sua funzione guarda
  #   `TG_OP` e fa `DROP TRIGGER`.
  #
  #   ⚠️ Su questa macchina non fa niente — le quattro righe non esistono piu',
  #   il DELETE e' passato il 2026-08-31 — ed e' la prova che il passo e'
  #   idempotente: `WHERE usa_sequenza IS TRUE` su zero righe.
  # ------------------------------------------------------------
  - changeSet:
      id: 20260902-53-00-spegni-sistema-codici-documenti-traslocati
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Porta a usa_sequenza = false le quattro righe di config.sistema_codici dei documenti
        traslocati (ddt, ordine, reso, commessa), prima che il changeSet successivo le cancelli.
        E'' il passo che il changelog dava per fatto e che non conteneva: su questa macchina era
        stato eseguito a mano, su un database ricostruito da zero la baseline le crea a true e
        nessuno le spegne. Spegnerle fa scattare il sync trigger, che fa DROP dei generatori
        generici — lo stesso meccanismo che il trasloco usa da 20260831-08/-13/-15.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: sistema_codici
            - columnExists:
                schemaName: config
                tableName: sistema_codici
                columnName: usa_sequenza
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Il filtro su IS TRUE non e' cosmesi: senza, l'UPDATE
              --    toccherebbe righe gia' spente e farebbe scattare il sync
              --    trigger per nulla.
              UPDATE config.sistema_codici
                 SET usa_sequenza = false
               WHERE codice_interno IN ('ddt', 'ordine', 'reso', 'commessa')
                 AND usa_sequenza IS TRUE;

              -- ⛔ E il residuo che il sync NON riesce a togliere.
              --   `20260709-14` dichiara: «la funzione trgfn_ddt_gen_codice
              --   (override di 20260709-07) viene droppata dal sync del
              --   framework quando usa_sequenza passa a false: atteso e
              --   corretto». E' l'intenzione giusta appoggiata a un
              --   meccanismo che su questo percorso non arriva.
              --
              --   ⚠️ Il ramo di drop del sync e' GUARDATO:
              --       IF v_usa_sequenza IS DISTINCT FROM TRUE THEN
              --         IF v_schema_tabella IS NOT NULL
              --            AND v_nome_tabella IS NOT NULL THEN  ← qui
              --   Senza le coordinate della tabella sulla riga di
              --   config.sistema_codici non droppa niente, e non lo dice:
              --   `RETURN NULL` e via. Quelle colonne sono nate il 2026-01-18
              --   (20260118-01), molto dopo la riga della baseline.
              --
              --   ⇒ Su un database ricostruito da zero la funzione resta
              --   ORFANA — senza nessun trigger agganciato — e a trovarla e'
              --   scripts/sql/guardrail_riferimenti_morti.sql, che la chiama
              --   «gia' di per se' un residuo». Ha ragione.
              --   ⭐ Non si registra il debito in
              --   dbops.riferimenti_morti_esenzioni: quella funzione E' morta
              --   per progetto, quindi si toglie invece di dichiararla.
              --
              -- ℹ️ Idempotente: su una macchina dove il sync ci era arrivato
              --   (dbdev, dove la funzione non esiste piu') non fa niente.
              DROP FUNCTION IF EXISTS vendite.trgfn_ddt_gen_codice();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⛔ Non si riaccende: rimetterle a true farebbe RIGENERARE i
              --    trigger generici accanto a quelli del motore registri.
              SELECT 1;

  # ── ⛔ 2026-09-02 — IL SECONDO PASSO MANCANTE, STESSA FAMIGLIA ────────
  #
  #   Sistemato il primo cancello, il changeSet qui sotto e' tornato rosso con
  #   lo STESSO messaggio — «Expected '0' got '4'» — ma sulla TERZA delle sue
  #   preCondition: `vendite.famiglie_documento` nasceva SENZA
  #   `prefisso_default`. `20260831-51` (00_schema) aggiunge la colonna e la
  #   riempie leggendo `config.sistema_codici`, ma gira in 00_schema e le
  #   famiglie le semina 80_data, cioe' DOPO: su un database ricostruito da
  #   zero quell'UPDATE tocca zero righe. ⚠️ E' il motivo per cui un
  #   `onFailMessage` per ogni check vale il suo costo: senza, due difetti
  #   diversi si presentano con la stessa faccia.
  #
  #   Il rimedio del 02-09 fu un CSV LATERALE (`famiglie_documento_formato.csv`,
  #   changeSet `20260902-53-01`, qui in mezzo) con prefisso e lunghezza per
  #   `codice_interno` — «precedente esatto: colonna_serie».
  #   ⛔ RITIRATO il 2026-09-18 (Tid: una tabella, un CSV): sei CSV sulla
  #   stessa tabella erano sei sorgenti di verita' che nessun presidio
  #   confrontava. `prefisso_default` e `lunghezza_default` stanno nel CSV
  #   principale `famiglie_documento.csv` (mirror 20260830-14), che su un
  #   database da zero gira PRIMA di questo file: la terza preCondition del
  #   changeSet qui sotto trova il prefisso gia' scritto, come lo trovava
  #   quando lo scriveva il laterale. Il backfill di `20260831-51` resta e non
  #   fa danno: su un database nuovo trova zero righe, su uno vecchio i valori
  #   gia' giusti. La riga `20260902-53-01` in databasechangelog resta orfana
  #   (Liquibase non se ne cura).
  # ------------------------------------------------------------

  - changeSet:
      id: 20260831-53-delete-sistema-codici-documenti-traslocati
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        P-13: escono da config.sistema_codici le quattro righe dei documenti traslocati (ddt,
        ordine, reso, commessa). ⛔ Non generavano piu'' niente da mesi, ma restavano in una
        tabella editabile dal pannello con un prefisso che nessuno legge: un amministratore che
        lo cambia non ottiene niente e non ha modo di accorgersene. ⭐ Il precedente e'' in casa —
        20260209-03 tolse la riga della FATTURA quando passo'' ai registri. ⚠️ L''ordine e''
        portante: questo changeSet e'' in 80_data e gira DOPO che il registro ha la forma
        completa, le famiglie hanno i default, le funzioni leggono dal registro e il
        provisioning dalle famiglie — invertire un passo lascerebbe qualcuno senza fonte, con un
        difetto muto. ⚠️ Il DELETE fa scattare il sync trigger, che fa DROP degli oggetti
        generati: gia'' smontati quando usa_sequenza e'' passato a false, quindi innocuo.
        Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-13.
      preConditions:
        - onFail: HALT
        - and:
            # ⛔ Nessuna delle quattro deve generare ancora: se una tornasse a
            #    usa_sequenza = true, cancellarla smonterebbe un generatore vivo.
            - sqlCheck:
                expectedResult: 0
                onFailMessage: >-
                  Una delle righe ddt/ordine/reso/commessa in config.sistema_codici ha ancora
                  usa_sequenza = true: cancellarla smonterebbe un generatore VIVO. Portarla a
                  false prima di rimuoverla.
                sql: |
                  SELECT COUNT(*) FROM config.sistema_codici
                   WHERE codice_interno IN ('ddt', 'ordine', 'reso', 'commessa')
                     AND usa_sequenza IS TRUE;
            # ⛔ E i registri devono avere gia' la forma: senza, questo DELETE
            #    toglierebbe l'unica fonte rimasta.
            - sqlCheck:
                expectedResult: 0
                onFailMessage: >-
                  Ci sono registri attivi di famiglia non fiscale SENZA prefisso o senza
                  lunghezza: togliere ora le righe del catalogo dei formati li lascerebbe a
                  produrre numeri nudi o piu' corti, in silenzio. Il backfill e' il changeSet
                  20260831-54; per sapere QUALI, la query sta in
                  scratchpad/diagnosi-53.sql del brief.
                sql: |
                  SELECT COUNT(*) FROM vendite.registri_fatturazione r
                   WHERE r.attivo
                     AND r.famiglia_documento IN ('DDT', 'ORDINE', 'RESO', 'COMMESSA')
                     AND (COALESCE(r.prefisso, '') = '' OR r.lunghezza_numero IS NULL);
            - sqlCheck:
                expectedResult: 0
                onFailMessage: >-
                  Una famiglia attiva non ha il prefisso_default: senza, il provisioning farebbe
                  nascere i registri del prossimo emittente SENZA prefisso. Il seed e' nel
                  changeSet 20260831-51.
                sql: |
                  SELECT COUNT(*) FROM vendite.famiglie_documento fd
                   WHERE fd.attivo
                     AND fd.codice_interno IN ('DDT', 'ORDINE', 'RESO', 'COMMESSA')
                     AND COALESCE(fd.prefisso_default, '') = '';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DELETE FROM config.sistema_codici
               WHERE codice_interno IN ('ddt', 'ordine', 'reso', 'commessa');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 'Rollback manuale: ri-seminare le quattro righe da un backup del CSV. Nessuno le legge piu'', quindi il rollback serve solo a tornare a uno stato precedente del changelog.'::text;
