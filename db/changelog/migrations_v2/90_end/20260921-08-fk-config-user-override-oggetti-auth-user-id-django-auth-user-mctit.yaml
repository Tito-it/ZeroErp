# V-7 (ponte django, 7 di 11) — FK config.user_override_oggetti.auth_user_id -> django.auth_user.id
#   Documento: valutazione-modello-di-dominio-db, voce V-7 (rifinita il 21-09).
#
# -- IL FATTO -------------------------------------------------------------------
#   Undici colonne che puntano a django.auth_user senza FK: il DB puo' CHIAMARE
#   django.* ma non DIPENDERNE strutturalmente, e una FK e' una dipendenza
#   che si risolve alla CREATE. La forma di casa (18 FK gia' cosi': identita_
#   digitali, parameter_overrides, documenti_generati, ui.*_preferenza_utente)
#   e' questa: 90_end + preCondition tableExists su django.auth_user +
#   onFail MARK_RAN. ⚠️ Il prezzo, dichiarato: in CI Liquibase gira PRIMA di
#   `manage.py migrate`, quindi li' la FK NON esiste e il changeSet resta
#   segnato. Il pgTAP config/test-fk-auth-user-ponte-django-v1 lo sa e
#   salta dove la tabella manca.
#
# -- ON DELETE CASCADE — perche' ---------------------------------------------------
#   override di permesso per utente, come le aree.
#   ON UPDATE CASCADE come le sorelle (l'id di auth_user non cambia mai, e'
#   solo coerenza di forma).
#
# -- CHE COSA NON CAMBIA -------------------------------------------------------
#   La colonna resta com'e' (tipo, NULL). Zero orfani su dbdev il 21-09.
#   L'indice: la policy FK (dbops.fk_index_policy, 20260921-13) lo dichiara
#   consentito=false — la colonna e' gia' in testa a un indice esistente o
#   nessuna lettura entra da li'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260921-08-fk-config-user-override-oggetti-auth-user-id-django-auth-user-mctit.yaml

  - changeSet:
      id: 20260921-08-fk-config-user_override_oggetti-auth_user_id-django-auth-user
      author: mctit
      comment: >
        FK config.user_override_oggetti.auth_user_id -> django.auth_user.id, ON DELETE CASCADE: override di permesso per utente, come le aree.
        90_end + MARK_RAN come le 18 sorelle (in CI non esiste, dichiarato).
        Documento: valutazione-modello-di-dominio-db, voce V-7.
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: django
                tableName: auth_user
            - columnExists:
                schemaName: config
                tableName: user_override_oggetti
                columnName: auth_user_id
            - not:
                - foreignKeyConstraintExists:
                    schemaName: config
                    foreignKeyName: fk_config_user_override_oggetti_auth_user
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: user_override_oggetti
            baseColumnNames: auth_user_id
            constraintName: fk_config_user_override_oggetti_auth_user
            referencedTableSchemaName: django
            referencedTableName: auth_user
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: user_override_oggetti
            constraintName: fk_config_user_override_oggetti_auth_user
