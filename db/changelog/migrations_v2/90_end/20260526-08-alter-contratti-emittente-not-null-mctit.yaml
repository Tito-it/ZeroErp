# Fase 90_end (post-backfill in 80_data/20260526-07):
#   SET NOT NULL su vendite.contratti.emittente_fiscale_id.
#
# Pre-check: zero NULL residui (altrimenti HALT).
# Il backfill copre tutti i casi via catena user-derived / BA-derived.
