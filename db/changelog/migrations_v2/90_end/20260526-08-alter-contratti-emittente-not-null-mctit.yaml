databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260526-08-alter-contratti-emittente-not-null-mctit.yaml

  - changeSet:
      id: 20260526-08-alter-contratti-emittente-not-null
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        SET NOT NULL su contratti.emittente_fiscale_id post-backfill.
        Pre-check: zero NULL (altrimenti HALT).
      preConditions:
        - onFail: HALT
        - onFailMessage: >
            Backfill incompleto: residui NULL su contratti.emittente_fiscale_id.
            Verificare il changeset 80_data/20260526-07 (backfill emittente)
            prima di rieseguire. Cause tipiche: BA senza mapping EF o
            EF disattivato in anagrafiche.emittenti_fiscali_billing_account.
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*)
                FROM vendite.contratti
               WHERE emittente_fiscale_id IS NULL;
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- SET NOT NULL post-backfill
              --
              -- emittente_fiscale_id: snapshot user-derived obbligatorio
              --   (modello simmetrico a preventivi e offerte_commerciali).
              --   Valorizzato a INSERT-time da trgfn_contratti_default_emittente
              --   tramite GUC app.current_user_id -> fn_resolve_emittente_for_user.
              --   Per push da offerta: copiato esplicitamente da
              --   fn_push_offerta_a_contratto (v_offerta.emittente_fiscale_id).
              -- ==========================================================
              ALTER TABLE vendite.contratti
                ALTER COLUMN emittente_fiscale_id SET NOT NULL;
