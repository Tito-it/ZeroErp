# LA PORTA DELLE ANAGRAFICHE DI MAGAZZINO (Lotto 1)
#   A zeroerp_app solo SELECT su:
#     magazzino.magazzini, ubicazioni, lotti, assets, eventi_assets,
#     la madre magazzino.note e le nove partizioni note_*.
#
# -- PERCHE' --------------------------------------------------------------
#   brief-db-magazzino-tutte-le-scritture-dal-verbo, Lotto 1 (D-M1 = C,
#   D-M7 = b, Tid 2026-11-21/22): ogni scrittura di queste tabelle passa da un
#   verbo che controlla il livello (fn_aggiungi_*, fn_modifica_*, 20_code/
#   magazzino/20261122-06 e -07). eventi_assets e le note non hanno scrittore
#   applicativo: chi le scrivera' nascera' verbo.
#   ⚠️ Le note sono una tabella partizionata: il privilegio della madre non
#   copre la scrittura diretta su una partizione, che ha il suo. Si elencano
#   tutte.
#   Fuori: trasferimenti e righe, inventari, rettifiche e righe (Lotto 2, coi
#   verbi dei documenti interni).
#
# ── 🔴 TRE SEDI (linee-guida §11.8) ─────────────────────────────────
#   · QUESTO changeSet (subito su dev);
#   · v_tabelle_sola_lettura_app del loop 90_end/ci_apply/20260205-41;
#   · il blocco «POSTURA DICHIARATA» di scripts/sql/provision_zeroerp.sql.
#   Le tiene allineate db/pgtap/magazzino/test-anagrafiche-magazzino-sola-lettura-v1.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261122-10-revoke-app-scrittura-anagrafiche-magazzino-mctit.yaml

  - changeSet:
      id: 20261122-10-revoke-app-scrittura-anagrafiche-magazzino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La porta delle anagrafiche di magazzino: a zeroerp_app SELECT soltanto su magazzini,
        ubicazioni, lotti, assets, eventi_assets e le note (madre e nove partizioni); le scrivono i
        verbi. Postura resa stabile dal loop 20260205-41 e dal provisioning.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $porta$
              DECLARE
                  v_tabella text;  -- un nome qualificato da format(): nessuna colonna
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'Ruolo zeroerp_app non presente: skip porta delle anagrafiche di magazzino.';
                      RETURN;
                  END IF;

                  FOREACH v_tabella IN ARRAY ARRAY[
                      'magazzino.magazzini', 'magazzino.ubicazioni', 'magazzino.lotti',
                      'magazzino.assets', 'magazzino.eventi_assets',
                      'magazzino.note',
                      'magazzino.note_asset', 'magazzino.note_evento_asset',
                      'magazzino.note_inventario', 'magazzino.note_inventario_riga',
                      'magazzino.note_movimento',
                      'magazzino.note_rettifica', 'magazzino.note_rettifica_riga',
                      'magazzino.note_trasferimento', 'magazzino.note_trasferimento_riga']
                  LOOP
                      EXECUTE format('GRANT SELECT ON TABLE %s TO zeroerp_app', v_tabella);
                      EXECUTE format('REVOKE INSERT, UPDATE, DELETE ON TABLE %s FROM zeroerp_app', v_tabella);
                  END LOOP;
              END
              $porta$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Senza togliere le voci dal loop 20260205-41 e dal provisioning la
              -- passata ci_apply successiva richiude la porta.
              DO $riapri$
              DECLARE
                  v_tabella text;  -- un nome qualificato da format(): nessuna colonna
              BEGIN
                  FOREACH v_tabella IN ARRAY ARRAY[
                      'magazzino.magazzini', 'magazzino.ubicazioni', 'magazzino.lotti',
                      'magazzino.assets', 'magazzino.eventi_assets',
                      'magazzino.note',
                      'magazzino.note_asset', 'magazzino.note_evento_asset',
                      'magazzino.note_inventario', 'magazzino.note_inventario_riga',
                      'magazzino.note_movimento',
                      'magazzino.note_rettifica', 'magazzino.note_rettifica_riga',
                      'magazzino.note_trasferimento', 'magazzino.note_trasferimento_riga']
                  LOOP
                      EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE %s TO zeroerp_app', v_tabella);
                  END LOOP;
              END
              $riapri$;
