# GRANT — dbops.vw_audit_log_scrittori_fuori_perimetro a zeroerp_app
#
# Il pgTAP gira come l'applicazione e il digest legge le viste di presidio come
# l'applicazione: senza SELECT la vista sarebbe un cancello che nessuno può
# guardare. Su dev il loop `ci_apply` non gira da solo: questo forward lo dà
# subito. Idempotente, salta se il ruolo manca. Stessa forma di 20260904-35.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260911-33-grant-vw-audit-log-scrittori-fuori-perimetro-app-mctit.yaml

  - changeSet:
      id: 20260911-33-grant-vw-audit-log-scrittori-fuori-perimetro-app
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        GRANT SELECT a zeroerp_app su dbops.vw_audit_log_scrittori_fuori_perimetro:
        il pgTAP e il digest la leggono come l'applicazione. Idempotente.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: dbops
            viewName: vw_audit_log_scrittori_fuori_perimetro
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $grant$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                                  WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                      RETURN;
                  END IF;
                  GRANT SELECT ON dbops.vw_audit_log_scrittori_fuori_perimetro TO zeroerp_app;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $revoke$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app')
                     AND to_regclass('dbops.vw_audit_log_scrittori_fuori_perimetro') IS NOT NULL THEN
                      REVOKE SELECT ON dbops.vw_audit_log_scrittori_fuori_perimetro FROM zeroerp_app;
                  END IF;
              END
              $revoke$;
