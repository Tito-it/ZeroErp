# FK ui.lista_preferenza_utente.auth_user_id -> django.auth_user.
#
# Posizionato in 90_end perche' django.auth_user e' creata da
# Django migrate, che gira dopo Liquibase. Pattern identico a
# 20260403-14-fk-parameter-overrides-django-mctit.yaml.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260506-08-fk-ui-preferenza-auth-user-mctit.yaml

  - changeSet:
      id: 20260506-08-01-fk-ui-preferenza-auth-user
      author: mctit
      comment: "FK auth_user_id -> django.auth_user su ui.lista_preferenza_utente"
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                schemaName: django
                tableName: auth_user
            - tableExists:
                schemaName: ui
                tableName: lista_preferenza_utente
            - columnExists:
                schemaName: ui
                tableName: lista_preferenza_utente
                columnName: auth_user_id
            - not:
                - foreignKeyConstraintExists:
                    schemaName: ui
                    foreignKeyName: fk_lista_preferenza_utente_auth_user
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: ui
            baseTableName: lista_preferenza_utente
            baseColumnNames: auth_user_id
            constraintName: fk_lista_preferenza_utente_auth_user
            referencedTableSchemaName: django
            referencedTableName: auth_user
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: ui
            baseTableName: lista_preferenza_utente
            constraintName: fk_lista_preferenza_utente_auth_user
