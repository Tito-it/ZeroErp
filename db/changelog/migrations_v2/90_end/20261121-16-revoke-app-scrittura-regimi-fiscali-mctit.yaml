# ------------------------------------------------------------
# LA PORTA DEL CATALOGO DEI REGIMI FISCALI
#   A zeroerp_app solo SELECT su config.regimi_fiscali.
#
# -- PERCHE' --------------------------------------------------------------
#   D-8 (Tid 2026-11-22, brief-db-fornitore-doppioni-del-soggetto §7.4): la
#   Q10 del 2026-11-14 (90_end/20261115-98) applicata a un vocabolario della
#   stessa forma. Il catalogo lo possiede il CSV (mirror 80_data/20261001-15),
#   il codice RF e' quello del tracciato FatturaPA, e il significato lo leggono
#   le funzioni (iva_per_cassa, annotazione_documento): una riga scritta
#   dall'applicazione sarebbe un valore che nessun codice onora.
#   config.tabelle_gestibili: lookup si', pannello no.
#   ⭐ Con questa porta il BLOCK ATTIVO del regime (20261121-10 ... -15) lo puo'
#   far scattare solo il migratore, come dice il motivo di
#   db/pgtap/dbops/test-automazione-attivo-inclusioni-v1.sql.
#
# ── 🔴 TRE SEDI (linee-guida §11.8) ─────────────────────────────────
#   · QUESTO changeSet (subito su dev);
#   · v_tabelle_sola_lettura_app del loop 90_end/ci_apply/20260205-41;
#   · il blocco «POSTURA DICHIARATA» di scripts/sql/provision_zeroerp.sql.
#   Le tiene allineate db/pgtap/config/test-regimi-fiscali-sola-lettura-v1.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261121-16-revoke-app-scrittura-regimi-fiscali-mctit.yaml

  - changeSet:
      id: 20261121-16-revoke-app-scrittura-regimi-fiscali
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La porta del catalogo dei regimi fiscali: a zeroerp_app SELECT soltanto (lo scrive il
        mirror del CSV). Postura resa stabile dal loop 20260205-41 e dal provisioning.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $porta$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'Ruolo zeroerp_app non presente: skip porta dei regimi fiscali.';
                      RETURN;
                  END IF;

                  GRANT SELECT ON TABLE config.regimi_fiscali TO zeroerp_app;
                  REVOKE INSERT, UPDATE, DELETE ON TABLE config.regimi_fiscali FROM zeroerp_app;
              END
              $porta$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Senza togliere la voce dal loop 20260205-41 e dal provisioning la
              -- passata ci_apply successiva richiude la porta.
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE config.regimi_fiscali TO zeroerp_app;
