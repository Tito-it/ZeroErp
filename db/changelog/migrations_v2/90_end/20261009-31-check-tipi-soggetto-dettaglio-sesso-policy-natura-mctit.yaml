# SOLO UNA PERSONA FISICA PUO' AVERE UN SESSO
#   Brief: brief-db-sesso-senza-default (§3 D2-D3, §4.3 ultimo punto)
#
# -- LA REGOLA ---------------------------------------------------------
#   sesso_policy dice, per ogni natura di dettaglio, se il sesso e'
#   obbligatorio, facoltativo o vietato. La configurazione non deve poter
#   dire il falso sul modello: una societa' o un ente non ha un sesso (NONE),
#   una persona fisica si' (REQUIRED o OPTIONAL). Un CHECK di riga, perche'
#   natura base e policy stanno sulla stessa riga:
#     (tipo_soggetto_id = 'PF') = (sesso_policy <> 'NONE')
#
# -- ⛔ PERCHE' IN 90_end -----------------------------------------------
#   La colonna nasce in 00_schema (20261009-19) con DEFAULT 'NONE', e i
#   valori veri arrivano dal mirror del CSV in 80_data (20250717-12). Su
#   dbdev, fra i due, PR e DI valgono NONE: un CHECK nato in 00_schema
#   fermerebbe il migrate. Qui il mirror e' gia' passato.
#   ⚠️ Se l'ALTER fallisse, il CSV dice una policy che contraddice la
#   natura: va corretto il CSV, non tolto il vincolo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261009-31-check-tipi-soggetto-dettaglio-sesso-policy-natura-mctit.yaml

  - changeSet:
      id: 20261009-31-check-tipi-soggetto-dettaglio-sesso-policy-natura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CHECK chk_tipi_soggetto_dettaglio_sesso_policy_natura: solo una natura base PF ha una
        sesso_policy diversa da NONE. In 90_end perche' i valori arrivano dal CSV in 80_data.
        Brief: brief-db-sesso-senza-default.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: config, tableName: tipi_soggetto_dettaglio, columnName: sesso_policy }
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_constraint c
                    JOIN pg_catalog.pg_class r ON r.oid = c.conrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = r.relnamespace
                   WHERE n.nspname = 'config' AND r.relname = 'tipi_soggetto_dettaglio'
                     AND c.conname = 'chk_tipi_soggetto_dettaglio_sesso_policy_natura';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.tipi_soggetto_dettaglio
                  ADD CONSTRAINT chk_tipi_soggetto_dettaglio_sesso_policy_natura
                  CHECK ((tipo_soggetto_id = 'PF') = (sesso_policy <> 'NONE'::config.presenza_policy_enum));
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.tipi_soggetto_dettaglio
                  DROP CONSTRAINT IF EXISTS chk_tipi_soggetto_dettaglio_sesso_policy_natura;
