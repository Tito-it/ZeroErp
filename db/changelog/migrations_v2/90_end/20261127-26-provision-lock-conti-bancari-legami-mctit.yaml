# PROVISIONA SUBITO I LOCK DEI CONTI E DEI LEGAMI
#   anagrafiche.conti_bancari.iban                    -> E_CONTO_BANCARIO_IBAN_IMMUTABILE
#   anagrafiche.soggetti_conti_bancari: soggetto_id, conto_bancario_id, uso
#   anagrafiche.soggetti_ruoli_conti_bancari: soggetto_ruolo_id,
#     conto_bancario_id, uso, istanza_utility_id      -> E_CONTO_LEGAME_IMMUTABILE
#   Brief: brief-db-revisione-anagrafiche §25.10 (D-T8a-4, D-T8a-4 bis, D-T8a-5)
#
# -- PERCHE' SUBITO ------------------------------------------------------------
#   Le righe sono in 80_data/sql/dbops/automation_lock_columns.csv, i codici
#   nei due CSV dei codici. Su dbdev il ci_apply non rigira le automazioni (il
#   job dei lock e' serale): senza questo passo le colonne resterebbero
#   modificabili fino alla sera, e il pgTAP del giro rosso. Da zero il
#   ci_apply le monta comunque; il runner converge, e rigirarlo non fa danni.
#
# -- LA FORMA --------------------------------------------------------------------
#   Si chiama il RUNNER, non si scrive un CREATE TRIGGER a mano (stessa scelta
#   di 20261121-09). Solo lo schema anagrafiche. Il runner crea
#   trg_<t>_a10_lock_columns_upd sulle tre tabelle: sul conto viene dopo la
#   normalizzazione a01 e prima del guard IBAN-filiale a12; sui legami prima
#   del guard del predefinito a12. dbops.vw_non_editable_fields legge i
#   trigger vivi: le colonne vi compaiono senza toccare la vista.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261127-26-provision-lock-conti-bancari-legami-mctit.yaml

  - changeSet:
      id: 20261127-26-provision-lock-conti-bancari-legami
      author: mctit
      runOnChange: false
      comment: >
        Provisiona subito i lock di colonna di conti_bancari e dei due legami
        (E_CONTO_BANCARIO_IBAN_IMMUTABILE, E_CONTO_LEGAME_IMMUTABILE) chiamando
        il runner dei lock sullo schema anagrafiche.
        brief-db-revisione-anagrafiche §25.10.
      preConditions:
        - onFail: HALT
        - and:
            # Le otto righe del registro accese: senza, il runner non crea
            # niente e il changeSet sarebbe un verde a vuoto.
            - sqlCheck:
                expectedResult: 8
                sql: |
                  SELECT count(*) FROM dbops.automation_lock_columns
                   WHERE enabled IS TRUE
                     AND upper(btrim(exec_mode)) = 'AUTO'
                     AND target_schema = 'anagrafiche'
                     AND (target_table, column_name, error_code) IN (
                           ('conti_bancari', 'iban', 'E_CONTO_BANCARIO_IBAN_IMMUTABILE'),
                           ('soggetti_conti_bancari', 'soggetto_id', 'E_CONTO_LEGAME_IMMUTABILE'),
                           ('soggetti_conti_bancari', 'conto_bancario_id', 'E_CONTO_LEGAME_IMMUTABILE'),
                           ('soggetti_conti_bancari', 'uso', 'E_CONTO_LEGAME_IMMUTABILE'),
                           ('soggetti_ruoli_conti_bancari', 'soggetto_ruolo_id', 'E_CONTO_LEGAME_IMMUTABILE'),
                           ('soggetti_ruoli_conti_bancari', 'conto_bancario_id', 'E_CONTO_LEGAME_IMMUTABILE'),
                           ('soggetti_ruoli_conti_bancari', 'uso', 'E_CONTO_LEGAME_IMMUTABILE'),
                           ('soggetti_ruoli_conti_bancari', 'istanza_utility_id', 'E_CONTO_LEGAME_IMMUTABILE'));
            # I due codici vivi, o il lock risponderebbe con un segnaposto
            # irrisolto invece che con la sua frase.
            - sqlCheck:
                expectedResult: 2
                sql: |
                  SELECT count(*) FROM config.codici_errore
                   WHERE codice IN ('E_CONTO_BANCARIO_IBAN_IMMUTABILE', 'E_CONTO_LEGAME_IMMUTABILE')
                     AND (obsoleto_dal IS NULL OR obsoleto_dal > CURRENT_DATE);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              SELECT dbops.fn_run_automations_lock_columns('AUTO', ARRAY['anagrafiche'], false);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I trigger li governa il registro: per toglierli si spengono le
              -- righe di automation_lock_columns e si rigira il runner, che
              -- converge. Qui non si tocca niente.
              SELECT 1;
