# ------------------------------------------------------------
# Riallinea le sequenze IDENTITY/serial di TUTTE le tabelle dello schema config
# seedate via loadUpdateData con id ESPLICITI.
#
# Perche': loadUpdateData inserisce gli id dal CSV ma NON avanza la sequenza
# GENERATED BY DEFAULT AS IDENTITY -> la sequenza resta indietro e qualunque
# INSERT auto-id (admin CRUD, runtime) collide con la pkey. Stesso problema gia'
# sanato per ui.* (20260602-17): qui versione centralizzata e DINAMICA (copre da
# sola le tabelle config nuove, niente logica duplicata nei singoli upsert).
#
# Si mantengono gli id ESPLICITI nei seed (sono il contratto stabile per le FK
# cross-tabella, es. parameter_overrides.parameter_id): questo changeset NON
# toglie gli id, allinea solo la sequenza.
#
# Scope: solo schema config (tabelle di riferimento). NON applicare a schemi
# transazionali: setval potrebbe riportare indietro una sequenza dopo cancellazioni
# e causare riuso di id. Qui comunque e' FORWARD-ONLY (GREATEST(MAX(id), last_value)),
# quindi la sequenza non regredisce mai.
#
# runAlways + posizione 90_end (includeAll, ultima fase): gira DOPO tutti i seed
# 80_data, vedendo il MAX(id) definitivo, ad ogni deploy. Idempotente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260616-02-resync-config-identity-sequences-mctit.yaml

  - changeSet:
      id: 20260616-02-resync-config-identity-sequences
      author: mctit
      runAlways: true
      comment: >
        Riallinea (forward-only) tutte le sequenze IDENTITY/serial dello schema
        config a MAX(id), dopo i seed loadUpdateData con id espliciti. Evita
        collisioni pkey su INSERT auto-id. Dinamico: copre da solo le tabelle nuove.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                r       record;
                v_seq   text;
                v_max   bigint;
                v_curr  bigint;
              BEGIN
                -- Ogni colonna config.* con una sequence associata (identity o serial)
                FOR r IN
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name,
                         a.attname AS column_name
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  JOIN pg_attribute a ON a.attrelid = c.oid
                                     AND a.attnum > 0
                                     AND NOT a.attisdropped
                  WHERE n.nspname = 'config'
                    AND c.relkind IN ('r', 'p')
                    AND pg_get_serial_sequence(format('%I.%I', n.nspname, c.relname), a.attname) IS NOT NULL
                LOOP
                  v_seq := pg_get_serial_sequence(format('%I.%I', r.schema_name, r.table_name), r.column_name);

                  EXECUTE format('SELECT COALESCE(MAX(%I), 0) FROM %I.%I',
                                 r.column_name, r.schema_name, r.table_name)
                     INTO v_max;

                  -- Valore corrente della sequenza (per non regredire mai)
                  EXECUTE format('SELECT COALESCE(last_value, 1) FROM %s', v_seq)
                     INTO v_curr;

                  -- Solo se la tabella ha dati: forward-only -> next nextval = GREATEST(MAX, corrente) + 1
                  IF v_max > 0 THEN
                    PERFORM setval(v_seq, GREATEST(v_max, v_curr), true);
                    RAISE NOTICE 'Resync %.% (%) -> % = GREATEST(max=%, curr=%)',
                                 r.schema_name, r.table_name, r.column_name, v_seq, v_max, v_curr;
                  END IF;
                END LOOP;
              END $$;
