# ------------------------------------------------------------
# Dashboard fatturazione — indici di supporto su vendite.commesse_attivita
# (brief-design-dashboard-fatturazione §5 e §11).
#
# 1) ix_commesse_attivita_segment_key: gli EXISTS per segment_key puntuale
#    (vw_dash_fatturazione_ordini, vw_preventivi_smistamento_righe,
#    fn_list_*_da_pushare) oggi non hanno indice utilizzabile — l'unico e'
#    uq_commesse_attivita_commessa_segment (commessa_id, segment_key) con
#    commessa_id in testa, inutile per lookup su solo segment_key.
# 2) ix_commesse_attivita_sorgente_competenza: EXISTS del resolver contratti
#    (sorgente_uid + competenza_mese) e piu' in generale lookup per origine.
#    Parziale su sorgente_uid IS NOT NULL.
#
# Additivi e reversibili: nessun impatto funzionale, solo piano di esecuzione.
# Non sono indici FK (la policy dbops non li gestisce).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260703-58-create-ix-commesse-attivita-dash-fatturazione-mctit.yaml

  - changeSet:
      id: 20260703-58-create-ix-commesse-attivita-dash-fatturazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Dashboard fatturazione Fase 1: indici di supporto su commesse_attivita
        per gli EXISTS di transito (segment_key puntuale; sorgente_uid +
        competenza_mese). Additivi, IF NOT EXISTS, non-FK.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_commesse_attivita_segment_key
                ON vendite.commesse_attivita (segment_key);

              CREATE INDEX IF NOT EXISTS ix_commesse_attivita_sorgente_competenza
                ON vendite.commesse_attivita (sorgente_uid, competenza_mese)
                WHERE sorgente_uid IS NOT NULL;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP INDEX IF EXISTS vendite.ix_commesse_attivita_segment_key;
              DROP INDEX IF EXISTS vendite.ix_commesse_attivita_sorgente_competenza;
