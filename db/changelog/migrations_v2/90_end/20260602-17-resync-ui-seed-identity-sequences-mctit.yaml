# Riallinea le sequenze IDENTITY delle 3 tabelle ui.* seedate via
# loadUpdateData con id ESPLICITI (lista_definizione, lista_colonna,
# lista_preset).
#
# Perche': loadUpdateData inserisce gli id dal CSV ma NON avanza la
# sequenza GENERATED BY DEFAULT AS IDENTITY. Dopo il seed contratti
# (lista_colonna fino a id=57) la sequenza restava a 41 -> qualunque
# INSERT auto-id (CRUD admin DEF-5b, test pgTAP) collide con
# "duplicate key lista_colonna_pkey". Il problema era latente: finora la
# sequenza era driftata in avanti per i ripetuti INSERT+ROLLBACK dei test
# (le sequenze non sono transazionali), mascherando il disallineamento.
#
# runAlways: la sequenza va riportata a MAX(id) ad ogni deploy, perche'
# l'aggiunta di nuove righe seed (CSV) non modifica questo file e quindi
# runOnChange non rifrirebbe. setval(seq, MAX(id)) -> il prossimo nextval
# e' MAX(id)+1. Idempotente e sicuro.
#
# Posizione 90_end (includeAll, ultima fase): gira DOPO tutti i seed 80_data.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260602-17-resync-ui-seed-identity-sequences-mctit.yaml

  - changeSet:
      id: 20260602-17-resync-ui-seed-identity-sequences
      author: mctit
      runAlways: true
      comment: >
        Riallinea le sequenze IDENTITY di ui.lista_definizione/lista_colonna/
        lista_preset a MAX(id) dopo i seed loadUpdateData con id espliciti
        (evita collisioni pkey sugli INSERT auto-id di admin CRUD e test).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: false
            sql: |
              SELECT setval(
                       pg_get_serial_sequence('ui.lista_definizione', 'id'),
                       GREATEST((SELECT COALESCE(MAX(id), 1) FROM ui.lista_definizione), 1)
                     );
              SELECT setval(
                       pg_get_serial_sequence('ui.lista_colonna', 'id'),
                       GREATEST((SELECT COALESCE(MAX(id), 1) FROM ui.lista_colonna), 1)
                     );
              SELECT setval(
                       pg_get_serial_sequence('ui.lista_preset', 'id'),
                       GREATEST((SELECT COALESCE(MAX(id), 1) FROM ui.lista_preset), 1)
                     );
