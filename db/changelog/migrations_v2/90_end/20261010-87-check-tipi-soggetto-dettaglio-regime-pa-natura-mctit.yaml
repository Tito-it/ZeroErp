# UNA PERSONA FISICA NON E' MAI UNA PA NE' IN SPLIT PAYMENT
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte A, §1.3, A-4)
#
# -- LA REGOLA ---------------------------------------------------------
#   cliente_pa_ammesso e split_payment_ammesso (20261010-85) sono
#   configurazione, ma una parte della regola e' legge, non scelta: una
#   persona fisica, privato o ditta individuale, non e' mai una Pubblica
#   Amministrazione e non e' mai in scissione dei pagamenti (art. 17-ter
#   DPR 633/1972). Un CHECK di riga, perche' natura base e flag stanno sulla
#   stessa riga, gemello di chk_tipi_soggetto_dettaglio_sesso_policy_natura:
#     tipo_soggetto_id <> 'PF' OR (NOT cliente_pa_ammesso AND NOT split_payment_ammesso)
#   A senso unico: per PG ed ENC i due flag restano configurazione (A-2).
#
# -- ⛔ PERCHE' IN 90_end -----------------------------------------------
#   Le colonne nascono in 00_schema (20261010-85) con DEFAULT false, e i
#   valori veri arrivano dal mirror del CSV in 80_data (20250717-12). Per
#   una PF il default e' gia' il valore giusto, quindi oggi un CHECK in
#   00_schema reggerebbe; resta qui per la stessa ragione del gemello: il
#   vincolo giudica cio' che il CSV dice, e il CSV arriva dopo.
#   ⚠️ Se l'ALTER fallisse, il CSV dice un flag che contraddice la natura:
#   va corretto il CSV, non tolto il vincolo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261010-87-check-tipi-soggetto-dettaglio-regime-pa-natura-mctit.yaml

  - changeSet:
      id: 20261010-87-check-tipi-soggetto-dettaglio-regime-pa-natura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CHECK chk_tipi_soggetto_dettaglio_regime_pa_natura: una natura base PF non ammette ne'
        cliente_pa ne' split_payment. In 90_end perche' i valori arrivano dal CSV in 80_data.
        Brief: brief-db-dati-fiscali-e-societari-del-soggetto (A-4).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: config, tableName: tipi_soggetto_dettaglio, columnName: cliente_pa_ammesso }
            - columnExists:
                { schemaName: config, tableName: tipi_soggetto_dettaglio, columnName: split_payment_ammesso }
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_constraint c
                    JOIN pg_catalog.pg_class r ON r.oid = c.conrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = r.relnamespace
                   WHERE n.nspname = 'config' AND r.relname = 'tipi_soggetto_dettaglio'
                     AND c.conname = 'chk_tipi_soggetto_dettaglio_regime_pa_natura';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.tipi_soggetto_dettaglio
                  ADD CONSTRAINT chk_tipi_soggetto_dettaglio_regime_pa_natura
                  CHECK (tipo_soggetto_id <> 'PF' OR (NOT cliente_pa_ammesso AND NOT split_payment_ammesso));

              COMMENT ON CONSTRAINT chk_tipi_soggetto_dettaglio_regime_pa_natura ON config.tipi_soggetto_dettaglio IS
                  'Una persona fisica (natura base PF: privato, ditta individuale) non e'' mai una Pubblica Amministrazione ne'' in scissione dei pagamenti (art. 17-ter DPR 633/1972): per lei cliente_pa_ammesso e split_payment_ammesso sono false. A senso unico: per PG ed ENC sono configurazione. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (A-4).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.tipi_soggetto_dettaglio
                  DROP CONSTRAINT IF EXISTS chk_tipi_soggetto_dettaglio_regime_pa_natura;
