# brief-db-processi-automatici-identita-e-perimetro fase 2 — GRANT sulla vista
# di presidio nuova.
#
# ⚠️ Le colonne nuove di maintenance.job_run_log NON servono un GRANT: il
# privilegio a livello di TABELLA copre anche le colonne aggiunte dopo. E'
# l'opposto del GRANT per colonna, che invece non tiene: una colonna nuova
# resterebbe fuori dall'elenco e nessuno se ne accorgerebbe.
#
# Serve invece per la VISTA, che e' un oggetto nuovo — e vale la stessa nota
# della fase 1: fuori dalla CI il ruolo applicativo non riceve privilegi sugli
# oggetti nuovi, e il difetto e' invisibile da information_schema.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260904-20-grant-vw-run-senza-attore-app-mctit.yaml

  - changeSet:
      id: 20260904-20-grant-vw-run-senza-attore-app
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      comment: >
        GRANT SELECT a zeroerp_app su dbops.vw_run_senza_attore. Idempotente e
        difensivo (skip se il ruolo o la vista mancano).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $grant$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                                  WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                      RETURN;
                  END IF;
                  IF to_regclass('dbops.vw_run_senza_attore') IS NOT NULL THEN
                      GRANT SELECT ON dbops.vw_run_senza_attore TO zeroerp_app;
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DO $revoke$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                                  WHERE rolname = 'zeroerp_app') THEN
                      RETURN;
                  END IF;
                  IF to_regclass('dbops.vw_run_senza_attore') IS NOT NULL THEN
                      REVOKE SELECT ON dbops.vw_run_senza_attore FROM zeroerp_app;
                  END IF;
              END
              $revoke$;
