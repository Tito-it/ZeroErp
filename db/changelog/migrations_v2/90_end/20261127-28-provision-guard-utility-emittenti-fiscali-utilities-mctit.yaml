# RIMONTA SUBITO IL GUARD UTILITY-TIPO DI RUOLO DI emittenti_fiscali_utilities
#   trg_emittenti_fiscali_utilities_a10_guard_utility_tipo_r_cd07ac
#   Brief: brief-db-revisione-anagrafiche §25.2 (S18d), §25.10
#
# -- PERCHE' --------------------------------------------------------------------
#   20261127-13 toglie il trigger (DROP TRIGGER IF EXISTS) per portare
#   utility_id a integer: ALTER TYPE rifiuta una colonna nominata in un
#   UPDATE OF. Il trigger lo monta l'automazione GUARD_UTILITY
#   (dbops.automazione_guard_utility_tipo_ruolo), a ci_apply e di notte. Su dbdev
#   la tabella resterebbe senza guard fino alla sera: qui lo rimonta il suo
#   runner, nella stessa corsa. Da zero lo monta il ci_apply; il runner
#   converge, e rigirarlo non fa danni.
#
# -- LA FORMA --------------------------------------------------------------------
#   Si chiama il RUNNER, come 20261127-26 per i lock: niente CREATE TRIGGER a
#   mano (linee-guida-trigger, «I trigger generati»). Solo lo schema
#   anagrafiche; 'AUTO' come il registro di quella riga.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261127-28-provision-guard-utility-emittenti-fiscali-utilities-mctit.yaml

  - changeSet:
      id: 20261127-28-provision-guard-utility-emittenti-fiscali-utilities
      author: mctit
      runOnChange: false
      comment: >
        Rimonta il guard utility-tipo di ruolo di emittenti_fiscali_utilities,
        tolto da 20261127-13 per il tipo di utility_id, chiamando il runner
        GUARD_UTILITY sullo schema anagrafiche.
        brief-db-revisione-anagrafiche §25.2 (S18d).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              SELECT dbops.fn_run_automations_guard_utility('AUTO', ARRAY['anagrafiche'], false);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il trigger lo governa il registro: qui non si tocca niente.
              SELECT 1;
