# TIPO_LOTTO SOLO SUI PASSAGGI DI PROCESSO
#   Brief: brief-modello-documento-vendita §15.14 (D-4 di Tid, 2026-10-27).
#
#   meta.tipo_lotto e' una condizione del passaggio sulla colonna del lotto
#   (la giudica il guard di transizione). Su un passaggio MANUALE il lettore
#   generico dei passaggi permessi (script.fn_doc_azioni_permesse) non la
#   vedrebbe: la lista proporrebbe un verbo che il dettaglio nasconde. Il
#   vincolo rende il caso non costruibile; se un giorno servira' su un
#   passaggio manuale, crescera' il lettore, e questo vincolo si ritira con
#   lui.
#
# ⚠️ In `90_end` dopo il 20261027-49 (manuale dichiarato), per la stessa
#   ragione: le righe le scrive il seed.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261027-50-check-fiscale-transizioni-tipo-lotto-solo-processo-mctit.yaml

  - changeSet:
      id: 20261027-50-check-fiscale-transizioni-tipo-lotto-solo-processo
      author: mctit
      failOnError: true
      comment: >
        CHECK su config.stati_doc_fiscale_transizioni: meta.tipo_lotto solo sui passaggi di processo
        (manuale = false). Brief: brief-modello-documento-vendita §15.14 (D-4).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_constraint c
               WHERE c.conname = 'ck_stati_doc_fiscale_transizioni_meta_manuale_dichiarato';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.stati_doc_fiscale_transizioni
                ADD CONSTRAINT ck_stati_doc_fiscale_transizioni_tipo_lotto_solo_processo
                CHECK (NOT jsonb_exists(meta, 'tipo_lotto') OR (meta ->> 'manuale')::boolean IS FALSE);

              COMMENT ON CONSTRAINT ck_stati_doc_fiscale_transizioni_tipo_lotto_solo_processo ON config.stati_doc_fiscale_transizioni
                IS 'meta.tipo_lotto (condizione sul tipo del lotto) solo sui passaggi di processo: il lettore generico dei passaggi manuali permessi (script.fn_doc_azioni_permesse) non conosce le colonne del documento, e lista e dettaglio non devono divergere. Brief: brief-modello-documento-vendita §15.14 (D-4).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.stati_doc_fiscale_transizioni DROP CONSTRAINT IF EXISTS ck_stati_doc_fiscale_transizioni_tipo_lotto_solo_processo;
