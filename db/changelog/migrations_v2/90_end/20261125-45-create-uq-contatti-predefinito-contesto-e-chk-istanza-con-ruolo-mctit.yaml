# ------------------------------------------------------------
# anagrafiche.contatti: un predefinito per riga di contesto lo scrive un
#   indice, e un contatto d'istanza ha il ruolo.
#   D-T7b-1 e D-T7b-3 di Tid (2026-11-25), brief-db-revisione-anagrafiche §22 (S8).
#
# -- LE REGOLE ----------------------------------------------------------------------
#   - uq_contatti_predefinito_contesto: al piu' un predefinito per (soggetto,
#     ruolo, istanza). Ruolo e istanza sono facoltativi e fanno l'identita' del
#     contesto: NULLS NOT DISTINCT (linee-guida-sql §8.4-bis). Parziale
#     WHERE is_default (§8.4), come i due predefiniti del conto bancario. Prima
#     la regola stava solo nel trigger, e due contatti nati insieme in un
#     contesto vuoto nascevano predefiniti tutti e due.
#   - chk_contatti_istanza_con_ruolo: il contatto d'istanza e' il referente di
#     un ruolo per quell'istanza. Senza ruolo nessuno dei tre indici del tipo lo
#     copriva, e in script.fn_get_contatti, chiesto un ruolo, valeva come un
#     contatto del soggetto. L'istanza non ha un ruolo suo.
#
# -- PERCHE' IN 90_end (linee-guida-sql §11.14) -----------------------------------
#   Un vincolo nuovo passa da chi scrive gia' la tabella: in 80_data -44 riporta
#   le righe alla regola prima che l'indice la scriva, e da zero tutto 80_data
#   gira prima di 90_end. Scrittori censiti (2026-11-25): l'unico INSERT del
#   database e' anagrafiche.fn_crea_contatto; i seed 20260107-12 e -13 toccano
#   reparto e tipo; il backend crea i contatti d'istanza solo dal ruolo
#   (create_contatto_ruolo); le fixture dei pgTAP passano dal verbo.
#   Una riga che il CHECK rifiuta ferma il migrate col nome del vincolo: e' un
#   contatto che il modello non ammette, e chi lo trova decide a chi darlo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261125-45-create-uq-contatti-predefinito-contesto-e-chk-istanza-con-ruolo-mctit.yaml

  - changeSet:
      id: 20261125-45-create-uq-contatti-predefinito-contesto-e-chk-istanza-con-ruolo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.contatti: indice unico del predefinito per (soggetto, ruolo, istanza), NULLS NOT
        DISTINCT, WHERE is_default; CHECK del contatto d'istanza col ruolo. D-T7b-1, D-T7b-3,
        brief-db-revisione-anagrafiche §22.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE UNIQUE INDEX uq_contatti_predefinito_contesto
                  ON anagrafiche.contatti (soggetto_id, soggetto_ruolo_id, istanza_utility_id)
                  NULLS NOT DISTINCT
                  WHERE is_default;

              COMMENT ON INDEX anagrafiche.uq_contatti_predefinito_contesto
                  IS 'Al piu'' un contatto predefinito per riga di contesto (soggetto, ruolo, istanza); ruolo e istanza nulli fanno parte del contesto (NULLS NOT DISTINCT).';

              ALTER TABLE anagrafiche.contatti
                  ADD CONSTRAINT chk_contatti_istanza_con_ruolo
                  CHECK (istanza_utility_id IS NULL OR soggetto_ruolo_id IS NOT NULL);

              COMMENT ON CONSTRAINT chk_contatti_istanza_con_ruolo ON anagrafiche.contatti
                  IS 'Il contatto d''istanza e'' il referente di un ruolo per quell''istanza: con l''istanza c''e'' il ruolo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE anagrafiche.contatti DROP CONSTRAINT IF EXISTS chk_contatti_istanza_con_ruolo;
              DROP INDEX IF EXISTS anagrafiche.uq_contatti_predefinito_contesto;
