databaseChangeLog:
  - logicalFilePath: changelog/migrations/90_end/ci_apply/20250627-31-apply_apply_run_automation_all-mctit.yaml

  - changeSet:
      id: 220250627-31-apply_apply_run_automation_all
      author: mctit
      validCheckSum:
        - ANY
      comments: "esegue tutti i run di automazione(da aggiungere i futuri)"
      context: ci_apply
      preConditions:
        - onFail: CONTINUE
        - onError: HALT
        - dbms: { type: postgresql }
        - or:
            - sqlCheck:
                expectedResult: "OK"
                sql: "select case when current_setting('myapp.env', true)='ci' then 'OK' else 'NO' end"
            # - runningAs: ci_runner

      changes:
        - sql:
            splitStatements: false
            sql: |

              SELECT dbops.fn_run_automations_audit_update('CI', NULL, false);
              SELECT dbops.fn_run_automations_storico_provision('CI', NULL, false);
              SELECT dbops.fn_run_automations_storico('CI', NULL, false);
              SELECT dbops.fn_run_automations_tx_id('CI', NULL, false);
              SELECT dbops.fn_run_automations_attivo('CI', NULL, false);
              SELECT dbops.fn_run_automations_lock_columns('CI', NULL, false);
              SELECT dbops.fn_run_automations_delete_block('CI', NULL, false);
              SELECT dbops.fn_seed_automazione_guard_utility_tipo_ruolo(NULL);
              SELECT dbops.fn_apply_automazione_guard_utility_tipo_ruolo('CI', false);

  - changeSet:
      id: 9099-tag-after-automations-ci
      author: ci
      context: ci_apply
      changes:
        - tagDatabase: { tag: applied-automations-ci }
