# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# GRANT RUNTIME A `zeroerp_app` — una RETE che converge, non una migrazione.
#
# `runOnChange` + `validCheckSums: ANY` in `ci_apply`: gira a ogni passata di
# quel contesto (in CI a ogni build, su dev quando qualcuno digita
# `make db-ci-apply`) e riporta i privilegi dell'applicazione alla postura
# dichiarata qui. Il corpo si modifica in questo file: è il suo ciclo di vita.
#
# ── ⛔ COROLLARIO CHE NON SI VEDE SU DEV ─────────────────────────────────
#   Qualunque REVOKE a `zeroerp_app` scritto in un changeSet normale viene
#   ANNULLATO da questo loop alla passata successiva: su dev sopravvive fino
#   al prossimo `db-ci-apply` (e sembra funzionare, a lungo), in CI muore
#   nello stesso build. Successo il 2026-08-17 (`ui.lista_definizione.
#   multi_emittente`) e di nuovo trovato il 2026-09-11 sull'audit.
#   ⇒ Una postura PIÙ STRETTA del default si dichiara QUI, negli elenchi in
#   testa al blocco — E NEL PROVISIONING, che questo loop non annulla ma che
#   annulla lui.
#   🔴 QUESTO LOOP NON È L'ULTIMA PAROLA, scoperto il 2026-09-11:
#     `scripts/sql/provision_db_roles.sql` gira DOPO `--contexts=ci_apply` sia
#     in `ci-validate.yaml` sia in `ci-local.sh`, e fa `GRANT ... ON ALL TABLES`
#     / `ON ALL FUNCTIONS` a `zeroerp_app`: riapriva UPDATE/DELETE sui registri
#     e l'EXECUTE sulle porte riservate, in silenzio. Su dev non si vede (il
#     provisioning non si rilancia dopo ogni migrate). Da quel giorno il
#     provisioning porta la STESSA eccezione, e le tre sedi le tiene allineate
#     `db/pgtap/dbops/test-registri-append-only-postura-v1.sql`.
#
# ── ⭐ REGISTRI APPEND-ONLY (dal 2026-09-11) ──────────────────────────────
#   Brief: brief-db-rls-storico-scope-congelato.md §8.4
#   `dbops.audit_log` e `dbops.error_log` raccontano ciò che l'applicazione fa
#   e sbaglia. Il ruolo raccontato li legge e li aggiunge, non li riscrive né
#   li cancella: SELECT, INSERT — e REVOKE di UPDATE, DELETE.
#   La modalità sessione dell'audit (`fn_audit_begin` → `fn_audit_end`) è un
#   UPDATE del registro: riservata a chi possiede la tabella (migratore, job).
#   L'app usa `fn_audit_log_once`. Le due funzioni hanno `=X` (PUBLIC): la
#   revoca dell'EXECUTE va a PUBLIC e all'app insieme, o non toglie niente.
#   Il changeSet che agisce subito su dev è `90_end/20260911-09`; il pgTAP che
#   pinna l'esito è `db/pgtap/dbops/test-registri-append-only-postura-v1.sql`.
#
# ── ⭐ SCHEMI SENZA DELETE (dal 2026-09-11) ────────────────────────────────
#   Brief: brief-db-rls-storico-scope-congelato.md §4b.2, passo 7
#   `storico`: le shadow le scrive il trigger — INSERT della versione, UPDATE
#   che chiude la precedente — e uno snapshot non si cancella mai. All'app
#   SELECT, INSERT, UPDATE e REVOKE di DELETE; la retention è del proprietario.
#   È la stessa regola che `fn_grant_storico_shadows` applica ai ruoli batch.
#   Su dev agisce subito `dbops.fn_storico_arma_scope` (changeSet -27, poi il
#   90_end runAlways -29), che revoca il DELETE shadow per shadow; il pgTAP è
#   `db/pgtap/storico/test-storico-scope-congelato-v1.sql` (test 22).
#
# ── ⭐ LA PORTA DEL LEDGER DI MAGAZZINO (dal 2026-09-18) ────────────────────
#   Brief: brief-db-magazzino-lotto-2-motore, sezione 4.1 (D-L2-b) e 6-ter C2
#   `magazzino.movimenti` e `magazzino.valore_giacenza`: all'app SELECT
#   soltanto — scrive solo la primitiva `fn_scrivi_movimento` (SECURITY
#   DEFINER del proprietario) e `fn_ricalcola_valore_giacenza`. È la sola
#   forma in cui «scrive solo la primitiva» è un fatto e non una disciplina.
#   `magazzino.movimenti_attesi`: SELECT, INSERT, UPDATE — un blocco si
#   CHIUDE (APERTA -> CHIUSA), non si cancella: REVOKE DELETE. Due liste
#   nuove, `v_tabelle_sola_lettura_app` e `v_tabelle_senza_delete` (la forma
#   per TABELLA di `v_schemi_senza_delete`), nei rami prima del generico.
#   Il changeSet che agisce subito su dev è `90_end/20260918-15`; la terza
#   sede è il blocco «POSTURA DICHIARATA» di `provision_db_roles.sql`; il
#   pgTAP che pinna l'esito è `db/pgtap/magazzino/test-porta-ledger-v1.sql`.
#   ⭐ Dal 2026-09-24 la porta si chiude anche sulle FUNZIONI: la primitiva e il
#   ricalcolo entrano in `v_fn_riservate` (brief-db-magazzino-verbi-con-permesso,
#   P-4). Il forward su dev è `90_end/20260924-42`, la terza sede lo stesso blocco
#   del provisioning, lo stesso pgTAP pinna l'esito (test 17-18).
#
# ── ⭐ LA PORTA DELLO STATO DELLA CREDENZIALE (dal 2026-09-25) ──────────────
#   Brief: brief-db-blocco-login-per-credenziale, sezione 2.2
#   `config.credenziali` e `config.credenziali_provenienze` entrano in
#   `v_tabelle_sola_lettura_app`: tentativi, freni, blocco dell'admin e cambio
#   password obbligatorio li scrivono solo le funzioni DEFINER del proprietario.
#   Il SELECT resta: lo legge fn_check_almeno_un_super_admin_attivo (sql) dai
#   trigger INVOKER anti-lockout. Forward su dev: `90_end/20260925-24`; terza
#   sede lo stesso blocco del provisioning; pgTAP
#   `db/pgtap/config/test-credenziali-porta-v1.sql`.
#   ⭐ Dal 2026-09-25 anche le gemelle del NOME TENTATO (R-7, sezione 13):
#   `config.nomi_tentati` e `config.nomi_tentati_provenienze`, stessa porta.
#
# ── ⭐ LA PORTA DEL PANNELLO DI CONFIGURAZIONE (dal 2026-09-25) ─────────────
#   Brief: brief-db-pannello-config-verbo-generico, sezione 3.5
#   `magazzino.causali` e `config.tabelle_gestibili` entrano in
#   `v_tabelle_sola_lettura_app`: le causali le scrive il verbo generico
#   config.fn_pannello_scrivi (livello TUTTO sull'oggetto), la lista la scrive
#   solo il seed (e' una porta: il verbo scrive come proprietario su ogni tabella
#   che vi compare). Forward su dev: `90_end/20260925-34`; terza sede il blocco
#   del provisioning; pgTAP `db/pgtap/config/test-pannello-porta-v1.sql`.
#   Forward su dev `90_end/20260925-62`, stesso blocco del provisioning, stesso
#   pgTAP.
#   ⭐ Dal 2026-09-28 anche `config.aree_funzionali` (D-P9, strada A): e' uscita
#   dal pannello (D-P8) e la possiede il CSV, mirror `80_data/20260228-17`; nome e
#   ordine si cambiano li'. Forward su dev `90_end/20260928-30`, stesso blocco del
#   provisioning, stesso pgTAP (10-11).
#
# ── ⭐ IL REGISTRO DEGLI OWNER (dal 2026-09-26) ─────────────────────────────
#   Brief: brief-db-registro-owner-e-sync-riservati-al-migratore, sezione 2.2
#   `dbops.sec_functions_owner` entra in `v_tabelle_sola_lettura_app`: chi lo
#   scrive sceglie il proprietario delle DEFINER di postgres, e lo scrive solo
#   il migratore. ⚠️ La sync `dbops.fn_sync_functions_owner` NON entra in
#   `v_fn_riservate`, per scelta (D-3): e' di postgres, e l'ACL non la difende
#   (il cambio di proprietario rimappa le voci, questo loop le riscrive). La
#   difesa sta nel suo corpo (20_code/dbops/20260926-11). Forward su dev
#   `90_end/20260926-12`; terza sede il blocco del provisioning; pgTAP
#   `db/pgtap/dbops/test-sec-functions-owner-riservato-v1.sql`.
#
# ── ⭐ IL LOTTO 3 DI MAGAZZINO (dal 2026-09-28) ─────────────────────────────
#   Brief: brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 4 (P-12)
#   `magazzino.movimenti_attesi` passa da `v_tabelle_senza_delete` a
#   `v_tabelle_sola_lettura_app`: i blocchi li aprono e li liberano i verbi
#   fn_apri_blocco / fn_libera_blocco (D-L3-j). In `v_fn_riservate` le due
#   operazioni interne, `magazzino.fn_posta_ddt` e
#   `magazzino.fn_storna_movimenti_sorgente`: ci si arriva solo dai verbi.
#   Forward su dev `90_end/20260928-83`; terza sede il blocco del provisioning;
#   pgTAP `db/pgtap/magazzino/test-blocco-manuale-e-porta-lotto3-v1.sql`.
#
# ── ⭐ IL LOTTO 3-BIS DI MAGAZZINO (dal 2026-09-28) ─────────────────────────
#   Brief: brief-db-magazzino-lotto-3-bis-carico-da-reso, sezione 4 (P-11)
#   In `v_fn_riservate` il posting del reso, `magazzino.fn_posta_reso`: ci si
#   arriva solo dal verbo vendite.fn_conferma_reso (DEFINER). I due verbi del
#   reso (fn_conferma_reso, fn_annulla_reso) restano concessi all'app come
#   ogni funzione. Forward su dev `90_end/20260928-98`; terza sede il blocco
#   del provisioning; pgTAP `db/pgtap/magazzino/test-reso-carico-v1.sql`.
#
# ── ⭐ I POSTING ESCONO DAL REGISTRO (dal 2026-10-01) ────────────────────────
#   Brief: brief-db-magazzino-registro-anello-interno, sezione 3 (P-5)
#   Il registro di magazzino e' un servizio dell'anello 2 (D-1) e non legge le
#   tabelle dei documenti: i posting della bolla e del reso passano in vendite
#   (D-2). In `v_fn_riservate` le voci `magazzino.fn_posta_ddt` /
#   `magazzino.fn_posta_reso` diventano `vendite.fn_posta_ddt` /
#   `vendite.fn_posta_reso`. Forward su dev `90_end/20261001-24` (che ritira
#   anche le due del registro); terza sede il blocco del provisioning; pgTAP
#   `test-blocco-manuale-e-porta-lotto3-v1` e `test-reso-carico-v1`.
#
# ── ⭐ IL DEVICE DEL SECONDO FATTORE (dal 2026-09-29) ───────────────────────
#   Brief: brief-db-secondo-fattore-totp, sezione 3
#   `config.auth_totp_device` entra in `v_tabelle_sola_lettura_app`: anti-replay
#   sul passo e monouso dei codici di recupero li fanno rispettare i verbi
#   DEFINER script.fn_totp_*. Il SELECT resta per fn_get_totp_device (INVOKER).
#   Forward su dev `90_end/20260929-24`; terza sede il blocco del provisioning;
#   pgTAP `db/pgtap/config/test-totp-porta-v1.sql`.
#
# ── ⭐ IL CATALOGO DELLE MISURE DI PAGINA (dal 2026-09-30) ──────────────────
#   Brief: brief-db-misure-pagina-catalogo, sezione 2
#   `ui.misure_pagina` entra in `v_tabelle_sola_lettura_app`: lo possiede il
#   CSV, come `config.aree_funzionali`. Forward su dev `90_end/20260930-13`;
#   terza sede il blocco del provisioning; pgTAP
#   `db/pgtap/ui/test-misure-pagina-v1.sql`.
#
# ── ⭐ LA TRACCIA DELLE CREDENZIALI ELIMINATE (dal 2026-10-06) ──────────────
#   Brief: brief-db-elimina-credenziale-senza-veste, sezione 4.2
#   `config.credenziali_eliminate` entra in `v_tabelle_sola_lettura_app`: la
#   scrive solo il verbo DEFINER script.fn_elimina_credenziale. Il DELETE
#   dell'app su django.auth_user, tolto nello stesso giro, NON passa di qui:
#   `django` non e' fra gli schemi del loop, la sua postura sta nel
#   provisioning (linee-guida-sql §11.9). Forward su dev `90_end/20261006-15`;
#   terza sede il blocco del provisioning; pgTAP
#   `db/pgtap/config/test-elimina-credenziale-v1.sql`.
#
# ── ⭐ I DATI SOCIETARI (dal 2026-10-11) ───────────────────────────────────
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto, B-5
#   `anagrafiche.dati_societari` entra in `v_tabelle_sola_lettura_app`: la
#   scrive solo il verbo DEFINER anagrafiche.fn_scrivi_dati_societari (lo
#   chiamano fn_crea_soggetto_pg, il backend in modifica e le fixture pgTAP).
#   Forward su dev `90_end/20261011-04`; terza sede il blocco del
#   provisioning; pgTAP `db/pgtap/anagrafiche/test-fn-scrivi-dati-societari-v1.sql`.
#
# ── ⭐ L'AMBIENTE DELL'INSTALLAZIONE (dal 2026-10-16) ──────────────────────
#   Brief: brief-db-processi-accensione-per-ambiente, R-3
#   `dbops.installazione` entra in `v_tabelle_sola_lettura_app`: l'ambiente lo
#   scrive solo la fase post del provisioning, una volta. Se l'app lo potesse
#   cambiare, il controllo «il provisioning di sviluppo parte solo in
#   SVILUPPO» non reggerebbe. Forward su dev `90_end/20261016-32`; terza sede il
#   blocco del provisioning; pgTAP `db/pgtap/dbops/test-installazione-ambiente-v1.sql`.
#
# ── ⭐ LE ETICHETTE DI PROVA (dal 2026-10-18) ──────────────────────────────
#   Brief: brief-db-processi-accensione-per-ambiente, R-4 (2b-3)
#   `dbops.credenziali_di_prova` e `dbops.soggetti_di_prova` entrano in
#   `v_tabelle_sola_lettura_app`: le scrive solo il verbo dei dati di sviluppo
#   (anagrafiche.fn_provisiona_dati_di_sviluppo, DEFINER). Forward su dev
#   `90_end/20261018-61`; terza sede il blocco del provisioning; pgTAP
#   `db/pgtap/dbops/test-etichette-di-prova-v1.sql`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/ci_apply/20260205-41-apply-runtime-grants-ci-mctit.yaml

  - changeSet:
      id: 20260205-41-apply-runtime-grants-ci
      author: mctit
      context: ci_apply
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      # runAlways: true
      validCheckSums:
        - ANY
      comment: "Applica grant runtime in CI senza gestione password ruoli"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_app_role text := 'zeroerp_app';
                v_migrator_role text := 'postgres';
                v_schema text;
                v_fn record;
                v_rel record;
                -- ⭐ Registri APPEND-ONLY per l'applicazione: SELECT, INSERT e
                --   basta. Un registro modificabile da chi è auditato non è un
                --   registro. Voci `schema.tabella`, confrontate sui nomi del
                --   catalogo (non sul testo di un regclass, che dipende dal
                --   search_path). Brief: brief-db-rls-storico-scope-congelato §8.4
                v_registri_append_only text[] := ARRAY[
                  'dbops.audit_log',
                  'dbops.error_log'
                ];
                -- ⭐ Porte RISERVATE a chi possiede la tabella: la modalità
                --   sessione dell'audit (begin/end) è un UPDATE del registro.
                --   L'app usa fn_audit_log_once. Voci `schema.funzione`, tutti
                --   gli overload; la revoca va anche a PUBLIC, che ha `=X`.
                --   ⭐ Dal 2026-09-24 anche la primitiva del ledger di magazzino e il
                --   ricalcolo del valore: l'app li raggiunge SOLO dai verbi
                --   (fn_posta_inventario, fn_posta_rettifica, DEFINER), che applicano
                --   registra_magazzino. Brief: brief-db-magazzino-verbi-con-permesso §2.3.
                v_fn_riservate text[] := ARRAY[
                  'dbops.fn_audit_begin',
                  'dbops.fn_audit_end',
                  'magazzino.fn_scrivi_movimento',
                  'magazzino.fn_ricalcola_valore_giacenza',
                  -- ⭐ Dal 2026-09-28 (Lotto 3): lo storno; l'app ci arriva solo dai verbi.
                  'magazzino.fn_storna_movimenti_sorgente',
                  -- ⭐ Dal 2026-10-01 i posting della bolla e del reso stanno in vendite
                  --   (erano magazzino.fn_posta_ddt / fn_posta_reso dal 28-09): l'app ci
                  --   arriva solo da vendite.fn_cambia_stato_ddt e vendite.fn_conferma_reso.
                  --   Brief: brief-db-magazzino-registro-anello-interno (P-5).
                  'vendite.fn_posta_ddt',
                  'vendite.fn_posta_reso'
                ];
                -- ⭐ Schemi SENZA DELETE per l'applicazione: le shadow di storico le
                --   scrive il trigger (INSERT della versione, UPDATE che chiude la
                --   precedente) e uno snapshot non si cancella mai — la retention è
                --   del proprietario. Stessa regola di fn_grant_storico_shadows.
                --   Brief: brief-db-rls-storico-scope-congelato §4b.2, passo 7.
                v_schemi_senza_delete text[] := ARRAY[
                  'storico'
                ];
                -- ⭐ Tabelle in SOLA LETTURA per l'applicazione: l'app legge, scrive
                --   solo una porta del proprietario (una DEFINER, un seed, il
                --   migratore). Nata il 2026-09-18 per il ledger di
                --   magazzino e la sua copia del valore. Scrive solo la primitiva
                --   DEFINER (magazzino.fn_scrivi_movimento) e il ricalcolo: è la
                --   porta di D-L2-b. Voci `schema.tabella`.
                --   Brief: brief-db-magazzino-lotto-2-motore, sezione 4.1.
                --   ⭐ Dal 2026-09-25 anche lo stato della CREDENZIALE: scrivono solo
                --   le funzioni DEFINER del login e dei verbi di blocco; il SELECT resta
                --   per fn_check_almeno_un_super_admin_attivo (sql, chiamata da trigger
                --   INVOKER). Brief: brief-db-blocco-login-per-credenziale §2.2.
                v_tabelle_sola_lettura_app text[] := ARRAY[
                  'magazzino.movimenti',
                  'magazzino.valore_giacenza',
                  'config.credenziali',
                  'config.credenziali_provenienze',
                  'config.nomi_tentati',
                  'config.nomi_tentati_provenienze',
                  -- ⭐ Dal 2026-09-25 il PANNELLO: le causali di magazzino le scrive
                  --   il verbo config.fn_pannello_scrivi, e la lista delle tabelle
                  --   gestibili e' una porta (brief-db-pannello-config-verbo-generico §3.5).
                  'magazzino.causali',
                  'config.tabelle_gestibili',
                  -- ⭐ Dal 2026-09-28 il catalogo delle AREE: lo possiede il CSV
                  --   (D-P9, brief-db-pannello-config-verbo-generico §4.2).
                  'config.aree_funzionali',
                  -- ⭐ Dal 2026-09-26 il REGISTRO DEGLI OWNER: chi lo scrive sceglie
                  --   il proprietario delle DEFINER di postgres. Lo scrive solo il
                  --   migratore; la sync ha la sua guardia nel corpo
                  --   (brief-db-registro-owner-e-sync-riservati-al-migratore §2.2).
                  'dbops.sec_functions_owner',
                  -- ⭐ Dal 2026-09-28 (Lotto 3, D-L3-j): i blocchi di magazzino li
                  --   aprono e li liberano i verbi fn_apri_blocco / fn_libera_blocco.
                  'magazzino.movimenti_attesi',
                  -- ⭐ Dal 2026-09-29 il DEVICE DEL SECONDO FATTORE: lo scrivono solo
                  --   i verbi script.fn_totp_* (brief-db-secondo-fattore-totp §3).
                  'config.auth_totp_device',
                  -- ⭐ Dal 2026-09-30 il CATALOGO DELLE MISURE DI PAGINA: lo possiede il
                  --   CSV (brief-db-misure-pagina-catalogo §2).
                  'ui.misure_pagina',
                  -- ⭐ Dal 2026-10-06 la TRACCIA DELLE CREDENZIALI ELIMINATE: la scrive
                  --   solo script.fn_elimina_credenziale
                  --   (brief-db-elimina-credenziale-senza-veste §4.2).
                  'config.credenziali_eliminate',
                  -- ⭐ Dal 2026-10-11 i DATI SOCIETARI: li scrive solo il verbo
                  --   anagrafiche.fn_scrivi_dati_societari
                  --   (brief-db-dati-fiscali-e-societari-del-soggetto, B-5).
                  'anagrafiche.dati_societari',
                  -- ⭐ Dal 2026-10-16 l'AMBIENTE DELL'INSTALLAZIONE: lo scrive solo la
                  --   fase post del provisioning, una volta
                  --   (brief-db-processi-accensione-per-ambiente, R-3).
                  'dbops.installazione',
                  -- ⭐ Dal 2026-10-18 le ETICHETTE DI PROVA: le scrive solo il verbo
                  --   dei dati di sviluppo (brief-db-processi-accensione-per-ambiente, R-4).
                  'dbops.credenziali_di_prova',
                  'dbops.soggetti_di_prova'
                ];
                -- ⭐ Tabelle SENZA DELETE per l'applicazione (la forma per tabella
                --   di v_schemi_senza_delete): un blocco di magazzino si chiude
                --   (APERTA -> CHIUSA, D-L1-b), non si cancella.
                --   ⚠️ Dal 2026-09-28 l'elenco e' VUOTO: movimenti_attesi e' passata in
                --   sola lettura (Lotto 3, D-L3-j). La lista resta, per la prossima.
                v_tabelle_senza_delete text[] := ARRAY[]::text[];
                v_schemas text[] := ARRAY[
                  'acquisti',
                  'anagrafiche',
                  'catalogo',
                  'config',
                  'contabilita',
                  'dbops',
                  'documenti',
                  'magazzino',
                  'pagamenti',
                  'pratiche',
                  'script',
                  'storico',
                  'ui',
                  'vendite'
                ];
              BEGIN
                -- In CI il ruolo dovrebbe esistere dal bootstrap; se manca non blocchiamo la pipeline.
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_app_role) THEN
                  RAISE NOTICE 'Ruolo % non presente: skip grant runtime.', v_app_role;
                  RETURN;
                END IF;

                FOREACH v_schema IN ARRAY v_schemas LOOP
                  BEGIN
                    EXECUTE format('GRANT USAGE ON SCHEMA %I TO %I', v_schema, v_app_role);
                  EXCEPTION WHEN OTHERS THEN
                    RAISE NOTICE 'Skip GRANT USAGE su schema %: %', v_schema, SQLERRM;
                  END;

                  -- Tabelle: concedi solo sugli oggetti posseduti da current_user.
                  FOR v_rel IN
                    SELECT c.oid::regclass AS obj_sig,
                           n.nspname || '.' || c.relname AS nome_qualificato
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = v_schema
                      AND c.relkind IN ('r','p','v','m','f')
                      AND pg_get_userbyid(c.relowner) = current_user
                  LOOP
                    BEGIN
                      IF v_rel.nome_qualificato = ANY (v_registri_append_only) THEN
                        -- Registro append-only: la REVOKE è la postura, non un
                        -- rimedio. Senza questo ramo il GRANT sotto la annullerebbe.
                        EXECUTE format('GRANT SELECT, INSERT ON TABLE %s TO %I', v_rel.obj_sig, v_app_role);
                        EXECUTE format('REVOKE UPDATE, DELETE ON TABLE %s FROM %I', v_rel.obj_sig, v_app_role);
                      ELSIF v_schema = ANY (v_schemi_senza_delete) THEN
                        -- Shadow di storico: si scrive e si chiude, non si cancella.
                        EXECUTE format('GRANT SELECT, INSERT, UPDATE ON TABLE %s TO %I', v_rel.obj_sig, v_app_role);
                        EXECUTE format('REVOKE DELETE ON TABLE %s FROM %I', v_rel.obj_sig, v_app_role);
                      ELSIF v_rel.nome_qualificato = ANY (v_tabelle_sola_lettura_app) THEN
                        -- Il ledger di magazzino e la sua copia: l'app legge, scrive
                        -- la primitiva DEFINER. La REVOKE è la postura (D-L2-b).
                        EXECUTE format('GRANT SELECT ON TABLE %s TO %I', v_rel.obj_sig, v_app_role);
                        EXECUTE format('REVOKE INSERT, UPDATE, DELETE ON TABLE %s FROM %I', v_rel.obj_sig, v_app_role);
                      ELSIF v_rel.nome_qualificato = ANY (v_tabelle_senza_delete) THEN
                        -- Gli attesi di magazzino: si aprono e si chiudono, non si cancellano.
                        EXECUTE format('GRANT SELECT, INSERT, UPDATE ON TABLE %s TO %I', v_rel.obj_sig, v_app_role);
                        EXECUTE format('REVOKE DELETE ON TABLE %s FROM %I', v_rel.obj_sig, v_app_role);
                      ELSE
                        EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE %s TO %I', v_rel.obj_sig, v_app_role);
                      END IF;
                    EXCEPTION WHEN OTHERS THEN
                      RAISE NOTICE 'Skip GRANT TABLE %: %', v_rel.obj_sig, SQLERRM;
                    END;
                  END LOOP;

                  -- Sequenze: concedi solo sugli oggetti posseduti da current_user.
                  FOR v_rel IN
                    SELECT c.oid::regclass AS obj_sig
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = v_schema
                      AND c.relkind = 'S'
                      AND pg_get_userbyid(c.relowner) = current_user
                  LOOP
                    BEGIN
                      EXECUTE format('GRANT USAGE, SELECT ON SEQUENCE %s TO %I', v_rel.obj_sig, v_app_role);
                    EXCEPTION WHEN OTHERS THEN
                      RAISE NOTICE 'Skip GRANT SEQUENCE %: %', v_rel.obj_sig, SQLERRM;
                    END;
                  END LOOP;

                  -- Alcune funzioni (es. extension in public) non sono grantabili
                  -- dal ruolo corrente: concediamo EXECUTE solo sulle routine possedute.
                  FOR v_fn IN
                    SELECT
                      p.oid::regprocedure AS fn_sig,
                      p.prokind AS fn_kind,
                      n.nspname || '.' || p.proname AS nome_qualificato
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                    WHERE n.nspname = v_schema
                      AND pg_get_userbyid(p.proowner) = current_user
                  LOOP
                    IF v_fn.fn_kind = 'f' AND v_fn.nome_qualificato = ANY (v_fn_riservate) THEN
                      -- Porta riservata: la chiusura va anche a PUBLIC, che sulle
                      -- funzioni ha EXECUTE per default (`=X`). Il proprietario
                      -- esegue sempre; i grant espliciti (ruoli batch) restano.
                      EXECUTE format('REVOKE EXECUTE ON FUNCTION %s FROM PUBLIC, %I', v_fn.fn_sig, v_app_role);
                    ELSIF v_fn.fn_kind = 'p' THEN
                      EXECUTE format('GRANT EXECUTE ON PROCEDURE %s TO %I', v_fn.fn_sig, v_app_role);
                    ELSIF v_fn.fn_kind = 'f' THEN
                      EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO %I', v_fn.fn_sig, v_app_role);
                    END IF;
                  END LOOP;

                  IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_migrator_role) THEN
                    BEGIN
                      EXECUTE format(
                        'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I',
                        v_migrator_role, v_schema, v_app_role
                      );
                    EXCEPTION WHEN OTHERS THEN
                      RAISE NOTICE 'Skip ADP TABLES schema %: %', v_schema, SQLERRM;
                    END;

                    BEGIN
                      EXECUTE format(
                        'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT ON SEQUENCES TO %I',
                        v_migrator_role, v_schema, v_app_role
                      );
                    EXCEPTION WHEN OTHERS THEN
                      RAISE NOTICE 'Skip ADP SEQUENCES schema %: %', v_schema, SQLERRM;
                    END;

                    BEGIN
                      EXECUTE format(
                        'ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT EXECUTE ON FUNCTIONS TO %I',
                        v_migrator_role, v_schema, v_app_role
                      );
                    EXCEPTION WHEN OTHERS THEN
                      RAISE NOTICE 'Skip ADP FUNCTIONS schema %: %', v_schema, SQLERRM;
                    END;
                  ELSE
                    RAISE NOTICE 'Ruolo migrator % non presente: skip default privileges.', v_migrator_role;
                  END IF;
                END LOOP;
              END;
              $$;
