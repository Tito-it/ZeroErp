databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260429-20-drop-type-ruolo-sistema-mctit.yaml

  - changeSet:
      id: 20260429-20-drop-type-ruolo-sistema
      author: mctit
      comment: >
        Fase 7 step 9 (2026-04-29): DROP TYPE config.ruolo_sistema.
        Step finale della dismissione completa dell'enum legacy
        ADMIN/OPERATIVO/DISABILITATO, sostituito dal modello multi-face
        (identita_digitali.ruolo_applicativo + binding SUPER_ADMIN).

        Tutte le dipendenze sono state rimosse nei step precedenti
        di questa stessa Fase 7:
          - 20260429-11: fn_get_operatore_detail (output column ruolo_sistema)
          - 20260429-14: fn_get_user_profile (chiave JSONB ruolo_sistema)
          - 20260429-16: fn_crea_risorsa_umana v1 (parametro p_ruolo_sistema)
          - 20260429-17: fn_crea_operatore v1 (parametro p_ruolo_sistema)
          - 20260429-18: fn_get_ruolo_sistema (RETURNS config.ruolo_sistema)
          - 20260429-19: vista risorse_umane_auth_user (cast nella CASE rimossa)

        DROP TYPE non usa CASCADE: se per qualche motivo una dipendenza
        residua sfugge al censimento, vogliamo fail-fast con errore
        chiaro "type config.ruolo_sistema cannot be dropped because ..."
        invece di un drop silenzioso a cascata che rompe oggetti non
        documentati.

        Snapshot storico: storico.risorse_umane_auth_user contiene
        snapshot jsonb con la chiave 'ruolo_sistema' come text - dato
        immutabile, NON viene toccato (jsonb non ha tipi di colonna,
        quindi DROP TYPE non lo impatta).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM pg_type t
                JOIN pg_namespace n ON n.oid = t.typnamespace
               WHERE n.nspname = 'config'
                 AND t.typname = 'ruolo_sistema';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- DROP TYPE senza CASCADE: fail-fast su dipendenze residue.
              DROP TYPE config.ruolo_sistema;
      rollback:
        - sql:
            sql: |
              -- Rollback: ricreare l'enum.
              CREATE TYPE config.ruolo_sistema AS ENUM (
                  'ADMIN', 'OPERATIVO', 'DISABILITATO'
              );
              -- NB: il rollback non ricrea i consumer. Le 6 migration
              -- precedenti vanno rollbackate manualmente nell'ordine
              -- inverso (20260429-19 .. -11) per ripristinare lo stato.
