# LA PORTA DEI DATI SOCIETARI
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-5, decisione di
#   Tid del 2026-10-10). Modello: una scrittura = un verbo.
#
# ── ⭐ COSA FA ───────────────────────────────────────────────────────
#   anagrafiche.dati_societari: all'applicazione SOLO SELECT. La scrive
#   soltanto il verbo anagrafiche.fn_scrivi_dati_societari (SECURITY DEFINER
#   del proprietario, 20261010-99), che chiamano fn_crea_soggetto_pg, il
#   backend in modifica e le fixture pgTAP. Prima la scrivevano solo
#   fn_crea_soggetto_pg e l'helper pgTAP; il backend no (letto il 2026-10-10):
#   il resto dei DML dell'app non serviva a nessuno.
#   ⚠️ Il permesso NON e' nel verbo (decisione di Tid): resta al backend, come
#   per anagrafiche.soggetti. Questa postura chiude la scrittura fuori porta,
#   non aggiunge un controllo di livello.
#
# ── 🔴 TRE SEDI, COME OGNI POSTURA PIU' STRETTA (linee-guida §11.8) ──
#   · QUESTO changeSet, che agisce subito su dev;
#   · l'elenco v_tabelle_sola_lettura_app del loop 90_end/ci_apply/20260205-41;
#   · il blocco «POSTURA DICHIARATA» di scripts/sql/provision_db_roles.sql.
#   Le tiene allineate db/pgtap/anagrafiche/test-fn-scrivi-dati-societari-v1.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261011-04-revoke-app-scrittura-dati-societari-mctit.yaml

  - changeSet:
      id: 20261011-04-revoke-app-scrittura-dati-societari
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La porta dei dati societari: a zeroerp_app SELECT soltanto su anagrafiche.dati_societari.
        Scrive solo il verbo anagrafiche.fn_scrivi_dati_societari. Postura resa stabile dal loop
        20260205-41 e dal provisioning. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-5).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_scrivi_dati_societari'
                 AND p.prosecdef;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $porta$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'Ruolo zeroerp_app non presente: skip porta dei dati societari.';
                      RETURN;
                  END IF;

                  -- L'applicazione legge; scrive il verbo.
                  GRANT  SELECT                 ON TABLE anagrafiche.dati_societari TO   zeroerp_app;
                  REVOKE INSERT, UPDATE, DELETE ON TABLE anagrafiche.dati_societari FROM zeroerp_app;
              END
              $porta$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              GRANT INSERT, UPDATE, DELETE ON TABLE anagrafiche.dati_societari TO zeroerp_app;
