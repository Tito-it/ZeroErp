# PROVISIONA SUBITO I LOCK DEL POSTO DI UN PRESET
#   ui.lista_preset     lista_id, ambito, profilo_accesso_id, emittente_fiscale_id
#   ui.dashboard_preset dashboard_id, ambito, profilo_accesso_id, emittente_fiscale_id
#   -> E_UI_PRESET_POSTO_IMMUTABILE
#   Brief: brief-db-revisione-ui (giro 2b: U14, il quarto legame).
#   Le righe sono in 80_data/sql/dbops/automation_lock_columns.csv, il codice
#   nei due CSV dei codici.
#
# -- PERCHE' --------------------------------------------------------------------------
#   Il posto di un preset (la lista o la dashboard, l'ambito, il profilo,
#   l'azienda) e' la sua identita': lo leggono la scelta del preset di base
#   (ui.fn_preset_di_base), l'UNIQUE di un preset acceso per posto, le FK
#   composite della composizione e della preferenza. Cambiarlo spostava il preset
#   sotto le preferenze che lo salvavano come base, e lo rifiutava solo il
#   servizio del BE. Un preset nel posto sbagliato si spegne e se ne crea un
#   altro. Il seed riscrive le colonne del software uguali: il lucchetto giudica
#   il valore, e passa.
#
# -- LA FORMA -------------------------------------------------------------------------
#   Si chiama il RUNNER, non si scrive un CREATE TRIGGER a mano (come
#   20261116-46). Solo lo schema ui. Su dbdev il job dei lock e' serale: senza
#   questo passo il lucchetto arriverebbe la sera, e il pgTAP del giro sarebbe
#   rosso. Da zero il ci_apply lo monta comunque.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261120-35-provision-lock-ui-preset-posto-mctit.yaml

  - changeSet:
      id: 20261120-35-provision-lock-ui-preset-posto
      author: mctit
      runOnChange: false
      comment: >
        Provisiona subito i lock di colonna sul posto dei preset (ui.lista_preset, ui.dashboard_preset)
        chiamando il runner dei lock sullo schema ui. Brief: brief-db-revisione-ui (giro 2b, U14).
      preConditions:
        - onFail: HALT
        - and:
            # Le otto righe del registro devono esserci e essere accese: senza,
            # il runner non crea niente e il changeSet sarebbe un verde a vuoto.
            - sqlCheck:
                expectedResult: 8
                sql: |
                  SELECT count(*) FROM dbops.automation_lock_columns
                   WHERE enabled IS TRUE
                     AND upper(btrim(exec_mode)) = 'AUTO'
                     AND target_schema = 'ui'
                     AND target_table IN ('lista_preset', 'dashboard_preset')
                     AND error_code = 'E_UI_PRESET_POSTO_IMMUTABILE';
            # Il codice deve essere vivo, o il lock risponderebbe con un
            # segnaposto irrisolto invece che con la sua frase.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM config.codici_errore
                   WHERE codice = 'E_UI_PRESET_POSTO_IMMUTABILE'
                     AND (obsoleto_dal IS NULL OR obsoleto_dal > CURRENT_DATE);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              SELECT dbops.fn_run_automations_lock_columns('AUTO', ARRAY['ui'], false);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il trigger lo governa il registro: per toglierlo si spengono le
              -- righe di automation_lock_columns e si rigira il runner, che
              -- converge. Qui non si tocca niente.
              SELECT 1;
