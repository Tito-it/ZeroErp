# LE TABELLE CHE DANNO L'ACCESSO, IN SOLA LETTURA PER L'APP
#   config.user_emittenti_fiscali, config.profili_accesso_bindings,
#   config.profili_accesso, config.profili_accesso_aree, config.profili_accesso_azioni
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
# -- PERCHE' -------------------------------------------------------------
#   Lo scope dice per quale azienda lavora un operatore, il legame quale
#   profilo ha, il contenuto del profilo che cosa il profilo concede. Scritte
#   come app, ognuna da' un accesso senza passare dal guard: un INSERT di un
#   legame verso il profilo SUPER_ADMIN fa un SUPER_ADMIN. Le scrivono i verbi
#   DEFINER col guard del SUPER_ADMIN (20261124-02, 20261126-02 … -07, -10, -14),
#   il provisioning di sviluppo e il primo amministratore (DEFINER), le fixture
#   dei pgTAP col cancello dei dati di sviluppo (20261126-15, -16). Il backend
#   non le scrive senza un verbo (censimento del 2026-11-26, brief §14.5 e §14.7).
#
# -- LE SEDI -------------------------------------------------------------
#   Le TRE sedi di linee-guida-sql §11.8:
#     1. questo forward, per dbdev;
#     2. il loop 90_end/ci_apply/20260205-41, voci in v_tabelle_sola_lettura_app;
#     3. scripts/sql/provision_zeroerp.sql, blocco «LE TABELLE CHE DANNO L'ACCESSO».
#   Presidio: config/test-porta-tabelle-accesso-v1 (gira come app).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261126-24-revoke-app-scrittura-scope-e-profili-mctit.yaml

  - changeSet:
      id: 20261126-24-revoke-app-scrittura-scope-e-profili
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le cinque tabelle che danno l'accesso (scope, legami e contenuto dei profili): a zeroerp_app SELECT soltanto, le scrivono i verbi. Postura resa stabile dal loop 20260205-41 e dal provisioning. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $porta$
              DECLARE
                  v_tabella text;  -- un nome qualificato da format(): nessuna colonna
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'Ruolo zeroerp_app non presente: skip porta delle tabelle che danno l''accesso.';
                      RETURN;
                  END IF;

                  FOREACH v_tabella IN ARRAY ARRAY[
                      'config.user_emittenti_fiscali',
                      'config.profili_accesso_bindings',
                      'config.profili_accesso',
                      'config.profili_accesso_aree',
                      'config.profili_accesso_azioni']
                  LOOP
                      EXECUTE format('GRANT SELECT ON TABLE %s TO zeroerp_app', v_tabella);
                      EXECUTE format('REVOKE INSERT, UPDATE, DELETE ON TABLE %s FROM zeroerp_app', v_tabella);
                  END LOOP;
              END
              $porta$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Senza togliere le voci dal loop 20260205-41 e dal provisioning la
              -- passata ci_apply successiva richiude la porta.
              DO $riapri$
              DECLARE
                  v_tabella text;  -- un nome qualificato da format(): nessuna colonna
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RETURN;
                  END IF;

                  FOREACH v_tabella IN ARRAY ARRAY[
                      'config.user_emittenti_fiscali',
                      'config.profili_accesso_bindings',
                      'config.profili_accesso',
                      'config.profili_accesso_aree',
                      'config.profili_accesso_azioni']
                  LOOP
                      EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE %s TO zeroerp_app', v_tabella);
                  END LOOP;
              END
              $riapri$;
