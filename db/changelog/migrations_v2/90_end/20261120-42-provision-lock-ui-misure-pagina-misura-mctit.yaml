# PROVISIONA SUBITO IL LOCK DELLA MISURA DEL CATALOGO
#   ui.misure_pagina misura -> E_UI_MISURA_PAGINA_IMMUTABILE
#   Brief: brief-db-revisione-ui (giro 3: U17).
#   La riga e' in 80_data/sql/dbops/automation_lock_columns.csv, il codice
#   nei due CSV dei codici.
#
# -- PERCHE' --------------------------------------------------------------------------
#   La misura e' la chiave naturale del catalogo: la citano per numero la FK dei
#   preset e le preferenze di lista. Riscriverla, quando nessun preset la cita,
#   lasciava orfane le preferenze e spostava uso_default su un numero nuovo.
#   Una misura nuova e' una riga nuova; il ritiro della vecchia la toglie dalle
#   preferenze (20261120-40). Il mirror del CSV riscrive la misura uguale: il
#   lucchetto giudica il valore, e passa.
#
# -- LA FORMA -------------------------------------------------------------------------
#   Si chiama il RUNNER, come 20261120-35: solo lo schema ui. Su dbdev il job dei
#   lock e' serale; da zero il ci_apply lo monta comunque.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261120-42-provision-lock-ui-misure-pagina-misura-mctit.yaml

  - changeSet:
      id: 20261120-42-provision-lock-ui-misure-pagina-misura
      author: mctit
      runOnChange: false
      comment: >
        Provisiona subito il lock di colonna su ui.misure_pagina.misura chiamando il runner dei lock sullo
        schema ui. Brief: brief-db-revisione-ui (giro 3, U17).
      preConditions:
        - onFail: HALT
        - and:
            # La riga del registro deve esserci ed essere accesa: senza,
            # il runner non crea niente e il changeSet sarebbe un verde a vuoto.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM dbops.automation_lock_columns
                   WHERE enabled IS TRUE
                     AND upper(btrim(exec_mode)) = 'AUTO'
                     AND target_schema = 'ui'
                     AND target_table = 'misure_pagina'
                     AND column_name = 'misura'
                     AND error_code = 'E_UI_MISURA_PAGINA_IMMUTABILE';
            # Il codice deve essere vivo, o il lock risponderebbe con un
            # segnaposto irrisolto invece che con la sua frase.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM config.codici_errore
                   WHERE codice = 'E_UI_MISURA_PAGINA_IMMUTABILE'
                     AND (obsoleto_dal IS NULL OR obsoleto_dal > CURRENT_DATE);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              SELECT dbops.fn_run_automations_lock_columns('AUTO', ARRAY['ui'], false);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il trigger lo governa il registro: per toglierlo si spengono le
              -- righe di automation_lock_columns e si rigira il runner, che
              -- converge. Qui non si tocca niente.
              SELECT 1;
