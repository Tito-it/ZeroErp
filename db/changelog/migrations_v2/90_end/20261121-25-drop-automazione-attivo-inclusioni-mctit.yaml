# Ritiro di dbops.automazione_attivo_inclusioni (00_schema 20261121-10).
#
# ── PERCHE' (Tid, 2026-11-21, D-1 «a») ────────────────────────────────
#   Il registro elencava le FK senza _id che l'automazione ATTIVO legava
#   comunque: una pezza per inclusione sopra il filtro _id. Il filtro non
#   c'e' piu' (dbops.fn_attivo_fk_esclusa, 20261121-21): ogni FK si lega,
#   chi non si lega sta nel registro delle eccezioni. Le sue due righe,
#   regime_fiscale_rf di emittenti_fiscali e fornitori, si legano da sole:
#   il BLOCK sul regime resta voluto (D-7 «2» di
#   brief-db-fornitore-doppioni-del-soggetto), e il provision 20261121-24
#   lo rimonta senza registro. Brief: brief-db-attivo-fk-senza-suffisso-id §5.
#
# ── PERCHE' IN 90_end (linee-guida-sql §11.14) ────────────────────────
#   L'ultimo changeSet che pretende la tabella e' 90_end 20261121-15 (una
#   preCondition HALT sulle sue due righe); prima ancora il mirror di
#   80_data 20261121-14. Un DROP in 00_schema o 20_code girerebbe prima di
#   loro e il migrate da zero si fermerebbe. Qui, con un nome che viene
#   dopo, gira per ultimo.
#
# ⛔ IL MIRROR E IL CSV RESTANO, E NON SI TOCCANO.
#   80_data 20261121-14 e' gia' applicato e ha runOnChange: un CSV o uno
#   YAML cambiati lo farebbero rigirare, e la sua preCondition HALT
#   fermerebbe il migrate su una tabella che non c'e' piu'. Restano come
#   storia: da zero caricano due righe che questo changeSet toglie.
#
# I lettori (censiti il 2026-11-22 su pg_depend e sul testo delle funzioni):
#   solo dbops.fn_attivo_fk_esclusa, che da 20261121-21 non la legge piu'.
#   La preCondition lo verifica su pg_depend; nessuna vista, nessun pgTAP
#   dopo questo giro (dbops/test-automazione-attivo-inclusioni-v1 e'
#   riscritto senza il registro).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261121-25-drop-automazione-attivo-inclusioni-mctit.yaml

  - changeSet:
      id: 20261121-25-drop-automazione-attivo-inclusioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Ritira dbops.automazione_attivo_inclusioni: col filtro _id tolto (20261121-21) ogni FK
        si lega, e il registro per inclusione non ha piu' niente da dire.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: automazione_attivo_inclusioni
            # Nessuna funzione o vista dipende piu' dalla tabella.
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT count(*) FROM pg_depend d
                   WHERE d.refclassid = 'pg_class'::regclass
                     AND d.refobjid   = 'dbops.automazione_attivo_inclusioni'::regclass
                     AND d.classid IN ('pg_proc'::regclass, 'pg_rewrite'::regclass);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE dbops.automazione_attivo_inclusioni;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La forma di 00_schema 20261121-10 e le due righe del suo CSV.
              CREATE TABLE dbops.automazione_attivo_inclusioni (
                  id             integer GENERATED BY DEFAULT AS IDENTITY
                                 CONSTRAINT pk_automazione_attivo_inclusioni PRIMARY KEY,
                  schema_figlia  text        NOT NULL,
                  tabella_figlia text        NOT NULL,
                  colonna_fk     text        NOT NULL,
                  motivo         text        NOT NULL,
                  data_insert    timestamptz NOT NULL DEFAULT now(),
                  user_insert    text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_automazione_attivo_inclusioni_fk
                      UNIQUE (schema_figlia, tabella_figlia, colonna_fk),
                  CONSTRAINT chk_automazione_attivo_inclusioni_senza_id
                      CHECK (lower(colonna_fk) NOT LIKE '%_id'),
                  CONSTRAINT chk_automazione_attivo_inclusioni_motivo
                      CHECK (btrim(motivo) <> '')
              );
              INSERT INTO dbops.automazione_attivo_inclusioni (schema_figlia, tabella_figlia, colonna_fk, motivo)
              VALUES ('anagrafiche', 'emittenti_fiscali', 'regime_fiscale_rf',
                      'Un regime fiscale spento non si assegna, e uno in uso non si spegne (ripristino di 90_end 20261121-25).'),
                     ('anagrafiche', 'fornitori', 'regime_fiscale_rf',
                      'Un regime fiscale spento non si assegna, e uno in uso non si spegne (ripristino di 90_end 20261121-25).');
