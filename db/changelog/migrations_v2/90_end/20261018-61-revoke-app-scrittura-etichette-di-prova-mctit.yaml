# LE ETICHETTE DI PROVA LE SCRIVE SOLO IL VERBO
#   Brief: brief-db-processi-accensione-per-ambiente (R-4, 2b-3)
#
# ── ⭐ COSA FA ───────────────────────────────────────────────────────
#   dbops.credenziali_di_prova e dbops.soggetti_di_prova: all'applicazione
#   SOLO SELECT. Le scrive soltanto il verbo dei dati di sviluppo
#   (anagrafiche.fn_provisiona_dati_di_sviluppo, SECURITY DEFINER), che e'
#   l'unica porta: «solo dal verbo» regge solo se l'app non le scrive da se'.
#
# ── 🔴 TRE SEDI, COME OGNI POSTURA PIU' STRETTA (linee-guida §11.8) ──
#   · QUESTO changeSet, che agisce subito su dev;
#   · l'elenco v_tabelle_sola_lettura_app del loop 90_end/ci_apply/20260205-41;
#   · il blocco «POSTURA DICHIARATA» della fase post di
#     scripts/sql/provision_zeroerp.sql.
#   Le tiene allineate db/pgtap/dbops/test-etichette-di-prova-v1.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261018-61-revoke-app-scrittura-etichette-di-prova-mctit.yaml

  - changeSet:
      id: 20261018-61-revoke-app-scrittura-etichette-di-prova
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le etichette di prova: a zeroerp_app SELECT soltanto su dbops.credenziali_di_prova e
        dbops.soggetti_di_prova. Le scrive solo il verbo dei dati di sviluppo. Postura resa stabile
        dal loop 20260205-41 e dal provisioning. Brief: brief-db-processi-accensione-per-ambiente (R-4).
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: dbops, tableName: credenziali_di_prova }
        - tableExists: { schemaName: dbops, tableName: soggetti_di_prova }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $porta$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'Ruolo zeroerp_app non presente: skip porta delle etichette di prova.';
                      RETURN;
                  END IF;

                  -- L'applicazione legge; scrive il verbo.
                  GRANT  SELECT                 ON TABLE dbops.credenziali_di_prova TO   zeroerp_app;
                  REVOKE INSERT, UPDATE, DELETE ON TABLE dbops.credenziali_di_prova FROM zeroerp_app;
                  GRANT  SELECT                 ON TABLE dbops.soggetti_di_prova    TO   zeroerp_app;
                  REVOKE INSERT, UPDATE, DELETE ON TABLE dbops.soggetti_di_prova    FROM zeroerp_app;
              END
              $porta$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              GRANT INSERT, UPDATE, DELETE ON TABLE dbops.credenziali_di_prova TO zeroerp_app;
              GRANT INSERT, UPDATE, DELETE ON TABLE dbops.soggetti_di_prova TO zeroerp_app;
