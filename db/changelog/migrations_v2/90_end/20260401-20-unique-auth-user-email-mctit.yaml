# Liquibase changelog per Zero ERP
#
# Indice univoco parziale su auth_user.email.
# Posizionato in 90_end perche' la tabella auth_user viene
# creata da Django migrate, che gira dopo le migrazioni
# Liquibase 00_schema/20_code/80_data.
#
# Esclude email vuote (WHERE email != '') per consentire
# utenti tecnici/servizio senza email.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260401-20-unique-auth-user-email-mctit.yaml

  - changeSet:
      id: 20260401-20-unique-auth-user-email
      author: mctit
      comment: >
        Indice univoco parziale su auth_user.email per impedire
        email duplicate. Escluse email vuote.

      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: django
            tableName: auth_user

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- Indice univoco parziale: auth_user.email
              --
              -- Scopo: impedire la registrazione di email duplicate tra
              --        gli utenti del sistema. Le email vuote sono escluse
              --        per consentire utenti tecnici senza email.
              --
              -- Posizionamento: 90_end perche' auth_user e' gestita da
              --                 Django migrate (schema django/public).
              -- ==========================================================
              CREATE UNIQUE INDEX ix_auth_user_email_unique
                ON django.auth_user (email)
                WHERE email != '';
