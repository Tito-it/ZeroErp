# ------------------------------------------------------------
# Riallinea le sequenze IDENTITY di ui.widget e ui.dashboard_preset dopo i seed
# con id espliciti (20260722-02 e 20260722-04).
#
# E' la responsabilita' (b) annunciata nelle note del brief DB §6: un
# loadUpdateData con id esplicito NON avanza la sequenza IDENTITY, quindi il
# primo INSERT auto-id (admin CRUD, test, futuro seed senza id) tenterebbe id=1
# e sbatterebbe su duplicate key. Completa 20260721-24, che fa lo stesso per
# ui.dashboard_definizione ma non copriva queste due tabelle (allora non ancora
# seedate).
#
# ui.dashboard_widget e ui.dashboard_preset_widget non compaiono: hanno PK
# composita, nessuna colonna identity, niente da riallineare.
#
# runAlways: true come 20260721-24 — i seed sono runOnChange e possono
# ri-applicarsi, quindi il riallineamento deve girare a ogni update per restare
# valido. Idempotente per costruzione (setval al MAX corrente).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260722-07-resync-ui-dashboard-seed-identity-sequences-mctit.yaml

  - changeSet:
      id: 20260722-07-resync-ui-dashboard-seed-identity-sequences
      author: mctit
      runAlways: true
      comment: >
        Riallinea le sequenze IDENTITY di ui.widget e ui.dashboard_preset a
        MAX(id) dopo i seed con id esplicito (evita collisioni pkey sugli INSERT
        auto-id). Completa 20260721-24 (dashboard_definizione).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: false
            sql: |
              SELECT setval(
                       pg_get_serial_sequence('ui.widget', 'id'),
                       GREATEST((SELECT COALESCE(MAX(id), 1) FROM ui.widget), 1)
                     );

              SELECT setval(
                       pg_get_serial_sequence('ui.dashboard_preset', 'id'),
                       GREATEST((SELECT COALESCE(MAX(id), 1) FROM ui.dashboard_preset), 1)
                     );
