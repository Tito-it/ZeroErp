# ------------------------------------------------------------
# catalogo.fn_articolo_padre_di_distinta_in_vigore: si ritira (D9).
#   Brief: brief-db-revisione-catalogo, giro 1.
#
#   I suoi due lettori sono passati a catalogo.fn_articolo_padre_di_distinta_da_oggi:
#   il check 1 del guard flags (20_code -63) e le due regole gemelle del form
#   (80_data -69). In 90_end perche' da zero le regole del form cambiano in 80_data,
#   dopo tutto il codice: fino a li' le righe di 20261109-64 nominano ancora questa
#   funzione (come testo, valutato solo a runtime). La preCondition pretende che
#   nessuna regola la nomini piu'.
#   Censiti i lettori: nessun changeSet di 90_end la nomina; i pgTAP che la
#   cercavano sono aggiornati nello stesso giro; la pagina manual/ si cancella.
#   BEGIN ATOMIC: il rollback la ricrea da sola nel suo change (pgjdbc), il COMMENT
#   nel secondo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261110-70-drop-fn-articolo-padre-di-distinta-in-vigore-mctit.yaml

  - changeSet:
      id: 20261110-70-drop-fn-articolo-padre-di-distinta-in-vigore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo: ritirata fn_articolo_padre_di_distinta_in_vigore, i lettori chiamano la versione da oggi in poi. Brief: brief-db-revisione-catalogo, giro 1.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('catalogo.fn_articolo_padre_di_distinta_in_vigore(uuid)')
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM dbops.lock_columns_conditional
               WHERE condition_expr LIKE '%fn_articolo_padre_di_distinta_in_vigore%'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION catalogo.fn_articolo_padre_di_distinta_in_vigore(catalogo.articoli.id%TYPE);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION catalogo.fn_articolo_padre_di_distinta_in_vigore(p_articolo_id catalogo.articoli.id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
               SELECT EXISTS (
                   SELECT 1
                     FROM catalogo.articoli_componenti ac
                    WHERE ac.prodotto_id = p_articolo_id
                      AND ac.attivo IS TRUE
                      AND ac.validita @> script.fn_data_operativa()
               );
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION catalogo.fn_articolo_padre_di_distinta_in_vigore(catalogo.articoli.id%TYPE) IS
                  'true se l''articolo e'' il PADRE di una distinta in vigore: un legame attivo di catalogo.articoli_componenti con prodotto_id = l''articolo e validita che contiene il giorno aziendale (script.fn_data_operativa). NULL -> false. Predicato unico del check 1 di catalogo.trgfn_articoli_guard_flags_struttura_bom_attiva (is_composito e requires_serial non si cambiano) e delle sue regole gemelle per il form in dbops.lock_columns_conditional.';
