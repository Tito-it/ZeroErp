# ----------------------------------------------------------
# R-7 — LA PORTA DELLE TABELLE DEL NOME TENTATO: all'app solo SELECT
#   Brief: brief-db-blocco-login-per-credenziale, sezione 13.2
#
#   config.nomi_tentati e config.nomi_tentati_provenienze sono gemelle delle
#   tabelle della credenziale, e hanno la stessa porta: scrivono solo le
#   funzioni DEFINER del login (fn_check_blocco_login, fn_registra_tentativo_login).
#   Tre sedi, come per le credenziali (20260925-24): questo forward su dev, la
#   voce in `v_tabelle_sola_lettura_app` del loop ci_apply 20260205-41, il blocco
#   del provisioning. Il pgTAP db/pgtap/config/test-credenziali-porta-v1.sql lo
#   dice se non lo fa.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260925-62-revoke-app-scrittura-nomi-tentati-mctit.yaml

  - changeSet:
      id: 20260925-62-revoke-app-scrittura-nomi-tentati
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La porta delle tabelle del nome tentato: a zeroerp_app SELECT soltanto su config.nomi_tentati
        e config.nomi_tentati_provenienze (REVOKE INSERT, UPDATE, DELETE: scrivono solo le funzioni
        DEFINER del login). Postura resa stabile dal loop 20260205-41 e dal provisioning. Brief:
        brief-db-blocco-login-per-credenziale §13.2 (R-7).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: nomi_tentati
            - tableExists:
                schemaName: config
                tableName: nomi_tentati_provenienze
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $porta$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'zeroerp_app') THEN
                      RAISE NOTICE 'Ruolo zeroerp_app non presente: skip porta dei nomi tentati.';
                      RETURN;
                  END IF;

                  GRANT  SELECT                 ON TABLE config.nomi_tentati             TO   zeroerp_app;
                  REVOKE INSERT, UPDATE, DELETE ON TABLE config.nomi_tentati             FROM zeroerp_app;
                  GRANT  SELECT                 ON TABLE config.nomi_tentati_provenienze TO   zeroerp_app;
                  REVOKE INSERT, UPDATE, DELETE ON TABLE config.nomi_tentati_provenienze FROM zeroerp_app;
              END
              $porta$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Senza togliere le voci dal loop 20260205-41 e dal provisioning la
              -- passata ci_apply successiva richiude la porta.
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE config.nomi_tentati             TO zeroerp_app;
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE config.nomi_tentati_provenienze TO zeroerp_app;
