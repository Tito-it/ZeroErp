# Liquibase changelog per Zero ERP
# Provisioning canale dblink per logging out-of-transaction (PG18: solo dblink)
# NOTE:
# - Non salva password in GUC.
# - Richiede changelog parameters:
#   zeroerp_log_password (facoltativa: se assente, lo script non esegue nulla)# ------------------------------------------------------------
#
#  ATTENZIONE - Questo changelog non è utilizzato . Preferito usare (20251123-12-sec-functions-owner-hardening-mctit.yaml
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260205-42-provision-dblink-log-channel-mctit.yaml

  - changeSet:
      id: 20260205-42-provision-dblink-log-channel
      author: mctit
      context: disabled
      validCheckSum:
        - ANY
      comment: "Configura ruolo zeroerp_log e GUC dblink (service) senza password in GUC"
      preConditions:
        - onFail: HALT
        - onError: HALT
        - dbms:
            type: postgresql
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_log_role text := 'zeroerp_log';
                v_service text := 'zeroerp_log';
                v_pwd text := '${zeroerp_log_password}';
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Configurare un canale dblink sicuro per logging:
                --   password nel USER MAPPING, non nella GUC di sessione.
                --
                -- Regole:
                --   - ruolo tecnico con privilegi minimi su dbops.error_log
                --   - foreign server dblink_fdw dedicato al log
                --   - user mapping per ruoli runtime/migrator
                --   - GUC myapp.dblink_log_connection contiene solo nome server
                -- =========================================================

                IF v_pwd IS NULL OR btrim(v_pwd) = '' OR v_pwd LIKE '${zeroerp_log_password}' THEN
                  RAISE NOTICE
                    'Skip provisioning dblink log channel: parametro zeroerp_log_password non valorizzato.';
                  RETURN;
                END IF;

                CREATE EXTENSION IF NOT EXISTS dblink;

                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_log_role) THEN
                  EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', v_log_role, v_pwd);
                ELSE
                  EXECUTE format('ALTER ROLE %I LOGIN PASSWORD %L', v_log_role, v_pwd);
                END IF;

                EXECUTE format('GRANT USAGE ON SCHEMA dbops TO %I', v_log_role);
                EXECUTE format('GRANT INSERT ON TABLE dbops.error_log TO %I', v_log_role);
                EXECUTE format('GRANT USAGE, SELECT ON SEQUENCE dbops.error_log_id_seq TO %I', v_log_role);

                EXECUTE format(
                  'ALTER ROLE %I IN DATABASE %I SET myapp.dblink_log_connection = %L',
                  'titodb', current_database(), 'service=' || v_service
                );
                EXECUTE format(
                  'ALTER ROLE %I IN DATABASE %I SET myapp.dblink_log_connection = %L',
                  'zeroerp_app', current_database(), 'service=' || v_service
                );
              END;
              $$;
