# ------------------------------------------------------------
# Riallinea la sequenza IDENTITY di ui.dashboard_definizione, seedata via
# loadUpdateData con id ESPLICITO (id=1, 'home').
#
# Perche': loadUpdateData inserisce l'id dal CSV ma NON avanza la sequenza
# GENERATED BY DEFAULT AS IDENTITY. Senza resync, il primo INSERT auto-id
# (CRUD admin, test pgTAP) collide con "duplicate key". Stesso identico
# problema e fix di 20260602-17 (tabelle liste).
#
# runAlways: la sequenza va riportata a MAX(id) ad ogni deploy, perche'
# l'aggiunta di nuove righe seed (CSV) non modifica questo file e quindi
# runOnChange non rifrirebbe. Idempotente e sicuro.
#
# NOTA per il seed BE/FE del catalogo widget: quando ui.widget e
# ui.dashboard_preset verranno seedati con id espliciti, aggiungere qui
# (o in un file 90_end successivo) il resync delle loro sequenze, con lo
# stesso pattern setval(seq, GREATEST(MAX(id), 1)).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260721-24-resync-ui-dashboard-seed-identity-sequences-mctit.yaml

  - changeSet:
      id: 20260721-24-resync-ui-dashboard-seed-identity-sequences
      author: mctit
      runAlways: true
      comment: >
        Riallinea la sequenza IDENTITY di ui.dashboard_definizione a MAX(id)
        dopo il seed loadUpdateData con id esplicito (evita collisioni pkey
        sugli INSERT auto-id di admin CRUD e test).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: false
            sql: |
              SELECT setval(
                       pg_get_serial_sequence('ui.dashboard_definizione', 'id'),
                       GREATEST((SELECT COALESCE(MAX(id), 1) FROM ui.dashboard_definizione), 1)
                     );
