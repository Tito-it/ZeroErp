# GUIDA (D4) — GRANT al ruolo app sulle tabelle toccate dal reconcile (INVOKER).
# Brief: brief-db-guida-avanza-esito-proiettato.md §7 (finding smoke E2E 2026-07-07).
#
# Bug trovato dallo smoke E2E sul percorso HTTP reale (ruolo app zeroerp_app, NON
# owner), invisibile al pgTAP (che gira come owner con tutti i privilegi):
# fn_reconcile_sorgente e' SECURITY INVOKER (D-B4) -> gira come zeroerp_app, che
# pero' NON aveva grant su due tabelle GUIDA nuove (create con 20260706-17/18,
# committate senza GRANT; il grant qui e' per-oggetto esplicito, come flussi/
# giornale). Verificato su DB reale: role_table_grants vuoto per zeroerp_app su
# entrambe. Effetti (nel percorso app):
#   1) SELECT su template_flussi_avanzamento_proiezione -> permission denied
#      (l'errore ORIGINALE: il milestone non avanza);
#   2) INSERT su reconcile_errori nel blocco best-effort -> permission denied,
#      NON catturato -> propaga -> rollback del cambio-stato del documento
#      (viola l'invariante documento-sovrano D-B4/D-B7).
#
# Fix: concedere i privilegi minimi. Il reconcile LEGGE il binding e SCRIVE il log
# (SELECT per la consultazione BE). reconcile_errori.id e' GENERATED BY DEFAULT AS
# IDENTITY: l'INSERT non richiede USAGE separato sulla sequenza (identity, non SERIAL).
#
# La robustezza "il log non deve poter far fallire il best-effort" e' nei changeset
# 20260707-08/09 (nested-guard + RAISE WARNING): difesa in profondita' oltre al grant.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260707-07-grant-guida-reconcile-app-mctit.yaml

  - changeSet:
      id: 20260707-07-grant-guida-reconcile-app
      author: mctit
      # ⚠️ Nessun `dbms:` sui change (tolto il 2026-09-17): con `runOnChange` +
      #    `validCheckSums: ANY`, Liquibase 5.0.4 lascia un change `dbms:` FUORI
      #    dal checksum quando decide se ri-eseguire — una ri-esecuzione spuria
      #    alla corsa dopo (in CI la seconda invocazione, fuori ordine) e poi un
      #    checksum «vuoto» cieco alle modifiche. linee-guida-sql §11.1.
      runOnChange: true
      comment: >
        GRANT zeroerp_app: SELECT su pratiche.template_flussi_avanzamento_proiezione
        (letta dal reconcile INVOKER) + SELECT,INSERT su pratiche.reconcile_errori
        (log best-effort). Fix del finding smoke E2E GUIDA (percorso HTTP/app).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_app_role text := 'zeroerp_app';
              BEGIN
                -- Idempotente e difensivo: se il ruolo manca non blocchiamo l'apply.
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_app_role) THEN
                  RAISE NOTICE 'Ruolo % assente: skip GRANT GUIDA reconcile.', v_app_role;
                  RETURN;
                END IF;

                -- Il reconcile (INVOKER) legge il binding di avanzamento.
                EXECUTE format(
                  'GRANT SELECT ON pratiche.template_flussi_avanzamento_proiezione TO %I',
                  v_app_role);

                -- Il best-effort log scrive reconcile_errori; SELECT per la consultazione.
                EXECUTE format(
                  'GRANT SELECT, INSERT ON pratiche.reconcile_errori TO %I',
                  v_app_role);
              END $$;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                v_app_role text := 'zeroerp_app';
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = v_app_role) THEN
                  EXECUTE format('REVOKE SELECT ON pratiche.template_flussi_avanzamento_proiezione FROM %I', v_app_role);
                  EXECUTE format('REVOKE SELECT, INSERT ON pratiche.reconcile_errori FROM %I', v_app_role);
                END IF;
              END $$;
