# PROVISIONA SUBITO IL LOCK DI anagrafiche.emittenti_fiscali.soggetto_ruolo_id
#   -> E_EMITTENTE_SOGGETTO_IMMUTABILE
#   Tid, 2026-11-21 (richiesta del BE): un emittente fiscale e' l'emittente di
#   un soggetto. Cambiargli il ruolo, e quindi il soggetto, vuol dire creare
#   un altro emittente: quello creato sul soggetto sbagliato si ritira e si
#   ricrea. Con il lock di soggetti_ruoli.soggetto_id (20261019-86,
#   E_SOGGETTO_RUOLO_SOGGETTO_IMMUTABILE) la catena emittente -> ruolo ->
#   soggetto diventa immutabile. La riga e' in
#   80_data/sql/dbops/automation_lock_columns.csv, il codice nei due CSV dei
#   codici.
#
# -- PERCHE' SUBITO -----------------------------------------------------------------
#   Prima di questo giro la colonna la teneva ferma solo la whitelist di
#   UPDATE del backend: trgfn_emittenti_fiscali_guard_ruolo_emi_fis controlla
#   che il ruolo sia EF, non che resti lo stesso. Su dbdev il ci_apply non
#   rigira le automazioni (il job dei lock e' serale): senza questo passo la
#   strada resterebbe aperta fino alla sera, e il pgTAP del giro rosso. Da
#   zero il ci_apply lo monta comunque; il runner converge (crea, rigenera,
#   toglie), e rigirarlo non fa danni.
#
# -- LA FORMA -------------------------------------------------------------------------
#   Si chiama il RUNNER, non si scrive un CREATE TRIGGER a mano (stessa scelta
#   di 20261019-86 e 20261116-46). Solo lo schema anagrafiche. Il runner
#   rigenera trg_emittenti_fiscali_a10_lock_columns_upd, che oggi porta il solo
#   codice (E_CODICE_NON_MODIFICABILE), con la seconda coppia
#   colonna/codice; il trigger precede in ordine di nome
#   trg_emittenti_fiscali_guard_ruolo_emi_fis_ins_upd, quindi parla il lock.
#   dbops.vw_non_editable_fields legge i trigger vivi: la colonna vi compare
#   senza toccare la vista.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20261121-09-provision-lock-emittenti-fiscali-soggetto-mctit.yaml

  - changeSet:
      id: 20261121-09-provision-lock-emittenti-fiscali-soggetto
      author: mctit
      runOnChange: false
      comment: >
        Provisiona subito il lock di colonna su anagrafiche.emittenti_fiscali.soggetto_ruolo_id
        (E_EMITTENTE_SOGGETTO_IMMUTABILE) chiamando il runner dei lock sullo schema
        anagrafiche. Tid, 2026-11-21, richiesta del BE.
      preConditions:
        - onFail: HALT
        - and:
            # La riga del registro deve esserci e essere accesa: senza, il
            # runner non crea niente e il changeSet sarebbe un verde a vuoto.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM dbops.automation_lock_columns
                   WHERE enabled IS TRUE
                     AND upper(btrim(exec_mode)) = 'AUTO'
                     AND (target_schema, target_table, column_name, error_code)
                         = ('anagrafiche', 'emittenti_fiscali', 'soggetto_ruolo_id',
                            'E_EMITTENTE_SOGGETTO_IMMUTABILE');
            # Il codice deve essere vivo, o il lock risponderebbe con un
            # segnaposto irrisolto invece che con la sua frase.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM config.codici_errore
                   WHERE codice = 'E_EMITTENTE_SOGGETTO_IMMUTABILE'
                     AND (obsoleto_dal IS NULL OR obsoleto_dal > CURRENT_DATE);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              SELECT dbops.fn_run_automations_lock_columns('AUTO', ARRAY['anagrafiche'], false);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il trigger lo governa il registro: per toglierlo si spegne la
              -- riga di automation_lock_columns e si rigira il runner, che
              -- converge. Qui non si tocca niente.
              SELECT 1;
