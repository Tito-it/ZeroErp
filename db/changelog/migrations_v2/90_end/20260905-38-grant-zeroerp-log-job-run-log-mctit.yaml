# 🔴 IL CANALE C'ERA, MA IL SUO UTENTE NON POTEVA ENTRARE.
#   Brief: brief-db-storicizzazione-bersagli-spariti.md §2.3 (R-12)
#
# `maintenance.fn_job_run_log_failure` (`20260905-35`) scrive il verbale di un run
# fallito su una connessione separata. Dopo l'apply, l'owner era giusto
# (`postgres`, allineato dal `90_end`) e la connessione si apriva — ma la
# scrittura moriva lo stesso:
#
#     ATTENZIONE: verbale non scritto (permesso negato per lo schema maintenance)
#
# ── ⭐ IL MOTIVO, ED E' LA PARTE ISTRUTTIVA ────────────────────────
#   Dall'altro capo della connessione non c'e' `titodb`: c'e' **`zeroerp_log`**, un
#   ruolo dedicato che nasce per una cosa sola — scrivere in `dbops.error_log`, su
#   cui infatti ha `INSERT`. Su `maintenance` non aveva **niente**: ne' `USAGE`
#   sullo schema ne' `INSERT` sulla tabella.
#   ⇒ Il canale funzionava. Non funzionava il **permesso di chi ci passa dentro**.
#
# ── ⛔ E SI E' VISTO SOLO PROVANDOLO SUL PERCORSO VERO ──────────────
#   Il changeSet `-35` era applicato, il `-36` pure, i test verdi. ⚠️ Ma tutti i
#   test possibili prima dell'apply misuravano *«la funzione non solleva»* — che
#   e' vero anche quando non scrive niente, perche' e' fatta apposta per non
#   rompere il job che sta gia' fallendo.
#   ⇒ La prova che serviva era una sola: **far fallire un job davvero e andare a
#     vedere se la riga rossa c'e'.** Non c'era.
#   ⭐ E' esattamente la ragione per cui il `-36` diceva «va verificato una volta
#     sul percorso vero»: un canale che tace quando non funziona non si collauda
#     guardando chi lo chiama, si collauda guardando **dove dovrebbe arrivare**.
#
# ── ⚠️ PERCHE' UN CHANGESET E NON IL PROVISIONING ──────────────────
#   `zeroerp_log` non e' un ruolo batch: la regola «i grant dei ruoli batch stanno
#   nel provisioning» riguarda `zeroerp_batch_*` e il loro `BYPASSRLS`. Qui si
#   concede la cosa piu' stretta possibile — `USAGE` sullo schema e `INSERT` su
#   UNA tabella — allo stesso ruolo che gia' scrive il giornale degli errori.
#   ⛔ Niente `SELECT`: chi scrive un verbale non ha bisogno di rileggerlo, e un
#   permesso in piu' su un giornale e' un permesso in piu' su tutto cio' che il
#   giornale racconta.
#   ⚠️ `id` e' `GENERATED BY DEFAULT AS IDENTITY`: la sequenza implicita segue la
#   colonna, quindi l'`INSERT` basta e non serve nessun grant sulla sequenza.
#
# ⚠️ Sta in `90_end` come gli altri grant: dopo che tabelle e schemi esistono.
#
# Verifica: far fallire un run e guardare `maintenance.job_run_log`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260905-38-grant-zeroerp-log-job-run-log-mctit.yaml

  - changeSet:
      id: 20260905-38-grant-zeroerp-log-job-run-log
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Concede a zeroerp_log — l'utente della connessione di log fuori
        transazione — USAGE su maintenance e INSERT su maintenance.job_run_log.
        Senza, maintenance.fn_job_run_log_failure apre la connessione e viene
        respinta: «permesso negato per lo schema maintenance», e il run fallito
        non lascia traccia. Trovato provando a far fallire un job davvero.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: maintenance, tableName: job_run_log }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_log') THEN
                      -- ⭐ Il minimo che serve: entrare nello schema e scrivere
                      --   UNA tabella. Nessun SELECT: chi redige un verbale non
                      --   ha bisogno di rileggerlo.
                      GRANT USAGE  ON SCHEMA maintenance        TO zeroerp_log;
                      GRANT INSERT ON maintenance.job_run_log   TO zeroerp_log;
                  ELSE
                      RAISE NOTICE
                          'ruolo zeroerp_log assente: GRANT saltato. ⚠️ Su questo '
                          'database un run fallito non lascera'' traccia nel giornale.';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Riporta il canale a essere aperto ma muto: la connessione si
              --   apre e la scrittura viene respinta.
              DO $revoke$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_log') THEN
                      REVOKE INSERT ON maintenance.job_run_log FROM zeroerp_log;
                      REVOKE USAGE  ON SCHEMA maintenance      FROM zeroerp_log;
                  END IF;
              END
              $revoke$;
