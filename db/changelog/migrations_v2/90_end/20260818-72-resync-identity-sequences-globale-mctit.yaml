# Riallinea (forward-only) le sequenze IDENTITY/serial di tutte le tabelle
# NOSTRE, su qualunque schema — non solo di quelli gia' presidiati.
#
# IL PROBLEMA. `loadUpdateData` inserisce gli id presi dal CSV ma NON avanza la
# sequenza `GENERATED BY DEFAULT AS IDENTITY`: la sequenza resta ferma dov'era e
# il primo INSERT auto-id collide sulla pkey. Non e' teorico — il 2026-08-18,
# misurando, sei sequenze erano indietro:
#
#     catalogo.unita_misura.id                       MAX 258276  vs  seq   8026
#     vendite.fatturazione_pipeline_task_policy.id   MAX     25  vs  seq     11
#     vendite.transizioni_stati_commessa.id          MAX     12  vs  seq      1
#     dbops.audit_sources.id                         MAX     11  vs  seq      1
#     vendite.tipi_doc_fiscale_registri.id           MAX      4  vs  seq      2
#     dbops.automazione_chiusura_scadenze.id         MAX      2  vs  seq      1
#
# ⚠️ COSA C'ERA GIA', perche' la prima stesura di questa intestazione lo diceva
# male e conviene metterlo in chiaro: il progetto un meccanismo di resync ce
# l'ha, in DUE forme, e nessuna delle due e' nata «rincorrendo».
#
#   1. ⭐ LA FORMA IDIOMATICA — `setval` DENTRO IL SEED STESSO, subito dopo il
#      loadUpdateData, in 19 changeSet di 80_data:
#
#          SELECT setval(
#              pg_get_serial_sequence('anagrafiche.categorie_clienti', 'id'),
#              COALESCE((SELECT MAX(id) FROM anagrafiche.categorie_clienti), 1),
#              true);
#
#      Copre 16 tabelle (categorie_clienti, identita_digitali, parameters, i
#      quattro profili_accesso, scope_policy, transizioni_stati_ddt e otto di
#      pratiche). ⭐ Ed e' un disegno MIGLIORE di questo file: chi crea la
#      deriva la ripara subito, nello stesso changeSet, invece di delegarla a
#      uno spazzino di fine migrate. Dove e' applicata, questa passata non ha
#      niente da fare.
#
#   2. I resync PER-SCHEMA in coda: `20260616-02` (config) e `20260602-17` /
#      `20260721-24` / `20260722-07` (ui). Sono la pezza dove la forma 1 non era
#      stata applicata, su due schemi in cui il difetto si era gia' visto.
#
# QUINDI PERCHE' ANCHE QUESTO. Non perche' manchi un meccanismo, ma perche'
# quello che c'e' e' OPT-IN: la copertura dipende dal fatto che chi scrive un
# seed nuovo si ricordi di aggiungere la riga di setval. La misura del
# 2026-08-18 dice come va a finire — le SEI sequenze indietro elencate sopra
# stanno tutte su tabelle il cui seed NON fa setval, e nessuna delle sei sta in
# `config` o `ui`, cioe' fuori anche dalla pezza per-schema.
#
# Questo changeSet e' quindi una RETE, non il presidio primario. Il presidio
# resta la forma 1: un seed nuovo con id espliciti dovrebbe continuare a
# riallineare la propria sequenza da se'. Qui si chiude per costruzione il buco
# che l'opt-in lascia aperto, e si paga solo quando serve davvero (zero
# scritture se nessuna sequenza e' indietro).
#
# ⚠️ `20260616-02` porta in testa la regola «NON applicare a schemi transazionali:
# setval potrebbe riportare indietro una sequenza dopo cancellazioni e causare
# riuso di id», e poi nota lui stesso che l'implementazione e' forward-only.
# La cautela era giusta per l'idea, non per il codice: con il confronto
# forward-only la sequenza non puo' regredire, quindi il motivo per restare
# ristretti non c'e'. Qui e' esplicito e presidiato dalla condizione di ingresso.
#
# COSTO MISURATO (dev, dati veri): 434 colonne identity/serial esaminate,
# passata completa in ~450 ms. (Erano 441 prima del filtro sul proprietario:
# le 7 in meno sono pgagent e topology, che non sono nostre.)
# `MAX(id)` su una colonna indicizzata e' una scansione d'indice, non un seq scan. ⚠️ Una futura colonna identity NON indicizzata su una
# tabella grande diventerebbe una scansione piena a ogni deploy: se la passata
# inizia a pesare, cercare li'.
#
# SCRITTURE: zero nel caso normale. A differenza dei resync per-schema, che
# chiamano `setval` su ogni tabella popolata, qui si scrive SOLO sulle sequenze
# davvero indietro: nella misura del 2026-08-19, 434 colonne esaminate e ZERO
# riallineate, quindi nessun WAL.
#
# ⚠️ `is_called`. Una sequenza mai usata ha `last_value = 1` e `is_called = false`,
# e il prossimo `nextval` restituisce **1**, non 2. Confrontare il nudo
# `last_value` con `MAX(id)` mancherebbe il caso della tabella con una riga sola
# di id 1: sequenza «pari» ma prossimo id gia' occupato. Si confronta quindi il
# piu' alto valore GIA' DISTRIBUITO (`last_value - 1` quando non e' mai stata
# chiamata), non `last_value`.
#
# Gli id ESPLICITI nei seed restano: sono il contratto stabile per le FK
# cross-tabella. Questo changeset non li tocca, allinea solo le sequenze.
#
# runAlways + 90_end (includeAll, ultima fase): gira DOPO tutti i seed 80_data,
# vedendo il MAX(id) definitivo, a ogni deploy. Idempotente.
#
# I QUATTRO changeSet per-schema (config + tre di ui) restano dove sono — mai
# modificare changelog gia' mergiati — e diventano no-op preventivi: girano
# prima di questo, sono forward-only, e quando arriva questa passata non c'e'
# piu' niente da riallineare nei loro schemi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/90_end/20260818-72-resync-identity-sequences-globale-mctit.yaml

  - changeSet:
      id: 20260818-72-resync-identity-sequences-globale
      author: mctit
      runAlways: true
      # Il changeSet e' gia' stato applicato prima della correzione sui
      # permessi: senza questo, il checksum cambiato lo farebbe fallire sui
      # database dove aveva gia' girato.
      validCheckSums:
        - ANY
      comment: >
        Riallinea forward-only tutte le sequenze IDENTITY/serial del database a
        MAX(id), dopo i seed loadUpdateData con id espliciti. Evita le collisioni
        pkey sul primo INSERT auto-id. Dinamico (copre le tabelle future) e
        scrive solo sulle sequenze effettivamente indietro.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                r          record;
                v_seq      text;
                v_max      bigint;
                v_last     bigint;
                v_called   boolean;
                v_erogato  bigint;   -- il piu' alto id gia' distribuito dalla sequenza
                v_fixate   int := 0;
                v_viste    int := 0;
              BEGIN
                -- Ogni colonna con una sequence associata (identity o serial) fra
                -- quelle NOSTRE (vedi il filtro sul proprietario sotto). Le
                -- partizioni compaiono accanto al padre: e' ridondante e innocuo
                -- (forward-only, idempotente).
                FOR r IN
                  -- ⭐ rev 2026-09-02 — DUE STADI, e la CTE e' MATERIALIZED
                  --   apposta: e' una barriera di ottimizzazione. Nel primo
                  --   stadio solo predicati di CATALOGO, che non richiedono
                  --   nessun permesso; nel secondo la chiamata che il permesso
                  --   lo pretende. In un unico WHERE l'ordine di valutazione
                  --   non e' garantito, e bastava che PostgreSQL provasse
                  --   `pg_get_serial_sequence` su una tabella di uno schema
                  --   chiuso prima di guardare il filtro.
                  WITH candidate AS MATERIALIZED (
                  SELECT n.nspname AS schema_name,
                         c.relname AS table_name,
                         a.attname AS column_name
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  JOIN pg_attribute a ON a.attrelid = c.oid
                                     AND a.attnum > 0
                                     AND NOT a.attisdropped
                  WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
                    AND n.nspname NOT LIKE 'pg\_%'
                    AND c.relkind IN ('r', 'p')
                    -- ⛔ rev 2026-08-19 — SI FILTRA SU CHI POSSIEDE, non su
                    --   «tutti gli schemi non di sistema» come diceva la prima
                    --   versione. Su un database con PostGIS completo li' dentro
                    --   c'e' `tiger` (schema dell'estensione postgis_tiger_geocoder,
                    --   di proprieta' di postgres), e il DO block moriva con
                    --   «permission denied for schema tiger» fermando il migrate
                    --   in 90_end.
                    --   ⚠️ Difetto invisibile dove era stato misurato: sul database
                    --   di sviluppo `tiger` NON ESISTE (quell'estensione non e'
                    --   installata) e si gira come owner, quindi non si incontrava.
                    --   Si e' visto solo su un database nuovo con PostGIS intero.
                    --
                    --   Perche' i due rami dell'OR, e non uno solo:
                    --   * `n.nspowner` — copre le tabelle dei NOSTRI schemi anche
                    --     quando la singola tabella e' di qualcun altro. Succede
                    --     davvero: 59 colonne identity di `storico` sono di
                    --     proprieta' di postgres (le crea l'automazione), e un
                    --     filtro sulla sola tabella le avrebbe saltate IN SILENZIO;
                    --   * `c.relowner` — copre le nostre tabelle fuori dai nostri
                    --     schemi, cioe' oggi public.version_info, che sta in un
                    --     `public` di proprieta' di pg_database_owner.
                    --   Insieme escludono per costruzione pgagent, topology e
                    --   tiger: ne' lo schema ne' le tabelle sono nostri.
                    --
                    --   Elencare gli schemi a mano — come fanno i presidi
                    --   per-schema che questo sostituisce — sarebbe stato l'altro
                    --   modo, ma la lista invecchia, e questo changeSet esiste
                    --   apposta per coprire da solo le tabelle future.
                    AND (n.nspowner = current_user::regrole
                         OR c.relowner = current_user::regrole)
                    -- ⛔ rev 2026-09-02 — SI CHIEDE IL PERMESSO, non chi possiede.
                    --   Secondo inciampo della stessa forma dopo `tiger`: il
                    --   proprietario e' un PROXY di «ci posso entrare», e i due
                    --   si separano appena qualcuno chiude uno schema apposta.
                    --   `internal` e' chiuso VOLUTAMENTE — 20250311_01 fa
                    --   `REVOKE ALL ON SCHEMA internal FROM PUBLIC` e concede
                    --   USAGE al solo `zeroerp_app` — e lo crea il provision-pre,
                    --   che gira come `postgres`. Il migratore non ci entra, ed
                    --   e' giusto cosi': va lasciato chiuso, non aperto per far
                    --   passare questo ciclo.
                    AND has_schema_privilege(current_user, n.nspname, 'USAGE')
                    -- ⚠️ E il `pg_get_serial_sequence` sta FUORI da questo WHERE,
                    --   nella CTE materializzata qui sopra: risolvere un nome
                    --   `schema.tabella` RICHIEDE gia' l'USAGE, e in un unico
                    --   WHERE nessuno garantisce che il filtro sui permessi
                    --   venga valutato prima. Il difetto non era il predicato
                    --   mancante: era che stava nella stessa istruzione della
                    --   chiamata che poteva esplodere.
                  )
                  SELECT cd.schema_name, cd.table_name, cd.column_name
                    FROM candidate cd
                   WHERE pg_get_serial_sequence(
                           format('%I.%I', cd.schema_name, cd.table_name),
                           cd.column_name) IS NOT NULL
                LOOP
                  v_viste := v_viste + 1;
                  v_seq := pg_get_serial_sequence(format('%I.%I', r.schema_name, r.table_name), r.column_name);


                  EXECUTE format('SELECT COALESCE(MAX(%I), 0) FROM %I.%I',
                                 r.column_name, r.schema_name, r.table_name)
                     INTO v_max;

                  -- Tabella vuota: niente da riallineare, e setval qui rischierebbe
                  -- solo di spostare in avanti senza motivo.
                  CONTINUE WHEN v_max <= 0;

                  EXECUTE format('SELECT last_value, is_called FROM %s', v_seq)
                     INTO v_last, v_called;

                  -- Vedi nota is_called in testa al file: se non e' mai stata
                  -- chiamata, last_value e' il PROSSIMO id, non l'ultimo erogato.
                  v_erogato := CASE WHEN v_called THEN v_last ELSE v_last - 1 END;

                  -- Forward-only: si tocca solo cio' che e' indietro. Se la
                  -- sequenza e' avanti (il caso normale di una tabella
                  -- transazionale, anche dopo cancellazioni) non si scrive nulla
                  -- e non si regredisce mai.
                  IF v_max > v_erogato THEN
                    PERFORM setval(v_seq, v_max, true);
                    v_fixate := v_fixate + 1;
                    RAISE NOTICE 'Resync %.%.% -> % : erogato % -> %',
                                 r.schema_name, r.table_name, r.column_name,
                                 v_seq, v_erogato, v_max;
                  END IF;
                END LOOP;

                RAISE NOTICE 'Resync sequenze: % colonne esaminate, % riallineate.',
                             v_viste, v_fixate;
              END $$;
