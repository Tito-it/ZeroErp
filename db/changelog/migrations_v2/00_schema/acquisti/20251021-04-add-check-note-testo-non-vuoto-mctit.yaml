# ------------------------------------------------------------
# Aggiunta CHECK: almeno uno tra testo / testo_md non NULL
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/acquisti/20251021-04-add-check-note-testo-non-vuoto-mctit.yaml

  - changeSet:
      id: 20251021-04-add-check-note-testo-non-vuoto
      author: mctit
      validCheckSum:
        - ANY
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: acquisti, tableName: note_ordini }
        - tableExists: { schemaName: acquisti, tableName: note_ddt }

      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE acquisti.note
                ADD CONSTRAINT chk_note_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE acquisti.note_ordini
                ADD CONSTRAINT chk_ordnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE acquisti.note_ddt
                ADD CONSTRAINT chk_ddtnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)
