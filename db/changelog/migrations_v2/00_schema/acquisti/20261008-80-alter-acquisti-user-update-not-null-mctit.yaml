# CHI HA TOCCATO PER ULTIMO UNA RIGA SI SA SEMPRE — schema acquisti
#   user_update SET NOT NULL su 7 tabelle:
#     acquisti.ddt
#     acquisti.ddt_indirizzi
#     acquisti.ddt_righe
#     acquisti.note
#     acquisti.ordini
#     acquisti.ordini_righe
#     acquisti.ordini_righe_fulfillment
#   Brief: brief-db-righe-e-componenti-debiti-residui (§2, D-2 di Tid)
#
# -- PERCHE' --------------------------------------------------------
#   linee-guida-sql §7: le colonne di audit sono NOT NULL. Il 20261008-31
#   ha chiuso righe e componenti dei documenti di vendita; qui il resto,
#   uno schema per changeSet (D-2 di Tid, 2026-10-08: un giro solo, col
#   presidio dbops/test-user-update-not-null-v1).
#
# -- CHE COSA CAMBIA PER CHI SCRIVE -------------------------------------
#   Niente. Ognuna ha script.trgfn_audit_data_user_generic (BEFORE INSERT
#   OR UPDATE), che scrive user_update a ogni scrittura da app.jwt_user o
#   CURRENT_USER: il vincolo dice nel DDL cio' che il trigger gia' fa.
#   ⚠️ Il trigger lo generano le automazioni (ci_apply, o il job notturno):
#   su un database da zero, alla prima passata, i seed di 80_data entrano
#   PRIMA che esista. Per questo dove manca si mette anche il DEFAULT
#   CURRENT_USER di §7 — senza, il seed scriverebbe NULL. Un seed con la
#   cella vuota non e' un rischio: i loader con nullValue "" scrivono ''
#   sulle colonne STRING (misurato su magazzino.causali.user_insert).
#
# -- TABELLE PARTIZIONATE ------------------------------------------------
#   acquisti.note: il SET NOT NULL sulla madre scende a tutte le
#   partizioni (le tabelle note_* dello schema), e il conteggio della
#   preCondition sulla madre le comprende.
#
# -- LE RIGHE GIA' SCRITTE -----------------------------------------
#   La preCondition pretende zero NULL (expectedResult 0: un DB da zero la
#   soddisfa, linee-guida-sql §11.4), come il 20261008-31. Se ce ne sono il
#   migrate si ferma e si guardano a mano: nessun valore scelto dal migrate.
#   Fatto datato (2026-10-08, dev): zero NULL su tutte.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/acquisti/20261008-80-alter-acquisti-user-update-not-null-mctit.yaml

  - changeSet:
      id: 20261008-80-alter-acquisti-user-update-not-null
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        user_update NOT NULL sullo schema acquisti (7 tabelle),
        come vuole linee-guida-sql §7. Brief: brief-db-righe-e-componenti-debiti-residui (§2, D-2).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT (SELECT count(*) FROM acquisti.ddt                      WHERE user_update IS NULL)
                   + (SELECT count(*) FROM acquisti.ddt_indirizzi            WHERE user_update IS NULL)
                   + (SELECT count(*) FROM acquisti.ddt_righe                WHERE user_update IS NULL)
                   + (SELECT count(*) FROM acquisti.note                     WHERE user_update IS NULL)
                   + (SELECT count(*) FROM acquisti.ordini                   WHERE user_update IS NULL)
                   + (SELECT count(*) FROM acquisti.ordini_righe             WHERE user_update IS NULL)
                   + (SELECT count(*) FROM acquisti.ordini_righe_fulfillment WHERE user_update IS NULL);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE acquisti.ddt                      ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE acquisti.ddt_indirizzi            ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE acquisti.ddt_righe                ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE acquisti.note                     ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE acquisti.ordini                   ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE acquisti.ordini_righe             ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE acquisti.ordini_righe_fulfillment ALTER COLUMN user_update SET NOT NULL;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE acquisti.ordini_righe_fulfillment ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE acquisti.ordini_righe             ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE acquisti.ordini                   ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE acquisti.note                     ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE acquisti.ddt_righe                ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE acquisti.ddt_indirizzi            ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE acquisti.ddt                      ALTER COLUMN user_update DROP NOT NULL;
