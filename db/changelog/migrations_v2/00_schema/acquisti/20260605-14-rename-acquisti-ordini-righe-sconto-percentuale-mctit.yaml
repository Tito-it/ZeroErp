# Unificazione nome colonna sconto di riga (2/3): acquisti.ordini_righe.
# Specchio di 20260605-13: rename sconto_perc -> sconto_percentuale, DEFAULT 0,
# rename CHECK chk_ordini_ao_r_sconto_perc -> chk_ordini_ao_r_sconto.
# Nessun oggetto di codice (vista/funzione) dipende da questa colonna.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/acquisti/20260605-14-rename-acquisti-ordini-righe-sconto-percentuale-mctit.yaml

  - changeSet:
      id: 20260605-14-rename-acquisti-ordini-righe-sconto-percentuale
      author: mctit
      comment: >
        acquisti.ordini_righe: RENAME sconto_perc -> sconto_percentuale,
        SET DEFAULT 0, RENAME CONSTRAINT chk_ordini_ao_r_sconto_perc ->
        chk_ordini_ao_r_sconto. Unificazione nome/default sconto di riga.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            schemaName: acquisti
            tableName: ordini_righe
            columnName: sconto_perc
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE acquisti.ordini_righe
                  RENAME COLUMN sconto_perc TO sconto_percentuale;

              ALTER TABLE acquisti.ordini_righe
                  ALTER COLUMN sconto_percentuale SET DEFAULT 0;

              ALTER TABLE acquisti.ordini_righe
                  RENAME CONSTRAINT chk_ordini_ao_r_sconto_perc TO chk_ordini_ao_r_sconto;

              COMMENT ON COLUMN acquisti.ordini_righe.sconto_percentuale
                  IS 'Sconto percentuale di riga (0-100). Default 0. Unificato 2026-06-05.';
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE acquisti.ordini_righe
                  RENAME CONSTRAINT chk_ordini_ao_r_sconto TO chk_ordini_ao_r_sconto_perc;
              ALTER TABLE acquisti.ordini_righe
                  ALTER COLUMN sconto_percentuale DROP DEFAULT;
              ALTER TABLE acquisti.ordini_righe
                  RENAME COLUMN sconto_percentuale TO sconto_perc;
