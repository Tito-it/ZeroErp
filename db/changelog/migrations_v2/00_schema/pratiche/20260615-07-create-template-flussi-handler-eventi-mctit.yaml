# pratiche.template_flussi_handler_eventi — legame data-driven
# "template di flusso -> handler da eseguire su un EVENTO (+ esito)".
# Generalizza il dispatch handler oltre il solo IN_CORSO:
#   evento = 'IN_CORSO'    -> esecuzione automatica dello step (oggi su
#                             template_flussi.handler_id; vi migrera' in
#                             Fase 2: backfill + switch BE + drop colonna)
#   evento = 'COMPLETATO'  -> azione di dominio al completamento, esito-aware
#                             (es. vendita.accetta_preventivo su
#                              APPROVAZIONE_CLIENTE COMPLETATO/POSITIVO)
# Predisposizione per le famiglie in arrivo (ordini, commesse): un nuovo
# consumatore = nuove RIGHE seed, mai schema-change. Esecutore = handler
# in HANDLER_MAP (riuso pratiche.handler_flussi), nessun routing nel FE.
#
# Fase 1 (questa): la tabella ospita SOLO i nuovi eventi (COMPLETATO+);
# template_flussi.handler_id resta autoritativo per IN_CORSO -> eventi
# disgiunti, nessuna duplicazione, nessuna rottura del dispatch CONFERMA.
# Sorella per forma/naming: template_flussi_prerequisiti, _canali.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260615-07-create-template-flussi-handler-eventi-mctit.yaml

  - changeSet:
      id: 20260615-07-create-template-flussi-handler-eventi
      author: mctit
      comment: >
        template_flussi_handler_eventi: legame template -> handler per
        evento di flusso (IN_CORSO/COMPLETATO) esito-aware. Generalizza il
        dispatch handler; predispone ordini/commesse a dati. Riusa
        handler_flussi (HANDLER_MAP).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: pratiche
                tableName: template_flussi_handler_eventi
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE pratiche.template_flussi_handler_eventi (
                  id                 bigint GENERATED BY DEFAULT AS IDENTITY,
                  template_flusso_id integer      NOT NULL,
                  evento             varchar(20)  NOT NULL,
                  esito_richiesto    varchar(20)  NULL,
                  handler_id         integer      NOT NULL,
                  handler_params     jsonb        NOT NULL DEFAULT '{}'::jsonb,
                  sequenza           integer      NOT NULL DEFAULT 0,
                  attivo             boolean      NOT NULL DEFAULT true,
                  data_insert        timestamptz  NOT NULL DEFAULT now(),
                  user_insert        text         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_pratiche_template_flussi_handler_eventi PRIMARY KEY (id),
                  -- Eventi di flusso su cui scatta un handler (estendibile).
                  CONSTRAINT chk_tfhe_evento CHECK (evento IN ('IN_CORSO', 'COMPLETATO')),
                  -- Stesso vocabolario esito di template_flussi_prerequisiti
                  -- (chk_template_flussi_prereq_esito / chk_flussi_esito).
                  -- NULL = qualsiasi esito (rilevante su COMPLETATO).
                  CONSTRAINT chk_tfhe_esito CHECK (
                      esito_richiesto IS NULL
                      OR esito_richiesto IN ('POSITIVO', 'NEGATIVO', 'PARZIALE', 'NON_APPLICABILE')
                  ),
                  -- Un solo binding per (template, evento, esito, handler).
                  -- NULLS NOT DISTINCT (PG15+): esito NULL trattato come valore
                  -- unico, evita doppioni con esito non valorizzato.
                  CONSTRAINT uq_tfhe UNIQUE NULLS NOT DISTINCT
                      (template_flusso_id, evento, esito_richiesto, handler_id),
                  CONSTRAINT fk_tfhe_template_flusso
                      FOREIGN KEY (template_flusso_id)
                      REFERENCES pratiche.template_flussi (id)
                      ON UPDATE CASCADE ON DELETE CASCADE,
                  CONSTRAINT fk_tfhe_handler
                      FOREIGN KEY (handler_id)
                      REFERENCES pratiche.handler_flussi (id)
                      ON UPDATE CASCADE ON DELETE NO ACTION
              );

              COMMENT ON TABLE pratiche.template_flussi_handler_eventi IS
                'Legame data-driven template di flusso -> handler per evento (IN_CORSO/COMPLETATO) esito-aware. Esecutore = handler in HANDLER_MAP (riuso handler_flussi). Generalizza template_flussi.handler_id; predispone le azioni di completamento per preventivo/offerta/contratto/ordini/commesse a dati.';
              COMMENT ON COLUMN pratiche.template_flussi_handler_eventi.evento IS
                'Evento di flusso che innesca l''handler: IN_CORSO (esecuzione step) o COMPLETATO (azione al completamento).';
              COMMENT ON COLUMN pratiche.template_flussi_handler_eventi.esito_richiesto IS
                'Esito richiesto perche'' l''handler scatti (rilevante su COMPLETATO). NULL = qualsiasi esito. Valori: POSITIVO/NEGATIVO/PARZIALE/NON_APPLICABILE.';
              COMMENT ON COLUMN pratiche.template_flussi_handler_eventi.handler_params IS
                'Parametri passati all''handler per questo binding (mirror di template_flussi.handler_params, per-evento).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS pratiche.template_flussi_handler_eventi;
