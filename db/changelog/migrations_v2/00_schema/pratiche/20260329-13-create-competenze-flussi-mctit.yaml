# Liquibase changelog per Zero ERP
# Crea tabella pratiche.competenze_flussi.
# Matrice competenze: per ogni tipo di flusso e reparto,
# quali operatori sono abilitati a eseguire il flusso.
# Configurazione statica gestita dall'amministratore.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/pratiche/20260329-13-create-competenze-flussi-mctit.yaml

    - changeSet:
          id: 20260329-13-create-competenze-flussi
          author: mctit
          comment: >
              Crea pratiche.competenze_flussi: matrice competenze operatori
              per tipo flusso e reparto. Usata per costruire la coda di lavoro
              (flussi assegnabili per competenza) e per validare la presa in carico.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE pratiche.competenze_flussi (
                            id                      BIGINT GENERATED BY DEFAULT AS IDENTITY,
                            template_flusso_id      INTEGER NOT NULL
                                REFERENCES pratiche.template_flussi(id) ON DELETE NO ACTION,
                            unita_organizzativa_id  INTEGER NOT NULL
                                REFERENCES config.unita_organizzative(id) ON DELETE NO ACTION,
                            risorsa_umana_id        BIGINT NOT NULL
                                REFERENCES anagrafiche.risorse_umane(id) ON DELETE NO ACTION,
                            attivo                  BOOLEAN NOT NULL DEFAULT true,
                            meta                    JSONB NOT NULL DEFAULT '{}',
                            tx_id                   UUID,
                            storicizza              BOOLEAN NOT NULL DEFAULT true,
                            data_insert             TIMESTAMPTZ NOT NULL DEFAULT now(),
                            user_insert             TEXT NOT NULL DEFAULT CURRENT_USER,
                            data_update             TIMESTAMPTZ NOT NULL DEFAULT now(),
                            user_update             TEXT NOT NULL DEFAULT CURRENT_USER,

                            CONSTRAINT pk_competenze_flussi
                                PRIMARY KEY (id),
                            CONSTRAINT uq_competenze_flussi
                                UNIQUE (template_flusso_id, unita_organizzativa_id, risorsa_umana_id)
                        );

                        COMMENT ON TABLE pratiche.competenze_flussi IS
                          'Matrice competenze: per ogni tipo di flusso e reparto, quali operatori sono abilitati.';
                        COMMENT ON COLUMN pratiche.competenze_flussi.template_flusso_id IS
                          'FK al tipo di flusso (template) per cui l''operatore e'' abilitato.';
                        COMMENT ON COLUMN pratiche.competenze_flussi.unita_organizzativa_id IS
                          'FK al reparto/unita'' organizzativa di competenza.';
                        COMMENT ON COLUMN pratiche.competenze_flussi.risorsa_umana_id IS
                          'FK all''operatore abilitato.';
                        COMMENT ON COLUMN pratiche.competenze_flussi.attivo IS
                          'Se false, la competenza e'' sospesa senza rimuovere la configurazione.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS pratiche.competenze_flussi;
