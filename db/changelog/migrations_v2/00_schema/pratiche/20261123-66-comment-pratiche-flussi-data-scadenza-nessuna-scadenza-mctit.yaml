# ------------------------------------------------------------
# pratiche: il COMMENT della scadenza di pratica e flusso dice che cosa vuol dire
#   il vuoto. Brief: brief-db-lista-colonna-vuoto-in-ordine (§3.2).
#
# Che cosa cambia: solo due COMMENT. Prima dicevano «Scadenza prevista.» e
#   «Scadenza prevista per il flusso.», senza dire il vuoto; le colonne sono
#   nullable, e il vuoto e' «nessuna scadenza», come in magazzino.lotti. Le liste
#   delle pratiche e dei flussi lo dichiarano nel catalogo
#   (ui.lista_colonna.vuoto_ordinato_come_massimo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20261123-66-comment-pratiche-flussi-data-scadenza-nessuna-scadenza-mctit.yaml

  - changeSet:
      id: 20261123-66-comment-pratiche-flussi-data-scadenza-nessuna-scadenza
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di pratiche.pratiche.data_scadenza e pratiche.flussi.data_scadenza: NULL = nessuna
        scadenza. Brief: brief-db-lista-colonna-vuoto-in-ordine.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_catalog.pg_attribute
               WHERE attrelid IN (to_regclass('pratiche.pratiche'), to_regclass('pratiche.flussi'))
                 AND attname = 'data_scadenza'
                 AND NOT attisdropped
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN pratiche.pratiche.data_scadenza IS
                  'Scadenza prevista della pratica. NULL = nessuna scadenza.';

              COMMENT ON COLUMN pratiche.flussi.data_scadenza IS
                  'Scadenza prevista del flusso. NULL = nessuna scadenza.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN pratiche.pratiche.data_scadenza IS 'Scadenza prevista.';
              COMMENT ON COLUMN pratiche.flussi.data_scadenza IS 'Scadenza prevista per il flusso.';
