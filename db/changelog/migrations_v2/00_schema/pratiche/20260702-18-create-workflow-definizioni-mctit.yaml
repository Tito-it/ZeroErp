# pratiche.workflow_definizioni — edizioni versionate delle definizioni di
# workflow (modello C «edizioni + fork»).
# (brief-db-step-dominio-e-definizioni-versionate Parte 2 / Fase 0 / D2-1;
#  design: brief-design-workflow-definizioni-versionate, decisione 2026-07-02)
#
# Una riga = UNA EDIZIONE di un workflow per (tipo prestazione, scope):
#   emittente_fiscale_id NULL  = PRESET (vale per chi non ha un'edizione propria)
#   emittente_fiscale_id = X   = edizione della societa' X (fork, Fase 2)
# Ciclo di vita: BOZZA (editabile) -> PUBBLICATA (immutabile, unica per scope)
#                -> RITIRATA (non istanziabile; le pratiche in volo restano sul pin).
# I guard di immutabilita'/transizione arrivano in Fase 1; in Fase 0 la tabella
# e' fondazione invisibile (una definizione preset v1 per tipo == oggi).
#
# Vincoli chiave:
#   uq (tipo, emittente, versione) NULLS NOT DISTINCT — progressivo per scope;
#   unique PARZIALE (tipo, emittente) WHERE PUBBLICATA — una sola pubblicata
#     per scope (indice, non constraint: i parziali non sono table constraint);
#   uq (id, tipo_prestazione_id) — target delle FK COMPOSITE dei figli
#     (template_flussi, pratiche): coerenza tipo garantita senza trigger.
#
# FK tipo -> ON DELETE CASCADE (motivata): la definizione e' metadato del tipo,
# senza tipo non ha senso; inoltre 26 file pgTAP cancellano tipi sintetici nel
# cleanup e romperebbero con NO ACTION. La protezione reale resta transitiva:
# template/pratiche referenziano la definizione con NO ACTION, quindi un tipo
# con figli vivi non e' comunque cancellabile.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260702-18-create-workflow-definizioni-mctit.yaml

  - changeSet:
      id: 20260702-18-create-workflow-definizioni
      author: mctit
      comment: >
        workflow_definizioni: edizioni versionate delle definizioni di workflow
        per (tipo_prestazione, emittente|preset). Unica PUBBLICATA per scope,
        versioning per scope, provenance fork. Fondazione Fase 0 (invisibile).
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: pratiche
                tableName: workflow_definizioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE pratiche.workflow_definizioni (
                  id                   integer GENERATED BY DEFAULT AS IDENTITY,
                  tipo_prestazione_id  integer      NOT NULL,
                  emittente_fiscale_id bigint       NULL,
                  versione             integer      NOT NULL DEFAULT 1,
                  stato                varchar(20)  NOT NULL DEFAULT 'BOZZA',
                  preset_origine_id    integer      NULL,
                  versione_origine     integer      NULL,
                  descrizione          text         NOT NULL,
                  meta                 jsonb        NOT NULL DEFAULT '{}'::jsonb,
                  tx_id                uuid         NULL,
                  data_insert          timestamptz  NOT NULL DEFAULT now(),
                  user_insert          text         NOT NULL DEFAULT CURRENT_USER,
                  data_update          timestamptz  NOT NULL DEFAULT now(),
                  user_update          text         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_pratiche_workflow_definizioni PRIMARY KEY (id),
                  CONSTRAINT chk_workflow_definizioni_stato
                      CHECK (stato IN ('BOZZA', 'PUBBLICATA', 'RITIRATA')),
                  CONSTRAINT chk_workflow_definizioni_versione CHECK (versione > 0),
                  -- Progressivo di versione per scope; NULLS NOT DISTINCT: il
                  -- preset (emittente NULL) e' uno scope come gli altri.
                  CONSTRAINT uq_workflow_definizioni_scope_versione
                      UNIQUE NULLS NOT DISTINCT (tipo_prestazione_id, emittente_fiscale_id, versione),
                  -- Target delle FK composite dei figli (coerenza tipo senza trigger).
                  CONSTRAINT uq_workflow_definizioni_id_tipo
                      UNIQUE (id, tipo_prestazione_id),
                  CONSTRAINT fk_workflow_definizioni_tipo_prestazione
                      FOREIGN KEY (tipo_prestazione_id)
                      REFERENCES pratiche.tipi_prestazione (id)
                      ON UPDATE CASCADE ON DELETE CASCADE,
                  CONSTRAINT fk_workflow_definizioni_emittente
                      FOREIGN KEY (emittente_fiscale_id)
                      REFERENCES anagrafiche.emittenti_fiscali (id)
                      ON UPDATE CASCADE ON DELETE NO ACTION,
                  CONSTRAINT fk_workflow_definizioni_preset_origine
                      FOREIGN KEY (preset_origine_id)
                      REFERENCES pratiche.workflow_definizioni (id)
                      ON UPDATE CASCADE ON DELETE SET NULL
              );

              -- Una sola PUBBLICATA per scope (indice unico parziale;
              -- NULLS NOT DISTINCT per lo scope preset). E' anche l'arbitro
              -- dell'ON CONFLICT del trigger di bootstrap (20260702-22).
              CREATE UNIQUE INDEX uq_workflow_definizioni_pubblicata
                  ON pratiche.workflow_definizioni (tipo_prestazione_id, emittente_fiscale_id)
                  NULLS NOT DISTINCT
                  WHERE stato = 'PUBBLICATA';

              COMMENT ON TABLE pratiche.workflow_definizioni IS
                'Edizioni versionate delle definizioni di workflow (modello C «edizioni + fork»). Una riga = una edizione per (tipo_prestazione, scope); emittente_fiscale_id NULL = preset. Ciclo: BOZZA -> PUBBLICATA (unica per scope, immutabile da Fase 1) -> RITIRATA. Le pratiche pinnano la definizione alla creazione (pratiche.definizione_id) e la tengono per sempre.';
              COMMENT ON COLUMN pratiche.workflow_definizioni.emittente_fiscale_id IS
                'NULL = preset (vale per ogni emittente senza edizione propria); valorizzato = edizione della singola societa'' (fork, Fase 2).';
              COMMENT ON COLUMN pratiche.workflow_definizioni.stato IS
                'BOZZA = editabile; PUBBLICATA = istanziabile e strutturalmente immutabile (guard Fase 1), unica per scope; RITIRATA = non istanziabile, le pratiche in volo restano sul pin.';
              COMMENT ON COLUMN pratiche.workflow_definizioni.preset_origine_id IS
                'Provenance del fork: definizione da cui questa e'' nata (Fase 2). Con versione_origine alimenta il rilevamento drift (banner "preset aggiornato").';
              COMMENT ON COLUMN pratiche.workflow_definizioni.versione_origine IS
                'Versione del preset d''origine al momento del fork (per il diff/drift, Fase 2).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS pratiche.workflow_definizioni;
