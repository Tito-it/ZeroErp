# Liquibase changelog per Zero ERP
# ALTER pratiche.flussi — aggiunge data_fine (completamento flusso)
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/pratiche/20260306-21-alter-flussi-add-data-fine-mctit.yaml

    - changeSet:
          id: 20260306-21-alter-flussi-add-data-fine
          author: mctit
          comment: >
              Aggiunge data_fine a pratiche.flussi. Valorizzata quando il flusso
              va in COMPLETATO; usata dal calcolo tempo da/a come riferimento temporale.
          changes:
              - addColumn:
                    schemaName: pratiche
                    tableName: flussi
                    columns:
                        - column:
                              name: data_fine
                              type: timestamp with time zone
                              remarks: "Timestamp completamento flusso. NULL = non ancora completato."

          rollback:
              - dropColumn:
                    schemaName: pratiche
                    tableName: flussi
                    columnName: data_fine
