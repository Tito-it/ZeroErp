# Liquibase changelog per Zero ERP
# Tabella pratiche.template_flussi_prerequisiti — DAG prerequisiti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260303-12-create-template-flussi-prerequisiti-mctit.yaml

  - changeSet:
      id: 20260303-12-create-template-flussi-prerequisiti
      author: mctit
      comment: >
        Grafo diretto aciclico (DAG) dei prerequisiti tra template flussi.
        Relazione immutabile: si cancella e ricrea (solo data_insert/user_insert).
        Un flusso puo' essere creato solo se i suoi prerequisiti sono completati.
      changes:
        - createTable:
            schemaName: pratiche
            tableName: template_flussi_prerequisiti
            remarks: "DAG prerequisiti tra template flussi."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_pratiche_template_flussi_prerequisiti
                    nullable: false

              - column:
                  name: template_flusso_id
                  type: integer
                  remarks: "FK al template flusso che ha il prerequisito."
                  constraints:
                    nullable: false

              - column:
                  name: prerequisito_id
                  type: integer
                  remarks: "FK al template flusso prerequisito."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: pratiche
            tableName: template_flussi_prerequisiti
            columnNames: template_flusso_id, prerequisito_id
            constraintName: uq_pratiche_template_flussi_prereq_flusso_prereq

        - addForeignKeyConstraint:
            baseTableSchemaName: pratiche
            baseTableName: template_flussi_prerequisiti
            baseColumnNames: template_flusso_id
            referencedTableSchemaName: pratiche
            referencedTableName: template_flussi
            referencedColumnNames: id
            constraintName: fk_template_flussi_prereq_flusso
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: pratiche
            baseTableName: template_flussi_prerequisiti
            baseColumnNames: prerequisito_id
            referencedTableSchemaName: pratiche
            referencedTableName: template_flussi
            referencedColumnNames: id
            constraintName: fk_template_flussi_prereq_prerequisito
            onDelete: CASCADE
            onUpdate: CASCADE

        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE pratiche.template_flussi_prerequisiti
                ADD CONSTRAINT chk_template_flussi_prereq_no_self
                CHECK (template_flusso_id <> prerequisito_id);

      rollback:
        - dropTable:
            schemaName: pratiche
            tableName: template_flussi_prerequisiti
