# Liquibase changelog per Zero ERP
# Tabella pratiche.formule_tempo — soglie temporali modello da/a
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/pratiche/20260306-11-create-formule-tempo-mctit.yaml

    - changeSet:
          id: 20260306-11-create-formule-tempo
          author: mctit
          comment: >
              Soglie temporali e tempo massimo di esecuzione per tipo prestazione,
              con coppia di template flusso da/a. Misura il tempo impiegato
              per passare dal completamento di flusso_da al completamento di flusso_a.
          changes:
              - createTable:
                    schemaName: pratiche
                    tableName: formule_tempo
                    remarks: "Soglie temporali per tipo prestazione con coppia template flusso da/a."
                    columns:
                        - column:
                              name: id
                              type: integer
                              autoIncrement: true
                              generationType: BY DEFAULT
                              remarks: "PK tecnica."
                              constraints:
                                  primaryKey: true
                                  primaryKeyName: pk_pratiche_formule_tempo
                                  nullable: false

                        - column:
                              name: tipo_prestazione_id
                              type: integer
                              remarks: "FK a pratiche.tipi_prestazione."
                              constraints:
                                  nullable: false

                        - column:
                              name: template_flusso_da_id
                              type: integer
                              remarks: "FK a pratiche.template_flussi — flusso di partenza (il suo COMPLETATO avvia il conteggio)."
                              constraints:
                                  nullable: false

                        - column:
                              name: template_flusso_a_id
                              type: integer
                              remarks: "FK a pratiche.template_flussi — flusso di arrivo (il suo COMPLETATO chiude il conteggio)."
                              constraints:
                                  nullable: false

                        - column:
                              name: giorni_esecuzione
                              type: integer
                              remarks: "Tempo massimo previsto in giorni (al netto delle sospensioni)."
                              constraints:
                                  nullable: false

                        - column:
                              name: giorni_warning
                              type: integer
                              remarks: "Soglia giallo (giorni rimanenti)."
                              constraints:
                                  nullable: false

                        - column:
                              name: giorni_critico
                              type: integer
                              remarks: "Soglia rosso (giorni rimanenti)."
                              constraints:
                                  nullable: false

                        - column:
                              name: attivo
                              type: boolean
                              defaultValueBoolean: true
                              constraints:
                                  nullable: false

                        - column:
                              name: descrizione
                              type: text

                        - column:
                              name: meta
                              type: jsonb
                              defaultValueComputed: "'{}'::jsonb"
                              constraints:
                                  nullable: false

                        - column:
                              name: data_insert
                              type: timestamp with time zone
                              defaultValueComputed: "now()"
                              constraints:
                                  nullable: false

                        - column:
                              name: user_insert
                              type: text
                              defaultValueComputed: "CURRENT_USER"
                              constraints:
                                  nullable: false

                        - column:
                              name: data_update
                              type: timestamp with time zone
                              defaultValueComputed: "now()"
                              constraints:
                                  nullable: false

                        - column:
                              name: user_update
                              type: text
                              defaultValueComputed: "CURRENT_USER"
                              constraints:
                                  nullable: false

              - addUniqueConstraint:
                    schemaName: pratiche
                    tableName: formule_tempo
                    columnNames: tipo_prestazione_id, template_flusso_da_id, template_flusso_a_id
                    constraintName: uq_formule_tempo_tipo_da_a

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: formule_tempo
                    baseColumnNames: tipo_prestazione_id
                    constraintName: fk_formule_tempo_tipo_prestazione
                    referencedTableSchemaName: pratiche
                    referencedTableName: tipi_prestazione
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: formule_tempo
                    baseColumnNames: template_flusso_da_id
                    constraintName: fk_formule_tempo_template_da
                    referencedTableSchemaName: pratiche
                    referencedTableName: template_flussi
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: formule_tempo
                    baseColumnNames: template_flusso_a_id
                    constraintName: fk_formule_tempo_template_a
                    referencedTableSchemaName: pratiche
                    referencedTableName: template_flussi
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - sql:
                    dbms: postgresql
                    splitStatements: true
                    sql: |
                        ALTER TABLE pratiche.formule_tempo
                          ADD CONSTRAINT chk_formule_tempo_giorni_esecuzione
                          CHECK (giorni_esecuzione > 0);

                        ALTER TABLE pratiche.formule_tempo
                          ADD CONSTRAINT chk_formule_tempo_giorni_warning
                          CHECK (giorni_warning > 0);

                        ALTER TABLE pratiche.formule_tempo
                          ADD CONSTRAINT chk_formule_tempo_giorni_critico
                          CHECK (giorni_critico > 0);

                        ALTER TABLE pratiche.formule_tempo
                          ADD CONSTRAINT chk_formule_tempo_warning_gt_critico
                          CHECK (giorni_warning > giorni_critico);

                        ALTER TABLE pratiche.formule_tempo
                          ADD CONSTRAINT chk_formule_tempo_warning_lt_esecuzione
                          CHECK (giorni_warning < giorni_esecuzione);

                        ALTER TABLE pratiche.formule_tempo
                          ADD CONSTRAINT chk_formule_tempo_da_diverso_a
                          CHECK (template_flusso_da_id <> template_flusso_a_id);

          rollback:
              - dropTable:
                    schemaName: pratiche
                    tableName: formule_tempo
