                  type: bigint
                  remarks: "FK a pratiche.pratiche."
                  constraints:
                    nullable: false

              - column:
                  name: tipo_nota_id
                  type: integer
                  remarks: "FK a config.tipi_nota."
                  constraints:
                    nullable: false

              - column:
                  name: contenuto
                  type: text
                  remarks: "Testo della nota."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false

              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: tx_id
