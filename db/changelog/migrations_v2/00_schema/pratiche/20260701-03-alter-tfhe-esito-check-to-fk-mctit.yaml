# ------------------------------------------------------------
# Completa la migrazione dell'enum esito a FK-vocabolario: il 4° CHECK.
# (brief-db-chiusura-pratica-nessun-lavoro-pendente §3.A.3)
#
# 20260701-02 ha convertito 3 CHECK (flussi.esito, template_flussi.esito_default,
# template_flussi_prerequisiti.esito_richiesto). Restava chk_tfhe_esito su
# pratiche.template_flussi_handler_eventi.esito_richiesto (il binding handler-evento),
# con lo stesso enum a 4 valori. Serve convertirlo perche' il bivio ripunta il binding
# post_smistamento su un esito di dominio (MERCE_PRESENTE): con il CHECK cablato quel
# valore verrebbe rifiutato.
#
# NB: chk_regole_gen_esito (pratiche.regole_generazione) NON e' toccato: usa un
# vocabolario DIVERSO (POSITIVO/NEGATIVO/QUALSIASI) per le regole di generazione
# cross-pratica, indipendente dal vocabolario esito dei flussi.
#
# esito_richiesto e' NULLABLE (NULL = qualsiasi esito): la FK non valida i NULL.
# Le righe esistenti (esito POSITIVO) validano contro i 4 esiti base (seedati in
# 20260701-01). Richiede config.esiti_flussi_pratiche (20260701-01) applicata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260701-03-alter-tfhe-esito-check-to-fk-mctit.yaml

  - changeSet:
      id: 20260701-03-alter-tfhe-esito-check-to-fk
      author: mctit
      comment: >
        Converte chk_tfhe_esito (template_flussi_handler_eventi.esito_richiesto) da CHECK
        enum a FK verso config.esiti_flussi_pratiche(codice_interno). Completa la
        migrazione FK esito iniziata in 20260701-02 (era il 4° e ultimo CHECK del
        vocabolario esito dei flussi). regole_generazione (vocab diverso) resta invariata.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: esiti_flussi_pratiche
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE pratiche.template_flussi_handler_eventi
                DROP CONSTRAINT IF EXISTS chk_tfhe_esito;
              ALTER TABLE pratiche.template_flussi_handler_eventi
                ADD CONSTRAINT fk_tfhe_esito_richiesto
                FOREIGN KEY (esito_richiesto)
                REFERENCES config.esiti_flussi_pratiche (codice_interno);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE pratiche.template_flussi_handler_eventi
                DROP CONSTRAINT IF EXISTS fk_tfhe_esito_richiesto;
              ALTER TABLE pratiche.template_flussi_handler_eventi
                ADD CONSTRAINT chk_tfhe_esito
                CHECK (
                  esito_richiesto IS NULL
                  OR esito_richiesto IN ('POSITIVO', 'NEGATIVO', 'PARZIALE', 'NON_APPLICABILE')
                );
