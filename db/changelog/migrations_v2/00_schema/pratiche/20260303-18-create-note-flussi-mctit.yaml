databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260303-18-create-note-flussi-mctit.yaml

  - changeSet:
      id: 20260303-18-create-note-flussi
      author: mctit
      comment: >
        Note testuali associate a un flusso. Modificabili (4 audit fields).
        Ogni nota ha un tipo (FK a config.tipi_nota) e contenuto libero.
      changes:
        - createTable:
            schemaName: pratiche
            tableName: note_flussi
            remarks: "Note testuali associate a un flusso."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_pratiche_note_flussi
                    nullable: false

              - column:
                  name: flusso_id
                  type: bigint
                  remarks: "FK a pratiche.flussi."
                  constraints:
                    nullable: false

              - column:
                  name: tipo_nota_id
                  type: integer
                  remarks: "FK a config.tipi_nota."
                  constraints:
                    nullable: false

              - column:
                  name: contenuto
                  type: text
                  remarks: "Testo della nota."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false

              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: tx_id
                  type: uuid

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: pratiche
            baseTableName: note_flussi
            baseColumnNames: flusso_id
            referencedTableSchemaName: pratiche
            referencedTableName: flussi
            referencedColumnNames: id
            constraintName: fk_note_flussi_flusso
            onDelete: NO ACTION
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: pratiche
            baseTableName: note_flussi
            baseColumnNames: tipo_nota_id
            referencedTableSchemaName: config
            referencedTableName: tipi_nota
            referencedColumnNames: id
            constraintName: fk_note_flussi_tipo_nota
            onDelete: NO ACTION
            onUpdate: CASCADE

      rollback:
        - dropTable:
            schemaName: pratiche
            tableName: note_flussi
