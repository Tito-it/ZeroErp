# Liquibase changelog per Zero ERP
# ALTER pratiche.pratiche: aggiunge data_apertura (DATE).
# Valorizzata automaticamente dal trigger alla transizione
# BOZZA → APERTA. Immutabile dopo prima valorizzazione.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/pratiche/20260329-11-alter-pratiche-add-data-apertura-mctit.yaml

    - changeSet:
          id: 20260329-11-alter-pratiche-add-data-apertura
          author: mctit
          comment: >
              Aggiunge data_apertura a pratiche.pratiche.
              Timestamp di passaggio BOZZA → APERTA, valorizzato dal trigger,
              immutabile dopo prima valorizzazione. NULL per pratiche in BOZZA.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        ALTER TABLE pratiche.pratiche
                          ADD COLUMN data_apertura DATE;

                        COMMENT ON COLUMN pratiche.pratiche.data_apertura IS
                          'Timestamp di passaggio da BOZZA ad APERTA. Valorizzato automaticamente dal trigger. Immutabile dopo prima valorizzazione.';

          rollback:
              - sql:
                    sql: |
                        ALTER TABLE pratiche.pratiche DROP COLUMN IF EXISTS data_apertura;
