# ------------------------------------------------------------
# Chiusura guidata dal workflow: marker "flusso di chiusura".
# (brief-db-chiusura-pratica-workflow, 2026-06-14)
#
# Aggiunge pratiche.template_flussi.chiude_pratica: indica che quel
# template e' lo step che chiude la pratica del tipo prestazione.
#   - max UNO per tipo prestazione -> uq_template_flussi_chiusura
#   - implica obbligatorio=true (D4) -> chk_template_flussi_chiusura_obbligatorio
# Al completamento di quel flusso la pratica passa a CHIUSA (trigger
# 20260614-06); il completamento e' ammesso solo a percorso obbligatorio
# concluso (guard 20260614-07).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260614-04-alter-template-flussi-add-chiude-pratica-mctit.yaml

  - changeSet:
      id: 20260614-04-alter-template-flussi-add-chiude-pratica
      author: mctit
      comment: >
        template_flussi.chiude_pratica (boolean) + indice unique parziale
        (max 1/tipo) + CHECK chiude_pratica => obbligatorio.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists: { schemaName: pratiche, tableName: template_flussi, columnName: chiude_pratica }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE pratiche.template_flussi
                ADD COLUMN chiude_pratica boolean NOT NULL DEFAULT false;

              COMMENT ON COLUMN pratiche.template_flussi.chiude_pratica
                IS 'true = template "di chiusura" del tipo prestazione: al completamento del flusso la pratica passa a CHIUSA. Max uno per tipo prestazione (uq_template_flussi_chiusura). Implica obbligatorio=true (chk_template_flussi_chiusura_obbligatorio).';

              -- D4: il flusso di chiusura e' sempre obbligatorio (lo step che
              -- chiude la pratica e' dovuto, ed e' escluso dal calcolo degli
              -- altri obbligatori bloccanti).
              ALTER TABLE pratiche.template_flussi
                ADD CONSTRAINT chk_template_flussi_chiusura_obbligatorio
                CHECK (NOT chiude_pratica OR obbligatorio);

              -- Al massimo un flusso di chiusura per tipo prestazione.
              CREATE UNIQUE INDEX uq_template_flussi_chiusura
                ON pratiche.template_flussi (tipo_prestazione_id)
                WHERE chiude_pratica;

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP INDEX IF EXISTS pratiche.uq_template_flussi_chiusura;
              ALTER TABLE pratiche.template_flussi
                DROP CONSTRAINT IF EXISTS chk_template_flussi_chiusura_obbligatorio;
              ALTER TABLE pratiche.template_flussi
                DROP COLUMN IF EXISTS chiude_pratica;
