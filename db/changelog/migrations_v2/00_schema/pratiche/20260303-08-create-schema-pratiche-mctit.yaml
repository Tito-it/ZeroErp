databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260303-08-create-schema-pratiche-mctit.yaml

  - changeSet:
      id: 20260303-08-create-schema-pratiche
      author: mctit
      comment: >
        Crea lo schema pratiche per il motore workflow: gestione pratiche,
        flussi operativi, template, regole di generazione e canali.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE SCHEMA IF NOT EXISTS pratiche;
              COMMENT ON SCHEMA pratiche IS
              'Gestione pratiche: workflow, flussi operativi, template e regole.';
