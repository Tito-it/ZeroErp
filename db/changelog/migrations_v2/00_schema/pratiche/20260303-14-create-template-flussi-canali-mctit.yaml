# Liquibase changelog per Zero ERP
# Tabella pratiche.template_flussi_canali — M:N flussi/canali
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pratiche/20260303-14-create-template-flussi-canali-mctit.yaml

  - changeSet:
      id: 20260303-14-create-template-flussi-canali
      author: mctit
      comment: >
        Relazione M:N tra template flussi e canali di visibilita'.
        Definisce quali flussi sono esposti su quali interfacce esterne.
        Relazione immutabile: si cancella e ricrea (solo data_insert/user_insert).
      changes:
        - createTable:
            schemaName: pratiche
            tableName: template_flussi_canali
            remarks: "M:N tra template flussi e canali di visibilita'."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_pratiche_template_flussi_canali
                    nullable: false

              - column:
                  name: template_flusso_id
                  type: integer
                  remarks: "FK a pratiche.template_flussi."
                  constraints:
                    nullable: false

              - column:
                  name: canale_id
                  type: integer
                  remarks: "FK a config.canali_pratiche."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: pratiche
            tableName: template_flussi_canali
            columnNames: template_flusso_id, canale_id
            constraintName: uq_pratiche_template_flussi_canali_flusso_canale

        - addForeignKeyConstraint:
            baseTableSchemaName: pratiche
            baseTableName: template_flussi_canali
            baseColumnNames: template_flusso_id
            referencedTableSchemaName: pratiche
            referencedTableName: template_flussi
            referencedColumnNames: id
            constraintName: fk_template_flussi_canali_flusso
            onDelete: CASCADE
            onUpdate: CASCADE

        - addForeignKeyConstraint:
            baseTableSchemaName: pratiche
            baseTableName: template_flussi_canali
            baseColumnNames: canale_id
            referencedTableSchemaName: config
            referencedTableName: canali_pratiche
            referencedColumnNames: id
            constraintName: fk_template_flussi_canali_canale
            onDelete: NO ACTION
            onUpdate: CASCADE

      rollback:
        - dropTable:
            schemaName: pratiche
            tableName: template_flussi_canali
