# Liquibase changelog per Zero ERP
# Tabella pratiche.calcoli_tempo — calcolo persistente tempi da/a
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/pratiche/20260306-16-create-calcoli-tempo-mctit.yaml

    - changeSet:
          id: 20260306-16-create-calcoli-tempo
          author: mctit
          comment: >
              Tabella di calcolo persistente: misura il tempo impiegato
              per transitare dal completamento di flusso_da al completamento di flusso_a.
              Alimentata da trigger a due fasi (avvio + chiusura).
          changes:
              - createTable:
                    schemaName: pratiche
                    tableName: calcoli_tempo
                    remarks: "Calcolo persistente tempi da/a tra flussi."
                    columns:
                        - column:
                              name: id
                              type: bigint
                              autoIncrement: true
                              generationType: BY DEFAULT
                              remarks: "PK tecnica."
                              constraints:
                                  primaryKey: true
                                  primaryKeyName: pk_pratiche_calcoli_tempo
                                  nullable: false

                        - column:
                              name: pratica_id
                              type: bigint
                              remarks: "FK a pratiche.pratiche — immutabile."
                              constraints:
                                  nullable: false

                        - column:
                              name: flusso_da_id
                              type: bigint
                              remarks: "FK a pratiche.flussi — flusso di partenza — immutabile."
                              constraints:
                                  nullable: false

                        - column:
                              name: flusso_a_id
                              type: bigint
                              remarks: "FK a pratiche.flussi — flusso di arrivo — immutabile."
                              constraints:
                                  nullable: false

                        - column:
                              name: formula_tempo_id
                              type: integer
                              remarks: "FK a pratiche.formule_tempo — snapshot formula applicata — immutabile."
                              constraints:
                                  nullable: false

                        - column:
                              name: data_inizio_calcolo
                              type: timestamp with time zone
                              remarks: "data_fine del flusso_da (quando e' andato COMPLETATO) — immutabile."
                              constraints:
                                  nullable: false

                        - column:
                              name: data_fine_calcolo
                              type: timestamp with time zone
                              remarks: "data_fine del flusso_a (quando e' andato COMPLETATO). NULL = in corso."

                        - column:
                              name: giorni_lordi
                              type: integer
                              remarks: "Giorni di calendario totali. NULL mentre in corso."

                        - column:
                              name: giorni_sospensione
                              type: integer
                              remarks: "Giorni totali di sospensione nel periodo da/a. NULL mentre in corso."

                        - column:
                              name: giorni_netti
                              type: integer
                              remarks: "giorni_lordi - giorni_sospensione. NULL mentre in corso."

                        - column:
                              name: giorni_formula
                              type: integer
                              remarks: "Snapshot di formule_tempo.giorni_esecuzione all'avvio — immutabile."
                              constraints:
                                  nullable: false

                        - column:
                              name: sforato
                              type: boolean
                              remarks: "true se giorni_netti > giorni_formula. NULL mentre in corso."

                        - column:
                              name: tx_id
                              type: uuid

                        - column:
                              name: data_insert
                              type: timestamp with time zone
                              defaultValueComputed: "now()"
                              constraints:
                                  nullable: false

                        - column:
                              name: user_insert
                              type: text
                              defaultValueComputed: "CURRENT_USER"
                              constraints:
                                  nullable: false

                        - column:
                              name: data_update
                              type: timestamp with time zone
                              defaultValueComputed: "now()"
                              constraints:
                                  nullable: false

                        - column:
                              name: user_update
                              type: text
                              defaultValueComputed: "CURRENT_USER"
                              constraints:
                                  nullable: false

              - addUniqueConstraint:
                    schemaName: pratiche
                    tableName: calcoli_tempo
                    columnNames: pratica_id, flusso_da_id, flusso_a_id, formula_tempo_id
                    constraintName: uq_calcoli_tempo_pratica_da_a_formula

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: calcoli_tempo
                    baseColumnNames: pratica_id
                    constraintName: fk_calcoli_tempo_pratica
                    referencedTableSchemaName: pratiche
                    referencedTableName: pratiche
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: calcoli_tempo
                    baseColumnNames: flusso_da_id
                    constraintName: fk_calcoli_tempo_flusso_da
                    referencedTableSchemaName: pratiche
                    referencedTableName: flussi
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: calcoli_tempo
                    baseColumnNames: flusso_a_id
                    constraintName: fk_calcoli_tempo_flusso_a
                    referencedTableSchemaName: pratiche
                    referencedTableName: flussi
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - addForeignKeyConstraint:
                    baseTableSchemaName: pratiche
                    baseTableName: calcoli_tempo
                    baseColumnNames: formula_tempo_id
                    constraintName: fk_calcoli_tempo_formula
                    referencedTableSchemaName: pratiche
                    referencedTableName: formule_tempo
                    referencedColumnNames: id
                    onUpdate: CASCADE
                    onDelete: NO ACTION

              - sql:
                    dbms: postgresql
                    splitStatements: true
                    sql: |
                        ALTER TABLE pratiche.calcoli_tempo
                          ADD CONSTRAINT chk_calcoli_tempo_data_fine
                          CHECK (data_fine_calcolo IS NULL OR data_fine_calcolo > data_inizio_calcolo);

                        ALTER TABLE pratiche.calcoli_tempo
                          ADD CONSTRAINT chk_calcoli_tempo_giorni_formula
                          CHECK (giorni_formula > 0);

                        ALTER TABLE pratiche.calcoli_tempo
                          ADD CONSTRAINT chk_calcoli_tempo_da_diverso_a
                          CHECK (flusso_da_id <> flusso_a_id);

          rollback:
              - dropTable:
                    schemaName: pratiche
                    tableName: calcoli_tempo
