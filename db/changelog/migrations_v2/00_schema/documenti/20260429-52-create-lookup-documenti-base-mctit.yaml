# Liquibase changelog per Zero ERP
# Crea lookup base schema documenti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-52-create-lookup-documenti-base-mctit.yaml

  - changeSet:
      id: 20260429-52-create-lookup-documenti-base
      author: mctit
      comment: >
        Crea i lookup base del modulo documenti: tipi output, tipi asset,
        tipi file e render engine. Struttura allineata al pattern
        id/codice/codice_interno/descrizione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.tipi_documento_output (
                  id              bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  codice          varchar(80) NOT NULL,
                  codice_interno  varchar(80) NOT NULL,
                  descrizione     text NOT NULL,
                  attivo          boolean NOT NULL DEFAULT true,
                  meta            jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza      boolean NOT NULL DEFAULT true,
                  tx_id           uuid,
                  data_insert     timestamptz NOT NULL DEFAULT now(),
                  user_insert     text NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamptz NOT NULL DEFAULT now(),
                  user_update     text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_tipi_documento_output_codice UNIQUE (codice),
                  CONSTRAINT uq_tipi_documento_output_codice_interno UNIQUE (codice_interno),
                  CONSTRAINT chk_tipi_documento_output_codice_non_vuoto CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_tipi_documento_output_codice_interno_non_vuoto CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_tipi_documento_output_descrizione_non_vuota CHECK (btrim(descrizione) <> '')
              );

              CREATE TABLE documenti.tipi_asset_documento (
                  id              bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  codice          varchar(80) NOT NULL,
                  codice_interno  varchar(80) NOT NULL,
                  descrizione     text NOT NULL,
                  attivo          boolean NOT NULL DEFAULT true,
                  meta            jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza      boolean NOT NULL DEFAULT true,
                  tx_id           uuid,
                  data_insert     timestamptz NOT NULL DEFAULT now(),
                  user_insert     text NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamptz NOT NULL DEFAULT now(),
                  user_update     text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_tipi_asset_documento_codice UNIQUE (codice),
                  CONSTRAINT uq_tipi_asset_documento_codice_interno UNIQUE (codice_interno),
                  CONSTRAINT chk_tipi_asset_documento_codice_non_vuoto CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_tipi_asset_documento_codice_interno_non_vuoto CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_tipi_asset_documento_descrizione_non_vuota CHECK (btrim(descrizione) <> '')
              );

              CREATE TABLE documenti.tipi_file_documento (
                  id              bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  codice          varchar(80) NOT NULL,
                  codice_interno  varchar(80) NOT NULL,
                  descrizione     text NOT NULL,
                  attivo          boolean NOT NULL DEFAULT true,
                  meta            jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza      boolean NOT NULL DEFAULT true,
                  tx_id           uuid,
                  data_insert     timestamptz NOT NULL DEFAULT now(),
                  user_insert     text NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamptz NOT NULL DEFAULT now(),
                  user_update     text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_tipi_file_documento_codice UNIQUE (codice),
                  CONSTRAINT uq_tipi_file_documento_codice_interno UNIQUE (codice_interno),
                  CONSTRAINT chk_tipi_file_documento_codice_non_vuoto CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_tipi_file_documento_codice_interno_non_vuoto CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_tipi_file_documento_descrizione_non_vuota CHECK (btrim(descrizione) <> '')
              );

              CREATE TABLE documenti.render_engine_documento (
                  id              bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  codice          varchar(80) NOT NULL,
                  codice_interno  varchar(80) NOT NULL,
                  descrizione     text NOT NULL,
                  attivo          boolean NOT NULL DEFAULT true,
                  meta            jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza      boolean NOT NULL DEFAULT true,
                  tx_id           uuid,
                  data_insert     timestamptz NOT NULL DEFAULT now(),
                  user_insert     text NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamptz NOT NULL DEFAULT now(),
                  user_update     text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_render_engine_documento_codice UNIQUE (codice),
                  CONSTRAINT uq_render_engine_documento_codice_interno UNIQUE (codice_interno),
                  CONSTRAINT chk_render_engine_documento_codice_non_vuoto CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_render_engine_documento_codice_interno_non_vuoto CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_render_engine_documento_descrizione_non_vuota CHECK (btrim(descrizione) <> '')
              );

              COMMENT ON TABLE documenti.tipi_documento_output IS
                'Lookup dei tipi di output producibili dal motore documentale.';
              COMMENT ON TABLE documenti.tipi_asset_documento IS
                'Lookup dei tipi di asset documentale caricabili per emittente.';
              COMMENT ON TABLE documenti.tipi_file_documento IS
                'Lookup dei tipi file persistiti per un documento generato.';
              COMMENT ON TABLE documenti.render_engine_documento IS
                'Lookup dei render engine PDF ammessi dal backend documentale.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.render_engine_documento;
              DROP TABLE IF EXISTS documenti.tipi_file_documento;
              DROP TABLE IF EXISTS documenti.tipi_asset_documento;
              DROP TABLE IF EXISTS documenti.tipi_documento_output;
