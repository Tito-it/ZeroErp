# UN NUMERO CHE NON E' UN NUMERO NON SI SCRIVE — schema documenti
#   CHECK «finito» su 4 colonne numeric di 1 tabelle:
#     documenti.template_documenti_versioni: margin_bottom_mm, margin_left_mm, margin_right_mm, margin_top_mm
#   Brief: brief-db-valore-numerico-non-finito-nei-documenti (§5.2, D-1 e D-2 di Tid)
#
# -- PERCHE' --------------------------------------------------------
#   Il tipo numeric ammette 'NaN' (con o senza scala) e 'Infinity' /
#   '-Infinity' (solo senza scala). Nessuno dei tre e' una quantita', un
#   prezzo o un importo, e il NaN contagia: una somma con un NaN e' NaN, e
#   NaN e' maggiore di ogni numero, quindi passa i CHECK di segno (>= 0) e
#   risponde «si'» a ogni confronto con una soglia. La regola e' del TIPO,
#   non dei documenti: vale per ogni colonna numeric del modello (D-2).
#
# -- LA FORMA -------------------------------------------------------
#   Un CHECK per colonna, sempre lo stesso predicato:
#     col > '-Infinity'::numeric AND col < 'Infinity'::numeric
#   falso su NaN, Infinity e -Infinity, vero su ogni numero; il NULL passa
#   come in ogni CHECK. Nome chk_<tabella>_<colonna>_finito.
#   Un CHECK e non un guard (D-1): chi scrive un NaN e' un chiamante rotto,
#   non una persona da un form, e la violazione esce 23514 col nome del
#   vincolo: un errore tecnico, giusto per un guasto.
#   ⭐ Una colonna numeric nuova nasce col suo CHECK: lo pretende il presidio
#   db/pgtap/dbops/test-numerici-finiti-v1.sql.
#
# -- LE RIGHE GIA' SCRITTE -----------------------------------------
#   La preCondition pretende zero valori non finiti (expectedResult 0: un DB
#   da zero la soddisfa, linee-guida-sql §11.4), come il 20261008-85. Se ce
#   ne sono il migrate si ferma e si guardano a mano: nessun valore scelto
#   dal migrate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20261009-14-add-chk-numerici-finiti-documenti-mctit.yaml

  - changeSet:
      id: 20261009-14-add-chk-numerici-finiti-documenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CHECK «finito» (niente NaN, Infinity, -Infinity) sulle 4 colonne numeric dello
        schema documenti. Brief: brief-db-valore-numerico-non-finito-nei-documenti (§5.2, D-1, D-2).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: |
              SELECT (SELECT count(*) FROM documenti.template_documenti_versioni
                                WHERE NOT (margin_bottom_mm > '-Infinity'::numeric AND margin_bottom_mm < 'Infinity'::numeric)
                                  OR NOT (margin_left_mm > '-Infinity'::numeric AND margin_left_mm < 'Infinity'::numeric)
                                  OR NOT (margin_right_mm > '-Infinity'::numeric AND margin_right_mm < 'Infinity'::numeric)
                                  OR NOT (margin_top_mm > '-Infinity'::numeric AND margin_top_mm < 'Infinity'::numeric));
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE documenti.template_documenti_versioni
                ADD CONSTRAINT chk_template_documenti_versioni_margin_bottom_mm_finito
                    CHECK (margin_bottom_mm > '-Infinity'::numeric AND margin_bottom_mm < 'Infinity'::numeric),
                ADD CONSTRAINT chk_template_documenti_versioni_margin_left_mm_finito
                    CHECK (margin_left_mm > '-Infinity'::numeric AND margin_left_mm < 'Infinity'::numeric),
                ADD CONSTRAINT chk_template_documenti_versioni_margin_right_mm_finito
                    CHECK (margin_right_mm > '-Infinity'::numeric AND margin_right_mm < 'Infinity'::numeric),
                ADD CONSTRAINT chk_template_documenti_versioni_margin_top_mm_finito
                    CHECK (margin_top_mm > '-Infinity'::numeric AND margin_top_mm < 'Infinity'::numeric);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE documenti.template_documenti_versioni
                DROP CONSTRAINT IF EXISTS chk_template_documenti_versioni_margin_bottom_mm_finito,
                DROP CONSTRAINT IF EXISTS chk_template_documenti_versioni_margin_left_mm_finito,
                DROP CONSTRAINT IF EXISTS chk_template_documenti_versioni_margin_right_mm_finito,
                DROP CONSTRAINT IF EXISTS chk_template_documenti_versioni_margin_top_mm_finito;
