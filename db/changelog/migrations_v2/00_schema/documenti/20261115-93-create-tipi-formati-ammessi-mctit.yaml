# ------------------------------------------------------------
# I FORMATI CHE OGNI TIPO AMMETTE
#   documenti.tipi_asset_documento_formati   (tipo di risorsa x formato)
#   documenti.tipi_file_documento_formati    (tipo di file della stampa x formato)
#   Seed nel mirror 80_data/20261115-95; il controllo alla scrittura in
#   20_code/documenti/20261115-94.
#
# -- PERCHE' --------------------------------------------------------------
#   D15 (Q8b, Q15): ogni tipo dichiara i suoi formati nel database, che li
#   controlla quando una risorsa o un file nasce; il backend legge la lista da
#   qui e continua a controllare i byte. Due tabelle con la stessa forma: i
#   padri sono due vocabolari diversi, e una FK punta a una tabella sola.
#   Nessun attivo e nessuno storico: un abbinamento nasce o si ritira con un
#   changeSet (Q14); l'applicazione legge soltanto (90_end/20261115-98).
#   L'indice sul formato copre la FK verso config.formati_file; quella verso
#   il tipo e' coperta dalla UNIQUE, che comincia dal tipo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20261115-93-create-tipi-formati-ammessi-mctit.yaml

  - changeSet:
      id: 20261115-93-create-tipi-formati-ammessi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I formati di file che ogni tipo di risorsa e ogni tipo di file della stampa ammettono.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.tipi_asset_documento_formati (
                  id               BIGINT GENERATED BY DEFAULT AS IDENTITY
                                   CONSTRAINT pk_tipi_asset_documento_formati PRIMARY KEY,
                  asset_tipo_id    BIGINT      NOT NULL
                                   CONSTRAINT fk_tipi_asset_documento_formati_tipo
                                   REFERENCES documenti.tipi_asset_documento (id)
                                   ON UPDATE RESTRICT ON DELETE RESTRICT,
                  formato_file_id  BIGINT      NOT NULL
                                   CONSTRAINT fk_tipi_asset_documento_formati_formato
                                   REFERENCES config.formati_file (id)
                                   ON UPDATE RESTRICT ON DELETE RESTRICT,
                  data_insert      TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_insert      TEXT        NOT NULL DEFAULT CURRENT_USER,
                  data_update      TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_update      TEXT        NOT NULL DEFAULT CURRENT_USER,
                  tx_id            UUID,
                  CONSTRAINT uq_tipi_asset_documento_formati
                      UNIQUE (asset_tipo_id, formato_file_id)
              );
              CREATE INDEX ix_tipi_asset_documento_formati_formato_file_id
                  ON documenti.tipi_asset_documento_formati (formato_file_id);

              CREATE TABLE documenti.tipi_file_documento_formati (
                  id               BIGINT GENERATED BY DEFAULT AS IDENTITY
                                   CONSTRAINT pk_tipi_file_documento_formati PRIMARY KEY,
                  file_tipo_id     BIGINT      NOT NULL
                                   CONSTRAINT fk_tipi_file_documento_formati_tipo
                                   REFERENCES documenti.tipi_file_documento (id)
                                   ON UPDATE RESTRICT ON DELETE RESTRICT,
                  formato_file_id  BIGINT      NOT NULL
                                   CONSTRAINT fk_tipi_file_documento_formati_formato
                                   REFERENCES config.formati_file (id)
                                   ON UPDATE RESTRICT ON DELETE RESTRICT,
                  data_insert      TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_insert      TEXT        NOT NULL DEFAULT CURRENT_USER,
                  data_update      TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_update      TEXT        NOT NULL DEFAULT CURRENT_USER,
                  tx_id            UUID,
                  CONSTRAINT uq_tipi_file_documento_formati
                      UNIQUE (file_tipo_id, formato_file_id)
              );
              CREATE INDEX ix_tipi_file_documento_formati_formato_file_id
                  ON documenti.tipi_file_documento_formati (formato_file_id);

              COMMENT ON TABLE documenti.tipi_asset_documento_formati IS
                  'I formati di file che ogni tipo di risorsa ammette: una risorsa nasce solo in un formato abbinato al suo tipo (documenti.trgfn_guard_formato_ammesso). Il backend legge da qui la lista da proporre e da controllare sui byte. Un abbinamento nasce o si ritira con un changeSet; l''applicazione legge soltanto.';
              COMMENT ON COLUMN documenti.tipi_asset_documento_formati.asset_tipo_id IS
                  'Il tipo di risorsa.';
              COMMENT ON COLUMN documenti.tipi_asset_documento_formati.formato_file_id IS
                  'Il formato che il tipo ammette.';
              COMMENT ON CONSTRAINT uq_tipi_asset_documento_formati ON documenti.tipi_asset_documento_formati IS
                  'Un formato si abbina una volta sola a un tipo.';

              COMMENT ON TABLE documenti.tipi_file_documento_formati IS
                  'I formati di file che ogni tipo di file della stampa ammette: il PDF principale e gli allegati nascono solo in un formato abbinato al loro tipo (documenti.trgfn_guard_formato_ammesso). Il backend legge da qui la lista da controllare sui byte. Un abbinamento nasce o si ritira con un changeSet; l''applicazione legge soltanto.';
              COMMENT ON COLUMN documenti.tipi_file_documento_formati.file_tipo_id IS
                  'Il tipo di file della stampa.';
              COMMENT ON COLUMN documenti.tipi_file_documento_formati.formato_file_id IS
                  'Il formato che il tipo ammette.';
              COMMENT ON CONSTRAINT uq_tipi_file_documento_formati ON documenti.tipi_file_documento_formati IS
                  'Un formato si abbina una volta sola a un tipo.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS documenti.tipi_file_documento_formati;
              DROP TABLE IF EXISTS documenti.tipi_asset_documento_formati;
