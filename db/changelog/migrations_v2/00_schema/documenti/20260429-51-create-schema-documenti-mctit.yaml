# Liquibase changelog per Zero ERP
# Crea schema documenti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-51-create-schema-documenti-mctit.yaml

  - changeSet:
      id: 20260429-51-create-schema-documenti
      author: mctit
      comment: >
        Crea lo schema documenti per il motore documentale trasversale:
        template, versioni, asset e documenti generati.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE SCHEMA IF NOT EXISTS documenti;

              COMMENT ON SCHEMA documenti IS
                'Motore documentale trasversale: template, versioni, asset e documenti generati.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP SCHEMA IF EXISTS documenti CASCADE;
