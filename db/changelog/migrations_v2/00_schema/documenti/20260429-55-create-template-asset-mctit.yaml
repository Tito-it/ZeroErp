# Liquibase changelog per Zero ERP
# Crea documenti.template_asset
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-55-create-template-asset-mctit.yaml

  - changeSet:
      id: 20260429-55-create-template-asset
      author: mctit
      comment: >
        Crea il catalogo asset documentali per emittente, con deduplica per
        sha256 e finestra temporale standard.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.template_asset (
                  id                    bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  codice                varchar(120) NOT NULL,
                  codice_interno        varchar(120) NOT NULL,
                  
                  descrizione           text NOT NULL,
                  asset_tipo_id         bigint NOT NULL
                                          REFERENCES documenti.tipi_asset_documento(id)
                                          ON DELETE RESTRICT ON UPDATE CASCADE,
                  mime_type             varchar(120) NOT NULL,
                  file_name             text NOT NULL,
                  file_size_bytes       bigint NOT NULL,
                  storage_key           text NOT NULL,
                  sha256                varchar(64) NOT NULL,
                  emittente_fiscale_id  bigint NOT NULL
                                          REFERENCES anagrafiche.emittenti_fiscali(id)
                                          ON DELETE RESTRICT ON UPDATE CASCADE,
                  valido_dal            date NOT NULL DEFAULT CURRENT_DATE,
                  valido_al             date,
                  validita              daterange,
                  attivo                boolean NOT NULL DEFAULT true,
                  meta                  jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza            boolean NOT NULL DEFAULT true,
                  tx_id                 uuid,
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_template_asset_emittente_codice
                    UNIQUE (emittente_fiscale_id, codice),
                  CONSTRAINT uq_template_asset_emittente_codice_interno
                    UNIQUE (emittente_fiscale_id, codice_interno),
                  CONSTRAINT uq_template_asset_emittente_sha256
                    UNIQUE (emittente_fiscale_id, sha256),
                  CONSTRAINT chk_template_asset_codice_non_vuoto
                    CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_template_asset_codice_interno_non_vuoto
                    CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_template_asset_descrizione_non_vuota
                    CHECK (btrim(descrizione) <> ''),
                  CONSTRAINT chk_template_asset_mime_type_non_vuoto
                    CHECK (btrim(mime_type) <> ''),
                  CONSTRAINT chk_template_asset_file_name_non_vuoto
                    CHECK (btrim(file_name) <> ''),
                  CONSTRAINT chk_template_asset_storage_key_non_vuoto
                    CHECK (btrim(storage_key) <> ''),
                  CONSTRAINT chk_template_asset_file_size_pos
                    CHECK (file_size_bytes > 0),
                  CONSTRAINT chk_template_asset_sha256_len
                    CHECK (length(sha256) = 64)
              );

              COMMENT ON TABLE documenti.template_asset IS
                'Catalogo degli asset documentali riusabili per emittente fiscale.';

              COMMENT ON COLUMN documenti.template_asset.validita IS
                'Range di validita calcolato da script.trgfn_set_validita(). Non scrivere direttamente.';

              CREATE TRIGGER trg_template_asset_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON documenti.template_asset
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();

              ALTER TABLE documenti.template_asset
                ALTER COLUMN validita SET NOT NULL;

              CREATE INDEX ix_template_asset_tipo ON documenti.template_asset (asset_tipo_id);
              CREATE INDEX ix_template_asset_storage_key ON documenti.template_asset (storage_key);
              CREATE INDEX ix_template_asset_attivo ON documenti.template_asset (attivo);

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.template_asset;
