# ------------------------------------------------------------
# V-1 — OGNI VERSIONE DI TEMPLATE DICHIARA LA FORMA DEI DATI CHE LEGGE
#   documenti.template_documenti_versioni.versione_contesto integer
#   Brief: brief-db-documenti-versione-contesto-template.md §3, §4
#
#   Il builder del backend dichiara la forma che PRODUCE (`_meta.context_version`
#   nel contesto). Da qui la versione di template dichiara la forma che LEGGE, e
#   si stampa solo se i due numeri coincidono (guard 20260930-18).
#
# ── ⭐ UNA COLONNA, NON UNA CHIAVE DI context_schema ─────────────────────
#   Un numero che decide se si stampa deve potersi vincolare (CHECK, NOT NULL,
#   immutabile da pubblicata) e leggere con una query. Dentro un jsonb libero
#   non e' niente di questo. context_schema resta dov'e' (D-C3: la validazione
#   delle singole variabili e' fuori da questo giro).
#
# ── LA FORMA IN TRE PASSI ───────────────────────────────────────────────
#   qui la colonna NUDA (nullable) + CHECK >= 1; -15 il valore di ogni versione
#   esistente, letto versione per versione (D-C1); -16 il NOT NULL dietro un
#   cancello fail-closed. ⛔ Nessun DEFAULT, ne' ora ne' dopo: un default
#   sarebbe una forma dichiarata da nessuno — proprio il difetto che il patto
#   chiude. Chi crea una versione dice quale forma legge.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260930-14-add-template-documenti-versioni-versione-contesto-mctit.yaml

  - changeSet:
      id: 20260930-14-add-template-documenti-versioni-versione-contesto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Colonna versione_contesto (integer, nullable fino al backfill -15 e al NOT NULL -16) su
        documenti.template_documenti_versioni, con CHECK >= 1: la forma dei dati che la versione
        legge. Brief: brief-db-documenti-versione-contesto-template §4.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: documenti
                tableName: template_documenti_versioni
            - not:
                - columnExists:
                    schemaName: documenti
                    tableName: template_documenti_versioni
                    columnName: versione_contesto
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE documenti.template_documenti_versioni
                  ADD COLUMN versione_contesto integer;

              ALTER TABLE documenti.template_documenti_versioni
                  ADD CONSTRAINT chk_template_documenti_versioni_versione_contesto_pos
                  CHECK (versione_contesto >= 1);

              COMMENT ON COLUMN documenti.template_documenti_versioni.versione_contesto IS
                  'La forma dei dati (contesto) che questa versione del template legge: lo stesso numero che il builder del backend scrive in _meta.context_version del contesto che produce. Si stampa solo se i due numeri coincidono (documenti.fn_guard_versione_contesto: la chiamano il backend prima del render, il trigger sull''INSERT di documenti_generati e la pubblicazione). Il numero e'' di ogni tipo di documento, non globale: la forma 2 del preventivo non e'' la forma 2 del DDT. Obbligatorio, senza default: chi crea una versione dichiara quale forma legge. Una BOZZA puo'' dichiarare una forma che il builder non produce ancora (D-C4: e'' cosi'' che si prepara la versione per la forma successiva); da PUBBLICATA non si cambia. Brief: brief-db-documenti-versione-contesto-template.';

              COMMENT ON CONSTRAINT chk_template_documenti_versioni_versione_contesto_pos
                  ON documenti.template_documenti_versioni IS
                  'La forma dei dati si numera da 1.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE documenti.template_documenti_versioni
                  DROP COLUMN IF EXISTS versione_contesto;
