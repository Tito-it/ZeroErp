# Liquibase changelog per Zero ERP
# Crea documenti.documenti_generati_file
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-57-create-documenti-generati-file-mctit.yaml

  - changeSet:
      id: 20260429-57-create-documenti-generati-file
      author: mctit
      comment: >
        Crea la tabella file collegata ai documenti generati. Nella Fase A il
        caso d'uso attivo e' il solo PDF_FINALE.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.documenti_generati_file (
                  id                     bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  documento_generato_id  bigint NOT NULL
                                           REFERENCES documenti.documenti_generati(id)
                                           ON DELETE RESTRICT ON UPDATE CASCADE,
                  file_tipo_id           bigint NOT NULL
                                           REFERENCES documenti.tipi_file_documento(id)
                                           ON DELETE RESTRICT ON UPDATE CASCADE,
                  mime_type              varchar(120) NOT NULL,
                  file_name              text NOT NULL,
                  file_size_bytes        bigint NOT NULL,
                  storage_key            text NOT NULL,
                  sha256                 varchar(64) NOT NULL,
                  ordinamento            integer NOT NULL DEFAULT 1,
                  meta                   jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza             boolean NOT NULL DEFAULT true,
                  tx_id                  uuid,
                  data_insert            timestamptz NOT NULL DEFAULT now(),
                  user_insert            text NOT NULL DEFAULT CURRENT_USER,
                  data_update            timestamptz NOT NULL DEFAULT now(),
                  user_update            text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_documenti_generati_file_doc_tipo
                    UNIQUE (documento_generato_id, file_tipo_id),
                  CONSTRAINT chk_documenti_generati_file_mime_type_non_vuoto
                    CHECK (btrim(mime_type) <> ''),
                  CONSTRAINT chk_documenti_generati_file_file_name_non_vuoto
                    CHECK (btrim(file_name) <> ''),
                  CONSTRAINT chk_documenti_generati_file_storage_key_non_vuoto
                    CHECK (btrim(storage_key) <> ''),
                  CONSTRAINT chk_documenti_generati_file_size_pos
                    CHECK (file_size_bytes > 0),
                  CONSTRAINT chk_documenti_generati_file_sha256_len
                    CHECK (length(sha256) = 64),
                  CONSTRAINT chk_documenti_generati_file_ordinamento_pos
                    CHECK (ordinamento > 0)
              );

              CREATE INDEX ix_documenti_generati_file_documento
                  ON documenti.documenti_generati_file (documento_generato_id);
              CREATE INDEX ix_documenti_generati_file_file_tipo
                  ON documenti.documenti_generati_file (file_tipo_id);
              CREATE INDEX ix_documenti_generati_file_storage_key
                  ON documenti.documenti_generati_file (storage_key);

              COMMENT ON TABLE documenti.documenti_generati_file IS
                'File persistiti collegati a un documento generato. In Fase A: un solo PDF_FINALE per documento.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.documenti_generati_file;
