# Liquibase changelog per Zero ERP
# Crea documenti.template_documenti_versioni
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-54-create-template-documenti-versioni-mctit.yaml

  - changeSet:
      id: 20260429-54-create-template-documenti-versioni
      author: mctit
      comment: >
        Crea il versionamento dei template documentali con finestra temporale
        standard valido_dal/valido_al/validita e anti-overlap sulle versioni
        pubblicate attive.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.template_documenti_versioni (
                  id                    bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  template_documento_id bigint NOT NULL
                                          REFERENCES documenti.template_documenti(id)
                                          ON DELETE RESTRICT ON UPDATE CASCADE,
                  versione              integer NOT NULL,
                  stato                 varchar(30) NOT NULL DEFAULT 'BOZZA',
                  titolo                text NOT NULL,
                  formato_template      varchar(30) NOT NULL DEFAULT 'HTML',
                  html_template         text NOT NULL,
                  css_template          text,
                  markdown_template     text,
                  render_engine_id      bigint NOT NULL
                                          REFERENCES documenti.render_engine_documento(id)
                                          ON DELETE RESTRICT ON UPDATE CASCADE,
                  page_format           varchar(30) NOT NULL DEFAULT 'A4',
                  page_orientation      varchar(20) NOT NULL DEFAULT 'PORTRAIT',
                  margin_top_mm         numeric(8,2) NOT NULL DEFAULT 10,
                  margin_right_mm       numeric(8,2) NOT NULL DEFAULT 10,
                  margin_bottom_mm      numeric(8,2) NOT NULL DEFAULT 10,
                  margin_left_mm        numeric(8,2) NOT NULL DEFAULT 10,
                  valido_dal            date,
                  valido_al             date,
                  validita              daterange,
                  context_schema        jsonb NOT NULL DEFAULT '{}'::jsonb,
                  meta                  jsonb NOT NULL DEFAULT '{}'::jsonb,
                  attivo                boolean NOT NULL DEFAULT true,
                  storicizza            boolean NOT NULL DEFAULT true,
                  tx_id                 uuid,
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_template_documenti_versioni_template_versione
                    UNIQUE (template_documento_id, versione),
                  CONSTRAINT chk_template_documenti_versioni_versione_pos
                    CHECK (versione > 0),
                  CONSTRAINT chk_template_documenti_versioni_stato
                    CHECK (stato IN ('BOZZA', 'PUBBLICATA', 'OBSOLETA')),
                  CONSTRAINT chk_template_documenti_versioni_formato
                    CHECK (formato_template IN ('HTML', 'HTML_MARKDOWN_BLOCKS')),
                  CONSTRAINT chk_template_documenti_versioni_orientation
                    CHECK (page_orientation IN ('PORTRAIT', 'LANDSCAPE')),
                  CONSTRAINT chk_template_documenti_versioni_page_format
                    CHECK (page_format IN ('A4', 'A3', 'LETTER')),
                  CONSTRAINT chk_template_documenti_versioni_margini_non_neg
                    CHECK (
                      margin_top_mm >= 0 AND
                      margin_right_mm >= 0 AND
                      margin_bottom_mm >= 0 AND
                      margin_left_mm >= 0
                    ),
                  CONSTRAINT chk_template_documenti_versioni_titolo_non_vuoto
                    CHECK (btrim(titolo) <> ''),
                  CONSTRAINT chk_template_documenti_versioni_valido_dal_pubblicata
                    CHECK (stato <> 'PUBBLICATA' OR valido_dal IS NOT NULL)
              );

              COMMENT ON TABLE documenti.template_documenti_versioni IS
                'Versioni renderizzabili del template documentale, con validita temporale e stato di pubblicazione.';

              COMMENT ON COLUMN documenti.template_documenti_versioni.validita IS
                'Range di validita calcolato da script.trgfn_set_validita(). Non scrivere direttamente.';

              CREATE TRIGGER trg_template_documenti_versioni_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON documenti.template_documenti_versioni
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();

              ALTER TABLE documenti.template_documenti_versioni
                ALTER COLUMN validita SET NOT NULL;

              CREATE INDEX ix_template_documenti_versioni_template_stato_attivo
                  ON documenti.template_documenti_versioni (
                      template_documento_id,
                      stato,
                      attivo
                  );

              CREATE INDEX ix_template_documenti_versioni_template_valido_dal
                  ON documenti.template_documenti_versioni (
                      template_documento_id,
                      valido_dal,
                      valido_al
                  );

              ALTER TABLE documenti.template_documenti_versioni
                ADD CONSTRAINT ex_template_documenti_versioni_no_overlap_pubblicata
                EXCLUDE USING gist (
                  template_documento_id WITH =,
                  validita WITH &&
                )
                WHERE (attivo IS TRUE AND stato = 'PUBBLICATA');

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.template_documenti_versioni;
