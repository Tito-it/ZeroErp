# Liquibase changelog per Zero ERP
# Crea documenti.template_documenti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-53-create-template-documenti-mctit.yaml

  - changeSet:
      id: 20260429-53-create-template-documenti
      author: mctit
      comment: >
        Crea il contenitore logico dei template documentali, legati a tipo
        output, sorgente applicativa ed emittente fiscale.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.template_documenti (
                  id                        bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  tipo_documento_output_id  bigint NOT NULL
                                              REFERENCES documenti.tipi_documento_output(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  codice                    varchar(120) NOT NULL,
                  codice_interno            varchar(120) NOT NULL,
                  descrizione               text NOT NULL,
                  sorgente_tipo_id          bigint NOT NULL
                                              REFERENCES config.sorgenti(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  context_builder_code      varchar(160) NOT NULL,
                  file_name_pattern         text,
                  emittente_fiscale_id      bigint NOT NULL
                                              REFERENCES anagrafiche.emittenti_fiscali(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  is_default                boolean NOT NULL DEFAULT false,
                  attivo                    boolean NOT NULL DEFAULT true,
                  meta                      jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza                boolean NOT NULL DEFAULT true,
                  tx_id                     uuid,
                  data_insert               timestamptz NOT NULL DEFAULT now(),
                  user_insert               text NOT NULL DEFAULT CURRENT_USER,
                  data_update               timestamptz NOT NULL DEFAULT now(),
                  user_update               text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_template_documenti_emittente_sorgente_codice
                    UNIQUE (emittente_fiscale_id, sorgente_tipo_id, codice),
                  CONSTRAINT uq_template_documenti_emittente_sorgente_codice_interno
                    UNIQUE (emittente_fiscale_id, sorgente_tipo_id, codice_interno),
                  CONSTRAINT chk_template_documenti_codice_non_vuoto
                    CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_template_documenti_codice_interno_non_vuoto
                    CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_template_documenti_descrizione_non_vuota
                    CHECK (btrim(descrizione) <> ''),
                  CONSTRAINT chk_template_documenti_context_builder_non_vuoto
                    CHECK (btrim(context_builder_code) <> '')
              );

              CREATE INDEX ix_template_documenti_tipo_sorgente_emittente
                  ON documenti.template_documenti (
                      tipo_documento_output_id,
                      sorgente_tipo_id,
                      emittente_fiscale_id
                  );

              CREATE UNIQUE INDEX uq_template_documenti_default_attivo
                  ON documenti.template_documenti (
                      tipo_documento_output_id,
                      sorgente_tipo_id,
                      emittente_fiscale_id
                  )
                  WHERE is_default IS TRUE AND attivo IS TRUE;

              COMMENT ON TABLE documenti.template_documenti IS
                'Contenitore logico dei template documentali per output, sorgente ed emittente.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.template_documenti;
