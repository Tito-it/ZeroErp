# documenti: le policy RLS leggono l'utente di sessione dal BB.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b; Q60 (a)).
#
# Il perche': ogni policy convertiva app.current_user_id da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, come
#   facevano funzioni e viste prima del giro 8. Ora la legge
#   script.fn_utente_di_sessione('<schema>.<tabella>.<policy>') (20261123-16):
#   assente o vuota resta NULL, e la policy nasconde come prima; un valore che
#   non e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, che nomina la
#   policy, invece del 22P02 grezzo su ogni lettura della tabella.
#   La lettura resta nella sottoquery non correlata della funzione di
#   perimetro: valutata una volta per istruzione, non per riga.
# Policy: documenti_generati.rls_documenti_generati_ef_whitelist,
#   documenti_generati_eventi.rls_documenti_generati_eventi_ef_whitelist,
#   documenti_generati_file.rls_documenti_generati_file_ef_whitelist.
# ALTER POLICY ... USING / WITH CHECK: nome, comando, ruoli e PERMISSIVE
#   invariati. Espressioni dal vivo (dbdev, 2026-11-23), lette con search_path
#   vuoto: ogni nome qualificato. Le espressioni di prima tornano col blocco
#   di ritorno del changeSet.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20261123-31-update-policy-documenti-utente-di-sessione-mctit.yaml

  - changeSet:
      id: 20261123-31-update-policy-documenti-utente-di-sessione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        documenti: le policy RLS leggono app.current_user_id da script.fn_utente_di_sessione invece di
        convertirlo da se'. Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "4"
            sql: >
              SELECT (SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                       WHERE n.nspname = 'script' AND p.proname = 'fn_utente_di_sessione')
                   + (SELECT count(*) FROM pg_catalog.pg_policies
                       WHERE (schemaname, tablename, policyname) IN (('documenti', 'documenti_generati', 'rls_documenti_generati_ef_whitelist'), ('documenti', 'documenti_generati_eventi', 'rls_documenti_generati_eventi_ef_whitelist'), ('documenti', 'documenti_generati_file', 'rls_documenti_generati_file_ef_whitelist')))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_documenti_generati_ef_whitelist ON documenti.documenti_generati
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('documenti.documenti_generati.rls_documenti_generati_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), emittente_fiscale_id)))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('documenti.documenti_generati.rls_documenti_generati_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), emittente_fiscale_id)));
              ALTER POLICY rls_documenti_generati_eventi_ef_whitelist ON documenti.documenti_generati_eventi
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('documenti.documenti_generati_eventi.rls_documenti_generati_eventi_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('documenti.documenti_generati_eventi.rls_documenti_generati_eventi_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))));
              ALTER POLICY rls_documenti_generati_file_ef_whitelist ON documenti.documenti_generati_file
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('documenti.documenti_generati_file.rls_documenti_generati_file_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('documenti.documenti_generati_file.rls_documenti_generati_file_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))));
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_documenti_generati_ef_whitelist ON documenti.documenti_generati
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), emittente_fiscale_id)))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), emittente_fiscale_id)));
              ALTER POLICY rls_documenti_generati_eventi_ef_whitelist ON documenti.documenti_generati_eventi
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))));
              ALTER POLICY rls_documenti_generati_file_ef_whitelist ON documenti.documenti_generati_file
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('documento_generato'::text, documento_generato_id))));
