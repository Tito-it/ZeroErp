# Cantiere ristampa fedele — il vocabolario degli eventi accoglie la ristampa
#   (brief-db-evento-ristampa-fedele.md, richiesta BE→DB del 2026-08-03)
#
# ── PERCHE' UN VALORE NUOVO E NON `GENERATO` ─────────────────────────────
#   La ristampa fedele ri-produce un documento COM'ERA: legge la versione di
#   template con cui nacque e il contesto congelato allora, e **non crea** una
#   riga in `documenti_generati`. Registrarla come `GENERATO` sarebbe la
#   confusione che quel cantiere esiste per smontare: un'emissione e una
#   ristampa diventerebbero indistinguibili guardando la timeline, che e'
#   esattamente cio' per cui la timeline serve.
#
# ── SU `esito` NON SERVE NIENTE ──────────────────────────────────────────
#   Quando i byte non coincidono la ristampa usa `WARN`, gia' ammesso dal CHECK
#   `..._esito` (OK/KO/WARN), e li' significa esattamente «fedele nel contenuto,
#   non nei byte» (decisione di Tid, §8.2 del brief). Nessun valore nuovo.
#
# ── COSA SUCCEDEVA FINCHE' NON C'ERA ─────────────────────────────────────
#   Il cantiere BE/FE e' completo e funzionante senza questa riga: l'INSERT
#   dell'evento e' best-effort in transazione separata — stesso pattern del
#   `SCARICATO` del download — quindi il CHECK lo rifiutava, il servizio
#   loggava `documenti.ristampa_fedele.evento_fallito` e **il PDF usciva
#   comunque**. Negare la ristampa per un log mancante sarebbe peggio del log
#   mancante. Ma un rosso che si vede solo nei log e' un rosso che si smette di
#   guardare: e' il motivo per cui la riga arriva subito, non per cui il
#   cantiere era bloccato.
#
# ── NESSUN RISCHIO SUI DATI ──────────────────────────────────────────────
#   Si ALLARGA un insieme chiuso: nessuna riga esistente puo' violare il CHECK
#   nuovo, quindi non serve bonifica ne' precondizione sui dati. La forma e'
#   quella di `20260603-04` (DROP + ADD), perche' un CHECK non si estende:
#   si rifa'.
#
#   ⚠️ Il `COMMENT ON COLUMN` fa parte della modifica, non e' cosmesi: elenca
#   il set, ed e' il primo posto dove guarda chi cerca i valori ammessi. Un
#   commento che elenca quattro valori su cinque manda a cercare una migration
#   per capire il quinto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260803-05-alter-documenti-generati-eventi-evento-tipo-ristampa-fedele-mctit.yaml

  - changeSet:
      id: 20260803-05-alter-documenti-generati-eventi-evento-tipo-ristampa-fedele
      author: mctit
      failOnError: true
      comment: >
        Estende il CHECK chk_documenti_generati_eventi_evento_tipo con
        'RISTAMPA_FEDELE': e' l'unica scrittura del percorso di ristampa fedele
        (il documento non si rigenera, si ri-produce dallo snapshot congelato).
        Non si riusa GENERATO perche' una ristampa non e' un'emissione.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: documenti
                tableName: documenti_generati_eventi
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_constraint c
                    JOIN pg_class t     ON t.oid = c.conrelid
                    JOIN pg_namespace n ON n.oid = t.relnamespace
                   WHERE n.nspname = 'documenti'
                     AND t.relname = 'documenti_generati_eventi'
                     AND c.conname = 'chk_documenti_generati_eventi_evento_tipo'
            # Il valore non c'e' ancora: la migration non e' gia' passata.
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT COUNT(*)
                    FROM pg_constraint c
                    JOIN pg_class t     ON t.oid = c.conrelid
                    JOIN pg_namespace n ON n.oid = t.relnamespace
                   WHERE n.nspname = 'documenti'
                     AND t.relname = 'documenti_generati_eventi'
                     AND c.conname = 'chk_documenti_generati_eventi_evento_tipo'
                     AND pg_get_constraintdef(c.oid) LIKE '%RISTAMPA_FEDELE%'
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE documenti.documenti_generati_eventi
                  DROP CONSTRAINT IF EXISTS chk_documenti_generati_eventi_evento_tipo;

              ALTER TABLE documenti.documenti_generati_eventi
                  ADD CONSTRAINT chk_documenti_generati_eventi_evento_tipo
                  CHECK (evento_tipo IN (
                      'GENERATO',
                      'SCARICATO',
                      'STORAGE_ORPHAN',
                      'ALLEGATO_AGGIUNTO',
                      'RISTAMPA_FEDELE'
                  ));

              COMMENT ON COLUMN documenti.documenti_generati_eventi.evento_tipo IS
                  'Tipo evento applicativo. Set chiuso via CHECK: GENERATO, SCARICATO, STORAGE_ORPHAN, ALLEGATO_AGGIUNTO (append post-emissione, 2026-06-03), RISTAMPA_FEDELE (ri-produzione dallo snapshot congelato, 2026-08-03: NON e'' un''emissione, non crea righe in documenti_generati). Estensioni future via migration.';
      rollback:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE documenti.documenti_generati_eventi
                  DROP CONSTRAINT IF EXISTS chk_documenti_generati_eventi_evento_tipo;

              ALTER TABLE documenti.documenti_generati_eventi
                  ADD CONSTRAINT chk_documenti_generati_eventi_evento_tipo
                  CHECK (evento_tipo IN (
                      'GENERATO',
                      'SCARICATO',
                      'STORAGE_ORPHAN',
                      'ALLEGATO_AGGIUNTO'
                  ));
