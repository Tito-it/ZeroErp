# Liquibase changelog per Zero ERP
# Crea documenti.documenti_generati
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260429-56-create-documenti-generati-mctit.yaml

  - changeSet:
      id: 20260429-56-create-documenti-generati
      author: mctit
      comment: >
        Crea il registro storico delle generazioni persistite del motore
        documentale, con snapshot context e hash di audit.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.documenti_generati (
                  id                        bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  uid                       uuid NOT NULL DEFAULT uuidv7(),
                  tipo_documento_output_id  bigint NOT NULL
                                              REFERENCES documenti.tipi_documento_output(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  template_documento_id     bigint NOT NULL
                                              REFERENCES documenti.template_documenti(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  template_versione_id      bigint NOT NULL
                                              REFERENCES documenti.template_documenti_versioni(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  sorgente_tipo_id          bigint NOT NULL
                                              REFERENCES config.sorgenti(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  sorgente_uid              text NOT NULL,
                  sorgente_riga             bigint,
                  progressivo_sorgente      integer NOT NULL,
                  stato                     varchar(30) NOT NULL DEFAULT 'GENERATO',
                  titolo                    text NOT NULL,
                  nome_file                 text NOT NULL,
                  context_json              jsonb NOT NULL,
                  context_hash              varchar(64) NOT NULL,
                  template_hash             varchar(64) NOT NULL,
                  pdf_hash                  varchar(64) NOT NULL,
                  generato_da_user_id       integer,
                  generato_at               timestamptz NOT NULL DEFAULT now(),
                  emittente_fiscale_id      bigint NOT NULL
                                              REFERENCES anagrafiche.emittenti_fiscali(id)
                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                  meta                      jsonb NOT NULL DEFAULT '{}'::jsonb,
                  storicizza                boolean NOT NULL DEFAULT true,
                  tx_id                     uuid,
                  data_insert               timestamptz NOT NULL DEFAULT now(),
                  user_insert               text NOT NULL DEFAULT CURRENT_USER,
                  data_update               timestamptz NOT NULL DEFAULT now(),
                  user_update               text NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_documenti_generati_uid UNIQUE (uid),
                  CONSTRAINT uq_documenti_generati_sorgente_progressivo
                    UNIQUE NULLS NOT DISTINCT (
                      sorgente_tipo_id,
                      sorgente_uid,
                      sorgente_riga,
                      progressivo_sorgente
                    ),
                  CONSTRAINT chk_documenti_generati_progressivo_pos
                    CHECK (progressivo_sorgente > 0),
                  CONSTRAINT chk_documenti_generati_stato
                    CHECK (stato IN ('GENERATO', 'ARCHIVIATO', 'ANNULLATO')),
                  CONSTRAINT chk_documenti_generati_titolo_non_vuoto
                    CHECK (btrim(titolo) <> ''),
                  CONSTRAINT chk_documenti_generati_nome_file_non_vuoto
                    CHECK (btrim(nome_file) <> ''),
                  CONSTRAINT chk_documenti_generati_sorgente_uid_non_vuoto
                    CHECK (btrim(sorgente_uid) <> ''),
                  CONSTRAINT chk_documenti_generati_context_hash_len
                    CHECK (length(context_hash) = 64),
                  CONSTRAINT chk_documenti_generati_template_hash_len
                    CHECK (length(template_hash) = 64),
                  CONSTRAINT chk_documenti_generati_pdf_hash_len
                    CHECK (length(pdf_hash) = 64)
              );

              CREATE INDEX ix_documenti_generati_sorgente_uid
                  ON documenti.documenti_generati (sorgente_tipo_id, sorgente_uid);
              CREATE INDEX ix_documenti_generati_sorgente_riga
                  ON documenti.documenti_generati (sorgente_tipo_id, sorgente_uid, sorgente_riga);
              CREATE INDEX ix_documenti_generati_template_versione
                  ON documenti.documenti_generati (template_versione_id);
              CREATE INDEX ix_documenti_generati_generato_at
                  ON documenti.documenti_generati (generato_at DESC);
              CREATE INDEX ix_documenti_generati_stato
                  ON documenti.documenti_generati (stato);

              COMMENT ON TABLE documenti.documenti_generati IS
                'Registro storico delle generazioni persistite del motore documentale.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.documenti_generati;

  - changeSet:
      id: 20260429-56-01-add-fk-documenti-generati-django-auth-user
      author: mctit
      comment: >
        Aggiunge la FK a django.auth_user solo se la tabella esiste.
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: django
            tableName: auth_user
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: documenti
            baseTableName: documenti_generati
            baseColumnNames: generato_da_user_id
            referencedTableSchemaName: django
            referencedTableName: auth_user
            referencedColumnNames: id
            constraintName: fk_documenti_generati_django_auth_user
            onDelete: RESTRICT
            onUpdate: CASCADE

      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: documenti
            baseTableName: documenti_generati
            constraintName: fk_documenti_generati_django_auth_user
