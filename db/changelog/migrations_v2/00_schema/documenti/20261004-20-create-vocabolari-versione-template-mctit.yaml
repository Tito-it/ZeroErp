# ------------------------------------------------------------
# R-DB-1 — I VALORI AMMESSI DI UNA VERSIONE DI TEMPLATE: TRE VOCABOLARI
#   documenti.formati_template    HTML, HTML_MARKDOWN_BLOCKS
#   documenti.formati_pagina      A4, A3, LETTER
#   documenti.orientamenti_pagina PORTRAIT, LANDSCAPE
#   Brief: brief-db-vocabolari-versione-template, sezioni 3 e 5
#
# -- IL BUCO ---------------------------------------------------
#   formato_template, page_format e page_orientation di
#   documenti.template_documenti_versioni avevano l'insieme chiuso scritto
#   SOLO come CHECK (20260429-54). Un CHECK non si legge da una tendina, quindi
#   l'insieme viveva anche in tre frozenset del backend e in tre array del
#   frontend, e la copia del frontend divergeva (brief, sezione 2).
#
# -- PERCHE' NON CONTRADDICE LE DECISIONI 62-63 DEL 2026-04-29 --
#   Quelle decisioni (work-done/sviluppo-documenti.md) dicono «tecnici, non
#   lookup CONFIGURABILI»: e restano vere. Questi vocabolari si LEGGONO e non
#   si configurano: niente `attivo`, `pannello = false` nella whitelist del
#   lookup (R-DB-2). Cambia la sede dell'insieme, non chi lo decide.
#
# -- NIENTE `attivo`, E NON E' UNA DIMENTICANZA ----------------
#   Stesso ragionamento di config.esposizioni_componente (20261001-41): i
#   valori sono cio' che il motore di stampa deve saper onorare, non una
#   preferenza dell'installazione. Spegnerne uno non e' una configurazione che
#   il modello sappia onorare (le versioni PUBBLICATE che lo usano sono
#   immutabili, guard A1), e con `attivo` a ci_apply nascerebbe la coppia
#   ATTIVO su template_documenti_versioni. Un valore si aggiunge o si ritira
#   con un cantiere (seed + motore), non con un flag.
#
# -- LE FK PUNTANO A codice_interno ------------------------------
#   Le tre colonne restano varchar e portano il codice, com'erano: nessuna
#   conversione di tipo su righe PUBBLICATE immutabili, nessun cambio di
#   contratto per il backend, e i seed di 80_data gia' mergiati che copiano le
#   versioni (20260804-61, 20260805-09, 20260816-01) restano validi.
#   Precedente: 20261001-57. Le FK nascono in 80_data dopo il seed
#   (20261004-22): qui il catalogo e' ancora vuoto.
#
# -- CHE COSA NASCE DA SOLO -------------------------------------
#   ⭐ Il lock su codice_interno e' IMPLICITO per la sola presenza della
#   colonna (dbops.fn_run_automations_lock_columns, linee-guida-sql 6b).
#   ⚠️ Tabelle NUOVE: audit, tx_id e lock arrivano con `--contexts=ci_apply`,
#   non da qui (linee-guida-sql 11.5). Niente `storicizza`, quindi niente
#   storico e nessuna riga in dbops.storico_scope_policy (come il precedente).
#   Nessun GRANT: le ALTER DEFAULT PRIVILEGES del loop di 90_end coprono
#   tabelle e sequence.
#
# -- CATALOGO, NON MACCHINA ------------------------------------
#   Nessuna FK verso anagrafiche.*: vale identico su ogni installazione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20261004-20-create-vocabolari-versione-template-mctit.yaml

  - changeSet:
      id: 20261004-20-create-vocabolari-versione-template
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE documenti.formati_template, documenti.formati_pagina,
        documenti.orientamenti_pagina: i valori ammessi di formato_template, page_format e
        page_orientation di template_documenti_versioni, finora scritti solo come CHECK.
        Niente attivo: sono cio' che il motore di stampa onora, non una configurazione.
        Brief: brief-db-vocabolari-versione-template (R-DB-1).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: documenti
                tableName: formati_template
        - not:
            - tableExists:
                schemaName: documenti
                tableName: formati_pagina
        - not:
            - tableExists:
                schemaName: documenti
                tableName: orientamenti_pagina
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.formati_template (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_formati_template PRIMARY KEY,
                  codice_interno  VARCHAR(40)  NOT NULL,
                  codice          VARCHAR(40)  NOT NULL,
                  descrizione     VARCHAR(255),
                  etichetta_key   VARCHAR(120) NOT NULL,
                  ordine          SMALLINT,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id           UUID,
                  CONSTRAINT uq_formati_template_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_formati_template_codice_interno
                      UNIQUE (codice_interno),
                  CONSTRAINT chk_formati_template_codice_interno_non_vuoto
                      CHECK (btrim(codice_interno) <> '')
              );

              CREATE TABLE documenti.formati_pagina (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_formati_pagina PRIMARY KEY,
                  codice_interno  VARCHAR(40)  NOT NULL,
                  codice          VARCHAR(40)  NOT NULL,
                  descrizione     VARCHAR(255),
                  etichetta_key   VARCHAR(120) NOT NULL,
                  ordine          SMALLINT,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id           UUID,
                  CONSTRAINT uq_formati_pagina_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_formati_pagina_codice_interno
                      UNIQUE (codice_interno),
                  CONSTRAINT chk_formati_pagina_codice_interno_non_vuoto
                      CHECK (btrim(codice_interno) <> '')
              );

              CREATE TABLE documenti.orientamenti_pagina (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_orientamenti_pagina PRIMARY KEY,
                  codice_interno  VARCHAR(40)  NOT NULL,
                  codice          VARCHAR(40)  NOT NULL,
                  descrizione     VARCHAR(255),
                  etichetta_key   VARCHAR(120) NOT NULL,
                  ordine          SMALLINT,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id           UUID,
                  CONSTRAINT uq_orientamenti_pagina_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_orientamenti_pagina_codice_interno
                      UNIQUE (codice_interno),
                  CONSTRAINT chk_orientamenti_pagina_codice_interno_non_vuoto
                      CHECK (btrim(codice_interno) <> '')
              );

              COMMENT ON TABLE documenti.formati_template IS
                  'Formati della sorgente di una versione di template (HTML, HTML_MARKDOWN_BLOCKS): '
                  'i valori ammessi di documenti.template_documenti_versioni.formato_template, '
                  'legata per FK a codice_interno. Si legge (tendina del drawer della versione, '
                  'lookup generico), non si configura: niente attivo, un valore nuovo nasce con '
                  'il motore che lo sa trattare. Brief: brief-db-vocabolari-versione-template.';
              COMMENT ON TABLE documenti.formati_pagina IS
                  'Formati di pagina del PDF (A4, A3, LETTER): i valori ammessi di '
                  'documenti.template_documenti_versioni.page_format, legata per FK a '
                  'codice_interno. Si legge, non si configura: niente attivo. Brief: '
                  'brief-db-vocabolari-versione-template.';
              COMMENT ON TABLE documenti.orientamenti_pagina IS
                  'Orientamenti di pagina del PDF (PORTRAIT, LANDSCAPE): i valori ammessi di '
                  'documenti.template_documenti_versioni.page_orientation, legata per FK a '
                  'codice_interno. Si legge, non si configura: niente attivo. Brief: '
                  'brief-db-vocabolari-versione-template.';

              COMMENT ON COLUMN documenti.formati_template.codice_interno IS
                  'Chiave naturale stabile, immutabile via script.trgfn_lock_columns (provisionato '
                  'da ci_apply per la sola presenza della colonna). E'' la colonna puntata dalla FK '
                  'e l''unico valore su cui la logica confronta (linee-guida-sql 6c).';
              COMMENT ON COLUMN documenti.formati_pagina.codice_interno IS
                  'Chiave naturale stabile, immutabile via script.trgfn_lock_columns (provisionato '
                  'da ci_apply per la sola presenza della colonna). E'' la colonna puntata dalla FK '
                  'e l''unico valore su cui la logica confronta (linee-guida-sql 6c).';
              COMMENT ON COLUMN documenti.orientamenti_pagina.codice_interno IS
                  'Chiave naturale stabile, immutabile via script.trgfn_lock_columns (provisionato '
                  'da ci_apply per la sola presenza della colonna). E'' la colonna puntata dalla FK '
                  'e l''unico valore su cui la logica confronta (linee-guida-sql 6c).';

              COMMENT ON COLUMN documenti.formati_template.etichetta_key IS
                  'Chiave i18n dell''etichetta a video (documenti.formati_template.<codice>): la '
                  'tendina del drawer della versione la traduce da qui.';
              COMMENT ON COLUMN documenti.formati_pagina.etichetta_key IS
                  'Chiave i18n dell''etichetta a video (documenti.formati_pagina.<codice>): la '
                  'tendina del drawer della versione la traduce da qui.';
              COMMENT ON COLUMN documenti.orientamenti_pagina.etichetta_key IS
                  'Chiave i18n dell''etichetta a video (documenti.orientamenti_pagina.<codice>): la '
                  'tendina del drawer della versione la traduce da qui.';

              COMMENT ON COLUMN documenti.formati_template.ordine IS
                  'Ordine di presentazione nella tendina. Non ha semantica.';
              COMMENT ON COLUMN documenti.formati_pagina.ordine IS
                  'Ordine di presentazione nella tendina. Non ha semantica.';
              COMMENT ON COLUMN documenti.orientamenti_pagina.ordine IS
                  'Ordine di presentazione nella tendina. Non ha semantica.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS documenti.orientamenti_pagina;
              DROP TABLE IF EXISTS documenti.formati_pagina;
              DROP TABLE IF EXISTS documenti.formati_template;
