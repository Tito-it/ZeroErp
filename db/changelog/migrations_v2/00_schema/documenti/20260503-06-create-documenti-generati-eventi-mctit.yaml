# Liquibase changelog per Zero ERP
# Crea documenti.documenti_generati_eventi (anticipo Fase B v1)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260503-06-create-documenti-generati-eventi-mctit.yaml

  - changeSet:
      id: 20260503-06-create-documenti-generati-eventi
      author: mctit
      comment: >
        Anticipo da Fase B a v1 della tabella
        documenti.documenti_generati_eventi. Timeline append-only del ciclo vita
        documento (Decisioni 30, 31, 72). Eventi v1: GENERATO (post commit
        storage+DB), SCARICATO (download PDF), STORAGE_ORPHAN (cleanup post-fail
        commit DB).

        Note tecniche:
          - colonna 'storicizza' OMESSA volutamente: la tabella e' essa stessa
            il log di audit. fn_run_automations_storico_provision salta se la
            colonna non esiste, quindi nessuna tabella storico.* viene creata
            e nessun trigger storico viene attivato (stessa strategia del
            changeset 20260501-08 ma applicata ab initio);
          - 'evento_tipo' come varchar(60) con CHECK chiuso: stati workflow
            tecnici controllati dal codice, non lookup configurabili
            (Decisione 18). In Fase B il set sara' esteso (INVIATO,
            ARCHIVIATO, ANNULLATO) con migration successiva;
          - 'detail' jsonb obbligatoriamente object (CHECK jsonb_typeof),
            coerente con Step E Fase A;
          - 'user_id' NULL ammesso per eventi tecnici (STORAGE_ORPHAN); FK
            condizionale a django.auth_user nel changeSet 01-01 successivo.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE documenti.documenti_generati_eventi (
                  id                     bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  documento_generato_id  bigint NOT NULL
                                            REFERENCES documenti.documenti_generati(id)
                                            ON DELETE RESTRICT ON UPDATE CASCADE,
                  evento_tipo            varchar(60) NOT NULL,
                  evento_at              timestamptz NOT NULL DEFAULT now(),
                  user_id                integer,
                  esito                  varchar(30) NOT NULL DEFAULT 'OK',
                  messaggio              text,
                  detail                 jsonb NOT NULL DEFAULT '{}'::jsonb,
                  meta                   jsonb NOT NULL DEFAULT '{}'::jsonb,
                  tx_id                  uuid,
                  data_insert            timestamptz NOT NULL DEFAULT now(),
                  user_insert            text NOT NULL DEFAULT CURRENT_USER,
                  data_update            timestamptz NOT NULL DEFAULT now(),
                  user_update            text NOT NULL DEFAULT CURRENT_USER,

                  CONSTRAINT chk_documenti_generati_eventi_evento_tipo
                    CHECK (evento_tipo IN ('GENERATO', 'SCARICATO', 'STORAGE_ORPHAN')),
                  CONSTRAINT chk_documenti_generati_eventi_esito
                    CHECK (esito IN ('OK', 'KO', 'WARN')),
                  CONSTRAINT chk_documenti_generati_eventi_messaggio_non_vuoto
                    CHECK (messaggio IS NULL OR btrim(messaggio) <> ''),
                  CONSTRAINT chk_documenti_generati_eventi_detail_obj
                    CHECK (jsonb_typeof(detail) = 'object'),
                  CONSTRAINT chk_documenti_generati_eventi_meta_obj
                    CHECK (jsonb_typeof(meta) = 'object')
              );

              CREATE INDEX ix_documenti_generati_eventi_documento_evento_at
                  ON documenti.documenti_generati_eventi (documento_generato_id, evento_at DESC);
              CREATE INDEX ix_documenti_generati_eventi_evento_tipo
                  ON documenti.documenti_generati_eventi (evento_tipo);

              COMMENT ON TABLE documenti.documenti_generati_eventi IS
                'Timeline append-only degli eventi del ciclo vita documento (Decisioni 30/31/72). Eventi v1: GENERATO, SCARICATO, STORAGE_ORPHAN.';

              COMMENT ON COLUMN documenti.documenti_generati_eventi.evento_tipo IS
                'Tipo evento applicativo. Set v1 chiuso via CHECK: GENERATO, SCARICATO, STORAGE_ORPHAN. Estensioni Fase B via migration.';

              COMMENT ON COLUMN documenti.documenti_generati_eventi.user_id IS
                'Utente Django che ha originato l''evento. NULL per eventi tecnici (es. STORAGE_ORPHAN da cleanup automatico). FK condizionale a django.auth_user.';

              COMMENT ON COLUMN documenti.documenti_generati_eventi.detail IS
                'Dettaglio tecnico evento (jsonb object). Es. {"storage_key": "...", "size_bytes": 1024} per STORAGE_ORPHAN.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS documenti.documenti_generati_eventi;

  - changeSet:
      id: 20260503-06-01-add-fk-documenti-generati-eventi-django-auth-user
      author: mctit
      comment: >
        Aggiunge la FK a django.auth_user solo se la tabella esiste. Pattern
        condizionale per ambienti CI senza schema django (vedi
        feedback_django_refs_in_liquibase.md).
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: django
            tableName: auth_user
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: documenti
            baseTableName: documenti_generati_eventi
            baseColumnNames: user_id
            referencedTableSchemaName: django
            referencedTableName: auth_user
            referencedColumnNames: id
            constraintName: fk_documenti_generati_eventi_django_auth_user
            onDelete: NO ACTION
            onUpdate: CASCADE

      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: documenti
            baseTableName: documenti_generati_eventi
            constraintName: fk_documenti_generati_eventi_django_auth_user
