databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260514-27-alter-template-asset-validita-stored-mctit.yaml

  - changeSet:
      id: 20260514-27-alter-template-asset-validita-stored
      author: mctit
      comment: "Step 2b PG18: converte validita a STORED generated su documenti.template_asset."
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: documenti
              tableName: template_asset
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_attribute a
                  JOIN pg_class c ON c.oid = a.attrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname='documenti' AND c.relname='template_asset'
                   AND a.attname='validita' AND a.attnum>0
                   AND NOT a.attisdropped AND a.attgenerated=''
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_template_asset_a20_set_validita_ins_upd
                  ON documenti.template_asset;
              ALTER TABLE documenti.template_asset DROP COLUMN validita CASCADE;
              ALTER TABLE documenti.template_asset
                  ADD COLUMN validita DATERANGE
                      GENERATED ALWAYS AS (
                          daterange(COALESCE(valido_dal,'-infinity'::date),
                                    COALESCE(valido_al, 'infinity'::date),'[]')
                      ) STORED NOT NULL;
              COMMENT ON COLUMN documenti.template_asset.validita IS
                  'Range calcolato da valido_dal/valido_al. GENERATED ALWAYS STORED. rev 2026-05-14.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE documenti.template_asset DROP COLUMN IF EXISTS validita;
              ALTER TABLE documenti.template_asset ADD COLUMN validita DATERANGE;
              UPDATE documenti.template_asset SET validita=daterange(COALESCE(valido_dal,'-infinity'::date),COALESCE(valido_al,'infinity'::date),'[]');
              ALTER TABLE documenti.template_asset ALTER COLUMN validita SET NOT NULL;
