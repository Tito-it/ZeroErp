# ------------------------------------------------------------
# I COMMENT DELLE TABELLE E DELLE COLONNE DI documenti, AL PRESENTE
#   Giro 5 della revisione dello schema (pulizia e metadati).
#
# -- PERCHE' --------------------------------------------------------------
#   Il COMMENT e' il primo paragrafo della scheda auto-generata: descrive
#   l'oggetto al presente, senza storia (linee-guida-sql §5d).
#   - Riscritti: le colonne che portavano un marcatore di revisione, il nome
#     di un brief o una sigla (validita' di risorse e versioni, standard,
#     derivata_da_versione_id, versione_contesto); user_id e detail degli
#     eventi, che citavano un evento ritirato; i COMMENT di tabella di
#     stampa, risorse,
#     modelli e versioni, veri ma generici; le policy di file ed eventi delle
#     stampe, che portavano id di changeSet (il presidio non leggeva lo
#     schema delle policy). Nascono in 00_schema (20260910-32) e nessuna
#     fase tardiva le riscrive.
#   - Nuovi: ogni colonna delle 15 tabelle che non ne aveva uno, audit
#     compreso. Le colonne dei sette vocabolari e dei due abbinamenti avevano
#     gia' il loro: qui entrano id e audit.
#   formato_template, page_format e page_orientation non sono qui: li
#   riscrive 80_data, e la riscrittura sta nel 20261116-16.
#   Nessun comportamento cambia.
#
#   Rollback: i COMMENT di prima (NULL dove non c'erano), letti dal catalogo
#   di dbdev il 2026-11-17.
#   Brief: brief-db-revisione-documenti, giro 5 (§15).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20261116-10-comment-tabelle-e-colonne-documenti-mctit.yaml

  - changeSet:
      id: 20261116-10-comment-tabelle-e-colonne-documenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        documenti: i COMMENT delle tabelle e delle colonne al presente, e quelli che mancavano.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 15
            sql: >
              SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'documenti' AND c.relkind = 'r'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON TABLE documenti.documenti_generati IS
                  'Il registro delle stampe emesse dal motore documentale: una riga per documento prodotto, con i dati congelati, le impronte di dati, template e PDF, il modello e la versione con cui e'' nata e il documento da cui viene. E'' storia: dopo la nascita cambia solo meta (documenti.trgfn_documenti_generati_protect_snapshot) e la riga non si cancella (E_DOCUMENTI_GENERATO_DELETE_BLOCKED). Alla nascita il modello va bene per il documento e stampa oggi con quella versione (documenti.trgfn_documenti_generati_check_coerenza), i dati hanno la forma che la versione legge (documenti.trgfn_documenti_generati_guard_versione_contesto), e a fine transazione la stampa ha il suo PDF principale (documenti.trgfn_documenti_generati_guard_file_principale). I file stanno in documenti.documenti_generati_file, la cronologia in documenti.documenti_generati_eventi. Un operatore vede e scrive le stampe delle aziende del suo perimetro.';
              COMMENT ON COLUMN documenti.documenti_generati.id IS
                  'Identificativo della stampa. Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.uid IS
                  'Identificativo universale della stampa (uuid, DEFAULT uuidv7()), unico (uq_documenti_generati_uid). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.tipo_documento_output_id IS
                  'Il tipo di documento stampato (documenti.tipi_documento_output): alla nascita e'' quello del modello (documenti.trgfn_documenti_generati_check_coerenza). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.template_documento_id IS
                  'Il modello con cui la stampa e'' nata (documenti.template_documenti): alla nascita va bene per il documento (stessa sorgente, stesso tipo, stessa azienda, oppure standard) e stampa oggi. Non tiene acceso il modello: la chiave e'' un''eccezione della regola ATTIVO (dbops.automazione_attivo_eccezioni). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.template_versione_id IS
                  'La versione con cui la stampa e'' nata: e'' del modello indicato ed e'' quella in uso alla data operativa (documenti.fn_template_motivo_non_stampabile). La ristampa fedele la rilegge. Non tiene accesa la versione: la chiave e'' un''eccezione della regola ATTIVO. Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.titolo IS
                  'Il titolo della stampa, non vuoto (chk_documenti_generati_titolo_non_vuoto). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.nome_file IS
                  'Il nome del file PDF prodotto, non vuoto (chk_documenti_generati_nome_file_non_vuoto). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.context_json IS
                  'I dati congelati con cui il PDF e'' stato reso, un oggetto JSON (chk_documenti_generati_context_json_obj): _meta.context_version dichiara la loro forma, che e'' quella che la versione legge. La ristampa fedele rende di nuovo da qui. Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.context_hash IS
                  'Impronta SHA-256 di context_json, 64 caratteri esadecimali (chk_documenti_generati_context_hash_len). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.template_hash IS
                  'Impronta SHA-256 del template con cui il PDF e'' stato reso, 64 caratteri esadecimali (chk_documenti_generati_template_hash_len). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.pdf_hash IS
                  'Impronta SHA-256 del PDF prodotto, 64 caratteri esadecimali (chk_documenti_generati_pdf_hash_len): verifica che il file conservato sia quello. Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.generato_da_user_id IS
                  'L''utente dell''applicazione che ha chiesto la stampa (django.auth_user); NULL per una stampa nata senza utente. Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot). Anche il passaggio da o verso NULL e'' un cambio.';
              COMMENT ON COLUMN documenti.documenti_generati.generato_at IS
                  'Il momento della stampa (DEFAULT now()). Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.emittente_fiscale_id IS
                  'L''azienda del documento stampato (anagrafiche.emittenti_fiscali): decide chi vede la stampa (rls_documenti_generati_ef_whitelist) ed e'' nel perimetro di chi scrive (script.trgfn_guard_emittente_scope). Non tiene accesa l''azienda: la chiave e'' un''eccezione della regola ATTIVO. Fa parte dello snapshot: non cambia (documenti.trgfn_documenti_generati_protect_snapshot).';
              COMMENT ON COLUMN documenti.documenti_generati.meta IS
                  'Dati liberi della stampa (jsonb, DEFAULT ''{}''): l''unica colonna che cambia dopo la nascita.';
              COMMENT ON COLUMN documenti.documenti_generati.data_insert IS
                  'Momento dell''inserimento della riga (DEFAULT now()).';
              COMMENT ON COLUMN documenti.documenti_generati.user_insert IS
                  'Chi ha inserito la riga: l''utente dell''applicazione (GUC app.jwt_user) o, senza, il ruolo del database. Lo scrive script.trgfn_audit_data_user_generic.';
              COMMENT ON COLUMN documenti.documenti_generati.data_update IS
                  'Momento dell''ultima scrittura della riga, anche dell''inserimento: lo scrive script.trgfn_audit_data_user_generic.';
              COMMENT ON COLUMN documenti.documenti_generati.user_update IS
                  'Chi ha fatto l''ultima scrittura della riga, con la regola di user_insert: lo scrive script.trgfn_audit_data_user_generic.';
              COMMENT ON COLUMN documenti.documenti_generati.tx_id IS
                  'La transazione che ha scritto la riga per ultima, per legarla al registro dbops.transaction_ids e ai log: la scrive dbops.trgfn_tx_id_managed.';
              COMMENT ON COLUMN documenti.documenti_generati_eventi.id IS
