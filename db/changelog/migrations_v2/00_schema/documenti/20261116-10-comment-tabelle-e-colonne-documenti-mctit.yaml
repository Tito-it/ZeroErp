              COMMENT ON COLUMN documenti.documenti_generati_eventi.documento_generato_id IS
                  'La stampa a cui l''evento appartiene (documenti.documenti_generati): l''evento ne segue il perimetro.';
              COMMENT ON COLUMN documenti.documenti_generati_eventi.evento_at IS
                  'Il momento dell''evento (DEFAULT now()).';
              COMMENT ON COLUMN documenti.documenti_generati_eventi.user_id IS
                  'L''utente dell''applicazione che ha originato l''evento (django.auth_user); NULL per un evento nato senza utente.';
              COMMENT ON COLUMN documenti.documenti_generati_eventi.esito IS
                  'L''esito dell''evento: OK, KO o WARN (chk_documenti_generati_eventi_esito, DEFAULT OK). Una correzione e'' un evento nuovo con esito KO o WARN: un evento non si modifica.';
              COMMENT ON COLUMN documenti.documenti_generati_eventi.messaggio IS
                  'Il testo dell''evento per chi legge la cronologia: NULL oppure non vuoto (chk_documenti_generati_eventi_messaggio_non_vuoto).';
              COMMENT ON COLUMN documenti.documenti_generati_eventi.detail IS
