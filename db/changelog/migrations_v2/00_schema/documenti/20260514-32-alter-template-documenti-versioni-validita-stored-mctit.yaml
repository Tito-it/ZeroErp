databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/documenti/20260514-32-alter-template-documenti-versioni-validita-stored-mctit.yaml

  # ---------------------------------------------------------------------------
  # Step 2b — documenti.template_documenti_versioni.
  # EXCLUDE da ricreare: ex_template_documenti_versioni_no_overlap_pubblicata
  #   USING gist (template_documento_id, validita)
  #   WHERE (attivo IS TRUE AND stato = 'PUBBLICATA')
  # valido_dal e valido_al sono entrambi NULLABLE su questa tabella.
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260514-32-alter-template-documenti-versioni-validita-stored
      author: mctit
      comment: >
        Step 2b PG18: converte validita a STORED generated su
        documenti.template_documenti_versioni. Ricrea EXCLUDE no_overlap_pubblicata.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: documenti
              tableName: template_documenti_versioni
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_attribute a
                  JOIN pg_class c ON c.oid = a.attrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname='documenti' AND c.relname='template_documenti_versioni'
                   AND a.attname='validita' AND a.attnum>0
                   AND NOT a.attisdropped AND a.attgenerated=''
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_template_documenti_versioni_a20_set_validita_ins_upd
                  ON documenti.template_documenti_versioni;

              -- DROP CASCADE rimuove ex_template_documenti_versioni_no_overlap_pubblicata
              ALTER TABLE documenti.template_documenti_versioni DROP COLUMN validita CASCADE;

              ALTER TABLE documenti.template_documenti_versioni
                  ADD COLUMN validita DATERANGE
                      GENERATED ALWAYS AS (
                          daterange(COALESCE(valido_dal,'-infinity'::date),
                                    COALESCE(valido_al, 'infinity'::date),'[]')
                      ) STORED NOT NULL;

              COMMENT ON COLUMN documenti.template_documenti_versioni.validita IS
                  'Range calcolato da valido_dal/valido_al. GENERATED ALWAYS STORED. rev 2026-05-14.';

              CREATE INDEX ex_template_documenti_versioni_no_overlap_pubblicata
                  ON documenti.template_documenti_versioni
                  USING gist (template_documento_id, validita)
                  WHERE (attivo IS TRUE AND stato = 'PUBBLICATA');
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP INDEX IF EXISTS documenti.ex_template_documenti_versioni_no_overlap_pubblicata;
              ALTER TABLE documenti.template_documenti_versioni DROP COLUMN IF EXISTS validita;
              ALTER TABLE documenti.template_documenti_versioni ADD COLUMN validita DATERANGE;
              UPDATE documenti.template_documenti_versioni SET validita=daterange(COALESCE(valido_dal,'-infinity'::date),COALESCE(valido_al,'infinity'::date),'[]');
              ALTER TABLE documenti.template_documenti_versioni ALTER COLUMN validita SET NOT NULL;
              CREATE INDEX ex_template_documenti_versioni_no_overlap_pubblicata ON documenti.template_documenti_versioni USING gist (template_documento_id, validita) WHERE (attivo IS TRUE AND stato='PUBBLICATA');
