databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20260211-21-update-centri-riscossione-flags-mctit.yaml

  - changeSet:
      id: 20260211-21-update-centri-riscossione-flags
      author: mctit
      comment: "Aggiunge flag is_fondo_fattura e vincolo coerenza con is_compensazione"
      changes:
        - addColumn:
            schemaName: pagamenti
            tableName: centri_riscossione
            columns:
              - column:
                  name: is_fondo_fattura
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Centro usato per movimenti fondo fattura"
                  constraints:
                    nullable: false

              - sql:
                  splitStatements: false
                  stripComments: false
                  sql: |

                    ALTER TABLE pagamenti.centri_riscossione
                      ADD CONSTRAINT chk_centri_riscossione_ruolo_esclusivo
                      CHECK  NOT (is_compensazione = true AND is_fondo_fattura = true);
