# LA RLS SUL MOVIMENTO — passo S3-5 (lotto 6)
#   pagamenti.vendite_movimenti
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.3 S3-5 · Decisione: brief madre D5
#
# ── ⭐ QUI IL PREDICATO E' SEMPLICE, E LA RAGIONE E' NEL MODELLO ─────
#   `vendite_movimenti.fattura_id` e' **`NOT NULL`**. Un movimento nasce solo
#   quando il denaro e' stato **attribuito a un documento**: prima e' una riga
#   contabile, e le righe contabili hanno la loro policy.
#
#   Quindi il perimetro qui e' **quello della fattura**, esattamente come per la
#   fattura stessa e per i suoi satelliti — e la policy e' il mirror di
#   `rls_fatture_ef_whitelist`, con lo stesso adapter gia' usato da
#   `rls_fatture_indirizzi_ef_whitelist`.
#
#   ⭐ Ed e' anche il mirror del guard che questa tabella ha **gia'** in
#   scrittura dal 2026-06 (`trg_vendite_movimenti_a10_guard_emittente_scope`,
#   modo `fattura`): scrittura e lettura dicono adesso la **stessa cosa**, che
#   fino a oggi non era vero — si poteva non poter scrivere e poter leggere.
#
# ── ⚠️ L'ASIMMETRIA CON LA RIGA CONTABILE E' VOLUTA ──────────────────
#   La riga contabile ha **due** strade (il conto e la fattura); il movimento ne
#   ha una. Non e' una dimenticanza:
#
#     > **Un movimento appartiene al documento che paga.** Il conto racconta
#     > *da dove* il denaro e' arrivato, e quella e' una domanda sulla
#     > lavorazione — che si fa sulla riga contabile, dove la lavorazione vive.
#     > A saldo fatto, l'unica proprieta' che conta e' del documento.
#
#   ⚠️ Il caso di confine — un movimento nato da una riga sulla distinta di un
#   altro emittente — non e' raggiungibile: quella riga il guard di scrittura la
#   rifiuta prima (changeSet -18). E se ci si arrivasse per una via che oggi non
#   esiste, il movimento resterebbe visibile a chi ha la **fattura**, che e'
#   comunque la persona che deve accorgersene.
#
# ── 🔴 `FOR ALL`, e qui il `WITH CHECK` e' il predicato pieno ────────
#   Come per le altre due tabelle del lotto, `FOR SELECT` da sola avrebbe reso
#   la tabella di sola lettura (la RLS nega cio' che nessuna policy permette) e
#   avrebbe rotto ogni `INSERT ... RETURNING`, che passa dalla `USING`.
#   ⭐ Qui pero' il `WITH CHECK` puo' essere il **predicato intero** senza
#   nessuno sconto, e la ragione e' la stessa che rende semplice la `USING`: la
#   fattura del movimento **esiste gia'** quando il movimento nasce. Sulle altre
#   due tabelle il perimetro poteva non essere ancora risolvibile all'`INSERT`;
#   qui non c'e' nessun istante in cui non lo sia.
#
# ── ⚠️ `ENABLE` MA NON `FORCE` ──────────────────────────────────────
#   Stessa postura degli altri due changeSet del lotto e del resto del database.
#
# ── ⭐ CIO' CHE QUESTA POLICY RENDE VERO ─────────────────────────────
#   `fn_get_saldo_fattura`, `fn_get_saldo_rata` e la vista delle rate fuori
#   capienza sommano **i movimenti**. Da adesso sommano i movimenti **che
#   l'utente puo' vedere** — ⚠️ e questo e' esattamente il caso in cui uno zero
#   non e' un dato ma un perimetro che ha chiuso: chi legge un saldo a zero deve
#   poter distinguere «non e' arrivato niente» da «non e' roba mia». La
#   distinzione la fa il gate `OPERATORE`, fail-closed per costruzione, e il
#   fatto che un saldo si chiede sempre **partendo da un documento** che il
#   perimetro ha gia' filtrato.
#
# Verifica: db/pgtap/rls/test-rls-pagamenti-perimetro.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20260822-22-enable-rls-vendite-movimenti-mctit.yaml

  - changeSet:
      id: 20260822-22-enable-rls-vendite-movimenti
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Policy rls_vendite_movimenti_ef_whitelist su pagamenti.vendite_movimenti (FOR ALL,
        gate OPERATORE fail-closed) + ENABLE ROW LEVEL SECURITY senza FORCE. Predicato via
        fattura e basta: fattura_id e' NOT NULL, perche' un movimento nasce solo quando il
        denaro e' gia' attribuito a un documento. Mirror di rls_fatture_ef_whitelist e del
        guard di scrittura che questa tabella ha gia' — scrittura e lettura dicono finalmente
        la stessa cosa. Qui il WITH CHECK e' il predicato intero: la fattura del movimento
        esiste gia' quando il movimento nasce.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: pagamenti
                tableName: vendite_movimenti
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_scope_ef_whitelist_via_fattura';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP POLICY IF EXISTS rls_vendite_movimenti_ef_whitelist
                  ON pagamenti.vendite_movimenti;

              CREATE POLICY rls_vendite_movimenti_ef_whitelist
                  ON pagamenti.vendite_movimenti
                  AS PERMISSIVE
                  FOR ALL
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_fattura(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          fattura_id
                      )
                  )
                  WITH CHECK (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_fattura(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          fattura_id
                      )
                  );

              COMMENT ON POLICY rls_vendite_movimenti_ef_whitelist
                   ON pagamenti.vendite_movimenti IS
                  'RLS: l''operatore vede e scrive solo i movimenti delle fatture del proprio '
                  'perimetro. ⭐ Predicato via fattura e basta, e la ragione e'' nel modello: '
                  'fattura_id e'' NOT NULL perche'' un movimento nasce solo quando il denaro e'' '
                  'gia'' attribuito a un documento — prima e'' una riga contabile, e le righe hanno '
                  'la loro policy. Mirror di rls_fatture_ef_whitelist e del guard di scrittura che '
                  'questa tabella ha gia'' dal 2026-06: scrittura e lettura dicono finalmente la '
                  'stessa cosa. ⚠️ L''asimmetria con la riga contabile — che di strade ne ha due — '
                  'e'' voluta: un movimento appartiene al DOCUMENTO CHE PAGA, mentre il conto '
                  'racconta da dove il denaro e'' arrivato, che e'' una domanda sulla lavorazione e '
                  'si fa sulla riga contabile. ⭐ Qui il WITH CHECK e'' il predicato intero senza '
                  'sconti: la fattura del movimento esiste gia'' quando il movimento nasce, mentre '
                  'sulle altre due tabelle il perimetro poteva non essere ancora risolvibile '
                  'all''INSERT. rev 2026-08-22 (lotto 6, S3-5).';

              ALTER TABLE pagamenti.vendite_movimenti ENABLE ROW LEVEL SECURITY;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE pagamenti.vendite_movimenti DISABLE ROW LEVEL SECURITY;
              DROP POLICY IF EXISTS rls_vendite_movimenti_ef_whitelist
                  ON pagamenti.vendite_movimenti;
