# pagamenti: le policy RLS leggono l'utente di sessione dal BB.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b; Q60 (a)).
#
# Il perche': ogni policy convertiva app.current_user_id da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, come
#   facevano funzioni e viste prima del giro 8. Ora la legge
#   script.fn_utente_di_sessione('<schema>.<tabella>.<policy>') (20261123-16):
#   assente o vuota resta NULL, e la policy nasconde come prima; un valore che
#   non e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, che nomina la
#   policy, invece del 22P02 grezzo su ogni lettura della tabella.
#   La lettura resta nella sottoquery non correlata della funzione di
#   perimetro: valutata una volta per istruzione, non per riga.
# Policy: enti_incasso.rls_enti_incasso_perimetro_incasso,
#   sistemazioni.rls_sistemazioni_ef_whitelist,
#   vendite_contabili.rls_vendite_contabili_perimetro_incasso,
#   vendite_contabili_lotti.rls_vendite_contabili_lotti_perimetro_incasso,
#   vendite_contabili_righe.rls_vendite_contabili_righe_perimetro_incasso,
#   vendite_movimenti.rls_vendite_movimenti_ef_whitelist.
# ALTER POLICY ... USING / WITH CHECK: nome, comando, ruoli e PERMISSIVE
#   invariati. Espressioni dal vivo (dbdev, 2026-11-23), lette con search_path
#   vuoto: ogni nome qualificato. Le espressioni di prima tornano col blocco
#   di ritorno del changeSet.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20261123-33-update-policy-pagamenti-utente-di-sessione-mctit.yaml

  - changeSet:
      id: 20261123-33-update-policy-pagamenti-utente-di-sessione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        pagamenti: le policy RLS leggono app.current_user_id da script.fn_utente_di_sessione invece di
        convertirlo da se'. Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "7"
            sql: >
              SELECT (SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                       WHERE n.nspname = 'script' AND p.proname = 'fn_utente_di_sessione')
                   + (SELECT count(*) FROM pg_catalog.pg_policies
                       WHERE (schemaname, tablename, policyname) IN (('pagamenti', 'enti_incasso', 'rls_enti_incasso_perimetro_incasso'), ('pagamenti', 'sistemazioni', 'rls_sistemazioni_ef_whitelist'), ('pagamenti', 'vendite_contabili', 'rls_vendite_contabili_perimetro_incasso'), ('pagamenti', 'vendite_contabili_lotti', 'rls_vendite_contabili_lotti_perimetro_incasso'), ('pagamenti', 'vendite_contabili_righe', 'rls_vendite_contabili_righe_perimetro_incasso'), ('pagamenti', 'vendite_movimenti', 'rls_vendite_movimenti_ef_whitelist')))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_enti_incasso_perimetro_incasso ON pagamenti.enti_incasso
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND ((num_nulls(soggetto_ruolo_conto_bancario_id) = 1) OR (EXISTS ( SELECT 1
                 FROM anagrafiche.soggetti_ruoli_conti_bancari src
                WHERE ((src.id = enti_incasso.soggetto_ruolo_conto_bancario_id) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.enti_incasso.rls_enti_incasso_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('soggetto_ruolo'::text, src.soggetto_ruolo_id))))))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND ((num_nulls(soggetto_ruolo_conto_bancario_id) = 1) OR (EXISTS ( SELECT 1
                 FROM anagrafiche.soggetti_ruoli_conti_bancari src
                WHERE ((src.id = enti_incasso.soggetto_ruolo_conto_bancario_id) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.enti_incasso.rls_enti_incasso_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('soggetto_ruolo'::text, src.soggetto_ruolo_id))))))));
              ALTER POLICY rls_sistemazioni_ef_whitelist ON pagamenti.sistemazioni
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.sistemazioni.rls_sistemazioni_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('soggetto_ruolo'::text, emittente_soggetto_ruolo_id))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.sistemazioni.rls_sistemazioni_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('soggetto_ruolo'::text, emittente_soggetto_ruolo_id))));
              ALTER POLICY rls_vendite_contabili_perimetro_incasso ON pagamenti.vendite_contabili
