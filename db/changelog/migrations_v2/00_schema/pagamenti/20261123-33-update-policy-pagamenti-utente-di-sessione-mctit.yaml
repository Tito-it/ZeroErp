                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_contabili_lotti.rls_vendite_contabili_lotti_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('contabile'::text, contabile_id))));
