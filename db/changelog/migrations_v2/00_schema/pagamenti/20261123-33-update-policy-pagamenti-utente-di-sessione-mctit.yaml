                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND (script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_contabili_righe.rls_vendite_contabili_righe_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('contabile'::text, contabile_id)) OR ((fattura_id IS NOT NULL) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_contabili_righe.rls_vendite_contabili_righe_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('fattura'::text, fattura_id))))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND (script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_contabili_righe.rls_vendite_contabili_righe_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('contabile'::text, contabile_id)) OR ((fattura_id IS NOT NULL) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_contabili_righe.rls_vendite_contabili_righe_perimetro_incasso')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('fattura'::text, fattura_id))))));
              ALTER POLICY rls_vendite_movimenti_ef_whitelist ON pagamenti.vendite_movimenti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_movimenti.rls_vendite_movimenti_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('fattura'::text, fattura_id))))
                  WITH CHECK (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('pagamenti.vendite_movimenti.rls_vendite_movimenti_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('fattura'::text, fattura_id))));
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_enti_incasso_perimetro_incasso ON pagamenti.enti_incasso
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND ((num_nulls(soggetto_ruolo_conto_bancario_id) = 1) OR (EXISTS ( SELECT 1
                 FROM anagrafiche.soggetti_ruoli_conti_bancari src
                WHERE ((src.id = enti_incasso.soggetto_ruolo_conto_bancario_id) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS fn_get_emittenti_scope_pk_ids), script.fn_resolve_emittente_fiscale_id('soggetto_ruolo'::text, src.soggetto_ruolo_id))))))))
