# IL CONTO SU CUI IL DENARO ATTERRA — passo S3-1 (lotto 6)
#   pagamenti.enti_incasso.soggetto_ruolo_conto_bancario_id
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.3 S3-1 · Decisione: brief madre D5
#
# ── ⭐ IL PROBLEMA CHE QUESTA COLONNA RISOLVE ─────────────────────────
#   Quando mille euro arrivano in banca **non hanno ancora una fattura**, e il
#   perimetro dell'operatore in questo sistema si risolve *dalla fattura*.
#   Applicare la regola normale renderebbe la coda «da abbinare» **invisibile a
#   tutti** — non «visibile a chi non dovrebbe»: invisibile. E una lista vuota
#   sembra una lista di cose finite.
#
#   La regola di dominio che scioglie il nodo (Tid, 2026-08-09):
#
#     > Un emittente e' un'azienda con partita IVA propria; due emittenti non
#     > possono avere la stessa partita IVA; quindi hanno **conti correnti
#     > diversi**.
#
#   Ne segue che il denaro ha un padrone **dal primo istante**: l'ha deciso il
#   cliente scegliendo su quale conto pagare. Il sistema, fino a oggi, buttava
#   via quell'informazione e poi si accorgeva di non averla.
#
# ── 🔴 PERCHE' E' `NOT NULL` SU TUTTI I TIPI, e non solo su BANCA ─────
#   Il piano (S3-1) diceva «obbligatoria per `tipo = BANCA`, come gia' lo e'
#   `bank_branch_id`». ⚠️ **Scritta cosi' sarebbe stata lo stesso difetto con un
#   altro vestito**: un ente `POSTE`, `PSP` o `ALTRO` non avrebbe avuto nessun
#   perimetro, e la sua coda sarebbe stata invisibile a tutti — cioe' esattamente
#   il caso che D5 esiste per evitare, spostato su un altro `tipo`.
#
#   E non e' nemmeno vero che manchi il dato: il denaro di **ogni** canale
#   atterra su un conto dell'azienda. Un conto corrente postale ha un IBAN; il
#   saldo di un PSP arriva sul conto di accredito dell'emittente. La colonna non
#   dice «di che banca sei», dice **su quale conto dell'azienda finisce il denaro
#   di questo canale** — e quella domanda ha risposta per tutti e quattro i tipi.
#
#   ⚠️ `bank_branch_id` resta com'e', obbligatorio per `tipo = BANCA` e vietato
#   altrove: e' un fatto diverso (la **filiale**), e non e' il perimetro.
#
#   ⭐ Costo del `NOT NULL` oggi: **zero righe** in tabella. Il costo di
#   aggiungerlo dopo sarebbe una migrazione con dati da bonificare.
#
# ── ⚠️ IL RISCHIO DELLA SCELTA, E DOVE LO SI FA CADERE ────────────────
#   Un ente configurato senza conto produrrebbe una coda invisibile. Si chiude
#   rendendo il conto **obbligatorio alla configurazione**: si fallisce dove se
#   ne accorge chi puo' rimediare, non in esercizio dove non se ne accorge
#   nessuno (D5).
#
#   📮 Conseguenza operativa, ed e' **voluta**: finche' i due emittenti non hanno
#   un conto con `uso = 'INCASSO'` censito, **nessun ente di incasso e'
#   configurabile**. Oggi i due conti `INCASSO` in archivio sono di un terzo
#   soggetto (SR 64), non degli emittenti (SR 72 e 159). E' il passo S3-3 del
#   piano, che e' **dato**, non codice.
#
# ── ⚠️ COSA LA FK NON SA, E CHI GLIELO DICE ───────────────────────────
#   La FK garantisce che la riga puntata **esista**, non che sia un conto di
#   **incasso**: `uso` e' una colonna della riga puntata, e una FK non legge le
#   colonne di cio' che punta. Senza un guard si potrebbe agganciare un ente al
#   conto usato per i **pagamenti** — e allora l'unicita' del passo S3-2, che
#   vale solo sulle righe `INCASSO`, non coprirebbe piu' niente.
#   Lo dice `pagamenti.trgfn_enti_incasso_guard_conto_incasso` (changeSet -14).
#
# Dipendenze: anagrafiche.soggetti_ruoli_conti_bancari.
# Verifica: db/pgtap/pagamenti/test-enti-incasso-conto-incasso.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20260822-13-alter-enti-incasso-conto-incasso-mctit.yaml

  - changeSet:
      id: 20260822-13-alter-enti-incasso-conto-incasso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        pagamenti.enti_incasso.soggetto_ruolo_conto_bancario_id NOT NULL + FK a
        anagrafiche.soggetti_ruoli_conti_bancari. E' il perimetro dei soldi non ancora
        attribuiti (D5): quando il denaro arriva non ha una fattura, e senza questa colonna
        la coda «da abbinare» sarebbe invisibile a tutti. NOT NULL su TUTTI i tipi e non solo
        su BANCA, al contrario di quanto diceva il piano: un ente POSTE/PSP/ALTRO senza conto
        sarebbe lo stesso difetto spostato su un altro tipo, e il denaro di ogni canale
        atterra comunque su un conto dell'azienda. Tabella a zero righe: il NOT NULL non
        costa niente oggi.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: pagamenti
                tableName: enti_incasso
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_ruoli_conti_bancari
            - not:
                - columnExists:
                    schemaName: pagamenti
                    tableName: enti_incasso
                    columnName: soggetto_ruolo_conto_bancario_id
            - sqlCheck:
                expectedResult: 0
                sql: SELECT count(*) FROM pagamenti.enti_incasso;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE pagamenti.enti_incasso
                ADD COLUMN soggetto_ruolo_conto_bancario_id bigint NOT NULL;

              -- ⚠️ NO ACTION esplicito, come ovunque in questo cantiere: staccare
              --    il conto da un soggetto mentre un ente di incasso ci si appoggia
              --    e' una situazione che va VISTA. Un CASCADE cancellerebbe il
              --    canale, un SET NULL non e' nemmeno possibile (colonna NOT NULL)
              --    — e sarebbe comunque il modo di far sparire un perimetro senza
              --    che nessuno lo sappia.
              ALTER TABLE pagamenti.enti_incasso
                ADD CONSTRAINT fk_enti_incasso_conto_incasso
                FOREIGN KEY (soggetto_ruolo_conto_bancario_id)
                REFERENCES anagrafiche.soggetti_ruoli_conti_bancari (id)
                ON UPDATE NO ACTION
                ON DELETE NO ACTION;

              COMMENT ON COLUMN pagamenti.enti_incasso.soggetto_ruolo_conto_bancario_id IS
                'Il conto dell''azienda SU CUI ATTERRA il denaro di questo canale (anagrafiche.soggetti_ruoli_conti_bancari). ⭐ E'' IL PERIMETRO dei soldi non ancora attribuiti (D5): quando mille euro arrivano in banca non hanno ancora una fattura, e il perimetro dell''operatore si risolve dalla fattura — senza questa colonna la coda «da abbinare» sarebbe invisibile a TUTTI, che e'' peggio di visibile a chi non dovrebbe, perche'' una lista vuota sembra una lista di cose finite. Il denaro ha un padrone dal primo istante: l''ha deciso il cliente scegliendo su quale conto pagare. ⚠️ NOT NULL su TUTTI i tipi, non solo su BANCA: un ente POSTE/PSP/ALTRO senza conto sarebbe lo stesso difetto travestito, e il denaro di ogni canale atterra comunque su un conto dell''azienda (un conto postale ha un IBAN, il saldo di un PSP arriva sul conto di accredito). ⚠️ Da non confondere con bank_branch_id, che e'' la FILIALE e resta obbligatoria solo per tipo = BANCA. ⚠️ La FK garantisce che la riga esista, NON che il suo `uso` sia INCASSO: quello lo impone trgfn_enti_incasso_guard_conto_incasso, e senza di lui l''unicita'' ex_src_bancari_conto_incasso_un_solo_soggetto — che vive solo sulle righe INCASSO — non coprirebbe piu'' niente.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE pagamenti.enti_incasso
                DROP CONSTRAINT fk_enti_incasso_conto_incasso;

              ALTER TABLE pagamenti.enti_incasso
                DROP COLUMN soggetto_ruolo_conto_bancario_id;
