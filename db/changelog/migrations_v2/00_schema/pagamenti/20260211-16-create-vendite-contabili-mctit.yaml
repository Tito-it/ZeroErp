databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20260211-16-create-vendite-contabili-mctit.yaml

  - changeSet:
      id: 20260211-16-create-vendite-contabili
      author: mctit
      comment: "Testata contabile movimenti vendite"
      changes:
        - createTable:
