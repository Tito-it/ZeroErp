              - column:
                  name: codice
                  type: character varying
                  remarks: "Codice testata contabile"
                  constraints:
                    nullable: false
              - column:
                  name: centro_riscossione_id
                  type: bigint
                  remarks: "Centro riscossione"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vendite_contabili_centro_riscossione
                    referencedTableSchemaName: pagamenti
                    referencedTableName: centri_riscossione
                    referencedColumnNames: id
              - column:
                  name: data_contabile
                  type: date
                  remarks: "Data contabile"
                  constraints:
                    nullable: false
              - column:
                  name: data_registrazione
                  type: DATE
                  remarks: "Data registrazione movimento"
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati"
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
