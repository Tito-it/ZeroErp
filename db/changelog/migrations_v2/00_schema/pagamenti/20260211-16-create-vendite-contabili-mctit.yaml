                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: pagamenti
            tableName: vendite_contabili
            columnNames: codice
            constraintName: uq_vendite_contabili_codice

  - changeSet:
      id: 20260211-16-02-update-vendite-contabili
      author: mctit
      comment: "Aggiunta campo tx_id"
