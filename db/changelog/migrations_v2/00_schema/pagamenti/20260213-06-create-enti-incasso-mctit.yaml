databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20260213-06-create-enti-incasso-mctit.yaml

  - changeSet:
      id: 20260213-06-create-enti-incasso
      author: mctit
      comment: "Canali provenienza flussi incasso con integrazione anagrafiche/pagamenti"
      changes:
        - createTable:
            schemaName: pagamenti
            tableName: enti_incasso
            remarks: "Canali di provenienza flussi incasso (banca, poste, psp, altro)"
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_enti_incasso
                    nullable: false
              - column:
                  name: codice
                  type: text
                  remarks: "Codice ente/canale incasso"
                  constraints:
                    nullable: false
              - column:
                  name: codice_interno
                  type: text
                  remarks: "Codice interno tecnico"
                  constraints:
                    nullable: true
              - column:
                  name: descrizione
                  type: text
                  remarks: "Descrizione ente/canale"
                  constraints:
                    nullable: false
              - column:
                  name: tipo
                  type: text
                  remarks: "Tipo canale: BANCA, POSTE, PSP, ALTRO"
                  constraints:
                    nullable: false
              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Record attivo"
                  constraints:
                    nullable: false
              - column:
                  name: centro_riscossione_id
                  type: bigint
                  remarks: "Centro riscossione operativo"
                  constraints:
                    nullable: true
              - column:
                  name: soggetto_ruolo_id
                  type: bigint
                  remarks: "Ruolo soggetto associato (banca/psp/poste)"
                  constraints:
                    nullable: true
              - column:
                  name: bank_branch_id
                  type: bigint
                  remarks: "Filiale bancaria (obbligatoria se tipo=BANCA)"
                  constraints:
                    nullable: true
              - column:
                  name: formato_flusso
                  type: text
                  remarks: "Formato flusso import (es. CBI, CSV, XML)"
                  constraints:
                    nullable: true
              - column:
                  name: regole_match
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Regole di matching movimenti"
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estesi"
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction ID"
                  constraints:
                    nullable: true

        - addUniqueConstraint:
            schemaName: pagamenti
            tableName: enti_incasso
            columnNames: codice
            constraintName: uq_enti_incasso_codice

        - addForeignKeyConstraint:
            baseTableSchemaName: pagamenti
            baseTableName: enti_incasso
            baseColumnNames: centro_riscossione_id
            referencedTableSchemaName: pagamenti
            referencedTableName: centri_riscossione
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_enti_incasso_centro_riscossione

        - addForeignKeyConstraint:
            baseTableSchemaName: pagamenti
            baseTableName: enti_incasso
            baseColumnNames: soggetto_ruolo_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti_ruoli
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_enti_incasso_soggetto_ruolo

        - addForeignKeyConstraint:
            baseTableSchemaName: pagamenti
            baseTableName: enti_incasso
            baseColumnNames: bank_branch_id
            referencedTableSchemaName: anagrafiche
            referencedTableName: bank_branches
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_enti_incasso_bank_branch

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE pagamenti.enti_incasso
                ADD CONSTRAINT chk_enti_incasso_tipo
                CHECK (tipo IN ('BANCA', 'POSTE', 'PSP', 'ALTRO'));

              ALTER TABLE pagamenti.enti_incasso
                ADD CONSTRAINT chk_enti_incasso_bank_branch_tipo
                CHECK (
                  (tipo = 'BANCA' AND bank_branch_id IS NOT NULL)
                  OR (tipo <> 'BANCA' AND bank_branch_id IS NULL)
                );
