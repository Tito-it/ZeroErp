# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
      - logicalFilePath: migrations_v2/00_schema/pagamenti/20260213-27-update-vendite-contabili-compensazione-model-mctit.yaml

      - changeSet:
              id: 20260213-27-update-vendite-contabili-compensazione-model
              author: mctit
              comment: "Sposta compensazione su vendite_contabili e rimuove da vendite_movimenti"
              changes:
                    - addColumn:
                            schemaName: pagamenti
                            tableName: vendite_contabili
                            columns:
                                  - column:
                                          name: compensazione_id
                                          type: bigint
                                          remarks: "FK compensazione (1 compensazione = 1 testata contabile)"
                                          constraints:
                                                nullable: true

                    - addForeignKeyConstraint:
                            baseTableSchemaName: pagamenti
                            baseTableName: vendite_contabili
                            baseColumnNames: compensazione_id
                            referencedTableSchemaName: pagamenti
                            referencedTableName: compensazioni
                            referencedColumnNames: id
                            onDelete: NO ACTION
                            onUpdate: NO ACTION
                            constraintName: fk_vendite_contabili_compensazione

                    - addUniqueConstraint:
                            schemaName: pagamenti
                            tableName: vendite_contabili
                            columnNames: compensazione_id
                            constraintName: uq_vendite_contabili_compensazione

                    - dropForeignKeyConstraint:
                            baseTableSchemaName: pagamenti
                            baseTableName: vendite_movimenti
                            constraintName: fk_vendite_movimenti_compensazione

                    - dropColumn:
                            schemaName: pagamenti
                            tableName: vendite_movimenti
                            columnName: compensazione_id
