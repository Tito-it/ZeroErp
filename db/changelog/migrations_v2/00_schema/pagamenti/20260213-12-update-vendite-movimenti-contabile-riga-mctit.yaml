# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/pagamenti/20260213-12-update-vendite-movimenti-contabile-riga-mctit.yaml

  - changeSet:
      id: 20260213-12-update-vendite-movimenti-contabile-riga
      author: mctit
      comment: "Estende vendite_movimenti con contabile_riga_id e data_valuta"
      changes:
        - addColumn:
            schemaName: pagamenti
            tableName: vendite_movimenti
            columns:
              - column:
                  name: contabile_riga_id
                  type: bigint
                  remarks: "Riga contabile di riferimento (deriva contabile_id)"
                  constraints:
                    nullable: true
              - column:
                  name: data_valuta
                  type: date
                  remarks: "Data valuta movimento"
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            constraintName: fk_vendite_movimenti_contabile_riga
            baseTableSchemaName: pagamenti
            baseTableName: vendite_movimenti
            baseColumnNames: contabile_riga_id
            referencedTableSchemaName: pagamenti
            referencedTableName: vendite_contabili_righe
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS uq_vendite_movimenti_contabile_riga
              ON pagamenti.vendite_movimenti (contabile_riga_id)
              WHERE contabile_riga_id IS NOT NULL;
