databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20251010-15-create-termini-pagamenti-mctit.yaml

  - changeSet:
      id: 20251010-15-create-termini-pagamenti
      author: mctit
      preConditions:
      - onFail: MARK_RAN
      - onError: MARK_RAN
      - not:
        -  tableExists:
            schemaName: config
            tableName: termini_pagamento
            
      changes:
        - createTable:
            schemaName: config
            tableName: termini_pagamento
            columns:
              
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_termini_pagamento
              
              - column: { name: codice, type: VARCHAR(32), constraints: { nullable: false }}
              - column: { name: codice_interno, type: VARCHAR(32), constraints: { nullable: false }, remarks: "Codice interno immutabile" }
              - column: { name: descrizione, type: VARCHAR(120), constraints: { nullable: false }}
              # logica base
              - column: { name: numero_rate, type: SMALLINT, constraints: { nullable: false }}          # es. 1, 2, 3, 12
              - column: { name: unita_intervallo, type: CHAR(1), constraints: { nullable: false }}     # 'G' giorni, 'M' mesi
              - column: { name: intervallo, type: SMALLINT, constraints: { nullable: false }}          # es. 30 -> ogni 30 giorni/1 mese
              - column: { name: primo_offset_giorni, type: SMALLINT }                                  # es. 30/45 (se diverso dal resto)
              - column:
                    name: tipo_offset
                    type: CHAR(1)
                    defaultValue: "N"
                    constraints:
                      nullable: false

              # ripartizione importi
              - column: { name: ripartizione, type: VARCHAR(16), defaultValue: "UGUALI", constraints: { nullable: false }}  # UGUALI|PROPORZIONALE|LIBERA
              - column: { name: arrotondamento_metodo, type: VARCHAR(12), defaultValue: "HALF_UP", constraints: { nullable: false }}
              - column: { name: arrotondamento_decimali, type: SMALLINT, defaultValueNumeric: 2, constraints: { nullable: false }}
              - column: { name: attivo, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false }}
              # audit
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false }}
              - column: { name: user_insert, type: TEXT, defaultValueComputed: "CURRENT_USER", constraints: { nullable: false }}
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false }}
              - column: { name: user_update, type: TEXT, defaultValueComputed: "CURRENT_USER", constraints: { nullable: false }}
        
        - addUniqueConstraint:
            schemaName: config
            tableName: termini_pagamento
            columnNames: codice
            constraintName: uq_termini_pagamento_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: termini_pagamento
            columnNames: codice_interno
            constraintName: uq_cfg_termini_pagamento_codice_interno

          # --- Indici: semplici + funzionali UPPER(...) 
        
        - createIndex: { schemaName: config, tableName: termini_pagamento, indexName: ix_cfg_termini_pagamento_attivo, columns: [ { name: attivo } ] }
      
        - createIndex:
            schemaName: config
            tableName: termini_pagamento
            indexName: ix_termini_pagamento_codice_upper
            columns:
              - column:
                  name: "upper(codice)"
                  descending: false

        - createIndex:
            schemaName: config
            tableName: termini_pagamento
            indexName: ix_termini_pagamento_codice_interno_upper
            columns:
              - column:
                  name: "upper(codice_interno)"
                  descending: false

        - createIndex:
            schemaName: config
            tableName: termini_pagamento
            indexName: ix_termini_pagamento_descrizione_upper
            columns:
              - column:
                   name: "upper(descrizione)"
                   descending: false
        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE config.termini_pagamento
                ADD CONSTRAINT chk_termini_pagamento_tipo_offset
                CHECK (tipo_offset IN ('G','M','F','N'));

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE config.termini_pagamento
                ADD CONSTRAINT chk_termini_pagamento_ripartizione
                CHECK (ripartizione IN ('UGUALI','PROPORZIONALE','LIBERA'));
        
        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE config.termini_pagamento
                ADD CONSTRAINT chk_termini_pagamento_arrotondamento_metodo
                CHECK (arrotondamento_metodo IN ('HALF_UP','HALF_DOWN','HALF_EVEN'));
    
      rollback:
        - dropTable:
            schemaName: config
            tableName: termini_pagamento


  - changeSet:
      id: 220251010-16-create-termini-pagamenti
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            sql: |
              
              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_termini_pagamento_tipo_offset;
              
              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_termini_pagamento_intervallo_uso; 
              
              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_termini_pagamento_intervallo_range;

              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_clienti_tipo_offset;

              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_clienti_intervallo_uso;
              
              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_clienti_intervallo_range;
              
              -- Check validità e valori ammessi
               ALTER TABLE config.termini_pagamento
                ADD CONSTRAINT  
                chk_termini_pagamento_tipo_offset 
                CHECK (tipo_offset in ('G', 'M', 'F', 'N'));

              ALTER TABLE config.termini_pagamento
                ADD CONSTRAINT  
                chk_termini_pagamento_intervallo_uso 
                CHECK ((tipo_offset in  ('G', 'F') AND intervallo IS NOT NULL) OR (tipo_offset in ('M', 'N') AND intervallo IS NULL));

               ALTER TABLE config.termini_pagamento
                ADD CONSTRAINT  
                 chk_termini_pagamento_intervallo_range 
                 CHECK (intervallo IS NULL OR intervallo >= 0 AND intervallo <= 365);
    
  - changeSet:
      id: 220251010-17-create-termini-pagamenti
      author: mctit
      changes:
        - sql:
            splitStatements: false
            sql: |

              -- 1) Rendere intervallo NULLABLE (coerente coi CHECK)
                ALTER TABLE config.termini_pagamento ALTER COLUMN intervallo DROP NOT NULL;

              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_termini_pag_numero_rate_pos;
                
              ALTER TABLE IF EXISTS config.termini_pagamento 
              DROP CONSTRAINT IF EXISTS 
              chk_termini_pag_arrotond_dec;
              


              -- 2) Range min/max
              ALTER TABLE config.termini_pagamento
              ADD CONSTRAINT  chk_termini_pag_numero_rate_pos CHECK (numero_rate >= 1),
              ADD CONSTRAINT  chk_termini_pag_arrotond_dec CHECK (arrotondamento_decimali BETWEEN 0 AND 6);