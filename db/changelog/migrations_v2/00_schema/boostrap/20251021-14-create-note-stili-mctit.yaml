databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20251021-14-create-note-stili-mctit.yaml

  # 20251021-14 — CREATE config.note_stili
  - changeSet:
      id: 20251021-24-create-note-stili
      author: mctit

      changes:
        - createTable:
            schemaName: config
            tableName: note_stili
            remarks: "Dominio degli stili per le note (normalizzazione di campo 'stile' nelle tabelle note)."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_config_note_stili
                    nullable: false

              - column:
                  name: codice
                  type: VARCHAR(16)
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: VARCHAR(16)
                  remarks: "Chiave funzionale interna, immutabile (bloccata da trigger applicativo)."
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: note
                  type: TEXT

              - column:
                  name: data_insert
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: TEXT
                  defaultValueComputed: CURRENT_USER
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: TEXT
                  defaultValueComputed: CURRENT_USER
                  constraints:
                    nullable: false

              - column:
                  name: storicizza
                  type: BOOLEAN
                  defaultValueBoolean: true

        # Vincoli di univocità
        - addUniqueConstraint:
            schemaName: config
            tableName: note_stili
            columnNames: codice
            constraintName: uq_cfg_note_stili_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: note_stili
            columnNames: codice_interno
            constraintName: uq_cfg_note_stili_codice_interno

        # Check minimi su lunghezze dei codici
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
               
                ALTER TABLE config.note_stili
                    ADD CONSTRAINT chk_cfg_note_stili_codice_len
                    CHECK (char_length(codice) BETWEEN 2 AND 16);  

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
               
                ALTER TABLE config.note_stili
                    ADD CONSTRAINT chk_cfg_note_stili_codice_interno_len
                    CHECK (char_length(codice_interno) BETWEEN 2 AND 16);  


        # Indici utili
        - createIndex:
            schemaName: config
            tableName: note_stili
            indexName: ix_cfg_note_stili_attivo
            columns:
              - column:
                  name: attivo

        - createIndex:
            schemaName: config
            tableName: note_stili
            indexName: ix_cfg_note_stili_codice_upper
            columns:
              - column:
                  name: "upper(codice)"
                  descending: false

        - createIndex:
            schemaName: config
            tableName: note_stili
            indexName: ix_cfg_note_stili_codice_interno_upper
            columns:
              - column:
                  name: "upper(codice_interno)"
                  descending: false

        - createIndex:
            schemaName: config
            tableName: note_stili
            indexName: ix_cfg_note_stili_descrizione_upper
            columns:
              - column:
                  name: "upper(descrizione)"
                  descending: false

        # Commenti di documentazione
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              COMMENT ON TABLE config.note_stili IS 'Dominio degli stili per le note. Normalizza il campo "stile" (es. NORMALE, GRASSETTO, AVVISO, PICCOLO).';
              COMMENT ON COLUMN config.note_stili.codice IS 'Codice esposto e utilizzabile a UI/integrazioni (max 16).';
              COMMENT ON COLUMN config.note_stili.codice_interno IS 'Codice funzionale interno immutabile (bloccabile via trigger).';
              COMMENT ON COLUMN config.note_stili.descrizione IS 'Descrizione leggibile dello stile.';

  # 20251021-15 — INSERT bootstrap stili base
  - changeSet:
      id: 20251021-15-insert-note-stili-bootstrap
      author: mctit
      preConditions:
        - onFail: CONTINUE
        - tableIsEmpty:
            schemaName: config
            tableName: note_stili
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO config.note_stili (codice, codice_interno, descrizione)
              VALUES
                ('NORMALE',   'NORMALE',   'Stile standard'),
                ('GRASSETTO', 'GRASSETTO', 'Testo evidenziato in grassetto'),
                ('AVVISO',    'AVVISO',    'Testo di avviso/attenzione'),
                ('PICCOLO',   'PICCOLO',   'Testo secondario di dimensione ridotta')
              ON CONFLICT DO NOTHING;