databaseChangeLog:
 
  - changeSet:
      id: 20251001-14-alter-magazzino-eventi-assets-use-stato-ids
      author: mctit
      logicalFilePath: migrations_v2/10_schema/20251001-14-alter-magazzino-eventi-assets-use-stato-ids.yaml
      changes:
        - addColumn:
            schemaName: magazzino
            tableName: eventi_assets
            columns:
              - column: { name: stato_da_id, type: BIGINT, remarks: "FK → config.stati_assets(id)" }
              - column: { name: stato_a_id,  type: BIGINT, remarks: "FK → config.stati_assets(id)" }
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE magazzino.eventi_assets e
              SET stato_da_id = s1.id
              FROM config.stati_assets s1
              WHERE e.stato_da IS NOT NULL AND UPPER(e.stato_da) = s1.codice;
              UPDATE magazzino.eventi_assets e
              SET stato_a_id = s2.id
              FROM config.stati_assets s2
              WHERE e.stato_a IS NOT NULL AND UPPER(e.stato_a) = s2.codice;
        - createIndex: { schemaName: magazzino, tableName: eventi_assets, indexName: ix_mag_eventi_assets_stato_da_id, columns: [ { name: stato_da_id } ] }
        - createIndex: { schemaName: magazzino, tableName: eventi_assets, indexName: ix_mag_eventi_assets_stato_a_id, columns: [ { name: stato_a_id } ] }
        # Se vuoi renderli obbligatori quando presenti, lasciare NOT NULL fuori (alcuni eventi non cambiano stato).
        - dropColumn: { schemaName: magazzino, tableName: eventi_assets, columnName: stato_da }
        - dropColumn: { schemaName: magazzino, tableName: eventi_assets, columnName: stato_a }


  
  - changeSet:
      id: 20251001-13-alter-magazzino-eventi-assets-use-tipo-evento-id
      author: mctit
      logicalFilePath: migrations_v2/10_schema/20251001-13-alter-magazzino-eventi-assets-use-tipo-evento-id.yaml
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          - columnExists:
              schemaName: magazzino
              tableName: eventi_assets
              columnName: tipo_evento_id

      changes:
        # 0) Drop  dell'indice su tipo_evento
        - dropIndex:
            indexName: ix_mag_eventi_assets_tipo
            schemaName: magazzino
            tableName: eventi_assets
            ifExists: true

        # 1) Aggiungi colonna FK (temporaneamente nullable per migrazione dati)
        - addColumn:
            schemaName: magazzino
            tableName: eventi_assets
            columns:
              - column: { name: tipo_evento_id, type: BIGINT, remarks: "FK → config.tipi_evento_assets(id)" }

        # 2) Migrazione dati: mappa i valori esistenti della colonna 'tipo_evento' sulla tabella di dominio
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              UPDATE magazzino.eventi_assets e
              SET tipo_evento_id = t.id
              FROM config.tipi_evento_assets t
              WHERE UPPER(e.tipo_evento) = t.codice;

        # 3) Vincolo NOT NULL + FK + indice
        - addNotNullConstraint: { schemaName: magazzino, tableName: eventi_assets, columnName: tipo_evento_id, columnDataType: BIGINT }
        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: eventi_assets
            baseColumnNames: tipo_evento_id
            referencedTableSchemaName: config
            referencedTableName: tipi_evento_assets
            referencedColumnNames: id
            constraintName: fk_mag_eventi_assets_tipo_evento
            onDelete: NO ACTION
            onUpdate: CASCADE
        - createIndex: { schemaName: magazzino, tableName: eventi_assets, indexName: ix_mag_eventi_assets_tipo_evento_id, columns: [ { name: tipo_evento_id } ] }

        # 4) Drop colonna legacy
        - dropColumn: { schemaName: magazzino, tableName: eventi_assets, columnName: tipo_evento }