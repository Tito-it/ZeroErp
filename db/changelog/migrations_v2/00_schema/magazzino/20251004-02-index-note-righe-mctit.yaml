# ------------------------------------------------------------
# Drop dei vecchi campi "note" nello schema magazzino
# ------------------------------------------------------------
databaseChangeLog:

  - changeSet:
      id: 20251004-02-index-note-righe
      author: mctit
      logicalFilePath: migrations_v2/00_schema/magazzino/20251004-02-index-note-righe.yaml
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE INDEX IF NOT EXISTS ix_mag_note_by_riga
              ON magazzino.note (target_tipo, target_id, target_riga_id, anchor_tipo, posizione, seq)
              WHERE target_riga_id IS NOT NULL;