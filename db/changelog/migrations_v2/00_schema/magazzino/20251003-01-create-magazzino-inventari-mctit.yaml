databaseChangeLog:
  - changeSet:
      id: 20251003-01-create-magazzino-inventari
      author: mctit
      logicalFilePath: migrations_v2/00_schema/20251003-01-create-magazzino-inventari.yaml
      changes:
        - createTable:
            schemaName: magazzino
            tableName: inventari
            remarks: "Documento conteggio fisico inventario"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT,
                          constraints: { primaryKey: true, primaryKeyName: pk_mag_inv, nullable: false } }
              - column: { name: uid, type: UUID, defaultValueComputed: "gen_random_uuid()", constraints: { nullable: false } }
              - column: { name: data, type: DATE, defaultValueComputed: "CURRENT_DATE", constraints: { nullable: false } }
              - column: { name: stato_mag_inventario, type: VARCHAR(16), defaultValue: "DRAFT", constraints: { nullable: false },
                          remarks: "DRAFT|COUNTING|CONFIRM|POSTED|CANCEL" }
              - column: { name: magazzino_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: descrizione, type: VARCHAR(255) }
              - column: { name: note, type: TEXT }

              # opzionale: provenienza esterna
              - column: { name: sorgente_tipo_id, type: BIGINT }
              - column: { name: sorgente_uid, type: UUID }

              # meta/audit
              - column: { name: meta, type: JSONB, defaultValueComputed: "'{}'::jsonb", constraints: { nullable: false } }
              - column: { name: storicizza, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: tx_id, type: UUID }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER" }

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE magazzino.inventari
                ADD CONSTRAINT ck_mag_invetario_stato
                CHECK (stato_mag_inventario IN ('DRAFT','COUNTING','CONFIRM','POSTED','CANCEL'));



        - createIndex: { schemaName: magazzino, tableName: inventari, indexName: ix_mag_invetario_data, columns: [ { name: data } ] }
        - createIndex: { schemaName: magazzino, tableName: inventari, indexName: ix_mag_invetario_stato_inventario, columns: [ { name: stato_mag_inventario } ] }
        
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
                CREATE UNIQUE INDEX uq_mag_invetario_sorgente_fk
                  ON magazzino.inventari (sorgente_tipo_id, sorgente_uid)
                  WHERE sorgente_tipo_id IS NOT NULL AND sorgente_uid IS NOT NULL;


        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: inventari
            baseColumnNames: magazzino_id
            referencedTableSchemaName: magazzino
            referencedTableName: magazzini
            referencedColumnNames: id
            constraintName: fk_mag_inventari_magazzino
            onDelete: NO ACTION
            onUpdate: RESTRICT
       
        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: inventari
            baseColumnNames: sorgente_tipo_id
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            constraintName: fk_mag_inventari_sorgenti_tipo
            onDelete: NO ACTION
            onUpdate: RESTRICT
