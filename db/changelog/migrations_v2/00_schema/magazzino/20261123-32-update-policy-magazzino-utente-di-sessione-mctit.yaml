# ------------------------------------------------------------
# magazzino: le policy RLS leggono l'utente di sessione dal BB.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b; Q60 (a)).
#
# Il perche': ogni policy convertiva app.current_user_id da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, come
#   facevano funzioni e viste prima del giro 8. Ora la legge
#   script.fn_utente_di_sessione('<schema>.<tabella>.<policy>') (20261123-16):
#   assente o vuota resta NULL, e la policy nasconde come prima; un valore che
#   non e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, che nomina la
#   policy, invece del 22P02 grezzo su ogni lettura della tabella.
#   La lettura resta nella sottoquery non correlata della funzione di
#   perimetro: valutata una volta per istruzione, non per riga.
# Policy: assets.rls_assets_ef_whitelist,
#   eventi_assets.rls_eventi_assets_ef_whitelist,
#   inventari.rls_inventari_ef_whitelist,
#   inventari_righe.rls_inventari_righe_ef_whitelist,
#   lotti.rls_lotti_ef_whitelist, magazzini.rls_magazzini_ef_whitelist,
#   movimenti.rls_movimenti_ef_whitelist,
#   movimenti_attesi.rls_movimenti_attesi_ef_whitelist,
#   note.rls_note_ef_whitelist, note_asset.rls_note_asset_ef_whitelist,
#   note_evento_asset.rls_note_evento_asset_ef_whitelist,
#   note_inventario.rls_note_inventario_ef_whitelist,
#   note_inventario_riga.rls_note_inventario_riga_ef_whitelist,
#   note_movimento.rls_note_movimento_ef_whitelist,
#   note_rettifica.rls_note_rettifica_ef_whitelist,
#   note_rettifica_riga.rls_note_rettifica_riga_ef_whitelist,
#   note_trasferimento.rls_note_trasferimento_ef_whitelist,
#   note_trasferimento_riga.rls_note_trasferimento_riga_ef_whitelist,
#   rettifiche.rls_rettifiche_ef_whitelist,
#   rettifiche_righe.rls_rettifiche_righe_ef_whitelist,
#   trasferimenti.rls_trasferimenti_ef_whitelist,
#   trasferimenti_righe.rls_trasferimenti_righe_ef_whitelist,
#   ubicazioni.rls_ubicazioni_ef_whitelist,
#   valore_giacenza.rls_valore_giacenza_ef_whitelist.
# ALTER POLICY ... USING / WITH CHECK: nome, comando, ruoli e PERMISSIVE
#   invariati. Espressioni dal vivo (dbdev, 2026-11-23), lette con search_path
#   vuoto: ogni nome qualificato. Le espressioni di prima tornano col blocco
#   di ritorno del changeSet.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/magazzino/20261123-32-update-policy-magazzino-utente-di-sessione-mctit.yaml

  - changeSet:
      id: 20261123-32-update-policy-magazzino-utente-di-sessione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        magazzino: le policy RLS leggono app.current_user_id da script.fn_utente_di_sessione invece di
        convertirlo da se'. Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "25"
            sql: >
              SELECT (SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                       WHERE n.nspname = 'script' AND p.proname = 'fn_utente_di_sessione')
                   + (SELECT count(*) FROM pg_catalog.pg_policies
                       WHERE (schemaname, tablename, policyname) IN (('magazzino', 'assets', 'rls_assets_ef_whitelist'), ('magazzino', 'eventi_assets', 'rls_eventi_assets_ef_whitelist'), ('magazzino', 'inventari', 'rls_inventari_ef_whitelist'), ('magazzino', 'inventari_righe', 'rls_inventari_righe_ef_whitelist'), ('magazzino', 'lotti', 'rls_lotti_ef_whitelist'), ('magazzino', 'magazzini', 'rls_magazzini_ef_whitelist'), ('magazzino', 'movimenti', 'rls_movimenti_ef_whitelist'), ('magazzino', 'movimenti_attesi', 'rls_movimenti_attesi_ef_whitelist'), ('magazzino', 'note', 'rls_note_ef_whitelist'), ('magazzino', 'note_asset', 'rls_note_asset_ef_whitelist'), ('magazzino', 'note_evento_asset', 'rls_note_evento_asset_ef_whitelist'), ('magazzino', 'note_inventario', 'rls_note_inventario_ef_whitelist'), ('magazzino', 'note_inventario_riga', 'rls_note_inventario_riga_ef_whitelist'), ('magazzino', 'note_movimento', 'rls_note_movimento_ef_whitelist'), ('magazzino', 'note_rettifica', 'rls_note_rettifica_ef_whitelist'), ('magazzino', 'note_rettifica_riga', 'rls_note_rettifica_riga_ef_whitelist'), ('magazzino', 'note_trasferimento', 'rls_note_trasferimento_ef_whitelist'), ('magazzino', 'note_trasferimento_riga', 'rls_note_trasferimento_riga_ef_whitelist'), ('magazzino', 'rettifiche', 'rls_rettifiche_ef_whitelist'), ('magazzino', 'rettifiche_righe', 'rls_rettifiche_righe_ef_whitelist'), ('magazzino', 'trasferimenti', 'rls_trasferimenti_ef_whitelist'), ('magazzino', 'trasferimenti_righe', 'rls_trasferimenti_righe_ef_whitelist'), ('magazzino', 'ubicazioni', 'rls_ubicazioni_ef_whitelist'), ('magazzino', 'valore_giacenza', 'rls_valore_giacenza_ef_whitelist')))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
