databaseChangeLog:
  
  - changeSet:
      id: 20251002-07-create-magazzino-rettifiche-righe
      author: mctit
      logicalFilePath: migrations_v2/00_schema/20251002-07-create-magazzino-rettifiche-righe.yaml

      changes:
        - createTable:
            schemaName: magazzino
            tableName: rettifiche_righe
            remarks: "Righe di rettifica (delta quantità)"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT,
                          constraints: { primaryKey: true, primaryKeyName: pk_mag_rettifiche_righe, nullable: false } }
              - column: { name: rettifica_id, type: BIGINT, constraints: { nullable: false }, remarks: "FK → magazzino.rettifiche(id)" }
              - column: { name: articolo_id, type: UUID, constraints: { nullable: false } }
              - column: { name: qta_delta, type: "NUMERIC(18,6)", constraints: { nullable: false },
                          remarks: "Differenza da applicare: positiva o negativa (≠ 0)" }
              - column: { name: lotto, type: VARCHAR(64) }
              - column: { name: seriale, type: VARCHAR(64) }
              - column: { name: motivo, type: VARCHAR(64), remarks: "Causale/motivo gestionale (testo libero o codificato)" }
              - column: { name: note, type: TEXT }
              - column: { name: meta, type: JSONB, defaultValueComputed: "'{}'::jsonb", constraints: { nullable: false } }
              - column: { name: storicizza, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: tx_id, type: UUID }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER" }

        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: rettifiche_righe
            baseColumnNames: rettifica_id
            referencedTableSchemaName: magazzino
            referencedTableName: rettifiche
            referencedColumnNames: id
            constraintName: fk_mag_rettifiche_righe_testata
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: rettifiche_righe
            baseColumnNames: articolo_id
            referencedTableSchemaName: catalogo
            referencedTableName: articoli
            referencedColumnNames: id
            constraintName: fk_mag_rettifiche_righe_articolo
            onDelete: NO ACTION
            onUpdate: CASCADE


        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE magazzino.rettifiche_righe
                ADD CONSTRAINT chk_mag_rettifiche_qta_non_zero
                CHECK ((qta_delta IS NOT NULL) AND (qta_delta <> 0));

        - createIndex: { schemaName: magazzino, tableName: rettifiche_righe, indexName: ix_mag_rettifiche_r_articolo, columns: [ { name: articolo_id } ] }
        - createIndex: { schemaName: magazzino, tableName: rettifiche_righe, indexName: ix_mag_rettifiche_r_seriale_upper, columns: [ { name: "upper(seriale)" } ] }
        - createIndex: { schemaName: magazzino, tableName: rettifiche_righe, indexName: ix_mag_rettifiche_r_lotto_upper, columns: [ { name: "upper(lotto)" } ] }
