# P-10 (2 di 2) — IL PERIMETRO RLS DI magazzino: VENTITRE' POLICY, UN GIRO SOLO
#   Brief: brief-db-magazzino-lotto-1-terreno-vuoto, sezione 4.10 (M-6;
#   analisi carico e scarico, sezione 7-sexies)
#
# -- PERCHE' TUTTO INSIEME ------------------------------------------------------------
#   dbops.vw_rls_perimetro_scoperto marca NON_DICHIARATO ogni tabella con una
#   FK verso una tabella protetta e senza policy + ENABLE, e il suo pgTAP fa
#   rosso. Armare magazzini e non le figlie farebbe rosso su tutte le figlie;
#   armare a meta' lascerebbe una porta. Il perimetro si chiude quando nasce
#   l'ancora (P-7), e si chiude tutto: un changeSet, ventitre' policy, ENABLE
#   su ciascuna. (Il brief ne contava «venti»: sono 13 tabelle + il padre
#   note + 9 partizioni.)
#
# -- LA FORMA (stampo 20260713-17, rls_resi_ef_whitelist) -------------------------
#   Tutte rls_<tabella>_ef_whitelist, PERMISSIVE, FOR ALL, USING = WITH CHECK
#   = «veste OPERATORE AND scope», poi ENABLE ROW LEVEL SECURITY — SENZA
#   FORCE: nessuna tabella del progetto lo usa e l'app non e' owner (COMMENT
#   di vw_rls_perimetro_scoperto); si cambia per tutti o per nessuno.
#   Lo scope: diretto sulle due ancore (magazzini, assets), via_magazzino sul
#   resto, via_asset per gli eventi, via la testata per le righe e le note,
#   lo smistatore per il padre note (20260915-15). Nessuna veste
#   CLIENTE_PORTALE / SHOP: il magazzino e' interno.
#
# -- CHE COSA RESTA FUORI, PER COSTRUZIONE --------------------------------------------
#   causali, lotti, tipi_ubicazione, config.assets_ownership: vocabolari e
#   definizioni, uguali per tutti (7-sexies, 1). Nessuna di loro ha una FK
#   verso una tabella protetta: il presidio non le chiede.
#
# -- CHE COSA SCATTA DA QUI IN POI ----------------------------------------------------
#   · i guard trgfn_guard_emittente_scope su magazzini e assets (P-7) passano
#     da «RLS non attiva -> passa» a «chi scrive deve avere scope»;
#   · trgfn_trasferimenti_guard_stesso_emittente (P-9) legge magazzini sotto
#     RLS: un magazzino fuori perimetro non risolve -> rifiuto;
#   · le shadow di storico delle madri armate vengono armate da
#     fn_storico_arma_scope_tutte (90_end, runAlways) leggendo la mappa
#     (storico_scope_policy: EF / PADRE, aggiornata in P-4 → P-8);
#   · dbops.vw_rls_perimetro_scoperto per magazzino deve dare zero righe, e la
#     riga 65 del registro e' uscita (20260915-10);
#   · un pgTAP che scrive su queste tabelle deve dichiarare il contesto
#     operatore: gira come l'applicazione (P-12).
#
# -- ORDINE NELLA TIMELINE ---------------------------------------------------------------
#   Le funzioni di scope (20_code, 20260915-15) precedono per numero; le
#   colonne (00_schema, -05 → -11) anche. Su un DB da zero tutto esiste quando
#   gira questo changeSet.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/magazzino/20260915-16-create-policy-rls-magazzino-perimetro-mctit.yaml

  - changeSet:
      id: 20260915-16-create-policy-rls-magazzino-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il perimetro RLS di magazzino (M-6) in un giro: ventitre' policy
        rls_<tabella>_ef_whitelist (PERMISSIVE, FOR ALL, veste OPERATORE + scope) e
        ENABLE ROW LEVEL SECURITY senza FORCE su magazzini, assets, ubicazioni, movimenti, movimenti_attesi, valore_giacenza, inventari, rettifiche, trasferimenti, eventi_assets, inventari_righe, rettifiche_righe, trasferimenti_righe, note, note_asset, note_evento_asset, note_inventario, note_inventario_riga, note_movimento, note_rettifica, note_rettifica_riga, note_trasferimento, note_trasferimento_riga.
        Diretta su magazzini e assets, via_magazzino sul resto, via_asset per gli
        eventi, via la testata per righe e note, smistatore per il padre note. Brief:
        brief-db-magazzino-lotto-1-terreno-vuoto, sezione 4.10 (P-10).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: magazzino
                tableName: magazzini
                columnName: emittente_fiscale_id
            - columnExists:
                schemaName: magazzino
                tableName: assets
                columnName: emittente_fiscale_id
            - tableExists:
                schemaName: magazzino
                tableName: movimenti_attesi
            - tableExists:
                schemaName: magazzino
                tableName: valore_giacenza
            - sqlCheck:
                expectedResult: "8"
                sql: |
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname IN ('fn_scope_ef_whitelist_via_magazzino', 'fn_scope_ef_whitelist_via_asset',
                                       'fn_scope_ef_whitelist_via_movimento', 'fn_scope_ef_whitelist_via_inventario',
                                       'fn_scope_ef_whitelist_via_rettifica', 'fn_scope_ef_whitelist_via_trasferimento',
                                       'fn_scope_ef_whitelist_via_evento_asset', 'fn_scope_note_magazzino_ef_whitelist');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ---------- magazzino.magazzini: diretta sull'ancora emittente_fiscale_id ----------
              DROP POLICY IF EXISTS rls_magazzini_ef_whitelist ON magazzino.magazzini;
              CREATE POLICY rls_magazzini_ef_whitelist ON magazzino.magazzini
                  AS PERMISSIVE
                  FOR ALL
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(NULLIF(current_setting('app.current_user_id', true), '')::integer, emittente_fiscale_id)
                  )
                  WITH CHECK (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(NULLIF(current_setting('app.current_user_id', true), '')::integer, emittente_fiscale_id)
                  );
              COMMENT ON POLICY rls_magazzini_ef_whitelist ON magazzino.magazzini IS
                  'Perimetro emittente (M-6), veste OPERATORE, fail-closed: diretta sull''ancora emittente_fiscale_id. '
                  'Brief: brief-db-magazzino-lotto-1-terreno-vuoto, sezione 4.10 (P-10).';
              ALTER TABLE magazzino.magazzini ENABLE ROW LEVEL SECURITY;

              -- ---------- magazzino.assets: diretta: l'asset porta l'emittente in proprio (chiude il debito RLS riga 65) ----------
