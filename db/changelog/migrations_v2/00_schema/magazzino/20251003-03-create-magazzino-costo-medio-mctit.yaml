databaseChangeLog:

  - changeSet:
      id: 20251003-03-create-magazzino-costo-medio
      author: mctit
      logicalFilePath: migrations_v2/00_schema/20251003-03-create-magazzino-costo-medio.yaml
      changes:
        - createTable:
            schemaName: magazzino
            tableName: costo_medio
            remarks: "Stato corrente CMP per Articolo × Magazzino"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT,
                          constraints: { primaryKey: true, primaryKeyName: pk_mag_costo_medio, nullable: false } }
              - column: { name: articolo_id, type: UUID, constraints: { nullable: false }, remarks: "catalogo.articoli(id)" }
              - column: { name: magazzino_id, type: BIGINT, constraints: { nullable: false }, remarks: "magazzino.magazzini(id)" }
              - column: { name: qta, type: "NUMERIC(18,6)", defaultValueNumeric: 0, constraints: { nullable: false }, remarks: "Giacenza corrente" }
              - column: { name: valore, type: "NUMERIC(18,6)", defaultValueNumeric: 0, constraints: { nullable: false }, remarks: "Valore totale corrente (in valuta base)" }
              - column: { name: note, type: TEXT }

              # meta/audit
              - column: { name: meta, type: JSONB, defaultValueComputed: "'{}'::jsonb", constraints: { nullable: false } }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER" }

        - addUniqueConstraint:
            schemaName: magazzino
            tableName: costo_medio
            columnNames: articolo_id, magazzino_id
            constraintName: uq_mag_costo_medio_art_mag
        
        - createIndex: { schemaName: magazzino, tableName: costo_medio, indexName: ix_mag_cmedio_articolo, columns: [ { name: articolo_id } ] }
        - createIndex: { schemaName: magazzino, tableName: costo_medio, indexName: ix_mag_cmedio_magazzino, columns: [ { name: magazzino_id } ] }

        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: costo_medio
            baseColumnNames: magazzino_id
            referencedTableSchemaName: magazzino
            referencedTableName: magazzini
            referencedColumnNames: id
            constraintName: fk_mag_costo_medio_magazzino
            onDelete: NO ACTION
            onUpdate: RESTRICT