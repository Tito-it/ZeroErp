databaseChangeLog:

  - changeSet:
      id: 20251003-04-create-magazzino-note
      author: mctit
      logicalFilePath: migrations_v2/00_schema/20251003-04-create-magazzino-note.yaml
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
                      -- ============================================================
                      -- Schema: magazzino
                      -- Tabella padre: magazzino.note (partizionata per LIST target_tipo)
                      -- Target coperti: ASSET, EVENTO_ASSET, INVENTARIO, INVENTARIO_RIGA,
                      --                 MOVIMENTO, RETTIFICA, RETTIFICA_RIGA,
                      --                 TRASFERIMENTO, TRASFERIMENTO_RIGA, COSTO_MEDIO
                      -- ============================================================

                      -- Padre ------------------------------------------------------
                      CREATE TABLE IF NOT EXISTS magazzino.note
                      (
                            id              bigint GENERATED BY DEFAULT AS IDENTITY,
                            target_tipo     varchar(32)  NOT NULL,
                            target_id       bigint       NOT NULL,
                            target_riga_id  bigint,
                            anchor_tipo     varchar(12)  NOT NULL,  -- DOCUMENTO | RIGA
                            posizione       varchar(12)  NOT NULL,  -- HEADER|FOOTER|SEZIONE|BEFORE|AFTER
                            seq             integer      NOT NULL DEFAULT 10,
                            testo           text,
                            testo_md        text,
                            stile           varchar(16)  NOT NULL DEFAULT 'NORMALE',
                            lingua          char(5),
                            visibile        boolean      NOT NULL DEFAULT true,
                            solo_stampa     boolean      NOT NULL DEFAULT false,
                            meta            jsonb        NOT NULL DEFAULT '{}'::jsonb,
                            data_insert     timestamptz  NOT NULL DEFAULT now(),
                            user_insert     varchar(80)  NOT NULL DEFAULT CURRENT_USER,
                            data_update     timestamptz  NOT NULL DEFAULT now(),
                            user_update     varchar(80)           DEFAULT CURRENT_USER,

                            -- PK deve includere la colonna di partizionamento
                            CONSTRAINT pk_magazzino_note PRIMARY KEY (target_tipo, id),

                            CONSTRAINT chk_note_anchor_tipo
                              CHECK (anchor_tipo IN ('DOCUMENTO','RIGA')),
                            CONSTRAINT chk_note_posizione
                              CHECK (posizione IN ('HEADER','FOOTER','SEZIONE','BEFORE','AFTER')),
                            CONSTRAINT chk_note_seq_pos
                              CHECK (seq >= 0),

                            CONSTRAINT chk_note_target_tipo
                              CHECK (target_tipo IN (
                                'ASSET','EVENTO_ASSET','INVENTARIO','INVENTARIO_RIGA','MOVIMENTO',
                                'RETTIFICA','RETTIFICA_RIGA','TRASFERIMENTO','TRASFERIMENTO_RIGA','COSTO_MEDIO'
                              ))
                      ) PARTITION BY LIST (target_tipo);

                     

                      COMMENT ON TABLE magazzino.note
                        IS 'Note testuali ancorabili a documenti/righe di magazzino; tabella padre partizionata per target_tipo.';

                      COMMENT ON CONSTRAINT chk_note_target_tipo ON magazzino.note
                        IS 'ASSET | EVENTO_ASSET | INVENTARIO | INVENTARIO_RIGA | MOVIMENTO | RETTIFICA | RETTIFICA_RIGA | TRASFERIMENTO | TRASFERIMENTO_RIGA | COSTO_MEDIO';

                      -- Indice trasversale utile per query multi-target (facoltativo ma allineato a vendite)
                      CREATE INDEX IF NOT EXISTS ix_mag_note_render_order
                          ON magazzino.note
                          (target_tipo, target_id, anchor_tipo, posizione, seq)
                          WITH (fillfactor=100, deduplicate_items=TRUE);
  - changeSet:
      id: 20251003-05-create-magazzino-note
      author: mctit
      changes:

        # 2) Partizioni: ASSET
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
                      -- ============================================================
                      -- Partizioni (una per ogni target_tipo)
                      -- Regole:
                      --  - DOCUMENTO: target_riga_id IS NULL, posizione IN (HEADER, SEZIONE, FOOTER)
                      --  - RIGA:      target_riga_id IS NOT NULL, posizione IN (BEFORE, AFTER)
                      -- ============================================================
          
                      -- 1) ASSET (solo testata)
                      CREATE TABLE IF NOT EXISTS magazzino.note_asset
                          PARTITION OF magazzino.note
                      (
                          CONSTRAINT fk_note_asset_testata
                            FOREIGN KEY (target_id) REFERENCES magazzino.assets(id)
                              ON UPDATE CASCADE ON DELETE CASCADE,
                          CONSTRAINT chk_note_asset_anchor
                            CHECK (anchor_tipo='DOCUMENTO' AND target_riga_id IS NULL
                                  AND posizione IN ('HEADER','SEZIONE','FOOTER'))
                      )
                       FOR VALUES IN ('ASSET')
                       TABLESPACE pg_default;
                      CREATE INDEX IF NOT EXISTS ix_note_asset_render
                        ON magazzino.note_asset (target_id, anchor_tipo, posizione, seq)
                        WITH (fillfactor=100, deduplicate_items=TRUE);
  - changeSet:
      id: 20251003-06-create-magazzino-note
