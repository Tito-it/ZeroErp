databaseChangeLog:

  - changeSet:
      id: 20251005-24-eventi_assets-add-sorgenti
      author: mctit
      logicalFilePath: migrations_v2/00_schema/magazzino/20251005-24-eventi_assets-add-sorgenti-mctit.yaml
      changes:
        - addColumn:
            schemaName: magazzino
            tableName: eventi_assets
            columns:
              - column: { name: sorgente_tipo_id, type: BIGINT, remarks: "FK → config.sorgenti(id)" }
              - column: { name: sorgente_uid, type: UUID, remarks: "Identificatore esterno documento" }

        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: eventi_assets
            baseColumnNames: sorgente_tipo_id
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            constraintName: fk_mag_eventi_assets_sorgente_tipo
            onDelete: NO ACTION
            onUpdate: CASCADE

        

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
                   CREATE UNIQUE INDEX IF NOT EXISTS uq_mag_eventi_assets_sorgente_fk
                        ON magazzino.eventi_assets (sorgente_tipo_id, sorgente_uid)
                        WHERE sorgente_tipo_id IS NOT NULL;