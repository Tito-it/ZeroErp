databaseChangeLog:
  - changeSet:
      id: 20251003-02-create-magazzino-inventari-righe
      author: mctit
      logicalFilePath: migrations_v2/00_schema/20251003-02-create-magazzino-inventari-righe.yaml
      changes:
        - createTable:
            schemaName: magazzino
            tableName: inventari_righe
            remarks: "Conteggi fisici di inventario"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT,
                          constraints: { primaryKey: true, primaryKeyName: pk_mag_invetario_righe, nullable: false } }
              - column: { name: inventario_id, type: BIGINT, constraints: { nullable: false }, remarks: "FK → magazzino.inventari(id)" }
              - column: { name: articolo_id, type: UUID, constraints: { nullable: false } }
              - column: { name: lotto, type: VARCHAR(64) }
              - column: { name: seriale, type: VARCHAR(64) }
              - column: { name: qta_contata, type: "NUMERIC(18,6)", constraints: { nullable: false }, remarks: ">= 0" }
              - column: { name: qta_sistema, type: "NUMERIC(18,6)", remarks: "snapshot giacenza al momento del confronto (opzionale)" }
              - column: { name: note, type: TEXT }
              - column: { name: meta, type: JSONB, defaultValueComputed: "'{}'::jsonb", constraints: { nullable: false } }
              - column: { name: storicizza, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: tx_id, type: UUID }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER" }

        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: inventari_righe
            baseColumnNames: inventario_id
            referencedTableSchemaName: magazzino
            referencedTableName: inventari
            referencedColumnNames: id
            constraintName: fk_mag_inventario_righe_testata
            onDelete: CASCADE
            onUpdate: CASCADE

        
        - createIndex: { schemaName: magazzino, tableName: inventari_righe, indexName: ix_mag_invetario_r_articolo, columns: [ { name: articolo_id } ] }
        - createIndex: { schemaName: magazzino, tableName: inventari_righe, indexName: ix_mag_invetario_r_seriale_upper, columns: [ { name: "upper(seriale)" } ] }
        - createIndex: { schemaName: magazzino, tableName: inventari_righe, indexName: ix_mag_invetario_r_lotto_upper, columns: [ { name: "upper(lotto)" } ] }

        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: inventari_righe
            baseColumnNames: articolo_id
            referencedTableSchemaName: catalogo
            referencedTableName: articoli
            referencedColumnNames: id
            constraintName: fk_mag_inventario_righe_articolo
            onDelete: NO ACTION
            onUpdate: CASCADE

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE magazzino.inventari_righe
                ADD CONSTRAINT chk_mag_inventario_righe_qta_contata_non_neg
                CHECK ((qta_contata IS NOT NULL) AND (qta_contata >= 0));