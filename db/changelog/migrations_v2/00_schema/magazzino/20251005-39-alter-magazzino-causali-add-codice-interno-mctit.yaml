databaseChangeLog:

  # 20251005-39 — magazzino.causali: add codice_interno (+UNIQUE +CHECK)
  - changeSet:
      id: 20251005-39-alter-magazzino-causali-add-codice-interno
      author: mctit
      logicalFilePath: migrations_v2/00_schema/magazzino/20251005-39-alter-magazzino-causali-add-codice-interno.yaml
      changes:
        - addColumn:
            schemaName: magazzino
            tableName: causali
            columns:
              - column:
                  name: codice_interno
                  type: VARCHAR(32)
                  remarks: "Codice interno immutabile"
                  constraints:
                    nullable: True

        - addUniqueConstraint:
            schemaName: magazzino
            tableName: causali
            columnNames: codice_interno
            constraintName: uq_mag_causali_codice_interno

        
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              COMMENT ON COLUMN magazzino.causali.codice_interno IS 'Codice interno immutabile per logiche applicative/stabili.';

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
            
              UPDATE magazzino.causali
                SET codice_interno = upper(btrim(codice))
                WHERE codice_interno IS NULL
                  OR btrim(codice_interno) = '';


        - sql:
            splitStatements: false
            stripComments: true
            sql: |
                  
                  ALTER TABLE magazzino.causali
                    ADD CONSTRAINT chk_mag_causali_codice_interno_nonvuoto
                    CHECK (btrim(codice_interno) <> '');  
