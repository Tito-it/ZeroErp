databaseChangeLog:
  

  # Drop UNIQUE/indici vecchi (se presenti)
  - changeSet:
      id: 20251005-11-movimenti-drop-old-sorgente-constraints
      author: mctit
      logicalFilePath: migrations_v2/00_schema/vendite/20251005-11-movimenti-doc-refactor.yaml
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not :
          - columnExists:
              schemaName: magazzino
              tableName: movimenti
              columnName: doc_schema

      changes:
        - dropUniqueConstraint:
            schemaName: magazzino
            tableName: movimenti
            constraintName: uq_mag_movimenti_sorgente

        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE c.relkind = 'i'
                    AND c.relname = 'ix_mag_mov_sorgente'
                    AND n.nspname = 'magazzino'
                ) THEN
                  EXECUTE 'DROP INDEX magazzino.ix_mag_mov_sorgente';
                END IF;
              END $$;

  # Rinomina colonne sorgente_* -> doc_*
  - changeSet:
      id: 20251005-12-movimenti-rename-sorgente-to-doc
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not :      
          - columnExists:
              schemaName: magazzino
              tableName: movimenti
              columnName: doc_schema

      changes:
        - renameColumn:
            schemaName: magazzino
            tableName: movimenti
            oldColumnName: sorgente_schema
            newColumnName: doc_schema
            columnDataType: VARCHAR(64)
        - renameColumn:
            schemaName: magazzino
            tableName: movimenti
            oldColumnName: sorgente_tabella
            newColumnName: doc_table
            columnDataType: VARCHAR(64)
        - renameColumn:
            schemaName: magazzino
            tableName: movimenti
            oldColumnName: sorgente_id
            newColumnName: doc_id
            columnDataType: BIGINT
        - renameColumn:
            schemaName: magazzino
            tableName: movimenti
            oldColumnName: sorgente_riga_id
            newColumnName: doc_riga_id
            columnDataType: BIGINT

  # NOT NULL (se vuoi tenerli opzionali, rimuovi questo changeSet)
  - changeSet:
      id: 20251005-13-movimenti-doc-not-null
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          - columnExists:
              schemaName: magazzino
              tableName: movimenti
              columnName: doc_schema
  
      changes:
        - addNotNullConstraint: { schemaName: magazzino, tableName: movimenti, columnName: doc_schema,  columnDataType: VARCHAR(64) }
        - addNotNullConstraint: { schemaName: magazzino, tableName: movimenti, columnName: doc_table,   columnDataType: VARCHAR(64) }
        - addNotNullConstraint: { schemaName: magazzino, tableName: movimenti, columnName: doc_id,      columnDataType: BIGINT }

  # Nuovi indici/unique su doc_*
  - changeSet:
      id: 20251005-14-movimenti-add-doc-indexes-unique
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not :
          - columnExists:
              schemaName: magazzino
              tableName: movimenti
              columnName: doc_schema
  
      changes:
        - createIndex:
            schemaName: magazzino
            tableName: movimenti
            indexName: ix_mag_mov_docref
            columns:
              - column: { name: doc_schema }
              - column: { name: doc_table }
              - column: { name: doc_id }
              - column: { name: doc_riga_id }
        - addUniqueConstraint:
            schemaName: magazzino
            tableName: movimenti
            columnNames: doc_schema, doc_table, doc_id, doc_riga_id
            constraintName: uq_mag_movimenti_docref
