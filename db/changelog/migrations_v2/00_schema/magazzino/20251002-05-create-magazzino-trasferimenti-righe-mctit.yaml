databaseChangeLog:

  - changeSet:
      id: 20251002-05-create-magazzino-trasferimenti-righe
      author: mctit
      logicalFilePath: migrations_v2/00_schema/20251002-05-create-magazzino-trasferimenti-righe.yaml
     
      changes:
        - createTable:
            schemaName: magazzino
            tableName: trasferimenti_righe
            remarks: "Righe del trasferimento"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT,
                          constraints: { primaryKey: true, primaryKeyName: pk_mag_trasferimenti_righe, nullable: false } }
              - column: { name: trasferimento_id, type: BIGINT, constraints: { nullable: false }, remarks: "FK → magazzino.trasferimenti(id)" }
              - column: { name: articolo_id, type: UUID, constraints: { nullable: false }, remarks: "FK → catalogo.articoli(id)" }
              - column: { name: qta, type: "NUMERIC(18,6)", constraints: { nullable: false }, remarks: "Quantità da trasferire (>0)" }
              - column: { name: lotto, type: VARCHAR(64) }
              - column: { name: seriale, type: VARCHAR(64) }
              - column: { name: note, type: TEXT }
              - column: { name: meta, type: JSONB, defaultValueComputed: "'{}'::jsonb", constraints: { nullable: false } }
              - column: { name: storicizza, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: tx_id, type: UUID }
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER" }

        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: trasferimenti_righe
            baseColumnNames: trasferimento_id
            referencedTableSchemaName: magazzino
            referencedTableName: trasferimenti
            referencedColumnNames: id
            constraintName: fk_mag_trasferimenti_righe_testata
            onDelete: CASCADE
            onUpdate: CASCADE
        
        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: trasferimenti_righe
            baseColumnNames: articolo_id
            referencedTableSchemaName: catalogo
            referencedTableName: articoli
            referencedColumnNames: id
            constraintName: fk_mag_trasferimenti_righe_articolo
            onDelete: NO ACTION
            onUpdate: CASCADE

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE magazzino.trasferimenti_righe
                ADD CONSTRAINT chk_mag_trasferimenti_qta_pos
                CHECK ((qta IS NOT NULL) AND (qta > 0));

        - createIndex: { schemaName: magazzino, tableName: trasferimenti_righe, indexName: ix_mag_trasferimenti_r_articolo, columns: [ { name: articolo_id } ] }
        - createIndex: { schemaName: magazzino, tableName: trasferimenti_righe, indexName: ix_mag_trasferimenti_r_seriale_upper, columns: [ { name: "upper(seriale)" } ] }
        - createIndex: { schemaName: magazzino, tableName: trasferimenti_righe, indexName: ix_mag_trasferimenti_r_lotto_upper, columns: [ { name: "upper(lotto)" } ] }
