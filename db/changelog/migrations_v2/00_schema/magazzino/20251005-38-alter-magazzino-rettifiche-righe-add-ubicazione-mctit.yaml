databaseChangeLog:

  # 20251005-38 — magazzino.rettifiche_righe: aggiungi ubicazione_id (+FK+indice)
  - changeSet:
      id: 20251005-38-alter-magazzino-rettifiche-righe-add-ubicazione
      author: mctit
      logicalFilePath: migrations_v2/10_schema/20251005-38-alter-magazzino-rettifiche-righe-add-ubicazione.yaml
      changes:
        - addColumn:
            schemaName: magazzino
            tableName: rettifiche_righe
            columns:
              - column:
                  name: ubicazione_id
                  type: BIGINT
                  remarks: "FK → magazzino.ubicazioni(id), opzionale"
        - addForeignKeyConstraint:
            baseTableSchemaName: magazzino
            baseTableName: rettifiche_righe
            baseColumnNames: ubicazione_id
            referencedTableSchemaName: magazzino
            referencedTableName: ubicazioni
            referencedColumnNames: id
            constraintName: fk_mag_rettifiche_righe_ubicazione
            onDelete: NO ACTION
            onUpdate: CASCADE
        - createIndex:
            schemaName: magazzino
            tableName: rettifiche_righe
            indexName: ix_mag_rettifiche_righe_ubicazione
            columns:
              - column: { name: ubicazione_id }