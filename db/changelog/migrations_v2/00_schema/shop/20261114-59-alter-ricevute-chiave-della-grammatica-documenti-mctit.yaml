# LA RICEVUTA DELLO SHOP PRENDE LA CHIAVE DEGLI ALTRI DOCUMENTI
#   shop.ricevute: id bigint identity + uid uuid, come vendite.resi
#   Brief: brief-db-cambio-natura-soggetto-conferma-e-pulizia §0, D-9 e D-10
#   (Tid, 2026-11-14), giro 1.
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   La ricevuta e' un documento fiscale, e la regola del cambio di natura del
#   soggetto (D-6) legge i documenti dal catalogo config.sorgenti. Per entrarci
#   la ricevuta deve avere la grammatica dei documenti: tutte le testate del
#   catalogo hanno `id bigint`, e `key_selector` ammette solo 'id' o 'uid'
#   (chk_sorgenti_key_selector_values, letto da script.fn_sorgente_chiave).
#   shop.ricevute aveva solo `id uuid`.
#
# ── LA FORMA ────────────────────────────────────────────────────
#   * `id` (uuid, default uuidv7()) si rinomina `uid`: il valore di ogni
#     ricevuta resta quello, sotto il nome che la grammatica gli da'.
#   * Nasce `id bigint GENERATED BY DEFAULT AS IDENTITY`, la stessa forma di
#     vendite.resi; le righe esistenti lo ricevono dall'ADD COLUMN.
#   * La PK pk_shop_ricevute passa da uid a id, e uid prende il suo UNIQUE
#     (uq_shop_ricevute_uid, come uq_resi_uid).
#   La registrazione nel catalogo (config.sorgenti, config.tipi_entita) sta nei
#   due CSV di 80_data, nello stesso giro; il trigger del lato «in uscita» lo
#   monta dbops.fn_sorgente_converge_uscita in 90_end, dal catalogo: qui non si
#   scrive (linee-guida-trigger, «I trigger generati»).
#
# ── LO STORICO ──────────────────────────────────────────────────
#   La shadow storico.ricevute la crea dbops.fn_ensure_storico_table (ci_apply),
#   con ricevute_id DEL TIPO DELLA PK della madre, e se c'e' gia' non la
#   tocca. Da zero nasce dopo questo changeSet, quindi gia' bigint, e il blocco
#   qui sotto non fa niente. Dove c'e' gia' ed e' uuid, il trigger di storico al
#   primo UPDATE o DELETE di una ricevuta scriverebbe un bigint in una colonna
#   uuid: la colonna si porta a bigint qui, nella stessa transazione.
#   * La traduzione passa da shop.ricevute.uid, che conserva il vecchio id.
#   * ⛔ Non con un UPDATE: farebbe scattare il trigger di tx_id della shadow e
#     riscriverebbe la storia. ALTER COLUMN ... TYPE ... USING non fa scattare
#     trigger di riga, ricostruisce l'indice ix_ricevute_ricevute_id_fk e tiene
#     il NOT NULL. USING non ammette sottoquery: la traduzione e' una funzione
#     in pg_temp, tolta subito dopo.
#   * Una riga di storico la cui ricevuta non esiste piu' (cancellata) non ha un
#     id nuovo: il blocco si ferma con un errore che lo dice, invece di
#     inventarne uno. Lo snapshot jsonb conserva comunque la riga intera.
#   * Nessuna preCondition (linee-guida-sql §11.13): il blocco e' idempotente,
#     agisce solo se la shadow c'e' e ricevute_id e' ancora uuid.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────
#   Nessuna FK punta a shop.ricevute (pg_constraint, dbdev 2026-11-14). La
#   policy rls_shop_ricevute_self_ownership legge solo soggetto_ruolo_id.
#   trgfn_ricevute_guard_ba_canale legge NEW.id solo per il contesto
#   dell'errore: dopo il cambio e' il bigint. Nessuna funzione, vista o codice
#   BE/FE scrive o legge la ricevuta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/shop/20261114-59-alter-ricevute-chiave-della-grammatica-documenti-mctit.yaml

  - changeSet:
      id: 20261114-59-alter-ricevute-chiave-della-grammatica-documenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        shop.ricevute nella grammatica dei documenti: id uuid rinominata uid (UNIQUE),
        nuova id bigint identity come PK; storico.ricevute.ricevute_id portata a bigint
        dove la shadow esiste gia'.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE shop.ricevute RENAME COLUMN id TO uid;

              ALTER TABLE shop.ricevute DROP CONSTRAINT pk_shop_ricevute;

              ALTER TABLE shop.ricevute
                  ADD COLUMN id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL;

              ALTER TABLE shop.ricevute
                  ADD CONSTRAINT pk_shop_ricevute PRIMARY KEY (id),
                  ADD CONSTRAINT uq_shop_ricevute_uid UNIQUE (uid);

              COMMENT ON COLUMN shop.ricevute.id
                  IS 'Chiave della ricevuta (bigint identity): la chiave della grammatica dei documenti, come le altre testate di config.sorgenti.';
              COMMENT ON COLUMN shop.ricevute.uid
                  IS 'Identificativo stabile della ricevuta (uuidv7), UNIQUE: l''altra chiave della grammatica dei documenti.';

              DO $do$
              BEGIN
                  -- Solo dove la shadow esiste gia' con la chiave vecchia: vedi intestazione.
                  IF NOT EXISTS (
                      SELECT 1
                        FROM pg_attribute a
                       WHERE a.attrelid = to_regclass('storico.ricevute')
                         AND a.attname = 'ricevute_id'
                         AND a.atttypid = 'uuid'::regtype
                         AND NOT a.attisdropped) THEN
                      RETURN;
                  END IF;

                  IF EXISTS (
                      SELECT 1
                        FROM storico.ricevute s
                       WHERE NOT EXISTS (SELECT 1 FROM shop.ricevute r
                                          WHERE r.uid = s.ricevute_id)) THEN
                      RAISE EXCEPTION 'storico.ricevute ha righe di ricevute che non esistono piu'': ricevute_id non si traduce in bigint senza inventare un valore. Da decidere prima di applicare.';
                  END IF;

                  CREATE FUNCTION pg_temp.fn_ricevuta_id_da_uid(p_uid uuid)
                  RETURNS bigint
                  LANGUAGE sql
                  STABLE
                  AS 'SELECT r.id FROM shop.ricevute r WHERE r.uid = p_uid';

                  ALTER TABLE storico.ricevute
                      ALTER COLUMN ricevute_id TYPE bigint
                      USING pg_temp.fn_ricevuta_id_da_uid(ricevute_id);

                  DROP FUNCTION pg_temp.fn_ricevuta_id_da_uid(uuid);
              END
              $do$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- L'inverso: lo storico torna a uuid passando da uid, poi la chiave della madre.
              DO $do$
              BEGIN
                  IF EXISTS (
                      SELECT 1
                        FROM pg_attribute a
                       WHERE a.attrelid = to_regclass('storico.ricevute')
                         AND a.attname = 'ricevute_id'
                         AND a.atttypid = 'bigint'::regtype
                         AND NOT a.attisdropped) THEN
                      CREATE FUNCTION pg_temp.fn_ricevuta_uid_da_id(p_id bigint)
                      RETURNS uuid
                      LANGUAGE sql
                      STABLE
                      AS 'SELECT r.uid FROM shop.ricevute r WHERE r.id = p_id';

                      ALTER TABLE storico.ricevute
                          ALTER COLUMN ricevute_id TYPE uuid
                          USING pg_temp.fn_ricevuta_uid_da_id(ricevute_id);

                      DROP FUNCTION pg_temp.fn_ricevuta_uid_da_id(bigint);
                  END IF;
              END
              $do$;

              ALTER TABLE shop.ricevute
                  DROP CONSTRAINT uq_shop_ricevute_uid,
                  DROP CONSTRAINT pk_shop_ricevute;
              ALTER TABLE shop.ricevute DROP COLUMN id;
              ALTER TABLE shop.ricevute RENAME COLUMN uid TO id;
              ALTER TABLE shop.ricevute ADD CONSTRAINT pk_shop_ricevute PRIMARY KEY (id);
              COMMENT ON COLUMN shop.ricevute.id IS NULL;
