# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Aggiunge a vendite.contratti i campi di pricing per modalita' A/B/C:
#   - listino_id                   (NULL = modalita' C: tutto negoziato sulle righe)
#   - tipo_variazione_globale      (PERCENTUALE | VALORE_FISSO)
#   - valore_variazione_globale    numeric(10,4)
#
# Pricing v5 - riferimento sviluppo-listini-v5.md
# sezione 5.1 / 5.3.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260414-08-alter-contratti-add-listino-variazione-mctit.yaml

  - changeSet:
      id: 20260414-08-alter-contratti-add-listino-variazione
      author: mctit
      comment: >
        Estende vendite.contratti con listino_id + variazione globale.
        CHECK di coerenza sulle modalita' A/B/C.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              schemaName: vendite
              tableName: contratti
              columnName: listino_id

      changes:
        - addColumn:
            schemaName: vendite
            tableName: contratti
            columns:
              - column:
                  name: listino_id
                  type: bigint
                  remarks: "FK -> vendite.listini.id. NULL = modalita' C (contratto interamente negoziato sulle righe)."
                  constraints:
                    nullable: true

              - column:
                  name: tipo_variazione_globale
                  type: varchar(16)
                  remarks: "Tipo variazione globale sul listino: PERCENTUALE | VALORE_FISSO. NULL = nessuna variazione."
                  constraints:
                    nullable: true

              - column:
                  name: valore_variazione_globale
                  type: numeric(10,4)
                  remarks: "Valore della variazione globale coerente con tipo_variazione_globale."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: contratti
            baseColumnNames: listino_id
            constraintName: fk_contratti_listino
            referencedTableSchemaName: vendite
            referencedTableName: listini
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Ammessi solo due valori per tipo_variazione_globale (NULL compreso).
              ALTER TABLE vendite.contratti
                  ADD CONSTRAINT chk_contratti_tipo_variazione_globale
                  CHECK (tipo_variazione_globale IS NULL
                         OR tipo_variazione_globale IN ('PERCENTUALE', 'VALORE_FISSO'));

              -- tipo_variazione_globale e valore_variazione_globale vanno a coppia.
              ALTER TABLE vendite.contratti
                  ADD CONSTRAINT chk_contratti_variazione_globale_coerente
                  CHECK (
                      (tipo_variazione_globale IS NULL AND valore_variazione_globale IS NULL)
                      OR
                      (tipo_variazione_globale IS NOT NULL AND valore_variazione_globale IS NOT NULL)
                  );

              -- Se listino_id e' NULL (modalita' C), non ha senso una variazione
              -- globale: la variazione vive nelle righe con prezzo_unitario.
              ALTER TABLE vendite.contratti
                  ADD CONSTRAINT chk_contratti_modalita_pricing
                  CHECK (
                      (listino_id IS NOT NULL)
                      OR
                      (listino_id IS NULL
                       AND tipo_variazione_globale IS NULL
                       AND valore_variazione_globale IS NULL)
                  );

      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.contratti
                  DROP CONSTRAINT IF EXISTS chk_contratti_modalita_pricing;
              ALTER TABLE vendite.contratti
                  DROP CONSTRAINT IF EXISTS chk_contratti_variazione_globale_coerente;
              ALTER TABLE vendite.contratti
                  DROP CONSTRAINT IF EXISTS chk_contratti_tipo_variazione_globale;
              ALTER TABLE vendite.contratti
                  DROP CONSTRAINT IF EXISTS fk_contratti_listino;
        - dropColumn:
            schemaName: vendite
            tableName: contratti
            columnNames:
              - column:
                  name: valore_variazione_globale
              - column:
                  name: tipo_variazione_globale
              - column:
                  name: listino_id
