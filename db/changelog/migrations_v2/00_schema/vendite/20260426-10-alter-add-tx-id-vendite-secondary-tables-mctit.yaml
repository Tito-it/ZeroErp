# Aggiunta colonna tx_id (uuid) sulle 12 tabelle "alta priorita'"
# del dominio vendite che ne erano sprovviste:
#   - Righe documenti     (3): contratti_righe, contratti_utilities,
#                              preventivi_righe
#   - Indirizzi documenti (4): fatture_indirizzi, ordini_indirizzi,
#                              ddt_indirizzi, preventivi_indirizzi
#   - Note documenti      (5): note_contratto, note_preventivo,
#                              note_ddt, note_fatture, note_ordini
#
# Why: completare la presenza di tx_id sulle tabelle del "contorno"
# delle testate (contratti/preventivi/fatture/ordini/ddt) per
# coerenza con il pattern di correlazione audit gia' usato nel
# resto del progetto. Il framework dbops.fn_run_automations registra
# automaticamente il trigger trgfn_tx_id_managed al primo run dopo
# l'ALTER.
#
# Tabelle escluse (vedi WIP automazione-chiusure-scadenze.md §8):
#   - pipeline/log: gia' hanno id propri di tracking (event_id, ecc.)
#   - cataloghi/configurazione: modifiche rare via Liquibase seed
#   - note (generico), note_attivita_fatturabili: da valutare caso per caso
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260426-10-alter-add-tx-id-vendite-secondary-tables-mctit.yaml

