  # -----------------------------------------------------------
  # Note documenti (1 ALTER sulla tabella padre partizionata)
  #
  # vendite.note e' tabella padre PARTITIONED BY (...) con 5 partizioni
  # FOR VALUES IN: note_contratto, note_preventivo, note_ddt,
  # note_fatture, note_ordini (vedi 20251026-11 e simili).
  # PostgreSQL NON permette ALTER ADD COLUMN sulle partizioni figlie:
  # "non e' possibile aggiungere una colonna ad una partizione".
  # Solo ALTER sulla padre e' ammesso, e la colonna viene propagata
  # automaticamente a tutte le partizioni esistenti e future.
  # -----------------------------------------------------------

  - changeSet:
      id: 20260426-10-08-alter-note-add-tx-id
      author: mctit
      comment: >
        ALTER TABLE vendite.note (padre partizionato) ADD COLUMN tx_id.
        Si propaga automaticamente alle 5 partizioni: note_contratto,
        note_preventivo, note_ddt, note_fatture, note_ordini.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: note
      changes:
        - addColumn:
            schemaName: vendite
            tableName: note
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  remarks: >
                    Transaction id correlazione audit (popolato da
                    trgfn_tx_id_managed via automation). La colonna
                    e' definita sulla padre e propagata a tutte le
                    partizioni figlie.
      rollback:
        - dropColumn:
            schemaName: vendite
            tableName: note
            columnName: tx_id
