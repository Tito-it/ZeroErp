# ADD CONSTRAINT chk_commesse_attivita_tipo_doc_emittibile (NOT VALID)
#   Backstop dichiarativo dell'invariante di riga (brief-db-guard-tipo-doc-
#   attivita §4.3, difesa in profondita'):
#
#     (stato_approvazione='APPROVATA' AND stato_emissione='NON_EMESSA')
#         => tipo_doc_fiscale_id IS NOT NULL
#
#   Ridondante col guard trg_commesse_attivita_a10_guard_tipo_doc_emittibile
#   (20260619-05): il trigger da' l'errore parlante, il CHECK e' la rete di
#   sicurezza assoluta su ogni path (errore non parlante SQLSTATE 23514).
#
#   NOT VALID: enforce su ogni nuovo INSERT/UPDATE da subito, MA non valida le
#   righe legacy gia' presenti (evita di dipendere dall'ordine col backfill
#   manuale G0). Dopo la bonifica delle righe esistenti
#   (APPROVATA+NON_EMESSA+tipo_doc NULL) si puo' eseguire, a mano e una tantum:
#     ALTER TABLE vendite.commesse_attivita
#       VALIDATE CONSTRAINT chk_commesse_attivita_tipo_doc_emittibile;
# Dipendenze: vendite.commesse_attivita.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260619-06-add-chk-commesse-attivita-tipo-doc-emittibile-mctit.yaml

  - changeSet:
      id: 20260619-06-add-chk-commesse-attivita-tipo-doc-emittibile
      author: mctit
      comment: >
        CHECK NOT VALID chk_commesse_attivita_tipo_doc_emittibile: backstop
        dichiarativo dell'invariante (APPROVATA AND NON_EMESSA) =>
        tipo_doc_fiscale_id NOT NULL. Difesa in profondita' del guard 20260619-05.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: commesse_attivita
            - not:
                - sqlCheck:
                    expectedResult: "1"
                    sql: >-
                      SELECT count(*) FROM pg_constraint
                      WHERE conname = 'chk_commesse_attivita_tipo_doc_emittibile'
                        AND conrelid = 'vendite.commesse_attivita'::regclass
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.commesse_attivita
                  ADD CONSTRAINT chk_commesse_attivita_tipo_doc_emittibile
                  CHECK (
                      NOT (stato_approvazione = 'APPROVATA' AND stato_emissione = 'NON_EMESSA')
                      OR tipo_doc_fiscale_id IS NOT NULL
                  ) NOT VALID;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.commesse_attivita
                  DROP CONSTRAINT IF EXISTS chk_commesse_attivita_tipo_doc_emittibile;
