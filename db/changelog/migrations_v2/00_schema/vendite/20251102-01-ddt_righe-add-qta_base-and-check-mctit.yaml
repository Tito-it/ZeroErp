databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20251102-01-ddt_righe-add-qta_base-and-check-mctit.yaml

  - changeSet:
      id: 20251102-01-ddt_righe-add-qta_base-and-check
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: vendite
              tableName: ddt_righe
              columnName: qta_base

      changes:
        - addColumn:
           schemaName: vendite
           tableName: ddt_righe
           columns:
             - column:
                 name: qta_base
                 type: numeric(18,6)
                 remarks: "Quantità convertita nella UoM base articolo"
            

        - sql:
              splitStatements: false
              sql: |
                  -- Check validità e valori ammessi
                  ALTER TABLE vendite.ddt_righe
                  ADD CONSTRAINT k_ddt_righe_qta_pos
                  CHECK ( qta > 0);
                
  - changeSet:
      id: 20251102-02-ddt_righe-add-qta_operativa
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: vendite
              tableName: ddt_righe
              columnName: qta_operativa  

      changes:
        - addColumn:
           schemaName: vendite
           tableName: ddt_righe
           columns:
             - column:
                 name: qta_operativa
                 type: numeric(18,6)
                 remarks: "Quantità convertita nella UoM operativa articolo"
             - column: { name: uom_operativa_id, type: BIGINT, remarks: "Unità di misura operativa (catalogo.unita_misura.id)" }

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: ddt_righe
            baseColumnNames: uom_operativa_id
            constraintName: fk_ddt_vendita_r_uom_operativa
            referencedTableSchemaName: catalogo
            referencedTableName: unita_misura
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
      
        - sql:
              splitStatements: false
              sql: |
                 ALTER TABLE IF EXISTS vendite.ddt_righe 
                 DROP CONSTRAINT 
                 IF EXISTS fk_ddt_vendita_r_uom;

        - dropColumn:
            schemaName: vendite
            tableName: ddt_righe
            columns:
              - column:
                  name: qta_base
        
        - sql:
              splitStatements: false
              sql: |
                  -- Check validità e valori ammessi
                  ALTER TABLE vendite.ddt_righe
                  ADD CONSTRAINT k_ddt_righe_qta_operativa_pos
                  CHECK ( qta_operativa > 0);
  - changeSet:
      id: 20251102-03-ddt_righe-drop-uom_id
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        
        -  columnExists:
              schemaName: vendite
              tableName: ddt_righe
              columnName: uom_id  
      
      changes:  
        - dropColumn:
              schemaName: vendite
              tableName: ddt_righe
              columns:
                - column:
                    name: uom_id
          