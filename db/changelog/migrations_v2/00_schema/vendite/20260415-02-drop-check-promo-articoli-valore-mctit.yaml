# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Drop CHECK chk_promo_articoli_valore introdotto nel changeSet
# 20260414-13.
#
# Why: il CHECK forzava valore_variazione > 0 per PERCENTUALE/VALORE_FISSO
# e >= 0 per PREZZO_FISSO. Restringe inutilmente la semantica:
#   - segno algebrico negativo = sconto (formula resolver: base*(1+v/100)
#     e base+v) -> deve essere ammesso
#   - PREZZO_FISSO negativo non ha senso ma e' gestito dal contesto business
# Decisione 15-04-2026: la promo accetta qualsiasi valore numerico; la
# convenzione di segno e' responsabilita' della UI/operatore.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260415-02-drop-check-promo-articoli-valore-mctit.yaml

  - changeSet:
      id: 20260415-02-drop-check-promo-articoli-valore
      author: mctit
      comment: >
        Drop CHECK chk_promo_articoli_valore: la convenzione di segno della
        variazione promo va gestita lato UI/business, non vincolata in DB.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE vendite.promo_articoli
                  DROP CONSTRAINT IF EXISTS chk_promo_articoli_valore;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.promo_articoli
                  ADD CONSTRAINT chk_promo_articoli_valore
                  CHECK (
                      (tipo_variazione IN ('PERCENTUALE', 'VALORE_FISSO') AND valore_variazione > 0)
                      OR
                      (tipo_variazione = 'PREZZO_FISSO' AND valore_variazione >= 0)
                  );
