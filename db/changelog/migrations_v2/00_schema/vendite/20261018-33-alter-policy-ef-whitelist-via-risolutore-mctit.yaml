# LE 69 POLICY CON ADATTATORE: PERIMETRO UNA VOLTA, RISOLUTORE PER RIGA
#   le tabelle di vendite (e di pagamenti e anagrafiche) protette da uno dei
#   21 adattatori di -32
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5quinquies, D-3b-2 giro 1b (D-3b-2d).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   fn_scope_ef_whitelist_via_<x>(utente, chiave) per riga: la canonica per
#   riga (il perimetro rifatto a ogni riga) e, sotto, la policy del padre.
#
# ── LA CURA ─────────────────────────────────────────────────────────
#   La forma di 20261018-26 con l'emittente dal risolutore:
#     script.fn_scope_ef_perimetro(
#         (SELECT script.fn_get_emittenti_scope_pk_ids(utente)),
#         script.fn_resolve_emittente_fiscale_id('<modo>', chiave))
#   Il perimetro una volta per istruzione; per riga una lettura per chiave
#   (DEFINER, nessuna policy annidata). Gate della veste OPERATORE, USING e
#   WITH CHECK, comando, ruoli: invariati. 140 sostituzioni in 69 policy,
#   comprese le due con fn_scope_ef_whitelist_via_contabile (modo 'contabile'
#   del risolutore, che l'adattatore usa gia'): in una combinava in OR con la
#   forma nuova, e lasciata per riga avrebbe riportato la canonica nel piano.
#   Generato dal testo vivo di dbdev (2026-10-18). Rollback: i testi di prima.

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261018-33-alter-policy-ef-whitelist-via-risolutore-mctit.yaml

  - changeSet:
      id: 20261018-33-alter-policy-ef-whitelist-via-risolutore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le 69 policy con un adattatore via_* di vendite (e via_contabile) calcolano il perimetro una volta per istruzione e chiedono l'emittente per riga a fn_resolve_emittente_fiscale_id. D-3b-2 giro 1b.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 69
            sql: >
              SELECT count(*) FROM pg_policies
               WHERE coalesce(qual, '') || coalesce(with_check, '') ~ 'fn_scope_ef_whitelist_via_(attivita_fatturabile|commessa|commessa_attivita|contratto|contratto_riga|ddt|ddt_riga|fattura|fattura_sdi|listino|listino_versione|lotto|offerta|offerta_eccezione|ordine|ordine_riga|preventivo|preventivo_riga|reso|reso_riga|sr|contabile)\('
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_resolve_emittente_fiscale_id(text,bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
