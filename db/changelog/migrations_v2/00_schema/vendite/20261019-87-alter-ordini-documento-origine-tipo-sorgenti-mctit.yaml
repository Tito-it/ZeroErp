                      UNION ALL
                       SELECT c.area,
                          c.competenza_mese,
                          c.documento_id,
                          c.documento_uid,
                          c.codice,
                          c.emittente_fiscale_id,
                          c.emittente_soggetto_ruolo_id,
                          c.valore_totale,
                          c.valore_transitato,
                          c.unita_totali,
                          c.unita_transitate,
                          c.is_transitato,
                          c.is_abortito,
                          c.motivo_fermo,
                          c.stato_codice_interno,
                          c.stato_codice,
                          c.fase,
                          c.cliente_display,
                          c.data_riferimento
                         FROM vendite.vw_dash_fatturazione_contratti c
                      UNION ALL
                       SELECT m.area,
                          m.competenza_mese,
                          m.documento_id,
                          m.documento_uid,
                          m.codice,
                          m.emittente_fiscale_id,
                          m.emittente_soggetto_ruolo_id,
                          m.valore_totale,
                          m.valore_transitato,
                          m.unita_totali,
                          m.unita_transitate,
                          m.is_transitato,
                          m.is_abortito,
                          m.motivo_fermo,
                          m.stato_codice_interno,
                          m.stato_codice,
                          m.fase,
                          m.cliente_display,
                          m.data_riferimento
                         FROM vendite.vw_dash_fatturazione_commesse m
                      UNION ALL
                       SELECT t.area,
                          t.competenza_mese,
                          t.documento_id,
                          t.documento_uid,
                          t.codice,
                          t.emittente_fiscale_id,
                          t.emittente_soggetto_ruolo_id,
                          t.valore_totale,
                          t.valore_transitato,
