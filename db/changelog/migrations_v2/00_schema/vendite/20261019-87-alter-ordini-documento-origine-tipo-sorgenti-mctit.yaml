                          o.stato_codice,
                          o.fase,
                          o.cliente_display,
                          o.data_riferimento
                         FROM vendite.vw_dash_fatturazione_ordini o
                      UNION ALL
                       SELECT f.area,
                          f.competenza_mese,
                          f.documento_id,
                          f.documento_uid,
                          f.codice,
                          f.emittente_fiscale_id,
                          f.emittente_soggetto_ruolo_id,
                          f.valore_totale,
                          f.valore_transitato,
                          f.unita_totali,
                          f.unita_transitate,
                          f.is_transitato,
