# LE 8 POLICY DI SHOP E DELLE NOTE DI CONTROPARTE: IL PERIMETRO UNA VOLTA
#   Brief: brief-db-perimetro-una-volta-famiglie-residue §8 (giro 4).
#
# - le 6 policy SHOP_CUSTOMER che chiamavano fn_scope_shop_via_ba,
#   _via_ordine, _via_ordine_riga (clienti, note_ordini, ordini_indirizzi,
#   ordini_righe, ordini_righe_componenti, ordini_righe_fulfillment):
#   fn_scope_sr_perimetro((SELECT perimetro SHOP_CUSTOMER), fn_resolve_controparte_sr_id
#   ('<modo>_shop', chiave)). Il canale SHOP sta nel modo (-37): fuori canale
#   la controparte e' NULL, e la riga non si vede;
# - le 2 policy del padre vendite.note (rls_note_cliente, rls_note_shop): gli
#   smistatori nuovi (-38) col perimetro della veste del gate.
# ⭐ Stesse risposte nel percorso reale; come ai giri 2 e 3 il perimetro
#   pretende la veste del GATE. Gate, comando, ruoli: invariati.
# Generato dal testo vivo di dbdev (2026-10-21). Rollback: i testi di prima.

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261021-39-alter-policy-shop-e-note-controparte-perimetro-mctit.yaml

  - changeSet:
      id: 20261021-39-alter-policy-shop-e-note-controparte-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le 6 policy shop e le 2 del padre vendite.note per cliente e shop calcolano il perimetro dell'identita' una volta per istruzione. Giro 4 di brief-db-perimetro-una-volta-famiglie-residue.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 8
            sql: >
              SELECT count(*) FROM pg_policies
               WHERE coalesce(qual, '') || coalesce(with_check, '') ~ 'fn_scope_(shop_via_|note_cliente\(|note_shop\()'
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE pronamespace = 'script'::regnamespace
                 AND proname IN ('fn_scope_note_cliente_perimetro', 'fn_scope_note_shop_perimetro')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_clienti_shop ON anagrafiche.clienti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('billing_account_shop'::text, billing_account_id))));

              ALTER POLICY rls_note_cliente ON vendite.note
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_note_cliente_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), target_tipo, target_id)));

              ALTER POLICY rls_note_shop ON vendite.note
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_note_shop_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), target_tipo, target_id)));

              ALTER POLICY rls_note_ordini_shop ON vendite.note_ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_shop'::text, target_id))));

              ALTER POLICY rls_ordini_indirizzi_shop ON vendite.ordini_indirizzi
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_shop'::text, ordine_id))));

              ALTER POLICY rls_ordini_righe_shop ON vendite.ordini_righe
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_shop'::text, ordine_id))));

              ALTER POLICY rls_ordini_righe_componenti_shop ON vendite.ordini_righe_componenti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_riga_shop'::text, riga_ordine_id))));

              ALTER POLICY rls_ordini_righe_fulfillment_shop ON vendite.ordini_righe_fulfillment
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_riga_shop'::text, ordine_riga_id))));
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_clienti_shop ON anagrafiche.clienti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_shop_via_ba((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, billing_account_id)));

              ALTER POLICY rls_note_cliente ON vendite.note
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_note_cliente((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, target_tipo, target_id)));

              ALTER POLICY rls_note_shop ON vendite.note
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_note_shop((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, target_tipo, target_id)));

              ALTER POLICY rls_note_ordini_shop ON vendite.note_ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_shop_via_ordine((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, target_id)));

              ALTER POLICY rls_ordini_indirizzi_shop ON vendite.ordini_indirizzi
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_shop_via_ordine((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ordine_id)));

              ALTER POLICY rls_ordini_righe_shop ON vendite.ordini_righe
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_shop_via_ordine((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ordine_id)));

              ALTER POLICY rls_ordini_righe_componenti_shop ON vendite.ordini_righe_componenti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_shop_via_ordine_riga((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, riga_ordine_id)));

              ALTER POLICY rls_ordini_righe_fulfillment_shop ON vendite.ordini_righe_fulfillment
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_shop_via_ordine_riga((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ordine_riga_id)));
