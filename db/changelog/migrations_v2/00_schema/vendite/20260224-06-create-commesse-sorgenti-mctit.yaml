databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260224-06-create-commesse-sorgenti-mctit.yaml

  - changeSet:
      id: 20260224-06-create-commesse-sorgenti
      author: mctit
      comment: "Crea bridge root source su commessa con vincoli idempotenza sorgente."
      changes:
        - createTable:
            schemaName: vendite
            tableName: commesse_sorgenti
            remarks: "Link sorgente ROOT della commessa."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_commesse_sorgenti
                    nullable: false
              - column:
                  name: commessa_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: sorgente_tipo_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: sorgente_uid
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: sorgente_riga
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: ruolo_link
                  type: varchar(16)
                  defaultValue: "ROOT"
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: commesse_sorgenti
            baseColumnNames: commessa_id
            referencedTableSchemaName: vendite
            referencedTableName: commesse
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_commesse_sorgenti_commessa

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: commesse_sorgenti
            baseColumnNames: sorgente_tipo_id
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_commesse_sorgenti_tipo

        - addUniqueConstraint:
            schemaName: vendite
            tableName: commesse_sorgenti
            columnNames: commessa_id, ruolo_link
            constraintName: uq_commesse_sorgenti_commessa_ruolo

        - addUniqueConstraint:
            schemaName: vendite
            tableName: commesse_sorgenti
            columnNames: sorgente_tipo_id, sorgente_uid, ruolo_link
            constraintName: uq_commesse_sorgenti_src_uid_ruolo

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- In questa fase il bridge gestisce solo ROOT.
              ALTER TABLE vendite.commesse_sorgenti
                ADD CONSTRAINT chk_commesse_sorgenti_ruolo
                CHECK (ruolo_link IN ('ROOT'));

              CREATE INDEX IF NOT EXISTS ix_commesse_sorgenti_commessa
                ON vendite.commesse_sorgenti (commessa_id);
