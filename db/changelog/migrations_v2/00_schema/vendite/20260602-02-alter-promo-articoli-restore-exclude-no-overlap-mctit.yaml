#
# Ripristino enforcement anti-overlap su vendite.promo_articoli.
#
# Contesto: ex_promo_articoli_no_overlap era un vero EXCLUDE (creato in
# 20260414-13); il refactor STORED 20260514-30 lo ha ricreato come CREATE INDEX
# (DROP COLUMN validita CASCADE -> ricreato a indice), perdendo l'enforcement.
# Diagnosi completa: refactor-overlap.md.
#
# Censimento overlap su dev (2026-06-02): 0 coppie violanti -> nessuna bonifica.
#
# Vincolo PARZIALE (WHERE attivo): NON gestibile dal framework OVERLAP
# (dbops.automazione_overlap) — vedi guide/automazione-db.md §4.3:
# fn_apply_automazione_overlap crea EXCLUDE *senza* WHERE. Va quindi scritto
# esplicitamente, come per contratti (20260521-03). fn_apply resta idempotente
# (salta in presenza di un EXCLUDE sul periodo) e non clobbera questo vincolo.
# L'indice standalone ix_promo_articoli_validita_gist resta invariato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260602-02-alter-promo-articoli-restore-exclude-no-overlap-mctit.yaml

  - changeSet:
      id: 20260602-02-alter-promo-articoli-restore-exclude-no-overlap
      author: mctit
      comment: >
        Sostituisce l'indice-civetta ex_promo_articoli_no_overlap (CREATE INDEX,
        non enforçante) con un vero EXCLUDE USING gist parziale WHERE (attivo IS TRUE)
        sulle chiavi (articolo_id, uom_id, validita).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: promo_articoli
            - sqlCheck:
                expectedResult: "1"
                sql: |
                  SELECT COUNT(*)::text FROM pg_extension WHERE extname = 'btree_gist';
            - sqlCheck:
                expectedResult: "0"
                sql: |
                  SELECT COUNT(*)::text
                    FROM pg_constraint con
                    JOIN pg_class c ON c.oid = con.conrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'vendite'
                     AND c.relname = 'promo_articoli'
                     AND con.conname = 'ex_promo_articoli_no_overlap'
                     AND con.contype = 'x';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP INDEX IF EXISTS vendite.ex_promo_articoli_no_overlap;

              ALTER TABLE vendite.promo_articoli
                  ADD CONSTRAINT ex_promo_articoli_no_overlap
                  EXCLUDE USING gist (
                      articolo_id WITH =,
                      uom_id      WITH =,
                      validita    WITH &&
                  )
                  WHERE (attivo IS TRUE);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.promo_articoli
                  DROP CONSTRAINT IF EXISTS ex_promo_articoli_no_overlap;
              CREATE INDEX ex_promo_articoli_no_overlap
                  ON vendite.promo_articoli
                  USING gist (articolo_id, uom_id, validita)
                  WHERE (attivo IS TRUE);
