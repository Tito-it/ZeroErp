# IL KIT SUL LISTINO HA UN POSTO SUO, PER CIO' CHE NON E' UN PREZZO: vendite.listini_kit
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §7.2 e §7.7 (D-2-bis,
#   decisione (B) di Tid, 2026-10-31). Lotto L12.
#
# -- IL PROBLEMA ---------------------------------------------------------------------------------
#   Sul listino il kit non ha una riga: e' l'insieme dei prezzi dei suoi
#   componenti (vendite.listini_righe_componenti), e il prezzo del kit e' la
#   loro somma. Decisione del modello unificato dei componenti
#   (work-done/brief-db-componenti-modello-unificato, 2026-05): il padre e'
#   vietato in listini_righe, cosi' il suo prezzo non puo' diventare un
#   secondo prezzo diverso dalla somma.
#   La periodicita' (G-0-bis, 20261029-11) e' una condizione del listino e sta
#   sulla riga di listino: il kit, che una riga non ce l'ha, non ne aveva una.
#   Due conseguenze sul modello: un kit su un listino di quota fissa non si
#   addebitava mai (il lister prende le quote fisse da listini_righe), e un kit
#   aderito non ereditava la periodicita'.
#
# -- LA FORMA (B) --------------------------------------------------------------------------------
#   Una riga per versione e kit: versione, kit, periodicita'. Resta valida la
#   decisione di maggio: qui non c'e' un prezzo, e il prezzo del kit resta la
#   somma dei componenti. Scartate (Tid, 2026-10-31): (A) la riga del padre in
#   listini_righe senza prezzo, che revocava quella decisione e toglieva il
#   NOT NULL a listini_righe.prezzo; (C) la periodicita' sull'articolo, contro
#   G-0-bis.
#   * periodicita NOT NULL: la riga esiste per dire con che ritmo il kit si
#     addebita. Un kit senza riga qui non ha una periodicita', come una riga di
#     listino con la colonna vuota.
#   * nessun attivo: si scrive solo in bozza (guard 20261031-30), come i
#     componenti; fuori dalla bozza la versione e' ferma, e in bozza si
#     cancella.
#   * nessuno storico: non lo hanno le sorelle (listini_righe,
#     listini_righe_componenti).
#
# -- IL PERIMETRO -------------------------------------------------------------------------------
#   Satellite della versione, come le righe e i componenti: stessa policy della
#   famiglia (20260910-22, forma del 20261018-33), con l'emittente risolto dalla
#   versione (script.fn_resolve_emittente_fiscale_id('listino_versione', ...)).
#   Accesa qui, nello stesso changeSet: una tabella nuova con FK verso tabelle
#   protette, senza policy, fa rosso il presidio del perimetro. ENABLE senza
#   FORCE, come tutto il progetto.
#
# -- ARRIVANO DA ci_apply --------------------------------------------------------------------------
#   audit, tx_id, i «padre attivo» sulle FK, il lucchetto dell'identita'
#   (automation_lock_columns.csv, stesso giro). I grant dell'app dal loop.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261031-29-create-table-listini-kit-mctit.yaml

  - changeSet:
      id: 20261031-29-create-table-listini-kit
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE vendite.listini_kit: il kit (articolo composito) su una versione di listino,
        con la sua periodicita'. Nessun prezzo: quello del kit resta la somma dei componenti.
        Policy RLS della famiglia dei listini e RLS accesa. Brief:
        brief-db-contratto-righe-periodiche-in-commessa §7.2 (D-2-bis, B).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: listini_versioni
            - tableExists:
                schemaName: config
                tableName: periodicita
            - not:
                - tableExists:
                    schemaName: vendite
                    tableName: listini_kit
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE vendite.listini_kit (
                  id                  BIGINT GENERATED BY DEFAULT AS IDENTITY
                                      CONSTRAINT pk_listini_kit PRIMARY KEY,
                  listino_versione_id BIGINT       NOT NULL,
                  articolo_padre_id   UUID         NOT NULL,
                  periodicita         VARCHAR(32)  NOT NULL,
                  meta                JSONB        NOT NULL DEFAULT '{}'::jsonb,
                  tx_id               UUID,
                  data_insert         TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert         TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update         TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update         TEXT         NOT NULL DEFAULT CURRENT_USER,
                  -- La versione si cancella dal verbo (fn_elimina_versione_listino),
                  -- che porta via anche queste righe: NO ACTION, come le sorelle.
                  CONSTRAINT fk_listini_kit_versione
                      FOREIGN KEY (listino_versione_id)
                      REFERENCES vendite.listini_versioni (id),
                  CONSTRAINT fk_listini_kit_articolo
                      FOREIGN KEY (articolo_padre_id)
                      REFERENCES catalogo.articoli (id),
                  -- Come fk_listini_righe_periodicita (20261029-11).
                  CONSTRAINT fk_listini_kit_periodicita
                      FOREIGN KEY (periodicita)
                      REFERENCES config.periodicita (codice)
                      ON UPDATE RESTRICT ON DELETE RESTRICT,
                  -- Un kit ha UNA periodicita' per versione.
                  CONSTRAINT uq_listini_kit_versione_articolo
                      UNIQUE (listino_versione_id, articolo_padre_id)
              );

              COMMENT ON TABLE vendite.listini_kit IS
                  'Il KIT su una versione di listino, per cio'' che non e'' un prezzo: oggi la periodicita'' '
                  'con cui si addebita a canone (D-2-bis, decisione B di Tid, 2026-10-31). Il kit sul listino '
                  'non ha una riga in vendite.listini_righe (decisione del modello unificato dei componenti, '
                  '2026-05): il suo prezzo e'' la somma dei componenti (vendite.listini_righe_componenti), e '
                  'qui non c''e''. Si scrive solo in bozza (vendite.trgfn_listini_kit_guard); la versione '
                  'clonata la copia, quella eliminata la porta via. La legge '
                  'vendite.fn_listino_periodicita_articolo, la sede della periodicita'' di un articolo sul '
                  'listino. Brief: brief-db-contratto-righe-periodiche-in-commessa §7.2.';
              COMMENT ON COLUMN vendite.listini_kit.articolo_padre_id IS
                  'Il kit: un articolo composito (catalogo.articoli.is_composito, controllato dal guard). Lo '
                  'stesso nome della colonna di vendite.listini_righe_componenti. Non cambia dopo l''INSERT.';
              COMMENT ON COLUMN vendite.listini_kit.periodicita IS
                  'La periodicita'' del kit su questo listino (config.periodicita), come '
                  'vendite.listini_righe.periodicita per gli altri articoli: su una quota fissa e'' quella '
                  'con cui il kit si addebita; altrove e'' la proposta che l''ADESIONE eredita. Obbligatoria: '
                  'la riga esiste per dirla.';

              -- ---------- Il perimetro: satellite della versione (famiglia 20260910-22) ----------
              CREATE POLICY rls_listini_kit_ef_whitelist
                  ON vendite.listini_kit
                  FOR ALL
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_perimetro(
                              (SELECT script.fn_get_emittenti_scope_pk_ids(
                                          NULLIF(current_setting('app.current_user_id', true), '')::integer)),
                              script.fn_resolve_emittente_fiscale_id('listino_versione', listino_versione_id))
                  )
                  WITH CHECK (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_perimetro(
                              (SELECT script.fn_get_emittenti_scope_pk_ids(
                                          NULLIF(current_setting('app.current_user_id', true), '')::integer)),
                              script.fn_resolve_emittente_fiscale_id('listino_versione', listino_versione_id))
                  );

              ALTER TABLE vendite.listini_kit ENABLE ROW LEVEL SECURITY;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS vendite.listini_kit;
