# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: aggiunge colonna validita a listini_associazioni.
# Vedi: migrazione-daterange.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260412-08-alter-listini-associazioni-add-validita-mctit.yaml

  - changeSet:
      id: 20260412-08-alter-listini-associazioni-add-validita
      author: mctit
      comment: >
        Aggiunge colonna validita daterange a vendite.listini_associazioni.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists: { schemaName: vendite, tableName: listini_associazioni, columnName: validita }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.listini_associazioni
                ADD COLUMN validita daterange;

              COMMENT ON COLUMN vendite.listini_associazioni.validita
                IS 'Range di validita` calcolato dal trigger sync da valido_dal/valido_al. Non scrivere direttamente.';

      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.listini_associazioni
                DROP COLUMN IF EXISTS validita;
