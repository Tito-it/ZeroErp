databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20251110-01-ordini-indirizzi-rename-idx-mctit.yaml

    - changeSet:
          id: 20251110-01-ordini-indirizzi-rename-idx
          author: mctit

          changes:
              - dropIndex:
                    schemaName: vendite
                    tableName: ordini_indirizzi
                    indexName: ix_ordini_indir_ordine
              - createIndex:
                    schemaName: vendite
                    tableName: ordini_indirizzi
                    indexName: ix_ordini_indirizzi_ordine
                    columns:
                        - column:
                              name: ordine_id

              - sql:
                    stripComments: true
                    splitStatements: false
                    sql: |
                        COMMENT ON CONSTRAINT fk_ordini_indir_tipo ON vendite.ordini_indirizzi
                          IS 'FK → config.tipi_indirizzi(id)';
