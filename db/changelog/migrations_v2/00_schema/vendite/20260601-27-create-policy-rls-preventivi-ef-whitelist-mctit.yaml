#
# Policy RLS dry-run EF_WHITELIST su vendite.preventivi (convenzione PK).
# Gate ruolo_applicativo=OPERATORE + adapter PK fn_scope_ef_whitelist.
# NON abilita RLS (no ENABLE): dormiente fino all'ondata 2.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260601-27-create-policy-rls-preventivi-ef-whitelist-mctit.yaml

  - changeSet:
      id: 20260601-27-create-policy-rls-preventivi-ef-whitelist
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Policy dry-run rls_preventivi_ef_whitelist: operatore vede solo
        preventivi con emittente_fiscale_id in whitelist (canonica via
        adapter PK script.fn_scope_ef_whitelist su app.current_user_id).
        Gate ruolo_applicativo=OPERATORE fail-closed. Non attiva finche'
        ALTER TABLE ... ENABLE ROW LEVEL SECURITY (ondata 2).
      preConditions:
        - onFail: HALT
        - and:
          - columnExists: { schemaName: vendite, tableName: preventivi, columnName: emittente_fiscale_id }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                 WHERE n.nspname='script' AND p.proname='fn_scope_ef_whitelist';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP POLICY IF EXISTS rls_preventivi_ef_whitelist ON vendite.preventivi;

              CREATE POLICY rls_preventivi_ef_whitelist ON vendite.preventivi
                  AS PERMISSIVE
                  FOR SELECT
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_fiscale_id
                      )
                  );

              COMMENT ON POLICY rls_preventivi_ef_whitelist ON vendite.preventivi IS
                  'RLS dry-run: operatore vede solo preventivi con emittente in whitelist '
                  '(adapter PK fn_scope_ef_whitelist -> canonica). Non attiva finche ENABLE.';
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS rls_preventivi_ef_whitelist ON vendite.preventivi;
