databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260205-03-extend-note-target-tipo-attivitaft-mctit.yaml

  - changeSet:
      id: 20260205-03-extend-note-target-tipo-attivitaft
      author: mctit
      comment: "Estende chk_note_target_tipo con ATTIVITAFT"
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: note
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE vendite.note DROP CONSTRAINT IF EXISTS chk_note_target_tipo;
              ALTER TABLE vendite.note
              ADD CONSTRAINT chk_note_target_tipo
              CHECK (target_tipo IN ('PREVENTIVO','CONTRATTO','FATTURA','ORDINE','DDT','ATTIVITAFT'));
              COMMENT ON CONSTRAINT chk_note_target_tipo ON vendite.note
                IS 'Valori ammessi: PREVENTIVO | CONTRATTO | FATTURA | ORDINE | DDT | ATTIVITAFT.';
