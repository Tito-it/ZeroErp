# LA FAMIGLIA DI DOCUMENTO PRENDE IL SUO `codice` — passo 4 di 4: i vincoli
#   Brief: brief-db-ricerca-full-colonne-da-accendere.md §3.5
#
#   NOT NULL, UNIQUE e CHECK non vuoto: la forma del `codice` delle altre
#   tabelle a doppio codice (config.stati_doc_fiscale, magazzino.magazzini).
#
# ⭐ NOT NULL e non «nullable finche' qualcuno lo scrive»: il dato si puo'
#   sempre fornire — alla nascita lo fornisce il trigger (-04) quando chi
#   inserisce non lo passa —, quindi il vincolo non costa niente a nessuna
#   strada di scrittura e toglie alla lista il caso «riga senza codice».
#
# ⭐ UNIQUE: e' il codice che l'operatore legge e cerca; due famiglie con lo
#   stesso sarebbero indistinguibili a video. Pieno, non parziale sulle
#   attive: e' la forma di uq_famiglie_documento_codice_interno.
#
# ⚠️ Nessuna preCondition sul contenuto: su dev il backfill (-05) ha appena
#   riempito ogni riga, su un DB da zero la tabella e' vuota. Se una riga
#   restasse senza codice, il SET NOT NULL fallirebbe rumorosamente, che e'
#   il verso giusto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260924-06-alter-famiglie-documento-codice-vincoli-mctit.yaml

  - changeSet:
      id: 20260924-06-alter-famiglie-documento-codice-vincoli
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Passo 4 di 4 del codice mutabile di vendite.famiglie_documento: NOT NULL, UNIQUE
        (uq_famiglie_documento_codice) e CHECK non vuoto (chk_famiglie_documento_codice_nonvuoto).
        Brief: brief-db-ricerca-full-colonne-da-accendere.md §3.5.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: famiglie_documento
            columnName: codice
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.famiglie_documento
                ALTER COLUMN codice SET NOT NULL;

              ALTER TABLE vendite.famiglie_documento
                ADD CONSTRAINT chk_famiglie_documento_codice_nonvuoto
                CHECK (btrim(codice) <> '');

              ALTER TABLE vendite.famiglie_documento
                ADD CONSTRAINT uq_famiglie_documento_codice UNIQUE (codice);
      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.famiglie_documento
                DROP CONSTRAINT IF EXISTS uq_famiglie_documento_codice;
              ALTER TABLE vendite.famiglie_documento
                DROP CONSTRAINT IF EXISTS chk_famiglie_documento_codice_nonvuoto;
              ALTER TABLE vendite.famiglie_documento
                ALTER COLUMN codice DROP NOT NULL;
