# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Aggiunge vendite.contratti_utilities.tipo_utenza_id (nullable).
# Il contratto "fotografa" tipo+classe utenza al momento della stipula
# per consistenza storica e per query dirette nel resolver.
#
# Il backfill e' al changeSet 20260414-10; il guard di coerenza
# (tipo/classe/utility Base) al changeSet 20260414-11 (trgfn in 20_code).
# Pricing v5 - riferimento sviluppo-listini-v5.md
# sezione 5.2.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260414-09-alter-contratti-utilities-add-tipo-utenza-mctit.yaml

  - changeSet:
      id: 20260414-09-alter-contratti-utilities-add-tipo-utenza
      author: mctit
      comment: >
        Aggiunge tipo_utenza_id (nullable) con FK a config.tipi_utenze.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              schemaName: vendite
              tableName: contratti_utilities
              columnName: tipo_utenza_id

      changes:
        - addColumn:
            schemaName: vendite
            tableName: contratti_utilities
            columns:
              - column:
                  name: tipo_utenza_id
                  type: integer
                  remarks: "FK -> config.tipi_utenze.id. Snapshot storico del tipo utenza del contratto. NULL per utility Base (commercio)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: contratti_utilities
            baseColumnNames: tipo_utenza_id
            constraintName: fk_contratti_utilities_tipo_utenza
            referencedTableSchemaName: config
            referencedTableName: tipi_utenze
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: contratti_utilities
            constraintName: fk_contratti_utilities_tipo_utenza
        - dropColumn:
            schemaName: vendite
            tableName: contratti_utilities
            columnName: tipo_utenza_id
