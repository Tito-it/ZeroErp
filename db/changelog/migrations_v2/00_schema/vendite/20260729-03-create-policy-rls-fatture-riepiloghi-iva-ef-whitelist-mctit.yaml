# R3 — policy rls_fatture_riepiloghi_iva_ef_whitelist su
#   vendite.fatture_riepiloghi_iva.
#   (brief RLS satelliti fattura §5; slice 20260729-01..06)
#
# Gemello del 20260729-01 sull'altro satellite letto dal portale. Vale parola
# per parola lo stesso ragionamento: stessa funzione di scope della testata,
# FOR ALL con WITH CHECK = USING, ENABLE isolato nel 20260729-05.
#
# LA DIFFERENZA CHE CONTA rispetto a fatture_righe. Il riepilogo IVA non e' un
# dato inserito: e' un dato CALCOLATO, che fn_ricalcola_riepilogo_iva_fattura
# ricostruisce sommando le righe e riscrive qui. Le due tabelle di questa slice
# stanno quindi ai due capi della stessa catena — si legge da fatture_righe e si
# scrive su fatture_riepiloghi_iva.
# Questo rende l'invariante dell'header 20260729-01 doppiamente vincolante: se
# le due tabelle avessero scope DIVERSI, esisterebbe un contesto capace di
# leggere solo una parte delle righe e di riscrivere comunque il riepilogo con
# quel totale parziale. Il risultato non sarebbe un errore ma un documento
# fiscale sbagliato, indistinguibile da uno buono.
# Condividendo fn_scope_ef_whitelist_via_fattura, i due capi si aprono e si
# chiudono insieme: o si vede tutta la fattura, o non se ne vede niente.
#
# FOR ALL e' necessario anche qui: fn_ricalcola_riepilogo_iva_fattura non fa
# solo SELECT, riscrive le righe di riepilogo. Con la sola SELECT il ricalcolo
# fallirebbe appena la RLS viene armata.
#
# Dipendenze: vendite.fatture_riepiloghi_iva.fattura_id (NOT NULL),
#   script.fn_scope_ef_whitelist_via_fattura.
# Verifica: db/pgtap/rls/test-rls-fatture-satelliti-functional.sql.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20260729-03-create-policy-rls-fatture-riepiloghi-iva-ef-whitelist-mctit.yaml

    - changeSet:
          id: 20260729-03-create-policy-rls-fatture-riepiloghi-iva-ef-whitelist
          author: mctit
          runOnChange: false
          validCheckSums:
              - ANY
          failOnError: true
          comment: >
              Policy rls_fatture_riepiloghi_iva_ef_whitelist (FOR ALL, scope emittente
              via fn_scope_ef_whitelist_via_fattura, gate OPERATORE). FOR ALL perche'
              fn_ricalcola_riepilogo_iva_fattura riscrive questa tabella. Nessun
              ENABLE qui: 20260729-05.
          preConditions:
              - onFail: HALT
              - and:
                    - columnExists:
                          schemaName: vendite
                          tableName: fatture_riepiloghi_iva
                          columnName: fattura_id
                    - sqlCheck:
                          expectedResult: 1
                          sql: |
                              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                               WHERE n.nspname='script' AND p.proname='fn_scope_ef_whitelist_via_fattura';
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        DROP POLICY IF EXISTS rls_fatture_riepiloghi_iva_ef_whitelist
                            ON vendite.fatture_riepiloghi_iva;

                        CREATE POLICY rls_fatture_riepiloghi_iva_ef_whitelist
                            ON vendite.fatture_riepiloghi_iva
                            AS PERMISSIVE
                            FOR ALL
                            USING (
                                current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                                AND script.fn_scope_ef_whitelist_via_fattura(
                                    NULLIF(current_setting('app.current_user_id', true), '')::integer,
                                    fattura_id
                                )
                            )
                            WITH CHECK (
                                current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                                AND script.fn_scope_ef_whitelist_via_fattura(
                                    NULLIF(current_setting('app.current_user_id', true), '')::integer,
                                    fattura_id
                                )
                            );

                        COMMENT ON POLICY rls_fatture_riepiloghi_iva_ef_whitelist
                            ON vendite.fatture_riepiloghi_iva IS
                            'RLS operatore: scope emittente delegato alla TESTATA '
                            '(fn_scope_ef_whitelist_via_fattura), identico a quello di '
                            'vendite.fatture_righe. FOR ALL perche'' fn_ricalcola_riepilogo_iva_fattura '
                            'RISCRIVE questa tabella sommando le righe: le due tabelle sono i due capi '
                            'della stessa catena, e scope diversi permetterebbero di leggere righe '
                            'parziali e riscrivere comunque il totale — un documento fiscale sbagliato '
                            'che non da'' errore. rev 2026-07-29.';
          rollback:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    sql: |
                        DROP POLICY IF EXISTS rls_fatture_riepiloghi_iva_ef_whitelist
                            ON vendite.fatture_riepiloghi_iva;
