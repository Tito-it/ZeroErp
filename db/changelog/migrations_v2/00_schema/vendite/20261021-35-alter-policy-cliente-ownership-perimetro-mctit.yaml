# LE 8 POLICY DEL CLIENTE SU ORDINI E RICEVUTE: IL PERIMETRO UNA VOLTA
#   Brief: brief-db-perimetro-una-volta-famiglie-residue §7 (giro 3).
#
# Le policy che chiamavano fn_scope_cliente_ownership, _via_ordine e
# _via_ordine_riga (5 del portale, CLIENTE_PORTALE; rls_ordini_shop e
# rls_shop_ricevute_self_ownership, SHOP_CUSTOMER) prendono la forma del
# giro 2 (20261021-32):
#   fn_scope_sr_perimetro(
#       (SELECT fn_get_identita_sr_perimetro(identita, ARRAY['<veste del gate>'])),
#       <cliente della riga>)
# Il cliente della riga: la colonna soggetto_ruolo_id (ordini, ricevute);
# ordine_id / target_id della nota: modo 'ordine'; riga_ordine_id /
# ordine_riga_id: modo 'ordine_riga' (-33).
# ⭐ Stesse risposte nel percorso reale; come al giro 2 il perimetro pretende
#   la veste del GATE (prima: una delle due vesti di cliente). Il middleware
#   imposta veste e identita' dalla stessa riga di identita_digitali.
# Gate, comando, ruoli, filtro canale: invariati. Generato dal testo vivo di
# dbdev (2026-10-21). Rollback: i testi di prima.

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261021-35-alter-policy-cliente-ownership-perimetro-mctit.yaml

  - changeSet:
      id: 20261021-35-alter-policy-cliente-ownership-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le 8 policy di cliente su ordini, loro satelliti e ricevute calcolano il perimetro dell'identita' una volta per istruzione. Giro 3 di brief-db-perimetro-una-volta-famiglie-residue.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 8
            sql: >
              SELECT count(*) FROM pg_policies
               WHERE coalesce(qual, '') || coalesce(with_check, '') ~ 'fn_scope_cliente_ownership'
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('script.fn_resolve_controparte_sr_id(text,bigint)')
                 AND prosrc ~ 'ordine_riga'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_shop_ricevute_self_ownership ON shop.ricevute
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), soggetto_ruolo_id)));

              ALTER POLICY rls_note_ordini_cliente_ownership ON vendite.note_ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine'::text, target_id))));

              ALTER POLICY rls_ordini_cliente_ownership ON vendite.ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), soggetto_ruolo_id)));

              ALTER POLICY rls_ordini_shop ON vendite.ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND (canale_origine = 'SHOP'::config.canale_origine) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), soggetto_ruolo_id)));

              ALTER POLICY rls_ordini_indirizzi_cliente_ownership ON vendite.ordini_indirizzi
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine'::text, ordine_id))));

              ALTER POLICY rls_ordini_righe_cliente_ownership ON vendite.ordini_righe
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine'::text, ordine_id))));

              ALTER POLICY rls_ordini_righe_componenti_cliente_ownership ON vendite.ordini_righe_componenti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_riga'::text, riga_ordine_id))));

              ALTER POLICY rls_ordini_righe_fulfillment_cliente_ownership ON vendite.ordini_righe_fulfillment
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('ordine_riga'::text, ordine_riga_id))));
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_shop_ricevute_self_ownership ON shop.ricevute
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND script.fn_scope_cliente_ownership((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, soggetto_ruolo_id)));

              ALTER POLICY rls_note_ordini_cliente_ownership ON vendite.note_ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_cliente_ownership_via_ordine((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, target_id)));

              ALTER POLICY rls_ordini_cliente_ownership ON vendite.ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_cliente_ownership((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, soggetto_ruolo_id)));

              ALTER POLICY rls_ordini_shop ON vendite.ordini
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND (canale_origine = 'SHOP'::config.canale_origine) AND script.fn_scope_cliente_ownership((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, soggetto_ruolo_id)));

              ALTER POLICY rls_ordini_indirizzi_cliente_ownership ON vendite.ordini_indirizzi
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_cliente_ownership_via_ordine((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ordine_id)));

              ALTER POLICY rls_ordini_righe_cliente_ownership ON vendite.ordini_righe
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_cliente_ownership_via_ordine((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ordine_id)));

              ALTER POLICY rls_ordini_righe_componenti_cliente_ownership ON vendite.ordini_righe_componenti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_cliente_ownership_via_ordine_riga((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, riga_ordine_id)));

              ALTER POLICY rls_ordini_righe_fulfillment_cliente_ownership ON vendite.ordini_righe_fulfillment
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_cliente_ownership_via_ordine_riga((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ordine_riga_id)));
