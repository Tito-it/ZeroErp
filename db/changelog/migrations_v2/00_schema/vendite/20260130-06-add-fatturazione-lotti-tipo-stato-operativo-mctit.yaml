# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260130-06-add-fatturazione-lotti-tipo-stato-operativo-mctit.yaml

  - changeSet:
      id: 20260130-06-add-fatturazione-lotti-tipo-stato-operativo
      author: mctit
      comment: "Aggiunge tipo_lotto e stato_operativo ai lotti di fatturazione"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti
            columns:
              - column:
                  name: tipo_lotto
                  type: text
                  defaultValue: MASSIVO
                  remarks: "Tipo lotto: MASSIVO o GIORNALIERO."
                  constraints:
                    nullable: false

              - column:
                  name: stato_operativo
                  type: text
                  defaultValue: APERTO
                  remarks: "Stato operativo lotto: APERTO, CHIUSO, ERRORE."
                  constraints:
                    nullable: false

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatturazione_lotti
                ADD CONSTRAINT chk_fatturazione_lotti_stato_operativo
                CHECK (stato_operativo IN ('APERTO','CHIUSO','ERRORE'));

              ALTER TABLE vendite.fatturazione_lotti
                ADD CONSTRAINT chk_fatturazione_lotti_tipo_lotto
                CHECK (tipo_lotto IN ('MASSIVO','GIORNALIERO'));
