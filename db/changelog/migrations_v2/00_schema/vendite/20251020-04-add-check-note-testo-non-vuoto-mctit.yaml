# ------------------------------------------------------------
# Aggiunta CHECK: almeno uno tra testo / testo_md non NULL
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20251020-04-add-check-note-testo-non-vuoto-mctit.yaml

  - changeSet:
      id: 20251020-04-add-check-note-testo-non-vuoto
      author: mctit
      validCheckSum:
        - ANY

      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: vendite, tableName: note }
        - tableExists: { schemaName: vendite, tableName: note_contratto }
        - tableExists: { schemaName: vendite, tableName: note_preventivo }
        - tableExists: { schemaName: vendite, tableName: note_fatture }
        - tableExists: { schemaName: vendite, tableName: note_ordini }
        - tableExists: { schemaName: vendite, tableName: note_ddt }

      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE vendite.note
                ADD CONSTRAINT chk_note_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        # Partizioni (meglio ripetere anche qui per enforcement diretto)
        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE vendite.note_contratto
                ADD CONSTRAINT chk_contnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE vendite.note_preventivo
                ADD CONSTRAINT chk_prevnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE vendite.note_fatture
                ADD CONSTRAINT chk_fatnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE vendite.note_ordini
                ADD CONSTRAINT chk_ordnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

              ALTER TABLE vendite.note_ddt
                ADD CONSTRAINT chk_ddtnote_testo_non_vuoto
                CHECK (testo IS NOT NULL OR testo_md IS NOT NULL)
