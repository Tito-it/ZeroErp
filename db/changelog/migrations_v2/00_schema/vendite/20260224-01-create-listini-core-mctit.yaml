            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_listini_righe_emittente

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- Prezzo sempre non negativo.
              ALTER TABLE vendite.listini_righe
                ADD CONSTRAINT chk_listini_righe_prezzo
                CHECK (prezzo >= 0);

              -- Unicita` riga attiva per stessa combinazione dimensionale.
              CREATE UNIQUE INDEX IF NOT EXISTS uq_listini_righe_key_attiva
                ON vendite.listini_righe (
                  listino_versione_id,
                  articolo_id,
                  uom_id,
                  COALESCE(billing_account_id, -1),
                  COALESCE(utility_id, -1),
                  COALESCE(emittente_soggetto_ruolo_id, -1)
                )
                WHERE attivo IS TRUE;

              CREATE INDEX IF NOT EXISTS ix_listini_righe_lookup
                ON vendite.listini_righe (
                  listino_versione_id,
                  articolo_id,
                  uom_id,
                  billing_account_id,
                  utility_id,
                  emittente_soggetto_ruolo_id
                )
                WHERE attivo IS TRUE;

