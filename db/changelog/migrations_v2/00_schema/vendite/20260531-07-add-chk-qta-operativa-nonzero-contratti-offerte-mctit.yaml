# ------------------------------------------------------------
# Refactor quantita/qta_operativa (§5.3) — simmetria del vincolo sulla sorgente.
#
# Sul preventivo (file -06) il check e' secco: qta_operativa <> 0 (sorgente
# sempre NOT NULL). Su contratti_righe e offerte_commerciali_eccezioni la
# sorgente puo' essere legittimamente NULL (fonte_quantita_attesa != 'FISSA':
# LETTURE/TIMESHEET/MANUALE/DERIVATA_COMPONENTI -> quantita da fonte esterna):
# quindi il vincolo e' CONDIZIONALE:
#     qta_operativa IS NULL OR qta_operativa <> 0
#
# Effetto: negativi ammessi su tutte e tre le tabelle (resi/storni); vietato
# solo lo zero esplicito. Allinea la semantica del vincolo sorgente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260531-07-add-chk-qta-operativa-nonzero-contratti-offerte-mctit.yaml

  - changeSet:
      id: 20260531-07-01-add-chk-contrighe-qta-operativa-nonzero
      author: mctit
      comment: >
        contratti_righe: ADD chk_contrighe_qta_operativa_nonzero
        (qta_operativa IS NULL OR qta_operativa <> 0). Negativi ammessi,
        zero vietato; NULL ammesso per fonte != FISSA.
      preConditions:
        - onFail: MARK_RAN
        - and:
          - not:
              - sqlCheck:
                  expectedResult: 1
                  sql: |
                    SELECT COUNT(*) FROM pg_constraint c
                      JOIN pg_class r ON r.oid = c.conrelid
                      JOIN pg_namespace n ON n.oid = r.relnamespace
                     WHERE n.nspname = 'vendite'
                       AND r.relname = 'contratti_righe'
                       AND c.conname = 'chk_contrighe_qta_operativa_nonzero';
          - sqlCheck:
              expectedResult: 0
              sql: |
                SELECT COUNT(*) FROM vendite.contratti_righe WHERE qta_operativa = 0;
      changes:
        - sql:
            sql: |
              ALTER TABLE vendite.contratti_righe
                  ADD CONSTRAINT chk_contrighe_qta_operativa_nonzero
                  CHECK (qta_operativa IS NULL OR qta_operativa <> 0);
      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.contratti_righe
                  DROP CONSTRAINT IF EXISTS chk_contrighe_qta_operativa_nonzero;

  - changeSet:
      id: 20260531-07-02-add-chk-offerte-eccezioni-qta-operativa-nonzero
      author: mctit
      comment: >
        offerte_commerciali_eccezioni: ADD chk_offerte_eccezioni_qta_operativa_nonzero
        (qta_operativa IS NULL OR qta_operativa <> 0). Specchio di contratti_righe.
      preConditions:
        - onFail: MARK_RAN
        - and:
          - not:
              - sqlCheck:
                  expectedResult: 1
                  sql: |
                    SELECT COUNT(*) FROM pg_constraint c
                      JOIN pg_class r ON r.oid = c.conrelid
                      JOIN pg_namespace n ON n.oid = r.relnamespace
                     WHERE n.nspname = 'vendite'
                       AND r.relname = 'offerte_commerciali_eccezioni'
                       AND c.conname = 'chk_offerte_eccezioni_qta_operativa_nonzero';
          - sqlCheck:
              expectedResult: 0
              sql: |
                SELECT COUNT(*) FROM vendite.offerte_commerciali_eccezioni WHERE qta_operativa = 0;
      changes:
        - sql:
            sql: |
              ALTER TABLE vendite.offerte_commerciali_eccezioni
                  ADD CONSTRAINT chk_offerte_eccezioni_qta_operativa_nonzero
                  CHECK (qta_operativa IS NULL OR qta_operativa <> 0);
      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.offerte_commerciali_eccezioni
                  DROP CONSTRAINT IF EXISTS chk_offerte_eccezioni_qta_operativa_nonzero;
