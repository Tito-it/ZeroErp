# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: popola validita per righe esistenti
# e imposta NOT NULL su vendite.listini_associazioni.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260412-10-populate-listini-associazioni-validita-mctit.yaml

  - changeSet:
      id: 20260412-10-populate-listini-associazioni-validita
      author: mctit
      comment: >
        Backfill colonna validita per le righe esistenti e set NOT NULL.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Backfill: SET esplicito, indipendente dall'ordine di attivazione del trigger
              UPDATE vendite.listini_associazioni
                 SET validita = daterange(valido_dal, COALESCE(valido_al, 'infinity'::date), '[]')
               WHERE validita IS NULL;

              ALTER TABLE vendite.listini_associazioni
                ALTER COLUMN validita SET NOT NULL;

      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.listini_associazioni
                ALTER COLUMN validita DROP NOT NULL;
