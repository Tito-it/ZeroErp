# ------------------------------------------------------------
# Crea vendite.offerte_commerciali_eccezioni_componenti.
#
# Mirror strutturale di contratti_righe_componenti per il dominio
# offerte commerciali (§A brief 2026-05-26):
#   - eccezione_offerta_id al posto di riga_contratto_id
#   - stesse colonne / CHECK / UNIQUE / indici
#   - include stato_approvazione_prezzo / pratica_approvazione_prezzo_id
#     (NULL ammesso, workflow L3 non attivo in questa fase): servono al
#     push offerta→contratto per trasportare l'eventuale stato di
#     approvazione prezzo senza perderlo.
#
# Dipendenze:
#   - vendite.offerte_commerciali_eccezioni (20260524-05)
#   - catalogo.articoli_componenti
#   - catalogo.articoli
#   - catalogo.unita_misura
#   - config.iva
#   - config.stato_approvazione_prezzo (enum)
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20260526-22-create-offerte-commerciali-eccezioni-componenti-mctit.yaml

    - changeSet:
          id: 20260526-22-create-offerte-commerciali-eccezioni-componenti
          author: mctit
          comment: >
              Crea vendite.offerte_commerciali_eccezioni_componenti.
              Mirror strutturale di contratti_righe_componenti per il
              dominio offerte commerciali: eccezione_offerta_id invece di
              riga_contratto_id, stesse colonne/CHECK/indici.
              Include stato_approvazione_prezzo / pratica_approvazione_prezzo_id
              (NULL ammesso) per trasporto al push offerta→contratto.
          preConditions:
              - onFail: HALT
              - and:
                    - tableExists:
                          schemaName: vendite
                          tableName: offerte_commerciali_eccezioni
                    - not:
                          tableExists:
                              schemaName: vendite
                              tableName: offerte_commerciali_eccezioni_componenti
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE vendite.offerte_commerciali_eccezioni_componenti (
                            id                              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                                              CONSTRAINT pk_oce_comp PRIMARY KEY,

                            -- FK padre: eccezione offerta (CASCADE: elimina componenti con eccezione)
                            eccezione_offerta_id            BIGINT NOT NULL
                                                              CONSTRAINT fk_oce_comp_eccezione
                                                              REFERENCES vendite.offerte_commerciali_eccezioni(id)
                                                              ON DELETE CASCADE ON UPDATE CASCADE,

                            -- Riga BoM: identifica univocamente il componente nella distinta base
                            articolo_componente_id          UUID NOT NULL
                                                              CONSTRAINT fk_oce_comp_art_comp
                                                              REFERENCES catalogo.articoli_componenti(id)
                                                              ON DELETE RESTRICT ON UPDATE CASCADE,

                            -- Articolo componente (ridondante, ottimizza query dirette)
                            componente_id                   UUID NOT NULL
                                                              CONSTRAINT fk_oce_comp_componente
                                                              REFERENCES catalogo.articoli(id)
                                                              ON DELETE RESTRICT ON UPDATE CASCADE,

                            -- Snapshot coeff_qta al momento della creazione
                            coeff_qta_snapshot              NUMERIC(18,6) NOT NULL
                                                              CONSTRAINT chk_oce_comp_coeff_qta_pos
                                                              CHECK (coeff_qta_snapshot > 0),

                            -- Quantita calcolata: coeff_qta_snapshot * quantita eccezione padre
                            -- Impostata dal trigger trgfn_componenti_calcola_quantita
                            quantita                        NUMERIC(18,6) NOT NULL
                                                              CONSTRAINT chk_oce_comp_quantita_nz
                                                              CHECK (quantita <> 0),

                            -- UoM operativa e fattore conversione
                            uom_operativa_id                BIGINT
                                                              CONSTRAINT fk_oce_comp_uom
                                                              REFERENCES catalogo.unita_misura(id)
                                                              ON DELETE RESTRICT ON UPDATE CASCADE,
                            factor_to_base                  NUMERIC(18,8) NOT NULL DEFAULT 1,
                            qta_operativa                   NUMERIC(18,6),

                            -- Prezzo negoziato del componente (L1/L2/L3)
                            -- Trigger guard_prezzo_obbligatorio blocca 0 su componenti obbligatori
                            prezzo_unitario                 NUMERIC(18,6) NOT NULL,

                            -- IVA del componente (opzionale: eredita dall'articolo se NULL)
                            iva_id                          INTEGER
                                                              CONSTRAINT fk_oce_comp_iva
                                                              REFERENCES config.iva(id)
                                                              ON DELETE RESTRICT ON UPDATE CASCADE,

                            -- Origine prezzo dal pricing resolver v5 (stesso CHECK di contratti)
                            origine_prezzo                  VARCHAR(30) NOT NULL
                                                              CONSTRAINT chk_oce_comp_origine
                                                              CHECK (origine_prezzo IN (
                                                                  'PROMO',
                                                                  'CONTRATTO_OVERRIDE',
                                                                  'CONTRATTO_LISTINO',
                                                                  'CATEGORIA',
                                                                  'MANUALE'
                                                              )),

                            -- Contesto del resolver per audit pricing
                            prezzo_resolver_context         JSONB,

                            -- Approvazione prezzo L3 (NULL ammesso: workflow non attivo su offerte)
                            -- Trasportato al push offerta→contratto senza perdita di stato
                            stato_approvazione_prezzo       config.stato_approvazione_prezzo,
                            pratica_approvazione_prezzo_id  BIGINT
                                                              CONSTRAINT fk_oce_comp_pratica
                                                              REFERENCES pratiche.pratiche(id)
                                                              ON DELETE SET NULL ON UPDATE CASCADE,

                            -- Metadati estensibili
                            meta                            JSONB NOT NULL DEFAULT '{}',
                            ordine                          SMALLINT DEFAULT 0,
                            attivo                          BOOLEAN NOT NULL DEFAULT TRUE,

                            -- Audit
                            data_insert                     TIMESTAMPTZ NOT NULL DEFAULT now(),
                            user_insert                     TEXT NOT NULL DEFAULT CURRENT_USER,
                            data_update                     TIMESTAMPTZ NOT NULL DEFAULT now(),
                            user_update                     TEXT NOT NULL DEFAULT CURRENT_USER,
                            tx_id                           UUID,

                            -- Unicita: un solo componente BoM per eccezione
                            CONSTRAINT uq_oce_comp_eccezione_art_comp
                                UNIQUE (eccezione_offerta_id, articolo_componente_id)
                        );

                        -- Indice principale sul FK padre (performance JOIN eccezione→componenti)
                        CREATE INDEX ix_vendite_oce_comp_eccezione
                            ON vendite.offerte_commerciali_eccezioni_componenti (eccezione_offerta_id);

                        -- Indice sull'articolo_componente_id (lookup BoM)
                        CREATE INDEX ix_vendite_oce_comp_art_comp
                            ON vendite.offerte_commerciali_eccezioni_componenti (articolo_componente_id);

                        -- Indice sul componente_id (lookup articolo componente diretto)
                        CREATE INDEX ix_vendite_oce_comp_componente
                            ON vendite.offerte_commerciali_eccezioni_componenti (componente_id);

                        -- Indice parziale su stato_approvazione_prezzo (solo righe valorizzate)
                        CREATE INDEX ix_vendite_oce_comp_stato_appr
                            ON vendite.offerte_commerciali_eccezioni_componenti (stato_approvazione_prezzo)
                            WHERE stato_approvazione_prezzo IS NOT NULL;

                        COMMENT ON TABLE vendite.offerte_commerciali_eccezioni_componenti IS
                            'Componenti BoM CASO A per eccezioni offerta commerciale. '
                            'Mirror strutturale di contratti_righe_componenti: eccezione_offerta_id '
                            'al posto di riga_contratto_id. Stato approvazione prezzo trasportato '
                            'al push offerta→contratto. Trigger: guard_bom_coerenza, calcola_quantita, '
                            'ricalcola_padre, propaga_qta (sul padre), guard_pending. '
                            'Rev 2026-05-26.';

          rollback:
              - sql:
                    dbms: postgresql
                    sql: DROP TABLE IF EXISTS vendite.offerte_commerciali_eccezioni_componenti;
