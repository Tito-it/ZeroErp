databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260512-39-revert-contratti-righe-comp-prezzo-not-null-mctit.yaml

  - changeSet:
      id: 20260512-39-revert-contratti-righe-comp-prezzo-not-null
      author: mctit
      comment: Ripristina NOT NULL + CHECK <> 0 su contratti_righe_componenti.prezzo_unitario.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: contratti_righe_componenti
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.contratti_righe_componenti
                ALTER COLUMN prezzo_unitario SET NOT NULL;

              ALTER TABLE vendite.contratti_righe_componenti
                DROP CONSTRAINT chk_contrighe_comp_prezzo_nonneg;

              ALTER TABLE vendite.contratti_righe_componenti
                ADD CONSTRAINT chk_contrighe_comp_prezzo_nonneg
                CHECK (prezzo_unitario <> 0);
