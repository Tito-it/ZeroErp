# VENDITE.ATTIVITA_FATTURABILI.CHK_ATTIVITA_COMPETENZA_MESE_PRIMO: IL PRIMO DEL MESE DAL CALENDARIO
#   Brief: brief-db-mese-di-un-giorno, giro 4 (§6.4), D-1 (a) di Tid
#   (2026-11-15).
#
# ── COSA CAMBIA ─────────────────────────────────────────────────────
#   «competenza_mese e' il primo del mese» si scriveva
#   `(competenza_mese IS NULL) OR (EXTRACT(day FROM competenza_mese) = (1)::numeric)`;
#   diventa `competenza_mese = script.fn_mese_di(competenza_mese)`: la regola
#   del mese ha una sede sola, ed e' il motivo per cui fn_mese_di e' IMMUTABLE.
#   Stessa regola: un giorno e' il primo del suo mese se e solo se coincide
#   col primo del suo mese. NULL passa come prima (un CHECK NULL e'
#   soddisfatto), dove la colonna lo ammette.
#
# ── LA FORMA ────────────────────────────────────────────────────────
#   Stesso nome: chi lo legge da un 23514 (constraint_name nel log degli
#   errori, i pgTAP) non vede differenze. DROP e ADD nello stesso ALTER: la
#   tabella non resta mai senza vincolo, e la rivalidazione delle righe passa
#   per costruzione (il vincolo di prima garantiva la stessa cosa).
#   Ordine da zero (linee-guida-sql §11.14): il vincolo nasce nella prima
#   generazione o in un 00_schema piu' vecchio, fn_mese_di in 20261114-82;
#   00_schema e 20_code girano mescolati per numero, quindi qui esistono
#   tutti e due. Il CHECK registra la dipendenza da fn_mese_di in pg_depend:
#   la funzione non si toglie senza toglierlo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261115-27-alter-attivita-fatturabili-check-competenza-mese-dal-calendario-mctit.yaml

  - changeSet:
      id: 20261115-27-alter-attivita-fatturabili-check-competenza-mese-dal-calendario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.attivita_fatturabili.chk_attivita_competenza_mese_primo: il primo del mese da script.fn_mese_di invece che da
        EXTRACT(day), stessa regola, stesso nome. Brief: brief-db-mese-di-un-giorno, giro 4 (D-1).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: |
              SELECT (SELECT count(*) FROM pg_catalog.pg_constraint
                       WHERE conrelid = 'vendite.attivita_fatturabili'::regclass
                         AND conname = 'chk_attivita_competenza_mese_primo' AND contype = 'c')
                   + (SELECT count(*) FROM pg_catalog.pg_proc p
                        JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                       WHERE n.nspname = 'script' AND p.proname = 'fn_mese_di');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.attivita_fatturabili
                DROP CONSTRAINT chk_attivita_competenza_mese_primo,
                ADD CONSTRAINT chk_attivita_competenza_mese_primo
                  CHECK (competenza_mese = script.fn_mese_di(competenza_mese));

              COMMENT ON CONSTRAINT chk_attivita_competenza_mese_primo ON vendite.attivita_fatturabili
                IS 'competenza_mese e'' il primo giorno di un mese: coincide con script.fn_mese_di di se stessa. La regola del mese ha una sede sola, la funzione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE vendite.attivita_fatturabili
                DROP CONSTRAINT chk_attivita_competenza_mese_primo,
                ADD CONSTRAINT chk_attivita_competenza_mese_primo
                  CHECK ((competenza_mese IS NULL) OR (EXTRACT(day FROM competenza_mese) = (1)::numeric));
