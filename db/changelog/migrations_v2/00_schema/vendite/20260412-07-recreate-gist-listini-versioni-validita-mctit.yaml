# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: ricrea il vincolo EXCLUDE USING GIST
# per listini_versioni usando la colonna validita nativa
# al posto dell'espressione daterange(valido_dal, ...).
# Vedi: migrazione-daterange.md §4.5
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260412-07-recreate-gist-listini-versioni-validita-mctit.yaml

  - changeSet:
      id: 20260412-07-recreate-gist-listini-versioni-validita
      author: mctit
      comment: >
        Drop del vincolo EXCLUDE ex_listini_versioni_no_overlap (basato
        su espressione daterange calcolata al volo) e ricreazione sulla
        colonna nativa validita. Filtro invariato: attivo IS TRUE AND
        stato = 'ATTIVA'.
      changes:
        # Drop vecchio vincolo (espressione calcolata)
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.listini_versioni
                DROP CONSTRAINT IF EXISTS ex_listini_versioni_no_overlap;

        # Crea nuovo vincolo su colonna nativa validita
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.listini_versioni
                ADD CONSTRAINT ex_listini_versioni_no_overlap
                EXCLUDE USING gist (
                  listino_id WITH =,
                  validita WITH &&
                )
                WHERE (attivo IS TRUE AND stato = 'ATTIVA');

      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.listini_versioni
                DROP CONSTRAINT IF EXISTS ex_listini_versioni_no_overlap;
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.listini_versioni
                ADD CONSTRAINT ex_listini_versioni_no_overlap
                EXCLUDE USING gist (
                  listino_id WITH =,
                  daterange(valido_dal, COALESCE(valido_al, 'infinity'::date), '[]') WITH &&
                )
                WHERE (attivo IS TRUE AND stato = 'ATTIVA');
