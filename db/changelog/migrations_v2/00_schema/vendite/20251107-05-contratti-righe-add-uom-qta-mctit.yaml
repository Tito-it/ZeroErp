databaseChangeLog:
  - logicalFilePath: migrations_v2/20_vendite/20251105-05-contratti-righe-add-uom-qta-mctit.yaml

  - changeSet:
      id: 20251105-05-contratti-righe-add-uom-qta
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                schemaName: vendite
                tableName: contratti_righe
                columnName: factor_to_base

      changes:
        # Aggiungo il fattore di conversione snapshot usato al momento della riga DDT
        - addColumn:
            schemaName: vendite
            tableName: contratti_righe
            columns:
              - column:
                 name: qta_operativa
                 type: numeric(18,6)
                 remarks: "Quantità convertita nella UoM operativa articolo"
              - column: { name: uom_operativa_id, type: BIGINT, remarks: "Unità di misura operativa (catalogo.unita_misura.id)" }

              - column:
                  name: factor_to_base
                  type: numeric(18,6)
                  defaultValueNumeric: 1
                  remarks: "Snapshot del fattore UoM operativa → UoM base usato sulla riga al momento della generazione."
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: contratti_righe
            baseColumnNames: uom_operativa_id
            constraintName: fk_contratti_righe_uom_operativa_id
            referencedTableSchemaName: catalogo
            referencedTableName: unita_misura
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        # Commento esplicativo sulla colonna
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN vendite.contratti_righe.factor_to_base
              IS 'Snapshot del fattore di conversione dalla UoM operativa dell''articolo alla UoM base (catalogo.articoli_uom_operativa.factor_to_base) al momento della riga DDT.';
              COMMENT ON COLUMN vendite.contratti_righe.uom_operativa_id IS 'UoM dichiarata in riga attività (snapshot operativa).';
              COMMENT ON COLUMN vendite.contratti_righe.qta_operativa     IS 'Quantità nella UoM operativa; qta (base) calcolata via trigger.';

