# Slice RESI vendita — sequenza numerazione vendite.resi_numero_seq (brief §2.2).
#
# Sequenza dedicata per il numero reso, assegnato alla CONFERMA dal trigger
# vendite.trgfn_resi_gen_numero (20260713-25), fuori dal framework sistema_codici
# (usa_sequenza=false, mirror fatture/DDT). Le sequenze non rollano: eventuali
# gap da tx annullate sono normali e innocui (linee-guida-sql §5b).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260713-16-create-resi-numero-seq-mctit.yaml

  - changeSet:
      id: 20260713-16-create-resi-numero-seq
      author: mctit
      comment: >
        Crea la sequenza vendite.resi_numero_seq per la numerazione reso a
        CONFERMA (mirror vendite.ddt_numero_seq).
      preConditions:
        - onFail: HALT
        - not:
            - sequenceExists:
                schemaName: vendite
                sequenceName: resi_numero_seq
      changes:
        - createSequence:
            schemaName: vendite
            sequenceName: resi_numero_seq
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            schemaName: vendite
            sequenceName: resi_numero_seq
