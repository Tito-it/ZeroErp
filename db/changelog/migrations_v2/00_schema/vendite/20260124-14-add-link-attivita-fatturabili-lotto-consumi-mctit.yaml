databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260124-14-add-link-attivita-fatturabili-lotto-consumi-mctit.yaml

  - changeSet:
      id: 20260124-14-add-link-attivita-fatturabili-lotto-consumi
      author: mctit
      comment: "Collega attivita_fatturabili a lotto alimentazione e attivita_consumi"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: attivita_fatturabili
            columns:
              - column:
