                    nullable: true

              - column:
                  name: attivita_consumi_id
                  type: bigint
                  remarks: "FK -> vendite.attivita_consumi.id"
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: attivita_fatturabili
