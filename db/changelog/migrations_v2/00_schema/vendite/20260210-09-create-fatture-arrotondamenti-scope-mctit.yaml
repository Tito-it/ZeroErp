databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20260210-09-create-fatture-arrotondamenti-scope-mctit.yaml

    - changeSet:
          id: 20260210-09-create-fatture-arrotondamenti-scope
          author: mctit
          comment: "Tabella scope arrotondamenti fattura"
          changes:
              - createTable:
                    schemaName: vendite
                    tableName: fatture_arrotondamenti_scope
                    remarks: "Saldo arrotondamenti per scope di fatturazione (BA, utility, tipo doc, emittente, valuta)."
                    columns:
