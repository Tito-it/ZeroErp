                                  primaryKey: true
                                  primaryKeyName: pk_fatture_arrotondamenti_scope
                                  nullable: false

                        - column:
                              name: billing_account_id
                              type: BIGINT
                              constraints:
                                  nullable: false
                        - column:
                              name: utility_id
                              type: INTEGER
                              constraints:
                                  nullable: false
                        - column:
                              name: tipo_doc_fiscale_id
