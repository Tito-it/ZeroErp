# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# D3: backfill contratti.categoria_cliente_id_snapshot da
# billing_account.categoria_cliente_id. Eseguito PRIMA del trigger
# D2 (20260415-12 in 20_code) per evitare il blocco immutabilita'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260415-11-backfill-contratti-categoria-cliente-snapshot-mctit.yaml

  - changeSet:
      id: 20260415-11-backfill-contratti-categoria-cliente-snapshot
      author: mctit
      comment: >
        Backfill categoria_cliente_id_snapshot da BA per contratti
        esistenti. Idempotente (UPDATE WHERE IS NULL).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: contratti
            columnName: categoria_cliente_id_snapshot

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE vendite.contratti c
                 SET categoria_cliente_id_snapshot = ba.categoria_cliente_id
                FROM anagrafiche.billing_account ba
               WHERE ba.id = c.billing_account_id
                 AND c.categoria_cliente_id_snapshot IS NULL;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;
