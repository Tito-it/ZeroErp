databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260124-11-create-fatturazione-lotti-attivita-mctit.yaml

  - changeSet:
      id: 20260124-11-create-fatturazione-lotti-attivita
      author: mctit
      comment: "Lotti per alimentazione attivita_fatturabili"
      changes:
        - createTable:
            schemaName: vendite
            tableName: fatturazione_lotti_attivita
            remarks: "Batch di generazione attivita_fatturabili."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fatturazione_lotti_attivita
                    nullable: false

              - column:
                  name: lock_batch_id
                  type: uuid
                  defaultValueComputed: "uuidv7()"
                  remarks: "UUID univoco del lotto (lock)."
                  constraints:
                    nullable: false

              - column:
                  name: codice
                  type: character varying
                  remarks: "Codice lotto alimentazione."
                  constraints:
                    nullable: false

              - column:
                  name: competenza_mese
                  type: date
                  remarks: "Competenza mensile (YYYY-MM-01)."
                  constraints:
                    nullable: false

              - column:
                  name: utility_id
                  type: integer
                  remarks: "FK -> config.utilities.id (opzionale)."
                  constraints:
                    nullable: true

              - column:
                  name: billing_account_id
                  type: bigint
                  remarks: "FK -> anagrafiche.billing_account.id (opzionale)."
                  constraints:
                    nullable: true

              - column:
                  name: sorgente_tipo_id
                  type: bigint
                  remarks: "FK -> config.sorgenti.id (opzionale)."
                  constraints:
                    nullable: true

              - column:
                  name: stato_lotto
                  type: text
                  defaultValue: "IN_ESECUZIONE"
                  remarks: "Stato lotto (IN_ESECUZIONE|COMPLETATO|ERRORE)."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni."
                  constraints:
                    nullable: false

              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Abilita storicizzazione."
                  constraints:
                    nullable: false

              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction id (policy)."
                  constraints:
                    nullable: true

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente ultima modifica (audit)."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: vendite
            tableName: fatturazione_lotti_attivita
            columnNames: lock_batch_id
            constraintName: uq_fatturazione_lotti_attivita_lock_batch_id

        - addUniqueConstraint:
            schemaName: vendite
            tableName: fatturazione_lotti_attivita
            columnNames: codice
            constraintName: uq_fatturazione_lotti_attivita_codice

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti_attivita
            baseColumnNames: utility_id
            constraintName: fk_fatturazione_lotti_attivita_utility
            referencedTableSchemaName: config
            referencedTableName: utilities
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti_attivita
            baseColumnNames: billing_account_id
            constraintName: fk_fatturazione_lotti_attivita_ba
            referencedTableSchemaName: anagrafiche
            referencedTableName: billing_account
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti_attivita
            baseColumnNames: sorgente_tipo_id
            constraintName: fk_fatturazione_lotti_attivita_sorgente
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatturazione_lotti_attivita
                ADD CONSTRAINT chk_fatturazione_lotti_attivita_stato
                CHECK (stato_lotto IN ('IN_ESECUZIONE','COMPLETATO','ERRORE'));

              COMMENT ON TABLE vendite.fatturazione_lotti_attivita
                IS 'Batch di generazione attivita_fatturabili.';
