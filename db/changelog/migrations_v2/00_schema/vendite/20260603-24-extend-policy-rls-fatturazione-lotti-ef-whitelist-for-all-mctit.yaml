#
# Estende rls_fatturazione_lotti_ef_whitelist da FOR SELECT a FOR ALL aggiungendo WITH CHECK
# identico alla USING. Sblocca le scritture operatore dopo l'attivazione
# RLS: senza WITH CHECK ogni INSERT/UPDATE falliva con "new row violates
# row-level security policy". Nome policy invariato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260603-24-extend-policy-rls-fatturazione-lotti-ef-whitelist-for-all-mctit.yaml

  - changeSet:
      id: 20260603-24-extend-policy-rls-fatturazione-lotti-ef-whitelist-for-all
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Estende rls_fatturazione_lotti_ef_whitelist a FOR ALL con WITH CHECK = USING
        (fn_scope_ef_whitelist_via_sr su emittente_soggetto_ruolo_id, gate OPERATORE). Copre
        INSERT/UPDATE/DELETE oltre alla SELECT. Idempotente (DROP+CREATE).
      preConditions:
        - onFail: HALT
        - and:
          - columnExists: { schemaName: vendite, tableName: fatturazione_lotti, columnName: emittente_soggetto_ruolo_id }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                 WHERE n.nspname='script' AND p.proname='fn_scope_ef_whitelist_via_sr';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP POLICY IF EXISTS rls_fatturazione_lotti_ef_whitelist ON vendite.fatturazione_lotti;

              CREATE POLICY rls_fatturazione_lotti_ef_whitelist ON vendite.fatturazione_lotti
                  AS PERMISSIVE
                  FOR ALL
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_sr(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_soggetto_ruolo_id
                      )
                  )
                  WITH CHECK (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_sr(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_soggetto_ruolo_id
                      )
                  );

              COMMENT ON POLICY rls_fatturazione_lotti_ef_whitelist ON vendite.fatturazione_lotti IS
                  'RLS operatore: vede/scrive solo righe con emittente in whitelist '
                  '(fn_scope_ef_whitelist_via_sr). FOR ALL, WITH CHECK = USING.';
      rollback:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP POLICY IF EXISTS rls_fatturazione_lotti_ef_whitelist ON vendite.fatturazione_lotti;
              CREATE POLICY rls_fatturazione_lotti_ef_whitelist ON vendite.fatturazione_lotti
                  AS PERMISSIVE
                  FOR SELECT
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_sr(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_soggetto_ruolo_id
                      )
                  );
