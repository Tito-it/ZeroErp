databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260512-40-revert-preventivi-ordini-righe-prezzo-not-null-mctit.yaml

  - changeSet:
      id: 20260512-40-revert-preventivi-righe-prezzo-not-null
      author: mctit
      comment: Ripristina NOT NULL su preventivi_righe.prezzo_unitario (reverte 20260512-06).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: preventivi_righe
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.preventivi_righe
                ALTER COLUMN prezzo_unitario SET NOT NULL;

  - changeSet:
      id: 20260512-40-revert-ordini-righe-prezzo-not-null
      author: mctit
      comment: Ripristina NOT NULL su ordini_righe.prezzo_unitario (reverte 20260512-07).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: ordini_righe
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.ordini_righe
                ALTER COLUMN prezzo_unitario SET NOT NULL;
