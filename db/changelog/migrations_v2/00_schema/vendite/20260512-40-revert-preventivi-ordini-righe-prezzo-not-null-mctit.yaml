# ROLLBACK opzione A relaxed — ripristina NOT NULL su
# preventivi_righe.prezzo_unitario e ordini_righe.prezzo_unitario.
# Reverte 20260512-06 e 20260512-07.
# ddt_righe e contratti_righe erano gia' nullable: invariati.
