# UN NUMERO CHE NON E' UN NUMERO NON SI SCRIVE — schema vendite
#   CHECK «finito» su 114 colonne numeric di 38 tabelle:
#     vendite.attivita_consumi: consumo_totale
#     vendite.attivita_fatturabili: factor_to_base, prezzo_base_snapshot, prezzo_unitario, qta_operativa, quantita, valore_variazione_applicata
#     vendite.commesse_attivita: factor_to_base, prezzo_base_snapshot, prezzo_snapshot, qta_operativa, quantita, valore_variazione_applicata
#     vendite.contratti: valore_variazione_globale
#     vendite.contratti_righe: factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.contratti_righe_componenti: coeff_qta_snapshot, factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.contratti_utilities: param_1_num
#     vendite.ddt: peso_lordo, peso_netto, volume
#     vendite.ddt_righe: factor_to_base, prezzo_unitario, qta_operativa, quantita, sconto_percentuale
#     vendite.ddt_righe_componenti: coeff_qta_snapshot, factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.ddt_righe_prelievi: qta
#     vendite.fatture: arrotondamento_attuale, arrotondamento_precedente, bollo_importo, imponibile_tot, imposta_tot, tasso_cambio, totale_a_pagare, totale_doc
#     vendite.fatture_arrotondamenti_scope: saldo_arrotondamento
#     vendite.fatture_fondi_fattura: importo
#     vendite.fatture_fondi_fattura_source: importo
#     vendite.fatture_riepiloghi_iva: aliquota_iva, arrotondamento, imponibile, imposta
#     vendite.fatture_righe: aliquota_iva, imponibile_riga, kit_qta, prezzo_unitario, qta, sconto_percentuale
#     vendite.fatture_scadenze: importo
#     vendite.listini_righe: prezzo
#     vendite.listini_righe_componenti: prezzo
#     vendite.offerte_commerciali: valore_variazione_globale
#     vendite.offerte_commerciali_eccezioni: factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.offerte_commerciali_eccezioni_componenti: coeff_qta_snapshot, factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.offerte_commerciali_utilities: param_1_num
#     vendite.ordini: imponibile_tot, iva_tot, sconto_tot, tasso_cambio, totale_doc
#     vendite.ordini_righe: factor_to_base, prezzo_unitario, qta_operativa, quantita, sconto_percentuale
#     vendite.ordini_righe_componenti: coeff_qta_snapshot, factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.ordini_righe_fulfillment: qta_evasa
#     vendite.preventivi: totale_documento, totale_imponibile, totale_iva
#     vendite.preventivi_riepiloghi_iva: arrotondamento, imponibile, imposta
#     vendite.preventivi_righe: factor_to_base, prezzo_unitario, qta_operativa, quantita, sconto_percentuale
#     vendite.preventivi_righe_componenti: coeff_qta_snapshot, factor_to_base, prezzo_unitario, qta_operativa, quantita
#     vendite.promo_articoli: valore_variazione
#     vendite.resi_righe: factor_to_base, qta_operativa, quantita
#     vendite.resi_righe_accrediti: qta, qta_partita
#     vendite.resi_righe_riconsegne: qta
#     vendite.resi_righe_rientri: qta
#     vendite.resi_righe_rinunce: qta
#   Brief: brief-db-valore-numerico-non-finito-nei-documenti (§5.2, D-1 e D-2 di Tid)
#
# -- PERCHE' --------------------------------------------------------
#   Il tipo numeric ammette 'NaN' (con o senza scala) e 'Infinity' /
#   '-Infinity' (solo senza scala). Nessuno dei tre e' una quantita', un
#   prezzo o un importo, e il NaN contagia: una somma con un NaN e' NaN, e
#   NaN e' maggiore di ogni numero, quindi passa i CHECK di segno (>= 0) e
#   risponde «si'» a ogni confronto con una soglia. La regola e' del TIPO,
#   non dei documenti: vale per ogni colonna numeric del modello (D-2).
#
# -- LA FORMA -------------------------------------------------------
#   Un CHECK per colonna, sempre lo stesso predicato:
#     col > '-Infinity'::numeric AND col < 'Infinity'::numeric
#   falso su NaN, Infinity e -Infinity, vero su ogni numero; il NULL passa
#   come in ogni CHECK. Nome chk_<tabella>_<colonna>_finito.
#   ⚠️ Su offerte_commerciali_eccezioni_componenti il nome usa l'abbreviazione
#   di casa «oce_comp» (come chk_oce_comp_quantita_nz): per esteso supera
#   i 63 caratteri e PostgreSQL lo troncherebbe.
#   Un CHECK e non un guard (D-1): chi scrive un NaN e' un chiamante rotto,
#   non una persona da un form, e la violazione esce 23514 col nome del
#   vincolo: un errore tecnico, giusto per un guasto.
#   ⭐ Una colonna numeric nuova nasce col suo CHECK: lo pretende il presidio
#   db/pgtap/dbops/test-numerici-finiti-v1.sql.
#
# -- LE RIGHE GIA' SCRITTE -----------------------------------------
#   La preCondition pretende zero valori non finiti (expectedResult 0: un DB
#   da zero la soddisfa, linee-guida-sql §11.4), come il 20261008-85. Se ce
#   ne sono il migrate si ferma e si guardano a mano: nessun valore scelto
#   dal migrate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261009-18-add-chk-numerici-finiti-vendite-mctit.yaml

  - changeSet:
