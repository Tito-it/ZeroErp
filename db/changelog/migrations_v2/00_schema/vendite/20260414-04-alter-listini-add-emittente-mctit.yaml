# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Aggiunge vendite.listini.emittente_soggetto_ruolo_id (nullable).
# Il backfill e il SET NOT NULL sono demandati ai changeSet 20260414-05/06.
# Pricing v5 - riferimento sviluppo-listini-v5.md
# sezione 3.1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260414-04-alter-listini-add-emittente-mctit.yaml

  - changeSet:
      id: 20260414-04-alter-listini-add-emittente
      author: mctit
      comment: >
        Aggiunge colonna emittente_soggetto_ruolo_id (nullable) con FK verso
        anagrafiche.soggetti_ruoli. L'emittente diventa dimensione del listino
        (non input del resolver): un listino vale per un solo emittente.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              schemaName: vendite
              tableName: listini
              columnName: emittente_soggetto_ruolo_id

      changes:
        - addColumn:
            schemaName: vendite
            tableName: listini
            columns:
              - column:
                  name: emittente_soggetto_ruolo_id
                  type: bigint
                  remarks: "FK -> anagrafiche.soggetti_ruoli.id (emittente fiscale del listino). Pricing v5."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: listini
            baseColumnNames: emittente_soggetto_ruolo_id
            constraintName: fk_listini_emittente_soggetto_ruolo
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti_ruoli
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: listini
            constraintName: fk_listini_emittente_soggetto_ruolo
        - dropColumn:
            schemaName: vendite
            tableName: listini
            columnName: emittente_soggetto_ruolo_id
