# Crea vendite.transizioni_stati_commessa: matrice delle transizioni
# ammesse tra stati della commessa.
#
# Chiude un buco di dominio: le commesse erano l'unica entita' del ciclo
# documentale vendite SENZA macchina di transizioni (preventivi/ordini/
# offerte/contratti la hanno). Conseguenza: la commessa nasceva in BOZZA
# e nessun percorso la portava a PRONTA_FATTURAZIONE -> ramo commessa->
# fattura dormiente. Prerequisito V9 di brief-db-pratica-preventivi.
#
# Collocazione in schema vendite (non config) perche' la tabella stati
# vive in vendite.stati_commessa (a differenza di preventivi/ordini, i cui
# stati sono in config.stati_doc_*). La tabella transizioni sta accanto
# alla sua tabella stati.
#
# Enforcement: vendite.trgfn_commesse_guard_transizione (20260607-02) legge
#   questa matrice (BEFORE UPDATE OF stato_commessa_id). Pattern identico a
#   trgfn_ordini_guard_transizione (20260605-10).
# Seed (11 righe) in 80_data/changelog/20260607-05.
#
# Dipendenza: vendite.stati_commessa (migration 20260226-01).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260607-01-create-transizioni-stati-commessa-mctit.yaml

  - changeSet:
      id: 20260607-01-create-transizioni-stati-commessa
      author: mctit
      comment: >
        Crea vendite.transizioni_stati_commessa: matrice transizioni stato
        commessa. Chiude il buco (commesse senza macchina transizioni ->
        ramo commessa->fattura dormiente). Simmetria con
        config.transizioni_stati_ordini / _preventivi, ma in schema vendite
        (accanto a vendite.stati_commessa). Enforcement:
        trgfn_commesse_guard_transizione (20260607-02). Seed in 20260607-05.
      preConditions:
        - onFail: HALT
        - and:
            - not:
                - tableExists:
                    schemaName: vendite
                    tableName: transizioni_stati_commessa
            - tableExists:
                schemaName: vendite
                tableName: stati_commessa
      changes:
        - createTable:
            schemaName: vendite
            tableName: transizioni_stati_commessa
            remarks: >-
              Matrice delle transizioni ammesse tra stati commessa. Letta dal
              trigger vendite.trgfn_commesse_guard_transizione per l'enforcement
              del grafo (BEFORE UPDATE OF stato_commessa_id) e, in futuro, da una
              fn_available_actions_commessa per i metadati UI. Pattern identico a
              config.transizioni_stati_ordini / _preventivi.
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transizioni_stati_commessa
                    nullable: false

              - column:
                  name: stato_da_id
                  type: bigint
                  remarks: "FK -> vendite.stati_commessa.id (stato origine)."
                  constraints:
                    nullable: false

              - column:
                  name: stato_a_id
                  type: bigint
                  remarks: "FK -> vendite.stati_commessa.id (stato destinazione)."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: >-
                    Se true, la transizione e' ammessa dal guard. Se false, riga
                    documentale (grafo) ma transizione bloccata.
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: >-
                    Metadati UI (action_key, label_key, severity, icon,
                    requires_confirm, outlined, manuale). manuale=false per
                    transizioni automatiche/di processo (escluse da una futura
                    available_actions). Per le manuali action_key+label_key sono
                    obbligatori (vedi ck_transizioni_stati_comm_meta_ui).
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: vendite
            tableName: transizioni_stati_commessa
            columnNames: stato_da_id, stato_a_id
            constraintName: uq_transizioni_stati_commessa

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: transizioni_stati_commessa
            baseColumnNames: stato_da_id
            constraintName: fk_tsc_da
            referencedTableSchemaName: vendite
            referencedTableName: stati_commessa
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: transizioni_stati_commessa
            baseColumnNames: stato_a_id
            constraintName: fk_tsc_a
            referencedTableSchemaName: vendite
            referencedTableName: stati_commessa
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.transizioni_stati_commessa
                ADD CONSTRAINT ck_transizioni_stati_comm_da_diverso_a
                CHECK (stato_da_id <> stato_a_id);

              -- Defense-in-depth: ogni transizione manuale deve avere i metadati
              -- minimi per renderizzare il pulsante (action_key + label_key).
              -- Le automatiche (manuale=false) ne sono esonerate. Simmetrico al
              -- guard meta-keys delle fn_available_actions_*.
              ALTER TABLE vendite.transizioni_stati_commessa
                ADD CONSTRAINT ck_transizioni_stati_comm_meta_ui
                CHECK (
                    COALESCE((meta->>'manuale')::boolean, true) = false
                    OR (meta ?? 'action_key' AND meta ?? 'label_key')
                );

              COMMENT ON TABLE vendite.transizioni_stati_commessa IS
                  'Matrice transizioni ammesse tra stati commessa. Grafo per '
                  'vendite.trgfn_commesse_guard_transizione (enforcement BEFORE '
                  'UPDATE OF stato_commessa_id). Salti diretti BOZZA/APERTA-> '
                  'PRONTA_FATTURAZIONE per il percorso push (commessa nata '
                  'confermata dal preventivo accettato). rev 2026-06-07.';

      rollback:
        - dropTable:
            schemaName: vendite
            tableName: transizioni_stati_commessa
