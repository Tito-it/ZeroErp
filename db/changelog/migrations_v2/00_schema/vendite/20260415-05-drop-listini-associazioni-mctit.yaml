# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Drop tabella vendite.listini_associazioni.
#
# Sostituita nel pricing v5 da:
#   - anagrafiche.categorie_clienti_listini (matrice categoria -> listino)
#   - vendite.contratti.listino_id (contratto individuale)
#
# CASCADE rimuove anche il trigger trgfn_listini_associazioni_set_validita
# e ogni FK/index residuo. Backend e frontend non leggono piu' la tabella.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260415-05-drop-listini-associazioni-mctit.yaml

  - changeSet:
      id: 20260415-05-drop-listini-associazioni
      author: mctit
      comment: Drop vendite.listini_associazioni (cleanup pricing v5).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS vendite.listini_associazioni CASCADE;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Rollback non disponibile: la tabella aveva uno schema complesso
              -- con FK, EXCLUDE, trigger; i dati sono persi.
              SELECT 1;
