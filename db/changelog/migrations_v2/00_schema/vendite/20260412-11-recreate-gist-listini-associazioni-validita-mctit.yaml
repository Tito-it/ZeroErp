# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: ricrea il vincolo EXCLUDE USING GIST
# per listini_associazioni usando la colonna validita nativa.
# Vedi: migrazione-daterange.md §4.5
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260412-11-recreate-gist-listini-associazioni-validita-mctit.yaml

  - changeSet:
      id: 20260412-11-recreate-gist-listini-associazioni-validita
      author: mctit
      comment: >
        Drop del vincolo EXCLUDE ex_listini_associazioni_no_overlap (basato
        su espressione daterange calcolata al volo) e ricreazione sulla
        colonna nativa validita. Filtro invariato: attivo IS TRUE.
        Chiavi con COALESCE per gestione NULL come sentinel.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.listini_associazioni
                DROP CONSTRAINT IF EXISTS ex_listini_associazioni_no_overlap;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.listini_associazioni
                ADD CONSTRAINT ex_listini_associazioni_no_overlap
                EXCLUDE USING gist (
                  COALESCE(billing_account_id, -1::bigint) WITH =,
                  COALESCE(utility_id, -1::integer) WITH =,
                  COALESCE(emittente_soggetto_ruolo_id, -1::bigint) WITH =,
                  validita WITH &&
                )
                WHERE (attivo IS TRUE);

      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.listini_associazioni
                DROP CONSTRAINT IF EXISTS ex_listini_associazioni_no_overlap;
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.listini_associazioni
                ADD CONSTRAINT ex_listini_associazioni_no_overlap
                EXCLUDE USING gist (
                  COALESCE(billing_account_id, (-1)::bigint) WITH =,
                  COALESCE(utility_id, '-1'::integer) WITH =,
                  COALESCE(emittente_soggetto_ruolo_id, (-1)::bigint) WITH =,
                  daterange(valido_dal, COALESCE(valido_al, 'infinity'::date), '[]'::text) WITH &&
                )
                WHERE (attivo IS TRUE);
