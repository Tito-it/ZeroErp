databaseChangeLog:
  
  - logicalFilePath: migrations_v2/00_schema/vendite/20251106-02-drop-col-preventivi-righe-uom_id-mctit.yaml

  
  - changeSet:
      id: 20251106-02-drop-col-preventivi-righe-uom_id
      author: mctit
      preConditions:
        - onFail: CONTINUE
        - tableExists:
            schemaName: vendite
            tableName: preventivi_righe
        - columnExists:
            schemaName: vendite
            tableName: preventivi_righe
            columnName: uom_id

      changes:

        - sql:
            splitStatements: false
            stripComments: true
            sql: |

                  ALTER TABLE IF EXISTS 
                  vendite.preventivi_righe 
                  DROP CONSTRAINT IF EXISTS 
                  fk_preventivi_vendita_r_uom_id;


        - dropColumn:
            schemaName: vendite
            tableName: preventivi_righe
            columns:
              - column:
                  name: uom_id