# DB-12 (prima parte) — IL CATALOGO SMETTE DI PROMETTERE TRE COSE
#   chk_registri_fatturazione_reset -> solo 'ANNUALE'
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §2 e §4 DB-12
#   Decisione 2 di Tid (2026-08-25)
#
# ── IL PROBLEMA ─────────────────────────────────────────────────────
#   `reset_policy` ammetteva `NESSUNA | ANNUALE | MENSILE`, e ne implementava
#   **una**. Misurato il 2026-08-25:
#     · e' letta in due sole funzioni, e **solo** per calcolare il `mese` del
#       `RETURNS TABLE`;
#     · quel `mese` non lo legge nessuno (il backend drena il result set, i
#       pgTAP leggono per nome di colonna), e non c'e' una sola occorrenza di
#       `reset_policy` in `backend/` o in `frontend/`;
#     · `fn_get_anno_registro(p_data)` non riceve nemmeno il registro: torna
#       sempre l'anno solare, e la chiave del contatore porta `mese = 0` fisso.
#
#   Quindi `NESSUNA` si comporta **come `ANNUALE`** (riparte lo stesso a
#   gennaio) e `MENSILE` pure. ⛔ Un catalogo che promette tre comportamenti e ne
#   fa uno e' peggio di un catalogo con una voce sola: prima o poi qualcuno
#   sceglie `MENSILE` e si aspetta che funzioni — e siccome `uq_fatture_numero`
#   non contiene il mese, un'implementazione a meta' finirebbe in violazione di
#   UNIQUE.
#
# ── ✅ NESSUNA BONIFICA DATI ────────────────────────────────────────
#   Misurato: **tutti e 6** i registri sono gia' `ANNUALE`, e il DEFAULT di
#   colonna era gia' `'ANNUALE'`. Il CHECK si restringe su dati che lo
#   rispettano gia'.
#
# ── ℹ️ LA COLONNA `mese` DEL CONTATORE RESTA ────────────────────────
#   Domanda D-1 del brief, risposta: si lascia. Toglierla vorrebbe dire rifare
#   `uq_regprog_key`, `uq_registri_progressivi_scope`, il CHECK
#   `chk_regprog_mese_valid` e il corpo di `fn_get_next_progressivo` per due
#   byte — e il giorno in cui `MENSILE` servisse davvero la chiave c'e' gia'.
#   Il suo `COMMENT` dice che e' ferma a 0.
#
# ── ⚠️ SE UN GIORNO SERVE `MENSILE` ─────────────────────────────────
#   Non basta riaprire questo CHECK: serve il mese **nel contatore** (c'e' gia')
#   **e nella UNIQUE `uq_fatture_numero`** (non c'e'), piu' un
#   `fn_get_anno_registro` che riceva il registro. §7 del brief.
#
# Dipendenze: nessuna.
# Verifica: db/pgtap/vendite/test-registri-progressivi.sql (DB-13)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260825-16-alter-chk-registri-fatturazione-reset-annuale-mctit.yaml

  - changeSet:
      id: 20260825-16-alter-chk-registri-fatturazione-reset-annuale
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-12: reset_policy si restringe ad ANNUALE. Il catalogo ne prometteva tre e ne
        implementava una — NESSUNA si comporta come ANNUALE e MENSILE pure, perche' la chiave
        del contatore porta mese = 0 fisso e uq_fatture_numero il mese non lo contiene. Un
        catalogo che promette tre comportamenti e ne fa uno e' peggio di uno con una voce sola:
        prima o poi qualcuno sceglie MENSILE, e un'implementazione a meta' finisce in
        violazione di UNIQUE. ✅ Nessuna bonifica: tutti e 6 i registri sono gia' ANNUALE e il
        default di colonna pure. ℹ️ La colonna mese del contatore RESTA (D-1): toglierla vuol
        dire rifare due UNIQUE, un CHECK e una funzione per due byte.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: reset_policy
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT COUNT(*) FROM vendite.registri_fatturazione
                   WHERE reset_policy <> 'ANNUALE';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE vendite.registri_fatturazione
                DROP CONSTRAINT IF EXISTS chk_registri_fatturazione_reset;

              ALTER TABLE vendite.registri_fatturazione
                ADD CONSTRAINT chk_registri_fatturazione_reset
                CHECK (reset_policy = 'ANNUALE');

              COMMENT ON COLUMN vendite.registri_fatturazione.reset_policy
                IS 'Quando il progressivo del sezionale riparte da 1. ⭐ rev 2026-08-25 (DB-12): UNA voce sola, ANNUALE. Prima il CHECK ammetteva anche NESSUNA e MENSILE, che erano DICHIARATE E NON IMPLEMENTATE — misurato il 2026-08-25: la colonna e'' letta in due sole funzioni e solo per calcolare il `mese` del RETURNS TABLE, quel mese non lo legge nessuno (il backend drena il result set), e non c''e'' una sola occorrenza di reset_policy in backend/ o frontend/. La chiave del contatore porta mese = 0 FISSO e fn_get_anno_registro non riceve nemmeno il registro, quindi NESSUNA si comportava come ANNUALE e MENSILE pure. ⛔ Un catalogo che promette tre comportamenti e ne fa uno e'' peggio di un catalogo con una voce sola: prima o poi qualcuno sceglie MENSILE e si aspetta che funzioni, e siccome uq_fatture_numero NON contiene il mese, un''implementazione a meta'' finirebbe in violazione di UNIQUE. ⚠️ Se un giorno MENSILE servisse davvero non basta riaprire questo CHECK: serve il mese nel contatore (c''e'' gia'') E in uq_fatture_numero (non c''e''), piu'' un fn_get_anno_registro che riceva il registro. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE vendite.registri_fatturazione
                DROP CONSTRAINT IF EXISTS chk_registri_fatturazione_reset;
              ALTER TABLE vendite.registri_fatturazione
                ADD CONSTRAINT chk_registri_fatturazione_reset
                CHECK (reset_policy IN ('NESSUNA', 'ANNUALE', 'MENSILE'));
