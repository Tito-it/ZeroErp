# ------------------------------------------------------------
# P-2 — I PRELIEVI: da quale lotto, seriale e scaffale esce una riga di bolla
#   vendite.ddt_righe_prelievi (+ policy RLS e accensione)
#   Brief: brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 3
#          (D-L3-b tabella figlia, D-L3-d sorgente del movimento; Tid 26 e 28-09)
#
# -- PERCHE' UNA TABELLA E NON SPEZZARE LA RIGA ---------------------------------------------------
#   La riga e' l'unita' COMMERCIALE (prezzo, IVA, legame all'ordine, reso,
#   fattura); il prelievo e' l'unita' FISICA. Trenta pezzi possono uscire venti
#   dal lotto A e dieci dal B: spezzare la riga moltiplicherebbe prezzo e
#   legame all'ordine.
#
# -- PERCHE' IL PRELIEVO E' LA SORGENTE DEL MOVIMENTO (D-L3-d) -------------------------------------
#   L'identita' del movimento (uq_mag_movimenti_identita) non contiene
#   l'articolo: con sorgente = riga, i due componenti senza lotto dello stesso
#   kit avrebbero la stessa identita'. Un prelievo = un movimento (due per la
#   bolla di trasferimento, distinti dalla causale): e' la condizione 1 di
#   carico/scarico §6, «la chiave la compone l'operazione, un record per tranche».
#   Sorgente a catalogo: DDT_VENDITA_PRELIEVO (80_data/sql/config/sorgenti.csv).
#
# -- LE COLONNE ----------------------------------------------------------------------------------
#   ddt_riga_componente_id: valorizzata quando a muoversi e' un COMPONENTE del
#   kit (D-L3-f: si muove cio' che e' gestito, al livello piu' alto). La
#   coerenza con la riga e col catalogo la fa il guard (20260928-70).
#   qta: UoM base, > 0 — il verso lo mette l'operazione (M-1).
#   ubicazione_arrivo_id: solo per la bolla di trasferimento; si compila anche
#   dopo l'emissione, fino al CONSEGNATO (eccezione nel guard).
#
# -- IL PERIMETRO -------------------------------------------------------------------------------
#   Satellite della riga: la policy rispecchia la veste unica della testata
#   (OPERATORE, FOR ALL con WITH CHECK), risalendo con
#   script.fn_scope_ef_whitelist_via_ddt_riga, come ddt_righe_componenti
#   (20260909-37). Accesa qui, nello stesso changeSet: una tabella nuova con FK
#   verso una tabella protetta, senza policy, fa rosso il presidio del
#   perimetro (vw_rls_perimetro_scoperto). ENABLE senza FORCE, come tutto il
#   progetto.
#
# -- ARRIVANO DA ci_apply --------------------------------------------------------------------------
#   audit, tx_id, storico e la coppia ATTIVO sui padri (require_attivo verso
#   ddt_righe, componenti, lotti, assets, ubicazioni; block_deact sui padri).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260928-62-create-table-ddt-righe-prelievi-mctit.yaml

  - changeSet:
      id: 20260928-62-create-table-ddt-righe-prelievi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE vendite.ddt_righe_prelievi: da quale lotto, seriale e ubicazione esce una
        riga di bolla (o un componente del suo kit), e per quale quantita'. E' la sorgente del
        movimento di magazzino (DDT_VENDITA_PRELIEVO). Policy RLS di satellite della riga
        (OPERATORE, FOR ALL con WITH CHECK) e RLS accesa. Brief:
        brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 3 (D-L3-b, D-L3-d).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: ddt_righe_componenti
            - tableExists:
                schemaName: magazzino
                tableName: lotti
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_scope_ef_whitelist_via_ddt_riga';
            - not:
                - tableExists:
                    schemaName: vendite
                    tableName: ddt_righe_prelievi
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE vendite.ddt_righe_prelievi (
                  id                      BIGINT GENERATED BY DEFAULT AS IDENTITY
                                          CONSTRAINT pk_ddt_righe_prelievi PRIMARY KEY,
                  ddt_riga_id             BIGINT       NOT NULL,
                  ddt_riga_componente_id  BIGINT,
                  qta                     NUMERIC      NOT NULL,
                  lotto_id                BIGINT,
                  asset_id                BIGINT,
                  ubicazione_id           BIGINT,
                  ubicazione_arrivo_id    BIGINT,
                  meta                    JSONB        NOT NULL DEFAULT '{}'::jsonb,
                  tx_id                   UUID,
                  storicizza              BOOLEAN      NOT NULL DEFAULT true,
                  data_insert             TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert             TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update             TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update             TEXT         DEFAULT CURRENT_USER,
                  -- Una riga che se ne va si porta via i suoi prelievi: la regola
                  -- «solo in bozza» l'ha gia' applicata il guard delle righe.
                  CONSTRAINT fk_ddt_righe_prelievi_riga
                      FOREIGN KEY (ddt_riga_id)
                      REFERENCES vendite.ddt_righe (id)
                      ON UPDATE CASCADE ON DELETE CASCADE,
                  CONSTRAINT fk_ddt_righe_prelievi_componente
                      FOREIGN KEY (ddt_riga_componente_id)
                      REFERENCES vendite.ddt_righe_componenti (id)
                      ON UPDATE CASCADE ON DELETE CASCADE,
                  CONSTRAINT fk_ddt_righe_prelievi_lotto
                      FOREIGN KEY (lotto_id)
                      REFERENCES magazzino.lotti (id)
                      ON UPDATE CASCADE ON DELETE NO ACTION,
                  CONSTRAINT fk_ddt_righe_prelievi_asset
                      FOREIGN KEY (asset_id)
                      REFERENCES magazzino.assets (id)
                      ON UPDATE CASCADE ON DELETE NO ACTION,
                  CONSTRAINT fk_ddt_righe_prelievi_ubicazione
                      FOREIGN KEY (ubicazione_id)
                      REFERENCES magazzino.ubicazioni (id)
                      ON UPDATE CASCADE ON DELETE NO ACTION,
                  CONSTRAINT fk_ddt_righe_prelievi_ubicazione_arrivo
                      FOREIGN KEY (ubicazione_arrivo_id)
                      REFERENCES magazzino.ubicazioni (id)
                      ON UPDATE CASCADE ON DELETE NO ACTION,
                  -- Il verso lo mette l'operazione (M-1): qui si dice QUANTO.
                  CONSTRAINT chk_ddt_righe_prelievi_qta_positiva
                      CHECK (qta > 0),
                  -- Un seriale e' UN pezzo (M-5 p.4), come sul registro.
                  CONSTRAINT chk_ddt_righe_prelievi_asset_qta_unitaria
                      CHECK (asset_id IS NULL OR qta = 1),
                  -- Una posizione fisica si preleva UNA volta per riga (o per
                  -- componente): due prelievi uguali sarebbero due movimenti con la
                  -- stessa identita', e il secondo lo rifiuterebbe il registro.
                  CONSTRAINT uq_ddt_righe_prelievi_posizione
                      UNIQUE NULLS NOT DISTINCT (ddt_riga_id, ddt_riga_componente_id,
                                                 lotto_id, asset_id, ubicazione_id)
              );

              COMMENT ON TABLE vendite.ddt_righe_prelievi IS
                  'I PRELIEVI di una riga di bolla: quanta merce esce da quale lotto, seriale '
                  'e ubicazione (D-L3-b). La riga e'' l''unita'' commerciale, il prelievo quella '
                  'fisica. E'' la SORGENTE del movimento di magazzino (DDT_VENDITA_PRELIEVO, '
                  'D-L3-d): un prelievo = uno scarico (due per la bolla di trasferimento, OUT '
                  'e IN). Se la riga e'' un kit con padre non gestito, a muoversi sono i '
                  'componenti gestiti e il prelievo nomina il componente (D-L3-f). Per la '
                  'merce semplice (niente lotto, seriale ne'' ubicazioni) il prelievo lo crea '
                  'da se'' il verbo all''emissione. Si scrive solo in bozza '
                  '(trgfn_ddt_righe_prelievi_guard), salvo ubicazione_arrivo_id di una bolla '
                  'di trasferimento. Brief: brief-db-magazzino-lotto-3-scarico-da-ddt.';
              COMMENT ON COLUMN vendite.ddt_righe_prelievi.ddt_riga_componente_id IS
                  'Il componente del kit che si muove, quando il padre della riga NON e'' '
                  'gestito a magazzino e il componente si'' (D-L3-f). NULL = si muove '
                  'l''articolo della riga. La coerenza la fa il guard.';
              COMMENT ON COLUMN vendite.ddt_righe_prelievi.qta IS
                  'Quantita'' prelevata, in UoM BASE (come ddt_righe.quantita), sempre '
                  'positiva: il verso lo mette l''operazione (M-1). La somma dei prelievi di '
                  'una riga (o di un componente) e'' la sua quantita'': lo controlla '
                  'script.fn_check_ddt_merce all''emissione.';
              COMMENT ON COLUMN vendite.ddt_righe_prelievi.ubicazione_id IS
                  'Ubicazione di PARTENZA, nel magazzino della bolla: obbligatoria o vietata '
                  'secondo magazzini.usa_ubicazioni (D-L2-m), controllato come per ogni '
                  'movimento da script.fn_check_riga_magazzino.';
              COMMENT ON COLUMN vendite.ddt_righe_prelievi.ubicazione_arrivo_id IS
                  'Solo per la bolla di trasferimento: l''ubicazione di ARRIVO nel magazzino '
                  'di arrivo, secondo il suo usa_ubicazioni. Si compila anche dopo '
                  'l''emissione, fino al CONSEGNATO (D-L3-c).';

              -- ---------- Il perimetro: satellite della riga (come ddt_righe_componenti) ----------
              CREATE POLICY rls_ddt_righe_prelievi_ef_whitelist
                  ON vendite.ddt_righe_prelievi
                  FOR ALL
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_ddt_riga(
                              NULLIF(current_setting('app.current_user_id', true), '')::integer,
                              ddt_riga_id)
                  )
                  WITH CHECK (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist_via_ddt_riga(
                              NULLIF(current_setting('app.current_user_id', true), '')::integer,
                              ddt_riga_id)
                  );

              ALTER TABLE vendite.ddt_righe_prelievi ENABLE ROW LEVEL SECURITY;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS storico.ddt_righe_prelievi;
              DROP TABLE IF EXISTS vendite.ddt_righe_prelievi;
