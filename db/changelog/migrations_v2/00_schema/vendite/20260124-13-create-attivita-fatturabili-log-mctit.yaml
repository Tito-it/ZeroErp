# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260124-13-create-attivita-fatturabili-log-mctit.yaml

  - changeSet:
      id: 20260124-13-create-attivita-fatturabili-log
      author: mctit
      comment: "Log processo alimentazione attivita_fatturabili"
      changes:
        - createTable:
            schemaName: vendite
            tableName: attivita_fatturabili_log
            remarks: "Log dedicato per processi di alimentazione attivita_fatturabili."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_attivita_fatturabili_log
                    nullable: false

              - column:
                  name: lotto_attivita_id
                  type: bigint
                  remarks: "FK -> vendite.fatturazione_lotti_attivita.id"
                  constraints:
                    nullable: true

              - column:
                  name: attivita_consumi_id
                  type: bigint
                  remarks: "FK -> vendite.attivita_consumi.id"
                  constraints:
                    nullable: true

              - column:
                  name: data_ora
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp evento."
                  constraints:
                    nullable: false

              - column:
                  name: messaggio
                  type: text
                  remarks: "Messaggio log."
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: character
                  defaultValue: "W"
                  remarks: "W=warning, C=critical."
                  constraints:
                    nullable: false

              - column:
                  name: disabilitato
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "TRUE se log disabilitato da operatore."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente ultima modifica (audit)."
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: attivita_fatturabili_log
            baseColumnNames: lotto_attivita_id
            constraintName: fk_attivita_fatturabili_log_lotto_attivita
            referencedTableSchemaName: vendite
            referencedTableName: fatturazione_lotti_attivita
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: attivita_fatturabili_log
            baseColumnNames: attivita_consumi_id
            constraintName: fk_attivita_fatturabili_log_attivita_consumi
            referencedTableSchemaName: vendite
            referencedTableName: attivita_consumi
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.attivita_fatturabili_log
                ADD CONSTRAINT chk_attivita_fatturabili_log_status
                CHECK (status IN ('W','C'));

              COMMENT ON TABLE vendite.attivita_fatturabili_log
                IS 'Log dedicato per processi di alimentazione attivita_fatturabili.';
