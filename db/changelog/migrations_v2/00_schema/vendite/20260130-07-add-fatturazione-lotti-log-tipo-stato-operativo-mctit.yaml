# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260130-07-add-fatturazione-lotti-log-tipo-stato-operativo-mctit.yaml

  - changeSet:
      id: 20260130-07-add-fatturazione-lotti-log-tipo-stato-operativo
      author: mctit
      comment: "Aggiunge tipo_lotto e stato_operativo al log lotti"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti_log
            columns:
              - column:
                  name: tipo_lotto
                  type: text
                  remarks: "Tipo lotto al momento del log (MASSIVO | GIORNALIERO)."
                  constraints:
                    nullable: true

              - column:
                  name: stato_operativo
                  type: text
                  remarks: "Stato operativo lotto al momento del log (APERTO | CHIUSO | ERRORE)."
                  constraints:
                    nullable: true

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatturazione_lotti_log
                ADD CONSTRAINT chk_fatturazione_lotti_log_stato_operativo
                CHECK (stato_operativo IN ('APERTO','CHIUSO','ERRORE'));

              ALTER TABLE vendite.fatturazione_lotti_log
                ADD CONSTRAINT chk_fatturazione_lotti_log_tipo_lotto
                CHECK (tipo_lotto IN ('MASSIVO','GIORNALIERO'));

  - changeSet:
      id: 20260130-07-02-update-fatturazione-lotti-log
      author: mctit
      comment: "Aggiunta campo tx_id"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti_log
            columns:
              - column:
                  name: tx_id
                  type: uuid
                  remarks: "ID della transazione"
                  constraints:
                    nullable: true
