# Liquibase changelog per Zero ERP
# Rinomina colonne valid_from/valid_to -> valido_dal/valido_al
# ------------------------------------------------------------

databaseChangeLog:
      - logicalFilePath: migrations_v2/00_schema/vendite/20260119-03-rename-contratti-valid-dal-al-mctit.yaml

      - changeSet:
              id: 20260119-03-rename-contratti-valid-dal-al
              author: mctit
              runAlways: false
              validCheckSum:
                    - ANY
              preConditions:
                    - onFail: MARK_RAN
                    - onError: MARK_RAN
                    - columnExists:
                            schemaName: vendite
                            tableName: contratti
                            columnName: valid_from
                    # - not:
                    #          - sqlCheck:
                    #                   expectedResult: 1
                    #                    sql: "SELECT 1 FROM pg_constraint WHERE conname = 'chk_contratti_validita'"
              changes:
                    - renameColumn:
                            schemaName: vendite
                            tableName: contratti
                            oldColumnName: valid_from
                            newColumnName: valido_dal
                            columnDataType: date
                    - renameColumn:
                            schemaName: vendite
                            tableName: contratti
                            oldColumnName: valid_to
                            newColumnName: valido_al
                            columnDataType: date

                    - sql:
                            dbms: postgresql
                            splitStatements: false
                            stripComments: false
                            sql: |
                                  ALTER TABLE vendite.contratti
                                  ADD CONSTRAINT chk_contratti_validita
                                  CHECK (valido_al IS NULL OR valido_al >= valido_dal);
