# CREATE TRIGGER trg_ddt_a10_guard_transizione_approvazione_upd
#   Binding trigger su vendite.ddt per la funzione
#   trgfn_ddt_guard_transizione_approvazione (20260512-21).
#   BEFORE UPDATE OF stato_doc_ddt_id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260512-22-create-trg-ddt-guard-transizione-approvazione-upd-mctit.yaml

  - changeSet:
      id: 20260512-22-create-trg-ddt-guard-transizione-approvazione-upd
      author: mctit
      comment: >
        Crea trigger trg_ddt_a10_guard_transizione_approvazione_upd su
        vendite.ddt: BEFORE UPDATE OF stato_doc_ddt_id, chiama
        trgfn_ddt_guard_transizione_approvazione.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: ddt
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT COUNT(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'trgfn_ddt_guard_transizione_approvazione'
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_a10_guard_transizione_approvazione_upd
                ON vendite.ddt;

              CREATE TRIGGER trg_ddt_a10_guard_transizione_approvazione_upd
                BEFORE UPDATE OF stato_doc_ddt_id
                ON vendite.ddt
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_ddt_guard_transizione_approvazione();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_a10_guard_transizione_approvazione_upd
                ON vendite.ddt;
