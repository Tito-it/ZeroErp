# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260124-02-update-fatturazione-lotti-stati-mctit.yaml

  - changeSet:
      id: 20260124-02-update-fatturazione-lotti-stati
      author: mctit
      comment: "Rinomina stato_job in stato_lotto e usa stato_doc_fiscale_id per i lotti"
      changes:
        - renameColumn:
            schemaName: vendite
            tableName: fatturazione_lotti
            oldColumnName: stato_job
            newColumnName: stato_lotto
            columnDataType: text

        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti
            columns:
              - column:
                  name: stato_doc_fiscale_id
                  type: bigint
                  remarks: "FK -> config.stati_doc_fiscale.id (stato lotto/documenti)."
                  constraints:
                    nullable: true

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE vendite.fatturazione_lotti fl
              SET stato_doc_fiscale_id = sd.id
              FROM config.stati_doc_fiscale sd
              WHERE sd.codice_interno = fl.stato_documenti
                 OR sd.codice = fl.stato_documenti;

              ALTER TABLE vendite.fatturazione_lotti
                DROP CONSTRAINT IF EXISTS chk_fatturazione_lotti_stato_documenti;

              ALTER TABLE vendite.fatturazione_lotti
                DROP COLUMN IF EXISTS stato_documenti;

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti
            baseColumnNames: stato_doc_fiscale_id
            constraintName: fk_fatturazione_lotti_stato_doc_fiscale
            referencedTableSchemaName: config
            referencedTableName: stati_doc_fiscale
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
