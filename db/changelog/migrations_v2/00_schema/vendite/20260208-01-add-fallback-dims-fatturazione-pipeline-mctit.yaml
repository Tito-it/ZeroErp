# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260208-01-add-fallback-dims-fatturazione-pipeline-mctit.yaml

  - changeSet:
      id: 20260208-01-add-fallback-dims-fatturazione-pipeline
      author: mctit
      comment: "Aggiunge dimensioni utility/tipo_doc_fiscale alla pipeline con fallback e anti-ambiguita`"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_pipeline
            columns:
              - column:
                  name: utility_id
                  type: integer
                  remarks: "Filtro opzionale pipeline per utility (fallback su NULL)."
                  constraints:
                    nullable: true
              - column:
                  name: tipo_doc_fiscale_id
                  type: bigint
                  remarks: "Filtro opzionale pipeline per tipo documento fiscale (fallback su NULL)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_pipeline
            baseColumnNames: utility_id
            constraintName: fk_fatturazione_pipeline_utility
            referencedTableSchemaName: config
            referencedTableName: utilities
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_pipeline
            baseColumnNames: tipo_doc_fiscale_id
            constraintName: fk_fatturazione_pipeline_tipo_doc_fiscale
            referencedTableSchemaName: config
            referencedTableName: tipi_doc_fiscale
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - dropUniqueConstraint:
            schemaName: vendite
            tableName: fatturazione_pipeline
            constraintName: uq_fatturazione_pipeline_tipo_stato

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Evitare ambiguita` di configurazione pipeline ai vari
              --   livelli di specificita` (utility/tipo_doc/fallback).
              --
              -- Regole:
              --   - una sola riga per combinazione specifica
              --   - livelli supportati:
              --       1) tipo_lotto + stato + utility + tipo_doc
              --       2) tipo_lotto + stato + utility
              --       3) tipo_lotto + stato + tipo_doc
              --       4) tipo_lotto + stato (fallback globale)
              -- =========================================================

              CREATE UNIQUE INDEX uq_fatt_pipeline_tipo_stato_utility_tipodoc
                ON vendite.fatturazione_pipeline (tipo_lotto, stato_doc_fiscale_id, utility_id, tipo_doc_fiscale_id)
               WHERE utility_id IS NOT NULL AND tipo_doc_fiscale_id IS NOT NULL;

              CREATE UNIQUE INDEX uq_fatt_pipeline_tipo_stato_utility
                ON vendite.fatturazione_pipeline (tipo_lotto, stato_doc_fiscale_id, utility_id)
               WHERE utility_id IS NOT NULL AND tipo_doc_fiscale_id IS NULL;

              CREATE UNIQUE INDEX uq_fatt_pipeline_tipo_stato_tipodoc
                ON vendite.fatturazione_pipeline (tipo_lotto, stato_doc_fiscale_id, tipo_doc_fiscale_id)
               WHERE utility_id IS NULL AND tipo_doc_fiscale_id IS NOT NULL;

              CREATE UNIQUE INDEX uq_fatt_pipeline_tipo_stato_fallback
                ON vendite.fatturazione_pipeline (tipo_lotto, stato_doc_fiscale_id)
               WHERE utility_id IS NULL AND tipo_doc_fiscale_id IS NULL;
