# ALTER vendite.ddt_righe_componenti — CHECK prezzo nullable.
# Stesso rationale di 20260512-08.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260512-10-alter-ddt-righe-comp-check-prezzo-nullable-mctit.yaml

  - changeSet:
      id: 20260512-10-alter-ddt-righe-comp-check-prezzo-nullable
      author: mctit
      comment: >
        Modifica CHECK chk_ddtrighe_comp_prezzo_nonneg su
        ddt_righe_componenti: ammette NULL (pending) ma non 0.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: ddt_righe_componenti
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.ddt_righe_componenti
                DROP CONSTRAINT chk_ddtrighe_comp_prezzo_nonneg;

              ALTER TABLE vendite.ddt_righe_componenti
                ADD CONSTRAINT chk_ddtrighe_comp_prezzo_nonneg
                CHECK (prezzo_unitario IS NULL OR prezzo_unitario <> 0);
