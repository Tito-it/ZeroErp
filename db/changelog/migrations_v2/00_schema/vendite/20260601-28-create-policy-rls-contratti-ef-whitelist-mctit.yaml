#
# Policy RLS dry-run EF_WHITELIST su vendite.contratti (convenzione PK).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260601-28-create-policy-rls-contratti-ef-whitelist-mctit.yaml

  - changeSet:
      id: 20260601-28-create-policy-rls-contratti-ef-whitelist
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Policy dry-run rls_contratti_ef_whitelist: operatore vede solo
        contratti con emittente_fiscale_id in whitelist (adapter PK
        fn_scope_ef_whitelist). Gate OPERATORE fail-closed. Non attiva
        finche' ENABLE (ondata 2).
      preConditions:
        - onFail: HALT
        - and:
          - columnExists: { schemaName: vendite, tableName: contratti, columnName: emittente_fiscale_id }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                 WHERE n.nspname='script' AND p.proname='fn_scope_ef_whitelist';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP POLICY IF EXISTS rls_contratti_ef_whitelist ON vendite.contratti;

              CREATE POLICY rls_contratti_ef_whitelist ON vendite.contratti
                  AS PERMISSIVE
                  FOR SELECT
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_fiscale_id
                      )
                  );

              COMMENT ON POLICY rls_contratti_ef_whitelist ON vendite.contratti IS
                  'RLS dry-run: operatore vede solo contratti con emittente in whitelist '
                  '(adapter PK fn_scope_ef_whitelist -> canonica). Non attiva finche ENABLE.';
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS rls_contratti_ef_whitelist ON vendite.contratti;
