databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260127-03-update-fatturazione-lotti-tipo-doc-fiscale-mctit.yaml

  - changeSet:
      id: 20260127-03-update-fatturazione-lotti-tipo-doc-fiscale
      author: mctit
      comment: "Sostituisce registro_id con tipo_doc_fiscale_id su fatturazione_lotti"
      changes:
        - dropForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti
            constraintName: fk_fatturazione_lotti_registro

        - dropColumn:
            schemaName: vendite
            tableName: fatturazione_lotti
            columnName: registro_id

        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti
            columns:
              - column:
                  name: tipo_doc_fiscale_id
                  type: bigint
                  remarks: "FK → config.tipi_doc_fiscale.id (tipo documento del lotto)."
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti
            baseColumnNames: tipo_doc_fiscale_id
            constraintName: fk_fatturazione_lotti_tipo_doc_fiscale
            referencedTableSchemaName: config
            referencedTableName: tipi_doc_fiscale
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
