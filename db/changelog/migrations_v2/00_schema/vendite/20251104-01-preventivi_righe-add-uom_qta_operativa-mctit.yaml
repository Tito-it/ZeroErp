databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20251104-01-preventivi_righe-add-uom_qta_operativa-mctit.yaml

  - changeSet:
      id: 20251104-01-preventivi_righe-add-uom_qta_operativa
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: vendite
              tableName: preventivi_righe
              columnName: qta_operativa  

      changes:
        - addColumn:
           schemaName: vendite
           tableName: preventivi_righe
           columns:
             - column:
                 name: qta_operativa
                 type: numeric(18,6)
                 remarks: "Quantità convertita nella UoM operativa articolo"
             - column: { name: uom_operativa_id, type: BIGINT, remarks: "Unità di misura operativa (catalogo.unita_misura.id)" }

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: preventivi_righe
            baseColumnNames: uom_operativa_id
            constraintName: fk_preventivi_vendita_r_uom_operativa
            referencedTableSchemaName: catalogo
            referencedTableName: unita_misura
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
      
        
        
       # - sql:
      #        splitStatements: false
     #         sql: |
     #             -- Check validità e valori ammessi
     #             ALTER TABLE vendite.preventivi_righe
     #             ADD CONSTRAINT check_preventivi_righe_qta_operativa_pos
     #             CHECK ( qta_operativa > 0);

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN vendite.preventivi_righe.uom_operativa_id IS 'UoM dichiarata in riga preventivo (snapshot operativa).';
              COMMENT ON COLUMN vendite.preventivi_righe.qta_operativa     IS 'Quantità nella UoM operativa; qta (base) calcolata via trigger.';

      
        - sql:
              splitStatements: false
              sql: |
                 ALTER TABLE IF EXISTS vendite.preventivi_righe 
                 DROP CONSTRAINT 
                 IF EXISTS fk_prevrighe_unita_misura;

  
        - dropColumn:
              schemaName: vendite
              tableName: preventivi_righe
              columns:
                - column:
                    name: unita_misura_id
          

  - changeSet:
      id: 20251105-03-preventivi_righe-add-uom_id
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: vendite
              tableName: preventivi_righe
              columnName: uom_id  

      changes:
        - addColumn:
           schemaName: vendite
           tableName: preventivi_righe
           columns:
             - column: { name: uom_id, type: BIGINT, remarks: "Unità di misura base riferita a qta (catalogo.unita_misura.id)" }

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: preventivi_righe
            baseColumnNames: uom_id
            constraintName: fk_preventivi_vendita_r_uom_id
            referencedTableSchemaName: catalogo
            referencedTableName: unita_misura
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
      