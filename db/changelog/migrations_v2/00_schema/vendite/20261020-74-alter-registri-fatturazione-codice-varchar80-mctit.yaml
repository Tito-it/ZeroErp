              CREATE VIEW vendite.vw_dash_competenza_attivita WITH (security_invoker=on) AS
              SELECT ca.competenza_mese,
                  co.id AS commessa_id,
                  (co.codice)::text AS commessa_codice,
                  ca.id AS commessa_attivita_id,
                  co.emittente_soggetto_ruolo_id,
                  s.ragione_sociale_completa AS cliente_display,
                  ca.articolo_id,
                  ca.data_attivita,
                  ca.quantita,
                  ca.stato_approvazione,
                  ca.stato_emissione,
                  st.stadio,
                  (COALESCE(ca.prezzo_snapshot, (0)::numeric) * ca.quantita) AS valore,
                  af.data_insert AS data_emissione,
                      CASE
                          WHEN (af.id IS NULL) THEN NULL::boolean
                          ELSE ((date_trunc('month'::text, (script.fn_giorno_operativo(af.data_insert))::timestamp without time zone))::date > ca.competenza_mese)
                      END AS emessa_in_ritardo,
                  af.sospesa,
                  af.posticipa_al,
                  f.id AS fattura_id,
                  af.fattura_riga_id,
                  f.anno AS fattura_anno,
                  f.serie AS fattura_serie,
                  f.numero AS fattura_numero,
                  sdf.codice_interno AS stato_fattura_codice_interno,
                  sdf.codice AS stato_fattura_codice,
                  (
                      CASE
                          WHEN (fr.id IS NULL) THEN NULL::numeric
                          WHEN (COALESCE(fr.qta, (0)::numeric) = (0)::numeric) THEN (0)::numeric
                          ELSE ((fr.imponibile_riga * af.quantita) / fr.qta)
                      END)::numeric(18,6) AS valore_fatturato,
                  COALESCE(f.critical, false) AS fattura_critical,
                  lf.lotto_id,
                  ca.sorgente_tipo_id,
                  ca.sorgente_uid,
                  ca.tipo_movimento,
                  vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) AS gruppo_key,
                  sc.emittibile AS commessa_emittibile,
                  sc.codice_interno AS commessa_stato_codice_interno,
                  COALESCE(sc.descrizione, sc.codice) AS commessa_stato_descrizione,
                  co.billing_account_id,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  reg.registro_id,
                  rf.codice AS registro_codice,
                  reg.politica_data_documento,
                      CASE
                          WHEN (reg.registro_id IS NOT NULL) THEN vendite.fn_calcola_data_documento(p_registro_id => reg.registro_id, p_competenza_mese => ca.competenza_mese, p_serie => reg.serie, p_data_dichiarata => NULL::date)
                          ELSE NULL::date
                      END AS data_documento_prevista,
                  af.id AS attivita_fatturabile_id,
                  COALESCE(af.lock_in_fatturazione, false) AS lock_in_fatturazione,
                  af.stato_esecuzione,
                  (
                      CASE
                          WHEN ((st.stadio)::text <> 'EMESSA_NON_FATTURATA'::text) THEN NULL::text
                          WHEN (af.id IS NULL) THEN 'SENZA_ATTIVITA_FATTURABILE'::text
                          WHEN (NOT COALESCE(af.lock_in_fatturazione, false)) THEN
                          CASE
                              WHEN (EXISTS ( SELECT 1
                                 FROM vendite.vw_lotti_fase lfase
                                WHERE ((lfase.lotto_id = fl.id) AND lfase.in_gioco))) THEN 'GIRO_IN_CORSO'::text
                              ELSE 'RESIDUO'::text
                          END
                          WHEN ((af.stato_esecuzione)::text IS DISTINCT FROM ('COMPLETED'::character varying)::text) THEN 'GIRO_IN_CORSO'::text
                          ELSE 'RESIDUO'::text
                      END)::character varying AS motivo_non_fatturata,
                  fl.id AS lotto_provenienza_id,
                  fl.codice AS lotto_provenienza_codice,
                  art.codice AS articolo_codice,
                  art.descrizione AS articolo_descrizione,
                  COALESCE(((cae.classe_emittibilita)::text = 'TRATTENUTA'::text), false) AS emissione_trattenuta,
                      CASE
                          WHEN ((cae.classe_emittibilita)::text = 'TRATTENUTA'::text) THEN cae.trattenuta_da_lotti
                          ELSE NULL::bigint[]
                      END AS emissione_trattenuta_da_lotti
                 FROM (((((((((((((((((((vendite.commesse co
                   JOIN vendite.stati_commessa sc ON ((sc.id = co.stato_commessa_id)))
                   JOIN vendite.commesse_attivita ca ON ((ca.commessa_id = co.id)))
                   LEFT JOIN vendite.attivita_fatturabili af ON ((af.commessa_attivita_id = ca.id)))
                   LEFT JOIN vendite.fatture_righe fr ON ((fr.id = af.fattura_riga_id)))
                   LEFT JOIN vendite.fatture f ON ((f.id = fr.fattura_id)))
                   LEFT JOIN config.stati_doc_fiscale sdf ON ((sdf.id = f.stato_doc_fiscale_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = co.billing_account_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = ba.soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = co.emittente_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                   LEFT JOIN LATERAL ( SELECT flf.lotto_id
                         FROM vendite.fatturazione_lotti_fatture flf
                        WHERE (flf.fattura_id = f.id)
                        ORDER BY flf.lotto_id DESC
                       LIMIT 1) lf ON (true))
                   LEFT JOIN LATERAL vendite.fn_resolve_registro_documento(p_billing_account_id_riga => co.billing_account_id, p_tipo_doc_fiscale_id => ca.tipo_doc_fiscale_id, p_natura_doc_id => ca.natura_doc_id) reg(ba_fatturazione_id, utility_id, emittente_soggetto_ruolo_id, registro_id, serie, politica_data_documento) ON ((af.fattura_riga_id IS NULL)))
                   LEFT JOIN vendite.registri_fatturazione rf ON ((rf.id = reg.registro_id)))
                   LEFT JOIN vendite.fatturazione_lotti fl ON ((fl.lock_batch_id = COALESCE(af.lock_batch_id, af.emit_batch_id))))
                   LEFT JOIN catalogo.articoli art ON ((art.id = ca.articolo_id)))
                   CROSS JOIN LATERAL ( SELECT (
                              CASE
                                  WHEN (((ca.stato_emissione)::text <> 'EMESSA'::text) AND ((ca.stato_approvazione)::text <> 'APPROVATA'::text)) THEN 'DA_APPROVARE'::text
                                  WHEN ((ca.stato_emissione)::text <> 'EMESSA'::text) THEN 'DA_EMETTERE'::text
                                  WHEN (af.fattura_riga_id IS NULL) THEN 'EMESSA_NON_FATTURATA'::text
                                  ELSE 'FATTURATA'::text
                              END)::character varying AS stadio) st)
                   CROSS JOIN LATERAL ( SELECT script.fn_get_emittenti_scope_sr_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS sr_ids) escope)
                   LEFT JOIN vendite.vw_commesse_attivita_emittibilita cae ON ((cae.commessa_attivita_id = ca.id)))
                WHERE (((escope.sr_ids IS NULL) OR (co.emittente_soggetto_ruolo_id = ANY (escope.sr_ids))) AND ((sc.codice_interno)::text <> 'ANNULLATA'::text) AND ((ca.stato_emissione)::text <> 'ANNULLATA'::text) AND (((ca.stato_approvazione)::text <> 'RIFIUTATA'::text) OR ((ca.stato_emissione)::text = 'EMESSA'::text)));

              COMMENT ON VIEW vendite.vw_dash_competenza_attivita IS
                'Lente 1 Competenza, grana ATTIVITA'': una riga per attivita'' di commessa con lo stadio del ciclo (DA_APPROVARE / DA_EMETTERE / EMESSA_NON_FATTURATA / FATTURATA), il valore, il collegamento a fattura e lotto e lo stato della commessa. Alimenta il drill-down commesse, che il backend AGGREGA per commessa. SCOPE EMITTENTE via fn_get_emittenti_scope_sr_ids(GUC): fail-closed. security_invoker=on. ⭐ Rev 2026-08-18 (R-4, brief perimetro-emittente Fase E): aggiunta in coda `emittente_ragione_sociale`. Il drill-down puo'' metterla nel GROUP BY in sicurezza: l''emittente e'' una colonna di vendite.commesse e commessa_id ne e'' la chiave primaria, quindi una commessa non puo'' avere attivita'' di emittenti diversi — l''emittente non sta sull''attivita''. La colonna nel GROUP BY serve comunque: su una colonna di VISTA PostgreSQL non deduce la dipendenza funzionale. ⚠️ Due catene distinte sulle stesse tabelle: sr/s sono il CLIENTE (via billing account), sr_ef/s_ef l''EMITTENTE. Scambiarle non darebbe nessun errore, solo un nome sbagliato a video. ⭐ Rev 2026-08-26 (L4, brief-db-registro-e-data-prevista-in-competenza): quattro colonne nuove in coda — registro_id, registro_codice, politica_data_documento, data_documento_prevista. Rispondono alle due domande che la schermata da cui si fattura non sapeva dire PRIMA di premere: su quale sezionale finira'' il documento, e che data portera''. ⭐ Il sezionale si risolve chiamando vendite.fn_resolve_registro_documento, cioe'' LA STESSA funzione che usa fn_build_fattura_key quando la fattura nasce davvero: la previsione e'' una lettura, non una profezia, e non puo'' divergere dal documento perche'' non e'' una seconda implementazione. ⚠️ Le si passa co.billing_account_id, il BA della RIGA: la funzione risale al padre da se'', e passarle il BA di fatturazione darebbe una previsione plausibile e sbagliata proprio sui BA con padre. ⛔ L''aggancio e'' CONDIZIONATO — ON (af.fattura_riga_id IS NULL), decisione D-9: dove il documento esiste gia'' la previsione non si fa, o la colonna mentirebbe al proprio nome. ⚠️ Il discriminante e'' la riga di fattura e non lo stadio: su EMESSA_NON_FATTURATA il documento non c''e'' ancora — e li'' finiscono le attivita'' rimaste orfane di una fattura eliminata, cioe'' lavoro da ri-emettere, per cui sapere dove finira'' e'' proprio l''informazione utile. ⛔ Il CASE sulla data e'' obbligatorio e non difensivo: fn_calcola_data_documento SOLLEVA su registro nullo, un CASE cortocircuita e un argomento no — senza, la prima riga con un sezionale non risolvibile farebbe morire l''intera lista. ⚠️ registro_codice viene da registri_fatturazione.codice, colonna MUTABILE: e'' display, l''alias e'' fedele alla sorgente (linee-guida-sql §6c) e quella tabella non espone codice_interno. Nessuna logica puo'' appoggiarcisi — chi filtra lo fa su registro_id. ℹ️ Costo dichiarato: due chiamate di funzione per riga su una vista che ne alimenta altre quattro. Tutta la catena e'' STABLE e le tabelle di configurazione lette non hanno RLS. ⭐ Rev 2026-08-26 (D-1, brief-db-residui-competenza-dimensione-e-chiave): otto colonne nuove in coda — attivita_fatturabile_id, lock_in_fatturazione, stato_esecuzione, motivo_non_fatturata, lotto_provenienza_id, lotto_provenienza_codice, articolo_codice, articolo_descrizione. ⛔ attivita_fatturabile_id e'' LA CHIAVE DEL VERBO: vendite.fn_riporta_attivita_da_emettere consuma vendite.attivita_fatturabili.id, e nessuna vista lo esponeva — il frontend non poteva chiamare la mutazione. Tradurre commessa_attivita_id -> af.id lato backend sarebbe stata una SECONDA IMPLEMENTAZIONE di un legame che il database conosce gia''. E'' un identificatore, non una colonna da mostrare. ⭐ motivo_non_fatturata e'' LA DIMENSIONE, a vocabolario chiuso di TRE valori e NULL fuori dallo stadio EMESSA_NON_FATTURATA: GIRO_IN_CORSO (lucchettata con stato_esecuzione diverso da COMPLETED — oppure, rev 2026-09-12, LIBERA col marchio di un lotto IN GIOCO: il transito fra pull e select), RESIDUO (lucchettata e COMPLETED senza riga di fattura — oppure libera col marchio di un lotto morto o senza marchio: la DIVERGENZA fra i due livelli, che nessun giro riprende. Sono le sole che il verbo tocca) e SENZA_ATTIVITA_FATTURABILE. ⛔ IN_ATTESA_LOTTO e'' RITIRATO (20260912-36): diceva «non lucchettata, il prossimo giro la prende da se''», ed e'' falso PER COSTRUZIONE dentro questo stadio — la riga di commessa e'' EMESSA, il pull non la vede e la select di un altro lotto non trova il suo marchio (brief-db-rilancio-step-non-rivede-le-proprie-commesse §10.4 e §11.3 C.2, 20260912-35). Un valore che la vista non puo'' produrre non sta nel vocabolario: teneva in vita un ramo morto, e la lista NASCONDEVA il verbo proprio sulle righe che nessun giro avrebbe ripreso. «In gioco» si legge da vendite.vw_lotti_fase, la sede unica, con un EXISTS valutato SOLO su quel ramo del CASE (una lettura per riga libera dello stadio, zero sulle altre). ⛔ Serve perche'' lo stadio guarda SOLO fattura_riga_id, e dentro EMESSA_NON_FATTURATA finiscono situazioni con RIMEDI OPPOSTI: due non chiedono nessuna azione, una si''. Un numero solo per rimedi opposti e'' la stessa ambiguita'' che il cantiere «il lavoro che non torna indietro» ha chiuso un livello piu'' in giu''. ⛔ E NON si spezza il valore EMESSA_NON_FATTURATA in due stadi: lo STADIO dice a che punto del ciclo e'' il lavoro, e le situazioni sono allo STESSO punto — cambia la loro salute, non il loro avanzamento. Si aggiunge la DIMENSIONE, come il 2026-08-20 si aggiunse tipo_movimento alla mensile invece di una colonna valore_rettifiche. ⛔ I rami sono, uno per uno, gli stessi di script.fn_check_attivita_riportabile_da_emettere (motivo 5, motivo 4 e «nessun motivo»; il motivo 3 — libera con la riga NON_EMESSA — sta fuori da questo stadio per costruzione): cambiarne uno qui senza cambiarlo li'' non produce nessun errore — la lista proporrebbe il verbo su una riga che la mutazione rifiuta, o lo nasconderebbe su una che accetta. Il presidio che lega le due superfici e'' db/pgtap/vendite/test-motivo-non-fatturata-v1.sql, con una fixture COSTRUITA per ciascun caso. ⛔ IS DISTINCT FROM ''COMPLETED'' e non <>: stato_esecuzione e'' NULLABLE e il CHECK ammette anche ERRORE, quindi con <> un lucchetto a NULL darebbe NULL e il CASE cadrebbe su RESIDUO dove la funzione dice E_ATTIVITA_IN_LAVORAZIONE. ERRORE finisce percio'' in GIRO_IN_CORSO, e il rimedio (aspettare che il lotto si chiuda) e'' lo stesso. ⭐ SENZA_ATTIVITA_FATTURABILE e'' il quarto valore: il modello AMMETTE una riga di commessa a EMESSA senza NESSUNA riga in attivita_fatturabili (il JOIN e'' LEFT, e il guard di DELETE ammette per progetto la cancellazione di una riga non fatturata). Senza un ramo suo il COALESCE la farebbe cadere su IN_ATTESA_LOTTO, cioe'' «il prossimo giro la prende» — falso, perche'' la pull filtra su stato_emissione e non la riprende mai piu''; e attivita_fatturabile_id sarebbe NULL, quindi il verbo non avrebbe nemmeno la chiave. Zero occorrenze non significa che il caso non esiste. ⛔ NON si usa `fatturato` come discriminante: dal 20260826-33 e'' una colonna GENERATA da fattura_riga_id, quindi dentro EMESSA_NON_FATTURATA e'' sempre falsa e non distingue niente. ⭐ lotto_provenienza_id/_codice rispondono a «da dove viene questo residuo», e NON sono lotto_id: quello nasce dalla catena della FATTURA e su un residuo la fattura non c''e''. Arrivano da vendite.fatturazione_lotti via COALESCE(lock_batch_id, emit_batch_id) — rev 2026-09-12: un residuo DIVERGENTE il lucchetto non ce l''ha, e la sua provenienza e'' il MARCHIO del giro (emit_batch_id), che e'' il lock_batch_id del lotto che l''ha presa in carico; per un''attivita'' lucchettata i due coincidono. La chiave sul lato lotti resta lock_batch_id, che li'' ha un UNIQUE — quindi il LEFT JOIN non puo'' moltiplicare righe. LEFT e non INNER perche'' fatturazione_lotti ha la RLS: un lotto fuori perimetro lascia le colonne a NULL e non fa sparire il residuo. lotto_provenienza_codice viene da codice, MUTABILE: e'' display (§6c) e nessuna logica puo'' appoggiarcisi. ⭐ articolo_codice/articolo_descrizione dicono CHE LAVORO E'': la vista esponeva il solo articolo_id, che e'' un UUID, e una lista di residui su cui si deve AGIRE senza il nome del lavoro non e'' azionabile. Il decode e'' lo stesso di vendite.fn_list_commessa_attivita (rev 2026-08-20), che lo fa un livello sopra sulla stessa colonna. LEFT anche se articolo_id e'' NOT NULL: un decode non deve poter far sparire la riga che sta decorando, e catalogo.articoli non ha RLS. ℹ️ I due JOIN nuovi NON li paga chi non li usa, e la ragione e'' STRUTTURALE: sono LEFT JOIN su chiavi con indice UNIQUE (uq_fatturazione_lotti_lock_batch_id, pk_articoli), quindi PostgreSQL puo'' PROVARE che non moltiplicano le righe e li elimina dal piano quando nessuna delle loro colonne e'' selezionata (left join removal). ⚠️ La condizione che regge tutto e'' il UNIQUE: togliendolo l''eliminazione smetterebbe di essere lecita e la vista comincerebbe a contare doppio — per questo e'' in preCondition e ha un test suo. ⭐ Lo STADIO si calcola UNA volta sola, nella CROSS JOIN LATERAL `st`, e serve sia la colonna stadio sia motivo_non_fatturata: quest''ultima e'' definita SOPRA lo stadio e in SQL un alias di SELECT non e'' riferibile da un''altra espressione della stessa SELECT. Ricopiare il CASE avrebbe messo la definizione dello stadio in DUE posti della stessa vista, dove divergere non produce nessun errore. Valore, nome e tipo della colonna stadio non cambiano.';

              GRANT SELECT, INSERT, UPDATE, DELETE ON vendite.vw_dash_competenza_attivita TO zeroerp_app;

              CREATE VIEW vendite.vw_dash_competenza_mensile WITH (security_invoker=on) AS
              SELECT competenza_mese,
                  stadio,
                  stato_fattura_codice_interno,
                  (count(*) FILTER (WHERE (NOT emissione_trattenuta)))::integer AS n_attivita,
                  COALESCE(sum(valore) FILTER (WHERE (NOT emissione_trattenuta)), (0)::numeric) AS valore_tot,
                  COALESCE(sum(valore_fatturato), (0)::numeric) AS valore_fatturato_tot,
                  (count(*) FILTER (WHERE emessa_in_ritardo))::integer AS n_in_ritardo,
                  COALESCE(sum(valore) FILTER (WHERE emessa_in_ritardo), (0)::numeric) AS valore_in_ritardo,
                  tipo_movimento,
                  motivo_non_fatturata,
                  (count(*) FILTER (WHERE emissione_trattenuta))::integer AS n_attivita_trattenute,
                  COALESCE(sum(valore) FILTER (WHERE emissione_trattenuta), (0)::numeric) AS valore_trattenuto
                 FROM vendite.vw_dash_competenza_attivita
                GROUP BY competenza_mese, stadio, stato_fattura_codice_interno, tipo_movimento, motivo_non_fatturata;

              COMMENT ON VIEW vendite.vw_dash_competenza_mensile IS
                'Lente 1 Competenza, aggregata in FORMATO LUNGO: una riga per (competenza_mese, stadio, stato fattura, tipo_movimento, motivo_non_fatturata). Il pivot alla griglia 12 mesi x 4 stadi e'' del service, non della vista. security_invoker=on: lo scope emittente arriva da vw_dash_competenza_attivita (GUC fail-closed) e va RI-SPECIFICATO a ogni REPLACE, perche'' la reloption non e'' visibile in pg_get_viewdef e verrebbe azzerata in silenzio. ⭐ Rev 2026-08-20 (richiesta BE, punto 3): `tipo_movimento` entra nel raggruppamento. Prima si perdeva qui, e il residuo del mese — che e'' una somma CON SEGNO — compensava le rettifiche con le fatture da emettere: agosto 2026 segnava 101% di copertura perche'' il residuo era −29,50, cioe'' due note di credito da emettere. Con una sola fattura da 29,50 in sospeso il residuo sarebbe andato a zero e la dashboard avrebbe detto «100%, niente da fare» con tre documenti da produrre: la compensazione NASCONDE LAVORO. ⭐ E non riguarda le sole rettifiche — a luglio 2026 ci sono 5.000 EUR di ONERI nello stesso totale: la somma mescolava tre cose di natura diversa, ed e'' il motivo per cui si aggiunge la DIMENSIONE e non una colonna `valore_rettifiche`, che avrebbe messo i valori dell''enum dentro la vista. 🔴 Cambia la CARDINALITA'': 7 righe -> 8 sul dato del 2026-08-20, unico bucket spezzato 2026-07 FATTURATA/EMESSA (NORMALE + ONERE). I totali del consumatore reggono perche'' il pivot accumula, ma il breakdown per stato documento fiscale elenca una voce per riga: senza adeguamento BE mostra EMESSA due volte. brief-design-note-credito-resi §40.2. ⭐ Rev 2026-08-26 (D-2, brief-db-residui-competenza-dimensione-e-chiave): `motivo_non_fatturata` entra nel raggruppamento, per la STESSA ragione e nella STESSA forma. Lo stadio EMESSA_NON_FATTURATA guarda solo fattura_riga_id, e dentro quel valore convivono situazioni con RIMEDI OPPOSTI: in attesa del proprio lotto (nessun rimedio, il prossimo giro la prende), dentro un giro vivo (nessun rimedio, si aspetta) e RESIDUO — l''unica su cui «Riporta da emettere» ha effetto. Un numero solo per rimedi opposti dice all''operatore che c''e'' qualcosa da fare quando non c''e'', o nasconde il lavoro vero dentro un transito sano. ⛔ Dimensione e NON una colonna `n_residui`: quella avrebbe costretto l''aggregata a conoscere il valore RESIDUO, cioe'' a cablare un elemento del vocabolario dentro una somma. La dimensione non conosce nessun valore: li porta. 🔴 E cambia di nuovo la CARDINALITA'': un bucket EMESSA_NON_FATTURATA che contiene piu'' situazioni si spezza in una riga per situazione. I totali reggono, il breakdown no — l''adeguamento BE/FE va fatto nello stesso giro. ⚠️ Il presidio di grana e'' il test 22 di db/pgtap/vendite/test-fn-list-commessa-attivita-provenienza-v1.sql, che confronta le righe della mensile col GROUP BY del dettaglio: cambiando la grana va portato sulla regola nuova, mai spento.';

              GRANT SELECT, INSERT, UPDATE, DELETE ON vendite.vw_dash_competenza_mensile TO zeroerp_app;
