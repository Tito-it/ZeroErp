# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — L2c-1 (a): registri_fatturazione.codice si allarga.
#   Brief: brief-db-grammatica-unica-documenti §13.3-bis (decisa da Tid il 2026-10-20, nel giro).
#
#   Il codice di un registro provvisionato e' <codice della famiglia>-<id dell'emittente>
#   (20261020-64): con i codici delle sorgenti non sta piu' in 16 caratteri. varchar(80): 50 del
#   codice della famiglia, il trattino, l'id. G-3: il vincolo si adegua al nome.
#
# -- LA FORMA ------------------------------------------------------------
#   * ALTER TYPE rifiuta una colonna letta da una vista, anche solo allargandola: si tolgono le
#     sei viste che leggono codice (le liste di ordini, DDT, fatture, scadenze, resi, e
#     vw_dash_competenza_attivita) e la vista che sta sopra l'ultima (vw_dash_competenza_mensile);
#     vw_dash_competenza_gruppi, l'altra sopra, e' gia' tolta dal 20261020-48. Tornano in 20_code
#     con la definizione viva, security_invoker e GRANT. Le colonne registro_codice delle liste
#     passano a varchar(80).
#   * Nessun trigger nomina codice in UPDATE OF; nessuna tabella storico ne porta una copia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261020-74-alter-registri-fatturazione-codice-varchar80-mctit.yaml

  - changeSet:
      id: 20261020-74-alter-registri-fatturazione-codice-varchar80
      author: mctit
      failOnError: true
      comment: >
        vendite.registri_fatturazione.codice da varchar(16) a varchar(80): il registro provvisionato
        porta il codice intero della famiglia. Toglie le sette viste che lo leggono (tornano in 20_code).
        Grammatica unica, L2c-1 (a).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "16"
            sql: >
              SELECT character_maximum_length FROM information_schema.columns
               WHERE table_schema = 'vendite' AND table_name = 'registri_fatturazione' AND column_name = 'codice'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Prima chi legge la colonna (pg_depend, catalogo vivo 2026-10-20): i dipendenti prima delle
              -- viste che leggono. vw_dash_competenza_gruppi e' gia' tolta dal 20261020-48. Tornano tutte in
              -- 20_code (20261020-75 ... -82). Senza CASCADE: un dipendente non censito ferma il migrate.
              DROP VIEW vendite.vw_dash_competenza_mensile;
              DROP VIEW vendite.vw_ordini_lista;
              DROP VIEW vendite.vw_ddt_lista;
              DROP VIEW vendite.vw_fatture_lista;
              DROP VIEW vendite.vw_fatture_scadenze_lista;
              DROP VIEW vendite.vw_resi_lista;
              DROP VIEW vendite.vw_dash_competenza_attivita;

              ALTER TABLE vendite.registri_fatturazione
                ALTER COLUMN codice TYPE character varying(80);

              COMMENT ON COLUMN vendite.registri_fatturazione.codice IS
                'Codice univoco registro (es. VEND-GESTORE, VEND-RESELLER-X) Rev 2026-10-20 (20261020-74, brief-db-grammatica-unica-documenti L2c-1): varchar(80) (era 16). Un registro che nasce dal provisioning si chiama <codice della famiglia>-<id dell''emittente> (vendite.fn_codice_registro_provisionato), e il codice della famiglia e'' quello della sua sorgente, fino a 50 caratteri. Resta un nome modificabile.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Le viste ricreate in 20_code le toglie il loro rollback, che gira prima di questo.
              ALTER TABLE vendite.registri_fatturazione
                ALTER COLUMN codice TYPE character varying(16);

              COMMENT ON COLUMN vendite.registri_fatturazione.codice IS
                'Codice univoco registro (es. VEND-GESTORE, VEND-RESELLER-X)';

              CREATE VIEW vendite.vw_ordini_lista WITH (security_invoker=on) AS
              SELECT o.id,
                  o.uid,
                  o.numero,
                  o.serie,
                  o.anno,
                  o.data,
                  o.stato_doc_ordine_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  o.soggetto_ruolo_id,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.imponibile_tot,
                  o.sconto_tot,
                  o.iva_tot,
                  o.totale_doc,
                  o.modalita_pagamento_id,
                  mp.codice AS modalita_pagamento_codice,
                  o.termine_pagamento_id,
                  tp.codice AS termine_pagamento_codice,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.tasso_cambio,
                  o.fatturazione_trigger,
                  o.canale_origine,
                  o.agente_soggetto_ruolo_id,
                  s_ag.ragione_sociale_completa AS agente_denominazione,
                  o.documento_origine_tipo,
                  o.documento_origine_id,
                      CASE o.documento_origine_tipo
                          WHEN 'PREVENTIVO'::text THEN pv.numero
                          WHEN 'OFFERTA_COMMERCIALE'::text THEN (oc.codice)::character varying
                          ELSE NULL::character varying
                      END AS documento_origine_codice,
                  o.data_insert,
                  o.user_insert,
                  o.data_update,
                  o.user_update,
                  sd.pdf_mode,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  pr.pratica_id,
                  pr.pratica_numero,
                  pr.n_pratiche,
                  dcr.data_consegna_richiesta_cliente_min,
                  reg.codice AS registro_codice,
                  reg.descrizione AS registro_descrizione
                 FROM ((((((((((((((((((vendite.ordini o
                   JOIN config.stati_doc_ordini sd ON ((sd.id = o.stato_doc_ordine_id)))
                   JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = o.soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = o.billing_account_id)))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = o.emittente_fiscale_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = ef.soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                   LEFT JOIN config.utilities u ON ((u.id = o.utility_id)))
                   LEFT JOIN config.modalita_pagamento mp ON ((mp.id = o.modalita_pagamento_id)))
                   LEFT JOIN config.termini_pagamento tp ON ((tp.id = o.termine_pagamento_id)))
                   LEFT JOIN config.valute v_val ON ((v_val.id = o.valuta_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ag ON ((sr_ag.id = o.agente_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ag ON ((s_ag.id = sr_ag.soggetto_id)))
                   LEFT JOIN vendite.preventivi pv ON (((pv.id = o.documento_origine_id) AND ((o.documento_origine_tipo)::text = 'PREVENTIVO'::text))))
                   LEFT JOIN vendite.offerte_commerciali oc ON (((oc.id = o.documento_origine_id) AND ((o.documento_origine_tipo)::text = 'OFFERTA_COMMERCIALE'::text))))
                   LEFT JOIN LATERAL pratiche.fn_pratica_del_documento(( SELECT so_pr.id
                         FROM config.sorgenti so_pr
                        WHERE (((so_pr.codice_interno)::text = 'ORDINE_VENDITA'::text) AND (so_pr.attivo IS TRUE))), (o.id)::text) pr(n_pratiche, pratica_id, pratica_numero) ON (true))
                   LEFT JOIN LATERAL ( SELECT min(orr.data_consegna_richiesta_cliente) AS data_consegna_richiesta_cliente_min
                         FROM vendite.ordini_righe orr
                        WHERE ((orr.ordine_id = o.id) AND (orr.attivo IS TRUE))) dcr ON (true))
                   LEFT JOIN vendite.registri_fatturazione reg ON ((reg.id = o.registro_id)));

              COMMENT ON VIEW vendite.vw_ordini_lista IS
                '⭐ rev 2026-10-11 (20261011-97, brief-db-lineage-seminata-per-chiave giro B): la vista non aggancia piu'' vw_documento_lineage. Le 8 colonne del grafo (frontiera_*, n_discendenti_attivi, is_transitato) le legge il backend da vendite.fn_documento_lineage_sintesi per le chiavi della pagina; la pratica resta, da pratiche.fn_pratica_del_documento. Vista canonica lista/dettaglio ordini vendita: testata + decodifiche denormalizzate (stato, cliente, billing/emittente/utility, pagamento, valuta, agente, documento origine) + pdf_mode (modalita'' bottone PDF per-riga, data-driven). Sola denormalizzazione: nessuno scope/filtro. security_invoker=on (RLS-ready). rev 2026-07-11: +pdf_mode. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da `config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql §6c vieta `codice_interno AS *_codice` perche'' il nome mentirebbe sulla sorgente — un consumatore che confronta contro un `*_codice` si aspetta la colonna MUTABILE. Il guardrail CI scripts/sql/check_naming_stato_codice.sql fallisce sul pattern. (2) arriva `frontiera_tipo_codice_interno`, il CODICE del tipo accanto al suo id: prima ogni consumatore se lo traduceva con lo stesso join a config.sorgenti — dieci copie scritte a mano nel backend, tutte fuori dalla portata del guardrail, che scansiona solo le viste. ⚠️ Il nome NON e'' `frontiera_tipo_codice`: quel valore e'' `config.sorgenti.codice_interno` e il FE lo usa per la chiave i18n e per instradare, cioe'' come LOGICA. Chiamarlo `*_codice` avrebbe spostato dieci mislabel nascosti dentro l''unico posto dove il guardrail li vede. ⭐ rev 2026-09-13 (P-6, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + data_consegna_richiesta_cliente_min, la prima data di consegna chiesta dal cliente sulle righe ATTIVE dell''ordine. E'' un min() calcolato dalle righe e non una colonna di testata, perche'' una colonna sarebbe una seconda sorgente di verita'' che va fuori sincrono al primo cambio di riga; il suffisso _cliente dice di chi e'' la data (D-16: non marcato = nostro, marcato = della controparte). NULL = nessuna riga attiva la dichiara. In ultima posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere. Serve la lista (ui.lista_colonna 746) e il drawer di testata, che leggono SELECT v.*. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.2, Q-E): + registro_codice, registro_descrizione in coda, LEFT JOIN vendite.registri_fatturazione su registro_id (20260831). E'' lo stesso blocco appeso a vw_fatture_lista nello stesso giro: le sorelle che un registro ce l''hanno — fatture, ddt, ordini, resi — lo espongono allo stesso modo, cosi'' chi scrive l''ottava copia non la copia da una vista senza. ⛔ contratti, preventivi e offerte NON hanno registro_id e non avranno queste colonne: non e'' una dimenticanza. Nessun numero_documento qui: su questa vista `numero` e'' gia'' il numero parlante (varchar). ⭐ rev 2026-10-19 (20261019-91, brief-db-grammatica-unica-documenti lotto 2b, G-3 di Tid): ricreata dopo l''allargamento della colonna; il codice di origine o di destinazione e'' quello di config.sorgenti (OFFERTA -> OFFERTA_COMMERCIALE, ORDINE -> ORDINE_VENDITA).';

              GRANT SELECT, INSERT, UPDATE, DELETE ON vendite.vw_ordini_lista TO zeroerp_app;

              CREATE VIEW vendite.vw_ddt_lista WITH (security_invoker=on) AS
              SELECT d.id,
                  d.uid,
                  d.numero,
                  d.serie,
                  d.anno,
                  d.data,
                  d.stato_doc_ddt_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  d.destinatario_soggetto_ruolo_id,
                  s_dest.id AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  d.mittente_soggetto_ruolo_id,
                  s_mitt.ragione_sociale_completa AS mittente_denominazione,
                  d.vettore_soggetto_ruolo_id,
                  s_vett.ragione_sociale_completa AS vettore_denominazione,
                  d.billing_account_id,
                  ba.codice AS ba_codice,
                  d.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  d.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  d.valuta_id,
                  v_val.codice AS valuta_codice,
                  d.causale_trasporto_id,
                  ct.codice AS causale_trasporto_codice,
                  ct.descrizione AS causale_trasporto_descrizione,
                  d.aspetto_bene_id,
                  ab.codice AS aspetto_bene_codice,
                  ab.descrizione AS aspetto_bene_descrizione,
                  d.modalita_addebito_trasporto_id,
                  mat.codice AS modalita_addebito_trasporto_codice,
                  d.num_colli,
                  d.peso_lordo,
                  d.peso_netto,
                  d.volume,
                  d.targa,
                  d.autista,
                  d.data_ora_partenza,
                  d.data_ora_consegna_prev,
                  d.tracking_code,
                  d.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  d.sorgente_uid,
                  o_src.id AS ordine_origine_id,
                  o_src.numero AS ordine_origine_numero,
                  d.data_insert,
                  d.user_insert,
                  d.data_update,
                  d.user_update,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  pr.pratica_id,
                  pr.pratica_numero,
                  pr.n_pratiche,
                  reg.codice AS registro_codice,
                  reg.descrizione AS registro_descrizione
                 FROM ((((((((((((((((((((vendite.ddt d
                   JOIN config.stati_doc_ddt sd ON ((sd.id = d.stato_doc_ddt_id)))
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON ((sr_dest.id = d.destinatario_soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s_dest ON ((s_dest.id = sr_dest.soggetto_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_mitt ON ((sr_mitt.id = d.mittente_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_mitt ON ((s_mitt.id = sr_mitt.soggetto_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_vett ON ((sr_vett.id = d.vettore_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_vett ON ((s_vett.id = sr_vett.soggetto_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = d.billing_account_id)))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = d.emittente_fiscale_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = ef.soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                   LEFT JOIN config.utilities u ON ((u.id = d.utility_id)))
                   LEFT JOIN config.valute v_val ON ((v_val.id = d.valuta_id)))
                   LEFT JOIN config.causali_trasporto ct ON ((ct.id = d.causale_trasporto_id)))
                   LEFT JOIN config.aspetti_beni ab ON ((ab.id = d.aspetto_bene_id)))
                   LEFT JOIN config.modalita_addebito_trasporto mat ON ((mat.id = d.modalita_addebito_trasporto_id)))
                   LEFT JOIN config.sorgenti src ON ((src.id = d.sorgente_tipo_id)))
                   LEFT JOIN vendite.ordini o_src ON (((o_src.uid = d.sorgente_uid) AND ((src.codice_interno)::text = 'ORDINE_VENDITA'::text))))
                   LEFT JOIN LATERAL pratiche.fn_pratica_del_documento(( SELECT so_pr.id
                         FROM config.sorgenti so_pr
                        WHERE (((so_pr.codice_interno)::text = 'DDT_VENDITA'::text) AND (so_pr.attivo IS TRUE))), (d.id)::text) pr(n_pratiche, pratica_id, pratica_numero) ON (true))
                   LEFT JOIN vendite.registri_fatturazione reg ON ((reg.id = d.registro_id)));

              COMMENT ON VIEW vendite.vw_ddt_lista IS
                '⭐ rev 2026-10-11 (20261011-97, brief-db-lineage-seminata-per-chiave giro B): la vista non aggancia piu'' vw_documento_lineage. Le 8 colonne del grafo (frontiera_*, n_discendenti_attivi, is_transitato) le legge il backend da vendite.fn_documento_lineage_sintesi per le chiavi della pagina; la pratica resta, da pratiche.fn_pratica_del_documento. Vista flat canonica e self-contained DDT per la lista UI. Nomi canonici. Destinatario via soggetto_ruolo diretto; mittente/vettore nullable. +emittente_fiscale_id/_codice (scope, §15). Campi trasporto per il PDF. Ordine di origine via sorgente_uid. security_invoker=on. Mirror vw_ordini_lista. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da `config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql §6c vieta `codice_interno AS *_codice` perche'' il nome mentirebbe sulla sorgente — un consumatore che confronta contro un `*_codice` si aspetta la colonna MUTABILE. Il guardrail CI scripts/sql/check_naming_stato_codice.sql fallisce sul pattern. (2) arriva `frontiera_tipo_codice_interno`, il CODICE del tipo accanto al suo id: prima ogni consumatore se lo traduceva con lo stesso join a config.sorgenti — dieci copie scritte a mano nel backend, tutte fuori dalla portata del guardrail, che scansiona solo le viste. ⚠️ Il nome NON e'' `frontiera_tipo_codice`: quel valore e'' `config.sorgenti.codice_interno` e il FE lo usa per la chiave i18n e per instradare, cioe'' come LOGICA. Chiamarlo `*_codice` avrebbe spostato dieci mislabel nascosti dentro l''unico posto dove il guardrail li vede. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.2, Q-E): + registro_codice, registro_descrizione in coda, LEFT JOIN vendite.registri_fatturazione su registro_id (20260831). E'' lo stesso blocco appeso a vw_fatture_lista nello stesso giro: le sorelle che un registro ce l''hanno — fatture, ddt, ordini, resi — lo espongono allo stesso modo, cosi'' chi scrive l''ottava copia non la copia da una vista senza. ⛔ contratti, preventivi e offerte NON hanno registro_id e non avranno queste colonne: non e'' una dimenticanza. Nessun numero_documento qui: su questa vista `numero` e'' gia'' il numero parlante (varchar).';

              GRANT SELECT, INSERT, UPDATE, DELETE ON vendite.vw_ddt_lista TO zeroerp_app;

              CREATE VIEW vendite.vw_fatture_lista WITH (security_invoker=on) AS
              SELECT f.id,
                  f.uid,
                  f.numero,
                  f.serie,
                  f.anno,
                  f.data,
                  f.registro_id,
                  f.stato_doc_fiscale_id,
                  sdf.codice_interno AS stato_codice_interno,
                  sdf.descrizione AS stato_descrizione,
                  sdf.fase,
                  f.tipo_doc_fiscale_id,
                  tdf.codice_interno AS tipo_doc_fiscale_codice_interno,
                  tdf.descrizione AS tipo_doc_fiscale_descrizione,
                  f.natura_doc_id,
                  ndf.codice_interno AS natura_doc_codice_interno,
                  ndf.descrizione AS natura_doc_descrizione,
                  f.billing_account_id,
                  ba.codice AS ba_codice,
                  s_cli.id AS soggetto_id,
                  s_cli.ragione_sociale_completa,
                  s_cli.id_fiscale_univoco_cf_piva,
                  f.emittente_soggetto_ruolo_id,
                  ef.id AS emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  f.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  f.valuta_id,
                  v_val.codice AS valuta_codice,
                  f.imponibile_tot,
                  f.imposta_tot,
                  f.totale_doc,
                  f.totale_a_pagare,
                  f.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  f.sorgente_uid,
                  f.data_insert,
                  f.user_insert,
                  f.data_update,
                  f.user_update,
                  pr.pratica_id,
                  pr.pratica_numero,
                  pr.n_pratiche,
                  vendite.fn_numero_documento_fattura(f.numero, f.serie) AS numero_documento,
                  reg.codice AS registro_codice,
                  reg.descrizione AS registro_descrizione
                 FROM ((((((((((((((vendite.fatture f
                   JOIN config.nature_doc_fiscale ndf ON ((ndf.id = f.natura_doc_id)))
                   LEFT JOIN config.stati_doc_fiscale sdf ON ((sdf.id = f.stato_doc_fiscale_id)))
