                   LEFT JOIN LATERAL pratiche.fn_pratica_del_documento(( SELECT so_pr.id
                         FROM config.sorgenti so_pr
                        WHERE (((so_pr.codice_interno)::text = 'FATTURA'::text) AND (so_pr.attivo IS TRUE))), (f.id)::text) pr(n_pratiche, pratica_id, pratica_numero) ON (true))
                   LEFT JOIN vendite.registri_fatturazione reg ON ((reg.id = f.registro_id)));

              COMMENT ON VIEW vendite.vw_fatture_lista IS
                '⭐ rev 2026-10-11 (20261011-97, brief-db-lineage-seminata-per-chiave giro B): la vista non aggancia piu'' vw_documento_lineage. Le 8 colonne del grafo (frontiera_*, n_discendenti_attivi, is_transitato) le legge il backend da vendite.fn_documento_lineage_sintesi per le chiavi della pagina; la pratica resta, da pratiche.fn_pratica_del_documento. Vista flat canonica e self-contained delle fatture di vendita per la lista UI — la settima sorella di vw_contratti/ddt/offerte_commerciali/ordini/preventivi/resi_lista, e l''ultimo documento del ciclo attivo che ne era privo. Nomi canonici gia'' noti al frontend: stato_codice_interno/stato_descrizione, ragione_sociale_completa, id_fiscale_univoco_cf_piva, ba_codice, utility_codice/utility_descrizione, emittente_ragione_sociale, soggetto_id. Cliente risolto via billing_account -> soggetto_ruolo -> soggetto (la fattura non porta un soggetto_ruolo cliente). emittente_fiscale_id DERIVATO da anagrafiche.emittenti_fiscali.soggetto_ruolo_id, che ha un vincolo di unicita'' (uq_emittenti_fiscali_ruolo): il join non moltiplica le righe. Importi coi nomi della tabella (imponibile_tot, imposta_tot, totale_doc, totale_a_pagare) perche'' fra le sorelle quel nome NON e'' canonico. ⛔ security_invoker=on: vendite.fatture ha la RLS (rls_fatture_ef_whitelist per l''operatore, rls_fatture_ba_ownership per il portale) ed e'' quella a dover mordere — la vista non filtra e non fa scope, denormalizza soltanto. ⛔ UN SOLO join interno, config.nature_doc_fiscale, e solo perche'' natura_doc_id e'' NOT NULL con FK; tutto il resto e'' LEFT. In particolare anagrafiche.billing_account, che ha una RLS propria risolta da fn_scope_ef_whitelist_via_efba mentre la fattura usa fn_scope_ef_whitelist_via_sr: le due derivazioni del perimetro possono divergere, e un inner join farebbe sparire dalla lista una fattura che la sua policy lascia passare — una lista che mostra meno del dovuto senza nessun segnale. Le colonne nullable (stato/tipo/utility/valuta) sono LEFT per la stessa ragione di forma: una fattura senza stato deve comparire senza stato, non sparire. Bozze incluse: numero/serie/anno sono NULL finche'' il documento non e'' numerato. Genealogia da vendite.vw_documento_lineage (18 righe su 18 fatture, misurate): n_discendenti_attivi e is_transitato sono zero per costruzione perche'' la fattura e'' terminale. NON contiene il lotto di appartenenza: questa lista esiste per raggiungere la fattura SENZA passare dal lotto. Seed lista: ui.lista_definizione ''vendite.fatture'' (attivo = f finche'' il backend non espone l''endpoint). Registro: piano-migrazione-primevue-5.md §9, 2026-08-24. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⚠️ SU QUESTA VISTA LA COLONNA E'' COSTANTE, ed e'' bene saperlo prima di leggerla: una fattura e'' sempre frontiera di SE STESSA (nel grafo forward non ha archi uscenti — l''arco N e'' un ramo di ritorno; lo asserisce il pgTAP 30 di test-documento-lineage-v1.sql), quindi frontiera_natura_doc_codice qui vale SEMPRE la natura della riga stessa. C''e'' lo stesso, e per una ragione di forma e non di dato: le sette liste sorelle devono esporre lo STESSO blocco frontiera_*, altrimenti chi scrive l''ottava copia da quella sbagliata. ⛔ E chi un giorno montasse la colonna «Transito» qui sappia che renderebbe il documento su se stesso: non un''etichetta sbagliata, un chip che non dice niente. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da `config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql §6c vieta `codice_interno AS *_codice` perche'' il nome mentirebbe sulla sorgente — un consumatore che confronta contro un `*_codice` si aspetta la colonna MUTABILE. Il guardrail CI scripts/sql/check_naming_stato_codice.sql fallisce sul pattern. (2) arriva `frontiera_tipo_codice_interno`, il CODICE del tipo accanto al suo id: prima ogni consumatore se lo traduceva con lo stesso join a config.sorgenti — dieci copie scritte a mano nel backend, tutte fuori dalla portata del guardrail, che scansiona solo le viste. ⚠️ Il nome NON e'' `frontiera_tipo_codice`: quel valore e'' `config.sorgenti.codice_interno` e il FE lo usa per la chiave i18n e per instradare, cioe'' come LOGICA. Chiamarlo `*_codice` avrebbe spostato dieci mislabel nascosti dentro l''unico posto dove il guardrail li vede. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.2, P-1): + numero_documento, registro_codice, registro_descrizione in coda. numero_documento e'' vendite.fn_numero_documento_fattura(numero, serie), la SEDE UNICA del numero parlante («numero - serie», NULL sulla non numerata, mai la stringa vuota): la lista deve portarlo perche'' il FE non compone — un contatore nudo e'' ambiguo per costruzione (una fattura 1 e una nota di credito 1 nello stesso anno). Il registro e'' LEFT: una bozza puo'' non averlo e deve comparire senza, non sparire. Consumatori: il lookup fattura degli incassi (tre superfici) e la lista vendite.fatture, che leggono SELECT v.*. Lo stesso blocco registro_* va in coda anche a vw_ddt_lista, vw_ordini_lista e vw_resi_lista (Q-E): contratti, preventivi e offerte un registro non ce l''hanno, e non lo avranno.';

