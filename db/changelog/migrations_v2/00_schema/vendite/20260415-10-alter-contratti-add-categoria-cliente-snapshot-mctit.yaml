# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# D1: aggiunge vendite.contratti.categoria_cliente_id_snapshot.
# Snapshot della categoria commerciale del BA al momento della
# creazione del contratto. Immutabile post-creazione (gestito dal
# trigger D2 in 20260415-12).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/vendite/20260415-10-alter-contratti-add-categoria-cliente-snapshot-mctit.yaml

  - changeSet:
      id: 20260415-10-alter-contratti-add-categoria-cliente-snapshot
      author: mctit
      comment: >
        Aggiunge categoria_cliente_id_snapshot (nullable) con FK a
        anagrafiche.categorie_clienti + indice di ricerca.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              schemaName: vendite
              tableName: contratti
              columnName: categoria_cliente_id_snapshot

      changes:
        - addColumn:
            schemaName: vendite
            tableName: contratti
            columns:
              - column:
                  name: categoria_cliente_id_snapshot
                  type: smallint
                  remarks: "Snapshot della categoria cliente del BA alla creazione del contratto. Immutabile post-creazione. NULL per retrocompatibilita con contratti esistenti (backfill in 20260415-11)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: contratti
            baseColumnNames: categoria_cliente_id_snapshot
            constraintName: fk_contratti_categoria_cliente_snapshot
            referencedTableSchemaName: anagrafiche
            referencedTableName: categorie_clienti
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - createIndex:
            schemaName: vendite
            tableName: contratti
            indexName: ix_contratti_categoria_cliente_snapshot
            columns:
              - column:
                  name: categoria_cliente_id_snapshot

      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: contratti
            constraintName: fk_contratti_categoria_cliente_snapshot
        - dropIndex:
            schemaName: vendite
            tableName: contratti
            indexName: ix_contratti_categoria_cliente_snapshot
        - dropColumn:
            schemaName: vendite
            tableName: contratti
            columnName: categoria_cliente_id_snapshot
