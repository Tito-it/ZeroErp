databaseChangeLog:
      - logicalFilePath: migrations_v2/00_schema/vendite/20260211-02-create-fatture-fondi-fattura-source-mctit.yaml

      - changeSet:
              id: 20260211-02-create-fatture-fondi-fattura-source
              author: mctit
              comment: "Sorgente fondi fattura (credito/debito da fatture precedenti)"
              changes:
                    - createTable:
                            schemaName: vendite
                            tableName: fatture_fondi_fattura_source
                            remarks: "Sorgente fondi fattura da fatture precedenti."
                            columns:
                                  - column:
                                          name: id
                                          type: bigint
                                          autoIncrement: true
                                          generationType: BY DEFAULT
                                          remarks: "PK surrogata."
                                          constraints:
                                                primaryKey: true
                                                primaryKeyName: pk_fatture_fondi_fattura_source
                                                nullable: false

                                  - column:
                                          name: fattura_sorgente_id
                                          type: BIGINT
                                          remarks: "Fattura sorgente del fondo"
                                          constraints:
                                                nullable: false
                                  - column:
                                          name: tipo_fondo_fattura_id
                                          type: BIGINT
                                          remarks: "Tipologia fondo fattura"
                                          constraints:
                                                nullable: false
                                  - column:
                                          name: importo
                                          type: NUMERIC
                                          remarks: "Importo del fondo (positivo o negativo)"
                                          constraints:
                                                nullable: false
                                  - column:
                                          name: stato
                                          type: VARCHAR(20)
                                          remarks: "Stato fonte (DISPONIBILE/ASSEGNATO/ANNULLATO)"
                                          constraints:
                                                nullable: false
                                  - column:
