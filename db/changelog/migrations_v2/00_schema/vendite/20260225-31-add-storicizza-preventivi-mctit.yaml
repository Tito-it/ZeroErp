databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260225-31-add-storicizza-preventivi-mctit.yaml

  - changeSet:
      id: 20260225-31-add-storicizza-preventivi
      author: mctit
      comment: "Aggiunge storicizza a vendite.preventivi ."
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: vendite
                tableName: preventivi
                columnName: storicizza
      changes:
        - addColumn:
            schemaName: vendite
            tableName: preventivi
            columns:
              - column:
                  name: storicizza
                  type: boolean
                  defaultValue: "false"
                  remarks: "Indica se il preventivo è da  storicizzare."
