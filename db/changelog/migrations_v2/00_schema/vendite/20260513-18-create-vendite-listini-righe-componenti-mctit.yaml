databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260513-18-create-vendite-listini-righe-componenti-mctit.yaml

  # ---------------------------------------------------------------------------
  # Nuova tabella vendite.listini_righe_componenti (modello unificato 2026-05-13, §8).
  #
  # Simmetria listino-padre-figli: un'istanza = "in questa versione listino,
  # il componente X del padre Y ha prezzo Z". Il prezzo padre composito e'
  # la somma di questi prezzi (mai un dato diretto di listino).
  #
  # Vincoli principali:
  #   - EXCLUDE gist: no overlap (listino_versione_id, articolo_componente_id, validita)
  #     quando attivo=TRUE (stessa coppia non puo' avere 2 prezzi per lo stesso periodo)
  #   - Audit standard (user_insert, data_insert, user_update, data_update, tx_id)
  #   - FK indexes gestiti da dbops.apply_fk_index_policy() in 90_end
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260513-18-create-vendite-listini-righe-componenti
      author: mctit
      comment: >
        Crea vendite.listini_righe_componenti per prezzi bundle dei componenti
        BoM in contesto versione listino. Simmetria con *_righe_componenti documenti.
        EXCLUDE gist su (versione, componente, validita) WHERE attivo=TRUE.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: listini_versioni
          - tableExists:
              schemaName: catalogo
              tableName: articoli_componenti
          - tableExists:
              schemaName: catalogo
              tableName: articoli
          - not:
              tableExists:
                schemaName: vendite
                tableName: listini_righe_componenti
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE TABLE vendite.listini_righe_componenti (
                  id                      BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  listino_versione_id     BIGINT        NOT NULL
                                          REFERENCES vendite.listini_versioni(id),
                  articolo_componente_id  UUID          NOT NULL
                                          REFERENCES catalogo.articoli_componenti(id),
                  articolo_padre_id       UUID          NOT NULL
                                          REFERENCES catalogo.articoli(id),
                  articolo_figlio_id      UUID          NOT NULL
                                          REFERENCES catalogo.articoli(id),
                  prezzo                  NUMERIC(18,6) NOT NULL,
                  iva_id                  BIGINT
                                          REFERENCES config.iva(id),
                  validita                DATERANGE     NOT NULL,
                  attivo                  BOOLEAN       NOT NULL DEFAULT TRUE,
                  meta                    JSONB         NOT NULL DEFAULT '{}'::jsonb,
                  tx_id                   UUID,
                  user_insert             TEXT,
                  data_insert             TIMESTAMPTZ   NOT NULL DEFAULT NOW(),
                  user_update             TEXT,
                  data_update             TIMESTAMPTZ   NOT NULL DEFAULT NOW(),
                  CONSTRAINT chk_listrighe_comp_prezzo_notnull
                      CHECK (prezzo IS NOT NULL)
              );

              COMMENT ON TABLE vendite.listini_righe_componenti IS
                  'Prezzi bundle per componenti BoM in contesto versione listino. '
                  'Una riga = prezzo del componente X del padre Y nella versione V. '
                  'Immutabile quando versione ATTIVA (guard 20260513-20). '
                  'Prezzo padre composito = SUM(componenti). rev 2026-05-13.';

              COMMENT ON COLUMN vendite.listini_righe_componenti.articolo_padre_id IS
                  'Denorm: articolo padre composito (= articoli_componenti.prodotto_id). '
                  'Verifica di coerenza a carico del trigger guard coerenza bom.';

              COMMENT ON COLUMN vendite.listini_righe_componenti.articolo_figlio_id IS
                  'Denorm: articolo componente (= articoli_componenti.componente_id). '
                  'Verifica di coerenza a carico del trigger guard coerenza bom.';

              -- EXCLUDE per non-overlap: stessa coppia (versione, componente)
              -- non puo' avere due prezzi per periodi sovrapposti quando attivo=TRUE.
              CREATE INDEX ex_listini_righe_comp_no_overlap
                  ON vendite.listini_righe_componenti
                  USING gist (listino_versione_id, articolo_componente_id, validita)
                  WHERE (attivo = TRUE);

              -- Indice per ricerca bundle-aware nel resolver pricing
              CREATE INDEX ix_listini_righe_comp_padre_data
                  ON vendite.listini_righe_componenti
                  USING btree (articolo_padre_id, listino_versione_id)
                  WHERE (attivo = TRUE);
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS vendite.listini_righe_componenti CASCADE;

  # Audit trigger: user_insert/data_insert/user_update/data_update
  - changeSet:
      id: 20260513-18-02-trg-listrighe-comp-audit
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Trigger audit data/user su listini_righe_componenti.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: listini_righe_componenti
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_listrighe_comp_audit_data_user_ins_upd
                  ON vendite.listini_righe_componenti;

              CREATE TRIGGER trg_listrighe_comp_audit_data_user_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON vendite.listini_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic();

              DROP TRIGGER IF EXISTS trg_listrighe_comp_gen_tx_id_ins_upd
                  ON vendite.listini_righe_componenti;

              CREATE TRIGGER trg_listrighe_comp_gen_tx_id_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON vendite.listini_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_listrighe_comp_audit_data_user_ins_upd
                  ON vendite.listini_righe_componenti;
              DROP TRIGGER IF EXISTS trg_listrighe_comp_gen_tx_id_ins_upd
                  ON vendite.listini_righe_componenti;
