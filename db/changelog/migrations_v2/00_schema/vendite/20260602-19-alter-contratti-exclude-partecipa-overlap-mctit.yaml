#
# Brief "Overlap contratti: escludere i DRAFT dal vincolo".
# Aggiorna ex_contratti_no_overlap: il predicato passa da
#   WHERE (NOT is_abortito_snapshot)
# a
#   WHERE (partecipa_overlap_snapshot)            -- = NOT abortito AND NOT draft
# cosi' i contratti in bozza NON partecipano all'esclusivita': si possono
# preparare bozze sovrapposte (successione); il blocco scatta all'attivazione.
#
# E' un RILASSAMENTO del predicato (esclude piu' righe dal vincolo) -> nessuna
# nuova violazione possibile: DROP+ADD ricostruisce pulito senza bonifica.
# Richiede btree_gist (gia' presente). Chiave invariata (ambito resta, cfr. brief
# §2.4: COMMERCIO/COMMODITY coesistono legittimamente).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260602-19-alter-contratti-exclude-partecipa-overlap-mctit.yaml

  - changeSet:
      id: 20260602-19-alter-contratti-exclude-partecipa-overlap
      author: mctit
      comment: >
        ex_contratti_no_overlap: predicato da (NOT is_abortito_snapshot) a
        (partecipa_overlap_snapshot). Esclude i DRAFT dal vincolo anti-overlap.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: partecipa_overlap_snapshot
            - sqlCheck:
                expectedResult: "1"
                sql: |
                  SELECT COUNT(*)::text FROM pg_extension WHERE extname = 'btree_gist';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.contratti
                  DROP CONSTRAINT IF EXISTS ex_contratti_no_overlap;

              ALTER TABLE vendite.contratti
                  ADD CONSTRAINT ex_contratti_no_overlap
                  EXCLUDE USING gist (
                      billing_account_id WITH =,
                      istanza_utility_id WITH =,
                      utility_id         WITH =,
                      ambito             WITH =,
                      validita           WITH &&
                  )
                  WHERE (partecipa_overlap_snapshot);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.contratti
                  DROP CONSTRAINT IF EXISTS ex_contratti_no_overlap;
              ALTER TABLE vendite.contratti
                  ADD CONSTRAINT ex_contratti_no_overlap
                  EXCLUDE USING gist (
                      billing_account_id WITH =,
                      istanza_utility_id WITH =,
                      utility_id         WITH =,
                      ambito             WITH =,
                      validita           WITH &&
                  )
                  WHERE (NOT is_abortito_snapshot);
