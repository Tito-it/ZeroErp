databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260222-02-update-fatturazione-lotti-fatture-stato-esecuzione-v2-mctit.yaml

  - changeSet:
      id: 20260222-02-update-fatturazione-lotti-fatture-stato-esecuzione-v2
      author: mctit
      comment: "Uniforma stato_esecuzione lotti_fatture a PENDING|RUNNING|COMPLETED|ERRORE"
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatturazione_lotti_fatture
                ALTER COLUMN stato_esecuzione SET DEFAULT 'PENDING';

              -- Backfill storico:
              -- OK      -> COMPLETED
              -- NULL    -> PENDING
              -- ERRORE  -> invariato
              UPDATE vendite.fatturazione_lotti_fatture
                 SET stato_esecuzione = CASE
                       WHEN stato_esecuzione = 'OK' THEN 'COMPLETED'
                       WHEN stato_esecuzione IS NULL THEN 'PENDING'
                       ELSE stato_esecuzione
                     END
               WHERE stato_esecuzione IS NULL
                  OR stato_esecuzione = 'OK';

              ALTER TABLE vendite.fatturazione_lotti_fatture
                DROP CONSTRAINT IF EXISTS chk_fatturazione_lf_stato_esecuzione;

              ALTER TABLE vendite.fatturazione_lotti_fatture
                ADD CONSTRAINT chk_fatturazione_lf_stato_esecuzione
                CHECK (stato_esecuzione IN ('PENDING','RUNNING','COMPLETED','ERRORE'));

              COMMENT ON COLUMN vendite.fatturazione_lotti_fatture.stato_esecuzione
                IS 'Stato esecuzione fattura nel lotto (PENDING|RUNNING|COMPLETED|ERRORE).';
