        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- Regole competenza, pricing e stati riga commessa.
              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_comp_mese_primo
                CHECK (extract(day from competenza_mese) = 1);

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_comp_range
                CHECK (competenza_dal <= competenza_al);

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_posticipa
                CHECK (posticipa_al IS NULL OR posticipa_al >= competenza_dal);

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_prezzo
                CHECK (prezzo_snapshot >= 0);

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_factor_to_base
                CHECK (factor_to_base > 0);

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_pricing_mode
                CHECK (pricing_mode IN ('FIXED', 'FORMULA', 'SCAGLIONI'));

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_stato_approvazione
                CHECK (stato_approvazione IN ('BOZZA', 'APPROVATA', 'RIFIUTATA'));

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_stato_emissione
                CHECK (stato_emissione IN ('NON_EMESSA', 'EMESSA', 'ANNULLATA'));

              ALTER TABLE vendite.commesse_attivita
                ADD CONSTRAINT chk_commesse_attivita_sorgente_pair
                CHECK (
                  (sorgente_tipo_id IS NULL AND sorgente_uid IS NULL) OR
                  (sorgente_tipo_id IS NOT NULL AND sorgente_uid IS NOT NULL)
                );

              CREATE UNIQUE INDEX IF NOT EXISTS uq_commesse_attivita_src_uid_partial
                ON vendite.commesse_attivita (sorgente_tipo_id, sorgente_uid)
                WHERE sorgente_tipo_id IS NOT NULL;

              CREATE INDEX IF NOT EXISTS ix_commesse_attivita_commessa_stati
                ON vendite.commesse_attivita (commessa_id, stato_approvazione, stato_emissione);
