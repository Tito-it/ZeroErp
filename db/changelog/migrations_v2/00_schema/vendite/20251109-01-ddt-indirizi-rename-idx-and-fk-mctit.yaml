databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20251109-01-ddt-indirizi-rename-idx-and-fk-mctit.yaml

  - changeSet:
      id: 20251109-01-ddt-indirizi-rename-idx-and-fk
      author: mctit

      changes:
        - dropIndex:
            schemaName: vendite
            tableName: ddt_indirizzi
            indexName: ix_ddt_indirizzo_ordine
        - createIndex:
            schemaName: vendite
            tableName: ddt_indirizzi
            indexName: ix_ddt_indirizzi_ddt
            columns:
              - column:
                  name: ddt_id

        # ) Rinomina vincolo fk_ddt_indirizzo_ordine (se necessario e supportato in target)

        - dropForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: ddt_indirizzi
            constraintName: fk_ddt_indirizzo_ordine
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: ddt_indirizzi
            baseColumnNames: ddt_id
            constraintName: fk_ddt_indirizzi_ddt
            referencedTableSchemaName: vendite
            referencedTableName: ddt
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: CASCADE
