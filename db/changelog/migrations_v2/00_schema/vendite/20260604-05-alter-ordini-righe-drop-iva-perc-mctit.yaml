# DROP vendite.ordini_righe.iva_perc — allineamento a preventivi_righe e
# fatture_righe, che NON hanno iva_perc: l'aliquota si deriva da iva_id via
# config.iva, non si denormalizza in colonna (no logica/dato duplicato).
# ordini_righe era l'outlier (rimasto indietro).
#
# Dipendenze verificate (2026-06-04): nessuna vista/funzione DB referenzia
# ordini_righe.iva_perc tranne vendite.fn_offerta_righe_espanse, gia' aggiornata
# nello stesso set (20260604-04) per NON restituire piu' iva_perc. Le funzioni
# non sono dependency-locked sulle colonne (a differenza delle viste): il drop
# non e' bloccato. Cleanup BE (r.iva_perc in list_righe/get_riga) a carico BE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260604-05-alter-ordini-righe-drop-iva-perc-mctit.yaml

  - changeSet:
      id: 20260604-05-alter-ordini-righe-drop-iva-perc
      author: mctit
      comment: >
        Drop ordini_righe.iva_perc: allineamento a preventivi_righe/fatture_righe
        (solo iva_id; aliquota derivata da config.iva). Rimuove dato denormalizzato.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            schemaName: vendite
            tableName: ordini_righe
            columnName: iva_perc
      changes:
        - dropColumn:
            schemaName: vendite
            tableName: ordini_righe
            columnName: iva_perc
      rollback:
        - addColumn:
            schemaName: vendite
            tableName: ordini_righe
            columns:
              - column:
                  name: iva_perc
                  type: numeric
