# ------------------------------------------------------------
# Aggiunge utility_id a vendite.ordini.
#
# La colonna era assente su ordini mentre gia' presente su preventivi
# (NOT NULL) e ddt (nullable). Per coerenza del ciclo vendite
# preventivo -> ordine -> ddt, l'ordine deve poter esprimere
# l'associazione all'utility per la risoluzione listini CASO A.
#
# Nullable (come ddt): un ordine puo' non avere utility associata
# (canale non energy o ordine senza componenti compositi).
#
# FK: config.utilities(id) -- identico al pattern preventivi/ddt.
# Naming constraint: fk_ordini_v_utility.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20260511-29-alter-ordini-add-utility-id-mctit.yaml

    - changeSet:
          id: 20260511-29-01-alter-ordini-add-utility-id
          author: mctit
          comment: >
              Aggiunge colonna utility_id INTEGER nullable a vendite.ordini,
              con FK verso config.utilities(id).
              Coerenza con preventivi (utility_id NOT NULL) e ddt (utility_id nullable).
              Necessario per fn_ordine_riga_componenti_init: passa utility_id
              al resolver fn_resolve_prezzo_composito per listini CASO A.
          preConditions:
              - onFail: HALT
              - and:
                    - tableExists:
                          schemaName: vendite
                          tableName: ordini
                    - tableExists:
                          schemaName: config
                          tableName: utilities
                    - not:
                          - columnExists:
                                schemaName: vendite
                                tableName: ordini
                                columnName: utility_id
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        ALTER TABLE vendite.ordini
                            ADD COLUMN utility_id INTEGER,
                            ADD CONSTRAINT fk_ordini_v_utility
                                FOREIGN KEY (utility_id)
                                REFERENCES config.utilities(id);

                        COMMENT ON COLUMN vendite.ordini.utility_id IS
                            'Utility associata all''ordine. Nullable (come ddt): non tutti gli ordini '
                            'appartengono a un contesto energy. Usato da fn_ordine_riga_componenti_init '
                            'per passare il parametro utility al resolver listini CASO A.';
          rollback:
              - sql:
                    sql: |
                        ALTER TABLE vendite.ordini
                            DROP CONSTRAINT IF EXISTS fk_ordini_v_utility,
                            DROP COLUMN IF EXISTS utility_id;
