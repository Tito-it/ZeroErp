# DDL tabella vendite.ddt_righe_componenti.
#
# Terza delle 5 tabelle simmetriche del pattern "righe componenti
# BoM CASO A" (preventivi / ordini / contratti / ddt / consumi).
# Stessa struttura di preventivi_righe_componenti, adattata alla
# sorgente ddt. Riusa le 4 helper generiche script.* introdotte
# con preventivi (20260511-05).
#
# Colonne chiave:
#   articolo_componente_id  FK a catalogo.articoli_componenti (riga BoM)
#   componente_id           FK a catalogo.articoli (articolo componente)
#   coeff_qta_snapshot      snapshot coeff_qta al momento della creazione
#   origine_prezzo          valori: PROMO/CONTRATTO_OVERRIDE/CONTRATTO_LISTINO
#                           /CATEGORIA/MANUALE  (allineato al resolver v5)
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20260511-25-create-vendite-ddt-righe-componenti-mctit.yaml

    - changeSet:
          id: 20260511-25-01-create-vendite-ddt-righe-componenti
          author: mctit
          comment: >
              Crea tabella vendite.ddt_righe_componenti.
              Struttura DDL: PK BIGINT IDENTITY, FK ON DELETE CASCADE verso
              ddt_righe, FK verso articoli_componenti/articoli/iva/uom/pratiche,
              UNIQUE (riga_ddt_id, articolo_componente_id),
              CHECK quantita<>0, prezzo_unitario<>0, coeff_qta_snapshot>0,
              origine_prezzo IN (valori resolver v5).
              Pattern BoM CASO A -- stessa struttura di preventivi_righe_componenti.
          preConditions:
              - onFail: HALT
              - and:
                    - tableExists:
                          schemaName: vendite
                          tableName: ddt_righe
                    - tableExists:
                          schemaName: catalogo
                          tableName: articoli_componenti
                    - tableExists:
                          schemaName: catalogo
                          tableName: articoli
                    - tableExists:
                          schemaName: config
                          tableName: iva
                    - tableExists:
                          schemaName: catalogo
                          tableName: unita_misura
                    - tableExists:
                          schemaName: pratiche
                          tableName: pratiche
                    - not:
                          - tableExists:
                                schemaName: vendite
                                tableName: ddt_righe_componenti
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE vendite.ddt_righe_componenti (
                            id                              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                                                CONSTRAINT pk_ddtrighe_comp PRIMARY KEY,
                            riga_ddt_id                     BIGINT         NOT NULL,
                            articolo_componente_id          UUID           NOT NULL,
                            componente_id                   UUID           NOT NULL,
                            coeff_qta_snapshot              NUMERIC        NOT NULL,
                            quantita                        NUMERIC        NOT NULL,
                            uom_operativa_id                BIGINT,
                            factor_to_base                  NUMERIC        NOT NULL DEFAULT 1,
                            qta_operativa                   NUMERIC,
                            prezzo_unitario                 NUMERIC        NOT NULL,
                            iva_id                          INTEGER,
                            origine_prezzo                  VARCHAR(30)    NOT NULL,
                            prezzo_resolver_context         JSONB,
                            stato_approvazione_prezzo       config.stato_approvazione_prezzo,
                            pratica_approvazione_prezzo_id  BIGINT,
                            meta                            JSONB          NOT NULL DEFAULT '{}'::jsonb,
                            ordine                          SMALLINT       NOT NULL DEFAULT 0,
                            attivo                          BOOLEAN        NOT NULL DEFAULT TRUE,
                            user_insert                     TEXT           NOT NULL DEFAULT CURRENT_USER,
                            user_update                     TEXT                    DEFAULT CURRENT_USER,
                            data_insert                     TIMESTAMPTZ    NOT NULL DEFAULT now(),
                            data_update                     TIMESTAMPTZ    NOT NULL DEFAULT now(),
                            tx_id                           UUID,

                            CONSTRAINT fk_ddtrighe_comp_riga
                                FOREIGN KEY (riga_ddt_id)
                                REFERENCES vendite.ddt_righe(id)
                                ON DELETE CASCADE,

                            CONSTRAINT fk_ddtrighe_comp_articolo_componente
                                FOREIGN KEY (articolo_componente_id)
                                REFERENCES catalogo.articoli_componenti(id),

                            CONSTRAINT fk_ddtrighe_comp_componente
                                FOREIGN KEY (componente_id)
                                REFERENCES catalogo.articoli(id),

                            CONSTRAINT fk_ddtrighe_comp_uom
                                FOREIGN KEY (uom_operativa_id)
                                REFERENCES catalogo.unita_misura(id),

                            CONSTRAINT fk_ddtrighe_comp_iva
                                FOREIGN KEY (iva_id)
                                REFERENCES config.iva(id),

                            CONSTRAINT fk_ddtrighe_comp_pratica
                                FOREIGN KEY (pratica_approvazione_prezzo_id)
                                REFERENCES pratiche.pratiche(id),

                            CONSTRAINT uq_ddtrighe_comp_riga_art_comp
                                UNIQUE (riga_ddt_id, articolo_componente_id),

                            CONSTRAINT chk_ddtrighe_comp_quantita_pos
                                CHECK (quantita <> 0),

                            CONSTRAINT chk_ddtrighe_comp_prezzo_nonneg
                                CHECK (prezzo_unitario <> 0),

                            CONSTRAINT chk_ddtrighe_comp_coeff_qta_pos
                                CHECK (coeff_qta_snapshot > 0),

                            CONSTRAINT chk_ddtrighe_comp_origine
                                CHECK (origine_prezzo IN (
                                    'PROMO',
                                    'CONTRATTO_OVERRIDE',
                                    'CONTRATTO_LISTINO',
                                    'CATEGORIA',
                                    'MANUALE'
                                ))
                        );

                        CREATE INDEX ix_vendite_ddtrighe_comp_riga
                            ON vendite.ddt_righe_componenti USING btree (riga_ddt_id);

                        CREATE INDEX ix_vendite_ddtrighe_comp_articolo_componente
                            ON vendite.ddt_righe_componenti USING btree (articolo_componente_id);

                        CREATE INDEX ix_vendite_ddtrighe_comp_componente
                            ON vendite.ddt_righe_componenti USING btree (componente_id);

                        CREATE INDEX ix_vendite_ddtrighe_comp_stato_approvazione
                            ON vendite.ddt_righe_componenti USING btree (stato_approvazione_prezzo)
                            WHERE stato_approvazione_prezzo IS NOT NULL;

                        COMMENT ON TABLE vendite.ddt_righe_componenti IS
                            'Componenti BoM CASO A del DDT: una riga per ogni componente '
                            'esposto_in_fattura=TRUE di un articolo composito. Prezzo proprio '
                            'negoziabile (L1/L2/L3). Prezzo padre calcolato da trigger come '
                            'SUM(prezzo_unitario * coeff_qta_snapshot). Snapshot pricing: al push '
                            'su commessa i prezzi vengono propagati senza ri-chiamare il resolver.';

                        COMMENT ON COLUMN vendite.ddt_righe_componenti.articolo_componente_id IS
                            'FK alla riga BoM (catalogo.articoli_componenti.id). Identifica univocamente '
                            'il componente nella distinta base del prodotto composito padre.';

                        COMMENT ON COLUMN vendite.ddt_righe_componenti.componente_id IS
                            'FK all''articolo componente (catalogo.articoli.id). Ridondante rispetto '
                            'ad articoli_componenti.componente_id per query dirette. Coerenza garantita '
                            'dal trigger trgfn_componenti_guard_coerenza_bom.';

                        COMMENT ON COLUMN vendite.ddt_righe_componenti.coeff_qta_snapshot IS
                            'Snapshot di articoli_componenti.coeff_qta al momento della creazione. '
                            'Isolato da future evoluzioni BoM; usato per ricalcolo padre e propagazione qta.';

                        COMMENT ON COLUMN vendite.ddt_righe_componenti.origine_prezzo IS
                            'Origine del prezzo (resolver v5): PROMO / CONTRATTO_OVERRIDE / '
                            'CONTRATTO_LISTINO / CATEGORIA / MANUALE.';

                        COMMENT ON COLUMN vendite.ddt_righe_componenti.prezzo_resolver_context IS
                            'Contesto JSONB del resolver al momento dell''init: emittente_sr_id, '
                            'data_riferimento, ba_id, utility_id. In caso di fallback (prezzo=0, '
                            'MANUALE) aggiunge error+sqlstate per diagnostica.';
          rollback:
              - sql:
                    sql: DROP TABLE IF EXISTS vendite.ddt_righe_componenti CASCADE;
