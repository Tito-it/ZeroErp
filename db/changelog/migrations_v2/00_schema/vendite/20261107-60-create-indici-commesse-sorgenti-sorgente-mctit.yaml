# «CHI DERIVA DA X» SU vendite.commesse_sorgenti: gli indici della provenienza
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.2.
#
#   La ricerca per tipo e sorgente_id la serve l'unicita' (20261107-59), che
#   comincia con quelle due colonne. Mancano le altre due chiavi: sorgente_uid
#   (il preventivo: la commessa aperta di un documento, gli archi della lineage, il
#   lato in uscita del guard unico) e sorgente_riga (il lato in uscita, alla
#   cancellazione di una riga del documento). Parziali, come su vendite.fatture_righe.
#   Rollback: DROP INDEX.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261107-60-create-indici-commesse-sorgenti-sorgente-mctit.yaml

  - changeSet:
      id: 20261107-60-create-indici-commesse-sorgenti-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.commesse_sorgenti: indici parziali per tipo e sorgente_uid, per tipo e
        sorgente_riga. brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.2.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE INDEX ix_commesse_sorgenti_sorgente_uid ON vendite.commesse_sorgenti USING btree (sorgente_tipo_id, sorgente_uid)
               WHERE sorgente_uid IS NOT NULL;
              COMMENT ON INDEX vendite.ix_commesse_sorgenti_sorgente_uid IS
                'Chi deriva da X: i link alle commesse di un documento a chiave uid, per tipo e chiave del documento. Lo usano vendite.fn_commessa_viva_di_sorgente, gli archi della lineage e il lato in uscita della provenienza (script.trgfn_sorgente_in_uscita, alla cancellazione del documento). Per tipo e sorgente_id serve uq_commesse_sorgenti_sorgente_commessa.';

              CREATE INDEX ix_commesse_sorgenti_sorgente_riga ON vendite.commesse_sorgenti USING btree (sorgente_tipo_id, sorgente_riga)
               WHERE sorgente_riga IS NOT NULL;
              COMMENT ON INDEX vendite.ix_commesse_sorgenti_sorgente_riga IS
                'Chi deriva da X: i link alle commesse a grana di riga, per tipo e riga. Lo usa il lato in uscita della provenienza (script.trgfn_sorgente_in_uscita, alla cancellazione della riga). Non unico.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP INDEX vendite.ix_commesse_sorgenti_sorgente_uid;
              DROP INDEX vendite.ix_commesse_sorgenti_sorgente_riga;
