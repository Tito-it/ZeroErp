# vendite.commesse_attivita.factor_to_base e vendite.attivita_fatturabili.factor_to_base:
#   via il DEFAULT 1 (D26, Q30; la forma di D23).
#
#   «Quando non so, 1» faceva passare una quantita' in un'unita' non base come se lo
#   fosse. Sulle commesse il fattore mancante lo da' ora il trigger alla data (-61);
#   sulle attivita' fatturabili l'unico writer copia il fattore della commessa, e il
#   trigger alla data copre chi non lo porta. Le
#   colonne restano NOT NULL. COMMENT di colonna nuovi (quello delle fatturabili
#   parlava di righe DDT). Rollback: il DEFAULT 1 e i COMMENT di prima.
#   Brief: brief-db-revisione-catalogo, giro 2-bis.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261111-62-alter-factor-to-base-commesse-senza-default-mctit.yaml

  - changeSet:
      id: 20261111-62-alter-factor-to-base-commesse-senza-default
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Via il DEFAULT 1 da commesse_attivita.factor_to_base e attivita_fatturabili.factor_to_base: il fattore e' una fotografia o quello alla data (D26, Q30). Brief: brief-db-revisione-catalogo, giro 2-bis.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM information_schema.columns c
               WHERE c.table_schema = 'vendite'
                 AND c.table_name IN ('commesse_attivita', 'attivita_fatturabili')
                 AND c.column_name = 'factor_to_base'
                 AND c.column_default IS NOT NULL
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.commesse_attivita    ALTER COLUMN factor_to_base DROP DEFAULT;
              ALTER TABLE vendite.attivita_fatturabili ALTER COLUMN factor_to_base DROP DEFAULT;
              COMMENT ON COLUMN vendite.commesse_attivita.factor_to_base IS
                  'Quante unita'' base dell''articolo vale un''unita'' dell''attivita'' (l''operativa, o uom_id se l''operativa non c''e''): la fotografia. Senza, il fattore alla data dell''attivita'' (vendite.trgfn_attivita_fattore_alla_data); nessun valore per difetto.';
              COMMENT ON COLUMN vendite.attivita_fatturabili.factor_to_base IS
                  'Quante unita'' base dell''articolo vale un''unita'' dell''attivita'' fatturabile: la fotografia, copiata dall''attivita'' di commessa che la emette (vendite.fn_emit_attivita_fatturabili_da_commessa). Senza, il fattore alla data dell''attivita'' (vendite.trgfn_attivita_fattore_alla_data); nessun valore per difetto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE vendite.commesse_attivita    ALTER COLUMN factor_to_base SET DEFAULT 1;
              ALTER TABLE vendite.attivita_fatturabili ALTER COLUMN factor_to_base SET DEFAULT 1;
              COMMENT ON COLUMN vendite.commesse_attivita.factor_to_base IS NULL;
              COMMENT ON COLUMN vendite.attivita_fatturabili.factor_to_base IS
                  'Snapshot del fattore di conversione dalla UoM operativa dell''articolo alla UoM base (catalogo.articoli_uom_operativa.factor_to_base) al momento della riga DDT.';
