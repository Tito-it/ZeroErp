databaseChangeLog:
  
  - logicalFilePath: migrations_v2/00_schema/vendite/20251029-11-drop-table-ddt-ordini-mctit.yaml

  - changeSet:
      id: 20251029-11-drop-table-ddt-ordini
      author: mctit
      preConditions:
        - onFail: CONTINUE
          tableExists:
            schemaName: vendite
            tableName: ddt_ordini
      changes:
        - dropTable:
            schemaName: vendite
            tableName: ddt_ordini
            cascadeConstraints: true
            
      rollback:
        # Ricrea la tabella ponte (struttura minimale robusta, come tua definizione)
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS vendite.ddt_ordini
              (
                  id          bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  ddt_id      bigint NOT NULL,
                  ordine_id   bigint NOT NULL,
                  meta        jsonb  DEFAULT '{}'::jsonb,
                  data_insert timestamptz NOT NULL DEFAULT now(),
                  user_insert varchar(80) NOT NULL DEFAULT CURRENT_USER,
                  data_update timestamptz NOT NULL DEFAULT now(),
                  user_update varchar(80) DEFAULT CURRENT_USER,
                  CONSTRAINT uq_ddt_ordini_pair UNIQUE (ddt_id, ordine_id),
                  CONSTRAINT fk_ddt_ordini_ddt
                    FOREIGN KEY (ddt_id) REFERENCES vendite.ddt(id)
                    ON UPDATE CASCADE ON DELETE CASCADE,
                  CONSTRAINT fk_ddt_ordini_ordini
                    FOREIGN KEY (ordine_id) REFERENCES vendite.ordini(id)
                    ON UPDATE CASCADE ON DELETE CASCADE
              );
              COMMENT ON TABLE vendite.ddt_ordini  IS 'Tabella ponte tra testate DDT e testate Ordini (ora sostituibile da MV).';
              COMMENT ON COLUMN vendite.ddt_ordini.ddt_id     IS 'FK → vendite.ddt(id)';
              COMMENT ON COLUMN vendite.ddt_ordini.ordine_id  IS 'FK → vendite.ordini(id)';
              COMMENT ON COLUMN vendite.ddt_ordini.meta       IS 'Attributi estendibili di collegamento (JSON).';
              CREATE INDEX IF NOT EXISTS ix_ddt_ordini_ddt
                ON vendite.ddt_ordini (ddt_id);
              CREATE INDEX IF NOT EXISTS ix_ddt_ordini_ordine
                ON vendite.ddt_ordini (ordine_id);
