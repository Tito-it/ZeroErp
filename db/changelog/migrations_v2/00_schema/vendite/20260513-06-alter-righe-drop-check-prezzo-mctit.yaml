databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260513-06-alter-righe-drop-check-prezzo-mctit.yaml

  # ---------------------------------------------------------------------------
  # Rilassamento CHECK prezzo_unitario su *_righe_componenti e *_righe
  # (modello unificato BoM 2026-05-13, §3).
  #
  # *_righe_componenti (4 tabelle): CHECK (<> 0) universale rimosso.
  #   Sostituito da trigger script.trgfn_componenti_check_prezzo_obbligatorio
  #   (migration 20260513-07) che blocca SOLO prezzo=0 per obbligatori.
  #   Opzionali e padre composito ammettono 0 e negativi.
  #
  # *_righe padre (2 tabelle con constraint esistente):
  #   preventivi_righe: chk_prevrighe_quantita_prezzo (quantita>0 AND prezzo>=0)
  #     -> ricreato come chk_prevrighe_quantita_pos (solo quantita>0)
  #   ordini_righe: chk_ordini_v_r_prezzo_pos (prezzo>=0) -> DROP senza sostituto
  #   ddt_righe, contratti_righe: nessun constraint prezzo esistente -> noop
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260513-06-01-alter-prevrighe-comp-drop-check-prezzo
      author: mctit
      comment: >
        preventivi_righe_componenti: DROP CHECK chk_prevrighe_comp_prezzo_nonneg
        (<> 0). Sostituito da trigger prezzo obbligatorio (20260513-07).
      preConditions:
        - onFail: MARK_RAN
        - and:
          - tableExists:
              schemaName: vendite
              tableName: preventivi_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_constraint c
                  JOIN pg_class r ON r.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = r.relnamespace
                 WHERE n.nspname = 'vendite'
                   AND r.relname = 'preventivi_righe_componenti'
                   AND c.conname = 'chk_prevrighe_comp_prezzo_nonneg';
      changes:
        - sql:
            sql: |
              ALTER TABLE vendite.preventivi_righe_componenti
                  DROP CONSTRAINT chk_prevrighe_comp_prezzo_nonneg;
      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.preventivi_righe_componenti
                  ADD CONSTRAINT chk_prevrighe_comp_prezzo_nonneg
                  CHECK (prezzo_unitario <> 0);

