                  DROP CONSTRAINT chk_ordini_v_r_prezzo_pos;
      rollback:
        - sql:
            sql: |
              ALTER TABLE vendite.ordini_righe
                  ADD CONSTRAINT chk_ordini_v_r_prezzo_pos
                  CHECK (prezzo_unitario >= 0);
