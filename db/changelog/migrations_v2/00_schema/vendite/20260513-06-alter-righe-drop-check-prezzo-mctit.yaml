  - changeSet:
      id: 20260513-06-05-alter-prevrighe-regen-check-quantita
      author: mctit
      comment: >
        preventivi_righe: DROP chk_prevrighe_quantita_prezzo (quantita>0 AND prezzo>=0),
        ADD chk_prevrighe_quantita_pos (quantita>0 solo). Prezzo composito puo'
        essere 0 o negativo (SUM figli con segni misti).
      preConditions:
        - onFail: MARK_RAN
        - and:
          - tableExists:
              schemaName: vendite
              tableName: preventivi_righe
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_constraint c
                  JOIN pg_class r ON r.oid = c.conrelid
                  JOIN pg_namespace n ON n.oid = r.relnamespace
                 WHERE n.nspname = 'vendite'
                   AND r.relname = 'preventivi_righe'
                   AND c.conname = 'chk_prevrighe_quantita_prezzo';
      changes:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE vendite.preventivi_righe
                  DROP CONSTRAINT chk_prevrighe_quantita_prezzo;

              ALTER TABLE vendite.preventivi_righe
                  ADD CONSTRAINT chk_prevrighe_quantita_pos
                  CHECK (quantita > 0);
      rollback:
        - sql:
            splitStatements: true
            sql: |
              ALTER TABLE vendite.preventivi_righe
                  DROP CONSTRAINT IF EXISTS chk_prevrighe_quantita_pos;
              ALTER TABLE vendite.preventivi_righe
                  ADD CONSTRAINT chk_prevrighe_quantita_prezzo
                  CHECK (quantita > 0 AND prezzo_unitario >= 0);

  - changeSet:
