databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260225-23-add-prezzo-unitario-ddt-righe-mctit.yaml

  - changeSet:
      id: 20260225-23-add-prezzo-unitario-ddt-righe
      author: mctit
      comment: "Aggiunge prezzo_unitario a vendite.ddt_righe per supportare DDT come sorgente autonoma di commessa."
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: vendite
                tableName: ddt_righe
                columnName: prezzo_unitario
      changes:
        - addColumn:
            schemaName: vendite
            tableName: ddt_righe
            columns:
              - column:
                  name: prezzo_unitario
                  type: numeric
                  remarks: "Prezzo unitario. Nullable: per DDT da ordine puo` essere ereditato da ordini_righe via fulfillment."
