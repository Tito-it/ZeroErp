databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260225-25-add-fatturazione-trigger-ordini-mctit.yaml

  - changeSet:
      id: 20260225-25-add-fatturazione-trigger-ordini
      author: mctit
      comment: "Aggiunge fatturazione_trigger a vendite.ordini: controlla quando scatta il push a commessa (CONFERMATO = da ordine, SPEDITO/CONSEGNATO = da DDT). Fallback da billing_account.fatturazione_ordini."
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: vendite
                tableName: ordini
                columnName: fatturazione_trigger
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.ordini
                ADD COLUMN fatturazione_trigger character varying NOT NULL
                  DEFAULT 'CONFERMATO';

              ALTER TABLE vendite.ordini
                ADD CONSTRAINT chk_ordini_fatturazione_trigger
                  CHECK (fatturazione_trigger IN ('CONFERMATO', 'SPEDITO', 'CONSEGNATO'));

              COMMENT ON COLUMN vendite.ordini.fatturazione_trigger
                IS 'Quando scatta la fatturazione: CONFERMATO = push a commessa alla conferma ordine, SPEDITO/CONSEGNATO = push delegato al DDT quando raggiunge lo stato corrispondente. Default ereditato da billing_account.fatturazione_ordini.';
