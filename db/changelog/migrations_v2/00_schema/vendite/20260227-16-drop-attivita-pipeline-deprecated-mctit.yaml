databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260227-16-drop-attivita-pipeline-deprecated-mctit.yaml

  - changeSet:
      id: 20260227-16-drop-attivita-pipeline-deprecated
      # runOnChange: true
      author: mctit
      comment: >-
        Rimuove l'intero sotto-sistema pipeline attivita_fatturabili,
        sostituito da commesse v2. Ordine: funzioni → trigger su tabelle
        attive → FK/colonne orfane → storico → tabelle deprecate.
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- =========================================================
              -- FASE 1: DROP FUNZIONI (15 funzioni attivita-pipeline)
              -- =========================================================

              DROP FUNCTION IF EXISTS vendite.fn_cancel_attivita_lotto_task_run(bigint, jsonb);
              DROP FUNCTION IF EXISTS vendite.fn_complete_attivita_lotto_task_run(bigint, jsonb);
              DROP FUNCTION IF EXISTS vendite.fn_fail_attivita_lotto_task_run(bigint, varchar, text, jsonb);
              DROP FUNCTION IF EXISTS vendite.fn_get_attivita_lotto_info(bigint);
              DROP FUNCTION IF EXISTS vendite.fn_get_or_create_lotto_attivita(bigint, date, integer, bigint, bigint, uuid, jsonb, bigint);
              DROP FUNCTION IF EXISTS vendite.fn_list_attivita_lotto_task_runs(bigint, varchar, varchar);
              DROP FUNCTION IF EXISTS vendite.fn_set_attivita_lotto_stato(bigint, text, text);
              DROP FUNCTION IF EXISTS vendite.fn_start_attivita_lotto_task_run(bigint, bigint, varchar, varchar, bigint, varchar, varchar, jsonb, jsonb);
              DROP FUNCTION IF EXISTS vendite.fn_check_pipeline_task_policy(bigint, varchar);
              DROP FUNCTION IF EXISTS vendite.fn_get_attivita_pipeline_task_policy(bigint, varchar, varchar);
              DROP FUNCTION IF EXISTS vendite.fn_resolve_attivita_sorgente_branch_policy(bigint, boolean);
              DROP FUNCTION IF EXISTS vendite.fn_get_attivita_branch_summary(bigint);
              DROP FUNCTION IF EXISTS vendite.fn_list_attivita_sorgenti_abilitate();

              -- =========================================================
              -- FASE 2: DROP TRIGGER su config.sorgenti (4 trigger
              --         block_deact che referenziano tabelle deprecate)
              -- =========================================================

              DROP TRIGGER IF EXISTS trg_sorgenti_a10_attivita_fatturabili_pipeline_block_deact_upd
                ON config.sorgenti;
              DROP TRIGGER IF EXISTS trg_sorgenti_a10_attivita_fatturabili_lotti_block_deact_upd
                ON config.sorgenti;
              DROP TRIGGER IF EXISTS trg_sorgenti_a10_attivita_fatturabili_lotti_task_runs_bl_535fbe
                ON config.sorgenti;
              DROP TRIGGER IF EXISTS trg_sorgenti_a10_attivita_fatturabili_sorgenti_branch_po_602713
                ON config.sorgenti;

              -- =========================================================
              -- FASE 3: DROP FK + colonna lotto_attivita_id da tabelle
              --         attive (CASCADE elimina anche indici collegati)
              -- =========================================================

              ALTER TABLE vendite.attivita_fatturabili
                DROP COLUMN IF EXISTS lotto_attivita_id CASCADE;

              ALTER TABLE vendite.attivita_consumi
                DROP COLUMN IF EXISTS lotto_attivita_id CASCADE;

              ALTER TABLE vendite.attivita_fatturabili_log
                DROP COLUMN IF EXISTS lotto_attivita_id CASCADE;

              -- =========================================================
              -- FASE 4: DROP tabella storico
              -- =========================================================

              DROP TABLE IF EXISTS storico.attivita_fatturabili_lotti CASCADE;

              -- =========================================================
              -- FASE 5: DROP tabelle deprecate (figli prima, padri dopo)
              -- =========================================================

              DROP TABLE IF EXISTS vendite.attivita_fatturabili_lotti_task_runs CASCADE;
              DROP TABLE IF EXISTS vendite.attivita_fatturabili_pipeline_task_policy CASCADE;
              DROP TABLE IF EXISTS vendite.attivita_fatturabili_sorgenti_branch_policy CASCADE;
              DROP TABLE IF EXISTS vendite.attivita_fatturabili_lotti CASCADE;
              DROP TABLE IF EXISTS vendite.attivita_fatturabili_pipeline CASCADE;

  - changeSet:
      id: 20260227-16-02-drop-attivita-pipeline-deprecated
      author: mctit
      comment: >-
        Drop 2 funzioni attivita-pipeline mancanti dal changeSet precedente
        (fn_list_attivita_pipeline_steps, fn_resolve_attivita_pipeline_step).
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_list_attivita_pipeline_steps(integer, bigint);
              DROP FUNCTION IF EXISTS vendite.fn_resolve_attivita_pipeline_step(text, integer, bigint, boolean);
