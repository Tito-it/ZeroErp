databaseChangeLog:
  - logicalFilePath: migrations_v2/20_vendite/20251105-01-ddt_righe-add-factor_to_base-mctit.yaml

  - changeSet:
      id: 20251105-01-ddt_righe-add-factor_to_base
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                schemaName: vendite
                tableName: ddt_righe
                columnName: factor_to_base

      changes:
        # Aggiungo il fattore di conversione snapshot usato al momento della riga DDT
        - addColumn:
            schemaName: vendite
            tableName: ddt_righe
            columns:
              - column:
                  name: factor_to_base
                  type: numeric(18,6)
                  defaultValueNumeric: 1
                  remarks: "Snapshot del fattore UoM operativa → UoM base usato sulla riga al momento della generazione."
                  constraints:
                    nullable: false

        
        # Commento esplicativo sulla colonna
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN vendite.ddt_righe.factor_to_base
              IS 'Snapshot del fattore di conversione dalla UoM operativa dell''articolo alla UoM base (catalogo.articoli_uom_operativa.factor_to_base) al momento della riga DDT.';
