databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260224-09-add-attivita-fatturabili-commessa-fk-mctit.yaml

  - changeSet:
      id: 20260224-09-add-attivita-fatturabili-commessa-fk
      author: mctit
      comment: "Aggiunge riferimenti commessa su attivita_fatturabili (transizione nullable)."
      changes:
        - addColumn:
            schemaName: vendite
            tableName: attivita_fatturabili
            columns:
              - column:
                  name: commessa_id
                  type: bigint
                  remarks: "FK testata commessa (nullable in fase transitoria)."
                  constraints:
                    nullable: true
              - column:
                  name: commessa_attivita_id
                  type: bigint
                  remarks: "FK riga commessa (nullable in fase transitoria)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: attivita_fatturabili
            baseColumnNames: commessa_id
            referencedTableSchemaName: vendite
            referencedTableName: commesse
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_attivita_fatturabili_commessa

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: attivita_fatturabili
            baseColumnNames: commessa_attivita_id
            referencedTableSchemaName: vendite
            referencedTableName: commesse_attivita
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_attivita_fatturabili_commessa_attivita

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE INDEX IF NOT EXISTS ix_attivita_fatturabili_commessa_id
                ON vendite.attivita_fatturabili (commessa_id);

              CREATE INDEX IF NOT EXISTS ix_attivita_fatturabili_commessa_attivita_id
                ON vendite.attivita_fatturabili (commessa_attivita_id);
