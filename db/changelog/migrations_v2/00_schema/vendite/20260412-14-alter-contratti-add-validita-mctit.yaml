# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: aggiunge colonna validita + trigger sync +
# backfill + ricreazione GIST per vendite.contratti.
# Usa la funzione generica script.trgfn_set_validita().
# Tabella DB only, nessun impatto backend/frontend.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260412-14-alter-contratti-add-validita-mctit.yaml

  - changeSet:
      id: 20260412-14-alter-contratti-add-validita
      author: mctit
      comment: >
        Migrazione daterange completa per vendite.contratti:
        aggiunge colonna validita, trigger sync (funzione generica),
        backfill, NOT NULL, ricreazione vincolo GIST su colonna nativa.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists: { schemaName: vendite, tableName: contratti, columnName: validita }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- 1. Aggiunge colonna validita
              ALTER TABLE vendite.contratti
                ADD COLUMN validita daterange;

              COMMENT ON COLUMN vendite.contratti.validita
                IS 'Range di validita` calcolato dal trigger sync da valido_dal/valido_al. Non scrivere direttamente.';

              -- 2. Crea trigger usando la funzione generica cross-schema
              DROP TRIGGER IF EXISTS trg_contratti_a20_set_validita_ins_upd ON vendite.contratti;

              CREATE TRIGGER trg_contratti_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON vendite.contratti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();

              -- 3. Backfill righe esistenti (SET esplicito)
              UPDATE vendite.contratti
                 SET validita = daterange(valido_dal, COALESCE(valido_al, 'infinity'::date), '[]')
               WHERE validita IS NULL;

              -- 4. Set NOT NULL
              ALTER TABLE vendite.contratti
                ALTER COLUMN validita SET NOT NULL;

              -- 5. Drop vecchio vincolo EXCLUDE (il backing index viene eliminato automaticamente)
              ALTER TABLE vendite.contratti
                DROP CONSTRAINT IF EXISTS ex_contratti_no_overlap;

              -- 6. Crea nuovo vincolo GIST su colonna nativa
              ALTER TABLE vendite.contratti
                ADD CONSTRAINT ex_contratti_no_overlap
                EXCLUDE USING gist (
                  billing_account_id WITH =,
                  istanza_utility_id WITH =,
                  utility_id WITH =,
                  ambito WITH =,
                  validita WITH &&
                );

      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.contratti
                DROP CONSTRAINT IF EXISTS ex_contratti_no_overlap;
              DROP TRIGGER IF EXISTS trg_contratti_a20_set_validita_ins_upd ON vendite.contratti;
              ALTER TABLE vendite.contratti
                DROP COLUMN IF EXISTS validita;
              ALTER TABLE vendite.contratti
                ADD CONSTRAINT ex_contratti_no_overlap
                EXCLUDE USING gist (
                  billing_account_id WITH =,
                  istanza_utility_id WITH =,
                  utility_id WITH =,
                  ambito WITH =,
                  daterange(valido_dal, COALESCE(valido_al, 'infinity'::date), '[]') WITH &&
                );
