# LE 34 POLICY DI MAGAZZINO, PRATICHE, DOCUMENTI E BILLING ACCOUNT
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5quinquies, D-3b-2 ondata 2.
#
# Come 20261018-33: il perimetro una volta per istruzione, per riga solo la
# risoluzione dell'emittente.
#   - adattatori a emittente singolo: fn_scope_ef_perimetro((SELECT
#     fn_get_emittenti_scope_pk_ids(utente)), fn_resolve_emittente_fiscale_id
#     ('<modo>', chiave));
#   - via_efba (billing_account, clienti, attivita_consumi):
#     fn_scope_ef_perimetro((SELECT fn_get_emittenti_scope_sr_ids(utente)),
#     fn_get_ba_emittente_sr_id(chiave)) — convenzione soggetto_ruolo: il
#     perimetro e l'emittente nella stessa.
# 68 sostituzioni. Gate della veste OPERATORE, USING e WITH CHECK, comando,
# ruoli: invariati. Resta via_coppia (istanze_dati_precontrattuali): la sua
# chiave e' una coppia di colonne, e il risolutore prende un valore solo.
# Generato dal testo vivo di dbdev (2026-10-18). Rollback: i testi di prima.

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261018-50-alter-policy-ef-whitelist-via-ondata-2-mctit.yaml

  - changeSet:
      id: 20261018-50-alter-policy-ef-whitelist-via-ondata-2
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le 34 policy con un adattatore di magazzino, pratiche, documenti o billing account calcolano il perimetro una volta per istruzione. D-3b-2 ondata 2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 34
            sql: >
              SELECT count(*) FROM pg_policies
               WHERE coalesce(qual, '') || coalesce(with_check, '') ~ 'fn_scope_ef_whitelist_via_(asset|documento_generato|efba|evento_asset|flusso|inventario|magazzino|movimento|pratica|rettifica|trasferimento)\('
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_resolve_emittente_fiscale_id(text,bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
