databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260218-06-update-fatturazione-lotti-fatture-stati-mctit.yaml

  - changeSet:
      id: 20260218-06-update-fatturazione-lotti-fatture-stati
      author: mctit
      comment: "Aggiunge stato documento e stato esecuzione su lotti_fatture"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti_fatture
            columns:
              - column:
                  name: stato_doc_fiscale_id
                  type: bigint
                  remarks: "Snapshot stato documento fiscale della fattura nel lotto"
                  constraints:
                    nullable: true
              - column:
                  name: stato_esecuzione
                  type: varchar(16)
                  defaultValue: "OK"
                  remarks: "Stato esecuzione fattura nel lotto (OK|ERRORE)"
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti_fatture
            baseColumnNames: stato_doc_fiscale_id
            referencedTableSchemaName: config
            referencedTableName: stati_doc_fiscale
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_fatturazione_lf_stato_doc_fiscale

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- Backfill stato documento dal record fattura collegato.
              UPDATE vendite.fatturazione_lotti_fatture lf
                 SET stato_doc_fiscale_id = f.stato_doc_fiscale_id
                FROM vendite.fatture f
               WHERE f.id = lf.fattura_id
                 AND lf.stato_doc_fiscale_id IS NULL;

              ALTER TABLE vendite.fatturazione_lotti_fatture
                ADD CONSTRAINT chk_fatturazione_lf_stato_esecuzione
                CHECK (stato_esecuzione IN ('OK', 'ERRORE'));
