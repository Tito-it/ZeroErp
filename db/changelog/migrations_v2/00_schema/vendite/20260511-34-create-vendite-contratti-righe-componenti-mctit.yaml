# DDL tabella vendite.contratti_righe_componenti.
#
# Quarta delle 5 tabelle simmetriche del pattern "righe componenti
# BoM CASO A" (preventivi / ordini / contratti / ddt / consumi).
# Stessa struttura di preventivi_righe_componenti, adattata alla
# sorgente contratti. Riusa le 4 helper generiche script.* introdotte
# con preventivi (20260511-05).
#
# Prerequisito: rename quantita_fissa -> quantita (20260511-31).
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/vendite/20260511-34-create-vendite-contratti-righe-componenti-mctit.yaml

    - changeSet:
          id: 20260511-34-01-create-vendite-contratti-righe-componenti
          author: mctit
          comment: >
              Crea tabella vendite.contratti_righe_componenti.
              Struttura DDL: PK BIGINT IDENTITY, FK ON DELETE CASCADE verso
              contratti_righe, FK verso articoli_componenti/articoli/iva/uom/pratiche,
              UNIQUE (riga_contratto_id, articolo_componente_id),
              CHECK quantita<>0, prezzo_unitario<>0, coeff_qta_snapshot>0,
              origine_prezzo IN (valori resolver v5).
              Pattern BoM CASO A.
          preConditions:
              - onFail: HALT
              - and:
                    - tableExists:
                          schemaName: vendite
                          tableName: contratti_righe
                    - columnExists:
                          schemaName: vendite
                          tableName: contratti_righe
                          columnName: quantita
                    - tableExists:
                          schemaName: catalogo
                          tableName: articoli_componenti
                    - tableExists:
                          schemaName: catalogo
                          tableName: articoli
                    - tableExists:
                          schemaName: config
                          tableName: iva
                    - tableExists:
                          schemaName: catalogo
                          tableName: unita_misura
                    - tableExists:
                          schemaName: pratiche
                          tableName: pratiche
                    - not:
                          - tableExists:
                                schemaName: vendite
                                tableName: contratti_righe_componenti
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE vendite.contratti_righe_componenti (
                            id                              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                                                CONSTRAINT pk_contrighe_comp PRIMARY KEY,
                            riga_contratto_id               BIGINT         NOT NULL,
                            articolo_componente_id          UUID           NOT NULL,
                            componente_id                   UUID           NOT NULL,
                            coeff_qta_snapshot              NUMERIC        NOT NULL,
                            quantita                        NUMERIC        NOT NULL,
                            uom_operativa_id                BIGINT,
                            factor_to_base                  NUMERIC        NOT NULL DEFAULT 1,
                            qta_operativa                   NUMERIC,
                            prezzo_unitario                 NUMERIC        NOT NULL,
                            iva_id                          INTEGER,
                            origine_prezzo                  VARCHAR(30)    NOT NULL,
                            prezzo_resolver_context         JSONB,
                            stato_approvazione_prezzo       config.stato_approvazione_prezzo,
                            pratica_approvazione_prezzo_id  BIGINT,
                            meta                            JSONB          NOT NULL DEFAULT '{}'::jsonb,
                            ordine                          SMALLINT       NOT NULL DEFAULT 0,
                            attivo                          BOOLEAN        NOT NULL DEFAULT TRUE,
                            user_insert                     TEXT           NOT NULL DEFAULT CURRENT_USER,
                            user_update                     TEXT                    DEFAULT CURRENT_USER,
                            data_insert                     TIMESTAMPTZ    NOT NULL DEFAULT now(),
                            data_update                     TIMESTAMPTZ    NOT NULL DEFAULT now(),
                            tx_id                           UUID,

                            CONSTRAINT fk_contrighe_comp_riga
                                FOREIGN KEY (riga_contratto_id)
                                REFERENCES vendite.contratti_righe(id)
                                ON DELETE CASCADE,

                            CONSTRAINT fk_contrighe_comp_articolo_componente
                                FOREIGN KEY (articolo_componente_id)
                                REFERENCES catalogo.articoli_componenti(id),

                            CONSTRAINT fk_contrighe_comp_componente
                                FOREIGN KEY (componente_id)
                                REFERENCES catalogo.articoli(id),

                            CONSTRAINT fk_contrighe_comp_uom
                                FOREIGN KEY (uom_operativa_id)
                                REFERENCES catalogo.unita_misura(id),

                            CONSTRAINT fk_contrighe_comp_iva
                                FOREIGN KEY (iva_id)
                                REFERENCES config.iva(id),

                            CONSTRAINT fk_contrighe_comp_pratica
                                FOREIGN KEY (pratica_approvazione_prezzo_id)
                                REFERENCES pratiche.pratiche(id),

                            CONSTRAINT uq_contrighe_comp_riga_art_comp
                                UNIQUE (riga_contratto_id, articolo_componente_id),

                            CONSTRAINT chk_contrighe_comp_quantita_pos
                                CHECK (quantita <> 0),

                            CONSTRAINT chk_contrighe_comp_prezzo_nonneg
                                CHECK (prezzo_unitario <> 0),

                            CONSTRAINT chk_contrighe_comp_coeff_qta_pos
                                CHECK (coeff_qta_snapshot > 0),

                            CONSTRAINT chk_contrighe_comp_origine
                                CHECK (origine_prezzo IN (
                                    'PROMO',
                                    'CONTRATTO_OVERRIDE',
                                    'CONTRATTO_LISTINO',
                                    'CATEGORIA',
                                    'MANUALE'
                                ))
                        );

                        CREATE INDEX ix_vendite_contrighe_comp_riga
                            ON vendite.contratti_righe_componenti USING btree (riga_contratto_id);

                        CREATE INDEX ix_vendite_contrighe_comp_articolo_componente
                            ON vendite.contratti_righe_componenti USING btree (articolo_componente_id);

                        CREATE INDEX ix_vendite_contrighe_comp_componente
                            ON vendite.contratti_righe_componenti USING btree (componente_id);

                        CREATE INDEX ix_vendite_contrighe_comp_stato_approvazione
                            ON vendite.contratti_righe_componenti USING btree (stato_approvazione_prezzo)
                            WHERE stato_approvazione_prezzo IS NOT NULL;

                        COMMENT ON TABLE vendite.contratti_righe_componenti IS
                            'Componenti BoM CASO A del contratto: una riga per ogni componente '
                            'esposto_in_fattura=TRUE di un articolo composito. Prezzo proprio '
                            'negoziabile (L1/L2/L3). Prezzo padre calcolato da trigger come '
                            'SUM(prezzo_unitario * coeff_qta_snapshot). Snapshot pricing al push.';

                        COMMENT ON COLUMN vendite.contratti_righe_componenti.riga_contratto_id IS
                            'FK alla riga contratto padre (contratti_righe.id) con ON DELETE CASCADE.';

                        COMMENT ON COLUMN vendite.contratti_righe_componenti.componente_id IS
                            'FK all''articolo componente (catalogo.articoli.id). Ridondante rispetto '
                            'ad articoli_componenti.componente_id per query dirette. Coerenza garantita '
                            'dal trigger trgfn_componenti_guard_coerenza_bom.';

                        COMMENT ON COLUMN vendite.contratti_righe_componenti.coeff_qta_snapshot IS
                            'Snapshot di articoli_componenti.coeff_qta al momento della creazione.';

                        COMMENT ON COLUMN vendite.contratti_righe_componenti.origine_prezzo IS
                            'Origine del prezzo (resolver v5): PROMO / CONTRATTO_OVERRIDE / '
                            'CONTRATTO_LISTINO / CATEGORIA / MANUALE.';
          rollback:
              - sql:
                    sql: DROP TABLE IF EXISTS vendite.contratti_righe_componenti CASCADE;
