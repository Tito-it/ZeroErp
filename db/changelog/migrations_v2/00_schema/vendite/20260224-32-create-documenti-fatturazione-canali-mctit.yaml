databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260224-32-create-documenti-fatturazione-canali-mctit.yaml

  - changeSet:
      id: 20260224-32-create-documenti-fatturazione-canali
      author: mctit
      comment: "Registro canali fatturabili uniforme per sorgente (contratti/preventivi/ordini/ddt)."
      changes:
        - createTable:
            schemaName: vendite
            tableName: documenti_fatturazione_canali
            remarks: "Registro stato canali fatturabili per documento sorgente."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documenti_fatturazione_canali
                    nullable: false
              - column:
                  name: sorgente_tipo_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: sorgente_uid
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: canale_codice
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: stato_canale
                  type: varchar(16)
                  defaultValue: "APERTO"
                  constraints:
                    nullable: false
              - column:
                  name: target_sorgente_tipo_id
                  type: bigint
                  constraints:
                    nullable: true
              - column:
                  name: target_sorgente_uid
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: motivo_blocco
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: documenti_fatturazione_canali
            baseColumnNames: sorgente_tipo_id
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_doc_fatt_canali_sorgente_tipo

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: documenti_fatturazione_canali
            baseColumnNames: target_sorgente_tipo_id
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_doc_fatt_canali_target_sorgente_tipo

        - addUniqueConstraint:
            schemaName: vendite
            tableName: documenti_fatturazione_canali
            columnNames: sorgente_tipo_id, sorgente_uid, canale_codice
            constraintName: uq_doc_fatt_canali_sorgente_canale

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- Domini e coerenza campi target.
              -- canale_codice: codice sorgente (config.sorgenti.codice) o valore speciale DIRETTO.
              -- L'esistenza su config.sorgenti viene validata a runtime in funzione.
              ALTER TABLE vendite.documenti_fatturazione_canali
                ADD CONSTRAINT chk_doc_fatt_canali_canale
                CHECK (
                  btrim(canale_codice) <> ''
                  AND canale_codice = upper(canale_codice)
                  AND canale_codice ~ '^[A-Z0-9_]+$'
                );

              ALTER TABLE vendite.documenti_fatturazione_canali
                ADD CONSTRAINT chk_doc_fatt_canali_stato
                CHECK (stato_canale IN ('APERTO', 'CONSUMATO', 'BLOCCATO'));

              ALTER TABLE vendite.documenti_fatturazione_canali
                ADD CONSTRAINT chk_doc_fatt_canali_sorgente_uid_not_blank
                CHECK (btrim(sorgente_uid) <> '');

              ALTER TABLE vendite.documenti_fatturazione_canali
                ADD CONSTRAINT chk_doc_fatt_canali_target_pair
                CHECK (
                  (target_sorgente_tipo_id IS NULL AND target_sorgente_uid IS NULL)
                  OR
                  (target_sorgente_tipo_id IS NOT NULL AND target_sorgente_uid IS NOT NULL AND btrim(target_sorgente_uid) <> '')
                );

              -- Se BLOCCATO, motivo_blocco obbligatorio.
              ALTER TABLE vendite.documenti_fatturazione_canali
                ADD CONSTRAINT chk_doc_fatt_canali_motivo_blocco
                CHECK (
                  stato_canale <> 'BLOCCATO'
                  OR (motivo_blocco IS NOT NULL AND btrim(motivo_blocco) <> '')
                );

              -- Un solo canale APERTO per documento sorgente.
              CREATE UNIQUE INDEX IF NOT EXISTS uq_doc_fatt_canali_un_aperto
                ON vendite.documenti_fatturazione_canali (sorgente_tipo_id, sorgente_uid)
                WHERE stato_canale = 'APERTO';

              CREATE INDEX IF NOT EXISTS ix_doc_fatt_canali_sorgente
                ON vendite.documenti_fatturazione_canali (sorgente_tipo_id, sorgente_uid);

              CREATE INDEX IF NOT EXISTS ix_doc_fatt_canali_stato_canale
                ON vendite.documenti_fatturazione_canali (stato_canale, canale_codice);
