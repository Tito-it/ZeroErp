databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20251103-11-ordini_righe-add-uom_qta_operativa-mctit.yaml

  - changeSet:
      id: 20251103-11-ordini_righe-add-uom_qta_operativa-mctit.yaml
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: vendite
              tableName: ordini_righe
              columnName: qta_operativa  

      changes:
        - addColumn:
           schemaName: vendite
           tableName: ordini_righe
           columns:
             - column:
                 name: qta_operativa
                 type: numeric(18,6)
                 remarks: "Quantità convertita nella UoM operativa articolo"
             - column: { name: uom_operativa_id, type: BIGINT, remarks: "Unità di misura operativa (catalogo.unita_misura.id)" }

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: ordini_righe
            baseColumnNames: uom_operativa_id
            constraintName: fk_ordini_vendita_r_uom_operativa
            referencedTableSchemaName: catalogo
            referencedTableName: unita_misura
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
      
        
        
        - sql:
              splitStatements: false
              sql: |
                  -- Check validità e valori ammessi
                  ALTER TABLE vendite.ordini_righe
                  ADD CONSTRAINT check_ordini_righe_qta_operativa_pos
                  CHECK ( qta_operativa > 0);

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN vendite.ordini_righe.uom_operativa_id IS 'UoM dichiarata in riga ordine (snapshot operativa).';
              COMMENT ON COLUMN vendite.ordini_righe.qta_operativa     IS 'Quantità nella UoM operativa; qta (base) calcolata via trigger.';

      
        - sql:
              splitStatements: false
              sql: |
                 ALTER TABLE IF EXISTS vendite.ordini_righe 
                 DROP CONSTRAINT 
                 IF EXISTS fk_ordrig_uom;

  
        - dropColumn:
              schemaName: vendite
              tableName: ordini_righe
              columns:
                - column:
                    name: uom_id
          