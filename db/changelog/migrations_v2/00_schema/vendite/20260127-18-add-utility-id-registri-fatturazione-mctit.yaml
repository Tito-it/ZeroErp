# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260127-18-add-utility-id-registri-fatturazione-mctit.yaml

  - changeSet:
      id: 20260127-18-add-utility-id-registri-fatturazione
      author: mctit
      comment: "Aggiunge utility_id e rende emittente_fiscale opzionale"
      changes:
        - dropNotNullConstraint:
            schemaName: vendite
            tableName: registri_fatturazione
            columnName: emittente_soggetto_ruolo_id
            columnDataType: bigint

        - addColumn:
            schemaName: vendite
            tableName: registri_fatturazione
            columns:
              - column:
                  name: utility_id
                  type: integer
                  remarks: "Utility opzionale associata al registro."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: registri_fatturazione
            baseColumnNames: utility_id
            constraintName: fk_registri_fatturazione_utility
            referencedTableSchemaName: config
            referencedTableName: utilities
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
