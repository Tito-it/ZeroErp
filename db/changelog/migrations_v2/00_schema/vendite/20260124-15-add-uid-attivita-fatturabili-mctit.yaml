databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260124-15-add-uid-attivita-fatturabili-mctit.yaml

  - changeSet:
      id: 20260124-15-add-uid-attivita-fatturabili
      author: mctit
      comment: "Aggiunge uid univoco su vendite.attivita_fatturabili"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: attivita_fatturabili
            columns:
              - column:
                  name: uid
                  type: uuid
                  defaultValueComputed: "uuidv7()"
                  remarks: "UID univoco (idempotenza applicativa)."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: vendite
            tableName: attivita_fatturabili
            columnNames: uid
            constraintName: uq_attivita_fatturabili_uid
