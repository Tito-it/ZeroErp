# ------------------------------------------------------------
# Unificazione nome colonna sconto di riga (1/3): vendite.ordini_righe.
#
# Why: lo stesso concetto (sconto % di riga) aveva due nomi tra tabelle gemelle
#   vendite — ordini/fatture usavano `sconto_perc`, preventivi `sconto_percentuale`
#   (con DEFAULT 0). Si unifica su `sconto_percentuale` (nome esplicito, gia'
#   adottato da preventivi) e si allinea il DEFAULT a 0.
#   ZeroErp non e' in produzione: rename diretto, nessun alias di compatibilita'.
#
# Ordine: i dipendenti (vista vw_ordini_righe_iva_base, fn_offerta_righe_espanse)
#   vengono ricreati col nuovo nome nei changeSet 20260605-16/17 (numerazione
#   successiva → girano dopo questo rename). Il RENAME COLUMN propaga
#   automaticamente nei riferimenti interni delle viste dipendenti.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260605-13-rename-ordini-righe-sconto-percentuale-mctit.yaml

  - changeSet:
      id: 20260605-13-rename-ordini-righe-sconto-percentuale
      author: mctit
      comment: >
        vendite.ordini_righe: RENAME sconto_perc -> sconto_percentuale,
        SET DEFAULT 0, RENAME CONSTRAINT chk_ordini_v_r_sconto_perc ->
        chk_ordini_v_r_sconto. Unificazione nome/default sconto di riga.
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            schemaName: vendite
            tableName: ordini_righe
            columnName: sconto_perc
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE vendite.ordini_righe
                  RENAME COLUMN sconto_perc TO sconto_percentuale;

              ALTER TABLE vendite.ordini_righe
                  ALTER COLUMN sconto_percentuale SET DEFAULT 0;

              ALTER TABLE vendite.ordini_righe
                  RENAME CONSTRAINT chk_ordini_v_r_sconto_perc TO chk_ordini_v_r_sconto;

              COMMENT ON COLUMN vendite.ordini_righe.sconto_percentuale
                  IS 'Sconto percentuale di riga (0-100). Default 0. Unificato 2026-06-05.';
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE vendite.ordini_righe
                  RENAME CONSTRAINT chk_ordini_v_r_sconto TO chk_ordini_v_r_sconto_perc;
              ALTER TABLE vendite.ordini_righe
                  ALTER COLUMN sconto_percentuale DROP DEFAULT;
              ALTER TABLE vendite.ordini_righe
                  RENAME COLUMN sconto_percentuale TO sconto_perc;
