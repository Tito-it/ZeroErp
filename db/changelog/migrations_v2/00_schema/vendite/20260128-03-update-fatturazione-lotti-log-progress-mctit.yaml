databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260128-03-update-fatturazione-lotti-log-progress-mctit.yaml

  - changeSet:
      id: 20260128-03-update-fatturazione-lotti-log-progress
      author: mctit
      comment: "Estende log lotti per progressi pipeline (fase + stato_doc_fiscale)"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti_log
            columns:
              - column:
                  name: fase
                  type: text
                  remarks: "Fase/step descrittivo per il progresso pipeline."
                  constraints:
                    nullable: true

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatturazione_lotti_log
                DROP CONSTRAINT IF EXISTS chk_fatturazione_lotti_log_status;

              ALTER TABLE vendite.fatturazione_lotti_log
                ADD CONSTRAINT chk_fatturazione_lotti_log_status
                CHECK (status IN ('I','W','C'));

  - changeSet:
      id: 20260128-03-01-update-fatturazione-lotti-log-progress
      author: mctit
      comment: "Estende log lotti per progressi pipeline (fase + stato_doc_fiscale)"
      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatturazione_lotti_log
            columns:
              - column:
                  name: stato_doc_fiscale_id
                  type: bigint
                  remarks: "FK -> config.stati_doc_fiscale.id (step lotto)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti_log
            baseColumnNames: stato_doc_fiscale_id
            constraintName: fk_fatturazione_lotti_log_stato_doc_fiscale
            referencedTableSchemaName: config
            referencedTableName: stati_doc_fiscale
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
