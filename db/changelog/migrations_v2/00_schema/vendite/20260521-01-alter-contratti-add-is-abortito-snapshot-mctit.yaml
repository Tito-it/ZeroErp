#
# Step 1/3 — pattern is_abortito_snapshot + validita_attiva su vendite.contratti.
#
# Aggiunge is_abortito_snapshot: colonna bool denormalizzata che riflette
# config.stati_doc_contratti.is_abortito per la riga corrente.
# E' necessaria perche' le colonne GENERATED ALWAYS STORED non possono
# referenziare altre tabelle: is_abortito deve essere disponibile sulla
# stessa riga per essere usato da validita_attiva (Step 3/3).
#
# Backfill: aggiorna tutte le righe esistenti dalla tabella stati.
# In produzione tutte le righe sono DRAFT/ATTIVO/CESSATO (is_abortito=false):
# il backfill e' no-op sui dati attuali ma rende la migration robusta
# contro eventuali backfill futuri o ambienti di staging con dati diversi.
#
# Dipendenza: migration 20260520-08 (stato ANNULLATO + colonna is_abortito
# su config.stati_doc_contratti) deve essere gia' applicata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260521-01-alter-contratti-add-is-abortito-snapshot-mctit.yaml

  - changeSet:
      id: 20260521-01-alter-contratti-add-is-abortito-snapshot
      author: mctit
      comment: >
        Step 1/3: aggiunge is_abortito_snapshot a vendite.contratti.
        Colonna denormalizzata mantenuta da trigger (step 2/3), prerequisito
        per la colonna GENERATED validita_attiva (step 3/3).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: contratti
            - columnExists:
                schemaName: config
                tableName: stati_doc_contratti
                columnName: is_abortito
            - not:
                - columnExists:
                    schemaName: vendite
                    tableName: contratti
                    columnName: is_abortito_snapshot
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.contratti
                  ADD COLUMN is_abortito_snapshot BOOLEAN NOT NULL DEFAULT false;

              COMMENT ON COLUMN vendite.contratti.is_abortito_snapshot IS
                  'Snapshot denormalizzato di config.stati_doc_contratti.is_abortito. '
                  'Mantenuto da trg_contratti_z90_sync_is_abortito_snapshot_ins_upd (BEFORE). '
                  'Usato dalla colonna GENERATED validita_attiva per produrre '
                  '''empty''::daterange sulle righe abortite, escludendole dal '
                  'constraint UNIQUE WITHOUT OVERLAPS. Non modificare direttamente. '
                  'rev 2026-05-21.';

              -- Backfill: allinea tutte le righe esistenti al valore corrente degli stati.
              UPDATE vendite.contratti c
                 SET is_abortito_snapshot = sdc.is_abortito
                FROM config.stati_doc_contratti sdc
               WHERE sdc.id = c.stato_doc_contratto_id;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.contratti
                  DROP COLUMN IF EXISTS is_abortito_snapshot;
