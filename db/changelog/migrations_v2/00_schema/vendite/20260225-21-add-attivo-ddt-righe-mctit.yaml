databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260225-21-add-attivo-ddt-righe-mctit.yaml

  - changeSet:
      id: 20260225-21-add-attivo-ddt-righe
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: vendite
                tableName: ddt_righe
                columnName: attivo
      changes:
        - addColumn:
            schemaName: vendite
            tableName: ddt_righe
            columns:
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
                  remarks: "Flag riga attiva/non attiva"
        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN vendite.ddt_righe.attivo
                IS 'Flag riga attiva/non attiva';
