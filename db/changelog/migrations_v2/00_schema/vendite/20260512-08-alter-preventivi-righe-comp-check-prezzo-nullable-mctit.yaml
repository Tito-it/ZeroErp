# ------------------------------------------------------------
# ALTER vendite.preventivi_righe_componenti — CHECK prezzo nullable.
#
# Why: il CHECK originale (prezzo_unitario <> 0) non ammette NULL.
# Il nuovo pattern "pending valorizzazione" richiede prezzo_unitario
# = NULL per i componenti in attesa di valorizzazione manuale
# (fn_preventivo_riga_componenti_init con p_force_manuale=TRUE).
# Invariante di dominio: prezzo_unitario IS NULL (pending) oppure <> 0
# (valorizzato). Il valore 0 resta vietato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260512-08-alter-preventivi-righe-comp-check-prezzo-nullable-mctit.yaml

  - changeSet:
      id: 20260512-08-alter-preventivi-righe-comp-check-prezzo-nullable
      author: mctit
      comment: >
        Modifica CHECK chk_prevrighe_comp_prezzo_nonneg su
        preventivi_righe_componenti: da (prezzo_unitario <> 0) a
        (prezzo_unitario IS NULL OR prezzo_unitario <> 0).
        NULL = componente pending valorizzazione manuale autorizzata.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: preventivi_righe_componenti
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vendite.preventivi_righe_componenti
                DROP CONSTRAINT chk_prevrighe_comp_prezzo_nonneg;

              ALTER TABLE vendite.preventivi_righe_componenti
                ADD CONSTRAINT chk_prevrighe_comp_prezzo_nonneg
                CHECK (prezzo_unitario IS NULL OR prezzo_unitario <> 0);
