              - column:
                  name: codice
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: codice_interno
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: descrizione
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: JSONB
                  defaultValue: "{}"
                  constraints:
                    nullable: false
              - column:
                  name: attivo
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: TIMESTAMPTZ
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: TEXT
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: TIMESTAMPTZ
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: TEXT
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: vendite
            tableName: tipi_fondi_fattura
            columnNames: codice
            constraintName: uq_tipi_fondi_fattura_codice
