#
# Estende rls_preventivi_ef_whitelist da FOR SELECT a FOR ALL aggiungendo
# WITH CHECK identico alla USING. Sblocca le scritture dell'operatore dopo
# l'attivazione RLS (ENABLE 20260601-39): senza WITH CHECK ogni INSERT/UPDATE
# falliva con "new row violates row-level security policy". Nome policy
# invariato (registry config.scope_policy referenzia per nome).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260603-16-extend-policy-rls-preventivi-ef-whitelist-for-all-mctit.yaml

  - changeSet:
      id: 20260603-16-extend-policy-rls-preventivi-ef-whitelist-for-all
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Estende rls_preventivi_ef_whitelist a FOR ALL con WITH CHECK = USING
        (adapter PK fn_scope_ef_whitelist su emittente_fiscale_id, gate
        OPERATORE). Copre INSERT/UPDATE/DELETE in aggiunta alla SELECT.
        Coerente con il guard BEFORE trgfn_guard_emittente_scope gia' presente
        (defense-in-depth, stessa canonica). Idempotente (DROP+CREATE).
      preConditions:
        - onFail: HALT
        - and:
          - columnExists: { schemaName: vendite, tableName: preventivi, columnName: emittente_fiscale_id }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                 WHERE n.nspname='script' AND p.proname='fn_scope_ef_whitelist';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP POLICY IF EXISTS rls_preventivi_ef_whitelist ON vendite.preventivi;

              CREATE POLICY rls_preventivi_ef_whitelist ON vendite.preventivi
                  AS PERMISSIVE
                  FOR ALL
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_fiscale_id
                      )
                  )
                  WITH CHECK (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_fiscale_id
                      )
                  );

              COMMENT ON POLICY rls_preventivi_ef_whitelist ON vendite.preventivi IS
                  'RLS operatore: vede/scrive solo preventivi con emittente in '
                  'whitelist (adapter PK fn_scope_ef_whitelist -> canonica). '
                  'FOR ALL con WITH CHECK = USING: copre SELECT + INSERT/UPDATE/DELETE.';
      rollback:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Ripristina la versione FOR SELECT (sola lettura).
              DROP POLICY IF EXISTS rls_preventivi_ef_whitelist ON vendite.preventivi;
              CREATE POLICY rls_preventivi_ef_whitelist ON vendite.preventivi
                  AS PERMISSIVE
                  FOR SELECT
                  USING (
                      current_setting('app.ruolo_applicativo', true) = 'OPERATORE'
                      AND script.fn_scope_ef_whitelist(
                          NULLIF(current_setting('app.current_user_id', true), '')::integer,
                          emittente_fiscale_id
                      )
                  );
