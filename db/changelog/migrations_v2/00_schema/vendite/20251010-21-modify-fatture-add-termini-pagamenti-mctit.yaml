databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20251010-21-modify-fatture-add-termini-pagamenti-mctit.yaml

  - changeSet:
      id: 20251010-22-modify-fatture-add-termini-pagamenti
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: vendite
              tableName: fatture
              columnName: termine_pagamento_id


      changes:
        - addColumn:
            schemaName: vendite
            tableName: fatture
            columns:
              - column: { name: termine_pagamento_id, type: BIGINT }
              - column: { name: termine_pagamento_snapshot, type: JSONB, remarks: "Snapshot del piano utilizzato per generare le scadenze" }
        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatture
            baseColumnNames: termine_pagamento_id
            referencedTableSchemaName: config
            referencedTableName: termini_pagamento
            referencedColumnNames: id
            constraintName: fk_fatture_termini_pagamento
            onDelete: SET NULL
            onUpdate: CASCADE        
