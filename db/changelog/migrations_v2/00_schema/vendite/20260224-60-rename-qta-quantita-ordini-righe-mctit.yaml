databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260225-60-rename-qta-quantita-ordini-righe-mctit.yaml

  - changeSet:
      id: 20260225-60-rename-qta-quantita-ordini-righe
      author: mctit
      comment: "Rinomina ordini_righe.qta -> quantita per allineamento con preventivi_righe e ddt_righe."
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - columnExists:
            schemaName: vendite
            tableName: ordini_righe
            columnName: qta
      changes:
        - renameColumn:
            schemaName: vendite
            tableName: ordini_righe
            oldColumnName: qta
            newColumnName: quantita
            columnDataType: "NUMERIC(18,6)"
            remarks: "Quantità base (derivata da qta_operativa * factor_to_base via trigger)"

        - sql:
            splitStatements: false
            sql: |
              COMMENT ON COLUMN vendite.ordini_righe.quantita
                IS 'Quantità base normalizzata (derivata da qta_operativa × factor_to_base via trigger).';
