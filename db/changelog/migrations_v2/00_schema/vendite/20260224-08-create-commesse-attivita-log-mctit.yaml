              - column:
                  name: commessa_attivita_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: evento
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: dettaglio
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: tx_id
                  type: uuid
                  constraints:
                    nullable: true
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
