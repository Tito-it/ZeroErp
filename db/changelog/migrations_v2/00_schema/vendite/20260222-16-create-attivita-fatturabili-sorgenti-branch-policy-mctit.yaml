databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260222-16-create-attivita-fatturabili-sorgenti-branch-policy-mctit.yaml

  - changeSet:
      id: 20260222-16-create-attivita-fatturabili-sorgenti-branch-policy
      author: mctit
      comment: "Matrice sorgente -> branch/policy per pipeline attivita_fatturabili."
      changes:
        - createTable:
            schemaName: vendite
            tableName: attivita_fatturabili_sorgenti_branch_policy
            remarks: "Mappa sorgenti config verso branch/policy runtime del dominio attivita."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_attivita_fatt_sorgenti_branch_policy
                    nullable: false
              - column:
                  name: sorgente_tipo_id
                  type: bigint
                  remarks: "FK a config.sorgenti.id."
                  constraints:
                    nullable: false
              - column:
                  name: branch_code
                  type: varchar(32)
                  remarks: "Branch logico target (es. PREVENTIVI, ORDINI, CONSUMI)."
                  constraints:
                    nullable: false
              - column:
                  name: abilitata
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se true la sorgente e` processabile in pipeline attivita."
                  constraints:
                    nullable: false
              - column:
                  name: acquisizione_mode
                  type: varchar(8)
                  defaultValue: "PUSH"
                  remarks: "Modalita` ingest sorgente (PUSH|PULL)."
                  constraints:
                    nullable: false
              - column:
                  name: block_scope
                  type: varchar(16)
                  defaultValue: "BRANCH"
                  remarks: "Scope blocco default associato alla sorgente (BRANCH|GLOBAL)."
                  constraints:
                    nullable: false
              - column:
                  name: priorita
                  type: smallint
                  defaultValueNumeric: 100
                  remarks: "Priorita` risoluzione policy (valore minore = priorita` alta)."
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estesi policy sorgente."
                  constraints:
                    nullable: false
              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Record attivo."
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Data inserimento."
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente inserimento."
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Data aggiornamento."
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente aggiornamento."
                  constraints:
                    nullable: false
              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction ID."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: attivita_fatturabili_sorgenti_branch_policy
            baseColumnNames: sorgente_tipo_id
            referencedTableSchemaName: config
            referencedTableName: sorgenti
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_attivita_fatt_sorgenti_branch_policy_sorgente

        - addUniqueConstraint:
            schemaName: vendite
            tableName: attivita_fatturabili_sorgenti_branch_policy
            columnNames: sorgente_tipo_id
            constraintName: uq_attivita_fatt_sorgenti_branch_policy_sorgente

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              ALTER TABLE vendite.attivita_fatturabili_sorgenti_branch_policy
                ADD CONSTRAINT chk_attivita_fatt_sorgenti_branch_policy_block_scope
                CHECK (block_scope IN ('BRANCH', 'GLOBAL'));

              ALTER TABLE vendite.attivita_fatturabili_sorgenti_branch_policy
                ADD CONSTRAINT chk_attivita_fatt_sorgenti_branch_policy_acquisizione_mode
                CHECK (acquisizione_mode IN ('PUSH', 'PULL'));

              ALTER TABLE vendite.attivita_fatturabili_sorgenti_branch_policy
                ADD CONSTRAINT chk_attivita_fatt_sorgenti_branch_policy_priorita
                CHECK (priorita > 0);

              CREATE INDEX IF NOT EXISTS ix_attivita_fatt_sorgenti_branch_policy_branch
                ON vendite.attivita_fatturabili_sorgenti_branch_policy (branch_code);

              CREATE INDEX IF NOT EXISTS ix_attivita_fatt_sorgenti_branch_policy_abilitata
                ON vendite.attivita_fatturabili_sorgenti_branch_policy (abilitata)
                WHERE attivo IS TRUE;
