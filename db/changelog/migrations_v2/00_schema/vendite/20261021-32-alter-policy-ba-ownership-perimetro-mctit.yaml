# LE 16 POLICY DEL CLIENTE CALCOLANO IL PERIMETRO UNA VOLTA PER ISTRUZIONE
#   Brief: brief-db-perimetro-una-volta-famiglie-residue §6 (giro 2).
#
# Le policy che chiamavano fn_scope_ba_ownership, _via_fattura e
# _via_fattura_sdi (15 del portale, CLIENTE_PORTALE, e rls_billing_account_shop,
# SHOP_CUSTOMER) prendono la forma dell'operatore (linee-guida-sql §10.3):
#   fn_scope_sr_perimetro(
#       (SELECT fn_get_identita_sr_perimetro(identita, ARRAY['<veste del gate>'])),
#       <cliente della riga>)
# Il cliente della riga:
#   - billing_account: la sua colonna soggetto_ruolo_id (il BA E' la riga);
#   - billing_account_id: fn_resolve_controparte_sr_id('billing_account', ...);
#   - fattura_id / target_id della nota: modo 'fattura';
#   - fattura_sdi_id: modo 'fattura_sdi'.
# ⭐ Stesse risposte nel percorso reale. La sola differenza: il perimetro
#   pretende che l'identita' sia nella veste del GATE della policy, mentre
#   fn_scope_ba_ownership accettava le due vesti di cliente (e via_fattura
#   nessun controllo). Il middleware imposta app.ruolo_applicativo e
#   app.current_identita_id dalla stessa riga di identita_digitali, quindi
#   le due coincidono; un contesto incoerente da' ora zero righe.
# Gate, comando, ruoli, filtro canale: invariati. Generato dal testo vivo di
# dbdev (2026-10-21). Rollback: i testi di prima.

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20261021-32-alter-policy-ba-ownership-perimetro-mctit.yaml

  - changeSet:
      id: 20261021-32-alter-policy-ba-ownership-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le 16 policy di cliente su billing account, clienti e fatture calcolano il perimetro dell'identita' una volta per istruzione e per riga risolvono solo il cliente. Giro 2 di brief-db-perimetro-una-volta-famiglie-residue.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 16
            sql: >
              SELECT count(*) FROM pg_policies
               WHERE coalesce(qual, '') || coalesce(with_check, '') ~ 'fn_scope_ba_ownership'
        - sqlCheck:
            expectedResult: 3
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid IN (to_regprocedure('script.fn_get_identita_sr_perimetro(bigint,config.ruolo_applicativo[])'),
                             to_regprocedure('script.fn_scope_sr_perimetro(bigint,bigint)'),
                             to_regprocedure('script.fn_resolve_controparte_sr_id(text,bigint)'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER POLICY rls_billing_account_self_ownership ON anagrafiche.billing_account
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), soggetto_ruolo_id)));

              ALTER POLICY rls_billing_account_shop ON anagrafiche.billing_account
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'SHOP_CUSTOMER'::text) AND (canale_origine = 'SHOP'::config.canale_origine) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['SHOP_CUSTOMER'::config.ruolo_applicativo])), soggetto_ruolo_id)));

              ALTER POLICY rls_clienti_self_ownership ON anagrafiche.clienti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('billing_account'::text, billing_account_id))));

              ALTER POLICY rls_fatture_ba_ownership ON vendite.fatture
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('billing_account'::text, billing_account_id))));

              ALTER POLICY rls_fatture_atti_ba_ownership ON vendite.fatture_atti
                  USING (((current_setting('app.ruolo_applicativo'::text, true) = 'CLIENTE_PORTALE'::text) AND script.fn_scope_sr_perimetro((SELECT script.fn_get_identita_sr_perimetro((NULLIF(current_setting('app.current_identita_id'::text, true), ''::text))::bigint, ARRAY['CLIENTE_PORTALE'::config.ruolo_applicativo])), script.fn_resolve_controparte_sr_id('fattura'::text, fattura_id))));

