# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260124-16-create-fatturazione-lotti-log-mctit.yaml

  - changeSet:
      id: 20260124-16-create-fatturazione-lotti-log
      author: mctit
      comment: "Log dedicato ai lotti di fatturazione"
      changes:
        - createTable:
            schemaName: vendite
            tableName: fatturazione_lotti_log
            remarks: "Log per processi lotto fatturazione (warning/critical)."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_fatturazione_lotti_log
                    nullable: false

              - column:
                  name: lotto_id
                  type: bigint
                  remarks: "FK -> vendite.fatturazione_lotti.id"
                  constraints:
                    nullable: false

              - column:
                  name: data_ora
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp evento."
                  constraints:
                    nullable: false

              - column:
                  name: messaggio
                  type: text
                  remarks: "Messaggio log."
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: character
                  defaultValue: "W"
                  remarks: "W=warning, C=critical."
                  constraints:
                    nullable: false

              - column:
                  name: disabilitato
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "TRUE se log disabilitato da operatore."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente ultima modifica (audit)."
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: vendite
            baseTableName: fatturazione_lotti_log
            baseColumnNames: lotto_id
            constraintName: fk_fatturazione_lotti_log_lotto
            referencedTableSchemaName: vendite
            referencedTableName: fatturazione_lotti
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatturazione_lotti_log
                ADD CONSTRAINT chk_fatturazione_lotti_log_status
                CHECK (status IN ('W','C'));

              COMMENT ON TABLE vendite.fatturazione_lotti_log
                IS 'Log per processi lotto fatturazione (warning/critical).';
