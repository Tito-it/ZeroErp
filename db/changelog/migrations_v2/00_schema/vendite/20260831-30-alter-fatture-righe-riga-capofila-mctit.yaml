# `vendite.fatture_righe.riga_capofila_id` — LA RIGA CHE SI SPEZZA
#   voce 5 di brief-db-richieste-aperte-dal-backend, decisione N3 (opzione a')
#   del piano brief-be-fe-iva-fase-3-consumatori-risolutore §3
#
# ── PERCHE' UNA RIGA SI SPEZZA, E PERCHE' NON SI PUO' EVITARE ────────
#
#   In fattura il risolutore IVA riceve l'imponibile VERO, quindi puo'
#   restituire DUE parti: la quota che il plafond del titolo copre, e il resto.
#   Una riga FatturaPA porta UNA `AliquotaIVA` e UNA `Natura`: due trattamenti
#   sullo stesso imponibile sono due `DettaglioLinee`, PER OBBLIGO DI FORMATO.
#   ⇒ La spezzatura non si puo' evitare: si puo' solo decidere chi la regge.
#
# ── LA FORMA SCELTA (N3, opzione a') ─────────────────────────────────
#
#   Le due parti sono DUE `fatture_righe` in relazione padre/figlia, e
#   `attivita_fatturabili.fattura_riga_id` continua a puntare la CAPOFILA.
#   Dall'attivita' si raggiunge la capofila, dalla capofila le sue parti.
#   ⭐ Nessuna modifica a `attivita_fatturabili`, nessuna unique violata, e
#   `fatturato` — GENERATED ALWAYS AS (fattura_riga_id IS NOT NULL) — resta
#   `true` da se'.
#
#   ⛔ Scartata la strada «si spezza l'attivita' a monte»: il modello non la
#   ammette, e sono DUE presidi indipendenti — `uq_attivita_fatturabili_commessa_attivita`
#   (una AF per riga di commessa) e `trgfn_attivita_fatturabili_guard_quantita_immutabile`
#   (la quantita' dell'AF specchia la commessa madre). L'attivita' fatturabile
#   E' lo specchio 1:1 della riga di commessa, e spezzarla vorrebbe dire che lo
#   specchio smette di essere uno specchio.
#
# ── ⛔ PERCHE' NON SI RIUSANO LE COLONNE DEL KIT ─────────────────────
#
#   `kit_key` dice «queste righe vengono dallo stesso kit venduto». Una riga
#   spezzata dal plafond non viene da nessun kit, e marcarla cosi' farebbe
#   leggere al prossimo — e a `vw_fattura_righe_esposte`, che le AGGREGA — un
#   fatto che non e' vero. ⚠️ E aggregarle sarebbe il danno: due parti fuse in
#   una riga esposta producono UN solo DettaglioLinee, cioe' cancellano la
#   ragione per cui la riga si e' spezzata.
#
# ── LE DUE INVARIANTI, E PERCHE' SONO IMPOSTE IN MODI DIVERSI ────────
#
#   Sono le due che, se violate, NON darebbero nessun sintomo.
#
#   1) ⭐ **STESSA FATTURA — e' un VINCOLO** (decisione D, Tid 2026-08-31).
#      La FK non punta «a una riga»: punta «a una riga E alla sua fattura».
#
#          FK (riga_capofila_id, fattura_id) -> fatture_righe (id, fattura_id)
#
#      Una parte che puntasse a una riga di un altro documento e' un totale che
#      non torna su due fatture insieme, e nessuna somma va in errore.
#      ⭐ E' un vincolo e non un guard di proposito: un guard e' codice, e il
#      codice si spegne, si sostituisce, si scavalca. Qui il database non lascia
#      scrivere la riga sbagliata.
#      ⭐ Con MATCH SIMPLE — il default — quando `riga_capofila_id` e' NULL il
#      vincolo NON si applica: le righe ordinarie, che sono la quasi totalita',
#      non pagano niente.
#      ⚠️ Il bersaglio e' `uq_fatture_righe_id_fattura`, che e' RIDONDANTE — `id`
#      e' gia' la PK — e comparira' in `dbops.vw_duplicate_indexes`. E' il prezzo
#      del vincolo, dichiarato: non e' una svista da «semplificare». La rete c'e'
#      comunque, perche' la seconda guardia di `apply_fk_index_policy()` rifiuta
#      il DROP di un indice che sostiene un constraint.
#
#   2) **NIENTE CATENE — resta un TRIGGER** (20260831-31), perche' non c'e'
#      alternativa: per verificarla bisogna guardare la riga PUNTATA e vedere se
#      lei a sua volta punta a qualcuno, e nessun vincolo di PostgreSQL sa fare
#      questa domanda. ⛔ Esiste un modo per renderla strutturale, ma costa una
#      colonna artificiale il cui unico scopo e' ingannare il meccanismo dei
#      vincoli: il prossimo lettore non capirebbe cosa sta guardando. Scartato.
#
#   Il `CHECK` non-se-stessa e' il terzo, e costa nulla: chiude il cappio a un
#   nodo, che il trigger dovrebbe altrimenti trattare come caso a parte.
#   ⭐ E' il calco esatto di `chk_fatture_righe_rettificata_non_se_stessa`
#   (20260818-27), che e' la FK gemella per forma su questa stessa tabella.
#
# ── ⚠️ IL MOMENTO IN CUI IL BACKEND SPEZZA ──────────────────────────
#
#   La spezzatura deve avvenire mentre la fattura e' ancora sotto la soglia di
#   congelamento. `trgfn_fattura_satellite_guard_congelamento` legge lo stato
#   VIVO al momento della scrittura: in una transazione che porta prima a
#   DEFINITIVA e poi scrive le righe, il guard vede `congela_fiscale = t` e
#   rifiuta. Sequenza obbligata: risolvi -> spezza -> consuma il plafond ->
#   porta a DEFINITIVA.
#
# ── ⚠️ CHI SOMMA DEVE ANDARE CAPOFILA -> PARTI ──────────────────────
#
#   Chi legge un IMPORTO per attivita' attraversando `fattura_riga_id` deve
#   scendere alle parti e sommare. Una lettura che si ferma alla capofila vede
#   meta' valore, E NON FALLISCE. E' la sola cosa che questa forma chiede in
#   cambio, ed e' scritta anche nel COMMENT della colonna.
#
# ── ⚠️ LA GEMELLA IN `storico` ──────────────────────────────────────
#
#   `storico.fatture_righe` esiste e prende la colonna nuova dall'automazione di
#   provisioning, che gira in contesto `ci_apply` o col job serale delle 21:00.
#
# Dipendenze: nessuna oltre vendite.fatture_righe.
# Consumatori: 20260831-31 (il guard anti-catena), 20260831-32 (la vista),
#              20260831-33 (il seed degli indici FK).
# Verifica: db/pgtap/vendite/test-fatture-righe-capofila-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/vendite/20260831-30-alter-fatture-righe-riga-capofila-mctit.yaml

  - changeSet:
      id: 20260831-30-alter-fatture-righe-riga-capofila
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.fatture_righe.riga_capofila_id: la sede del legame fra le due parti
        di una riga spezzata dal plafond (N3, opzione a'). NULL sulla capofila,
        valorizzata sulle parti. ⭐ La FK e' COMPOSITA su (riga_capofila_id,
        fattura_id): «la parte e la sua capofila stanno sulla stessa fattura»
        diventa un vincolo che il database non lascia violare, invece di un guard
        che si puo' spegnere — e con MATCH SIMPLE non si applica quando la colonna
        e' NULL, cioe' sul caso ordinario. Piu' il CHECK non-se-stessa, calco di
        chk_fatture_righe_rettificata_non_se_stessa. ⚠️ uq_fatture_righe_id_fattura
        e' un indice RIDONDANTE (id e' gia' la PK) e comparira' in
        dbops.vw_duplicate_indexes: e' il prezzo del vincolo, non una svista.
        L'invariante «niente catene» resta un trigger (20260831-31), perche'
        nessun vincolo sa guardare la riga puntata.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: fatture_righe
            - not:
                - columnExists:
                    schemaName: vendite
                    tableName: fatture_righe
                    columnName: riga_capofila_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ %TYPE non e' valido in ALTER TABLE ADD COLUMN: tipo esplicito.
              ALTER TABLE vendite.fatture_righe
                  ADD COLUMN riga_capofila_id bigint;

              -- Bersaglio della FK composita. ⚠️ RIDONDANTE per costruzione — id
              -- e' gia' la PK — e serve solo perche' PostgreSQL pretende un
              -- indice fisico sulla coppia referenziata.
              ALTER TABLE vendite.fatture_righe
                  ADD CONSTRAINT uq_fatture_righe_id_fattura
                      UNIQUE (id, fattura_id);

              -- ⭐ «La parte e la sua capofila stanno sulla STESSA fattura» come
              --    vincolo, non come guard.
              ALTER TABLE vendite.fatture_righe
                  ADD CONSTRAINT fk_fatture_righe_riga_capofila
                      FOREIGN KEY (riga_capofila_id, fattura_id)
                      REFERENCES vendite.fatture_righe(id, fattura_id)
                      ON UPDATE CASCADE;

              -- Una riga non e' parte di se stessa. Costa nulla e toglie al
              -- trigger anti-catena il caso degenere a un nodo.
              ALTER TABLE vendite.fatture_righe
                  ADD CONSTRAINT chk_fatture_righe_capofila_non_se_stessa
                      CHECK (riga_capofila_id IS NULL OR riga_capofila_id <> id);

              COMMENT ON COLUMN vendite.fatture_righe.riga_capofila_id IS
                'Auto-riferimento: la riga CAPOFILA di cui questa riga e'' una parte. '
                'NULL sulla capofila — che e'' essa stessa la prima parte — e '
                'valorizzata sulle parti successive. ⭐ Esiste perche'' in fattura il '
                'risolutore IVA riceve l''imponibile VERO e puo'' tornare DUE parti (la '
                'quota che il plafond del titolo copre, e il resto): una riga FatturaPA '
                'porta UNA AliquotaIVA e UNA Natura, quindi due trattamenti sullo stesso '
                'imponibile sono due DettaglioLinee PER OBBLIGO DI FORMATO. La spezzatura '
                'non si puo'' evitare, si puo'' solo decidere chi la regge (N3, opzione a''). '
                '⛔ NON SI RIUSANO LE COLONNE DEL KIT: kit_key dice «queste righe vengono '
                'dallo stesso kit venduto», e una riga spezzata dal plafond non viene da '
                'nessun kit — marcarla cosi'' farebbe leggere a vw_fattura_righe_esposte, '
                'che le AGGREGA, un fatto falso, e aggregare due parti produrrebbe un solo '
                'DettaglioLinee, cioe'' cancellerebbe la ragione della spezzatura. '
                '⭐ vendite.attivita_fatturabili.fattura_riga_id continua a puntare la '
                'CAPOFILA: nessuna modifica a quella tabella, nessuna unique violata, e '
                'fatturato (GENERATED su fattura_riga_id IS NOT NULL) resta true da se''. '
                '⚠️ MA CHI LEGGE UN IMPORTO per attivita'' attraversando fattura_riga_id '
                'deve andare CAPOFILA -> PARTI e sommare: una lettura che si ferma alla '
                'capofila vede meta'' valore e NON FALLISCE. '
                '⭐ Due invarianti, imposte in modi diversi e apposta: «stessa fattura» e'' '
                'la FK COMPOSITA fk_fatture_righe_riga_capofila su (riga_capofila_id, '
                'fattura_id), cioe'' una garanzia che nessuno aggira; «niente catene» — una '
                'parte deve puntare a una riga che ha questa colonna NULL — e'' il trigger '
                'trg_fatture_righe_a10_guard_riga_capofila_ins_upd, perche'' nessun vincolo '
                'sa guardare la riga puntata. ⚠️ La spezzatura va fatta mentre la fattura '
                'e'' ancora SOTTO la soglia di congelamento: il guard legge lo stato vivo. '
                'brief-db-richieste-aperte-dal-backend voce 5 (N3, decisione D).';

              COMMENT ON CONSTRAINT uq_fatture_righe_id_fattura ON vendite.fatture_righe IS
                'Vincolo di servizio: NON impedisce nessun doppione — id e'' gia'' la chiave '
                'primaria, quindi la coppia non puo'' ripetersi. Esiste solo per essere il '
                'BERSAGLIO della FK composita fk_fatture_righe_riga_capofila, che PostgreSQL '
                'ammette solo verso una coppia dichiarata unica. ⚠️ Il suo indice comparira'' '
                'quindi in dbops.vw_duplicate_indexes come ridondante: e'' il prezzo di avere '
                '«stessa fattura» come vincolo invece che come guard, ed e'' voluto. '
                '⛔ Non si cancella: senza, la FK composita cade.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE vendite.fatture_righe
                  DROP CONSTRAINT IF EXISTS chk_fatture_righe_capofila_non_se_stessa;
              ALTER TABLE vendite.fatture_righe
                  DROP CONSTRAINT IF EXISTS fk_fatture_righe_riga_capofila;
              ALTER TABLE vendite.fatture_righe
                  DROP CONSTRAINT IF EXISTS uq_fatture_righe_id_fattura;
              ALTER TABLE vendite.fatture_righe
                  DROP COLUMN IF EXISTS riga_capofila_id;
