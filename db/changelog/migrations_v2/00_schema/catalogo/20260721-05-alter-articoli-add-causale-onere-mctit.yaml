# Colonna catalogo.articoli.causale_onere_id — "un articolo E' un onere collegandogli
#   una causale" (brief-db-immutabilita-quantita-e-porta-oneri §4c.8, modello 2026-07-21).
#
# MODELLO (decisione Tid 2026-07-21): un articolo-onere e' un VERO articolo di
# catalogo tagganto con una causale. Cosi' ogni onere porta la SUA iva_id (l'IVA
# non e' piu' unica: sta sull'articolo, non sulla causale) e la sua descrizione
# fattura; la causale resta la classificazione business (perche').
#   articolo e' un onere  <=>  causale_onere_id IS NOT NULL.
#
# LEGAME 1:1 (deciso Tid): una causale <-> un solo articolo-onere -> UNIQUE parziale
#   su causale_onere_id (WHERE NOT NULL).
#
# require_attivo / block_deact: auto-provisionati da dbops.fn_run_automations_attivo
#   (padre config.causali_onere ha colonna attivo, FK _id) al make db-ci-apply.
# Dipendenze: catalogo.articoli, config.causali_onere (20260721-03).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/catalogo/20260721-05-alter-articoli-add-causale-onere-mctit.yaml

  - changeSet:
      id: 20260721-05-alter-articoli-add-causale-onere
      author: mctit
      comment: >
        Aggiunge catalogo.articoli.causale_onere_id (FK config.causali_onere,
        nullable) + UNIQUE parziale (1:1 causale<->articolo). Un articolo e' un
        onere <=> causale valorizzata; l'IVA e' quella dell'articolo.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: catalogo
                tableName: articoli
            - tableExists:
                schemaName: config
                tableName: causali_onere
            - not:
                - columnExists:
                    schemaName: catalogo
                    tableName: articoli
                    columnName: causale_onere_id
      changes:
        - addColumn:
            schemaName: catalogo
            tableName: articoli
            columns:
              - column:
                  name: causale_onere_id
                  type: bigint
                  remarks: >-
                    Se valorizzata, l'articolo E' un onere (porta oneri) e questa
                    e' la sua causale/classificazione. FK config.causali_onere, 1:1.

        - addForeignKeyConstraint:
            baseTableSchemaName: catalogo
            baseTableName: articoli
            baseColumnNames: causale_onere_id
            referencedTableSchemaName: config
            referencedTableName: causali_onere
            referencedColumnNames: id
            onDelete: NO ACTION
            onUpdate: NO ACTION
            constraintName: fk_articoli_causale_onere

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Legame 1:1: una causale non puo' essere collegata a due articoli.
              CREATE UNIQUE INDEX uq_articoli_causale_onere
                ON catalogo.articoli (causale_onere_id)
                WHERE causale_onere_id IS NOT NULL;

              COMMENT ON COLUMN catalogo.articoli.causale_onere_id IS
                  'Se valorizzata, l''articolo e'' un onere della porta oneri e questa '
                  'e'' la sua causale (config.causali_onere), legame 1:1 '
                  '(uq_articoli_causale_onere). L''IVA dell''onere e'' la iva_id di '
                  'questo articolo. brief-db-immutabilita-quantita-e-porta-oneri §4c.8, '
                  'rev 2026-07-21.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP INDEX IF EXISTS catalogo.uq_articoli_causale_onere;
        - dropColumn:
            schemaName: catalogo
            tableName: articoli
            columnName: causale_onere_id
