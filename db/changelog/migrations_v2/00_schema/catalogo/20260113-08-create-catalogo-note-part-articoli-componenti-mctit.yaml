# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/catalogo/20260113-08-create-catalogo-note-part-articoli-componenti-mctit.yaml

  - changeSet:
      id: 20260113-08-create-catalogo-note-part-articoli-componenti
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: catalogo, tableName: note }
        - tableExists: { schemaName: catalogo, tableName: articoli_componenti }
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS catalogo.note_articoli_componenti
              PARTITION OF catalogo.note
              FOR VALUES IN ('ARTICOLI_COMPONENTI');

              COMMENT ON TABLE catalogo.note_articoli_componenti IS
              'Partizione note per catalogo.articoli_componenti.';

        - addForeignKeyConstraint:
            baseTableSchemaName: catalogo
            baseTableName: note_articoli_componenti
            baseColumnNames: target_id
            referencedTableSchemaName: catalogo
            referencedTableName: articoli_componenti
            referencedColumnNames: id
            constraintName: fk_cat_note_articoli_componenti_target
            onUpdate: CASCADE
            onDelete: CASCADE
