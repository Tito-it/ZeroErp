                  'Il tipo della nota e'' un''entita'' indicabile (config.tipi_entita): l''elenco dei tipi non e'' scritto a mano. Non sostituisce la partizione: un codice senza partizione e'' rifiutato prima, dal routing.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN catalogo.articoli.causale_onere_id IS
                  'Se valorizzata, l''articolo e'' un onere della porta oneri e questa e'' la sua causale (config.causali_onere), legame 1:1 (uq_articoli_causale_onere). L''IVA dell''onere e'' la iva_id di questo articolo. brief-db-immutabilita-quantita-e-porta-oneri §4c.8, rev 2026-07-21.';
              COMMENT ON COLUMN catalogo.articoli.gestito_a_magazzino IS
                  'L''articolo movimenta giacenza. Default false = fail-safe: nessun articolo comincia a movimentare per distrazione. NON si deriva da natura_vendita = MERCE (una merce puo'' essere consegnata dal fornitore senza passare da giacenza). E'' un ingresso della primitiva di scrittura del magazzino (analisi carico e scarico, M-2). ⚠️ Al rilascio tutte le righe sono false e la merce va marcata: il presidio di prontezza e'' in dbops.presidi, non un rosso.';
              COMMENT ON COLUMN catalogo.articoli.modo_approvvigionamento_id IS
                  'Da dove arriva la merce di questo articolo (config.modi_approvvigionamento: ACQUISTO | PRODUZIONE | STOCK | NON_APPLICABILE). NOT NULL DEFAULT ACQUISTO (decisione di Tid, 2026-09-02): il valore si puo'' sempre dare, e un NULL direbbe «non lo so», che e'' lo stato che la colonna esiste per abolire; il default e'' l''id risolto per codice_interno all''apply di 20260913-11. Rende ponibile «questa riga richiede produzione?» e dice se l''articolo si compra. NON e'' derivabile da is_composito (fatturazione), natura_vendita_id (destinazione della riga) ne'' da nature_vendita.e_cessione_beni (fiscale). Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3.3.';
              COMMENT ON COLUMN catalogo.articoli.note_target_tipo IS
                  'Tipo target per nota (FK composita verso catalogo.note): vale ARTICOLO, il codice di config.tipi_entita della partizione delle note all''articolo. Rev 2026-10-25 (20261025-57, brief-db-grammatica-unica-documenti lotto 3): era ARTICOLI, varchar(32).';
              COMMENT ON COLUMN catalogo.articoli.obsoleto_dal IS
                  'Data dalla quale l''articolo non si SCEGLIE piu'' per una riga nuova: NULL = si sceglie; data raggiunta (alla data operativa) = ritirato; data futura = ritiro programmato. Il predicato e'' script.fn_e_obsoleto, sede unica. Ritirato: la riga nuova lo respinge (guard di riga e picker con lo stesso motivo E_ARTICOLO_OBSOLETO), la riga derivata da un altro documento lo accetta, il magazzino non si blocca mai. NON tocca attivo (riferimento valido), che resta true. brief-db-articoli-obsoleto-dal.';
              COMMENT ON COLUMN catalogo.articoli.requires_lotto IS
                  'Se true, ogni carico di questo articolo appartiene a una partita (magazzino.lotti) e ogni movimento porta lotto_id. Indipendente da requires_serial: lotto e seriale sono due domande diverse e un articolo puo'' volerne uno, entrambi o nessuno. Default false = fail-safe: la tracciabilita'' per lotto si sceglie, non si eredita. Lo legge la primitiva di scrittura del magazzino (Lotto 2); nessun guard in questo lotto. Brief: brief-db-magazzino-lotto-1-terreno-vuoto, sezione 4.3 (M-5).';
              COMMENT ON COLUMN catalogo.articoli.natura_vendita_id IS
                  'Natura commerciale dell''articolo ai fini del routing post-accettazione preventivo (config.nature_vendita). Fonte di verita'' della natura: la riga di preventivo la eredita e congela. NULL = articolo non ancora classificato (transitorio pre-backfill); a regime NOT NULL.';
              COMMENT ON COLUMN catalogo.articoli_componenti.esposizione_in_fattura IS
                  'Come si espone in fattura questo componente quando il kit e'' venduto: NASCOSTO (non compare, valore nel totale del kit), DESCRITTIVO (riga sotto il kit senza importo, valore nel totale del kit), VALORIZZATO (riga sotto il kit con quantita'', prezzo e importo suoi, fuori dal totale del kit). Codice di config.esposizioni_componente(codice_interno), FK in 80_data (20261001-57). Proprieta'' della DISTINTA, non del documento: le righe dei documenti non la copiano, il push la mette nel meta delle attivita'' e la fattura la congela su vendite.fatture_righe.kit_esposizione. Campo di struttura: immutabile (trgfn_articoli_componenti_block_modifica_struttura). Fino al 2026-10-01 era il booleano esposto_in_fattura (false -> NASCOSTO, true -> DESCRITTIVO). Brief: brief-db-esposizione-componenti-kit-in-fattura.';
              COMMENT ON COLUMN catalogo.articoli_componenti.note_target_tipo IS
