databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/catalogo/20260113-06-create-catalogo-note-mctit.yaml

  - changeSet:
      id: 20260113-06-create-catalogo-note
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS catalogo.note (
                id               BIGINT GENERATED BY DEFAULT AS IDENTITY,
                target_tipo      VARCHAR(32)  NOT NULL,   -- chiave di partizione
                target_id        UUID         NOT NULL,   -- id entita' target
                target_riga_id   UUID,                  -- id riga (solo se anchor_tipo='RIGA')
                anchor_tipo      VARCHAR(12)  NOT NULL,   -- DOCUMENTO | RIGA
                posizione        VARCHAR(12)  NOT NULL,   -- HEADER | FOOTER | SEZIONE | BEFORE | AFTER
                seq              INTEGER      NOT NULL DEFAULT 10,
                testo            TEXT,
                testo_md         TEXT,
                id_stile         BIGINT       NOT NULL,
                id_lingua        BIGINT,
                visibile         BOOLEAN      NOT NULL DEFAULT true,
                solo_stampa      BOOLEAN      NOT NULL DEFAULT false,
                meta             JSONB        NOT NULL DEFAULT '{}',
                data_insert      TIMESTAMPTZ  NOT NULL DEFAULT now(),
                user_insert      VARCHAR(80)  NOT NULL DEFAULT CURRENT_USER,
                data_update      TIMESTAMPTZ  NOT NULL DEFAULT now(),
                user_update      VARCHAR(80)  DEFAULT CURRENT_USER,
                CONSTRAINT pk_note PRIMARY KEY (target_tipo, id),
                CONSTRAINT chk_note_target_tipo CHECK (target_tipo IN ('ARTICOLI','ARTICOLI_COMPONENTI')),
                CONSTRAINT chk_note_anchor_tipo CHECK (anchor_tipo IN ('DOCUMENTO','RIGA')),
                CONSTRAINT chk_note_posizione  CHECK (posizione IN ('HEADER','FOOTER','SEZIONE','BEFORE','AFTER')),
                CONSTRAINT chk_note_seq_pos    CHECK (seq >= 0)
              )
              PARTITION BY LIST (target_tipo);

              COMMENT ON TABLE catalogo.note
                IS 'Note testuali ancorabili ad articoli o articoli_componenti; tabella padre partizionata per target_tipo.';
              COMMENT ON CONSTRAINT pk_note ON catalogo.note
                IS 'PK composita (target_tipo, id) richiesta per tabella partizionata.';
              COMMENT ON CONSTRAINT chk_note_target_tipo ON catalogo.note
                IS 'Valori ammessi: ARTICOLI | ARTICOLI_COMPONENTI.';
              COMMENT ON CONSTRAINT chk_note_anchor_tipo ON catalogo.note
                IS 'Valori ammessi: DOCUMENTO | RIGA.';
              COMMENT ON CONSTRAINT chk_note_posizione ON catalogo.note
                IS 'Valori ammessi: HEADER | FOOTER | SEZIONE | BEFORE | AFTER.';
              COMMENT ON CONSTRAINT chk_note_seq_pos ON catalogo.note
                IS 'seq obbligatoria e non negativa.';

        - createIndex:
            schemaName: catalogo
            tableName: note
            indexName: ix_note_render_order
            columns:
              - column: { name: target_tipo }
              - column: { name: target_id }
              - column: { name: anchor_tipo }
              - column: { name: posizione }
              - column: { name: seq }

        - addForeignKeyConstraint:
            baseTableSchemaName: catalogo
            baseTableName: note
            baseColumnNames: id_stile
            referencedTableSchemaName: config
            referencedTableName: note_stili
            referencedColumnNames: id
            constraintName: fk_cat_note_id_stile
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: catalogo
            baseTableName: note
            baseColumnNames: id_lingua
            referencedTableSchemaName: config
            referencedTableName: lingue
            referencedColumnNames: id
            constraintName: fk_cat_note_id_lingua
            onUpdate: CASCADE
            onDelete: NO ACTION
