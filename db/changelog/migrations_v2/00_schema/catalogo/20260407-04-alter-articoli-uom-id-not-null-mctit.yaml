# Liquibase changelog per Zero ERP
# ALTER catalogo.articoli: uom_id diventa NOT NULL
# Esprime a livello DDL il vincolo semantico esistente:
# l'unita' di misura principale e' obbligatoria su ogni articolo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/catalogo/20260407-04-alter-articoli-uom-id-not-null-mctit.yaml

  - changeSet:
      id: 20260407-04-alter-articoli-uom-id-not-null
      author: mctit
      comment: >
        Rende obbligatoria la colonna catalogo.articoli.uom_id (NOT NULL).
        L'unita' di misura principale e' anagrafica e necessaria per il seed
        automatico della UoM operativa base. Precondizione: nessun articolo
        con uom_id NULL in DB.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: |
              SELECT COUNT(*) FROM catalogo.articoli WHERE uom_id IS NULL;
      changes:
        - addNotNullConstraint:
            schemaName: catalogo
            tableName: articoli
            columnName: uom_id
            columnDataType: bigint

      rollback:
        - dropNotNullConstraint:
            schemaName: catalogo
            tableName: articoli
            columnName: uom_id
            columnDataType: bigint
