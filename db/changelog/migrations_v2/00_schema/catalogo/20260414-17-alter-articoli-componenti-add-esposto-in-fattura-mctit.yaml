# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Aggiunge catalogo.articoli_componenti.esposto_in_fattura boolean
# NOT NULL DEFAULT false.
#
# Semantica (pricing v5):
#   - FALSE (default): il componente concorre al prezzo del composito
#     ma NON appare come riga separata in fattura.
#   - TRUE: il componente appare come riga separata in fattura con
#     prezzo, descrizione e IVA propri. Gli articoli con almeno un
#     componente esposto vengono espansi in commesse_attivita alla
#     creazione dell'attivita'.
#
# Riferimento: sviluppo-listini-v5.md sezione 8.1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/catalogo/20260414-17-alter-articoli-componenti-add-esposto-in-fattura-mctit.yaml

  - changeSet:
      id: 20260414-17-alter-articoli-componenti-add-esposto-in-fattura
      author: mctit
      comment: >
        Aggiunge flag esposto_in_fattura (default false) su
        catalogo.articoli_componenti per pilotare l'espansione
        in commesse_attivita e la presenza in riga fattura.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              schemaName: catalogo
              tableName: articoli_componenti
              columnName: esposto_in_fattura

      changes:
        - addColumn:
            schemaName: catalogo
            tableName: articoli_componenti
            columns:
              - column:
                  name: esposto_in_fattura
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Se TRUE il componente appare come riga separata in fattura con prezzo/IVA propri e viene espanso in commesse_attivita. Pricing v5."
                  constraints:
                    nullable: false

      rollback:
        - dropColumn:
            schemaName: catalogo
            tableName: articoli_componenti
            columnName: esposto_in_fattura
