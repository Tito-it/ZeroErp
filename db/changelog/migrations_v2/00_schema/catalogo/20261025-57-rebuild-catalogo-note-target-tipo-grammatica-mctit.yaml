              CREATE VIEW catalogo.vw_articoli_note AS
               SELECT a.id AS articolo_id,
                  a.codice AS articolo_codice,
                  a.descrizione AS articolo_descrizione,
                  n.id AS nota_id,
                  n.target_tipo AS nota_target_tipo,
                  n.target_id AS nota_target_id,
                  n.target_riga_id AS nota_target_riga_id,
                  n.anchor_tipo AS nota_anchor_tipo,
                  n.posizione AS nota_posizione,
                  n.seq AS nota_seq,
                  n.testo AS nota_testo,
                  n.testo_md AS nota_testo_md,
                  n.visibile AS nota_visibile,
                  n.solo_stampa AS nota_solo_stampa,
                  n.meta AS nota_meta,
                  n.data_insert AS nota_data_insert,
                  n.user_insert AS nota_user_insert,
                  n.data_update AS nota_data_update,
                  n.user_update AS nota_user_update,
                  ns.id AS stile_id,
                  ns.codice AS stile_codice,
                  ns.descrizione AS stile_descrizione,
                  l.id AS lingua_id,
                  l.codice_iso AS lingua_codice_iso,
                  l.descrizione AS lingua_descrizione,
                  l.descrizione_locale AS lingua_descrizione_locale
                 FROM catalogo.note_articoli n
                   JOIN catalogo.articoli a ON a.id = n.target_id
                   LEFT JOIN config.note_stili ns ON ns.id = n.id_stile
                   LEFT JOIN config.lingue l ON l.id = n.id_lingua;
              COMMENT ON VIEW catalogo.vw_articoli_note IS 'Vista note per articoli con dati stile e lingua.';
              GRANT SELECT, INSERT, UPDATE, DELETE ON catalogo.vw_articoli_note TO zeroerp_app;
              CREATE VIEW catalogo.vw_articoli_componenti_note AS
               SELECT ac.id AS articolo_componente_id,
                  ac.prodotto_id,
                  ap.codice AS prodotto_codice,
                  ap.descrizione AS prodotto_descrizione,
                  ac.componente_id,
                  acmp.codice AS componente_codice,
                  acmp.descrizione AS componente_descrizione,
                  n.id AS nota_id,
                  n.target_tipo AS nota_target_tipo,
                  n.target_id AS nota_target_id,
                  n.target_riga_id AS nota_target_riga_id,
                  n.anchor_tipo AS nota_anchor_tipo,
                  n.posizione AS nota_posizione,
                  n.seq AS nota_seq,
                  n.testo AS nota_testo,
                  n.testo_md AS nota_testo_md,
                  n.visibile AS nota_visibile,
                  n.solo_stampa AS nota_solo_stampa,
                  n.meta AS nota_meta,
                  n.data_insert AS nota_data_insert,
                  n.user_insert AS nota_user_insert,
                  n.data_update AS nota_data_update,
                  n.user_update AS nota_user_update,
                  ns.id AS stile_id,
                  ns.codice AS stile_codice,
                  ns.descrizione AS stile_descrizione,
                  l.id AS lingua_id,
                  l.codice_iso AS lingua_codice_iso,
                  l.descrizione AS lingua_descrizione,
                  l.descrizione_locale AS lingua_descrizione_locale
                 FROM catalogo.note_articoli_componenti n
                   JOIN catalogo.articoli_componenti ac ON ac.id = n.target_id
                   LEFT JOIN catalogo.articoli ap ON ap.id = ac.prodotto_id
                   LEFT JOIN catalogo.articoli acmp ON acmp.id = ac.componente_id
                   LEFT JOIN config.note_stili ns ON ns.id = n.id_stile
                   LEFT JOIN config.lingue l ON l.id = n.id_lingua;
              COMMENT ON VIEW catalogo.vw_articoli_componenti_note IS 'Vista note per componenti articolo con dati stile e lingua.';
              GRANT SELECT, INSERT, UPDATE, DELETE ON catalogo.vw_articoli_componenti_note TO zeroerp_app;
              CREATE VIEW catalogo.vw_articoli_dettaglio AS
               SELECT a.id,
                  a.codice,
                  a.descrizione,
                  a.descrizione_breve,
                  a.uom_id,
                  a.tipo_voce_id,
                  a.gruppo_voce_id,
                  a.spesa_id,
                  a.iva_id,
                  a.conto_contabile_vendita_id,
                  a.conto_contabile_acquisto_id,
                  a.is_composito,
                  a.is_solo_componente,
                  a.requires_serial,
                  a.listino_tipologia_id,
                  a.meta,
                  a.user_insert,
                  a.user_update,
                  a.data_insert,
                  a.data_update,
                  a.tx_id,
                  a.storicizza,
                  a.attivo,
                  a.note_target_tipo,
                  a.note_id,
                  u.id AS uom_ref_id,
                  u.codice AS uom_codice,
                  u.descrizione AS uom_descrizione,
                  t.id AS tipologia_ref_id,
                  t.codice AS tipologia_codice,
                  t.descrizione AS tipologia_descrizione,
                  g.id AS gruppo_ref_id,
                  g.codice AS gruppo_codice,
                  g.descrizione AS gruppo_descrizione,
                  s.id AS spesa_ref_id,
                  s.codice AS spesa_codice,
                  s.descrizione AS spesa_descrizione,
                  i.id AS iva_ref_id,
                  i.codice AS iva_codice,
                  i.descrizione AS iva_descrizione,
                  i.aliquota_iva AS iva_aliquota_iva,
                  lt.codice AS tipologia_listino_codice,
                  lt.descrizione AS tipologia_listino_descrizione,
                  a.is_composito AND NOT a.is_solo_componente AS puo_gestire_bom,
                      CASE
                          WHEN a.is_composito AND NOT a.is_solo_componente THEN NULL::text
                          WHEN a.is_solo_componente THEN 'ARTICOLO_SOLO_COMPONENTE'::text
                          ELSE 'ARTICOLO_NON_COMPOSITO'::text
                      END AS motivo_non_gestibile_bom,
                  a.is_composito AND (EXISTS ( SELECT 1
                         FROM catalogo.articoli_componenti ac
                        WHERE ac.prodotto_id = a.id AND ac.validita @> (( SELECT script.fn_data_operativa() AS fn_data_operativa)) AND ac.attivo = true)) AS has_componenti_alla_data,
                  a.natura_vendita_id,
                  nv.codice_interno AS natura_vendita_codice_interno,
                  nv.descrizione AS natura_vendita_descrizione,
                  nv.destinazione_tipo AS natura_vendita_destinazione_tipo,
                  a.modo_approvvigionamento_id,
                  ma.codice_interno AS modo_approvvigionamento_codice_interno,
                  ma.descrizione AS modo_approvvigionamento_descrizione,
                  a.gestito_a_magazzino,
                  a.lead_time_giorni,
                  a.requires_lotto
                 FROM catalogo.articoli a
                   LEFT JOIN catalogo.unita_misura u ON u.id = a.uom_id
                   LEFT JOIN vendite.articoli_tipologie t ON t.id = a.tipo_voce_id
                   LEFT JOIN vendite.articoli_gruppi g ON g.id = a.gruppo_voce_id
                   LEFT JOIN vendite.articoli_spesa s ON s.id = a.spesa_id
                   LEFT JOIN config.iva i ON i.id = a.iva_id
                   LEFT JOIN config.listini_tipologie lt ON lt.id = a.listino_tipologia_id
                   LEFT JOIN config.nature_vendita nv ON nv.id = a.natura_vendita_id
                   LEFT JOIN config.modi_approvvigionamento ma ON ma.id = a.modo_approvvigionamento_id;
              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS 'Vista della lista (ui.lista_definizione 26) e del drawer articolo: catalogo.articoli + decodifiche (uom, tipologia, gruppo, spesa, iva, tipologia listino, natura di vendita) + capability BoM. Nessuna security_invoker, e non deve prenderla per imitazione: catalogo.articoli non ha RLS e la vista non attraversa tabelle protette (presidio sul merito: db/pgtap/rls/test-rls-viste-security-invoker.sql). ⭐ rev 2026-09-18 (P-1, brief-db-magazzino-lotto-2-motore sezione 4.9): + requires_lotto in coda — la primitiva di magazzino pretende il lotto quando e'' vero (passo 6), e l''operatore deve poterlo vedere e impostare; SENZA lock BoM (Lotto 1 sezione 4.3: il lotto non entra nella distinta), quindi ne'' fra i non_editable_fields del BE ne'' disabilitato nel drawer. rev 2026-09-13 (P-6, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + modo_approvvigionamento_id, modo_approvvigionamento_codice_interno, modo_approvvigionamento_descrizione, gestito_a_magazzino, lead_time_giorni, in coda (CREATE OR REPLACE VIEW puo'' solo appendere). La decodifica e'' sulla forma di natura_vendita_*: codice_interno per la logica, descrizione a video; NON `_codice`, che mentirebbe sulla sorgente (linee-guida-sql 6c). ⚠️ catalogo_repository proietta ARTICOLI_DETAIL_COLUMNS per nome: una colonna nuova non esce finche'' il BE non la nomina.';
              GRANT SELECT, INSERT, UPDATE, DELETE ON catalogo.vw_articoli_dettaglio TO zeroerp_app;
              CREATE VIEW catalogo.vw_articoli_componenti_dettaglio AS
               SELECT ac.id,
                  ac.prodotto_id,
                  ac.componente_id,
                  ac.coeff_qta,
                  ac.obbligatorio,
                  ac.valido_dal,
                  ac.valido_al,
                  ac.meta,
                  ac.user_insert,
                  ac.user_update,
                  ac.data_insert,
                  ac.data_update,
                  ac.tx_id,
                  ac.storicizza,
                  ac.attivo,
                  ac.note_target_tipo,
                  ac.note_id,
                  ap.codice AS prodotto_codice,
                  ap.descrizione AS prodotto_descrizione,
                  acmp.codice AS componente_codice,
                  acmp.descrizione AS componente_descrizione,
                  ac.valido_al IS NULL AS puo_chiudersi,
                      CASE
                          WHEN ac.valido_al IS NULL THEN ac.valido_dal
                          ELSE NULL::date
                      END AS data_min_chiusura,
                      CASE
                          WHEN ac.valido_al IS NULL THEN GREATEST(ac.valido_dal, ( SELECT script.fn_data_operativa() AS fn_data_operativa))
                          ELSE NULL::date
                      END AS data_default_chiusura,
                      CASE
                          WHEN ac.valido_al IS NULL THEN NULL::text
                          ELSE 'RIGA_GIA_CHIUSA'::text
                      END AS motivo_non_chiudibile,
                  ac.esposizione_in_fattura,
                  ec.codice AS esposizione_in_fattura_codice,
                  ec.etichetta_key AS esposizione_in_fattura_etichetta_key
                 FROM catalogo.articoli_componenti ac
                   LEFT JOIN catalogo.articoli ap ON ap.id = ac.prodotto_id
                   LEFT JOIN catalogo.articoli acmp ON acmp.id = ac.componente_id
                   LEFT JOIN config.esposizioni_componente ec ON ec.codice_interno::text = ac.esposizione_in_fattura::text;
              COMMENT ON VIEW catalogo.vw_articoli_componenti_dettaglio IS 'Righe della distinta base (componenti di un articolo) con codici e descrizioni di prodotto e componente, piu'' la capability di riga (puo_chiudersi, data_min_chiusura, data_default_chiusura, motivo_non_chiudibile) per «Chiudi riga». Dal 2026-09-28 (brief-db-liste-righe-documento, D-8.5) e'' la SORGENTE UNICA delle righe: per la lista configurabile catalogo.articolo_componenti e per il repository, che prima ne rifaceva la proiezione e la capability in Python. Dal 2026-10-01 (brief-db-esposizione-componenti-kit-in-fattura) esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO) al posto del booleano esposto_in_fattura, e in coda codice ed etichetta_key del modo da config.esposizioni_componente: la logica confronta esposizione_in_fattura, il codice e'' solo a video. Dal 2026-10-02 (brief-db-bom-flag-quantita-e-kit-in-fattura, D-1) senza partecipa_qta e determina_qta_padre, ritirate dalla tabella: nessuna logica le leggeva. Tutte le righe, anche le non attive e le chiuse: filtro e ordine li mette chi legge.';
              GRANT SELECT, INSERT, UPDATE, DELETE ON catalogo.vw_articoli_componenti_dettaglio TO zeroerp_app;
