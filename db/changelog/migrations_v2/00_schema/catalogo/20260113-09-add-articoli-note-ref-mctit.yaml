databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/catalogo/20260113-09-add-articoli-note-ref-mctit.yaml

  - changeSet:
      id: 20260113-09-add-articoli-note-ref
      author: mctit
      changes:
        - addColumn:
            schemaName: catalogo
            tableName: articoli
            columns:
              - column:
                  name: note_target_tipo
                  type: VARCHAR(32)
                  remarks: "Tipo target per nota (FK composita verso catalogo.note)."
              - column:
                  name: note_id
                  type: BIGINT
                  remarks: "Nota associata all'articolo (FK composita verso catalogo.note)."
        - addForeignKeyConstraint:
            baseTableSchemaName: catalogo
            baseTableName: articoli
            baseColumnNames: note_target_tipo, note_id
            referencedTableSchemaName: catalogo
            referencedTableName: note
            referencedColumnNames: target_tipo, id
            constraintName: fk_articoli_note
            onUpdate: CASCADE
            onDelete: SET NULL
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE catalogo.articoli
                ADD CONSTRAINT chk_articoli_note_target_tipo
                CHECK (note_target_tipo IS NULL OR note_target_tipo = 'ARTICOLI');
