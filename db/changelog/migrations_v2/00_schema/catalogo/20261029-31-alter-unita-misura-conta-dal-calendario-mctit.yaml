# L'UNITA' DI MISURA DICE SE SI CONTA DAL CALENDARIO — catalogo.unita_misura.conta_dal_calendario
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §6.2 (fonte «durata»),
#   §6.9 (Lotto 2), decisione G-9 di Tid (2026-10-28)
#
# ── PERCHE' ──────────────────────────────────────────────────────
#   G-9: il canone «dalla durata del periodo» ha il prezzo al giorno o al mese,
#   e la quantita' la conta il sistema dal calendario, nell'unita' di misura
#   dell'articolo. Serve sapere QUALE unita' si conta dal calendario e come:
#   GIORNO (i giorni coperti dal periodo) o MESE (i mesi coperti, il mese a
#   meta' in proporzione ai giorni). Le ore (HH) no: il pacchetto di ore e' un
#   canone FISSA (G-10). Il tipo dell'unita' (uom_tipi TEMPO) non basta: ORE,
#   GIORNO e MESE sono tutte TEMPO.
#
# ── LA FORMA ─────────────────────────────────────────────────────
#   · Nullable: la quasi totalita' delle unita' non si conta dal calendario.
#   · Due valori, CHECK (nessun vocabolario): GIORNO, MESE.
#   · Il valore delle unita' di catalogo sta nel CSV
#     (80_data/sql/catalogo/unita_misura.csv, mirror 20260428-15): GG -> GIORNO,
#     MESE -> MESE.
#   · Lo legge vendite.fn_articolo_erogazioni (20261029-33): un articolo si puo'
#     erogare CANONE/DURATA solo se la sua unita' si conta dal calendario.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/catalogo/20261029-31-alter-unita-misura-conta-dal-calendario-mctit.yaml

  - changeSet:
      id: 20261029-31-alter-unita-misura-conta-dal-calendario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Colonna catalogo.unita_misura.conta_dal_calendario (GIORNO | MESE | NULL): l'unita' con cui
        il canone a durata conta la quantita' dal calendario (G-9). Brief:
        brief-db-contratto-righe-periodiche-in-commessa §6.9 (Lotto 2).
      preConditions:
        - onFail: HALT
        - not:
            - columnExists:
                schemaName: catalogo
                tableName: unita_misura
                columnName: conta_dal_calendario
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE catalogo.unita_misura
                  ADD COLUMN conta_dal_calendario varchar(16),
                  ADD CONSTRAINT chk_unita_misura_conta_dal_calendario CHECK (
                      conta_dal_calendario IS NULL
                      OR conta_dal_calendario IN ('GIORNO', 'MESE'));

              COMMENT ON COLUMN catalogo.unita_misura.conta_dal_calendario IS
                  'Se e come la quantità di un canone a durata (fonte DURATA) si conta dal calendario in questa unità: GIORNO = i giorni coperti dal periodo; MESE = i mesi coperti, il mese a metà in proporzione ai giorni; NULL = non si conta dal calendario (le ore no: il pacchetto di ore è un canone FISSA). Lo legge vendite.fn_articolo_erogazioni: CANONE/DURATA si propone e si ammette solo su un articolo la cui unità si conta dal calendario. 20261029-31, brief-db-contratto-righe-periodiche-in-commessa G-9.';
      rollback:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE catalogo.unita_misura DROP COLUMN IF EXISTS conta_dal_calendario;
