# J1 — generalizza maintenance.job_run_log ai job headless (cron/command).
#
# Why: job_run_log oggi registra solo esecuzioni pgAgent. La si rende generica
# per QUALSIASI job schedulato (anche management command via systemd/cron, es.
# run_fatturazione_batch). Vedi brief-db-job-run-registrazione.md §2.
#
# - origine: discrimina come e' stato lanciato il run. NOT NULL DEFAULT 'PGAGENT'
#   -> backfill implicito dei record esistenti (tutti pgAgent), zero regressione.
#   ADD COLUMN con default costante = metadata-only (nessun rewrite tabella).
# - meta: riepilogo GENERICO del run (es. conteggi per esito). MAI dettaglio di
#   dominio fatturazione (quello resta in vendite.*). NOT NULL DEFAULT '{}'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/maintenance/20260618-01-alter-job-run-log-add-origine-meta-mctit.yaml

  - changeSet:
      id: 20260618-01-alter-job-run-log-add-origine-meta
      author: mctit
      failOnError: true
      comment: >
        J1: aggiunge origine (varchar(16) NOT NULL DEFAULT 'PGAGENT', CHECK
        PGAGENT/CRON/COMMAND) e meta (jsonb NOT NULL DEFAULT '{}') a
        maintenance.job_run_log. Generalizza la tabella ai job headless
        cron/command; record esistenti restano PGAGENT.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: maintenance
              tableName: job_run_log
          - not:
              - columnExists:
                  schemaName: maintenance
                  tableName: job_run_log
                  columnName: origine
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE maintenance.job_run_log
                ADD COLUMN origine varchar(16) NOT NULL DEFAULT 'PGAGENT',
                ADD COLUMN meta    jsonb       NOT NULL DEFAULT '{}'::jsonb;

              ALTER TABLE maintenance.job_run_log
                ADD CONSTRAINT chk_job_run_log_origine
                CHECK (origine IN ('PGAGENT','CRON','COMMAND'));

              COMMENT ON COLUMN maintenance.job_run_log.origine IS
                'Come e'' stato lanciato il run: PGAGENT (job DB pgAgent, default e '
                'backfill dei record storici), CRON (management command schedulato '
                'systemd/cron), COMMAND (lancio manuale). Vincolato da chk_job_run_log_origine.';

              COMMENT ON COLUMN maintenance.job_run_log.meta IS
                'Riepilogo GENERICO del run in JSONB (es. conteggi per esito). MAI '
                'dettaglio di dominio (la fatturazione tiene il proprio in vendite.*, '
                'correlato via run_uuid).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE maintenance.job_run_log
                DROP CONSTRAINT IF EXISTS chk_job_run_log_origine;
              ALTER TABLE maintenance.job_run_log
                DROP COLUMN IF EXISTS meta,
                DROP COLUMN IF EXISTS origine;
