# maintenance.test_pgagent_log SI RITIRA
#   Brief: brief-db-revisione-dbops, giro 14 (N4).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Tabella di collaudo di pgAgent del primo impianto. Nessun job, funzione,
#   vista, script, backend o pgTAP la scrive o la legge (il solo pgTAP che la
#   nomina, maintenance/test-app-postura-job-run-log-v1, controllava che
#   l'app non ci avesse privilegi). Era l'unica tabella di maintenance
#   senza COMMENT: invece di descrivere un oggetto senza uso, lo si toglie.
#
# ── PERCHE' QUI ─────────────────────────────────────────────────────
#   La crea l'albero della prima versione
#   (migrations/00_bootstrap/20250808-01, congelato: linee-guida-sql §11.11),
#   che il master include prima di migrations_v2: da zero rinasce sempre, e
#   solo un changeSet in avanti la toglie. Nessun changeSet di 70/80/85/90 la
#   nomina, quindi 00_schema basta. Il changeSet v1 non torna a girare: il
#   suo checksum non cambia (runOnChange senza modifiche).
#   DROP ... IF EXISTS: idempotente da se', niente preCondition.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/maintenance/20261111-23-drop-table-test-pgagent-log-mctit.yaml

  - changeSet:
      id: 20261111-23-drop-table-test-pgagent-log
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Ritiro di maintenance.test_pgagent_log, tabella di collaudo senza uso. Brief: brief-db-revisione-dbops, giro 14 (N4).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TABLE IF EXISTS maintenance.test_pgagent_log;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS maintenance.test_pgagent_log (
                  id       integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  fired_at timestamptz NOT NULL DEFAULT now(),
                  jobname  text        NOT NULL,
                  status   integer     NOT NULL,
                  message  text
              );
