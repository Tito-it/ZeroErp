databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/storico/20260418-53-create-storico-identita-scope-bindings-mctit.yaml

  - changeSet:
      id: 20260418-53-create-storico-identita-scope-bindings
      author: mctit
      comment: >
        Tabella storica per config.identita_scope_bindings. Popolata
        automaticamente dal trigger script.trgfn_storico_generic via
        automation (TG_ARGV[0] = 'identita_scope_bindings_id').
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: config
              tableName: identita_scope_bindings
          - sqlCheck:
              expectedResult: 0
              sql: |
                SELECT COUNT(*) FROM pg_tables
                 WHERE schemaname = 'storico' AND tablename = 'identita_scope_bindings';
      changes:
        - createSequence:
            schemaName: storico
            sequenceName: identita_scope_bindings_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            schemaName: storico
            tableName: identita_scope_bindings
            remarks: "Storico di config.identita_scope_bindings."
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueComputed: "nextval('storico.identita_scope_bindings_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_storico_identita_scope_bindings
                    nullable: false
              - column:
                  name: identita_scope_bindings_id
                  type: bigint
                  constraints:
                    nullable: false
              - column: { name: change_type, type: "char(1)", defaultValue: A }
              - column: { name: tipo_operazione, type: smallint }
              - column: { name: snapshot, type: jsonb }
              - column: { name: user_insert, type: text, defaultValueComputed: "CURRENT_USER" }
              - column: { name: data_insert, type: "timestamp with time zone", defaultValueComputed: "now()" }
              - column: { name: tx_id, type: uuid }
              - column: { name: valid_from, type: "timestamp with time zone", defaultValueComputed: "now()" }
              - column: { name: valid_to, type: "timestamp with time zone" }
        - createIndex:
            schemaName: storico
            indexName: ix_identita_scope_bindings_identita_scope_bindings_id_fk
            tableName: identita_scope_bindings
            columns:
              - column: { name: identita_scope_bindings_id }
      rollback:
        - dropTable: { schemaName: storico, tableName: identita_scope_bindings }
        - dropSequence: { schemaName: storico, sequenceName: identita_scope_bindings_id_seq }
