databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/storico/20260418-23-create-storico-identita-digitali-mctit.yaml

  - changeSet:
      id: 20260418-23-create-storico-identita-digitali
      author: mctit
      comment: >
        Tabella storica per anagrafiche.identita_digitali (§4.2.5 WIP
        multi-face-auth). Pattern identico a storico.risorse_umane_auth_user:
        sequenza dedicata, FK colonna <nome_tabella_base>_id, campi snapshot/
        change_type/tipo_operazione/valid_from/valid_to/user_insert/data_insert/
        tx_id. Popolata automaticamente dal trigger framework
        script.trgfn_storico_generic applicato via automation sulla tabella
        sorgente (TG_ARGV[0] = 'identita_digitali_id'). La tabella deve
        esistere prima che l'automation applichi il trigger storico.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: anagrafiche
              tableName: identita_digitali
          - sqlCheck:
              expectedResult: 0
              sql: |
                SELECT COUNT(*)
                  FROM pg_tables
                 WHERE schemaname = 'storico'
                   AND tablename = 'identita_digitali';
      changes:
        - createSequence:
            schemaName: storico
            sequenceName: identita_digitali_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            schemaName: storico
            tableName: identita_digitali
            remarks: >-
              Storico di anagrafiche.identita_digitali. Riceve uno snapshot JSON
              del record ad ogni UPDATE/DELETE tramite script.trgfn_storico_generic.
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueComputed: "nextval('storico.identita_digitali_id_seq'::regclass)"
                  remarks: "PK tecnica della riga storica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_storico_identita_digitali
                    nullable: false
              - column:
                  name: identita_digitali_id
                  type: bigint
                  remarks: "FK logica verso anagrafiche.identita_digitali.id (no FK fisica per consentire la storicizzazione post-delete)."
                  constraints:
                    nullable: false
              - column:
                  name: change_type
                  type: "char(1)"
                  defaultValue: A
                  remarks: "Tipo di change (A=audit). Pattern coerente con altre tabelle storico del progetto."
              - column:
                  name: tipo_operazione
                  type: smallint
                  remarks: "Codifica operazione sorgente: 2=UPDATE, 3=DELETE (convenzione trgfn_storico_generic)."
              - column:
                  name: snapshot
                  type: jsonb
                  remarks: "Snapshot completo del record sorgente al momento dell'evento (row_to_json del NEW/OLD)."
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente DB che ha eseguito l'evento (audit)."
              - column:
                  name: data_insert
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento della riga storica."
              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction id di sessione (dbops.trgfn_tx_id_managed via automation)."
              - column:
                  name: valid_from
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  remarks: "Inizio validita dello snapshot (valid time)."
              - column:
                  name: valid_to
                  type: "timestamp with time zone"
                  remarks: "Fine validita dello snapshot; chiusura gestita dal trigger storico al successivo cambio stato."
        - createIndex:
            schemaName: storico
            indexName: ix_identita_digitali_identita_digitali_id_fk
            tableName: identita_digitali
            columns:
              - column:
                  name: identita_digitali_id
      rollback:
        - dropTable:
            schemaName: storico
            tableName: identita_digitali
        - dropSequence:
            schemaName: storico
            sequenceName: identita_digitali_id_seq
