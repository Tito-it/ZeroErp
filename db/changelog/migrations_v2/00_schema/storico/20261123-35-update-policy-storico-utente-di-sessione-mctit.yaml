# storico: le policy RLS leggono l'utente di sessione dal BB.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b; Q60 (a)).
#
# Il perche': ogni policy convertiva app.current_user_id da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, come
#   facevano funzioni e viste prima del giro 8. Ora la legge
#   script.fn_utente_di_sessione('<schema>.<tabella>.<policy>') (20261123-16):
#   assente o vuota resta NULL, e la policy nasconde come prima; un valore che
#   non e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, che nomina la
#   policy, invece del 22P02 grezzo su ogni lettura della tabella.
#   La lettura resta nella sottoquery non correlata della funzione di
#   perimetro: valutata una volta per istruzione, non per riga.
# La forma e' quella che dbops.fn_storico_arma_scope scrive dal 20261123-27
#   per le tabelle di storico nuove.
# Policy: assets.rls_sto_assets_ef_whitelist,
#   attivita_consumi.rls_sto_attivita_consumi_ef_whitelist,
#   attivita_fatturabili.rls_sto_attivita_fatturabili_ef_whitelist,
#   billing_account.rls_sto_billing_account_ef_whitelist,
#   clienti.rls_sto_clienti_ef_whitelist,
#   commesse.rls_sto_commesse_ef_whitelist,
#   commesse_attivita.rls_sto_commesse_attivita_ef_whitelist,
#   commesse_sorgenti.rls_sto_commesse_sorgenti_ef_whitelist,
#   ddt.rls_sto_ddt_ef_whitelist, ddt_righe.rls_sto_ddt_righe_ef_whitelist,
#   ddt_righe_prelievi.rls_sto_ddt_righe_prelievi_ef_whitelist,
#   eventi_assets.rls_sto_eventi_assets_ef_whitelist,
#   fatturazione_lotti.rls_sto_fatturazione_lotti_ef_whitelist,
#   fatturazione_lotti_esiti.rls_sto_fatturazione_lotti_esiti_ef_whitelist,
#   fatturazione_lotti_fatture.rls_sto_fatturazione_lotti_fatture_ef_whiteli
#   st, fatturazione_lotti_gruppi.rls_sto_fatturazione_lotti_gruppi_ef_white
#   list, fatture.rls_sto_fatture_ef_whitelist,
#   fatture_atti.rls_sto_fatture_atti_ef_whitelist,
#   fatture_indirizzi.rls_sto_fatture_indirizzi_ef_whitelist,
#   fatture_riepiloghi_iva.rls_sto_fatture_riepiloghi_iva_ef_whitelist,
#   fatture_righe.rls_sto_fatture_righe_ef_whitelist,
#   fatture_scadenze.rls_sto_fatture_scadenze_ef_whitelist,
#   flussi.rls_sto_flussi_ef_whitelist,
#   inventari.rls_sto_inventari_ef_whitelist,
#   inventari_righe.rls_sto_inventari_righe_ef_whitelist, istanze_dati_preco
#   ntrattuali.rls_sto_istanze_dati_precontrattuali_ef_whitelist,
#   lotti.rls_sto_lotti_ef_whitelist,
#   magazzini.rls_sto_magazzini_ef_whitelist,
#   movimenti.rls_sto_movimenti_ef_whitelist,
#   movimenti_attesi.rls_sto_movimenti_attesi_ef_whitelist,
#   note_flussi.rls_sto_note_flussi_ef_whitelist,
#   note_pratiche.rls_sto_note_pratiche_ef_whitelist,
#   ordini.rls_sto_ordini_ef_whitelist,
#   ordini_righe.rls_sto_ordini_righe_ef_whitelist,
#   ordini_righe_fulfillment.rls_sto_ordini_righe_fulfillment_ef_whitelist,
#   pratiche.rls_sto_pratiche_ef_whitelist,
#   pratiche_sorgenti.rls_sto_pratiche_sorgenti_ef_whitelist,
#   preventivi.rls_sto_preventivi_ef_whitelist,
#   resi.rls_sto_resi_ef_whitelist,
#   resi_righe.rls_sto_resi_righe_ef_whitelist,
#   resi_righe_accrediti.rls_sto_resi_righe_accrediti_ef_whitelist,
#   resi_righe_riconsegne.rls_sto_resi_righe_riconsegne_ef_whitelist,
#   resi_righe_rientri.rls_sto_resi_righe_rientri_ef_whitelist,
#   resi_righe_rinunce.rls_sto_resi_righe_rinunce_ef_whitelist,
#   rettifiche.rls_sto_rettifiche_ef_whitelist,
#   rettifiche_righe.rls_sto_rettifiche_righe_ef_whitelist,
#   ricevute.rls_sto_ricevute_ef_whitelist,
#   soggetti_titoli_iva.rls_sto_soggetti_titoli_iva_ef_whitelist, soggetti_t
#   itoli_iva_ambiti.rls_sto_soggetti_titoli_iva_ambiti_ef_whitelist, sogget
#   ti_titoli_iva_movimenti.rls_sto_soggetti_titoli_iva_movimenti_ef_whiteli
#   st, sospensioni.rls_sto_sospensioni_ef_whitelist,
#   trasferimenti.rls_sto_trasferimenti_ef_whitelist,
#   trasferimenti_righe.rls_sto_trasferimenti_righe_ef_whitelist.
# ALTER POLICY ... USING / WITH CHECK: nome, comando, ruoli e PERMISSIVE
#   invariati. Espressioni dal vivo (dbdev, 2026-11-23), lette con search_path
#   vuoto: ogni nome qualificato. Le espressioni di prima tornano col blocco
#   di ritorno del changeSet.
# Due stati legittimi, e solo quelli (correzione 2026-11-24): su un database
#   gia' in piedi le 53 policy ci sono e si riscrivono; su un database da zero
#   a questo punto le shadow esistono ma non hanno ancora RLS: le policy
#   nascono in 90_end (20260912-31, ci_apply) da dbops.fn_storico_arma_scope,
#   gia' nella forma nuova dal 20261123-27, e il changeSet non ha niente da
#   fare. La preCondition ferma (HALT) solo lo stato parziale; il blocco
#   tace quando le policy non ci sono. Come il 20261018-28.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/storico/20261123-35-update-policy-storico-utente-di-sessione-mctit.yaml

  - changeSet:
      id: 20261123-35-update-policy-storico-utente-di-sessione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        storico: le policy RLS leggono app.current_user_id da script.fn_utente_di_sessione invece di
        convertirlo da se'. Brief: brief-db-revisione-ui (§3.6-sexies, giro 8b).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "ok"
            sql: >
              SELECT CASE WHEN f.n = 1 AND p.n IN (0, 53) THEN 'ok'
                          ELSE format('funzione %s, policy %s di 53', f.n, p.n) END
                FROM (SELECT count(*) AS n FROM pg_catalog.pg_proc pr JOIN pg_catalog.pg_namespace n ON n.oid = pr.pronamespace
                       WHERE n.nspname = 'script' AND pr.proname = 'fn_utente_di_sessione') f,
                     (SELECT count(*) AS n FROM pg_catalog.pg_policies
                       WHERE (schemaname, tablename, policyname) IN (('storico', 'assets', 'rls_sto_assets_ef_whitelist'), ('storico', 'attivita_consumi', 'rls_sto_attivita_consumi_ef_whitelist'), ('storico', 'attivita_fatturabili', 'rls_sto_attivita_fatturabili_ef_whitelist'), ('storico', 'billing_account', 'rls_sto_billing_account_ef_whitelist'), ('storico', 'clienti', 'rls_sto_clienti_ef_whitelist'), ('storico', 'commesse', 'rls_sto_commesse_ef_whitelist'), ('storico', 'commesse_attivita', 'rls_sto_commesse_attivita_ef_whitelist'), ('storico', 'commesse_sorgenti', 'rls_sto_commesse_sorgenti_ef_whitelist'), ('storico', 'ddt', 'rls_sto_ddt_ef_whitelist'), ('storico', 'ddt_righe', 'rls_sto_ddt_righe_ef_whitelist'), ('storico', 'ddt_righe_prelievi', 'rls_sto_ddt_righe_prelievi_ef_whitelist'), ('storico', 'eventi_assets', 'rls_sto_eventi_assets_ef_whitelist'), ('storico', 'fatturazione_lotti', 'rls_sto_fatturazione_lotti_ef_whitelist'), ('storico', 'fatturazione_lotti_esiti', 'rls_sto_fatturazione_lotti_esiti_ef_whitelist'), ('storico', 'fatturazione_lotti_fatture', 'rls_sto_fatturazione_lotti_fatture_ef_whitelist'), ('storico', 'fatturazione_lotti_gruppi', 'rls_sto_fatturazione_lotti_gruppi_ef_whitelist'), ('storico', 'fatture', 'rls_sto_fatture_ef_whitelist'), ('storico', 'fatture_atti', 'rls_sto_fatture_atti_ef_whitelist'), ('storico', 'fatture_indirizzi', 'rls_sto_fatture_indirizzi_ef_whitelist'), ('storico', 'fatture_riepiloghi_iva', 'rls_sto_fatture_riepiloghi_iva_ef_whitelist'), ('storico', 'fatture_righe', 'rls_sto_fatture_righe_ef_whitelist'), ('storico', 'fatture_scadenze', 'rls_sto_fatture_scadenze_ef_whitelist'), ('storico', 'flussi', 'rls_sto_flussi_ef_whitelist'), ('storico', 'inventari', 'rls_sto_inventari_ef_whitelist'), ('storico', 'inventari_righe', 'rls_sto_inventari_righe_ef_whitelist'), ('storico', 'istanze_dati_precontrattuali', 'rls_sto_istanze_dati_precontrattuali_ef_whitelist'), ('storico', 'lotti', 'rls_sto_lotti_ef_whitelist'), ('storico', 'magazzini', 'rls_sto_magazzini_ef_whitelist'), ('storico', 'movimenti', 'rls_sto_movimenti_ef_whitelist'), ('storico', 'movimenti_attesi', 'rls_sto_movimenti_attesi_ef_whitelist'), ('storico', 'note_flussi', 'rls_sto_note_flussi_ef_whitelist'), ('storico', 'note_pratiche', 'rls_sto_note_pratiche_ef_whitelist'), ('storico', 'ordini', 'rls_sto_ordini_ef_whitelist'), ('storico', 'ordini_righe', 'rls_sto_ordini_righe_ef_whitelist'), ('storico', 'ordini_righe_fulfillment', 'rls_sto_ordini_righe_fulfillment_ef_whitelist'), ('storico', 'pratiche', 'rls_sto_pratiche_ef_whitelist'), ('storico', 'pratiche_sorgenti', 'rls_sto_pratiche_sorgenti_ef_whitelist'), ('storico', 'preventivi', 'rls_sto_preventivi_ef_whitelist'), ('storico', 'resi', 'rls_sto_resi_ef_whitelist'), ('storico', 'resi_righe', 'rls_sto_resi_righe_ef_whitelist'), ('storico', 'resi_righe_accrediti', 'rls_sto_resi_righe_accrediti_ef_whitelist'), ('storico', 'resi_righe_riconsegne', 'rls_sto_resi_righe_riconsegne_ef_whitelist'), ('storico', 'resi_righe_rientri', 'rls_sto_resi_righe_rientri_ef_whitelist'), ('storico', 'resi_righe_rinunce', 'rls_sto_resi_righe_rinunce_ef_whitelist'), ('storico', 'rettifiche', 'rls_sto_rettifiche_ef_whitelist'), ('storico', 'rettifiche_righe', 'rls_sto_rettifiche_righe_ef_whitelist'), ('storico', 'ricevute', 'rls_sto_ricevute_ef_whitelist'), ('storico', 'soggetti_titoli_iva', 'rls_sto_soggetti_titoli_iva_ef_whitelist'), ('storico', 'soggetti_titoli_iva_ambiti', 'rls_sto_soggetti_titoli_iva_ambiti_ef_whitelist'), ('storico', 'soggetti_titoli_iva_movimenti', 'rls_sto_soggetti_titoli_iva_movimenti_ef_whitelist'), ('storico', 'sospensioni', 'rls_sto_sospensioni_ef_whitelist'), ('storico', 'trasferimenti', 'rls_sto_trasferimenti_ef_whitelist'), ('storico', 'trasferimenti_righe', 'rls_sto_trasferimenti_righe_ef_whitelist'))) p
