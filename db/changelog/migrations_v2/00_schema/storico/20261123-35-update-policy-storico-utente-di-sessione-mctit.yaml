                      USING (((current_setting('app.ruolo_applicativo'::text, true) = 'OPERATORE'::text) AND script.fn_scope_ef_perimetro(( SELECT script.fn_get_emittenti_scope_pk_ids(script.fn_utente_di_sessione('storico.assets.rls_sto_assets_ef_whitelist')) AS fn_get_emittenti_scope_pk_ids), scope_emittente_fiscale_id)));
