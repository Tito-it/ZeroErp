        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $r$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_catalog.pg_policies
                                  WHERE schemaname = 'storico' AND policyname = 'rls_sto_assets_ef_whitelist') THEN
                      RAISE NOTICE 'storico: policy non ancora nate (database da zero), le crea 90_end gia'' nella forma nuova';
                      RETURN;
