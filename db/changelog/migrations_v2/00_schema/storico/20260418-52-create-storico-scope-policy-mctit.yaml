databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/storico/20260418-52-create-storico-scope-policy-mctit.yaml

  - changeSet:
      id: 20260418-52-create-storico-scope-policy
      author: mctit
      comment: >
        Tabella storica per config.scope_policy. Popolata automaticamente
        dal trigger script.trgfn_storico_generic via automation
        (TG_ARGV[0] = 'scope_policy_id').
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: config
              tableName: scope_policy
          - sqlCheck:
              expectedResult: 0
              sql: |
                SELECT COUNT(*) FROM pg_tables
                 WHERE schemaname = 'storico' AND tablename = 'scope_policy';
      changes:
        - createSequence:
            schemaName: storico
            sequenceName: scope_policy_id_seq
            startValue: 1
            incrementBy: 1
        - createTable:
            schemaName: storico
            tableName: scope_policy
            remarks: "Storico di config.scope_policy."
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueComputed: "nextval('storico.scope_policy_id_seq'::regclass)"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_storico_scope_policy
                    nullable: false
              - column:
                  name: scope_policy_id
                  type: integer
                  constraints:
                    nullable: false
              - column: { name: change_type, type: "char(1)", defaultValue: A }
              - column: { name: tipo_operazione, type: smallint }
              - column: { name: snapshot, type: jsonb }
              - column: { name: user_insert, type: text, defaultValueComputed: "CURRENT_USER" }
              - column: { name: data_insert, type: "timestamp with time zone", defaultValueComputed: "now()" }
              - column: { name: tx_id, type: uuid }
              - column: { name: valid_from, type: "timestamp with time zone", defaultValueComputed: "now()" }
              - column: { name: valid_to, type: "timestamp with time zone" }
        - createIndex:
            schemaName: storico
            indexName: ix_scope_policy_scope_policy_id_fk
            tableName: scope_policy
            columns:
              - column: { name: scope_policy_id }
      rollback:
        - dropTable: { schemaName: storico, tableName: scope_policy }
        - dropSequence: { schemaName: storico, sequenceName: scope_policy_id_seq }
