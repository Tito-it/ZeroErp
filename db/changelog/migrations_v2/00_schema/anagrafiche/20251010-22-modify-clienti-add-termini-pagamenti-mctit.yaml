databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20251010-22-modify-clienti-add-termini-pagamenti-mctit.yaml

  - changeSet:
      id: 20251010-22-modify-clienti-add-termini-pagamenti
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
          -  columnExists:
              schemaName: anagrafiche
              tableName: clienti
              columnName: termine_pagamento_id


      changes:
        - addColumn:
            schemaName: anagrafiche
            tableName: clienti
            columns:
              - column: { name: termine_pagamento_id, type: BIGINT }
        
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: clienti
            baseColumnNames: termine_pagamento_id
            referencedTableSchemaName: config
            referencedTableName: termini_pagamento
            referencedColumnNames: id
            constraintName: fk_clienti_termini_pagamento
            onDelete: NO ACTION
            onUpdate: CASCADE        

        - sql:
            splitStatements: false
            sql: |
                ALTER TABLE IF EXISTS anagrafiche.clienti 
                DROP CONSTRAINT IF EXISTS 
                chk_clienti_tipo_offset;

                ALTER TABLE IF EXISTS anagrafiche.clienti
                DROP CONSTRAINT IF EXISTS 
                chk_clienti_intervallo_uso;
                
                ALTER TABLE IF EXISTS anagrafiche.clienti
                DROP CONSTRAINT IF EXISTS 
                chk_clienti_intervallo_range;
                
        - dropColumn:
            schemaName: anagrafiche
            tableName: clienti 
            columnName: tipo_giorni_scadenza
        - dropColumn:
            schemaName: anagrafiche
            tableName: clienti 
            columnName: numero_giorni