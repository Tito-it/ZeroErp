# Liquibase changelog per Zero ERP
# Aggiunge stato_fornitore_id FK a anagrafiche.fornitori.
# Sostituira stato_operativo (VARCHAR libero) con FK normalizzata
# verso config.stati_fornitore.
# La colonna e nullable inizialmente: la migrazione dati e il
# NOT NULL + drop di stato_operativo saranno in changeset separati.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20260324-23-alter-fornitori-add-stato-fornitore-id-mctit.yaml

  - changeSet:
      id: 20260324-23-alter-fornitori-add-stato-fornitore-id
      author: mctit
      comment: >
        Aggiunge colonna stato_fornitore_id (INTEGER, nullable) con FK
        verso config.stati_fornitore. La colonna e nullable perche serve
        prima il seed dati in config.stati_fornitore e poi la migrazione
        dei valori da stato_operativo. Il NOT NULL e il drop di
        stato_operativo saranno in changeset successivi.
      changes:
        # 1. Aggiungere colonna
        - addColumn:
            schemaName: anagrafiche
            tableName: fornitori
            columns:
              - column:
                  name: stato_fornitore_id
                  type: integer
                  remarks: "FK verso config.stati_fornitore. Sostituisce stato_operativo."
                  constraints:
                    nullable: true

        # 2. FK verso config.stati_fornitore
        - addForeignKeyConstraint:
            constraintName: fk_fornitori_stati_fornitore
            baseTableSchemaName: anagrafiche
            baseTableName: fornitori
            baseColumnNames: stato_fornitore_id
            referencedTableSchemaName: config
            referencedTableName: stati_fornitore
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: fornitori
            constraintName: fk_fornitori_stati_fornitore
        - dropColumn:
            schemaName: anagrafiche
            tableName: fornitori
            columnName: stato_fornitore_id
