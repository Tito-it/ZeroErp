# Liquibase changelog per Zero ERP
# Creazione tabella anagrafiche.bank_branches (filiali di istituti di credito)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20251123-15-create-bank-branches-mctit.yaml

  - changeSet:
      id: 20251123-15-create-bank-branches
      author: mctit
      comment: >
        Crea la tabella anagrafiche.bank_branches per gestire le filiali
        di istituti di credito (bank_code/branch_code, BIC, descrizione)
        collegate a anagrafiche.soggetti_ruoli (ruolo ISTITUTO_CREDITO).

      changes:
        - createTable:
            schemaName: anagrafiche
            tableName: bank_branches
            remarks: "Filiali di istituti di credito / bank branches collegate a soggetti_ruoli (ISTITUTO_CREDITO)."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata della filiale."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bank_branches
                    nullable: false

              - column:
                  name: soggetto_ruolo_id
                  type: bigint
                  remarks: "FK → anagrafiche.soggetti_ruoli.id (ruolo ISTITUTO_CREDITO)."
                  constraints:
                    nullable: false

              # Codice banca nazionale (es. ABI in Italia)
              - column:
                  name: bank_code
                  type: varchar(16)
                  remarks: "Codice banca nazionale (es. ABI in Italia)."
                  constraints:
                    nullable: false

              # Codice filiale / branch (es. CAB in Italia)
              - column:
                  name: branch_code
                  type: varchar(16)
                  remarks: "Codice filiale/sportello (es. CAB in Italia)."
                  constraints:
                    nullable: false

              # BIC/SWIFT a livello filiale (8 o 11 caratteri)
              - column:
                  name: bic_swift
                  type: varchar(11)
                  remarks: "BIC/SWIFT 8 o 11 caratteri (alfanumerico, uppercase)."
                  constraints:
                    nullable: true

              # Nome banca + eventuale nome filiale
              - column:
                  name: name
                  type: varchar(255)
                  remarks: "Nome banca + eventuale nome filiale (descrizione completa per UI/report)."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni in formato JSONB."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Flag di abilitazione all'uso della filiale."
                  constraints:
                    nullable: false

              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se TRUE, abilita snapshot su UPDATE/DELETE (gestito da trigger generico)."
                  constraints:
                    nullable: false

              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction ID per correlazione audit/log."
                  constraints:
                    nullable: true

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente che ha effettuato l'inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente che ha effettuato l'ultima modifica (audit)."
                  constraints:
                    nullable: false

        # FK verso anagrafiche.soggetti_ruoli
        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: bank_branches
            baseColumnNames: soggetto_ruolo_id
            constraintName: fk_bank_branches_soggetti_ruoli
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti_ruoli
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        # Unicità filiale per soggetto_ruolo + codici nazionali
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: bank_branches
            columnNames: soggetto_ruolo_id, bank_code, branch_code
            constraintName: uq_bank_branches_soggetto_ruolo_bank_branch_code

        # Check su BIC/SWIFT: 8 o 11 caratteri, uppercase alfanumerico

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE anagrafiche.bank_branches
              ADD CONSTRAINT check_bank_branches_bic_swift_fmt
              CHECK ( bic_swift IS NULL OR bic_swift ~ '^[A-Z0-9]{8}([A-Z0-9]{3})?$');

        # Indice per ricerche su soggetto_ruolo_id
        - createIndex:
            schemaName: anagrafiche
            tableName: bank_branches
            indexName: ix_bank_branches_soggetto_ruolo_id
            columns:
              - column:
                  name: soggetto_ruolo_id

        # Indice per ricerche su attivo
        - createIndex:
            schemaName: anagrafiche
            tableName: bank_branches
            indexName: ix_bank_branches_attivo
            columns:
              - column:
                  name: attivo
