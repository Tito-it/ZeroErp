# Indice GIN trigram su id_fiscale_univoco_cf_piva per ricerca universale ILIKE.
# Complementa ix_soggetti_ragione_sociale_completa_trgm (20260120-01).
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260310-03-create-ix-soggetti-id-fiscale-trgm-mctit.yaml

    - changeSet:
          id: 20260310-03-create-ix-soggetti-id-fiscale-univoco-trgm
          author: mctit
          preConditions:
              - onFail: MARK_RAN
              - onError: HALT
              - tableExists:
                    schemaName: anagrafiche
                    tableName: soggetti
              - columnExists:
                    schemaName: anagrafiche
                    tableName: soggetti
                    columnName: id_fiscale_univoco_cf_piva
          sql:
              splitStatements: false
              sql: |
                  -- Indice GIN trigram per ricerca ILIKE su CF/P.IVA
                  CREATE INDEX IF NOT EXISTS ix_soggetti_id_fiscale_univoco_trgm
                  ON anagrafiche.soggetti
                  USING gin (id_fiscale_univoco_cf_piva gin_trgm_ops)
                  WITH (fastupdate = true, gin_pending_list_limit = 4194304)
                  TABLESPACE pg_default;
