databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260227-04-add-valuta-id-emittenti-fiscali-mctit.yaml

  - changeSet:
      id: 20260227-04-add-valuta-id-emittenti-fiscali
      author: mctit
      comment: "Aggiunge valuta_id a emittenti_fiscali: override valuta per entita` giuridica emittente, fallback su gestore."
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: anagrafiche
                tableName: emittenti_fiscali
                columnName: valuta_id
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE anagrafiche.emittenti_fiscali
                ADD COLUMN valuta_id integer;


              COMMENT ON COLUMN anagrafiche.emittenti_fiscali.valuta_id
                IS 'Valuta override per emittente. Se NULL, fallback su gestore.';
