# Liquibase changelog per Zero ERP
# Aggiunge unita_organizzativa_id a anagrafiche.contatti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20260107-03-add-unita-organizzativa-to-contatti-mctit.yaml

  - changeSet:
      id: 20260107-03-add-unita-organizzativa-to-contatti
      author: mctit
      comment: >
        Aggiunge il riferimento all'unita organizzativa per separare
        il reparto dalla categoria di contatto.
      changes:
        - addColumn:
            schemaName: anagrafiche
            tableName: contatti
            columns:
              - column:
                  name: unita_organizzativa_id
                  type: integer
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: contatti
            baseColumnNames: unita_organizzativa_id
            referencedTableSchemaName: config
            referencedTableName: unita_organizzative
            referencedColumnNames: id
            constraintName: fk_contatti_unita_organizzative_config
            onDelete: RESTRICT
            onUpdate: CASCADE

        - createIndex:
            schemaName: anagrafiche
            tableName: contatti
            indexName: ix_contatti_unita_organizzativa_id
            columns:
              - column:
                  name: unita_organizzativa_id

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN anagrafiche.contatti.unita_organizzativa_id
              IS 'Riferimento al reparto/ufficio (config.unita_organizzative).';
