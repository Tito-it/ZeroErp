        - columnExists:
            schemaName: anagrafiche
            tableName: clienti
            columnName: nr_giorni_scadenza
      changes:
        - dropNotNullConstraint:
            schemaName: anagrafiche
            tableName: clienti
            columnName: nr_giorni_scadenza
      rollback:
