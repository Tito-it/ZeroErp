# Liquibase changelog per Zero ERP
# Aggiunge utility_id a anagrafiche.soggetti_ruoli_conti_bancari
# per supportare conti bancari specifici per utility.
# Sostituisce i vincoli UNIQUE con partial unique index
# che gestiscono NULL su utility_id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20260324-03-add-utility-id-src-bancari-mctit.yaml

  - changeSet:
      id: 20260324-03-add-utility-id-src-bancari
      author: mctit
      comment: >
        Aggiunge colonna utility_id a anagrafiche.soggetti_ruoli_conti_bancari
        con FK verso config.utilities. Sostituisce i vincoli UNIQUE e il partial
        index predefinito con nuovi partial unique index per gestire NULL su utility_id.
      changes:
        # 1. Aggiungere colonna utility_id
        - addColumn:
            schemaName: anagrafiche
            tableName: soggetti_ruoli_conti_bancari
            columns:
              - column:
                  name: utility_id
                  type: integer
                  constraints:
                    nullable: true

        # 2. FK verso config.utilities
        - addForeignKeyConstraint:
            constraintName: fk_soggetti_ruoli_conti_bancari_utilities
            baseTableSchemaName: anagrafiche
            baseTableName: soggetti_ruoli_conti_bancari
            baseColumnNames: utility_id
            referencedTableSchemaName: config
            referencedTableName: utilities
            referencedColumnNames: id

        # 3. Rimuovere il vecchio vincolo UNIQUE (ruolo, conto, uso)
        - dropUniqueConstraint:
            schemaName: anagrafiche
            tableName: soggetti_ruoli_conti_bancari
            constraintName: uq_soggetti_ruoli_conti_bancari_soggetto_ruolo_id_conto_bancari

        # 4. Rimuovere il vecchio partial unique index predefinito
        - sql:
            sql: >
              DROP INDEX IF EXISTS anagrafiche.ix_soggetti_ruoli_conti_bancari_predef_per_uso

        # 5. Partial unique: legame (ruolo, utility, conto, uso) con utility valorizzata
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_src_bancari_ruolo_utility_conto_uso
              ON anagrafiche.soggetti_ruoli_conti_bancari (soggetto_ruolo_id, utility_id, conto_bancario_id, uso)
              WHERE utility_id IS NOT NULL

        # 6. Partial unique: legame (ruolo, conto, uso) senza utility
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_src_bancari_ruolo_conto_uso_no_utility
              ON anagrafiche.soggetti_ruoli_conti_bancari (soggetto_ruolo_id, conto_bancario_id, uso)
              WHERE utility_id IS NULL

        # 7. Partial unique: un solo predefinito per (ruolo, utility, uso) con utility valorizzata
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_src_bancari_predefinito_utility
              ON anagrafiche.soggetti_ruoli_conti_bancari (soggetto_ruolo_id, utility_id, uso)
              WHERE predefinito = true AND utility_id IS NOT NULL

        # 8. Partial unique: un solo predefinito per (ruolo, uso) senza utility
        - sql:
            sql: >
              CREATE UNIQUE INDEX uq_src_bancari_predefinito_no_utility
              ON anagrafiche.soggetti_ruoli_conti_bancari (soggetto_ruolo_id, uso)
              WHERE predefinito = true AND utility_id IS NULL

        # 9. Indice su utility_id
        - createIndex:
            schemaName: anagrafiche
            tableName: soggetti_ruoli_conti_bancari
            indexName: ix_soggetti_ruoli_conti_bancari_utility_id
            columns:
              - column:
                  name: utility_id
