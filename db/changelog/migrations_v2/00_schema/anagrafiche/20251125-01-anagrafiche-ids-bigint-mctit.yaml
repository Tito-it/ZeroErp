# Liquibase changelog per Zero ERP
# Migrazione ID anagrafiche.* da integer a bigint
# e riallineamento delle foreign key collegate.
# ------------------------------------------------------------

databaseChangeLog:
        - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20251125-01-anagrafiche-ids-bigint-mctit.yaml

        - changeSet:
                  id: 20251125-01-anagrafiche-ids-bigint
                  author: mctit
                  # runAlways: true
                  validCheckSums: <ANY>
                  comment: >
                          Migrazione dei campi ID delle tabelle dello schema anagrafiche
                          (billing_account, clienti, contatti, gestori, gestori_utilities,
                           indirizzi, indirizzi_dettaglio, istanze_utilities, soggetti_ruoli)
                          da integer a bigint, con allineamento di tutte le FK che li referenziano.
                          NB: ambiente ancora di test, nessun dato di produzione.

                  preConditions:
                          - onFail: MARK_RAN # se la colonna è già bigint, segna il changeSet come eseguito e salta
                          - onError: MARK_RAN # in caso di errore nella precondizione, non bloccare la CI
                          - sqlCheck:
                                    expectedResult: 1
                                    sql: |
                                            SELECT COUNT(*)
                                              FROM information_schema.columns
                                              WHERE table_schema = 'anagrafiche'
                                              AND table_name   = 'billing_account'
                                              AND column_name  = 'id'
                                              AND data_type   <> 'bigint';

                  changes:
                          - sql:
                                    splitStatements: false
                                    stripComments: false
                                    sql: |
                                            DROP VIEW IF EXISTS script.view_clienti_istanza_states;
                                            DROP VIEW IF EXISTS dbops.diag_v_clienti_links;
                                            DROP VIEW IF EXISTS anagrafiche.vw_conti_bancari_per_ruolo;

                                            DROP TRIGGER IF EXISTS trg_ordini_a10_ao_only_consegna_tipo_con_ins_upd ON acquisti.ordini;
                                            DROP TRIGGER IF EXISTS trg_pdp_protect_cols_upd ON anagrafiche.pdp;
                                            DROP TRIGGER IF EXISTS trg_ordini_a10_ins_upd_ao_only_consegna_tipo_con ON acquisti.ordini;
                                            DROP TRIGGER IF EXISTS trg_pdp_upd_protect_cols ON anagrafiche.pdp;

