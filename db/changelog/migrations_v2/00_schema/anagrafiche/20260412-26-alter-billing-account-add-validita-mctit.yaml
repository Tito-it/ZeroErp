# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: anagrafiche.billing_account.
# valido_dal nullable (DEFAULT CURRENT_DATE) → validita nullable.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260412-26-alter-billing-account-add-validita-mctit.yaml

  - changeSet:
      id: 20260412-26-alter-billing-account-add-validita
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Migrazione daterange per anagrafiche.billing_account.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              {
                schemaName: anagrafiche,
                tableName: billing_account,
                columnName: validita,
              }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.billing_account
                ADD COLUMN validita daterange;

              COMMENT ON COLUMN anagrafiche.billing_account.validita
                IS 'Range di validita` calcolato dal trigger sync da valido_dal/valido_al. Non scrivere direttamente.';

              DROP TRIGGER IF EXISTS trg_billing_account_a20_set_validita_ins_upd ON anagrafiche.billing_account;
              CREATE TRIGGER trg_billing_account_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON anagrafiche.billing_account
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();

              UPDATE anagrafiche.billing_account
                 SET validita = daterange(
                     COALESCE(valido_dal, '-infinity'::date),
                     COALESCE(valido_al, 'infinity'::date),
                     '[]')
               WHERE validita IS NULL;

              ALTER TABLE anagrafiche.billing_account
                ALTER COLUMN validita SET NOT NULL;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_billing_account_a20_set_validita_ins_upd ON anagrafiche.billing_account;
              ALTER TABLE anagrafiche.billing_account DROP COLUMN IF EXISTS validita;
