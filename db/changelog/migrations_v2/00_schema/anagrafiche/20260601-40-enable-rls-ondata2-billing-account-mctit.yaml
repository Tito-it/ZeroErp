#
# Fase 9 — Ondata 2, PARTE B: ENABLE ROW LEVEL SECURITY (NO FORCE) su
# anagrafiche.billing_account.
#
# ⚠️ BLAST RADIUS ALTO. billing_account e' dati MASTER riferito da gran
# parte del backend (fatturazione, contratti, ordini, ricerca, pricing).
# Con RLS attiva, qualunque connessione SENZA un GUC valido
# (ruolo_applicativo IN OPERATORE/CLIENTE_PORTALE/SHOP_CUSTOMER + scope)
# vedrebbe 0 billing_account. Attivare SOLO dopo aver verificato che TUTTI
# i consumatori interni propagano il contesto (GUC) corretto — cfr. §0
# "il consumatore backend interno come OPERATORE e i GUC esistono gia'".
#
# Da applicare DOPO Ondata 1 (-38) e Ondata 2 parte A (-39) validate, e
# con un benchmark/verifica dedicati sulle list-view che leggono i BA.
#
# Policy presenti: rls_billing_account_self_ownership (portale/shop) +
# rls_billing_account_ef_whitelist (operatore, -36). NO FORCE; rollback =
# DISABLE (kill-switch). Istantaneo: ALTER TABLE ... DISABLE ROW LEVEL SECURITY;
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260601-40-enable-rls-ondata2-billing-account-mctit.yaml

  - changeSet:
      id: 20260601-40-enable-rls-ondata2-billing-account
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ENABLE ROW LEVEL SECURITY (no FORCE) su anagrafiche.billing_account
        (Ondata 2 parte B). BLAST RADIUS ALTO (dati master): attivare solo
        dopo verifica propagazione GUC su tutti i consumatori interni.
        Rollback = DISABLE.
      preConditions:
        - onFail: HALT
        - onFailMessage: >
            Policy operatore su billing_account mancante: verificare
            rls_billing_account_ef_whitelist (-36) prima dell'ENABLE.
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_policies
               WHERE schemaname='anagrafiche' AND tablename='billing_account'
                 AND policyname='rls_billing_account_ef_whitelist';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.billing_account ENABLE ROW LEVEL SECURITY;
      rollback:
        - sql:
            sql: |
              ALTER TABLE anagrafiche.billing_account DISABLE ROW LEVEL SECURITY;
