# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: anagrafiche.resellers_billing_account.
# valido_dal NOT NULL → validita NOT NULL.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260412-28-alter-resellers-billing-account-add-validita-mctit.yaml

  - changeSet:
      id: 20260412-28-alter-resellers-billing-account-add-validita
      author: mctit
      comment: >
        Migrazione daterange per anagrafiche.resellers_billing_account.
        valido_dal NOT NULL: validita diventa NOT NULL dopo backfill.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists: { schemaName: anagrafiche, tableName: resellers_billing_account, columnName: validita }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE anagrafiche.resellers_billing_account
                ADD COLUMN validita daterange;

              COMMENT ON COLUMN anagrafiche.resellers_billing_account.validita
                IS 'Range di validita` calcolato dal trigger sync da valido_dal/valido_al. Non scrivere direttamente.';

              DROP TRIGGER IF EXISTS trg_resellers_ba_a20_set_validita_ins_upd ON anagrafiche.resellers_billing_account;
              CREATE TRIGGER trg_resellers_ba_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON anagrafiche.resellers_billing_account
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();

              UPDATE anagrafiche.resellers_billing_account
                 SET validita = daterange(valido_dal, COALESCE(valido_al, 'infinity'::date), '[]')
               WHERE validita IS NULL;

              ALTER TABLE anagrafiche.resellers_billing_account
                ALTER COLUMN validita SET NOT NULL;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_resellers_ba_a20_set_validita_ins_upd ON anagrafiche.resellers_billing_account;
              ALTER TABLE anagrafiche.resellers_billing_account DROP COLUMN IF EXISTS validita;
