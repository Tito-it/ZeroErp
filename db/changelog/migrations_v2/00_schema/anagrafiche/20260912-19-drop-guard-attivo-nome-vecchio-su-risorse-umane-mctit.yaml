# VIA IL GUARD CHE LEGGEVA LA VISTA COL NOME VECCHIO (strato 2).
#   Analisi: analisi-software-per-dati-morti.md §6.2 · precedente: 00_schema/-11
#
# `trg_risorse_umane_a10_risorse_umane_auth_user_block_deact_upd` e' il guard di
# automazione ATTIVO nato quando risorse_umane_auth_user era una TABELLA figlia.
# Dopo il cutover il nome risolve la VISTA, e il guard ha continuato a funzionare
# per caso (la vista ha risorsa_umana_id e attivo). Con la vista ritirata
# (90_end/-26) solleverebbe E_ATTIVO_BLOCK_FKCOL_NOT_FOUND a ogni disattivazione
# di una risorsa umana — la stessa mina del -10, disinnescata dal -11.
# La regola che portava vive ora nel guard scritto a mano (20_code/-18), che nella
# timeline sta PRIMA di questo file: nessuna finestra senza guard.
#
# ── ✅ `DROP TRIGGER IF EXISTS`: la forma lecita su un trigger da ci_apply ──
#   L'automazione genera dalle FK in pg_constraint: una vista non ne ha, quindi
#   su un database ricostruito da zero il trigger non nasce e IF EXISTS passa;
#   su dev non rinasce. ⛔ Niente preCondition che lo conti: §11.5.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260912-19-drop-guard-attivo-nome-vecchio-su-risorse-umane-mctit.yaml

  - changeSet:
      id: 20260912-19-drop-guard-attivo-nome-vecchio-su-risorse-umane
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Toglie da anagrafiche.risorse_umane il guard di automazione che leggeva la
        vista risorse_umane_auth_user (nome vecchio): la regola vive nel guard scritto
        a mano del 20260912-18. IF EXISTS: in CI non nasce (una vista non ha FK).
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: anagrafiche, tableName: risorse_umane }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_risorse_umane_a10_risorse_umane_auth_user_block_deact_upd
                  ON anagrafiche.risorse_umane;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Non si ricrea un guard su una vista in ritiro: solleverebbe a ogni
              -- disattivazione. Forward-only.
              SELECT 1;
