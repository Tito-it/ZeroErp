# Liquibase changelog per Zero ERP
# Rende obbligatorio contatti.tipo_contatto_id (NOT NULL)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20260324-01-make-contatti-tipo-contatto-not-null-mctit.yaml

  - changeSet:
      id: 20260324-01-make-contatti-tipo-contatto-not-null
      author: mctit
      comment: >
        Rende obbligatorio tipo_contatto_id: ogni contatto deve avere un tipo.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*)
              FROM anagrafiche.contatti
              WHERE tipo_contatto_id IS NULL
      changes:
        - addNotNullConstraint:
            schemaName: anagrafiche
            tableName: contatti
            columnName: tipo_contatto_id
            columnDataType: integer
