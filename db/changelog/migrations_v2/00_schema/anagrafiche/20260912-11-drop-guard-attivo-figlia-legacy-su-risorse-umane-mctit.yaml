# 🔴 NESSUNA RISORSA UMANA SI PUÒ PIÙ DISATTIVARE (dev, dal 12-09 11:30).
#   Analisi: analisi-software-per-dati-morti.md §2.1 (coda del 12-09)
#
# Il `90_end/20260912-10` ha eliminato la figlia
# `anagrafiche._legacy_risorse_umane_auth_user` con le sue due trigger function.
# Ma sulla MADRE `anagrafiche.risorse_umane` restava il guard generato
# dall'automazione ATTIVO per quella FK:
#   trg_risorse_umane_a10_legacy_risorse_umane_auth_user_blo_feea48
#     BEFORE UPDATE OF attivo → dbops.trgfn_prevent_deactivate_if_children(
#       'anagrafiche', '_legacy_risorse_umane_auth_user', 'risorsa_umana_id', 'id', 'attivo')
# Alla transizione attivo true→false il guard cerca in `pg_attribute` la
# colonna FK della figlia; per una figlia che non esiste non la trova e
# SOLLEVA `E_ATTIVO_BLOCK_FKCOL_NOT_FOUND`. Provato il 12-09 in ROLLBACK:
# `UPDATE anagrafiche.risorse_umane SET attivo = false` → P0001.
#
# ⭐ È la stessa lezione del `-10` un passo più in là: cancellare una fonte
#   vuol dire censire i lettori, e un trigger sulla MADRE è un lettore della
#   FIGLIA — vive addosso a un'altra tabella, quindi un `DROP TABLE` non lo
#   porta via e un censimento «chi nomina la tabella» lo trova solo se guarda
#   anche `pg_trigger` dei padri.
#
# ── ✅ `DROP TRIGGER IF EXISTS`: la forma lecita su un trigger da ci_apply ──
#   L'automazione ATTIVO genera i guard dalle FK in `pg_constraint`: su un
#   database ricostruito da zero la FK non c'è più, il trigger non nasce e
#   IF EXISTS passa. Su dev non viene rigenerato per la stessa ragione.
#   ⛔ Niente preCondition che lo conti: §11.5 delle linee guida.
#
# ⚠️ Il gemello sul NOME VECCHIO resta apposta:
#   trg_risorse_umane_a10_risorse_umane_auth_user_block_deact_upd
#   nomina la vista `anagrafiche.risorse_umane_auth_user` e oggi FUNZIONA
#   (la vista ha `risorsa_umana_id` e `attivo`): è l'unico guard che impedisce
#   di disattivare una risorsa umana con un'identità OPERATORE attiva —
#   `identita_digitali` non ha un guard suo su `soggetti_ruoli`. Sparirà con la
#   vista (strato 2), e prima va deciso se la regola migra sul figlio vero.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260912-11-drop-guard-attivo-figlia-legacy-su-risorse-umane-mctit.yaml

  - changeSet:
      id: 20260912-11-drop-guard-attivo-figlia-legacy-su-risorse-umane
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Toglie da anagrafiche.risorse_umane il guard di disattivazione generato
        per la figlia _legacy_risorse_umane_auth_user, eliminata dal 20260912-10:
        con la figlia assente il guard solleva E_ATTIVO_BLOCK_FKCOL_NOT_FOUND su
        ogni UPDATE attivo true->false della madre. IF EXISTS: in CI non nasce.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: anagrafiche, tableName: risorse_umane }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_risorse_umane_a10_legacy_risorse_umane_auth_user_blo_feea48
                  ON anagrafiche.risorse_umane;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Non si ricrea un guard su una figlia che non esiste: solleverebbe
              -- a ogni disattivazione. Forward-only.
              SELECT 1;
