databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260514-31-alter-categorie-clienti-listini-validita-stored-mctit.yaml

  # ---------------------------------------------------------------------------
  # Step 2b — anagrafiche.categorie_clienti_listini.
  # Due indici da ricreare:
  #   - ex_categ_cli_listini_no_overlap: EXCLUDE gist con COALESCE(classe_utenza_id,-1)
  #                                      WHERE (attivo IS TRUE)
  #   - ix_categ_cli_listini_validita_gist: GiST standalone su validita
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260514-31-alter-categorie-clienti-listini-validita-stored
      author: mctit
      comment: >
        Step 2b PG18: converte validita a STORED generated su
        anagrafiche.categorie_clienti_listini. Ricrea EXCLUDE con COALESCE
        e indice GiST standalone.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: anagrafiche
              tableName: categorie_clienti_listini
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_attribute a
                  JOIN pg_class c ON c.oid = a.attrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname='anagrafiche' AND c.relname='categorie_clienti_listini'
                   AND a.attname='validita' AND a.attnum>0
                   AND NOT a.attisdropped AND a.attgenerated=''
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_categorie_clienti_listini_a20_set_validita_ins_upd
                  ON anagrafiche.categorie_clienti_listini;

              -- DROP CASCADE rimuove ex_categ_cli_listini_no_overlap e ix_categ_cli_listini_validita_gist
              ALTER TABLE anagrafiche.categorie_clienti_listini DROP COLUMN validita CASCADE;

              ALTER TABLE anagrafiche.categorie_clienti_listini
                  ADD COLUMN validita DATERANGE
                      GENERATED ALWAYS AS (
                          daterange(COALESCE(valido_dal,'-infinity'::date),
                                    COALESCE(valido_al, 'infinity'::date),'[]')
                      ) STORED NOT NULL;

              COMMENT ON COLUMN anagrafiche.categorie_clienti_listini.validita IS
                  'Range calcolato da valido_dal/valido_al. GENERATED ALWAYS STORED. rev 2026-05-14.';

              -- EXCLUDE con COALESCE su classe_utenza_id (nullable → sentinel -1)
              CREATE INDEX ex_categ_cli_listini_no_overlap
                  ON anagrafiche.categorie_clienti_listini
                  USING gist (
                      categoria_cliente_id,
                      utility_id,
                      emittente_soggetto_ruolo_id,
                      COALESCE(classe_utenza_id, '-1'::integer),
                      validita
                  )
                  WHERE (attivo IS TRUE);

              CREATE INDEX ix_categ_cli_listini_validita_gist
                  ON anagrafiche.categorie_clienti_listini
                  USING gist (validita);
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP INDEX IF EXISTS anagrafiche.ex_categ_cli_listini_no_overlap;
              DROP INDEX IF EXISTS anagrafiche.ix_categ_cli_listini_validita_gist;
              ALTER TABLE anagrafiche.categorie_clienti_listini DROP COLUMN IF EXISTS validita;
              ALTER TABLE anagrafiche.categorie_clienti_listini ADD COLUMN validita DATERANGE;
              UPDATE anagrafiche.categorie_clienti_listini SET validita=daterange(COALESCE(valido_dal,'-infinity'::date),COALESCE(valido_al,'infinity'::date),'[]');
              ALTER TABLE anagrafiche.categorie_clienti_listini ALTER COLUMN validita SET NOT NULL;
              CREATE INDEX ex_categ_cli_listini_no_overlap ON anagrafiche.categorie_clienti_listini USING gist (categoria_cliente_id,utility_id,emittente_soggetto_ruolo_id,COALESCE(classe_utenza_id,'-1'::integer),validita) WHERE (attivo IS TRUE);
              CREATE INDEX ix_categ_cli_listini_validita_gist ON anagrafiche.categorie_clienti_listini USING gist (validita);
