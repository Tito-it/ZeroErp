# Creazione tabella anagrafiche.categorie_clienti.
# Categorie commerciali cliente (STANDARD, BASE, SILVER, GOLD, PLATINUM)
# con flag di partecipazione alla promo. Pricing v5 - riferimento
# sviluppo-listini-v5.md sezione 4.1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20260414-01-create-categorie-clienti-mctit.yaml

  - changeSet:
      id: 20260414-01-create-categorie-clienti
      author: mctit
      comment: >
        Crea la tabella anagrafiche.categorie_clienti.
        Sorgente unica di verita per le categorie commerciali cliente
        usate dal resolver prezzo v5 (STADIO 2 - categoria -> listino).

      changes:
        - createTable:
            schemaName: anagrafiche
            tableName: categorie_clienti
            remarks: "Categorie commerciali cliente con flag partecipazione promo e ordinamento UI."
            columns:
              - column:
                  name: id
                  type: smallint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata della categoria."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categorie_clienti
                    nullable: false

              - column:
                  name: codice
                  type: varchar(32)
                  remarks: "Codice univoco della categoria (es. STANDARD, SILVER, GOLD)."
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: varchar(255)
                  remarks: "Descrizione estesa visualizzata in UI."
                  constraints:
                    nullable: false

              - column:
                  name: partecipa_promo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se TRUE i BA di questa categoria ricevono le promo overlay (STADIO 0 resolver)."
                  constraints:
                    nullable: false

              - column:
                  name: ordinamento
                  type: smallint
                  defaultValueNumeric: 100
                  remarks: "Ordinamento presentazione UI; valori bassi appaiono prima."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estensibili in formato JSONB."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Flag di abilitazione della categoria."
                  constraints:
                    nullable: false

              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction ID per correlazione audit/log."
                  constraints:
                    nullable: true

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente che ha effettuato l'inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente che ha effettuato l'ultima modifica (audit)."
                  constraints:
                    nullable: false

        # Unicita del codice categoria
        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: categorie_clienti
            columnNames: codice
            constraintName: uq_categorie_clienti_codice

        # Indice su attivo per filtri UI
        - createIndex:
            schemaName: anagrafiche
            tableName: categorie_clienti
            indexName: ix_categorie_clienti_attivo
            columns:
              - column:
                  name: attivo

      rollback:
        - dropTable:
            schemaName: anagrafiche
            tableName: categorie_clienti
