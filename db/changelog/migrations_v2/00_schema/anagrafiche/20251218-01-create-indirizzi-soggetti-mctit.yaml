# Liquibase changelog per Zero ERP
# Creazione tabella anagrafiche.indirizzi_soggetti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/anagrafiche/20251123-16-create-indirizzi-soggetti-mctit.yaml

  - changeSet:
      id: 20251123-16-create-indirizzi-soggetti
      author: mctit
      comment: >
        Crea la tabella anagrafiche.indirizzi_soggetti per gestire
        indirizzi associati direttamente al soggetto (non al ruolo),
        con supporto a indirizzi normalizzati e liberi/internazionali,
        audit, tx_id e storicizzazione.

      changes:
        - createTable:
            schemaName: anagrafiche
            tableName: indirizzi_soggetti
            remarks: "Indirizzi associati direttamente ai soggetti (non ai ruoli)."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata indirizzo soggetto."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_indirizzi_soggetti
                    nullable: false

              - column:
                  name: soggetto_id
                  type: uuid
                  remarks: "FK → anagrafiche.soggetti.id"
                  constraints:
                    nullable: false

              - column:
                  name: tipo_indirizzo_id
                  type: integer
                  remarks: "FK → config.tipi_indirizzi.id"
                  constraints:
                    nullable: false

              # ---- indirizzo normalizzato (Italia / stradario) ----
              - column:
                  name: indirizzo_dettaglio_id
                  type: bigint
                  remarks: "FK opzionale → anagrafiche.indirizzi_dettaglio.id"
                  constraints:
                    nullable: true

              # ---- indirizzo libero / internazionale ----
              - column:
                  name: indirizzo_libero
                  type: text
                  remarks: "Indirizzo libero (estero o non normalizzato)."
                  constraints:
                    nullable: true

              - column:
                  name: stato_id
                  type: integer
                  remarks: "Stato (internazionalizzazione)."
                  constraints:
                    nullable: true

              - column:
                  name: administrative_area
                  type: varchar(100)
                  remarks: "Area amministrativa (estero)."
                  constraints:
                    nullable: true

              - column:
                  name: locality
                  type: varchar(100)
                  remarks: "Città / località (estero)."
                  constraints:
                    nullable: true

              - column:
                  name: sublocality
                  type: varchar(100)
                  remarks: "Frazione / quartiere (estero)."
                  constraints:
                    nullable: true

              - column:
                  name: postal_box
                  type: varchar(20)
                  remarks: "Casella postale (PO Box)."
                  constraints:
                    nullable: true

              - column:
                  name: comune_id
                  type: integer
                  remarks: "FK → config.comuni.id (se disponibile)."
                  constraints:
                    nullable: true

              - column:
                  name: codice_postale_id
                  type: integer
                  remarks: "FK → config.codici_postali.id (se disponibile)."
                  constraints:
                    nullable: true

              - column:
                  name: geoloc
                  type: geometry(Point,4326)
                  remarks: "Geolocalizzazione dell'indirizzo."
                  constraints:
                    nullable: true

              # ---- gestione tecnica ----
              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se TRUE abilita snapshot storico su UPDATE/DELETE."
                  constraints:
                    nullable: false

              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction ID per audit/log."
                  constraints:
                    nullable: true

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente ultima modifica (audit)."
                  constraints:
                    nullable: false

        # -------------------- FK --------------------

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: indirizzi_soggetti
            baseColumnNames: soggetto_id
            constraintName: fk_indirizzi_soggetti_soggetti
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: indirizzi_soggetti
            baseColumnNames: tipo_indirizzo_id
            constraintName: fk_indirizzi_soggetti_tipi_indirizzi
            referencedTableSchemaName: config
            referencedTableName: tipi_indirizzi
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: indirizzi_soggetti
            baseColumnNames: indirizzo_dettaglio_id
            constraintName: fk_indirizzi_soggetti_indirizzi_dettaglio
            referencedTableSchemaName: anagrafiche
            referencedTableName: indirizzi_dettaglio
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: indirizzi_soggetti
            baseColumnNames: comune_id
            constraintName: fk_indirizzi_soggetti_comuni
            referencedTableSchemaName: config
            referencedTableName: comuni
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: indirizzi_soggetti
            baseColumnNames: codice_postale_id
            constraintName: fk_indirizzi_soggetti_codici_postali
            referencedTableSchemaName: config
            referencedTableName: codici_postali
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: indirizzi_soggetti
            baseColumnNames: stato_id
            constraintName: fk_indirizzi_soggetti_stati
            referencedTableSchemaName: config
            referencedTableName: stati
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        # -------------------- UNIQUE --------------------

        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: indirizzi_soggetti
            columnNames: soggetto_id, tipo_indirizzo_id
            constraintName: uq_indirizzi_soggetti_soggetto_tipo

        # -------------------- CHECK (XOR normalizzato/libero) --------------------

        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE anagrafiche.indirizzi_soggetti
              ADD CONSTRAINT chk_indirizzi_soggetti_xor_norm_libero
              CHECK (
                (indirizzo_dettaglio_id IS NOT NULL AND indirizzo_libero IS NULL)
                OR
                (indirizzo_dettaglio_id IS NULL AND indirizzo_libero IS NOT NULL)
              );

        # -------------------- INDEX --------------------

        - createIndex:
            schemaName: anagrafiche
            tableName: indirizzi_soggetti
            indexName: ix_indirizzi_soggetti_soggetto_id
            columns:
              - column:
                  name: soggetto_id

        - createIndex:
            schemaName: anagrafiche
            tableName: indirizzi_soggetti
            indexName: ix_indirizzi_soggetti_tipo_indirizzo_id
            columns:
              - column:
                  name: tipo_indirizzo_id
