databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260211-12-create-emittenti-fiscali-utilities-mctit.yaml

  - changeSet:
      id: 20260211-12-create-emittenti-fiscali-utilities
      author: mctit
      comment: "Parametri emittente fiscale per utility (minimo e arrotondamenti)"
      changes:
        - createTable:
            schemaName: anagrafiche
            tableName: emittenti_fiscali_utilities
            remarks: "Parametri emittente fiscale per utility"
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_emittenti_fiscali_utilities
                    nullable: false
              - column:
                  name: emittente_soggetto_ruolo_id
                  type: bigint
                  remarks: "Emittente fiscale (soggetto_ruolo)"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_emittenti_fiscali_utilities_emittente
                    referencedTableSchemaName: anagrafiche
                    referencedTableName: emittenti_fiscali
                    referencedColumnNames: soggetto_ruolo_id
              - column:
                  name: utility_id
                  type: bigint
                  remarks: "Utility di riferimento"
                  constraints:
                    nullable: false
                    foreignKeyName: fk_emittenti_fiscali_utilities_utility
                    referencedTableSchemaName: config
                    referencedTableName: utilities
                    referencedColumnNames: id
              - column:
                  name: minimo_soglia_min
                  type: numeric(20,8)
                  remarks: "Soglia minima per fattura minimo (>=)"
                  constraints:
                    nullable: true
              - column:
                  name: minimo_soglia_max
                  type: numeric(20,8)
                  remarks: "Soglia massima per fattura minimo (<=)"
                  constraints:
                    nullable: true
              - column:
                  name: arrotondamento_importi_dec
                  type: smallint
                  remarks: "Decimali arrotondamento importi (max 2)"
                  constraints:
                    nullable: false
              - column:
                  name: metodo_arrotondamento_importi
                  type: character varying
                  remarks: "Metodo arrotondamento importi (UP/DOWN/HALF_UP/HALF_DOWN)"
                  constraints:
                    nullable: false
              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Record attivo"
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati"
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: anagrafiche
            tableName: emittenti_fiscali_utilities
            columnNames: emittente_soggetto_ruolo_id, utility_id
            constraintName: uq_emittenti_fiscali_utilities_emittente_utility

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE anagrafiche.emittenti_fiscali_utilities
              ADD CONSTRAINT chk_emittenti_fiscali_utilities_soglie
              CHECK (minimo_soglia_min IS NULL OR minimo_soglia_max IS NULL OR minimo_soglia_min <= minimo_soglia_max);

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE anagrafiche.emittenti_fiscali_utilities
              ADD CONSTRAINT chk_emittenti_fiscali_utilities_arrotondamento_dec
              CHECK  (arrotondamento_importi_dec BETWEEN 0 AND 2);

        - sql:
            splitStatements: false
            sql: |
              -- Check validità e valori ammessi
              ALTER TABLE anagrafiche.emittenti_fiscali_utilities
              ADD CONSTRAINT chk_emittenti_fiscali_utilities_metodo_arrotondamento
              CHECK  (metodo_arrotondamento_importi IN ('UP','DOWN','HALF_UP','HALF_DOWN'));
