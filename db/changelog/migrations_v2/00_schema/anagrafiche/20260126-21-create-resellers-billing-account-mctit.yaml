databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/anagrafiche/20260126-21-create-resellers-billing-account-mctit.yaml

  - changeSet:
      id: 20260126-21-create-resellers-billing-account
      author: mctit
      comment: "Mapping billing_account -> reseller (ruolo) con periodo di validita'"
      changes:
        - createTable:
            schemaName: anagrafiche
            tableName: resellers_billing_account
            remarks: "Associazione billing_account -> reseller (ruolo), con validita' temporale."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_resellers_billing_account
                    nullable: false

              - column:
                  name: billing_account_id
                  type: bigint
                  remarks: "FK → anagrafiche.billing_account.id."
                  constraints:
                    nullable: false

              - column:
                  name: reseller_soggetto_ruolo_id
                  type: bigint
                  remarks: "FK → anagrafiche.soggetti_ruoli.id (ruolo reseller)."
                  constraints:
                    nullable: false

              - column:
                  name: valido_dal
                  type: date
                  defaultValueComputed: "CURRENT_DATE"
                  remarks: "Data inizio validita' (inclusa)."
                  constraints:
                    nullable: false

              - column:
                  name: valido_al
                  type: date
                  remarks: "Data fine validita' (inclusa)."
                  constraints:
                    nullable: true

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni in formato JSONB."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente che ha effettuato l'inserimento (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Timestamp ultima modifica (audit)."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Utente che ha effettuato l'ultima modifica (audit)."
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: resellers_billing_account
            baseColumnNames: billing_account_id
            constraintName: fk_resellers_billing_account_ba
            referencedTableSchemaName: anagrafiche
            referencedTableName: billing_account
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: resellers_billing_account
            baseColumnNames: reseller_soggetto_ruolo_id
            constraintName: fk_resellers_billing_account_reseller
            referencedTableSchemaName: anagrafiche
            referencedTableName: soggetti_ruoli
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE anagrafiche.resellers_billing_account
                ADD CONSTRAINT chk_resellers_ba_validita
                CHECK (valido_al IS NULL OR valido_al >= valido_dal);
