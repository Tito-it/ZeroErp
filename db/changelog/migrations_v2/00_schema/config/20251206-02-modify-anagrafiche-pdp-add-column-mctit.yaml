databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20251206-02-modify-anagrafiche-pdp-add-column-mctit.yaml

  - changeSet:
      id: 20251206-02-modify-anagrafiche-pdp-add-column
      author: mctit
      preConditions:
        - onError: CONTINUE
        - onFail: CONTINUE
        - not:
            - columnExists:
                schemaName: anagrafiche
                tableName: pdp
                columnName: stato_pdp_id

      changes:
        - addColumn:
            schemaName: anagrafiche
            tableName: pdp
            columns:
              - column:
                  name: stato_pdp_id
                  type: bigint
                  remarks: "FK tecnico a config.stati_pdp (stato del punto di prelievo)."

  - changeSet:
      id: 20251206-02-01-modify-anagrafiche-pdp-add-column
      author: mctit
      changes:
        - addNotNullConstraint:
            schemaName: anagrafiche
            tableName: pdp
            columnName: stato_pdp_id
            columnDataType: bigint

        - addForeignKeyConstraint:
            baseTableSchemaName: anagrafiche
            baseTableName: pdp
            baseColumnNames: stato_pdp_id
            constraintName: fk_pdp_stati_pdp
            referencedTableSchemaName: config
            referencedTableName: stati_pdp
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
