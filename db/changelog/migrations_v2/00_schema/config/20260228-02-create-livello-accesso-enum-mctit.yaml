# Liquibase changelog per Zero ERP
# ENUM config.livello_accesso — livelli di accesso per area funzionale
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260228-02-create-livello-accesso-enum-mctit.yaml

  - changeSet:
      id: 20260228-02-create-livello-accesso-enum
      author: mctit

      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*)
              FROM pg_type t
              JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname = 'config'
                AND t.typname = 'livello_accesso';

      changes:
        - sql:
            sql: |
              CREATE TYPE config.livello_accesso AS ENUM ('TUTTO', 'LETTURA', 'BLOCCATO');

        - sql:
            sql: |
              COMMENT ON TYPE config.livello_accesso IS
              'Livello di accesso per area funzionale:
               - TUTTO: CRUD completo su tutti gli oggetti dell''area
               - LETTURA: solo visualizzazione (view_*)
               - BLOCCATO: nessun accesso, area non visibile';

      rollback:
        - sql:
            sql: |
              DROP TYPE IF EXISTS config.livello_accesso;
