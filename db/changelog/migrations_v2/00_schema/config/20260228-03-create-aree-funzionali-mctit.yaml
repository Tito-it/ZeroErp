# Liquibase changelog per Zero ERP
# Tabella config.aree_funzionali — catalogo aree funzionali (1 area = 1 schema DB)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260228-03-create-aree-funzionali-mctit.yaml

  - changeSet:
      id: 20260228-03-create-aree-funzionali
      author: mctit
      comment: >
        Catalogo delle aree funzionali del sistema permessi.
        Ogni area corrisponde a uno schema DB; il mapping e' automatico
        (Django risolve l'area dal db_table del model).
        schema_db e' separato da codice per consentire rinomina della label
        senza impatto sullo schema fisico.

      changes:
        - createTable:
            schemaName: config
            tableName: aree_funzionali
            remarks: "Catalogo aree funzionali. Ogni area corrisponde a uno schema DB."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_aree_funzionali
                    nullable: false

              - column:
                  name: codice
                  type: VARCHAR(50)
                  remarks: "Codice univoco dell'area (es. vendite, acquisti)."
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: VARCHAR(50)
                  remarks: "Codice interno immutabile."
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: VARCHAR(200)
                  remarks: "Descrizione leggibile per l'interfaccia."
                  constraints:
                    nullable: false

              - column:
                  name: schema_db
                  type: VARCHAR(50)
                  remarks: "Nome dello schema PostgreSQL associato (es. vendite, contabilita)."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Flag attivazione logica."
                  constraints:
                    nullable: false

              - column:
                  name: ordinamento
                  type: SMALLINT
                  defaultValueNumeric: 0
                  remarks: "Ordine di visualizzazione nella UI gestione profili."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estendibili (icone, alias, traduzioni)."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp ultima modifica."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente ultima modifica."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: aree_funzionali
            columnNames: codice
            constraintName: uq_aree_funzionali_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: aree_funzionali
            columnNames: codice_interno
            constraintName: uq_aree_funzionali_codice_interno

        - addUniqueConstraint:
            schemaName: config
            tableName: aree_funzionali
            columnNames: schema_db
            constraintName: uq_aree_funzionali_schema_db

        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              COMMENT ON TABLE config.aree_funzionali IS
              'Catalogo aree funzionali del sistema permessi.
               Ogni area corrisponde a uno schema DB; il mapping area->schema
               e'' automatico (Django risolve l''area dal db_table del model).
               schema_db separato da codice per consentire rinomina label
               senza impatto sullo schema fisico.';

      rollback:
        - dropTable:
            schemaName: config
            tableName: aree_funzionali
