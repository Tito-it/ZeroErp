# config.periodicita: OGNI QUANTO SI ADDEBITA UN CANONE, COME DATO
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §6.2, §6.5 (Lotto 1),
#   decisione G-0-bis di Tid (2026-10-28)
#
# ── IL DIFETTO ───────────────────────────────────────────────────
#   vendite.contratti_righe.periodicita e la gemella dell'offerta sono varchar
#   libere: i valori ammessi stavano solo nel COMMENT ("MENSILE|BIMESTRALE|
#   TRIMESTRALE|ANNUALE (opz.)"), senza CHECK ne' FK. Il generatore dei periodi
#   (Lotto 6) ha bisogno di sapere QUANTI MESI e' un periodo: un testo non lo dice.
#
# ── COSA FA ──────────────────────────────────────────────────────
#   Una riga per periodicita', con `mesi`: la durata del periodo. `mesi` divide
#   12: con i periodi allineati al calendario (domanda F-2 del brief) un periodo
#   non scavalca l'anno. Le righe di contratto, offerta e listino si legano qui
#   con una FK sul codice, in 80_data dopo il seed (20261029-13).
#
# ── LA FORMA ─────────────────────────────────────────────────────
#   · Come config.erogazioni_fonti (20261007-50): niente `attivo` (e' cio' che
#     il modello ammette, non una configurazione), niente `storicizza`, niente
#     RLS (catalogo letto da tutti; la storia sta nel CSV sotto git).
#   · `codice` varchar(32): stesso tipo delle colonne che vi puntano.
#   · Il codice e' anche la chiave naturale delle FK: i codici non si rinominano
#     (ON UPDATE RESTRICT nelle FK).
# ⚠️ Tabella NUOVA: fino a `--contexts=ci_apply` non ha i trigger di audit e
#   tx_id, quindi le colonne di audit nascono coi propri DEFAULT.
# ⚠️ Nessun GRANT: le ALTER DEFAULT PRIVILEGES del loop di 90_end danno a
#   zeroerp_app i diritti sulle tabelle nuove di `config`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261029-10-create-periodicita-mctit.yaml

  - changeSet:
      id: 20261029-10-create-periodicita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea config.periodicita: le periodicita' di un canone, con la durata del periodo in mesi
        (divisore di 12). Prende il posto dei valori scritti nel COMMENT di periodicita. Brief:
        brief-db-contratto-righe-periodiche-in-commessa §6.5 (Lotto 1).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: config
                tableName: periodicita
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.periodicita (
                  id          smallint GENERATED BY DEFAULT AS IDENTITY
                                CONSTRAINT pk_periodicita PRIMARY KEY,
                  -- Stesso tipo delle colonne che vi puntano (contratti_righe,
                  -- offerte_commerciali_eccezioni, listini_righe).
                  codice      varchar(32)  NOT NULL
                                CONSTRAINT uq_periodicita_codice UNIQUE,
                  descrizione varchar(100) NOT NULL,
                  mesi        smallint     NOT NULL,
                  ordine      smallint     NOT NULL,
                  data_insert timestamptz  NOT NULL DEFAULT now(),
                  user_insert text         NOT NULL DEFAULT CURRENT_USER,
                  data_update timestamptz  NOT NULL DEFAULT now(),
                  user_update text         NOT NULL DEFAULT CURRENT_USER,
                  tx_id       uuid,
                  -- Un periodo allineato al calendario non scavalca l'anno.
                  CONSTRAINT chk_periodicita_mesi_divide_anno
                      CHECK (mesi BETWEEN 1 AND 12 AND 12 % mesi = 0)
              );

              COMMENT ON TABLE config.periodicita IS
                  'Ogni quanto si addebita un canone: una riga per periodicità, con la durata del periodo in mesi. La leggono le righe di vendite.contratti_righe, vendite.offerte_commerciali_eccezioni e vendite.listini_righe (FK sul codice, 20261029-13) e il generatore dei periodi del canone. Niente attivo: è ciò che il modello ammette, non una configurazione. Seed: 80_data/sql/config/periodicita.csv. Brief: brief-db-contratto-righe-periodiche-in-commessa §6.5.';

              COMMENT ON COLUMN config.periodicita.codice IS
                  'Il nome della periodicità (MENSILE, TRIMESTRALE, …): chiave naturale delle FK delle righe. Non si rinomina.';

              COMMENT ON COLUMN config.periodicita.mesi IS
                  'La durata del periodo in mesi. Divide 12 (chk_periodicita_mesi_divide_anno): con i periodi allineati al calendario un periodo non scavalca l''anno.';

              COMMENT ON COLUMN config.periodicita.ordine IS
                  'L''ordine in cui il form propone le periodicità.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS config.periodicita;
