# ------------------------------------------------------------
# COME SI EROGA UN ARTICOLO: LO DICHIARANO LA TIPOLOGIA E LA NATURA
#   config.listini_tipologie_erogazioni, config.nature_vendita_erogazioni
#   Brief: brief-db-offerta-emissione-ed-erogazione §B.2 (B-R1), §C.5, §C.7 (giro B2)
#
# ── LA DECISIONE ─────────────────────────────────────────────────
#   Tid, 2026-10-07: il default dell'erogazione (e della fonte) si EREDITA
#   dall'articolo, dalla sua tipologia (B-R2); senza tipologia, dalla natura di
#   vendita (B-D1). Il perimetro delle scelte e' la tipologia dell'articolo,
#   non l'unione delle tipologie della utility (B-D4): una QUOTA_FISSA si eroga
#   a periodo, e la sua fonte non sono le letture.
#
# ── COSA FA ──────────────────────────────────────────────────────
#   Due tabelle gemelle, una per sorgente: per ogni tipologia di listino e per
#   ogni natura di vendita, le combinazioni (erogazione, fonte) ammesse e quella
#   di default (al piu' una). Sulla riga di default di un CANONE anche la
#   generazione_canone da proporre: il CHECK chk_*_coerenza_canone delle righe
#   la pretende, e una riga che ereditasse CANONE senza verrebbe rifiutata.
#   Nessun lettore in questo giro: la regola che le legge e' il giro B3.
#
# ── LA FORMA ─────────────────────────────────────────────────────
#   · Due tabelle e non una con un discriminatore: ognuna ha la sua FK vera
#     verso la sorgente (listini_tipologie.id, nature_vendita.id: id scritti nei
#     rispettivi CSV, stabili fra le macchine; e' la forma di
#     config.listini_tipologie_utilities).
#   · FK composta (tipo_erogazione, fonte_quantita_attesa) verso
#     config.erogazioni_fonti (20261007-50): una tipologia non puo' ammettere
#     una combinazione incoerente.
#   · CHECK: generazione_canone valorizzata se e solo se l'erogazione e' CANONE.
#     I valori ammessi li giudica il CHECK delle righe, quando il default ci
#     arriva: qui non si ricopiano.
#   · Niente attivo, niente storicizza, niente RLS (come -50). ⚠️ La FK verso
#     tipologie e nature, che hanno `attivo`, a ci_apply genera il guard
#     «non si spegne con figlie»: voluto, una tipologia che dichiara come si
#     eroga non si spegne in silenzio.
#   · Completezza («ogni tipologia e ogni natura ha il suo default»): pgTAP
#     vendite/test-erogazioni-vocabolario-v1.
# ⚠️ Nessun GRANT: le ALTER DEFAULT PRIVILEGES del loop di 90_end danno a
#   zeroerp_app i diritti sulle tabelle nuove di `config` (forma di 20261001-41).
#   Serve: script.trgfn_righe_default_fonte_qta la legge come INVOKER, cioe' come
#   l'applicazione (provato su zeroerp_ci il 2026-10-07: SELECT concesso).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261007-51-create-erogazioni-ammesse-tipologie-nature-mctit.yaml

  - changeSet:
      id: 20261007-51-create-erogazioni-ammesse-tipologie-nature
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea config.listini_tipologie_erogazioni e config.nature_vendita_erogazioni: le
        combinazioni di erogazione e fonte che una tipologia di listino e una natura di vendita
        ammettono, con quella di default. Brief: brief-db-offerta-emissione-ed-erogazione §C.7 (B2).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: erogazioni_fonti
        - not:
            - tableExists:
                schemaName: config
                tableName: listini_tipologie_erogazioni
        - not:
            - tableExists:
                schemaName: config
                tableName: nature_vendita_erogazioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.listini_tipologie_erogazioni (
                  id                    smallint GENERATED BY DEFAULT AS IDENTITY
                                          CONSTRAINT pk_listini_tipologie_erogazioni PRIMARY KEY,
                  tipologia_id          smallint    NOT NULL,
                  tipo_erogazione       varchar(16) NOT NULL,
                  fonte_quantita_attesa varchar(32) NOT NULL,
                  e_default             boolean     NOT NULL DEFAULT false,
                  generazione_canone    varchar(32),
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text        NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id                 uuid,
                  -- Copre per prefisso la FK su tipologia_id.
                  CONSTRAINT uq_listini_tipologie_erogazioni
                      UNIQUE (tipologia_id, tipo_erogazione, fonte_quantita_attesa),
                  CONSTRAINT fk_listini_tipologie_erogazioni_tipologia
                      FOREIGN KEY (tipologia_id) REFERENCES config.listini_tipologie (id),
                  CONSTRAINT fk_listini_tipologie_erogazioni_erogazione_fonte
                      FOREIGN KEY (tipo_erogazione, fonte_quantita_attesa)
                      REFERENCES config.erogazioni_fonti (tipo_erogazione, fonte_quantita_attesa),
                  CONSTRAINT chk_listini_tipologie_erogazioni_canone
                      CHECK ((tipo_erogazione = 'CANONE') = (generazione_canone IS NOT NULL))
              );

              CREATE UNIQUE INDEX uq_listini_tipologie_erogazioni_default
                  ON config.listini_tipologie_erogazioni (tipologia_id)
               WHERE e_default;

              CREATE TABLE config.nature_vendita_erogazioni (
                  id                    smallint GENERATED BY DEFAULT AS IDENTITY
                                          CONSTRAINT pk_nature_vendita_erogazioni PRIMARY KEY,
                  natura_vendita_id     bigint      NOT NULL,
                  tipo_erogazione       varchar(16) NOT NULL,
                  fonte_quantita_attesa varchar(32) NOT NULL,
                  e_default             boolean     NOT NULL DEFAULT false,
                  generazione_canone    varchar(32),
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text        NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id                 uuid,
                  CONSTRAINT uq_nature_vendita_erogazioni
                      UNIQUE (natura_vendita_id, tipo_erogazione, fonte_quantita_attesa),
                  CONSTRAINT fk_nature_vendita_erogazioni_natura
                      FOREIGN KEY (natura_vendita_id) REFERENCES config.nature_vendita (id),
                  CONSTRAINT fk_nature_vendita_erogazioni_erogazione_fonte
                      FOREIGN KEY (tipo_erogazione, fonte_quantita_attesa)
                      REFERENCES config.erogazioni_fonti (tipo_erogazione, fonte_quantita_attesa),
                  CONSTRAINT chk_nature_vendita_erogazioni_canone
                      CHECK ((tipo_erogazione = 'CANONE') = (generazione_canone IS NOT NULL))
              );

              CREATE UNIQUE INDEX uq_nature_vendita_erogazioni_default
                  ON config.nature_vendita_erogazioni (natura_vendita_id)
               WHERE e_default;

              COMMENT ON TABLE config.listini_tipologie_erogazioni IS
                  'Come si eroga un articolo di questa tipologia di listino: le combinazioni (tipo_erogazione, fonte_quantita_attesa) ammesse e quella di default (e_default, al più una per tipologia), con la generazione_canone da proporre sulle righe CANONE. Sorgente del default e del perimetro delle righe di contratto e offerta per un articolo che ha una tipologia (decisioni B-R1, B-D4 di Tid del 2026-10-07: il perimetro è la tipologia dell''articolo, non la utility). Combinazioni coerenti per FK su config.erogazioni_fonti. Seed: 80_data/sql/config/listini_tipologie_erogazioni.csv. Brief: brief-db-offerta-emissione-ed-erogazione §C.5, §C.7 (B2).';

              COMMENT ON TABLE config.nature_vendita_erogazioni IS
                  'Come si eroga un articolo di questa natura di vendita, quando l''articolo non ha una tipologia di listino (decisione B-D1 di Tid del 2026-10-07: vince la tipologia, la natura è il ripiego). Stessa forma di config.listini_tipologie_erogazioni: combinazioni ammesse, default (al più uno per natura), generazione_canone sulle righe CANONE. Nessuna natura ammette LETTURE: le letture vengono da una tipologia a contatore. Seed: 80_data/sql/config/nature_vendita_erogazioni.csv. Brief: brief-db-offerta-emissione-ed-erogazione §C.5, §C.7 (B2).';

              COMMENT ON COLUMN config.listini_tipologie_erogazioni.generazione_canone IS
                  'Su una riga CANONE, la generazione_canone che la riga eredita insieme all''erogazione: il CHECK chk_*_coerenza_canone delle righe la pretende. NULL sulle altre erogazioni (chk_listini_tipologie_erogazioni_canone). I valori ammessi li giudica il CHECK della riga.';

              COMMENT ON COLUMN config.nature_vendita_erogazioni.generazione_canone IS
                  'Come config.listini_tipologie_erogazioni.generazione_canone.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP TABLE IF EXISTS config.nature_vendita_erogazioni;
              DROP TABLE IF EXISTS config.listini_tipologie_erogazioni;
