# Liquibase changelog per Zero ERP
# Crea config.email_log — log invio email con retry, corpo
# inviato, ambito visibilita' e collegamento a pratiche.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-15-create-email-log-mctit.yaml

    - changeSet:
          id: 20260328-15-create-email-log
          author: mctit
          comment: >
              Log di tutti gli invii email. Stato PENDING->SENT/FAILED->RETRY.
              Conserva il corpo esattamente come inviato (dopo eventuali modifiche
              dall'outbox). Ambito (SISTEMA/REPARTO/OPERATORE) per visibilita'.
              Collegamento opzionale a pratica per storico comunicativo.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE config.email_log (
                            id                      bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            email_account_id        integer,
                            email_template_id       integer,
                            destinatario            character varying(255) NOT NULL,
                            destinatari_cc          text[],
                            oggetto                 text NOT NULL,
                            corpo_inviato_html      text,
                            corpo_inviato_testo     text,
                            stato                   character varying(20) NOT NULL DEFAULT 'PENDING',
                            errore                  text,
                            tentativi               integer NOT NULL DEFAULT 0,
                            max_tentativi           integer NOT NULL DEFAULT 3,
                            prossimo_tentativo      timestamptz,
                            inviato_at              timestamptz,
                            contesto_json           jsonb NOT NULL DEFAULT '{}'::jsonb,
                            ambito                  character varying(20) NOT NULL DEFAULT 'SISTEMA',
                            unita_organizzativa_id  integer,
                            pratica_id              bigint,
                            auth_user_id            integer,
                            email_outbox_id         bigint,
                            tx_id                   uuid,
                            data_insert             timestamptz NOT NULL DEFAULT now(),
                            user_insert             text NOT NULL DEFAULT CURRENT_USER,

                            -- Vincoli CHECK
                            CONSTRAINT chk_email_log_stato CHECK (stato IN ('PENDING', 'SENT', 'FAILED', 'RETRY')),
                            CONSTRAINT chk_email_log_ambito CHECK (ambito IN ('SISTEMA', 'REPARTO', 'OPERATORE'))
                        );

                        -- FK — RESTRICT: non si cancellano parent se ci sono email che li referenziano
                        -- La FK email_outbox_id e' aggiunta nel changeset -16 (dopo che outbox esiste)
                        ALTER TABLE config.email_log
                          ADD CONSTRAINT fk_email_log_email_account
                          FOREIGN KEY (email_account_id) REFERENCES config.email_account(id)
                          ON DELETE NO ACTION;

                        ALTER TABLE config.email_log
                          ADD CONSTRAINT fk_email_log_email_template
                          FOREIGN KEY (email_template_id) REFERENCES config.email_template(id)
                          ON DELETE NO ACTION;

                        ALTER TABLE config.email_log
                          ADD CONSTRAINT fk_email_log_unita_organizzativa
                          FOREIGN KEY (unita_organizzativa_id) REFERENCES config.unita_organizzative(id)
                          ON DELETE NO ACTION;

                        ALTER TABLE config.email_log
                          ADD CONSTRAINT fk_email_log_pratica
                          FOREIGN KEY (pratica_id) REFERENCES pratiche.pratiche(id)
                          ON DELETE NO ACTION;

                        -- Indici per query frequenti
                        CREATE INDEX ix_email_log_stato_prossimo ON config.email_log(stato, prossimo_tentativo);
                        CREATE INDEX ix_email_log_auth_user_id ON config.email_log(auth_user_id);
                        CREATE INDEX ix_email_log_pratica_id ON config.email_log(pratica_id);
                        CREATE INDEX ix_email_log_ambito_uo ON config.email_log(ambito, unita_organizzativa_id);

                        COMMENT ON TABLE config.email_log IS
                          'Log invio email con retry, corpo inviato e ambito visibilita''.';
                        COMMENT ON COLUMN config.email_log.corpo_inviato_html IS
                          'Corpo HTML esattamente come inviato (dopo eventuali modifiche manuali).';
                        COMMENT ON COLUMN config.email_log.corpo_inviato_testo IS
                          'Corpo plaintext esattamente come inviato.';
                        COMMENT ON COLUMN config.email_log.ambito IS
                          'Ambito visibilita'': SISTEMA (solo admin), REPARTO (operatori UO), OPERATORE (solo creatore).';
                        COMMENT ON COLUMN config.email_log.pratica_id IS
                          'Pratica collegata. Consultabile dalla scheda pratica.';
                        COMMENT ON COLUMN config.email_log.contesto_json IS
                          'Variabili usate per il rendering del template.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS config.email_log;
