# L'AZIONE DEL PREVENTIVO STA SULLA RIGA DEL PASSAGGIO (M-3)
#   Brief: brief-modello-documento-vendita §8 (giro 6; U-1, U-2 di Tid,
#   2026-10-25). Stessa colonna di bolla e reso (20261025-08).
#
# ── LA REGOLA ───────────────────────────────────────────────────────
#   Una sola azione per documento, sui passaggi pesanti (M-4): l'emissione
#   (DRAFT -> EMESSO) e l'annullo di un preventivo emesso (EMESSO ->
#   ANNULLATO, ACCETTATO -> ANNULLATO: U-2). L'azione e' NUOVA,
#   emetti_preventivo (U-1 a): cambia_stato_preventivi, che il backend
#   chiedeva su ogni passaggio, diventa obsoleta nel catalogo. Gli altri
#   passaggi (accetta, rifiuta, annullo della bozza) chiedono solo il
#   permesso sul documento.
#
# ── LA COLONNA ──────────────────────────────────────────────────────
#   azione_processo_codename, FK verso config.azioni_processo.permission_codename.
#   NULL = nessuna azione. I valori stanno nel CSV della matrice (80_data,
#   mirror 20260403-04 e 20260806-13), non qui (§11.2).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261025-38-alter-transizioni-preventivi-azione-processo-mctit.yaml

  - changeSet:
      id: 20261025-38-alter-transizioni-preventivi-azione-processo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Colonna azione_processo_codename (FK a config.azioni_processo.permission_codename,
        NULL = nessuna azione) su config.transizioni_stati_preventivi: l'azione di processo che
        il passaggio chiede (M-3). Brief: brief-modello-documento-vendita §8.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists: { schemaName: config, tableName: transizioni_stati_preventivi }
            - tableExists: { schemaName: config, tableName: azioni_processo }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.transizioni_stati_preventivi
                  ADD COLUMN azione_processo_codename varchar(100),
                  ADD CONSTRAINT fk_transizioni_stati_preventivi_azioni_processo
                      FOREIGN KEY (azione_processo_codename)
                      REFERENCES config.azioni_processo (permission_codename);

              COMMENT ON COLUMN config.transizioni_stati_preventivi.azione_processo_codename IS
                  'L''azione di processo che questo passaggio chiede (config.azioni_processo.permission_codename); NULL = basta il permesso sul documento, che controlla il backend. La leggono il verbo (script.fn_guard_passaggio, E_PERMESSO_NEGATO), il backend (403 prima della transazione) e la capability (il bottone si nasconde a chi non ha l''azione), tutti da script.fn_doc_passaggio. Una sola azione per documento, sui passaggi pesanti: emissione e annullo dell''emesso e dell''accettato (M-4, U-2). Il valore sta nel CSV della matrice. Brief: brief-modello-documento-vendita §8 (M-3, U-1, Tid 2026-10-24/25).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.transizioni_stati_preventivi DROP COLUMN IF EXISTS azione_processo_codename;
