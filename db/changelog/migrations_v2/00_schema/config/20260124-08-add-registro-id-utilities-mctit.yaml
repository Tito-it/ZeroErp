databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260124-08-add-registro-id-utilities-mctit.yaml

  - changeSet:
      id: 20260124-08-add-registro-id-utilities
      author: mctit
      comment: "Aggiunge registro_id di default su config.utilities"
      changes:
        - addColumn:
            schemaName: config
            tableName: utilities
            columns:
              - column:
                  name: registro_id
                  type: bigint
                  remarks: "Registro di fatturazione default (fallback)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: utilities
            baseColumnNames: registro_id
            constraintName: fk_utilities_registro
            referencedTableSchemaName: vendite
            referencedTableName: registri_fatturazione
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
