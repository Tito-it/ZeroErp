# Liquibase changelog per Zero ERP
# Crea config.email_allegato — allegati email su filesystem.
# Associati a bozze outbox (pre-invio) o log (post-invio).
# Origine: UPLOAD (caricato dall'operatore) o TEMPLATE
# (default del template).
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-17-create-email-allegato-mctit.yaml

    - changeSet:
          id: 20260328-17-create-email-allegato
          author: mctit
          comment: >
              Allegati email. File su filesystem (path relativo in file_path),
              associati a email_outbox (bozza) o email_log (storico invio).
              Origine UPLOAD (operatore) o TEMPLATE (default del template).
              ON DELETE CASCADE su outbox per pulizia automatica.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE config.email_allegato (
                            id                  bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            email_outbox_id     bigint
                                REFERENCES config.email_outbox(id)
                                ON DELETE CASCADE,
                            email_log_id        bigint
                                REFERENCES config.email_log(id)
                                ON DELETE NO ACTION,
                            nome_file           character varying(255) NOT NULL,
                            mime_type           character varying(100) NOT NULL,
                            dimensione_bytes    bigint NOT NULL,
                            file_path           character varying(512) NOT NULL,
                            origine             character varying(20) NOT NULL DEFAULT 'UPLOAD',
                            meta                jsonb NOT NULL DEFAULT '{}'::jsonb,
                            data_insert         timestamptz NOT NULL DEFAULT now(),
                            user_insert         text NOT NULL DEFAULT CURRENT_USER,

                            -- Vincoli CHECK
                            CONSTRAINT chk_email_allegato_origine CHECK (origine IN ('UPLOAD', 'TEMPLATE')),
                            CONSTRAINT chk_email_allegato_dimensione CHECK (dimensione_bytes > 0)
                        );

                        -- Indici per lookup
                        CREATE INDEX ix_email_allegato_outbox_id ON config.email_allegato(email_outbox_id);
                        CREATE INDEX ix_email_allegato_log_id ON config.email_allegato(email_log_id);

                        COMMENT ON TABLE config.email_allegato IS
                          'Allegati email su filesystem. Associati a outbox (bozza) o log (storico invio). ON DELETE CASCADE su outbox.';
                        COMMENT ON COLUMN config.email_allegato.nome_file IS
                          'Nome originale del file (es. guida-utente.pdf).';
                        COMMENT ON COLUMN config.email_allegato.file_path IS
                          'Percorso relativo nello storage (es. email_attachments/2026/03/uuid.pdf).';
                        COMMENT ON COLUMN config.email_allegato.origine IS
                          'UPLOAD = caricato dall''operatore, TEMPLATE = default del template.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS config.email_allegato;
