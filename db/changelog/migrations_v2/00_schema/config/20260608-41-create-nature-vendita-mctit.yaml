databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260608-41-create-nature-vendita-mctit.yaml

  - changeSet:
      id: 20260608-41-create-nature-vendita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE config.nature_vendita — tassonomia della natura commerciale
        di riga ai fini del routing post-accettazione del preventivo (anello3
        §5.3.2). destinazione_tipo guida lo split data-driven: MERCE -> ORDINE,
        SERVIZIO_UNA_TANTUM -> COMMESSA, SERVIZIO_RICORRENTE -> CONTRATTO.
        Vocabolario dedicato (NO riuso di listino_tipologia, che serve al
        listino). I trigger audit/lock_columns/storico sono provisionati dal
        framework di automazione (codice_interno -> lock automatico).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists: { schemaName: config, tableName: nature_vendita }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.nature_vendita (
                  id                BIGINT GENERATED BY DEFAULT AS IDENTITY
                                    CONSTRAINT pk_nature_vendita PRIMARY KEY,
                  codice_interno    VARCHAR(40)  NOT NULL,
                  codice            VARCHAR(40)  NOT NULL,
                  descrizione       VARCHAR(255),
                  destinazione_tipo VARCHAR(20)  NOT NULL,
                  attivo            BOOLEAN      NOT NULL DEFAULT true,
                  ordine            SMALLINT,
                  meta              JSONB        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert       TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert       TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update       TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update       TEXT         DEFAULT CURRENT_USER,
                  CONSTRAINT uq_nature_vendita_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_nature_vendita_codice_interno
                      UNIQUE (codice_interno),
                  CONSTRAINT chk_nature_vendita_destinazione_tipo
                      CHECK (destinazione_tipo IN ('ORDINE', 'COMMESSA', 'CONTRATTO'))
              );

              COMMENT ON TABLE config.nature_vendita IS
                  'Natura commerciale di riga ai fini del routing post-accettazione '
                  'del preventivo (anello3 §5.3.2). Proprieta'' intrinseca '
                  'dell''articolo (catalogo.articoli.natura_vendita_id), ereditata e '
                  'congelata sulla riga di preventivo. destinazione_tipo guida lo '
                  'split: ogni riga finisce nella destinazione operativa della sua '
                  'natura.';
              COMMENT ON COLUMN config.nature_vendita.codice_interno IS
                  'Chiave naturale stabile (immutabile via lock_columns). '
                  'Es. MERCE, SERVIZIO_UNA_TANTUM, SERVIZIO_RICORRENTE.';
              COMMENT ON COLUMN config.nature_vendita.destinazione_tipo IS
                  'Destinazione operativa dello split: ORDINE (merce) | COMMESSA '
                  '(servizio una tantum) | CONTRATTO (ricorrenza). Letto in modo '
                  'data-driven da fn_push_* e dalla capability genera_ordine '
                  '(residuo righe con destinazione ORDINE).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.nature_vendita;
