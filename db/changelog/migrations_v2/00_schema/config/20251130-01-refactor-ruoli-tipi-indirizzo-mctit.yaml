# Liquibase changelog per Zero ERP
# Refactor tabella config.ruoli_tipi_indirizzo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20251130-01-refactor-ruoli-tipi-indirizzo-mctit.yaml

  - changeSet:
      id: 20251130-01-refactor-ruoli-tipi-indirizzo
      author: mctit
      comment: >
        Refactor tabella config.ruoli_tipi_indirizzo:
        - rinominata da ruoli_tipi_indirizzo a tipi_ruoli_tipi_indirizzo
        - aggiornati nomi constraint/indici per coerenza con nuovo nome tabella
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- 1) Drop vecchia FK sul ruolo
              ALTER TABLE config.ruoli_tipi_indirizzo
              DROP CONSTRAINT IF EXISTS fk_ruoli_tipi_indirizzo_ruolo;

              -- 2) Rinomina tabella
              ALTER TABLE config.ruoli_tipi_indirizzo
              RENAME TO tipi_ruolo_tipi_indirizzo;

              -- 3) Rinomina colonna ruolo_id -> tipo_ruolo_id
              ALTER TABLE config.tipi_ruolo_tipi_indirizzo
              RENAME COLUMN ruolo_id TO tipo_ruolo_id;

              -- 4) Crea nuova FK con nome coerente
              ALTER TABLE config.tipi_ruolo_tipi_indirizzo
              ADD CONSTRAINT fk_tipi_ruolo_tipi_indirizzo_tipo_ruolo
              FOREIGN KEY (tipo_ruolo_id)
              REFERENCES config.tipi_ruoli(id)
              ON UPDATE RESTRICT
              ON DELETE RESTRICT;


                  -- Rinomina UNIQUE constraint (ruolo+tipo → tipo_ruolo+tipo)
              ALTER TABLE config.tipi_ruolo_tipi_indirizzo
              RENAME CONSTRAINT uq_ruoli_tipi_indirizzo_ruolo_tipo
              TO uq_tipi_ruolo_tipi_indirizzo_tipo_ruolo_tipo;

              -- Rinomina indici operativi

              ALTER INDEX config.idx_ruoli_tipi_indirizzo_ruolo
              RENAME TO ix_tipi_ruolo_tipi_indirizzo_tipo_ruolo;

              ALTER INDEX config.idx_ruoli_tipi_indirizzo_tipo
              RENAME TO ix_tipi_ruolo_tipi_indirizzo_tipo;

  - changeSet:
      id: 20251130-01-01-tipi_ruolo_tipi_indirizzo-fallback
      author: mctit
      changes:
        - addColumn:
            schemaName: config
            tableName: tipi_ruolo_tipi_indirizzo
            columns:
              - column:
                  name: fallback_tipo_indirizzo_id
                  type: bigint
                  remarks: "Tipo indirizzo di fallback se non esiste indirizzo per questo tipo (FK → config.tipi_indirizzi.id)"

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: tipi_ruolo_tipi_indirizzo
            baseColumnNames: fallback_tipo_indirizzo_id
            constraintName: fk_tipi_ruolo_tipi_indirizzo_fallback_tipo
            referencedTableSchemaName: config
            referencedTableName: tipi_indirizzi
            referencedColumnNames: id
            deferrable: false
            initiallyDeferred: false
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.tipi_ruolo_tipi_indirizzo
              ADD CONSTRAINT chk_tipi_ruolo_tipi_indirizzo_fallback_not_self
              CHECK (
                fallback_tipo_indirizzo_id IS NULL
                OR fallback_tipo_indirizzo_id <> tipo_indirizzo_id
              );

  - changeSet:
      id: 20251130-01-02-tipi_ruolo_tipi_indirizzo-drop-tx_id
      author: mctit
      preConditions:
        - onFail: CONTINUE
        - columnExists:
            schemaName: config
            tableName: tipi_ruolo_tipi_indirizzo
            columnName: tx_id
      changes:
        - dropColumn:
            schemaName: config
            tableName: tipi_ruolo_tipi_indirizzo
            columnName: tx_id
