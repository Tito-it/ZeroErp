# Liquibase changelog per Zero ERP
# Tabella config.profili_reparto_azioni — azioni di processo abilitate per reparto
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260228-12-create-profili-reparto-azioni-mctit.yaml

  - changeSet:
      id: 20260228-12-create-profili-reparto-azioni
      author: mctit
      comment: >
        Azioni di processo abilitate per reparto.
        Ereditarieta' come per le aree: tutti gli operatori
        del reparto ereditano le abilitazioni configurate.

      changes:
        - createTable:
            schemaName: config
            tableName: profili_reparto_azioni
            remarks: "Azioni di processo abilitate per reparto. Ereditarieta' come per le aree."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_profili_reparto_azioni
                    nullable: false

              - column:
                  name: unita_organizzativa_id
                  type: integer
                  remarks: "FK -> config.unita_organizzative.id — reparto."
                  constraints:
                    nullable: false

              - column:
                  name: azione_id
                  type: integer
                  remarks: "FK -> config.azioni_processo.id — azione di processo."
                  constraints:
                    nullable: false

              - column:
                  name: abilitata
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Azione concessa (true) o negata (false) per il reparto."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estendibili."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp ultima modifica."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente ultima modifica."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: profili_reparto_azioni
            columnNames: unita_organizzativa_id, azione_id
            constraintName: uq_profili_reparto_azioni_uo_azione

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: profili_reparto_azioni
            baseColumnNames: unita_organizzativa_id
            constraintName: fk_profili_reparto_azioni_unita_organizzativa
            referencedTableSchemaName: config
            referencedTableName: unita_organizzative
            referencedColumnNames: id
            onUpdate: NO ACTION
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: profili_reparto_azioni
            baseColumnNames: azione_id
            constraintName: fk_profili_reparto_azioni_azione
            referencedTableSchemaName: config
            referencedTableName: azioni_processo
            referencedColumnNames: id
            onUpdate: NO ACTION
            onDelete: NO ACTION

        - createIndex:
            schemaName: config
            tableName: profili_reparto_azioni
            indexName: ix_profili_reparto_azioni_uo_id
            columns:
              - column:
                  name: unita_organizzativa_id

        - createIndex:
            schemaName: config
            tableName: profili_reparto_azioni
            indexName: ix_profili_reparto_azioni_azione_id
            columns:
              - column:
                  name: azione_id

        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              COMMENT ON TABLE config.profili_reparto_azioni IS
              'Azioni di processo abilitate per reparto.
               Ereditarieta'' come per le aree: tutti gli operatori
               del reparto ereditano le abilitazioni configurate.';

      rollback:
        - dropTable:
            schemaName: config
            tableName: profili_reparto_azioni
