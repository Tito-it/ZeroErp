# Liquibase changelog per Zero ERP
# Crea config.email_template — template email parametrizzabili
# con variabili {{...}}.
# Override per unita' organizzativa, tipo prestazione e lingua.
# Catena fallback: reparto+tipo+lingua -> reparto+lingua ->
# sistema+tipo+lingua -> sistema+lingua -> sistema+it.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-14-create-email-template-mctit.yaml

    - changeSet:
          id: 20260328-14-create-email-template
          author: mctit
          comment: >
              Template email con variabili {{...}}. Override per reparto (unita_organizzativa_id),
              tipo prestazione (tipo_prestazione_id) e lingua. UNIQUE su
              (codice, unita_organizzativa_id, tipo_prestazione_id, lingua).
              Template con NULL su unita_organizzativa_id e tipo_prestazione_id = default di sistema.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE config.email_template (
                            id                      integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            codice                  character varying(100) NOT NULL,
                            unita_organizzativa_id  integer
                                REFERENCES config.unita_organizzative(id)
                                ON UPDATE NO ACTION ON DELETE NO ACTION,
                            tipo_prestazione_id     integer
                                REFERENCES pratiche.tipi_prestazione(id)
                                ON UPDATE NO ACTION ON DELETE NO ACTION,
                            lingua                  character varying(5) NOT NULL DEFAULT 'it',
                            oggetto                 text NOT NULL,
                            corpo_html              text NOT NULL,
                            corpo_testo             text,
                            variabili_disponibili   jsonb NOT NULL DEFAULT '[]'::jsonb,
                            attivo                  boolean NOT NULL DEFAULT true,
                            meta                    jsonb NOT NULL DEFAULT '{}'::jsonb,
                            data_insert             timestamptz NOT NULL DEFAULT now(),
                            user_insert             text NOT NULL DEFAULT CURRENT_USER,
                            data_update             timestamptz NOT NULL DEFAULT now(),
                            user_update             text NOT NULL DEFAULT CURRENT_USER
                        );

                        -- UNIQUE con NULLS NOT DISTINCT per gestire correttamente i NULL
                        -- nelle colonne opzionali (PostgreSQL 15+)
                        ALTER TABLE config.email_template
                          ADD CONSTRAINT uq_email_template_codice_uo_tp_lingua
                          UNIQUE NULLS NOT DISTINCT (codice, unita_organizzativa_id, tipo_prestazione_id, lingua);

                        COMMENT ON TABLE config.email_template IS
                          'Template email parametrizzabili con variabili {{...}}. Override per reparto, tipo prestazione e lingua.';
                        COMMENT ON COLUMN config.email_template.codice IS
                          'Codice tipo template (es. INVITO_OPERATORE, RESET_PASSWORD, COMUNICAZIONE_PRATICA).';
                        COMMENT ON COLUMN config.email_template.unita_organizzativa_id IS
                          'FK reparto per override. NULL = template di sistema/default.';
                        COMMENT ON COLUMN config.email_template.tipo_prestazione_id IS
                          'FK tipo prestazione per specializzazione. NULL = generico (non legato a un tipo pratica).';
                        COMMENT ON COLUMN config.email_template.oggetto IS
                          'Oggetto email con variabili {{...}} (es. ''Benvenuto {{nome}}'').';
                        COMMENT ON COLUMN config.email_template.corpo_html IS
                          'Corpo email HTML con variabili {{...}}.';
                        COMMENT ON COLUMN config.email_template.corpo_testo IS
                          'Corpo plaintext (fallback). Se NULL, generato da corpo_html.';
                        COMMENT ON COLUMN config.email_template.variabili_disponibili IS
                          'Array JSON dei nomi variabili accettate (es. [''nome'',''link'']). Documentativo per UI admin.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS config.email_template;
