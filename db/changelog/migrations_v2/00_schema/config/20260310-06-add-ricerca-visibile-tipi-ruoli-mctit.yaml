# Liquibase changelog per Zero ERP
# Aggiunge flag ricerca_visibile a config.tipi_ruoli
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260310-06-add-ricerca-visibile-tipi-ruoli-mctit.yaml

  - changeSet:
      id: 20260310-06-add-ricerca-visibile-tipi-ruoli
      author: mctit
      comment: >
        Aggiunge il flag ricerca_visibile su config.tipi_ruoli per governare
        quali ruoli possono comparire nel selettore della ricerca universale.
        Inizializza esplicitamente i 11 tipi ruolo gia' censiti.

      changes:
        - addColumn:
            schemaName: config
            tableName: tipi_ruoli
            columns:
              - column:
                  name: ricerca_visibile
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "TRUE se il tipo ruolo e' visibile nel selettore della ricerca universale."
                  constraints:
                    nullable: false

      rollback:
        - dropColumn:
            schemaName: config
            tableName: tipi_ruoli
            columnName: ricerca_visibile
