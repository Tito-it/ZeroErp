# Liquibase changelog per Zero ERP
# Refactor tabella config.ruoli_tipi_indirizzo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20251203-21-natura_soggetto_enum-mctit.yaml

  - changeSet:
      id: 20251203-21-natura_soggetto_enum-mctit.yaml
      author: mctit

      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*) 
              FROM pg_type t
              JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname = 'config'
                AND t.typname = 'natura_soggetto_enum';

      changes:
        - sql:
            sql: |
              CREATE TYPE config.natura_soggetto_enum AS ENUM ('PF','PG','ENTE','ALTRO');

        - sql:
            sql: |
              COMMENT ON TYPE config.natura_soggetto_enum IS
              'Natura fiscale/morfologica del soggetto:
               - PF: Persona Fisica
               - PG: Persona Giuridica
               - ENTE: Ente (es. ente non commerciale)
               - ALTRO: categoria residuale';

      rollback:
        - sql:
            sql: |
              DROP TYPE IF EXISTS config.natura_soggetto_enum;
