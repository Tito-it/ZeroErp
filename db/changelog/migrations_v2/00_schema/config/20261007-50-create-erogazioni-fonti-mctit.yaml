# ------------------------------------------------------------
# config.erogazioni_fonti: COME SI EROGA E DA DOVE VIENE LA QUANTITA', COME DATO
#   Brief: brief-db-offerta-emissione-ed-erogazione §C.2.2 punto 1, §C.7 (giro B1)
#
# ── IL DIFETTO ───────────────────────────────────────────────────
#   Le combinazioni ammesse fra tipo_erogazione e fonte_quantita_attesa erano
#   scritte QUATTRO volte: i CHECK gemelli chk_*_coerenza_fonte_erogazione
#   (con chk_*_tipo_erog e chk_*_fonte_qta per i due domini), il CASE di
#   script.trgfn_righe_default_fonte_qta (due volte nello stesso corpo),
#   fontiQuantitaErogazione.js nel frontend e _FONTE_VIETATE_PER_TIPO_EROGAZIONE
#   nel backend. Il form non poteva chiederle al DB, perche' un CHECK non si legge.
#
# ── COSA FA ──────────────────────────────────────────────────────
#   Una riga per combinazione COERENTE, e `e_default` sulla fonte che una riga
#   prende quando nessuno la indica (al piu' una per erogazione: indice unico
#   parziale). Le combinazioni sono esattamente quelle che i CHECK ammettevano:
#   il giro B1 non cambia il comportamento, lo rende un dato.
#   Le righe di contratto e offerta si legano qui con una FK composta, in
#   80_data dopo il seed (20261007-54), che ritira i sei CHECK.
#
# ── LA FORMA ─────────────────────────────────────────────────────
#   · Niente `attivo`: e' cio' che il modello ammette, non una configurazione
#     (come documenti.formati_template, 20261004-20). Niente coppia ATTIVO a
#     ci_apply, niente guard generati sulle righe.
#   · Niente `storicizza` e niente RLS: catalogo letto da tutti, la sua storia
#     sta nel CSV sotto git.
#   · Niente CHECK sui due domini: i valori ammessi SONO le righe di questa
#     tabella. Un CHECK qui li ricopierebbe una quinta volta.
#   · La completezza («ogni erogazione ha la sua fonte di default») e' un
#     vincolo fra righe: la presidia il pgTAP
#     vendite/test-erogazioni-vocabolario-v1.
# ⚠️ Tabella NUOVA: fino a `--contexts=ci_apply` non ha i trigger di audit e
#   tx_id, quindi le colonne di audit nascono coi propri DEFAULT.
# ⚠️ Nessun GRANT: le ALTER DEFAULT PRIVILEGES del loop di 90_end danno a
#   zeroerp_app i diritti sulle tabelle nuove di `config` (forma di 20261001-41).
#   Serve: script.trgfn_righe_default_fonte_qta la legge come INVOKER, cioe' come
#   l'applicazione (provato su zeroerp_ci il 2026-10-07: SELECT concesso).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261007-50-create-erogazioni-fonti-mctit.yaml

  - changeSet:
      id: 20261007-50-create-erogazioni-fonti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea config.erogazioni_fonti: le combinazioni coerenti di tipo_erogazione e
        fonte_quantita_attesa, con la fonte di default per erogazione. Prende il posto della
        matrice scritta nei CHECK delle righe di contratto e offerta. Brief:
        brief-db-offerta-emissione-ed-erogazione §C.7 (B1).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: config
                tableName: erogazioni_fonti
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.erogazioni_fonti (
                  id                    smallint GENERATED BY DEFAULT AS IDENTITY
                                          CONSTRAINT pk_erogazioni_fonti PRIMARY KEY,
                  -- Stessi tipi delle colonne delle righe: la FK composta li confronta.
                  tipo_erogazione       varchar(16) NOT NULL,
                  fonte_quantita_attesa varchar(32) NOT NULL,
                  e_default             boolean     NOT NULL DEFAULT false,
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text        NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id                 uuid,
                  -- Il bersaglio della FK composta delle righe.
                  CONSTRAINT uq_erogazioni_fonti_coppia
                      UNIQUE (tipo_erogazione, fonte_quantita_attesa)
              );

              -- Al piu' una fonte di default per erogazione.
              CREATE UNIQUE INDEX uq_erogazioni_fonti_default
                  ON config.erogazioni_fonti (tipo_erogazione)
               WHERE e_default;

              COMMENT ON TABLE config.erogazioni_fonti IS
                  'Le combinazioni coerenti di tipo_erogazione (come si fattura una riga: CANONE, UNA_TANTUM, ORARIO, CONSUMO) e fonte_quantita_attesa (da dove viene la quantità: FISSA, MANUALE, TIMESHEET, LETTURE, DERIVATA_COMPONENTI). Una riga per combinazione ammessa; e_default marca la fonte che una riga prende quando nessuno la indica (al più una per erogazione). Le righe di vendite.contratti_righe e vendite.offerte_commerciali_eccezioni vi si legano con una FK composta, che ha preso il posto dei CHECK chk_*_tipo_erog, chk_*_fonte_qta e chk_*_coerenza_fonte_erogazione (20261007-54). La legge script.trgfn_righe_default_fonte_qta. Niente attivo: è ciò che il modello ammette, non una configurazione. Seed: 80_data/sql/config/erogazioni_fonti.csv. Brief: brief-db-offerta-emissione-ed-erogazione §C.7 (B1).';

              COMMENT ON COLUMN config.erogazioni_fonti.e_default IS
                  'La fonte che una riga con questa erogazione prende quando nessuno la indica (script.trgfn_righe_default_fonte_qta). Al più una per erogazione (uq_erogazioni_fonti_default); che ce ne sia una per ogni erogazione lo presidia il pgTAP vendite/test-erogazioni-vocabolario-v1.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS config.erogazioni_fonti;
