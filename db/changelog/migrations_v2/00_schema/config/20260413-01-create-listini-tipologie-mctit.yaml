# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Tabella config.listini_tipologie: classifica le tipologie di
# voce di listino (consumo, quota fissa, imposta, onere, prodotto,
# servizio). I flag booleani esclusivi permettono alla pipeline
# di fatturazione di interrogare direttamente il tipo senza
# string matching.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260413-01-create-listini-tipologie-mctit.yaml

  - changeSet:
      id: 20260413-01-create-listini-tipologie
      author: mctit
      comment: >
        Crea config.listini_tipologie con flag semantici booleani
        esclusivi per pipeline fatturazione.
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists: { schemaName: config, tableName: listini_tipologie }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.listini_tipologie (
                  id              smallint    GENERATED BY DEFAULT AS IDENTITY,
                  codice          varchar     NOT NULL,
                  descrizione     varchar     NOT NULL,
                  -- Flag semantici per pipeline di fatturazione
                  -- Esattamente uno deve essere TRUE per riga
                  e_consumo       boolean     NOT NULL DEFAULT false,
                  e_quota_fissa   boolean     NOT NULL DEFAULT false,
                  e_imposta       boolean     NOT NULL DEFAULT false,
                  e_onere         boolean     NOT NULL DEFAULT false,
                  e_prodotto      boolean     NOT NULL DEFAULT false,
                  e_servizio      boolean     NOT NULL DEFAULT false,
                  -- Ordinamento display UI
                  ordinamento     smallint    NOT NULL DEFAULT 100,
                  meta            jsonb       NOT NULL DEFAULT '{}'::jsonb,
                  attivo          boolean     NOT NULL DEFAULT true,
                  storicizza      boolean     NOT NULL DEFAULT true,
                  data_insert     timestamptz NOT NULL DEFAULT now(),
                  user_insert     text        NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamptz NOT NULL DEFAULT now(),
                  user_update     text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id           uuid,
                  CONSTRAINT pk_listini_tipologie PRIMARY KEY (id),
                  CONSTRAINT uq_listini_tipologie_codice UNIQUE (codice),
                  -- Esattamente un flag semantico attivo per tipologia
                  CONSTRAINT chk_listini_tipologie_flag_esclusivi CHECK (
                      (e_consumo::int + e_quota_fissa::int + e_imposta::int +
                       e_onere::int + e_prodotto::int + e_servizio::int) = 1
                  )
              );

              COMMENT ON TABLE config.listini_tipologie
                IS 'Tipologie voce di listino. Flag booleani esclusivi per pipeline fatturazione (e_consumo, e_quota_fissa, ecc.).';

      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS config.listini_tipologie;
