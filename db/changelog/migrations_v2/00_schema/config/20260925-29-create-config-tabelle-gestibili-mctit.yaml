# P-1 — LA LISTA DELLE TABELLE GESTIBILI DIVENTA UN DATO DEL DB: config.tabelle_gestibili
#   Brief: brief-db-pannello-config-verbo-generico, sezione 3.1 (D-3 del modello, D-P1, D-P2)
#
# -- PERCHE' --------------------------------------------------------------------------------------
#   Fino a oggi la lista viveva nel backend (REL_CONSENTITE, 87 voci), piu' una
#   copia nel frontend. Il verbo generico del pannello (config.fn_pannello_scrivi)
#   ha bisogno di saperla a DB: e' lei a dire QUALI tabelle si scrivono e A
#   QUALE OGGETTO appartiene ciascuna, cioe' su quale area si chiede il livello.
#
# -- DUE CAPACITA' IN UNA RIGA --------------------------------------------------------------------
#   La stessa costante serviva a due cose: il lookup generico (le tendine di tutta
#   l'applicazione) e il pannello. Qui sono due colonne, `lookup` e `pannello`:
#   una tabella puo' restare nelle tendine e uscire dal pannello (D-P2: le
#   quattro con RLS). Una riga con tutte e due false e' ritirata: niente `attivo`,
#   sarebbe un terzo interruttore senza una domanda sua.
#
# -- L'OGGETTO, NON L'AREA (D-5, D-P1) ------------------------------------------------------------
#   `app_label` + `model_name` nominano l'oggetto con la convenzione che esiste
#   gia' (config.area_model_overrides, model riservati dell'interfaccia
#   permessi): (schema, nome tabella). L'area NON e' una colonna: la ricava
#   script.fn_area_di_oggetto (override, altrimenti app_label). Scriverla qui
#   sarebbe una seconda sede della regola.
#
# -- LA LISTA E' UNA PORTA ------------------------------------------------------------------------
#   ⛔ Il verbo scrive come proprietario su qualunque tabella di questa lista. Se
#   l'app potesse scriverla, potrebbe aggiungerci una tabella chiusa e scriverla
#   dal verbo. ⇒ All'app solo SELECT: la postura e' nel loop dei grant
#   (v_tabelle_sola_lettura_app) e nel provisioning, P-4 (20260925-34).
#
# -- CHE COSA NASCE DA SOLO -----------------------------------------------------------------------
#   Lock su codice_interno implicito per la sola presenza della colonna
#   (linee-guida-sql 6b); audit e lock arrivano da ci_apply (tabella nuova,
#   linee-guida-sql 11.5). Colonne di audit coi loro DEFAULT perche' il seed
#   funzioni comunque. Seed: 20260925-30 (80_data). Catalogo, non macchina.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260925-29-create-config-tabelle-gestibili-mctit.yaml

  - changeSet:
      id: 20260925-29-create-config-tabelle-gestibili
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE config.tabelle_gestibili: la lista delle tabelle che il lookup generico serve
        (lookup) e che il pannello di configurazione scrive col verbo generico (pannello), con
        l'oggetto a cui ciascuna appartiene (app_label, model_name). Sostituisce la costante
        REL_CONSENTITE del backend. All'app solo SELECT (20260925-34). Brief:
        brief-db-pannello-config-verbo-generico, sezione 3.1.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: config
                tableName: tabelle_gestibili
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.tabelle_gestibili (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_tabelle_gestibili PRIMARY KEY,
                  codice_interno  TEXT         NOT NULL,
                  schema_tabella  TEXT         NOT NULL,
                  nome_tabella    TEXT         NOT NULL,
                  app_label       TEXT         NOT NULL,
                  model_name      TEXT         NOT NULL,
                  lookup          BOOLEAN      NOT NULL DEFAULT false,
                  pannello        BOOLEAN      NOT NULL DEFAULT false,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_tabelle_gestibili_codice_interno
                      UNIQUE (codice_interno),
                  -- La chiave e' il nome qualificato: e' cio' che il backend passa
                  -- (oggi `rel`) e cio' che il verbo riceve.
                  CONSTRAINT chk_tabelle_gestibili_codice_interno_qualificato
                      CHECK (codice_interno = schema_tabella || '.' || nome_tabella),
                  CONSTRAINT chk_tabelle_gestibili_nomi_forma
                      CHECK (schema_tabella ~ '^[a-z_][a-z0-9_]*$'
                         AND nome_tabella   ~ '^[a-z_][a-z0-9_]*$'),
                  CONSTRAINT chk_tabelle_gestibili_oggetto_forma
                      CHECK (app_label  ~ '^[a-z_][a-z0-9_]*$'
                         AND model_name ~ '^[a-z_][a-z0-9_]*$')
              );

              COMMENT ON TABLE config.tabelle_gestibili IS
                  'La lista delle tabelle GESTIBILI in modo generico: quelle che il lookup generico '
                  'serve alle tendine (lookup) e quelle che il pannello di configurazione scrive col '
                  'verbo config.fn_pannello_scrivi (pannello). Fino al 2026-09-25 era la costante '
                  'REL_CONSENTITE del backend. Ogni riga nomina l''OGGETTO a cui la tabella appartiene '
                  '(app_label, model_name, convenzione (schema, nome tabella) come in '
                  'area_model_overrides): il verbo chiede il livello su quell''oggetto, e l''area la '
                  'ricava script.fn_area_di_oggetto — qui non c''e'' una colonna area. ⛔ All''app solo '
                  'SELECT: la lista e'' una porta, perche'' il verbo scrive come proprietario su ogni '
                  'tabella che vi compare. Una riga nasce nel CSV del seed, non dall''applicazione. '
                  'Brief: brief-db-pannello-config-verbo-generico, sezione 3.1.';
              COMMENT ON COLUMN config.tabelle_gestibili.codice_interno IS
                  'Nome qualificato della tabella, schema.tabella: la chiave che il backend usa e che '
                  'il verbo riceve. Immutabile (lock su codice_interno da ci_apply).';
              COMMENT ON COLUMN config.tabelle_gestibili.app_label IS
                  'Primo pezzo della chiave dell''oggetto (D-5, D-P1): per convenzione lo schema. '
                  'Con model_name e'' la chiave di user_override_oggetti e area_model_overrides.';
              COMMENT ON COLUMN config.tabelle_gestibili.model_name IS
                  'Secondo pezzo della chiave dell''oggetto: per convenzione il nome della tabella.';
              COMMENT ON COLUMN config.tabelle_gestibili.lookup IS
                  'La tabella serve al lookup generico (dbops.fn_get_lookup_codici): le tendine.';
              COMMENT ON COLUMN config.tabelle_gestibili.pannello IS
                  'La tabella si gestisce dal pannello di configurazione, cioe'' la scrive '
                  'config.fn_pannello_scrivi. ⛔ Mai su una tabella con RLS: il verbo generico non sa '
                  'rimettere un perimetro (D-P2); il verbo lo verifica da se'' e un pgTAP lo presidia.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.tabelle_gestibili;
