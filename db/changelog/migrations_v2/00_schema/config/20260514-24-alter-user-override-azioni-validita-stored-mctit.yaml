databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260514-24-alter-user-override-azioni-validita-stored-mctit.yaml

  - changeSet:
      id: 20260514-24-alter-user-override-azioni-validita-stored
      author: mctit
      comment: "Step 2b PG18: converte validita a STORED generated su config.user_override_azioni."
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: config
              tableName: user_override_azioni
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_attribute a
                  JOIN pg_class c ON c.oid = a.attrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname='config' AND c.relname='user_override_azioni'
                   AND a.attname='validita' AND a.attnum>0
                   AND NOT a.attisdropped AND a.attgenerated=''
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_user_override_azioni_a20_set_validita_ins_upd
                  ON config.user_override_azioni;
              ALTER TABLE config.user_override_azioni DROP COLUMN validita CASCADE;
              ALTER TABLE config.user_override_azioni
                  ADD COLUMN validita DATERANGE
                      GENERATED ALWAYS AS (
                          daterange(COALESCE(valido_dal,'-infinity'::date),
                                    COALESCE(valido_al, 'infinity'::date),'[]')
                      ) STORED NOT NULL;
              COMMENT ON COLUMN config.user_override_azioni.validita IS
                  'Range calcolato da valido_dal/valido_al. GENERATED ALWAYS STORED. rev 2026-05-14.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE config.user_override_azioni DROP COLUMN IF EXISTS validita;
              ALTER TABLE config.user_override_azioni ADD COLUMN validita DATERANGE;
              UPDATE config.user_override_azioni SET validita=daterange(COALESCE(valido_dal,'-infinity'::date),COALESCE(valido_al,'infinity'::date),'[]');
              ALTER TABLE config.user_override_azioni ALTER COLUMN validita SET NOT NULL;
