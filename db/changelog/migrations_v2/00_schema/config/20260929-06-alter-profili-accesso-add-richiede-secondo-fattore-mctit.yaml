# P-2 — IL SEGNO DEL PROFILO PRIVILEGIATO: profili_accesso.richiede_secondo_fattore
#   Brief: brief-db-secondo-fattore-totp, sezione 2.2 (D-T1 di Tid, 2026-09-28:
#   un segno dichiarato sul profilo, non una lista di aree scritta in una funzione).
#
# ── ⭐ L'OBBLIGO SEGUE I BINDING ─────────────────────────────────────
#   Chi riceve il profilo ha l'obbligo, chi lo perde non l'ha piu': nessun
#   flag da ricordare sulle persone. La domanda la fa script.fn_totp_obbligatorio.
#
# ── ⛔ IL CHECK SUL SUPER_ADMIN NON NASCE QUI, MA IN 90_end ───────────
#   «Il super admin l'ha sempre» e' un CHECK (tipo <> 'SUPER_ADMIN' OR
#   richiede_secondo_fattore). Su un database ricostruito da zero l'ordine e'
#   00_schema -> 80_data: qui nascerebbe il vincolo, e poi 80_data/20260419-04
#   (gia' mergiato) inserisce il profilo 9100 SENZA questa colonna -> false ->
#   CHECK violato, migrate fermo. Il valore arriva dal CSV (mirror
#   80_data/20260806-18, colonna nuova); il vincolo in 90_end/20260929-23,
#   quando il seed l'ha gia' scritto.
#
# ── ⚠️ STORICO ──────────────────────────────────────────────────────
#   config.profili_accesso e' storicizzata: script.trgfn_storico_generic
#   serializza la riga in jsonb, quindi la colonna nuova entra nelle versioni
#   senza toccare la shadow.
#
# ── ⚠️ CHI LA SCRIVE ────────────────────────────────────────────────
#   La strada di scrittura di profili_accesso di oggi: il backend
#   (amm_software). Richiesta al BE nel brief §9.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260929-06-alter-profili-accesso-add-richiede-secondo-fattore-mctit.yaml

  - changeSet:
      id: 20260929-06-alter-profili-accesso-add-richiede-secondo-fattore
      author: mctit
      failOnError: true
      comment: >
        config.profili_accesso.richiede_secondo_fattore boolean NOT NULL DEFAULT false: il segno
        del profilo privilegiato (D-T1). L'obbligo del secondo fattore segue i binding. Il CHECK
        «il SUPER_ADMIN l'ha sempre» nasce in 90_end/20260929-23, dopo il seed. Brief:
        brief-db-secondo-fattore-totp §2.2.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: profili_accesso }
            - not:
                - columnExists:
                    { schemaName: config, tableName: profili_accesso, columnName: richiede_secondo_fattore }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.profili_accesso
                  ADD COLUMN richiede_secondo_fattore boolean NOT NULL DEFAULT false;

              COMMENT ON COLUMN config.profili_accesso.richiede_secondo_fattore IS
                  'Chi ha questo profilo deve usare il secondo fattore (TOTP): il segno del profilo privilegiato (D-T1), acceso da chi amministra i profili. L''obbligo segue i binding: chi riceve il profilo lo ha, chi lo perde no. Sempre true sul SUPER_ADMIN (chk_profili_accesso_super_admin_secondo_fattore, 90_end/20260929-23). La risposta unica e'' script.fn_totp_obbligatorio. Brief: brief-db-secondo-fattore-totp §2.2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.profili_accesso DROP COLUMN IF EXISTS richiede_secondo_fattore;
