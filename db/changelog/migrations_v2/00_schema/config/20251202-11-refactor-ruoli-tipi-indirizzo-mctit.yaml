# Liquibase changelog per Zero ERP
# Refactor tabella config.ruoli_tipi_indirizzo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20251202-11-dati_societari_policy_enum-mctit.yaml

  - changeSet:
      id: 20251202-11-dati_societari_policy_enum
      author: mctit
      preConditions:
        - onError: CONTINUE
        - onFail: CONTINUE
        - not:
            - columnExists:
                schemaName: config
                tableName: tipi_soggetto_dettaglio
                columnName: dati_societari_policy
      changes:
        - sql:
            sql: |
              CREATE TYPE config.dati_societari_policy_enum AS ENUM 
                ('NONE', 'OPTIONAL', 'REQUIRED');

              COMMENT ON TYPE config.dati_societari_policy_enum IS
                'Policy per l''uso dei dati societari sui tipi soggetto dettaglio:
                 - NONE: dati societari non previsti
                 - OPTIONAL: dati societari abilitati ma non obbligatori
                 - REQUIRED: dati societari previsti come obbligatori a livello di dominio';

  - changeSet:
      id: 20251202-11-02-tipi_soggetto_dettaglio-add-dati_societari_policy
      author: mctit
      preConditions:
        - onError: CONTINUE
        - onFail: CONTINUE
        - not:
            - columnExists:
                schemaName: config
                tableName: tipi_soggetto_dettaglio
                columnName: dati_societari_policy
      changes:
        - addColumn:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            columns:
              - column:
                  name: dati_societari_policy
                  type: config.dati_societari_policy_enum
                  defaultValueComputed: "'NONE'::config.dati_societari_policy_enum"
                  constraints:
                    nullable: false
        - sql:
            sql: |
              COMMENT ON COLUMN config.tipi_soggetto_dettaglio.dati_societari_policy IS
                'Policy utilizzo dati societari:
                 - NONE: dati societari non previsti per questo tipo
                 - OPTIONAL: dati societari abilitati (facoltativi)
                 - REQUIRED: dati societari previsti come obbligatori a livello di dominio';

  - changeSet:
      id: 20251202-11-03-tipi_soggetto_dettaglio-init-dati_societari_policy
      author: mctit
      preConditions:
        - onError: MARK_RAN
        - onFail: MARK_RAN
        - columnExists:
            schemaName: config
            tableName: tipi_soggetto_dettaglio
            columnName: dati_societari_policy
      changes:
        - sql:
            sql: |
              UPDATE config.tipi_soggetto_dettaglio
                 SET dati_societari_policy = 'OPTIONAL'
               WHERE codice_interno IN ('SC','SP');
