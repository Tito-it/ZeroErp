# Liquibase changelog per Zero ERP
# Tabella config.transizioni_stati_preventivi — matrice transizioni stati preventivo vendita
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260403-03-create-transizioni-stati-preventivi-mctit.yaml

  - changeSet:
      id: 20260403-03-create-transizioni-stati-preventivi
      author: mctit
      comment: >
        Matrice delle transizioni ammesse tra stati del preventivo vendita.
        Pattern identico a config.transizioni_stati_pratiche.
        Usata dalla funzione vendite.fn_cambia_stato_preventivo per validare
        le transizioni e dal backend per esporre le transizioni possibili.
      changes:
        - createTable:
            schemaName: config
            tableName: transizioni_stati_preventivi
            remarks: "Transizioni ammesse tra stati preventivo vendita."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transizioni_stati_preventivi
                    nullable: false

              - column:
                  name: stato_da_id
                  type: bigint
                  remarks: "FK -> config.stati_doc_preventivi.id (stato origine)."
                  constraints:
                    nullable: false

              - column:
                  name: stato_a_id
                  type: bigint
                  remarks: "FK -> config.stati_doc_preventivi.id (stato destinazione)."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se true, la transizione e' ammessa."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni (es. richiede_conferma, note_ui)."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: transizioni_stati_preventivi
            columnNames: stato_da_id, stato_a_id
            constraintName: uq_transizioni_stati_preventivi

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: transizioni_stati_preventivi
            baseColumnNames: stato_da_id
            constraintName: fk_transizioni_stati_prev_da
            referencedTableSchemaName: config
            referencedTableName: stati_doc_preventivi
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: transizioni_stati_preventivi
            baseColumnNames: stato_a_id
            constraintName: fk_transizioni_stati_prev_a
            referencedTableSchemaName: config
            referencedTableName: stati_doc_preventivi
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.transizioni_stati_preventivi
                ADD CONSTRAINT ck_transizioni_stati_prev_da_diverso_a
                CHECK (stato_da_id <> stato_a_id);

      rollback:
        - dropTable:
            schemaName: config
            tableName: transizioni_stati_preventivi
