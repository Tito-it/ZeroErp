# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 2b (origine e destinazione):
#   config.nature_vendita.destinazione_tipo
#   Brief: brief-db-grammatica-unica-documenti §12 (G-1, G-3 di Tid; L2-1 del 2026-10-19).
#
# -- CHE COSA CAMBIA -----------------------------------------------------------
#   La destinazione (V7: ORDINE | COMMESSA | CONTRATTO, CHECK scritto a mano,
#   varchar(20)) passa ai codici di config.sorgenti: ORDINE -> ORDINE_VENDITA,
#   COMMESSA e CONTRATTO restano. Stessa forma di 20261019-87: conversione sul
#   posto, varchar(50) (la lunghezza di codice_interno), FK al posto del CHECK.
#
# -- CHE COSA SI TOGLIE PRIMA, E CHI LO RIMETTE -----------------------------------
#   Le viste che leggono la colonna, dal catalogo vivo di dbdev (2026-10-19):
#     · vw_preventivi_smistamento_righe, vw_preventivi_smistamento,
#       vw_preventivi_righe_smistabili_ordine,
#       vw_preventivi_righe_smistabili_commessa -> 20261019-92;
#     · vw_dash_fatturazione_preventivi (legge vw_preventivi_smistamento_righe)
#       -> -93, con la catena della dashboard che -87 ha gia' tolto;
#     · catalogo.vw_articoli_dettaglio -> -94.
#   Nessuna funzione BEGIN ATOMIC e nessun trigger UPDATE OF sulla colonna.
#
# -- LA FK QUI, IN 00_schema ----------------------------------------------------
#   Da zero la tabella e' vuota quando nasce la FK: il mirror delle sorgenti
#   (80_data 20251002-21) gira prima del seed delle nature (20260608-42, che dal
#   CSV di questo giro scrive ORDINE_VENDITA). Su dev le tre righe convertite
#   puntano a codici che config.sorgenti ha gia'. A ci_apply l'automazione
#   ATTIVO la salta come in -87 (colonna che non finisce in _id, provato sullo
#   scratch): la FK lega il nome, non l'accensione.
#
# -- IL CHECK CHE SPARISCE --------------------------------------------------------
#   Come in -87: quali sorgenti siano una destinazione lo dicono i lettori (le
#   viste di smistamento contano ORDINE_VENDITA e COMMESSA; i push), non piu' un
#   elenco sulla colonna. Scelta di G-3, dichiarata nel brief.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261019-88-alter-nature-vendita-destinazione-tipo-sorgenti-mctit.yaml

  - changeSet:
      id: 20261019-88-alter-nature-vendita-destinazione-tipo-sorgenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.nature_vendita.destinazione_tipo passa ai codici di config.sorgenti (ORDINE ->
        ORDINE_VENDITA), convertita sul posto: varchar(50) e FK verso
        config.sorgenti(codice_interno) al posto del CHECK. Tolte qui le viste che la leggono,
        ricreate da 20261019-92 … -94. Grammatica unica, lotto 2b.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: |
              SELECT count(*) FROM pg_catalog.pg_constraint c
               WHERE c.conrelid = 'config.nature_vendita'::regclass
                 AND c.conname = 'chk_nature_vendita_destinazione_tipo'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW vendite.vw_dash_fatturazione_preventivi;
              DROP VIEW vendite.vw_preventivi_smistamento;
              DROP VIEW vendite.vw_preventivi_smistamento_righe;
              DROP VIEW vendite.vw_preventivi_righe_smistabili_ordine;
              DROP VIEW vendite.vw_preventivi_righe_smistabili_commessa;
              DROP VIEW catalogo.vw_articoli_dettaglio;

              ALTER TABLE config.nature_vendita DROP CONSTRAINT chk_nature_vendita_destinazione_tipo;

              ALTER TABLE config.nature_vendita
                  ALTER COLUMN destinazione_tipo TYPE varchar(50)
                  USING CASE destinazione_tipo
                            WHEN 'ORDINE' THEN 'ORDINE_VENDITA'
                            ELSE destinazione_tipo
                        END;

              ALTER TABLE config.nature_vendita
                  ADD CONSTRAINT fk_nature_vendita_destinazione_tipo_sorgenti
                  FOREIGN KEY (destinazione_tipo)
                  REFERENCES config.sorgenti (codice_interno)
                  ON UPDATE RESTRICT ON DELETE RESTRICT;

              COMMENT ON COLUMN config.nature_vendita.destinazione_tipo IS
                  'Destinazione operativa dello split: il codice di config.sorgenti del documento che riceve la '
                  'riga, ORDINE_VENDITA (merce) | COMMESSA (servizio una tantum) | CONTRATTO (ricorrenza); FK '
                  'fk_nature_vendita_destinazione_tipo_sorgenti. Letto in modo data-driven da fn_push_* e dalla '
                  'capability genera_ordine (residuo righe con destinazione ORDINE_VENDITA). rev 2026-10-19 '
                  '(20261019-88, brief-db-grammatica-unica-documenti lotto 2b, G-3 di Tid): era un vocabolario a '
                  'parte chiuso da un CHECK (ORDINE | COMMESSA | CONTRATTO, varchar(20)); ora e'' lungo quanto '
                  'codice_interno e punta alle sorgenti (ORDINE -> ORDINE_VENDITA). Quale sorgente sia una '
                  'destinazione lo decidono i lettori: le viste di smistamento del preventivo e i push.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.nature_vendita DROP CONSTRAINT fk_nature_vendita_destinazione_tipo_sorgenti;

              ALTER TABLE config.nature_vendita
                  ALTER COLUMN destinazione_tipo TYPE varchar(20)
                  USING CASE destinazione_tipo
                            WHEN 'ORDINE_VENDITA' THEN 'ORDINE'
                            ELSE destinazione_tipo
                        END;

              ALTER TABLE config.nature_vendita
                  ADD CONSTRAINT chk_nature_vendita_destinazione_tipo
                  CHECK (destinazione_tipo::text = ANY (ARRAY['ORDINE', 'COMMESSA', 'CONTRATTO']));

              COMMENT ON COLUMN config.nature_vendita.destinazione_tipo IS
                  'Destinazione operativa dello split: ORDINE (merce) | COMMESSA (servizio una tantum) | CONTRATTO '
                  '(ricorrenza). Letto in modo data-driven da fn_push_* e dalla capability genera_ordine (residuo '
                  'righe con destinazione ORDINE).';

              CREATE VIEW vendite.vw_preventivi_smistamento_righe WITH (security_invoker=on) AS
               SELECT p.id AS preventivo_id,
                  p.uid AS preventivo_uid,
                  p.numero AS preventivo_numero,
                  pr.id AS riga_id,
                  pr.ordine AS riga_ordine,
                  pr.descrizione AS riga_descrizione,
                  pr.articolo_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.prezzo_unitario,
                  pr.natura_vendita_id,
                  nv.codice AS natura_vendita_codice,
                  COALESCE(nv.destinazione_tipo, 'COMMESSA'::character varying) AS destinazione_tipo,
                  orr.id AS ordine_riga_id,
                  o.id AS ordine_id,
                  o.numero AS ordine_numero,
                      CASE
                          WHEN (EXISTS ( SELECT 1
                             FROM vendite.attivita_fatturabili af
                            WHERE af.sorgente_uid = p.uid AND af.sorgente_riga = pr.id AND af.fattura_riga_id IS NOT NULL)) THEN 'FATTURATA'::text
                          WHEN (EXISTS ( SELECT 1
                             FROM vendite.attivita_fatturabili af
                            WHERE af.sorgente_uid = p.uid AND af.sorgente_riga = pr.id)) THEN 'EMESSA_AF'::text
                          WHEN script.fn_get_stato_push_segment(((('PREV:'::text || p.uid::text) || ':R:'::text) || pr.id::text)::character varying) <> 'LIBERA'::text THEN 'IN_COMMESSA'::text
                          WHEN orr.id IS NOT NULL THEN 'A_ORDINE'::text
                          ELSE 'RESIDUA'::text
                      END AS stato_smistamento
                 FROM vendite.preventivi p
                   JOIN vendite.preventivi_righe pr ON pr.preventivo_id = p.id AND pr.attivo IS TRUE
                   LEFT JOIN config.nature_vendita nv ON nv.id = pr.natura_vendita_id
                   LEFT JOIN vendite.ordini_righe orr ON orr.preventivo_riga_id = pr.id
                   LEFT JOIN vendite.ordini o ON o.id = orr.ordine_id;

              COMMENT ON VIEW vendite.vw_preventivi_smistamento_righe IS
                  'Fonte dati del Pannello Smistamento (una riga per riga attiva del preventivo): '
                  'natura/destinazione effettiva (NULL = pregresso -> COMMESSA), riferimenti ramo ordine, '
                  'stato_smistamento autorevole (RESIDUA/A_ORDINE/IN_COMMESSA/EMESSA_AF/FATTURATA). Sostituisce '
                  'vw_preventivi_stato_fatturazione_righe (brief-db-smistamento-preventivi.md B). ⭐ rev 2026-10-12 '
                  '(20261012-11, brief-db-annullo-a-valle-riapre-a-monte D-5): IN_COMMESSA = il segmento della riga'
                  ' non e'' LIBERO per script.fn_get_stato_push_segment, la fonte unica del «gia'' mandato». Prima '
                  'era «segment EMESSA», allineato al predicato che la vista smistabili aveva fino al 2026-06-28: '
                  'quando quella e'' passata all''allocazione, questa non l''ha seguita, e una riga mandata in '
                  'commessa e non ancora emessa risultava RESIDUA mentre il push la dava gia'' inviata. Una riga di '
                  'commessa ANNULLATA non occupa: annullata la commessa, la riga torna RESIDUA.';

              CREATE VIEW vendite.vw_preventivi_smistamento WITH (security_invoker=on) AS
               SELECT preventivo_id,
                  preventivo_uid,
                  preventivo_numero,
                  count(*) AS righe_totali,
                  count(*) FILTER (WHERE destinazione_tipo::text = 'ORDINE'::text) AS righe_merce,
                  count(*) FILTER (WHERE destinazione_tipo::text = 'COMMESSA'::text) AS righe_servizi,
                  count(*) FILTER (WHERE stato_smistamento = 'A_ORDINE'::text) AS righe_a_ordine,
                  count(*) FILTER (WHERE stato_smistamento = ANY (ARRAY['IN_COMMESSA'::text, 'EMESSA_AF'::text, 'FATTURATA'::text])) AS righe_in_commessa,
                  count(*) FILTER (WHERE stato_smistamento = ANY (ARRAY['EMESSA_AF'::text, 'FATTURATA'::text])) AS righe_emesse_af,
                  count(*) FILTER (WHERE stato_smistamento = 'FATTURATA'::text) AS righe_fatturate,
                  count(*) FILTER (WHERE stato_smistamento = 'RESIDUA'::text) AS righe_residue
                 FROM vendite.vw_preventivi_smistamento_righe
                GROUP BY preventivo_id, preventivo_uid, preventivo_numero;

              COMMENT ON VIEW vendite.vw_preventivi_smistamento IS
                  'Aggregata smistamento preventivo: contatori per ramo (merce/servizi, a ordine/in '
                  'commessa/emesse/fatturate) + righe_residue complessivo per il progress "X/Y smistate -> EVASO" '
                  '(gate D6). Sostituisce vw_preventivi_stato_fatturazione.';

              CREATE VIEW vendite.vw_preventivi_righe_smistabili_ordine WITH (security_invoker=on) AS
               SELECT pr.preventivo_id,
                  pr.id,
                  pr.natura_vendita_id,
                  pr.articolo_id,
                  pr.descrizione,
                  pr.prezzo_unitario,
                  pr.sconto_percentuale,
                  pr.iva_id,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.factor_to_base,
                  pr.ordine,
                  pr.data_consegna_richiesta_cliente
                 FROM vendite.preventivi_righe pr
                   JOIN config.nature_vendita nv ON nv.id = pr.natura_vendita_id
                WHERE COALESCE(pr.attivo, true) IS TRUE AND nv.destinazione_tipo::text = 'ORDINE'::text AND NOT (EXISTS ( SELECT 1
                         FROM vendite.ordini_righe orr
                        WHERE orr.preventivo_riga_id = pr.id));

              COMMENT ON VIEW vendite.vw_preventivi_righe_smistabili_ordine IS
                  'Sorgente unica (DB-first) del predicato di smistamento: righe-merce di un preventivo ancora da '
                  'portare in un ordine (natura destinazione_tipo=ORDINE, attive, non ancora allocate a una '
                  'ordini_righe.preventivo_riga_id). Grana = preventivi_righe; i consumatori filtrano per '
                  'preventivo_id ed eventualmente per id (smistamento parziale). Consumata da '
                  'fn_preventivo_ha_residuo_ordine e fn_push_preventivo_a_ordine; predisposta per il dialog BE di '
                  'selezione righe. ⭐ rev 2026-09-13 (P-6): + data_consegna_richiesta_cliente in coda — e'' la '
                  'proiezione da cui fn_push_preventivo_a_ordine copia la riga, e senza questa colonna la data del '
                  'cliente si perdeva nel punto in cui il documento cambia natura. In ultima posizione perche'' '
                  'CREATE OR REPLACE VIEW puo'' solo appendere. security_invoker=on. Brief: '
                  'brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 5.2.';

              CREATE VIEW vendite.vw_preventivi_righe_smistabili_commessa WITH (security_invoker=on) AS
               SELECT pr.preventivo_id,
                  pr.id,
                  p.uid AS preventivo_uid,
                  pr.natura_vendita_id,
                  pr.articolo_id,
                  pr.descrizione,
                  pr.prezzo_unitario,
                  pr.sconto_percentuale,
                  pr.iva_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.factor_to_base,
                  pr.ordine
                 FROM vendite.preventivi_righe pr
                   JOIN vendite.preventivi p ON p.id = pr.preventivo_id
                   LEFT JOIN config.nature_vendita nv ON nv.id = pr.natura_vendita_id
                WHERE pr.attivo IS TRUE AND pr.quantita > 0::numeric AND pr.prezzo_unitario >= 0::numeric AND (pr.natura_vendita_id IS NULL OR nv.destinazione_tipo::text = 'COMMESSA'::text) AND script.fn_get_stato_push_segment(((('PREV:'::text || p.uid::text) || ':R:'::text) || pr.id::text)::character varying) = 'LIBERA'::text;

              COMMENT ON VIEW vendite.vw_preventivi_righe_smistabili_commessa IS
                  'Righe preventivo eleggibili al push commessa (servizi una tantum): attive, qta>0, prezzo>=0, '
                  'natura NULL/COMMESSA, non gia'' mandate in commessa. Simmetrica a '
                  'vw_preventivi_righe_smistabili_ordine (esclude su allocazione, non su fatturazione). Predicato '
                  'di riga unico condiviso con fn_list_preventivi_da_pushare e fn_preventivo_ha_residuo_commessa; '
                  'condizioni di testata a carico dei consumer. Fix gate EVASO '
                  '(brief-db-gate-evaso-ramo-commessa-asimmetria.md). ⭐ rev 2026-10-12 (20261012-08/-09, '
                  'brief-db-annullo-a-valle-riapre-a-monte D-5): «gia'' mandata» non e'' piu'' un predicato proprio: '
                  'e'' script.fn_get_stato_push_segment(''PREV:<uid>:R:<id>'') = ''LIBERA'', la fonte unica del «gia'' '
                  'inviato» (componenti #CMP e rettifiche #RET compresi). Una riga di commessa ANNULLATA non '
                  'occupa: annullata la commessa, la riga torna smistabile. Prima la vista contava le righe '
                  'ANNULLATA e non vedeva #RET: una terza copia della regola, gia'' diversa dalle altre due.';

              CREATE VIEW vendite.vw_dash_fatturazione_preventivi WITH (security_invoker=on) AS
               WITH righe AS (
                       SELECT sr.preventivo_id,
                          sr.riga_id,
                          script.fn_imponibile_riga(COALESCE(sr.quantita, 0::numeric), sr.prezzo_unitario, pr.sconto_percentuale) AS valore_riga,
                          sr.stato_smistamento <> 'RESIDUA'::text AS transitata
                         FROM vendite.vw_preventivi_smistamento_righe sr
                           JOIN vendite.preventivi_righe pr ON pr.id = sr.riga_id
                      )
               SELECT 'PREVENTIVI'::character varying AS area,
                  COALESCE(p.competenza_mese, date_trunc('month'::text, p.validita_dal::timestamp with time zone)::date, date_trunc('month'::text, p.data::timestamp with time zone)::date) AS competenza_mese,
                  p.id AS documento_id,
                  p.uid::text AS documento_uid,
                  p.numero::text AS codice,
                  p.emittente_fiscale_id,
                  NULL::bigint AS emittente_soggetto_ruolo_id,
                  COALESCE(sum(r.valore_riga), 0::numeric) AS valore_totale,
                  COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), 0::numeric) AS valore_transitato,
                  count(r.riga_id)::integer AS unita_totali,
                  count(r.riga_id) FILTER (WHERE r.transitata)::integer AS unita_transitate,
                  count(r.riga_id) > 0 AND count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata) AS is_transitato,
                  COALESCE(sdp.esito::text = 'NEGATIVO'::text, false) AS is_abortito,
                      CASE
                          WHEN COALESCE(sdp.esito::text = 'NEGATIVO'::text, false) THEN NULL::text
                          WHEN count(r.riga_id) > 0 AND count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata) THEN NULL::text
                          WHEN sdp.codice_interno::text = 'DRAFT'::text THEN 'DOC_BOZZA'::text
                          WHEN sdp.codice_interno::text = 'EMESSO'::text THEN 'IN_ATTESA_ACCETTAZIONE'::text
                          ELSE 'RIGA_RESIDUA'::text
                      END::character varying AS motivo_fermo,
                  sdp.codice_interno AS stato_codice_interno,
                  sdp.codice AS stato_codice,
                  sdp.fase,
                  s.ragione_sociale_completa AS cliente_display,
                  p.data AS data_riferimento
                 FROM vendite.vw_preventivi p
                   JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                   LEFT JOIN righe r ON r.preventivo_id = p.id
                   LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = p.istanza_utility_id
                   LEFT JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                WHERE p.is_attiva
                GROUP BY p.id, p.uid, p.numero, p.competenza_mese, p.validita_dal, p.data, p.emittente_fiscale_id, sdp.codice_interno, sdp.codice, sdp.fase, sdp.esito, s.ragione_sociale_completa;

              COMMENT ON VIEW vendite.vw_dash_fatturazione_preventivi IS
                  'Dashboard fatturazione: resolver area PREVENTIVI. Valore imponibile totale vs transitato '
                  '(vw_preventivi_smistamento_righe, ramo commessa EMESSA). Competenza COALESCE(competenza_mese, '
                  'mese validita_dal, mese data). is_abortito=esito NEGATIVO (null-safe). cliente_display=ragione '
                  'sociale intestatario istanza (path vw_preventivi_lista). Consumata da '
                  'vw_dash_fatturazione_documenti.';

              COMMENT ON COLUMN vendite.vw_dash_fatturazione_preventivi.data_riferimento IS
                  'Anzianita'' backlog (due lenti): data documento del preventivo ("fermo da...", proxy v1).';

              CREATE VIEW catalogo.vw_articoli_dettaglio AS
               SELECT a.id,
                  a.codice,
                  a.descrizione,
                  a.descrizione_breve,
                  a.uom_id,
                  a.tipo_voce_id,
                  a.gruppo_voce_id,
                  a.spesa_id,
                  a.iva_id,
                  a.conto_contabile_vendita_id,
                  a.conto_contabile_acquisto_id,
                  a.is_composito,
                  a.is_solo_componente,
                  a.requires_serial,
                  a.listino_tipologia_id,
                  a.meta,
                  a.user_insert,
                  a.user_update,
                  a.data_insert,
                  a.data_update,
                  a.tx_id,
                  a.storicizza,
                  a.attivo,
                  a.note_target_tipo,
                  a.note_id,
                  u.id AS uom_ref_id,
                  u.codice AS uom_codice,
                  u.descrizione AS uom_descrizione,
                  t.id AS tipologia_ref_id,
                  t.codice AS tipologia_codice,
                  t.descrizione AS tipologia_descrizione,
                  g.id AS gruppo_ref_id,
                  g.codice AS gruppo_codice,
                  g.descrizione AS gruppo_descrizione,
                  s.id AS spesa_ref_id,
                  s.codice AS spesa_codice,
                  s.descrizione AS spesa_descrizione,
                  i.id AS iva_ref_id,
                  i.codice AS iva_codice,
                  i.descrizione AS iva_descrizione,
                  i.aliquota_iva AS iva_aliquota_iva,
                  lt.codice AS tipologia_listino_codice,
                  lt.descrizione AS tipologia_listino_descrizione,
                  a.is_composito AND NOT a.is_solo_componente AS puo_gestire_bom,
                      CASE
                          WHEN a.is_composito AND NOT a.is_solo_componente THEN NULL::text
                          WHEN a.is_solo_componente THEN 'ARTICOLO_SOLO_COMPONENTE'::text
                          ELSE 'ARTICOLO_NON_COMPOSITO'::text
                      END AS motivo_non_gestibile_bom,
                  a.is_composito AND (EXISTS ( SELECT 1
                         FROM catalogo.articoli_componenti ac
                        WHERE ac.prodotto_id = a.id AND ac.validita @> (( SELECT script.fn_data_operativa() AS fn_data_operativa)) AND ac.attivo = true)) AS has_componenti_alla_data,
                  a.natura_vendita_id,
                  nv.codice_interno AS natura_vendita_codice_interno,
                  nv.descrizione AS natura_vendita_descrizione,
                  nv.destinazione_tipo AS natura_vendita_destinazione_tipo,
                  a.modo_approvvigionamento_id,
                  ma.codice_interno AS modo_approvvigionamento_codice_interno,
                  ma.descrizione AS modo_approvvigionamento_descrizione,
                  a.gestito_a_magazzino,
                  a.lead_time_giorni,
                  a.requires_lotto
                 FROM catalogo.articoli a
                   LEFT JOIN catalogo.unita_misura u ON u.id = a.uom_id
                   LEFT JOIN vendite.articoli_tipologie t ON t.id = a.tipo_voce_id
                   LEFT JOIN vendite.articoli_gruppi g ON g.id = a.gruppo_voce_id
                   LEFT JOIN vendite.articoli_spesa s ON s.id = a.spesa_id
                   LEFT JOIN config.iva i ON i.id = a.iva_id
                   LEFT JOIN config.listini_tipologie lt ON lt.id = a.listino_tipologia_id
                   LEFT JOIN config.nature_vendita nv ON nv.id = a.natura_vendita_id
                   LEFT JOIN config.modi_approvvigionamento ma ON ma.id = a.modo_approvvigionamento_id;

              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS
                  'Vista della lista (ui.lista_definizione 26) e del drawer articolo: catalogo.articoli + '
                  'decodifiche (uom, tipologia, gruppo, spesa, iva, tipologia listino, natura di vendita) + '
                  'capability BoM. Nessuna security_invoker, e non deve prenderla per imitazione: catalogo.articoli'
                  ' non ha RLS e la vista non attraversa tabelle protette (presidio sul merito: '
                  'db/pgtap/rls/test-rls-viste-security-invoker.sql). ⭐ rev 2026-09-18 (P-1, '
                  'brief-db-magazzino-lotto-2-motore sezione 4.9): + requires_lotto in coda — la primitiva di '
                  'magazzino pretende il lotto quando e'' vero (passo 6), e l''operatore deve poterlo vedere e '
                  'impostare; SENZA lock BoM (Lotto 1 sezione 4.3: il lotto non entra nella distinta), quindi ne'' '
                  'fra i non_editable_fields del BE ne'' disabilitato nel drawer. rev 2026-09-13 (P-6, '
                  'brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + modo_approvvigionamento_id, '
                  'modo_approvvigionamento_codice_interno, modo_approvvigionamento_descrizione, '
