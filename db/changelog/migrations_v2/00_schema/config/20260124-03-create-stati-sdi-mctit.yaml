databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260124-03-create-stati-sdi-mctit.yaml

  - changeSet:
      id: 20260124-03-create-stati-sdi
      author: mctit
      comment: "Tabella config.stati_sdi (stati esito SDI)"
      changes:
        - createTable:
            schemaName: config
            tableName: stati_sdi
            remarks: "Stati esito SDI (canale di invio fatture)."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_stati_sdi
                    nullable: false

              - column:
                  name: codice
                  type: character varying
                  remarks: "Codice stato SDI."
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: character varying
                  remarks: "Descrizione stato SDI."
                  constraints:
                    nullable: true

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Stato attivo/disattivo."
                  constraints:
                    nullable: false

              - column:
                  name: ordine
                  type: smallint
                  remarks: "Ordine logico stato SDI."
                  constraints:
                    nullable: true

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni."
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: character varying
                  remarks: "Codice interno (lock)."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_sdi
            columnNames: codice
            constraintName: uq_stati_sdi_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_sdi
            columnNames: codice_interno
            constraintName: uq_stati_sdi_codice_interno

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE INDEX ix_stati_sdi_attivo ON config.stati_sdi USING btree (attivo);

              COMMENT ON TABLE config.stati_sdi
                IS 'Stati esito SDI (canale di invio fatture).';
