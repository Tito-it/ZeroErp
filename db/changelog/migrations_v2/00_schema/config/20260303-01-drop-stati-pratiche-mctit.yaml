# Liquibase changelog per Zero ERP
# Drop config.stati_pratiche — ricostruzione con pattern standard
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260303-01-drop-stati-pratiche-mctit.yaml

  - changeSet:
      id: 20260303-01-drop-stati-pratiche
      author: mctit
      comment: >
        Rimuove config.stati_pratiche (e relativa tabella storico) per
        ricostruirla con la struttura standard config: aggiunta colonne
        attivo, meta mancanti nella versione precedente.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              DROP TABLE IF EXISTS storico.stati_pratiche CASCADE;
              DROP TABLE IF EXISTS config.stati_pratiche CASCADE;
