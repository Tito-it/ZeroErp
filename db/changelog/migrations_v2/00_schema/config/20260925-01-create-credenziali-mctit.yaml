# P-1 — LA SEDE DELLA CREDENZIALE: config.credenziali
#   Brief: brief-db-blocco-login-per-credenziale, sezioni 2.2 e 2.3
#   Decisioni di Tid del 2026-09-24: D-1 (riletta), D-2, D-7, D-B1, D-B3.
#
# ── ⭐ PERCHE' UNA TABELLA DELLA CREDENZIALE ─────────────────────────
#   La password e' UNA e vive su django.auth_user: vale per tutte le porte
#   (operatore, portale, shop). Fino a oggi il suo stato — tentativi falliti,
#   blocco, cambio password obbligatorio — stava su anagrafiche.identita_
#   digitali, cioe' su una riga per VESTE: lo stato di una cosa sola
#   distribuito su N righe, e il login contava solo la riga OPERATORE.
#   Qui lo stato torna alla cosa a cui appartiene.
#
# ── ⭐ LA RIGA NASCE ALLA PRIMA SCRITTURA ───────────────────────────
#   Non c'e' una riga per ogni auth_user: le credenziali nascono anche fuori
#   dal DB (PortaleRepository.create_auth_user_portale, Django stesso), e
#   chiudere quelle strade non serve. L'ASSENZA della riga vale «nessun
#   tentativo, nessun freno, non bloccata, nessun obbligo di cambio password».
#   ⛔ Quel valore sta in un posto solo perche' nessuno fuori dal DB legge o
#   scrive questa tabella: lo fanno le funzioni di script (20260925-04…-17),
#   e il backend chiede a loro.
#
# ── ⭐ TRE REGOLE, E QUI CE NE SONO DUE ─────────────────────────────
#   · l'ATTESA CRESCENTE sulla credenziale: fallimenti_consecutivi (da
#     qualunque provenienza) e ultimo_fallimento_at, la base dell'attesa;
#   · il BLOCCO DELL'ADMIN: bloccata_at / bloccata_da / motivo_blocco, tutti
#     NULL = non bloccata. Lo scrive solo un SUPER_ADMIN (D-B1), con un verbo.
#   Il FRENO SULLA PROVENIENZA sta nella figlia, config.credenziali_
#   provenienze (20260925-02). E c'e' deve_cambiare_password (D-7).
#
# ── ⚠️ PK `id` E UNIQUE SU auth_user_id ─────────────────────────────
#   Le linee guida (§2-§4) vogliono la PK surrogata `id` ed evitano le chiavi
#   composte: stessa forma di config.auth_totp_device, anch'esso 1:1 con
#   auth_user. La prima stesura del brief proponeva PK = auth_user_id: corretta.
#
# ── ⚠️ LA FK VERSO django.auth_user NON NASCE QUI ───────────────────
#   In CI Liquibase gira PRIMA di `manage.py migrate`: qui django.auth_user
#   non esiste. Le due FK (auth_user_id, bloccata_da) nascono in 90_end con
#   MARK_RAN, la forma di casa (20260925-22, -23). Colonne integer esplicite:
#   niente %TYPE su colonne di Django.
#
# ── ⚠️ NIENTE STORICO, NIENTE RLS ───────────────────────────────────
#   Una riga cambia a ogni password sbagliata: lo storico tornerebbe a
#   registrare i tentativi falliti, che e' uno dei difetti della sede vecchia
#   (ogni fallimento era uno snapshot di identita_digitali). Nessuna colonna
#   storicizza. Nessuna RLS: la tabella non ha scope (linee-guida §10.1), e le
#   funzioni del login girano prima che esista un utente.
#   I trigger di audit li genera ci_apply (pattern, non elenco).
#
# ── ⚠️ LA PORTA ─────────────────────────────────────────────────────
#   L'app ha SOLO SELECT (90_end/20260925-24 + loop dei grant + provisioning):
#   scrivono le funzioni DEFINER. Il SELECT resta perche' lo legge
#   script.fn_check_almeno_un_super_admin_attivo, LANGUAGE sql chiamata da
#   trigger INVOKER che girano come l'app.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260925-01-create-credenziali-mctit.yaml

  - changeSet:
      id: 20260925-01-create-credenziali
      author: mctit
      failOnError: true
      comment: >
        Crea config.credenziali, la sede dello stato della credenziale (1:1 con django.auth_user,
        la riga nasce alla prima scrittura): deve_cambiare_password (D-7), i fallimenti
        consecutivi dell'attesa crescente, il blocco dell'admin (bloccata_at/_da, motivo).
        Niente storico, niente RLS; FK verso Django in 90_end. Brief:
        brief-db-blocco-login-per-credenziale §2.2-2.3.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                { schemaName: config, tableName: credenziali }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.credenziali (
                  id                      bigint      GENERATED BY DEFAULT AS IDENTITY,
                  auth_user_id            integer     NOT NULL,
                  deve_cambiare_password  boolean     NOT NULL DEFAULT false,
                  fallimenti_consecutivi  integer     NOT NULL DEFAULT 0,
                  ultimo_fallimento_at    timestamptz,
                  bloccata_at             timestamptz,
                  bloccata_da             integer,
                  motivo_blocco           text,
                  data_insert             timestamptz NOT NULL DEFAULT now(),
                  user_insert             text        NOT NULL DEFAULT CURRENT_USER,
                  data_update             timestamptz NOT NULL DEFAULT now(),
                  user_update             text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_credenziali PRIMARY KEY (id),
                  CONSTRAINT uq_credenziali_auth_user UNIQUE (auth_user_id),
                  -- Un fallimento ha sempre un orario: e' la base dell'attesa.
                  CONSTRAINT chk_credenziali_fallimenti
                      CHECK (fallimenti_consecutivi >= 0
                             AND (fallimenti_consecutivi = 0 OR ultimo_fallimento_at IS NOT NULL)),
                  -- Il blocco dell'admin e' tutto o niente: chi, quando e perche'.
                  CONSTRAINT chk_credenziali_blocco
                      CHECK ((bloccata_at IS NULL AND bloccata_da IS NULL AND motivo_blocco IS NULL)
                          OR (bloccata_at IS NOT NULL AND bloccata_da IS NOT NULL
                              AND motivo_blocco IS NOT NULL AND btrim(motivo_blocco) <> ''))
              );

              COMMENT ON TABLE config.credenziali IS
                  'Stato della CREDENZIALE (1:1 con django.auth_user): la password e'' una e vale per tutte le porte, e qui sta cio'' che le appartiene. La riga nasce alla prima scrittura; la sua ASSENZA vale «nessun tentativo, non bloccata, nessun obbligo di cambio password». Nessuno la legge o scrive fuori dal DB: lo fanno le funzioni di script (fn_check_blocco_login, fn_registra_tentativo_login, fn_azzera_tentativi_credenziale, fn_blocca_credenziale, fn_sblocca_credenziale, fn_get/fn_imposta_deve_cambiare_password). All''app solo SELECT. Niente storico (cambierebbe a ogni password sbagliata), niente RLS (nessuno scope, letta prima del login). Brief: brief-db-blocco-login-per-credenziale.';
              COMMENT ON COLUMN config.credenziali.auth_user_id IS
                  'La credenziale: django.auth_user.id. FK in 90_end (20260925-22), perche'' in CI Liquibase gira prima di manage.py migrate.';
              COMMENT ON COLUMN config.credenziali.deve_cambiare_password IS
                  'Cambio password obbligatorio al prossimo accesso (D-7): della credenziale, non della veste, perche'' la password e'' una. Si legge con script.fn_get_deve_cambiare_password, si scrive con script.fn_imposta_deve_cambiare_password.';
              COMMENT ON COLUMN config.credenziali.fallimenti_consecutivi IS
                  'Fallimenti consecutivi da QUALUNQUE provenienza. Oltre il tetto (parametro login_tetto_credenziale) il login chiede un''attesa crescente, che rallenta senza chiudere. Azzerati da un accesso riuscito o da un reset password (D-2).';
              COMMENT ON COLUMN config.credenziali.ultimo_fallimento_at IS
                  'Orario dell''ultimo fallimento: la base da cui si conta l''attesa crescente.';
              COMMENT ON COLUMN config.credenziali.bloccata_at IS
                  'Blocco dell''amministratore (D-B1: solo SUPER_ADMIN): quando. NULL = non bloccata. Non scade e il reset password non lo toglie (D-B3): lo toglie solo script.fn_sblocca_credenziale.';
              COMMENT ON COLUMN config.credenziali.bloccata_da IS
                  'Blocco dell''amministratore: chi (django.auth_user.id). FK in 90_end (20260925-23).';
              COMMENT ON COLUMN config.credenziali.motivo_blocco IS
                  'Blocco dell''amministratore: perche''. Obbligatorio quando la credenziale e'' bloccata.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.credenziali;
