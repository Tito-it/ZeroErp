#
# Estende config.sorgenti.scope con il valore PUSH_CONTRATTO,
# richiesto dal dominio offerta_commerciale (push 1:1 a contratto DRAFT).
#
# Il CHECK chk_sorgenti_scope (migration 20260225-44) elencava solo:
#   PUSH_COMMESSA, PIPELINE_MARKER, ROW_VALIDATOR, POST_INVOICE, DIRECT_ENTRY
#
# OFFERTA_COMMERCIALE non e' PUSH_COMMESSA (non alimenta commesse direttamente)
# ma produce un contratto: PUSH_CONTRATTO e' la classificazione semanticamente
# corretta per sorgenti che generano un contratto DRAFT tramite push 1:1.
#
# Strategia: DROP + ADD CONSTRAINT (PostgreSQL non supporta ALTER CHECK inline).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260524-01-alter-sorgenti-scope-add-push-contratto-mctit.yaml

  - changeSet:
      id: 20260524-01-alter-sorgenti-scope-add-push-contratto
      author: mctit
      comment: >
        Estende chk_sorgenti_scope con PUSH_CONTRATTO per supportare
        config.sorgenti OFFERTA_COMMERCIALE (push 1:1 a vendite.contratti DRAFT).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: sorgenti
            - columnExists:
                schemaName: config
                tableName: sorgenti
                columnName: scope
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Rimozione vincolo esistente (DROP obbligatorio: PG non supporta ALTER CHECK).
              ALTER TABLE config.sorgenti
                  DROP CONSTRAINT chk_sorgenti_scope;

              -- Ricreazione con l'aggiunta di PUSH_CONTRATTO.
              -- PUSH_CONTRATTO: sorgente documento che genera un contratto DRAFT tramite
              --   push 1:1 (es. offerta_commerciale -> vendite.contratti).
              ALTER TABLE config.sorgenti
                  ADD CONSTRAINT chk_sorgenti_scope
                  CHECK (scope IN (
                      'PUSH_COMMESSA',
                      'PIPELINE_MARKER',
                      'ROW_VALIDATOR',
                      'POST_INVOICE',
                      'DIRECT_ENTRY',
                      'PUSH_CONTRATTO'
                  ));

              COMMENT ON COLUMN config.sorgenti.scope IS
                  'Classificazione funzionale della sorgente: '
                  'PUSH_COMMESSA   — documenti business che alimentano commesse (preventivo, contratto, ordine, ddt); '
                  'PIPELINE_MARKER — marcatori interni pipeline attivita'' fatturabili; '
                  'ROW_VALIDATOR   — validazione polimorfa riga (legacy); '
                  'POST_INVOICE    — riconciliazione post-fattura; '
                  'DIRECT_ENTRY   — inserimento diretto (futuro); '
                  'PUSH_CONTRATTO  — documenti che generano un contratto DRAFT tramite push 1:1 (offerta_commerciale).';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE config.sorgenti
                  DROP CONSTRAINT IF EXISTS chk_sorgenti_scope;

              ALTER TABLE config.sorgenti
                  ADD CONSTRAINT chk_sorgenti_scope
                  CHECK (scope IN (
                      'PUSH_COMMESSA',
                      'PIPELINE_MARKER',
                      'ROW_VALIDATOR',
                      'POST_INVOICE',
                      'DIRECT_ENTRY'
                  ));
