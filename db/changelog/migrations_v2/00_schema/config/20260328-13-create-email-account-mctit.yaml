# Liquibase changelog per Zero ERP
# Crea config.email_account — account SMTP per invio email.
# Ogni unita' organizzativa puo' avere il proprio account.
# Account con unita_organizzativa_id NULL = account di sistema
# (fallback).
# La password SMTP e' salvata crittografata (Fernet lato Django).
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-13-create-email-account-mctit.yaml

    - changeSet:
          id: 20260328-13-create-email-account
          author: mctit
          comment: >
              Account SMTP per invio email. Ogni reparto (unita' organizzativa) puo' avere
              il proprio account. Account con unita_organizzativa_id NULL = fallback di sistema.
              Password crittografata con Fernet (chiave derivata da Django SECRET_KEY).
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Tabella account SMTP
                        CREATE TABLE config.email_account (
                            id                      integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            codice                  character varying(50) NOT NULL,
                            descrizione             text NOT NULL,
                            unita_organizzativa_id  integer
                                REFERENCES config.unita_organizzative(id)
                                ON UPDATE NO ACTION ON DELETE NO ACTION,
                            smtp_host               character varying(255) NOT NULL,
                            smtp_port               integer NOT NULL DEFAULT 587,
                            smtp_use_tls            boolean NOT NULL DEFAULT true,
                            smtp_use_ssl            boolean NOT NULL DEFAULT false,
                            smtp_username           character varying(255) NOT NULL,
                            smtp_password_encrypted character varying(512) NOT NULL,
                            email_from              character varying(255) NOT NULL,
                            email_reply_to          character varying(255),
                            attivo                  boolean NOT NULL DEFAULT true,
                            meta                    jsonb NOT NULL DEFAULT '{}'::jsonb,
                            data_insert             timestamptz NOT NULL DEFAULT now(),
                            user_insert             text NOT NULL DEFAULT CURRENT_USER,
                            data_update             timestamptz NOT NULL DEFAULT now(),
                            user_update             text NOT NULL DEFAULT CURRENT_USER,

                            -- Vincoli
                            CONSTRAINT uq_email_account_codice UNIQUE (codice),
                            CONSTRAINT chk_email_account_smtp_port CHECK (smtp_port BETWEEN 1 AND 65535),
                            CONSTRAINT chk_email_account_tls_ssl_exclusive CHECK (NOT (smtp_use_tls AND smtp_use_ssl))
                        );

                        COMMENT ON TABLE config.email_account IS
                          'Account SMTP per invio email. Ogni reparto puo'' avere il proprio. NULL su unita_organizzativa_id = account di sistema/fallback.';
                        COMMENT ON COLUMN config.email_account.codice IS
                          'Codice univoco account (es. SISTEMA, ACQ_01).';
                        COMMENT ON COLUMN config.email_account.unita_organizzativa_id IS
                          'FK reparto proprietario. NULL = account di sistema/fallback.';
                        COMMENT ON COLUMN config.email_account.smtp_password_encrypted IS
                          'Password SMTP crittografata con Fernet. MAI salvare in chiaro.';
                        COMMENT ON COLUMN config.email_account.email_from IS
                          'Indirizzo mittente completo (es. ''Ufficio Acquisti <acquisti@azienda.it>'').';
                        COMMENT ON COLUMN config.email_account.smtp_use_ssl IS
                          'SSL diretto (porta 465). Mutuamente esclusivo con smtp_use_tls.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS config.email_account;
