# ------------------------------------------------------------
# config.parameter_overrides: UN AMBITO, UN OVERRIDE — anche quando l'ambito ha dei NULL
#   Brief: brief-db-codici-sfilati-e-lista-parametri §3 (R-2), decisione di Tid del 2026-10-07
#
# ── IL DIFETTO ───────────────────────────────────────────────────
#   uq_overrides_full_scope_v4 (20260515-06) dichiara «un solo override per
#   combinazione completa di ambito» sulle sei dimensioni + parameter_id. Ma e'
#   NULLS DISTINCT, il default di PostgreSQL: due NULL non sono uguali, quindi
#   il vincolo non scatta su nessuna riga che abbia ALMENO UNA dimensione NULL.
#   Un override ha per costruzione al piu' qualche dimensione valorizzata e le
#   altre NULL: il vincolo, in pratica, non vale MAI.
#   Il modello ammette quindi due override personali puri per lo stesso
#   parametro e lo stesso utente (due richieste concorrenti sull'upsert del
#   backend bastano, e qualunque scrittura che non passi dal backend). Effetti:
#   · script.fn_get_parameter_full sceglie fra i due con un LIMIT 1 senza
#     ORDER BY: il valore in vigore dipende dal piano, non dal modello;
#   · script.fn_list_parameters_for_user duplica la riga del parametro.
#
# ── COSA FA ──────────────────────────────────────────────────────
#   Sostituisce il vincolo con uno NULLS NOT DISTINCT sulle stesse colonne
#   (uq_overrides_full_scope_v5): due righe con lo stesso ambito, NULL compresi,
#   sono la stessa riga. `attivo` resta FUORI, come nel v4: una riga spenta
#   occupa il suo ambito, e chi vuole riaccenderlo aggiorna quella (lo fa gia'
#   l'upsert del backend, che riattiva la riga trovata).
#   Nome nuovo e non il v4 riscritto: il significato del vincolo cambia, e chi
#   legge v4 in un documento o in un test deve trovare un rosso, non lo stesso
#   nome con un comportamento diverso.
#
# ── IL CANCELLO ──────────────────────────────────────────────────
#   preCondition HALT su zero doppioni (expectedResult 0: un DB vuoto la
#   soddisfa, linee-guida-sql §11.4). Se ci sono, si sceglie a mano quale tenere
#   PRIMA del migrate: nessuna scelta automatica, perche' quale fosse «in
#   vigore» lo decideva il piano. Query per trovarli:
#     SELECT parameter_id, emittente_fiscale_id, django_user_id, django_group_id,
#            categoria_cliente_id, session_key, function_name,
#            array_agg(id ORDER BY id) AS ids
#       FROM config.parameter_overrides
#      GROUP BY 1, 2, 3, 4, 5, 6, 7
#     HAVING count(*) > 1;
#   Fatto datato (dbdev, 2026-10-07): 4 righe, zero doppioni.
#
# ── CHI NE RISENTE ───────────────────────────────────────────────
#   · pgTAP config/test-parameter-overrides-categoria-cliente-v1 (test 7-8 sul
#     nome del vincolo) e i test che scrivono override puri su parametri e
#     ambiti REALI: adeguati nello stesso giro (§7 del brief).
#   · Backend: nessun cambio obbligato. L'upsert CTE di parameter_repository
#     resta corretto; da qui in poi potrebbe anche usare ON CONFLICT ON
#     CONSTRAINT uq_overrides_full_scope_v5, che ora funziona (scelta del BE).
#     Una seconda richiesta concorrente oggi risponde 23505 invece di creare un
#     doppione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261007-70-alter-parameter-overrides-unique-nulls-not-distinct-mctit.yaml

  - changeSet:
      id: 20261007-70-alter-parameter-overrides-unique-nulls-not-distinct
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        uq_overrides_full_scope_v4 (NULLS DISTINCT, quindi inerte su ogni riga con una dimensione
        NULL) sostituito da uq_overrides_full_scope_v5 NULLS NOT DISTINCT sulle stesse colonne:
        un ambito, un override. Cancello HALT su zero doppioni. Brief:
        brief-db-codici-sfilati-e-lista-parametri §3.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            config.parameter_overrides ha override doppi sullo stesso ambito (NULL compresi):
            va scelto a mano quale tenere prima del vincolo NULLS NOT DISTINCT. Query
            nell'intestazione di questo changeSet.
        - and:
            - tableExists:
                schemaName: config
                tableName: parameter_overrides
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT count(*)
                    FROM (SELECT 1
                            FROM config.parameter_overrides po
                           GROUP BY po.parameter_id, po.emittente_fiscale_id, po.django_user_id,
                                    po.django_group_id, po.categoria_cliente_id, po.session_key,
                                    po.function_name
                          HAVING count(*) > 1) doppioni;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.parameter_overrides
                  DROP CONSTRAINT IF EXISTS uq_overrides_full_scope_v4;

              ALTER TABLE config.parameter_overrides
                  ADD CONSTRAINT uq_overrides_full_scope_v5
                  UNIQUE NULLS NOT DISTINCT (
                      parameter_id,
                      emittente_fiscale_id,
                      django_user_id,
                      django_group_id,
                      categoria_cliente_id,
                      session_key,
                      function_name
                  );

              COMMENT ON CONSTRAINT uq_overrides_full_scope_v5 ON config.parameter_overrides IS
                  'Un ambito, un override: parameter_id + le sei dimensioni, con NULL uguale a NULL (NULLS NOT DISTINCT). Il v4 era NULLS DISTINCT e non scattava su nessuna riga con una dimensione NULL, cioe'' mai: due override puri per lo stesso parametro e utente erano ammessi, e la cascata ne sceglieva uno a caso. attivo resta fuori: una riga spenta occupa il suo ambito. 20261007-70, brief-db-codici-sfilati-e-lista-parametri.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.parameter_overrides
                  DROP CONSTRAINT IF EXISTS uq_overrides_full_scope_v5;

              ALTER TABLE config.parameter_overrides
                  ADD CONSTRAINT uq_overrides_full_scope_v4
                  UNIQUE (
                      parameter_id,
                      emittente_fiscale_id,
                      django_user_id,
                      django_group_id,
                      categoria_cliente_id,
                      session_key,
                      function_name
                  );
