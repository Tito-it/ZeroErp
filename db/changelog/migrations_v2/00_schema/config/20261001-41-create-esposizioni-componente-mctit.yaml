# ------------------------------------------------------------
# E-1 — IL VOCABOLARIO «COME SI ESPONE UN COMPONENTE DI KIT IN FATTURA»
#   config.esposizioni_componente: NASCOSTO, DESCRITTIVO, VALORIZZATO
#   Brief: brief-db-esposizione-componenti-kit-in-fattura, sezioni 3 e 4.1
#
# -- IL BUCO ---------------------------------------------------
#   catalogo.articoli_componenti.esposto_in_fattura era un booleano, e la
#   vista di rappresentazione leggeva il `true` come «riga descrittiva, senza
#   importo». Chi compila la distinta e mette «esposto = si'» si aspetta di
#   vedere il PREZZO del componente: con due valori ce n'e' uno che si capisce
#   al contrario. I modi sono tre (decisione di Tid, 2026-10-01).
#
# -- PERCHE' UNA TABELLA E NON UN CHECK SU VARCHAR --------------
#   Il FE vuole una scelta fra tre con etichetta (etichetta_key, come
#   config.registri_giornale), la lista un valore decodificabile. Stessa forma
#   dei vocabolari di casa (config.modi_approvvigionamento).
#
# -- NIENTE `attivo`, E NON E' UNA DIMENTICANZA ----------------
#   I tre valori sono la SEMANTICA della rappresentazione: la vista
#   vendite.vw_fattura_righe_esposte li legge per codice_interno, uno per uno.
#   Spegnerne uno non e' una configurazione che il modello sappia onorare
#   (le righe di catalogo che lo usano resterebbero li'), e con `attivo` a
#   ci_apply nascerebbe la coppia ATTIVO anche sulla colonna SNAPSHOT di
#   vendite.fatture_righe, dove un require_attivo non ha senso (e' storia).
#   Un modo si ritira con un cantiere, non con un flag.
#
# -- LE FK PUNTANO A codice_interno ------------------------------
#   Il valore viaggia nel meta delle attivita' di commessa (chiave naturale,
#   linee-guida-sql 6b) e arriva su vendite.fatture_righe com'e': nessuna
#   risoluzione codice -> id in mezzo. Precedenti: regimi_fiscali,
#   causali_trasporto.causale_magazzino. Le FK nascono in 80_data dopo il
#   seed (20261001-57): qui il catalogo e' ancora vuoto.
#
# -- CHE COSA NASCE DA SOLO -------------------------------------
#   ⭐ Il lock su codice_interno e' IMPLICITO per la sola presenza della
#   colonna (dbops.fn_run_automations_lock_columns, linee-guida-sql 6b).
#   ⚠️ Tabella NUOVA: audit, tx_id, storico e il lock arrivano con
#   `--contexts=ci_apply`, non da qui (linee-guida-sql 11.5). Nessun GRANT:
#   le ALTER DEFAULT PRIVILEGES del loop di 90_end coprono tabella e sequence.
#
# -- CATALOGO, NON MACCHINA ------------------------------------
#   Nessuna FK verso anagrafiche.*: vale identico su ogni installazione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261001-41-create-esposizioni-componente-mctit.yaml

  - changeSet:
      id: 20261001-41-create-esposizioni-componente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE config.esposizioni_componente: come si espone in fattura un componente
        di kit (NASCOSTO, DESCRITTIVO, VALORIZZATO), al posto del booleano
        esposto_in_fattura. Niente attivo: i tre valori sono la semantica della vista di
        rappresentazione. Brief: brief-db-esposizione-componenti-kit-in-fattura (E-1).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: config
                tableName: esposizioni_componente
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.esposizioni_componente (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_esposizioni_componente PRIMARY KEY,
                  codice_interno  VARCHAR(40)  NOT NULL,
                  codice          VARCHAR(40)  NOT NULL,
                  descrizione     VARCHAR(255),
                  etichetta_key   VARCHAR(120) NOT NULL,
                  ordine          SMALLINT,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id           UUID,
                  CONSTRAINT uq_esposizioni_componente_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_esposizioni_componente_codice_interno
                      UNIQUE (codice_interno),
                  CONSTRAINT chk_esposizioni_componente_codice_interno_non_vuoto
                      CHECK (btrim(codice_interno) <> '')
              );

              COMMENT ON TABLE config.esposizioni_componente IS
                  'Come si espone in fattura un componente di kit. NASCOSTO: non compare, il suo '
                  'valore sta nel totale del kit. DESCRITTIVO: riga sotto il kit, senza prezzo ne'' '
                  'importo, il valore sta nel totale del kit. VALORIZZATO: riga sotto il kit con '
                  'quantita'', prezzo e importo suoi, FUORI dal totale del kit. Il componente resta '
                  'sempre legato al suo kit, anche valorizzato. Letto da '
                  'catalogo.articoli_componenti.esposizione_in_fattura (proprieta'' della distinta) e '
                  'congelato su vendite.fatture_righe.kit_esposizione; la regola la applica '
                  'vendite.vw_fattura_righe_esposte, e il totale del documento non cambia mai al '
                  'variare dell''esposizione. Niente attivo: i tre valori sono la semantica della '
                  'vista, non una configurazione. Brief: brief-db-esposizione-componenti-kit-in-fattura.';
              COMMENT ON COLUMN config.esposizioni_componente.codice_interno IS
                  'Chiave naturale stabile, immutabile via script.trgfn_lock_columns (provisionato '
                  'da ci_apply per la sola presenza della colonna). NASCOSTO | DESCRITTIVO | '
                  'VALORIZZATO. E'' la colonna puntata dalle FK e l''unico valore su cui la logica '
                  'confronta (linee-guida-sql 6c).';
              COMMENT ON COLUMN config.esposizioni_componente.etichetta_key IS
                  'Chiave i18n dell''etichetta a video (config.esposizioni_componente.<codice>): la '
                  'scelta fra tre nella distinta e il pannello componenti la traducono da qui.';
              COMMENT ON COLUMN config.esposizioni_componente.ordine IS
                  'Ordine di presentazione nella scelta del FE. Non ha semantica.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.esposizioni_componente;
