# R-7 — IL FRENO SULLA PROVENIENZA PER UN NOME INESISTENTE: config.nomi_tentati_provenienze
#   Brief: brief-db-blocco-login-per-credenziale, sezione 13
#
# ── ⭐ LA GEMELLA DI config.credenziali_provenienze ──────────────────
#   La coppia nome tentato + provenienza, con la stessa forma e le stesse
#   regole della coppia credenziale + provenienza: tentativi consecutivi, freno
#   alla soglia, riga che nasce al primo fallimento e scade (cleanup_at).
#   Il passo del freno e' uno solo per le due coppie: script.fn_login_freno_passo
#   (20260925-59).
#
# ── ⚠️ FORMA ────────────────────────────────────────────────────────
#   PK surrogata id e UNIQUE (nome_tentato_id, provenienza); l'UNIQUE copre la
#   FK (nome_tentato_id in testa): fk_index_policy consentito=false. La FK
#   cancella a cascata: quando scade il nome, scadono le sue coppie.
#   Niente storico, niente RLS, all'app solo SELECT: come la madre.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260925-56-create-nomi-tentati-provenienze-mctit.yaml

  - changeSet:
      id: 20260925-56-create-nomi-tentati-provenienze
      author: mctit
      failOnError: true
      comment: >
        Crea config.nomi_tentati_provenienze, il freno per coppia nome tentato + provenienza (IP),
        gemella di config.credenziali_provenienze per un nome che non e' una credenziale (R-7).
        Retention con cleanup_at. Brief: brief-db-blocco-login-per-credenziale §13.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: nomi_tentati }
            - not:
                - tableExists:
                    { schemaName: config, tableName: nomi_tentati_provenienze }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.nomi_tentati_provenienze (
                  id                    bigint      GENERATED BY DEFAULT AS IDENTITY,
                  nome_tentato_id       bigint      NOT NULL,
                  provenienza           inet        NOT NULL,
                  tentativi_falliti     integer     NOT NULL DEFAULT 0,
                  bloccato_fino_a       timestamptz,
                  ultimo_fallimento_at  timestamptz NOT NULL,
                  cleanup_at            timestamptz,
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text        NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_nomi_tentati_provenienze PRIMARY KEY (id),
                  CONSTRAINT uq_nomi_tentati_provenienze_nome_provenienza
                      UNIQUE (nome_tentato_id, provenienza),
                  CONSTRAINT fk_nomi_tentati_provenienze_nomi_tentati
                      FOREIGN KEY (nome_tentato_id) REFERENCES config.nomi_tentati (id)
                      ON DELETE CASCADE,
                  CONSTRAINT chk_nomi_tentati_provenienze_tentativi
                      CHECK (tentativi_falliti >= 0)
              );

              COMMENT ON TABLE config.nomi_tentati_provenienze IS
                  'Freno sulla coppia NOME TENTATO + PROVENIENZA per un nome che non e'' una credenziale (R-7, 2026-09-25): stessa soglia, stessa durata e stesso codice della coppia credenziale + provenienza (config.credenziali_provenienze), cosi'' la risposta del login non dice se il nome esiste. La riga nasce al primo fallimento e scade (cleanup_at). Scrivono solo le funzioni del login; all''app solo SELECT. Brief: brief-db-blocco-login-per-credenziale §13.';
              COMMENT ON COLUMN config.nomi_tentati_provenienze.provenienza IS
                  'L''indirizzo IP del chiamante, passato dal backend. Obbligatorio: NULL non e'' un valore di chiave.';
              COMMENT ON COLUMN config.nomi_tentati_provenienze.tentativi_falliti IS
                  'Fallimenti consecutivi su questo nome da questa provenienza. Alla soglia (login_max_tentativi_falliti) la coppia e'' frenata fino a bloccato_fino_a; un freno scaduto riparte da uno (script.fn_login_freno_passo).';
              COMMENT ON COLUMN config.nomi_tentati_provenienze.bloccato_fino_a IS
                  'Fine del freno sulla coppia (login_blocco_minuti). NULL = non frenata. Da questa provenienza il login risponde E_UTENTE_BLOCCATO fino a quell''ora, come per una credenziale.';
              COMMENT ON COLUMN config.nomi_tentati_provenienze.ultimo_fallimento_at IS
                  'Orario dell''ultimo fallimento da questa provenienza: la base della retention (cleanup_at).';
              COMMENT ON COLUMN config.nomi_tentati_provenienze.cleanup_at IS
                  'Scadenza della riga (framework cleanup_at): ultimo_fallimento_at + ttl della regola CLEANUP_AT. La scrive il trigger alla nascita e la ricalcola la registrazione di ogni fallimento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.nomi_tentati_provenienze;
