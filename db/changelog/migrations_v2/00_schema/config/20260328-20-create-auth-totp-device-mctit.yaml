# Liquibase changelog per Zero ERP
# Crea config.auth_totp_device — device TOTP per autenticazione
# a due fattori. Relazione 1:1 con auth_user.
# Secret crittografato con Fernet (chiave da Django SECRET_KEY).
# Recovery codes salvati come array di hash SHA-256.
# Anti-replay: ultimo codice usato salvato per evitare riutilizzo.
# Fase: 4 (2FA TOTP)
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-20-create-auth-totp-device-mctit.yaml

    - changeSet:
          id: 20260328-20-create-auth-totp-device
          author: mctit
          comment: >
              Device TOTP per 2FA. Relazione 1:1 con auth_user.
              Secret crittografato con Fernet. Recovery codes come array hash SHA-256.
              Anti-replay: ultimo codice usato per evitare riutilizzo nello stesso intervallo.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE config.auth_totp_device (
                            id                  bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            auth_user_id        integer NOT NULL,
                            secret_encrypted    character varying(512) NOT NULL,
                            abilitato           boolean NOT NULL DEFAULT false,
                            confermato          boolean NOT NULL DEFAULT false,
                            recovery_codes_hash jsonb NOT NULL DEFAULT '[]'::jsonb,
                            ultimo_codice_usato character varying(10),
                            ultimo_uso_at       timestamptz,
                            meta                jsonb NOT NULL DEFAULT '{}'::jsonb,
                            data_insert         timestamptz NOT NULL DEFAULT now(),
                            user_insert         text NOT NULL DEFAULT CURRENT_USER,
                            data_update         timestamptz NOT NULL DEFAULT now(),
                            user_update         text NOT NULL DEFAULT CURRENT_USER,

                            -- 1:1 con auth_user
                            CONSTRAINT uq_auth_totp_device_auth_user UNIQUE (auth_user_id)
                        );

                        COMMENT ON TABLE config.auth_totp_device IS
                          'Device TOTP per autenticazione a due fattori. 1:1 con auth_user.';
                        COMMENT ON COLUMN config.auth_totp_device.auth_user_id IS
                          'FK auth_user. Un solo device TOTP per utente (UNIQUE).';
                        COMMENT ON COLUMN config.auth_totp_device.secret_encrypted IS
                          'Secret TOTP crittografato con Fernet. MAI salvare in chiaro.';
                        COMMENT ON COLUMN config.auth_totp_device.abilitato IS
                          'Device abilitato per il login 2FA.';
                        COMMENT ON COLUMN config.auth_totp_device.confermato IS
                          'true solo dopo prima verifica riuscita durante il setup.';
                        COMMENT ON COLUMN config.auth_totp_device.recovery_codes_hash IS
                          'Array JSON di hash SHA-256 dei recovery codes monouso.';
                        COMMENT ON COLUMN config.auth_totp_device.ultimo_codice_usato IS
                          'Anti-replay: ultimo codice TOTP verificato con successo.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS config.auth_totp_device;
