# IL RUOLO DICE QUALE TABELLA LO FA ESISTERE
#   config.tipi_ruoli.entita_esistenza text NULL, forma `schema.tabella`.
#   Brief: brief-db-codici-non-trovato-email-e-permessi (R-6, Q-1 di Tid del 2026-10-09)
#
# -- PERCHE' UNA COLONNA NUOVA E NON entita_tabella ------------------
#   entita_tabella dice DOVE SI CERCA IL CODICE dell'entita' (per CL e' la
#   vista vw_clienti_codice_ba, scelta per il codice del billing account).
#   La ricerca universale ha bisogno di un'altra risposta: quale tabella fa
#   ESISTERE il soggetto-ruolo per chi guarda (un CL senza clienti, un FO
#   senza la riga in fornitori non si mostrano). Con una colonna sola, chi
#   cambia la vista della ricerca per codice cambierebbe senza saperlo anche
#   chi si vede. Q-1 (Tid): due colonne, un compito ciascuna.
#
# -- PERCHE' SOLO TABELLE ---------------------------------------------
#   Il perimetro (per CL quello dell'emittente) lo fa la RLS della tabella.
#   Una vista senza security_invoker lo spegnerebbe senza errori: ammettendo
#   solo tabelle il caso non puo' nascere. Lo verifica il guard
#   config.trgfn_tipi_ruoli_guard_entita_ref (20261010-09) in scrittura, e il
#   pgTAP script/test-search-regola-unica-visibile-v1 sul catalogo vivo (una
#   tabella cancellata dopo non passa da nessun guard).
#
# -- PERCHE' text E NON regclass --------------------------------------
#   regclass salva l'OID: dopo una RENAME stampa il nome nuovo in silenzio,
#   dopo una DROP stampa il numero dell'OID morto, e nel CSV di seed un OID
#   dipende dalla macchina. text + CHECK di forma, come entita_tabella.
#
# -- IL VALORE ---------------------------------------------------------
#   Dal CSV di seed (80_data/sql/config/tipi_ruoli.csv, mirror 20250812-02):
#   CL -> anagrafiche.clienti, FO -> anagrafiche.fornitori, VT ->
#   anagrafiche.vettori, BANK_B -> anagrafiche.bank_branches, EF ->
#   anagrafiche.emittenti_fiscali; vuota per i ruoli senza entita' (il
#   soggetto-ruolo si mostra se esiste).
#
# -- CHI LA LEGGE ----------------------------------------------------
#   script.fn_predicato_soggetto_ruolo_visibile (20261010-10), la regola unica
#   di lista e dettaglio della ricerca universale.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261010-08-alter-tipi-ruoli-add-entita-esistenza-mctit.yaml

  - changeSet:
      id: 20261010-08-alter-tipi-ruoli-add-entita-esistenza
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.tipi_ruoli.entita_esistenza: la tabella (mai una vista) le cui righe fanno esistere
        il soggetto-ruolo nella ricerca universale. entita_tabella resta alla sola ricerca del
        codice. Valore dal CSV di seed. Brief: brief-db-codici-non-trovato-email-e-permessi (R-6,
        Q-1).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_ruoli
            - not:
                - columnExists:
                    schemaName: config
                    tableName: tipi_ruoli
                    columnName: entita_esistenza
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.tipi_ruoli
                  ADD COLUMN entita_esistenza text NULL,
                  ADD CONSTRAINT chk_tipi_ruoli_entita_esistenza_forma
                      CHECK (entita_esistenza ~ '^[a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*$');

              COMMENT ON COLUMN config.tipi_ruoli.entita_esistenza IS
                  'La TABELLA le cui righe fanno esistere il soggetto-ruolo nella ricerca universale: '
                  'un soggetto-ruolo si mostra se ha almeno una riga di questa tabella che chi guarda '
                  'vede (il perimetro lo fa la RLS della tabella, quando ce l''ha: per CL quella di '
                  'anagrafiche.clienti). NULL: il ruolo non ha un''entita'' propria, il soggetto-ruolo '
                  'si mostra se esiste. Solo tabelle, mai viste (guard trgfn_tipi_ruoli_guard_entita_ref): '
                  'una vista senza security_invoker spegnerebbe la RLS in silenzio. Forma schema.tabella '
                  '(CHECK), text e non regclass: un OID non segue una DROP e nel seed dipende dalla '
                  'macchina. Lo stato dell''entita'' (cliente chiuso, fornitore disattivato) NON conta: '
                  'il rapporto finito si deve ritrovare. Lettore: script.fn_predicato_soggetto_ruolo_visibile. '
                  '⚠️ Non e'' entita_tabella, che dice dove si cerca il codice. Brief: '
                  'brief-db-codici-non-trovato-email-e-permessi (R-6, Q-1 e Q-3 di Tid del 2026-10-09).';

              COMMENT ON COLUMN config.tipi_ruoli.entita_tabella IS
                  'Riferimento schema.tabella (o vista) su cui la ricerca universale cerca il CODICE '
                  'dell''entita'' del ruolo (colonna entita_colonna_codice, default codice). Deve avere la '
                  'colonna soggetto_ruolo_id. NULL = nessuna ricerca per codice entita''. Serve solo a '
                  'quello: quale tabella fa '
                  'esistere il soggetto-ruolo lo dice entita_esistenza (dal 2026-10-10, '
                  'brief-db-codici-non-trovato-email-e-permessi R-6). Guard: trgfn_tipi_ruoli_guard_entita_ref.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.tipi_ruoli DROP COLUMN IF EXISTS entita_esistenza;
