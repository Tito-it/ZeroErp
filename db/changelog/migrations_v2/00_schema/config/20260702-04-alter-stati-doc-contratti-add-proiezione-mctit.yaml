# Proiezione stato di dominio — D1 su CONTRATTO (roll-out offerte/ordini/contratti).
# (brief-db-proiezione-stato-dominio-rollout-offerte-ordini-contratti §2/§7;
#  playbook identico all'increment PREVENTIVI 20260701-14, decisioni A-E)
#
# Il dominio DICHIARA LA MAPPA di normalizzazione del proprio ciclo di vita; il
# motore pratiche consuma fase/esito/terminale senza mai nominare uno stato di
# dominio. Colonne aggiunte a config.stati_doc_contratti:
#   fase      varchar NOT NULL  — APERTO | IN_CORSO | IN_ATTESA | CHIUSO (CHECK)
#   esito     varchar NULL      — FK config.esiti_flussi_pratiche(codice_interno);
#                                 NULL = nessun verdetto (guard 20260702-05)
#   terminale boolean NOT NULL  — CHECK terminale => fase='CHIUSO'
#
# MAPPA (vocabolario universale — copre il 100% del seed reale stati_doc_contratti.csv):
#   DRAFT     -> APERTO     NULL      false
#   ATTIVO    -> IN_CORSO   NULL      false
#   CESSATO   -> CHIUSO     POSITIVO  true
#   ANNULLATO -> CHIUSO     NEGATIVO  true    (is_abortito=true)
#
# is_abortito NON si tocca (decisione E): `terminale` e' l'asse uniforme,
# is_abortito conserva la semantica di abbandono-revisione. Coesistono
# (ANNULLATO e' insieme terminale e is_abortito; CESSATO e' terminale ma NON
# is_abortito -> proprio la ragione per cui serve un asse `terminale` a parte).
#
# SEED (playbook is_abortito / increment PREVENTIVI):
#   - DB vivo: backfill UPDATE keyed su codice_interno; poi SET NOT NULL su fase.
#   - Fresh DB: tabella vuota qui -> backfill no-op; NOT NULL soddisfatto dalla
#     CSV stati_doc_contratti.csv estesa con fase/terminale. `esito` via UPDATE
#     80_data 20260702-12 (nullValue:"" non esprime NULL).
#
# ORDINE: richiede config.esiti_flussi_pratiche.is_verdetto (20260701-13).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260702-04-alter-stati-doc-contratti-add-proiezione-mctit.yaml

  - changeSet:
      id: 20260702-04-alter-stati-doc-contratti-add-proiezione
      author: mctit
      comment: >
        D1 proiezione stato dominio su config.stati_doc_contratti: aggiunge fase
        (NOT NULL, CHECK 4 valori), esito (FK esiti_flussi_pratiche, NULL
        ammesso), terminale (NOT NULL DEFAULT false, CHECK terminale=>CHIUSO) e
        seeda la mappa per i 4 stati. is_abortito invariato (decisione E).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: stati_doc_contratti
            - tableExists:
                schemaName: config
                tableName: esiti_flussi_pratiche
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.stati_doc_contratti
                ADD COLUMN fase      VARCHAR(20),
                ADD COLUMN esito     VARCHAR(50),
                ADD COLUMN terminale BOOLEAN NOT NULL DEFAULT false;

              -- Backfill della mappa dichiarata dal dominio (DB vivo; no-op su
              -- fresh DB). Keyed su codice_interno, mai su id.
              UPDATE config.stati_doc_contratti s
                 SET fase      = m.fase,
                     esito     = m.esito,
                     terminale = m.terminale
                FROM (VALUES
                        ('DRAFT',     'APERTO',   NULL::varchar, false),
                        ('ATTIVO',    'IN_CORSO', NULL::varchar, false),
                        ('CESSATO',   'CHIUSO',   'POSITIVO',    true),
                        ('ANNULLATO', 'CHIUSO',   'NEGATIVO',    true)
                     ) AS m(codice_interno, fase, esito, terminale)
               WHERE s.codice_interno = m.codice_interno;

              -- Fail-fast voluto: uno stato non mappato blocca qui la migration.
              ALTER TABLE config.stati_doc_contratti
                ALTER COLUMN fase SET NOT NULL;

              ALTER TABLE config.stati_doc_contratti
                ADD CONSTRAINT chk_stati_doc_contratti_fase
                CHECK (fase IN ('APERTO', 'IN_CORSO', 'IN_ATTESA', 'CHIUSO'));

              ALTER TABLE config.stati_doc_contratti
                ADD CONSTRAINT chk_stati_doc_contratti_terminale_chiuso
                CHECK (NOT terminale OR fase = 'CHIUSO');

              ALTER TABLE config.stati_doc_contratti
                ADD CONSTRAINT fk_stati_doc_contratti_esito
                FOREIGN KEY (esito)
                REFERENCES config.esiti_flussi_pratiche (codice_interno);

              COMMENT ON COLUMN config.stati_doc_contratti.fase IS
                  'Proiezione normalizzata per il motore pratiche (D1, brief-db-proiezione-'
                  'stato-dominio): APERTO | IN_CORSO | IN_ATTESA | CHIUSO. Il motore ragiona '
                  'su questa, mai sui codici di dominio. Dichiarata dal dominio vendite.';
              COMMENT ON COLUMN config.stati_doc_contratti.esito IS
                  'Verdetto proiettato dello stato (config.esiti_flussi_pratiche.codice_interno '
                  'con is_verdetto=true; guard trgfn_stati_doc_guard_esito_verdetto). NULL = '
                  'nessun verdetto. Base della futura fase GUIDA (avanza-su-esito-proiettato).';
              COMMENT ON COLUMN config.stati_doc_contratti.terminale IS
                  'true = il documento in questo stato non evolvera'' piu'' (CHECK: implica '
                  'fase=CHIUSO). Asse uniforme cross-dominio; NON sostituisce is_abortito '
                  '(semantica diversa: abbandono della revisione). CESSATO e'' terminale ma '
                  'non is_abortito.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.stati_doc_contratti
                DROP CONSTRAINT IF EXISTS fk_stati_doc_contratti_esito,
                DROP CONSTRAINT IF EXISTS chk_stati_doc_contratti_terminale_chiuso,
                DROP CONSTRAINT IF EXISTS chk_stati_doc_contratti_fase;
              ALTER TABLE config.stati_doc_contratti
                DROP COLUMN IF EXISTS terminale,
                DROP COLUMN IF EXISTS esito,
                DROP COLUMN IF EXISTS fase;
