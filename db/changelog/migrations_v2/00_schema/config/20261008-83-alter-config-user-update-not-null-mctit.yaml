# CHI HA TOCCATO PER ULTIMO UNA RIGA SI SA SEMPRE — schema config
#   user_update SET NOT NULL su 21 tabelle:
#     config.aspetti_beni
#     config.assets_ownership
#     config.causali_trasporto
#     config.forme_giuridiche
#     config.forme_giuridiche_tipi_soggetto_dettaglio
#     config.iva_natura
#     config.lingue
#     config.nature_vendita
#     config.sistema_codici
#     config.sorgenti
#     config.stati_assets
#     config.stati_doc_contratti
#     config.stati_doc_ddt
#     config.stati_doc_offerte
#     config.stati_doc_preventivi
#     config.stradario
#     config.tipi_evento_assets
#     config.tipi_soggetto
#     config.tipi_soggetto_dettaglio
#     config.tipi_ubicazione
#     config.valute
#   Brief: brief-db-righe-e-componenti-debiti-residui (§2, D-2 di Tid)
#
# -- PERCHE' --------------------------------------------------------
#   linee-guida-sql §7: le colonne di audit sono NOT NULL. Il 20261008-31
#   ha chiuso righe e componenti dei documenti di vendita; qui il resto,
#   uno schema per changeSet (D-2 di Tid, 2026-10-08: un giro solo, col
#   presidio dbops/test-user-update-not-null-v1).
#
# -- CHE COSA CAMBIA PER CHI SCRIVE -------------------------------------
#   Niente. Ognuna ha script.trgfn_audit_data_user_generic (BEFORE INSERT
#   OR UPDATE), che scrive user_update a ogni scrittura da app.jwt_user o
#   CURRENT_USER: il vincolo dice nel DDL cio' che il trigger gia' fa.
#   ⚠️ Il trigger lo generano le automazioni (ci_apply, o il job notturno):
#   su un database da zero, alla prima passata, i seed di 80_data entrano
#   PRIMA che esista. Per questo dove manca si mette anche il DEFAULT
#   CURRENT_USER di §7 — senza, il seed scriverebbe NULL. Un seed con la
#   cella vuota non e' un rischio: i loader con nullValue "" scrivono ''
#   sulle colonne STRING (misurato su magazzino.causali.user_insert).
#   DEFAULT aggiunto: config.forme_giuridiche, config.forme_giuridiche_tipi_soggetto_dettaglio, config.iva_natura, config.tipi_soggetto, config.tipi_soggetto_dettaglio.
#
# -- LE RIGHE GIA' SCRITTE -----------------------------------------
#   La preCondition pretende zero NULL (expectedResult 0: un DB da zero la
#   soddisfa, linee-guida-sql §11.4), come il 20261008-31. Se ce ne sono il
#   migrate si ferma e si guardano a mano: nessun valore scelto dal migrate.
#   Fatto datato (2026-10-08, dev): zero NULL su tutte.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261008-83-alter-config-user-update-not-null-mctit.yaml

  - changeSet:
      id: 20261008-83-alter-config-user-update-not-null
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        user_update NOT NULL sullo schema config (21 tabelle, DEFAULT CURRENT_USER dove mancava),
        come vuole linee-guida-sql §7. Brief: brief-db-righe-e-componenti-debiti-residui (§2, D-2).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT (SELECT count(*) FROM config.aspetti_beni                             WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.assets_ownership                         WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.causali_trasporto                        WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.forme_giuridiche                         WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.forme_giuridiche_tipi_soggetto_dettaglio WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.iva_natura                               WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.lingue                                   WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.nature_vendita                           WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.sistema_codici                           WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.sorgenti                                 WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.stati_assets                             WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.stati_doc_contratti                      WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.stati_doc_ddt                            WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.stati_doc_offerte                        WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.stati_doc_preventivi                     WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.stradario                                WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.tipi_evento_assets                       WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.tipi_soggetto                            WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.tipi_soggetto_dettaglio                  WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.tipi_ubicazione                          WHERE user_update IS NULL)
                   + (SELECT count(*) FROM config.valute                                   WHERE user_update IS NULL);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.forme_giuridiche                         ALTER COLUMN user_update SET DEFAULT CURRENT_USER;
              ALTER TABLE config.forme_giuridiche_tipi_soggetto_dettaglio ALTER COLUMN user_update SET DEFAULT CURRENT_USER;
              ALTER TABLE config.iva_natura                               ALTER COLUMN user_update SET DEFAULT CURRENT_USER;
              ALTER TABLE config.tipi_soggetto                            ALTER COLUMN user_update SET DEFAULT CURRENT_USER;
              ALTER TABLE config.tipi_soggetto_dettaglio                  ALTER COLUMN user_update SET DEFAULT CURRENT_USER;
              ALTER TABLE config.aspetti_beni                             ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.assets_ownership                         ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.causali_trasporto                        ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.forme_giuridiche                         ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.forme_giuridiche_tipi_soggetto_dettaglio ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.iva_natura                               ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.lingue                                   ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.nature_vendita                           ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.sistema_codici                           ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.sorgenti                                 ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.stati_assets                             ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.stati_doc_contratti                      ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.stati_doc_ddt                            ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.stati_doc_offerte                        ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.stati_doc_preventivi                     ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.stradario                                ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.tipi_evento_assets                       ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.tipi_soggetto                            ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.tipi_soggetto_dettaglio                  ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.tipi_ubicazione                          ALTER COLUMN user_update SET NOT NULL;
              ALTER TABLE config.valute                                   ALTER COLUMN user_update SET NOT NULL;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.valute                                   ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.tipi_ubicazione                          ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.tipi_soggetto_dettaglio                  ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.tipi_soggetto                            ALTER COLUMN user_update DROP NOT NULL;
