              ALTER TABLE config.stradario                                ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.stati_doc_preventivi                     ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.stati_doc_offerte                        ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.stati_doc_ddt                            ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.stati_doc_contratti                      ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.stati_assets                             ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.sorgenti                                 ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.sistema_codici                           ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.nature_vendita                           ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.lingue                                   ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.iva_natura                               ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.forme_giuridiche_tipi_soggetto_dettaglio ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.forme_giuridiche                         ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.causali_trasporto                        ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.assets_ownership                         ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.aspetti_beni                             ALTER COLUMN user_update DROP NOT NULL;
              ALTER TABLE config.tipi_soggetto_dettaglio                  ALTER COLUMN user_update DROP DEFAULT;
              ALTER TABLE config.tipi_soggetto                            ALTER COLUMN user_update DROP DEFAULT;
              ALTER TABLE config.iva_natura                               ALTER COLUMN user_update DROP DEFAULT;
              ALTER TABLE config.forme_giuridiche_tipi_soggetto_dettaglio ALTER COLUMN user_update DROP DEFAULT;
