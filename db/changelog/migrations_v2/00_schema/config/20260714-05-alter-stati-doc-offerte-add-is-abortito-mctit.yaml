# ------------------------------------------------------------
# Lineage documenti vendite — Step 1 (Fondamenta). config.stati_doc_offerte ha
# gia' la colonna fase (proiezione 20260702-02); manca solo is_abortito. Vedi
# 20260714-04 (ordini) per il razionale (asse "abortito" uniforme + frontiera).
#
# Solo lo stato ANNULLATA e' abortito (RIFIUTATA/SUPERATA sono chiusure negative
# ma NON annullamenti, is_abortito=false).
#
# SEED: backfill keyed su codice_interno; fresh DB dalla CSV estesa (80_data).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260714-05-alter-stati-doc-offerte-add-is-abortito-mctit.yaml

  - changeSet:
      id: 20260714-05-alter-stati-doc-offerte-add-is-abortito
      author: mctit
      comment: >
        Lineage Step 1: aggiunge is_abortito (NOT NULL DEFAULT false) a
        config.stati_doc_offerte e marca ANNULLATA come abortita.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_offerte
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.stati_doc_offerte
                ADD COLUMN is_abortito BOOLEAN NOT NULL DEFAULT false;

              UPDATE config.stati_doc_offerte
                 SET is_abortito = true
               WHERE codice_interno = 'ANNULLATA';

              COMMENT ON COLUMN config.stati_doc_offerte.is_abortito IS
                  'true = stato di annullamento (ANNULLATA). Asse uniforme cross-catalogo '
                  'per la frontiera del lineage (esclude fase=CHIUSO oppure is_abortito=true).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.stati_doc_offerte
                DROP COLUMN IF EXISTS is_abortito;
