# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: config.utilities_tipi_ruolo.
# valido_dal nullable → validita nullable.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260412-21-alter-utilities-tipi-ruolo-add-validita-mctit.yaml

  - changeSet:
      id: 20260412-21-alter-utilities-tipi-ruolo-add-validita
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Migrazione daterange per config.utilities_tipi_ruolo.
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              {
                schemaName: config,
                tableName: utilities_tipi_ruolo,
                columnName: validita,
              }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.utilities_tipi_ruolo
                ADD COLUMN validita daterange;

              COMMENT ON COLUMN config.utilities_tipi_ruolo.validita
                IS 'Range di validita` calcolato dal trigger sync da valido_dal/valido_al. Non scrivere direttamente.';

              DROP TRIGGER IF EXISTS trg_utilities_tipi_ruolo_a20_set_validita_ins_upd ON config.utilities_tipi_ruolo;
              CREATE TRIGGER trg_utilities_tipi_ruolo_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON config.utilities_tipi_ruolo
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();

              UPDATE config.utilities_tipi_ruolo
                 SET validita = daterange(
                     COALESCE(valido_dal, '-infinity'::date),
                     COALESCE(valido_al, 'infinity'::date),
                     '[]')
               WHERE validita IS NULL;

              ALTER TABLE config.utilities_tipi_ruolo
                ALTER COLUMN validita SET NOT NULL;

      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_utilities_tipi_ruolo_a20_set_validita_ins_upd ON config.utilities_tipi_ruolo;
              ALTER TABLE config.utilities_tipi_ruolo DROP COLUMN IF EXISTS validita;
