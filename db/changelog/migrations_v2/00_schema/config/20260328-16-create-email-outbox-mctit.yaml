# Liquibase changelog per Zero ERP
# Crea config.email_outbox — bozze email editabili prima
# dell'invio. Flusso: template -> bozza DRAFT -> anteprima
# e modifica -> SENT o CANCELLED.
# Ambito visibilita' (SISTEMA/REPARTO/OPERATORE) e
# collegamento opzionale a pratica.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-16-create-email-outbox-mctit.yaml

    - changeSet:
          id: 20260328-16-create-email-outbox
          author: mctit
          comment: >
              Bozze email editabili dall'operatore prima dell'invio.
              Stato DRAFT->READY->SENT (o CANCELLED).
              Ambito visibilita': SISTEMA, REPARTO, OPERATORE.
              Collegamento opzionale a pratica per storico comunicativo.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE config.email_outbox (
                            id                      bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            email_account_id        integer
                                REFERENCES config.email_account(id)
                                ON DELETE NO ACTION,
                            email_template_id       integer
                                REFERENCES config.email_template(id)
                                ON DELETE NO ACTION,
                            ambito                  character varying(20) NOT NULL DEFAULT 'SISTEMA',
                            unita_organizzativa_id  integer
                                REFERENCES config.unita_organizzative(id)
                                ON DELETE NO ACTION,
                            pratica_id              bigint
                                REFERENCES pratiche.pratiche(id)
                                ON DELETE NO ACTION,
                            destinatario            character varying(255) NOT NULL,
                            destinatari_cc          text[],
                            oggetto                 text NOT NULL,
                            corpo_html              text NOT NULL,
                            corpo_testo             text,
                            stato                   character varying(20) NOT NULL DEFAULT 'DRAFT',
                            contesto_json           jsonb NOT NULL DEFAULT '{}'::jsonb,
                            auth_user_id            integer,
                            creato_da_user_id       integer,
                            inviato_at              timestamptz,
                            email_log_id            bigint,
                            tx_id                   uuid,
                            meta                    jsonb NOT NULL DEFAULT '{}'::jsonb,
                            data_insert             timestamptz NOT NULL DEFAULT now(),
                            user_insert             text NOT NULL DEFAULT CURRENT_USER,
                            data_update             timestamptz NOT NULL DEFAULT now(),
                            user_update             text NOT NULL DEFAULT CURRENT_USER,

                            -- Vincoli CHECK
                            CONSTRAINT chk_email_outbox_stato CHECK (stato IN ('DRAFT', 'READY', 'SENT', 'CANCELLED')),
                            CONSTRAINT chk_email_outbox_ambito CHECK (ambito IN ('SISTEMA', 'REPARTO', 'OPERATORE')),
                            CONSTRAINT chk_email_outbox_reparto_uo CHECK (
                                ambito <> 'REPARTO' OR unita_organizzativa_id IS NOT NULL
                            )
                        );

                        -- FK circolare con email_log (outbox -> log dopo invio)
                        ALTER TABLE config.email_outbox
                          ADD CONSTRAINT fk_email_outbox_email_log
                          FOREIGN KEY (email_log_id) REFERENCES config.email_log(id)
                          ON DELETE SET NULL;

                        -- FK inversa: email_log -> outbox (bozza di origine)
                        ALTER TABLE config.email_log
                          ADD CONSTRAINT fk_email_log_outbox
                          FOREIGN KEY (email_outbox_id) REFERENCES config.email_outbox(id)
                          ON DELETE SET NULL;

                        -- Indici per query frequenti
                        CREATE INDEX ix_email_outbox_stato_creato_da ON config.email_outbox(stato, creato_da_user_id);
                        CREATE INDEX ix_email_outbox_pratica_id ON config.email_outbox(pratica_id);
                        CREATE INDEX ix_email_outbox_ambito_uo ON config.email_outbox(ambito, unita_organizzativa_id);

                        COMMENT ON TABLE config.email_outbox IS
                          'Bozze email editabili. Flusso: template -> DRAFT -> anteprima/modifica -> SENT o CANCELLED.';
                        COMMENT ON COLUMN config.email_outbox.ambito IS
                          'Ambito visibilita'': SISTEMA (solo admin), REPARTO (operatori UO), OPERATORE (solo creatore).';
                        COMMENT ON COLUMN config.email_outbox.pratica_id IS
                          'Pratica collegata. Se presente, la email e'' visibile dalla scheda pratica.';
                        COMMENT ON COLUMN config.email_outbox.email_log_id IS
                          'FK al record email_log creato dopo l''invio effettivo.';
                        COMMENT ON COLUMN config.email_outbox.contesto_json IS
                          'Variabili usate per il rendering iniziale dal template.';

          rollback:
              - sql:
                    sql: |
                        ALTER TABLE config.email_log DROP CONSTRAINT IF EXISTS fk_email_log_outbox;
                        DROP TABLE IF EXISTS config.email_outbox;
