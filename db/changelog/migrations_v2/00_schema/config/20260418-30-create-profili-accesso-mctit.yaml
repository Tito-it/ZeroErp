databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20260418-30-create-profili-accesso-mctit.yaml

  - changeSet:
      id: 20260418-30-create-profili-accesso
      author: mctit
      comment: >
        Crea la nuova tabella header config.profili_accesso (§4.3.1 WIP
        multi-face-auth). Rimpiazza concettualmente il ruolo di
        config.profili_reparto_aree come "header profilo" e viene associata
        a reparti (tipo REPARTO), ruoli applicativi di portale (tipo
        PORTALE) o singole identita digitali (tipo AD_HOC) tramite la
        tabella config.profili_accesso_bindings. Le tabelle legacy
        profili_reparto_aree/azioni restano in uso fino al cutover di
        fn_resolve_livello_* (§4.8). I trigger framework (audit, tx_id,
        storico) sono applicati via automation.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_type t
                  JOIN pg_namespace n ON n.oid = t.typnamespace
                 WHERE n.nspname = 'config'
                   AND t.typname = 'tipo_profilo_accesso';
      changes:
        - createTable:
            schemaName: config
            tableName: profili_accesso
            remarks: >-
              Header di un profilo di accesso. Classifica un set di capability
              (aree + azioni) che puo' essere assegnato a un reparto, a un
              ruolo applicativo di portale o a una singola identita digitale
              tramite config.profili_accesso_bindings.
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_profili_accesso
                    nullable: false
              - column:
                  name: tipo
                  type: "config.tipo_profilo_accesso"
                  remarks: "REPARTO / PORTALE / AD_HOC. Determina che tipo di binding e' ammesso."
                  constraints:
                    nullable: false
              - column:
                  name: codice
                  type: "varchar(100)"
                  remarks: "Codice univoco del profilo (es. REPARTO_AMM, CLIENTE_PORTALE_STANDARD, AD_HOC_UTENTE_42)."
                  constraints:
                    nullable: false
              - column:
                  name: descrizione
                  type: text
                  remarks: "Descrizione human-readable del profilo."
                  constraints:
                    nullable: false
              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se false, il profilo non e' piu' applicato nelle risoluzioni di permesso."
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Payload estensibile (note operative, flag specifici)."
                  constraints:
                    nullable: false
              - column:
                  name: storicizza
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Flag per trigger storico (automation)."
                  constraints:
                    nullable: false
              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction id (automation)."
              - column:
                  name: data_insert
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  remarks: "Audit (automation)."
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit (automation)."
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: "timestamp with time zone"
                  defaultValueComputed: "now()"
                  remarks: "Audit (automation)."
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit (automation)."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: profili_accesso
            columnNames: codice
            constraintName: uq_profili_accesso_codice

        - sql:
            sql: |
              COMMENT ON TABLE config.profili_accesso IS
                  'Header di un profilo di accesso (§4.3 WIP multi-face-auth). '
                  'Raggruppa le capability per area (profili_accesso_aree) e '
                  'per azione (profili_accesso_azioni). Assegnato a reparti, '
                  'ruoli applicativi o identita tramite profili_accesso_bindings.';
      rollback:
        - dropTable:
            schemaName: config
            tableName: profili_accesso
