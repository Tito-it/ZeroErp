# Liquibase changelog per Zero ERP
# Tabella config.priorita_pratiche — livelli di priorita' con ordinamento
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260303-04-create-priorita-pratiche-mctit.yaml

  - changeSet:
      id: 20260303-04-create-priorita-pratiche
      author: mctit
      comment: >
        Livelli di priorita' per le pratiche con campo sequenza per ordinamento.
        Valori previsti: BASSA(10), NORMALE(20), ALTA(30), URGENTE(40).
      changes:
        - createTable:
            schemaName: config
            tableName: priorita_pratiche
            remarks: "Livelli di priorita' delle pratiche con ordinamento."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_priorita_pratiche
                    nullable: false

              - column:
                  name: codice
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: sequenza
                  type: integer
                  remarks: "Ordine di priorita' crescente (10=bassa, 40=urgente)."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: priorita_pratiche
            columnNames: codice
            constraintName: uq_priorita_pratiche_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: priorita_pratiche
            columnNames: codice_interno
            constraintName: uq_priorita_pratiche_codice_interno

      rollback:
        - dropTable:
            schemaName: config
            tableName: priorita_pratiche
