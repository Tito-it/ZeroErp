# Liquibase changelog per Zero ERP
# Crea tabella config.qualifiche
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20260107-16-create-qualifiche-mctit.yaml

  - changeSet:
      id: 20260107-16-create-qualifiche
      author: mctit
      comment: >
        Crea la tabella config.qualifiche per gestire le mansioni/posizioni
        con audit e campo meta.
      changes:
        - createTable:
            schemaName: config
            tableName: qualifiche
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "Identificativo univoco interno (PK)."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_qualifiche
                    nullable: false
              - column:
                  name: codice
                  type: character varying(50)
                  constraints:
                    nullable: false
              - column:
                  name: codice_interno
                  type: character varying(50)
                  constraints:
                    nullable: false
              - column:
                  name: descrizione
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: data_insert
                  type: timestamptz
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamptz
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: qualifiche
            columnNames: codice
            constraintName: uq_qualifiche_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: qualifiche
            columnNames: codice_interno
            constraintName: uq_qualifiche_codice_interno
