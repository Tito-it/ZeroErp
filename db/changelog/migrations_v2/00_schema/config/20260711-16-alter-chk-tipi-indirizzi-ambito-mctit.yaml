# config.tipi_indirizzi_allowed.chk_tipi_indirizzi_ambito:
#   - corregge il typo storico 'PREVENTVI' -> 'PREVENTIVI' (la tabella
#     non e' mai stata seedata, quindi il bug era latente: un seed con
#     ambito='PREVENTIVI' sarebbe stato rifiutato dalla CHECK);
#   - estende gli ambiti ammessi con OFFERTE, CONTRATTI (simmetria piena
#     D-3) e ACQUISTI_DDT (convergenza acquisti Q5).
# Whitelist ambiti autoritativa dopo il seed (20260711-18): niente piu'
# fallback hardcoded nel trigger (Q3).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260711-16-alter-chk-tipi-indirizzi-ambito-mctit.yaml

  - changeSet:
      id: 20260711-16-alter-chk-tipi-indirizzi-ambito
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE config.tipi_indirizzi_allowed
                DROP CONSTRAINT IF EXISTS chk_tipi_indirizzi_ambito;

              ALTER TABLE config.tipi_indirizzi_allowed
                ADD CONSTRAINT chk_tipi_indirizzi_ambito
                CHECK (ambito IN (
                  'FATTURE','ORDINI','DDT','PREVENTIVI',
                  'OFFERTE','CONTRATTI','ACQUISTI_DDT'
                ));
      rollback:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE config.tipi_indirizzi_allowed
                DROP CONSTRAINT IF EXISTS chk_tipi_indirizzi_ambito;

              ALTER TABLE config.tipi_indirizzi_allowed
                ADD CONSTRAINT chk_tipi_indirizzi_ambito
                CHECK (ambito IN ('FATTURE','ORDINI','DDT','PREVENTVI'));
