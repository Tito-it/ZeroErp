# Liquibase changelog per Zero ERP
# Tabella config.canali_pratiche — canali di visibilita' flussi
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260303-07-create-canali-pratiche-mctit.yaml

  - changeSet:
      id: 20260303-07-create-canali-pratiche
      author: mctit
      comment: >
        Registry dei canali di visibilita' per i flussi delle pratiche.
        Abilita configurazione flessibile di quali flussi sono esposti
        su quali interfacce esterne (web clienti, app tecnica, ecc.).
        Valori previsti: WEB_CLIENTI, APP_TECNICA, PORTALE_FORNITORI.
      changes:
        - createTable:
            schemaName: config
            tableName: canali_pratiche
            remarks: "Canali di visibilita' per i flussi delle pratiche."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_canali_pratiche
                    nullable: false

              - column:
                  name: codice
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: canali_pratiche
            columnNames: codice
            constraintName: uq_canali_pratiche_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: canali_pratiche
            columnNames: codice_interno
            constraintName: uq_canali_pratiche_codice_interno

      rollback:
        - dropTable:
            schemaName: config
            tableName: canali_pratiche
