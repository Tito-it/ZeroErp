# ------------------------------------------------------------
# IL REGISTRO DELLE AZIONI DI RIGA
#   Brief: brief-modello-documento-vendita §15.10 (giro 11; D-N1, F-5, Q-F5 =
#   vista DB di Tid, 2026-10-27).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Un pulsante di riga (togli un documento dal giro, e domani le azioni per
#   riga degli altri documenti) ha tre pezzi che devono dire la stessa cosa:
#   la funzione che RIFIUTA (il verbo, che solleva il primo motivo della sua
#   fn_check), la superficie che il frontend LEGGE (una vista con la colonna
#   del motivo per riga) e la fn_check che entrambi chiamano (linee guida SQL
#   §12.5). Oggi il legame vive nella testa di chi scrive: il registro lo
#   scrive, e il presidio pgTAP (db/pgtap/config/test-azioni-riga-registro-v1)
#   lo verifica. Il frontend legge dal registro quali colonne portano motivo e
#   chiave: un BB del pulsante di riga, non un pulsante per azione.
#
# ── LE COLONNE ──────────────────────────────────────────────────────
#   superficie, fn_check, verbo: TEXT «schema.nome», non regclass/regprocedure.
#   Un reg* salva l'OID: segue una rinomina in silenzio e, se l'oggetto
#   sparisce, stampa un numero senza errore; in un CSV di seed un OID dipende
#   dalla macchina. Che puntino a oggetti vivi lo dice il presidio.
#   Configurazione da CSV (20261027-25), la storia ce l'ha git: niente
#   storicizza, nessuna riga in dbops.storico_scope_policy.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261027-23-create-azioni-riga-mctit.yaml

  - changeSet:
      id: 20261027-23-create-azioni-riga
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea config.azioni_riga, il registro delle azioni di riga: per ogni azione la superficie
        (vista) con le colonne di motivo e chiave, la fn_check e il verbo che rifiuta. Brief:
        brief-modello-documento-vendita §15.10 (Q-F5 = vista DB).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists: { schemaName: config, tableName: azioni_riga }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.azioni_riga (
                  id                    bigint       GENERATED BY DEFAULT AS IDENTITY,
                  codice_interno        text         NOT NULL,
                  descrizione           varchar(200) NOT NULL,
                  superficie            text         NOT NULL,
                  colonna_motivo        text         NOT NULL,
                  colonna_motivo_chiave text         NOT NULL,
                  fn_check              text         NOT NULL,
                  verbo                 text         NOT NULL,
                  attivo                boolean      NOT NULL DEFAULT true,
                  meta                  jsonb        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert           timestamptz  NOT NULL DEFAULT now(),
                  user_insert           text         NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz  NOT NULL DEFAULT now(),
                  user_update           text         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_azioni_riga PRIMARY KEY (id),
                  CONSTRAINT uq_azioni_riga_codice_interno UNIQUE (codice_interno),
                  CONSTRAINT chk_azioni_riga_superficie_qualificata
                      CHECK (superficie ~ '^[a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*$'),
                  CONSTRAINT chk_azioni_riga_fn_check_qualificata
                      CHECK (fn_check ~ '^[a-z_][a-z0-9_]*\.fn_check_[a-z0-9_]+$'),
                  CONSTRAINT chk_azioni_riga_verbo_qualificato
                      CHECK (verbo ~ '^[a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*$'),
                  CONSTRAINT chk_azioni_riga_colonne_identificatori
                      CHECK (colonna_motivo ~ '^[a-z_][a-z0-9_]*$'
                         AND colonna_motivo_chiave ~ '^[a-z_][a-z0-9_]*$')
              );

              COMMENT ON TABLE config.azioni_riga IS
                  'Registro delle AZIONI DI RIGA (D-N1, F-5): per ogni azione che un pulsante esegue su una riga di elenco, la superficie che il frontend legge (superficie, una vista con una riga per riga dell''elenco), le due colonne che dicono perche'' il pulsante e'' spento (colonna_motivo, il testo; colonna_motivo_chiave, la chiave i18n; NULL = azione viva), la fn_check pura che calcola i motivi e il verbo che rifiuta sollevando il primo (linee guida SQL §12.5). Il presidio db/pgtap/config/test-azioni-riga-registro-v1 verifica che superficie, colonne, fn_check e verbo esistano, che la vista dipenda dalla fn_check e che il verbo la chiami: tooltip ed errore non possono dire due cose diverse. Il frontend legge le colonne dal registro (un BB del pulsante di riga). Seed dal CSV 80_data/sql/config/azioni_riga.csv. Brief: brief-modello-documento-vendita §15.10 (Q-F5 = vista DB, Tid 2026-10-27).';
              COMMENT ON COLUMN config.azioni_riga.superficie IS
                  'La vista (schema.nome) che porta, per riga, le colonne di blocco dell''azione. TEXT e non regclass: che sia viva lo verifica il presidio.';
              COMMENT ON COLUMN config.azioni_riga.fn_check IS
                  'La fn_check pura (schema.nome) che elenca i motivi, la STESSA che chiamano la superficie e il verbo.';
              COMMENT ON COLUMN config.azioni_riga.verbo IS
                  'La funzione (schema.nome) che esegue l''azione e la rifiuta col primo motivo della fn_check.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.azioni_riga;
