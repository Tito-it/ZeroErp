# COMMENT della colonna `meta` di sei matrici di transizione: `severity` esce
# dall'elenco dei metadati UI, come `icon` il 2026-09-27 (20260927-09).
#
# Decisione di Tid (brief §9.1): il colore del pulsante segue la regola
# dell'icona, lo decide il verbo e il frontend lo ricava dal `key`. Le
# fn_available_actions_* non emettono piu' `severity` (20260928-07 -> -15) e il
# seed lo toglie dai CSV. Il COMMENT che lo elencava direbbe il falso.
# Testo: VIVO (col_description, 2026-09-28) senza `severity`, e la frase
# sull'icona riscritta per icona e colore insieme.
# `config.stati_doc_fiscale_transizioni` e `config.transizioni_stati_preventivi`
# hanno un COMMENT generico che non nomina `severity`: non si toccano.
# Solo COMMENT: nessuna struttura, nessun dato.
# Brief: brief-db-icone-azioni-per-significato.md §9.3
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260928-06-comment-meta-transizioni-senza-severity-mctit.yaml

  - changeSet:
      id: 20260928-06-comment-meta-transizioni-senza-severity
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT della colonna meta di sei matrici di transizione: severity esce
        dai metadati UI, icona e colore li sceglie il frontend dall'action_key.
        Solo COMMENT. Brief: brief-db-icone-azioni-per-significato (§9).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN config.stati_doc_offerte_transizioni.meta
              IS 'Metadati UI (action_key, label_key, requires_confirm, manuale). manuale=false per transizioni automatiche (es. EMESSA->SUPERATA via trigger revisione). Icona e colore (severity) dell''azione NON stanno nel meta: il frontend li sceglie dall''action_key (mappa verbo -> aspetto in core/). Brief: brief-db-icone-azioni-per-significato (D-1, §9).';

              COMMENT ON COLUMN config.transizioni_stati_contratti.meta
              IS 'Metadati UI (action_key, label_key, requires_confirm, requires_date, outlined, manuale). requires_date=true: la UI deve raccogliere una data (es. cessa -> CESSATO). manuale=false per transizioni automatiche (job notturno pgAgent). Icona e colore (severity) dell''azione NON stanno nel meta: il frontend li sceglie dall''action_key (mappa verbo -> aspetto in core/). Brief: brief-db-icone-azioni-per-significato (D-1, §9).';

              COMMENT ON COLUMN config.transizioni_stati_ordini.meta
              IS 'Metadati UI (action_key, label_key, requires_confirm, outlined, manuale). manuale=false per transizioni automatiche/di processo (escluse da available_actions). Per le manuali action_key+label_key sono obbligatori (vedi ck_transizioni_stati_ord_meta_ui). Icona e colore (severity) dell''azione NON stanno nel meta: il frontend li sceglie dall''action_key (mappa verbo -> aspetto in core/). Brief: brief-db-icone-azioni-per-significato (D-1, §9).';

              COMMENT ON COLUMN config.transizioni_stati_ddt.meta
              IS 'Metadati UI (action_key, label_key, requires_confirm, outlined, manuale). manuale=false per transizioni automatiche/di processo (escluse dai pulsanti). Per le manuali action_key+label_key sono obbligatori (vedi ck_transizioni_stati_ddt_meta_ui). Icona e colore (severity) dell''azione NON stanno nel meta: il frontend li sceglie dall''action_key (mappa verbo -> aspetto in core/). Brief: brief-db-icone-azioni-per-significato (D-1, §9).';

              COMMENT ON COLUMN config.transizioni_stati_reso.meta
              IS 'Metadati UI (action_key, label_key, requires_confirm, outlined, manuale). manuale=false per transizioni automatiche (escluse dai pulsanti); per le manuali action_key+label_key obbligatori (ck_..._meta_ui). Icona e colore (severity) dell''azione NON stanno nel meta: il frontend li sceglie dall''action_key (mappa verbo -> aspetto in core/). Brief: brief-db-icone-azioni-per-significato (D-1, §9).';

              COMMENT ON COLUMN vendite.transizioni_stati_commessa.meta
              IS 'Metadati UI (action_key, label_key, requires_confirm, outlined, manuale). manuale=false per transizioni automatiche/di processo (escluse da una futura available_actions). Per le manuali action_key+label_key sono obbligatori (vedi ck_transizioni_stati_comm_meta_ui). Icona e colore (severity) dell''azione NON stanno nel meta: il frontend li sceglie dall''action_key (mappa verbo -> aspetto in core/). Brief: brief-db-icone-azioni-per-significato (D-1, §9).';

      rollback:
        - empty: {}
