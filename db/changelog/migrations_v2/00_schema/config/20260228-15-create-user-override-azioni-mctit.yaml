# Liquibase changelog per Zero ERP
# Tabella config.user_override_azioni — override individuale su azione di processo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260228-15-create-user-override-azioni-mctit.yaml

  - changeSet:
      id: 20260228-15-create-user-override-azioni
      author: mctit
      comment: >
        Override individuale su azione di processo.
        Sovrascrive l'abilitazione ereditata dal reparto.

      changes:
        - createTable:
            schemaName: config
            tableName: user_override_azioni
            remarks: "Override individuale su azione di processo. Sovrascrive il profilo reparto."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_override_azioni
                    nullable: false

              - column:
                  name: auth_user_id
                  type: integer
                  remarks: "FK -> django.auth_user.id — utente."
                  constraints:
                    nullable: false

              - column:
                  name: azione_id
                  type: integer
                  remarks: "FK -> config.azioni_processo.id — azione di processo."
                  constraints:
                    nullable: false

              - column:
                  name: abilitata
                  type: boolean
                  remarks: "Azione concessa (true) o negata (false) per l'utente."
                  constraints:
                    nullable: false

              - column:
                  name: motivo
                  type: text
                  remarks: "Governance: motivazione dell'override."
                  constraints:
                    nullable: true

              - column:
                  name: valido_dal
                  type: date
                  defaultValueComputed: "CURRENT_DATE"
                  remarks: "Inizio validita' dell'override."
                  constraints:
                    nullable: true

              - column:
                  name: valido_al
                  type: date
                  remarks: "Fine validita' (NULL = indeterminato)."
                  constraints:
                    nullable: true

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estendibili."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp ultima modifica."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente ultima modifica."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: user_override_azioni
            columnNames: auth_user_id, azione_id
            constraintName: uq_user_override_azioni_user_azione

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: user_override_azioni
            baseColumnNames: azione_id
            constraintName: fk_user_override_azioni_azione
            referencedTableSchemaName: config
            referencedTableName: azioni_processo
            referencedColumnNames: id
            onUpdate: NO ACTION
            onDelete: NO ACTION

        - createIndex:
            schemaName: config
            tableName: user_override_azioni
            indexName: ix_user_override_azioni_auth_user_id
            columns:
              - column:
                  name: auth_user_id

        - createIndex:
            schemaName: config
            tableName: user_override_azioni
            indexName: ix_user_override_azioni_azione_id
            columns:
              - column:
                  name: azione_id

        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.user_override_azioni
              ADD CONSTRAINT chk_user_override_azioni_validita
              CHECK (valido_al IS NULL OR valido_dal IS NULL OR valido_al >= valido_dal);

              COMMENT ON TABLE config.user_override_azioni IS
              'Override individuale su azione di processo.
               Sovrascrive l''abilitazione ereditata dal reparto.';

      rollback:
        - dropTable:
            schemaName: config
            tableName: user_override_azioni
