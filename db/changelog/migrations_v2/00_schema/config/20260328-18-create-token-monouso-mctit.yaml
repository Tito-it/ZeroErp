# Liquibase changelog per Zero ERP
# Crea config.token_monouso — token monouso generico per
# inviti, reset password, conferme email.
# Il token in chiaro NON viene mai salvato: solo hash SHA-256.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/config/20260328-18-create-token-monouso-mctit.yaml

    - changeSet:
          id: 20260328-18-create-token-monouso
          author: mctit
          comment: >
              Token monouso generico riutilizzabile per inviti, reset password,
              conferme email, attivazione account. Il token in chiaro non viene
              mai salvato in DB, solo l'hash SHA-256.
              Supporta scadenza e tracciamento IP di utilizzo.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE TABLE config.token_monouso (
                            id              bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                            token_hash      character varying(128) NOT NULL,
                            tipo            character varying(50) NOT NULL,
                            auth_user_id    integer NOT NULL,
                            scadenza        timestamptz NOT NULL,
                            utilizzato      boolean NOT NULL DEFAULT false,
                            utilizzato_at   timestamptz,
                            ip_utilizzo     inet,
                            meta            jsonb NOT NULL DEFAULT '{}'::jsonb,
                            data_insert     timestamptz NOT NULL DEFAULT now(),
                            user_insert     text NOT NULL DEFAULT CURRENT_USER,

                            -- Vincoli
                            CONSTRAINT uq_token_monouso_token_hash UNIQUE (token_hash)
                        );

                        -- Indici per lookup e pulizia
                        CREATE INDEX ix_token_monouso_tipo_user_utilizzato
                          ON config.token_monouso(tipo, auth_user_id, utilizzato);
                        CREATE INDEX ix_token_monouso_scadenza
                          ON config.token_monouso(scadenza);

                        COMMENT ON TABLE config.token_monouso IS
                          'Token monouso generico con hash SHA-256, scadenza e tracciamento utilizzo.';
                        COMMENT ON COLUMN config.token_monouso.token_hash IS
                          'SHA-256 del token. Il token in chiaro NON viene salvato.';
                        COMMENT ON COLUMN config.token_monouso.tipo IS
                          'Tipo token: INVITO_OPERATORE, RESET_PASSWORD, CONFERMA_EMAIL, ecc.';
                        COMMENT ON COLUMN config.token_monouso.auth_user_id IS
                          'FK utente Django associato al token.';

          rollback:
              - sql:
                    sql: |
                        DROP TABLE IF EXISTS config.token_monouso;
