# Liquibase changelog per Zero ERP
# Tabella config.transizioni_stati_pratiche — transizioni ammesse tra stati pratica
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260306-02-create-transizioni-stati-pratiche-mctit.yaml

  - changeSet:
      id: 20260306-02-create-transizioni-stati-pratiche
      author: mctit
      comment: >
        Matrice delle transizioni ammesse tra stati delle pratiche.
        Usata dal trigger guard per bloccare transizioni non consentite.
      changes:
        - createTable:
            schemaName: config
            tableName: transizioni_stati_pratiche
            remarks: "Transizioni ammesse tra stati pratica."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transizioni_stati_pratiche
                    nullable: false

              - column:
                  name: stato_da_id
                  type: integer
                  remarks: "FK -> config.stati_pratiche.id (stato origine)."
                  constraints:
                    nullable: false

              - column:
                  name: stato_a_id
                  type: integer
                  remarks: "FK -> config.stati_pratiche.id (stato destinazione)."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se true, la transizione e' ammessa."
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati/estensioni."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: transizioni_stati_pratiche
            columnNames: stato_da_id, stato_a_id
            constraintName: uq_transizioni_stati_pratiche

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: transizioni_stati_pratiche
            baseColumnNames: stato_da_id
            constraintName: fk_transizioni_stati_pratiche_da
            referencedTableSchemaName: config
            referencedTableName: stati_pratiche
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: transizioni_stati_pratiche
            baseColumnNames: stato_a_id
            constraintName: fk_transizioni_stati_pratiche_a
            referencedTableSchemaName: config
            referencedTableName: stati_pratiche
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.transizioni_stati_pratiche
                ADD CONSTRAINT ck_transizioni_stati_pratiche_da_diverso_a
                CHECK (stato_da_id <> stato_a_id);

      rollback:
        - dropTable:
            schemaName: config
            tableName: transizioni_stati_pratiche
