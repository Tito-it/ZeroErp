# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Matrice ammissibilita` utility x tipologia listino.
# Pattern analogo a config.utilities_tipi_ruolo (N:M con attivo).
# Nessuna validita` temporale (la combinazione e` ammessa o no).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260413-03-create-listini-tipologie-utilities-mctit.yaml

  - changeSet:
      id: 20260413-03-create-listini-tipologie-utilities
      author: mctit
      comment: >
        Matrice ammissibilita` utility x tipologia listino.
        Un trigger guard su vendite.listini verifica la coppia
        (utility_id, tipologia_id) contro questa tabella.
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists: { schemaName: config, tableName: listini_tipologie_utilities }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.listini_tipologie_utilities (
                  id              integer     GENERATED BY DEFAULT AS IDENTITY,
                  utility_id      integer     NOT NULL REFERENCES config.utilities(id),
                  tipologia_id    smallint    NOT NULL REFERENCES config.listini_tipologie(id),
                  attivo          boolean     NOT NULL DEFAULT true,
                  storicizza      boolean     NOT NULL DEFAULT true,
                  meta            jsonb       NOT NULL DEFAULT '{}'::jsonb,
                  data_insert     timestamptz NOT NULL DEFAULT now(),
                  user_insert     text        NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamptz NOT NULL DEFAULT now(),
                  user_update     text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id           uuid,
                  CONSTRAINT pk_listini_tipologie_utilities PRIMARY KEY (id),
                  CONSTRAINT uq_listini_tipologie_utilities UNIQUE (utility_id, tipologia_id)
              );

              COMMENT ON TABLE config.listini_tipologie_utilities
                IS 'Matrice ammissibilita` utility x tipologia listino. La coppia (utility_id, tipologia_id) e` validata da trigger guard su vendite.listini.';

      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS config.listini_tipologie_utilities;
