# ------------------------------------------------------------
# P-1 — IL VOCABOLARIO «DA DOVE ARRIVA UN ARTICOLO»
#   config.modi_approvvigionamento
#   Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3.2
#
# -- IL BUCO ---------------------------------------------------
#   Niente, in nessuna tabella, sa rispondere a «questa riga richiede
#   produzione?» ne' a «questo articolo si compra?». Le tre colonne che
#   sembrano rispondere non rispondono: is_composito e' fatturazione (ha
#   componenti da esporre), natura_vendita_id e' la DESTINAZIONE della riga
#   venduta (ordine/commessa/contratto), e_cessione_beni e' fiscale (lo
#   consuma il risolutore IVA). La provenienza e' una dimensione ortogonale:
#   c'e' a magazzino / la compro / la faccio.
#
# -- PERCHE' UNA TABELLA E NON UN CHECK SU VARCHAR --------------
#   E' una dimensione dell'articolo come la natura di vendita, e la natura
#   di vendita e' una tabella (config.nature_vendita, che questa ricalca
#   colonna per colonna). Il FE vuole una select con etichetta, la lista un
#   valore decodificabile; e il giorno in cui la produzione esiste il
#   vocabolario avra' attributi («richiede ODL»), che un CHECK non porta.
#
# -- CHE COSA NASCE DA SOLO, E CHE COSA NO ----------------------
#   ⭐ Il lock su codice_interno NON si semina: e' IMPLICITO per la sola
#   presenza della colonna (dbops.fn_run_automations_lock_columns, riga 41
#   del corpo; linee-guida-sql 6b). nature_vendita non ha nessuna riga in
#   automation_lock_columns e il lock ce l'ha. Fino al 12-09 il brief diceva
#   il contrario: corretto la'.
#   ⚠️ Tabella NUOVA: audit, tx_id, storico e il lock arrivano con
#   `--contexts=ci_apply`, non da qui. Niente DDL ne' preCondition sui loro
#   nomi (linee-guida-sql 11.5). Le colonne di audit nascono coi propri
#   DEFAULT perche' il seed di 80_data funzioni comunque.
#   ⚠️ E con la FK da catalogo.articoli (20260913-05) a ci_apply nasce la
#   coppia ATTIVO — block sul padre, require sul figlio — perche' questa
#   tabella ha `attivo`. E' quella coppia a rendere vero «un articolo non
#   punta a una riga spenta», non un vincolo scritto qui.
#   ⚠️ Nessun GRANT: le ALTER DEFAULT PRIVILEGES del loop di 90_end
#   (20260205-41) coprono tabella e sequence gia' alla creazione, come per
#   nature_vendita. Il seed e' il 20260913-09 (80_data), la riga di
#   fk_index_policy il 20260913-12.
#
# -- CATALOGO, NON MACCHINA ------------------------------------
#   Nessuna FK verso anagrafiche.*: il vocabolario e' parte del contratto
#   del software e vale identico su ogni installazione. Nessun `context`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260913-04-create-modi-approvvigionamento-mctit.yaml

  - changeSet:
      id: 20260913-04-create-modi-approvvigionamento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE config.modi_approvvigionamento: il vocabolario «da dove
        arriva un articolo» (ACQUISTO, PRODUZIONE, STOCK, NON_APPLICABILE),
        dimensione ortogonale alla natura di vendita, che dice invece dove va
        la riga venduta. Stessa forma di config.nature_vendita. Lock su
        codice_interno, audit, tx_id e storico arrivano da ci_apply. Brief:
        brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3.2 (P-1).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: SELECT count(*) FROM pg_namespace WHERE nspname = 'config';
            - not:
                - tableExists:
                    schemaName: config
                    tableName: modi_approvvigionamento
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.modi_approvvigionamento (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_modi_approvvigionamento PRIMARY KEY,
                  codice_interno  VARCHAR(40)  NOT NULL,
                  codice          VARCHAR(40)  NOT NULL,
                  descrizione     VARCHAR(255),
                  attivo          BOOLEAN      NOT NULL DEFAULT true,
                  ordine          SMALLINT,
                  meta            JSONB        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id           UUID,
                  CONSTRAINT uq_modi_approvvigionamento_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_modi_approvvigionamento_codice_interno
                      UNIQUE (codice_interno),
                  -- La chiave naturale non puo' essere vuota: un codice_interno
                  -- '' passerebbe l'UNIQUE una volta e non aggancerebbe niente.
                  CONSTRAINT chk_modi_approvvigionamento_codice_interno_non_vuoto
                      CHECK (btrim(codice_interno) <> '')
              );

              COMMENT ON TABLE config.modi_approvvigionamento IS
                  'Modo di approvvigionamento di un articolo: DA DOVE arriva la merce '
                  'promessa (ACQUISTO: la compro; PRODUZIONE: la faccio; STOCK: c''e'' a '
                  'magazzino; NON_APPLICABILE: prestazione, non c''e'' merce). Dimensione '
                  'ORTOGONALE a config.nature_vendita, che dice invece DOVE VA la riga '
                  'venduta (ordine, commessa, contratto): un assemblato puo'' essere '
                  'comprato finito, un articolo semplice prodotto. Letto da '
                  'catalogo.articoli.modo_approvvigionamento_id, con default ACQUISTO '
                  '(decisione di Tid, 2026-09-02). E'' la colonna che rende ponibile la '
                  'domanda «questa riga richiede produzione?» e il perno di qualunque '
                  'proposta d''acquisto. Vocabolario modificabile dall''operatore '
                  '(codice, descrizione); codice_interno e'' la chiave su cui il codice '
                  'confronta, immutabile via lock automatico. Brief: '
                  'brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3.2.';
              COMMENT ON COLUMN config.modi_approvvigionamento.codice_interno IS
                  'Chiave naturale stabile, immutabile via script.trgfn_lock_columns '
                  '(provisionato da ci_apply per la sola presenza della colonna). '
                  'ACQUISTO | PRODUZIONE | STOCK | NON_APPLICABILE. E'' l''unico valore '
                  'su cui la logica DB/BE/FE confronta: codice e descrizione sono '
                  'per l''operatore (linee-guida-sql 6c).';
              COMMENT ON COLUMN config.modi_approvvigionamento.attivo IS
                  'Un modo spento non e'' assegnabile a un articolo (require_attivo su '
                  'catalogo.articoli, generato da ci_apply) e non si spegne finche'' '
                  'un articolo attivo lo usa (block_deact, idem).';
              COMMENT ON COLUMN config.modi_approvvigionamento.ordine IS
                  'Ordine di presentazione nelle select del FE. Non e'' un ciclo di '
                  'vita e non ha semantica.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.modi_approvvigionamento;
