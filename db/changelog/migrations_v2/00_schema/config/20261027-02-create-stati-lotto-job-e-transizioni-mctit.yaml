# LO STATO DEL JOB DEL LOTTO: VOCABOLARIO E MATRICE IN TABELLA
#   Brief: brief-modello-documento-vendita §15 (giro 11; F-4, Q-F4, P-1 di
#   Tid, 2026-10-27).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   vendite.fatturazione_lotti.stato_lotto (IN_ESECUZIONE, COMPLETATO,
#   ERRORE: l'asse del LAVORO, non quello fiscale) aveva i valori in un
#   CHECK e i passaggi scritti due volte, in disaccordo: nel backend
#   (pipeline_repository.set_lotto_job_stato, l'unico scrittore vivo) e in
#   vendite.fn_set_fatturazione_lotto_stato (morta, che rifiutava
#   COMPLETATO -> ERRORE). F-4: una regola sola, nel database; il processo
#   dei lotti non cambia.
#
# ── LE DUE TABELLE ──────────────────────────────────────────────────
#   * config.stati_lotto_job: il vocabolario. codice_interno UNIQUE, perche'
#     la colonna del lotto resta il CODICE con una FK sul codice (P-1: stessa
#     garanzia di un id, i lettori non si toccano). La FK la mette
#     20261027-05 in 90_end, dopo il seed (su un database con lotti la FK
#     valida le righe, e il vocabolario deve esserci).
#   * config.transizioni_stati_lotto_job: la matrice, una riga = un
#     passaggio ammesso. La legge il guard vendite.trgfn_fatturazione_lotti_guard_stato_job
#     (20261027-06). Riscrivere lo stesso stato non e' un passaggio.
#   Seed dai CSV (20261027-03, -04). Configurazione da CSV, la storia ce
#   l'ha git: niente storicizza, nessuna riga in dbops.storico_scope_policy.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261027-02-create-stati-lotto-job-e-transizioni-mctit.yaml

  - changeSet:
      id: 20261027-02-create-stati-lotto-job-e-transizioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea config.stati_lotto_job (vocabolario dello stato del job del lotto di fatturazione) e
        config.transizioni_stati_lotto_job (la matrice dei passaggi). Brief:
        brief-modello-documento-vendita §15 (F-4, Q-F4, P-1).
      preConditions:
        - onFail: HALT
        - and:
            - not:
                - tableExists: { schemaName: config, tableName: stati_lotto_job }
            - not:
                - tableExists: { schemaName: config, tableName: transizioni_stati_lotto_job }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.stati_lotto_job (
                  id             bigint       GENERATED BY DEFAULT AS IDENTITY,
                  codice_interno text         NOT NULL,
                  descrizione    varchar(120) NOT NULL,
                  ordine         smallint     NOT NULL,
                  attivo         boolean      NOT NULL DEFAULT true,
                  meta           jsonb        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert    timestamptz  NOT NULL DEFAULT now(),
                  user_insert    text         NOT NULL DEFAULT CURRENT_USER,
                  data_update    timestamptz  NOT NULL DEFAULT now(),
                  user_update    text         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_stati_lotto_job PRIMARY KEY (id),
                  CONSTRAINT uq_stati_lotto_job_codice_interno UNIQUE (codice_interno)
              );

              COMMENT ON TABLE config.stati_lotto_job IS
                  'Vocabolario dello stato del JOB di un lotto di fatturazione (vendite.fatturazione_lotti.stato_lotto): IN_ESECUZIONE, COMPLETATO, ERRORE. E'' l''asse del lavoro della pipeline, non lo stato fiscale del lotto (config.stati_doc_fiscale). La colonna del lotto porta il CODICE, con una FK su codice_interno (P-1). I passaggi ammessi in config.transizioni_stati_lotto_job. Seed dal CSV 80_data/sql/config/stati_lotto_job.csv. Brief: brief-modello-documento-vendita §15 (F-4, Q-F4, P-1, Tid 2026-10-27).';
              COMMENT ON COLUMN config.stati_lotto_job.codice_interno IS
                  'Il codice dello stato, scritto in vendite.fatturazione_lotti.stato_lotto (FK). UNIQUE: e'' la chiave della FK.';

              CREATE TABLE config.transizioni_stati_lotto_job (
                  id          bigint      GENERATED BY DEFAULT AS IDENTITY,
                  stato_da_id bigint      NOT NULL,
                  stato_a_id  bigint      NOT NULL,
                  attivo      boolean     NOT NULL DEFAULT true,
                  meta        jsonb       NOT NULL DEFAULT '{}'::jsonb,
                  data_insert timestamptz NOT NULL DEFAULT now(),
                  user_insert text        NOT NULL DEFAULT CURRENT_USER,
                  data_update timestamptz NOT NULL DEFAULT now(),
                  user_update text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_transizioni_stati_lotto_job PRIMARY KEY (id),
                  CONSTRAINT uq_transizioni_stati_lotto_job UNIQUE (stato_da_id, stato_a_id),
                  CONSTRAINT fk_transizioni_stati_lotto_job_da
                      FOREIGN KEY (stato_da_id) REFERENCES config.stati_lotto_job (id),
                  CONSTRAINT fk_transizioni_stati_lotto_job_a
                      FOREIGN KEY (stato_a_id) REFERENCES config.stati_lotto_job (id),
                  CONSTRAINT chk_transizioni_stati_lotto_job_non_riflessa
                      CHECK (stato_da_id <> stato_a_id)
              );

              COMMENT ON TABLE config.transizioni_stati_lotto_job IS
                  'Matrice dei passaggi dello stato del JOB di un lotto di fatturazione: una riga attiva = un passaggio ammesso. La sola regola dei passaggi di vendite.fatturazione_lotti.stato_lotto (F-4: prima era scritta due volte, nel backend e in una funzione morta, in disaccordo); la giudica il guard vendite.trgfn_fatturazione_lotti_guard_stato_job a ogni UPDATE che cambia lo stato. Riscrivere lo stesso stato non e'' un passaggio (CHECK). COMPLETATO -> ERRORE e'' ammesso: un lotto gia'' completato e rilanciato male si marca, «e'' andata male» e'' un fatto osservato (decisione di Tid del 2026-08-24); ERRORE -> COMPLETATO no, la conclusione si guadagna con un giro. Seed dal CSV 80_data/sql/config/transizioni_stati_lotto_job.csv. Brief: brief-modello-documento-vendita §15 (F-4, Q-F4, Tid 2026-10-27).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.transizioni_stati_lotto_job;
              DROP TABLE IF EXISTS config.stati_lotto_job;
