# P-1 — IL FRENO SULLA PROVENIENZA: config.credenziali_provenienze
#   Brief: brief-db-blocco-login-per-credenziale, sezioni 2.1, 2.2, 2.4, 2.5
#
# ── ⭐ PERCHE' LA COPPIA credenziale + provenienza ──────────────────
#   Un blocco deciso dalle password sbagliate di CHIUNQUE e' un'arma: chi
#   conosce uno username chiude fuori il titolare (e gli username di portale e
#   shop sono generati dall'email, quindi indovinabili). Decisione di Tid del
#   2026-09-24 (D-1 riletta): le password sbagliate frenano CHI LE PROVA, cioe'
#   la coppia. Il titolare continua a entrare dalla sua macchina.
#   ⭐ La provenienza NON e' una veste: il conto resta della credenziale, per
#   tutte le porte. E' la macchina da cui si prova.
#
# ── ⚠️ LA PROVENIENZA E' OBBLIGATORIA ───────────────────────────────
#   `inet`, NOT NULL. NULL non e' un valore di chiave: una coppia con NULL non
#   si incontrerebbe mai con se' stessa nell'UNIQUE, e ogni tentativo
#   aprirebbe una riga nuova. Le funzioni rifiutano NULL con errore. Ricavare
#   l'IP vero dietro un proxy e' del backend.
#
# ── ⚠️ UNA RIGA ESISTE SOLO DOPO UN FALLIMENTO ──────────────────────
#   ultimo_fallimento_at NOT NULL: la riga nasce col primo fallimento da quella
#   provenienza e si CANCELLA a un accesso riuscito o a un reset (niente da
#   ricordare). Chi sbaglia e non riprova lascia una riga: la retention la
#   toglie (cleanup_at, regola CLEANUP_AT con base ultimo_fallimento_at, trigger
#   alla nascita 20260925-19; il verbo di registrazione ricalcola cleanup_at a
#   ogni fallimento, perche' il trigger alla nascita non rivede la riga).
#
# ── ⚠️ FORMA ────────────────────────────────────────────────────────
#   PK surrogata `id` e UNIQUE (credenziale_id, provenienza): linee guida
#   §2-§4, niente chiave composta. L'UNIQUE copre la FK (credenziale_id in
#   testa): nessun indice FK in piu' (fk_index_policy consentito=false).
#   Niente storico, niente RLS, all'app solo SELECT: come la madre.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260925-02-create-credenziali-provenienze-mctit.yaml

  - changeSet:
      id: 20260925-02-create-credenziali-provenienze
      author: mctit
      failOnError: true
      comment: >
        Crea config.credenziali_provenienze, il freno per coppia credenziale + provenienza (IP):
        tentativi falliti consecutivi da quella provenienza e blocco temporaneo. La riga nasce al
        primo fallimento e si cancella a un successo o a un reset; retention con cleanup_at.
        Brief: brief-db-blocco-login-per-credenziale §2.1-2.5.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: credenziali }
            - not:
                - tableExists:
                    { schemaName: config, tableName: credenziali_provenienze }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.credenziali_provenienze (
                  id                    bigint      GENERATED BY DEFAULT AS IDENTITY,
                  credenziale_id        bigint      NOT NULL,
                  provenienza           inet        NOT NULL,
                  tentativi_falliti     integer     NOT NULL DEFAULT 0,
                  bloccato_fino_a       timestamptz,
                  ultimo_fallimento_at  timestamptz NOT NULL,
                  cleanup_at            timestamptz,
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text        NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamptz NOT NULL DEFAULT now(),
                  user_update           text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_credenziali_provenienze PRIMARY KEY (id),
                  CONSTRAINT uq_credenziali_provenienze_credenziale_provenienza
                      UNIQUE (credenziale_id, provenienza),
                  CONSTRAINT fk_credenziali_provenienze_credenziali
                      FOREIGN KEY (credenziale_id) REFERENCES config.credenziali (id)
                      ON DELETE CASCADE,
                  CONSTRAINT chk_credenziali_provenienze_tentativi
                      CHECK (tentativi_falliti >= 0)
              );

              COMMENT ON TABLE config.credenziali_provenienze IS
                  'Freno sulla PROVENIENZA (D-1 riletta, 2026-09-24): le password sbagliate frenano la coppia credenziale + provenienza, non il titolare, che continua a entrare dalla sua macchina. Una riga esiste solo dopo un fallimento da quella provenienza e si cancella a un accesso riuscito o a un reset; chi sbaglia e non riprova lo toglie la retention (cleanup_at). La provenienza non e'' una veste: il conto resta della credenziale, per tutte le porte. Scrivono solo le funzioni del login; all''app solo SELECT. Brief: brief-db-blocco-login-per-credenziale.';
              COMMENT ON COLUMN config.credenziali_provenienze.provenienza IS
                  'L''indirizzo IP del chiamante, passato dal backend (che lo ricava anche dietro un proxy). Obbligatorio: NULL non e'' un valore di chiave.';
              COMMENT ON COLUMN config.credenziali_provenienze.tentativi_falliti IS
                  'Fallimenti consecutivi da questa provenienza. Alla soglia (parametro login_max_tentativi_falliti) la coppia e'' frenata fino a bloccato_fino_a. Un blocco scaduto fa ripartire da zero.';
              COMMENT ON COLUMN config.credenziali_provenienze.bloccato_fino_a IS
                  'Fine del freno sulla coppia (parametro login_blocco_minuti). NULL = non frenata. Da questa provenienza il login risponde E_UTENTE_BLOCCATO fino a quell''ora.';
              COMMENT ON COLUMN config.credenziali_provenienze.ultimo_fallimento_at IS
                  'Orario dell''ultimo fallimento da questa provenienza: la base della retention (cleanup_at).';
              COMMENT ON COLUMN config.credenziali_provenienze.cleanup_at IS
                  'Scadenza della riga (framework cleanup_at): ultimo_fallimento_at + ttl della regola CLEANUP_AT. La scrive il trigger alla nascita e la ricalcola la registrazione di ogni fallimento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.credenziali_provenienze;
