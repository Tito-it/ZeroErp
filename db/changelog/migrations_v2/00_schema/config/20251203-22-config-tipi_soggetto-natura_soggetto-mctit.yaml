# Liquibase changelog per Zero ERP
# Refactor tabella config.ruoli_tipi_indirizzo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20251203-22-config-tipi_soggetto-natura_soggetto-mctit.yaml

  - changeSet:
      id: 20251203-22-config-tipi_soggetto-natura_soggetto
      author: mctit

      changes:
        # 1) Aggiungo la colonna (nullable per compatibilità iniziale)
        - addColumn:
            schemaName: config
            tableName: tipi_soggetto
            columns:
              - column:
                  name: natura_soggetto
                  type: config.natura_soggetto_enum
                  remarks: "Natura fiscale/morfologica del soggetto (PF, PG, ENTE, ALTRO)."

        # 2) Popolo i valori esistenti in base all'id attuale
        - sql:
            sql: |
              UPDATE config.tipi_soggetto
              SET natura_soggetto = (
                CASE id
                  WHEN 'PF'  THEN 'PF'
                  WHEN 'PG'  THEN 'PG'
                  WHEN 'ENC' THEN 'ENTE'
                  ELSE 'ALTRO'
                END
              )::config.natura_soggetto_enum;

        # 3) Imposto default ALTRO (per sicurezza) e NOT NULL
        - sql:
            sql: |
              ALTER TABLE config.tipi_soggetto
              ALTER COLUMN natura_soggetto SET DEFAULT 'ALTRO';

        - sql:
            sql: |
              ALTER TABLE config.tipi_soggetto
              ALTER COLUMN natura_soggetto SET NOT NULL;

        # 4) (opzionale ma consigliato) rimuovo il default per obbligare la scelta esplicita
        - sql:
            sql: |
              ALTER TABLE config.tipi_soggetto
              ALTER COLUMN natura_soggetto DROP DEFAULT;

        # 5) Commento colonna
        - sql:
            sql: |
              COMMENT ON COLUMN config.tipi_soggetto.natura_soggetto IS
              'Natura fiscale/morfologica del soggetto:
               - PF: Persona Fisica
               - PG: Persona Giuridica
               - ENTE: Ente (es. Ente Non Commerciale)
               - ALTRO: categoria residuale / generica';

      rollback:
        - dropColumn:
            schemaName: config
            tableName: tipi_soggetto
            columnName: natura_soggetto
