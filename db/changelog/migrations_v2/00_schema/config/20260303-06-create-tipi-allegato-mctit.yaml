                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: tipi_allegato
            columnNames: codice
            constraintName: uq_tipi_allegato_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: tipi_allegato
            columnNames: codice_interno
            constraintName: uq_tipi_allegato_codice_interno

      rollback:
