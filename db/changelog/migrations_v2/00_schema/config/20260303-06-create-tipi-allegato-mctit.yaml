                    primaryKeyName: pk_tipi_allegato
                    nullable: false

              - column:
                  name: codice
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
