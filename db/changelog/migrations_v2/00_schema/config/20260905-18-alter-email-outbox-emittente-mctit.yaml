# DB-3 — `config.email_outbox` impara a dire DI CHI E'.
#   Richiesta: brief-db-processi-automatici-residui-be.md, DB-3 (era R-7)
#
# ⛔ IL BUCO CHE CHIUDE. `send_pending_emails` e' classificato **DOMINIO** — e
# correttamente: spedisce fatture ai clienti. Ma la sua tabella non porta
# l'emittente, quindi e' un processo di dominio **senza percorso al perimetro**:
# il backend puo' dargli l'attore, ma **non puo'** fargli lavorare un emittente
# alla volta, perche' non c'e' niente su cui filtrare.
#
# ── ⛔ NON E' UN `NOT NULL`, E LA RAGIONE STA NELLA TABELLA STESSA ──
#   `ambito` e' `NOT NULL` e vale `SISTEMA | REPARTO | OPERATORE`. Un'email di
#   SISTEMA — reset password, alert — **non ha un emittente e non puo' averlo**.
#   ⇒ Colonna nullable piu' un CHECK legato ad `ambito`: tutto cio' che NON e'
#     di sistema deve dichiarare per chi e' stato scritto.
#   ⭐ Ed e' la forma che la tabella usa gia': `chk_email_outbox_reparto_uo` dice
#     «se e' di REPARTO, l'unita' organizzativa e' obbligatoria». Stessa
#     grammatica, stesso posto.
#   ⚠️ La regola generale: un vincolo va dove il dato SI PUO' FORNIRE.
#
# ── ✅ LE RIGHE DI OGGI PASSANO ────────────────────────────────────
#   Misurato il 2026-09-05: 6 righe, tutte `SISTEMA`. Il CHECK entra senza
#   toccare niente. ⚠️ E' un fatto datato, non una garanzia: il CHECK vale per
#   quelle future, che sono il motivo per cui esiste.
#
# ── ⚠️ QUESTO CHANGESET APRE UNA RIGA NEL LIVELLO 2, ED E' VOLUTO ───
#   Dando il percorso, `config.email_outbox` esce da
#   `vw_processi_dominio_senza_emittente` (livello 1) ed ENTRA in
#   `vw_processi_dominio_senza_difesa` (livello 2): il percorso c'e', la policy
#   che lo applica no.
#   ⛔ Non e' un passo indietro — e' il debito che si sposta da «non sappiamo di
#   chi e'» a «lo sappiamo e non lo applichiamo ancora», che e' meno grave e piu'
#   preciso. La policy vuole una decisione che questo brief non prende: **chi
#   puo' leggere le email di SISTEMA**, che non appartengono a nessun emittente
#   e contengono reset di password.
#   ⇒ La riga viene marcata `debito_dichiarato` (changeSet -17), cosi' il
#     presidio la mostra per cio' che e' invece di sembrare un allarme.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260905-18-alter-email-outbox-emittente-mctit.yaml

  - changeSet:
      id: 20260905-18-alter-email-outbox-emittente
      author: mctit
      failOnError: true
      comment: >
        config.email_outbox.emittente_fiscale_id (nullable, FK) + CHECK legato ad
        ambito: tutto cio' che non e' di SISTEMA deve dire per quale emittente e'
        stato scritto. Non e' un NOT NULL perche' un'email di sistema — reset
        password, alert — non ha un emittente e non puo' averlo.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: email_outbox }
            - not:
                - columnExists:
                    schemaName: config
                    tableName: email_outbox
                    columnName: emittente_fiscale_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.email_outbox
                  ADD COLUMN emittente_fiscale_id bigint NULL;

              -- Hard FK: un'email non puo' dichiararsi di un emittente che non
              -- esiste. Stesso principio delle altre colonne di perimetro.
              ALTER TABLE config.email_outbox
                  ADD CONSTRAINT fk_email_outbox_emittente_fiscale
                      FOREIGN KEY (emittente_fiscale_id)
                      REFERENCES anagrafiche.emittenti_fiscali (id);

              -- ⭐ Stessa grammatica di chk_email_outbox_reparto_uo, che dice
              --   «se e' di REPARTO, l'unita' organizzativa e' obbligatoria».
              ALTER TABLE config.email_outbox
                  ADD CONSTRAINT chk_email_outbox_ambito_emittente
                      CHECK (ambito = 'SISTEMA' OR emittente_fiscale_id IS NOT NULL);

              COMMENT ON COLUMN config.email_outbox.emittente_fiscale_id IS
                  'Per quale azienda questa email e'' stata scritta. ⛔ Nullable di '
                  'proposito, e il CHECK chk_email_outbox_ambito_emittente lo lega ad '
                  '`ambito`: un''email di SISTEMA — reset password, alert — non ha un '
                  'emittente e non puo'' averlo, quindi un NOT NULL sarebbe un vincolo '
                  'messo dove il dato non si puo'' fornire. ⭐ Serve a '
                  'send_pending_emails, che e'' un processo di DOMINIO e senza questa '
                  'colonna non poteva lavorare un''azienda alla volta: non c''era niente '
                  'su cui filtrare. ⚠️ Il percorso e'' dichiarato in '
                  'dbops.processi_bersagli, ma la POLICY che lo applica non c''e'' ancora '
                  '— serve prima decidere chi puo'' leggere le email di SISTEMA, che non '
                  'sono di nessun emittente. Fino ad allora la riga e'' un debito '
                  'DICHIARATO nel livello 2 del presidio. Brief: '
                  'brief-db-processi-automatici-residui-be, DB-3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.email_outbox
                  DROP CONSTRAINT IF EXISTS chk_email_outbox_ambito_emittente;
              ALTER TABLE config.email_outbox
                  DROP CONSTRAINT IF EXISTS fk_email_outbox_emittente_fiscale;
              ALTER TABLE config.email_outbox
                  DROP COLUMN IF EXISTS emittente_fiscale_id;
