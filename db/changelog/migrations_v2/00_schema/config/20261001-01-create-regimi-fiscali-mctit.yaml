# IL VOCABOLARIO DEI REGIMI FISCALI (RegimeFiscale del tracciato FatturaPA)
#   config.regimi_fiscali
#   Brief: brief-db-esigibilita-iva-per-cassa-emittente, sezioni 4.1, 8.4 (D-1, D-9, D-10)
#
# -- IL BUCO ---------------------------------------------------
#   anagrafiche.emittenti_fiscali.regime_fiscale_rf e' un varchar libero:
#   nessun CHECK, nessun vocabolario. Una regola che decide l'esigibilita'
#   su quel testo accetterebbe 'rf17 ' come un regime qualunque.
#
# -- PERCHE' UN ATTRIBUTO E NON IL LETTERALE 'RF17' (D-10) ----
#   Il codice (RF17) e' del tracciato: e' la chiave naturale ESTERNA, stabile
#   come un codice ISO (linee-guida-sql 6b, punto 2). Il SIGNIFICATO «le
#   operazioni sono per cassa» e' una colonna, iva_per_cassa — lo stesso
#   stampo di config.iva_natura.is_reverse_charge. La regola
#   (script.fn_esigibilita_iva) legge l'attributo, mai il codice.
#
# -- PERCHE' LA FK SUL CODICE E NON SULL'id (D-9) --------------
#   La colonna regime_fiscale_rf resta col suo nome e il suo tipo e diventa
#   FK su codice_interno (20261001-17): i due lettori che la usano come testo
#   (vendite.fn_snapshot_intestazione_fattura, script.fn_get_user_profile)
#   non cambiano, e lo snapshot congela il codice che il tracciato pretende.
#   Precedente di FK su codice_interno: config.causali_trasporto.causale_magazzino.
#
# -- CHE COSA NASCE DA SOLO -------------------------------------
#   Tabella NUOVA: audit, tx_id e il lock su codice_interno arrivano con
#   `--contexts=ci_apply` (linee-guida-sql 6b, 11.5): niente DDL ne'
#   preCondition sui loro nomi. Con la FK da emittenti_fiscali a ci_apply
#   nasce anche la coppia ATTIVO (block sul padre, require sul figlio).
#   Niente `storicizza`: e' un vocabolario del tracciato, come
#   config.modi_approvvigionamento, non una tabella con una storia di dominio.
#   Nessun GRANT: le ALTER DEFAULT PRIVILEGES del loop di 90_end coprono la
#   tabella alla creazione. Il seed e' 20261001-15 (80_data).
#
# -- CATALOGO, NON MACCHINA ------------------------------------
#   Nessuna FK verso anagrafiche.*, nessun `context`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261001-01-create-regimi-fiscali-mctit.yaml

  - changeSet:
      id: 20261001-01-create-regimi-fiscali
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        CREATE TABLE config.regimi_fiscali: il vocabolario del RegimeFiscale FatturaPA
        (RF01...), con l'attributo iva_per_cassa che la regola dell'esigibilita' legge al
        posto del letterale RF17 e il testo dell'annotazione da stampare. Lock su
        codice_interno, audit e tx_id da ci_apply. Brief:
        brief-db-esigibilita-iva-per-cassa-emittente, sezioni 4.1 e 8.4 (D-9, D-10).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: config
                tableName: regimi_fiscali
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.regimi_fiscali (
                  id                     BIGINT GENERATED BY DEFAULT AS IDENTITY
                                         CONSTRAINT pk_regimi_fiscali PRIMARY KEY,
                  codice_interno         VARCHAR(40)  NOT NULL,
                  codice                 VARCHAR(40)  NOT NULL,
                  descrizione            VARCHAR(255) NOT NULL,
                  iva_per_cassa          BOOLEAN      NOT NULL DEFAULT false,
                  annotazione_documento  TEXT,
                  attivo                 BOOLEAN      NOT NULL DEFAULT true,
                  ordine                 SMALLINT,
                  meta                   JSONB        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert            TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert            TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update            TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update            TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id                  UUID,
                  CONSTRAINT uq_regimi_fiscali_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_regimi_fiscali_codice_interno
                      UNIQUE (codice_interno),
                  -- La forma del tracciato: RF seguito da due cifre. Un codice
                  -- fuori forma non e' un regime che SDI riconosce.
                  CONSTRAINT chk_regimi_fiscali_codice_interno_forma
                      CHECK (codice_interno ~ '^RF[0-9]{2}$'),
                  CONSTRAINT chk_regimi_fiscali_descrizione_non_vuota
                      CHECK (btrim(descrizione) <> ''),
                  -- NULL = nessuna annotazione; una stringa vuota direbbe
                  -- «stampa niente» con un valore, che e' la stessa cosa detta
                  -- in due modi.
                  CONSTRAINT chk_regimi_fiscali_annotazione_non_vuota
                      CHECK (annotazione_documento IS NULL OR btrim(annotazione_documento) <> '')
              );

              COMMENT ON TABLE config.regimi_fiscali IS
                  'Il vocabolario del regime fiscale di un emittente: i codici RegimeFiscale del '
                  'tracciato FatturaPA (RF01 ordinario, RF17 IVA per cassa, RF19 forfettario...). '
                  'Letto da anagrafiche.emittenti_fiscali.regime_fiscale_rf, FK su codice_interno '
                  '(D-9). Il codice e'' del tracciato e il SIGNIFICATO sta nelle colonne: la regola '
                  'dell''esigibilita'' (script.fn_esigibilita_iva) legge iva_per_cassa, mai un '
                  'letterale RF (D-10, stesso stampo di config.iva_natura.is_reverse_charge). Un '
                  'codice che esce dal tracciato si spegne con attivo = false, non si cancella. '
                  'Brief: brief-db-esigibilita-iva-per-cassa-emittente.';
              COMMENT ON COLUMN config.regimi_fiscali.codice_interno IS
                  'Il codice RegimeFiscale del tracciato (RFnn): chiave naturale esterna, '
                  'immutabile via lock automatico, ed e'' il valore che '
                  'emittenti_fiscali.regime_fiscale_rf referenzia e che lo snapshot '
                  'dell''intestazione congela.';
              COMMENT ON COLUMN config.regimi_fiscali.iva_per_cassa IS
                  'true = le operazioni dell''emittente sono a esigibilita'' DIFFERITA (IVA per '
                  'cassa, art. 32-bis DL 83/2012), salvo le esclusioni che la regola applica '
                  '(cliente senza partita IVA, scissione dei pagamenti, inversione contabile). '
                  'E'' l''unica cosa del regime che script.fn_esigibilita_iva legge.';
              COMMENT ON COLUMN config.regimi_fiscali.annotazione_documento IS
                  'Il testo che una fattura di questo regime deve riportare (per RF17 '
                  'l''annotazione art. 32-bis). NULL = nessuna annotazione. ⚠️ Si stampa solo se '
                  'il documento ha almeno una riga a esigibilita'' D: una fattura RF17 verso un '
                  'privato e'' tutta immediata, e li'' l''annotazione sarebbe falsa (sezione 8.7 '
                  'del brief).';
              COMMENT ON COLUMN config.regimi_fiscali.ordine IS
                  'Ordine di presentazione nelle select del FE. Non ha semantica.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.regimi_fiscali;
