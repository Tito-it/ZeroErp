databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260127-06-update-utilities-tipo-doc-fiscale-mctit.yaml

  - changeSet:
      id: 20260127-06-update-utilities-tipo-doc-fiscale
      author: mctit
      comment: "Sostituisce registro_id con tipo_doc_fiscale_id su config.utilities"
      changes:
        - dropForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: utilities
            constraintName: fk_utilities_registro

        - dropColumn:
            schemaName: config
            tableName: utilities
            columnName: registro_id

        - addColumn:
            schemaName: config
            tableName: utilities
            columns:
              - column:
                  name: tipo_doc_fiscale_id
                  type: bigint
                  remarks: "Tipo documento fiscale default (fallback)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: utilities
            baseColumnNames: tipo_doc_fiscale_id
            constraintName: fk_utilities_tipo_doc_fiscale
            referencedTableSchemaName: config
            referencedTableName: tipi_doc_fiscale
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
