# LA VERSIONE DI LISTINO: VOCABOLARIO DEGLI STATI E MATRICE IN TABELLA
#   Brief: brief-modello-documento-vendita §16 (giro 12; L-1 … L-5 di Tid,
#   2026-10-28).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   vendite.listini_versioni.stato era un testo col CHECK (BOZZA, ATTIVA,
#   CHIUSA) e i passaggi stavano scritti nel guard e ricopiati nel backend.
#   L-1: lo stato diventa un id verso un vocabolario, come le altre testate
#   al modello, perche' i pezzi comuni (script.fn_doc_stato_modello, il verbo
#   comune, la porta, script.fn_doc_azioni_permesse) presuppongono una
#   colonna d'id. La conversione della colonna e' il 20261028-04.
#
# ── LE DUE TABELLE ──────────────────────────────────────────────────
#   * config.stati_doc_listino_versioni: il vocabolario, nella forma dei
#     gemelli config.stati_doc_*: codice_interno (la chiave stabile, letta
#     da script.fn_doc_stato_id), iniziale (script.fn_stato_iniziale_id),
#     terminale. ⚠️ Gli id del seed (1 BOZZA, 2 ATTIVA, 3 CHIUSA) sono
#     scritti anche nel predicato dell'esclusione e nel CHECK della chiusa
#     (20261028-04: un WHERE di vincolo non legge un'altra tabella); il
#     presidio che li confronta coi codici e' nel pgTAP del giro.
#   * config.transizioni_stati_listino_versioni: la matrice, una riga = un
#     passaggio. meta.manuale dichiarato su ogni riga (come i gemelli);
#     azione_processo_codename: l'azione del passaggio (L-3), FK al catalogo.
#   Seed dai CSV (20261028-27, -28). Configurazione da CSV, la storia ce
#   l'ha git: niente storicizza, nessuna riga in dbops.storico_scope_policy
#   (come config.stati_lotto_job, 20261027-02).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261028-03-create-stati-doc-listino-versioni-e-transizioni-mctit.yaml

  - changeSet:
      id: 20261028-03-create-stati-doc-listino-versioni-e-transizioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea config.stati_doc_listino_versioni (vocabolario degli stati della versione di listino) e
        config.transizioni_stati_listino_versioni (la matrice dei passaggi). Brief:
        brief-modello-documento-vendita §16 (L-1, L-3).
      preConditions:
        - onFail: HALT
        - and:
            - not:
                - tableExists: { schemaName: config, tableName: stati_doc_listino_versioni }
            - not:
                - tableExists: { schemaName: config, tableName: transizioni_stati_listino_versioni }
            - tableExists: { schemaName: config, tableName: azioni_processo }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.stati_doc_listino_versioni (
                  id             bigint       GENERATED BY DEFAULT AS IDENTITY,
                  codice_interno varchar(40)  NOT NULL,
                  descrizione    varchar(120) NOT NULL,
                  ordine         smallint     NOT NULL,
                  iniziale       boolean      NOT NULL DEFAULT false,
                  terminale      boolean      NOT NULL DEFAULT false,
                  attivo         boolean      NOT NULL DEFAULT true,
                  meta           jsonb        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert    timestamptz  NOT NULL DEFAULT now(),
                  user_insert    text         NOT NULL DEFAULT CURRENT_USER,
                  data_update    timestamptz  NOT NULL DEFAULT now(),
                  user_update    text         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_stati_doc_listino_versioni PRIMARY KEY (id),
                  CONSTRAINT uq_stati_doc_listino_versioni_codice_interno UNIQUE (codice_interno),
                  CONSTRAINT chk_stati_doc_listino_versioni_iniziale_attivo
                      CHECK (NOT iniziale OR attivo)
              );

              COMMENT ON TABLE config.stati_doc_listino_versioni IS
                  'Vocabolario degli stati di una versione di listino (vendite.listini_versioni.stato_doc_listino_versione_id): BOZZA (in preparazione: righe e date si cambiano), ATTIVA (i prezzi sono in uso), CHIUSA (la finestra di validita'' e'' passata: storia dei prezzi). I passaggi in config.transizioni_stati_listino_versioni. ⚠️ Gli id del seed sono scritti anche nel predicato di ex_listini_versioni_no_overlap e in chk_listini_versioni_chiusa_con_fine (un vincolo non legge un''altra tabella): si cambiano insieme, li confronta il pgTAP vendite/test-listino-versione-al-modello-v1. Seed dal CSV 80_data/sql/config/stati_doc_listino_versioni.csv. Brief: brief-modello-documento-vendita §16 (L-1, Tid 2026-10-28).';
              COMMENT ON COLUMN config.stati_doc_listino_versioni.codice_interno IS
                  'La chiave stabile dello stato: la leggono script.fn_doc_stato_id e i lettori che confrontano un codice.';
              COMMENT ON COLUMN config.stati_doc_listino_versioni.iniziale IS
                  'Lo stato in cui una versione nasce (script.fn_stato_iniziale_id, trigger della nascita): uno solo.';
              COMMENT ON COLUMN config.stati_doc_listino_versioni.terminale IS
                  'Nessun passaggio esce da qui.';

              CREATE UNIQUE INDEX ux_stati_doc_listino_versioni_iniziale
                  ON config.stati_doc_listino_versioni (iniziale) WHERE iniziale;

              CREATE TABLE config.transizioni_stati_listino_versioni (
                  id                       bigint       GENERATED BY DEFAULT AS IDENTITY,
                  stato_da_id              bigint       NOT NULL,
                  stato_a_id               bigint       NOT NULL,
                  azione_processo_codename varchar(100),
                  attivo                   boolean      NOT NULL DEFAULT true,
                  meta                     jsonb        NOT NULL DEFAULT '{}'::jsonb,
                  data_insert              timestamptz  NOT NULL DEFAULT now(),
                  user_insert              text         NOT NULL DEFAULT CURRENT_USER,
                  data_update              timestamptz  NOT NULL DEFAULT now(),
                  user_update              text         NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_transizioni_stati_listino_versioni PRIMARY KEY (id),
                  CONSTRAINT uq_transizioni_stati_listino_versioni UNIQUE (stato_da_id, stato_a_id),
                  CONSTRAINT fk_transizioni_stati_listino_versioni_da
                      FOREIGN KEY (stato_da_id) REFERENCES config.stati_doc_listino_versioni (id),
                  CONSTRAINT fk_transizioni_stati_listino_versioni_a
                      FOREIGN KEY (stato_a_id) REFERENCES config.stati_doc_listino_versioni (id),
                  CONSTRAINT fk_transizioni_stati_listino_versioni_azioni_processo
                      FOREIGN KEY (azione_processo_codename)
                      REFERENCES config.azioni_processo (permission_codename),
                  CONSTRAINT chk_transizioni_stati_listino_versioni_non_riflessa
                      CHECK (stato_da_id <> stato_a_id),
                  CONSTRAINT ck_transizioni_stati_listino_versioni_meta_manuale_dichiarato
                      CHECK (jsonb_exists(meta, 'manuale')
                             AND jsonb_typeof(meta -> 'manuale') = 'boolean')
              );

              COMMENT ON TABLE config.transizioni_stati_listino_versioni IS
                  'Matrice dei passaggi di stato di una versione di listino: una riga attiva = un passaggio ammesso. La giudica il guard vendite.trgfn_listini_versioni_guard_transizione_stato a ogni UPDATE che cambia lo stato; la legge il verbo comune (script.fn_doc_passaggio). BOZZA -> ATTIVA e'' manuale, con l''azione attiva_listino (L-3), e lo scrive vendite.fn_attiva_versione_listino; ATTIVA -> CHIUSA e'' di processo (meta.manuale = false): lo scrive solo vendite.fn_chiudi_versioni_listino_scadute, a finestra scaduta (L-2). Seed dal CSV 80_data/sql/config/transizioni_stati_listino_versioni.csv. Brief: brief-modello-documento-vendita §16 (L-2, L-3, Tid 2026-10-28).';
              COMMENT ON COLUMN config.transizioni_stati_listino_versioni.azione_processo_codename IS
                  'L''azione che il passaggio chiede (script.fn_guard_passaggio); NULL = decide il livello sul documento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.transizioni_stati_listino_versioni;
              DROP TABLE IF EXISTS config.stati_doc_listino_versioni;
