# Slice RESI vendita — config.transizioni_stati_reso (brief-db-resi-vendita §2.1).
#
# Matrice transizioni ammesse tra stati del reso. Mirror 1:1 di
# config.transizioni_stati_ddt (20260709-02): stessa forma (id, stato_da_id,
# stato_a_id, attivo, meta jsonb, audit), UNIQUE(da,a), CHECK da<>a, CHECK
# meta_ui, FK verso config.stati_doc_reso su entrambi i lati.
#
# Enforcement grafo: trigger vendite.trgfn_resi_guard_transizione (20260713-22).
# Lato lettura/UI: script.fn_available_actions_reso (20260713-34).
# Seed matrice (DRAFT->CONFERMATO, DRAFT->ANNULLATO, CONFERMATO->ANNULLATO) in
#   80_data (20260713-38).
#
# Dipendenza: config.stati_doc_reso (20260713-11).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260713-12-create-config-transizioni-stati-reso-mctit.yaml

  - changeSet:
      id: 20260713-12-create-config-transizioni-stati-reso
      author: mctit
      comment: >
        Crea config.transizioni_stati_reso: matrice transizioni stato reso.
        Mirror di config.transizioni_stati_ddt. Enforcement via
        vendite.trgfn_resi_guard_transizione (20260713-22). Seed in 20260713-38.
      preConditions:
        - onFail: HALT
        - and:
            - not:
                - tableExists:
                    schemaName: config
                    tableName: transizioni_stati_reso
            - tableExists:
                schemaName: config
                tableName: stati_doc_reso
      changes:
        - createTable:
            schemaName: config
            tableName: transizioni_stati_reso
            remarks: >-
              Matrice transizioni ammesse tra stati del reso di vendita. Fonte
              metadati UI (meta.ui) per azioni data-driven e grafo per
              vendite.trgfn_resi_guard_transizione. Mirror di
              config.transizioni_stati_ddt.
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK surrogata tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transizioni_stati_reso
                    nullable: false

              - column:
                  name: stato_da_id
                  type: bigint
                  remarks: "FK -> config.stati_doc_reso.id (stato origine)."
                  constraints:
                    nullable: false

              - column:
                  name: stato_a_id
                  type: bigint
                  remarks: "FK -> config.stati_doc_reso.id (stato destinazione)."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: >-
                    Se true, transizione ammessa dal guard ed esposta tra le
                    azioni; se false riga documentale (grafo) ma bloccata.
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: >-
                    Metadati UI (action_key, label_key, severity, icon,
                    requires_confirm, outlined, manuale). manuale=false per
                    transizioni automatiche (escluse dai pulsanti); per le
                    manuali action_key+label_key obbligatori (ck_..._meta_ui).
                  constraints:
                    nullable: false

              - column: { name: data_insert, type: timestamp with time zone, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: text, defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: timestamp with time zone, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: text, defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }

        - addUniqueConstraint:
            schemaName: config
            tableName: transizioni_stati_reso
            columnNames: stato_da_id, stato_a_id
            constraintName: uq_transizioni_stati_reso

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: transizioni_stati_reso
            baseColumnNames: stato_da_id
            constraintName: fk_tsr_da
            referencedTableSchemaName: config
            referencedTableName: stati_doc_reso
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: transizioni_stati_reso
            baseColumnNames: stato_a_id
            constraintName: fk_tsr_a
            referencedTableSchemaName: config
            referencedTableName: stati_doc_reso
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.transizioni_stati_reso
                ADD CONSTRAINT ck_transizioni_stati_reso_da_diverso_a
                CHECK (stato_da_id <> stato_a_id);

              -- Defense-in-depth: ogni transizione manuale deve avere i metadati
              -- minimi per renderizzare il pulsante (action_key + label_key). Le
              -- automatiche (manuale=false) ne sono esonerate. Simmetrico a
              -- config.transizioni_stati_ddt. Nota: '?' del JSONB va scritto '??'
              -- fuori da dollar-quote (escape Liquibase).
              ALTER TABLE config.transizioni_stati_reso
                ADD CONSTRAINT ck_transizioni_stati_reso_meta_ui
                CHECK (
                    COALESCE((meta->>'manuale')::boolean, true) = false
                    OR (meta ?? 'action_key' AND meta ?? 'label_key')
                );

              COMMENT ON TABLE config.transizioni_stati_reso IS
                  'Matrice transizioni ammesse tra stati del reso di vendita '
                  '(brief-db-resi-vendita §2.1). Fonte metadati UI per le azioni '
                  'data-driven e grafo per vendite.trgfn_resi_guard_transizione. '
                  'Mirror di config.transizioni_stati_ddt. Seed in 20260713-38. '
                  'rev 2026-07-13.';

      rollback:
        - dropTable:
            schemaName: config
            tableName: transizioni_stati_reso
