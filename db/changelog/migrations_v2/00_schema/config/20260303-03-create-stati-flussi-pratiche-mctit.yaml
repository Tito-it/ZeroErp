# Liquibase changelog per Zero ERP
# Tabella config.stati_flussi_pratiche — stati dei flussi operativi
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260303-03-create-stati-flussi-pratiche-mctit.yaml

  - changeSet:
      id: 20260303-03-create-stati-flussi-pratiche
      author: mctit
      comment: >
        Stati del ciclo di vita dei flussi operativi all'interno di una pratica.
        Valori previsti: DA_ESEGUIRE, IN_CORSO, COMPLETATO, SOSPESO, ANNULLATO, ERRORE.
      changes:
        - createTable:
            schemaName: config
            tableName: stati_flussi_pratiche
            remarks: "Stati del ciclo di vita dei flussi operativi."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_stati_flussi_pratiche
                    nullable: false

              - column:
                  name: codice
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: character varying(50)
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_flussi_pratiche
            columnNames: codice
            constraintName: uq_stati_flussi_pratiche_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_flussi_pratiche
            columnNames: codice_interno
            constraintName: uq_stati_flussi_pratiche_codice_interno

      rollback:
        - dropTable:
            schemaName: config
            tableName: stati_flussi_pratiche
