# P-1 — IL CAMBIO PASSWORD OBBLIGATORIO PASSA ALLA CREDENZIALE (D-7): i valori
#   Brief: brief-db-blocco-login-per-credenziale, sezione 4
#
# ── ⭐ LA REGOLA DI TRASFERIMENTO ───────────────────────────────────
#   deve_cambiare_password della credenziale = OR sulle sue identita' ATTIVE.
#   ⚠️ Solo le attive: un `true` rimasto su una veste revocata o DISABILITATO
#   non deve imporre il cambio alla credenziale. E' gia' la lettura di oggi
#   (il reset azzera il flag su tutte le vesti, l'attivazione senza identita_id
#   sulle vesti attive).
#   Si crea la riga SOLO dove il risultato e' true: l'assenza vale false
#   (20260925-01), e una riga a false sarebbe una seconda scrittura dello
#   stesso default.
#
# ── ⚠️ CONTATORI E BLOCCHI RIPARTONO DA ZERO ────────────────────────
#   Non si trasferiscono: la regola e' cambiata (coppia credenziale +
#   provenienza), e un blocco per veste non ha un corrispettivo. Non siamo in
#   produzione.
#
# ── ⚠️ SU UN DATABASE RICOSTRUITO DA ZERO ───────────────────────────
#   Nessuna identita' con il flag: l'INSERT non scrive niente, ed e' giusto.
#   La colonna sorgente la toglie 90_end/20260925-25, che in un migrate da zero
#   gira DOPO questo file (fase 00_schema prima di 90_end).
#
# runOnChange false: e' una bonifica di un momento, non una rete.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260925-03-backfill-credenziali-deve-cambiare-password-mctit.yaml

  - changeSet:
      id: 20260925-03-backfill-credenziali-deve-cambiare-password
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        D-7: porta deve_cambiare_password da anagrafiche.identita_digitali alla credenziale
        (config.credenziali) con l'OR sulle identita' ATTIVE; crea la riga solo dove vale true
        (l'assenza vale false). Contatori e blocchi ripartono da zero. Brief:
        brief-db-blocco-login-per-credenziale §4.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: credenziali }
            - columnExists:
                schemaName: anagrafiche
                tableName: identita_digitali
                columnName: deve_cambiare_password
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              INSERT INTO config.credenziali (auth_user_id, deve_cambiare_password)
              SELECT id.auth_user_id, true
                FROM anagrafiche.identita_digitali id
               WHERE id.attivo = true
                 AND id.deve_cambiare_password = true
               GROUP BY id.auth_user_id
              ON CONFLICT (auth_user_id) DO UPDATE
                 SET deve_cambiare_password = true;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DELETE FROM config.credenziali
               WHERE deve_cambiare_password = true
                 AND fallimenti_consecutivi = 0
                 AND bloccata_at IS NULL;
