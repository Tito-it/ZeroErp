# Liquibase changelog per Zero ERP
#
# Aggiunge a config.tipi_ruoli due colonne opzionali per
# mappare dinamicamente la tabella entita' e la colonna codice
# usata nella ricerca universale.
#   - entita_tabella:        schema.tabella (o vista) con
#                            colonna soggetto_ruolo_id
#   - entita_colonna_codice: colonna contenente il codice
#                            cercabile (default NULL, la
#                            funzione applica 'codice')
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260311-05-alter-tipi-ruoli-add-entita-ref-mctit.yaml

  - changeSet:
      id: 20260311-05-alter-tipi-ruoli-add-entita-ref
      author: mctit
      comment: "Aggiunge entita_tabella e entita_colonna_codice a tipi_ruoli per ricerca codice dinamica"
      failOnError: true
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE config.tipi_ruoli
                ADD COLUMN IF NOT EXISTS entita_tabella        text     DEFAULT NULL,
                ADD COLUMN IF NOT EXISTS entita_colonna_codice text     DEFAULT NULL;

              COMMENT ON COLUMN config.tipi_ruoli.entita_tabella IS
                'Riferimento schema.tabella (o vista) dell''entita'' collegata al ruolo. Deve avere colonna soggetto_ruolo_id. NULL = nessuna ricerca per codice entita''.';
              COMMENT ON COLUMN config.tipi_ruoli.entita_colonna_codice IS
                'Nome colonna codice nella tabella entita'' per ricerca ILIKE. NULL = default ''codice''. Usata solo se entita_tabella IS NOT NULL.';
