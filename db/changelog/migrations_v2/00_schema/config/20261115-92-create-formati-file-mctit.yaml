# ------------------------------------------------------------
# IL VOCABOLARIO DEI FORMATI DI FILE
#   config.formati_file: un formato e' un tipo MIME con la sua estensione.
#   Seed nel mirror 80_data/20261115-95.
#
# -- PERCHE' --------------------------------------------------------------
#   D15 (Q8b, Q15, Tid 2026-11-14 e 2026-11-16): i formati ammessi per tipo
#   stavano solo nel backend, in tre liste (risorse dei modelli, allegati della
#   stampa, allegati email) e due tabelle MIME -> estensione. Il formato e' un
#   vocabolario di dominio condiviso: sta in config, e lo abbinano ai propri
#   tipi le tabelle che lo ammettono (documenti.tipi_asset_documento_formati,
#   documenti.tipi_file_documento_formati). Gli allegati email restano fuori
#   perimetro: possono abbinarsi allo stesso vocabolario.
#   La forma e' quella dei vocabolari di documenti (Q14): niente attivo, un
#   formato nasce o si ritira con un changeSet; l'applicazione lo legge
#   soltanto (90_end/20261115-98).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261115-92-create-formati-file-mctit.yaml

  - changeSet:
      id: 20261115-92-create-formati-file
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il vocabolario dei formati di file: un tipo MIME con la sua estensione.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.formati_file (
                  id              BIGINT GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_formati_file PRIMARY KEY,
                  codice_interno  VARCHAR(40)  NOT NULL,
                  codice          VARCHAR(40)  NOT NULL,
                  descrizione     VARCHAR(255) NOT NULL,
                  etichetta_key   VARCHAR(120) NOT NULL,
                  ordine          SMALLINT,
                  mime_type       VARCHAR(255) NOT NULL,
                  estensione      VARCHAR(16)  NOT NULL,
                  data_insert     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_insert     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  data_update     TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  user_update     TEXT         NOT NULL DEFAULT CURRENT_USER,
                  tx_id           UUID,
                  CONSTRAINT uq_formati_file_codice
                      UNIQUE (codice),
                  CONSTRAINT uq_formati_file_codice_interno
                      UNIQUE (codice_interno),
                  CONSTRAINT uq_formati_file_mime_type
                      UNIQUE (mime_type),
                  CONSTRAINT chk_formati_file_codice_interno_non_vuoto
                      CHECK (btrim(codice_interno) <> ''),
                  CONSTRAINT chk_formati_file_codice_non_vuoto
                      CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_formati_file_descrizione_non_vuota
                      CHECK (btrim(descrizione) <> ''),
                  CONSTRAINT chk_formati_file_mime_type_forma
                      CHECK (mime_type ~ '^[a-z]+/[a-z0-9][a-z0-9.+-]*$'),
                  CONSTRAINT chk_formati_file_estensione_forma
                      CHECK (estensione ~ '^[a-z0-9]+$')
              );

              COMMENT ON TABLE config.formati_file IS
                  'I formati di file che il sistema riconosce: un tipo MIME con la sua estensione. I tipi che accettano un file abbinano qui i formati che ammettono (documenti.tipi_asset_documento_formati, documenti.tipi_file_documento_formati). Un formato nasce con un changeSet; l''applicazione li legge soltanto.';
              COMMENT ON COLUMN config.formati_file.codice_interno IS
                  'Chiave naturale stabile, immutabile (script.trgfn_lock_columns).';
              COMMENT ON COLUMN config.formati_file.codice IS
                  'Codice leggibile del formato.';
              COMMENT ON COLUMN config.formati_file.descrizione IS
                  'Descrizione per chi legge il catalogo; a video si usa etichetta_key.';
              COMMENT ON COLUMN config.formati_file.etichetta_key IS
                  'Chiave di traduzione dell''etichetta a video (config.formati_file.<codice_interno minuscolo>).';
              COMMENT ON COLUMN config.formati_file.ordine IS
                  'Ordine di presentazione nella tendina. Non ha semantica.';
              COMMENT ON COLUMN config.formati_file.mime_type IS
                  'Il tipo MIME, minuscolo, come lo dichiara il file e come lo confrontano i controlli dei tipi che lo ammettono.';
              COMMENT ON COLUMN config.formati_file.estensione IS
                  'L''estensione del nome del file, minuscola e senza punto: quella che si usa quando il nome caricato non ne ha una.';
              COMMENT ON CONSTRAINT uq_formati_file_mime_type ON config.formati_file IS
                  'Un tipo MIME e'' un formato solo.';
              COMMENT ON CONSTRAINT chk_formati_file_mime_type_forma ON config.formati_file IS
                  'Il tipo MIME e'' minuscolo, nella forma tipo/sottotipo.';
              COMMENT ON CONSTRAINT chk_formati_file_estensione_forma ON config.formati_file IS
                  'L''estensione e'' minuscola, senza punto.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.formati_file;
