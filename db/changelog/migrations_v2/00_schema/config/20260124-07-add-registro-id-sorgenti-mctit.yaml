# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260124-07-add-registro-id-sorgenti-mctit.yaml

  - changeSet:
      id: 20260124-07-add-registro-id-sorgenti
      author: mctit
      comment: "Aggiunge registro_id alle sorgenti (per sorgenti RIGA)"
      changes:
        - addColumn:
            schemaName: config
            tableName: sorgenti
            columns:
              - column:
                  name: registro_id
                  type: bigint
                  remarks: "Registro di fatturazione associato alla sorgente (opzionale)."
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableSchemaName: config
            baseTableName: sorgenti
            baseColumnNames: registro_id
            constraintName: fk_sorgenti_registro
            referencedTableSchemaName: vendite
            referencedTableName: registri_fatturazione
            referencedColumnNames: id
            onUpdate: CASCADE
            onDelete: NO ACTION
