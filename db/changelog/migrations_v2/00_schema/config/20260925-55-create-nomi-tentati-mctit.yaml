# R-7 — IL NOME TENTATO CHE NON E' UNA CREDENZIALE: config.nomi_tentati
#   Brief: brief-db-blocco-login-per-credenziale, sezione 13
#
# ── ⛔ IL DIFETTO CHE CHIUDE ─────────────────────────────────────────
#   Il freno e l'attesa avevano per chiave la sola credenziale: un nome
#   inesistente non contava nulla e rispondeva sempre 401, uno esistente dopo la
#   soglia 403. Sei password bastavano a sapere se l'utente esiste. Decisione di
#   Tid (2026-09-25, §13.5): il freno e l'attesa valgono per il NOME TENTATO;
#   la credenziale resta la chiave quando c'e', il nome quando non c'e'.
#
# ── ⭐ LA GEMELLA DI config.credenziali, PER CIO' CHE NON ESISTE ──────
#   Una riga per nome tentato che non corrisponde a nessuna credenziale, con i
#   fallimenti consecutivi (base dell'attesa crescente, come la credenziale).
#   Nessuna riga in config.credenziali per un nome che non e' una credenziale.
#
# ── ⛔ IL NOME NON SI SALVA IN CHIARO ───────────────────────────────
#   Nel campo username finiscono anche password digitate li' per sbaglio. Si
#   salva il DIGEST (HMAC-SHA256 con una chiave del backend, decisione (a)),
#   calcolato dal backend sul nome normalizzato come il lookup: il DB non vede
#   mai il nome, nemmeno come parametro. 32 byte, controllati da un CHECK.
#
# ── ⚠️ SCADE ────────────────────────────────────────────────────────
#   A differenza della credenziale, la riga di un nome inesistente non e' uno
#   stato permanente: cleanup_at (regola CLEANUP_AT, base ultimo_fallimento_at,
#   trigger alla nascita 20260925-57, ricalcolo a ogni fallimento).
#   Niente storico, niente RLS, all'app solo SELECT: come config.credenziali.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260925-55-create-nomi-tentati-mctit.yaml

  - changeSet:
      id: 20260925-55-create-nomi-tentati
      author: mctit
      failOnError: true
      comment: >
        Crea config.nomi_tentati: i fallimenti di login su un nome che non e' una credenziale,
        per digest (mai il nome in chiaro), perche' freno e attesa valgano anche li' e la risposta
        del login non dica se il nome esiste (R-7). Retention con cleanup_at.
        Brief: brief-db-blocco-login-per-credenziale §13.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                { schemaName: config, tableName: nomi_tentati }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE config.nomi_tentati (
                  id                     bigint      GENERATED BY DEFAULT AS IDENTITY,
                  nome_digest            bytea       NOT NULL,
                  fallimenti_consecutivi integer     NOT NULL DEFAULT 0,
                  ultimo_fallimento_at   timestamptz NOT NULL,
                  cleanup_at             timestamptz,
                  data_insert            timestamptz NOT NULL DEFAULT now(),
                  user_insert            text        NOT NULL DEFAULT CURRENT_USER,
                  data_update            timestamptz NOT NULL DEFAULT now(),
                  user_update            text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_nomi_tentati PRIMARY KEY (id),
                  CONSTRAINT uq_nomi_tentati_nome_digest UNIQUE (nome_digest),
                  CONSTRAINT chk_nomi_tentati_nome_digest
                      CHECK (octet_length(nome_digest) = 32),
                  CONSTRAINT chk_nomi_tentati_fallimenti
                      CHECK (fallimenti_consecutivi >= 0)
              );

              COMMENT ON TABLE config.nomi_tentati IS
                  'I fallimenti di login su un NOME che non e'' una credenziale (R-7, 2026-09-25): il freno e l''attesa valgono per il nome tentato, esista o no, cosi'' la risposta del login non dice se l''utente esiste. La gemella di config.credenziali per cio'' che non esiste: la credenziale resta la chiave quando il nome la trova. Il nome non si salva: solo il suo digest. Scade (cleanup_at). Scrivono solo le funzioni del login; all''app solo SELECT. Brief: brief-db-blocco-login-per-credenziale §13.';
              COMMENT ON COLUMN config.nomi_tentati.nome_digest IS
                  'Digest del nome tentato, normalizzato come il lookup (HMAC-SHA256 con una chiave del backend): 32 byte. Lo calcola il backend: il nome in chiaro non entra mai nel database (nel campo username finiscono anche password digitate per sbaglio).';
              COMMENT ON COLUMN config.nomi_tentati.fallimenti_consecutivi IS
                  'Fallimenti consecutivi su questo nome, da qualunque provenienza: base dell''attesa crescente (script.fn_login_attesa_secondi), come per la credenziale. Un nome inesistente non entra mai, quindi non si azzera: scade con la riga.';
              COMMENT ON COLUMN config.nomi_tentati.ultimo_fallimento_at IS
                  'Orario dell''ultimo fallimento su questo nome: base dell''attesa e della retention (cleanup_at).';
              COMMENT ON COLUMN config.nomi_tentati.cleanup_at IS
                  'Scadenza della riga (framework cleanup_at): ultimo_fallimento_at + ttl della regola CLEANUP_AT. La scrive il trigger alla nascita e la ricalcola la registrazione di ogni fallimento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.nomi_tentati;
