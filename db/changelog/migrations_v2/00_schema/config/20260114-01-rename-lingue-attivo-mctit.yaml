databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260114-01-rename-lingue-attivo-mctit.yaml

  - changeSet:
      id: 20260114-01-rename-lingue-attivo
      author: mctit
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            schemaName: config
            tableName: lingue
        - columnExists:
            schemaName: config
            tableName: lingue
            columnName: attiva
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              ALTER TABLE config.lingue
                RENAME COLUMN attiva TO attivo;

              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'config'
                    AND c.relname = 'ix_cfg_lingue_attiva'
                ) THEN
                  EXECUTE 'ALTER INDEX config.ix_cfg_lingue_attiva RENAME TO ix_cfg_lingue_attivo';
                END IF;
              END $$;
