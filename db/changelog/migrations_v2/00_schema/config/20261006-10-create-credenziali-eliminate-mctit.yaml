# brief-db-elimina-credenziale-senza-veste §4.2 — la TRACCIA dell'eliminazione.
#
# ── ⭐ PERCHE' UNA TABELLA (decisione di Tid, 2026-10-06) ─────────────
#   script.fn_elimina_credenziale cancella la riga di django.auth_user: chi
#   ha eliminato quale credenziale deve restare scritto altrove. Le sedi che
#   esistono non vanno:
#   * dbops.audit_log e' il registro TECNICO delle automazioni: lo scrivono
#     solo dbops e maintenance (cancello dbops.vw_audit_log_scrittori_fuori_perimetro)
#     e scade a 30 giorni;
#   * vendite.event_log e' il diario di dominio, per emittente: una
#     credenziale non appartiene a un emittente.
#   ⇒ Un registro proprio, accanto a config.credenziali.
#
# ── ⛔ NESSUNA FK ──────────────────────────────────────────────────────
#   auth_user_id nomina una riga che NON ESISTE PIU': e' il punto.
#   eliminata_da e' chi agisce (un SUPER_ADMIN, che ha sempre una veste e
#   quindi non si elimina): una FK verso django.auth_user la renderebbe
#   «storia» per la check, e su un'installazione nuova le FK del ponte
#   django non nascono comunque (Liquibase gira prima di manage.py migrate).
#   Un registro di fatti non si fa tenere in ostaggio dalla riga che descrive.
#
# ── POSTURA ───────────────────────────────────────────────────────────
#   Scrive SOLO il verbo (SECURITY DEFINER del proprietario). All'app il
#   solo SELECT: v_tabelle_sola_lettura_app del loop ci_apply 20260205-41,
#   il blocco «POSTURA DICHIARATA» di provision_db_roles.sql e il forward
#   90_end/20261006-15 (linee-guida-sql §11.8, le tre sedi).
#
# ⚠️ Tabella NUOVA: i trigger di audit e tx_id li monta `--contexts=ci_apply`
#   — niente DDL ne' preCondition sui loro nomi; le colonne di audit nascono
#   con i propri DEFAULT.
# ⚠️ Nessuna colonna `storicizza`: un registro append-only non si storicizza.
# ⚠️ Nessuna RLS: le credenziali non hanno un perimetro emittente
#   (config.credenziali non ha RLS); il registro lo legge l'amministrazione.
# ⚠️ Nessun `cleanup_at`: la traccia non scade.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261006-10-create-credenziali-eliminate-mctit.yaml

  - changeSet:
      id: 20261006-10-create-credenziali-eliminate
      author: mctit
      failOnError: true
      comment: >
        Crea config.credenziali_eliminate: la traccia di ogni credenziale
        eliminata da script.fn_elimina_credenziale (id e username della
        credenziale, chi l'ha eliminata, quando). Nessuna FK. Il solo SELECT
        all'app. brief-db-elimina-credenziale-senza-veste §4.2.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: config
                tableName: credenziali_eliminate
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   La traccia di una credenziale eliminata: la riga di
              --   django.auth_user sparisce, chi l'ha eliminata e cosa era
              --   restano qui. Append-only: la scrive solo il verbo.
              -- =========================================================
              CREATE TABLE config.credenziali_eliminate (
                  id              bigint  GENERATED BY DEFAULT AS IDENTITY
                                    CONSTRAINT pk_credenziali_eliminate PRIMARY KEY,
                  auth_user_id    integer NOT NULL,
                  username        text    NOT NULL,
                  email           text    NOT NULL,
                  eliminata_at    timestamp with time zone NOT NULL DEFAULT now(),
                  eliminata_da    integer NOT NULL,
                  data_insert     timestamp with time zone NOT NULL DEFAULT now(),
                  user_insert     text    NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamp with time zone NOT NULL DEFAULT now(),
                  user_update     text    NOT NULL DEFAULT CURRENT_USER,
                  tx_id           uuid    NULL,

                  -- Un id di django.auth_user non si riusa (sequenza), quindi
                  -- una credenziale si elimina una volta sola.
                  CONSTRAINT uq_credenziali_eliminate_auth_user UNIQUE (auth_user_id),

                  CONSTRAINT chk_credenziali_eliminate_auth_user_positivo
                      CHECK (auth_user_id > 0),

                  CONSTRAINT chk_credenziali_eliminate_eliminata_da_positivo
                      CHECK (eliminata_da > 0)
              );

              COMMENT ON TABLE config.credenziali_eliminate IS
                  'La traccia delle credenziali eliminate dall''amministratore (script.fn_elimina_credenziale): la riga di django.auth_user sparisce, chi l''ha eliminata e cosa era restano qui. Append-only: la scrive solo il verbo, SECURITY DEFINER del proprietario; all''app il solo SELECT (linee-guida-sql §11.8: loop ci_apply 20260205-41, provision_db_roles.sql, forward 90_end/20261006-15). ⛔ Nessuna FK: auth_user_id nomina una riga che non esiste piu'', e eliminata_da e'' un SUPER_ADMIN (che ha una veste e non si elimina); una FK verso django.auth_user lo renderebbe storia per script.fn_check_credenziale_eliminabile, e su un''installazione nuova le FK del ponte django non nascono. Nessun cleanup_at: la traccia non scade. Brief: brief-db-elimina-credenziale-senza-veste §4.2 (sede decisa da Tid il 2026-10-06).';

              COMMENT ON COLUMN config.credenziali_eliminate.auth_user_id IS
                  'L''id che la credenziale aveva in django.auth_user. Non e'' una FK: la riga non esiste piu''. UNIQUE: un id di django.auth_user non si riusa.';

              COMMENT ON COLUMN config.credenziali_eliminate.username IS
                  'Lo username della credenziale al momento dell''eliminazione: e'' cio'' che una persona riconosce, l''id da solo non dice piu'' niente.';

              COMMENT ON COLUMN config.credenziali_eliminate.email IS
                  'L''email della credenziale al momento dell''eliminazione, com''era in django.auth_user (stringa vuota se non c''era).';

              COMMENT ON COLUMN config.credenziali_eliminate.eliminata_at IS
                  'Quando la credenziale e'' stata eliminata.';

              COMMENT ON COLUMN config.credenziali_eliminate.eliminata_da IS
                  'Chi l''ha eliminata: l''auth_user_id del SUPER_ADMIN che agiva (app.current_user_id). Non e'' una FK, per la stessa ragione di auth_user_id.';

              -- L'amministrazione la legge come applicazione. Solo
              -- zeroerp_app: i privilegi dei ruoli batch stanno nel
              -- provisioning (linee-guida-sql §11.6). La scrittura all'app
              -- la toglie il forward 90_end/20261006-15.
              GRANT SELECT ON config.credenziali_eliminate TO zeroerp_app;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS config.credenziali_eliminate;
