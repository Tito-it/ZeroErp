# Liquibase changelog per Zero ERP
# Crea tabella config.stati_fornitore — stati operativi dei
# fornitori (pattern allineato a config.stati_cliente).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/config/20260324-21-create-stati-fornitore-mctit.yaml

  - changeSet:
      id: 20260324-21-create-stati-fornitore
      author: mctit
      comment: >
        Crea config.stati_fornitore con struttura standard config:
        codice, codice_interno, descrizione, descrizione_breve,
        attivo, blocca_ordini, audit.
        Stati previsti: VE (in verifica), AT (attivo), SO (sospeso),
        CE (cessato), BL (blacklist).
      changes:
        - createTable:
            schemaName: config
            tableName: stati_fornitore
            remarks: "Stati operativi dei fornitori. blocca_ordini impedisce nuovi ordini/DDT."
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_stati_fornitore
                    nullable: false

              - column:
                  name: codice
                  type: character varying(10)
                  remarks: "Codice univoco leggibile."
                  constraints:
                    nullable: false

              - column:
                  name: codice_interno
                  type: character varying(10)
                  remarks: "Codice interno immutabile (usato nel codice applicativo)."
                  constraints:
                    nullable: false

              - column:
                  name: descrizione
                  type: character varying(100)
                  defaultValue: ""
                  remarks: "Descrizione estesa per interfaccia."
                  constraints:
                    nullable: false

              - column:
                  name: descrizione_breve
                  type: character varying(20)
                  remarks: "Descrizione breve per liste e badge."
                  constraints:
                    nullable: false

              - column:
                  name: attivo
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Flag attivazione logica dello stato."
                  constraints:
                    nullable: false

              - column:
                  name: blocca_ordini
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Se true, impedisce creazione ordini/DDT verso il fornitore."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_fornitore
            columnNames: codice
            constraintName: uq_stati_fornitore_codice

        - addUniqueConstraint:
            schemaName: config
            tableName: stati_fornitore
            columnNames: codice_interno
            constraintName: uq_stati_fornitore_codice_interno

      rollback:
        - dropTable:
            schemaName: config
            tableName: stati_fornitore
