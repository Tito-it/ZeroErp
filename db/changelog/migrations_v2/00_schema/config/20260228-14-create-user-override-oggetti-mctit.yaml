# Liquibase changelog per Zero ERP
# Tabella config.user_override_oggetti — override individuale su singolo model
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20260228-14-create-user-override-oggetti-mctit.yaml

  - changeSet:
      id: 20260228-14-create-user-override-oggetti
      author: mctit
      comment: >
        Override individuale su singolo model Django.
        Sovrascrive sia il profilo reparto che l'override area.
        Esempio: utente ha TUTTO su anagrafiche ma LETTURA su anagrafiche.clienti.

      changes:
        - createTable:
            schemaName: config
            tableName: user_override_oggetti
            remarks: "Override individuale su singolo model. Sovrascrive sia reparto che override area."
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: BY DEFAULT
                  remarks: "PK tecnica."
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_override_oggetti
                    nullable: false

              - column:
                  name: auth_user_id
                  type: integer
                  remarks: "FK -> django.auth_user.id — utente."
                  constraints:
                    nullable: false

              - column:
                  name: app_label
                  type: VARCHAR(100)
                  remarks: "Label app Django (es. anagrafiche, vendite)."
                  constraints:
                    nullable: false

              - column:
                  name: model_name
                  type: VARCHAR(100)
                  remarks: "Nome model Django (es. clienti, fatture)."
                  constraints:
                    nullable: false

              - column:
                  name: livello
                  type: config.livello_accesso
                  remarks: "Livello di accesso che sovrascrive area e reparto."
                  constraints:
                    nullable: false

              - column:
                  name: motivo
                  type: text
                  remarks: "Governance: motivazione dell'override."
                  constraints:
                    nullable: true

              - column:
                  name: valido_dal
                  type: date
                  defaultValueComputed: "CURRENT_DATE"
                  remarks: "Inizio validita' dell'override."
                  constraints:
                    nullable: true

              - column:
                  name: valido_al
                  type: date
                  remarks: "Fine validita' (NULL = indeterminato)."
                  constraints:
                    nullable: true

              - column:
                  name: meta
                  type: jsonb
                  defaultValueComputed: "'{}'::jsonb"
                  remarks: "Metadati estendibili."
                  constraints:
                    nullable: false

              - column:
                  name: data_insert
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente inserimento."
                  constraints:
                    nullable: false

              - column:
                  name: data_update
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  remarks: "Audit: timestamp ultima modifica."
                  constraints:
                    nullable: false

              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente ultima modifica."
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            schemaName: config
            tableName: user_override_oggetti
            columnNames: auth_user_id, app_label, model_name
            constraintName: uq_user_override_oggetti_user_app_model

        - createIndex:
            schemaName: config
            tableName: user_override_oggetti
            indexName: ix_user_override_oggetti_auth_user_id
            columns:
              - column:
                  name: auth_user_id

        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.user_override_oggetti
              ADD CONSTRAINT chk_user_override_oggetti_validita
              CHECK (valido_al IS NULL OR valido_dal IS NULL OR valido_al >= valido_dal);

              COMMENT ON TABLE config.user_override_oggetti IS
              'Override individuale su singolo model Django.
               Sovrascrive sia il profilo reparto che l''override area.
               Esempio: utente ha TUTTO su anagrafiche ma LETTURA su anagrafiche.clienti.';

      rollback:
        - dropTable:
            schemaName: config
            tableName: user_override_oggetti
