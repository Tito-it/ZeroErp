databaseChangeLog:
  
  # 20251005-28 — CREATE config.tipi_ubicazione
  - changeSet:
      id: 20251005-28-create-config-tipi-ubicazione
      author: mctit
      logicalFilePath: migrations_v2/00_schema/config/20251005-28-create-config-tipi-ubicazione.yaml
      changes:
        - createTable:
            schemaName: config
            tableName: tipi_ubicazione
            remarks: "Dominio tipi di ubicazione/bin di magazzino"
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, generationType: BY DEFAULT,
                          constraints: { primaryKey: true, primaryKeyName: pk_cfg_tipi_ubicazione, nullable: false } }

              - column: { name: codice_interno, type: VARCHAR(32), constraints: { nullable: false }, remarks: "Codice interno immutabile" }
              - column: { name: codice, type: VARCHAR(32), constraints: { nullable: false }, remarks: "Codice stabile (es. STORAGE, PICK…)" }
              - column: { name: descrizione, type: VARCHAR(120), remarks: "Descrizione (IT)" }

              - column: { name: attivo, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: ordine, type: SMALLINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: meta, type: JSONB, defaultValueComputed: "'{}'::jsonb", constraints: { nullable: false } }

              # Audit
              - column: { name: data_insert, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_insert, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER", constraints: { nullable: false } }
              - column: { name: data_update, type: TIMESTAMPTZ, defaultValueComputed: "now()", constraints: { nullable: false } }
              - column: { name: user_update, type: VARCHAR(80), defaultValueComputed: "CURRENT_USER" }

        - addUniqueConstraint:
            schemaName: config
            tableName: tipi_ubicazione
            columnNames: codice_interno
            constraintName: uq_cfg_tipi_ubicazione_codice_interno

        - addUniqueConstraint:
            schemaName: config
            tableName: tipi_ubicazione
            columnNames: codice
            constraintName: uq_cfg_tipi_ubicazione_codice

        - createIndex: { schemaName: config, tableName: tipi_ubicazione, indexName: ix_cfg_tipi_ubicazione_attivo, columns: [ { name: attivo } ] }
        - createIndex: { schemaName: config, tableName: tipi_ubicazione, indexName: ix_cfg_tipi_ubicazione_ordine, columns: [ { name: ordine } ] }

        - createIndex:
            schemaName: config
            tableName: tipi_ubicazione
            indexName: ix_tipi_ubicazione_codice_upper
            columns:
              - column:
                  name: "upper(codice)"
                  descending: false

        - createIndex:
            schemaName: config
            tableName: tipi_ubicazione
            indexName: ix_tipi_ubicazione_codice_interno_upper
            columns:
              - column:
                  name: "upper(codice_interno)"
                  descending: false

        - createIndex:
            schemaName: config
            tableName: tipi_ubicazione
            indexName: ix_tipi_ubicazione_descrizione_upper
            columns:
              - column:
                  name: "upper(descrizione)"
                  descending: false


        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              COMMENT ON TABLE config.tipi_ubicazione IS 'Dominio tipi di ubicazione/bin per i magazzini.';
              COMMENT ON COLUMN config.tipi_ubicazione.codice_interno IS 'Codice interno immutabile.';
              COMMENT ON COLUMN config.tipi_ubicazione.codice IS 'Codice stabile (es. STORAGE, PICK, STAGING, IN_TRANSIT, BUFFER, DAMAGED).';


