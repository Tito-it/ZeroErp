# L'AZIONE DELL'OFFERTA STA SULLA RIGA DEL PASSAGGIO (M-3)
#   Brief: brief-modello-documento-vendita §13 (giro 9; O-1 di Tid,
#   2026-10-26). Stessa colonna di bolla, reso, preventivo, ordine e
#   contratto (20261025-08, -38, -73, 20261026-03).
#
# ── LA REGOLA ───────────────────────────────────────────────────────
#   Una sola azione per documento, sui passaggi pesanti (M-4, guida §6):
#   l'emissione (BOZZA -> EMESSA) e l'annullo di un'offerta accettata
#   (ACCETTATA -> ANNULLATA). L'azione e' NUOVA, emetti_offerta (O-1).
#   Accetta e rifiuta chiedono solo il permesso sul documento, come
#   l'annullo della bozza.
#
# ── LA COLONNA ──────────────────────────────────────────────────────
#   azione_processo_codename, FK verso config.azioni_processo.permission_codename.
#   NULL = nessuna azione. I valori stanno nel CSV della matrice (80_data,
#   mirror 20260524-22), non qui (§11.2). Il nome della matrice resta fuori
#   serie (stati_doc_offerte_transizioni): O-5, divergenza dichiarata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/config/20261026-14-alter-stati-doc-offerte-transizioni-azione-processo-mctit.yaml

  - changeSet:
      id: 20261026-14-alter-stati-doc-offerte-transizioni-azione-processo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Colonna azione_processo_codename (FK a config.azioni_processo.permission_codename,
        NULL = nessuna azione) su config.stati_doc_offerte_transizioni: l'azione di processo che
        il passaggio chiede (M-3). Brief: brief-modello-documento-vendita §13.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists: { schemaName: config, tableName: stati_doc_offerte_transizioni }
            - tableExists: { schemaName: config, tableName: azioni_processo }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE config.stati_doc_offerte_transizioni
                  ADD COLUMN azione_processo_codename varchar(100),
                  ADD CONSTRAINT fk_stati_doc_offerte_transizioni_azioni_processo
                      FOREIGN KEY (azione_processo_codename)
                      REFERENCES config.azioni_processo (permission_codename);

              COMMENT ON COLUMN config.stati_doc_offerte_transizioni.azione_processo_codename IS
                  'L''azione di processo che questo passaggio chiede (config.azioni_processo.permission_codename); NULL = basta il permesso sul documento, che controlla il backend. La leggono i verbi (script.fn_guard_passaggio, E_PERMESSO_NEGATO), il backend (403 prima della transazione) e la capability (il bottone si nasconde a chi non ha l''azione), tutti da script.fn_doc_passaggio. Una sola azione per documento, sui passaggi pesanti: l''emissione (BOZZA -> EMESSA) e l''annullo dell''accettata (ACCETTATA -> ANNULLATA); accetta e rifiuta col solo permesso sul documento (guida del modello §6). Il valore sta nel CSV della matrice. Brief: brief-modello-documento-vendita §13 (M-3, O-1, Tid 2026-10-24/26).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE config.stati_doc_offerte_transizioni DROP COLUMN IF EXISTS azione_processo_codename;
