# Bonifica riferimenti morti — IL REGISTRO DEL DEBITO
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md §5
#
# ── PERCHE' UNA TABELLA E NON UN FILE ────────────────────────────────────
#   Il registro lo leggono in **due**: il pgTAP
#   `db/pgtap/dbops/test-riferimenti-morti-v1.sql` e il guardrail della CI
#   `scripts/sql/guardrail_riferimenti_morti.sql`. Se vivesse in un file di
#   testo, uno dei due dovrebbe ricopiarlo — e il giorno in cui le due copie
#   divergono, la CI e lo sviluppo danno risposte diverse sullo stesso
#   difetto. Una fonte sola, nel DB, versionata da Liquibase.
#
# ── ⚠️ E' UN DEBITO, NON UN ELENCO DI ECCEZIONI ─────────────────────────
#   Stessa filosofia dichiarata per `db/pgtap/baseline-rossi.tsv`: **deve
#   calare**. Due presidi lo tengono onesto, e sono in due posti diversi
#   apposta:
#
#     · «senza motivo non si registra» -> qui, come CHECK. Non e' un test
#       che si puo' dimenticare di lanciare: e' il DB che rifiuta la riga.
#       Quaranta caratteri non sono una soglia arbitraria — sono la
#       lunghezza sotto la quale non ci sta una spiegazione, ci sta solo
#       un'etichetta («da vedere», «legacy», «poi»).
#     · «una voce rientrata va tolta» -> nel pgTAP (test 3), perche' per
#       saperlo bisogna ri-misurare, e una misura non e' un vincolo.
#
#   Senza il secondo, un registro puo' solo allungarsi, e un registro che
#   si allunga e basta e' il posto dove i problemi vanno a sparire — cioe'
#   esattamente il changeSet `20260331-26` («Da verificare se la funzione
#   va rimossa dal DB») da cui e' nato tutto questo.
#
# ── LE COLONNE ───────────────────────────────────────────────────────────
#   `esito_like` e' un pattern LIKE, non il messaggio esatto: il testo di
#   plpgsql_check contiene numeri di riga, che si spostano a ogni modifica
#   della funzione. Registrare il messaggio intero vorrebbe dire riscrivere
#   il registro a ogni ritocco. Il pattern deve pero' restare **specifico**:
#   un `%` da solo esenterebbe la funzione da qualunque difetto futuro.
#
#   ⚠️ Tabella tecnica: PK `INTEGER GENERATED BY DEFAULT AS IDENTITY`, non
#   UUID (linee-guida-sql: UUID per le entita' master).
#   I trigger di audit/tx_id/storico li mette l'automazione notturna
#   (`ci_apply`): su un migrate manuale la tabella nasce senza, ed e'
#   atteso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260804-63-create-riferimenti-morti-esenzioni-mctit.yaml

  - changeSet:
      id: 20260804-63-create-riferimenti-morti-esenzioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Registro del debito sui riferimenti morti: le voci REALE/ORFANA note e
        motivate, lette sia dal pgTAP sia dal guardrail CI. Il motivo e'
        obbligatorio per CHECK, non per convenzione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS dbops.riferimenti_morti_esenzioni (
                  id                 INTEGER GENERATED BY DEFAULT AS IDENTITY,
                  schema_nome        TEXT NOT NULL,
                  funzione           TEXT NOT NULL,
                  -- Pattern LIKE sul messaggio di plpgsql_check: il testo
                  -- contiene numeri di riga, che si spostano a ogni modifica
                  -- della funzione.
                  esito_like         TEXT NOT NULL,
                  -- ⚠️ Il cuore del registro. Deve dire PERCHE' il difetto e'
                  -- ancora li' e COSA lo toglierebbe.
                  motivo             TEXT NOT NULL,
                  data_registrazione DATE NOT NULL DEFAULT CURRENT_DATE,
                  data_insert        TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_insert        TEXT NOT NULL DEFAULT CURRENT_USER,
                  data_update        TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_update        TEXT NOT NULL DEFAULT CURRENT_USER,
                  tx_id              UUID,
                  CONSTRAINT pk_riferimenti_morti_esenzioni PRIMARY KEY (id),
                  CONSTRAINT uq_riferimenti_morti_esenzioni_voce
                      UNIQUE (schema_nome, funzione, esito_like),
                  -- «Una voce senza motivo non si aggiunge»: qui non e' una
                  -- raccomandazione, e' il DB che rifiuta la riga.
                  CONSTRAINT chk_riferimenti_morti_esenzioni_motivo
                      CHECK (length(btrim(motivo)) >= 40),
                  -- Un pattern troppo largo esenterebbe la funzione da
                  -- qualunque difetto futuro, non solo da quello registrato.
                  CONSTRAINT chk_riferimenti_morti_esenzioni_pattern
                      CHECK (length(btrim(replace(esito_like, '%', ''))) >= 8)
              );

              COMMENT ON TABLE dbops.riferimenti_morti_esenzioni IS
              'Registro del debito sui riferimenti morti nelle funzioni plpgsql: voci REALE/ORFANA note e motivate. E'' un debito, non un elenco di eccezioni: deve calare. Letto da db/pgtap/dbops/test-riferimenti-morti-v1.sql e da scripts/sql/guardrail_riferimenti_morti.sql.';

              COMMENT ON COLUMN dbops.riferimenti_morti_esenzioni.esito_like IS
              'Pattern LIKE sul messaggio di plpgsql_check (il testo contiene numeri di riga, che si spostano). Deve restare specifico: un pattern largo esenta da difetti futuri.';

              COMMENT ON COLUMN dbops.riferimenti_morti_esenzioni.motivo IS
              'Perche'' il difetto e'' ancora li'' e cosa lo toglierebbe. Obbligatorio per CHECK (>= 40 caratteri).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.riferimenti_morti_esenzioni;
