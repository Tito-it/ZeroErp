# L'ETICHETTA DI UN SOGGETTO DI PROVA
#   NASCE dbops.soggetti_di_prova: una riga per ogni soggetto creato dal verbo
#   dei dati di sviluppo (emittenti, clienti, fornitore, persone).
#   Brief: brief-db-processi-accensione-per-ambiente, R-4 (§4-ter, §5-ter.2, 2b-3).
#
# -- PERCHE' --------------------------------------------------------
#   I dati di prova non si etichettano riga per riga (Tid): una colonna in
#   decine di tabelle si dimentica alla prima tabella nuova. Si etichettano le
#   RADICI, e contratti, BA e documenti si ritrovano dalla radice a cui sono
#   legati.
#
# -- LA SEDE: dbops (come dbops.credenziali_di_prova, 20261018-55) -----
#   Dato di macchina del provisioning; le automazioni di ci_apply non coprono
#   dbops. La FK verso anagrafiche.soggetti c'e': soggetti e etichette nascono
#   nello stesso mondo, anche in CI.
#
# -- LA FORMA -------------------------------------------------------
#   soggetto_id chiave; `chiave` = il codice di prova (DEV-EMITTENTE-A,
#   DEV-CLIENTE-1, DEV-PERSONA-SMOKE...), UNIQUE: la seconda corsa del verbo
#   ritrova il soggetto da qui. Solo l'audit di nascita. Non si toglie e non
#   cambia; in PRODUZIONE non nasce (guard 20261018-58/-59). L'app la legge e
#   non la scrive.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261018-56-create-dbops-soggetti-di-prova-mctit.yaml

  - changeSet:
      id: 20261018-56-create-dbops-soggetti-di-prova
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.soggetti_di_prova: l'etichetta di un soggetto creato dal verbo dei dati di sviluppo
        (una riga per soggetto, chiave = il codice di prova). Brief:
        brief-db-processi-accensione-per-ambiente (R-4, 2b-3).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: dbops
                tableName: soggetti_di_prova
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.soggetti_di_prova (
                  soggetto_id uuid        NOT NULL,
                  chiave      text        NOT NULL,
                  data_insert timestamptz NOT NULL DEFAULT now(),
                  user_insert text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_soggetti_di_prova PRIMARY KEY (soggetto_id),
                  CONSTRAINT uq_soggetti_di_prova_chiave UNIQUE (chiave),
                  CONSTRAINT chk_soggetti_di_prova_chiave CHECK (btrim(chiave) <> ''),
                  CONSTRAINT fk_soggetti_di_prova_soggetto
                      FOREIGN KEY (soggetto_id) REFERENCES anagrafiche.soggetti (id)
              );

              COMMENT ON TABLE dbops.soggetti_di_prova IS
                  'L''etichetta di un soggetto di prova: una riga per ogni soggetto creato dal verbo dei dati di sviluppo (anagrafiche.fn_provisiona_dati_di_sviluppo), nella stessa transazione: gli emittenti, i clienti, il fornitore, le persone dietro le credenziali. Si etichettano le radici, non le righe: contratti, BA e documenti si ritrovano dalla radice a cui sono legati. Non cambia e non si toglie; in un''installazione PRODUZIONE non nasce (guard dbops.trgfn_etichette_di_prova_guard). L''app la legge e non la scrive. Il presidio dbops.vw_radici_di_prova_in_produzione la guarda. Brief: brief-db-processi-accensione-per-ambiente (R-4).';
              COMMENT ON COLUMN dbops.soggetti_di_prova.soggetto_id IS
                  'Il soggetto (anagrafiche.soggetti.id). Chiave: un soggetto ha un''etichetta sola.';
              COMMENT ON COLUMN dbops.soggetti_di_prova.chiave IS
                  'Il codice di prova (DEV-EMITTENTE-A, DEV-CLIENTE-1, DEV-PERSONA-SMOKE...). UNIQUE: la seconda corsa del verbo ritrova il soggetto da qui, non dal nome.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS dbops.soggetti_di_prova;
