# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/dbops/20260206-01-create-idempotency-keys-mctit.yaml

  - changeSet:
      id: 20260206-01-create-idempotency-keys
      author: mctit
      comment: >
        Tabella tecnica per idempotency key con payload risposta e cleanup_at.
      changes:
        - createTable:
            schemaName: dbops
            tableName: idempotency_keys
            remarks: "Mappa Idempotency-Key -> tx_id e risposta salvata, con stato e cleanup."
            columns:
              - column:
                  name: idempotency_key
                  type: text
                  remarks: "Chiave idempotenza inviata dal client."
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_idempotency_keys
              - column:
                  name: request_id
                  type: uuid
                  remarks: "Correlation/request id applicativo (se disponibile)."
              - column:
                  name: tx_id
                  type: uuid
                  remarks: "Transaction id DB collegata all'operazione."
              - column:
                  name: status
                  type: text
                  remarks: "Stato idempotenza: in_progress|completed|failed."
                  constraints:
                    nullable: false
              - column:
                  name: response_payload
                  type: jsonb
                  remarks: "Risposta serializzata per replay idempotente."
              - column:
                  name: cleanup_at
                  type: timestamptz
                  remarks: "Timestamp programmato per la pulizia del record."
              - column:
                  name: data_insert
                  type: timestamptz
                  defaultValueComputed: "now()"
                  remarks: "Audit: inserimento."
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente inserimento."
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamptz
                  defaultValueComputed: "now()"
                  remarks: "Audit: aggiornamento."
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente aggiornamento."
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: dbops
            tableName: idempotency_keys
            indexName: ix_idempotency_keys_cleanup_at
            columns:
              - column:
                  name: cleanup_at

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE dbops.idempotency_keys
                ADD CONSTRAINT chk_idempotency_keys_status
                CHECK (status IN ('in_progress','completed','failed'));

              ALTER TABLE dbops.idempotency_keys
                ADD CONSTRAINT chk_idempotency_keys_txid_completed
                CHECK (status <> 'completed' OR tx_id IS NOT NULL);

              COMMENT ON TABLE dbops.idempotency_keys
                IS 'Gestione idempotency key: stato, tx_id, risposta e cleanup programmato.';
