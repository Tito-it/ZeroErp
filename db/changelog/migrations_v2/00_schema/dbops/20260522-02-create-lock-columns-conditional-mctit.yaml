#
# Crea dbops.lock_columns_conditional: registro dichiarativo dei
# lock condizionali (dipendenti dallo stato della riga) su colonne
# di entita' applicative.
#
# Complementare a dbops.automation_lock_columns (lock statici):
#   - automation_lock_columns: "colonna X e' sempre immutabile"
#   - lock_columns_conditional: "colonna X e' immutabile SE condition_expr"
#
# condition_expr: snippet SQL booleano con $1 placeholder per l'id
# della riga (passato come text; il cast a tipo target e' a carico
# dell'espressione, es. prodotto_id = $1::uuid).
#
# La colonna e' scrivibile SOLO via migration: nessuna API espone
# questa tabella. Il code review e' la protezione principale.
# Non viene aggiunto un validation trigger (falsa sicurezza:
# EXPLAIN verifica sintassi ma non runtime type mismatch).
#
# PK surrogata (identity) + UNIQUE su (schema, table, col, expr)
# per prevenire duplicati testuali; duplicati semantici (whitespace)
# sono prevenuti dal code review.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260522-02-create-lock-columns-conditional-mctit.yaml

  - changeSet:
      id: 20260522-02-create-lock-columns-conditional
      author: mctit
      comment: >
        Crea dbops.lock_columns_conditional: registro lock condizionali
        per colonne la cui immutabilita' dipende dallo stato della riga.
        Complementare ad automation_lock_columns (lock statici).
        Consumato da dbops.fn_non_editable_fields (migration 20260522-03).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.lock_columns_conditional (
                  id          INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  schema_name TEXT    NOT NULL,
                  table_name  TEXT    NOT NULL,
                  column_name TEXT    NOT NULL,
                  -- Snippet SQL booleano. $1 = id riga (text); castare a tipo target.
                  -- Es: 'EXISTS (SELECT 1 FROM t WHERE fk = $1::uuid AND attivo IS TRUE)'
                  condition_expr TEXT NOT NULL,
                  descrizione TEXT,
                  enabled     BOOLEAN NOT NULL DEFAULT TRUE,
                  data_insert TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_insert TEXT        NOT NULL DEFAULT CURRENT_USER,
                  data_update TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_update TEXT        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_lock_columns_conditional
                      UNIQUE (schema_name, table_name, column_name, condition_expr)
              );

              COMMENT ON TABLE dbops.lock_columns_conditional IS
                  'Registro lock condizionali: colonne immutabili SE condition_expr '
                  'valutata sul record indicato da $1 (id come text) ritorna TRUE. '
                  'Complementare a dbops.automation_lock_columns (lock statici). '
                  'Scrivibile solo via migration. rev 2026-05-22.';

              COMMENT ON COLUMN dbops.lock_columns_conditional.condition_expr IS
                  'Snippet SQL booleano. $1 = id riga passato come text. '
                  'Il cast al tipo PK target e'' a carico dell''espressione '
                  '(es. prodotto_id = $1::uuid). Nessun % ammesso (incompatibile '
                  'con format()). Non contenere DDL o side effects.';
      rollback:
        - sql:
            sql: DROP TABLE IF EXISTS dbops.lock_columns_conditional;
