# Liquibase changelog per Zero ERP
# Crea tabella dbops.automation_lock_columns
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/dbops/20260110-11-create-automation-lock-columns-mctit.yaml

  - changeSet:
      id: 20260110-11-create-automation-lock-columns
      author: mctit
      comment: >
        Crea la tabella dbops.automation_lock_columns per configurare colonne
        extra da bloccare con script.trgfn_lock_columns. La colonna
        "codice_interno" non si configura qui: se presente in tabella viene
        gestita automaticamente dal runner.
      changes:
        - createTable:
            schemaName: dbops
            tableName: automation_lock_columns
            remarks: Configura colonne extra da bloccare (codice_interno e' implicito).
            columns:
              - column:
                  name: target_schema
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: target_table
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: column_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: error_code
                  type: text
                  defaultValue: CODICE_NON_MODIFICABILE
                  constraints:
                    nullable: false
              - column:
                  name: exec_mode
                  type: text
                  defaultValue: AUTO
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: text
              - column:
                  name: data_insert
                  type: timestamptz
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamptz
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  constraints:
                    nullable: false

        - addPrimaryKey:
            schemaName: dbops
            tableName: automation_lock_columns
            columnNames: target_schema,target_table,column_name
            constraintName: pk_automation_lock_columns
