# brief-db-presidio-processi-testo-per-causa §5.5 — decisione (b) di Tid,
# 2026-10-09: la CAUSA e' un'entita', e dice a chi tocca.
#
# ── ⭐ IL DIFETTO DEL §1, UN LIVELLO SOPRA ───────────────────────────
#   Il 20261009-32/-33 ha dato un testo a ogni causa. Ma «a chi tocca» restava
#   un valore per PRESIDIO (dbops.presidi.chi_agisce): il presidio dei processi
#   e' SISTEMISTA, e due cause su otto (NON_PROGRAMMATO, GIRA_E_NON_REGISTRA)
#   toccano allo SVILUPPO. Lo diceva solo la frase, mentre il COMMENT di
#   chi_agisce lo vuole un DATO perche' il pannello distingua «tocca a te» da
#   «inoltra» e il digest raggruppi. Un valore unico per righe diverse e' lo
#   stesso errore del testo unico.
#   ⇒ dbops.presidi_cause (vista, causa, chi_agisce): il catalogo delle cause di
#     un presidio che dichiara colonna_variante. I testi restano figli, per
#     lingua: FK (vista, variante) → (vista, causa).
#
# ── ⛔ LA FK NASCE NOT VALID, E SI CONVALIDA IN 90_end ───────────────
#   Su dbdev il 20261009-33 e il mirror dei testi sono gia' applicati: otto
#   righe di variante esistono, e qui il catalogo delle cause e' ancora vuoto.
#   Una FK convalidata subito fallirebbe. NOT VALID la fa valere da ORA su ogni
#   scrittura nuova; 90_end/20261009-37 la convalida dopo il seed.
#   ⭐ L'ORDINE DEL SEED: le cause le carica lo STESSO changeSet che carica i
#   testi (80_data/20261006-06), come primo passo. Un mirror nuovo, numerato
#   oggi, girerebbe DOPO quello dei testi (in 80_data l'ordine e' il nome del
#   file): la prossima causa aggiunta ai due CSV insieme farebbe fallire il
#   mirror dei testi sulla FK. Su un database da zero la tabella esiste gia'
#   (00_schema viene prima di 80_data).
#   ⚠️ MATCH SIMPLE (il default): la riga generica ha variante NULL e la FK
#   non la guarda — e' giusto, il generico non e' una causa.
#
# ── ⛔ IL DOMINIO DI chi_agisce E' SCRITTO IN DUE POSTI ──────────────
#   Lo stesso CHECK di dbops.presidi.chk_presidi_chi_agisce. Una tabella di
#   vocabolario per tre valori sarebbe sproporzionata; la seconda copia la tiene
#   allineata il pgTAP dbops/test-presidi-testi-v1 (test 15), che confronta le
#   due definizioni da pg_constraint.
#
# ⚠️ Tabella NUOVA, catalogo puro, come dbops.presidi_testi: nessuna RLS,
#   nessuna colonna `storicizza`, colonne di audit coi DEFAULT (i trigger li
#   monta ci_apply: niente DDL ne' preCondition sui loro nomi). Nessun dato di
#   macchina ⇒ nessun `context: dati_macchina`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261009-36-create-presidi-cause-mctit.yaml

  - changeSet:
      id: 20261009-36-create-presidi-cause
      author: mctit
      failOnError: true
      comment: >
        Crea dbops.presidi_cause (vista, causa, chi_agisce): le cause di un
        presidio che sceglie il testo per riga, ognuna con chi la spegne. FK
        NOT VALID da dbops.presidi_testi (vista, variante), convalidata in
        90_end/20261009-37. brief-db-presidio-processi-testo-per-causa §5.5 (b).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: dbops
            tableName: presidi
        - columnExists:
            schemaName: dbops
            tableName: presidi_testi
            columnName: variante
        - not:
            - tableExists:
                schemaName: dbops
                tableName: presidi_cause
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Il catalogo delle cause di un presidio le cui righe sono
              --   guasti diversi: ogni causa dice a chi tocca spegnerla. Il
              --   testo per chi agisce resta in dbops.presidi_testi, per
              --   lingua, figlio della causa.
              -- =========================================================
              CREATE TABLE dbops.presidi_cause (
                  id              integer GENERATED BY DEFAULT AS IDENTITY
                                    CONSTRAINT pk_presidi_cause PRIMARY KEY,
                  vista           text    NOT NULL,
                  causa           text    NOT NULL,
                  chi_agisce      text    NOT NULL,
                  data_insert     timestamp with time zone NOT NULL DEFAULT now(),
                  user_insert     text    NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamp with time zone NOT NULL DEFAULT now(),
                  user_update     text    NOT NULL DEFAULT CURRENT_USER,
                  tx_id           uuid    NULL,

                  -- ⭐ Chiave naturale, ed e' anche il bersaglio della FK dei
                  --   testi. Copre la FK su `vista` per prefisso.
                  CONSTRAINT uq_presidi_cause_vista_causa UNIQUE (vista, causa),

                  CONSTRAINT fk_presidi_cause_presidi
                      FOREIGN KEY (vista) REFERENCES dbops.presidi (vista)
                      ON UPDATE CASCADE,

                  CONSTRAINT chk_presidi_cause_causa_non_vuota
                      CHECK (btrim(causa) <> ''),

                  -- ⛔ Stesso dominio di dbops.presidi.chk_presidi_chi_agisce:
                  --   la copia la tiene allineata il pgTAP (vedi intestazione).
                  CONSTRAINT chk_presidi_cause_chi_agisce
                      CHECK (chi_agisce IN ('AMMINISTRATORE', 'SISTEMISTA', 'SVILUPPO'))
              );

              COMMENT ON TABLE dbops.presidi_cause IS
                  'Le cause di un presidio le cui righe sono guasti DIVERSI (dbops.presidi.colonna_variante valorizzata), ognuna con CHI la spegne. ⭐ La causa e'' un''entita'': ha il suo «a chi tocca» (chi_agisce, stesso dominio di dbops.presidi.chi_agisce) e i suoi testi per lingua (dbops.presidi_testi, FK (vista, variante) → (vista, causa)). Nasce perche'' un valore di chi_agisce per presidio e'' sbagliato per alcune righe esattamente come lo era un testo unico: il presidio dei processi e'' SISTEMISTA, ma NON_PROGRAMMATO e GIRA_E_NON_REGISTRA toccano allo SVILUPPO. dbops.presidi.chi_agisce resta il valore del presidio nel suo insieme. Completezza nei pgTAP: le cause stanno solo sui presidi che dichiarano colonna_variante, ognuna ha il testo `it` (dbops/test-presidi-testi-v1); il catalogo coincide con le cause che la vista puo'' produrre (il test del presidio). Seed: 80_data/sql/dbops/presidi_cause.csv, caricato dal mirror dei testi PRIMA dei testi. Brief: brief-db-presidio-processi-testo-per-causa §5.5 (b).';

              COMMENT ON COLUMN dbops.presidi_cause.vista IS
                  'Il presidio, per la sua chiave naturale (dbops.presidi.vista), come in dbops.presidi_testi. ON UPDATE CASCADE; nessuna azione in cancellazione.';

              COMMENT ON COLUMN dbops.presidi_cause.causa IS
                  'Il valore che la colonna dbops.presidi.colonna_variante della vista assume sulle righe con questa causa (per il presidio dei processi: dbops.vw_processi_programmazione_da_guardare.causa). Non vuota per vincolo.';

              COMMENT ON COLUMN dbops.presidi_cause.chi_agisce IS
                  'Chi puo'' spegnere le righe con questa causa: AMMINISTRATORE (dall''applicazione), SISTEMISTA (server, servizi, schedulatori, ruoli del database), SVILUPPO (serve una modifica al codice o al database). Il pannello lo mostra accanto alla riga e il digest raggruppa per esso, al posto di dbops.presidi.chi_agisce. Obbligatoria: una causa senza chi la spegne non si scrive.';

              -- ⭐ I testi di variante sono figli della causa. NOT VALID: su
              --   dbdev le varianti esistono gia' e le cause no (intestazione).
              ALTER TABLE dbops.presidi_testi
                  ADD CONSTRAINT fk_presidi_testi_presidi_cause
                  FOREIGN KEY (vista, variante)
                  REFERENCES dbops.presidi_cause (vista, causa)
                  ON UPDATE CASCADE
                  NOT VALID;

              -- Il pannello e il digest la leggono come applicazione. Solo
              -- zeroerp_app: i privilegi dei ruoli batch stanno nel
              -- provisioning (linee-guida-sql §11.6).
              GRANT SELECT ON dbops.presidi_cause TO zeroerp_app;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE dbops.presidi_testi
                  DROP CONSTRAINT IF EXISTS fk_presidi_testi_presidi_cause;
              DROP TABLE IF EXISTS dbops.presidi_cause;
