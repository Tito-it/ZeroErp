# OGNI CORSA DEL PROCESSO E' UN VERDETTO COMPLETO?
#   dbops.processi.corsa_verdetto_completo
#   Brief: brief-db-intermittente-e-verdetto-completo (§4.1, §4.4, D1, D4)
#
# -- PERCHE' QUI ----------------------------------------------------
#   maintenance.vw_job_run_da_guardare tiene acceso un lavoro «intermittente»
#   per sette giorni dopo un rosso, anche se l'ultima corsa e' verde. Per un
#   lavoro che a ogni corsa ricontrolla TUTTO il suo perimetro (lo smoke
#   notturno rifa' tutti gli smoke contro la baseline) il verde di oggi
#   SOSTITUISCE il rosso di ieri: tenerlo acceso e' un falso allarme. La vista
#   non puo' indovinarlo: e' una proprieta' della natura del processo, come
#   causa_fallimento e tolleranza_minuti, e si dichiara qui.
#
# -- ⭐ COSA SPEGNE, E COSA NO (D4 = B) ------------------------------
#   Spegne solo il rosso GIA' RIENTRATO una volta. Un verdetto completo che
#   nei sette giorni e' ricaduto dopo essere tornato verde e' INSTABILE, e resta
#   nella vista: e' il caso di sync_auth_user_active (29 rossi in un giorno),
#   che riallineava tutti gli utenti a ogni corsa, cioe' era anch'esso un
#   verdetto completo. La regola sta nella vista (20261018-02).
#
# -- NOT NULL DEFAULT false, IN UN PASSO ----------------------------
#   Il default e' una costante: nessuna dipendenza da 80_data. false e' il lato
#   sicuro, il comportamento di prima: chi non dichiara resta com'era. I valori
#   veri li dice il CSV (mirror 20260904-13).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261018-01-alter-processi-add-corsa-verdetto-completo-mctit.yaml

  - changeSet:
      id: 20261018-01-alter-processi-add-corsa-verdetto-completo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        dbops.processi.corsa_verdetto_completo: ogni corsa del processo ricontrolla tutto
        il suo perimetro, quindi un verde chiude i rossi precedenti (salvo ricaduta).
        Brief: brief-db-intermittente-e-verdetto-completo.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists: { schemaName: dbops, tableName: processi }
            - not:
                - columnExists: { schemaName: dbops, tableName: processi, columnName: corsa_verdetto_completo }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE dbops.processi
                  ADD COLUMN corsa_verdetto_completo boolean NOT NULL DEFAULT false;

              COMMENT ON COLUMN dbops.processi.corsa_verdetto_completo IS
                  'Ogni corsa di questo processo e'' un VERDETTO COMPLETO: ricontrolla tutto il suo perimetro, quindi un verde chiude i rossi che lo precedono. Il criterio: dopo un verde, resta qualcosa che il rosso aveva lasciato e il verde non ha ricontrollato? Se si'', false (le code, l''invio mail, la fatturazione batch: un elemento fallito resta fallito, la corsa dopo ne lavora altri). Lo legge maintenance.vw_job_run_da_guardare: per un verdetto completo il motivo «intermittente» scatta solo se il lavoro e'' RICADUTO dopo essere tornato verde (almeno due tratti rossi nei sette giorni, cioe'' instabile), e una corsa in corso da meno di un''ora non conta finche'' non chiude. Con false la vista resta com''era: un rosso negli ultimi sette giorni basta. Vale per ogni corsia del processo (jobname): ognuna dev''essere completa sul proprio perimetro. Seed: 80_data/sql/dbops/processi.csv. Brief: brief-db-intermittente-e-verdetto-completo.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE dbops.processi
                  DROP COLUMN IF EXISTS corsa_verdetto_completo;
