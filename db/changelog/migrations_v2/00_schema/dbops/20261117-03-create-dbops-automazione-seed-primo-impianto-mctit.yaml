# LE TABELLE DEL SEED DI PRIMO IMPIANTO
#   NASCE dbops.automazione_seed_primo_impianto: il registro della regola
#   d'automazione SEED_PRIMO_IMPIANTO, una riga per tabella iscritta. Il runner
#   dbops.fn_run_automations_seed_primo_impianto porta il trigger
#   script.trgfn_seed_primo_impianto delle tabelle a cio' che il registro dichiara.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.4, D8, D9, Q19)
#
# -- LO STAMPO E' DELETE_BLOCK ----------------------------------------------
#   Il registro porta l'interruttore (enabled) e il nome del trigger
#   (trigger_name, risolto da dbops.fn_nome_oggetto_dichiarato col template di
#   default). Nessuna riga in dbops.automation_rules_tbl: il vocabolario di
#   rule_type nasce in 90_end (20261109-75) e non ha una fase in cui allargarlo
#   che valga da zero e su un database esistente (brief §16.11, vicolo cieco).
#
# -- LE TRE FORME -----------------------------------------------------------
#   * per riga (D9, il default): i due elenchi NULL. Tutte le colonne non libere
#     sono dell'installazione; la chiave con cui il codice cerca la riga deve
#     essere gia' ferma per conto suo (codice_interno con lock_columns);
#   * per colonna (D8, le righe miste): i due elenchi ci sono tutti e due, non
#     vuoti e disgiunti; una colonna non libera che non sta in nessuno dei due e'
#     un difetto, che la funzione di divergenze segnala;
#   * solo inserimento (Q11, Q18): la forma per riga in cui ogni riga di seed
#     conta come personalizzata. Il CSV crea la riga se manca, e poi non le
#     cambia piu' niente, in silenzio.
#   Le colonne libere (id, meta, le colonne d'audit, tx_id) non stanno in nessun
#   elenco: le definisce la funzione degli argomenti, una volta per tutte.
#
# -- DATO DEL SOFTWARE --------------------------------------------------------
#   Lo scrive solo la migrazione, dal CSV di 80_data: niente data_update,
#   user_update ne' tx_id (linee-guida-sql §7).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261117-03-create-dbops-automazione-seed-primo-impianto-mctit.yaml

  - changeSet:
      id: 20261117-03-create-dbops-automazione-seed-primo-impianto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.automazione_seed_primo_impianto: le tabelle iscritte alla regola del seed di primo
        impianto, con la forma (per riga, per colonna, solo inserimento) e la classificazione delle
        colonne. Brief: brief-db-seed-primo-impianto-non-si-riscrive.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists: { schemaName: dbops, tableName: automazione_seed_primo_impianto }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.automazione_seed_primo_impianto (
                  id                    integer     GENERATED BY DEFAULT AS IDENTITY,
                  schema_name           text        NOT NULL,
                  table_name            text        NOT NULL,
                  solo_inserimento      boolean     NOT NULL DEFAULT false,
                  colonne_software      text[]      NULL,
                  colonne_installazione text[]      NULL,
                  enabled               boolean     NOT NULL DEFAULT true,
                  trigger_name          text        NULL,
                  motivo                text        NOT NULL,
                  data_insert           timestamptz NOT NULL DEFAULT now(),
                  user_insert           text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_automazione_seed_primo_impianto PRIMARY KEY (id),
                  CONSTRAINT uq_automazione_seed_primo_impianto_tabella UNIQUE (schema_name, table_name),
                  CONSTRAINT chk_automazione_seed_primo_impianto_nome_tabella
                      CHECK (schema_name ~ '^[a-z_][a-z0-9_]*$' AND table_name ~ '^[a-z_][a-z0-9_]*$'),
                  CONSTRAINT chk_automazione_seed_primo_impianto_elenchi
                      CHECK ((colonne_software IS NULL AND colonne_installazione IS NULL)
                             OR (cardinality(colonne_software) >= 1
                                 AND cardinality(colonne_installazione) >= 1
                                 AND NOT (colonne_software && colonne_installazione))
                             IS TRUE),
                  CONSTRAINT chk_automazione_seed_primo_impianto_solo_inserimento_per_riga
                      CHECK (NOT solo_inserimento OR colonne_software IS NULL),
                  CONSTRAINT chk_automazione_seed_primo_impianto_trigger_name
                      CHECK (trigger_name IS NULL OR btrim(trigger_name) <> ''),
                  CONSTRAINT chk_automazione_seed_primo_impianto_motivo
                      CHECK (btrim(motivo) <> '')
              );

              COMMENT ON TABLE dbops.automazione_seed_primo_impianto IS
                  'Le tabelle iscritte alla regola del seed di primo impianto: il CSV crea la riga, e dopo che l''installazione l''ha modificata la riga e'' sua (linee-guida-sql §11.7). Una riga per tabella; il runner dbops.fn_run_automations_seed_primo_impianto monta script.trgfn_seed_primo_impianto dove la riga e'' accesa, lo rigenera se diverge, lo toglie se la riga e'' spenta. Tre forme: per riga (i due elenchi NULL, il default), per colonna (i due elenchi, per le righe miste), solo inserimento (per riga, e ogni riga di seed conta come personalizzata). Lo scrive solo la migrazione, dal CSV. ⚠️ Una tabella entra in un rilascio PRECEDENTE al primo ritocco del suo CSV: il trigger nasce dopo 80_data.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.schema_name IS
                  'Schema della tabella iscritta.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.table_name IS
                  'Nome della tabella iscritta: deve avere la chiave primaria id su una colonna sola.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.solo_inserimento IS
                  'true = il CSV crea la riga se manca e poi non la aggiorna piu'', toccata o no: ogni riga di seed conta come personalizzata, e il salto non lascia valori scartati ne'' WARNING. Solo nella forma per riga.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.colonne_software IS
                  'Forma per colonna: le colonne che il codice legge come regole (la chiave con cui cerca la riga compresa). Il CSV le scrive sempre; sulla riga di seed l''installazione non le cambia (E_SEED_COLONNA_DEL_SOFTWARE). NULL nella forma per riga.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.colonne_installazione IS
                  'Forma per colonna: le colonne che l''installazione configura. Il CSV le scrive finche'' la riga e'' intatta, e dopo che l''installazione ne ha cambiata una non le riscrive piu''. NULL nella forma per riga, dove sono dell''installazione tutte le colonne non libere.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.enabled IS
                  'L''interruttore: false toglie il trigger dalla tabella al giro successivo. Per ritirare una tabella si spegne la riga, non la si cancella: un trigger vivo su una tabella che il registro non nomina ferma il runner.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.trigger_name IS
                  'Nome del trigger; NULL = il template trg_{table}_a00_seed_primo_impianto_ins_upd_dlt, accorciato da dbops.fn_nome_oggetto_dichiarato se supera i 63 caratteri. La fase a00 lo fa scattare per primo fra i BEFORE.';
              COMMENT ON COLUMN dbops.automazione_seed_primo_impianto.motivo IS
                  'Perche'' la tabella e'' di primo impianto e perche'' ha questa forma: la classificazione delle colonne la decide Tid quando la tabella entra.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS dbops.automazione_seed_primo_impianto;
