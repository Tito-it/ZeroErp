# brief-db-processi-automatici-identita-e-perimetro §2.4 — il legame fra un
# processo e il suo utente tecnico (decisione D-6: uno per PROCESSO, non per
# emittente, e mai un alias derivato da una persona).
#
# ⚠️ Questa e' la meta' di MACCHINA del registro, e per questo sta in una
# tabella sua: valorizza una FK verso django.auth_user, cioe' righe che nascono
# dall'uso e su un database ricostruito da zero non esistono. Il suo seed va
# marcato `context: dati_macchina`, e il filtro va reso esplicito dove si
# applica — `--contexts="!provision"` da solo NON lo esclude.
#
# La tabella nasce vuota: le identita' tecniche arrivano con la fase 3.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260904-09-create-processi-identita-mctit.yaml

  - changeSet:
      id: 20260904-09-create-processi-identita
      author: mctit
      failOnError: true
      comment: >
        Crea dbops.processi_identita: legame processo -> utente tecnico
        (auth_user_id), un utente per processo. Meta' di macchina del registro,
        separata dal catalogo perche' punta a django.auth_user. Nasce vuota.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: processi }
            - not:
                - tableExists:
                    { schemaName: dbops, tableName: processi_identita }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Quale utente tecnico esegue un processo. UNIQUE sul
              --   processo: uno per processo — non uno per emittente (che
              --   moltiplicherebbe le identita' per un dato che il contesto
              --   gia' porta) e non un alias derivato da una persona (che
              --   farebbe dire all'audit un nome sbagliato, e fermerebbe il
              --   processo il giorno in cui quella persona esce).
              --
              -- Serve solo ai processi di classe DOMINIO: per gli altri
              --   l'attore e' il codice del processo e basta (D-8).
              --
              -- ⚠️ Nessun %TYPE su django.auth_user.id: le funzioni e il DDL
              --   che citano django.* scrivono il tipo per esteso.
              -- =========================================================
              CREATE TABLE dbops.processi_identita (
                  id            bigint GENERATED BY DEFAULT AS IDENTITY
                                  CONSTRAINT pk_processi_identita PRIMARY KEY,
                  processo_id   int     NOT NULL,
                  auth_user_id  integer NOT NULL,
                  attivo        boolean NOT NULL DEFAULT true,
                  note          text    NULL,
                  data_insert   timestamp with time zone NOT NULL DEFAULT now(),
                  user_insert   text    NOT NULL DEFAULT CURRENT_USER,
                  data_update   timestamp with time zone NOT NULL DEFAULT now(),
                  user_update   text    NOT NULL DEFAULT CURRENT_USER,
                  tx_id         uuid    NULL,
                  CONSTRAINT fk_processi_identita_processi
                      FOREIGN KEY (processo_id) REFERENCES dbops.processi (id),
                  CONSTRAINT uq_processi_identita_processo UNIQUE (processo_id)
              );

              COMMENT ON TABLE dbops.processi_identita IS
                  'Legame processo -> utente tecnico (django.auth_user.id), UNO per processo (decisione D-6). Meta'' di MACCHINA del registro: valorizza una FK verso django, quindi il suo seed va marcato context: dati_macchina e su un database ricostruito da zero la tabella resta vuota. Serve ai soli processi di classe DOMINIO: per gli altri l''attore e'' il codice del processo (D-8). Brief: brief-db-processi-automatici-identita-e-perimetro §2.4.';
              COMMENT ON COLUMN dbops.processi_identita.auth_user_id IS
                  'Utente tecnico del processo. La sua identita'' in anagrafiche.identita_digitali deve avere ruolo_applicativo = OPERATORE (ogni policy RLS lo pretende in AND: con altro il processo vedrebbe zero righe in silenzio) e il flag tecnica = true. ⛔ MAI il profilo SUPER_ADMIN: bypasserebbe lo scope prima della whitelist e riaprirebbe la porta che questo cantiere chiude.';

              CREATE TRIGGER trg_processi_identita_audit_data_user_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON dbops.processi_identita
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic();

              CREATE TRIGGER trg_processi_identita_gen_tx_id_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON dbops.processi_identita
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed();
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.processi_identita;
