# Liquibase changelog per Zero ERP
# Uniforma target_table per automation_rules_tbl:
# - default '*all'
# - NOT NULL
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/dbops/20251226-22-alter-automation-rules-target-table-mctit.yaml

  - changeSet:
      id: 20251226-22-alter-automation-rules-target-table
      author: mctit
      comment: >
        Imposta default '*all' e NOT NULL su dbops.automation_rules_tbl.target_table,
        normalizzando eventuali valori NULL o vuoti.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE dbops.automation_rules_tbl
              SET target_table = '*all'
              WHERE target_table IS NULL
                 OR btrim(target_table) = '';

              ALTER TABLE dbops.automation_rules_tbl
                ALTER COLUMN target_table SET DEFAULT '*all',
                ALTER COLUMN target_table SET NOT NULL;
