# brief-db-coda-lavori-generica §2 — registry dei tipi di job della coda
# lavori generica. Mirror leggero di dbops.pipeline_task_registry_impl: il DB
# valida il job_type e porta i default per-tipo (run_as, max_tentativi); il
# binding handler_code -> callable resta in Python (controllato, no dynamic
# import). Tabella multi-writer -> trigger audit + tx_id come dbops.idempotency_keys.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260720-07-create-coda-lavori-tipi-mctit.yaml

  - changeSet:
      id: 20260720-07-create-coda-lavori-tipi
      author: mctit
      failOnError: true
      comment: >
        Crea dbops.coda_lavori_tipi: registry dei tipi di job (codice = job_type,
        handler_code di dispatch, default run_as/max_tentativi, attivo). Trigger
        audit (data_update/user_update) + tx_id come le altre tabelle dbops
        multi-writer.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: SELECT COUNT(*) FROM pg_namespace WHERE nspname = 'dbops';
            - not:
                - tableExists:
                    { schemaName: dbops, tableName: coda_lavori_tipi }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Registry dei tipi di job della coda lavori generica. Una riga
              --   per job_type: valida il tipo all'enqueue e porta i default
              --   per-tipo. Il binding handler_code -> callable vive in Python.
              -- =========================================================
              CREATE TABLE dbops.coda_lavori_tipi (
                  id                    bigint GENERATED BY DEFAULT AS IDENTITY
                                          CONSTRAINT pk_coda_lavori_tipi PRIMARY KEY,
                  codice                text    NOT NULL,
                  handler_code          text    NOT NULL,
                  descrizione           text    NULL,
                  run_as_default        text    NOT NULL,
                  max_tentativi_default int     NOT NULL DEFAULT 5,
                  attivo                boolean NOT NULL DEFAULT true,
                  meta                  jsonb   NOT NULL DEFAULT '{}'::jsonb,
                  data_insert           timestamp with time zone NOT NULL DEFAULT now(),
                  user_insert           text    NOT NULL DEFAULT CURRENT_USER,
                  data_update           timestamp with time zone NOT NULL DEFAULT now(),
                  user_update           text    NOT NULL DEFAULT CURRENT_USER,
                  tx_id                 uuid    NULL,
                  CONSTRAINT uq_coda_lavori_tipi_codice UNIQUE (codice),
                  CONSTRAINT chk_coda_lavori_tipi_run_as_default
                      CHECK (run_as_default IN ('SISTEMA', 'OPERATORE')),
                  CONSTRAINT chk_coda_lavori_tipi_max_tentativi
                      CHECK (max_tentativi_default >= 1)
              );

              COMMENT ON TABLE dbops.coda_lavori_tipi IS
                  'Registry dei tipi di job della coda lavori generica (dbops.coda_lavori). codice = job_type; handler_code = chiave di dispatch verso il handler_registry Python (no dynamic import); default per-tipo run_as/max_tentativi. Brief: brief-db-coda-lavori-generica §2.';
              COMMENT ON COLUMN dbops.coda_lavori_tipi.codice IS
                  'Codice stabile del tipo di job = coda_lavori.job_type (UNIQUE). Referenziato in hard FK da dbops.coda_lavori.';
              COMMENT ON COLUMN dbops.coda_lavori_tipi.handler_code IS
                  'Chiave logica di dispatch verso il dict handler_registry Python (register_handler al boot). Binding controllato, no dynamic import.';
              COMMENT ON COLUMN dbops.coda_lavori_tipi.run_as_default IS
                  'Default per coda_lavori.run_as se non passato all''enqueue: SISTEMA (worker BYPASSRLS) | OPERATORE (scope catturato).';
              COMMENT ON COLUMN dbops.coda_lavori_tipi.max_tentativi_default IS
                  'Default per coda_lavori.max_tentativi se non passato all''enqueue.';
              COMMENT ON COLUMN dbops.coda_lavori_tipi.attivo IS
                  'Se false, fn_accoda_lavoro rifiuta l''enqueue del tipo (E_JOB_TYPE_NON_ATTIVO).';

              -- Trigger audit (data_update/user_update) + tx_id: tabella
              -- multi-writer -> stesso wiring di dbops.idempotency_keys.
              CREATE TRIGGER trg_coda_lavori_tipi_audit_data_user_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON dbops.coda_lavori_tipi
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic();

              CREATE TRIGGER trg_coda_lavori_tipi_gen_tx_id_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON dbops.coda_lavori_tipi
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed();
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.coda_lavori_tipi;
