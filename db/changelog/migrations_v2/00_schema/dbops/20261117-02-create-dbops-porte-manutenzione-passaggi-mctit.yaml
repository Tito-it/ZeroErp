# ------------------------------------------------------------
# IL DIARIO DELLE PORTE DI MANUTENZIONE
#   NASCE dbops.porte_manutenzione_passaggi: una riga per ogni riga che passa da
#   una porta di manutenzione (zeroerp.allow_*_override, zeroerp.maintenance_*
#   delle porte che nessuna funzione apre per se'). La scrive solo
#   script.fn_porta_manutenzione_aperta, quando la porta si apre: GUC accesa e
#   sessione del migratore.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§13.3, §15.5, V7 al §16.11)
#
# -- PERCHE' --------------------------------------------------------------
#   Una bonifica che forza un blocco su righe di un cliente deve lasciare scritto
#   che cosa ha forzato. Una sede sola per tutte le porte, quella del seed
#   compresa (regola del 2 applicata alla traccia).
#
# -- SOLO INSERT ----------------------------------------------------------
#   La riga non si aggiorna: porta data_insert/user_insert e tx_id (per legarla
#   alla transazione della bonifica), non data_update/user_update
#   (linee-guida-sql §7: conta chi AGGIORNA). Il trigger del tx_id si monta a
#   mano, come su ogni tabella di dbops scritta a runtime.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261117-02-create-dbops-porte-manutenzione-passaggi-mctit.yaml

  - changeSet:
      id: 20261117-02-create-dbops-porte-manutenzione-passaggi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.porte_manutenzione_passaggi: il diario delle righe passate da una porta di
        manutenzione, scritto da script.fn_porta_manutenzione_aperta. Brief:
        brief-db-seed-primo-impianto-non-si-riscrive (D7).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists: { schemaName: dbops, tableName: porte_manutenzione_passaggi }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.porte_manutenzione_passaggi (
                  id           bigint      GENERATED BY DEFAULT AS IDENTITY,
                  chiave       text        NOT NULL,
                  schema_name  text        NOT NULL,
                  table_name   text        NOT NULL,
                  riga_id      text        NULL,
                  operazione   text        NOT NULL,
                  utente_sessione text     NOT NULL,
                  data_insert  timestamptz NOT NULL DEFAULT now(),
                  user_insert  text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id        uuid        NULL,
                  CONSTRAINT pk_porte_manutenzione_passaggi PRIMARY KEY (id),
                  CONSTRAINT chk_porte_manutenzione_passaggi_chiave
                      CHECK (chiave ~ '^zeroerp\.[a-z_]+$'),
                  CONSTRAINT chk_porte_manutenzione_passaggi_nome_tabella
                      CHECK (schema_name ~ '^[a-z_][a-z0-9_]*$' AND table_name ~ '^[a-z_][a-z0-9_]*$'),
                  CONSTRAINT chk_porte_manutenzione_passaggi_operazione
                      CHECK (operazione IN ('INSERT', 'UPDATE', 'DELETE', 'TRUNCATE'))
              );

              CREATE INDEX ix_porte_manutenzione_passaggi_tabella
                  ON dbops.porte_manutenzione_passaggi (schema_name, table_name, data_insert);

              COMMENT ON TABLE dbops.porte_manutenzione_passaggi IS
                  'Il diario delle porte di manutenzione: una riga per ogni riga passata da una porta che solo il migratore apre a mano (bonifica, refuso, DELETE forward-only). La scrive solo script.fn_porta_manutenzione_aperta quando la porta si apre (GUC accesa e sessione del migratore); l''app la legge soltanto. Le porte di verbo, che una funzione apre per se'', non passano di qui.';
              COMMENT ON COLUMN dbops.porte_manutenzione_passaggi.chiave IS
                  'La GUC della porta, per esempio zeroerp.allow_lock_columns_override.';
              COMMENT ON COLUMN dbops.porte_manutenzione_passaggi.schema_name IS
                  'Schema della tabella su cui la porta si e'' aperta.';
              COMMENT ON COLUMN dbops.porte_manutenzione_passaggi.table_name IS
                  'Tabella su cui la porta si e'' aperta.';
              COMMENT ON COLUMN dbops.porte_manutenzione_passaggi.riga_id IS
                  'La chiave id della riga forzata, come testo; NULL se il trigger non e'' di riga o la tabella non ha una colonna id.';
              COMMENT ON COLUMN dbops.porte_manutenzione_passaggi.operazione IS
                  'L''operazione che la porta ha lasciato passare: INSERT, UPDATE, DELETE o TRUNCATE.';
              COMMENT ON COLUMN dbops.porte_manutenzione_passaggi.utente_sessione IS
                  'Il ruolo di LOGIN della sessione (session_user): chi ha aperto la porta, anche dentro una SECURITY DEFINER.';

              CREATE TRIGGER trg_porte_manutenzione_passaggi_gen_tx_id_ins
                  BEFORE INSERT
                  ON dbops.porte_manutenzione_passaggi
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed();
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS dbops.porte_manutenzione_passaggi;
