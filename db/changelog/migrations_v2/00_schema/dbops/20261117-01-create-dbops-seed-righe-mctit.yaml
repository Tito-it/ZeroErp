# IL REGISTRO DELLE RIGHE NATE DAL SEED
#   NASCE dbops.seed_righe: una riga per ogni riga nata dal seed su una tabella
#   iscritta alla regola del seed di primo impianto
#   (dbops.automazione_seed_primo_impianto, 20261117-03). La PRESENZA della riga
#   qui e' il segno «nata dal seed»: una riga di una tabella iscritta che qui non
#   c'e' l'ha creata l'installazione.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.3, §16.2, D10)
#
# -- PERCHE' UN REGISTRO E NON user_insert ------------------------------
#   Il segno scritto nella riga stessa si riscrive (l'audit lascia passare
#   user_insert su un UPDATE), dipende dai nomi dei ruoli di oggi e, dentro una
#   SECURITY DEFINER, dice il proprietario invece di chi scrive (§16.1). Qui lo
#   scrive solo script.trgfn_seed_primo_impianto (SECURITY DEFINER, 20261117-…),
#   all'INSERT della sessione del migratore, e il runner all'iscrizione della
#   tabella. L'app la legge e non la scrive (postura in 90_end, §11.8).
#
# -- CHE COSA TIENE -----------------------------------------------------
#   * come e' nata la voce: all'INSERT del migratore, o all'iscrizione;
#   * quando l'installazione ha personalizzato la riga, e chi;
#   * gli ultimi valori del CSV che il trigger ha scartato, e quando.
#   Il passaggio dalla porta di manutenzione NON sta qui: la traccia di tutte le
#   porte ha una sede sola, dbops.porte_manutenzione_passaggi (20261117-02).
#
# -- FUORI DALL'AMBITO DELLE AUTOMAZIONI ---------------------------------
#   dbops non e' nell'ambito: la tabella si scrive a runtime (dal trigger), quindi
#   porta data_update, user_update e tx_id e monta A MANO i due trigger del
#   framework, col nome che userebbe il framework (automazione-db §1.1,
#   linee-guida-sql §7).
#
# -- NIENTE FK ----------------------------------------------------------
#   La riga punta a una tabella qualunque: schema, tabella e id sono testo, con
#   la forma nel CHECK. Che la tabella esista e sia iscritta lo dice la funzione
#   di divergenze della regola (linee-guida-sql §7f: regclass non e' un tipo di
#   colonna).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261117-01-create-dbops-seed-righe-mctit.yaml

  - changeSet:
      id: 20261117-01-create-dbops-seed-righe
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.seed_righe: il registro delle righe nate dal seed sulle tabelle iscritte al seed di
        primo impianto, con la personalizzazione e i valori scartati. Brief:
        brief-db-seed-primo-impianto-non-si-riscrive (D10).
      preConditions:
        - onFail: HALT
        - not:
            - tableExists: { schemaName: dbops, tableName: seed_righe }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.seed_righe (
                  id                bigint      GENERATED BY DEFAULT AS IDENTITY,
                  schema_name       text        NOT NULL,
                  table_name        text        NOT NULL,
                  riga_id           text        NOT NULL,
                  segnata_da        text        NOT NULL,
                  personalizzata_il timestamptz NULL,
                  personalizzata_da text        NULL,
                  scartati          jsonb       NULL,
                  scartati_il       timestamptz NULL,
                  data_insert       timestamptz NOT NULL DEFAULT now(),
                  user_insert       text        NOT NULL DEFAULT CURRENT_USER,
                  data_update       timestamptz NOT NULL DEFAULT now(),
                  user_update       text        NOT NULL DEFAULT CURRENT_USER,
                  tx_id             uuid        NULL,
                  CONSTRAINT pk_seed_righe PRIMARY KEY (id),
                  CONSTRAINT uq_seed_righe_tabella_riga UNIQUE (schema_name, table_name, riga_id),
                  CONSTRAINT chk_seed_righe_nome_tabella
                      CHECK (schema_name ~ '^[a-z_][a-z0-9_]*$' AND table_name ~ '^[a-z_][a-z0-9_]*$'),
                  CONSTRAINT chk_seed_righe_riga_id
                      CHECK (btrim(riga_id) <> ''),
                  CONSTRAINT chk_seed_righe_segnata_da
                      CHECK (segnata_da IN ('INSERT', 'ISCRIZIONE')),
                  CONSTRAINT chk_seed_righe_personalizzata
                      CHECK ((personalizzata_il IS NULL) = (personalizzata_da IS NULL)),
                  CONSTRAINT chk_seed_righe_scartati
                      CHECK ((scartati IS NULL) = (scartati_il IS NULL)
                             AND (scartati IS NULL OR jsonb_typeof(scartati) = 'object'))
              );

              COMMENT ON TABLE dbops.seed_righe IS
                  'Le righe nate dal seed sulle tabelle iscritte al seed di primo impianto (dbops.automazione_seed_primo_impianto). La presenza della riga e'' il segno «nata dal seed»: una riga di una tabella iscritta che qui non c''e'' l''ha creata l''installazione, e il CSV non la riscrive mai. Una riga di seed non si cancella (si spegne) e, dopo che l''installazione l''ha personalizzata, il CSV non le riscrive piu'' le colonne dell''installazione. La scrive solo script.trgfn_seed_primo_impianto (all''INSERT della sessione del migratore) e il runner dbops.fn_run_automations_seed_primo_impianto (all''iscrizione della tabella); l''app la legge soltanto. Il passaggio dalla porta di manutenzione si legge da dbops.porte_manutenzione_passaggi.';
              COMMENT ON COLUMN dbops.seed_righe.schema_name IS
                  'Schema della tabella iscritta.';
              COMMENT ON COLUMN dbops.seed_righe.table_name IS
                  'Nome della tabella iscritta.';
              COMMENT ON COLUMN dbops.seed_righe.riga_id IS
                  'La chiave primaria id della riga, come testo: la regola vale per tabelle con chiave primaria id su una colonna sola, di qualunque tipo.';
              COMMENT ON COLUMN dbops.seed_righe.segnata_da IS
                  'Come e'' nata la voce: INSERT (il trigger, quando la sessione del migratore ha inserito la riga) o ISCRIZIONE (il runner, quando ha iscritto la tabella e ha segnato le righe di seed che c''erano gia'').';
              COMMENT ON COLUMN dbops.seed_righe.personalizzata_il IS
                  'Quando l''installazione ha cambiato per la prima volta una colonna dell''installazione della riga. NULL = la riga e'' come il seed l''ha lasciata, e segue il CSV. Resta valorizzata anche dopo una bonifica fatta con la porta: la bonifica corregge un valore, non restituisce la riga al software.';
              COMMENT ON COLUMN dbops.seed_righe.personalizzata_da IS
                  'Chi l''ha personalizzata: lo username dell''applicazione (app.jwt_user) se c''e'', altrimenti il ruolo della sessione.';
              COMMENT ON COLUMN dbops.seed_righe.scartati IS
                  'Gli ultimi valori del CSV che il trigger ha scartato su una riga personalizzata: un oggetto colonna -> valore, con le sole colonne dell''installazione che il CSV voleva diverse. Base della diagnosi «righe in cui il CSV porta un valore diverso». Non si scrive per le tabelle in solo inserimento, dove il salto e'' il comportamento atteso.';
              COMMENT ON COLUMN dbops.seed_righe.scartati_il IS
                  'Quando sono stati scartati i valori di scartati.';

              -- I due trigger del framework, a mano: dbops sta fuori dall'ambito.
              CREATE TRIGGER trg_seed_righe_audit_data_user_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON dbops.seed_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic();

              CREATE TRIGGER trg_seed_righe_gen_tx_id_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON dbops.seed_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_tx_id_managed();
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS dbops.seed_righe;
