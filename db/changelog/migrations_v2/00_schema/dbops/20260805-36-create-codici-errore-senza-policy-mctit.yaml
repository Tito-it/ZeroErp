# ------------------------------------------------------------
# IL REGISTRO del terzo lato: i codici che aspettano una decisione
#   Brief: brief-db-be-terzo-lato-presidio-codici.md §4
#   Misura: 20260805-35 (vista) · Seed: 20260805-37
#
# ── A COSA SERVE, E PERCHE' PRIMA DEL CANCELLO ──────────────────────────
#   Il cancello dira': «ogni codice che il database puo' nominare deve avere
#   una voce in error_policies.py». Oggi ne mancano **141**, quindi acceso cosi'
#   sarebbe rosso dal primo giorno — e un cancello sempre rosso viene
#   disattivato entro una settimana. E' il modo in cui i presidi muoiono.
#
#   Il registro e' quello che permette di accenderlo **subito**: le 141 voci
#   note stanno qui, il cancello le salta, e protesta solo per il **142esimo**.
#   Da quel momento il debito puo' solo calare.
#
# ── ⚠️ E' UN DEBITO, NON UN ELENCO DI ECCEZIONI ─────────────────────────
#   Terzo registro di questa famiglia, e vale la stessa regola dei due
#   precedenti (`dbops.riferimenti_morti_esenzioni`,
#   `dbops.messaggi_errore_codici_legacy`): **deve calare**. Il secondo e'
#   passato da 57 voci a 1 in una giornata, il che dimostra che la forma
#   funziona quando qualcuno la usa.
#
#   Due controlli lo terranno onesto, e stanno in due posti diversi apposta:
#     · «un codice nuovo non entra» -> il cancello, lato backend;
#     · «una voce che ha ottenuto la sua policy va TOLTA» -> lo stesso cancello,
#       nella direzione opposta. Senza, il registro puo' solo allungarsi.
#
# ── LE COLONNE ───────────────────────────────────────────────────────────
#   `da_trigger` non e' decorazione: distingue i **90** codici sollevati da
#   funzioni agganciate a un trigger — che stanno sul percorso di una richiesta
#   vera e quindi arrivano a un utente — dai restanti, che potrebbero non essere
#   mai raggiunti dal web. Serve a dare un ORDINE alle 141 decisioni: quelle 90
#   vengono prima. Non e' un criterio di esclusione.
#
#   ⚠️ Niente colonna `motivo`, al contrario del registro dei riferimenti morti.
#   Li' ogni voce e' una decisione indipendente; qui le 141 sono **una sola
#   decisione** — «non e' una regressione, si chiude a lotti» — applicata 141
#   volte. Un motivo obbligatorio produrrebbe 141 copie della stessa frase:
#   rumore che somiglia al rigore. La ragione sta nel COMMENT della tabella.
#
#   ⚠️ Tabella tecnica: PK `INTEGER GENERATED BY DEFAULT AS IDENTITY`, non UUID.
#   I trigger di audit/tx_id li mette l'automazione notturna (`ci_apply`): su un
#   migrate manuale la tabella nasce senza, ed e' atteso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260805-36-create-codici-errore-senza-policy-mctit.yaml

  - changeSet:
      id: 20260805-36-create-codici-errore-senza-policy
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Registro del debito del terzo lato: i codici errore che il database puo'
        nominare e che non hanno ancora una voce in error_policies.py. Permette di
        accendere il cancello oggi invece che a fine bonifica: le voci note si
        saltano, il 142esimo codice fa rosso. E' un debito e deve calare.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS dbops.codici_errore_senza_policy (
                  id                 INTEGER GENERATED BY DEFAULT AS IDENTITY,
                  codice             TEXT NOT NULL,
                  -- La funzione che lo nomina e' agganciata a un trigger: il
                  -- codice sta sul percorso di una richiesta vera. Da' l'ordine
                  -- alle decisioni, non esclude nessuno.
                  da_trigger         BOOLEAN NOT NULL,
                  data_registrazione DATE NOT NULL DEFAULT CURRENT_DATE,
                  data_insert        TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_insert        TEXT NOT NULL DEFAULT CURRENT_USER,
                  data_update        TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_update        TEXT NOT NULL DEFAULT CURRENT_USER,
                  tx_id              UUID,
                  CONSTRAINT pk_codici_errore_senza_policy PRIMARY KEY (id),
                  CONSTRAINT uq_codici_errore_senza_policy_codice UNIQUE (codice),
                  -- ⚠️ Qui entrano solo codici CONFORMI: un codice fuori
                  -- convenzione e' debito di un altro registro
                  -- (dbops.messaggi_errore_codici_legacy) e va sanato li'.
                  -- Senza questo vincolo i due registri si sovrapporrebbero e
                  -- non si capirebbe piu' quale dei due debiti si sta pagando.
                  CONSTRAINT chk_codici_errore_senza_policy_conforme
                      CHECK (codice ~ '^E_[A-Z0-9_]+$')
              );

              COMMENT ON TABLE dbops.codici_errore_senza_policy IS
              'Registro del debito del "terzo lato": i codici errore che una funzione plpgsql viva puo'' nominare e che NON hanno una voce in backend/apps/core/services/error_policies.py. Effetto del difetto: l''operatore legge comunque la frase giusta (viene dal catalogo), ma il TIPO di risposta HTTP resta appiattito su 400 anche quando la verita'' e'' 404 o 403. UNA sola decisione (brief-db-be-terzo-lato-presidio-codici, 2026-08-05): non e'' una regressione, si chiude a lotti per dominio partendo dai da_trigger. Esiste per permettere di accendere il cancello SUBITO invece che a bonifica finita: un cancello rosso dal primo giorno viene disattivato. E'' un debito: DEVE calare, e il cancello deve pretendere che una voce che ha ottenuto la sua policy venga tolta. Misura canonica: dbops.vw_codici_errore_da_dichiarare.';

              COMMENT ON COLUMN dbops.codici_errore_senza_policy.da_trigger IS
              'La funzione che nomina il codice e'' agganciata a un trigger, quindi il codice sta sul percorso di una richiesta vera e arriva davvero a un utente. Al 2026-08-05: 90 su 141. Serve a dare un ordine alle decisioni — questi vengono prima — non a escludere gli altri.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.codici_errore_senza_policy;
