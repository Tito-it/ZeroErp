# dbops.automazione_attivo_inclusioni: le FK senza il suffisso _id che
#   l'automazione ATTIVO lega comunque, ciascuna col suo perche'.
#
# ── DA DOVE NASCE (Tid, 2026-11-21) ───────────────────────────────────
#   D-6 «a»: un regime fiscale spento non si assegna, ne' a un emittente ne'
#   a un fornitore. Poi, nello stesso giorno: un regime IN USO NON SI SPEGNE
#   (revoca la D-7 «1» e la R-1 del 2026-10-01 di
#   brief-db-esigibilita-iva-per-cassa-emittente, «un emittente puo' tenere
#   un regime che il catalogo disattiva»). E' la coppia ATTIVO standard: il
#   REQUIRE sulla figlia e il BLOCK sul padre.
#   La coppia non c'era: dbops.fn_run_automations_attivo salta ogni FK la cui
#   colonna non finisce in _id (ATTIVO_SKIP_FK_NO_ID), e le due FK verso
#   config.regimi_fiscali(codice_interno) si chiamano regime_fiscale_rf. La
#   pagina manual/ di config.regimi_fiscali dichiarava la regola, ma nessun
#   trigger la faceva valere (dbdev e scratch, 2026-11-21).
#
# ── PERCHE' UN REGISTRO, E NON TOGLIERE IL FILTRO ─────────────────────
#   Il filtro _id esclude in silenzio tutte le FK monocolonna senza quel
#   suffisso: note, lingue, esiti, transizioni, il registro dei processi.
#   Toglierlo cambierebbe in un colpo il comportamento di tutte quelle
#   tabelle, ed e' un cambio di famiglia da decidere a parte. Qui si lega
#   solo la FK dichiarata, col motivo come dato. ⚠️ Il gemello del
#   2026-11-04 (automazione_codice_eccezioni) ricorda che un registro per
#   inclusione si dimentica: il filtro _id resta un'esclusione implicita, ed
#   e' detto in chat a Tid come debito.
#
# ── LA FORMA ──────────────────────────────────────────────────────────
#   Gemella di dbops.automazione_attivo_eccezioni, nella forma dei cataloghi
#   di dbops scritti dal solo migratore (20261109-31): data_insert e
#   user_insert, niente data_update/user_update, niente tx_id, niente
#   trigger. Una FK per riga (schema e tabella della FIGLIA, colonna FK),
#   motivo obbligatorio. Per riga si genera la coppia intera, come per ogni
#   FK con _id: nessuna colonna «quale parte», perche' nessuna riga la chiede.
#   Il CHECK sulla colonna dice che una FK con _id qui non serve: la lega
#   gia' l'automazione.
#   Lo legge dbops.fn_attivo_fk_esclusa (20261121-11), l'unica sede della
#   domanda «questa FK si lega?», chiamata dal runner (20261121-12) e dal
#   ritiro (20261121-13). Seed: 80_data 20261121-14.
#   Niente attivo: una riga si ritira togliendola (CSV + DELETE forward-only).
#   Niente RLS (tabella tecnica, linee-guida §10.1).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261121-10-create-automazione-attivo-inclusioni-mctit.yaml

  - changeSet:
      id: 20261121-10-create-automazione-attivo-inclusioni
      author: mctit
      failOnError: true
      comment: >
        dbops.automazione_attivo_inclusioni: le FK (schema, tabella figlia, colonna FK) senza il
        suffisso _id che l'automazione ATTIVO lega comunque, col motivo obbligatorio. Prime righe
        (80_data 20261121-14): regime_fiscale_rf di emittenti_fiscali e fornitori.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: dbops
                tableName: automazione_attivo_inclusioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.automazione_attivo_inclusioni (
                  id             integer GENERATED BY DEFAULT AS IDENTITY
                                 CONSTRAINT pk_automazione_attivo_inclusioni PRIMARY KEY,
                  schema_figlia  text        NOT NULL,
                  tabella_figlia text        NOT NULL,
                  colonna_fk     text        NOT NULL,
                  motivo         text        NOT NULL,
                  data_insert    timestamptz NOT NULL DEFAULT now(),
                  user_insert    text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_automazione_attivo_inclusioni_fk
                      UNIQUE (schema_figlia, tabella_figlia, colonna_fk),
                  -- Lo stesso predicato del filtro dell'automazione (il '_' e'
                  -- un jolly anche li'): una FK che il filtro gia' lega qui
                  -- non ha niente da dire.
                  CONSTRAINT chk_automazione_attivo_inclusioni_senza_id
                      CHECK (lower(colonna_fk) NOT LIKE '%_id'),
                  CONSTRAINT chk_automazione_attivo_inclusioni_motivo
                      CHECK (btrim(motivo) <> '')
              );

              COMMENT ON TABLE dbops.automazione_attivo_inclusioni IS
                  'Le FK senza il suffisso _id che l''automazione ATTIVO lega comunque. dbops.fn_run_automations_attivo salta ogni FK la cui colonna non finisce in _id; per una riga qui genera invece la coppia intera, il block sul padre (dbops.trgfn_prevent_deactivate_if_children) e il require sulla figlia (dbops.trgfn_child_requires_active_parent), con la colonna del padre referenziata dalla FK anche quando e'' una UNIQUE non primaria. Una FK per riga (schema e tabella della FIGLIA, colonna FK; uq_automazione_attivo_inclusioni_fk), col motivo obbligatorio e non vuoto (chk_automazione_attivo_inclusioni_motivo). Una colonna che finisce in _id qui non entra (chk_automazione_attivo_inclusioni_senza_id): la lega gia'' l''automazione. Un''eccezione di dbops.automazione_attivo_eccezioni prevale: la domanda «questa FK si lega?» la risponde dbops.fn_attivo_fk_esclusa. Togliere una riga ritira i trigger al giro successivo (dbops.fn_ritira_attivo_eccezioni). Seed da 80_data (CSV dbops/automazione_attivo_inclusioni.csv).';
              COMMENT ON COLUMN dbops.automazione_attivo_inclusioni.schema_figlia IS
                  'Schema della tabella FIGLIA, quella che porta la FK.';
              COMMENT ON COLUMN dbops.automazione_attivo_inclusioni.tabella_figlia IS
                  'Tabella FIGLIA, quella che porta la FK.';
              COMMENT ON COLUMN dbops.automazione_attivo_inclusioni.colonna_fk IS
                  'Colonna FK della figlia, monocolonna e senza il suffisso _id. Il padre e la colonna referenziata si ricavano dalla FK stessa.';
              COMMENT ON COLUMN dbops.automazione_attivo_inclusioni.motivo IS
                  'Perche'' quella coppia padre/figlio si lega sull''attivo. Obbligatorio.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.automazione_attivo_inclusioni;
