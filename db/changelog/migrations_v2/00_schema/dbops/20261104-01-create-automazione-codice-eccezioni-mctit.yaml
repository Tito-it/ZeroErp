# Automazione CODICE_MAIUSCOLO — dbops.automazione_codice_eccezioni: le colonne
#   `codice` che l'automazione NON normalizza, ciascuna col suo perche'.
#
# ── LA REGOLA (Tid, 2026-11-04) ───────────────────────────────────────
#   Un codice che l'operatore digita e' un identificativo, e non distingue le
#   maiuscole: `VITE-M8` e `vite-m8` sono lo stesso articolo, non due. Ogni
#   colonna `codice` dell'ambito si salva in `upper(btrim(…))`
#   (script.trgfn_codice_maiuscolo, 20261104-02): con l'indice UNIQUE che c'e'
#   gia' sulla colonna, l'unicita' diventa senza distinzione di maiuscole, e
#   le ricerche, gli indici e il LIKE per prefisso restano quelli di oggi
#   (linee-guida-sql §8.5: colonne normalizzate, non indici su upper()).
#
# ── ⭐ PER ESCLUSIONE, NON PER INCLUSIONE (Tid, 2026-11-04) ───────────
#   Come l'automazione ATTIVO (automazione_attivo_eccezioni) e il cleanup
#   (automation_cleanup_exclusions): la regola vale per ogni tabella che ha la
#   colonna, e una tabella NUOVA nasce presidiata senza che nessuno debba
#   ricordarsi di registrarla. Un registro per inclusione si dimentica.
#   L'eccezione e' la colonna `codice` che NON e' un codice dell'operatore: una
#   chiave tecnica letta dal codice per nome (il nome di una colonna, di uno
#   schema, di un job), o un codice che arriva da un sistema esterno dove il
#   maiuscolo conta. Il MOTIVO e' obbligatorio: un'eccezione senza perche' e'
#   un buco nel framework, non una decisione.
#   ⚠️ `codice_interno` NON e' nel perimetro (Tid, 2026-11-04): lo scrive la
#   migrazione, non l'operatore.
#
# Lo legge dbops.fn_codice_maiuscolo_perimetro (20261104-03): una riga qui
# toglie il trigger dalla tabella al giro successivo (azione TOGLIE).
# Seed: 80_data 20261104-07 (CSV dbops/automazione_codice_eccezioni.csv).
# Niente attivo: una riga si ritira togliendola (CSV + DELETE forward-only).
# Niente RLS (tabella tecnica, linee-guida §10.1).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261104-01-create-automazione-codice-eccezioni-mctit.yaml

  - changeSet:
      id: 20261104-01-create-automazione-codice-eccezioni
      author: mctit
      failOnError: true
      comment: >
        dbops.automazione_codice_eccezioni: le colonne codice (schema, tabella, colonna) che
        l'automazione CODICE_MAIUSCOLO non normalizza, col motivo obbligatorio. Regola per
        esclusione (decisione Tid 2026-11-04): ogni colonna codice dell'ambito si salva in
        maiuscolo, tranne quelle qui.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: dbops
                tableName: automazione_codice_eccezioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.automazione_codice_eccezioni (
                  id            integer GENERATED BY DEFAULT AS IDENTITY
                                CONSTRAINT pk_automazione_codice_eccezioni PRIMARY KEY,
                  schema_name   text        NOT NULL,
                  table_name    text        NOT NULL,
                  column_name   text        NOT NULL DEFAULT 'codice',
                  motivo        text        NOT NULL,
                  data_insert   timestamptz NOT NULL DEFAULT now(),
                  user_insert   text        NOT NULL DEFAULT CURRENT_USER,
                  data_update   timestamptz NOT NULL DEFAULT now(),
                  user_update   text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_automazione_codice_eccezioni_colonna
                      UNIQUE (schema_name, table_name, column_name),
                  CONSTRAINT chk_automazione_codice_eccezioni_colonna
                      CHECK (column_name = 'codice'),
                  CONSTRAINT chk_automazione_codice_eccezioni_motivo
                      CHECK (btrim(motivo) <> '')
              );

              COMMENT ON TABLE dbops.automazione_codice_eccezioni IS
                  'Le colonne codice che l''automazione CODICE_MAIUSCOLO NON normalizza. La regola e'' per esclusione (decisione Tid 2026-11-04): ogni colonna codice di una tabella dell''ambito si salva in upper(btrim(...)) (script.trgfn_codice_maiuscolo), e una tabella nuova nasce presidiata. Qui stanno le colonne codice che non sono un codice dell''operatore: una chiave tecnica letta dal codice per nome, o un codice esterno dove il maiuscolo conta. Il MOTIVO e'' obbligatorio. Una riga toglie il trigger al giro successivo (dbops.fn_run_automations_codice_maiuscolo, azione TOGLIE). codice_interno non e'' nel perimetro: lo scrive la migrazione. Seed da 80_data (CSV dbops/automazione_codice_eccezioni.csv).';
              COMMENT ON COLUMN dbops.automazione_codice_eccezioni.schema_name IS
                  'Schema della tabella esclusa.';
              COMMENT ON COLUMN dbops.automazione_codice_eccezioni.table_name IS
                  'Tabella esclusa.';
              COMMENT ON COLUMN dbops.automazione_codice_eccezioni.column_name IS
                  'La colonna esclusa: oggi solo codice (CHECK). E'' nella chiave perche'' la regola e'' della colonna, e una seconda colonna-codice entrerebbe come riga, non come tabella nuova.';
              COMMENT ON COLUMN dbops.automazione_codice_eccezioni.motivo IS
                  'Perche'' quella colonna codice non si salva in maiuscolo. Obbligatorio.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.automazione_codice_eccezioni;
