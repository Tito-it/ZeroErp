# ------------------------------------------------------------
# IL VOCABOLARIO DELLE CAUSE DI FALLIMENTO DI UN LAVORO AUTOMATICO
#   dbops.cause_fallimento (codice, descrizione)
#   Brief: brief-db-presidio-job-run-a-chi-tocca (§4.1, §4.3, D4)
#
# -- PERCHE' UNA TABELLA (D4, Tid 2026-10-16) ------------------------
#   Le stesse cause (AMBIENTE, PROGRAMMA, CONFIGURAZIONE) le dichiarano DUE
#   colonne: dbops.processi.causa_fallimento (20261016-36), «di che natura sono
#   i miei fallimenti quando l'ambiente e' sano», e
#   config.codici_errore.causa_fallimento (20261016-37), «quando questo errore
#   ferma un lavoro automatico». Due CHECK IN (...) con la stessa lista sarebbero
#   una copia (regola del 2): qui il vocabolario e' uno, e le due colonne hanno
#   una FK verso di lui (90_end/20261016-43).
#   ⚠️ La terza sede e' dbops.presidi_cause: le righe del presidio
#   maintenance.vw_job_run_da_guardare dicono a chi tocca ogni causa. Non puo'
#   essere una FK (la chiave e' (vista, causa)): la coincidenza la tiene il
#   pgTAP maintenance/test-vw-job-run-da-guardare-causa-v1.
#
# ⚠️ Tabella NUOVA, catalogo puro come dbops.presidi_cause: nessuna RLS,
#   nessuna colonna `storicizza`, colonne di audit coi DEFAULT (i trigger li
#   monta ci_apply). Seed: 80_data/sql/dbops/cause_fallimento.csv (mirror
#   20261016-42). Nessun dato di macchina.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261016-34-create-cause-fallimento-mctit.yaml

  - changeSet:
      id: 20261016-34-create-cause-fallimento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.cause_fallimento: il vocabolario delle cause per cui un lavoro
        automatico fallisce (AMBIENTE, PROGRAMMA, CONFIGURAZIONE). Lo usano
        dbops.processi e config.codici_errore. Brief: brief-db-presidio-job-run-a-chi-tocca D4.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: dbops
                tableName: cause_fallimento
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- Scopo:
              --   Il vocabolario delle cause per cui un lavoro automatico
              --   fallisce. Ogni causa porta con se' a chi tocca rimediare,
              --   tramite dbops.presidi_cause del presidio dei job.
              -- =========================================================
              CREATE TABLE dbops.cause_fallimento (
                  id              integer GENERATED BY DEFAULT AS IDENTITY
                                    CONSTRAINT pk_cause_fallimento PRIMARY KEY,
                  codice          text    NOT NULL,
                  descrizione     text    NOT NULL,
                  data_insert     timestamp with time zone NOT NULL DEFAULT now(),
                  user_insert     text    NOT NULL DEFAULT CURRENT_USER,
                  data_update     timestamp with time zone NOT NULL DEFAULT now(),
                  user_update     text    NOT NULL DEFAULT CURRENT_USER,
                  tx_id           uuid    NULL,

                  -- Chiave naturale: e' il bersaglio delle FK.
                  CONSTRAINT uq_cause_fallimento_codice UNIQUE (codice),

                  CONSTRAINT chk_cause_fallimento_codice_non_vuoto
                      CHECK (btrim(codice) <> ''),
                  CONSTRAINT chk_cause_fallimento_descrizione_non_vuota
                      CHECK (btrim(descrizione) <> '')
              );

              COMMENT ON TABLE dbops.cause_fallimento IS
                  'Il vocabolario delle cause per cui un lavoro automatico fallisce: AMBIENTE (server, connessione, risorse, ruoli del database), PROGRAMMA (serve una modifica al codice o al database), CONFIGURAZIONE (si sistema dalle impostazioni dell''applicazione). Lo dichiarano dbops.processi.causa_fallimento (la natura dei fallimenti del processo quando l''ambiente e'' sano) e config.codici_errore.causa_fallimento (la natura di un errore preciso, quando lo sa), con FK verso questa tabella. maintenance.vw_job_run_da_guardare ne ricava la causa di ogni riga, e dbops.presidi_cause dice a chi tocca: le cause di quel presidio coincidono con questo vocabolario (pgTAP maintenance/test-vw-job-run-da-guardare-causa-v1). Seed: 80_data/sql/dbops/cause_fallimento.csv. Brief: brief-db-presidio-job-run-a-chi-tocca (D4).';

              COMMENT ON COLUMN dbops.cause_fallimento.codice IS
                  'La causa, chiave naturale: e'' anche il valore della colonna causa di maintenance.vw_job_run_da_guardare e di dbops.presidi_cause.causa per quel presidio.';

              COMMENT ON COLUMN dbops.cause_fallimento.descrizione IS
                  'Che cosa vuol dire la causa, per chi dichiara un processo o un codice d''errore. Il testo per chi agisce sta in dbops.presidi_testi.';

              -- Il pannello e il digest la leggono come applicazione. Solo
              -- zeroerp_app: i privilegi dei ruoli batch stanno nel
              -- provisioning (linee-guida-sql §11.6).
              GRANT SELECT ON dbops.cause_fallimento TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP TABLE IF EXISTS dbops.cause_fallimento;
