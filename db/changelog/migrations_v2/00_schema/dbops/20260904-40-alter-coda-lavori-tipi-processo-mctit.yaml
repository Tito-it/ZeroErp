# brief-db-processi-automatici-identita-e-perimetro §5.2 (fase 4) — ogni tipo
# della coda dichiara DI QUALE PROCESSO e'.
#
# ⛔ IL BUCO CHE CHIUDE (difetto A dell'analisi). `dbops.fn_accoda_lavoro`
# risolve `v_run_as := COALESCE(p_run_as, v_tipo.run_as_default)`: il default
# per-tipo e' un SUGGERIMENTO, non un vincolo, e `p_run_as` lo sovrascrive. Un
# tipo di dominio accodato con `p_run_as => 'SISTEMA'` passa tutti i cancelli e
# gira senza operatore — cioe' esattamente cio' che il cantiere esiste per
# impedire.
#   ⚠️ E il `CHECK` di tabella non lo prende: controlla la coerenza fra `run_as`
#   e `scope`, non la natura del lavoro.
#
# ⭐ NON si duplica la classe qui. Una colonna `classe` su questa tabella
# sarebbe una SECONDA scrittura dello stesso fatto, e due scritture dissentono.
# Si mette il puntatore al processo, e la classe si LEGGE da dbops.processi:
# fonte unica.
#
# ⚠️ Nasce NULLABLE, e il `NOT NULL` arriva in `90_end` (changeSet -42): la
# colonna la riempie il mirror CSV, che gira in `80_data` — cioe' DOPO
# `00_schema`. Un `NOT NULL` qui fallirebbe sulle righe gia' presenti. E'
# la regola gia' scritta: un `NOT NULL` va dove il dato SI PUO' FORNIRE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260904-40-alter-coda-lavori-tipi-processo-mctit.yaml

  - changeSet:
      id: 20260904-40-alter-coda-lavori-tipi-processo
      author: mctit
      failOnError: true
      comment: >
        Aggiunge dbops.coda_lavori_tipi.processo_codice (FK verso
        dbops.processi.codice): ogni tipo della coda dichiara di quale processo
        e', e la classe si legge da li' invece di essere duplicata. Nullable
        finche' il mirror CSV non l'ha riempita (NOT NULL nel changeSet -42).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: coda_lavori_tipi }
            - tableExists:
                { schemaName: dbops, tableName: processi }
            - not:
                - columnExists:
                    { schemaName: dbops, tableName: coda_lavori_tipi, columnName: processo_codice }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE dbops.coda_lavori_tipi
                  ADD COLUMN processo_codice text NULL;

              -- Hard FK: un tipo di coda non puo' dichiararsi di un processo
              -- che non esiste. E' lo stesso principio della FK su
              -- job_run_log.processo_codice — un cancello, non un referto.
              ALTER TABLE dbops.coda_lavori_tipi
                  ADD CONSTRAINT fk_coda_lavori_tipi_processi
                      FOREIGN KEY (processo_codice)
                      REFERENCES dbops.processi (codice);

              COMMENT ON COLUMN dbops.coda_lavori_tipi.processo_codice IS
                  'Il processo di dbops.processi a cui questo tipo di job appartiene (hard FK). ⭐ La CLASSE non si ripete qui: si legge da dbops.processi, cosi'' non ci sono due scritture dello stesso fatto che possano dissentire. La usa dbops.fn_accoda_lavoro per rifiutare un job di classe DOMINIO accodato con run_as diverso da OPERATORE — il default per-tipo e'' un suggerimento sovrascrivibile, questo e'' il vincolo. Brief: brief-db-processi-automatici-identita-e-perimetro §5.2.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE dbops.coda_lavori_tipi
                  DROP CONSTRAINT IF EXISTS fk_coda_lavori_tipi_processi;
              ALTER TABLE dbops.coda_lavori_tipi
                  DROP COLUMN IF EXISTS processo_codice;
