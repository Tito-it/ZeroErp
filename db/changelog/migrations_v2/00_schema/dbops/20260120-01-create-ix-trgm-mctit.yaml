    - changeSet:
          id: 20260120-01-03-create-ix-catalogo-articoli-descrizione-trgm
          author: mctit
          preConditions:
              - onFail: MARK_RAN
              - onError: HALT
              - tableExists:
                    schemaName: catalogo
                    tableName: articoli
              - columnExists:
                    schemaName: catalogo
                    tableName: articoli
                    columnName: descrizione
          sql:
              splitStatements: false
              sql: |
                  CREATE INDEX IF NOT EXISTS ix_catalogo_articoli_descrizione_trgm
                  ON catalogo.articoli
                  USING gin (descrizione gin_trgm_ops)
                  WITH (fastupdate = true, gin_pending_list_limit = 4194304)
                  TABLESPACE pg_default;


                  CREATE INDEX IF NOT EXISTS ix_catalogo_articoli_descrizione
                    ON catalogo.articoli USING btree
                    (descrizione COLLATE pg_catalog."default" ASC NULLS LAST)
                    WITH (fillfactor=100, deduplicate_items=True)
                    TABLESPACE pg_default;

                   CREATE INDEX IF NOT EXISTS ix_catalogo_unita_misura_descrizione
                    ON catalogo.unita_misura USING btree
                    (descrizione COLLATE pg_catalog."default" ASC NULLS LAST)
                    WITH (fillfactor=100, deduplicate_items=True)
                    TABLESPACE pg_default;

