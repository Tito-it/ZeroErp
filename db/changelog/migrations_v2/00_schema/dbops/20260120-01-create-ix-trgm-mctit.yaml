databaseChangeLog:
    - logicalFilePath: migrations_v2/00_schema/dbops/20260120-01-create-ix-trgm-mctit.yaml

    - changeSet:
          id: 20260120-01-create-ix-anagrafiche-soggetti-ragione-sociale-completa-trgm
          author: mctit
          preConditions:
              - onFail: MARK_RAN
              - onError: HALT
              - tableExists:
                    schemaName: anagrafiche
                    tableName: soggetti
              - columnExists:
                    schemaName: anagrafiche
                    tableName: soggetti
                    columnName: ragione_sociale_completa
          sql:
              splitStatements: false
              sql: |
                  CREATE INDEX IF NOT EXISTS ix_soggetti_ragione_sociale_completa_trgm
                  ON anagrafiche.soggetti
                  USING gin (ragione_sociale_completa gin_trgm_ops)
                  WITH (fastupdate = true, gin_pending_list_limit = 4194304)
                  TABLESPACE pg_default;

