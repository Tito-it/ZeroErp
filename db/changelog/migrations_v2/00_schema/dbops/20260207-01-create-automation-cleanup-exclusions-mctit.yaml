databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/dbops/20260207-01-create-automation-cleanup-exclusions-mctit.yaml

  - changeSet:
      id: 20260207-01-create-automation-cleanup-exclusions
      author: mctit
      comment: >
        Tabella esclusioni per il framework di cleanup (cleanup_at).
      changes:
        - createTable:
            schemaName: dbops
            tableName: automation_cleanup_exclusions
            remarks: "Esclusioni tabelle per il framework di cleanup basato su cleanup_at."
            columns:
              - column:
                  name: schema_name
                  type: text
                  remarks: "Schema della tabella esclusa."
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_automation_cleanup_exclusions
              - column:
                  name: table_name
                  type: text
                  remarks: "Tabella esclusa."
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_automation_cleanup_exclusions
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  remarks: "Se true, l'esclusione è attiva."
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: text
                  remarks: "Motivo dell'esclusione."
              - column:
                  name: data_insert
                  type: timestamptz
                  defaultValueComputed: "now()"
                  remarks: "Audit: inserimento."
                  constraints:
                    nullable: false
              - column:
                  name: user_insert
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente inserimento."
                  constraints:
                    nullable: false
              - column:
                  name: data_update
                  type: timestamptz
                  defaultValueComputed: "now()"
                  remarks: "Audit: aggiornamento."
                  constraints:
                    nullable: false
              - column:
                  name: user_update
                  type: text
                  defaultValueComputed: "CURRENT_USER"
                  remarks: "Audit: utente aggiornamento."
                  constraints:
                    nullable: false

        - createIndex:
            schemaName: dbops
            tableName: automation_cleanup_exclusions
            indexName: ix_automation_cleanup_exclusions_enabled
            columns:
              - column:
                  name: enabled
