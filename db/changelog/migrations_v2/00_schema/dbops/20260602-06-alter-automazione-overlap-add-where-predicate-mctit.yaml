# Copyright (C) 2026 Tid (Michele Carlo Titini)
#
# Fase 1 / refactor-overlap-v2: aggiunge dbops.automazione_overlap.where_predicate.
#
# Scopo: permettere al framework OVERLAP di creare EXCLUDE *parziali*
# (es. WHERE attivo IS TRUE), oggi non supportati (vedi guide/automazione-db.md
# §4.3). NULL = vincolo totale (comportamento attuale invariato).
#
# ATTENZIONE: where_predicate e' un frammento DDL di FIDUCIA, iniettato as-is nel
# constraint (non quotabile, e' un'espressione). Scrivibile SOLO da DBA — mai da
# input applicativo/utente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260602-06-alter-automazione-overlap-add-where-predicate-mctit.yaml

  - changeSet:
      id: 20260602-06-alter-automazione-overlap-add-where-predicate
      author: mctit
      comment: >
        Aggiunge la colonna where_predicate (text, nullable) a dbops.automazione_overlap
        per supportare EXCLUDE parziali. NULL = vincolo totale (default attuale).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: dbops
                tableName: automazione_overlap
            - not:
                - columnExists:
                    schemaName: dbops
                    tableName: automazione_overlap
                    columnName: where_predicate
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE dbops.automazione_overlap
                  ADD COLUMN where_predicate text;

              COMMENT ON COLUMN dbops.automazione_overlap.where_predicate IS
                  'Predicato per EXCLUDE parziale (es. ''attivo IS TRUE''). NULL = '
                  'vincolo totale. Frammento DDL di fiducia, iniettato as-is nel '
                  'constraint: scrivibile SOLO da DBA, mai da input applicativo. '
                  'rev 2026-06-02 (refactor-overlap-v2).';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE dbops.automazione_overlap
                  DROP COLUMN IF EXISTS where_predicate;
