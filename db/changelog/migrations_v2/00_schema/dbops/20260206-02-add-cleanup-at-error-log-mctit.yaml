# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/00_schema/dbops/20260206-02-add-cleanup-at-error-log-mctit.yaml

  - changeSet:
      id: 20260206-02-add-cleanup-at-error-log
      author: mctit
      comment: >
        Aggiunge cleanup_at a dbops.error_log per la pulizia programmata.
      preConditions:
        - onFail: CONTINUE
        - not:
          - columnExists:
              schemaName: dbops
              tableName: error_log
              columnName: cleanup_at
      changes:
        - addColumn:
            schemaName: dbops
            tableName: error_log
            columns:
              - column:
                  name: cleanup_at
                  type: timestamptz
                  remarks: "Timestamp programmato per la pulizia del record."

        - createIndex:
            schemaName: dbops
            tableName: error_log
            indexName: ix_error_log_cleanup_at
            columns:
              - column:
                  name: cleanup_at

        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON COLUMN dbops.error_log.cleanup_at
                IS 'Timestamp programmato per la pulizia del record.';
