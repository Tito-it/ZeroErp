# Codice errore strutturato — IL REGISTRO DEI CODICI FUORI CONVENZIONE
#   Brief: brief-db-codice-errore-strutturato.md §7 e §10
#   Guardrail che lo legge: scripts/sql/guardrail_codice_errore_strutturato.sql
#   Seed delle 57 voci: 20260805-07
#
# ── IL PROBLEMA CHE QUESTO REGISTRO CHIUDE ──────────────────────────────
#   `docs/it/dev/api.md` dichiara la convenzione `E_{MODULO}_{TIPO}`. Nel DB
#   ci sono 57 codici che non la rispettano — PRATICHE_TRANSIZIONE_NON_AMMESSA,
#   PREV_TRANSIZIONE_NON_AMMESSA, ERRORE_PARAMETRI, CF_NON_VALIDO,
#   SEQUENZA_NON_CONFIGURATA... — tutti regolarmente a seed, usati da 77 call
#   site.
#
#   ⚠️ Finche' il codice non arrivava al backend la cosa era invisibile. Col
#   campo strutturato (20260805-05) ARRIVA, e li' incontra un secondo muro:
#   non sono registrati in error_policies.py, e `ErrorPolicyRegistry.resolve`
#   ha la scorciatoia «400 errore di validazione» SOLO per i codici che
#   cominciano per `E_`. Tutti gli altri cadono su E_GENERICO -> HTTP 500.
#   Cioe': quello che oggi e' un 400 diventerebbe un 500.
#
#   Decisione di Tid (2026-08-05), e sono due meta' di una cosa sola:
#     · REGISTRARE i 57 in error_policies.py  -> lato BE, prerequisito
#       dell'adozione del campo (non dopo: prima o insieme)
#     · CHIUDERE IL RUBINETTO                 -> qui. Rinominare i 57 costerebbe
#       il seed + 77 call site + i pgTAP che li asseriscono, e non comprerebbe
#       niente che la registrazione non compri. Ma registrare e basta lascia in
#       piedi l'obiezione giusta: il PROSSIMO codice nascerebbe di nuovo storto.
#
# ── ⚠️ E' UN DEBITO, NON UN ELENCO DI ECCEZIONI ─────────────────────────
#   Stessa filosofia di dbops.riferimenti_morti_esenzioni e di
#   db/pgtap/baseline-rossi.tsv: **deve calare**. Il guardrail lo tiene onesto
#   nei due versi — controllo (B) «un codice nuovo fuori convenzione non passa»
#   e controllo (C) «una voce che non corrisponde piu' a nessun codice a seed
#   va TOLTA». Senza il secondo, un registro puo' solo allungarsi, e un
#   registro che si allunga e basta e' il posto dove i problemi vanno a
#   sparire.
#
# ── ⚠️ PERCHE' QUI NON C'E' UN `motivo` PER RIGA ────────────────────────
#   dbops.riferimenti_morti_esenzioni impone un motivo di almeno 40 caratteri
#   per riga, e li' e' giusto: ogni voce e' una DECISIONE INDIPENDENTE (perche'
#   quel difetto e' ancora li' e cosa lo toglierebbe).
#
#   Qui no. Le 57 voci sono UNA SOLA decisione applicata 57 volte. Un `motivo`
#   obbligatorio produrrebbe 57 copie della stessa frase: rumore che somiglia
#   al rigore, e che dopo tre mesi nessuno rilegge. La motivazione sta nel
#   COMMENT ON TABLE, dove si scrive una volta e si legge una volta.
#
#   Il CHECK che invece serve e' un altro: un codice CONFORME non puo' entrare
#   nel registro. Senza, il registro diventerebbe il posto dove si parcheggia
#   qualunque codice per farlo passare — cioe' l'opposto del suo scopo.
#
#   ⚠️ Tabella tecnica: PK `INTEGER GENERATED BY DEFAULT AS IDENTITY`, non UUID
#   (linee-guida-sql: UUID per le entita' master). I trigger di
#   audit/tx_id/storico li mette l'automazione notturna (contesto `ci_apply`):
#   su un migrate manuale la tabella nasce senza, ed e' atteso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260805-06-create-messaggi-errore-codici-legacy-mctit.yaml

  - changeSet:
      id: 20260805-06-create-messaggi-errore-codici-legacy
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Registro del debito sui codici di config.messaggi_errore che non seguono
        la convenzione E_{MODULO}_{TIPO} di api.md. Letto dal guardrail CI
        scripts/sql/guardrail_codice_errore_strutturato.sql, che rifiuta i codici
        nuovi fuori convenzione e segnala le voci del registro ormai di troppo.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE IF NOT EXISTS dbops.messaggi_errore_codici_legacy (
                  id                 INTEGER GENERATED BY DEFAULT AS IDENTITY,
                  -- Il codice cosi' come sta in config.messaggi_errore.
                  codice             TEXT NOT NULL,
                  data_registrazione DATE NOT NULL DEFAULT CURRENT_DATE,
                  data_insert        TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_insert        TEXT NOT NULL DEFAULT CURRENT_USER,
                  data_update        TIMESTAMPTZ NOT NULL DEFAULT now(),
                  user_update        TEXT NOT NULL DEFAULT CURRENT_USER,
                  tx_id              UUID,
                  CONSTRAINT pk_messaggi_errore_codici_legacy PRIMARY KEY (id),
                  CONSTRAINT uq_messaggi_errore_codici_legacy_codice
                      UNIQUE (codice),
                  -- ⚠️ Un codice CONFORME non entra qui. Senza questo vincolo il
                  -- registro diventerebbe il posto dove si parcheggia qualunque
                  -- codice per farlo passare, cioe' l'opposto del suo scopo.
                  -- Il pattern e' lo stesso, identico, del controllo (B) del
                  -- guardrail: se diverge, il registro e il presidio finiscono
                  -- per parlare di due insiemi differenti.
                  CONSTRAINT chk_messaggi_errore_codici_legacy_non_conforme
                      CHECK (codice !~ '^E_[A-Z0-9_]+$')
              );

              COMMENT ON TABLE dbops.messaggi_errore_codici_legacy IS
              'Registro del debito: i codici di config.messaggi_errore che non seguono la convenzione E_{MODULO}_{TIPO} dichiarata in docs/it/dev/api.md. Sono 57, tutti a seed e in uso su 77 call site, nati prima che la convenzione fosse presidiata. UNA sola decisione (brief-db-codice-errore-strutturato §7, 2026-08-05): si registrano invece di rinominarli — la rinomina costerebbe seed + call site + pgTAP senza comprare nulla che la registrazione in error_policies.py non compri — ma il rubinetto si chiude, cosi'' il 58esimo non nasce. E'' un debito: DEVE calare, e il guardrail scripts/sql/guardrail_codice_errore_strutturato.sql segnala sia i codici nuovi fuori convenzione sia le voci di questo registro che non corrispondono piu'' a nessun codice a seed.';

              COMMENT ON COLUMN dbops.messaggi_errore_codici_legacy.codice IS
              'Codice cosi'' come sta in config.messaggi_errore. Esce da questo registro quando il codice viene rinominato a E_* oppure eliminato: in entrambi i casi la riga va TOLTA con un changeSet 80_data, e il controllo (C) del guardrail lo pretende.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.messaggi_errore_codici_legacy;
