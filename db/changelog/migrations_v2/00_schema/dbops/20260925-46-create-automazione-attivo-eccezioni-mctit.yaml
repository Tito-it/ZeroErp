# P-2 — dbops.automazione_attivo_eccezioni: le FK che l'automazione ATTIVO NON
#   lega (niente block sul padre, niente require sul figlio), ciascuna col suo
#   perche'.
#   Brief: brief-db-blocco-login-per-credenziale, sezione 12.3
#
# ── DA DOVE NASCE ─────────────────────────────────────────────────────
#   Col P-2 la veste OPERATORE nasce SPENTA (20260925-42), e la accende
#   l'attivazione dell'invito. L'automazione ATTIVO lega invece
#   config.profili_accesso_bindings (figlio) a anagrafiche.identita_digitali
#   (padre): un binding attivo solo sotto un'identita' attiva, un'identita' non
#   si spegne con binding attivi. Risultato: un SUPER_ADMIN creato con la veste
#   spenta muore al COMMIT («Padre non attivo: figlio attivo non consentito»), e
#   nessun profilo si assegna a un operatore che non ha ancora accettato
#   l'invito.
#   ⭐ Decisione di Tid, 2026-09-25: PORTA E PROFILI SI SGANCIANO. La veste
#   attiva dice se la porta e' aperta; il binding dice cosa si puo' fare una
#   volta dentro. Sono due domande, e i lettori dei permessi (fn_is_super_admin,
#   fn_get_profili_accesso_applicabili, i due check anti-lockout) le chiedono
#   gia' entrambe, in AND.
#
# ── PERCHE' UN REGISTRO, E NON UN'ALTRA SEDE ──────────────────────────
#   L'automazione prende OGNI FK monocolonna in scope. L'unico filtro esistente
#   e' per TABELLA (dbops.fn_table_in_scope), e toglierebbe
#   profili_accesso_bindings da tutte le sue coppie — anche quelle giuste
#   (profili_accesso, unita_organizzative). dbops.automation_overrides_cols ha
#   la PK (schema, tabella, ruolo): e' «quale colonna fa quel mestiere», non
#   «questa FK no». Qui l'eccezione e' una FK, e porta il suo MOTIVO come dato:
#   un'eccezione senza perche' e' un buco nel framework, non una decisione.
#
# Lo legge dbops.fn_run_automations_attivo (20260925-48), che salta le coppie a
# registro, e dbops.fn_ritira_attivo_eccezioni (20260925-47), che ritira i
# trigger gia' generati. Seed: 80_data 20260925-49.
# Niente attivo: una riga si ritira togliendola (CSV + DELETE forward-only).
# Niente RLS (tabella tecnica, linee-guida §10.1).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20260925-46-create-automazione-attivo-eccezioni-mctit.yaml

  - changeSet:
      id: 20260925-46-create-automazione-attivo-eccezioni
      author: mctit
      failOnError: true
      comment: >
        dbops.automazione_attivo_eccezioni: le FK (schema, tabella figlia, colonna FK) che
        l'automazione ATTIVO non lega, col motivo obbligatorio. Prima riga (80_data -49):
        profili_accesso_bindings.identita_digitale_id — porta e profili si sganciano (decisione
        Tid 2026-09-25). Brief: brief-db-blocco-login-per-credenziale §12.3.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                schemaName: dbops
                tableName: automazione_attivo_eccezioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.automazione_attivo_eccezioni (
                  id            integer GENERATED BY DEFAULT AS IDENTITY
                                CONSTRAINT pk_automazione_attivo_eccezioni PRIMARY KEY,
                  schema_figlia text        NOT NULL,
                  tabella_figlia text       NOT NULL,
                  colonna_fk    text        NOT NULL,
                  motivo        text        NOT NULL,
                  data_insert   timestamptz NOT NULL DEFAULT now(),
                  user_insert   text        NOT NULL DEFAULT CURRENT_USER,
                  data_update   timestamptz NOT NULL DEFAULT now(),
                  user_update   text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT uq_automazione_attivo_eccezioni_fk
                      UNIQUE (schema_figlia, tabella_figlia, colonna_fk),
                  CONSTRAINT chk_automazione_attivo_eccezioni_motivo
                      CHECK (btrim(motivo) <> '')
              );

              COMMENT ON TABLE dbops.automazione_attivo_eccezioni IS
                  'Le FK che l''automazione ATTIVO NON lega: per una riga qui, dbops.fn_run_automations_attivo non genera ne'' il block sul padre ne'' il require sul figlio, e dbops.fn_ritira_attivo_eccezioni toglie quelli gia'' generati. Una FK per riga (schema e tabella del FIGLIO, colonna FK), col MOTIVO obbligatorio: un''eccezione senza perche'' e'' un buco nel framework. Prima riga il 2026-09-25: config.profili_accesso_bindings.identita_digitale_id — porta e profili si sganciano (brief-db-blocco-login-per-credenziale §12.3). Seed da 80_data (CSV dbops/automazione_attivo_eccezioni.csv).';
              COMMENT ON COLUMN dbops.automazione_attivo_eccezioni.schema_figlia IS
                  'Schema della tabella FIGLIA, quella che porta la FK.';
              COMMENT ON COLUMN dbops.automazione_attivo_eccezioni.tabella_figlia IS
                  'Tabella FIGLIA, quella che porta la FK.';
              COMMENT ON COLUMN dbops.automazione_attivo_eccezioni.colonna_fk IS
                  'Colonna FK della figlia (monocolonna, come le sole FK che l''automazione tratta). Il padre si ricava dalla FK stessa.';
              COMMENT ON COLUMN dbops.automazione_attivo_eccezioni.motivo IS
                  'Perche'' quella coppia padre/figlio NON si lega sull''attivo. Obbligatorio.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS dbops.automazione_attivo_eccezioni;
