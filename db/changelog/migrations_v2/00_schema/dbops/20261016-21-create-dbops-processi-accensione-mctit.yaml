# LA SCELTA A MANO DI UNA MACCHINA
#   NASCE dbops.processi_accensione: «su questa installazione il processo X e'
#   spento (o acceso), e perche'». Scavalca il default per ambiente del
#   catalogo (dbops.processi).
#   Brief: brief-db-processi-accensione-per-ambiente (A-2, §5.2)
#
# -- DATO DI MACCHINA -------------------------------------------------
#   Come dbops.processi_identita: la scelta di un'installazione, non del
#   software. Nessun seed: la scrive l'operatore, dal drawer dei processi, col
#   verbo dbops.fn_imposta_accensione_processo (20261016-27). Una riga per
#   processo (UNIQUE): assenza = vale il default.
#
# -- MOTIVO OBBLIGATORIO -----------------------------------------------
#   Spegnere o riaccendere a mano e' un gesto che qualcuno dovra' capire
#   dopo: chi, quando (audit) e perche' (motivo, non vuoto).
#   ⚠️ L'audit dell'aggiornamento lo scrive il verbo: le automazioni di
#   ci_apply non coprono dbops (automation_scope.csv: solo sessioni_utente),
#   quindi niente trigger di audit, tx_id o storico qui. La riga dice l'ULTIMA
#   scelta; una storia delle scelte, se servira', e' un cantiere a parte
#   (allargare automation_scope e dichiarare la riga in storico_scope_policy).
#
# -- I GUARD ------------------------------------------------------------
#   Un non spegnibile non si spegne, un processo senza sveglia non si
#   accende ne' si spegne: dbops.trgfn_processi_accensione_guard
#   (20261016-22/-23).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/dbops/20261016-21-create-dbops-processi-accensione-mctit.yaml

  - changeSet:
      id: 20261016-21-create-dbops-processi-accensione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea dbops.processi_accensione: la scelta a mano di un'installazione (acceso o spento,
        col motivo), che scavalca il default per ambiente. Brief: brief-db-processi-accensione-per-ambiente.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists: { schemaName: dbops, tableName: processi }
            - not:
                - tableExists: { schemaName: dbops, tableName: processi_accensione }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE dbops.processi_accensione (
                  id          bigint      GENERATED BY DEFAULT AS IDENTITY,
                  processo_id integer     NOT NULL,
                  acceso      boolean     NOT NULL,
                  motivo      text        NOT NULL,
                  data_insert timestamptz NOT NULL DEFAULT now(),
                  user_insert text        NOT NULL DEFAULT CURRENT_USER,
                  data_update timestamptz NOT NULL DEFAULT now(),
                  user_update text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_processi_accensione PRIMARY KEY (id),
                  CONSTRAINT uq_processi_accensione_processo UNIQUE (processo_id),
                  CONSTRAINT fk_processi_accensione_processi
                      FOREIGN KEY (processo_id) REFERENCES dbops.processi (id)
                      ON UPDATE CASCADE ON DELETE CASCADE,
                  CONSTRAINT chk_processi_accensione_motivo
                      CHECK (btrim(motivo) <> '')
              );

              COMMENT ON TABLE dbops.processi_accensione IS
                  'La scelta a mano di questa installazione sulla sveglia di un processo: acceso o spento, col motivo. Scavalca il default per ambiente di dbops.processi (acceso_in_sviluppo, acceso_in_produzione); assenza della riga = vale il default. Dato di MACCHINA (come dbops.processi_identita): nessun seed, la scrive l''operatore col verbo dbops.fn_imposta_accensione_processo. Un non spegnibile non si spegne e un processo senza sveglia (CODA, ritirato) non ha righe: dbops.trgfn_processi_accensione_guard. Lo stato effettivo lo dice dbops.fn_processo_acceso_dichiarato (e maintenance.fn_sveglia_accesa per le sveglie). Brief: brief-db-processi-accensione-per-ambiente (A-2).';
              COMMENT ON COLUMN dbops.processi_accensione.processo_id IS
                  'FK -> dbops.processi.id. Una riga per processo (uq_processi_accensione_processo).';
              COMMENT ON COLUMN dbops.processi_accensione.acceso IS
                  'La scelta: true acceso, false spento. Vale al posto del default per ambiente. false su un processo non spegnibile e'' rifiutato (E_PROCESSO_NON_SPEGNIBILE).';
              COMMENT ON COLUMN dbops.processi_accensione.motivo IS
                  'Perche'' la scelta: obbligatorio e non vuoto. Chi viene dopo deve capire chi ha spento (audit), quando (audit) e perche'' (qui).';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TABLE IF EXISTS dbops.processi_accensione;
