# ------------------------------------------------------------
# Tabella ui.dashboard_definizione.
#
# Why: catalogo delle dashboard configurabili del sistema. Ricalca
# ui.lista_definizione, ma SENZA vista_sql: una dashboard non ha una
# vista sorgente unica (i suoi widget deep-linkano a viste diverse e
# ciascun contatore e' calcolato dal BE). Il codice (es. 'home') e'
# l'identificatore stabile usato dal frontend e dalla funzione di
# risoluzione ui.fn_resolve_dashboard_config.
#
# Prima dashboard: 'home'. In arrivo (a modello): backlog, fatturazione
# (le lenti di brief-design-fatturazione-due-lenti.md) — se resteranno
# griglie-card personalizzabili per utente.
#
# Ref: brief-db-dashboard-home.md §3.ter
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260721-13-ddl-ui-dashboard-definizione-mctit.yaml

  - changeSet:
      id: 20260721-13-01-create-ui-dashboard-definizione
      author: mctit
      comment: "Catalogo delle dashboard configurabili del sistema (senza vista_sql)"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: ui
                tableName: dashboard_definizione
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.dashboard_definizione (
                id           INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                codice       VARCHAR(80)  NOT NULL,
                descrizione  VARCHAR(200) NOT NULL,
                note         TEXT,
                attivo       BOOLEAN NOT NULL DEFAULT TRUE,

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_dashboard_definizione_codice UNIQUE (codice)
              );

              COMMENT ON TABLE  ui.dashboard_definizione IS 'Catalogo delle dashboard configurabili. Una riga per dashboard personalizzabile (prima: home). Senza vista_sql: nessuna vista sorgente unica.';
              COMMENT ON COLUMN ui.dashboard_definizione.codice IS 'Identificatore stabile usato da frontend e ui.fn_resolve_dashboard_config (es. home).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.dashboard_definizione CASCADE;
