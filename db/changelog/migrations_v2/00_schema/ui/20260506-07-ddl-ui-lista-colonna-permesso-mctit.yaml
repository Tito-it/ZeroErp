# Tabella ui.lista_colonna_permesso.
#
# Why: controllo accesso a livello di singola colonna, per profilo
# di accesso. Estende il sistema permessi esistente senza duplicarlo:
# usa config.profili_accesso come gli altri meccanismi di permesso.
# La risoluzione usa fn_get_profili_accesso_applicabili.
#
# Modello deny-list (lista_colonna.sensibile=FALSE):
#   assenza di riga = TUTTO (accesso pieno).
#   si scrivono solo le restrizioni.
#
# Modello allow-list (lista_colonna.sensibile=TRUE):
#   assenza di riga = BLOCCATO (negato di default).
#   si devono scrivere esplicitamente i grant.
#
# Logica di risoluzione quando piu' profili applicabili coprono
# la stessa colonna: vince il profilo con priorita piu' bassa (AD_HOC=1
# prevale su REPARTO/PORTALE=2); a parita' di priorita' vince il
# livello piu' restrittivo (BLOCCATO > LETTURA > TUTTO).
# Implementata in fn_resolve_lista_config con DISTINCT ON.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260506-07-ddl-ui-lista-colonna-permesso-mctit.yaml

  - changeSet:
      id: 20260506-07-01-create-ui-lista-colonna-permesso
      author: mctit
      comment: "Permessi a livello di colonna per profilo di accesso (deny-list / allow-list)"
      preConditions:
        - onFail: MARK_RAN
        - and:
            - not:
                - tableExists:
                    schemaName: ui
                    tableName: lista_colonna_permesso
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT COUNT(*) FROM pg_catalog.pg_type t
                  JOIN pg_catalog.pg_namespace n ON n.oid = t.typnamespace
                  WHERE t.typname = 'livello_accesso' AND n.nspname = 'config'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.lista_colonna_permesso (
                id                   INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                colonna_id           INTEGER NOT NULL,
                profilo_accesso_id   INTEGER NOT NULL,
                  -- Stessa entita del sistema permessi (profili_accesso_aree, profili_accesso_azioni).
                  -- Non duplicare la logica di risoluzione: usare fn_get_profili_accesso_applicabili.

                livello_accesso      config.livello_accesso NOT NULL,
                  -- TUTTO    -> visibile e esportabile
                  -- LETTURA  -> visibile a video, non esportabile
                  -- BLOCCATO -> nascosta completamente
                  -- Tipo ENUM condiviso con l'intero sistema permessi

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_lista_colonna_permesso_col_profilo
                    UNIQUE (colonna_id, profilo_accesso_id),

                CONSTRAINT fk_lista_colonna_permesso_lista_colonna
                    FOREIGN KEY (colonna_id) REFERENCES ui.lista_colonna(id) ON DELETE CASCADE,

                CONSTRAINT fk_lista_colonna_permesso_profili_accesso
                    FOREIGN KEY (profilo_accesso_id) REFERENCES config.profili_accesso(id)
              );

              COMMENT ON TABLE  ui.lista_colonna_permesso IS 'Permessi a livello colonna per profilo_accesso. deny-list per non sensibili, allow-list per sensibili.';
              COMMENT ON COLUMN ui.lista_colonna_permesso.profilo_accesso_id IS 'config.profili_accesso: stessa entita del PermissionResolver. Non scrivere logica di risoluzione duplicata.';
              COMMENT ON COLUMN ui.lista_colonna_permesso.livello_accesso    IS 'TUTTO=visibile+esportabile; LETTURA=visibile non esportabile; BLOCCATO=nascosta.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.lista_colonna_permesso CASCADE;
