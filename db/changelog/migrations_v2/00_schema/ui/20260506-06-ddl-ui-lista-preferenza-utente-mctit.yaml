# Tabella ui.lista_preferenza_utente.
#
# Why: preferenza personale dell'utente per una lista. Un solo record
# per coppia (auth_user, lista). La configurazione e' in JSONB perche'
# la preferenza si legge sempre intera e la struttura e' resiliente
# ad aggiornamenti futuri (raggruppamenti, vista compatta, ecc.).
#
# I codici colonna nel JSONB referenziano lista_colonna.codice (stringa)
# non lista_colonna.id: protegge da cambi di ID e permette di ignorare
# silenziosamente colonne disattivate.
#
# Nota: la FK verso django.auth_user non e' qui ma in 90_end perche'
# auth_user e' creata da Django migrate, che gira dopo Liquibase.
# La colonna auth_user_id e' un INTEGER senza FK constraint — la FK
# e' aggiunta successivamente dal file in 90_end.
#
# preset_base_data_update: snapshot di data_update del preset al momento
# del salvataggio della preferenza. Permette di rilevare se il preset
# e' stato aggiornato dopo l'ultimo salvataggio utente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260506-06-ddl-ui-lista-preferenza-utente-mctit.yaml

  - changeSet:
      id: 20260506-06-01-create-ui-lista-preferenza-utente
      author: mctit
      comment: "Preferenza personale utente per una lista (un record per utente/lista)"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: ui
                tableName: lista_preferenza_utente
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.lista_preferenza_utente (
                id                       INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                auth_user_id             INTEGER NOT NULL,
                  -- FK verso django.auth_user aggiunta in 90_end
                lista_id                 INTEGER NOT NULL,
                preset_base_id           INTEGER,
                  -- preset da cui e' partita la personalizzazione (riferimento storico)

                preset_base_data_update  TIMESTAMP,
                  -- snapshot di lista_preset.data_update al momento del salvataggio.
                  -- Se lista_preset.data_update > questo valore, il preset e' cambiato.

                configurazione           JSONB NOT NULL,
                  -- {
                  --   "colonne": [
                  --     {"codice":"ragione_sociale","ordine":1,"larghezza":240,"visibile":true,"fissata":true},
                  --     ...
                  --   ],
                  --   "ordinamento": [{"col":"ragione_sociale","dir":"asc"}],
                  --   "filtri": {"attivo": true},
                  --   "pagina_dimensione": 50
                  -- }

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                data_update  TIMESTAMP,

                CONSTRAINT uq_ui_lista_preferenza_utente_user_lista
                    UNIQUE (auth_user_id, lista_id),

                CONSTRAINT fk_lista_preferenza_utente_lista_definizione
                    FOREIGN KEY (lista_id) REFERENCES ui.lista_definizione(id),

                CONSTRAINT fk_lista_preferenza_utente_lista_preset
                    FOREIGN KEY (preset_base_id) REFERENCES ui.lista_preset(id)
                -- fk_lista_preferenza_utente_auth_user: aggiunta in 90_end
                -- (django.auth_user creata da Django migrate, dopo Liquibase)
              );

              COMMENT ON TABLE  ui.lista_preferenza_utente IS 'Preferenza personale utente per lista. JSONB per resilienza ad evoluzioni future.';
              COMMENT ON COLUMN ui.lista_preferenza_utente.auth_user_id            IS 'FK verso django.auth_user, aggiunta in 90_end (auth_user creata da Django migrate).';
              COMMENT ON COLUMN ui.lista_preferenza_utente.preset_base_data_update IS 'Snapshot lista_preset.data_update al salvataggio. Confrontare con data_update corrente per rilevare preset aggiornati.';
              COMMENT ON COLUMN ui.lista_preferenza_utente.configurazione          IS 'Struttura JSONB: colonne (codice, ordine, larghezza, visibile, fissata), ordinamento, filtri, pagina_dimensione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.lista_preferenza_utente CASCADE;
