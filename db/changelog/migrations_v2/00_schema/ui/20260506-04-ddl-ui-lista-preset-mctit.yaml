# ------------------------------------------------------------
# Tabella ui.lista_preset.
#
# Why: configurazioni predefinite per le liste, a tre livelli:
#   'sistema'           -> default globale per tutti
#   'emittente_fiscale' -> override per una specifica societa'
#   'ruolo'             -> override per un profilo di accesso
#
# Il campo profilo_accesso_id referenzia config.profili_accesso —
# la stessa entita' del sistema permessi. La risoluzione usa
# fn_get_profili_accesso_applicabili, identica al PermissionResolver.
#
# Il UNIQUE INDEX parziale su is_default=TRUE garantisce un solo
# preset di default per combinazione (lista, ambito, profilo, emittente).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260506-04-ddl-ui-lista-preset-mctit.yaml

  - changeSet:
      id: 20260506-04-01-create-ui-lista-preset
      author: mctit
      comment: "Preset di configurazione per le liste (sistema / emittente / profilo)"
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - tableExists:
                schemaName: ui
                tableName: lista_preset
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.lista_preset (
                id                       INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                lista_id                 INTEGER NOT NULL,
                codice                   VARCHAR(80)  NOT NULL,
                descrizione              VARCHAR(200) NOT NULL,

                ambito                   ui.ambito_preset NOT NULL,
                  -- sistema | emittente_fiscale | ruolo

                profilo_accesso_id       INTEGER,
                  -- valorizzato quando ambito='ruolo'

                emittente_fiscale_id     INTEGER,
                  -- valorizzato quando ambito='emittente_fiscale'

                is_default               BOOLEAN NOT NULL DEFAULT FALSE,

                pagina_dimensione        INTEGER DEFAULT 25,
                ordinamento_default      JSONB,
                  -- es. [{"col": "ragione_sociale", "dir": "asc"}]
                filtri_default           JSONB,
                  -- filtri preimpostati (formato condiviso con il componente Vue)

                attivo                   BOOLEAN NOT NULL DEFAULT TRUE,

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_lista_preset_lista_codice
                    UNIQUE (lista_id, codice),

                -- coerenza ambito / riferimenti (il ENUM garantisce gia' i valori ammessi)
                CONSTRAINT chk_ui_lista_preset_ambito_refs
                    CHECK (
                      (ambito = 'sistema'
                         AND profilo_accesso_id IS NULL
                         AND emittente_fiscale_id IS NULL)
                      OR (ambito = 'ruolo'
                         AND profilo_accesso_id IS NOT NULL
                         AND emittente_fiscale_id IS NULL)
                      OR (ambito = 'emittente_fiscale'
                         AND emittente_fiscale_id IS NOT NULL
                         AND profilo_accesso_id IS NULL)
                    ),

                CONSTRAINT fk_lista_preset_lista_definizione
                    FOREIGN KEY (lista_id) REFERENCES ui.lista_definizione(id),

                CONSTRAINT fk_lista_preset_profili_accesso
                    FOREIGN KEY (profilo_accesso_id) REFERENCES config.profili_accesso(id),

                CONSTRAINT fk_lista_preset_emittenti_fiscali
                    FOREIGN KEY (emittente_fiscale_id) REFERENCES anagrafiche.emittenti_fiscali(id)
              );

              -- Un solo preset di default per (lista, ambito, profilo, emittente)
              CREATE UNIQUE INDEX uq_ui_lista_preset_default
                ON ui.lista_preset (
                  lista_id,
                  ambito,
                  COALESCE(profilo_accesso_id, 0),
                  COALESCE(emittente_fiscale_id, 0)
                )
                WHERE is_default = TRUE;

              COMMENT ON TABLE  ui.lista_preset IS 'Configurazioni predefinite per le liste: sistema (globale), emittente_fiscale, ruolo (via profilo_accesso).';
              COMMENT ON COLUMN ui.lista_preset.profilo_accesso_id   IS 'config.profili_accesso: stessa entita del sistema permessi. Risolto via fn_get_profili_accesso_applicabili.';
              COMMENT ON COLUMN ui.lista_preset.filtri_default       IS 'Formato JSONB condiviso con il componente Vue filtri. Definirlo prima di seedare i preset.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.lista_preset CASCADE;
