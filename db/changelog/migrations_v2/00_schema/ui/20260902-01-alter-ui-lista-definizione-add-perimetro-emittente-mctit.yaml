# IL TERZO CASO: una lista che di emittente non ne ha nessuno
#   ui.lista_definizione.perimetro_emittente
#   Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.16
#
# ── ⛔ IL PROBLEMA, E PERCHE' NON ERA UNA RIGA DI CSV ────────────
#   `multi_emittente` risponde a UNA domanda: «so dire da quale emittente
#   arriva ogni riga?». Quando lo scope di chi entra contiene piu' di un
#   emittente — in pratica il solo super admin — una lista con `false` chiede
#   di sceglierne uno prima di entrare.
#   ⚠️ Su un catalogo GLOBALE quella domanda non ha risposta: non c'e' nessun
#   emittente da dire. Il `false` e' letteralmente vero e l'effetto e'
#   sbagliato — la schermata sbarra la strada proprio al super admin, che per
#   la decisione D6 e' l'unico che puo' aprirla.
#
#   ⛔ La strada breve era mettere `multi_emittente = true` sulla riga della
#   lista famiglie. Sarebbe stato **vantare una capacita' che quella lista non
#   ha**, e non e' un'opinione: `dbops.vw_liste_multi_emittente_non_certificate`
#   pretende che una lista con `true` esponga l'emittente nella riga, e DUE
#   pgTAP la vogliono a zero righe (test-lista-definizione-multi-emittente-v1
#   §6, test-viste-dash-emittente-v1 §11). Il presidio avrebbe fatto
#   esattamente il suo mestiere, e la risposta sarebbe stata allargarlo con
#   un'eccezione: cioe' spegnerlo un pezzo alla volta.
#
# ── ⭐ IL TERZO STATO, e perche' e' una colonna e non un valore in piu' ──
#   Le due domande sono indipendenti:
#     * `perimetro_emittente` — questa lista ha righe che appartengono a un
#       emittente? (natura del dato)
#     * `multi_emittente` — se ce l'hanno, la lista sa dire quale?
#       (capacita' conquistata, e certificata)
#   ⚠️ Comprimerle in un enum a tre valori le legherebbe: e' il flag che
#   risponde a due domande in AND, che poi non si riesce piu' a invertire.
#
# ── ⭐ DEFAULT `true`, ed e' il verso prudente ───────────────────
#   Una lista nuova nasce **con** perimetro: il comportamento delle altre 58
#   non cambia di una virgola. Si dichiara la globalita', non la si eredita.
#
# ── ⛔ IL CHECK CHE IMPEDISCE LA COMBINAZIONE INCOERENTE ─────────
#   `perimetro_emittente = false` + `multi_emittente = true` significherebbe
#   «non ho emittenti, e so dirti quale sono»: una frase senza senso. Il CHECK
#   la rende impossibile invece di lasciarla a un lettore attento.
#
# ⚠️ Il valore per la lista famiglie NON si scrive qui: sta nel CSV
#   (20260902-02). Un UPDATE in 00_schema andrebbe perso su un database
#   ricostruito da zero, dove qui la tabella e' ancora vuota.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260902-01-alter-ui-lista-definizione-add-perimetro-emittente-mctit.yaml

  - changeSet:
      id: 20260902-01-alter-ui-lista-definizione-add-perimetro-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Aggiunge ui.lista_definizione.perimetro_emittente — il TERZO caso: una lista i cui dati non
        appartengono a nessun emittente. ⛔ Serve perche'' `multi_emittente` risponde a «so dire da quale
        emittente arriva la riga?», e su un catalogo globale quella domanda non ha risposta: il `false`
        e'' vero e l''effetto e'' sbagliato, perche'' sbarra la schermata al super admin. Metterlo a `true`
        sarebbe stato vantare una capacita'' inesistente, e i due pgTAP sulla vista di certificazione
        l''avrebbero preso. ⭐ Due domande indipendenti, due colonne: comprimerle in un enum le
        legherebbe. ⭐ Default TRUE: il comportamento delle altre 58 liste non cambia. ⛔ Un CHECK
        impedisce «non ho emittenti e so dirti quale sono». Piano:
        brief-be-fe-crud-registri-di-numerazione, sezione 11.16.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: ui
                tableName: lista_definizione
            - not:
                - columnExists:
                    schemaName: ui
                    tableName: lista_definizione
                    columnName: perimetro_emittente
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE ui.lista_definizione
                  ADD COLUMN perimetro_emittente BOOLEAN NOT NULL DEFAULT TRUE;

              -- ⛔ «Non ho emittenti, e so dirti quale sono» non e' una
              --   configurazione insolita: e' una frase senza senso. Il CHECK
              --   la rende impossibile invece di affidarla a chi rilegge.
              ALTER TABLE ui.lista_definizione
                  ADD CONSTRAINT chk_ui_lista_definizione_perimetro_coerente
                  CHECK (perimetro_emittente OR NOT multi_emittente);

              COMMENT ON COLUMN ui.lista_definizione.perimetro_emittente IS
              'Natura del dato: le righe di questa lista appartengono a un emittente fiscale? ⭐ E'' IL TERZO CASO, e senza di lui `multi_emittente` risponde a una domanda che per certe liste non esiste. `multi_emittente` dice «so dire da QUALE emittente arriva ogni riga»; su un catalogo GLOBALE — le famiglie di documento, le liste tecniche di ui, i vocabolari di config — non c''e'' nessun emittente da dire, quindi il suo `false` e'' letteralmente vero e l''effetto e'' sbagliato: la schermata chiede di scegliere un emittente prima di entrare, e sbarra la strada proprio a chi ha lo scope piu'' largo. ⛔ LA STRADA BREVE ERA UN''ALTRA E NON SI E'' PRESA: dichiarare quelle liste `multi_emittente = true` avrebbe vantato una capacita'' che non hanno, e dbops.vw_liste_multi_emittente_non_certificate — che due pgTAP pretendono a zero righe — l''avrebbe intercettato, come deve. Allargare il presidio con un''eccezione avrebbe voluto dire spegnerlo un pezzo alla volta. ⭐ DUE DOMANDE INDIPENDENTI, DUE COLONNE: questa e'' la natura del dato, quella e'' una capacita'' conquistata e certificata; un enum a tre valori le legherebbe, ed e'' il flag che risponde a due domande in AND che poi non si riesce piu'' a invertire. ⚠️ REGOLA PER CHI LEGGE: si entra senza scegliere un emittente quando la lista SA DIRLO (multi_emittente) OPPURE quando non c''e'' niente da dire (perimetro_emittente = false) — due ragioni diverse per lo stesso gesto, da tenere distinte. ⚠️ NON E'' UN PERMESSO: non decide cosa un utente puo'' vedere — quello lo decidono lo scope e la RLS — ma se una schermata e'' leggibile nella condizione in cui sta per essere aperta. ⭐ Default TRUE, che e'' il verso prudente: una lista nuova nasce CON perimetro, e la globalita'' si dichiara invece di ereditarla. Il valore si dichiara nel seed (20260902-02), mai da interfaccia. Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.16.';

              COMMENT ON CONSTRAINT chk_ui_lista_definizione_perimetro_coerente
                  ON ui.lista_definizione IS
              'Una lista senza perimetro emittente non puo'' dichiarare di saper dire da quale emittente arrivano le sue righe: non ne ha. ⛔ E'' la combinazione incoerente delle due colonne, resa impossibile invece che lasciata a un lettore attento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE ui.lista_definizione
                  DROP CONSTRAINT IF EXISTS chk_ui_lista_definizione_perimetro_coerente;
              ALTER TABLE ui.lista_definizione
                  DROP COLUMN IF EXISTS perimetro_emittente;
