# Tabella ui.lista_colonna.
#
# Why: catalogo delle colonne disponibili per ciascuna lista.
# Definisce tutto cio' che una lista puo' mostrare: tipo dato,
# formato, comportamento (filtrabile, ordinabile, esportabile),
# gruppo per la modale di personalizzazione, e flag sensibile
# per invertire il modello permessi (deny-list vs allow-list).
#
# tipo_colonna controlla il comportamento strutturale:
#   'identificatore' -> sempre visibile, fissata di default, non nascondibile
#   'informazione'   -> personalizzabile liberamente
#   'azione'         -> pulsanti UI, non esportabile, non nascondibile
#
# Il campo campo_sorgente e' validato dal trigger B2 contro
# pg_catalog.pg_attribute (skip se tipo_colonna='azione').
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260506-03-ddl-ui-lista-colonna-mctit.yaml

  - changeSet:
      id: 20260506-03-01-create-ui-lista-colonna
      author: mctit
      comment: "Catalogo colonne disponibili per ciascuna lista configurabile"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: ui
                tableName: lista_colonna
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.lista_colonna (
                id               INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                lista_id         INTEGER NOT NULL,
                codice           VARCHAR(80)  NOT NULL,
                etichetta        VARCHAR(120) NOT NULL,
                etichetta_estesa VARCHAR(200),

                campo_sorgente   VARCHAR(120),
                  -- colonna nella view PostgreSQL; NULL se tipo_colonna='azione'
                  -- validato da trigger B2 contro pg_catalog.pg_attribute

                tipo_colonna     ui.tipo_colonna     NOT NULL DEFAULT 'informazione',
                tipo_dato        ui.tipo_dato        NOT NULL,
                formato          VARCHAR(40),
                  -- es. 'currency_eur', 'date_short', 'percent_2', 'yesno'

                larghezza_default INTEGER,
                ordine_default    INTEGER NOT NULL,
                allineamento      ui.allineamento_colonna NOT NULL DEFAULT 'left',

                gruppo            VARCHAR(60),
                gruppo_ordine     INTEGER,

                filtrabile        BOOLEAN NOT NULL DEFAULT TRUE,
                ordinabile        BOOLEAN NOT NULL DEFAULT TRUE,
                esportabile       BOOLEAN NOT NULL DEFAULT TRUE,
                ricercabile_full  BOOLEAN NOT NULL DEFAULT FALSE,
                sensibile         BOOLEAN NOT NULL DEFAULT FALSE,

                attivo            BOOLEAN NOT NULL DEFAULT TRUE,

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_lista_colonna_lista_codice
                    UNIQUE (lista_id, codice),

                -- tipo 'azione' implica non esportabile (constraint cross-colonna)
                CONSTRAINT chk_ui_lista_colonna_azione_non_esportabile
                    CHECK (tipo_colonna <> 'azione' OR esportabile = FALSE),

                CONSTRAINT fk_lista_colonna_lista_definizione
                    FOREIGN KEY (lista_id) REFERENCES ui.lista_definizione(id)
              );

              COMMENT ON TABLE  ui.lista_colonna IS 'Catalogo colonne disponibili per ciascuna lista. Definisce tutto cio che la lista puo mostrare.';
              COMMENT ON COLUMN ui.lista_colonna.tipo_colonna    IS 'identificatore=sempre visibile/non nascondibile; informazione=personalizzabile; azione=pulsanti UI non esportabili';
              COMMENT ON COLUMN ui.lista_colonna.sensibile       IS 'TRUE: modello allowlist (default BLOCCATO). FALSE: modello deny-list (default TUTTO).';
              COMMENT ON COLUMN ui.lista_colonna.campo_sorgente  IS 'Nome colonna nella view PostgreSQL. NULL per tipo_colonna=azione. Validato da trigger.';
              COMMENT ON COLUMN ui.lista_colonna.gruppo          IS 'Raggruppamento per la modale di personalizzazione (es. Dati anagrafici, Dati fiscali).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.lista_colonna CASCADE;
