                  'Identificativo della riga. Chi cita una misura cita il numero (misura), non l''id.';
              COMMENT ON COLUMN ui.misure_pagina.data_insert IS
                  'Momento dell''inserimento della riga (DEFAULT now()).';
              COMMENT ON COLUMN ui.misure_pagina.user_insert IS
                  'Chi ha inserito la riga: l''utente dell''applicazione (GUC app.jwt_user) o, senza, il ruolo del database. Lo scrive script.trgfn_audit_data_user_generic.';
