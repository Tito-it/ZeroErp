                  'La chiave di traduzione del titolo della card; NULL usa etichetta, mai la stringa vuota.';
              COMMENT ON COLUMN ui.widget.tipo_widget IS
                  'La forma della card per il frontend (ui.tipo_widget).';
              COMMENT ON COLUMN ui.widget.attivo IS
                  'Spento, il widget esce da ogni dashboard alla risoluzione. Acceso, chiede area e azione accese, a fine transazione.';
              COMMENT ON COLUMN ui.widget.data_insert IS
                  'Momento dell''inserimento della riga (DEFAULT now()).';
              COMMENT ON COLUMN ui.widget.user_insert IS
                  'Chi ha inserito la riga: l''utente dell''applicazione (GUC app.jwt_user) o, senza, il ruolo del database. Lo scrive script.trgfn_audit_data_user_generic.';
