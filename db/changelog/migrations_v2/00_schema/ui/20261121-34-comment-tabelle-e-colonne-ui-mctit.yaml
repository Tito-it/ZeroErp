                  'Momento dell''ultima scrittura della riga, anche dell''inserimento: lo scrive script.trgfn_audit_data_user_generic.';
              COMMENT ON COLUMN ui.misure_pagina.user_update IS
                  'Chi ha fatto l''ultima scrittura della riga, con la regola di user_insert: lo scrive script.trgfn_audit_data_user_generic.';
              COMMENT ON TABLE ui.widget IS
                  'Il catalogo globale dei widget delle dashboard: ogni widget è una card con un''etichetta, un contatore, una soglia di attenzione e un collegamento a una schermata già filtrata. Il legame con le dashboard è il pool (ui.dashboard_widget). deep_link, contatore_key e soglia sono opachi per il database; chi vede il widget lo dicono area e azione. La scrive il seed; l''applicazione la legge.';
              COMMENT ON COLUMN ui.widget.id IS
                  'Identificativo del widget. Preferenze e preset citano il widget per codice.';
              COMMENT ON COLUMN ui.widget.codice IS
                  'Il nome del widget, unico in tutto il catalogo e non solo in una dashboard (uq_ui_widget_codice): la chiave con cui preferenze e preset lo citano.';
