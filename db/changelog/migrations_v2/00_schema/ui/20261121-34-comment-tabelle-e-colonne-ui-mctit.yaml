                  'Chi ha fatto l''ultima scrittura della riga, con la regola di user_insert: lo scrive script.trgfn_audit_data_user_generic.';
              COMMENT ON TABLE ui.lista_preset_colonna IS
                  'La composizione di un preset di lista: una riga per ogni colonna del catalogo che il preset include, con la posizione, la larghezza, se si vede subito e se è fissata. Una riga per preset e colonna. È una parte del preset, senza attivo né audit. Una composizione cambiata sposta la chiave colonne della data del contenuto del preset, a fine transazione (ui.trgfn_preset_riga_tocca_preset).';
              COMMENT ON COLUMN ui.lista_preset_colonna.preset_id IS
                  'Il preset di cui la riga è parte. Cancellato il preset, la riga se ne va con lui.';
              COMMENT ON COLUMN ui.lista_preset_colonna.colonna_id IS
                  'La colonna del catalogo che il preset include: una colonna della lista del preset (fk_ui_lista_preset_colonna_colonna_della_lista). Una colonna citata da un preset non si cancella.';
