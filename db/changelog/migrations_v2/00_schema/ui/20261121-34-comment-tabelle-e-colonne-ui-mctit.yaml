                  'La posizione della colonna nel preset.';
              COMMENT ON COLUMN ui.lista_preset_colonna.larghezza IS
                  'La larghezza della colonna nel preset; NULL vuol dire la larghezza di default del catalogo.';
              COMMENT ON COLUMN ui.lista_preset_colonna.fissata IS
                  'La colonna resta ferma quando la lista scorre in orizzontale. Un identificatore è sempre fissato, qualunque cosa dica la riga (ui.fn_resolve_lista_config).';
