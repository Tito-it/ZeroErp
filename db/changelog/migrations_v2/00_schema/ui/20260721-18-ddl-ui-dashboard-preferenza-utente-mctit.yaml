# Tabella ui.dashboard_preferenza_utente.
#
# Why: preferenza personale dell'utente per una dashboard. Un solo record
# per coppia (auth_user, dashboard). La configurazione e' in JSONB perche'
# la preferenza si legge sempre intera ed e' resiliente ad evoluzioni.
# Ricalca ui.lista_preferenza_utente.
#
# I codici widget nel JSONB referenziano ui.widget.codice (stringa), mai
# ui.widget.id (brief §3d): protegge da cambi di ID cross-ambiente e
# permette di ignorare silenziosamente widget disattivati/rimossi.
#
# preset_base_id / preset_base_data_update / preset_aggiornato_ignored_at:
# stessa meccanica DEF-2 delle liste — rilevare se il preset di base e'
# stato aggiornato dopo l'ultimo salvataggio dell'utente (banner FE
# "preset aggiornato"). La FK verso il preset e' ON DELETE SET NULL e il
# trigger z90 (file 20260721-19) azzera i campi derivati quando
# preset_base_id cambia.
#
# Nota: la FK verso django.auth_user NON e' qui ma in 90_end (file
# 20260721-23) perche' auth_user e' creata da Django migrate, che gira
# dopo Liquibase. Pattern identico a ui.lista_preferenza_utente.
#
# Ref: brief-db-dashboard-home.md §3e/§3.ter
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260721-18-ddl-ui-dashboard-preferenza-utente-mctit.yaml

  - changeSet:
      id: 20260721-18-01-create-ui-dashboard-preferenza-utente
      author: mctit
      comment: "Preferenza personale utente per una dashboard (un record per utente/dashboard)"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: ui
                tableName: dashboard_preferenza_utente
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.dashboard_preferenza_utente (
                id                            INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                auth_user_id                  INTEGER NOT NULL,
                  -- FK verso django.auth_user aggiunta in 90_end
                dashboard_id                  INTEGER NOT NULL,
                preset_base_id                INTEGER,
                  -- preset da cui e' partita la personalizzazione (riferimento storico)

                preset_base_data_update       TIMESTAMP,
                  -- snapshot di ui.dashboard_preset.data_update al salvataggio.
                  -- Se dashboard_preset.data_update > questo valore, il preset e' cambiato.
                preset_aggiornato_ignored_at  TIMESTAMP,
                  -- tombstone: l'utente ha ignorato l'avviso "preset aggiornato" fino a qui

                configurazione                JSONB NOT NULL,
                  -- {
                  --   "widget": [
                  --     {"codice":"resi_da_accreditare","ordine":1,"visibile":true},
                  --     ...
                  --   ],
                  --   "dimensione_max": 8
                  -- }

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                data_update  TIMESTAMP,

                CONSTRAINT uq_ui_dashboard_preferenza_utente_user_dashboard
                    UNIQUE (auth_user_id, dashboard_id),

                CONSTRAINT fk_ui_dashboard_preferenza_utente_dashboard_definizione
                    FOREIGN KEY (dashboard_id) REFERENCES ui.dashboard_definizione(id),

                CONSTRAINT fk_ui_dashboard_preferenza_utente_dashboard_preset
                    FOREIGN KEY (preset_base_id) REFERENCES ui.dashboard_preset(id) ON DELETE SET NULL
                -- fk_ui_dashboard_preferenza_utente_auth_user: aggiunta in 90_end
                -- (django.auth_user creata da Django migrate, dopo Liquibase)
              );

              COMMENT ON TABLE  ui.dashboard_preferenza_utente IS 'Preferenza personale utente per dashboard. JSONB per resilienza ad evoluzioni. Ricalca ui.lista_preferenza_utente.';
              COMMENT ON COLUMN ui.dashboard_preferenza_utente.auth_user_id            IS 'FK verso django.auth_user, aggiunta in 90_end (auth_user creata da Django migrate).';
              COMMENT ON COLUMN ui.dashboard_preferenza_utente.preset_base_data_update IS 'Snapshot dashboard_preset.data_update al salvataggio. Confrontare con data_update corrente per rilevare preset aggiornati.';
              COMMENT ON COLUMN ui.dashboard_preferenza_utente.configurazione          IS 'Struttura JSONB: widget (codice, ordine, visibile) + dimensione_max. I codici referenziano ui.widget.codice, mai id.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.dashboard_preferenza_utente CASCADE;
