# M-1 — IL CATALOGO DELLE MISURE DI PAGINA: ui.misure_pagina
#   Brief: brief-db-misure-pagina-catalogo, sezione 2 (decisioni di Tid del
#   2026-09-29: una sede sola, il database; anche i default nel catalogo).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Le misure «righe per pagina» erano scritte in tre posti (due costanti del
#   frontend e un 25 ripetuto cinque volte in ui.fn_resolve_lista_config), e
#   nessuno rifiutava una misura fuori elenco: il 28-09 un preset a 15 ha
#   lasciato vuoto il selettore del paginatore, senza errori.
#
# ── ⭐ LA FORMA ──────────────────────────────────────────────────────
#   · misura: la chiave naturale stabile (linee-guida §6b) — chi la cita
#     (ui.lista_preset.pagina_dimensione, il jsonb delle preferenze) cita il
#     numero, e il numero non si riscrive: si aggiunge o si toglie una riga;
#   · uso_default: COMPATTA (drawer e dialog) o PAGINA (pagine), al piu' una
#     riga per uso (indice unico parziale). «Almeno una» lo pretende il pgTAP,
#     e chi chiede un default che manca riceve un errore tecnico parlante
#     (ui.fn_misura_pagina_default).
#   Niente `attivo`: una misura che non serve piu' si toglie dal CSV (la FK dei
#   preset lo impedisce finche' qualcuno la usa). Niente storico: e' un
#   catalogo posseduto dal CSV. Niente RLS: nessuno scope.
#
# ── ⚠️ LA PORTA ─────────────────────────────────────────────────────
#   La scrive solo il mirror del CSV (80_data/20260930-02); all'app solo SELECT
#   (90_end/20260930-13 + loop dei grant + provisioning).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260930-01-create-ui-misure-pagina-mctit.yaml

  - changeSet:
      id: 20260930-01-create-ui-misure-pagina
      author: mctit
      failOnError: true
      comment: >
        Crea ui.misure_pagina, il catalogo delle misure «righe per pagina» ammesse e dei loro due
        default (COMPATTA, PAGINA): una sede sola per DB, backend e frontend. Chiave naturale =
        misura. Posseduto dal CSV. Brief: brief-db-misure-pagina-catalogo §2.
      preConditions:
        - onFail: HALT
        - not:
            - tableExists:
                { schemaName: ui, tableName: misure_pagina }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.misure_pagina (
                  id           integer     GENERATED BY DEFAULT AS IDENTITY,
                  misura       integer     NOT NULL,
                  uso_default  varchar(20),
                  data_insert  timestamptz NOT NULL DEFAULT now(),
                  user_insert  text        NOT NULL DEFAULT CURRENT_USER,
                  data_update  timestamptz NOT NULL DEFAULT now(),
                  user_update  text        NOT NULL DEFAULT CURRENT_USER,
                  CONSTRAINT pk_misure_pagina PRIMARY KEY (id),
                  CONSTRAINT uq_misure_pagina_misura UNIQUE (misura),
                  CONSTRAINT chk_misure_pagina_misura CHECK (misura > 0),
                  CONSTRAINT chk_misure_pagina_uso_default
                      CHECK (uso_default IN ('COMPATTA', 'PAGINA'))
              );

              -- Al piu' una misura per uso di default.
              CREATE UNIQUE INDEX uq_misure_pagina_uso_default
                  ON ui.misure_pagina (uso_default)
               WHERE uso_default IS NOT NULL;

              COMMENT ON TABLE ui.misure_pagina IS
                  'Catalogo delle misure «righe per pagina» ammesse, e dei loro due default: la sede UNICA per DB, backend e frontend (decisioni di Tid del 2026-09-29). Le citano ui.lista_preset.pagina_dimensione (FK) e le preferenze utente (guard); il resolver delle liste non risponde mai una misura che non sta qui. L''applicazione la legge con ui.fn_get_misure_pagina(). Posseduta dal CSV (80_data/sql/ui/misure_pagina.csv): all''app solo SELECT. Brief: brief-db-misure-pagina-catalogo.';
              COMMENT ON COLUMN ui.misure_pagina.misura IS
                  'Quante righe per pagina. Chiave naturale stabile (linee-guida §6b): chi la cita cita il numero. Non si riscrive: si aggiunge o si toglie una riga.';
              COMMENT ON COLUMN ui.misure_pagina.uso_default IS
                  'La misura di default per un uso: COMPATTA (drawer e dialog) o PAGINA (pagine, e il ripiego del resolver delle liste). Al piu'' una riga per uso (uq_misure_pagina_uso_default); NULL = misura solo offerta. Si legge con ui.fn_misura_pagina_default.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TABLE IF EXISTS ui.misure_pagina;
