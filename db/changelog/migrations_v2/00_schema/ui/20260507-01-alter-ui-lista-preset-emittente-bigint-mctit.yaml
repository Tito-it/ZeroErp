# ------------------------------------------------------------
# DB-1: corregge il tipo di ui.lista_preset.emittente_fiscale_id
#        da INTEGER a BIGINT.
#
# Why: anagrafiche.emittenti_fiscali.id e' BIGINT. La FK funziona
# con INTEGER grazie al coerce implicito PostgreSQL, ma l'incoerenza
# e' visibile nel modello e potrebbe causare overflow su istanze
# long-running con generatore ID globale. La colonna e' vuota in dev.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260507-01-alter-ui-lista-preset-emittente-bigint-mctit.yaml

  - changeSet:
      id: 20260507-01-01-alter-ui-lista-preset-emittente-bigint
      author: mctit
      comment: "DB-1: emittente_fiscale_id INTEGER -> BIGINT (allineamento a anagrafiche.emittenti_fiscali.id)"
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            schemaName: ui
            tableName: lista_preset
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT COUNT(*) FROM information_schema.columns
               WHERE table_schema = 'ui'
                 AND table_name   = 'lista_preset'
                 AND column_name  = 'emittente_fiscale_id'
                 AND data_type    = 'integer'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE ui.lista_preset
                ALTER COLUMN emittente_fiscale_id TYPE BIGINT;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE ui.lista_preset
                ALTER COLUMN emittente_fiscale_id TYPE INTEGER;
