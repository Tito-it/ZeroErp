# ui: dove va il vuoto quando una lista ordina per una colonna. Brief:
#   brief-db-lista-colonna-vuoto-in-ordine (§2, §7; D-1 … D-3 di Tid, 2026-11-24).
#
# Che cosa cambia:
#   - ui.lista_colonna.vuoto_ordinato_come_massimo: boolean NOT NULL DEFAULT false.
#     false = la regola generale, il vuoto conta come il minimo (il «non ancora»);
#     true = la colonna dichiara che il suo vuoto vuol dire «senza fine», e conta
#     come il massimo in qualunque verso. La legge il backend dal catalogo e la
#     applica all'ordinamento della lista, al posto dei COALESCE(…, 'infinity')
#     scritti a mano nelle whitelist. Non vale per i filtri.
#   - chk_ui_lista_colonna_vuoto_massimo_con_campo (D-3): la dichiarazione chiede un
#     campo sorgente. Non e' legata a `ordinabile`: il flag dice che cosa vuol dire
#     il vuoto del dato, `ordinabile` che cosa la lista permette.
#   - Il seed (il CSV di ui.lista_colonna, i due caricatori) e la colonna del
#     software nel registro del primo impianto (D-1: si scrive solo dal seed) sono
#     in 80_data, nello stesso giro.
#
# ℹ️ PERCHE' QUI, IN 00_schema (linee-guida-sql §11.14): la colonna nasce prima dei
#   caricatori di 80_data, che la scrivono. Chi scrive la tabella oggi: i due
#   mirror del CSV (20260507-07, 20260806-15), il backend dalle pagine admin, che
#   non conosce la colonna (prende il default) e su una riga di seed non la puo'
#   cambiare (colonna del software). Nessuna funzione del database scrive
#   ui.lista_colonna. Il CHECK nasce valido: il default e' false.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20261123-65-alter-ui-lista-colonna-vuoto-ordinato-come-massimo-mctit.yaml

  - changeSet:
      id: 20261123-65-alter-ui-lista-colonna-vuoto-ordinato-come-massimo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.lista_colonna.vuoto_ordinato_come_massimo (dove va il vuoto quando la lista ordina) e
        chk_ui_lista_colonna_vuoto_massimo_con_campo. Brief: brief-db-lista-colonna-vuoto-in-ordine.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_attribute
               WHERE attrelid = to_regclass('ui.lista_colonna')
                 AND attname = 'vuoto_ordinato_come_massimo'
                 AND NOT attisdropped
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE ui.lista_colonna
                  ADD COLUMN vuoto_ordinato_come_massimo boolean NOT NULL DEFAULT false;

              ALTER TABLE ui.lista_colonna
                  ADD CONSTRAINT chk_ui_lista_colonna_vuoto_massimo_con_campo
                  CHECK (NOT vuoto_ordinato_come_massimo OR campo_sorgente IS NOT NULL);

              COMMENT ON COLUMN ui.lista_colonna.vuoto_ordinato_come_massimo IS
                  'Dove stanno le righe con la cella vuota quando la lista ordina per questa colonna. False, il default: il vuoto conta come il valore più piccolo, il «non ancora» (il numero di una bozza). True: il vuoto della colonna vuol dire «senza fine» (una fine validità o una scadenza che non c''è) e conta come il più grande, in qualunque verso. La legge il backend e la applica all''ordinamento della lista, non ai filtri. Ogni colonna accesa su valido_al la dichiara, perché valido_al NULL vuol dire «aperto» in tutto il database. Chiede un campo sorgente (chk_ui_lista_colonna_vuoto_massimo_con_campo); su una riga di seed la scrive solo il seed.';

              COMMENT ON CONSTRAINT chk_ui_lista_colonna_vuoto_massimo_con_campo ON ui.lista_colonna IS
                  'Una colonna che dichiara il vuoto come il massimo ha un campo sorgente: un''azione o una cella composta dal frontend non hanno un vuoto da ordinare.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER TABLE ui.lista_colonna DROP CONSTRAINT chk_ui_lista_colonna_vuoto_massimo_con_campo;
              ALTER TABLE ui.lista_colonna DROP COLUMN vuoto_ordinato_come_massimo;
