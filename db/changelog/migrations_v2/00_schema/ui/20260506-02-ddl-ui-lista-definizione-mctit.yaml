# Tabella ui.lista_definizione.
#
# Why: catalogo delle liste configurabili nel sistema. Una riga per
# ogni lista che vogliamo rendere personalizzabile (anagrafiche clienti,
# articoli, fatture, ecc.). Il codice (es. 'anagrafiche.clienti') e'
# l'identificatore stabile usato dal frontend e dalle API.
# La colonna vista_sql e' validata a runtime dal trigger B1.
#
# Convenzione codice: '<schema>.<entita>' per lista principale,
# '<schema>.<entita>:<contesto>' per varianti (es. :picker, :dashboard).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260506-02-ddl-ui-lista-definizione-mctit.yaml

  - changeSet:
      id: 20260506-02-01-create-ui-lista-definizione
      author: mctit
      comment: "Catalogo delle liste configurabili del sistema"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: ui
                tableName: lista_definizione
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.lista_definizione (
                id           INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                codice       VARCHAR(80)  NOT NULL,
                descrizione  VARCHAR(200) NOT NULL,
                schema_dati  VARCHAR(40)  NOT NULL,
                vista_sql    VARCHAR(120),
                  -- nome della view PostgreSQL sorgente dati;
                  -- validato da trigger B1 contro pg_catalog.pg_class
                note         TEXT,
                attivo       BOOLEAN NOT NULL DEFAULT TRUE,

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_lista_definizione_codice UNIQUE (codice)
              );

              COMMENT ON TABLE  ui.lista_definizione IS 'Catalogo delle liste configurabili. Una riga per lista personalizzabile.';
              COMMENT ON COLUMN ui.lista_definizione.codice      IS 'Identificatore stabile: <schema>.<entita> o <schema>.<entita>:<contesto>';
              COMMENT ON COLUMN ui.lista_definizione.vista_sql   IS 'Nome view PostgreSQL sorgente dati. Validato da trigger contro pg_catalog.pg_class.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.lista_definizione CASCADE;
