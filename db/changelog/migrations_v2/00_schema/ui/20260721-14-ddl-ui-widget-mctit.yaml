# Tabella ui.widget — catalogo GLOBALE dei widget dashboard.
#
# Why: a differenza di ui.lista_colonna (legata a una lista via lista_id),
# il widget e' GLOBALE (decisione brief §3a): «resi da accreditare» ha
# senso in home oggi e potrebbe averlo in una dashboard di magazzino
# domani, senza duplicarne la definizione. Il legame widget<->dashboard
# vive nella tabella di composizione ui.dashboard_widget. Il codice e'
# quindi unico GLOBALMENTE (non per dashboard).
#
# Ogni widget e' una card KPI: etichetta, deep-link a una vista in stato
# preimpostato, quale contatore (KPI) mostrare, e una soglia di attenzione.
# I tre campi opachi (deep_link / contatore_key / soglia) NON sono
# interpretati dal DB (brief §3f): li conserva e li restituisce. La
# grammatica route+stato e' posseduta dal FE; il come-si-calcola il
# contatore e' BE.
#
# Filtro permessi (brief §3b): il widget dichiara area_id e/o azione_id,
# entrambi NULLABLE, con la stessa semantica delle rotte di menu. La
# risoluzione filtra via i resolver script.* (fn_get_user_permissions_map
# / fn_get_user_actions_map) — nessuna tabella permessi dedicata. Un
# widget con area_id/azione_id entrambi NULL e' non-gated (card di
# benvenuto): garante del vincolo "mai vuota" a livello di seed (§3.bis).
#
# Ref: brief-db-dashboard-home.md §3a/§3b/§3f
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260721-14-ddl-ui-widget-mctit.yaml

  - changeSet:
      id: 20260721-14-01-create-ui-widget
      author: mctit
      comment: "Catalogo globale dei widget dashboard (card KPI), codice unico globale"
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - tableExists:
                schemaName: ui
                tableName: widget
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.widget (
                id                  INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                codice              VARCHAR(80)  NOT NULL,
                etichetta           VARCHAR(120) NOT NULL,
                etichetta_i18n_key  VARCHAR(120),
                  -- chiave i18n (vue-i18n); NULL = usa etichetta letterale

                tipo_widget         ui.tipo_widget NOT NULL DEFAULT 'kpi',

                deep_link           JSONB,
                  -- grammatica route+stato posseduta dal FE; opaco al DB (§3f)
                contatore_key       VARCHAR(120),
                  -- quale KPI mostrare; il come-si-calcola e' BE (§Fuori perimetro)
                soglia              JSONB,
                  -- come/quando allarmare; opaco al DB (§3f)

                area_id             INTEGER,
                  -- FK config.aree_funzionali; NULL = widget non gated da area
                azione_id           INTEGER,
                  -- FK config.azioni_processo; NULL = widget non gated da azione

                attivo              BOOLEAN NOT NULL DEFAULT TRUE,

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_widget_codice UNIQUE (codice),

                CONSTRAINT fk_ui_widget_aree_funzionali
                    FOREIGN KEY (area_id) REFERENCES config.aree_funzionali(id),

                CONSTRAINT fk_ui_widget_azioni_processo
                    FOREIGN KEY (azione_id) REFERENCES config.azioni_processo(id)
              );

              COMMENT ON TABLE  ui.widget IS 'Catalogo GLOBALE dei widget dashboard (card KPI). codice unico globale; il legame con le dashboard e in ui.dashboard_widget. Zero logica di business: deep_link/contatore_key/soglia sono opachi al DB.';
              COMMENT ON COLUMN ui.widget.codice        IS 'Identificatore stabile GLOBALE del widget (referenziato nel JSONB della preferenza utente, §3d).';
              COMMENT ON COLUMN ui.widget.deep_link     IS 'JSONB opaco: grammatica route+stato posseduta dal FE. Il DB lo conserva e restituisce, non lo interpreta.';
              COMMENT ON COLUMN ui.widget.contatore_key IS 'Chiave del KPI da mostrare. Il calcolo del contatore e responsabilita BE (query/endpoint sui domini esistenti).';
              COMMENT ON COLUMN ui.widget.soglia        IS 'JSONB opaco: come/quando allarmare. Interpretato dal FE, non dal DB.';
              COMMENT ON COLUMN ui.widget.area_id       IS 'FK config.aree_funzionali (nullable). Gating permessi: visibile solo se livello_area <> BLOCCATO. NULL = non gated.';
              COMMENT ON COLUMN ui.widget.azione_id     IS 'FK config.azioni_processo (nullable). Gating permessi: visibile solo se azione abilitata. NULL = non gated.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.widget CASCADE;
