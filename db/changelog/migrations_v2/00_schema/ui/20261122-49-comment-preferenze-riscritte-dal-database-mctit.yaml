# ------------------------------------------------------------
# ui.lista_preferenza_utente, ui.dashboard_preferenza_utente: il COMMENT dice chi
#   scrive la riga.
#   Brief: brief-db-revisione-ui (§3.5-bis, «La verifica» del giro 5, 2026-11-23).
#
# Il difetto: i due COMMENT ON TABLE (20261120-56) dicevano che la preferenza e'
#   «scritta solo dal suo proprietario». La riscrive anche il database quando
#   ritira una voce uscita dal catalogo: ui.trgfn_voce_ritira_dalle_preferenze
#   (una colonna tolta dalla lista, una card tolta dal pool) e, per la lista,
#   ui.trgfn_misure_pagina_ritira_dalle_preferenze (una misura tolta dal
#   catalogo). Anche allora data_update si sposta: e' l'ultima scrittura della
#   riga, come il COMMENT gia' diceva.
# Solo COMMENT, nessun oggetto cambia. Testo vivo da dbdev (2026-11-23): cambia la
#   sola frase su chi scrive. La rollback riporta i due COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20261122-49-comment-preferenze-riscritte-dal-database-mctit.yaml

  - changeSet:
      id: 20261122-49-comment-preferenze-riscritte-dal-database
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.lista_preferenza_utente e ui.dashboard_preferenza_utente: il COMMENT dice che la riga la riscrive anche
        il database quando ritira una voce. Brief: brief-db-revisione-ui (§3.5-bis).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_catalog.pg_class c
                JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'ui' AND c.relkind = 'r'
                 AND c.relname IN ('lista_preferenza_utente', 'dashboard_preferenza_utente')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON TABLE ui.lista_preferenza_utente IS
                  'La personalizzazione di una lista per un utente: una riga per utente e lista. La configurazione porta solo le chiavi che l''utente ha scelto (colonne, pagina_dimensione); le altre le dà il preset di base (ui.fn_preset_di_base), e ui.fn_resolve_lista_config compone le due. La forma la controlla ui.trgfn_preferenza_guard_forma. Senza audit, per scelta: e'' un dato personale, scritto spesso dal suo proprietario; il database lo riscrive quando ritira una voce uscita dal catalogo (ui.trgfn_voce_ritira_dalle_preferenze per una colonna, ui.trgfn_misure_pagina_ritira_dalle_preferenze per una misura). data_update la scrive il database a ogni scrittura (ui.trgfn_preferenza_data_update), anche la sua: e'' l''ultima scrittura della riga. Non c''e'' user_update.';
              COMMENT ON TABLE ui.dashboard_preferenza_utente IS
                  'La personalizzazione di una dashboard per un utente: una riga per utente e dashboard. La configurazione porta solo le chiavi che l''utente ha scelto (widget, dimensione_max); le altre le dà il preset di base (ui.fn_preset_di_base), e ui.fn_resolve_dashboard_config compone le due. La forma la controlla ui.trgfn_preferenza_guard_forma. Senza audit, per scelta: e'' un dato personale, scritto spesso dal suo proprietario; il database lo riscrive quando ritira una card uscita dal pool (ui.trgfn_voce_ritira_dalle_preferenze). data_update la scrive il database a ogni scrittura (ui.trgfn_preferenza_data_update), anche la sua: e'' l''ultima scrittura della riga. Non c''e'' user_update.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON TABLE ui.lista_preferenza_utente IS
                  'La personalizzazione di una lista per un utente: una riga per utente e lista. La configurazione porta solo le chiavi che l''utente ha scelto (colonne, pagina_dimensione); le altre le dà il preset di base (ui.fn_preset_di_base), e ui.fn_resolve_lista_config compone le due. La forma la controlla ui.trgfn_preferenza_guard_forma. Senza audit, per scelta: e'' un dato personale, scritto solo dal suo proprietario e spesso; data_update la scrive il database a ogni scrittura (ui.trgfn_preferenza_data_update), e non c''e'' user_update.';
              COMMENT ON TABLE ui.dashboard_preferenza_utente IS
                  'La personalizzazione di una dashboard per un utente: una riga per utente e dashboard. La configurazione porta solo le chiavi che l''utente ha scelto (widget, dimensione_max); le altre le dà il preset di base (ui.fn_preset_di_base), e ui.fn_resolve_dashboard_config compone le due. La forma la controlla ui.trgfn_preferenza_guard_forma. Senza audit, per scelta: e'' un dato personale, scritto solo dal suo proprietario e spesso; data_update la scrive il database a ogni scrittura (ui.trgfn_preferenza_data_update), e non c''e'' user_update.';
