# SETTE TABELLE DI ui: data_update E user_update NOT NULL, COL DEFAULT
#   ui.dashboard_definizione, ui.dashboard_preset, ui.lista_colonna,
#   ui.lista_colonna_permesso, ui.lista_definizione, ui.lista_preset,
#   ui.widget
#   Brief: brief-db-revisione-dbops, giro 7-bis, blocco c (§23.12, N4).
#
# ── ⭐ PERCHE' ────────────────────────────────────────────────────────
#   Con ui nell'ambito (stesso giro) le sette tabelle prendono il trigger di
#   audit (script.trgfn_audit_data_user_generic): le due colonne le scrive
#   lui a ogni INSERT e UPDATE, e la regola del progetto (linee-guida-sql
#   §7) le vuole NOT NULL col DEFAULT. Erano nel registro del debito di
#   dbops/test-user-update-not-null-v1 proprio perche' senza audit: le voci
#   escono nello stesso commit. misure_pagina era gia' a posto.
#
# ── ⚠️ IL BACKFILL, PRIMA DEI GUARD ──────────────────────────────────
#   Le righe di oggi senza valore prendono quello della nascita
#   (data_insert, user_insert: NOT NULL). Il backfill sta in 00_schema e
#   gira prima che la convergenza monti su ui il guard ATTIVO e l'audit
#   (ci_apply, dopo il migrate): non li attraversa. I trigger a mano di ui
#   sono tutti UPDATE OF colonne di contenuto: questo UPDATE non li sveglia.
#   Da zero le tabelle qui sono vuote (i seed sono in 80_data): i CSV di ui
#   non portano le due colonne, e il DEFAULT le riempie.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20261109-33-alter-ui-audit-update-not-null-mctit.yaml

  - changeSet:
      id: 20261109-33-alter-ui-audit-update-not-null
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Sette tabelle di ui: data_update e user_update NOT NULL col DEFAULT, prima che prendano
        l'audit. Brief: brief-db-revisione-dbops, giro 7-bis, blocco c.
      preConditions:
        - onFail: HALT
        - changeSetExecuted:
            id: 20261109-32-alter-ui-preset-contenuto-aggiornato-il
            author: mctit
            changeLogFile: migrations_v2/00_schema/ui/20261109-32-alter-ui-preset-contenuto-aggiornato-il-mctit.yaml
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                  v_tabella pg_catalog.pg_class.relname%TYPE;
              BEGIN
                  FOREACH v_tabella IN ARRAY ARRAY[
                      'dashboard_definizione', 'dashboard_preset', 'lista_colonna',
                      'lista_colonna_permesso', 'lista_definizione', 'lista_preset', 'widget']::name[]
                  LOOP
                      EXECUTE format(
                          'UPDATE ui.%I
                              SET data_update = COALESCE(data_update, data_insert),
                                  user_update = COALESCE(user_update, user_insert)
                            WHERE data_update IS NULL OR user_update IS NULL', v_tabella);
                      EXECUTE format(
                          'ALTER TABLE ui.%I
                               ALTER COLUMN data_update SET DEFAULT now(),
                               ALTER COLUMN data_update SET NOT NULL,
                               ALTER COLUMN user_update SET DEFAULT CURRENT_USER,
                               ALTER COLUMN user_update SET NOT NULL', v_tabella);
                  END LOOP;
              END
              $$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                  v_tabella pg_catalog.pg_class.relname%TYPE;
              BEGIN
                  FOREACH v_tabella IN ARRAY ARRAY[
                      'dashboard_definizione', 'dashboard_preset', 'lista_colonna',
                      'lista_colonna_permesso', 'lista_definizione', 'lista_preset', 'widget']::name[]
                  LOOP
                      EXECUTE format(
                          'ALTER TABLE ui.%I
                               ALTER COLUMN data_update DROP NOT NULL,
                               ALTER COLUMN data_update DROP DEFAULT,
                               ALTER COLUMN user_update DROP NOT NULL,
                               ALTER COLUMN user_update DROP DEFAULT', v_tabella);
                  END LOOP;
              END
              $$;
