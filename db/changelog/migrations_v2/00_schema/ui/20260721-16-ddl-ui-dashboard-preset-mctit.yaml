# ------------------------------------------------------------
# Tabella ui.dashboard_preset.
#
# Why: default per ambito di una dashboard, a tre livelli (ricalca
# ui.lista_preset):
#   'sistema'           -> default globale per tutti
#   'emittente_fiscale' -> override per una specifica societa'
#   'ruolo'             -> override per un profilo di accesso
# «chi lavora le pratiche non vede le stesse card di chi fattura»
# (brief §1) e' esattamente l'ambito 'ruolo'.
#
# Riusa l'ENUM ui.ambito_preset gia' esistente (creato con le liste).
# La risoluzione usa fn_get_profili_accesso_applicabili (con priorita
# a rompere i pareggi), identica a fn_resolve_lista_config.
#
# dimensione_max (brief §3c): mirror di lista_preset.pagina_dimensione.
# Se il layout home ha un massimo di card, e' un dato sul preset, non
# implicito nel CSS del FE. Il pool selezionabile resta comunque
# limitato da catalogo + permessi.
#
# Il UNIQUE INDEX parziale su is_default=TRUE garantisce un solo preset
# di default per combinazione (dashboard, ambito, profilo, emittente).
#
# Ref: brief-db-dashboard-home.md §3c/§3.ter
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/00_schema/ui/20260721-16-ddl-ui-dashboard-preset-mctit.yaml

  - changeSet:
      id: 20260721-16-01-create-ui-dashboard-preset
      author: mctit
      comment: "Preset di dashboard per ambito (sistema / emittente / ruolo) con dimensione_max"
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            - tableExists:
                schemaName: ui
                tableName: dashboard_preset
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TABLE ui.dashboard_preset (
                id                       INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                dashboard_id             INTEGER NOT NULL,
                codice                   VARCHAR(80)  NOT NULL,
                descrizione              VARCHAR(200) NOT NULL,

                ambito                   ui.ambito_preset NOT NULL,
                  -- sistema | emittente_fiscale | ruolo

                profilo_accesso_id       INTEGER,
                  -- valorizzato quando ambito='ruolo'
                emittente_fiscale_id     INTEGER,
                  -- valorizzato quando ambito='emittente_fiscale'

                is_default               BOOLEAN NOT NULL DEFAULT FALSE,

                dimensione_max           INTEGER DEFAULT 8,
                  -- mirror di lista_preset.pagina_dimensione: max card in dashboard

                attivo                   BOOLEAN NOT NULL DEFAULT TRUE,

                data_insert  TIMESTAMP NOT NULL DEFAULT now(),
                user_insert  VARCHAR(80) NOT NULL,
                data_update  TIMESTAMP,
                user_update  VARCHAR(80),

                CONSTRAINT uq_ui_dashboard_preset_dashboard_codice
                    UNIQUE (dashboard_id, codice),

                -- coerenza ambito / riferimenti (il ENUM garantisce i valori ammessi)
                CONSTRAINT chk_ui_dashboard_preset_ambito_refs
                    CHECK (
                      (ambito = 'sistema'
                         AND profilo_accesso_id IS NULL
                         AND emittente_fiscale_id IS NULL)
                      OR (ambito = 'ruolo'
                         AND profilo_accesso_id IS NOT NULL
                         AND emittente_fiscale_id IS NULL)
                      OR (ambito = 'emittente_fiscale'
                         AND emittente_fiscale_id IS NOT NULL
                         AND profilo_accesso_id IS NULL)
                    ),

                CONSTRAINT fk_ui_dashboard_preset_dashboard_definizione
                    FOREIGN KEY (dashboard_id) REFERENCES ui.dashboard_definizione(id),

                CONSTRAINT fk_ui_dashboard_preset_profili_accesso
                    FOREIGN KEY (profilo_accesso_id) REFERENCES config.profili_accesso(id),

                CONSTRAINT fk_ui_dashboard_preset_emittenti_fiscali
                    FOREIGN KEY (emittente_fiscale_id) REFERENCES anagrafiche.emittenti_fiscali(id)
              );

              -- Un solo preset di default per (dashboard, ambito, profilo, emittente)
              CREATE UNIQUE INDEX uq_ui_dashboard_preset_default
                ON ui.dashboard_preset (
                  dashboard_id,
                  ambito,
                  COALESCE(profilo_accesso_id, 0),
                  COALESCE(emittente_fiscale_id, 0)
                )
                WHERE is_default = TRUE;

              COMMENT ON TABLE  ui.dashboard_preset IS 'Preset di dashboard per ambito: sistema (globale), emittente_fiscale, ruolo (via profilo_accesso). Ricalca ui.lista_preset.';
              COMMENT ON COLUMN ui.dashboard_preset.profilo_accesso_id IS 'config.profili_accesso: stessa entita del sistema permessi. Risolto via fn_get_profili_accesso_applicabili (priorita a rompere i pareggi).';
              COMMENT ON COLUMN ui.dashboard_preset.dimensione_max     IS 'Massimo numero di card in dashboard (mirror di lista_preset.pagina_dimensione). Seed preset sistema = 8.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: DROP TABLE IF EXISTS ui.dashboard_preset CASCADE;
