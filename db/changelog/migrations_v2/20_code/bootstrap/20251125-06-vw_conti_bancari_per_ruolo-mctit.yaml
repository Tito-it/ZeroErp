databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251125-06-vw_conti_bancari_per_ruolo-mctit.yaml

    - changeSet:
          id: 20251125-06-vw_conti_bancari_per_ruolo
          author: mctit
          # runAlways: true
          validCheckSums: <ANY>

          comment: "Ripristino trigger dopo refactoring degli ID in anagrafiche. Fix"
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |


                        CREATE OR REPLACE VIEW anagrafiche.vw_conti_bancari_per_ruolo
                        AS
                        WITH role_cand AS (
                                SELECT sr.id AS soggetto_ruolo_id,
                                    r.uso,
                                    r.conto_bancario_id,
                                    r.id AS soggetto_ruolo_conto_id,
                                    NULL::bigint AS soggetto_conto_id,
                                    r.predefinito,
                                    1 AS priority,
                                    r.valido_dal,
                                    r.valido_al,
                                    r.data_update,
                                    'RUOLO'::character varying(10) AS fonte
                                FROM anagrafiche.soggetti_ruoli sr
                                    JOIN anagrafiche.soggetti_ruoli_conti_bancari r ON r.soggetto_ruolo_id = sr.id
                                    JOIN anagrafiche.conti_bancari cb ON cb.id = r.conto_bancario_id
                                WHERE (r.valido_dal IS NULL OR r.valido_dal <= CURRENT_DATE) AND (r.valido_al IS NULL OR r.valido_al >= CURRENT_DATE) AND COALESCE(r.bloccato, false) = false AND cb.attivo = true
                                ), subj_cand AS (
                                SELECT sr.id AS soggetto_ruolo_id,
                                    s.uso,
                                    s.conto_bancario_id,
                                    NULL::bigint AS soggetto_ruolo_conto_id,
                                    s.id AS soggetto_conto_id,
                                    s.predefinito,
                                    2 AS priority,
                                    s.valido_dal,
                                    s.valido_al,
                                    s.data_update,
                                    'SOGGETTO'::character varying(10) AS fonte
                                FROM anagrafiche.soggetti_ruoli sr
                                    JOIN anagrafiche.soggetti_conti_bancari s ON s.soggetto_id = sr.soggetto_id
                                    JOIN anagrafiche.conti_bancari cb ON cb.id = s.conto_bancario_id
                                WHERE (s.valido_dal IS NULL OR s.valido_dal <= CURRENT_DATE) AND (s.valido_al IS NULL OR s.valido_al >= CURRENT_DATE) AND COALESCE(s.bloccato, false) = false AND cb.attivo = true
                                ), candidates AS (
                                SELECT role_cand.soggetto_ruolo_id,
                                    role_cand.uso,
                                    role_cand.conto_bancario_id,
                                    role_cand.soggetto_ruolo_conto_id,
                                    role_cand.soggetto_conto_id,
                                    role_cand.predefinito,
                                    role_cand.priority,
                                    role_cand.valido_dal,
                                    role_cand.valido_al,
                                    role_cand.data_update,
                                    role_cand.fonte
                                FROM role_cand
                                UNION ALL
                                SELECT subj_cand.soggetto_ruolo_id,
                                    subj_cand.uso,
                                    subj_cand.conto_bancario_id,
                                    subj_cand.soggetto_ruolo_conto_id,
                                    subj_cand.soggetto_conto_id,
                                    subj_cand.predefinito,
                                    subj_cand.priority,
                                    subj_cand.valido_dal,
                                    subj_cand.valido_al,
                                    subj_cand.data_update,
                                    subj_cand.fonte
                                FROM subj_cand
                                )
                        SELECT DISTINCT ON (soggetto_ruolo_id, uso) soggetto_ruolo_id,
                            uso,
                            conto_bancario_id,
                            soggetto_ruolo_conto_id,
                            soggetto_conto_id,
                            fonte,
                            predefinito,
                            valido_dal,
                            valido_al,
                            data_update
                        FROM candidates
                        ORDER BY soggetto_ruolo_id, uso, priority, predefinito DESC, data_update DESC, soggetto_ruolo_conto_id, soggetto_conto_id;

                        COMMENT ON VIEW anagrafiche.vw_conti_bancari_per_ruolo
                            IS 'Vista di fallback per selezionare il conto bancario per ruolo: priorità RUOLO → SOGGETTO; filtra su validità odierna, non bloccato, conto attivo, preferendo il predefinito.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.soggetto_ruolo_id
                            IS 'Ruolo per cui si seleziona il conto.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.uso
                            IS 'Uso richiesto: INCASSO | PAGAMENTO | RIMBORSO | GENERICO.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.conto_bancario_id
                            IS 'Conto bancario selezionato (anagrafiche.conti_bancari.id).';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.soggetto_ruolo_conto_id
                            IS 'Associazione di RUOLO usata (se fonte=RUOLO).';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.soggetto_conto_id
                            IS 'Associazione di SOGGETTO usata (se fonte=SOGGETTO).';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.fonte
                            IS 'Origine della selezione: RUOLO oppure SOGGETTO.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.predefinito
                            IS 'True se l’associazione usata è marcata come predefinita.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.valido_dal
                            IS 'Inizio validità dell’associazione selezionata.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.valido_al
                            IS 'Fine validità dell’associazione selezionata.';

                        COMMENT ON COLUMN anagrafiche.vw_conti_bancari_per_ruolo.data_update
                            IS 'Timestamp ultimo aggiornamento del legame usato.';
