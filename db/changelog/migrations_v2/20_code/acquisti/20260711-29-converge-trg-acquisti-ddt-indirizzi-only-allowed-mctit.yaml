# Convergenza piena (Q5): acquisti.ddt_indirizzi passa dalla funzione
# dedicata acquisti.trgfn_ddt_indirizzi_only_allowed_tipi (whitelist
# hardcoded 'CON','SPED') alla funzione parametrica condivisa
# vendite.trgfn_tipi_indirizzi_only_allowed('ACQUISTI_DDT'), con la
# whitelist letta da config.tipi_indirizzi_allowed (CON, FORNITURA;
# SPED ritirato). Unica logica whitelist per tutti i domini documento.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/acquisti/20260711-29-converge-trg-acquisti-ddt-indirizzi-only-allowed-mctit.yaml

  - changeSet:
      id: 20260711-29-converge-trg-acquisti-ddt-indirizzi-only-allowed
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Rimuove il trigger dedicato e la sua funzione hardcoded.
              DROP TRIGGER IF EXISTS trg_ddt_indirizzi_a10_only_allowed_tipi_ins_upd
                ON acquisti.ddt_indirizzi;

              DROP FUNCTION IF EXISTS acquisti.trgfn_ddt_indirizzi_only_allowed_tipi();

              -- Aggancia la funzione parametrica condivisa con ambito ACQUISTI_DDT.
              CREATE TRIGGER trg_ddt_indirizzi_a10_only_allowed_tipi_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                ON acquisti.ddt_indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('ACQUISTI_DDT');
