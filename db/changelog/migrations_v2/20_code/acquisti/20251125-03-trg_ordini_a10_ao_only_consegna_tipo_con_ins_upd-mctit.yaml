databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/acquisti/20251125-03-trg_ordini_a10_ao_only_consegna_tipo_con_ins_upd-mctit.yaml

    - changeSet:
          id: 20251125-03-trg_ordini_a10_ao_only_consegna_tipo_con_ins_upd
          author: mctit
          comment: "Ripristino trigger dopo refactoring degli ID in anagrafiche."
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        CREATE OR REPLACE TRIGGER trg_ordini_a10_ao_only_consegna_tipo_con_ins_upd
                         BEFORE INSERT OR UPDATE OF indirizzo_consegna_id
                         ON acquisti.ordini
                         FOR EACH ROW
                         EXECUTE FUNCTION acquisti.trgfn_acq_ordini_only_consegna_tipo_con();
