databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/acquisti/20251021-03-create-trg_all_table_note_validate_generic-mctit.yaml
  - changeSet:
      id: 20251021-03-create-trg_all_table_note_validate_generic
    
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: acquisti, tableName: note_ordini }
        - tableExists: { schemaName: acquisti, tableName: note_ddt }

      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
        
                    -- ORDINE
                    DROP TRIGGER IF EXISTS trg_note_ordini_ins_upd_validate ON acquisti.note_ordini;
                    CREATE TRIGGER trg_note_ordini_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON acquisti.note_ordini
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('acquisti.ordini_righe','ordine_id','ORDINE');

                    -- DDT
                    DROP TRIGGER IF EXISTS trg_note_ddt_ins_upd_validate ON acquisti.note_ddt;
                    CREATE TRIGGER trg_note_ddt_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON acquisti.note_ddt
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('acquisti.ddt_righe','ddt_id','DDT');


                  