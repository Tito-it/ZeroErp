# ------------------------------------------------------------
# catalogo.vw_articoli_componenti_dettaglio: ricreata con l'esposizione a tre
# modi (droppata da 20261001-42 per convertire la colonna).
#
# -- COSA CAMBIA ------------------------------------------------------
#   · `esposto_in_fattura` (boolean) -> `esposizione_in_fattura` (il codice
#     interno, NASCOSTO | DESCRITTIVO | VALORIZZATO), nello stesso posto;
#   · in coda, dalla decodifica del vocabolario:
#       esposizione_in_fattura_codice        (config.esposizioni_componente.codice:
#                                             la colonna della lista 101, a video)
#       esposizione_in_fattura_etichetta_key (la chiave i18n per il FE)
#     Alias fedeli alla sorgente (linee-guida-sql 6c): la logica confronta
#     esposizione_in_fattura, mai il `codice`.
#   Il resto del corpo e' quello vivo (20260928-27), identico riga per riga.
#
# -- FORMA -------------------------------------------------------------
#   · CREATE VIEW (non OR REPLACE): la vista non c'e', l'ha tolta -42;
#   · LEFT JOIN sul vocabolario: la FK nasce in 80_data (-57), e una riga che
#     non aggancia deve restare visibile, non sparire dalla distinta;
#   · nessun security_invoker, com'e' oggi: articoli_componenti, articoli e il
#     vocabolario non sono in RLS (presidio sul merito:
#     rls/test-rls-viste-security-invoker);
#   · nessun GRANT: il SELECT a zeroerp_app lo da' il loop dei grant, come al
#     20260928-27 (forma di 20260928-28).
#
# Lettori: lista configurabile 101 (ui.lista_colonna 1054, aggiornata nel CSV in
#   questo cantiere) e catalogo_bom_repository (richiesta al BE nel brief, sezione 5).
# Brief: brief-db-esposizione-componenti-kit-in-fattura, sezione 4.5
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261001-44-recreate-vw-articoli-componenti-dettaglio-esposizione-mctit.yaml

  - changeSet:
      id: 20261001-44-recreate-vw-articoli-componenti-dettaglio-esposizione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vw_articoli_componenti_dettaglio ricreata (droppata da 20261001-42):
        esposizione_in_fattura al posto di esposto_in_fattura, + in coda il codice e la
        chiave i18n del modo dal vocabolario. Brief:
        brief-db-esposizione-componenti-kit-in-fattura (sezione 4.5).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: catalogo
                tableName: articoli_componenti
                columnName: esposizione_in_fattura
            - tableExists:
                schemaName: config
                tableName: esposizioni_componente
            - not:
                - viewExists:
                    schemaName: catalogo
                    viewName: vw_articoli_componenti_dettaglio
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW catalogo.vw_articoli_componenti_dettaglio AS
              SELECT ac.id,
                  ac.prodotto_id,
                  ac.componente_id,
                  ac.coeff_qta,
                  ac.partecipa_qta,
                  ac.obbligatorio,
                  ac.valido_dal,
                  ac.valido_al,
                  ac.meta,
                  ac.user_insert,
                  ac.user_update,
                  ac.data_insert,
                  ac.data_update,
                  ac.tx_id,
                  ac.storicizza,
                  ac.attivo,
                  ac.note_target_tipo,
                  ac.note_id,
                  ap.codice AS prodotto_codice,
                  ap.descrizione AS prodotto_descrizione,
                  acmp.codice AS componente_codice,
                  acmp.descrizione AS componente_descrizione,
                  -- Capability di chiusura: una riga si chiude finche' non ha
                  -- una data di fine. Sede UNICA dal 2026-09-28 (il repository
                  -- ne aveva una copia).
                  (ac.valido_al IS NULL) AS puo_chiudersi,
                  CASE
                      WHEN (ac.valido_al IS NULL) THEN ac.valido_dal
                      ELSE NULL::date
                  END AS data_min_chiusura,
                  CASE
                      WHEN (ac.valido_al IS NULL) THEN GREATEST(ac.valido_dal, CURRENT_DATE)
                      ELSE NULL::date
                  END AS data_default_chiusura,
                  CASE
                      WHEN (ac.valido_al IS NULL) THEN NULL::text
                      ELSE 'RIGA_GIA_CHIUSA'::text
                  END AS motivo_non_chiudibile,
                  -- ── in coda dal 2026-09-28 (D-8.5) ────────────────────────
                  ac.determina_qta_padre,
                  -- ── dal 2026-10-01: tre modi al posto del booleano ────────
                  ac.esposizione_in_fattura,
                  ec.codice AS esposizione_in_fattura_codice,
                  ec.etichetta_key AS esposizione_in_fattura_etichetta_key
                FROM (((catalogo.articoli_componenti ac
                  LEFT JOIN catalogo.articoli ap ON ((ap.id = ac.prodotto_id)))
                  LEFT JOIN catalogo.articoli acmp ON ((acmp.id = ac.componente_id)))
                  LEFT JOIN config.esposizioni_componente ec
                         ON ((ec.codice_interno = ac.esposizione_in_fattura)));

              COMMENT ON VIEW catalogo.vw_articoli_componenti_dettaglio IS
                  'Righe della distinta base (componenti di un articolo) con codici e descrizioni di '
                  'prodotto e componente, piu'' la capability di riga (puo_chiudersi, '
                  'data_min_chiusura, data_default_chiusura, motivo_non_chiudibile) per «Chiudi '
                  'riga». Dal 2026-09-28 (brief-db-liste-righe-documento, D-8.5) e'' la SORGENTE '
                  'UNICA delle righe: per la lista configurabile catalogo.articolo_componenti e per '
                  'il repository, che prima ne rifaceva la proiezione e la capability in Python. '
                  'Dal 2026-10-01 (brief-db-esposizione-componenti-kit-in-fattura) '
                  'esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO) al posto del '
                  'booleano esposto_in_fattura, e in coda codice ed etichetta_key del modo da '
                  'config.esposizioni_componente: la logica confronta esposizione_in_fattura, il '
                  'codice e'' solo a video. Tutte le righe, anche le non attive e le chiuse: filtro e '
                  'ordine li mette chi legge.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- La forma vecchia nomina esposto_in_fattura, che torna solo col rollback
              -- di -42 (subito dopo nel verso inverso): la ricrea quello.
              DROP VIEW IF EXISTS catalogo.vw_articoli_componenti_dettaglio;
