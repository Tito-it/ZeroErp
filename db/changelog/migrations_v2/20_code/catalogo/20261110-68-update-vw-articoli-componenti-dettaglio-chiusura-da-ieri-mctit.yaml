# ------------------------------------------------------------
# catalogo.vw_articoli_componenti_dettaglio: la prima fine proposta per un legame
#   e' la piu' tarda fra valido_dal e ieri (Q1).
#   Brief: brief-db-revisione-catalogo, giro 1.
#
#   data_min_chiusura era valido_dal: la capability offriva una chiusura nel passato
#   che il trigger d'immutabilita' ora rifiuta (-66, E_BOM_CHIUSURA_RETROATTIVA).
#   Ora dice la stessa regola: la fine non cambia i giorni gia' passati, quindi la
#   prima fine ammessa e' ieri, o valido_dal se il legame nasce dopo. Stesse
#   colonne, stesso ordine: CREATE OR REPLACE. La vista non ha reloptions
#   (security_invoker): catalogo.articoli_componenti non ha RLS, e non si azzera
#   niente. COMMENT riscritto secondo linee-guida-sql §5d.
#   Corpo di partenza da pg_get_viewdef su dbdev (2026-11-09); rollback = corpo e
#   COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261110-68-update-vw-articoli-componenti-dettaglio-chiusura-da-ieri-mctit.yaml

  - changeSet:
      id: 20261110-68-update-vw-articoli-componenti-dettaglio-chiusura-da-ieri
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vw_articoli_componenti_dettaglio: la prima fine proposta per un legame e' ieri, non valido_dal. Brief: brief-db-revisione-catalogo, giro 1.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_class WHERE oid = to_regclass('catalogo.vw_articoli_componenti_dettaglio')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW catalogo.vw_articoli_componenti_dettaglio AS
               SELECT ac.id,
                  ac.prodotto_id,
                  ac.componente_id,
                  ac.coeff_qta,
                  ac.obbligatorio,
                  ac.valido_dal,
                  ac.valido_al,
                  ac.meta,
                  ac.user_insert,
                  ac.user_update,
                  ac.data_insert,
                  ac.data_update,
                  ac.tx_id,
                  ac.storicizza,
                  ac.attivo,
                  ac.note_target_tipo,
                  ac.note_id,
                  ap.codice AS prodotto_codice,
                  ap.descrizione AS prodotto_descrizione,
                  acmp.codice AS componente_codice,
                  acmp.descrizione AS componente_descrizione,
                  ac.valido_al IS NULL AS puo_chiudersi,
                      CASE
                          WHEN ac.valido_al IS NULL THEN GREATEST(ac.valido_dal, ( SELECT script.fn_data_operativa() - 1))
                          ELSE NULL::date
                      END AS data_min_chiusura,
                      CASE
                          WHEN ac.valido_al IS NULL THEN GREATEST(ac.valido_dal, ( SELECT script.fn_data_operativa() AS fn_data_operativa))
                          ELSE NULL::date
                      END AS data_default_chiusura,
                      CASE
                          WHEN ac.valido_al IS NULL THEN NULL::text
                          ELSE 'RIGA_GIA_CHIUSA'::text
                      END AS motivo_non_chiudibile,
                  ac.esposizione_in_fattura,
                  ec.codice AS esposizione_in_fattura_codice,
                  ec.etichetta_key AS esposizione_in_fattura_etichetta_key
                 FROM catalogo.articoli_componenti ac
                   LEFT JOIN catalogo.articoli ap ON ap.id = ac.prodotto_id
                   LEFT JOIN catalogo.articoli acmp ON acmp.id = ac.componente_id
                   LEFT JOIN config.esposizioni_componente ec ON ec.codice_interno::text = ac.esposizione_in_fattura::text;

              COMMENT ON VIEW catalogo.vw_articoli_componenti_dettaglio IS
                  'Righe della distinta base (catalogo.articoli_componenti) con codice e descrizione di prodotto e componente, il modo di esposizione in fattura (esposizione_in_fattura, con codice ed etichetta_key da config.esposizioni_componente: la logica confronta esposizione_in_fattura, il codice e'' solo a video) e la capability di riga per «Chiudi riga»: puo_chiudersi (il legame non ha ancora una fine), data_min_chiusura (la prima fine ammessa: la piu'' tarda fra valido_dal e ieri, perche'' la fine non cambia i giorni gia'' passati, come vuole catalogo.trgfn_articoli_componenti_block_modifica_struttura), data_default_chiusura (la piu'' tarda fra valido_dal e oggi), motivo_non_chiudibile (RIGA_GIA_CHIUSA). Sorgente unica delle righe della lista configurabile catalogo.articolo_componenti e del repository. Tutte le righe, anche le non attive e le chiuse: filtro e ordine li mette chi legge.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW catalogo.vw_articoli_componenti_dettaglio AS
               SELECT ac.id,
                  ac.prodotto_id,
                  ac.componente_id,
                  ac.coeff_qta,
                  ac.obbligatorio,
                  ac.valido_dal,
                  ac.valido_al,
                  ac.meta,
                  ac.user_insert,
                  ac.user_update,
                  ac.data_insert,
                  ac.data_update,
                  ac.tx_id,
                  ac.storicizza,
                  ac.attivo,
                  ac.note_target_tipo,
                  ac.note_id,
                  ap.codice AS prodotto_codice,
                  ap.descrizione AS prodotto_descrizione,
                  acmp.codice AS componente_codice,
                  acmp.descrizione AS componente_descrizione,
                  ac.valido_al IS NULL AS puo_chiudersi,
                      CASE
                          WHEN ac.valido_al IS NULL THEN ac.valido_dal
                          ELSE NULL::date
                      END AS data_min_chiusura,
                      CASE
                          WHEN ac.valido_al IS NULL THEN GREATEST(ac.valido_dal, ( SELECT script.fn_data_operativa() AS fn_data_operativa))
                          ELSE NULL::date
                      END AS data_default_chiusura,
                      CASE
                          WHEN ac.valido_al IS NULL THEN NULL::text
                          ELSE 'RIGA_GIA_CHIUSA'::text
                      END AS motivo_non_chiudibile,
                  ac.esposizione_in_fattura,
                  ec.codice AS esposizione_in_fattura_codice,
                  ec.etichetta_key AS esposizione_in_fattura_etichetta_key
                 FROM catalogo.articoli_componenti ac
                   LEFT JOIN catalogo.articoli ap ON ap.id = ac.prodotto_id
                   LEFT JOIN catalogo.articoli acmp ON acmp.id = ac.componente_id
                   LEFT JOIN config.esposizioni_componente ec ON ec.codice_interno::text = ac.esposizione_in_fattura::text;

              COMMENT ON VIEW catalogo.vw_articoli_componenti_dettaglio IS
                  'Righe della distinta base (componenti di un articolo) con codici e descrizioni di prodotto e componente, piu'' la capability di riga (puo_chiudersi, data_min_chiusura, data_default_chiusura, motivo_non_chiudibile) per «Chiudi riga». Dal 2026-09-28 (brief-db-liste-righe-documento, D-8.5) e'' la SORGENTE UNICA delle righe: per la lista configurabile catalogo.articolo_componenti e per il repository, che prima ne rifaceva la proiezione e la capability in Python. Dal 2026-10-01 (brief-db-esposizione-componenti-kit-in-fattura) esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO) al posto del booleano esposto_in_fattura, e in coda codice ed etichetta_key del modo da config.esposizioni_componente: la logica confronta esposizione_in_fattura, il codice e'' solo a video. Dal 2026-10-02 (brief-db-bom-flag-quantita-e-kit-in-fattura, D-1) senza partecipa_qta e determina_qta_padre, ritirate dalla tabella: nessuna logica le leggeva. Tutte le righe, anche le non attive e le chiuse: filtro e ordine li mette chi legge. Rev 2026-10-25 (20261025-57/-61, brief-db-grammatica-unica-documenti lotto 3, G-7): tolta e rimessa identica perche'' la colonna che legge cambia tipo; note_target_tipo vale ARTICOLO_COMPONENTE (era ARTICOLI_COMPONENTI) e diventa varchar(50), dalla colonna di catalogo.articoli_componenti.';
