# Liquibase changelog per Zero ERP
# Trigger REQUIRE attivo su componente_id
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260115-02-create-trg-articoli-componenti-require-attivo-componente-mctit.yaml

  - changeSet:
      id: 20260115-02-create-trg-articoli-componenti-require-attivo-componente
      author: mctit
      comment: >
        Richiede che il componente (componente_id) sia attivo quando si inserisce/aggiorna
        una riga di catalogo.articoli_componenti.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_articoli_componenti_a10_articoli_require_attivo_componente_ins_upd
                ON catalogo.articoli_componenti;

              CREATE CONSTRAINT TRIGGER trg_articoli_componenti_a10_articoli_require_attivo_componente_ins_upd
                AFTER INSERT OR UPDATE OF componente_id
                ON catalogo.articoli_componenti
                DEFERRABLE INITIALLY DEFERRED
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                  'catalogo',
                  'articoli',
                  'attivo',
                  'componente_id'
                );

              comment ON TRIGGER trg_articoli_componenti_a10_articoli_require_attivo_componente_ins_upd
                ON catalogo.articoli_componenti IS
                'Richiede che il componente (componente_id) sia attivo quando si inserisce/aggiorna una riga di catalogo.articoli_componenti.';
