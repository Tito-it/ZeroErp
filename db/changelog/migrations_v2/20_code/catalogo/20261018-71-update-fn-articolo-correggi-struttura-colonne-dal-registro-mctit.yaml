# UPDATE: catalogo.fn_articolo_correggi_struttura(articolo, campi)
#   Le colonne ammesse le legge da catalogo.fn_articolo_colonne_struttura()
#   (20261018-70), non piu' dalla costante c_ammessi; e scrive solo le
#   colonne passate, con un UPDATE costruito da quelle.
#   Brief: brief-db-articoli-ammessi-per-documento (§9.7.3, R-DB-3)
#
# -- PERCHE' --------------------------------------------------------------
#   Togliere la costante e lasciare l'UPDATE colonna per colonna sposterebbe
#   la copia, non la toglierebbe: alla nona colonna il controllo la
#   ammetterebbe e l'UPDATE la ignorerebbe, in silenzio. Quindi anche la
#   scrittura si costruisce dalle chiavi gia' controllate:
#   SET <colonna> = r.<colonna> da jsonb_populate_record(NULL::catalogo.articoli, p_campi),
#   che converte ogni valore col tipo della colonna (prima: un cast scritto a
#   mano per colonna, con la stessa conversione dal testo).
#   Le colonne sono quotate (%I) e sono solo quelle del registro: il
#   controllo delle chiavi estranee viene prima, come prima.
#
# -- COSA NON CAMBIA ------------------------------------------------------
#   Firma, SECURITY DEFINER, search_path, ordine dei controlli (permesso,
#   parametri, articolo, scrittura con la porta aperta), codici e frasi.
#   Corpo base: doc auto-generata (= 20261013-50).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261018-71-update-fn-articolo-correggi-struttura-colonne-dal-registro-mctit.yaml

  - changeSet:
      id: 20261018-71-update-fn-articolo-correggi-struttura-colonne-dal-registro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.fn_articolo_correggi_struttura: colonne ammesse da catalogo.fn_articolo_colonne_struttura()
        al posto della costante, e UPDATE costruito dalle sole colonne passate. Stessa firma, stessi
        codici. Brief: brief-db-articoli-ammessi-per-documento (§9.7.3, R-DB-3).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_articolo_correggi_struttura(
                  p_articolo_id catalogo.articoli.id%TYPE,
                  p_campi       jsonb)
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_codice   catalogo.articoli.codice%TYPE;
                  v_estranee text;
                  v_set      text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Correggere i flag strutturali di un articolo anche se
                  --   usato. Solo SUPER_ADMIN. Ordine: permesso, parametri,
                  --   articolo, scrittura con la porta aperta.
                  --   Le colonne ammesse: catalogo.fn_articolo_colonne_struttura().
                  -- =========================================================
                  PERFORM script.fn_guard_super_admin(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer);

                  IF p_campi IS NULL OR jsonb_typeof(p_campi) <> 'object' OR p_campi = '{}'::jsonb THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'valore', p_campi),
                          NULL::uuid,
                          'p_campi: un oggetto con almeno una colonna');
                  END IF;

                  SELECT string_agg(k, ', ' ORDER BY k)
                    INTO v_estranee
                    FROM jsonb_object_keys(p_campi) k
                   WHERE k <> ALL (catalogo.fn_articolo_colonne_struttura());
                  IF p_campi IS NULL OR v_estranee IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'non_ammesse', v_estranee),
                          NULL::uuid,
                          'p_campi: colonne non correggibili da qui: ' || v_estranee);
                  END IF;

                  SELECT a.codice INTO v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id
                     FOR UPDATE;
                  IF p_articolo_id IS NULL OR v_codice IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_ARTICOLO_NOT_FOUND',
                          jsonb_build_object('articolo_id', p_articolo_id),
                          NULL::uuid,
                          COALESCE(p_articolo_id::text, '<null>'));
                  END IF;

                  -- Solo le colonne passate (gia' controllate qui sopra), ciascuna col
                  -- tipo della sua colonna: jsonb_populate_record fa la conversione.
                  SELECT string_agg(format('%1$I = r.%1$I', k), ', ' ORDER BY k)
                    INTO v_set
                    FROM jsonb_object_keys(p_campi) k;

                  PERFORM set_config('zeroerp.articolo_correggi_struttura', p_articolo_id::text, true);

                  EXECUTE format(
                      'UPDATE catalogo.articoli a
                          SET %s
                         FROM jsonb_populate_record(NULL::catalogo.articoli, $1) r
                        WHERE a.id = $2',
                      v_set)
                  USING p_campi, p_articolo_id;

                  PERFORM set_config('zeroerp.articolo_correggi_struttura', '', true);
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.fn_articolo_correggi_struttura(uuid, jsonb)
              IS 'VERBO (A-10 di brief-db-articoli-ammessi-per-documento, 2026-10-13): la porta amministratore della regola «un articolo usato non cambia i flag strutturali» (catalogo.trgfn_articoli_guard_struttura_se_usato). Solo SUPER_ADMIN (script.fn_guard_super_admin su app.current_user_id; altrimenti E_PERMESSO_NEGATO). p_campi: oggetto jsonb con le sole colonne da cambiare fra quelle di catalogo.fn_articolo_colonne_struttura() (vuoto, non oggetto o chiavi estranee -> E_PARAMETRO_INVALIDO); articolo assente -> E_ARTICOLO_NOT_FOUND. Scrive le sole colonne passate, ciascuna col tipo della sua colonna (jsonb_populate_record), con la GUC transazionale zeroerp.articolo_correggi_struttura = id dell''articolo, che il guard onora solo insieme al proprietario della tabella (questo verbo e'' SECURITY DEFINER), e la richiude. Gli altri guard dell''articolo parlano lo stesso. Le righe gia'' scritte non si toccano. La via normale resta un articolo nuovo. search_path bloccato; EXECUTE solo all''app. Rev 2026-10-18 (R-DB-3, §9.7.3): le colonne dalla sede leggibile al posto della costante c_ammessi, e l''UPDATE costruito da quelle.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo del 20261013-50.
              CREATE OR REPLACE FUNCTION catalogo.fn_articolo_correggi_struttura(
                  p_articolo_id catalogo.articoli.id%TYPE,
                  p_campi       jsonb)
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  c_ammessi CONSTANT text[] := ARRAY[
                      'is_composito', 'is_solo_componente', 'natura_vendita_id',
                      'causale_onere_id', 'listino_tipologia_id',
                      'gestito_a_magazzino', 'requires_lotto', 'requires_serial'];
                  v_codice   catalogo.articoli.codice%TYPE;
                  v_estranee text;
              BEGIN
                  PERFORM script.fn_guard_super_admin(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer);

                  IF p_campi IS NULL OR jsonb_typeof(p_campi) <> 'object' OR p_campi = '{}'::jsonb THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'valore', p_campi),
                          NULL::uuid,
                          'p_campi: un oggetto con almeno una colonna');
                  END IF;

                  SELECT string_agg(k, ', ' ORDER BY k)
                    INTO v_estranee
                    FROM jsonb_object_keys(p_campi) k
                   WHERE k <> ALL (c_ammessi);
                  IF p_campi IS NULL OR v_estranee IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'non_ammesse', v_estranee),
                          NULL::uuid,
                          'p_campi: colonne non correggibili da qui: ' || v_estranee);
                  END IF;

                  SELECT a.codice INTO v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id
                     FOR UPDATE;
                  IF p_articolo_id IS NULL OR v_codice IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_ARTICOLO_NOT_FOUND',
                          jsonb_build_object('articolo_id', p_articolo_id),
                          NULL::uuid,
                          COALESCE(p_articolo_id::text, '<null>'));
                  END IF;

                  PERFORM set_config('zeroerp.articolo_correggi_struttura', p_articolo_id::text, true);

                  UPDATE catalogo.articoli a
                     SET is_composito         = CASE WHEN p_campi ? 'is_composito'
                                                     THEN (p_campi ->> 'is_composito')::boolean
                                                     ELSE a.is_composito END,
                         is_solo_componente   = CASE WHEN p_campi ? 'is_solo_componente'
                                                     THEN (p_campi ->> 'is_solo_componente')::boolean
                                                     ELSE a.is_solo_componente END,
                         natura_vendita_id    = CASE WHEN p_campi ? 'natura_vendita_id'
                                                     THEN (p_campi ->> 'natura_vendita_id')::bigint
                                                     ELSE a.natura_vendita_id END,
                         causale_onere_id     = CASE WHEN p_campi ? 'causale_onere_id'
                                                     THEN (p_campi ->> 'causale_onere_id')::bigint
                                                     ELSE a.causale_onere_id END,
                         listino_tipologia_id = CASE WHEN p_campi ? 'listino_tipologia_id'
                                                     THEN (p_campi ->> 'listino_tipologia_id')::smallint
                                                     ELSE a.listino_tipologia_id END,
                         gestito_a_magazzino  = CASE WHEN p_campi ? 'gestito_a_magazzino'
                                                     THEN (p_campi ->> 'gestito_a_magazzino')::boolean
                                                     ELSE a.gestito_a_magazzino END,
                         requires_lotto       = CASE WHEN p_campi ? 'requires_lotto'
                                                     THEN (p_campi ->> 'requires_lotto')::boolean
                                                     ELSE a.requires_lotto END,
                         requires_serial      = CASE WHEN p_campi ? 'requires_serial'
                                                     THEN (p_campi ->> 'requires_serial')::boolean
                                                     ELSE a.requires_serial END
                   WHERE a.id = p_articolo_id;

                  PERFORM set_config('zeroerp.articolo_correggi_struttura', '', true);
              END;
              $function$;
