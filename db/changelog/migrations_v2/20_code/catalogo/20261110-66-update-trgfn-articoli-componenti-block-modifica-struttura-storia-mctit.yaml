# catalogo.trgfn_articoli_componenti_block_modifica_struttura: prodotto_id e'
#   immutabile, e la fine di un legame non cambia i giorni gia' passati (D1, D10, Q1).
#   Brief: brief-db-revisione-catalogo, giro 1.
#
#   D1: prodotto_id non era ne' nell'elenco OF del trigger ne' nel confronto del
#   corpo: un legame passava sotto un altro kit, e le righe-componente dei documenti
#   che lo puntano con lui. Ora e' un campo di struttura come gli altri.
#   Q1 (Tid, 2026-11-08): la fine di un legame in vigore non si sposta nel passato e
#   non si toglie. Forma della regola: la fine non cambia i giorni gia' passati.
#   Una fine gia' passata non si tocca (E_BOM_LEGAME_CHIUSO); le altre vanno a vuoto
#   o da ieri in avanti (E_BOM_CHIUSURA_RETROATTIVA). Chiudere a ieri resta lecito:
#   non cambia la storia, ed e' il modo di far valere da oggi la versione nuova
#   (la validita comprende i due estremi). Togliere una fine futura non tocca il
#   passato ed e' ammesso; lo giudica il guard del legame (-65), come composizione
#   nuova. Una fine prima di valido_dal resta alla regola del periodo, che parla
#   dopo questo trigger: qui non si giudica, cosi' l'operatore legge la frase giusta.
#   Il trigger parla prima del guard del legame (block < guard nel nome): il
#   rifiuto d'immutabilita' viene prima.
#   In piu': area di log 'catalogo' (era 'database'), il tx_id della riga nel log,
#   COMMENT riscritto secondo linee-guida-sql §5d.
#   Corpo di partenza da pg_get_functiondef su dbdev (2026-11-09); rollback = corpo,
#   COMMENT e trigger di prima. Codici nuovi in codici_errore.csv e
#   messaggi_errore.csv.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261110-66-update-trgfn-articoli-componenti-block-modifica-struttura-storia-mctit.yaml

  - changeSet:
      id: 20261110-66-update-trgfn-articoli-componenti-block-modifica-struttura-storia
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        trgfn_articoli_componenti_block_modifica_struttura: prodotto_id immutabile, la fine di un legame non cambia i giorni passati. Brief: brief-db-revisione-catalogo, giro 1.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_trigger
               WHERE tgname = 'trg_articoli_componenti_a10_block_modifica_struttura_upd_dlt'
                 AND tgrelid = 'catalogo.articoli_componenti'::regclass
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_oggi    date := script.fn_data_operativa();
                  v_min_al  catalogo.articoli_componenti.valido_al%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La distinta e' una storia: un legame non si cancella e la sua
                  --   struttura non cambia (si chiude e se ne inserisce uno nuovo),
                  --   e la sua fine non cambia i giorni gia' passati.
                  -- Regole:
                  --   1. DELETE -> E_BOM_MODIFICA_VIETATA, sempre.
                  --   2. UPDATE di prodotto_id, componente_id, coeff_qta, obbligatorio,
                  --      esposizione_in_fattura, valido_dal -> E_BOM_MODIFICA_VIETATA.
                  --      validita e' generata: PostgreSQL rifiuta da se' la scrittura.
                  --   3. UPDATE di valido_al:
                  --      a. legame la cui fine e' gia' passata (valido_al < oggi): la
                  --         fine non si cambia piu' -> E_BOM_LEGAME_CHIUSO. Rimettere
                  --         il componente nella distinta e' un legame nuovo;
                  --      b. altrimenti la fine nuova e' vuota oppure da ieri in avanti:
                  --         prima di ieri toglierebbe al legame giorni gia' passati ->
                  --         E_BOM_CHIUSURA_RETROATTIVA. Chiudere a ieri lascia la storia
                  --         com'era, e permette a una versione nuova di valere da oggi.
                  --      Una fine che precede valido_dal non si giudica qui: e' la regola
                  --      del periodo (script.trgfn_guard_date_validita, E_DATA_AL_MINORE_DAL).
                  --   4. UPDATE di attivo, note, meta, audit -> ammesso.
                  -- =========================================================

                  IF TG_OP = 'DELETE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo',
                          TG_NAME::text,
                          'E_BOM_MODIFICA_VIETATA',
                          jsonb_build_object(
                              'operazione',    'DELETE',
                              'hint',          'Chiudi la riga impostando valido_al invece di eliminarla.',
                              'prodotto_id',   OLD.prodotto_id,
                              'componente_id', OLD.componente_id,
                              'riga_id',       OLD.id
                          ),
                          OLD.tx_id,
                          VARIADIC ARRAY[]::text[]
                      );
                  END IF;

                  IF NEW.prodotto_id               IS DISTINCT FROM OLD.prodotto_id
                     OR NEW.componente_id          IS DISTINCT FROM OLD.componente_id
                     OR NEW.coeff_qta              IS DISTINCT FROM OLD.coeff_qta
                     OR NEW.obbligatorio           IS DISTINCT FROM OLD.obbligatorio
                     OR NEW.esposizione_in_fattura IS DISTINCT FROM OLD.esposizione_in_fattura
                     OR NEW.valido_dal             IS DISTINCT FROM OLD.valido_dal
                  THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo',
                          TG_NAME::text,
                          'E_BOM_MODIFICA_VIETATA',
                          jsonb_build_object(
                              'operazione',    'UPDATE_STRUTTURA',
                              'hint',          'Chiudi questa riga (imposta valido_al) e inserisci una nuova riga con i valori aggiornati.',
                              'prodotto_id',   OLD.prodotto_id,
                              'componente_id', OLD.componente_id,
                              'riga_id',       OLD.id
                          ),
                          NEW.tx_id,
                          VARIADIC ARRAY[]::text[]
                      );
                  END IF;

                  IF NEW.valido_al IS DISTINCT FROM OLD.valido_al
                     AND (NEW.valido_al IS NULL OR NEW.valido_al >= NEW.valido_dal) THEN

                      IF OLD.valido_al < v_oggi THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo',
                              TG_NAME::text,
                              'E_BOM_LEGAME_CHIUSO',
                              jsonb_build_object(
                                  'campo',         'valido_al',
                                  'prodotto_id',   OLD.prodotto_id,
                                  'componente_id', OLD.componente_id,
                                  'riga_id',       OLD.id,
                                  'valido_al',     OLD.valido_al
                              ),
                              NEW.tx_id,
                              to_char(OLD.valido_al, 'DD/MM/YYYY')
                          );
                      END IF;

                      v_min_al := v_oggi - 1;
                      IF NEW.valido_al < v_min_al THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo',
                              TG_NAME::text,
                              'E_BOM_CHIUSURA_RETROATTIVA',
                              jsonb_build_object(
                                  'campo',         'valido_al',
                                  'prodotto_id',   OLD.prodotto_id,
                                  'componente_id', OLD.componente_id,
                                  'riga_id',       OLD.id,
                                  'valido_al',     NEW.valido_al,
                                  'valido_al_min', v_min_al
                              ),
                              NEW.tx_id,
                              to_char(v_min_al, 'DD/MM/YYYY')
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura() IS
                  'Guard d''immutabilita'' di catalogo.articoli_componenti, BEFORE DELETE OR UPDATE OF prodotto_id, componente_id, coeff_qta, obbligatorio, esposizione_in_fattura, valido_dal, valido_al. La distinta e'' una storia: un legame non si cancella (E_BOM_MODIFICA_VIETATA) e la sua struttura non cambia (prodotto_id, componente_id, coeff_qta, obbligatorio, esposizione_in_fattura, valido_dal: E_BOM_MODIFICA_VIETATA); per cambiarla si chiude il legame e se ne inserisce uno nuovo. La fine (valido_al) non cambia i giorni gia'' passati, al giorno aziendale (script.fn_data_operativa): un legame la cui fine e'' gia'' passata non si tocca piu'' (E_BOM_LEGAME_CHIUSO, campo valido_al: rimettere il componente e'' un legame nuovo); negli altri la fine nuova e'' vuota oppure da ieri in avanti (E_BOM_CHIUSURA_RETROATTIVA, campo valido_al, con la prima data ammessa). Chiudere a ieri permette a una versione nuova di valere da oggi. Una fine che precede valido_dal la giudica la regola del periodo (script.trgfn_guard_date_validita, E_DATA_AL_MINORE_DAL). validita e'' generata. attivo, note, meta e audit si cambiano.';
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_articoli_componenti_a10_block_modifica_struttura_upd_dlt ON catalogo.articoli_componenti;

              CREATE TRIGGER trg_articoli_componenti_a10_block_modifica_struttura_upd_dlt
                  BEFORE DELETE OR UPDATE OF prodotto_id, componente_id, coeff_qta, obbligatorio, esposizione_in_fattura, valido_dal, valido_al
                  ON catalogo.articoli_componenti
                  FOR EACH ROW EXECUTE FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Garantire che la struttura di una BoM sia immutabile
                  --   una volta inserita. Pattern admin "chiudi+inserisci":
                  --   per correggere si chiude la riga esistente (UPDATE
                  --   valido_al alla data di fine) e si inserisce una
                  --   nuova riga con valido_dal successivo. Il temporal UNIQUE
                  --   constraint uq_articoli_componenti_no_overlap (PG 18)
                  --   garantisce non-overlap sul triplo (prodotto, componente,
                  --   validita WITHOUT OVERLAPS).
                  --
                  -- Regole:
                  --   1. DELETE -> bloccato sempre (E_BOM_MODIFICA_VIETATA).
                  --   2. UPDATE dei campi di struttura -> bloccato
                  --      (coeff_qta, componente_id, obbligatorio,
                  --      esposizione_in_fattura, valido_dal).
                  --      Rev 20261002-61: partecipa_qta e determina_qta_padre
                  --      ritirate (20261002-60), nessuna logica le leggeva.
                  --      Nota: validita rimossa dalla lista perche' e' ora
                  --      STORED generated: PostgreSQL rifiuta scritture dirette
                  --      prima che il trigger venga eseguito; in BEFORE trigger
                  --      NEW.validita e' NULL e non puo' essere usata per check.
                  --   3. UPDATE di valido_al ammesso (chiusura della riga).
                  --      L'ordine delle date NON si giudica qui: lo giudica il
                  --      guard comune script.trgfn_guard_date_validita, montato
                  --      dall'automazione DATE_VALIDITA su ogni tabella con la
                  --      coppia valido_dal/valido_al (rev 20260924-01: ritirato
                  --      il ramo E_BOM_VALIDO_AL_INVALIDO, che ne era una copia).
                  --   4. UPDATE di campi note/meta/attivo + audit
                  --      (user_update/data_update/tx_id) -> ammesso.
                  -- =========================================================

                  IF TG_OP = 'DELETE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME,
                          'E_BOM_MODIFICA_VIETATA',
                          jsonb_build_object(
                              'operazione',    'DELETE',
                              'hint',          'Chiudi la riga impostando valido_al invece di eliminarla.',
                              'prodotto_id',   OLD.prodotto_id,
                              'componente_id', OLD.componente_id,
                              'riga_id',       OLD.id
                          ),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]
                      );
                  END IF;

                  IF TG_OP = 'UPDATE' THEN
                      -- Blocca modifiche ai campi di struttura.
                      -- validita non inclusa: e' STORED generated, scritture dirette
                      -- sono gia' rifiutate da PostgreSQL prima che il trigger esegua.
                      IF NEW.coeff_qta              IS DISTINCT FROM OLD.coeff_qta
                         OR NEW.componente_id       IS DISTINCT FROM OLD.componente_id
                         OR NEW.obbligatorio        IS DISTINCT FROM OLD.obbligatorio
                         OR NEW.esposizione_in_fattura IS DISTINCT FROM OLD.esposizione_in_fattura
                         OR NEW.valido_dal          IS DISTINCT FROM OLD.valido_dal
                      THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME,
                              'E_BOM_MODIFICA_VIETATA',
                              jsonb_build_object(
                                  'operazione',    'UPDATE_STRUTTURA',
                                  'hint',          'Chiudi questa riga (imposta valido_al) e inserisci una nuova riga con i valori aggiornati.',
                                  'prodotto_id',   OLD.prodotto_id,
                                  'componente_id', OLD.componente_id,
                                  'riga_id',       OLD.id
                              ),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]
                          );
                      END IF;
                  END IF;

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura() IS
                  'Trigger function: blocca DELETE e UPDATE dei campi di struttura di catalogo.articoli_componenti (BoM immutabile, pattern chiudi+inserisci): coeff_qta, componente_id, obbligatorio, esposizione_in_fattura, valido_dal. Ammette UPDATE di valido_al (chiusura), attivo, note, meta, audit. validita e'' STORED generated: scritture dirette rifiutate da PG. Error code: E_BOM_MODIFICA_VIETATA (387). Rev 20260924-01: l''ordine delle date (valido_al non precede valido_dal) non e'' piu'' qui: ha una sede sola, script.trgfn_guard_date_validita (automazione DATE_VALIDITA); E_BOM_VALIDO_AL_INVALIDO ritirato. Rev 20261001-43: il campo di struttura esposto_in_fattura e'' ora esposizione_in_fattura (tre modi, brief-db-esposizione-componenti-kit-in-fattura). Rev 20261002-61: partecipa_qta e determina_qta_padre ritirate dalla tabella (20261002-60): nessuna logica le leggeva (brief-db-bom-flag-quantita-e-kit-in-fattura, D-1).';
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_articoli_componenti_a10_block_modifica_struttura_upd_dlt ON catalogo.articoli_componenti;

              CREATE TRIGGER trg_articoli_componenti_a10_block_modifica_struttura_upd_dlt BEFORE DELETE OR UPDATE OF coeff_qta, componente_id, obbligatorio, esposizione_in_fattura, valido_dal, valido_al ON catalogo.articoli_componenti FOR EACH ROW EXECUTE FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura();
