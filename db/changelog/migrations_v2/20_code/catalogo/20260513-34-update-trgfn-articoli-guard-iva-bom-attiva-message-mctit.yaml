# Fix messaggio E_BOM_IVA_DISCORDANTE: mostra aliquota %
# invece di iva_id numerico interno. Supera 20260513-03-01.
# Aggiunge lookup config.iva per entrambi i casi (A e B).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20260513-34-update-trgfn-articoli-guard-iva-bom-attiva-message-mctit.yaml

  - changeSet:
      id: 20260513-34-01-update-trgfn-articoli-guard-iva-bom-attiva-message
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Migliora messaggio E_BOM_IVA_DISCORDANTE in trgfn_articoli_guard_iva_bom_attiva:
        sostituisce iva_id numerico con aliquota_iva percentuale. Lookup config.iva
        aggiunto sia al Caso A (padre composito) che al Caso B (figlio in BoM).
        VARIADIC: (codice_padre, aliquota_padre%, codice_figlio, aliquota_figlio%).
        Supera 20260513-03-01. rev 2026-05-13.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: catalogo
              tableName: articoli
          - tableExists:
              schemaName: config
              tableName: iva
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_guard_iva_bom_attiva()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE UPDATE OF iva_id su articoli — blocca modifiche che
              --   renderebbero incoerente la BoM. Caso A: padre composito con figli
              --   aventi IVA diversa da NEW.iva_id. Caso B: figlio in BoM attive
              --   con padre avente IVA diversa da NEW.iva_id.
              --   Messaggio parlante: mostra aliquota % invece dell''id numerico interno.
              DECLARE
                  v_codice_altro   catalogo.articoli.codice%TYPE;
                  v_iva_altro      catalogo.articoli.iva_id%TYPE;
                  v_iva_altro_pct  text;
                  v_iva_nuovo_pct  text;
              BEGIN
                  -- Lookup aliquota IVA nuova (NEW.iva_id) — usata in entrambi i casi
                  SELECT COALESCE(aliquota_iva::text, '—') INTO v_iva_nuovo_pct
                    FROM config.iva WHERE id = NEW.iva_id;

                  -- Caso A: articolo e' padre composito — cerca figlio attivo con IVA diversa
                  IF COALESCE(NEW.is_composito, FALSE) THEN
                      SELECT a.codice, a.iva_id, COALESCE(iva.aliquota_iva::text, '—')
                        INTO v_codice_altro, v_iva_altro, v_iva_altro_pct
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                        LEFT JOIN config.iva iva ON iva.id = a.iva_id
                       WHERE ac.prodotto_id = NEW.id
                         AND ac.attivo      = TRUE
                         AND a.iva_id IS DISTINCT FROM NEW.iva_id
                       LIMIT 1;

                      IF FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', TG_NAME, 'E_BOM_IVA_DISCORDANTE',
                              jsonb_build_object(
                                  'prodotto_id',     NEW.id,
                                  'iva_padre_nuova', NEW.iva_id,
                                  'iva_padre_pct',   v_iva_nuovo_pct,
                                  'codice_figlio',   v_codice_altro,
                                  'iva_figlio',      v_iva_altro,
                                  'iva_figlio_pct',  v_iva_altro_pct
                              ),
                              NULL::uuid,
                              NEW.codice,
                              v_iva_nuovo_pct,
                              v_codice_altro,
                              v_iva_altro_pct
                          );
                      END IF;
                  END IF;

                  -- Caso B: articolo e' figlio — cerca padre attivo con IVA diversa
                  SELECT a.codice, a.iva_id, COALESCE(iva.aliquota_iva::text, '—')
                    INTO v_codice_altro, v_iva_altro, v_iva_altro_pct
                    FROM catalogo.articoli_componenti ac
                    JOIN catalogo.articoli a ON a.id = ac.prodotto_id
                    LEFT JOIN config.iva iva ON iva.id = a.iva_id
                   WHERE ac.componente_id = NEW.id
                     AND ac.attivo        = TRUE
                     AND a.iva_id IS DISTINCT FROM NEW.iva_id
                   LIMIT 1;

                  IF FOUND THEN
                      -- Caso B: padre = v_codice_altro, figlio = NEW.codice
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', TG_NAME, 'E_BOM_IVA_DISCORDANTE',
                          jsonb_build_object(
                              'componente_id',   NEW.id,
                              'iva_figlio_nuova', NEW.iva_id,
                              'iva_figlio_pct',   v_iva_nuovo_pct,
                              'codice_padre',     v_codice_altro,
                              'iva_padre',        v_iva_altro,
                              'iva_padre_pct',    v_iva_altro_pct
                          ),
                          NULL::uuid,
                          v_codice_altro,
                          v_iva_altro_pct,
                          NEW.codice,
                          v_iva_nuovo_pct
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_guard_iva_bom_attiva() IS
                  'Trigger BEFORE UPDATE OF iva_id su articoli: caso A padre composito -> '
                  'figli attivi devono avere stessa IVA; caso B figlio -> padre attivo '
                  'deve avere stessa IVA. Messaggio mostra aliquota % (non id numerico). '
                  'Raise E_BOM_IVA_DISCORDANTE (445). rev 2026-05-13.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS catalogo.trgfn_articoli_guard_iva_bom_attiva();
