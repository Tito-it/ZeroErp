# LA CAUSALE DELL'ONERE A VIDEO — catalogo.vw_articoli_dettaglio
#   Brief: brief-db-addebito-trasporto-ordine §9.10 (giro 8-septies, via di
#   Tid e decisione C-1 del 2026-11-12).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Il drawer articolo deve mostrare la causale dell'articolo-onere, e il
#   picker della porta oneri la mostrava decodificandola nel BE (JOIN su
#   config.causali_onere nel filtro solo_oneri): con la decodifica qui quella
#   copia si ritira nel giro BE (regola del 2).
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · + causale_onere_codice_interno (in coda): per la logica;
#   · + causale_onere_descrizione (in coda): a video.
#   Stessa forma di natura_vendita_* e modo_approvvigionamento_*; alias fedeli
#   alla sorgente (linee-guida-sql §6c: niente causale_onere_codice sopra un
#   codice_interno). Il codice utente della causale non si espone (C-1).
#   LEFT JOIN sulla PK di config.causali_onere: 1:1, NULL sulla merce, la
#   cardinalita' della vista non cambia. config.causali_onere non ha RLS: la
#   vista resta senza security_invoker, come dice il suo COMMENT.
#   Il blocco della causale su un articolo usato c'e' gia' (A-10:
#   catalogo.fn_articolo_colonne_struttura, guard e lock_columns_conditional):
#   il form lo legge da dbops.vw_non_editable_fields, nessun cambio qui.
#
# ── ⭐ DA DOVE ───────────────────────────────────────────────────────
#   Corpo di partenza da pg_get_viewdef su dbdev con search_path =
#   pg_catalog (2026-11-12): coincide col 20261110-92, salvo l'elenco delle
#   colonne di fn_distinta_alla_data che il viewdef esplicita. COMMENT della
#   vista dal vivo (20261112-20), riscritto con la causale; i COMMENT delle
#   altre colonne non cambiano (CREATE OR REPLACE li conserva, come i GRANT).
#   La vista non ha opzioni (reloptions vuoto): CREATE OR REPLACE non ne perde.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261112-40-update-vw-articoli-dettaglio-causale-onere-mctit.yaml

  - changeSet:
      id: 20261112-40-update-vw-articoli-dettaglio-causale-onere
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vw_articoli_dettaglio: causale_onere_codice_interno e causale_onere_descrizione in coda. Brief: brief-db-addebito-trasporto-ordine §9.10.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_class WHERE oid = to_regclass('catalogo.vw_articoli_dettaglio') AND relkind = 'v'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW catalogo.vw_articoli_dettaglio AS
               SELECT a.id,
                  a.codice,
                  a.descrizione,
                  a.descrizione_breve,
                  a.uom_id,
                  a.tipo_voce_id,
                  a.gruppo_voce_id,
                  a.spesa_id,
                  a.iva_id,
                  a.conto_contabile_vendita_id,
                  a.conto_contabile_acquisto_id,
                  a.is_composito,
                  a.is_solo_componente,
                  a.requires_serial,
                  a.listino_tipologia_id,
                  a.meta,
                  a.user_insert,
                  a.user_update,
                  a.data_insert,
                  a.data_update,
                  a.tx_id,
                  a.storicizza,
                  a.attivo,
                  a.note_target_tipo,
                  a.note_id,
                  u.id AS uom_ref_id,
                  u.codice AS uom_codice,
                  u.descrizione AS uom_descrizione,
                  t.id AS tipologia_ref_id,
                  t.codice AS tipologia_codice,
                  t.descrizione AS tipologia_descrizione,
                  g.id AS gruppo_ref_id,
                  g.codice AS gruppo_codice,
                  g.descrizione AS gruppo_descrizione,
                  s.id AS spesa_ref_id,
                  s.codice AS spesa_codice,
                  s.descrizione AS spesa_descrizione,
                  i.id AS iva_ref_id,
                  i.codice AS iva_codice,
                  i.descrizione AS iva_descrizione,
                  i.aliquota_iva AS iva_aliquota_iva,
                  lt.codice AS tipologia_listino_codice,
                  lt.descrizione AS tipologia_listino_descrizione,
                  a.is_composito AND NOT a.is_solo_componente AS puo_gestire_bom,
                      CASE
                          WHEN a.is_composito AND NOT a.is_solo_componente THEN NULL::text
                          WHEN a.is_solo_componente THEN 'ARTICOLO_SOLO_COMPONENTE'::text
                          ELSE 'ARTICOLO_NON_COMPOSITO'::text
                      END AS motivo_non_gestibile_bom,
                  a.is_composito AND (EXISTS ( SELECT 1
                         FROM catalogo.fn_distinta_alla_data(a.id, oggi.data_operativa) d(id, componente_id, coeff_qta, obbligatorio, esposizione_in_fattura))) AS has_componenti_alla_data,
                  a.natura_vendita_id,
                  nv.codice_interno AS natura_vendita_codice_interno,
                  nv.descrizione AS natura_vendita_descrizione,
                  nv.destinazione_tipo AS natura_vendita_destinazione_tipo,
                  a.modo_approvvigionamento_id,
                  ma.codice_interno AS modo_approvvigionamento_codice_interno,
                  ma.descrizione AS modo_approvvigionamento_descrizione,
                  a.gestito_a_magazzino,
                  a.lead_time_giorni,
                  a.requires_lotto,
                  a.causale_onere_id IS NOT NULL AS e_onere,
                  a.causale_onere_id,
                  a.obsoleto_dal,
                  script.fn_e_obsoleto(a.obsoleto_dal) AS e_obsoleto,
                  co.codice_interno AS causale_onere_codice_interno,
                  co.descrizione AS causale_onere_descrizione
                 FROM catalogo.articoli a
                   CROSS JOIN ( SELECT script.fn_data_operativa() AS data_operativa
                       OFFSET 0) oggi
                   LEFT JOIN catalogo.unita_misura u ON u.id = a.uom_id
                   LEFT JOIN vendite.articoli_tipologie t ON t.id = a.tipo_voce_id
                   LEFT JOIN vendite.articoli_gruppi g ON g.id = a.gruppo_voce_id
                   LEFT JOIN vendite.articoli_spesa s ON s.id = a.spesa_id
                   LEFT JOIN config.iva i ON i.id = a.iva_id
                   LEFT JOIN config.listini_tipologie lt ON lt.id = a.listino_tipologia_id
                   LEFT JOIN config.nature_vendita nv ON nv.id = a.natura_vendita_id
                   LEFT JOIN config.modi_approvvigionamento ma ON ma.id = a.modo_approvvigionamento_id
                   LEFT JOIN config.causali_onere co ON co.id = a.causale_onere_id;

              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS
                  'Vista della lista degli articoli (ui.lista_definizione catalogo.articoli) e del drawer articolo: catalogo.articoli con le decodifiche (unita'' di misura, tipologia, gruppo, spesa, IVA, tipologia di listino, natura di vendita, modo di approvvigionamento, causale dell''onere), le capability della distinta (puo_gestire_bom, motivo_non_gestibile_bom, has_componenti_alla_data), l''onere (e_onere) e il ritiro (e_obsoleto). Natura di vendita, modo di approvvigionamento e causale dell''onere escono con codice_interno, per la logica, e descrizione, a video. Quali colonne non si cambiano lo dice dbops.vw_non_editable_fields: i lock di colonna e quelli condizionali (requires_lotto e causale_onere_id, per esempio, non cambiano su un articolo usato). Nessuna security_invoker, e non deve prenderla per imitazione: catalogo.articoli e config.causali_onere non hanno RLS e la vista non attraversa tabelle protette (presidio: db/pgtap/rls/test-rls-viste-security-invoker.sql).';

              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.causale_onere_codice_interno IS
                  'Il codice_interno della causale dell''onere (config.causali_onere.codice_interno), per la logica; NULL sulla merce. Il discrimine resta e_onere.';

              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.causale_onere_descrizione IS
                  'La descrizione della causale dell''onere (config.causali_onere.descrizione), a video nella lista, nel drawer articolo e nel picker della porta oneri; NULL sulla merce.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Togliere colonne da una vista e' un DROP + CREATE, e il DROP
              --   perderebbe i grant e i COMMENT. Il corpo precedente e' in
              --   20261110-92, il COMMENT della vista in 20261112-20.
              SELECT 1;
