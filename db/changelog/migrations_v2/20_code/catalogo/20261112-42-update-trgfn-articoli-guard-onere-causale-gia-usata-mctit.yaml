# LA CAUSALE GIA' DI UN ALTRO ARTICOLO — catalogo.trgfn_articoli_guard_onere_natura
#   Brief: brief-db-addebito-trasporto-ordine §9.10 (C-3, Tid 2026-11-12).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Il legame articolo-causale e' 1:1 (uq_articoli_causale_onere): il doppione
#   arrivava come 23505 grezzo, senza codice ne' frase. Il picker
#   (catalogo.vw_causali_onere_assegnabili, -41) non basta: due operatori
#   insieme, o una chiamata diretta all'API.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · regola 0, prima della natura: la causale e' gia' di un altro articolo ->
#     E_ARTICOLO_CAUSALE_ONERE_GIA_USATA (codice nuovo, stesso giro), campo
#     causale_onere_id. Giudicata su INSERT e quando la causale cambia;
#   · l'indice UNIQUE resta: e' la rete per due scritture concorrenti, che il
#     guard non vede (linee-guida-trigger: un BEFORE ROW parla prima dei
#     vincoli, e il vincolo resta per le strade che il trigger non percorre).
#   Il trigger non cambia: causale_onere_id e' gia' nell'elenco UPDATE OF, e
#   nessun altro BEFORE della tabella scrive la colonna. Il guard legge le
#   ALTRE righe per causale (a.id <> NEW.id), mai la riga che cambia.
#   catalogo.articoli non ha RLS: la lettura vede tutte le aziende, e il
#   messaggio nomina solo il codice dell'articolo (il catalogo e' unico).
#
# ── ⭐ DA DOVE ───────────────────────────────────────────────────────
#   Corpo e COMMENT da pg_get_functiondef / obj_description su dbdev
#   (search_path = pg_catalog, 2026-11-12): sono quelli del 20261111-36.
#   Nessuna clausola SET, volatile, INVOKER: come prima.
#   Rollback: il corpo e il COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261112-42-update-trgfn-articoli-guard-onere-causale-gia-usata-mctit.yaml

  - changeSet:
      id: 20261112-42-update-trgfn-articoli-guard-onere-causale-gia-usata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard degli oneri: la causale gia' di un altro articolo (E_ARTICOLO_CAUSALE_ONERE_GIA_USATA). Brief: brief-db-addebito-trasporto-ordine §9.10 (C-3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('catalogo.trgfn_articoli_guard_onere_natura()')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_guard_onere_natura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_natura        config.nature_vendita.descrizione%TYPE;
                  -- Il nome di una colonna di catalogo.articoli: nessuna colonna
                  -- ne e' il riflesso (come in trgfn_articoli_guard_struttura_se_usato).
                  v_campo         text;
                  v_causale       config.causali_onere.descrizione%TYPE;
                  v_altro         catalogo.articoli.codice%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Un articolo-onere (causale_onere_id valorizzato) e' un
                  --   addebito, non un bene:
                  --   0. la sua causale non e' gia' di un altro articolo (il
                  --      legame e' 1:1, uq_articoli_causale_onere: l'indice resta
                  --      la rete per due scritture concorrenti);
                  --   1. la sua natura non e' merce (script.fn_natura_e_merce);
                  --   2. non e' gestito a magazzino, non e' composito, non e' a
                  --      lotti ne' a matricola.
                  --   BEFORE INSERT OR UPDATE OF natura_vendita_id,
                  --   causale_onere_id, gestito_a_magazzino, is_composito,
                  --   requires_lotto, requires_serial su catalogo.articoli. Un
                  --   UPDATE che non cambia nessuna delle sei colonne non si
                  --   rigiudica.
                  -- =========================================================
                  IF NEW.causale_onere_id IS NULL THEN
                      RETURN NEW;
                  END IF;
                  IF TG_OP = 'UPDATE'
                     AND NEW.natura_vendita_id   IS NOT DISTINCT FROM OLD.natura_vendita_id
                     AND NEW.causale_onere_id    IS NOT DISTINCT FROM OLD.causale_onere_id
                     AND NEW.gestito_a_magazzino IS NOT DISTINCT FROM OLD.gestito_a_magazzino
                     AND NEW.is_composito        IS NOT DISTINCT FROM OLD.is_composito
                     AND NEW.requires_lotto      IS NOT DISTINCT FROM OLD.requires_lotto
                     AND NEW.requires_serial     IS NOT DISTINCT FROM OLD.requires_serial THEN
                      RETURN NEW;
                  END IF;

                  -- 0. La causale gia' data a un altro articolo. Si giudica solo
                  --    quando la causale e' scritta (INSERT) o cambia: le altre
                  --    righe si leggono per causale, mai la riga che cambia.
                  IF TG_OP = 'INSERT'
                     OR NEW.causale_onere_id IS DISTINCT FROM OLD.causale_onere_id THEN
                      SELECT a.codice
                        INTO v_altro
                        FROM catalogo.articoli a
                       WHERE a.causale_onere_id = NEW.causale_onere_id
                         AND a.id <> NEW.id
                       LIMIT 1;

                      IF FOUND THEN
                          SELECT COALESCE(co.descrizione, co.codice)
                            INTO v_causale
                            FROM config.causali_onere co
                           WHERE co.id = NEW.causale_onere_id;

                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', TG_NAME::text, 'E_ARTICOLO_CAUSALE_ONERE_GIA_USATA',
                              jsonb_build_object(
                                  'campo',            'causale_onere_id',
                                  'articolo_id',      NEW.id,
                                  'causale_onere_id', NEW.causale_onere_id),
                              NEW.tx_id,
                              NEW.codice,
                              v_causale,
                              v_altro);
                      END IF;
                  END IF;

                  -- 1. La natura. Natura assente: il BB da' NULL, parla la FK.
                  IF script.fn_natura_e_merce(NEW.natura_vendita_id) IS TRUE THEN
                      SELECT COALESCE(nv.descrizione, nv.codice)
                        INTO v_natura
                        FROM config.nature_vendita nv
                       WHERE nv.id = NEW.natura_vendita_id;

                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', TG_NAME::text, 'E_ARTICOLO_ONERE_NATURA_MERCE',
                          jsonb_build_object(
                              'campo',             'natura_vendita_id',
                              'articolo_id',       NEW.id,
                              'causale_onere_id',  NEW.causale_onere_id,
                              'natura_vendita_id', NEW.natura_vendita_id),
                          NEW.tx_id,
                          NEW.codice,
                          v_natura);
                  END IF;

                  -- 2. La struttura: la prima caratteristica da bene, in
                  --    quest'ordine (magazzino, distinta, lotto, matricola).
                  v_campo := CASE
                      WHEN NEW.gestito_a_magazzino IS TRUE THEN 'gestito_a_magazzino'
                      WHEN NEW.is_composito        IS TRUE THEN 'is_composito'
                      WHEN NEW.requires_lotto      IS TRUE THEN 'requires_lotto'
                      WHEN NEW.requires_serial     IS TRUE THEN 'requires_serial'
                  END;

                  IF v_campo IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', TG_NAME::text, 'E_ARTICOLO_ONERE_STRUTTURA',
                          jsonb_build_object(
                              'campo',            v_campo,
                              'articolo_id',      NEW.id,
                              'causale_onere_id', NEW.causale_onere_id),
                          NEW.tx_id,
                          NEW.codice,
                          catalogo.fn_articolo_flag_etichetta(v_campo));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_guard_onere_natura() IS
                  'Guard BEFORE INSERT OR UPDATE OF natura_vendita_id, causale_onere_id, gestito_a_magazzino, is_composito, requires_lotto, requires_serial su catalogo.articoli: un articolo-onere (causale_onere_id valorizzato) e'' un addebito, non un bene. 0. La sua causale non e'' gia'' di un altro articolo (il legame e'' 1:1) -> E_ARTICOLO_CAUSALE_ONERE_GIA_USATA, campo causale_onere_id, valori codice dell''articolo, causale e codice dell''articolo che la porta; giudicata solo quando la causale e'' scritta o cambia, e l''indice uq_articoli_causale_onere resta la rete per due scritture concorrenti. 1. La sua natura non e'' merce (script.fn_natura_e_merce, la destinazione ORDINE_VENDITA dal vocabolario config.nature_vendita) -> E_ARTICOLO_ONERE_NATURA_MERCE, campo natura_vendita_id: un onere creato senza dire la natura prenderebbe il DEFAULT, la merce. 2. Non e'' gestito a magazzino, non e'' composito, non e'' a lotti ne'' a matricola -> E_ARTICOLO_ONERE_STRUTTURA, campo = la prima colonna in quest''ordine, valori codice dell''articolo e nome leggibile della caratteristica (catalogo.fn_articolo_flag_etichetta); nessuna porta amministratore. Cosi'' magazzino, prelievi, scarico e distinta restano a posto per costruzione anche con gli oneri sulle righe di ordine e bolla. Parlano in quest''ordine: 0, 1, 2. Un UPDATE che non cambia nessuna delle sei colonne non rigiudica.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
