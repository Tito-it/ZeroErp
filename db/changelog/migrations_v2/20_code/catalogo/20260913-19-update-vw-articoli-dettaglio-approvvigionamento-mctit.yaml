# ------------------------------------------------------------
# P-6 (4 di 4) — catalogo.vw_articoli_dettaglio: le colonne di approvvigionamento
#   + modo_approvvigionamento_id, modo_approvvigionamento_codice_interno,
#     modo_approvvigionamento_descrizione, gestito_a_magazzino, lead_time_giorni
#   Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 5.2
#
# -- LA FORMA: quella di natura_vendita_* (20260610-05) ------------------------
#   id + codice_interno (chiave naturale stabile, per la logica) + descrizione
#   (a video). ⛔ La colonna decodificata NON si chiama `_codice`: il valore
#   viene da config.modi_approvvigionamento.codice_interno, e linee-guida-sql
#   6c vieta `codice_interno AS *_codice` (presidiato da
#   scripts/sql/check_naming_stato_codice.sql). Un consumatore che confronta
#   contro un `*_codice` si aspetta la colonna MUTABILE.
#   LEFT JOIN per coerenza con le altre decodifiche: la FK e' NOT NULL dal
#   20260913-11 e il require_attivo nasce a ci_apply, ma la vista non deve
#   perdere righe su una decodifica.
#
# -- NESSUNA security_invoker, E NON VA AGGIUNTA --------------------------------
#   Fino al 2026-09-12 il brief la dava «reloption di tutte e tre» le viste:
#   falso per questa. catalogo.articoli non ha RLS e la vista non attraversa
#   tabelle protette; il criterio e' presidiato sul MERITO da
#   db/pgtap/rls/test-rls-viste-security-invoker.sql, non sui nomi.
#
# -- CREATE OR REPLACE: colonne in ULTIMA posizione ---------------------------
#   PostgreSQL consente solo di appendere. Nessun oggetto DB dipende da
#   questa vista (pg_depend, verificato il 2026-09-13).
#
# -- CHI LA LEGGE, E PERCHE' NON BASTA ---------------------------------------
#   catalogo_repository proietta ARTICOLI_DETAIL_COLUMNS (49 nomi in tupla):
#   le cinque colonne nuove NON escono finche' il BE non le aggiunge, e
#   nessun presidio lo dice — il trigger ui.trgfn_ui_lista_colonna_a10_valida_campo_sorgente
#   e' verde (la colonna nella vista c'e') e il cancello Django
#   test_lista_proiezione_campo_sorgente salta le liste con vista. Per questo
#   le righe di ui.lista_colonna 747-749 nascono attivo=f (P-7) e le accende
#   il BE nello stesso commit della proiezione (brief 5.3 e 5.5).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20260913-19-update-vw-articoli-dettaglio-approvvigionamento-mctit.yaml

  - changeSet:
      id: 20260913-19-update-vw-articoli-dettaglio-approvvigionamento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.vw_articoli_dettaglio: + modo_approvvigionamento_id, _codice_interno,
        _descrizione (LEFT JOIN config.modi_approvvigionamento, forma di natura_vendita_*),
        gestito_a_magazzino e lead_time_giorni, in coda. Nessuna security_invoker
        (catalogo.articoli non ha RLS). Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo,
        sezione 5.2 (P-6).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: catalogo
                viewName: vw_articoli_dettaglio
            - columnExists:
                schemaName: catalogo
                tableName: articoli
                columnName: modo_approvvigionamento_id
            - columnExists:
                schemaName: catalogo
                tableName: articoli
                columnName: lead_time_giorni
            - tableExists:
                schemaName: config
                tableName: modi_approvvigionamento
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW catalogo.vw_articoli_dettaglio AS
              SELECT a.id,
                  a.codice,
                  a.descrizione,
                  a.descrizione_breve,
                  a.uom_id,
                  a.tipo_voce_id,
                  a.gruppo_voce_id,
                  a.spesa_id,
                  a.iva_id,
                  a.conto_contabile_vendita_id,
                  a.conto_contabile_acquisto_id,
                  a.is_composito,
                  a.is_solo_componente,
                  a.requires_serial,
                  a.listino_tipologia_id,
                  a.meta,
                  a.user_insert,
                  a.user_update,
                  a.data_insert,
                  a.data_update,
                  a.tx_id,
                  a.storicizza,
                  a.attivo,
                  a.note_target_tipo,
                  a.note_id,
                  u.id AS uom_ref_id,
                  u.codice AS uom_codice,
                  u.descrizione AS uom_descrizione,
                  t.id AS tipologia_ref_id,
                  t.codice AS tipologia_codice,
                  t.descrizione AS tipologia_descrizione,
                  g.id AS gruppo_ref_id,
                  g.codice AS gruppo_codice,
                  g.descrizione AS gruppo_descrizione,
                  s.id AS spesa_ref_id,
                  s.codice AS spesa_codice,
                  s.descrizione AS spesa_descrizione,
                  i.id AS iva_ref_id,
                  i.codice AS iva_codice,
                  i.descrizione AS iva_descrizione,
                  i.aliquota_iva AS iva_aliquota_iva,
                  lt.codice AS tipologia_listino_codice,
                  lt.descrizione AS tipologia_listino_descrizione,
                  a.is_composito AND NOT a.is_solo_componente AS puo_gestire_bom,
                      CASE
                          WHEN a.is_composito AND NOT a.is_solo_componente THEN NULL::text
                          WHEN a.is_solo_componente THEN 'ARTICOLO_SOLO_COMPONENTE'::text
                          ELSE 'ARTICOLO_NON_COMPOSITO'::text
                      END AS motivo_non_gestibile_bom,
                  a.is_composito AND (EXISTS ( SELECT 1
                         FROM catalogo.articoli_componenti ac
                        WHERE ac.prodotto_id = a.id AND ac.validita @> CURRENT_DATE AND ac.attivo = true)) AS has_componenti_alla_data,
                  a.natura_vendita_id,
                  nv.codice_interno AS natura_vendita_codice_interno,
                  nv.descrizione AS natura_vendita_descrizione,
                  nv.destinazione_tipo AS natura_vendita_destinazione_tipo,
                  -- rev 2026-09-13 (P-6): da dove arriva l'articolo. Decodifica per
                  -- codice_interno (immutabile, per la logica) + descrizione (a video),
                  -- sulla forma di natura_vendita_*. ⛔ Non `_codice`: il valore viene da
                  -- codice_interno e linee-guida-sql 6c vieta `codice_interno AS *_codice`.
                  a.modo_approvvigionamento_id,
                  ma.codice_interno AS modo_approvvigionamento_codice_interno,
                  ma.descrizione AS modo_approvvigionamento_descrizione,
                  a.gestito_a_magazzino,
                  a.lead_time_giorni
                 FROM catalogo.articoli a
                   LEFT JOIN catalogo.unita_misura u ON u.id = a.uom_id
                   LEFT JOIN vendite.articoli_tipologie t ON t.id = a.tipo_voce_id
                   LEFT JOIN vendite.articoli_gruppi g ON g.id = a.gruppo_voce_id
                   LEFT JOIN vendite.articoli_spesa s ON s.id = a.spesa_id
                   LEFT JOIN config.iva i ON i.id = a.iva_id
                   LEFT JOIN config.listini_tipologie lt ON lt.id = a.listino_tipologia_id
                   LEFT JOIN config.nature_vendita nv ON nv.id = a.natura_vendita_id
                   LEFT JOIN config.modi_approvvigionamento ma ON ma.id = a.modo_approvvigionamento_id;

              COMMENT ON VIEW catalogo.vw_articoli_dettaglio
              IS 'Vista della lista (ui.lista_definizione 26) e del drawer articolo: catalogo.articoli + decodifiche (uom, tipologia, gruppo, spesa, iva, tipologia listino, natura di vendita) + capability BoM. Nessuna security_invoker, e non deve prenderla per imitazione: catalogo.articoli non ha RLS e la vista non attraversa tabelle protette (presidio sul merito: db/pgtap/rls/test-rls-viste-security-invoker.sql). ⭐ rev 2026-09-13 (P-6, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + modo_approvvigionamento_id, modo_approvvigionamento_codice_interno, modo_approvvigionamento_descrizione, gestito_a_magazzino, lead_time_giorni, in coda (CREATE OR REPLACE VIEW puo'' solo appendere). La decodifica e'' sulla forma di natura_vendita_*: codice_interno per la logica, descrizione a video; NON `_codice`, che mentirebbe sulla sorgente (linee-guida-sql 6c). LEFT JOIN per coerenza con le altre decodifiche, anche se la FK e'' NOT NULL. ⚠️ catalogo_repository proietta ARTICOLI_DETAIL_COLUMNS per nome: le cinque colonne non escono finche'' il BE non le aggiunge, e le righe di lista 747-749 nascono attivo=f (brief 5.3 e 5.5).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS catalogo.vw_articoli_dettaglio;
              CREATE VIEW catalogo.vw_articoli_dettaglio AS
              SELECT a.id,
                  a.codice,
                  a.descrizione,
                  a.descrizione_breve,
                  a.uom_id,
                  a.tipo_voce_id,
                  a.gruppo_voce_id,
                  a.spesa_id,
                  a.iva_id,
                  a.conto_contabile_vendita_id,
                  a.conto_contabile_acquisto_id,
                  a.is_composito,
                  a.is_solo_componente,
                  a.requires_serial,
                  a.listino_tipologia_id,
                  a.meta,
                  a.user_insert,
                  a.user_update,
                  a.data_insert,
                  a.data_update,
                  a.tx_id,
                  a.storicizza,
                  a.attivo,
                  a.note_target_tipo,
                  a.note_id,
                  u.id AS uom_ref_id,
                  u.codice AS uom_codice,
                  u.descrizione AS uom_descrizione,
                  t.id AS tipologia_ref_id,
                  t.codice AS tipologia_codice,
                  t.descrizione AS tipologia_descrizione,
                  g.id AS gruppo_ref_id,
                  g.codice AS gruppo_codice,
                  g.descrizione AS gruppo_descrizione,
                  s.id AS spesa_ref_id,
                  s.codice AS spesa_codice,
                  s.descrizione AS spesa_descrizione,
                  i.id AS iva_ref_id,
                  i.codice AS iva_codice,
                  i.descrizione AS iva_descrizione,
                  i.aliquota_iva AS iva_aliquota_iva,
                  lt.codice AS tipologia_listino_codice,
                  lt.descrizione AS tipologia_listino_descrizione,
                  a.is_composito AND NOT a.is_solo_componente AS puo_gestire_bom,
                      CASE
                          WHEN a.is_composito AND NOT a.is_solo_componente THEN NULL::text
                          WHEN a.is_solo_componente THEN 'ARTICOLO_SOLO_COMPONENTE'::text
                          ELSE 'ARTICOLO_NON_COMPOSITO'::text
                      END AS motivo_non_gestibile_bom,
                  a.is_composito AND (EXISTS ( SELECT 1
                         FROM catalogo.articoli_componenti ac
                        WHERE ac.prodotto_id = a.id AND ac.validita @> CURRENT_DATE AND ac.attivo = true)) AS has_componenti_alla_data,
                  a.natura_vendita_id,
                  nv.codice_interno AS natura_vendita_codice_interno,
                  nv.descrizione AS natura_vendita_descrizione,
                  nv.destinazione_tipo AS natura_vendita_destinazione_tipo
                 FROM catalogo.articoli a
                   LEFT JOIN catalogo.unita_misura u ON u.id = a.uom_id
                   LEFT JOIN vendite.articoli_tipologie t ON t.id = a.tipo_voce_id
                   LEFT JOIN vendite.articoli_gruppi g ON g.id = a.gruppo_voce_id
                   LEFT JOIN vendite.articoli_spesa s ON s.id = a.spesa_id
                   LEFT JOIN config.iva i ON i.id = a.iva_id
                   LEFT JOIN config.listini_tipologie lt ON lt.id = a.listino_tipologia_id
                   LEFT JOIN config.nature_vendita nv ON nv.id = a.natura_vendita_id;
              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS NULL;
