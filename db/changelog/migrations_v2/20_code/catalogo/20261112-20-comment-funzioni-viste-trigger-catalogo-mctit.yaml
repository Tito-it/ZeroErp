              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.tipologia_listino_descrizione IS
                  'La descrizione della tipologia di listino dell''articolo (config.listini_tipologie.descrizione).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.puo_gestire_bom IS
                  'L''articolo ha una distinta da gestire: e'' composito e non e'' solo componente.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.motivo_non_gestibile_bom IS
                  'Perche'' la distinta non si gestisce: ARTICOLO_SOLO_COMPONENTE o ARTICOLO_NON_COMPOSITO; NULL quando puo_gestire_bom.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.has_componenti_alla_data IS
                  'Il composito ha almeno un legame alla data operativa (catalogo.fn_distinta_alla_data a script.fn_data_operativa).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.natura_vendita_codice_interno IS
                  'Il codice_interno della natura di vendita (config.nature_vendita), per la logica.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.natura_vendita_descrizione IS
