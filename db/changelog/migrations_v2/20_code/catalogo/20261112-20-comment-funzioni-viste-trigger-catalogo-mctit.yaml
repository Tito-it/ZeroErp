              COMMENT ON TRIGGER trg_articoli_a10_guard_onere_natura_ins_upd ON catalogo.articoli IS
                  'Un articolo-onere e'' un addebito, non un bene: la natura non e'' merce (E_ARTICOLO_ONERE_NATURA_MERCE) e non e'' gestito a magazzino, composito, a lotti o a matricola (E_ARTICOLO_ONERE_STRUTTURA). Fascia _a10_. UPDATE OF le sei colonne che la funzione giudica: nessun trigger BEFORE della tabella le scrive.';
              COMMENT ON TRIGGER trg_articoli_a10_guard_flags_struttura_bom_attiva_upd ON catalogo.articoli IS
                  'I flag di struttura che una distinta in vigore o futura rende immutabili (catalogo.trgfn_articoli_guard_flags_struttura_bom_attiva, E_BOM_MODIFICA_VIETATA). BEFORE UPDATE OF is_composito, is_solo_componente, requires_serial.';
              COMMENT ON TRIGGER trg_articoli_a10_seed_uom_base_ins ON catalogo.articoli IS
                  'Crea la riga dell''unita'' base dell''articolo in catalogo.articoli_uom_operativa (catalogo.trgfn_articoli_seed_uom_base). AFTER INSERT.';
              COMMENT ON TRIGGER trg_articoli_a10_guard_iva_bom_attiva_upd ON catalogo.articoli IS
                  'Un kit e i suoi componenti hanno la stessa IVA, sui legami da oggi in poi (catalogo.trgfn_articoli_guard_iva_bom_attiva). CONSTRAINT TRIGGER AFTER UPDATE OF iva_id, DEFERRABLE INITIALLY DEFERRED, quando l''IVA cambia: si giudica a fine transazione, cosi'' l''IVA del kit e dei componenti si cambia insieme, in qualunque ordine.';
              COMMENT ON TRIGGER trg_articoli_a10_guard_struttura_se_usato_upd ON catalogo.articoli IS
                  'Un articolo usato non cambia le colonne strutturali (catalogo.trgfn_articoli_guard_struttura_se_usato, E_ARTICOLO_USATO_STRUTTURA_IMMUTABILE); la porta amministratore e'' catalogo.fn_articolo_correggi_struttura. BEFORE UPDATE OF le colonne di catalogo.fn_articolo_colonne_struttura.';
              COMMENT ON TRIGGER trg_articoli_componenti_a10_guard_riga_componente_ins_upd ON catalogo.articoli_componenti IS
                  'Ogni composizione nuova passa la check della riga di tipo ARTICOLO: padre composito, componente ammesso (catalogo.trgfn_articoli_componenti_guard_componente). BEFORE INSERT OR UPDATE OF componente_id, prodotto_id, attivo, valido_al.';
              COMMENT ON TRIGGER trg_articoli_componenti_a10_block_modifica_struttura_upd_dlt ON catalogo.articoli_componenti IS
                  'La distinta e'' una storia: un legame non si cancella, la sua struttura non cambia, e la fine non riscrive i giorni passati (catalogo.trgfn_articoli_componenti_block_modifica_struttura, E_BOM_MODIFICA_VIETATA). BEFORE DELETE OR UPDATE OF prodotto_id, componente_id, coeff_qta, obbligatorio, esposizione_in_fattura, valido_dal, valido_al.';
              COMMENT ON TRIGGER trg_articoli_uom_operativa_a10_guard_storia_upd_dlt ON catalogo.articoli_uom_operativa IS
                  'La storia della conversione: si spegne, si riaccende e si cancella solo se non ha giorni passati, e si chiude da oggi in poi (catalogo.trgfn_uom_guard_storia). BEFORE UPDATE OF attivo, valido_al OR DELETE.';
              COMMENT ON TRIGGER trg_articoli_uom_operativa_a10_guard_listini_attivi_upd ON catalogo.articoli_uom_operativa IS
                  'Chiudere o spegnere la conversione non lascia una versione di listino ATTIVA con un prezzo in un''unita'' che non si converte (catalogo.trgfn_uom_guard_listini_attivi). CONSTRAINT TRIGGER AFTER UPDATE OF valido_al, attivo, quando cambiano, DEFERRABLE INITIALLY DEFERRED: si giudica a fine transazione, cosi'' «chiudi e inserisci» passa in qualunque ordine.';
              COMMENT ON TRIGGER trg_articoli_uom_operativa_a10_guard_listini_attivi_dlt ON catalogo.articoli_uom_operativa IS
                  'Togliere la conversione non lascia una versione di listino ATTIVA con un prezzo in un''unita'' che non si converte (catalogo.trgfn_uom_guard_listini_attivi). CONSTRAINT TRIGGER AFTER DELETE, DEFERRABLE INITIALLY DEFERRED: si giudica a fine transazione.';
              COMMENT ON TRIGGER trg_unita_misura_conversioni_a10_guard_storia_upd_dlt ON catalogo.unita_misura_conversioni IS
                  'La storia della conversione: si spegne, si riaccende e si cancella solo se non ha giorni passati, e si chiude da oggi in poi (catalogo.trgfn_uom_guard_storia). BEFORE UPDATE OF attivo, valido_al OR DELETE.';
              COMMENT ON TRIGGER trg_unita_misura_conversioni_a10_guard_listini_attivi_upd ON catalogo.unita_misura_conversioni IS
