# COMMENT di funzioni, viste e trigger di catalogo (§3.1 M2, §3.2, §3.3).
#
#   Si riscrivono interi, al presente (linee-guida-sql §5d): fn_articoli_ammessi,
#   fn_articolo_righe_vive_non_ammesse, la vista vw_articoli_dettaglio (M2: niente id della
#   lista, requires_lotto ha il suo lock condizionale) e le sue colonne obsoleto_dal,
#   e_obsoleto, e_onere, causale_onere_id, il trigger del guard onere/natura.
#   Nuovi: le colonne che le viste calcolano (scelta 3 di Tid: una colonna copiata dalla
#   tabella resta col COMMENT della tabella) e i trigger scritti a mano dei guard.
#   I corpi di fn_articoli_ammessi e fn_articolo_righe_vive_non_ammesse non si riaprono.
#   Rollback: i COMMENT di prima (NULL dove non c'erano), letti su dbdev il 2026-11-11.
#   Brief: brief-db-revisione-catalogo, giro 5-A (§17).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261112-20-comment-funzioni-viste-trigger-catalogo-mctit.yaml

  - changeSet:
      id: 20261112-20-comment-funzioni-viste-trigger-catalogo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo: COMMENT di funzioni, viste e trigger al presente; quelli delle colonne calcolate e dei guard.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_class WHERE oid IN (to_regclass('catalogo.vw_note'), to_regclass('catalogo.vw_articoli_dettaglio'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION catalogo.fn_articoli_ammessi(text,bigint,text,integer,vendite.tipo_eccezione_contratto,uuid) IS
                  'Sede unica del picker degli articoli di una riga: dato il documento (codice di config.tipi_entita: PREVENTIVO | ORDINE_VENDITA | DDT_VENDITA | OFFERTA_COMMERCIALE | CONTRATTO | LISTINO_VERSIONE | ARTICOLO | PROMO_ARTICOLO) e il suo id (obbligatorio, altrimenti E_PARAMETRO_INVALIDO; non per ARTICOLO, che vuole p_articolo_padre_id, ne'' per PROMO_ARTICOLO), gli articoli ATTIVI che la ricerca trova (p_search: «contiene», senza maiuscole, su codice o descrizione, letterale; vuoto = tutti), {articolo_id, codice, descrizione, motivo, ordine}: motivo = il PRIMO motivo della check per tipo di riga ({codice, reason, reason_key, dettaglio, valori}; NULL = ammesso), cioe'' quello che il guard di tabella solleverebbe scrivendo la riga; prima gli ammessi, poi per codice; ordine = la posizione. p_tipo_eccezione per offerta e contratto (AGGIUNTA | OVERRIDE | ESCLUSIONE), obbligatorio. Il tetto (p_limit, NULL = nessuno, almeno 1) lo sceglie il chiamante; la check gira su ogni articolo trovato, prima del tetto. Il composito della versione di listino esce con COMPOSITO_COME_BUNDLE: nella versione entra come bundle, coi componenti. Il picker giudica come scelta nuova (p_scelta_nuova = true della check): un articolo ritirato (catalogo.articoli.obsoleto_dal raggiunta, script.fn_e_obsoleto) resta nell''elenco fra gli esclusi col motivo OBSOLETO (E_ARTICOLO_OBSOLETO), lo stesso che solleva il guard di riga. Due meta'' della stessa check dei guard: script.fn_articolo_riga_contesto (il documento, letto una volta) e script.fn_check_articolo_riga_su_contesto (i motivi). Sotto RLS (SECURITY INVOKER).';
              COMMENT ON FUNCTION catalogo.fn_articolo_righe_vive_non_ammesse(uuid) IS
                  'Le righe VIVE di un articolo che la check dei guard di riga non ammette: {documento (codice di config.tipi_entita), documento_id, riga_id, motivo = il primo motivo della riga intera, script.fn_check_riga_documento_su_contesto, con la natura, il tipo d''eccezione, l''erogazione e la fonte della riga}; solo le righe con un motivo. Viva = attiva, e il documento non e'' chiuso: fase dello stato diversa da CHIUSO per preventivo, ordine, bolla, offerta e contratto; versione di listino non CHIUSA (lo stato dal vocabolario config.stati_doc_listino_versioni, per codice_interno); promo col periodo non finito alla data operativa (script.fn_data_operativa). Le sette tabelle sono quelle dove e'' montato script.trgfn_righe_guard_articolo_ammesso (per la promo documento_id = riga_id = id della promo). SECURITY INVOKER: sotto RLS chi la chiama vede le sue righe; il verbo catalogo.fn_articolo_correggi_struttura (SECURITY DEFINER) la chiama su tutte le aziende, prima e dopo la correzione, e rifiuta solo le righe che la correzione rende non ammesse.';
              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS
                  'Vista della lista degli articoli (ui.lista_definizione catalogo.articoli) e del drawer articolo: catalogo.articoli con le decodifiche (unita'' di misura, tipologia, gruppo, spesa, IVA, tipologia di listino, natura di vendita, modo di approvvigionamento), le capability della distinta (puo_gestire_bom, motivo_non_gestibile_bom, has_componenti_alla_data), l''onere (e_onere) e il ritiro (e_obsoleto). Natura di vendita e modo di approvvigionamento escono con codice_interno, per la logica, e descrizione, a video. Quali colonne non si cambiano lo dice dbops.vw_non_editable_fields: i lock di colonna e quelli condizionali (requires_lotto, per esempio, non cambia su un articolo usato). Nessuna security_invoker, e non deve prenderla per imitazione: catalogo.articoli non ha RLS e la vista non attraversa tabelle protette (presidio: db/pgtap/rls/test-rls-viste-security-invoker.sql).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.causale_onere_id IS
                  'La causale dell''onere (config.causali_onere); NULL sulla merce. Il discrimine resta e_onere: questa colonna porta il valore per chi etichetta o raggruppa.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.e_onere IS
                  'La definizione di articolo-onere: causale_onere_id IS NOT NULL (un articolo-onere non e'' merce, non e'' a magazzino, composito, a lotti o a matricola: catalogo.trgfn_articoli_guard_onere_natura). La leggono il picker delle righe (date di consegna nascoste sulla riga nuova: E_RIGA_ONERE_DATA_CONSEGNA) e il form articolo. Sulla RIGA di documento il discrimine e'' e_onere della vista di riga, sulla natura congelata.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.obsoleto_dal IS
                  'La data del ritiro dell''articolo (catalogo.articoli.obsoleto_dal): NULL = si sceglie; passata = ritirato; futura = ritiro programmato. Il drawer la mostra e la modifica; cancellarla riattiva.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.e_obsoleto IS
                  'Ritirato alla data operativa: script.fn_e_obsoleto(obsoleto_dal), lo stesso BB del guard di riga (E_ARTICOLO_OBSOLETO) e del picker (catalogo.fn_articoli_ammessi). La leggono la lista e il drawer: il FE non confronta date. Ritirato non vuol dire non attivo: l''articolo resta valido sulle righe che lo usano gia''.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.uom_ref_id IS
                  'L''unita'' di misura base (catalogo.unita_misura.id): lo stesso valore di uom_id.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.uom_codice IS
                  'Il codice dell''unita'' di misura base (catalogo.unita_misura.codice).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.uom_descrizione IS
                  'La descrizione dell''unita'' di misura base (catalogo.unita_misura.descrizione).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.tipologia_ref_id IS
                  'La tipologia dell''articolo (vendite.articoli_tipologie.id): lo stesso valore di tipo_voce_id.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.tipologia_codice IS
                  'Il codice della tipologia dell''articolo (vendite.articoli_tipologie.codice).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.tipologia_descrizione IS
                  'La descrizione della tipologia dell''articolo (vendite.articoli_tipologie.descrizione).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.gruppo_ref_id IS
                  'Il gruppo dell''articolo (vendite.articoli_gruppi.id): lo stesso valore di gruppo_voce_id.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.gruppo_codice IS
