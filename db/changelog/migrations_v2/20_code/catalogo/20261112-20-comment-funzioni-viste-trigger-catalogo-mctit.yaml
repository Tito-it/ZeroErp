              COMMENT ON TRIGGER trg_unita_misura_conversioni_a10_guard_listini_attivi_dlt ON catalogo.unita_misura_conversioni IS
                  'Togliere la conversione non lascia una versione di listino ATTIVA con un prezzo in un''unita'' che non si converte (catalogo.trgfn_uom_guard_listini_attivi). CONSTRAINT TRIGGER AFTER DELETE, DEFERRABLE INITIALLY DEFERRED: si giudica a fine transazione.';
              COMMENT ON TRIGGER trg_uom_conversioni_a10_guard_tipo_ins_upd ON catalogo.unita_misura_conversioni IS
                  'Una conversione generale vale solo fra unita'' della stessa tipologia (catalogo.trgfn_uom_conversioni_guard_tipo, E_UOM_CONVERSIONE_TIPO_DIVERSO). BEFORE INSERT OR UPDATE OF uom_from_id, uom_to_id.';
