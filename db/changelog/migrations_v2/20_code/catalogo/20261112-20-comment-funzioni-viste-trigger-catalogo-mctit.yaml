              COMMENT ON TRIGGER trg_articoli_a10_guard_onere_natura_ins_upd ON catalogo.articoli IS
                  'Un articolo-onere e'' un addebito, non un bene: la natura non e'' merce (E_ARTICOLO_ONERE_NATURA_MERCE) e non e'' gestito a magazzino, composito, a lotti o a matricola (E_ARTICOLO_ONERE_STRUTTURA). Fascia _a10_. UPDATE OF le sei colonne che la funzione giudica: nessun trigger BEFORE della tabella le scrive. Brief: brief-db-articoli-ammessi-per-documento (A-9); rev 2026-11-03 (20261103-20, brief-db-addebito-trasporto-ordine §8.1, decisione 10).';
