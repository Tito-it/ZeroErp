              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.gruppo_descrizione IS
                  'La descrizione del gruppo dell''articolo (vendite.articoli_gruppi.descrizione).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.spesa_ref_id IS
                  'La voce di spesa dell''articolo (vendite.articoli_spesa.id): lo stesso valore di spesa_id.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.spesa_codice IS
                  'Il codice della voce di spesa (vendite.articoli_spesa.codice).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.spesa_descrizione IS
                  'La descrizione della voce di spesa (vendite.articoli_spesa.descrizione).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.iva_ref_id IS
