        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION catalogo.fn_articoli_ammessi(text,bigint,text,integer,vendite.tipo_eccezione_contratto,uuid) IS
                  'Sede unica del picker degli articoli di una riga (R-2, A-7): dato il documento (codice di config.tipi_entita: PREVENTIVO | ORDINE_VENDITA | DDT_VENDITA | OFFERTA_COMMERCIALE | CONTRATTO | LISTINO_VERSIONE | ARTICOLO | PROMO_ARTICOLO) e il suo id (A-1: obbligatorio, E_PARAMETRO_INVALIDO, tranne ARTICOLO, che vuole p_articolo_padre_id, e PROMO_ARTICOLO), gli articoli ATTIVI che la ricerca trova (p_search: «contiene», senza maiuscole, su codice o descrizione, letterale; vuoto = tutti), {articolo_id, codice, descrizione, motivo, ordine}: motivo = il PRIMO motivo della check per tipo di riga ({codice, reason, reason_key, dettaglio, valori}; NULL = ammesso), cioe'' quello che il guard di tabella solleverebbe scrivendo la riga; prima gli ammessi, poi per codice; ordine = la posizione. p_tipo_eccezione per offerta e contratto (AGGIUNTA | OVERRIDE | ESCLUSIONE), obbligatorio. Il tetto (p_limit, NULL = nessuno, almeno 1) lo sceglie il chiamante; la check gira su ogni articolo trovato, prima del tetto. Il composito della versione di listino esce con COMPOSITO_COME_BUNDLE: nella versione entra come bundle, coi componenti. Due meta'' della stessa check dei guard (A-2): script.fn_articolo_riga_contesto (il documento, letto una volta: R-5) e script.fn_check_articolo_riga_su_contesto (i motivi). Sotto RLS (SECURITY INVOKER). Nasce il 2026-10-14, brief-db-articoli-ammessi-per-documento (Lotto 4, §9.4); prende il posto dei filtri liberi di catalogo_repository.lookup_articoli per le righe di documento (giro BE/FE). ⭐ rev 2026-11-05 (20261105-12, brief-db-articoli-obsoleto-dal §4): il picker giudica come SCELTA NUOVA (p_scelta_nuova = true della check): un articolo ritirato (catalogo.articoli.obsoleto_dal raggiunta, script.fn_e_obsoleto) resta nell''elenco fra gli esclusi col motivo OBSOLETO (E_ARTICOLO_OBSOLETO, il primo), lo stesso che il guard di riga solleva.';
              COMMENT ON FUNCTION catalogo.fn_articolo_righe_vive_non_ammesse(uuid) IS
                  'Le righe VIVE di un articolo che la check dei guard di riga non ammette: {documento (codice di config.tipi_entita), documento_id, riga_id, motivo = il primo motivo della riga intera, script.fn_check_riga_documento_su_contesto, con la natura, il tipo d''eccezione, l''erogazione e la fonte della riga}; solo le righe con un motivo. Viva = attiva, e il documento non e'' chiuso: fase dello stato diversa da CHIUSO per preventivo, ordine, bolla, offerta e contratto; versione di listino non CHIUSA; promo col periodo non finito alla data operativa (script.fn_data_operativa). Le sette tabelle sono quelle dove e'' montato script.trgfn_righe_guard_articolo_ammesso (per la promo documento_id = riga_id = id della promo). SECURITY INVOKER: sotto RLS chi la chiama vede le sue righe; il verbo catalogo.fn_articolo_correggi_struttura (SECURITY DEFINER) la chiama su tutte le aziende, prima e dopo la correzione, e rifiuta solo le righe che la correzione rende non ammesse (A-11 di brief-db-articoli-ammessi-per-documento). Nasce il 2026-10-18 (§9.8.6). Rev 2026-10-21 (20261021-55, brief-db-offerta-emissione-ed-erogazione §I.2): la check e'' la riga intera, su offerta e contratto anche erogazione e fonte; una correzione della struttura non porta piu'' una riga fuori dal perimetro d''erogazione senza essere fermata. Rev 2026-10-28 (20261028-16, brief-modello-documento-vendita §16, L-1): lo stato della versione di listino si legge dal vocabolario config.stati_doc_listino_versioni (codice_interno), non piu'' dalla colonna testo stato.';
              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS
                  'Vista della lista (ui.lista_definizione 26) e del drawer articolo: catalogo.articoli + decodifiche (uom, tipologia, gruppo, spesa, iva, tipologia listino, natura di vendita) + capability BoM. Nessuna security_invoker, e non deve prenderla per imitazione: catalogo.articoli non ha RLS e la vista non attraversa tabelle protette (presidio sul merito: db/pgtap/rls/test-rls-viste-security-invoker.sql). ⭐ rev 2026-09-18 (P-1, brief-db-magazzino-lotto-2-motore sezione 4.9): + requires_lotto in coda — la primitiva di magazzino pretende il lotto quando e'' vero (passo 6), e l''operatore deve poterlo vedere e impostare; SENZA lock BoM (Lotto 1 sezione 4.3: il lotto non entra nella distinta), quindi ne'' fra i non_editable_fields del BE ne'' disabilitato nel drawer. rev 2026-09-13 (P-6, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + modo_approvvigionamento_id, modo_approvvigionamento_codice_interno, modo_approvvigionamento_descrizione, gestito_a_magazzino, lead_time_giorni, in coda (CREATE OR REPLACE VIEW puo'' solo appendere). La decodifica e'' sulla forma di natura_vendita_*: codice_interno per la logica, descrizione a video; NON `_codice`, che mentirebbe sulla sorgente (linee-guida-sql 6c). ⚠️ catalogo_repository proietta ARTICOLI_DETAIL_COLUMNS per nome: una colonna nuova non esce finche'' il BE non la nomina. Rev 2026-10-25 (20261025-57/-60, brief-db-grammatica-unica-documenti lotto 3, G-7): tolta e rimessa identica perche'' la colonna che legge cambia tipo; note_target_tipo vale ARTICOLO (era ARTICOLI) e diventa varchar(50), dalla colonna di catalogo.articoli. rev 2026-11-03 (20261103-53, brief-db-addebito-trasporto-ordine §9.9, richiesta del FE): + e_onere e causale_onere_id in coda: il picker articoli e il form articolo sanno se l''articolo scelto e'' un onere (date di consegna nascoste sulla riga nuova; flag magazzino, composito, lotto, matricola spenti, gemello del guard trgfn_articoli_guard_onere_natura). Anche queste colonne non escono finche'' il BE non le nomina. ⭐ rev 2026-11-06 (20261106-03, brief-db-articoli-obsoleto-dal §7.3 lotto D): + obsoleto_dal ed e_obsoleto in coda. obsoleto_dal e'' la data del ritiro (NULL = si sceglie; futura = ritiro programmato); e_obsoleto e'' il BB script.fn_e_obsoleto alla data operativa, lo stesso predicato del guard di riga e del picker: il FE lo legge e non confronta date. Anche queste colonne non escono finche'' il BE non le nomina.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.causale_onere_id IS
                  'La causale dell''onere (config.causali_onere); NULL sulla merce. Il discrimine resta e_onere: questa colonna porta il valore per chi etichetta o raggruppa. brief-db-addebito-trasporto-ordine §9.9.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.e_onere IS
                  'La definizione di articolo-onere: causale_onere_id IS NOT NULL (un articolo-onere non e'' merce, non e'' a magazzino, composito, a lotti o a matricola: trgfn_articoli_guard_onere_natura). La leggono il picker delle righe (date di consegna nascoste sulla riga nuova: E_RIGA_ONERE_DATA_CONSEGNA) e il form articolo. Sulla RIGA di documento il discrimine e'' e_onere della vista di riga, sulla natura congelata. brief-db-addebito-trasporto-ordine §9.9.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.obsoleto_dal IS
                  'La data del ritiro dell''articolo (catalogo.articoli.obsoleto_dal): NULL = si sceglie; passata = ritirato; futura = ritiro programmato. Il drawer la mostra e la modifica; cancellarla riattiva. brief-db-articoli-obsoleto-dal §3.';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.e_obsoleto IS
                  'Ritirato alla data operativa: script.fn_e_obsoleto(obsoleto_dal), lo stesso BB del guard di riga (E_ARTICOLO_OBSOLETO) e del picker (catalogo.fn_articoli_ammessi). La leggono la lista e il drawer: il FE non confronta date. Ritirato non vuol dire non attivo: l''articolo resta valido sulle righe che lo usano gia''. brief-db-articoli-obsoleto-dal §3 e §4.';
