              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.iva_descrizione IS
                  'La descrizione dell''IVA (config.iva.descrizione).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.iva_aliquota_iva IS
                  'L''aliquota dell''IVA (config.iva.aliquota_iva).';
              COMMENT ON COLUMN catalogo.vw_articoli_dettaglio.tipologia_listino_codice IS
