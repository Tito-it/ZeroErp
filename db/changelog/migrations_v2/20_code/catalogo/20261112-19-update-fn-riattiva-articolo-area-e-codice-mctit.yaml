                  'Riattiva un articolo (attivo=true) senza toccare i figli (pattern "padre prima, figli poi"). Idempotente su gia'' attivo, raise E_ARTICOLO_NOT_FOUND (404) se id NULL o inesistente. Disattivazione resta UPDATE diretto, coperto da trgfn_prevent_deactivate_if_children.';
