# ------------------------------------------------------------
# catalogo.fn_get_uom_factor: il fattore alla data e' quello della prima fonte in
#   vigore di catalogo.fn_uom_fonti_conversione (-47).
#
#   Prima leggeva la mappatura da fn_uom_operativa_alla_data e la conversione generale
#   con un SELECT suo: due copie del predicato che ora sta nelle fonti. Il risultato
#   non cambia: la base, poi la mappatura, poi la conversione nei due versi.
#   Rollback: il corpo di prima.
#   Brief: brief-db-revisione-catalogo, giro 2-bis.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261111-49-update-fn-get-uom-factor-dalle-fonti-mctit.yaml

  - changeSet:
      id: 20261111-49-update-fn-get-uom-factor-dalle-fonti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.fn_get_uom_factor legge le fonti della conversione (catalogo.fn_uom_fonti_conversione), sede unica del predicato (D25). Brief: brief-db-revisione-catalogo, giro 2-bis.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.proname = 'fn_uom_fonti_conversione'
                 AND p.pronamespace = 'catalogo'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_get_uom_factor(p_articolo_id uuid, p_uom_id bigint, p_data date)
               RETURNS numeric
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_base   catalogo.articoli.uom_id%TYPE;
                  -- numeric nudo DICHIARATO: l'inversa 1/fattore non sta in numeric(18,6).
                  v_factor numeric;
              BEGIN
                  IF p_uom_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  v_base := catalogo.fn_get_uom_base(p_articolo_id);
                  IF v_base IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- 1) L'unita' base: 1, a ogni data.
                  IF p_uom_id = v_base THEN
                      RETURN 1;
                  END IF;

                  -- Per le altre la data non si sottintende: senza data, nessun fattore.
                  IF p_data IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- 2) La prima fonte in vigore alla data: la mappatura dell'articolo,
                  --    poi la conversione generale nei due versi.
                  SELECT f.fattore INTO v_factor
                    FROM catalogo.fn_uom_fonti_conversione(p_articolo_id, p_uom_id) f
                   WHERE f.validita @> p_data
                   ORDER BY f.priorita
                   LIMIT 1;

                  RETURN v_factor;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.fn_get_uom_factor(uuid, bigint, date) IS
                  'Quante unita'' base dell''articolo p_articolo_id vale una unita'' p_uom_id, alla data p_data. L''unita'' base vale 1, a ogni data; per le altre il fattore della fonte di priorita'' piu'' bassa in vigore a p_data fra quelle di catalogo.fn_uom_fonti_conversione: la mappatura dell''articolo, poi la conversione generale fra le due unita'', nel verso in cui e'' scritta o nell''inverso (1/fattore). NULL se non ce n''e'' nessuna, o se p_data e'' NULL per un''unita'' che non e'' la base: la data non si sottintende. La chiama script.fn_fattore_uom_alla_data, che con NULL rifiuta la riga (E_UOM_MISSING).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_get_uom_factor(p_articolo_id uuid, p_uom_id bigint, p_data date)
               RETURNS numeric
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_base   catalogo.articoli.uom_id%TYPE;
                  v_factor catalogo.articoli_uom_operativa.factor_to_base%TYPE;
                  -- numeric nudo DICHIARATO: l'inversa 1/fattore non sta in numeric(18,6).
                  v_conv   numeric;
              BEGIN
                  IF p_uom_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  v_base := catalogo.fn_get_uom_base(p_articolo_id);
                  IF v_base IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- 1) L'unita' base: 1, a ogni data.
                  IF p_uom_id = v_base THEN
                      RETURN 1;
                  END IF;

                  -- Per le altre la data non si sottintende: senza data, nessun fattore.
                  IF p_data IS NULL THEN
                      RETURN NULL;
                  END IF;

                  -- 2) La mappatura dell'articolo alla data.
                  SELECT m.factor_to_base INTO v_factor
                    FROM catalogo.fn_uom_operativa_alla_data(p_articolo_id, p_uom_id, p_data) m;
                  IF v_factor IS NOT NULL THEN
                      RETURN v_factor;
                  END IF;

                  -- 3) La conversione generale alla data: una sola per coppia di unita', in
                  --    un verso o nell'altro (ex_unita_misura_conversioni_coppia_no_overlap).
                  --    fattore = quante uom_to vale una uom_from.
                  SELECT CASE WHEN c.uom_from_id = p_uom_id THEN c.fattore ELSE 1 / c.fattore END
                    INTO v_conv
                    FROM catalogo.unita_misura_conversioni c
                   WHERE c.attivo IS TRUE
                     AND c.validita @> p_data
                     AND ((c.uom_from_id = p_uom_id AND c.uom_to_id = v_base)
                       OR (c.uom_from_id = v_base   AND c.uom_to_id = p_uom_id));

                  RETURN v_conv;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.fn_get_uom_factor(uuid, bigint, date) IS
                  'Quante unita'' base dell''articolo p_articolo_id vale una unita'' p_uom_id, alla data p_data. L''unita'' base vale 1; poi la mappatura dell''articolo (catalogo.fn_uom_operativa_alla_data); poi la conversione generale di catalogo.unita_misura_conversioni fra le due unita'', in vigore a p_data, nel verso in cui e'' scritta o nell''inverso (1/fattore). NULL se non c''e'' nessuna delle tre, o se p_data e'' NULL per un''unita'' che non e'' la base: la data non si sottintende. Sede unica del fattore: la chiama script.trgfn_qta_from_operativa, che con NULL rifiuta la riga (E_UOM_MISSING).';
