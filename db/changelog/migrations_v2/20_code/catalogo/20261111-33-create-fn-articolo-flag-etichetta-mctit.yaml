# catalogo.fn_articolo_flag_etichetta: il nome leggibile di una colonna strutturale
#   dell'articolo (R5).
#
#   Lo stesso CASE «colonna -> nome che l'operatore riconosce» era scritto in
#   catalogo.trgfn_articoli_guard_struttura_se_usato e in
#   catalogo.trgfn_articoli_guard_onere_natura: alla seconda copia si estrae (regola del
#   2). Lo legge anche la porta catalogo.fn_articolo_correggi_struttura, per dire quale
#   valore non va senza mettere il nome di una colonna nella frase.
#   Le copie si ritirano nello stesso giro (-35, -36, -37).
#   Rollback: DROP.
#   Brief: brief-db-revisione-catalogo, giro 3.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261111-33-create-fn-articolo-flag-etichetta-mctit.yaml

  - changeSet:
      id: 20261111-33-create-fn-articolo-flag-etichetta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.fn_articolo_flag_etichetta: il nome leggibile delle colonne strutturali dell'articolo, in un posto (R5). Brief: brief-db-revisione-catalogo, giro 3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.proname = 'fn_articolo_flag_etichetta'
                 AND p.pronamespace = 'catalogo'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION catalogo.fn_articolo_flag_etichetta(p_colonna text)
               RETURNS text
               LANGUAGE sql
               IMMUTABLE
              AS $function$
                  -- Il nome di una colonna di catalogo.articoli: nessuna colonna ne e'
                  -- il riflesso, quindi text.
                  SELECT CASE p_colonna
                      WHEN 'is_composito'         THEN 'composito'
                      WHEN 'is_solo_componente'   THEN 'solo componente'
                      WHEN 'natura_vendita_id'    THEN 'natura di vendita'
                      WHEN 'causale_onere_id'     THEN 'causale onere'
                      WHEN 'listino_tipologia_id' THEN 'tipologia di listino'
                      WHEN 'gestito_a_magazzino'  THEN 'gestito a magazzino'
                      WHEN 'requires_lotto'       THEN 'gestito a lotti'
                      WHEN 'requires_serial'      THEN 'gestito a matricola'
                  END
              $function$;

              COMMENT ON FUNCTION catalogo.fn_articolo_flag_etichetta(text) IS
                  'Il nome che l''operatore riconosce di una colonna strutturale di catalogo.articoli (le colonne di catalogo.fn_articolo_colonne_struttura): composito, solo componente, natura di vendita, causale onere, tipologia di listino, gestito a magazzino, gestito a lotti, gestito a matricola. Un''altra colonna: NULL. Va nei valori dei messaggi al posto del nome della colonna. Lettori: catalogo.trgfn_articoli_guard_struttura_se_usato, catalogo.trgfn_articoli_guard_onere_natura, catalogo.fn_articolo_correggi_struttura. IMMUTABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS catalogo.fn_articolo_flag_etichetta(text);
