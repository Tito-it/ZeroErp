# catalogo: i lettori di app.current_user_id passano a script.fn_utente_di_sessione.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8; Q60 (a)).
#
# Il perche': ognuna convertiva la GUC da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, e un
#   valore che non e' un intero dava il 22P02 grezzo. Ora la legge il BB
#   (20261123-16): assente o vuota resta NULL, come prima; un valore che non
#   e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, col nome della
#   funzione che legge.
# Funzioni: fn_articolo_correggi_struttura, fn_chiudi_legame_distinta.
# Cambia solo la lettura. Corpo dal vivo (dbdev, 2026-11-23); firma, RETURNS e
#   attributi dall'ultimo changeSet che ha ancora i %TYPE. Firma, volatilita',
#   sicurezza, proprietario e GRANT invariati: CREATE OR REPLACE. La rollback
#   riporta i corpi di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261123-20-update-lettori-utente-di-sessione-catalogo-mctit.yaml

  - changeSet:
      id: 20261123-20-update-lettori-utente-di-sessione-catalogo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo: le funzioni che leggono app.current_user_id passano a script.fn_utente_di_sessione invece
        di convertire la GUC da se'. Brief: brief-db-revisione-ui (§3.6-sexies, Q60).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "3"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('script', 'fn_utente_di_sessione'), ('catalogo', 'fn_articolo_correggi_struttura'), ('catalogo', 'fn_chiudi_legame_distinta'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_articolo_correggi_struttura(
                   p_articolo_id catalogo.articoli.id%TYPE,
                   p_campi       jsonb)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_codice    catalogo.articoli.codice%TYPE;
                  v_estranee  text;
                  v_set       text;
                  v_prima     text[];
                  v_righe     integer;
                  v_documenti integer;
                  v_elenco    jsonb;
                  -- Una coppia chiave/valore di p_campi: nessuna colonna dietro.
                  v_chiave    text;
                  v_valore    jsonb;
                  v_non_nullo boolean;
                  v_tipo_ok   boolean;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Correggere i flag strutturali di un articolo anche se
                  --   usato. Solo SUPER_ADMIN. Ordine: permesso, parametri,
                  --   valori, articolo, righe non ammesse prima, scrittura con
                  --   la porta aperta, righe rese non ammesse.
                  --   Le colonne ammesse: catalogo.fn_articolo_colonne_struttura().
                  -- =========================================================
                  PERFORM script.fn_guard_super_admin(
                      script.fn_utente_di_sessione('catalogo.fn_articolo_correggi_struttura'));

                  IF p_campi IS NULL OR jsonb_typeof(p_campi) <> 'object' OR p_campi = '{}'::jsonb THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'valore', p_campi),
                          NULL::uuid,
                          'p_campi: un oggetto con almeno una colonna');
                  END IF;

                  SELECT string_agg(k, ', ' ORDER BY k)
                    INTO v_estranee
                    FROM jsonb_object_keys(p_campi) k
                   WHERE k <> ALL (catalogo.fn_articolo_colonne_struttura());
                  IF v_estranee IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'non_ammesse', v_estranee),
                          NULL::uuid,
                          'p_campi: colonne non correggibili da qui: ' || v_estranee);
                  END IF;

                  -- I valori, prima di scrivere: vuoto su una colonna NOT NULL, o
                  -- di un tipo che la colonna non accetta (la stessa conversione
                  -- della scrittura, su quella sola colonna).
                  FOR v_chiave, v_valore IN SELECT e.key, e.value FROM jsonb_each(p_campi) e ORDER BY e.key LOOP
                      SELECT a.attnotnull INTO v_non_nullo
                        FROM pg_catalog.pg_attribute a
                       WHERE a.attrelid = 'catalogo.articoli'::regclass
                         AND a.attname  = v_chiave;

                      IF jsonb_typeof(v_valore) = 'null' AND v_non_nullo THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                              jsonb_build_object('parametro', 'p_campi', 'campo', v_chiave, 'valore', v_valore),
                              NULL::uuid,
                              format('«%s» non può restare vuoto', catalogo.fn_articolo_flag_etichetta(v_chiave)));
                      END IF;

                      v_tipo_ok := true;
                      BEGIN
                          PERFORM jsonb_populate_record(NULL::catalogo.articoli,
                                                        jsonb_build_object(v_chiave, v_valore));
                      EXCEPTION WHEN data_exception THEN
                          v_tipo_ok := false;
                      END;
                      IF NOT v_tipo_ok THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                              jsonb_build_object('parametro', 'p_campi', 'campo', v_chiave, 'valore', v_valore),
                              NULL::uuid,
                              format('il valore di «%s» non è valido', catalogo.fn_articolo_flag_etichetta(v_chiave)));
                      END IF;
                  END LOOP;

                  SELECT a.codice INTO v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id
                     FOR UPDATE;
                  IF p_articolo_id IS NULL OR v_codice IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_ARTICOLO_NOT_FOUND',
                          jsonb_build_object('articolo_id', p_articolo_id),
                          NULL::uuid,
                          COALESCE(p_articolo_id::text, '<null>'));
                  END IF;

                  -- Le righe vive gia' non ammesse PRIMA: non sono della correzione.
                  SELECT array_agg(n.documento || ':' || n.riga_id)
                    INTO v_prima
                    FROM catalogo.fn_articolo_righe_vive_non_ammesse(p_articolo_id) n;

                  -- Solo le colonne passate (gia' controllate qui sopra), ciascuna col
                  -- tipo della sua colonna: jsonb_populate_record fa la conversione.
                  SELECT string_agg(format('%1$I = r.%1$I', k), ', ' ORDER BY k)
                    INTO v_set
                    FROM jsonb_object_keys(p_campi) k;

                  PERFORM set_config('zeroerp.articolo_correggi_struttura', p_articolo_id::text, true);

                  EXECUTE format(
                      'UPDATE catalogo.articoli a
                          SET %s
                         FROM jsonb_populate_record(NULL::catalogo.articoli, $1) r
                        WHERE a.id = $2',
                      v_set)
                  USING p_campi, p_articolo_id;

                  PERFORM set_config('zeroerp.articolo_correggi_struttura', '', true);

                  -- Le righe che la correzione RENDE non ammesse: non ammesse dopo,
                  -- ammesse prima.
                  SELECT count(*)::integer,
                         count(DISTINCT (n.documento, n.documento_id))::integer,
                         jsonb_path_query_array(
                             jsonb_agg(jsonb_build_object(
                                           'documento',    n.documento,
                                           'documento_id', n.documento_id,
                                           'riga_id',      n.riga_id,
                                           'codice',       n.motivo ->> 'codice')
                                       ORDER BY n.documento, n.documento_id, n.riga_id),
                             '$[0 to 49]')
                    INTO v_righe, v_documenti, v_elenco
                    FROM catalogo.fn_articolo_righe_vive_non_ammesse(p_articolo_id) n
                   WHERE (n.documento || ':' || n.riga_id) <> ALL (COALESCE(v_prima, '{}'::text[]));

                  IF v_righe > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_ARTICOLO_STRUTTURA_RIGHE_APERTE',
                          jsonb_build_object(
                              'articolo_id', p_articolo_id,
                              'campi',       p_campi,
                              'righe',       v_elenco),
                          NULL::uuid,
                          v_codice,
                          v_righe::text,
                          v_documenti::text);
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_chiudi_legame_distinta(
                  p_legame_id          catalogo.articoli_componenti.id%TYPE,
                  p_valido_al          catalogo.articoli_componenti.valido_al%TYPE,
                  p_prezzi_confermati  integer DEFAULT NULL)
               RETURNS TABLE(
                  legame_id        catalogo.articoli_componenti.id%TYPE,
                  valido_al_prima  catalogo.articoli_componenti.valido_al%TYPE,
                  valido_al_dopo   catalogo.articoli_componenti.valido_al%TYPE,
                  prezzi_chiusi    integer,
                  prezzi_tolti     integer)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              DECLARE
                  v_utente     config.user_override_azioni.auth_user_id%TYPE;
                  v_prima      catalogo.articoli_componenti.valido_al%TYPE;
                  v_prodotto   catalogo.articoli_componenti.prodotto_id%TYPE;
                  v_kit        catalogo.articoli.codice%TYPE;
                  v_componente catalogo.articoli.codice%TYPE;
                  -- Conteggi di righe: nessuna colonna dietro.
                  v_prezzi     integer;
                  v_versioni   integer;
                  v_chiusi     integer := 0;
                  v_tolti      integer := 0;
              BEGIN
                  -- =========================================================
                  -- Scopo: chiudere il legame p_legame_id alla data p_valido_al
                  --   insieme ai suoi prezzi bundle che vanno oltre, col permesso
                  --   e la conferma. p_prezzi_confermati e' un CONTEGGIO: tipo
                  --   nudo. Vedi l'intestazione del changeSet.
                  -- Ritorna: il legame, la fine di prima e di adesso, i prezzi
                  --   chiusi e quelli tolti.
                  -- =========================================================
                  v_utente := script.fn_utente_di_sessione('catalogo.fn_chiudi_legame_distinta');

                  -- 1. Parametri e permesso sul catalogo.
                  IF p_legame_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_chiudi_legame_distinta', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_legame_id'),
                          NULL::uuid,
                          'il legame di distinta da chiudere');
                  END IF;
                  IF p_valido_al IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_chiudi_legame_distinta', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_valido_al', 'campo', 'valido_al'),
                          NULL::uuid,
                          'la data di fine del legame');
                  END IF;

                  PERFORM script.fn_guard_livello(v_utente, 'catalogo', 'articolo', 'TUTTO');

                  -- 2. Il legame e i suoi prezzi, fermi fino alla fine.
                  SELECT ac.valido_al, ac.prodotto_id
                    INTO v_prima, v_prodotto
                    FROM catalogo.articoli_componenti ac
                   WHERE ac.id = p_legame_id
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_chiudi_legame_distinta', 'E_BOM_LEGAME_NOT_FOUND',
                          jsonb_build_object('legame_id', p_legame_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  PERFORM 1
                     FROM vendite.listini_righe_componenti lrc
                    WHERE lrc.articolo_componente_id = p_legame_id
                      FOR UPDATE;

                  -- 3. Prima cio' che vieta.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'catalogo', 'catalogo.fn_chiudi_legame_distinta',
                      script.fn_check_legame_distinta_chiudibile(p_legame_id, p_valido_al),
                      'valido_al',
                      NULL::uuid,
                      jsonb_build_object('legame_id', p_legame_id));

                  -- 4. I prezzi da chiudere o togliere: permesso sui listini e conferma.
                  SELECT count(*)::integer,
                         count(DISTINCT r.listino_versione_id)::integer
                    INTO v_prezzi, v_versioni
                    FROM vendite.fn_prezzi_legame_oltre_la_fine(p_legame_id, p_valido_al) r
                   WHERE r.esito IN ('CHIUDE', 'TOGLIE');

                  IF v_prezzi > 0 THEN
                      PERFORM script.fn_guard_livello(v_utente, 'vendite', 'listino', 'TUTTO');

                      IF p_prezzi_confermati IS DISTINCT FROM v_prezzi THEN
                          SELECT p.codice, c.codice
                            INTO v_kit, v_componente
                            FROM catalogo.articoli_componenti ac
                            JOIN catalogo.articoli p ON p.id = ac.prodotto_id
                            JOIN catalogo.articoli c ON c.id = ac.componente_id
                           WHERE ac.id = p_legame_id;

                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', 'catalogo.fn_chiudi_legame_distinta', 'E_BOM_CHIUSURA_CON_PREZZI',
                              jsonb_build_object(
                                  'campo',              'valido_al',
                                  'legame_id',          p_legame_id,
                                  'valido_al',          p_valido_al,
                                  'prezzi',             v_prezzi,
                                  'versioni',           v_versioni,
                                  'prezzi_confermati',  p_prezzi_confermati,
                                  'bersaglio', jsonb_build_array(
                                      jsonb_build_object('tipo', 'ARTICOLO', 'id', v_prodotto::text))),
                              NULL::uuid,
                              v_componente,
                              v_kit,
                              v_prezzi::text,
                              v_versioni::text);
                      END IF;

                      -- 5. I prezzi, con la porta aperta per questo legame.
                      PERFORM set_config('zeroerp.legame_distinta_chiudi', p_legame_id::text, true);

                      UPDATE vendite.listini_righe_componenti lrc
                         SET valido_al = p_valido_al
                       WHERE lrc.id IN (SELECT r.riga_id
                                          FROM vendite.fn_prezzi_legame_oltre_la_fine(p_legame_id, p_valido_al) r
                                         WHERE r.esito = 'CHIUDE');
                      GET DIAGNOSTICS v_chiusi = ROW_COUNT;

                      DELETE FROM vendite.listini_righe_componenti lrc
                       WHERE lrc.id IN (SELECT r.riga_id
                                          FROM vendite.fn_prezzi_legame_oltre_la_fine(p_legame_id, p_valido_al) r
                                         WHERE r.esito = 'TOGLIE');
                      GET DIAGNOSTICS v_tolti = ROW_COUNT;

                      PERFORM set_config('zeroerp.legame_distinta_chiudi', '', true);
                  END IF;

                  -- 6. Il legame. I guard della distinta parlano come sempre.
                  UPDATE catalogo.articoli_componenti ac
                     SET valido_al = p_valido_al
                   WHERE ac.id = p_legame_id;

                  RETURN QUERY SELECT p_legame_id, v_prima, p_valido_al, v_chiusi, v_tolti;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_articolo_correggi_struttura(
                   p_articolo_id catalogo.articoli.id%TYPE,
                   p_campi       jsonb)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_codice    catalogo.articoli.codice%TYPE;
                  v_estranee  text;
                  v_set       text;
                  v_prima     text[];
                  v_righe     integer;
                  v_documenti integer;
                  v_elenco    jsonb;
                  -- Una coppia chiave/valore di p_campi: nessuna colonna dietro.
                  v_chiave    text;
                  v_valore    jsonb;
                  v_non_nullo boolean;
                  v_tipo_ok   boolean;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Correggere i flag strutturali di un articolo anche se
                  --   usato. Solo SUPER_ADMIN. Ordine: permesso, parametri,
                  --   valori, articolo, righe non ammesse prima, scrittura con
                  --   la porta aperta, righe rese non ammesse.
                  --   Le colonne ammesse: catalogo.fn_articolo_colonne_struttura().
                  -- =========================================================
                  PERFORM script.fn_guard_super_admin(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer);

                  IF p_campi IS NULL OR jsonb_typeof(p_campi) <> 'object' OR p_campi = '{}'::jsonb THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'valore', p_campi),
                          NULL::uuid,
                          'p_campi: un oggetto con almeno una colonna');
                  END IF;

                  SELECT string_agg(k, ', ' ORDER BY k)
                    INTO v_estranee
                    FROM jsonb_object_keys(p_campi) k
                   WHERE k <> ALL (catalogo.fn_articolo_colonne_struttura());
                  IF v_estranee IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_campi', 'non_ammesse', v_estranee),
                          NULL::uuid,
                          'p_campi: colonne non correggibili da qui: ' || v_estranee);
                  END IF;

                  -- I valori, prima di scrivere: vuoto su una colonna NOT NULL, o
                  -- di un tipo che la colonna non accetta (la stessa conversione
                  -- della scrittura, su quella sola colonna).
                  FOR v_chiave, v_valore IN SELECT e.key, e.value FROM jsonb_each(p_campi) e ORDER BY e.key LOOP
                      SELECT a.attnotnull INTO v_non_nullo
                        FROM pg_catalog.pg_attribute a
                       WHERE a.attrelid = 'catalogo.articoli'::regclass
                         AND a.attname  = v_chiave;

                      IF jsonb_typeof(v_valore) = 'null' AND v_non_nullo THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                              jsonb_build_object('parametro', 'p_campi', 'campo', v_chiave, 'valore', v_valore),
                              NULL::uuid,
                              format('«%s» non può restare vuoto', catalogo.fn_articolo_flag_etichetta(v_chiave)));
                      END IF;

                      v_tipo_ok := true;
                      BEGIN
                          PERFORM jsonb_populate_record(NULL::catalogo.articoli,
                                                        jsonb_build_object(v_chiave, v_valore));
                      EXCEPTION WHEN data_exception THEN
                          v_tipo_ok := false;
                      END;
                      IF NOT v_tipo_ok THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_PARAMETRO_INVALIDO',
                              jsonb_build_object('parametro', 'p_campi', 'campo', v_chiave, 'valore', v_valore),
                              NULL::uuid,
                              format('il valore di «%s» non è valido', catalogo.fn_articolo_flag_etichetta(v_chiave)));
                      END IF;
                  END LOOP;

                  SELECT a.codice INTO v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id
                     FOR UPDATE;
                  IF p_articolo_id IS NULL OR v_codice IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', 'catalogo.fn_articolo_correggi_struttura', 'E_ARTICOLO_NOT_FOUND',
                          jsonb_build_object('articolo_id', p_articolo_id),
