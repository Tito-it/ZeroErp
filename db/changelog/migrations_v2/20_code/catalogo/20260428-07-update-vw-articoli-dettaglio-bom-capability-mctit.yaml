# Estende catalogo.vw_articoli_dettaglio con 2 colonne calcolate
# di "capability" per il pannello BoM del FE (Fase 6 BE 28-04-2026).
#
# Campi aggiunti (in coda, naming italiano coerente con Fase 2):
#   puo_gestire_bom         BOOLEAN  = is_composito AND NOT is_solo_componente
#       true  -> l'articolo puo' avere componenti gestibili (panel BoM
#                accessibile dal FE)
#       false -> il pannello BoM e' nascosto/disabilitato
#
#   motivo_non_gestibile_bom TEXT
#       NULL                       quando puo_gestire_bom = true
#       'ARTICOLO_SOLO_COMPONENTE' (priorita' sopra) quando is_solo_componente
#       'ARTICOLO_NON_COMPOSITO'   altrimenti (NOT is_composito)
#
# Edge case is_composito=false AND is_solo_componente=true:
#   prevale 'ARTICOLO_SOLO_COMPONENTE' (semantica piu' specifica:
#   "questo articolo e' solo componente, non ha senso gestire la sua BoM").
#
# Aggiunta in coda -> CREATE OR REPLACE VIEW e' sufficiente
# (PG ammette aggiunte in coda senza DROP).
#
# Consumer attuali (verificati 28-04-2026):
#   - apps/catalogo/db/catalogo_repository.py (projection esplicita)
#   - apps/vendite/db/listini_repository.py (LEFT JOIN su colonne specifiche)
#   - nessuna fn DB / vista DB / SELECT * downstream
# Aggiungere colonne in coda e' SAFE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260428-07-update-vw-articoli-dettaglio-bom-capability-mctit.yaml

  - changeSet:
      id: 20260428-07-update-vw-articoli-dettaglio-bom-capability
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Estende vw_articoli_dettaglio con puo_gestire_bom +
        motivo_non_gestibile_bom (Fase 6 BE 28-04-2026, capability
        di riga per panel BoM FE).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: catalogo
                viewName: vw_articoli_dettaglio
            - columnExists:
                schemaName: catalogo
                tableName: articoli
                columnName: is_composito
            - columnExists:
                schemaName: catalogo
                tableName: articoli
                columnName: is_solo_componente
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW catalogo.vw_articoli_dettaglio AS
              SELECT a.id,
                  a.codice,
                  a.descrizione,
                  a.descrizione_breve,
                  a.uom_id,
                  a.tipo_voce_id,
                  a.gruppo_voce_id,
                  a.spesa_id,
                  a.iva_id,
                  a.conto_contabile_vendita_id,
                  a.conto_contabile_acquisto_id,
                  a.is_composito,
                  a.is_solo_componente,
                  a.requires_serial,
                  a.listino_tipologia_id,
                  a.meta,
                  a.user_insert,
                  a.user_update,
                  a.data_insert,
                  a.data_update,
                  a.tx_id,
                  a.storicizza,
                  a.attivo,
                  a.note_target_tipo,
                  a.note_id,
                  u.id          AS uom_ref_id,
                  u.codice      AS uom_codice,
                  u.descrizione AS uom_descrizione,
                  t.id          AS tipologia_ref_id,
                  t.codice      AS tipologia_codice,
                  t.descrizione AS tipologia_descrizione,
                  g.id          AS gruppo_ref_id,
                  g.codice      AS gruppo_codice,
                  g.descrizione AS gruppo_descrizione,
                  s.id          AS spesa_ref_id,
                  s.codice      AS spesa_codice,
                  s.descrizione AS spesa_descrizione,
                  i.id          AS iva_ref_id,
                  i.codice      AS iva_codice,
                  i.descrizione AS iva_descrizione,
                  i.aliquota_iva AS iva_aliquota_iva,
                  lt.codice      AS tipologia_listino_codice,
                  lt.descrizione AS tipologia_listino_descrizione,
                  -- Capability BoM (Fase 6, 28-04-2026)
                  (a.is_composito AND NOT a.is_solo_componente) AS puo_gestire_bom,
                  CASE
                      WHEN a.is_composito AND NOT a.is_solo_componente THEN NULL
                      WHEN a.is_solo_componente                        THEN 'ARTICOLO_SOLO_COMPONENTE'
                      ELSE 'ARTICOLO_NON_COMPOSITO'
                  END                                           AS motivo_non_gestibile_bom
              FROM catalogo.articoli a
                  LEFT JOIN catalogo.unita_misura u      ON u.id  = a.uom_id
                  LEFT JOIN vendite.articoli_tipologie t ON t.id  = a.tipo_voce_id
                  LEFT JOIN vendite.articoli_gruppi g    ON g.id  = a.gruppo_voce_id
                  LEFT JOIN vendite.articoli_spesa s     ON s.id  = a.spesa_id
                  LEFT JOIN config.iva i                 ON i.id  = a.iva_id
                  LEFT JOIN config.listini_tipologie lt  ON lt.id = a.listino_tipologia_id;

              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS
                  'Dettaglio articolo con UoM, tipologia, gruppo, spesa, IVA e '
                  'tipologia listino v5 denormalizzati + capability BoM '
                  '(puo_gestire_bom, motivo_non_gestibile_bom) per il pannello FE.';
