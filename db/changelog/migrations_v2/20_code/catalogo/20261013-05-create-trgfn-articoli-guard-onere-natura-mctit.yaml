# NUOVO: catalogo.trgfn_articoli_guard_onere_natura()
#   Un articolo-onere non e' merce: la sua natura non va in ordine.
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-9, §9.1)
#
# -- IL CASO ------------------------------------------------------------
#   L'articolo-onere (causale_onere_id valorizzato, 1:1 con la causale) e' un
#   addebito: la porta degli oneri lo scrive in commessa come riga di puro
#   valore (vendite.fn_aggiungi_onere_commessa). Ma natura_vendita_id ha
#   DEFAULT 1, cioe' MERCE: un onere creato senza dire la natura risultava un
#   bene fisico, da evadere in ordine e in bolla (D-1, D-2), e con
#   e_cessione_beni = true anche per il fisco. Nessun vincolo lo impediva.
#   Il seed degli oneri (80_data/sql/catalogo/articoli_onere.csv) usa la
#   natura 2 (servizio una tantum, destinazione COMMESSA): passa.
#
# -- LA FORMA ------------------------------------------------------------
#   «Non e' merce» si legge dal vocabolario, non dal codice della natura:
#   la natura dell'onere non ha destinazione_tipo = 'ORDINE'. E' la stessa
#   lettura delle viste di smistamento e dei guard di riga (brief §8.2): se
#   una natura cambia destinazione, la regola la segue.
#   BEFORE INSERT OR UPDATE OF natura_vendita_id, causale_onere_id
#   (montaggio: 20261013-06): nessun trigger BEFORE di catalogo.articoli scrive
#   le due colonne, quindi UPDATE OF e' la forma giusta; il corpo confronta
#   OLD e NEW, cosi' un UPDATE che riscrive gli stessi valori (il loader del
#   seed) non rigiudica.
#   ⚠️ Un cambio di destinazione_tipo in config.nature_vendita non si giudica
#   qui: e' una modifica del vocabolario, non dell'articolo (brief §9.1).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261013-05-create-trgfn-articoli-guard-onere-natura-mctit.yaml

  - changeSet:
      id: 20261013-05-create-trgfn-articoli-guard-onere-natura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuovo guard catalogo.trgfn_articoli_guard_onere_natura: un articolo-onere non ha una natura
        che va in ordine (E_ARTICOLO_ONERE_NATURA_MERCE). Brief:
        brief-db-articoli-ammessi-per-documento (§8.6 A-9).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_guard_onere_natura()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_destinazione  config.nature_vendita.destinazione_tipo%TYPE;
                  v_natura        config.nature_vendita.descrizione%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Un articolo-onere (causale_onere_id valorizzato) non e'
                  --   merce: la sua natura non ha destinazione ORDINE.
                  --   BEFORE INSERT OR UPDATE OF natura_vendita_id, causale_onere_id
                  --   su catalogo.articoli. Un UPDATE che non cambia nessuna
                  --   delle due colonne non si rigiudica.
                  -- =========================================================
                  IF NEW.causale_onere_id IS NULL THEN
                      RETURN NEW;
                  END IF;
                  IF TG_OP = 'UPDATE'
                     AND NEW.natura_vendita_id IS NOT DISTINCT FROM OLD.natura_vendita_id
                     AND NEW.causale_onere_id  IS NOT DISTINCT FROM OLD.causale_onere_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT nv.destinazione_tipo, COALESCE(nv.descrizione, nv.codice)
                    INTO v_destinazione, v_natura
                    FROM config.nature_vendita nv
                   WHERE nv.id = NEW.natura_vendita_id;

                  -- Natura assente: parla la FK.
                  IF v_destinazione = 'ORDINE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', TG_NAME::text, 'E_ARTICOLO_ONERE_NATURA_MERCE',
                          jsonb_build_object(
                              'campo',             'natura_vendita_id',
                              'articolo_id',       NEW.id,
                              'causale_onere_id',  NEW.causale_onere_id,
                              'natura_vendita_id', NEW.natura_vendita_id,
                              'destinazione_tipo', v_destinazione),
                          NEW.tx_id,
                          NEW.codice,
                          v_natura);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_guard_onere_natura()
              IS 'Guard BEFORE INSERT OR UPDATE OF natura_vendita_id, causale_onere_id su catalogo.articoli: un articolo-onere (causale_onere_id valorizzato) non e'' merce, la sua natura non ha destinazione_tipo ORDINE (E_ARTICOLO_ONERE_NATURA_MERCE, campo natura_vendita_id). Senza, un onere creato senza dire la natura prendeva il DEFAULT (MERCE): un addebito trattato come bene da evadere in ordine e in bolla, e come cessione di beni. La regola legge la destinazione dal vocabolario (config.nature_vendita), come le viste di smistamento: segue la natura se cambia destinazione. Un UPDATE che non cambia le due colonne non rigiudica. Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-9).';
