# Liquibase changelog per Zero ERP
# Trigger: blocca uso di articoli "solo componente" come prodotto
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260114-14-create-trgfn-articoli-componenti-guard-solo-componente-mctit.yaml

  - changeSet:
      id: 20260114-14-create-trgfn-articoli-componenti-guard-solo-componente
      author: mctit
      comment: >
        Impedisce che un articolo marcato is_solo_componente sia usato come prodotto
        in catalogo.articoli_componenti.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_guard_solo_componente()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_prodotto_id catalogo.articoli.id%TYPE;
                v_is_solo_componente catalogo.articoli.is_solo_componente%TYPE;
              BEGIN
                IF NOT (TG_OP = 'INSERT' OR TG_OP = 'UPDATE') THEN
                  RETURN NEW;
                END IF;

                v_prodotto_id := NEW.prodotto_id;

                IF v_prodotto_id IS NULL THEN
                  RETURN NEW;
                END IF;

                SELECT a.is_solo_componente
                  INTO v_is_solo_componente
                FROM catalogo.articoli a
                WHERE a.id = v_prodotto_id;

                IF COALESCE(v_is_solo_componente, false) IS TRUE THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_ARTICOLO_SOLO_COMPONENTE',
                    jsonb_build_object(
                      'prodotto_id', v_prodotto_id,
                      'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_guard_solo_componente()
                IS 'Blocca articoli marcati is_solo_componente come prodotto in distinta base.';

              DROP TRIGGER IF EXISTS trg_articoli_componenti_a10_block_solo_componente_ins_upd
                ON catalogo.articoli_componenti;

              CREATE TRIGGER trg_articoli_componenti_a10_block_solo_componente_ins_upd
                BEFORE INSERT OR UPDATE OF prodotto_id
                ON catalogo.articoli_componenti
                FOR EACH ROW
                EXECUTE FUNCTION catalogo.trgfn_articoli_componenti_guard_solo_componente();
