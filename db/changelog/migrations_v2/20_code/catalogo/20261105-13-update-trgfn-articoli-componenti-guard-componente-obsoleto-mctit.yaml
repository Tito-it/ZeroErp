# LA DISTINTA NON PRENDE UN COMPONENTE RITIRATO
#   catalogo.trgfn_articoli_componenti_guard_componente
#   Brief: brief-db-articoli-obsoleto-dal O-4 (Tid, 2026-11-04).
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   La chiamata alla check passa p_scelta_nuova = true (20261105-10): il guard
#   arriva li' solo per un legame nuovo, cambiato o riattivato, e ognuno e' una
#   composizione nuova (O-4, senza esenzione). Il componente ritirato esce con
#   E_ARTICOLO_OBSOLETO, campo componente_id. SECURITY INVOKER esplicito.
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   Le uscite anticipate (legame spento, UPDATE senza cambi) e gli altri
#   motivi. Il prodotto ritirato non e' un motivo: la sua distinta si mantiene
#   (§5.3). Corpo dal vivo (pg_get_functiondef, = 20261013-60). Trigger:
#   nessuna firma da ancorare.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261105-13-update-trgfn-articoli-componenti-guard-componente-obsoleto-mctit.yaml

  - changeSet:
      id: 20261105-13-update-trgfn-articoli-componenti-guard-componente-obsoleto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.trgfn_articoli_componenti_guard_componente: giudica il legame come scelta nuova, cosi' un
        componente ritirato e' respinto (E_ARTICOLO_OBSOLETO, O-4). brief-db-articoli-obsoleto-dal.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_guard_componente()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_motivi jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare un componente che la distinta non ammette: solleva
                  --   il primo motivo di script.fn_check_articolo_riga
                  --   (documento ARTICOLO, padre = prodotto_id). BEFORE INSERT OR
                  --   UPDATE OF componente_id, prodotto_id, attivo.
                  -- =========================================================
                  IF NOT COALESCE(NEW.attivo, FALSE) THEN
                      RETURN NEW;
                  END IF;

                  IF TG_OP = 'UPDATE'
                     AND COALESCE(OLD.attivo, FALSE)
                     AND NEW.componente_id IS NOT DISTINCT FROM OLD.componente_id
                     AND NEW.prodotto_id   IS NOT DISTINCT FROM OLD.prodotto_id THEN
                      RETURN NEW;
                  END IF;

                  -- p_scelta_nuova = true: qui arriva solo un legame nuovo, cambiato
                  -- o riattivato, cioe' una composizione nuova (O-4): il componente
                  -- ritirato e' un motivo (brief-db-articoli-obsoleto-dal).
                  v_motivi := script.fn_check_articolo_riga(
                      'ARTICOLO', NULL, NEW.componente_id, NULL, NULL, NEW.prodotto_id, true);

                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'catalogo', TG_NAME::text,
                      v_motivi,
                      COALESCE(v_motivi -> 0 -> 'dettaglio' ->> 'campo', 'componente_id'),
                      NEW.tx_id,
                      jsonb_build_object('legame_id', NEW.id, 'prodotto_id', NEW.prodotto_id));
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_guard_componente() IS
                'Guard BEFORE INSERT OR UPDATE OF componente_id, prodotto_id, attivo su catalogo.articoli_componenti (Lotto 3c di brief-db-articoli-ammessi-per-documento, 2026-10-13): solleva il primo motivo di script.fn_check_articolo_riga per il componente (documento ARTICOLO, padre = prodotto_id): componente uguale al padre (E_BOM_COMPONENTE_PADRE), composito (E_BOM_COMPONENTE_COMPOSITO, D-4), IVA diversa dal padre (E_BOM_IVA_DISCORDANTE). Giudica un legame attivo quando nasce, quando si attiva e quando cambia componente o padre; un legame spento no. Guard suo perche'' qui articolo e padre sono componente_id e prodotto_id (uuid), non articolo_id e un id di documento; la regola resta una, nella check. Sostituisce catalogo.trgfn_articoli_componenti_guard_un_livello e catalogo.trgfn_articoli_componenti_guard_iva (ritirati da 20261013-61). ⭐ rev 2026-11-05 (20261105-13, brief-db-articoli-obsoleto-dal O-4): il guard arriva alla check solo per un legame nuovo, cambiato o riattivato, che e'' sempre una composizione nuova: passa p_scelta_nuova = true, e un componente ritirato (script.fn_e_obsoleto) e'' respinto con E_ARTICOLO_OBSOLETO, campo componente_id. Le righe-componente dei documenti espanse da una distinta esistente sono derivate e non passano di qui. Il prodotto ritirato non conta: la sua distinta si continua a mantenere.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_guard_componente()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_motivi jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare un componente che la distinta non ammette: solleva
                  --   il primo motivo di script.fn_check_articolo_riga
                  --   (documento ARTICOLO, padre = prodotto_id). BEFORE INSERT OR
                  --   UPDATE OF componente_id, prodotto_id, attivo.
                  -- =========================================================
                  IF NOT COALESCE(NEW.attivo, FALSE) THEN
                      RETURN NEW;
                  END IF;

                  IF TG_OP = 'UPDATE'
                     AND COALESCE(OLD.attivo, FALSE)
                     AND NEW.componente_id IS NOT DISTINCT FROM OLD.componente_id
                     AND NEW.prodotto_id   IS NOT DISTINCT FROM OLD.prodotto_id THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_articolo_riga(
                      'ARTICOLO', NULL, NEW.componente_id, NULL, NULL, NEW.prodotto_id);

                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'catalogo', TG_NAME::text,
                      v_motivi,
                      COALESCE(v_motivi -> 0 -> 'dettaglio' ->> 'campo', 'componente_id'),
                      NEW.tx_id,
                      jsonb_build_object('legame_id', NEW.id, 'prodotto_id', NEW.prodotto_id));
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_guard_componente() IS
                'Guard BEFORE INSERT OR UPDATE OF componente_id, prodotto_id, attivo su catalogo.articoli_componenti (Lotto 3c di brief-db-articoli-ammessi-per-documento, 2026-10-13): solleva il primo motivo di script.fn_check_articolo_riga per il componente (documento ARTICOLO, padre = prodotto_id): componente uguale al padre (E_BOM_COMPONENTE_PADRE), composito (E_BOM_COMPONENTE_COMPOSITO, D-4), IVA diversa dal padre (E_BOM_IVA_DISCORDANTE). Giudica un legame attivo quando nasce, quando si attiva e quando cambia componente o padre; un legame spento no. Guard suo perche'' qui articolo e padre sono componente_id e prodotto_id (uuid), non articolo_id e un id di documento; la regola resta una, nella check. Sostituisce catalogo.trgfn_articoli_componenti_guard_un_livello e catalogo.trgfn_articoli_componenti_guard_iva (ritirati da 20261013-61).';

