# Liquibase changelog per Zero ERP
# Trigger REQUIRE attivo su prodotto_id
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260115-01-create-trg-articoli-componenti-require-attivo-prodotto-mctit.yaml

  - changeSet:
      id: 20260115-01-create-trg-articoli-componenti-require-attivo-prodotto
      author: mctit
      comment: >
        Richiede che il prodotto (prodotto_id) sia attivo quando si inserisce/aggiorna
        una riga di catalogo.articoli_componenti.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_articoli_componenti_a10_articoli_require_attivo_prodotto_ins_upd
                ON catalogo.articoli_componenti;

              CREATE CONSTRAINT TRIGGER trg_articoli_componenti_a10_articoli_require_attivo_prodotto_ins_upd
                AFTER INSERT OR UPDATE OF prodotto_id
                ON catalogo.articoli_componenti
                DEFERRABLE INITIALLY DEFERRED
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                  'catalogo',
                  'articoli',
                  'attivo',
                  'prodotto_id'
                );

              comment ON TRIGGER trg_articoli_componenti_a10_articoli_require_attivo_prodotto_ins_upd
                ON catalogo.articoli_componenti IS
                'Richiede che il prodotto (prodotto_id) sia attivo quando si inserisce/aggiorna una riga di catalogo.articoli_componenti.';
