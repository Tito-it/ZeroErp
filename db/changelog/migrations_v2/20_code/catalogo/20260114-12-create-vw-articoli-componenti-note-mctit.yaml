# Liquibase changelog per Zero ERP
# View: catalogo.vw_articoli_componenti_note
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260114-12-create-vw-articoli-componenti-note-mctit.yaml

  - changeSet:
      id: 20260114-12-create-vw-articoli-componenti-note
      author: mctit
      comment: >
        Vista note collegate ai componenti articolo con dati anagrafici di stile e lingua.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW catalogo.vw_articoli_componenti_note AS
              SELECT
                ac.id AS articolo_componente_id,
                ac.prodotto_id,
                ap.codice AS prodotto_codice,
                ap.descrizione AS prodotto_descrizione,
                ac.componente_id,
                acmp.codice AS componente_codice,
                acmp.descrizione AS componente_descrizione,
                n.id AS nota_id,
                n.target_tipo AS nota_target_tipo,
                n.target_id AS nota_target_id,
                n.target_riga_id AS nota_target_riga_id,
                n.anchor_tipo AS nota_anchor_tipo,
                n.posizione AS nota_posizione,
                n.seq AS nota_seq,
                n.testo AS nota_testo,
                n.testo_md AS nota_testo_md,
                n.visibile AS nota_visibile,
                n.solo_stampa AS nota_solo_stampa,
                n.meta AS nota_meta,
                n.data_insert AS nota_data_insert,
                n.user_insert AS nota_user_insert,
                n.data_update AS nota_data_update,
                n.user_update AS nota_user_update,
                ns.id AS stile_id,
                ns.codice AS stile_codice,
                ns.descrizione AS stile_descrizione,
                l.id AS lingua_id,
                l.codice_iso AS lingua_codice_iso,
                l.descrizione AS lingua_descrizione,
                l.descrizione_locale AS lingua_descrizione_locale
              FROM catalogo.note_articoli_componenti n
              JOIN catalogo.articoli_componenti ac
                ON ac.id = n.target_id
              LEFT JOIN catalogo.articoli ap
                ON ap.id = ac.prodotto_id
              LEFT JOIN catalogo.articoli acmp
                ON acmp.id = ac.componente_id
              LEFT JOIN config.note_stili ns
                ON ns.id = n.id_stile
              LEFT JOIN config.lingue l
                ON l.id = n.id_lingua;

              COMMENT ON VIEW catalogo.vw_articoli_componenti_note IS
                'Vista note per componenti articolo con dati stile e lingua.';
