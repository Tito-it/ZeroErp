# Liquibase changelog per Zero ERP
# Trigger: blocca prodotto non composito in distinta base
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260115-03-create-trgfn-articoli-componenti-guard-is-composito-mctit.yaml

  - changeSet:
      id: 20260115-03-create-trgfn-articoli-componenti-guard-is-composito
      author: mctit
      comment: >
        Impedisce che un articolo con is_composito = false sia usato come prodotto
        in catalogo.articoli_componenti.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_guard_is_composito()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_prodotto_id catalogo.articoli.id%TYPE;
                v_is_composito catalogo.articoli.is_composito%TYPE;
              BEGIN
                IF NOT (TG_OP = 'INSERT' OR TG_OP = 'UPDATE') THEN
                  RETURN NEW;
                END IF;

                v_prodotto_id := NEW.prodotto_id;

                IF v_prodotto_id IS NULL THEN
                  RETURN NEW;
                END IF;

                SELECT a.is_composito
                  INTO v_is_composito
                FROM catalogo.articoli a
                WHERE a.id = v_prodotto_id;

                IF COALESCE(v_is_composito, false) IS NOT TRUE THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_ARTICOLO_NON_COMPOSITO',
                    jsonb_build_object(
                      'prodotto_id', v_prodotto_id,
                      'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME
                    ),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_guard_is_composito()
                IS 'Blocca articoli non compositi come prodotto in distinta base.';

              DROP TRIGGER IF EXISTS trg_articoli_componenti_a10_guard_is_composito_ins_upd
                ON catalogo.articoli_componenti;

              CREATE TRIGGER trg_articoli_componenti_a10_guard_is_composito_ins_upd
                BEFORE INSERT OR UPDATE OF prodotto_id
                ON catalogo.articoli_componenti
                FOR EACH ROW
                EXECUTE FUNCTION catalogo.trgfn_articoli_componenti_guard_is_composito();

              COMMENT ON TRIGGER trg_articoli_componenti_a10_guard_is_composito_ins_upd
                ON catalogo.articoli_componenti IS
                'Impedisce che un articolo con is_composito = false sia usato come prodotto in catalogo.articoli_componenti.';
