# Estende trgfn_articoli_componenti_guard_iva alla RIATTIVAZIONE del legame.
#
# Motivo (analisi 2026-06-03): l'invariante "BoM attiva => IVA padre = IVA
# figlio" aveva un percorso scoperto. La guardia IVA era solo-INSERT
# (trg_..._guard_iva_bom_ins) e guard B (trgfn_articoli_guard_iva_bom_attiva,
# BEFORE UPDATE OF iva_id) filtra i soli legami con ac.attivo=TRUE. Sequenza
# che produceva un legame attivo incoerente:
#   1. legame coerente attivo (padre 22, figlio 22)
#   2. UPDATE articoli_componenti SET attivo=FALSE  (legame spento)
#   3. UPDATE articoli SET iva_id ...  -> guard B ignora i legami spenti
#   4. UPDATE articoli_componenti SET attivo=TRUE   -> NESSUN ricontrollo IVA
#   => legame attivo con padre != figlio.
# Lo stato veniva intercettato solo a valle dal listino (script Guard 5).
# Spostiamo l'enforcement alla sorgente: la guardia ricontrolla l'IVA anche
# quando il legame (ri)diventa attivo. Il binding del trigger e' aggiornato a
# INSERT OR UPDATE OF attivo nel file 20260603-02.
#
# Versione precedente: 20260513-33.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20260603-01-update-trgfn-articoli-componenti-guard-iva-reactivation-mctit.yaml

  - changeSet:
      id: 20260603-01-update-trgfn-articoli-componenti-guard-iva-reactivation
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Estende trgfn_articoli_componenti_guard_iva alla riattivazione: il
        confronto IVA padre=figlio si applica su INSERT e ogni volta che il
        legame resta/diventa attivo (NEW.attivo=TRUE), chiudendo il percorso
        spegni->cambia IVA->riaccendi che aggirava guard B. Se il legame e'
        spento (NEW.attivo=FALSE) la guardia non interviene. Supera 20260513-33.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: catalogo
              tableName: articoli_componenti
          - tableExists:
              schemaName: config
              tableName: iva
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_guard_iva()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE INSERT OR UPDATE OF attivo su articoli_componenti —
              --   verifica che iva_id del componente coincida con iva_id del padre
              --   composito. NULL = NULL = coerente. Si applica su INSERT e ogni volta
              --   che il legame resta/diventa attivo: la riattivazione (attivo FALSE->TRUE)
              --   e' il percorso che poteva introdurre incoerenza aggirando guard B.
              --   Messaggio parlante: mostra aliquota % invece dell''id numerico interno.
              DECLARE
                  v_iva_padre      catalogo.articoli.iva_id%TYPE;
                  v_iva_figlio     catalogo.articoli.iva_id%TYPE;
                  v_codice_padre   catalogo.articoli.codice%TYPE;
                  v_codice_figlio  catalogo.articoli.codice%TYPE;
                  v_iva_padre_pct  text;
                  v_iva_figlio_pct text;
              BEGIN
                  -- Il guard vale solo per un legame attivo. Su INSERT attivo default TRUE;
                  -- su UPDATE OF attivo intercetta la riaccensione (FALSE->TRUE) e ignora la
                  -- deattivazione (un legame spento non e' parte della BoM attiva).
                  IF NOT COALESCE(NEW.attivo, FALSE) THEN
                      RETURN NEW;
                  END IF;

                  -- Legge iva_id, codice e aliquota % di padre e figlio in unica query
                  SELECT a_padre.iva_id,  a_padre.codice,
                         COALESCE(iva_p.aliquota_iva::text, '—'),
                         a_figlio.iva_id, a_figlio.codice,
                         COALESCE(iva_f.aliquota_iva::text, '—')
                    INTO v_iva_padre,  v_codice_padre,  v_iva_padre_pct,
                         v_iva_figlio, v_codice_figlio, v_iva_figlio_pct
                    FROM catalogo.articoli a_padre
                    JOIN catalogo.articoli a_figlio
                      ON a_figlio.id = NEW.componente_id
                    LEFT JOIN config.iva iva_p ON iva_p.id = a_padre.iva_id
                    LEFT JOIN config.iva iva_f ON iva_f.id = a_figlio.iva_id
                   WHERE a_padre.id = NEW.prodotto_id;

                  -- IVA padre e figlio devono coincidere (IS DISTINCT FROM gestisce NULL)
                  IF v_iva_padre IS DISTINCT FROM v_iva_figlio THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo', TG_NAME, 'E_BOM_IVA_DISCORDANTE',
                          jsonb_build_object(
                              'prodotto_id',    NEW.prodotto_id,
                              'componente_id',  NEW.componente_id,
                              'iva_padre_id',   v_iva_padre,
                              'iva_figlio_id',  v_iva_figlio,
                              'iva_padre_pct',  v_iva_padre_pct,
                              'iva_figlio_pct', v_iva_figlio_pct
                          ),
                          NULL::uuid,
                          v_codice_padre,
                          v_iva_padre_pct,
                          v_codice_figlio,
                          v_iva_figlio_pct
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.trgfn_articoli_componenti_guard_iva() IS
                  'Trigger BEFORE INSERT OR UPDATE OF attivo su articoli_componenti: verifica '
                  'iva_id figlio = iva_id padre composito quando il legame e'' attivo. '
                  'NULL = NULL = coerente. Copre INSERT e riattivazione (attivo FALSE->TRUE), '
                  'percorso che aggirava guard B (filtra ac.attivo=TRUE). '
                  'Messaggio mostra aliquota % (non id numerico). '
                  'Raise E_BOM_IVA_DISCORDANTE (445). rev 2026-06-03.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS catalogo.trgfn_articoli_componenti_guard_iva();
