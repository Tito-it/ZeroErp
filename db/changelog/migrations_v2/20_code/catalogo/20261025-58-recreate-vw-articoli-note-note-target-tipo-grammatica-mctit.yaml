# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — lotto 3 (le note): catalogo.vw_articoli_note torna.
#   Brief: brief-db-grammatica-unica-documenti §14 (Tid, 2026-10-25: ok alle proposte, via).
#
#   Tolta in 00_schema (20261025-57) perche' nota_target_tipo legge una colonna che cambia
#   tipo e valore: nota_target_tipo vale ARTICOLO (era ARTICOLI) e diventa varchar(50), dalla partizione.
#   Torna IDENTICA: definizione e COMMENT dal catalogo vivo di dbdev (2026-10-25), con la sola nota
#   di revisione in coda al COMMENT. Senza security_invoker, com'era (reloptions vuote: catalogo non
#   ha RLS). GRANT ripetuto: si azzera con la vista. Nessun'altra vista o funzione dipende da lei.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261025-58-recreate-vw-articoli-note-note-target-tipo-grammatica-mctit.yaml

  - changeSet:
      id: 20261025-58-recreate-vw-articoli-note-note-target-tipo-grammatica
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.vw_articoli_note torna identica dopo la ricostruzione di catalogo.note e la conversione di
        note_target_tipo (20261025-57). Grammatica unica, lotto 3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW catalogo.vw_articoli_note AS
               SELECT a.id AS articolo_id,
                  a.codice AS articolo_codice,
                  a.descrizione AS articolo_descrizione,
                  n.id AS nota_id,
                  n.target_tipo AS nota_target_tipo,
                  n.target_id AS nota_target_id,
                  n.target_riga_id AS nota_target_riga_id,
                  n.anchor_tipo AS nota_anchor_tipo,
                  n.posizione AS nota_posizione,
                  n.seq AS nota_seq,
                  n.testo AS nota_testo,
                  n.testo_md AS nota_testo_md,
                  n.visibile AS nota_visibile,
                  n.solo_stampa AS nota_solo_stampa,
                  n.meta AS nota_meta,
                  n.data_insert AS nota_data_insert,
                  n.user_insert AS nota_user_insert,
                  n.data_update AS nota_data_update,
                  n.user_update AS nota_user_update,
                  ns.id AS stile_id,
                  ns.codice AS stile_codice,
                  ns.descrizione AS stile_descrizione,
                  l.id AS lingua_id,
                  l.codice_iso AS lingua_codice_iso,
                  l.descrizione AS lingua_descrizione,
                  l.descrizione_locale AS lingua_descrizione_locale
                 FROM catalogo.note_articoli n
                   JOIN catalogo.articoli a ON a.id = n.target_id
                   LEFT JOIN config.note_stili ns ON ns.id = n.id_stile
                   LEFT JOIN config.lingue l ON l.id = n.id_lingua;

              COMMENT ON VIEW catalogo.vw_articoli_note IS
                'Vista note per articoli con dati stile e lingua. Rev 2026-10-25 (20261025-57/-58, brief-db-grammatica-unica-documenti lotto 3, G-7): tolta e rimessa identica perche'' la colonna che legge cambia tipo; nota_target_tipo vale ARTICOLO (era ARTICOLI) e diventa varchar(50), dalla partizione.';

              GRANT SELECT, INSERT, UPDATE, DELETE ON catalogo.vw_articoli_note TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW catalogo.vw_articoli_note;
