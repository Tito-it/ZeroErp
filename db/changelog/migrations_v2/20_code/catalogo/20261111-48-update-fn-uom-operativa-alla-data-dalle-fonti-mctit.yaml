# catalogo.fn_uom_operativa_alla_data: quale mappatura vale a una data la dice
#   catalogo.fn_uom_fonti_conversione (-47), sede unica del predicato.
#
#   Prima la funzione scriveva da se' il filtro (articolo, unita', attiva, validita);
#   lo stesso filtro serve ora anche sui periodi (D25), e sta nelle fonti. Il corpo
#   legge la riga della fonte di priorita' 1 alla data. Firma, risultato e
#   comportamento non cambiano. Rollback: il corpo di prima.
#   Brief: brief-db-revisione-catalogo, giro 2-bis.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261111-48-update-fn-uom-operativa-alla-data-dalle-fonti-mctit.yaml

  - changeSet:
      id: 20261111-48-update-fn-uom-operativa-alla-data-dalle-fonti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.fn_uom_operativa_alla_data legge la mappatura dalle fonti (catalogo.fn_uom_fonti_conversione), sede unica del predicato (D25). Brief: brief-db-revisione-catalogo, giro 2-bis.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.proname = 'fn_uom_fonti_conversione'
                 AND p.pronamespace = 'catalogo'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_uom_operativa_alla_data(p_articolo_id uuid, p_uom_id bigint, p_data date)
               RETURNS TABLE(factor_to_base numeric, qty_step numeric, max_decimals integer, forbid_fraction boolean)
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
                  SELECT o.factor_to_base,
                         o.qty_step,
                         o.max_decimals,
                         o.forbid_fraction
                    FROM catalogo.fn_uom_fonti_conversione(p_articolo_id, p_uom_id) f
                    JOIN catalogo.articoli_uom_operativa o ON o.id = f.fonte_id
                   WHERE f.priorita = 1
                     AND f.validita @> p_data;
              END
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION catalogo.fn_uom_operativa_alla_data(uuid, bigint, date) IS
                  'La mappatura dell''unita'' p_uom_id per l''articolo p_articolo_id alla data p_data: il fattore verso l''unita'' base e le regole della quantita'' (qty_step, max_decimals, forbid_fraction) della riga di catalogo.articoli_uom_operativa che e'' la fonte di priorita'' 1 di catalogo.fn_uom_fonti_conversione e la cui validita contiene p_data. Al piu'' una riga (uq_articoli_uom_operativa_no_overlap); nessuna se l''unita'' non e'' mappata a quella data, o se p_data e'' NULL. La riga base vale a ogni data. Quale mappatura vale lo dice fn_uom_fonti_conversione, sede unica del predicato; qui si leggono le regole della quantita'', che chiama script.trgfn_qta_from_operativa. SECURITY INVOKER: la tabella non ha RLS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_uom_operativa_alla_data(p_articolo_id uuid, p_uom_id bigint, p_data date)
               RETURNS TABLE(factor_to_base numeric, qty_step numeric, max_decimals integer, forbid_fraction boolean)
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
                  SELECT o.factor_to_base,
                         o.qty_step,
                         o.max_decimals,
                         o.forbid_fraction
                    FROM catalogo.articoli_uom_operativa o
                   WHERE o.articolo_id = p_articolo_id
                     AND o.uom_id = p_uom_id
                     AND o.attivo IS TRUE
                     AND o.validita @> p_data;
              END
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              COMMENT ON FUNCTION catalogo.fn_uom_operativa_alla_data(uuid, bigint, date) IS
                  'La mappatura dell''unita'' p_uom_id per l''articolo p_articolo_id alla data p_data: il fattore verso l''unita'' base e le regole della quantita'' (qty_step, max_decimals, forbid_fraction) della riga attiva di catalogo.articoli_uom_operativa la cui validita contiene p_data. Al piu'' una riga (uq_articoli_uom_operativa_no_overlap); nessuna se l''unita'' non e'' mappata a quella data, o se p_data e'' NULL. La riga base vale a ogni data. Sede unica della lettura della mappatura: la chiamano catalogo.fn_get_uom_factor (il fattore) e script.trgfn_qta_from_operativa (le regole). SECURITY INVOKER: la tabella non ha RLS.';
