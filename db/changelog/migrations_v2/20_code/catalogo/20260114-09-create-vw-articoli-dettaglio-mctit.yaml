# Liquibase changelog per Zero ERP
# View: catalogo.vw_articoli_dettaglio
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260114-09-create-vw-articoli-dettaglio-mctit.yaml

  - changeSet:
      id: 20260114-09-create-vw-articoli-dettaglio
      author: mctit
      # runAlways: true
      validCheckSum:
        - ANY
      comment: >
        Vista dettaglio articoli con anagrafiche correlate (unita_misura, tipologie,
        gruppi, spesa, iva).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS catalogo.vw_articoli_dettaglio;

              CREATE OR REPLACE VIEW catalogo.vw_articoli_dettaglio AS
              SELECT
                a.id,
                a.codice,
                a.descrizione,
                a.descrizione_breve,
                a.uom_id,
                a.tipo_voce_id,
                a.gruppo_voce_id,
                a.spesa_id,
                a.iva_id,
                a.conto_contabile_vendita_id,
                a.conto_contabile_acquisto_id,
                a.is_composito,
                a.requires_serial,
                a.voce_utility,
                a.fondo_fattura,
                a.meta,
                a.user_insert,
                a.user_update,
                a.data_insert,
                a.data_update,
                a.tx_id,
                a.storicizza,
                a.attivo,
                a.note_target_tipo,
                a.note_id,
                u.id AS uom_ref_id,
                u.codice AS uom_codice,
                u.descrizione AS uom_descrizione,
                t.id AS tipologia_ref_id,
                t.codice AS tipologia_codice,
                t.descrizione AS tipologia_descrizione,
                g.id AS gruppo_ref_id,
                g.codice AS gruppo_codice,
                g.descrizione AS gruppo_descrizione,
                s.id AS spesa_ref_id,
                s.codice AS spesa_codice,
                s.descrizione AS spesa_descrizione,
                i.id AS iva_ref_id,
                i.codice AS iva_codice,
                i.descrizione AS iva_descrizione,
                i.aliquota_iva AS iva_aliquota_iva
              FROM catalogo.articoli a
              LEFT JOIN catalogo.unita_misura u
                ON u.id = a.uom_id
              LEFT JOIN vendite.articoli_tipologie t
                ON t.id = a.tipo_voce_id
              LEFT JOIN vendite.articoli_gruppi g
                ON g.id = a.gruppo_voce_id
              LEFT JOIN vendite.articoli_spesa s
                ON s.id = a.spesa_id
              LEFT JOIN config.iva i
                ON i.id = a.iva_id;

              COMMENT ON VIEW catalogo.vw_articoli_dettaglio IS
                'Vista dettaglio articoli con riferimenti a unita_misura, tipologie, gruppi, spesa e iva.';
