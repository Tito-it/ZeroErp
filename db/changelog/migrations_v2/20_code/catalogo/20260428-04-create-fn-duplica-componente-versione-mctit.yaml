# Endpoint atomico DB per duplicare la versione corrente di un
# componente BoM (Fase 3 BE 28-04-2026).
#
# Pattern: chiudi-sorgente + apri-nuova in singola transazione
# coperta da pg_advisory_xact_lock per evitare race fra
# duplicazioni concorrenti dello stesso prodotto.
#
# Firma:
#   catalogo.fn_duplica_componente_versione(
#     p_articolo_id        UUID,           -- prodotto target (guard)
#     p_componente_row_id  UUID,           -- riga sorgente (PK)
#     p_chiudi_al          DATE DEFAULT NULL  -- data chiusura sorgente
#                                              (NULL -> CURRENT_DATE)
#   ) RETURNS UUID                          -- id nuova riga
#
# Logica:
#   1. Lock advisory per prodotto -> serializza duplicazioni concorrenti
#   2. SELECT ... FOR UPDATE riga sorgente
#   3. Guard E_BOM_RIGA_NOT_FOUND       (riga non trovata)
#   4. Guard E_BOM_PRODOTTO_MISMATCH    (riga != p_articolo_id)
#   5. Guard E_BOM_SORGENTE_GIA_CHIUSA  (valido_al IS NOT NULL)
#   6. UPDATE valido_al sorgente -> v_chiudi_al
#      (l'edge case v_chiudi_al < OLD.valido_dal e' coperto dal trigger
#       block_modifica_struttura -> E_BOM_VALIDO_AL_INVALIDO)
#   7. INSERT nuova riga: copia componente_id + struttura + meta + note,
#      valido_dal = v_chiudi_al + 1 (gap obbligato per non urtare
#      ex_articoli_componenti_no_overlap GIST), valido_al = NULL,
#      attivo = true (forzato, no eredita)
#   8. EXCEPTION exclusion_violation -> E_BOM_VERSIONE_OVERLAP
#
# Codici errore (seedati in messaggi_errore.csv 400-403):
#   400 E_BOM_VERSIONE_OVERLAP
#   401 E_BOM_SORGENTE_GIA_CHIUSA
#   402 E_BOM_RIGA_NOT_FOUND
#   403 E_BOM_PRODOTTO_MISMATCH
# Codici riusati:
#   388 E_BOM_VALIDO_AL_INVALIDO  (trigger block_modifica_struttura)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/catalogo/20260428-04-create-fn-duplica-componente-versione-mctit.yaml

  - changeSet:
      id: 20260428-04-create-fn-duplica-componente-versione
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Crea catalogo.fn_duplica_componente_versione: chiusura sorgente
        + INSERT nuova versione in singola TX, coperta da
        pg_advisory_xact_lock per il prodotto.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: catalogo
                tableName: articoli_componenti
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.fn_duplica_componente_versione(
                  p_articolo_id        catalogo.articoli_componenti.prodotto_id%TYPE,
                  p_componente_row_id  catalogo.articoli_componenti.id%TYPE,
                  p_chiudi_al          catalogo.articoli_componenti.valido_al%TYPE DEFAULT NULL
              )
              RETURNS uuid
              LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Endpoint atomico per duplicare la versione corrente di
              --   un componente BoM. Chiude la riga sorgente al
              --   p_chiudi_al (default oggi) e inserisce una nuova riga
              --   con valido_dal = p_chiudi_al + 1, copiando i campi di
              --   struttura + meta + note. Lock advisory sul prodotto
              --   serializza duplicazioni concorrenti.
              -- Restituisce: id (uuid) della nuova riga.
              -- Tipi: parametri e variabili usano %TYPE delle colonne
              --   target (linee-guida-sql.md). RETURNS resta uuid concreto
              --   (PostgreSQL non supporta %TYPE nel RETURNS).
              DECLARE
                  v_fn_name    CONSTANT text := 'fn_duplica_componente_versione';
                  v_chiudi_al  catalogo.articoli_componenti.valido_al%TYPE;
                  v_old        catalogo.articoli_componenti%ROWTYPE;
                  v_new_id     catalogo.articoli_componenti.id%TYPE;
              BEGIN
                  v_chiudi_al := COALESCE(p_chiudi_al, CURRENT_DATE);

                  -- Guard parametri NULL: riconducibile a NOT FOUND.
                  IF p_articolo_id IS NULL OR p_componente_row_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          v_fn_name,
                          'E_BOM_RIGA_NOT_FOUND',
                          jsonb_build_object(
                              'articolo_id', p_articolo_id,
                              'riga_id',     p_componente_row_id
                          ),
                          NULL::uuid,
                          COALESCE(p_componente_row_id::text, 'NULL')
                      );
                  END IF;

                  -- Lock advisory per prodotto: serializza duplicazioni
                  -- concorrenti sullo stesso articolo. La granularita'
                  -- per prodotto e' sufficiente perche' l'EXCLUDE GIST
                  -- e' su (prodotto_id, componente_id, validita).
                  PERFORM pg_advisory_xact_lock(
                      hashtext('catalogo.articoli_componenti.duplica:' || p_articolo_id::text)
                  );

                  -- SELECT FOR UPDATE riga sorgente.
                  SELECT * INTO v_old
                    FROM catalogo.articoli_componenti
                   WHERE id = p_componente_row_id
                   FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          v_fn_name,
                          'E_BOM_RIGA_NOT_FOUND',
                          jsonb_build_object('riga_id', p_componente_row_id),
                          NULL::uuid,
                          p_componente_row_id::text
                      );
                  END IF;

                  -- Guard prodotto mismatch.
                  IF v_old.prodotto_id IS DISTINCT FROM p_articolo_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          v_fn_name,
                          'E_BOM_PRODOTTO_MISMATCH',
                          jsonb_build_object(
                              'expected_prodotto_id', p_articolo_id,
                              'actual_prodotto_id',   v_old.prodotto_id,
                              'riga_id',              v_old.id
                          ),
                          NULL::uuid,
                          v_old.prodotto_id::text,
                          p_articolo_id::text
                      );
                  END IF;

                  -- Guard sorgente gia' chiusa.
                  IF v_old.valido_al IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          v_fn_name,
                          'E_BOM_SORGENTE_GIA_CHIUSA',
                          jsonb_build_object(
                              'riga_id',   v_old.id,
                              'valido_al', v_old.valido_al
                          ),
                          NULL::uuid,
                          v_old.valido_al::text
                      );
                  END IF;

                  -- UPDATE chiusura sorgente. Edge case
                  -- v_chiudi_al < OLD.valido_dal: lasciamo propagare
                  -- E_BOM_VALIDO_AL_INVALIDO dal trigger
                  -- block_modifica_struttura (gia' UI-friendly, code 388).
                  UPDATE catalogo.articoli_componenti
                     SET valido_al = v_chiudi_al
                   WHERE id = v_old.id;

                  -- INSERT nuova versione. valido_dal = v_chiudi_al + 1
                  -- e' obbligato dal pattern daterange canonicalizzato:
                  -- la sorgente chiusa ha validita = [v_dal, v_chiudi_al+1),
                  -- per non urtare l'EXCLUDE GIST la nuova deve partire
                  -- da v_chiudi_al + 1.
                  -- Cattura overlap con eventuali righe future esistenti
                  -- sullo stesso (prodotto, componente).
                  BEGIN
                      INSERT INTO catalogo.articoli_componenti (
                          prodotto_id,
                          componente_id,
                          coeff_qta,
                          partecipa_qta,
                          obbligatorio,
                          determina_qta_padre,
                          esposto_in_fattura,
                          meta,
                          note_target_tipo,
                          note_id,
                          valido_dal,
                          valido_al,
                          attivo
                      )
                      VALUES (
                          v_old.prodotto_id,
                          v_old.componente_id,
                          v_old.coeff_qta,
                          v_old.partecipa_qta,
                          v_old.obbligatorio,
                          v_old.determina_qta_padre,
                          v_old.esposto_in_fattura,
                          v_old.meta,
                          v_old.note_target_tipo,
                          v_old.note_id,
                          v_chiudi_al + 1,
                          NULL,
                          true
                      )
                      RETURNING id INTO v_new_id;
                  EXCEPTION
                      WHEN exclusion_violation THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              v_fn_name,
                              'E_BOM_VERSIONE_OVERLAP',
                              jsonb_build_object(
                                  'prodotto_id',      v_old.prodotto_id,
                                  'componente_id',    v_old.componente_id,
                                  'nuova_valido_dal', v_chiudi_al + 1,
                                  'sorgente_id',      v_old.id
                              ),
                              NULL::uuid,
                              (v_chiudi_al + 1)::text
                          );
                  END;

                  RETURN v_new_id;
              END;
              $function$;

              COMMENT ON FUNCTION catalogo.fn_duplica_componente_versione(uuid, uuid, date) IS
                  'Endpoint atomico: chiude la versione corrente di un '
                  'componente BoM e ne apre una nuova con valido_dal = '
                  'p_chiudi_al + 1. Copia componente_id, struttura, meta, '
                  'note. Lock advisory per prodotto. Codici errore: '
                  'E_BOM_VERSIONE_OVERLAP (400), E_BOM_SORGENTE_GIA_CHIUSA '
                  '(401), E_BOM_RIGA_NOT_FOUND (402), E_BOM_PRODOTTO_MISMATCH '
                  '(403). Edge case p_chiudi_al < valido_dal -> '
                  'E_BOM_VALIDO_AL_INVALIDO (388, dal trigger).';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP FUNCTION IF EXISTS catalogo.fn_duplica_componente_versione(uuid, uuid, date);
