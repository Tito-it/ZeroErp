# catalogo.fn_uom_fonti_conversione: da dove un'unita' si converte nella base di un
#   articolo (la base, la mappatura, la conversione generale), col periodo di ciascuna.
#
#   D25 (Q24) chiede di sapere se un'unita' si converte per TUTTO il periodo di una
#   versione di listino, non a un giorno. La risposta a un giorno sta gia' in
#   catalogo.fn_get_uom_factor e in catalogo.fn_uom_operativa_alla_data, con i loro
#   predicati (attiva, articolo, coppia di unita' nei due versi). Una terza lettura,
#   sui periodi, li avrebbe ricopiati: il predicato si estrae qui e le altre due lo
#   leggono (-48, -49). Funzione nuova, rollback: DROP.
#   Brief: brief-db-revisione-catalogo, giro 2-bis.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261111-47-create-fn-uom-fonti-conversione-mctit.yaml

  - changeSet:
      id: 20261111-47-create-fn-uom-fonti-conversione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.fn_uom_fonti_conversione: le fonti della conversione di un'unita' nella base dell'articolo, col loro periodo; sede unica del predicato (D25, Q24). Brief: brief-db-revisione-catalogo, giro 2-bis.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.proname = 'fn_uom_fonti_conversione'
                 AND p.pronamespace = 'catalogo'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION catalogo.fn_uom_fonti_conversione(
                  p_articolo_id catalogo.articoli.id%TYPE,
                  p_uom_id      catalogo.unita_misura.id%TYPE)
               RETURNS TABLE(
                  priorita integer,
                  fonte_id bigint,
                  fattore  numeric,
                  validita daterange)
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
                  SELECT 0, NULL::bigint, 1::numeric, daterange(NULL::date, NULL::date)
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id
                     AND a.uom_id = p_uom_id
                  UNION ALL
                  SELECT 1, o.id, o.factor_to_base::numeric, o.validita
                    FROM catalogo.articoli_uom_operativa o
                   WHERE o.articolo_id = p_articolo_id
                     AND o.uom_id = p_uom_id
                     AND o.attivo IS TRUE
                  UNION ALL
                  SELECT 2,
                         c.id,
                         CASE WHEN c.uom_from_id = p_uom_id THEN c.fattore::numeric ELSE 1 / c.fattore END,
                         c.validita
                    FROM catalogo.articoli a
                    JOIN catalogo.unita_misura_conversioni c
                      ON (c.uom_from_id = p_uom_id AND c.uom_to_id = a.uom_id)
                      OR (c.uom_from_id = a.uom_id AND c.uom_to_id = p_uom_id)
                   WHERE a.id = p_articolo_id
                     AND c.attivo IS TRUE;
              END
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION catalogo.fn_uom_fonti_conversione(uuid, bigint) IS
                  'Le fonti da cui l''unita'' p_uom_id si converte nell''unita'' base dell''articolo p_articolo_id, ciascuna col suo fattore (quante unita'' base vale una unita'' p_uom_id) e il suo periodo: priorita 0, l''unita'' base stessa (fattore 1, sempre); 1, la mappatura dell''articolo (catalogo.articoli_uom_operativa, attiva; fonte_id e'' la riga); 2, la conversione generale fra le due unita'' (catalogo.unita_misura_conversioni, attiva), nel verso in cui e'' scritta o nell''inverso (1/fattore; fonte_id e'' la conversione). Sede unica del predicato «da dove si converte»: la leggono catalogo.fn_get_uom_factor (alla data, la fonte di priorita'' piu'' bassa), catalogo.fn_uom_operativa_alla_data (la mappatura alla data) e catalogo.fn_uom_primo_giorno_non_convertibile (su un periodo). Le mappature di un''unita'' non si sovrappongono (uq_articoli_uom_operativa_no_overlap), ne'' le conversioni di una coppia (ex_unita_misura_conversioni_coppia_no_overlap). fattore e'' numeric senza scala: l''inversa di una conversione non sta in numeric(18,6). SECURITY INVOKER: le tabelle del catalogo non hanno RLS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS catalogo.fn_uom_fonti_conversione(uuid, bigint);
