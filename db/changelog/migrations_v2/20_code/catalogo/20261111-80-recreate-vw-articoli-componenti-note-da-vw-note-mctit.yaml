# catalogo.vw_articoli_componenti_note torna sopra la vista base delle note (R6).
#
#   Tolta da 20261111-77 (user_* cambia tipo). Stesse colonne, stesso ordine e stessi nomi di
#   prima; le colonne di nota vengono da catalogo.vw_note (-78) per nota_target_tipo =
#   'ARTICOLO_COMPONENTE', il confine della partizione note_articoli_componenti. user_* ora
#   sono text. GRANT come prima.
#   Brief: brief-db-revisione-catalogo, giro 4 (R6).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20261111-80-recreate-vw-articoli-componenti-note-da-vw-note-mctit.yaml

  - changeSet:
      id: 20261111-80-recreate-vw-articoli-componenti-note-da-vw-note
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        catalogo.vw_articoli_componenti_note sopra catalogo.vw_note, stesse colonne. Brief: brief-db-revisione-catalogo, giro 4.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_class
               WHERE oid IN (to_regclass('catalogo.vw_note'))
                 AND to_regclass('catalogo.vw_articoli_componenti_note') IS NULL
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW catalogo.vw_articoli_componenti_note AS
               SELECT ac.id AS articolo_componente_id,
                  ac.prodotto_id,
                  ap.codice AS prodotto_codice,
                  ap.descrizione AS prodotto_descrizione,
                  ac.componente_id,
                  acmp.codice AS componente_codice,
                  acmp.descrizione AS componente_descrizione,
                  n.nota_id,
                  n.nota_target_tipo,
                  n.nota_target_id,
                  n.nota_target_riga_id,
                  n.nota_anchor_tipo,
                  n.nota_posizione,
                  n.nota_seq,
                  n.nota_testo,
                  n.nota_testo_md,
                  n.nota_visibile,
                  n.nota_solo_stampa,
                  n.nota_meta,
                  n.nota_data_insert,
                  n.nota_user_insert,
                  n.nota_data_update,
                  n.nota_user_update,
                  n.stile_id,
                  n.stile_codice,
                  n.stile_descrizione,
                  n.lingua_id,
                  n.lingua_codice_iso,
                  n.lingua_descrizione,
                  n.lingua_descrizione_locale
                 FROM catalogo.vw_note n
                   JOIN catalogo.articoli_componenti ac ON ac.id = n.nota_target_id
                   LEFT JOIN catalogo.articoli ap ON ap.id = ac.prodotto_id
                   LEFT JOIN catalogo.articoli acmp ON acmp.id = ac.componente_id
                WHERE n.nota_target_tipo = 'ARTICOLO_COMPONENTE';

              COMMENT ON VIEW catalogo.vw_articoli_componenti_note IS
                'Le note dei legami di distinta, una riga per nota, col legame, i codici e le descrizioni di padre e componente e la decodifica dello stile e della lingua. Le colonne di nota vengono da catalogo.vw_note (nota_target_tipo ARTICOLO_COMPONENTE, la partizione catalogo.note_articoli_componenti). Non filtra le note nascoste ne'' quelle di sola stampa. Si legge; le note si scrivono sulla partizione. nota_user_insert e nota_user_update sono text.';

              GRANT SELECT, INSERT, UPDATE, DELETE ON catalogo.vw_articoli_componenti_note TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS catalogo.vw_articoli_componenti_note;
