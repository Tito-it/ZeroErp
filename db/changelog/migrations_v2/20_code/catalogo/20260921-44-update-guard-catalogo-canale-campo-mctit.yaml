# brief-be-presidio-ui-action-e-canale-campi §4 — SANATURA DEL CANALE `campo`
# nei guard di `catalogo` (la strada A del §4-bis, codice per codice).
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   Questi codici promettono a catalogo `ui_action = highlight_form_fields`
#   («evidenzia il campo del form»), ma il campo lo accende un ALTRO canale:
#   la COLUMN che script.fn_log_and_raise_error legge dal context — chiave
#   `campo`, ripiego `parametro`. Qui il context non la portava: il nome
#   della colonna c'era, ma come CHIAVE (`'quantita', NEW.quantita`), nel
#   posto che l'helper non legge (dbops.vw_punti_canale_campo:
#   CHIAVE_NON_LETTA / NESSUNO). A video: un toast e nessun campo rosso.
#   La promessa era vuota, e nessun test lo vedeva.
#
# ── ⭐ LA CORREZIONE: una coppia in piu', NIENTE ALTRO ─────────────
#   `'campo', '<colonna>'` come prima coppia del jsonb_build_object della
#   chiamata che nomina il codice. Firma, guard, messaggio, VARIADIC,
#   tx_id: intatti. Il nome e' quello dell'INPUT che l'operatore ha davanti
#   (regola di api.md §Envelope: un id dall'URL o un parametro di firma NON
#   lo e' — quelli restano senza campo e sono la strada B, l'override esce
#   dal lato BE).
#
# ── I CODICI, E IL CAMPO SCELTO (strada A) ──────────────────────────
#   E_BOM_VALIDO_AL_INVALIDO -> valido_al (precede valido_dal sulla riga
#     di distinta: l'input da correggere e' la fine validita')
#   ⚠️ E_ARTICOLO_NON_COMPOSITO (stessa tabella) NON e' qui: il prodotto
#     padre e' la pagina in cui si sta (URL), non un input della riga, e il
#     rimedio e' marcare l'articolo composito. Strada B: l'override esce
#     dal lato BE (brief §4-bis).
#
# ── ORIGINE DEL CORPO, E IL CANCELLO SUL CORPO STANTIO ─────────────
#   Corpo VIVO (pg_get_functiondef, 21-09) per ogni funzione; il diff e' la
#   sola inserzione (verificato per riga dal generatore). La preCondition
#   ancora l'md5 di prosrc a quello letto: se qualcun altro tocca la stessa
#   funzione prima dell'apply, il migrate si FERMA invece di disfargli il
#   lavoro in silenzio (memoria: due changeSet dello stesso giorno sulla
#   stessa funzione, 2026-09-09). dbdev e zeroerp_ci portano lo stesso md5
#   (verificato 21-09), quindi la CI da zero passa.
#   Il ripristino torna al corpo vivo di prima.
#
# Presidio: db/pgtap/dbops/test-punti-canale-campo-v1.sql (t.1: i codici di
#   questa lista non sono piu' CHIAVE_NON_LETTA/NESSUNO) + i pgTAP dei guard
#   (invariati: il context in piu' non cambia nessun throws_ok).
# Dipendenze: nessuna (la vista -42 li LEGGE, non serve all'apply).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/catalogo/20260921-44-update-guard-catalogo-canale-campo-mctit.yaml

  - changeSet:
      id: 20260921-44-update-guard-catalogo-canale-campo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Canale campo nei guard di catalogo:
        catalogo.trgfn_articoli_componenti_block_modifica_struttura —
        'campo', '<colonna>' nel context delle chiamate che nominano
        E_BOM_VALIDO_AL_INVALIDO. Solo la coppia in piu'; corpo vivo,
        md5 ancorato in preCondition.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            catalogo: il corpo di una funzione da sanare non e' quello letto il
            21-09 (md5 diverso): qualcuno l'ha toccata dopo. Rileggere il
            vivo e rigenerare questo changeSet, non applicarlo.
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'catalogo' AND p.proname = 'trgfn_articoli_componenti_block_modifica_struttura'
                     AND md5(p.prosrc) = '2710b3b619e06a07f967686a9cf253f9'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION catalogo.trgfn_articoli_componenti_block_modifica_struttura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Garantire che la struttura di una BoM sia immutabile
                  --   una volta inserita. Pattern admin "chiudi+inserisci":
                  --   per correggere si chiude la riga esistente (UPDATE
                  --   valido_al alla data di fine) e si inserisce una
                  --   nuova riga con valido_dal successivo. Il temporal UNIQUE
                  --   constraint uq_articoli_componenti_no_overlap (PG 18)
                  --   garantisce non-overlap sul triplo (prodotto, componente,
                  --   validita WITHOUT OVERLAPS).
                  --
                  -- Regole:
                  --   1. DELETE -> bloccato sempre (E_BOM_MODIFICA_VIETATA).
                  --   2. UPDATE dei campi di struttura -> bloccato
                  --      (coeff_qta, componente_id, obbligatorio,
                  --      esposto_in_fattura, partecipa_qta,
                  --      determina_qta_padre, valido_dal).
                  --      Nota: validita rimossa dalla lista perche' e' ora
                  --      STORED generated: PostgreSQL rifiuta scritture dirette
                  --      prima che il trigger venga eseguito; in BEFORE trigger
                  --      NEW.validita e' NULL e non puo' essere usata per check.
                  --   3. UPDATE di solo valido_al ammesso + check
                  --      NEW.valido_al >= OLD.valido_dal -> altrimenti
                  --      E_BOM_VALIDO_AL_INVALIDO.
                  --   4. UPDATE di campi note/meta/attivo + audit
                  --      (user_update/data_update/tx_id) -> ammesso.
                  -- =========================================================

                  IF TG_OP = 'DELETE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME,
                          'E_BOM_MODIFICA_VIETATA',
                          jsonb_build_object(
                              'operazione',    'DELETE',
                              'hint',          'Chiudi la riga impostando valido_al invece di eliminarla.',
                              'prodotto_id',   OLD.prodotto_id,
                              'componente_id', OLD.componente_id,
                              'riga_id',       OLD.id
                          ),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]
                      );
                  END IF;

                  IF TG_OP = 'UPDATE' THEN
                      -- Blocca modifiche ai campi di struttura.
                      -- validita non inclusa: e' STORED generated, scritture dirette
                      -- sono gia' rifiutate da PostgreSQL prima che il trigger esegua.
                      IF NEW.coeff_qta              IS DISTINCT FROM OLD.coeff_qta
                         OR NEW.componente_id       IS DISTINCT FROM OLD.componente_id
                         OR NEW.obbligatorio        IS DISTINCT FROM OLD.obbligatorio
                         OR NEW.esposto_in_fattura  IS DISTINCT FROM OLD.esposto_in_fattura
                         OR NEW.partecipa_qta       IS DISTINCT FROM OLD.partecipa_qta
                         OR NEW.determina_qta_padre IS DISTINCT FROM OLD.determina_qta_padre
                         OR NEW.valido_dal          IS DISTINCT FROM OLD.valido_dal
                      THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME,
                              'E_BOM_MODIFICA_VIETATA',
                              jsonb_build_object(
                                  'operazione',    'UPDATE_STRUTTURA',
                                  'hint',          'Chiudi questa riga (imposta valido_al) e inserisci una nuova riga con i valori aggiornati.',
                                  'prodotto_id',   OLD.prodotto_id,
                                  'componente_id', OLD.componente_id,
                                  'riga_id',       OLD.id
                              ),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]
                          );
                      END IF;

                      -- Check coerenza range su UPDATE valido_al.
                      -- chk_articoli_componenti_valid_dates copre
                      -- "valido_al > valido_dal"; qui intercettiamo
                      -- valido_al < valido_dal con error code custom
                      -- UI-friendly. Il caso valido_al = valido_dal
                      -- resta a carico del CHECK (errore tecnico).
                      IF NEW.valido_al IS DISTINCT FROM OLD.valido_al
                         AND NEW.valido_al IS NOT NULL
                         AND NEW.valido_al < OLD.valido_dal
                      THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME,
                              'E_BOM_VALIDO_AL_INVALIDO',
                              jsonb_build_object(
                                  'campo', 'valido_al',
                                  'valido_al',   NEW.valido_al,
                                  'valido_dal',  OLD.valido_dal,
                                  'riga_id',     OLD.id
                              ),
                              NULL::uuid,
                              NEW.valido_al::text,
                              OLD.valido_dal::text
                          );
                      END IF;
                  END IF;

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$
              ;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
