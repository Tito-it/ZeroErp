# ------------------------------------------------------------
# ui.trgfn_ui_dashboard_widget_guard_in_uso: un widget che un preset propone
#   non esce dal pool della dashboard.
#   Brief: brief-db-revisione-ui (giro 2b: U14 con Q8, decisa da Tid il
#   2026-11-18: il DELETE e' bloccato finche' un preset propone il widget, e il
#   messaggio nomina i preset; la stessa regola delle colonne delle liste).
#
# Perche' un guard oltre alla FK: la FK composita verso il pool (20261120-32)
#   rifiuta gia', ma con 23503 e il nome del vincolo. Il guard parla prima, con
#   un codice di dominio (E_UI_WIDGET_IN_USO, CONFLITTO_STATO) e i codici dei
#   preset nella frase; la FK resta la rete. Il gemello delle liste e'
#   E_UI_COLONNA_IN_USO, che il BE solleva dal suo servizio (BE4).
# Scrittori del pool (2026-11-21): il solo seed (80_data, 20260722-03); nessuna
#   funzione del DB e nessun punto del BE cancella da ui.dashboard_widget.
# Montaggio: BEFORE DELETE FOR EACH ROW, fase a10. Il preset cancellato prima
#   porta via la sua composizione (CASCADE), quindi non blocca piu'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261120-34-create-trgfn-ui-dashboard-widget-guard-in-uso-mctit.yaml

  - changeSet:
      id: 20261120-34-create-trgfn-ui-dashboard-widget-guard-in-uso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.trgfn_ui_dashboard_widget_guard_in_uso e il montaggio a10 su ui.dashboard_widget: un widget proposto da
        un preset non esce dal pool. Brief: brief-db-revisione-ui (giro 2b, U14, Q8).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'trgfn_ui_dashboard_widget_guard_in_uso'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION ui.trgfn_ui_dashboard_widget_guard_in_uso()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: rifiutare il DELETE dal pool di un widget che un preset della
              --   stessa dashboard propone, nominando i preset.
              DECLARE
                  v_widget ui.widget.codice%TYPE;
                  -- text: i codici dei preset, per la frase; non il riflesso di una colonna
                  v_preset text;
              BEGIN
                  SELECT string_agg(dp.codice, ', ' ORDER BY dp.codice)
                    INTO v_preset
                    FROM ui.dashboard_preset_widget pw
                    JOIN ui.dashboard_preset dp ON dp.id = pw.preset_id
                   WHERE pw.dashboard_id = OLD.dashboard_id
                     AND pw.widget_id    = OLD.widget_id;

                  IF v_preset IS NOT NULL THEN
                      SELECT w.codice INTO v_widget FROM ui.widget w WHERE w.id = OLD.widget_id;
                      PERFORM script.fn_log_and_raise_error(
                          'ui', TG_NAME::text, 'E_UI_WIDGET_IN_USO',
                          jsonb_build_object(
                              'table',        TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'dashboard_id', OLD.dashboard_id,
                              'widget_id',    OLD.widget_id,
                              'preset',       v_preset),
                          NULL::uuid,
                          VARIADIC ARRAY[COALESCE(v_widget::text, OLD.widget_id::text), v_preset]);
                  END IF;
                  RETURN OLD;
              END;
              $function$;

              COMMENT ON FUNCTION ui.trgfn_ui_dashboard_widget_guard_in_uso() IS
                  'Rifiuta il DELETE dal pool di una dashboard (ui.dashboard_widget) di un widget che un preset di quella dashboard propone: E_UI_WIDGET_IN_USO (CONFLITTO_STATO), con il codice del widget e quelli dei preset nella frase. Si toglie prima il widget dai preset (o si cancella il preset). La FK composita fk_ui_dashboard_preset_widget_pool resta la rete. BEFORE DELETE FOR EACH ROW, fase a10.';

              CREATE TRIGGER trg_ui_dashboard_widget_a10_guard_in_uso_dlt
                  BEFORE DELETE ON ui.dashboard_widget
                  FOR EACH ROW
                  EXECUTE FUNCTION ui.trgfn_ui_dashboard_widget_guard_in_uso();

              COMMENT ON TRIGGER trg_ui_dashboard_widget_a10_guard_in_uso_dlt ON ui.dashboard_widget IS
                  'Un widget proposto da un preset non esce dal pool (ui.trgfn_ui_dashboard_widget_guard_in_uso).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ui_dashboard_widget_a10_guard_in_uso_dlt ON ui.dashboard_widget;
              DROP FUNCTION IF EXISTS ui.trgfn_ui_dashboard_widget_guard_in_uso();
