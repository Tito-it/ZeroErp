# ui.fn_intero_da_jsonb: il COMMENT dice la regola vera sulla notazione
#   esponenziale.
#   Brief: brief-db-revisione-ui (/verifica-db del giro 2, 2026-11-22).
#
# Il difetto: il COMMENT (20261120-21) diceva che un number in notazione
#   esponenziale da' NULL. jsonb normalizza il numero quando lo legge e tiene i
#   decimali scritti: '1e2' e '1.0e2' sono conservati come 100 e la funzione da'
#   100; '100.0' e '2.50e1' come 100.0 e 25.0, e da' NULL. Conta la forma
#   conservata, non la grafia. Il comportamento resta: 1e2 e' l'intero 100.
# Solo il COMMENT: il corpo non cambia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261122-27-update-comment-fn-intero-da-jsonb-forma-conservata-mctit.yaml

  - changeSet:
      id: 20261122-27-update-comment-fn-intero-da-jsonb-forma-conservata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_intero_da_jsonb: il COMMENT dice che conta la forma conservata del numero, non la grafia.
        Brief: brief-db-revisione-ui (/verifica-db del giro 2).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_intero_da_jsonb'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.fn_intero_da_jsonb(jsonb) IS
                  'Il numero intero non negativo scritto in un valore jsonb, o NULL: un jsonb di tipo number che, nella forma in cui jsonb lo conserva, ha sole cifre, al più nove. Conta la forma conservata, non la grafia: jsonb normalizza il numero e tiene i decimali scritti, quindi 1e2 vale 100, mentre 100.0 e 2.50e1 (conservati come 100.0 e 25.0) danno NULL. Una stringa (anche "25"), un number negativo o con decimali, il null jsonb e NULL danno NULL; la funzione non solleva mai. È la sede unica della domanda «questo valore è un intero?» per le configurazioni di ui: la leggono il guard di forma delle preferenze (ui.fn_check_forma_configurazione), ui.fn_guard_misura_pagina e i due resolver (ui.fn_resolve_lista_config, ui.fn_resolve_dashboard_config). Chi la usa decide il dominio (positivo, una misura del catalogo, il tetto della dashboard). IMMUTABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.fn_intero_da_jsonb(jsonb) IS
                  'Il numero intero non negativo scritto in un valore jsonb, o NULL: un jsonb di tipo number scritto con sole cifre, al più nove. Una stringa (anche "25"), un number negativo, decimale o esponenziale, il null jsonb e NULL danno NULL; la funzione non solleva mai. È la sede unica della domanda «questo valore è un intero?» per le configurazioni di ui: la leggono il guard di forma delle preferenze (ui.fn_check_forma_configurazione), ui.fn_guard_misura_pagina e i due resolver (ui.fn_resolve_lista_config, ui.fn_resolve_dashboard_config). Chi la usa decide il dominio (positivo, una misura del catalogo, il tetto della dashboard). IMMUTABLE.';
