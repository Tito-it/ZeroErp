# IL LIVELLO EFFETTIVO DI UNA COLONNA, IN UN POSTO SOLO
#   ui.fn_lista_colonne_livello(lista, utente, veste)
#   Piano: brief-db-ricerca-full-colonne-permessi, sezione 3.2
#
# -- PERCHE' NASCE ----------------------------------------------
#   Quale livello ha un utente su una colonna (TUTTO, LETTURA, BLOCCATO) si
#   calcolava solo nei passi 4 e 5 di ui.fn_resolve_lista_config. La ricerca
#   libera del BE ha bisogno della STESSA risposta: se un utente non vede una
#   colonna, non deve nemmeno poterci cercare dentro. Due copie del calcolo
#   prima o poi rispondono in due modi diversi, e la ricerca troverebbe righe
#   per un valore che la lista non mostra. Regola del 2: si estrae qui, e il
#   risolutore passa da qui nello stesso giro (20260923-13).
#
# -- LA REGOLA, TRASCRITTA E NON CAMBIATA ------------------------
#   1. I grant si cercano fra i profili d'accesso applicabili all'utente
#      sotto la veste data (script.fn_get_profili_accesso_applicabili).
#   2. Fra piu' grant sulla stessa colonna vince il profilo piu' specifico
#      (priorita' piu' bassa: AD_HOC prima di REPARTO/PORTALE); a parita' di
#      priorita' il piu' restrittivo (BLOCCATO, poi LETTURA, poi TUTTO).
#   3. Senza grant: BLOCCATO se la colonna e' sensibile, TUTTO altrimenti.
#
# ATTENZIONE: l'emittente fiscale NON entra. I grant di colonna sono per
#   profilo d'accesso e basta; nel risolutore l'emittente serve solo a
#   scegliere il preset (passo 2c), non il livello. La richiesta del BE lo
#   nominava: e' stato verificato sul corpo vivo, e non c'e'.
#
# ATTENZIONE: una riga per ogni colonna ATTIVA della lista, anche BLOCCATA.
#   Filtrare e' compito di chi legge: il risolutore toglie le BLOCCATO e
#   spegne l'export sulle LETTURA, la ricerca toglie le BLOCCATO. Un BB che
#   filtrasse da se' deciderebbe per tutti una cosa che ciascuno decide a suo
#   modo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260923-12-create-fn-lista-colonne-livello-mctit.yaml

  - changeSet:
      id: 20260923-12-create-fn-lista-colonne-livello
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Building block ui.fn_lista_colonne_livello(lista, utente, veste): per ogni colonna attiva della
        lista il livello effettivo dell'utente (grant del profilo piu' specifico, a parita' il piu'
        restrittivo; senza grant BLOCCATO se sensibile, TUTTO altrimenti). Estratto dai passi 4-5 di
        fn_resolve_lista_config, secondo consumatore la ricerca libera. Piano:
        brief-db-ricerca-full-colonne-permessi, sezione 3.2.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_lista_colonne_livello(
                p_lista_id     ui.lista_definizione.id%TYPE,
                p_auth_user_id integer,
                p_veste        config.ruolo_applicativo
              )
               RETURNS TABLE(
                colonna_id      ui.lista_colonna.id%TYPE,
                codice          ui.lista_colonna.codice%TYPE,
                livello_accesso config.livello_accesso
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: il livello effettivo (TUTTO, LETTURA, BLOCCATO) che un utente ha
              -- su ogni colonna attiva di una lista, sotto una veste.
              --
              -- Regola:
              --   - grant dai profili applicabili all'utente sotto la veste
              --     (p_veste NULL = tutte le vesti, come ui.fn_veste_corrente);
              --   - fra piu' grant: il profilo piu' specifico (priorita asc), a parita'
              --     il piu' restrittivo (BLOCCATO > LETTURA > TUTTO);
              --   - senza grant: sensibile -> BLOCCATO, altrimenti TUTTO.
              --
              -- ⚠️ Una riga per OGNI colonna attiva, anche BLOCCATA: il filtro lo fa
              --   chi legge. Utente NULL o senza profili: nessun grant, restano i
              --   livelli di ripiego (fail-closed sulle sensibili).
              BEGIN
                RETURN QUERY
                WITH pa AS MATERIALIZED (
                  -- Una sola chiamata al risolutore dei profili, qualunque sia il
                  -- numero di colonne.
                  SELECT p.profilo_accesso_id, p.priorita
                    FROM script.fn_get_profili_accesso_applicabili(p_auth_user_id, p_veste) p
                ),
                concesso AS (
                  SELECT DISTINCT ON (lcp.colonna_id)
                         lcp.colonna_id,
                         lcp.livello_accesso
                    FROM ui.lista_colonna_permesso lcp
                    JOIN pa
                      ON pa.profilo_accesso_id = lcp.profilo_accesso_id
                    JOIN ui.lista_colonna lcg
                      ON lcg.id       = lcp.colonna_id
                     AND lcg.lista_id = p_lista_id
                   ORDER BY lcp.colonna_id,
                            pa.priorita ASC,
                            CASE lcp.livello_accesso
                              WHEN 'BLOCCATO' THEN 1
                              WHEN 'LETTURA'  THEN 2
                              WHEN 'TUTTO'    THEN 3
                            END ASC
                )
                SELECT lc.id,
                       lc.codice,
                       COALESCE(
                         c.livello_accesso,
                         (CASE WHEN lc.sensibile THEN 'BLOCCATO' ELSE 'TUTTO' END)::config.livello_accesso
                       )
                  FROM ui.lista_colonna lc
                  LEFT JOIN concesso c
                    ON c.colonna_id = lc.id
                 WHERE lc.lista_id = p_lista_id
                   AND lc.attivo   = TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION ui.fn_lista_colonne_livello(integer, integer, config.ruolo_applicativo)
              IS 'Livello effettivo (TUTTO, LETTURA, BLOCCATO) di un utente su ogni colonna attiva di una lista, sotto una veste (NULL = tutte). Fra piu'' grant vince il profilo piu'' specifico (priorita asc), a parita'' il piu'' restrittivo; senza grant la colonna sensibile e'' BLOCCATO, le altre TUTTO. Una riga per ogni colonna attiva, anche BLOCCATA: filtra chi legge. L''emittente fiscale non entra: i grant sono per profilo d''accesso. Estratta il 2026-09-23 dai passi 4-5 di fn_resolve_lista_config (regola del 2), secondo consumatore fn_lista_colonne_ricerca_full. Brief: brief-db-ricerca-full-colonne-permessi.';
