# ui.trgfn_ui_lista_definizione_a10_valida_vista_sql: la relazione dal BB, e le
#   colonne riverificate quando la vista cambia o la lista si riaccende.
#   Brief: brief-db-revisione-ui (giro 4: U27 con Q16, Q35).
#
# Che cosa cambia (il corpo di prima e' quello di 20260927-30, letto da dbdev il
#   2026-11-21):
#   - la relazione si cerca col BB ui.fn_lista_relazione_ha_attributo
#     (20261120-45): le tabelle partizionate sono ammesse;
#   - ⭐ Q16 (a): per chi non e' il proprietario della tabella (l'applicazione,
#     dalla pagina tecnica), un cambio di vista o di schema su una lista accesa, e
#     la riaccensione di una lista, si rifiutano se lasciano una colonna VISTA con
#     un campo che la relazione non ha: E_UI_LISTA_COLONNE_ORFANE, che nomina le
#     colonne (Q35). Contano tutte le colonne della lista, accese e spente: lo
#     stesso perimetro del guard delle colonne, che giudica la colonna spenta come
#     quella accesa.
#   - Il proprietario (il migrate) resta fuori dalla verifica delle colonne:
#     il CSV delle definizioni si carica prima di quello delle colonne, e un
#     cambio di vista fatto nel seed insieme alle colonne farebbe morire il
#     migrate a meta'. Per il seed giudicano il pgTAP
#     ui/test-lista-colonna-campo-sorgente-in-vista-v1 e il presidio
#     dbops.vw_liste_colonne_campo_orfano (Q32), che vede anche una vista che perde
#     colonne con un DDL, dove nessun trigger di ui scatta.
#
# Il trigger resta com'e' (BEFORE INSERT OR UPDATE OF vista_sql, schema_dati,
#   attivo): le tre colonne che il corpo giudica.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261120-47-update-trgfn-lista-definizione-valida-vista-sql-colonne-mctit.yaml

  - changeSet:
      id: 20261120-47-update-trgfn-lista-definizione-valida-vista-sql-colonne
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.trgfn_ui_lista_definizione_a10_valida_vista_sql: la relazione dal BB, le colonne orfane
        rifiutate al cambio di vista e alla riaccensione. Brief: brief-db-revisione-ui (giro 4, U27, Q35).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_lista_relazione_ha_attributo'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.trgfn_ui_lista_definizione_a10_valida_vista_sql()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: la relazione di una lista accesa esiste nel suo schema e,
              -- quando l'applicazione cambia la vista o riaccende la lista, ha
              -- ancora i campi delle sue colonne VISTA.
              -- Lista spenta o senza vista: niente da verificare (la verifica
              -- arriva con la riaccensione).
              DECLARE
                v_orfane text;
              BEGIN
                IF NEW.vista_sql IS NULL OR NEW.attivo IS NOT TRUE THEN
                  RETURN NEW;
                END IF;

                IF NOT ui.fn_lista_relazione_ha_attributo(NEW.schema_dati, NEW.vista_sql, NULL) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'ui.trgfn_ui_lista_definizione_a10_valida_vista_sql',
                    'E_UI_VISTA_SQL_NON_TROVATA',
                    jsonb_build_object(
                      'campo', 'vista_sql',
                      'codice', NEW.codice
                    ),
                    NULL,
                    NEW.schema_dati || '.' || NEW.vista_sql
                  );
                END IF;

                -- Le colonne si riverificano solo quando cambia cio' contro cui sono
                -- state giudicate (la relazione) o quando la lista torna accesa, e
                -- solo per l'applicazione: il seed lo giudicano pgTAP e presidio.
                IF TG_OP <> 'UPDATE'
                   OR NOT (NEW.vista_sql   IS DISTINCT FROM OLD.vista_sql
                           OR NEW.schema_dati IS DISTINCT FROM OLD.schema_dati
                           OR OLD.attivo IS NOT TRUE)
                   OR script.fn_is_proprietario_tabella(TG_RELID) THEN
                  RETURN NEW;
                END IF;

                SELECT string_agg(lc.codice, ', ' ORDER BY lc.codice)
                  INTO v_orfane
                  FROM ui.lista_colonna lc
                 WHERE lc.lista_id = NEW.id
                   AND lc.origine_campo = 'VISTA'
                   AND lc.campo_sorgente IS NOT NULL
                   AND NOT ui.fn_lista_relazione_ha_attributo(NEW.schema_dati, NEW.vista_sql,
                                                              lc.campo_sorgente);

                IF v_orfane IS NOT NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'ui.trgfn_ui_lista_definizione_a10_valida_vista_sql',
                    'E_UI_LISTA_COLONNE_ORFANE',
                    jsonb_build_object(
                      'campo', 'vista_sql',
                      'lista_id', NEW.id,
                      'codice', NEW.codice
                    ),
                    NULL,
                    NEW.codice::text,
                    NEW.schema_dati || '.' || NEW.vista_sql,
                    v_orfane
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.trgfn_ui_lista_definizione_a10_valida_vista_sql() IS
                  'Guard BEFORE INSERT OR UPDATE OF vista_sql, schema_dati, attivo su ui.lista_definizione. Su una lista accesa con una vista, la relazione esiste nel suo schema (ui.fn_lista_relazione_ha_attributo: vista, vista materializzata, tabella, tabella partizionata), altrimenti E_UI_VISTA_SQL_NON_TROVATA. Per chi non è il proprietario della tabella, un cambio di vista o di schema e la riaccensione della lista si rifiutano se una colonna VISTA, accesa o spenta, ha un campo che la relazione non ha: E_UI_LISTA_COLONNE_ORFANE, con le colonne nella frase. Il seed lo giudicano il pgTAP del catalogo e il presidio dbops.vw_liste_colonne_campo_orfano. Lista spenta o senza vista: niente da verificare.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' quello di 20260927-30: si ripristina con un
              -- changeSet nuovo, dalla doc auto-generata.
              SELECT 1;
