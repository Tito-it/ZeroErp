# ------------------------------------------------------------
# M-7 — IL GUARD DEI PRESET: ui.trgfn_ui_lista_preset_guard_pagina_dimensione
#   Brief: brief-db-misure-pagina-catalogo, sezione 2 (regola 1) e 3.
#
#   Passa la misura del preset a ui.fn_guard_misura_pagina: il rifiuto parla
#   col codice di catalogo invece del 23503 della FK, che resta come rete (e
#   come blocco alla cancellazione di una misura in uso).
#   ⛔ Il TRIGGER non nasce qui ma in 90_end/20260930-12: da zero i preset si
#   seminano in 80_data prima del catalogo, e un trigger nato in 20_code li
#   rifiuterebbe tutti (brief §3).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260930-07-create-trgfn-ui-lista-preset-guard-pagina-dimensione-mctit.yaml

  - changeSet:
      id: 20260930-07-create-trgfn-ui-lista-preset-guard-pagina-dimensione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.trgfn_ui_lista_preset_guard_pagina_dimensione: la misura di un preset deve stare nel
        catalogo ui.misure_pagina (ui.fn_guard_misura_pagina). Il trigger nasce in 90_end/20260930-12.
        Brief: brief-db-misure-pagina-catalogo §2-3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_guard_misura_pagina';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.trgfn_ui_lista_preset_guard_pagina_dimensione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: la misura «righe per pagina» di un preset e' del catalogo.
              BEGIN
                  PERFORM ui.fn_guard_misura_pagina(to_jsonb(NEW.pagina_dimensione));
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION ui.trgfn_ui_lista_preset_guard_pagina_dimensione() IS
                  'Guard di ui.lista_preset: pagina_dimensione deve stare nel catalogo ui.misure_pagina (NULL = il default). Chiede a ui.fn_guard_misura_pagina, che rifiuta con E_UI_MISURA_PAGINA_NON_AMMESSA invece del 23503 della FK (che resta come rete). Il trigger nasce in 90_end/20260930-12, dopo il seed dei preset. Brief: brief-db-misure-pagina-catalogo §2-3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS ui.trgfn_ui_lista_preset_guard_pagina_dimensione();
