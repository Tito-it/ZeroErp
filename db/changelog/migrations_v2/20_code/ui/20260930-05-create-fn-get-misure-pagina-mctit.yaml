# M-5 — LE MISURE PER L'APPLICAZIONE: ui.fn_get_misure_pagina()
#   Brief: brief-db-misure-pagina-catalogo, sezione 2 (regola 4) e §6.
#
#   Una lettura sola per il backend, che la serve a TUTTA l'applicazione (le
#   costanti del frontend che sostituisce stanno anche in tabelle grezze,
#   dialog e dashboard, non solo nelle liste configurabili):
#     {"misure": [10, 25, 50, 100], "default_compatta": 10, "default_pagina": 25}
#   Le misure in ordine crescente (e' l'ordine del selettore). I default dal BB
#   ui.fn_misura_pagina_default: se ne manca uno, l'errore parla.
#   LANGUAGE sql, STABLE, INVOKER: l'app ha SELECT sul catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260930-05-create-fn-get-misure-pagina-mctit.yaml

  - changeSet:
      id: 20260930-05-create-fn-get-misure-pagina
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_get_misure_pagina() -> jsonb {misure, default_compatta, default_pagina}: le misure
        «righe per pagina» ammesse e i due default, per tutta l'applicazione. Brief:
        brief-db-misure-pagina-catalogo §2, §6.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_misura_pagina_default';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_get_misure_pagina()
              RETURNS jsonb
              LANGUAGE sql
              STABLE
              AS $function$
                  -- Scopo: le misure «righe per pagina» ammesse, in ordine, e i due
                  --   default: la lettura unica per l'applicazione.
                  SELECT jsonb_build_object(
                             'misure',           (SELECT COALESCE(jsonb_agg(m.misura ORDER BY m.misura), jsonb_build_array())
                                                    FROM ui.misure_pagina m),
                             'default_compatta', ui.fn_misura_pagina_default('COMPATTA'),
                             'default_pagina',   ui.fn_misura_pagina_default('PAGINA'));
              $function$;

              COMMENT ON FUNCTION ui.fn_get_misure_pagina() IS
                  'Le misure «righe per pagina» per TUTTA l''applicazione, in una lettura: {"misure": [...] in ordine crescente, "default_compatta": drawer e dialog, "default_pagina": pagine}. Dal catalogo ui.misure_pagina; i default da ui.fn_misura_pagina_default (se ne manca uno solleva, mai NULL). La serve il backend a ogni paginatore: sostituisce le costanti PAGINATION del frontend (decisioni di Tid del 2026-09-29). STABLE, INVOKER. Brief: brief-db-misure-pagina-catalogo §2, §6.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS ui.fn_get_misure_pagina();
