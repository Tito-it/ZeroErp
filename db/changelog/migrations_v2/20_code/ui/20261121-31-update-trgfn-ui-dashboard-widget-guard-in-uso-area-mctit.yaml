# ui.trgfn_ui_dashboard_widget_guard_in_uso: l'area del log e' 'database', come gli altri guard di ui.
#   Brief: brief-db-revisione-ui (giro 6a: U38, i codici d'area allineati).
#
# Il guard (il pool delle dashboard, ui.dashboard_widget) passava 'ui' come area a script.fn_log_and_raise_error, che la
#   scrive nel giornale degli errori: gli altri guard e building block dello schema
#   passano 'database'. Il guard multi-emittente, nominato da U38, non c'e' piu'
#   (lo ha sostituito ui.trgfn_lista_definizione_guard_dichiarazioni, gia'
#   allineato): restavano questo e il suo gemello del giro 2. Cambia solo il primo
#   argomento della chiamata; codice, contesto e segnaposto restano.
# Firma, volatilita' e sicurezza invariate: CREATE OR REPLACE. Attributi vivi letti
#   il 2026-11-22: COST 100, nessun SET, PARALLEL UNSAFE. Il COMMENT resta.
# Corpo dal vivo (dbdev, 2026-11-22); la rollback riporta quel corpo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261121-31-update-trgfn-ui-dashboard-widget-guard-in-uso-area-mctit.yaml

  - changeSet:
      id: 20261121-31-update-trgfn-ui-dashboard-widget-guard-in-uso-area
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.trgfn_ui_dashboard_widget_guard_in_uso: l'area del log e' 'database', come gli altri guard di ui. Brief: brief-db-revisione-ui (giro 6a, U38).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'trgfn_ui_dashboard_widget_guard_in_uso'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.trgfn_ui_dashboard_widget_guard_in_uso()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: rifiutare il DELETE dal pool di un widget che un preset della
              --   stessa dashboard propone, nominando i preset.
              DECLARE
                  v_widget ui.widget.codice%TYPE;
                  -- text: i codici dei preset, per la frase; non il riflesso di una colonna
                  v_preset text;
              BEGIN
                  SELECT string_agg(dp.codice, ', ' ORDER BY dp.codice)
                    INTO v_preset
                    FROM ui.dashboard_preset_widget pw
                    JOIN ui.dashboard_preset dp ON dp.id = pw.preset_id
                   WHERE pw.dashboard_id = OLD.dashboard_id
                     AND pw.widget_id    = OLD.widget_id;

                  IF v_preset IS NOT NULL THEN
                      SELECT w.codice INTO v_widget FROM ui.widget w WHERE w.id = OLD.widget_id;
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text, 'E_UI_WIDGET_IN_USO',
                          jsonb_build_object(
                              'table',        TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'dashboard_id', OLD.dashboard_id,
                              'widget_id',    OLD.widget_id,
                              'preset',       v_preset),
                          NULL::uuid,
                          VARIADIC ARRAY[COALESCE(v_widget::text, OLD.widget_id::text), v_preset]);
                  END IF;
                  RETURN OLD;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
