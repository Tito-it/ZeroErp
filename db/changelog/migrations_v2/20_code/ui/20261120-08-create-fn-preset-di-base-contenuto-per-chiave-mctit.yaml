# ------------------------------------------------------------
# ui.fn_preset_di_base: si ricrea sulla data del contenuto per chiave.
#   Brief: brief-db-revisione-ui (giro 1b: U6 con Q39, decisa da Tid il
#   2026-11-20).
#
# Perche': il corpo BEGIN ATOMIC dipende da contenuto_aggiornato_il dei preset, e
#   l'ALTER TYPE di 20261120-04 non passa finche' la funzione c'e'
#   (linee-guida-sql §5c): -04 la toglie, questo changeSet la ricrea nello
#   stesso rilascio. Corpo e firma identici a 20261119-11; la colonna
#   contenuto_aggiornato_il del RETURNS TABLE e' ancorata con %TYPE e ora si
#   scioglie in jsonb, la mappa {chiave: data}. Il COMMENT si riscrive per
#   intero: il DROP lo ha portato via.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261120-08-create-fn-preset-di-base-contenuto-per-chiave-mctit.yaml

  - changeSet:
      id: 20261120-08-create-fn-preset-di-base-contenuto-per-chiave
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_preset_di_base: ricreata sulla data del contenuto per chiave. Brief: brief-db-revisione-ui (giro 1b).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_preset_di_base'
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_attribute
               WHERE attrelid = to_regclass('ui.lista_preset')
                 AND attname = 'contenuto_aggiornato_il' AND atttypid = 'jsonb'::regtype AND NOT attisdropped
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION ui.fn_preset_di_base(
                  -- text: 'lista' o 'dashboard', la famiglia; non il riflesso di una colonna
                  p_famiglia            text,
                  -- la lista o la dashboard (ui.lista_definizione.id o ui.dashboard_definizione.id)
                  p_contenitore_id      ui.lista_definizione.id%TYPE,
                  -- integer: l'id di django.auth_user, tabella dell'applicazione: un changeSet non
                  -- la cita con %TYPE (lo schema django e' del provisioning)
                  p_auth_user_id        integer,
                  p_veste               config.ruolo_applicativo,
                  p_emittente_fiscale_id ui.lista_preset.emittente_fiscale_id%TYPE)
               RETURNS TABLE (
                  preset_id               ui.lista_preset.id%TYPE,
                  ambito                  ui.lista_preset.ambito%TYPE,
                  contenuto_aggiornato_il ui.lista_preset.contenuto_aggiornato_il%TYPE)
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
                  WITH profili AS MATERIALIZED (
                      SELECT pa.profilo_accesso_id, pa.priorita
                        FROM script.fn_get_profili_accesso_applicabili(fn_preset_di_base.p_auth_user_id,
                                                                        fn_preset_di_base.p_veste) pa
                       WHERE fn_preset_di_base.p_veste IS NOT NULL
                  ),
                  candidati AS (
                      SELECT lp.id, lp.ambito, lp.profilo_accesso_id,
                             lp.emittente_fiscale_id, lp.contenuto_aggiornato_il
                        FROM ui.lista_preset lp
                       WHERE fn_preset_di_base.p_famiglia = 'lista'
                         AND lp.lista_id = fn_preset_di_base.p_contenitore_id
                         AND lp.attivo
                         AND EXISTS (SELECT 1
                                       FROM ui.lista_preset_colonna pc
                                       JOIN ui.lista_colonna lc ON lc.id = pc.colonna_id
                                      WHERE pc.preset_id = lp.id
                                        AND lc.attivo)
                      UNION ALL
                      SELECT dp.id, dp.ambito, dp.profilo_accesso_id,
                             dp.emittente_fiscale_id::bigint, dp.contenuto_aggiornato_il
                        FROM ui.dashboard_preset dp
                       WHERE fn_preset_di_base.p_famiglia = 'dashboard'
                         AND dp.dashboard_id = fn_preset_di_base.p_contenitore_id
                         AND dp.attivo
                         AND EXISTS (SELECT 1
                                       FROM ui.dashboard_preset_widget pw
                                       JOIN ui.widget w ON w.id = pw.widget_id
                                       JOIN ui.dashboard_widget dw
                                         ON dw.dashboard_id = dp.dashboard_id
                                        AND dw.widget_id    = w.id
                                      WHERE pw.preset_id = dp.id
                                        AND w.attivo)
                  )
                  SELECT c.id, c.ambito, c.contenuto_aggiornato_il
                    FROM candidati c
                    LEFT JOIN profili pr
                      ON c.ambito = 'ruolo'
                     AND pr.profilo_accesso_id = c.profilo_accesso_id
                   WHERE (c.ambito = 'ruolo' AND pr.profilo_accesso_id IS NOT NULL)
                      OR (c.ambito = 'emittente_fiscale'
                          AND c.emittente_fiscale_id = fn_preset_di_base.p_emittente_fiscale_id
                          AND EXISTS (SELECT 1 FROM anagrafiche.emittenti_fiscali ef
                                       WHERE ef.id = c.emittente_fiscale_id
                                         AND ef.attivo))
                      OR c.ambito = 'sistema'
                   ORDER BY CASE c.ambito WHEN 'ruolo' THEN 1
                                          WHEN 'emittente_fiscale' THEN 2
                                          ELSE 3 END,
                            pr.priorita
                   LIMIT 1;
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.fn_preset_di_base(text, integer, integer, config.ruolo_applicativo, bigint) IS
                  'Il preset di base di una lista (p_famiglia = ''lista'') o di una dashboard (''dashboard'') per un utente: lo standard delle chiavi che la preferenza non ha, e la base del banner del preset aggiornato. Un candidato vale se e'' acceso e ha contenuto: almeno una colonna attiva; per la dashboard almeno un widget acceso che sta nel pool. Ordine: il preset di ruolo del profilo applicabile piu'' prioritario, solo con la veste valorizzata (con la veste NULL il passo del ruolo si salta: il ripiego non allarga e non sceglie per id); poi quello dell''azienda p_emittente_fiscale_id, se l''azienda e'' accesa; poi quello di sistema. Un posto ha al piu'' un preset acceso (uq_ui_lista_preset_posto, uq_ui_dashboard_preset_posto): la scelta e'' deterministica. Una riga (id, ambito, contenuto_aggiornato_il: la mappa {chiave: data} del contenuto del preset) o nessuna. La leggono ui.fn_resolve_lista_config e ui.fn_resolve_dashboard_config. STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS ui.fn_preset_di_base(text, integer, integer, config.ruolo_applicativo, bigint);
