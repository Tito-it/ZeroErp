# IN QUALI COLONNE PUO' CERCARE CHI STA GUARDANDO LA LISTA
#   ui.fn_lista_colonne_ricerca_full(lista_codice)
#   Piano: brief-db-ricerca-full-colonne-permessi, sezione 3.5
#   Richiesta: team BE, 2026-09-23 (ricerca libera letta dal catalogo)
#
# -- COSA RESTITUISCE -------------------------------------------
#   Codice e campo_sorgente delle colonne della lista che sono, insieme:
#   attive, `ricercabile_full`, con un campo_sorgente valorizzato, e con un
#   livello effettivo diverso da BLOCCATO per l'utente corrente.
#   LETTURA entra: spegne l'export, non la vista, e cio' che si vede si cerca.
#
# -- PERCHE' IL LIVELLO VIENE DAL BB ----------------------------
#   Se un utente non vede una colonna, non deve poterci cercare dentro: la
#   lista gli mostrerebbe righe trovate per un valore che non puo' leggere.
#   Il livello e' quindi quello di ui.fn_resolve_lista_config, e lo e' per
#   costruzione: entrambe lo leggono da ui.fn_lista_colonne_livello
#   (20260923-12), non da due calcoli che si somigliano.
#
# -- IL CONTESTO DALLA SESSIONE ---------------------------------
#   Utente da `app.current_user_id`, veste da ui.fn_veste_corrente(): la firma
#   e' il solo codice della lista, come chiesto. L'emittente NON serve: i
#   grant di colonna sono per profilo d'accesso, e nel risolutore l'emittente
#   sceglie solo il preset. Non si legge una GUC che non decide niente.
#
# ATTENZIONE: senza `app.current_user_id` (un command, un job) l'utente e'
#   NULL, i profili sono zero e restano i livelli di ripiego: le colonne
#   sensibili ESCONO, le altre restano. Fail-closed dove conta.
#
# ATTENZIONE: «campo_sorgente valorizzato» si scrive come lo scrive il guard
#   (`COALESCE(btrim(...), '') <> ''`), non `IS NOT NULL`: il loader del
#   catalogo scrive la stringa vuota, non il NULL.
#
# Codice d'errore: E_UI_LISTA_NON_TROVATA, gia' registrato (NON_TROVATO), lo
#   stesso del risolutore per la stessa condizione (lista assente o spenta).
# GRANT: nessuno nel changeSet. EXECUTE a PUBLIC e i default privileges del
#   loop di ci_apply coprono zeroerp_app (verificato sui due risolutori).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260923-15-create-fn-lista-colonne-ricerca-full-mctit.yaml

  - changeSet:
      id: 20260923-15-create-fn-lista-colonne-ricerca-full
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_lista_colonne_ricerca_full(lista_codice): codice e campo_sorgente delle colonne in cui
        l'utente corrente puo' fare la ricerca libera — attive, ricercabile_full, campo_sorgente
        valorizzato, livello effettivo diverso da BLOCCATO (dal BB fn_lista_colonne_livello, lo stesso
        del risolutore). Utente e veste dalla sessione. Richiesta del team BE, piano:
        brief-db-ricerca-full-colonne-permessi, sezione 3.5.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_lista_colonne_ricerca_full(
                p_lista_codice ui.lista_definizione.codice%TYPE
              )
               RETURNS TABLE(
                codice         ui.lista_colonna.codice%TYPE,
                campo_sorgente ui.lista_colonna.campo_sorgente%TYPE
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: le colonne di una lista in cui l'utente corrente puo' fare la
              -- ricerca libera, con il campo della vista da interrogare.
              --
              -- Condizioni, tutte insieme:
              --   - colonna attiva e `ricercabile_full`;
              --   - campo_sorgente valorizzato (NULL e '' sono entrambi «vuoto»);
              --   - livello effettivo <> BLOCCATO (LETTURA entra: si vede, si cerca).
              --
              -- Contesto dalla sessione: utente da app.current_user_id, veste da
              -- ui.fn_veste_corrente(). L'emittente non entra nel livello di colonna.
              -- ⚠️ Senza utente: nessun grant, le colonne sensibili escono.
              DECLARE
                v_lista_id     ui.lista_definizione.id%TYPE;
                v_auth_user_id integer := NULLIF(current_setting('app.current_user_id', true), '')::integer;
              BEGIN
                SELECT ld.id
                  INTO v_lista_id
                  FROM ui.lista_definizione ld
                 WHERE ld.codice = p_lista_codice
                   AND ld.attivo = TRUE;

                IF v_lista_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'ui.fn_lista_colonne_ricerca_full',
                    'E_UI_LISTA_NON_TROVATA',
                    jsonb_build_object('detail', format('codice lista: ''%s''', p_lista_codice)),
                    NULL,
                    p_lista_codice
                  );
                END IF;

                RETURN QUERY
                SELECT lc.codice,
                       lc.campo_sorgente
                  FROM ui.lista_colonna lc
                  JOIN ui.fn_lista_colonne_livello(v_lista_id, v_auth_user_id, ui.fn_veste_corrente()) lv
                    ON lv.colonna_id = lc.id
                 WHERE lc.lista_id         = v_lista_id
                   AND lc.attivo           = TRUE
                   AND lc.ricercabile_full = TRUE
                   AND COALESCE(btrim(lc.campo_sorgente), '') <> ''
                   AND lv.livello_accesso <> 'BLOCCATO'
                 ORDER BY lc.ordine_default, lc.codice;
              END;
              $function$;

              COMMENT ON FUNCTION ui.fn_lista_colonne_ricerca_full(character varying)
              IS 'Colonne di una lista in cui l''utente corrente puo'' fare la ricerca libera, con il campo_sorgente da interrogare: attive, ricercabile_full, campo_sorgente valorizzato (NULL e stringa vuota sono vuoto), livello effettivo diverso da BLOCCATO (LETTURA entra). Il livello viene da ui.fn_lista_colonne_livello, lo stesso di fn_resolve_lista_config: non si cerca in una colonna che la lista non mostra. Utente da app.current_user_id, veste da ui.fn_veste_corrente(); l''emittente non entra nel livello di colonna. Senza utente nessun grant: le colonne sensibili escono. Lista assente o spenta: E_UI_LISTA_NON_TROVATA. Richiesta del team BE, 2026-09-23. Brief: brief-db-ricerca-full-colonne-permessi.';
