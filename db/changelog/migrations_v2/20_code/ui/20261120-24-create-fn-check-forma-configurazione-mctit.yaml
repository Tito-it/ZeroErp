# ------------------------------------------------------------
# ui.fn_check_forma_configurazione: la forma della configurazione di una
#   preferenza, comune a liste e dashboard.
#   Brief: brief-db-revisione-ui (giro 2: U12 con Q6, U21 con Q12, Q42 (a);
#   le regole della voce dalla risposta di R-BE2; le chiavi delle liste dopo il
#   ritiro di Q38/Q39 §6).
#
# Perche': della configurazione il DB verificava solo la misura di pagina delle
#   liste; il resto stava nel BE (lista_preferenza_service.py,
#   dashboard_preferenza_service.py), e una riga malformata faceva cadere il
#   resolver con un 22P02 grezzo. Q6 sposta la regola qui; la copia del BE si
#   ritira dopo l'apply (BE8, BE11).
# Contratto: una fn_check_* (linee-guida-sql §5): non solleva sul dato,
#   restituisce il primo motivo come {chiave, motivo}, o NULL se la forma e'
#   buona. Solleva solo sui parametri (E_PARAMETRO_INVALIDO). La chiamano il
#   trigger di forma delle due preferenze (-26), che solleva il codice, e il
#   backfill di forma del ritiro (-25), che verifica di non lasciare righe che il
#   guard rifiuterebbe al prossimo salvataggio.
# Le regole:
#   - la radice e' un oggetto; chiavi della famiglia, nessuna a null: per le
#     liste colonne e pagina_dimensione, per le dashboard widget e
#     dimensione_max. {} e' ammesso (la preferenza segue il preset in tutto);
#     «almeno una chiave» e' una regola dell'API, e resta del BE;
#   - colonne/widget: un array di oggetti, ogni voce con le sole chiavi della
#     famiglia (codice, ordine, larghezza, visibile, fissata; codice, ordine,
#     visibile), nessuna a null. Solo codice e' obbligatorio (R-BE2: il BE toglie
#     i campi a null, quindi a DB un campo puo' mancare, mai essere null);
#   - codice: testo non vuoto, unico nell'elenco, del contenitore in qualsiasi
#     stato (Q42 (a): una colonna spenta si sospende e torna, Q13; un widget del
#     pool della dashboard, acceso o no);
#   - ordine, larghezza: interi positivi, dal BB della misura
#     (ui.fn_intero_da_jsonb, -21): la stringa "25" no;
#   - visibile, fissata: booleani;
#   - dimensione_max: dal BB del tetto (ui.fn_dimensione_max_ammessa, -22);
#   - pagina_dimensione: la giudica ui.fn_guard_misura_pagina, col suo codice
#     (il trigger la chiama dopo questa).
#   Il tetto di 100 voci del widget, che il BE controllava, non si porta: codice
#   unico e del pool lo limitano gia'.
# ⚠️ Piu' stretta del BE su due punti: il codice del contenitore e i codici
#   ripetuti delle colonne. R-BE2 (2026-11-21): il FE di oggi manda le colonne
#   della risoluzione, una voce per codice, e non ne e' toccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261120-24-create-fn-check-forma-configurazione-mctit.yaml

  - changeSet:
      id: 20261120-24-create-fn-check-forma-configurazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_check_forma_configurazione: il primo motivo per cui la configurazione di una preferenza (lista o
        dashboard) non ha la forma ammessa, o NULL. Brief: brief-db-revisione-ui (giro 2, U12, Q6, Q42).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname IN ('fn_intero_da_jsonb', 'fn_dimensione_max_ammessa')
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_check_forma_configurazione'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION ui.fn_check_forma_configurazione(
                  -- text: 'lista' o 'dashboard', la famiglia; non il riflesso di una colonna
                  p_famiglia       text,
                  -- l'id della lista o della dashboard (ui.lista_definizione.id, ui.dashboard_definizione.id: integer tutti e due)
                  p_contenitore_id ui.lista_definizione.id%TYPE,
                  p_configurazione ui.lista_preferenza_utente.configurazione%TYPE)
               -- jsonb: il motivo {chiave, motivo}, o NULL; non il riflesso di una colonna
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  -- text[]: le chiavi ammesse della radice e della voce, per famiglia
                  v_chiavi      text[];
                  v_voce_chiavi text[];
                  -- text: la chiave dell'elenco della famiglia ('colonne' o 'widget')
                  v_elenco      text;
                  -- text, jsonb: chiave e valore della radice, nel ciclo
                  v_k           text;
                  v_v           jsonb;
                  -- jsonb: una voce dell'elenco, nel ciclo
                  v_e           jsonb;
                  -- text: una chiave fuori posto, o il campo di una voce
                  v_fuori       text;
                  v_campo       text;
                  -- i codici gia' visti nell'elenco
                  v_cod         ui.lista_colonna.codice%TYPE;
                  v_codici      ui.lista_colonna.codice%TYPE[] := ARRAY[]::varchar[];
              BEGIN
                  IF p_famiglia IS NULL OR p_famiglia NOT IN ('lista', 'dashboard') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'ui.fn_check_forma_configurazione', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_famiglia', 'valore', p_famiglia),
                          NULL::uuid,
                          'la famiglia della configurazione (lista o dashboard)');
                  END IF;
                  IF p_contenitore_id IS NULL OR p_contenitore_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'ui.fn_check_forma_configurazione', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_contenitore_id', 'valore', p_contenitore_id),
                          NULL::uuid,
                          'l''id della lista o della dashboard');
                  END IF;

                  IF p_configurazione IS NULL OR jsonb_typeof(p_configurazione) <> 'object' THEN
                      RETURN jsonb_build_object('chiave', 'configurazione', 'motivo', 'non è un oggetto');
                  END IF;

                  IF p_famiglia = 'lista' THEN
                      v_chiavi      := ARRAY['colonne', 'pagina_dimensione'];
                      v_elenco      := 'colonne';
                      v_voce_chiavi := ARRAY['codice', 'ordine', 'larghezza', 'visibile', 'fissata'];
                  ELSE
                      v_chiavi      := ARRAY['widget', 'dimensione_max'];
                      v_elenco      := 'widget';
                      v_voce_chiavi := ARRAY['codice', 'ordine', 'visibile'];
                  END IF;

                  FOR v_k, v_v IN
                      SELECT r.key, r.value FROM jsonb_each(p_configurazione) AS r ORDER BY r.key
                  LOOP
                      IF NOT (v_k = ANY (v_chiavi)) THEN
                          RETURN jsonb_build_object('chiave', v_k, 'motivo', 'non è una chiave ammessa');
                      END IF;
                      IF jsonb_typeof(v_v) = 'null' THEN
                          RETURN jsonb_build_object('chiave', v_k, 'motivo', 'è null');
                      END IF;

                      IF v_k = v_elenco THEN
                          IF jsonb_typeof(v_v) <> 'array' THEN
                              RETURN jsonb_build_object('chiave', v_k, 'motivo', 'non è un elenco');
                          END IF;

                          FOR v_e IN SELECT a.value FROM jsonb_array_elements(v_v) AS a LOOP
                              IF jsonb_typeof(v_e) <> 'object' THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo', 'una voce non è un oggetto');
                              END IF;
                              IF jsonb_typeof(v_e -> 'codice') IS DISTINCT FROM 'string'
                                 OR btrim(v_e ->> 'codice') = '' THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo', 'una voce non ha il codice');
                              END IF;
                              v_cod := v_e ->> 'codice';

                              SELECT f.k INTO v_fuori
                                FROM jsonb_object_keys(v_e) AS f(k)
                               WHERE NOT (f.k = ANY (v_voce_chiavi))
                               ORDER BY f.k LIMIT 1;
                              IF v_fuori IS NOT NULL THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                      format('la voce %s ha la chiave %s, non ammessa', v_cod, v_fuori));
                              END IF;
                              SELECT f.key INTO v_campo
                                FROM jsonb_each(v_e) AS f
                               WHERE jsonb_typeof(f.value) = 'null'
                               ORDER BY f.key LIMIT 1;
                              IF v_campo IS NOT NULL THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                      format('la voce %s ha %s null', v_cod, v_campo));
                              END IF;

                              IF v_cod = ANY (v_codici) THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                      format('il codice %s è ripetuto', v_cod));
                              END IF;
                              v_codici := array_append(v_codici, v_cod);

                              IF p_famiglia = 'lista' THEN
                                  IF NOT EXISTS (SELECT 1 FROM ui.lista_colonna lc
                                                  WHERE lc.lista_id = p_contenitore_id
                                                    AND lc.codice   = v_cod) THEN
                                      RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                          format('%s non è una colonna della lista', v_cod));
                                  END IF;
                              ELSE
                                  IF NOT EXISTS (SELECT 1 FROM ui.dashboard_widget dw
                                                   JOIN ui.widget w ON w.id = dw.widget_id
                                                  WHERE dw.dashboard_id = p_contenitore_id
                                                    AND w.codice        = v_cod) THEN
                                      RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                          format('%s non è una card della dashboard', v_cod));
                                  END IF;
                              END IF;

                              -- Interi positivi: ordine (le due famiglie), larghezza (liste).
                              SELECT f.c INTO v_campo
                                FROM unnest(ARRAY['ordine', 'larghezza']) AS f(c)
                               WHERE jsonb_exists(v_e, f.c)
                                 AND COALESCE(ui.fn_intero_da_jsonb(v_e -> f.c), 0) < 1
                               ORDER BY f.c LIMIT 1;
                              IF v_campo IS NOT NULL THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                      format('%s della voce %s non è un intero positivo', v_campo, v_cod));
                              END IF;
                              -- Booleani: visibile (le due famiglie), fissata (liste).
                              SELECT f.c INTO v_campo
                                FROM unnest(ARRAY['fissata', 'visibile']) AS f(c)
                               WHERE jsonb_exists(v_e, f.c)
                                 AND jsonb_typeof(v_e -> f.c) <> 'boolean'
                               ORDER BY f.c LIMIT 1;
                              IF v_campo IS NOT NULL THEN
                                  RETURN jsonb_build_object('chiave', v_k, 'motivo',
                                      format('%s della voce %s non è vero o falso', v_campo, v_cod));
                              END IF;
                          END LOOP;

                      ELSIF v_k = 'dimensione_max' THEN
                          IF NOT ui.fn_dimensione_max_ammessa(ui.fn_intero_da_jsonb(v_v)) THEN
                              RETURN jsonb_build_object('chiave', v_k, 'motivo', 'non è un intero da 1 a 100');
                          END IF;
                      END IF;
                      -- pagina_dimensione: la giudica ui.fn_guard_misura_pagina, col suo codice.
                  END LOOP;

                  RETURN NULL;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.fn_check_forma_configurazione(text, integer, jsonb) IS
                  'Il primo motivo per cui la configurazione di una preferenza non ha la forma ammessa, come {chiave, motivo}, o NULL se la forma è buona. p_famiglia ''lista'' (p_contenitore_id = ui.lista_definizione.id) o ''dashboard'' (ui.dashboard_definizione.id). La radice è un oggetto con le sole chiavi della famiglia, nessuna a null: colonne e pagina_dimensione per le liste, widget e dimensione_max per le dashboard; {} è ammesso. colonne/widget è un elenco di oggetti con le sole chiavi della voce (codice, ordine, larghezza, visibile, fissata; per il widget codice, ordine, visibile), nessuna a null, solo codice obbligatorio: codice testo non vuoto, unico nell''elenco, di una colonna della lista o di una card del pool della dashboard in qualsiasi stato; ordine e larghezza interi positivi (ui.fn_intero_da_jsonb); visibile e fissata booleani. dimensione_max da ui.fn_dimensione_max_ammessa. pagina_dimensione non la giudica: lo fa ui.fn_guard_misura_pagina. Non solleva sul dato; solleva E_PARAMETRO_INVALIDO su una famiglia fuori dalle due o un contenitore NULL o non positivo. La chiama il trigger di forma delle due preferenze (ui.trgfn_preferenza_guard_forma), che solleva E_UI_CONFIGURAZIONE_FORMA. STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS ui.fn_check_forma_configurazione(text, integer, jsonb);
