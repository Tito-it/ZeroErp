# LA RICERCA LIBERA LEGGE LA LISTA DAL BUILDING BLOCK
#   ui.fn_lista_colonne_ricerca_full
#   Piano: brief-db-be-fe-ricerca-soglia-per-lista, sezione 4.3
#
# -- COSA CAMBIA ------------------------------------------------
#   Solo la prima lettura: «lista dal codice, o E_UI_LISTA_NON_TROVATA» era
#   la seconda copia di quella del risolutore. Con il BB
#   ui.fn_lista_da_codice (20260925-76) la copia si ritira nello stesso giro
#   (regola del 2).
#
# -- COSA NON CAMBIA --------------------------------------------
#   Firma, RETURNS TABLE, volatilita', colonne restituite e loro ordine; lo
#   stesso codice d'errore sulla stessa condizione (nel log lo firma il BB).
#   ⚠️ La soglia della ricerca NON entra in questo risultato: e' una
#   proprieta' della lista, non delle colonne, e ripeterla su ogni riga
#   sparirebbe proprio quando le colonne ricercabili sono zero. Il backend la
#   legge dal BB (SELECT ricerca_min_caratteri FROM ui.fn_lista_da_codice(...)).
#
# -- IL CORPO VIENE DALL'OGGETTO VIVO ---------------------------
#   Estratto da `pg_get_functiondef` il 2026-09-25 (identico alla doc
#   auto-gen), sostituzioni puntuali a occorrenza unica. COMMENT vivo, con la
#   frase sull'errore aggiornata.
#   ⚠️ pg_get_functiondef SCIOGLIE i %TYPE nei tipi base: firma, RETURNS TABLE
#   e DECLARE sono stati ri-ancorati alle colonne (stessi tipi, quindi
#   stessa firma: CREATE OR REPLACE resta valido). Nudi restano solo i valori
#   calcolati senza colonna d'origine (array, conteggi, JSONB composti).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260925-78-update-fn-lista-colonne-ricerca-full-lista-dal-bb-mctit.yaml

  - changeSet:
      id: 20260925-78-update-fn-lista-colonne-ricerca-full-lista-dal-bb
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        La ricerca libera legge la lista dal BB ui.fn_lista_da_codice: la copia inline di «lista dal
        codice o E_UI_LISTA_NON_TROVATA» si ritira nello stesso giro in cui nasce la sede. Contratto
        invariato. Corpo estratto dall'oggetto vivo. Piano: brief-db-be-fe-ricerca-soglia-per-lista,
        sezione 4.3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui'
                 AND p.proname = 'fn_lista_da_codice';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_lista_colonne_ricerca_full(
                p_lista_codice ui.lista_definizione.codice%TYPE
              )
               RETURNS TABLE(
                codice         ui.lista_colonna.codice%TYPE,
                campo_sorgente ui.lista_colonna.campo_sorgente%TYPE
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: le colonne di una lista in cui l'utente corrente puo' fare la
              -- ricerca libera, con il campo della vista da interrogare.
              --
              -- Condizioni, tutte insieme:
              --   - colonna attiva e `ricercabile_full`;
              --   - campo_sorgente valorizzato (NULL e '' sono entrambi «vuoto»);
              --   - livello effettivo <> BLOCCATO (LETTURA entra: si vede, si cerca).
              --
              -- Contesto dalla sessione: utente da app.current_user_id, veste da
              -- ui.fn_veste_corrente(). L'emittente non entra nel livello di colonna.
              -- ⚠️ Senza utente: nessun grant, le colonne sensibili escono.
              -- 2026-09-25: la lista dal codice la legge ui.fn_lista_da_codice(), il BB
              -- condiviso col risolutore delle liste (stesso E_UI_LISTA_NON_TROVATA).
              DECLARE
                v_lista_id     ui.lista_definizione.id%TYPE;
                v_auth_user_id ui.lista_preferenza_utente.auth_user_id%TYPE := NULLIF(current_setting('app.current_user_id', true), '')::integer;
              BEGIN
                -- Lista assente o spenta: E_UI_LISTA_NON_TROVATA, sollevato dal BB.
                v_lista_id := (ui.fn_lista_da_codice(p_lista_codice)).id;

                RETURN QUERY
                SELECT lc.codice,
                       lc.campo_sorgente
                  FROM ui.lista_colonna lc
                  JOIN ui.fn_lista_colonne_livello(v_lista_id, v_auth_user_id, ui.fn_veste_corrente()) lv
                    ON lv.colonna_id = lc.id
                 WHERE lc.lista_id         = v_lista_id
                   AND lc.attivo           = TRUE
                   AND lc.ricercabile_full = TRUE
                   AND COALESCE(btrim(lc.campo_sorgente), '') <> ''
                   AND lv.livello_accesso <> 'BLOCCATO'
                 ORDER BY lc.ordine_default, lc.codice;
              END;
              $function$;

              COMMENT ON FUNCTION ui.fn_lista_colonne_ricerca_full(character varying)
              IS 'Colonne di una lista in cui l''utente corrente puo'' fare la ricerca libera, con il campo_sorgente da interrogare: attive, ricercabile_full, campo_sorgente valorizzato (NULL e stringa vuota sono vuoto), livello effettivo diverso da BLOCCATO (LETTURA entra). Il livello viene da ui.fn_lista_colonne_livello, lo stesso di fn_resolve_lista_config: non si cerca in una colonna che la lista non mostra. Utente da app.current_user_id, veste da ui.fn_veste_corrente(); l''emittente non entra nel livello di colonna. Senza utente nessun grant: le colonne sensibili escono. Lista assente o spenta: E_UI_LISTA_NON_TROVATA, dal building block ui.fn_lista_da_codice (2026-09-25), lo stesso del risolutore. Richiesta del team BE, 2026-09-23. Brief: brief-db-ricerca-full-colonne-permessi.';
