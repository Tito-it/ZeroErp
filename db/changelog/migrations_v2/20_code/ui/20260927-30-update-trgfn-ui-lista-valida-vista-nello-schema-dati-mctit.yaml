# LA VISTA DI UNA LISTA SI CERCA NEL SUO SCHEMA
#   Brief: brief-db-liste-datatable-grezze.md §8 punto 7 (Tid, 2026-09-27)
#
#   I due trigger che validano il catalogo delle liste cercavano la relazione
#   per NOME, in qualunque schema:
#     - ui.trgfn_ui_lista_definizione_a10_valida_vista_sql: «vista_sql esiste?»
#     - ui.trgfn_ui_lista_colonna_a10_valida_campo_sorgente: «il campo_sorgente
#       e' una colonna di quella vista?»
#   Con due relazioni omonime in schemi diversi — `comuni` esiste in `config`
#   e in `storico`, e lo schema `storico` ha una gemella per ogni tabella
#   storicizzata — il primo diceva «esiste» guardando quella sbagliata, e il
#   secondo accettava un campo che esiste in UNA delle due. Il controllo
#   passava su un oggetto che la lista non legge.
#
#   ⭐ Lo schema e' gia' dichiarato nella riga: `ui.lista_definizione.schema_dati`
#   (NOT NULL). Verificato il 2026-09-27 che tutte le liste con `vista_sql` a
#   catalogo hanno la vista nel proprio `schema_dati`, e che ogni loro
#   `campo_sorgente` (anche delle colonne spente) regge contro la relazione
#   qualificata: la correzione non rompe nessuna riga esistente.
#
#   Cosa cambia oltre al filtro:
#     - il trigger della definizione scatta anche su `UPDATE OF schema_dati`:
#       spostare lo schema cambia la relazione tanto quanto cambiare il nome;
#     - il valore nel messaggio e' il nome QUALIFICATO (`schema.vista`): la
#       frase a catalogo ha lo stesso segnaposto, ora dice dove ha cercato.
#
#   ⛔ NON si e' aggiunta la ri-validazione delle colonne quando cambia la
#   vista della lista: il CSV delle definizioni si carica PRIMA di quello delle
#   colonne, e una lista che cambia vista insieme alle sue colonne farebbe
#   morire il migrate a meta'. Quel buco lo presidia un pgTAP sull'intero
#   catalogo (db/pgtap/ui/test-lista-colonna-campo-sorgente-in-vista-v1.sql).
#
#   Corpi di partenza: la doc auto-generata (docs/it/dbzero/ui/funzioni/).
#   I due trigger sono scritti a mano (20260506-10/-11), non da `ci_apply`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260927-30-update-trgfn-ui-lista-valida-vista-nello-schema-dati-mctit.yaml

  - changeSet:
      id: 20260927-30-update-trgfn-ui-lista-valida-vista-nello-schema-dati
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.trgfn_ui_lista_definizione_a10_valida_vista_sql e
        ui.trgfn_ui_lista_colonna_a10_valida_campo_sorgente cercano la vista in
        lista_definizione.schema_dati e non piu' per solo nome; il trigger della
        definizione scatta anche su UPDATE OF schema_dati. Brief:
        brief-db-liste-datatable-grezze.md §8 punto 7.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: ui
            tableName: lista_definizione
            columnName: schema_dati
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.trgfn_ui_lista_definizione_a10_valida_vista_sql()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: verifica che NEW.vista_sql esista come relazione (view o table)
              -- NELLO SCHEMA NEW.schema_dati prima di permettere INSERT/UPDATE su
              -- lista_definizione.
              -- Skip se vista_sql e' NULL o se attivo=FALSE (lista disattivata).
              -- rev 2026-09-27: la relazione si cerca nel suo schema, non per solo
              --   nome (due omonime in schemi diversi: `comuni` in config e storico).
              DECLARE
                v_relazione_esiste BOOLEAN;
              BEGIN
                -- Nessuna validazione se vista_sql non e' valorizzata o lista non attiva
                IF NEW.vista_sql IS NULL OR NEW.attivo = FALSE THEN
                  RETURN NEW;
                END IF;

                -- Controlla esistenza della relazione nello schema della lista
                SELECT EXISTS (
                  SELECT 1
                    FROM pg_catalog.pg_class c
                    JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = NEW.schema_dati
                     AND c.relname = NEW.vista_sql
                     AND c.relkind IN ('v', 'm', 'r')
                     -- v=view, m=materialized view, r=table (raro ma ammesso)
                ) INTO v_relazione_esiste;

                IF NOT v_relazione_esiste THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'ui.trgfn_ui_lista_definizione_a10_valida_vista_sql',
                    'E_UI_VISTA_SQL_NON_TROVATA',
                    jsonb_build_object(
                      'detail', format('vista_sql = ''%s.%s'' non trovata in pg_catalog',
                                       NEW.schema_dati, NEW.vista_sql),
                      'codice', NEW.codice
                    ),
                    NULL,
                    NEW.schema_dati || '.' || NEW.vista_sql
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION ui.trgfn_ui_lista_colonna_a10_valida_campo_sorgente()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: verifica che campo_sorgente esista come attributo della view
              -- referenziata da lista_definizione.vista_sql NELLO SCHEMA
              -- lista_definizione.schema_dati, prima di permettere INSERT/UPDATE su
              -- lista_colonna.
              -- Skip per:
              --   - tipo_colonna='azione'           (nessun campo sorgente per disegno)
              --   - campo_sorgente IS NULL o ''     (colonna calcolata FE, es. sosp_riatt)
              --   - lista senza vista_sql definita
              -- rev 2026-09-27: la vista si cerca nel suo schema, non per solo nome.
              DECLARE
                v_vista_sql        ui.lista_definizione.vista_sql%TYPE;
                v_schema_dati      ui.lista_definizione.schema_dati%TYPE;
                v_colonna_esiste   BOOLEAN;
              BEGIN
                -- Le colonne di tipo 'azione' non hanno campo_sorgente
                IF NEW.tipo_colonna = 'azione' THEN
                  RETURN NEW;
                END IF;

                -- Nessuna validazione se campo_sorgente non valorizzato
                -- (NULL = colonna calcolata; '' = equivalente nel seed CSV via loadUpdateData)
                IF NEW.campo_sorgente IS NULL OR NEW.campo_sorgente = '' THEN
                  RETURN NEW;
                END IF;

                -- Recupera vista_sql e schema dalla lista padre
                SELECT ld.vista_sql, ld.schema_dati
                  INTO v_vista_sql, v_schema_dati
                  FROM ui.lista_definizione ld
                 WHERE ld.id = NEW.lista_id;

                -- Se la lista non ha una view definita, skip
                IF v_vista_sql IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Verifica esistenza della colonna nella relazione del suo schema
                SELECT EXISTS (
                  SELECT 1
                    FROM pg_catalog.pg_class c
                    JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                    JOIN pg_catalog.pg_attribute a ON a.attrelid = c.oid
                   WHERE n.nspname = v_schema_dati
                     AND c.relname = v_vista_sql
                     AND c.relkind IN ('v', 'm', 'r')
                     AND a.attname = NEW.campo_sorgente
                     AND a.attnum > 0
                     AND NOT a.attisdropped
                ) INTO v_colonna_esiste;

                IF NOT v_colonna_esiste THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'ui.trgfn_ui_lista_colonna_a10_valida_campo_sorgente',
                    'E_UI_CAMPO_SORGENTE_NON_TROVATO',
                    jsonb_build_object(
                      'detail', format('campo_sorgente = ''%s'' non trovato nella view ''%s.%s''',
                                       NEW.campo_sorgente, v_schema_dati, v_vista_sql),
                      'lista_id', NEW.lista_id,
                      'codice', NEW.codice
                    ),
                    NULL,
                    NEW.campo_sorgente,
                    v_schema_dati || '.' || v_vista_sql
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              -- Il trigger della definizione scatta anche quando cambia lo schema.
              DROP TRIGGER IF EXISTS trg_ui_lista_definizione_a10_valida_vista_sql_ins_upd
                  ON ui.lista_definizione;

              CREATE TRIGGER trg_ui_lista_definizione_a10_valida_vista_sql_ins_upd
              BEFORE INSERT OR UPDATE OF vista_sql, schema_dati, attivo ON ui.lista_definizione
              FOR EACH ROW
              EXECUTE FUNCTION ui.trgfn_ui_lista_definizione_a10_valida_vista_sql();
      rollback:
        - sql:
            sql: |
              -- I corpi precedenti sono in 20260506-10 e 20260508-03: si
              -- ripristinano da li' se serve davvero.
              SELECT 1;
