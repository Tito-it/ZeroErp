# ------------------------------------------------------------
# ui.fn_preset_impronta: l'impronta della composizione di un preset, una sede
#   per liste e dashboard.
#   Brief: brief-db-revisione-ui (giro 1b: Q33 col mezzo di Q37, deciso da Tid
#   il 2026-11-20).
#
# Perche': la data del contenuto deve spostarsi quando la composizione cambia,
#   non quando qualcuno la riscrive uguale (il DELETE + INSERT identico del BE,
#   il mirror del seed). Un trigger per istruzione non lo vede: il DELETE e
#   l'INSERT sono due istruzioni, e ciascuna vede solo la sua meta'. Il preset
#   salva quindi l'impronta della composizione (ui.*_preset.composizione_impronta,
#   nata nuda in 20261120-02, riempita in -04), e il trigger differito della composizione la confronta a
#   fine transazione (20261120-06).
# Le colonne dell'impronta sono il contenuto della riga, nominate una per una:
#   una colonna nuova di contenuto entra qui, nello stesso changeSet che la crea.
#   L'ordine e' per colonna (o widget), cosi' l'ordine fisico delle righe non
#   conta.
# Il risultato e' ancorato alla colonna che lo riflette (%TYPE): per questo la
#   colonna nasce prima (-02), e il backfill viene dopo (-04).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261120-03-create-fn-preset-impronta-mctit.yaml

  - changeSet:
      id: 20261120-03-create-fn-preset-impronta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_preset_impronta: l'impronta della composizione di un preset di lista o di dashboard.
        Brief: brief-db-revisione-ui (giro 1b, Q33, Q37).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_catalog.pg_attribute
               WHERE attrelid IN (to_regclass('ui.lista_preset'), to_regclass('ui.dashboard_preset'))
                 AND attname = 'composizione_impronta' AND NOT attisdropped
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_preset_impronta'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION ui.fn_preset_impronta(
                  -- text: 'lista' o 'dashboard', la famiglia; non il riflesso di una colonna
                  p_famiglia  text,
                  -- l'id del preset (ui.lista_preset.id o ui.dashboard_preset.id, integer tutti e due)
                  p_preset_id ui.lista_preset.id%TYPE)
               RETURNS ui.lista_preset.composizione_impronta%TYPE
               LANGUAGE sql
               STABLE PARALLEL SAFE
              BEGIN ATOMIC
                  SELECT CASE fn_preset_impronta.p_famiglia
                      WHEN 'lista' THEN
                          (SELECT md5(COALESCE(jsonb_agg(jsonb_build_array(pc.colonna_id, pc.ordine, pc.larghezza,
                                                                           pc.visibile, pc.fissata)
                                                         ORDER BY pc.colonna_id),
                                               '[]'::jsonb)::text)
                             FROM ui.lista_preset_colonna pc
                            WHERE pc.preset_id = fn_preset_impronta.p_preset_id)
                      WHEN 'dashboard' THEN
                          (SELECT md5(COALESCE(jsonb_agg(jsonb_build_array(pw.widget_id, pw.ordine, pw.visibile)
                                                         ORDER BY pw.widget_id),
                                               '[]'::jsonb)::text)
                             FROM ui.dashboard_preset_widget pw
                            WHERE pw.preset_id = fn_preset_impronta.p_preset_id)
                  END;
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.fn_preset_impronta(text, integer) IS
                  'L''impronta della composizione di un preset: l''md5 delle sue righe, ordinate per colonna (p_famiglia = ''lista'': colonna_id, ordine, larghezza, visibile, fissata di ui.lista_preset_colonna) o per widget (''dashboard'': widget_id, ordine, visibile di ui.dashboard_preset_widget). Due composizioni con le stesse righe hanno la stessa impronta, in qualunque ordine e con qualunque numero di riscritture siano nate; un preset senza righe ha l''impronta dell''insieme vuoto. Famiglia fuori dalle due: NULL. Una colonna nuova di contenuto della composizione entra qui. La scrive in ui.lista_preset.composizione_impronta e ui.dashboard_preset.composizione_impronta il trigger differito ui.trgfn_preset_riga_tocca_preset; la confronta con OLD ui.trgfn_preset_contenuto_aggiornato. STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS ui.fn_preset_impronta(text, integer);
