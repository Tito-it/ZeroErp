# ------------------------------------------------------------
# DEF-2: aggiorna ui.fn_resolve_lista_config per esporre il flag
# preset_aggiornato nel JSONB di ritorno.
#
# Logica (step 2.5, dopo la cascata configurazione):
#   preset_aggiornato = TRUE sse:
#     (a) la preferenza utente ha un preset di base (preset_base_id IS NOT NULL)
#     (b) lo snapshot del preset e' valorizzato (preset_base_data_update IS NOT NULL)
#     (c) il preset e' stato modificato dopo lo snapshot
#         (lista_preset.data_update > preset_base_data_update)
#     (d) l'utente non ha ancora ignorato questo aggiornamento, OPPURE
#         il preset e' stato modificato di nuovo dopo l'ultimo ignore
#         (preset_aggiornato_ignored_at IS NULL OR
#          preset_aggiornato_ignored_at < lista_preset.data_update)
#
# In tutti gli altri casi (nessuna preferenza, preset_base_id NULL,
# snapshot allineato, ignore attivo) il flag e' FALSE.
#
# Stessa firma (p_lista_codice, p_auth_user_id, p_emittente_fiscale_id)
# e stesso RETURNS JSONB: CREATE OR REPLACE senza DROP.
# Tutti i tipi TIMESTAMP WITHOUT TIME ZONE per coerenza con le colonne
# preset_base_data_update e lista_preset.data_update.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260511-02-update-fn-ui-resolve-lista-config-preset-aggiornato-mctit.yaml

  - changeSet:
      id: 20260511-02-update-fn-ui-resolve-lista-config-preset-aggiornato
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DEF-2: aggiunge step 2.5 e chiave preset_aggiornato al JSONB
        di ritorno di ui.fn_resolve_lista_config. Flag TRUE se il preset
        di base e' stato modificato dopo lo snapshot della preferenza utente
        e l'utente non ha ignorato l'aggiornamento (o il preset e' cambiato
        di nuovo dopo l'ultimo ignore).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: ui
              tableName: lista_preferenza_utente
          - columnExists:
              schemaName: ui
              tableName: lista_preferenza_utente
              columnName: preset_aggiornato_ignored_at
          - tableExists:
              schemaName: ui
              tableName: lista_preset
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_resolve_lista_config(
                p_lista_codice         ui.lista_definizione.codice%TYPE,
                p_auth_user_id         INTEGER,
                p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Risolve la configurazione effettiva di una lista per un utente.
              -- Applica cascata preset, merge nuove colonne, normalizzazione obbligatorie
              -- e filtro autorizzativo colonna. Ritorna JSONB pronto per il frontend.
              --
              -- DB-3: step 2b usa JOIN + ORDER BY pa.priorita per cascata deterministica.
              -- DB-4: legge app.ruolo_applicativo dalla GUC per filtrare la veste corrente.
              --       Fallback sicuro: GUC assente/vuota/non-ENUM -> NULL -> tutte le vesti.
              -- F.2:  step 5 aggiunge etichetta_i18n_key al JSONB colonna.
              -- DEF-2: step 2.5 calcola preset_aggiornato (flag banner "novita' preset").
              DECLARE
                v_lista_id         ui.lista_definizione.id%TYPE;
                v_config_colonne   JSONB;
                v_ordinamento      JSONB;
                v_filtri           JSONB;
                v_pagina_dim       ui.lista_preset.pagina_dimensione%TYPE := 25;
                v_profili_ids      INTEGER[];
                v_colonne_nuove    INTEGER := 0;
                v_permessi         JSONB   := '{}'::JSONB;

                -- DB-4: veste corrente dalla GUC (raw TEXT per cast sicuro sotto)
                v_ruolo_guc_raw    TEXT    := NULLIF(current_setting('app.ruolo_applicativo', true), '');
                v_ruolo_guc        config.ruolo_applicativo;

                -- DEF-2: snapshot preset di base dalla preferenza utente
                v_pref_preset_base_id    ui.lista_preferenza_utente.preset_base_id%TYPE;
                v_pref_preset_base_ts    ui.lista_preferenza_utente.preset_base_data_update%TYPE;
                v_pref_preset_ignored_at ui.lista_preferenza_utente.preset_aggiornato_ignored_at%TYPE;
                -- DEF-2: data_update corrente del preset di base (lookup step 2.5)
                v_preset_data_update     ui.lista_preset.data_update%TYPE;
                -- DEF-2: flag risultato
                v_preset_aggiornato      BOOLEAN := FALSE;
              BEGIN
                -- Cast GUC -> ENUM blindato: valore non nel ENUM (bug middleware,
                -- variabile env errata) -> fallback NULL = tutte le vesti, mai eccezione.
                IF v_ruolo_guc_raw IS NOT NULL THEN
                  BEGIN
                    v_ruolo_guc := v_ruolo_guc_raw::config.ruolo_applicativo;
                  EXCEPTION WHEN invalid_text_representation THEN
                    v_ruolo_guc := NULL;
                  END;
                END IF;
                -- -------------------------------------------------------
                -- 0. Recupera lista_id dal codice
                -- -------------------------------------------------------
                SELECT id INTO v_lista_id
                  FROM ui.lista_definizione
                 WHERE codice = p_lista_codice
                   AND attivo = TRUE;

                IF v_lista_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'ui.fn_resolve_lista_config',
                    'E_UI_LISTA_NON_TROVATA',
                    jsonb_build_object('detail', format('codice lista: ''%s''', p_lista_codice)),
                    NULL,
                    p_lista_codice
                  );
                END IF;

                -- -------------------------------------------------------
                -- 1. Risolvi profili applicabili (DB-4: GUC-aware)
                --    v_ruolo_guc NULL = tutte le vesti (fallback legacy sicuro)
                -- -------------------------------------------------------
                SELECT ARRAY_AGG(profilo_accesso_id)
                  INTO v_profili_ids
                  FROM script.fn_get_profili_accesso_applicabili(p_auth_user_id, v_ruolo_guc);

                IF v_profili_ids IS NULL THEN
                  v_profili_ids := ARRAY[]::INTEGER[];
                END IF;

                -- -------------------------------------------------------
                -- 2. Cascata: trova la configurazione candidata
                -- -------------------------------------------------------

                -- 2a. Preferenza personale utente
                --     DEF-2: legge anche preset_base_id, preset_base_data_update,
                --     preset_aggiornato_ignored_at per il calcolo del flag al step 2.5.
                SELECT
                    (pu.configurazione -> 'colonne'),
                    (pu.configurazione -> 'ordinamento'),
                    (pu.configurazione -> 'filtri'),
                    COALESCE((pu.configurazione ->> 'pagina_dimensione')::INTEGER, 25),
                    pu.preset_base_id,
                    pu.preset_base_data_update,
                    pu.preset_aggiornato_ignored_at
                  INTO v_config_colonne, v_ordinamento, v_filtri, v_pagina_dim,
                       v_pref_preset_base_id, v_pref_preset_base_ts, v_pref_preset_ignored_at
                  FROM ui.lista_preferenza_utente pu
                 WHERE pu.auth_user_id = p_auth_user_id
                   AND pu.lista_id    = v_lista_id;

                -- 2b. Preset di profilo (DB-3: JOIN + ORDER BY pa.priorita ASC)
                --     AD_HOC (prio=1) prevale su REPARTO/PORTALE (prio=2)
                IF v_config_colonne IS NULL AND array_length(v_profili_ids, 1) > 0 THEN
                  SELECT
                      (
                        SELECT jsonb_agg(
                          jsonb_build_object(
                            'codice',    lc.codice,
                            'ordine',    pc.ordine,
                            'larghezza', COALESCE(pc.larghezza, lc.larghezza_default),
                            'visibile',  pc.visibile,
                            'fissata',   pc.fissata
                          )
                          ORDER BY pc.ordine
                        )
                        FROM ui.lista_preset_colonna pc
                        JOIN ui.lista_colonna lc ON lc.id = pc.colonna_id
                       WHERE pc.preset_id = lp.id
                         AND lc.attivo = TRUE
                      ),
                      lp.ordinamento_default,
                      lp.filtri_default,
                      COALESCE(lp.pagina_dimensione, 25)
                    INTO v_config_colonne, v_ordinamento, v_filtri, v_pagina_dim
                    FROM ui.lista_preset lp
                    JOIN script.fn_get_profili_accesso_applicabili(p_auth_user_id, v_ruolo_guc) pa
                      ON pa.profilo_accesso_id = lp.profilo_accesso_id
                   WHERE lp.lista_id   = v_lista_id
                     AND lp.ambito     = 'ruolo'
                     AND lp.is_default = TRUE
                     AND lp.attivo     = TRUE
                   ORDER BY pa.priorita ASC
                   LIMIT 1;
                END IF;

                -- 2c. Preset di emittente fiscale
                IF v_config_colonne IS NULL AND p_emittente_fiscale_id IS NOT NULL THEN
                  SELECT
                      (
                        SELECT jsonb_agg(
                          jsonb_build_object(
                            'codice',    lc.codice,
                            'ordine',    pc.ordine,
                            'larghezza', COALESCE(pc.larghezza, lc.larghezza_default),
                            'visibile',  pc.visibile,
                            'fissata',   pc.fissata
                          )
                          ORDER BY pc.ordine
                        )
                        FROM ui.lista_preset_colonna pc
                        JOIN ui.lista_colonna lc ON lc.id = pc.colonna_id
                       WHERE pc.preset_id = lp.id
                         AND lc.attivo = TRUE
                      ),
                      lp.ordinamento_default,
                      lp.filtri_default,
                      COALESCE(lp.pagina_dimensione, 25)
                    INTO v_config_colonne, v_ordinamento, v_filtri, v_pagina_dim
                    FROM ui.lista_preset lp
                   WHERE lp.lista_id             = v_lista_id
                     AND lp.ambito               = 'emittente_fiscale'
                     AND lp.emittente_fiscale_id = p_emittente_fiscale_id
                     AND lp.is_default           = TRUE
                     AND lp.attivo               = TRUE
                   LIMIT 1;
                END IF;

                -- 2d. Preset di sistema
                IF v_config_colonne IS NULL THEN
                  SELECT
                      (
                        SELECT jsonb_agg(
                          jsonb_build_object(
                            'codice',    lc.codice,
                            'ordine',    pc.ordine,
                            'larghezza', COALESCE(pc.larghezza, lc.larghezza_default),
                            'visibile',  pc.visibile,
                            'fissata',   pc.fissata
                          )
                          ORDER BY pc.ordine
                        )
                        FROM ui.lista_preset_colonna pc
                        JOIN ui.lista_colonna lc ON lc.id = pc.colonna_id
                       WHERE pc.preset_id = lp.id
                         AND lc.attivo = TRUE
                      ),
                      lp.ordinamento_default,
                      lp.filtri_default,
                      COALESCE(lp.pagina_dimensione, 25)
                    INTO v_config_colonne, v_ordinamento, v_filtri, v_pagina_dim
                    FROM ui.lista_preset lp
                   WHERE lp.lista_id   = v_lista_id
                     AND lp.ambito     = 'sistema'
                     AND lp.is_default = TRUE
                     AND lp.attivo     = TRUE
                   LIMIT 1;
                END IF;

                -- 2e. Catalogo grezzo (fallback finale)
                IF v_config_colonne IS NULL THEN
                  SELECT jsonb_agg(
                    jsonb_build_object(
                      'codice',    lc.codice,
                      'ordine',    lc.ordine_default,
                      'larghezza', lc.larghezza_default,
                      'visibile',  TRUE,
                      'fissata',   (lc.tipo_colonna = 'identificatore')
                    )
                    ORDER BY lc.ordine_default
                  )
                  INTO v_config_colonne
                  FROM ui.lista_colonna lc
                 WHERE lc.lista_id = v_lista_id
                   AND lc.attivo   = TRUE;
                END IF;

                IF v_config_colonne IS NULL THEN
                  v_config_colonne := '[]'::JSONB;
                END IF;

                -- -------------------------------------------------------
                -- 2.5 DEF-2: lookup data_update corrente del preset di base.
                --     Solo se la preferenza utente ha preset_base_id non-null
                --     E uno snapshot valorizzato (preset_base_data_update).
                --     Poi calcola il flag: TRUE sse il preset e' piu' recente
                --     dello snapshot E l'utente non ha ancora ignorato
                --     (o il preset e' cambiato di nuovo dopo l'ignore).
                -- -------------------------------------------------------
                IF v_pref_preset_base_id IS NOT NULL AND v_pref_preset_base_ts IS NOT NULL THEN
                  SELECT lp.data_update
                    INTO v_preset_data_update
                    FROM ui.lista_preset lp
                   WHERE lp.id = v_pref_preset_base_id;
                END IF;

                v_preset_aggiornato :=
                      v_pref_preset_base_ts IS NOT NULL
                  AND v_preset_data_update  IS NOT NULL
                  AND v_preset_data_update  > v_pref_preset_base_ts
                  AND (
                        v_pref_preset_ignored_at IS NULL
                    OR  v_pref_preset_ignored_at < v_preset_data_update
                  );

                -- -------------------------------------------------------
                -- 3. Merge automatico colonne nuove dal catalogo
                --    (presenti in catalogo ma assenti dalla configurazione)
                -- -------------------------------------------------------
                SELECT
                  v_config_colonne || COALESCE(
                    jsonb_agg(
                      jsonb_build_object(
                        'codice',    lc.codice,
                        'ordine',    lc.ordine_default + 10000,
                        'larghezza', lc.larghezza_default,
                        'visibile',  FALSE,
                        'fissata',   (lc.tipo_colonna = 'identificatore')
                      )
                    ),
                    '[]'::JSONB
                  ),
                  COUNT(*)::INTEGER
                INTO v_config_colonne, v_colonne_nuove
                FROM ui.lista_colonna lc
               WHERE lc.lista_id = v_lista_id
                 AND lc.attivo   = TRUE
                 AND lc.codice NOT IN (
                   SELECT elem ->> 'codice'
                     FROM jsonb_array_elements(v_config_colonne) AS elem
                 );

                -- -------------------------------------------------------
                -- 4. Risolvi permessi effettivi per colonna (DB-4: GUC-aware)
                --    DISTINCT ON: profilo piu' specifico (priorita asc),
                --    a parita' di priorita' il piu' restrittivo (BLOCCATO>LETTURA>TUTTO)
                -- -------------------------------------------------------
                IF array_length(v_profili_ids, 1) > 0 THEN
                  SELECT jsonb_object_agg(colonna_codice, livello)
                    INTO v_permessi
                    FROM (
                      SELECT DISTINCT ON (lc.codice)
                             lc.codice                AS colonna_codice,
                             lcp.livello_accesso      AS livello
                        FROM ui.lista_colonna lc
                        JOIN ui.lista_colonna_permesso lcp
                          ON lcp.colonna_id = lc.id
                        JOIN script.fn_get_profili_accesso_applicabili(p_auth_user_id, v_ruolo_guc) pa
                          ON pa.profilo_accesso_id = lcp.profilo_accesso_id
                       WHERE lc.lista_id = v_lista_id
                       ORDER BY lc.codice,
                                pa.priorita ASC,
                                CASE lcp.livello_accesso
                                  WHEN 'BLOCCATO' THEN 1
                                  WHEN 'LETTURA'  THEN 2
                                  WHEN 'TUTTO'    THEN 3
                                END ASC
                    ) sub;
                END IF;

                IF v_permessi IS NULL THEN
                  v_permessi := '{}'::JSONB;
                END IF;

                -- -------------------------------------------------------
                -- 5. Applica permessi + normalizzazione colonne obbligatorie
                --    - tipo 'identificatore' e 'azione': forzate visibile=true
                --    - sensibile=TRUE senza grant esplicito: BLOCCATO
                --    - colonne BLOCCATE: rimosse
                --    - colonne LETTURA: esportabile=false
                --    - F.2: aggiunge etichetta_i18n_key (NULL se non valorizzata)
                -- -------------------------------------------------------
                SELECT jsonb_agg(
                    jsonb_build_object(
                      'codice',             elem ->> 'codice',
                      'ordine',             (elem ->> 'ordine')::INTEGER,
                      'larghezza',          (elem ->> 'larghezza')::INTEGER,
                      'visibile',           visibile_norm,
                      'fissata',            fissata_norm,
                      'esportabile',        CASE WHEN livello_eff = 'LETTURA' THEN FALSE ELSE esportabile END,
                      'tipo_colonna',       tipo_colonna::text,
                      'etichetta_i18n_key', etichetta_i18n_key
                    )
                    ORDER BY (elem ->> 'ordine')::INTEGER
                  )
                  INTO v_config_colonne
                  FROM (
                    SELECT
                      elem,
                      lc.tipo_colonna,
                      lc.esportabile,
                      lc.etichetta_i18n_key,
                      COALESCE(
                        v_permessi ->> (elem ->> 'codice'),
                        CASE WHEN lc.sensibile THEN 'BLOCCATO' ELSE 'TUTTO' END
                      )                               AS livello_eff,
                      CASE
                        WHEN lc.tipo_colonna IN ('identificatore', 'azione')
                          THEN TRUE
                        ELSE (elem ->> 'visibile')::BOOLEAN
                      END                             AS visibile_norm,
                      CASE
                        WHEN lc.tipo_colonna = 'identificatore'
                          THEN TRUE
                        ELSE (elem ->> 'fissata')::BOOLEAN
                      END                             AS fissata_norm
                    FROM jsonb_array_elements(v_config_colonne) AS elem
                    LEFT JOIN ui.lista_colonna lc
                      ON lc.lista_id = v_lista_id
                     AND lc.codice   = elem ->> 'codice'
                     AND lc.attivo   = TRUE
                    WHERE lc.id IS NOT NULL
                  ) sub
                  WHERE livello_eff <> 'BLOCCATO';

                IF v_config_colonne IS NULL THEN
                  v_config_colonne := '[]'::JSONB;
                END IF;

                -- -------------------------------------------------------
                -- 6. Ritorna il JSONB finale
                -- -------------------------------------------------------
                RETURN jsonb_build_object(
                  'colonne',           v_config_colonne,
                  'ordinamento',       COALESCE(v_ordinamento, '[]'::JSONB),
                  'filtri',            COALESCE(v_filtri, '{}'::JSONB),
                  'pagina_dimensione', v_pagina_dim,
                  'colonne_nuove',     v_colonne_nuove,
                  'preset_aggiornato', v_preset_aggiornato
                );

              END;
              $function$;

              COMMENT ON FUNCTION ui.fn_resolve_lista_config(character varying, integer, bigint)
              IS 'Risolve configurazione lista per un utente: cascata preset (GUC-aware, '
                 'deterministica per priorita), merge nuove colonne, normalizzazione, filtro '
                 'autorizzativo, etichetta_i18n_key. DEF-2 (2026-05-11): aggiunge '
                 'preset_aggiornato (TRUE se preset modificato dopo snapshot e non ignorato).';
