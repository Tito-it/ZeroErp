# Passo 7 (P-2b) — STRATO 1: che l'interruttore non nasca. Decisione Q1.
#
# ⭐ PERCHE' UN TRIGGER E NON UN PERMESSO DI COLONNA (che era il piano).
#
#    Il piano prevedeva di togliere all'applicazione il diritto di scrivere
#    questa colonna: REVOKE UPDATE sulla tabella, poi GRANT UPDATE per colonna
#    elencando quelle lecite. E' la difesa piu' forte che esista — non si aggira
#    scrivendo codice.
#
#    ⛔ MA NON TIENE, ed e' stato verificato:
#    `90_end/ci_apply/20260205-41-apply-runtime-grants-ci-mctit.yaml` e'
#    `context: ci_apply` + `runOnChange: true`, cicla su 14 schemi (`ui`
#    compreso) e per ogni tabella posseduta esegue
#        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE <tab> TO zeroerp_app
#    In PostgreSQL l'UPDATE a livello TABELLA copre tutte le colonne: la revoca
#    viene annullata. E non e' un problema d'ordine risolvibile numerando piu'
#    avanti — essendo runOnChange in ci_apply ri-esegue a OGNI passata, e quella
#    passata e' sempre l'ultima.
#
#    Come cede, ed e' la parte peggiore: su SVILUPPO la revoca sopravvive fino
#    al successivo `make db-ci-apply`, quindi sembra funzionare a lungo. In CI
#    non funziona MAI — il database e' ricostruito da zero e la passata
#    `ci_apply` annulla la revoca nello stesso build in cui l'altra l'ha
#    applicata. Tiene solo dove la si prova a mano.
#
#    ⚠️ IL BARATTO, accettato consapevolmente (Q1): il trigger nomina UNA
#    colonna e non copre quelle future, mentre il permesso — sulla carta — le
#    avrebbe coperte tutte. Ma quella copertura oggi NON ESISTE. Si sceglie una
#    difesa che tiene su una colonna invece di una che sembra coprirle tutte e
#    non ne copre nessuna.
#
# ⚠️ NIENTE GUC DI OVERRIDE, e per la stessa ragione di P-1. Il seed passa
#    perche' il migrate gira come PROPRIETARIO della tabella, non perche'
#    qualcuno accende un interruttore: la condizione e' su chi sei, e non c'e'
#    niente da accendere. Un invariante con l'interruttore non e' un invariante.
#
# ⚠️ E il ruolo NON e' scritto a mano: si confronta con il proprietario VERO
#    della tabella, letto da pg_class. Un nome di ruolo hardcoded sarebbe giusto
#    su questa istanza e falso sulla prossima.
#
# brief-db-perimetro-emittente-liste-e-gerarchia-ba.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20260818-17-create-trgfn-lista-definizione-guard-multi-emittente-mctit.yaml

  - changeSet:
      id: 20260818-17-create-trgfn-lista-definizione-guard-multi-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        P-2b strato 1 (decisione Q1): il flag multi_emittente si scrive solo dal
        proprietario della tabella, cioe' dal migrate/seed. Un TRIGGER e non un
        permesso di colonna, perche' il giro dei grant runtime (ci_apply,
        runOnChange) ri-concede UPDATE di tabella a ogni passata e annullerebbe
        la revoca — su dev dopo giorni, in CI nello stesso build. Nessuna GUC di
        override. Brief §11.5, Q1.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: ui
            tableName: lista_definizione
            columnName: multi_emittente
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.trgfn_lista_definizione_guard_multi_emittente()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_owner text;
                  v_tocca boolean;
              BEGIN
                  -- Cosa conta come «tocca il flag»:
                  --   INSERT -> solo se nasce gia' acceso (un false esplicito e'
                  --             il default e non dichiara niente);
                  --   UPDATE -> qualunque cambio di valore.
                  IF TG_OP = 'INSERT' THEN
                      v_tocca := COALESCE(NEW.multi_emittente, false);
                  ELSE
                      v_tocca := NEW.multi_emittente IS DISTINCT FROM OLD.multi_emittente;
                  END IF;

                  IF NOT v_tocca THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Il proprietario si LEGGE, non si scrive a mano: un nome di
                  --   ruolo hardcoded sarebbe giusto su questa istanza e falso
                  --   sulla prossima.
                  SELECT pg_get_userbyid(c.relowner)
                    INTO v_owner
                    FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'ui' AND c.relname = 'lista_definizione';

                  -- pg_has_role(..., 'USAGE') e' vero per il proprietario e per
                  -- chi ne e' membro: il migrate passa, l'applicazione no.
                  IF pg_has_role(current_user, v_owner, 'USAGE') THEN
                      RETURN NEW;
                  END IF;

                  PERFORM script.fn_log_and_raise_error(
                      'ui',
                      'trgfn_lista_definizione_guard_multi_emittente',
                      'E_UI_MULTI_EMITTENTE_NON_SCRIVIBILE',
                      jsonb_build_object(
                          'lista_codice', NEW.codice,
                          'lista_id', NEW.id,
                          'column', 'multi_emittente',
                          'valore_richiesto', NEW.multi_emittente,
                          'current_user', current_user,
                          'owner_atteso', v_owner,
                          'detail', 'Il flag si dichiara nel seed lista_definizione.csv, mai da interfaccia'
                      ),
                      NULL::uuid,
                      NEW.codice::text
                  );

                  RETURN NEW;  -- irraggiungibile: la riga sopra solleva
              END
              $function$;

              COMMENT ON FUNCTION ui.trgfn_lista_definizione_guard_multi_emittente() IS
                  'Strato 1 di P-2b (decisione Q1): il flag multi_emittente si scrive solo dal '
                  'PROPRIETARIO della tabella — cioe'' dal migrate/seed — e mai '
                  'dall''applicazione. E'' un trigger e non un permesso di colonna perche'' il '
                  'giro dei grant runtime (90_end/ci_apply/20260205-41, runOnChange) ri-concede '
                  'UPDATE a livello di TABELLA su tutto lo schema ui a ogni passata: una REVOKE '
                  'sopravvivrebbe fino al successivo db-ci-apply su dev, e in CI nemmeno un '
                  'istante. Nessuna GUC di override: la condizione e'' su chi sei, non c''e'' '
                  'niente da accendere. Il ruolo proprietario si legge da pg_class, non e'' '
                  'scritto a mano. ⚠️ Copre UNA colonna: il baratto accettato in Q1. '
                  'Brief perimetro-emittente §11.5.';

              DROP TRIGGER IF EXISTS trg_ui_lista_definizione_a10_guard_multi_emittente_ins_upd
                  ON ui.lista_definizione;

              CREATE TRIGGER trg_ui_lista_definizione_a10_guard_multi_emittente_ins_upd
                  BEFORE INSERT OR UPDATE OF multi_emittente
                  ON ui.lista_definizione
                  FOR EACH ROW
                  EXECUTE FUNCTION ui.trgfn_lista_definizione_guard_multi_emittente();

              COMMENT ON TRIGGER trg_ui_lista_definizione_a10_guard_multi_emittente_ins_upd
                  ON ui.lista_definizione IS
                  'P-2b strato 1: impedisce che l''interruttore nasca. Fascia a10 (guard, '
                  'BEFORE) come da convenzione. Gli altri due strati stanno nel backend — il '
                  'test in CI sulle whitelist e il motivo scritto accanto ad esse (BE-3).';
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_ui_lista_definizione_a10_guard_multi_emittente_ins_upd
                  ON ui.lista_definizione;
              DROP FUNCTION IF EXISTS ui.trgfn_lista_definizione_guard_multi_emittente();
