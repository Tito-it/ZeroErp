# ui.fn_resolve_dashboard_config: il banner del preset aggiornato per chiave.
#   Brief: brief-db-revisione-ui (giro 1b: U6 con Q4, Q29 e Q39; Q38; M6, M7 e i
#   marcatori di cronaca dei corpi. Decise da Tid il 2026-11-18 e il 2026-11-20).
#
# Che cosa cambia (gemello di 20261120-10):
#   - il banner guarda solo le chiavi di origine 'preferenza': ui.fn_preset_aggiornato
#     (20261120-07) confronta, chiave per chiave, lo snapshot della preferenza
#     con la data del contenuto del preset di base, mappe {chiave: data}
#     (20261120-04). Una chiave che segue gia' il preset non accende niente;
#   - per avere una sede sola di «origine 'preferenza'», l'origine si calcola
#     una volta in v_origine, e il banner si sposta dopo la misura di pagina,
#     dove l'origine della misura e' decisa;
#   - chiave ADDITIVA preset_aggiornato_chiavi (l'elenco); preset_aggiornato
#     resta, «almeno una»; preset_base.contenuto_aggiornato_il e' ora la mappa;
#   - l'ignorato esce (Q38): chiudere il banner e' riscrivere preset_base_id;
#   - i marcatori di cronaca dei commenti del corpo escono (sigle, date, brief).
#   Il resto identico a 20261119-13.
# Corpo vivo: quello di 20261119-13, applicato su dbdev il 2026-11-20 (doc
#   auto-generata rigenerata). Attributi: plpgsql, STABLE, SECURITY INVOKER.
#   Il rollback e' quel corpo, che legge preset_aggiornato_ignored_at: torna
#   valido col rollback di 20261120-04.
# ⚠️ Il BE che legge preset_base.contenuto_aggiornato_il come timestamptz si
#   rompe dopo l'apply (BE7).
# ------------------------------------------------------------

