# ui.fn_guard_misura_pagina: «e' un intero?» lo chiede al BB della misura.
#   Brief: brief-db-revisione-ui (giro 2: U19).
#
# Che cosa cambia: il test di forma (number di sole cifre, al piu' nove) esce
#   dal corpo e lo fa ui.fn_intero_da_jsonb (20261120-21), la stessa domanda dei
#   resolver e del guard di forma. Il comportamento e' identico: le forme
#   ammesse e rifiutate, il codice, il contesto e la frase non cambiano.
# Firma, volatilita' e sicurezza invariate: CREATE OR REPLACE. Il COMMENT dice
#   i chiamanti di dopo il giro (il trigger di forma della preferenza, -26).
# Corpo preso dal vivo (dbdev, 2026-11-21), uguale alla doc auto-generata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261120-23-update-fn-guard-misura-pagina-intero-da-jsonb-mctit.yaml

  - changeSet:
      id: 20261120-23-update-fn-guard-misura-pagina-intero-da-jsonb
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_guard_misura_pagina: la forma del valore la giudica ui.fn_intero_da_jsonb.
        Brief: brief-db-revisione-ui (giro 2, U19).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'ui' AND p.proname = 'fn_intero_da_jsonb'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_guard_misura_pagina(
                  -- jsonb: il valore com'e' scritto (preferenza o preset); non il riflesso di una colonna
                  p_valore jsonb)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: rifiutare un valore «righe per pagina» che non e' una misura
              --   del catalogo. NULL e null jsonb passano: sono il default.
              DECLARE
                  -- Esplicito: il testo del valore com'e' scritto, per la frase.
                  v_testo  text := p_valore #>> '{}';
                  -- La misura, se il valore e' un intero (dal BB); altrimenti NULL.
                  v_misura ui.misure_pagina.misura%TYPE := ui.fn_intero_da_jsonb(p_valore);
              BEGIN
                  IF p_valore IS NULL OR jsonb_typeof(p_valore) = 'null' THEN
                      RETURN;
                  END IF;

                  IF v_misura IS NULL OR NOT ui.fn_misura_pagina_ammessa(v_misura) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'ui.fn_guard_misura_pagina', 'E_UI_MISURA_PAGINA_NON_AMMESSA',
                          jsonb_build_object('campo', 'pagina_dimensione', 'valore', p_valore),
                          NULL::uuid,
                          VARIADIC ARRAY[v_testo,
                                         (SELECT string_agg(m.misura::text, ', ' ORDER BY m.misura)
                                            FROM ui.misure_pagina m)]);
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION ui.fn_guard_misura_pagina(jsonb) IS
                  'Rifiuta un valore «righe per pagina» che non è un numero intero del catalogo ui.misure_pagina: E_UI_MISURA_PAGINA_NON_AMMESSA (DATO_ERRATO), con il valore e l''elenco delle misure ammesse nella frase, campo = pagina_dimensione. NULL e null jsonb passano (sono il default). Riceve il valore com''è scritto (jsonb): nella preferenza utente può non essere un numero, e il rifiuto parte da un punto solo; il preset gli passa to_jsonb(pagina_dimensione). Che il valore sia un intero lo dice ui.fn_intero_da_jsonb, la stessa domanda dei resolver: la stringa "25" è rifiutata. Lo chiamano il trigger della misura di ui.lista_preset (dove la FK resta come rete) e il trigger di forma delle preferenze (ui.trgfn_preferenza_guard_forma). INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_guard_misura_pagina(p_valore jsonb)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_testo text := p_valore #>> '{}';
              BEGIN
                  IF p_valore IS NULL OR jsonb_typeof(p_valore) = 'null' THEN
                      RETURN;
                  END IF;
                  IF (CASE WHEN jsonb_typeof(p_valore) <> 'number'         THEN true
                           WHEN v_testo !~ '^[0-9]{1,9}$'                  THEN true
                           ELSE NOT ui.fn_misura_pagina_ammessa(v_testo::integer) END) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'ui.fn_guard_misura_pagina', 'E_UI_MISURA_PAGINA_NON_AMMESSA',
                          jsonb_build_object('campo', 'pagina_dimensione', 'valore', p_valore),
                          NULL::uuid,
                          VARIADIC ARRAY[v_testo,
                                         (SELECT string_agg(m.misura::text, ', ' ORDER BY m.misura)
                                            FROM ui.misure_pagina m)]);
                  END IF;
              END;
              $function$;
