# ------------------------------------------------------------
# ui.fn_lista_colonne_ricerca_full: l'utente di sessione dal BB.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8; Q60 (a)).
#
# Il perche': dal giro 6a (20261121-29) la funzione leggeva
#   app.current_user_id con un controllo suo, e un valore che non era un
#   intero dava E_UI_CHIAMATA_NON_VALIDA; le altre funzioni del database
#   davano il 22P02 grezzo allo stesso guasto. Ora la lettura e' di
#   script.fn_utente_di_sessione (20261123-16): GUC assente o vuota resta
#   NULL (nessun grant, come prima); un valore che non e' l'id di un utente
#   da' E_SCRIPT_CHIAMATA_NON_VALIDA, come in tutte le altre.
#   E_UI_CHIAMATA_NON_VALIDA resta a catalogo: lo solleva il backend.
# La lettura resta dopo il controllo della lista, come prima. Corpo dal vivo
#   (dbdev, 2026-11-23), firma dall'ultimo changeSet (20261121-29). Il COMMENT
#   dice il BB e il codice nuovo. La rollback riporta corpo e COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/ui/20261123-17-update-fn-lista-colonne-ricerca-full-utente-di-sessione-mctit.yaml

  - changeSet:
      id: 20261123-17-update-fn-lista-colonne-ricerca-full-utente-di-sessione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        ui.fn_lista_colonne_ricerca_full: l'utente di sessione da script.fn_utente_di_sessione; via il
        controllo suo e E_UI_CHIAMATA_NON_VALIDA, al suo posto E_SCRIPT_CHIAMATA_NON_VALIDA. Brief: brief-
        db-revisione-ui (§3.6-sexies, Q60).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "2"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('script', 'fn_utente_di_sessione'), ('ui', 'fn_lista_colonne_ricerca_full'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_lista_colonne_ricerca_full(
                p_lista_codice ui.lista_definizione.codice%TYPE
              )
               RETURNS TABLE(
                codice         ui.lista_colonna.codice%TYPE,
                campo_sorgente ui.lista_colonna.campo_sorgente%TYPE
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: le colonne di una lista in cui l'utente corrente puo' fare la
              -- ricerca libera, con il campo della vista da interrogare.
              --
              -- Condizioni, tutte insieme:
              --   - colonna attiva e `ricercabile_full`;
              --   - campo_sorgente valorizzato (il CHECK della colonna vieta il vuoto);
              --   - livello effettivo <> BLOCCATO (LETTURA entra: si vede, si cerca).
              --
              -- Contesto dalla sessione: utente da app.current_user_id, veste da
              -- ui.fn_veste_corrente(). L'emittente non entra nel livello di colonna.
              -- ⚠️ Senza utente: nessun grant, le colonne sensibili escono.
              -- L'utente dal BB script.fn_utente_di_sessione: un id che non e' l'id di
              -- un utente e' una chiamata fuori contesto, E_SCRIPT_CHIAMATA_NON_VALIDA.
              DECLARE
                v_lista_id     ui.lista_definizione.id%TYPE;
                -- integer: l'id di django.auth_user, tabella dell'applicazione: un changeSet non
                -- la cita con %TYPE (lo schema django e' del provisioning)
                v_auth_user_id integer;
              BEGIN
                -- Lista assente o spenta: E_UI_LISTA_NON_TROVATA, sollevato dal BB.
                v_lista_id := (ui.fn_lista_da_codice(p_lista_codice)).id;

                -- Dopo la lista, come prima: l'utente dal BB (GUC assente o vuota: NULL).
                v_auth_user_id := script.fn_utente_di_sessione('ui.fn_lista_colonne_ricerca_full');

                RETURN QUERY
                SELECT lc.codice,
                       lc.campo_sorgente
                  FROM ui.lista_colonna lc
                  JOIN ui.fn_lista_colonne_livello(v_lista_id, v_auth_user_id, ui.fn_veste_corrente()) lv
                    ON lv.colonna_id = lc.id
                 WHERE lc.lista_id         = v_lista_id
                   AND lc.attivo           = TRUE
                   AND lc.ricercabile_full = TRUE
                   AND lc.campo_sorgente IS NOT NULL
                   AND lv.livello_accesso <> 'BLOCCATO'
                 ORDER BY lc.ordine_default, lc.codice;
              END;
              $function$;

              COMMENT ON FUNCTION ui.fn_lista_colonne_ricerca_full(character varying) IS
                  'Le colonne di una lista in cui l''utente corrente può fare la ricerca libera, con il campo_sorgente da interrogare: accese, ricercabile_full, con un campo sorgente, a un livello effettivo diverso da BLOCCATO (LETTURA entra). Il livello viene da ui.fn_lista_colonne_livello, lo stesso di ui.fn_resolve_lista_config: non si cerca in una colonna che la lista non mostra. Utente dal building block script.fn_utente_di_sessione, veste da ui.fn_veste_corrente(); l''emittente non entra nel livello di colonna. Senza utente (GUC assente o vuota) nessun grant: le colonne sensibili escono. Un app.current_user_id che non è l''id di un utente: E_SCRIPT_CHIAMATA_NON_VALIDA, dal building block. Lista assente o spenta: E_UI_LISTA_NON_TROVATA, dal building block ui.fn_lista_da_codice. STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION ui.fn_lista_colonne_ricerca_full(
                p_lista_codice ui.lista_definizione.codice%TYPE
              )
               RETURNS TABLE(
                codice         ui.lista_colonna.codice%TYPE,
                campo_sorgente ui.lista_colonna.campo_sorgente%TYPE
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: le colonne di una lista in cui l'utente corrente puo' fare la
              -- ricerca libera, con il campo della vista da interrogare.
              --
              -- Condizioni, tutte insieme:
              --   - colonna attiva e `ricercabile_full`;
              --   - campo_sorgente valorizzato (il CHECK della colonna vieta il vuoto);
              --   - livello effettivo <> BLOCCATO (LETTURA entra: si vede, si cerca).
              --
              -- Contesto dalla sessione: utente da app.current_user_id, veste da
              -- ui.fn_veste_corrente(). L'emittente non entra nel livello di colonna.
              -- ⚠️ Senza utente: nessun grant, le colonne sensibili escono.
              -- Un id utente che non e' un intero e' una chiamata fuori contesto:
              -- E_UI_CHIAMATA_NON_VALIDA, non il 22P02 del cast.
              DECLARE
                v_lista_id     ui.lista_definizione.id%TYPE;
                -- text: il valore della GUC com'e' scritto, prima di leggerlo come id
                v_guc          text := NULLIF(current_setting('app.current_user_id', true), '');
                -- integer: l'id di django.auth_user, tabella dell'applicazione: un changeSet non
                -- la cita con %TYPE (lo schema django e' del provisioning)
                v_auth_user_id integer;
              BEGIN
                -- Lista assente o spenta: E_UI_LISTA_NON_TROVATA, sollevato dal BB.
                v_lista_id := (ui.fn_lista_da_codice(p_lista_codice)).id;

                IF v_guc IS NOT NULL THEN
                  -- Il CASE garantisce l'ordine: il confronto numerico solo su sole cifre.
                  IF (CASE WHEN v_guc ~ '^[0-9]{1,10}$' THEN v_guc::bigint > 2147483647
                           ELSE TRUE END) THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'ui.fn_lista_colonne_ricerca_full',
                      'E_UI_CHIAMATA_NON_VALIDA',
                      jsonb_build_object(
                        'lista_codice',        p_lista_codice,
                        'app_current_user_id', v_guc),
                      NULL::uuid,
                      VARIADIC ARRAY[]::text[]);
                  END IF;
                  v_auth_user_id := v_guc::integer;
                END IF;

                RETURN QUERY
                SELECT lc.codice,
                       lc.campo_sorgente
                  FROM ui.lista_colonna lc
                  JOIN ui.fn_lista_colonne_livello(v_lista_id, v_auth_user_id, ui.fn_veste_corrente()) lv
                    ON lv.colonna_id = lc.id
                 WHERE lc.lista_id         = v_lista_id
                   AND lc.attivo           = TRUE
                   AND lc.ricercabile_full = TRUE
                   AND lc.campo_sorgente IS NOT NULL
                   AND lv.livello_accesso <> 'BLOCCATO'
                 ORDER BY lc.ordine_default, lc.codice;
              END;
              $function$;

              COMMENT ON FUNCTION ui.fn_lista_colonne_ricerca_full(character varying) IS
                  'Le colonne di una lista in cui l''utente corrente può fare la ricerca libera, con il campo_sorgente da interrogare: accese, ricercabile_full, con un campo sorgente, a un livello effettivo diverso da BLOCCATO (LETTURA entra). Il livello viene da ui.fn_lista_colonne_livello, lo stesso di ui.fn_resolve_lista_config: non si cerca in una colonna che la lista non mostra. Utente da app.current_user_id, veste da ui.fn_veste_corrente(); l''emittente non entra nel livello di colonna. Senza utente (GUC assente o vuota) nessun grant: le colonne sensibili escono. Un app.current_user_id che non è un intero è una chiamata fuori contesto: E_UI_CHIAMATA_NON_VALIDA. Lista assente o spenta: E_UI_LISTA_NON_TROVATA, dal building block ui.fn_lista_da_codice. STABLE.';
