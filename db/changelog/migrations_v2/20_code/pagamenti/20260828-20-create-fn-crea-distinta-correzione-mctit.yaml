# LA MADRE DELLA CORREZIONE GUIDATA — passo S6-4 (lotto 10)
#   pagamenti.fn_crea_distinta_correzione
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.3-quater S6-4 · Decisione: Q-7 (Tid, 2026-08-24), C-1…C-4 (28/08)
#
# ── ⭐ IL GESTO, IN UNA RIGA ────────────────────────────────────────
#   Una distinta e' stata registrata con un importo sbagliato. «Correggi» apre
#   una distinta NUOVA con le righe di segno opposto gia' dentro: l'operatore
#   la guarda, abbina e registra. ⛔ Non ricopiatura a mano — su venti righe e'
#   li' che nasce il secondo errore.
#
#   ⛔ **E si chiama CORREZIONE, mai «storno».** `STORNATA` e' stata ritirata
#   dal catalogo il 21/08: rimetterne la parola riaprirebbe una porta chiusa.
#
#   ⛔ **Non e' una sistemazione**, e la differenza e' il punto: le sistemazioni
#   decidono che fare di un'eccedenza VERA — denaro davvero arrivato in piu'.
#   La correzione rimedia a una registrazione SBAGLIATA. Confonderle
#   significherebbe registrare come credito del cliente un errore di battitura.
#
# ── ⭐ PERCHE' UNA MADRE E NON UN CICLO NEL BACKEND ─────────────────
#   Precompilare significa creare N righe dentro una testata nuova, in modo
#   atomico. Un ciclo nel service produrrebbe una distinta A META' se qualcosa
#   si rompe a meta' elenco — cioe' il documento che nessuno sa piu' leggere.
#   E' la stessa ragione per cui il posting e' una sola `SELECT`.
#
# ── 🔴 C-1: LE RIGHE NASCONO `DA_ABBINARE`, CON FATTURA E RATA DENTRO
#   ⚠️ E' la decisione che una MISURA ha cambiato. La prima risposta era «nasce
#   gia' ABBINATA»; provato il 2026-08-28, una riga `-100` su una rata **saldata
#   dal movimento che si sta correggendo** viene RIFIUTATA dal guard della
#   capienza: con residuo 0 non c'e' spazio in nessuna direzione, e il guard lo
#   dice per iscritto. Nascere gia' abbinata pretenderebbe `forzata = true`,
#   cioe' **forzare al posto dell'operatore** — l'opposto del doppio tempo.
#
#   ⭐ La strada che la prova ha trovato: la riga porta **fattura e rata gia'
#   compilate** ma sta in `DA_ABBINARE`, che non e' uno stato postabile — e il
#   guard verifica la capienza SOLO sulle righe che occupano spazio davvero.
#   Passa. ⇒ La correzione guida **tutto tranne l'ultimo clic**, e la forzatura
#   resta il gesto di una persona, dove D14-d l'ha messa.
#
# ── ⭐ C-2: LE RIGHE NON POSTATE SI SALTANO, E L'ESITO LE CONTA ─────
#   Una riga sospesa o scartata non ha prodotto movimenti: non c'e' niente da
#   correggere. Ma il silenzio lascerebbe l'operatore a chiedersi dove sono
#   finite ⇒ `righe_saltate`, **lo stesso vocabolario di `fn_posta_contabile`**.
#   Un secondo verbo che risponde come il primo si impara una volta sola.
#
# ── ⭐ «NIENTE DA CORREGGERE» E' UN ESITO, NON UN ERRORE ────────────
#   `NULLA_DA_CORREGGERE`, esattamente come `NULLA_DA_POSTARE`: il backend lo
#   passa senza interpretarlo e la frase la sceglie il frontend. I due codici
#   errore servono per i rifiuti VERI — la distinta non registrata e la distinta
#   gia' corretta.
#
# ── ⛔ NON USA `fn_get_or_create_vendite_contabile`, E NON E' UNA SCELTA
#   La chiave di riuso di quella funzione, su `MANUALE`, comprende giornata +
#   canale + OPERATORE: chiamarla farebbe atterrare le righe di correzione
#   DENTRO la distinta di lavoro di oggi, mescolando una correzione col lavoro
#   corrente. La distinta di correzione e' un documento **proprio**.
#   ⭐ E il `codice` non si compone qui: lo mette il DEFAULT della colonna
#   (changeSet `20260828-12`), che e' la sua sede unica.
#
# ── ⭐ NON REGISTRA NIENTE ──────────────────────────────────────────
#   La distinta nuova nasce in `BOZZA` e la registra una persona, guardandola.
#   Precompilare e' un aiuto, non una decisione.
#
# Dipendenze: colonna `contabile_corretta_id` e DEFAULT del codice
#   (`20260828-12`) · codici `E_CONTABILE_CORREZIONE_NON_REGISTRATA` e
#   `E_CONTABILE_GIA_CORRETTA` (80_data, che gira DOPO: la dipendenza si
#   rispetta scrivendo nell'ordine, non con una preCondition).
# Verifica: db/pgtap/pagamenti/test-fn-crea-distinta-correzione.sql
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/pagamenti/20260828-20-create-fn-crea-distinta-correzione-mctit.yaml

    - changeSet:
          id: 20260828-20-create-fn-crea-distinta-correzione
          author: mctit
          runOnChange: false
          validCheckSums:
              - ANY
          failOnError: true
          comment: >
              La madre della correzione guidata (Q-7): da una distinta registrata apre una distinta
              nuova, in bozza, con le righe di segno opposto gia' dentro — fattura e rata comprese, ma
              in stato DA_ABBINARE. Provato che nascere gia' abbinate pretenderebbe di forzare la
              capienza al posto dell'operatore: con residuo zero non c'e' spazio in nessuna direzione, e
              il doppio tempo e' un gesto di una persona. Le righe non postate si saltano e l'esito le
              conta, come fa il posting. Non registra niente: la distinta nuova la guarda e la registra
              una persona.
          preConditions:
              - onFail: HALT
              - and:
                    - columnExists:
                          schemaName: pagamenti
                          tableName: vendite_contabili
                          columnName: contabile_corretta_id
                    # ⛔ 2026-09-02 — RIMOSSA la preCondition su pagamenti.vendite_contabili_righe_stati (codice_interno = 'DA_ABBINARE').
                    #    `20_code` gira PRIMA di `80_data`: su un database ricostruito da zero
                    #    — cioe' in CI — la riga cercata NON esiste ancora, e il migrate muore
                    #    con «SQL Precondition failed. Expected '1' got '0'». Non e' un caso di
                    #    bordo: e' l'UNICO modo in cui un seed nuovo puo' arrivare.
                    #    Lo stato serve alla funzione QUANDO VIENE CHIAMATA, non quando il corpo
                    #    viene compilato: e' un fatto di runtime.
                    #    ⛔ Regola: docs/it/linee-guida-sql.md §11.4. Restano legittime le
                    #    preCondition su cio' che viene PRIMA (tableExists, columnExists,
                    #    pg_proc, arita'); quelle sul CONTENUTO di 80_data no.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION pagamenti.fn_crea_distinta_correzione(
                            p_contabile_id   pagamenti.vendite_contabili.id%TYPE,
                            p_data_contabile pagamenti.vendite_contabili.data_contabile%TYPE DEFAULT CURRENT_DATE,
                            p_motivo         text DEFAULT NULL
                        )
                         RETURNS TABLE(
                            contabile_id  pagamenti.vendite_contabili.id%TYPE,
                            righe_create  integer,
                            righe_saltate integer,
                            esito         text
                         )
                         LANGUAGE plpgsql
                         SECURITY INVOKER
                        AS $function$
                        DECLARE
                            v_stato_codice     pagamenti.vendite_contabili_stati.codice_interno%TYPE;
                            v_centro_id        pagamenti.vendite_contabili.centro_riscossione_id%TYPE;
                            v_ente_id          pagamenti.vendite_contabili.ente_incasso_id%TYPE;
                            v_codice_origine   pagamenti.vendite_contabili.codice%TYPE;
                            v_gia_corretta     pagamenti.vendite_contabili.codice%TYPE;
                            v_stato_bozza_id   pagamenti.vendite_contabili_stati.id%TYPE;
                            v_stato_riga_id    pagamenti.vendite_contabili_righe_stati.id%TYPE;
                            v_nuova_id         pagamenti.vendite_contabili.id%TYPE;
                            v_da_correggere    integer;
                            v_saltate          integer;
                            v_create           integer;
                        BEGIN
                            -- =========================================================
                            -- Guard di parametro: un id nullo o non positivo non esce da
                            -- nessuna interfaccia — lo produce solo un chiamante rotto.
                            -- =========================================================
                            IF p_contabile_id IS NULL OR p_contabile_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'pagamenti.fn_crea_distinta_correzione',
                                    'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                                    jsonb_build_object('parametro', 'p_contabile_id',
                                                       'valore', p_contabile_id),
                                    NULL::uuid,
                                    'pagamenti.fn_crea_distinta_correzione',
                                    'p_contabile_id obbligatorio e maggiore di zero');
                            END IF;

                            -- =========================================================
                            -- La distinta di partenza, bloccata: fra il controllo «e'
                            -- gia' stata corretta?» e la scrittura del legame non deve
                            -- passare nessun altro.
                            -- ⚠️ Sotto RLS «non esiste» e «non la vedi» arrivano qui allo
                            --    stesso modo, ed e' la scelta di tutto lo schema.
                            -- =========================================================
                            SELECT st.codice_interno, c.centro_riscossione_id, c.ente_incasso_id, c.codice
                              INTO v_stato_codice, v_centro_id, v_ente_id, v_codice_origine
                              FROM pagamenti.vendite_contabili c
                              JOIN pagamenti.vendite_contabili_stati st ON st.id = c.stato_id
                             WHERE c.id = p_contabile_id
                               FOR UPDATE OF c;

                            IF NOT FOUND THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'pagamenti.fn_crea_distinta_correzione',
                                    'E_CONTABILE_NON_TROVATA',
                                    jsonb_build_object('contabile_id', p_contabile_id),
                                    NULL::uuid,
                                    p_contabile_id::text);
                            END IF;

                            -- =========================================================
                            -- Si corregge cio' che e' stato REGISTRATO. Una bozza non si
                            -- corregge: si modifica, ed e' un altro gesto.
                            -- =========================================================
                            IF v_stato_codice <> 'CHIUSA' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'pagamenti.fn_crea_distinta_correzione',
                                    'E_CONTABILE_CORREZIONE_NON_REGISTRATA',
                                    jsonb_build_object('campo', 'stato_id',
                                                       'contabile_id', p_contabile_id,
                                                       'stato', v_stato_codice),
                                    NULL::uuid,
                                    v_codice_origine, v_stato_codice);
                            END IF;

                            -- =========================================================
                            -- C-4: una correzione sola per documento. ⚠️ L'unico parziale
                            -- e' la rete; qui si rifiuta con un codice che NOMINA la
                            -- correzione che c'e' gia', perche' un 23505 non la dice.
                            -- =========================================================
                            SELECT c.codice INTO v_gia_corretta
                              FROM pagamenti.vendite_contabili c
                             WHERE c.contabile_corretta_id = p_contabile_id
                             LIMIT 1;

                            IF FOUND THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'pagamenti.fn_crea_distinta_correzione',
                                    'E_CONTABILE_GIA_CORRETTA',
                                    jsonb_build_object('contabile_id', p_contabile_id,
                                                       'correzione', v_gia_corretta),
                                    NULL::uuid,
                                    v_codice_origine, v_gia_corretta);
                            END IF;

                            -- =========================================================
                            -- Che cosa c'e' da correggere: SOLO le righe POSTATE, cioe'
                            -- quelle che hanno prodotto un movimento. Le altre si contano
                            -- e si dicono (C-2).
                            -- =========================================================
                            SELECT count(*) FILTER (WHERE rs.codice_interno = 'POSTATA'),
                                   count(*) FILTER (WHERE rs.codice_interno <> 'POSTATA')
                              INTO v_da_correggere, v_saltate
                              FROM pagamenti.vendite_contabili_righe r
                              JOIN pagamenti.vendite_contabili_righe_stati rs ON rs.id = r.stato_id
                             WHERE r.contabile_id = p_contabile_id
                               AND r.attivo IS TRUE;

                            IF COALESCE(v_da_correggere, 0) = 0 THEN
                                -- ⭐ Non e' un errore: e' un esito. Il database dice il
                                --    fatto, il frontend sceglie la frase.
                                RETURN QUERY SELECT NULL::bigint, 0, COALESCE(v_saltate, 0),
                                                    'NULLA_DA_CORREGGERE'::text;
                                RETURN;
                            END IF;

                            SELECT s.id INTO v_stato_bozza_id
                              FROM pagamenti.vendite_contabili_stati s
                             WHERE s.codice_interno = 'BOZZA' AND s.attivo IS TRUE;

                            SELECT s.id INTO v_stato_riga_id
                              FROM pagamenti.vendite_contabili_righe_stati s
                             WHERE s.codice_interno = 'DA_ABBINARE' AND s.attivo IS TRUE;

                            IF v_stato_bozza_id IS NULL OR v_stato_riga_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'pagamenti.fn_crea_distinta_correzione',
                                    'E_CONTABILE_STATO_NON_CONFIGURATO',
                                    jsonb_build_object('detail', 'stato BOZZA o DA_ABBINARE assente',
                                                       'contabile_id', p_contabile_id),
                                    NULL::uuid,
                                    'BOZZA / DA_ABBINARE');
                            END IF;

                            -- =========================================================
                            -- La distinta NUOVA: stesso centro, stesso canale, in bozza.
                            -- ⛔ `codice` non si passa: lo mette il DEFAULT della colonna.
                            -- ⛔ E non si usa il get-or-create: la sua chiave di riuso
                            --    comprende l'operatore, e queste righe finirebbero nella
                            --    distinta di lavoro di oggi.
                            -- =========================================================
                            INSERT INTO pagamenti.vendite_contabili (
                                centro_riscossione_id, ente_incasso_id, data_contabile,
                                data_registrazione, stato_id, origine, contabile_corretta_id, meta)
                            VALUES (
                                v_centro_id, v_ente_id, p_data_contabile,
                                CURRENT_DATE, v_stato_bozza_id, 'MANUALE', p_contabile_id,
                                jsonb_strip_nulls(jsonb_build_object(
                                    'correzione_di', v_codice_origine,
                                    'motivo_correzione', NULLIF(btrim(COALESCE(p_motivo, '')), ''))))
                            RETURNING id INTO v_nuova_id;

                            -- =========================================================
                            -- Le righe: segno opposto, e i FATTI dell'originale.
                            -- ⭐ Fattura e rata si portano dietro (C-1): l'abbinamento
                            --    non si inventa, si rispecchia. Ma lo stato e'
                            --    DA_ABBINARE, non ABBINATA: cosi' la riga non occupa
                            --    spazio, il guard della capienza non la esamina, e il
                            --    doppio tempo resta il gesto di una persona.
                            -- ⚠️ `riferimento_ente` si conserva: e' lo stesso pagamento
                            --    del mondo, e cambiarlo perderebbe l'unico appiglio per
                            --    ritrovarlo nell'estratto conto.
                            -- =========================================================
                            INSERT INTO pagamenti.vendite_contabili_righe (
                                contabile_id, riferimento_ente, data_pagamento, data_valuta,
                                data_operazione, importo, fattura_id, billing_account_id,
                                scadenza_id, stato_id, meta)
                            SELECT v_nuova_id, r.riferimento_ente, r.data_pagamento, r.data_valuta,
                                   r.data_operazione, -r.importo, r.fattura_id, r.billing_account_id,
                                   r.scadenza_id, v_stato_riga_id,
                                   jsonb_build_object('corregge_riga_id', r.id)
                              FROM pagamenti.vendite_contabili_righe r
                              JOIN pagamenti.vendite_contabili_righe_stati rs ON rs.id = r.stato_id
                             WHERE r.contabile_id = p_contabile_id
                               AND r.attivo IS TRUE
                               AND rs.codice_interno = 'POSTATA';

                            GET DIAGNOSTICS v_create = ROW_COUNT;

                            RETURN QUERY SELECT v_nuova_id, v_create, COALESCE(v_saltate, 0),
                                                'CREATA'::text;
                        END;
                        $function$;

                        COMMENT ON FUNCTION pagamenti.fn_crea_distinta_correzione(
                            pagamenti.vendite_contabili.id%TYPE,
                            pagamenti.vendite_contabili.data_contabile%TYPE,
                            text)
                        IS 'La CORREZIONE GUIDATA (Q-7): da una distinta registrata apre una distinta NUOVA, in bozza, con le righe di segno opposto gia'' dentro. ⛔ Si chiama correzione e mai «storno»: STORNATA e'' stata ritirata dal catalogo il 2026-08-21. ⛔ E non e'' una sistemazione — quella decide che fare di un''eccedenza VERA, questa rimedia a una registrazione SBAGLIATA: confonderle significherebbe registrare come credito del cliente un errore di battitura. ⭐ E'' una MADRE e non un ciclo nel backend perche'' N righe dentro una testata nuova sono un atto solo: un ciclo che si rompe a meta'' lascia una distinta a meta'', cioe'' il documento che nessuno sa piu'' leggere. 🔴 Le righe nascono con fattura e rata GIA'' COMPILATE ma in stato DA_ABBINARE, e la ragione e'' una MISURA: una riga di segno opposto su una rata saldata dal movimento che si sta correggendo viene RIFIUTATA dal guard della capienza (con residuo zero non c''e'' spazio in nessuna direzione), quindi nascere gia'' ABBINATA pretenderebbe forzata = true — cioe'' forzare al posto dell''operatore, l''opposto del doppio tempo di D14-d. In DA_ABBINARE la riga non occupa spazio e il guard non la esamina: la correzione guida tutto tranne l''ultimo clic. ⭐ Le righe NON postate si saltano e l''esito le conta (`righe_saltate`), con lo stesso vocabolario di fn_posta_contabile: un secondo verbo che risponde come il primo si impara una volta sola. ⭐ «Niente da correggere» e'' un ESITO (`NULLA_DA_CORREGGERE`) e non un errore, come NULLA_DA_POSTARE. ⛔ NON usa fn_get_or_create_vendite_contabile: la sua chiave di riuso su MANUALE comprende giornata + canale + OPERATORE, quindi le righe di correzione finirebbero nella distinta di lavoro di oggi — questa e'' un documento proprio. ⛔ E non registra niente: nasce in BOZZA e la registra una persona, guardandola. Precompilare e'' un aiuto, non una decisione. S6-4 del cantiere incassi.';
          rollback:
              - sql:
                    dbms: postgresql
                    splitStatements: true
                    sql: |
                        DROP FUNCTION IF EXISTS pagamenti.fn_crea_distinta_correzione(bigint, date, text);
