# NOVE E_GENERICO IN UNA FUNZIONE SOLA — passo P-7 (1 di 6)
#   pagamenti.fn_get_or_create_vendite_contabile
#   Piano: brief-db-posting-e-abbinamento-rata.md §2.0 P-7
#
# ── PERCHE' ORA, E NON «QUANDO CAPITA» ──────────────────────────────────
#   Il brief madre diceva che nessun codice errore di dominio `pagamenti` esiste
#   a catalogo. Il fatto piu' duro, misurato il 2026-08-21, e' che il codice GIA'
#   SCRITTO viola la regola dei codici errore: SETTE funzioni sollevano
#   `E_GENERICO` su VENTICINQUE punti — non «quattro funzioni su una quindicina»
#   come stimava il piano. Il posting (S1-10) verrebbe scritto accanto a loro, e
#   la stessa area risponderebbe con codici di due specie a seconda di quale
#   funzione si tocca.
#
# ── COME SONO STATI SCELTI I CODICI ─────────────────────────────────────
#   Il criterio del progetto: un codice nuovo nasce quando cambia il RIMEDIO, non
#   la sfumatura. Qui i nove punti sono di QUATTRO specie:
#
#   · DUE sono i dati che l'OPERATORE fornisce per aprire la distinta — il centro
#     di riscossione e la data contabile -> `E_CONTABILE_DATI_OBBLIGATORI`
#     (DATO_ERRATO). Vedi il riquadro sotto: e' la parte riscritta di questo file;
#   · QUATTRO sono guard su parametri che l'operatore NON tocca (`<= 0` su id dove
#     il NULL e' AMMESSO, stato interno vuoto) -> restano su
#     `E_PARAMETRO_INVALIDO`, che e' il codice registrato del progetto per questo
#     (classe DATO_ERRATO, 160 guard di parametro su 177 punti d'uso);
#   · UNO e' un catalogo non configurato -> `E_CONTABILE_STATO_NON_CONFIGURATO`,
#     classe TECNICO: chi ha fatto la richiesta non ha sbagliato niente e non puo'
#     farci niente. In un E_GENERICO questo caso e un parametro sbagliato si
#     leggono uguali, ed e' il piu' probabile dei venticinque;
#   · DUE sono regole di dominio -> `E_CONTABILE_COMPENSAZIONE_LOTTO_ESCLUSIVI`
#     (due origini incompatibili) e `E_CONTABILE_COMPENSAZIONE_GIA_PRESENTE`
#     (una testata esiste gia', classe CONFLITTO_STATO).
#
# ── 🔴 IL CRITERIO NON E' «GUARD DI PARAMETRO»: E' CHI LEGGE IL MESSAGGIO
#   La prima stesura mandava TUTTI E SEI i guard di parametro su
#   `E_PARAMETRO_INVALIDO`, sulla scorta della tabella «Regola operativa» di
#   `work-done/correzione-e-generico.md` (aprile 2026), che per «parametro
#   obbligatorio mancante o non valido» prescrive proprio quel codice.
#
#   ⚠️ Rivisto su segnalazione di Tid il 2026-08-21, e la segnalazione centrava un
#   difetto che il codice errore da solo non mostra: il VALORE che si passava era
#   un nome di parametro PL/pgSQL. L'operatore avrebbe letto
#
#       «Parametro non valido: p_centro_riscossione_id (obbligatorio, > 0)»
#
#   cioe' un messaggio di qualita' `E_GENERICO` sotto un codice registrato. Il
#   refactor di aprile esisteva per togliere esattamente quello — e lo ha tolto un
#   piano piu' giu', dove il codice era generico; qui rientrava dalla finestra nel
#   VALORE.
#
#   ⚠️ Seconda ragione, e non e' un'opinione: `docs/it/dev/api.md` (§Tassonomia
#   errori) dichiara `E_PARAMETRO_INVALIDO` **candidato allo split** — 113 funzioni
#   lo nominano, 111 con verita' 400 e 2 con verita' 404 — e ne trae la regola
#   *«un codice usato per due cose si spezza a monte, non si rimappa a valle»*.
#   Aggiungergli i punti che si possono evitare va nella direzione opposta a
#   quella che il progetto ha gia' scelto.
#
#   ⭐ **La linea che divide non e' «guard di parametro si'/no»: e' CHI PUO'
#   RIMEDIARE.** Il centro e la data li sceglie una persona in un form, quindi il
#   messaggio lo legge una persona. Un `id <= 0` su un parametro dove il NULL e'
#   ammesso, o un `codice_stato_interno` vuoto, non escono da nessuna interfaccia:
#   li produce solo un chiamante rotto, e il lettore di quel messaggio e' chi
#   guarda `dbops.error_log`. Per quei quattro `E_PARAMETRO_INVALIDO` e' la sede
#   giusta, e un codice nuovo sarebbe rumore.
#
#   ℹ️ Cosa NON cambia: il campo da evidenziare viaggia comunque nella chiave
#   `campo` del contesto, che `script.fn_log_and_raise_error` fa uscire sul canale
#   `COLUMN` dell'eccezione. E l'`ui_action` di entrambi i codici e'
#   `highlight_form_fields` — su `E_PARAMETRO_INVALIDO` e' gia' un override
#   esplicito in `error_ui_overrides.py`, non il default della classe.
#
# ── ⚠️ CAMBIANO I MESSAGGI: CHI LI ASSERISCE SI CERCA DAL NOME ─────────
#   I consumatori di un messaggio non si trovano cercando il testo — chi asserisce
#   su un frammento e' invisibile a quella ricerca. Si cercano dal NOME di chi
#   solleva. Verificato il 2026-08-21: nessun pgTAP e nessun file di backend
#   asserisce su un frammento dei messaggi di questa funzione. Il pgTAP esistente
#   (test-fn-get-or-create-vendite-contabile.sql, test 8) verifica il guard sul
#   centro con `throws_ok` SENZA nominare il testo.
#
# ── ⚠️ 80_data GIRA DOPO 20_code ────────────────────────────────────────
#   I tre codici nuovi arrivano a catalogo con l'append ai CSV di `80_data`, che
#   gira DUE FASI dopo questo file. NON si mette una preCondition su di essi: la
#   cercherebbe prima che esista. La dipendenza si rispetta scrivendo nell'ordine
#   (il CSV e' gia' scritto in questo commit), non con una precondizione.
#   ⚠️ Se un codice mancasse a runtime, `script.fn_log_and_raise_error` non tace:
#   il template resta com'e' e l'eccezione di dominio parte comunque col suo
#   codice — ma il messaggio non sarebbe leggibile.
#
# ── ⭐ TIPI ANCORATI CON %TYPE ANCHE IN FIRMA E IN RETURNS ─────────────
#   La regola del progetto vuole `%TYPE` in FIRMA, in RETURNS / RETURNS TABLE e
#   nei DECLARE. I nove DECLARE lo usavano gia'; la firma e il RETURNS no —
#   otto parametri e un tipo di ritorno dichiarati con tipi nudi.
#
#   ⚠️ Un `%TYPE` in firma e' una FOTOGRAFIA, non un link: PostgreSQL lo risolve
#   al momento del CREATE e memorizza il tipo risolto. Se il tipo risolto fosse
#   DIVERSO da quello attuale nascerebbe un OVERLOAD invece di una sostituzione —
#   e con i DEFAULT le chiamate diventerebbero ambigue. Misurato prima di
#   scrivere, il 2026-08-21:
#
#     centri_riscossione.id            -> bigint   (era bigint)
#     vendite_contabili.data_contabile -> date     (era date)
#     vendite_contabili.data_registrazione -> date (era date)
#     enti_incasso.id                  -> bigint   (era bigint)
#     compensazioni.id                 -> bigint   (era bigint)
#     vendite_contabili_lotti.lotto_id -> bigint   (era bigint)
#     vendite_contabili_stati.codice_interno -> text (era text)
#     vendite_contabili.meta           -> jsonb    (era jsonb)
#     RETURNS vendite_contabili.id     -> bigint   (era bigint)
#
#   Tutti identici, quindi il CREATE OR REPLACE SOSTITUISCE e non affianca.
#   Presidio: la prova in transazione annullata confronta
#   `pg_get_function_identity_arguments` prima e dopo, e verifica che le funzioni
#   di `pagamenti` restino una per nome.
#
# ── COSA QUESTO CHANGESET NON FA ────────────────────────────────────────
#   Non cambia UN SOLO predicato. Le condizioni che rifiutano sono identiche a
#   quelle di prima, riga per riga: cambia il nome del rifiuto, non il rifiuto.
#   ⚠️ In particolare NON tocca il riuso della testata a parita' di giornata: e'
#   il comportamento corretto (la testata e' una distinta, non un movimento
#   bancario) e la distinta MANUALE per operatore e' il passo S1-19 della slice 1.
