# Dipendenze: codici E_CONTABILE_STATO_NON_CONFIGURATO (939, TECNICO),
#   E_CONTABILE_COMPENSAZIONE_LOTTO_ESCLUSIVI (940, DATO_ERRATO),
#   E_CONTABILE_COMPENSAZIONE_GIA_PRESENTE (941, CONFLITTO_STATO),
#   E_CONTABILE_DATI_OBBLIGATORI (952, DATO_ERRATO).
