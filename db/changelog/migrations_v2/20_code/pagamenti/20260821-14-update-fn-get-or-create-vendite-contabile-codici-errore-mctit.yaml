databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260821-14-update-fn-get-or-create-vendite-contabile-codici-errore-mctit.yaml

  - changeSet:
      id: 20260821-14-update-fn-get-or-create-vendite-contabile-codici-errore
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        pagamenti.fn_get_or_create_vendite_contabile: i nove E_GENERICO passano ai
        codici registrati — E_CONTABILE_DATI_OBBLIGATORI per i due dati che
        l'operatore fornisce (centro e data contabile), E_PARAMETRO_INVALIDO per i
        quattro guard che solo un chiamante rotto puo' far scattare,
        E_CONTABILE_STATO_NON_CONFIGURATO (TECNICO) per il catalogo stati non
        seminato, E_CONTABILE_COMPENSAZIONE_LOTTO_ESCLUSIVI e
        E_CONTABILE_COMPENSAZIONE_GIA_PRESENTE per le due regole di dominio.
        Nessun predicato cambia.
      preConditions:
