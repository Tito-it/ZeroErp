# P-3 (1 di 3) — pagamenti.fn_get_saldi_rate: IL NUCLEO set-based dei saldi
#   Brief: brief-db-distinta-ricerca-rate §4.3 e §4-bis.4.
#
# -- UNA FORMULA, TRE PORTE -----------------------------------------------------
#   Fino a oggi il saldo di una rata aveva una porta sola, pagamenti.fn_get_saldo_rata:
#   plpgsql, tre letture, PER RATA. Su una fattura regge; sullo scadenzario (tutte
#   le rate aperte, e «aperta» E' un predicato sul residuo) sono N x 3 letture
#   prima di poter filtrare — non e' una misura, e' la struttura: uno scadenzario
#   e' il perimetro intero per costruzione.
#
#   Questa funzione e' la formula di fn_get_saldo_rata scritta UNA volta in forma
#   set-based (GROUP BY scadenza_id), e le porte sono tre:
#     1. fn_get_saldo_rata(id, escludi)   → SELECT dal nucleo con ARRAY[id]   (20260917-08)
#     2. vw_saldi_rate                    → nucleo(ARRAY di tutte le rate)     (20260917-09)
#     3. fn_get_saldi_rate(ARRAY[...id della pagina...]) dal backend, una chiamata
#   Due sedi del residuo divergono alla prima regola nuova, e sono numeri su cui
#   si sollecita un cliente (brief madre §2.7): per questo il nucleo e' UNO.
#
# -- PERCHE' LANGUAGE sql STABLE ---------------------------------------------------
#   Il nucleo NON solleva mai: una rata invisibile (RLS) o inesistente e' zero
#   righe, e a dire E_RATA_NON_TROVATA e' la porta 1. Senza ramo d'errore che
#   scrive puo' essere STABLE — cosa che fn_get_saldo_rata, deliberatamente, non
#   e' — e in SQL puro il planner puo' inlinarla: con l'array della pagina i
#   filtri si spingono negli aggregati come Index Cond sui due indici parziali
#   ix_vendite_movimenti_scadenza_id e ix_vendite_contabili_righe_scadenza_id;
#   con l'array di tutte le rate (la vista) sono due aggregati pagati una volta
#   e non N — il costo onesto dello scadenzario.
#
# -- ⛔ PERCHE' L'ARRAY E' OBBLIGATORIO, E NON «NULL = tutte» -----------------------
#   Provato il 2026-09-17 con EXPLAIN: la forma `p IS NULL OR x = ANY(p)` con un
#   array costante si piega a Index Cond, ma con `ARRAY[sc.id]` in LATERAL (o con
#   un parametro plpgsql in piano generico) il ramo IS NULL NON si piega e tutto
#   l'OR diventa un Filter: scansione intera di vendite_movimenti PER RATA —
#   cioe' proprio il costo che questa funzione esiste per togliere, e sul
#   percorso del guard di capienza (una lettura per ogni riga scritta).
#   Con `x = ANY(p)` nudo l'indice entra in ogni forma (costante, LATERAL,
#   parametro). NULL = zero righe, per semantica SQL: chi vuole tutte le rate
#   passa da vw_saldi_rate, che costruisce l'array con ARRAY(SELECT id ...).
#
# -- LA FORMULA E' QUELLA DI OGGI, e il pgTAP lo prova ------------------------------
#   saldo          = importo della rata − movimenti ATTIVI sulla rata
#   in_lavorazione = righe contabili ATTIVE, in stato POSTABILE, sotto una
#                    distinta NON finale, sulla rata
#   incassato      = i soli movimenti con centro presente e NON fondo fattura
#                    NE' compensazione (cassa vera, dalla parte prudente)
#   has_movimenti  = esiste almeno un movimento attivo sulla rata
#   p_escludi_contabile_riga_id toglie da movimenti e righe la riga che sta
#   scrivendo («quanto spazio c'era PRIMA di me»), come oggi.
#   Una rata SENZA movimenti torna lo stesso (LEFT JOIN sugli aggregati) con
#   has_movimenti = false: senza, la LATERAL del picker perderebbe le rate mai
#   toccate. test-abbinamento-rata.sql e test-fn-get-saldo-fattura-tre-numeri.sql
#   restano invariati e devono restare verdi: e' la prova che il contenitore e'
#   fedele. La regola NUOVA (l'imputazione, Q-A/γ) e' la rev successiva
#   (20260917-10), cosi' un rosso dice quale delle due ha sbagliato.
#
# -- RLS -------------------------------------------------------------------------
#   INVOKER: somma cio' che l'operatore vede su fatture_scadenze, vendite_movimenti
#   e vendite_contabili_righe (tutte con policy), esattamente come oggi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260917-07-create-fn-get-saldi-rate-mctit.yaml

  - changeSet:
      id: 20260917-07-create-fn-get-saldi-rate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        pagamenti.fn_get_saldi_rate(p_scadenza_ids bigint[], p_escludi_contabile_riga_id):
        il nucleo set-based dei saldi delle rate (saldo, in_lavorazione, incassato,
        has_movimenti per scadenza_id), LANGUAGE sql STABLE, stessa formula di
        fn_get_saldo_rata. Array obbligatorio (= ANY, indicizzabile in ogni forma).
        Brief: brief-db-distinta-ricerca-rate
        §4-bis.4 (P-3, 1 di 3).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: fatture_scadenze
            - tableExists:
                schemaName: pagamenti
                tableName: vendite_movimenti
            - tableExists:
                schemaName: pagamenti
                tableName: vendite_contabili_righe
            - columnExists:
                schemaName: pagamenti
                tableName: centri_riscossione
                columnName: is_compensazione
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pagamenti.fn_get_saldi_rate(
                  p_scadenza_ids              bigint[],
                  p_escludi_contabile_riga_id bigint   DEFAULT NULL)
              RETURNS TABLE(
                  scadenza_id    bigint,
                  saldo          numeric,
                  in_lavorazione numeric,
                  incassato      numeric,
                  has_movimenti  boolean)
              LANGUAGE sql
              STABLE
              AS $function$
              -- Scopo: il nucleo set-based dei saldi delle rate — la formula di
              --        fn_get_saldo_rata scritta una volta per N rate.
              -- Regole: p_scadenza_ids OBBLIGATORIO (NULL = zero righe: per tutte
              --         le rate c'e' vw_saldi_rate); una rata senza movimenti torna
              --         lo stesso (LEFT); non solleva mai; STABLE.
              SELECT s.id                                          AS scadenza_id,
                     s.importo - COALESCE(m.movimenti, 0)          AS saldo,
                     COALESCE(l.in_lavorazione, 0)                 AS in_lavorazione,
                     COALESCE(m.incassato, 0)                      AS incassato,
                     COALESCE(m.has_movimenti, false)              AS has_movimenti
                FROM vendite.fatture_scadenze s
                -- Cio' che e' REGISTRATO, e quanto di quello e' cassa vera.
                LEFT JOIN (
                    SELECT m.scadenza_id,
                           SUM(m.importo) AS movimenti,
                           SUM(m.importo) FILTER (
                               WHERE c.id IS NOT NULL
                                 AND c.is_fondo_fattura IS FALSE
                                 AND c.is_compensazione IS FALSE) AS incassato,
                           true AS has_movimenti
                      FROM pagamenti.vendite_movimenti m
                      LEFT JOIN pagamenti.centri_riscossione c ON c.id = m.centro_riscossione_id
                     WHERE m.attivo IS TRUE
                       AND m.scadenza_id IS NOT NULL
                       AND m.scadenza_id = ANY (p_scadenza_ids)
                       AND (p_escludi_contabile_riga_id IS NULL
                            OR m.contabile_riga_id IS DISTINCT FROM p_escludi_contabile_riga_id)
                     GROUP BY m.scadenza_id
                ) m ON m.scadenza_id = s.id
                -- Cio' che e' DICHIARATO e non ancora registrato: righe postabili
                -- sotto una testata NON finale (una riga sotto una distinta chiusa
                -- non e' in lavorazione, e' ferma).
                LEFT JOIN (
                    SELECT cr.scadenza_id,
                           SUM(cr.importo) AS in_lavorazione
                      FROM pagamenti.vendite_contabili_righe cr
                      JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                      JOIN pagamenti.vendite_contabili co             ON co.id = cr.contabile_id
                      JOIN pagamenti.vendite_contabili_stati cs       ON cs.id = co.stato_id
                     WHERE cr.attivo IS TRUE
                       AND cr.scadenza_id IS NOT NULL
                       AND st.is_postabile IS TRUE
                       AND cs.is_final IS NOT TRUE
                       AND cr.scadenza_id = ANY (p_scadenza_ids)
                       AND (p_escludi_contabile_riga_id IS NULL
                            OR cr.id <> p_escludi_contabile_riga_id)
                     GROUP BY cr.scadenza_id
                ) l ON l.scadenza_id = s.id
               WHERE s.id = ANY (p_scadenza_ids);
              $function$;

              COMMENT ON FUNCTION pagamenti.fn_get_saldi_rate(bigint[], bigint)
              IS 'IL NUCLEO dei saldi delle rate: la formula di fn_get_saldo_rata scritta UNA volta in forma set-based, per N rate. `saldo` = importo della rata meno i movimenti attivi; `in_lavorazione` = righe contabili attive, postabili, sotto distinta non finale; `incassato` = i soli movimenti con centro presente e non fondo fattura ne'' compensazione (cassa vera); `has_movimenti` = almeno un movimento attivo. p_scadenza_ids e'' OBBLIGATORIO e si filtra con `= ANY` nudo: NULL = zero righe (semantica SQL), e per TUTTE le rate c''e'' vw_saldi_rate, che costruisce l''array. ⛔ Non «NULL = tutte» con un `p IS NULL OR`: provato con EXPLAIN il 2026-09-17, con ARRAY[sc.id] in LATERAL o un parametro plpgsql in piano generico il ramo IS NULL non si piega e l''OR diventa un Filter — scansione intera dei movimenti per rata, sul percorso del guard di capienza. Una rata senza movimenti torna lo stesso con has_movimenti false. p_escludi_contabile_riga_id toglie la riga che sta scrivendo, come nella porta a un elemento. ⭐ TRE PORTE, UNA FORMULA: fn_get_saldo_rata (il caso a un elemento, con guard ed E_RATA_NON_TROVATA), vw_saldi_rate (il nucleo sull''array di tutte le rate) e la chiamata con l''array della pagina dal backend. Due sedi del residuo divergono alla prima regola nuova, e sono numeri su cui si sollecita un cliente. ⚠️ STABLE e LANGUAGE sql di proposito: non solleva mai (una rata invisibile e'' zero righe, non un errore) e il planner puo'' inlinarla — con l''array della pagina i filtri scendono negli aggregati come Index Cond sui parziali *_scadenza_id; con l''array di tutte le rate sono due aggregati pagati una volta. INVOKER: somma cio'' che chi legge vede. Nasce il 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.4, P-3) come CONTENITORE fedele; la regola nuova dell''imputazione (Q-A/γ) e'' la rev successiva.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS pagamenti.fn_get_saldi_rate(bigint[], bigint);
