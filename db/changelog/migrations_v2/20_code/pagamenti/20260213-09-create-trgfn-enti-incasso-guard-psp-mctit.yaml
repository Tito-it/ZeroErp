databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260213-09-create-trgfn-enti-incasso-guard-psp-mctit.yaml

  - changeSet:
      id: 20260213-09-create-trgfn-enti-incasso-guard-psp
      author: mctit
      comment: "Guard su pagamenti.enti_incasso per coerenza tipo PSP con anagrafiche.psp"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pagamenti.trgfn_enti_incasso_guard_psp()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_is_ruolo_psp boolean := false;
                v_exists_psp boolean := false;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Validare la coerenza tra tipo ente incasso e ruolo PSP.
                --
                -- Regole:
                --   - se tipo = 'PSP', soggetto_ruolo_id e' obbligatorio
                --   - il soggetto_ruolo_id deve appartenere al tipo ruolo PSP
                --   - deve esistere una riga attiva in anagrafiche.psp
                -- =========================================================

                IF NEW.tipo = 'PSP' THEN
                  IF NEW.soggetto_ruolo_id IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', 'pagamenti.trgfn_enti_incasso_guard_psp', 'E_GENERICO',
                      jsonb_build_object(
                        'detail', 'soggetto_ruolo_id obbligatorio per tipo PSP',
                        'tipo', NEW.tipo
                      ),
                      NULL::uuid,
                      concat('soggetto_ruolo_id obbligatorio per tipo PSP', ' ( tipo= ', NEW.tipo, ')')
                    );
                  END IF;

                  SELECT EXISTS (
                    SELECT 1
                    FROM anagrafiche.soggetti_ruoli sr
                    JOIN config.tipi_ruoli tr
                      ON tr.id = sr.tipo_ruolo_id
                    WHERE sr.id = NEW.soggetto_ruolo_id
                      AND tr.codice_interno = 'PSP'
                  )
                  INTO v_is_ruolo_psp;

                  IF NOT v_is_ruolo_psp THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', 'pagamenti.trgfn_enti_incasso_guard_psp', 'E_GENERICO',
                      jsonb_build_object(
                        'detail', 'soggetto_ruolo_id non coerente con ruolo PSP',
                        'soggetto_ruolo_id', NEW.soggetto_ruolo_id
                      ),
                      NULL::uuid,
                      concat('Ruolo non PSP per soggetto_ruolo_id= ', NEW.soggetto_ruolo_id::text, ' tipo= ', NEW.tipo)
                    );
                  END IF;

                  SELECT EXISTS (
                    SELECT 1
                    FROM anagrafiche.psp p
                    WHERE p.soggetto_ruolo_id = NEW.soggetto_ruolo_id
                      AND p.attivo IS TRUE
                  )
                  INTO v_exists_psp;

                  IF NOT v_exists_psp THEN
                    PERFORM script.fn_log_and_raise_error(
                      'pagamenti', TG_NAME, 'E_GENERICO',
                      jsonb_build_object(
                        'detail', 'soggetto_ruolo_id PSP non censito in anagrafiche.psp',
                        'soggetto_ruolo_id', NEW.soggetto_ruolo_id
                      ),
                      NULL::uuid,
                      format('PSP non censito/attivo per soggetto_ruolo_id=%s', NEW.soggetto_ruolo_id::text)
                    );
                  END IF;
                END IF;

                RETURN NEW;
              END;
              $$;

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_enti_incasso_guard_psp_ins_upd ON pagamenti.enti_incasso;

              CREATE TRIGGER trg_enti_incasso_guard_psp_ins_upd
              BEFORE INSERT OR UPDATE
              ON pagamenti.enti_incasso
              FOR EACH ROW
              EXECUTE FUNCTION pagamenti.trgfn_enti_incasso_guard_psp();
