# P-7 — pagamenti.vw_rate_fuori_capienza porta la NATURA del documento:
#   `natura_doc_codice_interno` e `natura_doc_descrizione`, in coda.
#   Brief: brief-db-distinta-ricerca-rate §4-bis.6 e §4-bis.9 (rilievo BE/FE
#   del 17-09 sera, P-7).
#
# -- PERCHE' ------------------------------------------------------------------------
#   Con P-5 la nota di credito ha una rata (negativa), e la vista la elenca
#   con lo STESSO vocabolario a due valori delle fatture: SOVRA_INCASSATA
#   significa «rimborsato piu' del credito», MOVIMENTO_CONTRARIO «e' entrato
#   denaro invece di uscire». Il 20260917-14 l'ha scritto nel COMMENT e ha
#   affidato la sfumatura all'ETICHETTA del frontend — senza dare al frontend
#   il dato per farlo: la riga non diceva se il documento e' una fattura o
#   una nota di credito. Un'etichetta che deve dipendere dalla natura senza
#   avere la natura e' una promessa fatta a meta'.
#
# -- CHE COSA CAMBIA -----------------------------------------------------------------
#   Due colonne in coda (una vista ammette solo l'append): `natura_doc_codice_interno`
#   (la chiave stabile su cui il FE ramifica, linee-guida-sql §6c) e
#   `natura_doc_descrizione` (la parola a video). JOIN INTERNO su
#   config.nature_doc_fiscale: fatture.natura_doc_id e' NOT NULL con FK, quindi
#   non toglie nessuna riga (la stessa scelta di vw_fatture_lista e di
#   vw_fatture_scadenze_lista). Nient'altro cambia: motivo, WHERE, candidati,
#   saldo dal nucleo, numero_documento. security_invoker=on ri-specificata.
#
# -- CHI LA LEGGE, verificato il 18-09 ----------------------------------------------
#   Backend: pagamenti_repository.list_rate_fuori_capienza fa `SELECT v.*`
#   (le colonne arrivano al FE senza una riga di BE); la whitelist di
#   ordinamento RATE_FUORI_CAPIENZA_SORT_COLUMNS NON le nomina → nel seed della
#   lista 52 la colonna `natura` nasce `ordinabile = f` (presidio
#   test_liste_configurabili_seed). pgTAP: test-nc-rata-unica-v1 (+1 test),
#   test-abbinamento-rata 13-14 (leggono per nome: invariati).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260918-03-update-vw-rate-fuori-capienza-natura-mctit.yaml

  - changeSet:
      id: 20260918-03-update-vw-rate-fuori-capienza-natura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        pagamenti.vw_rate_fuori_capienza: + natura_doc_codice_interno e natura_doc_descrizione
        in coda (JOIN interno su config.nature_doc_fiscale, NOT NULL + FK): il frontend deve
        dire «sovra-rimborsata» sulla nota di credito e non aveva il dato. Nient'altro cambia.
        security_invoker=on ri-specificata. Brief: brief-db-distinta-ricerca-rate §4-bis.9 (P-7).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: pagamenti
                viewName: vw_rate_fuori_capienza
            - columnExists:
                schemaName: vendite
                tableName: fatture
                columnName: natura_doc_id
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM information_schema.columns
                  WHERE table_schema = 'pagamenti' AND table_name = 'vw_rate_fuori_capienza'
                    AND column_name = 'numero_documento'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW pagamenti.vw_rate_fuori_capienza
              WITH (security_invoker=on) AS
              WITH candidate AS (
                  -- Il pre-filtro: le sole rate che qualcuno ha toccato. Tre rami:
                  -- un movimento che la nomina, una riga forzata che la nomina,
                  -- oppure — dal 2026-09-17 — un movimento del suo DOCUMENTO senza
                  -- rata, che il nucleo imputa e che puo' portarla fuori banda senza
                  -- nominarla.
                  SELECT s.id AS scadenza_id,
                         s.fattura_id,
                         s.numero_rata,
                         s.data_scadenza,
                         s.importo
                    FROM vendite.fatture_scadenze s
                   WHERE EXISTS (SELECT 1 FROM pagamenti.vendite_movimenti m
                                  WHERE m.scadenza_id = s.id AND m.attivo IS TRUE)
                      OR EXISTS (SELECT 1 FROM pagamenti.vendite_contabili_righe cr
                                  WHERE cr.scadenza_id = s.id AND cr.attivo IS TRUE AND cr.forzata IS TRUE)
                      OR EXISTS (SELECT 1 FROM pagamenti.vendite_movimenti m
                                  WHERE m.fattura_id = s.fattura_id AND m.scadenza_id IS NULL AND m.attivo IS TRUE)
              )
              SELECT
                  -- D14-c, senza estremi da invertire: ha attraversato lo zero, oppure
                  -- supera l'importo in valore assoluto.
                  CASE
                      WHEN sign(x.saldo) <> sign(c.importo) AND x.saldo <> 0 THEN 'SOVRA_INCASSATA'::text
                      ELSE 'MOVIMENTO_CONTRARIO'::text
                  END                                                   AS motivo,
                  c.scadenza_id,
                  c.fattura_id,
                  f.anno,
                  f.serie,
                  f.numero                                              AS fattura_numero,
                  f.billing_account_id,
                  f.emittente_soggetto_ruolo_id,
                  c.numero_rata,
                  c.data_scadenza,
                  c.importo                                             AS importo_rata,
                  (c.importo - x.saldo)                                 AS registrato,
                  x.saldo                                               AS residuo,
                  x.incassato,
                  x.in_lavorazione,
                  fz.righe_forzate,
                  fz.motivi_forzatura,
                  vendite.fn_numero_documento_fattura(f.numero, f.serie) AS numero_documento,
                  -- ⭐ P-7 (2026-09-18): la natura del documento, perche' il
                  --    vocabolario dei motivi resta a due valori e la sfumatura
                  --    («sovra-rimborsata» su una nota di credito) la dice
                  --    l'etichetta — che senza questo dato non poteva dirla.
                  --    Alias FEDELE alla sorgente (linee-guida-sql §6c): il FE
                  --    ramifica su codice_interno, mostra la descrizione.
                  nd.codice_interno                                     AS natura_doc_codice_interno,
                  nd.descrizione                                        AS natura_doc_descrizione
                FROM candidate c
                JOIN vendite.fatture f ON f.id = c.fattura_id
                -- INNER: fatture.natura_doc_id e' NOT NULL con FK — non toglie
                -- nessuna riga, come in vw_fatture_lista.
                JOIN config.nature_doc_fiscale nd ON nd.id = f.natura_doc_id
                -- Il saldo dal NUCLEO, in una chiamata sull'insieme dei candidati
                -- (la porta 3): con l'imputazione ogni rata legge il piano intero
                -- del suo documento, e una LATERAL per rata lo rileggerebbe N volte.
                JOIN pagamenti.fn_get_saldi_rate(ARRAY(SELECT cd.scadenza_id FROM candidate cd)) x
                  ON x.scadenza_id = c.scadenza_id
                LEFT JOIN LATERAL (
                    SELECT count(*)::integer AS righe_forzate,
                           string_agg(NULLIF(btrim(cr.motivo_forzatura), ''), ' · ' ORDER BY cr.id) AS motivi_forzatura
                      FROM pagamenti.vendite_contabili_righe cr
                     WHERE cr.scadenza_id = c.scadenza_id AND cr.attivo IS TRUE AND cr.forzata IS TRUE
                ) fz ON true
               WHERE (sign(x.saldo) <> sign(c.importo) AND x.saldo <> 0)
                  OR abs(x.saldo) > abs(c.importo);

              COMMENT ON VIEW pagamenti.vw_rate_fuori_capienza
              IS 'Le rate il cui residuo e'' uscito dalla banda: l''elenco senza il quale la forzatura sarebbe un modo di NASCONDERE denaro invece di registrarlo (brief madre §5). ⭐ DUE motivi e non uno: SOVRA_INCASSATA (il residuo ha ATTRAVERSATO lo zero — e'' entrato piu'' del dovuto; su una nota di credito: rimborsato piu'' del credito) e MOVIMENTO_CONTRARIO (il residuo SUPERA l''importo della rata in valore assoluto — e'' uscito denaro dove non era entrato; su una nota di credito: e'' entrato denaro invece di uscire). Il secondo e'' il caso che ha fatto cadere l''asimmetria di D1-bis, ed e'' il motivo per cui la vista NON si chiama «sovra incassate». ⭐ rev 2026-09-18 (P-7, brief-db-distinta-ricerca-rate §4-bis.9): + natura_doc_codice_interno e natura_doc_descrizione in coda, JOIN interno su config.nature_doc_fiscale (NOT NULL + FK: nessuna riga in meno) — la sfumatura dei due motivi sulla nota di credito e'' affidata all''etichetta del frontend, che senza la natura del documento non poteva dirla. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.6, P-5): la banda NON e'' piu'' [0, importo] — era la trappola del §5 del brief madre, sciolta sul guard da D14-c e non qui — ma la forma di D14-c: segno e valore assoluto, senza estremi da invertire, giusta anche sulla rata NEGATIVA della nota di credito. Sulle rate positive e'' identica a prima. Il vocabolario resta a due valori: la sfumatura la dice l''etichetta. ⭐ Stessa rev: i CANDIDATI includono le rate di un documento con movimenti SENZA rata (dal 20260917-10 il nucleo dei saldi li imputa alle rate, e una rata puo'' uscire dalla banda senza che nessun movimento la nomini); il saldo arriva dal nucleo pagamenti.fn_get_saldi_rate in UNA chiamata sull''insieme dei candidati e non piu'' in LATERAL per rata; + numero_documento in coda dalla sede unica vendite.fn_numero_documento_fattura (la lista ui 52 mostrava il contatore nudo, ambiguo fra fattura e nota di credito). ⚠️ Il criterio guarda i FATTI: contano i movimenti registrati, non le righe ancora in lavorazione — `in_lavorazione` resta come colonna, per chi legge la riga e se lo chiede. ⚠️ Le righe forzate sono la TRACCIA della decisione, non il criterio. ⚠️ La formula del saldo NON e'' ricopiata: e'' il nucleo, una sede sola. ⚠️ security_invoker=on: va RI-SPECIFICATA a ogni CREATE OR REPLACE o PostgreSQL la azzera. S2-7 del cantiere incassi.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Le colonne aggiunte in coda si tolgono solo con DROP + CREATE.
              DROP VIEW IF EXISTS pagamenti.vw_rate_fuori_capienza;
              CREATE VIEW pagamenti.vw_rate_fuori_capienza
              WITH (security_invoker=on) AS
              WITH candidate AS (
                  SELECT s.id AS scadenza_id, s.fattura_id, s.numero_rata, s.data_scadenza, s.importo
                    FROM vendite.fatture_scadenze s
                   WHERE EXISTS (SELECT 1 FROM pagamenti.vendite_movimenti m
                                  WHERE m.scadenza_id = s.id AND m.attivo IS TRUE)
                      OR EXISTS (SELECT 1 FROM pagamenti.vendite_contabili_righe cr
                                  WHERE cr.scadenza_id = s.id AND cr.attivo IS TRUE AND cr.forzata IS TRUE)
                      OR EXISTS (SELECT 1 FROM pagamenti.vendite_movimenti m
                                  WHERE m.fattura_id = s.fattura_id AND m.scadenza_id IS NULL AND m.attivo IS TRUE)
              )
              SELECT
                  CASE WHEN sign(x.saldo) <> sign(c.importo) AND x.saldo <> 0 THEN 'SOVRA_INCASSATA'::text
                       ELSE 'MOVIMENTO_CONTRARIO'::text END AS motivo,
                  c.scadenza_id, c.fattura_id, f.anno, f.serie, f.numero AS fattura_numero,
                  f.billing_account_id, f.emittente_soggetto_ruolo_id,
                  c.numero_rata, c.data_scadenza, c.importo AS importo_rata,
                  (c.importo - x.saldo) AS registrato, x.saldo AS residuo, x.incassato, x.in_lavorazione,
                  fz.righe_forzate, fz.motivi_forzatura,
                  vendite.fn_numero_documento_fattura(f.numero, f.serie) AS numero_documento
                FROM candidate c
                JOIN vendite.fatture f ON f.id = c.fattura_id
                JOIN pagamenti.fn_get_saldi_rate(ARRAY(SELECT cd.scadenza_id FROM candidate cd)) x
                  ON x.scadenza_id = c.scadenza_id
                LEFT JOIN LATERAL (
                    SELECT count(*)::integer AS righe_forzate,
                           string_agg(NULLIF(btrim(cr.motivo_forzatura), ''), ' · ' ORDER BY cr.id) AS motivi_forzatura
                      FROM pagamenti.vendite_contabili_righe cr
                     WHERE cr.scadenza_id = c.scadenza_id AND cr.attivo IS TRUE AND cr.forzata IS TRUE
                ) fz ON true
               WHERE (sign(x.saldo) <> sign(c.importo) AND x.saldo <> 0)
                  OR abs(x.saldo) > abs(c.importo);
              GRANT SELECT, INSERT, UPDATE, DELETE ON pagamenti.vw_rate_fuori_capienza TO zeroerp_app;
