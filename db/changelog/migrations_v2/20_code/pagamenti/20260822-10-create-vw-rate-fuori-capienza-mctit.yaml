# L'ELENCO SENZA IL QUALE LA FORZATURA E' UN MODO DI NASCONDERE
#   pagamenti.vw_rate_fuori_capienza — passo S2-7 (lotto 5)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.2 S2-7 · Decisione: brief madre §5, D14-d
#
# ── 🔴 PERCHE' ESISTE ─────────────────────────────────────────────────
#   Il guard della rata **accetta** la registrazione fuori capienza, purche'
#   dichiarata. Senza un elenco a valle quella dichiarazione e' *«un modo per
#   nascondere, non per registrare»* — la frase e' del brief madre, ed e' la
#   ragione per cui questa vista sta **nello stesso lotto** del guard che
#   permette la forzatura, e non in un lotto dopo.
#
# ── ⚠️ IL NOME NON E' QUELLO DEL PIANO, E LA DIFFERENZA E' SOSTANZA ────
#   Il piano la chiamava `vw_rate_sovra_incassate`. Sarebbe stato un nome che
#   **dice meno di cio' che l'elenco contiene**: fuori capienza si esce in
#   **due** versi, e il secondo non e' un sovra-incasso.
#
#   | Motivo | Che cosa e' successo | Esempio |
#   | --- | --- | --- |
#   | `SOVRA_INCASSATA` | e' entrato piu' del dovuto: il residuo e' **negativo** | rata 100, incassato 110 |
#   | `MOVIMENTO_CONTRARIO` | e' uscito denaro dove non era entrato: il residuo **supera l'importo** della rata | rata 100, rimborso 30 senza incasso |
#
#   ⭐ Il secondo e' esattamente il caso che ha fatto cadere l'asimmetria di
#   D1-bis: *pagato 110, rimborso 15 invece di 10*. Chiamare l'elenco «sovra
#   incassate» avrebbe lasciato fuori dal nome proprio il caso che ha cambiato
#   la regola.
#
# ── ⭐ COME SI DECIDE CHI ENTRA ───────────────────────────────────────
#   Il residuo **fuori dalla banda `[0, importo]`**. Non e' un terzo criterio
#   inventato qui: e' la stessa regola del guard letta a posteriori — *un
#   movimento riduce cio' che manca e non lo supera* — applicata al risultato
#   invece che al singolo movimento.
#
#   ⚠️ **Sui FATTI, non sulle intenzioni**: contano i movimenti registrati, non
#   le righe ancora in lavorazione. Una riga dichiarata e non registrata non ha
#   ancora fatto danno, e metterla qui vorrebbe dire chiedere all'operatore di
#   guardare qualcosa che potrebbe non succedere mai. ℹ️ `in_lavorazione` c'e'
#   comunque come **colonna**, per chi legge la riga e si chiede «e questo?».
#
# ── ⚠️ LA FORMULA STA IN UNA FUNZIONE SOLA ────────────────────────────
#   La vista chiama `fn_get_saldo_rata` in `LATERAL` invece di rifare le somme:
#   due copie della regola darebbero prima o poi due risposte diverse alla
#   stessa domanda, e la divergenza si vedrebbe come *un elenco che segnala
#   cio' che il guard ha lasciato passare*. E' la stessa forma di
#   `vendite.vw_fondi_fattura_da_decidere`, che chiama le sue due funzioni.
#
#   ⭐ E il costo si limita **prima** della LATERAL: entrano solo le rate che
#   hanno almeno un movimento o una riga forzata. Una rata che nessuno ha
#   toccato ha residuo uguale all'importo, cioe' dentro la banda per
#   costruzione: chiederlo a una funzione sarebbe lavoro per una risposta nota.
#
# ── ⚠️ `security_invoker=on`, e va RI-SPECIFICATA a ogni CREATE OR REPLACE ─
#   Senza, PostgreSQL la azzera e la vista tornerebbe a girare coi diritti del
#   proprietario: chiunque vedrebbe le rate di tutti gli emittenti. Con
#   l'invoker, la RLS su `vendite.fatture` e `fatture_scadenze` filtra da se'.
#
# Verifica: db/pgtap/pagamenti/test-abbinamento-rata.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260822-10-create-vw-rate-fuori-capienza-mctit.yaml

  - changeSet:
      id: 20260822-10-create-vw-rate-fuori-capienza
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L'elenco delle rate uscite dalla capienza, senza il quale la forzatura sarebbe un
        modo di nascondere denaro invece di registrarlo. Due motivi e non uno: sovra
        incassata (residuo negativo) e movimento contrario (residuo oltre l'importo della
        rata) — il secondo e' il caso che ha fatto cadere l'asimmetria di D1-bis, e il nome
        del piano lo lasciava fuori. Il criterio e' il residuo fuori dalla banda [0,
        importo], cioe' la regola del guard letta a posteriori. Chiama fn_get_saldo_rata
        invece di rifare le somme: due copie della regola darebbero due risposte diverse, e
        la divergenza si vedrebbe come un elenco che segnala cio' che il guard ha lasciato
        passare.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'pagamenti' AND p.proname = 'fn_get_saldo_rata'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW pagamenti.vw_rate_fuori_capienza
              WITH (security_invoker=on) AS
              WITH candidate AS (
                  -- ⭐ Solo le rate che qualcuno ha toccato: una rata senza
                  --    movimenti e senza forzature ha residuo uguale all'importo,
                  --    cioe' dentro la banda per costruzione.
                  SELECT s.id            AS scadenza_id,
                         s.fattura_id,
                         s.numero_rata,
                         s.data_scadenza,
                         s.importo
                    FROM vendite.fatture_scadenze s
                   WHERE EXISTS (
                             SELECT 1
                               FROM pagamenti.vendite_movimenti m
                              WHERE m.scadenza_id = s.id
                                AND m.attivo IS TRUE)
                      OR EXISTS (
                             SELECT 1
                               FROM pagamenti.vendite_contabili_righe cr
                              WHERE cr.scadenza_id = s.id
                                AND cr.attivo IS TRUE
                                AND cr.forzata IS TRUE)
              )
              SELECT
                  CASE
                      WHEN x.saldo < 0 THEN 'SOVRA_INCASSATA'::text
                      ELSE 'MOVIMENTO_CONTRARIO'::text
                  END                                        AS motivo,
                  c.scadenza_id,
                  c.fattura_id,
                  f.anno,
                  f.serie,
                  f.numero                                   AS fattura_numero,
                  f.billing_account_id,
                  f.emittente_soggetto_ruolo_id,
                  c.numero_rata,
                  c.data_scadenza,
                  c.importo                                  AS importo_rata,
                  (c.importo - x.saldo)                      AS registrato,
                  x.saldo                                    AS residuo,
                  x.incassato,
                  x.in_lavorazione,
                  -- ⚠️ Le righe forzate sono la TRACCIA della decisione, non il
                  --    criterio: una rata puo' essere fuori capienza senza che
                  --    nessuno abbia forzato niente (due incassi legittimi
                  --    arrivati sullo stesso documento).
                  fz.righe_forzate,
                  fz.motivi_forzatura
                FROM candidate c
                JOIN vendite.fatture f ON f.id = c.fattura_id
                CROSS JOIN LATERAL pagamenti.fn_get_saldo_rata(c.scadenza_id) x
                LEFT JOIN LATERAL (
                    SELECT count(*)::integer AS righe_forzate,
                           string_agg(NULLIF(btrim(cr.motivo_forzatura), ''), ' · '
                                      ORDER BY cr.id) AS motivi_forzatura
                      FROM pagamenti.vendite_contabili_righe cr
                     WHERE cr.scadenza_id = c.scadenza_id
                       AND cr.attivo IS TRUE
                       AND cr.forzata IS TRUE
                ) fz ON TRUE
               WHERE x.saldo < 0
                  OR x.saldo > c.importo;

              COMMENT ON VIEW pagamenti.vw_rate_fuori_capienza
              IS 'Le rate il cui residuo e'' uscito dalla banda [0, importo]: l''elenco senza il quale la forzatura sarebbe un modo di NASCONDERE denaro invece di registrarlo (brief madre §5). ⭐ DUE motivi e non uno: SOVRA_INCASSATA (residuo negativo — e'' entrato piu'' del dovuto) e MOVIMENTO_CONTRARIO (residuo oltre l''importo della rata — e'' uscito denaro dove non era entrato). Il secondo e'' il caso che ha fatto cadere l''asimmetria di D1-bis (pagato 110, rimborso 15 invece di 10), ed e'' il motivo per cui la vista NON si chiama «sovra incassate» come diceva il piano: quel nome avrebbe lasciato fuori proprio il caso che ha cambiato la regola. ⚠️ Il criterio guarda i FATTI: contano i movimenti registrati, non le righe ancora in lavorazione — una riga dichiarata e non registrata non ha ancora fatto danno, e chiedere di guardarla vorrebbe dire mostrare qualcosa che potrebbe non succedere mai. `in_lavorazione` resta come colonna, per chi legge la riga e se lo chiede. ⚠️ Le righe forzate sono la TRACCIA della decisione, non il criterio: una rata puo'' essere fuori capienza senza che nessuno abbia forzato niente — due incassi legittimi arrivati sullo stesso documento bastano. ⚠️ La formula del saldo NON e'' ricopiata: si chiama pagamenti.fn_get_saldo_rata in LATERAL, perche'' due copie della regola darebbero prima o poi due risposte diverse e la divergenza si vedrebbe come un elenco che segnala cio'' che il guard ha lasciato passare. Il costo si limita prima, con un pre-filtro sulle sole rate che qualcuno ha toccato. ⚠️ security_invoker=on: va RI-SPECIFICATA a ogni CREATE OR REPLACE o PostgreSQL la azzera, e la vista tornerebbe a mostrare le rate di tutti gli emittenti. S2-7 del cantiere incassi.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              DROP VIEW IF EXISTS pagamenti.vw_rate_fuori_capienza;
