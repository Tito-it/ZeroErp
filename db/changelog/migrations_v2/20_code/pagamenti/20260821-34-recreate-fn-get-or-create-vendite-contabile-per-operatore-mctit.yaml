# UNA DISTINTA MANUALE E' IL LOTTO DI LAVORO DI UNA PERSONA — passo S1-19
#   pagamenti.fn_get_or_create_vendite_contabile
#   Piano: brief-db-posting-e-abbinamento-rata.md §2.1 S1-19 · Decisione: D12-a, D12-b-bis
#
# ── ⭐ LA RICHIESTA ERA UN LOCK, E LA RISPOSTA E' UN RAGGRUPPAMENTO ────
#   Tid aveva chiesto che una distinta aperta da un operatore fosse inaccessibile
#   agli altri. ⭐ Con il raggruppamento giusto **la contesa non esiste**, quindi
#   il lock non si costruisce: niente colonne di blocco, niente scadenze del lock,
#   niente sblocco d'emergenza, nessun guard su chi tiene la chiave.
#
#   > *Il presidio piu' economico non e' quello meglio costruito: e' quello che il
#   > modello rende inutile.*
#
#   Il raggruppamento «giornata + canale» non ha un referente nel mondo: nessun
#   documento reale corrisponde a *«tutti gli incassi banca di lunedi' digitati a
#   mano»*. Il **lotto di lavoro di una persona** ce l'ha.
#
# ── COSA CAMBIA, IN CONCRETO ──────────────────────────────────────────
#   1. la firma guadagna **`p_origine`** (`MANUALE` / `AUTOMATICA` / `GENERATA`);
#   2. la chiave di riuso guadagna **`origine`** — due specie diverse non
#      condividono mai una distinta;
#   3. e, **solo su `MANUALE`**, guadagna anche **chi sta lavorando**.
#
#   ⚠️ Sulle altre due origini la chiave resta quella di prima, ed e' giusto: una
#   distinta `GENERATA` non e' il lotto di lavoro di nessuno, e una `AUTOMATICA`
#   e' il file.
#
# ── ⚠️ CHI E' «L'OPERATORE»: LA STESSA ESPRESSIONE DELL'AUDIT ─────────
#   `COALESCE(NULLIF(current_setting('app.jwt_user', true), ''), CURRENT_USER)` —
#   identica a quella con cui `script.trgfn_audit_data_user_generic` valorizza
#   `user_insert`. ⭐ Non e' un dettaglio: la chiave di riuso confronta
#   `vc.user_insert`, e se le due espressioni divergessero il riuso non
#   troverebbe mai la distinta che l'operatore ha appena aperto — creandone una
#   nuova a ogni riga inserita, in silenzio.
#   ⇒ Nessuna colonna nuova: `user_insert` **e' gia'** «chi l'ha aperta».
#
# ── ⚠️ DROP + CREATE, NON UN REPLACE ──────────────────────────────────
#   La firma passa da **otto** parametri a **nove**: un `CREATE OR REPLACE` non
#   sostituirebbe, **affiancherebbe** — e con i `DEFAULT` su sette parametri le
#   chiamate diventerebbero **ambigue**, con l'errore che arriva al primo giro di
#   fatturazione invece che qui. E' la scorciatoia che l'assenza di produzione
#   consente (§6.2 punto 2): niente overload di compatibilita' che poi nessuno
#   toglie.
#   ⚠️ L'unico chiamante e' `vendite.fn_sync_contabili_fondo_fattura`, che NON
#   passa `p_origine` e prende il default `GENERATA` — che per lui e' vero. Non
#   va toccato: e' la ragione per cui il default e' quello.
#
# ── ⚠️ IL VOCABOLARIO SI RIFIUTA PARLANDO ─────────────────────────────
#   Il `CHECK` sulla colonna lo presidia gia', ma un `23514` non dice quale
#   colonna: un `p_origine` fuori vocabolario lo produce **solo un chiamante
#   rotto**, quindi il codice e' `E_PAGAMENTI_CHIAMATA_NON_VALIDA` (`TECNICO`).
#
# Origine: corpo dal changeSet `20260821-21`, l'ultima versione APPLICATA,
#   verificata identica all'oggetto vivo. ⚠️ NON da `pg_get_functiondef`, che
#   scioglie i `%TYPE`.
# Dipendenze: colonna `origine` (`20260821-32`).
# Presidio: db/pgtap/pagamenti/test-contabili-origine-e-quadratura.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260821-34-recreate-fn-get-or-create-vendite-contabile-per-operatore-mctit.yaml

  - changeSet:
      id: 20260821-34-recreate-fn-get-or-create-vendite-contabile-per-operatore
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DROP + CREATE (la firma passa da otto parametri a nove): fn_get_or_create_vendite_contabile
        guadagna p_origine, e su una distinta MANUALE la chiave di riuso comprende CHI STA
        LAVORANDO. ⭐ Con quel raggruppamento la contesa fra due operatori non esiste, quindi
        il lock che sarebbe servito a governarla non si costruisce. L'unico chiamante attuale
        — il sync dei fondi — prende il default GENERATA, che per lui è vero.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili
                columnName: origine
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'pagamenti'
                     AND p.proname = 'fn_get_or_create_vendite_contabile';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ DROP prima del CREATE, e NON un CREATE OR REPLACE: la firma passa da
              -- otto parametri a nove, quindi un REPLACE non sostituirebbe - AFFIANCHEREBBE.
              -- E con i DEFAULT su sette parametri su nove le chiamate diventerebbero
              -- AMBIGUE: PostgreSQL non saprebbe quale delle due intendi, e il messaggio
              -- arriverebbe al primo giro di fatturazione, non qui.
              -- ⭐ E' la scorciatoia che l'assenza di produzione consente (§6.2 punto 2):
              -- niente overload di compatibilita' che poi nessuno toglie.
              DROP FUNCTION IF EXISTS pagamenti.fn_get_or_create_vendite_contabile(
                  bigint, date, date, bigint, bigint, bigint, text, jsonb);

              CREATE OR REPLACE FUNCTION pagamenti.fn_get_or_create_vendite_contabile(
                  p_centro_riscossione_id pagamenti.centri_riscossione.id%TYPE,
                  p_data_contabile        pagamenti.vendite_contabili.data_contabile%TYPE,
                  p_data_registrazione    pagamenti.vendite_contabili.data_registrazione%TYPE DEFAULT CURRENT_DATE,
                  p_ente_incasso_id       pagamenti.enti_incasso.id%TYPE DEFAULT NULL,
                  p_compensazione_id      pagamenti.compensazioni.id%TYPE DEFAULT NULL,
                  p_lotto_id              pagamenti.vendite_contabili_lotti.lotto_id%TYPE DEFAULT NULL,
                  p_codice_stato_interno  pagamenti.vendite_contabili_stati.codice_interno%TYPE DEFAULT 'BOZZA',
                  p_meta                  pagamenti.vendite_contabili.meta%TYPE DEFAULT '{}'::jsonb,
                  p_origine               pagamenti.vendite_contabili.origine%TYPE DEFAULT 'GENERATA'
              )
               RETURNS pagamenti.vendite_contabili.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_contabile_id pagamenti.vendite_contabili.id%TYPE;
                v_stato_id pagamenti.vendite_contabili_stati.id%TYPE;
                v_data_registrazione pagamenti.vendite_contabili.data_registrazione%TYPE;
                v_codice pagamenti.vendite_contabili.codice%TYPE;
                v_existing_centro_id pagamenti.vendite_contabili.centro_riscossione_id%TYPE;
                v_existing_ente_id pagamenti.vendite_contabili.ente_incasso_id%TYPE;
                v_existing_data_contabile pagamenti.vendite_contabili.data_contabile%TYPE;
                v_existing_data_registrazione pagamenti.vendite_contabili.data_registrazione%TYPE;
                v_existing_stato_id pagamenti.vendite_contabili.stato_id%TYPE;
                v_operatore pagamenti.vendite_contabili.user_insert%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recuperare o creare una testata contabile vendite.
                --
                -- Regole principali:
                --   - p_compensazione_id e p_lotto_id sono mutualmente esclusivi
                --   - se p_compensazione_id e' valorizzato, la testata e' unica
                --     per compensazione (vincolo applicativo + unique DB)
                --   - ⭐ una distinta MANUALE e' il LOTTO DI LAVORO DI UN OPERATORE:
                --     il riuso comprende CHI STA LAVORANDO, non solo la giornata.
                --     Cosi' la contesa fra due operatori non esiste, e il lock che
                --     sarebbe servito a governarla non si costruisce (D12-a).
                --
                -- Rev 2026-08-21 (passo P-7): i nove E_GENERICO passano ai codici
                -- registrati. Nessun predicato e' cambiato.
                -- =========================================================

                -- ⭐ I DUE guard che un OPERATORE puo' far scattare davvero: il
                --    centro e la data li sceglie lui in un form. Codice di dominio,
                --    non un codice trasversale, perche' il messaggio lo legge una
                --    persona e non deve nominare un parametro PL/pgSQL.
                IF p_centro_riscossione_id IS NULL OR p_centro_riscossione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_CONTABILE_DATI_OBBLIGATORI',
                    jsonb_build_object(
                      'detail', 'p_centro_riscossione_id obbligatorio > 0',
                      'campo', 'centro_riscossione_id',
                      'p_centro_riscossione_id', p_centro_riscossione_id
                    ),
                    NULL::uuid,
                    'il centro di riscossione'
                  );
                END IF;

                IF p_data_contabile IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_CONTABILE_DATI_OBBLIGATORI',
                    jsonb_build_object(
                      'detail', 'p_data_contabile obbligatoria',
                      'campo', 'data_contabile'
                    ),
                    NULL::uuid,
                    'la data contabile'
                  );
                END IF;

                -- ⚠️ Da qui in giu' i guard non difendono un DATO dell'operatore:
                --    difendono un'INVARIANTE DELLA CHIAMATA. Su questi il NULL e'
                --    AMMESSO, e un id <= 0 o uno stato vuoto non escono da nessuna
                --    interfaccia — li produce solo un chiamante rotto. Per questo il
                --    codice e' E_PAGAMENTI_CHIAMATA_NON_VALIDA, classe TECNICO (500):
                --    l'operatore non ha niente da correggere, e il messaggio nomina il
                --    parametro perche' il suo lettore e' chi ha scritto la chiamata.
                --    ⛔ NON E_PARAMETRO_INVALIDO: quello e' uno split rimandato
                --    (D11 di brief-db-be-classe-codici-errore) che sopravvive per le
                --    funzioni vecchie, non una sede per il codice nuovo.

                IF p_ente_incasso_id IS NOT NULL AND p_ente_incasso_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'p_ente_incasso_id deve essere > 0 se valorizzato',
                      'p_ente_incasso_id', p_ente_incasso_id
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_or_create_vendite_contabile', 'p_ente_incasso_id (se valorizzato, maggiore di zero)'
                  );
                END IF;

                IF p_compensazione_id IS NOT NULL AND p_compensazione_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'p_compensazione_id deve essere > 0 se valorizzato',
                      'p_compensazione_id', p_compensazione_id
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_or_create_vendite_contabile', 'p_compensazione_id (se valorizzato, maggiore di zero)'
                  );
                END IF;

                IF p_lotto_id IS NOT NULL AND p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'p_lotto_id deve essere > 0 se valorizzato',
                      'p_lotto_id', p_lotto_id
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_or_create_vendite_contabile', 'p_lotto_id (se valorizzato, maggiore di zero)'
                  );
                END IF;

                -- Regola di dominio, non guard di parametro: una testata nasce da
                -- una compensazione OPPURE appartiene a un lotto di fatturazione.
                IF p_compensazione_id IS NOT NULL AND p_lotto_id IS NOT NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_CONTABILE_COMPENSAZIONE_LOTTO_ESCLUSIVI',
                    jsonb_build_object(
                      'detail', 'p_compensazione_id e p_lotto_id non possono coesistere',
                      'compensazione_id', p_compensazione_id,
                      'lotto_id', p_lotto_id
                    ),
                    NULL::uuid,
                    p_compensazione_id::text, p_lotto_id::text
                  );
                END IF;

                IF p_codice_stato_interno IS NULL OR btrim(p_codice_stato_interno) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'p_codice_stato_interno obbligatorio'
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_or_create_vendite_contabile', 'p_codice_stato_interno (obbligatorio, non vuoto)'
                  );
                END IF;

                -- Il vocabolario e' presidiato anche dal CHECK, ma un 23514 non dice
                -- quale colonna: un valore fuori vocabolario lo produce solo un
                -- chiamante rotto, quindi TECNICO.
                IF p_origine IS NULL OR p_origine NOT IN ('MANUALE', 'AUTOMATICA', 'GENERATA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'p_origine fuori vocabolario',
                      'p_origine', p_origine
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_or_create_vendite_contabile',
                    'p_origine (MANUALE, AUTOMATICA o GENERATA)'
                  );
                END IF;

                -- Chi sta lavorando: la STESSA espressione con cui
                -- script.trgfn_audit_data_user_generic valorizza user_insert, cosi' la
                -- chiave di riuso e la colonna scritta non possono divergere.
                v_operatore := COALESCE(
                    NULLIF(current_setting('app.jwt_user', true), ''),
                    CURRENT_USER
                );

                SELECT s.id
                  INTO v_stato_id
                  FROM pagamenti.vendite_contabili_stati s
                 WHERE s.codice_interno = p_codice_stato_interno
                   AND s.attivo IS TRUE
                 LIMIT 1;

                -- ⚠️ Non e' un parametro sbagliato: e' il catalogo degli stati a
                -- non avere quella riga, o ad averla spenta. Classe TECNICO.
                IF v_stato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_CONTABILE_STATO_NON_CONFIGURATO',
                    jsonb_build_object(
                      'detail', 'stato contabile non trovato/attivo',
                      'codice_interno', p_codice_stato_interno
                    ),
                    NULL::uuid,
                    p_codice_stato_interno
                  );
                END IF;

                v_data_registrazione := COALESCE(p_data_registrazione, current_date);

                -- Ricerca/riuso su compensazione (chiave primaria di processo).
                IF p_compensazione_id IS NOT NULL THEN
                  SELECT vc.id,
                         vc.centro_riscossione_id,
                         vc.ente_incasso_id,
                         vc.data_contabile,
                         vc.data_registrazione,
                         vc.stato_id
                    INTO v_contabile_id,
                         v_existing_centro_id,
                         v_existing_ente_id,
                         v_existing_data_contabile,
                         v_existing_data_registrazione,
                         v_existing_stato_id
                    FROM pagamenti.vendite_contabili vc
                   WHERE vc.compensazione_id = p_compensazione_id
                   ORDER BY vc.id DESC
                   LIMIT 1;

                  IF v_contabile_id IS NOT NULL THEN
                    IF v_existing_centro_id IS DISTINCT FROM p_centro_riscossione_id
                       OR v_existing_ente_id IS DISTINCT FROM p_ente_incasso_id
                       OR v_existing_data_contabile IS DISTINCT FROM p_data_contabile
                       OR v_existing_data_registrazione IS DISTINCT FROM v_data_registrazione
                       OR v_existing_stato_id IS DISTINCT FROM v_stato_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'database', 'pagamenti.fn_get_or_create_vendite_contabile', 'E_CONTABILE_COMPENSAZIONE_GIA_PRESENTE',
                        jsonb_build_object(
                          'detail','Parametri incoerenti con testata gia associata alla compensazione',
                          'compensazione_id', p_compensazione_id,
                          'contabile_id', v_contabile_id,
                          'centro_riscossione_id_atteso', v_existing_centro_id,
                          'centro_riscossione_id_richiesto', p_centro_riscossione_id,
                          'ente_incasso_id_atteso', v_existing_ente_id,
                          'ente_incasso_id_richiesto', p_ente_incasso_id,
                          'data_contabile_attesa', v_existing_data_contabile,
                          'data_contabile_richiesta', p_data_contabile,
                          'data_registrazione_attesa', v_existing_data_registrazione,
                          'data_registrazione_richiesta', v_data_registrazione,
                          'stato_id_atteso', v_existing_stato_id,
                          'stato_id_richiesto', v_stato_id
                        ),
                        NULL::uuid,
                        p_compensazione_id::text, v_contabile_id::text
                      );
                    END IF;
                  END IF;

                ELSIF p_lotto_id IS NULL THEN
                  -- ⭐ D12-a: su una distinta MANUALE la chiave di riuso comprende
                  --    l'OPERATORE. Il raggruppamento «giornata + canale» non ha un
                  --    referente nel mondo — nessun documento reale corrisponde a «tutti
                  --    gli incassi banca di lunedi' digitati a mano» — mentre il lotto di
                  --    lavoro di una persona ce l'ha. E con questo la contesa fra due
                  --    operatori non esiste: niente colonne di blocco, niente scadenze del
                  --    lock, niente sblocco d'emergenza.
                  -- ⚠️ Sulle altre due origini la chiave resta quella di prima: una
                  --    distinta GENERATA non e' il lotto di lavoro di nessuno, e una
                  --    AUTOMATICA e' il file.
                  SELECT vc.id
                    INTO v_contabile_id
                    FROM pagamenti.vendite_contabili vc
                   WHERE vc.centro_riscossione_id = p_centro_riscossione_id
                     AND vc.ente_incasso_id IS NOT DISTINCT FROM p_ente_incasso_id
                     AND vc.data_contabile = p_data_contabile
                     AND vc.data_registrazione = v_data_registrazione
                     AND vc.stato_id = v_stato_id
                     AND vc.compensazione_id IS NULL
                     AND vc.origine = p_origine
                     AND (p_origine <> 'MANUALE' OR vc.user_insert = v_operatore)
                   ORDER BY vc.id DESC
                   LIMIT 1;
                ELSE
                  SELECT vc.id
                    INTO v_contabile_id
                    FROM pagamenti.vendite_contabili vc
                    JOIN pagamenti.vendite_contabili_lotti vcl
                      ON vcl.contabile_id = vc.id
                   WHERE vcl.lotto_id = p_lotto_id
                     AND vc.centro_riscossione_id = p_centro_riscossione_id
                     AND vc.ente_incasso_id IS NOT DISTINCT FROM p_ente_incasso_id
                     AND vc.data_contabile = p_data_contabile
                     AND vc.data_registrazione = v_data_registrazione
                     AND vc.stato_id = v_stato_id
                     AND vc.compensazione_id IS NULL
                     AND vc.origine = p_origine
                     AND (p_origine <> 'MANUALE' OR vc.user_insert = v_operatore)
                   ORDER BY vc.id DESC
                   LIMIT 1;
                END IF;

                IF v_contabile_id IS NULL THEN
                  v_codice := concat(
                    'VC_',
                    to_char(clock_timestamp(), 'YYYYMMDDHH24MISSMS'),
                    '_',
                    substr(md5(random()::text || clock_timestamp()::text), 1, 8)
                  );

                  INSERT INTO pagamenti.vendite_contabili (
                    codice,
                    centro_riscossione_id,
                    ente_incasso_id,
                    compensazione_id,
                    data_contabile,
                    data_registrazione,
                    stato_id,
                    origine,
                    meta
                  ) VALUES (
                    v_codice,
                    p_centro_riscossione_id,
                    p_ente_incasso_id,
                    p_compensazione_id,
                    p_data_contabile,
                    v_data_registrazione,
                    v_stato_id,
                    p_origine,
                    COALESCE(p_meta, '{}'::jsonb)
                  )
                  RETURNING id INTO v_contabile_id;
                END IF;

                IF p_lotto_id IS NOT NULL THEN
                  INSERT INTO pagamenti.vendite_contabili_lotti (
                    lotto_id,
                    contabile_id,
                    meta
                  ) VALUES (
                    p_lotto_id,
                    v_contabile_id,
                    jsonb_build_object('source','fn_get_or_create_vendite_contabile')
                  )
                  ON CONFLICT (lotto_id, contabile_id) DO NOTHING;
                END IF;

                RETURN v_contabile_id;
              END;
              $function$;

              COMMENT ON FUNCTION pagamenti.fn_get_or_create_vendite_contabile(
                  pagamenti.centri_riscossione.id%TYPE,
                  pagamenti.vendite_contabili.data_contabile%TYPE,
                  pagamenti.vendite_contabili.data_registrazione%TYPE,
                  pagamenti.enti_incasso.id%TYPE,
                  pagamenti.compensazioni.id%TYPE,
                  pagamenti.vendite_contabili_lotti.lotto_id%TYPE,
                  pagamenti.vendite_contabili_stati.codice_interno%TYPE,
                  pagamenti.vendite_contabili.meta%TYPE,
                  pagamenti.vendite_contabili.origine%TYPE)
              IS 'Recupera o crea la testata contabile vendite (la DISTINTA: raccoglie N importi dello stesso canale, non un singolo movimento bancario). Rev 2026-08-21: i nove E_GENERICO passano ai codici registrati (E_CONTABILE_DATI_OBBLIGATORI, E_PAGAMENTI_CHIAMATA_NON_VALIDA, E_CONTABILE_STATO_NON_CONFIGURATO, E_CONTABILE_COMPENSAZIONE_LOTTO_ESCLUSIVI, E_CONTABILE_COMPENSAZIONE_GIA_PRESENTE) e i tipi sono ancorati con %TYPE in firma e RETURNS; nessun predicato e'' cambiato. ⭐ I codici sono scelti per CHI LEGGE il messaggio: i due dati che l''operatore fornisce (centro di riscossione, data contabile) hanno un codice di dominio, i quattro guard che solo un chiamante rotto puo'' far scattare hanno E_PAGAMENTI_CHIAMATA_NON_VALIDA. ⭐ Rev 2026-08-21 (S1-19): guadagna p_origine, e su una distinta MANUALE il RIUSO COMPRENDE L''OPERATORE - una distinta manuale e'' il lotto di lavoro di una persona (D12-a), e con quel raggruppamento la contesa fra due operatori non esiste, quindi il lock che sarebbe servito a governarla non si costruisce.';

      rollback:
