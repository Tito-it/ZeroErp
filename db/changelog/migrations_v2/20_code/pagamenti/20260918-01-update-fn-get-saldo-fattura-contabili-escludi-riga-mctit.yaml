# P-6 (1 di 2) — pagamenti.fn_get_saldo_fattura_contabili impara a escludere
#   UNA riga: `p_escludi_contabile_riga_id`, la stessa forma della sorella
#   fn_get_saldo_rata (e del nucleo fn_get_saldi_rate).
#   Brief: brief-db-distinta-ricerca-rate §4.6 (P-6, 17-09, dal pezzo B).
#
# -- PERCHE' ------------------------------------------------------------------------
#   Chi CORREGGE una riga contabile senza rata (la riga del fondo fattura, o la
#   riga manuale «fattura si', rata no» di D16) legge, nel pannello dei saldi
#   a livello DOCUMENTO, un «in lavorazione» che conta la riga stessa: sta
#   cambiando 500 in 600 e vede 500 gia' dichiarati. Sulla RATA la domanda
#   «quanto spazio c'era PRIMA di me» ha una risposta dal lotto 5
#   (fn_get_saldo_rata, p_escludi_contabile_riga_id); sul documento no, e il
#   frontend lo DICHIARA («esclusione non applicata») invece di sanarlo.
#   Il DB era l'unico lato che mancava: BE (saldi_service) e FE (useSaldi,
#   ESCLUSIONE_SUPPORTATA) sono gia' scritti per riceverla.
#
# -- CHE COSA CAMBIA -----------------------------------------------------------------
#   Un parametro in piu' SULLA STESSA funzione, con DEFAULT NULL: NON un secondo
#   overload accanto alla vecchia firma (bigint) — con una (bigint) e una
#   (bigint, bigint DEFAULT NULL) ogni chiamata a un argomento sarebbe AMBIGUA
#   (42725) in fn_get_saldo_fattura e in vendite.fn_saldo_sorgente_fondo, che
#   la chiamano cosi'. Quindi DROP della vecchia firma + CREATE della nuova.
#   Nessuna dipendenza dura (pg_depend a zero: le due chiamanti sono plpgsql e
#   la nominano per nome), quindi il DROP non trascina niente.
#   Stesso guard della sorella: p_escludi fornito e <= 0 → E_PAGAMENTI_CHIAMATA_NON_VALIDA
#   (TECNICO: lo produce solo un chiamante rotto). La riga esclusa esce dal
#   conto delle righe postabili — l'unico numero di questa funzione.
#   RETURNS TABLE (saldo_contabile, has_righe_postabili) invariato.
#
# -- CHI LA CHIAMA, verificato su pg_proc il 18-09 --------------------------------
#   pagamenti.fn_get_saldo_fattura (un argomento: passa alla nuova firma con
#   il DEFAULT; il passo 2 di 2 le da' anche l'esclusione), vendite.fn_saldo_sorgente_fondo
#   (un argomento, invariata). Backend: nessuno la chiama direttamente (legge
#   fn_get_saldo_fattura). pgTAP: test-fn-get-saldo-fattura-tre-numeri (rev
#   sui BB + i casi dell'esclusione), test-vendite-contabili-stato-obbligatorio,
#   test-righe-contabili-eliminazione-v1 — a un argomento, invariati.
#
# ⚠️ I GRANT si perdono col DROP: EXECUTE a zeroerp_app si rimette qui. Al
#    ruolo batch NO (linee-guida-sql §11.6: provisioning).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260918-01-update-fn-get-saldo-fattura-contabili-escludi-riga-mctit.yaml

  - changeSet:
      id: 20260918-01-update-fn-get-saldo-fattura-contabili-escludi-riga
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        pagamenti.fn_get_saldo_fattura_contabili: + p_escludi_contabile_riga_id DEFAULT NULL
        (la forma della sorella fn_get_saldo_rata), la riga esclusa esce dal conto del
        dichiarato; stesso guard TECNICO su un id <= 0. DROP + CREATE perche' cambia la
        firma e un overload accanto alla vecchia sarebbe ambiguo. RETURNS invariato.
        Brief: brief-db-distinta-ricerca-rate §4.6 (P-6, 1 di 2).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'pagamenti' AND p.proname = 'fn_get_saldo_fattura_contabili'
                    AND pg_get_function_identity_arguments(p.oid) = 'p_fattura_id bigint'
            - sqlCheck:
                expectedResult: 0
                sql: >-
                  SELECT count(*) FROM pg_depend d
                  WHERE d.refobjid = 'pagamenti.fn_get_saldo_fattura_contabili(bigint)'::regprocedure
                    AND d.deptype = 'n'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Non CREATE OR REPLACE: cambia la firma, e la vecchia (bigint)
              --    resterebbe come secondo overload, ambiguo per ogni chiamata a
              --    un argomento. Nessuna vista dipende da questa funzione.
              DROP FUNCTION IF EXISTS pagamenti.fn_get_saldo_fattura_contabili(bigint);

              CREATE FUNCTION pagamenti.fn_get_saldo_fattura_contabili(
                  p_fattura_id                vendite.fatture.id%TYPE,
                  p_escludi_contabile_riga_id pagamenti.vendite_contabili_righe.id%TYPE DEFAULT NULL)
              RETURNS TABLE(saldo_contabile vendite.fatture.totale_a_pagare%TYPE,
                            has_righe_postabili boolean)
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce il saldo contabile "in lavorazione" di una
                --   fattura, sommando solo le righe contabili che stanno in
                --   uno stato postabile e appartengono a una testata non
                --   ancora finale.
                --
                -- Regole:
                --   - riga attiva e in stato is_postabile;
                --   - testata non finale. ⚠️ Dal 2026-08-21 lo stato della
                --     testata e' obbligatorio (20260821-12), quindi il JOIN e'
                --     interno: il ramo "testata senza stato" non esiste piu'.
                --   - ⚠️ questo filtro NON e' il presidio contro la riga
                --     appesa a una testata gia' chiusa (difetto C-5 del piano):
                --     quella la fermano i guard della slice 1. Qui si esclude
                --     un documento chiuso, non si ripara un'anomalia.
                --   - ⭐ p_escludi_contabile_riga_id (2026-09-18, P-6): chi sta
                --     scrivendo una riga chiede quanto era dichiarato PRIMA di
                --     se', o si confronterebbe con se' stesso. Stessa forma e
                --     stesso mestiere della sorella fn_get_saldo_rata.
                -- =========================================================

                IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_saldo_fattura_contabili', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'fattura_id obbligatoria e maggiore di zero',
                      'p_fattura_id', p_fattura_id
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_saldo_fattura_contabili', 'p_fattura_id (obbligatorio, maggiore di zero)'
                  );
                END IF;

                -- Un id di esclusione fornito e non positivo non esce da nessuna
                -- interfaccia: lo produce solo un chiamante rotto (TECNICO).
                IF p_escludi_contabile_riga_id IS NOT NULL AND p_escludi_contabile_riga_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_saldo_fattura_contabili', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'p_escludi_contabile_riga_id, se fornito, deve essere maggiore di zero',
                      'p_fattura_id', p_fattura_id,
                      'p_escludi_contabile_riga_id', p_escludi_contabile_riga_id
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_saldo_fattura_contabili', 'p_escludi_contabile_riga_id, se fornito, deve essere maggiore di zero'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  COALESCE(SUM(cr.importo), 0)::numeric AS saldo_contabile,
                  (COUNT(*) > 0) AS has_righe_postabili
                FROM pagamenti.vendite_contabili_righe cr
                JOIN pagamenti.vendite_contabili_righe_stati s
                  ON s.id = cr.stato_id
                JOIN pagamenti.vendite_contabili c
                  ON c.id = cr.contabile_id
                JOIN pagamenti.vendite_contabili_stati cs
                  ON cs.id = c.stato_id
                WHERE cr.fattura_id = p_fattura_id
                  AND cr.attivo IS TRUE
                  AND s.is_postabile IS TRUE
                  AND cs.is_final IS FALSE
                  -- La riga che sta scrivendo non conta se' stessa (stessa
                  -- condizione del nucleo fn_get_saldi_rate, CTE `lav`).
                  AND (p_escludi_contabile_riga_id IS NULL
                       OR cr.id <> p_escludi_contabile_riga_id);
              END;
              $function$;

              COMMENT ON FUNCTION pagamenti.fn_get_saldo_fattura_contabili(vendite.fatture.id%TYPE, pagamenti.vendite_contabili_righe.id%TYPE)
              IS 'Restituisce il saldo contabile fattura dalle righe in stato postabile sotto una testata non finale. ⭐ Rev 2026-09-18 (P-6, brief-db-distinta-ricerca-rate §4.6): + p_escludi_contabile_riga_id DEFAULT NULL — la riga che sta scrivendo chiede quanto era dichiarato PRIMA di se'', la stessa forma della sorella fn_get_saldo_rata e del nucleo fn_get_saldi_rate; senza, chi corregge una riga SENZA rata (fondo fattura, riga manuale «fattura si'', rata no») leggeva un in-lavorazione che contava la riga stessa. DROP + CREATE perche'' cambia la firma: un secondo overload accanto alla vecchia (bigint) sarebbe ambiguo per ogni chiamata a un argomento. Rev 2026-08-21: tolto il ramo "testata senza stato" (LEFT JOIN + COALESCE su is_final), reso impossibile dal NOT NULL su vendite_contabili.stato_id; guard di chiamata su E_PAGAMENTI_CHIAMATA_NON_VALIDA (TECNICO): un p_fattura_id <= 0 — e un p_escludi <= 0 — non esce da nessuna interfaccia, e l''operatore non ha niente da correggere; tipi ancorati con %TYPE in firma e RETURNS TABLE.';

              -- ⚠️ I GRANT si perdono col DROP. EXECUTE all'app si rimette; al
              --    ruolo batch NO: lo copre il provisioning (linee-guida-sql §11.6).
              GRANT EXECUTE ON FUNCTION pagamenti.fn_get_saldo_fattura_contabili(vendite.fatture.id%TYPE, pagamenti.vendite_contabili_righe.id%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS pagamenti.fn_get_saldo_fattura_contabili(bigint, bigint);

              CREATE FUNCTION pagamenti.fn_get_saldo_fattura_contabili(p_fattura_id bigint)
              RETURNS TABLE(saldo_contabile numeric, has_righe_postabili boolean)
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'pagamenti.fn_get_saldo_fattura_contabili', 'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                    jsonb_build_object(
                      'detail', 'fattura_id obbligatoria e maggiore di zero',
                      'p_fattura_id', p_fattura_id
                    ),
                    NULL::uuid,
                    'pagamenti.fn_get_saldo_fattura_contabili', 'p_fattura_id (obbligatorio, maggiore di zero)'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  COALESCE(SUM(cr.importo), 0)::numeric AS saldo_contabile,
                  (COUNT(*) > 0) AS has_righe_postabili
                FROM pagamenti.vendite_contabili_righe cr
                JOIN pagamenti.vendite_contabili_righe_stati s
                  ON s.id = cr.stato_id
                JOIN pagamenti.vendite_contabili c
                  ON c.id = cr.contabile_id
                JOIN pagamenti.vendite_contabili_stati cs
                  ON cs.id = c.stato_id
                WHERE cr.fattura_id = p_fattura_id
                  AND cr.attivo IS TRUE
                  AND s.is_postabile IS TRUE
                  AND cs.is_final IS FALSE;
              END;
              $function$;

              GRANT EXECUTE ON FUNCTION pagamenti.fn_get_saldo_fattura_contabili(bigint) TO zeroerp_app;
