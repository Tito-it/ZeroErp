# ⭐ LA MADRE DEL POSTING — passo S1-10 (lotto 4)
#   pagamenti.fn_posta_contabile
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.1 S1-10 · decisioni D3, D12, D13, Q-6, Q-7 del brief madre
#
# ── CHE COSA FA, IN UNA RIGA ───────────────────────────────────────────
#   Trasforma in **movimenti contabili** le righe di una distinta che sono
#   pronte a diventarlo, e chiude la distinta. ⭐ **È il changeSet in cui nasce
#   il primo movimento del progetto**: da qui `pagamenti.fn_get_saldo_fattura`
#   smette di rispondere «residuo = totale» per costruzione e comincia a dire
#   la verità.
#
# ── ⚠️ UNA SOLA `SELECT`, E DUE STATEMENT DENTRO ──────────────────────
#   È una **funzione madre** (linee-guida-sql §5b): il chiamante fa una sola
#   `SELECT`, e l'atomicità è per costruzione. Dentro però i due passi restano
#   **statement separati** — prima l'`INSERT` dei movimenti, poi l'`UPDATE`
#   delle righe:
#
#   🔴 con la RLS attiva **padre e figlio nella stessa snapshot non si vedono**
#   e il `WITH CHECK` nega fail-closed. Una CTE unica sarebbe elegante e
#   sbagliata — è la trappola già registrata nel progetto.
#
#   ⚠️ E i due statement sono legati da un **array di id**, non dal ripetere il
#   predicato: fra l'uno e l'altro un'altra sessione può aggiungere una riga
#   alla stessa distinta, e ripetere il predicato la porterebbe a `POSTATA`
#   **senza il suo movimento**. Si aggiornano esattamente le righe di cui si è
#   appena scritto il movimento, e nessun'altra.
#
# ── ⭐ LA FIRMA PORTA LA DICHIARAZIONE (D13), E SI DECIDE ADESSO ───────
#   `p_righe_attese` / `p_totale_atteso` sono **ciò che chi conferma ha visto**.
#   Aggiungerli dopo creerebbe un **overload**, e coi valori di default le
#   chiamate diventerebbero ambigue — trappola registrata.
#
#   Sono **facoltativi ma legati**: o tutti e due o nessuno. Valorizzati, la
#   funzione rifiuta se nel frattempo la distinta è cambiata, **prima** di
#   scrivere qualsiasi cosa — la registrazione non si torna indietro, e un
#   avviso dopo non ripara niente. Assenti, si registra ciò che c'è: è la
#   strada dei processi automatici, che non hanno un operatore che guarda.
#   ⚠️ La simmetria è con `importo_dichiarato` sulla testata, facoltativo sulla
#   manuale e obbligatorio sull'automatica.
#
# ── ⭐ DUE CONTROLLI CHE SEMBRANO UNO SOLO, E NON LO SONO ─────────────
#   * **quadratura della distinta** (D12-e, codice 959): tutte le righe attive
#     contro `importo_dichiarato`, cioè *«ho letto tutto quello che è
#     arrivato?»*. ℹ️ Lo fa già il guard di validazione al passaggio a
#     `VALIDATA`; qui si ripete perché fra la validazione e la registrazione le
#     righe possono essere cambiate;
#   * **dichiarazione del posting** (D13, codice 963): le righe **pronte
#     adesso** contro quelle che l'operatore ha contato, cioè *«sto registrando
#     quello che mi hanno approvato?»*.
#
# ── ⭐ «NIENTE DA POSTARE» NON È UN ERRORE (Q-7, opzione B) ────────────
#   La funzione **non solleva**: risponde e dichiara l'esito
#   (`POSTATA` / `NULLA_DA_POSTARE`). Un errore dovrebbe voler dire che
#   qualcosa non funziona, e «non c'era niente da fare» è una risposta vera.
#   ⚠️ E c'era un costo concreto nell'altra strada: il database **scrive nel
#   registro degli errori prima di sollevare**, quindi ogni pulsante premuto
#   due volte avrebbe lasciato un errore che errore non è.
#   ✅ Non si perde D3-c: il messaggio *«l'hai già fatto»* lo mette il frontend
#   leggendo l'esito. *Il database dice il fatto, chi parla con la persona
#   decide come raccontarlo.*
#
# ── ⭐ LA CHIUSURA È UNA CONSEGUENZA, NON UNA SCELTA (Tid, 2026-08-22) ─
#   Registrato, la distinta va a `CHIUSA`. Il brief lasciava la domanda aperta
#   («sempre, o solo se non restano righe lavorabili?») e la risposta è
#   **sempre**: dopo il posting righe pronte non ne restano, e il guard di
#   chiusura dichiara che le altre non devono bloccare — *«DA_ABBINARE e
#   SOSPESA non bloccano, o la distinta non si chiuderebbe mai»*.
#   ⚠️ **Ha un prezzo, ed è pagato nello stesso lotto**: una riga rimasta
#   `DA_ABBINARE` sotto una distinta chiusa non deve poter diventare pronta.
#   Lo impedisce la quarta mossa del guard, changeSet `20260822-01`. Senza
#   quella, questa scelta aprirebbe la terza porta di C-5.
#
# ── ⭐ `data_conferma` / `user_conferma`: si scrivono REGISTRANDO ──────
#   Sono due colonne che esistono da sempre e che **non scriveva nessuno**
#   (D9-c le indicava come la sede naturale del gesto). Le scrive qui, con un
#   `COALESCE` che **tiene la prima**: la conferma è l'atto di registrare, e la
#   prima volta che è successo non si riscrive.
#
# ── Ciò che la funzione NON fa, e va detto perché è una scelta ─────────
#   * non crea, non modifica e non annulla **fondi fattura**: *i fatti si
#     aggiungono, i saldi si leggono, le decisioni le prende una persona*.
#     ⭐ Ma il fondo se ne accorge lo stesso: portando la riga a `POSTATA` fa
#     scattare il trigger del lotto 3, che porta l'atto a `ESEGUITO`;
#   * non tocca le **rate**: non esistono ancora nel modello dell'abbinamento
#     (slice 2);
#   * non scrive in `error_log` di suo: lo fa `fn_log_and_raise_error` quando
#     solleva.
#
# Dipendenze: codici 961/962/963 (append ai due CSV di `80_data`), più i già a
#   catalogo 939, 953, 956, 959. ⚠️ `80_data` gira DOPO `20_code`: fra questo
#   changeSet e il seed la funzione nominerebbe codici non ancora a catalogo.
#   Innocuo — nessuno la chiama durante il migrate — ma va saputo.
# Verifica: db/pgtap/pagamenti/test-fn-posta-contabile.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/pagamenti/20260822-02-create-fn-posta-contabile-mctit.yaml

  - changeSet:
      id: 20260822-02-create-fn-posta-contabile
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        La madre del posting: pagamenti.fn_posta_contabile trasforma in movimenti contabili
        le righe pronte di una distinta e la chiude. È il punto in cui nasce il primo
        movimento del progetto, quindi quello da cui fn_get_saldo_fattura smette di
        rispondere «residuo = totale» per costruzione. Una sola SELECT per il chiamante
        (atomica per costruzione), ma due statement dentro — INSERT dei movimenti, poi
        UPDATE delle righe — perché con la RLS padre e figlio nella stessa snapshot non si
        vedono; e i due sono legati da un array di id, non dal ripetere il predicato. Porta
        in firma la dichiarazione di chi conferma (D13) e non solleva quando non c'è niente
        da registrare (Q-7, opzione B): lo dichiara nell'esito.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: pagamenti
                tableName: vendite_movimenti
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili
                columnName: importo_dichiarato
            # La quarta mossa del guard (20260822-01) dev'esserci: chiudere la
            # distinta senza di essa apre la terza porta di C-5.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'pagamenti'
                     AND p.proname = 'trgfn_vendite_contabili_righe_guard_distinta_finale'
                     AND pg_get_functiondef(p.oid) LIKE '%QUARTA MOSSA%'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION pagamenti.fn_posta_contabile(
                  p_contabile_id  pagamenti.vendite_contabili.id%TYPE,
                  p_righe_attese  integer DEFAULT NULL,
                  p_totale_atteso pagamenti.vendite_contabili_righe.importo%TYPE DEFAULT NULL
              )
               RETURNS TABLE(
                  movimenti_creati integer,
                  righe_postate    integer,
                  righe_saltate    integer,
                  totale_postato   pagamenti.vendite_contabili_righe.importo%TYPE,
                  esito            text
               )
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_stato_id           pagamenti.vendite_contabili_stati.id%TYPE;
                  v_stato              pagamenti.vendite_contabili_stati.codice_interno%TYPE;
                  v_stato_label        pagamenti.vendite_contabili_stati.descrizione%TYPE;
                  v_codice             pagamenti.vendite_contabili.codice%TYPE;
                  v_centro_id          pagamenti.centri_riscossione.id%TYPE;
                  v_data_contabile     pagamenti.vendite_contabili.data_contabile%TYPE;
                  v_data_registrazione pagamenti.vendite_contabili.data_registrazione%TYPE;
                  v_importo_dichiarato pagamenti.vendite_contabili.importo_dichiarato%TYPE;
                  v_stato_postata_id   pagamenti.vendite_contabili_righe_stati.id%TYPE;
                  v_stato_chiusa_id    pagamenti.vendite_contabili_stati.id%TYPE;
                  v_somma_righe        pagamenti.vendite_contabili_righe.importo%TYPE;
                  v_righe_pronte       integer;
                  v_totale_pronte      pagamenti.vendite_contabili_righe.importo%TYPE;
                  v_senza_abbinamento  integer;
                  -- ⚠️ `colonna%TYPE[]` non esiste in PostgreSQL: qui il tipo
                  --    resta esplicito. Porta id di vendite_contabili_righe.
                  v_righe_ids          bigint[];
                  v_movimenti          integer := 0;
                  v_postate            integer := 0;
                  v_saltate            integer := 0;
                  v_totale_postato     pagamenti.vendite_contabili_righe.importo%TYPE := 0;
              BEGIN
                  -- =========================================================
                  -- 1) GUARD DI PARAMETRO
                  --    Un id nullo o non positivo non esce da nessuna
                  --    interfaccia: lo produce solo un chiamante rotto, e per
                  --    questo il codice è TECNICO e non DATO_ERRATO.
                  -- =========================================================
                  IF p_contabile_id IS NULL OR p_contabile_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_contabile_id', 'valore', p_contabile_id),
                          NULL::uuid,
                          'pagamenti.fn_posta_contabile',
                          'p_contabile_id obbligatorio e maggiore di zero');
                  END IF;

                  -- La dichiarazione è facoltativa, ma è UNA cosa sola: mezza
                  -- dichiarazione non si può verificare, e accettarla in
                  -- silenzio significherebbe registrare senza controllo
                  -- credendo di averlo fatto.
                  IF (p_righe_attese IS NULL) <> (p_totale_atteso IS NULL) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                          jsonb_build_object(
                              'p_righe_attese',  p_righe_attese,
                              'p_totale_atteso', p_totale_atteso),
                          NULL::uuid,
                          'pagamenti.fn_posta_contabile',
                          'p_righe_attese e p_totale_atteso si passano insieme, o non si passano');
                  END IF;

                  IF p_righe_attese IS NOT NULL AND p_righe_attese < 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_PAGAMENTI_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_righe_attese', 'valore', p_righe_attese),
                          NULL::uuid,
                          'pagamenti.fn_posta_contabile',
                          'p_righe_attese non puo'' essere negativo');
                  END IF;

                  -- =========================================================
                  -- 2) LOCK DELLA TESTATA
                  --    Serve a non registrare due volte in parallelo. ⚠️ FOR
                  --    UPDATE OF c: si blocca la sola testata, non la lookup
                  --    degli stati che le sta accanto nella JOIN.
                  -- =========================================================
                  SELECT c.stato_id, s.codice_interno, s.descrizione, c.codice,
                         c.centro_riscossione_id, c.data_contabile, c.data_registrazione,
                         c.importo_dichiarato
                    INTO v_stato_id, v_stato, v_stato_label, v_codice,
                         v_centro_id, v_data_contabile, v_data_registrazione,
                         v_importo_dichiarato
                    FROM pagamenti.vendite_contabili c
                    JOIN pagamenti.vendite_contabili_stati s ON s.id = c.stato_id
                   WHERE c.id = p_contabile_id
                     FOR UPDATE OF c;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_CONTABILE_NON_TROVATA',
                          jsonb_build_object('contabile_id', p_contabile_id),
                          NULL::uuid,
                          p_contabile_id::text);
                  END IF;

                  -- =========================================================
                  -- 3) GUARD DI STATO
                  --    Si registra SOLO da VALIDATA: è il gesto «ho finito di
                  --    inserire» (D14-a-bis). Da BOZZA la distinta potrebbe
                  --    cambiare mentre la si registra; da CHIUSA o ANNULLATA
                  --    il lavoro è finito.
                  -- =========================================================
                  IF v_stato IS DISTINCT FROM 'VALIDATA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_CONTABILE_NON_REGISTRABILE',
                          jsonb_build_object(
                              'contabile_id', p_contabile_id,
                              'codice',       v_codice,
                              'stato',        v_stato),
                          NULL::uuid,
                          v_codice,
                          lower(v_stato_label));
                  END IF;

                  -- =========================================================
                  -- 4) QUADRATURA DELLA DISTINTA (D12-e)
                  --    «Ho letto tutto quello che è arrivato?» — tutte le
                  --    righe attive, SCARTATA compresa: quel denaro è
                  --    arrivato comunque.
                  --    ℹ️ Lo stesso controllo lo fa il guard di validazione
                  --    entrando in VALIDATA; qui si ripete perché fra i due
                  --    momenti le righe possono essere cambiate.
                  -- =========================================================
                  SELECT COALESCE(SUM(cr.importo), 0)
                    INTO v_somma_righe
                    FROM pagamenti.vendite_contabili_righe cr
                   WHERE cr.contabile_id = p_contabile_id
                     AND cr.attivo IS TRUE;

                  IF v_importo_dichiarato IS NOT NULL
                     AND v_importo_dichiarato IS DISTINCT FROM v_somma_righe THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_CONTABILE_TOTALE_DICHIARATO_NON_QUADRA',
                          jsonb_build_object(
                              'campo',              'importo_dichiarato',
                              'contabile_id',       p_contabile_id,
                              'codice',             v_codice,
                              'importo_dichiarato', v_importo_dichiarato,
                              'somma_righe',        v_somma_righe),
                          NULL::uuid,
                          v_codice,
                          v_importo_dichiarato::text,
                          v_somma_righe::text);
                  END IF;

                  -- =========================================================
                  -- 5) LE RIGHE PRONTE, e la DICHIARAZIONE di chi conferma
                  --    Pronte = stato `is_postabile`. Le SOSPESE restano dove
                  --    sono: è D3-a, e non richiede nessun meccanismo nuovo.
                  -- =========================================================
                  SELECT COUNT(*)::integer, COALESCE(SUM(cr.importo), 0)
                    INTO v_righe_pronte, v_totale_pronte
                    FROM pagamenti.vendite_contabili_righe cr
                    JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                   WHERE cr.contabile_id = p_contabile_id
                     AND cr.attivo IS TRUE
                     AND st.is_postabile IS TRUE;

                  -- ⚠️ Si rifiuta PRIMA di scrivere qualsiasi cosa: la
                  --    registrazione non si torna indietro, e un avviso dopo
                  --    non ripara niente.
                  IF p_righe_attese IS NOT NULL
                     AND (p_righe_attese <> v_righe_pronte
                          OR p_totale_atteso IS DISTINCT FROM v_totale_pronte) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_CONTABILE_DICHIARAZIONE_NON_CORRISPONDE',
                          jsonb_build_object(
                              'contabile_id',   p_contabile_id,
                              'codice',         v_codice,
                              'righe_attese',   p_righe_attese,
                              'totale_atteso',  p_totale_atteso,
                              'righe_pronte',   v_righe_pronte,
                              'totale_pronte',  v_totale_pronte),
                          NULL::uuid,
                          v_codice,
                          p_righe_attese::text,
                          p_totale_atteso::text,
                          v_righe_pronte::text,
                          v_totale_pronte::text);
                  END IF;

                  -- =========================================================
                  -- 5-bis) IL RIFIUTO PARLANTE
                  --    Da una riga non abbinata non si deriva un movimento. Lo
                  --    direbbe comunque il trigger di mirror, ma più tardi e
                  --    con un messaggio che parla del movimento invece che
                  --    della riga.
                  --    ℹ️ Il contesto NON porta la chiave `campo`, e non è una
                  --    dimenticanza: non c'è UN campo da accendere, ci sono N
                  --    righe — i loro id stanno nel contesto.
                  -- =========================================================
                  SELECT COUNT(*)::integer
                    INTO v_senza_abbinamento
                    FROM pagamenti.vendite_contabili_righe cr
                    JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                   WHERE cr.contabile_id = p_contabile_id
                     AND cr.attivo IS TRUE
                     AND st.is_postabile IS TRUE
                     AND (cr.fattura_id IS NULL OR cr.billing_account_id IS NULL);

                  IF v_senza_abbinamento > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_RIGA_CONTABILE_ABBINAMENTO_INCOMPLETO',
                          jsonb_build_object(
                              'contabile_id',  p_contabile_id,
                              'codice',        v_codice,
                              'quante',        v_senza_abbinamento,
                              'contabile_righe_ids', (
                                  SELECT jsonb_agg(cr.id ORDER BY cr.id)
                                    FROM pagamenti.vendite_contabili_righe cr
                                    JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                                   WHERE cr.contabile_id = p_contabile_id
                                     AND cr.attivo IS TRUE
                                     AND st.is_postabile IS TRUE
                                     AND (cr.fattura_id IS NULL OR cr.billing_account_id IS NULL))),
                          NULL::uuid,
                          'POSTATA',
                          'la fattura e il cliente');
                  END IF;

                  -- =========================================================
                  -- 6) NIENTE DA REGISTRARE — e non è un errore (Q-7)
                  -- =========================================================
                  IF v_righe_pronte = 0 THEN
                      SELECT COUNT(*)::integer
                        INTO v_saltate
                        FROM pagamenti.vendite_contabili_righe cr
                        JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                       WHERE cr.contabile_id = p_contabile_id
                         AND cr.attivo IS TRUE
                         AND st.is_final IS NOT TRUE;

                      RETURN QUERY SELECT 0, 0, v_saltate, 0::numeric, 'NULLA_DA_POSTARE'::text;
                      RETURN;
                  END IF;

                  -- =========================================================
                  -- 7) GLI STATI DI DESTINAZIONE, letti per codice_interno
                  --    (la chiave immutabile, mai `codice`).
                  --    ⚠️ Nessun ripiego: uno stato mancante è una
                  --    configurazione rotta, e si dice.
                  -- =========================================================
                  SELECT s.id INTO v_stato_postata_id
                    FROM pagamenti.vendite_contabili_righe_stati s
                   WHERE s.codice_interno = 'POSTATA' AND s.attivo IS TRUE
                   LIMIT 1;

                  IF v_stato_postata_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_CONTABILE_STATO_NON_CONFIGURATO',
                          jsonb_build_object('codice_interno', 'POSTATA', 'catalogo', 'vendite_contabili_righe_stati'),
                          NULL::uuid,
                          'POSTATA');
                  END IF;

                  SELECT s.id INTO v_stato_chiusa_id
                    FROM pagamenti.vendite_contabili_stati s
                   WHERE s.codice_interno = 'CHIUSA' AND s.attivo IS TRUE
                   LIMIT 1;

                  IF v_stato_chiusa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'pagamenti.fn_posta_contabile',
                          'E_CONTABILE_STATO_NON_CONFIGURATO',
                          jsonb_build_object('codice_interno', 'CHIUSA', 'catalogo', 'vendite_contabili_stati'),
                          NULL::uuid,
                          'CHIUSA');
                  END IF;

                  -- =========================================================
                  -- 8) PRIMO STATEMENT — i MOVIMENTI
                  --    ⚠️ fattura_id, billing_account_id e contabile_id NON si
                  --    passano: li deriva dalla riga il trigger di mirror, che
                  --    rifiuta i valori incoerenti. Passarli qui vorrebbe dire
                  --    scrivere due volte la stessa verità.
                  --    ⭐ `centro_riscossione_id` invece SÌ, e conta: è ciò che
                  --    distingue la cassa dai centri interni (fondo fattura,
                  --    compensazione), e ogni misura di «incassato» deve poterli
                  --    escludere.
                  --    ℹ️ Il doppio movimento è impossibile per costruzione
                  --    (`uq_vendite_movimenti_contabile_riga`): se scattasse,
                  --    è un'anomalia e deve farsi sentire, non essere inghiottita.
                  -- =========================================================
                  WITH ins AS (
                      INSERT INTO pagamenti.vendite_movimenti (
                          contabile_riga_id, data_effettiva, data_registrazione,
                          data_contabile, data_valuta, data_contabilizzazione,
                          importo, centro_riscossione_id, meta)
                      SELECT cr.id,
                             COALESCE(cr.data_pagamento, v_data_contabile),
                             v_data_registrazione,
                             v_data_contabile,
                             cr.data_valuta,
                             current_date,
                             cr.importo,
                             v_centro_id,
                             jsonb_build_object('origine', 'POSTING', 'contabile_codice', v_codice)
                        FROM pagamenti.vendite_contabili_righe cr
                        JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                       WHERE cr.contabile_id = p_contabile_id
                         AND cr.attivo IS TRUE
                         AND st.is_postabile IS TRUE
                      RETURNING contabile_riga_id, importo
                  )
                  SELECT array_agg(ins.contabile_riga_id ORDER BY ins.contabile_riga_id),
                         COUNT(*)::integer,
                         COALESCE(SUM(ins.importo), 0)
                    INTO v_righe_ids, v_movimenti, v_totale_postato
                    FROM ins;

                  -- =========================================================
                  -- 9) SECONDO STATEMENT — le RIGHE a POSTATA
                  --    🔴 Statement separato, non una CTE: con la RLS padre e
                  --    figlio nella stessa snapshot non si vedono.
                  --    ⚠️ Si aggiornano ESATTAMENTE le righe di cui si è appena
                  --    scritto il movimento: ripetere il predicato porterebbe a
                  --    POSTATA anche una riga aggiunta nel frattempo, che
                  --    resterebbe senza movimento.
                  --    ⭐ È questo UPDATE a far scattare, sulle righe che
                  --    vengono da un fondo fattura, il trigger che porta l'atto
                  --    a ESEGUITO.
                  -- =========================================================
                  WITH upd AS (
                      UPDATE pagamenti.vendite_contabili_righe cr
                         SET stato_id = v_stato_postata_id
                       WHERE cr.id = ANY (COALESCE(v_righe_ids, '{}'::bigint[]))
                      RETURNING cr.id
                  )
                  SELECT COUNT(*)::integer INTO v_postate FROM upd;

                  -- =========================================================
                  -- 10) CHE COSA RESTA INDIETRO
                  --     Le righe attive in uno stato NON finale: quelle di cui
                  --     nessuno ha ancora detto che cosa ne è stato.
                  -- =========================================================
                  SELECT COUNT(*)::integer
                    INTO v_saltate
                    FROM pagamenti.vendite_contabili_righe cr
                    JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                   WHERE cr.contabile_id = p_contabile_id
                     AND cr.attivo IS TRUE
                     AND st.is_final IS NOT TRUE;

                  -- =========================================================
                  -- 11) CONFERMA E CHIUSURA (D13 + decisione del 2026-08-22)
                  --     La conferma è l'atto di REGISTRARE: il COALESCE tiene
                  --     la prima volta che è successo.
                  --     La chiusura è una CONSEGUENZA: dopo il posting righe
                  --     pronte non ne restano, e il guard di chiusura dichiara
                  --     che le altre non devono bloccare.
                  -- =========================================================
                  UPDATE pagamenti.vendite_contabili c
                     SET data_conferma = COALESCE(c.data_conferma, now()),
                         user_conferma = COALESCE(c.user_conferma, current_user),
                         stato_id      = v_stato_chiusa_id
                   WHERE c.id = p_contabile_id;

                  RETURN QUERY SELECT v_movimenti, v_postate, v_saltate,
                                      COALESCE(v_totale_postato, 0), 'POSTATA'::text;
              END;
              $function$;

              COMMENT ON FUNCTION pagamenti.fn_posta_contabile(pagamenti.vendite_contabili.id%TYPE, integer, pagamenti.vendite_contabili_righe.importo%TYPE)
              IS 'LA MADRE DEL POSTING (S1-10 del cantiere incassi, 2026-08-22): trasforma in movimenti contabili le righe PRONTE di una distinta e la chiude. ⭐ E'' il punto in cui nasce il primo movimento del progetto: da qui pagamenti.fn_get_saldo_fattura smette di rispondere «residuo = totale» per costruzione. Una sola SELECT per il chiamante — atomica per costruzione, linee-guida-sql §5b — ma DUE STATEMENT dentro: prima l''INSERT dei movimenti, poi l''UPDATE delle righe a POSTATA. 🔴 Non e'' eleganza mancata: con la RLS attiva padre e figlio nella stessa snapshot non si vedono e il WITH CHECK nega fail-closed. ⚠️ E i due statement sono legati da un ARRAY DI ID, non dal ripetere il predicato: fra l''uno e l''altro un''altra sessione puo'' aggiungere una riga alla distinta, e ripetere il predicato la porterebbe a POSTATA senza il suo movimento. ⭐ FIRMA: p_righe_attese e p_totale_atteso sono la DICHIARAZIONE di chi conferma (D13) — facoltativi ma legati, o tutti e due o nessuno. Valorizzati, la funzione rifiuta se la distinta e'' cambiata, PRIMA di scrivere: la registrazione non si torna indietro. Assenti, si registra cio'' che c''e'' — la strada dei processi automatici, che non hanno un operatore che guarda. ⚠️ DUE controlli che sembrano uno: la QUADRATURA (959) confronta tutte le righe con importo_dichiarato («ho letto tutto quello che e'' arrivato?»), la DICHIARAZIONE (963) confronta le righe pronte adesso con quelle che l''operatore ha contato («sto registrando quello che mi hanno approvato?»). ⭐ NIENTE DA REGISTRARE NON E'' UN ERRORE (Q-7, opzione B): la funzione non solleva, dichiara l''esito — POSTATA oppure NULLA_DA_POSTARE. Il database scrive nel registro errori PRIMA di sollevare, quindi un pulsante premuto due volte avrebbe lasciato un errore che errore non e''; il messaggio «l''hai gia'' fatto» lo mette il frontend leggendo l''esito. ⭐ LA CHIUSURA E'' UNA CONSEGUENZA, non una scelta (decisione di Tid, 2026-08-22): registrato, la distinta va a CHIUSA. ⚠️ Ha un prezzo pagato nello stesso lotto — una riga rimasta DA_ABBINARE sotto una distinta chiusa non deve poter diventare pronta, e lo impedisce la quarta mossa di trgfn_vendite_contabili_righe_guard_distinta_finale (20260822-01). ⭐ data_conferma / user_conferma esistevano e non le scriveva nessuno (D9-c): le scrive qui, col COALESCE che tiene la prima volta — la conferma e'' l''atto di registrare. ⛔ Cio'' che NON fa: non crea, non modifica e non annulla fondi fattura (i fatti si aggiungono, i saldi si leggono, le decisioni le prende una persona) — ma il fondo se ne accorge lo stesso, perche'' portare la riga a POSTATA fa scattare il trigger che porta l''atto a ESEGUITO; non tocca le rate, che nel modello dell''abbinamento non esistono ancora (slice 2); non scrive in error_log di suo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              DROP FUNCTION IF EXISTS pagamenti.fn_posta_contabile(bigint, integer, numeric);
