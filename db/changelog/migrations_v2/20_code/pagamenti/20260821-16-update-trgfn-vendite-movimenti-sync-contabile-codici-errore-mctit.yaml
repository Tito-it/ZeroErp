# ⭐ IL RIFIUTO PIU' IMPORTANTE DEL POSTING NON AVEVA UN NOME — passo P-7 (3 di 6)
#   pagamenti.trgfn_vendite_movimenti_sync_contabile_from_riga
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §1.3 (rilettura di B-2) e §2.0 P-7
#
# ── LA MISURA CHE HA CORRETTO IL BRIEF MADRE ────────────────────────────
#   Il brief madre (punto B-2) diceva che postare una riga non abbinata avrebbe
#   prodotto «una violazione NOT NULL (23502), non un errore di dominio
#   parlante».
#
#   ✅ Non e' cosi'. Il guard c'e' GIA' dal 2026-02-13: se la riga non ha
#   `fattura_id` o `billing_account_id`, questa funzione chiama
#   `script.fn_log_and_raise_error` e solleva un `P0001` prima che la NOT NULL
#   entri in gioco.
#
#   🔴 Il difetto e' un altro, ed e' di specie diversa: il codice e' `E_GENERICO`.
#   La condizione piu' importante dell'intero posting — «questa riga non e'
#   abbinata, quindi non si registra» — non aveva un nome con cui il backend
#   potesse decidere lo status HTTP, ne' un messaggio scritto per l'operatore.
#   Da qui `E_RIGA_CONTABILE_SENZA_ABBINAMENTO` (943, CONFLITTO_STATO).
#
# ── ⚠️ IL BUCO CHE RESTA, E CHE QUESTO CHANGESET NON CHIUDE ────────────
#   Il guard scatta SOLO se `NEW.contabile_riga_id IS NOT NULL`. Un movimento
#   inserito senza riga — strada che il modello ammette, la colonna e' nullable —
#   non incontra nessun controllo e sbatte davvero sulla NOT NULL. Non e' il
#   percorso del posting (la madre S1-10 partira' sempre dalla riga), e' il
#   percorso di chi scrive a mano. Resta annotato: si chiude quando esistera' la
#   madre, non con una toppa qui.
#
# ── I CINQUE PUNTI, IN TRE CODICI ───────────────────────────────────────
#   · riga inesistente          -> E_RIGA_CONTABILE_NON_TROVATA (942, NON_TROVATO)
#   · riga senza abbinamento    -> E_RIGA_CONTABILE_SENZA_ABBINAMENTO (943)
#   · TRE mismatch (contabile_id, fattura_id, billing_account_id)
#                               -> E_MOVIMENTO_RIFERIMENTO_INCOERENTE (944)
#
#   ⭐ Un codice solo per i tre mismatch, e non tre: il rimedio e' identico —
#   «non passare quel valore, lo deriva il trigger dalla riga» — e il messaggio
#   nomina la colonna in un segnaposto. Il criterio del progetto e' che un codice
#   nuovo nasce quando cambia il RIMEDIO, non la sfumatura: tre codici qui
#   avrebbero prodotto tre frasi identiche con una parola diversa.
#
#   ⚠️ Il messaggio di E_MOVIMENTO_RIFERIMENTO_INCOERENTE ha QUATTRO segnaposti
#   (riga, colonna, valore passato, valore della riga) e i tre punti passano
#   quattro valori ciascuno. `format()` con meno valori dei segnaposti alza 22023
#   e farebbe SPARIRE l'errore di dominio: l'arita' e' un contratto, non uno
#   stile. Presidio statico: test 5 di
#   db/pgtap/script/test-catalogo-messaggi-errore-completo.sql.
#
# Origine: corpo dalla doc auto-generata del 2026-08-21
#   (docs/it/dbzero/pagamenti/funzioni/trgfn_vendite_movimenti_sync_contabile_from_riga.md).
# Dipendenze: codici 942, 943, 944 (append ai CSV di 80_data nello stesso commit).
#   ⚠️ 80_data gira DOPO 20_code: nessuna preCondition sui codici.
# Verifica: db/pgtap/pagamenti/test-vendite-movimenti-contabile-riga.sql
# 🔴 RICHIESTA AL BE (BE-1): rigenerare error_policies_generated.py.
