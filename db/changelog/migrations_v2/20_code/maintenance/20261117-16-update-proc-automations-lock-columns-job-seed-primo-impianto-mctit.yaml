# ------------------------------------------------------------
# maintenance.proc_automations_lock_columns_job: chiama anche il runner del seed
#   di primo impianto (20261117-15), nella stessa famiglia dei guard di riga
#   (DATE_VALIDITA, CODICE_MAIUSCOLO). Cosi' la regola converge nel rilascio
#   (ci_ordine 60 di dbops.processi) e nel giro notturno delle 21:10, senza un
#   processo nuovo ne' un job pgAgent nuovo.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§16.11)
#
# Attributi vivi (pg_proc su dbdev, 2026-11-18), ripetuti: SECURITY DEFINER,
#   search_path pg_catalog, public, topology, pg_temp (linee-guida-sql §13.7).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261117-16-update-proc-automations-lock-columns-job-seed-primo-impianto-mctit.yaml

  - changeSet:
      id: 20261117-16-update-proc-automations-lock-columns-job-seed-primo-impianto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        maintenance.proc_automations_lock_columns_job: anche il runner del seed di primo impianto. Brief:
        brief-db-seed-primo-impianto-non-si-riscrive.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('maintenance.proc_automations_lock_columns_job()')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('dbops.fn_run_automations_seed_primo_impianto(text,text[],boolean)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_lock_columns_job()
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'topology', 'pg_temp'
              AS $procedure$
                BEGIN
                  -- La famiglia dei guard di riga: il lucchetto delle colonne, il
                  -- guard delle date di validita' (DATE_VALIDITA), il codice in
                  -- maiuscolo (CODICE_MAIUSCOLO) e il seed di primo impianto
                  -- (SEED_PRIMO_IMPIANTO). Ogni runner converge: crea, rigenera, toglie.
                  PERFORM maintenance.fn_run_and_log(
                    p_jobname  := 'automations_lock_columns',
                    p_stepname := 'run_automations_lock_columns',
                    p_sql      := 'SELECT dbops.fn_run_automations_lock_columns(''SCHEDULED'', NULL, false); ' ||
                                 'SELECT dbops.fn_run_automations_date_validita(''SCHEDULED'', NULL, false); ' ||
                                 'SELECT dbops.fn_run_automations_codice_maiuscolo(''SCHEDULED'', NULL, false); ' ||
                                 'SELECT dbops.fn_run_automations_seed_primo_impianto(''SCHEDULED'', NULL, false);',
                    p_lock_key := hashtext('automations_lock_columns')
                  );
                END;
              $procedure$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_lock_columns_job()
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'topology', 'pg_temp'
              AS $procedure$
                BEGIN
                  -- rev 20260923-46: anche il guard delle date di validita'
                  --   (automazione DATE_VALIDITA), stessa famiglia del lock.
                  -- rev 20260926-05: niente piu' fn_run_automations_drop_lock_trg;
                  --   togliere un lock e' un'azione del runner che converge.
                  -- rev 20261104-05: anche il codice in maiuscolo (automazione
                  --   CODICE_MAIUSCOLO), stessa famiglia.
                  PERFORM maintenance.fn_run_and_log(
                    p_jobname  := 'automations_lock_columns',
                    p_stepname := 'run_automations_lock_columns',
                    p_sql      := 'SELECT dbops.fn_run_automations_lock_columns(''SCHEDULED'', NULL, false); ' ||
                                 'SELECT dbops.fn_run_automations_date_validita(''SCHEDULED'', NULL, false); ' ||
                                 'SELECT dbops.fn_run_automations_codice_maiuscolo(''SCHEDULED'', NULL, false);',
                    p_lock_key := hashtext('automations_lock_columns')
                  );
                END;
              $procedure$;
