# ⭐ IL VERDE DI UN VERDETTO COMPLETO SPEGNE LA SPIA, SALVO RICADUTA.
#   Brief: brief-db-intermittente-e-verdetto-completo (§4.2, §4.4, D2, D4 = B)
#
# Il motivo «intermittente» copre due guasti:
#   1. il RESIDUO: la corsa lavora una parte, e un rosso lascia qualcosa che il
#      verde dopo non riprende. Solo i processi a corsa_verdetto_completo = false:
#      per loro un rosso negli ultimi sette giorni basta, come prima;
#   2. l'INSTABILITA': il lavoro cade, si rialza, ricade. Riguarda anche i
#      verdetti completi, e si nasconde quando il lavoro gira piu' spesso di quanto
#      lo si guardi. Per un verdetto completo (dbops.processi.corsa_verdetto_completo,
#      20261018-01) il motivo scatta solo se nei sette giorni ci sono ALMENO DUE
#      TRATTI ROSSI separati da un verde: un rientro e' storia, una ricaduta no.
#      La frequenza delle corse non entra nella regola: sta in pgAgent e nelle
#      sveglie, non nel catalogo.
#
# D2: per un verdetto completo la corsa in corso da meno di un'ora NON E' UN
#   VERDETTO: l'ultima corsa e' l'ultima CHIUSA. Un rosso seguito da un giro nuovo
#   resta «FALLITA» finche' il giro non chiude. Oltre l'ora la corsa e' appesa e
#   conta, come per tutti.
#
# ⚠️ Stesse colonne, stesso ordine: CREATE OR REPLACE VIEW. Corpo dal 20261016-53
#   (applicato, coi suoi commenti: la doc auto-gen li toglie). Cambiano: la CTE
#   «ultima» (flag del processo, corsa in corso esclusa per i verdetti completi),
#   una CTE nuova «tratti» (i tratti rossi di ogni job, in una passata sola), il
#   ramo intermittente del filtro, un ramo del motivo. COMMENT riscritto per
#   intero dal testo vivo + la revisione.
#
# Verifica: db/pgtap/maintenance/test-vw-job-run-da-guardare-verdetto-completo-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261018-02-update-vw-job-run-da-guardare-verdetto-completo-mctit.yaml

  - changeSet:
      id: 20261018-02-update-vw-job-run-da-guardare-verdetto-completo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        maintenance.vw_job_run_da_guardare: per un processo a verdetto completo
        l'intermittenza e' la ricaduta (due tratti rossi in sette giorni), e la corsa
        in corso non e' un verdetto. Brief: brief-db-intermittente-e-verdetto-completo.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                { schemaName: maintenance, viewName: vw_job_run_da_guardare }
            - columnExists:
                { schemaName: dbops, tableName: processi, columnName: corsa_verdetto_completo }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW maintenance.vw_job_run_da_guardare AS
              WITH ultima AS (
                       SELECT DISTINCT ON (l.jobname) l.id,
                          l.jobname,
                          l.stepname,
                          l.processo_codice,
                          l.origine,
                          l.started_at,
                          l.ended_at,
                          l.ok,
                          l.error_code,
                          l.message,
                          l.error_detail,
                          l.run_uuid,
                          l.auth_user_id,
                          l.meta,
                          l.sqlstate,
                          -- ⭐ Rev 2026-10-18: il processo dichiara se ogni sua corsa e'
                          --   un verdetto completo. Senza processo a catalogo: false,
                          --   il comportamento di prima.
                          COALESCE(pr.corsa_verdetto_completo, false) AS verdetto_completo
                         FROM maintenance.job_run_log l
                           LEFT JOIN dbops.processi pr ON (pr.codice = l.processo_codice)
                        WHERE (NOT l.saltata)
                          -- ⭐ Rev 2026-10-18 (D2): per un verdetto completo la corsa
                          --   in corso non ha ancora detto niente. Finche' non chiude
                          --   (o non diventa appesa, oltre l'ora) l'ultima corsa e'
                          --   l'ultima CHIUSA.
                          AND (NOT (COALESCE(pr.corsa_verdetto_completo, false)
                                    AND (l.ok IS NULL) AND (l.ended_at IS NULL)
                                    AND (l.started_at >= (now() - '01:00:00'::interval))))
                        ORDER BY l.jobname, l.started_at DESC, l.id DESC
                      ), tratti AS (
                       -- ⭐ Rev 2026-10-18 — l'INSTABILITA': i tratti rossi di ogni job
                       --   nei sette giorni. Un tratto comincia con un rosso la cui
                       --   corsa precedente nella finestra non e' rossa (verde, o
                       --   nessuna: il tratto e' cominciato prima). Contano le sole
                       --   corse chiuse con un esito: le saltate non sono corse, la
                       --   corsa in corso non ha detto niente, un'appesa vecchia non
                       --   e' ne' rossa ne' verde.
                       --   Una passata sola sul giornale per tutti i job (su jobname
                       --   non c'e' indice: una sotto-select per job lo rileggerebbe
                       --   intero ogni volta).
                       SELECT s.jobname,
                          count(*) FILTER (WHERE ((s.ok IS FALSE) AND (s.precedente IS DISTINCT FROM false))) AS tratti_rossi
                         FROM ( SELECT p.jobname,
                                  p.ok,
                                  lag(p.ok) OVER (PARTITION BY p.jobname ORDER BY p.started_at, p.id) AS precedente
                                 FROM maintenance.job_run_log p
                                WHERE ((NOT p.saltata) AND (p.ok IS NOT NULL) AND (p.started_at >= (now() - '7 days'::interval)))) s
                        GROUP BY s.jobname
                      ), da_guardare AS (
                       SELECT u.id,
                          u.jobname,
                          u.stepname,
                          u.processo_codice,
                          u.origine,
                          u.started_at,
                          u.ended_at,
                          u.ok,
                          u.error_code,
                          u.message,
                          u.error_detail,
                          u.run_uuid,
                          u.sqlstate,
                          -- ⭐ Rev 2026-10-16: «appesa» e' un fatto solo oltre l'ora. Una
                          --   corsa aperta da meno e' una corsa IN CORSO: entra solo se il
                          --   job ha rossi recenti, ed e' allora un intermittente.
                          ((u.ok IS NULL) AND (u.ended_at IS NULL) AND (u.started_at < (now() - '01:00:00'::interval))) AS appesa,
                          u.verdetto_completo
                         FROM (ultima u
                           LEFT JOIN tratti t ON (t.jobname = u.jobname))
                        WHERE ((u.ok IS FALSE)
                           -- Il RESIDUO (verdetto parziale): un rosso negli ultimi
                           -- sette giorni basta, come prima.
                           OR ((NOT u.verdetto_completo) AND (EXISTS ( SELECT 1
                                 FROM maintenance.job_run_log p
                                WHERE ((p.jobname = u.jobname) AND (p.ok IS FALSE) AND (p.started_at >= (now() - '7 days'::interval))))))
                           -- ⭐ Rev 2026-10-18 — l'INSTABILITA' (verdetto completo):
                           --   almeno due tratti rossi nei sette giorni (CTE tratti).
                           OR (u.verdetto_completo AND (COALESCE(t.tratti_rossi, (0)::bigint) >= 2))
                           OR ((u.ok IS NULL) AND (u.ended_at IS NULL) AND (u.started_at < (now() - '01:00:00'::interval))))
                      )
               SELECT g.jobname,
                  g.processo_codice,
                  g.origine,
                  g.started_at,
                  g.ended_at,
                      CASE
                          WHEN (g.ok IS FALSE) THEN 'l''ultima corsa e'' FALLITA'::text
                          WHEN g.appesa THEN 'presa e mai chiusa: il job e'' morto senza dire niente'::text
                          -- ⭐ Rev 2026-10-18: per un verdetto completo l'ultima corsa
                          --   qui e' verde (la corsa in corso non e' l'ultima), ed e'
                          --   dentro solo perche' e' ricaduto.
                          WHEN g.verdetto_completo THEN 'ultima corsa OK, ma e'' ricaduto dopo essere tornato verde: instabile'::text
                          WHEN ((g.ok IS NULL) AND (g.ended_at IS NULL)) THEN 'in corso adesso, ma ha fallito di recente: intermittente'::text
                          ELSE 'ultima corsa OK, ma ha fallito di recente: intermittente'::text
                      END AS motivo,
                  g.error_code,
                  g.message,
                  g.error_detail,
                  (now() - g.started_at) AS da_quanto,
                  g.run_uuid,
                  g.id AS job_run_id,
                  ( SELECT count(*) AS count
                         FROM maintenance.job_run_log p
                        WHERE ((p.jobname = g.jobname) AND (p.ok IS FALSE) AND (p.started_at >= (g.started_at - '7 days'::interval)))) AS falliti_ultimi_7_giorni,
                  -- ⭐ Rev 2026-10-16 — tre colonne IN CODA (CREATE OR REPLACE VIEW).
                  g.sqlstate,
                  -- La causa (dbops.cause_fallimento), in quest'ordine:
                  --   1. corsa appesa: il processo e' morto senza arrivare al gestore
                  --      d'eccezione (kill, OOM, riavvio) → AMBIENTE, qualunque processo;
                  --   2. SQLSTATE dell'ultimo rosso dell'ambiente → AMBIENTE. ⭐ Rev
                  --      2026-10-16: la lista sta in script.fn_sqlstate_di_ambiente (08, 53,
                  --      57, 58, 42501, 55P03), sede unica con i gestori delle automazioni;
                  --   3. il codice dell'ultimo rosso dichiara la sua causa
                  --      (config.codici_errore.causa_fallimento) → quella;
                  --   4. la causa che dichiara il processo (dbops.processi.causa_fallimento);
                  --   5. nessun processo a catalogo → PROGRAMMA: un job che scrive nel
                  --      giornale senza codice di catalogo e' gia' una lacuna del programma.
                  -- ⭐ Dall'ULTIMO ROSSO, non dall'ultima corsa: per un intermittente
                  --   l'ultima corsa e' verde (o in corso) e non ha errore.
                      CASE
                          WHEN g.appesa THEN 'AMBIENTE'::text
                          WHEN script.fn_sqlstate_di_ambiente(r.sqlstate) THEN 'AMBIENTE'::text
                          ELSE COALESCE(ce.causa_fallimento, pr.causa_fallimento, 'PROGRAMMA'::text)
                      END AS causa,
                  r.id AS ultimo_rosso_job_run_id
                 FROM da_guardare g
                   LEFT JOIN LATERAL ( SELECT p.id,
                          p.error_code,
                          p.sqlstate,
                          p.processo_codice
                         FROM maintenance.job_run_log p
                        WHERE ((p.jobname = g.jobname) AND (p.ok IS FALSE))
                        ORDER BY p.started_at DESC, p.id DESC
                       LIMIT 1) r ON true
                   LEFT JOIN config.codici_errore ce ON (ce.codice = r.error_code)
                   LEFT JOIN dbops.processi pr ON (pr.codice = COALESCE(r.processo_codice, g.processo_codice));

              COMMENT ON VIEW maintenance.vw_job_run_da_guardare IS
                  'I job che chiedono un occhio: quelli la cui ULTIMA corsa e'' FALLITA, e quelli la cui ultima corsa e'' rimasta APERTA da oltre un''ora (il processo e'' morto senza arrivare nemmeno al gestore d''eccezione). DEVE restare VUOTA. ⭐ Esiste perche'' dal changeSet 20260905-36 una corsa fallita lascia finalmente una riga rossa: prima il verbale veniva scritto e annullato dal RAISE, e nel giornale non e'' MAI esistito un fallimento di un job pgAgent (misurato: 0 rossi con origine PGAGENT contro 31 dei command). ⛔ Ma righe rosse in una tabella che nessuno interroga sono un silenzio nuovo, e questa vista e'' il posto dove guardare. ⭐ Si guarda solo l''ULTIMA corsa di ogni job, non tutti i rossi: cosi'' un job che ricomincia a funzionare ESCE DA SOLO, senza colonne «visto» ne'' finestre arbitrarie — e sync_auth_user_active, che il 2026-09-05 aveva 29 fallimenti in un giorno, occupa UNA riga invece di ventinove. ⭐ E un TERZO motivo prende l''intermittenza: ultima corsa verde ma almeno un rosso negli ultimi sette giorni — senza, un job che fallisce e passa sarebbe invisibile, ed e'' proprio il caso di sync_auth_user_active. Anche quel ramo si auto-pulisce: dopo sette giorni senza rossi il job esce da solo. ⛔ E non vede IL JOB CHE NON PARTE AFFATTO: per quello servirebbe che ogni processo dichiarasse ogni quanto deve girare, e dbops.processi non ce l''ha — stessa forma di R-12 da un altro lato, e resta scoperta. ⚠️ Niente RLS: un giro di manutenzione non appartiene a un''azienda. Chi la vede lo decide il backend con area funzionale e profilo, come per le viste di presidio sorelle. ⛔ Rev 2026-10-10: l''ultima corsa e'' l''ultima corsa VERA — le righe saltate (maintenance.job_run_log.saltata) sono escluse. Una corsa appesa tiene il lock, e ogni sveglia successiva scrive una skip piu'' recente: prima la skip diventava l''ultima corsa e il ramo «presa e mai chiusa» non scattava piu''. Brief: brief-db-corsa-saltata-non-e-una-corsa §2.2. ⭐ Rev 2026-10-16: tre colonne in coda. sqlstate (dell''ultima corsa, da job_run_log.sqlstate); causa (dbops.cause_fallimento), da cui dbops.presidi_cause dice a chi tocca la riga: corsa appesa o SQLSTATE dell''ultimo rosso di classe 08/53/57/58 → AMBIENTE; poi la causa del codice dell''ultimo rosso (config.codici_errore.causa_fallimento), poi quella del processo (dbops.processi.causa_fallimento), e PROGRAMMA senza processo a catalogo. Mai NULL. ultimo_rosso_job_run_id: la corsa da cui la causa e'' letta (per un intermittente l''ultima corsa e'' verde). ⛔ E il motivo «presa e mai chiusa» vale solo oltre l''ora: una corsa in corso da meno, con rossi recenti, era detta morta; ora e'' «in corso adesso, ma ha fallito di recente: intermittente». Prima il presidio aveva un solo destinatario (SISTEMISTA) per guasti di natura diversa. Brief: brief-db-presidio-job-run-a-chi-tocca. ⭐ Rev 2026-10-16 (bis): la lista degli SQLSTATE dell''ambiente sta in script.fn_sqlstate_di_ambiente, sede unica con i gestori WHEN others del framework automazioni (D8), e si allarga a 42501 (privilegio mancante) e 55P03 (lock non ottenuto, D10). Brief: brief-db-presidio-job-run-a-chi-tocca §10. ⭐ Rev 2026-10-18: l''intermittenza copre due guasti, il RESIDUO (una corsa lavora una parte, e il verde non riprende cio'' che il rosso ha lasciato) e l''INSTABILITA'' (il lavoro cade, si rialza, ricade). Per un processo il cui ogni giro e'' un verdetto completo (dbops.processi.corsa_verdetto_completo: lo smoke notturno, le automazioni, il digest) il residuo non esiste: il motivo scatta solo se nei sette giorni ci sono almeno DUE TRATTI ROSSI separati da un verde (motivo «ricaduto dopo essere tornato verde: instabile»), e un solo tratto rosso esce al primo verde. sync_auth_user_active riallineava tutti gli utenti a ogni corsa: era un verdetto completo instabile, e resterebbe in vista. E per un verdetto completo la corsa in corso da meno di un''ora non e'' un verdetto: conta l''ultima corsa chiusa (D2). Per gli altri processi niente cambia. falliti_ultimi_7_giorni resta per tutti. Brief: brief-db-intermittente-e-verdetto-completo.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo (corpo del 20261016-53).
              SELECT 1;
