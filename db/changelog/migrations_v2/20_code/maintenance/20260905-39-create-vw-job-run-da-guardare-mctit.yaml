# ⭐ IL POSTO DOVE GUARDARE — i job che chiedono un occhio.
#   Brief: brief-db-storicizzazione-bersagli-spariti.md §2.3 (R-12)
#
# Da `20260905-36` un job che fallisce lascia una riga rossa nel giornale, anche
# quando il `RAISE` annulla tutto. ⛔ Ma righe rosse in una tabella che nessuno
# interroga sono **un silenzio nuovo**: il guasto smette di essere invisibile e
# diventa illeggibile, che per chi deve accorgersene e' la stessa cosa.
#
# ── ⭐ LA DOMANDA E' «QUALE JOB STA ANDANDO MALE», NON «ELENCA I ROSSI»
#   Ed e' la scelta che tiene la vista **capace di tornare vuota**.
#   Si guarda solo l'**ULTIMA corsa di ogni job**:
#     * se l'ultima e' fallita, il job compare;
#     * quando ricomincia ad andare bene, **esce da solo**.
#   ⇒ Nessuna colonna «visto», nessuna finestra temporale arbitraria, nessuna
#     manutenzione a mano.
#   ⚠️ Misurato il 2026-09-05: `sync_auth_user_active` ha **29 fallimenti** in un
#   giorno. Elencandoli tutti la vista sarebbe nata con ventinove righe che
#   dicono la stessa cosa; cosi' ne ha **una**, ed e' quella che serve.
#   ⛔ E qui la sola «ultima corsa» non basta, e l'ha detto il dato: un job che
#   fallisce e **passa**, fallisce e passa, avrebbe l'ultima corsa verde e
#   sarebbe **invisibile**. ⇒ Un terzo motivo prende l'intermittenza — ultima
#   corsa OK ma almeno un rosso negli ultimi sette giorni. ⭐ Si auto-pulisce
#   anche lui: dopo sette giorni tranquilli il job esce da solo.
#
# ── ⭐ TRE MOTIVI, PERCHE' SONO TRE GUASTI DIVERSI ──────────────────
#     ultima corsa FALLITA        il job e' arrivato in fondo e ha detto perche'
#     presa e mai chiusa          ⛔ nemmeno il gestore d'eccezione ha parlato:
#                                 il processo e' morto di colpo (kill, riavvio)
#     intermittente               l'ultima e' andata bene, ma di recente no
#   ⚠️ Il secondo e' il caso che il canale fuori transazione NON copre — per
#   scriverlo bisogna almeno arrivare al gestore. E' l'unico modo che abbiamo di
#   vederlo, ed e' il motivo per cui non basta elencare i rossi.
#
# ── ⚠️ LA SOGLIA DI UN'ORA E' UNA SCELTA, NON UNA MISURA ───────────
#   Una corsa senza fine da meno di un'ora puo' essere semplicemente **in corso**.
#   L'ora non viene dai tempi osservati: viene dal fatto che questi sono job di
#   manutenzione che durano secondi. ⛔ Una soglia dedotta dai tempi di oggi si
#   taglierebbe addosso al carico di oggi.
#
# ── ⛔ CHE COSA QUESTA VISTA NON VEDE, e va dichiarato ──────────────
#   **Il job che non parte affatto.** Se nessuno lo sveglia, non c'e' nessuna
#   corsa da guardare — e per accorgersene servirebbe che ogni processo
#   dichiarasse **ogni quanto** deve girare, cosa che `dbops.processi` oggi non
#   ha. ⚠️ E' la stessa forma di R-12 vista da un altro lato, e resta scoperta:
#   scritto qui perche' non sembri coperta.
#
# ── ⚠️ NIENTE RLS, ED E' UNA SCELTA ────────────────────────────────
#   `maintenance.job_run_log` non ha un emittente: un giro di manutenzione non
#   appartiene a un'azienda, e un perimetro qui non vorrebbe dire niente.
#   ⇒ Si concede `SELECT` al ruolo applicativo, come le sei viste di presidio
#   sorelle, e **chi la vede lo decide il backend** con l'area funzionale e il
#   profilo — non il database. E' il pattern gia' in uso per il pannello dei
#   presidi.
#
# Verifica: db/pgtap/maintenance/test-vw-job-run-da-guardare.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20260905-39-create-vw-job-run-da-guardare-mctit.yaml

  - changeSet:
      id: 20260905-39-create-vw-job-run-da-guardare
      author: mctit
      failOnError: true
      comment: >
        maintenance.vw_job_run_da_guardare: i job la cui ULTIMA corsa e' andata
        male, o e' rimasta aperta. Guardando solo l'ultima corsa la vista torna
        vuota da sola quando il job ricomincia a funzionare, senza colonne «visto»
        ne' finestre temporali. E' il posto dove guardare le righe rosse che dal
        20260905-36 finalmente esistono.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: maintenance, tableName: job_run_log }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW maintenance.vw_job_run_da_guardare AS
              WITH ultima AS (
                  -- ⭐ Una riga per job: l'ULTIMA corsa. E' cio' che rende la
                  --   vista capace di tornare vuota da sola.
                  SELECT DISTINCT ON (l.jobname)
                         l.id, l.jobname, l.stepname, l.processo_codice,
                         l.origine, l.started_at, l.ended_at, l.ok,
                         l.error_code, l.message, l.error_detail,
                         l.run_uuid, l.auth_user_id, l.meta
                    FROM maintenance.job_run_log l
                   ORDER BY l.jobname, l.started_at DESC, l.id DESC
              )
              SELECT u.jobname,
                     u.processo_codice,
                     u.origine,
                     u.started_at,
                     u.ended_at,
                     -- ⭐ Tre motivi, perche' sono tre guasti diversi e vogliono
                     --   tre gesti diversi.
                     CASE
                         WHEN u.ok IS FALSE
                             THEN 'l''ultima corsa e'' FALLITA'
                         WHEN u.ok IS NULL AND u.ended_at IS NULL
                             THEN 'presa e mai chiusa: il job e'' morto senza dire niente'
                         -- ⭐ Il terzo caso, e senza di lui la vista sarebbe
                         --   cieca proprio dove serve: un job che fallisce e
                         --   passa, fallisce e passa. L'ultima corsa e' verde,
                         --   quindi da sola non lo direbbe nessuno.
                         ELSE 'ultima corsa OK, ma ha fallito di recente: intermittente'
                     END AS motivo,
                     u.error_code,
                     u.message,
                     u.error_detail,
                     -- Da quanto: e' il numero che dice se guardare adesso o
                     -- domani.
                     now() - u.started_at AS da_quanto,
                     u.run_uuid,
                     u.id AS job_run_id,
                     -- ⚠️ Quante volte di fila: 29 fallimenti in un giorno e uno
                     --   solo non sono la stessa situazione, e la vista deve
                     --   poterlo dire senza elencarli.
                     (SELECT count(*)
                        FROM maintenance.job_run_log p
                       WHERE p.jobname = u.jobname
                         AND p.ok IS FALSE
                         AND p.started_at >= u.started_at - interval '7 days')
                         AS falliti_ultimi_7_giorni
                FROM ultima u
               WHERE u.ok IS FALSE
                  -- ⭐ INTERMITTENZA: l'ultima corsa e' andata bene, ma nei sette
                  --   giorni prima ha fallito almeno una volta. Un job che
                  --   fallisce e passa non e' sano, e guardando solo l'ultima
                  --   corsa sarebbe invisibile.
                  -- ⚠️ Misurato il 2026-09-05: `sync_auth_user_active` ha 29
                  --   fallimenti in un giorno e l'ultima corsa VERDE. Senza
                  --   questo ramo la vista non lo nominerebbe.
                  -- ⭐ Resta auto-pulente: dopo sette giorni senza rossi esce
                  --   da solo, senza colonne «visto».
                  OR EXISTS (SELECT 1
                               FROM maintenance.job_run_log p
                              WHERE p.jobname = u.jobname
                                AND p.ok IS FALSE
                                AND p.started_at >= now() - interval '7 days')
                  -- ⛔ Il caso che il canale fuori transazione NON copre: per
                  --   scrivere il verbale bisogna almeno arrivare al gestore
                  --   d'eccezione. Un processo ucciso di colpo lascia solo la
                  --   riga d'avvio, aperta per sempre.
                  -- ⚠️ La soglia di un'ora distingue «morto» da «ancora in
                  --   corso», ed e' una scelta: questi job durano secondi.
                  OR (u.ok IS NULL
                      AND u.ended_at IS NULL
                      AND u.started_at < now() - interval '60 minutes');

              COMMENT ON VIEW maintenance.vw_job_run_da_guardare IS
                  'I job che chiedono un occhio: quelli la cui ULTIMA corsa e'' FALLITA, e '
                  'quelli la cui ultima corsa e'' rimasta APERTA da oltre un''ora (il '
                  'processo e'' morto senza arrivare nemmeno al gestore d''eccezione). DEVE '
                  'restare VUOTA. ⭐ Esiste perche'' dal changeSet 20260905-36 una corsa '
                  'fallita lascia finalmente una riga rossa: prima il verbale veniva '
                  'scritto e annullato dal RAISE, e nel giornale non e'' MAI esistito un '
                  'fallimento di un job pgAgent (misurato: 0 rossi con origine PGAGENT '
                  'contro 31 dei command). ⛔ Ma righe rosse in una tabella che nessuno '
                  'interroga sono un silenzio nuovo, e questa vista e'' il posto dove '
                  'guardare. ⭐ Si guarda solo l''ULTIMA corsa di ogni job, non tutti i '
                  'rossi: cosi'' un job che ricomincia a funzionare ESCE DA SOLO, senza '
                  'colonne «visto» ne'' finestre arbitrarie — e sync_auth_user_active, che '
                  'il 2026-09-05 aveva 29 fallimenti in un giorno, occupa UNA riga invece '
                  'di ventinove. ⭐ E un TERZO motivo prende '
                  'l''intermittenza: ultima corsa verde ma almeno un rosso negli ultimi '
                  'sette giorni — senza, un job che fallisce e passa sarebbe invisibile, '
                  'ed e'' proprio il caso di sync_auth_user_active. Anche quel ramo si '
                  'auto-pulisce: dopo sette giorni senza rossi il job esce da solo. ⛔ E non vede IL JOB CHE NON PARTE '
                  'AFFATTO: per quello servirebbe che ogni processo dichiarasse ogni '
                  'quanto deve girare, e dbops.processi non ce l''ha — stessa forma di '
                  'R-12 da un altro lato, e resta scoperta. ⚠️ Niente RLS: un giro di '
                  'manutenzione non appartiene a un''azienda. Chi la vede lo decide il '
                  'backend con area funzionale e profilo, come per le viste di presidio '
                  'sorelle.';

              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT SELECT ON maintenance.vw_job_run_da_guardare TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS maintenance.vw_job_run_da_guardare;
