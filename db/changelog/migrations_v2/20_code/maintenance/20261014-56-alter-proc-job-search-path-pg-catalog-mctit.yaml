# ------------------------------------------------------------
# ⭐ IL search_path DELLE PROCEDURE DEI JOB, NELLA FORMA DI CASA.
#   Brief: brief-db-ruoli-di-sistema §8.4
#
# 20261014-55 ha reso DEFINER le 16 procedure maintenance.proc_*_job con
# `search_path = public, topology, pg_temp`. Semantica giusta — quando
# pg_catalog non e' elencato PostgreSQL lo cerca comunque per PRIMO — ma forma
# sbagliata: `dbops/test-security-definer-search-path-v1` test 5 conta le
# DEFINER con `public` prima di pg_catalog, un debito (D6-bis) a soglia che
# puo' solo calare, ed e' passato da 5 a 21. Rosso trovato da Tid il
# 2026-10-14 sulla corsa di `zeroerp_ruoli`; la prova pre-apply del -55 non
# aveva lanciato quel presidio.
#
# ⇒ `pg_catalog, public, topology, pg_temp`: la stessa risoluzione di prima,
#   scritta come la regola vuole. Nessun nome cambia significato.
# ⚠️ ALTER e non una modifica del -55: e' gia' applicato su dbdev (checksum).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261014-56-alter-proc-job-search-path-pg-catalog-mctit.yaml

  - changeSet:
      id: 20261014-56-alter-proc-job-search-path-pg-catalog
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Le 16 procedure maintenance.proc_*_job fissano search_path = pg_catalog, public,
        topology, pg_temp: la forma di casa per le DEFINER (pg_catalog per primo), al posto
        di quella del 20261014-55 che contava come debito D6-bis in
        test-security-definer-search-path-v1 (test 5). Stessa risoluzione dei nomi.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM unnest(ARRAY[
                  'maintenance.proc_accoda_chiusura_scadenze_job()',
                  'maintenance.proc_analyze_statistiche_job()',
                  'maintenance.proc_apply_fk_index_policy_job(boolean)',
                  'maintenance.proc_apply_storicizza_defaults_job()',
                  'maintenance.proc_automations_attivo_job()',
                  'maintenance.proc_automations_audit_update_job()',
                  'maintenance.proc_automations_cleanup_job()',
                  'maintenance.proc_automations_delete_block_job()',
                  'maintenance.proc_automations_lock_columns_job()',
                  'maintenance.proc_automations_overlap_job()',
                  'maintenance.proc_automations_storico_job()',
                  'maintenance.proc_automations_storico_provision_job()',
                  'maintenance.proc_automations_tx_id_job()',
                  'maintenance.proc_guardiano_digest_job()',
                  'maintenance.proc_sync_auth_user_expired_job()',
                  'maintenance.proc_sync_storico_set_storicizza_job()']) AS s(firma)
               WHERE to_regprocedure(s.firma) IS NULL;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER PROCEDURE maintenance.proc_accoda_chiusura_scadenze_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_analyze_statistiche_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_apply_fk_index_policy_job(boolean) SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_apply_storicizza_defaults_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_attivo_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_audit_update_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_cleanup_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_delete_block_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_lock_columns_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_overlap_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_storico_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_storico_provision_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_automations_tx_id_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_guardiano_digest_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_sync_auth_user_expired_job() SET search_path = pg_catalog, public, topology, pg_temp;
              ALTER PROCEDURE maintenance.proc_sync_storico_set_storicizza_job() SET search_path = pg_catalog, public, topology, pg_temp;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Tornare alla forma del -55 rimetterebbe 16 DEFINER nel debito D6-bis.
              --   Il verso di ritiro e' un changeSet nuovo.
              SELECT 1;
