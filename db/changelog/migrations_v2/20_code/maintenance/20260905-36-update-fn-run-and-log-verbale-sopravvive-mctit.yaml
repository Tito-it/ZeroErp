# ⭐ DA QUI IN POI UN JOB CHE FALLISCE LASCIA UNA TRACCIA.
#   Brief: brief-db-storicizzazione-bersagli-spariti.md §2.3 (R-12)
#
# ── ⛔ CHE COSA C'ERA, E NON ERA UNA DIMENTICANZA ───────────────────
#   Il gestore d'eccezione faceva — e continua a fare — la cosa giusta: cattura
#   l'errore, scrive `ok = false` con codice, messaggio e dettaglio, sblocca
#   l'advisory lock. Poi `RAISE`, col commento `-- lascio propagare`.
#   ⛔ E il `RAISE` annulla la transazione, quindi **anche quella riga**.
#   ⇒ Il verbale veniva redatto e distrutto nello stesso istante. Non e' che le
#     corse fallite mancassero: **non potevano esistere**, per nessuno dei dodici
#     job che passano di qui.
#   ⭐ Cosi' `apply_storicizza_weekly` e' morto ogni settimana per SEI MESI con
#     l'ultimo verdetto agli atti a «done» — un giornale che non tace ma dice il
#     falso, ed e' peggio.
#
# ── ⭐ COSA CAMBIA: UNA RIGA IN PIU', PRIMA DEL `RAISE` ─────────────
#   `maintenance.fn_job_run_log_failure` (`20260905-35`) scrive lo stesso
#   verbale su una **connessione separata**, dove il rollback non arriva. E' il
#   canale gia' in servizio di `script.fn_log_error_only`.
#   ⚠️ L'`UPDATE` in transazione **resta**, e non e' ridondante: se un giorno
#   qualcuno chiamasse `fn_run_and_log` dentro un blocco che cattura l'eccezione
#   senza propagarla, la transazione sopravvive e la riga aggiornata e' quella
#   giusta. Le due scritture coprono due mondi diversi, non lo stesso due volte.
#   ⛔ Nel mondo normale — `RAISE` che propaga — la riga in transazione muore e
#   resta solo quella fuori. ⇒ Nessun doppione: o l'una o l'altra.
#
# ── ⚠️ IL `RAISE` NON SI TOGLIE ────────────────────────────────────
#   Si poteva «risolvere» smettendo di rilanciare: la transazione avrebbe fatto
#   commit e la riga rossa sarebbe rimasta. ⛔ Ma allora il lavoro sarebbe
#   risultato RIUSCITO a chi l'ha chiesto, e un giro a meta' committato in
#   silenzio e' peggio di un giro annullato. ⇒ L'errore continua a propagare: il
#   lavoro si annulla, il verbale no.
#
# ── ⚠️ NON PUO' ROMPERE IL JOB CHE STA GIA' FALLENDO ───────────────
#   `fn_job_log_failure` non solleva mai: ogni via d'uscita e' un `WARNING`. Se
#   il canale non c'e', il comportamento torna esattamente quello di prima —
#   nessuna traccia — e non peggiora di niente.
#
# ── 🔴 E VA VERIFICATO UNA VOLTA SUL PERCORSO VERO ─────────────────
#   Il canale tace quando non funziona (per disegno: non si fa fallire un lavoro
#   per una nota). ⇒ Dopo l'apply va guardato **una volta** che una corsa fallita
#   lasci davvero la riga, girando un job per davvero. Un controllo, non un atto
#   di fede — altrimenti avremmo spostato il silenzio invece di toglierlo, che e'
#   l'errore contro cui questo lavoro esiste.
#   ⚠️ E serve il posto dove guardare: righe rosse in una tabella che nessuno
#   interroga sono un silenzio nuovo. E' il pezzo che resta.
#
# ⚠️ Il corpo di partenza e' quello VIVO, estratto da `pg_get_functiondef`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20260905-36-update-fn-run-and-log-verbale-sopravvive-mctit.yaml

  - changeSet:
      id: 20260905-36-update-fn-run-and-log-verbale-sopravvive
      author: mctit
      failOnError: true
      comment: >
        maintenance.fn_run_and_log scrive il verbale del run fallito anche fuori
        transazione, prima del RAISE. Prima lo scriveva e il RAISE lo annullava
        insieme al lavoro: nessuno dei dodici job poteva lasciare una riga rossa,
        ed e' cosi' che apply_storicizza_weekly e' morto per sei mesi con
        l'ultimo verdetto a «done».
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
               JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'maintenance'
                 AND p.proname = 'fn_job_run_log_failure'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION maintenance.fn_run_and_log(
                  p_jobname text,
                  p_stepname text,
                  p_sql text,
                  p_lock_key bigint DEFAULT NULL::bigint,
                  p_processo_codice text DEFAULT NULL::text,
                  p_auth_user_id integer DEFAULT NULL::integer)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
                DECLARE
                  v_id         maintenance.job_run_log.id%TYPE;
                  v_rows       maintenance.job_run_log.rows_affected%TYPE := 0;
                  v_locked     boolean := false;
                  -- Attore risolto: passato dal chiamante, oppure derivato dal
                  -- jobname (vedi intestazione: qui la derivazione e' completa).
                  v_processo   maintenance.job_run_log.processo_codice%TYPE;

                  -- ⭐ Le coordinate della corsa, per poterla riscrivere FUORI
                  --   dalla transazione quando questa verra' annullata.
                  v_run_uuid   maintenance.job_run_log.run_uuid%TYPE;
                  v_started_at maintenance.job_run_log.started_at%TYPE;
                  v_origine    maintenance.job_run_log.origine%TYPE;

                  -- diagnosi errori
                  v_errmsg     maintenance.job_run_log.message%TYPE;
                  v_errdetail  text;
                  v_errhint    text;
                  v_errcontext text;
                  v_sqlstate   maintenance.job_run_log.error_code%TYPE;
                BEGIN
                  -- Sotto-select scalare, non SELECT INTO: senza righe ritorna
                  -- NULL senza azzerare nulla di gia' calcolato.
                  v_processo := COALESCE(
                      p_processo_codice,
                      (SELECT pr.codice
                         FROM dbops.processi pr
                        WHERE pr.codice = p_jobname)
                  );

                  -- lock opzionale per evitare overlap
                  -- ⚠️ Forma a UN argomento, invariata di proposito: e' uno
                  --   spazio di lock distinto da quello di
                  --   script.fn_job_run_start, e i due canali restano
                  --   indipendenti (vedi intestazione).
                  IF p_lock_key IS NOT NULL THEN
                    v_locked := pg_try_advisory_lock(p_lock_key);
                    IF NOT v_locked THEN
                      -- L'attore va scritto anche sulla riga di skip: senza,
                      -- ogni sovrapposizione lascerebbe un run senza attore.
                      INSERT INTO maintenance.job_run_log
                          (jobname, stepname, ok, message, processo_codice, auth_user_id)
                      VALUES (p_jobname, p_stepname, TRUE, 'skip: another run in progress',
                              v_processo, p_auth_user_id);
                      RETURN;
                    END IF;
                  END IF;

                  INSERT INTO maintenance.job_run_log
                      (jobname, stepname, processo_codice, auth_user_id)
                  VALUES (p_jobname, p_stepname, v_processo, p_auth_user_id)
                  RETURNING id, run_uuid, started_at, origine
                       INTO v_id, v_run_uuid, v_started_at, v_origine;

                  BEGIN
                    EXECUTE p_sql;
                    GET DIAGNOSTICS v_rows = ROW_COUNT;

                    UPDATE maintenance.job_run_log
                      SET ended_at      = clock_timestamp(),
                          ok            = TRUE,
                          rows_affected = v_rows,
                          message       = 'done'
                    WHERE id = v_id;

                    IF v_locked THEN
                      PERFORM pg_advisory_unlock(p_lock_key);
                    END IF;

                  EXCEPTION WHEN OTHERS THEN
                    -- cattura dettagli dal frame eccezione
                    GET STACKED DIAGNOSTICS
                      v_errmsg     = MESSAGE_TEXT,
                      v_errdetail  = PG_EXCEPTION_DETAIL,
                      v_errhint    = PG_EXCEPTION_HINT,
                      v_errcontext = PG_EXCEPTION_CONTEXT,
                      v_sqlstate   = RETURNED_SQLSTATE;

                    -- ⚠️ Questa UPDATE muore col RAISE qui sotto, e resta
                    --   comunque: copre il caso in cui qualcuno chiami
                    --   fn_run_and_log dentro un blocco che cattura l'eccezione
                    --   senza propagarla. La' la transazione sopravvive, e
                    --   questa e' la riga giusta.
                    UPDATE maintenance.job_run_log
                      SET ended_at     = clock_timestamp(),
                          ok           = FALSE,
                          message      = v_errmsg,
                          error_code   = v_sqlstate,
                          error_detail = coalesce(v_errdetail,'') ||
                                          CASE WHEN v_errhint IS NOT NULL THEN E'\nHINT: '||v_errhint ELSE '' END ||
                                          CASE WHEN v_errcontext IS NOT NULL THEN E'\nCONTEXT: '||v_errcontext ELSE '' END
                    WHERE id = v_id;

                    -- ⭐ E QUESTA E' LA RIGA CHE SOPRAVVIVE. Va su una
                    --   connessione separata, dove il rollback del RAISE non
                    --   arriva. ⛔ Senza, il verbale del fallimento veniva
                    --   scritto e distrutto nello stesso istante — ed e' il
                    --   motivo per cui in questo giornale non e' mai esistita
                    --   una riga rossa.
                    -- ⚠️ Non solleva mai: se il canale non c'e' emette un
                    --   WARNING e si torna al comportamento di prima. Non si fa
                    --   fallire due volte un lavoro gia' fallito.
                    PERFORM maintenance.fn_job_run_log_failure(
                        p_jobname         => p_jobname,
                        p_stepname        => p_stepname,
                        p_started_at      => v_started_at,
                        p_run_uuid        => v_run_uuid,
                        p_origine         => v_origine,
                        p_processo_codice => v_processo,
                        p_auth_user_id    => p_auth_user_id,
                        p_message         => v_errmsg,
                        p_error_code      => v_sqlstate,
                        p_error_detail    => coalesce(v_errdetail,'') ||
                                          CASE WHEN v_errhint IS NOT NULL THEN E'\nHINT: '||v_errhint ELSE '' END ||
                                          CASE WHEN v_errcontext IS NOT NULL THEN E'\nCONTEXT: '||v_errcontext ELSE '' END);

                    IF v_locked THEN
                      PERFORM pg_advisory_unlock(p_lock_key);
                    END IF;

                    -- ⚠️ Si continua a propagare, ed e' voluto: smettere
                    --   farebbe risultare RIUSCITO a chi l'ha chiesto un lavoro
                    --   che non lo e'. Il lavoro si annulla, il verbale no.
                    RAISE;
                  END;
                END;
              $function$;

              COMMENT ON FUNCTION maintenance.fn_run_and_log(text, text, text, bigint, text, integer)
              IS 'Registra una corsa di job in maintenance.job_run_log ed esegue il lavoro. ⭐ Rev 2026-09-05 (R-12): il verbale di un FALLIMENTO viene scritto anche FUORI transazione, con maintenance.fn_job_run_log_failure, prima del RAISE. ⛔ Prima il gestore d''eccezione scriveva la riga ok=false e poi rilanciava: il RAISE annulla la transazione, quindi anche quella riga — il verbale veniva redatto e distrutto nello stesso istante, e NESSUNO dei dodici job che passano di qui poteva lasciare una riga rossa. Cosi'' apply_storicizza_weekly e'' morto ogni settimana per sei mesi con l''ultimo verdetto agli atti a «done». ⚠️ L''UPDATE in transazione resta e non e'' un doppione: copre il caso in cui il chiamante catturi l''eccezione senza propagarla, dove la transazione sopravvive. Nel caso normale muore e resta solo la riga fuori transazione — o l''una o l''altra, mai due. ⚠️ Il RAISE non si toglie: smettere di propagare farebbe risultare riuscito un lavoro che non lo e''. Il lavoro si annulla, il verbale no. ⚠️ fn_job_run_log_failure non solleva mai: se il canale dblink non c''e'' emette un WARNING e si torna al comportamento precedente.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Torna alla forma in cui il verbale del fallimento viene
              --   scritto e subito annullato: cioe' alla forma che ha tenuto
              --   nascosti sei mesi di corse morte.
              --   ⛔ Non si rigenera qui il corpo intero: si rilancia il
              --   changeSet precedente che lo definisce.
              SELECT 1;
