# ⭐ OGNI RIGA DEL PRESIDIO DEI JOB DICE LA SUA CAUSA, E QUINDI A CHI TOCCA.
#   Brief: brief-db-presidio-job-run-a-chi-tocca (§2, §3, §4.1)
#
# -- IL DIFETTO --------------------------------------------------------
#   Il presidio aveva un solo destinatario (dbops.presidi.chi_agisce =
#   SISTEMISTA) per guasti di natura diversa: un disco pieno e le regressioni
#   dello smoke notturno andavano alla stessa persona. Il meccanismo per
#   dividerli c'e' (colonna_variante + dbops.presidi_cause, come per
#   dbops.vw_processi_programmazione_da_guardare): mancava la causa.
#
# -- LA REGOLA (colonna `causa`, dbops.cause_fallimento) ---------------
#   1. corsa appesa (aperta da oltre un'ora): il processo e' morto senza
#      arrivare al gestore d'eccezione → AMBIENTE, qualunque processo;
#   2. SQLSTATE dell'ultimo rosso di classe 08/53/57/58 → AMBIENTE;
#   3. il codice dell'ultimo rosso dichiara la sua causa
#      (config.codici_errore.causa_fallimento, 20261016-37) → quella;
#   4. la causa del processo (dbops.processi.causa_fallimento, 20261016-36);
#   5. nessun processo a catalogo → PROGRAMMA.
#   ⭐ Mai NULL: nessuna riga finisce «senza indicazione di chi agisce».
#   ⭐ Dall'ULTIMO ROSSO (LATERAL), non dall'ultima corsa: per un intermittente
#   l'ultima corsa e' verde o in corso, e non ha errore (§3.3).
#   ⚠️ Per i command del backend lo SQLSTATE arriva solo dopo il giro BE del
#   §4.2: fino ad allora il ramo 2 vede solo i job del database.
#
# -- ⛔ E UN DIFETTO DEL MOTIVO, VISTO SCRIVENDO LA CAUSA ----------------
#   Il CASE del motivo diceva «presa e mai chiusa» di OGNI ultima corsa aperta,
#   anche di quella partita cinque minuti fa: una corsa in corso di un job con
#   rossi recenti (che entra nella vista per il ramo intermittente) era detta
#   morta. Ora «appesa» vale solo oltre l'ora, come nel WHERE, e la corsa in
#   corso ha il suo motivo: «in corso adesso, ma ha fallito di recente:
#   intermittente». Con la causa sarebbe diventata AMBIENTE a torto.
#
# ⚠️ Stesse colonne, stesso ordine, tre in coda (sqlstate, causa,
#   ultimo_rosso_job_run_id): CREATE OR REPLACE VIEW. Corpo dal doc
#   auto-generato (20261010-24). Nessuna reloption; il GRANT a zeroerp_app lo
#   conserva il CREATE OR REPLACE. La vista legge dbops.processi e
#   config.codici_errore coi privilegi del proprietario. Il COMMENT si riscrive
#   per intero: testo di prima + la revisione.
# ⚠️ I letterali AMBIENTE / PROGRAMMA sono rami del modello, non righe pescate:
#   che esistano nel vocabolario e in dbops.presidi_cause lo prova il pgTAP.
#
# Verifica: db/pgtap/maintenance/test-vw-job-run-da-guardare-causa-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261016-41-update-vw-job-run-da-guardare-causa-mctit.yaml

  - changeSet:
      id: 20261016-41-update-vw-job-run-da-guardare-causa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        maintenance.vw_job_run_da_guardare: colonne in coda sqlstate, causa (dbops.cause_fallimento,
        dall'ultimo rosso) e ultimo_rosso_job_run_id; «presa e mai chiusa» solo oltre l'ora.
        Brief: brief-db-presidio-job-run-a-chi-tocca.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                { schemaName: maintenance, viewName: vw_job_run_da_guardare }
            - columnExists:
                { schemaName: maintenance, tableName: job_run_log, columnName: sqlstate }
            - columnExists:
                { schemaName: dbops, tableName: processi, columnName: causa_fallimento }
            - columnExists:
                { schemaName: config, tableName: codici_errore, columnName: causa_fallimento }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW maintenance.vw_job_run_da_guardare AS
              WITH ultima AS (
                       SELECT DISTINCT ON (l.jobname) l.id,
                          l.jobname,
                          l.stepname,
                          l.processo_codice,
                          l.origine,
                          l.started_at,
                          l.ended_at,
                          l.ok,
                          l.error_code,
                          l.message,
                          l.error_detail,
                          l.run_uuid,
                          l.auth_user_id,
                          l.meta,
                          l.sqlstate
                         FROM maintenance.job_run_log l
                        WHERE (NOT l.saltata)
                        ORDER BY l.jobname, l.started_at DESC, l.id DESC
                      ), da_guardare AS (
                       SELECT u.id,
                          u.jobname,
                          u.stepname,
                          u.processo_codice,
                          u.origine,
                          u.started_at,
                          u.ended_at,
                          u.ok,
                          u.error_code,
                          u.message,
                          u.error_detail,
                          u.run_uuid,
                          u.sqlstate,
                          -- ⭐ Rev 2026-10-16: «appesa» e' un fatto solo oltre l'ora. Una
                          --   corsa aperta da meno e' una corsa IN CORSO: entra solo se il
                          --   job ha rossi recenti, ed e' allora un intermittente.
                          ((u.ok IS NULL) AND (u.ended_at IS NULL) AND (u.started_at < (now() - '01:00:00'::interval))) AS appesa
                         FROM ultima u
                        WHERE ((u.ok IS FALSE) OR (EXISTS ( SELECT 1
                                 FROM maintenance.job_run_log p
                                WHERE ((p.jobname = u.jobname) AND (p.ok IS FALSE) AND (p.started_at >= (now() - '7 days'::interval))))) OR ((u.ok IS NULL) AND (u.ended_at IS NULL) AND (u.started_at < (now() - '01:00:00'::interval))))
                      )
               SELECT g.jobname,
                  g.processo_codice,
                  g.origine,
                  g.started_at,
                  g.ended_at,
                      CASE
                          WHEN (g.ok IS FALSE) THEN 'l''ultima corsa e'' FALLITA'::text
                          WHEN g.appesa THEN 'presa e mai chiusa: il job e'' morto senza dire niente'::text
                          WHEN ((g.ok IS NULL) AND (g.ended_at IS NULL)) THEN 'in corso adesso, ma ha fallito di recente: intermittente'::text
                          ELSE 'ultima corsa OK, ma ha fallito di recente: intermittente'::text
                      END AS motivo,
                  g.error_code,
                  g.message,
                  g.error_detail,
                  (now() - g.started_at) AS da_quanto,
                  g.run_uuid,
                  g.id AS job_run_id,
                  ( SELECT count(*) AS count
                         FROM maintenance.job_run_log p
                        WHERE ((p.jobname = g.jobname) AND (p.ok IS FALSE) AND (p.started_at >= (g.started_at - '7 days'::interval)))) AS falliti_ultimi_7_giorni,
                  -- ⭐ Rev 2026-10-16 — tre colonne IN CODA (CREATE OR REPLACE VIEW).
                  g.sqlstate,
                  -- La causa (dbops.cause_fallimento), in quest'ordine:
                  --   1. corsa appesa: il processo e' morto senza arrivare al gestore
                  --      d'eccezione (kill, OOM, riavvio) → AMBIENTE, qualunque processo;
                  --   2. SQLSTATE dell'ultimo rosso di classe 08 (connessione), 53
                  --      (risorse), 57 (intervento dell'operatore), 58 (sistema) → AMBIENTE;
                  --   3. il codice dell'ultimo rosso dichiara la sua causa
                  --      (config.codici_errore.causa_fallimento) → quella;
                  --   4. la causa che dichiara il processo (dbops.processi.causa_fallimento);
                  --   5. nessun processo a catalogo → PROGRAMMA: un job che scrive nel
                  --      giornale senza codice di catalogo e' gia' una lacuna del programma.
                  -- ⭐ Dall'ULTIMO ROSSO, non dall'ultima corsa: per un intermittente
                  --   l'ultima corsa e' verde (o in corso) e non ha errore.
                      CASE
                          WHEN g.appesa THEN 'AMBIENTE'::text
                          WHEN ("left"(r.sqlstate, 2) = ANY (ARRAY['08'::text, '53'::text, '57'::text, '58'::text])) THEN 'AMBIENTE'::text
                          ELSE COALESCE(ce.causa_fallimento, pr.causa_fallimento, 'PROGRAMMA'::text)
                      END AS causa,
                  r.id AS ultimo_rosso_job_run_id
                 FROM da_guardare g
                   LEFT JOIN LATERAL ( SELECT p.id,
                          p.error_code,
                          p.sqlstate,
                          p.processo_codice
                         FROM maintenance.job_run_log p
                        WHERE ((p.jobname = g.jobname) AND (p.ok IS FALSE))
                        ORDER BY p.started_at DESC, p.id DESC
                       LIMIT 1) r ON true
                   LEFT JOIN config.codici_errore ce ON (ce.codice = r.error_code)
                   LEFT JOIN dbops.processi pr ON (pr.codice = COALESCE(r.processo_codice, g.processo_codice));

              COMMENT ON VIEW maintenance.vw_job_run_da_guardare IS
                  'I job che chiedono un occhio: quelli la cui ULTIMA corsa e'' FALLITA, e quelli la cui ultima corsa e'' rimasta APERTA da oltre un''ora (il processo e'' morto senza arrivare nemmeno al gestore d''eccezione). DEVE restare VUOTA. ⭐ Esiste perche'' dal changeSet 20260905-36 una corsa fallita lascia finalmente una riga rossa: prima il verbale veniva scritto e annullato dal RAISE, e nel giornale non e'' MAI esistito un fallimento di un job pgAgent (misurato: 0 rossi con origine PGAGENT contro 31 dei command). ⛔ Ma righe rosse in una tabella che nessuno interroga sono un silenzio nuovo, e questa vista e'' il posto dove guardare. ⭐ Si guarda solo l''ULTIMA corsa di ogni job, non tutti i rossi: cosi'' un job che ricomincia a funzionare ESCE DA SOLO, senza colonne «visto» ne'' finestre arbitrarie — e sync_auth_user_active, che il 2026-09-05 aveva 29 fallimenti in un giorno, occupa UNA riga invece di ventinove. ⭐ E un TERZO motivo prende l''intermittenza: ultima corsa verde ma almeno un rosso negli ultimi sette giorni — senza, un job che fallisce e passa sarebbe invisibile, ed e'' proprio il caso di sync_auth_user_active. Anche quel ramo si auto-pulisce: dopo sette giorni senza rossi il job esce da solo. ⛔ E non vede IL JOB CHE NON PARTE AFFATTO: per quello servirebbe che ogni processo dichiarasse ogni quanto deve girare, e dbops.processi non ce l''ha — stessa forma di R-12 da un altro lato, e resta scoperta. ⚠️ Niente RLS: un giro di manutenzione non appartiene a un''azienda. Chi la vede lo decide il backend con area funzionale e profilo, come per le viste di presidio sorelle. ⛔ Rev 2026-10-10: l''ultima corsa e'' l''ultima corsa VERA — le righe saltate (maintenance.job_run_log.saltata) sono escluse. Una corsa appesa tiene il lock, e ogni sveglia successiva scrive una skip piu'' recente: prima la skip diventava l''ultima corsa e il ramo «presa e mai chiusa» non scattava piu''. Brief: brief-db-corsa-saltata-non-e-una-corsa §2.2. ⭐ Rev 2026-10-16: tre colonne in coda. sqlstate (dell''ultima corsa, da job_run_log.sqlstate); causa (dbops.cause_fallimento), da cui dbops.presidi_cause dice a chi tocca la riga: corsa appesa o SQLSTATE dell''ultimo rosso di classe 08/53/57/58 → AMBIENTE; poi la causa del codice dell''ultimo rosso (config.codici_errore.causa_fallimento), poi quella del processo (dbops.processi.causa_fallimento), e PROGRAMMA senza processo a catalogo. Mai NULL. ultimo_rosso_job_run_id: la corsa da cui la causa e'' letta (per un intermittente l''ultima corsa e'' verde). ⛔ E il motivo «presa e mai chiusa» vale solo oltre l''ora: una corsa in corso da meno, con rossi recenti, era detta morta; ora e'' «in corso adesso, ma ha fallito di recente: intermittente». Prima il presidio aveva un solo destinatario (SISTEMISTA) per guasti di natura diversa. Brief: brief-db-presidio-job-run-a-chi-tocca.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo (corpo del 20261010-24):
              -- CREATE OR REPLACE VIEW non toglie colonne.
              SELECT 1;
