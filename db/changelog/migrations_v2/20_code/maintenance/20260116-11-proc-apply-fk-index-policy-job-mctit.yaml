databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/maintenance/20260116-11-proc-apply-fk-index-policy-job-mctit.yaml

  - changeSet:
      id: 20260116-11-proc-apply-fk-index-policy-job
      author: mctit
      runAlways: false
      validCheckSum:
        - ANY
      comment: >
        Crea la procedura job maintenance.proc_apply_fk_index_policy_job
        che chiama dbops.apply_fk_index_policy con logging e lock.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_apply_fk_index_policy_job(
                p_populate boolean DEFAULT false
              )
                LANGUAGE 'plpgsql'
              AS $BODY$
                BEGIN
                  PERFORM maintenance.fn_run_and_log(
                    p_jobname  := 'apply_fk_index_policy',
                    p_stepname := 'run_apply_fk_index_policy',
                    p_sql      := CASE
                                    WHEN p_populate THEN
                                      'SELECT dbops.fn_populate_fk_index_policy(); CALL dbops.apply_fk_index_policy();'
                                    ELSE
                                      'CALL dbops.apply_fk_index_policy();'
                                  END,
                    p_lock_key := hashtext('apply_fk_index_policy')
                  );
                END;
              $BODY$;

              COMMENT ON PROCEDURE maintenance.proc_apply_fk_index_policy_job()
                IS 'Job wrapper per chiamare apply_fk_index_policy con logging e lock.';
