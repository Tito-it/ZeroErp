# ------------------------------------------------------------
# IL SYNC DEL SET DI STORICIZZAZIONE POTA ANCHE LA COLONNA RITIRATA
#   maintenance.proc_sync_storico_set_storicizza()
#
# -- PERCHE' --------------------------------------------------------------
#   Il sync potava solo le righe derivate il cui nome non risolve piu' a
#   niente. Una tabella viva che RITIRA la colonna storicizza (DROP COLUMN:
#   20260501-08 sulla stampa, 20261115-91 sui quattro vocabolari di
#   documenti) restava nel set, e maintenance.fn_apply_storicizza_defaults
#   contava uno scarto per tabella a ogni corsa: apply_storicizza_weekly
#   chiudeva ok = false, e il 20260926-10 di ci_apply fermava il migrate
#   (dbdev, 2026-11-16, dopo l'apply del giro dei vocabolari).
#   E' la stessa mezza sincronizzazione di prima, su una causa che il sync
#   non contava: la derivazione non produce piu' la riga perche' la colonna
#   non c'e'. Si pota la riga derivata la cui tabella non ha piu' la colonna,
#   con la tabella sparita come caso particolare.
#   Restano fuori dalla potatura, come prima: la tabella viva che ha perso il
#   solo DEFAULT (la ripara l'apply) e ogni riga manuale (la segnala l'apply).
#
#   Corpo dal catalogo (doc auto-generata, 2026-11-16); cambia solo il DELETE
#   e il suo commento, e il COMMENT della procedura.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261115-99-update-proc-sync-storico-set-storicizza-colonna-ritirata-mctit.yaml

  - changeSet:
      id: 20261115-99-update-proc-sync-storico-set-storicizza-colonna-ritirata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il sync del set di storicizzazione pota anche le righe derivate la cui tabella non ha piu'
        la colonna storicizza.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_sync_storico_set_storicizza()
               LANGUAGE plpgsql
              AS $procedure$
              DECLARE
                  v_aggiunte integer := 0;
                  v_potate   integer := 0;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Tenere `config.storico_set_storicizza` allineato alla sua
                  --   DERIVAZIONE: le tabelle ordinarie che hanno la colonna
                  --   `storicizza` con DEFAULT true.
                  --
                  -- ⭐ Una sincronizzazione ha due meta'. Prima ne aveva una:
                  --   aggiungeva e non toglieva mai, quindi una tabella ritirata
                  --   lasciava una riga che puntava a niente — e il consumatore
                  --   (apply_storicizza_weekly) ci moriva sopra, in silenzio.
                  -- =========================================================

                  -- ── 1. Aggiungi cio' che la derivazione produce ──────────
                  -- ⚠️ Nome QUALIFICATO esplicitamente: `regclass::text` lo
                  --   ometterebbe per gli schemi nel search_path del chiamante,
                  --   e una chiave che dipende dal search_path e' una chiave che
                  --   un giorno non ritrova la propria riga.
                  INSERT INTO config.storico_set_storicizza (table_name, insert_manuale)
                  SELECT n.nspname || '.' || c.relname, false
                    FROM pg_attribute a
                    JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    JOIN pg_attrdef ad ON ad.adrelid = a.attrelid AND ad.adnum = a.attnum
                   WHERE a.attname = 'storicizza'
                     AND NOT a.attisdropped
                     -- Si confronta il TESTO dell'espressione, senza cast:
                     -- forma invariata dalla versione precedente.
                     AND pg_get_expr(ad.adbin, ad.adrelid) = 'true'
                  ON CONFLICT (table_name) DO NOTHING;

                  GET DIAGNOSTICS v_aggiunte = ROW_COUNT;

                  -- ── 2. La meta' che mancava: pota cio' che non ha piu' un
                  --      referente ─────────────────────────────────────────
                  -- ⛔ SOLO le righe derivate, e SOLO quelle la cui tabella non
                  --   ha piu' la colonna `storicizza`: la tabella e' sparita, o
                  --   ha ritirato la colonna. Una tabella che ha la colonna ma ha
                  --   perso il DEFAULT non si pota: e' il caso transitorio che
                  --   `apply_storicizza_weekly` ripara, e potarlo qui spegnerebbe
                  --   la storicizzazione di una tabella viva.
                  -- ⛔ `insert_manuale = true` non si tocca mai: e' una
                  --   decisione di una persona, e se il suo bersaglio sparisce
                  --   va detto a qualcuno, non cancellato di nascosto.
                  DELETE FROM config.storico_set_storicizza s
                   WHERE NOT s.insert_manuale
                     AND NOT EXISTS (
                         SELECT 1
                           FROM pg_attribute a
                          WHERE a.attrelid = to_regclass(s.table_name)
                            AND a.attname = 'storicizza'
                            AND NOT a.attisdropped);

                  GET DIAGNOSTICS v_potate = ROW_COUNT;

                  -- ℹ️ Il riepilogo e' un NOTICE per chi la lancia a mano: va al
                  --   client, e con le impostazioni di default non arriva al log del
                  --   server. Lanciata dal job, la traccia e' la riga di
                  --   maintenance.job_run_log.
                  RAISE NOTICE 'storico_set_storicizza: % aggiunte, % potate',
                               v_aggiunte, v_potate;
              END
              $procedure$;

              COMMENT ON PROCEDURE maintenance.proc_sync_storico_set_storicizza()
              IS 'Tiene config.storico_set_storicizza allineato alla sua derivazione, le tabelle ordinarie con la colonna storicizza a DEFAULT true: aggiunge cio'' che la derivazione produce, come righe derivate (insert_manuale false), e pota le righe derivate la cui tabella non ha piu'' la colonna storicizza, perche'' e'' sparita o l''ha ritirata. Una tabella che ha la colonna ma ha perso il DEFAULT non si pota: e'' il caso transitorio che maintenance.fn_apply_storicizza_defaults ripara. Le righe manuali (insert_manuale true) non si toccano mai: se il loro bersaglio sparisce, lo segnala il consumatore. La chiave si scrive schema-qualificata in modo esplicito, perche'' regclass::text omette lo schema che sta nel search_path del chiamante. Non tocca lo schema delle tabelle. Il riepilogo (aggiunte, potate) e'' un RAISE NOTICE: va al client che l''ha lanciata e, con le impostazioni di registrazione di default, non arriva al log del server. Lanciata dal job, la traccia e'' la riga di maintenance.job_run_log; se fallisce, il verbale lo scrive fuori transazione maintenance.fn_job_run_log_failure.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima (potatura del solo nome che non risolve) lo rimette
              -- il changeSet 20261103-68, rilanciato.
              SELECT 1;
