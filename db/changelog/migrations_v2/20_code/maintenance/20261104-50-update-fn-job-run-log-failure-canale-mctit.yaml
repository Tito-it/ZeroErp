# maintenance.fn_job_run_log_failure: il canale dal building block.
#   Brief: brief-db-revisione-dbops, D26 (giro 1, blocco 1b).
#
# Base: 20_code/maintenance/20261103-66, verificato uguale al vivo.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────────
#   1. ⛔ D26: la funzione IGNORAVA l'interruttore myapp.log_with_dblink.
#      fn_ensure_logconn lo rispettava e non apriva logconn, ma il ripiego
#      sulla stringa scriveva lo stesso. Ora il canale lo dice
#      script.fn_canale_log_stringa (20261104-46), PRIMA di aprire qualunque
#      cosa: spento o non configurato e' il WARNING che c'era gia' per
#      «nessun canale». La precedenza fra le due GUC sta nel building block.
#      Se logconn e' gia' aperta si usa quella, come prima.
#   2. Firma con %TYPE dalle colonne di maintenance.job_run_log che i
#      parametri scrivono: i tipi risolti sono quelli di oggi (origine e'
#      varchar(16), e in firma il modificatore cade: character varying), la
#      firma non cambia e il CREATE OR REPLACE sostituisce. Il default di
#      p_sqlstate resta.
#      Tipi espliciti, con la ragione: v_sql text (SQL dinamico), v_dsn text
#      (il tipo di current_setting), v_open boolean (flag locale).
#   Il resto e' il corpo del -66.
#
# ⚠️ LA FORMA. Funzione di postgres: proprieta' in prestito via
#   dbops.fn_sync_functions_owner, verificata, restituita (forma di 20261103-05).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261104-50-update-fn-job-run-log-failure-canale-mctit.yaml

  - changeSet:
      id: 20261104-50-update-fn-job-run-log-failure-canale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        maintenance.fn_job_run_log_failure chiede il canale a script.fn_canale_log_stringa
        prima di aprire qualunque cosa: con l'interruttore 'off' non scrive piu' fuori
        transazione (D26). Funzione di postgres: proprieta' in prestito.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_canale_log_stringa';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'maintenance' AND p.proname = 'fn_job_run_log_failure';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- 1) Presa in prestito della proprieta' (forma di 20261103-05).
              -- ==========================================================
              UPDATE dbops.sec_functions_owner
                 SET required_owner = current_user
               WHERE schema_name   = 'maintenance'
                 AND function_name = 'fn_job_run_log_failure';

              SELECT dbops.fn_sync_functions_owner();

              DO $guard$
              DECLARE
                v_owner text;
              BEGIN
                -- fn_sync_functions_owner non solleva mai: degrada a WARNING.
                SELECT pg_get_userbyid(p.proowner)
                  INTO v_owner
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'maintenance'
                   AND p.proname = 'fn_job_run_log_failure';

                IF v_owner IS DISTINCT FROM current_user THEN
                  RAISE EXCEPTION
                    'fn_job_run_log_failure e'' di %, non di % : il prestito della proprieta'' via dbops.fn_sync_functions_owner() non e'' riuscito. Verificare che dbops.fn_sync_functions_owner sia SECURITY DEFINER e posseduta da postgres, e che esista la voce in dbops.sec_functions_owner.',
                    coalesce(v_owner, '(funzione assente)'), current_user;
                END IF;
              END
              $guard$;

              -- ==========================================================
              -- 2) La funzione.
              -- ==========================================================
              CREATE OR REPLACE FUNCTION maintenance.fn_job_run_log_failure(
                  p_jobname         maintenance.job_run_log.jobname%TYPE,
                  p_stepname        maintenance.job_run_log.stepname%TYPE,
                  p_started_at      maintenance.job_run_log.started_at%TYPE,
                  p_run_uuid        maintenance.job_run_log.run_uuid%TYPE,
                  p_origine         maintenance.job_run_log.origine%TYPE,
                  p_processo_codice maintenance.job_run_log.processo_codice%TYPE,
                  p_auth_user_id    maintenance.job_run_log.auth_user_id%TYPE,
                  p_message         maintenance.job_run_log.message%TYPE,
                  p_error_code      maintenance.job_run_log.error_code%TYPE,
                  p_error_detail    maintenance.job_run_log.error_detail%TYPE,
                  p_sqlstate        maintenance.job_run_log.sqlstate%TYPE DEFAULT NULL)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  -- text: SQL dinamico
                  v_sql  text;
                  -- text: il tipo di current_setting, nessuna colonna lo porta
                  v_dsn  text;
                  v_open boolean := false;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere il verbale di un run FALLITO dove il rollback
                  --   non arriva: su una connessione separata.
                  --
                  -- ⛔ Chi chiama e' un gestore d'eccezione: qualunque cosa
                  --   vada storta qui si risolve in un WARNING. Non si fa
                  --   fallire un lavoro perche' non si e' riusciti a scrivere
                  --   una nota su di lui.
                  -- =========================================================

                  -- ⚠️ L'INSERT lo costruisce QUESTA funzione, con %L su ogni
                  --   valore. Non esiste un parametro che permetta di farle
                  --   scrivere qualcos'altro: e' cio' che la distingue da una
                  --   primitiva di esecuzione SQL arbitraria in SECURITY
                  --   DEFINER di un superuser.
                  v_sql := format(
                      'INSERT INTO maintenance.job_run_log '
                      '(jobname, stepname, started_at, ended_at, ok, message, '
                      ' error_code, error_detail, agent_host, run_uuid, origine, '
                      ' meta, processo_codice, auth_user_id, ruolo_sessione, sqlstate) '
                      'VALUES (%L, %L, %L, now(), false, %L, %L, %L, %L, %L, %L, '
                      '        %L::jsonb, %L, %s, %L, %L)',
                      p_jobname, p_stepname, p_started_at,
                      p_message, p_error_code, p_error_detail,
                      -- ⭐ agent_host = da dove e' partita la corsa, come per le righe
                      --   che nascono col default: inet_client_addr() letto QUI, nella
                      --   sessione del job, non in quella del canale dblink.
                      --   Brief: brief-db-revisione-maintenance M17.
                      inet_client_addr()::text,
                      p_run_uuid, p_origine,
                      -- ⭐ La riga dice di se stessa come e' arrivata: senza,
                      --   sembrerebbe una riga normale scritta da un giro che
                      --   invece e' stato annullato.
                      jsonb_build_object(
                          'scritta_fuori_transazione', true,
                          'motivo', 'il RAISE avrebbe annullato il verbale insieme al lavoro'
                      )::text,
                      p_processo_codice,
                      COALESCE(p_auth_user_id::text, 'NULL'),
                      -- ⭐ Il ruolo che si e' COLLEGATO per la corsa (D-5). Si legge
                      --   QUI, nella sessione del job: la INSERT gira via dblink in
                      --   un'altra sessione, dove session_user sarebbe il canale di
                      --   log. Dentro questa funzione DEFINER session_user resta il
                      --   chiamante.
                      session_user,
                      -- ⭐ Lo SQLSTATE, separato da error_code (che e' «il codice piu'
                      --   preciso che si ha»). NULL dai chiamanti di prima: il
                      --   parametro e' in coda, con default.
                      --   brief-db-presidio-job-run-a-chi-tocca §4.4.
                      p_sqlstate);

                  BEGIN
                      -- 0. il canale: acceso, e con quale stringa, lo dice il
                      --    building block, prima di aprire qualunque cosa
                      v_dsn := script.fn_canale_log_stringa();

                      IF v_dsn IS NULL THEN
                          -- nessun canale: si dichiara, non si finge
                          RAISE WARNING
                              'maintenance.fn_job_run_log_failure: canale fuori '
                              'transazione spento (myapp.log_with_dblink = off) o non '
                              'configurato, il run fallito di % non lascia '
                              'traccia nel giornale', p_jobname;
                          RETURN;
                      END IF;

                      -- 1. la connessione nominata, gestita dal canale esistente
                      PERFORM script.fn_ensure_logconn();
                      v_open := 'logconn' = ANY (
                          COALESCE(public.dblink_get_connections(), ARRAY[]::text[]));

                      IF v_open THEN
                          PERFORM public.dblink_exec('logconn', v_sql, true);
                          RETURN;
                      END IF;

                      -- 2. altrimenti la stringa diretta, come fa fn_log_error_only
                      PERFORM public.dblink_exec(v_dsn, v_sql, true);
                  EXCEPTION WHEN OTHERS THEN
                      RAISE WARNING
                          'maintenance.fn_job_run_log_failure: verbale non scritto '
                          'per % (%)', p_jobname, SQLERRM;
                  END;
              END
              $function$;

              COMMENT ON FUNCTION maintenance.fn_job_run_log_failure(
                  maintenance.job_run_log.jobname%TYPE,
                  maintenance.job_run_log.stepname%TYPE,
                  maintenance.job_run_log.started_at%TYPE,
                  maintenance.job_run_log.run_uuid%TYPE,
                  maintenance.job_run_log.origine%TYPE,
                  maintenance.job_run_log.processo_codice%TYPE,
                  maintenance.job_run_log.auth_user_id%TYPE,
                  maintenance.job_run_log.message%TYPE,
                  maintenance.job_run_log.error_code%TYPE,
                  maintenance.job_run_log.error_detail%TYPE,
                  maintenance.job_run_log.sqlstate%TYPE)
              IS 'Scrive la riga di una corsa FALLITA in maintenance.job_run_log su una connessione separata (dblink, il canale logconn di script.fn_log_error_only), cosi'' che sopravviva al RAISE che annulla la transazione del lavoro. La chiama maintenance.fn_run_and_log dal suo gestore d''eccezione, con le coordinate della corsa (run_uuid, started_at, origine), il processo e l''errore (error_code e sqlstate). Costruisce da sola il proprio INSERT con format(%L): non e'' una primitiva di esecuzione SQL arbitraria. ruolo_sessione (session_user) e agent_host (inet_client_addr()) si leggono nella sessione del job, non in quella del canale: agent_host dice da dove e'' partita la corsa, come per le righe che nascono col default della colonna. Se il canale e'' acceso, e con quale stringa, lo dice script.fn_canale_log_stringa: spento o non configurato, la corsa fallita non lascia traccia nel giornale e lo dice con un WARNING. Ogni via d''uscita e'' un WARNING, mai un errore: non si fa fallire due volte un lavoro gia'' fallito. SECURITY DEFINER di postgres, perche'' dblink rifiuta a un non-superuser una connessione senza password: la proprieta'' la allinea dbops.fn_sync_functions_owner() da dbops.sec_functions_owner.';

              -- ==========================================================
              -- 3) Restituzione della proprieta' a postgres.
              -- ==========================================================
              UPDATE dbops.sec_functions_owner
                 SET required_owner = 'postgres'
               WHERE schema_name   = 'maintenance'
                 AND function_name = 'fn_job_run_log_failure';

              SELECT dbops.fn_sync_functions_owner();
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il verso di ritiro e' un changeSet nuovo dal corpo di 20261103-66.
              SELECT 1;
