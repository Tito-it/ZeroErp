# DA ZERO LA FIRMA CON p_sqlstate C'E' PRIMA DEL 20261103-66
#   maintenance.fn_job_run_log_failure
#   Origine: errore di Tid sullo scratch zeroerp_ruoli, 2026-11-05 (migrate da
#   zero fermo al 20261104-50).
#
# ── ⛔ IL GUASTO (solo da zero) ─────────────────────────────────────
#   La firma a 11 argomenti (p_sqlstate) la portava il 20261016-39, che ha
#   context: provision e sta in changelog-provision-post.yaml: da zero gira
#   DOPO il migrate principale. Il 20261103-66 e il 20261104-50, nella forma
#   «proprieta' in prestito», girano nel migrate principale e danno la firma
#   per fatta: da zero il CREATE OR REPLACE del -66 trova la firma a 10 e crea
#   un SECONDO overload, e la preCondition del -50 (una sola funzione) si
#   ferma con 2. Su dbdev non si vede: il provision-post era passato da tempo.
#
# ── ⭐ LA CURA ──────────────────────────────────────────────────────
#   Questo changeSet sta in uno slot libero PRIMA del -66 (verificato
#   2026-11-05: file, databasechangelog di dbdev e scratch, storia git) e fa,
#   SOLO se la firma a 11 manca, cio' che faceva il -39: DROP della firma a 10
#   e CREATE di quella a 11 col corpo del -39. Il -66 ne riscrive subito il
#   corpo, e il -50 trova una funzione sola.
#   · su dbdev (e ovunque il -39 sia gia' passato) la firma a 11 c'e': il
#     blocco non fa niente. Niente preCondition ne' MARK_RAN: l'idempotenza
#     la da' il blocco, che legge lo stato vero;
#   · da zero la funzione e' ancora del migratore (la voce di
#     dbops.sec_functions_owner arriva con 80_data, l'hardening col
#     provision-post): il blocco lo verifica e, se non e' cosi', si ferma con
#     un messaggio, invece di fallire a meta';
#   · nessun GRANT (EXECUTE a PUBLIC, come nel -39) e nessun COMMENT: lo
#     scrive il -66.
#   Il -03 e il -39 escono da changelog-provision-post.yaml nello stesso giro:
#   da zero, rigirati dopo il migrate, ricreerebbero la firma a 10 (-03) e
#   riporterebbero il corpo del -39 sopra quello del -66 e del -50 (D26).
#   Sui database dove sono gia' passati restano registrati: nulla cambia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20261103-29-fix-fn-job-run-log-failure-firma-sqlstate-da-zero-mctit.yaml

  - changeSet:
      id: 20261103-29-fix-fn-job-run-log-failure-firma-sqlstate-da-zero
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        maintenance.fn_job_run_log_failure: da zero porta la firma a 11 argomenti (p_sqlstate) PRIMA del
        20261103-66, solo dove manca (DROP della firma a 10 + CREATE col corpo del 20261016-39). Su dbdev non
        fa niente. Errore di Tid sullo scratch zeroerp_ruoli, 2026-11-05.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $fix$
              DECLARE
                v_owner text;
              BEGIN
                IF to_regprocedure('maintenance.fn_job_run_log_failure(text, text, timestamp with time zone, uuid, character varying, text, integer, text, text, text, text)') IS NOT NULL THEN
                  RAISE NOTICE 'fn_job_run_log_failure: firma con p_sqlstate gia'' presente, niente da fare';
                  RETURN;
                END IF;

                SELECT pg_get_userbyid(p.proowner) INTO v_owner
                  FROM pg_proc p
                 WHERE p.oid = to_regprocedure('maintenance.fn_job_run_log_failure(text, text, timestamp with time zone, uuid, character varying, text, integer, text, text, text)');
                IF v_owner IS NOT NULL AND v_owner IS DISTINCT FROM current_user THEN
                  RAISE EXCEPTION
                    'fn_job_run_log_failure a 10 argomenti e'' di %, non di %: qui serve il percorso da zero, dove la funzione e'' ancora del migratore',
                    v_owner, current_user;
                END IF;

                DROP FUNCTION IF EXISTS maintenance.fn_job_run_log_failure(text, text, timestamp with time zone, uuid, character varying, text, integer, text, text, text);

                -- Corpo del 20261016-39, testuale.
                EXECUTE $ddl$
                CREATE OR REPLACE FUNCTION maintenance.fn_job_run_log_failure(p_jobname text, p_stepname text, p_started_at timestamp with time zone, p_run_uuid uuid, p_origine character varying, p_processo_codice text, p_auth_user_id integer, p_message text, p_error_code text, p_error_detail text, p_sqlstate text DEFAULT NULL::text)
                 RETURNS void
                 LANGUAGE plpgsql
                 SECURITY DEFINER
                 SET search_path TO 'pg_catalog', 'public', 'pg_temp'
                AS $function$
                DECLARE
                    v_sql  text;
                    v_dsn  text;
                    v_open boolean := false;
                BEGIN
                    -- =========================================================
                    -- Scopo:
                    --   Scrivere il verbale di un run FALLITO dove il rollback
                    --   non arriva: su una connessione separata.
                    --
                    -- ⛔ Chi chiama e' un gestore d'eccezione: qualunque cosa
                    --   vada storta qui si risolve in un WARNING. Non si fa
                    --   fallire un lavoro perche' non si e' riusciti a scrivere
                    --   una nota su di lui.
                    -- =========================================================

                    -- ⚠️ L'INSERT lo costruisce QUESTA funzione, con %L su ogni
                    --   valore. Non esiste un parametro che permetta di farle
                    --   scrivere qualcos'altro: e' cio' che la distingue da una
                    --   primitiva di esecuzione SQL arbitraria in SECURITY
                    --   DEFINER di un superuser.
                    v_sql := format(
                        'INSERT INTO maintenance.job_run_log '
                        '(jobname, stepname, started_at, ended_at, ok, message, '
                        ' error_code, error_detail, agent_host, run_uuid, origine, '
                        ' meta, processo_codice, auth_user_id, ruolo_sessione, sqlstate) '
                        'VALUES (%L, %L, %L, now(), false, %L, %L, %L, %L, %L, %L, '
                        '        %L::jsonb, %L, %s, %L, %L)',
                        p_jobname, p_stepname, p_started_at,
                        p_message, p_error_code, p_error_detail,
                        current_setting('cluster_name', true),
                        p_run_uuid, p_origine,
                        -- ⭐ La riga dice di se stessa come e' arrivata: senza,
                        --   sembrerebbe una riga normale scritta da un giro che
                        --   invece e' stato annullato.
                        jsonb_build_object(
                            'scritta_fuori_transazione', true,
                            'motivo', 'il RAISE avrebbe annullato il verbale insieme al lavoro'
                        )::text,
                        p_processo_codice,
                        COALESCE(p_auth_user_id::text, 'NULL'),
                        -- ⭐ Rev 2026-10-15 (D-5): il ruolo che si e' COLLEGATO per la corsa.
                        --   Si legge QUI, nella sessione del job: la INSERT gira via dblink
                        --   in un'altra sessione, dove session_user sarebbe il canale di log.
                        --   Dentro questa funzione DEFINER session_user resta il chiamante.
                        session_user,
                        -- ⭐ Rev 2026-10-16: lo SQLSTATE, separato da error_code (che e'
                        --   «il codice piu' preciso che si ha»). NULL dai chiamanti di
                        --   prima: il parametro e' in coda, con default.
                        --   brief-db-presidio-job-run-a-chi-tocca §4.4.
                        p_sqlstate);

                    BEGIN
                        -- 1. la connessione nominata, gestita dal canale esistente
                        PERFORM script.fn_ensure_logconn();
                        v_open := 'logconn' = ANY (
                            COALESCE(public.dblink_get_connections(), ARRAY[]::text[]));

                        IF v_open THEN
                            PERFORM public.dblink_exec('logconn', v_sql, true);
                            RETURN;
                        END IF;

                        -- 2. altrimenti la DSN diretta, come fa fn_log_error_only
                        v_dsn := COALESCE(
                            NULLIF(current_setting('myapp.logconn', true), ''),
                            NULLIF(current_setting('myapp.dblink_log_connection', true), ''));

                        IF v_dsn IS NOT NULL THEN
                            PERFORM public.dblink_exec(v_dsn, v_sql, true);
                            RETURN;
                        END IF;

                        -- 3. nessun canale: si dichiara, non si finge
                        RAISE WARNING
                            'maintenance.fn_job_run_log_failure: nessun canale fuori '
                            'transazione configurato, il run fallito di % non lascia '
                            'traccia nel giornale', p_jobname;
                    EXCEPTION WHEN OTHERS THEN
                        RAISE WARNING
                            'maintenance.fn_job_run_log_failure: verbale non scritto '
                            'per % (%)', p_jobname, SQLERRM;
                    END;
                END
                $function$
                $ddl$;
                RAISE NOTICE 'fn_job_run_log_failure: firma a 10 sostituita da quella con p_sqlstate (corpo del 20261016-39)';
              END
              $fix$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Nessun verso di ritiro: il changeSet porta solo da zero la firma che
              -- il 20261016-39 portava gia' su ogni altro database.
              SELECT 1;
