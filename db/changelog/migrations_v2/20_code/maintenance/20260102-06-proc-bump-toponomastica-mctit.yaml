# Liquibase changelog per Zero ERP
# Guard con GUC + procedura maintenance per toponomastica
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/maintenance/20260102-06-proc-bump-toponomastica-mctit.yaml

  - changeSet:
      id: 20260102-06-proc-bump-toponomastica-mctit.yaml
      author: mctit
      comment: >
        La procedura maintenance.proc_bump_toponomastica consente di aggiornare
          in modo controllato la tabella config.toponomastica, bypassando i vincoli
          imposti dal trigger config.trgfn_toponomastica_protect_update.
          Prima di eseguire l'UPDATE, la procedura abilita la manutenzione
          controllata tramite l'impostazione della GUC 'zeroerp.maintenance_toponomastica'
          a 'on' per la sessione corrente.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE PROCEDURE maintenance.proc_bump_toponomastica(
                p_toponomastica_id integer,
                p_descrizione text
              )
              LANGUAGE plpgsql
              AS $procedure$
              BEGIN
                -- Abilita manutenzione solo per la sessione corrente
                PERFORM set_config('zeroerp.maintenance_toponomastica', 'on', true);

                UPDATE config.toponomastica
                SET descrizione = p_descrizione
                WHERE id = p_toponomastica_id;
              END;
              $procedure$;

              comment on procedure maintenance.proc_bump_toponomastica
                is 'Procedura di riallineamento toponomastica per cambio descrizione.';
