# ⭐ IL DIFETTO DI MODELLO: una sincronizzazione che sa solo AGGIUNGERE.
#   Brief: brief-db-storicizzazione-bersagli-spariti.md §2.2 (R-12)
#
# `config.storico_set_storicizza` e' un insieme **derivato**: dice quali tabelle
# hanno la colonna `storicizza` con `DEFAULT true`, e lo popola questa
# procedura. ⛔ Ma la procedura faceva solo `INSERT … ON CONFLICT DO NOTHING`:
# il set si popolava da solo e **non si potava da solo**.
#
# ⇒ Quando una tabella viene ritirata, la sua riga resta. E resta a puntare a
#   niente, per sempre, finche' qualcuno non la nota.
#
# ── ⭐ PERCHE' NON E' UNA `DELETE` DI TRE RIGHE ─────────────────────
#   Al 2026-09-05 le righe morte sono tre — e per colpa loro
#   `apply_storicizza_weekly` muore ogni settimana **da sei mesi**.
#   ⛔ Toglierle a mano sarebbe il tampone: la prossima tabella ritirata rifa'
#   lo stesso guasto, e lo rifa' in silenzio per altri sei mesi.
#   ⇒ Si aggiunge la meta' che mancava al meccanismo. Le tre righe se ne vanno
#     **come conseguenza**, non come intervento.
#
# ── ⛔ SI POTA UNA COSA SOLA, e la distinzione e' il cuore ──────────
#   Una riga non e' piu' prodotta dalla derivazione per DUE motivi diversi:
#
#     (a) la tabella NON ESISTE PIU'   → la riga non ha un referente: non puo'
#                                        essere vera in nessun senso. Si pota.
#     (b) la tabella esiste ma il DEFAULT non c'e' piu' → ⛔ NON si pota.
#
#   ⚠️ Il caso (b) e' **transitorio per costruzione**: il `DEFAULT` lo rimette
#   proprio `apply_storicizza_weekly`, che gira su un'altra schedulazione. Fra
#   un giro e l'altro il default puo' mancare, e potare li' vorrebbe dire
#   **spegnere la storicizzazione di una tabella viva** perche' un giro non e'
#   ancora passato. Le due meta' si combatterebbero.
#
# ── ⛔ E `insert_manuale = true` NON SI TOCCA MAI ───────────────────
#   Quelle righe le ha messe una persona (o un changeSet: `20260804-16`,
#   `20260805-14`). Sono una **decisione**, non una derivazione: se il loro
#   bersaglio sparisce, sparisce una decisione — e va detto a qualcuno, non
#   cancellato di nascosto.
#   ⚠️ Verificato prima di scrivere: le tre righe morte sono tutte
#   `insert_manuale = false`, e l'unica riga manuale del set
#   (`config.user_emittente_attivo`) esiste. Il criterio non tocca niente
#   d'altro.
#
# ── ⚠️ IL NOME SI SCRIVE QUALIFICATO, e prima non era garantito ─────
#   La forma vecchia salvava `attrelid::regclass::text`, che **omette lo schema**
#   se quello schema e' nel `search_path` di chi lancia il job. Una chiave che
#   cambia con il `search_path` del chiamante e' una chiave che un giorno non
#   ritrova la propria riga — e la potatura, che risolve il nome, sarebbe la
#   prima a inciampare.
#   ⇒ Si scrive `schema.tabella` esplicitamente. ⚠️ Misurato: tutte le 104 righe
#   presenti sono gia' qualificate, quindi nessun doppione.
#
# ⭐ LA PRIMA POTATURA LA FA QUESTO CHANGESET, chiamando la procedura. Non c'e'
# una `DELETE` scritta a mano: il changeSet installa il meccanismo e **lo fa
# girare una volta**, cosi' la riparazione e' lo stesso gesto della correzione.
#
# Verifica: db/pgtap/maintenance/test-storicizza-set-potatura.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/maintenance/20260905-28-update-proc-sync-storico-set-storicizza-potatura-mctit.yaml

  - changeSet:
      id: 20260905-28-update-proc-sync-storico-set-storicizza-potatura
      author: mctit
      failOnError: true
      comment: >
        maintenance.proc_sync_storico_set_storicizza diventa una sincronizzazione
        vera: aggiunge cio' che la derivazione produce E pota le righe derivate
        che non hanno piu' un referente. Prima sapeva solo aggiungere, e per
        questo apply_storicizza_weekly e' morto ogni settimana per sei mesi
        (R-12). Le righe manuali non si toccano mai.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: storico_set_storicizza }
            - columnExists:
                schemaName: config
                tableName: storico_set_storicizza
                columnName: insert_manuale
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_sync_storico_set_storicizza()
               LANGUAGE plpgsql
              AS $procedure$
              DECLARE
                  v_aggiunte integer := 0;
                  v_potate   integer := 0;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Tenere `config.storico_set_storicizza` allineato alla sua
                  --   DERIVAZIONE: le tabelle ordinarie che hanno la colonna
                  --   `storicizza` con DEFAULT true.
                  --
                  -- ⭐ Una sincronizzazione ha due meta'. Prima ne aveva una:
                  --   aggiungeva e non toglieva mai, quindi una tabella ritirata
                  --   lasciava una riga che puntava a niente — e il consumatore
                  --   (apply_storicizza_weekly) ci moriva sopra, in silenzio.
                  -- =========================================================

                  -- ── 1. Aggiungi cio' che la derivazione produce ──────────
                  -- ⚠️ Nome QUALIFICATO esplicitamente: `regclass::text` lo
                  --   ometterebbe per gli schemi nel search_path del chiamante,
                  --   e una chiave che dipende dal search_path e' una chiave che
                  --   un giorno non ritrova la propria riga.
                  INSERT INTO config.storico_set_storicizza (table_name, insert_manuale)
                  SELECT n.nspname || '.' || c.relname, false
                    FROM pg_attribute a
                    JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    JOIN pg_attrdef ad ON ad.adrelid = a.attrelid AND ad.adnum = a.attnum
                   WHERE a.attname = 'storicizza'
                     AND NOT a.attisdropped
                     -- Si confronta il TESTO dell'espressione, senza cast:
                     -- forma invariata dalla versione precedente.
                     AND pg_get_expr(ad.adbin, ad.adrelid) = 'true'
                  ON CONFLICT (table_name) DO NOTHING;

                  GET DIAGNOSTICS v_aggiunte = ROW_COUNT;

                  -- ── 2. La meta' che mancava: pota cio' che non ha piu' un
                  --      referente ─────────────────────────────────────────
                  -- ⛔ SOLO le righe derivate, e SOLO quelle il cui nome non
                  --   risolve piu' a nessun oggetto. Una tabella che esiste ma
                  --   ha perso il DEFAULT non si pota: e' il caso transitorio
                  --   che `apply_storicizza_weekly` ripara, e potarlo qui
                  --   spegnerebbe la storicizzazione di una tabella viva.
                  -- ⛔ `insert_manuale = true` non si tocca mai: e' una
                  --   decisione di una persona, e se il suo bersaglio sparisce
                  --   va detto a qualcuno, non cancellato di nascosto.
                  DELETE FROM config.storico_set_storicizza s
                   WHERE NOT s.insert_manuale
                     AND to_regclass(s.table_name) IS NULL;

                  GET DIAGNOSTICS v_potate = ROW_COUNT;

                  -- ⚠️ Il riepilogo finisce nel log del server: chi chiama e' un
                  --   job pgAgent e non ha dove leggere un valore di ritorno.
                  RAISE NOTICE 'storico_set_storicizza: % aggiunte, % potate',
                               v_aggiunte, v_potate;
              END
              $procedure$;

              COMMENT ON PROCEDURE maintenance.proc_sync_storico_set_storicizza()
              IS 'Tiene config.storico_set_storicizza allineato alla sua DERIVAZIONE (le tabelle ordinarie con la colonna `storicizza` a DEFAULT true): aggiunge cio'' che la derivazione produce e POTA le righe derivate che non hanno piu'' un referente. ⭐ La potatura e'' la meta'' che mancava (rev 2026-09-05, R-12): il set si popolava da solo e non si potava da solo, quindi ogni tabella ritirata lasciava una riga che puntava a niente — ed e'' cosi'' che apply_storicizza_weekly e'' morto ogni settimana per SEI MESI senza che nessuno lo sapesse. ⛔ Si pota SOLO il caso «il nome non risolve piu'' a nessun oggetto»: una tabella che esiste ma ha perso il DEFAULT NON si pota, perche'' e'' il caso transitorio che apply_storicizza_weekly ripara e le due meta'' si combatterebbero. ⛔ Le righe insert_manuale = true non si toccano mai: sono una decisione di una persona, e se il loro bersaglio sparisce va detto a qualcuno invece che cancellato di nascosto. ⚠️ Il nome si scrive schema-qualificato esplicitamente: regclass::text lo omette per gli schemi nel search_path del chiamante, e una chiave che dipende dal search_path un giorno non ritrova la propria riga.';

              -- ⭐ LA PRIMA POTATURA E' QUESTA CHIAMATA, non una DELETE scritta
              --   a mano: il changeSet installa il meccanismo e lo fa girare una
              --   volta, cosi' la riparazione e' lo stesso gesto della
              --   correzione. Idempotente per costruzione.
              CALL maintenance.proc_sync_storico_set_storicizza();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Torna alla sincronizzazione che sa solo AGGIUNGERE. Le righe
              --   gia' potate non tornano: erano nomi che non risolvevano a
              --   niente, e ricrearli richiederebbe di ricreare le tabelle.
              CREATE OR REPLACE PROCEDURE maintenance.proc_sync_storico_set_storicizza()
               LANGUAGE plpgsql
              AS $procedure$
                DECLARE
                  rec RECORD;
                BEGIN
                  FOR rec IN
                    SELECT a.attrelid::regclass::text AS table_name
                      FROM pg_attribute a
                      JOIN pg_class c ON a.attrelid = c.oid AND c.relkind = 'r'
                      JOIN pg_namespace n ON c.relnamespace = n.oid
                      JOIN pg_attrdef ad ON ad.adrelid = a.attrelid AND ad.adnum = a.attnum
                    WHERE a.attname = 'storicizza'
                      AND pg_get_expr(ad.adbin, ad.adrelid) = 'true'
                  LOOP
                    INSERT INTO config.storico_set_storicizza(table_name, insert_manuale)
                    VALUES (rec.table_name, false)
                    ON CONFLICT (table_name) DO NOTHING;
                  END LOOP;
                END;
              $procedure$;
