databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/maintenance/20260111-03-proc-automations-lock-columns-job-mctit.yaml

  - changeSet:
      id: 20260111-03-proc-automations-lock-columns-job
      author: mctit
      # validCheckSum:
      #    - ANY
      comment: >
        Crea la procedura job maintenance.proc_automations_lock_columns_job
        che chiama dbops.fn_run_automations_lock_columns con logging e lock.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE PROCEDURE maintenance.proc_automations_lock_columns_job()
                LANGUAGE 'plpgsql'
              AS $BODY$
                BEGIN
                  PERFORM maintenance.fn_run_and_log(
                    p_jobname  := 'automations_lock_columns',
                    p_stepname := 'run_automations_lock_columns',
                    p_sql      := 'SELECT dbops.fn_run_automations_lock_columns(''SCHEDULED'', NULL, false);',
                    p_lock_key := hashtext('automations_lock_columns')
                  );
                END;
              $BODY$;

              COMMENT ON PROCEDURE maintenance.proc_automations_lock_columns_job()
                IS 'Job wrapper per chiamare fn_run_automations_lock_columns con logging e lock.';
