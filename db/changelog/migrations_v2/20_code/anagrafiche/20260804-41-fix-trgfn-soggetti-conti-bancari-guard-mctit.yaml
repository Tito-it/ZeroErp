# Bonifica riferimenti morti — F4 + F5, tre difetti nella stessa funzione
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
# ── TRE, NON UNO ─────────────────────────────────────────────────────────
#   Il brief conta questa funzione due volte (F4 per `sqlerrm`, F5 per
#   `new.data_al`). I difetti sono tre, e il terzo si vede solo togliendo
#   i primi due:
#
#   1) `anagrafiche.fn_log_and_raise_error` **non esiste**: c'e' solo
#      `script.fn_log_and_raise_error`. plpgsql_check non ci arriva perche'
#      si ferma prima, sugli argomenti.
#   2) `SQLERRM` fuori da un blocco EXCEPTION: non e' una variabile
#      risolvibile li', plpgsql la cerca come colonna.
#   3) `NEW.data_al` / `NEW.data_dal` non esistono su
#      `anagrafiche.soggetti_conti_bancari`. Le colonne sono
#      `valido_dal` / `valido_al` — e le usa gia' l'`IF` due righe sopra,
#      nella stessa istruzione. E' un copia-incolla da un'altra tabella
#      rimasto meta' aggiornato.
#
#   ⚠️ Il difetto (3) e' particolarmente ingannevole perche' sta nel ramo
#   che scatta **solo** quando le date sono incoerenti: nel caso normale
#   non viene nemmeno pianificato. Il guard sembra funzionare, e smette di
#   funzionare esattamente quando c'e' qualcosa da bloccare.
#
#   Agganciato a `trg_soggetti_conti_bancari_guard_ins_upd`: e' vivo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260804-41-fix-trgfn-soggetti-conti-bancari-guard-mctit.yaml

  - changeSet:
      id: 20260804-41-fix-trgfn-soggetti-conti-bancari-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F4+F5 — anagrafiche.trgfn_soggetti_conti_bancari_guard: schema errato sulla
        funzione di log (anagrafiche -> script), SQLERRM fuori da handler, e
        NEW.data_al/NEW.data_dal che sulla tabella si chiamano valido_al/valido_dal.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_conti_bancari_guard()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Guard su anagrafiche.soggetti_conti_bancari.
              --
              -- rev 2026-08-04 (bonifica riferimenti morti, F4+F5):
              --   - anagrafiche.fn_log_and_raise_error non esiste: e' script.
              --   - SQLERRM fuori da un blocco EXCEPTION non e' risolvibile.
              --   - NEW.data_al / NEW.data_dal non sono colonne di questa
              --     tabella: sono valido_al / valido_dal, le stesse gia' usate
              --     nell'IF che governa il ramo.
              DECLARE
                v_attivo boolean;
              BEGIN
                -- Evita legami a conti_bancari disattivati
                SELECT attivo INTO v_attivo
                  FROM anagrafiche.conti_bancari
                 WHERE id = NEW.conto_bancario_id;
                IF v_attivo IS NOT TRUE THEN

                  PERFORM script.fn_log_and_raise_error(
                                      'database',
                                      'trgfn_soggetti_conti_bancari_guard',
                                      'E_CONTO_BANCARIO',
                                      jsonb_build_object(
                                        'tabella','anagrafiche.conti_bancari',
                                        'conto_bancario_id',  NEW.conto_bancario_id::text
                                      ) , NULL::uuid, NEW.conto_bancario_id::text
                                    );

                END IF;

                -- Coerenza validità già controllata da CHECK, ma forziamo normalizzazione date
                IF NEW.valido_dal IS NOT NULL AND NEW.valido_al IS NOT NULL
                   AND NEW.valido_al < NEW.valido_dal THEN

                    PERFORM script.fn_log_and_raise_error(
                                      'database',
                                      'trgfn_soggetti_conti_bancari_guard',
                                      'E_DATA_AL_MINORE_DAL',
                                      jsonb_build_object(
                                        'tabella','anagrafiche.soggetti_conti_bancari',
                                        'valido_al',  NEW.valido_al::text,
                                        'valido_dal',  NEW.valido_dal::text
                                      ) , NULL::uuid, NEW.valido_al::text, NEW.valido_dal::text
                                    );
                END IF;


                RETURN NEW;
              END
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
