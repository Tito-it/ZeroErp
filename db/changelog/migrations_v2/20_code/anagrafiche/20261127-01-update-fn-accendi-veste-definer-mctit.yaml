# anagrafiche.fn_accendi_veste: SECURITY DEFINER (passo 3c-1, D-3c-1 a).
#
#   Al passo 3c-3 l'app perde l'UPDATE di anagrafiche.identita_digitali: da
#   INVOKER questa funzione si fermerebbe. Diventa SECURITY DEFINER, col
#   search_path fissato, e nient'altro cambia.
#
#   ⚠️ Nessun guard di permesso, per scelta (D-3c-1 a, Tid, 2026-11-27). I
#   chiamanti sono due, e nessuno dei due ha un permesso da chiedere:
#   · il link dell'invito (AttivazioneView, AttivazionePortaleView,
#     AttivazioneShopView): richiesta anonima, senza GUC d'identita'. Il
#     controllo e' il token, che il backend consuma nello stesso atomic prima
#     di chiamare questa funzione, e annulla se ritorna false;
#   · «Attiva shop» (ProfileActivateShopView): la persona stessa, dalla sua
#     veste cliente, senza token. Si ritira con l'iscrizione da se'.
#   Il limite e' quello di oggi, spostato dentro un verbo: la funzione accende
#   la veste spenta e non revocata che il backend le passa. Una veste revocata
#   la ferma il guard della tabella (E_VESTE_REVOCATA). Il verbo che consuma il
#   token a DB nasce col giro dell'iscrizione da se'.
#
#   Corpo = il vivo (pg_get_functiondef su dbdev, 2026-11-27, uguale al
#   20261018-63); firma ri-ancorata. p_vesti resta config.ruolo_applicativo[]:
#   %TYPE[] e' sintassi nel DECLARE, non nella firma (PG 19, provato il
#   2026-11-27: «errore di sintassi vicino a "["»). Firma
#   invariata: CREATE OR REPLACE, GRANT invariati. Il COMMENT si riscrive al
#   presente (linee-guida-sql §5d): quello di prima portava brief e date.
#   In audit e storico la scrittura risulta ora del proprietario della
#   tabella: l'utente vero, quando c'e', lo dice la GUC.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261127-01-update-fn-accendi-veste-definer-mctit.yaml

  - changeSet:
      id: 20261127-01-update-fn-accendi-veste-definer
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_accendi_veste: SECURITY DEFINER col search_path fissato, perche' l'app perde
        la scrittura diretta di identita_digitali. Corpo e firma invariati.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_accendi_veste(
                  p_identita_id  anagrafiche.identita_digitali.id%TYPE,
                  p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE,
                  p_vesti        config.ruolo_applicativo[] DEFAULT NULL)  -- %TYPE[] non e' sintassi in firma (lo e' solo nel DECLARE): il tipo di identita_digitali.ruolo_applicativo
               RETURNS boolean   -- c'e' la veste: un esito, non il riflesso di una colonna
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_attivo anagrafiche.identita_digitali.attivo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Accendere la veste p_identita_id della credenziale
                  --   p_auth_user_id, se e' fra p_vesti (NULL = qualunque).
                  --   Ritorna true se la veste c'e' (accesa ora o gia'),
                  --   false se non c'e' (o non e' di quella credenziale, o
                  --   non e' fra le vesti ammesse).
                  --
                  -- Regole:
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - gia' accesa: nessuna scrittura.
                  -- =========================================================
                  IF p_identita_id IS NULL OR p_auth_user_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_accendi_veste', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('identita_id',  p_identita_id,
                                             'auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'anagrafiche.fn_accendi_veste',
                          'veste o credenziale mancanti');
                  END IF;

                  SELECT idg.attivo
                    INTO v_attivo
                    FROM anagrafiche.identita_digitali idg
                   WHERE idg.id = p_identita_id
                     AND idg.auth_user_id = p_auth_user_id
                     AND (p_vesti IS NULL OR idg.ruolo_applicativo = ANY (p_vesti));

                  IF NOT FOUND THEN
                      RETURN false;
                  END IF;

                  IF NOT v_attivo THEN
                      UPDATE anagrafiche.identita_digitali idg
                         SET attivo = true
                       WHERE idg.id = p_identita_id;
                  END IF;

                  RETURN true;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_accendi_veste(
                  anagrafiche.identita_digitali.id%TYPE,
                  anagrafiche.identita_digitali.auth_user_id%TYPE,
                  config.ruolo_applicativo[]) IS
                  'Accende la veste p_identita_id (anagrafiche.identita_digitali.attivo = true) della credenziale p_auth_user_id, se e'' fra le vesti p_vesti (NULL = qualunque). Ritorna true se la veste c''e'' (accesa adesso, o gia'' accesa e allora senza scrivere), false se non c''e'', non e'' di quella credenziale o non e'' fra le vesti ammesse. Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Una veste revocata non si accende: la ferma anagrafiche.trgfn_identita_digitali_guard_revoca (E_VESTE_REVOCATA). Coerenza, natura della credenziale, unicita'' della veste accesa e sincronizzazione di auth_user.is_active: i trigger della tabella. SECURITY DEFINER, search_path fissato, senza guard di permesso: la chiamano richieste senza un amministratore, il link dell''invito (anonimo: il controllo e'' il token, che il backend consuma nella stessa transazione) e la persona che accende una propria veste. E'' la sede unica dell''accensione: la usano anche il verbo dei dati di sviluppo, anagrafiche.fn_crea_primo_amministratore e dbops.fn_pgtap_crea_operatore_umano.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: la versione precedente e' il 20261018-63
