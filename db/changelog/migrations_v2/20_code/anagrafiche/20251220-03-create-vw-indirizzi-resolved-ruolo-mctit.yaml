# Liquibase changelog per Zero ERP
# Viste unificate indirizzi (resolved) per soggetto e ruolo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251220-03-create-vw-indirizzi-resolved-ruolo-mctit.yaml

  - changeSet:
      id: 20251220-03-create-vw-indirizzi-resolved-ruolo
      author: mctit
      # runOnChange: true
      validCheckSums:
        - ANY
      comment: >
        Crea le viste:
        - anagrafiche.vw_indirizzi_resolved_ruolo
        Standardizza output (display + campi strutturati) per indirizzi normalizzati e liberi.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ============================================================
              -- 1) RESOLVED RUOLO
              -- ============================================================
              CREATE OR REPLACE VIEW anagrafiche.vw_indirizzi_resolved_ruolo AS
              SELECT
                'RUOLO'::text                           AS scope,
                i.id                                   AS indirizzo_id,
                sr.soggetto_id                         AS soggetto_id,
                i.soggetto_ruolo_id                    AS soggetto_ruolo_id,

                i.tipo_indirizzo_id::integer           AS tipo_indirizzo_id,
                ti.codice_interno                      AS tipo_indirizzo_codice,
                ti.descrizione                         AS tipo_indirizzo_descrizione,

                (i.indirizzo_dettaglio_id IS NOT NULL) AS is_normalizzato,
                i.indirizzo_dettaglio_id               AS indirizzo_dettaglio_id,

                COALESCE(
                  vidd.indirizzo_normalizzato,
                  NULLIF(btrim(i.indirizzo_libero), ''),
                  NULLIF(btrim(
                    concat_ws(', ',
                      NULLIF(btrim(i.postal_box), ''),
                      NULLIF(btrim(i.sublocality), ''),
                      NULLIF(btrim(i.locality), ''),
                      NULLIF(btrim(i.administrative_area), '')
                    )
                  ), '')
                )                                       AS indirizzo_display,

                -- componenti liberi/internazionali
                i.indirizzo_libero,
                i.stato_id,
                i.administrative_area,
                i.locality,
                i.sublocality,
                i.postal_box,

                -- Comune/CAP/Provincia: da dettaglio se normalizzato, altrimenti da vw_indirizzo_completo se disponibile
                COALESCE(vidd.comune_id, i.comune_id)                   AS comune_id,
                COALESCE(vidd.descrizione_comune, ic.comune)            AS comune_descrizione,
                COALESCE(vidd.cap, ic.codice_postale)                   AS cap,
                COALESCE(vidd.provincia, ic.provincia)                  AS provincia,

                -- stradario/dettaglio (solo se normalizzato)
                vidd.stradario_id,
                vidd.via_norm,
                vidd.civico,
                vidd.estensione_civico,
                vidd.palazzina,
                vidd.scala,
                vidd.piano,
                vidd.interno,
                vidd.altro,

                -- geoloc: priorità al dettaglio, altrimenti geoloc libero
                COALESCE(vidd.civic_geoloc, vidd.street_geoloc, i.geoloc) AS geoloc,

                -- audit + tx
                i.storicizza,
                i.tx_id,
                i.data_insert,
                i.user_insert,
                i.data_update,
                i.user_update
              FROM anagrafiche.indirizzi i
              JOIN anagrafiche.soggetti_ruoli sr
                ON sr.id = i.soggetto_ruolo_id
              JOIN config.tipi_indirizzi ti
                ON ti.id = i.tipo_indirizzo_id
              LEFT JOIN anagrafiche.vw_indirizzi_dettaglio vidd
                ON vidd.indirizzo_dettaglio_id = i.indirizzo_dettaglio_id
              LEFT JOIN script.vw_indirizzo_completo ic
                ON ic.id_comune = i.comune_id;

              COMMENT ON VIEW anagrafiche.vw_indirizzi_resolved_ruolo
              IS 'Vista resolved: indirizzi associati a soggetto_ruolo, 
                con output standard (display + campi strutturati), supporto normalizzato/libero.
                Dipende da script.vw_indirizzo_completo per comune/cap/provincia.';
