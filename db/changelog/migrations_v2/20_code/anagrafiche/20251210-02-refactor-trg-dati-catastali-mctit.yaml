databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251210-02-refactor-trg-dati-catastali-mctit.yaml

    - changeSet:
          id: 20251210-02-refactor-trg-dati-catastali-mctit.yaml
          author: mctit

          validCheckSum:
              - ANY

          comment: "Rinomina i trigger dati_catastali_* in catasto_unita_immobiliari_* per coerenza di naming"
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: true
                    stripComments: true
                    sql: |
                        -- Dati catastali → Catasto unità immobiliari
                        /*     ALTER TRIGGER trg_dati_catastali_audit_data_user_generic_upd
                            ON anagrafiche.catasto_unita_immobiliari
                        RENAME TO trg_catasto_unita_immobiliari_audit_data_user_generic_upd;

                        ALTER TRIGGER trg_dati_catastali_tx_id_managed_ins_upd
                            ON anagrafiche.catasto_unita_immobiliari
                        RENAME TO trg_catasto_unita_immobiliari_tx_id_managed_ins_upd;

                        ALTER TRIGGER trg_dati_catastali_z90_storico_generic_upd_dlt
                            ON anagrafiche.catasto_unita_immobiliari
                        RENAME TO trg_catasto_unita_immobiliari_z90_storico_generic_upd_dlt;
                        */
    # --------------*------------------------------------------
    # 4) Aggiorna COMMENT dei trigger
    # --------------------------------------------------------
    - changeSet:
          id: 20251210-02-02-comment-triggers-catasto-unita-imm
          author: mctit
          # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
          #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
          #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
          #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
          #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
          #   crea un file nuovo con numerazione successiva, non si rigira questo.
          runOnChange: false
          validCheckSums:
            - ANY
          comment: >
              Allinea i comment dei trigger al nuovo nome tabella catasto_unita_immobiliari.

          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: true
                    stripComments: true
                    sql: |

                        /*
                        COMMENT ON TRIGGER trg_catasto_unita_immobiliari_audit_data_user_generic_upd
                           ON anagrafiche.catasto_unita_immobiliari IS
                           'Aggiorna i campi di audit (data_update, user_update) su catasto_unita_immobiliari.';

                        COMMENT ON TRIGGER trg_catasto_unita_immobiliari_tx_id_managed_ins_upd
                           ON anagrafiche.catasto_unita_immobiliari IS
                           'Gestisce l''assegnazione del tx_id su catasto_unita_immobiliari tramite dbops.trgfn_tx_id_managed quando NEW.tx_id è NULL.';

                        COMMENT ON TRIGGER trg_catasto_unita_immobiliari_z90_storico_generic_upd_dlt
                           ON anagrafiche.catasto_unita_immobiliari IS
                           'Genera uno snapshot storico in storico.catasto_unita_immobiliari tramite script.trgfn_storico_generic.';

                         */
