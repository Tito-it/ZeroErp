# M1a — «quanta storia ha questo billing account»
#   anagrafiche.fn_get_storia_emittente_ba(billing_account_id)
#   Piano: brief-db-billing-account-cambio-emittente, M1 (§6.1)
#
# ── ⭐ CHE COSA CONTA COME «STORIA» (D-2) ──────────────────────────
#   Non e' un criterio di gravita': e' una proprieta' del modello. Blocca cio'
#   che porta UNA COPIA DELL'EMITTENTE CHE NESSUNO RISCRIVERA' PIU'. Con quel
#   criterio la lista si compila da sola, e sono DUE cose:
#     * vendite.fatture — emittente_soggetto_ruolo_id NOT NULL *e*
#       emittente_snapshot jsonb accanto: il documento fiscale porta con se'
#       chi lo ha emesso;
#     * vendite.commesse — dal 20260826-41 la colonna e' NOT NULL e vincolata
#       al billing account: e' una copia, e il suo guard scatta su UPDATE OF,
#       quindi un mapping spostato non la riscrive e la lascia FALSA.
#
#   ⛔ Ordini e DDT NON entrano, e non per clemenza: il loro emittente non e'
#   una copia stantia — hanno un trgfn_*_guard_emittente_ba che gliela
#   ricontrolla a ogni scrittura. Metterli nella lista bloccherebbe piu' casi
#   senza chiudere nessun buco in piu', e «blocca di piu'» non e' un argomento.
#
# ── ⚠️ `SECURITY DEFINER`, per la ragione di sempre ─────────────────
#   vendite.fatture e vendite.commesse hanno la RLS accesa. Da SECURITY INVOKER
#   la storia di un ALTRO emittente sarebbe invisibile e il guard direbbe
#   «nessuna storia, si puo' spostare» proprio nel caso che deve bloccare.
#
# ── ⭐ RESTITUISCE I CONTEGGI, NON UN BOOLEANO, E SERVE ─────────────
#   Il messaggio che legge l'operatore deve dire QUANTE fatture e QUANTE
#   commesse: un «non si puo'» senza numeri manda a cercare a mano cosa c'e'
#   sotto.
#
# ⚠️ Entrambi i conteggi sono indicizzati (ix_fatture_ba_data,
#   ix_commesse_ba_utility): e' una lettura di struttura, non una misura di
#   popolazione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260826-46-create-fn-storia-emittente-ba-mctit.yaml

  - changeSet:
      id: 20260826-46-create-fn-storia-emittente-ba
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        M1a: quanta storia ha questo billing account. ⭐ «Storia» non e' un criterio di
        gravita' ma una proprieta' del modello: cio' che porta una COPIA dell'emittente che
        nessuno riscrivera' piu'. Sono due cose — vendite.fatture (NOT NULL +
        emittente_snapshot) e vendite.commesse (NOT NULL dal 20260826-41, con un guard che
        scatta su UPDATE OF e quindi non riscrive la riga quando il mapping cambia).
        ⛔ Ordini e DDT no, e non per clemenza: hanno un trgfn_*_guard_emittente_ba che
        ricontrolla la coerenza col BA a ogni scrittura, quindi la loro copia non invecchia.
        ⚠️ SECURITY DEFINER: le due tabelle hanno la RLS, e da INVOKER la storia di un altro
        emittente sarebbe invisibile — il guard direbbe «si puo' spostare» proprio nel caso da
        bloccare. ⭐ Restituisce i CONTEGGI e non un booleano: un «non si puo'» senza numeri
        manda a cercare a mano cosa c'e' sotto. Piano: brief-db-billing-account-cambio-emittente, M1.
      preConditions:
        - onFail: HALT
        - and:
            # ⛔ Dipendenza dichiarata: la parte «commesse» ha senso solo dopo
            #    che la colonna e' diventata una copia congelata (L3 del
            #    cantiere gemello, changeSet 20260826-41).
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name   = 'commesse'
                     AND column_name  = 'emittente_soggetto_ruolo_id'
                     AND is_nullable  = 'NO';
            - tableExists:
                schemaName: vendite
                tableName: fatture
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_get_storia_emittente_ba(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE
              )
              RETURNS TABLE (n_fatture bigint, n_commesse bigint)
              LANGUAGE plpgsql
              STABLE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public'
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Quanti documenti hanno gia' CONGELATO l'emittente di
                  --   questo billing account. E' la definizione operativa di
                  --   «storia» (decisione D-2): non «quanto e' grave», ma
                  --   «chi porta una copia che nessuno riscrivera' piu'».
                  --
                  -- ⚠️ SECURITY DEFINER: fatture e commesse hanno la RLS. Da
                  --   SECURITY INVOKER la storia di un altro emittente sarebbe
                  --   invisibile e il chiamante concluderebbe «non c'e'
                  --   storia» proprio nel caso da bloccare.
                  --
                  -- ⛔ Ordini e DDT non si contano: il loro emittente ha un
                  --   guard che lo ricontrolla col BA a ogni scrittura, quindi
                  --   non e' una copia stantia.
                  -- =========================================================
                  IF p_billing_account_id IS NULL THEN
                      -- Nessun BA = nessuna storia da proteggere. La riga senza
                      -- billing account e' quella del gestore globale, e la
                      -- guarda fn_guard_ba_gestore_globale_storia.
                      RETURN QUERY SELECT 0::bigint, 0::bigint;
                      RETURN;
                  END IF;

                  RETURN QUERY
                  SELECT
                      (SELECT count(*) FROM vendite.fatture f
                        WHERE f.billing_account_id = p_billing_account_id),
                      (SELECT count(*) FROM vendite.commesse c
                        WHERE c.billing_account_id = p_billing_account_id);
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_get_storia_emittente_ba(bigint)
              IS 'Quanti documenti hanno gia'' CONGELATO l''emittente di un billing account: (n_fatture, n_commesse). E'' la definizione operativa di «storia» del cantiere brief-db-billing-account-cambio-emittente (decisione D-2), e il criterio non e'' la gravita'' ma una proprieta'' del modello — si conta cio'' che porta una COPIA dell''emittente che nessuno riscrivera'' piu''. ⭐ Sono due cose e si compilano da sole: vendite.fatture, dove emittente_soggetto_ruolo_id e'' NOT NULL e accanto c''e'' emittente_snapshot (il documento fiscale porta con se'' chi lo ha emesso); e vendite.commesse, dove dal 20260826-41 la colonna e'' NOT NULL e vincolata al billing account — con un guard montato UPDATE OF, quindi un mapping spostato NON riscrive quella riga e la lascia falsa in silenzio. ⛔ Ordini e DDT NON si contano, e non per clemenza: hanno un trgfn_*_guard_emittente_ba che ricontrolla la coerenza col BA a ogni scrittura, quindi la loro copia non invecchia — metterli nella lista bloccherebbe piu'' casi senza chiudere nessun buco in piu'', e «blocca di piu''» non e'' un argomento. ⚠️ SECURITY DEFINER: entrambe le tabelle hanno la RLS accesa, e da SECURITY INVOKER la storia di un ALTRO emittente sarebbe invisibile — il guard direbbe «nessuna storia, si puo'' spostare» proprio nel caso che deve bloccare. E'' la stessa ragione per cui anagrafiche.fn_guard_albero_ba_emittente e'' DEFINER. ⭐ Restituisce i CONTEGGI e non un booleano perche'' il messaggio che legge l''operatore deve dire QUANTE fatture e QUANTE commesse: un «non si puo''» senza numeri manda a cercare a mano cosa c''e'' sotto. ⚠️ Entrambi i conteggi sono serviti da un indice (ix_fatture_ba_data, ix_commesse_ba_utility). Input NULL -> (0, 0): la riga senza billing account e'' quella del gestore globale, e la guarda anagrafiche.fn_guard_ba_gestore_globale_storia.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_get_storia_emittente_ba(bigint);
