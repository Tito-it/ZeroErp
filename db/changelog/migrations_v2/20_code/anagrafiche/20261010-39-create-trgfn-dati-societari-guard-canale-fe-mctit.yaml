# IL CANALE FE PRETENDE IL SUO RECAPITO: LA FRASE PER CHI COMPILA IL FORM
#   Brief: brief-db-character-n-spazi-di-riempimento.md D-6 (Tid, 2026-10-10)
#
#   I CHECK del 20261010-37 (forma del codice SDI, coerenza canale/recapito)
#   rifiutano con un 23514 che non dice quale campo correggere. Questo guard
#   gira prima (BEFORE ROW) e parla per campo:
#     * codice_sdi fuori forma            -> E_DATI_SOCIETARI_CODICE_SDI_NON_VALIDO
#     * canale C senza codice SDI         -> E_DATI_SOCIETARI_CODICE_SDI_MANCANTE
#     * canale P senza PEC                -> E_DATI_SOCIETARI_PEC_FATTURAZIONE_MANCANTE
#   Tutti DATO_ERRATO: li scrive una persona nel form del soggetto.
#   Un canale fuori vocabolario (ne' P ne' C) NON passa di qui: il form lo
#   sceglie da una lista, quindi chi lo sbaglia e' un chiamante rotto, e il
#   23514 di chk_dati_societari_destinatario_fe_canale e' la risposta giusta.
#
#   UPDATE OF sulle tre colonne: nessun altro trigger BEFORE della tabella le
#   scrive (verificato sui corpi, 2026-10-10). Il corpo confronta comunque OLD
#   e NEW: OF scatta anche a valore uguale.
#   ⚠️ La forma del codice e la coerenza sono ripetute qui e nei CHECK per
#   scelta, come per la sigla della provincia: il guard parla, il CHECK
#   protegge. Il pgTAP test-dati-societari-canale-fe-v1 li prova entrambi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261010-39-create-trgfn-dati-societari-guard-canale-fe-mctit.yaml

  - changeSet:
      id: 20261010-39-create-trgfn-dati-societari-guard-canale-fe
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard BEFORE INSERT OR UPDATE OF destinatario_fe, pec_fatturazione, codice_sdi su
        anagrafiche.dati_societari: forma del codice SDI e recapito del canale scelto, con un
        codice per campo. Brief: brief-db-character-n-spazi-di-riempimento.md D-6.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION anagrafiche.trgfn_dati_societari_guard_canale_fe()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                v_contesto  jsonb;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Il canale della fattura elettronica (destinatario_fe) ha
                --   il suo recapito, e il codice SDI ha la sua forma. Montato
                --   BEFORE INSERT OR UPDATE OF destinatario_fe,
                --   pec_fatturazione, codice_sdi.
                -- =========================================================
                IF TG_OP = 'UPDATE'
                   AND NEW.destinatario_fe  IS NOT DISTINCT FROM OLD.destinatario_fe
                   AND NEW.pec_fatturazione IS NOT DISTINCT FROM OLD.pec_fatturazione
                   AND NEW.codice_sdi       IS NOT DISTINCT FROM OLD.codice_sdi THEN
                  RETURN NEW;
                END IF;

                v_contesto := jsonb_build_object('dati_societari_id', NEW.id,
                                                 'soggetto_id',       NEW.soggetto_id,
                                                 'canale',            NEW.destinatario_fe);

                -- 1. La forma del codice, quando c'e' (con qualunque canale)
                IF NEW.codice_sdi IS NOT NULL
                   AND NEW.codice_sdi !~ '^[A-Z0-9]{6,7}$' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'anagrafiche', 'trgfn_dati_societari_guard_canale_fe',
                    'E_DATI_SOCIETARI_CODICE_SDI_NON_VALIDO',
                    v_contesto || jsonb_build_object('campo', 'codice_sdi'),
                    NULL::uuid,
                    NEW.codice_sdi);
                END IF;

                -- 2. Il canale C pretende il codice
                IF NEW.destinatario_fe = 'C' AND NEW.codice_sdi IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'anagrafiche', 'trgfn_dati_societari_guard_canale_fe',
                    'E_DATI_SOCIETARI_CODICE_SDI_MANCANTE',
                    v_contesto || jsonb_build_object('campo', 'codice_sdi'),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]);  -- nessun segnaposto nella frase
                END IF;

                -- 3. Il canale P pretende la PEC
                IF NEW.destinatario_fe = 'P'
                   AND coalesce(btrim(NEW.pec_fatturazione), '') = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'anagrafiche', 'trgfn_dati_societari_guard_canale_fe',
                    'E_DATI_SOCIETARI_PEC_FATTURAZIONE_MANCANTE',
                    v_contesto || jsonb_build_object('campo', 'pec_fatturazione'),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]);  -- nessun segnaposto nella frase
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_dati_societari_guard_canale_fe() IS
                'Guard BEFORE INSERT OR UPDATE OF destinatario_fe, pec_fatturazione, codice_sdi su '
                'anagrafiche.dati_societari: codice SDI di 6-7 caratteri maiuscoli o cifre; canale C con il '
                'codice, canale P con la PEC. Un codice per campo; i CHECK del 20261010-37 fanno da rete. '
                'Brief: brief-db-character-n-spazi-di-riempimento D-6.';

              CREATE TRIGGER trg_dati_societari_a10_guard_canale_fe_ins_upd
                BEFORE INSERT OR UPDATE OF destinatario_fe, pec_fatturazione, codice_sdi
                ON anagrafiche.dati_societari
                FOR EACH ROW EXECUTE FUNCTION anagrafiche.trgfn_dati_societari_guard_canale_fe();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_dati_societari_a10_guard_canale_fe_ins_upd ON anagrafiche.dati_societari;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_dati_societari_guard_canale_fe();
