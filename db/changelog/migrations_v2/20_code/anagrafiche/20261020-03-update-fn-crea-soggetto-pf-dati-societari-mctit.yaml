# anagrafiche.fn_crea_soggetto_pf: LA DITTA INDIVIDUALE NASCE CON I SUOI
# DATI SOCIETARI
#   Brief: brief-db-dati-societari-in-creazione (§1.1, E-1 (a) di Tid,
#   2026-10-19)
#
# -- IL DIFETTO --------------------------------------------------------
#   La DI ammette i dati societari (policy OPTIONAL) e il form li manda in
#   creazione, ma questa porta non li riceveva: l'operatore compilava forma,
#   REA, canale FE e PEC, leggeva «creato», e alla riapertura la sezione era
#   vuota.
#
# -- COSA CAMBIA ------------------------------------------------------
#   * I dieci campi della sezione IN CODA, DEFAULT NULL, con gli STESSI
#     nomi di fn_crea_soggetto_pg (p_forma_giuridica_id ...
#     p_data_costituzione), ancorati alle colonne.
#   * Step 3, dopo il contatto: il BB anagrafiche.fn_scrivi_dati_societari_alla_nascita
#     (20261020-01), lo stesso di fn_crea_soggetto_pg, decide se scriverli
#     e li scrive col verbo. Soggetto e sezione nascono in una chiamata sola,
#     atomica (E-1 (a)). Un privato (NONE) con la sezione: la rifiuta il
#     guard della natura (E_DATI_SOCIETARI_TIPO_SOGGETTO_NON_AMMESSO).
#   * La firma cambia: DROP della vecchia + CREATE. Firma, RETURNS, DECLARE,
#     DROP e COMMENT ancorati (%TYPE); SECURITY INVOKER. Nessuna clausola
#     SET/COST sul vivo. Corpo dallo YAML 20261018-89, verificato identico al
#     vivo (prosrc) su dbdev e sullo scratch il 2026-10-19; cambiano solo la
#     firma, l'intestazione del corpo, lo Step 3 e il COMMENT.
#   Privilegi: nessun GRANT da rimettere (SECURITY INVOKER, mai GRANT
#   espliciti, come in 20261009-26).
#   ⚠️ CHIAMANTI (censimento 2026-10-19, pg_get_functiondef): nel DB
#     anagrafiche.fn_crea_operatore_v2, coi soli parametri di prima: resta
#     valida, i nuovi hanno DEFAULT; nessuna dipendenza in pg_depend; il
#     backend (SoggettiRepository.crea_soggetto_pf, parametri nominati: resta
#     valido, la sezione la passera' dopo l'apply, brief §6); i pgTAP per nome.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261020-03-update-fn-crea-soggetto-pf-dati-societari-mctit.yaml

  - changeSet:
      id: 20261020-03-update-fn-crea-soggetto-pf-dati-societari
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_crea_soggetto_pf: i dati societari in coda (stessi nomi di fn_crea_soggetto_pg) e scritti nella stessa chiamata dal BB anagrafiche.fn_scrivi_dati_societari_alla_nascita: la ditta individuale non li perde piu' in creazione. DROP della firma vecchia. E-1 (a) di Tid, brief-db-dati-societari-in-creazione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_crea_soggetto_pf'
                 AND p.pronargs = 11;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La firma cambia (i dati societari in coda): senza il DROP resterebbe un
              --   overload, e una chiamata coi soli parametri di prima sarebbe ambigua.
              DROP FUNCTION anagrafiche.fn_crea_soggetto_pf(
                  anagrafiche.soggetti.cognome%TYPE,
                  anagrafiche.soggetti.nome%TYPE,
                  anagrafiche.soggetti.codice_fiscale%TYPE,
                  anagrafiche.contatti.email%TYPE,
                  anagrafiche.soggetti.data_nascita%TYPE,
                  anagrafiche.soggetti.sesso%TYPE,
                  config.stati.codice_iso2%TYPE,
                  anagrafiche.soggetti.comune_id%TYPE,
                  config.tipi_contatti.id%TYPE,
                  config.tipi_soggetto_dettaglio.id%TYPE,
                  anagrafiche.soggetti.partita_iva%TYPE);

              CREATE FUNCTION anagrafiche.fn_crea_soggetto_pf(
                  p_cognome                     anagrafiche.soggetti.cognome%TYPE                 DEFAULT NULL,
                  p_nome                        anagrafiche.soggetti.nome%TYPE                    DEFAULT NULL,
                  p_codice_fiscale              anagrafiche.soggetti.codice_fiscale%TYPE          DEFAULT NULL,
                  p_email                       anagrafiche.contatti.email%TYPE                   DEFAULT NULL,
                  p_data_nascita                anagrafiche.soggetti.data_nascita%TYPE            DEFAULT NULL,
                  p_sesso                       anagrafiche.soggetti.sesso%TYPE                   DEFAULT NULL,
                  p_stato_iso2                  config.stati.codice_iso2%TYPE                     DEFAULT NULL,
                  p_comune_nascita_id           anagrafiche.soggetti.comune_id%TYPE               DEFAULT NULL,
                  p_tipo_contatto_id            config.tipi_contatti.id%TYPE                      DEFAULT NULL,
                  -- ⭐ Rev 20261009-26: in coda (brief-db-sesso-senza-default §4.2)
                  p_tipo_soggetto_dettaglio_id  config.tipi_soggetto_dettaglio.id%TYPE            DEFAULT NULL,
                  p_partita_iva                 anagrafiche.soggetti.partita_iva%TYPE             DEFAULT NULL,
                  -- ⭐ Rev 20261020-03: i dati societari della ditta individuale, in coda
                  --   (brief-db-dati-societari-in-creazione, E-1 (a)); stessi nomi di fn_crea_soggetto_pg
                  p_forma_giuridica_id          anagrafiche.dati_societari.forma_giuridica_id%TYPE DEFAULT NULL,
                  p_id_prov_iscri_rea           anagrafiche.dati_societari.id_prov_iscri_rea%TYPE  DEFAULT NULL,
                  p_iscrizione_rea              anagrafiche.dati_societari.iscrizione_rea%TYPE     DEFAULT NULL,
                  p_capitale_sociale            anagrafiche.dati_societari.capitale_sociale%TYPE   DEFAULT NULL,
                  p_socio_unico                 anagrafiche.dati_societari.socio_unico%TYPE        DEFAULT NULL,
                  p_liquidazione                anagrafiche.dati_societari.liquidazione%TYPE       DEFAULT NULL,
                  p_destinatario_fe             anagrafiche.dati_societari.destinatario_fe%TYPE    DEFAULT NULL,
                  p_pec_fatturazione            anagrafiche.dati_societari.pec_fatturazione%TYPE   DEFAULT NULL,
                  p_codice_sdi                  anagrafiche.dati_societari.codice_sdi%TYPE         DEFAULT NULL,
                  p_data_costituzione           anagrafiche.dati_societari.data_costituzione%TYPE  DEFAULT NULL
              )
               RETURNS anagrafiche.soggetti.id%TYPE
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: crea un soggetto PERSONA FISICA (natura base PF: privato PR o
              --   ditta individuale DI) + il contatto di default + i dati societari, se
              --   la natura li ammette e sono passati. NON crea indirizzi.
              -- ⭐ Rev 20261009-26 (brief-db-sesso-senza-default):
              --   - la natura di dettaglio la sceglie il chiamante
              --     (p_tipo_soggetto_dettaglio_id, obbligatorio): prima era PR cablato, e
              --     una ditta individuale scelta nel form nasceva privato, senza P.IVA;
              --   - p_partita_iva: per la DI la pretende gia'
              --     trgfn_soggetti_guard_cf_piva_obbligatori;
              --   - il sesso passa cosi' com'e': via il COALESCE(p_sesso, 'M'). Se serve
              --     lo decide la natura (sesso_policy), nel guard
              --     trgfn_soggetti_guard_sesso_policy: una sede sola per la regola.
              -- ⭐ Rev 20261020-03 (brief-db-dati-societari-in-creazione, E-1 (a)):
              --   i dati societari (la DI li ammette, policy OPTIONAL) nascono qui, nella
              --   stessa chiamata: prima il backend li riceveva dal form e li perdeva.
              --   Quando scriverli lo decide il BB della nascita, lo stesso di
              --   fn_crea_soggetto_pg; un privato (NONE) con la sezione lo rifiuta il
              --   guard della natura.
              -- =========================================================
              DECLARE
                  v_tipo_soggetto_id            config.tipi_soggetto_dettaglio.tipo_soggetto_id%TYPE;
                  v_descrizione_dettaglio       config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_stato_id                    config.stati.id%TYPE;
                  v_stato_iso2_resolved         config.stati.codice_iso2%TYPE;
                  v_tipo_contatto_id            config.tipi_contatti.id%TYPE;
                  v_soggetto_id                 anagrafiche.soggetti.id%TYPE;
              BEGIN
                  -- Validazione parametri obbligatori
                  IF p_cognome IS NULL OR TRIM(p_cognome) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_cognome'),
                          NULL::uuid, 'Cognome obbligatorio.'
                      );
                  END IF;

                  IF p_nome IS NULL OR TRIM(p_nome) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_nome'),
                          NULL::uuid, 'Nome obbligatorio.'
                      );
                  END IF;

                  IF p_codice_fiscale IS NULL OR TRIM(p_codice_fiscale) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_codice_fiscale'),
                          NULL::uuid, 'Codice fiscale obbligatorio.'
                      );
                  END IF;

                  IF p_email IS NULL OR TRIM(p_email) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_email'),
                          NULL::uuid, 'Email obbligatoria (usata per contatto default).'
                      );
                  END IF;

                  -- Tipo contatto: fallback al primo dalla tabella se non fornito
                  v_tipo_contatto_id := COALESCE(
                      p_tipo_contatto_id,
                      (SELECT id FROM config.tipi_contatti ORDER BY id LIMIT 1)
                  );

                  IF v_tipo_contatto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_contatto_id'),
                          NULL::uuid,
                          'Tipo contatto obbligatorio e nessun tipo contatto trovato in config.tipi_contatti.'
                      );
                  END IF;

                  -- Natura di dettaglio: obbligatoria, e di natura base PF
                  IF p_tipo_soggetto_dettaglio_id IS NULL OR p_tipo_soggetto_dettaglio_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_soggetto_dettaglio_id'),
                          NULL::uuid, 'Tipo soggetto obbligatorio.'
                      );
                  END IF;

                  SELECT tsd.tipo_soggetto_id, tsd.descrizione
                    INTO v_tipo_soggetto_id, v_descrizione_dettaglio
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = p_tipo_soggetto_dettaglio_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_soggetto_dettaglio_id',
                                             'p_tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id),
                          NULL::uuid,
                          concat('Tipo soggetto dettaglio id=', p_tipo_soggetto_dettaglio_id, ' non trovato.')
                      );
                  END IF;

                  -- ⛔ Una societa' o un ente qui e' un chiamante che ha sbagliato porta
                  --   (la porta giusta e' fn_crea_soggetto_pg): TECNICO, non un dato del form.
                  IF v_tipo_soggetto_id <> 'PF' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_SOGGETTO_CREAZIONE_NATURA_ERRATA',
                          jsonb_build_object('tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id,
                                             'tipo_soggetto_id',           v_tipo_soggetto_id),
                          NULL::uuid,
                          COALESCE(v_descrizione_dettaglio, p_tipo_soggetto_dettaglio_id::text),
                          v_tipo_soggetto_id
                      );
                  END IF;

                  -- Stato (nazionalita). Rev 2026-10-18 (D-1 di Tid): quello detto dal
                  -- chiamante, cercato dal BB che rifiuta un codice con piu' stati
                  -- (E_STATO_ISO2_AMBIGUO; prima un SELECT INTO ne prendeva uno a caso);
                  -- altrimenti quello proposto, che valida e non ripiega. ⛔ Il ripiego
                  -- silenzioso a 'IT' e il parametro soggetto_default_stato_iso2 sono
                  -- ritirati.
                  IF NULLIF(btrim(p_stato_iso2), '') IS NOT NULL THEN
                      v_stato_iso2_resolved := upper(btrim(p_stato_iso2));
                      v_stato_id := script.fn_stato_id_da_iso2(v_stato_iso2_resolved, 'anagrafiche.fn_crea_soggetto_pf');
                  ELSE
                      v_stato_id := script.fn_stato_proposto_id('anagrafiche.fn_crea_soggetto_pf');
                  END IF;

                  IF v_stato_id IS NULL THEN
                      -- Fix: E_GENERICO → E_CODICE
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_CODICE',
                          jsonb_build_object('codice_iso2', v_stato_iso2_resolved),
                          NULL::uuid,
                          v_stato_iso2_resolved, 'config.stati'
                      );
                  END IF;

                  -- Guard unicita CF per stato
                  IF EXISTS (
                      SELECT 1 FROM anagrafiche.soggetti
                       WHERE stato_id = v_stato_id
                         AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_codice_fiscale))
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_CF_DUPLICATO',
                          jsonb_build_object('codice_fiscale', p_codice_fiscale),
                          NULL::uuid, 'Codice fiscale gia'' presente in anagrafica.'
                      );
                  END IF;

                  -- Step 1: Creazione soggetto (Persona Fisica)
                  -- Il sesso passa com'e': se la natura lo pretende e manca, lo rifiuta
                  --   trgfn_soggetti_guard_sesso_policy (E_SESSO_OBBLIGATORIO, campo sesso).
                  INSERT INTO anagrafiche.soggetti (
                      cognome, nome, codice_fiscale, partita_iva, data_nascita, sesso,
                      stato_id, tipo_soggetto_dettaglio_id, comune_id, attivo
                  )
                  VALUES (
                      TRIM(p_cognome), TRIM(p_nome),
                      UPPER(TRIM(p_codice_fiscale)),
                      NULLIF(UPPER(TRIM(p_partita_iva)), ''),
                      p_data_nascita, p_sesso,
                      v_stato_id, p_tipo_soggetto_dettaglio_id,
                      p_comune_nascita_id, true
                  )
                  RETURNING id INTO v_soggetto_id;

                  -- Step 2: Creazione contatto default con tipo_contatto_id
                  --         (BB anagrafiche.fn_crea_contatto, rev 2026-10-17)
                  PERFORM anagrafiche.fn_crea_contatto(
                      v_soggetto_id, NULL,
                      jsonb_build_object('tipo_contatto_id', v_tipo_contatto_id,
                                         'nominativo',       TRIM(p_cognome) || ' ' || TRIM(p_nome),
                                         'email',            TRIM(p_email),
                                         'is_default',       true));

                  -- Step 3: i dati societari (rev 20261020-03). Quando scriverli lo decide
                  --   il BB della nascita, condiviso con fn_crea_soggetto_pg (regola del 2);
                  --   scrive il verbo, le regole restano nei trigger della tabella.
                  PERFORM anagrafiche.fn_scrivi_dati_societari_alla_nascita(
                      p_soggetto_id        := v_soggetto_id,
                      p_forma_giuridica_id := p_forma_giuridica_id,
                      p_id_prov_iscri_rea  := p_id_prov_iscri_rea,
                      p_iscrizione_rea     := p_iscrizione_rea,
                      p_capitale_sociale   := p_capitale_sociale,
                      p_socio_unico        := p_socio_unico,
                      p_liquidazione       := p_liquidazione,
                      p_destinatario_fe    := p_destinatario_fe,
                      p_pec_fatturazione   := p_pec_fatturazione,
                      p_codice_sdi         := p_codice_sdi,
                      p_data_costituzione  := p_data_costituzione
                  );

                  RETURN v_soggetto_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_soggetto_pf(
                  anagrafiche.soggetti.cognome%TYPE,
                  anagrafiche.soggetti.nome%TYPE,
                  anagrafiche.soggetti.codice_fiscale%TYPE,
                  anagrafiche.contatti.email%TYPE,
                  anagrafiche.soggetti.data_nascita%TYPE,
                  anagrafiche.soggetti.sesso%TYPE,
                  config.stati.codice_iso2%TYPE,
                  anagrafiche.soggetti.comune_id%TYPE,
                  config.tipi_contatti.id%TYPE,
                  config.tipi_soggetto_dettaglio.id%TYPE,
                  anagrafiche.soggetti.partita_iva%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE) IS
                  'Crea un soggetto PERSONA FISICA (natura base PF: privato PR o ditta individuale DI, scelta dal chiamante con p_tipo_soggetto_dettaglio_id, obbligatorio) + contatto default con tipo_contatto_id. Una natura che non e'' PF si rifiuta con E_SOGGETTO_CREAZIONE_NATURA_ERRATA (porta giusta: fn_crea_soggetto_pg). p_partita_iva per la DI (la pretende il guard su CF e P.IVA). Il sesso passa com''e'', senza default: quando serve lo decide config.tipi_soggetto_dettaglio.sesso_policy nel guard trgfn_soggetti_guard_sesso_policy (PR obbligatorio, DI facoltativo). Fallback tipo contatto: primo da config.tipi_contatti. Stato: p_stato_iso2 se detto (script.fn_stato_id_da_iso2, E_STATO_ISO2_AMBIGUO se indica piu'' stati, E_CODICE se nessuno), altrimenti lo stato proposto (script.fn_stato_proposto_id, rev 2026-10-18: via il ripiego a ''IT'' e il parametro soggetto_default_stato_iso2). Guard CF univoco. Dati societari dal BB anagrafiche.fn_scrivi_dati_societari_alla_nascita (rev 20261020-03). NON crea indirizzo. Rev 20261009-26, brief-db-sesso-senza-default. Rev 2026-10-17: il contatto lo scrive il BB anagrafiche.fn_crea_contatto (regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 3); comportamento invariato. Rev 20261020-03 (brief-db-dati-societari-in-creazione, E-1 (a)): i dati societari in coda (stessi nomi di fn_crea_soggetto_pg) e scritti nella stessa chiamata; quando scriverli lo decide anagrafiche.fn_scrivi_dati_societari_alla_nascita (policy REQUIRED o almeno un campo con un valore): la ditta individuale (OPTIONAL) li porta se passati, un privato (NONE) con la sezione lo rifiuta il guard della natura.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only, come 20261009-26: il corpo di prima e' quello di 20261018-89.
              SELECT 1;
