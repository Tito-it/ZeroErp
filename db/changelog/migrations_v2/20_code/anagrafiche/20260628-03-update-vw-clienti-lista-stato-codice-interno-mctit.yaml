#
# Bonifica naming stato (brief-naming-stato-codice-interno.md, dominio anagrafiche/clienti).
#
# PRIMA: sc.codice_interno AS stato_codice  (mislabel: immutabile col nome del mutabile).
# DOPO (alias fedele 1:1, linee-guida-sql §6c):
#   sc.codice_interno    AS stato_codice_interno   (logica)
#   sc.codice            AS stato_codice           (display)
#   sc.descrizione_breve AS stato_descrizione      (invariato)
#
# Vista foglia (sorgente ui.lista_definizione anagrafiche.clienti); nessun consumer
# DB a valle. BE/FE migrano la logica su stato_codice_interno.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260628-03-update-vw-clienti-lista-stato-codice-interno-mctit.yaml

  - changeSet:
      id: 20260628-03-update-vw-clienti-lista-stato-codice-interno
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_clienti_lista: alias fedele dello stato — stato_codice_interno
        (codice_interno) + stato_codice (codice). Bonifica mislabel.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: anagrafiche
            tableName: clienti
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS anagrafiche.vw_clienti_lista;
              CREATE VIEW anagrafiche.vw_clienti_lista AS
              SELECT
                cl.id,
                cl.soggetto_ruolo_id,
                cl.istanza_utility_id,
                cl.billing_account_id,
                s.id                        AS soggetto_id,
                s.codice                    AS soggetto_codice,
                ba.codice                   AS ba_codice,
                s.ragione_sociale_completa,
                s.codice_fiscale,
                s.partita_iva,
                s.id_fiscale_univoco_cf_piva,
                u.id                        AS utility_id,
                u.descrizione               AS utility_descrizione,
                sc.id                       AS stato_cliente_id,
                sc.codice_interno           AS stato_codice_interno,
                sc.codice                   AS stato_codice,
                sc.descrizione_breve        AS stato_descrizione,
                cl.data_attivazione,
                cl.data_sospensione,
                cl.data_riattivazione,
                cl.data_chiusura
              FROM anagrafiche.clienti cl
              JOIN anagrafiche.istanze_utilities iu ON iu.id = cl.istanza_utility_id
              JOIN anagrafiche.soggetti s             ON s.id  = iu.soggetto_id
              JOIN anagrafiche.billing_account ba     ON ba.id = cl.billing_account_id
              JOIN config.utilities u                 ON u.id  = cl.utility_id
              JOIN config.stati_cliente sc            ON sc.id = cl.stato_cliente_id;

              COMMENT ON VIEW anagrafiche.vw_clienti_lista IS
                'Vista flat clienti per la lista UI (anagrafiche.clienti). '
                'Espone anagrafica soggetto (incl. id_fiscale_univoco_cf_piva), codice BA, '
                'servizio, stato e date del ciclo di vita. stato_codice_interno = '
                'codice_interno (logica), stato_codice = codice (display). '
                'Sorgente dati per ui.lista_definizione codice=''anagrafiche.clienti''.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS anagrafiche.vw_clienti_lista;
