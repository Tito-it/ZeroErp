# Liquibase changelog per Zero ERP
# Viste unificate indirizzi (resolved) per soggetto e ruolo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251220-05-create-vw-indirizzi-resolved-all-mctit.yaml

  - changeSet:
      id: 20251220-05-create-vw-indirizzi-resolved-all
      author: mctit
      comment: >
        Crea le viste:
        - anagrafiche.vw_indirizzi_resolved_all (UNION ALL)
        Standardizza output (display + campi strutturati) per indirizzi normalizzati e liberi.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |


              -- ============================================================
              -- 3) RESOLVED ALL (UNION)
              -- ============================================================
              CREATE OR REPLACE VIEW anagrafiche.vw_indirizzi_resolved_all AS
              SELECT * FROM anagrafiche.vw_indirizzi_resolved_soggetto
              UNION ALL
              SELECT * FROM anagrafiche.vw_indirizzi_resolved_ruolo;

              COMMENT ON VIEW anagrafiche.vw_indirizzi_resolved_all
              IS 'Vista unificata (UNION ALL) degli indirizzi resolved: scope SOGGETTO + RUOLO.';
