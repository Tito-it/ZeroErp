# CLIENTE PA E SPLIT PAYMENT CONTRO LA NATURA: IL PREDICATO IN UN POSTO SOLO
#   anagrafiche.fn_regime_pa_campo_non_ammesso(natura, cliente_pa, split_payment) -> campo | NULL
#   Brief: brief-db-cambio-natura-soggetto-conferma-e-pulizia §0, giro 2.
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   Due sedi devono dire la stessa cosa: anagrafiche.trgfn_soggetti_guard_regime_pa
#   (ogni scrittura del soggetto) e la regola del cambio di natura
#   (fn_check_cambio_natura_soggetto, -66), che elenca i motivi prima del
#   salvataggio. E' la seconda occorrenza della stessa regola: si estrae, e il
#   guard la legge nello stesso giro (-62). Regola del 2, .codex/AGENTS.md.
#
# ── LA FORMA ────────────────────────────────────────────────────
#   Sui VALORI: il chiamante passa la natura e i due flag PROPOSTI (un BEFORE
#   ROW non rilegge la riga che sta cambiando). Risponde il nome del primo
#   campo non ammesso, nell'ordine in cui il guard li giudica (cliente_pa, poi
#   split_payment), o NULL. Natura NULL o inesistente: NULL — la natura
#   mancante la giudica il guard (E_DATO_FISCALE_SENZA_TIPO_SOGGETTO), quella
#   inesistente la FK. BEGIN ATOMIC (§5c).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-61-create-fn-regime-pa-campo-non-ammesso-mctit.yaml

  - changeSet:
      id: 20261114-61-create-fn-regime-pa-campo-non-ammesso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il primo flag del regime PA (cliente_pa, split_payment) proposto a S che la natura
        non ammette, o NULL: sede unica del predicato.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_regime_pa_campo_non_ammesso(
                  p_tipo_soggetto_dettaglio_id config.tipi_soggetto_dettaglio.id%TYPE,
                  p_cliente_pa                 anagrafiche.soggetti.cliente_pa%TYPE,
                  p_split_payment              anagrafiche.soggetti.split_payment%TYPE)
              RETURNS text  -- il nome di una colonna, non il riflesso di un suo valore
              LANGUAGE sql
              STABLE
              BEGIN ATOMIC
                  SELECT CASE
                             WHEN p_cliente_pa = 'S' AND NOT tsd.cliente_pa_ammesso
                                 THEN 'cliente_pa'
                             WHEN p_split_payment = 'S' AND NOT tsd.split_payment_ammesso
                                 THEN 'split_payment'
                         END
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = p_tipo_soggetto_dettaglio_id;
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION anagrafiche.fn_regime_pa_campo_non_ammesso(
                  config.tipi_soggetto_dettaglio.id%TYPE,
                  anagrafiche.soggetti.cliente_pa%TYPE,
                  anagrafiche.soggetti.split_payment%TYPE)
              IS 'Il primo flag del regime PA proposto a S che la natura di dettaglio non ammette: ''cliente_pa'' se cliente_pa = S e config.tipi_soggetto_dettaglio.cliente_pa_ammesso e'' falso, altrimenti ''split_payment'' se split_payment = S e split_payment_ammesso e'' falso; NULL se entrambi sono ammessi, o se la natura e'' NULL o non esiste. Sui valori proposti, non sulla riga salvata. Sede unica del predicato: la leggono anagrafiche.trgfn_soggetti_guard_regime_pa e anagrafiche.fn_check_cambio_natura_soggetto.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP FUNCTION IF EXISTS anagrafiche.fn_regime_pa_campo_non_ammesso(bigint, character, character);
