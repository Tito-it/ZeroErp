# ------------------------------------------------------------
# SPDX-License-Identifier: AGPL-3.0-or-later
# Liquibase changelog per Zero ERP
#
# Fix: fn_crea_soggetto_pf e fn_crea_soggetto_pg
# Sostituisce E_GENERICO con codici errore specifici:
#   - E_CODICE (id 112) per lookup falliti su config.stati
#     e config.tipi_soggetto_dettaglio
# Nessuna modifica alla logica, solo codici errore piu' precisi.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/anagrafiche/20260331-01-fix-fn-crea-soggetto-pf-pg-e-generico-mctit.yaml

    - changeSet:
          id: 20260331-01-fix-fn-crea-soggetto-pf-e-generico
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_crea_soggetto_pf: sostituisce E_GENERICO con E_CODICE
              per lookup stato (config.stati) e tipo soggetto dettaglio
              (config.tipi_soggetto_dettaglio). Nessuna modifica alla logica.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_crea_soggetto_pf
                        --
                        -- Scopo: crea un soggetto Persona Fisica (natura PR = Privato)
                        --        con contatto default tipizzato.
                        --
                        -- Regole:
                        --   - p_cognome, p_nome, p_codice_fiscale, p_email obbligatori
                        --   - p_tipo_contatto_id opzionale: se NULL, fallback al primo
                        --     tipo contatto da config.tipi_contatti (ORDER BY id LIMIT 1)
                        --   - Guard se nessun tipo contatto esiste nella tabella
                        --   - Default p_stato_iso2 da config.parameters
                        --   - Guard CF univoco per stato
                        --   - NON crea indirizzo (responsabilita del chiamante)
                        --
                        -- Fix 20260331: E_GENERICO → E_CODICE per lookup falliti
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_soggetto_pf(
                            p_cognome             anagrafiche.soggetti.cognome%TYPE           DEFAULT NULL,
                            p_nome                anagrafiche.soggetti.nome%TYPE              DEFAULT NULL,
                            p_codice_fiscale      anagrafiche.soggetti.codice_fiscale%TYPE    DEFAULT NULL,
                            p_email               anagrafiche.contatti.email%TYPE             DEFAULT NULL,
                            p_data_nascita        anagrafiche.soggetti.data_nascita%TYPE      DEFAULT NULL,
                            p_sesso               anagrafiche.soggetti.sesso%TYPE             DEFAULT NULL,
                            p_stato_iso2          config.stati.codice_iso2%TYPE               DEFAULT NULL,
                            p_comune_nascita_id   anagrafiche.soggetti.comune_id%TYPE         DEFAULT NULL,
                            p_tipo_contatto_id    config.tipi_contatti.id%TYPE                DEFAULT NULL
                        )
                        RETURNS anagrafiche.soggetti.id%TYPE
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_tipo_soggetto_dettaglio_id  config.tipi_soggetto_dettaglio.id%TYPE;
                            v_stato_id                    config.stati.id%TYPE;
                            v_stato_iso2_resolved         config.stati.codice_iso2%TYPE;
                            v_tipo_contatto_id            config.tipi_contatti.id%TYPE;
                            v_soggetto_id                 anagrafiche.soggetti.id%TYPE;
                        BEGIN
                            -- Validazione parametri obbligatori
                            IF p_cognome IS NULL OR TRIM(p_cognome) = '' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_cognome'),
                                    NULL::uuid, 'Cognome obbligatorio.'
                                );
                            END IF;

                            IF p_nome IS NULL OR TRIM(p_nome) = '' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_nome'),
                                    NULL::uuid, 'Nome obbligatorio.'
                                );
                            END IF;

                            IF p_codice_fiscale IS NULL OR TRIM(p_codice_fiscale) = '' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_codice_fiscale'),
                                    NULL::uuid, 'Codice fiscale obbligatorio.'
                                );
                            END IF;

                            IF p_email IS NULL OR TRIM(p_email) = '' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_email'),
                                    NULL::uuid, 'Email obbligatoria (usata per contatto default).'
                                );
                            END IF;

                            -- Tipo contatto: fallback al primo dalla tabella se non fornito
                            v_tipo_contatto_id := COALESCE(
                                p_tipo_contatto_id,
                                (SELECT id FROM config.tipi_contatti ORDER BY id LIMIT 1)
                            );

                            IF v_tipo_contatto_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_tipo_contatto_id'),
                                    NULL::uuid,
                                    'Tipo contatto obbligatorio e nessun tipo contatto trovato in config.tipi_contatti.'
                                );
                            END IF;

                            -- Lookup tipo soggetto dettaglio (Persona Fisica — natura PR)
                            SELECT tsd.id INTO v_tipo_soggetto_dettaglio_id
                            FROM config.tipi_soggetto_dettaglio tsd
                            WHERE tsd.codice_interno = 'PR';

                            IF v_tipo_soggetto_dettaglio_id IS NULL THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_CODICE',
                                    jsonb_build_object('codice_interno', 'PR'),
                                    NULL::uuid,
                                    'PR', 'config.tipi_soggetto_dettaglio'
                                );
                            END IF;

                            -- Stato (nazionalita) — default da config.parameters
                            v_stato_iso2_resolved := COALESCE(
                                p_stato_iso2,
                                (SELECT default_value FROM config.parameters
                                  WHERE code = 'soggetto_default_stato_iso2'),
                                'IT'
                            );

                            SELECT id INTO v_stato_id
                            FROM config.stati
                            WHERE codice_iso2 = v_stato_iso2_resolved;

                            IF v_stato_id IS NULL THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_CODICE',
                                    jsonb_build_object('codice_iso2', v_stato_iso2_resolved),
                                    NULL::uuid,
                                    v_stato_iso2_resolved, 'config.stati'
                                );
                            END IF;

                            -- Guard unicita CF per stato
                            IF EXISTS (
                                SELECT 1 FROM anagrafiche.soggetti
                                 WHERE stato_id = v_stato_id
                                   AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_codice_fiscale))
                            ) THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pf',
                                    'E_ADMIN_CF_DUPLICATO',
                                    jsonb_build_object('codice_fiscale', p_codice_fiscale),
                                    NULL::uuid, 'Codice fiscale gia'' presente in anagrafica.'
                                );
                            END IF;

                            -- Step 1: Creazione soggetto (Persona Fisica)
                            INSERT INTO anagrafiche.soggetti (
                                cognome, nome, codice_fiscale, data_nascita, sesso,
                                stato_id, tipo_soggetto_dettaglio_id, comune_id, attivo
                            )
                            VALUES (
                                TRIM(p_cognome), TRIM(p_nome),
                                UPPER(TRIM(p_codice_fiscale)),
                                p_data_nascita, COALESCE(p_sesso, 'M'),
                                v_stato_id, v_tipo_soggetto_dettaglio_id,
                                p_comune_nascita_id, true
                            )
                            RETURNING id INTO v_soggetto_id;

                            -- Step 2: Creazione contatto default con tipo_contatto_id
                            INSERT INTO anagrafiche.contatti (
                                soggetto_id, tipo_contatto_id, nominativo, email, is_default
                            )
                            VALUES (
                                v_soggetto_id,
                                v_tipo_contatto_id,
                                TRIM(p_cognome) || ' ' || TRIM(p_nome),
                                TRIM(p_email),
                                true
                            );

                            RETURN v_soggetto_id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION anagrafiche.fn_crea_soggetto_pf(text, text, text, character varying, date, character, character, integer, integer) IS
                          'Crea soggetto PF (natura PR) + contatto default con tipo_contatto_id. Fallback tipo contatto: primo da config.tipi_contatti. Default stato_iso2 da config.parameters. Guard CF univoco. NON crea indirizzo.';

    - changeSet:
          id: 20260331-01-fix-fn-crea-soggetto-pg-e-generico
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_crea_soggetto_pg: sostituisce E_GENERICO con E_CODICE
              per lookup stato (config.stati). Nessuna modifica alla logica.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_crea_soggetto_pg
                        --
                        -- Scopo: crea un soggetto Persona Giuridica con contatto
                        --        default tipizzato e dati societari (se policy).
                        --
                        -- Regole:
                        --   - p_ragione_sociale, p_tipo_soggetto_dettaglio_id, p_email obbligatori
                        --   - p_tipo_contatto_id opzionale: fallback al primo tipo contatto
                        --   - Default stato_iso2, socio_unico, liquidazione da config.parameters
                        --   - Dati societari creati se policy REQUIRED o se almeno un campo DS fornito
                        --   - Guard CF/PIVA univoci per stato (se forniti)
                        --   - NON crea indirizzi ne assegna ruoli
                        --
                        -- Fix 20260331: E_GENERICO → E_CODICE per lookup stato fallito
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_soggetto_pg(
                            p_ragione_sociale              anagrafiche.soggetti.ragione_sociale%TYPE,
                            p_tipo_soggetto_dettaglio_id   config.tipi_soggetto_dettaglio.id%TYPE,
                            p_email                        anagrafiche.contatti.email%TYPE,
                            p_codice_fiscale               anagrafiche.soggetti.codice_fiscale%TYPE      DEFAULT NULL,
                            p_partita_iva                  anagrafiche.soggetti.partita_iva%TYPE          DEFAULT NULL,
                            p_stato_iso2                   config.stati.codice_iso2%TYPE                  DEFAULT NULL,
                            p_forma_giuridica_id           anagrafiche.dati_societari.forma_giuridica_id%TYPE DEFAULT NULL,
                            p_id_prov_iscri_rea            anagrafiche.dati_societari.id_prov_iscri_rea%TYPE  DEFAULT NULL,
                            p_iscrizione_rea               anagrafiche.dati_societari.iscrizione_rea%TYPE     DEFAULT NULL,
                            p_capitale_sociale             anagrafiche.dati_societari.capitale_sociale%TYPE   DEFAULT NULL,
                            p_socio_unico                  anagrafiche.socio_unico_enum                      DEFAULT NULL,
                            p_liquidazione                 anagrafiche.liquidazione_enum                      DEFAULT NULL,
                            p_destinatario_fe              anagrafiche.dati_societari.destinatario_fe%TYPE    DEFAULT NULL,
                            p_pec_fatturazione             anagrafiche.dati_societari.pec_fatturazione%TYPE   DEFAULT NULL,
                            p_codice_sdi                   anagrafiche.dati_societari.codice_sdi%TYPE         DEFAULT NULL,
                            p_tipo_contatto_id             config.tipi_contatti.id%TYPE                       DEFAULT NULL
                        )
                        RETURNS anagrafiche.soggetti.id%TYPE
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_stato_id                    config.stati.id%TYPE;
                            v_stato_iso2_resolved         config.stati.codice_iso2%TYPE;
                            v_dati_societari_policy       config.tipi_soggetto_dettaglio.dati_societari_policy%TYPE;
                            v_socio_unico_resolved        anagrafiche.dati_societari.socio_unico%TYPE;
                            v_liquidazione_resolved       anagrafiche.dati_societari.liquidazione%TYPE;
                            v_tipo_contatto_id            config.tipi_contatti.id%TYPE;
                            v_soggetto_id                 anagrafiche.soggetti.id%TYPE;
                        BEGIN
                            -- Validazione parametri obbligatori
                            IF p_ragione_sociale IS NULL OR TRIM(p_ragione_sociale) = '' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pg',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_ragione_sociale'),
                                    NULL::uuid, 'Ragione sociale obbligatoria.'
                                );
                            END IF;

                            IF p_tipo_soggetto_dettaglio_id IS NULL OR p_tipo_soggetto_dettaglio_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pg',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_tipo_soggetto_dettaglio_id'),
                                    NULL::uuid, 'Tipo soggetto dettaglio obbligatorio e > 0.'
                                );
                            END IF;

                            -- Verifica che il tipo soggetto esista e recupera policy dati societari
                            SELECT tsd.dati_societari_policy
                              INTO v_dati_societari_policy
                              FROM config.tipi_soggetto_dettaglio tsd
                             WHERE tsd.id = p_tipo_soggetto_dettaglio_id;

                            IF v_dati_societari_policy IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pg',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('p_tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id),
                                    NULL::uuid,
                                    concat('Tipo soggetto dettaglio id=', p_tipo_soggetto_dettaglio_id, ' non trovato.')
                                );
                            END IF;

                            IF p_email IS NULL OR TRIM(p_email) = '' THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pg',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_email'),
                                    NULL::uuid, 'Email obbligatoria (usata per contatto default).'
                                );
                            END IF;

                            -- Tipo contatto: fallback al primo dalla tabella se non fornito
                            v_tipo_contatto_id := COALESCE(
                                p_tipo_contatto_id,
                                (SELECT id FROM config.tipi_contatti ORDER BY id LIMIT 1)
                            );

                            IF v_tipo_contatto_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pg',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_tipo_contatto_id'),
                                    NULL::uuid,
                                    'Tipo contatto obbligatorio e nessun tipo contatto trovato in config.tipi_contatti.'
                                );
                            END IF;

                            -- Risoluzione default da config.parameters
                            -- Stato (nazionalita)
                            v_stato_iso2_resolved := COALESCE(
                                p_stato_iso2,
                                (SELECT default_value FROM config.parameters
                                  WHERE code = 'soggetto_default_stato_iso2'),
                                'IT'
                            );

                            SELECT id INTO v_stato_id
                              FROM config.stati
                             WHERE codice_iso2 = v_stato_iso2_resolved;

                            IF v_stato_id IS NULL THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_crea_soggetto_pg',
                                    'E_CODICE',
                                    jsonb_build_object('codice_iso2', v_stato_iso2_resolved),
                                    NULL::uuid,
                                    v_stato_iso2_resolved, 'config.stati'
                                );
                            END IF;

                            -- Socio unico e liquidazione (default da config.parameters)
                            v_socio_unico_resolved := COALESCE(
                                p_socio_unico,
                                (SELECT default_value FROM config.parameters
                                  WHERE code = 'dati_societari_default_socio_unico')::anagrafiche.socio_unico_enum,
                                'SU'::anagrafiche.socio_unico_enum
                            );

                            v_liquidazione_resolved := COALESCE(
                                p_liquidazione,
                                (SELECT default_value FROM config.parameters
                                  WHERE code = 'dati_societari_default_liquidazione')::anagrafiche.liquidazione_enum,
                                'LN'::anagrafiche.liquidazione_enum
                            );

                            -- Guard unicita CF/PIVA per stato (se forniti)
                            IF p_codice_fiscale IS NOT NULL AND TRIM(p_codice_fiscale) <> '' THEN
                                IF EXISTS (
                                    SELECT 1 FROM anagrafiche.soggetti
                                     WHERE stato_id = v_stato_id
                                       AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_codice_fiscale))
                                ) THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'anagrafiche.fn_crea_soggetto_pg',
                                        'E_ADMIN_CF_DUPLICATO',
                                        jsonb_build_object('codice_fiscale', p_codice_fiscale),
                                        NULL::uuid, 'Codice fiscale gia'' presente in anagrafica.'
                                    );
                                END IF;
                            END IF;

                            IF p_partita_iva IS NOT NULL AND TRIM(p_partita_iva) <> '' THEN
                                IF EXISTS (
                                    SELECT 1 FROM anagrafiche.soggetti
                                     WHERE stato_id = v_stato_id
                                       AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_partita_iva))
                                ) THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'anagrafiche.fn_crea_soggetto_pg',
                                        'E_ADMIN_PIVA_DUPLICATA',
                                        jsonb_build_object('partita_iva', p_partita_iva),
                                        NULL::uuid, 'Partita IVA gia'' presente in anagrafica.'
                                    );
                                END IF;
                            END IF;

                            -- Step 1: Creazione soggetto (Persona Giuridica)
                            INSERT INTO anagrafiche.soggetti (
                                ragione_sociale, codice_fiscale, partita_iva,
                                stato_id, tipo_soggetto_dettaglio_id, attivo
                            )
                            VALUES (
                                TRIM(p_ragione_sociale),
                                CASE WHEN p_codice_fiscale IS NOT NULL AND TRIM(p_codice_fiscale) <> ''
                                     THEN UPPER(TRIM(p_codice_fiscale))
                                     ELSE NULL
                                END,
                                CASE WHEN p_partita_iva IS NOT NULL AND TRIM(p_partita_iva) <> ''
                                     THEN UPPER(TRIM(p_partita_iva))
                                     ELSE NULL
                                END,
                                v_stato_id, p_tipo_soggetto_dettaglio_id, true
                            )
                            RETURNING id INTO v_soggetto_id;

                            -- Step 2: Creazione contatto default con tipo_contatto_id
                            INSERT INTO anagrafiche.contatti (
                                soggetto_id, tipo_contatto_id, nominativo, email, is_default
                            )
                            VALUES (
                                v_soggetto_id,
                                v_tipo_contatto_id,
                                TRIM(p_ragione_sociale),
                                TRIM(p_email),
                                true
                            );

                            -- Step 3: Creazione dati societari (se policy lo richiede
                            --         o se almeno un campo DS e fornito con policy OPTIONAL)
                            IF v_dati_societari_policy = 'REQUIRED'
                               OR (v_dati_societari_policy = 'OPTIONAL' AND (
                                    p_id_prov_iscri_rea IS NOT NULL
                                    OR p_iscrizione_rea IS NOT NULL
                                    OR p_capitale_sociale IS NOT NULL
                                    OR p_forma_giuridica_id IS NOT NULL
                                    OR p_destinatario_fe IS NOT NULL
                                    OR p_pec_fatturazione IS NOT NULL
                                    OR p_codice_sdi IS NOT NULL
                                  ))
                            THEN
                                -- Guard campi NOT NULL di dati_societari
                                IF p_id_prov_iscri_rea IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'anagrafiche.fn_crea_soggetto_pg',
                                        'E_ADMIN_VALIDAZIONE',
                                        jsonb_build_object('parametro', 'p_id_prov_iscri_rea'),
                                        NULL::uuid,
                                        'Provincia iscrizione REA obbligatoria per dati societari.'
                                    );
                                END IF;

                                IF p_iscrizione_rea IS NULL OR TRIM(p_iscrizione_rea) = '' THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'anagrafiche.fn_crea_soggetto_pg',
                                        'E_ADMIN_VALIDAZIONE',
                                        jsonb_build_object('parametro', 'p_iscrizione_rea'),
                                        NULL::uuid,
                                        'Iscrizione REA obbligatoria per dati societari.'
                                    );
                                END IF;

                                IF p_capitale_sociale IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'anagrafiche.fn_crea_soggetto_pg',
                                        'E_ADMIN_VALIDAZIONE',
                                        jsonb_build_object('parametro', 'p_capitale_sociale'),
                                        NULL::uuid,
                                        'Capitale sociale obbligatorio per dati societari.'
                                    );
                                END IF;

                                IF p_destinatario_fe IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database', 'anagrafiche.fn_crea_soggetto_pg',
                                        'E_ADMIN_VALIDAZIONE',
                                        jsonb_build_object('parametro', 'p_destinatario_fe'),
                                        NULL::uuid,
                                        'Destinatario FE obbligatorio per dati societari (P=PEC, C=Codice SDI).'
                                    );
                                END IF;

                                INSERT INTO anagrafiche.dati_societari (
                                    soggetto_id, capitale_sociale,
                                    id_prov_iscri_rea, iscrizione_rea,
                                    socio_unico, liquidazione,
                                    destinatario_fe, pec_fatturazione, codice_sdi,
                                    forma_giuridica_id
                                )
                                VALUES (
                                    v_soggetto_id, p_capitale_sociale,
                                    p_id_prov_iscri_rea, TRIM(p_iscrizione_rea),
                                    v_socio_unico_resolved, v_liquidazione_resolved,
                                    p_destinatario_fe, TRIM(p_pec_fatturazione), TRIM(p_codice_sdi),
                                    p_forma_giuridica_id
                                );
                            END IF;

                            RETURN v_soggetto_id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION anagrafiche.fn_crea_soggetto_pg IS
                          'Crea soggetto PG + contatto default con tipo_contatto_id + dati societari (se policy). Fallback tipo contatto: primo da config.tipi_contatti. Default stato_iso2, socio_unico, liquidazione da config.parameters. NON crea indirizzi ne assegna ruoli.';

    - changeSet:
          id: 20260331-01-fix-fn-get-or-create-indirizzo-dettaglio-e-generico
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_get_or_create_indirizzo_dettaglio: sostituisce E_GENERICO
              con E_CODICE per lookup stradario fallito. Nessuna modifica alla logica.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_get_or_create_indirizzo_dettaglio
                        --
                        -- Scopo: upsert indirizzo dettaglio (civico normalizzato).
                        --        Cerca per chiave naturale; se non esiste, lo crea.
                        --
                        -- Regole:
                        --   - p_stradario_id obbligatorio e > 0
                        --   - Cerca per chiave naturale allineata a uq_indirizzi_dettaglio_norm
                        --   - Gestisce race condition (EXCEPTION WHEN unique_violation)
                        --   - I trigger calcolano: via_norm, civico_norm, indirizzo_normalizzato
                        --
                        -- Fix 20260331: E_GENERICO → E_CODICE per lookup stradario fallito
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION anagrafiche.fn_get_or_create_indirizzo_dettaglio(
                            p_stradario_id      config.stradario.id%TYPE,
                            p_civico            anagrafiche.indirizzi_dettaglio.civico%TYPE            DEFAULT NULL,
                            p_estensione_civico anagrafiche.indirizzi_dettaglio.estensione_civico%TYPE DEFAULT NULL,
                            p_palazzina         anagrafiche.indirizzi_dettaglio.palazzina%TYPE         DEFAULT NULL,
                            p_scala             anagrafiche.indirizzi_dettaglio.scala%TYPE             DEFAULT NULL,
                            p_piano             anagrafiche.indirizzi_dettaglio.piano%TYPE             DEFAULT NULL,
                            p_interno           anagrafiche.indirizzi_dettaglio.interno%TYPE           DEFAULT NULL
                        )
                        RETURNS anagrafiche.indirizzi_dettaglio.id%TYPE
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_id  anagrafiche.indirizzi_dettaglio.id%TYPE;
                        BEGIN
                            -- Guard: p_stradario_id obbligatorio
                            IF p_stradario_id IS NULL OR p_stradario_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_get_or_create_indirizzo_dettaglio',
                                    'E_ADMIN_VALIDAZIONE',
                                    jsonb_build_object('parametro', 'p_stradario_id',
                                                      'valore', p_stradario_id),
                                    NULL::uuid,
                                    'p_stradario_id obbligatorio e deve essere > 0.'
                                );
                            END IF;

                            -- Guard: verificare che lo stradario esista
                            IF NOT EXISTS (
                                SELECT 1 FROM config.stradario WHERE id = p_stradario_id
                            ) THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database', 'anagrafiche.fn_get_or_create_indirizzo_dettaglio',
                                    'E_CODICE',
                                    jsonb_build_object('stradario_id', p_stradario_id),
                                    NULL::uuid,
                                    p_stradario_id::text, 'config.stradario'
                                );
                            END IF;

                            -- Ricerca per chiave naturale
                            -- Allineata al vincolo uq_indirizzi_dettaglio_norm
                            SELECT id INTO v_id
                            FROM anagrafiche.indirizzi_dettaglio
                            WHERE stradario_id = p_stradario_id
                              AND civico IS NOT DISTINCT FROM p_civico
                              AND COALESCE(estensione_civico, '') = COALESCE(p_estensione_civico, '')
                              AND COALESCE(palazzina, '')         = COALESCE(p_palazzina, '')
                              AND COALESCE(scala, '')             = COALESCE(p_scala, '')
                              AND COALESCE(piano, '')             = COALESCE(p_piano, '')
                              AND COALESCE(interno, '')           = COALESCE(p_interno, '');

                            IF v_id IS NOT NULL THEN
                                -- Civico gia' esistente: restituisce id
                                RETURN v_id;
                            END IF;

                            -- Creazione nuovo civico
                            -- I trigger calcolano: via_norm, civico_norm,
                            -- indirizzo_normalizzato, audit, tx_id
                            --
                            -- NOTA: la query di ricerca per chiave naturale e' volutamente
                            -- duplicata nel blocco EXCEPTION WHEN unique_violation.
                            -- Scelta progettuale: il pattern SELECT → INSERT → ri-SELECT
                            -- e' piu' leggibile e manutenibile rispetto a INSERT ON CONFLICT
                            -- DO NOTHING + fallback, e il caso race condition e' raro.
                            -- Se la chiave naturale cambia, aggiornare entrambe le SELECT.
                            BEGIN
                                INSERT INTO anagrafiche.indirizzi_dettaglio (
                                    stradario_id, civico, estensione_civico,
                                    palazzina, scala, piano, interno
                                )
                                VALUES (
                                    p_stradario_id, p_civico, p_estensione_civico,
                                    p_palazzina, p_scala, p_piano, p_interno
                                )
                                RETURNING id INTO v_id;

                                RETURN v_id;

                            EXCEPTION WHEN unique_violation THEN
                                -- Race condition: un'altra sessione ha inserito lo stesso
                                -- civico tra la SELECT e l'INSERT. Rileggiamo.
                                SELECT id INTO v_id
                                FROM anagrafiche.indirizzi_dettaglio
                                WHERE stradario_id = p_stradario_id
                                  AND civico IS NOT DISTINCT FROM p_civico
                                  AND COALESCE(estensione_civico, '') = COALESCE(p_estensione_civico, '')
                                  AND COALESCE(palazzina, '')         = COALESCE(p_palazzina, '')
                                  AND COALESCE(scala, '')             = COALESCE(p_scala, '')
                                  AND COALESCE(piano, '')             = COALESCE(p_piano, '')
                                  AND COALESCE(interno, '')           = COALESCE(p_interno, '');

                                RETURN v_id;
                            END;
                        END;
                        $function$;

                        COMMENT ON FUNCTION anagrafiche.fn_get_or_create_indirizzo_dettaglio IS
                          'Building block: upsert indirizzo dettaglio (civico). Cerca per chiave naturale, crea se non esiste. Gestisce race condition. Riusabile da orchestratori.';

    - changeSet:
          id: 20260331-01-fix-trgfn-clienti-sync-utility-from-ba-e-generico
          author: mctit
          runOnChange: false
          comment: >
              Fix trgfn_clienti_sync_utility_from_ba: sostituisce 3 E_GENERICO
              con codici specifici: E_CODICE (utility non trovata),
              E_PDP_OBBLIGATORIO, E_PDP_UTILITY_MISMATCH.
              Aggiunge %TYPE alle variabili DECLARE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- trgfn_clienti_sync_utility_from_ba
                        --
                        -- Scopo: garantisce coerenza tra clienti.utility_id e
                        --        billing_account.utility_id. Applica policy
                        --        config.utilities.richiede_pdp. Valida coerenza
                        --        utility con PDP quando presente.
                        --
                        -- Regole:
                        --   - Se billing_account_id IS NULL → noop
                        --   - Sincronizza utility_id dal billing_account
                        --   - Errore se utility_id del cliente non corrisponde
                        --   - Se utility.richiede_pdp = true → pdp_id obbligatorio
                        --   - Se pdp_id presente → utility del PDP deve corrispondere
                        --
                        -- Fix 20260331: E_GENERICO → E_CODICE, E_PDP_OBBLIGATORIO,
                        --              E_PDP_UTILITY_MISMATCH. %TYPE su DECLARE.
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION anagrafiche.trgfn_clienti_sync_utility_from_ba()
                        RETURNS trigger
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_utility_id     config.utilities.id%TYPE;
                            v_pdp_utility_id anagrafiche.pdp.utility_id%TYPE;
                            v_richiede_pdp   config.utilities.richiede_pdp%TYPE := false;
                        BEGIN
                            -- Nessun billing_account: niente da sincronizzare
                            IF NEW.billing_account_id IS NULL THEN
                                RETURN NEW;
                            END IF;

                            -- Recupera utility_id dal billing_account
                            SELECT ba.utility_id
                              INTO v_utility_id
                              FROM anagrafiche.billing_account ba
                             WHERE ba.id = NEW.billing_account_id;

                            IF v_utility_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'anagrafiche.trgfn_clienti_sync_utility_from_ba',
                                    'E_BILLING_ACCOUNT_UTILITY_NULL',
                                    jsonb_build_object('billing_account_id', NEW.billing_account_id),
                                    NEW.tx_id,
                                    coalesce(NEW.billing_account_id::text, 'NULL')
                                );
                            END IF;

                            -- Sincronizza o verifica coerenza utility_id
                            IF NEW.utility_id IS NULL THEN
                                NEW.utility_id := v_utility_id;
                            ELSIF NEW.utility_id <> v_utility_id THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'anagrafiche.trgfn_clienti_sync_utility_from_ba',
                                    'E_CLIENTE_UTILITY_MISMATCH_BA',
                                    jsonb_build_object(
                                        'billing_account_id', NEW.billing_account_id,
                                        'utility_da_cliente', NEW.utility_id,
                                        'utility_da_billing', v_utility_id
                                    ),
                                    NEW.tx_id,
                                    coalesce(NEW.billing_account_id::text, 'NULL'),
                                    coalesce(NEW.utility_id::text, 'NULL'),
                                    coalesce(v_utility_id::text, 'NULL')
                                );
                            END IF;

                            -- Verifica policy richiede_pdp dalla utility
                            SELECT coalesce(u.richiede_pdp, false)
                              INTO v_richiede_pdp
                              FROM config.utilities u
                             WHERE u.id = v_utility_id;

                            IF NOT FOUND THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'anagrafiche.trgfn_clienti_sync_utility_from_ba',
                                    'E_CODICE',
                                    jsonb_build_object('utility_id', v_utility_id),
                                    NEW.tx_id,
                                    v_utility_id::text, 'config.utilities'
                                );
                            END IF;

                            -- Guard: PDP obbligatorio se utility lo richiede
                            IF v_richiede_pdp AND NEW.pdp_id IS NULL THEN
                                -- Fix: E_GENERICO → E_PDP_OBBLIGATORIO
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'anagrafiche.trgfn_clienti_sync_utility_from_ba',
                                    'E_PDP_OBBLIGATORIO',
                                    jsonb_build_object(
                                        'billing_account_id', NEW.billing_account_id,
                                        'utility_id', v_utility_id
                                    ),
                                    NEW.tx_id,
                                    v_utility_id::text,
                                    coalesce(NEW.billing_account_id::text, 'NULL')
                                );
                            END IF;

                            -- Guard: coerenza utility tra billing_account e PDP
                            IF NEW.pdp_id IS NOT NULL THEN
                                SELECT p.utility_id
                                  INTO v_pdp_utility_id
                                  FROM anagrafiche.pdp p
                                 WHERE p.id = NEW.pdp_id;

                                IF v_pdp_utility_id IS NULL OR v_pdp_utility_id::integer <> v_utility_id THEN
                                    -- Fix: E_GENERICO → E_PDP_UTILITY_MISMATCH
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'anagrafiche.trgfn_clienti_sync_utility_from_ba',
                                        'E_PDP_UTILITY_MISMATCH',
                                        jsonb_build_object(
                                            'billing_account_id', NEW.billing_account_id,
                                            'pdp_id', NEW.pdp_id,
                                            'utility_da_billing', v_utility_id,
                                            'utility_da_pdp', v_pdp_utility_id
                                        ),
                                        NEW.tx_id,
                                        coalesce(NEW.billing_account_id::text, 'NULL'),
                                        coalesce(NEW.pdp_id::text, 'NULL'),
                                        v_utility_id::text,
                                        coalesce(v_pdp_utility_id::text, 'NULL')
                                    );
                                END IF;
                            END IF;

                            RETURN NEW;
                        END;
                        $function$;

                        COMMENT ON FUNCTION anagrafiche.trgfn_clienti_sync_utility_from_ba()
                          IS 'Coerenza clienti.utility_id ↔ billing_account.utility_id; policy richiede_pdp; coerenza utility ↔ PDP.';
