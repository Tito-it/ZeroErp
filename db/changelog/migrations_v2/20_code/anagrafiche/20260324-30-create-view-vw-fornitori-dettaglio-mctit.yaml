# Liquibase changelog per Zero ERP
#
# Vista anagrafiche.vw_fornitori_dettaglio:
#   Espone per ogni fornitore i dati consolidati di soggetto,
#   stato operativo, pagamento e dati fiscali.
#   Usata come source per API list/search fornitori.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20260324-30-create-view-vw-fornitori-dettaglio-mctit.yaml

  - changeSet:
      id: 20260324-30-create-view-vw-fornitori-dettaglio
      author: mctit
      runOnChange: false
      comment: >
        Vista consolidata fornitori con join su soggetto, stato,
        modalita/termini pagamento, valuta. Pattern allineato a
        vw_clienti_codice_ba.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS anagrafiche.vw_fornitori_dettaglio;

              CREATE OR REPLACE VIEW anagrafiche.vw_fornitori_dettaglio AS
              -- Vista flat fornitore → soggetto → stato → pagamento → fiscale.
              -- Colonne organizzate per area funzionale.
              SELECT
                -- identita fornitore
                f.id,
                f.uid,
                f.codice,
                f.attivo,
                f.soggetto_ruolo_id,
                -- stato operativo
                f.stato_fornitore_id,
                sf.codice_interno           AS stato_codice,
                sf.descrizione              AS stato_descrizione,
                sf.descrizione_breve        AS stato_descrizione_breve,
                sf.blocca_ordini,
                -- soggetto (identita anagrafica)
                s.id                        AS soggetto_id,
                s.ragione_sociale_completa,
                s.codice_fiscale,
                s.partita_iva,
                -- pagamento
                f.valuta_id,
                v.iso_code                  AS valuta_iso,
                f.modalita_pagamento_id,
                mp.codice                   AS modalita_pagamento_codice,
                mp.descrizione              AS modalita_pagamento_desc,
                f.termine_pagamento_id,
                tp.codice                   AS termine_pagamento_codice,
                f.giorni_pagamento,
                f.fine_mese,
                -- fiscale
                f.split_payment,
                f.ritenuta_acconto,
                f.ritenuta_aliquota,
                f.regime_fiscale,
                f.bollo_esente,
                -- fatturazione elettronica
                f.canale_fe,
                f.pec_email,
                -- rating / qualifica
                f.rating,
                f.qualifica_scadenza,
                -- audit
                f.data_insert,
                f.data_update
              FROM anagrafiche.fornitori f
                JOIN anagrafiche.soggetti_ruoli sr
                  ON sr.id = f.soggetto_ruolo_id
                JOIN anagrafiche.soggetti s
                  ON s.id  = sr.soggetto_id
                LEFT JOIN config.stati_fornitore sf
                  ON sf.id = f.stato_fornitore_id
                LEFT JOIN config.valute v
                  ON v.id  = f.valuta_id
                LEFT JOIN config.modalita_pagamento mp
                  ON mp.id = f.modalita_pagamento_id
                LEFT JOIN config.termini_pagamento tp
                  ON tp.id = f.termine_pagamento_id;

              COMMENT ON VIEW anagrafiche.vw_fornitori_dettaglio IS
                'Vista consolidata fornitori: identita soggetto, stato operativo, parametri pagamento e dati fiscali. Usata per API list/search.';
