# ------------------------------------------------------------
# FASE C — LA MADRE: ANNULLA UNA FORZATURA
#   anagrafiche.fn_annulla_movimento_titolo_iva
#   Piano: brief-db-titoli-iva-movimenti-annullo, §6.1 e §6.4
#
# ── ⭐ PERCHE' UNA MADRE, E NON UNA `INSERT` GUIDATA DAI GUARD ───────
#   Il brief chiedeva una colonna e lasciava al backend il compito di comporre la
#   riga di annullo. Ma **importo e titolo sono DERIVABILI** dalla riga annullata:
#   se li deriva il database, due dei controlli smettono di essere «errori che
#   l'operatore puo' fare» e diventano difesa contro una scrittura diretta — che
#   e' il posto giusto per loro.
#   Il backend passa DUE cose sole: **quale riga** e **perche'**.
#
#   ⚠️ I guard restano comunque, e non sono ridondanti: la tabella e' scrivibile
#   anche senza passare di qui, e un guard che esiste solo perche' «tanto ci si
#   passa dalla madre» e' un guard che il primo INSERT diretto scavalca.
#
# ── ⭐ LA MADRE CHIAMA LA CHECK, NON RISCRIVE IL PREDICATO ───────────
#   L'ammissibilita' la decide script.fn_check_annullo_movimento_titolo_iva, che
#   e' la stessa che spegne il pulsante. Un test che confrontasse i due esiti
#   proverebbe che OGGI coincidono; cosi' si prova che NON POSSONO divergere.
#   ⚠️ In pratica la check e' invocata due volte — qui e dal guard — e va bene:
#   e' STABLE e la coerenza vale piu' di una lettura risparmiata.
#
# ── ⚠️ `SECURITY INVOKER`, esplicito ────────────────────────────────
#   Convenzione delle madri: gira come il ruolo chiamante, quindi RLS e scope
#   emittente restano applicati sulla SCRITTURA. Sono la check e il guard a
#   essere DEFINER, e solo per le LETTURE di coerenza.
#
# ── ⚠️ ATOMICA PER COSTRUZIONE ──────────────────────────────────────
#   Una sola istruzione su connessione in autocommit: PostgreSQL la avvolge in
#   una transazione implicita, e qualunque eccezione annulla tutto. Non serve
#   nessun BEGIN/EXCEPTION.
#
# ── ⭐ `data_movimento` E' LA DATA DELL'ANNULLO ──────────────────────
#   Non quella della forzatura. E' il terzo argomento del §1 del brief, ed e'
#   l'unica informazione che un flag `annullato` avrebbe perso: QUANDO qualcuno
#   si e' accorto dell'errore.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260830-25-create-fn-annulla-movimento-titolo-iva-mctit.yaml

  - changeSet:
      id: 20260830-25-create-fn-annulla-movimento-titolo-iva
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Fase C del brief-db-titoli-iva-movimenti-annullo: la madre che annulla una forzatura
        scrivendo il contro-movimento. ⭐ Deriva importo e titolo dalla riga annullata, quindi
        il backend passa due cose sole — quale riga e perche' — e due dei controlli del guard
        diventano difesa contro la scrittura diretta invece che errori che l'operatore puo'
        fare. ⭐ CHIAMA script.fn_check_annullo_movimento_titolo_iva invece di riscriverne il
        predicato: e' la stessa funzione che spegne il pulsante, quindi il motivo a video e il
        rifiuto non possono divergere. SECURITY INVOKER esplicito (RLS e scope restano applicati
        sulla scrittura); atomica per costruzione, una sola istruzione. ⚠️ data_movimento e' la
        data dell'ANNULLO, non della forzatura: e' l'informazione che un flag avrebbe perso.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_movimenti
                columnName: annulla_movimento_id
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_check_annullo_movimento_titolo_iva';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_annulla_movimento_titolo_iva(
                  p_movimento_id anagrafiche.soggetti_titoli_iva_movimenti.id%TYPE,
                  p_motivo       anagrafiche.soggetti_titoli_iva_movimenti.motivo%TYPE)
               RETURNS anagrafiche.soggetti_titoli_iva_movimenti.id%TYPE
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: annullare una FORZATURA del registro plafond IVA
              --   scrivendo il CONTRO-MOVIMENTO di segno opposto. Il registro
              --   resta append-only, l'accumulatore riporta
              --   imponibile_utilizzato al valore giusto da se' (somma senza
              --   filtri), e a video restano entrambe le righe: l'errore, la
              --   correzione, e la data di ciascuna.
              --   Ritorna l'id della riga di annullo.
              --   Piano: brief-db-titoli-iva-movimenti-annullo, Fase C.
              --
              -- ⭐ IMPORTO E TITOLO SI DERIVANO, non si ricevono: il chiamante
              --    passa QUALE riga e PERCHE'. E' cio' che rende i due controlli
              --    di coerenza del guard una difesa contro la scrittura diretta
              --    invece che un errore che l'operatore puo' fare.
              --
              -- ⭐ L'ammissibilita' la decide la CHECK, che e' la stessa che
              --    spegne il pulsante nel read-side: qui non si riscrive il
              --    predicato. Cosi' i due non «coincidono oggi», non possono
              --    divergere.
              DECLARE
                  v_mov     RECORD;
                  v_motivi  jsonb;
                  v_primo   jsonb;
                  v_new_id  anagrafiche.soggetti_titoli_iva_movimenti.id%TYPE;
              BEGIN
                  -- 1) Guard di parametro. Un id assente o non positivo e un
                  --    motivo vuoto non escono da nessuna interfaccia: li
                  --    produce un chiamante rotto, quindi TECNICO.
                  IF p_movimento_id IS NULL OR p_movimento_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche','fn_annulla_movimento_titolo_iva',
                          'E_TITOLO_IVA_ANNULLO_INCOERENTE',
                          jsonb_build_object('parametro','p_movimento_id',
                                             'valore', p_movimento_id),
                          NULL::uuid,
                          COALESCE(p_movimento_id::text, 'assente'),
                          'identificativo del movimento non valido');
                  END IF;

                  IF p_motivo IS NULL OR btrim(p_motivo) = '' THEN
                      -- ⚠️ Il motivo lo pretende gia'
                      --   chk_stiva_movimenti_motivo_forzatura, ma la' uscirebbe
                      --   come violazione di CHECK (23514): un errore muto per
                      --   chi legge. Qui esce come rifiuto di dominio.
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche','fn_annulla_movimento_titolo_iva',
                          'E_TITOLO_IVA_ANNULLO_INCOERENTE',
                          jsonb_build_object('parametro','p_motivo'),
                          NULL::uuid,
                          p_movimento_id::text,
                          'il motivo dell''annullo e'' obbligatorio');
                  END IF;

                  -- 2) Ammissibilita': si CHIAMA la check, non si riscrive.
                  v_motivi := script.fn_check_annullo_movimento_titolo_iva(p_movimento_id);

                  IF jsonb_array_length(v_motivi) > 0 THEN
                      v_primo := v_motivi -> 0;
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche','fn_annulla_movimento_titolo_iva',
                          v_primo ->> 'codice',
                          jsonb_build_object('movimento_id', p_movimento_id,
                                             'motivi',       v_motivi),
                          NULL::uuid,
                          VARIADIC ARRAY(SELECT jsonb_array_elements_text(
                                                    v_primo -> 'valori')));
                  END IF;

                  -- 3) La riga da annullare, per derivarne titolo e importo.
                  -- ⚠️ Questa lettura e' INVOKER: se la riga fosse fuori
                  --    perimetro non si vedrebbe. Non e' un buco — la check
                  --    (DEFINER) l'ha gia' dichiarata annullabile, quindi
                  --    arrivare qui e non trovarla significa che chi opera non
                  --    ha il perimetro per farlo, ed e' giusto che si fermi.
                  SELECT m.titolo_iva_id, m.imponibile
                    INTO v_mov
                    FROM anagrafiche.soggetti_titoli_iva_movimenti m
                   WHERE m.id = p_movimento_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche','fn_annulla_movimento_titolo_iva',
                          'E_TITOLO_IVA_ANNULLO_NON_AMMESSO',
                          jsonb_build_object('movimento_id', p_movimento_id,
                                             'motivo_tecnico','fuori perimetro'),
                          NULL::uuid, '', '');
                  END IF;

                  -- 4) Il contro-movimento. Segno opposto, stesso titolo,
                  --    tipo FORZATURA, nessun documento (lo impone gia'
                  --    chk_stiva_movimenti_documento) e la data di OGGI, che e'
                  --    la data dell'ANNULLO — l'informazione che un flag avrebbe
                  --    perso.
                  INSERT INTO anagrafiche.soggetti_titoli_iva_movimenti (
                      titolo_iva_id, tipo_movimento, imponibile, data_movimento,
                      motivo, annulla_movimento_id)
                  VALUES (
                      v_mov.titolo_iva_id, 'FORZATURA', - v_mov.imponibile,
                      CURRENT_DATE, p_motivo, p_movimento_id)
                  RETURNING id INTO v_new_id;

                  RETURN v_new_id;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.fn_annulla_movimento_titolo_iva(bigint, character varying)
              IS 'Madre: annulla una FORZATURA del registro plafond IVA scrivendo il CONTRO-MOVIMENTO di segno opposto, e ne ritorna l''id. Il registro resta append-only e l''accumulatore riporta imponibile_utilizzato al valore giusto da se'', perche'' somma senza filtri; a video restano entrambe le righe, l''errore e la correzione, ognuna con la sua data e il suo motivo. ⭐ Il chiamante passa DUE cose: quale riga e perche''. Importo e titolo si DERIVANO dalla riga annullata — ed e'' cio'' che rende i due controlli di coerenza del guard una difesa contro la scrittura diretta invece che un errore che l''operatore puo'' fare. ⭐ L''ammissibilita'' la decide script.fn_check_annullo_movimento_titolo_iva, la stessa che spegne il pulsante nel read-side: la madre la CHIAMA e solleva il codice del primo motivo, non riscrive il predicato — cosi'' i due non possono divergere. SECURITY INVOKER esplicito: RLS e scope emittente restano applicati sulla scrittura (sono la check e il guard a essere DEFINER, e solo per le letture di coerenza). Atomica per costruzione: una sola istruzione, e qualunque eccezione annulla tutto. ⚠️ data_movimento e'' la data dell''ANNULLO, non della forzatura. Piano: brief-db-titoli-iva-movimenti-annullo, Fase C.';

              REVOKE ALL ON FUNCTION anagrafiche.fn_annulla_movimento_titolo_iva(bigint, character varying) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION anagrafiche.fn_annulla_movimento_titolo_iva(bigint, character varying) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_annulla_movimento_titolo_iva(bigint, character varying);
