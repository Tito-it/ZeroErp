# Arita' dei valori — `E_SOGGETTI_RUOLI` passava 1 valore su 3 segnaposto
#   Brief: docs/it/dev/work-done/brief-db-segnaposti-messaggi-errore.md §7
#   Lotto: 20260818-47 .. -54, uno per funzione. Decisione Tid, 2026-08-18.
#
# ── IL DIFETTO, IN UNA RIGA ────────────────────────────────────────────
#   `script.fn_log_and_raise_error` compone il testo con
#   `format(messaggio, VARIADIC valori)`. Con MENO valori dei segnaposto,
#   `format()` non degrada: **alza `22023`**. E alza da DENTRO la funzione,
#   quindi il `RAISE` di dominio due righe sotto non viene mai eseguito —
#   niente `P0001`, niente codice nel canale `CONSTRAINT`, niente campo nel
#   canale `COLUMN`. Il guard blocca lo stesso (il dato resta integro, ed e'
#   il motivo per cui non se n'era accorto nessuno), ma il backend perde il
#   codice su cui decide 409/404/403 e l'operatore legge un errore interno al
#   posto della frase scritta per lui.
#
# ── ⚠️ I DUE VALORI CHE MANCANO, MANCANO PER FORZA ─────────────────────
#   Negli altri sette casi del lotto il chiamante i valori ce li aveva e non li
#   passava. Qui no: si arriva a questo `RAISE` **perche' la riga di
#   `soggetti_ruoli` non e' stata trovata**, quindi `soggetto_id` e `ruolo_id`
#   non esistono proprio. Il `'NULL'` esplicito e' la convenzione gia' usata da
#   `script.fn_guard_soggetto_ruolo` — l'altro chiamante di questo stesso
#   codice, che infatti scrive `coalesce(p_soggetto_id::text, 'NULL')`.
#
#   ⭐ Che due valori su tre non siano valorizzabili e' il sintomo di un
#   problema piu' a monte: **questo punto sta sollevando il codice sbagliato**.
#   La correzione dell'arita' lo rende innocuo, non giusto. Sistemarlo
#   davvero vuol dire un codice nuovo per «soggetto_ruolo_id non trovato», ed
#   e' una decisione di catalogo, non di arita': §7 del brief.
#
# ── NOTE DI CASA ────────────────────────────────────────────────────────
#   · ⚠️ **PERMESSI — nessun prestito di proprieta', nessun `GRANT`.** Misurato
#     il 2026-08-18, non dedotto: questa funzione e' di **`titodb`** (che e' chi
#     migra), **non** e' `SECURITY DEFINER` e **non** e' nel registro
#     `dbops.sec_functions_owner`. Il precedente e' il `20260808-04` su
#     `script.fn_log_and_raise_error`, che documenta anche il perche' l'ACL
#     esplicita (`=X/titodb`, `zeroerp_app=X`, `zeroerp_batch_fatturazione=X`)
#     **sopravvive** a un `CREATE OR REPLACE` — sarebbe diverso con
#     `DROP` + `CREATE`, dove i privilegi si perdono e il loop di grant
#     `20260205-41` li rimetterebbe solo alla corsa `ci_apply` successiva.
#     ⚠️ Da non confondere con `script.fn_log_error_only`, che invece e' di
#     `postgres`, **e'** `SECURITY DEFINER` ed **e'** nel registro: quella,
#     riscriverla, il prestito lo richiede.
#   · Corpo dalla doc auto-gen `docs/it/dbzero/`, col `;` dopo `$function$`
#     aggiunto a mano: l'auto-gen non ce l'ha e senza quello il `COMMENT`
#     sotto da' «errore di sintassi a o presso COMMENT».
#   · Firma e `RETURNS` invariati: cambia solo la lista dei valori.
#   · Presidio: `db/pgtap/script/test-catalogo-messaggi-errore-completo.sql`
#     test 5. Rientra quando l'ultimo degli 8 changeSet e' applicato — e a
#     quel punto va tolta la riga di questo file da `baseline-rossi.tsv`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260818-53-update-trgfn-identita-digitali-guard-coerenza-arita-mctit.yaml

  - changeSet:
      id: 20260818-53-update-trgfn-identita-digitali-guard-coerenza-arita
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il ramo «soggetto_ruolo_id non trovato» passava 1 valore a un messaggio con 3
        segnaposto: format() alzava 22023 e l'errore di dominio spariva. I due valori
        mancanti non sono valorizzabili (la riga non esiste): si passa 'NULL' esplicito,
        come gia' fa script.fn_guard_soggetto_ruolo sullo stesso codice.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'trgfn_identita_digitali_guard_coerenza'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_identita_digitali_guard_coerenza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- %TYPE sulle colonne sorgente per coerenza automatica col DDL.
                  v_soggetto_id anagrafiche.soggetti_ruoli.soggetto_id%TYPE;
              BEGIN
                  -- ------------------------------------------------------------
                  -- Trigger function: guard coerenza ruolo_applicativo <-> soggetto_ruolo
                  -- su anagrafiche.identita_digitali (fase a10, BEFORE INSERT/UPDATE).
                  --
                  -- Logica (ottimizzata):
                  --   - API_CLIENT / DISABILITATO: early-exit, nessuna query.
                  --   - OPERATORE: SELECT soggetto_id + guard RIS_UMANA + guard PF pura.
                  --   - Altri ruoli: delega a fn_guard_soggetto_ruolo passando NULL
                  --     come p_soggetto_id (parametro opzionale supportato dalla
                  --     funzione) — evita una query ridondante.
                  -- ------------------------------------------------------------

                  -- 1) Early-exit per ruoli senza vincoli di coerenza.
                  --    Evita SELECT e chiamate inutili nel caso piu' frequente
                  --    di disattivazione (DISABILITATO) o integrazione API.
                  IF NEW.ruolo_applicativo IN ('API_CLIENT', 'DISABILITATO') THEN
                      RETURN NEW;
                  END IF;

                  -- 2) Dispatch per gli altri ruoli applicativi.
                  --    fn_guard_soggetto_ruolo verifica che il soggetto_ruolo
                  --    abbia tipo_ruolo.codice_interno == valore atteso; solleva
                  --    eccezione E_SOGGETTI_RUOLI se non coerente.
                  CASE NEW.ruolo_applicativo
                      WHEN 'OPERATORE' THEN
                          -- Operatore interno: serve anche il soggetto_id per
                          -- verificare che sia persona fisica pura. Unica query.
                          SELECT sr.soggetto_id
                            INTO v_soggetto_id
                            FROM anagrafiche.soggetti_ruoli sr
                           WHERE sr.id = NEW.soggetto_ruolo_id;

                          IF NOT FOUND THEN
                              -- Caso limite (record cancellato da altra transazione):
                              -- la FK lo impedirebbe, ma fail-fast esplicito per chiarezza.
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_SOGGETTI_RUOLI',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'soggetto_ruolo_id', NEW.soggetto_ruolo_id,
                                      'nota', 'soggetto_ruolo_id non trovato in anagrafiche.soggetti_ruoli'
                                  ),
                                  NULL::uuid,
                                  -- ⚠️ ARITA' (2026-08-18): E_SOGGETTI_RUOLI ha tre segnaposto
                                  --   (id, soggetto_id, ruolo_id) e qui ne arrivava uno solo
                                  --   -> format() alzava 22023 al posto del P0001.
                                  --   Gli altri due NON si possono valorizzare, ed e' il punto:
                                  --   si arriva qui **perche' la riga non e' stata trovata**,
                                  --   quindi soggetto_id e ruolo_id non esistono da leggere.
                                  --   Si passa 'NULL' esplicito, che e' la convenzione gia' in
                                  --   uso in script.fn_guard_soggetto_ruolo — l'altro
                                  --   chiamante di questo stesso codice.
                                  --   ⚠️ Resta un difetto di MERITO, non toccato qui: la
                                  --   condizione e' «soggetto_ruolo_id non trovato», mentre il
                                  --   messaggio dice «non e' stata assegnata la relazione».
                                  --   E' materia del quarto lato
                                  --   (scripts/sql/check_messaggio_vs_condizione.sql).
                                  NEW.soggetto_ruolo_id::text,
                                  'NULL',
                                  'NULL'
                              );
                          END IF;

                          PERFORM script.fn_guard_soggetto_ruolo(
                              v_soggetto_id,
                              NEW.soggetto_ruolo_id,
                              'RIS_UMANA'
                          );
                          PERFORM script.fn_guard_soggetto_pf_pura(v_soggetto_id);

                      WHEN 'CLIENTE_PORTALE', 'SHOP_CUSTOMER' THEN
                          -- Entrambi i ruoli condividono lo stesso tipo_ruolo
                          -- anagrafico 'CL': la differenza tra portale B2B e
                          -- shop self-service e' solo a livello di namespace API
                          -- e profilo capability, non di anagrafica.
                          -- NULL come p_soggetto_id: la funzione non lo verifica.
                          PERFORM script.fn_guard_soggetto_ruolo(
                              NULL,
                              NEW.soggetto_ruolo_id,
                              'CL'
                          );

                      WHEN 'FORNITORE_PORTALE' THEN
                          -- Fornitore portale: ruolo FORNITORE (codice interno 'FO').
                          PERFORM script.fn_guard_soggetto_ruolo(
                              NULL,
                              NEW.soggetto_ruolo_id,
                              'FO'
                          );

                      ELSE
                          -- Nuovo valore enum senza regola qui: fail-fast esplicito
                          -- (evita bypass silenzioso quando si estende l'enum in
                          -- futuro — il guard non deve "aprire" per omissione).
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME,
                              'E_RUOLO_APPLICATIVO_NON_GESTITO',
                              jsonb_build_object(
                                  'table', TG_TABLE_NAME,
                                  'ruolo_applicativo', NEW.ruolo_applicativo,
                                  'nota', 'Ruolo applicativo sconosciuto al guard di coerenza'
                              ),
                              NULL::uuid,
                              NEW.ruolo_applicativo::text
                          );
                  END CASE;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_identita_digitali_guard_coerenza()
              IS 'Guard a10 BEFORE INSERT/UPDATE su anagrafiche.identita_digitali: verifica coerenza tra ruolo_applicativo e codice_interno del tipo_ruolo del soggetto_ruolo; per OPERATORE richiede anche che il soggetto sia persona fisica pura. Dispatch esplicito per ogni valore dell''enum config.ruolo_applicativo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Vuoto di proposito: il ripristino della versione precedente
              -- rimetterebbe in servizio la chiamata che alza 22023. Se serve
              -- tornare indietro, si scrive un changeSet in avanti.
              SELECT 1;
