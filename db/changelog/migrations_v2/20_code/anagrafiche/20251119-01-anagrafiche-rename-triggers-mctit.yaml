databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251119-01-anagrafiche-rename-triggers-mctit.yaml

    - changeSet:
          id: 20251119-01-anagrafiche-rename-triggers
          author: mctit

          # runAlways: true
          validCheckSums: <ANY>
          comment: "Rinomina trigger function schema anagrafiche secondo convenzione trgfn_<tabella>_<descrizione>"

          preConditions:
              - onFail: MARK_RAN # se la colonna è già bigint, segna il changeSet come eseguito e salta
              - onError: MARK_RAN # in caso di errore nella precondizione, non bloccare la CI
              - sqlCheck:
                    expectedResult: 1
                    sql: |
                        SELECT COUNT(*)
                          FROM pg_proc p
                          JOIN pg_namespace n ON n.oid = p.pronamespace
                          WHERE n.nspname = 'anagrafiche'
                          AND p.proname = 'trgfn_a10_emittenti_fiscali_protect_codice';

          changes:
              - sql:
                    splitStatements: true
                    stripComments: true
                    sql: |
                        -- Emittenti fiscali / Resellers / Vettori - protezione codice (rimozione prefix a10)
                        ALTER FUNCTION anagrafiche.trgfn_a10_emittenti_fiscali_protect_codice() RENAME TO trgfn_emittenti_fiscali_protect_codice;
                        ALTER FUNCTION anagrafiche.trgfn_a10_resellers_protect_codice() RENAME TO trgfn_resellers_protect_codice;
                        ALTER FUNCTION anagrafiche.trgfn_a10_vettori_protect_codice() RENAME TO trgfn_vettori_protect_codice;

                        -- Billing account
                        ALTER FUNCTION anagrafiche.trgfn_billing_account_ins_upd_guard_normalize() RENAME TO trgfn_billing_account_guard_normalize;
                        ALTER FUNCTION anagrafiche.trgfn_billing_account_upd_protect_account_code() RENAME TO trgfn_billing_account_protect_account_code;

                        -- Clienti
                        ALTER FUNCTION anagrafiche.trgfn_clienti_ins_upd_check_ruolo_cliente() RENAME TO trgfn_clienti_check_ruolo_cliente;
                        -- queste restano uguali ma le lasciamo per completezza logica: nessun rename necessario
                        -- trgfn_clienti_set_periodo()
                        -- trgfn_clienti_sync_pdp()

                        -- Contatti
                        ALTER FUNCTION anagrafiche.trgfn_contatti_ins_upd_set_default_contatto() RENAME TO trgfn_contatti_set_default_contatto;

                        -- Conti bancari
                        ALTER FUNCTION anagrafiche.trgfn_conti_bancari_ins_upd_normalize() RENAME TO trgfn_conti_bancari_normalize;

                        -- Dati societari: da check -> guard (perché fa RAISE) e rimozione ins_upd dal nome
                        ALTER FUNCTION anagrafiche.trgfn_dati_societari_ins_upd_check_tipo_soggetto() RENAME TO trgfn_dati_societari_guard_tipo_soggetto;

                        -- Emittenti fiscali: check + normalize
                        ALTER FUNCTION anagrafiche.trgfn_emittenti_fiscali_ins_upd_check_ruolo_emi_fis() RENAME TO trgfn_emittenti_fiscali_check_ruolo_emi_fis;
                        ALTER FUNCTION anagrafiche.trgfn_emittenti_fiscali_norm() RENAME TO trgfn_emittenti_fiscali_normalize;

                        -- Fornitori
                        ALTER FUNCTION anagrafiche.trgfn_fornitori_ins_upd_check_ruolo_fornitore() RENAME TO trgfn_fornitori_check_ruolo_fornitore;
                        ALTER FUNCTION anagrafiche.trgfn_fornitori_upd_protect_account_code() RENAME TO trgfn_fornitori_protect_account_code;
                        -- trgfn_fornitori_guard_normalize() resta così

                        -- Gestori
                        ALTER FUNCTION anagrafiche.trgfn_gestori_ins_upd_check_ruolo_gestore() RENAME TO trgfn_gestori_check_ruolo_gestore;

                        -- Indirizzi dettaglio: norm -> normalize
                        ALTER FUNCTION anagrafiche.trgfn_indirizzi_dettaglio_ins_upd_norm_indirizzi_dettaglio() RENAME TO trgfn_indirizzi_dettaglio_normalize;

                        -- Indirizzi: clean_fields -> normalize, sync_geoloc senza ins_upd
                        ALTER FUNCTION anagrafiche.trgfn_indirizzi_ins_upd_clean_fields() RENAME TO trgfn_indirizzi_normalize;
                        ALTER FUNCTION anagrafiche.trgfn_indirizzi_ins_upd_sync_geoloc() RENAME TO trgfn_indirizzi_sync_geoloc;

                        -- Istanze utilities: clean_fields -> normalize, rimozione upd dal nome protect_codice
                        ALTER FUNCTION anagrafiche.trgfn_istanze_utilities_ins_upd_clean_fields() RENAME TO trgfn_istanze_utilities_normalize;
                        ALTER FUNCTION anagrafiche.trgfn_istanze_utilities_upd_protect_codice() RENAME TO trgfn_istanze_utilities_protect_codice;

                        -- PDP: la funzione resta invariata (già buona)
                        -- trgfn_pdp_protect_cols()

                        -- Resellers: check + normalize
                        ALTER FUNCTION anagrafiche.trgfn_resellers_ins_upd_check_ruolo_reseller() RENAME TO trgfn_resellers_check_ruolo_reseller;
                        ALTER FUNCTION anagrafiche.trgfn_resellers_norm() RENAME TO trgfn_resellers_normalize;

                        -- Soggetti: clean_fields -> normalize, rimozione upd dal nome protect_codice_soggetto
                        ALTER FUNCTION anagrafiche.trgfn_soggetti_ins_upd_clean_fields() RENAME TO trgfn_soggetti_normalize;
                        ALTER FUNCTION anagrafiche.trgfn_soggetti_upd_protect_codice_soggetto() RENAME TO trgfn_soggetti_protect_codice_soggetto;

                        -- Vettori: check + normalize
                        ALTER FUNCTION anagrafiche.trgfn_vettori_ins_upd_check_ruolo_vettore() RENAME TO trgfn_vettori_check_ruolo_vettore;
                        ALTER FUNCTION anagrafiche.trgfn_vettori_norm() RENAME TO trgfn_vettori_normalize;

