databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260128-02-create-trgfn-pdp-a10-guard-mctit.yaml

  - changeSet:
      id: 20260128-02-create-trgfn-pdp-a10-guard
      author: mctit
      comment: >
        Reintroduce la trigger function di guardia per impedire la modifica
        di pdp e indirizzo_dettaglio_id su anagrafiche.pdp.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_pdp_a10_guard()
              RETURNS trigger
              LANGUAGE plpgsql
              VOLATILE
              AS $function$
              BEGIN
                ------------------------------------------------------------
                -- Funzione: anagrafiche.trgfn_pdp_a10_guard()
                -- Impedisce la modifica di pdp e indirizzo_dettaglio_id
                -- dopo la prima valorizzazione.
                ------------------------------------------------------------
                IF TG_OP = 'UPDATE' THEN
                  -- Blocca cambio codice PDP (se già valorizzato)
                  IF OLD.pdp IS NOT NULL AND NEW.pdp IS DISTINCT FROM OLD.pdp THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_COLONNA_NON_MODIFICABILE',
                      jsonb_build_object('column','pdp','id',OLD.id),
                      NULL::uuid, 
                      concat('pdp: ' , OLD.pdp::text)
                    );
                  END IF;

                  -- Blocca spostamento fisico del PDP
                  IF OLD.indirizzo_dettaglio_id IS NOT NULL
                     AND NEW.indirizzo_dettaglio_id IS DISTINCT FROM OLD.indirizzo_dettaglio_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_COLONNA_NON_MODIFICABILE',
                      jsonb_build_object('column','indirizzo_dettaglio_id','id',OLD.id),
                      NULL::uuid, 
                      concat('indirizzo_dettaglio_id: ' , OLD.indirizzo_dettaglio_id::text )
                    );
                  END IF;
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_pdp_a10_guard()
                IS 'Blocca modifiche a pdp e indirizzo_dettaglio_id (immutabili dopo prima valorizzazione).';

              DROP TRIGGER IF EXISTS trg_pdp_a10_guard_upd ON anagrafiche.pdp;

              CREATE TRIGGER trg_pdp_a10_guard_upd
                BEFORE UPDATE OF pdp, indirizzo_dettaglio_id
                ON anagrafiche.pdp
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_pdp_a10_guard();

              COMMENT ON TRIGGER trg_pdp_a10_guard_upd ON anagrafiche.pdp
                IS 'Blocca la modifica dei campi identitari del PDP (pdp, indirizzo_dettaglio_id).';
