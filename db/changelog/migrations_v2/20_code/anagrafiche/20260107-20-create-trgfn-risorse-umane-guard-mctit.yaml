# Liquibase changelog per Zero ERP
# Guard per anagrafiche.risorse_umane
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20260107-20-create-trgfn-risorse-umane-guard-mctit.yaml

  - changeSet:
      id: 20260107-20-create-trgfn-risorse-umane-guard
      author: mctit
      # runAlways: true
      validCheckSum:
        - ANY
      comment: >
        Guard su anagrafiche.risorse_umane: verifica ruolo RISORSA_UMANA
        e coerenza soggetto_id con soggetto_ruolo_id.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_risorse_umane_guard_ruolo()
                  RETURNS trigger
                  LANGUAGE 'plpgsql'
                  COST 100
                  VOLATILE NOT LEAKPROOF
              AS $BODY$
              DECLARE
                  v_soggetto_id uuid;
              BEGIN
                  -- FUNCTION: 
                  --   Ogni volta che inserisco/aggiorno in fornitori, gestisco la
                  --   verifica della riga corrispondente in soggetti_ruoli.
                  --   alimentando poi in NEW.soggetto_ruolo_id il record finale.

                  -- Sostituisco NEW.soggetto_ruolo_id con l'ID vero (esistente),
                  -- delegando completamente alla funzione generica:
                  NEW.soggetto_ruolo_id := script.fn_guard_soggetto_ruolo(
                                          p_soggetto_id       := NULL,
                                          p_soggetto_ruolo_id := NEW.soggetto_ruolo_id,
                                          p_cd_int_ruolo      := 'RIS_UMANA'
                                          );

                  SELECT sr.soggetto_id
                    INTO v_soggetto_id
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = NEW.soggetto_ruolo_id;

                  IF v_soggetto_id IS DISTINCT FROM NEW.soggetto_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME,
                          'E_RISORSA_UMANA_SOGGETTO_MISMATCH',
                          jsonb_build_object(
                              'table', TG_TABLE_NAME,
                              'soggetto_id', NEW.soggetto_id,
                              'soggetto_id_ruolo', v_soggetto_id
                          ),
                          NULL::uuid,
                          NEW.soggetto_ruolo_id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $BODY$;


              COMMENT ON FUNCTION anagrafiche.trgfn_risorse_umane_guard_ruolo()
              IS 'Verifica che soggetto_ruolo_id sia di tipo RIS_UMANA.';

              DROP TRIGGER IF EXISTS trg_risorse_umane_a10_guard_ruolo_ins_upd
              ON anagrafiche.risorse_umane;

              CREATE TRIGGER trg_risorse_umane_a10_guard_ruolo_ins_upd
              BEFORE INSERT OR UPDATE
              ON anagrafiche.risorse_umane
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_risorse_umane_guard_ruolo();

              COMMENT ON TRIGGER trg_risorse_umane_a10_guard_ruolo_ins_upd
              ON anagrafiche.risorse_umane
              IS 'Guard ruolo: richiede tipo_ruolo RIS_UMANA.';
