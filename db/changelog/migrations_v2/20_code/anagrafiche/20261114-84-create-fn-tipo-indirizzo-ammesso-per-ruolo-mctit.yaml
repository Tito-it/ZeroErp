# IL TIPO DI INDIRIZZO CHE UN TIPO DI RUOLO AMMETTE: IL PREDICATO IN UN POSTO SOLO
#   anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo(tipo ruolo, tipo indirizzo, oggi) -> boolean
#   Brief: brief-db-copia-indirizzo-soggetto §4.6.1, giro 1 (D-1).
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   La matrice config.tipi_ruolo_tipi_indirizzo la giudica oggi il solo corpo
#   del trigger anagrafiche.trgfn_indirizzi_guard_tipo_ruolo_tipi_indirizzo.
#   La check del tipo sul ruolo (-87) e la lettura degli obbligatori della
#   plurale del ruolo (-91) fanno la stessa domanda: seconda occorrenza, si
#   estrae, e il trigger la legge nello stesso giro (-85).
#
# ── LA FORMA ────────────────────────────────────────────────────
#   Gemella di anagrafiche.fn_tipo_indirizzo_ammesso_per_natura (20261114-63),
#   con le tre risposte del trigger tali e quali:
#   * tipo di ruolo NULL: ammesso (il trigger, senza tipo di ruolo, passa);
#   * tipo di ruolo senza nessuna riga di matrice: ammesso (indirizzi liberi);
#   * altrimenti: ammesso solo se c'e' una riga per la coppia, attiva e valida
#     il giorno passato.
#   Il giorno lo passa il chiamante (il trigger usa script.fn_data_operativa()).
#   BEGIN ATOMIC (§5c): COMMENT in un secondo sql:.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-84-create-fn-tipo-indirizzo-ammesso-per-ruolo-mctit.yaml

  - changeSet:
      id: 20261114-84-create-fn-tipo-indirizzo-ammesso-per-ruolo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il tipo di ruolo ammette il tipo di indirizzo (matrice tipi_ruolo_tipi_indirizzo,
        col fallback permissivo): sede unica del predicato, gemella di quella della natura.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo(
                  p_tipo_ruolo_id     config.tipi_ruolo_tipi_indirizzo.tipo_ruolo_id%TYPE,
                  p_tipo_indirizzo_id config.tipi_ruolo_tipi_indirizzo.tipo_indirizzo_id%TYPE,
                  p_oggi              config.tipi_ruolo_tipi_indirizzo.valido_dal%TYPE)
              RETURNS boolean
              LANGUAGE sql
              STABLE
              BEGIN ATOMIC
                  SELECT p_tipo_ruolo_id IS NULL
                      OR NOT EXISTS (
                             SELECT 1
                               FROM config.tipi_ruolo_tipi_indirizzo m
                              WHERE m.tipo_ruolo_id = p_tipo_ruolo_id)
                      OR EXISTS (
                             SELECT 1
                               FROM config.tipi_ruolo_tipi_indirizzo m
                              WHERE m.tipo_ruolo_id     = p_tipo_ruolo_id
                                AND m.tipo_indirizzo_id = p_tipo_indirizzo_id
                                AND m.attivo
                                AND (m.valido_dal IS NULL OR m.valido_dal <= p_oggi)
                                AND (m.valido_al  IS NULL OR m.valido_al  >= p_oggi));
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo(
                  config.tipi_ruolo_tipi_indirizzo.tipo_ruolo_id%TYPE,
                  config.tipi_ruolo_tipi_indirizzo.tipo_indirizzo_id%TYPE,
                  config.tipi_ruolo_tipi_indirizzo.valido_dal%TYPE)
              IS 'Il tipo di ruolo ammette il tipo di indirizzo, secondo config.tipi_ruolo_tipi_indirizzo: vero se il tipo di ruolo e'' NULL o non ha nessuna riga di matrice (fallback permissivo: indirizzi liberi), altrimenti solo se c''e'' una riga per la coppia attiva e valida il giorno passato. Il giorno lo passa il chiamante. Sede unica del predicato sul layer RUOLO: la leggono anagrafiche.trgfn_indirizzi_guard_tipo_ruolo_tipi_indirizzo (quando si scrive un indirizzo del ruolo), anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto e anagrafiche.fn_crea_indirizzi_ruolo (gli obbligatori da copiare). Gemella di anagrafiche.fn_tipo_indirizzo_ammesso_per_natura, che giudica il layer SOGGETTO su un''altra matrice.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP FUNCTION IF EXISTS anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo(bigint, integer, date);
