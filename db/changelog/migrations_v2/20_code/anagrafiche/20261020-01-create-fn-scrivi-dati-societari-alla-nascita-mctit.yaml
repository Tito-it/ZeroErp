# anagrafiche.fn_scrivi_dati_societari_alla_nascita — QUANDO un soggetto che
# nasce porta i suoi dati societari
#   Brief: brief-db-dati-societari-in-creazione (§3.1, D-1 della sessione;
#   E-1 (a) di Tid, 2026-10-19)
#
# -- PERCHE' UN BB ----------------------------------------------------
#   La decisione «la sezione si scrive?» stava in fn_crea_soggetto_pg
#   (Step 3). Con E-1 (a) serve anche a fn_crea_soggetto_pf, per la ditta
#   individuale: e' la seconda copia, e per la regola del 2 si estrae qui.
#   Le due porte (20261020-02 pg, -03 pf) chiamano questo BB al posto del
#   verbo; il BB non aggiunge regole e scrive SOLO col verbo
#   anagrafiche.fn_scrivi_dati_societari (stato intero).
#
# -- LA REGOLA --------------------------------------------------------
#   * policy REQUIRED -> si scrive sempre (senza forma la riga la rifiuta
#     il NOT NULL della forma, come prima);
#   * altrimenti si scrive se la sezione «c'e'»: almeno un campo con un
#     valore fra forma, provincia e numero REA, capitale, canale FE, PEC,
#     codice SDI, data di costituzione. Testi vuoti non contano (il verbo
#     li scriverebbe NULL). Socio unico e liquidazione da soli NON contano:
#     hanno sempre un valore (default da config.parameters) e il form li
#     manda anche a sezione vuota;
#   * una sezione passata a una natura NONE si scrive, e la rifiuta il
#     guard della natura (E_DATI_SOCIETARI_TIPO_SOGGETTO_NON_AMMESSO): mai
#     scartata in silenzio. ⚠️ Per fn_crea_soggetto_pg e' un cambio: prima
#     la scartava.
#   Il soggetto: NULL -> E_PARAMETRO_INVALIDO, inesistente ->
#   E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO (gli stessi codici del verbo):
#   senza soggetto la policy non si legge, e un chiamante rotto non deve
#   tornare NULL come «niente da scrivere».
#   SECURITY INVOKER: il verbo che chiama e' DEFINER ed e' la porta.
#   Nello stesso changeSet il COMMENT del verbo: fra i chiamanti, al posto
#   di fn_crea_soggetto_pg, questo BB (il rollback rimette il testo vivo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261020-01-create-fn-scrivi-dati-societari-alla-nascita-mctit.yaml

  - changeSet:
      id: 20261020-01-create-fn-scrivi-dati-societari-alla-nascita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_scrivi_dati_societari_alla_nascita: la decisione «la sezione societaria si scrive alla nascita?»
        (policy REQUIRED o almeno un campo con un valore) estratta da fn_crea_soggetto_pg per le due porte di
        creazione (regola del 2); scrive col verbo. Brief: brief-db-dati-societari-in-creazione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION anagrafiche.fn_scrivi_dati_societari_alla_nascita(
                  p_soggetto_id         anagrafiche.dati_societari.soggetto_id%TYPE,
                  p_forma_giuridica_id  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  p_id_prov_iscri_rea   anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  p_iscrizione_rea      anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  p_capitale_sociale    anagrafiche.dati_societari.capitale_sociale%TYPE,
                  p_socio_unico         anagrafiche.dati_societari.socio_unico%TYPE,
                  p_liquidazione        anagrafiche.dati_societari.liquidazione%TYPE,
                  p_destinatario_fe     anagrafiche.dati_societari.destinatario_fe%TYPE,
                  p_pec_fatturazione    anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  p_codice_sdi          anagrafiche.dati_societari.codice_sdi%TYPE,
                  p_data_costituzione   anagrafiche.dati_societari.data_costituzione%TYPE
              )
              RETURNS anagrafiche.dati_societari.id%TYPE
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: alla nascita di un soggetto, scrive i suoi dati societari
              --   se vanno scritti, e solo col verbo (stato intero). Restituisce
              --   l'id della riga, o NULL se la sezione non c'e' e la natura non
              --   la pretende.
              -- Lo chiamano le due porte di creazione, fn_crea_soggetto_pg e
              --   fn_crea_soggetto_pf (regola del 2, 20261020-01).
              -- Brief: brief-db-dati-societari-in-creazione §3.1.
              -- =========================================================
              DECLARE
                  v_policy  config.tipi_soggetto_dettaglio.dati_societari_policy%TYPE;
              BEGIN
                  -- Due rami, due codici, come nel verbo: il soggetto non passato e' un
                  -- chiamante rotto (PARAMETRO), quello passato e inesistente e' «non trovato».
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_scrivi_dati_societari_alla_nascita', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_soggetto_id', 'valore', NULL),
                          NULL::uuid,
                          'il soggetto e'' obbligatorio');
                  END IF;

                  SELECT tsd.dati_societari_policy
                    INTO v_policy
                    FROM anagrafiche.soggetti s
                    LEFT JOIN config.tipi_soggetto_dettaglio tsd ON tsd.id = s.tipo_soggetto_dettaglio_id
                   WHERE s.id = p_soggetto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_scrivi_dati_societari_alla_nascita',
                          'E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO',
                          jsonb_build_object('soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          p_soggetto_id::text);
                  END IF;

                  -- La sezione «c'e'» se almeno un campo ha un valore. Socio unico e
                  -- liquidazione non contano: hanno sempre un valore, anche a sezione vuota.
                  -- Una natura NONE con la sezione passa al verbo, e la rifiuta il guard
                  -- della natura: niente scarto silenzioso.
                  IF v_policy IS DISTINCT FROM 'REQUIRED'
                     AND p_forma_giuridica_id IS NULL
                     AND p_id_prov_iscri_rea IS NULL
                     AND NULLIF(btrim(p_iscrizione_rea), '') IS NULL
                     AND p_capitale_sociale IS NULL
                     AND NULLIF(btrim(p_destinatario_fe), '') IS NULL
                     AND NULLIF(btrim(p_pec_fatturazione), '') IS NULL
                     AND NULLIF(btrim(p_codice_sdi), '') IS NULL
                     AND p_data_costituzione IS NULL
                  THEN
                      RETURN NULL;
                  END IF;

                  RETURN anagrafiche.fn_scrivi_dati_societari(
                      p_soggetto_id        := p_soggetto_id,
                      p_forma_giuridica_id := p_forma_giuridica_id,
                      p_id_prov_iscri_rea  := p_id_prov_iscri_rea,
                      p_iscrizione_rea     := p_iscrizione_rea,
                      p_capitale_sociale   := p_capitale_sociale,
                      p_socio_unico        := p_socio_unico,
                      p_liquidazione       := p_liquidazione,
                      p_destinatario_fe    := p_destinatario_fe,
                      p_pec_fatturazione   := p_pec_fatturazione,
                      p_codice_sdi         := p_codice_sdi,
                      p_data_costituzione  := p_data_costituzione
                  );
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_scrivi_dati_societari_alla_nascita(
                  anagrafiche.dati_societari.soggetto_id%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE) IS
                  'Alla nascita di un soggetto decide se i suoi dati societari vanno scritti, e li scrive col verbo anagrafiche.fn_scrivi_dati_societari (stato intero). Si scrivono se la natura li pretende (dati_societari_policy REQUIRED) o se la sezione c''e'': almeno un campo con un valore fra forma, provincia e numero REA, capitale, canale FE, PEC, codice SDI e data di costituzione (testi vuoti esclusi; socio unico e liquidazione da soli non contano, hanno sempre un valore). Una sezione passata a una natura NONE va al verbo e la rifiuta il guard della natura (E_DATI_SOCIETARI_TIPO_SOGGETTO_NON_AMMESSO), mai scartata in silenzio. Restituisce l''id dei dati societari, o NULL se non c''era niente da scrivere. Soggetto NULL: E_PARAMETRO_INVALIDO; inesistente: E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO. SECURITY INVOKER: la porta di scrittura resta il verbo. Lo chiamano anagrafiche.fn_crea_soggetto_pg e anagrafiche.fn_crea_soggetto_pf (regola del 2, 20261020-01). Brief: brief-db-dati-societari-in-creazione.';

              -- Il verbo: fra chi lo chiama, al posto di fn_crea_soggetto_pg c'e' il BB.
              --   Il resto del testo e' quello vivo.
              COMMENT ON FUNCTION anagrafiche.fn_scrivi_dati_societari(
                  anagrafiche.dati_societari.soggetto_id%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE) IS
                  'Il verbo di scrittura dei dati societari: crea o aggiorna la riga del soggetto (una per soggetto), STATO INTERO (NULL scrive NULL dove la colonna lo ammette; socio_unico e liquidazione NULL valgono il default di config.parameters; testi ripuliti, vuoto = NULL). Aggiunge solo il controllo del soggetto: NULL solleva E_PARAMETRO_INVALIDO, inesistente E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO; forma, natura, REA, capitale e canale FE restano ai trigger della tabella. SECURITY DEFINER: dal 20261011-04 l''applicazione non scrive anagrafiche.dati_societari direttamente, e questa e'' la porta (B-5); nessun guard di livello, il permesso resta al backend come per anagrafiche.soggetti. Se nella stessa scrittura cambia la natura del soggetto, si aggiorna prima il soggetto e poi si chiama il verbo. Lo chiamano il backend in modifica, le fixture pgTAP e, alla nascita di un soggetto, anagrafiche.fn_scrivi_dati_societari_alla_nascita (per fn_crea_soggetto_pg e fn_crea_soggetto_pf, rev 20261020-01). Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-1..B-5).';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_scrivi_dati_societari_alla_nascita(
                  anagrafiche.dati_societari.soggetto_id%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE);

              COMMENT ON FUNCTION anagrafiche.fn_scrivi_dati_societari(
                  anagrafiche.dati_societari.soggetto_id%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE) IS
                  'Il verbo di scrittura dei dati societari: crea o aggiorna la riga del soggetto (una per soggetto), STATO INTERO (NULL scrive NULL dove la colonna lo ammette; socio_unico e liquidazione NULL valgono il default di config.parameters; testi ripuliti, vuoto = NULL). Aggiunge solo il controllo del soggetto: NULL solleva E_PARAMETRO_INVALIDO, inesistente E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO; forma, natura, REA, capitale e canale FE restano ai trigger della tabella. SECURITY DEFINER: dal 20261011-04 l''applicazione non scrive anagrafiche.dati_societari direttamente, e questa e'' la porta (B-5); nessun guard di livello, il permesso resta al backend come per anagrafiche.soggetti. Se nella stessa scrittura cambia la natura del soggetto, si aggiorna prima il soggetto e poi si chiama il verbo. Lo chiamano anagrafiche.fn_crea_soggetto_pg, il backend in modifica e le fixture pgTAP. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-1..B-5).';
