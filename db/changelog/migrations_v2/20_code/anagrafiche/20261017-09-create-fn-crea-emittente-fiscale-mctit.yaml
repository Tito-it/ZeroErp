# BB: CREARE UN EMITTENTE FISCALE
#   anagrafiche.fn_crea_emittente_fiscale(soggetto, codice, campi): il ruolo
#   EF del soggetto (get_or_create) e la riga di anagrafiche.emittenti_fiscali,
#   in una sola istruzione (madre, linee-guida-sql §5b). I registri di
#   numerazione e il mapping di default nascono dai trigger della tabella,
#   come prima.
#   Brief: brief-db-processi-accensione-per-ambiente, §5-ter.1 (2b-1).
#
# -- CHI ERA LA COPIA ---------------------------------------------------
#   * il backend, EmittentiFiscaliService.crea_emittente: transaction.atomic
#     + get_or_create del ruolo + execute_dynamic_insert (_CREATE_COLS) + un
#     UPDATE del regime per confermarlo. Passa al BB nella 2b-2;
#   * il builder dbops.fn_pgtap_crea_emittente: INSERT diretto. Passa al BB in
#     20261017-10.
#
# -- I CAMPI ------------------------------------------------------------
#   Le stesse chiavi opzionali del backend (_CREATE_COLS meno le due fisse):
#   attivo, regime_fiscale_rf, bollo_auto, bollo_soglia, rounding_policy,
#   valuta_id. Una chiave estranea si RIFIUTA col suo nome (E_CAMPO_NON_AMMESSO):
#   le colonne della conferma del regime non si scrivono a mano.
#   Un regime DICHIARATO e' un regime confermato: la INSERT non conferma mai (il
#   default RF01 e un RF01 scelto sono indistinguibili), quindi la conferma e'
#   un UPDATE del regime nella stessa istruzione (il trigger a20 scatta su
#   UPDATE OF regime_fiscale_rf). E' la regola del backend, che qui si sposta.
#
# -- CHE COSA RESTA FUORI, apposta ---------------------------------------
#   * la partita IVA del soggetto: oggi la controlla solo il backend, come
#     validazione di input (§5b: «le validazioni read-only restano pre-check
#     del service»). E' una regola di dominio senza un guard sulla tabella:
#     debito dichiarato nel brief (§5-ter.2);
#   * il permesso: il dominio anagrafiche lo lascia al backend (precedente
#     B-5, brief-db-dati-fiscali-e-societari-del-soggetto). INVOKER, come
#     fn_crea_soggetto_pg e fn_crea_operatore_v2;
#   * i duplicati (uq_emittenti_fiscali_ruolo, uq:codice) e il regime fuori
#     catalogo (fk_emittenti_fiscali_regimi_fiscali) escono coi loro vincoli:
#     il backend li traduce per nome, come oggi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261017-09-create-fn-crea-emittente-fiscale-mctit.yaml

  - changeSet:
      id: 20261017-09-create-fn-crea-emittente-fiscale
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea anagrafiche.fn_crea_emittente_fiscale: ruolo EF e riga di emittenti_fiscali in una
        madre, regime dichiarato = confermato. Prende il posto della creazione del backend e del
        builder pgTAP. Brief: brief-db-processi-accensione-per-ambiente (2b-1).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "2"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname IN ('fn_scrivi_riga_da_jsonb', 'fn_prima_chiave_estranea');
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_emittente_fiscale(
                  p_soggetto_id anagrafiche.soggetti.id%TYPE,
                  p_codice      anagrafiche.emittenti_fiscali.codice%TYPE,
                  p_campi       jsonb DEFAULT '{}'::jsonb)
               RETURNS TABLE(emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE,
                             soggetto_ruolo_id    anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_campi    jsonb := COALESCE(p_campi, '{}'::jsonb);
                  v_estranea text;
                  v_sr_id    anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_ef_id    anagrafiche.emittenti_fiscali.id%TYPE;
                  -- Le chiavi opzionali: le stesse del backend (_CREATE_COLS).
                  c_ammesse  CONSTANT text[] := ARRAY[
                      'attivo', 'regime_fiscale_rf', 'bollo_auto', 'bollo_soglia',
                      'rounding_policy', 'valuta_id'];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Creare l'emittente fiscale di un soggetto: il ruolo EF
                  --   (get_or_create) e la riga di emittenti_fiscali con le
                  --   chiavi opzionali di p_campi (le assenti al DEFAULT).
                  --   Un regime dichiarato e' confermato. Ritorna
                  --   (emittente_fiscale_id, soggetto_ruolo_id).
                  --
                  -- Regole:
                  --   - una chiave fuori elenco si rifiuta: E_CAMPO_NON_AMMESSO;
                  --   - duplicati e regime fuori catalogo escono dai vincoli;
                  --   - i registri e il mapping di default li fanno i trigger.
                  -- =========================================================
                  IF jsonb_typeof(v_campi) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_crea_emittente_fiscale', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo_campi', jsonb_typeof(v_campi)),
                          NULL::uuid,
                          'anagrafiche.fn_crea_emittente_fiscale',
                          'i campi non sono un oggetto');
                  END IF;

                  v_estranea := script.fn_prima_chiave_estranea(v_campi, c_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_crea_emittente_fiscale', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  v_sr_id := script.fn_get_or_create_soggetto_ruolo(
                                 p_soggetto_id  := p_soggetto_id,
                                 p_cd_int_ruolo := 'EF');

                  v_ef_id := (script.fn_scrivi_riga_da_jsonb(
                                  'anagrafiche.emittenti_fiscali'::regclass,
                                  v_campi || jsonb_build_object('soggetto_ruolo_id', v_sr_id,
                                                                'codice',            p_codice))
                              ->> 'id')::bigint;

                  -- Il regime dichiarato si conferma: UPDATE OF regime_fiscale_rf
                  -- (trg_emittenti_fiscali_a20_regime_conferma_upd). Lo stesso
                  -- valore va bene: conta la colonna nominata.
                  IF jsonb_exists(v_campi, 'regime_fiscale_rf') THEN
                      UPDATE anagrafiche.emittenti_fiscali ef
                         SET regime_fiscale_rf = ef.regime_fiscale_rf
                       WHERE ef.id = v_ef_id;
                  END IF;

                  RETURN QUERY SELECT v_ef_id, v_sr_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_emittente_fiscale(
                  anagrafiche.soggetti.id%TYPE,
                  anagrafiche.emittenti_fiscali.codice%TYPE,
                  jsonb) IS
                  'Madre (2026-10-17): crea l''emittente fiscale di un soggetto, cioe'' il ruolo EF (script.fn_get_or_create_soggetto_ruolo) e la riga di anagrafiche.emittenti_fiscali, in una sola istruzione. p_campi: le chiavi opzionali attivo, regime_fiscale_rf, bollo_auto, bollo_soglia, rounding_policy, valuta_id (le assenti al DEFAULT; una chiave estranea: E_CAMPO_NON_AMMESSO, col campo). Un regime dichiarato e'' CONFERMATO: dopo la INSERT, un UPDATE del regime (la INSERT non conferma mai). Registri di numerazione e mapping di default nascono dai trigger. Duplicati (uq_emittenti_fiscali_ruolo, uq:codice) e regime fuori catalogo (fk_emittenti_fiscali_regimi_fiscali) escono dai vincoli, che il backend traduce per nome. Non controlla la partita IVA del soggetto (pre-check del backend, debito dichiarato) ne'' il permesso (dominio anagrafiche: al backend, precedente B-5). INVOKER. Ritorna (emittente_fiscale_id, soggetto_ruolo_id). Prende il posto di EmittentiFiscaliService.crea_emittente (2b-2) e dell''INSERT di dbops.fn_pgtap_crea_emittente. Brief: brief-db-processi-accensione-per-ambiente (2b-1).';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS anagrafiche.fn_crea_emittente_fiscale(uuid, character varying, jsonb);
