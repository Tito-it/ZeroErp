# IL GUARD DEL RUOLO CHIAMA LA SEDE UNICA
#   anagrafiche.trgfn_soggetti_ruoli_guard_indirizzi_required() -> trigger
#   (constraint trigger DEFERRABLE INITIALLY DEFERRED su
#    anagrafiche.soggetti_ruoli, AFTER INSERT OR UPDATE)
#   Brief: brief-db-fornitore-privato-indirizzi §9.5, giro 4.
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   Il corpo del trigger era il controllo degli obbligatori del ruolo, e non
#   guardava la natura del soggetto (§9.5). Il controllo ora sta in
#   anagrafiche.fn_guard_indirizzi_obbligatori_ruolo (-31), che chiamano
#   anche il trigger degli indirizzi (-35) e quello del cambio di natura
#   (-37): qui resta la chiamata.
#
# ── COSA CAMBIA ─────────────────────────────────────────────────
#   La regola e' quella di -31: la natura conta, vale il ripiego (Tid,
#   2026-11-17). Codice, frase e chiavi del contesto restano; il contesto
#   aggiunge la natura. Nessun DDL sul trigger: il montaggio non cambia.
#
# ── DA DOVE VIENE ───────────────────────────────────────────────
#   Doc auto-generata, rigenerata dopo 20261116-27. Attributi vivi:
#   VOLATILE, INVOKER, proconfig vuoto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261116-33-update-trgfn-soggetti-ruoli-guard-indirizzi-required-sede-unica-mctit.yaml

  - changeSet:
      id: 20261116-33-update-trgfn-soggetti-ruoli-guard-indirizzi-required-sede-unica
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il constraint trigger degli obbligatori del ruolo chiama il guard in sede unica
        (anagrafiche.fn_guard_indirizzi_obbligatori_ruolo), che legge la natura.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_ruoli_guard_indirizzi_required()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              BEGIN
                  IF TG_OP = 'DELETE' THEN
                      RETURN OLD;
                  END IF;

                  PERFORM anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(NEW.id, NEW.tx_id);

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_ruoli_guard_indirizzi_required()
              IS 'Constraint trigger DEFERRABLE su anagrafiche.soggetti_ruoli, all''INSERT e all''UPDATE: il ruolo scritto deve avere i suoi indirizzi obbligatori. Il controllo e'' anagrafiche.fn_guard_indirizzi_obbligatori_ruolo (il requisito sul tipo di ruolo e sulla natura del soggetto, col ripiego; E_INDIRIZZO_OBBLIGATORIO_MANCANTE al primo mancante), che chiamano anche i trigger della cancellazione o del cambio di tipo di un indirizzo (anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo) e del cambio di natura del soggetto (anagrafiche.trgfn_soggetti_guard_obbligatori_ruoli). ⛔ Da NON confondere con anagrafiche.trgfn_soggetti_guard_indirizzi_required, il gemello del layer SOGGETTO.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il corpo precedente e' in 20261116-27; si torna indietro con un changeSet nuovo.
              SELECT 1;
