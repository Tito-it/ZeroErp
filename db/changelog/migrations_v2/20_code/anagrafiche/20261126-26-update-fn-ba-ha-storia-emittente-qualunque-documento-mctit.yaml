# LA STORIA DI UN BILLING ACCOUNT E' QUALUNQUE DOCUMENTO, ANCHE IN BOZZA
#   anagrafiche.fn_ba_ha_storia_emittente(billing_account)
#   anagrafiche.fn_get_storia_emittente_ba(billing_account)
#   Brief: brief-db-revisione-anagrafiche §24.4-§24.5 (D-T4-4)
#
# -- LA REGOLA --------------------------------------------------------
#   Un billing account cambia azienda solo se non ha nessun documento, di
#   qualunque famiglia attiva che dichiara la colonna del billing account, e
#   in qualunque stato: anche una bozza chiude il cambio (Tid, 2026-11-26:
#   «se ci sono documenti il cliente non puo' cambiare azienda»; chi ha
#   sbagliato cancella i documenti). Revoca «conta solo il documento
#   numerato» (brief-db-registri-di-numerazione-emittente-e-trasloco,
#   2026-08-30); la finestra di correzione di D-1 (2026-08-26) resta, finche'
#   il billing account non ha nessun documento.
#
# -- LA FORMA ---------------------------------------------------------
#   * La sede resta una: le due funzioni smettono di chiedere il numero
#     (colonna_numero non si legge piu'); il resto del corpo e' quello vivo.
#   * Firma e RETURNS TABLE ri-ancorati (la doc auto-generata li scioglie).
#   * La frase di E_BA_EMITTENTE_CON_STORIA dice «documenti», non piu'
#     «documenti numerati» (80_data/sql/config/messaggi_errore.csv).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-26-update-fn-ba-ha-storia-emittente-qualunque-documento-mctit.yaml

  - changeSet:
      id: 20261126-26-update-fn-ba-ha-storia-emittente-qualunque-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La storia di un billing account e' qualunque documento, anche in bozza:
        anagrafiche.fn_ba_ha_storia_emittente e anagrafiche.fn_get_storia_emittente_ba
        non chiedono piu' il numero.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_ba_ha_storia_emittente(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la tabella dei documenti di ogni famiglia e' la target_table della
              --   sua sorgente (config.fn_sorgente_tabella), non piu'
              --   schema_tabella/nome_tabella; firma ancorata.
              DECLARE
                  -- la riga di una SELECT statica sul catalogo delle famiglie (§5e)
                  v_famiglia record;
                  -- l'esito di un EXISTS: nessuna colonna dietro
                  v_trovato  boolean;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rispondere alla SOLA domanda che serve al guard: questo
                  --   billing account ha gia' un documento, di qualunque
                  --   famiglia e in qualunque stato (anche in bozza)? Si
                  --   esce al PRIMO che si trova.
                  --
                  -- ⭐ Esiste separata dal conteggio perche' il guard gira su
                  --   OGNI movimento di un mapping, e li' cinque count(*)
                  --   sarebbero il prezzo di un'informazione che non si usa:
                  --   quanto grande sia la storia interessa solo alla frase
                  --   del rifiuto, cioe' quando si e' gia' deciso di rifiutare.
                  --
                  -- ⚠️ SECURITY DEFINER: fatture e commesse hanno la RLS. Da
                  --   INVOKER la storia di un ALTRO emittente sarebbe
                  --   invisibile e la risposta sarebbe «nessuna storia» proprio
                  --   nel caso da bloccare.
                  -- =========================================================
                  IF p_billing_account_id IS NULL THEN
                      -- La riga senza billing account e' quella del gestore
                      -- globale: non e' un cliente, e la guarda
                      -- anagrafiche.fn_guard_ba_gestore_globale_storia.
                      RETURN false;
                  END IF;

                  FOR v_famiglia IN
                      SELECT t.schema_tabella,
                             t.nome_tabella,
                             fd.colonna_billing_account
                        FROM vendite.famiglie_documento fd
                        -- ⭐ rev 2026-10-20: la tabella e' quella della sorgente (G-5).
                        -- ⚠️ LEFT e non CROSS: una famiglia attiva senza tabella (il
                        --   guard dei riferimenti non la lascia nascere) non deve
                        --   SPARIRE dal presidio: il format() con NULL fallisce
                        --   rumoroso, come prima una tabella che non c'era.
                        LEFT JOIN LATERAL config.fn_sorgente_tabella(fd.codice_interno) t ON true
                       WHERE fd.attivo
                         -- ⭐ Solo le famiglie che HANNO un billing account (dal
                         --   20260914-07 la colonna e' opzionale): una famiglia senza
                         --   BA non puo' contribuire alla storia di nessun BA. Il
                         --   salto sta QUI, nella query che sceglie, e non dentro il
                         --   format(): %I con NULL solleva un errore di PostgreSQL
                         --   senza codice di dominio, e %s con NULL tace.
                         AND COALESCE(btrim(fd.colonna_billing_account), '') <> ''
                       ORDER BY fd.id
                  LOOP
                      -- ⚠️ Identificatori da %I, valori da USING: il catalogo
                      --   e' dato, non codice.
                      EXECUTE format(
                          'SELECT EXISTS (SELECT 1 FROM %I.%I d'
                          || ' WHERE d.%I = $1)',
                          v_famiglia.schema_tabella,
                          v_famiglia.nome_tabella,
                          v_famiglia.colonna_billing_account)
                        INTO v_trovato
                       USING p_billing_account_id;

                      IF v_trovato THEN
                          RETURN true;
                      END IF;
                  END LOOP;

                  RETURN false;
              END;
              $function$;

              CREATE OR REPLACE FUNCTION anagrafiche.fn_get_storia_emittente_ba(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE)
               RETURNS TABLE(
                  famiglia_documento   vendite.famiglie_documento.codice_interno%TYPE,
                  famiglia_descrizione vendite.famiglie_documento.descrizione%TYPE,
                  -- un conteggio: nessuna colonna dietro
                  n_documenti          bigint)
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la tabella dei documenti di ogni famiglia e' la target_table della
              --   sua sorgente (config.fn_sorgente_tabella); famiglia_documento e'
              --   il codice della sorgente; firma e RETURNS TABLE ancorati.
              DECLARE
                  -- la riga di una SELECT statica sul catalogo delle famiglie (§5e)
                  v_famiglia record;
                  -- un conteggio: nessuna colonna dietro
                  -- un conteggio: nessuna colonna dietro
                  v_n        bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dire QUANTI documenti e DI CHE SPECIE hanno gia'
                  --   congelato l'emittente di questo billing account. Una
                  --   riga per famiglia che ha almeno un documento, in
                  --   qualunque stato (anche in bozza);
                  --   nessuna riga = nessuna storia.
                  --
                  -- ⭐ rev 2026-08-31: prima tornava (n_fatture, n_commesse) —
                  --   due colonne fisse, cioe' un elenco travestito da firma.
                  --   Ora la forma segue il catalogo, e il messaggio che legge
                  --   l'operatore puo' dire QUALE documento blocca: senza,
                  --   «non si puo'» manda a cercare a mano in cinque tabelle.
                  --
                  -- ⚠️ Si chiama SOLO nel ramo d'errore. Il si'/no del guard
                  --   lo da' anagrafiche.fn_ba_ha_storia_emittente.
                  -- =========================================================
                  IF p_billing_account_id IS NULL THEN
                      RETURN;
                  END IF;

                  FOR v_famiglia IN
                      SELECT fd.codice_interno,
                             fd.descrizione,
                             t.schema_tabella,
                             t.nome_tabella,
                             fd.colonna_billing_account
                        FROM vendite.famiglie_documento fd
                        -- ⭐ rev 2026-10-20: la tabella e' quella della sorgente (G-5).
                        -- ⚠️ LEFT e non CROSS: una famiglia attiva senza tabella (il
                        --   guard dei riferimenti non la lascia nascere) non deve
                        --   SPARIRE dal presidio: il format() con NULL fallisce
                        --   rumoroso, come prima una tabella che non c'era.
                        LEFT JOIN LATERAL config.fn_sorgente_tabella(fd.codice_interno) t ON true
                       WHERE fd.attivo
                         -- ⭐ Solo le famiglie che HANNO un billing account (dal
                         --   20260914-07 la colonna e' opzionale): una famiglia senza
                         --   BA non puo' contribuire alla storia di nessun BA. Il
                         --   salto sta QUI, nella query che sceglie, e non dentro il
                         --   format(): %I con NULL solleva un errore di PostgreSQL
                         --   senza codice di dominio, e %s con NULL tace.
                         AND COALESCE(btrim(fd.colonna_billing_account), '') <> ''
                       ORDER BY fd.id
                  LOOP
                      EXECUTE format(
                          'SELECT count(*) FROM %I.%I d'
                          || ' WHERE d.%I = $1',
                          v_famiglia.schema_tabella,
                          v_famiglia.nome_tabella,
                          v_famiglia.colonna_billing_account)
                        INTO v_n
                       USING p_billing_account_id;

                      -- ⚠️ Le famiglie a zero NON escono: «nessuna riga» e'
                      --   la risposta «nessuna storia», e chi compone la frase
                      --   non deve filtrare gli zeri.
                      IF v_n > 0 THEN
                          famiglia_documento   := v_famiglia.codice_interno;
                          famiglia_descrizione := v_famiglia.descrizione;
                          n_documenti          := v_n;
                          RETURN NEXT;
                      END IF;
                  END LOOP;

                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_ba_ha_storia_emittente(anagrafiche.billing_account.id%TYPE) IS
                'Il billing account ha gia'' un documento: di qualunque famiglia attiva di vendite.famiglie_documento che dichiara la colonna del billing account, e in qualunque stato, anche in bozza. E'' la storia che chiude il cambio d''azienda del billing account (script.fn_check_ba_cambio_emittente). Si esce al primo documento trovato. NULL: false. SECURITY DEFINER: i documenti hanno la RLS, e la storia di un''altra azienda deve contare.';
              COMMENT ON FUNCTION anagrafiche.fn_get_storia_emittente_ba(anagrafiche.billing_account.id%TYPE) IS
                'La storia del billing account per famiglia: una riga per ogni famiglia attiva di vendite.famiglie_documento con almeno un documento del billing account, in qualunque stato, col numero dei documenti. Nessuna riga = nessuna storia. Compone la frase di E_BA_EMITTENTE_CON_STORIA (script.fn_check_ba_cambio_emittente). SECURITY DEFINER: i documenti hanno la RLS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I corpi precedenti si ripristinano dai loro changeSet precedenti.
              SELECT 1;
