# P-9 (4 di 5) — la storia emittente (conteggio per famiglia) salta le famiglie senza billing account
#   anagrafiche.fn_get_storia_emittente_ba
#   Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3-bis
#
# -- CHE COSA CAMBIA, e dove ------------------------------------------------------
#   La query che SCEGLIE le famiglie del giro prende una condizione in piu':
#   `COALESCE(btrim(fd.colonna_billing_account), '') <> ''`. Una famiglia senza
#   billing account non puo' contribuire alla storia di nessun billing account,
#   ed e' corretto per costruzione escluderla. Il corpo del loop — il format()
#   con %I e i valori da USING — non cambia di una riga.
#
# -- PERCHE' NELLA QUERY E NON DENTRO LA COMPOSIZIONE ---------------------------
#   format('%I', NULL) solleva («i valori vuoti non possono essere formattati
#   come un identificativo SQL»): un errore di PostgreSQL, senza codice di
#   dominio, senza contesto, in un movimento di mapping emittente-BA che con le
#   famiglie non c'entra. E format('%s', NULL) tace, producendo stringa vuota.
#   Si salta PRIMA per non arrivarci (brief 3-bis, correzione del 02-09).
#
# -- CORPO DALLA FUNZIONE VIVA -----------------------------------------------------
#   pg_get_functiondef, identica alla doc auto-gen (verificato il 2026-09-14):
#   rev 2026-08-31 (C2-16). SECURITY DEFINER e search_path blindato restano
#   com'erano: tutte le tabelle sono qualificate.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260914-10-update-fn-get-storia-emittente-ba-salta-famiglie-senza-ba-mctit.yaml

  - changeSet:
      id: 20260914-10-update-fn-get-storia-emittente-ba-salta-famiglie-senza-ba
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_get_storia_emittente_ba: la query che sceglie le famiglie esclude quelle senza
        colonna_billing_account (NULL o vuota, opzionale dal 20260914-07). Il salto sta
        nella scelta, non nel format(). Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo,
        sezione 3-bis (P-9).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_get_storia_emittente_ba' AND p.pronargs = 1
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_attribute a
                   WHERE a.attrelid = 'vendite.famiglie_documento'::regclass
                     AND a.attname = 'colonna_billing_account' AND NOT a.attnotnull
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_get_storia_emittente_ba(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE
              )
               RETURNS TABLE (
                  famiglia_documento   vendite.famiglie_documento.codice_interno%TYPE,
                  famiglia_descrizione vendite.famiglie_documento.descrizione%TYPE,
                  -- un CONTEGGIO: nessuna colonna lo riflette, resta esplicito
                  n_documenti          bigint
              )
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_famiglia record;
                  v_n        bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dire QUANTI documenti e DI CHE SPECIE hanno gia'
                  --   congelato l'emittente di questo billing account. Una
                  --   riga per famiglia che ha almeno un documento numerato;
                  --   nessuna riga = nessuna storia.
                  --
                  -- ⭐ rev 2026-08-31: prima tornava (n_fatture, n_commesse) —
                  --   due colonne fisse, cioe' un elenco travestito da firma.
                  --   Ora la forma segue il catalogo, e il messaggio che legge
                  --   l'operatore puo' dire QUALE documento blocca: senza,
                  --   «non si puo'» manda a cercare a mano in cinque tabelle.
                  --
                  -- ⚠️ Si chiama SOLO nel ramo d'errore. Il si'/no del guard
                  --   lo da' anagrafiche.fn_ba_ha_storia_emittente.
                  -- =========================================================
                  IF p_billing_account_id IS NULL THEN
                      RETURN;
                  END IF;

                  FOR v_famiglia IN
                      SELECT fd.codice_interno,
                             fd.descrizione,
                             fd.schema_tabella,
                             fd.nome_tabella,
                             fd.colonna_numero,
                             fd.colonna_billing_account
                        FROM vendite.famiglie_documento fd
                       WHERE fd.attivo
                         -- ⭐ Solo le famiglie che HANNO un billing account (dal
                         --   20260914-07 la colonna e' opzionale): una famiglia senza
                         --   BA non puo' contribuire alla storia di nessun BA. Il
                         --   salto sta QUI, nella query che sceglie, e non dentro il
                         --   format(): %I con NULL solleva un errore di PostgreSQL
                         --   senza codice di dominio, e %s con NULL tace.
                         AND COALESCE(btrim(fd.colonna_billing_account), '') <> ''
                       ORDER BY fd.id
                  LOOP
                      EXECUTE format(
                          'SELECT count(*) FROM %I.%I d'
                          || ' WHERE d.%I = $1'
                          || '   AND d.%I IS NOT NULL'
                          || '   AND btrim(d.%I::text) <> $2',
                          v_famiglia.schema_tabella,
                          v_famiglia.nome_tabella,
                          v_famiglia.colonna_billing_account,
                          v_famiglia.colonna_numero,
                          v_famiglia.colonna_numero)
                        INTO v_n
                       USING p_billing_account_id, ''::text;

                      -- ⚠️ Le famiglie a zero NON escono: «nessuna riga» e'
                      --   la risposta «nessuna storia», e chi compone la frase
                      --   non deve filtrare gli zeri.
                      IF v_n > 0 THEN
                          famiglia_documento   := v_famiglia.codice_interno;
                          famiglia_descrizione := v_famiglia.descrizione;
                          n_documenti          := v_n;
                          RETURN NEXT;
                      END IF;
                  END LOOP;

                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_get_storia_emittente_ba(anagrafiche.billing_account.id%TYPE)
              IS 'Quanti documenti e DI CHE SPECIE hanno gia'' congelato l''emittente di un billing account: una riga per famiglia con almeno un documento NUMERATO, nessuna riga se non c''e'' storia. ⭐ rev 2026-08-31 (brief-db-registri-di-numerazione-emittente-e-trasloco, C2-16): prima tornava (n_fatture, n_commesse), due colonne fisse — cioe'' un elenco travestito da firma. Ora la forma segue vendite.famiglie_documento, e il messaggio del rifiuto puo'' dire QUALE documento blocca: senza, un «non si puo''» manda a cercare a mano in cinque tabelle. ⛔ CAMBIA LA DEFINIZIONE DI STORIA, e la ragione e'' il trasloco: l''argomento che escludeva ordini e DDT — «il loro emittente ha un trgfn_*_guard_emittente_ba che glielo ricontrolla a ogni scrittura, quindi non e'' una copia stantia» — cade nel momento in cui quei documenti prendono il NUMERO dal registro di quell''emittente, perche'' il numero nessuno lo rinumera. La regola nuova e'' categorica: ogni famiglia che ha un registro e'' per costruzione per-emittente, quindi blocca. ⭐ Ed e'' DERIVATA, non elencata: il sesto documento entra nella regola il giorno in cui si registra la sua famiglia, e non esiste nessun elenco parallelo che possa restare indietro — lo stesso principio della primitiva di pulizia che scopre le figlie da pg_constraint. ⚠️ IL PERIMETRO NON SI ALLARGA SOLTANTO: entrano DDT, ordini e resi numerati, ed ESCE la fattura in BOZZA — che prima si contava perche'' il conteggio era un count(*) senza condizione sul numero. E'' voluto: una bozza non ha congelato niente (vendite.trgfn_fatture_guard_uscita_draft pretende emittente_snapshot solo per USCIRE da DRAFT), ed e'' esattamente il caso per cui la finestra di correzione esiste. ⛔ Resta scoperto un punto, e va detto: una bozza porta gia'' emittente_soggetto_ruolo_id e su vendite.fatture non c''e'' un guard che lo ricontrolli col BA, quindi spostare il BA la lascerebbe sull''emittente vecchio — ma resta una bozza, si cancella e si rifa'', e presidiarla costerebbe la finestra di correzione per intero. ⚠️ Si chiama SOLO nel ramo d''errore: il si''/no del guard lo da'' anagrafiche.fn_ba_ha_storia_emittente, che esce al primo documento. ⚠️ SQL dinamico: identificatori da %I, valori da USING; una riga di catalogo sbagliata romperebbe qui a runtime, ed e'' la ragione del guard vendite.trgfn_famiglie_documento_guard_riferimenti. ⚠️ SECURITY DEFINER per la RLS, come nella versione precedente. ℹ️ Input NULL -> nessuna riga: la riga senza billing account e'' quella del gestore globale, e la guarda anagrafiche.fn_guard_ba_gestore_globale_storia. Piano: brief-db-registri-di-numerazione-emittente-e-trasloco, C2-16. ⭐ rev 2026-09-14 (P-9, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 3-bis): famiglie_documento.colonna_billing_account e'' opzionale, e una famiglia senza billing account (l''ordine di acquisto) NON entra nel giro: il salto sta nella query che SCEGLIE le famiglie, non dentro il format() — un %I con NULL solleverebbe un errore di PostgreSQL senza codice di dominio, e un %s con NULL produrrebbe stringa vuota senza fiatare. Il predicato resta derivato dal catalogo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
