# UN CLIENTE MANUALE PER SOGGETTO, UTILITY E AZIENDA — movimento 3: fittizia
#   NASCE anagrafiche.trgfn_istanze_utilities_guard_clienti_chiave
#   + constraint trigger trg_istanze_utilities_z90_guard_clienti_chiave_upd
#     (AFTER UPDATE ... WHEN fittizia cambia, DEFERRABLE INITIALLY DEFERRED).
#   Brief: brief-db-cliente-manuale-uno-per-soggetto-e-utility (§4-bis)
#
# -- PERCHE' --------------------------------------------------------
#   La regola vale fra le istanze fittizie (C-1), e istanze_utilities.fittizia
#   non ha un lock: un'istanza che diventa fittizia porta i suoi clienti
#   dentro la chiave. Si guarda il CAMBIO di valore (WHEN), non la colonna
#   nel SET (linee-guida-trigger). Nell'altro verso il guard non trova
#   niente ed esce.
# Ritorno indietro: DROP del trigger e della funzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261014-14-create-trigger-istanze-guard-clienti-chiave-mctit.yaml

  - changeSet:
      id: 20261014-14-create-trigger-istanze-guard-clienti-chiave
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Constraint trigger al COMMIT su anagrafiche.istanze_utilities: un'istanza che diventa
        fittizia non porta un doppione di cliente manuale (E_CLIENTE_STESSA_CHIAVE). Brief:
        brief-db-cliente-manuale-uno-per-soggetto-e-utility.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_istanze_utilities_guard_clienti_chiave()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Al COMMIT: i clienti dell'istanza che e' entrata (o
                -- uscita) dalle fittizie.
                PERFORM anagrafiche.fn_guard_clienti_chiave_unica_di(NULL, NEW.id);
                RETURN NULL;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_istanze_utilities_guard_clienti_chiave()
              IS 'Constraint trigger function (AFTER UPDATE DEFERRABLE INITIALLY DEFERRED su anagrafiche.istanze_utilities, quando fittizia cambia): i clienti dell''istanza entrano o escono dalla regola del cliente manuale; delega ad anagrafiche.fn_guard_clienti_chiave_unica_di (E_CLIENTE_STESSA_CHIAVE). Brief: brief-db-cliente-manuale-uno-per-soggetto-e-utility.';

              CREATE CONSTRAINT TRIGGER trg_istanze_utilities_z90_guard_clienti_chiave_upd
                AFTER UPDATE ON anagrafiche.istanze_utilities
                DEFERRABLE INITIALLY DEFERRED
                FOR EACH ROW
                WHEN (OLD.fittizia IS DISTINCT FROM NEW.fittizia)
                EXECUTE FUNCTION anagrafiche.trgfn_istanze_utilities_guard_clienti_chiave();

              COMMENT ON TRIGGER trg_istanze_utilities_z90_guard_clienti_chiave_upd
                ON anagrafiche.istanze_utilities
              IS 'Al COMMIT: un''istanza che diventa fittizia non porta un doppione di cliente manuale (E_CLIENTE_STESSA_CHIAVE). Brief: brief-db-cliente-manuale-uno-per-soggetto-e-utility.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_istanze_utilities_z90_guard_clienti_chiave_upd ON anagrafiche.istanze_utilities;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_istanze_utilities_guard_clienti_chiave();
