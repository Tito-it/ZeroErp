# Liquibase changelog per Zero ERP
# Trigger normalize su indirizzi (ruolo) e indirizzi_soggetti (soggetto)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251218-04-create-triggers-indirizzi-base-normalize-mctit.yaml

  - changeSet:
      id: 20251218-04-create-triggers-indirizzi-base-normalize
      author: mctit
      comment: >
        Collega anagrafiche.trgfn_indirizzi_base_normalize() alle tabelle:
        - anagrafiche.indirizzi
        - anagrafiche.indirizzi_soggetti

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- -----------------------------
              -- anagrafiche.indirizzi
              -- -----------------------------
              DROP TRIGGER IF EXISTS trg_indirizzi_normalize_ins_upd ON anagrafiche.indirizzi;

              CREATE TRIGGER trg_indirizzi_normalize_ins_upd
              BEFORE INSERT OR UPDATE
              ON anagrafiche.indirizzi
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_indirizzi_base_normalize();

              COMMENT ON TRIGGER trg_indirizzi_normalize_ins_upd ON anagrafiche.indirizzi
              IS 'Normalizza campi indirizzo (base): pulizia fallback/liberi e default stato_id (usa trgfn_indirizzi_base_normalize).';

              -- -----------------------------
              -- anagrafiche.indirizzi_soggetti
              -- -----------------------------
              DROP TRIGGER IF EXISTS trg_indirizzi_soggetti_normalize_ins_upd ON anagrafiche.indirizzi_soggetti;

              CREATE TRIGGER trg_indirizzi_soggetti_normalize_ins_upd
              BEFORE INSERT OR UPDATE
              ON anagrafiche.indirizzi_soggetti
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_indirizzi_base_normalize();

              COMMENT ON TRIGGER trg_indirizzi_soggetti_normalize_ins_upd ON anagrafiche.indirizzi_soggetti
              IS 'Normalizza campi indirizzo soggetto (base): pulizia fallback/liberi e default stato_id (usa trgfn_indirizzi_base_normalize).';

  - changeSet:
      id: 20251218-04-01-drop-trgfn_indirizzi_normalize
      author: mctit
      # runOnChange: true
      validCheckSum:
        - ANY
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |

              DROP TRIGGER IF EXISTS trg_indirizzi_ins_upd_clean_fields ON anagrafiche.indirizzi;

              DROP FUNCTION IF EXISTS anagrafiche.trgfn_indirizzi_normalize();
