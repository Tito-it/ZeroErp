# anagrafiche.trgfn_indirizzi_base_normalize — tre cambi
#   1. lo stato che manca lo propone script.fn_stato_proposto_id (20261018-83)
#      al posto di fn_get_default_by_param su state_code_iso3 (ritirati);
#   2. postal_box si chiama postal_code (20261018-81);
#   3. nell'indirizzo libero i campi di testo vuoti diventano NULL: una
#      localita' '' passava il CHECK (IS NOT NULL) e non diceva niente.
#      Il guard della forma (20261018-90) gira dopo e vede i NULL.
#   Corpo vivo preso dal database (= doc auto-gen), il resto invariato.
#   D-1 e D-3 di Tid (2026-10-18), richiesta BE in
#   brief-db-processi-accensione-per-ambiente §6.11.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261018-84-update-trgfn-indirizzi-base-normalize-stato-proposto-mctit.yaml

  - changeSet:
      id: 20261018-84-update-trgfn-indirizzi-base-normalize-stato-proposto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_indirizzi_base_normalize: lo stato mancante dal BB script.fn_stato_proposto_id,
        postal_box -> postal_code, i campi di testo vuoti dell'indirizzo libero a NULL. D-1 e
        D-3 di Tid (2026-10-18).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_base_normalize()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              BEGIN
                IF NEW.indirizzo_dettaglio_id IS NOT NULL THEN
                  -- pulisco i fallback/liberi (evita mix normalizzato+libero)
                  NEW.stato_id             := NULL;
                  NEW.indirizzo_libero     := NULL;
                  NEW.comune_id            := NULL;
                  NEW.codice_postale_id    := NULL;
                  NEW.administrative_area  := NULL;
                  NEW.locality             := NULL;
                  NEW.sublocality          := NULL;
                  NEW.postal_code          := NULL;

                  -- geoloc: coerente con sync_geoloc (si ricalcola da indirizzi_dettaglio)
                  NEW.geoloc := NULL;

                ELSE
                  -- Indirizzo libero. Un testo vuoto non e' un valore: a NULL,
                  -- cosi' il CHECK e il guard della forma (z10, dopo) lo vedono
                  -- per quello che e' (rev 2026-10-18).
                  NEW.indirizzo_libero    := NULLIF(btrim(NEW.indirizzo_libero), '');
                  NEW.locality            := NULLIF(btrim(NEW.locality), '');
                  NEW.postal_code         := NULLIF(btrim(NEW.postal_code), '');
                  NEW.administrative_area := NULLIF(btrim(NEW.administrative_area), '');
                  NEW.sublocality         := NULLIF(btrim(NEW.sublocality), '');

                  -- Lo stato non detto: quello proposto (rev 2026-10-18, D-1 di
                  -- Tid). Il BB valida e non ripiega.
                  IF NEW.stato_id IS NULL THEN
                    NEW.stato_id := script.fn_stato_proposto_id(TG_NAME);
                  END IF;
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_indirizzi_base_normalize() IS
                  'Trigger function generica: normalizza indirizzi (ruolo/soggetto). Se indirizzo_dettaglio_id presente pulisce fallback/liberi; altrimenti, nell''indirizzo libero, porta a NULL i testi vuoti (indirizzo_libero, locality, postal_code, administrative_area, sublocality) e scrive lo stato non detto con script.fn_stato_proposto_id. Rev 2026-10-18 (D-1 e D-3 di Tid): prima leggeva state_code_iso3 con fn_get_default_by_param, e la colonna si chiamava postal_box. Il guard della forma, anagrafiche.trgfn_indirizzi_guard_forma_libera, gira dopo (z10).';
      rollback:
        - sql:
            sql: >
              SELECT 1; -- il corpo precedente leggeva state_code_iso3 e postal_box, ritirati
