# LA CREAZIONE DEL BA CON L'AZIENDA CHIESTA MODIFICA IL COLLEGAMENTO NATO
#   anagrafiche.fn_crea_billing_account(...)
#   Brief: brief-db-revisione-anagrafiche §24.5 (D-T4-3), §24.7.1 (S33 b)
#
# -- LA REGOLA --------------------------------------------------------
#   Il BA nasce sempre collegato (trg_billing_account_z90_link_ef_ins,
#   20261126-27): all'azienda di chi agisce, o alla predefinita senza
#   sessione. Con p_emittente_soggetto_ruolo_id:
#     * senza sessione, un'azienda diversa da quella del collegamento nato si
#       scrive MODIFICANDO il collegamento: il BA e' appena nato e non ha
#       documenti (prima si inseriva un collegamento, che ora c'e' sempre);
#     * con un operatore in sessione il BA e' dell'azienda di chi agisce, e
#       un'azienda diversa resta una chiamata sbagliata (E_SCRIPT_CHIAMATA_NON_VALIDA).
#   S33 (Tid, b): i guard di nascita z95 (albero, istanza) restano immediati.
#   Il limite resta scritto nel COMMENT: senza sessione giudicano il BA
#   sull'azienda predefinita, prima della modifica.
#
# -- LA FORMA ---------------------------------------------------------
#   * Firma e RETURNS TABLE ri-ancorati (la doc auto-generata li scioglie):
#     stessi tipi, stessa funzione.
#   * Il resto del corpo e' quello vivo del catalogo, invariato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-34-update-fn-crea-billing-account-collegamento-chiesto-mctit.yaml

  - changeSet:
      id: 20261126-34-update-fn-crea-billing-account-collegamento-chiesto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_crea_billing_account, senza sessione, porta il BA appena nato all'azienda
        chiesta modificando il collegamento che la nascita ha gia' scritto.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_billing_account(
                  p_soggetto_ruolo_id           anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                  p_utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                  -- i campi del chiamante: un oggetto, nessuna colonna dietro
                  p_campi                       jsonb DEFAULT '{}'::jsonb,
                  p_istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE DEFAULT NULL,
                  -- i campi dell'istanza nuova: un oggetto, nessuna colonna dietro
                  p_istanza                     jsonb DEFAULT '{}'::jsonb,
                  p_emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                  billing_account_id anagrafiche.billing_account.id%TYPE,
                  istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- i due oggetti del chiamante, col vuoto al posto di NULL
                  v_campi       jsonb := COALESCE(p_campi, '{}'::jsonb);
                  v_istanza     jsonb := COALESCE(p_istanza, '{}'::jsonb);
                  v_soggetto_id anagrafiche.soggetti_ruoli.soggetto_id%TYPE;
                  v_ist_id      anagrafiche.billing_account.istanza_utility_id%TYPE := p_istanza_utility_id;
                  v_ba_id       anagrafiche.billing_account.id%TYPE;
                  v_link_sr     anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE;
                  -- gli elenchi dei campi ammessi: nomi di colonna, non valori
                  c_ammesse_ba  CONSTANT text[] := ARRAY[
                      'categoria_cliente_id', 'codice', 'fatturazione_ordini',
                      'parent_account_id', 'valuta_id'];
                  c_ammesse_ist CONSTANT text[] := ARRAY['codice', 'indirizzo_dettaglio_id'];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Creare il billing account di un ruolo per una utility:
                  --   l'istanza fittizia (se p_istanza_utility_id e' NULL, coi
                  --   campi di p_istanza), il BA coi campi di p_campi (riletto
                  --   a istruzione finita), il legame all'emittente se
                  --   p_emittente_soggetto_ruolo_id e' indicato. Ritorna
                  --   (billing_account_id, istanza_utility_id).
                  --
                  -- Regole:
                  --   - chiave estranea: E_CAMPO_NON_AMMESSO; null = assente;
                  --   - istanza esistente e campi di un'istanza nuova insieme,
                  --     o un legame discorde: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - il resto lo dicono i guard e i vincoli delle tabelle.
                  -- =========================================================
                  IF p_soggetto_ruolo_id IS NULL OR p_utility_id IS NULL
                     OR jsonb_typeof(v_campi) <> 'object' OR jsonb_typeof(v_istanza) <> 'object'
                     OR (p_istanza_utility_id IS NOT NULL AND v_istanza <> '{}'::jsonb) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_crea_billing_account', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('soggetto_ruolo_id',  p_soggetto_ruolo_id,
                                             'utility_id',         p_utility_id,
                                             'istanza_utility_id', p_istanza_utility_id,
                                             'tipo_campi',         jsonb_typeof(v_campi),
                                             'tipo_istanza',       jsonb_typeof(v_istanza)),
                          NULL::uuid,
                          'anagrafiche.fn_crea_billing_account',
                          'ruolo o utility mancanti, campi non oggetti, o istanza esistente con i campi di una nuova');
                  END IF;

                  -- Prima i campi del BA, poi quelli dell'istanza: la prima chiave
                  -- estranea che si trova e' quella che si rifiuta.
                  PERFORM script.fn_guard_campi_ammessi(
                      v_campi, c_ammesse_ba,
                      'anagrafiche', 'anagrafiche.fn_crea_billing_account',
                      jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id));
                  PERFORM script.fn_guard_campi_ammessi(
                      v_istanza, c_ammesse_ist,
                      'anagrafiche', 'anagrafiche.fn_crea_billing_account',
                      jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id));

                  SELECT sr.soggetto_id
                    INTO v_soggetto_id
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = p_soggetto_ruolo_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_crea_billing_account', 'E_SOGGETTO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          NULL::uuid,
                          p_soggetto_ruolo_id::text);
                  END IF;

                  -- 1. L'istanza fittizia, se non se ne indica una.
                  IF v_ist_id IS NULL THEN
                      v_ist_id := (script.fn_scrivi_riga_da_jsonb(
                                       'anagrafiche.istanze_utilities'::regclass,
                                       jsonb_strip_nulls(v_istanza)
                                       || jsonb_build_object('soggetto_id', v_soggetto_id,
                                                             'fittizia',    true))
                                   ->> 'id')::bigint;
                  END IF;

                  -- 2. Il BA, riletto a istruzione finita per la coppia
                  --    (uq_billing_instance_utility): sotto la RLS la riga si
                  --    vede solo dopo il legame scritto dal trigger AFTER.
                  v_ba_id := (script.fn_scrivi_riga_da_jsonb(
                                  'anagrafiche.billing_account'::regclass,
                                  jsonb_strip_nulls(v_campi)
                                  || jsonb_build_object('istanza_utility_id', v_ist_id,
                                                        'soggetto_ruolo_id',  p_soggetto_ruolo_id,
                                                        'utility_id',         p_utility_id),
                                  NULL,
                                  ARRAY['istanza_utility_id', 'utility_id'])
                              ->> 'id')::bigint;

                  -- 3. L'azienda chiesta. Il BA nasce gia' collegato
                  --    (trg_billing_account_z90_link_ef_ins): all'azienda di chi
                  --    agisce o, senza sessione, alla predefinita.
                  IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                      SELECT efba.emittente_soggetto_ruolo_id
                        INTO v_link_sr
                        FROM anagrafiche.emittenti_fiscali_billing_account efba
                       WHERE efba.billing_account_id = v_ba_id;

                      IF v_link_sr IS DISTINCT FROM p_emittente_soggetto_ruolo_id
                         AND script.fn_utente_di_sessione('anagrafiche.fn_crea_billing_account') IS NULL THEN
                          -- Senza sessione: il BA, appena nato e senza documenti, passa
                          -- all'azienda chiesta modificando il suo collegamento (il
                          -- collegamento non si cancella ne' si ricrea).
                          -- ⚠️ Alias obbligatorio: billing_account_id e' anche una
                          --   colonna del RETURNS TABLE, e il nome nudo e' ambiguo.
                          UPDATE anagrafiche.emittenti_fiscali_billing_account efba
                             SET emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id
                           WHERE efba.billing_account_id = v_ba_id;
                      ELSIF v_link_sr IS DISTINCT FROM p_emittente_soggetto_ruolo_id THEN
                          -- Con un operatore in sessione il BA e' dell'azienda di chi
                          -- agisce: un'azienda diversa e' una chiamata sbagliata.
                          PERFORM script.fn_log_and_raise_error(
                              'anagrafiche', 'anagrafiche.fn_crea_billing_account', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                              jsonb_build_object('billing_account_id',       v_ba_id,
                                                 'emittente_legato',         v_link_sr,
                                                 'emittente_chiesto',        p_emittente_soggetto_ruolo_id),
                              NULL::uuid,
                              'anagrafiche.fn_crea_billing_account',
                              'il BA e'' gia'' legato all''emittente di chi agisce, non a quello chiesto');
                      END IF;
                  END IF;

                  RETURN QUERY SELECT v_ba_id, v_ist_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_billing_account(
                  anagrafiche.billing_account.soggetto_ruolo_id%TYPE,
                  anagrafiche.billing_account.utility_id%TYPE,
                  jsonb,
                  anagrafiche.billing_account.istanza_utility_id%TYPE,
                  jsonb,
                  anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE) IS
                'Crea il billing account di un ruolo per una utility, in una sola istruzione. Se p_istanza_utility_id e'' NULL nasce l''istanza utility fittizia del soggetto del ruolo, coi campi di p_istanza (codice, indirizzo_dettaglio_id); con un''istanza indicata p_istanza deve essere vuoto. Il BA coi campi di p_campi (categoria_cliente_id, codice, fatturazione_ordini, parent_account_id, valuta_id; le assenti e le null al DEFAULT, il codice lo genera il trigger), riletto a istruzione finita per (istanza_utility_id, utility_id) con script.fn_scrivi_riga_da_jsonb. Il BA nasce collegato a un''azienda (anagrafiche.trgfn_billing_account_link_ef): quella di chi agisce, o la predefinita senza sessione. Con p_emittente_soggetto_ruolo_id, senza sessione, il collegamento si modifica verso l''azienda chiesta; con un operatore in sessione un''azienda diversa dalla sua e'' E_SCRIPT_CHIAMATA_NON_VALIDA. Chiave estranea: E_CAMPO_NON_AMMESSO; ruolo inesistente: E_SOGGETTO_RUOLO_NON_TROVATO; chiamata malformata: E_SCRIPT_CHIAMATA_NON_VALIDA. Il resto lo dicono i guard e i vincoli. Limite: i guard di nascita (albero e istanza su un''azienda sola) giudicano il BA all''INSERT, prima della modifica: senza sessione un BA con un''azienda chiesta diversa dalla predefinita e un padre, o un''istanza, su quell''azienda non passa. INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente si ripristina dal suo changeSet precedente.
              SELECT 1;
