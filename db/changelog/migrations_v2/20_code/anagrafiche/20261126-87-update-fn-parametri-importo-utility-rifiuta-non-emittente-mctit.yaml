# I PARAMETRI D'IMPORTO DI UN EMITTENTE: UN RUOLO CHE NON E' UN EMITTENTE SI RIFIUTA
#   anagrafiche.fn_parametri_importo_utility(bigint, integer)  (corpo, COMMENT)
#   Brief: brief-db-revisione-anagrafiche §25.3 (S54b), §25.9 (D-T8b-2)
#
# -- IL DIFETTO -------------------------------------------------------
#   La funzione legge l'emittente in LEFT JOIN: con un ruolo che non e' un
#   emittente (o NULL) non trovava la sua riga ne' la sua policy generale, e
#   rispondeva in silenzio i valori di sistema dell'utility, come per
#   un'azienda vera senza personalizzazioni. Il caso e' raggiungibile:
#   vendite.fatture.emittente_soggetto_ruolo_id ha la FK su soggetti_ruoli, non
#   su emittenti_fiscali (il disegno di T12), e la funzione resta chiamabile con
#   qualunque bigint. Chiamanti: vendite.fn_ricalcola_totali_fattura,
#   vendite.fn_parametri_importo_riga (dal trigger delle righe fattura),
#   anagrafiche.fn_lookup_utilities_per_ba.
#
# -- LA CORREZIONE ----------------------------------------------------
#   Un ruolo che non e' un emittente, o NULL, e' E_PARAMETRO_INVALIDO: un
#   valore sbagliato del chiamante, come il ruolo che non e' quello del BA in
#   fn_lookup_utilities_per_ba (§24.9). ⛔ Zero righe non bastava: e' gia' il
#   segnale dell'utility che manca, che i lettori traducono in
#   E_CONFIG_MANCANTE «utility mancante o sconosciuta», cioe' la causa
#   sbagliata. Quel segnale resta com'era: un'utility che non c'e' (o NULL) da'
#   zero righe.
#
# -- LA FORMA ---------------------------------------------------------
#   Resta LANGUAGE sql BEGIN ATOMIC (§5c): le dipendenze in pg_depend. Il
#   rifiuto e' la prima istruzione del corpo: chiama il rubinetto
#   (script.fn_log_and_raise_error) solo quando l'emittente non c'e'. La
#   funzione nel target di una SELECT senza FROM si valuta solo se la WHERE la
#   ammette (§5e: e' nel FROM che si valuterebbe sempre). L'ultima istruzione
#   e' la SELECT di prima, invariata: e' quella che il chiamante riceve.
#   ⚠️ Con due istruzioni la funzione non si espande piu' dentro chi la chiama
#   (vendite.fn_parametri_importo_riga): una chiamata per riga di fattura.
#   Attributi vivi invariati: STABLE, INVOKER, COST 100, ROWS 1000, nessuna
#   SET. Firma invariata. pgjdbc esegue un BEGIN ATOMIC solo da solo nel suo
#   sql:, il COMMENT sta nel secondo.
#   Presidio: db/pgtap/vendite/test-parametri-importo-utility-v1.sql (13, 14;
#   6 e 12 per l'utility che manca).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-87-update-fn-parametri-importo-utility-rifiuta-non-emittente-mctit.yaml

  - changeSet:
      id: 20261126-87-update-fn-parametri-importo-utility-rifiuta-non-emittente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_parametri_importo_utility: un ruolo che non e' un emittente, o NULL, e'
        E_PARAMETRO_INVALIDO invece dei valori di sistema. brief-db-revisione-anagrafiche
        §25.9 (D-T8b-2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_parametri_importo_utility(
                  p_emittente_soggetto_ruolo_id  anagrafiche.emittenti_fiscali_utilities.emittente_soggetto_ruolo_id%TYPE,
                  p_utility_id                   config.utilities.id%TYPE
              )
               RETURNS TABLE(
                  arrotondamento_importi_dec     config.utilities.arrotondamento_importi_dec%TYPE,
                  metodo_arrotondamento_importi  config.utilities.metodo_arrotondamento_importi%TYPE,
                  minimo_soglia_min              anagrafiche.emittenti_fiscali_utilities.minimo_soglia_min%TYPE,
                  minimo_soglia_max              anagrafiche.emittenti_fiscali_utilities.minimo_soglia_max%TYPE,
                  -- tipo esplicito: non e' una colonna, dice se la riga
                  -- dell'emittente c'e'
                  personalizzata                 boolean
              )
               LANGUAGE sql
               STABLE
               SECURITY INVOKER
              BEGIN ATOMIC
                  SELECT script.fn_log_and_raise_error(
                             'anagrafiche',
                             'fn_parametri_importo_utility',
                             'E_PARAMETRO_INVALIDO',
                             jsonb_build_object(
                                 'detail', 'p_emittente_soggetto_ruolo_id non e'' un emittente',
                                 'emittente_soggetto_ruolo_id', p_emittente_soggetto_ruolo_id,
                                 'utility_id', p_utility_id),
                             NULL::uuid,
                             'p_emittente_soggetto_ruolo_id non e'' un emittente')
                   WHERE NOT EXISTS (SELECT 1
                                       FROM anagrafiche.emittenti_fiscali ef
                                      WHERE ef.soggetto_ruolo_id = p_emittente_soggetto_ruolo_id);

                  SELECT COALESCE(e.arrotondamento_importi_dec, u.arrotondamento_importi_dec),
                         COALESCE(e.metodo_arrotondamento_importi, ef.rounding_policy,
                                  u.metodo_arrotondamento_importi),
                         e.minimo_soglia_min,
                         e.minimo_soglia_max,
                         (e.id IS NOT NULL)
                    FROM config.utilities u
                    LEFT JOIN anagrafiche.emittenti_fiscali_utilities e
                      ON e.utility_id = u.id
                     AND e.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id
                     AND e.attivo IS TRUE
                    LEFT JOIN anagrafiche.emittenti_fiscali ef
                      ON ef.soggetto_ruolo_id = p_emittente_soggetto_ruolo_id
                   WHERE u.id = p_utility_id;
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION anagrafiche.fn_parametri_importo_utility(
                  anagrafiche.emittenti_fiscali_utilities.emittente_soggetto_ruolo_id%TYPE,
                  config.utilities.id%TYPE) IS
                  'I parametri d''importo effettivi di un emittente per una utility: decimali e metodo d''arrotondamento della riga attiva di anagrafiche.emittenti_fiscali_utilities se c''e'', altrimenti (per il solo metodo) la policy generale emittenti_fiscali.rounding_policy, altrimenti il valore di sistema di config.utilities; le soglie del minimo solo dall''emittente (NULL = nessun minimo); personalizzata = la riga dell''emittente c''e''. Un ruolo che non e'' un emittente, o NULL, solleva E_PARAMETRO_INVALIDO: i valori di sistema sono quelli di un''azienda senza personalizzazioni, non la risposta per chi azienda non e''. Una riga se l''utility esiste, zero se non esiste o e'' NULL: e'' il segnale che i lettori traducono in E_CONFIG_MANCANTE. Sede unica: la leggono vendite.fn_ricalcola_totali_fattura, vendite.fn_parametri_importo_riga e anagrafiche.fn_lookup_utilities_per_ba.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: il corpo precedente e' il 20261021-01.
              SELECT 1;
