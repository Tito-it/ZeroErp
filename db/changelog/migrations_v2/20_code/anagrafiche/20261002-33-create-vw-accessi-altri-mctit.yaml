# anagrafiche.vw_accessi_altri: IL TAB «ALTRI ACCESSI»
#   Brief: brief-db-be-fe-area-accessi, R-DB-A2 (sezione 7.4)
#
# -- CHI C'E' -----------------------------------------------------------------------
#   Una riga per credenziale di categoria ALTRO (script.fn_categoria_accesso):
#   le persone senza veste operatore, cioe' clienti e fornitori del portale,
#   clienti dello shop, e le credenziali SENZA alcuna veste (nessun_accesso). Le
#   credenziali vengono da script.fn_credenziali() — l'unico modo di vedere anche
#   quelle senza veste — e la categoria decide in quale tab stanno: questa vista
#   non ha un predicato suo, e la partizione resta vera per costruzione (A-2).
#
# -- LE COLONNE -------------------------------------------------------------------------
#   auth_user_id, username, email, nome, cognome   la credenziale
#   nome_visualizzato   nome e cognome della credenziale; se Django non li ha,
#                       lo username. ⚠️ Non il soggetto della veste: per un
#                       cliente azienda e' l'azienda, non la persona che accede.
#   vesti (jsonb)       una voce per veste, anche spenta: identita_id,
#                       ruolo_applicativo, stato (script.fn_stato_veste: ATTIVO /
#                       PENDING / NON_SPEDITO / DISATTIVO), attivo, valido_dal,
#                       valido_al, invito_inviato_at, token_scade_at, il soggetto
#                       collegato (soggetto_id, soggetto_ruolo_id, soggetto) e gli
#                       id che servono al FE per aprirne la scheda:
#                         cliente_ids  ARRAY, ⚠️ non un id: anagrafiche.clienti non
#                                      e' unica su soggetto_ruolo_id (un cliente per
#                                      istanza utility), quindi una veste cliente puo'
#                                      avere piu' schede. Sceglierne una sarebbe un
#                                      comportamento che dipende da un id;
#                         fornitore_id unico (uq_fornitori_soggetto_ruolo_id).
#                       Ordinate per tipo di veste, poi per id.
#   vesti_elenco        i tipi di veste, distinti e ordinati, separati da ', ':
#                       la colonna su cui la lista filtra e cerca «veste»
#   soggetti_elenco     le ragioni sociali dei soggetti collegati, per la ricerca
#   nessun_accesso      nessuna veste (la credenziale e' un caso da sanare: lo
#                       conta il presidio dbops.vw_credenziali_da_sanare, -35)
#   stato_accesso       lo stato della credenziale per il filtro «stato»: il
#                       migliore fra le sue vesti, ATTIVO > PENDING > NON_SPEDITO >
#                       DISATTIVO; NESSUNO senza vesti. ⚠️ E' un riassunto per
#                       filtrare, non uno stato del modello: lo stato vero sta su
#                       ogni veste.
#   is_active           il flag di Django (derivato dalle vesti, anche per la porta)
#   secondo_fattore_stato        script.fn_get_totp_device: ASSENTE / DA_CONFERMARE /
#                                ATTIVO (solo lo stato: il segreto non esce)
#   secondo_fattore_obbligatorio script.fn_totp_obbligatorio (flag della credenziale
#                                o profilo privilegiato)
#   bloccata, bloccata_dal, motivo_blocco   il blocco dell'amministratore
#                       (config.credenziali; assenza della riga = non bloccata)
#   ultimo_accesso      last_login di Django
#
# -- FORMA -----------------------------------------------------------------------------
#   security_invoker = true: la vista attraversa anagrafiche.clienti, che ha la RLS,
#   e deve filtrare come chi legge. Si legge dall'area amministrazione (porta
#   SUPER_ADMIN, AdminAPIView): ⚠️ con la RLS e senza contesto, gli array
#   cliente_ids escono VUOTI, e un vuoto non e' un dato. Le righe no: le altre
#   tabelle non hanno RLS.
#   Il LATERAL delle vesti e' un aggregato con HAVING count(*) > 0: senza vesti non
#   esce nessuna riga, il LEFT JOIN da' NULL, e nessun_accesso lo legge da li'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261002-33-create-vw-accessi-altri-mctit.yaml

  - changeSet:
      id: 20261002-33-create-vw-accessi-altri
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.vw_accessi_altri: una riga per credenziale di categoria ALTRO (le persone
        senza veste operatore, comprese le credenziali senza alcuna veste), con le vesti e il
        loro stato (fn_stato_veste), il secondo fattore, il blocco e l'ultimo accesso.
        security_invoker. Brief: brief-db-be-fe-area-accessi R-DB-A2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 3
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname IN ('fn_credenziali', 'fn_categoria_accesso', 'fn_stato_veste');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW anagrafiche.vw_accessi_altri
              WITH (security_invoker = true) AS
              SELECT c.auth_user_id,
                     c.username,
                     c.email,
                     c.nome,
                     c.cognome,
                     COALESCE(NULLIF(concat_ws(' ', c.nome, c.cognome), ''), c.username)
                                                          AS nome_visualizzato,
                     COALESCE(v.vesti, '[]'::jsonb)       AS vesti,
                     v.vesti_elenco,
                     v.soggetti_elenco,
                     (v.n_vesti IS NULL)                  AS nessun_accesso,
                     COALESCE(v.stato_accesso, 'NESSUNO') AS stato_accesso,
                     c.is_active,
                     totp.stato                           AS secondo_fattore_stato,
                     tob.obbligatorio                     AS secondo_fattore_obbligatorio,
                     (cr.bloccata_at IS NOT NULL)         AS bloccata,
                     cr.bloccata_at                       AS bloccata_dal,
                     cr.motivo_blocco,
                     c.last_login                         AS ultimo_accesso
                FROM script.fn_credenziali() c
                LEFT JOIN LATERAL (
                    SELECT count(*) AS n_vesti,
                           jsonb_agg(
                               jsonb_build_object(
                                   'identita_id',       idg.id,
                                   'ruolo_applicativo', idg.ruolo_applicativo,
                                   'stato',             sv.stato,
                                   'attivo',            idg.attivo,
                                   'valido_dal',        idg.valido_dal,
                                   'valido_al',         idg.valido_al,
                                   'invito_inviato_at', idg.invito_inviato_at,
                                   'token_scade_at',    sv.token_scade_at,
                                   'soggetto_id',       s.id,
                                   'soggetto_ruolo_id', idg.soggetto_ruolo_id,
                                   'soggetto',          s.ragione_sociale_completa,
                                   -- ⚠️ un array: un soggetto_ruolo puo' avere piu'
                                   --   clienti (uno per istanza utility)
                                   'cliente_ids',       (SELECT COALESCE(jsonb_agg(cl.id ORDER BY cl.id),
                                                                         '[]'::jsonb)
                                                           FROM anagrafiche.clienti cl
                                                          WHERE cl.soggetto_ruolo_id = idg.soggetto_ruolo_id),
                                   'fornitore_id',      (SELECT fo.id
                                                           FROM anagrafiche.fornitori fo
                                                          WHERE fo.soggetto_ruolo_id = idg.soggetto_ruolo_id))
                               ORDER BY idg.ruolo_applicativo, idg.id)        AS vesti,
                           string_agg(DISTINCT idg.ruolo_applicativo::text, ', '
                                      ORDER BY idg.ruolo_applicativo::text)   AS vesti_elenco,
                           string_agg(DISTINCT s.ragione_sociale_completa, ', '
                                      ORDER BY s.ragione_sociale_completa)    AS soggetti_elenco,
                           -- Riassunto per il filtro: il migliore stato fra le vesti.
                           CASE
                               WHEN bool_or(sv.stato = 'ATTIVO')      THEN 'ATTIVO'
                               WHEN bool_or(sv.stato = 'PENDING')     THEN 'PENDING'
                               WHEN bool_or(sv.stato = 'NON_SPEDITO') THEN 'NON_SPEDITO'
                               ELSE 'DISATTIVO'
                           END                                                AS stato_accesso
                      FROM anagrafiche.identita_digitali idg
                      JOIN LATERAL script.fn_stato_veste(idg.id) sv ON true
                      JOIN anagrafiche.soggetti_ruoli sr ON sr.id = idg.soggetto_ruolo_id
                      JOIN anagrafiche.soggetti       s  ON s.id  = sr.soggetto_id
                     WHERE idg.auth_user_id = c.auth_user_id
                    HAVING count(*) > 0
                ) v ON true
                LEFT JOIN config.credenziali cr
                  ON cr.auth_user_id = c.auth_user_id
               CROSS JOIN LATERAL script.fn_get_totp_device(c.auth_user_id) totp
               CROSS JOIN LATERAL script.fn_totp_obbligatorio(c.auth_user_id) tob
               WHERE script.fn_categoria_accesso(c.auth_user_id) = 'ALTRO';

              COMMENT ON VIEW anagrafiche.vw_accessi_altri IS
                  'Il tab «Altri accessi» dell''area Accessi: una riga per credenziale di categoria '
                  'ALTRO (script.fn_categoria_accesso), cioe'' le persone senza veste operatore '
                  '(portale clienti e fornitori, shop) e le credenziali senza alcuna veste '
                  '(nessun_accesso). vesti = una voce per veste, anche spenta, con lo stato di '
                  'script.fn_stato_veste e il soggetto collegato (cliente_ids e'' un ARRAY: un '
                  'soggetto_ruolo puo'' avere piu'' clienti; fornitore_id e'' unico). vesti_elenco e '
                  'stato_accesso (il migliore fra le vesti, NESSUNO senza vesti) servono a filtrare. '
                  'Secondo fattore da fn_get_totp_device (solo lo stato) e fn_totp_obbligatorio; blocco '
                  'da config.credenziali. Le credenziali vengono da script.fn_credenziali (una vista '
                  'non nomina django.*). security_invoker: attraversa anagrafiche.clienti, che ha la '
                  'RLS. Brief: brief-db-be-fe-area-accessi (R-DB-A2).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS anagrafiche.vw_accessi_altri;
