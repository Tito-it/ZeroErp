# ------------------------------------------------------------
# IL TITOLO IVA DEVE ESSERE AMMESSO DALLA NATURA DEL TITOLARE
#   anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto()
#   trg_soggetti_titoli_iva_a10_guard_tipo_soggetto_ins_upd
#     BEFORE INSERT OR UPDATE OF tipo_titolo_iva_id, soggetto_id, attivo, valido_al
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D, §3bis.2, D-1, D-5)
#
# -- LA REGOLA --------------------------------------------------------
#   Un titolo VIGENTE (anagrafiche.fn_titolo_iva_vigente) deve essere
#   ammesso dalla natura del soggetto (anagrafiche.fn_titolo_iva_ammesso):
#     soggetto senza natura          -> E_DATO_FISCALE_SENZA_TIPO_SOGGETTO (D-1, codice della Parte A)
#     tipo non ammesso dalla natura  -> E_TITOLO_IVA_NON_AMMESSO_PER_TIPO_SOGGETTO
#   Un titolo NON vigente (chiuso, scaduto) non si giudica: registrare la
#   storia di un titolo finito non cambia nessuna aliquota.
#
# -- LA FORMA ---------------------------------------------------------
#   * UPDATE OF tipo_titolo_iva_id, soggetto_id, attivo, valido_al: sono le
#     colonne che possono rendere vigente un titolo non ammesso (cambio di
#     tipo o di titolare, riattivazione, proroga). imponibile_utilizzato, che
#     la fatturazione aggiorna a ogni movimento, resta fuori: un movimento non
#     deve inciampare in una regola di anagrafica. Nessun altro trigger
#     BEFORE della tabella scrive queste quattro colonne (default_emittente
#     scrive emittente_fiscale_id, date_validita e guard_coerenza leggono).
#     valido_dal resta fuori: anticiparlo non cambia se il titolo arriva a oggi.
#   * Fase a10, dopo guard_coerenza (alfabetico). Non e' dominio: le regole
#     sono indipendenti.
#   * SECURITY INVOKER: legge anagrafiche.soggetti (senza RLS) e config;
#     la riga e' quella che si sta scrivendo, nessuna altrui da vedere.
#   * Oggi = script.fn_giorno_operativo(now()), il giorno nel fuso aziendale.
#   * DATO_ERRATO: il tipo lo sceglie una persona nel form, campo
#     tipo_titolo_iva_id. Il VARIADIC porta descrizione del titolo e della
#     natura, le cose che l'operatore riconosce.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261010-92-create-trgfn-soggetti-titoli-iva-guard-tipo-soggetto-mctit.yaml

  - changeSet:
      id: 20261010-92-create-trgfn-soggetti-titoli-iva-guard-tipo-soggetto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto e trigger
        trg_soggetti_titoli_iva_a10_guard_tipo_soggetto_ins_upd: un titolo IVA vigente deve essere
        ammesso dalla natura del soggetto (matrice config.tipi_titolo_iva_tipi_soggetto_dettaglio);
        senza natura e' rifiutato. Codici E_TITOLO_IVA_NON_AMMESSO_PER_TIPO_SOGGETTO,
        E_DATO_FISCALE_SENZA_TIPO_SOGGETTO. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "2"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname IN ('fn_titolo_iva_ammesso', 'fn_titolo_iva_vigente');
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                    JOIN pg_catalog.pg_class r ON r.oid = t.tgrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = r.relnamespace
                   WHERE n.nspname = 'anagrafiche' AND r.relname = 'soggetti_titoli_iva'
                     AND t.tgname = 'trg_soggetti_titoli_iva_a10_guard_tipo_soggetto_ins_upd';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: un titolo IVA vigente e' ammesso dalla natura del titolare.
              --   Vigente: anagrafiche.fn_titolo_iva_vigente (attivo e valido almeno
              --   fino a oggi, D-5). Ammesso: anagrafiche.fn_titolo_iva_ammesso
              --   (matrice config.tipi_titolo_iva_tipi_soggetto_dettaglio; nessuna
              --   riga = non ammesso, D-1).
              -- Aggancio: BEFORE INSERT OR UPDATE OF tipo_titolo_iva_id, soggetto_id,
              --   attivo, valido_al — le colonne che possono rendere vigente un titolo
              --   non ammesso. imponibile_utilizzato (movimenti) resta fuori.
              -- Il cambio di natura del SOGGETTO lo giudica un altro guard, su
              --   anagrafiche.soggetti (trgfn_soggetti_guard_titoli_iva_ammessi).
              -- Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).
              -- =========================================================
              DECLARE
                  v_natura_id   anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_natura      config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_titolo      config.tipi_titolo_iva.descrizione%TYPE;
              BEGIN
                  -- Un titolo chiuso o scaduto non cambia nessuna aliquota.
                  IF NOT anagrafiche.fn_titolo_iva_vigente(NEW.attivo, NEW.valido_al,
                                                           script.fn_giorno_operativo(now())) THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.tipo_soggetto_dettaglio_id
                    INTO v_natura_id
                    FROM anagrafiche.soggetti s
                   WHERE s.id = NEW.soggetto_id;

                  IF NOT FOUND THEN
                      RETURN NEW;   -- la FK verso anagrafiche.soggetti parla dopo
                  END IF;

                  IF v_natura_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto',
                          'E_DATO_FISCALE_SENZA_TIPO_SOGGETTO',
                          jsonb_build_object('campo',              'tipo_soggetto_dettaglio_id',
                                             'soggetto_id',        NEW.soggetto_id,
                                             'tipo_titolo_iva_id', NEW.tipo_titolo_iva_id),
                          NEW.tx_id,
                          -- frase chiusa: il VARIADIC si passa vuoto ma ESPLICITO
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  IF anagrafiche.fn_titolo_iva_ammesso(NEW.tipo_titolo_iva_id, v_natura_id) THEN
                      RETURN NEW;
                  END IF;

                  SELECT tt.descrizione INTO v_titolo
                    FROM config.tipi_titolo_iva tt WHERE tt.id = NEW.tipo_titolo_iva_id;
                  SELECT COALESCE(tsd.descrizione, tsd.codice_interno) INTO v_natura
                    FROM config.tipi_soggetto_dettaglio tsd WHERE tsd.id = v_natura_id;

                  PERFORM script.fn_log_and_raise_error(
                      'database', 'anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto',
                      'E_TITOLO_IVA_NON_AMMESSO_PER_TIPO_SOGGETTO',
                      jsonb_build_object('campo',                      'tipo_titolo_iva_id',
                                         'soggetto_id',                NEW.soggetto_id,
                                         'tipo_titolo_iva_id',         NEW.tipo_titolo_iva_id,
                                         'tipo_soggetto_dettaglio_id', v_natura_id),
                      NEW.tx_id,
                      COALESCE(v_titolo, NEW.tipo_titolo_iva_id::text),
                      v_natura);

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto() IS
                  'Guard BEFORE INSERT OR UPDATE OF tipo_titolo_iva_id, soggetto_id, attivo, valido_al su anagrafiche.soggetti_titoli_iva: un titolo VIGENTE (anagrafiche.fn_titolo_iva_vigente) deve essere ammesso dalla natura del soggetto (anagrafiche.fn_titolo_iva_ammesso, matrice config.tipi_titolo_iva_tipi_soggetto_dettaglio: nessuna riga = non ammesso). Tipo non ammesso: E_TITOLO_IVA_NON_AMMESSO_PER_TIPO_SOGGETTO, campo tipo_titolo_iva_id. Soggetto senza natura: E_DATO_FISCALE_SENZA_TIPO_SOGGETTO. Un titolo chiuso o scaduto non si giudica. imponibile_utilizzato fuori dall''aggancio: un movimento di plafond non inciampa in una regola di anagrafica. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).';

              CREATE TRIGGER trg_soggetti_titoli_iva_a10_guard_tipo_soggetto_ins_upd
                  BEFORE INSERT OR UPDATE OF tipo_titolo_iva_id, soggetto_id, attivo, valido_al
                  ON anagrafiche.soggetti_titoli_iva
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_titoli_iva_a10_guard_tipo_soggetto_ins_upd ON anagrafiche.soggetti_titoli_iva;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_titoli_iva_guard_tipo_soggetto();
