# Liquibase changelog per Zero ERP
# Guard DEFERRABLE: indirizzi obbligatori per soggetti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251220-01-create-guard-soggetti-indirizzi-required-mctit.yaml

  - changeSet:
      id: 20251220-01-create-guard-soggetti-indirizzi-required
      author: mctit
      # runOnChange: true
      validCheckSum:
        - ANY
      comment: >
        Crea la funzione constraint-trigger DEFERRABLE che verifica, per i soggetti,
        la presenza degli indirizzi obbligatori definiti in
        config.tipi_soggetto_dettaglio_tipi_indirizzo.
        Se la matrice per il tipo_soggetto_dettaglio è assente -> policy libero (nessun obbligo).

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_guard_indirizzi_required()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $BODY$
              DECLARE
                v_has_matrix boolean;
                v_today      date := current_date;
                v_missing    record;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  RETURN OLD;
                END IF;

                -- se non ho il tipo, non applico vincoli (fallback permissivo)
                IF NEW.tipo_soggetto_dettaglio_id IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Se non esiste alcuna riga matrice per quel tipo -> libero
                SELECT EXISTS (
                  SELECT 1
                    FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                   WHERE m.tipo_soggetto_dettaglio_id = NEW.tipo_soggetto_dettaglio_id
                ) INTO v_has_matrix;

                IF NOT v_has_matrix THEN
                  RETURN NEW;
                END IF;

                -- Cerca un obbligatorio mancante (considerando fallback)
                SELECT m.tipo_indirizzo_id,
                       m.fallback_tipo_indirizzo_id
                  INTO v_missing
                  FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                 WHERE m.tipo_soggetto_dettaglio_id = NEW.tipo_soggetto_dettaglio_id
                   AND m.obbligatorio = TRUE
                   AND m.attivo = TRUE
                   AND (m.valido_dal IS NULL OR m.valido_dal <= v_today)
                   AND (m.valido_al  IS NULL OR m.valido_al  >= v_today)
                   AND NOT EXISTS (
                     SELECT 1
                       FROM anagrafiche.indirizzi_soggetti i
                      WHERE i.soggetto_id = NEW.id
                        AND (
                          i.tipo_indirizzo_id = m.tipo_indirizzo_id
                          OR (m.fallback_tipo_indirizzo_id IS NOT NULL AND i.tipo_indirizzo_id = m.fallback_tipo_indirizzo_id)
                        )
                   )
                 LIMIT 1;

                IF FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'trgfn_soggetti_guard_indirizzi_required',
                    'E_INDIRIZZO_OBBLIGATORIO_MANCANTE',
                    jsonb_build_object(
                      'soggetto_id', NEW.id,
                      'tipo_soggetto_dettaglio_id', NEW.tipo_soggetto_dettaglio_id,
                      'tipo_indirizzo_id_required', v_missing.tipo_indirizzo_id,
                      'fallback_tipo_indirizzo_id', v_missing.fallback_tipo_indirizzo_id
                    ),
                    NEW.tx_id,
                    NEW.id::text,
                     ' tipo soggetto dettaglio ',  NEW.tipo_soggetto_dettaglio_id::text,
                    v_missing.tipo_indirizzo_id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $BODY$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_guard_indirizzi_required()
              IS 'Constraint trigger DEFERRABLE: per soggetti verifica presenza indirizzi obbligatori da config.tipi_soggetto_dettaglio_tipi_indirizzo. Se matrice assente -> libero.';

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_def_guard_indirizzi_required_aft_ins_upd ON anagrafiche.soggetti;

              CREATE CONSTRAINT TRIGGER trg_soggetti_def_guard_indirizzi_required_aft_ins_upd
              AFTER INSERT OR UPDATE
              ON anagrafiche.soggetti
              DEFERRABLE INITIALLY DEFERRED
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_soggetti_guard_indirizzi_required();

              COMMENT ON TRIGGER trg_soggetti_def_guard_indirizzi_required_aft_ins_upd ON anagrafiche.soggetti
              IS 'Constraint trigger DEFERRABLE: verifica indirizzi obbligatori del soggetto (policy da matrice; se matrice assente -> libero).';
