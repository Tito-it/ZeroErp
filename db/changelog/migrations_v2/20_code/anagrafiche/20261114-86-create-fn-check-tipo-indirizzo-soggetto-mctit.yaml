# ------------------------------------------------------------
# «QUESTO TIPO DI INDIRIZZO, PER QUESTO SOGGETTO?» — LA CHECK, IN DUE META'
#   anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto(natura, tipi presenti, tipo, oggi, soggetto) -> jsonb
#   anagrafiche.fn_check_tipo_indirizzo_soggetto(soggetto, tipo) -> jsonb
#   Brief: brief-db-copia-indirizzo-soggetto §4.1, §4.2, giro 1 (D-3).
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   Il «tipo gia' presente» oggi lo rifiuta solo il vincolo
#   uq_indirizzi_soggetti_soggetto_tipo, senza codice: al backend arriva un
#   23505 e l'operatore legge un testo fisso. La check da' il motivo col codice
#   nuovo E_INDIRIZZO_SOGGETTO_TIPO_GIA_PRESENTE; la singolare la chiama (-88),
#   il picker dei tipi (giro 2) e il verbo della copia (giro 3) la leggeranno.
#   Il vincolo resta, come presidio contro la corsa.
#
# ── LA FORMA (linee-guida-sql §12.5.1, §12.6) ───────────────────
#   Array ORDINATO di {codice, reason, reason_key, dettaglio, valori}, [] se
#   ammesso. In ordine:
#   1. TIPO_GIA_PRESENTE   E_INDIRIZZO_SOGGETTO_TIPO_GIA_PRESENTE (nuovo)
#      il fatto piu' specifico del soggetto, e quello che l'operatore risolve
#      da solo cambiando la riga che c'e';
#   2. TIPO_NON_AMMESSO_DALLA_NATURA  E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO
#      il predicato e' anagrafiche.fn_tipo_indirizzo_ammesso_per_natura, quello
#      del guard: non si ricopia.
#   Divisa in due meta' (§12.6, molti candidati e un soggetto): il CONTESTO
#   (natura e tipi presenti, letti una volta) e i MOTIVI di un tipo su quel
#   contesto. La meta' sul contesto non legge il soggetto: la usa anche il
#   picker sulla natura, in creazione, dove il soggetto non esiste ancora
#   (p_soggetto_id NULL, p_tipi_presenti vuoto). Il soggetto serve solo alla
#   frase e al dettaglio.
#   I valori della frase di E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO sono tre
#   (tipo, tipo soggetto, soggetto): la check da' le descrizioni, il guard
#   della tabella gli id. Il debito della frase sta nel brief.
#   STABLE, SECURITY INVOKER: i tipi presenti sono quelli che chi chiama vede,
#   come per la madre che scrive.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-86-create-fn-check-tipo-indirizzo-soggetto-mctit.yaml

  - changeSet:
      id: 20261114-86-create-fn-check-tipo-indirizzo-soggetto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La check del tipo di indirizzo sul soggetto (gia' presente, non ammesso dalla
        natura), divisa in contesto e motivi.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto(
                  p_tipo_soggetto_dettaglio_id anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE,
                  p_tipi_presenti              integer[],  -- array: %TYPE[] non esiste
                  p_tipo_indirizzo_id          anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE,
                  p_oggi                       config.tipi_soggetto_dettaglio_tipi_indirizzo.valido_dal%TYPE,
                  p_soggetto_id                anagrafiche.soggetti.id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  c_chi        CONSTANT text := 'anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto';
                  v_motivi     jsonb := '[]'::jsonb;
                  v_tipo_nome  config.tipi_indirizzi.descrizione%TYPE;
                  v_natura_nome config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_dettaglio  jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   I motivi per cui il tipo di indirizzo non si puo'
                  --   scrivere su un soggetto con questo contesto: la natura
                  --   e i tipi che il soggetto ha gia'. [] = ammesso.
                  --
                  -- Regole:
                  --   - l'ordine dell'array e' il contratto: la madre solleva
                  --     il primo (§12.5.2);
                  --   - il predicato della natura e' quello del guard
                  --     (fn_tipo_indirizzo_ammesso_per_natura), sul giorno
                  --     passato dal chiamante;
                  --   - soggetto NULL: il soggetto non esiste ancora (picker
                  --     in creazione); conta solo per la frase.
                  -- =========================================================
                  IF p_tipo_indirizzo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_tipo_indirizzo_id'),
                          NULL::uuid,
                          c_chi,
                          'manca il tipo di indirizzo');
                  END IF;

                  IF p_oggi IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_oggi'),
                          NULL::uuid,
                          c_chi,
                          'manca il giorno');
                  END IF;

                  SELECT ti.descrizione INTO v_tipo_nome
                    FROM config.tipi_indirizzi ti
                   WHERE ti.id = p_tipo_indirizzo_id;
                  v_tipo_nome := COALESCE(v_tipo_nome, p_tipo_indirizzo_id::text);

                  v_dettaglio := jsonb_build_object(
                      'tipo_indirizzo_id',          p_tipo_indirizzo_id,
                      'tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id,
                      'soggetto_id',                p_soggetto_id);

                  -- ---- 1. il soggetto ha gia' un indirizzo di quel tipo ----
                  IF p_tipo_indirizzo_id = ANY (COALESCE(p_tipi_presenti, '{}'::integer[])) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_INDIRIZZO_SOGGETTO_TIPO_GIA_PRESENTE',
                          'reason',     'TIPO_GIA_PRESENTE',
                          'reason_key', 'anagrafiche.indirizzi.tipo_blocco.gia_presente',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(v_tipo_nome));
                  END IF;

                  -- ---- 2. la natura non ammette il tipo -------------------
                  IF NOT anagrafiche.fn_tipo_indirizzo_ammesso_per_natura(
                             p_tipo_soggetto_dettaglio_id, p_tipo_indirizzo_id, p_oggi) THEN
                      SELECT COALESCE(tsd.descrizione, tsd.codice_interno) INTO v_natura_nome
                        FROM config.tipi_soggetto_dettaglio tsd
                       WHERE tsd.id = p_tipo_soggetto_dettaglio_id;
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO',
                          'reason',     'TIPO_NON_AMMESSO_DALLA_NATURA',
                          'reason_key', 'anagrafiche.indirizzi.tipo_blocco.non_ammesso_dalla_natura',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(
                                            v_tipo_nome,
                                            COALESCE(v_natura_nome, p_tipo_soggetto_dettaglio_id::text),
                                            COALESCE(p_soggetto_id::text, '-')));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto(
                  anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE,
                  integer[],
                  anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE,
                  config.tipi_soggetto_dettaglio_tipi_indirizzo.valido_dal%TYPE,
                  anagrafiche.soggetti.id%TYPE)
              IS 'I motivi per cui un tipo di indirizzo non si puo'' scrivere su un soggetto, dato il contesto: la natura di dettaglio, i tipi che il soggetto ha gia'', il giorno. Check pura: array ordinato di {codice, reason, reason_key, dettaglio, valori}, [] se ammesso. In ordine: il tipo gia'' presente (TIPO_GIA_PRESENTE, E_INDIRIZZO_SOGGETTO_TIPO_GIA_PRESENTE, chiave anagrafiche.indirizzi.tipo_blocco.gia_presente; valori: il tipo); il tipo che la natura non ammette (TIPO_NON_AMMESSO_DALLA_NATURA, E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO, chiave anagrafiche.indirizzi.tipo_blocco.non_ammesso_dalla_natura; valori: il tipo, la natura, il soggetto), col predicato di anagrafiche.fn_tipo_indirizzo_ammesso_per_natura. Il soggetto serve solo alla frase e al dettaglio: NULL quando il soggetto non esiste ancora. Tipo o giorno mancanti: E_SCRIPT_CHIAMATA_NON_VALIDA. La compone anagrafiche.fn_check_tipo_indirizzo_soggetto, che legge il contesto dal soggetto salvato.';

              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_tipo_indirizzo_soggetto(
                  p_soggetto_id       anagrafiche.soggetti.id%TYPE,
                  p_tipo_indirizzo_id anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  c_chi    CONSTANT text := 'anagrafiche.fn_check_tipo_indirizzo_soggetto';
                  v_natura anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_motivi jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   I motivi per cui il tipo di indirizzo non si puo'
                  --   scrivere sul soggetto salvato. Legge il contesto (la
                  --   natura, i tipi presenti) e lo passa alla meta' sui
                  --   motivi; il giorno e' script.fn_data_operativa(), quello
                  --   del guard della tabella.
                  -- =========================================================
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_soggetto_id'),
                          NULL::uuid,
                          c_chi,
                          'manca il soggetto');
                  END IF;

                  SELECT s.tipo_soggetto_dettaglio_id
                    INTO v_natura
                    FROM anagrafiche.soggetti s
                   WHERE s.id = p_soggetto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SOGGETTO_NOT_FOUND',
                          jsonb_build_object('soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          p_soggetto_id::text);
                  END IF;

                  -- ⚠️ La delega si scrive come assegnazione (:=): e' la forma che
                  --   dbops.vw_funzioni_check_codici sa leggere per legare i codici.
                  v_motivi := anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto(
                      v_natura,
                      ARRAY(SELECT i.tipo_indirizzo_id
                              FROM anagrafiche.indirizzi_soggetti i
                             WHERE i.soggetto_id = p_soggetto_id),
                      p_tipo_indirizzo_id,
                      script.fn_data_operativa(),
                      p_soggetto_id);

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_tipo_indirizzo_soggetto(
                  anagrafiche.soggetti.id%TYPE,
                  anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE)
              IS 'I motivi per cui il tipo di indirizzo non si puo'' scrivere sul soggetto salvato: legge la natura e i tipi che il soggetto ha gia'' e li passa a anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto, col giorno di script.fn_data_operativa() (quello del guard della tabella). Array ordinato di motivi, [] se ammesso: il tipo gia'' presente (E_INDIRIZZO_SOGGETTO_TIPO_GIA_PRESENTE), poi il tipo che la natura non ammette (E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO). Soggetto mancante E_SCRIPT_CHIAMATA_NON_VALIDA, inesistente E_SOGGETTO_NOT_FOUND. SECURITY INVOKER: i tipi presenti sono quelli che chi chiama vede. La chiama anagrafiche.fn_crea_indirizzo_soggetto, che solleva il primo motivo prima di scrivere.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_check_tipo_indirizzo_soggetto(uuid, integer);
              DROP FUNCTION IF EXISTS anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto(bigint, integer[], integer, date, uuid);
