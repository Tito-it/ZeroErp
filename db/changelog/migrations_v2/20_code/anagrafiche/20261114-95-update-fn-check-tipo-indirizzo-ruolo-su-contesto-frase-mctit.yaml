# LA CHECK DEL TIPO DI INDIRIZZO PASSA ALLA FRASE I DUE VALORI DELLA FRASE NUOVA
#   anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto
#   Brief: brief-db-copia-indirizzo-soggetto §5.2 (Q-1, Tid 2026-11-15).
#   Corpo di partenza: 20261114-87-create-fn-check-tipo-indirizzo-ruolo-mctit (applicato; la doc auto-generata non e'
#   ancora rigenerata: il corpo e' quello del vivo).
#
# ── COSA CAMBIA ─────────────────────────────────────────────────
#   La frase di E_TIPO_INDIRIZZO_NON_PERMESSO (messaggi_errore.csv, id 108) si
#   riscrive senza nomi di colonna, con due segnaposto:
#   «Il ruolo %s non prevede l'indirizzo «%s».»
#   Il motivo «tipo non ammesso» porta quindi due valori, il tipo di ruolo e il tipo,
#   per descrizione e nell'ordine della frase: gli stessi del guard della
#   tabella, che li passa nello stesso giro. Prima erano tre (il tipo, il tipo di ruolo,
#   l'id), e l'id finiva nella frase dell'operatore.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────
#   Firma, ordine dei motivi, codici, reason e reason_key, dettaglio. La firma
#   completa (fn_check_tipo_indirizzo_ruolo) non cambia: compone questa.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-95-update-fn-check-tipo-indirizzo-ruolo-su-contesto-frase-mctit.yaml

  - changeSet:
      id: 20261114-95-update-fn-check-tipo-indirizzo-ruolo-su-contesto-frase
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_check_tipo_indirizzo_ruolo_su_contesto: il motivo del tipo non ammesso porta i due valori della frase nuova,
        per descrizione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(
                  p_tipo_ruolo_id     anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE,
                  p_tipi_presenti     integer[],  -- array: %TYPE[] non esiste
                  p_tipo_indirizzo_id anagrafiche.indirizzi.tipo_indirizzo_id%TYPE,
                  p_oggi              config.tipi_ruolo_tipi_indirizzo.valido_dal%TYPE,
                  p_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  c_chi        CONSTANT text := 'anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto';
                  v_motivi     jsonb := '[]'::jsonb;
                  v_tipo_nome  config.tipi_indirizzi.descrizione%TYPE;
                  v_ruolo_nome config.tipi_ruoli.descrizione%TYPE;
                  v_dettaglio  jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   I motivi per cui il tipo di indirizzo non si puo'
                  --   scrivere su un ruolo con questo contesto: il tipo di
                  --   ruolo e i tipi che la chiave (ruolo, istanza) ha gia'.
                  --   [] = ammesso.
                  --
                  -- Regole:
                  --   - l'ordine dell'array e' il contratto: la madre solleva
                  --     il primo (§12.5.2);
                  --   - il predicato del tipo di ruolo e' quello del guard
                  --     (fn_tipo_indirizzo_ammesso_per_ruolo), sul giorno
                  --     passato dal chiamante;
                  --   - ruolo NULL: il ruolo non esiste ancora (picker
                  --     all'assegnazione); conta solo per il dettaglio.
                  -- =========================================================
                  IF p_tipo_indirizzo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_tipo_indirizzo_id'),
                          NULL::uuid,
                          c_chi,
                          'manca il tipo di indirizzo');
                  END IF;

                  IF p_oggi IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_oggi'),
                          NULL::uuid,
                          c_chi,
                          'manca il giorno');
                  END IF;

                  SELECT ti.descrizione INTO v_tipo_nome
                    FROM config.tipi_indirizzi ti
                   WHERE ti.id = p_tipo_indirizzo_id;
                  v_tipo_nome := COALESCE(v_tipo_nome, p_tipo_indirizzo_id::text);

                  v_dettaglio := jsonb_build_object(
                      'tipo_indirizzo_id', p_tipo_indirizzo_id,
                      'tipo_ruolo_id',     p_tipo_ruolo_id,
                      'soggetto_ruolo_id', p_soggetto_ruolo_id);

                  -- ---- 1. la chiave (ruolo, istanza) ha gia' quel tipo ----
                  IF p_tipo_indirizzo_id = ANY (COALESCE(p_tipi_presenti, '{}'::integer[])) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE',
                          'reason',     'TIPO_GIA_PRESENTE',
                          'reason_key', 'anagrafiche.indirizzi.tipo_blocco.gia_presente',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(v_tipo_nome));
                  END IF;

                  -- ---- 2. il tipo di ruolo non ammette il tipo ------------
                  IF NOT anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo(
                             p_tipo_ruolo_id, p_tipo_indirizzo_id, p_oggi) THEN
                      SELECT tr.descrizione INTO v_ruolo_nome
                        FROM config.tipi_ruoli tr
                       WHERE tr.id = p_tipo_ruolo_id;
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TIPO_INDIRIZZO_NON_PERMESSO',
                          'reason',     'TIPO_NON_AMMESSO_DAL_RUOLO',
                          'reason_key', 'anagrafiche.indirizzi.tipo_blocco.non_ammesso_dal_ruolo',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(
                                            COALESCE(v_ruolo_nome, p_tipo_ruolo_id::text),
                                            v_tipo_nome));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(
                  anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE,
                  integer[],
                  anagrafiche.indirizzi.tipo_indirizzo_id%TYPE,
                  config.tipi_ruolo_tipi_indirizzo.valido_dal%TYPE,
                  anagrafiche.soggetti_ruoli.id%TYPE)
              IS 'I motivi per cui un tipo di indirizzo non si puo'' scrivere su un ruolo, dato il contesto: il tipo di ruolo, i tipi che la chiave (ruolo, istanza) ha gia'', il giorno. Check pura: array ordinato di {codice, reason, reason_key, dettaglio, valori}, [] se ammesso. In ordine: il tipo gia'' presente (TIPO_GIA_PRESENTE, E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE, chiave anagrafiche.indirizzi.tipo_blocco.gia_presente; valori: il tipo); il tipo che il tipo di ruolo non ammette (TIPO_NON_AMMESSO_DAL_RUOLO, E_TIPO_INDIRIZZO_NON_PERMESSO, chiave anagrafiche.indirizzi.tipo_blocco.non_ammesso_dal_ruolo; valori: il tipo di ruolo e il tipo, nell''ordine della frase), col predicato di anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo. I tipi presenti arrivano gia'' filtrati per la chiave con l''istanza. Il ruolo serve solo al dettaglio: NULL quando il ruolo non esiste ancora. Tipo o giorno mancanti: E_SCRIPT_CHIAMATA_NON_VALIDA. La compone anagrafiche.fn_check_tipo_indirizzo_ruolo, che legge il contesto dal ruolo salvato. Gemella di anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il corpo precedente e' nel changeSet di nascita; si torna indietro con un changeSet nuovo.
              SELECT 1;
