databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/anagrafiche/20251127-03-fn-search-indirizzi-dettaglio-mctit.yaml

    - changeSet:
          id: 20251127-03-fn-search-indirizzi-dettaglio
          author: mctit

          # ------------------------------------------------------------
          # Scopo
          # ------------------------------------------------------------
          # Crea la funzione di ricerca anagrafiche.fn_search_indirizzi_dettaglio,
          # pensata come punto unico di ingresso per:
          #
          #   - Ricerca per indirizzo "fisico" (stradario_id + civico + estensioni)
          #   - Ricerca fuzzy per indirizzo_normalizzato (LIKE, case-insensitive)
          #
          # La funzione utilizza come sorgente la vista:
          #   anagrafiche.vw_indirizzi_dettaglio
          #
          # Comportamento:
          #   - Se p_stradario_id IS NOT NULL:
          #       Filtra per stradario_id e, opzionalmente, per
          #       civico / estensione_civico / palazzina / scala / piano / interno
          #       e/o per pattern su indirizzo_normalizzato.
          #
          #   - Se p_stradario_id IS NULL MA p_indirizzo_norm è valorizzato:
          #       Esegue una ricerca basata SOLO su indirizzo_normalizzato
          #       (UPPER(indirizzo_normalizzato) LIKE UPPER('%pattern%')).
          #
          #   - Se entrambi sono NULL (o pattern vuoto):
          #       RAISE EXCEPTION → richiesto almeno uno tra stradario_id o pattern.
          #
          # Tutti i risultati sono filtrati per attivo = TRUE e limitati da p_limit.
          #
          # NOTE:
          #   - La funzione restituisce righe della vista
          #     anagrafiche.vw_indirizzi_dettaglio (composite type della view).
          #   - È marcata STABLE perché esegue solo SELECT.
          #   - Non esegue alcuna DML, quindi è sicura per l’utilizzo in UI,
          #     reportistica leggera e funzioni applicative.
          # ------------------------------------------------------------

          preConditions:
              - onFail: HALT
              - onError: HALT

                # Richiede la vista base di ricerca
              - viewExists:
                    schemaName: anagrafiche
                    viewName: vw_indirizzi_dettaglio

          changes:
              - sql:
                    splitStatements: FALSE
                    stripComments: false
                    endDelimiter: ";"

                    sql: |


                        CREATE OR REPLACE FUNCTION anagrafiche.fn_search_indirizzi_dettaglio(
                            p_stradario_id       integer DEFAULT NULL,
                            p_civico             integer DEFAULT NULL,
                            p_estensione_civico  text    DEFAULT NULL,
                            p_palazzina          text    DEFAULT NULL,
                            p_scala              text    DEFAULT NULL,
                            p_piano              text    DEFAULT NULL,
                            p_interno            text    DEFAULT NULL,
                            p_indirizzo_norm     text    DEFAULT NULL,
                            p_limit              integer DEFAULT 50
                        )
                        RETURNS SETOF anagrafiche.vw_indirizzi_dettaglio
                        LANGUAGE plpgsql
                        STABLE
                        PARALLEL SAFE
                        COST 100
                        AS
                        $BODY$
                        DECLARE
                            v_limit integer := COALESCE(p_limit, 50);
                            v_pattern text;
                        BEGIN

                        -- ============================================================
                        -- Funzione: anagrafiche.fn_search_indirizzi_dettaglio(...)
                        --
                        -- Parametri:
                        --   p_stradario_id      :: integer  (obbligatorio in alternativa a p_indirizzo_norm)
                        --   p_civico            :: integer  (opzionale, usato solo se p_stradario_id non null)
                        --   p_estensione_civico :: text     (opzionale)
                        --   p_palazzina         :: text     (opzionale)
                        --   p_scala             :: text     (opzionale)
                        --   p_piano             :: text     (opzionale)
                        --   p_interno           :: text     (opzionale)
                        --   p_indirizzo_norm    :: text     (opzionale, pattern fuzzy su indirizzo_normalizzato)
                        --   p_limit             :: integer  (limite massimo righe restituite, default 50)
                        --
                        -- Ritorno:
                        --   SETOF anagrafiche.vw_indirizzi_dettaglio
                        --
                        -- Regole:
                        --   - È obbligatorio valorizzare almeno uno tra:
                        --       * p_stradario_id
                        --       * p_indirizzo_norm (non vuoto)
                        --
                        --   - Se p_stradario_id è valorizzato:
                        --       * Filtra sempre per stradario_id
                        --       * Se specificati, restringe ulteriormente per:
                        --           civico, estensione_civico, palazzina, scala, piano, interno
                        --       * Se p_indirizzo_norm non è null/blank, applica anche LIKE fuzzy
                        --
                        --   - Se p_stradario_id è NULL:
                        --       * Richiede p_indirizzo_norm non null/blank
                        --       * Esegue ricerca fuzzy solo su indirizzo_normalizzato
                        --
                        --   - Vengono restituiti solo indirizzi attivi (attivo = TRUE).
                        --   - Ordinamento predefinito per indirizzo_normalizzato, indirizzo_dettaglio_id.
                        -- ============================================================
                            -- Normalizzo il pattern (blank → NULL)
                            IF p_indirizzo_norm IS NOT NULL THEN
                                v_pattern := NULLIF(btrim(p_indirizzo_norm), '');
                            ELSE
                                v_pattern := NULL;
                            END IF;

                            -- Almeno UNO tra p_stradario_id e v_pattern deve essere valorizzato
                            IF p_stradario_id IS NULL AND v_pattern IS NULL THEN
                                RAISE EXCEPTION
                                    'fn_search_indirizzi_dettaglio: valorizzare almeno p_stradario_id o p_indirizzo_norm (non vuoto)'
                                    USING HINT = 'Per ricerche fuzzy usare p_indirizzo_norm, per ricerche esatte usare p_stradario_id + dettagli civico.';
                            END IF;

                            -- =======================================================
                            -- Caso 1: p_stradario_id valorizzato
                            --   → ricerca per indirizzo "fisico", con eventuale filtro fuzzy
                            -- =======================================================
                            IF p_stradario_id IS NOT NULL THEN
                                RETURN QUERY
                                SELECT *
                                FROM anagrafiche.vw_indirizzi_dettaglio v
                                WHERE
                                    v.attivo = TRUE
                                    AND v.stradario_id = p_stradario_id
                                    AND (p_civico IS NULL OR v.civico = p_civico)
                                    AND (p_estensione_civico IS NULL OR COALESCE(v.estensione_civico, '') = COALESCE(p_estensione_civico, ''))
                                    AND (p_palazzina IS NULL         OR COALESCE(v.palazzina,        '') = COALESCE(p_palazzina,        ''))
                                    AND (p_scala IS NULL             OR COALESCE(v.scala,            '') = COALESCE(p_scala,            ''))
                                    AND (p_piano IS NULL             OR COALESCE(v.piano,            '') = COALESCE(p_piano,            ''))
                                    AND (p_interno IS NULL           OR COALESCE(v.interno,          '') = COALESCE(p_interno,          ''))
                                    AND (
                                        v_pattern IS NULL
                                        OR UPPER(v.indirizzo_normalizzato) LIKE UPPER('%' || v_pattern || '%')
                                    )
                                ORDER BY
                                    v.indirizzo_normalizzato,
                                    v.indirizzo_dettaglio_id
                                LIMIT v_limit;

                                RETURN;
                            END IF;

                            -- =======================================================
                            -- Caso 2: p_stradario_id NULL, pattern valorizzato
                            --   → ricerca SOLO per indirizzo_normalizzato (fuzzy)
                            -- =======================================================
                            RETURN QUERY
                            SELECT *
                            FROM anagrafiche.vw_indirizzi_dettaglio v
                            WHERE
                                v.attivo = TRUE
                                AND UPPER(v.indirizzo_normalizzato) LIKE UPPER('%' || v_pattern || '%')
                            ORDER BY
                                v.indirizzo_normalizzato,
                                v.indirizzo_dettaglio_id
                            LIMIT v_limit;

                            RETURN;
                        END;
                        $BODY$;

                        COMMENT ON FUNCTION anagrafiche.fn_search_indirizzi_dettaglio(
                            integer,
                            integer,
                            text,
                            text,
                            text,
                            text,
                            text,
                            text,
                            integer
                        ) 

                          IS
                        'Funzione di ricerca indirizzi di dettaglio:
                         - Se p_stradario_id è valorizzato → ricerca per stradario_id (+ eventuali dettagli civico e pattern).
                         - Se p_stradario_id è NULL       → ricerca fuzzy su indirizzo_normalizzato (pattern case-insensitive).
                         Ritorna righe da anagrafiche.vw_indirizzi_dettaglio, solo attive, limitate da p_limit.';

