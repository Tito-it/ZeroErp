# ------------------------------------------------------------
# anagrafiche.trgfn_risorse_umane_guard_ultimo_super_admin: anche la
# cancellazione del rapporto (S61).
#
#   Il guard del rapporto scattava solo sull'UPDATE: con la porta di
#   manutenzione aperta il rapporto dell'ultimo SUPER_ADMIN si cancellava, e
#   la sua veste restava senza rapporto, quindi non utilizzabile. Ora scatta
#   anche sul DELETE, giudicato come una scrittura che riduce la garanzia.
#
#   Corpo vivo (dbdev, 2026-11-26) con il ramo DELETE: il filtro delle
#   scritture che riducono vale per l'UPDATE, e NEW nel contesto dell'errore
#   si legge solo nell'UPDATE (in un trigger di DELETE e' NULL). Firma e
#   RETURNS invariati. Rimontaggio per funzione: l'unico montaggio storico e'
#   trg_risorse_umane_a10_guard_ultimo_super_admin_upd; si toglie e nascono
#   _upd (stesso WHEN) e _dlt. COMMENT riscritto al presente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261125-62-update-trgfn-risorse-umane-guard-ultimo-super-admin-delete-mctit.yaml

  - changeSet:
      id: 20261125-62-update-trgfn-risorse-umane-guard-ultimo-super-admin-delete
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.trgfn_risorse_umane_guard_ultimo_super_admin: giudica anche la cancellazione del rapporto
        dell'ultimo amministratore.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: anagrafiche, tableName: risorse_umane }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_risorse_umane_guard_ultimo_super_admin()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_identita_id anagrafiche.identita_digitali.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Impedire le scritture sul rapporto di un SUPER_ADMIN
                  --   che lascerebbero il sistema senza un SUPER_ADMIN SENZA
                  --   SCADENZA (script.fn_check_almeno_un_super_admin_attivo).
                  --
                  -- Regole:
                  --   1. Short-circuit: solo le scritture che RIDUCONO la
                  --      garanzia (spegnere, data di fine, inizio nel futuro,
                  --      spostamento su un altro soggetto_ruolo, cancellazione).
                  --      Togliere una data di fine o riaprire il rapporto passa
                  --      sempre.
                  --   2. Short-circuit 2: solo se sul soggetto_ruolo di PRIMA
                  --      c'e' una veste OPERATORE con un binding SUPER_ADMIN
                  --      attivo.
                  --   3. Verifica post-stato via fn_check; se false, raise.
                  -- =========================================================

                  IF TG_OP = 'UPDATE' AND NOT (   (OLD.attivo AND NOT NEW.attivo)
                          OR (OLD.valido_al IS NULL AND NEW.valido_al IS NOT NULL)
                          OR (OLD.valido_dal <= (SELECT script.fn_data_operativa()) AND NEW.valido_dal > (SELECT script.fn_data_operativa()))
                          OR (OLD.soggetto_ruolo_id IS DISTINCT FROM NEW.soggetto_ruolo_id))
                  THEN
                      RETURN NULL;
                  END IF;

                  -- La veste SUPER_ADMIN appesa a questo rapporto (al piu' una
                  -- accesa per soggetto_ruolo e tipo: uq_identita_digitali_sr_ruolo_attivo;
                  -- ORDER BY per non dipendere dal piano quando ce ne sono di spente).
                  SELECT idg.id
                    INTO v_identita_id
                    FROM anagrafiche.identita_digitali   idg
                    JOIN config.profili_accesso_bindings pab
                      ON pab.identita_digitale_id = idg.id
                     AND pab.attivo
                    JOIN config.profili_accesso          pa
                      ON pa.id = pab.profilo_accesso_id
                     AND pa.attivo
                     AND pa.tipo = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                   WHERE idg.soggetto_ruolo_id = OLD.soggetto_ruolo_id
                     AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                   ORDER BY idg.attivo DESC, idg.id
                   LIMIT 1;

                  IF v_identita_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  IF NOT script.fn_check_almeno_un_super_admin_attivo() THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche',
                          TG_NAME,
                          'E_PROFILO_ULTIMO_SUPER_ADMIN',
                          jsonb_build_object(
                              'op', TG_OP,
                              'risorsa_umana_id', OLD.id,
                              'identita_digitale_id', v_identita_id,
                              'attivo', CASE WHEN TG_OP = 'UPDATE' THEN NEW.attivo END,
                              'valido_dal', CASE WHEN TG_OP = 'UPDATE' THEN NEW.valido_dal END,
                              'valido_al', CASE WHEN TG_OP = 'UPDATE' THEN NEW.valido_al END
                          ),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]
                      );
                  END IF;

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_risorse_umane_guard_ultimo_super_admin() IS
                  'Guard anti-lockout sul rapporto (AFTER UPDATE di attivo, valido_dal, valido_al, soggetto_ruolo_id, e AFTER DELETE su anagrafiche.risorse_umane): rifiuta una scrittura che riduce la garanzia del rapporto di un SUPER_ADMIN (spegnerlo, dargli una data di fine, spostarne l''inizio nel futuro, spostarlo su un altro soggetto_ruolo, cancellarlo) se dopo non resta nessun SUPER_ADMIN senza scadenza (script.fn_check_almeno_un_super_admin_attivo). Le scritture che migliorano non si fermano mai. Codice E_PROFILO_ULTIMO_SUPER_ADMIN. Gemello di anagrafiche.trgfn_identita_digitali_guard_ultimo_super_admin.';

              DROP TRIGGER IF EXISTS trg_risorse_umane_a10_guard_ultimo_super_admin_upd ON anagrafiche.risorse_umane;
              DROP TRIGGER IF EXISTS trg_risorse_umane_a10_guard_ultimo_super_admin_dlt ON anagrafiche.risorse_umane;

              CREATE TRIGGER trg_risorse_umane_a10_guard_ultimo_super_admin_upd
                  AFTER UPDATE ON anagrafiche.risorse_umane
                  FOR EACH ROW
                  WHEN (OLD.attivo            IS DISTINCT FROM NEW.attivo
                     OR OLD.valido_dal        IS DISTINCT FROM NEW.valido_dal
                     OR OLD.valido_al         IS DISTINCT FROM NEW.valido_al
                     OR OLD.soggetto_ruolo_id IS DISTINCT FROM NEW.soggetto_ruolo_id)
                  EXECUTE FUNCTION anagrafiche.trgfn_risorse_umane_guard_ultimo_super_admin();

              CREATE TRIGGER trg_risorse_umane_a10_guard_ultimo_super_admin_dlt
                  AFTER DELETE ON anagrafiche.risorse_umane
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_risorse_umane_guard_ultimo_super_admin();
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: la versione precedente e' il 20261009-44
