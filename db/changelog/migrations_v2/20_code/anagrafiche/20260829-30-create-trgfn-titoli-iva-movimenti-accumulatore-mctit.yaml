# I7 (Fase 2) del brief brief-db-be-iva-risolutore-e-regime-cliente, D5 —
# L'ACCUMULATORE: `imponibile_utilizzato` e' la somma del registro, sempre.
#
# ── ⭐ COSA TIENE INSIEME, ed e' l'intera ragione di D5 ────────────────
#
#   P3 vuole un valore memorizzato; D5 vuole che quel valore non possa mentire.
#   Le due cose stanno insieme solo se NESSUNO scrive `imponibile_utilizzato` a
#   mano: lo scrive questo trigger, e lo scrive come `SUM` del registro. Una
#   forzatura diventa cosi' una RIGA con motivo, autore e data, invece di un
#   numero sovrascritto sopra a un altro.
#
#   ⚠️ La colonna resta scrivibile a livello di privilegi — nessun GRANT per
#   colonna, che in questo progetto non tiene (il loop `ci_apply` ri-concede).
#   Il presidio e' che ogni corsa del trigger la RISCRIVE dalla somma: un valore
#   messo a mano sopravvive fino al primo movimento e poi sparisce. E' meno di
#   un divieto ed e' quanto si puo' ottenere qui; la sede del divieto vero e' il
#   backend, che quella colonna non deve mettere in nessuna whitelist.
#
# ── ⚠️ PERCHE' RICALCOLA INVECE DI SOMMARE IL DELTA ───────────────────
#
#   Un accumulatore incrementale (`SET x = x + NEW.imponibile`) va fuori sincrono
#   al primo caso che nessuno ha previsto — un UPDATE che cambia l'importo, un
#   DELETE, un movimento spostato da un titolo a un altro. Il ricalcolo dalla
#   somma non ha casi: qualunque cosa succeda al registro, la colonna torna a
#   dire quello che il registro dice. Costa una scansione dei movimenti di UN
#   titolo, che e' esattamente cio' che l'indice `ix_stiva_movimenti_titolo`
#   serve.
#
# ── 🔴 IL CASO CHE UN TRIGGER `FOR EACH ROW` SBAGLIA SE NON CI SI PENSA ──
#
#   Un UPDATE che sposta un movimento da un titolo a un altro deve ricalcolare
#   ENTRAMBI. Con `OLD` e `NEW` letti distrattamente se ne ricalcola uno solo, e
#   il titolo abbandonato resta con la somma di prima — un plafond che risulta
#   consumato da un movimento che non e' piu' suo. Qui i due id si raccolgono e
#   si ricalcolano tutti e due.
#
# ── ⛔ IL CONTO SOTTO ZERO SI RIFIUTA QUI, NON CON UN `CHECK` ──────────
#
#   `soggetti_titoli_iva.imponibile_utilizzato` non ha un CHECK `>= 0`, ed e'
#   voluto (vedi 20260829-24): la colonna la scrive questo trigger, quindi un
#   23514 sarebbe un errore MUTO, sollevato dentro un trigger, su una tabella
#   DIVERSA da quella che l'operatore stava toccando. Qui invece il codice e'
#   registrato e la frase nomina il titolo.
#
# ── ⛔ E IL TETTO NON SI CONTROLLA QUI, ED E' UNA DECISIONE ────────────
#
#   Verrebbe naturale rifiutare anche `somma > plafond`. Non si fa:
#     * sulle FATTURE il caso non si presenta — la spezzatura di P2 fa si' che
#       il consumo non superi mai la capienza, e a garantirlo e' la primitiva
#       `fn_consuma_plafond_titolo_iva` (20260829-31), che e' l'unica a
#       calcolarla e l'unica a prendere il lock;
#     * sulle FORZATURE il superamento e' un'informazione sul mondo. Una
#       forzatura esiste per registrare fatturazioni fuori dal sistema: se
#       quelle sfondano il plafond, il plafond registrato e' sbagliato — e
#       impedire di scrivere il fatto impedirebbe di ACCORGERSENE.
#   ⚠️ Il presidio giusto per quel caso non e' un rifiuto: e' una lista di
#   titoli sfondati che qualcuno guarda. Non fa parte di I7 e sta scritto qui
#   perche' non sembri una dimenticanza.
#
# Codice sollevato: E_TITOLO_IVA_UTILIZZATO_NEGATIVO (seed in 80_data).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260829-30-create-trgfn-titoli-iva-movimenti-accumulatore-mctit.yaml

  - changeSet:
      id: 20260829-30-create-trgfn-titoli-iva-movimenti-accumulatore
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L'accumulatore di D5: anagrafiche.soggetti_titoli_iva.imponibile_utilizzato torna
        a essere la SOMMA del registro dei movimenti dopo ogni scrittura. Ricalcolo e non
        delta incrementale - un delta va fuori sincrono al primo UPDATE o DELETE che
        nessuno ha previsto, il ricalcolo non ha casi. Un movimento spostato da un titolo
        a un altro ne ricalcola DUE. Il conto sotto zero si rifiuta qui con un codice
        registrato e non con un CHECK, che sarebbe un errore muto dentro un trigger su
        una tabella diversa da quella toccata.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_movimenti
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_movimenti_accumulatore()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: riportare anagrafiche.soggetti_titoli_iva.imponibile_utilizzato
              --   alla SOMMA del registro dei movimenti, dopo ogni scrittura sul
              --   registro. E' cio' che rende vera la promessa di D5 — il valore
              --   e' memorizzato (P3) ma non puo' mentire, perche' nessuno lo
              --   scrive a mano. Rifiuta il conto sotto zero, che nessuna lettura
              --   del dominio ammette.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I7 / D5.
              DECLARE
                  -- ⚠️ Array e non due scalari: un UPDATE che sposta un movimento
                  --   da un titolo a un altro deve ricalcolarli ENTRAMBI, o il
                  --   titolo abbandonato resta con la somma di prima — un plafond
                  --   consumato da un movimento che non e' piu' suo.
                  -- ⚠️ `bigint[]` esplicito: `colonna%TYPE[]` non esiste in
                  --   PostgreSQL, ed e' l'unico posto di questa funzione dove
                  --   il tipo non si puo' ancorare alla colonna.
                  v_titoli   bigint[] := ARRAY[]::bigint[];
                  v_titolo_id anagrafiche.soggetti_titoli_iva_movimenti.titolo_iva_id%TYPE;
                  v_somma     anagrafiche.soggetti_titoli_iva.imponibile_utilizzato%TYPE;
                  v_tipo_descr config.tipi_titolo_iva.descrizione%TYPE;
                  v_tx_id     anagrafiche.soggetti_titoli_iva_movimenti.tx_id%TYPE;
              BEGIN
                  IF TG_OP <> 'INSERT' THEN
                      v_titoli := v_titoli || OLD.titolo_iva_id;
                      v_tx_id  := OLD.tx_id;
                  END IF;
                  IF TG_OP <> 'DELETE' THEN
                      v_titoli := v_titoli || NEW.titolo_iva_id;
                      v_tx_id  := NEW.tx_id;
                  END IF;

                  -- Un UPDATE che NON cambia il titolo mette due volte lo stesso
                  -- id: senza questa riga il ricalcolo girerebbe due volte con
                  -- lo stesso esito, che non e' un errore ma e' lavoro buttato.
                  v_titoli := ARRAY(SELECT DISTINCT unnest(v_titoli));

                  FOREACH v_titolo_id IN ARRAY v_titoli
                  LOOP
                      -- ⚠️ COALESCE: senza movimenti la somma e' NULL, e la
                      --   colonna e' NOT NULL. L'ultimo movimento cancellato
                      --   deve riportare il titolo a zero, non farlo esplodere.
                      SELECT COALESCE(SUM(m.imponibile), 0)
                        INTO v_somma
                        FROM anagrafiche.soggetti_titoli_iva_movimenti m
                       WHERE m.titolo_iva_id = v_titolo_id;

                      IF v_somma < 0 THEN
                          SELECT tt.descrizione
                            INTO v_tipo_descr
                            FROM anagrafiche.soggetti_titoli_iva t
                            JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id
                           WHERE t.id = v_titolo_id;

                          PERFORM script.fn_log_and_raise_error(
                              'anagrafiche', 'trgfn_soggetti_titoli_iva_movimenti_accumulatore',
                              'E_TITOLO_IVA_UTILIZZATO_NEGATIVO',
                              jsonb_build_object('campo', 'imponibile',
                                                 'titolo_iva_id', v_titolo_id,
                                                 'somma', v_somma),
                              v_tx_id,
                              -- ⚠️ Nel VARIADIC il tipo di titolo e l'importo che
                              --   una persona legge, mai il nome della colonna.
                              COALESCE(v_tipo_descr, ''),
                              to_char(v_somma, 'FM999G999G990D00'));
                      END IF;

                      UPDATE anagrafiche.soggetti_titoli_iva t
                         SET imponibile_utilizzato = v_somma
                       WHERE t.id = v_titolo_id
                         AND t.imponibile_utilizzato IS DISTINCT FROM v_somma;
                  END LOOP;

                  RETURN NULL;   -- AFTER trigger: il valore di ritorno e' ignorato
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_movimenti_accumulatore()
              IS 'Riporta anagrafiche.soggetti_titoli_iva.imponibile_utilizzato alla SOMMA del registro dei movimenti dopo ogni scrittura sul registro. ⭐ E'' cio'' che rende vera la promessa di D5: il valore e'' memorizzato come chiede P3, ma non puo'' mentire perche'' nessuno lo scrive a mano — una forzatura e'' una RIGA con motivo, autore e data, invece di un numero sovrascritto sopra a un altro. ⚠️ RICALCOLA dalla somma invece di sommare un delta: un accumulatore incrementale va fuori sincrono al primo UPDATE dell''importo, al primo DELETE, al primo movimento spostato — il ricalcolo non ha casi. 🔴 E ricalcola DUE titoli quando un UPDATE sposta un movimento: con OLD e NEW letti distrattamente il titolo abbandonato resterebbe con la somma di prima, cioe'' un plafond consumato da un movimento che non e'' piu'' suo. ⛔ Il conto sotto zero si rifiuta QUI con E_TITOLO_IVA_UTILIZZATO_NEGATIVO e non con un CHECK sulla colonna: la colonna la scrive questo trigger, quindi un 23514 sarebbe un errore muto sollevato dentro un trigger su una tabella diversa da quella che l''operatore stava toccando. ⛔ Il TETTO invece non si controlla qui, ed e'' una decisione: sulle fatture il caso non si presenta (la spezzatura di P2 la calcola fn_consuma_plafond_titolo_iva, che e'' anche l''unica a prendere il lock), e sulle forzature un superamento e'' un''informazione sul mondo — impedire di scriverlo impedirebbe di accorgersene. Il presidio giusto per quel caso e'' una lista di titoli sfondati che qualcuno guarda, e non fa parte di I7. I7 di brief-db-be-iva-risolutore-e-regime-cliente.';

              DROP TRIGGER IF EXISTS trg_stiva_movimenti_z90_accumulatore_ins_upd_dlt
                  ON anagrafiche.soggetti_titoli_iva_movimenti;
              CREATE TRIGGER trg_stiva_movimenti_z90_accumulatore_ins_upd_dlt
                  AFTER INSERT OR UPDATE OR DELETE
                  ON anagrafiche.soggetti_titoli_iva_movimenti
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_movimenti_accumulatore();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_stiva_movimenti_z90_accumulatore_ins_upd_dlt
                  ON anagrafiche.soggetti_titoli_iva_movimenti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_titoli_iva_movimenti_accumulatore();
