databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260213-08-create-trgfn-psp-guard-ruolo-psp-mctit.yaml

  - changeSet:
      id: 20260213-08-create-trgfn-psp-guard-ruolo-psp
      author: mctit
      comment: "Trigger guard ruolo PSP su anagrafiche.psp"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_psp_guard_ruolo_psp()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Verifica che NEW.soggetto_ruolo_id punti a un ruolo PSP
                --   valido usando la funzione centralizzata di guard ruolo.
                -- =========================================================

                NEW.soggetto_ruolo_id := script.fn_guard_soggetto_ruolo(
                  p_soggetto_id       := NULL,
                  p_soggetto_ruolo_id := NEW.soggetto_ruolo_id,
                  p_cd_int_ruolo      := 'PSP'
                );

                RETURN NEW;
              END;
              $$;

              COMMENT ON FUNCTION anagrafiche.trgfn_psp_guard_ruolo_psp()
                IS 'Valida che soggetto_ruolo_id sia coerente con il ruolo PSP.';

              CREATE OR REPLACE TRIGGER trg_psp_guard_ruolo_psp_ins_upd
                BEFORE INSERT OR UPDATE
                ON anagrafiche.psp
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_psp_guard_ruolo_psp();

              COMMENT ON TRIGGER trg_psp_guard_ruolo_psp_ins_upd ON anagrafiche.psp
                IS 'Controlla il ruolo PSP prima di insert/update.';
