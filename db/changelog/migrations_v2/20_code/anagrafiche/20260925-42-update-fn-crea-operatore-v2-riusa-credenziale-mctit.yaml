# P-2 — LA CREAZIONE DELL'OPERATORE RIUSA LA CREDENZIALE (D-6), E LA VESTE
#   NASCE SPENTA (regola unica dell'invito, R-2 del piano BE/FE)
#   Brief: brief-db-blocco-login-per-credenziale, sezione 5.2 e sezione 12
#
# Corpo di partenza: la doc auto-generata (docs/it/dbzero/anagrafiche/funzioni/
# fn_crea_operatore_v2.md), verificata uguale al vivo il 2026-09-25.
#
# ── 1. UNA PERSONA, UNA CREDENZIALE (D-6) ────────────────────────────
#   Prima la madre chiamava sempre fn_crea_auth_user, che rifiuta un'email gia'
#   presente: una persona prima cliente del portale e poi operatore finiva con
#   DUE credenziali (A-9 dell'analisi). Ora la madre chiede la credenziale
#   dell'email a script.fn_get_auth_user_id_for_email (20260925-40, senza
#   maiuscole) e, se c'e', la RIUSA: non ne tocca password, username, nome.
#   Il building block fn_crea_auth_user resta «crea e basta».
#
# ── 2. LA VESTE OPERATORE NASCE SPENTA, SEMPRE (R-2) ────────────────
#   La regola unica dell'invito (analisi accessi-credenziale-e-vesti §4.2,
#   decisa da Tid il 2026-09-24): l'invito crea la veste NON attiva, e la
#   accende l'attivazione (consumo del token). Il brief §5.2 lo chiedeva per la
#   credenziale riusata; il piano BE (R-2) lo chiede anche per quella nuova, ed
#   e' la stessa regola: due comportamenti a seconda che la credenziale esista
#   gia' sarebbero due cicli di vita.
#   ⇒ `p_attivo` ESCE dalla firma: un parametro che non decide piu' niente
#   mentirebbe al chiamante. La risorsa umana nasce attiva come prima (e' il
#   rapporto di lavoro, non l'accesso).
#   Conseguenza, voluta: su una credenziale NUOVA, fn_sync_auth_user_is_active
#   porta is_active a false (nessuna veste utilizzabile) finche' l'invito non
#   e' accettato. Il check dell'invito (20260925-43) non guarda piu' is_active.
#
# ── 3. ⛔ LA CREDENZIALE HA GIA' UNA VESTE OPERATORE → RIFIUTO ────────
#   Attiva o spenta. Il brief chiedeva il rifiuto sulla veste ATTIVA, per non
#   arrivare alla violazione dell'unique (auth_user_id, ruolo_applicativo)
#   WHERE attivo. Con la veste che nasce spenta quell'unique alla creazione non
#   scatta MAI: il duplicato passerebbe in silenzio e scoppierebbe
#   all'attivazione. E una veste OPERATORE spenta e' un invito pendente o un
#   operatore disattivato: in entrambi i casi il rimedio e' il (re)invito
#   (D-3), non un secondo operatore — con una seconda risorsa umana — sulla
#   stessa persona. ⇒ E_CREDENZIALE_GIA_OPERATORE (CONFLITTO_STATO).
#   ⚠️ Le vesti col ruolo DISABILITATO non contano: quel valore si ritira
#   (R-5, Q-2) e le righe che lo portano tornano al loro ruolo a mano.
#
# ── 4. CONCORRENZA ───────────────────────────────────────────────────
#   Due creazioni sulla stessa credenziale riusata si serializzano con un
#   FOR UPDATE sulla riga di django.auth_user, PRIMA del controllo del punto 3:
#   la seconda rilegge dopo il COMMIT della prima e la trova operatore. Due
#   creazioni sulla stessa email NUOVA le separa l'indice unico
#   (90_end/20260925-44), dove c'e'.
#
# ── ⛔ CONTRATTO CHE CAMBIA: DROP + CREATE ────────────────────────────
#   - firma: senza p_attivo (18 → 17 parametri);
#   - ritorno: da `integer` a RETURNS TABLE(auth_user_id, username,
#     credenziale_riusata). Lo username e' quello EFFETTIVO: su una credenziale
#     riusata e' il suo, non quello scritto dall'admin; e la password scelta
#     dall'admin e' IGNORATA — il backend deve dirlo (brief §5.2 ricaduta 1).
#     ⚠️ Si legge con `SELECT * FROM fn(...)`: `SELECT fn(...)` darebbe la
#     tupla intera in un campo solo, un valore plausibile e falso.
#   Chiamanti censiti il 2026-09-25: a DB dbops.fn_pgtap_crea_operatore_umano
#   (20260925-45, stesso giro); backend amm_software_repository.crea_operatore
#   (brief §7, lotto L-3); pgTAP test-fn-crea-operatore,
#   test-risorse-umane-guard-identita-attiva-v1 (adeguati nello stesso giro).
#   ⛔ Da applicare INSIEME alla PR del backend (L-3): il backend di oggi passa
#   p_attivo e legge un integer.
#
# ── GUARD RITIRATI ───────────────────────────────────────────────────
#   I guard di username e password_hash della madre erano copie di quelli di
#   fn_crea_auth_user, e ora sarebbero sbagliati: sulla credenziale riusata
#   username e password non servono. Sul percorso che crea, li applica
#   fn_crea_auth_user. Restano email (serve per cercare) e qualifica.
#
# ⚠️ plpgsql e tipi espliciti sulle colonne di Django (niente %TYPE: in CI lo
#   schema django non c'e' quando gira Liquibase). INVOKER, come prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260925-42-update-fn-crea-operatore-v2-riusa-credenziale-mctit.yaml

  - changeSet:
      id: 20260925-42-update-fn-crea-operatore-v2-riusa-credenziale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_crea_operatore_v2: riusa la credenziale dell'email se esiste (D-6, senza
        toccarne password e username), la veste OPERATORE nasce sempre spenta (regola unica
        dell'invito, R-2: p_attivo esce dalla firma), rifiuta con E_CREDENZIALE_GIA_OPERATORE una
        credenziale che ha gia' una veste OPERATORE. RETURNS TABLE(auth_user_id, username,
        credenziale_riusata): DROP + CREATE. Brief: brief-db-blocco-login-per-credenziale §5.2, §12.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_crea_operatore_v2(
                  uuid, text, text, text, text, text, text, integer, integer, date, character,
                  boolean, boolean, date, date, integer, bigint, bigint);

              CREATE FUNCTION anagrafiche.fn_crea_operatore_v2(
                  p_soggetto_id                    uuid      DEFAULT NULL::uuid,
                  p_cognome                        text      DEFAULT NULL::text,
                  p_nome                           text      DEFAULT NULL::text,
                  p_codice_fiscale                 text      DEFAULT NULL::text,
                  p_username                       text      DEFAULT NULL::text,
                  p_email                          text      DEFAULT NULL::text,
                  p_password_hash                  text      DEFAULT NULL::text,
                  p_qualifica_id                   integer   DEFAULT NULL::integer,
                  p_unita_organizzativa_id         integer   DEFAULT NULL::integer,
                  p_data_nascita                   date      DEFAULT NULL::date,
                  p_sesso                          character DEFAULT 'M'::bpchar,
                  p_is_super_admin                 boolean   DEFAULT false,
                  p_valido_dal                     date      DEFAULT CURRENT_DATE,
                  p_valido_al                      date      DEFAULT NULL::date,
                  p_comune_nascita_id              integer   DEFAULT NULL::integer,
                  p_indirizzo_resid_dettaglio_id   bigint    DEFAULT NULL::bigint,
                  p_indirizzo_domfisc_dettaglio_id bigint    DEFAULT NULL::bigint
              )
              -- ⚠️ integer e text espliciti: sono colonne di django.auth_user.
              RETURNS TABLE (
                  auth_user_id        integer,
                  username            text,
                  credenziale_riusata boolean
              )
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              DECLARE
                  -- integer/text espliciti: colonne di django.auth_user (niente %TYPE).
                  v_auth_user_id     integer;
                  v_username         text;
                  v_riusata          boolean := false;
                  v_soggetto_id      anagrafiche.soggetti.id%TYPE;
                  v_ru_id            anagrafiche.risorse_umane.id%TYPE;
                  v_tipo_soggetto_id config.tipi_soggetto_dettaglio.tipo_soggetto_id%TYPE;
                  v_veste_attiva     anagrafiche.identita_digitali.attivo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo: orchestratore della creazione di un operatore.
                  --   Due flussi sul soggetto (A: nuovo / B: esistente).
                  --   ⭐ Rev 20260925-42 (brief-db-blocco-login-per-credenziale §5.2):
                  --   - la credenziale dell'email, se c'e', si RIUSA (D-6):
                  --     password, username e nome restano i suoi;
                  --   - la veste OPERATORE nasce SPENTA, sempre: la accende
                  --     l'attivazione dell'invito (regola unica, R-2);
                  --   - una credenziale che ha gia' una veste OPERATORE (attiva
                  --     o spenta) si rifiuta: il rimedio e' il (re)invito.
                  -- Ritorna: la credenziale, il suo username EFFETTIVO, e se e'
                  --   stata riusata (allora la password passata e' ignorata).
                  -- =========================================================

                  -- ============ Guard comuni ============
                  -- ⚠️ Username e password_hash NON si validano qui: servono solo
                  --   se la credenziale va creata, e allora li valida
                  --   fn_crea_auth_user. Sulla credenziale riusata non servono.
                  IF p_email IS NULL OR TRIM(p_email) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_email'),
                          NULL::uuid, 'Email obbligatoria.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- ============ Step 1: la credenziale — riusata o creata ============
                  -- La regola «quale credenziale ha questa email» sta in un posto
                  -- solo, senza distinguere maiuscole e minuscole (D-9).
                  v_auth_user_id := script.fn_get_auth_user_id_for_email(p_email);

                  IF v_auth_user_id IS NOT NULL THEN
                      -- ⭐ Serializza due creazioni sulla stessa credenziale: la
                      --   seconda rilegge le vesti DOPO il COMMIT della prima.
                      PERFORM 1
                        FROM django.auth_user au
                       WHERE au.id = v_auth_user_id
                         FOR UPDATE;

                      -- ⛔ Gia' operatore (attiva o spenta): con la veste che nasce
                      --   spenta l'unique WHERE attivo qui non scatterebbe mai, e il
                      --   duplicato scoppierebbe all'attivazione. DISABILITATO non
                      --   conta: si ritira (R-5).
                      SELECT bool_or(idg.attivo)
                        INTO v_veste_attiva
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_auth_user_id
                         AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo;

                      IF v_veste_attiva IS NOT NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CREDENZIALE_GIA_OPERATORE',
                              jsonb_build_object('campo',        'email',
                                                 'auth_user_id', v_auth_user_id,
                                                 'veste_attiva', v_veste_attiva),
                              NULL::uuid,
                              TRIM(p_email));
                      END IF;

                      v_riusata := true;
                  ELSE
                      SELECT anagrafiche.fn_crea_auth_user(
                          p_username      := p_username,
                          p_email         := p_email,
                          p_password_hash := p_password_hash,
                          p_first_name    := COALESCE(p_nome, ''),
                          p_last_name     := COALESCE(p_cognome, '')
                      ) INTO v_auth_user_id;
                  END IF;

                  -- ============ Step 2: Soggetto (flusso A o B) ============
                  IF p_soggetto_id IS NOT NULL THEN
                      -- Flusso B: soggetto esistente
                      SELECT tsd.tipo_soggetto_id
                        INTO v_tipo_soggetto_id
                        FROM anagrafiche.soggetti s
                        JOIN config.tipi_soggetto_dettaglio tsd
                          ON tsd.id = s.tipo_soggetto_dettaglio_id
                       WHERE s.id = p_soggetto_id;

                      IF v_tipo_soggetto_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('p_soggetto_id', p_soggetto_id),
                              NULL::uuid,
                              'Soggetto con id=' || p_soggetto_id || ' non trovato.'
                          );
                      END IF;

                      IF v_tipo_soggetto_id <> 'PF' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('p_soggetto_id', p_soggetto_id,
                                                'tipo_soggetto_id', v_tipo_soggetto_id),
                              NULL::uuid,
                              'Soggetto deve essere Persona Fisica (PF). Trovato: ' || v_tipo_soggetto_id || '.'
                          );
                      END IF;

                      v_soggetto_id := p_soggetto_id;

                  ELSE
                      -- Flusso A: crea soggetto PF nuovo
                      IF p_cognome IS NULL OR TRIM(p_cognome) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_cognome'),
                              NULL::uuid, 'Cognome obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      IF p_nome IS NULL OR TRIM(p_nome) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_nome'),
                              NULL::uuid, 'Nome obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      IF p_codice_fiscale IS NULL OR TRIM(p_codice_fiscale) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_codice_fiscale'),
                              NULL::uuid,
                              'Codice fiscale obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      SELECT anagrafiche.fn_crea_soggetto_pf(
                          p_cognome           := p_cognome,
                          p_nome              := p_nome,
                          p_codice_fiscale    := p_codice_fiscale,
                          p_email             := p_email,
                          p_data_nascita      := p_data_nascita,
                          p_sesso             := p_sesso,
                          p_comune_nascita_id := p_comune_nascita_id
                      ) INTO v_soggetto_id;
                  END IF;

                  -- ============ Step 3: risorsa umana + veste OPERATORE SPENTA ============
                  -- ⭐ p_attivo := false, sempre (R-2): la veste la accende
                  --   l'attivazione dell'invito. La risorsa umana nasce attiva.
                  SELECT anagrafiche.fn_crea_risorsa_umana_v2(
                      p_soggetto_id            := v_soggetto_id,
                      p_qualifica_id           := p_qualifica_id,
                      p_unita_organizzativa_id := p_unita_organizzativa_id,
                      p_valido_dal             := p_valido_dal,
                      p_valido_al              := p_valido_al,
                      p_auth_user_id           := v_auth_user_id,
                      p_is_super_admin         := p_is_super_admin,
                      p_attivo                 := false
                  ) INTO v_ru_id;

                  -- ============ Step 4: indirizzi soggetto (invariato) ============
                  IF p_indirizzo_resid_dettaglio_id IS NOT NULL THEN
                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(
                          p_soggetto_id            := v_soggetto_id,
                          p_tipo_indirizzo_codice  := 'RES',
                          p_indirizzo_dettaglio_id := p_indirizzo_resid_dettaglio_id
                      );

                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(
                          p_soggetto_id            := v_soggetto_id,
                          p_tipo_indirizzo_codice  := 'DOMFISC',
                          p_indirizzo_dettaglio_id := COALESCE(
                              p_indirizzo_domfisc_dettaglio_id,
                              p_indirizzo_resid_dettaglio_id
                          )
                      );
                  END IF;

                  -- ============ Ritorno: lo username EFFETTIVO ============
                  SELECT au.username
                    INTO v_username
                    FROM django.auth_user au
                   WHERE au.id = v_auth_user_id;

                  RETURN QUERY SELECT v_auth_user_id, v_username, v_riusata;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_operatore_v2(uuid, text, text, text, text, text, text, integer, integer, date, character, boolean, date, date, integer, bigint, bigint)
              IS 'Orchestratore della creazione di un operatore (flusso A: soggetto PF nuovo; flusso B: soggetto esistente). ⭐ Rev 20260925-42 (brief-db-blocco-login-per-credenziale §5.2): (1) la credenziale dell''email, se esiste, si RIUSA (D-6, una persona una credenziale) senza toccarne password, username e nome — la cerca script.fn_get_auth_user_id_for_email, senza distinguere maiuscole e minuscole; altrimenti la crea fn_crea_auth_user; (2) la veste OPERATORE nasce SPENTA, sempre (regola unica dell''invito, R-2): la accende l''attivazione, e p_attivo e'' uscito dalla firma; (3) una credenziale che ha gia'' una veste OPERATORE, attiva o spenta, si rifiuta con E_CREDENZIALE_GIA_OPERATORE (il rimedio e'' il reinvito). Ritorna TABLE(auth_user_id, username effettivo, credenziale_riusata): con credenziale_riusata = true la password passata e'' stata IGNORATA. Si legge con SELECT * FROM. INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: la firma di prima (con p_attivo, RETURNS integer) sta
              -- nella doc auto-generata alla data del 2026-09-24.
              SELECT 1;
