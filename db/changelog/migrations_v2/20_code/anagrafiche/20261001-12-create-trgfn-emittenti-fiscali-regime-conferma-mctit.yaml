# ------------------------------------------------------------
# UNA CONFERMA VALE PER IL REGIME A CUI E' STATA DATA (D-11)
#   anagrafiche.trgfn_emittenti_fiscali_regime_conferma()
#   Brief: brief-db-esigibilita-iva-per-cassa-emittente, sezione 8.6 (D-11)
#
# -- IL CASO ------------------------------------------------------
#   Un emittente confermato a RF01 passa a RF17 da una strada che non
#   scrive la conferma (un UPDATE a mano, un import, un form che si
#   dimentica). Senza questo trigger la riga direbbe «RF17, confermato il
#   ... da ...»: una conferma data a un altro regime, e il presidio
#   dbops.vw_emittenti_regime_non_confermato non lo vedrebbe.
#
# -- LA REGOLA ----------------------------------------------------
#   Se regime_fiscale_rf cambia e la conferma NON cambia nella stessa
#   scrittura, la conferma si azzera. Chi dichiara il regime nuovo scrive
#   la conferma insieme, e quella resta.
#   Non solleva: non c'e' niente di sbagliato da rifiutare, c'e' un fatto
#   («nessuno ha confermato QUESTO regime») da scrivere.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261001-12-create-trgfn-emittenti-fiscali-regime-conferma-mctit.yaml

  - changeSet:
      id: 20261001-12-create-trgfn-emittenti-fiscali-regime-conferma
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.trgfn_emittenti_fiscali_regime_conferma: quando regime_fiscale_rf cambia
        senza una conferma nuova nella stessa scrittura, azzera regime_fiscale_confermato_il e
        _da. Brief: brief-db-esigibilita-iva-per-cassa-emittente, sezione 8.6 (D-11).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: anagrafiche
            tableName: emittenti_fiscali
            columnName: regime_fiscale_confermato_il
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_emittenti_fiscali_regime_conferma()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: una conferma del regime fiscale vale per il regime a cui
              --   e' stata data. Se il regime cambia e la conferma no, la
              --   conferma si azzera.
              -- Uso:   BEFORE UPDATE OF regime_fiscale_rf FOR EACH ROW
              BEGIN
                  -- UPDATE OF scatta anche quando la colonna e' riscritta con lo
                  -- stesso valore: li' la conferma resta com'e'.
                  IF NEW.regime_fiscale_rf IS NOT DISTINCT FROM OLD.regime_fiscale_rf THEN
                      RETURN NEW;
                  END IF;

                  -- Una conferma scritta insieme al regime nuovo e' la conferma
                  -- del regime nuovo: resta.
                  IF NEW.regime_fiscale_confermato_il IS DISTINCT FROM OLD.regime_fiscale_confermato_il THEN
                      RETURN NEW;
                  END IF;

                  NEW.regime_fiscale_confermato_il := NULL;
                  NEW.regime_fiscale_confermato_da := NULL;
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_emittenti_fiscali_regime_conferma() IS
                  'Una conferma del regime fiscale vale per il regime a cui e'' stata data: quando '
                  'regime_fiscale_rf cambia e regime_fiscale_confermato_il no, la conferma (data e '
                  'autore) si azzera, e l''emittente torna nel presidio '
                  'dbops.vw_emittenti_regime_non_confermato. Chi dichiara il regime nuovo scrive '
                  'la conferma nella stessa scrittura, e quella resta. Non solleva. Brief: '
                  'brief-db-esigibilita-iva-per-cassa-emittente (D-11).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_emittenti_fiscali_regime_conferma();
