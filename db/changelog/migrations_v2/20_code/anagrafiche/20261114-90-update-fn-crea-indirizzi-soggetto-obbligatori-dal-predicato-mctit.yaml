# LA PLURALE DEL SOGGETTO COPIA SOLO GLI OBBLIGATORI CHE IL GUARD AMMETTE OGGI
#   anagrafiche.fn_crea_indirizzi_soggetto(soggetto, jsonb, copia_obbligatori)
#   Brief: brief-db-copia-indirizzo-soggetto §3.1, §4.2, giro 1 (D-4).
#   Corpo di partenza: docs/it/dbzero/anagrafiche/funzioni/fn_crea_indirizzi_soggetto.md
#   (rigenerata dopo l'ultimo changeSet sull'oggetto, 20261019-39).
#
# ── IL DIFETTO ──────────────────────────────────────────────────
#   I tipi obbligatori da copiare si leggevano dalle righe attive della
#   matrice, senza la finestra di validita'. Il guard della tabella
#   (trgfn_indirizzi_soggetti_guard_tipo_indirizzo) e quello degli obbligatori
#   (trgfn_soggetti_guard_indirizzi_required) giudicano invece sulla riga
#   attiva E valida oggi. Una riga obbligatoria scaduta (o non ancora valida)
#   faceva nascere una copia che il guard rifiutava: la creazione del soggetto
#   falliva per un tipo che nessuno pretendeva piu'.
#
# ── COSA CAMBIA ─────────────────────────────────────────────────
#   Gli obbligatori sono le righe obbligatorie per cui il predicato del guard,
#   anagrafiche.fn_tipo_indirizzo_ammesso_per_natura, risponde «ammesso» il
#   giorno di script.fn_data_operativa(): le due letture non possono divergere.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────
#   Il salto dei tipi che il soggetto ha gia' (regola 3), prima della
#   singolare: la plurale non incontra il motivo «tipo gia' presente» della
#   singolare. Firma, ritorno, rifiuti. COMMENT riscritto al presente (§5d).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-90-update-fn-crea-indirizzi-soggetto-obbligatori-dal-predicato-mctit.yaml

  - changeSet:
      id: 20261114-90-update-fn-crea-indirizzi-soggetto-obbligatori-dal-predicato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_crea_indirizzi_soggetto legge gli obbligatori da copiare col predicato del guard
        (riga attiva e valida oggi).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_indirizzi_soggetto(
                  p_soggetto_id       anagrafiche.indirizzi_soggetti.soggetto_id%TYPE,
                  p_indirizzi         jsonb,
                  -- un interruttore del chiamante: nessuna colonna di cui sia il riflesso
                  p_copia_obbligatori boolean DEFAULT true)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  c_chi       CONSTANT text := 'anagrafiche.fn_crea_indirizzi_soggetto';
                  v_lista     jsonb := COALESCE(p_indirizzi, '[]'::jsonb);
                  v_norm      jsonb := '[]'::jsonb;  -- elementi col tipo risolto
                  v_el        jsonb;
                  v_tipo_sd   anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_tipo_id   anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE;
                  v_oggi      config.tipi_soggetto_dettaglio_tipi_indirizzo.valido_dal%TYPE;
                  v_n         integer := 0;   -- un conteggio: niente da ancorare
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere gli indirizzi di un soggetto. p_indirizzi e' un
                  --   array di oggetti con la grammatica di
                  --   anagrafiche.fn_indirizzo_elemento. Ritorna quanti
                  --   indirizzi ha scritto.
                  --
                  -- Regole (quelle della gemella fn_crea_indirizzi_ruolo):
                  --   1. ogni elemento si normalizza col BB dell'elemento;
                  --   2. se p_copia_obbligatori, i tipi obbligatori della
                  --      natura che mancano ricevono una copia del primo
                  --      (anagrafiche.fn_indirizzi_con_obbligatori); sono
                  --      obbligatori solo i tipi che il guard ammette oggi
                  --      (fn_tipo_indirizzo_ammesso_per_natura);
                  --   3. un tipo che il soggetto ha gia' si salta; le righe le
                  --      scrive la singolare fn_crea_indirizzo_soggetto.
                  -- =========================================================
                  IF jsonb_typeof(v_lista) <> 'array' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo_indirizzi', jsonb_typeof(v_lista)),
                          NULL::uuid,
                          c_chi,
                          'gli indirizzi non sono un elenco');
                  END IF;

                  SELECT s.tipo_soggetto_dettaglio_id
                    INTO v_tipo_sd
                    FROM anagrafiche.soggetti s
                   WHERE s.id = p_soggetto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SOGGETTO_NOT_FOUND',
                          jsonb_build_object('soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          COALESCE(p_soggetto_id::text, '-'));
                  END IF;

                  IF jsonb_array_length(v_lista) = 0 THEN
                      RETURN 0;
                  END IF;

                  -- 1. La grammatica dell'elemento.
                  FOR v_el IN SELECT e FROM jsonb_array_elements(v_lista) AS e LOOP
                      v_norm := v_norm || jsonb_build_array(
                                  anagrafiche.fn_indirizzo_elemento(
                                      v_el, c_chi,
                                      jsonb_build_object('soggetto_id', p_soggetto_id)));
                  END LOOP;

                  -- 2. La copia degli obbligatori: le righe obbligatorie che il
                  --    predicato del guard ammette oggi.
                  IF p_copia_obbligatori THEN
                      v_oggi := script.fn_data_operativa();
                      v_norm := anagrafiche.fn_indirizzi_con_obbligatori(
                          v_norm,
                          ARRAY(SELECT m.tipo_indirizzo_id
                                  FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                                 WHERE m.tipo_soggetto_dettaglio_id = v_tipo_sd
                                   AND m.obbligatorio
                                   AND anagrafiche.fn_tipo_indirizzo_ammesso_per_natura(
                                           v_tipo_sd, m.tipo_indirizzo_id, v_oggi)));
                  END IF;

                  -- 3. La scrittura: un tipo che il soggetto ha gia' si salta.
                  FOR v_el IN SELECT e FROM jsonb_array_elements(v_norm) AS e LOOP
                      v_tipo_id := (v_el ->> 'tipo_indirizzo_id')::integer;

                      CONTINUE WHEN EXISTS (
                          SELECT 1
                            FROM anagrafiche.indirizzi_soggetti i
                           WHERE i.soggetto_id = p_soggetto_id
                             AND i.tipo_indirizzo_id = v_tipo_id);

                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(p_soggetto_id, v_el);
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_indirizzi_soggetto(
                      anagrafiche.indirizzi_soggetti.soggetto_id%TYPE, jsonb, boolean)
              IS 'Madre plurale: scrive gli indirizzi di un soggetto e ritorna quanti ne ha scritti. Elementi con la grammatica di anagrafiche.fn_indirizzo_elemento; se p_copia_obbligatori (il flag auto_clone del backend, vero di default) i tipi obbligatori della natura che mancano ricevono una copia del primo (anagrafiche.fn_indirizzi_con_obbligatori). Sono obbligatori le righe obbligatorie di config.tipi_soggetto_dettaglio_tipi_indirizzo per cui anagrafiche.fn_tipo_indirizzo_ammesso_per_natura risponde ammesso il giorno di script.fn_data_operativa(), cioe'' attive e valide oggi: lo stesso giudizio dei guard della tabella e degli obbligatori, quindi una riga scaduta non fa nascere una copia. Un tipo che il soggetto ha gia'' si salta; ogni riga la scrive la singolare anagrafiche.fn_crea_indirizzo_soggetto. Soggetto inesistente E_SOGGETTO_NOT_FOUND, elenco non array E_SCRIPT_CHIAMATA_NON_VALIDA, elenco vuoto 0. INVOKER. Gemella di anagrafiche.fn_crea_indirizzi_ruolo.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il corpo precedente e' nella doc auto-generata; si torna indietro con un changeSet nuovo.
              SELECT 1;
