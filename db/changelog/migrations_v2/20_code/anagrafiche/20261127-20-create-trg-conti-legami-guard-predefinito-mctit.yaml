# ------------------------------------------------------------
# IL PREDEFINITO DI UN LEGAME: NON BLOCCATO, UNO SOLO PER PERIODO
#   anagrafiche.trgfn_conti_legami_guard_predefinito()                   (nuova)
#   trg_soggetti_conti_bancari_a12_guard_predefinito_ins_upd             (nuovo)
#   trg_soggetti_ruoli_conti_bancari_a12_guard_predefinito_ins_upd       (nuovo)
#   Brief: brief-db-revisione-anagrafiche §25.2 (S18b, R-BE4, S55d,
#          D-T8a-2, D-T8a-7 a), §25.10
#
# -- PERCHE' UN GUARD DAVANTI AI VINCOLI ----------------------------------
#   Le due regole le tengono gia' i vincoli (20261127-14 l'EXCLUDE sul
#   periodo, 20261127-15 il CHECK), ma un vincolo risponde 23P01 o 23514 col
#   proprio nome, non con un codice di dominio: il contratto dei codici vale
#   solo su P0001 (guida Messaggi di Errore, «Cosa esce dall'eccezione»).
#   Il guard BEFORE ROW parla prima, col codice e il campo; il vincolo resta
#   come rete (le scritture concorrenti, le strade che il trigger non vede),
#   come E_DATA_CHIUSURA davanti a chk_clienti_date_coerenti.
#
# -- UNA FUNZIONE PER I DUE LEGAMI ------------------------------------------
#   I due legami hanno la stessa forma e la stessa regola; cambia solo chi
#   possiede il legame (il soggetto; il ruolo con la sua istanza). Una
#   funzione sola, che legge la tabella da TG_TABLE_NAME, con un ramo statico
#   per tabella: due copie della stessa regola divergerebbero (regola del 2).
#   L'istanza si confronta con IS NOT DISTINCT FROM, come i due EXCLUDE fanno
#   con due vincoli: un legame di tutto il ruolo e uno di una fornitura non
#   si incontrano.
#   Nessuna row level security sulle due tabelle: nessun SECURITY DEFINER.
#
# -- IL MONTAGGIO ------------------------------------------------------------
#   BEFORE INSERT OR UPDATE, WHEN (NEW.predefinito): le due regole parlano
#   solo di un legame predefinito. Senza OF: le date, l'uso, il blocco e il
#   segno contano tutti (nessun altro trigger BEFORE li scrive).
#   Fase a12, un numero libero della zona dei guard: viene dopo il lucchetto
#   generato (a10_lock_columns), di proposito. Fra due rifiuti parla prima
#   l'immutabilita' (linee-guida-trigger, «La fase»): un UPDATE che sposta il
#   possessore di un predefinito sente il lucchetto, non la sovrapposizione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261127-20-create-trg-conti-legami-guard-predefinito-mctit.yaml

  - changeSet:
      id: 20261127-20-create-trg-conti-legami-guard-predefinito
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I due legami dei conti: un predefinito non e' bloccato
        (E_CONTO_PREDEFINITO_BLOCCATO) e non si sovrappone nel tempo a un altro
        predefinito (E_CONTO_PREDEFINITO_SOVRAPPOSTO).
        brief-db-revisione-anagrafiche §25.2 (D-T8a-2, D-T8a-7 a).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_conti_legami_guard_predefinito()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_chi       CONSTANT dbops.error_log.function_name%TYPE := 'anagrafiche.trgfn_conti_legami_guard_predefinito';
                  v_periodo   daterange;
                  v_altro_id  anagrafiche.soggetti_conti_bancari.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo: il predefinito di un legame di conto
                  --   (anagrafiche.soggetti_conti_bancari,
                  --   anagrafiche.soggetti_ruoli_conti_bancari).
                  --   1) non e' bloccato: il blocco toglie il legame dalla
                  --      scelta, il predefinito e' la scelta;
                  --   2) non si sovrappone nel tempo a un altro predefinito
                  --      dello stesso possessore e uso (date comprese, NULL =
                  --      senza limite). Possessore: il soggetto; il ruolo e
                  --      l'istanza (NULL = tutto il ruolo, confronto IS NOT
                  --      DISTINCT FROM).
                  -- Montata BEFORE INSERT OR UPDATE, WHEN (NEW.predefinito).
                  -- I vincoli chk_*_predefinito_non_bloccato e
                  --   ex_*_predefinito_*periodo dicono la stessa cosa e restano
                  --   come rete: qui il codice di dominio e il campo.
                  -- I valori giudicati sono quelli di NEW, mai riletti per id.
                  -- =========================================================
                  IF NEW.bloccato THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_CONTO_PREDEFINITO_BLOCCATO',
                          jsonb_build_object('campo', 'bloccato',
                                             'tabella', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                             'id', NEW.id),
                          NEW.tx_id,
                          NEW.uso::text);
                  END IF;

                  v_periodo := daterange(NEW.valido_dal, NEW.valido_al, '[]');

                  IF TG_TABLE_NAME = 'soggetti_conti_bancari' THEN
                      SELECT l.id INTO v_altro_id
                        FROM anagrafiche.soggetti_conti_bancari l
                       WHERE l.soggetto_id = NEW.soggetto_id
                         AND l.uso = NEW.uso
                         AND l.predefinito
                         AND l.id IS DISTINCT FROM NEW.id
                         AND daterange(l.valido_dal, l.valido_al, '[]') && v_periodo
                       ORDER BY l.id
                       LIMIT 1;
                  ELSIF TG_TABLE_NAME = 'soggetti_ruoli_conti_bancari' THEN
                      SELECT l.id INTO v_altro_id
                        FROM anagrafiche.soggetti_ruoli_conti_bancari l
                       WHERE l.soggetto_ruolo_id = NEW.soggetto_ruolo_id
                         AND l.istanza_utility_id IS NOT DISTINCT FROM NEW.istanza_utility_id
                         AND l.uso = NEW.uso
                         AND l.predefinito
                         AND l.id IS DISTINCT FROM NEW.id
                         AND daterange(l.valido_dal, l.valido_al, '[]') && v_periodo
                       ORDER BY l.id
                       LIMIT 1;
                  ELSE
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_DBOPS_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('campo', 'tabella',
                                             'tabella', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME),
                          NULL::uuid,
                          v_chi, format('montata su %s.%s, che non e'' un legame di conto',
                                        TG_TABLE_SCHEMA, TG_TABLE_NAME));
                  END IF;

                  IF v_altro_id IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', v_chi, 'E_CONTO_PREDEFINITO_SOVRAPPOSTO',
                          jsonb_build_object('campo', 'predefinito',
                                             'tabella', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                             'id', NEW.id,
                                             'altro_legame_id', v_altro_id,
                                             'uso', NEW.uso),
                          NEW.tx_id,
                          NEW.uso::text);
                  END IF;

                  RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_conti_legami_guard_predefinito() IS
                'BEFORE INSERT OR UPDATE, WHEN (NEW.predefinito), sui due legami dei conti (anagrafiche.soggetti_conti_bancari, anagrafiche.soggetti_ruoli_conti_bancari). Un legame predefinito non e'' bloccato (E_CONTO_PREDEFINITO_BLOCCATO, campo bloccato) e non si sovrappone nel tempo a un altro predefinito dello stesso possessore e uso (E_CONTO_PREDEFINITO_SOVRAPPOSTO, campo predefinito): possessore e'' il soggetto, oppure il ruolo con la sua istanza (NULL = tutto il ruolo). Periodo: valido_dal e valido_al comprese, NULL = senza limite. I vincoli chk_*_predefinito_non_bloccato ed ex_*_predefinito_*periodo restano come rete per le scritture concorrenti. Su un''altra tabella solleva E_DBOPS_CHIAMATA_NON_VALIDA.';

              DROP TRIGGER IF EXISTS trg_soggetti_conti_bancari_a12_guard_predefinito_ins_upd
                ON anagrafiche.soggetti_conti_bancari;
              CREATE TRIGGER trg_soggetti_conti_bancari_a12_guard_predefinito_ins_upd
                BEFORE INSERT OR UPDATE ON anagrafiche.soggetti_conti_bancari
                FOR EACH ROW WHEN (NEW.predefinito)
                EXECUTE FUNCTION anagrafiche.trgfn_conti_legami_guard_predefinito();

              DROP TRIGGER IF EXISTS trg_soggetti_ruoli_conti_bancari_a12_guard_predefinito_ins_upd
                ON anagrafiche.soggetti_ruoli_conti_bancari;
              CREATE TRIGGER trg_soggetti_ruoli_conti_bancari_a12_guard_predefinito_ins_upd
                BEFORE INSERT OR UPDATE ON anagrafiche.soggetti_ruoli_conti_bancari
                FOR EACH ROW WHEN (NEW.predefinito)
                EXECUTE FUNCTION anagrafiche.trgfn_conti_legami_guard_predefinito();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_conti_bancari_a12_guard_predefinito_ins_upd
                ON anagrafiche.soggetti_conti_bancari;
              DROP TRIGGER IF EXISTS trg_soggetti_ruoli_conti_bancari_a12_guard_predefinito_ins_upd
                ON anagrafiche.soggetti_ruoli_conti_bancari;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_conti_legami_guard_predefinito();
