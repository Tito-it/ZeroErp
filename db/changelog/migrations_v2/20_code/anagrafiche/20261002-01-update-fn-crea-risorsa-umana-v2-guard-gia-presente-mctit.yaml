# anagrafiche.fn_crea_risorsa_umana_v2: UNA PERSONA E' UNA RISORSA UMANA SOLA.
#   Richiesta del team BE (2026-10-02), senza brief.
#
# -- IL DIFETTO -----------------------------------------------------------
#   uq_risorse_umane_soggetto_ruolo e' UNIQUE (soggetto_ruolo_id), non
#   parziale (00_schema/anagrafiche/20260107-19): vale anche per una risorsa
#   disattivata. fn_crea_operatore_v2, flusso B, su un soggetto che ha gia' il
#   suo operatore arrivava all'INSERT e il client riceveva un 23505 nudo,
#   E_DATABASE: nessuna frase, nessun campo, nessun rimedio.
#
# -- LA CURA, e perche' QUI ----------------------------------------------------
#   Il guard sta nella funzione a cui il vincolo appartiene, non nel suo unico
#   chiamante di oggi (fn_crea_operatore_v2): cosi' vale per chiunque crei una
#   risorsa umana. Fra lo Step 1 (che risolve il soggetto_ruolo RIS_UMANA) e lo
#   Step 2 (l'INSERT), con un EXISTS sulla chiave del vincolo — non su attivo.
#   Codice nuovo E_RISORSA_UMANA_GIA_PRESENTE (CONFLITTO_STATO, stampo
#   E_CREDENZIALE_GIA_OPERATORE), 'campo' = soggetto_id nella chiamata: e' il
#   canale che il presidio dbops/test-punti-canale-campo-v1 legge. Segnaposto =
#   il nome del soggetto, con ripiego (ragione_sociale_completa e' nullable).
#   ⚠️ Lo Step 1 puo' aver CREATO il soggetto_ruolo prima del rifiuto: il RAISE
#   annulla l'intera istruzione, quindi non resta niente.
#
# -- FORMA -------------------------------------------------------------------
#   · CREATE OR REPLACE, firma invariata (stessa identita'): firma e RETURNS
#     ancorati dall'ultimo YAML che li ha (20260923-10). p_attivo ora e'
#     identita_digitali.attivo%TYPE (e' quella colonna che scrive, stesso tipo);
#     p_is_super_admin e v_n_profili_sa restano espliciti, con la ragione
#     accanto (una scelta, un conteggio: nessuna colonna di cui siano il riflesso);
#   · corpo vivo dalla doc auto-gen (rev 20260923-10, 20260922-11), patchato da
#     script con sostituzioni contate. Nessun'altra riga toccata;
#   · INVOKER com'e'; privilegi intatti (nessun DROP).
#
# Verifica: db/pgtap/anagrafiche/test-fn-crea-risorsa-umana-gia-presente-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261002-01-update-fn-crea-risorsa-umana-v2-guard-gia-presente-mctit.yaml

  - changeSet:
      id: 20261002-01-update-fn-crea-risorsa-umana-v2-guard-gia-presente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_crea_risorsa_umana_v2: se il soggetto e' gia' una risorsa umana (anche spenta,
        uq_risorse_umane_soggetto_ruolo) solleva E_RISORSA_UMANA_GIA_PRESENTE, campo
        soggetto_id, invece di lasciar arrivare il 23505 al client. Guard nella funzione
        del vincolo, vale per ogni chiamante. Firma invariata.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_crea_risorsa_umana_v2';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_risorsa_umana_v2(
                  p_soggetto_id            anagrafiche.risorse_umane.soggetto_id%TYPE            DEFAULT NULL,
                  p_qualifica_id           anagrafiche.risorse_umane.qualifica_id%TYPE           DEFAULT NULL,
                  p_unita_organizzativa_id anagrafiche.risorse_umane.unita_organizzativa_id%TYPE DEFAULT NULL,
                  p_valido_dal             anagrafiche.risorse_umane.valido_dal%TYPE             DEFAULT CURRENT_DATE,
                  p_valido_al              anagrafiche.risorse_umane.valido_al%TYPE              DEFAULT NULL,
                  p_auth_user_id           anagrafiche.identita_digitali.auth_user_id%TYPE       DEFAULT NULL,
                  p_is_super_admin         boolean                                               DEFAULT false,  -- una scelta, nessuna colonna
                  p_attivo                 anagrafiche.identita_digitali.attivo%TYPE             DEFAULT true
              )
               RETURNS anagrafiche.risorse_umane.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_sr_id        anagrafiche.soggetti_ruoli.id%TYPE;
                  v_ru_id        anagrafiche.risorse_umane.id%TYPE;
                  v_identita_id  anagrafiche.identita_digitali.id%TYPE;
                  v_profilo_sa   config.profili_accesso_bindings.profilo_accesso_id%TYPE;
                  v_n_profili_sa integer;  -- un conteggio: nessuna colonna di cui sia il riflesso
              BEGIN
                  -- =========================================================
                  -- Scopo (v2 multi-face native, Chunk A Fase 7 2026-04-29):
                  --   Crea risorsa_umana + identita_digitali OPERATORE
                  --   (+ binding SUPER_ADMIN se p_is_super_admin=true).
                  --   Niente piu' enum legacy ruolo_sistema; il chiamante
                  --   esprime direttamente "is super admin?" + "attiva?".
                  --
                  -- Body identico a v1 salvo:
                  --   Step 3: identita_digitali.attivo = p_attivo
                  --           (era hardcoded true in v1).
                  --   Step 4: IF p_is_super_admin invece di
                  --           IF p_ruolo_sistema='ADMIN'.
                  -- =========================================================

                  -- Validazione parametri obbligatori
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_soggetto_id'),
                          NULL::uuid, 'Soggetto obbligatorio.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- Guard prerequisiti
                  IF NOT EXISTS (
                      SELECT 1 FROM config.qualifiche
                       WHERE id = p_qualifica_id AND attivo = true
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('qualifica_id', p_qualifica_id),
                          NULL::uuid, 'Qualifica non trovata o non attiva.'
                      );
                  END IF;

                  IF p_unita_organizzativa_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM config.unita_organizzative
                           WHERE id = p_unita_organizzativa_id AND attivo = true
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                              'E_ADMIN_UO_NON_TROVATA',
                              jsonb_build_object('campo', 'unita_organizzativa_id', 'unita_organizzativa_id', p_unita_organizzativa_id),
                              NULL::uuid,
                              'Unita'' organizzativa non trovata o non attiva.'
                          );
                      END IF;
                  END IF;

                  IF p_auth_user_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM django.auth_user WHERE id = p_auth_user_id
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('auth_user_id', p_auth_user_id),
                              NULL::uuid, 'auth_user non trovato.'
                          );
                      END IF;
                  END IF;

                  -- ⛔ Il profilo SUPER_ADMIN si RISOLVE, non si scrive (rev 20260923-10).
                  --   Fino a questa revisione il binding usava l'id cablato 9100: vero solo
                  --   perche' il seed di config.profili_accesso porta l'id esplicito. La
                  --   chiave stabile e' l'enum `tipo` (linee-guida-sql §6d, punto 1: e' la
                  --   stessa dei guard anti-lockout e di script.fn_is_super_admin); `codice`
                  --   e' modificabile e non ha lock.
                  -- ⚠️ Il modello non vieta DUE profili di tipo SUPER_ADMIN, e sceglierne uno
                  --   per id sarebbe un'ambiguita', non una scelta: si pretende esattamente
                  --   un profilo attivo, e si solleva PRIMA di ogni scrittura.
                  IF p_is_super_admin AND p_auth_user_id IS NOT NULL THEN
                      SELECT count(*), min(pa.id)
                        INTO v_n_profili_sa, v_profilo_sa
                        FROM config.profili_accesso pa
                       WHERE pa.tipo = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                         AND pa.attivo;

                      IF v_n_profili_sa <> 1 THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                              'E_CONFIG_MANCANTE',
                              jsonb_build_object('tipo_profilo_accesso', 'SUPER_ADMIN',
                                                 'profili_attivi', v_n_profili_sa),
                              NULL::uuid,
                              'un solo profilo di accesso SUPER_ADMIN attivo (trovati '
                                  || v_n_profili_sa::text || ')'
                          );
                      END IF;
                  END IF;

                  -- Step 1: soggetto_ruolo RIS_UMANA
                  SELECT script.fn_get_or_create_soggetto_ruolo(
                      p_soggetto_id, 'RIS_UMANA'
                  ) INTO v_sr_id;

                  -- ⛔ Una persona e' una risorsa umana sola (uq_risorse_umane_soggetto_ruolo,
                  --   non parziale: vale anche per una risorsa spenta). Senza questo guard il
                  --   secondo operatore sullo stesso soggetto arrivava al client come 23505,
                  --   E_DATABASE. Il rimedio e' sulla risorsa che c'e' (reinvito, riattivazione),
                  --   non una seconda. (rev 20261002-01)
                  -- ⚠️ Il controllo e' sulla CHIAVE del vincolo (soggetto_ruolo_id), non su
                  --   attivo: una risorsa disattivata occupa lo slot come una attiva.
                  -- ⚠️ Il segnaposto e' la frase dell'operatore: ragione_sociale_completa e'
                  --   nullable, quindi si ripiega su nome e cognome, poi su «Il soggetto» —
                  --   mai una frase con un buco al posto del nome.
                  IF EXISTS (
                      SELECT 1 FROM anagrafiche.risorse_umane ru
                       WHERE ru.soggetto_ruolo_id = v_sr_id
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_RISORSA_UMANA_GIA_PRESENTE',
                          jsonb_build_object('campo',             'soggetto_id',
                                             'soggetto_id',       p_soggetto_id,
                                             'soggetto_ruolo_id', v_sr_id),
                          NULL::uuid,
                          COALESCE(
                              (SELECT COALESCE(NULLIF(btrim(s.ragione_sociale_completa), ''),
                                               NULLIF(btrim(concat_ws(' ', s.nome, s.cognome)), ''),
                                               NULLIF(btrim(s.ragione_sociale), ''))
                                 FROM anagrafiche.soggetti s
                                WHERE s.id = p_soggetto_id),
                              'Il soggetto'));
                  END IF;

                  -- Step 2: risorsa umana
                  INSERT INTO anagrafiche.risorse_umane (
                      soggetto_ruolo_id, soggetto_id, qualifica_id,
                      unita_organizzativa_id, valido_dal, valido_al, attivo
                  )
                  VALUES (
                      v_sr_id, p_soggetto_id, p_qualifica_id,
                      p_unita_organizzativa_id, p_valido_dal, p_valido_al, true
                  )
                  RETURNING id INTO v_ru_id;

                  -- Step 3: identita_digitali OPERATORE.
                  -- Differenza vs v1: attivo = p_attivo (default true).
                  IF p_auth_user_id IS NOT NULL THEN
                      INSERT INTO anagrafiche.identita_digitali (
                          soggetto_ruolo_id,
                          auth_user_id,
                          ruolo_applicativo,
                          attivo,
                          valido_dal,
                          valido_al
                      )
                      VALUES (
                          v_sr_id,
                          p_auth_user_id,
                          'OPERATORE'::config.ruolo_applicativo,
                          p_attivo,
                          COALESCE(p_valido_dal, CURRENT_DATE),
                          p_valido_al
                      )
                      RETURNING id INTO v_identita_id;

                      -- Step 4: binding SUPER_ADMIN se richiesto, sul profilo
                      -- risolto nei guard (rev 20260923-10: era l'id 9100 cablato).
                      -- Differenza vs v1: predicato boolean diretto invece
                      -- di confronto con enum legacy.
                      IF p_is_super_admin THEN
                          INSERT INTO config.profili_accesso_bindings (
                              profilo_accesso_id,
                              identita_digitale_id,
                              attivo
                          )
                          VALUES (
                              v_profilo_sa,
                              v_identita_id,
                              true
                          );
                      END IF;
                  END IF;

                  RETURN v_ru_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_risorsa_umana_v2(p_soggetto_id uuid, p_qualifica_id integer, p_unita_organizzativa_id integer, p_valido_dal date, p_valido_al date, p_auth_user_id integer, p_is_super_admin boolean, p_attivo boolean)
              IS 'Building block multi-face native (v2 Chunk A Fase 7 2026-04-29). Sostituisce v1 (firma con p_ruolo_sistema config.ruolo_sistema) con p_is_super_admin/p_attivo. Body invariato salvo: identita_digitali.attivo=p_attivo (era hardcoded true) e binding SUPER_ADMIN gated su p_is_super_admin invece di p_ruolo_sistema=ADMIN. v1 droppata in Chunk B post BE migrato. ⛔ Rev 20260923-10: il profilo del binding SUPER_ADMIN si RISOLVE per config.profili_accesso.tipo = SUPER_ADMIN fra i profili attivi (chiave stabile, linee-guida-sql §6d), non piu'' con l''id cablato 9100; se i profili attivi di quel tipo non sono esattamente uno solleva E_CONFIG_MANCANTE prima di ogni scrittura. ⛔ Rev 20261002-01: una persona e'' una risorsa umana sola (uq_risorse_umane_soggetto_ruolo, anche spenta): se il soggetto lo e'' gia'' solleva E_RISORSA_UMANA_GIA_PRESENTE (campo soggetto_id) invece di lasciar arrivare il 23505; vale per ogni chiamante, non solo per fn_crea_operatore_v2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Ripristino: il corpo di 20260923-10 (senza il guard).
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_risorsa_umana_v2(
                  p_soggetto_id            anagrafiche.risorse_umane.soggetto_id%TYPE            DEFAULT NULL,
                  p_qualifica_id           anagrafiche.risorse_umane.qualifica_id%TYPE           DEFAULT NULL,
                  p_unita_organizzativa_id anagrafiche.risorse_umane.unita_organizzativa_id%TYPE DEFAULT NULL,
                  p_valido_dal             anagrafiche.risorse_umane.valido_dal%TYPE             DEFAULT CURRENT_DATE,
                  p_valido_al              anagrafiche.risorse_umane.valido_al%TYPE              DEFAULT NULL,
                  p_auth_user_id           anagrafiche.identita_digitali.auth_user_id%TYPE       DEFAULT NULL,
                  p_is_super_admin         boolean                                               DEFAULT false,
                  p_attivo                 boolean                                               DEFAULT true
              )
               RETURNS anagrafiche.risorse_umane.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_sr_id        anagrafiche.soggetti_ruoli.id%TYPE;
                  v_ru_id        anagrafiche.risorse_umane.id%TYPE;
                  v_identita_id  anagrafiche.identita_digitali.id%TYPE;
                  v_profilo_sa   config.profili_accesso_bindings.profilo_accesso_id%TYPE;
                  v_n_profili_sa integer;
              BEGIN
                  -- =========================================================
                  -- Scopo (v2 multi-face native, Chunk A Fase 7 2026-04-29):
                  --   Crea risorsa_umana + identita_digitali OPERATORE
                  --   (+ binding SUPER_ADMIN se p_is_super_admin=true).
                  --   Niente piu' enum legacy ruolo_sistema; il chiamante
                  --   esprime direttamente "is super admin?" + "attiva?".
                  --
                  -- Body identico a v1 salvo:
                  --   Step 3: identita_digitali.attivo = p_attivo
                  --           (era hardcoded true in v1).
                  --   Step 4: IF p_is_super_admin invece di
                  --           IF p_ruolo_sistema='ADMIN'.
                  -- =========================================================

                  -- Validazione parametri obbligatori
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_soggetto_id'),
                          NULL::uuid, 'Soggetto obbligatorio.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- Guard prerequisiti
                  IF NOT EXISTS (
                      SELECT 1 FROM config.qualifiche
                       WHERE id = p_qualifica_id AND attivo = true
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('qualifica_id', p_qualifica_id),
                          NULL::uuid, 'Qualifica non trovata o non attiva.'
                      );
                  END IF;

                  IF p_unita_organizzativa_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM config.unita_organizzative
                           WHERE id = p_unita_organizzativa_id AND attivo = true
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                              'E_ADMIN_UO_NON_TROVATA',
                              jsonb_build_object('campo', 'unita_organizzativa_id', 'unita_organizzativa_id', p_unita_organizzativa_id),
                              NULL::uuid,
                              'Unita'' organizzativa non trovata o non attiva.'
                          );
                      END IF;
                  END IF;

                  IF p_auth_user_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM django.auth_user WHERE id = p_auth_user_id
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('auth_user_id', p_auth_user_id),
                              NULL::uuid, 'auth_user non trovato.'
                          );
                      END IF;
                  END IF;

                  -- ⛔ Il profilo SUPER_ADMIN si RISOLVE, non si scrive (rev 20260923-10).
                  --   Fino a questa revisione il binding usava l'id cablato 9100: vero solo
                  --   perche' il seed di config.profili_accesso porta l'id esplicito. La
                  --   chiave stabile e' l'enum `tipo` (linee-guida-sql §6d, punto 1: e' la
                  --   stessa dei guard anti-lockout e di script.fn_is_super_admin); `codice`
                  --   e' modificabile e non ha lock.
                  -- ⚠️ Il modello non vieta DUE profili di tipo SUPER_ADMIN, e sceglierne uno
                  --   per id sarebbe un'ambiguita', non una scelta: si pretende esattamente
                  --   un profilo attivo, e si solleva PRIMA di ogni scrittura.
                  IF p_is_super_admin AND p_auth_user_id IS NOT NULL THEN
                      SELECT count(*), min(pa.id)
                        INTO v_n_profili_sa, v_profilo_sa
                        FROM config.profili_accesso pa
                       WHERE pa.tipo = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                         AND pa.attivo;

                      IF v_n_profili_sa <> 1 THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana_v2',
                              'E_CONFIG_MANCANTE',
                              jsonb_build_object('tipo_profilo_accesso', 'SUPER_ADMIN',
                                                 'profili_attivi', v_n_profili_sa),
                              NULL::uuid,
                              'un solo profilo di accesso SUPER_ADMIN attivo (trovati '
                                  || v_n_profili_sa::text || ')'
                          );
                      END IF;
                  END IF;

                  -- Step 1: soggetto_ruolo RIS_UMANA
                  SELECT script.fn_get_or_create_soggetto_ruolo(
                      p_soggetto_id, 'RIS_UMANA'
                  ) INTO v_sr_id;

                  -- Step 2: risorsa umana
                  INSERT INTO anagrafiche.risorse_umane (
                      soggetto_ruolo_id, soggetto_id, qualifica_id,
                      unita_organizzativa_id, valido_dal, valido_al, attivo
                  )
                  VALUES (
                      v_sr_id, p_soggetto_id, p_qualifica_id,
                      p_unita_organizzativa_id, p_valido_dal, p_valido_al, true
                  )
                  RETURNING id INTO v_ru_id;

                  -- Step 3: identita_digitali OPERATORE.
                  -- Differenza vs v1: attivo = p_attivo (default true).
                  IF p_auth_user_id IS NOT NULL THEN
                      INSERT INTO anagrafiche.identita_digitali (
                          soggetto_ruolo_id,
                          auth_user_id,
                          ruolo_applicativo,
                          attivo,
                          valido_dal,
                          valido_al
                      )
                      VALUES (
                          v_sr_id,
                          p_auth_user_id,
                          'OPERATORE'::config.ruolo_applicativo,
                          p_attivo,
                          COALESCE(p_valido_dal, CURRENT_DATE),
                          p_valido_al
                      )
                      RETURNING id INTO v_identita_id;

                      -- Step 4: binding SUPER_ADMIN se richiesto, sul profilo
                      -- risolto nei guard (rev 20260923-10: era l'id 9100 cablato).
                      -- Differenza vs v1: predicato boolean diretto invece
                      -- di confronto con enum legacy.
                      IF p_is_super_admin THEN
                          INSERT INTO config.profili_accesso_bindings (
                              profilo_accesso_id,
                              identita_digitale_id,
                              attivo
                          )
                          VALUES (
                              v_profilo_sa,
                              v_identita_id,
                              true
                          );
                      END IF;
                  END IF;

                  RETURN v_ru_id;
              END;
              $function$;

