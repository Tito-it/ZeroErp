# ------------------------------------------------------------
# anagrafiche.fn_crea_soggetto_pg: LA DATA DI COSTITUZIONE IN CREAZIONE, E
# LA NASCITA DEI DATI SOCIETARI DAL BB
#   Brief: brief-db-dati-societari-in-creazione (§1.2, §3, §3.1)
#
# -- IL DIFETTO --------------------------------------------------------
#   La funzione chiamava il verbo con p_data_costituzione := NULL e non aveva
#   un parametro per riceverla: in creazione la data si perdeva, e il FE la
#   nascondeva (prop showDataCostituzione) per non perderla in silenzio.
#
# -- COSA CAMBIA ------------------------------------------------------
#   * p_data_costituzione IN CODA, DEFAULT NULL, ancorata alla colonna.
#   * Step 3: QUANDO scrivere i dati societari lo decide il BB
#     anagrafiche.fn_scrivi_dati_societari_alla_nascita (20261020-01), lo
#     stesso di fn_crea_soggetto_pf (regola del 2). La regola e' quella di
#     prima piu' la data; ⚠️ un cambio: una sezione passata a una natura NONE
#     non si scarta piu' in silenzio, la rifiuta il guard della natura.
#   * La firma cambia: DROP della vecchia + CREATE (senza, nasce un overload
#     e le chiamate coi soli parametri vecchi diventano ambigue). Firma,
#     RETURNS, DECLARE, DROP e COMMENT ancorati (%TYPE); SECURITY INVOKER.
#     Nessuna clausola SET/COST sul vivo. Corpo dallo YAML 20261018-91,
#     verificato identico al vivo (prosrc) su dbdev e sullo scratch il
#     2026-10-19; cambiano solo la firma, lo Step 3 e il COMMENT.
#   Privilegi: nessun GRANT da rimettere. E' SECURITY INVOKER e non ha mai
#   avuto GRANT espliciti (EXECUTE di default a PUBLIC), come in 20261009-26.
#   ⚠️ CHIAMANTI (censimento 2026-10-19): il backend
#     (SoggettiRepository.crea_soggetto_pg, parametri nominati: resta valido,
#     la data la passera' dopo l'apply, brief §6); i pgTAP per nome
#     (test-fn-scrivi-dati-societari-v1, test-emittenti-fiscali,
#     test-soggetti-sesso-policy-v1); per firma nessuno (test-fn-crea-contatto-v1
#     e dbops/test-character-n-v1 la cercano per nome). Nel DB la chiama
#     anagrafiche.fn_provisiona_dati_di_sviluppo, per nome e coi soli
#     parametri di prima: resta valida (pg_get_functiondef, 2026-10-19).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261020-02-update-fn-crea-soggetto-pg-data-costituzione-mctit.yaml

  - changeSet:
      id: 20261020-02-update-fn-crea-soggetto-pg-data-costituzione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_crea_soggetto_pg: p_data_costituzione in coda (prima il verbo la riceveva NULL); i dati societari alla nascita dal BB anagrafiche.fn_scrivi_dati_societari_alla_nascita. DROP della firma vecchia. Brief: brief-db-dati-societari-in-creazione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_crea_soggetto_pg'
                 AND p.pronargs = 16;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La firma cambia (p_data_costituzione in coda): senza il DROP resterebbe un
              --   overload, e una chiamata coi soli parametri di prima sarebbe ambigua.
              DROP FUNCTION anagrafiche.fn_crea_soggetto_pg(
                  anagrafiche.soggetti.ragione_sociale%TYPE,
                  config.tipi_soggetto_dettaglio.id%TYPE,
                  anagrafiche.contatti.email%TYPE,
                  anagrafiche.soggetti.codice_fiscale%TYPE,
                  anagrafiche.soggetti.partita_iva%TYPE,
                  config.stati.codice_iso2%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  config.tipi_contatti.id%TYPE);

              CREATE FUNCTION anagrafiche.fn_crea_soggetto_pg(
                  p_ragione_sociale              anagrafiche.soggetti.ragione_sociale%TYPE,
                  p_tipo_soggetto_dettaglio_id   config.tipi_soggetto_dettaglio.id%TYPE,
                  p_email                        anagrafiche.contatti.email%TYPE,
                  p_codice_fiscale               anagrafiche.soggetti.codice_fiscale%TYPE           DEFAULT NULL,
                  p_partita_iva                  anagrafiche.soggetti.partita_iva%TYPE              DEFAULT NULL,
                  p_stato_iso2                   config.stati.codice_iso2%TYPE                      DEFAULT NULL,
                  p_forma_giuridica_id           anagrafiche.dati_societari.forma_giuridica_id%TYPE DEFAULT NULL,
                  p_id_prov_iscri_rea            anagrafiche.dati_societari.id_prov_iscri_rea%TYPE  DEFAULT NULL,
                  p_iscrizione_rea               anagrafiche.dati_societari.iscrizione_rea%TYPE     DEFAULT NULL,
                  p_capitale_sociale             anagrafiche.dati_societari.capitale_sociale%TYPE   DEFAULT NULL,
                  p_socio_unico                  anagrafiche.dati_societari.socio_unico%TYPE        DEFAULT NULL,
                  p_liquidazione                 anagrafiche.dati_societari.liquidazione%TYPE       DEFAULT NULL,
                  p_destinatario_fe              anagrafiche.dati_societari.destinatario_fe%TYPE    DEFAULT NULL,
                  p_pec_fatturazione             anagrafiche.dati_societari.pec_fatturazione%TYPE   DEFAULT NULL,
                  p_codice_sdi                   anagrafiche.dati_societari.codice_sdi%TYPE         DEFAULT NULL,
                  p_tipo_contatto_id             config.tipi_contatti.id%TYPE                       DEFAULT NULL,
                  -- ⭐ Rev 20261020-02: in coda (brief-db-dati-societari-in-creazione §3)
                  p_data_costituzione            anagrafiche.dati_societari.data_costituzione%TYPE  DEFAULT NULL
              )
              RETURNS anagrafiche.soggetti.id%TYPE
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- ⭐ Rev 20261009-28 (brief-db-sesso-senza-default): una natura base PF
              --   (privato, ditta individuale) qui si rifiuta. La persona fisica ha la sua
              --   porta, fn_crea_soggetto_pf, che ne riceve nome, cognome e sesso: da qui
              --   una ditta individuale nasceva con la sola ragione sociale.
              DECLARE
                  v_tipo_soggetto_id            config.tipi_soggetto_dettaglio.tipo_soggetto_id%TYPE;
                  v_descrizione_dettaglio       config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_stato_id                    config.stati.id%TYPE;
                  v_stato_iso2_resolved         config.stati.codice_iso2%TYPE;
                  v_dati_societari_policy       config.tipi_soggetto_dettaglio.dati_societari_policy%TYPE;
                  v_tipo_contatto_id            config.tipi_contatti.id%TYPE;
                  v_soggetto_id                 anagrafiche.soggetti.id%TYPE;
              BEGIN
                  -- Validazione parametri obbligatori
                  IF p_ragione_sociale IS NULL OR TRIM(p_ragione_sociale) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_ragione_sociale'),
                          NULL::uuid, 'Ragione sociale obbligatoria.'
                      );
                  END IF;

                  IF p_tipo_soggetto_dettaglio_id IS NULL OR p_tipo_soggetto_dettaglio_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_soggetto_dettaglio_id'),
                          NULL::uuid, 'Tipo soggetto dettaglio obbligatorio e > 0.'
                      );
                  END IF;

                  -- Verifica che il tipo soggetto esista e recupera policy dati societari
                  SELECT tsd.dati_societari_policy, tsd.tipo_soggetto_id, tsd.descrizione
                    INTO v_dati_societari_policy, v_tipo_soggetto_id, v_descrizione_dettaglio
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = p_tipo_soggetto_dettaglio_id;

                  IF v_dati_societari_policy IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id),
                          NULL::uuid,
                          concat('Tipo soggetto dettaglio id=', p_tipo_soggetto_dettaglio_id, ' non trovato.')
                      );
                  END IF;

                  -- ⛔ Rev 20261009-28: una persona fisica qui e' un chiamante che ha
                  --   sbagliato porta (TECNICO, non un dato del form).
                  IF v_tipo_soggetto_id = 'PF' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_SOGGETTO_CREAZIONE_NATURA_ERRATA',
                          jsonb_build_object('tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id,
                                             'tipo_soggetto_id',           v_tipo_soggetto_id),
                          NULL::uuid,
                          COALESCE(v_descrizione_dettaglio, p_tipo_soggetto_dettaglio_id::text),
                          v_tipo_soggetto_id
                      );
                  END IF;

                  IF p_email IS NULL OR TRIM(p_email) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_email'),
                          NULL::uuid, 'Email obbligatoria (usata per contatto default).'
                      );
                  END IF;

                  -- Tipo contatto: fallback al primo dalla tabella se non fornito
                  v_tipo_contatto_id := COALESCE(
                      p_tipo_contatto_id,
                      (SELECT id FROM config.tipi_contatti ORDER BY id LIMIT 1)
                  );

                  IF v_tipo_contatto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_contatto_id'),
                          NULL::uuid,
                          'Tipo contatto obbligatorio e nessun tipo contatto trovato in config.tipi_contatti.'
                      );
                  END IF;

                  -- Stato (nazionalita). Rev 2026-10-18 (D-1 di Tid): quello detto dal
                  -- chiamante, cercato dal BB che rifiuta un codice con piu' stati
                  -- (E_STATO_ISO2_AMBIGUO; prima un SELECT INTO ne prendeva uno a caso);
                  -- altrimenti quello proposto, che valida e non ripiega. ⛔ Il ripiego
                  -- silenzioso a 'IT' e il parametro soggetto_default_stato_iso2 sono
                  -- ritirati.
                  IF NULLIF(btrim(p_stato_iso2), '') IS NOT NULL THEN
                      v_stato_iso2_resolved := upper(btrim(p_stato_iso2));
                      v_stato_id := script.fn_stato_id_da_iso2(v_stato_iso2_resolved, 'anagrafiche.fn_crea_soggetto_pg');
                  ELSE
                      v_stato_id := script.fn_stato_proposto_id('anagrafiche.fn_crea_soggetto_pg');
                  END IF;

                  IF v_stato_id IS NULL THEN
                      -- Fix: E_GENERICO → E_CODICE
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pg',
                          'E_CODICE',
                          jsonb_build_object('codice_iso2', v_stato_iso2_resolved),
                          NULL::uuid,
                          v_stato_iso2_resolved, 'config.stati'
                      );
                  END IF;

                  -- Guard unicita CF/PIVA per stato (se forniti)
                  IF p_codice_fiscale IS NOT NULL AND TRIM(p_codice_fiscale) <> '' THEN
                      IF EXISTS (
                          SELECT 1 FROM anagrafiche.soggetti
                           WHERE stato_id = v_stato_id
                             AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_codice_fiscale))
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_soggetto_pg',
                              'E_ADMIN_CF_DUPLICATO',
                              jsonb_build_object('codice_fiscale', p_codice_fiscale),
                              NULL::uuid, 'Codice fiscale gia'' presente in anagrafica.'
                          );
                      END IF;
                  END IF;

                  IF p_partita_iva IS NOT NULL AND TRIM(p_partita_iva) <> '' THEN
                      IF EXISTS (
                          SELECT 1 FROM anagrafiche.soggetti
                           WHERE stato_id = v_stato_id
                             AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_partita_iva))
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_soggetto_pg',
                              'E_ADMIN_PIVA_DUPLICATA',
                              jsonb_build_object('partita_iva', p_partita_iva),
                              NULL::uuid, 'Partita IVA gia'' presente in anagrafica.'
                          );
                      END IF;
                  END IF;

                  -- Step 1: Creazione soggetto (Persona Giuridica)
                  INSERT INTO anagrafiche.soggetti (
                      ragione_sociale, codice_fiscale, partita_iva,
                      stato_id, tipo_soggetto_dettaglio_id, attivo
                  )
                  VALUES (
                      TRIM(p_ragione_sociale),
                      CASE WHEN p_codice_fiscale IS NOT NULL AND TRIM(p_codice_fiscale) <> ''
                           THEN UPPER(TRIM(p_codice_fiscale))
                           ELSE NULL
                      END,
                      CASE WHEN p_partita_iva IS NOT NULL AND TRIM(p_partita_iva) <> ''
                           THEN UPPER(TRIM(p_partita_iva))
                           ELSE NULL
                      END,
                      v_stato_id, p_tipo_soggetto_dettaglio_id, true
                  )
                  RETURNING id INTO v_soggetto_id;

                  -- Step 2: Creazione contatto default con tipo_contatto_id
                  --         (BB anagrafiche.fn_crea_contatto, rev 2026-10-17)
                  PERFORM anagrafiche.fn_crea_contatto(
                      v_soggetto_id, NULL,
                      jsonb_build_object('tipo_contatto_id', v_tipo_contatto_id,
                                         'nominativo',       TRIM(p_ragione_sociale),
                                         'email',            TRIM(p_email),
                                         'is_default',       true));

                  -- Step 3: i dati societari. ⭐ Rev 20261020-02 (brief-db-dati-societari-in-creazione):
                  --   QUANDO scriverli lo decide il BB della nascita, lo stesso di
                  --   fn_crea_soggetto_pf (regola del 2): policy REQUIRED, o almeno un campo
                  --   con un valore, data di costituzione compresa (prima si perdeva: il verbo
                  --   la riceveva NULL). Una sezione passata a una natura NONE non si scarta
                  --   piu' in silenzio: la rifiuta il guard della natura. Scrive il verbo
                  --   (rev 20261011-01, B-4), e le regole restano nei trigger della tabella.
                  PERFORM anagrafiche.fn_scrivi_dati_societari_alla_nascita(
                      p_soggetto_id        := v_soggetto_id,
                      p_forma_giuridica_id := p_forma_giuridica_id,
                      p_id_prov_iscri_rea  := p_id_prov_iscri_rea,
                      p_iscrizione_rea     := p_iscrizione_rea,
                      p_capitale_sociale   := p_capitale_sociale,
                      p_socio_unico        := p_socio_unico,
                      p_liquidazione       := p_liquidazione,
                      p_destinatario_fe    := p_destinatario_fe,
                      p_pec_fatturazione   := p_pec_fatturazione,
                      p_codice_sdi         := p_codice_sdi,
                      p_data_costituzione  := p_data_costituzione
                  );

                  RETURN v_soggetto_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_soggetto_pg(
                  anagrafiche.soggetti.ragione_sociale%TYPE,
                  config.tipi_soggetto_dettaglio.id%TYPE,
                  anagrafiche.contatti.email%TYPE,
                  anagrafiche.soggetti.codice_fiscale%TYPE,
                  anagrafiche.soggetti.partita_iva%TYPE,
                  config.stati.codice_iso2%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  config.tipi_contatti.id%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE) IS
                  'Crea soggetto PG o ENC + contatto default con tipo_contatto_id + dati societari (se la natura li pretende o se passati). Una natura base PF (privato, ditta individuale) si rifiuta con E_SOGGETTO_CREAZIONE_NATURA_ERRATA: la porta e'' fn_crea_soggetto_pf (rev 20261009-28, brief-db-sesso-senza-default). Il sesso non si scrive: per PG ed ENC e'' NULL (sesso_policy NONE). Fallback tipo contatto: primo da config.tipi_contatti. Stato: p_stato_iso2 se detto (script.fn_stato_id_da_iso2, E_STATO_ISO2_AMBIGUO se indica piu'' stati, E_CODICE se nessuno), altrimenti lo stato proposto (script.fn_stato_proposto_id, rev 2026-10-18: via il ripiego a ''IT'' e il parametro soggetto_default_stato_iso2). Default socio_unico e liquidazione da config.parameters. NON crea indirizzi ne assegna ruoli. Rev 20261011-01: i dati societari si scrivono con anagrafiche.fn_scrivi_dati_societari (B-4); REA, capitale e canale FE non si pretendono piu'' qui (li governano la forma giuridica e il canale, B-6/B-7). Brief: brief-db-dati-fiscali-e-societari-del-soggetto. Rev 2026-10-17: il contatto lo scrive il BB anagrafiche.fn_crea_contatto (regola del 2, brief-db-processi-accensione-per-ambiente 2b-1 lotto 3); comportamento invariato. Rev 20261020-02 (brief-db-dati-societari-in-creazione): p_data_costituzione in coda; quando scrivere i dati societari lo decide anagrafiche.fn_scrivi_dati_societari_alla_nascita, lo stesso BB di fn_crea_soggetto_pf: policy REQUIRED o almeno un campo con un valore; una sezione passata a una natura NONE la rifiuta il guard della natura invece di essere scartata.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only, come 20261009-26: il corpo di prima e' quello di 20261018-91.
              SELECT 1;
