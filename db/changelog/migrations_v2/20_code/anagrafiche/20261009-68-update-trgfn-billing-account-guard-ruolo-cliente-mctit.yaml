# IL BILLING ACCOUNT E' DI UN RUOLO CLIENTE
#   anagrafiche.trgfn_billing_account_guard_soggetto_coerenza_istanza:
#   + il TIPO del ruolo, dal BB script.fn_guard_soggetto_ruolo(NULL, sr, 'CL').
#   Brief: brief-db-esecutivi-ba-coppia (§4.1, D-7 punti 1 e 5)
#
# -- PERCHE' --------------------------------------------------------
#   Le guide dicono «Ruolo CLIENTE -> ... -> Billing Account», ma nel contratto
#   la FK va a soggetti_ruoli qualunque e questo guard confronta il SOGGETTO,
#   non il tipo: un BA poteva NASCERE sul ruolo FORNITORE del soggetto giusto.
#   Il controllo del tipo esiste gia' ed e' un building block, che dieci
#   specializzazioni chiamano (clienti, fornitori, vettori, gestori...): il BA
#   era l'unico oggetto legato a un ruolo CLIENTE che non lo faceva. Si chiama
#   il BB, non si scrive un guard nuovo.
#
# -- PERCHE' QUI E NON IN UN TRIGGER SUO --------------------------------
#   E' la stessa domanda — «il ruolo del BA e' quello giusto per la sua
#   istanza?» — e questo e' gia' il guard che la pone, sugli stessi eventi
#   (INSERT, UPDATE OF istanza_utility_id, soggetto_ruolo_id). Prima il
#   soggetto (frase specifica, E_BA_SOGGETTO_INCOERENTE_ISTANZA), poi il tipo
#   (frase del BB, E_SOGGETTI_RUOLI).
#
# -- L'ORDINE CON IL LOCK ------------------------------------------
#   Da questo giro soggetto_ruolo_id e' bloccato (automation_lock_columns,
#   E_BA_ISTANZA_IMMUTABILE). Il trigger di questo guard si chiamava
#   ..._a10_guard_... e veniva PRIMA di ..._a10_lock_columns_upd: ogni cambio
#   di ruolo sarebbe uscito con la frase della coerenza, e il lock non avrebbe
#   mai parlato. Il trigger passa in fascia _a20_ in 20261009-69.
#
# -- LE RIGHE GIA' SCRITTE -----------------------------------------
#   Il guard non rilegge le righe che ci sono. preCondition: zero BA su un
#   ruolo che non e' CLIENTE, e zero BA il cui soggetto non e' quello
#   dell'istanza (expectedResult 0; un database vuoto la soddisfa).
#
# Corpo: dalla doc auto-gen (docs/it/dbzero/anagrafiche/funzioni/), aggiunta
# del solo punto 2.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261009-68-update-trgfn-billing-account-guard-ruolo-cliente-mctit.yaml

  - changeSet:
      id: 20261009-68-update-trgfn-billing-account-guard-ruolo-cliente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.trgfn_billing_account_guard_soggetto_coerenza_istanza: oltre al soggetto, il
        tipo del ruolo (CLIENTE) dal BB script.fn_guard_soggetto_ruolo. Brief:
        brief-db-esecutivi-ba-coppia (D-7).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*)
                FROM anagrafiche.billing_account ba
                JOIN anagrafiche.soggetti_ruoli sr ON sr.id = ba.soggetto_ruolo_id
                JOIN config.tipi_ruoli tr ON tr.id = sr.tipo_ruolo_id
                JOIN anagrafiche.istanze_utilities iu ON iu.id = ba.istanza_utility_id
               WHERE tr.codice_interno IS DISTINCT FROM 'CL'
                  OR sr.soggetto_id IS DISTINCT FROM iu.soggetto_id;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_billing_account_guard_soggetto_coerenza_istanza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il ruolo del billing account e' quello giusto per la
              --   sua istanza:
              --   1. il soggetto raggiunto via NEW.soggetto_ruolo_id coincide
              --      con il soggetto dell'istanza (NEW.istanza_utility_id);
              --   2. il ruolo e' di tipo CLIENTE (rev 2026-10-09, D-7 di
              --      brief-db-esecutivi-ba-coppia): dal BB
              --      script.fn_guard_soggetto_ruolo, come le specializzazioni.
              -- Allinea il vincolo DB al modello documentato in
              -- istanze_utilities §7.3 ("il cliente vive dentro l'istanza").
              -- ⚠️ Gira in fascia _a20_, DOPO il lock di colonna: su UPDATE
              --   di soggetto_ruolo_id o istanza_utility_id deve parlare
              --   l'immutabilita' (E_BA_ISTANZA_IMMUTABILE), non la coerenza.
              DECLARE
                  v_soggetto_ruolo  anagrafiche.soggetti_ruoli.soggetto_id%TYPE;
                  v_soggetto_istanza anagrafiche.istanze_utilities.soggetto_id%TYPE;
              BEGIN
                  SELECT sr.soggetto_id
                    INTO v_soggetto_ruolo
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = NEW.soggetto_ruolo_id;

                  SELECT iu.soggetto_id
                    INTO v_soggetto_istanza
                    FROM anagrafiche.istanze_utilities iu
                   WHERE iu.id = NEW.istanza_utility_id;

                  -- 1. Il soggetto.
                  -- Difensivo: se uno dei due lookup non risolve, le FK
                  -- esistenti gestiranno l'errore strutturale. Qui il
                  -- guard si limita al confronto quando entrambi sono
                  -- popolati (caso normale grazie ai NOT NULL).
                  IF v_soggetto_ruolo IS NOT NULL
                     AND v_soggetto_istanza IS NOT NULL
                     AND v_soggetto_ruolo IS DISTINCT FROM v_soggetto_istanza
                  THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_BA_SOGGETTO_INCOERENTE_ISTANZA',
                          jsonb_build_object(
                              'campo', 'istanza_utility_id',
                              'billing_account_id',  NEW.id,
                              'codice',              NEW.codice,
                              'istanza_utility_id',  NEW.istanza_utility_id,
                              'soggetto_ruolo_id',   NEW.soggetto_ruolo_id,
                              'ba_soggetto_id',      v_soggetto_ruolo,
                              'istanza_soggetto_id', v_soggetto_istanza
                          ),
                          NEW.tx_id,
                          NEW.codice,
                          v_soggetto_ruolo::text,
                          v_soggetto_istanza::text
                      );
                  END IF;

                  -- 2. Il tipo: un billing account e' di un ruolo CLIENTE.
                  --   Il soggetto l'ha gia' guardato il punto 1, quindi al BB
                  --   si passa NULL: qui serve solo il tipo.
                  PERFORM script.fn_guard_soggetto_ruolo(
                      p_soggetto_id       := NULL,
                      p_soggetto_ruolo_id := NEW.soggetto_ruolo_id,
                      p_cd_int_ruolo      := 'CL');

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_billing_account_guard_soggetto_coerenza_istanza()
              IS 'Guard del ruolo del billing account: (1) soggetti_ruoli.soggetto_id = istanze_utilities.soggetto_id, E_BA_SOGGETTO_INCOERENTE_ISTANZA; (2) rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-7): il ruolo e'' di tipo CLIENTE, dal BB script.fn_guard_soggetto_ruolo(NULL, sr, ''CL''), E_SOGGETTI_RUOLI — prima un BA poteva nascere sul ruolo FORNITORE del soggetto giusto, perche'' si confrontava il soggetto e non il tipo. Trigger in fascia _a20_ (dal 20261009-69): dopo il lock di colonna, che su UPDATE del ruolo o dell''istanza deve parlare per primo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' quello di 20260502-16: si rimette a mano
              -- dalla doc auto-gen se serve tornare indietro.
              SELECT 1;
