# anagrafiche.fn_crea_soggetto_pf: LA NATURA LA SCEGLIE IL CHIAMANTE,
# IL SESSO NON SI INVENTA
#   Brief: brief-db-sesso-senza-default (§2, §3 D4, §4.2 punto 1)
#
# -- I DUE DIFETTI ------------------------------------------------------
#   1. COALESCE(p_sesso, 'M'): una chiamata senza sesso creava un uomo.
#   2. Natura PR cablata e nessuna P.IVA: il backend chiama questa funzione
#      per ogni natura PF, quindi una DITTA INDIVIDUALE scelta nel form
#      nasceva PRIVATO, e la partita IVA andava persa senza errore.
#
# -- COSA CAMBIA ------------------------------------------------------
#   * Firma: due parametri IN CODA, p_tipo_soggetto_dettaglio_id e
#     p_partita_iva. Il dettaglio e' OBBLIGATORIO (decisione di Tid,
#     2026-10-09): la natura non si inventa, come il sesso. Il guard e' nel
#     corpo, con DEFAULT NULL in firma, come gli altri obbligatori.
#     ⛔ Una natura base diversa da PF e' un chiamante che ha sbagliato
#     porta: E_SOGGETTO_CREAZIONE_NATURA_ERRATA (TECNICO).
#   * Il sesso passa com'e'. Nessun controllo qui: quando serve lo decide
#     la natura (sesso_policy) nel guard del 20261009-25, sede unica.
#   * La firma cambia: DROP della vecchia + CREATE, altrimenti resta un
#     overload col PR cablato. Firma, RETURNS, DROP e COMMENT con %TYPE
#     (dallo YAML 20260331-01: la doc auto-generata li scioglie),
#     SECURITY INVOKER esplicito. Corpo vivo dalla doc auto-generata.
#   ⚠️ CHIAMANTI DA ADEGUARE (censimento 2026-10-09):
#     * anagrafiche.fn_crea_operatore_v2 (flusso A) -> 20261009-27;
#     * backend: SoggettiRepository.crea_soggetto_pf, che oggi non passa ne'
#       il dettaglio ne' la P.IVA: dopo l'apply la creazione di una PF dal
#       backend si ferma con E_ADMIN_VALIDAZIONE finche' il BE non e'
#       allineato (brief §6, richiesta al team BE);
#     * pgTAP: i file che la chiamano (brief §4.3).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261009-26-update-fn-crea-soggetto-pf-natura-e-sesso-mctit.yaml

  - changeSet:
      id: 20261009-26-update-fn-crea-soggetto-pf-natura-e-sesso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_crea_soggetto_pf: p_tipo_soggetto_dettaglio_id (obbligatorio, natura base PF) e
        p_partita_iva in coda; via il PR cablato e il COALESCE(p_sesso, 'M'). DROP della firma vecchia.
        Brief: brief-db-sesso-senza-default.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_crea_soggetto_pf'
                 AND p.pronargs = 9;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La firma cambia (due parametri in coda): senza il DROP resterebbe un
              --   overload con PR cablato e COALESCE(p_sesso, 'M').
              DROP FUNCTION anagrafiche.fn_crea_soggetto_pf(
                  anagrafiche.soggetti.cognome%TYPE, anagrafiche.soggetti.nome%TYPE,
                  anagrafiche.soggetti.codice_fiscale%TYPE, anagrafiche.contatti.email%TYPE,
                  anagrafiche.soggetti.data_nascita%TYPE, anagrafiche.soggetti.sesso%TYPE,
                  config.stati.codice_iso2%TYPE, anagrafiche.soggetti.comune_id%TYPE,
                  config.tipi_contatti.id%TYPE);

              CREATE FUNCTION anagrafiche.fn_crea_soggetto_pf(
                  p_cognome                     anagrafiche.soggetti.cognome%TYPE                 DEFAULT NULL,
                  p_nome                        anagrafiche.soggetti.nome%TYPE                    DEFAULT NULL,
                  p_codice_fiscale              anagrafiche.soggetti.codice_fiscale%TYPE          DEFAULT NULL,
                  p_email                       anagrafiche.contatti.email%TYPE                   DEFAULT NULL,
                  p_data_nascita                anagrafiche.soggetti.data_nascita%TYPE            DEFAULT NULL,
                  p_sesso                       anagrafiche.soggetti.sesso%TYPE                   DEFAULT NULL,
                  p_stato_iso2                  config.stati.codice_iso2%TYPE                     DEFAULT NULL,
                  p_comune_nascita_id           anagrafiche.soggetti.comune_id%TYPE               DEFAULT NULL,
                  p_tipo_contatto_id            config.tipi_contatti.id%TYPE                      DEFAULT NULL,
                  -- ⭐ Rev 20261009-26: in coda (brief-db-sesso-senza-default §4.2)
                  p_tipo_soggetto_dettaglio_id  config.tipi_soggetto_dettaglio.id%TYPE            DEFAULT NULL,
                  p_partita_iva                 anagrafiche.soggetti.partita_iva%TYPE             DEFAULT NULL
              )
               RETURNS anagrafiche.soggetti.id%TYPE
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: crea un soggetto PERSONA FISICA (natura base PF: privato PR o
              --   ditta individuale DI) + il contatto di default. NON crea indirizzi.
              -- ⭐ Rev 20261009-26 (brief-db-sesso-senza-default):
              --   - la natura di dettaglio la sceglie il chiamante
              --     (p_tipo_soggetto_dettaglio_id, obbligatorio): prima era PR cablato, e
              --     una ditta individuale scelta nel form nasceva privato, senza P.IVA;
              --   - p_partita_iva: per la DI la pretende gia'
              --     trgfn_soggetti_guard_cf_piva_obbligatori;
              --   - il sesso passa cosi' com'e': via il COALESCE(p_sesso, 'M'). Se serve
              --     lo decide la natura (sesso_policy), nel guard
              --     trgfn_soggetti_guard_sesso_policy: una sede sola per la regola.
              -- =========================================================
              DECLARE
                  v_tipo_soggetto_id            config.tipi_soggetto_dettaglio.tipo_soggetto_id%TYPE;
                  v_descrizione_dettaglio       config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_stato_id                    config.stati.id%TYPE;
                  v_stato_iso2_resolved         config.stati.codice_iso2%TYPE;
                  v_tipo_contatto_id            config.tipi_contatti.id%TYPE;
                  v_soggetto_id                 anagrafiche.soggetti.id%TYPE;
              BEGIN
                  -- Validazione parametri obbligatori
                  IF p_cognome IS NULL OR TRIM(p_cognome) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_cognome'),
                          NULL::uuid, 'Cognome obbligatorio.'
                      );
                  END IF;

                  IF p_nome IS NULL OR TRIM(p_nome) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_nome'),
                          NULL::uuid, 'Nome obbligatorio.'
                      );
                  END IF;

                  IF p_codice_fiscale IS NULL OR TRIM(p_codice_fiscale) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_codice_fiscale'),
                          NULL::uuid, 'Codice fiscale obbligatorio.'
                      );
                  END IF;

                  IF p_email IS NULL OR TRIM(p_email) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_email'),
                          NULL::uuid, 'Email obbligatoria (usata per contatto default).'
                      );
                  END IF;

                  -- Tipo contatto: fallback al primo dalla tabella se non fornito
                  v_tipo_contatto_id := COALESCE(
                      p_tipo_contatto_id,
                      (SELECT id FROM config.tipi_contatti ORDER BY id LIMIT 1)
                  );

                  IF v_tipo_contatto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_contatto_id'),
                          NULL::uuid,
                          'Tipo contatto obbligatorio e nessun tipo contatto trovato in config.tipi_contatti.'
                      );
                  END IF;

                  -- Natura di dettaglio: obbligatoria, e di natura base PF
                  IF p_tipo_soggetto_dettaglio_id IS NULL OR p_tipo_soggetto_dettaglio_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_soggetto_dettaglio_id'),
                          NULL::uuid, 'Tipo soggetto obbligatorio.'
                      );
                  END IF;

                  SELECT tsd.tipo_soggetto_id, tsd.descrizione
                    INTO v_tipo_soggetto_id, v_descrizione_dettaglio
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = p_tipo_soggetto_dettaglio_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_tipo_soggetto_dettaglio_id',
                                             'p_tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id),
                          NULL::uuid,
                          concat('Tipo soggetto dettaglio id=', p_tipo_soggetto_dettaglio_id, ' non trovato.')
                      );
                  END IF;

                  -- ⛔ Una societa' o un ente qui e' un chiamante che ha sbagliato porta
                  --   (la porta giusta e' fn_crea_soggetto_pg): TECNICO, non un dato del form.
                  IF v_tipo_soggetto_id <> 'PF' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_SOGGETTO_CREAZIONE_NATURA_ERRATA',
                          jsonb_build_object('tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id,
                                             'tipo_soggetto_id',           v_tipo_soggetto_id),
                          NULL::uuid,
                          COALESCE(v_descrizione_dettaglio, p_tipo_soggetto_dettaglio_id::text),
                          v_tipo_soggetto_id
                      );
                  END IF;

                  -- Stato (nazionalita) — default da config.parameters
                  v_stato_iso2_resolved := COALESCE(
                      p_stato_iso2,
                      (SELECT default_value FROM config.parameters
                        WHERE code = 'soggetto_default_stato_iso2'),
                      'IT'
                  );

                  SELECT id INTO v_stato_id
                  FROM config.stati
                  WHERE codice_iso2 = v_stato_iso2_resolved;

                  IF v_stato_id IS NULL THEN
                      -- Fix: E_GENERICO → E_CODICE
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_CODICE',
                          jsonb_build_object('codice_iso2', v_stato_iso2_resolved),
                          NULL::uuid,
                          v_stato_iso2_resolved, 'config.stati'
                      );
                  END IF;

                  -- Guard unicita CF per stato
                  IF EXISTS (
                      SELECT 1 FROM anagrafiche.soggetti
                       WHERE stato_id = v_stato_id
                         AND id_fiscale_univoco_cf_piva = UPPER(TRIM(p_codice_fiscale))
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_soggetto_pf',
                          'E_ADMIN_CF_DUPLICATO',
                          jsonb_build_object('codice_fiscale', p_codice_fiscale),
                          NULL::uuid, 'Codice fiscale gia'' presente in anagrafica.'
                      );
                  END IF;

                  -- Step 1: Creazione soggetto (Persona Fisica)
                  -- Il sesso passa com'e': se la natura lo pretende e manca, lo rifiuta
                  --   trgfn_soggetti_guard_sesso_policy (E_SESSO_OBBLIGATORIO, campo sesso).
                  INSERT INTO anagrafiche.soggetti (
                      cognome, nome, codice_fiscale, partita_iva, data_nascita, sesso,
                      stato_id, tipo_soggetto_dettaglio_id, comune_id, attivo
                  )
                  VALUES (
                      TRIM(p_cognome), TRIM(p_nome),
                      UPPER(TRIM(p_codice_fiscale)),
                      NULLIF(UPPER(TRIM(p_partita_iva)), ''),
                      p_data_nascita, p_sesso,
                      v_stato_id, p_tipo_soggetto_dettaglio_id,
                      p_comune_nascita_id, true
                  )
                  RETURNING id INTO v_soggetto_id;

                  -- Step 2: Creazione contatto default con tipo_contatto_id
                  INSERT INTO anagrafiche.contatti (
                      soggetto_id, tipo_contatto_id, nominativo, email, is_default
                  )
                  VALUES (
                      v_soggetto_id,
                      v_tipo_contatto_id,
                      TRIM(p_cognome) || ' ' || TRIM(p_nome),
                      TRIM(p_email),
                      true
                  );

                  RETURN v_soggetto_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_soggetto_pf(
                  anagrafiche.soggetti.cognome%TYPE, anagrafiche.soggetti.nome%TYPE,
                  anagrafiche.soggetti.codice_fiscale%TYPE, anagrafiche.contatti.email%TYPE,
                  anagrafiche.soggetti.data_nascita%TYPE, anagrafiche.soggetti.sesso%TYPE,
                  config.stati.codice_iso2%TYPE, anagrafiche.soggetti.comune_id%TYPE,
                  config.tipi_contatti.id%TYPE, config.tipi_soggetto_dettaglio.id%TYPE,
                  anagrafiche.soggetti.partita_iva%TYPE) IS
                  'Crea un soggetto PERSONA FISICA (natura base PF: privato PR o ditta individuale DI, scelta dal chiamante con p_tipo_soggetto_dettaglio_id, obbligatorio) + contatto default con tipo_contatto_id. Una natura che non e'' PF si rifiuta con E_SOGGETTO_CREAZIONE_NATURA_ERRATA (porta giusta: fn_crea_soggetto_pg). p_partita_iva per la DI (la pretende il guard su CF e P.IVA). Il sesso passa com''e'', senza default: quando serve lo decide config.tipi_soggetto_dettaglio.sesso_policy nel guard trgfn_soggetti_guard_sesso_policy (PR obbligatorio, DI facoltativo). Fallback tipo contatto: primo da config.tipi_contatti. Default stato_iso2 da config.parameters. Guard CF univoco. NON crea indirizzo. Rev 20261009-26, brief-db-sesso-senza-default.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: il corpo di prima e' quello di 20260331-01.
              SELECT 1;
