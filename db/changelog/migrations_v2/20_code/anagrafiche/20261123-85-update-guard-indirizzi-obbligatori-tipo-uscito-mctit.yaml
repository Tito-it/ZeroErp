# I guard degli indirizzi obbligatori, dal lato degli indirizzi: si giudica
#   la riga che esce, non tutto il titolare.
#   anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(ruolo, tx_id, tipo che esce)
#   anagrafiche.fn_guard_indirizzi_obbligatori_soggetto(soggetto, tx_id, tipo che esce)
#   anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo()
#   anagrafiche.trgfn_indirizzi_soggetti_guard_obbligatori_soggetto()
#   D-T7a-1 di Tid (2026-11-24), brief-db-revisione-anagrafiche §21 (S48).
#
# -- IL DIFETTO -------------------------------------------------------------------
#   Cancellare un indirizzo, o cambiarne il tipo, rigiudicava TUTTO il
#   titolare: a un soggetto o un ruolo a cui una riga di matrice nata dopo
#   chiede un indirizzo che non ha, non si cancellava nemmeno un indirizzo che
#   nessuno chiede. I due trigger passavano anche NULL come tx_id: il rifiuto
#   si loggava senza la transazione.
#
# -- LA FORMA (linee-guida-sql §5f) ---------------------------------------------------
#   Ai due guard un parametro in coda, il tipo dell'indirizzo che esce, con
#   DEFAULT NULL che riproduce il giudizio di prima (tutte le righe): lo usano
#   alla nascita del titolare e al cambio di natura (i trigger dei titolari e
#   anagrafiche.trgfn_soggetti_guard_obbligatori_ruoli, che non cambiano). Col
#   tipo detto, solo le righe che quel tipo soddisfaceva, come tipo o come
#   ripiego: il titolare perde una cosa che gli era chiesta solo se l'indirizzo
#   che esce era quello che la dava. La firma cambia: DROP della vecchia, poi
#   CREATE; i chiamanti sono plpgsql (nessuna dipendenza in pg_depend) e
#   restano validi. Il BE non li chiama (origin/dev/backend-tid, 2026-11-24).
#   I due trigger degli indirizzi passano il tipo che esce e OLD.tx_id.
#   Corpi da 20261116-41, -42, -35, -36 (= prosrc di dbdev, 2026-11-24);
#   COMMENT dal catalogo, con la frase del tipo che esce.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261123-85-update-guard-indirizzi-obbligatori-tipo-uscito-mctit.yaml

  - changeSet:
      id: 20261123-85-update-guard-indirizzi-obbligatori-tipo-uscito
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I guard degli indirizzi obbligatori col tipo che esce (in coda, DEFAULT NULL): dal lato degli
        indirizzi si giudica la riga che esce, non tutto il titolare; i trigger passano anche OLD.tx_id.
        D-T7a-1, brief-db-revisione-anagrafiche §21.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE, anagrafiche.soggetti_ruoli.tx_id%TYPE);
              DROP FUNCTION IF EXISTS anagrafiche.fn_guard_indirizzi_obbligatori_soggetto(
                  anagrafiche.soggetti.id%TYPE, anagrafiche.soggetti.tx_id%TYPE);
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(
                  p_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  p_tx_id             anagrafiche.soggetti_ruoli.tx_id%TYPE,
                  p_tipo_uscito       anagrafiche.indirizzi.tipo_indirizzo_id%TYPE DEFAULT NULL)
              RETURNS void
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              DECLARE
                  c_chi           CONSTANT text := 'anagrafiche.fn_guard_indirizzi_obbligatori_ruolo';
                  v_tipo_ruolo_id anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE;
                  v_natura_id     anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_tipo_id       config.tipi_ruolo_tipi_indirizzo.tipo_indirizzo_id%TYPE;
                  v_ripiego_id    config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id%TYPE;
                  v_ruolo_nome    config.tipi_ruoli.descrizione%TYPE;
              BEGIN
                  IF p_soggetto_ruolo_id IS NULL OR p_soggetto_ruolo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          p_tx_id,
                          c_chi,
                          'il ruolo da controllare non e'' indicato');
                  END IF;

                  SELECT sr.tipo_ruolo_id, s.tipo_soggetto_dettaglio_id
                    INTO v_tipo_ruolo_id, v_natura_id
                    FROM anagrafiche.soggetti_ruoli sr
                    JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                   WHERE sr.id = p_soggetto_ruolo_id;

                  -- Il ruolo non c'e' piu': cancellato nella stessa transazione,
                  -- insieme ai suoi indirizzi. Niente da completare.
                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  SELECT m.tipo_indirizzo_id, m.ripiego_tipo_indirizzo_id
                    INTO v_tipo_id, v_ripiego_id
                    FROM anagrafiche.fn_indirizzi_obbligatori_mancanti_ruolo(
                             p_soggetto_ruolo_id, v_natura_id, script.fn_data_operativa()) m
                   -- Con il tipo che esce, solo le righe che lui soddisfaceva.
                   WHERE p_tipo_uscito IS NULL
                      OR p_tipo_uscito IN (m.tipo_indirizzo_id, m.ripiego_tipo_indirizzo_id)
                   ORDER BY m.tipo_indirizzo_id
                   LIMIT 1;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  SELECT tr.descrizione INTO v_ruolo_nome
                    FROM config.tipi_ruoli tr
                   WHERE tr.id = v_tipo_ruolo_id;

                  -- Valori per descrizione, nell'ordine della frase: il ruolo,
                  -- poi il tipo richiesto col suo ripiego. Gli id nel contesto.
                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', c_chi, 'E_INDIRIZZO_OBBLIGATORIO_MANCANTE',
                      jsonb_build_object(
                          'soggetto_ruolo_id',          p_soggetto_ruolo_id,
                          'tipo_ruolo_id',              v_tipo_ruolo_id,
                          'tipo_soggetto_dettaglio_id', v_natura_id,
                          'tipo_indirizzo_id_required', v_tipo_id,
                          'fallback_tipo_indirizzo_id', v_ripiego_id),
                      p_tx_id,
                      COALESCE(v_ruolo_nome, v_tipo_ruolo_id::text),
                      COALESCE(anagrafiche.fn_nomi_tipo_indirizzo_richiesto(v_tipo_id, v_ripiego_id),
                               v_tipo_id::text));
              END;
              $function$;


              COMMENT ON FUNCTION anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE,
                  anagrafiche.soggetti_ruoli.tx_id%TYPE,
                  anagrafiche.indirizzi.tipo_indirizzo_id%TYPE)
              IS 'Guard: il ruolo deve avere, fra i suoi indirizzi (anagrafiche.indirizzi, istanze comprese), ogni tipo che il requisito del ruolo chiede (anagrafiche.fn_indirizzi_obbligatori_ruolo, sul tipo di ruolo e sulla natura del soggetto, il giorno di script.fn_data_operativa()), oppure il suo ripiego: i mancanti li dice anagrafiche.fn_indirizzi_obbligatori_mancanti_ruolo, sulla natura del soggetto. Al primo mancante, per tipo richiesto, E_INDIRIZZO_OBBLIGATORIO_MANCANTE coi valori della frase nell''ordine tipo di ruolo e tipo richiesto col ripiego, per descrizione (anagrafiche.fn_nomi_tipo_indirizzo_richiesto); gli id nel contesto. Ruolo che non esiste (cancellato nella stessa transazione): tace. Id NULL o non positivo: E_SCRIPT_CHIAMATA_NON_VALIDA. Il tx_id va al log dell''errore. p_tipo_uscito (in coda, DEFAULT NULL): il tipo dell''indirizzo che esce, per cancellazione o cambio di tipo. Se e'' detto si giudicano solo le righe che quel tipo soddisfaceva (come tipo o come ripiego): una riga obbligatoria nata dopo, che il titolare non ha mai avuto, non ferma la cancellazione di un altro indirizzo (D-T7a-1). NULL: tutte le righe, alla nascita del titolare e al cambio di natura. Sede unica del controllo del layer RUOLO: la chiamano i constraint trigger differiti di anagrafiche.soggetti_ruoli (anagrafiche.trgfn_soggetti_ruoli_guard_indirizzi_required), di anagrafiche.indirizzi (anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo) e di anagrafiche.soggetti al cambio di natura (anagrafiche.trgfn_soggetti_guard_obbligatori_ruoli). Gemello di anagrafiche.fn_guard_indirizzi_obbligatori_soggetto, il layer SOGGETTO. SECURITY INVOKER.';
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION anagrafiche.fn_guard_indirizzi_obbligatori_soggetto(
                  p_soggetto_id anagrafiche.soggetti.id%TYPE,
                  p_tx_id       anagrafiche.soggetti.tx_id%TYPE,
                  p_tipo_uscito anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE DEFAULT NULL)
              RETURNS void
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              DECLARE
                  c_chi         CONSTANT text := 'anagrafiche.fn_guard_indirizzi_obbligatori_soggetto';
                  v_natura_id   anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_tipo_id     config.tipi_soggetto_dettaglio_tipi_indirizzo.tipo_indirizzo_id%TYPE;
                  v_ripiego_id  config.tipi_soggetto_dettaglio_tipi_indirizzo.fallback_tipo_indirizzo_id%TYPE;
                  v_natura_nome config.tipi_soggetto_dettaglio.descrizione%TYPE;
              BEGIN
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('soggetto_id', p_soggetto_id),
                          p_tx_id,
                          c_chi,
                          'il soggetto da controllare non e'' indicato');
                  END IF;

                  SELECT s.tipo_soggetto_dettaglio_id
                    INTO v_natura_id
                    FROM anagrafiche.soggetti s
                   WHERE s.id = p_soggetto_id;

                  -- Il soggetto non c'e' piu' (cancellato nella stessa
                  -- transazione), o non ha natura: niente da pretendere.
                  IF NOT FOUND OR v_natura_id IS NULL THEN
                      RETURN;
                  END IF;

                  SELECT m.tipo_indirizzo_id, m.ripiego_tipo_indirizzo_id
                    INTO v_tipo_id, v_ripiego_id
                    FROM anagrafiche.fn_indirizzi_obbligatori_mancanti_soggetto(
                             p_soggetto_id, v_natura_id, script.fn_data_operativa()) m
                   -- Con il tipo che esce, solo le righe che lui soddisfaceva.
                   WHERE p_tipo_uscito IS NULL
                      OR p_tipo_uscito IN (m.tipo_indirizzo_id, m.ripiego_tipo_indirizzo_id)
                   ORDER BY m.tipo_indirizzo_id
                   LIMIT 1;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  SELECT COALESCE(tsd.descrizione, tsd.codice_interno) INTO v_natura_nome
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = v_natura_id;

                  -- Codice PROPRIO di questo layer (giro 3). Valori per
                  -- descrizione, nell'ordine della frase: la natura, poi il tipo
                  -- richiesto col suo ripiego. Gli id nel contesto.
                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', c_chi, 'E_INDIRIZZO_OBBLIGATORIO_MANCANTE_TIPO_SOGGETTO',
                      jsonb_build_object(
                          'soggetto_id',                p_soggetto_id,
                          'tipo_soggetto_dettaglio_id', v_natura_id,
                          'tipo_indirizzo_id_required', v_tipo_id,
                          'fallback_tipo_indirizzo_id', v_ripiego_id),
                      p_tx_id,
                      COALESCE(v_natura_nome, v_natura_id::text),
                      COALESCE(anagrafiche.fn_nomi_tipo_indirizzo_richiesto(v_tipo_id, v_ripiego_id),
                               v_tipo_id::text));
              END;
              $function$;


              COMMENT ON FUNCTION anagrafiche.fn_guard_indirizzi_obbligatori_soggetto(
                  anagrafiche.soggetti.id%TYPE,
                  anagrafiche.soggetti.tx_id%TYPE,
                  anagrafiche.indirizzi_soggetti.tipo_indirizzo_id%TYPE)
              IS 'Guard: il soggetto deve avere, fra i suoi indirizzi (anagrafiche.indirizzi_soggetti), ogni tipo obbligatorio per la sua natura il giorno di script.fn_data_operativa() (anagrafiche.fn_tipo_indirizzo_obbligatorio_per_natura), oppure il ripiego della riga, se la natura lo ammette: i mancanti li dice anagrafiche.fn_indirizzi_obbligatori_mancanti_soggetto, sulla natura del soggetto. Al primo mancante, per tipo, E_INDIRIZZO_OBBLIGATORIO_MANCANTE_TIPO_SOGGETTO coi valori della frase nell''ordine natura e tipo richiesto col ripiego, per descrizione (anagrafiche.fn_nomi_tipo_indirizzo_richiesto); gli id nel contesto. Natura NULL, o soggetto che non esiste (cancellato nella stessa transazione): tace. Id NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Il tx_id va al log dell''errore. p_tipo_uscito (in coda, DEFAULT NULL): il tipo dell''indirizzo che esce, per cancellazione o cambio di tipo. Se e'' detto si giudicano solo le righe che quel tipo soddisfaceva (come tipo o come ripiego): una riga obbligatoria nata dopo, che il titolare non ha mai avuto, non ferma la cancellazione di un altro indirizzo (D-T7a-1). NULL: tutte le righe, alla nascita del titolare e al cambio di natura. Sede unica del controllo del layer SOGGETTO: la chiamano i constraint trigger differiti di anagrafiche.soggetti (anagrafiche.trgfn_soggetti_guard_indirizzi_required) e di anagrafiche.indirizzi_soggetti (anagrafiche.trgfn_indirizzi_soggetti_guard_obbligatori_soggetto). Gemello di anagrafiche.fn_guard_indirizzi_obbligatori_ruolo, il layer RUOLO. SECURITY INVOKER.';
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              BEGIN
                  IF TG_OP = 'UPDATE'
                     AND OLD.soggetto_ruolo_id IS NOT DISTINCT FROM NEW.soggetto_ruolo_id
                     AND OLD.tipo_indirizzo_id IS NOT DISTINCT FROM NEW.tipo_indirizzo_id THEN
                      RETURN NULL;
                  END IF;

                  -- Si giudica solo cio' che l'indirizzo che esce soddisfaceva (D-T7a-1).
                  PERFORM anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(
                      OLD.soggetto_ruolo_id, OLD.tx_id, OLD.tipo_indirizzo_id);

                  RETURN NULL;
              END;
              $function$;


              COMMENT ON FUNCTION anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo()
              IS 'Constraint trigger DEFERRABLE su anagrafiche.indirizzi, AFTER UPDATE OR DELETE: quando si cancella un indirizzo del ruolo, o se ne cambia il tipo o il ruolo, il ruolo di prima (OLD.soggetto_ruolo_id) deve avere ancora i suoi indirizzi obbligatori, a fine transazione. Il controllo e'' anagrafiche.fn_guard_indirizzi_obbligatori_ruolo (E_INDIRIZZO_OBBLIGATORIO_MANCANTE), col tipo che esce: si giudicano solo le righe che quel tipo soddisfaceva, e il tx_id della riga va al log; un ruolo cancellato nella stessa transazione tace. Un UPDATE che non cambia ne'' il tipo ne'' il ruolo non chiede niente. Gemello di anagrafiche.trgfn_indirizzi_soggetti_guard_obbligatori_soggetto, il layer SOGGETTO.';
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_soggetti_guard_obbligatori_soggetto()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              BEGIN
                  IF TG_OP = 'UPDATE'
                     AND OLD.soggetto_id IS NOT DISTINCT FROM NEW.soggetto_id
                     AND OLD.tipo_indirizzo_id IS NOT DISTINCT FROM NEW.tipo_indirizzo_id THEN
                      RETURN NULL;
                  END IF;

                  -- Si giudica solo cio' che l'indirizzo che esce soddisfaceva (D-T7a-1).
                  PERFORM anagrafiche.fn_guard_indirizzi_obbligatori_soggetto(
                      OLD.soggetto_id, OLD.tx_id, OLD.tipo_indirizzo_id);

                  RETURN NULL;
              END;
              $function$;


              COMMENT ON FUNCTION anagrafiche.trgfn_indirizzi_soggetti_guard_obbligatori_soggetto()
              IS 'Constraint trigger DEFERRABLE su anagrafiche.indirizzi_soggetti, AFTER UPDATE OR DELETE: quando si cancella un indirizzo del soggetto, o se ne cambia il tipo o il soggetto, il soggetto di prima (OLD.soggetto_id) deve avere ancora i suoi indirizzi obbligatori, a fine transazione. Il controllo e'' anagrafiche.fn_guard_indirizzi_obbligatori_soggetto (E_INDIRIZZO_OBBLIGATORIO_MANCANTE_TIPO_SOGGETTO), col tipo che esce: si giudicano solo le righe che quel tipo soddisfaceva, e il tx_id della riga va al log; un soggetto cancellato nella stessa transazione tace. Un UPDATE che non cambia ne'' il tipo ne'' il soggetto non chiede niente. Gemello di anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo, il layer RUOLO.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: i corpi di prima sono quelli di 20261116-41, -42, -35, -36.
              SELECT 1;
