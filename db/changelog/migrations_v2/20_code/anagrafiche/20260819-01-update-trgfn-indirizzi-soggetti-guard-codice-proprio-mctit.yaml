# Il guard sugli indirizzi di SOGGETTO smette di usare il codice errore del
# guard sui RUOLI e prende il suo.
#
# IL DIFETTO, e non e' un dettaglio di forma. Due guard diversi condividevano
# E_TIPO_INDIRIZZO_NON_PERMESSO:
#
#   * anagrafiche.trgfn_indirizzi_guard_tipo_ruolo_tipi_indirizzo — layer
#     RUOLO, legge config.tipi_ruolo_tipi_indirizzo, ha in mano
#     tipo_ruolo_id e soggetto_ruolo_id;
#   * anagrafiche.trgfn_indirizzi_soggetti_guard_tipo_indirizzo — layer
#     SOGGETTO, legge config.tipi_soggetto_dettaglio_tipi_indirizzo, ha in
#     mano tipo_soggetto_dettaglio_id e soggetto_id.
#
# Il messaggio del codice condiviso e' scritto per il PRIMO:
#
#     «Tipo indirizzo %s non permesso per tipo_ruolo_id %s (soggetto_ruolo_id=%s)»
#     NOTA: «Verificare la configurazione in config.tipi_ruolo_tipi_indirizzo.»
#
# ⚠️ L'arita' torna — tre segnaposto, tre valori — quindi niente si rompe e
# nessun cancello se ne accorge. Il guasto e' SEMANTICO: sul layer soggetto il
# secondo valore e' un tipo_soggetto_dettaglio_id e il terzo un soggetto_id, ma
# il messaggio li battezza tipo_ruolo_id e soggetto_ruolo_id, e la nota manda a
# controllare la tabella dei RUOLI — dove il problema non c'e' e non ci sara'
# mai. Un messaggio plausibile e falso costa piu' di un messaggio assente: chi
# lo legge non sospetta niente e cerca dove gli e' stato detto.
#
# Successo reale: durante la bonifica dei pgTAP di anagrafiche (2026-08-18)
# questo messaggio ha mandato a cercare un ruolo «Gestore» che con la riga in
# errore non c'entrava nulla — la riga era una persona giuridica e il ruolo
# nemmeno esisteva. Tre query buttate.
#
# LA CORREZIONE. Codice nuovo per il layer soggetto,
# E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO, con messaggio e nota che
# nominano la matrice giusta. E_TIPO_INDIRIZZO_NON_PERMESSO resta al guard dei
# ruoli, per cui e' sempre stato corretto: non si generalizza il messaggio a
# entrambi, perche' un messaggio buono per due casi non e' preciso per nessuno
# — e la nota, che e' la parte utile, dovrebbe sparire.
#
# Corpo preso dalla doc auto-generata (oggetto vivo), non da uno YAML storico:
# cambia SOLO la stringa del codice errore. La forma della chiamata, i tre
# valori VARIADIC e il jsonb di contesto restano identici.
#
# Permessi: funzione di titodb, non SECURITY DEFINER, non in
# dbops.sec_functions_owner -> CREATE OR REPLACE liscio, nessun GRANT
# (precedente 20260808-04).
#
# Catalogo: le due righe stanno nei CSV di 80_data (append, mai UPDATE), e le
# ripesca il loader runOnChange esistente:
#   * config/codici_errore.csv    -> E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO
#   * config/messaggi_errore.csv  -> id 929, tre segnaposto per tre valori
#
# 🔴 Richiesta al BACKEND: rigenerare apps/core/services/error_policies_generated.py
# per il codice nuovo, altrimenti il cancello dei codici da dichiarare lo vede
# mancante.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260819-01-update-trgfn-indirizzi-soggetti-guard-codice-proprio-mctit.yaml

  - changeSet:
      id: 20260819-01-update-trgfn-indirizzi-soggetti-guard-codice-proprio
      author: mctit
      runOnChange: false
      comment: >
        anagrafiche.trgfn_indirizzi_soggetti_guard_tipo_indirizzo passa da
        E_TIPO_INDIRIZZO_NON_PERMESSO (che e' del guard sui ruoli, e il cui
        messaggio nomina tabella e colonne sbagliate per questo layer) al
        codice proprio E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_soggetti_guard_tipo_indirizzo()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_tipo_soggetto_dettaglio_id config.tipi_soggetto_dettaglio.id%TYPE;
                v_has_matrix                 boolean;
                v_today                      date := current_date;
              BEGIN
                -- Gestione DELETE: nessun controllo
                IF TG_OP = 'DELETE' THEN
                  RETURN OLD;
                END IF;

                -- Se mancano i riferimenti chiave, non faccio nulla
                IF NEW.soggetto_id IS NULL OR NEW.tipo_indirizzo_id IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Recupero tipo_soggetto_dettaglio dal soggetto
                SELECT s.tipo_soggetto_dettaglio_id
                  INTO v_tipo_soggetto_dettaglio_id
                  FROM anagrafiche.soggetti s
                 WHERE s.id = NEW.soggetto_id;

                -- Se non ho tipo_soggetto_dettaglio non applico vincoli (fallback permissivo)
                IF v_tipo_soggetto_dettaglio_id IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Verifico se ESISTE almeno una riga di matrice per questo tipo_soggetto_dettaglio
                SELECT EXISTS (
                  SELECT 1
                    FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                   WHERE m.tipo_soggetto_dettaglio_id = v_tipo_soggetto_dettaglio_id
                ) INTO v_has_matrix;

                -- Caso A: nessuna matrice definita → indirizzi liberi
                IF NOT v_has_matrix THEN
                  RETURN NEW;
                END IF;

                -- Caso B: matrice definita → accetto solo tipi previsti, attivi e validi
                IF NOT EXISTS (
                  SELECT 1
                    FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                   WHERE m.tipo_soggetto_dettaglio_id = v_tipo_soggetto_dettaglio_id
                     AND m.tipo_indirizzo_id          = NEW.tipo_indirizzo_id
                     AND m.attivo                     = TRUE
                     AND (m.valido_dal IS NULL OR m.valido_dal <= v_today)
                     AND (m.valido_al  IS NULL OR m.valido_al  >= v_today)
                ) THEN
                  -- ⭐ rev 2026-08-19: codice PROPRIO di questo layer.
                  --   Prima era E_TIPO_INDIRIZZO_NON_PERMESSO, condiviso col guard
                  --   sui RUOLI (trgfn_indirizzi_guard_tipo_ruolo_tipi_indirizzo).
                  --   L'arita' tornava — tre segnaposto, tre valori — quindi niente
                  --   si rompeva; ma il messaggio di quel codice chiama il secondo
                  --   valore `tipo_ruolo_id` e il terzo `soggetto_ruolo_id`, mentre
                  --   qui sono un tipo_soggetto_dettaglio_id e un soggetto_id, e la
                  --   nota manda a config.tipi_ruolo_tipi_indirizzo — che questo
                  --   guard non legge nemmeno. Un messaggio plausibile e falso manda
                  --   a cercare dove il problema non c'e'.
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'trgfn_indirizzi_soggetti_guard_tipo_indirizzo',
                    'E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO',
                    jsonb_build_object(
                      'tipo_indirizzo_id', NEW.tipo_indirizzo_id,
                      'tipo_soggetto_dettaglio_id', v_tipo_soggetto_dettaglio_id,
                      'soggetto_id', NEW.soggetto_id
                    ),
                    NEW.tx_id,
                    NEW.tipo_indirizzo_id::text,
                    v_tipo_soggetto_dettaglio_id::text,
                    NEW.soggetto_id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_indirizzi_soggetti_guard_tipo_indirizzo()
              IS 'Guard sugli indirizzi di SOGGETTO: il tipo di indirizzo deve essere fra quelli che config.tipi_soggetto_dettaglio_tipi_indirizzo ammette per il tipo_soggetto_dettaglio della riga, attivo e valido oggi. Fallback permissivo quando il soggetto non ha un tipo_soggetto_dettaglio o quando per quel tipo non esiste nessuna riga di matrice. ⛔ Da NON confondere con anagrafiche.trgfn_indirizzi_guard_tipo_ruolo_tipi_indirizzo, che e'' il guard del layer RUOLO e legge un''altra matrice: sono due controlli distinti su due tabelle distinte, e dal 2026-08-19 hanno anche due CODICI ERRORE distinti. Prima ne condividevano uno, e il messaggio — scritto per i ruoli — mandava chi sbagliava sul layer soggetto a cercare nella tabella dei ruoli.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino: si riscrive la funzione com'era, cioe' col codice
              -- condiviso E_TIPO_INDIRIZZO_NON_PERMESSO.
              -- ⚠️ Ripristina anche il difetto: il messaggio di quel codice
              -- nomina tipo_ruolo_id / soggetto_ruolo_id e rimanda a
              -- config.tipi_ruolo_tipi_indirizzo, che questo guard non legge.
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_soggetti_guard_tipo_indirizzo()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_tipo_soggetto_dettaglio_id config.tipi_soggetto_dettaglio.id%TYPE;
                v_has_matrix                 boolean;
                v_today                      date := current_date;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  RETURN OLD;
                END IF;

                IF NEW.soggetto_id IS NULL OR NEW.tipo_indirizzo_id IS NULL THEN
                  RETURN NEW;
                END IF;

                SELECT s.tipo_soggetto_dettaglio_id
                  INTO v_tipo_soggetto_dettaglio_id
                  FROM anagrafiche.soggetti s
                 WHERE s.id = NEW.soggetto_id;

                IF v_tipo_soggetto_dettaglio_id IS NULL THEN
                  RETURN NEW;
                END IF;

                SELECT EXISTS (
                  SELECT 1
                    FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                   WHERE m.tipo_soggetto_dettaglio_id = v_tipo_soggetto_dettaglio_id
                ) INTO v_has_matrix;

                IF NOT v_has_matrix THEN
                  RETURN NEW;
                END IF;

                IF NOT EXISTS (
                  SELECT 1
                    FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                   WHERE m.tipo_soggetto_dettaglio_id = v_tipo_soggetto_dettaglio_id
                     AND m.tipo_indirizzo_id          = NEW.tipo_indirizzo_id
                     AND m.attivo                     = TRUE
                     AND (m.valido_dal IS NULL OR m.valido_dal <= v_today)
                     AND (m.valido_al  IS NULL OR m.valido_al  >= v_today)
                ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'trgfn_indirizzi_soggetti_guard_tipo_indirizzo',
                    'E_TIPO_INDIRIZZO_NON_PERMESSO',
                    jsonb_build_object(
                      'tipo_indirizzo_id', NEW.tipo_indirizzo_id,
                      'tipo_soggetto_dettaglio_id', v_tipo_soggetto_dettaglio_id,
                      'soggetto_id', NEW.soggetto_id
                    ),
                    NEW.tx_id,
                    NEW.tipo_indirizzo_id::text,
                    v_tipo_soggetto_dettaglio_id::text,
                    NEW.soggetto_id::text
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;
