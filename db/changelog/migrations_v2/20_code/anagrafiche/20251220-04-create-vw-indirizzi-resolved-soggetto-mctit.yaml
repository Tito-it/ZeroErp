# Liquibase changelog per Zero ERP
# Viste unificate indirizzi (resolved) per soggetto e ruolo
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251220-04-create-vw-indirizzi-resolved-soggetto-mctit.yaml

  - changeSet:
      id: 20251220-04-create-vw-indirizzi-resolved-soggetto
      author: mctit
      comment: >
        Crea le viste:
        - anagrafiche.vw_indirizzi_resolved_soggetto
        Standardizza output (display + campi strutturati) per indirizzi normalizzati e liberi.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |

              -- ============================================================
              -- 2) RESOLVED SOGGETTO
              -- ============================================================
              CREATE OR REPLACE VIEW anagrafiche.vw_indirizzi_resolved_soggetto AS
              SELECT
                'SOGGETTO'::text                         AS scope,
                isg.id                                   AS indirizzo_id,
                isg.soggetto_id                          AS soggetto_id,
                NULL::bigint                             AS soggetto_ruolo_id,

                isg.tipo_indirizzo_id::integer           AS tipo_indirizzo_id,
                ti.codice_interno                        AS tipo_indirizzo_codice,
                ti.descrizione                           AS tipo_indirizzo_descrizione,

                (isg.indirizzo_dettaglio_id IS NOT NULL) AS is_normalizzato,
                isg.indirizzo_dettaglio_id               AS indirizzo_dettaglio_id,

                COALESCE(
                  vidd.indirizzo_normalizzato,
                  NULLIF(btrim(isg.indirizzo_libero), ''),
                  NULLIF(btrim(
                    concat_ws(', ',
                      NULLIF(btrim(isg.postal_box), ''),
                      NULLIF(btrim(isg.sublocality), ''),
                      NULLIF(btrim(isg.locality), ''),
                      NULLIF(btrim(isg.administrative_area), '')
                    )
                  ), '')
                )                                         AS indirizzo_display,

                isg.indirizzo_libero,
                isg.stato_id,
                isg.administrative_area,
                isg.locality,
                isg.sublocality,
                isg.postal_box,

                COALESCE(vidd.comune_id, isg.comune_id)                 AS comune_id,
                COALESCE(vidd.descrizione_comune, ic.comune)            AS comune_descrizione,
                COALESCE(vidd.cap, ic.codice_postale)                   AS cap,
                COALESCE(vidd.provincia, ic.provincia)                  AS provincia,

                vidd.stradario_id,
                vidd.via_norm,
                vidd.civico,
                vidd.estensione_civico,
                vidd.palazzina,
                vidd.scala,
                vidd.piano,
                vidd.interno,
                vidd.altro,

                COALESCE(vidd.civic_geoloc, vidd.street_geoloc, isg.geoloc) AS geoloc,

                isg.storicizza,
                isg.tx_id,
                isg.data_insert,
                isg.user_insert,
                isg.data_update,
                isg.user_update
              FROM anagrafiche.indirizzi_soggetti isg
              JOIN config.tipi_indirizzi ti
                ON ti.id = isg.tipo_indirizzo_id
              LEFT JOIN anagrafiche.vw_indirizzi_dettaglio vidd
                ON vidd.indirizzo_dettaglio_id = isg.indirizzo_dettaglio_id
              LEFT JOIN script.vw_indirizzo_completo ic
                ON ic.id_comune = isg.comune_id;

              COMMENT ON VIEW anagrafiche.vw_indirizzi_resolved_soggetto
              IS 'Vista resolved: indirizzi associati direttamente al soggetto, 
                con output standard (display + campi strutturati), supporto normalizzato/libero.
                Dipende da script.vw_indirizzo_completo per comune/cap/provincia.';
