# anagrafiche.fn_sync_auth_user_expired: IL BATCH NOTTURNO SPEGNE E ACCENDE
#   Brief: brief-db-veste-utilizzabile §7.5 (decisione di Tid del 2026-10-07)
#
#   Il batch riallinea auth_user.is_active alla data di oggi nei DUE versi:
#   spegne chi non ha piu' vesti utilizzabili e ACCENDE chi ne ha una diventata
#   valida oggi. Fino al -09 solo spegneva: una credenziale con l'unica veste a
#   valido_dal futuro nasceva spenta e restava spenta anche quel giorno, perche'
#   una data che arriva non scrive niente (e il sync sulla veste scatta solo su
#   attivo). Candidati: credenziali con vesti il cui is_active differisce da
#   «esiste una veste utilizzabile» (script.fn_veste_utilizzabile, la regola del
#   sync). ⚠️ Il nome resta (pgAgent, command Django, repository BE lo chiamano);
#   il ritorno conta le credenziali RIALLINEATE. Il repository BE ricava gia' le
#   credenziali toccate dalla differenza simmetrica prima/dopo: le accese
#   entrano da sole.
#   Corpo di partenza = 20261007-09 (applicato); rollback = il -09.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261007-21-update-fn-sync-auth-user-expired-spegne-e-accende-mctit.yaml

  - changeSet:
      id: 20261007-21-update-fn-sync-auth-user-expired-spegne-e-accende
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_sync_auth_user_expired: riallinea is_active nei due versi (spegne gli scaduti, accende chi diventa valido oggi) con script.fn_veste_utilizzabile. Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname || '.' || p.proname IN ('anagrafiche.fn_sync_auth_user_expired');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_sync_auth_user_expired()
               RETURNS integer  -- un CONTEGGIO di credenziali riallineate: nessuna colonna dietro
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Variabili locali tipizzate %TYPE (policy ZeroErp).
                  v_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_modified     boolean;        -- esito di fn_sync_auth_user_is_active: nessuna colonna dietro
                  v_count        integer := 0;   -- un conteggio
              BEGIN
                  -- ------------------------------------------------------------
                  -- Funzione: anagrafiche.fn_sync_auth_user_expired (v5, 07-10-2026)
                  -- Scopo:
                  --   Batch notturno: riallinea auth_user.is_active alla data di
                  --   oggi, nei DUE versi. Una data che arriva non scrive niente e
                  --   non fa scattare trigger, quindi:
                  --     * SPEGNE la credenziale che non ha piu' nessuna veste
                  --       utilizzabile (la veste o il rapporto sono scaduti);
                  --     * ACCENDE la credenziale che ne ha una diventata valida oggi
                  --       (valido_dal arrivato).
                  --   ⭐ v5 (decisione di Tid, 2026-10-07): fino alla v4 il batch
                  --   solo spegneva. Una credenziale con l'unica veste a valido_dal
                  --   futuro nasceva spenta e restava spenta anche il giorno in cui
                  --   la veste diventava valida, finche' qualcuno non scriveva sulla
                  --   veste. Il nome resta (pgAgent, command Django e repository BE
                  --   lo chiamano); il ritorno conta le credenziali riallineate.
                  --   ⭐ v4 (brief-db-veste-utilizzabile): i candidati si scelgono
                  --   con script.fn_veste_utilizzabile, la stessa regola che poi
                  --   decide in fn_sync_auth_user_is_active. Prima il batch
                  --   guardava solo identita_digitali.valido_al: con D-2 l'operatore
                  --   umano scade anche col suo rapporto (risorse_umane.valido_al),
                  --   e quel candidato il batch non lo avrebbe proposto mai.
                  --   ⛔ Il «ramo legacy» (risorse_umane.valido_al via la vista
                  --   risorse_umane_auth_user) e' caduto: la regola vive in
                  --   identita_digitali.valido_al (decisione Tid 12-09-2026), e
                  --   fn_sync_auth_user_is_active decide comunque SOLO sull'identita'
                  --   — quel ramo poteva proporre candidati, mai cambiare l'esito.
                  --
                  --   Uso: pgAgent daily job + management command Django.
                  --
                  -- Ritorna: numero di credenziali effettivamente riallineate
                  --          (spente o accese).
                  -- ------------------------------------------------------------

                  -- Short-circuit CI: se lo schema django non esiste, no-op.
                  IF to_regclass('django.auth_user') IS NULL THEN
                      RETURN 0;
                  END IF;

                  -- Loop sui candidati: credenziali che hanno delle vesti e il cui
                  -- is_active non dice piu' «esiste una veste utilizzabile oggi»
                  -- (la regola che decide in fn_sync_auth_user_is_active), nei due
                  -- versi. Una credenziale senza vesti non e' affare di questo batch.
                  FOR v_auth_user_id IN
                      EXECUTE '
                          SELECT au.id
                            FROM django.auth_user au
                           WHERE EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.identita_digitali id
                                      WHERE id.auth_user_id = au.id)
                             AND au.is_active IS DISTINCT FROM EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.identita_digitali id
                                      WHERE id.auth_user_id = au.id
                                        AND script.fn_veste_utilizzabile(id.id))
                      '
                  LOOP
                      -- Invoca la nuova firma sync per ciascun candidato.
                      -- La funzione sync applica la logica di fail-closed
                      -- (fuori finestra -> false); qui contiamo solo quelli
                      -- realmente modificati (v_modified = true).
                      SELECT anagrafiche.fn_sync_auth_user_is_active(v_auth_user_id)
                        INTO v_modified;

                      IF v_modified THEN
                          v_count := v_count + 1;
                      END IF;
                  END LOOP;

                  RETURN v_count;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.fn_sync_auth_user_expired() IS 'Batch notturno: riallinea django.auth_user.is_active alla data di oggi nei due versi, perche'' una data che arriva non scrive niente e non fa scattare trigger. Spegne le credenziali che hanno vesti ma nessuna piu'' utilizzabile (veste o rapporto scaduti) e accende quelle che ne hanno una diventata valida oggi; la regola e'' script.fn_veste_utilizzabile, la stessa di fn_sync_auth_user_is_active, che fa l''aggiornamento. Una credenziale senza vesti resta fuori. Invocata da pgAgent daily e dal management command Django. Ritorna il numero di credenziali riallineate (spente o accese). Rev 2026-10-07 (brief-db-veste-utilizzabile): fino alla v4 solo spegneva, e una credenziale con l''unica veste a valido_dal futuro restava spenta anche il giorno in cui la veste diventava valida; il nome resta perche'' pgAgent, command e repository BE lo chiamano.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_sync_auth_user_expired()
               RETURNS integer  -- un CONTEGGIO di credenziali spente: nessuna colonna dietro
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Variabili locali tipizzate %TYPE (policy ZeroErp).
                  v_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_modified     boolean;        -- esito di fn_sync_auth_user_is_active: nessuna colonna dietro
                  v_count        integer := 0;   -- un conteggio
              BEGIN
                  -- ------------------------------------------------------------
                  -- Funzione: anagrafiche.fn_sync_auth_user_expired (v4, 07-10-2026)
                  -- Scopo:
                  --   Batch di disattivazione overnight: spegne la credenziale
                  --   (auth_user.is_active) che non ha piu' NESSUNA veste
                  --   utilizzabile oggi, perche' il tempo e' passato e nessuno ha
                  --   scritto niente (una data di fine superata non fa scattare
                  --   trigger).
                  --   ⭐ v4 (brief-db-veste-utilizzabile): i candidati si scelgono
                  --   con script.fn_veste_utilizzabile, la stessa regola che poi
                  --   decide in fn_sync_auth_user_is_active. Prima il batch
                  --   guardava solo identita_digitali.valido_al: con D-2 l'operatore
                  --   umano scade anche col suo rapporto (risorse_umane.valido_al),
                  --   e quel candidato il batch non lo avrebbe proposto mai.
                  --   ⛔ Il «ramo legacy» (risorse_umane.valido_al via la vista
                  --   risorse_umane_auth_user) e' caduto: la regola vive in
                  --   identita_digitali.valido_al (decisione Tid 12-09-2026), e
                  --   fn_sync_auth_user_is_active decide comunque SOLO sull'identita'
                  --   — quel ramo poteva proporre candidati, mai cambiare l'esito.
                  --
                  --   Uso: pgAgent daily job + management command Django.
                  --
                  -- Ritorna: numero di utenti effettivamente disattivati.
                  -- ------------------------------------------------------------

                  -- Short-circuit CI: se lo schema django non esiste, no-op.
                  IF to_regclass('django.auth_user') IS NULL THEN
                      RETURN 0;
                  END IF;

                  -- Loop sui candidati: auth_user ancora is_active=true che ha
                  -- delle vesti ma nessuna utilizzabile oggi. Una credenziale
                  -- senza vesti non e' affare di questo batch.
                  FOR v_auth_user_id IN
                      EXECUTE '
                          SELECT au.id
                            FROM django.auth_user au
                           WHERE au.is_active = true
                             AND EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.identita_digitali id
                                      WHERE id.auth_user_id = au.id)
                             AND NOT EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.identita_digitali id
                                      WHERE id.auth_user_id = au.id
                                        AND script.fn_veste_utilizzabile(id.id))
                      '
                  LOOP
                      -- Invoca la nuova firma sync per ciascun candidato.
                      -- La funzione sync applica la logica di fail-closed
                      -- (fuori finestra -> false); qui contiamo solo quelli
                      -- realmente modificati (v_modified = true).
                      SELECT anagrafiche.fn_sync_auth_user_is_active(v_auth_user_id)
                        INTO v_modified;

                      IF v_modified THEN
                          v_count := v_count + 1;
                      END IF;
                  END LOOP;

                  RETURN v_count;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.fn_sync_auth_user_expired() IS 'Batch: disattiva auth_user per finestra temporale scaduta su identita_digitali.valido_al (tutte le vesti). Dal 12-09-2026 senza il ramo legacy via risorse_umane_auth_user: la regola vive in identita_digitali e fn_sync_auth_user_is_active decide solo li''. Invocata da pgAgent daily e management command Django. Ritorna il numero di utenti disattivati. Rev 2026-10-07 (brief-db-veste-utilizzabile): i candidati sono le credenziali attive che hanno vesti ma nessuna utilizzabile oggi secondo script.fn_veste_utilizzabile (la stessa regola di fn_sync_auth_user_is_active): cosi'''' scade anche l''''operatore umano il cui rapporto e'''' finito.';
