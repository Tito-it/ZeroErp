# Liquibase changelog per Zero ERP
# Fix: normalizza estensione_civico, palazzina, scala, piano, interno
# a UPPER prima della concatenazione — rende uq_indirizzi_dettaglio_norm
# case-insensitive di fatto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260317-01-fix-trgfn-indirizzi-dettaglio-normalize-upper-mctit.yaml

  - changeSet:
      id: 20260317-01-fix-trgfn-indirizzi-dettaglio-normalize-upper
      author: mctit
      runOnChange: false
      comment: >
        Aggiunge UPPER(BTRIM(...)) su estensione_civico, palazzina, scala, piano, interno
        nel trigger di normalizzazione. Rende il vincolo uq_indirizzi_dettaglio_norm
        case-insensitive di fatto. Include UPDATE per normalizzare i dati esistenti.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ============================================================
              -- Trigger function: normalizza indirizzi_dettaglio
              -- Fix: UPPER+BTRIM su colonne strutturali PRIMA della
              -- concatenazione, cosi' il constraint uq lavora su valori
              -- gia' normalizzati.
              -- ============================================================
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_dettaglio_normalize()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Normalizza la descrizione della via da vw_indirizzo_completo
                SELECT UPPER(TRIM(iv.tipo_toponimo || ' ' || iv.nome_strada))
                  INTO STRICT NEW.via_norm
                  FROM script.vw_indirizzo_completo iv
                 WHERE iv.id_stradario = NEW.stradario_id
                 LIMIT 1;

                -- ====== FIX: normalizza colonne strutturali a UPPER ======
                NEW.estensione_civico := UPPER(BTRIM(NEW.estensione_civico));
                NEW.palazzina         := UPPER(BTRIM(NEW.palazzina));
                NEW.scala             := UPPER(BTRIM(NEW.scala));
                NEW.piano             := UPPER(BTRIM(NEW.piano));
                NEW.interno           := UPPER(BTRIM(NEW.interno));

                -- Normalizzazione del numero civico con eventuale estensione
                IF NEW.civico IS NOT NULL AND NEW.civico <> 0 THEN
                  IF NEW.estensione_civico IS NOT NULL AND NEW.estensione_civico <> '' THEN
                    IF LEFT(NEW.estensione_civico,1) <> '/' THEN
                      NEW.estensione_civico := '/' || NEW.estensione_civico;
                    END IF;
                    NEW.civico_norm := NEW.civico::text || NEW.estensione_civico;
                  ELSE
                    NEW.civico_norm := NEW.civico::text;
                  END IF;
                ELSE
                  NEW.civico_norm := 'SNC';
                END IF;

                -- Costruzione dell'indirizzo completo normalizzato
                NEW.indirizzo_normalizzato := TRIM(BOTH ' ' FROM (
                    NEW.via_norm
                  || CASE WHEN NEW.civico_norm <> '' THEN ', ' || NEW.civico_norm ELSE '' END
                  || CASE WHEN NEW.palazzina IS NOT NULL AND NEW.palazzina <> ''
                          THEN ', Pal.' || NEW.palazzina ELSE '' END
                  || CASE WHEN NEW.scala IS NOT NULL AND NEW.scala <> ''
                          THEN ', Scala ' || NEW.scala ELSE '' END
                  || CASE WHEN NEW.piano IS NOT NULL AND NEW.piano <> ''
                          THEN ', Piano ' || NEW.piano ELSE '' END
                  || CASE WHEN NEW.interno IS NOT NULL AND NEW.interno <> ''
                          THEN ', Int.' || NEW.interno ELSE '' END
                ));

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_indirizzi_dettaglio_normalize()
                IS 'Normalizza via/civico/indirizzo_normalizzato su anagrafiche.indirizzi_dettaglio. Applica UPPER+BTRIM su estensione_civico, palazzina, scala, piano, interno per rendere il vincolo uq_indirizzi_dettaglio_norm case-insensitive.';

              -- ============================================================
              -- Data fix: normalizza i record esistenti
              -- L''UPDATE scatta il trigger BEFORE UPDATE che applica UPPER
              -- ============================================================
              UPDATE anagrafiche.indirizzi_dettaglio
                 SET estensione_civico = estensione_civico
               WHERE estensione_civico IS DISTINCT FROM UPPER(BTRIM(estensione_civico))
                  OR palazzina         IS DISTINCT FROM UPPER(BTRIM(palazzina))
                  OR scala             IS DISTINCT FROM UPPER(BTRIM(scala))
                  OR piano             IS DISTINCT FROM UPPER(BTRIM(piano))
                  OR interno           IS DISTINCT FROM UPPER(BTRIM(interno));

      rollback:
        - sql:
            sql: |
              -- Rollback: ripristina la versione senza UPPER sulle colonne strutturali
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_indirizzi_dettaglio_normalize()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                SELECT UPPER(TRIM(iv.tipo_toponimo || ' ' || iv.nome_strada))
                  INTO STRICT NEW.via_norm
                  FROM script.vw_indirizzo_completo iv
                 WHERE iv.id_stradario = NEW.stradario_id
                 LIMIT 1;

                IF NEW.civico IS NOT NULL AND NEW.civico <> 0 THEN
                  IF NEW.estensione_civico IS NOT NULL AND NEW.estensione_civico <> '' THEN
                    IF LEFT(NEW.estensione_civico,1) <> '/' THEN
                      NEW.estensione_civico := '/' || NEW.estensione_civico;
                    END IF;
                    NEW.civico_norm := UPPER(NEW.civico::text || NEW.estensione_civico);
                  ELSE
                    NEW.civico_norm := UPPER(NEW.civico::text);
                  END IF;
                ELSE
                  NEW.civico_norm := 'SNC';
                END IF;

                NEW.indirizzo_normalizzato := TRIM(BOTH ' ' FROM (
                    NEW.via_norm
                  || CASE WHEN NEW.civico_norm <> '' THEN ', ' || NEW.civico_norm ELSE '' END
                  || CASE WHEN NEW.palazzina IS NOT NULL AND NEW.palazzina <> ''
                          THEN ', Pal.' || NEW.palazzina ELSE '' END
                  || CASE WHEN NEW.scala IS NOT NULL AND NEW.scala <> ''
                          THEN ', Scala ' || NEW.scala ELSE '' END
                  || CASE WHEN NEW.piano IS NOT NULL AND NEW.piano <> ''
                          THEN ', Piano ' || NEW.piano ELSE '' END
                  || CASE WHEN NEW.interno IS NOT NULL AND NEW.interno <> ''
                          THEN ', Int.' || NEW.interno ELSE '' END
                ));

                RETURN NEW;
              END;
              $function$;
