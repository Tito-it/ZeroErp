# comment-al-presente: ammesso — file gia' applicato su scratch e dbdev, non si riscrive (checksum): i suoi COMMENT li riscrive al presente 20_code/anagrafiche/20261123-64.
# anagrafiche.fn_scrivi_dati_societari: il soggetto sotto lucchetto prima di
#   scrivere. Brief: brief-db-revisione-anagrafiche §20 (T5), S41-2 (Tid,
#   2026-11-23).
#
# -- S41-2 ---------------------------------------------------------------------------
#   UPDATE e poi INSERT, senza lucchetto: due prime scritture concorrenti dei
#   dati societari dello stesso soggetto (due salvataggi, una creazione e una
#   modifica) aggiornavano zero righe tutte e due, e la seconda INSERT urtava
#   uq_ds_soggetto con un 23505 grezzo. Il verbo prende la riga del soggetto
#   FOR NO KEY UPDATE nella stessa SELECT che ne controlla l'esistenza: la
#   seconda aspetta, trova la riga e la aggiorna. L'upsert no: un BEFORE
#   INSERT giudica la riga proposta anche quando poi si aggiorna
#   (linee-guida-trigger).
#
# -- S41-3, NON QUI -------------------------------------------------------------------
#   La forma mancante (23502 senza codice) la rifiuta il guard della forma,
#   non il verbo (-60): un controllo nel verbo parlava prima del guard della
#   natura, e a un privato con la sezione diceva «manca la forma» invece di
#   «questo tipo soggetto non ha dati societari». Trovato dal pgTAP
#   test-dati-societari-alla-nascita-v1 (17).
#   Corpo dal sorgente 20261025-87 (firma, RETURNS, DECLARE ancorati), una
#   sostituzione. SECURITY DEFINER e search_path invariati.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261123-59-update-fn-scrivi-dati-societari-lock-forma-mctit.yaml

  - changeSet:
      id: 20261123-59-update-fn-scrivi-dati-societari-lock-forma
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_scrivi_dati_societari: la riga del soggetto FOR NO KEY UPDATE prima di
        scrivere (due prime scritture concorrenti non urtano uq_ds_soggetto).
        brief-db-revisione-anagrafiche §20, S41-2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_scrivi_dati_societari';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_scrivi_dati_societari(
                  p_soggetto_id        anagrafiche.dati_societari.soggetto_id%TYPE,
                  p_forma_giuridica_id anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  p_id_prov_iscri_rea  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  p_iscrizione_rea     anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  p_capitale_sociale   anagrafiche.dati_societari.capitale_sociale%TYPE,
                  p_socio_unico        anagrafiche.dati_societari.socio_unico%TYPE,
                  p_liquidazione       anagrafiche.dati_societari.liquidazione%TYPE,
                  p_destinatario_fe    anagrafiche.dati_societari.destinatario_fe%TYPE,
                  p_pec_fatturazione   anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  p_codice_sdi         anagrafiche.dati_societari.codice_sdi%TYPE,
                  p_data_costituzione  anagrafiche.dati_societari.data_costituzione%TYPE
              )
              RETURNS anagrafiche.dati_societari.id%TYPE
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: crea o aggiorna i dati societari di un soggetto (stato intero).
              --   Aggiunge solo il controllo del soggetto (obbligatorio, poi esistente):
              --   le regole (forma, natura,
              --   REA, capitale, canale FE) sono nei trigger.
              -- ⛔ SECURITY DEFINER: dal 20261011-04 l'app non scrive la tabella, e
              --   questa e' la porta. Nessun guard di livello: il permesso resta al
              --   backend, come per anagrafiche.soggetti (decisione di Tid, 2026-10-10).
              -- Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-1..B-5).
              -- =========================================================
              DECLARE
                  v_id           anagrafiche.dati_societari.id%TYPE;
                  v_socio_unico  anagrafiche.dati_societari.socio_unico%TYPE;
                  v_liquidazione anagrafiche.dati_societari.liquidazione%TYPE;
                            BEGIN
                  -- Due rami, due codici: il soggetto non passato e' un chiamante rotto
                  -- (PARAMETRO), quello passato e inesistente e' «non trovato».
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_scrivi_dati_societari', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_soggetto_id', 'valore', NULL),
                          NULL::uuid,
                          'il soggetto e'' obbligatorio');
                  END IF;

                  -- Il soggetto si legge e si prende FOR NO KEY UPDATE (S41-2, rev
                  --   20261123-59, brief-db-revisione-anagrafiche §20): due prime
                  --   scritture concorrenti dello stesso soggetto facevano tutte e due
                  --   l'UPDATE a vuoto e poi l'INSERT, e la seconda urtava uq_ds_soggetto
                  --   con un 23505 grezzo. Col lucchetto la seconda aspetta la prima e
                  --   trova la riga: l'UPDATE la aggiorna. Non e' un upsert: con
                  --   ON CONFLICT i BEFORE INSERT giudicherebbero la riga proposta anche
                  --   quando poi si aggiorna (linee-guida-trigger, BEFORE e AFTER).
                  --   NO KEY UPDATE non blocca chi legge ne' le FK verso il soggetto.
                  PERFORM 1
                    FROM anagrafiche.soggetti s
                   WHERE s.id = p_soggetto_id
                     FOR NO KEY UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_scrivi_dati_societari',
                          'E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO',
                          jsonb_build_object('soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          p_soggetto_id::text);
                  END IF;

                  -- I due enum NOT NULL: NULL vale il valore PROPOSTO dal parametro,
                  -- con la cascata della sessione (override per emittente, D-2-bis).
                  -- Parametro assente: la cascata solleva (nessun valore di riserva).
                  v_socio_unico := COALESCE(
                      p_socio_unico,
                      script.fn_get_parameter_di_sessione(
                          'dati_societari_default_socio_unico',
                          'anagrafiche.fn_scrivi_dati_societari')::anagrafiche.socio_unico_enum);
                  v_liquidazione := COALESCE(
                      p_liquidazione,
                      script.fn_get_parameter_di_sessione(
                          'dati_societari_default_liquidazione',
                          'anagrafiche.fn_scrivi_dati_societari')::anagrafiche.liquidazione_enum);

                  UPDATE anagrafiche.dati_societari ds
                     SET forma_giuridica_id = p_forma_giuridica_id,
                         id_prov_iscri_rea  = p_id_prov_iscri_rea,
                         iscrizione_rea     = NULLIF(btrim(p_iscrizione_rea), ''),
                         capitale_sociale   = p_capitale_sociale,
                         socio_unico        = v_socio_unico,
                         liquidazione       = v_liquidazione,
                         destinatario_fe    = NULLIF(btrim(p_destinatario_fe), ''),
                         pec_fatturazione   = NULLIF(btrim(p_pec_fatturazione), ''),
                         codice_sdi         = NULLIF(btrim(p_codice_sdi), ''),
                         data_costituzione  = p_data_costituzione
                   WHERE ds.soggetto_id = p_soggetto_id
                  RETURNING ds.id INTO v_id;

                  IF v_id IS NULL THEN
                      INSERT INTO anagrafiche.dati_societari (
                          soggetto_id, forma_giuridica_id, id_prov_iscri_rea, iscrizione_rea,
                          capitale_sociale, socio_unico, liquidazione,
                          destinatario_fe, pec_fatturazione, codice_sdi, data_costituzione
                      )
                      VALUES (
                          p_soggetto_id, p_forma_giuridica_id, p_id_prov_iscri_rea,
                          NULLIF(btrim(p_iscrizione_rea), ''),
                          p_capitale_sociale, v_socio_unico, v_liquidazione,
                          NULLIF(btrim(p_destinatario_fe), ''),
                          NULLIF(btrim(p_pec_fatturazione), ''),
                          NULLIF(btrim(p_codice_sdi), ''),
                          p_data_costituzione
                      )
                      RETURNING id INTO v_id;
                  END IF;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_scrivi_dati_societari(
                  anagrafiche.dati_societari.soggetto_id%TYPE,
                  anagrafiche.dati_societari.forma_giuridica_id%TYPE,
                  anagrafiche.dati_societari.id_prov_iscri_rea%TYPE,
                  anagrafiche.dati_societari.iscrizione_rea%TYPE,
                  anagrafiche.dati_societari.capitale_sociale%TYPE,
                  anagrafiche.dati_societari.socio_unico%TYPE,
                  anagrafiche.dati_societari.liquidazione%TYPE,
                  anagrafiche.dati_societari.destinatario_fe%TYPE,
                  anagrafiche.dati_societari.pec_fatturazione%TYPE,
                  anagrafiche.dati_societari.codice_sdi%TYPE,
                  anagrafiche.dati_societari.data_costituzione%TYPE) IS
                  'Il verbo di scrittura dei dati societari: crea o aggiorna la riga del soggetto (una per soggetto), STATO INTERO (NULL scrive NULL dove la colonna lo ammette; testi ripuliti, vuoto = NULL). socio_unico e liquidazione NULL valgono il valore proposto dai parametri dati_societari_default_socio_unico / _liquidazione, letto con script.fn_get_parameter_di_sessione: la cascata col contesto della sessione, quindi con l''override dell''emittente attivo (D-2-bis e D-4 di brief-db-parametri-senza-override); parametro assente = errore, nessun valore di riserva. Aggiunge solo il controllo del soggetto (NULL solleva E_PARAMETRO_INVALIDO, inesistente E_DATI_SOCIETARI_SOGGETTO_NON_TROVATO); prende la riga del soggetto FOR NO KEY UPDATE prima di scrivere, cosi'' due prime scritture concorrenti non urtano uq_ds_soggetto (S41-2, rev 20261123-59, brief-db-revisione-anagrafiche §20); forma (anche quella mancante, E_DATI_SOCIETARI_FORMA_GIURIDICA_OBBLIGATORIA), natura, REA, capitale e canale FE restano ai trigger della tabella. SECURITY DEFINER: dal 20261011-04 l''applicazione non scrive anagrafiche.dati_societari direttamente, e questa e'' la porta (B-5); nessun guard di livello, il permesso resta al backend come per anagrafiche.soggetti. Se nella stessa scrittura cambia la natura del soggetto, si aggiorna prima il soggetto e poi si chiama il verbo. Lo chiamano anagrafiche.fn_scrivi_dati_societari_alla_nascita, il backend in modifica e le fixture pgTAP. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (B-1..B-5).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: il corpo di prima e' quello di 20261025-87.
              SELECT 1;
