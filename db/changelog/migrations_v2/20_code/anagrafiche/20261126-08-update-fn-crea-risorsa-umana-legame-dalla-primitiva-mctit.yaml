# LA RISORSA UMANA LEGA IL SUPER_ADMIN DALLA PRIMITIVA
#   anagrafiche.fn_crea_risorsa_umana
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   La funzione e' il passo interno della creazione dell'operatore, e la
#   raggiungono anche strade senza un SUPER_ADMIN in sessione (il primo
#   amministratore, il provisioning, la fixture dei pgTAP): il legame passa
#   alla primitiva config.fn_applica_lega_profilo_identita (20261126-01),
#   perche' il verbo col guard (20261126-02) le fermerebbe. Una riga cambiata e
#   il COMMENT (la funzione e' una primitiva: l'EXECUTE all'app lo toglie
#   90_end/20261126-25; il backend non la chiama in produzione).
#   Corpo e attributi dal catalogo di dbdev (ultimo 20261125-67), firma
#   ancorata come in quella revisione.
# ------------------------------------------------------------

