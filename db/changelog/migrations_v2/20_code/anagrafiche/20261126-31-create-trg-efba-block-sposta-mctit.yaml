# IL COLLEGAMENTO NON PASSA DA UN BILLING ACCOUNT A UN ALTRO
#   trg_emittenti_fiscali_ba_a05_block_sposta_upd
#     BEFORE UPDATE ON anagrafiche.emittenti_fiscali_billing_account
#     WHEN (OLD.billing_account_id IS DISTINCT FROM NEW.billing_account_id)
#     EXECUTE FUNCTION script.trgfn_prevent_modification_generic('E_BA_COLLEGAMENTO_NON_SI_SPOSTA')
#   Brief: brief-db-revisione-anagrafiche §24.5 (D-T4-3)
#
# -- LA REGOLA --------------------------------------------------------
#   Una riga del collegamento appartiene al suo billing account per sempre:
#   spostarla su un altro conto lascerebbe il primo senza azienda, e farla
#   diventare la predefinita (o il contrario) e' la stessa cosa. Cambia solo
#   l'azienda (emittente_soggetto_ruolo_id), alle condizioni della storia.
#
# -- LA FORMA ---------------------------------------------------------
#   * Il building block «rifiuta sempre», col WHEN sul cambio di valore e non
#     UPDATE OF (linee-guida-trigger): nessun altro trigger BEFORE della
#     tabella scrive billing_account_id, ma il WHEN tace anche su una
#     riscrittura a valore uguale.
#   * Non un lucchetto di colonna (dbops.automation_lock_columns): quello ha una
#     porta, e qui nessuna scrittura legittima sposta un collegamento.
#   * Fase a05, frase chiusa.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-31-create-trg-efba-block-sposta-mctit.yaml

  - changeSet:
      id: 20261126-31-create-trg-efba-block-sposta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il collegamento di un billing account non passa a un altro conto ne' diventa la riga
        predefinita: script.trgfn_prevent_modification_generic BEFORE UPDATE quando
        billing_account_id cambia (E_BA_COLLEGAMENTO_NON_SI_SPOSTA).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_ba_a05_block_sposta_upd
                  ON anagrafiche.emittenti_fiscali_billing_account;
              CREATE TRIGGER trg_emittenti_fiscali_ba_a05_block_sposta_upd
                  BEFORE UPDATE ON anagrafiche.emittenti_fiscali_billing_account
                  FOR EACH ROW
                  WHEN (OLD.billing_account_id IS DISTINCT FROM NEW.billing_account_id)
                  EXECUTE FUNCTION script.trgfn_prevent_modification_generic('E_BA_COLLEGAMENTO_NON_SI_SPOSTA');

              COMMENT ON TRIGGER trg_emittenti_fiscali_ba_a05_block_sposta_upd
                  ON anagrafiche.emittenti_fiscali_billing_account IS
                'Il collegamento appartiene al suo billing account: non passa a un altro conto e non diventa la riga dell''azienda predefinita, ne'' il contrario (E_BA_COLLEGAMENTO_NON_SI_SPOSTA). Cambia solo l''azienda, alle condizioni della storia.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_ba_a05_block_sposta_upd
                  ON anagrafiche.emittenti_fiscali_billing_account;
