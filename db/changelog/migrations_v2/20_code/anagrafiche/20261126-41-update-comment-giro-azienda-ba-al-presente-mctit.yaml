# I COMMENT RIMASTI AL MODELLO DI PRIMA DOPO IL GIRO DELL'AZIENDA DEL BA
#   anagrafiche.fn_guard_istanza_ha_ba             (COMMENT)
#   anagrafiche.fn_guard_istanza_ba_emittente      (COMMENT)
#   script.fn_get_ba_emittente_sr_id_installazione (COMMENT)
#   script.fn_check_ba_cambio_emittente            (COMMENT)
#   anagrafiche.fn_ba_ha_storia_emittente          (un commento nel corpo)
#   Brief: brief-db-revisione-anagrafiche §24.7 (giro 6, la verifica della documentazione)
#
# -- LA REGOLA --------------------------------------------------------
#   I changeSet 20261126-26 … -40 (applicati) hanno ritirato i guard della
#   predefinita e il trigger della cancellazione del BA, e reso la storia
#   «qualunque documento». Questi COMMENT nominavano ancora gli oggetti
#   ritirati o la regola di prima (il documento NUMERATO, togliere il
#   collegamento, il BA che ricade sulla predefinita). Si riscrivono al
#   presente (linee-guida-sql §5d), senza nomi di brief.
#
# -- LA FORMA ---------------------------------------------------------
#   * I quattro COMMENT si riscrivono; nessuna fase tardiva li riscrive.
#   * fn_ba_ha_storia_emittente: il corpo di 20261126-26, gia' applicato, con
#     il solo commento del ramo NULL corretto (rimandava a un guard ritirato).
#     Firma ancorata, stessa funzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-41-update-comment-giro-azienda-ba-al-presente-mctit.yaml

  - changeSet:
      id: 20261126-41-update-comment-giro-azienda-ba-al-presente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT al presente di quattro funzioni e un commento nel corpo di
        anagrafiche.fn_ba_ha_storia_emittente, rimasti al modello di prima dopo il ritiro dei guard
        della predefinita e del trigger della cancellazione del BA.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_ba_ha_storia_emittente(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la tabella dei documenti di ogni famiglia e' la target_table della
              --   sua sorgente (config.fn_sorgente_tabella), non piu'
              --   schema_tabella/nome_tabella; firma ancorata.
              DECLARE
                  -- la riga di una SELECT statica sul catalogo delle famiglie (§5e)
                  v_famiglia record;
                  -- l'esito di un EXISTS: nessuna colonna dietro
                  v_trovato  boolean;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rispondere alla SOLA domanda che serve al guard: questo
                  --   billing account ha gia' un documento, di qualunque
                  --   famiglia e in qualunque stato (anche in bozza)? Si
                  --   esce al PRIMO che si trova.
                  --
                  -- ⭐ Esiste separata dal conteggio perche' il guard gira su
                  --   OGNI movimento di un mapping, e li' cinque count(*)
                  --   sarebbero il prezzo di un'informazione che non si usa:
                  --   quanto grande sia la storia interessa solo alla frase
                  --   del rifiuto, cioe' quando si e' gia' deciso di rifiutare.
                  --
                  -- ⚠️ SECURITY DEFINER: fatture e commesse hanno la RLS. Da
                  --   INVOKER la storia di un ALTRO emittente sarebbe
                  --   invisibile e la risposta sarebbe «nessuna storia» proprio
                  --   nel caso da bloccare.
                  -- =========================================================
                  IF p_billing_account_id IS NULL THEN
                      -- La riga senza billing account e' quella dell'azienda
                      -- predefinita: non e' un cliente, e non ha storia.
                      RETURN false;
                  END IF;

                  FOR v_famiglia IN
                      SELECT t.schema_tabella,
                             t.nome_tabella,
                             fd.colonna_billing_account
                        FROM vendite.famiglie_documento fd
                        -- ⭐ rev 2026-10-20: la tabella e' quella della sorgente (G-5).
                        -- ⚠️ LEFT e non CROSS: una famiglia attiva senza tabella (il
                        --   guard dei riferimenti non la lascia nascere) non deve
                        --   SPARIRE dal presidio: il format() con NULL fallisce
                        --   rumoroso, come prima una tabella che non c'era.
                        LEFT JOIN LATERAL config.fn_sorgente_tabella(fd.codice_interno) t ON true
                       WHERE fd.attivo
                         -- ⭐ Solo le famiglie che HANNO un billing account (dal
                         --   20260914-07 la colonna e' opzionale): una famiglia senza
                         --   BA non puo' contribuire alla storia di nessun BA. Il
                         --   salto sta QUI, nella query che sceglie, e non dentro il
                         --   format(): %I con NULL solleva un errore di PostgreSQL
                         --   senza codice di dominio, e %s con NULL tace.
                         AND COALESCE(btrim(fd.colonna_billing_account), '') <> ''
                       ORDER BY fd.id
                  LOOP
                      -- ⚠️ Identificatori da %I, valori da USING: il catalogo
                      --   e' dato, non codice.
                      EXECUTE format(
                          'SELECT EXISTS (SELECT 1 FROM %I.%I d'
                          || ' WHERE d.%I = $1)',
                          v_famiglia.schema_tabella,
                          v_famiglia.nome_tabella,
                          v_famiglia.colonna_billing_account)
                        INTO v_trovato
                       USING p_billing_account_id;

                      IF v_trovato THEN
                          RETURN true;
                      END IF;
                  END LOOP;

                  RETURN false;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_ba_ha_storia_emittente(anagrafiche.billing_account.id%TYPE) IS
                'Il billing account ha gia'' un documento: di qualunque famiglia attiva di vendite.famiglie_documento che dichiara la colonna del billing account, e in qualunque stato, anche in bozza. E'' la storia che chiude il cambio d''azienda del billing account (script.fn_check_ba_cambio_emittente). Si esce al primo documento trovato. NULL: false. SECURITY DEFINER: i documenti hanno la RLS, e la storia di un''altra azienda deve contare.';

              COMMENT ON FUNCTION anagrafiche.fn_guard_istanza_ha_ba(anagrafiche.istanze_utilities.id%TYPE) IS
                'Guard fail-fast: un''istanza utility che esiste ha almeno un billing account (istanza e billing account nascono insieme). Solleva E_ISTANZA_SENZA_BA col codice dell''istanza. Istanza inesistente o parametro NULL: niente da presidiare. Lo chiama al COMMIT trg_istanze_utilities_z90_require_utility_dichiarata_ins, alla nascita dell''istanza. Dopo, l''istanza non perde il suo billing account: il billing account non si cancella (E_BA_NON_SI_CANCELLA) e non cambia istanza (lucchetto E_BA_ISTANZA_IMMUTABILE). SECURITY DEFINER perche'' legge billing_account, che ha la RLS: da INVOKER un billing account fuori perimetro sarebbe invisibile e il guard rifiuterebbe un''operazione legittima.';

              COMMENT ON FUNCTION anagrafiche.fn_guard_istanza_ba_emittente(anagrafiche.billing_account.id%TYPE) IS
                'Guard fail-fast: il billing account indicato e'' della stessa azienda di tutti gli altri billing account della sua istanza (un''istanza ha billing account di un''azienda sola, cosi'' la regola di perimetro «un''istanza e'' dell''azienda del suo billing account» ha una risposta sola). Solleva E_ISTANZA_EMITTENTI_DIVERSI coi codici dei due billing account e dell''istanza. Gemello di anagrafiche.fn_guard_albero_ba_emittente (padre e figli), con la stessa check, anagrafiche.fn_check_ba_coppia_emittente_omogenea. Billing account inesistente: niente da presidiare. SECURITY DEFINER perche'' legge billing_account, che ha la RLS. Lo chiamano anagrafiche.trgfn_billing_account_guard_istanza_emittente (alla nascita del billing account) e anagrafiche.trgfn_efba_guard_istanza_emittente (quando il collegamento nasce o cambia azienda).';

              COMMENT ON FUNCTION script.fn_get_ba_emittente_sr_id_installazione(anagrafiche.billing_account.id%TYPE) IS
                'L''azienda (soggetto_ruolo_id) di un billing account per l''installazione: il suo collegamento in anagrafiche.emittenti_fiscali_billing_account, altrimenti l''azienda predefinita. Non guarda chi agisce: e'' la risposta che vale anche fuori sessione. Ogni billing account ha sempre il suo collegamento, quindi la predefinita risponde solo nell''istante della nascita, prima che il collegamento sia scritto. La leggono i controlli che confrontano l''azienda di due billing account indipendentemente da chi agisce, come anagrafiche.fn_check_ba_padre. Input NULL: NULL.';

              COMMENT ON FUNCTION script.fn_check_ba_cambio_emittente(
                  anagrafiche.billing_account.id%TYPE,
                  anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE,
                  anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE) IS
                'Pure check: i motivi che impediscono di cambiare l''azienda sul collegamento di un billing account (anagrafiche.emittenti_fiscali_billing_account). [] = ammesso; altrimenti un array ordinato di {codice, reason, reason_key, dettaglio, valori}; non solleva. Il motivo e'' la storia: il billing account ha documenti, di qualunque famiglia attiva e in qualunque stato, anche in bozza (anagrafiche.fn_ba_ha_storia_emittente): E_BA_EMITTENTE_CON_STORIA, coi valori cliente, azienda ed elenco dei documenti per famiglia (anagrafiche.fn_get_storia_emittente_ba, nell''ordine del catalogo), e nel dettaglio la storia e il totale. Azienda prima e dopo uguali: nessun motivo. La riga dell''azienda predefinita (billing account NULL) risponde E_EMITTENTE_DEFAULT_SINGLETON. La chiamano anagrafiche.fn_guard_ba_cambio_emittente, che solleva il primo motivo, e la lista dei collegamenti, che ne mostra il motivo: lo stesso predicato per il rifiuto e per il gesto spento. SECURITY DEFINER: la storia si conta su tabelle con la RLS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I COMMENT e il corpo precedenti si ripristinano dai loro changeSet.
              SELECT 1;
