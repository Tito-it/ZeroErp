databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251121-14-trgfn-resellers-check-ruolo-reseller-mctit.yaml

    - changeSet:
          id: 20251121-14-trgfn-resellers-check-ruolo-reseller
          author: mctit
          comment: "Versione 2 della funzione trigger per resellers  che usa fn_check_soggetto_ruolo. La precedente(fn_check_ins_soggetto_ruolo) è deprecata ."
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |


                        CREATE OR REPLACE FUNCTION anagrafiche.trgfn_resellers_check_ruolo_reseller()
                            RETURNS trigger
                            LANGUAGE 'plpgsql'
                            COST 100
                            VOLATILE NOT LEAKPROOF
                        AS $BODY$
                        BEGIN
                            -- FUNCTION: 
                            --   Ogni volta che inserisco/aggiorno in resellers, gestisco la
                            --   verifica della riga corrispondente in soggetti_ruoli.
                            --   alimentando poi in NEW.soggetto_ruolo_id il record finale.

                            -- Sostituisco NEW.soggetto_ruolo_id con l'ID vero (esistente),
                            -- delegando completamente alla funzione generica:
                            NEW.soggetto_ruolo_id := script.fn_check_soggetto_ruolo(
                                                    p_soggetto_id       := NULL,
                                                    p_soggetto_ruolo_id := NEW.soggetto_ruolo_id,
                                                    p_cd_int_ruolo      := 'RE'
                                                    );
                            RETURN NEW;
                        END;

                        $BODY$;

                        COMMENT ON FUNCTION anagrafiche.trgfn_resellers_check_ruolo_reseller()
                            IS 'Trigger che, prima di inserire/aggiornare in anagrafiche.resellers,
                        chiama fn_check_soggetto_ruolo per validare il legame
                        soggetto→ruolo (cd_int_ruolo = ''RE'').';
