# comment-al-presente: ammesso — file gia' applicato e mergiato, non si riscrive (checksum): i suoi COMMENT li riscrive al presente 20_code/anagrafiche/20261125-23.
# anagrafiche.fn_indirizzo_elemento_dettaglio: la forma dell'elemento la
#   decide il DB dalle chiavi.
#   D-T7a-5 di Tid (2026-11-24), brief-db-revisione-anagrafiche §21 (S50).
#
# -- IL DIFETTO -------------------------------------------------------------------
#   La forma si decideva dal solo testo della via libera: un elemento con
#   indirizzo_libero vuoto o assente, e senza indirizzo_dettaglio_id, andava a
#   anagrafiche.fn_create_indirizzo con la via tutta NULL, che scriveva
#   config.stradario_generale e cadeva sul NOT NULL di toponomastica_id (23502).
#   Il guard della forma libera, che rifiuta col campo
#   (E_INDIRIZZO_LIBERO_INCOMPLETO), non era raggiunto.
#
# -- LA REGOLA ----------------------------------------------------------------------
#   * via libera scritta: libero (NULL), come prima;
#   * indirizzo_dettaglio_id: quello, come prima;
#   * nessuna chiave di una via (stradario_id, toponomastica_id,
#     descrizione_via): libero (NULL). La riga si scrive libera e la giudica
#     il guard della forma: un elemento vuoto, o col solo tipo, ha
#     E_INDIRIZZO_LIBERO_INCOMPLETO sul campo indirizzo_libero;
#   * altrimenti la via, da anagrafiche.fn_create_indirizzo, che ora valida
#     la via nuova da se' (-90, E_INDIRIZZO_VIA_NUOVA_INCOMPLETA).
#   comune_id e codice_postale_id non decidono la forma: valgono anche per
#   l'indirizzo libero del catalogo.
#   Firma e attributi immutati: CREATE OR REPLACE. Corpo da 20261018-94
#   (= prosrc di dbdev, 2026-11-24); COMMENT dal catalogo, senza il
#   «pre-check del backend».
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261123-89-update-fn-indirizzo-elemento-dettaglio-forma-dalle-chiavi-mctit.yaml

  - changeSet:
      id: 20261123-89-update-fn-indirizzo-elemento-dettaglio-forma-dalle-chiavi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_indirizzo_elemento_dettaglio: senza chiavi di una via l'elemento e' libero, e lo
        giudica il guard della forma. D-T7a-5, brief-db-revisione-anagrafiche §21.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_indirizzo_elemento_dettaglio(p_el jsonb)
               RETURNS anagrafiche.indirizzi_dettaglio.id%TYPE
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   L'indirizzo normalizzato di un elemento gia' letto da
                  --   fn_indirizzo_elemento:
                  --     * indirizzo libero scritto: NULL (la riga e' libera);
                  --     * indirizzo_dettaglio_id: quello;
                  --     * nessuna chiave di una via: NULL (la riga e' libera,
                  --       e il guard della forma dice che cosa manca);
                  --     * altrimenti la via (stradario_id, oppure
                  --       toponomastica + descrizione + comune + CAP) e il
                  --       civico, risolti da anagrafiche.fn_create_indirizzo,
                  --       idempotente, che valida la via nuova.
                  -- =========================================================
                  IF NULLIF(btrim(p_el ->> 'indirizzo_libero'), '') IS NOT NULL THEN
                      RETURN NULL;
                  END IF;

                  IF p_el ->> 'indirizzo_dettaglio_id' IS NOT NULL THEN
                      RETURN (p_el ->> 'indirizzo_dettaglio_id')::bigint;
                  END IF;

                  -- D-T7a-5: la forma dalle chiavi. Senza una via, l'elemento
                  -- e' libero anche col testo vuoto.
                  IF NULLIF(btrim(p_el ->> 'stradario_id'), '') IS NULL
                     AND NULLIF(btrim(p_el ->> 'toponomastica_id'), '') IS NULL
                     AND NULLIF(btrim(p_el ->> 'descrizione_via'), '') IS NULL THEN
                      RETURN NULL;
                  END IF;

                  RETURN anagrafiche.fn_create_indirizzo(
                      p_stradario_id      := (p_el ->> 'stradario_id')::integer,
                      p_toponomastica_id  := (p_el ->> 'toponomastica_id')::integer,
                      p_descrizione_via   := p_el ->> 'descrizione_via',
                      p_comune_id         := (p_el ->> 'comune_id')::integer,
                      p_codice_postale_id := (p_el ->> 'codice_postale_id')::integer,
                      p_civico            := (p_el ->> 'civico')::integer,
                      p_estensione_civico := NULLIF(btrim(p_el ->> 'estensione_civico'), ''),
                      p_palazzina         := NULLIF(btrim(p_el ->> 'palazzina'), ''),
                      p_scala             := NULLIF(btrim(p_el ->> 'scala'), ''),
                      p_piano             := NULLIF(btrim(p_el ->> 'piano'), ''),
                      p_interno           := NULLIF(btrim(p_el ->> 'interno'), ''));
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_indirizzo_elemento_dettaglio(jsonb) IS
                  'BB (2026-10-18): l''indirizzo normalizzato di un elemento letto da anagrafiche.fn_indirizzo_elemento. Indirizzo libero (indirizzo_libero non vuoto): NULL. indirizzo_dettaglio_id: quello. Nessuna chiave di una via (stradario_id, toponomastica_id, descrizione_via): NULL, la riga e'' libera e il guard della forma (anagrafiche.trgfn_indirizzi_guard_forma_libera) dice che cosa manca, anche per un elemento vuoto. Altrimenti la via (stradario_id, oppure toponomastica_id + descrizione_via + comune_id + codice_postale_id) e il civico, risolti da anagrafiche.fn_create_indirizzo, idempotente, che valida la via nuova (E_INDIRIZZO_VIA_NUOVA_INCOMPLETA). Chiamanti: anagrafiche.fn_crea_indirizzi_ruolo e fn_crea_indirizzo_soggetto. D-4 di Tid, richiesta BE in brief-db-processi-accensione-per-ambiente §6.11.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: il corpo di prima e' quello di 20261018-94.
              SELECT 1;
