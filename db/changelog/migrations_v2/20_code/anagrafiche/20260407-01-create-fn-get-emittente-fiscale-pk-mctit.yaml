# Liquibase changelog per Zero ERP
# CREATE anagrafiche.fn_get_emittente_fiscale_pk
# Restituisce anagrafiche.emittenti_fiscali.id (PK numerica reale)
# Affianca fn_get_emittente_fiscale_id (che invece ritorna soggetto_ruolo_id)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260407-01-create-fn-get-emittente-fiscale-pk-mctit.yaml

  - changeSet:
      id: 20260407-01-create-fn-get-emittente-fiscale-pk
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        Risolve l'emittente fiscale (PK numerica anagrafiche.emittenti_fiscali.id)
        per un billing_account, con catena: 1) mapping specifico in
        emittenti_fiscali_billing_account, 2) fallback al gestore globale
        (riga con BA NULL e is_default = true). Filtra per ef.attivo = true.
        Affianca fn_get_emittente_fiscale_id che restituisce soggetto_ruolo_id.
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: anagrafiche, tableName: emittenti_fiscali }
        - tableExists: { schemaName: anagrafiche, tableName: emittenti_fiscali_billing_account }
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_get_emittente_fiscale_pk(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE
              )
              RETURNS anagrafiche.emittenti_fiscali.id%TYPE
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE;
              BEGIN
                  -- Guard input: p_billing_account_id obbligatorio e > 0
                  IF p_billing_account_id IS NULL OR p_billing_account_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche',
                          'fn_get_emittente_fiscale_pk',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object(
                              'detail', 'p_billing_account_id obbligatorio e > 0',
                              'billing_account_id', p_billing_account_id
                          ),
                          NULL::uuid,
                          'p_billing_account_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Risoluzione PK emittente con priorita' via COALESCE.
                  -- COALESCE valuta in cortocircuito: se il mapping specifico esiste,
                  -- la subquery del fallback non viene eseguita.
                  -- Indici usati: uq_emittenti_fiscali_ba, uq_emittenti_fiscali_ruolo,
                  -- ix_emittenti_fiscali_attivo, uq_emittenti_fiscali_ba_default.
                  SELECT COALESCE(
                      -- 1) Mapping specifico per il billing_account
                      (SELECT ef.id
                         FROM anagrafiche.emittenti_fiscali_billing_account efba
                         JOIN anagrafiche.emittenti_fiscali ef
                           ON ef.soggetto_ruolo_id = efba.emittente_soggetto_ruolo_id
                        WHERE efba.billing_account_id = p_billing_account_id
                          AND ef.attivo = true
                        LIMIT 1),
                      -- 2) Fallback: gestore globale (BA NULL + is_default = true)
                      (SELECT ef.id
                         FROM anagrafiche.emittenti_fiscali_billing_account efba
                         JOIN anagrafiche.emittenti_fiscali ef
                           ON ef.soggetto_ruolo_id = efba.emittente_soggetto_ruolo_id
                        WHERE efba.billing_account_id IS NULL
                          AND efba.is_default = true
                          AND ef.attivo = true
                        LIMIT 1)
                  ) INTO v_emittente_fiscale_id;

                  -- Errore esplicito se ne' mapping specifico ne' default risolto
                  IF v_emittente_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche',
                          'fn_get_emittente_fiscale_pk',
                          'E_EMITTENTE_DEFAULT_MISSING',
                          jsonb_build_object(
                              'detail', 'Emittente fiscale di default mancante o disattivato',
                              'billing_account_id', p_billing_account_id
                          ),
                          NULL::uuid,
                          concat('Emittente fiscale di default mancante per billing_account_id ',
                                 p_billing_account_id::text)
                      );
                  END IF;

                  RETURN v_emittente_fiscale_id;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_get_emittente_fiscale_pk(anagrafiche.billing_account.id%TYPE)
              IS 'Restituisce anagrafiche.emittenti_fiscali.id (PK numerica reale) per un billing_account. '
                 'Catena: 1) mapping specifico in emittenti_fiscali_billing_account, '
                 '2) fallback al gestore globale (BA NULL + is_default=true). '
                 'Filtra per ef.attivo=true. Solleva E_EMITTENTE_DEFAULT_MISSING se nulla risolto. '
                 'Affianca fn_get_emittente_fiscale_id che invece ritorna soggetto_ruolo_id.';
