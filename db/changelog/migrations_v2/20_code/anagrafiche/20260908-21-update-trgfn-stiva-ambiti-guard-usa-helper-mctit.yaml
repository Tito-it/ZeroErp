# ------------------------------------------------------------
# H-2 — Il guard dell'ambito (righe figlie) chiama l'helper
#   anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard
#   Piano: brief-db-coda-primo-motivo-in-un-posto-solo, sezione 6
#
# -- PERCHE' -------------------------------------------------
#   Trigger `_z90_` AFTER: il tx_id c'e' perche' tutti i BEFORE sono
#   passati, non per l'ordine alfabetico. La riga resta `NEW.tx_id` e ora lo
#   dice.
#
# -- COSA CAMBIA, E COSA NO ----------------------------------
#   Cambia SOLO la coda che solleva il primo motivo della check. La TESTA —
#   quale check chiamare, su quali colonne, con quale confronto di no-op —
#   resta identica, ed e' il §3 del brief: due funzioni che finiscono uguali
#   non sono due funzioni da unire, sono due funzioni che chiamano la stessa
#   cosa.
#   ⛔ Il corpo di partenza e' quello VIVO (pg_get_functiondef), non uno YAML:
#   di questa funzione ci sono piu' revisioni e solo l'ultima conta.
#
# -- IL ROLLBACK --------------------------------------------
#   Rimette il corpo esattamente com'era prima di questo changeSet.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260908-21-update-trgfn-stiva-ambiti-guard-usa-helper-mctit.yaml

  - changeSet:
      id: 20260908-21-update-trgfn-stiva-ambiti-guard-usa-helper
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il guard dell'ambito (righe figlie) chiama l'helper. Trigger `_z90_` AFTER: il tx_id c''e''
        perche'' tutti i BEFORE sono passati, non per l''ordine alfabetico. La riga resta `NEW.tx_id` e
        ora lo dice. Piano: brief-db-coda-primo-motivo-in-un-posto-solo, sezione 6.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_raise_primo_motivo_se_presente';
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname = 'trgfn_soggetti_titoli_iva_ambiti_guard';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: rifiutare una riga di ambito che rende incoerente il
              --   titolo. Non riscrive il predicato: CHIAMA
              --   anagrafiche.fn_check_titolo_iva_ambito e solleva il PRIMO
              --   motivo. ⚠️ L'ordine dell'array e' il contratto: se cambiasse,
              --   il codice sollevato e il motivo mostrato direbbero cose diverse.
              DECLARE
                  -- ⛔ NUDI, e non per fretta: `v_motivi` e' il valore di ritorno di una
                  --   fn_check_* (nessuna colonna dietro). Non c'e' niente da ancorare.
                  v_motivi jsonb;
              BEGIN
                  v_motivi := anagrafiche.fn_check_titolo_iva_ambito(NEW.titolo_iva_id);

                  -- ⭐ La coda sta in un posto solo (20260908-17): quale motivo si solleva,
                  --   come si spacchettano i valori e come si compone il contesto li decide
                  --   l'helper. Qui resta la TESTA — quale check chiamare, su cosa.
                  -- ⚠️ `NEW.tx_id` e' giusto e non per l'ordine dei nomi: questo guard sta su
                  --   un trigger `_z90_` **AFTER**, quindi TUTTI i BEFORE — gen_tx_id
                  --   compreso — sono gia' passati.
                  -- ⚠️ L'ordine di fusione del contesto lo decide ora l'helper, e `campo`
                  --   VINCE sul `dettaglio`. Qui era il contrario; misurato il 2026-09-08,
                  --   nessuna fn_check_* del database mette `campo` dentro `dettaglio`,
                  --   quindi a video non cambia niente e la regola smette di essere doppia.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'anagrafiche', 'trgfn_soggetti_titoli_iva_ambiti_guard',
                      v_motivi,
                      'ambito',
                      NEW.tx_id);

                  -- ⭐ Ora RAGGIUNGIBILE, ed e' il ramo «passa»: l'helper tace quando la
                  --   check non ha trovato nessun motivo.
                  RETURN NEW;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: rifiutare una riga di ambito che rende incoerente il
              --   titolo. Non riscrive il predicato: CHIAMA
              --   anagrafiche.fn_check_titolo_iva_ambito e solleva il PRIMO
              --   motivo. ⚠️ L'ordine dell'array e' il contratto: se cambiasse,
              --   il codice sollevato e il motivo mostrato direbbero cose diverse.
              DECLARE
                  v_motivi jsonb;
                  v_primo  jsonb;
              BEGIN
                  v_motivi := anagrafiche.fn_check_titolo_iva_ambito(NEW.titolo_iva_id);

                  IF jsonb_array_length(v_motivi) = 0 THEN
                      RETURN NEW;
                  END IF;

                  v_primo := v_motivi -> 0;

                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', 'trgfn_soggetti_titoli_iva_ambiti_guard',
                      v_primo ->> 'codice',
                      jsonb_build_object('campo', 'ambito')
                          || COALESCE(v_primo -> 'dettaglio', '{}'::jsonb),
                      NEW.tx_id,
                      VARIADIC ARRAY(SELECT jsonb_array_elements_text(
                                         COALESCE(v_primo -> 'valori', '[]'::jsonb))));

                  RETURN NEW;   -- irraggiungibile: la riga sopra solleva sempre
              END;
              $function$;
