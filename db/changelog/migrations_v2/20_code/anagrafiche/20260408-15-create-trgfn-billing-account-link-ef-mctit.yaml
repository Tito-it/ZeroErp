# Liquibase changelog per Zero ERP
# CREATE anagrafiche.trgfn_billing_account_link_ef + trigger
# Auto-link BA -> emittente fiscale alla creazione (modello 1-a-1).
# WIP refactor-operatore-emittenti, sezione 2.4.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260408-15-create-trgfn-billing-account-link-ef-mctit.yaml

  - changeSet:
      id: 20260408-15-create-trgfn-billing-account-link-ef
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        Trigger AFTER INSERT su billing_account che crea automaticamente la riga
        in emittenti_fiscali_billing_account collegando il BA all'emittente
        dell'operatore corrente. Logica:
          1) Legge GUC app.current_user_id; se NULL -> RETURN NEW (seed/bootstrap)
          2) Risolve l'emittente via script.fn_resolve_emittente_for_user
          3) Se NULL (admin globale o "0 emittenti") -> RETURN NEW
          4) Altrimenti INSERT in emittenti_fiscali_billing_account con
             billing_account_id=NEW.id, is_default=false (mapping specifico)
        Il default globale (riga con BA NULL + is_default=true) NON viene toccato.
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: anagrafiche, tableName: billing_account }
        - tableExists: { schemaName: anagrafiche, tableName: emittenti_fiscali_billing_account }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_billing_account_link_ef()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_user_id integer;
                  v_emittente_id           anagrafiche.emittenti_fiscali.id%TYPE;
                  v_emittente_sr_id        anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_existing               bigint;
              BEGIN
                  -- 1) Lettura GUC utente corrente (settato dal middleware Django)
                  BEGIN
                      v_user_id := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  EXCEPTION WHEN OTHERS THEN
                      v_user_id := NULL;
                  END;

                  -- Seed/bootstrap senza utente => no auto-link
                  IF v_user_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- 2) Resolve emittente per l'operatore (PK reale)
                  v_emittente_id := script.fn_resolve_emittente_for_user(v_user_id);

                  -- 3) Admin globale o istanza "0 emittenti": niente da linkare.
                  --    Il guard BEFORE INSERT (a10) ha gia' bloccato il caso
                  --    "admin globale + emittenti presenti", quindi qui un NULL
                  --    significa solo "non c'e' nulla da linkare".
                  IF v_emittente_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- 4) La tabella di mapping usa emittente_soggetto_ruolo_id,
                  --    non la PK reale: lookup.
                  SELECT ef.soggetto_ruolo_id
                    INTO v_emittente_sr_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = v_emittente_id;

                  -- Difensivo: race con disattivazione emittente fra resolver e qui
                  IF v_emittente_sr_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- 5) Idempotenza: se esiste gia' un mapping (es. doppia
                  --    esecuzione del trigger o INSERT applicativa parallela)
                  --    non duplichiamo. uq_emittenti_fiscali_ba garantisce
                  --    unicita' su billing_account_id non NULL, ma il check
                  --    esplicito da' un errore piu' chiaro.
                  SELECT efba.id
                    INTO v_existing
                    FROM anagrafiche.emittenti_fiscali_billing_account efba
                   WHERE efba.billing_account_id = NEW.id
                   LIMIT 1;

                  IF v_existing IS NOT NULL THEN
                      RETURN NEW;
                  END IF;

                  -- 6) INSERT mapping specifico (is_default = false)
                  INSERT INTO anagrafiche.emittenti_fiscali_billing_account (
                      billing_account_id,
                      emittente_soggetto_ruolo_id,
                      is_default
                  ) VALUES (
                      NEW.id,
                      v_emittente_sr_id,
                      false
                  );

                  RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_billing_account_link_ef()
              IS 'Auto-link AFTER INSERT su billing_account: crea il mapping in emittenti_fiscali_billing_account collegando il BA all''emittente dell''operatore corrente (via GUC app.current_user_id e script.fn_resolve_emittente_for_user). is_default=false (mapping specifico). Skip in caso di seed/bootstrap o "0 emittenti".';

              -- Creazione/sostituzione idempotente del trigger
              DROP TRIGGER IF EXISTS trg_billing_account_z90_link_ef_ins
                ON anagrafiche.billing_account;

              CREATE TRIGGER trg_billing_account_z90_link_ef_ins
              AFTER INSERT ON anagrafiche.billing_account
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_billing_account_link_ef();
