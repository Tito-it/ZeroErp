# ------------------------------------------------------------
# anagrafiche.trgfn_iu_sync_catasto_unita_indirizzo: quando un'istanza cambia
#   civico o unita', la coppia che aveva portato esce dalla ponte, e l'unita'
#   che nessuna istanza nomina piu' si cancella.
#   D-T7b-7 di Tid (2026-11-25), brief-db-revisione-anagrafiche §22 (S47).
#
# -- IL DIFETTO -------------------------------------------------------------------
#   La funzione aggiungeva la coppia (unita', civico) a ogni cambio dell'una o
#   dell'altro e non toglieva la vecchia. La coppia lasciata teneva acceso il
#   guard ATTIVO del civico, che non si spegneva piu'. E un'istanza passata a
#   un'altra unita' lasciava la prima senza nessuno che la nominasse: nessuna
#   FK vi arriva da altrove, e la si raggiungeva solo dallo storico.
#
# -- LA REGOLA (D-T7b-7) ----------------------------------------------------------
#   (a) Al cambio, la coppia (unita' di prima, civico di prima) esce dalla ponte
#       se nessun'altra istanza ha la stessa coppia: e' la coppia che l'istanza
#       aveva portato, e con S11 (90_end -46) l'unita' era sua. Le coppie
#       scritte a mano con altri civici restano: la ponte e' molti a molti.
#   (b) L'unita' di prima che nessuna istanza nomina piu' si cancella nello
#       stesso momento: lo storico continuo di catasto_unita_immobiliari (z90)
#       tiene la versione, la ponte la segue in cascata.
#   Poi, come prima, la coppia nuova entra (idempotente).
#   Il trigger e' AFTER: la tabella mostra gia' la riga nuova, quindi
#   «un'altra istanza» si legge senza escludere se stessa.
#   La cancellazione dell'istanza non tocca l'unita' (§22.4, debito residuo).
#
# -- LA FORMA ------------------------------------------------------------------------
#   Solo il corpo. I montaggi (INSERT; UPDATE col WHEN sul cambio) li scrive
#   -42.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261125-41-update-trgfn-iu-sync-catasto-coppia-e-unita-lasciate-mctit.yaml

  - changeSet:
      id: 20261125-41-update-trgfn-iu-sync-catasto-coppia-e-unita-lasciate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.trgfn_iu_sync_catasto_unita_indirizzo: al cambio di civico o di unita' la coppia di
        prima esce dalla ponte e l'unita' che nessuno nomina piu' si cancella. D-T7b-7,
        brief-db-revisione-anagrafiche §22.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_iu_sync_catasto_unita_indirizzo()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $fn$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La tabella ponte catasto_unita_immobiliari_indirizzi e
                  --   l'unita' catastale seguono l'istanza.
                  --
                  -- Regole (AFTER: la tabella mostra gia' la riga nuova):
                  --   1. UPDATE: la coppia (unita', civico) di prima esce dalla
                  --      ponte se nessun'altra istanza ha la stessa coppia;
                  --   2. UPDATE che cambia unita': l'unita' di prima che
                  --      nessuna istanza nomina piu' si cancella (lo storico
                  --      tiene la versione, la ponte la segue in cascata);
                  --   3. la coppia nuova entra, idempotente.
                  -- =========================================================
                  IF TG_OP = 'UPDATE' THEN
                      -- 1) La coppia di prima.
                      IF OLD.catasto_unita_immobiliare_id IS NOT NULL
                         AND OLD.indirizzo_dettaglio_id IS NOT NULL
                         AND NOT EXISTS (
                             SELECT 1
                               FROM anagrafiche.istanze_utilities iu
                              WHERE iu.catasto_unita_immobiliare_id = OLD.catasto_unita_immobiliare_id
                                AND iu.indirizzo_dettaglio_id       = OLD.indirizzo_dettaglio_id)
                      THEN
                          DELETE FROM anagrafiche.catasto_unita_immobiliari_indirizzi x
                           WHERE x.catasto_unita_id       = OLD.catasto_unita_immobiliare_id
                             AND x.indirizzo_dettaglio_id = OLD.indirizzo_dettaglio_id;
                      END IF;

                      -- 2) L'unita' di prima, se nessuno la nomina piu'.
                      IF OLD.catasto_unita_immobiliare_id IS NOT NULL
                         AND OLD.catasto_unita_immobiliare_id IS DISTINCT FROM NEW.catasto_unita_immobiliare_id
                         AND NOT EXISTS (
                             SELECT 1
                               FROM anagrafiche.istanze_utilities iu
                              WHERE iu.catasto_unita_immobiliare_id = OLD.catasto_unita_immobiliare_id)
                      THEN
                          DELETE FROM anagrafiche.catasto_unita_immobiliari u
                           WHERE u.id = OLD.catasto_unita_immobiliare_id;
                      END IF;
                  END IF;

                  -- 3) La coppia nuova.
                  IF NEW.catasto_unita_immobiliare_id IS NOT NULL AND NEW.indirizzo_dettaglio_id IS NOT NULL THEN
                      INSERT INTO anagrafiche.catasto_unita_immobiliari_indirizzi (
                          catasto_unita_id,
                          indirizzo_dettaglio_id)
                      VALUES (
                          NEW.catasto_unita_immobiliare_id,
                          NEW.indirizzo_dettaglio_id)
                      ON CONFLICT ON CONSTRAINT uq_catunitaindir
                      DO NOTHING;
                  END IF;

                  RETURN NULL;
              END;
              $fn$;

              COMMENT ON FUNCTION anagrafiche.trgfn_iu_sync_catasto_unita_indirizzo()
                  IS 'Trigger AFTER su anagrafiche.istanze_utilities, all''INSERT con unita'' e civico e all''UPDATE che cambia l''uno o l''altro: la tabella ponte catasto_unita_immobiliari_indirizzi e l''unita'' catastale seguono l''istanza. Al cambio la coppia (unita'', civico) di prima esce dalla ponte se nessun''altra istanza ha la stessa coppia (le coppie scritte a mano con altri civici restano), e l''unita'' di prima che nessuna istanza nomina piu'' si cancella (lo storico continuo tiene la versione, la ponte la segue in cascata). Poi la coppia nuova entra, idempotente. La regola sta nella guida catasto-delle-istanze.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: la coppia e l'unita' lasciate erano il difetto.
              SELECT 1;
