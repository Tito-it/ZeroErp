# ------------------------------------------------------------
# IL BILLING ACCOUNT NON SI CANCELLA: IL CLIENTE SI ANNULLA
#   trg_billing_account_a05_block_delete_dlt
#     BEFORE DELETE ON anagrafiche.billing_account
#     EXECUTE FUNCTION script.trgfn_prevent_modification_generic('E_BA_NON_SI_CANCELLA', 'codice')
#   Brief: brief-db-revisione-anagrafiche §24.7.1 (risposte di Tid, 2026-11-26)
#
# -- LA REGOLA --------------------------------------------------------
#   Tid, 2026-11-26: «il cliente e' giusto che sia non cancellabile, c'e' la
#   possibilita' di mettere lo stato ad annullato, usiamo quello». Il billing
#   account non ha uno stato: lo ha il suo cliente (anagrafiche.clienti,
#   stato_cliente_id, «AN» annulla servizio), e un BA ha un solo cliente.
#   Cancellare un BA lascerebbe il suo collegamento all'azienda senza conto, e
#   il collegamento non si cancella (20261126-30).
#
# -- LA FORMA ---------------------------------------------------------
#   * Il building block «rifiuta sempre», senza porte e anche per il
#     proprietario. Letto il 2026-11-26: nessuna funzione del DB e nessun
#     punto del backend cancellano un BA; lo facevano tre pgTAP, riscritti nel
#     giro.
#   * La frase nomina il BA per codice.
#   * Fase a05: parla prima del guard differito
#     trg_billing_account_z90_require_istanza_ha_ba_dlt, che giudicava
#     l'istanza rimasta senza BA.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-40-create-trg-billing-account-block-delete-mctit.yaml

  - changeSet:
      id: 20261126-40-create-trg-billing-account-block-delete
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il billing account non si cancella (il cliente si annulla): script.trgfn_prevent_modification_generic
        montato BEFORE DELETE su anagrafiche.billing_account (E_BA_NON_SI_CANCELLA).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_billing_account_a05_block_delete_dlt
                  ON anagrafiche.billing_account;
              CREATE TRIGGER trg_billing_account_a05_block_delete_dlt
                  BEFORE DELETE ON anagrafiche.billing_account
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_prevent_modification_generic('E_BA_NON_SI_CANCELLA', 'codice');

              COMMENT ON TRIGGER trg_billing_account_a05_block_delete_dlt
                  ON anagrafiche.billing_account IS
                'Il billing account non si cancella: il cliente si chiude annullandolo (anagrafiche.clienti, stato «annulla servizio»), e il collegamento all''azienda resta (E_BA_NON_SI_CANCELLA).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_billing_account_a05_block_delete_dlt
                  ON anagrafiche.billing_account;
