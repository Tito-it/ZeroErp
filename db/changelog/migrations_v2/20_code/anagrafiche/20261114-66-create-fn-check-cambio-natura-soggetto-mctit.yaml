# LA REGOLA DEL CAMBIO DI NATURA: I MOTIVI, TUTTI, IN UN POSTO SOLO
#   anagrafiche.fn_check_cambio_natura_soggetto(soggetto, natura nuova,
#                                               partita_iva, cliente_pa, split_payment) -> jsonb
#   Brief: brief-db-cambio-natura-soggetto-conferma-e-pulizia §0, D-5 … D-8
#   (Tid, 2026-11-14), giro 2.
#
# ── IL MODELLO (D-5) ────────────────────────────────────────────
#   Il cambio di natura non pulisce mai niente: la regola ELENCA i motivi per
#   cui non si puo' fare, e chi agisce li toglie a mano. La leggono il guard del
#   cambio (-67), che solleva il primo, e il picker delle nature (-68), che
#   spegne la natura col suo motivo (linee-guida-sql §12.6).
#
# ── I MOTIVI, NELL'ORDINE ───────────────────────────────────────
#   1. natura di un'altra macro-tipologia (tipo_soggetto_id diverso): torna da
#      solo, gli altri non hanno senso;
#   2. l'identita' fiscale cambia (formato_piva NON_APPLICABILE da una parte
#      sola) e il soggetto compare in un documento, in qualunque ruolo (D-6,
#      D-8, anagrafiche.fn_soggetto_primo_documento): definitivo;
#   3. P.IVA proposta su una natura NON_APPLICABILE (svuotarla e' del SUPER_ADMIN,
#      trgfn_soggetti_guard_id_fiscale_immutabile);
#   4. cliente_pa / split_payment proposti a S e non ammessi
#      (anagrafiche.fn_regime_pa_campo_non_ammesso, i due flag uno per volta);
#   5. titoli IVA vigenti non ammessi che chi agisce vede
#      (anagrafiche.fn_titoli_iva_non_ammessi sotto la sua RLS);
#   6. titoli IVA vigenti non ammessi che chi agisce NON vede: il totale
#      (anagrafiche.fn_titoli_iva_non_ammessi_conta, DEFINER) meno i visibili;
#   7. riga di dati societari, natura nuova senza dati societari (NONE);
#   8. indirizzi di un tipo che la natura nuova non ammette
#      (anagrafiche.fn_tipo_indirizzo_ammesso_per_natura).
#   Forma giuridica, sesso, P.IVA mancante e indirizzi obbligatori NON sono
#   motivi: l'operatore li da' nello stesso salvataggio e li giudicano i guard
#   dello stato finale (D-2).
#   Natura nuova NULL: l'unico motivo e' il titolo vigente
#   (E_DATO_FISCALE_SENZA_TIPO_SOGGETTO), come il guard che questa regola
#   assorbe (trgfn_soggetti_guard_titoli_iva_ammessi, ritirato in -67).
#
# ── LA FORMA ────────────────────────────────────────────────────
#   Check pura (linee-guida-sql §5): nessun raise di dominio, nessuna
#   scrittura. Array ORDINATO di {codice, reason, reason_key, dettaglio,
#   valori}, la forma di script.fn_check_annullo_movimento_titolo_iva; il
#   `campo` sta nel dettaglio, e script.fn_raise_primo_motivo_se_presente lo
#   porta nel contesto. I valori della RIGA (P.IVA, flag) entrano come
#   parametri: sono i valori PROPOSTI, che un BEFORE ROW non puo' rileggere
#   dalla tabella (linee-guida-trigger). La natura vecchia si legge dalla riga
#   salvata: e' quella che il cambio lascia.
#   ⭐ INVOKER: i titoli «visibili» sono quelli della RLS di chi agisce. Le
#   letture sopra la RLS (documenti, totale dei titoli) le fanno le due DEFINER,
#   che rispondono il minimo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-66-create-fn-check-cambio-natura-soggetto-mctit.yaml

  - changeSet:
      id: 20261114-66-create-fn-check-cambio-natura-soggetto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I motivi per cui un soggetto non puo' cambiare natura, in ordine: check pura letta dal
        guard del cambio e dal picker delle nature.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_cambio_natura_soggetto(
                  p_soggetto_id                anagrafiche.soggetti.id%TYPE,
                  p_tipo_soggetto_dettaglio_id anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE,
                  p_partita_iva                anagrafiche.soggetti.partita_iva%TYPE,
                  p_cliente_pa                 anagrafiche.soggetti.cliente_pa%TYPE,
                  p_split_payment              anagrafiche.soggetti.split_payment%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_motivi       jsonb := '[]'::jsonb;
                  v_vecchia_id   anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_vecchia      record;
                  v_nuova        record;
                  v_nuova_nome   config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_vecchia_nome config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_doc          config.sorgenti.codice_interno%TYPE;
                  v_doc_nome     config.sorgenti.etichetta%TYPE;
                  v_tit_tipo     config.tipi_titolo_iva.descrizione%TYPE;
                  v_tit_visibili integer;  -- conteggi: nessuna colonna di cui siano il riflesso
                  v_tit_tutti    integer;
                  v_ind_n        integer;
                  v_ind_tipo     config.tipi_indirizzi.descrizione%TYPE;
                  v_dettaglio    jsonb;
              BEGIN
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_check_cambio_natura_soggetto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_soggetto_id', 'valore', NULL),
                          NULL::uuid,
                          'il soggetto e'' obbligatorio');
                  END IF;

                  SELECT s.tipo_soggetto_dettaglio_id
                    INTO v_vecchia_id
                    FROM anagrafiche.soggetti s
                   WHERE s.id = p_soggetto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_check_cambio_natura_soggetto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_soggetto_id', 'valore', p_soggetto_id),
                          NULL::uuid,
                          'il soggetto non esiste');
                  END IF;

                  -- Nessun cambio, nessun motivo.
                  IF v_vecchia_id IS NOT DISTINCT FROM p_tipo_soggetto_dettaglio_id THEN
                      RETURN v_motivi;
                  END IF;

                  v_dettaglio := jsonb_build_object(
                      'campo',                      'tipo_soggetto_dettaglio_id',
                      'soggetto_id',                p_soggetto_id,
                      'tipo_soggetto_dettaglio_id', p_tipo_soggetto_dettaglio_id);

                  -- ---- Natura nuova NULL: resta solo il titolo vigente ------
                  IF p_tipo_soggetto_dettaglio_id IS NULL THEN
                      IF anagrafiche.fn_titoli_iva_non_ammessi_conta(p_soggetto_id, NULL) > 0 THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     'E_DATO_FISCALE_SENZA_TIPO_SOGGETTO',
                              'reason',     'SENZA_NATURA_CON_TITOLI_IVA',
                              'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.senza_natura_con_titoli_iva',
                              'dettaglio',  v_dettaglio,
                              'valori',     '[]'::jsonb);
                      END IF;
                      RETURN v_motivi;
                  END IF;

                  SELECT tsd.tipo_soggetto_id, tsd.formato_piva, tsd.dati_societari_policy,
                         COALESCE(tsd.descrizione, tsd.codice_interno) AS nome
                    INTO v_nuova
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = p_tipo_soggetto_dettaglio_id;

                  IF NOT FOUND THEN
                      RETURN v_motivi;   -- natura inesistente: parla la FK
                  END IF;
                  v_nuova_nome := v_nuova.nome;

                  IF v_vecchia_id IS NOT NULL THEN
                      SELECT tsd.tipo_soggetto_id, tsd.formato_piva,
                             COALESCE(tsd.descrizione, tsd.codice_interno) AS nome
                        INTO v_vecchia
                        FROM config.tipi_soggetto_dettaglio tsd
                       WHERE tsd.id = v_vecchia_id;
                      v_vecchia_nome := v_vecchia.nome;

                      -- ---- 1. un'altra macro-tipologia: torna da solo ----------
                      IF v_vecchia.tipo_soggetto_id IS DISTINCT FROM v_nuova.tipo_soggetto_id THEN
                          RETURN v_motivi || jsonb_build_object(
                              'codice',     'E_CAMBIO_NATURA_ALTRA_MACRO_TIPOLOGIA',
                              'reason',     'ALTRA_MACRO_TIPOLOGIA',
                              'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.altra_macro_tipologia',
                              'dettaglio',  v_dettaglio,
                              'valori',     jsonb_build_array(v_vecchia_nome, v_nuova_nome));
                      END IF;

                      -- ---- 2. l'identita' fiscale cambia, con documenti ---------
                      IF (v_vecchia.formato_piva = 'NON_APPLICABILE')
                         IS DISTINCT FROM (v_nuova.formato_piva = 'NON_APPLICABILE') THEN
                          v_doc := anagrafiche.fn_soggetto_primo_documento(p_soggetto_id);
                          IF v_doc IS NOT NULL THEN
                              SELECT s.etichetta INTO v_doc_nome
                                FROM config.sorgenti s WHERE s.codice_interno = v_doc;
                              v_motivi := v_motivi || jsonb_build_object(
                                  'codice',     'E_CAMBIO_NATURA_CON_DOCUMENTI',
                                  'reason',     'CON_DOCUMENTI',
                                  'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.con_documenti',
                                  'dettaglio',  v_dettaglio || jsonb_build_object('sorgente', v_doc),
                                  'valori',     jsonb_build_array(v_nuova_nome, COALESCE(v_doc_nome, v_doc)));
                          END IF;
                      END IF;
                  END IF;

                  -- ---- 3. P.IVA su una natura che non ne ha -------------------
                  IF v_nuova.formato_piva = 'NON_APPLICABILE'
                     AND NULLIF(btrim(p_partita_iva), '') IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_CAMBIO_NATURA_PIVA_NON_APPLICABILE',
                          'reason',     'PIVA_NON_APPLICABILE',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.piva_non_applicabile',
                          'dettaglio',  v_dettaglio || jsonb_build_object('campo', 'partita_iva'),
                          'valori',     jsonb_build_array(v_nuova_nome));
                  END IF;

                  -- ---- 4. i flag del regime PA, uno per volta ---------------
                  IF anagrafiche.fn_regime_pa_campo_non_ammesso(
                         p_tipo_soggetto_dettaglio_id, p_cliente_pa, 'N') = 'cliente_pa' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_CLIENTE_PA_NON_AMMESSO',
                          'reason',     'CLIENTE_PA',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.cliente_pa',
                          'dettaglio',  v_dettaglio || jsonb_build_object('campo', 'cliente_pa'),
                          'valori',     jsonb_build_array(v_nuova_nome));
                  END IF;
                  IF anagrafiche.fn_regime_pa_campo_non_ammesso(
                         p_tipo_soggetto_dettaglio_id, 'N', p_split_payment) = 'split_payment' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_SPLIT_PAYMENT_NON_AMMESSO',
                          'reason',     'SPLIT_PAYMENT',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.split_payment',
                          'dettaglio',  v_dettaglio || jsonb_build_object('campo', 'split_payment'),
                          'valori',     jsonb_build_array(v_nuova_nome));
                  END IF;

                  -- ---- 5. e 6. i titoli IVA: visibili, poi di altri emittenti -
                  SELECT count(*)::integer,
                         (array_agg(tt.descrizione ORDER BY t.ordine, t.tipo_titolo_iva_id, t.titolo_iva_id))[1]
                    INTO v_tit_visibili, v_tit_tipo
                    FROM anagrafiche.fn_titoli_iva_non_ammessi(p_soggetto_id, p_tipo_soggetto_dettaglio_id) t
                    JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id;
                  v_tit_tutti := anagrafiche.fn_titoli_iva_non_ammessi_conta(
                                     p_soggetto_id, p_tipo_soggetto_dettaglio_id);

                  IF v_tit_visibili > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TIPO_SOGGETTO_CON_TITOLI_IVA_NON_AMMESSI',
                          'reason',     'TITOLI_IVA',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.titoli_iva',
                          'dettaglio',  v_dettaglio || jsonb_build_object('titoli', v_tit_visibili),
                          'valori',     jsonb_build_array(v_nuova_nome, v_tit_tipo));
                  END IF;
                  IF v_tit_tutti > v_tit_visibili THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_CAMBIO_NATURA_TITOLI_ALTRI_EMITTENTI',
                          'reason',     'TITOLI_IVA_ALTRI_EMITTENTI',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.titoli_iva_altri_emittenti',
                          'dettaglio',  v_dettaglio || jsonb_build_object('titoli', v_tit_tutti - v_tit_visibili),
                          'valori',     jsonb_build_array(v_nuova_nome, (v_tit_tutti - v_tit_visibili)::text));
                  END IF;

                  -- ---- 7. i dati societari su una natura che non ne ha -------
                  IF v_nuova.dati_societari_policy = 'NONE'
                     AND EXISTS (SELECT 1 FROM anagrafiche.dati_societari d
                                  WHERE d.soggetto_id = p_soggetto_id) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_CAMBIO_NATURA_CON_DATI_SOCIETARI',
                          'reason',     'DATI_SOCIETARI',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.dati_societari',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(v_nuova_nome));
                  END IF;

                  -- ---- 8. gli indirizzi di un tipo che la natura non ammette -
                  SELECT count(*)::integer,
                         (array_agg(ti.descrizione ORDER BY ti.id, i.id))[1]
                    INTO v_ind_n, v_ind_tipo
                    FROM anagrafiche.indirizzi_soggetti i
                    JOIN config.tipi_indirizzi ti ON ti.id = i.tipo_indirizzo_id
                   WHERE i.soggetto_id = p_soggetto_id
                     AND NOT anagrafiche.fn_tipo_indirizzo_ammesso_per_natura(
                                 p_tipo_soggetto_dettaglio_id, i.tipo_indirizzo_id,
                                 script.fn_data_operativa());

                  IF v_ind_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_CAMBIO_NATURA_INDIRIZZI_NON_AMMESSI',
                          'reason',     'INDIRIZZI',
                          'reason_key', 'anagrafiche.soggetti.cambio_natura_blocco.indirizzi',
                          'dettaglio',  v_dettaglio || jsonb_build_object('indirizzi', v_ind_n),
                          'valori',     jsonb_build_array(v_nuova_nome, v_ind_tipo, v_ind_n::text));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_cambio_natura_soggetto(
                  anagrafiche.soggetti.id%TYPE,
                  anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE,
                  anagrafiche.soggetti.partita_iva%TYPE,
                  anagrafiche.soggetti.cliente_pa%TYPE,
                  anagrafiche.soggetti.split_payment%TYPE)
              IS 'I motivi per cui il soggetto non puo'' passare alla natura di dettaglio data: check pura, array ordinato di {codice, reason, reason_key, dettaglio, valori}, [] se il cambio si puo'' fare o se la natura non cambia. Il cambio non pulisce niente: i motivi si tolgono a mano. In ordine: un''altra macro-tipologia (E_CAMBIO_NATURA_ALTRA_MACRO_TIPOLOGIA, da solo); l''identita'' fiscale che cambia (P.IVA che nasce o sparisce) con il soggetto in un documento, in qualunque ruolo (E_CAMBIO_NATURA_CON_DOCUMENTI, anagrafiche.fn_soggetto_primo_documento); la P.IVA proposta su una natura che non ne ha (E_CAMBIO_NATURA_PIVA_NON_APPLICABILE); cliente_pa e split_payment proposti a S e non ammessi (E_CLIENTE_PA_NON_AMMESSO, E_SPLIT_PAYMENT_NON_AMMESSO, anagrafiche.fn_regime_pa_campo_non_ammesso); titoli IVA vigenti non ammessi visibili a chi agisce (E_TIPO_SOGGETTO_CON_TITOLI_IVA_NON_AMMESSI) e non visibili, di altri emittenti (E_CAMBIO_NATURA_TITOLI_ALTRI_EMITTENTI); la riga di dati societari su una natura senza dati societari (E_CAMBIO_NATURA_CON_DATI_SOCIETARI); indirizzi di un tipo non ammesso (E_CAMBIO_NATURA_INDIRIZZI_NON_AMMESSI, anagrafiche.fn_tipo_indirizzo_ammesso_per_natura). Natura nuova NULL: solo i titoli vigenti (E_DATO_FISCALE_SENZA_TIPO_SOGGETTO). P.IVA e flag sono i valori proposti; la natura vecchia e'' quella salvata. Forma giuridica, sesso e indirizzi obbligatori non sono motivi: li giudicano i guard dello stato finale. SECURITY INVOKER: i titoli visibili sono quelli della RLS di chi chiama. Soggetto NULL o inesistente: E_PARAMETRO_INVALIDO. La leggono anagrafiche.trgfn_soggetti_guard_cambio_natura e anagrafiche.fn_nature_proponibili_soggetto.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP FUNCTION IF EXISTS anagrafiche.fn_check_cambio_natura_soggetto(uuid, bigint, text, character, character);
