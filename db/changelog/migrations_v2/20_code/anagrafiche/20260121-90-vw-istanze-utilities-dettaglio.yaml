databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251207-03-vw-istanze-utilities-dettaglio.yaml

    - changeSet:
          id: 20251207-03-vw-istanze-utilities-dettaglio
          author: mctit
          comment: >
              Crea/aggiorna la view anagrafiche.vw_istanze_utilities_dettaglio
              per la consultazione delle istanze utilities con soggetto,
              PDP, stato tecnico, utility e indirizzo completo
              (comune, provincia, CAP, via, civico).
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        CREATE OR REPLACE VIEW anagrafiche.vw_istanze_utilities_dettaglio AS
                        SELECT
                            iu.id                          AS istanza_id,
                            iu.codice                      AS istanza_codice,
                            iu.proprietario_inquilino,
                            iu.fittizia,
                            iu.soggetto_id,
                            s.ragione_sociale_completa,
                            s.id_fiscale_univoco_cf_piva,
                            iu.pdp_id,
                            p.pdp                          AS pdp_codice,
                            p.stato_pdp_id,
                            sp.codice_interno              AS stato_pdp_codice,
                            sp.codice                      AS stato_pdp_descrizione,
                            p.utilities_id,
                            u.codice_interno               AS utility_codice,
                            u.descrizione                  AS utility_descrizione,
                            iu.parent_istanza_id,

                            -- indirizzo_dettaglio
                            iu.indirizzo_dettaglio_id,
                            idv.indirizzo_normalizzato,
                            idv.via_norm,
                            idv.civico,
                            idv.estensione_civico,
                            idv.palazzina,
                            idv.scala,
                            idv.piano,
                            idv.interno,
                            idv.altro,
                            idv.civic_geoloc,
                            idv.street_geoloc,
                            idv.comune_id                  AS indirizzo_comune_id,

                            -- dati “estesi” da vw_indirizzo_completo
                            ic.comune                      AS comune_descrizione,
                            ic.provincia                   AS provincia_sigla,
                            ic.codice_postale              AS cap,
                            ic.indirizzo_generale,
                            ic.tipo_toponimo,
                            ic.nome_strada,

                            -- audit istanza
                            iu.tx_id,
                            iu.data_insert,
                            iu.user_insert,
                            iu.data_update,
                            iu.user_update

                        FROM anagrafiche.istanze_utilities iu
                        JOIN anagrafiche.soggetti s
                        ON s.id = iu.soggetto_id
                        LEFT JOIN anagrafiche.pdp p
                        ON p.id = iu.pdp_id
                        LEFT JOIN config.stati_pdp sp
                        ON sp.id = p.stato_pdp_id
                        LEFT JOIN config.utilities u
                        ON u.id = p.utilities_id
                        LEFT JOIN anagrafiche.vw_indirizzi_dettaglio idv
                        ON idv.indirizzo_dettaglio_id = iu.indirizzo_dettaglio_id
                        LEFT JOIN script.vw_indirizzo_completo ic
                        ON ic.id_stradario = idv.stradario_id;


                        COMMENT ON VIEW anagrafiche.vw_istanze_utilities_dettaglio IS
                            'Vista di dettaglio sulle istanze utility: 
                            include soggetto, PDP, stato tecnico, utility e
                             indirizzo completo (comune, provincia, CAP, via, civico).';
