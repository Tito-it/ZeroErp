# L'AZIENDA PREDEFINITA E' UNA E UNA SOLA: IL GUARD DICE CHE COSA FA, E CHI E'
#   anagrafiche.trgfn_emittenti_fiscali_default_guard()        (corpo, COMMENT)
#   Brief: brief-db-revisione-anagrafiche §15.2, §25.3, §25.9 (D-T8b-4)
#
# -- CHE COSA CAMBIA --------------------------------------------------
#   Nessun predicato. Il corpo non aveva lo Scopo, passava TG_NAME (il nome
#   del trigger) dove il rubinetto vuole il nome della funzione, e i due
#   conteggi erano integer contro il bigint di count(*). Il COMMENT non diceva
#   dove parla il guard rispetto agli altri presidi del collegamento predefinito.
#
# -- DOVE PARLA, E PERCHE' RESTA -----------------------------------------
#   Montato come CONSTRAINT TRIGGER differito su
#   anagrafiche.emittenti_fiscali_billing_account
#   (trg_emittenti_fiscali_ba_a10_default_guard_ins_upd_dlt). Il secondo
#   collegamento predefinito lo ferma prima uq_emittenti_fiscali_ba_default;
#   la riga predefinita non si cancella (trg_emittenti_fiscali_ba_a05_block_delete_dlt)
#   e non si sposta (trg_emittenti_fiscali_ba_a05_block_sposta_upd), senza
#   porte. Il guard parla quindi per «nessuna predefinita» con almeno
#   un'azienda, che solo una via di servizio raggiunge: e' la rete, e un guard
#   non si restringe perche' oggi il ramo e' irraggiungibile.
#   Presidio: db/pgtap/anagrafiche/test-emittenti-fiscali-default-singleton-v1.sql.
#
# -- IL CORPO ---------------------------------------------------------
#   Dal vivo del catalogo (pg_get_functiondef dello scratch, 2026-11-27).
#   Attributi vivi invariati: VOLATILE, INVOKER, COST 100, nessuna SET; il
#   montaggio non si tocca. Le due tabelle lette non hanno la RLS.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261126-89-update-trgfn-emittenti-fiscali-default-guard-scopo-mctit.yaml

  - changeSet:
      id: 20261126-89-update-trgfn-emittenti-fiscali-default-guard-scopo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        trgfn_emittenti_fiscali_default_guard: Scopo, nome della funzione nel
        log, conteggi bigint, COMMENT al presente. Nessun predicato cambia.
        brief-db-revisione-anagrafiche §25.9 (D-T8b-4).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_emittenti_fiscali_default_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- due conteggi (count(*)): nessuna colonna dietro
                  v_count     bigint;
                  v_emittenti bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo: con almeno un'azienda, il collegamento predefinito
                  --   (la riga di emittenti_fiscali_billing_account con
                  --   is_default e senza billing account) e' uno e uno solo.
                  --   CONSTRAINT TRIGGER differito su ogni INSERT, UPDATE e
                  --   DELETE del collegamento: si giudica a transazione finita.
                  --
                  -- ⚠️ Dove parla: il secondo predefinito lo ferma prima
                  --   uq_emittenti_fiscali_ba_default, e la riga predefinita
                  --   non si cancella ne' si sposta (a05_block_delete,
                  --   a05_block_sposta). Qui resta «nessuna predefinita», che
                  --   solo una via di servizio raggiunge: e' la rete.
                  -- =========================================================
                  SELECT count(*)
                    INTO v_emittenti
                    FROM anagrafiche.emittenti_fiscali;

                  SELECT count(*)
                    INTO v_count
                    FROM anagrafiche.emittenti_fiscali_billing_account
                   WHERE is_default = true;

                  -- Installazione vuota: nessuna azienda, nessuna predefinita.
                  IF v_emittenti = 0 AND v_count = 0 THEN
                      RETURN NULL;
                  END IF;

                  IF v_count <> 1 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche',
                          'trgfn_emittenti_fiscali_default_guard',
                          'E_EMITTENTE_DEFAULT_SINGLETON',
                          jsonb_build_object(
                              'found', v_count,
                              'emittenti_fiscali', v_emittenti,
                              'trigger', TG_NAME
                          ),
                          NULL::uuid,
                          v_count::text
                      );
                  END IF;

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_emittenti_fiscali_default_guard() IS
                'Guard differito (CONSTRAINT TRIGGER DEFERRABLE INITIALLY DEFERRED, AFTER INSERT, UPDATE e DELETE) su anagrafiche.emittenti_fiscali_billing_account: con almeno un''azienda, il collegamento predefinito (is_default, senza billing account) e'' uno e uno solo, altrimenti E_EMITTENTE_DEFAULT_SINGLETON col numero trovato. Un''installazione senza aziende e senza predefinita passa. Il secondo predefinito lo ferma prima l''indice uq_emittenti_fiscali_ba_default; la riga predefinita non si cancella e non si sposta (script.trgfn_prevent_modification_generic, senza porte): il guard parla per la predefinita che manca, che solo una via di servizio raggiunge, ed e'' la rete. La prima azienda creata diventa predefinita da sola (anagrafiche.trgfn_emittenti_fiscali_default_bootstrap).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: solo commenti, tipi dei conteggi e contesto.
              SELECT 1;
