# ------------------------------------------------------------
# «QUESTO INDIRIZZO DEL SOGGETTO SI PUO' COPIARE?» — IL MOTIVO DI RIGA DI «COPIA COME…»
#   anagrafiche.fn_check_copia_indirizzo_soggetto(indirizzo del soggetto) -> jsonb
#   Brief: brief-db-copia-indirizzo-soggetto §4.5, giro 3.
#
# ── LA REGOLA (linee-guida-sql §12.5.1) ─────────────────────────
#   L'azione vive sulla riga dell'indirizzo, ed e' spenta quando la riga non si
#   puo' copiare in NESSUN tipo. Un motivo solo:
#   * NESSUN_TIPO_PROPONIBILE  E_INDIRIZZO_COPIA_NESSUN_TIPO (nuovo)
#     il picker del soggetto (anagrafiche.fn_tipi_indirizzo_proponibili_soggetto,
#     20261114-96) non ha un tipo ammesso: tutti i tipi che la natura ammette il
#     soggetto li ha gia'. Si legge il picker, non si riscrive la regola.
#   Il codice e' nuovo perche' la madre che lo solleva e' nuova (il verbo della
#   copia, -36): nessuna strada rifiutava gia' questo stato.
#
# ── CIO' CHE NON C'E', E PERCHE' ────────────────────────────────
#   Il brief (§4.5) proponeva anche DETTAGLIO_NON_ATTIVO («la riga punta a un
#   dettaglio spento»). Il modello non ammette quello stato: la riga che punta a
#   un dettaglio spento la rifiuta trgfn_child_requires_active_parent, e lo
#   spegnimento di un dettaglio che ha indirizzi lo rifiuta
#   trgfn_prevent_deactivate_if_children (indirizzi_soggetti non ha `attivo`:
#   ogni figlia blocca). Un motivo per uno stato che non esiste non si scrive.
#
#   STABLE, SECURITY INVOKER. Indirizzo mancante E_SCRIPT_CHIAMATA_NON_VALIDA,
#   inesistente E_INDIRIZZO_SOGGETTO_NON_TROVATO (nuovo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261115-34-create-fn-check-copia-indirizzo-soggetto-mctit.yaml

  - changeSet:
      id: 20261115-34-create-fn-check-copia-indirizzo-soggetto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il motivo di riga di «Copia come…» sugli indirizzi del soggetto: nessun tipo
        proponibile, dal picker dei tipi.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_copia_indirizzo_soggetto(
                  p_indirizzo_soggetto_id anagrafiche.indirizzi_soggetti.id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  c_chi      CONSTANT text := 'anagrafiche.fn_check_copia_indirizzo_soggetto';
                  v_soggetto anagrafiche.indirizzi_soggetti.soggetto_id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   I motivi per cui l'indirizzo del soggetto non si puo'
                  --   copiare in nessun tipo. [] = la copia si puo' proporre.
                  --
                  -- Regole:
                  --   - nessun tipo proponibile: lo dice il picker del soggetto,
                  --     che legge la check della madre singolare;
                  --   - il verbo della copia la chiama e solleva il primo
                  --     motivo (§12.5.2); la vista di riga ne espone il motivo.
                  -- =========================================================
                  IF p_indirizzo_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_indirizzo_soggetto_id'),
                          NULL::uuid,
                          c_chi,
                          'manca l''indirizzo');
                  END IF;

                  SELECT isg.soggetto_id
                    INTO v_soggetto
                    FROM anagrafiche.indirizzi_soggetti isg
                   WHERE isg.id = p_indirizzo_soggetto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_INDIRIZZO_SOGGETTO_NON_TROVATO',
                          jsonb_build_object('indirizzo_soggetto_id', p_indirizzo_soggetto_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- ---- nessun tipo in cui copiarlo -------------------------
                  IF NOT EXISTS (SELECT 1
                                   FROM anagrafiche.fn_tipi_indirizzo_proponibili_soggetto(v_soggetto) t
                                  WHERE t.ammesso) THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_INDIRIZZO_COPIA_NESSUN_TIPO',
                          'reason',     'NESSUN_TIPO_PROPONIBILE',
                          'reason_key', 'anagrafiche.indirizzi.copia_blocco.nessun_tipo_proponibile',
                          'dettaglio',  jsonb_build_object(
                                            'indirizzo_soggetto_id', p_indirizzo_soggetto_id,
                                            'soggetto_id',           v_soggetto),
                          'valori',     jsonb_build_array()));
                  END IF;

                  RETURN '[]'::jsonb;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_copia_indirizzo_soggetto(
                  anagrafiche.indirizzi_soggetti.id%TYPE)
              IS 'Il motivo di riga dell''azione «Copia come…» su un indirizzo del soggetto: check pura, array ordinato di {codice, reason, reason_key, dettaglio, valori}, [] se la copia si puo'' proporre. Un motivo: nessun tipo in cui copiarlo (NESSUN_TIPO_PROPONIBILE, E_INDIRIZZO_COPIA_NESSUN_TIPO, chiave anagrafiche.indirizzi.copia_blocco.nessun_tipo_proponibile, senza valori), quando anagrafiche.fn_tipi_indirizzo_proponibili_soggetto non ha un tipo ammesso. Indirizzo mancante E_SCRIPT_CHIAMATA_NON_VALIDA, inesistente E_INDIRIZZO_SOGGETTO_NON_TROVATO. La chiamano il verbo anagrafiche.fn_copia_indirizzo_soggetto, che ne solleva il primo motivo, e la vista di riga anagrafiche.vw_indirizzi_soggetti_azioni (colonne copia_blocco_reason, copia_blocco_reason_key). SECURITY INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP FUNCTION IF EXISTS anagrafiche.fn_check_copia_indirizzo_soggetto(bigint);
