# Fase 3a.5 (metà DB) — fn_update_cliente senza la coppia legacy
#   (piano-db-satelliti-fattura.md D-I, passo 3a.7 «resta DB»).
#
# PERCHE' PRIMA DELLA DROP. La funzione nomina `tipo_gg_scadenza_ft` e
#   `nr_giorni_scadenza` in due punti: la whitelist delle chiavi ammesse nel
#   payload e le due assegnazioni CASE. Essendo plpgsql, il DROP delle colonne
#   NON la invaliderebbe: resterebbe li', creabile e apparentemente sana, e
#   fallirebbe solo a runtime — al primo salvataggio di un cliente.
#
# ⚠️ LA FIRMA NON CAMBIA. I campi editabili viaggiano dentro `p_cliente_fields`
#   (jsonb), quindi togliere due campi e' una modifica di CONTENUTO e non di
#   contratto: nessun chiamante da adeguare, nessun overload da droppare.
#
# EFFETTO SULLA WHITELIST. Da qui in avanti un payload che contenesse ancora
#   `tipo_gg_scadenza_ft` viene semplicemente IGNORATO (la chiave non e'
#   whitelisted, e se e' l'unica presente `v_has_fields` resta false e non si
#   scrive nulla). E' il comportamento giusto: il BE ha gia' smesso di
#   inviarle il 2026-07-31 (rimosse da `_OPTIONAL` e `_UPDATE_ALLOWED`), e un
#   errore rumoroso su un campo che nessuno manda piu' non aiuterebbe nessuno.
#
# Il resto del corpo e' invariato rispetto alla versione viva: due sole
#   assegnazioni tolte, whitelist accorciata di due voci.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260731-08-update-fn-update-cliente-drop-legacy-mctit.yaml

  - changeSet:
      id: 20260731-08-update-fn-update-cliente-drop-legacy
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Toglie tipo_gg_scadenza_ft e nr_giorni_scadenza da
        anagrafiche.fn_update_cliente, prerequisito della DROP delle due
        colonne (D-I).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_update_cliente(
                  p_cliente_id              anagrafiche.clienti.id%TYPE,
                  p_ba_categoria_cliente_id anagrafiche.billing_account.categoria_cliente_id%TYPE DEFAULT NULL,
                  p_cliente_fields          jsonb DEFAULT '{}'::jsonb
              )
              RETURNS TABLE (
                  cliente_id           anagrafiche.clienti.id%TYPE,
                  categoria_aggiornata boolean,
                  campi_aggiornati     boolean
              )
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_ba_id           anagrafiche.clienti.billing_account_id%TYPE;
                  v_fields          jsonb   := COALESCE(p_cliente_fields, '{}'::jsonb);
                  v_has_fields      boolean;
                  v_ba_changed      boolean := false;
                  v_cliente_changed boolean := false;
              BEGIN
                  -- ----------------------------------------------------
                  -- 1) Esistenza cliente + risoluzione del suo BA.
                  --    (La FK clienti.billing_account_id garantisce che il
                  --     BA esista; lo risolviamo per la scrittura categoria.)
                  -- ----------------------------------------------------
                  SELECT c.billing_account_id
                    INTO v_ba_id
                    FROM anagrafiche.clienti c
                   WHERE c.id = p_cliente_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'anagrafiche.fn_update_cliente',
                          'E_CLIENTE_NON_TROVATO',
                          jsonb_build_object('cliente_id', p_cliente_id),
                          NULL::uuid,
                          VARIADIC ARRAY[p_cliente_id::text]
                      );
                  END IF;

                  -- ----------------------------------------------------
                  -- 2) Categoria sul BA (solo se fornita; mai a NULL).
                  -- ----------------------------------------------------
                  IF p_ba_categoria_cliente_id IS NOT NULL THEN
                      UPDATE anagrafiche.billing_account ba
                         SET categoria_cliente_id = p_ba_categoria_cliente_id
                       WHERE ba.id = v_ba_id;
                      v_ba_changed := true;
                  END IF;

                  -- ----------------------------------------------------
                  -- 3) Campi editabili del cliente (delta whitelisted).
                  --    Aggiorniamo solo se almeno una chiave whitelisted
                  --    e' presente, per non generare UPDATE/storico a vuoto.
                  --    ⚠️ rev 2026-07-31 (D-I): via `tipo_gg_scadenza_ft` e
                  --    `nr_giorni_scadenza`. Le condizioni di pagamento hanno
                  --    un solo meccanismo — il termine di catalogo — e le due
                  --    colonne cadono con la 3a.5.
                  -- ----------------------------------------------------
                  SELECT count(*) > 0
                    INTO v_has_fields
                    FROM jsonb_object_keys(v_fields) AS k
                   WHERE k IN (
                             'iva_id', 'modalita_pagamento_id', 'termine_pagamento_id',
                             'cliente_pa', 'split_payment',
                             'codice_cig', 'codice_cup', 'codice_commessa',
                             'servizio_da_fatturare',
                             'garanzia_tipo', 'garanzia_importo'
                         );

                  IF v_has_fields THEN
                      UPDATE anagrafiche.clienti c
                         SET iva_id = CASE WHEN jsonb_exists(v_fields, 'iva_id')
                                           THEN (v_fields->>'iva_id')::integer
                                           ELSE c.iva_id END,
                             modalita_pagamento_id = CASE WHEN jsonb_exists(v_fields, 'modalita_pagamento_id')
                                           THEN (v_fields->>'modalita_pagamento_id')::integer
                                           ELSE c.modalita_pagamento_id END,
                             termine_pagamento_id = CASE WHEN jsonb_exists(v_fields, 'termine_pagamento_id')
                                           THEN (v_fields->>'termine_pagamento_id')::bigint
                                           ELSE c.termine_pagamento_id END,
                             cliente_pa = CASE WHEN jsonb_exists(v_fields, 'cliente_pa')
                                           THEN (v_fields->>'cliente_pa')
                                           ELSE c.cliente_pa END,
                             split_payment = CASE WHEN jsonb_exists(v_fields, 'split_payment')
                                           THEN (v_fields->>'split_payment')
                                           ELSE c.split_payment END,
                             codice_cig = CASE WHEN jsonb_exists(v_fields, 'codice_cig')
                                           THEN (v_fields->>'codice_cig')
                                           ELSE c.codice_cig END,
                             codice_cup = CASE WHEN jsonb_exists(v_fields, 'codice_cup')
                                           THEN (v_fields->>'codice_cup')
                                           ELSE c.codice_cup END,
                             codice_commessa = CASE WHEN jsonb_exists(v_fields, 'codice_commessa')
                                           THEN (v_fields->>'codice_commessa')
                                           ELSE c.codice_commessa END,
                             servizio_da_fatturare = CASE WHEN jsonb_exists(v_fields, 'servizio_da_fatturare')
                                           THEN (v_fields->>'servizio_da_fatturare')::boolean
                                           ELSE c.servizio_da_fatturare END,
                             garanzia_tipo = CASE WHEN jsonb_exists(v_fields, 'garanzia_tipo')
                                           THEN (v_fields->>'garanzia_tipo')
                                           ELSE c.garanzia_tipo END,
                             garanzia_importo = CASE WHEN jsonb_exists(v_fields, 'garanzia_importo')
                                           THEN (v_fields->>'garanzia_importo')::numeric
                                           ELSE c.garanzia_importo END
                       WHERE c.id = p_cliente_id;

                      v_cliente_changed := true;
                  END IF;

                  RETURN QUERY
                  SELECT p_cliente_id, v_ba_changed, v_cliente_changed;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_update_cliente(bigint, smallint, jsonb)
              IS 'Funzione madre atomica: aggiorna la categoria cliente sul billing_account e/o i campi editabili del cliente in un''unica statement (o tutto o rollback). SECURITY INVOKER: RLS e scope emittente restano applicati. Ritorna (cliente_id, categoria_aggiornata, campi_aggiornati). Cliente inesistente => E_CLIENTE_NON_TROVATO. rev 2026-07-31 (D-I): rimossi dalla whitelist e dalle assegnazioni `tipo_gg_scadenza_ft` e `nr_giorni_scadenza` — le condizioni di pagamento hanno un solo meccanismo, il termine di catalogo, e le due colonne cadono con la 3a.5. La firma non cambia: i campi editabili viaggiano nel payload jsonb. Piano: analisi-fix-transazioni Classe A #1 + piano-db-satelliti-fattura 3a.5.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 'rollback non previsto: le colonne referenziate non esistono piu'' dopo la 3a.5' AS nota;
