# anagrafiche: «OGGI» E' IL GIORNO DELL'AZIENDA, NON QUELLO DELLA SESSIONE
#   brief-be-db-fe-un-solo-fuso-aziendale §5.1 D-3.
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   CURRENT_DATE e' il giorno nel fuso della SESSIONE che esegue, e le
#   sessioni non hanno tutte lo stesso fuso: il backend si connette in UTC,
#   psql/Liquibase/pgAgent nel fuso del server. Fra la mezzanotte dell'azienda
#   e quella della sessione, la stessa funzione risponde un giorno diverso
#   secondo chi la chiama: una data documento di ieri, un guard di validita'
#   che scatta o non scatta. Non dipende dai dati: e' la struttura, e vale per
#   ogni installazione il cui fuso non coincide con quello della sessione.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Ogni CURRENT_DATE di codice diventa script.fn_data_operativa() (il giorno
#   nel fuso di SYSTEM_FUSO_ORARIO, letto dalla sede unica
#   script.fn_fuso_operativo, 20261009-40/41). Tre forme, scelte dal posto:
#   - in un'istruzione SQL (WHERE, SELECT, VALUES, SQL dinamico):
#     `(SELECT script.fn_data_operativa())` — la sottoquery scalare e'
#     valutata UNA volta per istruzione, non per riga (misurato su
#     zeroerp_ci il 2026-10-09: 20.000 righe, 122 ms per riga contro 2 ms);
#   - in un'espressione PL/pgSQL (`:=`, IF, RETURN) la chiamata diretta,
#     valutata una volta;
#   - nel DEFAULT di un parametro la chiamata diretta: li' una sottoquery non
#     e' ammessa.
#   I commenti che citano CURRENT_DATE restano: raccontano la regola di prima.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────────
#   Firme, tipi, volatilita', sicurezza, commenti e GRANT delle funzioni (il
#   CREATE OR REPLACE li conserva). Il corpo e' quello vivo, preso da
#   pg_get_functiondef su zeroerp_ci il 2026-10-09 e confrontato con la doc
#   auto-generata (identici), con la sola sostituzione di CURRENT_DATE.
#
# ── %TYPE: FIRMA, RETURNS TABLE, DECLARE ───────────────────────────
#   Il corpo vivo (pg_get_functiondef) scioglie i %TYPE della firma: quelli
#   gia' scritti nell'ultimo changeSet di ogni funzione sono stati RIPRESI
#   (anche nel rollback), e in questo giro si sono ancorati i parametri, le
#   colonne di RETURNS TABLE e le variabili che riflettono una colonna.
#   Verificato in transazione annullata su zeroerp_ci: argomenti e risultato
#   di ogni funzione restano byte-identici (nessun overload, nessun chiamante
#   rotto). Restano a TIPO ESPLICITO, perche' non sono il riflesso di nessuna
#   colonna, le voci elencate sotto per funzione: contatori, interruttori del
#   chiamante, jsonb e testi di lavoro, valori calcolati o costanti tipizzate,
#   chiavi polimorfe, il giorno operativo.
#
# ── FUNZIONI (1) ──────────────────────────────────────────────
#     - anagrafiche.fn_crea_operatore_v2 — tipo esplicito: p_username,
#         p_email, p_password_hash, p_is_super_admin, p_riusa_auth_user_id,
#         auth_user_id, username, credenziale_riusata, v_auth_user_id,
#         v_username, v_riusata, v_trovata, v_vesti. username, email, hash e
#         gli id di credenziale sono colonne di django.auth_user: niente %TYPE
#         verso django, come gia' dichiarato in 20261009-27
#   ⭐ E' la funzione rimasta fuori da 20261009-44: la stava riscrivendo il
#   cantiere brief-db-sesso-senza-default (20261009-27). Il corpo qui e'
#   quello vivo DOPO il loro -27 (applicato su zeroerp_ci), quindi la loro
#   modifica sul sesso e' dentro, e il rollback torna esattamente al -27.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261009-60-update-fn-crea-operatore-v2-oggi-dal-fuso-aziendale-mctit.yaml

  - changeSet:
      id: 20261009-60-update-fn-crea-operatore-v2-oggi-dal-fuso-aziendale
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        anagrafiche: CURRENT_DATE -> script.fn_data_operativa() in 1 funzioni, perche'
        «oggi» e' il giorno dell'azienda (SYSTEM_FUSO_ORARIO) e non quello della sessione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname = 'anagrafiche' AND p.proname IN ('fn_crea_operatore_v2'))
                  OR (n.nspname = 'script' AND p.proname = 'fn_fuso_operativo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_operatore_v2(p_soggetto_id anagrafiche.soggetti.id%TYPE DEFAULT NULL::uuid, p_cognome anagrafiche.soggetti.cognome%TYPE DEFAULT NULL::text, p_nome anagrafiche.soggetti.nome%TYPE DEFAULT NULL::text, p_codice_fiscale anagrafiche.soggetti.codice_fiscale%TYPE DEFAULT NULL::text, p_username text DEFAULT NULL::text, p_email text DEFAULT NULL::text, p_password_hash text DEFAULT NULL::text, p_qualifica_id anagrafiche.risorse_umane.qualifica_id%TYPE DEFAULT NULL::integer, p_unita_organizzativa_id anagrafiche.risorse_umane.unita_organizzativa_id%TYPE DEFAULT NULL::integer, p_data_nascita anagrafiche.soggetti.data_nascita%TYPE DEFAULT NULL::date, p_sesso anagrafiche.soggetti.sesso%TYPE DEFAULT NULL::bpchar, p_is_super_admin boolean DEFAULT false, p_valido_dal anagrafiche.risorse_umane.valido_dal%TYPE DEFAULT script.fn_data_operativa(), p_valido_al anagrafiche.risorse_umane.valido_al%TYPE DEFAULT NULL::date, p_comune_nascita_id anagrafiche.soggetti.comune_id%TYPE DEFAULT NULL::integer, p_indirizzo_resid_dettaglio_id anagrafiche.indirizzi_dettaglio.id%TYPE DEFAULT NULL::bigint, p_indirizzo_domfisc_dettaglio_id anagrafiche.indirizzi_dettaglio.id%TYPE DEFAULT NULL::bigint, p_riusa_auth_user_id integer DEFAULT NULL::integer)
               RETURNS TABLE(auth_user_id integer, username text, credenziale_riusata boolean)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- integer/text espliciti: colonne di django.auth_user (niente %TYPE).
                  v_auth_user_id     integer;
                  v_username         text;
                  v_riusata          boolean := false;
                  v_soggetto_id      anagrafiche.soggetti.id%TYPE;
                  v_ru_id            anagrafiche.risorse_umane.id%TYPE;
                  v_tipo_soggetto_id config.tipi_soggetto_dettaglio.tipo_soggetto_id%TYPE;
                  v_veste_attiva     anagrafiche.identita_digitali.attivo%TYPE;
                  v_trovata          integer;   -- la credenziale dell'email, se c'era (django: niente %TYPE)
                  v_vesti            jsonb;
                  v_dettaglio_pr     config.tipi_soggetto_dettaglio.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo: orchestratore della creazione di un operatore.
                  --   Due flussi sul soggetto (A: nuovo / B: esistente).
                  --   ⭐ Rev 20260925-42 (brief-db-blocco-login-per-credenziale §5.2):
                  --   - la credenziale dell'email, se c'e', si RIUSA (D-6):
                  --     password, username e nome restano i suoi;
                  --   - la veste OPERATORE nasce SPENTA, sempre: la accende
                  --     l'attivazione dell'invito (regola unica, R-2);
                  --   - una credenziale che ha gia' una veste OPERATORE (attiva
                  --     o spenta) si rifiuta: il rimedio e' il (re)invito.
                  --   ⭐ Rev 20260925-51 (§12.7 del brief), il riuso non e' piu' silenzioso:
                  --   - se la credenziale ha una veste su una PERSONA FISICA diversa
                  --     dall'operatore, e' un'altra persona: E_CREDENZIALE_ALTRA_PERSONA;
                  --   - negli altri casi il riuso vuole il CONSENSO: p_riusa_auth_user_id
                  --     deve dichiarare la credenziale trovata, altrimenti
                  --     E_CREDENZIALE_DA_CONFERMARE: username e vesti li legge
                          --     script.fn_get_credenziale_per_email, come il dialog (rev 20260927-41).
                  --   ⭐ Rev 20261009-27 (brief-db-sesso-senza-default): p_sesso senza
                  --   default ('M' prima); nel flusso A il soggetto nasce PRIVATO (PR),
                  --   chiesto per nome a fn_crea_soggetto_pf, che non lo cabla piu'. Il
                  --   sesso del PR e' obbligatorio: lo rifiuta il guard
                  --   trgfn_soggetti_guard_sesso_policy, prima dello step 2-bis.
                  -- Ritorna: la credenziale, il suo username EFFETTIVO, e se e'
                  --   stata riusata (allora la password passata e' ignorata).
                  -- =========================================================

                  -- ============ Guard comuni ============
                  -- ⚠️ Username e password_hash NON si validano qui: servono solo
                  --   se la credenziale va creata, e allora li valida
                  --   fn_crea_auth_user. Sulla credenziale riusata non servono.
                  IF p_email IS NULL OR TRIM(p_email) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_email'),
                          NULL::uuid, 'Email obbligatoria.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- ============ Step 1: la credenziale — riusata o creata ============
                  -- La regola «quale credenziale ha questa email» sta in un posto
                  -- solo, senza distinguere maiuscole e minuscole (D-9).
                  v_auth_user_id := script.fn_get_auth_user_id_for_email(p_email);

                  IF v_auth_user_id IS NOT NULL THEN
                      -- ⭐ Serializza due creazioni sulla stessa credenziale: la
                      --   seconda rilegge le vesti DOPO il COMMIT della prima.
                      PERFORM 1
                        FROM django.auth_user au
                       WHERE au.id = v_auth_user_id
                         FOR UPDATE;

                      -- ⛔ Gia' operatore (attiva o spenta): con la veste che nasce
                      --   spenta l'unique WHERE attivo qui non scatterebbe mai, e il
                      --   duplicato scoppierebbe all'attivazione. DISABILITATO non
                      --   conta: si ritira (R-5).
                      SELECT bool_or(idg.attivo)
                        INTO v_veste_attiva
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_auth_user_id
                         AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo;

                      IF v_veste_attiva IS NOT NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CREDENZIALE_GIA_OPERATORE',
                              jsonb_build_object('campo',        'email',
                                                 'auth_user_id', v_auth_user_id,
                                                 'veste_attiva', v_veste_attiva),
                              NULL::uuid,
                              TRIM(p_email));
                      END IF;

                      -- ⛔ Rev 20260925-51 — ALTRA PERSONA, dove il modello lo sa dire: una
                      --   veste della credenziale sta su un soggetto PERSONA FISICA che non
                      --   e' l'operatore (flusso B: un altro soggetto; flusso A: un altro
                      --   codice fiscale). Con lo STESSO codice fiscale nel flusso A non si
                      --   solleva qui: e' la stessa persona, e fn_crea_soggetto_pf dira'
                      --   E_ADMIN_CF_DUPLICATO (va usato il soggetto esistente).
                      --   Vesti su un'azienda, o nessuna veste: non decidibile -> consenso.
                      IF EXISTS (
                          SELECT 1
                            FROM anagrafiche.identita_digitali idg
                            JOIN anagrafiche.soggetti_ruoli sr         ON sr.id  = idg.soggetto_ruolo_id
                            JOIN anagrafiche.soggetti s                ON s.id   = sr.soggetto_id
                            JOIN config.tipi_soggetto_dettaglio tsd    ON tsd.id = s.tipo_soggetto_dettaglio_id
                           WHERE idg.auth_user_id = v_auth_user_id
                             AND tsd.tipo_soggetto_id = 'PF'
                             AND CASE WHEN p_soggetto_id IS NOT NULL
                                      THEN s.id <> p_soggetto_id
                                      ELSE s.id_fiscale_univoco_cf_piva IS DISTINCT FROM UPPER(TRIM(p_codice_fiscale))
                                 END
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CREDENZIALE_ALTRA_PERSONA',
                              jsonb_build_object('campo',        'email',
                                                 'auth_user_id', v_auth_user_id),
                              NULL::uuid,
                              TRIM(p_email));
                      END IF;

                      v_riusata := true;
                      v_trovata := v_auth_user_id;
                  ELSE
                      SELECT anagrafiche.fn_crea_auth_user(
                          p_username      := p_username,
                          p_email         := p_email,
                          p_password_hash := p_password_hash,
                          p_first_name    := COALESCE(p_nome, ''),
                          p_last_name     := COALESCE(p_cognome, '')
                      ) INTO v_auth_user_id;
                  END IF;

                  -- ============ Step 2: Soggetto (flusso A o B) ============
                  IF p_soggetto_id IS NOT NULL THEN
                      -- Flusso B: soggetto esistente
                      SELECT tsd.tipo_soggetto_id
                        INTO v_tipo_soggetto_id
                        FROM anagrafiche.soggetti s
                        JOIN config.tipi_soggetto_dettaglio tsd
                          ON tsd.id = s.tipo_soggetto_dettaglio_id
                       WHERE s.id = p_soggetto_id;

                      IF v_tipo_soggetto_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('p_soggetto_id', p_soggetto_id),
                              NULL::uuid,
                              'Soggetto con id=' || p_soggetto_id || ' non trovato.'
                          );
                      END IF;

                      IF v_tipo_soggetto_id <> 'PF' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('p_soggetto_id', p_soggetto_id,
                                                'tipo_soggetto_id', v_tipo_soggetto_id),
                              NULL::uuid,
                              'Soggetto deve essere Persona Fisica (PF). Trovato: ' || v_tipo_soggetto_id || '.'
                          );
                      END IF;

                      v_soggetto_id := p_soggetto_id;

                  ELSE
                      -- Flusso A: crea soggetto PF nuovo
                      IF p_cognome IS NULL OR TRIM(p_cognome) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_cognome'),
                              NULL::uuid, 'Cognome obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      IF p_nome IS NULL OR TRIM(p_nome) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_nome'),
                              NULL::uuid, 'Nome obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      IF p_codice_fiscale IS NULL OR TRIM(p_codice_fiscale) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_codice_fiscale'),
                              NULL::uuid,
                              'Codice fiscale obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      -- ⭐ Rev 20261009-27: l'operatore e' una persona fisica PRIVATA
                      --   (PF pura: niente P.IVA, cfr. script.fn_guard_soggetto_pf_pura).
                      SELECT tsd.id
                        INTO v_dettaglio_pr
                        FROM config.tipi_soggetto_dettaglio tsd
                       WHERE tsd.codice_interno = 'PR';

                      IF v_dettaglio_pr IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CODICE',
                              jsonb_build_object('codice_interno', 'PR'),
                              NULL::uuid,
                              'PR', 'config.tipi_soggetto_dettaglio'
                          );
                      END IF;

                      SELECT anagrafiche.fn_crea_soggetto_pf(
                          p_cognome                    := p_cognome,
                          p_nome                       := p_nome,
                          p_codice_fiscale             := p_codice_fiscale,
                          p_email                      := p_email,
                          p_data_nascita               := p_data_nascita,
                          p_sesso                      := p_sesso,
                          p_comune_nascita_id          := p_comune_nascita_id,
                          p_tipo_soggetto_dettaglio_id := v_dettaglio_pr
                      ) INTO v_soggetto_id;
                  END IF;

                  -- ============ Step 2-bis: il CONSENSO al riuso (rev 20260925-51) ============
                  -- ⭐ Dopo il soggetto, e non prima: i rifiuti definitivi (flusso A
                  --   incompleto, CF gia' presente, soggetto non PF) parlano per primi, e
                  --   l'admin non conferma qualcosa che verrebbe rifiutato comunque.
                  -- La dichiarazione deve dire la credenziale che c'e' (stampo della
                  --   dichiarazione di pagamenti.fn_posta_contabile, D13): NULL se l'email
                  --   e' nuova, l'id trovato se esiste. Qualunque differenza — nessun
                  --   consenso, un'altra credenziale, una credenziale sparita nel frattempo —
                  --   ferma PRIMA che il riuso diventi definitivo.
                  IF p_riusa_auth_user_id IS DISTINCT FROM v_trovata THEN
                      -- ⭐ Rev 20260927-41 (§17 del brief): username e vesti dal building
                      --   block che legge anche il dialog di conferma del backend: rifiuto e
                      --   dialog mostrano la stessa cosa (regola del 2). Zero righe se l'email
                      --   non ha credenziale (v_trovata NULL): SELECT INTO azzera le variabili,
                      --   e le vesti tornano all'array vuoto di prima.
                      SELECT c.username, c.vesti
                        INTO v_username, v_vesti
                        FROM script.fn_get_credenziale_per_email(p_email) c;
                      v_vesti := COALESCE(v_vesti, '[]'::jsonb);

                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_CREDENZIALE_DA_CONFERMARE',
                          jsonb_build_object('campo',                'email',
                                             'auth_user_id',         v_trovata,
                                             'username',             v_username,
                                             'vesti',                v_vesti,
                                             'riusa_auth_user_id',   p_riusa_auth_user_id),
                          NULL::uuid,
                          TRIM(p_email),
                          COALESCE(v_username, '-'));
                  END IF;

                  -- ============ Step 3: risorsa umana + veste OPERATORE SPENTA ============
                  -- ⭐ p_attivo := false, sempre (R-2): la veste la accende
                  --   l'attivazione dell'invito. La risorsa umana nasce attiva.
                  SELECT anagrafiche.fn_crea_risorsa_umana_v2(
                      p_soggetto_id            := v_soggetto_id,
                      p_qualifica_id           := p_qualifica_id,
                      p_unita_organizzativa_id := p_unita_organizzativa_id,
                      p_valido_dal             := p_valido_dal,
                      p_valido_al              := p_valido_al,
                      p_auth_user_id           := v_auth_user_id,
                      p_is_super_admin         := p_is_super_admin,
                      p_attivo                 := false
                  ) INTO v_ru_id;

                  -- ============ Step 4: indirizzi soggetto (invariato) ============
                  IF p_indirizzo_resid_dettaglio_id IS NOT NULL THEN
                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(
                          p_soggetto_id            := v_soggetto_id,
                          p_tipo_indirizzo_codice  := 'RES',
                          p_indirizzo_dettaglio_id := p_indirizzo_resid_dettaglio_id
                      );

                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(
                          p_soggetto_id            := v_soggetto_id,
                          p_tipo_indirizzo_codice  := 'DOMFISC',
                          p_indirizzo_dettaglio_id := COALESCE(
                              p_indirizzo_domfisc_dettaglio_id,
                              p_indirizzo_resid_dettaglio_id
                          )
                      );
                  END IF;

                  -- ============ Ritorno: lo username EFFETTIVO ============
                  SELECT au.username
                    INTO v_username
                    FROM django.auth_user au
                   WHERE au.id = v_auth_user_id;

                  RETURN QUERY SELECT v_auth_user_id, v_username, v_riusata;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_operatore_v2(p_soggetto_id anagrafiche.soggetti.id%TYPE DEFAULT NULL::uuid, p_cognome anagrafiche.soggetti.cognome%TYPE DEFAULT NULL::text, p_nome anagrafiche.soggetti.nome%TYPE DEFAULT NULL::text, p_codice_fiscale anagrafiche.soggetti.codice_fiscale%TYPE DEFAULT NULL::text, p_username text DEFAULT NULL::text, p_email text DEFAULT NULL::text, p_password_hash text DEFAULT NULL::text, p_qualifica_id anagrafiche.risorse_umane.qualifica_id%TYPE DEFAULT NULL::integer, p_unita_organizzativa_id anagrafiche.risorse_umane.unita_organizzativa_id%TYPE DEFAULT NULL::integer, p_data_nascita anagrafiche.soggetti.data_nascita%TYPE DEFAULT NULL::date, p_sesso anagrafiche.soggetti.sesso%TYPE DEFAULT NULL::bpchar, p_is_super_admin boolean DEFAULT false, p_valido_dal anagrafiche.risorse_umane.valido_dal%TYPE DEFAULT CURRENT_DATE, p_valido_al anagrafiche.risorse_umane.valido_al%TYPE DEFAULT NULL::date, p_comune_nascita_id anagrafiche.soggetti.comune_id%TYPE DEFAULT NULL::integer, p_indirizzo_resid_dettaglio_id anagrafiche.indirizzi_dettaglio.id%TYPE DEFAULT NULL::bigint, p_indirizzo_domfisc_dettaglio_id anagrafiche.indirizzi_dettaglio.id%TYPE DEFAULT NULL::bigint, p_riusa_auth_user_id integer DEFAULT NULL::integer)
               RETURNS TABLE(auth_user_id integer, username text, credenziale_riusata boolean)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- integer/text espliciti: colonne di django.auth_user (niente %TYPE).
                  v_auth_user_id     integer;
                  v_username         text;
                  v_riusata          boolean := false;
                  v_soggetto_id      anagrafiche.soggetti.id%TYPE;
                  v_ru_id            anagrafiche.risorse_umane.id%TYPE;
                  v_tipo_soggetto_id config.tipi_soggetto_dettaglio.tipo_soggetto_id%TYPE;
                  v_veste_attiva     anagrafiche.identita_digitali.attivo%TYPE;
                  v_trovata          integer;   -- la credenziale dell'email, se c'era (django: niente %TYPE)
                  v_vesti            jsonb;
                  v_dettaglio_pr     config.tipi_soggetto_dettaglio.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo: orchestratore della creazione di un operatore.
                  --   Due flussi sul soggetto (A: nuovo / B: esistente).
                  --   ⭐ Rev 20260925-42 (brief-db-blocco-login-per-credenziale §5.2):
                  --   - la credenziale dell'email, se c'e', si RIUSA (D-6):
                  --     password, username e nome restano i suoi;
                  --   - la veste OPERATORE nasce SPENTA, sempre: la accende
                  --     l'attivazione dell'invito (regola unica, R-2);
                  --   - una credenziale che ha gia' una veste OPERATORE (attiva
                  --     o spenta) si rifiuta: il rimedio e' il (re)invito.
                  --   ⭐ Rev 20260925-51 (§12.7 del brief), il riuso non e' piu' silenzioso:
                  --   - se la credenziale ha una veste su una PERSONA FISICA diversa
                  --     dall'operatore, e' un'altra persona: E_CREDENZIALE_ALTRA_PERSONA;
                  --   - negli altri casi il riuso vuole il CONSENSO: p_riusa_auth_user_id
                  --     deve dichiarare la credenziale trovata, altrimenti
                  --     E_CREDENZIALE_DA_CONFERMARE: username e vesti li legge
                          --     script.fn_get_credenziale_per_email, come il dialog (rev 20260927-41).
                  --   ⭐ Rev 20261009-27 (brief-db-sesso-senza-default): p_sesso senza
                  --   default ('M' prima); nel flusso A il soggetto nasce PRIVATO (PR),
                  --   chiesto per nome a fn_crea_soggetto_pf, che non lo cabla piu'. Il
                  --   sesso del PR e' obbligatorio: lo rifiuta il guard
                  --   trgfn_soggetti_guard_sesso_policy, prima dello step 2-bis.
                  -- Ritorna: la credenziale, il suo username EFFETTIVO, e se e'
                  --   stata riusata (allora la password passata e' ignorata).
                  -- =========================================================

                  -- ============ Guard comuni ============
                  -- ⚠️ Username e password_hash NON si validano qui: servono solo
                  --   se la credenziale va creata, e allora li valida
                  --   fn_crea_auth_user. Sulla credenziale riusata non servono.
                  IF p_email IS NULL OR TRIM(p_email) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_email'),
                          NULL::uuid, 'Email obbligatoria.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- ============ Step 1: la credenziale — riusata o creata ============
                  -- La regola «quale credenziale ha questa email» sta in un posto
                  -- solo, senza distinguere maiuscole e minuscole (D-9).
                  v_auth_user_id := script.fn_get_auth_user_id_for_email(p_email);

                  IF v_auth_user_id IS NOT NULL THEN
                      -- ⭐ Serializza due creazioni sulla stessa credenziale: la
                      --   seconda rilegge le vesti DOPO il COMMIT della prima.
                      PERFORM 1
                        FROM django.auth_user au
                       WHERE au.id = v_auth_user_id
                         FOR UPDATE;

                      -- ⛔ Gia' operatore (attiva o spenta): con la veste che nasce
                      --   spenta l'unique WHERE attivo qui non scatterebbe mai, e il
                      --   duplicato scoppierebbe all'attivazione. DISABILITATO non
                      --   conta: si ritira (R-5).
                      SELECT bool_or(idg.attivo)
                        INTO v_veste_attiva
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_auth_user_id
                         AND idg.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo;

                      IF v_veste_attiva IS NOT NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CREDENZIALE_GIA_OPERATORE',
                              jsonb_build_object('campo',        'email',
                                                 'auth_user_id', v_auth_user_id,
                                                 'veste_attiva', v_veste_attiva),
                              NULL::uuid,
                              TRIM(p_email));
                      END IF;

                      -- ⛔ Rev 20260925-51 — ALTRA PERSONA, dove il modello lo sa dire: una
                      --   veste della credenziale sta su un soggetto PERSONA FISICA che non
                      --   e' l'operatore (flusso B: un altro soggetto; flusso A: un altro
                      --   codice fiscale). Con lo STESSO codice fiscale nel flusso A non si
                      --   solleva qui: e' la stessa persona, e fn_crea_soggetto_pf dira'
                      --   E_ADMIN_CF_DUPLICATO (va usato il soggetto esistente).
                      --   Vesti su un'azienda, o nessuna veste: non decidibile -> consenso.
                      IF EXISTS (
                          SELECT 1
                            FROM anagrafiche.identita_digitali idg
                            JOIN anagrafiche.soggetti_ruoli sr         ON sr.id  = idg.soggetto_ruolo_id
                            JOIN anagrafiche.soggetti s                ON s.id   = sr.soggetto_id
                            JOIN config.tipi_soggetto_dettaglio tsd    ON tsd.id = s.tipo_soggetto_dettaglio_id
                           WHERE idg.auth_user_id = v_auth_user_id
                             AND tsd.tipo_soggetto_id = 'PF'
                             AND CASE WHEN p_soggetto_id IS NOT NULL
                                      THEN s.id <> p_soggetto_id
                                      ELSE s.id_fiscale_univoco_cf_piva IS DISTINCT FROM UPPER(TRIM(p_codice_fiscale))
                                 END
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CREDENZIALE_ALTRA_PERSONA',
                              jsonb_build_object('campo',        'email',
                                                 'auth_user_id', v_auth_user_id),
                              NULL::uuid,
                              TRIM(p_email));
                      END IF;

                      v_riusata := true;
                      v_trovata := v_auth_user_id;
                  ELSE
                      SELECT anagrafiche.fn_crea_auth_user(
                          p_username      := p_username,
                          p_email         := p_email,
                          p_password_hash := p_password_hash,
                          p_first_name    := COALESCE(p_nome, ''),
                          p_last_name     := COALESCE(p_cognome, '')
                      ) INTO v_auth_user_id;
                  END IF;

                  -- ============ Step 2: Soggetto (flusso A o B) ============
                  IF p_soggetto_id IS NOT NULL THEN
                      -- Flusso B: soggetto esistente
                      SELECT tsd.tipo_soggetto_id
                        INTO v_tipo_soggetto_id
                        FROM anagrafiche.soggetti s
                        JOIN config.tipi_soggetto_dettaglio tsd
                          ON tsd.id = s.tipo_soggetto_dettaglio_id
                       WHERE s.id = p_soggetto_id;

                      IF v_tipo_soggetto_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('p_soggetto_id', p_soggetto_id),
                              NULL::uuid,
                              'Soggetto con id=' || p_soggetto_id || ' non trovato.'
                          );
                      END IF;

                      IF v_tipo_soggetto_id <> 'PF' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('p_soggetto_id', p_soggetto_id,
                                                'tipo_soggetto_id', v_tipo_soggetto_id),
                              NULL::uuid,
                              'Soggetto deve essere Persona Fisica (PF). Trovato: ' || v_tipo_soggetto_id || '.'
                          );
                      END IF;

                      v_soggetto_id := p_soggetto_id;

                  ELSE
                      -- Flusso A: crea soggetto PF nuovo
                      IF p_cognome IS NULL OR TRIM(p_cognome) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_cognome'),
                              NULL::uuid, 'Cognome obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      IF p_nome IS NULL OR TRIM(p_nome) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_nome'),
                              NULL::uuid, 'Nome obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      IF p_codice_fiscale IS NULL OR TRIM(p_codice_fiscale) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('parametro', 'p_codice_fiscale'),
                              NULL::uuid,
                              'Codice fiscale obbligatorio per creazione soggetto nuovo.'
                          );
                      END IF;

                      -- ⭐ Rev 20261009-27: l'operatore e' una persona fisica PRIVATA
                      --   (PF pura: niente P.IVA, cfr. script.fn_guard_soggetto_pf_pura).
                      SELECT tsd.id
                        INTO v_dettaglio_pr
                        FROM config.tipi_soggetto_dettaglio tsd
                       WHERE tsd.codice_interno = 'PR';

                      IF v_dettaglio_pr IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_operatore_v2',
                              'E_CODICE',
                              jsonb_build_object('codice_interno', 'PR'),
                              NULL::uuid,
                              'PR', 'config.tipi_soggetto_dettaglio'
                          );
                      END IF;

                      SELECT anagrafiche.fn_crea_soggetto_pf(
                          p_cognome                    := p_cognome,
                          p_nome                       := p_nome,
                          p_codice_fiscale             := p_codice_fiscale,
                          p_email                      := p_email,
                          p_data_nascita               := p_data_nascita,
                          p_sesso                      := p_sesso,
                          p_comune_nascita_id          := p_comune_nascita_id,
                          p_tipo_soggetto_dettaglio_id := v_dettaglio_pr
                      ) INTO v_soggetto_id;
                  END IF;

                  -- ============ Step 2-bis: il CONSENSO al riuso (rev 20260925-51) ============
                  -- ⭐ Dopo il soggetto, e non prima: i rifiuti definitivi (flusso A
                  --   incompleto, CF gia' presente, soggetto non PF) parlano per primi, e
                  --   l'admin non conferma qualcosa che verrebbe rifiutato comunque.
                  -- La dichiarazione deve dire la credenziale che c'e' (stampo della
                  --   dichiarazione di pagamenti.fn_posta_contabile, D13): NULL se l'email
                  --   e' nuova, l'id trovato se esiste. Qualunque differenza — nessun
                  --   consenso, un'altra credenziale, una credenziale sparita nel frattempo —
                  --   ferma PRIMA che il riuso diventi definitivo.
                  IF p_riusa_auth_user_id IS DISTINCT FROM v_trovata THEN
                      -- ⭐ Rev 20260927-41 (§17 del brief): username e vesti dal building
                      --   block che legge anche il dialog di conferma del backend: rifiuto e
                      --   dialog mostrano la stessa cosa (regola del 2). Zero righe se l'email
                      --   non ha credenziale (v_trovata NULL): SELECT INTO azzera le variabili,
                      --   e le vesti tornano all'array vuoto di prima.
                      SELECT c.username, c.vesti
                        INTO v_username, v_vesti
                        FROM script.fn_get_credenziale_per_email(p_email) c;
                      v_vesti := COALESCE(v_vesti, '[]'::jsonb);

                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_operatore_v2',
                          'E_CREDENZIALE_DA_CONFERMARE',
                          jsonb_build_object('campo',                'email',
                                             'auth_user_id',         v_trovata,
                                             'username',             v_username,
                                             'vesti',                v_vesti,
                                             'riusa_auth_user_id',   p_riusa_auth_user_id),
                          NULL::uuid,
                          TRIM(p_email),
                          COALESCE(v_username, '-'));
                  END IF;

                  -- ============ Step 3: risorsa umana + veste OPERATORE SPENTA ============
                  -- ⭐ p_attivo := false, sempre (R-2): la veste la accende
                  --   l'attivazione dell'invito. La risorsa umana nasce attiva.
                  SELECT anagrafiche.fn_crea_risorsa_umana_v2(
                      p_soggetto_id            := v_soggetto_id,
                      p_qualifica_id           := p_qualifica_id,
                      p_unita_organizzativa_id := p_unita_organizzativa_id,
                      p_valido_dal             := p_valido_dal,
                      p_valido_al              := p_valido_al,
                      p_auth_user_id           := v_auth_user_id,
                      p_is_super_admin         := p_is_super_admin,
                      p_attivo                 := false
                  ) INTO v_ru_id;

                  -- ============ Step 4: indirizzi soggetto (invariato) ============
                  IF p_indirizzo_resid_dettaglio_id IS NOT NULL THEN
                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(
                          p_soggetto_id            := v_soggetto_id,
                          p_tipo_indirizzo_codice  := 'RES',
                          p_indirizzo_dettaglio_id := p_indirizzo_resid_dettaglio_id
                      );

                      PERFORM anagrafiche.fn_crea_indirizzo_soggetto(
                          p_soggetto_id            := v_soggetto_id,
                          p_tipo_indirizzo_codice  := 'DOMFISC',
                          p_indirizzo_dettaglio_id := COALESCE(
                              p_indirizzo_domfisc_dettaglio_id,
                              p_indirizzo_resid_dettaglio_id
                          )
                      );
                  END IF;

                  -- ============ Ritorno: lo username EFFETTIVO ============
                  SELECT au.username
                    INTO v_username
                    FROM django.auth_user au
                   WHERE au.id = v_auth_user_id;

                  RETURN QUERY SELECT v_auth_user_id, v_username, v_riusata;
              END;
              $function$;
