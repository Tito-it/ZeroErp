# Liquibase changelog per Zero ERP
# Guard: coerenza paese tra soggetto e forma giuridica
#  - anagrafiche.dati_societari.forma_giuridica_id
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251222-15-create-trg-dati-societari-guard-forma-giuridica-mctit.yaml

  - changeSet:
      id: 20251222-15-create-trgfn-dati-societari-guard-forma-giuridica
      author: mctit
      comment: >
        Valida che la forma giuridica scelta (config.forme_giuridiche) sia coerente con
        il paese del soggetto (anagrafiche.soggetti). Confronta stato_id.
        Trigger applicato SOLO su INSERT e UPDATE della colonna forma_giuridica_id.

      changes:
        # ------------------------------------------------------------
        # 1) Funzione trigger (guard)
        # ------------------------------------------------------------
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_dati_societari_guard_forma_giuridica()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_soggetto_stato_id anagrafiche.soggetti.stato_id%TYPE;
                v_forma_stato_id    config.forme_giuridiche.stato_id%TYPE;
              BEGIN
                
                -- Recupera paese del soggetto
                SELECT s.stato_id
                  INTO v_soggetto_stato_id
                FROM anagrafiche.soggetti s
                WHERE s.id = NEW.soggetto_id;

                -- Recupera paese della forma giuridica
                SELECT fg.stato_id
                  INTO v_forma_stato_id
                FROM config.forme_giuridiche fg
                WHERE fg.id = NEW.forma_giuridica_id;

                -- Se uno dei due è NULL, non possiamo validare in modo deterministico
                --IF v_soggetto_stato_id IS NULL OR v_forma_stato_id IS NULL THEN
                --  RETURN NEW;
                --END IF;

                -- Coerenza paese: deve combaciare
                IF v_soggetto_stato_id <> v_forma_stato_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'trgfn_dati_societari_guard_forma_giuridica',
                    'E_FORMA_GIURIDICA_PAESE',
                    jsonb_build_object(
                      'tabella', 'anagrafiche.dati_societari',
                      'soggetto_id', NEW.soggetto_id::text,
                      'forma_giuridica_id', NEW.forma_giuridica_id::text,
                      'soggetto_stato_id', v_soggetto_stato_id::text,
                      'forma_stato_id', v_forma_stato_id::text
                    ),
                    
                    NEW.tx_id::uuid,
                    NEW.forma_giuridica_id::text,
                    NEW.soggetto_id::text
                    
                  );

                  -- Fallback safety (nel caso fn_log_and_raise_error non faccia RAISE)
                  --RAISE EXCEPTION 'Forma giuridica non coerente con il paese del soggetto'
                    --USING ERRCODE = '23514';
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_dati_societari_guard_forma_giuridica()
              IS 'Guard: verifica coerenza paese (stato_id) tra soggetto e forma giuridica. Emette E_FORMA_GIURIDICA_PAESE se incoerente.';

        # ------------------------------------------------------------
        # 2) Trigger: solo su INSERT e UPDATE della colonna forma_giuridica_id
        # ------------------------------------------------------------
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_dati_societari_a10_guard_forma_giuridica_ins_upd
              ON anagrafiche.dati_societari;

              CREATE OR REPLACE TRIGGER trg_dati_societari_a10_guard_forma_giuridica_ins_upd
                BEFORE INSERT OR UPDATE OF forma_giuridica_id
                ON anagrafiche.dati_societari
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_dati_societari_guard_forma_giuridica();

              COMMENT ON TRIGGER trg_dati_societari_a10_guard_forma_giuridica_ins_upd
              ON anagrafiche.dati_societari
              IS 'Valida forma_giuridica_id: la forma giuridica deve appartenere allo stesso paese (stato_id) del soggetto.';
