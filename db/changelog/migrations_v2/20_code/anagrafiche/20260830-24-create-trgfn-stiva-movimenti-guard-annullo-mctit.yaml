# FASE B-c — IL GUARD DELL'ANNULLO
#   anagrafiche.trgfn_stiva_movimenti_guard_annullo
#   Piano: brief-db-titoli-iva-movimenti-annullo, §6.3 B-c
#
# ── ⭐ DUE FAMIGLIE DI CONTROLLI, E NON SONO LA STESSA COSA ──────────
#   1. **Ammissibilita'** — «questo movimento si puo' annullare?». Non e' scritta
#      qui: si CHIAMA script.fn_check_annullo_movimento_titolo_iva, e si solleva
#      il codice del PRIMO motivo. ⭐ Cosi' il pulsante spento e il rifiuto non
#      «coincidono oggi»: NON POSSONO DIVERGERE, perche' la regola sta in un
#      posto solo.
#   2. **Coerenza della riga scritta** — stesso titolo, importo opposto. Questa
#      sta qui, ed e' difesa contro una scrittura DIRETTA: passando dalla madre
#      quei due valori sono DERIVATI e non possono sbagliare.
#
# ── ⛔ IL CONTROLLO SULL'IMPORTO NON E' UNA FORMALITA' ───────────────
#   Senza, il modello ammetterebbe un «annullo» di 100 su una forzatura di 250, e
#   `imponibile_utilizzato` NON tornerebbe al valore precedente — cioe' proprio
#   la cosa che il presidio del brief (§3) dichiara di verificare. Un test lo
#   confermerebbe lo stesso, perche' il numero giusto lo scrive la FIXTURE: e' un
#   verde che prova la popolazione che si e' fabbricato, non la regola.
#
# ── ⛔ E QUELLO SUL TITOLO E' IL PEGGIORE DEI DUE ───────────────────
#   Un collegamento a un movimento di un ALTRO titolo decurta il plafond
#   sbagliato e lascia gonfiato quello della forzatura. ⚠️ E non solleva niente:
#   l'accumulatore somma PER TITOLO e del collegamento non sa nulla, quindi trova
#   entrambi i totali «coerenti». Si vedrebbe solo guardando due plafond insieme.
#
# ── ⛔ SECURITY DEFINER, per la stessa ragione della check ───────────
#   Il guard deve leggere la riga ANNULLATA per confrontarne titolo e importo, e
#   quella tabella ha la RLS attiva. Da INVOKER una riga fuori perimetro si
#   leggerebbe come «non esiste», e il guard passerebbe su una premessa non
#   verificata — mentre la FK, che la RLS la scavalca sempre, il riferimento
#   l'avrebbe accettato. ⚠️ Non e' un buco di perimetro: la MADRE resta INVOKER,
#   quindi la scrittura passa comunque dalla policy; qui si scavalca la RLS per
#   una LETTURA di coerenza.
#
# ── ⚠️ `WHEN` sul trigger, non un `IF` in testa al corpo ────────────
#   La stragrande maggioranza delle righe di questo registro NON e' un annullo:
#   con il `WHEN` la funzione non viene nemmeno invocata, invece di essere
#   chiamata e uscire subito.
#
# ── ⚠️ SOLO `BEFORE INSERT` ────────────────────────────────────────
#   L'UPDATE non serve: dal 20260830-22 il registro non ammette piu' UPDATE. Un
#   ramo UPDATE qui sarebbe codice irraggiungibile che sembra vivo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260830-24-create-trgfn-stiva-movimenti-guard-annullo-mctit.yaml

  - changeSet:
      id: 20260830-24-create-trgfn-stiva-movimenti-guard-annullo
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Fase B-c del brief-db-titoli-iva-movimenti-annullo: il guard sulle righe di annullo.
        Due famiglie di controlli — l'AMMISSIBILITA', che non e' scritta qui ma si CHIAMA da
        script.fn_check_annullo_movimento_titolo_iva (cosi' il pulsante spento e il rifiuto non
        possono divergere), e la COERENZA della riga scritta: stesso titolo IVA e importo
        esattamente opposto. ⛔ Il controllo sull'importo e' quello che rende vero il presidio
        del §3: senza, un annullo di 100 su una forzatura di 250 passerebbe e il totale non
        tornerebbe al valore precedente. ⛔ Quello sul titolo e' il peggiore: decurterebbe il
        plafond sbagliato SENZA SOLLEVARE NIENTE, perche' l'accumulatore somma per titolo e del
        collegamento non sa nulla. ⛔ SECURITY DEFINER perche' legge la riga annullata su una
        tabella con RLS; la madre resta INVOKER, quindi il perimetro sulla scrittura non si
        perde. Solo BEFORE INSERT: dal 20260830-22 l'UPDATE non esiste piu'.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_movimenti
                columnName: annulla_movimento_id
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_check_annullo_movimento_titolo_iva';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_stiva_movimenti_guard_annullo()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path = pg_catalog, anagrafiche, config, script
              AS $function$
              -- Scopo: presidiare le righe che ANNULLANO un movimento del
              --   registro plafond IVA, in due famiglie di controlli.
              --   Uso: BEFORE INSERT FOR EACH ROW
              --        WHEN (NEW.annulla_movimento_id IS NOT NULL)
              --   Piano: brief-db-titoli-iva-movimenti-annullo, B-c.
              --
              -- 1) AMMISSIBILITA' — non e' scritta qui: si CHIAMA
              --    script.fn_check_annullo_movimento_titolo_iva e si solleva il
              --    codice del PRIMO motivo. ⭐ E' il punto: il pulsante spento
              --    (vw_stiva_movimenti_dettaglio) e questo rifiuto leggono LA
              --    STESSA regola, quindi non possono divergere. Il presidio da
              --    scrivere non e' «gli esiti coincidono», e' «il guard non
              --    contiene piu' il predicato».
              --
              -- 2) COERENZA della riga scritta — stesso titolo, importo
              --    opposto. Questa sta qui, ed e' difesa contro una scrittura
              --    DIRETTA: passando dalla madre quei due valori sono DERIVATI
              --    dalla riga annullata e non possono sbagliare. Il messaggio
              --    dice infatti che qualcuno ha scritto a mano — e' TECNICO.
              --
              -- ⛔ SECURITY DEFINER: legge la riga ANNULLATA, e la tabella ha
              --    la RLS attiva. Da INVOKER una riga fuori perimetro si
              --    leggerebbe come «non esiste» e il guard passerebbe su una
              --    premessa non verificata, mentre la FK — che la RLS la
              --    scavalca sempre — il riferimento l'avrebbe accettato.
              --    ⚠️ La MADRE resta INVOKER: la scrittura passa comunque dalla
              --    policy, qui si scavalca solo per una LETTURA di coerenza.
              DECLARE
                  v_motivi   jsonb;
                  v_primo    jsonb;
                  v_ann      RECORD;
              BEGIN
                  -- ---- 1) AMMISSIBILITA' ------------------------------------
                  v_motivi := script.fn_check_annullo_movimento_titolo_iva(
                                  NEW.annulla_movimento_id);

                  IF jsonb_array_length(v_motivi) > 0 THEN
                      v_primo := v_motivi -> 0;
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', TG_NAME,
                          v_primo ->> 'codice',
                          jsonb_build_object(
                              'movimento_annullato_id', NEW.annulla_movimento_id,
                              'titolo_iva_id',          NEW.titolo_iva_id,
                              'motivi',                 v_motivi),
                          NEW.tx_id,
                          -- ⚠️ I valori della frase viaggiano CON il motivo, per
                          --   non ricomporre in due posti la frase che
                          --   l'operatore legge.
                          VARIADIC ARRAY(SELECT jsonb_array_elements_text(
                                                    v_primo -> 'valori')));
                  END IF;

                  -- ---- 2) COERENZA -----------------------------------------
                  -- La riga esiste ed e' annullabile: la si rilegge per i due
                  -- confronti. Nessuna query in piu' rispetto a prima — la
                  -- check non restituisce questi valori di proposito, perche'
                  -- non sono motivi di blocco ma difetti di scrittura.
                  SELECT m.titolo_iva_id, m.imponibile
                    INTO v_ann
                    FROM anagrafiche.soggetti_titoli_iva_movimenti m
                   WHERE m.id = NEW.annulla_movimento_id;

                  IF NEW.titolo_iva_id IS DISTINCT FROM v_ann.titolo_iva_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', TG_NAME,
                          'E_TITOLO_IVA_ANNULLO_INCOERENTE',
                          jsonb_build_object(
                              'movimento_annullato_id', NEW.annulla_movimento_id,
                              'titolo_atteso',          v_ann.titolo_iva_id,
                              'titolo_ricevuto',        NEW.titolo_iva_id),
                          NEW.tx_id,
                          NEW.annulla_movimento_id::text,
                          'l''annullo appartiene a un titolo IVA diverso da quello del movimento annullato');
                  END IF;

                  IF NEW.imponibile IS DISTINCT FROM (- v_ann.imponibile) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', TG_NAME,
                          'E_TITOLO_IVA_ANNULLO_INCOERENTE',
                          jsonb_build_object(
                              'movimento_annullato_id', NEW.annulla_movimento_id,
                              'imponibile_atteso',      - v_ann.imponibile,
                              'imponibile_ricevuto',    NEW.imponibile),
                          NEW.tx_id,
                          NEW.annulla_movimento_id::text,
                          'l''importo dell''annullo non e'' l''opposto esatto del movimento annullato');
                  END IF;

                  RETURN NEW;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.trgfn_stiva_movimenti_guard_annullo()
              IS 'Guard sulle righe che ANNULLANO un movimento del registro plafond IVA (BEFORE INSERT, WHEN annulla_movimento_id IS NOT NULL). Due famiglie di controlli: (1) AMMISSIBILITA'', che non e'' scritta qui ma si CHIAMA da script.fn_check_annullo_movimento_titolo_iva sollevando il codice del PRIMO motivo — cosi'' il pulsante spento del read-side e questo rifiuto leggono la stessa regola e non possono divergere; (2) COERENZA della riga scritta — stesso titolo IVA e importo esattamente opposto — che e'' difesa contro una scrittura DIRETTA, perche'' passando dalla madre quei valori sono derivati. ⛔ Il controllo sull''importo e'' cio'' che rende vero il presidio del brief: senza, un annullo di 100 su una forzatura di 250 passerebbe e imponibile_utilizzato non tornerebbe al valore precedente. ⛔ Quello sul titolo e'' il peggiore dei due: decurterebbe il plafond sbagliato SENZA sollevare niente, perche'' l''accumulatore somma per titolo e del collegamento non sa nulla. ⛔ SECURITY DEFINER perche'' legge la riga annullata su una tabella con RLS: da INVOKER «fuori perimetro» si leggerebbe come «non esiste» mentre la FK la RLS la scavalca sempre. La madre resta INVOKER. ⚠️ Solo BEFORE INSERT: dal 20260830-22 il registro non ammette UPDATE. Piano: brief-db-titoli-iva-movimenti-annullo, B-c.';

              DROP TRIGGER IF EXISTS trg_stiva_movimenti_a10_guard_annullo_ins
                  ON anagrafiche.soggetti_titoli_iva_movimenti;

              CREATE TRIGGER trg_stiva_movimenti_a10_guard_annullo_ins
                  BEFORE INSERT ON anagrafiche.soggetti_titoli_iva_movimenti
                  FOR EACH ROW
                  WHEN (NEW.annulla_movimento_id IS NOT NULL)
                  EXECUTE FUNCTION anagrafiche.trgfn_stiva_movimenti_guard_annullo();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_stiva_movimenti_a10_guard_annullo_ins
                  ON anagrafiche.soggetti_titoli_iva_movimenti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_stiva_movimenti_guard_annullo();
