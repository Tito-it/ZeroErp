# Liquibase changelog per Zero ERP
# Trigger sync geoloc su indirizzi_soggetti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20260105-013-create-trg-indirizzi-soggetti-sync-geoloc-mctit.yaml

  - changeSet:
      id: 20260105-01-create-trg-indirizzi-soggetti-sync-geoloc
      author: mctit
      comment: >
        Crea trigger di sync geoloc per anagrafiche.indirizzi_soggetti
        usando anagrafiche.trgfn_indirizzi_sync_geoloc().

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_indirizzi_soggetti_sync_geoloc_ins_upd
                ON anagrafiche.indirizzi_soggetti;

              CREATE TRIGGER trg_indirizzi_soggetti_sync_geoloc_ins_upd
              BEFORE INSERT OR UPDATE
              ON anagrafiche.indirizzi_soggetti
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_indirizzi_sync_geoloc();

              COMMENT ON TRIGGER trg_indirizzi_soggetti_sync_geoloc_ins_upd
              ON anagrafiche.indirizzi_soggetti
              IS 'Trigger per sincronizzare geoloc da anagrafiche.indirizzi_dettaglio (usa trgfn_indirizzi_sync_geoloc).';
