                            END IF;

                            RETURN NEW;
                        END;
                        $BODY$;


                        COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_guard_dati_societari_required()
                            IS '
                        Constraint trigger function (DEFERRABLE) su anagrafiche.soggetti che verifica,
                        a fine transazione, che per i soggetti il cui tipo_soggetto_dettaglio ha
                        dati_societari_policy = ''REQUIRED'' esista una riga in anagrafiche.dati_societari.

                        In caso di violazione utilizza script.fn_log_and_raise_error con codice
                        E_DATI_SOCIETARI_REQUIRED_MANCANTI.
                        ';



                        -- DROP TRIGGER IF EXISTS trg_soggetti_guard_dati_societari_required_ins_upd ON anagrafiche.soggetti;

                        CREATE CONSTRAINT TRIGGER trg_soggetti_def_guard_dati_societari_required_ins_upd
                            AFTER INSERT OR UPDATE
                            ON anagrafiche.soggetti
                            DEFERRABLE INITIALLY DEFERRED
                            FOR EACH ROW
                            EXECUTE FUNCTION anagrafiche.trgfn_soggetti_guard_dati_societari_required();

                        COMMENT ON TRIGGER trg_soggetti_def_guard_dati_societari_required_ins_upd ON anagrafiche.soggetti
                            IS '
                        Constraint trigger DEFERRABLE su anagrafiche.soggetti che, per i soggetti
                        con tipo_soggetto_dettaglio avente dati_societari_policy = ''REQUIRED'',
                        verifica a fine transazione l''esistenza di una riga in anagrafiche.dati_societari.
                        ';
