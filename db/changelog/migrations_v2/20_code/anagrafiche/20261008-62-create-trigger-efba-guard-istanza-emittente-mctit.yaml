# ------------------------------------------------------------
# CAMBIARE L'EMITTENTE DI UN BA NON SPACCA LA SUA ISTANZA
#   NASCE anagrafiche.trgfn_efba_guard_istanza_emittente
#   + trigger trg_emittenti_fiscali_ba_z95_guard_istanza_ef_ins_upd_dlt
#     (AFTER INSERT OR UPDATE OR DELETE ON anagrafiche.emittenti_fiscali_billing_account).
#   Brief: brief-db-istanza-nasce-col-ba (R-7, §6.4)
#
# -- I MOVIMENTI ----------------------------------------------------
#   L'emittente di un BA cambia solo da qui, in quattro modi — gli stessi che
#   presidia trgfn_efba_guard_albero_emittente per l'albero:
#     1. collegamento creato (anche alla nascita del BA, da link_ef);
#     2. collegamento cambiato di emittente;
#     3. collegamento tolto: il BA ricade sul predefinito;
#     4. riga del predefinito (billing_account_id NULL) creata, cambiata o
#        tolta: raggio N, fn_guard_istanza_ba_gestore_globale (-60).
#   Se una riga passa da un BA a un altro (caso teorico, uq_emittenti_fiscali_ba)
#   si verificano entrambi.
#   ⚠️ Lo spostamento resta sotto il cancello della storia
#   (trgfn_efba_guard_storia_emittente, BEFORE): questo guard chiede un'altra
#   cosa, e i due si sommano.
#
# -- PERCHE' AFTER --------------------------------------------------
#   Il guard rilegge il collegamento per risolvere l'emittente: deve vedere la
#   riga gia' scritta. z95, come il gemello dell'albero sulla stessa tabella.
#
# Ritorno indietro: DROP del trigger e della funzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261008-62-create-trigger-efba-guard-istanza-emittente-mctit.yaml

  - changeSet:
      id: 20261008-62-create-trigger-efba-guard-istanza-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Trigger AFTER su emittenti_fiscali_billing_account: creare, cambiare o togliere il
        collegamento di un BA (o spostare il predefinito) non mette la sua istanza su due
        emittenti. Brief: brief-db-istanza-nasce-col-ba (R-7).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_efba_guard_istanza_emittente()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_ba_id anagrafiche.billing_account.id%TYPE;
              BEGIN
                  -- Su DELETE il BA sta in OLD; in creazione in NEW.
                  -- Una riga spostata da un BA a un altro: vanno verificati
                  -- entrambi.
                  IF TG_OP = 'UPDATE'
                     AND NEW.billing_account_id IS DISTINCT FROM OLD.billing_account_id THEN
                      PERFORM anagrafiche.fn_guard_istanza_ba_emittente(OLD.billing_account_id);
                      PERFORM anagrafiche.fn_guard_istanza_ba_emittente(NEW.billing_account_id);
                      IF OLD.billing_account_id IS NULL OR NEW.billing_account_id IS NULL THEN
                          PERFORM anagrafiche.fn_guard_istanza_ba_gestore_globale();
                      END IF;
                      RETURN NULL;
                  END IF;

                  IF TG_OP = 'DELETE' THEN
                      v_ba_id := OLD.billing_account_id;
                  ELSE
                      v_ba_id := NEW.billing_account_id;
                  END IF;

                  IF v_ba_id IS NOT NULL THEN
                      -- Movimenti 1-3: collegamento di un BA creato, cambiato
                      -- o tolto.
                      PERFORM anagrafiche.fn_guard_istanza_ba_emittente(v_ba_id);
                      RETURN NULL;
                  END IF;

                  -- Movimento 4: la riga senza billing_account_id e' quella
                  -- del gestore globale. Raggio N.
                  PERFORM anagrafiche.fn_guard_istanza_ba_gestore_globale();
                  RETURN NULL;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_efba_guard_istanza_emittente()
              IS 'Trigger AFTER su anagrafiche.emittenti_fiscali_billing_account: presidia i movimenti che cambiano l''emittente di un BA — collegamento creato, cambiato o tolto (fn_guard_istanza_ba_emittente) e riga del gestore globale (fn_guard_istanza_ba_gestore_globale, raggio N) — perche'' nessuna istanza finisca con billing account di due emittenti (E_ISTANZA_EMITTENTI_DIVERSI). Gemello di trgfn_efba_guard_albero_emittente, che presidia gli stessi movimenti per l''albero padre/figlio. AFTER perche'' il guard rilegge il collegamento. Brief: brief-db-istanza-nasce-col-ba (R-7).';

              CREATE TRIGGER trg_emittenti_fiscali_ba_z95_guard_istanza_ef_ins_upd_dlt
                AFTER INSERT OR UPDATE OR DELETE ON anagrafiche.emittenti_fiscali_billing_account
                FOR EACH ROW
                EXECUTE FUNCTION anagrafiche.trgfn_efba_guard_istanza_emittente();

              COMMENT ON TRIGGER trg_emittenti_fiscali_ba_z95_guard_istanza_ef_ins_upd_dlt
                ON anagrafiche.emittenti_fiscali_billing_account
              IS 'Un''istanza ha billing account di un solo emittente (E_ISTANZA_EMITTENTI_DIVERSI): presidia creazione, cambio e cancellazione del collegamento BA -> emittente e lo spostamento del gestore globale. Gemello di trg_emittenti_fiscali_ba_z95_guard_albero_emittente_ins_upd_dlt. Brief: brief-db-istanza-nasce-col-ba (R-7).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_ba_z95_guard_istanza_ef_ins_upd_dlt ON anagrafiche.emittenti_fiscali_billing_account;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_efba_guard_istanza_emittente();
