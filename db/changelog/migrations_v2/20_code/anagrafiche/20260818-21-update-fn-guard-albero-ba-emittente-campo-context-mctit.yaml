# IL CANALE DEL CAMPO ERA MUTO — `'column'` invece di `'campo'`
#   Richiesta R-2 del perimetro BE (2026-08-18).
#
# LA MISURA. `script.fn_log_and_raise_error` porta al client DUE cose
#   strutturate: il codice di dominio nel canale CONSTRAINT e il NOME DEL CAMPO
#   da correggere nel canale COLUMN. Il secondo lo legge dal context, e legge
#   una chiave precisa:
#
#       v_campo := nullif(btrim(coalesce(p_context ->> 'campo', '')), '');
#       IF v_campo IS NULL THEN ... p_context ->> 'parametro' ... END IF;
#
#   I guard applicati il 2026-08-18 scrivevano `'column'`. Il messaggio
#   arrivava, il campo no: banner giusto, e il campo del form spento.
#
# ⚠️ NON E' UN REFUSO DI DISTRAZIONE, ed e' il motivo per cui vale la pena
#   scriverlo. `'column'` E' una chiave usata da tempo in questo codice come
#   annotazione DIAGNOSTICA del context (`trgfn_qta_from_operativa`,
#   `trgfn_lock_columns`, …): venti file la usano, undici usano `'campo'`. Ha
#   l'aria giusta e in review non salta all'occhio — la differenza si vede solo
#   leggendo il corpo della funzione che la consuma, non il nome della chiave.
#
# ⛔ Per questo le funzioni STORICHE non si toccano: li' `'column'` significa
#   un'altra cosa e la sta dicendo bene. Il perimetro sono i guard nuovi, che
#   dichiarano nel proprio `note` a catalogo «Campo da dichiarare al client:
#   parent_account_id» — l'intenzione era esplicita e non arrivava a
#   destinazione.
#
# ⭐ E IL PERIMETRO DELLA RICHIESTA ERA INCOMPLETO. La R-2 misurava 2
#   occorrenze (nel 20260818-08). Sono CINQUE: le altre tre stanno nel
#   20260818-05 — stesso giorno, stesso cantiere, STESSO CAMPO.
#   ⚠️ Correggerne solo una meta' sarebbe peggio del difetto uniforme: il form
#   si accenderebbe con un guard e resterebbe spento con un altro sullo stesso
#   campo. Un difetto costante si nota e si segnala; uno intermittente fa
#   cercare il problema nel frontend.
#
# ⛔ NON toccata la 20260818-17 (`'column', 'multi_emittente'`), che la
#   richiesta includeva: `multi_emittente` non compare in NESSUN file del
#   frontend e la sua colonna si scrive solo dal seed. Dichiararlo come campo
#   direbbe al form di accendere un campo che non esiste in nessuna schermata:
#   li' `'column'` e' l'uso diagnostico corretto.
#
# ⚠️ I due changeSet d'origine sono gia' pushati e non si toccano: si ridefinisce
#   in avanti. Nessun'altra modifica al corpo — solo la chiave del context.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260818-21-update-fn-guard-albero-ba-emittente-campo-context-mctit.yaml

  - changeSet:
      id: 20260818-21-update-fn-guard-albero-ba-emittente-campo-context
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        R-2 del perimetro BE: il context dichiarava il campo sotto la chiave 'column', mentre fn_log_and_raise_error legge 'campo'. Il codice di dominio arrivava al client, il nome del campo no: banner giusto e «Account padre» spento. Solo la chiave del context, nessun'altra modifica al corpo.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_guard_albero_ba_emittente';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_guard_albero_ba_emittente(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public
              AS $function$
              DECLARE
                  v_padre_id anagrafiche.billing_account.id%TYPE;
                  r          record;
              BEGIN
                  -- ⚠️ SECURITY DEFINER: legge anagrafiche.billing_account, che ha
                  --   la RLS. Da SECURITY INVOKER un padre o un figlio di un altro
                  --   emittente sarebbe INVISIBILE, e il guard direbbe «a posto»
                  --   proprio nel caso che deve bloccare (brief §11.1).
                  IF p_billing_account_id IS NULL THEN
                      RETURN;
                  END IF;

                  SELECT ba.parent_account_id
                    INTO v_padre_id
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = p_billing_account_id;

                  -- BA inesistente: non e' compito di questo guard (lo dice la FK,
                  -- o E_PARENT_NON_RAGGIUNGIBILE del guard di coerenza).
                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- a) verso il PADRE
                  IF v_padre_id IS NOT NULL
                     AND NOT anagrafiche.fn_check_ba_coppia_emittente_omogenea(
                               p_billing_account_id, v_padre_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'fn_guard_albero_ba_emittente',
                          'E_ALBERO_EMITTENTE_MISTO',
                          jsonb_build_object(
                              'verso', 'padre',
                              'billing_account_id', p_billing_account_id,
                              'parent_account_id', v_padre_id,
                              'campo',  'parent_account_id',
                              'emittente_sr_figlio', anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id),
                              'emittente_sr_padre',  anagrafiche.fn_get_emittente_fiscale_id(v_padre_id)
                          ),
                          NULL::uuid,
                          p_billing_account_id::text,
                          v_padre_id::text,
                          anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id)::text,
                          anagrafiche.fn_get_emittente_fiscale_id(v_padre_id)::text
                      );
                  END IF;

                  -- b) verso i FIGLI
                  --    ⚠️ Il movimento che si dimentica sempre: cambiare
                  --    l'emittente di un BA non spacca solo il legame verso
                  --    l'alto, spacca anche quelli verso il basso.
                  FOR r IN
                      SELECT ba.id
                        FROM anagrafiche.billing_account ba
                       WHERE ba.parent_account_id = p_billing_account_id
                       ORDER BY ba.id
                  LOOP
                      IF NOT anagrafiche.fn_check_ba_coppia_emittente_omogenea(
                               r.id, p_billing_account_id) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'anagrafiche', 'fn_guard_albero_ba_emittente',
                              'E_ALBERO_EMITTENTE_MISTO',
                              jsonb_build_object(
                                  'verso', 'figlio',
                                  'billing_account_id', r.id,
                                  'parent_account_id', p_billing_account_id,
                                  'campo',  'parent_account_id',
                                  'emittente_sr_figlio', anagrafiche.fn_get_emittente_fiscale_id(r.id),
                                  'emittente_sr_padre',  anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id)
                              ),
                              NULL::uuid,
                              r.id::text,
                              p_billing_account_id::text,
                              anagrafiche.fn_get_emittente_fiscale_id(r.id)::text,
                              anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id)::text
                          );
                      END IF;
                  END LOOP;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_guard_albero_ba_emittente(bigint) IS
                  'Guard fail-fast: verifica che il billing account indicato sia omogeneo per '
                  'emittente con il PADRE e con TUTTI i FIGLI. Solleva E_ALBERO_EMITTENTE_MISTO '
                  'nominando i due BA e i due emittenti. SECURITY DEFINER perche'' legge '
                  'anagrafiche.billing_account, che ha la RLS: da SECURITY INVOKER un padre o un '
                  'figlio di un altro emittente sarebbe invisibile e il guard direbbe «a posto» '
                  'proprio nel caso da bloccare (brief §11.1). Nessuna eccezione per il pregresso '
                  'e nessuna GUC di override: un invariante con l''interruttore non e'' un '
                  'invariante. Brief P-1 §3.5.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
