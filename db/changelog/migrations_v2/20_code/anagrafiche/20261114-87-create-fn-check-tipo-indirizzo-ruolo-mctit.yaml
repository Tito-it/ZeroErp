# ------------------------------------------------------------
# «QUESTO TIPO DI INDIRIZZO, PER QUESTO RUOLO (E ISTANZA)?» — LA CHECK, IN DUE META'
#   anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(tipo ruolo, tipi presenti, tipo, oggi, ruolo) -> jsonb
#   anagrafiche.fn_check_tipo_indirizzo_ruolo(ruolo, istanza, tipo) -> jsonb
#   Brief: brief-db-copia-indirizzo-soggetto §4.6, giro 1 (D-1, D-3).
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   Gemella della check sul soggetto (-86). Sul ruolo il «tipo gia' presente»
#   lo rifiutano oggi solo i due indici uq_indirizzi_ruolo_tipo_no_istanza e
#   uq_indirizzi_ruolo_istanza_tipo, senza codice. La singolare del ruolo la
#   chiama (-89).
#
# ── LA FORMA ────────────────────────────────────────────────────
#   Come la gemella. In ordine:
#   1. TIPO_GIA_PRESENTE            E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE (nuovo)
#   2. TIPO_NON_AMMESSO_DAL_RUOLO   E_TIPO_INDIRIZZO_NON_PERMESSO (quello del guard)
#      col predicato anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo (-84).
#   ⭐ «Gia' presente» ha la chiave con l'istanza: lo stesso tipo e' ammesso
#   una volta sul ruolo senza istanza e una volta per ogni istanza. La meta'
#   sul contesto riceve i tipi presenti GIA' filtrati per quella chiave; la
#   firma completa li legge con istanza IS NOT DISTINCT FROM quella data
#   (NULL = il ruolo), cioe' la chiave dei due indici.
#   La meta' sul contesto non legge il ruolo: la usa anche il picker sul tipo
#   di ruolo, all'assegnazione, quando il ruolo non esiste ancora.
#   STABLE, SECURITY INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261114-87-create-fn-check-tipo-indirizzo-ruolo-mctit.yaml

  - changeSet:
      id: 20261114-87-create-fn-check-tipo-indirizzo-ruolo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La check del tipo di indirizzo sul ruolo (gia' presente nella sua chiave con
        l'istanza, non ammesso dal tipo di ruolo), divisa in contesto e motivi.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(
                  p_tipo_ruolo_id     anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE,
                  p_tipi_presenti     integer[],  -- array: %TYPE[] non esiste
                  p_tipo_indirizzo_id anagrafiche.indirizzi.tipo_indirizzo_id%TYPE,
                  p_oggi              config.tipi_ruolo_tipi_indirizzo.valido_dal%TYPE,
                  p_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  c_chi        CONSTANT text := 'anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto';
                  v_motivi     jsonb := '[]'::jsonb;
                  v_tipo_nome  config.tipi_indirizzi.descrizione%TYPE;
                  v_ruolo_nome config.tipi_ruoli.descrizione%TYPE;
                  v_dettaglio  jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   I motivi per cui il tipo di indirizzo non si puo'
                  --   scrivere su un ruolo con questo contesto: il tipo di
                  --   ruolo e i tipi che la chiave (ruolo, istanza) ha gia'.
                  --   [] = ammesso.
                  --
                  -- Regole:
                  --   - l'ordine dell'array e' il contratto: la madre solleva
                  --     il primo (§12.5.2);
                  --   - il predicato del tipo di ruolo e' quello del guard
                  --     (fn_tipo_indirizzo_ammesso_per_ruolo), sul giorno
                  --     passato dal chiamante;
                  --   - ruolo NULL: il ruolo non esiste ancora (picker
                  --     all'assegnazione); conta solo per la frase.
                  -- =========================================================
                  IF p_tipo_indirizzo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_tipo_indirizzo_id'),
                          NULL::uuid,
                          c_chi,
                          'manca il tipo di indirizzo');
                  END IF;

                  IF p_oggi IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_oggi'),
                          NULL::uuid,
                          c_chi,
                          'manca il giorno');
                  END IF;

                  SELECT ti.descrizione INTO v_tipo_nome
                    FROM config.tipi_indirizzi ti
                   WHERE ti.id = p_tipo_indirizzo_id;
                  v_tipo_nome := COALESCE(v_tipo_nome, p_tipo_indirizzo_id::text);

                  v_dettaglio := jsonb_build_object(
                      'tipo_indirizzo_id', p_tipo_indirizzo_id,
                      'tipo_ruolo_id',     p_tipo_ruolo_id,
                      'soggetto_ruolo_id', p_soggetto_ruolo_id);

                  -- ---- 1. la chiave (ruolo, istanza) ha gia' quel tipo ----
                  IF p_tipo_indirizzo_id = ANY (COALESCE(p_tipi_presenti, '{}'::integer[])) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE',
                          'reason',     'TIPO_GIA_PRESENTE',
                          'reason_key', 'anagrafiche.indirizzi.tipo_blocco.gia_presente',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(v_tipo_nome));
                  END IF;

                  -- ---- 2. il tipo di ruolo non ammette il tipo ------------
                  IF NOT anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo(
                             p_tipo_ruolo_id, p_tipo_indirizzo_id, p_oggi) THEN
                      SELECT tr.descrizione INTO v_ruolo_nome
                        FROM config.tipi_ruoli tr
                       WHERE tr.id = p_tipo_ruolo_id;
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TIPO_INDIRIZZO_NON_PERMESSO',
                          'reason',     'TIPO_NON_AMMESSO_DAL_RUOLO',
                          'reason_key', 'anagrafiche.indirizzi.tipo_blocco.non_ammesso_dal_ruolo',
                          'dettaglio',  v_dettaglio,
                          'valori',     jsonb_build_array(
                                            v_tipo_nome,
                                            COALESCE(v_ruolo_nome, p_tipo_ruolo_id::text),
                                            COALESCE(p_soggetto_ruolo_id::text, '-')));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(
                  anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE,
                  integer[],
                  anagrafiche.indirizzi.tipo_indirizzo_id%TYPE,
                  config.tipi_ruolo_tipi_indirizzo.valido_dal%TYPE,
                  anagrafiche.soggetti_ruoli.id%TYPE)
              IS 'I motivi per cui un tipo di indirizzo non si puo'' scrivere su un ruolo, dato il contesto: il tipo di ruolo, i tipi che la chiave (ruolo, istanza) ha gia'', il giorno. Check pura: array ordinato di {codice, reason, reason_key, dettaglio, valori}, [] se ammesso. In ordine: il tipo gia'' presente (TIPO_GIA_PRESENTE, E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE, chiave anagrafiche.indirizzi.tipo_blocco.gia_presente; valori: il tipo); il tipo che il tipo di ruolo non ammette (TIPO_NON_AMMESSO_DAL_RUOLO, E_TIPO_INDIRIZZO_NON_PERMESSO, chiave anagrafiche.indirizzi.tipo_blocco.non_ammesso_dal_ruolo; valori: il tipo, il tipo di ruolo, il ruolo), col predicato di anagrafiche.fn_tipo_indirizzo_ammesso_per_ruolo. I tipi presenti arrivano gia'' filtrati per la chiave con l''istanza. Il ruolo serve solo alla frase e al dettaglio: NULL quando il ruolo non esiste ancora. Tipo o giorno mancanti: E_SCRIPT_CHIAMATA_NON_VALIDA. La compone anagrafiche.fn_check_tipo_indirizzo_ruolo, che legge il contesto dal ruolo salvato. Gemella di anagrafiche.fn_check_tipo_indirizzo_soggetto_su_contesto.';

              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_tipo_indirizzo_ruolo(
                  p_soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE,
                  p_istanza_utility_id anagrafiche.indirizzi.istanza_utility_id%TYPE,
                  p_tipo_indirizzo_id  anagrafiche.indirizzi.tipo_indirizzo_id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  c_chi        CONSTANT text := 'anagrafiche.fn_check_tipo_indirizzo_ruolo';
                  v_tipo_ruolo anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE;
                  v_motivi     jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   I motivi per cui il tipo di indirizzo non si puo'
                  --   scrivere sul ruolo salvato, sul ruolo stesso (istanza
                  --   NULL) o su una sua istanza. Legge il contesto e lo
                  --   passa alla meta' sui motivi; il giorno e'
                  --   script.fn_data_operativa(), quello del guard.
                  --
                  -- Regole:
                  --   - i tipi presenti si leggono sulla chiave dei due indici
                  --     (istanza IS NOT DISTINCT FROM quella data): un tipo
                  --     del ruolo non blocca la stessa istanza, e viceversa.
                  -- =========================================================
                  IF p_soggetto_ruolo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_soggetto_ruolo_id'),
                          NULL::uuid,
                          c_chi,
                          'manca il ruolo');
                  END IF;

                  SELECT sr.tipo_ruolo_id
                    INTO v_tipo_ruolo
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = p_soggetto_ruolo_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SOGGETTO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          NULL::uuid,
                          p_soggetto_ruolo_id::text);
                  END IF;

                  -- ⚠️ La delega si scrive come assegnazione (:=): e' la forma che
                  --   dbops.vw_funzioni_check_codici sa leggere per legare i codici.
                  v_motivi := anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(
                      v_tipo_ruolo,
                      ARRAY(SELECT i.tipo_indirizzo_id
                              FROM anagrafiche.indirizzi i
                             WHERE i.soggetto_ruolo_id = p_soggetto_ruolo_id
                               AND i.istanza_utility_id IS NOT DISTINCT FROM p_istanza_utility_id),
                      p_tipo_indirizzo_id,
                      script.fn_data_operativa(),
                      p_soggetto_ruolo_id);

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_tipo_indirizzo_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE,
                  anagrafiche.indirizzi.istanza_utility_id%TYPE,
                  anagrafiche.indirizzi.tipo_indirizzo_id%TYPE)
              IS 'I motivi per cui il tipo di indirizzo non si puo'' scrivere sul ruolo salvato, sul ruolo stesso (istanza NULL) o su una sua istanza: legge il tipo di ruolo e i tipi che la chiave (ruolo, istanza) ha gia'' (la chiave di uq_indirizzi_ruolo_tipo_no_istanza e uq_indirizzi_ruolo_istanza_tipo) e li passa a anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto, col giorno di script.fn_data_operativa(). Array ordinato di motivi, [] se ammesso: il tipo gia'' presente (E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE), poi il tipo che il tipo di ruolo non ammette (E_TIPO_INDIRIZZO_NON_PERMESSO). Ruolo mancante E_SCRIPT_CHIAMATA_NON_VALIDA, inesistente E_SOGGETTO_RUOLO_NON_TROVATO. SECURITY INVOKER. La chiama anagrafiche.fn_crea_indirizzo_ruolo, che solleva il primo motivo prima di scrivere. Gemella di anagrafiche.fn_check_tipo_indirizzo_soggetto.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_check_tipo_indirizzo_ruolo(bigint, bigint, integer);
              DROP FUNCTION IF EXISTS anagrafiche.fn_check_tipo_indirizzo_ruolo_su_contesto(integer, integer[], integer, date, bigint);
