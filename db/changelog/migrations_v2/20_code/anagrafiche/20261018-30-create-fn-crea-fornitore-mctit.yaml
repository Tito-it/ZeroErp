# BB: CREARE UN FORNITORE
#   anagrafiche.fn_crea_fornitore(soggetto, campi, contatto, indirizzi): il
#   ruolo FO del soggetto (get_or_create), la riga di anagrafiche.fornitori
#   nello stato iniziale, il contatto del ruolo e gli indirizzi del ruolo, in
#   una sola istruzione (madre, linee-guida-sql §5b).
#   Brief: brief-db-processi-accensione-per-ambiente, §5-ter.2 (2b-1, lotto 4).
#
# -- CHI ERA LA COPIA ---------------------------------------------------
#   * il backend, FornitoriService.crea_fornitore: una saga di quattro passi
#     in transaction.atomic (get_or_create del ruolo, execute_dynamic_insert
#     con lo stato VE come espressione, il contatto inline, gli indirizzi via
#     SoggettiService.create_indirizzi_ruolo). Passa al BB nella 2b-2;
#   * il pgTAP script/test-search-regola-unica-visibile-v1: INSERT diretto.
#     Passa al BB nello stesso giro.
#
# -- LE SCELTE ----------------------------------------------------------
#   * i campi sono le chiavi opzionali del backend (_CREATE_ALLOWED meno
#     soggetto_ruolo_id e stato_fornitore_id). Una chiave estranea si RIFIUTA
#     col suo nome (E_CAMPO_NON_AMMESSO). Una chiave a null vale assente
#     (jsonb_strip_nulls): e' lo skip_none del backend, cosi' il DEFAULT e il
#     codice generato (trgfn_fornitori_gen_codice) restano attivi;
#   * lo stato iniziale e' VE («in verifica»), come nel backend: non e' un
#     campo. Chi vuole un altro stato fa un UPDATE dopo, come per ogni
#     passaggio di stato;
#   * contatto e indirizzi passano dai loro BB (lotti 2 e 3): la madre non
#     ne ripete le regole. Contatto NULL = nessun contatto (il backend decide
#     se chiamare: EMPTY/PARTIAL/VALID resta suo); indirizzi = elenco, vuoto
#     ammesso (i tipi obbligatori li pretende il guard differito al commit).
#
# -- CHE COSA RESTA FUORI, apposta ---------------------------------------
#   * il permesso: il dominio anagrafiche lo lascia al backend (precedente
#     B-5). INVOKER, come fn_crea_emittente_fiscale;
#   * i duplicati (uq_fornitori_soggetto_ruolo_id, uq_fornitori_codice) e le
#     FK escono coi loro vincoli: il backend li traduce per nome, come oggi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261018-30-create-fn-crea-fornitore-mctit.yaml

  - changeSet:
      id: 20261018-30-create-fn-crea-fornitore
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea anagrafiche.fn_crea_fornitore: ruolo FO, riga di fornitori nello stato VE, contatto e
        indirizzi del ruolo in una madre, sopra i BB dei lotti 2 e 3. Prende il posto della saga
        del backend e dell'INSERT di un pgTAP. Brief: brief-db-processi-accensione-per-ambiente
        (2b-1, lotto 4).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "4"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('script', 'fn_scrivi_riga_da_jsonb'),
                                                ('script', 'fn_prima_chiave_estranea'),
                                                ('anagrafiche', 'fn_crea_contatto'),
                                                ('anagrafiche', 'fn_crea_indirizzi_ruolo'));
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_fornitore(
                  p_soggetto_id anagrafiche.soggetti.id%TYPE,
                  p_campi       jsonb DEFAULT '{}'::jsonb,
                  p_contatto    jsonb DEFAULT NULL::jsonb,
                  p_indirizzi   jsonb DEFAULT '[]'::jsonb)
               RETURNS TABLE(fornitore_id      anagrafiche.fornitori.id%TYPE,
                             soggetto_ruolo_id anagrafiche.fornitori.soggetto_ruolo_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_campi    jsonb := COALESCE(p_campi, '{}'::jsonb);
                  v_estranea text;
                  v_sr_id    anagrafiche.fornitori.soggetto_ruolo_id%TYPE;
                  v_fo_id    anagrafiche.fornitori.id%TYPE;
                  -- Le chiavi opzionali: quelle del backend (_CREATE_ALLOWED),
                  -- meno il ruolo e lo stato, che decide la madre.
                  c_ammesse  CONSTANT text[] := ARRAY[
                      'codice', 'valuta_id', 'modalita_pagamento_id', 'termine_pagamento_id',
                      'giorni_pagamento', 'fine_mese', 'split_payment', 'ritenuta_acconto',
                      'ritenuta_aliquota', 'regime_fiscale', 'bollo_esente', 'canale_fe',
                      'pec_email', 'rating', 'qualifica_scadenza', 'note'];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Fare di un soggetto un fornitore: il ruolo FO
                  --   (get_or_create), la riga di fornitori nello stato
                  --   iniziale VE con le chiavi di p_campi (le assenti, e le
                  --   null, al DEFAULT), il contatto del ruolo (se c'e') e gli
                  --   indirizzi del ruolo. Ritorna (fornitore_id,
                  --   soggetto_ruolo_id).
                  --
                  -- Regole:
                  --   - una chiave fuori elenco si rifiuta: E_CAMPO_NON_AMMESSO;
                  --   - contatto e indirizzi: le regole sono dei loro BB;
                  --   - duplicati e FK escono dai vincoli.
                  -- =========================================================
                  IF p_soggetto_id IS NULL OR jsonb_typeof(v_campi) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_crea_fornitore', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('soggetto_id', p_soggetto_id,
                                             'tipo_campi',  jsonb_typeof(v_campi)),
                          NULL::uuid,
                          'anagrafiche.fn_crea_fornitore',
                          'soggetto mancante o campi che non sono un oggetto');
                  END IF;

                  v_estranea := script.fn_prima_chiave_estranea(v_campi, c_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_crea_fornitore', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  v_sr_id := script.fn_get_or_create_soggetto_ruolo(
                                 p_soggetto_id  := p_soggetto_id,
                                 p_cd_int_ruolo := 'FO');

                  -- Lo stato iniziale: VE, «in verifica» (la regola del backend).
                  v_fo_id := (script.fn_scrivi_riga_da_jsonb(
                                  'anagrafiche.fornitori'::regclass,
                                  jsonb_strip_nulls(v_campi)
                                  || jsonb_build_object(
                                         'soggetto_ruolo_id',  v_sr_id,
                                         'stato_fornitore_id', (SELECT sf.id
                                                                  FROM config.stati_fornitore sf
                                                                 WHERE sf.codice_interno = 'VE')))
                              ->> 'id')::bigint;

                  IF p_contatto IS NOT NULL THEN
                      PERFORM anagrafiche.fn_crea_contatto(p_soggetto_id, v_sr_id, p_contatto);
                  END IF;

                  PERFORM anagrafiche.fn_crea_indirizzi_ruolo(v_sr_id, p_indirizzi);

                  RETURN QUERY SELECT v_fo_id, v_sr_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_fornitore(
                  anagrafiche.soggetti.id%TYPE, jsonb, jsonb, jsonb) IS
                  'Madre (2026-10-18): fa di un soggetto un fornitore in una sola istruzione: il ruolo FO (script.fn_get_or_create_soggetto_ruolo), la riga di anagrafiche.fornitori nello stato iniziale VE, il contatto del ruolo (anagrafiche.fn_crea_contatto, se p_contatto non e'' NULL) e gli indirizzi del ruolo (anagrafiche.fn_crea_indirizzi_ruolo, con l''auto-clone dei tipi obbligatori). p_campi: le chiavi opzionali codice, valuta_id, modalita_pagamento_id, termine_pagamento_id, giorni_pagamento, fine_mese, split_payment, ritenuta_acconto, ritenuta_aliquota, regime_fiscale, bollo_esente, canale_fe, pec_email, rating, qualifica_scadenza, note; le assenti e le null al DEFAULT (il codice lo genera il trigger); una chiave estranea: E_CAMPO_NON_AMMESSO, col campo. Lo stato non e'' un campo: un altro stato e'' un UPDATE dopo. Soggetto mancante o campi non oggetto: E_SCRIPT_CHIAMATA_NON_VALIDA. Contatto e indirizzi rifiutano con i codici dei loro BB; i tipi obbligatori li pretende il guard differito al commit. Duplicati (uq_fornitori_soggetto_ruolo_id, uq_fornitori_codice) e FK escono dai vincoli, che il backend traduce per nome. Non controlla il permesso (dominio anagrafiche, B-5). INVOKER. Ritorna (fornitore_id, soggetto_ruolo_id). Prende il posto di FornitoriService.crea_fornitore (2b-2) e dell''INSERT del pgTAP script/test-search-regola-unica-visibile-v1. Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 4).';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS anagrafiche.fn_crea_fornitore(uuid, jsonb, jsonb, jsonb);
