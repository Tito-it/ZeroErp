databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251120-11-trgfn-istanze-utilities-normalize-mctit.yaml

    - changeSet:
          id: 20251120-11-trgfn-istanze-utilities-normalize
          author: mctit
          comment: "Fix  errore di battitura nella generazione di generazione codice automatico scritto erroneamente come 'istanze_utilties' invece di 'istanze_utilities'"
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |


                        CREATE OR REPLACE FUNCTION anagrafiche.trgfn_istanze_utilities_normalize()
                            RETURNS trigger
                            LANGUAGE 'plpgsql'
                            COST 100
                            VOLATILE NOT LEAKPROOF
                        AS $BODY$
                        BEGIN


                        --  --------------------------------------------------------------
                            -- 1) Generazione codice automatico
                            IF NEW.codice IS NULL THEN
                                NEW.codice := script.fn_generate_codice('istanze_utilities');
                            END IF;

                        RETURN NEW;
                        END;

                        $BODY$;


                        COMMENT ON FUNCTION anagrafiche.trgfn_istanze_utilities_normalize()
                            IS '
                        Function che pulisce i campi di istanze_utilities in anagrafiche.istanze_utilities e imposta i valori di default
                            per le colonne che non hanno un valore specificato.';
