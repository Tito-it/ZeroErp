# D13, terza faccia — `anagrafiche.fn_get_emittente_fiscale_pk` DELEGA la
#   regola a `script.fn_get_ba_emittente_sr_id` invece di tenerne una copia.
#   Brief: brief-db-ba-riserva-emittente-operatore-d13.md
#
# ── ⛔ LA SECONDA COPIA, ed e' il motivo per cui questo file esiste ──────
#   L'estrazione del 2026-08-18 (20260818-58/59) ha messo la regola «quale
#   emittente fattura questo BA» in UN posto e ha fatto delegare
#   fn_check_ba_visible_for_emittenti e, dal 20260819-03,
#   anagrafiche.fn_get_emittente_fiscale_id (l'involucro SR che solleva).
#   Questa funzione — l'involucro PK, nata il 07-04 — NON e' stata toccata:
#   riscriveva la stessa regola a due livelli con le sue due sottoquery.
#   Finche' i due livelli erano gli stessi non si vedeva. Dal 20260913-01 la
#   regola ne ha TRE (in sessione, l'emittente di chi agisce), e le due copie
#   avrebbero risposto cose DIVERSE sullo stesso billing account senza legame:
#   la RLS lo mostra all'operatore Y, e il guard di un preventivo
#   (trgfn_preventivi_guard_emittente_ba, che passa da qui) lo rifiuta
#   perche' «il BA e' del default». Due regole per la stessa domanda, in
#   silenzio — esattamente cio' che l'estrazione del 18-08 voleva impedire.
#
# ── ⭐ COSA RESTA QUI ────────────────────────────────────────────────────
#   Solo cio' che e' SUO: il guard sul parametro (E_PARAMETRO_INVALIDO,
#   invariato — codice, frase e contesto), la traduzione soggetto_ruolo →
#   PK reale, il filtro ef.attivo e il raise E_EMITTENTE_DEFAULT_MISSING
#   quando non c'e' niente — la stessa coppia lettore/involucro che
#   fn_get_emittente_fiscale_id ha gia' con il lettore.
#   ⚠️ ef.attivo: nel corpo vecchio il filtro stava su ENTRAMBE le
#   sottoquery, e un mapping verso un emittente disattivato ricadeva sul
#   default. Quel caso NON esiste sul modello: emittenti_fiscali_billing_account
#   non ha `attivo`, quindi trgfn_prevent_deactivate_if_children blocca la
#   disattivazione di un emittente che ha una riga qualsiasi di mapping, e
#   trgfn_child_requires_active_parent rifiuta una riga verso un emittente
#   spento. Il filtro resta, sull'unico punto in cui si legge la PK, come
#   difesa — non come regola.
#
# Corpo dalla doc auto-gen (= vivo, rev 20260407-01) con le due sottoquery
# sostituite dalla delega; firma e RETURNS con %TYPE, che l'auto-gen scioglie.
# Presidio: db/pgtap/anagrafiche/test-fn-get-emittente-fiscale-pk.sql
#   (in sessione → l'emittente dell'operatore; senza sessione → il default).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260913-03-update-fn-get-emittente-fiscale-pk-delega-al-lettore-mctit.yaml

  - changeSet:
      id: 20260913-03-update-fn-get-emittente-fiscale-pk-delega-al-lettore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        D13: anagrafiche.fn_get_emittente_fiscale_pk non riscrive piu' la
        regola «mapping specifico, altrimenti default» — delega a
        script.fn_get_ba_emittente_sr_id (che dal 20260913-01 ha tre livelli)
        e tiene solo la traduzione SR -> PK, il filtro ef.attivo e i due
        raise, invariati. Una regola, un posto.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_get_emittente_fiscale_pk'
                 AND pg_catalog.pg_get_function_identity_arguments(p.oid)
                     = 'p_billing_account_id bigint';
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_ba_emittente_sr_id'
                 AND pg_catalog.pg_get_function_identity_arguments(p.oid)
                     = 'p_billing_account_id bigint';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ %TYPE in firma e RETURNS (regola del progetto): la doc auto-gen
              --   li scioglie nei tipi risolti, e ricopiarla li perde.
              CREATE OR REPLACE FUNCTION anagrafiche.fn_get_emittente_fiscale_pk(
                  p_billing_account_id anagrafiche.billing_account.id%TYPE
              )
               RETURNS anagrafiche.emittenti_fiscali.id%TYPE
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: la PK reale (anagrafiche.emittenti_fiscali.id) dell'emittente
              --   che fattura un billing account, per chi SCRIVE: solleva se non
              --   e' risolvibile. E' l'involucro PK del lettore
              --   script.fn_get_ba_emittente_sr_id, come
              --   anagrafiche.fn_get_emittente_fiscale_id ne e' l'involucro SR.
              -- ⛔ La regola «quale emittente» NON e' scritta qui (rev 20260913-03,
              --   D13): fino a quel giorno questa funzione ne teneva una copia a
              --   due livelli, e con il terzo livello del lettore (in sessione,
              --   l'emittente di chi agisce) le due copie avrebbero risposto cose
              --   diverse sullo stesso BA senza legame.
              DECLARE
                  v_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE;
              BEGIN
                  -- Guard sul parametro: invariato (codice, frase, contesto).
                  IF p_billing_account_id IS NULL OR p_billing_account_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche',
                          'fn_get_emittente_fiscale_pk',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object(
                              'detail', 'p_billing_account_id obbligatorio e > 0',
                              'billing_account_id', p_billing_account_id
                          ),
                          NULL::uuid,
                          'p_billing_account_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Traduzione soggetto_ruolo -> PK reale. Il filtro ef.attivo
                  -- c'era gia' e resta come DIFESA: sul modello un emittente con
                  -- una riga di mapping non si puo' disattivare
                  -- (trgfn_prevent_deactivate_if_children), quindi il ramo non e'
                  -- raggiungibile — se lo fosse, «non risolto» e' la risposta
                  -- giusta, non un ripiego silenzioso su un'altra azienda.
                  SELECT ef.id
                    INTO v_emittente_fiscale_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.soggetto_ruolo_id
                             = script.fn_get_ba_emittente_sr_id(p_billing_account_id)
                     AND ef.attivo = true;

                  -- Niente da nessuno dei tre livelli: e' l'installazione che
                  -- manca di un emittente, non il chiamante. Invariato.
                  IF v_emittente_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche',
                          'fn_get_emittente_fiscale_pk',
                          'E_EMITTENTE_DEFAULT_MISSING',
                          jsonb_build_object(
                              'detail', 'Emittente fiscale di default mancante o disattivato',
                              'billing_account_id', p_billing_account_id
                          ),
                          NULL::uuid,
                          concat('Emittente fiscale di default mancante per billing_account_id ',
                                 p_billing_account_id::text)
                      );
                  END IF;

                  RETURN v_emittente_fiscale_id;
              END
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_get_emittente_fiscale_pk(bigint) IS
                  'Restituisce anagrafiche.emittenti_fiscali.id (PK numerica reale) per un '
                  'billing_account, e SOLLEVA se non e'' risolvibile. ⭐ Dal 20260913-03 (D13) '
                  'non riscrive piu'' la regola: e'' l''involucro PK di '
                  'script.fn_get_ba_emittente_sr_id — la stessa coppia lettore/involucro di '
                  'anagrafiche.fn_get_emittente_fiscale_id, che ne e'' l''involucro SR. La '
                  'regola ha TRE livelli: mapping specifico; altrimenti, in sessione, '
                  'l''emittente dell''operatore che sta agendo; altrimenti il default. Qui '
                  'restano il guard sul parametro (E_PARAMETRO_INVALIDO su NULL o <= 0), la '
                  'traduzione soggetto_ruolo -> PK con il filtro ef.attivo (difesa: sul '
                  'modello un emittente con una riga di mapping non si disattiva) e '
                  'E_EMITTENTE_DEFAULT_MISSING quando nessun livello risponde. Fino a quel '
                  'changeSet teneva una copia a due livelli della regola, e con il terzo '
                  'livello del lettore le due copie avrebbero risposto cose diverse sullo '
                  'stesso BA senza legame — la RLS lo mostra, il guard del documento lo '
                  'rifiuta. Consumatori: trgfn_<doc>_guard_emittente_ba (preventivi, ordini, '
                  'ddt, resi, contratti, offerte), trgfn_ddt_normalize, trgfn_resi_normalize, '
                  'fn_lookup_utilities_per_ba, fn_genera_pratica_da_preventivo, il backend. '
                  'Brief: brief-db-ba-riserva-emittente-operatore-d13.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente (copia a due livelli) e' nella doc auto-gen
              -- alla revisione 20260407-01. Non si riscrive un corpo stantio.
              SELECT 1;
