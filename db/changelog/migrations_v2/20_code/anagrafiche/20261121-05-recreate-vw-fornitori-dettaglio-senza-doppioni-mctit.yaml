# vw_fornitori_dettaglio ricreata senza i doppioni, col regime dal catalogo
#   (brief-db-fornitore-doppioni-del-soggetto, giro B; D-1, D-2, D-4 di Tid,
#   2026-11-21).
#
#   Droppata da 20261121-03. Stessa proiezione, letta dal catalogo, meno
#   giorni_pagamento, fine_mese, split_payment, bollo_esente, canale_fe e
#   pec_email. regime_fiscale diventa regime_fiscale_rf (il codice RF, la
#   colonna della tabella), e accanto la descrizione del regime da
#   config.regimi_fiscali, per la lista e per il dettaglio.
#   I GRANT li danno le ALTER DEFAULT PRIVILEGES alla creazione, come alla
#   prima nascita della vista.
#   Lettori: la lista configurabile anagrafiche.fornitori (vista_sql) e il
#   repository del BE, che dopo questo giro toglie dalla SELECT della lista
#   le tre colonne uscite (brief §4).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261121-05-recreate-vw-fornitori-dettaglio-senza-doppioni-mctit.yaml

  - changeSet:
      id: 20261121-05-recreate-vw-fornitori-dettaglio-senza-doppioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.vw_fornitori_dettaglio ricreata (droppata da 20261121-03) senza
        i sei doppioni del termine e del soggetto, con regime_fiscale_rf e
        regime_fiscale_descrizione da config.regimi_fiscali. Brief:
        brief-db-fornitore-doppioni-del-soggetto, giro B.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: anagrafiche
                tableName: fornitori
                columnName: regime_fiscale_rf
            - not:
                - viewExists:
                    schemaName: anagrafiche
                    viewName: vw_fornitori_dettaglio
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW anagrafiche.vw_fornitori_dettaglio AS
              SELECT f.id,
                  f.uid,
                  f.codice,
                  f.attivo,
                  f.soggetto_ruolo_id,
                  f.stato_fornitore_id,
                  sf.codice_interno AS stato_codice_interno,
                  sf.codice AS stato_codice,
                  sf.descrizione AS stato_descrizione,
                  sf.descrizione_breve AS stato_descrizione_breve,
                  sf.blocca_ordini,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.codice_fiscale,
                  s.partita_iva,
                  f.valuta_id,
                  v.iso_code AS valuta_iso,
                  f.modalita_pagamento_id,
                  mp.codice AS modalita_pagamento_codice,
                  mp.descrizione AS modalita_pagamento_desc,
                  f.termine_pagamento_id,
                  tp.codice AS termine_pagamento_codice,
                  f.ritenuta_acconto,
                  f.ritenuta_aliquota,
                  f.regime_fiscale_rf,
                  rf.descrizione AS regime_fiscale_descrizione,
                  f.rating,
                  f.qualifica_scadenza,
                  f.data_insert,
                  f.data_update,
                  s.id_fiscale_univoco_cf_piva
                 FROM (((((((anagrafiche.fornitori f
                   JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = f.soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   LEFT JOIN config.stati_fornitore sf ON ((sf.id = f.stato_fornitore_id)))
                   LEFT JOIN config.valute v ON ((v.id = f.valuta_id)))
                   LEFT JOIN config.modalita_pagamento mp ON ((mp.id = f.modalita_pagamento_id)))
                   LEFT JOIN config.termini_pagamento tp ON ((tp.id = f.termine_pagamento_id)))
                   LEFT JOIN config.regimi_fiscali rf ON ((rf.codice_interno = f.regime_fiscale_rf)));

              COMMENT ON VIEW anagrafiche.vw_fornitori_dettaglio IS
                  'Dettaglio fornitore con soggetto, stato, valuta, modalita'' e termine di pagamento, '
                  'ritenuta e regime fiscale (regime_fiscale_rf, il codice RF; '
                  'regime_fiscale_descrizione da config.regimi_fiscali). Sorgente della lista '
                  'configurabile anagrafiche.fornitori (id_fiscale_univoco_cf_piva). '
                  'stato_codice_interno = codice_interno (logica), stato_codice = codice (display). '
                  'Split payment e instradamento FE non stanno qui: sono del soggetto '
                  '(anagrafiche.soggetti, anagrafiche.dati_societari).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS anagrafiche.vw_fornitori_dettaglio;
