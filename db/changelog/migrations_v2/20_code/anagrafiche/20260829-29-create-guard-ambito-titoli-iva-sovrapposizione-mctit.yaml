# I7 (Fase 2) del brief brief-db-be-iva-risolutore-e-regime-cliente, D10/D13 —
# L'ALTRA META' DELL'ANTI-SOVRAPPOSIZIONE: quella che l'EXCLUDE non puo' tenere.
#
# ── ⛔ PERCHE' UN VINCOLO NON BASTA ────────────────────────────────────
#
#   D10 dice che la chiave dell'ambiguita' e' (soggetto, emittente, tipo,
#   AMBITO). Per i titoli `ambito = 'TUTTO'` l'ambito e' una costante, e
#   `ex_soggetti_titoli_iva_no_overlap` (20260829-24) chiude il caso con un
#   EXCLUDE vero. Per i RISTRETTI l'ambito vive in una TABELLA FIGLIA, e un
#   EXCLUDE non la puo' leggere. Quella meta' sta qui.
#
#   ⚠️ Divisione DICHIARATA, non subita (decisione di Tid, 2026-08-29): dove il
#   vincolo e' esprimibile e' un vincolo, dove non lo e' e' un guard che lo dice.
#   Scriverli entrambi come guard avrebbe indebolito il caso forte; pretendere un
#   EXCLUDE anche sul caso debole avrebbe voluto dire denormalizzare quattro
#   colonne sulla figlia e tenerle in sync — piu' superficie di quella che toglie.
#
# ── ⭐ COSA E' DAVVERO UN'AMBIGUITA', E COSA INVECE D13 RISOLVE ─────────
#
#   Non tutte le coppie di titoli che coprono la stessa riga sono un errore:
#
#     | due titoli, stesso (sogg, emitt, tipo), periodi che si toccano | esito |
#     | ------------------------------------------------------------- | ----- |
#     | TUTTO + TUTTO                            | ⛔ EXCLUDE (20260829-24)   |
#     | TUTTO + RISTRETTO su un articolo         | ✅ D13: vince il ristretto |
#     | RISTRETTO su articolo + RISTRETTO su gruppo | ✅ D13: vince l'articolo |
#     | RISTRETTO e RISTRETTO **sullo stesso oggetto** | ⛔ QUESTO GUARD     |
#
#   ⭐ Solo l'ultima riga e' un pareggio: due titoli indistinguibili per
#   specificita'. D13 e' esplicita — «a parita' di specificita' restano due
#   titoli indistinguibili: quello e' un errore di configurazione e si solleva,
#   non si risolve scegliendone uno». Un'ambiguita' che si risolve sull'ordine
#   degli id e' precisamente cio' che AGENTS.md chiama «un'ambiguita' del
#   modello, non una scelta».
#
# ── 🔴 IL LATO CHE SI DIMENTICA: la collisione non nasce solo dalla FIGLIA ──
#
#   Un guard scritto solo sulla tabella degli ambiti sarebbe cieco meta' del
#   tempo. Due titoli che non si sovrapponevano diventano sovrapposti anche
#   quando **il PADRE cambia**: si allarga `valido_al`, si riattiva un titolo
#   spento, si cambia il tipo. In nessuno di quei casi la figlia viene toccata.
#
#   ⭐ Per questo la regola sta in UNA funzione pura,
#   `anagrafiche.fn_check_titolo_iva_ambito`, e i DUE trigger la **chiamano**
#   invece di riscriverla. E' la lezione del §12.5.2 delle linee guida: un test
#   che confrontasse i due predicati proverebbe che OGGI coincidono; cosi' si
#   prova che non possono divergere, perche' sono scritti in un posto solo.
#
# ── ⚠️ `SECURITY INVOKER` anche qui, e per la stessa ragione di -28 ────
#
#   Il confronto e' fra titoli dello stesso soggetto VERSO LO STESSO EMITTENTE:
#   la policy RLS e' la stessa per entrambi, quindi chi vede uno vede l'altro.
#   Non esiste il caso «il titolo che collide e' di un perimetro che non vedo»,
#   che e' cio' che rende cieco un guard sotto RLS.
#
# Codici sollevati: E_TITOLO_IVA_AMBITO_NON_AMMESSO (righe di ambito su un
#   titolo che vale per tutto), E_TITOLO_IVA_AMBITO_SOVRAPPOSTO.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260829-29-create-guard-ambito-titoli-iva-sovrapposizione-mctit.yaml

  - changeSet:
      id: 20260829-29-create-guard-ambito-titoli-iva-sovrapposizione
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L'anti-sovrapposizione dei titoli RISTRETTI, cioe' la meta' che l'EXCLUDE di
        20260829-24 non puo' tenere perche' la chiave attraversa la tabella figlia.
        Una funzione pura (fn_check_titolo_iva_ambito) e due trigger che la CHIAMANO:
        uno sulle righe di ambito, uno sul padre - perche' due titoli diventano
        sovrapposti anche allargando una data o riattivando un titolo spento, e in
        quei casi la figlia non viene toccata. Solo il pareggio esatto (stesso livello,
        stesso oggetto) e' un'ambiguita': le altre coppie le risolve D13 per specificita'.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_ambiti
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ══════════════════════════════════════════════════════════════
              -- 1. LA REGOLA, IN UN POSTO SOLO
              -- ══════════════════════════════════════════════════════════════
              CREATE OR REPLACE FUNCTION anagrafiche.fn_check_titolo_iva_ambito(
                  p_titolo_iva_id anagrafiche.soggetti_titoli_iva.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: elencare i motivi per cui l'AMBITO di un titolo IVA non
              --   sta in piedi. Funzione PURA (fn_check_*): non solleva e non
              --   scrive. La chiamano i due trigger guard — quello sulle righe
              --   di ambito e quello sul padre — cosi' la regola non e' scritta
              --   in due posti che possono divergere (linee-guida-sql §12.5.2).
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I7 / D10 / D13.
              -- Ritorna: [] se l'ambito e' coerente; altrimenti array ORDINATO
              --   di {codice, reason, dettaglio, valori}.
              DECLARE
                  v_motivi     jsonb := '[]'::jsonb;
                  v_titolo     record;
                  v_n_ambiti   bigint;
                  v_conflitto  record;
              BEGIN
                  IF p_titolo_iva_id IS NULL OR p_titolo_iva_id <= 0 THEN
                      RETURN v_motivi;   -- una fn_check_* non arbitra l'esistenza
                  END IF;

                  SELECT t.id, t.soggetto_id, t.emittente_fiscale_id, t.tipo_titolo_iva_id,
                         t.ambito, t.attivo, t.validita, tt.descrizione AS tipo_descrizione
                    INTO v_titolo
                    FROM anagrafiche.soggetti_titoli_iva t
                    JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id
                   WHERE t.id = p_titolo_iva_id;

                  -- ⚠️ SELECT INTO senza righe azzera il record: senza questa
                  --   uscita i rami sotto girerebbero su NULL e non
                  --   scatterebbero mai — verde per sottrazione.
                  IF v_titolo.id IS NULL THEN
                      RETURN v_motivi;
                  END IF;

                  SELECT count(*)
                    INTO v_n_ambiti
                    FROM anagrafiche.soggetti_titoli_iva_ambiti a
                   WHERE a.titolo_iva_id = p_titolo_iva_id;

                  -- ── MOTIVO 1 — «vale per tutto» e «vale per queste voci» non
                  --    stanno insieme. Un titolo TUTTO con delle righe di ambito
                  --    e' una tabella che dice due cose opposte, e il risolutore
                  --    ne leggerebbe una sola.
                  IF v_titolo.ambito = 'TUTTO' AND v_n_ambiti > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',    'E_TITOLO_IVA_AMBITO_NON_AMMESSO',
                          'reason',    'AMBITO_SU_TITOLO_TOTALE',
                          'dettaglio', jsonb_build_object('titolo_iva_id', p_titolo_iva_id,
                                                          'righe_ambito', v_n_ambiti),
                          'valori',    jsonb_build_array(v_titolo.tipo_descrizione));
                      RETURN v_motivi;   -- gli altri motivi non hanno senso qui
                  END IF;

                  -- ── MOTIVO 2 — il PAREGGIO. Due titoli attivi dello stesso
                  --    soggetto, verso lo stesso emittente, dello stesso tipo,
                  --    con periodi che si toccano, che coprono lo STESSO oggetto
                  --    allo STESSO livello: nessuno dei due e' piu' specifico, e
                  --    D13 dice che si solleva invece di sceglierne uno.
                  --
                  -- ⚠️ Livelli DIVERSI non sono un pareggio e non vanno bloccati:
                  --    articolo > categoria di merce > tutto e' la regola di D13,
                  --    ed e' la stessa della cascata degli indirizzi. Bloccarli
                  --    qui vorrebbe dire rifiutare una configurazione legittima.
                  --
                  -- ⚠️ ORDER BY prima del LIMIT: senza, quale conflitto esca
                  --    dipende dal piano del planner e il messaggio nominerebbe
                  --    un titolo diverso a ogni corsa.
                  IF v_titolo.ambito = 'RISTRETTO' AND v_titolo.attivo IS TRUE THEN
                      SELECT altro.id AS titolo_conflitto_id,
                             a.livello,
                             COALESCE(art.descrizione, gru.descrizione, tip.descrizione) AS oggetto
                        INTO v_conflitto
                        FROM anagrafiche.soggetti_titoli_iva_ambiti a
                        JOIN anagrafiche.soggetti_titoli_iva_ambiti a2
                             ON  a2.livello        = a.livello
                             AND a2.articolo_id    IS NOT DISTINCT FROM a.articolo_id
                             AND a2.gruppo_voce_id IS NOT DISTINCT FROM a.gruppo_voce_id
                             AND a2.tipo_voce_id   IS NOT DISTINCT FROM a.tipo_voce_id
                        JOIN anagrafiche.soggetti_titoli_iva altro
                             ON  altro.id                   = a2.titolo_iva_id
                             AND altro.id                  <> v_titolo.id
                             AND altro.soggetto_id          = v_titolo.soggetto_id
                             AND altro.emittente_fiscale_id = v_titolo.emittente_fiscale_id
                             AND altro.tipo_titolo_iva_id   = v_titolo.tipo_titolo_iva_id
                             AND altro.ambito               = 'RISTRETTO'
                             AND altro.attivo               IS TRUE
                             AND altro.validita            && v_titolo.validita
                        LEFT JOIN catalogo.articoli        art ON art.id = a.articolo_id
                        LEFT JOIN vendite.articoli_gruppi  gru ON gru.id = a.gruppo_voce_id
                        LEFT JOIN vendite.articoli_tipologie tip ON tip.id = a.tipo_voce_id
                       WHERE a.titolo_iva_id = v_titolo.id
                       ORDER BY altro.id, a.id
                       LIMIT 1;

                      IF v_conflitto.titolo_conflitto_id IS NOT NULL THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',    'E_TITOLO_IVA_AMBITO_SOVRAPPOSTO',
                              'reason',    'DUE_TITOLI_STESSA_SPECIFICITA',
                              'dettaglio', jsonb_build_object(
                                               'titolo_iva_id',       v_titolo.id,
                                               'titolo_conflitto_id', v_conflitto.titolo_conflitto_id,
                                               'livello',             v_conflitto.livello),
                              -- ⚠️ Nel VARIADIC va cio' che una persona
                              --   riconosce: il tipo di titolo e il NOME della
                              --   merce. Mai un id, mai un nome di colonna.
                              'valori',    jsonb_build_array(v_titolo.tipo_descrizione,
                                                             COALESCE(v_conflitto.oggetto, '')));
                      END IF;
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_check_titolo_iva_ambito(bigint)
              IS 'Single source dei motivi per cui l''AMBITO di un titolo IVA non sta in piedi. Ritorna [] se coerente, altrimenti array ORDINATO di {codice, reason, dettaglio, valori}. PURA: non solleva e non scrive. La chiamano DUE trigger — quello sulle righe di ambito e quello sul padre — e li chiamano invece di riscrivere il predicato: un test che confrontasse due predicati proverebbe che OGGI coincidono, cosi'' invece non possono divergere (linee-guida-sql §12.5.2). ⭐ Il secondo trigger non e'' ridondanza: due titoli diventano sovrapposti anche quando cambia il PADRE — si allarga valido_al, si riattiva un titolo spento, si cambia il tipo — e in nessuno di quei casi la figlia viene toccata. Due motivi: (1) E_TITOLO_IVA_AMBITO_NON_AMMESSO, righe di ambito su un titolo che vale per TUTTO — una tabella che dice due cose opposte, di cui il risolutore ne leggerebbe una sola; (2) E_TITOLO_IVA_AMBITO_SOVRAPPOSTO, il PAREGGIO: due titoli attivi dello stesso soggetto verso lo stesso emittente, dello stesso tipo, con periodi che si toccano, sullo STESSO oggetto allo STESSO livello. ⚠️ Livelli diversi NON sono un pareggio e non si bloccano: D13 li risolve per specificita'' — articolo > categoria di merce > tutto, la stessa cascata degli indirizzi — e bloccarli rifiuterebbe una configurazione legittima. A parita'' di specificita'' invece non c''e'' niente da scegliere: e'' un errore di configurazione, e un''ambiguita'' che si risolve sull''ordine degli id e'' quello che AGENTS.md chiama un''ambiguita'' del modello. ⚠️ SECURITY INVOKER: il confronto e'' fra titoli verso lo STESSO emittente, quindi la policy RLS e'' la stessa per entrambi e non esiste il conflitto invisibile che renderebbe cieco il guard. I7 di brief-db-be-iva-risolutore-e-regime-cliente.';

              -- ══════════════════════════════════════════════════════════════
              -- 2. IL GUARD SULLE RIGHE DI AMBITO
              -- ══════════════════════════════════════════════════════════════
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: rifiutare una riga di ambito che rende incoerente il
              --   titolo. Non riscrive il predicato: CHIAMA
              --   anagrafiche.fn_check_titolo_iva_ambito e solleva il PRIMO
              --   motivo. ⚠️ L'ordine dell'array e' il contratto: se cambiasse,
              --   il codice sollevato e il motivo mostrato direbbero cose diverse.
              DECLARE
                  v_motivi jsonb;
                  v_primo  jsonb;
              BEGIN
                  v_motivi := anagrafiche.fn_check_titolo_iva_ambito(NEW.titolo_iva_id);

                  IF jsonb_array_length(v_motivi) = 0 THEN
                      RETURN NEW;
                  END IF;

                  v_primo := v_motivi -> 0;

                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', 'trgfn_soggetti_titoli_iva_ambiti_guard',
                      v_primo ->> 'codice',
                      jsonb_build_object('campo', 'ambito')
                          || COALESCE(v_primo -> 'dettaglio', '{}'::jsonb),
                      NEW.tx_id,
                      VARIADIC ARRAY(SELECT jsonb_array_elements_text(
                                         COALESCE(v_primo -> 'valori', '[]'::jsonb))));

                  RETURN NEW;   -- irraggiungibile: la riga sopra solleva sempre
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard()
              IS 'Guard sulle righe di anagrafiche.soggetti_titoli_iva_ambiti. ⭐ Non contiene il predicato: CHIAMA anagrafiche.fn_check_titolo_iva_ambito e solleva il codice del PRIMO motivo. Il presidio da scrivere non e'' «gli esiti coincidono» ma «il guard non contiene piu'' il predicato» (linee-guida-sql §12.5.2). ⚠️ L''ordine dell''array e'' il contratto: se divergesse, il codice sollevato e il motivo mostrato direbbero cose diverse. ⚠️ AFTER e non BEFORE: la riga nuova deve essere gia'' visibile perche'' la fn_check la conti — un BEFORE valuterebbe il titolo senza di essa e lascerebbe passare proprio la riga che crea il conflitto. I7 di brief-db-be-iva-risolutore-e-regime-cliente.';

              DROP TRIGGER IF EXISTS trg_soggetti_titoli_iva_ambiti_z90_guard_ins_upd
                  ON anagrafiche.soggetti_titoli_iva_ambiti;
              -- ⚠️ AFTER, e la fase e' `_z90_` apposta: la fn_check CONTA le
              --   righe di ambito e confronta gli oggetti coperti, quindi la
              --   riga nuova deve essere gia' scritta. Un BEFORE valuterebbe il
              --   titolo com'era prima e lascerebbe passare proprio la riga che
              --   crea il conflitto.
              CREATE TRIGGER trg_soggetti_titoli_iva_ambiti_z90_guard_ins_upd
                  AFTER INSERT OR UPDATE
                  ON anagrafiche.soggetti_titoli_iva_ambiti
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard();

              -- ══════════════════════════════════════════════════════════════
              -- 3. LO STESSO GUARD SUL PADRE — il lato che si dimentica
              -- ══════════════════════════════════════════════════════════════
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_guard_ambito()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: la stessa regola dell'ambito, applicata quando a cambiare
              --   e' il TITOLO e non le sue righe. Due titoli diventano
              --   sovrapposti anche allargando `valido_al`, riattivando un
              --   titolo spento o cambiandone il tipo: in nessuno di quei casi
              --   la tabella figlia viene toccata, quindi il guard sulle figlie
              --   non scatta. Chiama la stessa fn_check.
              DECLARE
                  v_motivi jsonb;
                  v_primo  jsonb;
              BEGIN
                  v_motivi := anagrafiche.fn_check_titolo_iva_ambito(NEW.id);

                  IF jsonb_array_length(v_motivi) = 0 THEN
                      RETURN NULL;
                  END IF;

                  v_primo := v_motivi -> 0;

                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', 'trgfn_soggetti_titoli_iva_guard_ambito',
                      v_primo ->> 'codice',
                      jsonb_build_object('campo', 'valido_al')
                          || COALESCE(v_primo -> 'dettaglio', '{}'::jsonb),
                      NEW.tx_id,
                      VARIADIC ARRAY(SELECT jsonb_array_elements_text(
                                         COALESCE(v_primo -> 'valori', '[]'::jsonb))));

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_guard_ambito()
              IS 'La stessa regola dell''ambito, applicata quando a cambiare e'' il TITOLO invece delle sue righe. ⭐ Non e'' un doppione del guard sulle figlie: due titoli diventano sovrapposti anche allargando valido_al, riattivando un titolo spento o cambiandone il tipo — e in nessuno di quei casi la tabella figlia viene toccata, quindi quel guard non scatta. Chiama la stessa anagrafiche.fn_check_titolo_iva_ambito: la regola e'' scritta in un posto solo. ⚠️ AFTER UPDATE, perche'' la fn_check legge la riga com''e'' DOPO la modifica. I7 di brief-db-be-iva-risolutore-e-regime-cliente.';

              DROP TRIGGER IF EXISTS trg_soggetti_titoli_iva_z90_guard_ambito_upd
                  ON anagrafiche.soggetti_titoli_iva;
              CREATE TRIGGER trg_soggetti_titoli_iva_z90_guard_ambito_upd
                  AFTER UPDATE OF valido_dal, valido_al, attivo, ambito,
                                  tipo_titolo_iva_id, soggetto_id, emittente_fiscale_id
                  ON anagrafiche.soggetti_titoli_iva
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_titoli_iva_guard_ambito();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_titoli_iva_z90_guard_ambito_upd
                  ON anagrafiche.soggetti_titoli_iva;
              DROP TRIGGER IF EXISTS trg_soggetti_titoli_iva_ambiti_z90_guard_ins_upd
                  ON anagrafiche.soggetti_titoli_iva_ambiti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_titoli_iva_guard_ambito();
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_titoli_iva_ambiti_guard();
              DROP FUNCTION IF EXISTS anagrafiche.fn_check_titolo_iva_ambito(bigint);
