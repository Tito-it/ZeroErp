# anagrafiche.trgfn_indirizzi_sync_geoloc: si ritira, coi suoi montaggi.
#   D-T7a-3 di Tid (2026-11-24), brief-db-revisione-anagrafiche §21 (S50).
#
# -- PERCHE' --------------------------------------------------------------------------
#   Su anagrafiche.indirizzi e indirizzi_soggetti, quando c'e' il dettaglio,
#   trgfn_indirizzi_base_normalize svuota la posizione e subito dopo questa
#   funzione ci ricopiava civic_geoloc del civico. La copia non seguiva il
#   civico (un civic_geoloc cambiato dopo lasciava la riga con quello
#   vecchio): una seconda sede della posizione, che il lettore usa solo come
#   ultimo ripiego (vw_indirizzi_resolved_base: COALESCE(vidd.civic_geoloc,
#   vidd.street_geoloc, b.geoloc)). Col dettaglio la posizione la dice il
#   civico, come comune e CAP; la riga tiene la sua solo nella forma libera.
#   Nessuna decisione la voleva (work-done/2026/refactor-indirizzi-conti-utility:
#   «verifica sola»). Le righe di oggi le porta a NULL 80_data -94.
#
# -- LA FORMA (linee-guida-trigger) -------------------------------------------------
#   Si toglie per funzione, non per nome: un blocco DO toglie ogni montaggio
#   della funzione sulle due tabelle, qualunque nome abbia avuto (sulla riga del
#   ruolo nacque trg_indirizzi_ins_upd_sync_geoloc e fu rinominato da
#   20251119-01). Poi la funzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261123-93-drop-trgfn-indirizzi-sync-geoloc-mctit.yaml

  - changeSet:
      id: 20261123-93-drop-trgfn-indirizzi-sync-geoloc
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Ritiro di anagrafiche.trgfn_indirizzi_sync_geoloc e dei suoi montaggi su indirizzi e
        indirizzi_soggetti: col dettaglio la posizione la dice il civico. D-T7a-3,
        brief-db-revisione-anagrafiche §21.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $via$
              DECLARE
                  r record;
              BEGIN
                  FOR r IN
                      SELECT t.tgname, t.tgrelid::regclass AS tabella
                        FROM pg_catalog.pg_trigger t
                        JOIN pg_catalog.pg_proc p ON p.oid = t.tgfoid
                        JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                       WHERE NOT t.tgisinternal
                         AND n.nspname = 'anagrafiche'
                         AND p.proname = 'trgfn_indirizzi_sync_geoloc'
                  LOOP
                      EXECUTE format('DROP TRIGGER %I ON %s', r.tgname, r.tabella);
                  END LOOP;
              END
              $via$;

              DROP FUNCTION IF EXISTS anagrafiche.trgfn_indirizzi_sync_geoloc();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: la copia della posizione era il difetto.
              SELECT 1;
