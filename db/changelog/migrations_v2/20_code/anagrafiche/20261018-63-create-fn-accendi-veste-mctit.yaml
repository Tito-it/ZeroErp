# BB: ACCENDERE UNA VESTE
#   anagrafiche.fn_accendi_veste(identita, credenziale, vesti): accende la
#   veste di una credenziale (identita_digitali.attivo = true). Ritorna se la
#   veste c'e' (accesa adesso o gia' accesa).
#   Brief: brief-db-processi-accensione-per-ambiente, §5-ter.2 (2b-3).
#
# -- CHI ERA LA COPIA ---------------------------------------------------
#   Lo stesso UPDATE era scritto in due punti, e il verbo dei dati di
#   sviluppo sarebbe stato il terzo (le vesti nascono accese, §7.1 del brief
#   BE):
#     * il backend, AuthRepository.attiva_identita (il consumo dell'invito, lo
#       shop): passa al BB nella 2b-2;
#     * il builder dbops.fn_pgtap_crea_operatore_umano («l'invito accettato»):
#       passa al BB in 20261018-64.
#
# -- LE SCELTE ----------------------------------------------------------
#   * la credenziale e' un argomento, come nel backend: la veste si accende
#     solo se e' di quella credenziale (chi consuma un invito non accende la
#     veste di un altro). Le vesti ammesse sono un filtro facoltativo
#     (NULL = qualunque), come i ruoli_applicativi del backend;
#   * una veste gia' accesa non si riscrive: true, senza UPDATE;
#   * coerenza, natura della credenziale, unicita' della veste attiva e
#     sincronizzazione di auth_user.is_active: i trigger della tabella.
#
# -- CHE COSA RESTA FUORI, apposta ---------------------------------------
#   * il token dell'invito e il permesso: backend. INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261018-63-create-fn-accendi-veste-mctit.yaml

  - changeSet:
      id: 20261018-63-create-fn-accendi-veste
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea anagrafiche.fn_accendi_veste: accende la veste di una credenziale, filtrata per vesti
        ammesse. Prende il posto dell'UPDATE del backend e del builder dell'operatore, ed e' la sede
        del verbo di sviluppo. Brief: brief-db-processi-accensione-per-ambiente (2b-3).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_accendi_veste(
                  p_identita_id  anagrafiche.identita_digitali.id%TYPE,
                  p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE,
                  p_vesti        config.ruolo_applicativo[] DEFAULT NULL)
               RETURNS boolean
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_attivo anagrafiche.identita_digitali.attivo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Accendere la veste p_identita_id della credenziale
                  --   p_auth_user_id, se e' fra p_vesti (NULL = qualunque).
                  --   Ritorna true se la veste c'e' (accesa ora o gia'),
                  --   false se non c'e' (o non e' di quella credenziale, o
                  --   non e' fra le vesti ammesse).
                  --
                  -- Regole:
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - gia' accesa: nessuna scrittura.
                  -- =========================================================
                  IF p_identita_id IS NULL OR p_auth_user_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', 'anagrafiche.fn_accendi_veste', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('identita_id',  p_identita_id,
                                             'auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'anagrafiche.fn_accendi_veste',
                          'veste o credenziale mancanti');
                  END IF;

                  SELECT idg.attivo
                    INTO v_attivo
                    FROM anagrafiche.identita_digitali idg
                   WHERE idg.id = p_identita_id
                     AND idg.auth_user_id = p_auth_user_id
                     AND (p_vesti IS NULL OR idg.ruolo_applicativo = ANY (p_vesti));

                  IF NOT FOUND THEN
                      RETURN false;
                  END IF;

                  IF NOT v_attivo THEN
                      UPDATE anagrafiche.identita_digitali idg
                         SET attivo = true
                       WHERE idg.id = p_identita_id;
                  END IF;

                  RETURN true;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_accendi_veste(
                  anagrafiche.identita_digitali.id%TYPE,
                  anagrafiche.identita_digitali.auth_user_id%TYPE,
                  config.ruolo_applicativo[]) IS
                  'BB (2026-10-18): accende la veste p_identita_id (anagrafiche.identita_digitali.attivo = true) della credenziale p_auth_user_id, se e'' fra le vesti p_vesti (NULL = qualunque). Ritorna true se la veste c''e'' (accesa adesso o gia'' accesa: in quel caso nessuna scrittura), false se non c''e'', non e'' di quella credenziale o non e'' fra le vesti ammesse. Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Coerenza, natura della credenziale, unicita'' della veste attiva e sincronizzazione di auth_user.is_active: i trigger della tabella. Non controlla il token dell''invito ne'' il permesso (backend). INVOKER. Regola del 2: sede unica dell''UPDATE che era in AuthRepository.attiva_identita (2b-2) e in dbops.fn_pgtap_crea_operatore_umano; la usa il verbo dei dati di sviluppo (le vesti nascono accese). Brief: brief-db-processi-accensione-per-ambiente (2b-3).';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS anagrafiche.fn_accendi_veste(bigint, integer, config.ruolo_applicativo[]);
