databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251205-01-refactor-fn-trgfn-check-to-guard-ruoli-mctit.yaml

    - changeSet:
          id: 20251205-01-refactor-fn-trgfn-check-to-guard-ruoli
          author: mctit
          comment: "Rinomina fn_check_soggetto_ruolo e trigger function *_check_ruolo_* in *_guard_ruolo_*"
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: true
                    sql: |
                        DO $$
                        BEGIN
                         ----------------------------------------------------------------
                         -- 1) script.fn_check_soggetto_ruolo(...) -> fn_guard_soggetto_ruolo
                         ----------------------------------------------------------------
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'script'
                               AND p.proname = 'fn_check_soggetto_ruolo'
                               AND pg_get_function_identity_arguments(p.oid) =
                                   'uuid, bigint, character varying'
                         ) THEN
                             ALTER FUNCTION script.fn_check_soggetto_ruolo(uuid, bigint, character varying)
                                 RENAME TO fn_guard_soggetto_ruolo;
                         END IF;

                         ----------------------------------------------------------------
                         -- 2) Trigger function in anagrafiche: check -> guard
                         ----------------------------------------------------------------

                         -- trgfn_bank_check_ruolo_bank_branches() -> trgfn_bank_guard_ruolo_bank_branches()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_bank_check_ruolo_bank_branches'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_bank_check_ruolo_bank_branches()
                                 RENAME TO trgfn_bank_guard_ruolo_bank_branches;
                         END IF;

                         -- trgfn_clienti_check_ruolo_cliente() -> trgfn_clienti_guard_ruolo_cliente()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_clienti_check_ruolo_cliente'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_clienti_check_ruolo_cliente()
                                 RENAME TO trgfn_clienti_guard_ruolo_cliente;
                         END IF;

                         -- trgfn_gestori_check_ruolo_gestore() -> trgfn_gestori_guard_ruolo_gestore()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_gestori_check_ruolo_gestore'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_gestori_check_ruolo_gestore()
                                 RENAME TO trgfn_gestori_guard_ruolo_gestore;
                         END IF;

                         -- trgfn_emittenti_fiscali_check_ruolo_emi_fis() -> trgfn_emittenti_fiscali_guard_ruolo_emi_fis()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_emittenti_fiscali_check_ruolo_emi_fis'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_emittenti_fiscali_check_ruolo_emi_fis()
                                 RENAME TO trgfn_emittenti_fiscali_guard_ruolo_emi_fis;
                         END IF;

                         -- trgfn_fornitori_check_ruolo_fornitore() -> trgfn_fornitori_guard_ruolo_fornitore()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_fornitori_check_ruolo_fornitore'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_fornitori_check_ruolo_fornitore()
                                 RENAME TO trgfn_fornitori_guard_ruolo_fornitore;
                         END IF;

                         -- trgfn_resellers_check_ruolo_reseller() -> trgfn_resellers_guard_ruolo_reseller()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_resellers_check_ruolo_reseller'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_resellers_check_ruolo_reseller()
                                 RENAME TO trgfn_resellers_guard_ruolo_reseller;
                         END IF;

                         -- trgfn_vettori_check_ruolo_vettore() -> trgfn_vettori_guard_ruolo_vettore()
                         IF EXISTS (
                             SELECT 1
                             FROM pg_proc p
                             JOIN pg_namespace n ON n.oid = p.pronamespace
                             WHERE n.nspname = 'anagrafiche'
                               AND p.proname = 'trgfn_vettori_check_ruolo_vettore'
                               AND pg_get_function_identity_arguments(p.oid) = ''
                         ) THEN
                             ALTER FUNCTION anagrafiche.trgfn_vettori_check_ruolo_vettore()
                                 RENAME TO trgfn_vettori_guard_ruolo_vettore;
                         END IF;

                        END;
                        $$;

    - changeSet:
          id: 20251205-01-01-refactor-fn-check-to-guard-ruoli
          author: mctit
          # runAlways: true
          validCheckSum:
              - ANY
          comment: "Rinomina fn_check_soggetto_ruolo  *_check_ruolo_* in *_guard_ruolo_*"
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        DO $do$
                        BEGIN
                            IF to_regprocedure('script.fn_check_soggetto_ruolo(uuid, bigint, character varying)') IS NOT NULL THEN
                                ALTER FUNCTION script.fn_check_soggetto_ruolo(uuid, bigint, character varying)
                                    RENAME TO fn_guard_soggetto_ruolo;
                            END IF;
                        END;
                        $do$;
