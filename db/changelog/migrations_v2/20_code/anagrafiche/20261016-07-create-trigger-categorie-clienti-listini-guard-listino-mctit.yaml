# MONTAGGIO: anagrafiche.trgfn_categorie_clienti_listini_guard_listino
#   (20261016-06) su anagrafiche.categorie_clienti_listini.
#   Brief: brief-db-coerenza-listino-della-riga-di-commessa (§7.4, opzione B)
#
#   Stessa forma del gemello dei documenti (trg_contratti_a10_guard_listino_
#   documento_ins / _upd): BEFORE INSERT senza WHEN; BEFORE UPDATE con la WHEN
#   sulle tre colonne, cosi' le righe gia' scritte restano come sono finche'
#   non si tocca la loro chiave. Nessun altro trigger BEFORE della tabella
#   scrive quelle colonne (linee-guida-trigger, «UPDATE OF» e WHEN).
#   ORDINE: _a10_guard_listino_ precede _a10_guard_utility_tipo_ruolo_: su
#   una riga con utility fuori dal ruolo E listino sbagliato parla il listino.
#   Trigger scritti a mano, non da ci_apply. ⛔ Nomi sotto i 63 caratteri
#   (51 e 51).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261016-07-create-trigger-categorie-clienti-listini-guard-listino-mctit.yaml

  - changeSet:
      id: 20261016-07-create-trigger-categorie-clienti-listini-guard-listino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta anagrafiche.trgfn_categorie_clienti_listini_guard_listino su
        anagrafiche.categorie_clienti_listini (BEFORE INSERT; BEFORE UPDATE quando cambiano
        listino, utility o emittente). Brief: brief-db-coerenza-listino-della-riga-di-commessa (§7.4).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_trigger t
               WHERE t.tgrelid = 'anagrafiche.categorie_clienti_listini'::regclass
                 AND t.tgname IN ('trg_categorie_clienti_listini_a10_guard_listino_ins',
                                  'trg_categorie_clienti_listini_a10_guard_listino_upd')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_categorie_clienti_listini_a10_guard_listino_ins
                  BEFORE INSERT
                  ON anagrafiche.categorie_clienti_listini
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_categorie_clienti_listini_guard_listino();

              CREATE TRIGGER trg_categorie_clienti_listini_a10_guard_listino_upd
                  BEFORE UPDATE
                  ON anagrafiche.categorie_clienti_listini
                  FOR EACH ROW
                  WHEN (OLD.listino_id IS DISTINCT FROM NEW.listino_id
                        OR OLD.utility_id IS DISTINCT FROM NEW.utility_id
                        OR OLD.emittente_soggetto_ruolo_id IS DISTINCT FROM NEW.emittente_soggetto_ruolo_id)
                  EXECUTE FUNCTION anagrafiche.trgfn_categorie_clienti_listini_guard_listino();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_categorie_clienti_listini_a10_guard_listino_ins
                  ON anagrafiche.categorie_clienti_listini;
              DROP TRIGGER IF EXISTS trg_categorie_clienti_listini_a10_guard_listino_upd
                  ON anagrafiche.categorie_clienti_listini;
