databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260418-21-update-trgfn-rua-guard-persona-fisica-mctit.yaml

  - changeSet:
      id: 20260418-21-update-trgfn-rua-guard-persona-fisica
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Refactor del trigger guard "persona fisica pura" su
        risorse_umane_auth_user: la logica precedentemente inline (verifica
        CF presente + P.IVA assente sul soggetto collegato) viene delegata
        alla nuova funzione riusabile script.fn_guard_soggetto_pf_pura
        (§4.2 WIP multi-face-auth). Stesso comportamento esterno (stessi
        codici errore E_AUTH_USER_SOGGETTO_CON_PIVA / _SENZA_CF), stesso
        trigger installato, nessun cambio di firma. Utile per evitare
        duplicazione con il nuovo guard di coerenza di identita_digitali.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_guard_soggetto_pf_pura';
          - tableExists:
              schemaName: anagrafiche
              tableName: risorse_umane_auth_user
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger function rifattorizzata: recupera il soggetto collegato
              -- alla risorsa_umana indicata dal NEW e delega la verifica alla
              -- funzione riusabile script.fn_guard_soggetto_pf_pura.
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_risorse_umane_auth_user_guard_persona_fisica()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- %TYPE per restare allineati alla colonna sorgente.
                  v_soggetto_id anagrafiche.risorse_umane.soggetto_id%TYPE;
              BEGIN
                  -- ------------------------------------------------------------
                  -- Trigger function: guard "persona fisica pura" su
                  -- risorse_umane_auth_user (BEFORE INSERT/UPDATE).
                  --
                  -- Regole (delegate a script.fn_guard_soggetto_pf_pura):
                  --   - Il soggetto collegato deve avere codice_fiscale
                  --   - Il soggetto collegato NON deve avere partita_iva
                  --
                  -- Nota: l'appartenenza del soggetto a un emittente fiscale
                  --   viene verificata al login lato Django (auth view), non qui.
                  -- ------------------------------------------------------------

                  -- 1) Risolvi il soggetto a partire dalla risorsa umana collegata
                  --    dal bridge (NEW.risorsa_umana_id e' FK verso risorse_umane).
                  SELECT ru.soggetto_id
                    INTO v_soggetto_id
                    FROM anagrafiche.risorse_umane ru
                   WHERE ru.id = NEW.risorsa_umana_id;

                  -- 2) Delega alla funzione riusabile (solleva eccezione se
                  --    il soggetto non e' PF pura; altrimenti restituisce l'id).
                  PERFORM script.fn_guard_soggetto_pf_pura(v_soggetto_id);

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_risorse_umane_auth_user_guard_persona_fisica() IS
                  'Guard su risorse_umane_auth_user: delega a '
                  'script.fn_guard_soggetto_pf_pura la verifica che il soggetto '
                  'collegato sia persona fisica pura (CF obbligatorio, P.IVA vietata). '
                  'Il trigger associato resta invariato (a10_guard_persona_fisica_ins_upd).';

              -- Il trigger trg_risorse_umane_auth_user_a10_guard_persona_fisica_ins_upd
              -- e' gia' installato: la CREATE OR REPLACE FUNCTION aggiorna il corpo
              -- senza toccare il binding. Nessun DROP/CREATE trigger qui.
      rollback:
        - sql:
            sql: |
              -- Ripristino della logica inline precedente (snapshot 2026-03-10):
              -- in caso di rollback si perdono i benefici della funzione riusabile
              -- ma si preserva il comportamento esterno originale.
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_risorse_umane_auth_user_guard_persona_fisica()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_soggetto_id    anagrafiche.risorse_umane.soggetto_id%TYPE;
                  v_partita_iva    anagrafiche.soggetti.partita_iva%TYPE;
                  v_codice_fiscale anagrafiche.soggetti.codice_fiscale%TYPE;
              BEGIN
                  SELECT ru.soggetto_id INTO v_soggetto_id
                    FROM anagrafiche.risorse_umane ru WHERE ru.id = NEW.risorsa_umana_id;
                  SELECT s.partita_iva, s.codice_fiscale INTO v_partita_iva, v_codice_fiscale
                    FROM anagrafiche.soggetti s WHERE s.id = v_soggetto_id;
                  IF v_partita_iva IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_AUTH_USER_SOGGETTO_CON_PIVA',
                          jsonb_build_object('table', TG_TABLE_NAME, 'risorsa_umana_id', NEW.risorsa_umana_id, 'soggetto_id', v_soggetto_id),
                          NULL::uuid, NEW.risorsa_umana_id::text);
                  END IF;
                  IF v_codice_fiscale IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_AUTH_USER_SOGGETTO_SENZA_CF',
                          jsonb_build_object('table', TG_TABLE_NAME, 'risorsa_umana_id', NEW.risorsa_umana_id, 'soggetto_id', v_soggetto_id),
                          NULL::uuid, NEW.risorsa_umana_id::text);
                  END IF;
                  RETURN NEW;
              END;
              $function$;
