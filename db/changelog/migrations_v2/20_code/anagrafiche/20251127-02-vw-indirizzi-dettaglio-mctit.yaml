databaseChangeLog:
        - logicalFilePath: migrations_v2/20_code/anagrafiche/20251127-02-vw-indirizzi-dettaglio-mctit.yaml

        - changeSet:
                  id: 20251127-02-vw-indirizzi-dettaglio
                  author: mctit

                  # ------------------------------------------------------------
                  # Scopo
                  # ------------------------------------------------------------
                  # Crea una vista di comodo per la ricerca e la consultazione
                  # degli indirizzi di dettaglio normalizzati.
                  #
                  # anagrafiche.vw_indirizzi_dettaglio:
                  #   - Espone i campi chiave di anagrafiche.indirizzi_dettaglio
                  #   - Include il comune (via config.stradario)
                  #   - È pensata come base per funzioni di ricerca e UI
                  #
                  # Nota:
                  #   La logica applicativa (ricerca parametrica, LIKE, ecc.)
                  #   sarà implementata in una funzione separata, che userà
                  #   questa vista come sorgente.
                  # ------------------------------------------------------------

                  preConditions:
                          - onFail: MARK_RAN
                          - onError:
                                    HALT
                                    # La vista ha senso solo se esistono le tabelle di base
                          - tableExists:
                                    schemaName: anagrafiche
                                    tableName: indirizzi_dettaglio
                          - tableExists:
                                    schemaName: config
                                    tableName: stradario

                  changes:
                          - createView:
                                    schemaName: anagrafiche
                                    viewName: vw_indirizzi_dettaglio

                                    # ------------------------------------------------------
                                    # Vista di comodo per la ricerca indirizzi_dettaglio
                                    #
                                    # Campi esposti:
                                    #   - id                         : PK indirizzo_dettaglio
                                    #   - stradario_id               : FK a config.stradario
                                    #   - comune_id                  : comune dello stradario
                                    #   - indirizzo_normalizzato     : stringa composta (via, civico, palazzina, scala, piano, interno)
                                    #   - via_norm                   : via normalizzata
                                    #   - civico                     : civico numerico
                                    #   - estensione_civico          : lettera/estensione civico (es. A, B, int. scala ecc.)
                                    #   - palazzina                  : palazzina
                                    #   - scala                      : scala
                                    #   - piano                      : piano
                                    #   - interno                    : interno
                                    #   - altro                      : note aggiuntive non strutturate
                                    #   - civic_geoloc               : punto geolocalizzato del civico
                                    #   - street_geoloc              : punto geolocalizzato di via
                                    #   - attivo                     : flag attivo/disattivo
                                    #   - storicizza                 : abilita/disabilita storico
                                    #   - tx_id                      : id transazione logica
                                    #   - data_insert / user_insert  : audit inserimento
                                    #   - data_update / user_update  : audit ultima modifica
                                    #
                                    # Uso previsto:
                                    #   - Funzioni helper di ricerca (es. fn_search_indirizzi_dettaglio)
                                    #   - Interfacce utente (autocomplete indirizzo)
                                    #   - Reportistica leggera sugli indirizzi normalizzati
                                    #
                                    # Non va usata per:
                                    #   - DML diretto (INSERT/UPDATE/DELETE) → usare sempre le tabelle base
                                    # ------------------------------------------------------
                                    selectQuery: |
                                            SELECT
                                                -- --------------------------------------------------------
                                                -- Uso previsto:
                                                --   - Funzioni helper di ricerca (es. fn_search_indirizzi_dettaglio)
                                                --   - Interfacce utente (autocomplete indirizzo)
                                                --   - Reportistica leggera sugli indirizzi normalizzati
                                                --
                                                -- Non va usata per:
                                                --   - DML diretto (INSERT/UPDATE/DELETE) → usare sempre le tabelle base
                                                ------------------------------------------------------

                                                idd.id                         AS indirizzo_dettaglio_id,
                                                idd.stradario_id               AS stradario_id,
                                                s.comune_id                    AS comune_id,
                                                idd.indirizzo_normalizzato     AS indirizzo_normalizzato,
                                                idd.via_norm                   AS via_norm,
                                                idd.civico                     AS civico,
                                                idd.estensione_civico          AS estensione_civico,
                                                idd.palazzina                  AS palazzina,
                                                idd.scala                      AS scala,
                                                idd.piano                      AS piano,
                                                idd.interno                    AS interno,
                                                idd.altro                      AS altro,
                                                idd.civic_geoloc               AS civic_geoloc,
                                                idd.street_geoloc              AS street_geoloc,
                                                idd.attivo                     AS attivo,
                                                idd.storicizza                 AS storicizza,
                                                idd.tx_id                      AS tx_id,
                                                idd.data_insert                AS data_insert,
                                                idd.user_insert                AS user_insert,
                                                idd.data_update                AS data_update,
                                                idd.user_update                AS user_update
                                            FROM anagrafiche.indirizzi_dettaglio idd
                                            JOIN config.stradario s
                                                ON s.id = idd.stradario_id;

                                            COMMENT ON VIEW anagrafiche.vw_indirizzi_dettaglio
                                                    IS 'Vista di comodo per la ricerca e consultazione degli indirizzi di dettaglio normalizzati. Espone i campi chiave di anagrafiche.indirizzi_dettaglio, include il comune (via config.stradario) ed è pensata come base per funzioni di ricerca e UI.';
