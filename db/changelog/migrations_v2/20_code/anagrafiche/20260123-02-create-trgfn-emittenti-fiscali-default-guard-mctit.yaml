databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260205-05-create-trgfn-emittenti-fiscali-default-guard-mctit.yaml

  - changeSet:
      id: 20260205-05-create-trgfn-emittenti-fiscali-default-guard
      author: mctit
      runAlways: false
      validCheckSum:
        - ANY
      comment: "Impedisce assenza o duplicazione dell'emittente fiscale di default"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_emittenti_fiscali_default_guard()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_count int;
                v_emittenti int;
                v_area text := TG_TABLE_SCHEMA;
              BEGIN
                SELECT count(*)
                  INTO v_emittenti
                  FROM anagrafiche.emittenti_fiscali;

                SELECT count(*)
                  INTO v_count
                  FROM anagrafiche.emittenti_fiscali_billing_account
                 WHERE is_default = true;

                IF v_emittenti = 0 AND v_count = 0 THEN
                  RETURN NULL;
                END IF;

                IF v_count <> 1 THEN
                  PERFORM script.fn_log_and_raise_error(
                    v_area,
                    TG_NAME,
                    'E_GENERICO',
                    jsonb_build_object(
                      'detail', 'Deve esistere un solo emittente fiscale di default',
                      'found', v_count,
                      'emittenti_fiscali', v_emittenti
                    ),
                    NULL::uuid,
                    'Deve esistere un solo emittente fiscale di default'
                    
                  );
                END IF;

                RETURN NULL;
              END
              $$;

              COMMENT ON FUNCTION anagrafiche.trgfn_emittenti_fiscali_default_guard()
              IS 'Impedisce assenza o duplicazione dell''emittente fiscale di default'; 

              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_ba_a10_default_guard_ins_upd_dlt
              ON anagrafiche.emittenti_fiscali_billing_account;

              CREATE CONSTRAINT TRIGGER trg_emittenti_fiscali_ba_a10_default_guard_ins_upd_dlt
              AFTER INSERT OR UPDATE OR DELETE
              ON anagrafiche.emittenti_fiscali_billing_account
              DEFERRABLE INITIALLY DEFERRED
              FOR EACH ROW
              EXECUTE FUNCTION anagrafiche.trgfn_emittenti_fiscali_default_guard();
