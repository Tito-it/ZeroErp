# IL GUARD DEL RUOLO LEGGE «CHE COSA MANCA»
#   anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(soggetto_ruolo, tx) -> void
#   Brief: brief-db-fornitore-privato-indirizzi §12.5, giro 5.
#
# ── PERCHE' ─────────────────────────────────────────────────────
#   «Quali obbligatori mancano al ruolo» ha ora un secondo lettore, il form
#   del cambio di natura (-43, sulla natura proposta). La domanda sta in
#   anagrafiche.fn_indirizzi_obbligatori_mancanti_ruolo (-39), e il guard la
#   legge sulla natura di oggi del soggetto (regola del 2).
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────
#   La regola, il codice, la frase, il contesto, la firma. Il corpo e' quello
#   di 20261116-31 (doc auto-generata rigenerata dopo l'applicazione), con la
#   sola ricerca del mancante sostituita. Attributi: VOLATILE, INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261116-41-update-fn-guard-indirizzi-obbligatori-ruolo-dai-mancanti-mctit.yaml

  - changeSet:
      id: 20261116-41-update-fn-guard-indirizzi-obbligatori-ruolo-dai-mancanti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il guard degli obbligatori del ruolo legge i mancanti da
        anagrafiche.fn_indirizzi_obbligatori_mancanti_ruolo, sulla natura del soggetto.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(
                  p_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  p_tx_id             anagrafiche.soggetti_ruoli.tx_id%TYPE)
              RETURNS void
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              DECLARE
                  c_chi           CONSTANT text := 'anagrafiche.fn_guard_indirizzi_obbligatori_ruolo';
                  v_tipo_ruolo_id anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE;
                  v_natura_id     anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_tipo_id       config.tipi_ruolo_tipi_indirizzo.tipo_indirizzo_id%TYPE;
                  v_ripiego_id    config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id%TYPE;
                  v_ruolo_nome    config.tipi_ruoli.descrizione%TYPE;
              BEGIN
                  IF p_soggetto_ruolo_id IS NULL OR p_soggetto_ruolo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          p_tx_id,
                          c_chi,
                          'il ruolo da controllare non e'' indicato');
                  END IF;

                  SELECT sr.tipo_ruolo_id, s.tipo_soggetto_dettaglio_id
                    INTO v_tipo_ruolo_id, v_natura_id
                    FROM anagrafiche.soggetti_ruoli sr
                    JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                   WHERE sr.id = p_soggetto_ruolo_id;

                  -- Il ruolo non c'e' piu': cancellato nella stessa transazione,
                  -- insieme ai suoi indirizzi. Niente da completare.
                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  SELECT m.tipo_indirizzo_id, m.ripiego_tipo_indirizzo_id
                    INTO v_tipo_id, v_ripiego_id
                    FROM anagrafiche.fn_indirizzi_obbligatori_mancanti_ruolo(
                             p_soggetto_ruolo_id, v_natura_id, script.fn_data_operativa()) m
                   ORDER BY m.tipo_indirizzo_id
                   LIMIT 1;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  SELECT tr.descrizione INTO v_ruolo_nome
                    FROM config.tipi_ruoli tr
                   WHERE tr.id = v_tipo_ruolo_id;

                  -- Valori per descrizione, nell'ordine della frase: il ruolo,
                  -- poi il tipo richiesto col suo ripiego. Gli id nel contesto.
                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', c_chi, 'E_INDIRIZZO_OBBLIGATORIO_MANCANTE',
                      jsonb_build_object(
                          'soggetto_ruolo_id',          p_soggetto_ruolo_id,
                          'tipo_ruolo_id',              v_tipo_ruolo_id,
                          'tipo_soggetto_dettaglio_id', v_natura_id,
                          'tipo_indirizzo_id_required', v_tipo_id,
                          'fallback_tipo_indirizzo_id', v_ripiego_id),
                      p_tx_id,
                      COALESCE(v_ruolo_nome, v_tipo_ruolo_id::text),
                      COALESCE(anagrafiche.fn_nomi_tipo_indirizzo_richiesto(v_tipo_id, v_ripiego_id),
                               v_tipo_id::text));
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_guard_indirizzi_obbligatori_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE,
                  anagrafiche.soggetti_ruoli.tx_id%TYPE)
              IS 'Guard: il ruolo deve avere, fra i suoi indirizzi (anagrafiche.indirizzi, istanze comprese), ogni tipo che il requisito del ruolo chiede (anagrafiche.fn_indirizzi_obbligatori_ruolo, sul tipo di ruolo e sulla natura del soggetto, il giorno di script.fn_data_operativa()), oppure il suo ripiego: i mancanti li dice anagrafiche.fn_indirizzi_obbligatori_mancanti_ruolo, sulla natura del soggetto. Al primo mancante, per tipo richiesto, E_INDIRIZZO_OBBLIGATORIO_MANCANTE coi valori della frase nell''ordine tipo di ruolo e tipo richiesto col ripiego, per descrizione (anagrafiche.fn_nomi_tipo_indirizzo_richiesto); gli id nel contesto. Ruolo che non esiste (cancellato nella stessa transazione): tace. Id NULL o non positivo: E_SCRIPT_CHIAMATA_NON_VALIDA. Il tx_id va al log dell''errore. Sede unica del controllo del layer RUOLO: la chiamano i constraint trigger differiti di anagrafiche.soggetti_ruoli (anagrafiche.trgfn_soggetti_ruoli_guard_indirizzi_required), di anagrafiche.indirizzi (anagrafiche.trgfn_indirizzi_guard_obbligatori_ruolo) e di anagrafiche.soggetti al cambio di natura (anagrafiche.trgfn_soggetti_guard_obbligatori_ruoli). Gemello di anagrafiche.fn_guard_indirizzi_obbligatori_soggetto, il layer SOGGETTO. SECURITY INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              -- Il corpo precedente e' in 20261116-31; si torna indietro con un changeSet nuovo.
              SELECT 1;
