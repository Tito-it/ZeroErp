databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260408-01-drop-guard-emittenti-fiscali-utilities-required-mctit.yaml

  - changeSet:
      id: 20260408-01-drop-guard-emittenti-fiscali-utilities-required
      author: mctit
      comment: >
        Rimuove la guard che rendeva obbligatoria almeno una riga in
        anagrafiche.emittenti_fiscali_utilities per ogni emittente fiscale
        attivo. La matrice config.utilities_tipi_ruolo resta il solo vincolo
        di ammissibilita ruolo/utility; emittenti_fiscali_utilities torna a
        essere tabella opzionale di parametri specifici.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_def_guard_utilities_required_ins_upd
                ON anagrafiche.emittenti_fiscali;

              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_utilities_def_guard_required_ins_upd_dlt
                ON anagrafiche.emittenti_fiscali_utilities;

              DROP FUNCTION IF EXISTS anagrafiche.trgfn_emittenti_fiscali_guard_utilities_required();

              DROP FUNCTION IF EXISTS anagrafiche.fn_guard_emittente_fiscale_utilities_required(
                anagrafiche.soggetti_ruoli.id%TYPE,
                text
              );
