# ------------------------------------------------------------
# IL TRIGGER DELLA CONFERMA DEL REGIME (D-11)
#   trg_emittenti_fiscali_a20_regime_conferma_upd
#   -> anagrafiche.trgfn_emittenti_fiscali_regime_conferma()
#   Brief: brief-db-esigibilita-iva-per-cassa-emittente, sezione 8.6 (D-11)
#
#   a20 e non a10: non e' un guard, scrive un valore (come
#   trg_fatture_righe_a20_importo_ins_upd). Scatta dopo i guard a05/a10
#   della tabella, quindi su una scrittura che quelli lasciano passare.
#   UPDATE OF regime_fiscale_rf: la regola riguarda solo quel cambio
#   (linee-guida-trigger). Niente INSERT: un emittente nuovo nasce con la
#   conferma che gli da' chi lo crea, o senza.
#   preCondition HALT: la funzione c'e' e il trigger no — un CREATE TRIGGER
#   su un nome gia' presente fermerebbe il migrate con 42710.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261001-13-create-trigger-emittenti-fiscali-regime-conferma-mctit.yaml

  - changeSet:
      id: 20261001-13-create-trigger-emittenti-fiscali-regime-conferma
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Trigger trg_emittenti_fiscali_a20_regime_conferma_upd (BEFORE UPDATE OF
        regime_fiscale_rf) su anagrafiche.trgfn_emittenti_fiscali_regime_conferma. Brief:
        brief-db-esigibilita-iva-per-cassa-emittente, sezione 8.6 (D-11).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname = 'trgfn_emittenti_fiscali_regime_conferma';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                   WHERE t.tgrelid = 'anagrafiche.emittenti_fiscali'::regclass
                     AND t.tgname = 'trg_emittenti_fiscali_a20_regime_conferma_upd';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_emittenti_fiscali_a20_regime_conferma_upd
                  BEFORE UPDATE OF regime_fiscale_rf ON anagrafiche.emittenti_fiscali
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_emittenti_fiscali_regime_conferma();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_emittenti_fiscali_a20_regime_conferma_upd
                  ON anagrafiche.emittenti_fiscali;
