#
# Bonifica naming codice_interno/codice — Ondata 2 (anagrafiche/istanze).
# Brief: brief-naming-stato-codice-interno.md §4 (Ondata 2).
#
# PRIMA (vw_istanze_utilities_dettaglio):
#   sp.codice_interno AS stato_pdp_codice   (mislabel: immutabile col nome del mutabile)
#   u.codice_interno  AS utility_codice     (idem)
# DOPO (alias fedele 1:1, linee-guida-sql §6c — stesso pattern di vw_pdp, gia' corretta):
#   stato_pdp_codice = sp.codice (display)        + stato_pdp_codice_interno = sp.codice_interno (logica)
#   utility_codice   = u.codice  (display)        + utility_codice_interno   = u.codice_interno   (logica)
#
# Strategia APPEND (CREATE OR REPLACE, niente DROP/cascade): le colonne esistenti
# stato_pdp_codice / utility_codice restano (cambia solo l'espressione -> codice
# display); le nuove *_codice_interno sono appese in coda. Il consumer
# vw_istanze_dati_precontrattuali_dettaglio non si rompe (continua a leggere
# stato_pdp_codice / utility_codice). Tabelle stati_pdp/utilities hanno entrambe
# le colonne (verificato).
#
# INOLTRE (mislabel collaterale, corretto qui perche' la vista e' gia' ricreata):
#   PRIMA: sp.codice AS stato_pdp_descrizione  (esponeva il CODICE col nome descrizione)
#   DOPO:  sp.descrizione AS stato_pdp_descrizione  (ora porta la descrizione reale)
#   ⚠ CAMBIO DI COMPORTAMENTO per il consumer vw_istanze_dati_precontrattuali_dettaglio:
#     stato_pdp_descrizione ora restituisce la descrizione, non piu' il codice.
#     -> DA SEGNALARE AL BE/FE (chi mostrava stato_pdp_descrizione vedeva il codice).
# Storico 20260402-09 non toccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260628-08-update-vw-istanze-utilities-dettaglio-codice-interno-mctit.yaml

  - changeSet:
      id: 20260628-08-update-vw-istanze-utilities-dettaglio-codice-interno
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_istanze_utilities_dettaglio: alias fedele — stato_pdp_codice_interno /
        utility_codice_interno (codice_interno, logica) + stato_pdp_codice /
        utility_codice (codice, display). Append, no cascade.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: anagrafiche
            tableName: istanze_utilities
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- DROP+CREATE (non CREATE OR REPLACE): stato_pdp_codice/utility_codice
              -- cambiano TIPO (codice_interno varchar(16) -> codice varchar(64)), che
              -- CREATE OR REPLACE non ammette. Si droppa il dipendente precontrattuali
              -- e si ricreano entrambe in ordine.
              DROP VIEW IF EXISTS anagrafiche.vw_istanze_dati_precontrattuali_dettaglio;
              DROP VIEW IF EXISTS anagrafiche.vw_istanze_utilities_dettaglio;

              CREATE VIEW anagrafiche.vw_istanze_utilities_dettaglio AS
              SELECT iu.id AS istanza_id,
                  iu.codice AS istanza_codice,
                  iu.proprietario_inquilino,
                  iu.fittizia,
                  iu.soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  iu.pdp_id,
                  p.pdp AS pdp_codice,
                  p.stato_pdp_id,
                  sp.codice AS stato_pdp_codice,
                  sp.descrizione AS stato_pdp_descrizione,
                  p.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  iu.parent_istanza_id,
                  iu.indirizzo_dettaglio_id,
                  idv.indirizzo_normalizzato,
                  idv.via_norm,
                  idv.civico,
                  idv.estensione_civico,
                  idv.palazzina,
                  idv.scala,
                  idv.piano,
                  idv.interno,
                  idv.altro,
                  idv.civic_geoloc,
                  idv.street_geoloc,
                  idv.comune_id AS indirizzo_comune_id,
                  ic.comune AS comune_descrizione,
                  ic.provincia AS provincia_sigla,
                  ic.codice_postale AS cap,
                  ic.indirizzo_generale,
                  ic.tipo_toponimo,
                  ic.nome_strada,
                  iu.tx_id,
                  iu.data_insert,
                  iu.user_insert,
                  iu.data_update,
                  iu.user_update,
                  sp.codice_interno AS stato_pdp_codice_interno,
                  u.codice_interno  AS utility_codice_interno
              FROM anagrafiche.istanze_utilities iu
                  JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                  LEFT JOIN anagrafiche.pdp p ON p.id = iu.pdp_id
                  LEFT JOIN config.stati_pdp sp ON sp.id = p.stato_pdp_id
                  LEFT JOIN config.utilities u ON u.id = p.utility_id
                  LEFT JOIN anagrafiche.vw_indirizzi_dettaglio idv ON idv.indirizzo_dettaglio_id = iu.indirizzo_dettaglio_id
                  LEFT JOIN script.vw_indirizzo_completo ic ON ic.id_stradario = idv.stradario_id;

              -- Ricrea il dipendente (stessa def + passthrough dei nuovi *_codice_interno)
              CREATE VIEW anagrafiche.vw_istanze_dati_precontrattuali_dettaglio AS
              SELECT idp.id AS istanza_dati_precontrattuali_id,
                  idp.istanza_utility_id,
                  idp.utility_id AS istanza_dati_utility_id,
                  idp.classe_utenza_id,
                  cu.descrizione AS classe_utenza_descrizione,
                  cu.codice AS classe_utenza_codice,
                  tu.id AS tipo_utenza_id,
                  tu.descrizione AS tipo_utenza_descrizione,
                  tu.codice AS tipo_utenza_codice,
                  idp.param_1_num,
                  idp.param_2_txt,
                  idp.meta,
                  idp.tx_id,
                  idp.storicizza,
                  idp.data_insert,
                  idp.user_insert,
                  idp.data_update,
                  idp.user_update,
                  iud.istanza_id,
                  iud.istanza_codice,
                  iud.proprietario_inquilino,
                  iud.fittizia,
                  iud.soggetto_id,
                  iud.ragione_sociale_completa,
                  iud.id_fiscale_univoco_cf_piva,
                  iud.pdp_id,
                  iud.pdp_codice,
                  iud.stato_pdp_id,
                  iud.stato_pdp_codice,
                  iud.stato_pdp_descrizione,
                  iud.utility_id,
                  iud.utility_codice,
                  iud.utility_descrizione,
                  iud.parent_istanza_id,
                  iud.indirizzo_dettaglio_id,
                  iud.indirizzo_normalizzato,
                  iud.via_norm,
                  iud.civico,
                  iud.estensione_civico,
                  iud.palazzina,
                  iud.scala,
                  iud.piano,
                  iud.interno,
                  iud.altro,
                  iud.civic_geoloc,
                  iud.street_geoloc,
                  iud.indirizzo_comune_id,
                  iud.comune_descrizione,
                  iud.provincia_sigla,
                  iud.cap,
                  iud.indirizzo_generale,
                  iud.tipo_toponimo,
                  iud.nome_strada,
                  iud.tx_id AS istanza_tx_id,
                  iud.data_insert AS istanza_data_insert,
                  iud.user_insert AS istanza_user_insert,
                  iud.data_update AS istanza_data_update,
                  iud.user_update AS istanza_user_update,
                  iud.stato_pdp_codice_interno,
                  iud.utility_codice_interno
              FROM anagrafiche.istanze_dati_precontrattuali idp
                  JOIN anagrafiche.vw_istanze_utilities_dettaglio iud ON iud.istanza_id = idp.istanza_utility_id
                  LEFT JOIN config.classi_utenze cu ON cu.id = idp.classe_utenza_id
                  LEFT JOIN config.tipi_utenze tu ON tu.id = cu.tipo_utenza_id;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: ri-applicare lo storico 20260402-09 (stato_pdp_codice /
              -- utility_codice = codice_interno, senza le colonne *_codice_interno).
              SELECT 1;
