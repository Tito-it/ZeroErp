# IL GUARD DEL REGIME PA PER NATURA
#   anagrafiche.trgfn_soggetti_guard_regime_pa()
#   trg_soggetti_a10_guard_regime_pa_ins_upd
#     BEFORE INSERT OR UPDATE OF cliente_pa, split_payment, tipo_soggetto_dettaglio_id
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte A, A-3, A-5)
#
# -- LA REGOLA --------------------------------------------------------
#   Un flag a 'S' deve essere ammesso dalla natura di dettaglio
#   (config.tipi_soggetto_dettaglio.cliente_pa_ammesso / split_payment_ammesso,
#   20261010-85; valori dal CSV, A-2):
#     cliente_pa = 'S'    su una natura che non lo ammette -> E_CLIENTE_PA_NON_AMMESSO
#     split_payment = 'S' su una natura che non lo ammette -> E_SPLIT_PAYMENT_NON_AMMESSO
#     un flag a 'S' su un soggetto SENZA natura           -> E_DATO_FISCALE_SENZA_TIPO_SOGGETTO
#   Due flag a 'N' passano sempre: «non ammesso» vuol dire «resta N».
#
# -- LA FORMA ---------------------------------------------------------
#   * Un CHECK non basta: la natura sta in un'altra tabella.
#   * UPDATE OF cliente_pa, split_payment, tipo_soggetto_dettaglio_id: il
#     guard giudica chi TOCCA i flag o la natura. Il ramo sulla natura copre
#     il cambio di natura: una societa' in split che diventa privato porta il
#     flag a N nella STESSA scrittura; il DB non lo azzera da se' (una
#     scrittura silenziosa di un dato fiscale e' esattamente cio' che non si
#     vede). Nessun altro trigger BEFORE di soggetti scrive le tre colonne
#     (verificato sui corpi vivi: normalize, gen_codice, cf_piva_dispatch,
#     guard cf/piva e sesso le leggono soltanto).
#   * ⭐ SENZA NATURA RIFIUTA (A-5, decisione di Tid del 2026-10-10), e qui
#     diverge per scelta dai guard gemelli del sesso e di CF/P.IVA, che in
#     quel caso tacciono: un flag che cambia l'esigibilita' della fattura non
#     si accende su un soggetto di cui non si sa che cosa sia.
#   * Fase a10, nome «guard_regime_pa»: fra guard_cf_piva_obbligatori e
#     guard_sesso_policy (alfabetico). L'ordine non e' dominio: le tre regole
#     sono indipendenti.
#   * Due codici e non uno: il flag sbagliato lo dice il CODICE, non un testo
#     nel VARIADIC (un'etichetta italiana passata come valore non si traduce).
#     Il VARIADIC porta la descrizione della natura, la cosa che l'operatore
#     riconosce. Il campo nel contesto e' il flag; senza natura e' la natura.
#   * Se sono sbagliati tutti e due, parla prima cliente_pa: l'operatore
#     corregge e al giro dopo vede l'altro.
#   * DATO_ERRATO: i flag li compila una persona nel form.
#   * SECURITY INVOKER: legge solo config.tipi_soggetto_dettaglio, che
#     l'applicazione vede.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261010-86-create-trgfn-soggetti-guard-regime-pa-mctit.yaml

  - changeSet:
      id: 20261010-86-create-trgfn-soggetti-guard-regime-pa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard anagrafiche.trgfn_soggetti_guard_regime_pa e trigger
        trg_soggetti_a10_guard_regime_pa_ins_upd (BEFORE INSERT OR UPDATE OF cliente_pa,
        split_payment, tipo_soggetto_dettaglio_id): un flag a S deve essere ammesso dalla natura;
        senza natura un flag a S e' rifiutato. Codici E_CLIENTE_PA_NON_AMMESSO,
        E_SPLIT_PAYMENT_NON_AMMESSO, E_DATO_FISCALE_SENZA_TIPO_SOGGETTO.
        Brief: brief-db-dati-fiscali-e-societari-del-soggetto (A-3, A-5).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: config, tableName: tipi_soggetto_dettaglio, columnName: cliente_pa_ammesso }
            - columnExists:
                { schemaName: config, tableName: tipi_soggetto_dettaglio, columnName: split_payment_ammesso }
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                    JOIN pg_catalog.pg_class r ON r.oid = t.tgrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = r.relnamespace
                   WHERE n.nspname = 'anagrafiche' AND r.relname = 'soggetti'
                     AND t.tgname = 'trg_soggetti_a10_guard_regime_pa_ins_upd';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_guard_regime_pa()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: cliente_pa e split_payment a 'S' solo se la natura li ammette.
              --   config.tipi_soggetto_dettaglio.cliente_pa_ammesso /
              --   split_payment_ammesso: false -> il flag resta 'N'.
              --   Il VALORE (S/N) lo presidiano i CHECK chk_soggetti_cliente_pa e
              --   chk_soggetti_split_payment; qui si decide solo PER CHI, cioe' la
              --   parte che sta in un'altra tabella e che un CHECK non puo' leggere.
              -- Aggancio: BEFORE INSERT OR UPDATE OF cliente_pa, split_payment,
              --   tipo_soggetto_dettaglio_id. Il ramo sulla natura copre il cambio di
              --   natura. Nessun altro trigger BEFORE di soggetti scrive queste tre
              --   colonne (linee-guida-trigger, «UPDATE OF»).
              -- ⭐ Senza natura RIFIUTA un flag a 'S' (A-5): diverge apposta dai
              --   guard del sesso e di CF/P.IVA, che li' tacciono.
              -- Brief: brief-db-dati-fiscali-e-societari-del-soggetto (A-3, A-5).
              -- =========================================================
              DECLARE
                  v_cliente_pa_ammesso    config.tipi_soggetto_dettaglio.cliente_pa_ammesso%TYPE;
                  v_split_payment_ammesso config.tipi_soggetto_dettaglio.split_payment_ammesso%TYPE;
                  v_descrizione           config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_codice                config.tipi_soggetto_dettaglio.codice_interno%TYPE;
              BEGIN
                  -- Due flag a 'N': nessuna natura ha niente da dire.
                  IF NEW.cliente_pa IS DISTINCT FROM 'S' AND NEW.split_payment IS DISTINCT FROM 'S' THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.tipo_soggetto_dettaglio_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.trgfn_soggetti_guard_regime_pa',
                          'E_DATO_FISCALE_SENZA_TIPO_SOGGETTO',
                          jsonb_build_object('campo',         'tipo_soggetto_dettaglio_id',
                                             'soggetto_id',   NEW.id,
                                             'cliente_pa',    NEW.cliente_pa,
                                             'split_payment', NEW.split_payment),
                          NEW.tx_id,
                          -- frase chiusa: il VARIADIC si passa vuoto ma ESPLICITO,
                          -- o la firma variadica non si risolve
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  SELECT tsd.cliente_pa_ammesso, tsd.split_payment_ammesso,
                         tsd.descrizione, tsd.codice_interno
                    INTO v_cliente_pa_ammesso, v_split_payment_ammesso,
                         v_descrizione, v_codice
                    FROM config.tipi_soggetto_dettaglio tsd
                   WHERE tsd.id = NEW.tipo_soggetto_dettaglio_id;

                  IF NOT FOUND THEN
                      RETURN NEW;   -- la FK fk_soggetti_tipo_soggetto_dettaglio parla dopo
                  END IF;

                  IF NEW.cliente_pa = 'S' AND NOT v_cliente_pa_ammesso THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.trgfn_soggetti_guard_regime_pa',
                          'E_CLIENTE_PA_NON_AMMESSO',
                          jsonb_build_object('campo',                      'cliente_pa',
                                             'soggetto_id',                NEW.id,
                                             'tipo_soggetto_dettaglio_id', NEW.tipo_soggetto_dettaglio_id,
                                             'codice_interno',             v_codice),
                          NEW.tx_id,
                          COALESCE(v_descrizione, v_codice));
                  END IF;

                  IF NEW.split_payment = 'S' AND NOT v_split_payment_ammesso THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.trgfn_soggetti_guard_regime_pa',
                          'E_SPLIT_PAYMENT_NON_AMMESSO',
                          jsonb_build_object('campo',                      'split_payment',
                                             'soggetto_id',                NEW.id,
                                             'tipo_soggetto_dettaglio_id', NEW.tipo_soggetto_dettaglio_id,
                                             'codice_interno',             v_codice),
                          NEW.tx_id,
                          COALESCE(v_descrizione, v_codice));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_guard_regime_pa() IS
                  'Guard BEFORE INSERT OR UPDATE OF cliente_pa, split_payment, tipo_soggetto_dettaglio_id su anagrafiche.soggetti: un flag a S deve essere ammesso dalla natura (config.tipi_soggetto_dettaglio.cliente_pa_ammesso / split_payment_ammesso), altrimenti E_CLIENTE_PA_NON_AMMESSO o E_SPLIT_PAYMENT_NON_AMMESSO col flag nel campo. Senza natura un flag a S e'' rifiutato con E_DATO_FISCALE_SENZA_TIPO_SOGGETTO (A-5): diverge apposta dai guard del sesso e di CF/P.IVA, che li'' tacciono. Due flag a N passano sempre. Il cambio di natura e'' coperto: chi cambia natura porta il flag a N nella stessa scrittura, il DB non lo azzera. Brief: brief-db-dati-fiscali-e-societari-del-soggetto.';

              CREATE TRIGGER trg_soggetti_a10_guard_regime_pa_ins_upd
                  BEFORE INSERT OR UPDATE OF cliente_pa, split_payment, tipo_soggetto_dettaglio_id
                  ON anagrafiche.soggetti
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_guard_regime_pa();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_a10_guard_regime_pa_ins_upd ON anagrafiche.soggetti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_guard_regime_pa();
