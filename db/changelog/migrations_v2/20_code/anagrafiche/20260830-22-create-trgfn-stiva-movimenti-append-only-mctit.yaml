# ------------------------------------------------------------
# FASE B-a — IL REGISTRO DIVENTA «SOLO AGGIUNTE», PER PROGETTO
#   anagrafiche.trgfn_stiva_movimenti_append_only
#   Piano: brief-db-titoli-iva-movimenti-annullo, §6.3 B-a — decisione B-1
#   Decisione di Tid, 2026-08-30
#
# ── ⭐ COSA CAMBIA, E PERCHE' NON E' UN DETTAGLIO ────────────────────
#   Il brief del BE poggiava il suo argomento principale su «il registro resta
#   append-only». Nel database non c'era NIENTE che lo imponesse: nessun guard su
#   UPDATE, nessuno su DELETE. Era una promessa che il backend manteneva, non una
#   regola. Da qui in poi e' una regola.
#
#   ⛔ E la meta' che sembra meno grave e' la peggiore: un UPDATE riscrive la
#   storia IN SILENZIO. L'accumulatore ricalcola e il totale resta «giusto»,
#   quindi nessuno vede che un importo e' cambiato — mentre un DELETE almeno
#   lascia un buco. Per questo si vietano entrambi, non solo la cancellazione.
#
# ── ⚠️ TRE RAMI DIVENTANO IRRAGGIUNGIBILI, e NON si tolgono ──────────
#   Con questo guard non arriva piu' nessun UPDATE ne' DELETE su questa tabella,
#   quindi diventano codice morto:
#     · la branca `TG_OP <> 'INSERT'` di
#       trgfn_soggetti_titoli_iva_movimenti_accumulatore — compresa la logica
#       dell'array, che oggi porta scritto «un UPDATE che sposta un movimento da
#       un titolo a un altro deve ricalcolarli ENTRAMBI»: quel caso da oggi NON
#       PUO' PIU' SUCCEDERE, e chi legge quel commento crederebbe il contrario;
#     · il trigger di storico (`BEFORE DELETE OR UPDATE`);
#     · la branca UPDATE dell'audit `data_update`/`user_update`.
#   ⛔ Restano tutti dove sono: sono difesa in profondita', e un guard si puo'
#   sempre spegnere. Ma vanno DICHIARATI irraggiungibili, o il prossimo che legge
#   l'accumulatore lavorera' su un caso che non esiste.
#
# ── ⛔ LA PULIZIA DELLA FATTURA, UN GIORNO, DOVRA' PASSARE ───────────
#   Oggi non tocca questa tabella: e' un'eccezione dichiarata `SCOPERTA_NOTA` in
#   db/pgtap/vendite/test-cleanup-fattura-copertura-figlie-v1.sql, con l'alibi
#   «0 righe e nessuno scrittore». Ma la nota di quell'eccezione dice gia' cosa
#   servira' con I5: «la pulizia deve STORNARE il movimento prima di cancellare,
#   altrimenti il plafond di un terzo resta mangiato da un documento che non
#   esiste piu'».
#
#   ⭐ Le due strade, e la seconda e' preferibile:
#     1. un'apertura dichiarata — una GUC che la pulizia accende e RICHIUDE — e
#        allora questo guard va esteso a leggerla;
#     2. **la pulizia non cancella: storna**, cioe' scrive un contro-movimento
#        esattamente come fa l'annullo. In quel caso questo guard non ha bisogno
#        di nessuna eccezione, perche' nessuno cancella davvero.
#   Non si decide adesso — e' materia di I5 — ma sta scritto qui, cosi' chi
#   arrivera' trova la domanda invece di un muro.
#
# ── ⚠️ NESSUNA ESENZIONE PER L'OWNER ────────────────────────────────
#   E' un trigger e scatta per tutti, owner compreso. Una bonifica futura passera'
#   dalla porta dichiarata, non dal ruolo: un guard che si scavalca cambiando
#   utente non e' un guard, e' un suggerimento.
#
# ── ⚠️ COSA E' STATO GUARDATO PRIMA ─────────────────────────────────
#   Cercato il 2026-08-30 su db/pgtap, backend/apps, db/changelog, scripts e
#   frontend/src: NESSUNO fa DELETE o UPDATE su questa tabella. Il guard non
#   rompe niente di esistente. ⚠️ Ma la ricerca testuale non vede l'SQL dinamico
#   — ed e' proprio il caso della pulizia fattura, che scopre le figlie da
#   pg_constraint e le cancella per nome costruito.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260830-22-create-trgfn-stiva-movimenti-append-only-mctit.yaml

  - changeSet:
      id: 20260830-22-create-trgfn-stiva-movimenti-append-only
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Fase B-a del brief-db-titoli-iva-movimenti-annullo (decisione B-1 di Tid, 2026-08-30):
        il registro dei movimenti di plafond diventa «solo aggiunte» PER PROGETTO — niente
        UPDATE, niente DELETE, E_TITOLO_IVA_MOVIMENTO_IMMUTABILE. Prima era una promessa che il
        backend manteneva, e tutto l'argomento del brief ci poggiava sopra. ⛔ Si vietano
        entrambi e non solo il DELETE: un UPDATE riscrive la storia IN SILENZIO, perche'
        l'accumulatore ricalcola e il totale resta «giusto». ⚠️ Da qui tre rami diventano
        irraggiungibili (la branca non-INSERT dell'accumulatore, lo storico, l'audit su UPDATE):
        NON si tolgono — sono difesa in profondita' — ma il corpo lo dichiara, o il prossimo che
        legge l'accumulatore lavorera' su un caso che non puo' piu' succedere. ⚠️ La pulizia
        della fattura un giorno dovra' passare (I5): le due strade sono scritte nel corpo, e la
        preferibile e' che storni invece di cancellare — cosi' il guard non ha eccezioni.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_movimenti
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_stiva_movimenti_append_only()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: rendere il registro dei movimenti di plafond IVA
              --   «solo aggiunte». Una riga scritta non si modifica e non si
              --   cancella: si corregge scrivendo un CONTRO-MOVIMENTO di segno
              --   opposto, che lascia a video l'errore, la correzione, e la
              --   data di entrambi.
              --   Decisione di Tid del 2026-08-30 (B-1).
              --   Piano: brief-db-titoli-iva-movimenti-annullo.
              --
              -- ⛔ VIETA ENTRAMBI, e la meta' che sembra meno grave e' la
              --   peggiore: un UPDATE riscrive la storia IN SILENZIO, perche'
              --   l'accumulatore ricalcola e il totale resta «giusto» — nessuno
              --   vede che un importo e' cambiato. Un DELETE almeno lascia un
              --   buco.
              --
              -- ⚠️ Da qui in poi sono IRRAGGIUNGIBILI, e restano dove sono
              --   come difesa in profondita': la branca `TG_OP <> 'INSERT'`
              --   dell'accumulatore (compreso il suo commento sul «movimento
              --   spostato da un titolo a un altro», che da oggi descrive un
              --   caso che non puo' piu' succedere), il trigger di storico e la
              --   branca UPDATE dell'audit.
              --
              -- ⚠️ Nessuna esenzione per l'owner: e' un trigger e scatta per
              --   tutti. Una bonifica futura passa da una porta dichiarata, non
              --   dal ruolo.
              --
              -- ⛔ E LA PULIZIA DELLA FATTURA, UN GIORNO, DOVRA' PASSARE.
              --   Oggi non tocca questa tabella (eccezione SCOPERTA_NOTA in
              --   test-cleanup-fattura-copertura-figlie-v1.sql), ma con I5
              --   servira' decidere. Due strade:
              --     1) un'apertura dichiarata via GUC, che questo guard dovra'
              --        leggere — e che chi la apre deve RICHIUDERE;
              --     2) la pulizia STORNA invece di cancellare, cioe' scrive un
              --        contro-movimento come fa l'annullo — e allora qui non
              --        serve nessuna eccezione.
              --   La seconda e' preferibile, ed e' anche cio' che la nota di
              --   quell'eccezione gia' indica.
              DECLARE
                  v_tx_id anagrafiche.soggetti_titoli_iva_movimenti.tx_id%TYPE;
              BEGIN
                  v_tx_id := OLD.tx_id;

                  PERFORM script.fn_log_and_raise_error(
                      'anagrafiche', TG_NAME, 'E_TITOLO_IVA_MOVIMENTO_IMMUTABILE',
                      jsonb_build_object(
                          'movimento_id',   OLD.id,
                          'titolo_iva_id',  OLD.titolo_iva_id,
                          'tipo_movimento', OLD.tipo_movimento,
                          'operazione',     TG_OP),
                      v_tx_id,
                      -- ⚠️ Nel VARIADIC il tipo di movimento e la sua data, che
                      --   sono le due cose che una persona riconosce sul
                      --   registro. Mai l'id tecnico, che non si cerca a mano.
                      OLD.tipo_movimento,
                      to_char(OLD.data_movimento, 'DD/MM/YYYY'));

                  -- Irraggiungibile: fn_log_and_raise_error solleva sempre.
                  -- Sta qui perche' PL/pgSQL pretende un RETURN su una funzione
                  -- trigger, non perche' possa servire.
                  RETURN NULL;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.trgfn_stiva_movimenti_append_only()
              IS 'Rende il registro dei movimenti di plafond IVA «solo aggiunte»: rifiuta UPDATE e DELETE con E_TITOLO_IVA_MOVIMENTO_IMMUTABILE. Una riga si corregge con un CONTRO-MOVIMENTO di segno opposto, che lascia a video l''errore, la correzione e la data di entrambi. Decisione di Tid del 2026-08-30: prima era una promessa che il backend manteneva, e l''argomento del brief ci poggiava sopra. ⛔ Vieta ENTRAMBI, e la meta'' che sembra meno grave e'' la peggiore: un UPDATE riscrive la storia in silenzio, perche'' l''accumulatore ricalcola e il totale resta «giusto». ⚠️ Da qui sono irraggiungibili — e restano come difesa in profondita'' — la branca non-INSERT dell''accumulatore, il trigger di storico e l''audit su UPDATE. ⚠️ Nessuna esenzione per l''owner. ⛔ La pulizia della fattura, con I5, dovra'' passare: o un''apertura dichiarata via GUC, o (preferibile) storna invece di cancellare. Piano: brief-db-titoli-iva-movimenti-annullo.';

              DROP TRIGGER IF EXISTS trg_stiva_movimenti_a10_append_only_upd_dlt
                  ON anagrafiche.soggetti_titoli_iva_movimenti;

              CREATE TRIGGER trg_stiva_movimenti_a10_append_only_upd_dlt
                  BEFORE UPDATE OR DELETE ON anagrafiche.soggetti_titoli_iva_movimenti
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_stiva_movimenti_append_only();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_stiva_movimenti_a10_append_only_upd_dlt
                  ON anagrafiche.soggetti_titoli_iva_movimenti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_stiva_movimenti_append_only();
