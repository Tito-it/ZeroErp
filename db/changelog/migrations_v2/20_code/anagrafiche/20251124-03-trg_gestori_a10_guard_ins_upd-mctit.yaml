databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251124-03-trg_gestori_a10_guard_ins_upd-mctit.yaml

    - changeSet:
          id: 20251124-03-trg_gestori_a10_guard_ins_upd
          author: mctit
          comment: "Guard di dominio per anagrafiche.gestori."
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        -- Rimuovo un eventuale trigger precedente con stesso nome
                        DROP TRIGGER IF EXISTS trg_gestori_a10_guard_ins_upd ON anagrafiche.gestori;

                        -- Creo il trigger di guardia
                        CREATE TRIGGER trg_gestori_a10_guard_ins_upd
                        BEFORE INSERT OR UPDATE
                        ON anagrafiche.gestori
                        FOR EACH ROW
                        EXECUTE FUNCTION anagrafiche.trgfn_gestori_guard();

    - changeSet:
          id: 20251124-04-trg_gestori_check_ruolo_gestore_ins_upd
          author: mctit
          comment: "Verifica del ruolo gestore per anagrafiche.gestori."
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        -- Rimuovo un eventuale trigger precedente con stesso nome
                        DROP TRIGGER IF EXISTS trg_gestori_check_ruolo_gestore_ins_upd 
                        ON anagrafiche.gestori;

                        -- Creo il trigger di guardia
                        CREATE TRIGGER trg_gestori_check_ruolo_gestore_ins_upd
                        BEFORE INSERT OR UPDATE
                        ON anagrafiche.gestori
                        FOR EACH ROW
                        EXECUTE FUNCTION anagrafiche.trgfn_gestori_check_ruolo_gestore();
