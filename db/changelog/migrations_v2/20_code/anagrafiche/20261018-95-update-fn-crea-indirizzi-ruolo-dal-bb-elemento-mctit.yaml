# anagrafiche.fn_crea_indirizzi_ruolo — la grammatica dell'indirizzo dai BB
#   * l'elemento (oggetto, chiavi ammesse, tipo) da
#     anagrafiche.fn_indirizzo_elemento, la via da
#     anagrafiche.fn_indirizzo_elemento_dettaglio (20261018-94): la stessa
#     grammatica della madre del soggetto (-96). Prima le chiavi ammesse e la
#     risoluzione della via erano scritte qui;
#   * postal_box si chiama postal_code (20261018-81).
#   Comportamento invariato: auto-clone dei tipi obbligatori dal primo
#   indirizzo, skip dei tipi che il ruolo ha gia', la via si risolve solo per
#   gli indirizzi che si scrivono. La completezza la dice il guard della
#   tabella (anagrafiche.trgfn_indirizzi_guard_forma_libera, -90).
#   Firma da 20261017-11 (ancorata), corpo da quello vivo. D-4 di Tid
#   (2026-10-18), richiesta BE in brief-db-processi-accensione-per-ambiente
#   §6.11.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261018-95-update-fn-crea-indirizzi-ruolo-dal-bb-elemento-mctit.yaml

  - changeSet:
      id: 20261018-95-update-fn-crea-indirizzi-ruolo-dal-bb-elemento
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_crea_indirizzi_ruolo: l'elemento e la via dai BB fn_indirizzo_elemento e
        fn_indirizzo_elemento_dettaglio (una grammatica con la madre del soggetto),
        postal_box -> postal_code. Comportamento invariato. D-4 di Tid (2026-10-18).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_indirizzi_ruolo(
                  p_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  p_indirizzi         jsonb)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  c_chi           CONSTANT text := 'anagrafiche.fn_crea_indirizzi_ruolo';
                  v_lista         jsonb := COALESCE(p_indirizzi, '[]'::jsonb);
                  v_norm          jsonb := '[]'::jsonb;  -- elementi col tipo risolto
                  v_el            jsonb;
                  v_tipo_ruolo_id anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE;
                  v_tipo_id       anagrafiche.indirizzi.tipo_indirizzo_id%TYPE;
                  v_n             integer := 0;   -- un conteggio: niente da ancorare
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere gli indirizzi di un ruolo. p_indirizzi e' un
                  --   array di oggetti; per ognuno il tipo (id o codice
                  --   interno) e l'indirizzo, in una di tre forme:
                  --     * libero:  indirizzo_libero (+ stato, comune e CAP del
                  --       catalogo, oppure localita' e codice postale);
                  --     * dettaglio gia' risolto: indirizzo_dettaglio_id;
                  --     * via: stradario_id, oppure via nuova (toponomastica,
                  --       descrizione_via, comune, CAP), piu' il civico.
                  --   La grammatica dell'elemento e la via sono dei BB
                  --   fn_indirizzo_elemento e fn_indirizzo_elemento_dettaglio,
                  --   comuni con fn_crea_indirizzo_soggetto.
                  --   Ritorna quanti indirizzi ha scritto.
                  --
                  -- Regole:
                  --   - AUTO-CLONE: i tipi obbligatori della matrice del ruolo
                  --     (config.tipi_ruolo_tipi_indirizzo) assenti dal payload
                  --     si copiano dal primo indirizzo;
                  --   - un tipo che il ruolo ha gia' si salta;
                  --   - payload vuoto: niente, nemmeno i cloni;
                  --   - la completezza e la forma le dice il guard della
                  --     tabella (trgfn_indirizzi_guard_forma_libera).
                  -- =========================================================
                  IF jsonb_typeof(v_lista) <> 'array' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo_indirizzi', jsonb_typeof(v_lista)),
                          NULL::uuid,
                          c_chi,
                          'gli indirizzi non sono un elenco');
                  END IF;

                  SELECT sr.tipo_ruolo_id
                    INTO v_tipo_ruolo_id
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.id = p_soggetto_ruolo_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SOGGETTO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          NULL::uuid,
                          COALESCE(p_soggetto_ruolo_id::text, '-'));
                  END IF;

                  IF jsonb_array_length(v_lista) = 0 THEN
                      RETURN 0;
                  END IF;

                  -- 1. Ogni elemento: un oggetto, chiavi ammesse, tipo risolto.
                  FOR v_el IN SELECT e FROM jsonb_array_elements(v_lista) AS e LOOP
                      v_norm := v_norm || jsonb_build_array(
                                  anagrafiche.fn_indirizzo_elemento(
                                      v_el, c_chi,
                                      jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id)));
                  END LOOP;

                  -- 2. AUTO-CLONE: i tipi obbligatori del ruolo che il payload
                  --    non porta, copiati dal primo indirizzo.
                  v_norm := v_norm || COALESCE(
                      (SELECT jsonb_agg((v_norm -> 0) || jsonb_build_object('tipo_indirizzo_id', m.tipo_indirizzo_id)
                                        ORDER BY m.tipo_indirizzo_id)
                         FROM config.tipi_ruolo_tipi_indirizzo m
                        WHERE m.tipo_ruolo_id = v_tipo_ruolo_id
                          AND m.attivo
                          AND m.obbligatorio
                          AND NOT EXISTS (
                                SELECT 1
                                  FROM jsonb_array_elements(v_norm) AS x
                                 WHERE (x ->> 'tipo_indirizzo_id')::integer = m.tipo_indirizzo_id)),
                      '[]'::jsonb);

                  -- 3. La scrittura: un tipo che il ruolo ha gia' si salta. La
                  --    via si risolve solo qui, per gli indirizzi che si scrivono.
                  FOR v_el IN SELECT e FROM jsonb_array_elements(v_norm) AS e LOOP
                      v_tipo_id := (v_el ->> 'tipo_indirizzo_id')::integer;

                      CONTINUE WHEN EXISTS (
                          SELECT 1
                            FROM anagrafiche.indirizzi i
                           WHERE i.soggetto_ruolo_id = p_soggetto_ruolo_id
                             AND i.tipo_indirizzo_id = v_tipo_id);

                      INSERT INTO anagrafiche.indirizzi (
                          soggetto_ruolo_id, tipo_indirizzo_id,
                          indirizzo_dettaglio_id, indirizzo_libero,
                          stato_id, comune_id, codice_postale_id,
                          administrative_area, locality, sublocality, postal_code)
                      VALUES (
                          p_soggetto_ruolo_id, v_tipo_id,
                          anagrafiche.fn_indirizzo_elemento_dettaglio(v_el),
                          NULLIF(btrim(v_el ->> 'indirizzo_libero'), ''),
                          (v_el ->> 'stato_id')::integer,
                          (v_el ->> 'comune_id')::integer,
                          (v_el ->> 'codice_postale_id')::integer,
                          v_el ->> 'administrative_area',
                          v_el ->> 'locality',
                          v_el ->> 'sublocality',
                          v_el ->> 'postal_code');

                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_indirizzi_ruolo(anagrafiche.soggetti_ruoli.id%TYPE, jsonb) IS
                  'Madre (2026-10-17): scrive gli indirizzi di un ruolo in una sola istruzione. p_indirizzi: array di oggetti, ciascuno col tipo (tipo_indirizzo_id o tipo_indirizzo_codice, codice interno) e l''indirizzo in una di tre forme: libero (indirizzo_libero con stato, poi comune e CAP del catalogo oppure locality e postal_code), dettaglio gia'' risolto (indirizzo_dettaglio_id), via da risolvere (stradario_id oppure toponomastica_id + descrizione_via + comune_id + codice_postale_id, piu'' il civico). AUTO-CLONE: i tipi obbligatori della matrice del ruolo (config.tipi_ruolo_tipi_indirizzo, attivi) assenti dal payload si copiano dal primo indirizzo; un tipo che il ruolo ha gia'' si salta; payload vuoto: nessuna scrittura. Il tipo del ruolo si legge dal ruolo. Ritorna quanti indirizzi ha scritto. Rifiuti: elenco malformato E_SCRIPT_CHIAMATA_NON_VALIDA, ruolo inesistente E_SOGGETTO_RUOLO_NON_TROVATO; l''elemento lo legge anagrafiche.fn_indirizzo_elemento (oggetto, chiavi ammesse, tipo: E_SCRIPT_CHIAMATA_NON_VALIDA, E_CAMPO_NON_AMMESSO, E_TIPO_INDIRIZZO_NON_TROVATO) e la via la risolve anagrafiche.fn_indirizzo_elemento_dettaglio (fn_create_indirizzo, idempotente): la stessa grammatica di fn_crea_indirizzo_soggetto (rev 2026-10-18, D-4 di Tid). Il tipo ammesso per il ruolo e la forma dell''indirizzo libero li dicono i guard della tabella (anagrafiche.trgfn_indirizzi_guard_forma_libera). Non valida i campi di una via nuova (pre-check del backend) ne'' il permesso (dominio anagrafiche, B-5). INVOKER. Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 2; §6.11).';
      rollback:
        - sql:
            sql: >
              SELECT 1; -- il corpo precedente scriveva postal_box, rinominata
