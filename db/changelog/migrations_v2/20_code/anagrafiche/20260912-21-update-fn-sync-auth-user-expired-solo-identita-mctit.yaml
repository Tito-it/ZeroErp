# ------------------------------------------------------------
# fn_sync_auth_user_expired: CADE IL RAMO LEGACY (strato 2, D1 — decisione Tid 12-09).
#   Analisi: analisi-software-per-dati-morti.md §2.1 (deciso) e §6.2
#
# L'UNION aveva due rami: risorse_umane.valido_al via la VISTA col nome vecchio
# («legacy») e identita_digitali.valido_al. Tid: «tutto deve entrare in
# identita_digitali». E la struttura lo diceva gia': fn_sync_auth_user_is_active
# (v4) decide SOLO sull'identita' — il ramo poteva proporre un candidato, mai
# cambiare l'esito. Resta il solo ramo sull'identita'. La copia Python dello
# stesso WHERE (anagrafiche_repository.list_expired_auth_user_ids) e' gia'
# stata riscritta dal BE (12-09).
# Corpo dalla doc auto-gen (= vivo): cambiano il %TYPE, l'intestazione, il
# blocco EXECUTE del loop e il COMMENT. Il resto e' identico.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260912-21-update-fn-sync-auth-user-expired-solo-identita-mctit.yaml

  - changeSet:
      id: 20260912-21-update-fn-sync-auth-user-expired-solo-identita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.fn_sync_auth_user_expired: solo identita_digitali.valido_al,
        senza il ramo legacy via la vista risorse_umane_auth_user (in ritiro);
        %TYPE su identita_digitali. Esito invariato: fn_sync_auth_user_is_active
        decideva gia' solo sull'identita'.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_sync_auth_user_expired';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- RETURNS integer esplicito: e' un CONTEGGIO di utenti disattivati, non il
              -- riflesso di una colonna — non c'e' niente a cui ancorare un %TYPE.
              CREATE OR REPLACE FUNCTION anagrafiche.fn_sync_auth_user_expired()
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Variabili locali tipizzate %TYPE (policy ZeroErp).
                  v_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_modified     boolean;
                  v_count        integer := 0;
              BEGIN
                  -- ------------------------------------------------------------
                  -- Funzione: anagrafiche.fn_sync_auth_user_expired (v3, 12-09-2026)
                  -- Scopo:
                  --   Batch di disattivazione overnight per utenti con finestra
                  --   temporale scaduta: identita_digitali.valido_al < CURRENT_DATE,
                  --   per tutte le vesti.
                  --   ⛔ Il «ramo legacy» (risorse_umane.valido_al via la vista
                  --   risorse_umane_auth_user) e' caduto: la regola vive in
                  --   identita_digitali.valido_al (decisione Tid 12-09-2026), e
                  --   fn_sync_auth_user_is_active decide comunque SOLO sull'identita'
                  --   — quel ramo poteva proporre candidati, mai cambiare l'esito.
                  --
                  --   Uso: pgAgent daily job + management command Django.
                  --
                  -- Ritorna: numero di utenti effettivamente disattivati.
                  -- ------------------------------------------------------------

                  -- Short-circuit CI: se lo schema django non esiste, no-op.
                  IF to_regclass('django.auth_user') IS NULL THEN
                      RETURN 0;
                  END IF;

                  -- Loop sui candidati: auth_user ancora is_active=true con almeno
                  -- un'identita' digitale attiva a finestra scaduta (operatori,
                  -- portale, fornitore, shop, api client).
                  FOR v_auth_user_id IN
                      EXECUTE '
                          SELECT DISTINCT id.auth_user_id
                            FROM anagrafiche.identita_digitali id
                            JOIN django.auth_user au
                              ON au.id = id.auth_user_id
                           WHERE id.attivo = true
                             AND id.valido_al IS NOT NULL
                             AND id.valido_al < CURRENT_DATE
                             AND au.is_active = true
                      '
                  LOOP
                      -- Invoca la nuova firma sync per ciascun candidato.
                      -- La funzione sync applica la logica di fail-closed
                      -- (fuori finestra -> false); qui contiamo solo quelli
                      -- realmente modificati (v_modified = true).
                      SELECT anagrafiche.fn_sync_auth_user_is_active(v_auth_user_id)
                        INTO v_modified;

                      IF v_modified THEN
                          v_count := v_count + 1;
                      END IF;
                  END LOOP;

                  RETURN v_count;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_sync_auth_user_expired() IS
              'Batch: disattiva auth_user per finestra temporale scaduta su identita_digitali.valido_al (tutte le vesti). Dal 12-09-2026 senza il ramo legacy via risorse_umane_auth_user: la regola vive in identita_digitali e fn_sync_auth_user_is_active decide solo li''. Invocata da pgAgent daily e management command Django. Ritorna il numero di utenti disattivati.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' nella doc auto-gen alla revisione prima di
              -- questa. Non si riscrive un corpo stantio.
              SELECT 1;
