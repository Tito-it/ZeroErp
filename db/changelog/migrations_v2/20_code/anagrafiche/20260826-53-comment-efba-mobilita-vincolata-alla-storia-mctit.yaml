# Le note che davano per SCONTATO lo spostamento di un cliente fra emittenti
#   COMMENT ON — nessuna funzione ricreata
#   Piano: brief-db-billing-account-cambio-emittente (§8, coda di M3)
#
# ── ⭐ IL PROBLEMA: la doc raccontava il modello di prima ────────────
#   Prima del 20260826-49 il legame cliente -> emittente era un attributo
#   MOBILE, e la documentazione lo diceva — non per svista, ma perche' allora
#   era vero. Tre esempi, tutti dentro il database:
#
#     * trgfn_efba_guard_albero_emittente:  «se il mapping viene spostato da un
#       BA a un altro (caso teorico: la UNIQUE lo rende raro)»;
#     * fn_guard_albero_ba_emittente:       «il movimento che si dimentica
#       sempre: cambiare l'emittente di un BA…»;
#     * fn_guard_albero_ba_gestore_globale: «cambia in blocco l'emittente di
#       tutti i BA senza mapping specifico».
#
#   Nessuna di queste frasi e' falsa sul MECCANISMO — quei guard devono ancora
#   coprire quei movimenti — ma tutte lasciano credere che lo spostamento sia
#   un'operazione ordinaria. Non lo e' piu'.
#
# ── ⛔ E NON SI SCRIVE «NON SI PUO' FARE» ───────────────────────────
#   Sarebbe sbagliato quanto la nota vecchia, nell'altra direzione. La
#   decisione D-1 e' la forma «b»: **libero finche' non c'e' storia, vietato
#   dopo**. Un billing account nasce gia' agganciato all'emittente
#   dell'operatore che lo crea, quindi puo' nascere sbagliato: se il legame
#   fosse immutabile, quell'errore non si correggerebbe piu'.
#   ⇒ La frase giusta nomina la CONDIZIONE, non il divieto.
#
# ⚠️ Solo `COMMENT ON`: nessuna funzione viene ricreata, nessun corpo cambia.
#   E' l'unico modo di correggere una frase che vive nel database senza
#   toccare il codice che la porta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260826-53-comment-efba-mobilita-vincolata-alla-storia-mctit.yaml

  - changeSet:
      id: 20260826-53-comment-efba-mobilita-vincolata-alla-storia
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Corregge quattro COMMENT che davano per scontato lo spostamento di un cliente fra
        emittenti: prima del 20260826-49 era vero, e la doc lo diceva. Nessuna di quelle frasi
        e' falsa sul meccanismo — i guard dell'albero devono ancora coprire quei movimenti — ma
        tutte lasciano credere che lo spostamento sia ordinario. ⛔ E NON si scrive «non si puo'
        fare»: sarebbe sbagliato quanto la nota vecchia, nell'altra direzione. La decisione D-1
        e' la forma «b» — libero finche' non c'e' storia, vietato dopo — perche' un billing
        account nasce gia' agganciato all'emittente di chi lo crea e puo' nascere sbagliato: con
        un legame immutabile quell'errore non si correggerebbe piu'. La frase giusta nomina la
        CONDIZIONE, non il divieto. ⚠️ Solo COMMENT ON: nessuna funzione ricreata, nessun corpo
        toccato. Piano: brief-db-billing-account-cambio-emittente.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 4
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname IN ('trgfn_efba_guard_albero_emittente',
                                       'fn_guard_albero_ba_emittente',
                                       'fn_guard_albero_ba_gestore_globale',
                                       'trgfn_billing_account_link_ef');
            # Il cancello dev'esserci: altrimenti questi commenti direbbero il
            # falso al contrario, promettendo un presidio che non c'e'.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname = 'trgfn_efba_guard_storia_emittente';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION anagrafiche.trgfn_efba_guard_albero_emittente()
              IS 'Trigger AFTER su anagrafiche.emittenti_fiscali_billing_account: presidia i TRE movimenti che cambiano l''emittente di un BA — modifica del mapping, cancellazione del mapping (il BA ricade sul gestore globale) e spostamento di is_default (raggio N). Delega a fn_guard_albero_ba_emittente / fn_guard_albero_ba_gestore_globale. AFTER perche'' il guard rilegge il mapping per risolvere l''emittente. Brief P-1 §11.3. ⚠️ rev 2026-08-26: quei movimenti NON sono piu'' ordinari. Dal 20260826-49 anagrafiche.trgfn_efba_guard_storia_emittente li ammette solo finche'' il billing account non ha STORIA — nessuna fattura e nessuna commessa — perche'' un documento gia'' emesso congela chi lo ha emesso e spostare il cliente lo lascerebbe orfano. ⛔ Non e'' un divieto: e'' una CONDIZIONE. Un billing account nasce gia'' agganciato all''emittente dell''operatore che lo crea, quindi puo'' nascere sbagliato, e la correzione deve restare possibile finche'' su quel cliente non e'' passato del lavoro. Questo guard e'' il fratello dell''altro e resta necessario: uno dice «l''albero non puo'' diventare misto», l''altro «la storia non si sposta». Brief: brief-db-billing-account-cambio-emittente.';

              COMMENT ON FUNCTION anagrafiche.fn_guard_albero_ba_emittente(bigint)
              IS 'Guard fail-fast: verifica che il billing account indicato sia omogeneo per emittente con il PADRE e con TUTTI i FIGLI. Solleva E_ALBERO_EMITTENTE_MISTO nominando i due BA e i due emittenti. SECURITY DEFINER perche'' legge anagrafiche.billing_account, che ha la RLS: da SECURITY INVOKER un padre o un figlio di un altro emittente sarebbe invisibile e il guard direbbe «a posto» proprio nel caso da bloccare (brief §11.1). Nessuna eccezione per il pregresso e nessuna GUC di override: un invariante con l''interruttore non e'' un invariante. Brief P-1 §3.5. ⚠️ rev 2026-08-26: il corpo parla di «cambiare l''emittente di un BA» come di un movimento normale, e fino al 20260826-49 lo era. Ora quel movimento e'' ammesso solo finche'' il billing account non ha STORIA (fatture o commesse): lo presidia anagrafiche.trgfn_efba_guard_storia_emittente. ⭐ Questo guard NON cambia e resta indispensabile: risponde a un''altra domanda — l''omogeneita'' dell''albero — e i due cancelli si sommano invece di sovrapporsi. Brief: brief-db-billing-account-cambio-emittente.';

              COMMENT ON FUNCTION anagrafiche.fn_guard_albero_ba_gestore_globale()
              IS 'Guard fail-fast per lo spostamento del gestore globale (is_default), l''unica operazione del cantiere con raggio N: cambia in blocco l''emittente di tutti i BA senza mapping specifico. Verifica i soli BA non mappati che stanno in un albero — se entrambi i lati di una coppia sono non mappati si spostano insieme e l''albero resta omogeneo (decisione Q3: la condizione e'' la COPPIA MISTA). SECURITY DEFINER: legge billing_account, che ha la RLS. Brief P-1 §11.3. ⚠️ rev 2026-08-26: dal 20260826-48 quello stesso movimento ha un SECONDO cancello, anagrafiche.fn_guard_ba_gestore_globale_storia, che lo vieta se anche UN SOLO billing account non mappato ha gia'' fatture o commesse — cioe'', su un''installazione che ha gia'' fatturato, quasi sempre. Spostare il gestore globale li'' non e'' una configurazione da rivedere: e'' una riscrittura retroattiva della storia. ⭐ I due guard restano entrambi: questo chiede «l''albero puo'' diventare misto?», l''altro «c''e'' storia da proteggere?». Brief: brief-db-billing-account-cambio-emittente.';

              COMMENT ON FUNCTION anagrafiche.trgfn_billing_account_link_ef()
              IS 'Auto-link AFTER INSERT su billing_account: crea il mapping in emittenti_fiscali_billing_account collegando il BA all''emittente dell''operatore corrente (via GUC app.current_user_id e script.fn_resolve_emittente_for_user). is_default=false (mapping specifico). Skip in caso di seed/bootstrap o "0 emittenti". ⚠️ rev 2026-08-26 — QUESTA E'' LA SCELTA, e conviene saperlo qui: un billing account non passa MAI da uno stato «senza emittente», nasce gia'' agganciato, e se l''operatore stava lavorando sull''emittente sbagliato nasce AGGANCIATO MALE. Dal 20260826-49 quel legame si corregge solo finche'' sul cliente non e'' passato del lavoro — nessuna fattura, nessuna commessa (anagrafiche.trgfn_efba_guard_storia_emittente): dopo, i documenti gia'' emessi congelano chi li ha emessi e spostare il cliente li lascerebbe orfani. ⇒ La finestra di correzione si apre qui e si chiude al primo push. Brief: brief-db-billing-account-cambio-emittente.';
      rollback:
        - empty: {}
