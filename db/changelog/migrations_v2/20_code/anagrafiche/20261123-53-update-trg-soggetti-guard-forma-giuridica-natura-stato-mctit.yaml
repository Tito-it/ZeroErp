# comment-al-presente: ammesso — file gia' applicato su scratch e dbdev, non si riscrive (checksum): i suoi COMMENT li riscrive al presente 20_code/anagrafiche/20261123-64.
# Il guard al COMMIT della forma giuridica rilegge anche il paese, e scatta
#   al cambio di stato del soggetto.
#   Brief: brief-db-revisione-anagrafiche §20 (T5), S41-5 con D-T5-3 a (Tid,
#   2026-11-23).
#
# -- IL DIFETTO ------------------------------------------------------------------
#   La forma giuridica e' di un paese (config.forme_giuridiche.stato_id): il
#   guard immediato dei dati societari lo confronta con lo stato del soggetto
#   (E_FORMA_GIURIDICA_PAESE), ma solo quando si scrivono i dati societari.
#   Un cambio di stato_id del soggetto non rileggeva niente: una SRL italiana
#   restava su un soggetto tedesco.
#
# -- LA FORMA ----------------------------------------------------------------------
#   Con D-T5-3 a lo stato lo cambia solo il SUPER_ADMIN (-51): resta da
#   giudicare il suo cambio. Il guard al COMMIT del soggetto
#   (trg_soggetti_def_guard_forma_giuridica_natura_upd) scatta anche OF
#   stato_id, e prima della natura giudica il paese, nello stesso ordine del
#   guard immediato (1. paese, 2. natura), con lo stesso codice
#   E_FORMA_GIURIDICA_PAESE e campo forma_giuridica_id: il SUPER_ADMIN cambia
#   lo stato e la forma nella stessa transazione, e si giudica lo stato finale.
#   Corpo da pg_get_functiondef, DECLARE gia' ancorato; aggiunti il paese e
#   le due variabili che lo leggono.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261123-53-update-trg-soggetti-guard-forma-giuridica-natura-stato-mctit.yaml

  - changeSet:
      id: 20261123-53-update-trg-soggetti-guard-forma-giuridica-natura-stato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura giudica anche il paese della forma
        (E_FORMA_GIURIDICA_PAESE) e il suo trigger al COMMIT scatta anche OF stato_id.
        brief-db-revisione-anagrafiche §20, S41-5.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'trgfn_soggetti_guard_forma_giuridica_natura';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: al COMMIT, la forma giuridica dei dati societari regge il
              --   soggetto com'e' diventato, nell'ordine del guard immediato dei
              --   dati societari:
              --   1. paese della forma = stato del soggetto -> E_FORMA_GIURIDICA_PAESE
              --   2. ammessa dalla natura (anagrafiche.fn_forma_giuridica_ammessa)
              --                          -> E_TIPO_SOGGETTO_FORMA_GIURIDICA_NON_AMMESSA
              -- Aggancio: CONSTRAINT TRIGGER AFTER UPDATE OF tipo_soggetto_dettaglio_id,
              --   stato_id, DEFERRABLE INITIALLY DEFERRED: natura (o stato) e forma
              --   si cambiano nella stessa transazione, e si giudica lo stato
              --   finale. Si rileggono le tabelle, non NEW.
              -- Tace senza dati societari o con forma NULL; il punto 2 tace con
              --   natura NULL.
              -- Brief: brief-db-dati-fiscali-e-societari-del-soggetto (C-1); il
              --   paese dal 2026-11-24 (S41-5, brief-db-revisione-anagrafiche §20).
              -- =========================================================
              DECLARE
                  v_natura_id      anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                  v_sogg_stato_id  anagrafiche.soggetti.stato_id%TYPE;
                  v_forma_id       anagrafiche.dati_societari.forma_giuridica_id%TYPE;
                  v_forma_stato_id config.forme_giuridiche.stato_id%TYPE;
                  v_natura         config.tipi_soggetto_dettaglio.descrizione%TYPE;
                  v_forma          config.forme_giuridiche.descrizione%TYPE;
                  v_paese          config.stati.descrizione%TYPE;
              BEGIN
                  SELECT s.tipo_soggetto_dettaglio_id, s.stato_id INTO v_natura_id, v_sogg_stato_id
                    FROM anagrafiche.soggetti s WHERE s.id = NEW.id;
                  SELECT ds.forma_giuridica_id INTO v_forma_id
                    FROM anagrafiche.dati_societari ds WHERE ds.soggetto_id = NEW.id;

                  IF v_forma_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  SELECT fg.stato_id, fg.descrizione INTO v_forma_stato_id, v_forma
                    FROM config.forme_giuridiche fg WHERE fg.id = v_forma_id;

                  -- 1. Paese (S41-5)
                  IF v_sogg_stato_id IS DISTINCT FROM v_forma_stato_id THEN
                      SELECT st.descrizione INTO v_paese FROM config.stati st WHERE st.id = v_sogg_stato_id;
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura',
                          'E_FORMA_GIURIDICA_PAESE',
                          jsonb_build_object('campo',              'forma_giuridica_id',
                                             'soggetto_id',        NEW.id,
                                             'forma_giuridica_id', v_forma_id,
                                             'soggetto_stato_id',  v_sogg_stato_id,
                                             'forma_stato_id',     v_forma_stato_id),
                          NEW.tx_id,
                          COALESCE(v_forma, v_forma_id::text),
                          COALESCE(v_paese, v_sogg_stato_id::text));
                  END IF;

                  -- 2. Ammessa dalla natura (C-1)
                  IF v_natura_id IS NULL
                     OR anagrafiche.fn_forma_giuridica_ammessa(v_forma_id, v_natura_id,
                                                               script.fn_giorno_operativo(now())) THEN
                      RETURN NULL;
                  END IF;

                  SELECT COALESCE(tsd.descrizione, tsd.codice_interno) INTO v_natura
                    FROM config.tipi_soggetto_dettaglio tsd WHERE tsd.id = v_natura_id;

                  PERFORM script.fn_log_and_raise_error(
                      'database', 'anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura',
                      'E_TIPO_SOGGETTO_FORMA_GIURIDICA_NON_AMMESSA',
                      jsonb_build_object('campo',                      'forma_giuridica_id',
                                         'soggetto_id',                NEW.id,
                                         'tipo_soggetto_dettaglio_id', v_natura_id,
                                         'forma_giuridica_id',         v_forma_id),
                      NEW.tx_id,
                      v_natura,
                      COALESCE(v_forma, v_forma_id::text));

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura() IS
                  'Guard al COMMIT (constraint trigger AFTER UPDATE OF tipo_soggetto_dettaglio_id, stato_id, DEFERRABLE INITIALLY DEFERRED) su anagrafiche.soggetti: la forma giuridica dei dati societari regge il soggetto com''e'' diventato, nell''ordine del guard immediato trgfn_dati_societari_guard_forma_giuridica. 1. il paese della forma e'' lo stato del soggetto, altrimenti E_FORMA_GIURIDICA_PAESE (dal 2026-11-24: un cambio di stato non rileggeva la forma, S41-5 di brief-db-revisione-anagrafiche §20; lo stato lo cambia solo il SUPER_ADMIN, D-T5-3 a); 2. la natura ammette la forma (anagrafiche.fn_forma_giuridica_ammessa), altrimenti E_TIPO_SOGGETTO_FORMA_GIURIDICA_NON_AMMESSA. Campo forma_giuridica_id. Differito perche'' natura o stato e forma si cambiano insieme. Rilegge le tabelle, non NEW. Tace senza dati societari o con forma NULL; il punto 2 tace con natura NULL. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (C-1).';

              -- I trigger di trgfn_soggetti_guard_forma_giuridica_natura si tolgono per FUNZIONE, non per
              --   nome: dbdev e un database costruito da zero li hanno con nomi diversi
              --   (oggi lo stesso nome nei due, trg_soggetti_def_guard_forma_giuridica_natura_upd; 20251119-01 ha rinominato la funzione, non sempre il trigger).
              DO $via$
              DECLARE
                  r record;
              BEGIN
                  FOR r IN
                      SELECT t.tgname
                        FROM pg_trigger t
                       WHERE t.tgrelid = 'anagrafiche.soggetti'::regclass
                         AND t.tgfoid = 'anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura'::regproc
                         AND NOT t.tgisinternal
                  LOOP
                      EXECUTE format('DROP TRIGGER %I ON anagrafiche.soggetti', r.tgname);
                  END LOOP;
              END
              $via$;
              CREATE CONSTRAINT TRIGGER trg_soggetti_def_guard_forma_giuridica_natura_upd
                  AFTER UPDATE OF tipo_soggetto_dettaglio_id, stato_id ON anagrafiche.soggetti
                  DEFERRABLE INITIALLY DEFERRED
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_guard_forma_giuridica_natura();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: il corpo di prima e' quello di 20261010-98.
              SELECT 1;
