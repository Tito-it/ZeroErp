# Liquibase changelog per Zero ERP
# Ponte catasto_unita_immobiliari <-> indirizzi_dettaglio:
# - Funzione di sync idempotente
# - Trigger su anagrafiche.istanze_utilities
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251215-05-trg_clienti_z10_set_parent_istanza_ins_upd.yaml

  - changeSet:
      id: 20251215-05-trg_clienti_z10_set_parent_istanza_ins_upd.yaml
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE TRIGGER trg_clienti_z10_set_parent_istanza_ins_upd
              BEFORE INSERT OR UPDATE OF pdp_id, data_attivazione
              ON anagrafiche.clienti
              FOR EACH ROW
              WHEN (NEW.pdp_id IS NOT NULL AND NEW.data_attivazione IS NOT NULL)
              EXECUTE FUNCTION anagrafiche.trgfn_clienti_set_parent_istanza();

              COMMENT ON TRIGGER trg_clienti_z10_set_parent_istanza_ins_upd ON anagrafiche.clienti
              IS 'Aggiorna parent_istanza_id su anagrafiche.istanze_utilities
                in base alla catena di clienti per lo stesso PDP,
                escludendo clienti annullati (stato_cliente.codice_interno = ''AN'')
                e clienti senza data_attivazione.';
