# CHI CAMBIA NATURA NON SI PORTA DIETRO TITOLI IVA CHE LA NUOVA NON AMMETTE
#   anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi()
#   trg_soggetti_a10_guard_titoli_iva_ammessi_upd
#     BEFORE UPDATE OF tipo_soggetto_dettaglio_id
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D, §3bis.2, §3bis.3 punti 1-2)
#
# -- LA REGOLA --------------------------------------------------------
#   L'altro lato del guard sui titoli (20261010-92): se il soggetto cambia
#   natura, i suoi titoli VIGENTI devono restare ammessi dalla natura nuova.
#     un titolo vigente non ammesso -> E_TIPO_SOGGETTO_CON_TITOLI_IVA_NON_AMMESSI
#     la natura tolta (NULL) con titoli vigenti -> E_DATO_FISCALE_SENZA_TIPO_SOGGETTO
#   Si esce chiudendo il titolo (valido_al): un titolo con movimenti non si
#   disattiva mai, e il criterio «vigente» lo sa (D-5).
#
# -- LA FORMA ---------------------------------------------------------
#   * ⛔ La lettura dei titoli e' anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto
#     (20261010-91), SECURITY DEFINER: soggetti_titoli_iva ha la RLS per
#     emittente, e da qui un titolo presentato a un altro emittente sarebbe
#     invisibile. Il guard resta INVOKER; esce solo l'id del tipo.
#   * BEFORE UPDATE OF tipo_soggetto_dettaglio_id, confronto OLD/NEW nel corpo
#     (UPDATE OF scatta anche a valore uguale). Nessun altro trigger BEFORE
#     di soggetti scrive la colonna (verificato col -86). Niente INSERT: un
#     soggetto che nasce non ha titoli.
#   * Fase a10, nome «guard_titoli_iva_ammessi»: dopo regime_pa e
#     sesso_policy. Non e' dominio: le regole sono indipendenti.
#   * CONFLITTO_STATO e non DATO_ERRATO: la natura nuova puo' essere giusta,
#     e' il titolo ancora in vigore che non lo consente. Il campo resta la
#     natura, che e' cio' che l'operatore ha toccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261010-93-create-trgfn-soggetti-guard-titoli-iva-ammessi-mctit.yaml

  - changeSet:
      id: 20261010-93-create-trgfn-soggetti-guard-titoli-iva-ammessi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi e trigger
        trg_soggetti_a10_guard_titoli_iva_ammessi_upd (BEFORE UPDATE OF tipo_soggetto_dettaglio_id):
        un soggetto che cambia natura non puo' lasciare titoli IVA vigenti che la natura nuova non
        ammette; la lettura passa dal lettore DEFINER. Codici E_TIPO_SOGGETTO_CON_TITOLI_IVA_NON_AMMESSI,
        E_DATO_FISCALE_SENZA_TIPO_SOGGETTO. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname = 'fn_titolo_iva_non_ammesso_del_soggetto';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                    JOIN pg_catalog.pg_class r ON r.oid = t.tgrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = r.relnamespace
                   WHERE n.nspname = 'anagrafiche' AND r.relname = 'soggetti'
                     AND t.tgname = 'trg_soggetti_a10_guard_titoli_iva_ammessi_upd';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: chi cambia natura non lascia titoli IVA vigenti che la natura
              --   nuova non ammette. L'altro lato di
              --   trgfn_soggetti_titoli_iva_guard_tipo_soggetto.
              -- Aggancio: BEFORE UPDATE OF tipo_soggetto_dettaglio_id; il confronto
              --   OLD/NEW sta qui, perche' UPDATE OF scatta anche a valore uguale.
              -- ⛔ I titoli si leggono da anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto,
              --   SECURITY DEFINER: la RLS per emittente nasconderebbe quelli degli
              --   altri emittenti. Esce solo l'id del tipo.
              -- Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).
              -- =========================================================
              DECLARE
                  v_tipo_id config.tipi_titolo_iva.id%TYPE;
                  v_titolo  config.tipi_titolo_iva.descrizione%TYPE;
                  v_natura  config.tipi_soggetto_dettaglio.descrizione%TYPE;
              BEGIN
                  IF NEW.tipo_soggetto_dettaglio_id IS NOT DISTINCT FROM OLD.tipo_soggetto_dettaglio_id THEN
                      RETURN NEW;
                  END IF;

                  v_tipo_id := anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto(
                                   NEW.id, NEW.tipo_soggetto_dettaglio_id);

                  IF v_tipo_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.tipo_soggetto_dettaglio_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi',
                          'E_DATO_FISCALE_SENZA_TIPO_SOGGETTO',
                          jsonb_build_object('campo',              'tipo_soggetto_dettaglio_id',
                                             'soggetto_id',        NEW.id,
                                             'tipo_titolo_iva_id', v_tipo_id),
                          NEW.tx_id,
                          -- frase chiusa: il VARIADIC si passa vuoto ma ESPLICITO
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  SELECT tt.descrizione INTO v_titolo
                    FROM config.tipi_titolo_iva tt WHERE tt.id = v_tipo_id;
                  SELECT COALESCE(tsd.descrizione, tsd.codice_interno) INTO v_natura
                    FROM config.tipi_soggetto_dettaglio tsd WHERE tsd.id = NEW.tipo_soggetto_dettaglio_id;

                  PERFORM script.fn_log_and_raise_error(
                      'database', 'anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi',
                      'E_TIPO_SOGGETTO_CON_TITOLI_IVA_NON_AMMESSI',
                      jsonb_build_object('campo',                      'tipo_soggetto_dettaglio_id',
                                         'soggetto_id',                NEW.id,
                                         'tipo_soggetto_dettaglio_id', NEW.tipo_soggetto_dettaglio_id,
                                         'tipo_titolo_iva_id',         v_tipo_id),
                      NEW.tx_id,
                      v_natura,
                      COALESCE(v_titolo, v_tipo_id::text));

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi() IS
                  'Guard BEFORE UPDATE OF tipo_soggetto_dettaglio_id su anagrafiche.soggetti: chi cambia natura non lascia titoli IVA VIGENTI che la natura nuova non ammette (E_TIPO_SOGGETTO_CON_TITOLI_IVA_NON_AMMESSI, CONFLITTO_STATO, campo tipo_soggetto_dettaglio_id); natura tolta con titoli vigenti: E_DATO_FISCALE_SENZA_TIPO_SOGGETTO. I titoli si leggono da anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto, SECURITY DEFINER, perche'' la RLS per emittente nasconderebbe quelli degli altri emittenti. Si esce chiudendo il titolo (valido_al). L''altro lato e'' trgfn_soggetti_titoli_iva_guard_tipo_soggetto. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).';

              CREATE TRIGGER trg_soggetti_a10_guard_titoli_iva_ammessi_upd
                  BEFORE UPDATE OF tipo_soggetto_dettaglio_id ON anagrafiche.soggetti
                  FOR EACH ROW
                  EXECUTE FUNCTION anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_soggetti_a10_guard_titoli_iva_ammessi_upd ON anagrafiche.soggetti;
              DROP FUNCTION IF EXISTS anagrafiche.trgfn_soggetti_guard_titoli_iva_ammessi();
