# I DUE LETTORI DEI TITOLI VIGENTI, SOPRA LA RLS
#   anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto(soggetto, natura) -> tipo | NULL
#   anagrafiche.fn_titolo_iva_vigente_su_natura_esiste(tipo, natura)      -> boolean
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D, §3bis.3 punti 1 e 3)
#
# -- ⛔ PERCHE' SECURITY DEFINER -----------------------------------------
#   anagrafiche.soggetti_titoli_iva ha la RLS per emittente
#   (rls_soggetti_titoli_iva_ef_whitelist, 20260829-27). Da SECURITY INVOKER
#   un guard vedrebbe solo i titoli presentati agli emittenti di chi scrive:
#   un operatore dell'emittente A cambierebbe la natura di un soggetto che ha
#   un INTENTO vigente presso l'emittente B, e passerebbe. Stessa forma di
#   anagrafiche.fn_guard_istanza_ha_ba (20261008-55) davanti alla RLS di
#   billing_account.
#   ⭐ Rispondono il MINIMO: un id di tipo (catalogo, visibile a tutti) o un
#   booleano. Nessun protocollo, plafond o emittente esce di qui: chi scrive
#   sa che un titolo esiste, non di chi e'.
#   search_path pg_catalog, public, pg_temp (pg_temp IN CODA, D6-bis,
#   presidio test-security-definer-search-path-v1); nomi tutti qualificati.
#
# -- fn_titolo_iva_non_ammesso_del_soggetto(p_soggetto_id, p_tipo_soggetto_dettaglio_id)
#   Il primo tipo di titolo VIGENTE del soggetto che la natura passata NON
#   ammette, o NULL. La natura si passa (non si legge dal soggetto): il
#   chiamante e' il guard BEFORE UPDATE del cambio di natura, e sulla riga
#   c'e' ancora quella vecchia. Natura NULL: ogni titolo vigente e' non
#   ammesso (A-5/D-1). Ordine: config.tipi_titolo_iva.ordine, poi id — il
#   rifiuto nomina sempre lo stesso tipo.
#
# -- fn_titolo_iva_vigente_su_natura_esiste(p_tipo_titolo_iva_id, p_tipo_soggetto_dettaglio_id)
#   Esiste un titolo VIGENTE di quel tipo su un soggetto di quella natura?
#   Lo chiama il guard del ritiro di una riga di matrice (D-6).
#
#   «Vigente» e «ammesso» sono le due funzioni del 20261010-90: qui non si
#   riscrive nessuna delle due. Oggi = script.fn_giorno_operativo(now()).
#   STABLE, LANGUAGE sql. Parametri NULL: il soggetto NULL non ha titoli
#   (risposta NULL), il tipo o la natura NULL non trovano righe (false).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261010-91-create-fn-titoli-iva-vigenti-lettori-definer-mctit.yaml

  - changeSet:
      id: 20261010-91-create-fn-titoli-iva-vigenti-lettori-definer
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Due lettori SECURITY DEFINER sopra la RLS di anagrafiche.soggetti_titoli_iva:
        fn_titolo_iva_non_ammesso_del_soggetto (primo tipo vigente che la natura passata non ammette)
        e fn_titolo_iva_vigente_su_natura_esiste (titoli vigenti di un tipo su soggetti di una
        natura). Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "2"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname IN ('fn_titolo_iva_ammesso', 'fn_titolo_iva_vigente');
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname IN ('fn_titolo_iva_non_ammesso_del_soggetto',
                                       'fn_titolo_iva_vigente_su_natura_esiste');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto(
                  p_soggetto_id                anagrafiche.soggetti_titoli_iva.soggetto_id%TYPE,
                  p_tipo_soggetto_dettaglio_id anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE
              )
              RETURNS config.tipi_titolo_iva.id%TYPE
              LANGUAGE sql
              STABLE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
                  -- ⚠️ DEFINER: la RLS per emittente nasconderebbe i titoli presentati
                  --   agli altri emittenti. Esce solo l'id del tipo (catalogo).
                  SELECT t.tipo_titolo_iva_id
                    FROM anagrafiche.soggetti_titoli_iva t
                    JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id
                   WHERE t.soggetto_id = p_soggetto_id
                     AND anagrafiche.fn_titolo_iva_vigente(t.attivo, t.valido_al,
                                                           script.fn_giorno_operativo(now()))
                     AND NOT anagrafiche.fn_titolo_iva_ammesso(t.tipo_titolo_iva_id,
                                                               p_tipo_soggetto_dettaglio_id)
                   ORDER BY tt.ordine, tt.id
                   LIMIT 1;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto(uuid, bigint) IS
                  'Il primo tipo di titolo IVA VIGENTE del soggetto che la natura di dettaglio passata NON ammette, o NULL. La natura si passa perche'' il chiamante (il guard del cambio di natura, BEFORE UPDATE) ha ancora quella vecchia sulla riga; natura NULL = ogni titolo vigente e'' non ammesso. SECURITY DEFINER: soggetti_titoli_iva ha la RLS per emittente, e da INVOKER un titolo presentato a un altro emittente sarebbe invisibile. Esce solo l''id del tipo, mai protocollo, plafond o emittente. Vigente e ammesso: anagrafiche.fn_titolo_iva_vigente e fn_titolo_iva_ammesso. Ordine stabile (ordine del tipo, id). Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).';

              CREATE FUNCTION anagrafiche.fn_titolo_iva_vigente_su_natura_esiste(
                  p_tipo_titolo_iva_id         anagrafiche.soggetti_titoli_iva.tipo_titolo_iva_id%TYPE,
                  p_tipo_soggetto_dettaglio_id anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
                  -- ⚠️ DEFINER, come la gemella: risponde solo si'/no.
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.soggetti_titoli_iva t
                        JOIN anagrafiche.soggetti s ON s.id = t.soggetto_id
                       WHERE t.tipo_titolo_iva_id         = p_tipo_titolo_iva_id
                         AND s.tipo_soggetto_dettaglio_id = p_tipo_soggetto_dettaglio_id
                         AND anagrafiche.fn_titolo_iva_vigente(t.attivo, t.valido_al,
                                                               script.fn_giorno_operativo(now()))
                  );
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_titolo_iva_vigente_su_natura_esiste(bigint, bigint) IS
                  'Esiste un titolo IVA VIGENTE del tipo dato su un soggetto della natura data? Lo chiama il guard del ritiro di una riga di config.tipi_titolo_iva_tipi_soggetto_dettaglio (D-6): una riga non si ritira finche'' ci sono titoli vigenti che la usano. SECURITY DEFINER per la RLS per emittente di soggetti_titoli_iva; risponde solo si''/no. Vigente: anagrafiche.fn_titolo_iva_vigente. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_titolo_iva_vigente_su_natura_esiste(bigint, bigint);
              DROP FUNCTION IF EXISTS anagrafiche.fn_titolo_iva_non_ammesso_del_soggetto(uuid, bigint);
