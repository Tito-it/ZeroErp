# M2 — Il RAGGIO N: spostare il gestore globale
#   anagrafiche.fn_guard_ba_gestore_globale_storia(prima, dopo)
#   Piano: brief-db-billing-account-cambio-emittente, M2 (§6.2)
#
# ── ⭐ E' L'UNICA OPERAZIONE CON RAGGIO N ───────────────────────────
#   La riga con billing_account_id IS NULL e is_default = true decide
#   l'emittente di TUTTI i billing account non mappati: cambiarla li sposta in
#   blocco. Una riga sola puo' ri-attribuire retroattivamente l'emittente di un
#   numero arbitrario di documenti.
#   E' il gemello esatto di anagrafiche.fn_guard_albero_ba_gestore_globale, che
#   lo stesso movimento lo presidia gia' per l'omogeneita' dell'albero.
#
# ── ⭐ UN SEMI-JOIN, POI SI DELEGA ──────────────────────────────────
#   Al gemello dell'albero serve VISITARE ogni BA, perche' deve dire QUALE
#   coppia e' mista. Qui la domanda e' «esiste storia», e la risposta e' la
#   stessa dopo il primo che la trova: si cerca il primo (ORDER BY + LIMIT 1,
#   deterministico) e si delega a fn_guard_ba_cambio_emittente, che compone il
#   messaggio nominando un cliente vero invece di dire «da qualche parte».
#
# ⚠️ In pratica questo cancello chiude quasi sempre, ed e' corretto: spostare
#   il gestore globale su un'installazione che ha gia' fatturato vorrebbe dire
#   ri-attribuire retroattivamente l'emittente di tutto cio' che non ha un
#   mapping suo. Non e' una configurazione, e' una riscrittura della storia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260826-48-create-fn-guard-ba-gestore-globale-storia-mctit.yaml

  - changeSet:
      id: 20260826-48-create-fn-guard-ba-gestore-globale-storia
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        M2: il raggio N. La riga senza billing account (is_default) decide l'emittente di TUTTI
        i BA non mappati: cambiarla li sposta in blocco, e una riga sola puo' ri-attribuire
        retroattivamente l'emittente di un numero arbitrario di documenti. E' il gemello di
        anagrafiche.fn_guard_albero_ba_gestore_globale, che lo stesso movimento lo presidia
        gia' per l'omogeneita' dell'albero. ⭐ Un semi-join e non un ciclo: al gemello serve
        visitare ogni BA perche' deve dire QUALE coppia e' mista, qui la domanda e' «esiste
        storia» e la risposta e' la stessa dopo il primo che la trova — si cerca il primo
        (ORDER BY + LIMIT 1, deterministico) e si delega a fn_guard_ba_cambio_emittente, che
        nomina un cliente vero invece di dire «da qualche parte». ⚠️ In pratica chiude quasi
        sempre, ed e' corretto. Piano: brief-db-billing-account-cambio-emittente, M2.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname = 'fn_guard_ba_cambio_emittente'
                     AND p.pronargs = 3;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_guard_ba_gestore_globale_storia(
                  p_emittente_sr_prima anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE,
                  p_emittente_sr_dopo  anagrafiche.emittenti_fiscali_billing_account.emittente_soggetto_ruolo_id%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_ba_id anagrafiche.billing_account.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   ⚠️ E' l'unica operazione del cantiere con RAGGIO N:
                  --   cambiare il gestore globale sposta in blocco l'emittente
                  --   di TUTTI i billing account che non hanno un mapping
                  --   specifico. Una riga sola puo' ri-attribuire
                  --   retroattivamente l'emittente di un numero arbitrario di
                  --   documenti gia' emessi.
                  --
                  -- ⚠️ SECURITY DEFINER: il semi-join legge billing_account,
                  --   fatture e commesse, che hanno tutte la RLS.
                  -- =========================================================
                  IF p_emittente_sr_prima IS NOT DISTINCT FROM p_emittente_sr_dopo THEN
                      RETURN;
                  END IF;

                  -- ⭐ Il PRIMO billing account non mappato che abbia storia.
                  --   Basta lui: la risposta a «esiste storia» non cambia con
                  --   il secondo, e delegargli il messaggio significa nominare
                  --   un cliente vero invece di dire «da qualche parte».
                  -- ⚠️ ORDER BY esplicito: un LIMIT 1 senza non verifica,
                  --   scommette — e qui deciderebbe QUALE cliente compare
                  --   nell'errore.
                  SELECT ba.id
                    INTO v_ba_id
                    FROM anagrafiche.billing_account ba
                   WHERE NOT EXISTS (
                             SELECT 1
                               FROM anagrafiche.emittenti_fiscali_billing_account e
                              WHERE e.billing_account_id = ba.id)
                     AND (
                           EXISTS (SELECT 1 FROM vendite.fatture f
                                    WHERE f.billing_account_id = ba.id)
                        OR EXISTS (SELECT 1 FROM vendite.commesse c
                                    WHERE c.billing_account_id = ba.id)
                         )
                   ORDER BY ba.id
                   LIMIT 1;

                  IF v_ba_id IS NULL THEN
                      RETURN;
                  END IF;

                  -- Il messaggio lo compone il guard del singolo billing
                  -- account: una implementazione, due superfici.
                  PERFORM anagrafiche.fn_guard_ba_cambio_emittente(
                      v_ba_id, p_emittente_sr_prima, p_emittente_sr_dopo);
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_guard_ba_gestore_globale_storia(bigint, bigint)
              IS 'Guard fail-fast per lo spostamento del GESTORE GLOBALE (la riga di anagrafiche.emittenti_fiscali_billing_account con billing_account_id IS NULL e is_default = true), l''unica operazione del cantiere con RAGGIO N: quella riga decide l''emittente di TUTTI i billing account che non hanno un mapping specifico, quindi cambiarla li sposta in blocco e puo'' ri-attribuire retroattivamente l''emittente di un numero arbitrario di documenti gia'' emessi. E'' il gemello esatto di anagrafiche.fn_guard_albero_ba_gestore_globale, che lo stesso movimento lo presidia gia'' per l''omogeneita'' dell''albero. ⭐ Un SEMI-JOIN e non un ciclo, e la differenza col gemello e'' motivata: a quello serve visitare ogni BA perche'' deve dire QUALE coppia e'' mista, qui la domanda e'' «esiste storia» e la risposta non cambia dopo il primo che la trova. Si cerca il primo (ORDER BY ba.id + LIMIT 1, deterministico — un LIMIT 1 senza ORDER BY deciderebbe a caso quale cliente compare nell''errore) e si delega ad anagrafiche.fn_guard_ba_cambio_emittente, che compone il messaggio nominando un cliente vero invece di dire «da qualche parte»: una implementazione, due superfici. ⭐ Esce subito se l''emittente non cambia davvero. ⚠️ SECURITY DEFINER: il semi-join legge billing_account, fatture e commesse, che hanno tutte la RLS. ⚠️ In pratica questo cancello chiude quasi sempre, ed e'' corretto: spostare il gestore globale su un''installazione che ha gia'' fatturato non e'' una configurazione, e'' una riscrittura della storia. Piano: brief-db-billing-account-cambio-emittente, M2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_guard_ba_gestore_globale_storia(bigint, bigint);
