# anagrafiche.fn_sync_auth_user_expired: LA VESTE CONTA SE E' UTILIZZABILE OGGI
#   Brief: brief-db-veste-utilizzabile (building block: 20261007-01)
#
#   Il batch notturno sceglieva i candidati con identita_digitali.valido_al: con
#   D-2 l'operatore umano scade anche col suo rapporto, e quel candidato il batch
#   non lo avrebbe proposto mai. Ora: credenziali accese che hanno vesti ma
#   nessuna utilizzabile oggi (la stessa regola che decide nel sync). Una
#   credenziale senza vesti resta fuori, com'era. Ritorna sempre il numero di
#   credenziali spente.
#
#   Corpo vivo = pg_get_functiondef su dbdev il 2026-10-07 (uguale alla doc
#   auto-gen); sostituzioni contate. Firma, RETURNS, DECLARE e firma del
#   COMMENT ancorati a %TYPE dove c'e' una colonna dietro; dove non c'e', il
#   tipo esplicito porta il perche' accanto. I %TYPE si risolvono negli STESSI
#   tipi di oggi (provato: nessun overload), quindi i chiamanti (comprese le
#   BEGIN ATOMIC) restano validi. Il rollback e' il corpo vivo di prima, con la
#   stessa firma ancorata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261007-09-update-fn-sync-auth-user-expired-veste-utilizzabile-mctit.yaml

  - changeSet:
      id: 20261007-09-update-fn-sync-auth-user-expired-veste-utilizzabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_sync_auth_user_expired: candidati = credenziali accese senza vesti utilizzabili oggi (script.fn_veste_utilizzabile). Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'anagrafiche' AND p.proname = 'fn_sync_auth_user_expired';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_sync_auth_user_expired()
               RETURNS integer  -- un CONTEGGIO di credenziali spente: nessuna colonna dietro
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Variabili locali tipizzate %TYPE (policy ZeroErp).
                  v_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_modified     boolean;        -- esito di fn_sync_auth_user_is_active: nessuna colonna dietro
                  v_count        integer := 0;   -- un conteggio
              BEGIN
                  -- ------------------------------------------------------------
                  -- Funzione: anagrafiche.fn_sync_auth_user_expired (v4, 07-10-2026)
                  -- Scopo:
                  --   Batch di disattivazione overnight: spegne la credenziale
                  --   (auth_user.is_active) che non ha piu' NESSUNA veste
                  --   utilizzabile oggi, perche' il tempo e' passato e nessuno ha
                  --   scritto niente (una data di fine superata non fa scattare
                  --   trigger).
                  --   ⭐ v4 (brief-db-veste-utilizzabile): i candidati si scelgono
                  --   con script.fn_veste_utilizzabile, la stessa regola che poi
                  --   decide in fn_sync_auth_user_is_active. Prima il batch
                  --   guardava solo identita_digitali.valido_al: con D-2 l'operatore
                  --   umano scade anche col suo rapporto (risorse_umane.valido_al),
                  --   e quel candidato il batch non lo avrebbe proposto mai.
                  --   ⛔ Il «ramo legacy» (risorse_umane.valido_al via la vista
                  --   risorse_umane_auth_user) e' caduto: la regola vive in
                  --   identita_digitali.valido_al (decisione Tid 12-09-2026), e
                  --   fn_sync_auth_user_is_active decide comunque SOLO sull'identita'
                  --   — quel ramo poteva proporre candidati, mai cambiare l'esito.
                  --
                  --   Uso: pgAgent daily job + management command Django.
                  --
                  -- Ritorna: numero di utenti effettivamente disattivati.
                  -- ------------------------------------------------------------

                  -- Short-circuit CI: se lo schema django non esiste, no-op.
                  IF to_regclass('django.auth_user') IS NULL THEN
                      RETURN 0;
                  END IF;

                  -- Loop sui candidati: auth_user ancora is_active=true che ha
                  -- delle vesti ma nessuna utilizzabile oggi. Una credenziale
                  -- senza vesti non e' affare di questo batch.
                  FOR v_auth_user_id IN
                      EXECUTE '
                          SELECT au.id
                            FROM django.auth_user au
                           WHERE au.is_active = true
                             AND EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.identita_digitali id
                                      WHERE id.auth_user_id = au.id)
                             AND NOT EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.identita_digitali id
                                      WHERE id.auth_user_id = au.id
                                        AND script.fn_veste_utilizzabile(id.id))
                      '
                  LOOP
                      -- Invoca la nuova firma sync per ciascun candidato.
                      -- La funzione sync applica la logica di fail-closed
                      -- (fuori finestra -> false); qui contiamo solo quelli
                      -- realmente modificati (v_modified = true).
                      SELECT anagrafiche.fn_sync_auth_user_is_active(v_auth_user_id)
                        INTO v_modified;

                      IF v_modified THEN
                          v_count := v_count + 1;
                      END IF;
                  END LOOP;

                  RETURN v_count;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.fn_sync_auth_user_expired() IS 'Batch: disattiva auth_user per finestra temporale scaduta su identita_digitali.valido_al (tutte le vesti). Dal 12-09-2026 senza il ramo legacy via risorse_umane_auth_user: la regola vive in identita_digitali e fn_sync_auth_user_is_active decide solo li''. Invocata da pgAgent daily e management command Django. Ritorna il numero di utenti disattivati. Rev 2026-10-07 (brief-db-veste-utilizzabile): i candidati sono le credenziali attive che hanno vesti ma nessuna utilizzabile oggi secondo script.fn_veste_utilizzabile (la stessa regola di fn_sync_auth_user_is_active): cosi'''' scade anche l''''operatore umano il cui rapporto e'''' finito.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_sync_auth_user_expired()
               RETURNS integer  -- un CONTEGGIO di credenziali spente: nessuna colonna dietro
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Variabili locali tipizzate %TYPE (policy ZeroErp).
                  v_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE;
                  v_modified     boolean;        -- esito di fn_sync_auth_user_is_active: nessuna colonna dietro
                  v_count        integer := 0;   -- un conteggio
              BEGIN
                  -- ------------------------------------------------------------
                  -- Funzione: anagrafiche.fn_sync_auth_user_expired (v3, 12-09-2026)
                  -- Scopo:
                  --   Batch di disattivazione overnight per utenti con finestra
                  --   temporale scaduta: identita_digitali.valido_al < CURRENT_DATE,
                  --   per tutte le vesti.
                  --   ⛔ Il «ramo legacy» (risorse_umane.valido_al via la vista
                  --   risorse_umane_auth_user) e' caduto: la regola vive in
                  --   identita_digitali.valido_al (decisione Tid 12-09-2026), e
                  --   fn_sync_auth_user_is_active decide comunque SOLO sull'identita'
                  --   — quel ramo poteva proporre candidati, mai cambiare l'esito.
                  --
                  --   Uso: pgAgent daily job + management command Django.
                  --
                  -- Ritorna: numero di utenti effettivamente disattivati.
                  -- ------------------------------------------------------------

                  -- Short-circuit CI: se lo schema django non esiste, no-op.
                  IF to_regclass('django.auth_user') IS NULL THEN
                      RETURN 0;
                  END IF;

                  -- Loop sui candidati: auth_user ancora is_active=true con almeno
                  -- un'identita' digitale attiva a finestra scaduta (operatori,
                  -- portale, fornitore, shop, api client).
                  FOR v_auth_user_id IN
                      EXECUTE '
                          SELECT DISTINCT id.auth_user_id
                            FROM anagrafiche.identita_digitali id
                            JOIN django.auth_user au
                              ON au.id = id.auth_user_id
                           WHERE id.attivo = true
                             AND id.valido_al IS NOT NULL
                             AND id.valido_al < CURRENT_DATE
                             AND au.is_active = true
                      '
                  LOOP
                      -- Invoca la nuova firma sync per ciascun candidato.
                      -- La funzione sync applica la logica di fail-closed
                      -- (fuori finestra -> false); qui contiamo solo quelli
                      -- realmente modificati (v_modified = true).
                      SELECT anagrafiche.fn_sync_auth_user_is_active(v_auth_user_id)
                        INTO v_modified;

                      IF v_modified THEN
                          v_count := v_count + 1;
                      END IF;
                  END LOOP;

                  RETURN v_count;
              END;
              $function$
              ;

              COMMENT ON FUNCTION anagrafiche.fn_sync_auth_user_expired() IS 'Batch: disattiva auth_user per finestra temporale scaduta su identita_digitali.valido_al (tutte le vesti). Dal 12-09-2026 senza il ramo legacy via risorse_umane_auth_user: la regola vive in identita_digitali e fn_sync_auth_user_is_active decide solo li''. Invocata da pgAgent daily e management command Django. Ritorna il numero di utenti disattivati.';
