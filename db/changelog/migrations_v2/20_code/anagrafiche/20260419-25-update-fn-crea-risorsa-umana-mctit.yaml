databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260419-25-update-fn-crea-risorsa-umana-mctit.yaml

  - changeSet:
      id: 20260419-25-update-fn-crea-risorsa-umana
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Refactor anagrafiche.fn_crea_risorsa_umana (§4.6.D.3 WIP).
        Durante la transizione expand-align-contract la funzione continua
        a fare INSERT SOLO sul bridge legacy risorse_umane_auth_user;
        la propagazione a identita_digitali OPERATORE (+ eventuale
        binding SUPER_ADMIN se ruolo_sistema='ADMIN') avviene
        automaticamente via trigger-ponte §4.6.D.4
        (trgfn_risorse_umane_auth_user_sync_identita).

        Questo approccio evita la collisione UNIQUE su
        uq_identita_digitali_auth_user che si avrebbe con doppio INSERT
        esplicito + trigger-ponte. Al cutover §4.6.H (rimozione
        trigger-ponte) questa funzione verra' aggiornata per fare
        INSERT diretto su identita_digitali.

        Firma esterna invariata: i chiamanti (fn_crea_operatore,
        amm_software_repository) non cambiano.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: anagrafiche
            tableName: identita_digitali
        # NOTA: il trigger-ponte §4.6.D.4
        # (trgfn_risorse_umane_auth_user_sync_identita) viene creato dal
        # file 20260419-26, processato DOPO questo file nell'ordine
        # alfabetico di 20_code/anagrafiche/. La dipendenza e' solo
        # semantica a runtime (quando la funzione viene chiamata da
        # backend/test, il trigger e' gia' installato), non all'apply
        # time. Per questo non aggiungiamo un sqlCheck sul trigger qui.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_risorsa_umana(
                  p_soggetto_id              anagrafiche.soggetti.id%TYPE               DEFAULT NULL,
                  p_qualifica_id             config.qualifiche.id%TYPE                  DEFAULT NULL,
                  p_unita_organizzativa_id   config.unita_organizzative.id%TYPE         DEFAULT NULL,
                  p_valido_dal               anagrafiche.risorse_umane.valido_dal%TYPE  DEFAULT CURRENT_DATE,
                  p_valido_al                anagrafiche.risorse_umane.valido_al%TYPE   DEFAULT NULL,
                  p_auth_user_id             integer                                    DEFAULT NULL,
                  p_ruolo_sistema            config.ruolo_sistema                       DEFAULT 'OPERATIVO'::config.ruolo_sistema
              )
              RETURNS anagrafiche.risorse_umane.id%TYPE
              LANGUAGE plpgsql
              VOLATILE
              AS $function$
              DECLARE
                  v_sr_id  anagrafiche.soggetti_ruoli.id%TYPE;
                  v_ru_id  anagrafiche.risorse_umane.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo (refactor §4.6.D.3):
                  --   Crea risorsa_umana + bridge legacy RUA. Il trigger
                  --   trgfn_risorse_umane_auth_user_sync_identita (§4.6.D.4)
                  --   scatta AFTER INSERT su RUA e propaga a
                  --   identita_digitali OPERATORE + binding SUPER_ADMIN
                  --   (se ruolo_sistema='ADMIN'). Al cutover §4.6.H la
                  --   propagazione verra' fatta direttamente qui.
                  --
                  -- Parametri (invariati): vedi COMMENT.
                  -- =========================================================

                  -- Validazione parametri obbligatori
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_soggetto_id'),
                          NULL::uuid, 'Soggetto obbligatorio.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- Guard prerequisiti
                  IF NOT EXISTS (
                      SELECT 1 FROM config.qualifiche
                       WHERE id = p_qualifica_id AND attivo = true
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('qualifica_id', p_qualifica_id),
                          NULL::uuid, 'Qualifica non trovata o non attiva.'
                      );
                  END IF;

                  IF p_unita_organizzativa_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM config.unita_organizzative
                           WHERE id = p_unita_organizzativa_id AND attivo = true
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana',
                              'E_ADMIN_UO_NON_TROVATA',
                              jsonb_build_object('unita_organizzativa_id', p_unita_organizzativa_id),
                              NULL::uuid,
                              'Unita'' organizzativa non trovata o non attiva.'
                          );
                      END IF;
                  END IF;

                  IF p_auth_user_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM django.auth_user WHERE id = p_auth_user_id
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('auth_user_id', p_auth_user_id),
                              NULL::uuid, 'auth_user non trovato.'
                          );
                      END IF;
                  END IF;

                  -- Step 1: soggetto_ruolo RIS_UMANA
                  SELECT script.fn_get_or_create_soggetto_ruolo(
                      p_soggetto_id, 'RIS_UMANA'
                  ) INTO v_sr_id;

                  -- Step 2: risorsa umana
                  INSERT INTO anagrafiche.risorse_umane (
                      soggetto_ruolo_id, soggetto_id, qualifica_id,
                      unita_organizzativa_id, valido_dal, valido_al, attivo
                  )
                  VALUES (
                      v_sr_id, p_soggetto_id, p_qualifica_id,
                      p_unita_organizzativa_id, p_valido_dal, p_valido_al, true
                  )
                  RETURNING id INTO v_ru_id;

                  -- Step 3: Bridge legacy RUA. Il trigger-ponte §4.6.D.4
                  -- (trgfn_risorse_umane_auth_user_sync_identita) propaga
                  -- AFTER INSERT su identita_digitali OPERATORE (UPSERT)
                  -- e crea il binding SUPER_ADMIN se p_ruolo_sistema='ADMIN'.
                  -- NOTA: questo evita la collisione UNIQUE
                  -- uq_identita_digitali_auth_user che si avrebbe con
                  -- doppio INSERT esplicito + trigger-ponte.
                  IF p_auth_user_id IS NOT NULL THEN
                      INSERT INTO anagrafiche.risorse_umane_auth_user (
                          risorsa_umana_id, auth_user_id, ruolo_sistema, attivo
                      )
                      VALUES (v_ru_id, p_auth_user_id, p_ruolo_sistema, true);
                  END IF;

                  RETURN v_ru_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_risorsa_umana(uuid, integer, integer, date, date, integer, config.ruolo_sistema) IS
                  'Building block: crea risorsa_umana + bridge legacy RUA. '
                  'Refactor §4.6.D.3: la propagazione a identita_digitali + '
                  'binding SUPER_ADMIN avviene via trigger-ponte §4.6.D.4. '
                  'Firma esterna invariata. Al cutover §4.6.H la funzione '
                  'tornera'' a scrivere direttamente su identita_digitali.';
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_crea_risorsa_umana(
                  uuid, integer, integer, date, date, integer, config.ruolo_sistema
              );
