databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260419-90-update-fn-crea-risorsa-umana-post-cutover-mctit.yaml

  - changeSet:
      id: 20260419-90-update-fn-crea-risorsa-umana-post-cutover
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Cutover §13.3 WIP multi-face-auth (pre-step): aggiorna
        fn_crea_risorsa_umana per scrivere DIRETTAMENTE su
        identita_digitali + eventuale binding SUPER_ADMIN, senza
        passare dal bridge legacy risorse_umane_auth_user.
        Questa migration va applicata PRIMA del drop del
        trigger-ponte (§13.3.3 / migration -91): dopo la promozione
        della vista, qualsiasi INSERT su RUA (ora vista) fallirebbe.
        Firma esterna invariata: fn_crea_operatore e
        amm_software_repository non cambiano; il parametro
        p_ruolo_sistema mantiene la semantica "ADMIN = binding
        SUPER_ADMIN, altri = nessun binding".
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: anagrafiche, tableName: identita_digitali }
          - tableExists: { schemaName: config,      tableName: profili_accesso_bindings }
        # Nota: il check di esistenza del profilo SUPER_ADMIN (id 9100) e'
        # stato rimosso perche' strutturalmente non soddisfabile: le
        # migration 20_code vengono applicate prima di 80_data dove sta il
        # seed (20260419-04-seed-profilo-super-admin). CREATE OR REPLACE
        # FUNCTION non risolve i riferimenti nel body, quindi il profilo
        # serve solo a runtime, garantito dall'ordine master-v2 (80_data
        # applicato prima della prima invocazione effettiva).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION anagrafiche.fn_crea_risorsa_umana(
                  p_soggetto_id              anagrafiche.soggetti.id%TYPE               DEFAULT NULL,
                  p_qualifica_id             config.qualifiche.id%TYPE                  DEFAULT NULL,
                  p_unita_organizzativa_id   config.unita_organizzative.id%TYPE         DEFAULT NULL,
                  p_valido_dal               anagrafiche.risorse_umane.valido_dal%TYPE  DEFAULT CURRENT_DATE,
                  p_valido_al                anagrafiche.risorse_umane.valido_al%TYPE   DEFAULT NULL,
                  p_auth_user_id             integer                                    DEFAULT NULL,
                  p_ruolo_sistema            config.ruolo_sistema                       DEFAULT 'OPERATIVO'::config.ruolo_sistema
              )
              RETURNS anagrafiche.risorse_umane.id%TYPE
              LANGUAGE plpgsql
              VOLATILE
              AS $function$
              DECLARE
                  v_sr_id        anagrafiche.soggetti_ruoli.id%TYPE;
                  v_ru_id        anagrafiche.risorse_umane.id%TYPE;
                  v_identita_id  anagrafiche.identita_digitali.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo (post-cutover §13.3 WIP):
                  --   Crea risorsa_umana + identita_digitali OPERATORE
                  --   (+ binding SUPER_ADMIN se p_ruolo_sistema = 'ADMIN').
                  --   Nessun INSERT su risorse_umane_auth_user: ora e' una
                  --   vista read-only (rename §13.3.2).
                  -- =========================================================

                  -- Validazione parametri obbligatori
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_soggetto_id'),
                          NULL::uuid, 'Soggetto obbligatorio.'
                      );
                  END IF;

                  IF p_qualifica_id IS NULL OR p_qualifica_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_qualifica_id'),
                          NULL::uuid, 'Qualifica obbligatoria.'
                      );
                  END IF;

                  -- Guard prerequisiti
                  IF NOT EXISTS (
                      SELECT 1 FROM config.qualifiche
                       WHERE id = p_qualifica_id AND attivo = true
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'anagrafiche.fn_crea_risorsa_umana',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('qualifica_id', p_qualifica_id),
                          NULL::uuid, 'Qualifica non trovata o non attiva.'
                      );
                  END IF;

                  IF p_unita_organizzativa_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM config.unita_organizzative
                           WHERE id = p_unita_organizzativa_id AND attivo = true
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana',
                              'E_ADMIN_UO_NON_TROVATA',
                              jsonb_build_object('unita_organizzativa_id', p_unita_organizzativa_id),
                              NULL::uuid,
                              'Unita'' organizzativa non trovata o non attiva.'
                          );
                      END IF;
                  END IF;

                  IF p_auth_user_id IS NOT NULL THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM django.auth_user WHERE id = p_auth_user_id
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'anagrafiche.fn_crea_risorsa_umana',
                              'E_ADMIN_VALIDAZIONE',
                              jsonb_build_object('auth_user_id', p_auth_user_id),
                              NULL::uuid, 'auth_user non trovato.'
                          );
                      END IF;
                  END IF;

                  -- Step 1: soggetto_ruolo RIS_UMANA
                  SELECT script.fn_get_or_create_soggetto_ruolo(
                      p_soggetto_id, 'RIS_UMANA'
                  ) INTO v_sr_id;

                  -- Step 2: risorsa umana
                  INSERT INTO anagrafiche.risorse_umane (
                      soggetto_ruolo_id, soggetto_id, qualifica_id,
                      unita_organizzativa_id, valido_dal, valido_al, attivo
                  )
                  VALUES (
                      v_sr_id, p_soggetto_id, p_qualifica_id,
                      p_unita_organizzativa_id, p_valido_dal, p_valido_al, true
                  )
                  RETURNING id INTO v_ru_id;

                  -- Step 3: identita_digitali OPERATORE (scrittura diretta).
                  -- Nessun trigger-ponte: post-cutover §13.3 la propagazione
                  -- e' esplicita qui. La firma esterna ricevuta dal caller
                  -- (ruolo_sistema) non ha piu' un contenitore legacy dove
                  -- persisterla: viene decomposta in (a) OPERATORE sempre,
                  -- (b) binding SUPER_ADMIN se p_ruolo_sistema='ADMIN'.
                  IF p_auth_user_id IS NOT NULL THEN
                      INSERT INTO anagrafiche.identita_digitali (
                          soggetto_ruolo_id,
                          auth_user_id,
                          ruolo_applicativo,
                          attivo,
                          valido_dal,
                          valido_al
                      )
                      VALUES (
                          v_sr_id,
                          p_auth_user_id,
                          'OPERATORE'::config.ruolo_applicativo,
                          true,
                          COALESCE(p_valido_dal, CURRENT_DATE),
                          p_valido_al
                      )
                      RETURNING id INTO v_identita_id;

                      -- Step 4: binding SUPER_ADMIN se ruolo ADMIN legacy.
                      IF p_ruolo_sistema = 'ADMIN'::config.ruolo_sistema THEN
                          INSERT INTO config.profili_accesso_bindings (
                              profilo_accesso_id,
                              identita_digitale_id,
                              attivo
                          )
                          VALUES (
                              9100,
                              v_identita_id,
                              true
                          );
                      END IF;
                  END IF;

                  RETURN v_ru_id;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_crea_risorsa_umana(
                  uuid, integer, integer, date, date, integer, config.ruolo_sistema
              ) IS
                  'Building block (post-cutover §13.3): crea risorsa_umana + '
                  'identita_digitali OPERATORE + (se p_ruolo_sistema=''ADMIN'') '
                  'binding SUPER_ADMIN. Nessuna scrittura su '
                  'risorse_umane_auth_user (ora vista read-only). Firma '
                  'esterna invariata rispetto alle versioni pre-cutover.';
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_crea_risorsa_umana(
                  uuid, integer, integer, date, date, integer, config.ruolo_sistema
              );
