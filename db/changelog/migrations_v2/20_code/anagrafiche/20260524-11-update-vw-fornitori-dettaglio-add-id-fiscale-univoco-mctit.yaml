# Aggiunge id_fiscale_univoco_cf_piva alla vista vw_fornitori_dettaglio.
#
# Why: prerequisito per il seed DEF-8 fornitori (ui.lista_colonna
# codice='id_fiscale', campo_sorgente='id_fiscale_univoco_cf_piva').
# Il trigger B2 (trgfn_ui_lista_colonna_a10_valida_campo_sorgente)
# valida campo_sorgente contro pg_catalog.pg_attribute della view:
# senza questa colonna il seed fallirebbe con E_UI_CAMPO_SORGENTE_NON_TROVATO.
#
# La colonna e' GENERATED ALWAYS su anagrafiche.soggetti (COALESCE CF/PIVA).
# Il JOIN su soggetti s e' gia' presente nella vista — aggiunta al SELECT.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20260524-11-update-vw-fornitori-dettaglio-add-id-fiscale-univoco-mctit.yaml

  - changeSet:
      id: 20260524-11-update-vw-fornitori-dettaglio-add-id-fiscale-univoco
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Aggiunge s.id_fiscale_univoco_cf_piva al SELECT di vw_fornitori_dettaglio.
        Prerequisito seed DEF-8 fornitori (campo_sorgente validato da trigger B2).

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- Vista: anagrafiche.vw_fornitori_dettaglio
              --
              -- Scopo: dettaglio fornitore con dati soggetto, stato,
              --        valuta, modalita' e termine pagamento.
              --
              -- Aggiornamento 20260524: aggiunta id_fiscale_univoco_cf_piva
              -- (colonna GENERATED ALWAYS su anagrafiche.soggetti,
              --  COALESCE codice_fiscale / partita_iva).
              -- ==========================================================
              CREATE OR REPLACE VIEW anagrafiche.vw_fornitori_dettaglio AS
              SELECT f.id,
                  f.uid,
                  f.codice,
                  f.attivo,
                  f.soggetto_ruolo_id,
                  f.stato_fornitore_id,
                  sf.codice_interno AS stato_codice,
                  sf.descrizione AS stato_descrizione,
                  sf.descrizione_breve AS stato_descrizione_breve,
                  sf.blocca_ordini,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.codice_fiscale,
                  s.partita_iva,
                  f.valuta_id,
                  v.iso_code AS valuta_iso,
                  f.modalita_pagamento_id,
                  mp.codice AS modalita_pagamento_codice,
                  mp.descrizione AS modalita_pagamento_desc,
                  f.termine_pagamento_id,
                  tp.codice AS termine_pagamento_codice,
                  f.giorni_pagamento,
                  f.fine_mese,
                  f.split_payment,
                  f.ritenuta_acconto,
                  f.ritenuta_aliquota,
                  f.regime_fiscale,
                  f.bollo_esente,
                  f.canale_fe,
                  f.pec_email,
                  f.rating,
                  f.qualifica_scadenza,
                  f.data_insert,
                  f.data_update,
                  s.id_fiscale_univoco_cf_piva
              FROM anagrafiche.fornitori f
                JOIN anagrafiche.soggetti_ruoli sr ON sr.id = f.soggetto_ruolo_id
                JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                LEFT JOIN config.stati_fornitore sf ON sf.id = f.stato_fornitore_id
                LEFT JOIN config.valute v ON v.id = f.valuta_id
                LEFT JOIN config.modalita_pagamento mp ON mp.id = f.modalita_pagamento_id
                LEFT JOIN config.termini_pagamento tp ON tp.id = f.termine_pagamento_id;

              COMMENT ON VIEW anagrafiche.vw_fornitori_dettaglio IS
                'Dettaglio fornitore con soggetto, stato, valuta, modalita'' e termine pagamento. Include id_fiscale_univoco_cf_piva per lista configurabile DEF-8.';
