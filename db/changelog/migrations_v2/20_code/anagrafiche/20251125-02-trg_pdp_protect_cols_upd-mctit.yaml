databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/anagrafiche/20251125-02-trg_pdp_protect_cols_upd-mctit.yaml

    - changeSet:
          id: 20251125-02-trg_pdp_protect_cols_upd
          author: mctit
          comment: "Ripristino trigger dopo refactoring degli ID in anagrafiche."
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        CREATE OR REPLACE TRIGGER trg_pdp_protect_cols_upd
                            BEFORE UPDATE OF pdp, indirizzo_dettaglio_id
                            ON anagrafiche.pdp
                            FOR EACH ROW
                            EXECUTE FUNCTION anagrafiche.trgfn_pdp_protect_cols();
