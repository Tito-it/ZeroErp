# LA COPIA DI UN INDIRIZZO DEL RUOLO VA SULLA CHIAVE DI DESTINAZIONE
#   anagrafiche.fn_copia_indirizzo_ruolo(ruolo, indirizzo, tipi[], istanza di destinazione) -> bigint[]
#   Brief: brief-db-copia-indirizzo-destinazione §4, §4.1 (D-1, D-3, D-4), giro 1.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────
#   * La riga nuova va sulla chiave che il chiamante indica (D-1): il ruolo
#     (p_istanza_utility_id_destinazione NULL) o una sua istanza, non piu' la
#     chiave della sorgente. La sorgente resta «del ruolo», in qualunque sua
#     chiave (E_INDIRIZZO_RUOLO_NON_TROVATO).
#   * Parametro in coda, OBBLIGATORIO e senza DEFAULT (D-3, §5f): il
#     comportamento di prima (la chiave della sorgente) e' il difetto. La firma
#     a tre argomenti si ritira: DROP + CREATE. Costo dichiarato: l'unico
#     chiamante e' il backend (soggetti_repository), che passa alla firma nuova
#     con R-1; fino ad allora la copia del ruolo risponde «funzione inesistente».
#   * Il motivo di riga «nessun tipo proponibile» non si solleva piu' (D-4 a):
#     dipendeva dalla chiave della sorgente, e sulla destinazione lo dice il
#     picker anagrafiche.fn_tipi_indirizzo_proponibili_ruolo(ruolo, istanza).
#     Se la destinazione non ammette il tipo chiesto, la singolare solleva il
#     motivo preciso di quel tipo. anagrafiche.fn_check_copia_indirizzo_ruolo
#     e la sua vista si ritirano nel -32.
#   * L'istanza di destinazione non ha un controllo suo: un'istanza e' del
#     soggetto, e «del soggetto del ruolo» lo giudica il guard della tabella
#     (E_ISTANZA_ALTRO_SOGGETTO) attraverso la singolare (§4.1 A).
#   * La scrittura e' del BB anagrafiche.fn_crea_copie_indirizzo_ruolo (-29).
#
# ── FORMA ───────────────────────────────────────────────────────
#   Corpo dalla doc auto-generata (identico al -38 del 2026-11-15); testata
#   ancorata dal -38, col parametro nuovo ancorato a indirizzi.istanza_utility_id.
#   Il rollback ricrea la firma a tre argomenti col corpo del -38.
#   SECURITY INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/anagrafiche/20261117-30-update-fn-copia-indirizzo-ruolo-con-la-destinazione-mctit.yaml

  - changeSet:
      id: 20261117-30-update-fn-copia-indirizzo-ruolo-con-la-destinazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        La copia di un indirizzo del ruolo va sulla chiave di destinazione (il ruolo o una sua istanza), parametro obbligatorio; ritirata la firma a tre argomenti.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_copia_indirizzo_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE, anagrafiche.indirizzi.id%TYPE, text[]);

              CREATE FUNCTION anagrafiche.fn_copia_indirizzo_ruolo(
                  p_soggetto_ruolo_id                anagrafiche.soggetti_ruoli.id%TYPE,
                  p_indirizzo_id                     anagrafiche.indirizzi.id%TYPE,
                  p_tipi_indirizzo_codice_interno    text[],  -- array: %TYPE[] non esiste
                  p_istanza_utility_id_destinazione  anagrafiche.indirizzi.istanza_utility_id%TYPE)
              RETURNS bigint[]  -- gli id delle righe nuove: array, %TYPE[] non esiste
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              DECLARE
                  c_chi    CONSTANT text := 'anagrafiche.fn_copia_indirizzo_ruolo';
                  v_src    record;  -- la riga sorgente, da una SELECT statica
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Copiare un indirizzo del ruolo, da qualunque sua chiave,
                  --   in uno o piu' tipi sulla chiave di destinazione: il ruolo
                  --   (istanza NULL) o una sua istanza. Ritorna gli id nuovi,
                  --   nell'ordine dei tipi. Tutto o niente.
                  --
                  -- Regole:
                  --   - la sorgente dev'essere del ruolo;
                  --   - il tipo lo giudica la singolare sulla destinazione;
                  --     l'istanza di un altro soggetto la rifiuta il guard.
                  -- =========================================================
                  IF NOT EXISTS (SELECT 1 FROM anagrafiche.soggetti_ruoli sr
                                  WHERE sr.id = p_soggetto_ruolo_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SOGGETTO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          NULL::uuid,
                          COALESCE(p_soggetto_ruolo_id::text, '-'));
                  END IF;
                  IF p_indirizzo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_indirizzo_id'),
                          NULL::uuid,
                          c_chi,
                          'manca l''indirizzo da copiare');
                  END IF;
                  IF COALESCE(cardinality(p_tipi_indirizzo_codice_interno), 0) = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_tipi_indirizzo_codice_interno'),
                          NULL::uuid,
                          c_chi,
                          'manca il tipo di destinazione');
                  END IF;

                  -- 1. La sorgente, di quel ruolo, in qualunque sua chiave.
                  SELECT i.indirizzo_dettaglio_id, i.indirizzo_libero, i.stato_id,
                         i.comune_id, i.codice_postale_id, i.administrative_area,
                         i.locality, i.sublocality, i.postal_code
                    INTO v_src
                    FROM anagrafiche.indirizzi i
                   WHERE i.id = p_indirizzo_id
                     AND i.soggetto_ruolo_id = p_soggetto_ruolo_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_INDIRIZZO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id,
                                             'indirizzo_id', p_indirizzo_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Una riga per tipo sulla chiave di destinazione, dal BB.
                  RETURN anagrafiche.fn_crea_copie_indirizzo_ruolo(
                             p_soggetto_ruolo_id,
                             anagrafiche.fn_indirizzo_elemento_da_riga(
                                 v_src.indirizzo_dettaglio_id, v_src.indirizzo_libero, v_src.stato_id,
                                 v_src.comune_id, v_src.codice_postale_id, v_src.administrative_area,
                                 v_src.locality, v_src.sublocality, v_src.postal_code),
                             p_istanza_utility_id_destinazione,
                             p_tipi_indirizzo_codice_interno);
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_copia_indirizzo_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE, anagrafiche.indirizzi.id%TYPE, text[],
                  anagrafiche.indirizzi.istanza_utility_id%TYPE)
              IS 'Verbo: copia un indirizzo del ruolo, da qualunque sua chiave (il ruolo o una sua istanza), in uno o piu'' tipi (codici interni, nell''ordine dato) sulla chiave di destinazione indicata: il ruolo (p_istanza_utility_id_destinazione NULL, obbligatorio e senza default) o una sua istanza. Tutto o niente; ritorna gli id delle righe nuove nello stesso ordine. Ruolo inesistente E_SOGGETTO_RUOLO_NON_TROVATO; la sorgente dev''essere del ruolo (E_INDIRIZZO_RUOLO_NON_TROVATO); indirizzo o elenco mancanti o vuoti E_SCRIPT_CHIAMATA_NON_VALIDA. Le righe le scrive il building block anagrafiche.fn_crea_copie_indirizzo_ruolo con l''elemento di anagrafiche.fn_indirizzo_elemento_da_riga: il tipo lo giudica la singolare anagrafiche.fn_crea_indirizzo_ruolo sulla chiave di destinazione (E_TIPO_INDIRIZZO_NON_TROVATO, E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE anche per un tipo ripetuto, E_TIPO_INDIRIZZO_NON_PERMESSO, E_TIPO_INDIRIZZO_TIPO_SOGGETTO_NON_PERMESSO), l''istanza di un altro soggetto il guard della tabella (E_ISTANZA_ALTRO_SOGGETTO). I tipi proponibili sulla destinazione li dice anagrafiche.fn_tipi_indirizzo_proponibili_ruolo(ruolo, istanza). Il permesso lo controlla il backend. SECURITY INVOKER. Gemello di anagrafiche.fn_copia_indirizzo_soggetto_su_ruolo, che copia sul ruolo una riga del soggetto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS anagrafiche.fn_copia_indirizzo_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE, anagrafiche.indirizzi.id%TYPE, text[],
                  anagrafiche.indirizzi.istanza_utility_id%TYPE);

              CREATE OR REPLACE FUNCTION anagrafiche.fn_copia_indirizzo_ruolo(
                  p_soggetto_ruolo_id            anagrafiche.soggetti_ruoli.id%TYPE,
                  p_indirizzo_id                 anagrafiche.indirizzi.id%TYPE,
                  p_tipi_indirizzo_codice_interno text[])  -- array: %TYPE[] non esiste
              RETURNS bigint[]  -- gli id delle righe nuove: array, %TYPE[] non esiste
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  c_chi    CONSTANT text := 'anagrafiche.fn_copia_indirizzo_ruolo';
                  v_src    record;  -- la riga sorgente, da una SELECT statica
                  v_el     jsonb;
                  v_codice config.tipi_indirizzi.codice_interno%TYPE;
                  v_ids    bigint[] := '{}';  -- vedi RETURNS
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Copiare un indirizzo del ruolo in uno o piu' tipi, nello
                  --   stesso ruolo e nella stessa istanza. Ritorna gli id nuovi,
                  --   nell'ordine dei tipi. Tutto o niente.
                  -- =========================================================
                  IF NOT EXISTS (SELECT 1 FROM anagrafiche.soggetti_ruoli sr
                                  WHERE sr.id = p_soggetto_ruolo_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SOGGETTO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id),
                          NULL::uuid,
                          COALESCE(p_soggetto_ruolo_id::text, '-'));
                  END IF;
                  IF p_indirizzo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_indirizzo_id'),
                          NULL::uuid,
                          c_chi,
                          'manca l''indirizzo da copiare');
                  END IF;
                  IF COALESCE(cardinality(p_tipi_indirizzo_codice_interno), 0) = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_tipi_indirizzo_codice_interno'),
                          NULL::uuid,
                          c_chi,
                          'manca il tipo di destinazione');
                  END IF;

                  -- 1. La sorgente, di quel ruolo.
                  SELECT i.istanza_utility_id,
                         i.indirizzo_dettaglio_id, i.indirizzo_libero, i.stato_id,
                         i.comune_id, i.codice_postale_id, i.administrative_area,
                         i.locality, i.sublocality, i.postal_code
                    INTO v_src
                    FROM anagrafiche.indirizzi i
                   WHERE i.id = p_indirizzo_id
                     AND i.soggetto_ruolo_id = p_soggetto_ruolo_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'anagrafiche', c_chi, 'E_INDIRIZZO_RUOLO_NON_TROVATO',
                          jsonb_build_object('soggetto_ruolo_id', p_soggetto_ruolo_id,
                                             'indirizzo_id', p_indirizzo_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Il motivo di riga: quello che la vista mostra spento.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'anagrafiche', c_chi,
                      anagrafiche.fn_check_copia_indirizzo_ruolo(p_indirizzo_id));

                  -- 3. Una riga per tipo, dalla singolare, nella stessa istanza.
                  v_el := anagrafiche.fn_indirizzo_elemento_da_riga(
                              v_src.indirizzo_dettaglio_id, v_src.indirizzo_libero, v_src.stato_id,
                              v_src.comune_id, v_src.codice_postale_id, v_src.administrative_area,
                              v_src.locality, v_src.sublocality, v_src.postal_code)
                          || jsonb_strip_nulls(jsonb_build_object(
                                 'istanza_utility_id', v_src.istanza_utility_id));

                  FOREACH v_codice IN ARRAY p_tipi_indirizzo_codice_interno LOOP
                      v_ids := v_ids || anagrafiche.fn_crea_indirizzo_ruolo(
                                   p_soggetto_ruolo_id,
                                   v_el || jsonb_build_object('tipo_indirizzo_codice_interno', v_codice));
                  END LOOP;

                  RETURN v_ids;
              END;
              $function$;

              COMMENT ON FUNCTION anagrafiche.fn_copia_indirizzo_ruolo(
                  anagrafiche.soggetti_ruoli.id%TYPE, anagrafiche.indirizzi.id%TYPE, text[])
              IS 'Verbo: copia un indirizzo del ruolo in uno o piu'' tipi (codici interni, nell''ordine dato), nello stesso ruolo e nella stessa istanza della sorgente, tutto o niente, e ritorna gli id delle righe nuove nello stesso ordine. Ruolo inesistente E_SOGGETTO_RUOLO_NON_TROVATO; la sorgente dev''essere del ruolo (E_INDIRIZZO_RUOLO_NON_TROVATO). Solleva il primo motivo di anagrafiche.fn_check_copia_indirizzo_ruolo (E_INDIRIZZO_COPIA_NESSUN_TIPO), quello della vista di riga anagrafiche.vw_indirizzi_ruolo_azioni. Ogni riga la scrive la singolare anagrafiche.fn_crea_indirizzo_ruolo con l''elemento di anagrafiche.fn_indirizzo_elemento_da_riga, l''istanza della sorgente e il tipo: tipo inesistente E_TIPO_INDIRIZZO_NON_TROVATO, gia'' presente sulla chiave (anche ripetuto nell''elenco) E_INDIRIZZO_RUOLO_TIPO_GIA_PRESENTE, non ammesso dal tipo di ruolo E_TIPO_INDIRIZZO_NON_PERMESSO, e i guard della tabella. Indirizzo o elenco mancanti o vuoti: E_SCRIPT_CHIAMATA_NON_VALIDA. La copia fra layer (soggetto e ruolo) non e'' di questo verbo. Il permesso lo controlla il backend. SECURITY INVOKER. Gemello di anagrafiche.fn_copia_indirizzo_soggetto.';
