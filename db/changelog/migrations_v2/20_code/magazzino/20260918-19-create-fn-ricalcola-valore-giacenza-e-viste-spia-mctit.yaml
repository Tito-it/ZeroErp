# ------------------------------------------------------------
# P-5 (3 di 3) — IL VALORE: la ri-somma e le due spie
#   magazzino.fn_ricalcola_valore_giacenza(p_magazzino_id, p_articolo_id DEFAULT NULL)
#   dbops.vw_magazzino_valore_giacenza_divergente   (natura ZERO: deve restare vuota)
#   dbops.vw_magazzino_movimenti_senza_costo        (natura LAVORAZIONE: una tendenza)
#   Brief: brief-db-magazzino-lotto-2-motore, sezione 4.4 (M-4, D-L2-c), 6-ter C7
#
# -- RI-SOMMA, NON RI-ESECUZIONE (M-4) ------------------------------------------------
#   I costo_unitario scritti sui movimenti sono FATTI: il ricalcolo li somma
#   (round(qta * costo, 6), lo stesso arrotondamento del passo 14 della
#   primitiva — C7) e riscrive la copia. Non rivaluta niente. SECURITY DEFINER
#   del proprietario: scrive dove l'app non scrive (valore_giacenza e' in sola
#   lettura per l'app, D-L2-b). p_magazzino_id OBBLIGATORIO: «un ricalcolo che
#   serve N emittenti li itera, non li somma» (c/s 7-sexies) — e un magazzino
#   e' di un emittente, quindi la grana e' gia' quella giusta. Le righe di
#   valore_giacenza del magazzino SENZA movimenti si cancellano: la primitiva
#   scrive sempre il movimento prima della copia, quindi una copia senza
#   registro puo' venire solo da fuori porta.
#
# -- LA DIVERGENZA NON PROVA L'ARITMETICA: PROVA CHE NESSUNO HA SCRITTO FUORI PORTA ------------
#   L'accumulatore somma gli stessi round(qta * costo) che la primitiva ha
#   scritto: coincidono PER COSTRUZIONE. La vista trova la coppia (articolo,
#   magazzino) in cui copia e registro DIFFERISCONO (IS DISTINCT FROM, FULL
#   JOIN: una giacenza con movimenti e senza riga di valore E una riga di
#   valore senza movimenti sono divergenze) — cioe' una scrittura che non e'
#   passata dalla primitiva, o un ricalcolo mancato. Deve restare vuota.
#   security_invoker; a presidio la legge fn_conta_presidio (DEFINER: da un
#   percorso senza contesto darebbe zero per cecita' — perimetro DEFINER in
#   presidi.csv, cadenza SETTIMANALE, P-8).
#
# -- LE ENTRATE SENZA COSTO SONO UNA TENDENZA, NON UN GUASTO ---------------------------------------
#   vw_movimenti_senza_costo: le ENTRATE (qta > 0) con costo_unitario NULL —
#   il primo carico senza valore, una rettifica positiva senza media. Le
#   uscite a NULL sono la conseguenza (nessuna media), non la causa, e non
#   entrano. Natura LAVORAZIONE: compare nel digest invece di sparire nella
#   media diluita. security_invoker, perimetro DEFINER, SETTIMANALE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20260918-19-create-fn-ricalcola-valore-giacenza-e-viste-spia-mctit.yaml

  - changeSet:
      id: 20260918-19-create-fn-ricalcola-valore-giacenza-e-viste-spia
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        magazzino.fn_ricalcola_valore_giacenza (DEFINER del proprietario, ri-somma
        round(qta * costo, 6) per magazzino e opzionalmente articolo; toglie le copie senza
        registro), dbops.vw_magazzino_valore_giacenza_divergente (copia IS DISTINCT FROM registro,
        FULL JOIN: deve restare vuota) e dbops.vw_magazzino_movimenti_senza_costo (entrate a costo
        NULL). Brief: brief-db-magazzino-lotto-2-motore, sezione 4.4 (P-5, M-4).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: magazzino
                tableName: valore_giacenza
            - columnExists:
                schemaName: magazzino
                tableName: movimenti
                columnName: costo_unitario
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_ricalcola_valore_giacenza(
                  p_magazzino_id magazzino.valore_giacenza.magazzino_id%TYPE,
                  p_articolo_id  magazzino.valore_giacenza.articolo_id%TYPE DEFAULT NULL
              )
              RETURNS TABLE (
                  articolo_id     magazzino.valore_giacenza.articolo_id%TYPE,
                  magazzino_id    magazzino.valore_giacenza.magazzino_id%TYPE,
                  valore_prima    magazzino.valore_giacenza.valore%TYPE,
                  valore_dopo     magazzino.valore_giacenza.valore%TYPE
              )
              LANGUAGE plpgsql
              VOLATILE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo: riscrivere la COPIA del valore (valore_giacenza) dal registro, per
              --   un magazzino (obbligatorio) e opzionalmente un articolo: RI-SOMMA
              --   round(qta * costo_unitario, 6) — lo stesso arrotondamento della
              --   primitiva — mai ri-esecuzione (i costi scritti sono fatti). Le copie
              --   del magazzino senza movimenti si cancellano. Ritorna, riga per riga,
              --   il valore prima e dopo (che cosa ha toccato).
              -- DEFINER del PROPRIETARIO: scrive dove l'app non scrive. p_magazzino_id
              --   obbligatorio: un magazzino e' di un emittente (7-sexies).
              BEGIN
                  IF p_magazzino_id IS NULL OR p_magazzino_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_ricalcola_valore_giacenza',
                          'E_MAG_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'magazzino obbligatorio e maggiore di zero', 'p_magazzino_id', p_magazzino_id),
                          NULL::uuid, 'magazzino.fn_ricalcola_valore_giacenza', 'p_magazzino_id (obbligatorio, maggiore di zero)');
                  END IF;

                  RETURN QUERY
                  WITH registro AS (
                      SELECT m.articolo_id, m.magazzino_id,
                             sum(round(m.qta * COALESCE(m.costo_unitario, 0), 6)) AS valore
                        FROM magazzino.movimenti m
                       WHERE m.magazzino_id = p_magazzino_id
                         AND (p_articolo_id IS NULL OR m.articolo_id = p_articolo_id)
                       GROUP BY m.articolo_id, m.magazzino_id
                  ),
                  prima AS (
                      SELECT vg.articolo_id, vg.magazzino_id, vg.valore
                        FROM magazzino.valore_giacenza vg
                       WHERE vg.magazzino_id = p_magazzino_id
                         AND (p_articolo_id IS NULL OR vg.articolo_id = p_articolo_id)
                  ),
                  scritte AS (
                      INSERT INTO magazzino.valore_giacenza (articolo_id, magazzino_id, valore)
                      SELECT r.articolo_id, r.magazzino_id, r.valore FROM registro r
                      -- ON CONSTRAINT, non (articolo_id, magazzino_id): le colonne di RETURNS TABLE
                      -- sono variabili PL/pgSQL e un elenco di colonne nudo sarebbe ambiguo.
                      ON CONFLICT ON CONSTRAINT uq_mag_valore_giacenza_art_mag DO UPDATE SET valore = EXCLUDED.valore
                      RETURNING magazzino.valore_giacenza.articolo_id,
                                magazzino.valore_giacenza.magazzino_id,
                                magazzino.valore_giacenza.valore
                  ),
                  tolte AS (
                      -- una copia senza registro puo' venire solo da fuori porta
                      DELETE FROM magazzino.valore_giacenza vg
                       WHERE vg.magazzino_id = p_magazzino_id
                         AND (p_articolo_id IS NULL OR vg.articolo_id = p_articolo_id)
                         AND NOT EXISTS (SELECT 1 FROM registro r
                                          WHERE r.articolo_id = vg.articolo_id AND r.magazzino_id = vg.magazzino_id)
                      RETURNING vg.articolo_id, vg.magazzino_id
                  )
                  SELECT s.articolo_id, s.magazzino_id, p.valore, s.valore
                    FROM scritte s
                    LEFT JOIN prima p ON p.articolo_id = s.articolo_id AND p.magazzino_id = s.magazzino_id
                  UNION ALL
                  SELECT t.articolo_id, t.magazzino_id, p.valore, NULL::numeric
                    FROM tolte t
                    LEFT JOIN prima p ON p.articolo_id = t.articolo_id AND p.magazzino_id = t.magazzino_id;
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_ricalcola_valore_giacenza(bigint, uuid) IS
                  'Riscrive la COPIA del valore (valore_giacenza) dal registro per un magazzino '
                  '(obbligatorio: e'' di un emittente, 7-sexies) e opzionalmente un articolo: '
                  'RI-SOMMA round(qta * costo_unitario, 6) — lo stesso arrotondamento del passo 14 '
                  'della primitiva (C7), cosi'' copia e ri-somma coincidono per costruzione — mai '
                  'ri-esecuzione: i costi scritti sono fatti (M-4). Le copie del magazzino senza '
                  'movimenti si cancellano (possono venire solo da fuori porta). Ritorna le coppie '
                  'toccate con valore prima e dopo (NULL dopo = tolta). DEFINER del PROPRIETARIO, '
                  'non di un superuser: scrive dove l''app ha solo SELECT (D-L2-b). Brief: '
                  'brief-db-magazzino-lotto-2-motore, sezione 4.4.';

              CREATE OR REPLACE VIEW dbops.vw_magazzino_valore_giacenza_divergente
              WITH (security_invoker = true) AS
              WITH registro AS (
                  SELECT m.articolo_id, m.magazzino_id,
                         sum(round(m.qta * COALESCE(m.costo_unitario, 0), 6)) AS valore_registro
                    FROM magazzino.movimenti m
                   GROUP BY m.articolo_id, m.magazzino_id
              )
              SELECT COALESCE(r.articolo_id,  vg.articolo_id)  AS articolo_id,
                     COALESCE(r.magazzino_id, vg.magazzino_id) AS magazzino_id,
                     vg.valore                                  AS valore_copia,
                     r.valore_registro
                FROM registro r
                FULL JOIN magazzino.valore_giacenza vg
                       ON vg.articolo_id = r.articolo_id AND vg.magazzino_id = r.magazzino_id
               WHERE vg.valore IS DISTINCT FROM r.valore_registro;

              COMMENT ON VIEW dbops.vw_magazzino_valore_giacenza_divergente IS
                  'Le coppie (articolo, magazzino) in cui la COPIA del valore (valore_giacenza) e '
                  'la RI-SOMMA del registro (round(qta * costo, 6) per movimento) DIFFERISCONO — '
                  'IS DISTINCT FROM su un FULL JOIN: una giacenza con movimenti e senza riga di '
                  'valore, e una riga di valore senza movimenti, sono divergenze. DEVE RESTARE '
                  'VUOTA. Non prova l''aritmetica (l''accumulatore somma gli stessi round che la '
                  'primitiva ha scritto: coincidono per costruzione): prova che NESSUNO HA SCRITTO '
                  'FUORI DALLA PORTA (M-4, D-L2-b). Il rimedio e'' fn_ricalcola_valore_giacenza. '
                  'security_invoker; presidio natura ZERO, perimetro DEFINER (la legge '
                  'fn_conta_presidio: da un percorso senza contesto darebbe zero per cecita''), '
                  'cadenza SETTIMANALE. Brief: brief-db-magazzino-lotto-2-motore, sezione 4.4.';

              CREATE OR REPLACE VIEW dbops.vw_magazzino_movimenti_senza_costo
              WITH (security_invoker = true) AS
              SELECT m.id, m.articolo_id, m.magazzino_id, m.data_mov, m.qta, m.causale_id,
                     m.sorgente_tipo_id, m.sorgente_riga, m.sorgente_uid,
                     m.lotto_id, m.asset_id, m.ubicazione_id
                FROM magazzino.movimenti m
               WHERE m.qta > 0
                 AND m.costo_unitario IS NULL;

              COMMENT ON VIEW dbops.vw_magazzino_movimenti_senza_costo IS
                  'Le ENTRATE (qta > 0) scritte SENZA costo unitario: il primo carico senza valore '
                  '(inventario iniziale senza costo_unitario sulla riga e nessuna media), una '
                  'rettifica positiva senza media. Un''entrata senza costo non e'' un errore: e'' un '
                  'fatto dichiarato (D-L2-c) — il movimento nasce con costo NULL, il valore resta '
                  'com''e'' e la media si diluisce. Le uscite a NULL sono la CONSEGUENZA (nessuna '
                  'media), non la causa, e non entrano. Natura LAVORAZIONE (una tendenza da '
                  'guardare, non un guasto): compare nel digest invece di sparire nella media. '
                  'security_invoker, perimetro DEFINER, cadenza SETTIMANALE. Brief: '
                  'brief-db-magazzino-lotto-2-motore, sezione 4.4.';

              GRANT SELECT ON dbops.vw_magazzino_valore_giacenza_divergente TO zeroerp_app;
              GRANT SELECT ON dbops.vw_magazzino_movimenti_senza_costo      TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS dbops.vw_magazzino_movimenti_senza_costo;
              DROP VIEW IF EXISTS dbops.vw_magazzino_valore_giacenza_divergente;
              DROP FUNCTION IF EXISTS magazzino.fn_ricalcola_valore_giacenza(bigint, uuid);
