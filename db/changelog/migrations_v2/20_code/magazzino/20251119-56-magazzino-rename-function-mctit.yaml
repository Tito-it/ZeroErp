databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/magazzino/20251119-56-magazzino-rename-function-mctit.yaml

    - changeSet:
          id: 20251119-56-magazzino-rename-function
          author: mctit
          comment: "Rinomina trigger function schema magazzino secondo convenzione trgfn_<tabella>_<descrizione>"
          changes:
              - sql:
                    splitStatements: true
                    stripComments: true
                    sql: |
                        ALTER FUNCTION magazzino.trgfn_a10_magazzini_protect_codice()
                         RENAME TO trgfn_magazzini_protect_codice;

                        ALTER FUNCTION magazzino.trgfn_magazzini_norm()
                         RENAME TO trgfn_magazzini_normalize;

    - changeSet:
          id: 20251119-57-magazzino-rename-trigger
          author: mctit
          comment: "Rinomina trigger  schema magazzino secondo convenzione trgfn_<tabella>_<descrizione>"
          changes:
              - sql:
                    splitStatements: true
                    stripComments: true
                    sql: |


                        ALTER TRIGGER trg_magazzini_a10_upd_protect_codice
                                ON magazzino.magazzini
                            RENAME TO trg_magazzini_a10_protect_codice_upd;

                            ALTER TRIGGER trg_magazzini_ins_upd_norm
                                ON magazzino.magazzini
                            RENAME TO trg_magazzini_normalize_ins_upd;
