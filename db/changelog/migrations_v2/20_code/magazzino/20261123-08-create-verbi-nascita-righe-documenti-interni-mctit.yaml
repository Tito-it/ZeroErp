# LA NASCITA DELLE RIGHE DEI DOCUMENTI INTERNI
#   magazzino.fn_aggiungi_riga_inventario(inventario, articolo, qta_contata, campi)
#   magazzino.fn_aggiungi_riga_rettifica(rettifica, articolo, qta_delta, campi)
#   magazzino.fn_aggiungi_riga_trasferimento(trasferimento, articolo, qta, campi)
#   Brief: brief-db-magazzino-tutte-le-scritture-dal-verbo, P-5b (D-M10 = b).
#
# -- LA FORMA (D-M10 = b) ---------------------------------------------
#   Per famiglia, perche' la quantita' dice tre cose diverse: quanto si e'
#   contato (inventario), di quanto si corregge (rettifica, col segno),
#   quanto si sposta (trasferimento, positiva). Articolo e quantita' sono
#   argomenti (NOT NULL della riga); in p_campi le colonne della lista
#   'crea' di magazzino.fn_documento_interno_colonne_ammesse(<famiglia>,
#   'riga', 'crea'), tolti gli argomenti.
#
# -- IL MODELLO -------------------------------------------------------
#   1. script.fn_guard_livello(utente, 'magazzino', <tabella testata>,
#      'TUTTO'): l'oggetto del permesso e' il documento, anche per le righe;
#   2. la testata nel perimetro, presa FOR UPDATE
#      (magazzino.fn_documento_interno_blocca, 20261123-07): altrimenti
#      E_MAG_DOCUMENTO_NON_TROVATO. Il lock serializza le scritture sullo
#      stesso documento con la sua registrazione;
#   3. i campi (script.fn_guard_campi_ammessi);
#   4. la scrittura (script.fn_scrivi_riga_da_jsonb), coi trigger della
#      riga: testata in DRAFT (E_MAG_DOCUMENTO_RIGHE_CONGELATE), articolo,
#      lotto, seriale e ubicazione attivi e della stessa azienda, i CHECK
#      di quantita' e di posizione.
#   SECURITY DEFINER del proprietario, search_path bloccato. RETURNS
#   ancorato all'id della riga.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20261123-08-create-verbi-nascita-righe-documenti-interni-mctit.yaml

  - changeSet:
      id: 20261123-08-create-verbi-nascita-righe-documenti-interni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea i verbi di nascita delle righe dei documenti interni di magazzino (inventario,
        rettifica, trasferimento): livello TUTTO sul documento, testata presa nel perimetro,
        campi ammessi, poi la riga coi trigger della tabella.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "2"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('magazzino', 'fn_documento_interno_blocca'),
                                                ('magazzino', 'fn_documento_interno_colonne_ammesse'));
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_aggiungi_riga_inventario(
                  p_inventario_id magazzino.inventari_righe.inventario_id%TYPE,
                  p_articolo_id   magazzino.inventari_righe.articolo_id%TYPE,
                  p_qta_contata   magazzino.inventari_righe.qta_contata%TYPE,
                  p_campi         jsonb DEFAULT '{}'::jsonb)
               RETURNS magazzino.inventari_righe.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente    config.user_override_oggetti.auth_user_id%TYPE;
                  v_campi     jsonb := COALESCE(p_campi, '{}'::jsonb);
                  c_argomenti CONSTANT text[] := ARRAY['articolo_id', 'qta_contata'];
              BEGIN
                  -- Scopo: il gesto «aggiungi una riga contata» all'inventario
                  --   p_inventario_id. Ritorna l'id della riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'inventari', 'TUTTO');
                  PERFORM magazzino.fn_documento_interno_blocca(
                      'INVENTARIO', p_inventario_id, v_utente, 'magazzino.fn_aggiungi_riga_inventario');
                  PERFORM script.fn_guard_campi_ammessi(
                      v_campi,
                      ARRAY(SELECT c
                              FROM unnest(magazzino.fn_documento_interno_colonne_ammesse(
                                              'INVENTARIO', 'riga', 'crea')) AS c
                             WHERE c <> ALL (c_argomenti)),
                      'magazzino', 'magazzino.fn_aggiungi_riga_inventario',
                      jsonb_build_object('inventario_id', p_inventario_id));

                  RETURN (script.fn_scrivi_riga_da_jsonb(
                              'magazzino.inventari_righe'::regclass,
                              jsonb_strip_nulls(v_campi || jsonb_build_object(
                                                   'inventario_id', p_inventario_id,
                                                   'articolo_id',   p_articolo_id,
                                                   'qta_contata',   p_qta_contata)))
                          ->> 'id')::bigint;
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_aggiungi_riga_inventario(
                  magazzino.inventari_righe.inventario_id%TYPE,
                  magazzino.inventari_righe.articolo_id%TYPE,
                  magazzino.inventari_righe.qta_contata%TYPE,
                  jsonb) IS
                  'VERBO: il gesto «aggiungi una riga contata» all''inventario p_inventario_id: articolo e quantita'' contata sono argomenti. Prima riga script.fn_guard_livello(utente, magazzino, inventari, TUTTO): sotto il livello, o senza utente, E_PERMESSO_NEGATO. La testata nel perimetro, presa FOR UPDATE (magazzino.fn_documento_interno_blocca), altrimenti E_MAG_DOCUMENTO_NON_TROVATO. In p_campi le colonne della lista crea di magazzino.fn_documento_interno_colonne_ammesse(INVENTARIO, riga, crea) tolti gli argomenti: ubicazione, lotto, seriale, costo unitario; le assenti e le null al DEFAULT; una chiave fuori lista: E_CAMPO_NON_AMMESSO col suo nome. La testata in DRAFT, la posizione, le quantita'' e la coerenza dell''azienda li dicono i guard e i vincoli della riga. qta_sistema non e'' un campo: la scrive la registrazione. SECURITY DEFINER del proprietario, search_path bloccato. Ritorna l''id della riga.';

              CREATE OR REPLACE FUNCTION magazzino.fn_aggiungi_riga_rettifica(
                  p_rettifica_id magazzino.rettifiche_righe.rettifica_id%TYPE,
                  p_articolo_id  magazzino.rettifiche_righe.articolo_id%TYPE,
                  p_qta_delta    magazzino.rettifiche_righe.qta_delta%TYPE,
                  p_campi        jsonb DEFAULT '{}'::jsonb)
               RETURNS magazzino.rettifiche_righe.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente    config.user_override_oggetti.auth_user_id%TYPE;
                  v_campi     jsonb := COALESCE(p_campi, '{}'::jsonb);
                  c_argomenti CONSTANT text[] := ARRAY['articolo_id', 'qta_delta'];
              BEGIN
                  -- Scopo: il gesto «aggiungi una riga» alla rettifica
                  --   p_rettifica_id. Ritorna l'id della riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'rettifiche', 'TUTTO');
                  PERFORM magazzino.fn_documento_interno_blocca(
                      'RETTIFICA', p_rettifica_id, v_utente, 'magazzino.fn_aggiungi_riga_rettifica');
                  PERFORM script.fn_guard_campi_ammessi(
                      v_campi,
                      ARRAY(SELECT c
                              FROM unnest(magazzino.fn_documento_interno_colonne_ammesse(
                                              'RETTIFICA', 'riga', 'crea')) AS c
                             WHERE c <> ALL (c_argomenti)),
                      'magazzino', 'magazzino.fn_aggiungi_riga_rettifica',
                      jsonb_build_object('rettifica_id', p_rettifica_id));

                  RETURN (script.fn_scrivi_riga_da_jsonb(
                              'magazzino.rettifiche_righe'::regclass,
                              jsonb_strip_nulls(v_campi || jsonb_build_object(
                                                   'rettifica_id', p_rettifica_id,
                                                   'articolo_id',  p_articolo_id,
                                                   'qta_delta',    p_qta_delta)))
                          ->> 'id')::bigint;
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_aggiungi_riga_rettifica(
                  magazzino.rettifiche_righe.rettifica_id%TYPE,
                  magazzino.rettifiche_righe.articolo_id%TYPE,
                  magazzino.rettifiche_righe.qta_delta%TYPE,
                  jsonb) IS
                  'VERBO: il gesto «aggiungi una riga» alla rettifica p_rettifica_id: articolo e quantita'' di correzione (col segno) sono argomenti. Prima riga script.fn_guard_livello(utente, magazzino, rettifiche, TUTTO): sotto il livello, o senza utente, E_PERMESSO_NEGATO. La testata nel perimetro, presa FOR UPDATE (magazzino.fn_documento_interno_blocca), altrimenti E_MAG_DOCUMENTO_NON_TROVATO. In p_campi le colonne della lista crea di magazzino.fn_documento_interno_colonne_ammesse(RETTIFICA, riga, crea) tolti gli argomenti: motivo, ubicazione, lotto, seriale, costo unitario; le assenti e le null al DEFAULT; una chiave fuori lista: E_CAMPO_NON_AMMESSO col suo nome. La testata in DRAFT, la posizione, le quantita'' e la coerenza dell''azienda li dicono i guard e i vincoli della riga. SECURITY DEFINER del proprietario, search_path bloccato. Ritorna l''id della riga.';

              CREATE OR REPLACE FUNCTION magazzino.fn_aggiungi_riga_trasferimento(
                  p_trasferimento_id magazzino.trasferimenti_righe.trasferimento_id%TYPE,
                  p_articolo_id      magazzino.trasferimenti_righe.articolo_id%TYPE,
                  p_qta              magazzino.trasferimenti_righe.qta%TYPE,
                  p_campi            jsonb DEFAULT '{}'::jsonb)
               RETURNS magazzino.trasferimenti_righe.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente    config.user_override_oggetti.auth_user_id%TYPE;
                  v_campi     jsonb := COALESCE(p_campi, '{}'::jsonb);
                  c_argomenti CONSTANT text[] := ARRAY['articolo_id', 'qta'];
              BEGIN
                  -- Scopo: il gesto «aggiungi una riga» al trasferimento
                  --   p_trasferimento_id. Ritorna l'id della riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'trasferimenti', 'TUTTO');
                  PERFORM magazzino.fn_documento_interno_blocca(
                      'TRASFERIMENTO', p_trasferimento_id, v_utente, 'magazzino.fn_aggiungi_riga_trasferimento');
                  PERFORM script.fn_guard_campi_ammessi(
                      v_campi,
                      ARRAY(SELECT c
                              FROM unnest(magazzino.fn_documento_interno_colonne_ammesse(
                                              'TRASFERIMENTO', 'riga', 'crea')) AS c
                             WHERE c <> ALL (c_argomenti)),
                      'magazzino', 'magazzino.fn_aggiungi_riga_trasferimento',
                      jsonb_build_object('trasferimento_id', p_trasferimento_id));

                  RETURN (script.fn_scrivi_riga_da_jsonb(
                              'magazzino.trasferimenti_righe'::regclass,
                              jsonb_strip_nulls(v_campi || jsonb_build_object(
                                                   'trasferimento_id', p_trasferimento_id,
                                                   'articolo_id',      p_articolo_id,
                                                   'qta',              p_qta)))
                          ->> 'id')::bigint;
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_aggiungi_riga_trasferimento(
                  magazzino.trasferimenti_righe.trasferimento_id%TYPE,
                  magazzino.trasferimenti_righe.articolo_id%TYPE,
                  magazzino.trasferimenti_righe.qta%TYPE,
                  jsonb) IS
                  'VERBO: il gesto «aggiungi una riga» al trasferimento p_trasferimento_id: articolo e quantita'' (positiva) sono argomenti. Prima riga script.fn_guard_livello(utente, magazzino, trasferimenti, TUTTO): sotto il livello, o senza utente, E_PERMESSO_NEGATO. La testata nel perimetro del magazzino di partenza, presa FOR UPDATE (magazzino.fn_documento_interno_blocca), altrimenti E_MAG_DOCUMENTO_NON_TROVATO. In p_campi le colonne della lista crea di magazzino.fn_documento_interno_colonne_ammesse(TRASFERIMENTO, riga, crea) tolti gli argomenti: lotto, seriale, ubicazione di partenza e di arrivo; le assenti e le null al DEFAULT; una chiave fuori lista: E_CAMPO_NON_AMMESSO col suo nome. La testata in DRAFT, le ubicazioni distinte, la quantita'' e la coerenza dell''azienda li dicono i guard e i vincoli della riga. SECURITY DEFINER del proprietario, search_path bloccato. Ritorna l''id della riga.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS magazzino.fn_aggiungi_riga_trasferimento(bigint, uuid, numeric, jsonb);
              DROP FUNCTION IF EXISTS magazzino.fn_aggiungi_riga_rettifica(bigint, uuid, numeric, jsonb);
              DROP FUNCTION IF EXISTS magazzino.fn_aggiungi_riga_inventario(bigint, uuid, numeric, jsonb);
