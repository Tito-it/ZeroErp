databaseChangeLog:

  - changeSet:
      id: 20251003-12-create-views-giacenza
      author: mctit
      logicalFilePath: migrations_v2/00_views/20251003-12-create-views-giacenza.yaml
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW magazzino.vw_giacenza AS
              SELECT
                m.articolo_id,
                m.magazzino_id,
                SUM(m.qta) AS qta
              FROM magazzino.movimenti m
              GROUP BY m.articolo_id, m.magazzino_id;

              CREATE OR REPLACE VIEW magazzino.vw_giacenza_valorizzata AS
              SELECT
                g.articolo_id,
                g.magazzino_id,
                g.qta,
                cm.costo_medio,
                (g.qta * cm.costo_medio)::NUMERIC(18,6) AS valore
              FROM magazzino.vw_giacenza g
              LEFT JOIN magazzino.vw_costo_medio cm
                ON cm.articolo_id = g.articolo_id
               AND cm.magazzino_id = g.magazzino_id;
