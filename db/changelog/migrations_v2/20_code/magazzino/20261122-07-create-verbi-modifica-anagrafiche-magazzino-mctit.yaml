# ------------------------------------------------------------
# I VERBI DI MODIFICA DELLE ANAGRAFICHE DI MAGAZZINO
#   magazzino.fn_modifica_magazzino(id, dati)
#   magazzino.fn_modifica_ubicazione(magazzino, id, dati)
#   magazzino.fn_modifica_lotto(id, dati)
#   Ritornano la riga (id e colonne modificabili). Brief:
#   brief-db-magazzino-tutte-le-scritture-dal-verbo, D-M2 (la modifica: un
#   verbo per tabella col delta in jsonb), D-M4.
#
# -- IL GESTO -----------------------------------------------------------
#   p_dati e' il DELTA: si scrivono solo le chiavi mandate, le altre
#   colonne restano com'erano. Una chiave a null scrive NULL (e' il modo di
#   svuotare un campo facoltativo): «non mandato» e «messo a vuoto» sono
#   due cose, ed e' per questo che il gesto e' jsonb e non a parametri.
#   Un delta vuoto non scrive niente e ritorna la riga.
#
# -- IL MODELLO --------------------------------------------------------
#   1. script.fn_guard_livello(utente, 'magazzino', '<tabella>', 'TUTTO');
#   2. p_dati e' un oggetto (E_SCRIPT_CHIAMATA_NON_VALIDA), con le sole
#      chiavi della lista 'modifica' di magazzino.fn_<tabella>_colonne_ammesse
#      (E_CAMPO_NON_AMMESSO, col nome del campo);
#   3. la riga c'e' ed e' nel perimetro, letta FOR UPDATE: altrimenti il
#      codice «non trovato» che il backend solleva gia' oggi (no-leak: fuori
#      perimetro e inesistente rispondono uguale). Il perimetro e' quello
#      della policy: script.fn_check_user_emittente_scope per il magazzino,
#      script.fn_scope_ef_whitelist_via_magazzino per l'ubicazione; un lotto
#      non ha perimetro;
#   4. la scrittura: script.fn_scrivi_riga_da_jsonb con p_dove = la chiave.
#      Lucchetti, padri attivi, figli che bloccano la disattivazione, il
#      guard di perimetro: i trigger della tabella, come per ogni scrittore.
#   SECURITY DEFINER del proprietario, search_path bloccato.
#
#   L'ubicazione si individua dentro il suo magazzino (magazzino, id), come
#   la rotta del backend magazzini/<id>/ubicazioni/<id>/: un'ubicazione di
#   un altro magazzino e' «non trovata».
#
#   ⚠️ Nessuna normalizzazione della stringa vuota (quella del pannello
#   generico, 2-bis di config.fn_pannello_scrivi): i drawer del magazzino
#   sono dedicati, e il backend oggi scrive cio' che riceve. Se un drawer
#   manda '' per un campo svuotato, e' il backend a deciderlo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20261122-07-create-verbi-modifica-anagrafiche-magazzino-mctit.yaml

  - changeSet:
      id: 20261122-07-create-verbi-modifica-anagrafiche-magazzino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea i tre verbi di modifica delle anagrafiche di magazzino (magazzino, ubicazione,
        lotto): SECURITY DEFINER, livello TUTTO sull'oggetto nella prima riga, il delta in jsonb
        con le sole colonne modificabili, la riga fuori perimetro come non trovata.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "3"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'magazzino'
                 AND p.proname IN ('fn_magazzini_colonne_ammesse', 'fn_ubicazioni_colonne_ammesse',
                                   'fn_lotti_colonne_ammesse');
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_magazzino(
                  p_id   magazzino.magazzini.id%TYPE,
                  p_dati jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_oggetti.auth_user_id%TYPE;
                  v_ammesse  text[];
                  v_estranea text;
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica il magazzino» dell'operatore: il
                  --   delta p_dati sulle colonne modificabili. Ritorna la riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'magazzini', 'TUTTO');

                  IF p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_magazzino', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('id', p_id, 'tipo_dati', jsonb_typeof(p_dati)),
                          NULL::uuid,
                          'magazzino.fn_modifica_magazzino',
                          'i dati non sono un oggetto');
                  END IF;

                  v_ammesse  := magazzino.fn_magazzini_colonne_ammesse('modifica');
                  v_estranea := script.fn_prima_chiave_estranea(p_dati, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_magazzino', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'id', p_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- No-leak: fuori perimetro e inesistente rispondono uguale.
                  PERFORM 1
                     FROM magazzino.magazzini mg
                    WHERE mg.id = p_id
                      AND script.fn_check_user_emittente_scope(v_utente, mg.emittente_fiscale_id)
                      FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_magazzino', 'E_MAG_MAGAZZINO_NON_TROVATO',
                          jsonb_build_object('magazzino_id', p_id),
                          NULL::uuid,
                          COALESCE(p_id::text, '(nessuno)'));
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                'magazzino.magazzini'::regclass, p_dati, jsonb_build_object('id', p_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;

              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_ubicazione(
                  p_magazzino_id magazzino.ubicazioni.magazzino_id%TYPE,
                  p_id           magazzino.ubicazioni.id%TYPE,
                  p_dati         jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_oggetti.auth_user_id%TYPE;
                  v_ammesse  text[];
                  v_estranea text;
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica l'ubicazione» dell'operatore,
                  --   dentro il suo magazzino: il delta p_dati sulle colonne
                  --   modificabili. Ritorna la riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'ubicazioni', 'TUTTO');

                  IF p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_ubicazione', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('magazzino_id', p_magazzino_id, 'id', p_id,
                                             'tipo_dati', jsonb_typeof(p_dati)),
                          NULL::uuid,
                          'magazzino.fn_modifica_ubicazione',
                          'i dati non sono un oggetto');
                  END IF;

                  v_ammesse  := magazzino.fn_ubicazioni_colonne_ammesse('modifica');
                  v_estranea := script.fn_prima_chiave_estranea(p_dati, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_ubicazione', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'magazzino_id', p_magazzino_id,
                                             'id', p_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- No-leak: fuori perimetro, di un altro magazzino o
                  -- inesistente rispondono uguale.
                  PERFORM 1
                     FROM magazzino.ubicazioni u
                    WHERE u.id = p_id
                      AND u.magazzino_id = p_magazzino_id
                      AND script.fn_scope_ef_whitelist_via_magazzino(v_utente, u.magazzino_id)
                      FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_ubicazione', 'E_MAG_UBICAZIONE_NON_TROVATA',
                          jsonb_build_object('magazzino_id', p_magazzino_id, 'ubicazione_id', p_id),
                          NULL::uuid,
                          COALESCE(p_id::text, '(nessuna)'));
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                'magazzino.ubicazioni'::regclass, p_dati, jsonb_build_object('id', p_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;

              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_lotto(
                  p_id   magazzino.lotti.id%TYPE,
                  p_dati jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_ammesse  text[];
                  v_estranea text;
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica il lotto» dell'operatore: il delta
                  --   p_dati sulle colonne modificabili. Un lotto e'
                  --   dell'articolo: nessun perimetro. Ritorna la riga.
                  PERFORM script.fn_guard_livello(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer,
                      'magazzino', 'lotti', 'TUTTO');

                  IF p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_lotto', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('id', p_id, 'tipo_dati', jsonb_typeof(p_dati)),
                          NULL::uuid,
                          'magazzino.fn_modifica_lotto',
                          'i dati non sono un oggetto');
                  END IF;

                  v_ammesse  := magazzino.fn_lotti_colonne_ammesse('modifica');
                  v_estranea := script.fn_prima_chiave_estranea(p_dati, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_lotto', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'id', p_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  PERFORM 1 FROM magazzino.lotti l WHERE l.id = p_id FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_lotto', 'E_MAG_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_id),
                          NULL::uuid,
                          COALESCE(p_id::text, '(nessuno)'));
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                'magazzino.lotti'::regclass, p_dati, jsonb_build_object('id', p_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_modifica_magazzino(magazzino.magazzini.id%TYPE, jsonb) IS
                  'VERBO: il gesto «modifica il magazzino» dell''operatore. p_dati e'' il delta: si scrivono solo le chiavi mandate, una chiave a null scrive NULL, un delta vuoto non scrive niente. Passi: script.fn_guard_livello(utente, magazzino, magazzini, TUTTO) (E_PERMESSO_NEGATO); p_dati oggetto (E_SCRIPT_CHIAMATA_NON_VALIDA) con le sole chiavi della lista modifica di magazzino.fn_magazzini_colonne_ammesse (E_CAMPO_NON_AMMESSO col nome del campo); la riga c''e'' ed e'' nel perimetro dell''operatore (script.fn_check_user_emittente_scope), letta FOR UPDATE, altrimenti E_MAG_MAGAZZINO_NON_TROVATO senza dire quale dei due; la scrittura con script.fn_scrivi_riga_da_jsonb, coi trigger della tabella. Nessun DELETE: si disattiva con attivo. SECURITY DEFINER del proprietario, search_path bloccato. Ritorna la riga: id e colonne modificabili.';

              COMMENT ON FUNCTION magazzino.fn_modifica_ubicazione(
                  magazzino.ubicazioni.magazzino_id%TYPE, magazzino.ubicazioni.id%TYPE, jsonb) IS
                  'VERBO: il gesto «modifica l''ubicazione» dell''operatore, individuata dentro il suo magazzino (p_magazzino_id, p_id). p_dati e'' il delta: si scrivono solo le chiavi mandate, una chiave a null scrive NULL, un delta vuoto non scrive niente. Passi: script.fn_guard_livello(utente, magazzino, ubicazioni, TUTTO) (E_PERMESSO_NEGATO); p_dati oggetto (E_SCRIPT_CHIAMATA_NON_VALIDA) con le sole chiavi della lista modifica di magazzino.fn_ubicazioni_colonne_ammesse (E_CAMPO_NON_AMMESSO col nome del campo); l''ubicazione c''e'', e'' di quel magazzino e il magazzino e'' nel perimetro dell''operatore (script.fn_scope_ef_whitelist_via_magazzino), letta FOR UPDATE, altrimenti E_MAG_UBICAZIONE_NON_TROVATA senza dire quale dei tre; la scrittura con script.fn_scrivi_riga_da_jsonb, coi trigger della tabella. Nessun DELETE: si disattiva con attivo. SECURITY DEFINER del proprietario, search_path bloccato. Ritorna la riga: id e colonne modificabili.';

              COMMENT ON FUNCTION magazzino.fn_modifica_lotto(magazzino.lotti.id%TYPE, jsonb) IS
                  'VERBO: il gesto «modifica il lotto» dell''operatore. p_dati e'' il delta: si scrivono solo le chiavi mandate, una chiave a null scrive NULL, un delta vuoto non scrive niente. Passi: script.fn_guard_livello(utente, magazzino, lotti, TUTTO) (E_PERMESSO_NEGATO); p_dati oggetto (E_SCRIPT_CHIAMATA_NON_VALIDA) con le sole chiavi della lista modifica di magazzino.fn_lotti_colonne_ammesse (E_CAMPO_NON_AMMESSO col nome del campo); il lotto c''e'', letto FOR UPDATE, altrimenti E_MAG_LOTTO_NON_TROVATO; la scrittura con script.fn_scrivi_riga_da_jsonb, coi trigger della tabella. Un lotto e'' dell''articolo, senza perimetro d''emittente. Nessun DELETE: si disattiva con attivo. SECURITY DEFINER del proprietario, search_path bloccato. Ritorna la riga: id e colonne modificabili.';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS magazzino.fn_modifica_magazzino(bigint, jsonb);
              DROP FUNCTION IF EXISTS magazzino.fn_modifica_ubicazione(bigint, bigint, jsonb);
              DROP FUNCTION IF EXISTS magazzino.fn_modifica_lotto(bigint, jsonb);
