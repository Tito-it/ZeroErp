                  p_lotto_id          magazzino.movimenti_attesi.lotto_id%TYPE DEFAULT NULL,
                  p_asset_id          magazzino.movimenti_attesi.asset_id%TYPE DEFAULT NULL,
                  p_ubicazione_id     magazzino.movimenti_attesi.ubicazione_id%TYPE DEFAULT NULL)
               RETURNS magazzino.movimenti_attesi.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo: aprire un blocco manuale — riservare p_qta pezzi (POSITIVA:
              --   il verso lo mette il verbo) per qualcuno o per un motivo (D-L3-j).
              -- Ritorna: l'id dell'atteso aperto.
              DECLARE
                  v_utente    config.user_override_azioni.auth_user_id%TYPE;
                  v_causale   magazzino.causali.id%TYPE;
                  v_motivi    jsonb;
                  v_id        magazzino.movimenti_attesi.id%TYPE;
              BEGIN
                  -- 0. Il permesso, prima di ogni altra cosa.
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_apri_blocco');
                  PERFORM script.fn_guard_azione(v_utente, 'blocca_merce');

                  IF p_magazzino_id IS NULL OR p_magazzino_id <= 0
                     OR p_articolo_id IS NULL
                     OR p_qta IS NULL OR p_qta <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_apri_blocco',
                          'E_MAG_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'magazzino e articolo obbligatori, quantita'' positiva',
                                             'p_magazzino_id', p_magazzino_id, 'p_qta', p_qta),
                          NULL::uuid, 'magazzino.fn_apri_blocco',
                          'p_magazzino_id (maggiore di zero), p_articolo_id (obbligatorio), p_qta (maggiore di zero: il verso lo mette il verbo)');
                  END IF;

                  -- Il magazzino, nel perimetro di chi agisce (DEFINER: il predicato della policy).
                  IF NOT EXISTS (SELECT 1 FROM magazzino.magazzini m
                                  WHERE m.id = p_magazzino_id AND m.attivo
                                    AND script.fn_scope_ef_whitelist_via_magazzino(v_utente, m.id)) THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_apri_blocco',
                          'E_MAG_MAGAZZINO_NON_VALIDO',
                          jsonb_build_object('detail', 'magazzino inesistente, spento o fuori perimetro',
                                             'magazzino_id', p_magazzino_id),
                          NULL::uuid, p_magazzino_id::text);
                  END IF;

                  -- La posizione, come la giudicherebbe la primitiva.
                  v_motivi := script.fn_check_riga_magazzino(p_magazzino_id, p_articolo_id,
                                                             p_lotto_id, p_asset_id, p_ubicazione_id);
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'magazzino', 'magazzino.fn_apri_blocco', v_motivi, NULL, NULL::uuid,
                      jsonb_build_object('magazzino_id', p_magazzino_id, 'articolo_id', p_articolo_id));

                  SELECT c.id INTO v_causale
                    FROM magazzino.causali c
                   WHERE c.codice_interno = 'SCARICO_VEN' AND c.attivo;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_apri_blocco',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'magazzino.causali.SCARICO_VEN'),
                          NULL::uuid, VARIADIC ARRAY['causale di magazzino SCARICO_VEN (magazzino.causali, attiva)']);
                  END IF;

                  INSERT INTO magazzino.movimenti_attesi
                         (articolo_id, magazzino_id, qta, causale_id, stato,
                          soggetto_ruolo_id, nota, lotto_id, asset_id, ubicazione_id, meta)
                  VALUES (p_articolo_id, p_magazzino_id, -p_qta, v_causale, 'APERTA',
                          p_soggetto_ruolo_id, NULLIF(btrim(p_nota), ''), p_lotto_id, p_asset_id, p_ubicazione_id,
                          jsonb_build_object('aperto_da', v_utente))
                  RETURNING id INTO v_id;

                  RETURN v_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_cambia_stato_documento_interno(
                  p_famiglia     text,
                  p_documento_id bigint,  -- parametrico su tre tabelle: nessun %TYPE e' vero per tutte
                  p_stato        text)   -- lo stato della famiglia: tre colonne, nessuna sola da ancorare
               RETURNS text
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente config.user_override_oggetti.auth_user_id%TYPE;
                  v_fam    record;
                  v_riga   jsonb;
              BEGIN
                  -- Scopo: il gesto conferma, riapri o annulla di un documento
                  --   interno: lo stato p_stato sulla testata. La matrice la fa
                  --   rispettare il trigger. Ritorna lo stato scritto.
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_cambia_stato_documento_interno');
                  PERFORM script.fn_guard_livello(
                      v_utente, 'magazzino',
                      (SELECT f.tabella FROM magazzino.fn_documento_interno_famiglia(p_famiglia) AS f),
                      'TUTTO');

                  SELECT b.* INTO v_fam
                    FROM magazzino.fn_documento_interno_blocca(
                             p_famiglia, p_documento_id, v_utente,
                             'magazzino.fn_cambia_stato_documento_interno') AS b;

                  -- La matrice (magazzino.fn_documento_interno_transizioni) e la
                  -- porta POSTED le dice trgfn_documento_interno_guard_transizione;
                  -- un valore fuori dal vocabolario lo ferma il CHECK della tabella.
                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                format('magazzino.%I', v_fam.tabella)::regclass,
                                jsonb_build_object(v_fam.colonna_stato, p_stato),
                                jsonb_build_object('id', p_documento_id));

                  RETURN v_riga ->> v_fam.colonna_stato;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_elimina_documento_interno(
                  p_famiglia     text,
                  p_documento_id bigint)  -- parametrico su tre tabelle: nessun %TYPE e' vero per tutte
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente config.user_override_oggetti.auth_user_id%TYPE;
                  v_fam    record;
              BEGIN
                  -- Scopo: il gesto «elimina il documento» (la bozza). Le
                  --   righe vanno con la testata (ON DELETE CASCADE).
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_elimina_documento_interno');
                  PERFORM script.fn_guard_livello(
                      v_utente, 'magazzino',
                      (SELECT f.tabella FROM magazzino.fn_documento_interno_famiglia(p_famiglia) AS f),
                      'TUTTO');

                  SELECT b.* INTO v_fam
                    FROM magazzino.fn_documento_interno_blocca(
                             p_famiglia, p_documento_id, v_utente,
                             'magazzino.fn_elimina_documento_interno') AS b;

                  -- Solo in DRAFT: lo dice trgfn_documento_interno_guard_transizione
                  -- (E_MAG_DOCUMENTO_NON_ELIMINABILE), per ogni scrittore.
                  EXECUTE format('DELETE FROM magazzino.%I WHERE id = $1', v_fam.tabella)
                    USING p_documento_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_libera_blocco(
                  p_blocco_id magazzino.movimenti_attesi.id%TYPE,
                  p_nota      magazzino.movimenti_attesi.nota%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo: liberare un blocco manuale con un atto — chi, quando, perche'
              --   (M-3: «si libera esplicitamente, non si consuma da se'»).
              DECLARE
                  v_utente config.user_override_azioni.auth_user_id%TYPE;
                  v_stato  magazzino.movimenti_attesi.stato%TYPE;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_libera_blocco');
                  PERFORM script.fn_guard_azione(v_utente, 'blocca_merce');

                  IF p_blocco_id IS NULL OR p_blocco_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_libera_blocco',
                          'E_MAG_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'blocco obbligatorio e maggiore di zero',
                                             'p_blocco_id', p_blocco_id),
                          NULL::uuid, 'magazzino.fn_libera_blocco', 'p_blocco_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- Il blocco, FOR UPDATE, nel perimetro; solo i blocchi manuali (senza sorgente).
                  SELECT a.stato INTO v_stato
                    FROM magazzino.movimenti_attesi a
                   WHERE a.id = p_blocco_id
                     AND a.sorgente_tipo_id IS NULL
                     AND script.fn_scope_ef_whitelist_via_magazzino(v_utente, a.magazzino_id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_libera_blocco',
                          'E_MAG_BLOCCO_NON_TROVATO',
                          jsonb_build_object('blocco_id', p_blocco_id),
                          NULL::uuid, p_blocco_id::text);
                  END IF;
                  IF v_stato <> 'APERTA' THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_libera_blocco',
                          'E_MAG_BLOCCO_GIA_CHIUSO',
                          jsonb_build_object('blocco_id', p_blocco_id, 'stato', v_stato),
                          NULL::uuid, p_blocco_id::text);
                  END IF;

                  UPDATE magazzino.movimenti_attesi a
                     SET stato          = 'CHIUSA',
                         data_chiusura  = now(),
                         meta           = a.meta || jsonb_build_object(
                                              'liberato_da',      v_utente,
                                              'liberato_il',      now(),
                                              'nota_liberazione', NULLIF(btrim(p_nota), ''))
                   WHERE a.id = p_blocco_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_documento_interno(
                  p_famiglia     text,
                  p_documento_id bigint,  -- parametrico su tre tabelle: nessun %TYPE e' vero per tutte
                  p_dati         jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente  config.user_override_oggetti.auth_user_id%TYPE;
                  v_fam     record;
                  v_ammesse text[];   -- nomi di colonna: nessuna colonna di cui siano il riflesso
                  v_riga    jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica la testata» di un documento
                  --   interno: il delta p_dati sulle colonne modificabili, con
                  --   il documento in DRAFT. Ritorna la testata.
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_modifica_documento_interno');
                  PERFORM script.fn_guard_livello(
                      v_utente, 'magazzino',
                      (SELECT f.tabella FROM magazzino.fn_documento_interno_famiglia(p_famiglia) AS f),
                      'TUTTO');

                  SELECT b.* INTO v_fam
                    FROM magazzino.fn_documento_interno_blocca(
                             p_famiglia, p_documento_id, v_utente,
                             'magazzino.fn_modifica_documento_interno') AS b;

                  v_ammesse := magazzino.fn_documento_interno_colonne_ammesse(v_fam.famiglia, 'testata', 'modifica');
                  PERFORM script.fn_guard_campi_ammessi(
                      p_dati, v_ammesse,
                      'magazzino', 'magazzino.fn_modifica_documento_interno',
                      jsonb_build_object('famiglia', v_fam.famiglia, 'documento_id', p_documento_id));

                  -- La testata si modifica in bozza, come le righe: lo dice la
                  -- capability (can_edit_testata), e nessun trigger lo fa sulla
                  -- testata. Un delta vuoto non scrive niente: passa anche fuori
                  -- bozza, e ritorna la testata.
                  IF v_fam.stato <> 'DRAFT' AND p_dati <> '{}'::jsonb THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_documento_interno',
                          'E_MAG_DOCUMENTO_TESTATA_CONGELATA',
                          jsonb_build_object('famiglia', v_fam.famiglia, 'documento_id', p_documento_id,
                                             'stato', v_fam.stato),
                          NULL::uuid,
                          v_fam.stato);
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                format('magazzino.%I', v_fam.tabella)::regclass,
                                p_dati, jsonb_build_object('id', p_documento_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_lotto(
                  p_id   magazzino.lotti.id%TYPE,
                  p_dati jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_oggetti.auth_user_id%TYPE;
                  v_ammesse  text[];  -- nomi di colonna: nessuna colonna di cui siano il riflesso
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica il lotto» dell'operatore, dentro
                  --   il perimetro della sua azienda: il delta p_dati sulle
                  --   colonne modificabili. Ritorna la riga.
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_modifica_lotto');
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'lotti', 'TUTTO');

                  v_ammesse  := magazzino.fn_lotti_colonne_ammesse('modifica');
                  PERFORM script.fn_guard_campi_ammessi(
                      p_dati, v_ammesse,
                      'magazzino', 'magazzino.fn_modifica_lotto',
                      jsonb_build_object('id', p_id));

                  -- No-leak: fuori perimetro e inesistente rispondono uguale.
                  PERFORM 1
                     FROM magazzino.lotti l
                    WHERE l.id = p_id
                      AND script.fn_check_user_emittente_scope(v_utente, l.emittente_fiscale_id)
                      FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_lotto', 'E_MAG_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_id),
                          NULL::uuid,
                          COALESCE(p_id::text, '(nessuno)'));
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                'magazzino.lotti'::regclass, p_dati, jsonb_build_object('id', p_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_magazzino(
                  p_id   magazzino.magazzini.id%TYPE,
                  p_dati jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_oggetti.auth_user_id%TYPE;
                  v_ammesse  text[];  -- nomi di colonna: nessuna colonna di cui siano il riflesso
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica il magazzino» dell'operatore: il
                  --   delta p_dati sulle colonne modificabili. Ritorna la riga.
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_modifica_magazzino');
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'magazzini', 'TUTTO');

                  v_ammesse  := magazzino.fn_magazzini_colonne_ammesse('modifica');
                  PERFORM script.fn_guard_campi_ammessi(
                      p_dati, v_ammesse,
                      'magazzino', 'magazzino.fn_modifica_magazzino',
