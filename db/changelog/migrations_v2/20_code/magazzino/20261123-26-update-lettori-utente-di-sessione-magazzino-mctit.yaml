                  -- No-leak: fuori perimetro e inesistente rispondono uguale.
                  PERFORM 1
                     FROM magazzino.magazzini mg
                    WHERE mg.id = p_id
                      AND script.fn_check_user_emittente_scope(v_utente, mg.emittente_fiscale_id)
