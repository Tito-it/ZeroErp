# magazzino: i lettori di app.current_user_id passano a script.fn_utente_di_sessione.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8; Q60 (a), 2b: per ultimo,
#   dopo il commit di brief-db-magazzino-tutte-le-scritture-dal-verbo).
#
# Il perche': ognuna convertiva la GUC da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, e un
#   valore che non e' un intero dava il 22P02 grezzo. Ora la legge il BB
#   (20261123-16): assente o vuota resta NULL, come prima; un valore che non
#   e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, col nome della
#   funzione che legge.
# Funzioni: fn_aggiungi_asset, fn_aggiungi_inventario, fn_aggiungi_lotto,
#   fn_aggiungi_magazzino, fn_aggiungi_rettifica, fn_aggiungi_riga_inventario,
#   fn_aggiungi_riga_rettifica, fn_aggiungi_riga_trasferimento,
#   fn_aggiungi_trasferimento, fn_aggiungi_ubicazione, fn_apri_blocco,
#   fn_cambia_stato_documento_interno, fn_elimina_documento_interno,
#   fn_libera_blocco, fn_modifica_documento_interno, fn_modifica_lotto,
#   fn_modifica_magazzino, fn_modifica_riga_documento_interno,
#   fn_modifica_ubicazione, fn_posta_inventario, fn_posta_rettifica,
#   fn_posta_trasferimento, fn_togli_riga_documento_interno,
#   trgfn_ubicazioni_guard_parent.
# Testata ri-ancorata (linee-guida §5g): il RETURNS bigint di fn_aggiungi_asset
#   e fn_aggiungi_magazzino diventa magazzino.assets.id%TYPE e
#   magazzino.magazzini.id%TYPE, l'id della riga che nasce (come fn_aggiungi_lotto).
# Cambia solo la lettura. Corpo dal vivo (dbdev, 2026-11-23, dopo 20261123-11);
#   firma, RETURNS e attributi dall'ultimo changeSet che ha ancora i %TYPE.
#   Firma, volatilita', sicurezza, proprietario e GRANT invariati: CREATE OR
#   REPLACE. La rollback riporta i corpi di prima. Con questo changeSet
#   magazzino esce dalle esenzioni di script/test-fn-utente-di-sessione-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20261123-26-update-lettori-utente-di-sessione-magazzino-mctit.yaml

  - changeSet:
      id: 20261123-26-update-lettori-utente-di-sessione-magazzino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        magazzino: le funzioni che leggono app.current_user_id passano a script.fn_utente_di_sessione invece
        di convertire la GUC da se'. Brief: brief-db-revisione-ui (§3.6-sexies, Q60).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "25"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('script', 'fn_utente_di_sessione'), ('magazzino', 'fn_aggiungi_asset'), ('magazzino', 'fn_aggiungi_inventario'), ('magazzino', 'fn_aggiungi_lotto'), ('magazzino', 'fn_aggiungi_magazzino'), ('magazzino', 'fn_aggiungi_rettifica'), ('magazzino', 'fn_aggiungi_riga_inventario'), ('magazzino', 'fn_aggiungi_riga_rettifica'), ('magazzino', 'fn_aggiungi_riga_trasferimento'), ('magazzino', 'fn_aggiungi_trasferimento'), ('magazzino', 'fn_aggiungi_ubicazione'), ('magazzino', 'fn_apri_blocco'), ('magazzino', 'fn_cambia_stato_documento_interno'), ('magazzino', 'fn_elimina_documento_interno'), ('magazzino', 'fn_libera_blocco'), ('magazzino', 'fn_modifica_documento_interno'), ('magazzino', 'fn_modifica_lotto'), ('magazzino', 'fn_modifica_magazzino'), ('magazzino', 'fn_modifica_riga_documento_interno'), ('magazzino', 'fn_modifica_ubicazione'), ('magazzino', 'fn_posta_inventario'), ('magazzino', 'fn_posta_rettifica'), ('magazzino', 'fn_posta_trasferimento'), ('magazzino', 'fn_togli_riga_documento_interno'), ('magazzino', 'trgfn_ubicazioni_guard_parent'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_aggiungi_asset(
                  p_articolo_id  magazzino.assets.articolo_id%TYPE,
                  p_seriale      magazzino.assets.seriale%TYPE,
                  p_stato_id     magazzino.assets.stato_id%TYPE,
                  p_ownership_id magazzino.assets.ownership_id%TYPE,
                  p_campi        jsonb DEFAULT '{}'::jsonb)
               RETURNS magazzino.assets.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              BEGIN
                  -- Scopo: il gesto «nuovo seriale» dell'operatore: livello
                  --   TUTTO sull'oggetto, poi il BB. L'emittente e' quello della
                  --   sessione; il perimetro lo dice il guard della tabella.
                  --   Ritorna l'id.
                  PERFORM script.fn_guard_livello(
                      script.fn_utente_di_sessione('magazzino.fn_aggiungi_asset'),
                      'magazzino', 'assets', 'TUTTO');

                  RETURN magazzino.fn_crea_asset(p_articolo_id, p_seriale, p_stato_id,
                                                 p_ownership_id, p_campi);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_aggiungi_inventario(
                  p_magazzino_id magazzino.inventari.magazzino_id%TYPE,
                  p_campi        jsonb DEFAULT '{}'::jsonb)
               RETURNS magazzino.inventari.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente config.user_override_oggetti.auth_user_id%TYPE;
                  v_campi  jsonb := COALESCE(p_campi, '{}'::jsonb);
              BEGIN
                  -- Scopo: il gesto «nuovo inventario» dell'operatore nel
                  --   magazzino p_magazzino_id. Ritorna l'id.
                  v_utente := script.fn_utente_di_sessione('magazzino.fn_aggiungi_inventario');
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'inventari', 'TUTTO');
                  PERFORM magazzino.fn_guard_magazzino_nel_perimetro(
                      p_magazzino_id, v_utente, 'magazzino.fn_aggiungi_inventario');
                  PERFORM script.fn_guard_campi_ammessi(
                      v_campi, magazzino.fn_documento_interno_colonne_ammesse('INVENTARIO', 'testata', 'crea'),
                      'magazzino', 'magazzino.fn_aggiungi_inventario',
                      jsonb_build_object('magazzino_id', p_magazzino_id));

                  RETURN (script.fn_scrivi_riga_da_jsonb(
                              'magazzino.inventari'::regclass,
                              jsonb_strip_nulls(v_campi || jsonb_build_object('magazzino_id', p_magazzino_id)))
                          ->> 'id')::bigint;
              END;
              $function$;
