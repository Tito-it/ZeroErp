              CREATE OR REPLACE FUNCTION magazzino.fn_aggiungi_trasferimento(
                  p_magazzino_id_from magazzino.trasferimenti.magazzino_id_from%TYPE,
                  p_magazzino_id_to   magazzino.trasferimenti.magazzino_id_to%TYPE,
                  p_campi             jsonb DEFAULT '{}'::jsonb)
               RETURNS magazzino.trasferimenti.id%TYPE
