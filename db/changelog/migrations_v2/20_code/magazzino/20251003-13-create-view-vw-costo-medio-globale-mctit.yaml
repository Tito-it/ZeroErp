databaseChangeLog:

  - changeSet:
      id: 20251003-13-create-view-vw-costo-medio-globale
      author: mctit
      logicalFilePath: migrations_v2/20_code/20251003-13-create-view-vw-costo-medio-globale.yaml
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW magazzino.vw_costo_medio_globale AS
              SELECT
                articolo_id,
                SUM(qta)   AS qta_tot,
                SUM(valore) AS valore_tot,
                CASE WHEN SUM(qta) <> 0 THEN SUM(valore) / SUM(qta) ELSE NULL END AS costo_medio_globale
              FROM magazzino.costo_medio
              GROUP BY articolo_id;
