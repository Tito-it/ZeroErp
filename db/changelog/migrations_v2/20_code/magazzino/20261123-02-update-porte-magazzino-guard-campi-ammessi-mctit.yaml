              CREATE OR REPLACE FUNCTION magazzino.fn_crea_asset(
                  p_articolo_id          magazzino.assets.articolo_id%TYPE,
                  p_seriale              magazzino.assets.seriale%TYPE,
                  p_stato_id             magazzino.assets.stato_id%TYPE,
                  p_ownership_id         magazzino.assets.ownership_id%TYPE,
                  p_campi                jsonb DEFAULT '{}'::jsonb,
                  p_emittente_fiscale_id magazzino.assets.emittente_fiscale_id%TYPE DEFAULT NULL)
               RETURNS magazzino.assets.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_campi     jsonb := COALESCE(p_campi, '{}'::jsonb);
                  v_estranea  text;
                  -- Le colonne che il BB riceve come argomenti: non stanno in p_campi.
                  c_argomenti CONSTANT text[] := ARRAY['seriale', 'stato_id', 'ownership_id'];
                  v_ammesse   text[];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Creare il seriale p_seriale dell'articolo p_articolo_id:
                  --   stato, proprieta', i campi facoltativi di p_campi (le
                  --   assenti e le null al DEFAULT) e l'emittente (NULL =
                  --   quello della sessione, dal trigger). Ritorna l'id.
                  --
                  -- Regole:
                  --   - le chiavi ammesse in p_campi: la lista 'crea' di
                  --     magazzino.fn_assets_colonne_ammesse, tolti gli
                  --     argomenti; una chiave fuori elenco: E_CAMPO_NON_AMMESSO;
                  --   - perimetro, padri attivi, unicita': i guard della tabella.
                  -- =========================================================
                  IF jsonb_typeof(v_campi) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_crea_asset', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo_campi', jsonb_typeof(v_campi)),
                          NULL::uuid,
                          'magazzino.fn_crea_asset',
                          'i campi non sono un oggetto');
                  END IF;

                  v_ammesse := ARRAY(SELECT c
                                       FROM unnest(magazzino.fn_assets_colonne_ammesse('crea')) AS c
                                      WHERE c <> ALL (c_argomenti));

                  v_estranea := script.fn_prima_chiave_estranea(v_campi, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_crea_asset', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'seriale', p_seriale),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- jsonb_strip_nulls: anche l'emittente NULL resta fuori, e lo
                  -- mette il trigger dalla sessione.
                  RETURN (script.fn_scrivi_riga_da_jsonb(
                              'magazzino.assets'::regclass,
                              jsonb_strip_nulls(
                                  v_campi
                                  || jsonb_build_object('articolo_id',          p_articolo_id,
                                                        'seriale',              p_seriale,
                                                        'stato_id',             p_stato_id,
                                                        'ownership_id',         p_ownership_id,
                                                        'emittente_fiscale_id', p_emittente_fiscale_id)))
                          ->> 'id')::bigint;
              END;
              $function$;
              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_magazzino(
                  p_id   magazzino.magazzini.id%TYPE,
                  p_dati jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_oggetti.auth_user_id%TYPE;
                  v_ammesse  text[];
                  v_estranea text;
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica il magazzino» dell'operatore: il
                  --   delta p_dati sulle colonne modificabili. Ritorna la riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'magazzini', 'TUTTO');

                  IF p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_magazzino', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('id', p_id, 'tipo_dati', jsonb_typeof(p_dati)),
                          NULL::uuid,
                          'magazzino.fn_modifica_magazzino',
                          'i dati non sono un oggetto');
                  END IF;

                  v_ammesse  := magazzino.fn_magazzini_colonne_ammesse('modifica');
                  v_estranea := script.fn_prima_chiave_estranea(p_dati, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_magazzino', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'id', p_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- No-leak: fuori perimetro e inesistente rispondono uguale.
                  PERFORM 1
                     FROM magazzino.magazzini mg
                    WHERE mg.id = p_id
                      AND script.fn_check_user_emittente_scope(v_utente, mg.emittente_fiscale_id)
                      FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_magazzino', 'E_MAG_MAGAZZINO_NON_TROVATO',
                          jsonb_build_object('magazzino_id', p_id),
                          NULL::uuid,
                          COALESCE(p_id::text, '(nessuno)'));
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                'magazzino.magazzini'::regclass, p_dati, jsonb_build_object('id', p_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;
              CREATE OR REPLACE FUNCTION magazzino.fn_modifica_ubicazione(
                  p_magazzino_id magazzino.ubicazioni.magazzino_id%TYPE,
                  p_id           magazzino.ubicazioni.id%TYPE,
                  p_dati         jsonb)
               RETURNS jsonb
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_oggetti.auth_user_id%TYPE;
                  v_ammesse  text[];
                  v_estranea text;
                  v_riga     jsonb;
              BEGIN
                  -- Scopo: il gesto «modifica l'ubicazione» dell'operatore,
                  --   dentro il suo magazzino: il delta p_dati sulle colonne
                  --   modificabili. Ritorna la riga.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  PERFORM script.fn_guard_livello(v_utente, 'magazzino', 'ubicazioni', 'TUTTO');

                  IF p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_ubicazione', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('magazzino_id', p_magazzino_id, 'id', p_id,
                                             'tipo_dati', jsonb_typeof(p_dati)),
                          NULL::uuid,
                          'magazzino.fn_modifica_ubicazione',
                          'i dati non sono un oggetto');
                  END IF;

                  v_ammesse  := magazzino.fn_ubicazioni_colonne_ammesse('modifica');
                  v_estranea := script.fn_prima_chiave_estranea(p_dati, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_ubicazione', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'magazzino_id', p_magazzino_id,
                                             'id', p_id),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- No-leak: fuori perimetro, di un altro magazzino o
                  -- inesistente rispondono uguale.
                  PERFORM 1
                     FROM magazzino.ubicazioni u
                    WHERE u.id = p_id
                      AND u.magazzino_id = p_magazzino_id
                      AND script.fn_scope_ef_whitelist_via_magazzino(v_utente, u.magazzino_id)
                      FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_modifica_ubicazione', 'E_MAG_UBICAZIONE_NON_TROVATA',
                          jsonb_build_object('magazzino_id', p_magazzino_id, 'ubicazione_id', p_id),
                          NULL::uuid,
                          COALESCE(p_id::text, '(nessuna)'));
                  END IF;

                  v_riga := script.fn_scrivi_riga_da_jsonb(
                                'magazzino.ubicazioni'::regclass, p_dati, jsonb_build_object('id', p_id));

                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id' OR e.key = ANY (v_ammesse));
              END;
              $function$;
