# IL CLIENTE DI UN SERIALE E' DELLA SUA AZIENDA
#   trg_assets_a10_guard_emittente_ba_ins_upd su magazzino.assets, col BB
#   script.trgfn_doc_guard_emittente_ba (lo stesso di ordini, contratti, DDT,
#   preventivi, offerte, resi e commesse).
#   Brief: brief-db-magazzino-tutte-le-scritture-dal-verbo, §5.3 (Tid
#   2026-11-22: «seriale a», il controllo subito).
#
# -- PERCHE' --------------------------------------------------------------
#   assets.billing_account_id (facoltativo, fra i campi della nascita del
#   seriale) non era confrontato con l'emittente del seriale: un seriale
#   dell'azienda A poteva puntare al cliente dell'azienda B. Sul modello e'
#   sbagliato chiunque scriva: la regola la dice la tabella.
#   Fatto datato (2026-11-22, dbdev): zero seriali con un BA, quindi nessun
#   pregresso da bonificare.
#
# -- LO STAMPO ----------------------------------------------------------
#   BEFORE INSERT OR UPDATE OF billing_account_id, emittente_fiscale_id, come
#   sui documenti. Argomenti: etichetta 'Seriale', colonna che lo identifica
#   'seriale', colonna dell'emittente, codice E_DOC_EMITTENTE_BA_INCOERENTE
#   (DATO_ERRATO, campo emittente_fiscale_id). BA NULL: il guard esce.
#   ⭐ Ordina dopo trg_assets_a10_default_emittente_ins ('default' <
#   'guard'): quando confronta, l'emittente c'e' gia'.
#
# -- NIENTE preCondition SUI TRIGGER (§11.5) ----------------------------
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20261122-12-create-trigger-guard-emittente-ba-assets-mctit.yaml

  - changeSet:
      id: 20261122-12-create-trigger-guard-emittente-ba-assets
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il guard script.trgfn_doc_guard_emittente_ba montato su magazzino.assets: il cliente
        (billing_account_id) di un seriale e' dell'azienda del seriale, come sui documenti di vendita.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'trgfn_doc_guard_emittente_ba';
            - columnExists:
                schemaName: magazzino
                tableName: assets
                columnName: billing_account_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_assets_a10_guard_emittente_ba_ins_upd ON magazzino.assets;
              CREATE TRIGGER trg_assets_a10_guard_emittente_ba_ins_upd
                  BEFORE INSERT OR UPDATE OF billing_account_id, emittente_fiscale_id
                  ON magazzino.assets
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_guard_emittente_ba(
                      'Seriale', 'seriale', 'emittente_fiscale_id', 'E_DOC_EMITTENTE_BA_INCOERENTE');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_assets_a10_guard_emittente_ba_ins_upd ON magazzino.assets;
