databaseChangeLog:

  - changeSet:
      id: 20251003-11-create-view-vw-costo-medio
      author: mctit
      logicalFilePath: migrations_v2/20_code/20251003-11-create-view-vw-costo-medio.yaml
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW magazzino.vw_costo_medio AS
              SELECT
                cm.articolo_id,
                cm.magazzino_id,
                cm.qta,
                cm.valore,
                CASE WHEN cm.qta <> 0 THEN cm.valore / cm.qta ELSE NULL END AS costo_medio
              FROM magazzino.costo_medio cm;