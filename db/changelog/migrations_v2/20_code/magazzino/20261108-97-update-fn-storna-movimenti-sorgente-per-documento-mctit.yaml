# LO STORNO PER DOCUMENTO: magazzino.fn_storna_movimenti_sorgente
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto M, giro M.1 (scheda magazzino §2.4, §4).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Lo storno cercava i movimenti per (tipo di foglia, elenco di foglie): i due
#   verbi che lo chiamano raccoglievano a mano l'array dei prelievi della bolla
#   o dei rientri del reso, cioe' traducevano «documento -> foglie». Nel modello
#   il movimento porta il documento: si storna per documento, e la traduzione
#   sparisce.
#
# ── LA FIRMA ─────────────────────────────────────────────────────────
#   I due parametri di prima restano al loro posto; in coda, DEFAULT NULL, la
#   chiave del documento: p_sorgente_id | p_sorgente_uid, una sola, obbligatoria.
#   p_sorgente_righe cambia significato: da «le foglie» a «le righe del
#   documento» (sorgente_riga). NULL = TUTTO il documento (prima NULL era un
#   errore); un array = solo quelle righe; vuoto = niente. Un chiamante della
#   firma di prima (tipo + foglie, senza documento) riceve
#   E_MAG_CHIAMATA_NON_VALIDA, non uno storno sbagliato.
#   Resta generica: non nomina nessuna tabella di vendite (vincolo d'anello,
#   dbops.vw_magazzino_dipendenze_inverse).
#   Lo specchio copia le cinque colonne della provenienza; la primitiva
#   (20261108-96) lo verifica al passo 9.
#   La lettura per documento usa le prime due colonne di uq_mag_movimenti_identita.
#   RISERVATA come prima: REVOKE da PUBLIC e dall'app (i privilegi di default
#   la darebbero all'app alla CREATE); la postura la tiene v_fn_riservate
#   del loop 90_end/ci_apply/20260205-41 (per nome).
#   Rollback: forward-only.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20261108-97-update-fn-storna-movimenti-sorgente-per-documento-mctit.yaml

  - changeSet:
      id: 20261108-97-update-fn-storna-movimenti-sorgente-per-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        magazzino.fn_storna_movimenti_sorgente: storna per documento (chiave del documento in
        coda, obbligatoria; righe facoltative, NULL = tutto il documento), lo specchio copia la
        provenienza intera. brief-db-sorgente-documento-e-riga §7.2 lotto M, giro M.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION magazzino.fn_storna_movimenti_sorgente(
                  magazzino.movimenti.sorgente_tipo_id%TYPE, bigint[]);

              CREATE FUNCTION magazzino.fn_storna_movimenti_sorgente(
                  p_sorgente_tipo_id magazzino.movimenti.sorgente_tipo_id%TYPE,
                  p_sorgente_righe   bigint[],
                  p_sorgente_id      magazzino.movimenti.sorgente_id%TYPE  DEFAULT NULL,
                  p_sorgente_uid     magazzino.movimenti.sorgente_uid%TYPE DEFAULT NULL
              )
              RETURNS TABLE(movimento_id           magazzino.movimenti.id%TYPE,
                            storno_di_movimento_id magazzino.movimenti.storno_di_movimento_id%TYPE,
                            qta                    magazzino.movimenti.qta%TYPE)
              LANGUAGE plpgsql
              VOLATILE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              -- Scopo: stornare tutti i movimenti di un documento (tipo + chiave del
              --   documento; facoltativamente solo alcune sue righe) che non sono uno
              --   storno e non sono gia' stornati, dal piu' recente. Lo specchio lo
              --   compone QUI, dall'originale, e lo scrive la primitiva nel suo ramo
              --   storno (M-8). Ritorna un record per storno.
              -- ⚠️ p_sorgente_righe e' bigint[] e non %TYPE[]: la sintassi non esiste.
              DECLARE
                  v_orig magazzino.movimenti%ROWTYPE;
              BEGIN
                  IF p_sorgente_tipo_id IS NULL OR p_sorgente_tipo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_storna_movimenti_sorgente',
                          'E_MAG_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'tipo di sorgente obbligatorio e maggiore di zero',
                                             'p_sorgente_tipo_id', p_sorgente_tipo_id),
                          NULL::uuid, 'magazzino.fn_storna_movimenti_sorgente',
                          'p_sorgente_tipo_id (obbligatorio, maggiore di zero)');
                  END IF;
                  IF num_nonnulls(p_sorgente_id, p_sorgente_uid) <> 1
                     OR (p_sorgente_id IS NOT NULL AND p_sorgente_id <= 0) THEN
                      PERFORM script.fn_log_and_raise_error('magazzino', 'magazzino.fn_storna_movimenti_sorgente',
                          'E_MAG_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'una sola chiave del documento (id maggiore di zero, o uid)',
                                             'p_sorgente_id', p_sorgente_id, 'p_sorgente_uid', p_sorgente_uid),
                          NULL::uuid, 'magazzino.fn_storna_movimenti_sorgente',
                          'p_sorgente_id / p_sorgente_uid (esattamente una: il documento da stornare)');
                  END IF;

                  FOR v_orig IN
                      SELECT m.*
                        FROM magazzino.movimenti m
                       WHERE m.sorgente_tipo_id = p_sorgente_tipo_id
                         AND m.sorgente_id  IS NOT DISTINCT FROM p_sorgente_id
                         AND m.sorgente_uid IS NOT DISTINCT FROM p_sorgente_uid
                         AND (p_sorgente_righe IS NULL OR m.sorgente_riga = ANY (p_sorgente_righe))
                         AND m.storno_di_movimento_id IS NULL
                         AND NOT EXISTS (SELECT 1 FROM magazzino.movimenti s
                                          WHERE s.storno_di_movimento_id = m.id)
                       ORDER BY m.id DESC
                  LOOP
                      movimento_id := magazzino.fn_scrivi_movimento(
                          p_magazzino_id           => v_orig.magazzino_id,
                          p_articolo_id            => v_orig.articolo_id,
                          p_causale                => CASE WHEN v_orig.qta < 0 THEN 'STORNO_POS' ELSE 'STORNO_NEG' END,
                          p_qta                    => -v_orig.qta,
                          p_sorgente_tipo_id       => v_orig.sorgente_tipo_id,
                          p_sorgente_id            => v_orig.sorgente_id,
                          p_sorgente_uid           => v_orig.sorgente_uid,
                          p_sorgente_riga          => v_orig.sorgente_riga,
                          p_sorgente_dettaglio     => v_orig.sorgente_dettaglio,
                          p_lotto_id               => v_orig.lotto_id,
                          p_asset_id               => v_orig.asset_id,
                          p_ubicazione_id          => v_orig.ubicazione_id,
                          p_data_mov               => now(),
                          p_storno_di_movimento_id => v_orig.id);
                      storno_di_movimento_id := v_orig.id;
                      qta                    := -v_orig.qta;
                      RETURN NEXT;
                  END LOOP;
                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_storna_movimenti_sorgente(
                  magazzino.movimenti.sorgente_tipo_id%TYPE, bigint[],
                  magazzino.movimenti.sorgente_id%TYPE, magazzino.movimenti.sorgente_uid%TYPE) IS
                  'La utility di storno (M-8), per DOCUMENTO: per ogni movimento del documento (p_sorgente_tipo_id + la sua chiave, p_sorgente_id o p_sorgente_uid, una sola e obbligatoria) che non e'' uno storno e non e'' gia'' stornato, dal piu'' recente, scrive lo SPECCHIO attraverso il ramo storno di magazzino.fn_scrivi_movimento: stessa provenienza intera (tipo, documento, riga, dettaglio), articolo, magazzino e posizione (lotto, seriale, ubicazione), quantita'' opposta, causale STORNO_POS (se l''originale era un''uscita) o STORNO_NEG, costo dell''originale (lo mette la primitiva). p_sorgente_righe restringe alle righe del documento indicate (sorgente_riga); NULL = tutto il documento, vuoto = niente. Lo specchio lo compone il programma leggendo l''originale: non puo'' divergere. Lo storno doppio lo rifiuta la primitiva (uq_mag_movimenti_storno_di). Ritorna (movimento_id, storno_di_movimento_id, qta) per storno. Generica: non nomina le tabelle dei documenti. SECURITY DEFINER, RISERVATA: la chiamano i verbi (vendite.fn_cambia_stato_ddt all''annullo di una bolla emessa, vendite.fn_annulla_reso all''annullo di un reso confermato). Brief: brief-db-magazzino-lotto-3-scarico-da-ddt (P-8); brief-db-sorgente-documento-e-riga lotto M (per documento).';

              REVOKE EXECUTE ON FUNCTION magazzino.fn_storna_movimenti_sorgente(
                  magazzino.movimenti.sorgente_tipo_id%TYPE, bigint[],
                  magazzino.movimenti.sorgente_id%TYPE, magazzino.movimenti.sorgente_uid%TYPE) FROM PUBLIC, zeroerp_app;
