# BB: CREARE UN LOTTO DI MAGAZZINO
#   magazzino.fn_crea_lotto(articolo, codice, data_arrivo, campi): la riga di
#   magazzino.lotti. Ritorna l'id.
#   Brief: brief-db-magazzino-tutte-le-scritture-dal-verbo, D-M2 (la nascita
#   sul BB fn_crea_*, stampo magazzino.fn_crea_magazzino).
#
#   ⚠️ Non e' dbops.fn_pgtap_crea_lotto: quello e' il builder dei lotti di
#   FATTURAZIONE (vendite.fatturazione_lotti), un'altra cosa.
#
# -- CHI ERA LA COPIA ---------------------------------------------------
#   * il backend, AnagraficheMagazzinoRepository.create_lotto
#     (execute_dynamic_insert): passa al verbo di nascita (R-1 al BE);
#   * gli INSERT diretti delle fixture pgTAP: passano al builder (brief §5.1).
#
# -- LE SCELTE ----------------------------------------------------------
#   * articolo, codice e data di arrivo sono argomenti: NOT NULL della
#     tabella. L'articolo e' l'identita' della nascita;
#   * in p_campi le altre colonne della lista 'crea' di
#     magazzino.fn_lotti_colonne_ammesse; una chiave fuori lista si rifiuta
#     col suo nome, una chiave a null vale assente;
#   * attivo non e' un campo: un lotto nasce attivo.
#
# -- CHE COSA RESTA FUORI, apposta ---------------------------------------
#   * il permesso: lo controlla chi chiama (il verbo di nascita). INVOKER;
#   * articolo attivo, codice non vuoto, scadenza non prima dell'arrivo,
#     unicita' del codice per articolo: i guard e i vincoli della tabella.
#     Un lotto non ha perimetro d'emittente: e' dell'articolo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20261122-04-create-fn-crea-lotto-mctit.yaml

  - changeSet:
      id: 20261122-04-create-fn-crea-lotto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Crea magazzino.fn_crea_lotto: la riga di magazzino.lotti, con articolo, codice e data di
        arrivo come argomenti e le altre colonne ammesse in p_campi.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'magazzino' AND p.proname = 'fn_lotti_colonne_ammesse';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION magazzino.fn_crea_lotto(
                  p_articolo_id magazzino.lotti.articolo_id%TYPE,
                  p_codice      magazzino.lotti.codice%TYPE,
                  p_data_arrivo magazzino.lotti.data_arrivo%TYPE,
                  p_campi       jsonb DEFAULT '{}'::jsonb)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_campi     jsonb := COALESCE(p_campi, '{}'::jsonb);
                  v_estranea  text;
                  -- Le colonne che il BB riceve come argomenti: non stanno in p_campi.
                  c_argomenti CONSTANT text[] := ARRAY['codice', 'data_arrivo'];
                  v_ammesse   text[];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Creare un lotto dell'articolo p_articolo_id: codice, data
                  --   di arrivo e i campi facoltativi di p_campi (le assenti e
                  --   le null al DEFAULT). Ritorna l'id.
                  --
                  -- Regole:
                  --   - le chiavi ammesse in p_campi: la lista 'crea' di
                  --     magazzino.fn_lotti_colonne_ammesse, tolti gli argomenti;
                  --     una chiave fuori elenco: E_CAMPO_NON_AMMESSO;
                  --   - articolo attivo, date, unicita': guard e vincoli.
                  -- =========================================================
                  IF jsonb_typeof(v_campi) <> 'object' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_crea_lotto', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo_campi', jsonb_typeof(v_campi)),
                          NULL::uuid,
                          'magazzino.fn_crea_lotto',
                          'i campi non sono un oggetto');
                  END IF;

                  v_ammesse := ARRAY(SELECT c
                                       FROM unnest(magazzino.fn_lotti_colonne_ammesse('crea')) AS c
                                      WHERE c <> ALL (c_argomenti));

                  v_estranea := script.fn_prima_chiave_estranea(v_campi, v_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'magazzino', 'magazzino.fn_crea_lotto', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'codice', p_codice),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  RETURN (script.fn_scrivi_riga_da_jsonb(
                              'magazzino.lotti'::regclass,
                              jsonb_strip_nulls(
                                  v_campi
                                  || jsonb_build_object('articolo_id', p_articolo_id,
                                                        'codice',      p_codice,
                                                        'data_arrivo', p_data_arrivo)))
                          ->> 'id')::bigint;
              END;
              $function$;

              COMMENT ON FUNCTION magazzino.fn_crea_lotto(
                  magazzino.lotti.articolo_id%TYPE,
                  magazzino.lotti.codice%TYPE,
                  magazzino.lotti.data_arrivo%TYPE,
                  jsonb) IS
                  'BB: crea un lotto di magazzino, cioe'' la riga di magazzino.lotti, in una sola istruzione. Articolo, codice e data di arrivo sono argomenti (NOT NULL della tabella; l''articolo e'' l''identita'' della nascita); in p_campi le altre colonne della lista crea di magazzino.fn_lotti_colonne_ammesse (le assenti e le null al DEFAULT; una chiave fuori lista: E_CAMPO_NON_AMMESSO col suo nome). attivo non e'' un campo: un lotto nasce attivo. Articolo attivo, codice non vuoto, scadenza non prima dell''arrivo e unicita'' del codice per articolo li dicono i guard e i vincoli della tabella. Un lotto non ha perimetro d''emittente. Non controlla il permesso: lo controlla chi lo chiama (il verbo di nascita). Scrive con script.fn_scrivi_riga_da_jsonb. INVOKER. Ritorna l''id.';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS magazzino.fn_crea_lotto(uuid, character varying, date, jsonb);
