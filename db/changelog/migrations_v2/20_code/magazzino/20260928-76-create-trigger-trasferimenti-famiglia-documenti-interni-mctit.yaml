# P-10 — Il trasferimento interno entra nella famiglia dei documenti interni
#   trg_trasferimenti_a10_guard_transizione_upd_dlt
#   trg_trasferimenti_righe_a10_guard_testata_ins_upd_dlt
#   Brief: brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 4 (P-10);
#          Lotto 2 D-L2-h (la matrice delle tre famiglie e' la stessa)
#
# -- PERCHE' --------------------------------------------------------------------------------------
#   D-L2-h lo aveva gia' scritto: tolto COUNTING, inventari, rettifiche e
#   trasferimenti hanno LA STESSA matrice (DRAFT -> CONFIRM -> POSTED, CANCEL),
#   e chk_mag_trasferimenti_stato ha gia' quei quattro valori. Mancava solo
#   montare i due guard parametrici — la matrice con la porta POSTED (GUC +
#   proprietario, D-V1) e le righe scrivibili solo in bozza — che finora
#   servivano due famiglie. Da oggi tre: nessun codice nuovo, due CREATE
#   TRIGGER con i loro argomenti.
#
# -- GLI ARGOMENTI --------------------------------------------------------------------------------
#   colonna di stato   stato_trasferimento
#   GUC di posting     zeroerp.magazzino_posting_trasferimento  (la scrive
#                      magazzino.fn_posta_trasferimento, 20260928-79)
#   testata / FK       trasferimenti / trasferimento_id
#
# -- NIENTE DDL SU TRIGGER DI ci_apply ------------------------------------------------------------
#   Sono trigger scritti a mano, con nomi nuovi: il §11.5 non si applica.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20260928-76-create-trigger-trasferimenti-famiglia-documenti-interni-mctit.yaml

  - changeSet:
      id: 20260928-76-create-trigger-trasferimenti-famiglia-documenti-interni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il trasferimento interno entra nella famiglia dei documenti interni di magazzino (D-L2-h):
        i due guard parametrici — matrice degli stati con la porta POSTED, righe scrivibili solo in
        bozza — montati su trasferimenti e trasferimenti_righe. Brief:
        brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 4 (P-10).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "2"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'magazzino'
                     AND p.proname IN ('trgfn_documento_interno_guard_transizione',
                                       'trgfn_documento_interno_righe_guard_testata');
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_trigger t
                   WHERE t.tgname IN ('trg_trasferimenti_a10_guard_transizione_upd_dlt',
                                      'trg_trasferimenti_righe_a10_guard_testata_ins_upd_dlt');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_trasferimenti_a10_guard_transizione_upd_dlt
                  BEFORE UPDATE OF stato_trasferimento OR DELETE ON magazzino.trasferimenti
                  FOR EACH ROW EXECUTE FUNCTION magazzino.trgfn_documento_interno_guard_transizione(
                      'stato_trasferimento', 'zeroerp.magazzino_posting_trasferimento');

              CREATE TRIGGER trg_trasferimenti_righe_a10_guard_testata_ins_upd_dlt
                  BEFORE INSERT OR UPDATE OR DELETE ON magazzino.trasferimenti_righe
                  FOR EACH ROW EXECUTE FUNCTION magazzino.trgfn_documento_interno_righe_guard_testata(
                      'trasferimenti', 'trasferimento_id', 'stato_trasferimento',
                      'zeroerp.magazzino_posting_trasferimento');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_trasferimenti_righe_a10_guard_testata_ins_upd_dlt ON magazzino.trasferimenti_righe;
              DROP TRIGGER IF EXISTS trg_trasferimenti_a10_guard_transizione_upd_dlt ON magazzino.trasferimenti;
