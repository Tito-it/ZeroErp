# P-5 — IL DEFAULT DELL'EMITTENTE SI MONTA: MAGAZZINO.MAGAZZINI, MAGAZZINO.ASSETS
#   trg_magazzini_a10_default_emittente_ins · trg_assets_a10_default_emittente_ins
#   -> script.trgfn_default_emittente_fiscale('SOLLEVA')
#   Brief: brief-db-emittente-di-default-un-bb-solo, sezione 5 (P-5, D2)
#
# -- PERCHE' ---------------------------------------------------------------------
#   Sono le due ancore del perimetro di magazzino (Lotto 1, P-7:
#   emittente_fiscale_id NOT NULL + trgfn_guard_emittente_scope), e sono il
#   MOTIVO di questo brief: magazzini e' nel CRUD generico del pannello admin
#   (CONFIG_TABLES), che mostra emittente_fiscale_id come intero da digitare
#   — vuoto, l'INSERT muore con 23502. Con il default, dal pannello si puo'
#   lasciare vuoto e vale l'emittente di lavoro; un super admin in modalita'
#   «tutti gli emittenti» lo dichiara, o legge E_EMITTENTE_NON_RISOLTO.
#   Il Lotto 2 (primitiva, inventario iniziale) presuppone questo passo: il
#   primo magazzino vero nasce li'.
#   Ordine: trg_magazzini_a10_default_emittente_ins precede
#   _a10_guard_emittente_scope_ins_upd e trg_magazzini_normalize_ins_upd;
#   idem su assets (solo lo scope guard).
#
# -- LA FORMA -------------------------------------------------------------------
#   Modo SOLLEVA: un valore esplicito non si tocca; senza valore e senza
#   nessuno da cui dedurlo -> E_EMITTENTE_NON_RISOLTO (DATO_ERRATO, campo
#   emittente_fiscale_id). Il nome del trigger segue lo stampo di vendite
#   (trg_<t>_a10_default_emittente_ins): i BEFORE ROW scattano in ordine
#   alfabetico e «default_» viene prima di «guard_» — e' l'ordine che serve
#   (D5), e il pgTAP di P-6 lo asserisce per ogni tabella montata.
#   preCondition HALT: la colonna esiste e il trigger non c'e' ancora — un
#   CREATE TRIGGER su un nome gia' presente fermerebbe il migrate con 42710,
#   e qui si vuole che lo dica prima.
#
# Dipendenze: 20260915-36 (il BB). Verifica:
#   db/pgtap/script/test-trgfn-default-emittente-fiscale-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/magazzino/20260915-43-create-trigger-default-emittente-magazzini-assets-mctit.yaml

  - changeSet:
      id: 20260915-43-create-trigger-default-emittente-magazzini-assets
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        magazzino.magazzini, magazzino.assets: trigger BEFORE INSERT trg_<t>_a10_default_emittente_ins su
        script.trgfn_default_emittente_fiscale('SOLLEVA') — l'emittente di default dalla
        sessione, dove oggi mancava (23502). Brief: brief-db-emittente-di-default-un-bb-solo
        (P-5, D2).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'trgfn_default_emittente_fiscale';
            - columnExists:
                schemaName: magazzino
                tableName: magazzini
                columnName: emittente_fiscale_id
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT count(*)
                    FROM pg_trigger
                   WHERE tgrelid = 'magazzino.magazzini'::regclass
                     AND tgname = 'trg_magazzini_a10_default_emittente_ins';
            - columnExists:
                schemaName: magazzino
                tableName: assets
                columnName: emittente_fiscale_id
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT count(*)
                    FROM pg_trigger
                   WHERE tgrelid = 'magazzino.assets'::regclass
                     AND tgname = 'trg_assets_a10_default_emittente_ins';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_magazzini_a10_default_emittente_ins
                  BEFORE INSERT
                  ON magazzino.magazzini
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_default_emittente_fiscale('SOLLEVA');

              CREATE TRIGGER trg_assets_a10_default_emittente_ins
                  BEFORE INSERT
                  ON magazzino.assets
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_default_emittente_fiscale('SOLLEVA');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_magazzini_a10_default_emittente_ins ON magazzino.magazzini;
              DROP TRIGGER IF EXISTS trg_assets_a10_default_emittente_ins ON magazzino.assets;
