# ------------------------------------------------------------
# P-1 — ANTI-LOCKOUT SUL BLOCCO DELL'ADMIN:
#   config.trgfn_credenziali_guard_ultimo_super_admin() + trigger su config.credenziali
#   Brief: brief-db-blocco-login-per-credenziale, sezione 3.3
#
# ── ⭐ LA STESSA REGOLA, LA TERZA PORTA ──────────────────────────────
#   Il sistema deve restare con almeno un SUPER_ADMIN raggiungibile. Ci sono
#   gia' due guard che lo difendono — sui binding (config.trgfn_profili_
#   accesso_bindings_guard_ultimo_super_admin) e sulle identita'
#   (anagrafiche.trgfn_identita_digitali_guard_ultimo_super_admin) — e tutti e
#   due chiedono a script.fn_check_almeno_un_super_admin_attivo. Il blocco
#   dell'admin e' la terza strada per spegnere un SUPER_ADMIN, e questo guard
#   chiede alla stessa sede, che da 20260925-12 conosce il blocco.
#   ⭐ Stampo del guard sulle identita': short-circuit se la transizione non
#   blocca, short-circuit se la credenziale non portava un binding
#   SUPER_ADMIN attivo, poi la verifica sullo stato DOPO.
#
# ── ⚠️ AFTER, INSERT O UPDATE OF bloccata_at ─────────────────────────
#   AFTER come i gemelli: la verifica guarda lo stato gia' scritto. INSERT
#   perche' il verbo di blocco fa un upsert, e su una credenziale senza riga il
#   blocco nasce da un INSERT. UPDATE OF bloccata_at: le altre colonne (i
#   tentativi, il cambio password) non spengono nessuno.
#   Bloccare se' stessi passa di qui come ogni altro blocco.
#
# Codice riusato: E_PROFILO_ULTIMO_SUPER_ADMIN, lo stesso dei gemelli («rimarrebbe
# zero SUPER_ADMIN attivi») — stesso rifiuto, stessa frase.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260925-18-create-trgfn-credenziali-guard-ultimo-super-admin-mctit.yaml

  - changeSet:
      id: 20260925-18-create-trgfn-credenziali-guard-ultimo-super-admin
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.trgfn_credenziali_guard_ultimo_super_admin + trigger AFTER INSERT OR UPDATE OF
        bloccata_at su config.credenziali: il blocco dell'admin non puo' spegnere l'ultimo
        SUPER_ADMIN raggiungibile. Chiede a fn_check_almeno_un_super_admin_attivo come i guard su
        binding e identita'; E_PROFILO_ULTIMO_SUPER_ADMIN. Brief:
        brief-db-blocco-login-per-credenziale §3.3.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: config, tableName: credenziali }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_credenziali_guard_ultimo_super_admin()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: impedire che il blocco dell'admin lasci il sistema senza
              --   SUPER_ADMIN raggiungibili.
              -- Regole (stampo di trgfn_identita_digitali_guard_ultimo_super_admin):
              --   1. solo la transizione «non bloccata -> bloccata»;
              --   2. solo se la credenziale portava un binding SUPER_ADMIN attivo;
              --   3. verifica sullo stato DOPO via fn_check_almeno_un_super_admin_attivo.
              DECLARE
                  v_era_super_admin boolean := false;
              BEGIN
                  IF NEW.bloccata_at IS NULL THEN
                      RETURN NULL;
                  END IF;
                  IF TG_OP = 'UPDATE' AND OLD.bloccata_at IS NOT NULL THEN
                      RETURN NULL;
                  END IF;

                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali    id
                        JOIN config.profili_accesso_bindings  pab
                          ON pab.identita_digitale_id = id.id
                        JOIN config.profili_accesso           pa
                          ON pa.id = pab.profilo_accesso_id
                       WHERE id.auth_user_id = NEW.auth_user_id
                         AND id.attivo  = true
                         AND pab.attivo = true
                         AND pa.attivo  = true
                         AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                  )
                  INTO v_era_super_admin;

                  IF NOT v_era_super_admin THEN
                      RETURN NULL;
                  END IF;

                  IF NOT script.fn_check_almeno_un_super_admin_attivo() THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_PROFILO_ULTIMO_SUPER_ADMIN',
                          jsonb_build_object('op',           TG_OP,
                                             'auth_user_id', NEW.auth_user_id,
                                             'bloccata_da',  NEW.bloccata_da),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_credenziali_guard_ultimo_super_admin() IS
                  'Guard anti-lockout sul blocco dell''amministratore: impedisce di bloccare la credenziale che porta l''ultimo SUPER_ADMIN raggiungibile. Terza porta della stessa regola dopo i guard su profili_accesso_bindings e identita_digitali: delega a script.fn_check_almeno_un_super_admin_attivo, che conosce il blocco (rev 2026-09-25). Solo la transizione non bloccata -> bloccata, solo se la credenziale portava un binding SUPER_ADMIN attivo. Codice E_PROFILO_ULTIMO_SUPER_ADMIN, lo stesso dei gemelli. Brief: brief-db-blocco-login-per-credenziale §3.3.';

              DROP TRIGGER IF EXISTS trg_credenziali_a10_guard_ultimo_super_admin_ins_upd ON config.credenziali;
              CREATE TRIGGER trg_credenziali_a10_guard_ultimo_super_admin_ins_upd
                  AFTER INSERT OR UPDATE OF bloccata_at ON config.credenziali
                  FOR EACH ROW
                  EXECUTE FUNCTION config.trgfn_credenziali_guard_ultimo_super_admin();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_credenziali_a10_guard_ultimo_super_admin_ins_upd ON config.credenziali;
              DROP FUNCTION IF EXISTS config.trgfn_credenziali_guard_ultimo_super_admin();
