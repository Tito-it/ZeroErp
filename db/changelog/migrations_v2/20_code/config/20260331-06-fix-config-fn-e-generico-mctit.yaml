databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/config/20260331-06-fix-config-fn-e-generico-mctit.yaml

    - changeSet:
          id: 20260331-06-fix-fn-get-stati-doc-fiscale
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_get_stati_doc_fiscale: E_GENERICO → E_PARAMETRO_INVALIDO
              per target non valido (deve essere LOTTO o FATTURA).
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_get_stati_doc_fiscale
                        --
                        -- Scopo: restituisce gli stati doc_fiscale validi per LOTTO
                        --        o FATTURA, con eventuale filtro transizioni ammesse.
                        --
                        -- Regole:
                        --   - p_target: 'LOTTO' o 'FATTURA' (obbligatorio)
                        --   - Se p_from_id IS NULL: tutti gli stati applicabili
                        --   - Se p_from_id valorizzato: solo transizioni ammesse
                        --
                        -- Fix 20260331: E_GENERICO → E_PARAMETRO_INVALIDO
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION config.fn_get_stati_doc_fiscale(
                            p_target  TEXT,
                            p_from_id config.stati_doc_fiscale.id%TYPE DEFAULT NULL
                        )
                        RETURNS SETOF config.stati_doc_fiscale
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_target TEXT := upper(btrim(p_target));
                        BEGIN
                            -- Guard: target valido
                            IF v_target NOT IN ('LOTTO', 'FATTURA') THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'config',
                                    'fn_get_stati_doc_fiscale',
                                    'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object(
                                        'parametro', 'p_target',
                                        'valore', p_target
                                    ),
                                    NULL::uuid,
                                    concat('p_target=', coalesce(p_target, 'NULL'), ' (ammessi: LOTTO, FATTURA)')
                                );
                            END IF;

                            -- Senza filtro: tutti gli stati applicabili
                            IF p_from_id IS NULL THEN
                                RETURN QUERY
                                SELECT s.*
                                  FROM config.stati_doc_fiscale s
                                 WHERE s.attivo
                                   AND (
                                     (v_target = 'LOTTO'   AND s.applica_lotto) OR
                                     (v_target = 'FATTURA' AND s.applica_fattura)
                                   )
                                 ORDER BY s.ordine NULLS LAST, s.id;
                                RETURN;
                            END IF;

                            -- Con filtro: solo transizioni ammesse
                            RETURN QUERY
                            SELECT s.*
                              FROM config.stati_doc_fiscale_transizioni t
                              JOIN config.stati_doc_fiscale s
                                ON s.id = t.stato_to_id
                             WHERE t.ammesso
                               AND t.stato_from_id = p_from_id
                               AND (
                                 (v_target = 'LOTTO'   AND t.solo_fattura = false) OR
                                 (v_target = 'FATTURA' AND t.solo_lotto = false)
                               )
                               AND (
                                 (v_target = 'LOTTO'   AND s.applica_lotto) OR
                                 (v_target = 'FATTURA' AND s.applica_fattura)
                               )
                               AND s.attivo
                             ORDER BY s.ordine NULLS LAST, s.id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION config.fn_get_stati_doc_fiscale(TEXT, BIGINT)
                          IS 'Restituisce stati validi per lotto/fattura e transizioni ammesse.';

    - changeSet:
          id: 20260331-06-fix-trgfn-tipi-ruoli-guard-entita-ref
          author: mctit
          runOnChange: false
          comment: >
              Fix trgfn_tipi_ruoli_guard_entita_ref: 3x E_GENERICO →
              E_TIPI_RUOLI_ENTITA_INVALIDA per tutti i guard strutturali.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- trgfn_tipi_ruoli_guard_entita_ref
                        --
                        -- Scopo: valida entita_tabella e entita_colonna_codice
                        --        su config.tipi_ruoli in INSERT/UPDATE.
                        --
                        -- Regole:
                        --   1. Se entita_tabella IS NULL → entita_colonna_codice deve essere NULL
                        --   2. entita_tabella deve essere un regclass valido
                        --   3. La tabella deve avere la colonna soggetto_ruolo_id
                        --   4. La colonna codice (default 'codice') deve esistere
                        --
                        -- Fix 20260331: 3x E_GENERICO → E_TIPI_RUOLI_ENTITA_INVALIDA
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION config.trgfn_tipi_ruoli_guard_entita_ref()
                        RETURNS trigger
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_colonna_codice TEXT;
                            v_rel_oid        OID;
                        BEGIN
                            -- Regola 1: coerenza NULL
                            IF NEW.entita_tabella IS NULL THEN
                                IF NEW.entita_colonna_codice IS NOT NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'config.trgfn_tipi_ruoli_guard_entita_ref',
                                        'E_PARAMETRO_INVALIDO',
                                        jsonb_build_object(
                                            'detail', 'entita_colonna_codice deve essere NULL se entita_tabella e'' NULL',
                                            'codice_interno', NEW.codice_interno,
                                            'entita_colonna_codice', NEW.entita_colonna_codice
                                        ),
                                        NULL::uuid,
                                        'entita_colonna_codice non NULL senza entita_tabella'
                                    );
                                END IF;
                                RETURN NEW;
                            END IF;

                            -- Regola 2: entita_tabella deve essere un regclass valido
                            v_rel_oid := to_regclass(NEW.entita_tabella);

                            IF v_rel_oid IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'config.trgfn_tipi_ruoli_guard_entita_ref',
                                    'E_TIPI_RUOLI_ENTITA_INVALIDA',
                                    jsonb_build_object(
                                        'codice_interno', NEW.codice_interno,
                                        'entita_tabella', NEW.entita_tabella
                                    ),
                                    NULL::uuid,
                                    NEW.codice_interno,
                                    concat('tabella/vista ', NEW.entita_tabella, ' non trovata')
                                );
                            END IF;

                            -- Regola 3: la tabella deve avere soggetto_ruolo_id
                            IF NOT EXISTS (
                                SELECT 1
                                  FROM pg_catalog.pg_attribute a
                                 WHERE a.attrelid = v_rel_oid
                                   AND a.attname  = 'soggetto_ruolo_id'
                                   AND a.attnum   > 0
                                   AND NOT a.attisdropped
                            ) THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'config.trgfn_tipi_ruoli_guard_entita_ref',
                                    'E_TIPI_RUOLI_ENTITA_INVALIDA',
                                    jsonb_build_object(
                                        'codice_interno', NEW.codice_interno,
                                        'entita_tabella', NEW.entita_tabella
                                    ),
                                    NULL::uuid,
                                    NEW.codice_interno,
                                    concat(NEW.entita_tabella, ' manca colonna soggetto_ruolo_id')
                                );
                            END IF;

                            -- Regola 4: colonna codice deve esistere
                            v_colonna_codice := COALESCE(NEW.entita_colonna_codice, 'codice');

                            IF NOT EXISTS (
                                SELECT 1
                                  FROM pg_catalog.pg_attribute a
                                 WHERE a.attrelid = v_rel_oid
                                   AND a.attname  = v_colonna_codice
                                   AND a.attnum   > 0
                                   AND NOT a.attisdropped
                            ) THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'config.trgfn_tipi_ruoli_guard_entita_ref',
                                    'E_TIPI_RUOLI_ENTITA_INVALIDA',
                                    jsonb_build_object(
                                        'codice_interno', NEW.codice_interno,
                                        'entita_tabella', NEW.entita_tabella,
                                        'colonna_cercata', v_colonna_codice
                                    ),
                                    NULL::uuid,
                                    NEW.codice_interno,
                                    concat(NEW.entita_tabella, '.', v_colonna_codice, ' non trovata')
                                );
                            END IF;

                            RETURN NEW;
                        END;
                        $function$;

                        COMMENT ON FUNCTION config.trgfn_tipi_ruoli_guard_entita_ref()
                          IS 'Guard INSERT/UPDATE: valida entita_tabella (regclass + soggetto_ruolo_id) e entita_colonna_codice. Errore: E_TIPI_RUOLI_ENTITA_INVALIDA.';

    - changeSet:
          id: 20260331-06-fix-trgfn-stati-doc-fiscale-chiude-lotto-guard
          author: mctit
          runOnChange: false
          comment: >
              Fix trgfn_stati_doc_fiscale_chiude_lotto_guard: E_GENERICO →
              E_CHIUDE_LOTTO_SINGLETON. Il codice era gia' nel context JSONB
              ma non veniva usato come codice errore effettivo.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- trgfn_stati_doc_fiscale_chiude_lotto_guard
                        --
                        -- Scopo: garantire cardinalita' esatta del flag chiude_lotto:
                        --        deve esistere sempre e solo una riga con chiude_lotto=true
                        --        in config.stati_doc_fiscale.
                        --
                        -- Fix 20260331: E_GENERICO → E_CHIUDE_LOTTO_SINGLETON
                        --              (il codice era gia' nel JSONB context ma non usato)
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION config.trgfn_stati_doc_fiscale_chiude_lotto_guard()
                        RETURNS trigger
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_cnt_true INTEGER;
                        BEGIN
                            -- Conteggio righe con chiude_lotto = true
                            SELECT COUNT(*)
                              INTO v_cnt_true
                              FROM config.stati_doc_fiscale
                             WHERE chiude_lotto IS TRUE;

                            -- Vincolo singleton: esattamente 1 riga con chiude_lotto = true
                            IF v_cnt_true <> 1 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'config',
                                    TG_NAME,
                                    'E_CHIUDE_LOTTO_SINGLETON',
                                    jsonb_build_object(
                                        'current_true_count', v_cnt_true
                                    ),
                                    NULL::uuid,
                                    v_cnt_true::text
                                );
                            END IF;

                            RETURN NULL;
                        END;
                        $function$;

                        COMMENT ON FUNCTION config.trgfn_stati_doc_fiscale_chiude_lotto_guard()
                          IS 'Guard singleton chiude_lotto: esattamente 1 riga TRUE in config.stati_doc_fiscale. Errore: E_CHIUDE_LOTTO_SINGLETON.';

    - changeSet:
          id: 20260331-06-fix-fn-get-aliquota-iva
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_get_aliquota_iva: 2x E_GENERICO →
              E_PARAMETRO_INVALIDO (p_iva_id mancante) +
              E_CODICE (iva non trovata). %TYPE sui parametri.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_get_aliquota_iva
                        --
                        -- Scopo: recupero aliquota IVA considerando override per stato.
                        --
                        -- Regole:
                        --   - p_iva_id obbligatorio e > 0
                        --   - p_stato_id opzionale (se NULL usa config.iva direttamente)
                        --   - Override da config.iva_stati se presente per lo stato
                        --
                        -- Fix 20260331: E_GENERICO → E_PARAMETRO_INVALIDO + E_CODICE
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION config.fn_get_aliquota_iva(
                            p_iva_id   config.iva.id%TYPE,
                            p_stato_id config.stati.id%TYPE
                        )
                        RETURNS NUMERIC
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_aliquota config.iva.aliquota_iva%TYPE;
                        BEGIN
                            -- Guard: p_iva_id obbligatorio
                            IF p_iva_id IS NULL OR p_iva_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'config',
                                    'fn_get_aliquota_iva',
                                    'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object(
                                        'parametro', 'p_iva_id',
                                        'valore', p_iva_id
                                    ),
                                    NULL::uuid,
                                    'p_iva_id obbligatorio e > 0'
                                );
                            END IF;

                            -- Recupera aliquota con override per stato
                            SELECT COALESCE(s.aliquota_override, i.aliquota_iva)
                              INTO v_aliquota
                              FROM config.iva i
                              LEFT JOIN config.iva_stati s
                                ON s.iva_id = i.id
                               AND s.stato_id = p_stato_id
                             WHERE i.id = p_iva_id;

                            IF v_aliquota IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'config',
                                    'fn_get_aliquota_iva',
                                    'E_CODICE',
                                    jsonb_build_object('iva_id', p_iva_id),
                                    NULL::uuid,
                                    p_iva_id::text, 'config.iva'
                                );
                            END IF;

                            RETURN v_aliquota;
                        END;
                        $function$;

                        COMMENT ON FUNCTION config.fn_get_aliquota_iva(INTEGER, INTEGER)
                          IS 'Aliquota IVA con override per stato (config.iva_stati). Errori: E_PARAMETRO_INVALIDO, E_CODICE.';
