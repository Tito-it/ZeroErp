#
# Fix: 4 funzioni schema config — sostituzione E_GENERICO
#   - fn_get_stati_doc_fiscale → E_PARAMETRO_INVALIDO
#   - trgfn_tipi_ruoli_guard_entita_ref → E_TIPI_RUOLI_ENTITA_INVALIDA
#   - trgfn_stati_doc_fiscale_chiude_lotto_guard → E_CHIUDE_LOTTO_SINGLETON
