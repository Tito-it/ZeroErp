# IL PROFILO SI CERCA COL CODICE NORMALIZZATO
#   Richiesta del BE (brief-be-codice-maiuscolo §6), decisioni Tid 2026-11-04.
#
#   config.fn_scrivi_profilo_accesso cercava il profilo con il codice grezzo
#   (WHERE pa.codice = p_codice) e, se non lo trovava, lo inseriva; il trigger
#   CODICE_MAIUSCOLO lo salva in maiuscolo. Un codice con minuscole non si
#   ritrovava mai: alla seconda chiamata l'INSERT urtava
#   uq_profili_accesso_codice, e il profilo di reparto
#   (REPARTO_<codice_interno>) non si modificava piu'.
#
#   ⭐ Si CERCA col codice normalizzato (script.fn_codice_normalizzato,
#   20261104-32) e si SCRIVE quello ricevuto: a normalizzarlo, e a dire se
#   in maiuscolo supera la lunghezza della colonna, e' il trigger. Un INSERT
#   col valore gia' normalizzato urterebbe la lunghezza di varchar(n) prima
#   del trigger, con un 22001 senza frase.
#
#   Corpo dall'ultimo changeSet (20261018-42-create-fn-scrivi-profilo-accesso),
#   verificato uguale al corpo vivo (prosrc su dbdev, 2026-11-04): la firma tiene i
#   %TYPE che la doc auto-generata scioglie. Firma invariata; i GRANT restano
#   (CREATE OR REPLACE), il COMMENT riceve la sua riga «Rev».
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261104-35-update-fn-scrivi-profilo-accesso-cerca-il-codice-normalizzato-mctit.yaml

  - changeSet:
      id: 20261104-35-update-fn-scrivi-profilo-accesso-cerca-il-codice-normalizzato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_scrivi_profilo_accesso: il profilo si cerca con script.fn_codice_normalizzato(p_codice),
        non col codice grezzo; l'INSERT resta col valore ricevuto (lo normalizza il trigger).
        Richiesta BE brief-be-codice-maiuscolo §6, Tid 2026-11-04.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_codice_normalizzato';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_scrivi_profilo_accesso(
                  p_tipo        config.profili_accesso.tipo%TYPE,
                  p_codice      config.profili_accesso.codice%TYPE,
                  p_descrizione config.profili_accesso.descrizione%TYPE,
                  p_aree        jsonb DEFAULT NULL::jsonb,
                  p_azioni      jsonb DEFAULT NULL::jsonb,
                  p_campi       jsonb DEFAULT '{}'::jsonb)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_campi    jsonb := COALESCE(p_campi, '{}'::jsonb);
                  v_estranea text;
                  v_id       config.profili_accesso.id%TYPE;
                  v_tipo     config.profili_accesso.tipo%TYPE;
                  c_ammesse  CONSTANT text[] := ARRAY['attivo', 'richiede_secondo_fattore'];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere un profilo di accesso: crearlo o aggiornarlo
                  --   per codice, e sostituirne le aree e le azioni se
                  --   indicate. Ritorna l'id.
                  --
                  -- Regole:
                  --   - campi assenti: il DEFAULT alla nascita, invariati dopo;
                  --   - aree/azioni NULL = invariate, un elenco = sostituite;
                  --   - un codice di un altro tipo, argomenti mancanti,
                  --     elenchi malformati: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - chiave estranea nei campi: E_CAMPO_NON_AMMESSO.
                  -- =========================================================
                  IF p_tipo IS NULL OR NULLIF(btrim(p_codice), '') IS NULL OR p_descrizione IS NULL
                     OR jsonb_typeof(v_campi) <> 'object'
                     OR (p_aree IS NOT NULL AND jsonb_typeof(p_aree) <> 'array')
                     OR (p_azioni IS NOT NULL AND jsonb_typeof(p_azioni) <> 'array') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_scrivi_profilo_accesso', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo',        p_tipo,
                                             'codice',      p_codice,
                                             'tipo_campi',  jsonb_typeof(v_campi),
                                             'tipo_aree',   jsonb_typeof(p_aree),
                                             'tipo_azioni', jsonb_typeof(p_azioni)),
                          NULL::uuid,
                          'config.fn_scrivi_profilo_accesso',
                          'tipo, codice o descrizione mancanti, o campi, aree, azioni malformati');
                  END IF;

                  v_estranea := script.fn_prima_chiave_estranea(v_campi, c_ammesse);
                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_scrivi_profilo_accesso', 'E_CAMPO_NON_AMMESSO',
                          jsonb_build_object('campo', v_estranea, 'codice', p_codice),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- 1. Il profilo, per codice: un codice ha un tipo solo.
                  --    ⛔ Si CERCA col codice normalizzato, si SCRIVE quello
                  --    ricevuto: lo normalizza il trigger CODICE_MAIUSCOLO, che
                  --    dice anche se in maiuscolo supera la colonna (rev 2026-11-04).
                  SELECT pa.id, pa.tipo
                    INTO v_id, v_tipo
                    FROM config.profili_accesso pa
                   WHERE pa.codice = script.fn_codice_normalizzato(p_codice);

                  IF v_id IS NULL THEN
                      INSERT INTO config.profili_accesso (tipo, codice, descrizione, attivo, richiede_secondo_fattore)
                      VALUES (p_tipo, p_codice, p_descrizione,
                              COALESCE((v_campi ->> 'attivo')::boolean, true),
                              COALESCE((v_campi ->> 'richiede_secondo_fattore')::boolean, false))
                      RETURNING id INTO v_id;
                  ELSIF v_tipo IS DISTINCT FROM p_tipo THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_scrivi_profilo_accesso', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('codice', p_codice, 'tipo_esistente', v_tipo, 'tipo_chiesto', p_tipo),
                          NULL::uuid,
                          'config.fn_scrivi_profilo_accesso',
                          'il codice e'' di un profilo di un altro tipo');
                  ELSE
                      UPDATE config.profili_accesso pa
                         SET descrizione              = p_descrizione,
                             attivo                   = COALESCE((v_campi ->> 'attivo')::boolean, pa.attivo),
                             richiede_secondo_fattore = COALESCE((v_campi ->> 'richiede_secondo_fattore')::boolean,
                                                                 pa.richiede_secondo_fattore)
                       WHERE pa.id = v_id;
                  END IF;

                  -- 2. Le aree, sostituite.
                  IF p_aree IS NOT NULL THEN
                      DELETE FROM config.profili_accesso_aree paa WHERE paa.profilo_accesso_id = v_id;
                      INSERT INTO config.profili_accesso_aree (profilo_accesso_id, area_id, livello)
                      SELECT v_id, (a ->> 'area_id')::integer, (a ->> 'livello')::config.livello_accesso
                        FROM jsonb_array_elements(p_aree) AS a;
                  END IF;

                  -- 3. Le azioni, sostituite.
                  IF p_azioni IS NOT NULL THEN
                      DELETE FROM config.profili_accesso_azioni paz WHERE paz.profilo_accesso_id = v_id;
                      INSERT INTO config.profili_accesso_azioni (profilo_accesso_id, azione_id, abilitata)
                      SELECT v_id, (a ->> 'azione_id')::integer, (a ->> 'abilitata')::boolean
                        FROM jsonb_array_elements(p_azioni) AS a;
                  END IF;

                  RETURN v_id;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION config.fn_scrivi_profilo_accesso(config.profili_accesso.tipo%TYPE, config.profili_accesso.codice%TYPE, config.profili_accesso.descrizione%TYPE, jsonb, jsonb, jsonb)
                IS 'BB (2026-10-18): scrive un profilo di accesso per codice (uq_profili_accesso_codice): lo crea, o ne aggiorna descrizione e campi; poi ne SOSTITUISCE le aree (p_aree: elenco di {area_id, livello}) e le azioni (p_azioni: elenco di {azione_id, abilitata}) se indicate, NULL = invariate. p_campi: attivo, richiede_secondo_fattore; assenti = DEFAULT alla nascita (true, false), invariati dopo (la regola COALESCE del backend); chiave estranea: E_CAMPO_NON_AMMESSO. Un codice che esiste con un altro tipo, argomenti mancanti o elenchi malformati: E_SCRIPT_CHIAMATA_NON_VALIDA. FK, unicita'' dell''area e livello valido li dicono i vincoli. Non scrive binding (quello di un''identita'' e'' config.fn_lega_profilo_identita) ne'' controlla il permesso (backend). INVOKER. Ritorna l''id. Prende il posto dei passi del profilo di AmmSoftwareRepository.put_profilo_reparto (2b-2) ed e'' la sede dei profili AD_HOC del verbo dei dati di sviluppo (2b-3). Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 8). Rev 2026-11-04 (20261104-35, richiesta BE brief-be-codice-maiuscolo §6): il profilo si CERCA con script.fn_codice_normalizzato(p_codice) e si SCRIVE col codice ricevuto, che il trigger CODICE_MAIUSCOLO normalizza; prima un codice con minuscole non si ritrovava e la seconda chiamata urtava uq_profili_accesso_codice.';
