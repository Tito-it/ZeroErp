# Liquibase changelog per Zero ERP
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260217-11-add-chiude-lotto-stati-doc-fiscale-mctit.yaml

  - changeSet:
      id: 20260217-11-add-chiude-lotto-stati-doc-fiscale
      author: mctit
      comment: "Aggiunge flag chiude_lotto a config.stati_doc_fiscale per chiusura operativa lotto parametrica"
      changes:
        - preConditions:
            - onFail: HALT
            - tableExists:
                schemaName: config
                tableName: stati_doc_fiscale
            - not:
                columnExists:
                  schemaName: config
                  tableName: stati_doc_fiscale
                  columnName: chiude_lotto
        - addColumn:
            schemaName: config
            tableName: stati_doc_fiscale
            columns:
              - column:
                  name: chiude_lotto
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Se true, lo step su questo stato chiude operativamente il lotto (stato_operativo=CHIUSO)."
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260217-11-02-add-uq-chiude-lotto-true
      author: mctit
      comment: "Garantisce al massimo uno stato con chiude_lotto=true"
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_fiscale
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS uq_stati_doc_fiscale_chiude_lotto_true
                ON config.stati_doc_fiscale ((1))
               WHERE chiude_lotto IS TRUE;

  - changeSet:
      id: 20260217-11-03-create-trgfn-chiude-lotto-singleton-guard
      author: mctit
      comment: "Garantisce che esista sempre e solo uno stato con chiude_lotto=true"
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: stati_doc_fiscale
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_stati_doc_fiscale_chiude_lotto_guard()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_cnt_true integer;
              BEGIN
                -- Scopo:
                --   Garantire cardinalita' esatta del flag chiude_lotto:
                --   deve esistere sempre e solo una riga con chiude_lotto=true.
                SELECT COUNT(*)
                  INTO v_cnt_true
                  FROM config.stati_doc_fiscale
                 WHERE chiude_lotto IS TRUE;

                IF v_cnt_true <> 1 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'config', TG_NAME, 'E_GENERICO',
                    jsonb_build_object(
                      'scope', 'LOTTO',
                      'severity', 'C',
                      'code', 'E_CHIUDE_LOTTO_SINGLETON',
                      'lotto_id', NULL,
                      'fattura_id', NULL,
                      'context', jsonb_build_object(
                        'detail', 'chiude_lotto deve avere una sola riga TRUE',
                        'current_true_count', v_cnt_true
                      )
                    ),
                    NULL::uuid,
                    'chiude_lotto deve avere una sola riga TRUE'
                  );
                END IF;
                RETURN NULL;
              END;
              $$;

              DROP TRIGGER IF EXISTS trg_stati_doc_fiscale_chiude_lotto_guard_iud
                ON config.stati_doc_fiscale;

              CREATE CONSTRAINT TRIGGER trg_stati_doc_fiscale_chiude_lotto_guard_iud
              AFTER INSERT OR UPDATE OR DELETE
              ON config.stati_doc_fiscale
              DEFERRABLE INITIALLY DEFERRED
              FOR EACH ROW
              EXECUTE FUNCTION config.trgfn_stati_doc_fiscale_chiude_lotto_guard();

              COMMENT ON FUNCTION config.trgfn_stati_doc_fiscale_chiude_lotto_guard()
              IS 'Guard cardinalita'' chiude_lotto: deve esistere sempre e solo una riga TRUE su config.stati_doc_fiscale.';
