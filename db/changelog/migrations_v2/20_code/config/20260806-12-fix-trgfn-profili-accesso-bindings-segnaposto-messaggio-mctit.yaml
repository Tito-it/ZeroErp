# ------------------------------------------------------------
# Il guard di coerenza dei binding non ha MAI mostrato il suo messaggio: si
#   rompeva prima, e diceva un'altra cosa.
#   Brief: brief-db-pgtap-runner-rls-baseline.md §13.
#
# ⚠️ IL DIFETTO. Il messaggio registrato per E_PROFILO_ACCESSO_BINDING_INCOERENTE
#   ha DUE segnaposto:
#       Profilo %s (tipo %s): binding non coerente col tipo del profilo.
#   ma tutti e quattro i punti che lo sollevano passano UN solo valore variadico
#   (`NEW.profilo_accesso_id::text`). `script.fn_log_and_raise_error` compone il
#   testo con `format(messaggio, VARIADIC valori)`, quindi ogni volta che il
#   guard scatta esplode PRIMA di parlare:
#       ERRORE: numero di argomenti non sufficiente per format()
#   L'operatore vede un errore interno di PostgreSQL al posto della ragione, e
#   nel log non finisce nessun codice di dominio. Riprodotto da owner con un
#   binding REPARTO senza unita_organizzativa_id.
#
# ⚠️ PERCHE' NON SE N'E' ACCORTO NESSUNO — e la lezione vale oltre questo file.
#   Il test esiste: db/pgtap/config/test-profili-accesso-bindings-guard-coerenza.sql,
#   asserzioni 7 e 9. Ma usa `throws_ok(sql, NULL, NULL, descrizione)`, cioe'
#   verifica CHE sollevi, non CHE COSA sollevi: il crash di format() lo
#   soddisfa esattamente come lo soddisferebbe il guard funzionante. Un test
#   verde per la ragione sbagliata. Nello stesso commit il test passa ad
#   asserire il SQLSTATE del codice di dominio.
#
# ℹ️ COME E' VENUTO FUORI. Lanciando la suite pgTAP come utente applicativo
#   (`zeroerp_app`) invece che come owner: sotto quel percorso il guard scatta
#   davvero, mentre da owner il caso non si presentava. E' il primo difetto vero
#   che la strada (b) del brief restituisce, e da solo giustifica il cantiere:
#   il §4 diceva che un test verde in una condizione che non esiste non dice
#   nulla, e qui si vede.
#
# ℹ️ Unica modifica al corpo: si aggiunge `v_tipo_profilo::text` come secondo
#   valore variadico nei quattro punti che sollevano quel codice. Gli altri due
#   codici usati dalla funzione (E_PARAMETRO_INVALIDO ed
#   E_PROFILO_ACCESSO_TIPO_NON_GESTITO) hanno un solo segnaposto e un solo
#   valore: verificati, restano invariati.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260806-12-fix-trgfn-profili-accesso-bindings-segnaposto-messaggio-mctit.yaml

  - changeSet:
      id: 20260806-12-fix-trgfn-profili-accesso-bindings-segnaposto-messaggio
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_profili_accesso_bindings_guard_coerenza passa anche il tipo del
        profilo a fn_log_and_raise_error: il messaggio di
        E_PROFILO_ACCESSO_BINDING_INCOERENTE ha due segnaposto e ne riceveva
        uno, quindi il guard falliva con «numero di argomenti non sufficiente
        per format()» invece di dire la ragione. Brief pgTAP runner/RLS §13.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: profili_accesso_bindings
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'config'
                    AND p.proname = 'trgfn_profili_accesso_bindings_guard_coerenza'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_profili_accesso_bindings_guard_coerenza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- %TYPE sulle colonne sorgente (policy ZeroErp).
                  v_tipo_profilo config.profili_accesso.tipo%TYPE;
              BEGIN
                  -- ------------------------------------------------------------
                  -- Trigger function: guard coerenza tipo_profilo <-> tipo_binding
                  -- su config.profili_accesso_bindings (fase a10, BEFORE INSERT/UPDATE).
                  --
                  -- ⚠️ IL COMMENTO PRECEDENTE QUI DICEVA IL FALSO, e va corretto
                  --   perche' ha gia' ingannato un test. Diceva: «il CHECK
                  --   chk_profili_accesso_bindings_xor garantisce che esattamente
                  --   una tra (uo, identita, ruolo) sia NOT NULL PRIMA che il
                  --   trigger venga eseguito». In PostgreSQL e' il contrario: i
                  --   trigger BEFORE ROW girano PRIMA che i vincoli CHECK siano
                  --   valutati. Quindi con zero colonne valorizzate e' QUESTO
                  --   guard a intercettare, e il CHECK non viene mai raggiunto.
                  --   Il guard non puo' dare per acquisito l'xor: se ne accorge da
                  --   solo, ed e' quello che fa.
                  --
                  -- Logica:
                  --   1. Recupera tipo del profilo referenziato.
                  --   2. Verifica che la colonna valorizzata corrisponda al tipo:
                  --      REPARTO      => unita_organizzativa_id
                  --      PORTALE      => ruolo_applicativo
                  --      AD_HOC       => identita_digitale_id
                  --      SUPER_ADMIN  => identita_digitale_id (§4.6.A.3)
                  --
                  -- ⚠️ I VALORI VARIADICI DEVONO ESSERE TANTI QUANTI I SEGNAPOSTO.
                  --   Il messaggio di E_PROFILO_ACCESSO_BINDING_INCOERENTE e'
                  --   «Profilo %s (tipo %s): …»: servono DUE valori. Passandone uno
                  --   solo, fn_log_and_raise_error esplodeva in format() e il guard
                  --   non arrivava mai a dire la ragione.
                  --   Brief: brief-db-pgtap-runner-rls-baseline §13.
                  -- ------------------------------------------------------------

                  -- 1) Recupero tipo del profilo header.
                  SELECT pa.tipo
                    INTO v_tipo_profilo
                    FROM config.profili_accesso pa
                   WHERE pa.id = NEW.profilo_accesso_id;

                  IF NOT FOUND THEN
                      -- Caso limite: la FK lo impedirebbe, fail-fast esplicito.
                      -- E_PARAMETRO_INVALIDO ha UN segnaposto: un valore basta.
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME,
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object(
                              'table', TG_TABLE_NAME,
                              'profilo_accesso_id', NEW.profilo_accesso_id,
                              'nota', 'profilo_accesso_id non trovato in config.profili_accesso'
                          ),
                          NULL::uuid,
                          NEW.profilo_accesso_id::text
                      );
                  END IF;

                  -- 2) Dispatch per tipo profilo.
                  CASE v_tipo_profilo
                      WHEN 'REPARTO' THEN
                          IF NEW.unita_organizzativa_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo REPARTO richiede unita_organizzativa_id'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text,
                                  v_tipo_profilo::text
                              );
                          END IF;

                      WHEN 'PORTALE' THEN
                          IF NEW.ruolo_applicativo IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo PORTALE richiede ruolo_applicativo'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text,
                                  v_tipo_profilo::text
                              );
                          END IF;

                      WHEN 'AD_HOC' THEN
                          IF NEW.identita_digitale_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo AD_HOC richiede identita_digitale_id'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text,
                                  v_tipo_profilo::text
                              );
                          END IF;

                      WHEN 'SUPER_ADMIN' THEN
                          -- SUPER_ADMIN e' un privilegio personale: sempre
                          -- bindato a una singola identita, mai a reparto
                          -- ne' a ruolo applicativo. Questo garantisce
                          -- tracciabilita' individuale del bypass permessi.
                          IF NEW.identita_digitale_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo SUPER_ADMIN richiede identita_digitale_id (privilegio personale)'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text,
                                  v_tipo_profilo::text
                              );
                          END IF;

                      ELSE
                          -- Nuovo valore dell'enum tipo_profilo_accesso senza
                          -- regola qui: fail-fast esplicito (anti-bypass).
                          -- E_PROFILO_ACCESSO_TIPO_NON_GESTITO ha UN segnaposto.
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME,
                              'E_PROFILO_ACCESSO_TIPO_NON_GESTITO',
                              jsonb_build_object(
                                  'table', TG_TABLE_NAME,
                                  'profilo_accesso_id', NEW.profilo_accesso_id,
                                  'tipo_profilo', v_tipo_profilo,
                                  'nota', 'Tipo profilo sconosciuto al guard di coerenza bindings'
                              ),
                              NULL::uuid,
                              v_tipo_profilo::text
                          );
                  END CASE;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_profili_accesso_bindings_guard_coerenza()
              IS 'Guard a10 BEFORE INSERT/UPDATE su config.profili_accesso_bindings: verifica coerenza tra tipo del profilo e tipo del binding (REPARTO/PORTALE/AD_HOC/SUPER_ADMIN). Si somma al CHECK chk_profili_accesso_bindings_xor che impone una sola colonna NOT NULL. Passa a fn_log_and_raise_error entrambi i valori che il messaggio di E_PROFILO_ACCESSO_BINDING_INCOERENTE richiede (id profilo e tipo): con uno solo il guard falliva in format() senza mai dire la ragione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: si torna alla forma con UN solo valore variadico, cioe'
              -- al difetto. Presente per completezza del changeSet, non perche'
              -- abbia senso applicarlo.
              SELECT 1;
