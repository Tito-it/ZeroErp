databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260228-27-create-trg-vendite-movimenti-guard-emittente-scope-mctit.yaml

  - changeSet:
      id: 20260228-27-create-trg-vendite-movimenti-guard-emittente-scope
      author: mctit
      comment: >
        Trigger defense-in-depth su pagamenti.vendite_movimenti: blocca INSERT/UPDATE
        se l'utente corrente non ha scope sull'emittente della fattura collegata.
        Risolve emittente via fattura_id → fatture.emittente_soggetto_ruolo_id → emittenti_fiscali.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_vendite_movimenti_a10_guard_emittente_scope_ins_upd
                BEFORE INSERT OR UPDATE ON pagamenti.vendite_movimenti
                FOR EACH ROW
                EXECUTE FUNCTION config.trgfn_guard_emittente_scope(
                  'fattura', 'fattura_id'
                );
