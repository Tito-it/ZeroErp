databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260418-40-create-trgfn-profili-accesso-bindings-guard-coerenza-mctit.yaml

  - changeSet:
      id: 20260418-40-create-trgfn-profili-accesso-bindings-guard-coerenza
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Guard di coerenza tra tipo del profilo e tipo del binding su
        config.profili_accesso_bindings (§4.3 WIP multi-face-auth).
        Il CHECK xor sulla tabella garantisce "una sola colonna valorizzata";
        questo guard aggiunge "la colonna valorizzata deve essere quella
        attesa dal tipo del profilo":
          - tipo=REPARTO   -> unita_organizzativa_id valorizzato
          - tipo=PORTALE   -> ruolo_applicativo valorizzato
          - tipo=AD_HOC    -> identita_digitale_id valorizzato
        Evita configurazioni illogiche (es. profilo REPARTO legato a un
        ruolo_applicativo, o profilo PORTALE legato a un reparto).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: profili_accesso_bindings
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger function (BEFORE INSERT/UPDATE) che verifica la coerenza
              -- tra tipo del profilo (REPARTO/PORTALE/AD_HOC) e la colonna
              -- binding valorizzata (uo / ruolo / identita).
              CREATE OR REPLACE FUNCTION config.trgfn_profili_accesso_bindings_guard_coerenza()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- %TYPE sulle colonne sorgente (policy ZeroErp).
                  v_tipo_profilo config.profili_accesso.tipo%TYPE;
              BEGIN
                  -- ------------------------------------------------------------
                  -- Trigger function: guard coerenza tipo_profilo <-> tipo_binding
                  -- su config.profili_accesso_bindings (fase a10, BEFORE INSERT/UPDATE).
                  --
                  -- Pre-condizioni:
                  --   - Il CHECK chk_profili_accesso_bindings_xor garantisce
                  --     che esattamente una tra (uo, identita, ruolo) sia NOT NULL
                  --     prima che il trigger venga eseguito.
                  --
                  -- Logica:
                  --   1. Recupera tipo del profilo referenziato.
                  --   2. Verifica che la colonna valorizzata corrisponda al tipo:
                  --      REPARTO   => unita_organizzativa_id
                  --      PORTALE   => ruolo_applicativo
                  --      AD_HOC    => identita_digitale_id
                  -- ------------------------------------------------------------

                  -- 1) Recupero tipo del profilo header.
                  SELECT pa.tipo
                    INTO v_tipo_profilo
                    FROM config.profili_accesso pa
                   WHERE pa.id = NEW.profilo_accesso_id;

                  IF NOT FOUND THEN
                      -- Caso limite: la FK lo impedirebbe, fail-fast esplicito.
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME,
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object(
                              'table', TG_TABLE_NAME,
                              'profilo_accesso_id', NEW.profilo_accesso_id,
                              'nota', 'profilo_accesso_id non trovato in config.profili_accesso'
                          ),
                          NULL::uuid,
                          NEW.profilo_accesso_id::text
                      );
                  END IF;

                  -- 2) Dispatch per tipo profilo.
                  CASE v_tipo_profilo
                      WHEN 'REPARTO' THEN
                          IF NEW.unita_organizzativa_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo REPARTO richiede unita_organizzativa_id'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text
                              );
                          END IF;

                      WHEN 'PORTALE' THEN
                          IF NEW.ruolo_applicativo IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo PORTALE richiede ruolo_applicativo'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text
                              );
                          END IF;

                      WHEN 'AD_HOC' THEN
                          IF NEW.identita_digitale_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME,
                                  'E_PROFILO_ACCESSO_BINDING_INCOERENTE',
                                  jsonb_build_object(
                                      'table', TG_TABLE_NAME,
                                      'profilo_accesso_id', NEW.profilo_accesso_id,
                                      'tipo_profilo', v_tipo_profilo,
                                      'nota', 'Profilo AD_HOC richiede identita_digitale_id'
                                  ),
                                  NULL::uuid,
                                  NEW.profilo_accesso_id::text
                              );
                          END IF;

                      ELSE
                          -- Nuovo valore dell'enum tipo_profilo_accesso senza
                          -- regola qui: fail-fast esplicito (anti-bypass).
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME,
                              'E_PROFILO_ACCESSO_TIPO_NON_GESTITO',
                              jsonb_build_object(
                                  'table', TG_TABLE_NAME,
                                  'profilo_accesso_id', NEW.profilo_accesso_id,
                                  'tipo_profilo', v_tipo_profilo,
                                  'nota', 'Tipo profilo sconosciuto al guard di coerenza bindings'
                              ),
                              NULL::uuid,
                              v_tipo_profilo::text
                          );
                  END CASE;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_profili_accesso_bindings_guard_coerenza() IS
                  'Guard a10 BEFORE INSERT/UPDATE su config.profili_accesso_bindings: '
                  'verifica coerenza tra tipo del profilo e tipo del binding (REPARTO/PORTALE/AD_HOC). '
                  'Si somma al CHECK chk_profili_accesso_bindings_xor che impone una sola colonna NOT NULL.';

              -- Installazione trigger (fase a10 = guard fail-fast).
              -- UPDATE OF sulle 4 colonne rilevanti: il trigger non scatta
              -- se l'UPDATE tocca solo attivo/meta/audit (evita SELECT inutili).
              DROP TRIGGER IF EXISTS trg_profili_accesso_bindings_a10_guard_coerenza_ins_upd
                  ON config.profili_accesso_bindings;

              CREATE TRIGGER trg_profili_accesso_bindings_a10_guard_coerenza_ins_upd
                  BEFORE INSERT
                       OR UPDATE OF profilo_accesso_id,
                                    unita_organizzativa_id,
                                    identita_digitale_id,
                                    ruolo_applicativo
                  ON config.profili_accesso_bindings
                  FOR EACH ROW
                  EXECUTE FUNCTION config.trgfn_profili_accesso_bindings_guard_coerenza();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_profili_accesso_bindings_a10_guard_coerenza_ins_upd
                  ON config.profili_accesso_bindings;
              DROP FUNCTION IF EXISTS config.trgfn_profili_accesso_bindings_guard_coerenza();
