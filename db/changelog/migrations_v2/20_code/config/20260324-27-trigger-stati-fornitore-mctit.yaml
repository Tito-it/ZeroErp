# Liquibase changelog per Zero ERP
# Trigger standard su config.stati_fornitore:
# - lock codice_interno (immutabile)
# - audit data_user
# Pattern identico a config.stati_cliente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/config/20260324-27-trigger-stati-fornitore-mctit.yaml

  - changeSet:
      id: 20260324-27-trigger-stati-fornitore
      author: mctit
      runOnChange: false
      comment: >
        Trigger standard su config.stati_fornitore:
        1) Lock codice_interno (immutabile dopo creazione).
        2) Audit data_user su INSERT/UPDATE.
        Pattern allineato a config.stati_cliente.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger: lock codice_interno
              DROP TRIGGER IF EXISTS trg_stati_fornitore_a10_lock_columns_upd
                ON config.stati_fornitore;

              CREATE TRIGGER trg_stati_fornitore_a10_lock_columns_upd
                BEFORE UPDATE ON config.stati_fornitore
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_lock_columns(
                  'codice_interno', 'CODICE_NON_MODIFICABILE'
                );

              COMMENT ON TRIGGER trg_stati_fornitore_a10_lock_columns_upd
                ON config.stati_fornitore IS
                'Impedisce la modifica di codice_interno dopo la creazione.';

              -- Trigger: audit data_user
              DROP TRIGGER IF EXISTS trg_stati_fornitore_audit_data_user_upd
                ON config.stati_fornitore;

              CREATE TRIGGER trg_stati_fornitore_audit_data_user_upd
                BEFORE INSERT OR UPDATE ON config.stati_fornitore
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_audit_data_user_generic();

              COMMENT ON TRIGGER trg_stati_fornitore_audit_data_user_upd
                ON config.stati_fornitore IS
                'Aggiorna data_update e user_update su ogni INSERT/UPDATE.';
