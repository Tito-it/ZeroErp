# Split di E_STATO_SCONOSCIUTO — 3 di 3 (toponomastica), ed e' la meta' che
#   dava il nome sbagliato a tutto.
#   Brief: brief-db-be-terzo-lato-presidio-codici.md §11.2.
#
# ⚠️ QUI «STATO» NON E' UNO STATO. `config.toponomastica.stato_id` e' la
#   NAZIONE (FK verso config.stati, codice_iso3), non lo stato di una macchina
#   a stati. Il codice condiviso con vendite.fn_cambia_stato_* faceva sembrare
#   i due casi la stessa cosa, e la conseguenza pratica era concreta: dare al
#   codice comune il 404 che merita il cambio stato avrebbe fatto **svuotare la
#   pagina di un indirizzo mentre l'operatore digita**. Qui la verita' e'
#   400 — c'e' un campo da correggere, non una risorsa che non esiste.
#
# ℹ️ E_NAZIONE_NON_TROVATA (893) e' l'unico dei due nuovi codici sollevato da
#   una funzione AGGANCIATA a un trigger (trg_toponomastica_normalize_ins_upd
#   su config.toponomastica, BEFORE INSERT OR UPDATE): nel registro del debito
#   entra con `da_trigger = true`, l'altro con `false`. Non e' un dettaglio —
#   e' il criterio con cui il §9 del brief ordina le decisioni.
#
# ℹ️ Nessuna preCondition sul codice a catalogo: `20_code` gira prima di
#   `80_data`, la riga 893 non esiste ancora quando questo viene applicato.
#
# ℹ️ Il valore variadico resta `'stato_id'` — il nome del campo. E' l'unica
#   cosa che la funzione ha in mano (il valore e' NULL per definizione, e' il
#   motivo dell'errore), e il nuovo messaggio e' scritto per leggerlo bene:
#   «il campo stato_id e' vuoto e non esiste un default configurato».
#
# Unica modifica al corpo: la stringa del codice sollevato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260806-11-update-trgfn-toponomastica-normalize-nazione-non-trovata-mctit.yaml

  - changeSet:
      id: 20260806-11-update-trgfn-toponomastica-normalize-nazione-non-trovata
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_toponomastica_normalize solleva E_NAZIONE_NON_TROVATA al posto di
        E_STATO_SCONOSCIUTO: qui «stato» era la nazione dell'indirizzo, non uno
        stato di workflow, e il codice condiviso non poteva ricevere una policy
        HTTP giusta per entrambi. Brief terzo lato §11.2.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: toponomastica
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'config'
                    AND p.proname = 'trgfn_toponomastica_normalize'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_toponomastica_normalize()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: default e validazione obbligatoria di stato_id su
              --   config.toponomastica. ⚠️ `stato_id` e' la NAZIONE (FK
              --   config.stati, codice_iso3), non lo stato di una macchina
              --   a stati: il nome della colonna e' fuorviante ed e' la
              --   ragione per cui questo errore ha condiviso per mesi il
              --   codice con il cambio stato di commesse e preventivi.
              --   rev 2026-08-06: solleva E_NAZIONE_NON_TROVATA. Il
              --   precedente E_STATO_SCONOSCIUTO diceva due cose e non
              --   poteva ricevere una policy sola: dandogli il 404 che
              --   merita il cambio stato, questa form si sarebbe svuotata
              --   mentre l'operatore digita. Qui la verita' e' 400 — c'e'
              --   un campo da correggere. Brief terzo lato §11.2.
              BEGIN
                -- Default stato_id se mancante
                IF NEW.stato_id IS NULL THEN
                  NEW.stato_id := script.fn_get_default_by_param(
                    'config',
                    'stati',
                    'codice_iso3',
                    'state_code_iso3',
                    TG_NAME
                  )::integer;
                END IF;

                -- Se ancora NULL, errore: ne' il chiamante ne' il default
                -- per parametro hanno risolto una nazione.
                IF NEW.stato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_NAZIONE_NON_TROVATA',
                    jsonb_build_object('table','config.toponomastica'),
                    NULL::uuid,
                    'stato_id'
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_toponomastica_normalize()
              IS 'Trigger function per default stato_id e validazione obbligatoria su config.toponomastica. ⚠️ stato_id e'' la NAZIONE (FK config.stati, codice_iso3), non lo stato di una macchina a stati. rev 2026-08-06: solleva E_NAZIONE_NON_TROVATA (893) invece di E_STATO_SCONOSCIUTO (9), ritirato. Il vecchio codice era condiviso con vendite.fn_cambia_stato_commessa / _preventivo, dove «stato» era davvero uno stato di workflow: due verita'' diverse sotto un nome solo, e nessun http_status poteva essere giusto per entrambe — 404 avrebbe fatto svuotare la form indirizzi mentre l''operatore digita, 400 avrebbe fatto mentire il cambio stato. Qui la verita'' e'' 400: c''e'' un campo da correggere. Brief brief-db-be-terzo-lato-presidio-codici §11.2, decisione di Tid del 2026-08-06.';
