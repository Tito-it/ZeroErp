# IL LEGAME DI UN PROFILO A UN'IDENTITA' DIVENTA UN VERBO DEFINER COL SUO PERMESSO
#   config.fn_lega_profilo_identita
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   1. SECURITY DEFINER, search_path pg_catalog, public, pg_temp: con la tabella
#      dei legami in sola lettura per l'app (90_end/20261126-24) scrive il
#      proprietario.
#   2. Il permesso in prima riga: script.fn_guard_super_admin sull'utente di
#      sessione, lo stesso controllo dell'endpoint (AdminAPIView,
#      OperatoriDetailView.patch): chi arriva dal backend non riceve un rifiuto
#      nuovo.
#   3. Il corpo passa alla primitiva config.fn_applica_lega_profilo_identita
#      (20261126-01). Firma ancorata come nella revisione precedente
#      (20261018-43); RETURNS ancorato all'id del legame (bigint, come al vivo).
#   Corpo di prima dal catalogo di dbdev. L'EXECUTE all'app resta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261126-02-update-fn-lega-profilo-identita-definer-guard-mctit.yaml

  - changeSet:
      id: 20261126-02-update-fn-lega-profilo-identita-definer-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_lega_profilo_identita: SECURITY DEFINER col guard del SUPER_ADMIN, il corpo nella primitiva config.fn_applica_lega_profilo_identita. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_lega_profilo_identita(
                  p_profilo_accesso_id   config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  p_identita_digitale_id config.profili_accesso_bindings.identita_digitale_id%TYPE)
               RETURNS config.profili_accesso_bindings.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo:
              --   Il verbo con cui il SUPER_ADMIN lega un'identita' digitale a un profilo
              --   di accesso. E' la strada dell'endpoint di amministrazione.
              --
              -- Regole:
              --   - SECURITY DEFINER: il permesso e' qui, in prima riga, e chiede lo stesso
              --     controllo dell'endpoint, il SUPER_ADMIN (script.fn_guard_super_admin:
              --     E_PERMESSO_NEGATO, anche senza utente);
              --   - il legame lo scrive la primitiva config.fn_applica_lega_profilo_identita,
              --     che l'app non esegue.
              DECLARE
                  v_utente config.user_emittenti_fiscali.auth_user_id%TYPE;
              BEGIN
                  -- Il permesso, prima di ogni altra cosa.
                  v_utente := script.fn_utente_di_sessione('config.fn_lega_profilo_identita');
                  PERFORM script.fn_guard_super_admin(v_utente);

                  RETURN config.fn_applica_lega_profilo_identita(p_profilo_accesso_id, p_identita_digitale_id);
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_lega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
              IS 'Il verbo con cui il SUPER_ADMIN lega un''identità digitale a un profilo di accesso; ritorna l''id del legame. SECURITY DEFINER: in prima riga chiede il SUPER_ADMIN all''utente di sessione (script.fn_guard_super_admin: E_PERMESSO_NEGATO, anche senza utente), lo stesso controllo dell''endpoint. Il legame lo scrive la primitiva config.fn_applica_lega_profilo_identita, che l''applicazione non esegue: lo stesso profilo già legato ritorna quel legame, un altro profilo lo rifiuta uq_profili_accesso_bindings_identita, argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. config.profili_accesso_bindings è in sola lettura per l''applicazione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_lega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_id config.profili_accesso_bindings.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Legare un'identita' digitale a un profilo di accesso.
                  --   Ritorna l'id del binding.
                  --
                  -- Regole:
                  --   - lo stesso profilo gia' legato: ritorna quel binding;
                  --   - un altro profilo gia' legato: lo dice il vincolo
                  --     uq_profili_accesso_bindings_identita;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_identita_digitale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_lega_profilo_identita', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',   p_profilo_accesso_id,
                                             'identita_digitale_id', p_identita_digitale_id),
                          NULL::uuid,
                          'config.fn_lega_profilo_identita',
                          'profilo o identita'' mancanti');
                  END IF;

                  SELECT pab.id
                    INTO v_id
                    FROM config.profili_accesso_bindings pab
                   WHERE pab.identita_digitale_id = p_identita_digitale_id
                     AND pab.profilo_accesso_id   = p_profilo_accesso_id;

                  IF v_id IS NOT NULL THEN
                      RETURN v_id;
                  END IF;

                  INSERT INTO config.profili_accesso_bindings (profilo_accesso_id, identita_digitale_id)
                  VALUES (p_profilo_accesso_id, p_identita_digitale_id)
                  RETURNING id INTO v_id;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_lega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
              IS 'BB (2026-10-18): lega un''identita'' digitale a un profilo di accesso (la riga di config.profili_accesso_bindings con identita_digitale_id). Un''identita'' ha un binding solo (uq_profili_accesso_bindings_identita): lo stesso profilo gia'' legato ritorna quel binding (idempotente), un altro profilo gia'' legato lo rifiuta il vincolo col suo nome (il BB non sostituisce in silenzio). Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Coerenza e notifica dei permessi: i trigger della tabella. Non controlla il permesso (backend). INVOKER. Ritorna l''id del binding. Regola del 2: sede unica dell''INSERT che era in anagrafiche.fn_crea_risorsa_umana_v2 (binding SUPER_ADMIN), script.fn_crea_utente_tecnico (profilo chiesto) e AmmSoftwareRepository._set_super_admin_binding (2b-2). Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 8).';
