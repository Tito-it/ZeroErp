# UN PARAMETRO CON OVERRIDE NON DIVENTA «PER TUTTI» FINCHE' LI HA
#   config.trgfn_parameters_guard_ammette_override
#   Brief: brief-db-parametri-senza-override §3 punto 3 (D-1, Tid 2026-10-24)
#
# ── LA REGOLA ────────────────────────────────────────────────────
#   Il gemello inverso di 20261025-84. Un parametro che passa da
#   ammette_override = true a false mentre ha override lascerebbe righe che
#   nessuno legge piu': il lettore del default non le guarda, e la lista le
#   mostrerebbe. Il passaggio si rifiuta con E_PARAMETER_OVERRIDE_PRESENTI
#   finche' ne esiste anche una sola, ACCESA O SPENTA (stesso criterio del
#   guard sugli override: una riga spenta si riaccende).
#   Il verso false -> true passa sempre: aprire una famiglia non lascia orfani.
#
# ── ⚠️ CHI LO ATTRAVERSA ─────────────────────────────────────────
#   I mirror dei CSV dei parametri (80_data/20250715-01, 70_dati_sistema/
#   20260825-12) scrivono la colonna a ogni risveglio. Il primo apply porta a
#   false undici parametri: se uno di loro avesse un override, il migrate si
#   ferma qui, e il rimedio e' togliere l'override (era gia' ignorato), non il
#   guard.
#
# ── IL TRIGGER ───────────────────────────────────────────────────
#   BEFORE UPDATE OF ammette_override: nessun trigger BEFORE della tabella
#   scrive la colonna. Niente INSERT: un parametro nuovo non ha override.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261025-85-create-trgfn-parameters-guard-ammette-override-mctit.yaml

  - changeSet:
      id: 20261025-85-create-trgfn-parameters-guard-ammette-override
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard config.trgfn_parameters_guard_ammette_override su config.parameters (a10, BEFORE
        UPDATE OF ammette_override): il passaggio true -> false si rifiuta con
        E_PARAMETER_OVERRIDE_PRESENTI finche' il parametro ha override, accesi o spenti. Gemello
        inverso di 20261025-84. Brief: brief-db-parametri-senza-override §3 punto 3.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: config
            tableName: parameters
            columnName: ammette_override
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_parameters_guard_ammette_override()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: un parametro non passa a «vale per tutti»
              --   (ammette_override true -> false) finche' ha override, accesi
              --   o spenti: resterebbero righe che nessuno legge.
              -- Brief: brief-db-parametri-senza-override §3 punto 3.
              -- =========================================================
              DECLARE
                  -- un conteggio: niente colonna da ancorare
                  v_n bigint;
              BEGIN
                  -- Conta solo la chiusura: false -> true, o valore uguale, passano.
                  IF NOT (OLD.ammette_override AND NOT NEW.ammette_override) THEN
                      RETURN NEW;
                  END IF;

                  SELECT count(*)
                    INTO v_n
                    FROM config.parameter_overrides o
                   WHERE o.parameter_id = OLD.id;

                  IF v_n = 0 THEN
                      RETURN NEW;
                  END IF;

                  PERFORM script.fn_log_and_raise_error(
                      'database',
                      'config.trgfn_parameters_guard_ammette_override',
                      'E_PARAMETER_OVERRIDE_PRESENTI',
                      jsonb_build_object(
                          'parameter_id', OLD.id,
                          'code',         OLD.code,
                          'campo',        'ammette_override',
                          'n_override',   v_n),
                      NEW.tx_id,
                      OLD.code::text,
                      v_n::text);
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_parameters_guard_ammette_override() IS
                  'Guard di config.parameters (a10, BEFORE UPDATE OF ammette_override): il passaggio true -> false si rifiuta con E_PARAMETER_OVERRIDE_PRESENTI finche'' il parametro ha override in config.parameter_overrides, accesi o spenti (una riga spenta si riaccende). Il verso false -> true passa sempre. Gemello inverso di config.trgfn_parameter_overrides_guard_ammette_override. Brief: brief-db-parametri-senza-override §3 (D-1).';

              DROP TRIGGER IF EXISTS trg_parameters_a10_guard_ammette_override_upd
                  ON config.parameters;
              CREATE TRIGGER trg_parameters_a10_guard_ammette_override_upd
                  BEFORE UPDATE OF ammette_override ON config.parameters
                  FOR EACH ROW EXECUTE FUNCTION config.trgfn_parameters_guard_ammette_override();
      rollback:
        - sql:
            sql: >
              DROP TRIGGER IF EXISTS trg_parameters_a10_guard_ammette_override_upd ON config.parameters;
              DROP FUNCTION IF EXISTS config.trgfn_parameters_guard_ammette_override();
