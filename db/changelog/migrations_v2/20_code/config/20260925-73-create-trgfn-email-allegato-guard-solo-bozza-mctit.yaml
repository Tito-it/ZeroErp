# ------------------------------------------------------------
# config.trgfn_email_allegato_guard_solo_bozza — gli allegati di una mail si
#   toccano solo finche' la mail e' una bozza.
#   Brief: brief-db-email-visibilita-per-ambito §6.6, §8 (decisione Tid 2026-09-25)
#
# ── ⛔ IL DIFETTO ──────────────────────────────────────────────────
#   La regola «si tocca solo la bozza» viveva solo nel backend, e nemmeno
#   tutta: `remove_attachment` controlla chi puo' accedere alla bozza, non
#   che sia in DRAFT. Dopo l'invio lo stesso allegato e' legato anche al log:
#   toglierlo lo cancellava dalla storia della mail spedita.
#
# ── LA REGOLA ──────────────────────────────────────────────────────
#   INSERT, UPDATE, DELETE di un allegato: ogni bozza coinvolta (su UPDATE
#   anche quella di provenienza) dev'essere in DRAFT.
#   * ⭐ UNICA ECCEZIONE — l'aggancio al log. All'invio il backend scrive
#     `email_log_id` sugli allegati mentre la bozza e' READY
#     (copy_allegati_to_log), e dopo un invio fallito lo RI-scrive al tentativo
#     successivo. Un UPDATE che cambia SOLO `email_log_id`, verso un valore non
#     nullo, passa. Staccare un allegato dal log (verso NULL) non e'
#     un aggancio: segue la regola generale.
#   * Bozza ASSENTE (zero righe dal lettore): e' il CASCADE dalla bozza, che
#     il guard della bozza (20260925-72) ha gia' ammesso solo in DRAFT, oppure
#     una FK che parlera' da sola. Si passa — come nel BB delle righe.
#   * Allegato SENZA bozza ma con un log: e' storia pura, non c'e' nessuna
#     bozza che possa essere in DRAFT. Si rifiuta.
#   * Allegato senza bozza e senza log: la regola non ha niente da dire; lo
#     ferma la policy (nessun pubblico, 20260925-68).
#
# ── ⚠️ PERCHE' NON IL BB DELLE RIGHE (vendite.trgfn_doc_righe_lock_fuori_bozza) ─
#   Stessa prima meta' di significato, ma l'allegato ha un SECONDO padre (il
#   log) e un aggancio legittimo fuori dalla bozza (READY): il BB lo
#   rifiuterebbe e fermerebbe l'invio. Allargarlo vorrebbe dire insegnare a un
#   guard di documenti di vendita un'eccezione che nessun documento di vendita
#   ha. Il LETTORE invece e' lo stesso (script.fn_get_stato_testata_documento,
#   ramo EMAIL_BOZZA, 20260925-71).
#
# ── LETTURA ────────────────────────────────────────────────────────
#   Lo stato della bozza si legge dal lettore SECURITY DEFINER: la bozza ha
#   la RLS, e un guard invoker non distinguerebbe «non c'e'» da «non la vedo».
#
# Codice: E_EMAIL_ALLEGATO_NON_BOZZA (CONFLITTO_STATO), gemello di
#   E_RIGA_DOC_NON_BOZZA con la parola giusta: «allegati», non «righe».
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260925-73-create-trgfn-email-allegato-guard-solo-bozza-mctit.yaml

  - changeSet:
      id: 20260925-73-create-trgfn-email-allegato-guard-solo-bozza
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.trgfn_email_allegato_guard_solo_bozza: un allegato si aggiunge,
        modifica o toglie solo se la sua bozza e' DRAFT; unica eccezione
        l'aggancio al log all'invio (UPDATE del solo email_log_id). Allegato con
        log e senza bozza: storia, rifiutato. Brief:
        brief-db-email-visibilita-per-ambito.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
               JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_get_stato_testata_documento'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_email_allegato_guard_solo_bozza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_riga      config.email_allegato%ROWTYPE;   -- NEW, o OLD sul DELETE
                -- ⚠️ bigint[] nudo: `%TYPE[]` non e' sintassi PostgreSQL. E' un
                --   array di config.email_outbox.id (bigint).
                v_bozze     bigint[];                         -- una, due se cambia bozza
                v_bozza_id  config.email_outbox.id%TYPE;
                v_stato     text;   -- dal lettore: RETURNS TABLE(stato text, ...)
                v_etichetta text;   -- idem
                v_verbo     text;   -- la frase per l'operatore, non una colonna
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Gli allegati di una mail si aggiungono, modificano e
                --   tolgono SOLO finche' la mail e' una bozza DRAFT. Dopo
                --   l'invio l'allegato e' anche storia del log.
                --   ⭐ Unica eccezione: l'aggancio al log (UPDATE del solo
                --   email_log_id verso un valore), che il backend fa a
                --   bozza READY e rifa' a ogni nuovo tentativo.
                -- =========================================================
                IF TG_OP = 'DELETE' THEN
                  v_riga := OLD;
                ELSE
                  v_riga := NEW;
                END IF;

                -- ── L'aggancio al log: passa ──────────────────────────
                IF TG_OP = 'UPDATE'
                   AND NEW.email_log_id IS NOT NULL
                   AND (to_jsonb(NEW) - 'email_log_id') = (to_jsonb(OLD) - 'email_log_id') THEN
                  RETURN NEW;
                END IF;

                v_verbo := CASE TG_OP
                             WHEN 'INSERT' THEN 'aggiungere'
                             WHEN 'UPDATE' THEN 'modificare'
                             ELSE               'togliere'
                           END;

                -- ── Le bozze da guardare ──────────────────────────────
                -- Su UPDATE anche quella di provenienza: spostare un allegato
                -- da una mail spedita a una bozza e' comunque toccare la
                -- mail spedita.
                v_bozze := ARRAY[]::bigint[];
                IF TG_OP = 'UPDATE' AND OLD.email_outbox_id IS NOT NULL THEN
                  v_bozze := v_bozze || OLD.email_outbox_id;
                END IF;
                IF v_riga.email_outbox_id IS NOT NULL
                   AND NOT (v_riga.email_outbox_id = ANY (v_bozze)) THEN
                  v_bozze := v_bozze || v_riga.email_outbox_id;
                END IF;

                -- ── Nessuna bozza, ma un log: e' storia ───────────────
                IF cardinality(v_bozze) = 0
                   AND (v_riga.email_log_id IS NOT NULL
                        OR (TG_OP = 'UPDATE' AND OLD.email_log_id IS NOT NULL)) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'config', TG_NAME::text, 'E_EMAIL_ALLEGATO_NON_BOZZA',
                    jsonb_build_object('table',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                       'id',         v_riga.id,
                                       'email_log_id', v_riga.email_log_id,
                                       'operazione', TG_OP),
                    NULL::uuid,
                    'La mail',
                    'registrata nel log, senza bozza',
                    v_verbo);
                END IF;

                FOREACH v_bozza_id IN ARRAY v_bozze LOOP
                  v_stato := NULL;
                  v_etichetta := NULL;

                  SELECT t.stato, t.etichetta
                    INTO v_stato, v_etichetta
                    FROM script.fn_get_stato_testata_documento('EMAIL_BOZZA', v_bozza_id) AS t;

                  -- Assente: CASCADE dalla bozza (gia' ammesso solo in DRAFT
                  -- dal guard della bozza), o FK che parlera'. Si passa.
                  CONTINUE WHEN v_stato IS NULL;

                  IF v_stato <> 'DRAFT' THEN
                    PERFORM script.fn_log_and_raise_error(
                      'config', TG_NAME::text, 'E_EMAIL_ALLEGATO_NON_BOZZA',
                      jsonb_build_object('table',           TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                         'id',              v_riga.id,
                                         'email_outbox_id', v_bozza_id,
                                         'stato',           v_stato,
                                         'operazione',      TG_OP),
                      NULL::uuid,
                      v_etichetta,
                      v_stato,
                      v_verbo);
                  END IF;
                END LOOP;

                RETURN v_riga;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_email_allegato_guard_solo_bozza() IS
                'Gli allegati di una mail si aggiungono, modificano e tolgono solo '
                'finche'' la sua bozza (config.email_outbox) e'' DRAFT: dopo l''invio '
                'l''allegato e'' anche storia del log. Unica eccezione: l''aggancio al '
                'log, cioe'' un UPDATE che cambia solo email_log_id verso un valore — '
                'il backend lo fa a bozza READY e lo rifa'' a ogni nuovo tentativo. '
                'Bozza assente = CASCADE dalla bozza (ammesso solo in DRAFT da '
                'vendite.trgfn_doc_guard_delete_solo_bozza) o FK che parlera'': passa. '
                'Allegato con log e senza bozza: storia, rifiutato. Lo stato si legge '
                'da script.fn_get_stato_testata_documento (SECURITY DEFINER), perche'' '
                'la bozza ha la RLS. Codice E_EMAIL_ALLEGATO_NON_BOZZA. Brief: '
                'brief-db-email-visibilita-per-ambito. rev 2026-09-25.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS config.trgfn_email_allegato_guard_solo_bozza();
