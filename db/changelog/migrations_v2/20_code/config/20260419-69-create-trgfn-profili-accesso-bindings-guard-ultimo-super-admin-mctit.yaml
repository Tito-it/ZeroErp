databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260419-69-create-trgfn-profili-accesso-bindings-guard-ultimo-super-admin-mctit.yaml

  - changeSet:
      id: 20260419-69-create-trgfn-profili-accesso-bindings-guard-ultimo-super-admin
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Guard anti-lockout su config.profili_accesso_bindings (13.3.6 WIP
        multi-face-auth). Trigger AFTER UPDATE OR DELETE per riga: se la
        transizione riguarda un binding SUPER_ADMIN attivo (DELETE,
        disattivazione, o cambio profilo) e dopo l'operazione non
        esiste piu' alcun SUPER_ADMIN raggiungibile, solleva
        E_PROFILO_ULTIMO_SUPER_ADMIN e abortisce la transazione.
        La verifica vera e' delegata a script.fn_check_almeno_un_super_admin_attivo
        per DRY (stesso check usato dal trigger su identita_digitali).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: config, tableName: profili_accesso_bindings }
          - sqlCheck:
              expectedResult: "1"
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_check_almeno_un_super_admin_attivo';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_profili_accesso_bindings_guard_ultimo_super_admin()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_old_is_super_admin boolean := false;
                  v_transition_risky   boolean := false;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Impedire che un'operazione su profili_accesso_bindings
                  --   lasci il sistema senza alcun SUPER_ADMIN attivo.
                  --
                  -- Regole:
                  --   1. Short-circuit: il trigger lavora solo se la vecchia
                  --      riga puntava a un profilo SUPER_ADMIN ed era attiva.
                  --      Tutte le altre transizioni non possono ridurre il
                  --      numero di super admin raggiungibili.
                  --   2. La transizione e' a rischio se:
                  --      - DELETE
                  --      - UPDATE con NEW.attivo = false
                  --      - UPDATE con cambio profilo_accesso_id
                  --      - UPDATE con cambio identita_digitale_id
                  --   3. Se a rischio, verifica post-stato via
                  --      fn_check_almeno_un_super_admin_attivo. Se false,
                  --      raise E_PROFILO_ULTIMO_SUPER_ADMIN.
                  -- =========================================================

                  IF OLD.attivo = true THEN
                      SELECT (pa.codice = 'SUPER_ADMIN')
                        INTO v_old_is_super_admin
                        FROM config.profili_accesso pa
                       WHERE pa.id = OLD.profilo_accesso_id;
                  END IF;

                  IF NOT COALESCE(v_old_is_super_admin, false) THEN
                      RETURN NULL;
                  END IF;

                  IF TG_OP = 'DELETE' THEN
                      v_transition_risky := true;
                  ELSIF TG_OP = 'UPDATE' THEN
                      v_transition_risky :=
                             NEW.attivo             = false
                          OR NEW.profilo_accesso_id IS DISTINCT FROM OLD.profilo_accesso_id
                          OR NEW.identita_digitale_id IS DISTINCT FROM OLD.identita_digitale_id;
                  END IF;

                  IF NOT v_transition_risky THEN
                      RETURN NULL;
                  END IF;

                  IF NOT script.fn_check_almeno_un_super_admin_attivo() THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config',
                          TG_NAME,
                          'E_PROFILO_ULTIMO_SUPER_ADMIN',
                          jsonb_build_object(
                              'op', TG_OP,
                              'old_binding_id', OLD.id,
                              'old_profilo_accesso_id', OLD.profilo_accesso_id,
                              'old_identita_digitale_id', OLD.identita_digitale_id
                          ),
                          NULL::uuid,
                          format('Operazione %s sul binding id=%s lascerebbe zero SUPER_ADMIN attivi', TG_OP, OLD.id)
                      );
                  END IF;

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_profili_accesso_bindings_guard_ultimo_super_admin() IS
                  'Guard anti-lockout: impedisce operazioni su profili_accesso_bindings che lascerebbero il sistema senza SUPER_ADMIN raggiungibili. Delega il check a script.fn_check_almeno_un_super_admin_attivo. Codice errore E_PROFILO_ULTIMO_SUPER_ADMIN.';

        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_profili_accesso_bindings_a10_guard_ultimo_super_admin_upd_dlt
                  ON config.profili_accesso_bindings;

              CREATE TRIGGER trg_profili_accesso_bindings_a10_guard_ultimo_super_admin_upd_dlt
                  AFTER UPDATE OR DELETE
                  ON config.profili_accesso_bindings
                  FOR EACH ROW
                  EXECUTE FUNCTION config.trgfn_profili_accesso_bindings_guard_ultimo_super_admin();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_profili_accesso_bindings_a10_guard_ultimo_super_admin_upd_dlt
                  ON config.profili_accesso_bindings;
              DROP FUNCTION IF EXISTS config.trgfn_profili_accesso_bindings_guard_ultimo_super_admin();
