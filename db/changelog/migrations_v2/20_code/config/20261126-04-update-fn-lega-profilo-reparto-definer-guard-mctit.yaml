# ------------------------------------------------------------
# IL LEGAME DI UN PROFILO A UN REPARTO DIVENTA UN VERBO DEFINER COL SUO PERMESSO
#   config.fn_lega_profilo_reparto
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   1. SECURITY DEFINER, search_path pg_catalog, public, pg_temp: con la tabella
#      dei legami in sola lettura per l'app (90_end/20261126-24) scrive il
#      proprietario.
#   2. Il permesso in prima riga: script.fn_guard_super_admin sull'utente di
#      sessione, lo stesso controllo dell'endpoint (RepartoProfiloView.put, AmmSoftwareRepository.put_profilo_reparto).
#   3. Nessuna primitiva: nessuna funzione del database la chiama.
#   Corpo dal catalogo di dbdev, firma ancorata come nella revisione
#   precedente. L'EXECUTE all'app resta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261126-04-update-fn-lega-profilo-reparto-definer-guard-mctit.yaml

  - changeSet:
      id: 20261126-04-update-fn-lega-profilo-reparto-definer-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_lega_profilo_reparto: SECURITY DEFINER col guard del SUPER_ADMIN. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_lega_profilo_reparto(
                  p_profilo_accesso_id     config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  p_unita_organizzativa_id config.profili_accesso_bindings.unita_organizzativa_id%TYPE)
               RETURNS config.profili_accesso_bindings.id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente config.user_emittenti_fiscali.auth_user_id%TYPE;
                  v_id config.profili_accesso_bindings.id%TYPE;
              BEGIN
                  -- Il permesso, prima di ogni altra cosa.
                  v_utente := script.fn_utente_di_sessione('config.fn_lega_profilo_reparto');
                  PERFORM script.fn_guard_super_admin(v_utente);

                  -- =========================================================
                  -- Scopo:
                  --   Legare un reparto (unita' organizzativa) a un profilo
                  --   di accesso. Ritorna l'id del binding.
                  --
                  -- Regole:
                  --   - lo stesso profilo gia' legato: ritorna quel binding;
                  --   - un altro profilo gia' legato: lo dice il vincolo
                  --     uq_profili_accesso_bindings_uo;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_unita_organizzativa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_lega_profilo_reparto', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',     p_profilo_accesso_id,
                                             'unita_organizzativa_id', p_unita_organizzativa_id),
                          NULL::uuid,
                          'config.fn_lega_profilo_reparto',
                          'profilo o reparto mancanti');
                  END IF;

                  SELECT pab.id
                    INTO v_id
                    FROM config.profili_accesso_bindings pab
                   WHERE pab.unita_organizzativa_id = p_unita_organizzativa_id
                     AND pab.profilo_accesso_id     = p_profilo_accesso_id;

                  IF v_id IS NOT NULL THEN
                      RETURN v_id;
                  END IF;

                  INSERT INTO config.profili_accesso_bindings (profilo_accesso_id, unita_organizzativa_id)
                  VALUES (p_profilo_accesso_id, p_unita_organizzativa_id)
                  RETURNING id INTO v_id;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_lega_profilo_reparto(p_profilo_accesso_id integer, p_unita_organizzativa_id integer)
              IS 'Il verbo con cui il SUPER_ADMIN lega un reparto (unità organizzativa) a un profilo di accesso, la riga di config.profili_accesso_bindings con unita_organizzativa_id; ritorna l''id del legame. SECURITY DEFINER: in prima riga chiede il SUPER_ADMIN all''utente di sessione (script.fn_guard_super_admin: E_PERMESSO_NEGATO, anche senza utente), lo stesso controllo dell''endpoint. Lo stesso profilo già legato ritorna quel legame, un altro profilo già legato lo rifiuta uq_profili_accesso_bindings_uo; argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Coerenza e notifica dei permessi: i trigger della tabella. Il contrario: config.fn_slega_profilo_reparto. config.profili_accesso_bindings è in sola lettura per l''applicazione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_lega_profilo_reparto(p_profilo_accesso_id integer, p_unita_organizzativa_id integer)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_id config.profili_accesso_bindings.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Legare un reparto (unita' organizzativa) a un profilo
                  --   di accesso. Ritorna l'id del binding.
                  --
                  -- Regole:
                  --   - lo stesso profilo gia' legato: ritorna quel binding;
                  --   - un altro profilo gia' legato: lo dice il vincolo
                  --     uq_profili_accesso_bindings_uo;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_unita_organizzativa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_lega_profilo_reparto', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',     p_profilo_accesso_id,
                                             'unita_organizzativa_id', p_unita_organizzativa_id),
                          NULL::uuid,
                          'config.fn_lega_profilo_reparto',
                          'profilo o reparto mancanti');
                  END IF;

                  SELECT pab.id
                    INTO v_id
                    FROM config.profili_accesso_bindings pab
                   WHERE pab.unita_organizzativa_id = p_unita_organizzativa_id
                     AND pab.profilo_accesso_id     = p_profilo_accesso_id;

                  IF v_id IS NOT NULL THEN
                      RETURN v_id;
                  END IF;

                  INSERT INTO config.profili_accesso_bindings (profilo_accesso_id, unita_organizzativa_id)
                  VALUES (p_profilo_accesso_id, p_unita_organizzativa_id)
                  RETURNING id INTO v_id;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_lega_profilo_reparto(p_profilo_accesso_id integer, p_unita_organizzativa_id integer)
              IS 'MADRE (2026-10-19): lega un reparto (unita'' organizzativa) a un profilo di accesso, la riga di config.profili_accesso_bindings con unita_organizzativa_id. Gemella di config.fn_lega_profilo_identita. Un reparto ha un binding solo (uq_profili_accesso_bindings_uo): lo stesso profilo gia'' legato ritorna quel binding (idempotente), un altro profilo gia'' legato lo rifiuta il vincolo col suo nome (non sostituisce in silenzio: il backend con ON CONFLICT DO UPDATE sostituiva, ma il profilo di un reparto ha sempre lo stesso codice e quindi lo stesso id). Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Coerenza e notifica dei permessi: i trigger della tabella. Non controlla il permesso (backend). INVOKER. Il contrario: config.fn_slega_profilo_reparto. Sede unica dell''UPSERT di AmmSoftwareRepository.put_profilo_reparto. R-BE-7, D-16b di Tid, brief-db-processi-accensione-per-ambiente §6.16.';
