# Liquibase changelog per Zero ERP
# Default stato_id su config.toponomastica
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/config/20260102-07-trgfn-toponomastica-normalize-mctit.yaml

  - changeSet:
      id: 20260102-07-trgfn-toponomastica-normalize
      author: mctit
      comment: >
        Imposta stato_id di default su config.toponomastica e valida la presenza del valore.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_toponomastica_normalize()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Default stato_id se mancante
                IF NEW.stato_id IS NULL THEN
                  NEW.stato_id := script.fn_get_default_by_param(
                    'config',
                    'stati',
                    'codice_iso3',
                    'state_code_iso3',
                    TG_NAME
                  )::integer;
                END IF;

                -- Se ancora NULL, errore
                IF NEW.stato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_STATO_SCONOSCIUTO',
                    jsonb_build_object('table','config.toponomastica'),
                    NULL::uuid,
                    'stato_id'
                  );
                END IF;

                RETURN NEW;
              END;
              $function$;

              comment on function config.trgfn_toponomastica_normalize()
                is 'Trigger function per default stato_id e validazione obbligatoria su config.toponomastica.';


              DROP TRIGGER IF EXISTS trg_toponomastica_normalize_ins_upd
                ON config.toponomastica;

              CREATE TRIGGER trg_toponomastica_normalize_ins_upd
                BEFORE INSERT OR UPDATE
                ON config.toponomastica
                FOR EACH ROW
                EXECUTE FUNCTION config.trgfn_toponomastica_normalize();

              COMMENT ON TRIGGER trg_toponomastica_normalize_ins_upd
                ON config.toponomastica
                IS 'Default stato_id e validazione obbligatoria tramite fn_get_default_by_param.';
