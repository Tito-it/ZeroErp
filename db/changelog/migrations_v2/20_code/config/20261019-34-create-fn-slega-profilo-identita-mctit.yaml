# MADRE: SLEGARE UN PROFILO DA UN'IDENTITA'
#   config.fn_slega_profilo_identita(profilo, identita'): toglie il binding
#   di un'identita' digitale da quel profilo di accesso. Ritorna quanti
#   binding ha tolto (0 o 1). Il contrario di config.fn_lega_profilo_identita.
#   R-BE-7 del BE, decisione D-16c di Tid (2026-10-19),
#   brief-db-processi-accensione-per-ambiente §6.10 (richiesta) e §6.16
#   (risposta).
#
# -- CHI ERA LA COPIA -----------------------------------------------------------
#   Il backend slegava il SUPER_ADMIN con un DELETE suo
#   (AmmSoftwareRepository._set_super_admin_binding, ramo enabled = false):
#   lo slegare non aveva una madre. Il backend passa a questa (R-DB-16a), col
#   profilo da config.fn_profilo_super_admin_id.
#
# -- LE SCELTE -------------------------------------------------------------------
#   * si toglie il binding SOLO se punta a quel profilo: slegare il SUPER_ADMIN
#     da un'identita' che ha un altro profilo non tocca l'altro profilo;
#   * nessun binding: non e' un errore, ritorna 0 (idempotente, come il legare);
#   * l'ultimo super admin attivo: lo protegge il trigger della tabella
#     (trgfn_profili_accesso_bindings_guard_ultimo_super_admin, che scatta
#     anche sul DELETE), non questa madre: vale per ogni scrittore;
#   * il permesso: backend. INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261019-34-create-fn-slega-profilo-identita-mctit.yaml

  - changeSet:
      id: 20261019-34-create-fn-slega-profilo-identita
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea config.fn_slega_profilo_identita: toglie il binding di un'identita' da quel profilo,
        il contrario di config.fn_lega_profilo_identita. Sede unica del DELETE del backend
        (_set_super_admin_binding). R-BE-7, D-16c di Tid,
        brief-db-processi-accensione-per-ambiente §6.16.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_slega_profilo_identita(
                  p_profilo_accesso_id   config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  p_identita_digitale_id config.profili_accesso_bindings.identita_digitale_id%TYPE)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_tolti integer;  -- un conteggio: nessuna colonna di cui sia il riflesso
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Togliere il binding di un'identita' digitale da quel
                  --   profilo di accesso. Ritorna quanti binding ha tolto.
                  --
                  -- Regole:
                  --   - solo il binding verso QUEL profilo;
                  --   - nessun binding: ritorna 0, non e' un errore;
                  --   - l'ultimo super admin lo protegge il trigger della
                  --     tabella;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_identita_digitale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_slega_profilo_identita', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',   p_profilo_accesso_id,
                                             'identita_digitale_id', p_identita_digitale_id),
                          NULL::uuid,
                          'config.fn_slega_profilo_identita',
                          'profilo o identita'' mancanti');
                  END IF;

                  DELETE FROM config.profili_accesso_bindings pab
                   WHERE pab.identita_digitale_id = p_identita_digitale_id
                     AND pab.profilo_accesso_id   = p_profilo_accesso_id;

                  GET DIAGNOSTICS v_tolti = ROW_COUNT;
                  RETURN v_tolti;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_slega_profilo_identita(
                      config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                      config.profili_accesso_bindings.identita_digitale_id%TYPE)
              IS 'MADRE (2026-10-19): toglie il binding di un''identita'' digitale da QUEL profilo di accesso (un''identita'' che ha un altro profilo non perde l''altro); ritorna quanti binding ha tolto, 0 se non ce n''era (idempotente). Il contrario di config.fn_lega_profilo_identita. L''ultimo super admin attivo lo protegge il trigger della tabella (trgfn_profili_accesso_bindings_guard_ultimo_super_admin, anche sul DELETE), per ogni scrittore. Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Non controlla il permesso (backend). INVOKER. Sede unica del DELETE di AmmSoftwareRepository._set_super_admin_binding (ramo enabled = false). R-BE-7, D-16c di Tid, brief-db-processi-accensione-per-ambiente §6.16.';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS config.fn_slega_profilo_identita(config.profili_accesso_bindings.profilo_accesso_id%TYPE, config.profili_accesso_bindings.identita_digitale_id%TYPE);
