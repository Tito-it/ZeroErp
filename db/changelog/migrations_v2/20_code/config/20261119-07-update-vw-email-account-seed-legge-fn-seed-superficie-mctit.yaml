# ------------------------------------------------------------
# config.vw_email_account_seed: il segno del seed da dbops.fn_seed_superficie.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§16.15, QU3).
#
# Che cosa cambia: la regola (nata_dal_seed, i campi del software solo sulle
#   righe di seed, vuoto e mai NULL) non e' piu' scritta qui ma nel building
#   block 20261119-06 (regola del 2). Colonne, nomi, tipi e ordine identici:
#   CREATE OR REPLACE VIEW tiene owner e privilegi. Le colonne del software si
#   leggono ancora una volta per la vista.
# Definizione viva: quella di 20261117-26. Il rollback e' la sua definizione e il
#   suo COMMENT.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261119-07-update-vw-email-account-seed-legge-fn-seed-superficie-mctit.yaml

  - changeSet:
      id: 20261119-07-update-vw-email-account-seed-legge-fn-seed-superficie
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.vw_email_account_seed: il segno del seed da dbops.fn_seed_superficie. Brief:
        brief-db-seed-primo-impianto-non-si-riscrive (§16.15).
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: config
            viewName: vw_email_account_seed
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW config.vw_email_account_seed
              WITH (security_invoker = true) AS
              SELECT ea.id                         AS email_account_id,
                     seed.nata_dal_seed,
                     seed.campi_del_software
                FROM config.email_account ea
                -- Le colonne del software valgono per la tabella: la sottoquery non e'
                -- correlata e si legge una volta (InitPlan); il giudizio e' per riga.
                CROSS JOIN LATERAL dbops.fn_seed_superficie(
                    'config.email_account'::regclass,
                    ea.id::text,
                    (SELECT dbops.fn_seed_colonne_del_software('config.email_account'::regclass))) seed;

              COMMENT ON VIEW config.vw_email_account_seed IS 'Il segno del seed di primo impianto sulle righe degli account di posta (config.email_account): una riga per riga (email_account_id), con il giudizio di dbops.fn_seed_superficie. nata_dal_seed: la riga l''ha installata il software (dbops.fn_seed_riga), non l''azienda. campi_del_software: su una riga nata dal seed le colonne che l''installazione non modifica, dal montaggio del trigger (dbops.fn_seed_colonne_del_software, letto una volta), le stesse su cui il guard script.trgfn_seed_primo_impianto alza E_SEED_COLONNA_DEL_SOFTWARE; vuoto, mai NULL, su una riga dell''installazione o quando la forma della tabella non ne ha. Non elenca le colonne che altri meccanismi tengono ferme (script.trgfn_lock_columns). Nessuna azione di eliminazione: la riga non si cancella (dbops.automation_delete_block), si spegne con attivo. security_invoker. Si filtra per email_account_id.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW config.vw_email_account_seed
              WITH (security_invoker = true) AS
              SELECT ea.id                         AS email_account_id,
                     seed.nata_dal_seed,
                     CASE WHEN seed.nata_dal_seed THEN sw.colonne
                          ELSE ARRAY[]::text[]
                     END                           AS campi_del_software
                FROM config.email_account ea
                -- Le colonne del software valgono per la tabella: si leggono una volta.
                CROSS JOIN (
                    SELECT dbops.fn_seed_colonne_del_software('config.email_account'::regclass) AS colonne
                ) sw
                CROSS JOIN LATERAL (
                    SELECT EXISTS (SELECT 1 FROM dbops.fn_seed_riga('config.email_account'::regclass, ea.id::text))
                           AS nata_dal_seed
                ) seed;

              COMMENT ON VIEW config.vw_email_account_seed IS 'Il segno del seed di primo impianto sulle righe degli account di posta (config.email_account): una riga per riga (email_account_id). nata_dal_seed: la riga l''ha installata il software (dbops.fn_seed_riga), non l''azienda. campi_del_software: su una riga nata dal seed le colonne che l''installazione non modifica, dal montaggio del trigger (dbops.fn_seed_colonne_del_software), le stesse su cui il guard script.trgfn_seed_primo_impianto alza E_SEED_COLONNA_DEL_SOFTWARE; vuoto, mai NULL, su una riga dell''installazione o quando la forma della tabella non ne ha. Non elenca le colonne che altri meccanismi tengono ferme (script.trgfn_lock_columns). Nessuna azione di eliminazione: la riga non si cancella (dbops.automation_delete_block), si spegne con attivo. security_invoker. Si filtra per email_account_id.';
