  - changeSet:
      id: 20251119-21-config-rename-function
      author: mctit
      comment: "Rinomina trigger function schema config secondo convenzione trgfn_<tabella>_<descrizione>"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              ALTER FUNCTION config.trgfn_iva_ins_upd_check_conti_iva()
                 RENAME TO trgfn_iva_guard_conti_iva;

