# IL PANNELLO SCRIVE L'ASSENZA COME NULL
#   config.fn_pannello_scrivi, passo 2-bis nuovo: una stringa vuota o di soli
#   spazi destinata a una colonna di TESTO NULLABLE diventa null prima della
#   scrittura. Brief: brief-db-token-null-dei-seed (D5 (a), Tid 2026-11-13).
#
# ⚠️ PERCHE'. Il drawer generico, in modifica, manda il campo svuotato come
#   '': il verbo lo scriveva com'era. Le colonne col CHECK «mai la stringa
#   vuota» lo rifiutavano (23514): config.iva_assoggettamenti.note dal
#   90_end/20261112-36, e config.note_stili.note dal 90_end/20261112-58.
#   La regola «l'assenza e' NULL» sta nel database, e il verbo e' la sede
#   unica della scrittura dal pannello: qui, non nel drawer.
#
# ℹ️ COSA NON CAMBIA. Le colonne NOT NULL ricevono il valore com'e' (per
#   esempio config.sistema_codici.separatore, dove '' e' «nessun separatore»).
#   Una stringa con testo vero passa intatta, spazi compresi: il verbo decide
#   solo fra vuoto e assente, non ripulisce i valori. I tipi non testuali li
#   converte jsonb_populate_record come prima.
#   «Testo» e' la categoria di tipo S (text, varchar, char, e i domini su
#   questi), letta da pg_type per la colonna della tabella trovata al passo 0.
#
# Corpo vivo di partenza: doc auto-gen config/funzioni/fn_pannello_scrivi
#   (20261017-07). Firma, codici e altri passi invariati.
# Presidio: config/test-fn-pannello-scrivi-stringa-vuota-v1.
#
# id-senza-type: ammesso — p_id e' l'id di una riga di QUALUNQUE tabella del pannello, scelta a runtime: non c'e' una colonna sola da cui prendere il %TYPE, e bigint copre tutte le chiavi
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261112-57-update-fn-pannello-scrivi-stringa-vuota-null-mctit.yaml

  - changeSet:
      id: 20261112-57-update-fn-pannello-scrivi-stringa-vuota-null
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        config.fn_pannello_scrivi: la stringa vuota destinata a una colonna di testo nullable diventa null
        (passo 2-bis). Brief: brief-db-token-null-dei-seed (D5).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'config' AND p.proname = 'fn_pannello_scrivi';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_pannello_scrivi(
                  p_tabella config.tabelle_gestibili.codice_interno%TYPE,
                  p_id      bigint,
                  p_dati    jsonb
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo: scrivere (INSERT o UPDATE per id) una riga di una tabella gestita
              --   dal pannello di configurazione, applicando il livello TUTTO sull'oggetto
              --   a cui la tabella appartiene. Ritorna la riga scritta.
              DECLARE
                  v_voce      config.tabelle_gestibili%ROWTYPE;
                  v_relid     oid;
                  v_rls       boolean;
                  v_scrivibili text[];
                  v_estranea  text;
                  v_riga      jsonb;
                  v_dati      jsonb;
              BEGIN
                  -- 0. La tabella: nella lista, nel pannello, esistente, senza RLS.
                  SELECT tg.*
                    INTO v_voce
                    FROM config.tabelle_gestibili tg
                   WHERE tg.codice_interno = p_tabella
                     AND tg.pannello;

                  IF FOUND THEN
                      SELECT c.oid, c.relrowsecurity
                        INTO v_relid, v_rls
                        FROM pg_catalog.pg_class c
                        JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                       WHERE n.nspname = v_voce.schema_tabella
                         AND c.relname = v_voce.nome_tabella
                         AND c.relkind IN ('r', 'p');
                  END IF;

                  IF v_relid IS NULL OR v_rls THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_pannello_scrivi', 'E_PANNELLO_TABELLA_NON_AMMESSA',
                          jsonb_build_object('tabella',  p_tabella,
                                             'in_lista', v_voce.id IS NOT NULL,
                                             'esiste',   v_relid IS NOT NULL,
                                             'rls',      v_rls),
                          NULL::uuid,
                          COALESCE(p_tabella, '(nessuna)'));
                  END IF;

                  -- 1. Il permesso: TUTTO sull'oggetto della riga di lista (D-5).
                  PERFORM script.fn_guard_livello(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer,
                      v_voce.app_label, v_voce.model_name, 'TUTTO');

                  -- 2. Il payload: un oggetto non vuoto, solo colonne scrivibili.
                  IF p_dati IS NULL OR jsonb_typeof(p_dati) <> 'object' OR p_dati = '{}'::jsonb THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_pannello_scrivi', 'E_PANNELLO_DATI_VUOTI',
                          jsonb_build_object('tabella', p_tabella, 'id', p_id,
                                             'tipo', jsonb_typeof(p_dati)),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- Le colonne scrivibili hanno una sede sola, letta anche dal metadata
                  -- del backend (20260927-21).
                  v_scrivibili := config.fn_pannello_colonne_scrivibili(p_tabella);

                  -- La regola «una chiave estranea si rifiuta» e' il BB
                  -- script.fn_prima_chiave_estranea (rev 2026-10-17, regola del 2).
                  v_estranea := script.fn_prima_chiave_estranea(p_dati, v_scrivibili);

                  IF v_estranea IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_pannello_scrivi', 'E_PANNELLO_CAMPO_NON_AMMESSO',
                          jsonb_build_object('tabella', p_tabella, 'id', p_id,
                                             'campo',   v_estranea),
                          NULL::uuid,
                          v_estranea);
                  END IF;

                  -- 2-bis. L'assenza ha una forma sola (D5 di brief-db-token-null-dei-seed):
                  --   una stringa vuota o di soli spazi destinata a una colonna di testo
                  --   NULLABLE diventa null. Le colonne NOT NULL la ricevono com'e'; un
                  --   testo vero passa intatto.
                  SELECT jsonb_object_agg(
                             e.key,
                             CASE WHEN jsonb_typeof(e.value) = 'string'
                                   AND btrim(e.value #>> '{}') = ''
                                   AND EXISTS (
                                       SELECT 1
                                         FROM pg_catalog.pg_attribute a
                                         JOIN pg_catalog.pg_type t ON t.oid = a.atttypid
                                        WHERE a.attrelid = v_relid
                                          AND a.attname = e.key
                                          AND a.attnum > 0
                                          AND NOT a.attisdropped
                                          AND NOT a.attnotnull
                                          AND t.typcategory = 'S')
                                  THEN 'null'::jsonb
                                  ELSE e.value
                             END)
                    INTO v_dati
                    FROM jsonb_each(p_dati) AS e;

                  -- 3. La scrittura. I valori li converte PostgreSQL, sul tipo di riga:
                  --    il BB script.fn_scrivi_riga_da_jsonb (rev 2026-10-17, regola del 2).
                  --    La tabella gli arriva per oid, quello trovato al passo 0.
                  IF p_id IS NULL THEN
                      v_riga := script.fn_scrivi_riga_da_jsonb(v_relid::regclass, v_dati);
                  ELSE
                      v_riga := script.fn_scrivi_riga_da_jsonb(
                                    v_relid::regclass, v_dati, jsonb_build_object('id', p_id));

                      IF v_riga IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'config', 'config.fn_pannello_scrivi', 'E_PANNELLO_RIGA_NON_TROVATA',
                              jsonb_build_object('tabella', p_tabella, 'id', p_id),
                              NULL::uuid,
                              p_id::text);
                      END IF;
                  END IF;

                  -- 4. La riga, con i campi del form: id e le colonne scrivibili.
                  RETURN (SELECT jsonb_object_agg(e.key, e.value)
                            FROM jsonb_each(v_riga) AS e
                           WHERE e.key = 'id'
                              OR e.key = ANY (v_scrivibili));
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_pannello_scrivi(config.tabelle_gestibili.codice_interno%TYPE, bigint, jsonb) IS
                  'VERBO del pannello di configurazione: ogni scrittura del pannello passa da qui. Scrive una riga di una tabella di config.tabelle_gestibili con pannello = true: p_id NULL = INSERT, altrimenti UPDATE per id. Passo 0: tabella in lista, esistente e SENZA RLS (il verbo non sa rimettere un perimetro) -> altrimenti E_PANNELLO_TABELLA_NON_AMMESSA. Passo 1: script.fn_guard_livello(utente, app_label, model_name, TUTTO) sull''oggetto della riga di lista, non sull''area del pannello (E_PERMESSO_NEGATO). Passo 2: p_dati oggetto jsonb non vuoto (E_PANNELLO_DATI_VUOTI) con sole colonne scrivibili, che da'' config.fn_pannello_colonne_scrivibili (sede unica della regola, letta anche dal metadata del backend); una chiave estranea, trovata da script.fn_prima_chiave_estranea, si RIFIUTA (E_PANNELLO_CAMPO_NON_AMMESSO con campo). Passo 2-bis: una stringa vuota o di soli spazi destinata a una colonna di testo nullable diventa null prima della scrittura (l''assenza ha una forma sola); le colonne NOT NULL la ricevono com''e''. Passo 3: valori convertiti da jsonb_populate_record sul tipo di riga e scritti da script.fn_scrivi_riga_da_jsonb, solo le colonne del payload; UPDATE su id assente -> E_PANNELLO_RIGA_NON_TROVATA. Ritorna la riga con id e le colonne scrivibili, cioe'' i campi del form. I trigger della tabella scattano come sempre. Nessun DELETE. SECURITY DEFINER del proprietario con search_path bloccato; il nome della tabella si compone dalla lista con format(%I.%I).';

              REVOKE EXECUTE ON FUNCTION config.fn_pannello_scrivi(config.tabelle_gestibili.codice_interno%TYPE, bigint, jsonb) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION config.fn_pannello_scrivi(config.tabelle_gestibili.codice_interno%TYPE, bigint, jsonb) TO zeroerp_app;
      rollback:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
