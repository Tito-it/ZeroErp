# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2c (G-5): il BB
#   config.fn_sorgente_tabella, dove vive il documento di una sorgente.
#   Brief: brief-db-grammatica-unica-documenti §10.4.
#
#   Dal 20261020-33 la famiglia non porta piu' schema_tabella/nome_tabella: la tabella
#   e' la target_table della sua sorgente. Sei lettori la risolvevano dalle due colonne;
#   la risoluzione da sorgente a (schema, nome, oid) sta qui una volta sola (regola del 2).
#   Per codice di sorgente e non per famiglia: il guard dei riferimenti la chiama in
#   BEFORE INSERT, quando la riga nuova non e' ancora nella tabella.
#   Nessun BB DB esistente lo faceva (il backend ha SorgentiRepository.get_sorgente_attiva,
#   che porta il regclass com'e').
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261020-34-create-fn-sorgente-tabella-mctit.yaml

  - changeSet:
      id: 20261020-34-create-fn-sorgente-tabella
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_sorgente_tabella(codice): schema, nome e oid della target_table di una sorgente,
        dal catalogo di PostgreSQL. BB del sotto-giro 2c (G-5). Brief:
        brief-db-grammatica-unica-documenti §10.4.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION config.fn_sorgente_tabella(
                  p_codice_interno config.sorgenti.codice_interno%TYPE)
              RETURNS TABLE(
                  -- ancorati alle colonne di catalogo di cui sono il riflesso (tipo name e oid)
                  schema_tabella pg_catalog.pg_namespace.nspname%TYPE,
                  nome_tabella   pg_catalog.pg_class.relname%TYPE,
                  relid          pg_catalog.pg_class.oid%TYPE)
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              SET search_path TO 'pg_catalog', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: dove vive il documento di una sorgente: schema, nome
              --   e oid della sua target_table, letti dal catalogo di
              --   PostgreSQL (pg_class, pg_namespace).
              -- Parametri: p_codice_interno, il codice della sorgente.
              -- Ritorna: una riga, oppure NESSUNA se la sorgente non c'e' o
              --   non dichiara una tabella (target_table e' nullable). Il
              --   chiamante decide che cosa vuol dire.
              -- ⭐ Perche' esiste (regola del 2): dal 2026-10-21 la famiglia
              --   di numerazione e' una sorgente (G-5) e non porta piu'
              --   schema_tabella/nome_tabella. Guard, check, la storia
              --   dell'emittente del BA e la lista delle famiglie
              --   compongono SQL dinamico su quella tabella: la risoluzione
              --   sta qui, una volta.
              -- ⛔ Mai target_table::text: un regclass si stampa SENZA
              --   schema quando lo schema e' nel search_path di chi legge, e
              --   un format('%I') su quel testo nomina la tabella sbagliata
              --   o nessuna. Schema e nome si leggono da pg_class.
              -- Brief: brief-db-grammatica-unica-documenti §10.4 (2c, G-5).
              -- =========================================================
              SELECT n.nspname, c.relname, c.oid
                FROM config.sorgenti s
                JOIN pg_catalog.pg_class c     ON c.oid = s.target_table
                JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
               WHERE s.codice_interno = p_codice_interno;
              $function$;

              COMMENT ON FUNCTION config.fn_sorgente_tabella(config.sorgenti.codice_interno%TYPE) IS
                'Dove vive il documento di una sorgente: schema, nome e oid della sua target_table, letti da pg_class/pg_namespace (mai target_table::text, che dipende dal search_path di chi legge). Nessuna riga se la sorgente non c''e'' o non dichiara una tabella. BB della regola del 2 (2026-10-21): la famiglia di numerazione e'' una sorgente (G-5) e non porta piu'' schema_tabella/nome_tabella; la leggono il guard dei riferimenti e la check di spegnimento delle famiglie, la storia dell''emittente del BA e la lista delle famiglie. INVOKER, STABLE. Brief: brief-db-grammatica-unica-documenti §10.4.';

              REVOKE EXECUTE ON FUNCTION config.fn_sorgente_tabella(config.sorgenti.codice_interno%TYPE) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION config.fn_sorgente_tabella(config.sorgenti.codice_interno%TYPE) TO zeroerp_app;

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION config.fn_sorgente_tabella(config.sorgenti.codice_interno%TYPE);
