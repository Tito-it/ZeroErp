# ------------------------------------------------------------
# config.vw_email_template_seed: il segno «nata dal seed» sulle righe dei template delle mail, e i
#   campi che su quelle righe l'installazione non modifica. Il backend la legge
#   accanto alla tabella (LEFT JOIN su email_template_id = id) per la lista e
#   per il dettaglio.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§16.14)
#
# Tutto dalle funzioni che legge il guard script.trgfn_seed_primo_impianto:
#   nata_dal_seed da dbops.fn_seed_riga, campi_del_software dal montaggio del
#   trigger (dbops.fn_seed_colonne_del_software). Il campo spento e il rifiuto
#   vengono dalla stessa sorgente: nessun elenco di colonne nel backend.
# Nessuna colonna per «elimina»: la tabella non si cancella (decisione di Tid,
#   2026-11-19: solo disattivazione; dbops.automation_delete_block).
# Oggi la tabella e' per colonna: su una riga di seed campi_del_software
#   porta le colonne con cui config.fn_resolve_email_template cerca il
#   template e le variabili disponibili.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261117-27-create-vw-email-template-seed-mctit.yaml
  - changeSet:
      id: 20261117-27-create-vw-email-template-seed
      author: mctit
      runOnChange: false
      failOnError: true
      comment: |
        config.vw_email_template_seed: il segno del seed di primo impianto (nata_dal_seed, campi_del_software). Brief: brief-db-seed-primo-impianto-non-si-riscrive (§16.14).
      preConditions:
        - onFail: HALT
        - not:
            - viewExists:
                schemaName: config
                viewName: vw_email_template_seed
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW config.vw_email_template_seed
              WITH (security_invoker = true) AS
              SELECT et.id                         AS email_template_id,
                     seed.nata_dal_seed,
                     CASE WHEN seed.nata_dal_seed THEN sw.colonne
                          ELSE ARRAY[]::text[]
                     END                           AS campi_del_software
                FROM config.email_template et
                -- Le colonne del software valgono per la tabella: si leggono una volta.
                CROSS JOIN (
                    SELECT dbops.fn_seed_colonne_del_software('config.email_template'::regclass) AS colonne
                ) sw
                CROSS JOIN LATERAL (
                    SELECT EXISTS (SELECT 1 FROM dbops.fn_seed_riga('config.email_template'::regclass, et.id::text))
                           AS nata_dal_seed
                ) seed;

              COMMENT ON VIEW config.vw_email_template_seed IS 'Il segno del seed di primo impianto sulle righe dei template delle mail (config.email_template): una riga per riga (email_template_id). nata_dal_seed: la riga l''ha installata il software (dbops.fn_seed_riga), non l''azienda. campi_del_software: su una riga nata dal seed le colonne che l''installazione non modifica, dal montaggio del trigger (dbops.fn_seed_colonne_del_software), le stesse su cui il guard script.trgfn_seed_primo_impianto alza E_SEED_COLONNA_DEL_SOFTWARE; vuoto, mai NULL, su una riga dell''installazione o quando la forma della tabella non ne ha. Non elenca le colonne che altri meccanismi tengono ferme (script.trgfn_lock_columns). Nessuna azione di eliminazione: la riga non si cancella (dbops.automation_delete_block), si spegne con attivo. security_invoker. Si filtra per email_template_id.';
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              DROP VIEW IF EXISTS config.vw_email_template_seed;
