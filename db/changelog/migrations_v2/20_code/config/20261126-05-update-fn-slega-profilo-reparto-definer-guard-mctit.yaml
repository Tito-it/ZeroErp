# ------------------------------------------------------------
# IL LEGAME TOLTO DA UN REPARTO DIVENTA UN VERBO DEFINER COL SUO PERMESSO
#   config.fn_slega_profilo_reparto
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   1. SECURITY DEFINER, search_path pg_catalog, public, pg_temp: con la tabella
#      dei legami in sola lettura per l'app (90_end/20261126-24) scrive il
#      proprietario.
#   2. Il permesso in prima riga: script.fn_guard_super_admin sull'utente di
#      sessione, lo stesso controllo dell'endpoint (nessun endpoint la chiama oggi: e' il gesto inverso del legame di reparto).
#   3. Nessuna primitiva: nessuna funzione del database la chiama, e ha la forma del suo gemello.
#   Corpo dal catalogo di dbdev, firma ancorata come nella revisione
#   precedente. L'EXECUTE all'app resta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261126-05-update-fn-slega-profilo-reparto-definer-guard-mctit.yaml

  - changeSet:
      id: 20261126-05-update-fn-slega-profilo-reparto-definer-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_slega_profilo_reparto: SECURITY DEFINER col guard del SUPER_ADMIN. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_slega_profilo_reparto(
                  p_profilo_accesso_id     config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  p_unita_organizzativa_id config.profili_accesso_bindings.unita_organizzativa_id%TYPE)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente config.user_emittenti_fiscali.auth_user_id%TYPE;
                  v_tolti integer;  -- un conteggio: nessuna colonna di cui sia il riflesso
              BEGIN
                  -- Il permesso, prima di ogni altra cosa.
                  v_utente := script.fn_utente_di_sessione('config.fn_slega_profilo_reparto');
                  PERFORM script.fn_guard_super_admin(v_utente);

                  -- =========================================================
                  -- Scopo:
                  --   Togliere il binding di un reparto da quel profilo di
                  --   accesso. Ritorna quanti binding ha tolto.
                  --
                  -- Regole:
                  --   - solo il binding verso QUEL profilo;
                  --   - nessun binding: ritorna 0, non e' un errore;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_unita_organizzativa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_slega_profilo_reparto', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',     p_profilo_accesso_id,
                                             'unita_organizzativa_id', p_unita_organizzativa_id),
                          NULL::uuid,
                          'config.fn_slega_profilo_reparto',
                          'profilo o reparto mancanti');
                  END IF;

                  DELETE FROM config.profili_accesso_bindings pab
                   WHERE pab.unita_organizzativa_id = p_unita_organizzativa_id
                     AND pab.profilo_accesso_id     = p_profilo_accesso_id;

                  GET DIAGNOSTICS v_tolti = ROW_COUNT;
                  RETURN v_tolti;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_slega_profilo_reparto(p_profilo_accesso_id integer, p_unita_organizzativa_id integer)
              IS 'Il verbo con cui il SUPER_ADMIN toglie il legame di un reparto (unità organizzativa) da quel profilo di accesso; ritorna quanti legami ha tolto, 0 se non ce n''era. SECURITY DEFINER: in prima riga chiede il SUPER_ADMIN all''utente di sessione (script.fn_guard_super_admin: E_PERMESSO_NEGATO, anche senza utente). Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Il contrario di config.fn_lega_profilo_reparto. config.profili_accesso_bindings è in sola lettura per l''applicazione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_slega_profilo_reparto(p_profilo_accesso_id integer, p_unita_organizzativa_id integer)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_tolti integer;  -- un conteggio: nessuna colonna di cui sia il riflesso
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Togliere il binding di un reparto da quel profilo di
                  --   accesso. Ritorna quanti binding ha tolto.
                  --
                  -- Regole:
                  --   - solo il binding verso QUEL profilo;
                  --   - nessun binding: ritorna 0, non e' un errore;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_unita_organizzativa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_slega_profilo_reparto', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',     p_profilo_accesso_id,
                                             'unita_organizzativa_id', p_unita_organizzativa_id),
                          NULL::uuid,
                          'config.fn_slega_profilo_reparto',
                          'profilo o reparto mancanti');
                  END IF;

                  DELETE FROM config.profili_accesso_bindings pab
                   WHERE pab.unita_organizzativa_id = p_unita_organizzativa_id
                     AND pab.profilo_accesso_id     = p_profilo_accesso_id;

                  GET DIAGNOSTICS v_tolti = ROW_COUNT;
                  RETURN v_tolti;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_slega_profilo_reparto(p_profilo_accesso_id integer, p_unita_organizzativa_id integer)
              IS 'MADRE (2026-10-19): toglie il binding di un reparto (unita'' organizzativa) da QUEL profilo di accesso; ritorna quanti binding ha tolto, 0 se non ce n''era (idempotente). Il contrario di config.fn_lega_profilo_reparto, gemella di config.fn_slega_profilo_identita. Nasce con la madre che lega, prima che qualcuno ne abbia bisogno: senza, il primo scrittore farebbe un DELETE suo. Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Non controlla il permesso (backend). INVOKER. R-BE-7, D-16c di Tid, brief-db-processi-accensione-per-ambiente §6.16.';
