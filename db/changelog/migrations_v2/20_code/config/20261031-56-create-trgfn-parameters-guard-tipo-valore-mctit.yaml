# IL DEFAULT DI UN PARAMETRO HA LA FORMA DEL SUO TIPO
#   config.trgfn_parameters_guard_tipo_valore
#   Brief: brief-db-liste-datatable-grezze-secondo-giro §4.6.1 (D-5, Tid 2026-10-31)
#
# ── LE DUE REGOLE ────────────────────────────────────────────────
#   1. default_value deve avere la forma di tipo_valore
#      (script.fn_valore_parametro_non_conforme), altrimenti
#      E_PARAMETER_VALORE_NON_CONFORME. Vale all'INSERT e quando cambia il
#      default o il tipo.
#   2. Quando cambia il tipo, anche gli override esistenti devono averne la
#      forma: uno che non ce l'ha ferma il cambio con
#      E_PARAMETER_OVERRIDE_NON_CONFORME_AL_TIPO (CONFLITTO_STATO: il tipo
#      nuovo puo' essere giusto, e' l'override esistente a non ammetterlo).
#      ⭐ Qualunque override, anche spento: una riga spenta si riaccende con
#      un UPDATE di attivo, che il guard degli override non vede. Lo stesso
#      criterio di config.trgfn_parameters_guard_ammette_override.
#
# ── LA FASE: a07, PRIMA DEL DISPATCHER FK-SURROGATA (a10) ────────
#   Prima la forma, poi l'esistenza nel catalogo. Per i parametri del registro
#   FK-surrogata il tipo e' TESTO, e qui non parlano in due; la fase fissa
#   comunque l'ordine (linee-guida-trigger §«La fase»).
#
# ── IL TRIGGER ───────────────────────────────────────────────────
#   BEFORE INSERT OR UPDATE OF default_value, tipo_valore. Il corpo confronta
#   OLD e NEW (UPDATE OF scatta anche a valore uguale). Gli override si
#   leggono dalla loro tabella, mai la riga che cambia. Nessuna RLS sulle due
#   tabelle (relrowsecurity = false): il guard le vede tutte.
#
# ⚠️ Su un database ricostruito da zero il guard c'e' gia' quando 80_data
#   carica i parametri: ogni valore dei due CSV deve avere la forma del tipo
#   dichiarato sulla stessa riga. Il seed 80_data/20260224-38 (INSERT senza
#   la colonna) prende il DEFAULT 'TESTO' di 20261031-53, che ammette tutto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261031-56-create-trgfn-parameters-guard-tipo-valore-mctit.yaml

  - changeSet:
      id: 20261031-56-create-trgfn-parameters-guard-tipo-valore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard config.trgfn_parameters_guard_tipo_valore su config.parameters (a07, BEFORE INSERT
        OR UPDATE OF default_value, tipo_valore): il default deve avere la forma del tipo
        (E_PARAMETER_VALORE_NON_CONFORME); cambiando il tipo, anche ogni override esistente, anche
        spento (E_PARAMETER_OVERRIDE_NON_CONFORME_AL_TIPO). Brief:
        brief-db-liste-datatable-grezze-secondo-giro §4.6.1 (D-5).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_valore_parametro_non_conforme'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_parameters_guard_tipo_valore()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: il default di un parametro ha la forma del suo tipo;
              --   cambiando il tipo, anche ogni override esistente (anche spento).
              -- La forma la dice script.fn_valore_parametro_non_conforme.
              -- Brief: brief-db-liste-datatable-grezze-secondo-giro §4.6.1.
              -- =========================================================
              DECLARE
                  -- La forma attesa in parole (NULL = conforme): nessuna colonna.
                  v_forma        text;
                  v_override_id  config.parameter_overrides.id%TYPE;
                  v_override_val config.parameter_overrides.overridden_value%TYPE;
              BEGIN
                  -- UPDATE OF scatta anche a valore uguale: conta il cambio.
                  IF TG_OP = 'UPDATE'
                     AND NEW.default_value IS NOT DISTINCT FROM OLD.default_value
                     AND NEW.tipo_valore   IS NOT DISTINCT FROM OLD.tipo_valore THEN
                      RETURN NEW;
                  END IF;

                  -- 1. Il default.
                  v_forma := script.fn_valore_parametro_non_conforme(NEW.tipo_valore, NEW.default_value);
                  IF v_forma IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'config.trgfn_parameters_guard_tipo_valore',
                          'E_PARAMETER_VALORE_NON_CONFORME',
                          jsonb_build_object(
                              'field',        'default_value',
                              'parameter_id', NEW.id,
                              'code',         NEW.code,
                              'tipo_valore',  NEW.tipo_valore,
                              'valore',       NEW.default_value),
                          NEW.tx_id,
                          NEW.default_value::text, NEW.code::text, v_forma);
                  END IF;

                  -- 2. Gli override, solo se il tipo cambia (all'INSERT non ce ne sono).
                  IF TG_OP = 'UPDATE' AND NEW.tipo_valore IS DISTINCT FROM OLD.tipo_valore THEN
                      SELECT o.id, o.overridden_value
                        INTO v_override_id, v_override_val
                        FROM config.parameter_overrides o
                       WHERE o.parameter_id = NEW.id
                         AND script.fn_valore_parametro_non_conforme(NEW.tipo_valore, o.overridden_value) IS NOT NULL
                       ORDER BY o.id
                       LIMIT 1;

                      IF FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              'config.trgfn_parameters_guard_tipo_valore',
                              'E_PARAMETER_OVERRIDE_NON_CONFORME_AL_TIPO',
                              jsonb_build_object(
                                  'field',        'tipo_valore',
                                  'parameter_id', NEW.id,
                                  'code',         NEW.code,
                                  'tipo_valore',  NEW.tipo_valore,
                                  'override_id',  v_override_id,
                                  'valore',       v_override_val),
                              NEW.tx_id,
                              NEW.code::text, v_override_val::text,
                              script.fn_valore_parametro_non_conforme(NEW.tipo_valore, v_override_val));
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_parameters_guard_tipo_valore() IS
                  'Guard di config.parameters (a07, BEFORE INSERT OR UPDATE OF default_value, tipo_valore): default_value deve avere la forma di tipo_valore (script.fn_valore_parametro_non_conforme), altrimenti E_PARAMETER_VALORE_NON_CONFORME. Quando cambia il tipo, anche ogni override esistente del parametro, acceso o spento, deve averne la forma, altrimenti E_PARAMETER_OVERRIDE_NON_CONFORME_AL_TIPO (CONFLITTO_STATO). Parla prima del dispatcher FK-surrogata (a10): prima la forma, poi l''esistenza nel catalogo. Gemello: config.trgfn_parameter_overrides_guard_tipo_valore. Brief: brief-db-liste-datatable-grezze-secondo-giro (D-5).';

              DROP TRIGGER IF EXISTS trg_parameters_a07_guard_tipo_valore_ins_upd
                  ON config.parameters;
              CREATE TRIGGER trg_parameters_a07_guard_tipo_valore_ins_upd
                  BEFORE INSERT OR UPDATE OF default_value, tipo_valore ON config.parameters
                  FOR EACH ROW EXECUTE FUNCTION config.trgfn_parameters_guard_tipo_valore();
      rollback:
        - sql:
            sql: >
              DROP TRIGGER IF EXISTS trg_parameters_a07_guard_tipo_valore_ins_upd ON config.parameters;
              DROP FUNCTION IF EXISTS config.trgfn_parameters_guard_tipo_valore();
