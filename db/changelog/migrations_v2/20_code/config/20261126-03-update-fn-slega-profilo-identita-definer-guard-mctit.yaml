# ------------------------------------------------------------
# IL LEGAME TOLTO DA UN'IDENTITA' DIVENTA UN VERBO DEFINER COL SUO PERMESSO
#   config.fn_slega_profilo_identita
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   1. SECURITY DEFINER, search_path pg_catalog, public, pg_temp: con la tabella
#      dei legami in sola lettura per l'app (90_end/20261126-24) scrive il
#      proprietario.
#   2. Il permesso in prima riga: script.fn_guard_super_admin sull'utente di
#      sessione, lo stesso controllo dell'endpoint (OperatoriDetailView.patch, AmmSoftwareRepository._set_super_admin_binding).
#   3. Nessuna primitiva: nessuna funzione del database la chiama.
#   Corpo dal catalogo di dbdev, firma ancorata come nella revisione
#   precedente. L'EXECUTE all'app resta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261126-03-update-fn-slega-profilo-identita-definer-guard-mctit.yaml

  - changeSet:
      id: 20261126-03-update-fn-slega-profilo-identita-definer-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_slega_profilo_identita: SECURITY DEFINER col guard del SUPER_ADMIN. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_slega_profilo_identita(
                  p_profilo_accesso_id   config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  p_identita_digitale_id config.profili_accesso_bindings.identita_digitale_id%TYPE)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente config.user_emittenti_fiscali.auth_user_id%TYPE;
                  v_tolti integer;  -- un conteggio: nessuna colonna di cui sia il riflesso
              BEGIN
                  -- Il permesso, prima di ogni altra cosa.
                  v_utente := script.fn_utente_di_sessione('config.fn_slega_profilo_identita');
                  PERFORM script.fn_guard_super_admin(v_utente);

                  -- =========================================================
                  -- Scopo:
                  --   Togliere il binding di un'identita' digitale da quel
                  --   profilo di accesso. Ritorna quanti binding ha tolto.
                  --
                  -- Regole:
                  --   - solo il binding verso QUEL profilo;
                  --   - nessun binding: ritorna 0, non e' un errore;
                  --   - l'ultimo super admin lo protegge il trigger della
                  --     tabella;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_identita_digitale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_slega_profilo_identita', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',   p_profilo_accesso_id,
                                             'identita_digitale_id', p_identita_digitale_id),
                          NULL::uuid,
                          'config.fn_slega_profilo_identita',
                          'profilo o identita'' mancanti');
                  END IF;

                  DELETE FROM config.profili_accesso_bindings pab
                   WHERE pab.identita_digitale_id = p_identita_digitale_id
                     AND pab.profilo_accesso_id   = p_profilo_accesso_id;

                  GET DIAGNOSTICS v_tolti = ROW_COUNT;
                  RETURN v_tolti;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_slega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
              IS 'Il verbo con cui il SUPER_ADMIN toglie il legame di un''identità digitale da quel profilo di accesso (un altro profilo della stessa identità resta); ritorna quanti legami ha tolto, 0 se non ce n''era. SECURITY DEFINER: in prima riga chiede il SUPER_ADMIN all''utente di sessione (script.fn_guard_super_admin: E_PERMESSO_NEGATO, anche senza utente), lo stesso controllo dell''endpoint. Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. L''ultimo SUPER_ADMIN attivo lo protegge il trigger della tabella (E_PROFILO_ULTIMO_SUPER_ADMIN). Il contrario di config.fn_lega_profilo_identita. config.profili_accesso_bindings è in sola lettura per l''applicazione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_slega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_tolti integer;  -- un conteggio: nessuna colonna di cui sia il riflesso
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Togliere il binding di un'identita' digitale da quel
                  --   profilo di accesso. Ritorna quanti binding ha tolto.
                  --
                  -- Regole:
                  --   - solo il binding verso QUEL profilo;
                  --   - nessun binding: ritorna 0, non e' un errore;
                  --   - l'ultimo super admin lo protegge il trigger della
                  --     tabella;
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA.
                  -- =========================================================
                  IF p_profilo_accesso_id IS NULL OR p_identita_digitale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_slega_profilo_identita', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('profilo_accesso_id',   p_profilo_accesso_id,
                                             'identita_digitale_id', p_identita_digitale_id),
                          NULL::uuid,
                          'config.fn_slega_profilo_identita',
                          'profilo o identita'' mancanti');
                  END IF;

                  DELETE FROM config.profili_accesso_bindings pab
                   WHERE pab.identita_digitale_id = p_identita_digitale_id
                     AND pab.profilo_accesso_id   = p_profilo_accesso_id;

                  GET DIAGNOSTICS v_tolti = ROW_COUNT;
                  RETURN v_tolti;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_slega_profilo_identita(p_profilo_accesso_id integer, p_identita_digitale_id bigint)
              IS 'MADRE (2026-10-19): toglie il binding di un''identita'' digitale da QUEL profilo di accesso (un''identita'' che ha un altro profilo non perde l''altro); ritorna quanti binding ha tolto, 0 se non ce n''era (idempotente). Il contrario di config.fn_lega_profilo_identita. L''ultimo super admin attivo lo protegge il trigger della tabella (trgfn_profili_accesso_bindings_guard_ultimo_super_admin, anche sul DELETE), per ogni scrittore. Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Non controlla il permesso (backend). INVOKER. Sede unica del DELETE di AmmSoftwareRepository._set_super_admin_binding (ramo enabled = false). R-BE-7, D-16c di Tid, brief-db-processi-accensione-per-ambiente §6.16.';
