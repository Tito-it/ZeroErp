# L'ESITO DI SISTEMA PORTA ANCHE L'ACCOUNT DA CUI LA MAIL E' PARTITA
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive §16.16 (richiesta del
#   BE, decisione di Tid del 2026-11-20).
#
# ── IL PROBLEMA ────────────────────────────────────────────────────
#   Un account che ha spedito si spegne e non si cancella (§16.14, Q24).
#   `send_pending_emails` ripesca le mail in `RETRY` e i `FAILED` ancora
#   ripescabili con l'account scritto sul log, e quell'account puo' essere
#   spento. La regola e' quella di R1-BE-ter: il log dice da dove la mail e'
#   partita. Il rilancio risolve di nuovo l'account e il log lo segue.
#   Sulle righe non di sistema il backend lo scrive con l'`UPDATE` diretto
#   (grant di colonna, policy che non guarda `email_account_id`, nessun
#   trigger sulla colonna: verificato sul catalogo il 2026-11-20). Sulle
#   righe `SISTEMA` l'esito passa da qui, e qui l'account non si poteva
#   scrivere.
#
# ── CHE COSA CAMBIA ────────────────────────────────────────────────
#   Un parametro in coda, `p_email_account_id`, DEFAULT NULL: NULL lascia la
#   colonna com'e' (linee-guida-sql §5f, il default riproduce il prima). Le
#   chiamate di oggi (backend a quattro argomenti posizionali, pgTAP a due o
#   quattro) non cambiano.
#   ⛔ Nessun controllo che l'account sia acceso: la mail e' storia, e
#     l'account puo' spegnersi fra l'invio e la scrittura dell'esito. La FK
#     del log verso l'account e' eccezione ATTIVO dal giro 2 per questo; la
#     scelta di un account acceso e' di `config.fn_resolve_email_account`, e
#     ripeterla qui sarebbe una seconda sede. Un id inesistente lo ferma la FK,
#     come in `config.fn_accoda_email_sistema`, che l'account lo riceve allo
#     stesso modo.
#
# ── LA FORMA ───────────────────────────────────────────────────────
#   Cambia la firma: DROP della firma vecchia + CREATE (§5f), con gli
#   attributi vivi ripetuti (SECURITY DEFINER, VOLATILE, search_path) e
#   l'`EXECUTE` all'applicazione ridato (proacl identico al vivo: PUBLIC,
#   owner, zeroerp_app). Testata ri-ancorata con `%TYPE` (§5g). Il COMMENT e'
#   riscritto al presente (§5d).
#   ⚠️ Corpo preso dalla doc auto-gen (`docs/it/dbzero/config/funzioni/`),
#   identico al vivo (md5 di `prosrc` confrontato il 2026-11-20); l'ultimo
#   changeSet sulla funzione e' `20260911-08`.
#
# Verifica: db/pgtap/config/test-fn-email-sistema.sql (test 11-15)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261118-01-update-fn-chiudi-email-sistema-account-di-invio-mctit.yaml

  - changeSet:
      id: 20261118-01-update-fn-chiudi-email-sistema-account-di-invio
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        config.fn_chiudi_email_sistema riceve in coda p_email_account_id (DEFAULT NULL, NULL lascia la colonna
        com'e'): il rilancio di una mail di sistema il cui account si e' spento scrive sul log l'account da cui
        la mail riparte, insieme all'esito. Brief: brief-db-seed-primo-impianto-non-si-riscrive §16.16.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
               JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'config'
                 AND p.proname = 'fn_chiudi_email_sistema'
                 AND p.pronargs = 4
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS config.fn_chiudi_email_sistema(config.email_log.id%TYPE, config.email_log.stato%TYPE, config.email_log.errore%TYPE, config.email_log.inviato_at%TYPE);

              CREATE FUNCTION config.fn_chiudi_email_sistema(
                  p_email_log_id     config.email_log.id%TYPE,
                  p_stato            config.email_log.stato%TYPE,
                  p_errore           config.email_log.errore%TYPE            DEFAULT NULL,
                  p_inviato_at       config.email_log.inviato_at%TYPE        DEFAULT NULL,
                  p_email_account_id config.email_log.email_account_id%TYPE  DEFAULT NULL)
               RETURNS boolean
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_ambito config.email_log.ambito%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere l'ESITO dell'invio di una email di SISTEMA, dal
                  --   percorso che non ha un utente in sessione.
                  --
                  -- ⛔ Tocca SOLO righe di ambito SISTEMA e SOLO i campi
                  --   dell'esito. Non e' una porta di servizio per aggiornare
                  --   una email qualunque. L'account da cui la mail e' partita
                  --   fa parte dell'esito: vedi sopra l'UPDATE.
                  --
                  -- ⭐ LE TRE GUARDIE HANNO TRE CODICI, e non e' pignoleria:
                  --   ognuna manda a guardare un posto diverso.
                  --     p_stato fuori dai valori ammessi -> il PARAMETRO;
                  --     la riga non esiste               -> l'ID passato;
                  --     la riga non e' di sistema        -> la PORTA scelta.
                  -- =========================================================

                  -- ⛔ `PENDING` non e' un esito: questa e' la funzione che
                  --   CHIUDE, non quella che rimette in coda. Ammetterlo
                  --   vorrebbe dire poter resuscitare una email gia' chiusa.
                  -- ⚠️ Qui `E_VALIDAZIONE` e' il codice GIUSTO, ed e' l'unica
                  --   delle tre guardie che lo resta: e' la validazione di un
                  --   parametro, la famiglia che quel codice copre da sempre.
                  --
                  -- ⭐ QUESTA LISTA E' LA SECONDA SEDE DEL VOCABOLARIO, e
                  --   l'invariante che la lega alla prima NON e' l'uguaglianza:
                  --       questa lista = valori di chk_email_log_stato \ {PENDING}
                  --   Chi aggiunge un valore al CHECK deve aggiungerlo anche
                  --   qui, o quel valore resta irraggiungibile per le righe di
                  --   ambito SISTEMA — che passano tutte da questa funzione,
                  --   perche' la RLS rifiuta l'UPDATE diretto.
                  --   Lo presidia db/pgtap/config/test-fn-email-sistema.sql, test 9.
                  --
                  -- ⭐ `SIMULATA` e' un esito ammesso, ed e' terminale: dice che
                  --   l'invio non e' stato tentato di proposito (ambiente senza
                  --   SMTP, mail mostrata invece che spedita). ⚠️ Il chiamante
                  --   passa `p_inviato_at => NULL`: una riga che dichiara il
                  --   non-invio non deve portare la data di una consegna, o la
                  --   bugia si sposta di una colonna invece di sparire.
                  IF p_stato IS NULL OR p_stato NOT IN ('SENT', 'FAILED', 'RETRY', 'SIMULATA') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'fn_chiudi_email_sistema', 'E_VALIDAZIONE',
                          jsonb_build_object('stato', p_stato,
                                             'email_log_id', p_email_log_id),
                          NULL::uuid,
                          'stato ammesso solo fra SENT, FAILED, RETRY e SIMULATA');
                  END IF;

                  -- ⚠️ Si legge PRIMA di scrivere, per poter distinguere i due
                  --   modi in cui la riga puo' non essere quella giusta. Un
                  --   UPDATE che non trova niente e' muto, e il chiamante
                  --   crederebbe di aver chiuso qualcosa.
                  SELECT l.ambito INTO v_ambito
                    FROM config.email_log l
                   WHERE l.id = p_email_log_id;

                  IF NOT FOUND THEN
                      -- ⭐ CODICE PROPRIO, di classe TECNICO. Non e'
                      --   E_VALIDAZIONE (DATO_ERRATO, «hai sbagliato i dati»):
                      --   questo id non arriva da una persona, e' quello che il
                      --   chiamante ha scritto un istante prima.
                      -- ⛔ E non e' NON_TROVATO, che porta un 404: qui non c'e'
                      --   nessuno che cerca una risorsa, c'e' del codice che
                      --   passa un valore inesistente.
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'fn_chiudi_email_sistema', 'E_EMAIL_LOG_INESISTENTE',
                          jsonb_build_object('email_log_id', p_email_log_id),
                          NULL::uuid,
                          p_email_log_id::text);
                  END IF;

                  -- ⛔ IL CASO PERICOLOSO, e per questo ha un codice suo:
                  --   qualcuno sta usando la porta di sistema per una email che
                  --   appartiene a un'azienda. Dirlo con lo stesso codice del
                  --   caso sopra avrebbe sprecato l'unico momento in cui si puo'
                  --   notare — «la riga non c'e'» e «la riga c'e' e non e' tua»
                  --   mandano a guardare due posti diversi.
                  -- ⭐ TECNICO, non DATO_ERRATO: i parametri sono a posto e la
                  --   riga esiste. Non c'e' nessun dato da correggere, c'e' un
                  --   chiamante che ha bussato alla porta sbagliata.
                  IF v_ambito <> 'SISTEMA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'fn_chiudi_email_sistema', 'E_EMAIL_LOG_NON_DI_SISTEMA',
                          jsonb_build_object('email_log_id', p_email_log_id,
                                             'ambito', v_ambito),
                          NULL::uuid,
                          p_email_log_id::text, v_ambito::text);
                  END IF;

                  -- ⚠️ `tentativi + 1` come faceva update_log_stato: instradare
                  --   dev'essere un cambio di indirizzo, non di comportamento.
                  -- ⭐ E il COALESCE su `inviato_at` e' cio' che rende `SIMULATA`
                  --   scrivibile senza toccare niente: passando NULL la colonna
                  --   resta com'era, cioe' vuota su una riga appena accodata.
                  -- ⭐ L'ACCOUNT SEGUE L'INVIO. Il log dice da dove la mail e'
                  --   partita: il rilancio che ha risolto di nuovo l'account
                  --   (quello scritto si e' spento) lo passa qui, insieme
                  --   all'esito. NULL lascia la colonna com'e', lo stesso
                  --   COALESCE di `inviato_at`.
                  -- ⛔ Nessun controllo che l'account sia acceso: l'account puo'
                  --   spegnersi fra l'invio e questa scrittura, e la scelta di
                  --   un account acceso e' di config.fn_resolve_email_account.
                  --   Un id inesistente lo ferma la FK fk_email_log_email_account.
                  UPDATE config.email_log l
                     SET stato            = p_stato,
                         errore           = p_errore,
                         inviato_at       = COALESCE(p_inviato_at, l.inviato_at),
                         email_account_id = COALESCE(p_email_account_id, l.email_account_id),
                         tentativi        = l.tentativi + 1
                   WHERE l.id     = p_email_log_id
                     AND l.ambito = 'SISTEMA';

                  RETURN true;
              END
              $function$;

              GRANT EXECUTE ON FUNCTION config.fn_chiudi_email_sistema(config.email_log.id%TYPE, config.email_log.stato%TYPE, config.email_log.errore%TYPE, config.email_log.inviato_at%TYPE, config.email_log.email_account_id%TYPE) TO zeroerp_app;

              COMMENT ON FUNCTION config.fn_chiudi_email_sistema(config.email_log.id%TYPE, config.email_log.stato%TYPE, config.email_log.errore%TYPE, config.email_log.inviato_at%TYPE, config.email_log.email_account_id%TYPE)
              IS 'Scrive l''ESITO dell''invio di una email di ambito SISTEMA, dal percorso che non ha un utente in sessione: stato (SENT / FAILED / RETRY / SIMULATA), errore, inviato_at, tentativi+1 e, se passato, l''account da cui l''invio e'' partito. È la metà che chiude config.fn_accoda_email_sistema: una mail di sistema parte subito, e dopo l''INSERT il backend ne scrive l''esito da qui, perché la policy rls_email_log_ambito rifiuta l''UPDATE diretto. ⛔ Non è una porta di servizio: tocca SOLO righe di ambito SISTEMA (sta nella WHERE, non in un controllo dimenticabile) e SOLO i campi dell''esito. ⭐ p_email_account_id è l''account da cui la mail è partita in questo tentativo: il log dice da dove è partita, quindi il rilancio che risolve di nuovo l''account, perché quello scritto si è spento, lo passa qui insieme all''esito. NULL lascia la colonna com''è, come p_inviato_at. L''account non deve essere acceso: può spegnersi fra l''invio e la scrittura dell''esito, e la scelta di un account acceso spetta a config.fn_resolve_email_account. Un id inesistente lo ferma la FK fk_email_log_email_account. 🔵 La whitelist di p_stato è la seconda sede del vocabolario di email_log.stato, e l''invariante non è l''uguaglianza: è chk_email_log_stato MENO PENDING, perché questa funzione chiude e non rimette in coda. Chi aggiunge un valore al CHECK lo aggiunge anche qui, o quel valore resta irraggiungibile per le righe SISTEMA, che passano tutte da questa porta. Lo presidia db/pgtap/config/test-fn-email-sistema.sql, test 9. ⭐ SIMULATA dice che l''invio non è stato tentato, di proposito (ambiente senza SMTP, mail mostrata invece che spedita), ed è terminale: il chiamante passa p_inviato_at NULL, perché una riga che dichiara il non-invio non deve portare la data di una consegna. Le tre guardie hanno tre codici, e ognuna manda a guardare un posto diverso. (1) p_stato fuori dai valori ammessi: E_VALIDAZIONE, la validazione di un parametro. (2) La riga non esiste: E_EMAIL_LOG_INESISTENTE, classe TECNICO: l''id non arriva da una persona ma dal chiamante che l''ha scritto un istante prima, e NON_TROVATO porterebbe un 404. (3) La riga esiste ma non è di sistema: E_EMAIL_LOG_NON_DI_SISTEMA, TECNICO: è un chiamante che usa la porta di sistema per l''email di un''azienda. tentativi+1 lo scrive la funzione, come lo scrive l''UPDATE diretto sulle altre righe: send_pending_emails ripesca i FAILED finché tentativi < max_tentativi.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Torna alla firma a quattro argomenti, col corpo e il COMMENT vivi che
              -- questo changeSet ha trovato (dalla doc auto-generata, identica al vivo).
              DROP FUNCTION IF EXISTS config.fn_chiudi_email_sistema(config.email_log.id%TYPE, config.email_log.stato%TYPE, config.email_log.errore%TYPE, config.email_log.inviato_at%TYPE, config.email_log.email_account_id%TYPE);

              CREATE FUNCTION config.fn_chiudi_email_sistema(p_email_log_id bigint, p_stato character varying, p_errore text DEFAULT NULL::text, p_inviato_at timestamp with time zone DEFAULT NULL::timestamp with time zone)
               RETURNS boolean
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_ambito config.email_log.ambito%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scrivere l'ESITO dell'invio di una email di SISTEMA, dal
                  --   percorso che non ha un utente in sessione.
                  --
                  -- ⛔ Tocca SOLO righe di ambito SISTEMA e SOLO i campi
                  --   dell'esito. Non e' una porta di servizio per aggiornare
                  --   una email qualunque.
                  --
                  -- ⭐ LE TRE GUARDIE HANNO TRE CODICI, e non e' pignoleria:
                  --   ognuna manda a guardare un posto diverso.
                  --     p_stato fuori dai valori ammessi -> il PARAMETRO;
                  --     la riga non esiste               -> l'ID passato;
                  --     la riga non e' di sistema        -> la PORTA scelta.
                  -- =========================================================

                  -- ⛔ `PENDING` non e' un esito: questa e' la funzione che
                  --   CHIUDE, non quella che rimette in coda. Ammetterlo
                  --   vorrebbe dire poter resuscitare una email gia' chiusa.
                  -- ⚠️ Qui `E_VALIDAZIONE` e' il codice GIUSTO, ed e' l'unica
                  --   delle tre guardie che lo resta: e' la validazione di un
                  --   parametro, la famiglia che quel codice copre da sempre.
                  --
                  -- ⭐ QUESTA LISTA E' LA SECONDA SEDE DEL VOCABOLARIO, rev
                  --   2026-09-11, e l'invariante che la lega alla prima NON e'
                  --   l'uguaglianza:
                  --       questa lista = valori di chk_email_log_stato \ {PENDING}
                  --   Chi aggiunge un valore al CHECK deve aggiungerlo anche
                  --   qui, o quel valore resta irraggiungibile per le righe di
                  --   ambito SISTEMA — che passano tutte da questa funzione,
                  --   perche' la RLS rifiuta l'UPDATE diretto.
                  -- ⚠️ E' esattamente il modo in cui `SIMULATA` sarebbe nato
                  --   monco: il brief del backend chiedeva «un valore nel CHECK,
                  --   nient'altro», e con quello solo il digest dei presidi in
                  --   sviluppo avrebbe sollevato invece di scrivere.
                  --   Lo presidia db/pgtap/config/test-fn-email-sistema.sql, test 9.
                  --
                  -- ⭐ `SIMULATA` e' un esito ammesso, ed e' terminale: dice che
                  --   l'invio non e' stato tentato di proposito (ambiente senza
                  --   SMTP, mail mostrata invece che spedita). ⚠️ Il chiamante
                  --   passa `p_inviato_at => NULL`: una riga che dichiara il
                  --   non-invio non deve portare la data di una consegna, o la
                  --   bugia si sposta di una colonna invece di sparire.
                  IF p_stato IS NULL OR p_stato NOT IN ('SENT', 'FAILED', 'RETRY', 'SIMULATA') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'fn_chiudi_email_sistema', 'E_VALIDAZIONE',
                          jsonb_build_object('stato', p_stato,
                                             'email_log_id', p_email_log_id),
                          NULL::uuid,
                          'stato ammesso solo fra SENT, FAILED, RETRY e SIMULATA');
                  END IF;

                  -- ⚠️ Si legge PRIMA di scrivere, per poter distinguere i due
                  --   modi in cui la riga puo' non essere quella giusta. Un
                  --   UPDATE che non trova niente e' muto, e il chiamante
                  --   crederebbe di aver chiuso qualcosa.
                  SELECT l.ambito INTO v_ambito
                    FROM config.email_log l
                   WHERE l.id = p_email_log_id;

                  IF NOT FOUND THEN
                      -- ⭐ CODICE PROPRIO, di classe TECNICO. Non e'
                      --   E_VALIDAZIONE (DATO_ERRATO, «hai sbagliato i dati»):
                      --   questo id non arriva da una persona, e' quello che il
                      --   chiamante ha scritto un istante prima.
                      -- ⛔ E non e' NON_TROVATO, che porta un 404: qui non c'e'
                      --   nessuno che cerca una risorsa, c'e' del codice che
                      --   passa un valore inesistente.
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'fn_chiudi_email_sistema', 'E_EMAIL_LOG_INESISTENTE',
                          jsonb_build_object('email_log_id', p_email_log_id),
                          NULL::uuid,
                          p_email_log_id::text);
                  END IF;

                  -- ⛔ IL CASO PERICOLOSO, e per questo ha un codice suo:
                  --   qualcuno sta usando la porta di sistema per una email che
                  --   appartiene a un'azienda. Dirlo con lo stesso codice del
                  --   caso sopra avrebbe sprecato l'unico momento in cui si puo'
                  --   notare — «la riga non c'e'» e «la riga c'e' e non e' tua»
                  --   mandano a guardare due posti diversi.
                  -- ⭐ TECNICO, non DATO_ERRATO: i parametri sono a posto e la
                  --   riga esiste. Non c'e' nessun dato da correggere, c'e' un
                  --   chiamante che ha bussato alla porta sbagliata.
                  -- ⚠️ Fino al 2026-09-07 era `E_VALIDAZIONE`: 20260906-14 lo
                  --   aveva dichiarato domanda aperta, e il classificatore non
                  --   sapeva ancora leggere questa forma di guardia.
                  IF v_ambito <> 'SISTEMA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'fn_chiudi_email_sistema', 'E_EMAIL_LOG_NON_DI_SISTEMA',
                          jsonb_build_object('email_log_id', p_email_log_id,
                                             'ambito', v_ambito),
                          NULL::uuid,
                          p_email_log_id::text, v_ambito::text);
                  END IF;

                  -- ⚠️ `tentativi + 1` come faceva update_log_stato: instradare
                  --   dev'essere un cambio di indirizzo, non di comportamento.
                  -- ⭐ E il COALESCE su `inviato_at` e' cio' che rende `SIMULATA`
                  --   scrivibile senza toccare niente: passando NULL la colonna
                  --   resta com'era, cioe' vuota su una riga appena accodata.
                  UPDATE config.email_log l
                     SET stato      = p_stato,
                         errore     = p_errore,
                         inviato_at = COALESCE(p_inviato_at, l.inviato_at),
                         tentativi  = l.tentativi + 1
                   WHERE l.id     = p_email_log_id
                     AND l.ambito = 'SISTEMA';

                  RETURN true;
              END
              $function$;

              GRANT EXECUTE ON FUNCTION config.fn_chiudi_email_sistema(bigint, character varying, text, timestamp with time zone) TO zeroerp_app;

              COMMENT ON FUNCTION config.fn_chiudi_email_sistema(p_email_log_id bigint, p_stato character varying, p_errore text, p_inviato_at timestamp with time zone)
              IS 'Scrive l''ESITO dell''invio (SENT / FAILED / RETRY / SIMULATA, errore, inviato_at, tentativi+1) su una riga di ambito SISTEMA, dal percorso che NON ha un utente in sessione. ⭐ E'' la meta'' mancante di config.fn_accoda_email_sistema: la decisione e'' che una mail di sistema parta SUBITO, quindi dopo l''INSERT il backend tenta l''invio e deve scriverne l''esito — e quell''UPDATE e'' bloccato dalla stessa policy, per lo stesso motivo. ⛔ Non e'' una porta di servizio: tocca SOLO righe di ambito SISTEMA (sta nella WHERE, non in un controllo dimenticabile) e SOLO i campi dell''esito. 🔵 LA WHITELIST DI p_stato E'' LA SECONDA SEDE DEL VOCABOLARIO DI email_log.stato, rev 2026-09-11, e l''invariante NON e'' l''uguaglianza col CHECK: e'' chk_email_log_stato MENO PENDING, perche'' questa funzione chiude e non rimette in coda. Chi aggiunge un valore al CHECK deve aggiungerlo anche qui, o quel valore resta irraggiungibile per le righe SISTEMA — che passano tutte da questa porta. Lo presidia db/pgtap/config/test-fn-email-sistema.sql test 9. ⭐ SIMULATA dice «l''invio non e'' stato tentato, di proposito» (ambiente senza SMTP, mail mostrata invece che spedita) ed e'' TERMINALE: il chiamante passa p_inviato_at => NULL, perche'' una riga che dichiara il non-invio non deve portare la data di una consegna. ⭐ LE TRE GUARDIE HANNO TRE CODICI, rev 2026-09-07, e ognuna manda a guardare un posto diverso. (1) p_stato fuori dai valori ammessi: E_VALIDAZIONE, ed e'' il codice giusto perche'' li'' c''e'' davvero un parametro fuori dai valori. (2) La riga non esiste: E_EMAIL_LOG_INESISTENTE, classe TECNICO — quell''id non arriva da una persona ma dal chiamante che l''ha scritto un istante prima, e NON_TROVATO porterebbe un 404 mandando a cercare una risorsa invece di un difetto di codice. (3) La riga esiste ma NON e'' di sistema: E_EMAIL_LOG_NON_DI_SISTEMA, anch''esso TECNICO — e'' qualcuno che usa la porta di sistema per l''email di un''azienda, ed e'' l''unico momento in cui lo si puo'' notare. ⚠️ tentativi+1 lo fa la funzione perche'' lo faceva update_log_stato: instradare dev''essere un cambio di indirizzo, non di comportamento — ed e'' anche cio'' che fa funzionare il recupero, perche'' send_pending_emails ripesca i FAILED finche'' tentativi < max_tentativi.';
