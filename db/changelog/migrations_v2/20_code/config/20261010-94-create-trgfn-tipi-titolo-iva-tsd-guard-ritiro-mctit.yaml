# UNA RIGA DI MATRICE NON SI RITIRA SOTTO I TITOLI CHE LA USANO
#   config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro()
#   trg_tipi_titolo_iva_tsd_a10_guard_ritiro_upd_dlt
#     AFTER UPDATE OR DELETE ON config.tipi_titolo_iva_tipi_soggetto_dettaglio
#   Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D, §3bis.3 punto 3, D-6)
#
# -- LA REGOLA --------------------------------------------------------
#   Il terzo lato della regola «titolo ammesso dalla natura»: i primi due
#   guardano il titolo (20261010-92) e il soggetto (20261010-93). Qui la
#   matrice: una riga che smette di ammettere (attivo true -> false, DELETE,
#   o la coppia cambiata) e' rifiutata finche' esistono titoli VIGENTI di
#   quel tipo su soggetti di quella natura -> E_TITOLO_IVA_AMMISSIONE_IN_USO.
#
# -- LA FORMA ---------------------------------------------------------
#   * AFTER e non BEFORE: il guard chiede «la coppia e' ANCORA ammessa?»
#     (anagrafiche.fn_titolo_iva_ammesso), e la risposta giusta la da' la
#     matrice gia' aggiornata. In BEFORE la riga vecchia ci sarebbe ancora.
#   * La lettura dei titoli e' anagrafiche.fn_titolo_iva_vigente_su_natura_esiste
#     (20261010-91), SECURITY DEFINER per la RLS per emittente.
#   * ⭐ Il mirror del CSV (20261010-89) riscrive ogni riga a ogni migrate con
#     gli stessi valori: true -> true non e' un ritiro, e il guard tace.
#     Un ritiro vero si fa con attivo = f nel CSV (D-6); se ci sono titoli
#     vigenti il migrate si ferma qui, ed e' voluto: prima si chiudono i
#     titoli, poi si ritira la riga.
#   * Nome del trigger accorciato (tsd): quello pieno passa i 63 caratteri.
#   * CONFLITTO_STATO: la riga si puo' ritirare, non adesso. Nessun campo:
#     la scrive un CSV o un amministratore, non un form.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261010-94-create-trgfn-tipi-titolo-iva-tsd-guard-ritiro-mctit.yaml

  - changeSet:
      id: 20261010-94-create-trgfn-tipi-titolo-iva-tsd-guard-ritiro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro e trigger
        trg_tipi_titolo_iva_tsd_a10_guard_ritiro_upd_dlt (AFTER UPDATE OR DELETE): una riga della
        matrice titoli x natura non smette di ammettere finche' esistono titoli vigenti che la usano.
        Codice E_TITOLO_IVA_AMMISSIONE_IN_USO. Brief: brief-db-dati-fiscali-e-societari-del-soggetto (D-6).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'anagrafiche'
                     AND p.proname = 'fn_titolo_iva_vigente_su_natura_esiste';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                    JOIN pg_catalog.pg_class r ON r.oid = t.tgrelid
                    JOIN pg_catalog.pg_namespace n ON n.oid = r.relnamespace
                   WHERE n.nspname = 'config' AND r.relname = 'tipi_titolo_iva_tipi_soggetto_dettaglio'
                     AND t.tgname = 'trg_tipi_titolo_iva_tsd_a10_guard_ritiro_upd_dlt';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: una riga che smette di ammettere un tipo di titolo per una
              --   natura e' rifiutata finche' esistono titoli VIGENTI che la usano.
              --   Smette di ammettere: era attiva e ora e' spenta, cancellata o
              --   spostata su un'altra coppia. Dopo il cambio la coppia vecchia
              --   non deve essere ammessa da nessun'altra riga (la PK ne lascia una
              --   sola, ma la domanda si fa alla sede unica, fn_titolo_iva_ammesso).
              -- Aggancio: AFTER UPDATE OR DELETE — la matrice e' gia' aggiornata.
              -- ⛔ I titoli si leggono da anagrafiche.fn_titolo_iva_vigente_su_natura_esiste,
              --   SECURITY DEFINER (RLS per emittente su soggetti_titoli_iva).
              -- Brief: brief-db-dati-fiscali-e-societari-del-soggetto (D-6).
              -- =========================================================
              DECLARE
                  v_titolo config.tipi_titolo_iva.descrizione%TYPE;
                  v_natura config.tipi_soggetto_dettaglio.descrizione%TYPE;
              BEGIN
                  -- Una riga gia' spenta non ammetteva niente.
                  IF NOT OLD.attivo THEN
                      RETURN NULL;
                  END IF;

                  -- Riscrittura della stessa coppia ancora attiva (il mirror del CSV).
                  IF TG_OP = 'UPDATE'
                     AND NEW.attivo
                     AND NEW.tipo_titolo_iva_id         = OLD.tipo_titolo_iva_id
                     AND NEW.tipo_soggetto_dettaglio_id = OLD.tipo_soggetto_dettaglio_id THEN
                      RETURN NULL;
                  END IF;

                  IF anagrafiche.fn_titolo_iva_ammesso(OLD.tipo_titolo_iva_id,
                                                      OLD.tipo_soggetto_dettaglio_id) THEN
                      RETURN NULL;
                  END IF;

                  IF NOT anagrafiche.fn_titolo_iva_vigente_su_natura_esiste(
                             OLD.tipo_titolo_iva_id, OLD.tipo_soggetto_dettaglio_id) THEN
                      RETURN NULL;
                  END IF;

                  SELECT tt.descrizione INTO v_titolo
                    FROM config.tipi_titolo_iva tt WHERE tt.id = OLD.tipo_titolo_iva_id;
                  SELECT COALESCE(tsd.descrizione, tsd.codice_interno) INTO v_natura
                    FROM config.tipi_soggetto_dettaglio tsd WHERE tsd.id = OLD.tipo_soggetto_dettaglio_id;

                  PERFORM script.fn_log_and_raise_error(
                      'database', 'config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro',
                      'E_TITOLO_IVA_AMMISSIONE_IN_USO',
                      jsonb_build_object('tipo_titolo_iva_id',         OLD.tipo_titolo_iva_id,
                                         'tipo_soggetto_dettaglio_id', OLD.tipo_soggetto_dettaglio_id,
                                         'operazione',                 TG_OP),
                      CASE WHEN TG_OP = 'UPDATE' THEN NEW.tx_id ELSE OLD.tx_id END,
                      COALESCE(v_titolo, OLD.tipo_titolo_iva_id::text),
                      COALESCE(v_natura, OLD.tipo_soggetto_dettaglio_id::text));

                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro() IS
                  'Guard AFTER UPDATE OR DELETE su config.tipi_titolo_iva_tipi_soggetto_dettaglio: una riga che smette di ammettere un tipo di titolo IVA per una natura (attivo true -> false, DELETE, coppia cambiata) e'' rifiutata con E_TITOLO_IVA_AMMISSIONE_IN_USO finche'' esistono titoli VIGENTI di quel tipo su soggetti di quella natura (anagrafiche.fn_titolo_iva_vigente_su_natura_esiste, SECURITY DEFINER). AFTER perche'' la domanda «la coppia e'' ancora ammessa?» (anagrafiche.fn_titolo_iva_ammesso) va fatta alla matrice gia'' aggiornata. La riscrittura della stessa riga attiva (il mirror del CSV) tace. Ritiro: attivo = f nel CSV, dopo aver chiuso i titoli (D-6). Brief: brief-db-dati-fiscali-e-societari-del-soggetto (Parte D).';

              CREATE TRIGGER trg_tipi_titolo_iva_tsd_a10_guard_ritiro_upd_dlt
                  AFTER UPDATE OR DELETE ON config.tipi_titolo_iva_tipi_soggetto_dettaglio
                  FOR EACH ROW
                  EXECUTE FUNCTION config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_tipi_titolo_iva_tsd_a10_guard_ritiro_upd_dlt ON config.tipi_titolo_iva_tipi_soggetto_dettaglio;
              DROP FUNCTION IF EXISTS config.trgfn_tipi_titolo_iva_tipi_soggetto_dettaglio_guard_ritiro();
