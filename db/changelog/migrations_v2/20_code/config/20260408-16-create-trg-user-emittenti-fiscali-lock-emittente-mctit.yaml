# Liquibase changelog per Zero ERP
# CREATE TRIGGER lock su config.user_emittenti_fiscali.emittente_fiscale_id
# Riusa script.trgfn_lock_columns (gia' esistente, vedi tipi_ruoli.codice_interno).
# Refactor operatore-emittente: D3 - cambio operatore VIETATO.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260408-16-create-trg-user-emittenti-fiscali-lock-emittente-mctit.yaml

  - changeSet:
      id: 20260408-16-create-trg-user-emittenti-fiscali-lock-emittente
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        Trigger BEFORE UPDATE OF emittente_fiscale_id su config.user_emittenti_fiscali
        che impedisce la modifica dell'emittente associato a un utente. Riusa
        script.trgfn_lock_columns con argomenti (colonna, codice_messaggio).
        Override manutenzione tramite SET LOCAL zeroerp.allow_lock_columns_override='on'.
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: user_emittenti_fiscali }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Idempotente: drop+create
              DROP TRIGGER IF EXISTS trg_user_emittenti_fiscali_a10_lock_emittente_upd
                ON config.user_emittenti_fiscali;

              CREATE TRIGGER trg_user_emittenti_fiscali_a10_lock_emittente_upd
              BEFORE UPDATE OF emittente_fiscale_id ON config.user_emittenti_fiscali
              FOR EACH ROW
              EXECUTE FUNCTION script.trgfn_lock_columns(
                  'emittente_fiscale_id', 'E_EMITTENTE_NON_MODIFICABILE'
              );
