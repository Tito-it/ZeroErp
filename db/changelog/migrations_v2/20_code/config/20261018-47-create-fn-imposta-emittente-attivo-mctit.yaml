# BB: IMPOSTARE L'EMITTENTE ATTIVO DI UN UTENTE
#   config.fn_imposta_emittente_attivo(utente, emittente): la preferenza
#   dell'utente in config.user_emittente_attivo, creata o aggiornata.
#   Brief: brief-db-processi-accensione-per-ambiente, §5-ter.2 (2b-1, lotto 9).
#
# -- CHI ERA LA COPIA ---------------------------------------------------
#   * il backend, EmittenteAttivoRepository.set_preferenza (UPSERT). Passa al
#     BB nella 2b-2;
#   * il verbo dei dati di sviluppo (2b-3: l'emittente attivo di dev.*) ne e'
#     la seconda occorrenza.
#
# -- LE SCELTE ----------------------------------------------------------
#   * UPSERT sull'unico utente (uq_user_emittente_attivo_auth_user). L'UPDATE
#     tocca la riga anche quando il valore non cambia, come nel backend: la
#     storicizzazione registra ogni conferma esplicita della scelta;
#   * emittente attivo: lo pretende il trigger require_attivo della tabella.
#
# -- CHE COSA RESTA FUORI, apposta ---------------------------------------
#   * ⚠️ lo SCOPE: che l'utente possa lavorare in quell'emittente lo
#     controlla oggi solo il backend (is_scelta_valida, sulla canonica
#     script.fn_check_user_emittente_scope), prima di chiamare. E' una regola
#     di dominio senza un guard sulla tabella, come la partita IVA
#     dell'emittente al lotto 1: debito dichiarato nel brief;
#   * il permesso: backend. INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20261018-47-create-fn-imposta-emittente-attivo-mctit.yaml

  - changeSet:
      id: 20261018-47-create-fn-imposta-emittente-attivo
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea config.fn_imposta_emittente_attivo: la preferenza dell'emittente attivo di un utente,
        creata o aggiornata. Prende il posto di set_preferenza del backend ed e' la sede del verbo
        di sviluppo. Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 9).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_imposta_emittente_attivo(
                  p_auth_user_id         config.user_emittente_attivo.auth_user_id%TYPE,
                  p_emittente_fiscale_id config.user_emittente_attivo.emittente_fiscale_id%TYPE)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_id config.user_emittente_attivo.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Impostare l'emittente attivo di un utente: crearne la
                  --   preferenza o aggiornarla. Ritorna l'id della riga.
                  --
                  -- Regole:
                  --   - argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - l'UPDATE tocca la riga anche a valore invariato
                  --     (la storia registra ogni conferma);
                  --   - emittente attivo: il trigger della tabella.
                  -- =========================================================
                  IF p_auth_user_id IS NULL OR p_emittente_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'config', 'config.fn_imposta_emittente_attivo', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('auth_user_id',         p_auth_user_id,
                                             'emittente_fiscale_id', p_emittente_fiscale_id),
                          NULL::uuid,
                          'config.fn_imposta_emittente_attivo',
                          'utente o emittente mancanti');
                  END IF;

                  INSERT INTO config.user_emittente_attivo AS uea (auth_user_id, emittente_fiscale_id)
                  VALUES (p_auth_user_id, p_emittente_fiscale_id)
                  ON CONFLICT (auth_user_id) DO UPDATE
                     SET emittente_fiscale_id = EXCLUDED.emittente_fiscale_id
                  RETURNING uea.id INTO v_id;

                  RETURN v_id;
              END;
              $function$;

              COMMENT ON FUNCTION config.fn_imposta_emittente_attivo(
                  config.user_emittente_attivo.auth_user_id%TYPE,
                  config.user_emittente_attivo.emittente_fiscale_id%TYPE) IS
                  'BB (2026-10-18): imposta l''emittente attivo di un utente (config.user_emittente_attivo): UPSERT sull''utente (uq_user_emittente_attivo_auth_user); l''UPDATE tocca la riga anche a valore invariato, cosi'' la storia registra ogni conferma esplicita della scelta (come il backend). Argomenti NULL: E_SCRIPT_CHIAMATA_NON_VALIDA. Emittente attivo: il trigger require_attivo della tabella. Non controlla lo SCOPE dell''utente sull''emittente (pre-check del backend sulla canonica script.fn_check_user_emittente_scope; regola senza guard sulla tabella, debito dichiarato) ne'' il permesso. INVOKER. Ritorna l''id. Prende il posto di EmittenteAttivoRepository.set_preferenza (2b-2) ed e'' la sede del verbo dei dati di sviluppo (2b-3). Brief: brief-db-processi-accensione-per-ambiente (2b-1, lotto 9).';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS config.fn_imposta_emittente_attivo(integer, bigint);
