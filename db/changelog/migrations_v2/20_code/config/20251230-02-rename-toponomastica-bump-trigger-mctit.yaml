# Liquibase changelog per Zero ERP
# Rinomina trigger toponomastica bump normalize
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/config/20251230-02-rename-toponomastica-bump-trigger-mctit.yaml

  - changeSet:
      id: 20251230-02-rename-toponomastica-bump-trigger
      author: mctit
      comment: >
        Rinomina trg_toponomastica_aft_bump_normalize_upd in trg_toponomastica_bump_normalize_aft_upd.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid = t.tgrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'config'
                    AND c.relname = 'toponomastica'
                    AND t.tgname = 'trg_toponomastica_aft_bump_normalize_upd'
                ) THEN
                  ALTER TRIGGER trg_toponomastica_aft_bump_normalize_upd
                    ON config.toponomastica
                    RENAME TO trg_toponomastica_bump_normalize_aft_upd;
                END IF;
              END;
              $$;
