databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/config/20260228-31-create-fn-get-emittenti-scope-mctit.yaml

  - changeSet:
      id: 20260228-31-create-fn-get-emittenti-scope
      author: mctit
      comment: "Restituisce array ID emittenti fiscali autorizzati per utente (NULL = nessuna restrizione)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION config.fn_get_emittenti_scope(
                p_auth_user_id integer
              )
              RETURNS bigint[]
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                v_ids bigint[];
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce gli ID emittenti fiscali autorizzati
                --   per un utente dalla whitelist user_emittenti_fiscali.
                --
                -- Semantica:
                --   NULL  = nessuna restrizione (whitelist vuota, vede tutto)
                --   array = limitato agli emittenti elencati
                -- =========================================================

                SELECT array_agg(uef.emittente_fiscale_id)
                  INTO v_ids
                  FROM config.user_emittenti_fiscali uef
                 WHERE uef.auth_user_id = p_auth_user_id;

                -- Nessuna riga → array_agg ritorna NULL → nessuna restrizione
                RETURN v_ids;
              END
              $$;

              COMMENT ON FUNCTION config.fn_get_emittenti_scope(integer)
                IS 'Restituisce ID emittenti autorizzati per utente (NULL = nessuna restrizione).';
