            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_contratti_da_pushare(
                  p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                  p_limit              integer DEFAULT NULL::integer,
                  p_contratto_id       vendite.contratti.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(
                  -- nudi (utility_id, fatturazione_immediata, termine_pagamento_id, modalita_pagamento_id): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  contratto_id                vendite.contratti.id%TYPE,
                  contratto_uid               vendite.contratti.uid%TYPE,
                  riga_id                     vendite.contratti_righe.id%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  utility_id                  integer,
                  emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  competenza_dal              vendite.commesse_attivita.competenza_dal%TYPE,
                  competenza_al               vendite.commesse_attivita.competenza_al%TYPE,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  sorgente_uid                vendite.commesse_attivita.sorgente_uid%TYPE,
                  segment_key                 vendite.commesse_attivita.segment_key%TYPE,
                  articolo_id                 vendite.commesse_attivita.articolo_id%TYPE,
                  istanza_utility_id          vendite.commesse_attivita.istanza_utility_id%TYPE,
                  data_attivita               vendite.commesse_attivita.data_attivita%TYPE,
                  uom_id                      vendite.commesse_attivita.uom_id%TYPE,
                  quantita                    vendite.commesse_attivita.quantita%TYPE,
                  qta_operativa               vendite.commesse_attivita.qta_operativa%TYPE,
                  uom_operativa_id            vendite.commesse_attivita.uom_operativa_id%TYPE,
                  factor_to_base              vendite.commesse_attivita.factor_to_base%TYPE,
                  competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                  prezzo_snapshot             vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  prezzo_bloccato             vendite.commesse_attivita.prezzo_bloccato%TYPE,
                  pricing_mode                vendite.commesse_attivita.pricing_mode%TYPE,
                  tipo_movimento              vendite.commesse_attivita.tipo_movimento%TYPE,
                  valuta_id                   vendite.commesse_attivita.valuta_id%TYPE,
                  meta                        vendite.commesse_attivita.meta%TYPE,
                  tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        bigint,
                  modalita_pagamento_id       integer)
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-20 (20261020-90, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave e' CONTRATTO:<uid>:R:<riga>:M:<AAAA-MM>, composta da
              --   script.fn_segment_key (era CONTR:...). Firma e RETURNS ancorati.
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_attivo_id     config.stati_doc_contratti.id%TYPE;
              BEGIN
                -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente/stato
                -- risolti per codice_interno (immutabile), non per codice (mutabile).
                -- rev 2026-07-27 (brief emissione mirata PARTE B): fatturazione_immediata
                -- proiettata dalla COLONNA (era la costante FALSE). Il valore instrada
                -- la corsia via chiave di dedup di fn_get_or_create_commessa.
                -- rev 2026-10-04 (brief-db-erogazione-obbligatoria-righe-fatturate R4):
                -- le righe ESCLUSIONE non si listano (l'esclusione non si fattura: prima
                -- arrivavano in commessa senza prezzo, e il resolver risponde
                -- E_ARTICOLO_ESCLUSO_DA_CONTRATTO).
                -- rev 2026-10-10 (brief-db-istanza-nasce-col-ba-residui D-1, D-2): via il
                -- filtro billing_account_id IS NOT NULL (la colonna e' NOT NULL); lo stato
                -- ATTIVO che non si trova nel catalogo solleva E_CODICE come la sorgente,
                -- invece di far cadere il filtro di stato (prima: `IS NULL OR`, cioe'
                -- contratti in qualunque stato).
                -- rev 2026-10-13 (20261013-19, decisione A di Tid): via la colonna
                -- tipo_consumo, dove finiva l'erogazione della riga — la madre la
                -- rifiutava (vocabolario ACCONTO/CONGUAGLIO/STORNO), e nessun contratto
                -- arrivava in commessa. L'erogazione viaggia in meta.tipo_erogazione.
                -- rev 2026-10-13 (20261013-24, D-1 e D-2 di Tid): si listano solo le righe
                -- UNA_TANTUM, e la loro competenza e' il giorno di attivazione (valido_dal),
                -- non la validita' del contratto. Un fatto che accade una volta ha un
                -- giorno, come ordini e DDT; con valido_al NULL (contratto senza scadenza)
                -- la competenza_al usciva NULL e la madre la rifiutava (NOT NULL).
                -- CANONE, ORARIO e CONSUMO non si mandano finche' non hanno la loro
                -- generazione (un canone per periodo, ore e consumi dalle loro fonti): qui
                -- partivano una volta sola, con la quantita' fissa del contratto e la
                -- competenza di tutto il contratto. Brief:
                -- brief-db-contratto-righe-periodiche-in-commessa.
                IF p_contratto_id IS NOT NULL AND p_contratto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_contratto_id', 'valore', p_contratto_id),
                    NULL::uuid,
                    'p_contratto_id', p_contratto_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'CONTRATTO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CONTRATTO'),
                    NULL::uuid, 'CONTRATTO', 'config.sorgenti'
                  );
                END IF;

                SELECT s.id INTO v_stato_attivo_id
                FROM config.stati_doc_contratti s
                WHERE s.codice_interno = 'ATTIVO' AND s.attivo IS TRUE LIMIT 1;

                -- Senza lo stato il filtro non ha un valore: si ferma, come per la
                -- sorgente. Il push non lista mai contratti in uno stato qualunque.
                IF v_stato_attivo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'ATTIVO'),
                    NULL::uuid, 'ATTIVO', 'config.stati_doc_contratti'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  c.id, c.uid, cr.id,
                  c.billing_account_id,
                  c.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(c.billing_account_id),
                  -- Competenza della riga UNA_TANTUM: il giorno di attivazione, in tutte
                  -- e due le colonne (D-1 di Tid, 2026-10-13). valido_dal e' NOT NULL.
                  c.valido_dal, c.valido_dal,
                  -- Corsia di instradamento: valore reale del contratto.
                  c.fatturazione_immediata,
                  v_sorgente_tipo_id,
                  c.uid::text,
                  script.fn_segment_key('CONTRATTO', c.uid::text, cr.id, COALESCE(c.valido_dal, c.data)),
                  cr.articolo_id,
                  c.istanza_utility_id,
                  COALESCE(c.valido_dal, c.data),
                  -- uom_id canonica da catalogo.articoli (fix bug proiezione NULL)
                  a.uom_id,
                  cr.quantita,
                  cr.qta_operativa,
                  cr.uom_operativa_id,
                  COALESCE(cr.factor_to_base, 1::numeric),
                  date_trunc('month', COALESCE(c.valido_dal, c.data))::date,
                  cr.prezzo_unitario,
                  -- prezzo_bloccato: dipende dalla RIGA (prezzo valorizzato),
                  -- INDIPENDENTE dal flag di corsia. Vedi header del changeSet.
                  (cr.prezzo_unitario IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  NULL::integer,
                  jsonb_build_object(
                    'contratto_numero',    c.numero,
                    'periodicita',         cr.periodicita,
                    'generazione_canone',  cr.generazione_canone,
                    'tipo_erogazione',     cr.tipo_erogazione,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM vendite.contratti c
                JOIN vendite.contratti_righe cr
                  ON cr.contratto_id = c.id
                 AND COALESCE(cr.attivo, TRUE) IS TRUE
                 -- L'esclusione non si fattura: dice solo che il contratto non vende
                 -- quell'articolo del listino.
                 AND cr.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                 -- Solo le UNA_TANTUM (D-2 di Tid, 2026-10-13): sono le sole che il push sa
                 -- mandare giuste, una riga e una volta. Le altre erogazioni aspettano la
                 -- loro generazione (brief-db-contratto-righe-periodiche-in-commessa).
                 AND cr.tipo_erogazione = 'UNA_TANTUM'
                JOIN catalogo.articoli a ON a.id = cr.articolo_id
                WHERE c.stato_doc_contratto_id = v_stato_attivo_id
                  AND (c.valido_al IS NULL OR c.valido_al >= COALESCE(p_competenza_mese, (SELECT script.fn_data_operativa())))
                  AND (p_competenza_mese IS NULL
                       OR date_trunc('month', COALESCE(c.valido_dal, c.data))::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_contratto_id IS NULL OR c.id = p_contratto_id)
                  -- Esclusione "gia' inviato": eleggibile solo se MAI
                  -- instradata (LIBERA) — classificatore condiviso coi rami
                  -- reason della capability: vede anche i componenti #CMP e
                  -- non dipende piu' da stato_emissione (ALLOCATA basta).
                  AND script.fn_get_stato_push_segment(
                        script.fn_segment_key('CONTRATTO', c.uid::text, cr.id, COALESCE(c.valido_dal, c.data))) = 'LIBERA'
                ORDER BY c.id, cr.id
                LIMIT p_limit;
              END
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_list_contratti_da_pushare(date,bigint,integer,bigint) IS
                'Lista righe contratto eligible al push su commessa (stato ATTIVO). uom_id da catalogo.articoli (canonica). p_contratto_id opzionale: NULL=batch globale, NOT NULL=singolo contratto. Filtri in AND. Esclude EMESSA via NOT EXISTS. (20260511-33: cr.quantita_fissa -> cr.quantita dopo rename colonna) rev 2026-06-28: sorgente/stato per codice_interno (analisi-hardcoded-codice §3a). rev 2026-07-19: esclusione su ALLOCAZIONE del mese via script.fn_get_stato_push_segment (vede anche componenti #CMP), non piu'' solo EMESSA — brief-db-push-commessa-gia-inviato §4a. rev 2026-07-27: fatturazione_immediata proiettata dalla colonna vendite.contratti.fatturazione_immediata (era costante FALSE) — simmetria del flag di corsia, brief-db-emissione-fattura-per-documento-sorgente PARTE B. prezzo_bloccato resta legato alla riga (prezzo valorizzato): l''accoppiamento flag/prezzo esiste solo sui preventivi. Espone termine_pagamento_id e modalita_pagamento_id a NULL: i contratti non hanno colonne di pagamento, la cascata scende al livello successivo (rev 2026-08-03, T.1). rev 2026-10-04: le righe ESCLUSIONE non si listano (non si fatturano; prima arrivavano in commessa senza prezzo, e per quell''articolo il resolver risponde E_ARTICOLO_ESCLUSO_DA_CONTRATTO) e l''erogazione della riga senza ripiego su CANONE, obbligatoria per CHECK su ogni riga che non e'' ESCLUSIONE, andava nella colonna tipo_consumo (ritirata il 2026-10-13) — brief-db-erogazione-obbligatoria-righe-fatturate R4. rev 2026-10-10 (20261010-55): via il filtro billing_account_id IS NOT NULL (colonna NOT NULL); lo stato ATTIVO assente dal catalogo solleva E_CODICE (config.stati_doc_contratti) invece di far cadere il filtro di stato. Brief: brief-db-istanza-nasce-col-ba-residui (D-1, D-2). rev 2026-10-13 (20261013-19): tipo_consumo RITIRATO in tutta la catena del push (madre, batch, cinque lister, builder pgTAP). Non aveva un lettore, e il vocabolario della madre (ACCONTO/CONGUAGLIO/STORNO) non lo produceva nessuna sorgente con un significato: preventivi, ordini e DDT scrivevano la costante CONGUAGLIO, contratti (l''erogazione della riga) e consumi (CONSUMO) un valore che la madre rifiutava, quindi il loro push falliva sempre (E_PARAMETRO_INVALIDO). L''erogazione resta dove gia'' stava, in meta.tipo_erogazione. Decisione A di Tid, 2026-10-13. Colonna tipo_consumo tolta dal RETURNS TABLE (DROP + CREATE). rev 2026-10-13 (20261013-24, D-1 e D-2 di Tid): si listano solo le righe UNA_TANTUM, con competenza dal giorno di attivazione al giorno di attivazione (valido_dal in tutte e due le colonne), come ordini e DDT. Prima la competenza era tutta la validita'' del contratto, e con valido_al NULL (contratto senza scadenza) competenza_al usciva NULL e la madre la rifiutava. CANONE, ORARIO e CONSUMO non si mandano finche'' non hanno la loro generazione: brief-db-contratto-righe-periodiche-in-commessa. Rev 2026-10-20 (20261020-90, brief-db-grammatica-unica-documenti 2e, G-8): la chiave e'' CONTRATTO:<uid>:R:<riga>:M:<AAAA-MM>, composta da script.fn_segment_key (era CONTR:...).';
