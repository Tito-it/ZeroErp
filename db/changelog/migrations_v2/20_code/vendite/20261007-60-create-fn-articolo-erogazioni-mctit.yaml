# ------------------------------------------------------------
# vendite.fn_articolo_erogazioni: COME SI EROGA UN ARTICOLO
#   Brief: brief-db-offerta-emissione-ed-erogazione §B.2 (B-R2, B-R3), §C.5, §C.7 (giro B3)
#
#   Il building block del perimetro: dall'articolo, le combinazioni
#   (erogazione, fonte) ammesse e quella di default. Tipologia, altrimenti
#   natura (B-D1); DERIVATA_COMPONENTI in piu' sul composito (B-D5).
#   La leggono l'eredita' (-62), la check del guard (-61) e il form (-65):
#   default e perimetro sono la stessa riga, non possono dissentire.
#   Ritorno indietro: DROP (nessun consumatore prima di questo giro).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261007-60-create-fn-articolo-erogazioni-mctit.yaml

  - changeSet:
      id: 20261007-60-create-fn-articolo-erogazioni
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce vendite.fn_articolo_erogazioni: le combinazioni di erogazione e fonte che un articolo
        ammette (tipologia, altrimenti natura; DERIVATA_COMPONENTI sul composito) e il default.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_articolo_erogazioni(
                  p_articolo_id catalogo.articoli.id%TYPE)
              RETURNS TABLE(
                  tipo_erogazione       config.erogazioni_fonti.tipo_erogazione%TYPE,
                  fonte_quantita_attesa config.erogazioni_fonti.fonte_quantita_attesa%TYPE,
                  e_default             config.erogazioni_fonti.e_default%TYPE,
                  generazione_canone    config.listini_tipologie_erogazioni.generazione_canone%TYPE,
                  -- Nudo DICHIARATO: da dove viene la combinazione (TIPOLOGIA | NATURA |
                  -- DISTINTA), un valore calcolato senza colonna di cui sia il riflesso.
                  origine               text)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: come si puo' erogare un articolo su una riga di contratto o di
              --   offerta — le combinazioni (erogazione, fonte) ammesse, quella di
              --   default, e la generazione_canone da proporre sulle CANONE.
              -- Regola (decisioni di Tid del 2026-10-07, brief-db-offerta-emissione-ed-
              --   erogazione §C.5):
              --   · l'articolo con una tipologia di listino: le combinazioni della
              --     tipologia (config.listini_tipologie_erogazioni) — B-R1, B-D4;
              --   · senza tipologia: quelle della natura di vendita
              --     (config.nature_vendita_erogazioni), che e' NOT NULL — B-D1. Vince la
              --     tipologia: le due non si sommano;
              --   · l'articolo composito ammette in piu' DERIVATA_COMPONENTI, accanto a
              --     ogni erogazione ammessa, se il vocabolario la dichiara coerente
              --     (config.erogazioni_fonti) — B-D5: e' un fatto della distinta, non della
              --     tipologia. Mai di default.
              -- Zero righe se l'articolo non c'e'.
              -- ⭐ Sede UNICA del perimetro: la leggono il trigger d'eredita', la check del
              --   guard e la lettura per il form. Il default e il perimetro non possono
              --   dissentire, perche' sono la stessa riga.
              DECLARE
                  v_tipologia catalogo.articoli.listino_tipologia_id%TYPE;
                  v_natura    catalogo.articoli.natura_vendita_id%TYPE;
                  v_composito catalogo.articoli.is_composito%TYPE;
              BEGIN
                  SELECT a.listino_tipologia_id, a.natura_vendita_id, a.is_composito
                    INTO v_tipologia, v_natura, v_composito
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  RETURN QUERY
                  WITH base AS (
                      SELECT te.tipo_erogazione, te.fonte_quantita_attesa, te.e_default,
                             te.generazione_canone, 'TIPOLOGIA'::text AS origine
                        FROM config.listini_tipologie_erogazioni te
                       WHERE v_tipologia IS NOT NULL
                         AND te.tipologia_id = v_tipologia
                      UNION ALL
                      SELECT ne.tipo_erogazione, ne.fonte_quantita_attesa, ne.e_default,
                             ne.generazione_canone, 'NATURA'::text
                        FROM config.nature_vendita_erogazioni ne
                       WHERE v_tipologia IS NULL
                         AND ne.natura_vendita_id = v_natura
                  ), distinta AS (
                      -- B-D5: il composito ammette la quantita' derivata dai componenti,
                      --   per ogni erogazione che la base ammette, se coerente.
                      SELECT DISTINCT ON (b.tipo_erogazione)
                             b.tipo_erogazione, ef.fonte_quantita_attesa, false AS e_default,
                             b.generazione_canone, 'DISTINTA'::text AS origine
                        FROM base b
                        JOIN config.erogazioni_fonti ef
                          ON ef.tipo_erogazione = b.tipo_erogazione
                         AND ef.fonte_quantita_attesa = 'DERIVATA_COMPONENTI'
                       WHERE v_composito IS TRUE
                         AND NOT EXISTS (SELECT 1 FROM base b2
                                          WHERE b2.tipo_erogazione = b.tipo_erogazione
                                            AND b2.fonte_quantita_attesa = 'DERIVATA_COMPONENTI')
                       ORDER BY b.tipo_erogazione, b.e_default DESC
                  )
                  SELECT * FROM base
                  UNION ALL
                  SELECT * FROM distinta;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_articolo_erogazioni(catalogo.articoli.id%TYPE)
              IS 'Building block: come si può erogare un articolo su una riga di contratto o di offerta. Restituisce le combinazioni (tipo_erogazione, fonte_quantita_attesa) ammesse, e_default su quella che la riga eredita quando non la indica, la generazione_canone da proporre sulle CANONE e l''origine (TIPOLOGIA | NATURA | DISTINTA). Regola (decisioni di Tid del 2026-10-07): con una tipologia di listino, le combinazioni della tipologia (config.listini_tipologie_erogazioni); senza, quelle della natura di vendita (config.nature_vendita_erogazioni) — vince la tipologia, le due non si sommano; un articolo composito ammette in più DERIVATA_COMPONENTI accanto a ogni erogazione ammessa, se il vocabolario config.erogazioni_fonti la dichiara coerente, mai di default. Zero righe se l''articolo non c''è. Sede unica del perimetro: la leggono script.trgfn_righe_default_erogazione_da_articolo (eredità), script.fn_check_riga_erogazione (guard) e vendite.fn_documento_riga_erogazioni (form). STABLE, SECURITY INVOKER. Nasce il 2026-10-07, brief-db-offerta-emissione-ed-erogazione §C.7 (B3).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_articolo_erogazioni(uuid);
