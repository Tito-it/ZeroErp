# Consolidamento delle due regole di annullamento, passo 2 di 2: la porta
#   smette di avere la regola in casa e chiama la funzione pura
#   (brief-db-vie-uscita-operatore §7.3).
#
# COSA CAMBIA DAVVERO, E COSA NO. La porta diventa piu' severa sulla carta —
#   prima fermava solo le righe gia' EMESSE, ora ferma anche l'ordine gia'
#   generato e l'ingresso in commessa. In pratica NON diventa piu' restrittiva
#   di quanto il database gia' fosse: quei due casi erano gia' bloccati dal
#   trigger trgfn_preventivi_guard_annullamento, che scatta sull'UPDATE che la
#   porta stessa esegue tre righe piu' sotto. Cambia QUANDO l'errore arriva
#   (prima della scrittura invece che durante) e CON QUALE codice, non che cosa
#   e' permesso. Per questo il consolidamento non puo' rompere un flusso: non
#   apre e non chiude nulla, mette d'accordo due voci.
#
# ⚠️ IL CODICE PREV_ANNULLAMENTO_COMMESSA_ATTIVA ESCE DI SCENA, ed e' il punto.
#   Non aveva il prefisso `E_`, e per questo:
#     - il presidio test-catalogo-messaggi-errore-completo.sql, che cerca solo
#       codici `E_*`, non lo vedeva (limite dichiarato al §7.3 del brief);
#     - l'estrattore di codici applicativi del backend, che cerca lo stesso
#       schema, non lo agganciava: la risposta degradava a E_DATABASE, http 400,
#       «Errore durante l'operazione database» — un rifiuto che l'operatore non
#       puo' leggere (misurato dal BE, §8.3 del brief).
#   Fino a ieri era teoria, perche' da ACCETTATO il preventivo non si annullava
#   affatto. Da ieri e' un percorso vivo. Non si e' allargata la regex lato BE
#   (farebbe falsi positivi) ne' mappato il codice a mano (sarebbe una terza
#   sede per la stessa regola): sparisce alla radice, che e' questo changeSet.
#   La riga resta a catalogo in config.messaggi_errore come storia: non si
#   cancella un messaggio che potrebbe essere gia' finito in un log.
#
# ℹ️ Il codice sollevato e' quello del PRIMO motivo, come gia' fanno il guard
#   del preventivo e quello dell'ordine. Il contesto porta l'array completo,
#   cosi' il log conserva tutti i motivi anche quando l'utente ne legge uno.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260804-74-update-fn-cambia-stato-preventivo-delega-annullabile-mctit.yaml

  - changeSet:
      id: 20260804-74-update-fn-cambia-stato-preventivo-delega-annullabile
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.fn_cambia_stato_preventivo delega l'ammissibilita'
        dell'annullamento a script.fn_check_preventivo_annullabile: una regola,
        una sede, un messaggio. Con essa esce di scena
        PREV_ANNULLAMENTO_COMMESSA_ATTIVA, il codice senza prefisso E_ che il
        backend non riusciva a tradurre in un errore leggibile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'script'
                AND p.proname = 'fn_check_preventivo_annullabile'
                AND p.prosrc LIKE '%E_PREV_ANNULLA_COMMESSA_EMESSA%'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_preventivo(p_preventivo_id bigint, p_nuovo_stato character varying, p_user text)
               RETURNS TABLE(preventivo_id bigint, stato_precedente character varying, stato_nuovo character varying)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente_id   vendite.preventivi.stato_doc_preventivo_id%TYPE;
                v_stato_corrente_cod  config.stati_doc_preventivi.codice_interno%TYPE;
                v_nuovo_stato_id      config.stati_doc_preventivi.id%TYPE;
                v_transizione_ok      boolean;
                v_count_righe         bigint;
                v_motivi              jsonb;
                v_numero              vendite.preventivi.numero%TYPE;
                v_uid                 vendite.preventivi.uid%TYPE;
              BEGIN
                -- ==========================================================
                -- Scopo:
                --   Eseguire la transizione di stato di un preventivo vendita,
                --   validando la transizione tramite la matrice configurabile
                --   config.transizioni_stati_preventivi.
                --
                -- Regole:
                --   - La transizione deve essere presente e attiva nella matrice
                --   - DRAFT → EMESSO: richiede almeno una riga attiva
                --     (SOLO presenza: un totale pari a zero non blocca)
                --   - Verso ANNULLATO: l'ammissibilita' NON e' decisa qui.
                --     La chiede a script.fn_check_preventivo_annullabile, che e'
                --     la sede unica della regola (rev 2026-08-04).
                --
                -- Parametri:
                --   p_preventivo_id : ID del preventivo
                --   p_nuovo_stato   : codice_interno dello stato destinazione
                --   p_user          : utente che esegue la transizione
                --
                -- Ritorna:
                --   preventivo_id, stato_precedente (codice_interno), stato_nuovo (codice_interno)
                --
                -- NOTE codice_interno (rev 2026-06-28, analisi-hardcoded-codice §3a #1):
                --   stato corrente e destinazione risolti per codice_interno
                --   (immutabile), non per codice (mutabile). Literali DRAFT/EMESSO/
                --   ANNULLATO sono codice_interno.
                --
                -- NOTE rev 2026-07-16 (solo presenza righe):
                --   rimossi il guard PREV_TOTALE_NON_POSITIVO e il filtro
                --   quantita > 0. Per emettere basta che il documento ABBIA
                --   righe: prezzo/totale 0 e' un caso legittimo. Regola valida
                --   per tutti i domini documentali.
                --
                -- NOTE rev 2026-08-04 (brief-db-vie-uscita-operatore §7.3):
                --   il guard verso ANNULLATO che stava qui — righe con
                --   stato_emissione EMESSA in commessa — e' stato ASSORBITO da
                --   script.fn_check_preventivo_annullabile, che lo espone come
                --   MOTIVO 2 accanto agli altri due. Qui resta solo la chiamata.
                --   Perche': la stessa domanda aveva due risposte diverse (questa
                --   e quella del trigger), e prima o poi sarebbero divergute.
                --   Con l'assorbimento esce di scena anche il codice
                --   PREV_ANNULLAMENTO_COMMESSA_ATTIVA, privo del prefisso `E_` e
                --   percio' invisibile sia al presidio del catalogo messaggi sia
                --   all'estrattore del backend (che lo degradava a E_DATABASE).
                -- ==========================================================

                -- Guard: parametri obbligatori
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('param', 'p_preventivo_id', 'value', p_preventivo_id),
                    NULL::uuid,
                    'p_preventivo_id = ' || COALESCE(p_preventivo_id::text, 'NULL')
                  );
                END IF;

                -- Recupera stato corrente, numero e uid in una sola query
                SELECT p.stato_doc_preventivo_id, sdp.codice_interno, p.numero, p.uid
                  INTO v_stato_corrente_id, v_stato_corrente_cod, v_numero, v_uid
                  FROM vendite.preventivi p
                  JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                 WHERE p.id = p_preventivo_id;

                IF v_stato_corrente_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'PREV_STATO_CORRENTE_NON_TROVATO',
                    jsonb_build_object('preventivo_id', p_preventivo_id),
                    NULL::uuid,
                    p_preventivo_id::text
                  );
                END IF;

                -- Recupera ID dello stato destinazione
                SELECT id INTO v_nuovo_stato_id
                  FROM config.stati_doc_preventivi
                 WHERE codice_interno = p_nuovo_stato AND attivo IS TRUE;

                IF v_nuovo_stato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'E_STATO_SCONOSCIUTO',
                    jsonb_build_object('codice', p_nuovo_stato),
                    NULL::uuid,
                    p_nuovo_stato
                  );
                END IF;

                -- Valida transizione via matrice config
                SELECT EXISTS(
                  SELECT 1
                    FROM config.transizioni_stati_preventivi t
                   WHERE t.stato_da_id = v_stato_corrente_id
                     AND t.stato_a_id  = v_nuovo_stato_id
                     AND t.attivo IS TRUE
                ) INTO v_transizione_ok;

                IF NOT v_transizione_ok THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'PREV_TRANSIZIONE_NON_AMMESSA',
                    jsonb_build_object(
                      'preventivo_id', p_preventivo_id,
                      'stato_da', v_stato_corrente_cod,
                      'stato_a', p_nuovo_stato
                    ),
                    NULL::uuid,
                    v_stato_corrente_cod, p_nuovo_stato
                  );
                END IF;

                -- Guard DRAFT → EMESSO: SOLO presenza di righe attive.
                -- Nessun vincolo su quantita/prezzo/totale: un documento
                -- a totale zero deve poter essere emesso (rev 2026-07-16).
                IF v_stato_corrente_cod = 'DRAFT' AND p_nuovo_stato = 'EMESSO' THEN
                  SELECT COUNT(*)
                    INTO v_count_righe
                    FROM vendite.preventivi_righe pr
                   WHERE pr.preventivo_id = p_preventivo_id
                     AND pr.attivo IS TRUE;

                  IF v_count_righe = 0 THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_cambia_stato_preventivo',
                      'PREV_NESSUNA_RIGA_ATTIVA',
                      jsonb_build_object('preventivo_id', p_preventivo_id),
                      NULL::uuid,
                      v_numero
                    );
                  END IF;
                END IF;

                -- Verso ANNULLATO: la regola NON e' qui. La sede unica e'
                -- script.fn_check_preventivo_annullabile, la stessa che legge il
                -- trigger di guard e la stessa che accende il bottone nelle
                -- capability. Qui si solleva il PRIMO motivo; il contesto porta
                -- l'array intero, cosi' il log li conserva tutti.
                IF p_nuovo_stato = 'ANNULLATO' THEN
                  v_motivi := script.fn_check_preventivo_annullabile(p_preventivo_id);

                  IF jsonb_array_length(v_motivi) > 0 THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_cambia_stato_preventivo',
                      v_motivi -> 0 ->> 'codice',
                      jsonb_build_object(
                        'preventivo_id', p_preventivo_id,
                        'numero',        v_numero,
                        'motivi',        v_motivi
                      ),
                      NULL::uuid,
                      COALESCE(v_numero, p_preventivo_id::text)
                    );
                  END IF;
                END IF;

                -- Esecuzione: aggiorna stato
                UPDATE vendite.preventivi
                   SET stato_doc_preventivo_id = v_nuovo_stato_id,
                       user_update = COALESCE(p_user, CURRENT_USER)
                 WHERE id = p_preventivo_id;

                -- Ritorna risultato
                RETURN QUERY
                SELECT p_preventivo_id, v_stato_corrente_cod, p_nuovo_stato;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_cambia_stato_preventivo(p_preventivo_id bigint, p_nuovo_stato character varying, p_user text)
              IS 'Transizione di stato preventivo validata dalla matrice config.transizioni_stati_preventivi. Guard DRAFT->EMESSO: SOLO presenza di righe attive (PREV_NESSUNA_RIGA_ATTIVA). Verso ANNULLATO: l''ammissibilita'' e'' delegata a script.fn_check_preventivo_annullabile — sede unica condivisa col trigger di guard e con fn_available_actions_preventivo — e si solleva il codice del primo motivo. Stato corrente/destinazione e RETURNS per codice_interno (immutabile). rev 2026-06-28: analisi-hardcoded-codice §3a #1. rev 2026-07-16: rimossi guard PREV_TOTALE_NON_POSITIVO e filtro quantita>0 — un documento a totale zero deve poter essere emesso. rev 2026-08-04: assorbita la regola locale sull''annullamento (righe EMESSA in commessa) dentro la fn pura; esce di scena il codice PREV_ANNULLAMENTO_COMMESSA_ATTIVA, privo di prefisso E_ e percio'' invisibile al presidio del catalogo e non agganciabile dal backend (brief-db-vie-uscita-operatore §7.3).';
