databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260217-03-refactor-fn-lotto-core-mctit.yaml

  - changeSet:
      id: 20260217-03-01-update-fn-create-fatturazione-lotto
      author: mctit
      comment: "Refactor validazioni e ricerca stato DRAFT per codice_interno"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_create_fatturazione_lotto(p_competenza_mese date, p_tipo_doc_fiscale_id bigint, p_utility_id integer DEFAULT NULL::integer, p_billing_account_id bigint DEFAULT NULL::bigint, p_lock_batch_id uuid DEFAULT NULL::uuid, p_meta jsonb DEFAULT NULL::jsonb)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_competenza vendite.fatturazione_lotti.competenza_mese%TYPE;
                v_utility_id config.utilities.id%TYPE;
                v_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE;
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_stato_doc_id config.stati_doc_fiscale.id%TYPE;
                v_map_exists boolean;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Crea un lotto di fatturazione con parametri coerenti
                --   (competenza, utility, tipo_doc_fiscale, BA) e stato iniziale.
                --
                -- Regole:
                --   - competenza_mese normalizzata al primo del mese
                --   - utility_id derivata da BA se presente
                --   - tipo_doc_fiscale obbligatorio e attivo
                --   - mapping tipo_doc_fiscale -> registro presente
                --   - stato_doc_fiscale iniziale = DRAFT (applica_lotto)
                -- =========================================================

                IF p_competenza_mese IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza_mese obbligatoria')),
                    NULL::uuid, 'competenza_mese obbligatoria'
                  );
                END IF;

                IF p_tipo_doc_fiscale_id IS NULL OR p_tipo_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_doc_fiscale_id obbligatorio')),
                    NULL::uuid,
                    'tipo_doc_fiscale_id obbligatorio'
                  );
                END IF;

                IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility_id non valido', 'utility_id', p_utility_id)),
                    NULL::uuid, 'utility_id non valido'
                  );
                END IF;

                IF p_billing_account_id IS NOT NULL AND p_billing_account_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account_id non valido', 'billing_account_id', p_billing_account_id)),
                    NULL::uuid, 'billing_account_id non valido'
                  );
                END IF;

                v_competenza := date_trunc('month', p_competenza_mese)::date;

                v_utility_id := p_utility_id;
                IF p_billing_account_id IS NOT NULL THEN
                  SELECT ba.utility_id
                    INTO v_utility_id
                    FROM anagrafiche.billing_account ba
                  WHERE ba.id = p_billing_account_id;

                  IF v_utility_id IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object(
                        'detail','Utility non risolta da billing_account',
                        'billing_account_id', p_billing_account_id
                      )),
                      NULL::uuid,
                      concat('Utility non risolta da billing_account',
                      ' billing_account_id: ', p_billing_account_id::text)
                    );
                  END IF;

                  IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object(
                        'detail','Utility non coerente con billing_account',
                        'billing_account_id', p_billing_account_id,
                        'utility_id', p_utility_id
                      )),
                      NULL::uuid,
                      concat('Utility non coerente con billing_account',
                        ' billing_account_id: ', p_billing_account_id::text,
                        ' utility_id: ', p_utility_id::text)
                    );
                  END IF;
                END IF;

                IF v_utility_id IS NULL OR v_utility_id <= 0 THEN 
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility_id obbligatoria')),
                    NULL::uuid, 'utility_id obbligatoria'
                  );
                END IF;

                SELECT EXISTS (
                  SELECT 1
                    FROM config.tipi_doc_fiscale t
                  WHERE t.id = p_tipo_doc_fiscale_id
                    AND t.attivo IS TRUE
                )
                INTO v_map_exists;

                IF NOT v_map_exists THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object(
                      'detail','Tipo documento fiscale non attivo o inesistente',
                      'tipo_doc_fiscale_id', p_tipo_doc_fiscale_id
                    )),
                    NULL::uuid,
                    concat('Tipo documento fiscale non attivo o inesistente', ' tipo_doc_fiscale_id: ', p_tipo_doc_fiscale_id::text)
                  );
                END IF;

                SELECT EXISTS (
                  SELECT 1
                    FROM vendite.tipi_doc_fiscale_registri m
                  WHERE m.tipo_doc_fiscale_id = p_tipo_doc_fiscale_id
                )
                INTO v_map_exists;

                IF NOT v_map_exists THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object(
                      'detail','Mapping tipo_doc_fiscale -> registro assente',
                      'tipo_doc_fiscale_id', p_tipo_doc_fiscale_id
                    )),
                    NULL::uuid,
                    concat('Mapping tipo_doc_fiscale -> registro assente', ' tipo_doc_fiscale_id: ', p_tipo_doc_fiscale_id::text)
                  );
                END IF;

                SELECT id
                  INTO v_stato_doc_id
                  FROM config.stati_doc_fiscale
                WHERE codice_interno = 'DRAFT'
                  AND applica_lotto IS TRUE
                  AND attivo IS TRUE
                ORDER BY ordine
                LIMIT 1;

                IF v_stato_doc_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Stato DRAFT non disponibile per lotto')),
                    NULL::uuid, 'Stato DRAFT non disponibile per lotto'
                  );
                END IF;

                v_lock_batch_id := COALESCE(p_lock_batch_id, uuidv7());

                INSERT INTO vendite.fatturazione_lotti (
                  lock_batch_id,
                  competenza_mese,
                  utility_id,
                  billing_account_id,
                  tipo_doc_fiscale_id,
                  stato_doc_fiscale_id,
                  meta
                )
                VALUES (
                  v_lock_batch_id,
                  v_competenza,
                  v_utility_id,
                  p_billing_account_id,
                  p_tipo_doc_fiscale_id,
                  v_stato_doc_id,
                  COALESCE(p_meta, '{}'::jsonb)
                )
                RETURNING id
                  INTO v_lotto_id;

                RETURN v_lotto_id;
              END
              $function$;

  - changeSet:
      id: 20260217-03-02-update-fn-get-or-create-lotto
      author: mctit
      comment: "Refactor riuso lotto e validazioni parametri"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_lotto(p_lotto_id bigint DEFAULT NULL::bigint, p_competenza_mese date DEFAULT NULL::date, p_tipo_doc_fiscale_id bigint DEFAULT NULL::bigint, p_utility_id integer DEFAULT NULL::integer, p_billing_account_id bigint DEFAULT NULL::bigint, p_lock_batch_id uuid DEFAULT NULL::uuid, p_meta jsonb DEFAULT NULL::jsonb, p_tipo_lotto text DEFAULT 'MASSIVO'::text)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_competenza vendite.fatturazione_lotti.competenza_mese%TYPE;
                v_utility_id config.utilities.id%TYPE;
                v_tipo_doc_id config.tipi_doc_fiscale.id%TYPE;
                v_billing_account_id anagrafiche.billing_account.id%TYPE;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_lotto vendite.fatturazione_lotti.stato_lotto%TYPE;
                v_tipo_lotto_input vendite.fatturazione_lotti.tipo_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recupera un lotto esistente o lo crea se assente.
                --
                -- Regole:
                --   - tipo_lotto obbligatorio (MASSIVO | GIORNALIERO)
                --   - lotto IN_ESECUZIONE non riutilizzabile
                -- =========================================================

                IF p_lotto_id = 0 THEN
                  p_lotto_id := NULL;
                END IF;

                v_tipo_lotto_input := upper(btrim(COALESCE(p_tipo_lotto, '')));

                IF v_tipo_lotto_input IS NULL OR v_tipo_lotto_input = '' OR v_tipo_lotto_input NOT IN ('MASSIVO','GIORNALIERO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_lotto non valido', 'tipo_lotto', p_tipo_lotto)),
                    NULL::uuid, 'tipo_lotto non valido'
                  );
                END IF;

                IF p_lotto_id IS NOT NULL AND p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id non valido', 'lotto_id', p_lotto_id)),
                    NULL::uuid, 'lotto_id non valido'
                  );
                END IF;

                IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_doc_fiscale_id non valido', 'tipo_doc_fiscale_id', p_tipo_doc_fiscale_id)),
                    NULL::uuid, 'tipo_doc_fiscale_id non valido'
                  );
                END IF;

                IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility_id non valido', 'utility_id', p_utility_id)),
                    NULL::uuid, 'utility_id non valido'
                  );
                END IF;

                IF p_billing_account_id IS NOT NULL AND p_billing_account_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account_id non valido', 'billing_account_id', p_billing_account_id)),
                    NULL::uuid, 'billing_account_id non valido'
                  );
                END IF;

                IF p_lotto_id IS NOT NULL THEN
                  SELECT competenza_mese, utility_id, tipo_doc_fiscale_id, billing_account_id, tipo_lotto, stato_lotto
                    INTO v_competenza, v_utility_id, v_tipo_doc_id, v_billing_account_id, v_tipo_lotto, v_stato_lotto
                    FROM vendite.fatturazione_lotti
                   WHERE id = p_lotto_id;

                  IF v_competenza IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Lotto non trovato', 'lotto_id', p_lotto_id)),
                      NULL::uuid,
                      concat('Lotto non trovato', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF v_stato_lotto = 'COMPLETATO' THEN
                    RETURN p_lotto_id;
                  END IF;

                  IF v_stato_lotto = 'IN_ESECUZIONE' THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Lotto in esecuzione non riutilizzabile', 'lotto_id', p_lotto_id)),
                      NULL::uuid,
                      concat('Lotto in esecuzione non riutilizzabile', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_competenza_mese IS NOT NULL
                    AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Competenza non coerente', 'lotto_id', p_lotto_id)),
                      NULL::uuid,
                      concat('Competenza non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Utility non coerente', 'lotto_id', p_lotto_id)),
                      NULL::uuid, concat('Utility non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <> v_tipo_doc_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Tipo documento non coerente', 'lotto_id', p_lotto_id)),
                      NULL::uuid,
                      concat('Tipo documento non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Billing account non coerente', 'lotto_id', p_lotto_id)),
                      NULL::uuid, concat('Billing account non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF v_tipo_lotto IS NOT NULL AND v_tipo_lotto <> v_tipo_lotto_input THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Tipo lotto non coerente', 'lotto_id', p_lotto_id)),
                      NULL::uuid, concat('Tipo lotto non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  RETURN p_lotto_id;
                END IF;

                IF p_lock_batch_id IS NOT NULL THEN
                  SELECT id, tipo_lotto, stato_lotto
                    INTO v_lotto_id, v_tipo_lotto, v_stato_lotto
                    FROM vendite.fatturazione_lotti
                   WHERE lock_batch_id = p_lock_batch_id
                   ORDER BY id DESC
                   LIMIT 1;

                  IF v_lotto_id IS NOT NULL THEN
                    IF v_stato_lotto = 'COMPLETATO' THEN
                      RETURN v_lotto_id;
                    END IF;

                    IF v_stato_lotto = 'IN_ESECUZIONE' THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Lotto in esecuzione non riutilizzabile', 'lotto_id', v_lotto_id)),
                        NULL::uuid,
                        concat('Lotto in esecuzione non riutilizzabile', ' lotto_id: ', v_lotto_id::text)
                      );
                    END IF;

                    IF v_tipo_lotto IS NOT NULL AND v_tipo_lotto <> v_tipo_lotto_input THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','Tipo lotto non coerente', 'lotto_id', v_lotto_id)),
                        NULL::uuid, concat('Tipo lotto non coerente', ' lotto_id: ', v_lotto_id::text)
                      );
                    END IF;

                    RETURN v_lotto_id;
                  END IF;
                END IF;

                v_lotto_id := vendite.fn_create_fatturazione_lotto(
                  p_competenza_mese,
                  p_tipo_doc_fiscale_id,
                  p_utility_id,
                  p_billing_account_id,
                  p_lock_batch_id,
                  p_meta
                );

                UPDATE vendite.fatturazione_lotti
                   SET tipo_lotto = v_tipo_lotto_input,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = v_lotto_id;

                RETURN v_lotto_id;
              END
              $function$;

  - changeSet:
      id: 20260217-03-03-update-fn-set-fatturazione-lotto-stato
      author: mctit
      comment: "Refactor transizioni stato_lotto e allineamento stato_operativo"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_set_fatturazione_lotto_stato(p_lotto_id bigint, p_stato_lotto text, p_note text DEFAULT NULL::text)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente vendite.fatturazione_lotti.stato_lotto%TYPE;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_lotto_input vendite.fatturazione_lotti.stato_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Aggiorna lo stato job del lotto e allinea lo stato operativo.
                --
                -- Regole:
                --   - IN_ESECUZIONE -> COMPLETATO | ERRORE
                --   - ERRORE -> IN_ESECUZIONE
                --   - COMPLETATO -> IN_ESECUZIONE
                -- =========================================================

                IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_stato_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id e stato_lotto obbligatori')),
                    NULL::uuid, 'Parametri obbligatori mancanti'
                  );
                END IF;

                v_stato_lotto_input := upper(btrim(p_stato_lotto));

                IF v_stato_lotto_input NOT IN ('IN_ESECUZIONE','COMPLETATO','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_lotto non valido', 'stato_lotto', p_stato_lotto)),
                    NULL::uuid, 'stato_lotto non valido'
                  );
                END IF;

                SELECT stato_lotto, tipo_lotto
                  INTO v_stato_corrente, v_tipo_lotto
                  FROM vendite.fatturazione_lotti
                 WHERE id = p_lotto_id
                 FOR UPDATE;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id)),
                    NULL::uuid, 
                    concat('Lotto non trovato ', 'lotto_id: ', p_lotto_id::text)
                  );
                END IF;

                IF v_stato_corrente = v_stato_lotto_input THEN
                  RETURN;
                END IF;

                IF v_stato_corrente = 'IN_ESECUZIONE'
                   AND v_stato_lotto_input NOT IN ('COMPLETATO','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa', 'da', v_stato_corrente, 'a', v_stato_lotto_input)),
                    NULL::uuid, 
                    concat('Transizione non ammessa: stato in esecuzione' , ' da ', v_stato_corrente, ' a ', v_stato_lotto_input) 
                  );
                END IF;

                IF v_stato_corrente = 'ERRORE' AND v_stato_lotto_input <> 'IN_ESECUZIONE' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa', 'da', v_stato_corrente, 'a', v_stato_lotto_input)),
                    NULL::uuid, 
                    concat('Transizione non ammessa: stato errore' , ' da ', v_stato_corrente, ' a ', v_stato_lotto_input)
                  );
                END IF;

                IF v_stato_corrente = 'COMPLETATO' AND v_stato_lotto_input <> 'IN_ESECUZIONE' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa', 'da', v_stato_corrente, 'a', v_stato_lotto_input)),
                    NULL::uuid, 
                    concat('Transizione non ammessa: stato completato' , ' da ', v_stato_corrente, ' a ', v_stato_lotto_input)
                  );
                END IF;

                UPDATE vendite.fatturazione_lotti
                   SET stato_lotto = v_stato_lotto_input,
                       stato_operativo = CASE
                                           WHEN v_stato_lotto_input = 'ERRORE' THEN 'ERRORE'
                                           WHEN v_stato_lotto_input = 'IN_ESECUZIONE' THEN 'APERTO'
                                           WHEN v_stato_lotto_input = 'COMPLETATO' AND v_tipo_lotto = 'MASSIVO' THEN 'CHIUSO'
                                           ELSE stato_operativo
                                         END,
                       meta = CASE
                                WHEN p_note IS NULL THEN meta
                                ELSE jsonb_set(meta, '{note_stato}', to_jsonb(p_note), true)
                              END,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_lotto_id;
              END
              $function$;

  - changeSet:
      id: 20260217-03-04-update-fn-sync-lotto-fatture-stato
      author: mctit
      comment: "Refactor sync stato fatture lotto con esclusione record esclusi"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_lotto_fatture_stato(p_lotto_id bigint, p_target_stato_doc_fiscale_id bigint DEFAULT NULL::bigint)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_lotto config.stati_doc_fiscale.id%TYPE;
                v_target config.stati_doc_fiscale.id%TYPE;
                v_inviata_id config.stati_doc_fiscale.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Allinea lo stato delle fatture collegate al lotto.
                --
                -- Regole:
                --   - p_lotto_id obbligatorio
                --   - se p_target_stato_doc_fiscale_id NULL usa stato_doc_fiscale lotto
                --   - lotto giornaliero: a INVIATA -> chiude stato_operativo
                -- =========================================================

                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id obbligatorio')),
                    NULL::uuid, 'lotto_id obbligatorio'
                  );
                END IF;

                IF p_target_stato_doc_fiscale_id IS NOT NULL AND p_target_stato_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','target stato_doc_fiscale non valido', 'stato_doc_fiscale_id', p_target_stato_doc_fiscale_id)),
                    NULL::uuid, 'stato_doc_fiscale target non valido'
                  );
                END IF;

                SELECT tipo_lotto, stato_doc_fiscale_id
                  INTO v_tipo_lotto, v_stato_lotto
                  FROM vendite.fatturazione_lotti
                 WHERE id = p_lotto_id
                 FOR UPDATE;

                IF v_stato_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id)),
                    NULL::uuid, concat('lotto non trovato: ', p_lotto_id)
                  );
                END IF;

                v_target := COALESCE(p_target_stato_doc_fiscale_id, v_stato_lotto);

                IF v_target IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_doc_fiscale target obbligatorio')),
                    NULL::uuid, 
                    concat('stato_doc_fiscale target obbligatorio per lotto: ', p_lotto_id)
                  );
                END IF;

                UPDATE vendite.fatture f
                   SET stato_doc_fiscale_id = v_target,
                       data_update = now(),
                       user_update = current_user
                  FROM vendite.fatturazione_lotti_fatture lf
                 WHERE lf.lotto_id = p_lotto_id
                   AND COALESCE(lf.esclusa, false) IS FALSE
                   AND lf.fattura_id = f.id
                   AND f.stato_doc_fiscale_id IS DISTINCT FROM v_target;

                IF v_tipo_lotto = 'GIORNALIERO' THEN
                  SELECT id
                    INTO v_inviata_id
                    FROM config.stati_doc_fiscale
                   WHERE codice_interno = 'INVIATA'
                     AND attivo IS TRUE
                   ORDER BY ordine
                   LIMIT 1;

                  IF v_inviata_id IS NOT NULL AND v_target = v_inviata_id THEN
                    UPDATE vendite.fatturazione_lotti
                       SET stato_operativo = 'CHIUSO',
                           data_update = now(),
                           user_update = current_user
                     WHERE id = p_lotto_id;
                  END IF;
                END IF;
              END
              $function$;
