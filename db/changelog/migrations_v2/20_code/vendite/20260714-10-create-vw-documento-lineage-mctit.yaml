# Lineage documenti vendite — Step 3. vw_documento_lineage: vista SUMMARY (una
# riga per documento nodo) per arricchire le liste con pratica + fase + frontiera.
# brief-db-lineage-documenti-vendite §3.2 / §4.
#
# Base: vendite.vw_documento_lineage_nodi (tutti i nodi, anche isolati).
# Grafo forward: vendite.vw_documento_lineage_archi escludendo l'arco R (reso =
# ramo inverso, fuori dalla frontiera forward, §0).
#
# Colonne esposte:
#   - chiave nodo:  tipo_id, uid, codice
#   - stato/fase propri: stato_codice_interno/stato_codice/stato_descrizione, fase, is_abortito
#   - pratica (1:1 difensiva, §0 Q5): pratica_id, pratica_numero (= pratiche.codice),
#     n_pratiche (conteggio; >1 = anomalia da segnalare)
#   - frontiera (§4): documento piu' a valle ANCORA ATTIVO raggiungibile forward.
#     Attivo := fase <> 'CHIUSO' AND NOT is_abortito. Regola di scelta: prima gli
#     attivi, poi il piu' profondo (lvl DESC). Se nessun discendente/se stesso e'
#     attivo -> frontiera = nodo terminale piu' profondo (es. «-> Fatturato»).
#     Include il nodo stesso (lvl 0) tra i candidati.
#   - discendenti diretti (lvl 1): n_discendenti_diretti, n_discendenti_attivi
#     (segnala il fan-out F contratto->N commesse), is_transitato (ha discendenti)
#   - lato inverso (lista commesse, G-11): n_sorgenti (archi entranti forward),
#     root_tipo_id/root_uid/root_codice (sorgente con ruolo ROOT se presente)
#
# Frontiera via WITH RECURSIVE su archi forward (catene corte, cycle guard su
# path visitato + lvl<10). Nota perf: espansione forward per ogni nodo; se su
# volumi grandi risultasse lenta, valutare materializzazione o spostare il calcolo
# nella fn traversal (Step 4). security_invoker=on. Alias FEDELI (§6c).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260714-10-create-vw-documento-lineage-mctit.yaml

  - changeSet:
      id: 20260714-10-create-vw-documento-lineage
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_documento_lineage
              WITH (security_invoker=on) AS
              WITH RECURSIVE
              fwd AS (
                  -- grafo forward (esclude l'arco inverso R)
                  SELECT from_tipo_id, from_uid, to_tipo_id, to_uid,
                         to_codice, to_stato_codice_interno, to_fase, to_is_abortito, ruolo
                    FROM vendite.vw_documento_lineage_archi
                   WHERE arco <> 'R'
              ),
              walk AS (
                  -- livello 1: discendenti diretti di ogni nodo
                  SELECT f.from_tipo_id AS o_tipo, f.from_uid AS o_uid,
                         f.to_tipo_id   AS d_tipo, f.to_uid   AS d_uid,
                         f.to_codice AS d_codice, f.to_stato_codice_interno AS d_stato,
                         f.to_fase AS d_fase, f.to_is_abortito AS d_abortito,
                         1 AS lvl,
                         ARRAY[(f.from_tipo_id::text || ':' || f.from_uid),
                               (f.to_tipo_id::text   || ':' || f.to_uid)] AS visited
                    FROM fwd f
                  UNION ALL
                  SELECT w.o_tipo, w.o_uid,
                         f.to_tipo_id, f.to_uid, f.to_codice, f.to_stato_codice_interno,
                         f.to_fase, f.to_is_abortito,
                         w.lvl + 1,
                         w.visited || (f.to_tipo_id::text || ':' || f.to_uid)
                    FROM walk w
                    JOIN fwd f ON f.from_tipo_id = w.d_tipo AND f.from_uid = w.d_uid
                   WHERE w.lvl < 10
                     AND NOT ((f.to_tipo_id::text || ':' || f.to_uid) = ANY (w.visited))
              ),
              cand AS (
                  -- candidati frontiera: il nodo stesso (lvl 0) + i discendenti forward
                  SELECT n.tipo_id AS o_tipo, n.uid AS o_uid,
                         n.tipo_id AS d_tipo, n.uid AS d_uid, n.codice AS d_codice,
                         n.stato_codice_interno AS d_stato, n.fase AS d_fase,
                         n.is_abortito AS d_abortito, 0 AS lvl
                    FROM vendite.vw_documento_lineage_nodi n
                  UNION ALL
                  SELECT o_tipo, o_uid, d_tipo, d_uid, d_codice, d_stato, d_fase, d_abortito, lvl
                    FROM walk
              ),
              frontiera AS (
                  -- Scelta della frontiera per ogni nodo origine, in ordine:
                  --  1. prima gli ATTIVI: fase<>CHIUSO AND NOT is_abortito
                  --  2. poi il piu' PROFONDO: lvl DESC
                  --  3. a parita' di livello, il piu' A VALLE nel flusso via
                  --     pipeline_rank DESC [fattura>commessa>ddt>ordine=contratto>preventivo=offerta]
                  --  4. tie-break finale deterministico: tipo, uid
                  SELECT c.o_tipo, c.o_uid, c.d_tipo, c.d_uid, c.d_codice, c.d_stato, c.d_fase,
                         ROW_NUMBER() OVER (
                             PARTITION BY c.o_tipo, c.o_uid
                             ORDER BY (CASE WHEN c.d_fase <> 'CHIUSO'
                                             AND NOT COALESCE(c.d_abortito, false)
                                            THEN 0 ELSE 1 END),
                                      c.lvl DESC,
                                      COALESCE(nd.pipeline_rank, 0) DESC,
                                      c.d_tipo, c.d_uid
                         ) AS rn
                    FROM cand c
                    LEFT JOIN vendite.vw_documento_lineage_nodi nd
                           ON nd.tipo_id = c.d_tipo AND nd.uid = c.d_uid
              ),
              disc AS (
                  -- conteggi discendenti diretti (lvl 1)
                  SELECT o_tipo, o_uid,
                         COUNT(DISTINCT (d_tipo::text || ':' || d_uid)) AS n_diretti,
                         COUNT(DISTINCT (d_tipo::text || ':' || d_uid))
                             FILTER (WHERE d_fase <> 'CHIUSO' AND NOT COALESCE(d_abortito, false))
                             AS n_attivi
                    FROM walk
                   WHERE lvl = 1
                   GROUP BY o_tipo, o_uid
              ),
              inc AS (
                  -- archi forward ENTRANTI nel nodo (lato inverso; per lista commesse)
                  SELECT to_tipo_id AS tipo, to_uid AS uid,
                         COUNT(*) AS n_sorgenti,
                         (array_agg(from_tipo_id ORDER BY (ruolo = 'ROOT') DESC NULLS LAST, from_tipo_id, from_uid))[1] AS root_tipo,
                         (array_agg(from_uid     ORDER BY (ruolo = 'ROOT') DESC NULLS LAST, from_tipo_id, from_uid))[1] AS root_uid,
                         (array_agg(from_codice  ORDER BY (ruolo = 'ROOT') DESC NULLS LAST, from_tipo_id, from_uid))[1] AS root_codice
                    FROM vendite.vw_documento_lineage_archi
                   WHERE arco <> 'R'
                   GROUP BY to_tipo_id, to_uid
              ),
              prat AS (
                  -- pratica 1:1 difensiva: prima per id + conteggio
                  SELECT ps.sorgente_tipo_id AS tipo, ps.sorgente_uid AS uid,
                         COUNT(DISTINCT ps.pratica_id) AS n_pratiche,
                         (array_agg(p.id     ORDER BY p.id))[1] AS pratica_id,
                         (array_agg(p.codice ORDER BY p.id))[1] AS pratica_numero
                    FROM pratiche.pratiche_sorgenti ps
                    JOIN pratiche.pratiche p ON p.id = ps.pratica_id
                   GROUP BY ps.sorgente_tipo_id, ps.sorgente_uid
              )
              SELECT
                  n.tipo_id,
                  n.uid,
                  n.codice,
                  n.stato_codice_interno,
                  n.stato_codice,
                  n.stato_descrizione,
                  n.fase,
                  n.is_abortito,
                  pr.pratica_id,
                  pr.pratica_numero,
                  COALESCE(pr.n_pratiche, 0)          AS n_pratiche,
                  fr.d_tipo                           AS frontiera_tipo_id,
                  fr.d_uid                            AS frontiera_uid,
                  fr.d_codice                         AS frontiera_codice,
                  fr.d_stato                          AS frontiera_stato_codice_interno,
                  fr.d_fase                           AS frontiera_fase,
                  COALESCE(dc.n_diretti, 0)           AS n_discendenti_diretti,
                  COALESCE(dc.n_attivi, 0)            AS n_discendenti_attivi,
                  (COALESCE(dc.n_diretti, 0) > 0)     AS is_transitato,
                  COALESCE(ic.n_sorgenti, 0)          AS n_sorgenti,
                  ic.root_tipo                        AS root_tipo_id,
                  ic.root_uid                         AS root_uid,
                  ic.root_codice                      AS root_codice
                FROM vendite.vw_documento_lineage_nodi n
                LEFT JOIN prat pr      ON pr.tipo   = n.tipo_id AND pr.uid   = n.uid
                LEFT JOIN frontiera fr ON fr.o_tipo = n.tipo_id AND fr.o_uid = n.uid AND fr.rn = 1
                LEFT JOIN disc dc      ON dc.o_tipo = n.tipo_id AND dc.o_uid = n.uid
                LEFT JOIN inc ic       ON ic.tipo   = n.tipo_id AND ic.uid   = n.uid;

              COMMENT ON VIEW vendite.vw_documento_lineage IS
                  'Lineage documenti vendite (Step 3): summary per nodo per arricchire le '
                  'liste. Espone pratica (1:1 difensiva + n_pratiche), fase propria, '
                  'frontiera forward (piu'' a valle attivo, esclude arco R), discendenti '
                  'diretti/attivi, is_transitato, lato inverso (n_sorgenti + ROOT). '
                  'security_invoker=on.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_documento_lineage;
