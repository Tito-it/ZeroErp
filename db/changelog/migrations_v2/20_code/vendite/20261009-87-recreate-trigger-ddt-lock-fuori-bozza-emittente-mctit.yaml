# ------------------------------------------------------------
# L'EMITTENTE DI UN DDT SI SCEGLIE SOLO IN BOZZA
#   vendite.ddt: trg_ddt_a05_lock_fuori_bozza_upd sul BB vendite.trgfn_doc_testata_lock_fuori_bozza
#   (20261009-70), RIMONTATO con la colonna in piu' (un trigger non cambia gli argomenti sul posto).
#   Brief: brief-db-esecutivi-ba-coppia (§9.8)
#
# -- PERCHE' (decisione di Tid del 2026-10-09, brief §9.8) -----------------
#   L'emittente di un documento non era bloccato da nessuna parte fuori dal
#   preventivo: nessuno l'aveva mai chiuso. Il 2026-06-05 (20260605-05) era
#   nato anzi un trigger che RICALCOLAVA i totali dell'ordine dopo un cambio di
#   emittente: gestiva l'effetto invece di vietare la causa. Col BA (D-1) e un
#   emittente per BA, in bozza l'emittente lo lega gia' al cliente il guard
#   emittente <-> BA; fuori bozza il documento e' stampato, numerato sul
#   registro DI QUELL'AZIENDA e magari in fatturazione: cambiare chi lo emette
#   lo riscriverebbe. E dove il BA manca (DDT di trasferimento, conto lavoro)
#   fuori bozza l'emittente si cambiava davvero, con un UPDATE.
#   Il blocco e' fuori bozza e non assoluto: sull'offerta in bozza il backend
#   cambia cliente ed emittente insieme (offerte_service.UPDATE_KEYS_OFFERTA),
#   ed e' un flusso legittimo.
#   Codice E_DOC_EMITTENTE_FUORI_BOZZA, uno per tutti i documenti (VARIADIC: lo
#   stato, la forma del BB). Non E_EMITTENTE_NON_MODIFICABILE: e' il codice
#   dell'associazione operatore <-> emittente, e la sua frase parla di quella.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261009-87-recreate-trigger-ddt-lock-fuori-bozza-emittente-mctit.yaml

  - changeSet:
      id: 20261009-87-recreate-trigger-ddt-lock-fuori-bozza-emittente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.ddt: emittente_fiscale_id bloccato fuori bozza (E_DOC_EMITTENTE_FUORI_BOZZA) sul BB di testata. Brief: brief-db-esecutivi-ba-coppia (9.8).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_doc_testata_lock_fuori_bozza'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_a05_lock_fuori_bozza_upd ON vendite.ddt;

              CREATE TRIGGER trg_ddt_a05_lock_fuori_bozza_upd
                BEFORE UPDATE ON vendite.ddt
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza(
                'DDT', 'DRAFT',
                'causale_trasporto_id', 'E_DDT_CAUSALE_IMMUTABILE',
                'billing_account_id', 'E_DDT_CLIENTE_IMMUTABILE',
                'utility_id', 'E_DDT_CLIENTE_IMMUTABILE',
                'destinatario_soggetto_ruolo_id', 'E_DDT_CLIENTE_IMMUTABILE',
                'magazzino_id', 'E_DDT_MAGAZZINO_IMMUTABILE',
                'magazzino_arrivo_id', 'E_DDT_MAGAZZINO_IMMUTABILE',
                'emittente_fiscale_id', 'E_DOC_EMITTENTE_FUORI_BOZZA');

              COMMENT ON TRIGGER trg_ddt_a05_lock_fuori_bozza_upd ON vendite.ddt
              IS 'Fuori bozza (stato VECCHIO diverso da DRAFT) il DDT non cambia causale (E_DDT_CAUSALE_IMMUTABILE), cliente: billing account, utility, destinatario (E_DDT_CLIENTE_IMMUTABILE), magazzino di partenza e di arrivo (E_DDT_MAGAZZINO_IMMUTABILE), ne'' l''azienda che lo emette (E_DOC_EMITTENTE_FUORI_BOZZA, dal 20261009-87). BB vendite.trgfn_doc_testata_lock_fuori_bozza, fascia _a05_. Brief: brief-db-esecutivi-ba-coppia.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_a05_lock_fuori_bozza_upd ON vendite.ddt;
