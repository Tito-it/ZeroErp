# ------------------------------------------------------------
# ⭐ P-1 (c) — fn_get_lotto_segnalazioni_summary diventa il LETTORE per un
#   lotto della sede unica (vendite.vw_lotti_segnalazioni_summary, 20260919-01)
#   e porta al backend l'UNDICESIMA colonna: `fermo`.
#   Brief: brief-db-osservabilita-lotto-fermo-r6-indici §2.2 (c).
#
# ── COSA CAMBIA, E COSA NO ──────────────────────────────────────────
#   · Le quattro CTE escono dal corpo: erano il solo posto in cui il riepilogo
#     si calcolava, e da oggi il posto e' la vista. La funzione tiene il guard
#     sul parametro e la garanzia di UNA riga sempre (zeri su lotto inesistente
#     o fuori perimetro: i pgTAP 2-5 di test-lotto-segnalazioni-summary-v2 la
#     pinnano, e il backend ci conta).
#   · I dieci conteggi restano NELLO STESSO ORDINE: il backend legge per nome
#     nella SELECT ma il TypedDict e i test lo trattano ancora per posizione
#     (COMMENT vivo, rev 2026-09-12). `fermo` va IN CODA, undicesima.
#   · DROP + CREATE: la RETURNS TABLE cambia, e CREATE OR REPLACE non puo'
#     cambiarla. Nessuna vista dipende dalla funzione e nessun'altra funzione
#     la nomina (pg_depend e pg_proc, 19-09): il DROP non trascina niente.
#     Il privilegio torna quello di default (=X a PUBLIC), come era.
#
# ── ⭐ `fermo` E' IL VERDETTO, NON UN CONTEGGIO IN PIU' ────────────────
#   Fino a oggi la COMMENT di questa funzione diceva «blocks_next_step resta in
#   Python». Da oggi dice il contrario, per decisione di Tid (D-1, 18-09): il
#   backend lo LEGGE da qui e non lo ricalcola. I dieci conteggi restano per
#   la FRASE del banner; la decisione e' la colonna.
#   ⚠️ Finche' il backend non legge l'undicesima colonna (pezzo V del piano
#   BE/FE), la sua copia in Python e il valore qui coincidono per costruzione:
#   la vista e' la trasposizione fedele del predicato Python. E' la finestra
#   in cui un test di parita' ha senso, e poi si toglie.
#
# ── ⚠️ Su un lotto FUORI PERIMETRO la risposta e' zeri e `fermo = false` ─
#   Non e' un ramo nuovo: era gia' cosi' (la vista e' security_invoker, la
#   funzione INVOKER). Il backend legge la testata PRIMA e risponde 404: un
#   riepilogo di zeri non arriva mai a una persona come «tutto a posto».
#
# Verifica: db/pgtap/vendite/test-lotto-segnalazioni-summary-v2.sql (test 7:
#   l'ULTIMA colonna e' `fermo`), db/pgtap/vendite/test-lotti-fermi-verdetto-a-db-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260919-02-update-fn-get-lotto-segnalazioni-summary-legge-la-sede-e-porta-fermo-mctit.yaml

  - changeSet:
      id: 20260919-02-update-fn-get-lotto-segnalazioni-summary-legge-la-sede-e-porta-fermo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_get_lotto_segnalazioni_summary legge la sede unica
        (vw_lotti_segnalazioni_summary) invece di ricalcolare le quattro CTE, e
        porta in coda l'undicesima colonna `fermo`: il verdetto che era
        LottoSegnalazioniService.blocks_next_step, da oggi a DB (D-1 di Tid,
        18-09). I dieci conteggi restano nello stesso ordine; una riga sempre
        (zeri e fermo=false su lotto inesistente o fuori perimetro). DROP +
        CREATE perche' la RETURNS TABLE cambia.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_lotti_segnalazioni_summary
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_get_lotto_segnalazioni_summary';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⛔ La RETURNS TABLE cambia: CREATE OR REPLACE non la cambia, serve
              --   il DROP. Nessun oggetto dipende dalla funzione (verificato il
              --   19-09 su pg_depend e sui corpi in pg_proc).
              DROP FUNCTION IF EXISTS vendite.fn_get_lotto_segnalazioni_summary(bigint);

              CREATE FUNCTION vendite.fn_get_lotto_segnalazioni_summary(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE)
              -- ⚠️ Tutti `bigint` espliciti: sono CONTEGGI, non il riflesso di
              --    una colonna. `%TYPE` solo dove una colonna esiste davvero.
              RETURNS TABLE(
                  fatture_critical_count                bigint,
                  fatture_warning_count                 bigint,
                  lotto_critical_count                  bigint,
                  lotto_warning_count                   bigint,
                  lotto_info_count                      bigint,
                  fatture_stato_esecuzione_errore_count bigint,
                  documenti_bloccanti_count             bigint,
                  documenti_presi_in_carico_count       bigint,
                  critiche_giro_count                   bigint,
                  esiti_stato_esecuzione_errore_count   bigint,
                  fermo                                 boolean
              )
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: il riepilogo delle segnalazioni di UN lotto per il backend
              --        (banner, runner): i dieci conteggi piu' il verdetto `fermo`.
              --        ⭐ Dal 2026-09-19 e' un LETTORE: gli aggregati vivono in
              --        vendite.vw_lotti_segnalazioni_summary, la sede unica che
              --        legge anche il presidio dbops.vw_lotti_fermi_da_guardare.
              --        Un addendo nuovo si aggiunge LI', non qui.
              BEGIN
                  -- Guard: parametro obbligatorio
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_lotto_segnalazioni_summary', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0'
                      );
                  END IF;

                  -- ⚠️ I NUMERI RESTANO NELLO STESSO ORDINE e `fermo` VA IN CODA:
                  --   il backend mappa la riga per posizione, e una colonna in
                  --   mezzo farebbe scivolare le altre senza che niente protesti.
                  -- ⭐ Il predicato `s.lotto_id = p_lotto_id` viene spinto dentro
                  --   le quattro GROUP BY della vista (verificato con EXPLAIN):
                  --   e' la stessa lettura per lotto delle vecchie CTE.
                  RETURN QUERY
                  SELECT s.fatture_critical_count,
                         s.fatture_warning_count,
                         s.lotto_critical_count,
                         s.lotto_warning_count,
                         s.lotto_info_count,
                         s.fatture_stato_esecuzione_errore_count,
                         s.documenti_bloccanti_count,
                         s.documenti_presi_in_carico_count,
                         s.critiche_giro_count,
                         s.esiti_stato_esecuzione_errore_count,
                         s.fermo
                    FROM vendite.vw_lotti_segnalazioni_summary s
                   WHERE s.lotto_id = p_lotto_id;

                  -- ⭐ UNA RIGA SEMPRE. Lotto inesistente — o fuori dal perimetro
                  --   di chi legge: la vista e' security_invoker — risponde zeri
                  --   e `fermo = false`, com'era prima (le CTE su zero righe
                  --   davano COALESCE a zero). Il backend legge la testata PRIMA
                  --   e risponde 404: questi zeri non arrivano a una persona
                  --   come «tutto a posto».
                  IF NOT FOUND THEN
                      RETURN QUERY
                      SELECT 0::bigint, 0::bigint, 0::bigint, 0::bigint, 0::bigint,
                             0::bigint, 0::bigint, 0::bigint, 0::bigint, 0::bigint,
                             false;
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_lotto_segnalazioni_summary(bigint) IS
                  'Il riepilogo delle segnalazioni di un lotto per il backend: dieci conteggi '
                  'piu'' il verdetto. ⭐⭐ rev 2026-09-19 (brief-db-osservabilita-lotto-fermo-r6-indici, '
                  'D-1 di Tid: «la regola va a DB»): la funzione e'' un LETTORE di '
                  'vendite.vw_lotti_segnalazioni_summary — gli aggregati vivono nella vista, '
                  'una riga per lotto, e la legge anche il presidio dbops.vw_lotti_fermi_da_guardare; '
                  'un addendo nuovo si aggiunge nella vista, non qui. UNDICESIMA colonna in coda, '
                  '`fermo` = (fatture_critical + lotto_critical) > 0 OR '
                  'fatture_stato_esecuzione_errore > 0 OR esiti_stato_esecuzione_errore > 0: e'' '
                  'il verdetto che LottoSegnalazioniService.evaluate_lotto_status calcolava come '
                  'is_error/blocks_next_step, e da oggi il backend lo LEGGE e non lo ricalcola. '
                  '⛔ Fino al 2026-09-19 questa COMMENT diceva «blocks_next_step resta in '
                  'Python»: non piu''. I DIECI conteggi restano, nello stesso ordine, per la FRASE '
                  'del banner: i sei storici contano SEGNALAZIONI (C/W/I per canale fattura e '
                  'lotto, righe di ponte in ERRORE); i tre del 2026-09-08 contano GESTI '
                  '(documenti_bloccanti_count = documenti con almeno una critica viva, DISTINCT '
                  'sulla chiave; documenti_presi_in_carico_count = il denominatore, contato sugli '
                  'ESITI e non sul perimetro, vuoto sui giri di massa; critiche_giro_count = le '
                  'critiche senza documento, che bloccano e non hanno niente da togliere); il '
                  'decimo (2026-09-12, D2) conta i documenti presi in carico il cui ultimo esito e'' '
                  'ERRORE — ESCLUSO non conta, e'' la via d''uscita dichiarata. ⚠️ Le colonne sono '
                  'IN CODA e nell''ordine storico perche'' il backend legge questa riga per '
                  'POSIZIONE: infilarne una in mezzo mostrerebbe numeri plausibili e falsi, senza '
                  'fallire. ⚠️ UNA riga sempre: su un lotto inesistente o fuori perimetro (la '
                  'vista e'' security_invoker) risponde zeri e fermo=false, come prima — il backend '
                  'legge la testata prima e risponde 404. Brief precedenti: '
                  'brief-db-uscita-documento-dal-giro §7, '
                  'brief-db-rilancio-step-non-rivede-le-proprie-commesse D2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Torna la revisione 2026-09-12 (20260912-16): dieci colonne, le
              -- quattro CTE nel corpo. ⚠️ DROP obbligatorio: CREATE OR REPLACE
              -- non cambia una RETURNS TABLE.
              DROP FUNCTION IF EXISTS vendite.fn_get_lotto_segnalazioni_summary(bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_get_lotto_segnalazioni_summary(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE)
              RETURNS TABLE (
                  fatture_critical_count                bigint,
                  fatture_warning_count                 bigint,
                  lotto_critical_count                  bigint,
                  lotto_warning_count                   bigint,
                  lotto_info_count                      bigint,
                  fatture_stato_esecuzione_errore_count bigint,
                  documenti_bloccanti_count             bigint,
                  documenti_presi_in_carico_count       bigint,
                  critiche_giro_count                   bigint,
                  esiti_stato_esecuzione_errore_count   bigint
              )
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_lotto_segnalazioni_summary', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0'
                      );
                  END IF;

                  RETURN QUERY
                  WITH fatture_agg AS (
                      SELECT COUNT(*) FILTER (WHERE fl.status = 'C') AS fc,
                             COUNT(*) FILTER (WHERE fl.status = 'W') AS fw
                        FROM vendite.fatturazione_lotti_fatture lf
                        JOIN vendite.fatture_log fl ON fl.fattura_id = lf.fattura_id
                       WHERE lf.lotto_id = p_lotto_id AND fl.disabilitato IS FALSE
                  ),
                  lotto_agg AS (
                      SELECT COUNT(*) FILTER (WHERE ll.status = 'C') AS lc,
                             COUNT(*) FILTER (WHERE ll.status = 'W') AS lw,
                             COUNT(*) FILTER (WHERE ll.status = 'I') AS li,
                             COUNT(DISTINCT ll.gruppo_key)
                                 FILTER (WHERE ll.status = 'C'
                                           AND ll.gruppo_key IS NOT NULL)      AS docs_bloccanti,
                             COUNT(*) FILTER (WHERE ll.status = 'C'
                                           AND ll.gruppo_key IS NULL)          AS critiche_giro
                        FROM vendite.fatturazione_lotti_log ll
                       WHERE ll.lotto_id = p_lotto_id AND ll.disabilitato IS FALSE
                         AND NOT EXISTS (
                             SELECT 1
                               FROM vendite.fatturazione_lotti_esiti e
                              WHERE e.lotto_id         = ll.lotto_id
                                AND e.gruppo_key       = ll.gruppo_key
                                AND e.stato_esecuzione = 'ESCLUSO')
                  ),
                  esiti_agg AS (
                      SELECT COUNT(*) AS dt,
                             COUNT(*) FILTER (WHERE e.stato_esecuzione = 'ERRORE') AS de
                        FROM vendite.fatturazione_lotti_esiti e
                       WHERE e.lotto_id = p_lotto_id
                  ),
                  ponte_agg AS (
                      SELECT COUNT(*) FILTER (WHERE lf.stato_esecuzione = 'ERRORE') AS pe
                        FROM vendite.fatturazione_lotti_fatture lf
                       WHERE lf.lotto_id = p_lotto_id
                  )
                  SELECT COALESCE(fa.fc, 0), COALESCE(fa.fw, 0),
                         COALESCE(la.lc, 0), COALESCE(la.lw, 0), COALESCE(la.li, 0),
                         COALESCE(pa.pe, 0),
                         COALESCE(la.docs_bloccanti, 0),
                         COALESCE(ea.dt, 0),
                         COALESCE(la.critiche_giro, 0),
                         COALESCE(ea.de, 0)
                    FROM fatture_agg fa CROSS JOIN lotto_agg la CROSS JOIN ponte_agg pa
                                        CROSS JOIN esiti_agg ea;
              END;
              $function$;
