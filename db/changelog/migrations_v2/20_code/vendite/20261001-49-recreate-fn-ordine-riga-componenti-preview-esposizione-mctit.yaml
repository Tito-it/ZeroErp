# vendite.fn_ordine_riga_componenti_preview: l'esposizione del componente a tre modi.
#   Brief: brief-db-esposizione-componenti-kit-in-fattura, sezione 4.5
#
#   La colonna di uscita esposto_in_fattura (boolean) diventa
#   esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO), letta da
#   catalogo.articoli_componenti.esposizione_in_fattura (20261001-42). E' la
#   preview dei componenti del drawer di riga (ordine): il FE mostra il modo per
#   esteso, il BE lo passa com'e' (richieste nel brief, sezione 5).
#
# -- FORMA -------------------------------------------------------------
#   · RETURNS TABLE cambia (nome e tipo di una colonna): DROP + CREATE. Nessuna
#     vista ne' funzione la legge (doc auto-gen del 2026-10-01): la chiamano il
#     repository del documento e i pgTAP;
#   · firma e RETURNS TABLE dall'ultimo YAML che li ha ancorati
#     (20260513-14): la doc auto-gen li scioglie. La colonna nuova e
#     `obbligatorio` (che era `boolean` nudo) sono ancorate alla loro sorgente;
#     restano espliciti solo i valori calcolati senza colonna sorgente
#     (resolver_error_reason, p_data_riferimento, v_msg);
#   · corpo vivo dalla doc auto-gen, patchato da script con sostituzioni contate
#     (la colonna letta, l'assegnazione, una riga di rev nel commento, la coda
#     del COMMENT). Nessun'altra riga toccata;
#   · il DROP cancella i privilegi: l'EXECUTE all'app si ridichiara. Nessun
#     GRANT ai ruoli batch (linee-guida-sql 11.6).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261001-49-recreate-fn-ordine-riga-componenti-preview-esposizione-mctit.yaml

  - changeSet:
      id: 20261001-49-recreate-fn-ordine-riga-componenti-preview-esposizione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_ordine_riga_componenti_preview: la colonna esposto_in_fattura (boolean) diventa
        esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO). RETURNS TABLE cambiato:
        DROP + CREATE, EXECUTE all'app ridichiarato. Brief:
        brief-db-esposizione-componenti-kit-in-fattura (sezione 4.5).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: catalogo
            tableName: articoli_componenti
            columnName: esposizione_in_fattura
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- RETURNS TABLE cambia: CREATE OR REPLACE non lo ammette.
              DROP FUNCTION vendite.fn_ordine_riga_componenti_preview(p_articolo_id uuid, p_uom_id bigint, p_quantita_padre numeric, p_data_riferimento date, p_ba_id bigint, p_utility_id integer, p_emittente_sr_id bigint, p_classe_utenza_id integer);

              CREATE FUNCTION vendite.fn_ordine_riga_componenti_preview(
                  p_articolo_id         catalogo.articoli.id%TYPE,
                  p_uom_id              catalogo.unita_misura.id%TYPE,
                  p_quantita_padre      vendite.ordini_righe.quantita%TYPE,
                  p_data_riferimento    date,
                  p_ba_id               anagrafiche.billing_account.id%TYPE,
                  p_utility_id          vendite.ordini.utility_id%TYPE,
                  p_emittente_sr_id     anagrafiche.soggetti_ruoli.id%TYPE,
                  p_classe_utenza_id    config.classi_utenze.id%TYPE DEFAULT NULL
              )
              RETURNS TABLE (
                  articolo_componente_id catalogo.articoli_componenti.id%TYPE,
                  componente_id          catalogo.articoli.id%TYPE,
                  componente_codice      catalogo.articoli.codice%TYPE,
                  componente_descrizione catalogo.articoli.descrizione%TYPE,
                  coeff_qta_snapshot     catalogo.articoli_componenti.coeff_qta%TYPE,
                  quantita_componente    catalogo.articoli_componenti.coeff_qta%TYPE,
                  uom_id                 catalogo.articoli.uom_id%TYPE,
                  uom_codice             catalogo.unita_misura.codice%TYPE,
                  iva_id                 catalogo.articoli.iva_id%TYPE,
                  prezzo_suggerito       vendite.listini_righe.prezzo%TYPE,
                  origine_prezzo         vendite.ordini_righe_componenti.origine_prezzo%TYPE,
                  resolver_error_reason  text,
                  obbligatorio           catalogo.articoli_componenti.obbligatorio%TYPE,
                  esposizione_in_fattura catalogo.articoli_componenti.esposizione_in_fattura%TYPE
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: preview read-only dei componenti BoM CASO A per il drawer riga ordine
              --   (form atomic). Per ogni componente attivo e valido tenta
              --   fn_resolve_prezzo_listino_v2; se fallisce ritorna prezzo_suggerito=NULL
              --   + motivazione in resolver_error_reason. Nessun side-effect (STABLE).
              --   rev 2026-05-13: modello unificato — rimosso filtro esposto_in_fattura=TRUE;
              --   obbligatorio e esposto_in_fattura sono ora esposti nella proiezione.
              --   rev 2026-10-01: esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO)
              --   al posto del booleano esposto_in_fattura
              --   (brief-db-esposizione-componenti-kit-in-fattura).
              DECLARE
                  v_rec     record;
                  v_resolve record;
              BEGIN
                  FOR v_rec IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             ac.esposizione_in_fattura,
                             a.codice       AS a_codice,
                             a.descrizione  AS a_descrizione,
                             a.uom_id       AS a_uom_id,
                             a.iva_id       AS a_iva_id,
                             um.codice      AS um_codice
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                        LEFT JOIN catalogo.unita_misura um ON um.id = a.uom_id
                       WHERE ac.prodotto_id        = p_articolo_id
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita           @> p_data_riferimento
                  LOOP
                      articolo_componente_id := v_rec.bom_entry_id;
                      componente_id          := v_rec.componente_id;
                      componente_codice      := v_rec.a_codice;
                      componente_descrizione := v_rec.a_descrizione;
                      coeff_qta_snapshot     := v_rec.coeff_qta;
                      quantita_componente    := v_rec.coeff_qta * p_quantita_padre;
                      uom_id                 := v_rec.a_uom_id;
                      uom_codice             := v_rec.um_codice;
                      iva_id                 := v_rec.a_iva_id;
                      obbligatorio           := v_rec.obbligatorio;
                      esposizione_in_fattura := v_rec.esposizione_in_fattura;

                      BEGIN
                          SELECT * INTO v_resolve
                            FROM vendite.fn_resolve_prezzo_listino_v2(
                                v_rec.componente_id,
                                v_rec.a_uom_id,
                                p_data_riferimento,
                                p_ba_id,
                                p_utility_id::integer,
                                p_emittente_sr_id,
                                p_classe_utenza_id,
                                p_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                            );
                          prezzo_suggerito      := v_resolve.prezzo_finale;
                          origine_prezzo        := v_resolve.origine;
                          resolver_error_reason := NULL;
                      EXCEPTION WHEN SQLSTATE 'P0001' THEN
                          GET STACKED DIAGNOSTICS resolver_error_reason = MESSAGE_TEXT;
                          prezzo_suggerito := NULL;
                          origine_prezzo   := NULL;
                      END;

                      RETURN NEXT;
                  END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ordine_riga_componenti_preview(p_articolo_id uuid, p_uom_id bigint, p_quantita_padre numeric, p_data_riferimento date, p_ba_id bigint, p_utility_id integer, p_emittente_sr_id bigint, p_classe_utenza_id integer)
              IS 'Preview componenti BoM CASO A per drawer riga ordine (form atomic). Read-only STABLE. rev 2026-05-13, modello unificato: aggiunta obbligatorio + esposto_in_fattura nella proiezione. Rimosso filtro esposto_in_fattura=TRUE: tutti i componenti attivi e validi sono restituiti. prezzo_suggerito=NULL + resolver_error_reason se listino mancante. rev 2026-10-01: esposto_in_fattura (boolean) diventa esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO), letta dalla distinta (brief-db-esposizione-componenti-kit-in-fattura).';

              -- Il DROP ha cancellato i privilegi: l'EXECUTE all'app si ridichiara.
              GRANT EXECUTE ON FUNCTION vendite.fn_ordine_riga_componenti_preview(p_articolo_id uuid, p_uom_id bigint, p_quantita_padre numeric, p_data_riferimento date, p_ba_id bigint, p_utility_id integer, p_emittente_sr_id bigint, p_classe_utenza_id integer) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Ripristino della forma di prima (20260513-14 + corpo vivo):
              -- nomina la colonna vecchia, che torna col rollback di 20261001-42
              -- (plpgsql: il corpo non e' una dipendenza).
              DROP FUNCTION IF EXISTS vendite.fn_ordine_riga_componenti_preview(p_articolo_id uuid, p_uom_id bigint, p_quantita_padre numeric, p_data_riferimento date, p_ba_id bigint, p_utility_id integer, p_emittente_sr_id bigint, p_classe_utenza_id integer);

              CREATE FUNCTION vendite.fn_ordine_riga_componenti_preview(
                  p_articolo_id         catalogo.articoli.id%TYPE,
