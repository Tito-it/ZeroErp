# IL GUARD DI STATO DELLE RIGHE DI LISTINO SOLLEVA IL PRIMO MOTIVO DELLA CHECK
#   Brief: brief-db-stati-documento-dal-vocabolario §6.27, giro 6f-bis (D-LIST
#   decisa (a) da Tid il 2026-11-15, solo DB; il trigger come verbo nel registro,
#   Tid lo stesso giorno).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   Il guard scriveva la regola nel suo corpo, e le superfici non potevano
#   leggerla (il §6.27 del brief, D-LIST).
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Il corpo chiama script.fn_check_listino_riga_scrivibile (20261115-53) e ne
#   solleva il primo motivo con script.fn_raise_primo_motivo_se_presente: la
#   regola sta in un posto solo (§12.5.2). Su UPDATE e DELETE risponde come
#   prima, stessi codici e stessi valori; sull'INSERT, che il -55 monta, rifiuta
#   la riga nuova di una versione CHIUSA.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, INVOKER, nessun SET. Il COMMENT e' riscritto
#   al presente. Il rollback porta il corpo e il COMMENT di prima, letti dal
#   catalogo di dbdev il 2026-11-15 (il corpo del 20261115-51).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-54-update-trgfn-listini-righe-guard-stato-dalla-check-mctit.yaml

  - changeSet:
      id: 20261115-54-update-trgfn-listini-righe-guard-stato-dalla-check
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_righe_guard_stato: solleva il primo motivo di
        script.fn_check_listino_riga_scrivibile. Brief: brief-db-stati-documento-dal-vocabolario, giro 6f-bis.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le righe di listino secondo lo stato della versione (BEFORE
              --   INSERT, UPDATE e DELETE). La regola sta in
              --   script.fn_check_listino_riga_scrivibile, la stessa che dicono le
              --   superfici (la riga nuova in vendite.vw_listini_versioni_azioni, la
              --   riga che c'e' in vendite.vw_listini_righe_azioni): qui si solleva
              --   soltanto il primo motivo.
              BEGIN
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      script.fn_check_listino_riga_scrivibile(
                          CASE WHEN TG_OP = 'INSERT' THEN NEW.listino_versione_id ELSE OLD.listino_versione_id END,
                          CASE WHEN TG_OP = 'INSERT' THEN NULL ELSE OLD.id END,
                          TG_OP),
                      NULL,
                      CASE WHEN TG_OP = 'INSERT' THEN NEW.tx_id ELSE OLD.tx_id END,
                      jsonb_build_object('operazione', TG_OP, 'tabella', 'listini_righe'));

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato()
              IS 'Guard sulle righe di listino (BEFORE INSERT, UPDATE e DELETE, trg_listini_righe_a10_guard_stato_ins_upd_dlt): solleva il primo motivo di script.fn_check_listino_riga_scrivibile, la regola che dicono anche le superfici vendite.vw_listini_versioni_azioni (la riga nuova) e vendite.vw_listini_righe_azioni (la riga che c''e''). In bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni, passa tutto; in una versione CHIUSA niente, nemmeno una riga nuova (E_RIGA_LISTINO_VERSIONE_CHIUSA); fuori dalla bozza una riga nuova e'' una rettifica e passa, una riga che c''e'' passa finche'' il suo prezzo non e'' stato usato da un documento (E_RIGA_LISTINO_PROPAGATA). Per cambiare il prezzo di una riga propagata si fa una versione nuova del listino. E'' il verbo delle azioni AGGIUNGI_RIGA_LISTINO e MODIFICA_RIGA_LISTINO nel registro config.azioni_riga: le righe di listino si scrivono direttamente, e chi rifiuta e'' questo guard.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: protezione righe listino in base allo stato della versione padre.
              --   bozza (lo stato iniziale del vocabolario) → passa sempre
              --   ATTIVA → ammessa solo se la riga non e` propagata a valle
              --   CHIUSA → blocca sempre
              -- Perimetro: solo UPDATE e DELETE (INSERT su ATTIVA e` ammesso come rettifica).
              DECLARE
                  v_stato config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_iniziale config.stati_doc_listino_versioni.iniziale%TYPE;
                  v_propagata boolean;
              BEGIN
                  -- Recupera stato della versione padre
                  SELECT s.codice_interno, s.iniziale
                    INTO v_stato, v_iniziale
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = OLD.listino_versione_id;

                  -- In bozza: modifica libera
                  IF v_iniziale THEN
                      RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                  END IF;

                  -- CHIUSA: blocca sempre
                  IF v_stato = 'CHIUSA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          -- ⚠️ ARITA' (2026-08-18): il messaggio comincia con «Operazione %s
                          --   non ammessa: ...» e di segnaposto ne ha TRE; qui ne arrivavano
                          --   due. Mancava proprio il primo, l'operazione — che il trigger
                          --   aveva gia' in mano (TG_OP) e metteva perfino nel context.
                          TG_OP, OLD.id::text, v_stato
                      );
                  END IF;

                  -- ATTIVA: verifica propagazione. Una riga e' «propagata» se il suo prezzo
                  -- e' stato USATO: la cita una riga di commessa, un'attivita' fatturabile, o
                  -- una riga (o un componente) di preventivo, ordine, contratto, DDT, offerta
                  -- (D-4 di Tid, 2026-11-13, brief-db-provenienza-prezzo-segue-il-prezzo §8.5:
                  -- anche da una bozza). Ogni colonna listino_riga_id ha il suo indice parziale.
                  -- Per aggiungere nuove tabelle: UNION ALL qui sotto
                  SELECT EXISTS(
                      SELECT 1 FROM vendite.commesse_attivita
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.attivita_fatturabili
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.preventivi_righe
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.preventivi_righe_componenti
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.ordini_righe
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.ordini_righe_componenti
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.contratti_righe
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.contratti_righe_componenti
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.ddt_righe
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.ddt_righe_componenti
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.offerte_commerciali_eccezioni
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.offerte_commerciali_eccezioni_componenti
                       WHERE listino_riga_id = OLD.id
                  )
                  INTO v_propagata;

                  IF v_propagata THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_PROPAGATA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          OLD.id::text
                      );
                  END IF;

                  -- ATTIVA e non propagata: rettifica controllata ammessa
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato()
              IS 'Guard sulle righe di listino, BEFORE UPDATE e DELETE, secondo lo stato della versione (vocabolario config.stati_doc_listino_versioni): in bozza, lo stato iniziale, passa; CHIUSA rifiuta sempre (E_RIGA_LISTINO_VERSIONE_CHIUSA); ATTIVA passa solo se la riga non e'' propagata, cioe'' se il suo prezzo non e'' stato usato (E_RIGA_LISTINO_PROPAGATA). Propagata: la cita (listino_riga_id) una riga di commessa, un''attivita'' fatturabile, o una riga principale o un componente di preventivo, ordine, contratto, DDT od offerta, anche in bozza. Per cambiare il prezzo di una riga propagata si fa una versione nuova del listino.';
