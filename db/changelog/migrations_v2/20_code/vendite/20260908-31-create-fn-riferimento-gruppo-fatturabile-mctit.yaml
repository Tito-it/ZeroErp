# Dalla CHIAVE del documento al suo NUMERO — la gemella che mancava.
#   Richiesta BE del 2026-09-08 · brief-db-uscita-documento-dal-giro §6.2.
#
# ── ⛔ IL DIFETTO: L'OPERATORE LEGGE UN UUID ─────────────────────
#   Sulla scheda Critiche il documento di una segnalazione si legge cosi':
#       ORDINE_VENDITA:01a06ce4-35a6-721a-9cd8-9da48bf77626
#   mentre la cosa che una persona riconosce e' `ORD0036004`. La `gruppo_key`
#   e' la chiave che serve al PULSANTE — `fn_escludi_documento_da_giro` la
#   vuole — non all'occhio.
#
# ── ⭐ IL PEZZO DIFFICILE NON VA SCRITTO: C'E' GIA' ──────────────
#   `vendite.fn_get_sorgente_documento_ref(sorgente_tipo_id, sorgente_uid)`
#   risolve il numero di un documento polimorfo leggendo
#   `config.sorgenti.label_selector`, ed e' in servizio da mesi sotto la
#   dashboard Competenza. Le sorgenti che diventano documenti fatturabili
#   dichiarano tutte il proprio selettore (letto dal seed, non misurato):
#   ORDINE_VENDITA/PREVENTIVO/CONTRATTO/DDT_VENDITA/RESO -> `numero`,
#   OFFERTA_COMMERCIALE/COMMESSA -> `codice`.
#
# ── ⛔ QUELLO CHE MANCAVA E' IL VERSO INVERSO, E NON SI IMPROVVISA ─
#   Da una `gruppo_key` non si torna a `(sorgente_tipo_id, sorgente_uid)` senza
#   spacchettarla. E la doc di `fn_build_gruppo_fatturabile_key` vieta
#   esattamente questa mossa nel verso gemello: «non derivarla da
#   `segment_key`: i prefissi sono una convenzione di leggibilita', non un
#   contratto — ricavarne il gruppo con `split_part` creerebbe un accoppiamento
#   a una regola di formattazione che nessuno si e' impegnato a mantenere».
#   L'argomento vale identico al contrario.
#   ⇒ Lo split diventa una funzione DICHIARATA, gemella di quella che
#   costruisce, e le due si leggono insieme. ⭐ Il presidio non e' l'occhio:
#   e' un pgTAP di ANDATA E RITORNO — `split(build(x)) = x` sulle due forme.
#
# ── ⛔ E NON SI RISALE A `commesse_attivita` ─────────────────────
#   Sembra la via ovvia: cercare la riga di commessa la cui chiave combacia.
#   ⚠️ Ma la `gruppo_key` scritta su una segnalazione e' un FATTO STORICO, e
#   quel lavoro puo' essere gia' fatturato, annullato o uscito dal giro. La
#   colonna si svuoterebbe PROPRIO DOPO — e la scheda Critiche si legge dopo.
#   ⭐ Spacchettare la chiave dipende solo dal DOCUMENTO, che resta.
#   E' la stessa ragione gia' scritta dentro `fn_list_lotto_segnalazioni` per
#   `documento_display`: «si legge dallo snapshot, non da un join ad
#   anagrafiche — sparirebbe per una ragione che col log non c'entra».
#
# ── ⚠️ NESSUNA DELLE DUE SOLLEVA MAI, ED E' UNA SCELTA ───────────
#   Le chiama una LISTA. Una chiave storta deve produrre una cella col ripiego,
#   non una lista rotta — la stessa regola che `fn_get_sorgente_documento_ref`
#   ha gia' scritta in testa: «i parametri mancanti sono il caso NORMALE di
#   questa funzione; un errore qui trasformerebbe una riga legittima in una
#   lista rotta».
#   ⇒ Chiave irriconoscibile ⇒ tre NULL dallo split, e il riferimento ripiega
#   sulla chiave grezza: l'operatore rilegge l'uuid, che e' esattamente cio'
#   che vedeva prima. Un peggioramento impossibile.
#
# ── ⚠️ IL RIPIEGO A TRE LIVELLI E' UNA REGOLA, E VIVE GIA' ALTROVE ─
#   `vw_dash_competenza_gruppi.riferimento` fa gia'
#   `COALESCE(documento_numero, commessa_codice, gruppo_key)`. Qui si scrive la
#   stessa scala.
#   ⛔ E la vista NON viene cambiata per chiamare questa funzione, ed e' una
#   scelta con un costo dichiarato: la' il LATERAL su
#   `fn_get_sorgente_documento_ref` serve comunque, perche' da quello esce
#   anche `documento_id` — passare dalla chiave vorrebbe dire risolvere DUE
#   volte per riga su una vista di dashboard, e riprodurre il corpo di una
#   vista grande (con la sua `security_invoker`, che si azzera a ogni
#   `CREATE OR REPLACE`) per spostare una riga.
#   ⇒ La seconda scrittura resta, e si PRESIDIA invece di nasconderla: un
#   pgTAP chiede che le due diano la STESSA stringa sulla stessa chiave.
#   ⚠️ E' un ripiego dichiarato, non un pareggio: il presidio prova che oggi
#   coincidono, non che non possano divergere.
#
# Verifica: db/pgtap/vendite/test-riferimento-gruppo-fatturabile-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-31-create-fn-riferimento-gruppo-fatturabile-mctit.yaml

  - changeSet:
      id: 20260908-31-create-fn-riferimento-gruppo-fatturabile
      author: mctit
      failOnError: true
      comment: >
        vendite.fn_split_gruppo_fatturabile_key (la gemella dichiarata di
        fn_build_gruppo_fatturabile_key) e vendite.fn_riferimento_gruppo_fatturabile
        (dalla chiave al numero del documento, col ripiego a tre livelli).
        Servono alla scheda Critiche, dove il documento di una segnalazione si
        legge oggi come uuid. Nessuna delle due solleva: le chiama una lista.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_get_sorgente_documento_ref'
            - columnExists:
                { schemaName: config, tableName: sorgenti, columnName: codice_interno }
            - columnExists:
                { schemaName: vendite, tableName: commesse_attivita, columnName: sorgente_uid }
            - columnExists:
                { schemaName: vendite, tableName: commesse, columnName: codice }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_split_gruppo_fatturabile_key(
                  -- ⚠️ `text` esplicito e non ancorato, ed e' motivato: la chiave
                  --    di gruppo non e' la colonna di una tabella, e' COSTRUITA da
                  --    vendite.fn_build_gruppo_fatturabile_key. Tre tabelle la
                  --    ospitano (perimetro, esiti, log): ancorarla a una sola
                  --    direbbe che quella e' la sua sede, e non lo e'.
                  p_gruppo_key text)
              RETURNS TABLE (
                  sorgente_tipo_id vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  sorgente_uid     vendite.commesse_attivita.sorgente_uid%TYPE,
                  commessa_id      vendite.commesse.id%TYPE)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: il verso INVERSO di vendite.fn_build_gruppo_fatturabile_key.
              --        Da '<codice_interno>:<uid>' torna la coppia sorgente; da
              --        'MAN:<commessa_id>' torna la commessa.
              -- ⛔ Le due funzioni sono GEMELLE e si leggono insieme: il prefisso
              --        'MAN' e la forma della chiave sono decisi la'. Il presidio
              --        e' un pgTAP di andata e ritorno, non l'occhio.
              -- ⚠️ NON SOLLEVA MAI: la chiama una lista, e una chiave storta deve
              --        produrre un ripiego, non una lista rotta. Una riga sempre,
              --        con tre NULL quando non riconosce niente.
              DECLARE
                  v_key    text := btrim(COALESCE(p_gruppo_key, ''));
                  v_sep    integer;
                  v_prefix text;
                  v_resto  text;
              BEGIN
                  -- Una riga SEMPRE: i tre OUT partono a NULL e si valorizzano
                  -- solo se c'e' qualcosa da dire. Stessa forma della sorella
                  -- vendite.fn_get_sorgente_documento_ref.
                  sorgente_tipo_id := NULL;
                  sorgente_uid     := NULL;
                  commessa_id      := NULL;

                  v_sep := strpos(v_key, ':');
                  IF v_key = '' OR v_sep < 2 THEN
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  v_prefix := left(v_key, v_sep - 1);
                  -- ⚠️ `substr` e non `split_part`: l'uid e' un uuid e i due punti
                  --    non ce li ha, ma una chiave malformata con un secondo ':'
                  --    verrebbe TRONCATA in silenzio, e un troncamento silenzioso
                  --    e' peggio di un ripiego dichiarato.
                  v_resto  := substr(v_key, v_sep + 1);

                  IF v_resto = '' THEN
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  -- ── FORMA 1: riga sourceless -> 'MAN:<commessa_id>' ──
                  -- ⛔ Il prefisso e' un letterale deciso da
                  --    fn_build_gruppo_fatturabile_key: qui si RILEGGE, non si
                  --    inventa. Se cambia la', questa smette di riconoscere la
                  --    forma e il pgTAP di andata e ritorno diventa rosso.
                  IF v_prefix = 'MAN' THEN
                      -- Solo cifre: un cast su altro solleverebbe, e questa
                      -- funzione ha promesso di non farlo.
                      IF v_resto ~ '^[0-9]+$' THEN
                          commessa_id := v_resto::bigint;
                      END IF;
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  -- ── FORMA 2: riga con documento -> '<codice_interno>:<uid>' ──
                  -- ⛔ L'aggancio e' su `codice_interno` (immutabile), mai su
                  --    `codice` — linee-guida-sql §6c/§6d: al primo rename fatto
                  --    dall'utente la risoluzione smetterebbe in silenzio.
                  -- Nessun filtro su `attivo`: un documento nato da una sorgente
                  -- poi disattivata resta quel documento, e la segnalazione che
                  -- lo nomina va letta comunque.
                  SELECT s.id
                    INTO sorgente_tipo_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = v_prefix
                   LIMIT 1;

                  IF sorgente_tipo_id IS NOT NULL THEN
                      sorgente_uid := v_resto;
                  END IF;

                  RETURN NEXT;
                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_split_gruppo_fatturabile_key(text)
              IS 'Verso INVERSO di vendite.fn_build_gruppo_fatturabile_key: da una chiave di '
                 'gruppo fatturabile torna la coppia sorgente (''<codice_interno>:<uid>'') '
                 'oppure la commessa (''MAN:<commessa_id>''). ⭐ Esiste perche'' chi legge una '
                 'SEGNALAZIONE ha in mano solo la chiave, e per mostrare il numero del '
                 'documento deve tornare alla sorgente. ⛔ Le due funzioni sono GEMELLE e si '
                 'leggono insieme: il prefisso ''MAN'' e la forma della chiave sono decisi '
                 'nella funzione che costruisce, qui si rileggono. Il presidio non e'' '
                 'l''occhio ma un pgTAP di ANDATA E RITORNO — split(build(x)) = x sulle due '
                 'forme. ⚠️ NON SOLLEVA MAI, e non e'' pigrizia: la chiama una lista, e una '
                 'chiave storta deve produrre un ripiego e non una lista rotta. Torna sempre '
                 'UNA riga, con tre NULL quando non riconosce la forma. ⚠️ `substr` e non '
                 '`split_part` sul resto: una chiave malformata con un secondo '':'' verrebbe '
                 'troncata in silenzio. ⛔ L''aggancio della sorgente e'' su codice_interno, '
                 'mai su codice (linee-guida-sql §6c/§6d). ⚠️ Non risale a commesse_attivita '
                 'di proposito: la chiave su una segnalazione e'' un fatto STORICO, e quel '
                 'lavoro puo'' essere gia'' fatturato o uscito dal giro — la risoluzione si '
                 'svuoterebbe proprio dopo. STABLE, SECURITY INVOKER. '
                 'Brief: brief-db-uscita-documento-dal-giro §6.2.';

              CREATE OR REPLACE FUNCTION vendite.fn_riferimento_gruppo_fatturabile(
                  p_gruppo_key text)
              RETURNS text
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: il RIFERIMENTO leggibile di un gruppo fatturabile — cioe'
              --        cio' che una persona riconosce al posto della chiave.
              --        'ORDINE_VENDITA:01a06ce4-…' -> 'ORD0036004'.
              -- Ritorna: il numero del documento; se non c'e', il codice della
              --        commessa; se non c'e' nemmeno quello, la CHIAVE GREZZA.
              -- ⚠️ NON SOLLEVA MAI: la chiama una lista.
              DECLARE
                  v_key    text := NULLIF(btrim(COALESCE(p_gruppo_key, '')), '');
                  v_src    record;
                  v_numero text;
                  v_codice vendite.commesse.codice%TYPE;
              BEGIN
                  -- ⚠️ NULL entra e NULL esce: sulla scheda Critiche una chiave
                  --    assente vuol dire «la segnalazione e' del GIRO», e li' non
                  --    c'e' nessun documento da nominare. Inventare un'etichetta
                  --    direbbe una cosa falsa.
                  IF v_key IS NULL THEN
                      RETURN NULL;
                  END IF;

                  SELECT * INTO v_src
                    FROM vendite.fn_split_gruppo_fatturabile_key(v_key);

                  -- Il numero del documento, dalla sede unica della risoluzione
                  -- polimorfa. Non risolve niente da se': legge il
                  -- `label_selector` che la sorgente dichiara a catalogo.
                  SELECT d.documento_numero
                    INTO v_numero
                    FROM vendite.fn_get_sorgente_documento_ref(
                             v_src.sorgente_tipo_id, v_src.sorgente_uid) d;

                  -- Il codice della commessa serve alla forma sourceless
                  -- ('MAN:<commessa_id>'), dove un documento non c'e' per
                  -- progetto: li' il contenitore E' la commessa.
                  IF v_src.commessa_id IS NOT NULL THEN
                      SELECT c.codice INTO v_codice
                        FROM vendite.commesse c WHERE c.id = v_src.commessa_id;
                  END IF;

                  -- ⭐ IL RIPIEGO A TRE LIVELLI, e l'ultimo non e' una resa: la
                  --    chiave grezza e' esattamente cio' che l'operatore vedeva
                  --    prima di questa funzione. Peggiorare e' impossibile.
                  -- ⚠️ Stessa scala di vw_dash_competenza_gruppi.riferimento. La
                  --    vista non la chiama, per non risolvere due volte per riga
                  --    (le serve anche documento_id dallo stesso LATERAL): la
                  --    seconda scrittura e' DICHIARATA e presidiata da un pgTAP
                  --    che chiede alle due la stessa stringa.
                  RETURN COALESCE(
                      NULLIF(btrim(COALESCE(v_numero, '')), ''),
                      NULLIF(btrim(COALESCE(v_codice, '')), ''),
                      v_key);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_riferimento_gruppo_fatturabile(text)
              IS 'Il RIFERIMENTO leggibile di un gruppo fatturabile: cio'' che una persona '
                 'riconosce al posto della chiave — ''ORDINE_VENDITA:01a06ce4-…'' diventa '
                 '''ORD0036004''. ⭐ Nasce per la scheda Critiche del lotto, dove il documento '
                 'di una segnalazione si leggeva come uuid: la gruppo_key e'' la chiave che '
                 'serve al PULSANTE (fn_escludi_documento_da_giro la vuole), non all''occhio. '
                 'Compone vendite.fn_split_gruppo_fatturabile_key e '
                 'vendite.fn_get_sorgente_documento_ref, che risolve il numero leggendo il '
                 'label_selector dichiarato dalla sorgente a catalogo. ⭐ Ripiego a TRE '
                 'livelli: numero del documento, poi codice della commessa (la forma '
                 'sourceless ''MAN:<id>'', dove un documento non c''e'' per progetto), poi la '
                 'CHIAVE GREZZA — e l''ultimo non e'' una resa: e'' esattamente cio'' che si '
                 'vedeva prima, quindi peggiorare e'' impossibile. ⚠️ NULL entra e NULL esce: '
                 'una chiave assente vuol dire «la segnalazione e'' del GIRO», e li'' non c''e'' '
                 'nessun documento da nominare — inventare un''etichetta direbbe il falso. '
                 '⚠️ NON SOLLEVA MAI: la chiama una lista. ⚠️ Stessa scala di ripiego di '
                 'vw_dash_competenza_gruppi.riferimento, che NON la chiama per non risolvere '
                 'due volte per riga (le serve anche documento_id dallo stesso LATERAL): la '
                 'seconda scrittura e'' dichiarata e presidiata da un pgTAP che chiede alle '
                 'due la stessa stringa sulla stessa chiave. STABLE, SECURITY INVOKER. '
                 'Brief: brief-db-uscita-documento-dal-giro §6.2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Nell'ordine inverso: la seconda chiama la prima.
              DROP FUNCTION IF EXISTS vendite.fn_riferimento_gruppo_fatturabile(text);
              DROP FUNCTION IF EXISTS vendite.fn_split_gruppo_fatturabile_key(text);
