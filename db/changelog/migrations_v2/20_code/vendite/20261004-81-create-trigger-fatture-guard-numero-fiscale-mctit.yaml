# vendite.fatture: monta vendite.trgfn_fatture_guard_numero_fiscale (-80)
# nella fascia _a05_, BEFORE UPDATE OR DELETE, WHEN (OLD.numero IS NOT NULL).
#
#   · _a05_: «questa fattura non si tocca» parla per primo. Sull'UPDATE
#     viene prima dei guard _a10_ (data numerata, stato, congelamento…),
#     sulla DELETE prima dello storico _z90_;
#   · UPDATE senza OF: il trigger confronta OLD e NEW nella funzione, quindi
#     scatta anche se una colonna dell'identita' la riscrivesse un altro
#     trigger BEFORE (UPDATE OF guarda solo la lista del SET);
#   · WHEN su OLD.numero: la numerazione, che parte da NULL, non lo attraversa.
#
# Brief: brief-db-esclusioni-implicite (Q-4).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261004-81-create-trigger-fatture-guard-numero-fiscale-mctit.yaml

  - changeSet:
      id: 20261004-81-create-trigger-fatture-guard-numero-fiscale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fatture: trigger _a05_ BEFORE UPDATE OR DELETE, WHEN (OLD.numero IS NOT NULL), su
        vendite.trgfn_fatture_guard_numero_fiscale. Brief: brief-db-esclusioni-implicite (Q-4).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'trgfn_fatture_guard_numero_fiscale';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_trigger
                   WHERE tgrelid = 'vendite.fatture'::regclass
                     AND tgname = 'trg_fatture_a05_guard_numero_fiscale_upd_dlt'
                     AND NOT tgisinternal;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_fatture_a05_guard_numero_fiscale_upd_dlt
                BEFORE UPDATE OR DELETE ON vendite.fatture
                FOR EACH ROW
                WHEN (OLD.numero IS NOT NULL)
                EXECUTE FUNCTION vendite.trgfn_fatture_guard_numero_fiscale();

              COMMENT ON TRIGGER trg_fatture_a05_guard_numero_fiscale_upd_dlt ON vendite.fatture IS
                  'Una fattura numerata non si cancella e non cambia registro, anno, serie o numero. '
                  'Fascia _a05_: parla prima dei guard _a10_ e dello storico _z90_. UPDATE senza OF: '
                  'il confronto OLD/NEW sta nella funzione. WHEN su OLD.numero: la numerazione, che '
                  'parte da NULL, non lo attraversa. Brief: brief-db-esclusioni-implicite (Q-4).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_fatture_a05_guard_numero_fiscale_upd_dlt ON vendite.fatture;
