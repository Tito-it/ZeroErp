databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260130-08-update-fn-log-pipeline-lotto-esito-mctit.yaml

  - changeSet:
      id: 20260130-08-update-fn-log-pipeline-lotto-esito
      author: mctit
      comment: "Allinea log lotto con tipo_lotto e stato_operativo"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_log_pipeline_fase(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE,
                p_fase text,
                p_status character DEFAULT 'I',
                p_messaggio text DEFAULT NULL,
                p_meta jsonb DEFAULT '{}'::jsonb
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_operativo vendite.fatturazione_lotti.stato_operativo%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Registra una fase di pipeline sul log del lotto.
                --
                -- Regole:
                --   - status ammessi: I (info), W (warning), C (critical)
                --   - lotto_id obbligatorio
                -- =========================================================

                IF p_lotto_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_log_pipeline_fase', 'E_GENERICO',
                    jsonb_build_object('detail','lotto_id obbligatorio'),
                    NULL::uuid, 'lotto_id obbligatorio'
                  );
                END IF;

                IF p_status IS NULL OR p_status NOT IN ('I','W','C') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_log_pipeline_fase', 'E_GENERICO',
                    jsonb_build_object('detail','status non valido', 'status', p_status),
                    NULL::uuid, 
                    concat('status non valido', ' status:', p_status)
                  );
                END IF;

                SELECT l.tipo_lotto, l.stato_operativo
                  INTO v_tipo_lotto, v_stato_operativo
                  FROM vendite.fatturazione_lotti l
                 WHERE l.id = p_lotto_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_log_pipeline_fase', 'E_GENERICO',
                    jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id),
                    NULL::uuid, 
                    concat('Lotto non trovato', ' lotto_id:', p_lotto_id)
                  );
                END IF;

                INSERT INTO vendite.fatturazione_lotti_log (
                  lotto_id,
                  data_ora,
                  messaggio,
                  status,
                  disabilitato,
                  fase,
                  stato_doc_fiscale_id,
                  tipo_lotto,
                  stato_operativo,
                  meta,
                  data_insert,
                  user_insert,
                  data_update,
                  user_update
                )
                VALUES (
                  p_lotto_id,
                  now(),
                  COALESCE(p_messaggio, p_fase, 'pipeline'),
                  p_status,
                  false,
                  p_fase,
                  p_stato_doc_fiscale_id,
                  v_tipo_lotto,
                  v_stato_operativo,
                  COALESCE(p_meta, '{}'::jsonb),
                  now(),
                  current_user,
                  now(),
                  current_user
                );
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_log_pipeline_fase(
                vendite.fatturazione_lotti.id%TYPE,
                config.stati_doc_fiscale.id%TYPE,
                text,
                character,
                text,
                jsonb
              ) IS 'Inserisce un log di fase per la pipeline del lotto.';

              CREATE OR REPLACE FUNCTION vendite.fn_log_lotto_esito_fatture(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_has_critical boolean;
                v_has_warning boolean;
                v_status character;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Registra un log di esito lotto dedotto dai log fatture.
                --
                -- Regole:
                --   - C ha priorita` su W
                --   - se nessun log attivo: status I
                -- =========================================================

                IF p_lotto_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_log_lotto_esito_fatture', 'E_GENERICO',
                    jsonb_build_object('detail','lotto_id obbligatorio'),
                    NULL::uuid, 'lotto_id obbligatorio'
                  );
                END IF;

                SELECT EXISTS (
                  SELECT 1
                  FROM vendite.fatturazione_lotti_fatture lf
                  JOIN vendite.fatture_log fl
                    ON fl.fattura_id = lf.fattura_id
                  WHERE lf.lotto_id = p_lotto_id
                    AND fl.disabilitato IS FALSE
                    AND fl.status = 'C'
                )
                INTO v_has_critical;

                SELECT EXISTS (
                  SELECT 1
                  FROM vendite.fatturazione_lotti_fatture lf
                  JOIN vendite.fatture_log fl
                    ON fl.fattura_id = lf.fattura_id
                  WHERE lf.lotto_id = p_lotto_id
                    AND fl.disabilitato IS FALSE
                    AND fl.status = 'W'
                )
                INTO v_has_warning;

                v_status := CASE
                              WHEN v_has_critical THEN 'C'
                              WHEN v_has_warning THEN 'W'
                              ELSE 'I'
                            END;

                PERFORM vendite.fn_log_pipeline_fase(
                  p_lotto_id,
                  NULL,
                  'Esito fatture lotto',
                  v_status,
                  NULL,
                  jsonb_build_object('source','fatture_log')
                );
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_log_lotto_esito_fatture(
                vendite.fatturazione_lotti.id%TYPE
              ) IS 'Registra log lotto con severita` dedotta dai log fatture.';
