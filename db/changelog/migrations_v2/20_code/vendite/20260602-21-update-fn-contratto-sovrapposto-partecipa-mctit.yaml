#
# Brief "Overlap contratti: escludere i DRAFT dal vincolo".
# Allinea fn_contratto_sovrapposto al nuovo predicato dell'EXCLUDE: il set dei
# conflitti usa partecipa_overlap_snapshot (= NOT abortito AND NOT draft) invece
# di NOT is_abortito_snapshot. Cosi' un contratto in BOZZA non e' un "incumbent"
# che blocca: il pre-check applicativo (BE) e il push restano coerenti con
# l'EXCLUDE, e si possono preparare bozze di successione.
#
# Fonte unica: sia l'EXCLUDE sia questa fn referenziano partecipa_overlap_snapshot.
# Firma e logica (finestra daterange, ORDER BY incumbent, LIMIT 1) invariate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260602-21-update-fn-contratto-sovrapposto-partecipa-mctit.yaml

  - changeSet:
      id: 20260602-21-update-fn-contratto-sovrapposto-partecipa
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        fn_contratto_sovrapposto: il set dei conflitti usa partecipa_overlap_snapshot
        (esclude abortiti e draft) invece di NOT is_abortito_snapshot.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: partecipa_overlap_snapshot
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_contratto_sovrapposto(
                  -- billing_account_id / istanza_utility_id dichiarati bigint (non
                  -- %TYPE=integer di contratti) per accettare via widening implicito
                  -- sia i chiamanti contratti (integer) sia offerte_commerciali
                  -- (bigint). utility_id resta integer (uguale in entrambe).
                  p_billing_account_id bigint,
                  p_istanza_utility_id bigint,
                  p_utility_id         vendite.contratti.utility_id%TYPE,
                  p_ambito             vendite.contratti.ambito%TYPE,
                  p_valido_dal         vendite.contratti.valido_dal%TYPE,
                  p_valido_al          vendite.contratti.valido_al%TYPE
              )
              RETURNS bigint
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo:
              --   Rilevamento read-only del contratto VINCOLANTE (partecipante
              --   all'overlap: non abortito e non in bozza) la cui finestra
              --   temporale si sovrappone alla quintupla del nuovo contratto.
              --   Cuore del meccanismo generico di successione (brief §3.2.1).
              --   NON solleva errori: ritorna id o NULL.
              --
              -- Parametri: i 5 attributi della chiave dell'EXCLUDE
              --   ex_contratti_no_overlap (billing_account, istanza_utility,
              --   utility, ambito) + finestra (valido_dal/valido_al).
              --
              -- Ritorno:
              --   id del contratto "incumbent" sovrapposto, oppure NULL.
              --   I contratti in BOZZA non contano (coerente con l'EXCLUDE che li
              --   esclude via partecipa_overlap_snapshot).
              --
              -- Daterange: COALESCE simmetrico identico alla colonna GENERATED
              --   contratti.validita (linee-guida-sql §7b) per garantire che &&
              --   confronti rappresentazioni interne identiche con valido_al NULL.
              DECLARE
                  v_finestra daterange;
                  v_id       vendite.contratti.id%TYPE;
              BEGIN
                  v_finestra := daterange(
                      COALESCE(p_valido_dal, '-infinity'::date),
                      COALESCE(p_valido_al,  'infinity'::date),
                      '[]'
                  );

                  SELECT c.id
                    INTO v_id
                    FROM vendite.contratti c
                   WHERE c.billing_account_id = p_billing_account_id
                     AND c.istanza_utility_id = p_istanza_utility_id
                     AND c.utility_id         = p_utility_id
                     AND c.ambito             = p_ambito
                     AND c.partecipa_overlap_snapshot
                     AND c.validita && v_finestra
                   ORDER BY
                       -- "incumbent": prima il contratto che contiene la data
                       -- di decorrenza del nuovo, poi il piu' recente.
                       (c.validita @> COALESCE(p_valido_dal, '-infinity'::date)) DESC,
                       c.valido_dal DESC
                   LIMIT 1;

                  RETURN v_id;  -- NULL se nessun overlap
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_contratto_sovrapposto(
                  bigint, bigint, integer, varchar, date, date
              ) IS
                  'Rilevamento read-only (STABLE) del contratto VINCOLANTE '
                  '(partecipa_overlap_snapshot: non abortito e non in bozza) '
                  'sovrapposto alla quintupla (billing_account, istanza_utility, '
                  'utility, ambito, periodo). Ritorna l''id dell''incumbent o NULL. '
                  'I DRAFT non contano. Meccanismo generico di successione. '
                  'Daterange con COALESCE simmetrico identico a contratti.validita. '
                  'rev 2026-06-02.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Rollback logico: ripristinare 20260531-02 (predicato NOT is_abortito_snapshot).
              SELECT 'rollback gestito ripristinando 20260531-02' AS note;
