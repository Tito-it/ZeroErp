# ------------------------------------------------------------
# vendite.trgfn_event_log_append_only: la porta zeroerp.maintenance_allow_delete_logs
#   passa da script.fn_porta_manutenzione_aperta (20261117-06).
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.5, §16.9)
#
# Che cosa cambia:
#   - la porta si apre solo per la sessione del migratore;
#   - la retention si guarda PRIMA della porta: una riga scaduta passa senza
#     porta (com'era), e il diario registra solo le righe vive cancellate.
#     Il risultato per chi cancella e' lo stesso.
#   - «accesa» e' on, true o 1, come prima.
# Corpo vivo letto da pg_get_functiondef su dbdev il 2026-11-18. Attributi vivi:
#   INVOKER, VOLATILE, nessun SET, owner zeroerp_owner. Il COMMENT vivo porta
#   una data di storia: si riscrive al presente (linee-guida-sql §5d).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261117-09-update-trgfn-event-log-append-only-porta-manutenzione-mctit.yaml

  - changeSet:
      id: 20261117-09-update-trgfn-event-log-append-only-porta-manutenzione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_event_log_append_only: la porta di manutenzione passa da
        script.fn_porta_manutenzione_aperta, dopo la retention. Brief:
        brief-db-seed-primo-impianto-non-si-riscrive.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('vendite.trgfn_event_log_append_only()')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('script.fn_porta_manutenzione_aperta(text,regclass,text,text)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_event_log_append_only()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Tenere vendite.event_log append-only, distinguendo pero'
                  --   fra ALTERARE LA STORIA e RITIRARE CIO' CHE E' SCADUTO.
                  --
                  -- Regole:
                  --   UPDATE                         -> sempre vietato
                  --   DELETE di riga scaduta         -> ammesso (retention)
                  --   DELETE con porta di manutenzione -> ammesso (parita' con
                  --                                     vendite.trgfn_logs_guard_delete)
                  --   DELETE di riga viva            -> vietato
                  --
                  -- ⭐ Il criterio della retention non e' CHI cancella ma COSA:
                  --   cosi' dbops.fn_purge_cleanup_expired funziona com'e',
                  --   senza propagare GUC ne' riconoscere ruoli.
                  --
                  -- ⭐ Il veto sull'UPDATE e' cio' che rende `cleanup_at`
                  --   immutabile: nessuno puo' anticipare la scadenza di una
                  --   riga scomoda.
                  -- =========================================================

                  IF TG_OP = 'UPDATE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          TG_TABLE_SCHEMA::text,
                          'trgfn_event_log_append_only',
                          'E_UPDATE_NOT_ALLOWED',
                          jsonb_build_object(
                              'detail', 'Registro append-only: la storia non si modifica',
                              'table',  TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'id',     OLD.id
                          ),
                          NULL::uuid,
                          TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          OLD.id::text
                      );
                  END IF;

                  -- Da qui in giu' e' un DELETE.

                  -- 1. Retention: la riga ha passato la sua scadenza.
                  --    ⚠️ `cleanup_at` NULL = riga senza scadenza (nessuna
                  --    regola CLEANUP_AT corrispondeva quando e' nata): non si
                  --    cancella. In dubbio si conserva.
                  IF OLD.cleanup_at IS NOT NULL AND OLD.cleanup_at <= now() THEN
                      RETURN OLD;
                  END IF;

                  -- 2. Manutenzione straordinaria: stessa porta dei log gemelli,
                  --    aperta solo per la sessione del migratore, con la riga
                  --    nel diario.
                  IF script.fn_porta_manutenzione_aperta(
                         'zeroerp.maintenance_allow_delete_logs', TG_RELID, TG_OP, OLD.id::text) THEN
                      RETURN OLD;
                  END IF;

                  -- 3. Tutto il resto e' storia, e la storia non si cancella.
                  PERFORM script.fn_log_and_raise_error(
                      TG_TABLE_SCHEMA::text,
                      'trgfn_event_log_append_only',
                      'E_DELETE_NOT_ALLOWED',
                      jsonb_build_object(
                          'detail',     'Registro append-only: riga non scaduta',
                          'table',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          'id',         OLD.id,
                          'cleanup_at', OLD.cleanup_at
                      ),
                      NULL::uuid,
                      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      OLD.id::text
                  );

                  RETURN OLD;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_event_log_append_only() IS
                  'Tiene vendite.event_log append-only distinguendo fra ALTERARE LA STORIA e RITIRARE CIO'' CHE E'' SCADUTO. UPDATE sempre vietato (E_UPDATE_NOT_ALLOWED); DELETE ammesso su una riga con cleanup_at <= now() (la retention) o dalla porta di manutenzione zeroerp.maintenance_allow_delete_logs, che apre solo per la sessione del migratore (script.fn_porta_manutenzione_aperta) e lascia la riga in dbops.porte_manutenzione_passaggi; ogni altro DELETE e'' E_DELETE_NOT_ALLOWED. ⭐ Il criterio della retention non e'' CHI cancella ma COSA: cosi'' dbops.fn_purge_cleanup_expired funziona com''e'', senza propagare GUC ne'' riconoscere ruoli. ⭐ Il veto sull''UPDATE rende immutabile cleanup_at: nessuno puo'' anticipare la scadenza di una riga scomoda. cleanup_at NULL = la riga non scade.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_event_log_append_only()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_allow_logs text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Tenere vendite.event_log append-only, distinguendo pero'
                  --   fra ALTERARE LA STORIA e RITIRARE CIO' CHE E' SCADUTO.
                  --
                  -- Regole:
                  --   UPDATE                      -> sempre vietato
                  --   DELETE con GUC manutenzione -> ammesso (parita' con
                  --                                  script.trgfn_logs_guard_delete)
                  --   DELETE di riga scaduta      -> ammesso (retention)
                  --   DELETE di riga viva         -> vietato
                  --
                  -- ⭐ Il criterio del terzo ramo non e' CHI cancella ma COSA:
                  --   cosi' dbops.fn_purge_cleanup_expired funziona com'e',
                  --   senza propagare GUC ne' riconoscere ruoli, e senza
                  --   toccare una funzione condivisa di dbops.
                  --
                  -- ⭐ Il veto sull'UPDATE e' cio' che rende `cleanup_at`
                  --   immutabile: nessuno puo' anticipare la scadenza di una
                  --   riga scomoda.
                  -- =========================================================

                  IF TG_OP = 'UPDATE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          TG_TABLE_SCHEMA::text,
                          'trgfn_event_log_append_only',
                          'E_UPDATE_NOT_ALLOWED',
                          jsonb_build_object(
                              'detail', 'Registro append-only: la storia non si modifica',
                              'table',  TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'id',     OLD.id
                          ),
                          NULL::uuid,
                          TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          OLD.id::text
                      );
                  END IF;

                  -- Da qui in giu' e' un DELETE.

                  -- 1. Manutenzione straordinaria: stessa leva dei log gemelli.
                  v_allow_logs := current_setting('zeroerp.maintenance_allow_delete_logs', true);

                  IF COALESCE(lower(v_allow_logs), 'off') IN ('on', 'true', '1') THEN
                      RETURN OLD;
                  END IF;

                  -- 2. Retention: la riga ha passato la sua scadenza.
                  --    ⚠️ `cleanup_at` NULL = riga senza scadenza (nessuna
                  --    regola CLEANUP_AT corrispondeva quando e' nata): non si
                  --    cancella. In dubbio si conserva.
                  IF OLD.cleanup_at IS NOT NULL AND OLD.cleanup_at <= now() THEN
                      RETURN OLD;
                  END IF;

                  -- 3. Tutto il resto e' storia, e la storia non si cancella.
                  PERFORM script.fn_log_and_raise_error(
                      TG_TABLE_SCHEMA::text,
                      'trgfn_event_log_append_only',
                      'E_DELETE_NOT_ALLOWED',
                      jsonb_build_object(
                          'detail',     'Registro append-only: riga non scaduta',
                          'table',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          'id',         OLD.id,
                          'cleanup_at', OLD.cleanup_at
                      ),
                      NULL::uuid,
                      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      OLD.id::text
                  );

                  RETURN OLD;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_event_log_append_only() IS
                  'Tiene vendite.event_log append-only distinguendo fra ALTERARE LA STORIA e RITIRARE CIO'' CHE E'' SCADUTO. UPDATE sempre vietato (E_UPDATE_NOT_ALLOWED); DELETE ammesso solo con la GUC zeroerp.maintenance_allow_delete_logs (parita'' con script.trgfn_logs_guard_delete dei log gemelli) o su riga con cleanup_at <= now(). ⭐ Il criterio del secondo ramo non e'' CHI cancella ma COSA: cosi'' dbops.fn_purge_cleanup_expired funziona com''e'', senza propagare GUC ne'' riconoscere ruoli. ⭐ Ed e'' il veto sull''UPDATE a rendere immutabile cleanup_at: nessuno puo'' anticipare la scadenza di una riga scomoda. ⚠️ Prima del 2026-08-22 era un RAISE EXCEPTION nudo, senza codice registrato, e vietava anche il DELETE della retention: con cleanup_at il job settimanale avrebbe iniziato a fallire.';
