databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260203-01-create-fn-close-giornaliero-lotto-mctit.yaml

  - changeSet:
      id: 20260203-01-create-fn-close-giornaliero-lotto
      author: mctit
      comment: "Chiude lotto giornaliero e allinea stato documentale fatture collegate"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_close_giornaliero_lotto(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_inviata_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE
              )
              RETURNS TABLE(updated_lotti integer, updated_fatture integer)
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_updated_lotti integer := 0;
                v_updated_fatture integer := 0;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Chiudere un lotto giornaliero e portare le fatture
                --   collegate allo stato documentale INVIATA.
                --
                -- Regole:
                --   - parametri obbligatori
                --   - lotto deve esistere ed essere di tipo GIORNALIERO
                --   - stato_operativo del lotto -> CHIUSO
                --   - stato_doc_fiscale su lotto e fatture -> valore passato
                -- =========================================================

                IF p_lotto_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','p_lotto_id obbligatorio'),
                    NULL::uuid,
                    'p_lotto_id non puo'' essere NULL'
                  );
                END IF;

                IF p_inviata_stato_doc_fiscale_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','p_inviata_stato_doc_fiscale_id obbligatorio'),
                    NULL::uuid,
                    'p_inviata_stato_doc_fiscale_id non puo'' essere NULL'
                  );
                END IF;

                SELECT fl.tipo_lotto
                  INTO v_tipo_lotto
                  FROM vendite.fatturazione_lotti fl
                 WHERE fl.id = p_lotto_id;

                IF v_tipo_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','Lotto non trovato', 'lotto_id', p_lotto_id),
                    NULL::uuid,
                    concat('Lotto non trovato: ', p_lotto_id::text)
                  );
                END IF;

                IF v_tipo_lotto <> 'GIORNALIERO' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object(
                      'detail','Lotto non giornaliero',
                      'lotto_id', p_lotto_id,
                      'tipo_lotto', v_tipo_lotto
                    ),
                    NULL::uuid,
                    concat('Lotto ', p_lotto_id::text, ' non e'' di tipo GIORNALIERO')
                  );
                END IF;

                UPDATE vendite.fatturazione_lotti
                   SET stato_operativo = 'CHIUSO',
                       stato_doc_fiscale_id = p_inviata_stato_doc_fiscale_id,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_lotto_id;

                GET DIAGNOSTICS v_updated_lotti = ROW_COUNT;

                UPDATE vendite.fatture f
                   SET stato_doc_fiscale_id = p_inviata_stato_doc_fiscale_id,
                       data_update = now(),
                       user_update = current_user
                  FROM vendite.fatturazione_lotti_fatture lf
                 WHERE lf.lotto_id = p_lotto_id
                   AND lf.fattura_id = f.id;

                GET DIAGNOSTICS v_updated_fatture = ROW_COUNT;

                RETURN QUERY
                SELECT v_updated_lotti, v_updated_fatture;
              END;
              $$;

              COMMENT ON FUNCTION vendite.fn_close_giornaliero_lotto(
                vendite.fatturazione_lotti.id%TYPE,
                config.stati_doc_fiscale.id%TYPE
              ) IS 'Chiude un lotto GIORNALIERO e aggiorna lo stato documentale del lotto e delle fatture collegate.';
