# LE RIGHE DI RESO EFFETTIVE DAL BB: vendite.vw_resi_righe_effettive
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto M (decisione B di Tid, 2026-11-08: D29 con la
#   regola del 2).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   La vista riconosceva «la merce del reso e' rientrata» dal letterale
#   'CONFERMATO'. La regola ha ora la sua sede, il BB
#   script.vw_stati_doc_reso_merce_rientrata (20261109-06): la vista lo legge.
#   Con il vocabolario di oggi la popolazione e' la stessa (un solo stato
#   oltre la bozza non abortito, CONFERMATO); uno stato nuovo dopo la conferma
#   entra da solo.
#   Colonne invariate (CREATE OR REPLACE: ACL e dipendenti restano);
#   security_invoker ri-specificata.
#   Rollback: forward-only.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261109-08-update-vw-resi-righe-effettive-merce-rientrata-mctit.yaml

  - changeSet:
      id: 20261109-08-update-vw-resi-righe-effettive-merce-rientrata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_resi_righe_effettive: lo stato «merce rientrata» dal BB
        script.vw_stati_doc_reso_merce_rientrata, non dal letterale CONFERMATO.
        brief-db-sorgente-documento-e-riga §7.2 lotto M, giro M.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_resi_righe_effettive
              WITH (security_invoker = on) AS
              SELECT rr.id AS resi_riga_id,
                     rr.reso_id,
                     rr.ddt_riga_id,
                     rr.ordine_riga_id,
                     rr.tipo_reso_id,
                     tr.riapre_residuo,
                     rr.quantita
                FROM vendite.resi_righe rr
                JOIN vendite.resi r ON r.id = rr.reso_id
                JOIN script.vw_stati_doc_reso_merce_rientrata sr ON sr.id = r.stato_doc_reso_id
                JOIN config.tipi_reso tr ON tr.id = rr.tipo_reso_id
               WHERE sr.merce_rientrata AND rr.attivo IS TRUE;

              COMMENT ON VIEW vendite.vw_resi_righe_effettive IS
                  'Helper unico «merce tornata indietro» (brief-db-fatturazione-ddt-resi §3b, step 2): righe reso EFFETTIVE = reso in uno stato in cui la merce e'' rientrata (script.vw_stati_doc_reso_merce_rientrata: oltre la bozza, non abortito) + resi_righe.attivo, tutti i tipi. Espone le due chiavi di partita (ordine_riga_id nullable / ddt_riga_id) + riapre_residuo, cosi'' ogni consumatore applica il proprio filtro-tipo SOPRA. quantita = base. Fonte unica per fn_ordine_riga_qta_riconsegna, flip a RESO e contatore tenuti-fatturati. NON copre il guard over-return (trgfn_resi_righe_guard_quantita), che conta anche le bozze di proposito (prenotazione). security_invoker=on + RLS su resi. rev 2026-07-17; rev 2026-11-09 (brief-db-sorgente-documento-e-riga lotto M, D29): lo stato dal BB, non dal letterale CONFERMATO.';
