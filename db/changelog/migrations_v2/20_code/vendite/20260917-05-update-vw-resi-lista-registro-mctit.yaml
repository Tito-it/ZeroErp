# P-1 / Q-E — vendite.vw_resi_lista: + registro_codice, registro_descrizione
#   Brief: brief-db-distinta-ricerca-rate §4-bis.2 (decisione di Tid, 2026-09-17).
#
# -- LO STESSO BLOCCO SU TUTTE LE SORELLE CHE UN REGISTRO CE L'HANNO ---------
#   Il registro di numerazione (resi.registro_id, dal 20260831) arriva in coda
#   con la stessa forma appesa a vw_fatture_lista nello stesso giro
#   (20260917-02): fatture, ddt, ordini e resi lo espongono allo stesso modo,
#   cosi' chi scrive l'ottava copia non la copia da una vista senza.
#   ⛔ contratti, preventivi e offerte NON hanno registro_id: non lo avranno.
#   ⚠️ Nessun numero_documento: qui `numero` e' gia' il parlante (varchar).
#
# -- IL REGISTRO E' LEFT: un documento senza registro compare senza registro.
# -- CREATE OR REPLACE: colonne in ULTIMA posizione (si consuma per nome).
# -- security_invoker=on RI-SPECIFICATA, o PostgreSQL la azzera.
# -- Nessun consumatore oggi: il repository legge v.*, la colonna arriva; il
#    seed di lista la prende quando servira'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260917-05-update-vw-resi-lista-registro-mctit.yaml

  - changeSet:
      id: 20260917-05-update-vw-resi-lista-registro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_resi_lista: + registro_codice, registro_descrizione in coda (LEFT JOIN vendite.registri_fatturazione).
        security_invoker=on ri-specificata. Brief: brief-db-distinta-ricerca-rate,
        sezione 4-bis.2 (P-1, Q-E).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_resi_lista
            - tableExists:
                schemaName: vendite
                tableName: registri_fatturazione
            - columnExists:
                schemaName: vendite
                tableName: resi
                columnName: registro_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_resi_lista
              WITH (security_invoker=on) AS
               SELECT r.id,
                  r.uid,
                  r.numero,
                  r.anno,
                  r.data,
                  r.stato_doc_reso_id,
                  sr.codice_interno AS stato_codice_interno,
                  sr.descrizione AS stato_descrizione,
                  r.destinatario_soggetto_ruolo_id,
                  s_dest.id AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  r.billing_account_id,
                  ba.codice AS ba_codice,
                  r.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  r.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  r.valuta_id,
                  v_val.codice AS valuta_codice,
                  r.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  r.sorgente_uid,
                  d_src.id AS ddt_origine_id,
                  d_src.numero AS ddt_origine_numero,
                  r.data_insert,
                  r.user_insert,
                  r.data_update,
                  r.user_update,
                  sr.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  lin.frontiera_natura_doc_codice_interno,
                  lin.frontiera_tipo_codice_interno,
                  reg.codice AS registro_codice,
                  reg.descrizione AS registro_descrizione
                 FROM vendite.resi r
                   JOIN config.stati_doc_reso sr ON sr.id = r.stato_doc_reso_id
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON sr_dest.id = r.destinatario_soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s_dest ON s_dest.id = sr_dest.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = r.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = r.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = r.utility_id
                   LEFT JOIN config.valute v_val ON v_val.id = r.valuta_id
                   LEFT JOIN config.sorgenti src ON src.id = r.sorgente_tipo_id
                   LEFT JOIN vendite.ddt d_src ON d_src.uid = r.sorgente_uid
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT s.id
                         FROM config.sorgenti s
                        WHERE s.codice_interno::text = 'RESO_VENDITA'::text AND s.attivo IS TRUE)) AND lin.uid = r.id::text
                   LEFT JOIN vendite.registri_fatturazione reg ON reg.id = r.registro_id;

              COMMENT ON VIEW vendite.vw_resi_lista
              IS 'Lista/dettaglio resi vendita (mirror vw_ddt_lista). security_invoker=on + RLS su base; espone emittente_fiscale_id/_codice e emittente_ragione_sociale. ⭐ rev 2026-08-25 — LA SESTA SORELLA: fase + colonne di genealogia da vendite.vw_documento_lineage (pratica, frontiera, discendenti, is_transitato), nella stessa forma delle altre liste documento. `fase` non c''era: la vista aveva lo stato ma non la fase normalizzata, e il seed della colonna omonima la cerca con quel nome esatto — senza, la colonna sarebbe nata vuota e in silenzio. ⭐ SU UN RESO frontiera_codice E'' IL NUMERO DELLA NOTA DI CREDITO: con l''arco S (20260825-19) il reso smette di essere una foglia e la sua frontiera diventa la nota che lo accredita. La colonna «Transito» risponde percio'' a «questo reso e'' gia'' stato accreditato, e con quale documento» — che prima era una QUANTITA'' (gia_accreditato) in un drawer, non un documento in lista. ⚠️ Il join al lineage e'' LEFT come sulle sorelle: un reso senza genealogia compare senza genealogia, non sparisce. Consumo: ui.lista_definizione ''vendite.resi'' (id 9) + preset resi_default; il frontend e'' gia'' <ListaConfigurabile>, quindi le colonne arrivano dal seed. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da `config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql §6c vieta `codice_interno AS *_codice` perche'' il nome mentirebbe sulla sorgente — un consumatore che confronta contro un `*_codice` si aspetta la colonna MUTABILE. Il guardrail CI scripts/sql/check_naming_stato_codice.sql fallisce sul pattern. (2) arriva `frontiera_tipo_codice_interno`, il CODICE del tipo accanto al suo id: prima ogni consumatore se lo traduceva con lo stesso join a config.sorgenti — dieci copie scritte a mano nel backend, tutte fuori dalla portata del guardrail, che scansiona solo le viste. ⚠️ Il nome NON e'' `frontiera_tipo_codice`: quel valore e'' `config.sorgenti.codice_interno` e il FE lo usa per la chiave i18n e per instradare, cioe'' come LOGICA. Chiamarlo `*_codice` avrebbe spostato dieci mislabel nascosti dentro l''unico posto dove il guardrail li vede. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.2, Q-E): + registro_codice, registro_descrizione in coda, LEFT JOIN vendite.registri_fatturazione su registro_id (20260831). E'' lo stesso blocco appeso a vw_fatture_lista nello stesso giro: le sorelle che un registro ce l''hanno — fatture, ddt, ordini, resi — lo espongono allo stesso modo, cosi'' chi scrive l''ottava copia non la copia da una vista senza. ⛔ contratti, preventivi e offerte NON hanno registro_id e non avranno queste colonne: non e'' una dimenticanza. Nessun numero_documento qui: su questa vista `numero` e'' gia'' il numero parlante (varchar).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_resi_lista;
              CREATE VIEW vendite.vw_resi_lista
              WITH (security_invoker=on) AS
               SELECT r.id,
                  r.uid,
                  r.numero,
                  r.anno,
                  r.data,
                  r.stato_doc_reso_id,
                  sr.codice_interno AS stato_codice_interno,
                  sr.descrizione AS stato_descrizione,
                  r.destinatario_soggetto_ruolo_id,
                  s_dest.id AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  r.billing_account_id,
                  ba.codice AS ba_codice,
                  r.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  r.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  r.valuta_id,
                  v_val.codice AS valuta_codice,
                  r.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  r.sorgente_uid,
                  d_src.id AS ddt_origine_id,
                  d_src.numero AS ddt_origine_numero,
                  r.data_insert,
                  r.user_insert,
                  r.data_update,
                  r.user_update,
                  sr.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  lin.frontiera_natura_doc_codice_interno,
                  lin.frontiera_tipo_codice_interno
                 FROM vendite.resi r
                   JOIN config.stati_doc_reso sr ON sr.id = r.stato_doc_reso_id
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON sr_dest.id = r.destinatario_soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s_dest ON s_dest.id = sr_dest.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = r.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = r.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = r.utility_id
                   LEFT JOIN config.valute v_val ON v_val.id = r.valuta_id
                   LEFT JOIN config.sorgenti src ON src.id = r.sorgente_tipo_id
                   LEFT JOIN vendite.ddt d_src ON d_src.uid = r.sorgente_uid
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT s.id
                         FROM config.sorgenti s
                        WHERE s.codice_interno::text = 'RESO_VENDITA'::text AND s.attivo IS TRUE)) AND lin.uid = r.id::text;

              COMMENT ON VIEW vendite.vw_resi_lista
              IS 'Lista/dettaglio resi vendita (mirror vw_ddt_lista). security_invoker=on + RLS su base; espone emittente_fiscale_id/_codice e emittente_ragione_sociale. ⭐ rev 2026-08-25 — LA SESTA SORELLA: fase + colonne di genealogia da vendite.vw_documento_lineage (pratica, frontiera, discendenti, is_transitato), nella stessa forma delle altre liste documento. `fase` non c''era: la vista aveva lo stato ma non la fase normalizzata, e il seed della colonna omonima la cerca con quel nome esatto — senza, la colonna sarebbe nata vuota e in silenzio. ⭐ SU UN RESO frontiera_codice E'' IL NUMERO DELLA NOTA DI CREDITO: con l''arco S (20260825-19) il reso smette di essere una foglia e la sua frontiera diventa la nota che lo accredita. La colonna «Transito» risponde percio'' a «questo reso e'' gia'' stato accreditato, e con quale documento» — che prima era una QUANTITA'' (gia_accreditato) in un drawer, non un documento in lista. ⚠️ Il join al lineage e'' LEFT come sulle sorelle: un reso senza genealogia compare senza genealogia, non sparisce. Consumo: ui.lista_definizione ''vendite.resi'' (id 9) + preset resi_default; il frontend e'' gia'' <ListaConfigurabile>, quindi le colonne arrivano dal seed. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il