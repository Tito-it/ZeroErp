databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260121-22-update-trgfn-attivita-fatturabili-normalize-mctit.yaml

  - changeSet:
      id: 20260121-22-update-trgfn-attivita-fatturabili-normalize
      author: mctit
      # ⚠️ Era `true`: definisce vendite.trgfn_attivita_fatturabili_normalize, che un changeSet PIU' RECENTE
      #   ridefinisce. Rigirando riportava indietro quella revisione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      comment: "Allinea normalizzazione sorgente a sorgente_tipo_id (FK)"
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_normalize()
              RETURNS trigger
              LANGUAGE plpgsql AS $$
              BEGIN
                -- Normalizza competenza_mese al 1° del mese (YYYY-MM-01)
                IF NEW.competenza_mese IS NOT NULL THEN
                  NEW.competenza_mese := date_trunc('month', NEW.competenza_mese)::date;
                END IF;

                -- sorgente_tipo_id e' FK: non si normalizza stringa, si imposta default riga
                IF NEW.sorgente_tipo_id IS NOT NULL THEN
                  IF NEW.sorgente_riga IS NULL THEN
                    NEW.sorgente_riga := 0;
                  END IF;
                END IF;

                RETURN NEW;
              END$$;
              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_normalize()
                IS 'Se competenza_mese e'' valorizzato, normalizza al primo giorno del mese.';
