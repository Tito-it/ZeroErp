# Crea vendite.fn_contratto_sovrapposto: rilevamento read-only del
# contratto non abortito la cui finestra temporale si sovrappone alla
# quintupla (billing_account, istanza_utility, utility, ambito, periodo)
# di un nuovo contratto.
#
# Meccanismo GENERICO di dominio contratti (non specifico del push offerta):
# primo consumatore vendite.fn_push_offerta_a_contratto (20260531-04), ma
# riusabile da ogni percorso di creazione contratto e dal backend come
# pre-check per il preview FE (funzione STABLE, nessun side effect).
#
# Costruzione daterange: COALESCE simmetrico a '-infinity'/'infinity' con
# bound '[]', identica all'espressione della colonna GENERATED contratti.validita
# (linee-guida-sql §7b) -> l'operatore && confronta rappresentazioni interne
# identiche anche quando valido_al e' NULL (contratto perpetuo).
#
# Nota multi-overlap: un range candidato ampio puo' sovrapporre piu' contratti
# esistenti non mutuamente sovrapposti (l'EXCLUDE garantisce la non
# sovrapposizione TRA esistenti, non l'unicita' rispetto a un candidato
# arbitrario). La fn ritorna il contratto "incumbent" (quello la cui validita
# contiene la data di decorrenza del nuovo, poi il piu' recente), e LIMIT 1.
# Eventuali conflitti residui sono comunque intercettati dal backstop
# exclusion_violation nel consumatore.
#
# Riferimento: brief-db-offerta-push-successione-contratto-overlap.md §3.2.1
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260531-02-create-fn-contratto-sovrapposto-mctit.yaml

  - changeSet:
      id: 20260531-02-01-create-fn-contratto-sovrapposto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Crea vendite.fn_contratto_sovrapposto(billing_account, istanza_utility,
        utility, ambito, valido_dal, valido_al) RETURNS bigint. Read-only
        (STABLE). Ritorna l'id del contratto non abortito sovrapposto, o NULL.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: contratti
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: is_abortito_snapshot
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: validita
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_contratto_sovrapposto(
                  -- billing_account_id / istanza_utility_id dichiarati bigint (non
                  -- %TYPE=integer di contratti) per accettare via widening implicito
                  -- sia i chiamanti contratti (integer) sia offerte_commerciali
                  -- (bigint). utility_id resta integer (uguale in entrambe).
                  p_billing_account_id bigint,
                  p_istanza_utility_id bigint,
                  p_utility_id         vendite.contratti.utility_id%TYPE,
                  p_ambito             vendite.contratti.ambito%TYPE,
                  p_valido_dal         vendite.contratti.valido_dal%TYPE,
                  p_valido_al          vendite.contratti.valido_al%TYPE
              )
              RETURNS bigint
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo:
              --   Rilevamento read-only del contratto non abortito la cui
              --   finestra temporale si sovrappone alla quintupla del nuovo
              --   contratto. Cuore del meccanismo generico di successione
              --   (brief §3.2.1). NON solleva errori: ritorna id o NULL.
              --
              -- Parametri: i 5 attributi della chiave dell'EXCLUDE
              --   ex_contratti_no_overlap (billing_account, istanza_utility,
              --   utility, ambito) + finestra (valido_dal/valido_al).
              --
              -- Ritorno:
              --   id del contratto "incumbent" sovrapposto, oppure NULL.
              --
              -- Daterange: COALESCE simmetrico identico alla colonna GENERATED
              --   contratti.validita (linee-guida-sql §7b) per garantire che &&
              --   confronti rappresentazioni interne identiche con valido_al NULL.
              DECLARE
                  v_finestra daterange;
                  v_id       vendite.contratti.id%TYPE;
              BEGIN
                  v_finestra := daterange(
                      COALESCE(p_valido_dal, '-infinity'::date),
                      COALESCE(p_valido_al,  'infinity'::date),
                      '[]'
                  );

                  SELECT c.id
                    INTO v_id
                    FROM vendite.contratti c
                   WHERE c.billing_account_id = p_billing_account_id
                     AND c.istanza_utility_id = p_istanza_utility_id
                     AND c.utility_id         = p_utility_id
                     AND c.ambito             = p_ambito
                     AND NOT c.is_abortito_snapshot
                     AND c.validita && v_finestra
                   ORDER BY
                       -- "incumbent": prima il contratto che contiene la data
                       -- di decorrenza del nuovo, poi il piu' recente.
                       (c.validita @> COALESCE(p_valido_dal, '-infinity'::date)) DESC,
                       c.valido_dal DESC
                   LIMIT 1;

                  RETURN v_id;  -- NULL se nessun overlap
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_contratto_sovrapposto(
                  bigint, bigint, integer, varchar, date, date
              ) IS
                  'Rilevamento read-only (STABLE) del contratto non abortito '
                  'sovrapposto alla quintupla (billing_account, istanza_utility, '
                  'utility, ambito, periodo) di un nuovo contratto. Ritorna l''id '
                  'dell''incumbent o NULL. Meccanismo generico di successione '
                  '(brief 2026-05-31); riusabile come pre-check per preview FE. '
                  'Daterange con COALESCE simmetrico identico a contratti.validita.';
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_contratto_sovrapposto(
                  bigint, bigint, integer, varchar, date, date
              );
