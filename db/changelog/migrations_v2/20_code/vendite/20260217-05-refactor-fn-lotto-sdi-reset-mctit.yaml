databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260217-05-refactor-fn-lotto-sdi-reset-mctit.yaml

  - changeSet:
      id: 20260217-05-01-update-fn-prepare-sdi-payload
      author: mctit
      comment: "Refactor parametri %TYPE e contratto errori su preparazione SDI"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_prepare_sdi_payload(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_stato_sdi_codice_interno config.stati_sdi.codice_interno%TYPE DEFAULT 'DA_INVIARE'::character varying,
                p_force_new_tentativo boolean DEFAULT false
              )
               RETURNS TABLE(
                fattura_sdi_id vendite.fatture_sdi.id%TYPE,
                fattura_id vendite.fatture.id%TYPE,
                tentativo_num vendite.fatture_sdi.tentativo_num%TYPE,
                stato_sdi_id config.stati_sdi.id%TYPE,
                codice_documento text,
                numero_fattura vendite.fatture.numero%TYPE,
                data_fattura vendite.fatture.data%TYPE,
                billing_account_id anagrafiche.billing_account.id%TYPE,
                emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                valuta_id config.valute.id%TYPE,
                totale_a_pagare vendite.fatture.totale_a_pagare%TYPE
               )
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_sdi_id config.stati_sdi.id%TYPE;
                v_exists_lotto boolean := false;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Preparare il dataset SDI per un lotto.
                --   Se assente, crea il tentativo su vendite.fatture_sdi.
                --
                -- Regole:
                --   - lotto obbligatorio e valido
                --   - stato SDI risolto da codice_interno (default DA_INVIARE)
                --   - idempotenza: riusa tentativo aperto (data_invio IS NULL)
              
                -- Parametri:
                -- p_force_new_tentativo:
                -- `false` (default): comportamento consigliato. Se il tentativo aperto esiste, la funzione lo riusa.  
                --   Utile per rilanciare un processo interrotto senza creare duplicati.
                -- `true`: forza sempre un nuovo tentativo (`tentativo_num` incrementale), anche se ne esiste uno aperto.  
                --    Da usare solo quando si vuole esplicitamente una nuova estrazione (retry controllato / nuova revisione payload).
              
                -- =========================================================
              
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_prepare_sdi_payload', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','p_lotto_id obbligatorio')
                    ),
                    NULL::uuid,
                    'p_lotto_id obbligatorio e > 0'
                  );
                END IF;
              
                IF p_stato_sdi_codice_interno IS NULL OR btrim(p_stato_sdi_codice_interno) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_prepare_sdi_payload', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','p_stato_sdi_codice_interno obbligatorio')
                    ),
                    NULL::uuid,
                    'p_stato_sdi_codice_interno obbligatorio'
                  );
                END IF;
              
                SELECT EXISTS (
                  SELECT 1
                  FROM vendite.fatturazione_lotti fl
                  WHERE fl.id = p_lotto_id
                )
                INTO v_exists_lotto;
              
                IF NOT COALESCE(v_exists_lotto, false) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_prepare_sdi_payload', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id)
                    ),
                    NULL::uuid,
                    concat('lotto non trovato: ', p_lotto_id::text)
                  );
                END IF;
              
                SELECT s.id
                  INTO v_stato_sdi_id
                  FROM config.stati_sdi s
                 WHERE s.codice_interno = p_stato_sdi_codice_interno
                   AND s.attivo IS TRUE
                 ORDER BY s.ordine NULLS LAST, s.id
                 LIMIT 1;
              
                IF v_stato_sdi_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_prepare_sdi_payload', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','stato_sdi non trovato', 'codice_interno', p_stato_sdi_codice_interno)
                    ),
                    NULL::uuid,
                    concat('stato_sdi non trovato: ', p_stato_sdi_codice_interno)
                  );
                END IF;
              
                CREATE TEMP TABLE tmp_sdi_prepared (
                  fattura_sdi_id bigint,
                  fattura_id bigint,
                  tentativo_num smallint
                ) ON COMMIT DROP;
              
                IF COALESCE(p_force_new_tentativo, false) IS FALSE THEN
                  INSERT INTO tmp_sdi_prepared (fattura_sdi_id, fattura_id, tentativo_num)
                  SELECT
                    fs.id,
                    fs.fattura_id,
                    fs.tentativo_num
                  FROM vendite.fatturazione_lotti_fatture lf
                  JOIN LATERAL (
                    SELECT s.id, s.fattura_id, s.tentativo_num
                    FROM vendite.fatture_sdi s
                    WHERE s.fattura_id = lf.fattura_id
                      AND s.stato_sdi_id = v_stato_sdi_id
                      AND s.data_invio IS NULL
                    ORDER BY s.tentativo_num DESC, s.id DESC
                    LIMIT 1
                  ) fs ON TRUE
                  WHERE lf.lotto_id = p_lotto_id;
                END IF;
              
                WITH to_insert AS (
                  SELECT lf.fattura_id
                  FROM vendite.fatturazione_lotti_fatture lf
                  WHERE lf.lotto_id = p_lotto_id
                    AND NOT EXISTS (
                      SELECT 1
                      FROM tmp_sdi_prepared p
                      WHERE p.fattura_id = lf.fattura_id
                    )
                ),
                next_try AS (
                  SELECT
                    t.fattura_id,
                    COALESCE(MAX(fs.tentativo_num), 0)::smallint + 1 AS tentativo_num
                  FROM to_insert t
                  LEFT JOIN vendite.fatture_sdi fs
                    ON fs.fattura_id = t.fattura_id
                  GROUP BY t.fattura_id
                ),
                ins AS (
                  INSERT INTO vendite.fatture_sdi (
                    fattura_id,
                    tentativo_num,
                    stato_sdi_id,
                    data_invio,
                    data_ricezione,
                    identificativo_sdi,
                    nome_file,
                    messaggio_errore,
                    critical,
                    meta,
                    data_insert,
                    user_insert,
                    data_update,
                    user_update
                  )
                  SELECT
                    n.fattura_id,
                    n.tentativo_num,
                    v_stato_sdi_id,
                    NULL,
                    NULL,
                    NULL,
                    NULL,
                    NULL,
                    false,
                    '{}'::jsonb,
                    now(),
                    current_user,
                    now(),
                    current_user
                  FROM next_try n
                  RETURNING id, fattura_id, tentativo_num
                )
                INSERT INTO tmp_sdi_prepared (fattura_sdi_id, fattura_id, tentativo_num)
                SELECT i.id, i.fattura_id, i.tentativo_num
                FROM ins i;
              
                INSERT INTO vendite.fatture_sdi_eventi (
                  fattura_sdi_id,
                  stato_sdi_id,
                  data_evento,
                  codice_evento,
                  messaggio,
                  origine,
                  meta,
                  data_insert,
                  user_insert,
                  data_update,
                  user_update
                )
                SELECT
                  p.fattura_sdi_id,
                  v_stato_sdi_id,
                  now(),
                  'PREPARED',
                  'Tentativo SDI preparato dal lotto',
                  'SISTEMA',
                  jsonb_build_object('lotto_id', p_lotto_id),
                  now(),
                  current_user,
                  now(),
                  current_user
                FROM tmp_sdi_prepared p
                WHERE NOT EXISTS (
                  SELECT 1
                  FROM vendite.fatture_sdi_eventi e
                  WHERE e.fattura_sdi_id = p.fattura_sdi_id
                    AND e.codice_evento = 'PREPARED'
                );
              
                RETURN QUERY
                SELECT
                  p.fattura_sdi_id,
                  f.id AS fattura_id,
                  p.tentativo_num,
                  v_stato_sdi_id AS stato_sdi_id,
                  concat_ws('/',
                    f.anno::text,
                    NULLIF(f.serie, ''),
                    f.numero::text
                  ) AS codice_documento,
                  f.numero AS numero_fattura,
                  f.data AS data_fattura,
                  f.billing_account_id,
                  f.emittente_soggetto_ruolo_id,
                  f.valuta_id,
                  f.totale_a_pagare
                FROM tmp_sdi_prepared p
                JOIN vendite.fatture f
                  ON f.id = p.fattura_id
                ORDER BY f.id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_prepare_sdi_payload(bigint, character varying, boolean)
              IS 'Prepara i tentativi SDI delle fatture del lotto, con riuso tentativi aperti o forzatura nuovo tentativo.';

  - changeSet:
      id: 20260217-05-02-update-fn-close-giornaliero-lotto
      author: mctit
      comment: "Refactor parametri %TYPE e contratto errori su chiusura lotto giornaliero"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_close_giornaliero_lotto(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_inviata_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE
              )
               RETURNS TABLE(updated_lotti integer, updated_fatture integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_updated_lotti integer := 0;
                v_updated_fatture integer := 0;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Chiudere un lotto giornaliero e portare le fatture
                --   collegate allo stato documentale INVIATA.
                --
                -- Regole:
                --   - parametri obbligatori
                --   - lotto deve esistere ed essere di tipo GIORNALIERO
                --   - stato_operativo del lotto -> CHIUSO
                --   - stato_doc_fiscale su lotto e fatture -> valore passato
                -- =========================================================
              
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','p_lotto_id obbligatorio')
                    ),
                    NULL::uuid,
                    'p_lotto_id non puo'' essere NULL'
                  );
                END IF;
              
                IF p_inviata_stato_doc_fiscale_id IS NULL OR p_inviata_stato_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','p_inviata_stato_doc_fiscale_id obbligatorio')
                    ),
                    NULL::uuid,
                    'p_inviata_stato_doc_fiscale_id non puo'' essere NULL'
                  );
                END IF;
              
                SELECT fl.tipo_lotto
                  INTO v_tipo_lotto
                  FROM vendite.fatturazione_lotti fl
                 WHERE fl.id = p_lotto_id;
              
                IF v_tipo_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','Lotto non trovato', 'lotto_id', p_lotto_id)
                    ),
                    NULL::uuid,
                    concat('Lotto non trovato: ', p_lotto_id::text)
                  );
                END IF;
              
                IF v_tipo_lotto <> 'GIORNALIERO' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_close_giornaliero_lotto', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object(
                        'detail','Lotto non giornaliero',
                        'lotto_id', p_lotto_id,
                        'tipo_lotto', v_tipo_lotto
                      )
                    ),
                    NULL::uuid,
                    concat('Lotto ', p_lotto_id::text, ' non e'' di tipo GIORNALIERO')
                  );
                END IF;
              
                UPDATE vendite.fatturazione_lotti
                   SET stato_operativo = 'CHIUSO',
                       stato_doc_fiscale_id = p_inviata_stato_doc_fiscale_id,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_lotto_id;
              
                GET DIAGNOSTICS v_updated_lotti = ROW_COUNT;
              
                UPDATE vendite.fatture f
                   SET stato_doc_fiscale_id = p_inviata_stato_doc_fiscale_id,
                       data_update = now(),
                       user_update = current_user
                  FROM vendite.fatturazione_lotti_fatture lf
                 WHERE lf.lotto_id = p_lotto_id
                   AND lf.fattura_id = f.id;
              
                GET DIAGNOSTICS v_updated_fatture = ROW_COUNT;
              
                RETURN QUERY
                SELECT v_updated_lotti, v_updated_fatture;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_close_giornaliero_lotto(bigint, bigint)
              IS 'Chiude un lotto giornaliero e allinea allo stato target tutte le fatture collegate al lotto.';

  - changeSet:
      id: 20260217-05-03-update-fn-reset-lotto-draft
      author: mctit
      comment: "Refactor reset lotto draft con codice_interno e contratto errori"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_reset_lotto_draft(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE
              )
               RETURNS TABLE(updated_lotti integer, updated_attivita integer, deleted_fatture integer, deleted_righe integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_doc_fiscale_id vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                v_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE;
                v_draft_id config.stati_doc_fiscale.id%TYPE;
                v_annullata_id config.stati_doc_fiscale.id%TYPE;
                v_fatture_ids bigint[];
                v_bad_fatture integer := 0;
                v_updated_lotti integer := 0;
                v_updated_attivita integer := 0;
                v_deleted_fatture integer := 0;
                v_deleted_righe integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Rollback tecnico di un lotto MASSIVO in DRAFT:
                --   elimina fatture/righe generate e ripristina le righe
                --   di attivita_fatturabili.
                --
                -- Regole:
                --   - lotto deve esistere, tipo_lotto = MASSIVO
                --   - stato_doc_fiscale del lotto deve essere DRAFT
                --   - tutte le fatture del lotto devono essere DRAFT
                --   - lotto finale: stato_doc_fiscale = ANNULLATA,
                --     stato_operativo = CHIUSO, stato_lotto = COMPLETATO
                -- =========================================================
              
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','p_lotto_id obbligatorio')
                    ),
                    NULL::uuid,
                    'p_lotto_id non puo'' essere NULL o <= 0'
                  );
                END IF;
              
                SELECT fl.tipo_lotto,
                       fl.stato_doc_fiscale_id,
                       fl.lock_batch_id
                  INTO v_tipo_lotto, v_stato_doc_fiscale_id, v_lock_batch_id
                  FROM vendite.fatturazione_lotti fl
                 WHERE fl.id = p_lotto_id;
              
                IF v_tipo_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id)
                    ),
                    NULL::uuid,
                     concat('Lotto non trovato: ', p_lotto_id)
                  );
                END IF;
              
                IF v_tipo_lotto <> 'MASSIVO' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','tipo lotto non ammesso', 'tipo_lotto', v_tipo_lotto)
                    ),
                    NULL::uuid,
                    concat('Rollback consentito solo per lotti MASSIVO, tipo lotto: ', v_tipo_lotto)
                  );
                END IF;
              
                SELECT s.id
                  INTO v_draft_id
                  FROM config.stati_doc_fiscale s
                 WHERE s.codice_interno = 'DRAFT'
                   AND s.attivo IS TRUE
                 LIMIT 1;
              
                IF v_draft_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','stato DRAFT non configurato')
                    ),
                    NULL::uuid,
                    'Stato DRAFT non trovato in config.stati_doc_fiscale'
                  );
                END IF;
              
                SELECT s.id
                  INTO v_annullata_id
                  FROM config.stati_doc_fiscale s
                 WHERE s.codice_interno = 'ANNULLATA'
                   AND s.attivo IS TRUE
                 LIMIT 1;
              
                IF v_annullata_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','stato ANNULLATA non configurato')
                    ),
                    NULL::uuid,
                    'Stato ANNULLATA non trovato in config.stati_doc_fiscale'
                  );
                END IF;
              
                IF v_stato_doc_fiscale_id IS DISTINCT FROM v_draft_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object(
                        'detail','lotto non in DRAFT',
                        'stato_doc_fiscale_id', v_stato_doc_fiscale_id
                      )
                    ),
                    NULL::uuid,
                    concat('Rollback consentito solo se il lotto e'' in DRAFT, stato attuale: '
                    , v_stato_doc_fiscale_id)
                  );
                END IF;
              
                SELECT count(*)
                  INTO v_bad_fatture
                  FROM vendite.fatture f
                  JOIN vendite.fatturazione_lotti_fatture lf
                    ON lf.fattura_id = f.id
                 WHERE lf.lotto_id = p_lotto_id
                   AND f.stato_doc_fiscale_id IS DISTINCT FROM v_draft_id;
              
                IF v_bad_fatture > 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','fatture non DRAFT', 'count', v_bad_fatture)
                    ),
                    NULL::uuid,
                    concat('Rollback non consentito: esistono fatture non DRAFT, count: ', v_bad_fatture)
                  );
                END IF;
              
                SELECT array_agg(lf.fattura_id)
                  INTO v_fatture_ids
                  FROM vendite.fatturazione_lotti_fatture lf
                 WHERE lf.lotto_id = p_lotto_id;
              
                IF v_fatture_ids IS NULL THEN
                  v_fatture_ids := ARRAY[]::bigint[];
                END IF;
              
                SELECT c.deleted_fatture, c.deleted_righe, c.updated_attivita
                  INTO v_deleted_fatture, v_deleted_righe, v_updated_attivita
                  FROM vendite.fn_cleanup_fatture_by_ids(v_fatture_ids, v_lock_batch_id) AS c;
              
                -- Chiusura lotto annullato
                UPDATE vendite.fatturazione_lotti
                   SET stato_operativo = 'CHIUSO',
                       stato_doc_fiscale_id = v_annullata_id,
                       stato_lotto = 'COMPLETATO',
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_lotto_id;
                GET DIAGNOSTICS v_updated_lotti = ROW_COUNT;
              
                RETURN QUERY
                SELECT v_updated_lotti, v_updated_attivita, v_deleted_fatture, v_deleted_righe;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_reset_lotto_draft(bigint)
              IS 'Esegue il rollback tecnico di un lotto MASSIVO in DRAFT eliminando fatture generate e ripristinando le attivita.';

  - changeSet:
      id: 20260217-05-04-update-fn-reset-lotto-fattura-draft
      author: mctit
      comment: "Refactor reset singola fattura lotto draft con codice_interno e contratto errori"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_reset_lotto_fattura_draft(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_fattura_id vendite.fatture.id%TYPE
              )
               RETURNS TABLE(updated_attivita integer, deleted_fatture integer, deleted_righe integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_doc_fiscale_id vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                v_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE;
                v_draft_id config.stati_doc_fiscale.id%TYPE;
                v_is_linked boolean := false;
                v_updated_attivita integer := 0;
                v_deleted_fatture integer := 0;
                v_deleted_righe integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Reset tecnico di una singola fattura in lotto MASSIVO
                --   DRAFT, senza annullare il lotto.
                --
                -- Regole:
                --   - lotto deve esistere, tipo_lotto = MASSIVO
                --   - stato_doc_fiscale lotto = DRAFT
                --   - fattura deve appartenere al lotto ed essere DRAFT
                -- =========================================================
              
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object('detail','p_lotto_id obbligatorio')
                    ),
                    NULL::uuid,
                    'p_lotto_id non puo'' essere NULL o <= 0'
                  );
                END IF;
              
                IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object('detail','p_fattura_id obbligatorio')
                    ),
                    NULL::uuid,
                    'p_fattura_id non puo'' essere NULL o <= 0'
                  );
                END IF;
              
                SELECT fl.tipo_lotto,
                       fl.stato_doc_fiscale_id,
                       fl.lock_batch_id
                  INTO v_tipo_lotto, v_stato_doc_fiscale_id, v_lock_batch_id
                  FROM vendite.fatturazione_lotti fl
                 WHERE fl.id = p_lotto_id;
              
                IF v_tipo_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id)
                    ),
                    NULL::uuid,
                     concat('Lotto non trovato: ', p_lotto_id)
                  );
                END IF;
              
                IF v_tipo_lotto <> 'MASSIVO' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object('detail','tipo lotto non ammesso', 'tipo_lotto', v_tipo_lotto)
                    ),
                    NULL::uuid,
                    concat('Reset consentito solo per lotti MASSIVO, tipo lotto: ', v_tipo_lotto)
                  );
                END IF;
              
                SELECT s.id
                  INTO v_draft_id
                  FROM config.stati_doc_fiscale s
                 WHERE s.codice_interno = 'DRAFT'
                   AND s.attivo IS TRUE
                 LIMIT 1;
              
                IF v_draft_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object('detail','stato DRAFT non configurato')
                    ),
                    NULL::uuid,
                    'Stato DRAFT non trovato in config.stati_doc_fiscale'
                  );
                END IF;
              
                IF v_stato_doc_fiscale_id IS DISTINCT FROM v_draft_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object(
                        'detail','lotto non in DRAFT',
                        'stato_doc_fiscale_id', v_stato_doc_fiscale_id
                      )
                    ),
                    NULL::uuid,
                    concat('Reset consentito solo se il lotto e'' in DRAFT, stato attuale: '
                    , v_stato_doc_fiscale_id)
                  );
                END IF;
              
                SELECT EXISTS (
                  SELECT 1
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f
                      ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND lf.fattura_id = p_fattura_id
                     AND f.stato_doc_fiscale_id = v_draft_id
                )
                INTO v_is_linked;
              
                IF COALESCE(v_is_linked, false) = false THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_reset_lotto_fattura_draft', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', p_fattura_id,
                      'context', jsonb_build_object(
                        'detail','fattura non collegata o non DRAFT',
                        'lotto_id', p_lotto_id,
                        'fattura_id', p_fattura_id
                      )
                    ),
                    NULL::uuid,
                    'Fattura non collegata al lotto o non in DRAFT'
                  );
                END IF;
              
                SELECT c.deleted_fatture, c.deleted_righe, c.updated_attivita
                  INTO v_deleted_fatture, v_deleted_righe, v_updated_attivita
                  FROM vendite.fn_cleanup_fatture_by_ids(ARRAY[p_fattura_id], v_lock_batch_id) AS c;
              
                RETURN QUERY
                SELECT v_updated_attivita, v_deleted_fatture, v_deleted_righe;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_reset_lotto_fattura_draft(bigint, bigint)
              IS 'Reset tecnico della singola fattura DRAFT in lotto MASSIVO senza annullare il lotto.';
