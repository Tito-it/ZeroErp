# vendite.fn_contratto_righe_preview DIVENTA LA SORGENTE della lista
# `vendite.contratto_righe` (7): chiave di riga e azioni per riga dal DB.
#
# -- IL PROBLEMA ------------------------------------------------------
#   Il drawer del contratto aveva due sorgenti (anteprima per il contratto con
#   listino, contratti_righe senza), inventava la chiave delle righe dal listino
#   (`articolo_id__uom_id`, che non hanno una riga propria) e decideva lui le
#   azioni per origine. Decisione di Tid, 2026-09-28 (D-8.4): la lista legge
#   SEMPRE questa funzione, che restituisce chiave e azioni.
#
# -- COSA CAMBIA ------------------------------------------------------
#   Tre colonne IN CODA; le 19 di prima identiche, nello stesso ordine.
#   · riga_key: 'L:<articolo>:<uom>' (le righe del listino sono uniche per
#     versione, articolo, UoM: uq_listini_righe_key_attiva) o 'A:<id>' (la riga
#     dell'AGGIUNTA);
#   · azioni text[]: i verbi che l'origine ammette — la mappa che stava nel
#     drawer (buildRigaActions / onRowClick);
#   · escludi_blocco_codice: il reason del PRIMO motivo di
#     script.fn_check_esclusione_articolo_contratto (20260928-29) sulle righe
#     dal listino, NULL = ammesso. E' il predicato che il guard solleva
#     (20260928-31): «Escludi» si spegne con il motivo invece di fallire dopo.
#   ⚠️ Il blocco «fuori bozza» resta di DOCUMENTO (trgfn_doc_righe_lock_fuori_bozza
#   e la capability del contratto): ripeterlo su ogni riga sarebbe una seconda sede.
#
# -- FORMA -------------------------------------------------------------
#   · RETURNS TABLE cambia: DROP + CREATE. Nessuna vista dipende; i tre pgTAP
#     che la nominano controllano la presenza di colonne (componenti,
#     fonte_quantita_attesa), non il loro numero;
#   · firma e RETURNS TABLE ANCORATI, ripresi dall'ultimo YAML che li ha
#     (20260604-03): la doc auto-gen li scioglie. Le tre colonne nuove sono
#     calcolate: tipi espliciti, scritto accanto;
#   · SECURITY INVOKER reso esplicito (linee-guida-sql §5b), senza cambio;
#   · il corpo e' quello vivo (doc auto-gen), patchato da script con le
#     sostituzioni contate: nessun'altra riga toccata.
#
# -- ⚠️ REGISTRATO, NON TOCCATO (brief §8.13.2) ----------------------------
#   · un OVERRIDE vale per articolo e finisce su tutte le UoM dell'articolo nel
#     listino (domanda di dominio aperta);
#   · la «versione operativa» qui ne sceglie una (ATTIVA prima), la check e i
#     guard guardano tutte le valide: e' scritta in sei funzioni, cantiere a se'.
#
# Cantiere: brief-db-liste-righe-documento §8.4 (D-8.4), §8.13, §8.10 passo 9
# Verifica: db/pgtap/vendite/test-contratto-righe-lista-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-32-update-fn-contratto-righe-preview-chiave-e-azioni-mctit.yaml

  - changeSet:
      id: 20260928-32-update-fn-contratto-righe-preview-chiave-e-azioni
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_contratto_righe_preview diventa la sorgente della lista delle righe del contratto:
        in coda riga_key (la chiave che il frontend inventava), azioni (i verbi per origine)
        ed escludi_blocco_codice (il motivo per cui «Escludi» e' spento, dalla stessa check
        del guard). RETURNS TABLE cambiato: DROP + CREATE.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_check_esclusione_articolo_contratto'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Il RETURNS TABLE cambia (tre colonne in coda): CREATE OR REPLACE non
              --    lo ammette, quindi DROP + CREATE. Nessuna vista dipende dalla funzione
              --    (la leggono il repository e i pgTAP): il DROP non trascina niente.
              DROP FUNCTION vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE);

              CREATE FUNCTION vendite.fn_contratto_righe_preview(
                  p_contratto_id vendite.contratti.id%TYPE
              )
              RETURNS TABLE (
                  articolo_id          catalogo.articoli.id%TYPE,
                  articolo_codice      catalogo.articoli.codice%TYPE,
                  articolo_descrizione catalogo.articoli.descrizione%TYPE,
                  is_composito         catalogo.articoli.is_composito%TYPE,
                  uom_id               vendite.listini_righe.uom_id%TYPE,
                  uom_codice           catalogo.unita_misura.codice%TYPE,
                  prezzo_listino       vendite.listini_righe.prezzo%TYPE,
                  tipo_variazione      vendite.contratti.tipo_variazione_globale%TYPE,
                  valore_variazione    vendite.contratti.valore_variazione_globale%TYPE,
                  override_riga_id     vendite.contratti_righe.id%TYPE,
                  override_prezzo      vendite.contratti_righe.prezzo_unitario%TYPE,
                  tipo_eccezione       vendite.tipo_eccezione_contratto,
                  -- Tipi espliciti, qui e sotto: valori CALCOLATI, nessuna colonna di cui
                  -- siano il riflesso.
                  origine              varchar,
                  prezzo_finale        vendite.listini_righe.prezzo%TYPE,
                  componenti           jsonb,
                  quantita             vendite.contratti_righe.quantita%TYPE,
                  qta_operativa        vendite.contratti_righe.qta_operativa%TYPE,
                  tipo_erogazione      vendite.contratti_righe.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.contratti_righe.fonte_quantita_attesa%TYPE,
                  -- ── in coda dal 2026-09-28 (D-8.4) ──────────────────────────────
                  riga_key             text,
                  azioni               text[],
                  escludi_blocco_codice text
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: righe drawer ContrattoRigheDrawer (output invariato).
              -- Parte 1: core fn_espandi_listino_versione (standalone+bundle) +
              --   overlay OVERRIDE/ESCLUSIONE via LEFT JOIN contratti_righe.
              -- Parte 2: AGGIUNTA standalone+bundle da contratti_righe/_componenti.
              -- Versione operativa: snapshot se ATTIVO, altrimenti lookup ATTIVA/CHIUSA.
              -- rev 2026-09-28 (brief-db-liste-righe-documento, D-8.4): la funzione e' la
              --   SORGENTE della lista vendite.contratto_righe, per le due forme del
              --   contratto. Tre colonne in coda:
              --   · riga_key: 'L:<articolo>:<uom>' per le righe del listino (uniche per
              --     versione, articolo, UoM), 'A:<id>' per le AGGIUNTA (la loro riga);
              --   · azioni: i verbi che l'origine ammette (SOVRASCRIVI_PREZZO, ESCLUDI,
              --     MODIFICA, RIPRISTINA_LISTINO, RIPRISTINA_ARTICOLO, RIMUOVI);
              --   · escludi_blocco_codice: il reason del PRIMO motivo di
              --     script.fn_check_esclusione_articolo_contratto, NULL = ammesso. Lo
              --     stesso predicato del guard: pulsante ed errore non divergono.
              --   ⚠️ Il blocco «fuori bozza» NON e' qui: e' di documento
              --     (trgfn_doc_righe_lock_fuori_bozza, capability del contratto).
              DECLARE
                  v_listino_id          vendite.contratti.listino_id%TYPE;
                  v_listino_versione_id vendite.contratti.listino_versione_id%TYPE;
                  v_tipo_var            vendite.contratti.tipo_variazione_globale%TYPE;
                  v_valore_var          vendite.contratti.valore_variazione_globale%TYPE;
              BEGIN
                  SELECT c.listino_id, c.listino_versione_id,
                         c.tipo_variazione_globale, c.valore_variazione_globale
                    INTO v_listino_id, v_listino_versione_id, v_tipo_var, v_valore_var
                    FROM vendite.contratti c
                   WHERE c.id = p_contratto_id;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- Versione operativa per contratti DRAFT senza snapshot (BOZZA esclusa).
                  IF v_listino_id IS NOT NULL AND v_listino_versione_id IS NULL THEN
                      SELECT lv.id
                        INTO v_listino_versione_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.listino_id = v_listino_id
                         AND lv.attivo     = TRUE
                         AND lv.stato      IN ('ATTIVA', 'CHIUSA')
                         AND lv.validita  @> CURRENT_DATE
                       ORDER BY (lv.stato = 'ATTIVA') DESC
                       LIMIT 1;
                  END IF;

                  -- PARTE 1: righe dal listino (core) + overlay eccezioni OVERRIDE/ESCLUSIONE.
                  IF v_listino_versione_id IS NOT NULL THEN
                      RETURN QUERY
                      SELECT
                          base.articolo_id,
                          base.articolo_codice,
                          base.articolo_descrizione,
                          base.is_composito,
                          base.uom_id,
                          base.uom_codice,
                          base.prezzo_listino,
                          v_tipo_var,
                          v_valore_var,
                          cr.id,
                          cr.prezzo_unitario,
                          cr.tipo_eccezione,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN 'OVERRIDE'
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN 'ESCLUSIONE'
                              ELSE                                       'DA_LISTINO'
                          END::varchar,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN cr.prezzo_unitario
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN NULL
                              ELSE                                       base.prezzo_da_listino
                          END,
                          base.componenti,
                          cr.quantita,
                          cr.qta_operativa,
                          cr.tipo_erogazione,
                          cr.fonte_quantita_attesa,
                          ('L:' || base.articolo_id::text || ':' || base.uom_id::text),
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'
                                  THEN ARRAY['MODIFICA', 'RIPRISTINA_LISTINO']
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE'
                                  THEN ARRAY['MODIFICA', 'RIPRISTINA_ARTICOLO']
                              ELSE ARRAY['SOVRASCRIVI_PREZZO', 'ESCLUDI']
                          END,
                          -- Solo dove «Escludi» e' un'azione della riga (dal listino).
                          CASE
                              WHEN cr.tipo_eccezione IS NULL
                                  THEN script.fn_check_esclusione_articolo_contratto(
                                           p_contratto_id, base.articolo_id) -> 0 ->> 'reason'
                          END
                        FROM vendite.fn_espandi_listino_versione(
                                 v_listino_versione_id, v_tipo_var, v_valore_var
                             ) base
                        LEFT JOIN vendite.contratti_righe cr
                               ON cr.contratto_id           = p_contratto_id
                              AND cr.articolo_id            = base.articolo_id
                              AND cr.tipo_eccezione         IN (
                                      'OVERRIDE'::vendite.tipo_eccezione_contratto,
                                      'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                                  )
                              AND COALESCE(cr.attivo, TRUE) = TRUE;
                  END IF;

                  -- PARTE 2a: AGGIUNTA standalone (non in listino). JOIN diretto.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, FALSE,
                      a.uom_id, um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario, NULL::jsonb,
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa,
                      ('A:' || cr.id::text), ARRAY['MODIFICA', 'RIMUOVI'], NULL::text
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = FALSE AND a.attivo = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;

                  -- PARTE 2b: AGGIUNTA bundle (non in listino). Componenti da contratti_righe_componenti.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, TRUE,
                      a.uom_id, um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario,
                      (
                          SELECT jsonb_agg(jsonb_build_object(
                              'articolo_componente_id', ac.id,
                              'componente_id',          af.id,
                              'componente_codice',      af.codice,
                              'componente_descrizione', af.descrizione,
                              'uom_id',                 af.uom_id,
                              'uom_codice',             umf.codice,
                              'coeff_qta',              crc.coeff_qta_snapshot,
                              'prezzo',                 crc.prezzo_unitario,
                              'obbligatorio',           ac.obbligatorio,
                              'esposto_in_fattura',     ac.esposto_in_fattura
                          ) ORDER BY crc.ordine, crc.id)
                            FROM vendite.contratti_righe_componenti crc
                            JOIN catalogo.articoli af ON af.id = crc.componente_id
                            JOIN catalogo.unita_misura umf ON umf.id = af.uom_id
                            JOIN catalogo.articoli_componenti ac ON ac.id = crc.articolo_componente_id
                           WHERE crc.riga_contratto_id = cr.id
                             AND crc.attivo            = TRUE
                      ),
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa,
                      ('A:' || cr.id::text), ARRAY['MODIFICA', 'RIMUOVI'], NULL::text
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = TRUE AND a.attivo = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE) IS
                  'Le righe OPERATIVE di un contratto: parte 1 dal listino (core '
                  'fn_espandi_listino_versione, standalone e bundle) con l''overlay delle eccezioni '
                  'OVERRIDE/ESCLUSIONE; parte 2 le AGGIUNTA (standalone e bundle, componenti da '
                  'contratti_righe_componenti). Versione del listino: fissata se il contratto e'' attivo, '
                  'altrimenti la ATTIVA/CHIUSA valida oggi. ⭐ Dal 2026-09-28 (brief-db-liste-righe-documento, '
                  'D-8.4) e'' la SORGENTE della lista configurabile vendite.contratto_righe, per le due '
                  'forme del contratto (senza listino restano le sole AGGIUNTA), e porta tre colonne in '
                  'coda: riga_key (L:<articolo>:<uom> per le righe del listino, A:<id> per le aggiunte: '
                  'la chiave che prima il frontend inventava), azioni (i verbi che l''origine ammette: '
                  'DA_LISTINO -> SOVRASCRIVI_PREZZO, ESCLUDI; OVERRIDE -> MODIFICA, RIPRISTINA_LISTINO; '
                  'ESCLUSIONE -> MODIFICA, RIPRISTINA_ARTICOLO; AGGIUNTA -> MODIFICA, RIMUOVI) e '
                  'escludi_blocco_codice (il reason del primo motivo di '
                  'script.fn_check_esclusione_articolo_contratto, NULL = «Escludi» ammesso: lo stesso '
                  'predicato del guard). Il blocco «fuori bozza» non e'' qui: e'' di documento. 22 colonne.';

              -- ⚠️ Il DROP cancella i privilegi dati alla funzione: l'EXECUTE all'app si
              --    ridichiara. Nessun GRANT ai ruoli batch (provisioning, §11.6).
              GRANT EXECUTE ON FUNCTION vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE)
                  TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino: la forma a 19 colonne di 20260604-03 (corpo vivo del 2026-09-28).
              DROP FUNCTION IF EXISTS vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE);
              CREATE FUNCTION vendite.fn_contratto_righe_preview(
                  p_contratto_id vendite.contratti.id%TYPE
              )
              RETURNS TABLE (
                  articolo_id          catalogo.articoli.id%TYPE,
                  articolo_codice      catalogo.articoli.codice%TYPE,
                  articolo_descrizione catalogo.articoli.descrizione%TYPE,
                  is_composito         catalogo.articoli.is_composito%TYPE,
                  uom_id               vendite.listini_righe.uom_id%TYPE,
                  uom_codice           catalogo.unita_misura.codice%TYPE,
                  prezzo_listino       vendite.listini_righe.prezzo%TYPE,
                  tipo_variazione      vendite.contratti.tipo_variazione_globale%TYPE,
                  valore_variazione    vendite.contratti.valore_variazione_globale%TYPE,
                  override_riga_id     vendite.contratti_righe.id%TYPE,
                  override_prezzo      vendite.contratti_righe.prezzo_unitario%TYPE,
                  tipo_eccezione       vendite.tipo_eccezione_contratto,
                  -- Tipi espliciti, qui e sotto: valori CALCOLATI, nessuna colonna di cui
                  -- siano il riflesso.
                  origine              varchar,
                  prezzo_finale        vendite.listini_righe.prezzo%TYPE,
                  componenti           jsonb,
                  quantita             vendite.contratti_righe.quantita%TYPE,
                  qta_operativa        vendite.contratti_righe.qta_operativa%TYPE,
                  tipo_erogazione      vendite.contratti_righe.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.contratti_righe.fonte_quantita_attesa%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: righe drawer ContrattoRigheDrawer (output invariato).
              -- Parte 1: core fn_espandi_listino_versione (standalone+bundle) +
              --   overlay OVERRIDE/ESCLUSIONE via LEFT JOIN contratti_righe.
              -- Parte 2: AGGIUNTA standalone+bundle da contratti_righe/_componenti.
              -- Versione operativa: snapshot se ATTIVO, altrimenti lookup ATTIVA/CHIUSA.
              DECLARE
                  v_listino_id          vendite.contratti.listino_id%TYPE;
                  v_listino_versione_id vendite.contratti.listino_versione_id%TYPE;
                  v_tipo_var            vendite.contratti.tipo_variazione_globale%TYPE;
                  v_valore_var          vendite.contratti.valore_variazione_globale%TYPE;
              BEGIN
                  SELECT c.listino_id, c.listino_versione_id,
                         c.tipo_variazione_globale, c.valore_variazione_globale
                    INTO v_listino_id, v_listino_versione_id, v_tipo_var, v_valore_var
                    FROM vendite.contratti c
                   WHERE c.id = p_contratto_id;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- Versione operativa per contratti DRAFT senza snapshot (BOZZA esclusa).
                  IF v_listino_id IS NOT NULL AND v_listino_versione_id IS NULL THEN
                      SELECT lv.id
                        INTO v_listino_versione_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.listino_id = v_listino_id
                         AND lv.attivo     = TRUE
                         AND lv.stato      IN ('ATTIVA', 'CHIUSA')
                         AND lv.validita  @> CURRENT_DATE
                       ORDER BY (lv.stato = 'ATTIVA') DESC
                       LIMIT 1;
                  END IF;

                  -- PARTE 1: righe dal listino (core) + overlay eccezioni OVERRIDE/ESCLUSIONE.
                  IF v_listino_versione_id IS NOT NULL THEN
                      RETURN QUERY
                      SELECT
                          base.articolo_id,
                          base.articolo_codice,
                          base.articolo_descrizione,
                          base.is_composito,
                          base.uom_id,
                          base.uom_codice,
                          base.prezzo_listino,
                          v_tipo_var,
                          v_valore_var,
                          cr.id,
                          cr.prezzo_unitario,
                          cr.tipo_eccezione,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN 'OVERRIDE'
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN 'ESCLUSIONE'
                              ELSE                                       'DA_LISTINO'
                          END::varchar,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN cr.prezzo_unitario
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN NULL
                              ELSE                                       base.prezzo_da_listino
                          END,
                          base.componenti,
                          cr.quantita,
                          cr.qta_operativa,
                          cr.tipo_erogazione,
                          cr.fonte_quantita_attesa
                        FROM vendite.fn_espandi_listino_versione(
                                 v_listino_versione_id, v_tipo_var, v_valore_var
                             ) base
                        LEFT JOIN vendite.contratti_righe cr
                               ON cr.contratto_id           = p_contratto_id
                              AND cr.articolo_id            = base.articolo_id
                              AND cr.tipo_eccezione         IN (
                                      'OVERRIDE'::vendite.tipo_eccezione_contratto,
                                      'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                                  )
                              AND COALESCE(cr.attivo, TRUE) = TRUE;
                  END IF;

                  -- PARTE 2a: AGGIUNTA standalone (non in listino). JOIN diretto.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, FALSE,
                      a.uom_id, um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario, NULL::jsonb,
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = FALSE AND a.attivo = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;

                  -- PARTE 2b: AGGIUNTA bundle (non in listino). Componenti da contratti_righe_componenti.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, TRUE,
                      a.uom_id, um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario,
                      (
                          SELECT jsonb_agg(jsonb_build_object(
                              'articolo_componente_id', ac.id,
                              'componente_id',          af.id,
                              'componente_codice',      af.codice,
                              'componente_descrizione', af.descrizione,
                              'uom_id',                 af.uom_id,
                              'uom_codice',             umf.codice,
                              'coeff_qta',              crc.coeff_qta_snapshot,
                              'prezzo',                 crc.prezzo_unitario,
                              'obbligatorio',           ac.obbligatorio,
                              'esposto_in_fattura',     ac.esposto_in_fattura
                          ) ORDER BY crc.ordine, crc.id)
                            FROM vendite.contratti_righe_componenti crc
                            JOIN catalogo.articoli af ON af.id = crc.componente_id
                            JOIN catalogo.unita_misura umf ON umf.id = af.uom_id
                            JOIN catalogo.articoli_componenti ac ON ac.id = crc.articolo_componente_id
                           WHERE crc.riga_contratto_id = cr.id
                             AND crc.attivo            = TRUE
                      ),
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = TRUE AND a.attivo = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;
              END;
              $function$;
              GRANT EXECUTE ON FUNCTION vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE)
                  TO zeroerp_app;
