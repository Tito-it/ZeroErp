# Correzione di `20260803-08` — vendite.fn_riporta_lotto_a_draft
#   (piano-db-ritorno-lotto-a-draft.md, passo A3)
#
# ── 🔴 IL BUG, TROVATO DAL pgTAP AL PRIMO GIRO ───────────────────────────
#   `pg_advisory_xact_lock(integer, bigint)` NON ESISTE. PostgreSQL espone
#   due soli overload:
#       pg_advisory_xact_lock(bigint)
#       pg_advisory_xact_lock(integer, integer)
#   `hashtext()` restituisce INTEGER, ma p_lotto_id e' BIGINT: nessuna delle
#   due firme combacia, e la funzione moriva con 42883 alla prima chiamata.
#   ⚠️ Da ricordare: la forma a due argomenti — quella corretta, perche' la
#   forma a un argomento condivide uno spazio di lock globale con chiunque —
#   vuole DUE int4. Una chiave bigint va portata a int4, e non con un cast.
#
#   Rimedio: `hashtext(p_lotto_id::text)`, la stessa forma gia' usata da
#   vendite.fn_get_or_create_commessa. NON `p_lotto_id::int`: quel cast
#   esploderebbe oltre i 2 miliardi, mentre l'hash non ha limite di
#   dominio. Una collisione fra due lotti diversi e' possibile e innocua —
#   serializza due operazioni che potevano correre in parallelo, cioe'
#   sbaglia dalla parte della prudenza. Il cast invece sbaglierebbe dalla
#   parte opposta: errore in faccia all'operatore.
#
# ── LA FIRMA E IL RETURNS ANDAVANO ANCORATI (rilievo di Tid) ─────────────
#   `linee-guida-sql.md` §"Convenzioni della funzione madre": i tipi si
#   ancorano con `%TYPE` in **parametri, DECLARE, RETURNS / RETURNS TABLE,
#   COMMENT**. La prima stesura aveva `p_lotto_id bigint` — un tipo scritto
#   a mano che smette di seguire la colonna il giorno che la colonna cambia.
#   Ora `p_lotto_id vendite.fatturazione_lotti.id%TYPE`, come la sorella
#   fn_annulla_lotto_da_draft nel suo YAML (20260801-10).
#   ℹ️ La doc auto-gen mostrera' comunque `bigint`: l'auto-gen SCIOGLIE i
#   %TYPE. Per firma e RETURNS la fonte e' questo file, non la doc.
#
# ── ⚠️ DROP ESPLICITA PRIMA DELLA CREATE ─────────────────────────────────
#   `CREATE OR REPLACE` non puo' cambiare un `RETURNS TABLE`: se un domani
#   si tocca l'elenco dei contatori, la sola REPLACE fallisce con un errore
#   che non spiega perche'. La DROP davanti rende il changeSet ripetibile
#   qualunque cosa cambi nella firma. Ed e' anche l'unico modo di NON
#   creare un overload per sbaglio se il tipo del parametro cambiasse.
#
# ── AGGIUNTO ANCHE `SECURITY INVOKER` esplicito ──────────────────────────
#   Stessa sezione delle linee guida: la funzione madre gira come il ruolo
#   chiamante, cosi' RLS e scope emittente restano applicati identici. Era
#   gia' il comportamento (e' il default), ma scritto e' una scelta, non
#   scritto e' una dimenticanza che il prossimo non sa distinguere.
#
# ── COSA NON CAMBIA ──────────────────────────────────────────────────────
#   Il corpo, la logica dei tre livelli e i cinque contatori sono quelli di
#   `20260803-08`. Questo changeSet corregge la firma e il lock, non il
#   disegno.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260803-09-fix-fn-riporta-lotto-a-draft-firma-e-lock-mctit.yaml

  - changeSet:
      id: 20260803-09-fix-fn-riporta-lotto-a-draft-firma-e-lock
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Correzione di fn_riporta_lotto_a_draft: advisory lock a due int4
        (hashtext su entrambi), firma ancorata con %TYPE e SECURITY INVOKER
        esplicito. Corpo invariato rispetto a 20260803-08.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'vendite' AND p.proname = 'fn_riporta_lotto_a_draft'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_riporta_lotto_a_draft(bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_riporta_lotto_a_draft(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE
              )
              RETURNS TABLE(
                  updated_lotti     INTEGER,
                  updated_attivita  INTEGER,
                  deleted_fatture   INTEGER,
                  deleted_righe     INTEGER,
                  riemesse_attivita INTEGER
              )
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: rollback di un lotto PRE-FISCALE verso DRAFT — cancella le
              --        fatture, ripristina le attivita' fatturabili, riporta le
              --        commesse_attivita a NON_EMESSA e marca il lotto come
              --        riaperto. Il lotto resta vivo e ripartira' dallo step DRAFT.
              -- Perimetro (RD-1): si torna indietro per QUALSIASI motivo. Nessun
              --        guard sulla causa. Vale per MASSIVO **e** GIORNALIERO
              --        (D-L.2 / D-T), su lotti DRAFT o EMESSA.
              -- Contatori separati di proposito: un numero unico direbbe «10
              --        cose fatte» senza distinguere fatture cancellate da
              --        attivita' rimesse in coda, che per il cockpit sono fatti
              --        diversi.
              DECLARE
                  v_tipo_lotto           vendite.fatturazione_lotti.tipo_lotto%TYPE;
                  v_stato_doc_fiscale_id vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_lock_batch_id        vendite.fatturazione_lotti.lock_batch_id%TYPE;
                  v_draft_id             config.stati_doc_fiscale.id%TYPE;
                  v_emessa_id            config.stati_doc_fiscale.id%TYPE;
                  v_fatture_ids          BIGINT[];
                  v_ca_ids               BIGINT[];
                  v_numerate             INTEGER := 0;
                  v_bad_fatture          INTEGER := 0;
                  v_updated_lotti        INTEGER := 0;
                  v_updated_attivita     INTEGER := 0;
                  v_deleted_fatture      INTEGER := 0;
                  v_deleted_righe        INTEGER := 0;
                  v_riemesse_attivita    INTEGER := 0;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  SELECT fl.tipo_lotto, fl.stato_doc_fiscale_id, fl.lock_batch_id
                    INTO v_tipo_lotto, v_stato_doc_fiscale_id, v_lock_batch_id
                    FROM vendite.fatturazione_lotti fl WHERE fl.id = p_lotto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_VALORE_MANCANTE',
                          jsonb_build_object('lotto_id', p_lotto_id), NULL::uuid, concat('lotto_id ', p_lotto_id));
                  END IF;

                  SELECT s.id INTO v_draft_id FROM config.stati_doc_fiscale s WHERE s.codice_interno = 'DRAFT' AND s.attivo IS TRUE LIMIT 1;
                  IF v_draft_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'DRAFT'), NULL::uuid, 'stato DRAFT non configurato');
                  END IF;

                  SELECT s.id INTO v_emessa_id FROM config.stati_doc_fiscale s WHERE s.codice_interno = 'EMESSA' AND s.attivo IS TRUE LIMIT 1;
                  IF v_emessa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'EMESSA'), NULL::uuid, 'stato EMESSA non configurato');
                  END IF;

                  -- Il lotto dev'essere PRE-FISCALE. Oltre EMESSA c'e' la
                  -- numerazione, e da li' non si torna: e' il punto di non ritorno
                  -- del documento fiscale, non una scelta di questa funzione.
                  IF v_stato_doc_fiscale_id IS DISTINCT FROM v_draft_id
                     AND v_stato_doc_fiscale_id IS DISTINCT FROM v_emessa_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'stato_doc_fiscale', 'valore', v_stato_doc_fiscale_id, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('ritorno a DRAFT solo da DRAFT o EMESSA, stato=', v_stato_doc_fiscale_id));
                  END IF;

                  -- Stesso criterio sulle fatture (perimetro pre-fiscale, D-L.2).
                  SELECT count(*) INTO v_bad_fatture
                    FROM vendite.fatture f JOIN vendite.fatturazione_lotti_fatture lf ON lf.fattura_id = f.id
                   WHERE lf.lotto_id = p_lotto_id
                     AND f.stato_doc_fiscale_id IS DISTINCT FROM v_draft_id
                     AND f.stato_doc_fiscale_id IS DISTINCT FROM v_emessa_id;

                  IF v_bad_fatture > 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'fatture_non_pre_fiscali', 'count', v_bad_fatture, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('fatture non pre-fiscali (DRAFT/EMESSA): ', v_bad_fatture));
                  END IF;

                  -- ⚠️ Guard ESPLICITO sul numero, e non solo sullo stato. A EMESSA
                  -- la fattura non e' numerata (C-19), quindi il controllo di stato
                  -- basterebbe: ma il danno qui sarebbe irreversibile — cancellare
                  -- una fattura gia' numerata apre un buco nella numerazione
                  -- fiscale. Si guarda il FATTO (il numero), non lo stato che
                  -- dovrebbe implicarlo.
                  SELECT count(*) INTO v_numerate
                    FROM vendite.fatture f JOIN vendite.fatturazione_lotti_fatture lf ON lf.fattura_id = f.id
                   WHERE lf.lotto_id = p_lotto_id AND f.numero IS NOT NULL;

                  IF v_numerate > 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_riporta_lotto_a_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'fatture_numerate', 'count', v_numerate, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('fatture gia'' numerate: ', v_numerate));
                  END IF;

                  -- Concorrenza (punto E dell'analisi): il runner ha il suo
                  -- E_PIPELINE_LOTTO_IN_ESECUZIONE, ma e' applicativo e non protegge
                  -- chi chiama la funzione per altra via.
                  -- POSIZIONE: dopo TUTTE le guard e i lookup di validazione, com'e'
                  -- convenzione di casa — una chiamata invalida (lotto inesistente,
                  -- fattura numerata) non deve serializzare gli altri chiamanti. Qui
                  -- il rischio TOCTOU e' benigno: due ritorni concorrenti sullo stesso
                  -- lotto portano entrambi allo stesso esito, il secondo non trova
                  -- piu' fatture da cancellare.
                  -- ⚠️ Forma a DUE argomenti (quella a uno condivide uno spazio di
                  -- lock globale con feature scorrelate), e i due argomenti sono DUE
                  -- int4: `(integer, integer)` e `(bigint)` sono gli unici overload
                  -- esistenti. La chiave passa da hashtext e NON da un cast, perche'
                  -- `p_lotto_id::int` esploderebbe oltre i 2 miliardi mentre una
                  -- collisione di hash serializza due lotti diversi — cioe' sbaglia
                  -- dalla parte prudente.
                  PERFORM pg_advisory_xact_lock(
                      hashtext('vendite.fn_riporta_lotto_a_draft'),
                      hashtext(p_lotto_id::text)
                  );

                  SELECT array_agg(lf.fattura_id) INTO v_fatture_ids
                    FROM vendite.fatturazione_lotti_fatture lf WHERE lf.lotto_id = p_lotto_id;
                  IF v_fatture_ids IS NULL THEN v_fatture_ids := ARRAY[]::BIGINT[]; END IF;

                  -- ⚠️ Le commesse_attivita si raccolgono PRIMA della pulizia: dopo,
                  -- fattura_riga_id e' NULL e il legame con questo lotto non e' piu'
                  -- ricostruibile. Due rami perche' sono due popolazioni diverse:
                  -- quelle diventate riga, e quelle solo agganciate al batch.
                  SELECT array_agg(DISTINCT af.commessa_attivita_id) INTO v_ca_ids
                    FROM vendite.attivita_fatturabili af
                   WHERE af.commessa_attivita_id IS NOT NULL
                     AND (
                           (v_lock_batch_id IS NOT NULL AND af.lock_batch_id = v_lock_batch_id)
                        OR af.fattura_riga_id IN (
                               SELECT fr.id FROM vendite.fatture_righe fr
                                WHERE fr.fattura_id = ANY(v_fatture_ids)
                           )
                         );
                  IF v_ca_ids IS NULL THEN v_ca_ids := ARRAY[]::BIGINT[]; END IF;

                  -- ⚠️ Qui il lock_batch_id SI passa, ed e' corretto: e' un reset
                  -- GLOBALE del lotto, quindi deve liberare anche le attivita'
                  -- agganciate al batch che non sono mai diventate riga. E' il
                  -- per-fattura che deve passare NULL (C-22).
                  SELECT c.deleted_fatture, c.deleted_righe, c.updated_attivita
                    INTO v_deleted_fatture, v_deleted_righe, v_updated_attivita
                    FROM vendite.fn_cleanup_fatture_by_ids(v_fatture_ids, v_lock_batch_id) AS c;

                  -- 🔴 Il livello che la pulizia non copre. Solo le EMESSA: le
                  -- ANNULLATA sono state annullate di proposito e non tornano in
                  -- coda per un rollback di lotto.
                  UPDATE vendite.commesse_attivita ca
                     SET stato_emissione = 'NON_EMESSA',
                         data_update     = now(),
                         user_update     = current_user
                   WHERE ca.id = ANY(v_ca_ids)
                     AND ca.stato_emissione = 'EMESSA';
                  GET DIAGNOSTICS v_riemesse_attivita = ROW_COUNT;

                  -- stato_operativo torna APERTO: il lotto ha di nuovo lavoro da
                  -- fare. stato_lotto NON si tocca di proposito — ha una macchina a
                  -- stati cablata in Python, e da COMPLETATO come da ERRORE l'unica
                  -- transizione ammessa e' verso IN_ESECUZIONE, che e' esattamente
                  -- quello che fara' il prossimo giro.
                  UPDATE vendite.fatturazione_lotti
                     SET stato_doc_fiscale_id = v_draft_id,
                         stato_operativo      = 'APERTO',
                         riaperto_il          = now(),
                         data_update          = now(),
                         user_update          = current_user
                   WHERE id = p_lotto_id;
                  GET DIAGNOSTICS v_updated_lotti = ROW_COUNT;

                  RETURN QUERY SELECT v_updated_lotti, v_updated_attivita, v_deleted_fatture, v_deleted_righe, v_riemesse_attivita;
              END;
              $function$;

              -- ⚠️ Il COMMENT vuole i tipi RISOLTI: `%TYPE` e' ammesso nella
              -- firma della CREATE ma non qui, dove serve identificare la
              -- funzione gia' esistente.
              COMMENT ON FUNCTION vendite.fn_riporta_lotto_a_draft(bigint)
              IS 'Rollback di un lotto PRE-FISCALE (DRAFT o EMESSA) verso DRAFT, per MASSIVO e GIORNALIERO. Cancella le fatture del lotto con fn_cleanup_fatture_by_ids (righe, riepiloghi, log, note, link, storno arrotondamenti) e ripristina le attivita'' fatturabili; in piu'' riporta commesse_attivita.stato_emissione a NON_EMESSA — passo che la pulizia NON fa e senza il quale fn_emit_attivita_fatturabili_da_commessa non riprenderebbe nulla, lasciando il lotto riaperto senza niente da emettere. Marca il lotto con riaperto_il (RD-2), lo rimette APERTO e lo lascia vivo: ripartira'' dallo step DRAFT. RD-1: si torna indietro per QUALSIASI motivo, nessun guard sulla causa; cio'' che resta vietato e'' numerare un documento incoerente (guard D-K). ⚠️ Rifiuta se una sola fattura e'' gia'' NUMERATA: il controllo guarda il numero e non lo stato, perche'' il danno sarebbe irreversibile. ⚠️ NON tocca i task_runs: nessuno li consulta per decidere (misurato 2026-08-03), sono un registro di esecuzione. Sorella di fn_annulla_lotto_da_draft, che invece CHIUDE il lotto portandolo ad ANNULLATA.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_riporta_lotto_a_draft(bigint);
