# Colonne lineage sulle liste — vw_preventivi_lista (Fase B, brief-db-colonne-
# lineage-liste §2). Aggiunge, IN CODA (CREATE OR REPLACE VIEW consente solo
# append di colonne):
#   - fase              -> da sdp.fase (join stato gia' presente; §2a, costo zero)
#   - pratica_id, pratica_numero, n_pratiche,
#     frontiera_tipo_id, frontiera_codice, frontiera_stato_codice_interno,
#     frontiera_fase, n_discendenti_attivi, is_transitato
#                        -> LEFT JOIN vendite.vw_documento_lineage (§2b)
#
# Chiave nodo: PREVENTIVO -> key_selector 'uid' -> lin.uid = (p.uid)::text.
# tipo_id risolto per codice_interno (§6d, mai id letterale). LEFT JOIN: un
# preventivo senza lineage resta in lista con le colonne NULL.
#
# ⚠️ security_invoker=on RI-SPECIFICATO (reloption azzerata da CREATE OR REPLACE).
# La vista lineage e' anch'essa security_invoker: RLS emittente coerente.
# Definizione base ripresa dalla doc auto-gen (FROM riscritto flat, semantica
# invariata). Alias FEDELI (§6c).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260715-01-update-vw-preventivi-lista-lineage-mctit.yaml

  - changeSet:
      id: 20260715-01-update-vw-preventivi-lista-lineage
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_preventivi_lista
              WITH (security_invoker=on) AS
              SELECT p.id,
                  p.uid,
                  p.numero,
                  p.rev,
                  p.is_attiva,
                  p.data,
                  p.stato_doc_preventivo_id,
                  sdp.codice_interno AS stato_codice_interno,
                  sdp.descrizione AS stato_descrizione,
                  p.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  p.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  p.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  p.istanza_utility_id,
                  iu.codice AS istanza_utility_codice,
                  p.totale_imponibile,
                  p.totale_iva,
                  p.totale_documento,
                  p.valuta_id,
                  v_val.codice AS valuta_codice,
                  p.validita_dal,
                  p.validita_al,
                  p.competenza_mese,
                  p.data_insert,
                  COALESCE(s_ef.ragione_sociale_completa, (ef.descrizione)::text) AS emittente_fiscale_descrizione,
                  -- Fase B — genealogia
                  sdp.fase AS fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato
                FROM vendite.vw_preventivi p
                JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = p.istanza_utility_id
                LEFT JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                LEFT JOIN anagrafiche.billing_account ba ON ba.id = p.billing_account_id
                LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = p.emittente_fiscale_id
                LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                LEFT JOIN config.utilities u ON u.id = p.utility_id
                LEFT JOIN config.valute v_val ON v_val.id = p.valuta_id
                LEFT JOIN vendite.vw_documento_lineage lin
                       ON lin.tipo_id = (SELECT id FROM config.sorgenti
                                          WHERE codice_interno = 'PREVENTIVO' AND attivo IS TRUE)
                      AND lin.uid = (p.uid)::text;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino non gestito qui (CREATE OR REPLACE della versione precedente
              -- via changeSet dedicato se necessario). DROP non ammesso: la vista e'
              -- referenziata da ui.lista_definizione.
              SELECT 1;
