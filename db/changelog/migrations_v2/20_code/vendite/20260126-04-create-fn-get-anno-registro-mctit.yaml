databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260126-04-create-fn-get-anno-registro-mctit.yaml

  - changeSet:
      id: 20260126-04-create-fn-get-anno-registro
      author: mctit
      comment: "Calcolo anno registro per reset ANNUALE"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_anno_registro(
                p_data date
              )
              RETURNS smallint
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_anno smallint;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce l'anno di registro per reset ANNUALE.
                --
                -- Regola:
                --   - usa l'anno solare della data documento.
                -- =========================================================

                IF p_data IS NULL THEN
                  RETURN NULL;
                END IF;

                v_anno := EXTRACT(YEAR FROM p_data)::smallint;
                RETURN v_anno;
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_get_anno_registro(date)
                IS 'Calcola anno di registro per reset ANNUALE (anno solare).';
