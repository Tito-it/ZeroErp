# L'ULTIMO PASSO DELLA VOCE 3: la natura della frontiera arriva alle LISTE.
#
# -- IL DIFETTO, che il 20260828-22 non chiudeva ---------------------
#   Il 20260828-22 ha esposto frontiera_natura_doc_codice su
#   vendite.vw_documento_lineage. Ma le viste di lista proiettano il lineage
#   per colonne ESPLICITE, e sono sempre le stesse quattro: frontiera_tipo_id,
#   frontiera_codice, frontiera_stato_codice_interno, frontiera_fase. La quinta
#   si fermava sulla summary.
#   ⛔ Finche' non la portano avanti, il difetto resta a video INTATTO: la
#   colonna «Transito» della lista resi chiama «Fattura» ogni nota di credito.
#   E li' non e' un caso limite, e' IL caso — il pgTAP 35 asserisce che l'arco S
#   arriva SEMPRE a una NOTA_CREDITO.
#   Segnalato dal team BE il 2026-08-29, misurando il terreno prima di partire.
#
# -- ⛔ SONO SETTE, NON SEI, ED E' IL PUNTO PIU' IMPORTANTE -----------
#   Il brief diceva «le sei vw_*_lista». Le viste che portano il blocco
#   frontiera_* sono SETTE: c'e' anche vw_fatture_lista. L'elenco era stato
#   fatto a mano, e a mano si sbaglia — motivo per cui qui le sette non sono
#   scritte a mano ma ricavate dal catalogo (information_schema) e verificate
#   una per una.
#
# -- ⭐ E LA SETTIMA ENTRA. Il perche' NON e' quello che sembra -------
#   vw_fatture_lista non ha la colonna «Transito» a catalogo e il chip non e'
#   montato. Il team BE proponeva di includerla perche' «il giorno che qualcuno
#   monta il chip, nasce con l'etichetta sbagliata».
#   ⚠️ Quel motivo non regge, ed e' bene dirlo invece di accettarlo: una
#   fattura e' SEMPRE frontiera di se stessa — nel grafo forward non ha archi
#   uscenti, l'arco N e' un ramo di ritorno — e lo asserisce il pgTAP 30. Su
#   quella vista la colonna vale quindi SEMPRE la natura della riga stessa: il
#   chip non nascerebbe sbagliato, nascerebbe MUTO, a rendere il documento su
#   se stesso.
#   ⭐ La settima entra lo stesso, per una ragione di FORMA: sette liste
#   sorelle devono esporre lo STESSO blocco frontiera_*. Una vista che e'
#   l'eccezione e' esattamente la trappola in cui e' caduto il brief — e in cui
#   cadrebbe chi scrive l'ottava copiando da quella sbagliata. La costanza e'
#   scritta nel COMMENT di quella vista, cosi' chi la legge non la scambia per
#   un'informazione.
#
# -- ⚠️ UN SOLO changeSet PER SETTE VISTE, E NON PER FRETTA ----------
#   Sette changeSet separati vorrebbero dire sette esiti indipendenti: sei
#   applicati e uno fallito lascerebbe le sorelle DIVERGENTI, che e' il difetto
#   che questo changeSet esiste per chiudere. O passano tutte o non passa
#   nessuna.
#
# -- ⛔ security_invoker=on RI-SPECIFICATO SETTE VOLTE ----------------
#   E' una reloption INVISIBILE in pg_get_viewdef: un CREATE OR REPLACE che non
#   la ripete la AZZERA senza nessun errore, e la RLS emittente smetterebbe di
#   mordere su quella lista. Qui sono sette occasioni di perderla invece di
#   una. Verificate tutte e sette in transazione, prima e dopo.
#
# -- ⚠️ E I SETTE COMMENT SI AGGIORNANO, perche' la lezione e' fresca -
#   Il 20260828-23 esisteva solo perche' un CREATE OR REPLACE aveva cambiato
#   cosa la vista produce senza toccarne il COMMENT. Non si ripete lo stesso
#   errore per sette: ogni COMMENT prende in coda la frase che nomina la
#   colonna nuova, ⭐ generata dal testo VIVO (obj_description) e non
#   ricopiata a mano — sette paragrafi ricopiati sono sette occasioni di
#   perderne un pezzo.
#
# Dipendenze: 20260828-22 (frontiera_natura_doc_codice sulla summary, in
#             precondizione: senza, i sette corpi non si creerebbero nemmeno).
# Cantiere: brief-db-lineage-residui-root-e-sorgente-ddt §3.4 (l'ultimo passo)
# Origine: definizioni APPLICATE (pg_get_viewdef), con la sola colonna appesa
#          in coda alla select list. Round-trip verificato: nessuna colonna
#          preesistente si sposta, la nuova e' ultima su tutte e sette.
# Verifica: db/pgtap/vendite/test-colonne-lineage-liste-v1.sql (31..38)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260829-01-update-vw-liste-frontiera-natura-mctit.yaml

  - changeSet:
      id: 20260829-01-update-vw-liste-frontiera-natura
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Le SETTE liste documento portano avanti frontiera_natura_doc_codice, ultimo passo della
        voce 3: il 20260828-22 l'aveva esposta sulla summary, ma le liste proiettano il lineage
        per colonne esplicite e si fermavano alle quattro frontiera_* storiche - quindi a video
        la colonna «Transito» continuava a chiamare «Fattura» ogni nota di credito. Sono sette e
        non sei (c'e' anche vw_fatture_lista, dove la colonna e' costante per l'invariante del
        pgTAP 30 ma entra per non lasciare una sorella diversa dalle altre). Un solo changeSet:
        sette esiti indipendenti potrebbero lasciare le sorelle divergenti. security_invoker=on
        ri-specificato sette volte, e i sette COMMENT aggiornati.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_fatture_lista
            # ⛔ «20260828-22 prima di questo»: senza la colonna sulla summary i sette
            #    corpi non si creerebbero. La precondizione dice PERCHE', invece di
            #    lasciare un errore di colonna mancante che dice solo «non esiste».
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name   = 'vw_documento_lineage'
                     AND column_name  = 'frontiera_natura_doc_codice'
            # ⚠️ E le sette sono ANCORA sette: se una lista nuova avesse nel frattempo
            #    preso il blocco frontiera_*, questo changeSet la lascerebbe indietro
            #    ricreando proprio l'asimmetria che viene a togliere.
            - sqlCheck:
                expectedResult: 7
                sql: |
                  SELECT count(DISTINCT table_name) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name LIKE 'vw\_%\_lista'
                     AND column_name = 'frontiera_tipo_id'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_preventivi_lista
              WITH (security_invoker=on) AS
               SELECT p.id,
                  p.uid,
                  p.numero,
                  p.rev,
                  p.is_attiva,
                  p.data,
                  p.stato_doc_preventivo_id,
                  sdp.codice_interno AS stato_codice_interno,
                  sdp.descrizione AS stato_descrizione,
                  p.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  p.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  p.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  p.istanza_utility_id,
                  iu.codice AS istanza_utility_codice,
                  p.totale_imponibile,
                  p.totale_iva,
                  p.totale_documento,
                  p.valuta_id,
                  v_val.codice AS valuta_codice,
                  p.validita_dal,
                  p.validita_al,
                  p.competenza_mese,
                  p.data_insert,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sdp.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  p.is_superata,
                  p.is_abortito,
                  p.has_next_revisione,
                  lin.frontiera_natura_doc_codice
                 FROM vendite.vw_preventivi p
                   JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                   LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = p.istanza_utility_id
                   LEFT JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = p.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = p.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = p.utility_id
                   LEFT JOIN config.valute v_val ON v_val.id = p.valuta_id
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE sorgenti.codice_interno::text = 'PREVENTIVO'::text AND sorgenti.attivo IS TRUE)) AND lin.uid = p.uid::text;

              CREATE OR REPLACE VIEW vendite.vw_offerte_commerciali_lista
              WITH (security_invoker=on) AS
               SELECT o.id,
                  o.uid,
                  o.codice,
                  o.revisione_numero,
                  o.revisione_padre_id,
                  NOT sdo.is_superato AND NOT sdo.is_abortito AS is_attiva,
                  (EXISTS ( SELECT 1
                         FROM vendite.offerte_commerciali figlio
                        WHERE figlio.revisione_padre_id = o.id)) AS has_next_revisione,
                  o.stato_doc_offerta_id,
                  sdo.codice_interno AS stato_codice_interno,
                  sdo.descrizione AS stato_descrizione,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.istanza_utility_id,
                  iu.codice AS istanza_utility_codice,
                  o.listino_id,
                  l.codice AS listino_codice,
                  o.listino_versione_id,
                  lv.codice_versione AS listino_versione_codice,
                  o.tipo_variazione_globale,
                  o.valore_variazione_globale,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.validita_dal,
                  o.validita_al,
                  o.validita_al IS NOT NULL AND o.validita_al < CURRENT_DATE AS is_scaduta,
                  o.data_emissione,
                  o.data_accettazione,
                  o.data_rifiuto,
                  o.data_annullamento,
                  o.data_insert,
                  o.user_insert,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sdo.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  sdo.is_superato AS is_superata,
                  sdo.is_abortito,
                  lin.frontiera_natura_doc_codice
                 FROM vendite.offerte_commerciali o
                   JOIN config.stati_doc_offerte sdo ON sdo.id = o.stato_doc_offerta_id
                   LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = o.istanza_utility_id
                   LEFT JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = o.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = o.utility_id
                   LEFT JOIN vendite.listini l ON l.id = o.listino_id
                   LEFT JOIN vendite.listini_versioni lv ON lv.id = o.listino_versione_id
                   LEFT JOIN config.valute v_val ON v_val.id = o.valuta_id
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE sorgenti.codice_interno::text = 'OFFERTA_COMMERCIALE'::text AND sorgenti.attivo IS TRUE)) AND lin.uid = o.uid::text;

              CREATE OR REPLACE VIEW vendite.vw_ordini_lista
              WITH (security_invoker=on) AS
               SELECT o.id,
                  o.uid,
                  o.numero,
                  o.serie,
                  o.anno,
                  o.data,
                  o.stato_doc_ordine_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  o.soggetto_ruolo_id,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.imponibile_tot,
                  o.sconto_tot,
                  o.iva_tot,
                  o.totale_doc,
                  o.modalita_pagamento_id,
                  mp.codice AS modalita_pagamento_codice,
                  o.termine_pagamento_id,
                  tp.codice AS termine_pagamento_codice,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.tasso_cambio,
                  o.fatturazione_trigger,
                  o.canale_origine,
                  o.agente_soggetto_ruolo_id,
                  s_ag.ragione_sociale_completa AS agente_denominazione,
                  o.documento_origine_tipo,
                  o.documento_origine_id,
                      CASE o.documento_origine_tipo
                          WHEN 'PREVENTIVO'::text THEN pv.numero
                          WHEN 'OFFERTA'::text THEN oc.codice::character varying
                          ELSE NULL::character varying
                      END AS documento_origine_codice,
                  o.data_insert,
                  o.user_insert,
                  o.data_update,
                  o.user_update,
                  sd.pdf_mode,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  lin.frontiera_natura_doc_codice
                 FROM vendite.ordini o
                   JOIN config.stati_doc_ordini sd ON sd.id = o.stato_doc_ordine_id
                   JOIN anagrafiche.soggetti_ruoli sr ON sr.id = o.soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = o.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = o.utility_id
                   LEFT JOIN config.modalita_pagamento mp ON mp.id = o.modalita_pagamento_id
                   LEFT JOIN config.termini_pagamento tp ON tp.id = o.termine_pagamento_id
                   LEFT JOIN config.valute v_val ON v_val.id = o.valuta_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ag ON sr_ag.id = o.agente_soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ag ON s_ag.id = sr_ag.soggetto_id
                   LEFT JOIN vendite.preventivi pv ON pv.id = o.documento_origine_id AND o.documento_origine_tipo::text = 'PREVENTIVO'::text
                   LEFT JOIN vendite.offerte_commerciali oc ON oc.id = o.documento_origine_id AND o.documento_origine_tipo::text = 'OFFERTA'::text
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE sorgenti.codice_interno::text = 'ORDINE_VENDITA'::text AND sorgenti.attivo IS TRUE)) AND lin.uid = o.id::text;

