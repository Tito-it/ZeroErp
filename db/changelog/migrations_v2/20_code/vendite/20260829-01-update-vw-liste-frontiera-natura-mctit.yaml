              COMMENT ON VIEW vendite.vw_ddt_lista IS
                                'Vista flat canonica e self-contained DDT per la lista UI. Nomi canonici. Destinatario via '
                                'soggetto_ruolo diretto; mittente/vettore nullable. +emittente_fiscale_id/_codice (scope, '
                                '§15). Campi trasporto per il PDF. Ordine di origine via sorgente_uid. security_invoker=on. '
                                'Mirror vw_ordini_lista. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da '
                                'vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip '
                                '«Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture '
                                'e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, '
                                'quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA '
                                'posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da '
