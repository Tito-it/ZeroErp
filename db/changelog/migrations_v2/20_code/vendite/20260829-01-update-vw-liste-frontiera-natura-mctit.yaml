              COMMENT ON VIEW vendite.vw_resi_lista IS
                                'Lista/dettaglio resi vendita (mirror vw_ddt_lista). security_invoker=on + RLS su base; '
                                'espone emittente_fiscale_id/_codice e emittente_ragione_sociale. ⭐ rev 2026-08-25 — LA SESTA '
                                'SORELLA: fase + colonne di genealogia da vendite.vw_documento_lineage (pratica, frontiera, '
                                'discendenti, is_transitato), nella stessa forma delle altre liste documento. `fase` non '
                                'c''era: la vista aveva lo stato ma non la fase normalizzata, e il seed della colonna omonima '
                                'la cerca con quel nome esatto — senza, la colonna sarebbe nata vuota e in silenzio. ⭐ SU UN '
                                'RESO frontiera_codice E'' IL NUMERO DELLA NOTA DI CREDITO: con l''arco S (20260825-19) il '
                                'reso smette di essere una foglia e la sua frontiera diventa la nota che lo accredita. La '
                                'colonna «Transito» risponde percio'' a «questo reso e'' gia'' stato accreditato, e con quale '
                                'documento» — che prima era una QUANTITA'' (gia_accreditato) in un drawer, non un documento '
                                'in lista. ⚠️ Il join al lineage e'' LEFT come sulle sorelle: un reso senza genealogia '
                                'compare senza genealogia, non sparisce. Consumo: ui.lista_definizione ''vendite.resi'' (id '
                                '9) + preset resi_default; il frontend e'' gia'' <ListaConfigurabile>, quindi le colonne '
                                'arrivano dal seed. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da '
                                'vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip '
                                '«Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture '
                                'e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, '
                                'quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA '
