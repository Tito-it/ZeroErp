                                'frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro '
                                'frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota '
                                'di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera '
                                '(frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di '
                                'ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' '
