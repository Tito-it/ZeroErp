# LA PORTA DEL RITIRO DEI LEGAMI: CHI BLOCCA, CHIEDE QUI
#   vendite.fn_doc_porta_ritiro_ammette(p_documento, p_testata_id,
#                                       p_tabella, p_cambiate)
#   Brief: brief-db-annullo-documento-con-legami (§7.2, D-4 di Tid)
#
# ── LA DOMANDA ──────────────────────────────────────────────────────
#   «Questa scrittura e' il ritiro dei legami di QUESTO documento, fatto
#   dopo la conferma?». Il ritiro (vendite.fn_documento_ritira_legami)
#   apre la porta con la GUC transazionale zeroerp.doc_ritira_legami =
#   '<DOCUMENTO>:<id>' e tocca cose che fuori bozza sono chiuse:
#     * DDT: DELETE dei legami (ordini_righe_fulfillment,
#       resi_righe_riconsegne), che il guard del legame ferma fuori bozza;
#     * ORDINE: UPDATE di ordini_righe.preventivo_riga_id a NULL, che il
#       lock delle righe ferma fuori bozza (D-2);
#     * la testata stessa: il guard dell'annullo lascia entrare in uno
#       stato abortito un documento con legami di PROVENIENZA, che non si
#       ritirano (D-6), solo se la conferma c'e' stata.
#
# ── REGOLA DEL 2 ────────────────────────────────────────────────────
#   La prima porta era quella della bolla (GUC zeroerp.ddt_annullo, letta
#   dal guard del legame, 20261011-14). Ora i lettori sono tre (guard del
#   legame, lock delle righe, guard dell'annullo): la porta e' una, qui, e
#   la GUC della bolla si ritira con 20261011-80.
#
# ── LA FORMA ────────────────────────────────────────────────────────
#   Vero solo se TUTTE: la GUC nomina questo documento; chi scrive e' il
#   proprietario della tabella (script.fn_is_proprietario_tabella: i
#   verbi DEFINER, mai una GUC accesa a mano dall'applicazione); la
#   scrittura e' una di quelle che il ritiro fa, per quel documento.
#   ⭐ L'elenco di cio' che il ritiro tocca sta QUI, accanto al lettore dei
#   legami, non nei building block che bloccano: il lock delle righe resta
#   generico e chiede «la porta ammette questa scrittura?».
#   p_cambiate NULL = DELETE (o la testata); altrimenti le colonne che
#   l'UPDATE cambia: ammesse le sole colonne del legame piu' le tecniche.
#   Allowlist: una colonna in piu' e la porta e' chiusa.
#   LANGUAGE sql, STABLE, SECURITY INVOKER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261011-78-create-fn-doc-porta-ritiro-ammette-mctit.yaml

  - changeSet:
      id: 20261011-78-create-fn-doc-porta-ritiro-ammette
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB vendite.fn_doc_porta_ritiro_ammette: la porta del ritiro dei legami (GUC
        zeroerp.doc_ritira_legami, dal proprietario), letta dal guard del legame della bolla, dal lock
        delle righe e dal guard dell'annullo. Elenca cio' che il ritiro tocca, per documento.
        Brief: brief-db-annullo-documento-con-legami (D-4).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_doc_porta_ritiro_ammette';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_doc_porta_ritiro_ammette(
                  p_documento  text,
                  p_testata_id bigint,
                  p_tabella    regclass,
                  p_cambiate   text[] DEFAULT NULL)
              RETURNS boolean
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- Scopo: dire se una scrittura e' il ritiro dei legami di
                  --   QUESTO documento dopo la conferma. Vedi l'intestazione.
                  -- Parametri polimorfi (documento, testata): tipi nudi.
                  SELECT p_documento IS NOT NULL
                     AND p_testata_id IS NOT NULL
                     AND COALESCE(current_setting('zeroerp.doc_ritira_legami', true), '')
                         = p_documento || ':' || p_testata_id::text
                     AND script.fn_is_proprietario_tabella(p_tabella)
                     AND CASE
                           -- La testata: il guard dell'annullo (provenienza).
                           WHEN p_tabella = CASE p_documento
                                              WHEN 'DDT'        THEN 'vendite.ddt'::regclass
                                              WHEN 'ORDINE'     THEN 'vendite.ordini'::regclass
                                              WHEN 'PREVENTIVO' THEN 'vendite.preventivi'::regclass
                                              WHEN 'CONTRATTO'  THEN 'vendite.contratti'::regclass
                                            END
                             THEN true
                           -- DDT: si cancellano i legami con ordini e resi.
                           WHEN p_documento = 'DDT'
                             THEN p_cambiate IS NULL
                                  AND p_tabella IN ('vendite.ordini_righe_fulfillment'::regclass,
                                                    'vendite.resi_righe_riconsegne'::regclass)
                           -- ORDINE: la riga si stacca dal preventivo (D-2).
                           WHEN p_documento = 'ORDINE'
                             THEN p_cambiate IS NOT NULL
                                  AND p_tabella = 'vendite.ordini_righe'::regclass
                                  AND p_cambiate <@ ARRAY['preventivo_riga_id', 'data_update',
                                                          'user_update', 'tx_id']
                           ELSE false
                         END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_doc_porta_ritiro_ammette(text, bigint, regclass, text[]) IS
                  'BB (2026-10-11, brief-db-annullo-documento-con-legami D-4): la porta del ritiro dei legami. Vero se la GUC transazionale zeroerp.doc_ritira_legami vale ''<DOCUMENTO>:<id>'' (la apre vendite.fn_documento_ritira_legami, dopo la conferma), chi scrive e'' il proprietario della tabella (script.fn_is_proprietario_tabella: i verbi DEFINER, mai una GUC accesa dall''applicazione) e la scrittura e'' una di quelle che il ritiro fa: la testata del documento (il guard dell''annullo, per i legami di provenienza); DDT: DELETE su vendite.ordini_righe_fulfillment e vendite.resi_righe_riconsegne; ORDINE: UPDATE di vendite.ordini_righe che cambia solo preventivo_riga_id (piu'' data_update, user_update, tx_id). p_cambiate NULL = DELETE o testata. Allowlist. Lettori: vendite.trgfn_ddt_riga_legame_guard, vendite.trgfn_doc_righe_lock_fuori_bozza, vendite.trgfn_doc_guard_annullo_con_legami. Prende il posto della GUC zeroerp.ddt_annullo della bolla. SECURITY INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_doc_porta_ritiro_ammette(text, bigint, regclass, text[]);
