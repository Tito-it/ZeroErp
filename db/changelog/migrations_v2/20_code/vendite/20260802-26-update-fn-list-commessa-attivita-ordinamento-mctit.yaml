# 7° lotto liste configurabili — consegna 2 del BE: `fn_list_commessa_attivita`
#   accetta l'ordinamento
#   (piano-migrazione-primevue-5.md §9, «Settimo lotto — la passata BE»)
#
# ── PERCHE' TOCCA AL DB E NON AL BACKEND ─────────────────────────────────
#   `CommessaGestioneDrawer` era stata classificata «nessuna whitelist, va
#   creata lato BE». La misura del BE ha corretto la diagnosi: l'`ORDER BY` e
#   il `LIMIT/OFFSET` stanno **dentro questa funzione**
#
#       ORDER BY ca.id LIMIT p_limit OFFSET p_offset;
#
#   quindi ordinare a valle ordinerebbe **la pagina gia' estratta**, non la
#   lista. Sarebbe un ordinamento che sembra funzionare e mente — peggio della
#   freccia morta, perche' non ripiega: risponde sbagliato. L'unico punto in
#   cui intervenire senza riscrivere in Python una query che il DB possiede e'
#   la funzione stessa (DB-first).
#
# ── ⚠️ PERCHE' DROP E NON CREATE OR REPLACE ──────────────────────────────
#   La funzione ha gia' 6 parametri **tutti con DEFAULT**. Aggiungerne altri
#   due con DEFAULT via `CREATE OR REPLACE` non sostituisce: crea un
#   **OVERLOAD**, e da quel momento ogni chiamata a 6 argomenti e' ambigua —
#   PostgreSQL non sa quale delle due scegliere e fallisce. Serve la DROP
#   esplicita della firma vecchia. E' la trappola gia' registrata nelle linee
#   guida (§4-bis di `CREATE OR REPLACE` e RETURNS TABLE).
#
# ── RETROCOMPATIBILE, VERIFICATO SUL CHIAMANTE ───────────────────────────
#   `commesse_repository.lista_attivita` invoca la funzione con **parametri
#   nominati** (`p_commessa_id => %s`, ...), quindi i due nuovi con DEFAULT non
#   la toccano. E il comportamento senza parametri e' identico a prima:
#   `p_order_by NULL` -> `ORDER BY ca.id`. **Nessuna chiamata esistente cambia
#   risultato**, ed e' voluto.
#
# ── DOVE VIVE «L'ORDINE DI APERTURA» DELLA LISTA ─────────────────────────
#   NON qui. Tid ha chiesto che la lista si apra per data: quello e'
#   `ordinamento_default` del preset (`data_attivita desc`, convenzione di casa
#   per le date — 4 preset su 4 aprono le date in DESC). Metterlo come default
#   della funzione avrebbe cambiato il risultato di chiamate che non chiedono
#   niente, che e' esattamente il tipo di sorpresa che non si vuole in una
#   funzione di lettura condivisa.
#
# ── LA WHITELIST, E PERCHE' FA RAISE ─────────────────────────────────────
#   Sette colonne, cioe' tutte quelle che il `.vue` mostra. Un nome fuori
#   whitelist **solleva** `E_PARAMETRO_INVALIDO` invece di ripiegare in
#   silenzio: il ripiego silenzioso e' il difetto che il presidio delle liste
#   chiama «freccia che non ordina», e su `documenti` si e' gia' scelto di
#   far rompere. Il gate del BE valida a monte; questo e' defense-in-depth.
#
#   ℹ️ **Niente `NULLS LAST`**: tutte e sette le colonne ordinabili sono
#   `NOT NULL` (verificato sulla doc auto-gen di `commesse_attivita`).
#   Scriverlo suggerirebbe una nullabilita' che non esiste.
#
#   Tiebreak `ca.id` sempre in coda: senza, due righe con la stessa data
#   possono scambiarsi di posto fra una pagina e l'altra, e l'operatore vede
#   una riga due volte o mai.
#
# ── SQL DINAMICO ─────────────────────────────────────────────────────────
#   L'`ORDER BY` non e' parametrizzabile, quindi la query passa da `format()`.
#   E' sicuro perche' l'espressione NON viene mai dal parametro: viene da un
#   `CASE` chiuso che mappa nome -> espressione (le linee guida lo consentono
#   proprio per questi casi). I valori restano parametri (`USING`).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260802-26-update-fn-list-commessa-attivita-ordinamento-mctit.yaml

  - changeSet:
      id: 20260802-26-update-fn-list-commessa-attivita-ordinamento
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.fn_list_commessa_attivita accetta p_order_by/p_order_dir con
        whitelist di 7 colonne e tiebreak su ca.id, sbloccando la conversione
        di CommessaGestioneDrawer. DROP della firma a 6 parametri obbligatoria:
        aggiungerli con CREATE OR REPLACE creerebbe un overload ambiguo.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: commesse_attivita
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'vendite'
                   AND p.proname = 'fn_list_commessa_attivita';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_list_commessa_attivita(
                  bigint, character varying, character varying, date, integer, integer);

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_commessa_attivita(
                  p_commessa_id       bigint,
                  p_stato_emissione   character varying DEFAULT NULL::character varying,
                  p_stato_approvazione character varying DEFAULT NULL::character varying,
                  p_competenza_mese   date DEFAULT NULL::date,
                  p_limit             integer DEFAULT 1000,
                  p_offset            integer DEFAULT 0,
                  p_order_by          text DEFAULT NULL,
                  p_order_dir         text DEFAULT 'asc'
              )
              RETURNS TABLE(id bigint, commessa_id bigint, segment_key character varying,
                            articolo_id uuid, istanza_utility_id bigint, data_attivita date,
                            uom_id bigint, quantita numeric, competenza_mese date,
                            competenza_dal date, competenza_al date, prezzo_snapshot numeric,
                            prezzo_bloccato boolean, prezzo_da_riallineare boolean,
                            stato_approvazione character varying, stato_emissione character varying,
                            sorgente_tipo_id bigint, sorgente_codice character varying,
                            meta jsonb, data_update timestamp with time zone, fatturata boolean)
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
                  v_order_col       text;
                  v_order_dir       text;
              BEGIN
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_commessa_attivita', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_commessa_id', 'valore', p_commessa_id), NULL::uuid, 'p_commessa_id obbligatorio e > 0');
                  END IF;

                  -- ⚠️ La whitelist si valida PRIMA di andare a cercare la
                  -- commessa: un parametro sbagliato non deve costare una query
                  -- per essere respinto. Stessa scelta fatta dal BE sulla coda
                  -- approvazioni, dove la validazione precede la risoluzione
                  -- utente/emittente.
                  -- Whitelist di ordinamento: mappa CHIUSA nome -> espressione.
                  -- Le chiavi sono i `campo_sorgente` che il seed manda dal FE
                  -- (<ListaConfigurabile> monta le Column su campo_sorgente).
                  -- NULL/vuoto = ordine storico `ca.id`: le chiamate che non
                  -- chiedono niente ottengono esattamente quello di prima.
                  v_order_col := CASE lower(btrim(COALESCE(p_order_by, '')))
                      WHEN ''                   THEN 'ca.id'
                      WHEN 'id'                 THEN 'ca.id'
                      WHEN 'data_attivita'      THEN 'ca.data_attivita'
                      WHEN 'competenza_mese'    THEN 'ca.competenza_mese'
                      WHEN 'segment_key'        THEN 'ca.segment_key'
                      WHEN 'quantita'           THEN 'ca.quantita'
                      WHEN 'prezzo_snapshot'    THEN 'ca.prezzo_snapshot'
                      WHEN 'stato_approvazione' THEN 'ca.stato_approvazione'
                      WHEN 'stato_emissione'    THEN 'ca.stato_emissione'
                      ELSE NULL
                  END;

                  -- Fail-loud: un nome fuori whitelist NON ripiega sul default.
                  -- Un ripiego silenzioso e' la «freccia che non ordina»: a video
                  -- sembra funzionare e restituisce un ordine che nessuno ha chiesto.
                  IF v_order_col IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_commessa_attivita', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_order_by', 'valore', p_order_by),
                          NULL::uuid, concat('p_order_by non ammesso: ', p_order_by));
                  END IF;

                  v_order_dir := CASE WHEN lower(btrim(COALESCE(p_order_dir, 'asc'))) = 'desc'
                                      THEN 'DESC' ELSE 'ASC' END;

                  IF NOT EXISTS (SELECT 1 FROM vendite.commesse c WHERE c.id = p_commessa_id) THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_commessa_attivita', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id), NULL::uuid, concat('commessa_id ', p_commessa_id));
                  END IF;

                  -- Sanitize limit/offset
                  IF p_limit IS NULL OR p_limit <= 0 THEN p_limit := 1000; END IF;
                  IF p_limit > 10000 THEN p_limit := 10000; END IF;
                  IF p_offset IS NULL OR p_offset < 0 THEN p_offset := 0; END IF;

                  v_competenza_mese := CASE WHEN p_competenza_mese IS NOT NULL
                      THEN date_trunc('month', p_competenza_mese)::DATE ELSE NULL END;

                  -- SQL dinamico solo per l'ORDER BY (non parametrizzabile).
                  -- L'espressione viene dal CASE chiuso qui sopra, MAI dal
                  -- parametro: i valori restano parametri veri (USING).
                  -- Tiebreak ca.id: senza, righe con la stessa chiave possono
                  -- scambiarsi fra una pagina e l'altra.
                  RETURN QUERY EXECUTE format($q$
                      SELECT ca.id, ca.commessa_id, ca.segment_key, ca.articolo_id, ca.istanza_utility_id,
                             ca.data_attivita, ca.uom_id, ca.quantita, ca.competenza_mese, ca.competenza_dal,
                             ca.competenza_al, ca.prezzo_snapshot, ca.prezzo_bloccato, ca.prezzo_da_riallineare,
                             ca.stato_approvazione, ca.stato_emissione, ca.sorgente_tipo_id,
                             s.codice AS sorgente_codice, ca.meta, ca.data_update,
                             -- fatturata: specchio del guard BE _assert_non_fatturata.
                             EXISTS (
                                 SELECT 1 FROM vendite.attivita_fatturabili af
                                  WHERE af.commessa_attivita_id = ca.id
                                    AND af.fattura_riga_id IS NOT NULL
                             ) AS fatturata
                        FROM vendite.commesse_attivita ca
                        LEFT JOIN config.sorgenti s ON s.id = ca.sorgente_tipo_id
                       WHERE ca.commessa_id = $1
                         AND ($2 IS NULL OR ca.stato_emissione = $2)
                         AND ($3 IS NULL OR ca.stato_approvazione = $3)
                         AND ($4 IS NULL OR ca.competenza_mese = $4)
                       ORDER BY %s %s, ca.id
                       LIMIT $5 OFFSET $6
                  $q$, v_order_col, v_order_dir)
                  USING p_commessa_id, p_stato_emissione, p_stato_approvazione,
                        v_competenza_mese, p_limit, p_offset;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_list_commessa_attivita(bigint, character varying, character varying, date, integer, integer, text, text)
              IS 'Read-only: righe commesse_attivita con filtri opzionali, paginazione e ORDINAMENTO. JOIN sorgenti per codice. rev 2026-07-24: colonna fatturata BOOLEAN = EXISTS di un''attivita_fatturabili della riga con fattura_riga_id valorizzato -- specchio esatto del guard BE commesse_service._assert_non_fatturata. rev 2026-08-02 (7o lotto liste configurabili, consegna 2 del BE): p_order_by/p_order_dir con whitelist CHIUSA di 7 colonne + tiebreak ca.id; ordine e paginazione vivono qui, quindi ordinare a valle ordinerebbe la sola pagina estratta. p_order_by NULL = ordine storico ca.id: nessuna chiamata esistente cambia risultato. Un nome fuori whitelist solleva E_PARAMETRO_INVALIDO invece di ripiegare in silenzio. STABLE preservato.';
