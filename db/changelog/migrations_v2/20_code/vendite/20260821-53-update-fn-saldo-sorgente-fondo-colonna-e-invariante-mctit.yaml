# LO SCORPORO PASSA ALLA COLONNA, E LA SUA ASSUNZIONE SI SCRIVE
#   vendite.fn_saldo_sorgente_fondo — passi S1-14 e S1-9 (lotto 3)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.1 S1-9/S1-14, §6.8
#
# ── S1-14: TERZO E ULTIMO LETTORE DEL LEGAME ───────────────────────────
#   Dei tre punti che leggevano `meta ->> 'fondo_source_id'` questo e' il
#   terzo. Dopo questo changeSet la chiave nel JSON non la legge nessuno.
#   ℹ️ Cade anche il filtro `meta ->> 'origine' = 'FONDO_FATTURA'`: era il
#   secondo criterio per dire la stessa cosa, e una riga con
#   `fondo_source_id` valorizzato viene da un fondo per costruzione.
#
# ── S1-9: L'ASSUNZIONE ERA VERA E NON SCRITTA ──────────────────────────
#   ~~Il piano prevedeva di far contare a questa funzione il contributo gia'
#   POSTATO.~~ ✅ **Non serve piu' toccare la formula**, e la ragione e' il
#   quarto stato: nessun chiamante le passa piu' un fondo il cui trasferimento
#   e' registrato — i tre filtrano `ASSEGNATO` o `DISPONIBILE`, e un fondo
#   registrato e' `ESEGUITO`.
#
#   ⚠️ Ma un'assunzione non scritta e' la prossima trappola, e questa e'
#   sottile: lo scorporo somma le righe con `is_postabile` — cioe' ABBINATA e
#   basta. Se un giorno qualcuno chiamasse questa funzione con un fondo il cui
#   trasferimento e' gia' registrato, la sua riga NON sarebbe piu' contata
#   (POSTATA non e' postabile), lo scorporo verrebbe a zero e il residuo
#   risulterebbe piu' basso del vero: il fondo sembrerebbe non piu' capiente.
#
#   ⇒ L'assunzione va nel COMMENT — «lo scorporo vale finche' la riga e' IN
#   LAVORAZIONE, ed e' garantito da ESEGUITO» — e in un pgTAP che asserisce
#   l'invariante, non nella memoria di chi c'era.
#
# ── ⭐ TIPI ANCORATI CON %TYPE ANCHE IN FIRMA E RETURNS ────────────────
#   Qui non lo usava NESSUNO dei tre DECLARE, ne' la firma, ne' il RETURNS.
#   Ora: `vendite.fatture.id%TYPE` e
#   `vendite.fatture_fondi_fattura_source.id%TYPE` in firma,
#   `vendite.fatture.totale_a_pagare%TYPE` in RETURNS e sul residuo,
#   `pagamenti.vendite_contabili_righe.importo%TYPE` sui due termini
#   contabili — che e' esattamente la colonna che quei due sommano.
#   ℹ️ Cade anche il `::NUMERIC` sulla somma: la variabile porta gia' il tipo
#   della colonna, e un cast nudo li' e' la stessa cosa che si sta togliendo.
#
#   ⚠️ Un `%TYPE` in firma e' una FOTOGRAFIA: se risolvesse a un tipo diverso
#   nascerebbe un OVERLOAD, e con un DEFAULT le chiamate diventerebbero
#   ambigue — questa funzione il DEFAULT ce l'ha. ✅ Verificato eseguendo la
#   forma nuova in una transazione annullata (2026-08-21): i tipi risolti sono
#   `bigint, bigint` e `numeric`, cioe' identici alla firma viva
#   (`pg_get_function_identity_arguments`), e il DEFAULT si conserva come
#   `DEFAULT NULL::bigint`.
#
# ── 🔵 CODA, come nel changeSet -52 ────────────────────────────────────
#   I due guard di parametro sollevano `E_PARAMETRO_INVALIDO` col NOME del
#   parametro come valore. Non si corregge qui: il gemello di `vendite` di
#   `E_PAGAMENTI_CHIAMATA_NON_VALIDA` e' una decisione di dominio, scritta
#   come domanda nel brief.
#
# Origine: corpo dalla doc auto-generata `dbzero` (l'oggetto vivo) col patch
#   mirato applicato sopra. Firma e RETURNS invariati.
# Verifica: db/pgtap/vendite/test-fondo-fattura-eseguito.sql (invariante)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260821-53-update-fn-saldo-sorgente-fondo-colonna-e-invariante-mctit.yaml

  - changeSet:
      id: 20260821-53-update-fn-saldo-sorgente-fondo-colonna-e-invariante
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Lo scorporo del contributo proprio si legge dalla colonna fondo_source_id (terzo e
        ultimo lettore del legame, S1-14) e l'assunzione su cui regge si scrive nel COMMENT
        (S1-9): lo scorporo somma le sole righe postabili, quindi vale finche' la riga e' in
        lavorazione — garanzia che arriva dal quarto stato del fondo, perche' un
        trasferimento registrato porta l'atto a ESEGUITO e nessun chiamante passa piu' di
        qui. La formula non cambia: cambia da dove legge il legame, e che l'assunzione ora
        e' scritta e presidiata. Tipi ancorati con %TYPE in firma, RETURNS e DECLARE, dove
        finora non li usava nessuno dei tre: verificato in transazione annullata che i tipi
        risolti sono identici alla firma viva, quindi nessun overload e DEFAULT conservato.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: pagamenti
                tableName: vendite_contabili_righe
                columnName: fondo_source_id
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_saldo_sorgente_fondo'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_saldo_sorgente_fondo(
                  p_fattura_sorgente_id vendite.fatture.id%TYPE,
                  p_source_id           vendite.fatture_fondi_fattura_source.id%TYPE DEFAULT NULL
              )
               RETURNS vendite.fatture.totale_a_pagare%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_saldo               vendite.fatture.totale_a_pagare%TYPE;
                  v_saldo_contabile_tot pagamenti.vendite_contabili_righe.importo%TYPE;
                  v_saldo_contabile_own pagamenti.vendite_contabili_righe.importo%TYPE;
              BEGIN
                  -- Guard di parametro: id nullo o non positivo e' un errore
                  -- del chiamante, non un caso da normalizzare in silenzio.
                  IF p_fattura_sorgente_id IS NULL OR p_fattura_sorgente_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_saldo_sorgente_fondo', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_sorgente_id', 'valore', p_fattura_sorgente_id),
                          NULL::uuid, 'p_fattura_sorgente_id obbligatorio e > 0');
                  END IF;

                  IF p_source_id IS NOT NULL AND p_source_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_saldo_sorgente_fondo', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_source_id', 'valore', p_source_id),
                          NULL::uuid, 'p_source_id se fornito deve essere > 0');
                  END IF;

                  -- Primo termine: il residuo per MOVIMENTI.
                  -- ⚠️ Oggi nessuna funzione del database scrive
                  --    pagamenti.vendite_movimenti, quindi questo termine vale
                  --    per costruzione totale_a_pagare. Diventera' vero con il
                  --    posting (slice 1 del cantiere incassi): la formula e'
                  --    scritta per quel giorno, non per oggi.
                  SELECT sf.saldo INTO v_saldo
                    FROM pagamenti.fn_get_saldo_fattura(p_fattura_sorgente_id) sf;

                  -- Secondo termine: quanto e' gia' in lavorazione sulla sorgente.
                  SELECT sc.saldo_contabile INTO v_saldo_contabile_tot
                    FROM pagamenti.fn_get_saldo_fattura_contabili(p_fattura_sorgente_id) sc;

                  -- =====================================================
                  -- Quota del secondo termine che appartiene a QUESTO fondo, e
                  -- che va restituita: e' cio' che il fondo ha gia' scritto sulla
                  -- sorgente, non un'altra copertura di cui tenere conto.
                  -- Senza p_source_id la somma e' su zero righe, cioe' zero.
                  --
                  -- ⭐ S1-14: il legame si legge dalla COLONNA. Cade anche il
                  --    filtro su meta->>'origine': era un secondo criterio per
                  --    dire la stessa cosa.
                  --
                  -- ⚠️ ASSUNZIONE (S1-9): la somma conta le sole righe
                  --    POSTABILI, quindi vale finche' la riga del fondo e' IN
                  --    LAVORAZIONE. Con una riga gia' registrata lo scorporo
                  --    verrebbe a zero e il residuo risulterebbe piu' basso del
                  --    vero. Non capita perche' un trasferimento registrato
                  --    porta l'atto a ESEGUITO, e tutti e tre i chiamanti
                  --    filtrano ASSEGNATO o DISPONIBILE: nessuno arriva qui con
                  --    un fondo eseguito.
                  -- =====================================================
                  SELECT COALESCE(SUM(cr.importo), 0) INTO v_saldo_contabile_own
                    FROM pagamenti.vendite_contabili_righe cr
                    JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                   WHERE cr.attivo IS TRUE
                     AND st.is_postabile IS TRUE
                     AND cr.fattura_id = p_fattura_sorgente_id
                     AND p_source_id IS NOT NULL
                     AND cr.fondo_source_id = p_source_id;

                  RETURN COALESCE(v_saldo, 0)
                       - (COALESCE(v_saldo_contabile_tot, 0) - COALESCE(v_saldo_contabile_own, 0));
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_saldo_sorgente_fondo(vendite.fatture.id%TYPE, vendite.fatture_fondi_fattura_source.id%TYPE)
              IS 'Residuo della fattura sorgente al netto del contributo gia'' dato dal fondo indicato: saldo(movimenti) - (saldo contabile postabile - quota di questo fondo). Lo scorporo dell''ultimo termine e'' il punto: se il fondo e'' gia'' passato di li'', la riga contabile che ha creato sulla sorgente e'' dentro il saldo contabile, e confrontarci il fondo stesso significherebbe chiedergli di coprire cio'' che copre lui. p_source_id assente = nessun contributo proprio (prima applicazione). ⭐ rev 2026-08-21 (cantiere incassi, lotto 3): la quota propria si riconosce dalla COLONNA pagamenti.vendite_contabili_righe.fondo_source_id (S1-14) e non piu'' da meta->>''fondo_source_id''; cade con essa il filtro su meta->>''origine'', che diceva la stessa cosa in un secondo modo. ⚠️ ASSUNZIONE, ora scritta (S1-9): lo scorporo somma le sole righe POSTABILI, quindi vale finche'' la riga del fondo e'' IN LAVORAZIONE. Su un fondo il cui trasferimento e'' gia'' REGISTRATO la sua riga non sarebbe piu'' contata (POSTATA non e'' postabile), lo scorporo verrebbe a zero e il residuo risulterebbe piu'' basso del vero — il fondo sembrerebbe non piu'' capiente. Non capita perche'' un trasferimento registrato porta l''atto a ESEGUITO (trigger pagamenti.trgfn_vendite_contabili_righe_marca_fondo_eseguito) e tutti e tre i chiamanti filtrano ASSEGNATO o DISPONIBILE. ⛔ Chi aggiungesse un quarto chiamante deve rispettare questa condizione: e'' l''invariante presidiata da db/pgtap/vendite/test-fondo-fattura-eseguito.sql. ⚠️ Deliberatamente NON STABLE: chiama due funzioni pagamenti.* dichiarate VOLATILE, e promettere stabilita'' su un valore che non lo e'' autorizza il planner a cache/inline sbagliati. Estratta il 2026-08-15 dalla copia inline di fn_sync_contabili_fondo_fattura (regola del 2, tre chiamanti previsti). D-3 di brief-db-fondo-fattura-ricalcolo-e-governo §8.2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⛔ Nessun ripristino automatico: la versione precedente cerca
              --    il legame dentro il meta, che dal changeSet -52 non viene
              --    piu' scritto. Lo scorporo tornerebbe a zero su ogni fondo,
              --    in silenzio. Si torna indietro solo insieme a -48 e -52.
              SELECT 1;
