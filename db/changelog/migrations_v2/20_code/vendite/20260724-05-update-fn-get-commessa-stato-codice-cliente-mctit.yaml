# Testata commessa identificabile: + commessa_codice, + cliente_display
#   (brief-db-guard-uscita-commessa-e-capabilities §3.6, D6)
#
# PROBLEMA: il drawer di gestione commessa puo' mostrare solo #<PK>, mentre la
#   lista mostra commessa_codice: l'operatore non riesce a correlare le due
#   viste della stessa commessa. Manca anche il nome del cliente.
#
# RIUSO, NON REINVENZIONE: cliente_display e' la STESSA espressione gia' viva in
#   vendite.vw_dash_competenza_attivita — anagrafiche.soggetti.ragione_sociale_completa
#   raggiunta via billing_account -> soggetti_ruoli -> soggetti. Non si conia una
#   seconda definizione di "nome del cliente".
#
# TRABOCCHETTO DI NAMING: la funzione ritorna GIA' 'stato_commessa' = sc.codice,
#   cioe' il codice dello STATO. La colonna nuova e' c.codice, il codice della
#   COMMESSA, e si chiama commessa_codice (come nella lista). Chiamarla 'codice'
#   creerebbe ambiguita' proprio dove il BE lamenta la non-correlabilita'.
#
# DROP + CREATE OBBLIGATORIO: PostgreSQL non consente di cambiare il tipo di
#   ritorno di una funzione con CREATE OR REPLACE, e RETURNS TABLE fa parte del
#   tipo di ritorno. Verificato: NESSUN oggetto DB dipende da questa funzione
#   (nessuna vista, nessuna altra funzione la richiama).
#
# IMPATTO BE NULLO: commesse_repository.get_commessa_stato seleziona COLONNE
#   NOMINATE (non SELECT *), quindi l'aggiunta e' additiva e non rompe il mapping
#   posizionale esistente. Le due colonne nuove sono in CODA alla RETURNS TABLE,
#   la posizione piu' sicura per eventuali consumatori posizionali futuri.
#   Al BE resta solo da estendere CommessaStatoResult per esporle.
#
# LEFT JOIN obbligatori: un billing_account senza soggetto risolto non deve far
#   sparire la riga di stato della commessa (cliente_display esce NULL).
# Base: doc auto-gen docs/it/dbzero/vendite/funzioni/fn_get_commessa_stato.md.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260724-05-update-fn-get-commessa-stato-codice-cliente-mctit.yaml

  - changeSet:
      id: 20260724-05-update-fn-get-commessa-stato-codice-cliente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_get_commessa_stato: + commessa_codice (c.codice) e + cliente_display
        (ragione_sociale_completa via BA->SR->soggetti, stessa espressione della
        vista di competenza). DROP+CREATE perche' cambia la RETURNS TABLE.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- RETURNS TABLE fa parte del tipo di ritorno: CREATE OR REPLACE non
              -- basta, serve DROP. Nessun dipendente DB (verificato).
              DROP FUNCTION IF EXISTS vendite.fn_get_commessa_stato(bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_get_commessa_stato(
                  p_commessa_id vendite.commesse.id%TYPE
              )
               RETURNS TABLE(
                 -- %TYPE ovunque la colonna di ritorno specchi una colonna reale:
                 -- il tipo resta agganciato alla tabella invece di essere una copia
                 -- che si scolla al primo ALTER. Restano tipi espliciti solo i
                 -- contatori (aggregati, non specchiano nessuna colonna).
                 commessa_id                 vendite.commesse.id%TYPE,
                 stato_commessa_id           vendite.commesse.stato_commessa_id%TYPE,
                 stato_commessa              vendite.stati_commessa.codice%TYPE,
                 chiude_commessa             vendite.stati_commessa.chiude_commessa%TYPE,
                 emittibile                  vendite.stati_commessa.emittibile%TYPE,
                 modificabile                vendite.stati_commessa.modificabile%TYPE,
                 policy_fatturazione         vendite.commesse.policy_fatturazione%TYPE,
                 fatturazione_immediata      vendite.commesse.fatturazione_immediata%TYPE,
                 priorita_operativa          vendite.commesse.priorita_operativa%TYPE,
                 billing_account_id          vendite.commesse.billing_account_id%TYPE,
                 utility_id                  vendite.commesse.utility_id%TYPE,
                 emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                 total_attivita              BIGINT,
                 total_approvate             BIGINT,
                 total_non_approvate         BIGINT,
                 total_emesse                BIGINT,
                 total_non_emesse            BIGINT,
                 total_prezzo_da_riallineare BIGINT,
                 last_update                 vendite.commesse.data_update%TYPE,
                 commessa_codice             vendite.commesse.codice%TYPE,
                 cliente_display             anagrafiche.soggetti.ragione_sociale_completa%TYPE)
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- Guard: parametro obbligatorio
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_commessa_stato', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_commessa_id', 'valore', p_commessa_id),
                          NULL::uuid, 'p_commessa_id obbligatorio e > 0'
                      );
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM vendite.commesse c WHERE c.id = p_commessa_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_commessa_stato', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id),
                          NULL::uuid, concat('commessa_id ', p_commessa_id)
                      );
                  END IF;

                  RETURN QUERY
                  SELECT
                      c.id AS commessa_id,
                      c.stato_commessa_id,
                      sc.codice AS stato_commessa,
                      sc.chiude_commessa,
                      sc.emittibile,
                      sc.modificabile,
                      c.policy_fatturazione,
                      c.fatturazione_immediata,
                      c.priorita_operativa,
                      c.billing_account_id,
                      c.utility_id,
                      c.emittente_soggetto_ruolo_id,
                      COALESCE(count(ca.id), 0)::BIGINT AS total_attivita,
                      COALESCE(count(*) FILTER (WHERE ca.stato_approvazione = 'APPROVATA'), 0)::BIGINT,
                      COALESCE(count(*) FILTER (WHERE ca.stato_approvazione <> 'APPROVATA'), 0)::BIGINT,
                      COALESCE(count(*) FILTER (WHERE ca.stato_emissione = 'EMESSA'), 0)::BIGINT,
                      COALESCE(count(*) FILTER (WHERE ca.stato_emissione <> 'EMESSA'), 0)::BIGINT,
                      COALESCE(count(*) FILTER (WHERE ca.prezzo_da_riallineare IS TRUE), 0)::BIGINT,
                      GREATEST(c.data_update, COALESCE(max(ca.data_update), c.data_update)),
                      -- rev 2026-07-24: identificazione della testata.
                      -- ATTENZIONE: 'stato_commessa' qui sopra e' sc.codice (codice
                      -- dello STATO); questo e' c.codice, il codice della COMMESSA.
                      -- Nomi distinti di proposito.
                      c.codice AS commessa_codice,
                      -- Stessa espressione di vw_dash_competenza_attivita: una sola
                      -- definizione di "nome del cliente" in tutto il dominio.
                      s.ragione_sociale_completa AS cliente_display
                  FROM vendite.commesse c
                  JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id
                  LEFT JOIN vendite.commesse_attivita ca ON ca.commessa_id = c.id
                  -- LEFT: un BA senza soggetto risolto non deve far sparire la riga
                  -- di stato (cliente_display esce NULL, la testata resta leggibile).
                  LEFT JOIN anagrafiche.billing_account ba ON ba.id = c.billing_account_id
                  LEFT JOIN anagrafiche.soggetti_ruoli sr  ON sr.id = ba.soggetto_ruolo_id
                  LEFT JOIN anagrafiche.soggetti s         ON s.id  = sr.soggetto_id
                  WHERE c.id = p_commessa_id
                  GROUP BY c.id, c.stato_commessa_id, sc.codice, sc.chiude_commessa,
                           sc.emittibile, sc.modificabile, c.policy_fatturazione,
                           c.fatturazione_immediata, c.priorita_operativa,
                           c.billing_account_id, c.utility_id,
                           c.emittente_soggetto_ruolo_id, c.data_update,
                           c.codice, s.ragione_sociale_completa;
              END;
              $function$;

              -- COMMENT e DROP esigono tipi RISOLTI: qui il %TYPE non si usa.
              COMMENT ON FUNCTION vendite.fn_get_commessa_stato(bigint)
              IS 'Stato testata commessa con flag operativi e contatori attivita in singolo round-trip. rev 2026-07-24 (brief-db-guard-uscita-commessa-e-capabilities D6): + commessa_codice (c.codice — da non confondere con stato_commessa, che e'' il codice dello STATO) e + cliente_display (anagrafiche.soggetti.ragione_sociale_completa via billing_account->soggetti_ruoli->soggetti, STESSA espressione di vw_dash_competenza_attivita). Senza di questi il drawer mostrava #<PK> mentre la lista mostra il codice: non correlabili dall''operatore. LEFT JOIN sulla catena cliente: un BA senza soggetto non fa sparire la riga.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: la RETURNS TABLE cambia, quindi si rimuove la funzione.
              -- La versione a 18 colonne va ri-applicata dal changeset precedente.
              DROP FUNCTION IF EXISTS vendite.fn_get_commessa_stato(bigint);
