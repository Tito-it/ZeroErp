# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 2a (le testate): vendite.fn_doc_fornitura_sede
#   Brief: brief-db-grammatica-unica-documenti §11 (G-1, G-4 di Tid; L2-1 del
#   2026-10-19: il lotto 2 in cinque sotto-giri, questo e' il primo).
#
#   La grammatica delle testate (V3 del censimento) passa ai codici di
#   config.sorgenti: DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA,
#   OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL.
#   PREVENTIVO, CONTRATTO, COMMESSA, FATTURA sono gia' i codici delle sorgenti.
#
#   p_documento era un text nudo «senza colonna-vocabolario»: col lotto 0 la
#   colonna c'e', config.sorgenti.codice_interno, e il parametro si ancora
#   li' (%TYPE in firma). Il tipo passa da text a character varying: la firma
#   cambia, quindi DROP + CREATE (un CREATE OR REPLACE lascerebbe due
#   overload). Nessun dipendente registrato in pg_depend (verificato su dbdev,
#   2026-10-19); i chiamanti plpgsql si risolvono a runtime, il backend passa
#   il codice come parametro semplice.
#
#   Corpo dalla definizione viva (dbdev, 2026-10-19); firma e RETURNS
#   dall'ultimo YAML che li ha ancorati (20261012-34); proprieta' (volatilita',
#   SECURITY, SET search_path) dal catalogo vivo, ripetute. COMMENT vivo con la
#   nota di revisione in coda.
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-48-update-fn-doc-fornitura-sede-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-48-update-fn-doc-fornitura-sede-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_doc_fornitura_sede: p_documento e' il codice della sorgente, ancorato a config.sorgenti.codice_interno (DROP + CREATE). Grammatica unica, lotto 2a.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_doc_fornitura_sede(text);

              CREATE FUNCTION vendite.fn_doc_fornitura_sede(
                  p_documento config.sorgenti.codice_interno%TYPE)
              RETURNS TABLE (
                  schema_tabella    pg_catalog.pg_namespace.nspname%TYPE,
                  testata           pg_catalog.pg_class.relname%TYPE,
                  colonna_etichetta pg_catalog.pg_attribute.attname%TYPE,
                  tabella           pg_catalog.pg_class.relname%TYPE,
                  colonna_fk        pg_catalog.pg_attribute.attname%TYPE,
                  etichetta         text)
              LANGUAGE plpgsql
              IMMUTABLE
              SECURITY INVOKER
              AS $function$

              -- ⚠️ Tipi nudi DICHIARATI: p_documento e' un selettore senza colonna
              --   di vocabolario (lo stesso di script.fn_get_stato_testata_documento);
              --   etichetta e' la parola che l'operatore legge, senza colonna.
              --   Schema, tabelle e colonne sono nomi del catalogo: ancorati li'.
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dove stanno la testata e la scheda di fornitura di un
                  --   documento. Zero righe = selettore ignoto (o documento
                  --   senza scheda di fornitura): decide il chiamante.
                  -- ⭐ IMMUTABLE: e' una mappa scritta qui, non legge tabelle.
                  -- =========================================================
                  RETURN QUERY
                  SELECT v.s::name, v.te::name, v.et::name, v.t::name, v.fk::name, v.lbl
                    FROM (VALUES
                        ('CONTRATTO', 'vendite', 'contratti',           'numero', 'contratti_utilities',           'contratto_id', 'Contratto'),
                        ('OFFERTA_COMMERCIALE', 'vendite', 'offerte_commerciali', 'codice', 'offerte_commerciali_utilities', 'offerta_id',   'Offerta')
                    ) AS v(doc, s, te, et, t, fk, lbl)
                   WHERE v.doc = p_documento;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_doc_fornitura_sede(config.sorgenti.codice_interno%TYPE) IS
                'Dove sta la scheda di fornitura (1:1) di un documento: lo schema, la testata e la sua colonna leggibile (numero o codice), la tabella della scheda e la sua colonna verso la testata, e la parola che l''operatore legge (Contratto, Offerta). Selettore: CONTRATTO, OFFERTA (il vocabolario di script.fn_get_stato_testata_documento); il preventivo non ha scheda di fornitura. Zero righe = selettore ignoto, decide il chiamante. Schema e nomi separati, non regclass: finiscono in un format(%I), e il testo di un regclass dipende dal search_path. La usano vendite.fn_doc_fornitura_da_anagrafica, il guard vendite.trgfn_doc_fornitura_guard_coppia e il trigger vendite.trgfn_doc_fornitura_segue_cliente. Gemella di script.fn_doc_indirizzi_sede. Brief: brief-db-indirizzi-documento-seguono-il-cliente (§8.4). ⭐ rev 2026-10-19 (20261019-48, brief-db-grammatica-unica-documenti lotto 2a, G-1 di Tid): la grammatica delle testate passa ai codici delle sorgenti (DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL; PREVENTIVO, CONTRATTO, COMMESSA, FATTURA invariati); dove sopra si legge un codice corto come selettore, oggi vale il codice della sorgente. p_documento ancorato a config.sorgenti.codice_interno%TYPE: la firma passa da text a character varying (DROP + CREATE, nessun dipendente registrato).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_doc_fornitura_sede(config.sorgenti.codice_interno%TYPE);

              CREATE FUNCTION vendite.fn_doc_fornitura_sede(
                  p_documento text)
              RETURNS TABLE (
                  schema_tabella    pg_catalog.pg_namespace.nspname%TYPE,
                  testata           pg_catalog.pg_class.relname%TYPE,
                  colonna_etichetta pg_catalog.pg_attribute.attname%TYPE,
                  tabella           pg_catalog.pg_class.relname%TYPE,
                  colonna_fk        pg_catalog.pg_attribute.attname%TYPE,
                  etichetta         text)
              LANGUAGE plpgsql
              IMMUTABLE
              SECURITY INVOKER
              AS $function$

              -- ⚠️ Tipi nudi DICHIARATI: p_documento e' un selettore senza colonna
              --   di vocabolario (lo stesso di script.fn_get_stato_testata_documento);
              --   etichetta e' la parola che l'operatore legge, senza colonna.
              --   Schema, tabelle e colonne sono nomi del catalogo: ancorati li'.
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dove stanno la testata e la scheda di fornitura di un
                  --   documento. Zero righe = selettore ignoto (o documento
                  --   senza scheda di fornitura): decide il chiamante.
                  -- ⭐ IMMUTABLE: e' una mappa scritta qui, non legge tabelle.
                  -- =========================================================
                  RETURN QUERY
                  SELECT v.s::name, v.te::name, v.et::name, v.t::name, v.fk::name, v.lbl
                    FROM (VALUES
                        ('CONTRATTO', 'vendite', 'contratti',           'numero', 'contratti_utilities',           'contratto_id', 'Contratto'),
                        ('OFFERTA',   'vendite', 'offerte_commerciali', 'codice', 'offerte_commerciali_utilities', 'offerta_id',   'Offerta')
                    ) AS v(doc, s, te, et, t, fk, lbl)
                   WHERE v.doc = p_documento;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_doc_fornitura_sede(text) IS
                'Dove sta la scheda di fornitura (1:1) di un documento: lo schema, la testata e la sua colonna leggibile (numero o codice), la tabella della scheda e la sua colonna verso la testata, e la parola che l''operatore legge (Contratto, Offerta). Selettore: CONTRATTO, OFFERTA (il vocabolario di script.fn_get_stato_testata_documento); il preventivo non ha scheda di fornitura. Zero righe = selettore ignoto, decide il chiamante. Schema e nomi separati, non regclass: finiscono in un format(%I), e il testo di un regclass dipende dal search_path. La usano vendite.fn_doc_fornitura_da_anagrafica, il guard vendite.trgfn_doc_fornitura_guard_coppia e il trigger vendite.trgfn_doc_fornitura_segue_cliente. Gemella di script.fn_doc_indirizzi_sede. Brief: brief-db-indirizzi-documento-seguono-il-cliente (§8.4).';
