# NUOVO: il guard dell'articolo ammesso sulla promo (Lotto 4, D-6)
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 D-6; §9.4)
#
#   vendite.promo_articoli prende lo stesso guard di tabella delle righe di
#   documento, script.trgfn_righe_guard_articolo_ammesso, col documento
#   PROMO_ARTICOLO: solleva il primo motivo di script.fn_check_articolo_riga
#   (solo componente: E_PROMO_ARTICOLO_SOLO_COMPONENTE, 20261014-02).
#   TG_ARGV[1] = 'id': la promo non ha un padre, il «documento» e' la promo
#   stessa (la voce PROMO_ARTICOLO di config.tipi_entita ha key_selector id).
#   La check non lo legge; il guard lo mette nel contesto dell'errore.
#   BEFORE INSERT OR UPDATE OF articolo_id. Le promo gia' scritte: un
#   articolo con una promo e' USATO (catalogo.fn_articolo_usato, A-10: la
#   promo lo punta con una FK), quindi is_solo_componente non si accende piu'
#   dopo. Il nome sta fra _a10_date_validita e _a10_guard_data_driven: prima
#   l'articolo, poi le date della promo.
#   Il COMMENT del guard elenca i montaggi: riscritto (mancava anche
#   vendite.listini_righe, dal 20261013-61).
#   Trigger scritto a mano, non da ci_apply (linee-guida-sql §11.5).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261014-05-create-trigger-promo-articoli-guard-articolo-ammesso-mctit.yaml

  - changeSet:
      id: 20261014-05-create-trigger-promo-articoli-guard-articolo-ammesso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta script.trgfn_righe_guard_articolo_ammesso su vendite.promo_articoli (PROMO_ARTICOLO,
        D-6) e ne riscrive il COMMENT coi montaggi di oggi. Brief:
        brief-db-articoli-ammessi-per-documento (§9.4).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >-
              SELECT count(*) FROM pg_trigger t
               WHERE t.tgname = 'trg_promo_articoli_a10_guard_articolo_ammesso_ins_upd'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_promo_articoli_a10_guard_articolo_ammesso_ins_upd
                  BEFORE INSERT OR UPDATE OF articolo_id
                  ON vendite.promo_articoli
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_righe_guard_articolo_ammesso('PROMO_ARTICOLO', 'id');

              COMMENT ON FUNCTION script.trgfn_righe_guard_articolo_ammesso()
              IS 'BB guard BEFORE INSERT OR UPDATE OF articolo_id sulle righe che scelgono un articolo: vendite.preventivi_righe, vendite.ordini_righe, vendite.ddt_righe; dal 20261013-57 vendite.offerte_commerciali_eccezioni e vendite.contratti_righe; dal 20261013-61 vendite.listini_righe (LISTINO_VERSIONE, anche UPDATE OF listino_versione_id); dal 20261014-05 vendite.promo_articoli (PROMO_ARTICOLO, TG_ARGV[1] = id: la promo non ha un padre). Solleva il primo motivo di script.fn_check_articolo_riga (il predicato sta nella check: linee-guida-sql §12.5.2), passando la natura della riga e il suo tipo d''eccezione, letti da to_jsonb(NEW) (ognuno c''e'' solo sulle sue tabelle). Campo: quello del primo motivo, o articolo_id. TG_ARGV[0]: documento (codice di config.tipi_entita); TG_ARGV[1]: colonna del padre. Su preventivo, ordine e bolla e'' montato DOPO script.trgfn_righe_natura_vendita (_a10_natura_vendita < _a10_regole_articolo); su offerta e contratto PRIMA dei guard di riga (_a10_guard_articolo_ammesso < _a10_guard_erogazione_*): prima i motivi dell''articolo, poi quelli della riga; sulla promo prima del guard delle date (_a10_guard_articolo_ammesso < _a10_guard_data_driven). La riconsegna e'' esente (A-6): con la porta zeroerp.ddt_riconsegna = id del reso, accesa da vendite.fn_genera_ddt_riconsegna, una riga di bolla passa se il suo articolo e'' fra le righe di quel reso; la porta e'' stretta sugli articoli del reso perche'' il verbo e'' SECURITY INVOKER. La distinta ha il suo guard (catalogo.trgfn_articoli_componenti_guard_componente: padre uuid). Il picker catalogo.fn_articoli_ammessi da'' lo stesso motivo prima della scelta. Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-2, A-6, D-6; §9.3.3, §9.4).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_promo_articoli_a10_guard_articolo_ammesso_ins_upd ON vendite.promo_articoli;
              -- ⚠️ Il COMMENT del guard non torna da solo: e' quello del 20261013-56.
