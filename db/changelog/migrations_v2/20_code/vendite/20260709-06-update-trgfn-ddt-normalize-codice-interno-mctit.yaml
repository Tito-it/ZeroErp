# C1 / §7 — trgfn_ddt_normalize: lookup sorgente per codice_interno.
#
# La normalize eredita billing_account_id/utility_id/valuta_id dall'ordine
# sorgente quando ddt.sorgente_tipo_id punta a ORDINE_VENDITA. La versione
# precedente risolveva la sorgente per `codice` (colonna MUTABILE dall'utente):
# fragile (linee-guida-sql §6c/§6d, BUG_DUAL). Si allinea a `codice_interno`
# (immutabile), coerente con fn_list_ddt_da_pushare (rev 2026-06-28).
#
# NB C1: e' questa la condizione per cui fn_genera_ddt_da_ordine DEVE scrivere
# sorgente_tipo_id = ORDINE_VENDITA (non DDT_VENDITA): con un altro codice
# l'eredita' billing non scatterebbe (bug silenzioso).
#
# CREATE OR REPLACE (runOnChange). Corpo preso dalla doc auto-gen viva
# (AGENTS.md: mai dallo YAML stale), unica modifica: codice -> codice_interno.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260709-06-update-trgfn-ddt-normalize-codice-interno-mctit.yaml

  - changeSet:
      id: 20260709-06-update-trgfn-ddt-normalize-codice-interno
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        CREATE OR REPLACE vendite.trgfn_ddt_normalize: risolve la sorgente
        ORDINE_VENDITA per codice_interno (immutabile) invece che per codice
        (mutabile). Robustezza lookup (C1/§7). Nessun cambio di firma/trigger.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: ddt
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_normalize()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Normalizzazione campi DDT su INSERT e UPDATE.
                --
                -- Regole:
                --   1. Imposta anno/data se numero presente e valori mancanti (INSERT).
                --   2. Eredita billing_account_id, utility_id, valuta_id dall'ordine
                --      sorgente (via sorgente_uid) se non gia` valorizzati (INSERT).
                --      Sorgente risolta per codice_interno (immutabile) — rev 2026-07-09.
                -- =========================================================

                ----------------------------------------------------------------
                -- 1. Imposta anno/data se numero e' presente e anno/data mancanti
                IF TG_OP = 'INSERT' AND (NEW.numero IS NOT NULL AND btrim(NEW.numero) <> '') THEN
                  IF NEW.anno IS NULL OR NEW.anno = 0 THEN
                    NEW.anno := EXTRACT(YEAR FROM CURRENT_DATE)::smallint;
                  END IF;
                  IF NEW.data IS NULL THEN
                    NEW.data := CURRENT_DATE;
                  END IF;
                END IF;

                ----------------------------------------------------------------
                -- 2. Eredita billing fields da ordine sorgente (se DDT creato da ordine)
                --    sorgente_tipo_id punta a config.sorgenti; sorgente_uid = ordini.uid
                IF TG_OP = 'INSERT'
                   AND NEW.sorgente_tipo_id IS NOT NULL
                   AND NEW.sorgente_uid IS NOT NULL
                   AND (NEW.billing_account_id IS NULL
                        OR NEW.utility_id IS NULL
                        OR NEW.valuta_id IS NULL)
                THEN
                  -- Verifica che la sorgente sia ORDINE_VENDITA e eredita i campi mancanti.
                  -- Lookup per codice_interno (immutabile), non per codice.
                  IF EXISTS (
                    SELECT 1 FROM config.sorgenti
                    WHERE id = NEW.sorgente_tipo_id AND codice_interno = 'ORDINE_VENDITA'
                  ) THEN
                    SELECT
                      COALESCE(NEW.billing_account_id, o.billing_account_id),
                      COALESCE(NEW.utility_id, ba.utility_id),
                      COALESCE(NEW.valuta_id, o.valuta_id)
                    INTO
                      NEW.billing_account_id,
                      NEW.utility_id,
                      NEW.valuta_id
                    FROM vendite.ordini o
                    LEFT JOIN anagrafiche.billing_account ba
                      ON ba.id = o.billing_account_id
                    WHERE o.uid = NEW.sorgente_uid
                    LIMIT 1;
                  END IF;
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_normalize()
              IS 'Normalize: imposta anno/data se numero presente. Eredita billing_account_id, utility_id, valuta_id da ordine sorgente (ORDINE_VENDITA, lookup per codice_interno) su INSERT se non gia` valorizzati. rev 2026-07-09.';
      rollback:
        - empty
