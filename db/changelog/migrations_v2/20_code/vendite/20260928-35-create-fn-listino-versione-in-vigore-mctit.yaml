# ------------------------------------------------------------
# LA SEDE UNICA della versione di listino in vigore a una data.
#
# -- IL DIFETTO -------------------------------------------------------
#   «Quale versione di questo listino vale in questa data» era scritta sette
#   volte in sei funzioni (censimento del 2026-09-28, brief §8.15): cinque ne
#   sceglievano UNA (`ORDER BY stato = 'ATTIVA' DESC LIMIT 1`), due guardavano
#   TUTTE quelle valide (`EXISTS`). Oggi davano quasi sempre la stessa
#   risposta, ma lo schema ammetteva il caso in cui divergevano.
#
# -- PERCHE' ORA LA RISPOSTA E' UNA SOLA ------------------------------------
#   Decisione di Tid, 2026-09-28: «le versioni valide oggi», e il buco si chiude.
#     · 20260928-33: nessuna sovrapposizione fra versioni ATTIVE **e CHIUSE**;
#     · 20260928-34: le date di una CHIUSA non si modificano piu'.
#   ⇒ per ogni data le versioni ATTIVA/CHIUSA valide sono AL PIU' UNA, per
#   costruzione. «Una» e «tutte le valide» sono la stessa cosa, e questa
#   funzione restituisce quella, o NULL.
#   ⚠️ La funzione non ordina ne' limita: se un giorno le righe fossero due, il
#   difetto sarebbe il vincolo, e va corretto li'.
#
# -- LA REGOLA ------------------------------------------------------------
#   Versione dello stesso listino, `attivo`, stato ATTIVA o CHIUSA (la BOZZA non
#   e' operativa: «Bug A»), la cui `validita` contiene la data.
#
# -- FORMA ---------------------------------------------------------------
#   · STABLE, SECURITY INVOKER: legge con i diritti di chi chiama, come le sei
#     funzioni che la usano;
#   · plpgsql, non LANGUAGE sql: il presidio dei riferimenti morti compila solo
#     il plpgsql (una sql a stringa sarebbe opaca);
#   · `p_data` a tipo esplicito `date`: e' la data di riferimento del chiamante
#     (oggi, o la data del documento), non il riflesso di una colonna.
#
# Consumatori (20260928-36 -> -41): fn_check_esclusione_articolo_contratto,
#   trgfn_contratti_righe_guard_aggiunta_fuori_listino,
#   trgfn_contratti_freeze_listino_versione, fn_contratto_righe_preview,
#   fn_offerta_righe_espanse, fn_resolve_prezzo_listino_v2_esito.
# Cantiere: brief-db-liste-righe-documento §8.15, passo c)
# Verifica: db/pgtap/vendite/test-listino-versione-in-vigore-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-35-create-fn-listino-versione-in-vigore-mctit.yaml

  - changeSet:
      id: 20260928-35-create-fn-listino-versione-in-vigore
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce vendite.fn_listino_versione_in_vigore(listino, data): la versione ATTIVA o
        CHIUSA, attiva, che contiene la data — al piu' una per costruzione (vincolo esteso
        e date delle chiuse bloccate). Sede unica delle sette copie della regola.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_listino_versione_in_vigore(
                  p_listino_id vendite.listini.id%TYPE,
                  -- ⚠️ Tipo esplicito: la data di riferimento del chiamante (oggi o
                  --    la data del documento), non il riflesso di una colonna.
                  p_data       date
              )
              RETURNS vendite.listini_versioni.id%TYPE
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: la versione del listino in vigore alla data: ATTIVA o CHIUSA
              --   (la BOZZA non e' operativa), attiva, la cui validita' contiene la
              --   data. NULL se non ce n'e' una.
              -- ⭐ Al piu' UNA per costruzione: ex_listini_versioni_no_overlap vale
              --   per ATTIVA e CHIUSA, e le date di una CHIUSA sono bloccate
              --   (trgfn_listini_versioni_guard_date_chiusa). Per questo qui non si
              --   ordina ne' si limita.
              DECLARE
                  v_versione_id vendite.listini_versioni.id%TYPE;
              BEGIN
                  SELECT lv.id
                    INTO v_versione_id
                    FROM vendite.listini_versioni lv
                   WHERE lv.listino_id = p_listino_id
                     AND lv.attivo IS TRUE
                     AND lv.stato IN ('ATTIVA', 'CHIUSA')
                     AND lv.validita @> p_data;

                  RETURN v_versione_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_listino_versione_in_vigore(
                  vendite.listini.id%TYPE, date) IS
                  'La versione di un listino in vigore a una data: ATTIVA o CHIUSA (la BOZZA non e'' '
                  'operativa), attiva, la cui validita'' contiene la data; NULL se non ce n''e''. Sede '
                  'UNICA dal 2026-09-28 (brief-db-liste-righe-documento §8.15): la regola era scritta '
                  'sette volte in sei funzioni, cinque che ne sceglievano una e due che le guardavano '
                  'tutte. Decisione di Tid: «le versioni valide oggi», e il buco chiuso — '
                  'ex_listini_versioni_no_overlap vale per ATTIVA e CHIUSA, e le date di una CHIUSA '
                  'non si modificano (trgfn_listini_versioni_guard_date_chiusa) — quindi la versione '
                  'valida e'' al piu'' una per costruzione e la funzione non ordina ne'' limita. '
                  'STABLE, SECURITY INVOKER.';

              GRANT EXECUTE ON FUNCTION vendite.fn_listino_versione_in_vigore(
                  vendite.listini.id%TYPE, date) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Solo dopo il rollback dei consumatori (20260928-36 -> -41).
              DROP FUNCTION IF EXISTS vendite.fn_listino_versione_in_vigore(
                  vendite.listini.id%TYPE, date);
