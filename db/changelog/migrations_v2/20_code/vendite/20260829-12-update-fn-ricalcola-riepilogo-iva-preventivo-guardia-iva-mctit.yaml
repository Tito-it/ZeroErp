# I9 (Fase 1) del brief brief-db-be-iva-risolutore-e-regime-cliente — meta'
# PREVENTIVI, pezzo aggiunto in corsa. Decisione di Tid del 2026-08-29.
#
# ⛔ LA PREMESSA DEL BRIEF ERA SBAGLIATA, e si e' visto solo provando. Il §R-3
#   diceva «lo stesso difetto silenzioso e' aperto su ordini e preventivi». Sui
#   preventivi NON e' silenzioso: una riga senza aliquota non si riesce nemmeno
#   a SALVARE. Il trigger AFTER trg_preventivi_righe_z90_ricalcola_totali chiama
#   questa funzione, che chiama config.fn_get_aliquota_iva(NULL, ...) — e quella
#   SOLLEVA invece di ritornare NULL. L'INSERT fallisce con
#   «Parametro non valido: p_iva_id obbligatorio e > 0».
#
# ⚠️ Il COALESCE che c'era NON proteggeva niente: per proteggere avrebbe dovuto
#   ricevere un NULL, e il NULL non arriva mai perche' la funzione solleva prima.
#   E' un COALESCE che sembra una guardia e non lo e'.
#
# ⭐ E NON ERA UNA DECISIONE DI DOMINIO, era una svista: le viste gemelle la
#   guardia ce l'hanno — vw_ordini_righe_iva_base scrive
#   `CASE WHEN r.iva_id IS NOT NULL THEN config.fn_get_aliquota_iva(...)`, e la
#   gemella dei DDT pure. Solo questa funzione no.
#
# ⭐ Il comportamento risultante divergeva da DDT e ordini su tre punti, tutti
#   contrari a quanto deciso in questo cantiere:
#     1. il vincolo scattava in BOZZA, al salvataggio, mentre la regola decisa e'
#        «la bozza resta libera, il cancello e' dove il documento diventa
#        autorevole»;
#     2. il messaggio nominava un PARAMETRO PL/pgSQL a un operatore che stava
#        salvando una riga — cio' che AGENTS.md vieta nel VARIADIC;
#     3. l'errore arrivava da una funzione di catalogo tre livelli sotto l'azione.
#
# ⛔ QUESTO CHANGESET NON SI APPLICA DA SOLO. Aprendo la strada, una riga senza
#   aliquota entrerebbe nel riepilogo con imponibile pieno e imposta zero: e' il
#   difetto che il cancello all'EMISSIONE chiude (20260829-10, Regola 2, via
#   script.fn_check_preventivo_emettibile). Le due cose sono UNA slice.
#
# ⚠️ LA GEMELLA SULLE FATTURE NON E' TOCCATA, ed e' una scelta.
#   vendite.fn_ricalcola_riepilogo_iva_fattura ha lo stesso COALESCE senza
#   guardia e lo stesso difetto latente, ma li' NON esiste ancora un cancello
#   IVA all'emissione: togliere il raise scambierebbe un errore rumoroso con un
#   numero sbagliato silenzioso, cioe' il contrario di cio' che questo cantiere
#   fa. Va fatto insieme a I4, quando la riga di fattura ri-risolve l'aliquota.
#
# Base: corpo vivo da docs/it/dbzero/vendite/funzioni/fn_ricalcola_riepilogo_iva_preventivo.md,
#   patchato meccanicamente. ⚠️ FIRMA con %TYPE ripresa dall'ultimo YAML:
#   l'auto-gen la scioglie in bigint. Nel COMMENT ON il tipo resta concreto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260829-12-update-fn-ricalcola-riepilogo-iva-preventivo-guardia-iva-mctit.yaml

  - changeSet:
      id: 20260829-12-update-fn-ricalcola-riepilogo-iva-preventivo-guardia-iva
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_ricalcola_riepilogo_iva_preventivo: aggiunta la guardia
        `iva_id IS NOT NULL` che le viste gemelle avevano già. Senza, una riga di
        preventivo senza aliquota non si poteva nemmeno salvare, perché
        fn_get_aliquota_iva solleva su NULL. Va applicato INSIEME a 20260829-10,
        che mette il cancello all'emissione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_check_preventivo_emettibile'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ricalcola_riepilogo_iva_preventivo(
                  p_preventivo_id vendite.preventivi.id%TYPE
              )
               RETURNS TABLE(deleted_rows integer, inserted_rows integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: ricalcola il riepilogo IVA per preventivo,
              -- pattern speculare a fn_ricalcola_riepilogo_iva_fattura.
              -- Aggrega per (iva_id, natura_id, esigibilita, split_payment)
              -- - per preventivi gli ultimi 3 sono sempre NULL oggi -
              -- e applica ROUND a 2 decimali sulla SUM imponibili,
              -- mai per riga. Override aliquota da stato emittente via
              -- config.fn_get_aliquota_iva (allineamento fatture).
              DECLARE
                  v_deleted_rows       integer := 0;
                  v_inserted_rows      integer := 0;
                  v_stato_emittente_id anagrafiche.soggetti.stato_id%TYPE;
              BEGIN
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'fn_ricalcola_riepilogo_iva_preventivo',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_preventivo_id', 'valore', p_preventivo_id),
                          NULL::uuid,
                          'p_preventivo_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera stato emittente per override aliquota IVA.
                  -- Chain: preventivi -> emittenti_fiscali -> soggetti_ruoli -> soggetti.
                  -- Se preventivo non ha emittente o catena non risolve,
                  -- v_stato_emittente_id resta NULL e fn_get_aliquota_iva
                  -- ritorna l'aliquota base.
                  SELECT s.stato_id
                    INTO v_stato_emittente_id
                    FROM vendite.preventivi p
                    JOIN anagrafiche.emittenti_fiscali ef
                      ON ef.id = p.emittente_fiscale_id
                    JOIN anagrafiche.soggetti_ruoli sr
                      ON sr.id = ef.soggetto_ruolo_id
                    JOIN anagrafiche.soggetti s
                      ON s.id = sr.soggetto_id
                   WHERE p.id = p_preventivo_id;

                  -- Pulisci riepiloghi precedenti.
                  DELETE FROM vendite.preventivi_riepiloghi_iva
                   WHERE preventivo_id = p_preventivo_id;
                  GET DIAGNOSTICS v_deleted_rows = ROW_COUNT;

                  -- Aggregazione fiscalmente corretta:
                  --   1) imponibile_riga = qta * prezzo * (1 - sconto/100) full precision
                  --   2) group by iva_id (natura/esigibilita/split sempre NULL nei preventivi)
                  --   3) imponibile riepilogo = ROUND(SUM, 2)
                  --   4) imposta = ROUND(imponibile_aliquota * aliquota_override/100, 2)
                  --   5) arrotondamento = SUM full - SUM rounded
                  WITH righe AS (
                      SELECT
                          pr.preventivo_id,
                          pr.iva_id,
                          pr.quantita * pr.prezzo_unitario
                            * (1 - COALESCE(pr.sconto_percentuale, 0) / 100) AS imponibile_riga
                        FROM vendite.preventivi_righe pr
                       WHERE pr.preventivo_id = p_preventivo_id
                         AND pr.attivo IS TRUE
                         AND pr.quantita > 0
                  )
                  INSERT INTO vendite.preventivi_riepiloghi_iva
                      (preventivo_id, iva_id, natura_id, esigibilita, split_payment,
                       imponibile, imposta, arrotondamento)
                  SELECT
                      r.preventivo_id,
                      r.iva_id,
                      NULL::integer  AS natura_id,
                      NULL::char(1)  AS esigibilita,
                      NULL::boolean  AS split_payment,
                      ROUND(SUM(r.imponibile_riga), 2)                                       AS imponibile,
                      ROUND(
                          ROUND(SUM(r.imponibile_riga), 2)
                          -- ⭐ rev 2026-08-29: la guardia `r.iva_id IS NOT NULL` che le viste
                          --   gemelle avevano gia' e questa funzione no. Il COALESCE non
                          --   proteggeva niente: config.fn_get_aliquota_iva SOLLEVA su
                          --   p_iva_id NULL (E_PARAMETRO_INVALIDO), quindi non arrivava mai a
                          --   ritornare NULL. L'effetto era che una riga di preventivo senza
                          --   aliquota NON SI POTEVA SALVARE — il trigger AFTER di ricalcolo
                          --   faceva fallire l'INSERT — e il messaggio che l'operatore leggeva
                          --   nominava un parametro PL/pgSQL, «p_iva_id obbligatorio e > 0».
                          -- ⚠️ Non era una decisione di dominio: vw_ordini_righe_iva_base e la
                          --   gemella dei DDT scrivono `CASE WHEN r.iva_id IS NOT NULL THEN
                          --   config.fn_get_aliquota_iva(...)`. Qui mancava.
                          -- ⛔ Aperta la strada, la riga senza aliquota entrerebbe nel
                          --   riepilogo con imposta zero: e' il difetto silenzioso che il
                          --   cancello all'EMISSIONE (Regola 2 di
                          --   trgfn_preventivi_guard_transizione, changeSet 20260829-10)
                          --   chiude. Le due modifiche sono UNA SOLA e non si applicano
                          --   separate: da sola, questa aprirebbe un buco senza rete.
                          * (CASE WHEN r.iva_id IS NOT NULL
                                  THEN COALESCE(config.fn_get_aliquota_iva(r.iva_id, v_stato_emittente_id), 0)
                                  ELSE 0 END::numeric / 100::numeric),
                          2
                      )                                                                      AS imposta,
                      SUM(r.imponibile_riga) - ROUND(SUM(r.imponibile_riga), 2)               AS arrotondamento
                    FROM righe r
                   GROUP BY r.preventivo_id, r.iva_id;
                  GET DIAGNOSTICS v_inserted_rows = ROW_COUNT;

                  RETURN QUERY SELECT v_deleted_rows, v_inserted_rows;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ricalcola_riepilogo_iva_preventivo(p_preventivo_id bigint)
              IS 'Ricalcola riepilogo IVA preventivo (pattern fiscalmente corretto, speculare a fn_ricalcola_riepilogo_iva_fattura). Override aliquota da stato emittente via config.fn_get_aliquota_iva. Firma usa %TYPE su vendite.preventivi.id (tipo concreto risolto: bigint). ⭐ rev 2026-08-29 (brief-db-be-iva-risolutore-e-regime-cliente, I9): aggiunta la guardia r.iva_id IS NOT NULL, che le viste gemelle (vw_ordini_righe_iva_base, vw_ddt_righe_iva_base) avevano gia'' e questa funzione no. Il COALESCE non proteggeva nulla, perche'' config.fn_get_aliquota_iva SOLLEVA su p_iva_id NULL invece di ritornare NULL: l''effetto era che una riga di preventivo senza aliquota non si poteva nemmeno SALVARE — il trigger AFTER di ricalcolo faceva fallire l''INSERT — con un messaggio che nominava un parametro PL/pgSQL. Non era una decisione di dominio ma una svista, e divergeva da DDT e ordini, dove la bozza resta libera e il vincolo sta al momento in cui il documento diventa autorevole. ⛔ Questa modifica NON si applica da sola: apre la strada a una riga senza aliquota, che senza rete finirebbe nel riepilogo con imponibile pieno e imposta zero. La rete e'' il cancello all''EMISSIONE (Regola 2 di vendite.trgfn_preventivi_guard_transizione, changeSet 20260829-10, via script.fn_check_preventivo_emettibile). Le due cose sono una slice sola. ⚠️ La gemella sulle FATTURE (fn_ricalcola_riepilogo_iva_fattura) ha lo stesso COALESCE senza guardia e NON e'' stata toccata: li'' non esiste ancora un cancello IVA, quindi togliere il raise scambierebbe un errore rumoroso con un numero sbagliato silenzioso. Va fatto insieme a I4.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ricalcola_riepilogo_iva_preventivo(p_preventivo_id bigint)
               RETURNS TABLE(deleted_rows integer, inserted_rows integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: ricalcola il riepilogo IVA per preventivo,
              -- pattern speculare a fn_ricalcola_riepilogo_iva_fattura.
              -- Aggrega per (iva_id, natura_id, esigibilita, split_payment)
              -- - per preventivi gli ultimi 3 sono sempre NULL oggi -
              -- e applica ROUND a 2 decimali sulla SUM imponibili,
              -- mai per riga. Override aliquota da stato emittente via
              -- config.fn_get_aliquota_iva (allineamento fatture).
              DECLARE
                  v_deleted_rows       integer := 0;
                  v_inserted_rows      integer := 0;
                  v_stato_emittente_id anagrafiche.soggetti.stato_id%TYPE;
              BEGIN
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'fn_ricalcola_riepilogo_iva_preventivo',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_preventivo_id', 'valore', p_preventivo_id),
                          NULL::uuid,
                          'p_preventivo_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera stato emittente per override aliquota IVA.
                  -- Chain: preventivi -> emittenti_fiscali -> soggetti_ruoli -> soggetti.
                  -- Se preventivo non ha emittente o catena non risolve,
                  -- v_stato_emittente_id resta NULL e fn_get_aliquota_iva
                  -- ritorna l'aliquota base.
                  SELECT s.stato_id
                    INTO v_stato_emittente_id
                    FROM vendite.preventivi p
                    JOIN anagrafiche.emittenti_fiscali ef
                      ON ef.id = p.emittente_fiscale_id
                    JOIN anagrafiche.soggetti_ruoli sr
                      ON sr.id = ef.soggetto_ruolo_id
                    JOIN anagrafiche.soggetti s
                      ON s.id = sr.soggetto_id
                   WHERE p.id = p_preventivo_id;

                  -- Pulisci riepiloghi precedenti.
                  DELETE FROM vendite.preventivi_riepiloghi_iva
