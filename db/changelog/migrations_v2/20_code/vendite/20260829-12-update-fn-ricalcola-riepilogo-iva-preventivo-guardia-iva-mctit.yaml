                  --   2) group by iva_id (natura/esigibilita/split sempre NULL nei preventivi)
                  --   3) imponibile riepilogo = ROUND(SUM, 2)
                  --   4) imposta = ROUND(imponibile_aliquota * aliquota_override/100, 2)
                  --   5) arrotondamento = SUM full - SUM rounded
