# IL GUARD DEI COMPONENTI DI LISTINO: IL DELETE IN BOZZA
#   Brief: brief-modello-documento-vendita §16.11 (E-1 di Tid, 2026-10-28).
#   Corpo di partenza: il vivo, uguale al 20261028-22.
#
# ── ⚠️ REVOCA PARZIALE ──────────────────────────────────────────────
#   brief-db-componenti-modello-unificato §8.2 (2026-05-13): «DELETE
#   bloccato sempre, usare attivo = FALSE». Con quella regola una BOZZA con
#   un composito non si eliminava, contro la decisione O2 di
#   sviluppo-listini-v3 («si elimina la BOZZA con le sue righe») e contro la
#   pagina del guard stesso, che chiedeva la regola delle righe normali (in
#   BOZZA si cancellano). Nessun documento diceva perche' un componente di una
#   bozza non dovesse andarsene. E-1: in BOZZA il DELETE si accetta, fuori
#   dalla bozza resta bloccato (attivo = FALSE), come
#   vendite.trgfn_listini_righe_guard_stato.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────
#   * Lo stato della versione si legge prima del ramo DELETE: dalla versione
#     di OLD in un DELETE, di NEW negli altri.
#   * DELETE: E_RIGA_LISTINO_VERSIONE_CHIUSA solo se la versione non e' in
#     BOZZA; il terzo valore e' lo stato (prima la parola fissa PROTETTA).
#     Una versione che non si legge non e' una bozza (fail-closed; INSERT e
#     UPDATE restano col COALESCE di prima).
#   INSERT, UPDATE, il trigger e il codice restano quelli di prima.
#   SECURITY INVOKER scritto (era il default).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261028-38-update-trgfn-listini-righe-comp-guard-immutabilita-delete-in-bozza-mctit.yaml

  - changeSet:
      id: 20261028-38-update-trgfn-listini-righe-comp-guard-immutabilita-delete-in-bozza
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_righe_comp_guard_immutabilita_v5: il DELETE di un componente si accetta
        in una versione BOZZA (revoca parziale di «DELETE sempre bloccato», E-1). Brief:
        brief-modello-documento-vendita §16.11.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_listini_righe_comp_guard_immutabilita_v5';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_comp_guard_immutabilita_v5()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: BEFORE INS/UPD/DEL su listini_righe_componenti — immutabilita' v5.
              --   Pattern listini: INSERT solo in versione BOZZA, UPDATE campi core
              --   bloccato in versione non-BOZZA, DELETE solo in versione BOZZA (come le
              --   righe; E-1 di Tid, 2026-10-28, changeSet 20261028-38).
              --   Il check periodo usa valido_dal/valido_al: validita e' STORED generated,
              --   non disponibile nei BEFORE trigger (D-OPEN-1).
              DECLARE
                  v_stato   config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_riga_id vendite.listini_righe_componenti.id%TYPE;
                  v_versione_id vendite.listini_righe_componenti.listino_versione_id%TYPE;
              BEGIN
                  v_riga_id     := CASE WHEN TG_OP = 'DELETE' THEN OLD.id ELSE NEW.id END;
                  v_versione_id := CASE WHEN TG_OP = 'DELETE' THEN OLD.listino_versione_id
                                        ELSE NEW.listino_versione_id END;

                  -- Legge stato versione
                  SELECT s.codice_interno INTO v_stato
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = v_versione_id;

                  -- DELETE: solo in versione BOZZA, come le righe (fuori dalla bozza:
                  -- attivo = FALSE). Una versione che non si legge non e' una bozza.
                  IF TG_OP = 'DELETE' THEN
                      IF v_stato IS DISTINCT FROM 'BOZZA' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                              jsonb_build_object(
                                  'operazione',          'DELETE',
                                  'hint',                'Usare attivo=FALSE per disattivare la riga.',
                                  'stato_versione',      v_stato,
                                  'listino_versione_id', v_versione_id,
                                  'riga_id',             v_riga_id
                              ),
                              NULL::uuid,
                              'DELETE', v_riga_id::text, COALESCE(v_stato, 'NULL')
                          );
                      END IF;
                      RETURN OLD;
                  END IF;

                  -- INSERT: solo in versione BOZZA
                  IF TG_OP = 'INSERT' AND COALESCE(v_stato, 'BOZZA') <> 'BOZZA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'operazione',         'INSERT',
                              'stato_versione',     v_stato,
                              'listino_versione_id', NEW.listino_versione_id
                          ),
                          NULL::uuid,
                          'INSERT', v_riga_id::text, v_stato
                      );
                  END IF;

                  -- UPDATE campi core: bloccato se versione non BOZZA.
                  -- Il periodo e' identificato da valido_dal/valido_al (non da validita,
                  -- che e' STORED generated e non e' visibile nei BEFORE trigger).
                  IF TG_OP = 'UPDATE' AND COALESCE(v_stato, 'BOZZA') <> 'BOZZA' THEN
                      IF NEW.prezzo    IS DISTINCT FROM OLD.prezzo
                         OR NEW.iva_id    IS DISTINCT FROM OLD.iva_id
                         OR NEW.valido_dal IS DISTINCT FROM OLD.valido_dal
                         OR NEW.valido_al  IS DISTINCT FROM OLD.valido_al
                      THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                              jsonb_build_object(
                                  'operazione',         'UPDATE_CAMPI_CORE',
                                  'stato_versione',     v_stato,
                                  'listino_versione_id', NEW.listino_versione_id,
                                  'riga_id',            NEW.id
                              ),
                              NULL::uuid,
                              'UPDATE', NEW.id::text, v_stato
                          );
                      END IF;
                  END IF;

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_comp_guard_immutabilita_v5() IS
                  'Trigger BEFORE INS/UPD/DEL su listini_righe_componenti: immutabilita'' v5. DELETE solo in BOZZA, come le righe (fuori dalla bozza: attivo=FALSE). INSERT solo in BOZZA. UPDATE prezzo/iva_id/valido_dal/valido_al bloccato in non-BOZZA. Raise E_RIGA_LISTINO_VERSIONE_CHIUSA (362). rev 2026-05-14. Rev 2026-10-28 (20261028-22, brief-modello-documento-vendita §16, L-1): lo stato della versione di listino si legge dal vocabolario config.stati_doc_listino_versioni (codice_interno), non piu'' dalla colonna testo stato. Rev 2026-10-28 (20261028-38, brief-modello-documento-vendita §16.11, E-1 di Tid): il DELETE si accetta in BOZZA, revoca parziale della regola «DELETE sempre bloccato» del 2026-05-13 (brief-db-componenti-modello-unificato §8.2), cosi'' una bozza si elimina con le sue righe (vendite.fn_elimina_versione_listino); fuori dalla bozza resta bloccato.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima sta nel 20261028-22: si torna da li'.
              SELECT 1;
