# I DUE TRIGGER DELLA PROVENIENZA DEL PREZZO, SULLE DIECI TABELLE
#   Brief: brief-db-provenienza-prezzo-segue-il-prezzo (§8.3, §8.4, D-1)
#
#   Le righe principali e i componenti di preventivi, ordini, contratti, DDT e
#   offerte ricevono:
#     trg_<t>_a20_provenienza_prezzo_ins_upd           BEFORE  vendite.trgfn_riga_documento_provenienza_prezzo
#     trg_<t>_a10_guard_listino_provenienza_ins_upd    AFTER   vendite.trgfn_riga_documento_guard_listino_provenienza
#   Le funzioni sono una per regola (D-1: nessuna copia per documento); il
#   montaggio e' l'unica cosa per tabella.
#
# ── I NOMI ──────────────────────────────────────────────────────────
#   Le righe principali col nome della tabella (offerte_eccezioni, come
#   trg_offerte_eccezioni_z90_propaga_qta_componenti_upd); i componenti con la
#   sigla dei loro trigger e vincoli (prevrighe_comp, ordrighe_comp,
#   contrighe_comp, ddtrighe_comp, oce_comp), per stare nei 63 caratteri.
#
# ── L'ORDINE ────────────────────────────────────────────────────────
#   BEFORE a20: dopo i guard a05/a10 della tabella; nessun BEFORE della
#   tabella scrive prezzo_unitario, uom_operativa_id, l'articolo o le colonne
#   della provenienza (letti da pg_trigger di dbdev il 2026-11-13). Sui
#   componenti i trigger trg_<tabella>_componenti_* vengono comunque prima per
#   alfabeto, e nessuno scrive il prezzo.
#   AFTER a10: vede la riga finale. Senza UPDATE OF: le colonne giudicate le
#   scrive anche il trigger a20 (linee-guida-trigger, «UPDATE o UPDATE OF»).
#   Montaggi nuovi, nessun nome storico da togliere: DROP IF EXISTS sul nome
#   per la sola idempotenza.
# ------------------------------------------------------------

