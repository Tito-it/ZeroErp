                                     FROM vendite.resi_righe_accrediti a
                                     JOIN vendite.resi_righe rr ON rr.id = a.resi_riga_id
                                    WHERE a.commessa_attivita_id = ca.id
                                      AND ca.tipo_movimento = 'RETTIFICA'
                                    ORDER BY a.id
                                    LIMIT 1
                                 ) acc ON true
                           WHERE ca.commessa_id = p_id
                             AND ca.stato_emissione = 'NON_EMESSA'
                           ORDER BY ca.id;
                      RETURN;

                  ELSIF p_documento = 'OFFERTA_COMMERCIALE' THEN
                      -- ⭐ rev 2026-10-26 (20261026-20, O-4 di Tid): la revisione
                      --   precedente (il padre, superato) torna emessa se questa e'
                      --   la sua ultima revisione viva: lo scrive la proiezione
                      --   vendite.fn_offerta_proietta_stato_revisione, all'annullo.
                      --   PROVENIENZA: niente da ritirare, si conferma. Nessun legame
                      --   se la revisione e' gia' annullata, se il padre non e'
                      --   superato o se un'altra revisione viva lo tiene superato:
                      --   l'annullo non riaprirebbe niente.
                      v_sorgente := 'OFFERTA_COMMERCIALE';

                      RETURN QUERY
                          SELECT NULL::bigint, NULL::integer, 'OFFERTA_COMMERCIALE'::character varying, 'PROVENIENZA'::text,
                                 o.revisione_padre_id, NULL::bigint, NULL::numeric
                            FROM vendite.offerte_commerciali o
                            JOIN config.stati_doc_offerte so ON so.id = o.stato_doc_offerta_id
                            JOIN vendite.offerte_commerciali pd ON pd.id = o.revisione_padre_id
                            JOIN config.stati_doc_offerte sp ON sp.id = pd.stato_doc_offerta_id
                           WHERE o.id = p_id
                             AND so.is_abortito IS FALSE
                             AND sp.is_superato IS TRUE
                             AND NOT EXISTS (
                                   SELECT 1
                                     FROM vendite.offerte_commerciali f
                                     JOIN config.stati_doc_offerte sf ON sf.id = f.stato_doc_offerta_id
                                    WHERE f.revisione_padre_id = o.revisione_padre_id
                                      AND f.id <> o.id
                                      AND sf.is_abortito IS FALSE);

                  ELSE  -- CONTRATTO
                      v_sorgente := 'CONTRATTO';

                      RETURN QUERY
                          SELECT NULL::bigint, NULL::integer, 'OFFERTA_COMMERCIALE'::character varying, 'PROVENIENZA'::text,
                                 c.offerta_id, NULL::bigint, NULL::numeric
                            FROM vendite.contratti c
                           WHERE c.id = p_id
                             AND c.offerta_id IS NOT NULL;
                  END IF;

                  -- ⭐ rev 2026-11-06 (20261106-42, giro 0.3): la chiave delle righe di
                  --   commessa del documento (commesse_attivita.sorgente_uid porta
                  --   <testata>.uid::text) dal BB che risolve, per ogni tipo: niente piu'
                  --   una lettura per tabella nei rami sopra.
                  SELECT d.documento_uid::text INTO v_uid
                    FROM config.sorgenti s
                    CROSS JOIN LATERAL script.fn_sorgente_documento(s.id, p_id, NULL::uuid) d
                   WHERE s.codice_interno = v_sorgente;

                  -- Le righe di commessa che il documento ha spinto e che
                  -- nessuno ha ancora emesso: le stesse che il ritiro porta ad
                  -- ANNULLATA (vendite.fn_ritira_commessa_attivita_da_sorgente).
                  -- Documento inesistente o invisibile: v_uid NULL, nessuna riga.
                  RETURN QUERY
                      SELECT NULL::bigint, NULL::integer, 'COMMESSA'::character varying, 'CONSUMO'::text,
                             ca.commessa_id, ca.id, ca.quantita::numeric
                        FROM vendite.commesse_attivita ca
                        JOIN config.sorgenti s ON s.id = ca.sorgente_tipo_id
                       WHERE s.codice_interno  = v_sorgente
                         AND ca.sorgente_uid   = v_uid
                         AND ca.stato_emissione = 'NON_EMESSA'
                       ORDER BY ca.id;
              END;
              $function$;
