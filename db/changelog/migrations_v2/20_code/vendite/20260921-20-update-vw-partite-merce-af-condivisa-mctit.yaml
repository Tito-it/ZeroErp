# D14 — `vw_af_merce_per_riga` SI LEGGE UNA VOLTA, NON QUATTRO
#   migliorie-generali-da-test-valutazione.md §3 D14 (terza leva)
#
# ── COSA CAMBIA, in una riga ───────────────────────────────────────────
#
#   Niente nel risultato: stesse colonne, stesse righe, stessi numeri.
#   Cambia QUANTE VOLTE la vista ricalcola il contatore delle attivita'
#   fatturabili sotto RLS.
#
# ── IL DIFETTO (visto il 2026-09-21 con EXPLAIN ANALYZE come app) ───────
#
#   La vista legge `vendite.vw_af_merce_per_riga` in QUATTRO punti —
#   `acc_origine` (le rettifiche sull'origine), `alloc` (il serbatoio
#   d'ordine), `fd` e `fr` (fatturato e rettificato della partita) — e
#   quella vista e' un GROUP BY su attivita_fatturabili ⋈ commesse_attivita,
#   cioe' una scansione intera che paga la policy di commesse_attivita per
#   ogni riga. Il planner non condivide un sottoalbero fra quattro JOIN:
#   la ricalcola quattro volte, e nell'EXPLAIN compaiono quattro
#   «CTE base … GroupAggregate» identici.
#
#   Sul MODELLO e' la stessa relazione derivata letta quattro volte: il
#   posto giusto e' una CTE in testa, letta dai quattro punti. Non e' una
#   scelta del planner: e' la forma che dice cio' che la vista fa.
#
#   Fatto datato (dbdev, 2026-09-21, 51 DDT / 36 partite, zeroerp_app con
#   contesto operatore): le quattro letture pesano 16+15+20+17 ≈ 68 ms su
#   ~130 della vista intera.
#
# ── LA FORMA NUOVA, equivalente per costruzione ────────────────────────
#
#   `af AS MATERIALIZED (SELECT … FROM vendite.vw_af_merce_per_riga)` in
#   testa; i quattro JOIN restano IDENTICI nei predicati (corsia, riga_id,
#   tipo_movimento) e cambiano solo la sorgente: `af` al posto della
#   vista. Una proiezione senza filtro, cosi' l'equivalenza non ha bisogno
#   di argomenti: ogni JOIN vede esattamente le righe che vedeva.
#
#   ⭐ `AS MATERIALIZED`, come per `sospetto` nel 20260917-01: senza, il
#   planner INLINA la CTE in ognuno dei quattro riferimenti e torna a
#   quattro scansioni.
#
# ── MISURATO prima di scrivere (solo SELECT, transazione ritirata) ─────
#
#   Vista intera come app, stessa sessione, letture consecutive:
#   ~90 -> ~56 ms. `EXCEPT ALL` nei due versi fra la definizione viva e
#   questa: 0 righe. La capability del DDT (script.fn_available_actions_ddt)
#   legge la vista due volte (lister + diagnosi), quindi risparmia il
#   doppio.
#
#   ⚠️ Non e' la chiusura di D14: la vista resta senza parametro e la
#   lettura di UN documento continua a pagare le partite di TUTTI. Quella
#   e' la quarta leva — la partita per chiusura del documento — e ha il
#   suo brief: brief-db-partita-merce-per-documento.md.
#
# ── IL PRESIDIO ESISTE GIA' ────────────────────────────────────────────
#
#   test-vw-partite-merce-v1.sql (11), test-vw-partite-merce-riconsegna-
#   dopo-nc-v1.sql (8: e' li' che `acc_origine` e `migra` leggono le
#   rettifiche), test-fn-list-ddt-da-pushare-contatore-v1.sql (7),
#   test-vw-contatore-merce-v1.sql. Nessuna riga di test cambia.
#
# Base: definizione VIVA di vw_partite_merce dopo 20260917-01 (verificata
#   identica con pg_get_viewdef il 2026-09-21). security_invoker=on
#   ri-specificato. Le altre CTE sono ricopiate senza toccarle.
# Dipendenze: 20260917-01.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260921-20-update-vw-partite-merce-af-condivisa-mctit.yaml

  - changeSet:
      id: 20260921-20-update-vw-partite-merce-af-condivisa
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D14 (terza leva): vendite.vw_af_merce_per_riga letta UNA volta in una
        CTE `af` AS MATERIALIZED invece di quattro (acc_origine, alloc, fd,
        fr). Stesse righe, stessi numeri; sotto RLS la vista intera passa da
        ~90 a ~56 ms come app (dbdev, 2026-09-21). security_invoker=on
        ri-specificato.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_partite_merce
            - viewExists:
                schemaName: vendite
                viewName: vw_af_merce_per_riga
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_partite_merce
              WITH (security_invoker=on) AS
              WITH af AS MATERIALIZED (
                  -- D14 (2026-09-21). Il contatore delle attivita' fatturabili
                  -- per riga di documento, letto UNA volta. La vista sotto e'
                  -- un GROUP BY su attivita_fatturabili ⋈ commesse_attivita
                  -- (RLS su commesse_attivita): i quattro JOIN che seguono
                  -- (`acc_origine`, `alloc`, `fd`, `fr`) la leggevano ciascuno
                  -- per conto proprio, e il planner la ricalcolava quattro
                  -- volte. Proiezione SENZA filtro: ogni JOIN tiene i suoi
                  -- predicati (corsia, riga_id, tipo_movimento) e vede
                  -- esattamente le righe di prima. MATERIALIZED: senza, il
                  -- planner la inlina in ogni riferimento e torna a quattro.
                  SELECT a.corsia, a.riga_id, a.tipo_movimento, a.quantita, a.misurabile
                    FROM vendite.vw_af_merce_per_riga a
              ), soglia AS (
                  SELECT s.ordine AS ordine_emesso
                    FROM config.stati_doc_ddt s
                   WHERE s.codice_interno::text = 'EMESSO'::text
              ), ponte_riga AS (
                  -- Il ponte alla granularita' della SINGOLA spedizione nuova.
                  -- Serve perche' la quota accreditata va RIPARTITA fra piu'
                  -- ri-consegne della stessa origine, e per ripartire bisogna
                  -- poterle distinguere. `ponte` (sotto) resta l'aggregato di
                  -- sempre, ora derivato da qui.
                  SELECT rr.ddt_riga_id            AS ddt_riga_origine,
                         rc.ddt_riga_id            AS ddt_riga_nuova,
                         d_new.data                AS ddt_nuovo_data,
                         (sdd_n.ordine >= sg.ordine_emesso) AS emesso,
                         sum(rc.qta)               AS qta
                    FROM vendite.resi_righe_riconsegne rc
                    JOIN vendite.resi_righe rr ON rr.id = rc.resi_riga_id
                    JOIN vendite.ddt_righe dr_new ON dr_new.id = rc.ddt_riga_id
                    JOIN vendite.ddt d_new ON d_new.id = dr_new.ddt_id
                    JOIN config.stati_doc_ddt sdd_n ON sdd_n.id = d_new.stato_doc_ddt_id
                    CROSS JOIN soglia sg
                   GROUP BY rr.ddt_riga_id, rc.ddt_riga_id, d_new.data,
                            (sdd_n.ordine >= sg.ordine_emesso)
              ), ponte AS (
                  SELECT p.ddt_riga_origine,
                         COALESCE(sum(p.qta) FILTER (WHERE p.emesso), 0::numeric) AS riconsegnato,
                         COALESCE(sum(p.qta) FILTER (WHERE NOT p.emesso), 0::numeric) AS in_riconsegna
                    FROM ponte_riga p
                   GROUP BY p.ddt_riga_origine
              ), acc_origine AS (
                  -- Quanto e' stato ACCREDITATO sulla partita d'origine. E' la
                  -- somma delle rettifiche sul suo segmento DDT, che e'
                  -- negativa: qui si legge in positivo, perche' e' una
                  -- capienza, non un movimento.
                  -- ⚠️ Esiste solo dopo l'EMISSIONE della rettifica: fra il
                  --    verbo e il giro di fatturazione vale 0, e la
                  --    ri-consegna si comporta come oggi. E' corretto — la
                  --    merce cambia casa quando la nota di credito e' un
                  --    documento, non quando qualcuno la chiede.
                  SELECT DISTINCT p.ddt_riga_origine,
                         GREATEST(0::numeric, - COALESCE(ret.quantita, 0::numeric)) AS accreditato
                    FROM ponte_riga p
                    LEFT JOIN af ret
                      ON ret.corsia::text = 'DDT'::text
                     AND ret.riga_id = p.ddt_riga_origine
                     AND ret.tipo_movimento::text = 'RETTIFICA'::text
              ), migra AS (
                  -- I pezzi che CAMBIANO CASA, spedizione per spedizione.
                  -- Greedy oldest-first, esattamente come la corsia ORD: la
                  -- capienza accreditata si versa nelle spedizioni nuove dalla
                  -- piu' vecchia, fino a esaurimento. Cappata alla quantita'
                  -- ri-consegnata, cosi' un secondo giro reso->NC->ri-consegna
                  -- non conta due volte lo stesso accredito.
                  SELECT p.ddt_riga_nuova,
                         p.ddt_riga_origine,
                         GREATEST(0::numeric, LEAST(p.qta,
                             a.accreditato
                             - COALESCE(sum(p.qta) OVER (PARTITION BY p.ddt_riga_origine
                                                         ORDER BY p.ddt_nuovo_data, p.ddt_riga_nuova
                                                         ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING),
                                        0::numeric))) AS quota
                    FROM ponte_riga p
                    JOIN acc_origine a ON a.ddt_riga_origine = p.ddt_riga_origine
                   WHERE p.emesso
              ), migra_origine AS (
                  SELECT m.ddt_riga_origine, sum(m.quota) AS quota_migrata
                    FROM migra m GROUP BY m.ddt_riga_origine
              ), migra_nuova AS (
                  SELECT m.ddt_riga_nuova, sum(m.quota) AS quota_nuova
                    FROM migra m GROUP BY m.ddt_riga_nuova
              ), riga AS (
                  SELECT dr.id AS ddt_riga_id,
                         dr.ddt_id,
                         d.uid AS ddt_uid,
                         d.data AS ddt_data,
                         dr.articolo_id,
                         COALESCE(art.is_composito, false) AS is_composito,
                         (EXISTS ( SELECT 1
                                FROM vendite.resi_righe_riconsegne rc
                               WHERE rc.ddt_riga_id = dr.id)) AS e_riconsegna,
                         COALESCE(mn.quota_nuova, 0::numeric) AS quota_nuova,
                         -- LA BASE CONTABILE DELLA PARTITA.
                         --   riga ordinaria  : la merce uscita con questo documento
                         --   riga ri-consegna: SOLO i pezzi che hanno cambiato casa
                         --                     (0 finche' non c'e' una nota di credito)
                         -- piu' cio' che le e' rientrato da ri-consegne, meno cio'
                         -- che se n'e' andato verso spedizioni nuove. Le tre voci
                         -- si compongono: una riga puo' essere insieme origine e
                         -- ri-consegna (secondo giro reso -> NC -> rispedizione).
                         ((CASE WHEN EXISTS ( SELECT 1
                                                FROM vendite.resi_righe_riconsegne rc
                                               WHERE rc.ddt_riga_id = dr.id)
                                THEN COALESCE(mn.quota_nuova, 0::numeric)
                                ELSE dr.quantita
                           END)
                          + COALESCE(pt.riconsegnato, 0::numeric)
                          - COALESCE(mo.quota_migrata, 0::numeric))::numeric(18,6) AS consegnato,
                         COALESCE(pt.in_riconsegna, 0::numeric) AS in_riconsegna,
                         COALESCE(caus.fatturabile, false) AS fatturabile
                    FROM vendite.ddt_righe dr
                    JOIN vendite.ddt d ON d.id = dr.ddt_id
                    JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                    JOIN catalogo.articoli art ON art.id = dr.articolo_id
                    LEFT JOIN config.causali_trasporto caus ON caus.id = d.causale_trasporto_id
                    LEFT JOIN ponte pt ON pt.ddt_riga_origine = dr.id
                    LEFT JOIN migra_origine mo ON mo.ddt_riga_origine = dr.id
                    LEFT JOIN migra_nuova mn ON mn.ddt_riga_nuova = dr.id
                    CROSS JOIN soglia sg
                   WHERE dr.attivo IS TRUE AND NOT sdd.is_abortito AND sdd.ordine >= sg.ordine_emesso
              ), orig AS (
                  SELECT f.ddt_riga_id,
                         count(DISTINCT f.ordine_riga_id) AS n_origini,
                         min(f.ordine_riga_id) AS ordine_riga_id
                    FROM vendite.ordini_righe_fulfillment f
                   GROUP BY f.ddt_riga_id
              ), articoli_ordinati_per_ddt AS MATERIALIZED (
                  -- D14 (2026-09-17). L'insieme delle coppie (DDT, articolo)
                  -- «coperte da un ordine»: il DDT ha righe che evadono un
                  -- ordine, e quell'ordine contiene l'articolo. E' la parte
                  -- dell'EXISTS della S6b che NON dipende dalla riga esaminata,
                  -- quindi si calcola una volta sola invece che per partita.
                  -- DISTINCT: una riga per coppia, cosi' il JOIN sotto non
                  -- moltiplica. MATERIALIZED: senza, il planner la inlina e
                  -- torna al ciclo per riga, con la sua cascata di policy RLS.
                  SELECT DISTINCT dr2.ddt_id, orr_ord.articolo_id
                    FROM vendite.ddt_righe dr2
                    JOIN vendite.ordini_righe_fulfillment f2 ON f2.ddt_riga_id = dr2.id
                    JOIN vendite.ordini_righe orr_ful ON orr_ful.id = f2.ordine_riga_id
                    JOIN vendite.ordini_righe orr_ord ON orr_ord.ordine_id = orr_ful.ordine_id
                   WHERE dr2.attivo IS TRUE AND orr_ord.attivo IS TRUE
              ), sospetto AS MATERIALIZED (
                  -- La riga a mano con un articolo GIA' nell'ordine (S6b,
                  -- 20260817-14): niente fulfillment sulla riga, ma la sua
                  -- coppia (DDT, articolo) sta nell'insieme qui sopra. Stesse
                  -- tre condizioni di prima; cambia solo che l'insieme non si
                  -- ricostruisce per ogni riga.
                  SELECT dr.id AS ddt_riga_id
                    FROM vendite.ddt_righe dr
                    JOIN articoli_ordinati_per_ddt k
                      ON k.ddt_id = dr.ddt_id
                     AND k.articolo_id = dr.articolo_id
                   WHERE NOT EXISTS ( SELECT 1
                            FROM vendite.ordini_righe_fulfillment f
                           WHERE f.ddt_riga_id = dr.id)
              ), res AS (
                  SELECT e.ddt_riga_id,
                         sum(e.quantita) AS reso
                    FROM vendite.vw_resi_righe_effettive e
                   GROUP BY e.ddt_riga_id
              ), alloc AS (
                  -- ⚠️ NON SI TOCCA (vedi N6): il serbatoio d'ordine resta il
                  --    fatturato NORMALE della corsia ORD.
                  SELECT r_1.ddt_riga_id,
                         GREATEST(0::numeric, LEAST(r_1.consegnato, COALESCE(fo.quantita, 0::numeric) - COALESCE(sum(r_1.consegnato) OVER (PARTITION BY o_1.ordine_riga_id ORDER BY r_1.ddt_data, r_1.ddt_riga_id ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0::numeric))) AS fatturato_da_ordine,
                         COALESCE(fo.misurabile, true) AS ord_misurabile
                    FROM riga r_1
                    JOIN orig o_1 ON o_1.ddt_riga_id = r_1.ddt_riga_id
                    LEFT JOIN af fo ON fo.corsia::text = 'ORD'::text AND fo.riga_id = o_1.ordine_riga_id AND fo.tipo_movimento::text = 'NORMALE'::text
                   WHERE NOT r_1.e_riconsegna
              )
              SELECT r.ddt_riga_id,
                 r.ddt_id,
                 r.ddt_uid,
                 r.articolo_id,
                 r.is_composito,
                 o.ordine_riga_id,
                 orr.ordine_id,
                     CASE
                         WHEN o.ddt_riga_id IS NULL THEN 'NESSUNA'::text
                         WHEN o.n_origini > 1 THEN 'MULTIPLA'::text
                         ELSE 'ORDINE'::text
                     END::character varying AS origine,
                 r.fatturabile,
                 r.consegnato,
                 COALESCE(res.reso, 0::numeric) AS reso,
                 r.in_riconsegna,
                 v.tenuti,
                 COALESCE(fd.quantita, 0::numeric) AS fatturato_merce,
                 COALESCE(al.fatturato_da_ordine, 0::numeric) AS fatturato_da_ordine,
                 v.fatturato,
                 v.misurabile,
                     -- ⭐ Il conto si applica anche a una riga di ri-consegna,
                     --    PURCHE' le abbiano cambiato casa dei pezzi. Senza
                     --    nota di credito `quota_nuova` e' 0 e la riga resta
                     --    muta come oggi: e' cio' che tiene chiuso il buco di
                     --    luglio e verde il caso D del pgTAP.
                     CASE
                         WHEN w.conta_fatturazione AND v.misurabile
                              AND (NOT r.e_riconsegna OR r.quota_nuova > 0::numeric) THEN w.saldo
                         ELSE NULL::numeric
                     END AS differenza,
                     CASE
                         WHEN r.e_riconsegna AND r.quota_nuova <= 0::numeric THEN 'RICONSEGNA'::text
                         WHEN NOT w.conta_fatturazione THEN 'NON_FATTURABILE'::text
                         WHEN NOT v.misurabile THEN 'NON_MISURABILE'::text
                         WHEN w.saldo > 0::numeric THEN 'DA_FATTURARE'::text
                         WHEN w.saldo < 0::numeric THEN 'DA_ACCREDITARE'::text
                         ELSE 'PAREGGIATA'::text
                     END::character varying AS stato,
                 r.e_riconsegna,
                 sos.ddt_riga_id IS NOT NULL AS sospetto_duplicato_ordine,
                 COALESCE(fr.quantita, 0::numeric) AS rettificato,
                 r.quota_nuova AS riconsegna_quota_nuova
                FROM riga r
                LEFT JOIN orig o ON o.ddt_riga_id = r.ddt_riga_id
                LEFT JOIN vendite.ordini_righe orr ON orr.id = o.ordine_riga_id
                LEFT JOIN res ON res.ddt_riga_id = r.ddt_riga_id
                LEFT JOIN sospetto sos ON sos.ddt_riga_id = r.ddt_riga_id
                LEFT JOIN alloc al ON al.ddt_riga_id = r.ddt_riga_id
                LEFT JOIN af fd ON fd.corsia::text = 'DDT'::text AND fd.riga_id = r.ddt_riga_id AND fd.tipo_movimento::text = 'NORMALE'::text
                LEFT JOIN af fr ON fr.corsia::text = 'DDT'::text AND fr.riga_id = r.ddt_riga_id AND fr.tipo_movimento::text = 'RETTIFICA'::text
                CROSS JOIN LATERAL ( SELECT r.consegnato - COALESCE(res.reso, 0::numeric) AS tenuti,
                       COALESCE(fd.quantita, 0::numeric)
                         + COALESCE(al.fatturato_da_ordine, 0::numeric)
                         + COALESCE(fr.quantita, 0::numeric) AS fatturato,
                       COALESCE(fd.misurabile, true)
                         AND COALESCE(al.ord_misurabile, true)
                         AND COALESCE(fr.misurabile, true) AS misurabile) v
                CROSS JOIN LATERAL ( SELECT r.fatturabile OR v.fatturato > 0::numeric AS conta_fatturazione,
                       v.tenuti - v.fatturato AS saldo) w;

              COMMENT ON VIEW vendite.vw_partite_merce IS
                'La PARTITA DI MERCE: una riga per riga di DDT attiva su documento '
                'EMESSO in poi, con la riga d''ordine come ORIGINE nullable. '
                'rev 2026-08-18 (N6): il `fatturato` somma anche le RETTIFICHE della '
                'corsia DDT (colonna `rettificato`, negativa o zero) — e'' cio'' che '
                'chiude il contratto del S2 del brief nota di credito, senza il quale '
                'una NC sarebbe invisibile al contatore e la coda continuerebbe a '
                'chiedere l''accredito per sempre. La rettifica si legge SEMPRE sulla '
                'corsia DDT anche quando a fatturare e'' stata la corsia ORD (D-NC-1): '
                'nel serbatoio d''ordine la greedy la scaricherebbe sull''ULTIMA '
                'spedizione invece che su quella da cui la merce e'' tornata, con il '
                'totale giusto e la ripartizione falsa. '
                'rev 2026-08-18 (N7, D-NC-4): «una ri-consegna e'' merce nuova SOLO per '
                'la parte accreditata». La quota accreditata sulla partita d''origine '
                'si versa greedy oldest-first nelle spedizioni nuove '
                '(`riconsegna_quota_nuova`), che diventano partite vere con un segmento '
                'vergine — quindi LIBERA per fn_get_stato_push_segment, quindi '
                'ri-fatturabili dal giro normale, senza allentare la cintura che '
                'impedisce di ri-spingere una riga gia'' fatturata. Senza nota di '
                'credito la regola e'' INERTE: nessun pezzo cambia casa e ogni numero '
                'resta quello di prima. '
                'rev 2026-09-17 (D14): la CTE `sospetto` (sospetto_duplicato_ordine) '
                'non e'' piu'' un EXISTS correlato valutato per partita ma un insieme '
                'calcolato una volta — le coppie (DDT, articolo) coperte da un ordine '
                'collegato al DDT, `articoli_ordinati_per_ddt` — e un JOIN, entrambe '
                'AS MATERIALIZED (senza, il planner le inlina e torna al ciclo per '
                'riga). Stesse righe e stesso significato; cambia quante volte si '
                'pagano le policy RLS: la vista intera come applicazione passa da '
                '~375 a ~88 ms (dbdev, 2026-09-17), la lettura di una riga sola sale '
                'di ~12 ms perche'' l''insieme si calcola intero. Chi la legge intera '
                'e'' la capability del DDT (lister + diagnosi), cioe'' il drawer. '
                'rev 2026-09-21 (D14, terza leva): vw_af_merce_per_riga si legge UNA '
                'volta, nella CTE `af` AS MATERIALIZED in testa, invece che in quattro '
                'punti (acc_origine, alloc, fd, fr): il planner non condivide un '
                'sottoalbero fra quattro JOIN e ricalcolava il contatore quattro volte, '
                'ognuna sotto la policy di commesse_attivita. Proiezione senza filtro, '
                'JOIN identici nei predicati: stesse righe e stessi numeri. Vista intera '
                'come applicazione ~90 -> ~56 ms (dbdev, 2026-09-21). Non chiude D14: '
                'la vista resta senza parametro e un documento paga le partite di '
                'tutti — quella e'' la quarta leva, brief-db-partita-merce-per-documento. '
                'security_invoker=on ri-specificato (la reloption non si vede in '
                'pg_get_viewdef e un CREATE OR REPLACE la azzera: qui significa bypass '
                'della RLS, regressione V-1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Non si torna indietro da soli: va ri-applicato 20260917-01,
              --    che porta le quattro letture separate di vw_af_merce_per_riga.
              SELECT 1;
