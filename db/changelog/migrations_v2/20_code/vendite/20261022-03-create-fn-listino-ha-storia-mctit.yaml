# NUOVO: vendite.fn_listino_ha_storia(listino) -> boolean
#   Richiesta BE del 2026-10-21 (§9.8 di brief-be-utenti-di-sviluppo);
#   definizione: D-1 di Tid, 2026-10-22.
#
# -- LA REGOLA, SUL MODELLO ----------------------------------------------
#   Un listino HA STORIA se ha almeno una versione che e' stata attivata:
#   oggi ATTIVA o CHIUSA, anche spenta (attivo = false). Una BOZZA non conta:
#   nessuno ha mai potuto prenderci un prezzo. Una versione attivata conta
#   sempre: da li' e' potuto uscire un prezzo che sta su un documento.
#   Gli stati non tornano indietro (ATTIVA -> BOZZA vietata, CHIUSA terminale:
#   vendite.trgfn_listini_versioni_guard_transizione_stato), quindi «ha oggi
#   una versione ATTIVA o CHIUSA» e «ha avuto una versione attiva» sono la
#   stessa cosa.
#
# -- DUE CONSUMATORI, UNA SEDE --------------------------------------------
#   * vendite.trgfn_listini_guard_spegnimento_storia (20261022-04): un listino
#     con storia non si spegne con l'interruttore, si chiude con la fine
#     validita' della versione;
#   * il backend: il toggle «Attivo» del drawer si mostra solo a un listino
#     senza storia. Legge questa funzione: la regola non si ricopia in Python.
#
# -- NON E' LA REGOLA «IN VIGORE» ----------------------------------------
#   vendite.fn_listino_versione_in_vigore e' la sede unica di «quale versione
#   vale A UNA DATA» (ATTIVA o CHIUSA, accesa, data dentro la validita'), e
#   db/pgtap/vendite/test-listino-versione-in-vigore-v1 (test 12) presidia che
#   quella forma non si ricopi. Qui la domanda e' un'altra: «il listino e' mai
#   USCITO DALLA BOZZA?», senza data e anche da spento. Per questo il
#   predicato si scrive col suo significato, stato <> 'BOZZA', e non come
#   l'elenco degli stati operativi: e' anche piu' fedele a D-1 («una bozza non
#   conta»), e uno stato nuovo dopo l'attivazione conterebbe come storia senza
#   toccare niente. (Oggi gli stati sono BOZZA, ATTIVA, CHIUSA: CHECK
#   chk_listini_versioni_stato.)
#
# -- LA FORMA ------------------------------------------------------------
#   SECURITY INVOKER: chi la chiede vede il listino, e le versioni di un
#   listino hanno il suo stesso perimetro (scope via listino). STABLE.
#   plpgsql e non sql: il presidio dei riferimenti morti la compila.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261022-03-create-fn-listino-ha-storia-mctit.yaml

  - changeSet:
      id: 20261022-03-create-fn-listino-ha-storia
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuova vendite.fn_listino_ha_storia: un listino ha storia se ha almeno una versione ATTIVA o
        CHIUSA (anche spenta). La leggono il guard di spegnimento e il backend (toggle «Attivo»).
        Richiesta BE §9.8; definizione D-1 di Tid.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_listino_ha_storia(
                  p_listino_id vendite.listini.id%TYPE)
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   true se il listino ha almeno una versione USCITA DALLA
                  --   BOZZA (oggi ATTIVA o CHIUSA), anche spenta. Una BOZZA non
                  --   conta. Listino NULL: false.
                  -- ⚠️ Non e' la regola «in vigore a una data»
                  --   (vendite.fn_listino_versione_in_vigore): qui non c'e'
                  --   data ne' filtro su attivo.
                  -- =========================================================
                  RETURN EXISTS (
                      SELECT 1
                        FROM vendite.listini_versioni v
                       WHERE v.listino_id = p_listino_id
                         AND v.stato <> 'BOZZA');
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_listino_ha_storia(vendite.listini.id%TYPE)
              IS 'True se il listino ha STORIA: almeno una versione uscita dalla bozza (stato <> BOZZA: oggi ATTIVA o CHIUSA), anche spenta (D-1 di Tid, 2026-10-22). Non e'' la regola «in vigore a una data» di vendite.fn_listino_versione_in_vigore: qui non c''e'' data ne'' filtro su attivo. Una BOZZA non conta: nessuno ci ha mai preso un prezzo. Gli stati di una versione non tornano indietro, quindi «ha oggi ATTIVA o CHIUSA» = «ha avuto una versione attiva». Un listino con storia non si spegne con l''interruttore: si chiude con la fine validita'' della versione (vendite.trgfn_listini_guard_spegnimento_storia). Sede unica della regola: la legge anche il backend per mostrare il toggle «Attivo» solo a un listino senza storia. SECURITY INVOKER, STABLE. Richiesta BE §9.8 di brief-be-utenti-di-sviluppo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_listino_ha_storia(bigint);
