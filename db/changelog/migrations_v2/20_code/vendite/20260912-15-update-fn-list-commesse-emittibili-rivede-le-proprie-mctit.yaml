# IL RILANCIO DELLO STEP RIVEDE LE PROPRIE COMMESSE — la discovery riceve
# l'identita' del giro e legge la classe VISTA DAL GIRO.
#   Brief: brief-db-rilancio-step-non-rivede-le-proprie-commesse.md (D1)
#   Eredita: brief-db-il-trattenuto-passa-lo-stesso.md §5.3, §5.4, L3
#
# ── Il difetto (2026-09-12, LTF-0010972/3) ──────────────────────────────
#   Al rilancio di un pull fallito i PROPRI documenti sono TRATTENUTA (l'esito
#   ERRORE e' fuori dal savepoint che ha rimesso le righe a NON_EMESSA). Questa
#   funzione li scartava con la whitelist secca, il pull visitava ZERO
#   commesse, chiudeva COMPLETATO, ritirava le proprie segnalazioni: lotto
#   pulito, nessun documento. L'auto-esclusione del proprio lotto esisteva, ma
#   solo nell'emit (-62), un cancello a valle che non veniva mai raggiunto.
#   ⭐ E la prova «funziona» di L3 era stata letta dal caso sbagliato: «dalla
#   discovery sparisce 34137, una sola riga trattenuta» — trattenuta allora da
#   un ALTRO lotto. La stessa sparizione, al rerun, e' il difetto.
#
# ── Che cosa cambia ─────────────────────────────────────────────────────
#   · +1 parametro in coda, `p_emit_batch_id uuid DEFAULT NULL`: stesso nome
#     e stessa semantica dell'emit, cosi' il backend consegna UN dato a DUE
#     funzioni. RETURNS TABLE invariato; i chiamanti a sette argomenti non
#     cambiano comportamento (⛔ il pull DEVE passarlo — vedi §5 del brief, il
#     guard BE su lock_batch_id si sposta PRIMA della discovery).
#   · il predicato legge vendite.fn_classe_emittibilita_per_giro(-12) con il
#     lotto da vendite.fn_lotto_da_emit_batch (-13): la STESSA riga che legge
#     l'emit dal -14. Niente seconda copia.
#   · il COMMENT riscritto dove diceva «una commessa con SOLE righe trattenute
#     non ha niente da dare»: vero solo se a trattenerle e' un altro.
#
# ── 🔴 DROP + CREATE, non CREATE OR REPLACE ─────────────────────────────
#   Un parametro in piu' con DEFAULT crea un OVERLOAD accanto alla funzione
#   vecchia: con entrambe vive, una chiamata a sette argomenti matcha tutte e
#   due → «function is not unique». Si droppa la firma a sette.
#   Chiamanti censiti (12-09): backend commesse_repository.py (per nome, sette
#   argomenti: continua a funzionare col DEFAULT), cinque pgTAP per nome,
#   nessuna funzione o vista DB.
#
# ⚠️ Corpo ripreso dal changeSet -61, verificato IDENTICO a pg_proc il
#   2026-09-12 prima di modificarlo. %TYPE in firma e RETURNS TABLE come nel -61.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260912-15-update-fn-list-commesse-emittibili-rivede-le-proprie-mctit.yaml

  - changeSet:
      id: 20260912-15-update-fn-list-commesse-emittibili-rivede-le-proprie
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_list_commesse_emittibili: +p_emit_batch_id uuid DEFAULT
        NULL (l'identita' del giro, come nell'emit) e classe letta VISTA DAL
        GIRO da vendite.fn_classe_emittibilita_per_giro — al rilancio di un
        pull fallito la commessa coi propri documenti trattenuti viene
        visitata. DROP della firma a 7 (un default in piu' e' un overload).
        RETURNS TABLE invariato. Brief
        brief-db-rilancio-step-non-rivede-le-proprie-commesse (D1).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_classe_emittibilita_per_giro'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_lotto_da_emit_batch'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_views
                   WHERE schemaname = 'vendite' AND viewname = 'vw_commesse_attivita_emittibilita'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ DROP obbligatorio: un parametro in piu' con DEFAULT NON sostituisce la
              --   funzione, la AFFIANCA (overload). Con le due vive una chiamata a sette
              --   argomenti sarebbe ambigua: «function is not unique».
              DROP FUNCTION IF EXISTS vendite.fn_list_commesse_emittibili(date, bigint, integer, bigint, boolean, integer, text[]);

              CREATE OR REPLACE FUNCTION vendite.fn_list_commesse_emittibili(p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date, p_billing_account_id vendite.commesse.billing_account_id%TYPE DEFAULT NULL::bigint, p_utility_id vendite.commesse.utility_id%TYPE DEFAULT NULL::integer, p_emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL::bigint, p_fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE DEFAULT NULL::boolean, p_limit integer DEFAULT 1000, p_gruppi text[] DEFAULT NULL::text[], p_emit_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE DEFAULT NULL::uuid)
               RETURNS TABLE(commessa_id vendite.commesse.id%TYPE, codice vendite.commesse.codice%TYPE, stato_commessa_id vendite.commesse.stato_commessa_id%TYPE, stato_commessa vendite.stati_commessa.codice%TYPE, billing_account_id vendite.commesse.billing_account_id%TYPE, utility_id vendite.commesse.utility_id%TYPE, emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE, fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE, competenza_dal vendite.commesse.competenza_dal%TYPE, competenza_al vendite.commesse.competenza_al%TYPE, total_non_emesse bigint)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
                -- ⭐ IL LOTTO DI QUESTO GIRO (rev 2026-09-12), risolto dal marchio che il
                --   pull passa gia' all'emit. NULL = chiamante fuori pipeline = nessuna
                --   auto-esclusione (le trattenute restano tutte fuori, come prima).
                v_lotto_corrente  vendite.fatturazione_lotti.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Elencare le commesse pronte per l'emissione verso AF.
                --   Usata dal backend come discovery per il batch di
                --   emissione (fn_emit_attivita_fatturabili_da_commessa).
                --
                -- Criteri:
                --   1. Stato emittibile (stati_commessa.emittibile = true)
                --   2. Esistono righe commesse_attivita NON_EMESSA
                --   3. Competenza: se p_competenza_mese fornito, filtra righe
                --      commesse_attivita il cui competenza_mese coincide
                --      (coerente con pipeline AF che opera per mese)
                --   4. Filtri opzionali per perimetro billing/utility/emittente
                --   5. Filtro opzionale corsia: p_fatturazione_immediata
                --      (true=solo immediate / false=solo differite /
                --       NULL=indifferente, comportamento storico)
                --   6. rev 2026-07-27: p_gruppi restringe alle commesse che
                --      contengono almeno una riga di un gruppo richiesto.
                --      NON sostituisce il filtro per RIGA dentro l'emit: qui si
                --      sceglie QUALI COMMESSE visitare, li' QUALI RIGHE emettere.
                --      NULL = nessuna restrizione (comportamento storico).
                --   7. rev 2026-09-12 (brief-db-rilancio-step-non-rivede-le-proprie-
                --      commesse, D1): p_emit_batch_id e' l'identita' del giro — lo
                --      stesso parametro dell'emit — e la classe della riga si legge
                --      VISTA DAL GIRO: una commessa le cui righe sono TRATTENUTA dal
                --      lotto corrente stesso VIENE visitata, perche' l'emit possa
                --      riprenderle. Fino a oggi la whitelist era secca e al rilancio
                --      di un pull fallito la discovery rispondeva zero commesse: il
                --      lotto usciva COMPLETATO senza aver emesso niente.
                --
                -- Regole:
                --   - p_limit max 10000, default 1000
                --   - p_competenza_mese normalizzato al primo del mese
                --   - funzione STABLE (read-only)
                -- =========================================================
                IF p_limit IS NULL OR p_limit <= 0 THEN
                  p_limit := 1000;
                END IF;
                IF p_limit > 10000 THEN
                  p_limit := 10000;
                END IF;

                -- Il lotto che sta girando: sede unica della risoluzione, la stessa
                -- dell'emit (vendite.fn_lotto_da_emit_batch).
                v_lotto_corrente := vendite.fn_lotto_da_emit_batch(p_emit_batch_id);

                -- Normalizza al primo del mese
                v_competenza_mese := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                RETURN QUERY
                SELECT
                  c.id AS commessa_id,
                  c.codice,
                  c.stato_commessa_id,
                  sc.codice AS stato_commessa,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.fatturazione_immediata,
                  c.competenza_dal,
                  c.competenza_al,
                  count(e.commessa_attivita_id)::bigint AS total_non_emesse
                FROM vendite.commesse c
                JOIN vendite.stati_commessa sc
                  ON sc.id = c.stato_commessa_id
                 AND sc.emittibile = true
                -- ⭐ rev 2026-09-09 — LA SEDE UNICA DEL CRITERIO (changeSet 20260909-59).
                --   Qui non si scrive piu' quali righe «contano»: si legge la CLASSE.
                INNER JOIN vendite.vw_commesse_attivita_emittibilita e
                  ON e.commessa_id = c.id
                 -- ⭐ WHITELIST e non `<> 'TRATTENUTA'`: le tre classi che il pull PUO'
                 --   ancora prendere. Una classe nuova non entra da sola, ed e' la
                 --   convenzione di casa (linee-guida-sql §7c).
                 -- ⚠️ Equivale a «NON_EMESSA e non trattenuta»: EMESSA e ANNULLATA sono
                 --   esattamente le righe che NON_EMESSA escludeva.
                 -- ⭐⭐ MA LA CLASSE E' QUELLA VISTA DAL GIRO (rev 2026-09-12): una riga
                 --   TRATTENUTA soltanto dal lotto corrente e', per questo lotto, PRONTA.
                 --   E' il proprio documento di un tentativo fallito — l'esito ERRORE
                 --   e' scritto FUORI dal savepoint che ha rimesso le righe a NON_EMESSA
                 --   — e al rilancio la commessa DEVE essere visitata, perche' l'emit
                 --   possa riprenderla. La sede e' vendite.fn_classe_emittibilita_per_giro,
                 --   la stessa riga che legge l'emit: l'auto-esclusione non si ricopia.
                 -- ⛔ Fino a oggi qui stava scritto «una commessa con SOLE righe
                 --   trattenute non ha niente da dare»: vero solo se a trattenerle e' un
                 --   ALTRO lotto. Trattenuta da altri → resta fuori (niente pull a vuoto
                 --   registrato come lavorato); trattenuta da me → e' il mio lavoro.
                 -- ⚠️ Ma la classe NON basta da sola: il filtro per RIGA dentro
                 --   fn_emit_attivita_fatturabili_da_commessa resta indispensabile, perche'
                 --   una commessa con righe sane E trattenute passa comunque di qui.
                 AND vendite.fn_classe_emittibilita_per_giro(
                       e.classe_emittibilita, e.trattenuta_da_lotti, v_lotto_corrente)
                     IN ('PRONTA', 'RIFIUTATA', 'NON_APPROVATA')
                 -- ⚠️ UGUAGLIANZA e non `<=`, come e' sempre stato in questa funzione: la
                 --   lane e fn_select_attivita_fatturabili usano invece il cumulativo.
                 --   L'asimmetria e' PREESISTENTE e non si tocca qui — cambiarla di
                 --   straforo dentro un cantiere sul trattenuto allargherebbe il perimetro
                 --   di ogni pull senza che nessuno l'abbia deciso.
                 AND (v_competenza_mese IS NULL OR e.competenza_mese = v_competenza_mese)
                WHERE true
                  -- Filtro perimetro billing/utility/emittente
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_utility_id IS NULL OR c.utility_id = p_utility_id)
                  AND (p_emittente_soggetto_ruolo_id IS NULL OR c.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                  -- Filtro corsia immediata/differita (NULL = indifferente)
                  AND (p_fatturazione_immediata IS NULL OR c.fatturazione_immediata = p_fatturazione_immediata)
                  -- EMISSIONE MIRATA (rev 2026-07-27): il conteggio total_non_emesse segue
                  -- il filtro, cioe' riporta le righe dei soli gruppi richiesti. E' voluto:
                  -- e' il numero che l'emit lavorera' davvero su quella commessa.
                  AND (p_gruppi IS NULL OR e.gruppo_key = ANY (p_gruppi))
                GROUP BY
                  c.id,
                  c.codice,
                  c.stato_commessa_id,
                  sc.codice,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.competenza_dal,
                  c.competenza_al
                ORDER BY c.id
                LIMIT p_limit;
              END
              $function$;


              COMMENT ON FUNCTION vendite.fn_list_commesse_emittibili(p_competenza_mese date, p_billing_account_id bigint, p_utility_id integer, p_emittente_soggetto_ruolo_id bigint, p_fatturazione_immediata boolean, p_limit integer, p_gruppi text[], p_emit_batch_id uuid)
              IS 'Read-only: elenca le commesse in stato emittibile con righe che il pull puo'' prendere. Filtro competenza_mese su commesse_attivita (coerente con pipeline AF). Filtri opzionali per billing_account_id, utility_id, emittente_soggetto_ruolo_id e fatturazione_immediata (corsia immediata/differita, NULL=indifferente). Espone fatturazione_immediata in output. Usata dal backend come discovery del batch di emissione. rev 2026-07-27 (brief emissione mirata A6): p_gruppi text[] restringe alle commesse che contengono almeno una riga di un gruppo richiesto — NULL = nessuna restrizione (G1). ⚠️ NON sostituisce il filtro per RIGA dentro fn_emit_attivita_fatturabili_da_commessa: qui si sceglie QUALI COMMESSE visitare, li'' QUALI RIGHE emettere. Con p_gruppi valorizzato anche total_non_emesse segue il filtro. ⭐ rev 2026-09-09: le righe «che contano» si leggono come CLASSE da vendite.vw_commesse_attivita_emittibilita, whitelist PRONTA/RIFIUTATA/NON_APPROVATA. ⭐⭐ rev 2026-09-12 (brief-db-rilancio-step-non-rivede-le-proprie-commesse, D1): p_emit_batch_id e'' l''identita'' del giro (lo stesso parametro dell''emit; il lotto si risolve con vendite.fn_lotto_da_emit_batch) e la classe si legge VISTA DAL GIRO con vendite.fn_classe_emittibilita_per_giro: una riga TRATTENUTA soltanto dal lotto corrente e'' PRONTA, quindi al RILANCIO di un pull fallito la commessa viene visitata e l''emit riprende i propri documenti. Trattenuta da un ALTRO lotto in gioco → la commessa non si visita (niente pull a vuoto registrato come lavorato). p_emit_batch_id NULL = chiamante fuori pipeline = nessuna auto-esclusione, comportamento precedente. ⛔ Il pull DEVE passarlo: senza, scarta i propri documenti in silenzio — il backend fa il guard su lock_batch_id PRIMA di chiamare questa funzione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Torna la firma a sette del changeSet 20260909-61 (whitelist secca).
              DROP FUNCTION IF EXISTS vendite.fn_list_commesse_emittibili(date, bigint, integer, bigint, boolean, integer, text[], uuid);

              CREATE OR REPLACE FUNCTION vendite.fn_list_commesse_emittibili(p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date, p_billing_account_id vendite.commesse.billing_account_id%TYPE DEFAULT NULL::bigint, p_utility_id vendite.commesse.utility_id%TYPE DEFAULT NULL::integer, p_emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL::bigint, p_fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE DEFAULT NULL::boolean, p_limit integer DEFAULT 1000, p_gruppi text[] DEFAULT NULL::text[])
               RETURNS TABLE(commessa_id vendite.commesse.id%TYPE, codice vendite.commesse.codice%TYPE, stato_commessa_id vendite.commesse.stato_commessa_id%TYPE, stato_commessa vendite.stati_commessa.codice%TYPE, billing_account_id vendite.commesse.billing_account_id%TYPE, utility_id vendite.commesse.utility_id%TYPE, emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE, fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE, competenza_dal vendite.commesse.competenza_dal%TYPE, competenza_al vendite.commesse.competenza_al%TYPE, total_non_emesse bigint)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Elencare le commesse pronte per l'emissione verso AF.
                --   Usata dal backend come discovery per il batch di
                --   emissione (fn_emit_attivita_fatturabili_da_commessa).
                --
                -- Criteri:
                --   1. Stato emittibile (stati_commessa.emittibile = true)
                --   2. Esistono righe commesse_attivita NON_EMESSA
                --   3. Competenza: se p_competenza_mese fornito, filtra righe
                --      commesse_attivita il cui competenza_mese coincide
                --      (coerente con pipeline AF che opera per mese)
                --   4. Filtri opzionali per perimetro billing/utility/emittente
                --   5. Filtro opzionale corsia: p_fatturazione_immediata
                --      (true=solo immediate / false=solo differite /
                --       NULL=indifferente, comportamento storico)
                --   6. rev 2026-07-27: p_gruppi restringe alle commesse che
                --      contengono almeno una riga di un gruppo richiesto.
                --      NON sostituisce il filtro per RIGA dentro l'emit: qui si
                --      sceglie QUALI COMMESSE visitare, li' QUALI RIGHE emettere.
                --      NULL = nessuna restrizione (comportamento storico).
                --
                -- Regole:
                --   - p_limit max 10000, default 1000
                --   - p_competenza_mese normalizzato al primo del mese
                --   - funzione STABLE (read-only)
                -- =========================================================
                IF p_limit IS NULL OR p_limit <= 0 THEN
                  p_limit := 1000;
                END IF;
                IF p_limit > 10000 THEN
                  p_limit := 10000;
                END IF;

                -- Normalizza al primo del mese
                v_competenza_mese := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                RETURN QUERY
                SELECT
                  c.id AS commessa_id,
                  c.codice,
                  c.stato_commessa_id,
                  sc.codice AS stato_commessa,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.fatturazione_immediata,
                  c.competenza_dal,
                  c.competenza_al,
                  count(e.commessa_attivita_id)::bigint AS total_non_emesse
                FROM vendite.commesse c
                JOIN vendite.stati_commessa sc
                  ON sc.id = c.stato_commessa_id
                 AND sc.emittibile = true
                -- ⭐ rev 2026-09-09 — LA SEDE UNICA DEL CRITERIO (changeSet 20260909-59).
                --   Qui non si scrive piu' quali righe «contano»: si legge la CLASSE.
                INNER JOIN vendite.vw_commesse_attivita_emittibilita e
                  ON e.commessa_id = c.id
                 -- ⭐ WHITELIST e non `<> 'TRATTENUTA'`: le tre classi che il pull PUO'
                 --   ancora prendere. Una classe nuova non entra da sola, ed e' la
                 --   convenzione di casa (linee-guida-sql §7c).
                 -- ⚠️ Equivale a «NON_EMESSA e non trattenuta»: EMESSA e ANNULLATA sono
                 --   esattamente le righe che NON_EMESSA escludeva.
                 -- ⛔ TRATTENUTA esce, ed e' il punto: una commessa che ha SOLO righe
                 --   trattenute non ha niente da dare, e visitarla produrrebbe un pull a
                 --   vuoto che il giro registra come lavorato.
                 -- ⚠️ Ma la classe NON basta da sola: il filtro per RIGA dentro
                 --   fn_emit_attivita_fatturabili_da_commessa resta indispensabile, perche'
                 --   una commessa con righe sane E trattenute passa comunque di qui.
                 AND e.classe_emittibilita IN ('PRONTA', 'RIFIUTATA', 'NON_APPROVATA')
                 -- ⚠️ UGUAGLIANZA e non `<=`, come e' sempre stato in questa funzione: la
                 --   lane e fn_select_attivita_fatturabili usano invece il cumulativo.
                 --   L'asimmetria e' PREESISTENTE e non si tocca qui — cambiarla di
                 --   straforo dentro un cantiere sul trattenuto allargherebbe il perimetro
                 --   di ogni pull senza che nessuno l'abbia deciso.
                 AND (v_competenza_mese IS NULL OR e.competenza_mese = v_competenza_mese)
                WHERE true
                  -- Filtro perimetro billing/utility/emittente
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_utility_id IS NULL OR c.utility_id = p_utility_id)
                  AND (p_emittente_soggetto_ruolo_id IS NULL OR c.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                  -- Filtro corsia immediata/differita (NULL = indifferente)
                  AND (p_fatturazione_immediata IS NULL OR c.fatturazione_immediata = p_fatturazione_immediata)
                  -- EMISSIONE MIRATA (rev 2026-07-27): il conteggio total_non_emesse segue
                  -- il filtro, cioe' riporta le righe dei soli gruppi richiesti. E' voluto:
                  -- e' il numero che l'emit lavorera' davvero su quella commessa.
                  AND (p_gruppi IS NULL OR e.gruppo_key = ANY (p_gruppi))
                GROUP BY
                  c.id,
                  c.codice,
                  c.stato_commessa_id,
                  sc.codice,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.competenza_dal,
                  c.competenza_al
                ORDER BY c.id
                LIMIT p_limit;
              END
              $function$;


              COMMENT ON FUNCTION vendite.fn_list_commesse_emittibili(p_competenza_mese date, p_billing_account_id bigint, p_utility_id integer, p_emittente_soggetto_ruolo_id bigint, p_fatturazione_immediata boolean, p_limit integer, p_gruppi text[])
              IS 'Read-only: elenca commesse in stato emittibile con attivita` NON_EMESSA. Filtro competenza_mese su commesse_attivita (coerente con pipeline AF). Filtri opzionali per billing_account_id, utility_id, emittente_soggetto_ruolo_id e fatturazione_immediata (corsia immediata/differita, NULL=indifferente). Espone fatturazione_immediata in output. Usata dal backend per il batch di emissione. rev 2026-07-27 (brief emissione mirata A6): p_gruppi text[] restringe alle commesse che contengono almeno una riga di un gruppo richiesto — NULL = nessuna restrizione (G1). ⚠️ NON sostituisce il filtro per RIGA dentro fn_emit_attivita_fatturabili_da_commessa: qui si sceglie QUALI COMMESSE visitare, li'' QUALI RIGHE emettere; una commessa multi-sorgente passa comunque il filtro e sara'' l''emit a prendere solo le righe richieste. Con p_gruppi valorizzato anche total_non_emesse segue il filtro: e'' il numero di righe che l''emit lavorera'' davvero. ⭐ rev 2026-09-09: le righe «che contano» non sono piu'' descritte qui — si legge `classe_emittibilita` da vendite.vw_commesse_attivita_emittibilita, con la whitelist PRONTA/RIFIUTATA/NON_APPROVATA. ⛔ Ne esce TRATTENUTA: una commessa con SOLE righe trattenute da un altro lotto in gioco non ha niente da dare, e visitarla produrrebbe un pull a vuoto registrato come lavorato. ⚠️ Ma non sostituisce il filtro per RIGA dentro l''emit: una commessa con righe sane E trattenute passa comunque di qui, ed e'' li'' che le trattenute vanno lasciate fuori.';
