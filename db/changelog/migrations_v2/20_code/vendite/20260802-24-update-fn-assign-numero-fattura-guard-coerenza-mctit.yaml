# Fase 4b / D-K — guard di coerenza PRIMA di consumare il numero fiscale
#   (piano-db-satelliti-fattura.md §3.4-bis, passo 4b.1)
#
# IL FATTO. Oggi la numerazione verifica UNA cosa sola: che il documento abbia
#   righe (E_FATTURA_SENZA_RIGHE, 20260728-05). Tutto il resto passa. Misurato
#   sul DB il 2026-08-02: la fattura 362 e' DEFINITIVA, ha numero 6, un totale
#   di 200 e ZERO rate. Non e' un'ipotesi di scuola — e' un documento fiscale
#   gia' emesso senza piano di pagamento, e nulla lo ha intercettato.
#
# LE SEI CONDIZIONI. Un documento non si numera se:
#   1) `totale_a_pagare` e' NULL              -> i totali non sono mai stati calcolati;
#   2) ci sono righe ma nessun riepilogo IVA  -> l'IVA non e' stata certificata;
#   3) `totale_a_pagare > 0` e nessuna rata, oppure somma rate != totale;
#   4) `totale_a_pagare <= 0` ma esistono rate -> coerente con D-D: un documento
#      non positivo non si rateizza (il CHECK di fatture_scadenze lo dice gia');
#   5) i riepiloghi IVA non quadrano con i totali di testata;
#   6) `totale_a_pagare` non e' la somma dei suoi addendi.
#
# LA CATENA, ED E' IL PUNTO. Prese insieme le sei condizioni verificano un
#   percorso continuo, senza anelli scoperti:
#
#     riepiloghi IVA --(5)--> totale_doc --(6)--> totale_a_pagare --(3/4)--> rate
#
#   La 6 e' stata aggiunta il 2026-08-02 (osservazione di Tid) e chiude l'anello
#   di mezzo, che era l'unico aperto: la 5 legava i riepiloghi a `totale_doc` e
#   la 3 legava le rate a `totale_a_pagare`, ma NULLA legava i due totali fra
#   loro. Conseguenza concreta: un fondo o un acconto registrato DOPO il
#   ricalcolo lasciava `totale_a_pagare` al valore vecchio e sarebbe passato
#   indisturbato — con rate che quadrano perfettamente con un totale che non
#   tiene conto dell'acconto. L'identita' verificata e' quella scritta in
#   `fn_ricalcola_totali_fattura`:
#     totale_a_pagare = totale_doc + fondi
#                       + arrotondamento_precedente + arrotondamento_attuale
#   Il guard non ricalcola: verifica che il valore scritto sia ancora quello che
#   i suoi addendi producono.
#
# LA QUINTA E' STATA AGGIUNTA IL 2026-08-02 (decisione Tid) e NON e' una
#   tautologia, benche' `fn_ricalcola_totali_fattura` derivi `totale_doc`
#   proprio sommando i riepiloghi. La ragione e' che i due lati si possono
#   muovere separatamente: `vendite.fatture_riepiloghi_iva` NON ha il guard di
#   congelamento dei satelliti (esclusa apposta in Fase 1.2, perche' la sua
#   riscrittura passa da `fn_ricalcola_riepilogo_iva_fattura` che la soglia ce
#   l'ha gia'), quindi esiste una strada per riscrivere i riepiloghi senza
#   ricalcolare la testata. In quel caso `totale_doc` resta al valore vecchio e
#   il documento va allo SDI con un'IVA che non corrisponde ai suoi totali.
#   Si controlla la catena intera — somme -> colonne di sintesi -> totale_doc —
#   e non solo l'estremo: due errori che si compensano darebbero un totale
#   giusto con dentro numeri sbagliati.
#
# ⚠️ PERCHE' QUI E PRIMA DEL PROGRESSIVO — con una RETTIFICA alla motivazione
#   che girava finora. Il changeSet 20260728-05 (e la prima stesura di questo)
#   motivavano la posizione con «nextval NON fa rollback, fallire dopo lascia un
#   buco nella numerazione fiscale». VERIFICATO IL 2026-08-02: e' FALSO per
#   questo modello. `fn_get_next_progressivo` non usa alcuna sequence — e'
#   `pg_advisory_xact_lock` + `SELECT ... FOR UPDATE` + `UPDATE last_numero` su
#   vendite.registri_fatturazione_progressivi. Prove:
#     - pg_get_serial_sequence('vendite.registri_fatturazione_progressivi',
#       'last_numero') restituisce NULL;
#     - `nextval` compare in fn_assign_numero_fattura solo dentro un COMMENTO.
#   Il progressivo e' quindi pienamente transazionale: fa rollback, e il buco
#   che quella motivazione descriveva non si forma. Il 20260728-05 e' mergiato e
#   NON si tocca (e' storia): la rettifica sta qui.
#
#   La posizione resta comunque quella giusta, per tre ragioni vere:
#     1) non si scrive prima di aver validato — una fattura incoerente non tocca
#        affatto registri_fatturazione_progressivi;
#     2) contesa sul lock: fn_get_next_progressivo prende un
#        pg_advisory_xact_lock sul registro che dura fino a fine transazione;
#        validare prima significa che un documento rotto non entra mai in
#        contesa su quel lock, e in una numerazione massiva e' concreto;
#     3) contare sul rollback vuol dire dipendere dal fatto che NESSUN chiamante
#        intrappoli l'eccezione e prosegua. Oggi nessuno lo fa, ma e' una
#        garanzia altrui: non consumare affatto e' piu' solido che confidare in
#        chi ripulisce.
#
# ⚠️ E IL BUCO DI NUMERAZIONE, ALLORA? Non e' il problema principale, ed e' bene
#   dirlo perche' orienta le priorita'. Il numero viaggia con il documento:
#   se il documento non sopravvive alla transazione, non sopravvive nemmeno il
#   suo numero. Il danno grave e' l'OPPOSTO e soprattutto e' IRREVERSIBILE —
#   dare un numero fiscale valido a un documento invalido. Una volta numerato il
#   documento e' DEFINITIVA, i satelliti sono congelati dal guard di Fase 1, e le
#   rate mancanti non si possono piu' aggiungere: l'errore diventa permanente e
#   si ripara solo con una nota di variazione, quando e' gia' in mano al cliente
#   e magari gia' allo SDI. Un salto nella sequenza e' un'anomalia di registro
#   che si spiega; un documento fiscale sbagliato no.
#   ℹ️ Rischio residuo di buco, tracciato e NON affrontato qui: non esiste un
#   trigger BEFORE DELETE che impedisca di cancellare una fattura gia' numerata.
#   Le strade applicative sono chiuse (dopo D-L.2 le funzioni di reset accettano
#   solo fatture pre-fiscali), ma una DELETE diretta passerebbe. Misurato il
#   2026-08-02: nessun buco in essere (registro 3, anno 2026, numeri 1-6,
#   sequenza intatta).
#
# ⚠️ SI VERIFICA IL RISULTATO, NON SI RINCORRONO GLI SCRITTORI. Il guard non sa
#   quale task avrebbe dovuto scrivere cosa: guarda lo stato finale del
#   documento. Cosi' copre anche le cause future, e soprattutto la piu'
#   probabile di tutte — il task che non ha girato affatto.
#
# UN CODICE SOLO, I MOTIVI TUTTI INSIEME. Si accumulano in un array e si
#   sollevano in un colpo: chi riceve l'errore vede TUTTO cio' che manca al
#   documento, invece di scoprirlo un giro alla volta. Stessa scelta del guard
#   di uscita da DRAFT (575).
#
# NON RETROATTIVO: le fatture gia' numerate restano come sono. La 362 non viene
#   toccata; il guard vale da adesso in avanti.
#
# COSA NON CONTROLLA, DI PROPOSITO: indirizzi e intestazione, gia' presidiati a
#   monte dal guard di uscita da DRAFT (E_FATTURA_NON_EMETTIBILE_INCOMPLETA,
#   575) — ricontrollarli qui darebbe una seconda occasione di fallire su un
#   documento gia' emesso; e lo stato, che e' della matrice delle transizioni.
#
# IMPATTO MISURATO (2026-08-02, 10 fatture in tabella):
#   - condizioni 5 e 6: ZERO violazioni, nessuna deriva in essere;
#   - condizione 3: bloccherebbe 632/834/835/836, che sono anteriori alla
#     catena 3b e non hanno il termine in testata (comportamento corretto);
#   - le 5 fatture gia' numerate con totale 0 e zero rate passano tutte.
#   ⚠️ ONESTA' DELLA MISURA: oggi fondi e arrotondamenti sono a ZERO su tutte e
#     dieci le fatture, quindi la condizione 6 e' verificata su un caso
#     degenere (0 + 0 + 0). Regge, ma non e' "collaudata sul campo": e'
#     protezione che si accendera' al primo acconto o al primo arrotondamento
#     reale. Il pgTAP di 4b.4 la esercita invece con valori veri, ed e' li'
#     che va guardata.
#
# COSA CAMBIA rispetto alla versione precedente: solo il blocco di guard nuovo.
#   Firma, RETURNS TABLE, lock `FOR UPDATE OF f` e resto del corpo identici ->
#   CREATE OR REPLACE puro, nessun DROP.
#
# Base: doc auto-gen docs/it/dbzero/vendite/funzioni/fn_assign_numero_fattura.md
#   (corpo) + 20260728-05 (firma con %TYPE, che l'auto-gen scioglie).
#   Dipendenze: codice errore E_FATTURA_NON_NUMERABILE_INCOERENTE (id 574,
#   gia' a seed dalla Fase 1.3 — nessun loader nuovo).
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/vendite/20260802-24-update-fn-assign-numero-fattura-guard-coerenza-mctit.yaml

    - changeSet:
          id: 20260802-24-update-fn-assign-numero-fattura-guard-coerenza
          author: mctit
          runOnChange: false
          validCheckSums:
              - ANY
          failOnError: true
          comment: >
              D-K: fn_assign_numero_fattura rifiuta di numerare una fattura incoerente
              (totali, riepilogo IVA, piano rate, quadratura IVA/totali) prima che il
              progressivo venga consumato.
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION vendite.fn_assign_numero_fattura(
                            p_fattura_id vendite.fatture.id%TYPE
                        )
                        RETURNS TABLE(
                            registro_id vendite.fatture.registro_id%TYPE,
                            anno        vendite.fatture.anno%TYPE,
                            mese        SMALLINT,
                            serie       vendite.fatture.serie%TYPE,
                            numero      vendite.fatture.numero%TYPE
                        )
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_registro_id vendite.fatture.registro_id%TYPE;
                            v_data        vendite.fatture.data%TYPE;
                            v_serie       vendite.fatture.serie%TYPE;
                            v_reset       vendite.registri_fatturazione.reset_policy%TYPE;
                            v_anno        vendite.fatture.anno%TYPE;
                            v_mese        SMALLINT;
                            v_numero      vendite.fatture.numero%TYPE;
                            -- D-K: stato dei satelliti, letto una volta sola.
                            v_tot_pagare  vendite.fatture.totale_a_pagare%TYPE;
                            v_tot_doc     vendite.fatture.totale_doc%TYPE;
                            v_impo_tot    vendite.fatture.imponibile_tot%TYPE;
                            v_imps_tot    vendite.fatture.imposta_tot%TYPE;
                            v_n_iva       INTEGER;
                            v_sum_impo    NUMERIC;
                            v_sum_imps    NUMERIC;
                            v_n_rate      INTEGER;
                            v_sum_rate    NUMERIC;
                            v_fondi       NUMERIC;
                            v_arr_prec    vendite.fatture.arrotondamento_precedente%TYPE;
                            v_arr_att     vendite.fatture.arrotondamento_attuale%TYPE;
                            v_motivi      TEXT[] := ARRAY[]::TEXT[];
                        BEGIN
                            -- Guard: parametro obbligatorio
                            IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_assign_numero_fattura', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id),
                                    NULL::uuid, 'p_fattura_id obbligatorio e > 0'
                                );
                            END IF;

                            -- Recupera dati fattura + registro con lock (solo la riga fattura, alias f)
                            SELECT f.registro_id,
                                   f.data,
                                   COALESCE(f.serie, r.serie_default, ''),
                                   r.reset_policy
                              INTO v_registro_id, v_data, v_serie, v_reset
                              FROM vendite.fatture f
                              JOIN vendite.registri_fatturazione r ON r.id = f.registro_id
                             WHERE f.id = p_fattura_id
                               FOR UPDATE OF f;

                            IF v_registro_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_assign_numero_fattura', 'E_VALORE_MANCANTE',
                                    jsonb_build_object('fattura_id', p_fattura_id),
                                    NULL::uuid, concat('fattura_id ', p_fattura_id)
                                );
                            END IF;

                            -- ----------------------------------------------------
                            -- Guard D3: un documento senza righe non si numera.
                            -- ⚠️ RETTIFICA 2026-08-02: la motivazione originale diceva
                            --    «nextval non fa rollback». Non e' vero qui —
                            --    fn_get_next_progressivo e' table-based e transazionale
                            --    (verificato: nessuna sequence su
                            --    registri_fatturazione_progressivi.last_numero). Il guard
                            --    resta PRIMA, ma perche' non si scrive prima di aver
                            --    validato e per non entrare in contesa sull'advisory lock
                            --    del registro: vedi l'intestazione del changeSet.
                            -- brief-fix-importi-riga-fattura-zero §4.5.
                            -- ----------------------------------------------------
                            PERFORM 1
                               FROM vendite.fatture_righe r
                              WHERE r.fattura_id = p_fattura_id
                              LIMIT 1;
                            IF NOT FOUND THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_assign_numero_fattura', 'E_FATTURA_SENZA_RIGHE',
                                    jsonb_build_object('fattura_id', p_fattura_id,
                                                       'registro_id', v_registro_id),
                                    NULL::uuid, p_fattura_id::text
                                );
                            END IF;

                            -- ----------------------------------------------------
                            -- Guard D-K (Fase 4b): coerenza del documento, sempre
                            -- PRIMA di consumare il progressivo.
                            -- Si guarda il RISULTATO, non chi avrebbe dovuto scriverlo:
                            -- cosi' il presidio copre anche il caso piu' probabile, cioe'
                            -- un task dello step EMESSA che non ha girato affatto.
                            -- Da qui in poi sappiamo gia' che le righe esistono.
                            -- ----------------------------------------------------
                            SELECT f.totale_a_pagare, f.totale_doc, f.imponibile_tot, f.imposta_tot,
                                   (SELECT count(*)::int             FROM vendite.fatture_riepiloghi_iva i WHERE i.fattura_id = p_fattura_id),
                                   (SELECT COALESCE(sum(i.imponibile), 0) FROM vendite.fatture_riepiloghi_iva i WHERE i.fattura_id = p_fattura_id),
                                   (SELECT COALESCE(sum(i.imposta), 0)    FROM vendite.fatture_riepiloghi_iva i WHERE i.fattura_id = p_fattura_id),
                                   (SELECT count(*)::int             FROM vendite.fatture_scadenze s WHERE s.fattura_id = p_fattura_id),
                                   (SELECT COALESCE(sum(s.importo), 0)    FROM vendite.fatture_scadenze s WHERE s.fattura_id = p_fattura_id),
                                   COALESCE(vendite.fn_get_totale_fondi_fattura(p_fattura_id), 0),
                                   f.arrotondamento_precedente, f.arrotondamento_attuale
                              INTO v_tot_pagare, v_tot_doc, v_impo_tot, v_imps_tot,
                                   v_n_iva, v_sum_impo, v_sum_imps, v_n_rate, v_sum_rate,
                                   v_fondi, v_arr_prec, v_arr_att
                              FROM vendite.fatture f
                             WHERE f.id = p_fattura_id;

                            -- ⚠️ `array_append` e non `|| 'testo'`: con un letterale non
                            --    tipizzato PostgreSQL prova a leggerlo come letterale di
                            --    ARRAY e solleva «l'array deve iniziare con {». I rami che
                            --    usano format() non lo mostrano — format() restituisce gia'
                            --    un text — quindi il difetto si nasconde nei soli casi a
                            --    testo fisso. Qui la forma e' una sola per tutti e cinque.

                            -- 1) I totali non sono mai stati calcolati.
                            IF v_tot_pagare IS NULL THEN
                                v_motivi := array_append(v_motivi, 'totali non calcolati (totale_a_pagare assente)');
                            END IF;

                            -- 2) Righe presenti (verificato sopra) ma nessun riepilogo IVA.
                            IF v_n_iva = 0 THEN
                                v_motivi := array_append(v_motivi, 'riepilogo IVA assente');
                            END IF;

                            -- 3) Documento da incassare: il piano rate deve esserci e quadrare.
                            --    L'uguaglianza e' esatta perche' il generatore quadra per
                            --    costruzione (l'ultima rata assorbe la differenza) e i tipi
                            --    sono NUMERIC, non floating point.
                            IF v_tot_pagare > 0 AND v_n_rate = 0 THEN
                                v_motivi := array_append(v_motivi, 'piano rate assente');
                            ELSIF v_tot_pagare > 0 AND v_sum_rate <> v_tot_pagare THEN
                                v_motivi := array_append(v_motivi, format(
                                    'somma delle rate (%s) diversa dal totale a pagare (%s)',
                                    v_sum_rate, v_tot_pagare));
                            END IF;

                            -- 4) D-D allo specchio: un documento non positivo non si rateizza.
                            IF v_tot_pagare IS NOT NULL AND v_tot_pagare <= 0 AND v_n_rate > 0 THEN
                                v_motivi := array_append(v_motivi, format(
                                    'presenti %s rate su un totale a pagare non positivo (%s)',
                                    v_n_rate, v_tot_pagare));
                            END IF;

                            -- 5) I riepiloghi IVA devono quadrare con i totali di testata.
                            --    Si controlla la catena intera e non il solo estremo: due
                            --    scostamenti che si compensano darebbero un totale giusto
                            --    con dentro numeri sbagliati.
                            IF COALESCE(v_sum_impo, 0) <> COALESCE(v_impo_tot, 0)
                               OR COALESCE(v_sum_imps, 0) <> COALESCE(v_imps_tot, 0)
                               OR COALESCE(v_impo_tot, 0) + COALESCE(v_imps_tot, 0) <> COALESCE(v_tot_doc, 0) THEN
                                v_motivi := array_append(v_motivi, format(
                                    'riepilogo IVA non coerente con i totali di testata (imponibile %s vs %s, imposta %s vs %s, totale_doc %s)',
                                    v_sum_impo, v_impo_tot, v_sum_imps, v_imps_tot, v_tot_doc));
                            END IF;

                            -- 6) L'ultimo anello: `totale_a_pagare` deve DERIVARE da
                            --    `totale_doc`. Senza questo controllo la catena resta
                            --    aperta nel mezzo — la 5 lega i riepiloghi a totale_doc e
                            --    la 3 lega le rate a totale_a_pagare, ma nulla legherebbe
                            --    i due totali fra loro, e un fondo aggiunto dopo il
                            --    ricalcolo passerebbe indisturbato: rate che quadrano con
                            --    un totale che non tiene conto dell'acconto.
                            --    L'identita' e' quella di fn_ricalcola_totali_fattura:
                            --      totale_a_pagare = totale_doc + fondi
                            --                        + arrotondamento_precedente
                            --                        + arrotondamento_attuale
                            --    Non si ricalcola nulla: si verifica che il valore scritto
                            --    sia ancora quello che i suoi addendi producono.
                            --    Saltata se il totale e' NULL: l'ha gia' detto la 1, e
                            --    ripeterlo qui come «0 non corrisponde» sarebbe rumore.
                            IF v_tot_pagare IS NOT NULL
                               AND v_tot_pagare <> COALESCE(v_tot_doc, 0) + COALESCE(v_fondi, 0)
                                                   + COALESCE(v_arr_prec, 0) + COALESCE(v_arr_att, 0) THEN
                                v_motivi := array_append(v_motivi, format(
                                    'totale a pagare (%s) non corrisponde alla somma dei suoi addendi: totale_doc %s + fondi %s + arrotondamenti %s/%s',
                                    v_tot_pagare, v_tot_doc, v_fondi, v_arr_prec, v_arr_att));
                            END IF;

                            -- Un errore solo, con TUTTI i motivi: chi lo riceve vede in una
                            -- volta cosa manca al documento invece di scoprirlo un giro
                            -- alla volta.
                            IF array_length(v_motivi, 1) > 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_assign_numero_fattura', 'E_FATTURA_NON_NUMERABILE_INCOERENTE',
                                    jsonb_build_object(
                                        'fattura_id',      p_fattura_id,
                                        'registro_id',     v_registro_id,
                                        'motivi',          to_jsonb(v_motivi),
                                        'totale_a_pagare', v_tot_pagare,
                                        'totale_doc',      v_tot_doc,
                                        'riepiloghi_iva',  v_n_iva,
                                        'rate',            v_n_rate,
                                        'somma_rate',      v_sum_rate,
                                        'fondi',           v_fondi,
                                        'arrotondamento_precedente', v_arr_prec,
                                        'arrotondamento_attuale',    v_arr_att),
                                    NULL::uuid,
                                    p_fattura_id::text,
                                    array_to_string(v_motivi, '; ')
                                );
                            END IF;

                            -- Calcolo progressivo
                            v_anno := vendite.fn_get_anno_registro(v_data);
                            v_numero := vendite.fn_get_next_progressivo(v_registro_id, v_data, v_serie);
                            v_mese := CASE WHEN v_reset = 'MENSILE'
                                           THEN EXTRACT(MONTH FROM v_data)::SMALLINT
                                           ELSE NULL
                                       END;

                            -- Aggiorna testata fattura
                            UPDATE vendite.fatture
                               SET anno = v_anno,
                                   serie = NULLIF(v_serie, ''),
                                   numero = v_numero,
                                   data_update = now(),
                                   user_update = current_user
                             WHERE id = p_fattura_id;

                            RETURN QUERY SELECT v_registro_id, v_anno, v_mese, NULLIF(v_serie, '')::VARCHAR, v_numero;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_assign_numero_fattura(p_fattura_id bigint)
                        IS 'Assegna anno/serie/numero alla fattura usando registro e progressivo con lock. E'' il punto UNICO in cui il progressivo viene assegnato — fn_numera_fattura_opz_emessa delega qui — quindi i presidi valgono per qualunque percorso senza doverli enumerare. Due guard, entrambi PRIMA di fn_get_next_progressivo: (a) E_FATTURA_SENZA_RIGHE, rev 2026-07-28, origine fatture 207 e 208 numerate e senza righe; (b) E_FATTURA_NON_NUMERABILE_INCOERENTE (D-K, Fase 4b, rev 2026-08-02) su sei condizioni che insieme verificano una catena continua — riepiloghi IVA -> totale_doc -> totale_a_pagare -> rate — senza anelli scoperti: totali non calcolati, riepilogo IVA assente, piano rate assente o non quadrante con totale_a_pagare, rate presenti su totale non positivo (D-D allo specchio), riepiloghi IVA non coerenti con i totali di testata, e totale_a_pagare diverso dalla somma dei suoi addendi (totale_doc + fondi + arrotondamento precedente e attuale). La quinta non e'' ridondante benche'' fn_ricalcola_totali_fattura derivi totale_doc dai riepiloghi: fatture_riepiloghi_iva e'' fuori dal guard di congelamento dei satelliti, quindi si puo'' riscrivere lasciando la testata al valore vecchio. La sesta chiude l''anello di mezzo, l''unico che restava aperto: senza, un fondo registrato DOPO il ricalcolo passa indisturbato e le rate quadrano con un totale che non tiene conto dell''acconto. Il guard verifica il RISULTATO e non rincorre gli scrittori, cosi'' copre anche il caso piu'' probabile — un task dello step EMESSA che non ha girato affatto — e accumula TUTTI i motivi in un errore solo. ⚠️ RETTIFICA 2026-08-02 alla motivazione che girava finora: la posizione PRIMA del progressivo NON serve a evitare un buco di numerazione. fn_get_next_progressivo non usa sequence — e'' table-based con advisory lock su registri_fatturazione_progressivi — quindi e'' transazionale e il numero fa rollback insieme al documento. Le ragioni vere sono tre: non si scrive prima di aver validato, non si entra in contesa sull''advisory lock del registro con un documento gia'' rotto, e non si dipende dal fatto che il chiamante ripulisca. Il danno che il guard evita e'' l''opposto e IRREVERSIBILE: un numero fiscale valido su un documento invalido, che una volta assegnato congela i satelliti e si ripara solo con una nota di variazione. Origine: fattura 362, DEFINITIVA con numero 6, totale 200 e zero rate. Non retroattivo. piano-db-satelliti-fattura §3.4-bis.';
