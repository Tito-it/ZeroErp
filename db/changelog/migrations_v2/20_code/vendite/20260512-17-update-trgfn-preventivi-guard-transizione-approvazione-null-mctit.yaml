# ------------------------------------------------------------
# UPDATE vendite.trgfn_preventivi_guard_transizione_approvazione
#   Aggiunge Check 3: blocca ACCETTATO se esistono componenti
#   BoM CASO A con prezzo_unitario IS NULL (pending valorizzazione).
#
# Why: con p_force_manuale=TRUE un operatore puo' creare componenti
# con prezzo NULL. Il preventivo non deve transitare ad ACCETTATO
# finche' tutti i prezzi non sono valorizzati (invariante di dominio).
#
# Stato attuale: Check 1 (righe PENDING approvazione),
#                Check 2 (componenti PENDING approvazione).
# Aggiunto:      Check 3 (componenti con prezzo NULL).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260512-17-update-trgfn-preventivi-guard-transizione-approvazione-null-mctit.yaml

  - changeSet:
      id: 20260512-17-update-trgfn-preventivi-guard-transizione-approvazione-null
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Aggiunge Check 3 a trgfn_preventivi_guard_transizione_approvazione:
        blocca ACCETTATO se componenti BoM CASO A hanno prezzo NULL (pending).
        E_DOC_COMPONENTI_PENDING_VALORIZZAZIONE (id 441).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: preventivi
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_preventivi_guard_transizione_approvazione()
              RETURNS TRIGGER
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca la transizione a ACCETTATO di un preventivo con
              --   righe o componenti BoM CASO A ancora in workflow approvazione
              --   prezzo (stato_approvazione_prezzo=PENDING) oppure con
              --   componenti con prezzo_unitario IS NULL (pending valorizzazione).
              DECLARE
                  v_stato_codice config.stati_doc_preventivi.codice_interno%TYPE;
              BEGIN
                  SELECT sdp.codice_interno INTO v_stato_codice
                    FROM config.stati_doc_preventivi sdp
                   WHERE sdp.id = NEW.stato_doc_preventivo_id;

                  IF v_stato_codice IS DISTINCT FROM 'ACCETTATO' THEN
                      RETURN NEW;
                  END IF;

                  -- Check 1: righe preventivo con prezzo PENDING approvazione
                  IF EXISTS (
                      SELECT 1 FROM vendite.preventivi_righe pr
                       WHERE pr.preventivo_id = NEW.id
                         AND pr.stato_approvazione_prezzo = 'PENDING'::config.stato_approvazione_prezzo
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_PREVENTIVO_RIGHE_PRICING_PENDENTI',
                          jsonb_build_object('preventivo_id', NEW.id,
                              'hint', 'Riga preventivo in attesa di approvazione prezzo. '
                                   || 'Attendi esito o rifiuta la richiesta prima di accettare.'),
                          NULL::uuid, NEW.id::text
                      );
                  END IF;

                  -- Check 2: componenti BoM CASO A con prezzo PENDING approvazione
                  IF EXISTS (
                      SELECT 1 FROM vendite.preventivi_righe pr
                        JOIN vendite.preventivi_righe_componenti prc
                          ON prc.riga_preventivo_id = pr.id
                       WHERE pr.preventivo_id = NEW.id
                         AND prc.stato_approvazione_prezzo = 'PENDING'::config.stato_approvazione_prezzo
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_PREVENTIVO_RIGHE_PRICING_PENDENTI',
                          jsonb_build_object('preventivo_id', NEW.id,
                              'hint', 'Componente BoM CASO A in attesa di approvazione prezzo. '
                                   || 'Attendi esito su tutti i componenti prima di accettare.'),
                          NULL::uuid, NEW.id::text
                      );
                  END IF;

                  -- Check 3: componenti BoM CASO A con prezzo NULL (pending valorizzazione manuale)
                  IF EXISTS (
                      SELECT 1 FROM vendite.preventivi_righe pr
                        JOIN vendite.preventivi_righe_componenti prc
                          ON prc.riga_preventivo_id = pr.id
                       WHERE pr.preventivo_id = NEW.id
                         AND prc.attivo = TRUE
                         AND prc.prezzo_unitario IS NULL
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_DOC_COMPONENTI_PENDING_VALORIZZAZIONE',
                          jsonb_build_object('preventivo_id', NEW.id,
                              'hint', 'Uno o piu'' componenti BoM CASO A hanno prezzo non valorizzato. '
                                   || 'Valorizzare tutti i prezzi prima di accettare.'),
                          NULL::uuid, NEW.id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_preventivi_guard_transizione_approvazione()
              IS 'Trigger function: blocca transizione preventivo ad ACCETTATO se righe/componenti in stato PENDING approvazione (E_PREVENTIVO_RIGHE_PRICING_PENDENTI) o se componenti hanno prezzo NULL (E_DOC_COMPONENTI_PENDING_VALORIZZAZIONE). rev 12-05-2026: aggiunto Check 3 prezzo NULL.';
