# LA CATEGORIA DEL CLIENTE FISSATA NEL CONTRATTO: LA BOZZA DAL VOCABOLARIO
#   Brief: brief-db-stati-documento-dal-vocabolario §6.19, giro 6c (S-2,
#   Tid 2026-11-08; via di Tid del 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.trgfn_contratti_set_categoria_cliente_snapshot lasciava cambiare
#   categoria_cliente_id_snapshot solo con lo stato 'DRAFT', col codice. La
#   bozza e' lo stato iniziale del vocabolario (D-LOCK).
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Il rifiuto scatta se lo stato del contratto non e' quello iniziale
#   (IS FALSE: uno stato che non si legge non rifiuta, come prima il
#   confronto <> col NULL). Con il seed la risposta e' quella di prima.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma (trigger), INVOKER, nessun SET (pg_proc su
#   dbdev, 2026-11-14). Il montaggio non si tocca.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (il catalogo li scioglie). Il
#   rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-31-update-trgfn-contratti-categoria-snapshot-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261114-31-update-trgfn-contratti-categoria-snapshot-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_contratti_set_categoria_cliente_snapshot: la categoria si cambia nello stato
        iniziale del vocabolario, non in DRAFT. Brief: brief-db-stati-documento-dal-vocabolario, giro 6c.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_categoria_id anagrafiche.billing_account.categoria_cliente_id%TYPE;
              BEGIN
                  -- INSERT: auto-populate da BA se il caller non lo passa.
                  IF TG_OP = 'INSERT' AND NEW.categoria_cliente_id_snapshot IS NULL THEN
                      SELECT ba.categoria_cliente_id
                        INTO v_categoria_id
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = NEW.billing_account_id;

                      NEW.categoria_cliente_id_snapshot := v_categoria_id;
                  END IF;

                  -- UPDATE: immutabilita' post-attivazione.
                  -- In bozza la categoria puo' essere cambiata (es. riclassificazione
                  -- BA durante la preparazione del contratto). Fuori dalla bozza e'
                  -- congelata: modifica bloccata.
                  -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6c):
                  --   la bozza e' lo stato iniziale, la colonna del vocabolario, non il
                  --   codice. IS FALSE: uno stato che non si legge non rifiuta.
                  IF TG_OP = 'UPDATE'
                     AND OLD.categoria_cliente_id_snapshot IS DISTINCT FROM NEW.categoria_cliente_id_snapshot
                  THEN
                      IF (SELECT s.iniziale
                            FROM config.stati_doc_contratti s
                           WHERE s.id = NEW.stato_doc_contratto_id) IS FALSE
                      THEN
                          -- E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE: 1 %s = contratto.
                          PERFORM script.fn_log_and_raise_error(
                              'vendite',
                              TG_NAME,
                              'E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE',
                              jsonb_build_object(
                                  'contratto_id', NEW.id,
                                  'old_categoria', OLD.categoria_cliente_id_snapshot,
                                  'new_categoria', NEW.categoria_cliente_id_snapshot
                              ),
                              NULL::uuid,
                              NEW.id::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
              IS 'Trigger su vendite.contratti. In INSERT: categoria_cliente_id_snapshot dal billing account, se chi crea non la passa. In UPDATE: la categoria si cambia solo nello stato iniziale del vocabolario (la bozza, la colonna iniziale di config.stati_doc_contratti), per esempio per una riclassificazione del billing account mentre il contratto si prepara; fuori dalla bozza e'' congelata: E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_categoria_id anagrafiche.billing_account.categoria_cliente_id%TYPE;
              BEGIN
                  -- INSERT: auto-populate da BA se il caller non lo passa.
                  IF TG_OP = 'INSERT' AND NEW.categoria_cliente_id_snapshot IS NULL THEN
                      SELECT ba.categoria_cliente_id
                        INTO v_categoria_id
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = NEW.billing_account_id;

                      NEW.categoria_cliente_id_snapshot := v_categoria_id;
                  END IF;

                  -- UPDATE: immutabilita' post-attivazione.
                  -- In DRAFT la categoria puo' essere cambiata (es. riclassificazione
                  -- BA durante la preparazione del contratto). Fuori da DRAFT e'
                  -- congelata: modifica bloccata.
                  IF TG_OP = 'UPDATE'
                     AND OLD.categoria_cliente_id_snapshot IS DISTINCT FROM NEW.categoria_cliente_id_snapshot
                  THEN
                      IF (SELECT s.codice_interno
                            FROM config.stati_doc_contratti s
                           WHERE s.id = NEW.stato_doc_contratto_id) <> 'DRAFT'
                      THEN
                          -- E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE: 1 %s = contratto.
                          PERFORM script.fn_log_and_raise_error(
                              'vendite',
                              TG_NAME,
                              'E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE',
                              jsonb_build_object(
                                  'contratto_id', NEW.id,
                                  'old_categoria', OLD.categoria_cliente_id_snapshot,
                                  'new_categoria', NEW.categoria_cliente_id_snapshot
                              ),
                              NULL::uuid,
                              NEW.id::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
              IS 'Auto-populate categoria_cliente_id_snapshot da BA su INSERT. In UPDATE: modifica ammessa solo in stato DRAFT; fuori da DRAFT il valore e'' congelato (immutabile).';
