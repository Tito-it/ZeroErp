# ------------------------------------------------------------
# I COMMENT STANTII DI VENDITE, AL PRESENTE
#   Brief: brief-db-sorgente-documento-e-riga §7.3 (giro finale).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Il modello della provenienza ha cambiato forma sotto questi oggetti, ma i
#   loro COMMENT raccontano ancora quella di prima, o una cronaca di rev e
#   brief (linee-guida-sql §5d):
#   - vw_stato_sorgente_ddt diceva che la bolla del reso sta in
#     resi.sorgente_uid, «colonna tipizzata diretta»: il reso dichiara la bolla
#     con l'id in sorgente_id, come ogni altro documento;
#   - vw_stato_sorgente_reso diceva lo stesso dalla parte del reso
#     (resi.sorgente_uid uuid «punta al DDT di origine»), con rev e brief;
#   - vw_stato_sorgente_preventivo/_offerta/_ordine/_contratto dicevano la
#     chiave testuale «coerente con pratiche_sorgenti»: pratiche_sorgenti tiene
#     la chiave nelle colonne tipizzate, e il motore delle pratiche
#     (pratiche.fn_stato_sorgente) legge sorgente_chiave_id/_uuid;
#   - vw_contratti_lista citava le colonne frontiera_* che non ha piu';
#   - trgfn_commesse_attivita_proietta_stato_preventivo diceva
#     «sorgente_uid = uid::text»: sorgente_uid e' uuid, e il preventivo si
#     cerca con la regola d'incontro (id = sorgente_id OR uid = sorgente_uid);
#   - fn_select_attivita_fatturabili diceva sorgente_tipo_id/sorgente_uid
#     «rioccupati dall'idempotenza del pull»: le colonne di provenienza di
#     attivita_fatturabili sono ritirate;
#   - fn_reso_muove_merce portava una data e i rimandi ai brief.
#   Ogni COMMENT si riscrive INTERO, tenendo cio' che e' ancora vero sul corpo
#   vivo.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Solo COMMENT ON: 7 viste e 3 funzioni. Nessun corpo, nessuna firma.
#
#   ⚠️ Applicato prima delle ultime aggiunte: vw_stato_sorgente_reso e' nel 20261110-16 (un changeSet
#   applicato non si tocca). Le righe della testata che le nominano valgono per quello.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261110-08-update-comment-stato-sorgente-e-viste-al-presente-mctit.yaml

  - changeSet:
      id: 20261110-08-update-comment-stato-sorgente-e-viste-al-presente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di vw_stato_sorgente_ddt/_reso/_preventivo/_offerta/_ordine/_contratto, vw_contratti_lista, trgfn_commesse_attivita_proietta_stato_preventivo, fn_select_attivita_fatturabili e fn_reso_muove_merce riscritti al presente, linee-guida-sql §5d. brief-db-sorgente-documento-e-riga §7.3 (giro finale).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM (
                SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname = 'vendite' AND c.relkind = 'v'
                   AND c.relname IN ('vw_stato_sorgente_ddt', 'vw_stato_sorgente_reso',
                                     'vw_stato_sorgente_preventivo',
                                     'vw_stato_sorgente_offerta', 'vw_stato_sorgente_ordine',
                                     'vw_stato_sorgente_contratto', 'vw_contratti_lista')
                HAVING count(*) = 7) x;
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM (
                SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'vendite'
                   AND ((p.proname = 'trgfn_commesse_attivita_proietta_stato_preventivo' AND p.pronargs = 0)
                     OR (p.proname = 'fn_select_attivita_fatturabili' AND p.pronargs = 12)
                     OR (p.proname = 'fn_reso_muove_merce' AND p.pronargs = 1))
                HAVING count(*) = 3) x;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_stato_sorgente_ddt IS
                'Resolver dello stato della bolla di vendita per la proiezione di stato della sorgente polimorfa: traduce lo stato nativo del DDT (config.stati_doc_ddt) nel vocabolario comune fase / esito / terminale. Una riga per bolla, read-time. Il tipo DDT_VENDITA e'' a chiave id (config.sorgenti.key_selector), agganciato per codice_interno e solo se attivo. La chiave esce in due forme: sorgente_chiave_id = id (bigint), con sorgente_chiave_uuid NULL, e'' la chiave nel suo tipo, quella che pratiche.fn_stato_sorgente confronta con la chiave tipizzata di pratiche.pratiche_sorgenti e quella da usare per cercare una bolla (sotto RLS il confronto sul testo non arriva all''indice, int8out non e'' leakproof); sorgente_uid e'' lo stesso id in testo, la chiave dei nodi della lineage e delle join. Ogni documento che nasce da una bolla, il reso compreso, la dichiara con l''id in sorgente_id: cercarla per uid non trova. esito e terminale sono derivati, perche'' config.stati_doc_ddt non li espone: is_abortito -> NEGATIVO, fase CHIUSO non abortito -> POSITIVO, altrimenti NULL; terminale = fase CHIUSO. Lo stato RESO risulta POSITIVO e terminale, perche'' il catalogo lo dichiara non abortito (merce tornata non e'' documento annullato): cambiare quella semantica e'' materia del catalogo, non della vista. security_invoker: vale la RLS di chi legge. I consumatori la leggono da script.vw_stato_sorgente.';

              COMMENT ON VIEW vendite.vw_stato_sorgente_preventivo IS
                'Resolver dello stato del preventivo per la proiezione di stato della sorgente polimorfa: per ogni preventivo lo stato vivo, nativo (alias fedeli: stato_codice_interno per la logica, stato_codice e stato_descrizione per il display) e proiettato in fase / esito / terminale come li dichiara config.stati_doc_preventivi. Una riga per preventivo, read-time. Il tipo PREVENTIVO e'' a chiave uid (config.sorgenti.key_selector), agganciato per codice_interno e solo se attivo. La chiave esce in due forme: sorgente_chiave_uuid = uid (uuid), con sorgente_chiave_id NULL, e'' la chiave nel suo tipo, quella che pratiche.fn_stato_sorgente confronta con la chiave tipizzata di pratiche.pratiche_sorgenti e quella da usare per cercare un documento (sotto RLS il confronto sul testo non arriva all''indice, uuid_out non e'' leakproof); sorgente_uid e'' lo stesso uid in testo, la chiave dei nodi della lineage e delle join. Fotografa lo stato memorizzato: il passaggio EMESSO -> SCADUTO e'' asincrono (job notturno) e la vista non ricalcola la scadenza. security_invoker: vale la RLS di chi legge. I consumatori la leggono da script.vw_stato_sorgente.';

              COMMENT ON VIEW vendite.vw_stato_sorgente_offerta IS
                'Resolver dello stato dell''offerta commerciale per la proiezione di stato della sorgente polimorfa: per ogni offerta lo stato vivo, nativo (alias fedeli: stato_codice_interno per la logica, stato_codice e stato_descrizione per il display) e proiettato in fase / esito / terminale come li dichiara config.stati_doc_offerte. Una riga per offerta, read-time. Il tipo OFFERTA_COMMERCIALE e'' a chiave uid (config.sorgenti.key_selector), agganciato per codice_interno e solo se attivo. La chiave esce in due forme: sorgente_chiave_uuid = uid (uuid), con sorgente_chiave_id NULL, e'' la chiave nel suo tipo, quella che pratiche.fn_stato_sorgente confronta con la chiave tipizzata di pratiche.pratiche_sorgenti e quella da usare per cercare un documento (sotto RLS il confronto sul testo non arriva all''indice, uuid_out non e'' leakproof); sorgente_uid e'' lo stesso uid in testo, la chiave dei nodi della lineage e delle join. security_invoker: vale la RLS di chi legge. I consumatori la leggono da script.vw_stato_sorgente.';

              COMMENT ON VIEW vendite.vw_stato_sorgente_ordine IS
                'Resolver dello stato dell''ordine di vendita per la proiezione di stato della sorgente polimorfa: per ogni ordine di vendita lo stato vivo, nativo (alias fedeli: stato_codice_interno per la logica, stato_codice e stato_descrizione per il display) e proiettato in fase / esito / terminale come li dichiara config.stati_doc_ordini. Legge solo vendite.ordini (tipo ORDINE_VENDITA): il vocabolario config.stati_doc_ordini e'' condiviso con acquisti.ordini, ma la mappa di fase / esito / terminale e'' centrata sul ciclo di vendita. Una riga per ordine, read-time. Il tipo ORDINE_VENDITA e'' a chiave id (config.sorgenti.key_selector), agganciato per codice_interno e solo se attivo. La chiave esce in due forme: sorgente_chiave_id = id (bigint), con sorgente_chiave_uuid NULL, e'' la chiave nel suo tipo, quella che pratiche.fn_stato_sorgente confronta con la chiave tipizzata di pratiche.pratiche_sorgenti e quella da usare per cercare un documento (sotto RLS il confronto sul testo non arriva all''indice, int8out non e'' leakproof); sorgente_uid e'' lo stesso id in testo, la chiave dei nodi della lineage e delle join. security_invoker: vale la RLS di chi legge. I consumatori la leggono da script.vw_stato_sorgente.';

              COMMENT ON VIEW vendite.vw_stato_sorgente_contratto IS
                'Resolver dello stato del contratto per la proiezione di stato della sorgente polimorfa: per ogni contratto lo stato vivo, nativo (alias fedeli: stato_codice_interno per la logica, stato_codice e stato_descrizione per il display) e proiettato in fase / esito / terminale come li dichiara config.stati_doc_contratti. terminale e'' un asse distinto da is_abortito: CESSATO e'' terminale ma non abortito. Una riga per contratto, read-time. Il tipo CONTRATTO e'' a chiave id (config.sorgenti.key_selector), agganciato per codice_interno e solo se attivo. La chiave esce in due forme: sorgente_chiave_id = id (bigint), con sorgente_chiave_uuid NULL, e'' la chiave nel suo tipo, quella che pratiche.fn_stato_sorgente confronta con la chiave tipizzata di pratiche.pratiche_sorgenti e quella da usare per cercare un documento (sotto RLS il confronto sul testo non arriva all''indice, int8out non e'' leakproof); sorgente_uid e'' lo stesso id in testo, la chiave dei nodi della lineage e delle join. security_invoker: vale la RLS di chi legge. I consumatori la leggono da script.vw_stato_sorgente.';

              COMMENT ON VIEW vendite.vw_contratti_lista IS
                'Vista flat dei contratti per la lista UI configurabile vendite.contratti (ui.lista_definizione): cliente (billing account e soggetto), emittente fiscale con la ragione sociale, utility, stato con la sua fase, listino e versione, variazione globale, categoria cliente dallo snapshot del contratto (non quella corrente del billing account), valuta, audit e la pratica del contratto. Pura denormalizzazione: nessun filtro, scope, ordinamento o paginazione propri, che restano al repository consumer. security_invoker: vale la RLS di chi legge; billing account, soggetto, utility e stato sono JOIN interni, quindi un contratto col billing account fuori perimetro non compare, mentre emittente, listino, versione, categoria e valuta sono LEFT JOIN e lasciano NULL. stato_codice_interno = codice_interno (logica), stato_codice = codice (display). pratica_id, pratica_numero e n_pratiche vengono da pratiche.fn_pratica_del_documento, col tipo CONTRATTO (da config.sorgenti per codice_interno, solo se attivo) e le due chiavi del contratto, id e uid. Le colonne del grafo (frontiera, discendenti, transito) non sono nella vista: il backend le chiede a vendite.fn_documento_lineage_sintesi per i contratti della pagina.';

              COMMENT ON FUNCTION vendite.trgfn_commesse_attivita_proietta_stato_preventivo() IS
                'Funzione trigger AFTER ROW su vendite.commesse_attivita: una riga con sorgente PREVENTIVO che nasce, cambia stato_emissione o sparisce riproietta lo stato del suo preventivo (ACCETTATO <-> EVASO) dal BB vendite.fn_preventivo_proietta_stato_smistamento. Trigger e non chiamata da una madre perche'' l''invio in commessa nel DB non ha una madre (lo orchestra il backend riga per riga): la riga di commessa e'' il solo punto che vede ogni strada (invio singolo e batch, ritiro all''annullo di un documento, annullo della commessa, cancellazione). Il preventivo si cerca con la regola d''incontro (p.id = sorgente_id OR p.uid = sorgente_uid): il tipo PREVENTIVO e'' a chiave uid, e la riga di commessa porta il suo uid in sorgente_uid (uuid). Le righe senza sorgente (oneri, rettifiche) e quelle delle altre sorgenti escono subito. SECURITY INVOKER: la RLS di chi scrive la riga; un preventivo invisibile non si tocca. Montaggio: trg_commesse_attivita_z90_proietta_stato_preventivo_ins_dlt (AFTER INSERT OR DELETE) e trg_commesse_attivita_z90_proietta_stato_preventivo_upd (AFTER UPDATE, sul cambio di stato_emissione).';

              COMMENT ON FUNCTION vendite.fn_select_attivita_fatturabili(date, bigint, uuid, boolean, date, bigint, integer, integer, bigint, bigint, integer, text[]) IS
                'Le attivita'' fatturabili eleggibili di un perimetro, con lucchetto facoltativo. Eleggibile: approvata, non fatturata, non sospesa, non gia'' in fatturazione, con posticipa_al raggiunto alla data di fatturazione (p_data_fatturazione, default script.fn_data_operativa()), competenza_mese non oltre il mese di p_competenza_mese, del tipo documento p_tipo_doc_fiscale_id. p_competenza_mese e p_tipo_doc_fiscale_id sono obbligatori (E_PARAMETRO_INVALIDO). Filtri facoltativi: billing account, utility (del billing account), valuta, emittente (anagrafiche.fn_get_emittente_fiscale_id del billing account), area geografica, p_limit. p_lock_batch_id e'' il giro: con un giro si prendono solo le attivita'' che il pull di quel giro ha firmato (emit_batch_id), anche senza lucchetto, cosi'' un''anteprima vede cio'' che il giro prendera''. p_lock = true pretende il giro (E_PARAMETRO_INVALIDO) e blocca le righe con FOR UPDATE OF a SKIP LOCKED, scrivendo lock_in_fatturazione, lock_batch_id e stato_esecuzione = PENDING; p_lock = false e'' una lettura senza scritture. p_gruppi restringe ai gruppi fatturabili richiesti: NULL nessuna restrizione, array vuoto zero righe, chiave inesistente zero righe senza errore. Senza questo filtro un giro mirato consumerebbe le attivita'' gia'' esistenti di altri gruppi nello stesso perimetro, perche'' nessun altro criterio sa nulla della provenienza. attivita_fatturabili non porta una provenienza propria: il gruppo si legge dalla riga di commessa, col JOIN su commessa_attivita_id (NOT NULL, quindi non perde righe) e vendite.fn_gruppo_fatturabile_key_di_attivita; il JOIN si aggiunge solo con p_gruppi valorizzato. Il lucchetto resta ristretto ad attivita_fatturabili (FOR UPDATE OF a): esteso a commesse_attivita serializzerebbe la fatturazione con le operazioni di commessa. Restituisce le righe in ordine di data_attivita, id.';

              COMMENT ON FUNCTION vendite.fn_reso_muove_merce(vendite.resi) IS
                'True se il reso fa rientrare merce: ha almeno una voce in vendite.fn_reso_merce_da_rientrare (una riga attiva la cui riga di bolla d''origine ha prelievi), la sede della regola. E'' la condizione della porta del registro del reso: il verbo vendite.fn_conferma_reso, la sola strada dello stato (script.trgfn_doc_stato_solo_dal_verbo), scrive i carichi solo per un reso che muove merce, e vendite.fn_annulla_reso li storna solo per lui. La leggono anche la check della merce script.fn_check_reso_merce e il presidio dbops.vw_resi_confermati_senza_carico. Prende la RIGA del reso. STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I COMMENT di prima sono nei changeSet che hanno creato o aggiornato gli oggetti: un rollback li riprende da li'.
              SELECT 1;
