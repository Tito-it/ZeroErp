# vendite.vw_offerte_commerciali_lista: LA PRATICA DEL DOCUMENTO SULLE COLONNE DEL MODELLO
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto P, giro P.1 (S-4).
#
#   La vista chiedeva la pratica con la chiave testuale del documento
#   (o.uid::text). Passa alla firma tipizzata di
#   pratiche.fn_pratica_del_documento (20261108-67) con l'id e l'uid del documento:
#   la regola d'incontro trova il link senza leggere il key_selector. L'unica
#   riga che cambia e' la LATERAL della pratica; colonne, ordine e COMMENT
#   restano (corpo dal catalogo, dbdev e scratch identici, 2026-11-08).
#   security_invoker ripetuto: un CREATE OR REPLACE VIEW lo azzera.
#   Rollback: forward-only (la firma testuale la ritira 20261108-76).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261108-71-update-vw-offerte-commerciali-lista-pratica-colonne-tipizzate-mctit.yaml

  - changeSet:
      id: 20261108-71-update-vw-offerte-commerciali-lista-pratica-colonne-tipizzate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_offerte_commerciali_lista: la pratica del documento con la firma tipizzata di
        pratiche.fn_pratica_del_documento (id e uid del documento). brief-db-sorgente-documento-e-riga
        §7.2 lotto P, giro P.1.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: vendite
            viewName: vw_offerte_commerciali_lista
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- security_invoker si AZZERA a ogni CREATE OR REPLACE VIEW: si ripete dal catalogo.
              CREATE OR REPLACE VIEW vendite.vw_offerte_commerciali_lista WITH (security_invoker=on) AS
               SELECT o.id,
                  o.uid,
                  o.codice,
                  o.revisione_numero,
                  o.revisione_padre_id,
                  NOT sdo.is_superato AND NOT sdo.is_abortito AS is_attiva,
                  (EXISTS ( SELECT 1
                         FROM vendite.offerte_commerciali figlio
                        WHERE figlio.revisione_padre_id = o.id)) AS has_next_revisione,
                  o.stato_doc_offerta_id,
                  sdo.codice_interno AS stato_codice_interno,
                  sdo.descrizione AS stato_descrizione,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.istanza_utility_id,
                  iu.codice AS istanza_utility_codice,
                  o.listino_id,
                  l.codice AS listino_codice,
                  o.listino_versione_id,
                  lv.codice_versione AS listino_versione_codice,
                  o.tipo_variazione_globale,
                  o.valore_variazione_globale,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.validita_dal,
                  o.validita_al,
                  o.validita_al IS NOT NULL AND o.validita_al < (( SELECT script.fn_data_operativa() AS fn_data_operativa)) AS is_scaduta,
                  o.data_emissione,
                  o.data_accettazione,
                  o.data_rifiuto,
                  o.data_annullamento,
                  o.data_insert,
                  o.user_insert,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sdo.fase,
                  pr.pratica_id,
                  pr.pratica_numero,
                  pr.n_pratiche,
                  sdo.is_superato AS is_superata,
                  sdo.is_abortito,
                  o.revisione_radice_id
                 FROM vendite.offerte_commerciali o
                   JOIN config.stati_doc_offerte sdo ON sdo.id = o.stato_doc_offerta_id
                   LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = o.istanza_utility_id
                   LEFT JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = o.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = o.utility_id
                   LEFT JOIN vendite.listini l ON l.id = o.listino_id
                   LEFT JOIN vendite.listini_versioni lv ON lv.id = o.listino_versione_id
                   LEFT JOIN config.valute v_val ON v_val.id = o.valuta_id
                   LEFT JOIN LATERAL pratiche.fn_pratica_del_documento(( SELECT so_pr.id
                         FROM config.sorgenti so_pr
                        WHERE so_pr.codice_interno::text = 'OFFERTA_COMMERCIALE'::text AND so_pr.attivo IS TRUE), o.id, o.uid) pr(n_pratiche, pratica_id, pratica_numero) ON true;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: la firma testuale della pratica del documento si ritira nello stesso giro.
              SELECT 1;
