# CREATE vendite.trgfn_ordini_guard_transizione (+ trigger)
#   Enforcement DB-first del grafo transizioni stato ordine, letto da
#   config.transizioni_stati_ordini (matrice 20260605-08).
#
# Decisione D-3 (brief §7.1): l'ordine valida le transizioni come
#   offerte/contratti (trigger guard), non solo lato lettura. Intercetta
#   OGNI chiamante (non solo ordini_service.conferma), garantendo il
#   single source of truth. Pattern simmetrico a
#   trgfn_offerte_commerciali_guard_transizione /
#   trgfn_contratti_guard_transizione_stato — con la differenza che qui il
#   grafo e' letto dalla matrice (non hardcodato), coerente con lo scopo SSOT
#   del brief.
#
# Regole applicate (BEFORE UPDATE OF stato_doc_ordine_id):
#   1) Transizione ammessa <=> riga (stato_da, stato_a) in
#      config.transizioni_stati_ordini con attivo=true.
#      Altrimenti E_ORDINE_TRANSIZIONE_NON_AMMESSA.
#   2) Precondizione DRAFT->CONFERMATO: l'ordine deve avere almeno una riga.
#      Altrimenti E_ORDINE_CONFERMA_SENZA_RIGHE. Regola spostata da
#      ordini_service.py (era E_ORD_NESSUNA_RIGA inline) per DB-first.
#
# Convivenza: il trigger esistente trg_ordini_a10_guard_transizione_approvazione_upd
#   (20260512-20) resta e copre un concern diverso (componenti BoM CASO A
#   PENDING/prezzo NULL su CONFERMATO). Entrambi BEFORE UPDATE OF
#   stato_doc_ordine_id, fase _a10_: nessuna sovrapposizione di regola.
#
# No-op se lo stato non cambia (UPDATE su altre colonne dello stesso set).
# CREATE OR REPLACE FUNCTION + DROP/CREATE TRIGGER (idempotente, runOnChange).
# Codici errore registrati in 20260605-12 (no E_GENERICO).
# Dipendenze: vendite.ordini, vendite.ordini_righe, config.stati_doc_ordini,
#   config.transizioni_stati_ordini (20260605-08), script.fn_log_and_raise_error.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260605-10-create-trgfn-ordini-guard-transizione-mctit.yaml

  - changeSet:
      id: 20260605-10-create-trgfn-ordini-guard-transizione
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Crea vendite.trgfn_ordini_guard_transizione + trigger
        trg_ordini_a10_guard_transizione_upd (BEFORE UPDATE OF
        stato_doc_ordine_id). Valida il grafo transizioni leggendo
        config.transizioni_stati_ordini (E_ORDINE_TRANSIZIONE_NON_AMMESSA) e
        la precondizione DRAFT->CONFERMATO con almeno una riga
        (E_ORDINE_CONFERMA_SENZA_RIGHE). Enforcement D-3 del brief azioni
        data-driven ordini. Convive col guard approvazione (20260512-20).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: transizioni_stati_ordini
            - tableExists:
                schemaName: vendite
                tableName: ordini_righe
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ordini_guard_transizione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: enforcement DB-first del grafo transizioni stato ordine.
              --   La transizione (OLD.stato -> NEW.stato) e' ammessa solo se
              --   presente e attiva in config.transizioni_stati_ordini. In piu',
              --   DRAFT->CONFERMATO richiede almeno una riga ordine.
              --   Letto dalla matrice (no grafo hardcodato): SSOT col lato lettura
              --   fn_available_actions_ordine.
              DECLARE
                  v_codice_da config.stati_doc_ordini.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_ordini.codice_interno%TYPE;
                  v_ammessa   boolean := false;
              BEGIN
                  -- No-op se lo stato non cambia davvero (UPDATE su altre colonne).
                  IF NEW.stato_doc_ordine_id IS NOT DISTINCT FROM OLD.stato_doc_ordine_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_ordine_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_ordine_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_ordini
                   WHERE id IN (OLD.stato_doc_ordine_id, NEW.stato_doc_ordine_id);

                  -- Regola 1: la transizione deve esistere ed essere attiva in matrice.
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_ordini t
                       WHERE t.stato_da_id = OLD.stato_doc_ordine_id
                         AND t.stato_a_id  = NEW.stato_doc_ordine_id
                         AND t.attivo IS TRUE
                  ) INTO v_ammessa;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_ORDINE_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'ordine_id', NEW.id,
                              'numero',    NEW.numero,
                              'stato_da',  v_codice_da,
                              'stato_a',   v_codice_a
                          ),
                          NEW.tx_id,
                          NEW.id::text,
                          coalesce(v_codice_da, 'NULL'),
                          coalesce(v_codice_a,  'NULL')
                      );
                  END IF;

                  -- Regola 2: DRAFT->CONFERMATO richiede almeno una riga.
                  -- Spostata da ordini_service.py (E_ORD_NESSUNA_RIGA inline) per
                  -- DB-first: vale per ogni chiamante, non solo conferma().
                  IF v_codice_da = 'DRAFT' AND v_codice_a = 'CONFERMATO' THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM vendite.ordini_righe r
                           WHERE r.ordine_id = NEW.id
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME::text,
                              'E_ORDINE_CONFERMA_SENZA_RIGHE',
                              jsonb_build_object(
                                  'ordine_id', NEW.id,
                                  'numero',    NEW.numero
                              ),
                              NEW.tx_id,
                              NEW.id::text,
                              coalesce(NEW.numero, 'NULL')
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ordini_guard_transizione()
              IS 'Trigger function: enforcement grafo transizioni stato ordine letto '
                 'da config.transizioni_stati_ordini (E_ORDINE_TRANSIZIONE_NON_AMMESSA). '
                 'Precondizione DRAFT->CONFERMATO: almeno una riga '
                 '(E_ORDINE_CONFERMA_SENZA_RIGHE, ex E_ORD_NESSUNA_RIGA Python). '
                 'Convive col guard approvazione BoM (20260512-20). rev 2026-06-05.';

              DROP TRIGGER IF EXISTS trg_ordini_a10_guard_transizione_upd
                  ON vendite.ordini;

              CREATE TRIGGER trg_ordini_a10_guard_transizione_upd
                  BEFORE UPDATE OF stato_doc_ordine_id
                  ON vendite.ordini
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_ordini_guard_transizione();
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ordini_a10_guard_transizione_upd
                  ON vendite.ordini;
              DROP FUNCTION IF EXISTS vendite.trgfn_ordini_guard_transizione();
