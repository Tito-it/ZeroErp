# IL BB DEGLI SNAPSHOT DI STATO, MONTATO SU ORDINE E CONTRATTO
#   trg_ordini_z90_snapshot_da_stato_ins_upd     (nuovo)
#   trg_contratti_z90_snapshot_da_stato_ins_upd  (prende il posto di
#     trg_contratti_z90_sync_is_abortito_snapshot_ins_upd)
#   DROP vendite.trgfn_contratti_sync_is_abortito_snapshot()
#   Brief: brief-db-annullo-documento-con-legami (§7.2, D-6 di Tid)
#
# ── REGOLA DEL 2, NELLO STESSO GIRO ─────────────────────────────────
#   Il BB (20261011-71) si monta sull'ordine, che ne ha bisogno per
#   l'indice sui vivi (20261011-70), e sul contratto al posto della sua
#   copia, che si ritira qui: una copia accanto al BB sarebbe una terza
#   versione della stessa regola.
#
# ── IL CONTRATTO: COSA CAMBIA ───────────────────────────────────────
#   Stesse due bandiere (is_abortito_snapshot, is_draft_snapshot), stesso
#   momento (BEFORE, _z90_, sulla riga finale: partecipa_overlap_snapshot
#   e' GENERATED da li'). Cambia solo l'evento: «UPDATE OF
#   stato_doc_contratto_id» diventa UPDATE, cosi' uno snapshot scritto a
#   mano viene ricalcolato invece di restare falso.
#   ⚠️ Il trigger vecchio non lo genera ci_apply: lo scrive 20260602-20.
#   DROP ... IF EXISTS comunque, come chiede §11.5.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261011-72-create-trigger-doc-snapshot-da-stato-mctit.yaml

  - changeSet:
      id: 20261011-72-create-trigger-doc-snapshot-da-stato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta vendite.trgfn_doc_snapshot_da_stato su ordini (is_abortito_snapshot) e contratti
        (is_abortito_snapshot, is_draft_snapshot), e ritira la copia del contratto
        vendite.trgfn_contratti_sync_is_abortito_snapshot. D-6 di brief-db-annullo-documento-con-legami.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists: { schemaName: vendite, tableName: ordini, columnName: is_abortito_snapshot }
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_doc_snapshot_da_stato';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_ordini_z90_snapshot_da_stato_ins_upd
                  BEFORE INSERT OR UPDATE ON vendite.ordini
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_doc_snapshot_da_stato(
                      'stato_doc_ordine_id', 'config.stati_doc_ordini',
                      'is_abortito_snapshot', 'is_abortito');

              COMMENT ON TRIGGER trg_ordini_z90_snapshot_da_stato_ins_upd ON vendite.ordini IS
                  'Snapshot di stato (BB vendite.trgfn_doc_snapshot_da_stato): is_abortito_snapshot da config.stati_doc_ordini.is_abortito, per uq_ordini_v_documento_origine_offerta (un''offerta genera al piu'' un ordine vivo). 2026-10-11, brief-db-annullo-documento-con-legami D-6.';

              DROP TRIGGER IF EXISTS trg_contratti_z90_sync_is_abortito_snapshot_ins_upd
                  ON vendite.contratti;

              CREATE TRIGGER trg_contratti_z90_snapshot_da_stato_ins_upd
                  BEFORE INSERT OR UPDATE ON vendite.contratti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_doc_snapshot_da_stato(
                      'stato_doc_contratto_id', 'config.stati_doc_contratti',
                      'is_abortito_snapshot', 'is_abortito',
                      'is_draft_snapshot',    'is_bozza');

              COMMENT ON TRIGGER trg_contratti_z90_snapshot_da_stato_ins_upd ON vendite.contratti IS
                  'Snapshot di stato (BB vendite.trgfn_doc_snapshot_da_stato): is_abortito_snapshot e is_draft_snapshot da config.stati_doc_contratti (is_abortito, is_bozza), per la colonna GENERATED partecipa_overlap_snapshot e per uq_contratti_offerta_id. Prende il posto di trg_contratti_z90_sync_is_abortito_snapshot_ins_upd (2026-10-11, brief-db-annullo-documento-con-legami D-6).';

              DROP FUNCTION vendite.trgfn_contratti_sync_is_abortito_snapshot();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ordini_z90_snapshot_da_stato_ins_upd ON vendite.ordini;
              DROP TRIGGER IF EXISTS trg_contratti_z90_snapshot_da_stato_ins_upd ON vendite.contratti;
              -- La copia del contratto si ripristina rieseguendo 20260602-20.
