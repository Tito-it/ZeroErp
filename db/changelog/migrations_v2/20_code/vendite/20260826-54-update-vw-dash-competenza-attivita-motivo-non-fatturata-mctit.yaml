# D-1 — LA CHIAVE DEL VERBO, LA DIMENSIONE E IL DECODE CHE MANCANO
#   Piano: brief-db-residui-competenza-dimensione-e-chiave, D-1
#
# ── ⛔ IL FATTO: IL FRONTEND NON HA LA CHIAVE DEL VERBO ────────────
#   vendite.fn_riporta_attivita_da_emettere consuma
#   `vendite.attivita_fatturabili.id`, e questa vista — l'unica che alimenta
#   la Lente 1 — non lo espone. Tocca gia' `attivita_fatturabili` con l'alias
#   `af`: la colonna non manca per un limite, manca perche' finora non serviva
#   a nessuno.
#   ⛔ E NON si traduce `commessa_attivita_id -> af.id` lato backend, benche'
#   l'UNIQUE 1:1 lo renda possibile: sarebbe una SECONDA IMPLEMENTAZIONE di un
#   legame che il database conosce gia', cioe' la stessa forma di difetto che
#   il cantiere «il lavoro che non torna indietro» ha appena finito di pagare.
#
# ── ⭐ LA DIMENSIONE: `EMESSA_NON_FATTURATA` CONTA PIU' POPOLAZIONI ─
#   Lo stadio guarda SOLO il legame con la riga di fattura, e dentro quel
#   valore finiscono situazioni con RIMEDI OPPOSTI — due che non chiedono
#   niente e una che chiede il verbo. Un numero solo per rimedi opposti e' la
#   stessa ambiguita' che il cantiere precedente ha chiuso un livello piu' in
#   giu'.
#   ⛔ E NON si spezza il valore `EMESSA_NON_FATTURATA` in due stadi: lo STADIO
#   dice a che punto del ciclo e' il lavoro, e le situazioni sono allo stesso
#   punto — cambia la loro SALUTE, non il loro avanzamento. Si aggiunge la
#   DIMENSIONE, come il 2026-08-20 si aggiunse `tipo_movimento` alla mensile
#   invece di una colonna `valore_rettifiche`.
#
# ── ⭐ LO STADIO SI CALCOLA UNA VOLTA SOLA, IN UNA LATERAL ─────────
#   `motivo_non_fatturata` e' definito SOPRA lo stadio («NULL fuori da
#   EMESSA_NON_FATTURATA»), e in SQL un alias di SELECT non e' riferibile da
#   un'altra espressione della stessa SELECT. Ricopiare la condizione avrebbe
#   messo la definizione dello stadio in DUE posti della stessa vista, dove
#   divergere non produce nessun errore: la `CROSS JOIN LATERAL … st` la
#   calcola una volta e la serve a entrambe le colonne. Il valore, il nome e
#   il tipo della colonna `stadio` non cambiano di una virgola.
#
# ── ⛔ `IS DISTINCT FROM 'COMPLETED'`, NON `<>` ────────────────────
#   `attivita_fatturabili.stato_esecuzione` e' NULLABLE (dal 20260222-01-02) e
#   il CHECK ammette anche `ERRORE`. Con `<>` un lucchetto a NULL darebbe NULL,
#   il CASE cadrebbe sul ramo successivo e la vista direbbe `RESIDUO` su una
#   riga che `script.fn_check_attivita_riportabile_da_emettere` RIFIUTA — che
#   e' esattamente la divergenza silenziosa che il presidio D-3 esiste per
#   impedire. Quella funzione usa `IS DISTINCT FROM`, e qui si usa lo stesso.
#   ℹ️ `ERRORE` finisce percio' in `GIRO_IN_CORSO`: il nome dice «il giro non
#   ha finito», e il rimedio (aspettare che il lotto si chiuda) e' identico.
#
# ── ⭐ IL QUARTO VALORE, CHE IL BRIEF NON PREVEDEVA ────────────────
#   `SENZA_ATTIVITA_FATTURABILE` — riga di commessa a `EMESSA` senza NESSUNA
#   riga in `attivita_fatturabili`. Il modello lo AMMETTE: il JOIN e' LEFT e
#   `trg_attivita_fatturabili_a10_guard_fatturato_upd_dlt` ammette per progetto
#   la cancellazione di una riga non ancora fatturata.
#   ⛔ Senza un ramo suo cadrebbe su `IN_ATTESA_LOTTO` per via del COALESCE,
#   cioe' «il prossimo giro la prende» — falso: la pull filtra su
#   `stato_emissione` e non la riprende mai piu'. E `attivita_fatturabile_id`
#   sarebbe NULL, quindi il verbo non avrebbe nemmeno la chiave.
#   ⚠️ Zero occorrenze non significa che il caso non esiste (AGENTS.md, regola
#   zero): decide cio' che il modello ammette, non la popolazione di oggi.
#
# ── ⭐ IL LOTTO DI PROVENIENZA NON E' `lotto_id` ───────────────────
#   La colonna `lotto_id` gia' esposta arriva dalla catena della FATTURA
#   (fatture_righe -> fatture -> fatturazione_lotti_fatture): su un residuo la
#   fattura NON C'E', quindi e' NULL proprio sulle righe della lista nuova.
#   L'informazione vive su `af.lock_batch_id`, che ha un gemello UNIQUE su
#   `vendite.fatturazione_lotti.lock_batch_id` — quindi il LEFT JOIN non puo'
#   moltiplicare righe, e il UNIQUE e' verificato in preCondition perche' e'
#   la ragione per cui questo JOIN e' lecito.
#   ⚠️ `fatturazione_lotti` ha la RLS: il JOIN e' LEFT apposta — un lotto fuori
#   perimetro lascia le due colonne a NULL e non toglie la riga del residuo.
#   ⚠️ `lotto_provenienza_codice` viene da `codice`, colonna MUTABILE: e'
#   display, l'alias e' fedele alla sorgente (linee-guida-sql §6c) e quella
#   tabella non espone `codice_interno`. Chi filtra lo fa sull'id.
#
# ── ℹ️ I DUE JOIN NUOVI, E PERCHE' NON LI PAGA CHI NON LI USA ─────
#   Il brief chiedeva colonne di sola lettura da `af`, e queste due coppie
#   aggiungono invece due JOIN su una vista che ne alimenta altre quattro. La
#   ragione per cui e' sostenibile e' STRUTTURALE, non una misura: entrambi
#   sono LEFT JOIN su una chiave con indice UNIQUE
#   (`uq_fatturazione_lotti_lock_batch_id`, `pk_articoli`), quindi PostgreSQL
#   puo' PROVARE che non moltiplicano le righe e li ELIMINA dal piano quando
#   nessuna delle loro colonne e' selezionata — e' la left join removal.
#   📌 Fatto datato, e non e' il motivo: il 2026-08-26, con contesto operatore,
#   nei piani di `vw_dash_competenza_gruppi` e della vista stessa interrogata
#   senza le colonne nuove NON compare nessuna scansione di
#   `fatturazione_lotti` ne' di `catalogo.articoli`; compaiono solo
#   interrogando la lista dei residui, che e' l'unica che le chiede.
#   ⚠️ La condizione che regge tutto e' il UNIQUE: se qualcuno lo togliesse,
#   l'eliminazione smetterebbe di essere lecita e la vista comincerebbe a
#   contare doppio. E' per questo che sta in preCondition e ha un test suo.
#
# ── ⛔ E NON SI AGGIUNGE `fatturato` ───────────────────────────────
#   Dal 20260826-33 e' una colonna GENERATA da `fattura_riga_id`, quindi dentro
#   `EMESSA_NON_FATTURATA` e' SEMPRE falsa: come discriminante non distingue
#   niente. Stessa trappola gia' evitata dal cantiere precedente.
#
# ── ⛔ security_invoker=on VA RI-SPECIFICATO ───────────────────────
#   E' una reloption invisibile nel corpo della vista: un `CREATE OR REPLACE`
#   che non la ripete la AZZERA, senza errore e senza che nulla lo dica. Qui e'
#   lo scope emittente a dipenderne.
#
# ── ⚠️ IL CANCELLO DI SCOPE NON VA AGGIRATO ───────────────────────
#   `vendite.attivita_fatturabili` NON ha RLS, `vendite.commesse_attivita` si'.
#   La vista parte da `commesse` -> `commesse_attivita`, quindi il cancello c'e'
#   gia': le colonne nuove sono lettura diretta di `af`, che era gia' nel FROM,
#   e non spostano il punto d'ingresso.
#
# Dipendenze: 20260826-18 (revisione precedente della vista, registro e data
#             prevista), 20260826-27 (script.fn_check_attivita_riportabile_da_emettere,
#             la funzione con cui questo CASE non deve poter divergere).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260826-54-update-vw-dash-competenza-attivita-motivo-non-fatturata-mctit.yaml

  - changeSet:
      id: 20260826-54-update-vw-dash-competenza-attivita-motivo-non-fatturata
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D-1: vw_dash_competenza_attivita porta LA CHIAVE DEL VERBO e LA DIMENSIONE. Otto
        colonne in coda — attivita_fatturabile_id, lock_in_fatturazione, stato_esecuzione,
        motivo_non_fatturata, lotto_provenienza_id, lotto_provenienza_codice, articolo_codice,
        articolo_descrizione. ⛔ La chiave:
        fn_riporta_attivita_da_emettere consuma attivita_fatturabili.id e nessuna vista lo
        esponeva; tradurlo lato backend sarebbe una seconda implementazione di un legame che
        il database conosce gia'. ⭐ La dimensione: dentro EMESSA_NON_FATTURATA convivono
        situazioni con rimedi OPPOSTI, e un numero solo per rimedi opposti e' la stessa
        ambiguita' chiusa un livello piu' in giu'. Si aggiunge la DIMENSIONE e non si spezza
        lo STADIO — quello dice a che punto del ciclo e' il lavoro, e le situazioni sono allo
        stesso punto. ⭐ Lo stadio si calcola UNA volta sola, in una CROSS JOIN LATERAL, e la
        serve a entrambe le colonne: ricopiare la condizione avrebbe messo la sua definizione
        in due posti della stessa vista. ⛔ IS DISTINCT FROM 'COMPLETED' e non <>:
        stato_esecuzione e' nullable e ammette ERRORE, e fn_check_attivita_riportabile_da_emettere
        usa IS DISTINCT FROM — con <> la vista proporrebbe il verbo su righe che la mutazione
        rifiuta. ⭐ Quarto valore SENZA_ATTIVITA_FATTURABILE: il modello ammette una riga EMESSA
        senza attivita_fatturabile, e senza un ramo suo cadrebbe su IN_ATTESA_LOTTO dicendo il
        falso. ⭐ Il lotto di provenienza non e' lotto_id (che nasce dalla FATTURA, assente sui
        residui): e' fatturazione_lotti via lock_batch_id, UNIQUE, in LEFT JOIN perche' quella
        tabella ha la RLS. ⭐ articolo_codice/_descrizione: la vista esponeva il solo
        articolo_id, che e' un UUID — una lista di residui su cui si deve AGIRE senza il nome
        del lavoro non e' azionabile; il decode e' lo stesso che fn_list_commessa_attivita fa
        un livello sopra. ⛔ NON si usa `fatturato`: dal 20260826-33 e' generata da
        fattura_riga_id e dentro questo stadio e' sempre falsa. ⛔ security_invoker=on
        RI-SPECIFICATO: reloption invisibile che un REPLACE azzera in silenzio.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_dash_competenza_attivita
            # ⛔ La gemella con cui il CASE non deve poter divergere (D-3).
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_check_attivita_riportabile_da_emettere';
            # ⛔ E' il UNIQUE che rende lecito il LEFT JOIN sul lotto di
            #   provenienza: senza, quel join potrebbe MOLTIPLICARE le righe
            #   della vista base — e con essa quattro viste e tre funzioni.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_indexes
                   WHERE schemaname = 'vendite'
                     AND tablename  = 'fatturazione_lotti'
                     AND indexname  = 'uq_fatturazione_lotti_lock_batch_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_competenza_attivita
              WITH (security_invoker=on) AS
              SELECT ca.competenza_mese,
                  co.id AS commessa_id,
                  (co.codice)::text AS commessa_codice,
                  ca.id AS commessa_attivita_id,
                  co.emittente_soggetto_ruolo_id,
                  s.ragione_sociale_completa AS cliente_display,
                  ca.articolo_id,
                  ca.data_attivita,
                  ca.quantita,
                  ca.stato_approvazione,
                  ca.stato_emissione,
                  -- ⭐ Lo stadio ARRIVA dalla LATERAL `st`, non si ricalcola:
                  --   `motivo_non_fatturata` piu' in basso e' definito SOPRA di
                  --   lui, e un alias di SELECT non e' riferibile da un'altra
                  --   espressione della stessa SELECT. Valore, nome e tipo
                  --   della colonna restano identici alla revisione precedente.
                  st.stadio,
                  (COALESCE(ca.prezzo_snapshot, (0)::numeric) * ca.quantita) AS valore,
                  af.data_insert AS data_emissione,
                      CASE
                          WHEN (af.id IS NULL) THEN NULL::boolean
                          ELSE ((date_trunc('month'::text, af.data_insert))::date > ca.competenza_mese)
                      END AS emessa_in_ritardo,
                  af.sospesa,
                  af.posticipa_al,
                  f.id AS fattura_id,
                  af.fattura_riga_id,
                  f.anno AS fattura_anno,
                  f.serie AS fattura_serie,
                  f.numero AS fattura_numero,
                  sdf.codice_interno AS stato_fattura_codice_interno,
                  sdf.codice AS stato_fattura_codice,
                  (
                      CASE
                          WHEN (fr.id IS NULL) THEN NULL::numeric
                          WHEN (COALESCE(fr.qta, (0)::numeric) = (0)::numeric) THEN (0)::numeric
                          ELSE ((fr.imponibile_riga * af.quantita) / fr.qta)
                      END)::numeric(18,6) AS valore_fatturato,
                  COALESCE(f.critical, false) AS fattura_critical,
                  -- ⚠️ Questo lotto arriva dalla catena della FATTURA: su un
                  --   residuo la fattura non c'e', quindi e' NULL. Il lotto DA
                  --   CUI VIENE il residuo e' `lotto_provenienza_id`, in coda.
                  lf.lotto_id,
                  ca.sorgente_tipo_id,
                  ca.sorgente_uid,
                  ca.tipo_movimento,
                  vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) AS gruppo_key,
                  sc.emittibile AS commessa_emittibile,
                  sc.codice_interno AS commessa_stato_codice_interno,
                  COALESCE(sc.descrizione, sc.codice) AS commessa_stato_descrizione,
                  co.billing_account_id,
                  -- R-4: il nome dell'emittente della COMMESSA. E' un campo di
                  -- co, non dell'attivita': per questo il drill-down puo'
                  -- metterlo nel GROUP BY senza spezzare la riga.
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  -- ⭐ 2026-08-26 (L4): il SEZIONALE su cui il documento
                  --   nascera', e la DATA che prendera'. Quattro colonne, e
                  --   nessuna e' a catalogo: la lista a grana attivita' non
                  --   esiste, le usa la vista GRUPPI che sta sopra.
                  reg.registro_id,
                  -- ⚠️ `codice` e' la colonna MUTABILE, e va bene: e' display,
                  --   l'alias e' fedele alla sorgente (linee-guida-sql §6c) e
                  --   registri_fatturazione non espone codice_interno. ⛔ Chi
                  --   filtra lo fa su registro_id, mai su questa stringa.
                  rf.codice AS registro_codice,
                  -- Il PERCHE' della data: la politica vive sul sezionale.
                  reg.politica_data_documento,
                  -- ⛔ Il CASE non e' difensivo, e' obbligatorio:
                  --   fn_calcola_data_documento SOLLEVA su registro nullo, e un
                  --   CASE cortocircuita mentre un argomento no.
                  -- ⚠️ p_data_dichiarata => NULL: qui si chiede «cosa nascera'
                  --   se nessuno dichiara una data», che e' la definizione
                  --   stessa di previsione.
                  CASE
                      WHEN reg.registro_id IS NOT NULL
                      THEN vendite.fn_calcola_data_documento(
                               p_registro_id     => reg.registro_id,
                               p_competenza_mese => ca.competenza_mese,
                               p_serie           => reg.serie,
                               p_data_dichiarata => NULL)
                  END AS data_documento_prevista,
                  -- ══════════════════════════════════════════════════════════
                  -- ⭐ 2026-08-26 (D-1, brief-db-residui-competenza-dimensione-e-chiave)
                  -- ══════════════════════════════════════════════════════════
                  -- ⛔ LA CHIAVE DEL VERBO. vendite.fn_riporta_attivita_da_emettere
                  --   consuma attivita_fatturabili.id, e nessuna vista lo
                  --   esponeva: il frontend non poteva chiamare la mutazione.
                  --   ⚠️ E' un IDENTIFICATORE, non una colonna da mostrare.
                  af.id AS attivita_fatturabile_id,
                  -- Meta' del discriminante. COALESCE perche' la colonna e'
                  -- nullable e il default e' false: la stessa normalizzazione
                  -- che fa fn_check_attivita_riportabile_da_emettere.
                  COALESCE(af.lock_in_fatturazione, false) AS lock_in_fatturazione,
                  -- ⭐ L'altra meta', ed e' cio' che separa L'ORFANA dal GIRO
                  --   VIVO: PENDING/RUNNING vuol dire lotto in corso.
                  af.stato_esecuzione,
                  -- ══════════════════════════════════════════════════════════
                  -- ⭐ LA DIMENSIONE — vocabolario chiuso, NULL fuori dallo
                  --   stadio EMESSA_NON_FATTURATA.
                  -- ⛔ I quattro rami sono, uno per uno, gli stessi che
                  --   script.fn_check_attivita_riportabile_da_emettere usa per
                  --   decidere se il verbo si puo' fare. Cambiarne uno qui
                  --   senza cambiarlo li' NON produce nessun errore: la lista
                  --   proporrebbe il verbo su una riga che la mutazione
                  --   rifiuta, o lo nasconderebbe su una che accetta. Il
                  --   presidio che lega le due superfici e' il pgTAP
                  --   vendite/test-motivo-non-fatturata-v1.
                  -- ⛔ `IS DISTINCT FROM` e non `<>`: stato_esecuzione e'
                  --   NULLABLE e il CHECK ammette anche ERRORE. Con `<>` un
                  --   lucchetto a NULL darebbe NULL, il CASE cadrebbe sul ramo
                  --   dopo e la vista direbbe RESIDUO dove la funzione dice
                  --   E_ATTIVITA_IN_LAVORAZIONE.
                  -- ⭐ SENZA_ATTIVITA_FATTURABILE: il modello AMMETTE una riga
                  --   di commessa a EMESSA senza nessuna attivita' fatturabile
                  --   (il JOIN e' LEFT, e la DELETE su una riga non fatturata
                  --   e' consentita dal suo guard). Senza un ramo suo cadrebbe
                  --   su IN_ATTESA_LOTTO — cioe' «il prossimo giro la prende»,
                  --   che e' falso: la pull filtra su stato_emissione. Zero
                  --   occorrenze non significa che il caso non esiste.
                  -- ⛔ NON si usa `fatturato`: dal 20260826-33 e' GENERATA da
                  --   fattura_riga_id, quindi dentro questo stadio e' sempre
                  --   falsa e come discriminante non distingue niente.
                  -- ══════════════════════════════════════════════════════════
                  (
                      CASE
                          WHEN (st.stadio)::text <> 'EMESSA_NON_FATTURATA'::text
                              THEN NULL::text
                          WHEN af.id IS NULL
                              THEN 'SENZA_ATTIVITA_FATTURABILE'::text
                          WHEN NOT COALESCE(af.lock_in_fatturazione, false)
                              THEN 'IN_ATTESA_LOTTO'::text
                          WHEN af.stato_esecuzione IS DISTINCT FROM 'COMPLETED'::character varying
                              THEN 'GIRO_IN_CORSO'::text
                          ELSE 'RESIDUO'::text
                      END)::character varying AS motivo_non_fatturata,
                  -- ⭐ IL LOTTO DA CUI VIENE IL RESIDUO — «da dove viene questa
                  --   riga», che oggi non si vede da nessuna parte. ⚠️ Non e'
                  --   `lotto_id` qui sopra: quello nasce dalla FATTURA, e su un
                  --   residuo la fattura non c'e'.
                  fl.id AS lotto_provenienza_id,
                  -- ⚠️ `codice` e' MUTABILE: display, alias fedele alla
                  --   sorgente (§6c), e fatturazione_lotti non espone
                  --   codice_interno. Chi filtra lo fa su lotto_provenienza_id.
                  fl.codice AS lotto_provenienza_codice,
                  -- ⭐ CHE LAVORO E'. La vista esponeva il solo `articolo_id`,
                  --   che e' un UUID: a un operatore non dice niente, e una
                  --   lista di residui su cui si deve AGIRE senza il nome del
                  --   lavoro non e' azionabile. Il decode e' lo stesso di
                  --   vendite.fn_list_commessa_attivita (rev 2026-08-20), che
                  --   lo fa un livello sopra sulla stessa colonna.
                  -- ⚠️ LEFT anche se articolo_id e' NOT NULL: non e' un dubbio
                  --   sul dato, e' che un decode non deve poter far sparire la
                  --   riga che sta decorando.
                  art.codice AS articolo_codice,
                  art.descrizione AS articolo_descrizione
                 FROM vendite.commesse co
                 JOIN vendite.stati_commessa sc ON sc.id = co.stato_commessa_id
                 JOIN vendite.commesse_attivita ca ON ca.commessa_id = co.id
                 LEFT JOIN vendite.attivita_fatturabili af ON af.commessa_attivita_id = ca.id
                 LEFT JOIN vendite.fatture_righe fr ON fr.id = af.fattura_riga_id
                 LEFT JOIN vendite.fatture f ON f.id = fr.fattura_id
                 LEFT JOIN config.stati_doc_fiscale sdf ON sdf.id = f.stato_doc_fiscale_id
                 LEFT JOIN anagrafiche.billing_account ba ON ba.id = co.billing_account_id
                 LEFT JOIN anagrafiche.soggetti_ruoli sr ON sr.id = ba.soggetto_ruolo_id
                 LEFT JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                 -- ⚠️ sr_ef/s_ef e non sr/s: quelli sopra sono il CLIENTE (via
                 --   billing account), questi l'EMITTENTE. Due catene distinte
                 --   sulle stesse due tabelle, e confonderle sarebbe invisibile
                 --   finche' non si guarda un nome sbagliato a video.
                 LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = co.emittente_soggetto_ruolo_id
                 LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                 LEFT JOIN LATERAL ( SELECT flf.lotto_id
                       FROM vendite.fatturazione_lotti_fatture flf
                      WHERE (flf.fattura_id = f.id)
                      ORDER BY flf.lotto_id DESC
                     LIMIT 1) lf ON (true)
                 -- ⭐ LA CATENA DEL SEZIONALE, chiamata e non ricopiata: e' la
                 --   STESSA funzione che usa fn_build_fattura_key quando la
                 --   fattura nasce davvero. I due ancoraggi (BA di fatturazione
                 --   dal PADRE, utility dalla RIGA) vivono li' dentro.
                 -- ⚠️ Si passa co.billing_account_id, cioe' il BA della RIGA:
                 --   la funzione risale al padre da se'. Passarle il BA di
                 --   fatturazione darebbe una previsione plausibile e sbagliata
                 --   proprio sui BA con padre.
                 -- ⛔ ON (af.fattura_riga_id IS NULL) e non ON true (D-9): dove
                 --   il documento esiste gia' non si fa nessuna previsione.
                 LEFT JOIN LATERAL vendite.fn_resolve_registro_documento(
                          p_billing_account_id_riga => co.billing_account_id,
                          p_tipo_doc_fiscale_id     => ca.tipo_doc_fiscale_id,
                          p_natura_doc_id           => ca.natura_doc_id) reg
                      ON (af.fattura_riga_id IS NULL)
                 LEFT JOIN vendite.registri_fatturazione rf ON rf.id = reg.registro_id
                 -- ⭐ IL LOTTO DI PROVENIENZA. `attivita_fatturabili.lock_batch_id`
                 --   e' il timbro del giro che l'ha lucchettata, e
                 --   `fatturazione_lotti.lock_batch_id` ha un UNIQUE: il JOIN
                 --   non puo' moltiplicare righe (verificato in preCondition,
                 --   perche' e' cio' che lo rende lecito su una vista che ne
                 --   alimenta altre quattro).
                 -- ⚠️ LEFT e non INNER: fatturazione_lotti ha la RLS, e un
                 --   lotto fuori perimetro deve lasciare le colonne a NULL, non
                 --   far sparire il residuo dalla lista.
                 -- ℹ️ Su lock_batch_id NULL (attivita' non lucchettata) il JOIN
                 --   non trova nulla da se': NULL non e' uguale a niente.
                 LEFT JOIN vendite.fatturazione_lotti fl ON fl.lock_batch_id = af.lock_batch_id
                 -- ⭐ Il DECODE dell'articolo, per la lista dei residui: senza,
                 --   a video ci sarebbe un UUID. catalogo.articoli non ha RLS e
                 --   il join e' sulla chiave primaria.
                 LEFT JOIN catalogo.articoli art ON art.id = ca.articolo_id
                 -- ⭐ LO STADIO, CALCOLATO UNA VOLTA SOLA. Serve due colonne —
                 --   `stadio` e `motivo_non_fatturata` — e in SQL un alias di
                 --   SELECT non e' riferibile da un'altra espressione della
                 --   stessa SELECT. Ricopiare il CASE avrebbe messo la
                 --   definizione dello stadio in DUE posti della stessa vista,
                 --   dove divergere non produce nessun errore.
                 CROSS JOIN LATERAL ( SELECT (
                      CASE
                          WHEN (((ca.stato_emissione)::text <> 'EMESSA'::text) AND ((ca.stato_approvazione)::text <> 'APPROVATA'::text)) THEN 'DA_APPROVARE'::text
                          WHEN ((ca.stato_emissione)::text <> 'EMESSA'::text) THEN 'DA_EMETTERE'::text
                          WHEN (af.fattura_riga_id IS NULL) THEN 'EMESSA_NON_FATTURATA'::text
                          ELSE 'FATTURATA'::text
                      END)::character varying AS stadio) st
                 CROSS JOIN LATERAL ( SELECT script.fn_get_emittenti_scope_sr_ids((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer) AS sr_ids) escope
                WHERE (((escope.sr_ids IS NULL) OR (co.emittente_soggetto_ruolo_id = ANY (escope.sr_ids)))
                  AND ((sc.codice_interno)::text <> 'ANNULLATA'::text)
                  AND ((ca.stato_emissione)::text <> 'ANNULLATA'::text)
                  AND (((ca.stato_approvazione)::text <> 'RIFIUTATA'::text) OR ((ca.stato_emissione)::text = 'EMESSA'::text)));

              COMMENT ON VIEW vendite.vw_dash_competenza_attivita IS
                  'Lente 1 Competenza, grana ATTIVITA'': una riga per attivita'' di commessa '
                  'con lo stadio del ciclo (DA_APPROVARE / DA_EMETTERE / EMESSA_NON_FATTURATA '
                  '/ FATTURATA), il valore, il collegamento a fattura e lotto e lo stato della '
                  'commessa. Alimenta il drill-down commesse, che il backend AGGREGA per '
                  'commessa. SCOPE EMITTENTE via fn_get_emittenti_scope_sr_ids(GUC): '
                  'fail-closed. security_invoker=on. '
                  '⭐ Rev 2026-08-18 (R-4, brief perimetro-emittente Fase E): aggiunta in coda '
                  '`emittente_ragione_sociale`. Il drill-down puo'' metterla nel GROUP BY in '
                  'sicurezza: l''emittente e'' una colonna di vendite.commesse e commessa_id ne '
                  'e'' la chiave primaria, quindi una commessa non puo'' avere attivita'' di '
                  'emittenti diversi — l''emittente non sta sull''attivita''. La colonna nel '
                  'GROUP BY serve comunque: su una colonna di VISTA PostgreSQL non deduce la '
                  'dipendenza funzionale. '
                  '⚠️ Due catene distinte sulle stesse tabelle: sr/s sono il CLIENTE (via '
                  'billing account), sr_ef/s_ef l''EMITTENTE. Scambiarle non darebbe nessun '
                  'errore, solo un nome sbagliato a video. '
                  '⭐ Rev 2026-08-26 (L4, brief-db-registro-e-data-prevista-in-competenza): '
                  'quattro colonne nuove in coda — registro_id, registro_codice, '
                  'politica_data_documento, data_documento_prevista. Rispondono alle due '
                  'domande che la schermata da cui si fattura non sapeva dire PRIMA di '
                  'premere: su quale sezionale finira'' il documento, e che data portera''. '
                  '⭐ Il sezionale si risolve chiamando vendite.fn_resolve_registro_documento, '
                  'cioe'' LA STESSA funzione che usa fn_build_fattura_key quando la fattura '
                  'nasce davvero: la previsione e'' una lettura, non una profezia, e non puo'' '
                  'divergere dal documento perche'' non e'' una seconda implementazione. '
                  '⚠️ Le si passa co.billing_account_id, il BA della RIGA: la funzione risale '
                  'al padre da se'', e passarle il BA di fatturazione darebbe una previsione '
                  'plausibile e sbagliata proprio sui BA con padre. '
                  '⛔ L''aggancio e'' CONDIZIONATO — ON (af.fattura_riga_id IS NULL), decisione '
                  'D-9: dove il documento esiste gia'' la previsione non si fa, o la colonna '
                  'mentirebbe al proprio nome. ⚠️ Il discriminante e'' la riga di fattura e non '
                  'lo stadio: su EMESSA_NON_FATTURATA il documento non c''e'' ancora — e li'' '
                  'finiscono le attivita'' rimaste orfane di una fattura eliminata, cioe'' '
                  'lavoro da ri-emettere, per cui sapere dove finira'' e'' proprio '
                  'l''informazione utile. '
                  '⛔ Il CASE sulla data e'' obbligatorio e non difensivo: '
                  'fn_calcola_data_documento SOLLEVA su registro nullo, un CASE cortocircuita '
                  'e un argomento no — senza, la prima riga con un sezionale non risolvibile '
                  'farebbe morire l''intera lista. '
                  '⚠️ registro_codice viene da registri_fatturazione.codice, colonna MUTABILE: '
                  'e'' display, l''alias e'' fedele alla sorgente (linee-guida-sql §6c) e quella '
                  'tabella non espone codice_interno. Nessuna logica puo'' appoggiarcisi — chi '
                  'filtra lo fa su registro_id. '
                  'ℹ️ Costo dichiarato: due chiamate di funzione per riga su una vista che ne '
                  'alimenta altre quattro. Tutta la catena e'' STABLE e le tabelle di '
                  'configurazione lette non hanno RLS. '
                  '⭐ Rev 2026-08-26 (D-1, brief-db-residui-competenza-dimensione-e-chiave): '
                  'otto colonne nuove in coda — attivita_fatturabile_id, lock_in_fatturazione, '
                  'stato_esecuzione, motivo_non_fatturata, lotto_provenienza_id, '
                  'lotto_provenienza_codice, articolo_codice, articolo_descrizione. '
                  '⛔ attivita_fatturabile_id e'' LA CHIAVE DEL VERBO: '
                  'vendite.fn_riporta_attivita_da_emettere consuma '
                  'vendite.attivita_fatturabili.id, e nessuna vista lo esponeva — il frontend '
                  'non poteva chiamare la mutazione. Tradurre commessa_attivita_id -> af.id '
                  'lato backend sarebbe stata una SECONDA IMPLEMENTAZIONE di un legame che il '
                  'database conosce gia''. E'' un identificatore, non una colonna da mostrare. '
                  '⭐ motivo_non_fatturata e'' LA DIMENSIONE, a vocabolario chiuso di quattro '
                  'valori e NULL fuori dallo stadio EMESSA_NON_FATTURATA: IN_ATTESA_LOTTO (non '
                  'lucchettata, il prossimo giro la prende da se''), GIRO_IN_CORSO '
                  '(lucchettata, stato_esecuzione diverso da COMPLETED), RESIDUO (lucchettata '
                  'e COMPLETED, senza riga di fattura — l''unica che il verbo tocca) e '
                  'SENZA_ATTIVITA_FATTURABILE. '
                  '⛔ Serve perche'' lo stadio guarda SOLO fattura_riga_id, e dentro '
                  'EMESSA_NON_FATTURATA finiscono situazioni con RIMEDI OPPOSTI: due non '
                  'chiedono nessuna azione, una si''. Un numero solo per rimedi opposti e'' la '
                  'stessa ambiguita'' che il cantiere «il lavoro che non torna indietro» ha '
                  'chiuso un livello piu'' in giu''. '
                  '⛔ E NON si spezza il valore EMESSA_NON_FATTURATA in due stadi: lo STADIO '
                  'dice a che punto del ciclo e'' il lavoro, e le situazioni sono allo STESSO '
                  'punto — cambia la loro salute, non il loro avanzamento. Si aggiunge la '
                  'DIMENSIONE, come il 2026-08-20 si aggiunse tipo_movimento alla mensile '
                  'invece di una colonna valore_rettifiche. '
                  '⛔ I quattro rami sono, uno per uno, gli stessi di '
                  'script.fn_check_attivita_riportabile_da_emettere: cambiarne uno qui senza '
                  'cambiarlo li'' non produce nessun errore — la lista proporrebbe il verbo su '
                  'una riga che la mutazione rifiuta, o lo nasconderebbe su una che accetta. '
                  'Il presidio che lega le due superfici e'' db/pgtap/vendite/'
                  'test-motivo-non-fatturata-v1.sql, con una fixture COSTRUITA per ciascun '
                  'caso. '
                  '⛔ IS DISTINCT FROM ''COMPLETED'' e non <>: stato_esecuzione e'' NULLABLE e '
                  'il CHECK ammette anche ERRORE, quindi con <> un lucchetto a NULL darebbe '
                  'NULL e il CASE cadrebbe su RESIDUO dove la funzione dice '
                  'E_ATTIVITA_IN_LAVORAZIONE. ERRORE finisce percio'' in GIRO_IN_CORSO, e il '
                  'rimedio (aspettare che il lotto si chiuda) e'' lo stesso. '
                  '⭐ SENZA_ATTIVITA_FATTURABILE e'' il quarto valore: il modello AMMETTE una '
                  'riga di commessa a EMESSA senza NESSUNA riga in attivita_fatturabili (il '
                  'JOIN e'' LEFT, e il guard di DELETE ammette per progetto la cancellazione di '
                  'una riga non fatturata). Senza un ramo suo il COALESCE la farebbe cadere su '
                  'IN_ATTESA_LOTTO, cioe'' «il prossimo giro la prende» — falso, perche'' la '
                  'pull filtra su stato_emissione e non la riprende mai piu''; e '
                  'attivita_fatturabile_id sarebbe NULL, quindi il verbo non avrebbe nemmeno '
                  'la chiave. Zero occorrenze non significa che il caso non esiste. '
                  '⛔ NON si usa `fatturato` come discriminante: dal 20260826-33 e'' una '
                  'colonna GENERATA da fattura_riga_id, quindi dentro EMESSA_NON_FATTURATA e'' '
                  'sempre falsa e non distingue niente. '
                  '⭐ lotto_provenienza_id/_codice rispondono a «da dove viene questo residuo», '
                  'e NON sono lotto_id: quello nasce dalla catena della FATTURA e su un '
                  'residuo la fattura non c''e''. Arrivano da vendite.fatturazione_lotti via '
                  'lock_batch_id, che li'' ha un UNIQUE — quindi il LEFT JOIN non puo'' '
                  'moltiplicare righe. LEFT e non INNER perche'' fatturazione_lotti ha la RLS: '
                  'un lotto fuori perimetro lascia le colonne a NULL e non fa sparire il '
                  'residuo. lotto_provenienza_codice viene da codice, MUTABILE: e'' display '
                  '(§6c) e nessuna logica puo'' appoggiarcisi. '
                  '⭐ articolo_codice/articolo_descrizione dicono CHE LAVORO E'': la vista '
                  'esponeva il solo articolo_id, che e'' un UUID, e una lista di residui su cui '
                  'si deve AGIRE senza il nome del lavoro non e'' azionabile. Il decode e'' lo '
                  'stesso di vendite.fn_list_commessa_attivita (rev 2026-08-20), che lo fa un '
                  'livello sopra sulla stessa colonna. LEFT anche se articolo_id e'' NOT NULL: '
                  'un decode non deve poter far sparire la riga che sta decorando, e '
                  'catalogo.articoli non ha RLS. '
                  'ℹ️ I due JOIN nuovi NON li paga chi non li usa, e la ragione e'' '
                  'STRUTTURALE: sono LEFT JOIN su chiavi con indice UNIQUE '
                  '(uq_fatturazione_lotti_lock_batch_id, pk_articoli), quindi PostgreSQL puo'' '
                  'PROVARE che non moltiplicano le righe e li elimina dal piano quando nessuna '
                  'delle loro colonne e'' selezionata (left join removal). ⚠️ La condizione che '
                  'regge tutto e'' il UNIQUE: togliendolo l''eliminazione smetterebbe di essere '
                  'lecita e la vista comincerebbe a contare doppio — per questo e'' in '
                  'preCondition e ha un test suo. '
                  '⭐ Lo STADIO si calcola UNA volta sola, nella CROSS JOIN LATERAL `st`, e '
                  'serve sia la colonna stadio sia motivo_non_fatturata: quest''ultima e'' '
                  'definita SOPRA lo stadio e in SQL un alias di SELECT non e'' riferibile da '
                  'un''altra espressione della stessa SELECT. Ricopiare il CASE avrebbe messo '
                  'la definizione dello stadio in DUE posti della stessa vista, dove divergere '
                  'non produce nessun errore. Valore, nome e tipo della colonna stadio non '
                  'cambiano.';
