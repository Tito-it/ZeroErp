# LA PROIEZIONE DELLO SMISTAMENTO: L'ACCETTAZIONE DAL VOCABOLARIO
#   Brief: brief-db-stati-documento-dal-vocabolario §6.15, giro 6a, D-PROI.
#   ⚠️ Revoca in parte una riga del 2026-10-31 (brief-modello-documento-vendita
#   §17.2: «resta: e' la proiezione fra due stati nominati, ed EVASO non ha
#   una colonna»): si applica con l'ok di Tid su D-PROI.
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   La proiezione partiva da 'ACCETTATO' e ci tornava. Lo smistamento invece
#   si apre dallo stato di accettazione del vocabolario: la capability
#   (can_push_commessa, can_genera_ordine), vendite.fn_push_preventivo_a_ordine
#   e vendite.fn_list_preventivi_da_pushare lo leggono dalla colonna
#   accettazione dal 2026-10-31. Con la marca spostata il push lavorava dal
#   nuovo stato e la proiezione non scattava piu': il preventivo smistato per
#   intero non diventava EVASO, e da EVASO tornava a ACCETTATO invece che allo
#   stato da cui lo smistamento si apre.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   La riga dello stato porta accettazione; la partenza e' «stato di
#   accettazione» o EVASO, il ritorno e' script.fn_stato_accettazione_id. EVASO
#   resta col codice, da script.fn_doc_stato_id: e' la destinazione del
#   processo (S-3), e la motivazione del 2026-10-31 vale ancora per lei. Con il
#   seed l'esito e' quello di prima.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, firma ri-ancorata come nel 20261025-45, VOLATILE,
#   SECURITY DEFINER con search_path bloccato (pg_proc su dbdev, 2026-11-14:
#   SET search_path TO 'pg_catalog', 'public', 'pg_temp', ripetuto dal
#   corpo vivo). E_CONFIG_MANCANTE resta, per EVASO e per l'accettazione. Il
#   COMMENT, che portava una cronaca, e' riscritto al presente.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14. Il rollback porta il corpo e il
#   COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-13-update-fn-preventivo-proietta-stato-smistamento-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261114-13-update-fn-preventivo-proietta-stato-smistamento-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_preventivo_proietta_stato_smistamento: parte dallo stato di accettazione del
        vocabolario e ci torna, EVASO resta la destinazione nominata. Brief:
        brief-db-stati-documento-dal-vocabolario, giro 6a, D-PROI.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_preventivo_proietta_stato_smistamento(p_preventivo_id vendite.preventivi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: portare il preventivo nello stato che il suo
              --   smistamento dice.
              --   stato di accettazione, nessun residuo (ordine e commessa) -> EVASO;
              --   EVASO, residuo su almeno una strada -> stato di accettazione;
              --   ogni altro caso                     -> niente.
              --   La transizione passa dalla matrice
              --   (trgfn_preventivi_guard_transizione).
              -- Consumatori: vendite.fn_push_preventivo_a_ordine,
              --   vendite.fn_documento_ritira_legami (annullo dell'ordine),
              --   vendite.trgfn_commesse_attivita_proietta_stato_preventivo
              --   (invio in commessa, ritiro, annullo della commessa).
              -- Brief: brief-db-annullo-a-valle-riapre-a-monte (D-1, D-10).
              -- rev 2026-10-25 (20261025-45, brief-modello-documento-vendita
              --   §8): e' il verbo dei passaggi di PROCESSO del preventivo
              --   (manuale = false): scrive con la sola seconda meta' del
              --   verbo comune, attraverso la porta. DEFINER, perche' la porta
              --   vuole il proprietario; lo stato e' la proiezione dei residui,
              --   non una scelta di chi chiama.
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6a,
              --   D-PROI): la partenza e il ritorno sono lo stato di accettazione del
              --   vocabolario, quello da cui lo smistamento si apre; EVASO resta la
              --   destinazione nominata del processo.
              -- =========================================================
              DECLARE
                  v_stato        config.stati_doc_preventivi.codice_interno%TYPE;
                  -- Lo stato di oggi e' l'accettazione? Dal vocabolario.
                  v_accettazione config.stati_doc_preventivi.accettazione%TYPE;
                  -- Il nome della destinazione che manca, per il messaggio: il codice EVASO o
                  -- la colonna accettazione, nessuna colonna di cui sia il riflesso.
                  v_target       text;
                  v_target_id    config.stati_doc_preventivi.id%TYPE;
                  -- Esito di due predicati: nessuna colonna da ancorare.
                  v_residuo      boolean;
              BEGIN
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_preventivo_proietta_stato_smistamento',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_preventivo_id', p_preventivo_id),
                          NULL::uuid, 'vendite.fn_preventivo_proietta_stato_smistamento',
                          'p_preventivo_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- Lo stato di oggi. Preventivo assente: niente.
                  SELECT s.codice_interno, s.accettazione
                    INTO v_stato, v_accettazione
                    FROM vendite.preventivi p
                    JOIN config.stati_doc_preventivi s ON s.id = p.stato_doc_preventivo_id
                   WHERE p.id = p_preventivo_id;

                  IF v_stato IS NULL OR NOT (v_accettazione OR v_stato = 'EVASO') THEN
                      RETURN;
                  END IF;

                  v_residuo := vendite.fn_preventivo_ha_residuo_ordine(p_preventivo_id)
                            OR vendite.fn_preventivo_ha_residuo_commessa(p_preventivo_id);

                  -- EVASO e' la destinazione del processo, e si nomina col codice come la
                  -- nomina la riga della matrice; il ritorno e' lo stato di accettazione.
                  IF v_accettazione AND NOT v_residuo THEN
                      v_target    := 'EVASO';
                      v_target_id := script.fn_doc_stato_id('vendite.preventivi'::regclass, 'EVASO');
                  ELSIF v_stato = 'EVASO' AND v_residuo THEN
                      v_target    := 'accettazione';
                      v_target_id := script.fn_stato_accettazione_id('vendite.preventivi'::regclass);
                  ELSE
                      RETURN;
                  END IF;

                  IF v_target_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_preventivo_proietta_stato_smistamento',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_preventivi.' || v_target),
                          NULL::uuid, 'stato ' || v_target || ' (config.stati_doc_preventivi)');
                  END IF;

                  -- Il target e' sempre diverso dallo stato di oggi (IF sopra).
                  -- La matrice la giudica il guard di transizione, all'UPDATE.
                  PERFORM script.fn_doc_scrivi_stato('vendite.preventivi'::regclass,
                                                     p_preventivo_id, v_target_id);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_preventivo_proietta_stato_smistamento(p_preventivo_id vendite.preventivi.id%TYPE)
              IS 'Porta il preventivo nello stato che il suo smistamento dice. Dallo stato di accettazione (la colonna accettazione di config.stati_doc_preventivi), senza residuo su nessuna strada (vendite.fn_preventivo_ha_residuo_ordine, vendite.fn_preventivo_ha_residuo_commessa) -> EVASO; da EVASO, con un residuo su almeno una -> lo stato di accettazione; ogni altro stato, o preventivo assente -> niente. L''accettazione e'' un significato e si legge dalla colonna, la stessa da cui script.fn_available_actions_preventivo e vendite.fn_push_preventivo_a_ordine aprono lo smistamento; EVASO e'' la destinazione del processo e si nomina col codice (script.fn_doc_stato_id), come la nomina la riga della matrice. Destinazione assente dal vocabolario: E_CONFIG_MANCANTE. E'' il verbo dei passaggi di processo del preventivo (manuale = false nella matrice): scrive con script.fn_doc_scrivi_stato, attraverso la porta (script.trgfn_doc_stato_solo_dal_verbo), e il passaggio lo giudica vendite.trgfn_preventivi_guard_transizione. Specchio di vendite.fn_ordine_proietta_stato_evasione. Consumatori: vendite.fn_push_preventivo_a_ordine, vendite.fn_documento_ritira_legami (annullo dell''ordine), vendite.trgfn_commesse_attivita_proietta_stato_preventivo (invio in commessa, ritiro delle righe, annullo della commessa). SECURITY DEFINER con search_path bloccato, perche'' la porta vuole il proprietario: lo stato e'' la proiezione dei residui, non una scelta di chi chiama, e il perimetro di chi agisce lo controllano i consumatori. Parametro non valido: E_VENDITE_CHIAMATA_NON_VALIDA (TECNICO).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_preventivo_proietta_stato_smistamento(p_preventivo_id vendite.preventivi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: portare il preventivo nello stato che il suo
              --   smistamento dice.
              --   ACCETTATO, nessun residuo (ordine e commessa) -> EVASO;
              --   EVASO, residuo su almeno una strada          -> ACCETTATO;
              --   ogni altro caso                              -> niente.
              --   La transizione passa dalla matrice
              --   (trgfn_preventivi_guard_transizione).
              -- Consumatori: vendite.fn_push_preventivo_a_ordine,
              --   vendite.fn_documento_ritira_legami (annullo dell'ordine),
              --   vendite.trgfn_commesse_attivita_proietta_stato_preventivo
              --   (invio in commessa, ritiro, annullo della commessa).
              -- Brief: brief-db-annullo-a-valle-riapre-a-monte (D-1, D-10).
              -- rev 2026-10-25 (20261025-45, brief-modello-documento-vendita
              --   §8): e' il verbo dei passaggi di PROCESSO del preventivo
              --   (manuale = false): scrive con la sola seconda meta' del
              --   verbo comune, attraverso la porta. DEFINER, perche' la porta
              --   vuole il proprietario; lo stato e' la proiezione dei residui,
              --   non una scelta di chi chiama.
              -- =========================================================
              DECLARE
                  v_stato        config.stati_doc_preventivi.codice_interno%TYPE;
                  v_target       config.stati_doc_preventivi.codice_interno%TYPE;
                  v_target_id    config.stati_doc_preventivi.id%TYPE;
                  -- Esito di due predicati: nessuna colonna da ancorare.
                  v_residuo      boolean;
              BEGIN
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_preventivo_proietta_stato_smistamento',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_preventivo_id', p_preventivo_id),
                          NULL::uuid, 'vendite.fn_preventivo_proietta_stato_smistamento',
                          'p_preventivo_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- Lo stato di oggi. Preventivo assente: niente.
                  SELECT s.codice_interno
                    INTO v_stato
                    FROM vendite.preventivi p
                    JOIN config.stati_doc_preventivi s ON s.id = p.stato_doc_preventivo_id
                   WHERE p.id = p_preventivo_id;

                  IF v_stato IS NULL OR v_stato NOT IN ('ACCETTATO', 'EVASO') THEN
                      RETURN;
                  END IF;

                  v_residuo := vendite.fn_preventivo_ha_residuo_ordine(p_preventivo_id)
                            OR vendite.fn_preventivo_ha_residuo_commessa(p_preventivo_id);

                  v_target := CASE
                                WHEN v_stato = 'ACCETTATO' AND NOT v_residuo THEN 'EVASO'
                                WHEN v_stato = 'EVASO'     AND v_residuo     THEN 'ACCETTATO'
                              END;

                  IF v_target IS NULL THEN
                      RETURN;
                  END IF;

                  v_target_id := script.fn_doc_stato_id('vendite.preventivi'::regclass, v_target);

                  IF v_target_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_preventivo_proietta_stato_smistamento',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_preventivi.' || v_target),
                          NULL::uuid, 'stato ' || v_target || ' (config.stati_doc_preventivi)');
                  END IF;

                  -- Il target e' sempre diverso dallo stato di oggi (CASE sopra).
                  -- La matrice la giudica il guard di transizione, all'UPDATE.
                  PERFORM script.fn_doc_scrivi_stato('vendite.preventivi'::regclass,
                                                     p_preventivo_id, v_target_id);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_preventivo_proietta_stato_smistamento(p_preventivo_id vendite.preventivi.id%TYPE)
              IS 'Building block (2026-10-12, brief-db-annullo-a-valle-riapre-a-monte D-1/D-10 di Tid): porta il preventivo nello stato che il suo smistamento dice. ACCETTATO senza residuo su nessuna strada (vendite.fn_preventivo_ha_residuo_ordine, vendite.fn_preventivo_ha_residuo_commessa) -> EVASO; EVASO con un residuo su almeno una -> ACCETTATO; ogni altro stato, o preventivo assente, -> niente. Specchio di vendite.fn_ordine_proietta_stato_evasione. E'' il verbo dei passaggi di PROCESSO del preventivo (manuale = false nella matrice): scrive con la sola seconda meta'' del verbo comune, script.fn_doc_scrivi_stato, attraverso la porta (script.trgfn_doc_stato_solo_dal_verbo); la matrice la giudica vendite.trgfn_preventivi_guard_transizione. Destinazione da script.fn_doc_stato_id; assente dal catalogo: E_CONFIG_MANCANTE. Sede unica della regola, che prima aveva tre copie su due livelli: il §8 di vendite.fn_push_preventivo_a_ordine, il §4b di vendite.fn_documento_ritira_legami e il gate EVASO del backend dopo l''invio in commessa. Consumatori: vendite.fn_push_preventivo_a_ordine, vendite.fn_documento_ritira_legami (annullo dell''ordine), vendite.trgfn_commesse_attivita_proietta_stato_preventivo (invio in commessa, ritiro delle righe, annullo della commessa). SECURITY DEFINER con search_path bloccato (la porta vuole il proprietario): la proiezione vale per ogni preventivo, perche'' lo stato e'' la proiezione dei residui e non una scelta di chi chiama; il perimetro di chi agisce lo controllano i consumatori. Parametro non valido: E_VENDITE_CHIAMATA_NON_VALIDA (TECNICO). rev 2026-10-25 (20261025-45, brief-modello-documento-vendita §8): il verbo comune, DEFINER.';
