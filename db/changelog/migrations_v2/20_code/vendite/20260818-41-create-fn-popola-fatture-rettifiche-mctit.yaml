# N10 — IL LEGAME DOCUMENTO ↔ DOCUMENTO, come PROIEZIONE
#   brief-design-note-credito-resi.md §12.6-bis (punto 4)
#
# ── LA TABELLA CHE ESISTE E NON E' MAI STATA USATA ─────────────────────
#
#   `vendite.fatture_rettifiche (fattura_id, rettificata_id)` esiste dal primo
#   giorno, ha **zero righe** e nessuno la scrive. Il §2 del brief la giudicava
#   cosi': «non va buttata: serve come legame fra i due documenti, ma da sola
#   non chiude nulla».
#
#   ⭐ Adesso non e' piu' sola. Con `fatture_righe.riga_rettificata_id` (N5) il
#   legame fra documenti e' il `DISTINCT` di quello fra righe: **le righe sono
#   il fatto, la tabella-ponte e' l'indice**. Cosi' non ci sono due verita' —
#   c'e' una verita' e una sua proiezione, che si puo' ricostruire in qualunque
#   momento senza chiedere niente a nessuno.
#
# ── PERCHE' UNA FUNZIONE E NON UN TRIGGER ──────────────────────────────
#
#   Un trigger su `fatture_righe` girerebbe **dentro la transazione che genera
#   le righe**, che e' il punto piu' caldo del giro di fatturazione: un
#   `INSERT ... SELECT DISTINCT` per ogni riga scritta, su una tabella che ne
#   scrive migliaia per lotto. La proiezione non ha bisogno di essere immediata
#   — serve a chi legge il documento, non a chi lo scrive — quindi e' un **task
#   di pipeline** (richiesta BE-8).
#
#   ⭐ Idempotente per costruzione: `ON CONFLICT DO NOTHING` sulla coppia. Si
#   puo' rieseguire quante volte si vuole, anche su un documento gia' proiettato.
#
# ── A COSA SERVE DAVVERO ───────────────────────────────────────────────
#
#   Al blocco `DatiFattureCollegate` di una TD04, che vuole **numero e data del
#   documento rettificato**. Senza questo legame il builder XML dovrebbe
#   risalire riga per riga e poi de-duplicare da solo — cioe' rifare qui il
#   lavoro, in un posto dove un errore diventa un file trasmesso.
#
# ── ⚠️ COSA NON FA ─────────────────────────────────────────────────────
#
#   Non cancella. Se una riga di nota di credito venisse tolta (cosa che
#   l'immutabilita' delle righe di fattura gia' vieta oltre la soglia
#   DRAFT/EMESSA), la coppia resterebbe. E' voluto: una proiezione che cancella
#   diventa un secondo scrittore, e il §11.2 delle linee guida spiega perche'
#   e' quello il momento in cui nascono le due verita'.
#
# Dipendenze: vendite.fatture_righe.riga_rettificata_id (-27),
#   vendite.fatture_rettifiche.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-41-create-fn-popola-fatture-rettifiche-mctit.yaml

  - changeSet:
      id: 20260818-41-create-fn-popola-fatture-rettifiche
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        N10: proietta il legame riga-a-riga (fatture_righe.riga_rettificata_id)
        sul legame documento-a-documento (vendite.fatture_rettifiche), che
        finora era una tabella a zero righe. Le righe sono il fatto, la
        tabella-ponte e' l'indice: nessuna seconda verita'. Funzione e non
        trigger, perche' dentro la transazione che genera le righe
        appesantirebbe il punto piu' caldo del giro — la consuma un task di
        pipeline (BE-8). Idempotente: ON CONFLICT DO NOTHING.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatture_righe
                columnName: riga_rettificata_id
            - tableExists:
                schemaName: vendite
                tableName: fatture_rettifiche
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_popola_fatture_rettifiche(
                  p_fattura_id vendite.fatture.id%TYPE
              )
               -- RETURNS integer: e' un CONTEGGIO di coppie inserite, non il
               -- valore di una colonna — non c'e' nulla da ancorare.
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: proietta sul legame documento-a-documento
              --   (vendite.fatture_rettifiche) cio' che le righe gia' dicono
              --   (fatture_righe.riga_rettificata_id). Ritorna il numero di
              --   coppie effettivamente aggiunte.
              -- Idempotente: ON CONFLICT DO NOTHING sulla coppia. Rieseguibile
              --   su un documento gia' proiettato senza effetti.
              -- ⚠️ Non cancella mai: una proiezione che cancella diventa un
              --   secondo scrittore, ed e' li' che nascono le due verita'.
              DECLARE
                  v_inserite integer;
              BEGIN
                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_popola_fatture_rettifiche','E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro','fattura_id','valore',p_fattura_id),
                          NULL::uuid, 'fattura_id obbligatorio (>0)');
                  END IF;

                  INSERT INTO vendite.fatture_rettifiche (fattura_id, rettificata_id)
                  SELECT DISTINCT r.fattura_id, orig.fattura_id
                    FROM vendite.fatture_righe r
                    JOIN vendite.fatture_righe orig ON orig.id = r.riga_rettificata_id
                   WHERE r.fattura_id = p_fattura_id
                     AND r.riga_rettificata_id IS NOT NULL
                     -- Una fattura non rettifica se stessa: sarebbe una coppia
                     -- che non dice nulla, e la FK la ammetterebbe.
                     AND orig.fattura_id <> r.fattura_id
                  ON CONFLICT ON CONSTRAINT uq_fatture_rettifiche_pair DO NOTHING;

                  GET DIAGNOSTICS v_inserite = ROW_COUNT;
                  RETURN v_inserite;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_popola_fatture_rettifiche(bigint)
              IS 'Proietta sul legame documento-a-documento (vendite.fatture_rettifiche, una tabella che esisteva dal primo giorno con ZERO righe) cio'' che le righe gia'' dicono tramite fatture_righe.riga_rettificata_id. ⭐ Le righe sono il FATTO, la tabella-ponte e'' l''INDICE: non ci sono due verita'', c''e'' una verita'' e una sua proiezione ricostruibile in qualunque momento. Serve al blocco DatiFattureCollegate di una TD04, che vuole numero e data del documento rettificato: senza, il builder XML dovrebbe risalire riga per riga e de-duplicare da solo, cioe'' rifare questo lavoro in un posto dove un errore diventa un file trasmesso. Funzione e NON trigger: dentro la transazione che genera le righe girerebbe una volta per riga sul punto piu'' caldo del giro di fatturazione, e la proiezione non ha bisogno di essere immediata — serve a chi LEGGE il documento, non a chi lo scrive. La consuma un task di pipeline (richiesta BE-8). Idempotente (ON CONFLICT DO NOTHING); non cancella mai, perche'' una proiezione che cancella diventa un secondo scrittore. brief-design-note-credito-resi N10. rev 2026-08-18.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_popola_fatture_rettifiche(bigint);
