# L'INVOLUCRO SEGUE IL CORPO COMUNE: vendite.fn_offerta_righe_preview
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §7.5 e §7.7 (D-7, L16).
#
#   vendite.fn_documento_righe_preview ha due colonne in coda (20261031-41):
#   periodicita e generazione_canone. L'involucro le dichiara (RETURN QUERY
#   SELECT * dal corpo comune), quindi cambia il RETURNS TABLE: DROP + CREATE,
#   COMMENT riscritto per intero, col GRANT. Corpo invariato.
#   Corpo dal catalogo vivo di dbdev (2026-10-31, uguale all'ultimo YAML).
#   Ritorno indietro: DROP e il corpo di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261031-43-update-fn-offerta-righe-preview-periodicita-mctit.yaml

  - changeSet:
      id: 20261031-43-update-fn-offerta-righe-preview-periodicita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_offerta_righe_preview: periodicita e generazione_canone in coda, come vendite.fn_documento_righe_preview (D-7). Brief: brief-db-contratto-righe-periodiche-in-commessa §7.5.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_offerta_righe_preview(bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_offerta_righe_preview(
                  p_offerta_id vendite.offerte_commerciali.id%TYPE)
              RETURNS TABLE(
                  articolo_id           catalogo.articoli.id%TYPE,
                  articolo_codice       catalogo.articoli.codice%TYPE,
                  articolo_descrizione  catalogo.articoli.descrizione%TYPE,
                  is_composito          catalogo.articoli.is_composito%TYPE,
                  uom_id                catalogo.unita_misura.id%TYPE,
                  uom_codice            catalogo.unita_misura.codice%TYPE,
                  prezzo_listino        vendite.listini_righe.prezzo%TYPE,
                  tipo_variazione       vendite.offerte_commerciali.tipo_variazione_globale%TYPE,
                  valore_variazione     vendite.offerte_commerciali.valore_variazione_globale%TYPE,
                  override_riga_id      vendite.offerte_commerciali_eccezioni.id%TYPE,
                  override_prezzo       vendite.offerte_commerciali_eccezioni.prezzo_unitario%TYPE,
                  tipo_eccezione        vendite.offerte_commerciali_eccezioni.tipo_eccezione%TYPE,
                  origine               character varying,
                  prezzo_finale         numeric,
                  componenti            jsonb,
                  quantita              vendite.offerte_commerciali_eccezioni.quantita%TYPE,
                  qta_operativa         vendite.offerte_commerciali_eccezioni.qta_operativa%TYPE,
                  tipo_erogazione       vendite.offerte_commerciali_eccezioni.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.offerte_commerciali_eccezioni.fonte_quantita_attesa%TYPE,
                  riga_key              text,
                  azioni                text[],
                  escludi_blocco_codice text,
                  ordine                vendite.offerte_commerciali_eccezioni.ordine%TYPE,
                  uom_operativa_id      vendite.offerte_commerciali_eccezioni.uom_operativa_id%TYPE,
                  -- rev 2026-10-31 (20261031-43, D-7): in coda, come il corpo comune.
                  periodicita           vendite.offerte_commerciali_eccezioni.periodicita%TYPE,
                  generazione_canone    vendite.offerte_commerciali_eccezioni.generazione_canone%TYPE)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$

              -- Scopo: le righe del drawer dell'offerta, coi verbi che il DB
              --   ammette, come quelle del contratto (stesse colonne, stessi verbi).
              --   Corpo comune: vendite.fn_documento_righe_preview.
              -- Nasce il 2026-10-04 (brief-db-righe-esclusione-solo-non-si-vende, R4).
              BEGIN
                  RETURN QUERY
                  SELECT *
                    FROM vendite.fn_documento_righe_preview('OFFERTA_COMMERCIALE', p_offerta_id);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_offerta_righe_preview(bigint) IS
                'Le righe di un''offerta come le vede il drawer: righe della versione operativa del listino con l''overlay OVERRIDE/ESCLUSIONE, piu'' le AGGIUNTA standalone e bundle; riga_key, azioni (DA_LISTINO -> SOVRASCRIVI_PREZZO, ESCLUDI; OVERRIDE -> MODIFICA, RIPRISTINA_LISTINO; ESCLUSIONE -> RIPRISTINA_ARTICOLO; AGGIUNTA -> MODIFICA, RIMUOVI) ed escludi_blocco_codice. Stesse 24 colonne di vendite.fn_contratto_righe_preview: involucro di vendite.fn_documento_righe_preview(''OFFERTA'', id). Il drawer rende i verbi del DB e non li deduce. Non e'' vendite.fn_offerta_righe_espanse (righe ordine-ready, esclusioni tolte). Nasce il 2026-10-04, brief-db-righe-esclusione-solo-non-si-vende (R4). ⭐ rev 2026-10-19 (20261019-26, brief-db-grammatica-unica-documenti lotto 1, G-1 di Tid): il documento si nomina col codice della sorgente, CONTRATTO | OFFERTA_COMMERCIALE (era OFFERTA); dove sopra si legge OFFERTA come selettore, oggi e'' OFFERTA_COMMERCIALE. ⭐ rev 2026-10-31 (20261031-43, brief-db-contratto-righe-periodiche-in-commessa D-7): 26 colonne, periodicita e generazione_canone in coda come il corpo comune.';
              GRANT EXECUTE ON FUNCTION vendite.fn_offerta_righe_preview(bigint) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
