                  prezzo_listino        vendite.listini_righe.prezzo%TYPE,
                  tipo_variazione       vendite.offerte_commerciali.tipo_variazione_globale%TYPE,
                  valore_variazione     vendite.offerte_commerciali.valore_variazione_globale%TYPE,
                  override_riga_id      vendite.offerte_commerciali_eccezioni.id%TYPE,
                  override_prezzo       vendite.offerte_commerciali_eccezioni.prezzo_unitario%TYPE,
                  tipo_eccezione        vendite.offerte_commerciali_eccezioni.tipo_eccezione%TYPE,
                  origine               character varying,
                  prezzo_finale         numeric,
                  componenti            jsonb,
                  quantita              vendite.offerte_commerciali_eccezioni.quantita%TYPE,
                  qta_operativa         vendite.offerte_commerciali_eccezioni.qta_operativa%TYPE,
                  tipo_erogazione       vendite.offerte_commerciali_eccezioni.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.offerte_commerciali_eccezioni.fonte_quantita_attesa%TYPE,
                  riga_key              text,
                  azioni                text[],
                  escludi_blocco_codice text,
                  ordine                vendite.offerte_commerciali_eccezioni.ordine%TYPE,
                  uom_operativa_id      vendite.offerte_commerciali_eccezioni.uom_operativa_id%TYPE)
              LANGUAGE plpgsql
              STABLE
