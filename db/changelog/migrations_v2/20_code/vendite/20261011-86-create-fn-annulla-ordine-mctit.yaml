# IL VERBO: ANNULLARE UN ORDINE CHE PORTA LEGAMI, CON CONFERMA
#   vendite.fn_annulla_ordine(p_ordine_id, p_legami_confermati) -> integer
#   Brief: brief-db-annullo-documento-con-legami (§7, casi 2, 4 e 5; D-1, D-2, D-4)
#
# ── I LEGAMI DI UN ORDINE ───────────────────────────────────────────
#   * le righe nate da un preventivo (preventivo_riga_id): CONSUMO, si
#     staccano e il preventivo EVASO torna ACCETTATO (D-2);
#   * l'offerta d'origine: PROVENIENZA, resta, e l'offerta torna
#     trasformabile perche' l'unicita' vale sui vivi (D-6);
#   * le righe di commessa NON_EMESSA spinte dall'ordine: CONSUMO, si
#     ritirano col registro (D-5).
#   L'UPDATE diretto dello stato (backend) li incontra nel guard
#   trg_ordini_m10_guard_annullo_con_legami_upd: E_DOC_ANNULLO_CON_LEGAMI,
#   l'avviso. Alla conferma il backend chiama questo verbo.
#
# ── COSA FA, IN ORDINE ──────────────────────────────────────────────
#   1. guard di parametro; 2. testata FOR UPDATE nel perimetro (fuori:
#   E_ORD_NOT_FOUND); 3. conferma e ritiro dal BB
#   vendite.fn_documento_ritira_legami, che apre la porta; 4. lo stato ad
#   ANNULLATO con un UPDATE, come fa il backend: i guard della tabella
#   applicano matrice, freni (DDT vivi, righe di commessa EMESSA) e avviso;
#   5. porta chiusa. UNA transazione: se un freno rifiuta, i legami tornano.
#   SECURITY DEFINER con search_path bloccato: la porta vuole il
#   proprietario. EXECUTE solo all'app; il permesso di annullare lo
#   verifica il backend, come per l'UPDATE diretto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261011-86-create-fn-annulla-ordine-mctit.yaml

  - changeSet:
      id: 20261011-86-create-fn-annulla-ordine
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Verbo vendite.fn_annulla_ordine: annulla un ordine con conferma; se porta legami (righe di preventivo, offerta d'origine, righe di commessa NON_EMESSA), chi
        conferma dichiara quanti ne ha visti, i consumi si ritirano (BB vendite.fn_documento_ritira_legami)
        e poi lo stato passa ad ANNULLATO. SECURITY DEFINER.
        Brief: brief-db-annullo-documento-con-legami (D-1, D-4).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_documento_ritira_legami';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_annulla_ordine';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_annulla_ordine(
                  p_ordine_id                 vendite.ordini.id%TYPE,
                  p_legami_confermati  integer DEFAULT NULL)
              RETURNS integer
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare un ordine. Con legami: conferma e ritiro
              --   dal BB vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ordine',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ordine_id', p_ordine_id),
                          NULL::uuid, 'vendite.fn_annulla_ordine',
                          'p_ordine_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.ordini t
                   WHERE t.id = p_ordine_id
                     AND script.fn_scope_ef_whitelist_via_ordine(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ordine',
                          'E_ORD_NOT_FOUND', jsonb_build_object('id', p_ordine_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('ORDINE', p_ordine_id, p_legami_confermati);

                  -- 4. Lo stato. I guard della tabella fanno il resto: matrice,
                  --    freni (righe di commessa EMESSA, figli vivi), avviso.
                  UPDATE vendite.ordini o
                     SET stato_doc_ordine_id = (SELECT s.id FROM config.stati_doc_ordini s
                                                 WHERE s.codice_interno = 'ANNULLATO')
                   WHERE o.id = p_ordine_id;

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_annulla_ordine(vendite.ordini.id%TYPE, integer) IS
                  'VERBO (2026-10-11, brief-db-annullo-documento-con-legami D-1/D-4): annulla un ordine. Testata FOR UPDATE nel perimetro (script.fn_scope_ef_whitelist_via_ordine; fuori perimetro E_ORD_NOT_FOUND). Conferma e ritiro dal BB vendite.fn_documento_ritira_legami: chi conferma DICHIARA quanti legami ha visto (p_legami_confermati, le righe di vendite.fn_documento_legami(''ORDINE'', id): righe di preventivo, offerta d''origine, righe di commessa NON_EMESSA); se non corrisponde, E_DOC_ANNULLO_CON_LEGAMI. Poi lo stato passa ad ANNULLATO (i guard della tabella applicano matrice e freni) e la porta del ritiro si chiude. UNA transazione. Senza legami non c''e'' niente da confermare. Ritorna i legami confermati. SECURITY DEFINER con search_path bloccato: la porta del ritiro vuole il proprietario. EXECUTE solo all''app.';

              REVOKE EXECUTE ON FUNCTION vendite.fn_annulla_ordine(vendite.ordini.id%TYPE, integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION vendite.fn_annulla_ordine(vendite.ordini.id%TYPE, integer) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_annulla_ordine(bigint, integer);
