              COMMENT ON VIEW vendite.vw_dash_fatturazione_ddt
              IS 'Resolver DDT per la dashboard fatturazione (brief-db-fatturazione-ddt-resi §4a, step 6), sesta area di vw_dash_fatturazione_documenti: stesse 19 colonne dei gemelli. POPOLAZIONE = solo DDT con ruolo di fatturazione — fuori quelli di ordini con trigger CONFERMATO (fattura l''ordine: XOR; evita falso positivo PUSH_NON_ESEGUITO perpetuo e doppio conteggio del valore) e fuori le causali non fatturabili (solo trasporto, DL-28). Stesso discriminatore del lister, letto per la stessa strada (fulfillment). motivo_fermo TRIGGER-AWARE: DOC_BOZZA in DRAFT, IN_TRANSITO prima dello stato-trigger (viaggio in corso, non ritardo), PUSH_NON_ESEGUITO / PUSH_PARZIALE dal trigger in poi; soglia = rank del trigger, SPEDITO per lo standalone. Valore per riga con COALESCE(ddt_righe.prezzo_unitario, ordini_righe via fulfillment) — vw_ddt_righe_iva_base NON riusabile (filtra prezzo NOT NULL). data_riferimento = ddt.data (DL-17). fase/is_abortito dal catalogo. security_invoker=on + RLS. rev 2026-07-18. Rev 2026-10-20 (20261020-68, brief-db-grammatica-unica-documenti 2d e 2e): l''area DDT diventa DDT_VENDITA, il codice della sorgente; la chiave della riga la compone script.fn_segment_key.';
