# LE ANNOTAZIONI DI LEGGE DI UNA FATTURA, COME LISTA
#   vendite.fn_annotazioni_fattura(p_fattura_id)
#     RETURNS TABLE(codice text, testo text, ordine integer)
#   Brief: brief-db-esigibilita-iva-per-cassa-emittente, sezione 11 (R-DB-3, AN-1)
#
# -- IL CONTRATTO --------------------------------------------------
#   Una riga per ogni annotazione che il documento deve stampare, in ordine
#   di stampa. Nessuna annotazione = nessuna riga (mai una riga a NULL). Il
#   builder della fattura (forma 4 del contesto) la copia in `annotazioni`
#   come lista di {codice, testo}, e il template la stampa sotto i totali.
#   ⭐ Le voci future (scissione dei pagamenti, inversione contabile, bollo
#   virtuale...) sono righe nuove di questa funzione: nessuna forma nuova del
#   contesto, nessuna versione nuova del template.
#
# -- OGGI UNA VOCE: ESIGIBILITA_DIFFERITA --------------------------
#   Esce se il regime DELLA FATTURA e' per cassa (iva_per_cassa) e almeno una
#   riga e' a esigibilita' D (sezione 8.7: un RF17 verso un privato e' tutto
#   immediato, e li' l'annotazione sarebbe falsa). Testo:
#   config.regimi_fiscali.annotazione_documento, che per un regime per cassa
#   c'e' sempre (CHECK del -02).
#   ⭐ «Il regime della fattura» e' vendite.fn_regime_fiscale_fattura (-05),
#   lo stesso con cui le righe sono state calcolate: una fattura senza
#   snapshot ha righe D col regime vivo, e qui si legge il vivo.
#   ⭐ La condizione chiede ANCHE iva_per_cassa, non solo il testo: la voce e'
#   quella dell'IVA per cassa. Un regime con una dicitura sua che non dipende
#   dalle righe (il forfettario) avra' una voce sua, con la sua condizione.
#
# -- DOVE SI DISCOSTA DAL BRIEF ------------------------------------
#   * VOLATILE, non STABLE: ha il guard di parametro, che solleva e scrive il
#     log degli errori. E' il punto d'ingresso del backend; un id rotto qui e'
#     un chiamante rotto, e una lista vuota lo nasconderebbe (a una fattura
#     senza annotazioni manca una dicitura obbligatoria senza un errore).
#   * Fattura inesistente o fuori dal perimetro di chi legge: nessuna riga.
#     Il builder ha appena letto la stessa fattura con lo stesso contesto.
#
# -- I TIPI DEL RISULTATO ------------------------------------------
#   testo e' ancorato a annotazione_documento. codice e ordine NON hanno una
#   colonna di cui siano il riflesso: il codice e' il vocabolario delle voci
#   di questa funzione (text), l'ordine la posizione di stampa (integer).
#
# INVOKER, plpgsql. Sotto RLS le righe di una fattura che chi legge non vede
#   non contano.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261002-07-create-fn-annotazioni-fattura-mctit.yaml

  - changeSet:
      id: 20261002-07-create-fn-annotazioni-fattura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_annotazioni_fattura: le annotazioni di legge che la fattura deve stampare,
        una riga per voce, in ordine. Oggi ESIGIBILITA_DIFFERITA: regime della fattura per
        cassa e almeno una riga a esigibilita' D, testo da config.regimi_fiscali. La legge il
        builder della fattura (forma 4, template v6). Brief:
        brief-db-esigibilita-iva-per-cassa-emittente sezione 11 (R-DB-3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_regime_fiscale_fattura';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annotazioni_fattura(
                  p_fattura_id  vendite.fatture.id%TYPE
              )
              RETURNS TABLE(
                  codice  text,     -- il vocabolario delle voci di questa funzione: nessuna colonna
                  testo   config.regimi_fiscali.annotazione_documento%TYPE,
                  ordine  integer   -- la posizione di stampa: nessuna colonna
              )
              LANGUAGE plpgsql
              VOLATILE
              SECURITY INVOKER
              AS $function$
              -- Scopo: le annotazioni di legge che la fattura p_fattura_id deve
              --   stampare, una riga per voce, nell'ordine di stampa. Nessuna
              --   voce = nessuna riga.
              DECLARE
                  v_regime  anagrafiche.emittenti_fiscali.regime_fiscale_rf%TYPE;
              BEGIN
                  -- Guard di parametro: un id nullo o non positivo lo produce solo
                  -- un chiamante rotto (TECNICO).
                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_annotazioni_fattura', 'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id),
                          NULL::uuid,
                          'vendite.fn_annotazioni_fattura',
                          'p_fattura_id obbligatorio e maggiore di zero');
                  END IF;

                  v_regime := vendite.fn_regime_fiscale_fattura(p_fattura_id);

                  RETURN QUERY
                  SELECT v.codice, v.testo, v.ordine
                    FROM (
                          -- ESIGIBILITA_DIFFERITA: regime per cassa e almeno una
                          -- riga differita (sezione 8.7 del brief).
                          SELECT 'ESIGIBILITA_DIFFERITA'::text AS codice,
                                 rf.annotazione_documento     AS testo,
                                 10                           AS ordine
                            FROM config.regimi_fiscali rf
                           WHERE rf.codice_interno = v_regime
                             AND rf.iva_per_cassa
                             AND EXISTS (SELECT 1
                                           FROM vendite.fatture_righe r
                                          WHERE r.fattura_id = p_fattura_id
                                            AND r.esigibilita = 'D')
                         ) v
                   ORDER BY v.ordine, v.codice;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_annotazioni_fattura(vendite.fatture.id%TYPE) IS
                  'Le annotazioni di legge che una fattura deve stampare: una riga (codice, testo, '
                  'ordine) per voce, nell''ordine di stampa; nessuna voce = nessuna riga. Oggi una '
                  'voce, ESIGIBILITA_DIFFERITA: il regime della fattura '
                  '(vendite.fn_regime_fiscale_fattura, lo stesso delle righe) e'' per cassa e almeno '
                  'una riga e'' a esigibilita'' D; testo da config.regimi_fiscali.annotazione_documento. '
                  'Le voci future sono righe nuove di questa funzione, senza forma nuova del contesto '
                  'ne'' versione nuova del template. La legge il builder della fattura (forma 4). '
                  'Solleva E_VENDITE_CHIAMATA_NON_VALIDA su un id nullo o non positivo. Brief: '
                  'brief-db-esigibilita-iva-per-cassa-emittente (R-DB-3, AN-1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_annotazioni_fattura(vendite.fatture.id%TYPE);
