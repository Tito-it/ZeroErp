# LA COMMESSA APERTA DI UN DOCUMENTO, SULLE COLONNE DEL MODELLO
#   vendite.fn_commessa_viva_di_sorgente(p_sorgente_tipo_id, p_sorgente_id, p_sorgente_uid)
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.2 (S-4).
#
# ── ⭐ CHE COSA CAMBIA ───────────────────────────────────────────────
#   Il secondo parametro era la chiave CANONICA testuale di commesse_sorgenti. Dal
#   20261107-59 la chiave sta in sorgente_id o in sorgente_uid: la funzione prende
#   le due colonne del modello e cerca con la regola d'incontro
#   (sorgente_id = p_sorgente_id OR sorgente_uid = p_sorgente_uid). Chi ha il
#   documento in mano passa il suo id e il suo uid, senza leggere il key_selector;
#   chi ha la chiave del modello passa quella, e NULL nell'altra.
#   La firma cambia tipo al secondo parametro: DROP della vecchia + CREATE (non
#   un overload). Chiamanti DB riscritti nello stesso giro (la porta del link,
#   20261107-62; il guard della fatturazione immediata, -63). Il backend
#   (CommesseRepository.get_commessa_viva_by_sorgente) passa la chiave testuale:
#   richiesta nel brief, §8.10.
#   Predicato «aperta», ordine e LIMIT dal corpo vivo (= 20261012-44).
#   Rollback: forward-only, come 20261107-59 (la chiave testuale non c'e' piu').
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261107-61-update-fn-commessa-viva-di-sorgente-colonne-tipizzate-mctit.yaml

  - changeSet:
      id: 20261107-61-update-fn-commessa-viva-di-sorgente-colonne-tipizzate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_commessa_viva_di_sorgente: la chiave del documento sulle due colonne del
        modello (sorgente_id, sorgente_uid) con la regola d'incontro, al posto della chiave
        testuale. brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.2.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_commessa_viva_di_sorgente(bigint, text);

              CREATE FUNCTION vendite.fn_commessa_viva_di_sorgente(
                  p_sorgente_tipo_id vendite.commesse_sorgenti.sorgente_tipo_id%TYPE,
                  p_sorgente_id      vendite.commesse_sorgenti.sorgente_id%TYPE,
                  p_sorgente_uid     vendite.commesse_sorgenti.sorgente_uid%TYPE)
              RETURNS vendite.commesse_sorgenti.commessa_id%TYPE
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- Aperta = lo stato non chiude la commessa: lo stesso predicato
                  -- del riuso in vendite.fn_get_or_create_commessa.
                  -- La regola d'incontro del modello: la colonna che il key_selector
                  -- del tipo non usa e' NULL, quindi passare tutte e due le chiavi del
                  -- documento trova il link senza leggere il key_selector.
                  SELECT cs.commessa_id
                    FROM vendite.commesse_sorgenti cs
                    JOIN vendite.commesse c        ON c.id  = cs.commessa_id
                    JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id
                   WHERE cs.sorgente_tipo_id = p_sorgente_tipo_id
                     AND (cs.sorgente_id = p_sorgente_id OR cs.sorgente_uid = p_sorgente_uid)
                     AND sc.chiude_commessa  = false
                   ORDER BY cs.commessa_id DESC
                   LIMIT 1
              $function$;

              COMMENT ON FUNCTION vendite.fn_commessa_viva_di_sorgente(vendite.commesse_sorgenti.sorgente_tipo_id%TYPE, vendite.commesse_sorgenti.sorgente_id%TYPE, vendite.commesse_sorgenti.sorgente_uid%TYPE) IS
                  'Building block: la commessa APERTA in cui sta un documento, o NULL. Aperta = vendite.stati_commessa.chiude_commessa = false, lo stesso predicato con cui vendite.fn_get_or_create_commessa riusa una commessa: una commessa che il push non riusa non trattiene il documento. Il link documento -> commessa resta come storia dopo la chiusura e l''annullo, quindi un documento puo'' avere piu'' link: questa funzione dice quale conta. Il documento si passa con le colonne del modello (tipo, sorgente_id, sorgente_uid) e si cerca con la regola d''incontro (sorgente_id = p_sorgente_id OR sorgente_uid = p_sorgente_uid): chi ha il documento passa il suo id e il suo uid, chi ha la chiave del modello passa quella e NULL nell''altra. Lettori: vendite.fn_link_commessa_sorgente (un secondo invio e'' rifiutato solo se il documento sta in un''altra commessa aperta), vendite.trgfn_guard_fatturazione_immediata_immutabile (il flag si blocca solo con una commessa aperta), il backend. SECURITY INVOKER: le policy di commesse e commesse_sorgenti filtrano per emittente e una commessa ha l''emittente del documento (vendite.trgfn_commesse_sorgenti_guard_emittente), quindi chi vede il documento vede tutte le sue commesse. ORDER BY + LIMIT 1: la porta ne garantisce al piu'' una aperta; l''ordine rende la risposta deterministica. CHIUSA e ANNULLATA sono terminali nella matrice: se un giorno non lo fossero, la riapertura andrebbe controllata.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only, come 20261107-59: la chiave testuale non c'e' piu'.
              DROP FUNCTION IF EXISTS vendite.fn_commessa_viva_di_sorgente(bigint, bigint, uuid);
