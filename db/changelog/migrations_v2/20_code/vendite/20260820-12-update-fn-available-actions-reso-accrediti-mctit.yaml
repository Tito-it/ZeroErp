# «Annulla reso» resta ACCESO ma si disabilita col motivo, se c'e' un accredito
#   (segnalazione BE del 2026-08-20 · brief nota di credito §43)
#
# ── LA DECISIONE DEL §38.6 CAMBIA, E LA RAGIONE E' UNA REGOLA DI CASA ───
#
#   Il §38.6 aveva deciso: «il bottone annulla del reso resta acceso, il rimedio
#   e' dell'operatore e il messaggio glielo dice». Il BE ha obiettato citando
#   `frontend-standards.md`:
#
#     «**Permesso ⇒ nascondi, stato ⇒ disabilita col motivo.** Il permesso non e'
#      qualcosa che l'operatore possa risolvere dal kebab, quindi una voce grigia
#      sarebbe una promessa che non si mantiene; cio' che invece dipende dallo
#      STATO del record puo' cambiare, e li' `disabled` + `tooltip` spiega e
#      resta a video.»
#
#   Avere un accredito registrato **e' uno stato che cambia** — si disfa
#   l'accredito e l'annullo torna possibile. Quindi il bottone non va nascosto e
#   non va lasciato acceso: va **disabilitato col motivo**.
#
#   ⭐ La decisione precedente non era sbagliata sul dominio, era **ignorante di
#   una regola che vive nel documento di un altro lato**. E' il motivo per cui
#   questo giro aggiunge anche il §12 a `linee-guida-sql.md`: la regola dev'essere
#   raggiungibile da chi scrive SQL, non solo da chi scrive Vue.
#
# ── ⭐ NON SERVE UN FLAG DI TESTATA: IL MECCANISMO C'E' GIA' ────────────
#
#   Il BE chiedeva «un flag di testata del tipo `ha_accrediti`». Non serve, ed e'
#   una buona notizia: `script.fn_available_actions_reso` emette gia', **per ogni
#   azione**, la terna `enabled` / `reason` / `reason_key` — oggi valorizzata da
#   `meta.requires_righe`, e il FE la rende gia' come pulsante grigio + tooltip
#   (il commento nel corpo lo dice: «la barra azioni deve comparire proprio per
#   mostrare il pulsante grigio + tooltip»).
#
#   Un flag di testata sarebbe stato **peggio**, non solo in piu':
#     · spegne il documento, non l'azione — e le altre transizioni non c'entrano;
#     · vuole cablaggio FE nuovo, mentre `reason_key` e' gia' letto;
#     · e' un dato senza consumatore se un domani l'azione cambia nome.
#
#   Modello esatto: `fn_available_actions_ddt`, che dal 2026-07-19 disabilita la
#   sola transizione `EMESSO` con un motivo suo (`v_emit_reason`), calcolato da
#   `fn_check_ddt_emittibile`, e lascia abilitate le altre.
#
# ── PRECEDENZA FRA DUE MOTIVI, DICHIARATA ───────────────────────────────
#
#   Un'azione puo' essere disabilitata da piu' precondizioni. L'ordine e':
#   **il motivo SPECIFICO batte il generico**.
#     1. `ANNULLATO` + accrediti   -> RESO_CON_ACCREDITI
#     2. `requires_righe` + vuoto  -> DOCUMENTO_SENZA_RIGHE
#
#   ⚠️ Oggi non si incontrano — le due transizioni `annulla` non dichiarano
#   `requires_righe`, e un reso con accrediti ha per forza righe — ma un ordine
#   non scritto e' un ordine che il prossimo cambia senza accorgersene.
#
# ── DUE VERIFICHE FATTE PRIMA, NON DOPO ─────────────────────────────────
#
#   * ⭐ `vendite.resi_righe_accrediti` **non ha RLS** (verificato:
#     `relrowsecurity = false`, come `resi_righe`). La funzione e' SECURITY
#     INVOKER, quindi contava saperlo: se il ponte avesse avuto la RLS, chi non
#     lo vede avrebbe letto «nessun accredito» e si sarebbe trovato il bottone
#     acceso e il 409 in faccia — il difetto che il §42 chiama «credito senza
#     documento», in versione UI.
#   * Il predicato e' lo **stesso EXISTS** della guardia `fn_annulla_reso`
#     (E_RESO_ANNULLO_CON_ACCREDITO, 933): la capability e il guard devono dire
#     la stessa cosa, o il bottone e' grigio quando l'annullo passerebbe — o
#     peggio il contrario.
#
# ── 🔴 SERVE UNA CHIAVE i18n NUOVA ──────────────────────────────────────
#
#   `vendite.reso.annulla_reason.con_accrediti`, in `it.json` **e** `en.json`.
#   ⚠️ Senza, `scripts/check_i18n_keys.py` diventa **rosso** appena la doc
#   auto-gen viene rigenerata: il suo controllo 4 cerca le `reason_key` emesse
#   dalle funzioni e assenti dai locales. E a video il tooltip resterebbe vuoto,
#   cioe' un pulsante grigio che non dice perche' — la variante peggiore.
#
# Dipendenze: vendite.resi_righe_accrediti; config.transizioni_stati_reso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260820-12-update-fn-available-actions-reso-accrediti-mctit.yaml

  - changeSet:
      id: 20260820-12-update-fn-available-actions-reso-accrediti
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_reso: la transizione ad ANNULLATO si disabilita col
        motivo quando il reso ha un accredito registrato (RESO_CON_ACCREDITI +
        reason_key). Applica la regola di frontend-standards «permesso => nascondi,
        stato => disabilita col motivo»: avere un accredito e' uno stato che
        cambia, quindi il bottone resta a video e spiega. Nessun flag di testata:
        la terna enabled/reason/reason_key esisteva gia' per azione. Cambia la
        decisione del §38.6. Segnalazione BE del 2026-08-20.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'script' AND p.proname = 'fn_available_actions_reso'
            - tableExists:
                schemaName: vendite
                tableName: resi_righe_accrediti
            # ⛔ 2026-09-02 — RIMOSSA la preCondition su config.stati_doc_reso (codice_interno = 'ANNULLATO').
            #    `20_code` gira PRIMA di `80_data`: su un database ricostruito da zero
            #    — cioe' in CI — la riga cercata NON esiste ancora, e il migrate muore
            #    con «SQL Precondition failed. Expected '1' got '0'». Non e' un caso di
            #    bordo: e' l'UNICO modo in cui un seed nuovo puo' arrivare.
            #    E' il changeSet su cui la CI si e' fermata il 2026-09-02. Il CASE risolve
            #    'ANNULLATO' quando la funzione viene CHIAMATA, non quando viene creata.
            #    ⛔ Regola: docs/it/linee-guida-sql.md §11.4. Restano legittime le
            #    preCondition su cio' che viene PRIMA (tableExists, columnExists,
            #    pg_proc, arita'); quelle sul CONTENUTO di 80_data no.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_reso(p_reso_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: capability reso per il detail API (data-driven,
              --   config.transizioni_stati_reso). Mirror ridotto di
              --   fn_available_actions_ddt (no push_commessa, no pdf).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-08-06: + target_state_descrizione, la forma leggibile
              --   dello stato di destinazione. Serve alla frase di conferma
              --   «portare il documento nello stato X»: il codice_interno non e'
              --   quella forma (DRAFT -> Bozza) e tradurlo nel FE sarebbe una
              --   seconda copia del vocabolario degli stati.
              --   rev 2026-08-11: + stato_info_key, la nota che spiega cosa sta
              --   succedendo quando il documento e' in uno stato chiuso. Arriva dal
              --   `meta` dello stato, e viene emessa SEMPRE che lo stato la dichiari —
              --   anche accanto a un'azione ancora abilitata: la nota spiega lo STATO,
              --   non risponde a una barra vuota (decisione §5 di Tid, gia' applicata a
              --   preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era
              --   fra i cinque che non emettevano affatto il campo, mentre il drawer lo
              --   legge gia': il cablaggio c'era ed era inerte.
              --   ⭐ rev 2026-08-20: la transizione ad ANNULLATO si DISABILITA COL
              --   MOTIVO quando il reso ha un accredito registrato. Applica la regola
              --   di frontend-standards — «permesso => nascondi, STATO => disabilita
              --   col motivo» — ora scritta anche per il DB in linee-guida-sql §12:
              --   avere un accredito e' uno stato che CAMBIA (si disfa l'accredito e
              --   l'annullo torna possibile), quindi il bottone resta a video e
              --   spiega. Cambia la decisione del §38.6 del brief nota di credito, che
              --   lo lasciava acceso e muto.
              --   ⭐ Nessun flag di testata `ha_accrediti`: la terna
              --   enabled/reason/reason_key esiste gia' PER AZIONE, e un flag di
              --   documento spegnerebbe anche le transizioni che non c'entrano.
              --   Modello: fn_available_actions_ddt, che disabilita la sola
              --   transizione EMESSO con un motivo suo.
              --   ⚠️ Il predicato e' lo STESSO EXISTS della guardia di
              --   vendite.fn_annulla_reso (E_RESO_ANNULLO_CON_ACCREDITO, 933): se i
              --   due divergono, il bottone e' grigio quando l'annullo passerebbe — o
              --   peggio il contrario.
              --   ⚠️ La PROPRIETA' nel meta si chiama `nessuna_azione_key` mentre il
              --   campo del blob si chiama `stato_info_key`. L'asimmetria e' voluta:
              --   scripts/check_i18n_keys.py trova le chiavi seminate per QUEL nome
              --   (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e rinominarla senza toccare
              --   il guard lo renderebbe verde per cecita'.
              --   ⚠️ Il campo e' SEMPRE presente nel blob, col valore a null quando non
              --   si applica: filtrare per presenza risponde vero per tutti i documenti,
              --   va guardato il valore.
              --   brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3;
              --   brief-design-note-credito-resi §43.
              DECLARE
                  v_stato_id   vendite.resi.stato_doc_reso_id%TYPE;
                  v_stato_cod  config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_info_key text;
                  v_actions    jsonb;
                  v_can_change boolean := false;
                  v_ha_righe   boolean := false;
                  v_ha_accrediti boolean := false;
                  c_non_edit_draft CONSTANT jsonb :=
                      '["numero","sorgente_tipo_id","sorgente_uid","billing_account_id","emittente_fiscale_id"]'::jsonb;
                  c_non_edit_tutti CONSTANT jsonb :=
                      '["numero","sorgente_tipo_id","sorgente_uid","billing_account_id","emittente_fiscale_id",'
                      '"destinatario_soggetto_ruolo_id","valuta_id","utility_id","data","meta"]'::jsonb;
              BEGIN
                  SELECT r.stato_doc_reso_id, sdr.codice_interno,
                         sdr.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_stato_info_key
                    FROM vendite.resi r
                    JOIN config.stati_doc_reso sdr ON sdr.id = r.stato_doc_reso_id
                   WHERE r.id = p_reso_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard di fn_conferma_reso
                  -- (E_RESO_SENZA_RIGHE): riga attiva.
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.resi_righe rr
                       WHERE rr.reso_id = p_reso_id
                         AND rr.attivo IS TRUE
                  );

                  -- ⭐ Precondizione "nessun accredito registrato" per la
                  -- transizione ad ANNULLATO. STESSO PREDICATO della guardia in
                  -- vendite.fn_annulla_reso: l'ESISTENZA di una riga di ponte, non
                  -- lo stato delle rettifiche — se l'accredito e' ormai troppo
                  -- tardi per essere disfatto lo dice la sua madre con
                  -- E_ACCREDITO_ANNULLO_NON_AMMESSO, e ricalcolarlo qui sarebbe
                  -- una seconda copia della stessa regola.
                  -- ⚠️ vendite.resi_righe_accrediti NON ha RLS (verificato
                  -- 2026-08-20): questa lettura vede tutto il ponte anche da
                  -- SECURITY INVOKER. Se un domani la RLS ci arrivasse, chi non
                  -- vedesse il ponte leggerebbe «nessun accredito» e si
                  -- troverebbe il bottone acceso e il 409 in faccia: allora
                  -- servirebbe una SECURITY DEFINER, non un COALESCE.
                  v_ha_accrediti := EXISTS (
                      SELECT 1
                        FROM vendite.resi_righe_accrediti rra
                        JOIN vendite.resi_righe rr ON rr.id = rra.resi_riga_id
                       WHERE rr.reso_id = p_reso_id
                  );

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              -- ⚠️ PRECEDENZA DICHIARATA fra due motivi: il
                              -- SPECIFICO batte il generico. Oggi non si
                              -- incontrano (le transizioni `annulla` non
                              -- dichiarano requires_righe, e un reso con
                              -- accrediti ha per forza righe), ma un ordine non
                              -- scritto e' un ordine che il prossimo cambia
                              -- senza accorgersene.
                              --   1. ANNULLATO + accrediti  -> RESO_CON_ACCREDITI
                              --   2. requires_righe + vuoto -> DOCUMENTO_SENZA_RIGHE
                              -- ⚠️ Il match e' su `codice_interno`, la colonna
                              -- IMMUTABILE: su `codice` si romperebbe al primo
                              -- rename fatto dall'utente, e in silenzio.
                              'enabled',          NOT (
                                                      (COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                       AND NOT v_ha_righe)
                                                   OR (sa.codice_interno = 'ANNULLATO' AND v_ha_accrediti)
                                                  ),
                              'reason',           CASE
                                                    WHEN sa.codice_interno = 'ANNULLATO' AND v_ha_accrediti
                                                         THEN 'RESO_CON_ACCREDITI'
                                                    WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                         AND NOT v_ha_righe
                                                         THEN 'DOCUMENTO_SENZA_RIGHE'
                                                  END,
                              'reason_key',       CASE
                                                    WHEN sa.codice_interno = 'ANNULLATO' AND v_ha_accrediti
                                                         THEN 'vendite.reso.annulla_reason.con_accrediti'
                                                    WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                         AND NOT v_ha_righe
                                                         THEN 'common.azione_reason.senza_righe'
                                                  END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.transizioni_stati_reso t
                  JOIN config.stati_doc_reso sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Conta anche le azioni disabilitate: la barra azioni deve
                  -- comparire proprio per mostrare il pulsante grigio + tooltip.
                  v_can_change := jsonb_array_length(v_actions) > 0;

                  RETURN jsonb_build_object(
                      'available_actions',   v_actions,
                      'can_change_state',    v_can_change,
                      'can_edit_testata',    (v_stato_cod = 'DRAFT'),
                      'can_edit_righe',      (v_stato_cod = 'DRAFT'),
                      'non_editable_fields', CASE WHEN v_stato_cod = 'DRAFT'
                                                  THEN c_non_edit_draft
                                                  ELSE c_non_edit_tutti END,
                      'stato_info_key',      v_stato_info_key,
                      'stato_codice',        v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_reso(p_reso_id bigint)
              IS 'Capability reso per detail API: available_actions (matrice transizioni_stati_reso, filtro manuale) + can_change_state + can_edit_* + non_editable_fields + stato_codice. Mirror ridotto di fn_available_actions_ddt (no push/pdf). rev 2026-07-16: ogni azione espone enabled/reason/reason_key; se la transizione ha meta.requires_righe e il reso non ha righe attive -> enabled=false + reason DOCUMENTO_SENZA_RIGHE (predicato specchiato dal guard E_RESO_SENZA_RIGHE). rev 2026-08-06: + target_state_descrizione accanto a target_state. rev 2026-08-11: + stato_info_key, la nota di stato letta dal meta dello stato corrente ed emessa SEMPRE che lo stato la dichiari. ⭐ rev 2026-08-20 (segnalazione BE): la transizione ad ANNULLATO si DISABILITA COL MOTIVO quando il reso ha un accredito registrato -> enabled=false, reason RESO_CON_ACCREDITI, reason_key vendite.reso.annulla_reason.con_accrediti. Applica la regola di frontend-standards, ora scritta anche per il DB in linee-guida-sql §12: «permesso => nascondi, STATO => disabilita col motivo». Avere un accredito e'' uno stato che CAMBIA — si disfa l''accredito e l''annullo torna possibile — quindi il bottone non va nascosto ne'' lasciato acceso e muto: resta a video e spiega. Cambia la decisione del §38.6 del brief nota di credito. ⭐ NIENTE flag di testata `ha_accrediti`, che il BE aveva chiesto: la terna enabled/reason/reason_key esiste gia'' PER AZIONE ed e'' gia'' letta dal FE, mentre un flag di documento spegnerebbe anche le transizioni che non c''entrano e vorrebbe cablaggio nuovo. Modello: fn_available_actions_ddt, che disabilita la sola transizione EMESSO con un motivo suo. ⚠️ Il predicato e'' lo STESSO EXISTS della guardia di vendite.fn_annulla_reso (933): capability e guard devono dire la stessa cosa, o il bottone e'' grigio quando l''annullo passerebbe — o peggio il contrario. ⚠️ vendite.resi_righe_accrediti NON ha RLS (verificato): se un domani ce l''avesse, chi non vede il ponte leggerebbe «nessun accredito» e si troverebbe il bottone acceso e il 409 in faccia, e servirebbe una SECURITY DEFINER. ⚠️ PRECEDENZA fra motivi dichiarata nel corpo: lo SPECIFICO (accrediti) batte il generico (senza righe). ⚠️ La PROPRIETA'' nel meta resta nessuna_azione_key mentre il campo del blob si chiama stato_info_key. 🔴 Richiede la chiave i18n vendite.reso.annulla_reason.con_accrediti in it.json e en.json: senza, check_i18n_keys.py diventa rosso e il tooltip resta vuoto. brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3; brief-design-note-credito-resi §43.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Si ri-applica il changeSet 20260811-* che ne e' la sede
              -- precedente: qui non c'e' un oggetto da togliere, solo un corpo
              -- da riportare indietro.
              SELECT 1;
