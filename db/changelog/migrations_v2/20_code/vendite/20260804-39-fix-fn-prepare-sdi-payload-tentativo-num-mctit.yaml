# Bonifica riferimenti morti — F2, la funzione su percorso di produzione
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
# ── PERCHE' CONTA ────────────────────────────────────────────────────────
#   `prepare_sdi_payload_lotto` non e' un residuo: e' un task **attivo**
#   (`dbops.pipeline_task_registry` id 9) montato su **due pipeline attive**,
#   la MASSIVO (id 5) e la GIORNALIERO (id 7), entrambe con
#   `"force_new_tentativo": false`. Lato Django lo esegue
#   `apps/vendite/db/pipeline_repository.py::run_prepare_sdi_payload_lotto_task`.
#   Nessun pgTAP la copre: la copertura di questo passo vale zero.
#
# ── 🔴 DUE DIFETTI IN SERIE, E IL SECONDO SI VEDE SOLO DOPO IL PRIMO ─────
#   1) La colonna e' `tentativo_num`, non `tentativo`. Quattro occorrenze:
#      lista di INSERT, MAX(), conflict target, RETURNING.
#
#   2) ⚠️ Riparato il nome, la funzione **fallisce lo stesso**. Il calcolo era
#
#          COALESCE(MAX(tentativo), 0) + CASE WHEN p_force THEN 1 ELSE 0 END
#
#      e il ramo dell'INSERT si prende solo le fatture per cui una riga sdi
#      NON esiste (o tutte, se force). Quindi con `force = false` — che e'
#      la configurazione **in seed su entrambe le pipeline** — il MAX e'
#      sempre NULL e il conto da' **0**, contro
#      `chk_fatture_sdi_tentativo_num CHECK (tentativo_num > 0)`.
#      Si sarebbe sostituito «la colonna non esiste» con «viola il CHECK».
#
#      Il brief classificava questa riga come una rinomina di colonna. Non
#      lo e': e' una rinomina **piu'** un difetto di calcolo che la prima
#      teneva coperto. E' il motivo per cui la bonifica va ri-misurata dopo
#      ogni passo invece di essere eseguita come lista.
#
#      La forma corretta e' `MAX + 1` **sempre**, e regge entrambi i casi
#      proprio grazie al filtro sull'INSERT:
#        force = false -> inserisce solo dove non c'e' nulla -> MAX NULL -> 1
#        force = true  -> MAX + 1, il tentativo successivo
#
# ── ALTRE DUE RIFINITURE ─────────────────────────────────────────────────
#   · `ON CONFLICT ON CONSTRAINT uq_fatture_sdi_fattura_tentativo` al posto
#     della lista di colonne: `fattura_id` e `tentativo_num` sono anche nomi
#     di parametri OUT della funzione, e un conflict target che ripete un
#     nome di variabile plpgsql e' un'ambiguita' che non vale la pena
#     correre. Il vincolo esiste ed e' esattamente quello.
#   · Via `data_update = now()` dalla DO UPDATE: la tiene
#     `trg_fatture_sdi_audit_data_user_upd`. Scriverla anche qui e' logica
#     duplicata fra livelli.
#
#   Firma invariata -> basta `CREATE OR REPLACE`, niente DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260804-39-fix-fn-prepare-sdi-payload-tentativo-num-mctit.yaml

  - changeSet:
      id: 20260804-39-fix-fn-prepare-sdi-payload-tentativo-num
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F2 — vendite.fn_prepare_sdi_payload: colonna tentativo -> tentativo_num e
        numerazione MAX+1 sempre (con force=false, che e' il seed attivo delle
        pipeline 5 e 7, il vecchio calcolo dava 0 e violava chk_fatture_sdi_tentativo_num).
        Conflict target sul nome del vincolo, via il data_update manuale.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_prepare_sdi_payload(
                  p_lotto_id                 bigint,
                  p_stato_sdi_codice_interno character varying DEFAULT 'DA_INVIARE',
                  p_force_new_tentativo      boolean DEFAULT false
              )
              RETURNS TABLE (
                  fattura_sdi_id              bigint,
                  fattura_id                  bigint,
                  tentativo_num               smallint,
                  stato_sdi_id                bigint,
                  codice_documento            text,
                  numero_fattura              bigint,
                  data_fattura                date,
                  billing_account_id          bigint,
                  emittente_soggetto_ruolo_id bigint,
                  valuta_id                   integer,
                  totale_a_pagare             numeric
              )
              LANGUAGE plpgsql
              AS $function$
              -- rev 2026-08-04 (D-M): via il predicato su lf.esclusa, che era
              --   una condizione sempre vera (flag dormiente).
              -- rev 2026-08-04 (bonifica riferimenti morti, F2):
              --   `tentativo` -> `tentativo_num` (nome reale della colonna) e
              --   numerazione a MAX+1 sempre: il vecchio
              --   `MAX + CASE WHEN force THEN 1 ELSE 0 END` produceva 0 al
              --   primo tentativo con force=false — cioe' nella
              --   configurazione in seed — e violava
              --   chk_fatture_sdi_tentativo_num (> 0).
              DECLARE
                  v_stato_sdi_id config.stati_sdi.id%TYPE;
                  v_exists_lotto BOOLEAN := FALSE;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_prepare_sdi_payload', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  IF p_stato_sdi_codice_interno IS NULL OR btrim(p_stato_sdi_codice_interno) = '' THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_prepare_sdi_payload', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_stato_sdi_codice_interno', 'valore', p_stato_sdi_codice_interno), NULL::uuid, 'p_stato_sdi_codice_interno obbligatorio');
                  END IF;

                  SELECT EXISTS (SELECT 1 FROM vendite.fatturazione_lotti fl WHERE fl.id = p_lotto_id) INTO v_exists_lotto;

                  IF NOT COALESCE(v_exists_lotto, FALSE) THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_prepare_sdi_payload', 'E_VALORE_MANCANTE',
                          jsonb_build_object('lotto_id', p_lotto_id), NULL::uuid, concat('lotto_id ', p_lotto_id));
                  END IF;

                  SELECT s.id INTO v_stato_sdi_id
                    FROM config.stati_sdi s
                   WHERE s.codice_interno = p_stato_sdi_codice_interno AND s.attivo IS TRUE
                   ORDER BY s.ordine NULLS LAST, s.id LIMIT 1;

                  IF v_stato_sdi_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_prepare_sdi_payload', 'E_CODICE',
                          jsonb_build_object('codice_interno', p_stato_sdi_codice_interno), NULL::uuid, p_stato_sdi_codice_interno, 'config.stati_sdi');
                  END IF;

                  -- Upsert fatture_sdi + RETURN QUERY
                  RETURN QUERY
                  WITH target_fatture AS (
                      -- rev 2026-07-28: si porta dietro anche totale_a_pagare,
                      -- letto qui dalla testata invece che ricostruito a valle.
                      SELECT f.id AS f_id, f.numero, f.data, f.billing_account_id,
                             f.emittente_soggetto_ruolo_id, f.valuta_id,
                             f.totale_a_pagare,
                             COALESCE(f.anno::text, '') || COALESCE(f.serie, '') || COALESCE(f.numero::text, '') AS codice_doc
                        FROM vendite.fatturazione_lotti_fatture lf
                        JOIN vendite.fatture f ON f.id = lf.fattura_id
                       WHERE lf.lotto_id = p_lotto_id
                  ), upserted AS (
                      INSERT INTO vendite.fatture_sdi (fattura_id, tentativo_num, stato_sdi_id, meta)
                      SELECT tf.f_id,
                             -- ⚠️ MAX + 1 SEMPRE. Il filtro sotto garantisce che
                             --    con force = false si inserisca solo dove non
                             --    esiste nulla (MAX NULL -> 1); con force = true
                             --    e' il tentativo successivo. Il vecchio
                             --    `+ CASE WHEN force THEN 1 ELSE 0 END` dava 0
                             --    nel primo caso e violava il CHECK > 0.
                             (COALESCE((SELECT MAX(fs2.tentativo_num)
                                          FROM vendite.fatture_sdi fs2
                                         WHERE fs2.fattura_id = tf.f_id), 0) + 1)::smallint,
                             v_stato_sdi_id, '{}'::jsonb
                        FROM target_fatture tf
                       WHERE p_force_new_tentativo IS TRUE
                          OR NOT EXISTS (SELECT 1 FROM vendite.fatture_sdi fs3 WHERE fs3.fattura_id = tf.f_id)
                      -- ⚠️ Conflict target sul NOME del vincolo: `fattura_id` e
                      --    `tentativo_num` sono anche parametri OUT di questa
                      --    funzione, e ripeterli come lista di colonne li
                      --    espone alla risoluzione come variabili plpgsql.
                      --    data_update la scrive trg_fatture_sdi_audit_data_user_upd.
                      ON CONFLICT ON CONSTRAINT uq_fatture_sdi_fattura_tentativo
                        DO UPDATE SET stato_sdi_id = v_stato_sdi_id
                      RETURNING vendite.fatture_sdi.id            AS fs_id,
                                vendite.fatture_sdi.fattura_id    AS fs_fattura_id,
                                vendite.fatture_sdi.tentativo_num AS fs_tentativo,
                                vendite.fatture_sdi.stato_sdi_id  AS fs_stato_sdi_id
                  )
                  SELECT u.fs_id, u.fs_fattura_id, u.fs_tentativo, u.fs_stato_sdi_id,
                         tf.codice_doc, tf.numero, tf.data, tf.billing_account_id,
                         tf.emittente_soggetto_ruolo_id, tf.valuta_id,
                         -- rev 2026-07-28: era SUM(ri.totale_riga) su
                         -- vendite.fatture_riepiloghi_iva, colonna INESISTENTE
                         -- (errore latente: plpgsql pianifica alla prima
                         -- esecuzione). Il totale dovuto e' quello che
                         -- fn_ricalcola_totali_fattura ha gia' calcolato,
                         -- fondi e arrotondamento inclusi.
                         COALESCE(tf.totale_a_pagare, 0)
                    FROM upserted u
                    JOIN target_fatture tf ON tf.f_id = u.fs_fattura_id;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_prepare_sdi_payload(bigint, character varying, boolean) IS
              'Prepara/aggiorna le righe vendite.fatture_sdi del lotto e ne restituisce il payload. Tentativo numerato MAX+1 (>= 1, come da chk_fatture_sdi_tentativo_num). Task pipeline prepare_sdi_payload_lotto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
