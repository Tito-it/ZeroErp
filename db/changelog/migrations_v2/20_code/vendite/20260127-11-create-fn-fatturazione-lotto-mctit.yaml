databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260127-11-create-fn-fatturazione-lotto-mctit.yaml

  - changeSet:
      id: 20260127-11-create-fn-fatturazione-lotto
      author: mctit
      comment: "Funzioni di creazione/recupero lotto fatturazione"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_create_fatturazione_lotto(
                p_competenza_mese vendite.fatturazione_lotti.competenza_mese%TYPE,
                p_utility_id config.utilities.id%TYPE DEFAULT NULL,
                p_registro_id vendite.registri_fatturazione.id%TYPE DEFAULT NULL,
                p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                p_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE DEFAULT NULL,
                p_meta jsonb DEFAULT NULL
              )
              RETURNS vendite.fatturazione_lotti.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_competenza vendite.fatturazione_lotti.competenza_mese%TYPE;
                v_utility_id config.utilities.id%TYPE;
                v_registro_id vendite.registri_fatturazione.id%TYPE;
                v_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE;
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_stato_doc_id config.stati_doc_fiscale.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Crea un lotto di fatturazione con parametri coerenti
                --   (competenza, utility, registro, BA) e stato iniziale.
                --
                -- Regole:
                --   - competenza_mese normalizzata al primo del mese
                --   - utility_id derivata da BA se presente
                --   - registro_id risolto da utility se non passato
                --   - stato_doc_fiscale iniziale = DRAFT (applica_lotto)
                -- =========================================================

                IF p_competenza_mese IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','competenza_mese obbligatoria'),
                    NULL::uuid, 'competenza_mese obbligatoria'
                  );
                END IF;

                v_competenza := date_trunc('month', p_competenza_mese)::date;

                v_utility_id := p_utility_id;
                IF p_billing_account_id IS NOT NULL THEN
                  SELECT ba.utility_id
                    INTO v_utility_id
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = p_billing_account_id;

                  IF v_utility_id IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                      jsonb_build_object(
                        'detail','Utility non risolta da billing_account',
                        'billing_account_id', p_billing_account_id
                      ),
                      NULL::uuid,
                      concat('Utility non risolta da billing_account',
                          ' billing_account_id: ', p_billing_account_id::text
                      )
                    );
                  END IF;

                  IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                      jsonb_build_object(
                        'detail','Utility non coerente con billing_account',
                        'billing_account_id', p_billing_account_id,
                        'utility_id', p_utility_id
                      ),
                      NULL::uuid, 
                      concat('Utility non coerente con billing_account',
                          ' billing_account_id: ', p_billing_account_id::text,
                          ' utility_id: ', p_utility_id::text
                      )
                    );
                  END IF;
                END IF;

                IF v_utility_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','utility_id obbligatoria'),
                    NULL::uuid, 
                    'utility_id obbligatoria'
                  );
                END IF;

                v_registro_id := p_registro_id;
                IF v_registro_id IS NULL THEN
                  SELECT u.registro_id
                    INTO v_registro_id
                    FROM config.utilities u
                   WHERE u.id = v_utility_id;
                END IF;

                IF v_registro_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object(
                      'detail','Registro non risolto (utility)',
                      'utility_id', v_utility_id
                    ),
                    NULL::uuid, 
                    concat('Registro non risolto (utility)',
                        ' utility_id: ', v_utility_id::text
                    )
                  );
                END IF;

                SELECT id
                  INTO v_stato_doc_id
                  FROM config.stati_doc_fiscale
                 WHERE codice = 'DRAFT'
                   AND applica_lotto IS TRUE
                   AND attivo IS TRUE
                 ORDER BY ordine
                 LIMIT 1;

                IF v_stato_doc_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_create_fatturazione_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','Stato DRAFT non disponibile per lotto'),
                    NULL::uuid, 'Stato DRAFT non disponibile per lotto'
                  );
                END IF;

                v_lock_batch_id := COALESCE(p_lock_batch_id, uuidv7());

                INSERT INTO vendite.fatturazione_lotti (
                  lock_batch_id,
                  competenza_mese,
                  utility_id,
                  registro_id,
                  billing_account_id,
                  stato_doc_fiscale_id,
                  meta
                )
                VALUES (
                  v_lock_batch_id,
                  v_competenza,
                  v_utility_id,
                  v_registro_id,
                  p_billing_account_id,
                  v_stato_doc_id,
                  COALESCE(p_meta, '{}'::jsonb)
                )
                RETURNING id
                  INTO v_lotto_id;

                RETURN v_lotto_id;
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_create_fatturazione_lotto(
                vendite.fatturazione_lotti.competenza_mese%TYPE,
                config.utilities.id%TYPE,
                vendite.registri_fatturazione.id%TYPE,
                anagrafiche.billing_account.id%TYPE,
                vendite.fatturazione_lotti.lock_batch_id%TYPE,
                jsonb
              )
              IS 'Crea lotto fatturazione con parametri coerenti e stato iniziale DRAFT.';


              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_lotto(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE DEFAULT NULL,
                p_competenza_mese vendite.fatturazione_lotti.competenza_mese%TYPE DEFAULT NULL,
                p_utility_id config.utilities.id%TYPE DEFAULT NULL,
                p_registro_id vendite.registri_fatturazione.id%TYPE DEFAULT NULL,
                p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                p_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE DEFAULT NULL,
                p_meta jsonb DEFAULT NULL
              )
              RETURNS vendite.fatturazione_lotti.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_competenza vendite.fatturazione_lotti.competenza_mese%TYPE;
                v_utility_id config.utilities.id%TYPE;
                v_registro_id vendite.registri_fatturazione.id%TYPE;
                v_billing_account_id anagrafiche.billing_account.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recupera un lotto esistente o lo crea se assente.
                --
                -- Regole:
                --   - se p_lotto_id presente, valida coerenza parametri
                --   - se p_lock_batch_id presente, riusa lotto se esistente
                -- =========================================================

                IF p_lotto_id IS NOT NULL THEN
                  SELECT competenza_mese, utility_id, registro_id, billing_account_id
                    INTO v_competenza, v_utility_id, v_registro_id, v_billing_account_id
                    FROM vendite.fatturazione_lotti
                   WHERE id = p_lotto_id;

                  IF v_competenza IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Lotto non trovato', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Lotto non trovato', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_competenza_mese IS NOT NULL
                    AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Competenza non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Competenza non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Utility non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Utility non coerente', ' lotto_id: ', p_lotto_id::text) 
                    );
                  END IF;

                  IF p_registro_id IS NOT NULL AND p_registro_id <> v_registro_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Registro non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Registro non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Billing account non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Billing account non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  RETURN p_lotto_id;
                END IF;

                IF p_lock_batch_id IS NOT NULL THEN
                  SELECT id
                    INTO v_lotto_id
                    FROM vendite.fatturazione_lotti
                   WHERE lock_batch_id = p_lock_batch_id;

                  IF v_lotto_id IS NOT NULL THEN
                    RETURN v_lotto_id;
                  END IF;
                END IF;

                RETURN vendite.fn_create_fatturazione_lotto(
                  p_competenza_mese,
                  p_utility_id,
                  p_registro_id,
                  p_billing_account_id,
                  p_lock_batch_id,
                  p_meta
                );
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_lotto(
                vendite.fatturazione_lotti.id%TYPE,
                vendite.fatturazione_lotti.competenza_mese%TYPE,
                config.utilities.id%TYPE,
                vendite.registri_fatturazione.id%TYPE,
                anagrafiche.billing_account.id%TYPE,
                vendite.fatturazione_lotti.lock_batch_id%TYPE,
                jsonb
              )
              IS 'Recupera lotto esistente o lo crea se assente (supporto ricalcolo).';
