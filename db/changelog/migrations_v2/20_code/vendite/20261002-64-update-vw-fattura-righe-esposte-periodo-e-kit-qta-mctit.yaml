# PARTE B — LA RIGA DEL KIT DICE LA QUANTITA' E LA UOM DEL KIT, PER PERIODO
#   vendite.vw_fattura_righe_esposte
#   Brief: brief-db-bom-flag-quantita-e-kit-in-fattura, parte B (D-3, D-3.1,
#   sezione 4.2)
#
#   Forma viva di 20261001-46 (identica alla doc auto-gen), con tre cambi:
#   · quantita' e UoM della riga del kit da kit_qta / kit_uom_id (20261002-63),
#     non piu' avg(qta) / max(uom_id) dei componenti. La quantita' si legge
#     COMPONENTE PER COMPONENTE (righe dello stesso componente sommate) e vale
#     se tutti dicono lo stesso numero di kit; se no NULL, senza rifiutare:
#     una nota di credito parziale (si rende una vite della sedia) e' un caso
#     legittimo e il kit li' non ha una quantita'. Per questo NON c'e' un guard
#     al posto di R10 (scelta fatta scrivendo, dichiarata nel brief);
#   · il kit si separa per PERIODO (competenza_dal, competenza_al): lo stesso
#     kit su due mesi sono due righe, come per gli articoli normali (D-3);
#   · in coda competenza_dal, competenza_al, ha_periodo (dal <> al): la regola
#     unica del periodo da stampare (D-3.1), su ogni riga.
#   CREATE OR REPLACE: le colonne di prima restano, con lo stesso nome e tipo,
#   e vw_fattura_righe_lista (unico dipendente) non va droppata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261002-64-update-vw-fattura-righe-esposte-periodo-e-kit-qta-mctit.yaml

  - changeSet:
      id: 20261002-64-update-vw-fattura-righe-esposte-periodo-e-kit-qta
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vw_fattura_righe_esposte: quantita' e UoM della riga del kit da kit_qta / kit_uom_id
        (la riga padre del documento), non piu' media e max dei componenti; il kit si separa
        per periodo; in coda competenza_dal, competenza_al e ha_periodo, la regola unica del
        periodo da stampare. Brief: brief-db-bom-flag-quantita-e-kit-in-fattura (D-3, D-3.1).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatture_righe
                columnName: kit_qta
            - columnExists:
                schemaName: vendite
                tableName: fatture_righe
                columnName: competenza_dal
            - viewExists:
                schemaName: vendite
                viewName: vw_fattura_righe_esposte
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_fattura_righe_esposte
              WITH (security_invoker=on) AS
              WITH kit_componente AS NOT MATERIALIZED (
                       -- Un kit in un periodo, COMPONENTE PER COMPONENTE: le righe dello
                       -- stesso componente (la generazione le separa anche per prezzo) si
                       -- sommano, cosi' ogni componente dice quanti kit rappresenta. Un
                       -- articolo sta una volta sola nella distinta alla data
                       -- (uq_articoli_componenti_no_overlap).
                       SELECT r.fattura_id,
                          r.kit_key,
                          r.iva_id,
                          r.dest_billing_account_id,
                          r.kit_articolo_padre_id,
                          r.kit_descrizione_padre,
                          r.competenza_dal,
                          r.competenza_al,
                          r.articolo_id,
                          min(r.riga_nr) AS riga_nr_min,
                          sum(r.kit_qta) AS kit_qta,
                          min(r.kit_uom_id) AS kit_uom_min,
                          max(r.kit_uom_id) AS kit_uom_max,
                          -- Il RESTO: cio' che non ha una riga con importo. NULL, non
                          -- zero, se il componente e' valorizzato.
                          sum(r.imponibile_riga) FILTER (WHERE r.kit_esposizione <> 'VALORIZZATO')
                              AS imponibile_resto,
                          max((r.iva_natura)::text) AS iva_natura
                         FROM vendite.fatture_righe r
                        WHERE (r.kit_key IS NOT NULL)
                        GROUP BY r.fattura_id, r.kit_key, r.iva_id, r.dest_billing_account_id,
                                 r.kit_articolo_padre_id, r.kit_descrizione_padre,
                                 r.competenza_dal, r.competenza_al, r.articolo_id
                      ), kit AS NOT MATERIALIZED (
                       SELECT c.fattura_id,
                          c.kit_key,
                          c.iva_id,
                          c.dest_billing_account_id,
                          c.kit_articolo_padre_id AS articolo_padre_id,
                          c.kit_descrizione_padre AS descrizione_padre,
                          c.competenza_dal,
                          c.competenza_al,
                          min(c.riga_nr_min) AS riga_nr_padre,
                          -- ⭐ Quantita' e UoM sono quelle della RIGA PADRE del documento,
                          -- congelate sui componenti (kit_qta, kit_uom_id): non si ricavano
                          -- piu' dai componenti (rev 2026-10-02). Valgono se TUTTI i
                          -- componenti dicono lo stesso numero di kit; altrimenti il kit
                          -- non ha una quantita' (una nota di credito parziale: si rende un
                          -- componente solo) e la riga la porta NULL. Non si rifiuta: e'
                          -- un caso legittimo.
                          CASE WHEN min(c.kit_uom_min) = max(c.kit_uom_max)
                               THEN max(c.kit_uom_max) END AS uom_id,
                          CASE WHEN min(c.kit_qta) = max(c.kit_qta)
                               THEN max(c.kit_qta) END AS qta,
                          -- Somma dei resti: NULL se tutti i componenti sono valorizzati
                          -- (la riga d'intestazione di E-2, kit senza resto).
                          sum(c.imponibile_resto) AS imponibile_totale,
                          max(c.iva_natura) AS iva_natura
                         FROM kit_componente c
                        GROUP BY c.fattura_id, c.kit_key, c.iva_id, c.dest_billing_account_id,
                                 c.kit_articolo_padre_id, c.kit_descrizione_padre,
                                 c.competenza_dal, c.competenza_al
                      )
               SELECT r.fattura_id,
                      CASE
                          WHEN (r.riga_capofila_id IS NOT NULL) THEN 'PARTE_PLAFOND'::text
                          ELSE 'NORMALE'::text
                      END AS tipo_riga,
                  r.riga_nr,
                  COALESCE(cap.riga_nr, r.riga_nr) AS ordinamento,
                  (0)::smallint AS livello,
                  r.id AS fatture_righe_id,
                  r.articolo_id,
                  r.descrizione,
                  r.uom_id,
                  r.qta,
                  r.prezzo_unitario,
                  r.sconto_percentuale,
                  r.iva_id,
                  r.iva_natura,
                  r.imponibile_riga AS imponibile,
                  r.dest_billing_account_id,
                  NULL::text AS kit_key,
                  r.riga_capofila_id,
                  NULL::character varying AS esposizione,
                  NULL::integer AS kit_riga_nr,
                  -- ── in coda dal 2026-10-02: il periodo, e se c'e' ────────────
                  r.competenza_dal,
                  r.competenza_al,
                  (r.competenza_dal <> r.competenza_al) AS ha_periodo
                 FROM (vendite.fatture_righe r
                   LEFT JOIN vendite.fatture_righe cap ON ((cap.id = r.riga_capofila_id)))
                WHERE (r.kit_key IS NULL)
              UNION ALL
               SELECT k.fattura_id,
                  'KIT_PADRE'::text AS tipo_riga,
                  k.riga_nr_padre AS riga_nr,
                  k.riga_nr_padre AS ordinamento,
                  (0)::smallint AS livello,
                  NULL::bigint AS fatture_righe_id,
                  k.articolo_padre_id AS articolo_id,
                  k.descrizione_padre AS descrizione,
                  k.uom_id,
                  k.qta,
                      CASE
                          WHEN (COALESCE(k.qta, (0)::numeric) = (0)::numeric) THEN NULL::numeric
                          ELSE (k.imponibile_totale / k.qta)
                      END AS prezzo_unitario,
                  NULL::numeric AS sconto_percentuale,
                  k.iva_id,
                  k.iva_natura,
                  k.imponibile_totale AS imponibile,
                  k.dest_billing_account_id,
                  k.kit_key,
                  NULL::bigint AS riga_capofila_id,
                  NULL::character varying AS esposizione,
                  k.riga_nr_padre AS kit_riga_nr,
                  k.competenza_dal,
                  k.competenza_al,
                  (k.competenza_dal <> k.competenza_al) AS ha_periodo
                 FROM kit k
              UNION ALL
               SELECT r.fattura_id,
                  'KIT_COMPONENTE'::text AS tipo_riga,
                  r.riga_nr,
                  k.riga_nr_padre AS ordinamento,
                  (1)::smallint AS livello,
                  r.id AS fatture_righe_id,
                  r.articolo_id,
                  r.descrizione,
                  r.uom_id,
                  r.qta,
                  -- Prezzo, sconto e importo SOLO sul valorizzato: il descrittivo
                  -- ha il suo valore nel padre, e mostrarlo due volte direbbe il
                  -- falso sul totale.
                  CASE WHEN (r.kit_esposizione = 'VALORIZZATO') THEN r.prezzo_unitario END
                      AS prezzo_unitario,
                  CASE WHEN (r.kit_esposizione = 'VALORIZZATO') THEN r.sconto_percentuale END
                      AS sconto_percentuale,
                  r.iva_id,
                  r.iva_natura,
                  CASE WHEN (r.kit_esposizione = 'VALORIZZATO') THEN r.imponibile_riga END
                      AS imponibile,
                  r.dest_billing_account_id,
                  r.kit_key,
                  r.riga_capofila_id,
                  r.kit_esposizione AS esposizione,
                  k.riga_nr_padre AS kit_riga_nr,
                  r.competenza_dal,
                  r.competenza_al,
                  (r.competenza_dal <> r.competenza_al) AS ha_periodo
                 FROM (vendite.fatture_righe r
                   JOIN kit k ON (((k.fattura_id = r.fattura_id) AND (k.kit_key = r.kit_key) AND (NOT (k.iva_id IS DISTINCT FROM r.iva_id)) AND (NOT (k.dest_billing_account_id IS DISTINCT FROM r.dest_billing_account_id)) AND (k.competenza_dal = r.competenza_dal) AND (k.competenza_al = r.competenza_al))))
                WHERE ((r.kit_key IS NOT NULL) AND (r.kit_esposizione <> 'NASCOSTO'));

              COMMENT ON VIEW vendite.vw_fattura_righe_esposte IS
                  'Rappresentazione del documento per OGNI uscita verso l''esterno: PDF, XML SDI, '
                  'portale. ⚠️ NON e'' «la vista di stampa»: se il PDF mostrasse il kit raggruppato e '
                  'l''XML trasmettesse i componenti avremmo due uscite dello stesso documento con '
                  'dettagli diversi. vendite.fatture_righe resta il DETTAGLIO (tutte le componenti, '
                  'con articolo/quantita''/prezzo propri), questa vista produce la SINTESI — nessun '
                  'secondo dato da tenere allineato. ⭐ rev 2026-10-01 '
                  '(brief-db-esposizione-componenti-kit-in-fattura): TRE MODI di esporre un '
                  'componente, da fatture_righe.kit_esposizione. NASCOSTO: non compare, il valore '
                  'sta nel padre. DESCRITTIVO: riga KIT_COMPONENTE senza prezzo ne'' importo (NULL), '
                  'il valore sta nel padre. VALORIZZATO: riga KIT_COMPONENTE con prezzo, sconto e '
                  'importo suoi, FUORI dal padre. Il padre (KIT_PADRE) porta la somma dei non '
                  'valorizzati; se non ce ne sono resta come intestazione con imponibile e prezzo '
                  'NULL, non zero (zero direbbe «omaggio»). Un componente resta SEMPRE legato al suo '
                  'kit: livello 1, stessa kit_key, ordinamento del padre, e kit_riga_nr = il riga_nr '
                  'del padre (il legame che il tracciato SDI, a linee piatte, dovra'' dichiarare). '
                  '⚠️ Quindi livello 1 NON significa piu'' «senza importo»: chi somma gli importi '
                  'somma tutte le righe con imponibile valorizzato. Il totale del documento non '
                  'cambia mai al variare dell''esposizione: ogni componente sta o nel padre o sulla '
                  'sua riga. Convenzioni: riga_nr = il primo dei componenti, prezzo unitario derivato '
                  'come totale/quantita''. La riga padre e'' costruita per (fattura, kit, IVA, BA '
                  'destinatario, PERIODO): un kit con aliquote diverse produce due righe padre, e '
                  'cosi'' lo stesso kit su due periodi, che e'' l''esito corretto. esposizione e '
                  'kit_riga_nr sono NULL sulle righe sciolte. ⭐ rev 2026-10-02 '
                  '(brief-db-bom-flag-quantita-e-kit-in-fattura): quantita'' e UoM del padre sono '
                  'quelle della RIGA PADRE del documento, congelate sui componenti '
                  '(fatture_righe.kit_qta, kit_uom_id), non piu'' MEDIA e MAX dei componenti (che '
                  'sbagliavano con coefficienti diversi da 1 e con kit di unita'' diverse). Valgono se '
                  'tutti i componenti dicono lo stesso numero di kit (sommati componente per '
                  'componente); altrimenti NULL — una nota di credito parziale, che non si rifiuta. In '
                  'coda competenza_dal, competenza_al e ha_periodo (dal <> al): la regola unica per '
                  'stampare il periodo, per PDF, SDI (DataInizioPeriodo/DataFinePeriodo) e portale; '
                  'una riga puntuale ha dal = al. ⭐ rev 2026-08-31 (decisione B, '
                  'brief-db-richieste-aperte-dal-backend voce 5): LA VISTA CONOSCE LA RIGA SPEZZATA '
                  'DAL PLAFOND. Quando il plafond di un titolo IVA copre solo una quota '
                  'dell''imponibile la riga di fattura si spezza in due — per OBBLIGO DI FORMATO, '
                  'perche'' una riga FatturaPA porta una sola AliquotaIVA e una sola Natura — e le due '
                  'parti escono qui come DUE RIGHE SORELLE: entrambe col loro imponibile, entrambe a '
                  'livello 0, stesso ordinamento (quello della capofila), e tipo_riga = PARTE_PLAFOND '
                  'sulla parte. riga_capofila_id e'' esposta perche'' chi consuma possa raggruppare '
                  'senza rifare il join. ⛔ NON SI E'' RIUSATA LA FORMA DEL KIT: quella AGGREGA, e '
                  'aggregare le due parti produrrebbe UN SOLO DettaglioLinee, cioe'' cancellerebbe la '
                  'ragione per cui la riga si e'' spezzata. ⚠️ riga_nr NON cambia: e'' il numero di '
                  'linea del documento. 📌 Limiti dichiarati: una riga che e'' insieme componente di kit '
                  'E parte di plafond cade nei rami del kit (oggi il backend non spezza i componenti '
                  'di kit); il padre condivide il riga_nr col primo componente esposto, che ora puo'' '
                  'portare un importo — la numerazione delle linee SDI e'' del builder. '
                  'brief-fix-importi-riga-fattura-zero §4.7-bis (D5).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- CREATE OR REPLACE non toglie colonne: si droppano le due viste (prima la
              -- dipendente) e si rimettono nelle forme di 20261001-46 e 20261001-47.
              DROP VIEW IF EXISTS vendite.vw_fattura_righe_lista;
              DROP VIEW IF EXISTS vendite.vw_fattura_righe_esposte;
              CREATE VIEW vendite.vw_fattura_righe_esposte
              WITH (security_invoker=on) AS
              WITH kit AS NOT MATERIALIZED (
                       SELECT r.fattura_id,
                          r.kit_key,
                          r.iva_id,
                          r.dest_billing_account_id,
                          r.kit_articolo_padre_id AS articolo_padre_id,
                          r.kit_descrizione_padre AS descrizione_padre,
                          min(r.riga_nr) AS riga_nr_padre,
                          max(r.uom_id) AS uom_id,
                          -- La quantita' del kit: su TUTTI i componenti, anche i
                          -- valorizzati (un kit senza resto ha la sua quantita').
                          avg(r.qta) AS qta_media,
                          -- Il RESTO: i componenti che non hanno una riga con importo.
                          -- Su un insieme vuoto (tutti valorizzati) e' NULL, non zero:
                          -- e' la riga d'intestazione di E-2.
                          sum(r.imponibile_riga) FILTER (WHERE r.kit_esposizione <> 'VALORIZZATO')
                              AS imponibile_totale,
                          max((r.iva_natura)::text) AS iva_natura
                         FROM vendite.fatture_righe r
                        WHERE (r.kit_key IS NOT NULL)
                        GROUP BY r.fattura_id, r.kit_key, r.iva_id, r.dest_billing_account_id, r.kit_articolo_padre_id, r.kit_descrizione_padre
                      )
               SELECT r.fattura_id,
                      CASE
                          WHEN (r.riga_capofila_id IS NOT NULL) THEN 'PARTE_PLAFOND'::text
                          ELSE 'NORMALE'::text
                      END AS tipo_riga,
                  r.riga_nr,
                  COALESCE(cap.riga_nr, r.riga_nr) AS ordinamento,
                  (0)::smallint AS livello,
                  r.id AS fatture_righe_id,
                  r.articolo_id,
                  r.descrizione,
                  r.uom_id,
                  r.qta,
                  r.prezzo_unitario,
                  r.sconto_percentuale,
                  r.iva_id,
                  r.iva_natura,
                  r.imponibile_riga AS imponibile,
                  r.dest_billing_account_id,
                  NULL::text AS kit_key,
                  r.riga_capofila_id,
                  NULL::character varying AS esposizione,
                  NULL::integer AS kit_riga_nr
                 FROM (vendite.fatture_righe r
                   LEFT JOIN vendite.fatture_righe cap ON ((cap.id = r.riga_capofila_id)))
                WHERE (r.kit_key IS NULL)
              UNION ALL
               SELECT k.fattura_id,
                  'KIT_PADRE'::text AS tipo_riga,
                  k.riga_nr_padre AS riga_nr,
                  k.riga_nr_padre AS ordinamento,
                  (0)::smallint AS livello,
                  NULL::bigint AS fatture_righe_id,
                  k.articolo_padre_id AS articolo_id,
                  k.descrizione_padre AS descrizione,
                  k.uom_id,
                  k.qta_media AS qta,
                      CASE
                          WHEN (COALESCE(k.qta_media, (0)::numeric) = (0)::numeric) THEN NULL::numeric
                          ELSE (k.imponibile_totale / k.qta_media)
                      END AS prezzo_unitario,
                  NULL::numeric AS sconto_percentuale,
                  k.iva_id,
                  k.iva_natura,
                  k.imponibile_totale AS imponibile,
                  k.dest_billing_account_id,
                  k.kit_key,
                  NULL::bigint AS riga_capofila_id,
                  NULL::character varying AS esposizione,
                  k.riga_nr_padre AS kit_riga_nr
                 FROM kit k
              UNION ALL
               SELECT r.fattura_id,
                  'KIT_COMPONENTE'::text AS tipo_riga,
                  r.riga_nr,
                  k.riga_nr_padre AS ordinamento,
                  (1)::smallint AS livello,
                  r.id AS fatture_righe_id,
                  r.articolo_id,
                  r.descrizione,
                  r.uom_id,
                  r.qta,
                  -- Prezzo, sconto e importo SOLO sul valorizzato: il descrittivo
                  -- ha il suo valore nel padre, e mostrarlo due volte direbbe il
                  -- falso sul totale.
                  CASE WHEN (r.kit_esposizione = 'VALORIZZATO') THEN r.prezzo_unitario END
                      AS prezzo_unitario,
                  CASE WHEN (r.kit_esposizione = 'VALORIZZATO') THEN r.sconto_percentuale END
                      AS sconto_percentuale,
                  r.iva_id,
                  r.iva_natura,
                  CASE WHEN (r.kit_esposizione = 'VALORIZZATO') THEN r.imponibile_riga END
                      AS imponibile,
                  r.dest_billing_account_id,
                  r.kit_key,
                  r.riga_capofila_id,
                  r.kit_esposizione AS esposizione,
                  k.riga_nr_padre AS kit_riga_nr
                 FROM (vendite.fatture_righe r
                   JOIN kit k ON (((k.fattura_id = r.fattura_id) AND (k.kit_key = r.kit_key) AND (NOT (k.iva_id IS DISTINCT FROM r.iva_id)) AND (NOT (k.dest_billing_account_id IS DISTINCT FROM r.dest_billing_account_id)))))
                WHERE ((r.kit_key IS NOT NULL) AND (r.kit_esposizione <> 'NASCOSTO'));

              COMMENT ON VIEW vendite.vw_fattura_righe_esposte IS
                  'Rappresentazione del documento per OGNI uscita verso l''esterno: PDF, XML SDI, '
                  'portale. ⚠️ NON e'' «la vista di stampa»: se il PDF mostrasse il kit raggruppato e '
                  'l''XML trasmettesse i componenti avremmo due uscite dello stesso documento con '
                  'dettagli diversi. vendite.fatture_righe resta il DETTAGLIO (tutte le componenti, '
                  'con articolo/quantita''/prezzo propri), questa vista produce la SINTESI — nessun '
                  'secondo dato da tenere allineato. ⭐ rev 2026-10-01 '
                  '(brief-db-esposizione-componenti-kit-in-fattura): TRE MODI di esporre un '
                  'componente, da fatture_righe.kit_esposizione. NASCOSTO: non compare, il valore '
                  'sta nel padre. DESCRITTIVO: riga KIT_COMPONENTE senza prezzo ne'' importo (NULL), '
                  'il valore sta nel padre. VALORIZZATO: riga KIT_COMPONENTE con prezzo, sconto e '
                  'importo suoi, FUORI dal padre. Il padre (KIT_PADRE) porta la somma dei non '
                  'valorizzati; se non ce ne sono resta come intestazione con imponibile e prezzo '
                  'NULL, non zero (zero direbbe «omaggio»). Un componente resta SEMPRE legato al suo '
                  'kit: livello 1, stessa kit_key, ordinamento del padre, e kit_riga_nr = il riga_nr '
                  'del padre (il legame che il tracciato SDI, a linee piatte, dovra'' dichiarare). '
                  '⚠️ Quindi livello 1 NON significa piu'' «senza importo»: chi somma gli importi '
                  'somma tutte le righe con imponibile valorizzato. Il totale del documento non '
                  'cambia mai al variare dell''esposizione: ogni componente sta o nel padre o sulla '
                  'sua riga. Convenzioni: quantita'' del padre = MEDIA di tutti i componenti, '
                  'valorizzati compresi (regge finche'' coeff_qta_snapshot vale 1), riga_nr = il primo '
                  'dei componenti, prezzo unitario derivato come totale/quantita''. La riga padre e'' '
                  'costruita per (fattura, kit, IVA, BA destinatario): un kit con aliquote diverse '
                  'produce due righe padre, che e'' l''esito corretto. esposizione e kit_riga_nr sono '
                  'NULL sulle righe sciolte. ⭐ rev 2026-08-31 (decisione B, '
                  'brief-db-richieste-aperte-dal-backend voce 5): LA VISTA CONOSCE LA RIGA SPEZZATA '
                  'DAL PLAFOND. Quando il plafond di un titolo IVA copre solo una quota '
                  'dell''imponibile la riga di fattura si spezza in due — per OBBLIGO DI FORMATO, '
                  'perche'' una riga FatturaPA porta una sola AliquotaIVA e una sola Natura — e le due '
                  'parti escono qui come DUE RIGHE SORELLE: entrambe col loro imponibile, entrambe a '
                  'livello 0, stesso ordinamento (quello della capofila), e tipo_riga = PARTE_PLAFOND '
                  'sulla parte. riga_capofila_id e'' esposta perche'' chi consuma possa raggruppare '
                  'senza rifare il join. ⛔ NON SI E'' RIUSATA LA FORMA DEL KIT: quella AGGREGA, e '
                  'aggregare le due parti produrrebbe UN SOLO DettaglioLinee, cioe'' cancellerebbe la '
                  'ragione per cui la riga si e'' spezzata. ⚠️ riga_nr NON cambia: e'' il numero di '
                  'linea del documento. 📌 Limiti dichiarati: una riga che e'' insieme componente di kit '
                  'E parte di plafond cade nei rami del kit (oggi il backend non spezza i componenti '
                  'di kit); il padre condivide il riga_nr col primo componente esposto, che ora puo'' '
                  'portare un importo — la numerazione delle linee SDI e'' del builder. '
                  'brief-fix-importi-riga-fattura-zero §4.7-bis (D5).';
              CREATE VIEW vendite.vw_fattura_righe_lista
              WITH (security_invoker=true) AS
              SELECT x.riga_key,
                  x.fattura_id,
                  x.tipo_riga,
                  x.riga_nr,
                  x.ordinamento,
                  x.fatture_righe_id,
                  x.articolo_id,
                  x.articolo_codice,
                  x.articolo_descrizione,
                  x.descrizione,
                  x.uom_id,
                  x.uom_codice,
                  x.qta AS quantita,
                  x.prezzo_unitario,
                  x.sconto_percentuale,
                  x.iva_id,
                  x.iva_codice,
                  x.iva_descrizione,
                  x.iva_aliquota,
                  x.iva_natura,
                  x.imponibile AS importo_riga,
                  x.dest_billing_account_id,
                  x.riga_capofila_id,
                  fr.riga_rettificata_id,
                  orig.riga_nr AS riga_rettificata_nr,
                  forig.id AS riga_rettificata_fattura_id,
                  vendite.fn_numero_documento_fattura(forig.numero, forig.serie) AS riga_rettificata_documento,
                  x.componenti,
                  x.componenti_numero
                 FROM (((( SELECT e.fattura_id,
                          e.tipo_riga,
                          e.riga_nr,
                          e.ordinamento,
                          e.livello,
                          e.fatture_righe_id,
                          e.articolo_id,
                          a.codice AS articolo_codice,
                          a.descrizione AS articolo_descrizione,
                          e.descrizione,
                          e.uom_id,
                          um.codice AS uom_codice,
                          e.qta,
                          e.prezzo_unitario,
                          e.sconto_percentuale,
                          e.iva_id,
                          iva.codice AS iva_codice,
                          iva.descrizione AS iva_descrizione,
                          iva.aliquota_iva AS iva_aliquota,
                          e.iva_natura,
                          e.imponibile,
                          e.dest_billing_account_id,
                          e.riga_capofila_id,
                              CASE
                                  WHEN (e.fatture_righe_id IS NOT NULL) THEN ('R:'::text || (e.fatture_righe_id)::text)
                                  ELSE ((('K:'::text || (e.fattura_id)::text) || ':'::text) || md5(concat_ws('|'::text, e.kit_key, e.iva_id, e.dest_billing_account_id, e.articolo_id, e.descrizione)))
                              END AS riga_key,
                          -- rev 2026-10-01: + esposizione, prezzo, sconto, importo. Sono
                          -- quelli della vista madre: NULL sul DESCRITTIVO, valorizzati sul
                          -- VALORIZZATO.
                          jsonb_agg(jsonb_build_object(
                              'fatture_righe_id', e.fatture_righe_id,
                              'riga_nr', e.riga_nr,
                              'articolo_id', e.articolo_id,
                              'articolo_codice', a.codice,
                              'descrizione', e.descrizione,
                              'quantita', e.qta,
                              'uom_codice', um.codice,
                              'esposizione', e.esposizione,
                              'prezzo_unitario', e.prezzo_unitario,
                              'sconto_percentuale', e.sconto_percentuale,
                              'importo_riga', e.imponibile)) FILTER (WHERE (e.livello = 1)) OVER kit AS componenti,
                          (count(*) FILTER (WHERE (e.livello = 1)) OVER kit)::integer AS componenti_numero
                         FROM (((vendite.vw_fattura_righe_esposte e
                           LEFT JOIN catalogo.articoli a ON ((a.id = e.articolo_id)))
                           LEFT JOIN catalogo.unita_misura um ON ((um.id = e.uom_id)))
                           LEFT JOIN config.iva iva ON ((iva.id = e.iva_id)))
                        WINDOW kit AS (PARTITION BY e.fattura_id, e.kit_key, e.iva_id, e.dest_billing_account_id ORDER BY e.riga_nr, e.fatture_righe_id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)) x
                   LEFT JOIN vendite.fatture_righe fr ON ((fr.id = x.fatture_righe_id)))
                   LEFT JOIN vendite.fatture_righe orig ON ((orig.id = fr.riga_rettificata_id)))
                   LEFT JOIN vendite.fatture forig ON ((forig.id = orig.fattura_id)))
                WHERE (x.livello = 0);

              COMMENT ON VIEW vendite.vw_fattura_righe_lista IS
                  'Le righe di una fattura come LISTA (brief-db-liste-righe-documento, D-8.3, 2026-09-28): '
                  'SOLO il primo livello di vw_fattura_righe_esposte (NORMALE, PARTE_PLAFOND, KIT_PADRE), '
                  'cosi'' ordinamento e paginazione lavorano sulle righe del documento e un kit si muove '
                  'intero. riga_key identifica ogni riga: R:<id> per le righe vere, K:<fattura>:<md5> per '
                  'il padre di un kit (che non ha PK), costruita sulla stessa tupla con cui la vista madre '
                  'lo compone. I componenti ESPOSTI stanno nel padre (componenti jsonb, componenti_numero). '
                  '⭐ rev 2026-10-01 (brief-db-esposizione-componenti-kit-in-fattura): ogni componente '
                  'porta esposizione (DESCRITTIVO | VALORIZZATO), prezzo_unitario, sconto_percentuale e '
                  'importo_riga, valorizzati solo sul VALORIZZATO. ⚠️ Quindi importo_riga della lista NON '
                  'somma al totale del documento: l''importo dei valorizzati sta dentro componenti, e il '
                  'padre di un kit senza resto ha importo_riga NULL. E'' voluto: il componente resta '
                  'legato al kit. Il totale si legge dalla testata. Nessun calcolo rifatto: la '
                  'rappresentazione resta di vw_fattura_righe_esposte. Il numero della fattura rettificata '
                  'e'' quello parlante (fn_numero_documento_fattura). Nessun ORDER BY: l''ordine del '
                  'documento e'' ordinamento, riga_nr, riga_key. security_invoker: fatture_righe e'' in RLS.';
