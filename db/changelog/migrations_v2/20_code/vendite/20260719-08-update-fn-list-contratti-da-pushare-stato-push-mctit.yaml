# brief-db-push-commessa-gia-inviato §4a (Rev 1) — fn_list_contratti_da_pushare esclude su ALLOCAZIONE via classificatore.
#
# PRIMA: l'esclusione "gia' inviato" era ancorata alla FATTURAZIONE
# (NOT EXISTS ... stato_emissione='EMESSA') e cieca sui componenti BoM
# (match per uguaglianza: le attivita' '#CMP:<componente>' non matchavano
# mai). Effetto (rilievo ORD0000227): righe gia' pushate ri-elencate a ogni
# giro del batch e azione «Invia a commessa» ri-offerta dopo il consumo.
#
# DOPO: eleggibile <=> script.fn_get_stato_push_segment(<segment_key>) =
# 'LIBERA' (20260719-05) — esclusione su ALLOCAZIONE, qualunque
# stato_emissione (ANNULLATA inclusa: decisione preventivi 2026-06-28), con
# match che vede anche i componenti BoM. Stessa semantica della vista
# preventivi vw_preventivi_righe_smistabili_commessa (fix 2026-06-28).
# FIRMA INVARIATA: zero tocchi BE (fetch_pushable_rows e handler intatti).
#
# Corpo base: ultimo YAML (20260628-14), verificato IDENTICO al vivo
# (doc auto-gen) il 2026-07-19. Cambia SOLO il predicato di esclusione
# (+ COMMENT). La chiave contratti include ':M:<YYYY-MM>' (push ricorrente
# mensile by design): il fix esclude il MESE gia' allocato; il mese dopo
# ha chiave diversa e resta eleggibile.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260719-08-update-fn-list-contratti-da-pushare-stato-push-mctit.yaml

  - changeSet:
      id: 20260719-08-update-fn-list-contratti-da-pushare-stato-push
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_list_contratti_da_pushare: esclusione del mese gia' instradato via
        script.fn_get_stato_push_segment = LIBERA (chiave con :M:<mese>;
        allocazione, non piu' solo EMESSA; vede i componenti BoM #CMP).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'script' AND p.proname = 'fn_get_stato_push_segment'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_contratti_da_pushare(
                  p_competenza_mese    date                                DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE  DEFAULT NULL::bigint,
                  p_limit              integer                             DEFAULT NULL::integer,
                  p_contratto_id       vendite.contratti.id%TYPE           DEFAULT NULL::bigint)
               RETURNS TABLE(
                  contratto_id                vendite.contratti.id%TYPE,
                  contratto_uid               vendite.contratti.uid%TYPE,
                  riga_id                     vendite.contratti_righe.id%TYPE,
                  billing_account_id          vendite.contratti.billing_account_id%TYPE,
                  utility_id                  vendite.contratti.utility_id%TYPE,
                  emittente_soggetto_ruolo_id bigint,
                  competenza_dal              date,
                  competenza_al               date,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            config.sorgenti.id%TYPE,
                  sorgente_uid                text,
                  segment_key                 character varying,
                  articolo_id                 vendite.contratti_righe.articolo_id%TYPE,
                  istanza_utility_id          vendite.contratti.istanza_utility_id%TYPE,
                  data_attivita               date,
                  uom_id                      catalogo.articoli.uom_id%TYPE,
                  quantita                    vendite.contratti_righe.quantita%TYPE,
                  qta_operativa               vendite.contratti_righe.qta_operativa%TYPE,
                  uom_operativa_id            vendite.contratti_righe.uom_operativa_id%TYPE,
                  factor_to_base              vendite.contratti_righe.factor_to_base%TYPE,
                  competenza_mese             date,
                  prezzo_snapshot             vendite.contratti_righe.prezzo_unitario%TYPE,
                  prezzo_bloccato             boolean,
                  pricing_mode                character varying,
                  tipo_movimento              character varying,
                  tipo_consumo                character varying,
                  valuta_id                   integer,
                  meta                        jsonb,
                  tipo_doc_fiscale_id         config.sorgenti.tipo_doc_fiscale_id%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_attivo_id     config.stati_doc_contratti.id%TYPE;
              BEGIN
                -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente/stato
                -- risolti per codice_interno (immutabile), non per codice (mutabile).
                IF p_contratto_id IS NOT NULL AND p_contratto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_contratto_id', 'valore', p_contratto_id),
                    NULL::uuid,
                    'p_contratto_id', p_contratto_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'CONTRATTO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CONTRATTO'),
                    NULL::uuid, 'CONTRATTO', 'config.sorgenti'
                  );
                END IF;

                SELECT s.id INTO v_stato_attivo_id
                FROM config.stati_doc_contratti s
                WHERE s.codice_interno = 'ATTIVO' AND s.attivo IS TRUE LIMIT 1;

                RETURN QUERY
                SELECT
                  c.id, c.uid, cr.id,
                  c.billing_account_id,
                  c.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(c.billing_account_id),
                  c.valido_dal, c.valido_al,
                  FALSE,
                  v_sorgente_tipo_id,
                  c.uid::text,
                  ('CONTR:' || c.uid::text || ':R:' || cr.id::text || ':M:' ||
                   to_char(date_trunc('month', COALESCE(c.valido_dal, c.data))::date, 'YYYY-MM'))::varchar,
                  cr.articolo_id,
                  c.istanza_utility_id,
                  COALESCE(c.valido_dal, c.data),
                  -- uom_id canonica da catalogo.articoli (fix bug proiezione NULL)
                  a.uom_id,
                  cr.quantita,
                  cr.qta_operativa,
                  cr.uom_operativa_id,
                  COALESCE(cr.factor_to_base, 1::numeric),
                  date_trunc('month', COALESCE(c.valido_dal, c.data))::date,
                  cr.prezzo_unitario,
                  (cr.prezzo_unitario IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  COALESCE(cr.tipo_erogazione, 'CANONE')::varchar,
                  NULL::integer,
                  jsonb_build_object(
                    'contratto_numero',    c.numero,
                    'periodicita',         cr.periodicita,
                    'generazione_canone',  cr.generazione_canone,
                    'competenza_canone',   cr.competenza_canone,
                    'tipo_erogazione',     cr.tipo_erogazione,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id
                FROM vendite.contratti c
                JOIN vendite.contratti_righe cr
                  ON cr.contratto_id = c.id
                 AND COALESCE(cr.attivo, TRUE) IS TRUE
                JOIN catalogo.articoli a ON a.id = cr.articolo_id
                WHERE c.billing_account_id IS NOT NULL
                  AND (v_stato_attivo_id IS NULL OR c.stato_doc_contratto_id = v_stato_attivo_id)
                  AND (c.valido_al IS NULL OR c.valido_al >= COALESCE(p_competenza_mese, CURRENT_DATE))
                  AND (p_competenza_mese IS NULL
                       OR date_trunc('month', COALESCE(c.valido_dal, c.data))::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_contratto_id IS NULL OR c.id = p_contratto_id)
                  -- Esclusione "gia' inviato": eleggibile solo se MAI
                  -- instradata (LIBERA) — classificatore condiviso coi rami
                  -- reason della capability: vede anche i componenti #CMP e
                  -- non dipende piu' da stato_emissione (ALLOCATA basta).
                  AND script.fn_get_stato_push_segment(
                        'CONTR:' || c.uid::text || ':R:' || cr.id::text || ':M:' || to_char(date_trunc('month', COALESCE(c.valido_dal, c.data))::date, 'YYYY-MM')) = 'LIBERA'
                ORDER BY c.id, cr.id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_contratti_da_pushare(p_competenza_mese date, p_billing_account_id bigint, p_limit integer, p_contratto_id bigint)
              IS 'Lista righe contratto eligible al push su commessa (stato ATTIVO). uom_id da catalogo.articoli (canonica). p_contratto_id opzionale: NULL=batch globale, NOT NULL=singolo contratto. Filtri in AND. Esclude EMESSA via NOT EXISTS. (20260511-33: cr.quantita_fissa -> cr.quantita dopo rename colonna) rev 2026-06-28: sorgente/stato per codice_interno (analisi-hardcoded-codice §3a). rev 2026-07-19: esclusione su ALLOCAZIONE del mese via script.fn_get_stato_push_segment (vede anche componenti #CMP), non piu'' solo EMESSA — brief-db-push-commessa-gia-inviato §4a.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: rigenerare la revisione precedente (20260628-14)
              -- dalla doc auto-gen. Nessun DROP: la fn deve continuare a esistere.
              SELECT 1;
