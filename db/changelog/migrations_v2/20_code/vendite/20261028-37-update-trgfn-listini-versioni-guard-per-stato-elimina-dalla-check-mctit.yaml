# IL GUARD PER STATO DI UNA VERSIONE DI LISTINO: LA CANCELLAZIONE DALLA CHECK
#   Brief: brief-modello-documento-vendita §16.11 (E-3 di Tid, 2026-10-28).
#   Corpo di partenza: il vivo, uguale al 20261028-09.
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────
#   Il ramo DELETE: al posto del suo IF sullo stato, il primo motivo di
#   script.fn_check_versione_listino_eliminabile (20261028-36), la regola che
#   leggono anche il verbo vendite.fn_elimina_versione_listino e il pulsante.
#   * Fuori dalla BOZZA: lo stesso codice di prima
#     (E_LISTINO_VERSIONE_NON_ELIMINABILE), cogli stessi valori (codice della
#     versione, stato).
#   * Una BOZZA che un documento tiene: E_LISTINO_VERSIONE_CITATA, dove prima
#     cadeva la FK con un errore tecnico.
#   Il ramo UPDATE, la firma, i trigger e SECURITY INVOKER restano quelli
#   del 20261028-09.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261028-37-update-trgfn-listini-versioni-guard-per-stato-elimina-dalla-check-mctit.yaml

  - changeSet:
      id: 20261028-37-update-trgfn-listini-versioni-guard-per-stato-elimina-dalla-check
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_versioni_guard_per_stato: il ramo DELETE solleva il primo motivo di
        script.fn_check_versione_listino_eliminabile (non in bozza; citata). Brief:
        brief-modello-documento-vendita §16.11.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_check_versione_listino_eliminabile';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_versioni_guard_per_stato()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: che cosa si cambia di una versione di listino nello
              --   stato in cui e' (BEFORE UPDATE), e se si cancella (BEFORE
              --   DELETE). Vedi l'intestazione dei changeSet 20261028-09 e -37.
              DECLARE
                  v_stato  config.stati_doc_listino_versioni.codice_interno%TYPE;
                  -- Nomi di colonna della tabella: nessuna colonna di cui
                  -- siano il riflesso.
                  v_libere text[] := ARRAY['data_update', 'user_update', 'tx_id', 'validita',
                                           'stato_doc_listino_versione_id'];
                  v_campo  text;
              BEGIN
                  SELECT s.codice_interno INTO v_stato
                    FROM config.stati_doc_listino_versioni s
                   WHERE s.id = OLD.stato_doc_listino_versione_id;

                  -- Se si cancella lo dice script.fn_check_versione_listino_eliminabile
                  -- (20261028-36): la stessa regola del verbo e del pulsante.
                  IF TG_OP = 'DELETE' THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', TG_NAME::text,
                          script.fn_check_versione_listino_eliminabile(OLD.id),
                          NULL,
                          OLD.tx_id,
                          jsonb_build_object('versione_id', OLD.id, 'listino_id', OLD.listino_id,
                                             'stato', v_stato));
                      RETURN OLD;
                  END IF;

                  IF v_stato = 'BOZZA' THEN
                      RETURN NEW;
                  END IF;

                  -- ATTIVA: in piu' si cambia valido_al. CHIUSA: niente.
                  IF v_stato = 'ATTIVA' THEN
                      v_libere := array_append(v_libere, 'valido_al');
                  END IF;

                  -- Il primo campo cambiato fuori da quelli liberi, nell'ordine
                  -- delle colonne della tabella.
                  SELECT a.attname INTO v_campo
                    FROM pg_catalog.pg_attribute a
                   WHERE a.attrelid = TG_RELID
                     AND a.attnum > 0
                     AND NOT a.attisdropped
                     AND a.attname <> ALL (v_libere)
                     AND (to_jsonb(NEW) -> a.attname) IS DISTINCT FROM (to_jsonb(OLD) -> a.attname)
                   ORDER BY a.attnum
                   LIMIT 1;

                  IF FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_LISTINO_VERSIONE_CAMPO_NON_MODIFICABILE',
                          jsonb_build_object('versione_id', OLD.id, 'listino_id', OLD.listino_id,
                                             'stato', v_stato, 'campo', v_campo),
                          NEW.tx_id,
                          OLD.codice_versione::text,
                          COALESCE(v_stato, 'NULL'),
                          v_campo);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_versioni_guard_per_stato() IS
                  'Guard di una versione di listino, stato per stato (BEFORE UPDATE e BEFORE DELETE): BOZZA tutto si cambia e si cancella; ATTIVA si cambia solo valido_al (la chiusura programmata, e quella delle precedenti all''attivazione di una nuova); CHIUSA niente. Se si cancella lo dice script.fn_check_versione_listino_eliminabile, e il ramo DELETE ne solleva il primo motivo (fuori dalla BOZZA E_LISTINO_VERSIONE_NON_ELIMINABILE; una BOZZA citata da un documento E_LISTINO_VERSIONE_CITATA); un altro campo cambiato fuori dalla BOZZA: E_LISTINO_VERSIONE_CAMPO_NON_MODIFICABILE, col primo campo nell''ordine delle colonne. Lo stato non e'' un campo di questa regola (guard di transizione, porta); le colonne d''audit e la generata validita non contano. Prima la regola stava nel backend (listini_service._VERSIONE_PATCH_ALLOWED_BY_STATE, fn_delete_versione), e il database ne aveva solo le date della CHIUSA (vendite.trgfn_listini_versioni_guard_date_chiusa, ritirata qui). Brief: brief-modello-documento-vendita §16 (L-5, Tid 2026-10-28). Rev 2026-10-28 (20261028-37, brief-modello-documento-vendita §16.11): il ramo DELETE dalla check, la stessa del verbo vendite.fn_elimina_versione_listino e del pulsante (vendite.vw_listini_versioni_azioni).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima sta nel 20261028-09: si torna da li'.
              SELECT 1;
