# LA STORIA DI UN LISTINO: LE VERSIONI USCITE DALLA BOZZA, DALLA COLONNA iniziale
#   Brief: brief-db-stati-documento-dal-vocabolario §6.26, giro 6f (S-2 e S-3,
#   Tid 2026-11-08; via di Tid del 2026-11-15).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   «Uscita dalla bozza» era codice_interno <> 'BOZZA'.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   NOT iniziale, la colonna del vocabolario. Con il seed la risposta e' quella
#   di prima.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, stessa volatilita', sicurezza e SET (pg_proc
#   su dbdev, 2026-11-15). Il COMMENT, che era una cronaca, e' riscritto al
#   presente.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-15; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (20261028-19: il catalogo li scioglie).
#   Il rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-44-update-fn-listino-ha-storia-bozza-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261115-44-update-fn-listino-ha-storia-bozza-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_listino_ha_storia: le versioni uscite dalla bozza da NOT iniziale, non dal codice
        BOZZA. Brief: brief-db-stati-documento-dal-vocabolario, giro 6f.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_listino_ha_storia(
                  p_listino_id vendite.listini.id%TYPE)
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   true se il listino ha almeno una versione USCITA DALLA
                  --   BOZZA (non nello stato iniziale del vocabolario), anche
                  --   spenta. Una bozza non conta. Listino NULL: false.
                  -- ⚠️ Non e' la regola «in vigore a una data»
                  --   (vendite.fn_listino_versione_in_vigore): qui non c'e'
                  --   data ne' filtro su attivo.
                  -- =========================================================
                  RETURN EXISTS (
                      SELECT 1
                        FROM vendite.listini_versioni v
                        JOIN config.stati_doc_listino_versioni s ON s.id = v.stato_doc_listino_versione_id
                       WHERE v.listino_id = p_listino_id
                         AND NOT s.iniziale);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_listino_ha_storia(vendite.listini.id%TYPE)
              IS 'True se il listino ha storia: almeno una versione uscita dalla bozza (non nello stato iniziale del vocabolario config.stati_doc_listino_versioni), anche spenta. Non e'' la regola «in vigore a una data» di vendite.fn_listino_versione_in_vigore: qui non c''e'' data ne'' filtro su attivo. Una bozza non conta: nessuno ci ha mai preso un prezzo. Nessun passaggio della matrice config.transizioni_stati_listino_versioni riporta una versione nello stato iniziale, quindi «ha oggi una versione fuori dalla bozza» = «ha avuto una versione attiva». Un listino con storia non si spegne con l''interruttore: si chiude con la fine validita'' della versione (vendite.trgfn_listini_guard_spegnimento_storia). Sede unica della regola: la legge anche il backend per mostrare il toggle «Attivo» solo a un listino senza storia. SECURITY INVOKER, STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_listino_ha_storia(
                  p_listino_id vendite.listini.id%TYPE)
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   true se il listino ha almeno una versione USCITA DALLA
                  --   BOZZA (oggi ATTIVA o CHIUSA), anche spenta. Una BOZZA non
                  --   conta. Listino NULL: false.
                  -- ⚠️ Non e' la regola «in vigore a una data»
                  --   (vendite.fn_listino_versione_in_vigore): qui non c'e'
                  --   data ne' filtro su attivo.
                  -- =========================================================
                  RETURN EXISTS (
                      SELECT 1
                        FROM vendite.listini_versioni v
                        JOIN config.stati_doc_listino_versioni s ON s.id = v.stato_doc_listino_versione_id
                       WHERE v.listino_id = p_listino_id
                         AND s.codice_interno <> 'BOZZA');
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_listino_ha_storia(vendite.listini.id%TYPE)
              IS 'True se il listino ha STORIA: almeno una versione uscita dalla bozza (stato <> BOZZA: oggi ATTIVA o CHIUSA), anche spenta (D-1 di Tid, 2026-10-22). Non e'' la regola «in vigore a una data» di vendite.fn_listino_versione_in_vigore: qui non c''e'' data ne'' filtro su attivo. Una BOZZA non conta: nessuno ci ha mai preso un prezzo. Gli stati di una versione non tornano indietro, quindi «ha oggi ATTIVA o CHIUSA» = «ha avuto una versione attiva». Un listino con storia non si spegne con l''interruttore: si chiude con la fine validita'' della versione (vendite.trgfn_listini_guard_spegnimento_storia). Sede unica della regola: la legge anche il backend per mostrare il toggle «Attivo» solo a un listino senza storia. SECURITY INVOKER, STABLE. Richiesta BE §9.8 di brief-be-utenti-di-sviluppo. Rev 2026-10-28 (20261028-19, brief-modello-documento-vendita §16, L-1): lo stato della versione di listino si legge dal vocabolario config.stati_doc_listino_versioni (codice_interno), non piu'' dalla colonna testo stato.';
