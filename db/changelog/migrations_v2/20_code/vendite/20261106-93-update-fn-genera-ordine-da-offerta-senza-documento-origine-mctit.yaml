                          'E_OFFERTA_CONTRATTO_GIA_GENERATO',
                          jsonb_build_object('offerta_id', p_offerta_id,
                                             'bersaglio',  v_bersagli),
                          NULL::uuid,
                          COALESCE(v_offerta.codice, p_offerta_id::text));
                  END IF;

                  -- 4. Le righe, prima di scrivere: lo stesso motivo della capability.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'fn_genera_ordine_da_offerta',
                      script.fn_check_righe_offerta_in_ordine(p_offerta_id),
                      'articolo_id',
                      NULL::uuid,
                      jsonb_build_object('offerta_id', p_offerta_id,
                                         'codice',     v_offerta.codice));

                  -- 5. La testata, con la provenienza: il tipo e la chiave dell'offerta, per il
                  --    key_selector del tipo (script.fn_sorgente_provenienza), letti una volta per
                  --    la testata e per le righe. Accanto, la colonna parallela
                  --    documento_origine_*, che si ritira a parte.
                  --    Lo stato non si scrive: DRAFT lo mette trg_ordini_a05_stato_iniziale_ins.
                  SELECT p.sorgente_tipo_id, p.sorgente_id, p.sorgente_uid
                    INTO v_prov_tipo_id, v_prov_id, v_prov_uid
                    FROM script.fn_sorgente_provenienza('OFFERTA_COMMERCIALE', p_offerta_id::text) p;

                  INSERT INTO vendite.ordini (
                      billing_account_id,
                      emittente_fiscale_id,
                      valuta_id,
                      sorgente_tipo_id,
                      sorgente_id,
                      sorgente_uid,
                      documento_origine_tipo,
                      documento_origine_id)
                  VALUES (
                      v_offerta.billing_account_id,
                      v_offerta.emittente_fiscale_id,
                      v_offerta.valuta_id,
                      v_prov_tipo_id,
                      v_prov_id,
                      v_prov_uid,
                      'OFFERTA_COMMERCIALE',
                      p_offerta_id)
                  RETURNING id, data, emittente_fiscale_id
                       INTO v_ordine_id, v_ordine_data, v_emittente_fiscale_id;

                  -- 6. L'indirizzo di default dall'anagrafica del cliente.
                  PERFORM vendite.fn_doc_indirizzo_default('ORDINE_VENDITA', v_ordine_id);

                  -- 7. Le righe espanse. L'emittente dei componenti e' il soggetto-ruolo
                  --    dell'emittente fiscale dell'ordine (non la sua PK), la data quella
                  --    dell'ordine.
                  SELECT ef.soggetto_ruolo_id INTO v_emittente_sr_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = v_emittente_fiscale_id;

                  FOR v_riga IN
                      SELECT r.*
                        FROM vendite.fn_offerta_righe_espanse(p_offerta_id)
                             WITH ORDINALITY AS r(articolo_id, articolo_codice, descrizione, is_composito,
                                                  quantita, uom_operativa_id, qta_operativa, factor_to_base,
                                                  prezzo_unitario, sconto_percentuale, iva_id,
                                                  tipo_eccezione, origine, componenti, eccezione_id,
                                                  riga_nr)
                       ORDER BY r.riga_nr
                  LOOP
                      INSERT INTO vendite.ordini_righe (
                          ordine_id, riga_nr, articolo_id, descrizione,
                          quantita, qta_operativa, uom_operativa_id, factor_to_base,
                          prezzo_unitario, sconto_percentuale, iva_id,
                          sorgente_tipo_id, sorgente_id, sorgente_uid, sorgente_riga)
                      VALUES (
                          v_ordine_id, v_riga.riga_nr::integer, v_riga.articolo_id, v_riga.descrizione,
                          v_riga.quantita, v_riga.qta_operativa, v_riga.uom_operativa_id, v_riga.factor_to_base,
                          CASE WHEN v_riga.is_composito THEN 0 ELSE v_riga.prezzo_unitario END,
                          v_riga.sconto_percentuale, v_riga.iva_id,
                          -- La provenienza: l'offerta e l'eccezione da cui la riga viene
                          -- (NULL per la riga del solo listino: la provenienza e' l'offerta).
                          v_prov_tipo_id, v_prov_id, v_prov_uid, v_riga.eccezione_id)
                      RETURNING id INTO v_riga_id;

                      IF v_riga.is_composito IS TRUE THEN
                          SELECT jsonb_object_agg(c ->> 'componente_id', c ->> 'prezzo')
                            INTO v_overrides
                            FROM jsonb_array_elements(
                                     CASE WHEN jsonb_typeof(v_riga.componenti) = 'array'
                                          THEN v_riga.componenti ELSE '[]'::jsonb END) AS c
                           WHERE c ->> 'componente_id' IS NOT NULL
                             AND c ->> 'prezzo' IS NOT NULL
                             AND (c ->> 'prezzo')::numeric <> 0;

                          PERFORM vendite.fn_ordine_riga_componenti_init(
                              v_riga_id, v_emittente_sr_id, v_ordine_data, v_overrides);
                      END IF;
                  END LOOP;

                  RETURN v_ordine_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_genera_ordine_da_offerta(vendite.offerte_commerciali.id%TYPE) IS
                  'Genera un ordine DRAFT da un''offerta in uno stato di accettazione, in una transazione, e ne restituisce l''id. Gemello di vendite.fn_push_offerta_a_contratto. Passi: l''offerta FOR UPDATE, sotto RLS (assente: E_OFFERTA_NON_TROVATA); solo da uno stato di accettazione del vocabolario (E_ORD_ORIGINE_NON_CONVERTIBILE); i documenti vivi da vendite.fn_offerta_documenti_vivi, un ordine (E_ORD_OFFERTA_GIA_CONVERTITA) o un contratto (E_OFFERTA_CONTRATTO_GIA_GENERATO), col bersaglio nel contesto; il primo motivo di script.fn_check_righe_offerta_in_ordine (E_DOC_RIGA_NON_AMMESSA), lo stesso della capability, prima di scrivere; la testata con cliente, emittente e valuta dell''offerta e la provenienza nella stessa INSERT: OFFERTA_COMMERCIALE con la chiave dell''offerta da script.fn_sorgente_provenienza (letta una volta per testata e righe), e accanto la colonna parallela documento_origine_* (OFFERTA_COMMERCIALE, id); l''indirizzo di default (vendite.fn_doc_indirizzo_default); le righe di vendite.fn_offerta_righe_espanse nel loro ordine (riga_nr dalla posizione), coi prezzi negoziati, ognuna con la sua provenienza: OFFERTA_COMMERCIALE con la chiave dell''offerta da script.fn_sorgente_provenienza, e in sorgente_riga l''eccezione da cui viene, NULL per la riga del solo listino. Il composito nasce a 0 e prende il prezzo dai componenti, che crea vendite.fn_ordine_riga_componenti_init coi prezzi dell''offerta come override (esclusi quelli a 0, che la init rifiuta). SECURITY INVOKER: sotto RLS e coi guard dell''ordine, come se scrivesse l''operatore. L''unicita'' la tiene uq_ordini_v_sorgente_offerta, sulla provenienza (e uq_ordini_v_documento_origine_offerta sulla colonna parallela).';
