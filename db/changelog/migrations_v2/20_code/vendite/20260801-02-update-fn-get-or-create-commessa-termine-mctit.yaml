# Fase 3b.0-b — il termine di pagamento entra nella chiave di raggruppamento
#   della commessa (piano-db-satelliti-fattura.md, decisione D-R del 2026-08-01).
#
# L'IDEA, IN UNA RIGA: un documento sorgente con un termine di pagamento
#   diverso non trova una commessa riusabile e **ne apre una nuova**. La
#   divergenza si vede al push, come una commessa in piu', invece di comparire
#   mesi dopo come una fattura in piu' che nessuno sa spiegare.
#
# PERCHE' QUI E NON A VALLE. L'alternativa era risalire dalla fattura al
#   documento d'origine di ogni attivita' e spaccare li'. Il percorso esiste
#   (`attivita_fatturabili.commessa_attivita_id` -> `commesse_attivita.sorgente_uid`),
#   ma misurato sul DB il 2026-08-01 avrebbe tre difetti che qui non esistono:
#     1. una commessa ha fino a **32 sorgenti**, di 4 tipi (47 preventivi, 23
#        ordini, 3 contratti, 1 DDT). Contratti e DDT NON hanno colonne di
#        pagamento: due attivita' della stessa commessa si sarebbero divise
#        **per assenza del campo**, non per una scelta di qualcuno;
#     2. il termine si leggerebbe a runtime da documenti che restano
#        modificabili: stesse attivita', numero di fatture diverso a seconda di
#        QUANDO lanci il giro. L'invariante «riesecuzione -> nessuna terza
#        fattura» (3b.5) dipenderebbe da un'immutabilita' che nessuno garantisce;
#     3. «perche' questa commessa ha prodotto 3 fatture?» non avrebbe risposta
#        scritta da nessuna parte: andrebbe ricalcolata risalendo i documenti.
#   Con la chiave sulla commessa non c'e' nulla da conciliare fra le sorgenti:
#   sorgenti con termini diversi semplicemente non si incontrano.
#
# ⚠️ I TRE SPECCHI, DA TOCCARE INSIEME. La chiave di questa funzione vive in
#   tre posti — l'hash dell'**advisory lock**, il `WHERE` che cerca la commessa
#   riusabile, e l'`INSERT`. E' la stessa regola del §6 del piano: toccarne due
#   su tre e' peggio che non toccarne nessuno, perche' il difetto diventa una
#   corsa fra transazioni invece di un errore. Per questo stanno in un
#   changeSet solo, insieme alle due colonne.
#
# 🔴 `IS NOT DISTINCT FROM`, NON `=`. Il termine e' NULL nella grande
#   maggioranza dei casi (misurato: nessun documento ne porta uno oggi). Con
#   l'uguaglianza semplice NULL non combacia mai, quindi NESSUN push
#   riuserebbe piu' una commessa e se ne creerebbe una per ogni riga: un
#   moltiplicatore silenzioso, che si nota solo guardando i conteggi. Si usa
#   la stessa forma gia' adottata per `competenza_dal`/`competenza_al`.
#
# RETROCOMPATIBILE SUL DATO ATTUALE: tutte le commesse nascono con termine
#   NULL e nessun documento sorgente ne porta uno, quindi il raggruppamento di
#   oggi **non cambia di una riga**. La decima dimensione si accende al primo
#   uso reale.
#
# 🔴 SERVE LA DROP DELLA VECCHIA FIRMA, e non e' un dettaglio di forma.
#   `CREATE OR REPLACE` con due parametri in piu' non sostituisce: **crea un
#   overload**. E poiche' i due nuovi hanno un DEFAULT, una chiamata con gli 11
#   argomenti di prima combacerebbe con entrambe le firme e PostgreSQL
#   rifiuterebbe con «la funzione non e' unica»: il push si romperebbe alla
#   prima invocazione, non a runtime lontano. Verificato in transazione il
#   2026-08-01 prima di scrivere questo changeSet.
#
# COSA RESTA FUORI, di proposito:
#   - il **guard di immutabilita'** (3b.0-c): una commessa aperta non puo'
#     cambiare termine, perche' e' elemento della propria chiave. Changeset a
#     parte, cosi' questo resta leggibile;
#   - il **chiamante del push**, che deve passare il termine letto dal
#     documento sorgente: e' lavoro BE, e finche' non lo fa la funzione riceve
#     NULL e si comporta esattamente come prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260801-02-update-fn-get-or-create-commessa-termine-mctit.yaml

  - changeSet:
      id: 20260801-02-update-fn-get-or-create-commessa-termine
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D-R: termine e modalita' di pagamento diventano dato della commessa ed
        entrano nella sua chiave di raggruppamento (advisory lock, WHERE del
        riuso, INSERT). Un documento con termine diverso apre una commessa
        nuova, cosi' la divergenza si vede al push invece che in fattura.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ── 1. Il termine diventa un dato della commessa (3b.0-a) ────────
              -- Nullable: l'assenza e' il caso normale e significa «nessuna
              -- condizione particolare», non «dato mancante». A valle la catena
              -- scende al cliente e poi a TP_1RATA (D-J).
              ALTER TABLE vendite.commesse
                  ADD COLUMN IF NOT EXISTS termine_pagamento_id  BIGINT,
                  ADD COLUMN IF NOT EXISTS modalita_pagamento_id INTEGER;

              DO $$
              BEGIN
                  IF NOT EXISTS (
                      SELECT 1 FROM pg_constraint
                       WHERE conrelid = 'vendite.commesse'::regclass
                         AND conname  = 'fk_commesse_termine_pagamento'
                  ) THEN
                      ALTER TABLE vendite.commesse
                          ADD CONSTRAINT fk_commesse_termine_pagamento
                          FOREIGN KEY (termine_pagamento_id)
                          REFERENCES config.termini_pagamento (id);
                  END IF;

                  IF NOT EXISTS (
                      SELECT 1 FROM pg_constraint
                       WHERE conrelid = 'vendite.commesse'::regclass
                         AND conname  = 'fk_commesse_modalita_pagamento'
                  ) THEN
                      ALTER TABLE vendite.commesse
                          ADD CONSTRAINT fk_commesse_modalita_pagamento
                          FOREIGN KEY (modalita_pagamento_id)
                          REFERENCES config.modalita_pagamento (id);
                  END IF;
              END
              $$;

              COMMENT ON COLUMN vendite.commesse.termine_pagamento_id IS
                  'Condizioni di pagamento della commessa (D-R). La commessa le POSSIEDE: la sorgente le propone alla nascita, poi la commessa e'' padrona. E'' elemento della chiave di raggruppamento: un documento con termine diverso apre una commessa nuova. NULL = nessuna condizione particolare, la fattura scende al cliente e poi a TP_1RATA.';
              COMMENT ON COLUMN vendite.commesse.modalita_pagamento_id IS
                  'Modalita'' di pagamento della commessa (D-R), stessa semantica di termine_pagamento_id. Nessun default inventato: config.modalita_pagamento non ha una riga «default» e sceglierne una arbitrariamente finirebbe sulla FatturaPA.';

              -- ── 2. La chiave di raggruppamento passa a 10 dimensioni ─────────
              -- 🔴 LA DROP NON E' FACOLTATIVA. In PostgreSQL una funzione e'
              -- identificata da (nome, tipi degli argomenti): `CREATE OR REPLACE`
              -- con due parametri in piu' NON sostituisce nulla, crea un
              -- OVERLOAD e lascia in piedi la vecchia. Peggio: i due parametri
              -- nuovi hanno un DEFAULT, quindi una chiamata con gli 11 argomenti
              -- di prima combacia con ENTRAMBE e PostgreSQL rifiuta con
              -- «la funzione non e' unica» — il push si romperebbe alla prima
              -- invocazione. Verificato in transazione il 2026-08-01.
              DROP FUNCTION IF EXISTS vendite.fn_get_or_create_commessa(
                  bigint, integer, character varying, character varying, boolean,
                  character varying, bigint, date, date, jsonb, boolean);

              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_commessa(
                  p_billing_account_id          anagrafiche.billing_account.id%TYPE,
                  p_utility_id                  config.utilities.id%TYPE,
                  p_tipo_commessa               vendite.commesse.tipo_commessa%TYPE DEFAULT 'AUTO',
                  p_policy_fatturazione         vendite.commesse.policy_fatturazione%TYPE DEFAULT 'DA_DOCUMENTO',
                  p_fatturazione_immediata      vendite.commesse.fatturazione_immediata%TYPE DEFAULT FALSE,
                  p_priorita_operativa          vendite.commesse.priorita_operativa%TYPE DEFAULT 'NORMALE',
                  p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL,
                  p_competenza_dal              date DEFAULT NULL,
                  p_competenza_al               date DEFAULT NULL,
                  p_meta                        jsonb DEFAULT '{}'::jsonb,
                  p_force_new                   boolean DEFAULT FALSE,
                  p_termine_pagamento_id        config.termini_pagamento.id%TYPE DEFAULT NULL,
                  p_modalita_pagamento_id       config.modalita_pagamento.id%TYPE DEFAULT NULL
              )
              RETURNS bigint
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: recupera o crea la commessa coerente con il contesto
              --        dimensionale. Da D-R la chiave comprende anche le condizioni
              --        di pagamento: un documento con termine diverso NON riusa una
              --        commessa esistente, ne apre una nuova — cosi' la divergenza
              --        emerge al push e non a valle, in fattura.
              -- Regole: la chiave vive in TRE posti (hash del lock, WHERE del riuso,
              --         INSERT) e i tre vanno tenuti identici. I due parametri nuovi
              --         sono in coda e con DEFAULT NULL: nessun chiamante da adeguare
              --         subito, e finche' passano NULL il comportamento e' quello di
              --         prima.
              DECLARE
                  v_commessa_id vendite.commesse.id%TYPE;
                  v_ba_utility  anagrafiche.billing_account.utility_id%TYPE;
                  v_ba_found    BOOLEAN := FALSE;
                  v_emittente   vendite.commesse.emittente_soggetto_ruolo_id%TYPE;
                  v_codice      vendite.commesse.codice%TYPE;
              BEGIN
                  -- Guard: parametri obbligatori
                  IF p_billing_account_id IS NULL OR p_billing_account_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_billing_account_id', 'valore', p_billing_account_id),
                          NULL::uuid, 'p_billing_account_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_utility_id IS NULL OR p_utility_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_utility_id', 'valore', p_utility_id),
                          NULL::uuid, 'p_utility_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_competenza_dal IS NOT NULL AND p_competenza_al IS NOT NULL AND p_competenza_dal > p_competenza_al THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_DATA_AL_MINORE_DAL',
                          jsonb_build_object('competenza_dal', p_competenza_dal, 'competenza_al', p_competenza_al),
                          NULL::uuid, p_competenza_al::text, p_competenza_dal::text
                      );
                  END IF;

                  -- Verifica BA
                  SELECT ba.utility_id, TRUE INTO v_ba_utility, v_ba_found
                    FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;

                  IF NOT v_ba_found THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_VALORE_MANCANTE',
                          jsonb_build_object('billing_account_id', p_billing_account_id),
                          NULL::uuid, concat('billing_account_id ', p_billing_account_id)
                      );
                  END IF;

                  IF v_ba_utility IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_BILLING_ACCOUNT_UTILITY_NULL',
                          jsonb_build_object('billing_account_id', p_billing_account_id),
                          NULL::uuid, p_billing_account_id::text
                      );
                  END IF;

                  IF v_ba_utility <> p_utility_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_CLIENTE_UTILITY_MISMATCH_BA',
                          jsonb_build_object('billing_account_id', p_billing_account_id, 'ba_utility_id', v_ba_utility, 'utility_id', p_utility_id),
                          NULL::uuid, p_billing_account_id::text, p_utility_id::text, v_ba_utility::text
                      );
                  END IF;

                  -- Risolve emittente
                  v_emittente := COALESCE(p_emittente_soggetto_ruolo_id, anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id));

                  IF NOT p_force_new THEN
                      -- SPECCHIO 1 — advisory lock sul contesto dimensionale.
                      -- Le due dimensioni nuove entrano QUI: senza, due push
                      -- concorrenti con termini diversi non si serializzerebbero
                      -- e potrebbero creare due volte la stessa commessa.
                      PERFORM pg_advisory_xact_lock(
                          hashtext('fn_get_or_create_commessa'),
                          hashtext(
                              p_billing_account_id::text || E'\x1F' || p_utility_id::text || E'\x1F' ||
                              p_tipo_commessa || E'\x1F' || p_policy_fatturazione || E'\x1F' ||
                              p_fatturazione_immediata::text || E'\x1F' || p_priorita_operativa || E'\x1F' ||
                              COALESCE(v_emittente::text, '') || E'\x1F' ||
                              COALESCE(p_competenza_dal::text, '') || E'\x1F' || COALESCE(p_competenza_al::text, '') || E'\x1F' ||
                              COALESCE(p_termine_pagamento_id::text, '') || E'\x1F' ||
                              COALESCE(p_modalita_pagamento_id::text, '')
                          )
                      );

                      -- SPECCHIO 2 — WHERE della commessa riusabile.
                      -- ⚠️ IS NOT DISTINCT FROM sulle due nuove: sono NULL quasi
                      -- sempre, e con `=` nessuna commessa verrebbe mai riusata.
                      SELECT c.id INTO v_commessa_id
                        FROM vendite.commesse c
                        JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id AND sc.chiude_commessa = FALSE
                       WHERE c.billing_account_id = p_billing_account_id
                         AND c.utility_id = p_utility_id
                         AND c.tipo_commessa = p_tipo_commessa
                         AND c.policy_fatturazione = p_policy_fatturazione
                         AND c.fatturazione_immediata = p_fatturazione_immediata
                         AND c.priorita_operativa = p_priorita_operativa
                         AND COALESCE(c.emittente_soggetto_ruolo_id, -1) = COALESCE(v_emittente, -1)
                         AND c.competenza_dal IS NOT DISTINCT FROM p_competenza_dal
                         AND c.competenza_al IS NOT DISTINCT FROM p_competenza_al
                         AND c.termine_pagamento_id  IS NOT DISTINCT FROM p_termine_pagamento_id
                         AND c.modalita_pagamento_id IS NOT DISTINCT FROM p_modalita_pagamento_id
                       ORDER BY c.id DESC LIMIT 1;

                      IF v_commessa_id IS NOT NULL THEN RETURN v_commessa_id; END IF;
                  END IF;

                  v_codice := 'CMM-' || to_char(clock_timestamp(), 'YYYYMMDDHH24MISSMS') || '-' || substr(md5(random()::text), 1, 6);

                  -- SPECCHIO 3 — INSERT: la commessa nasce con la chiave completa.
                  INSERT INTO vendite.commesse (codice, tipo_commessa, policy_fatturazione, fatturazione_immediata,
                      priorita_operativa, billing_account_id, utility_id, emittente_soggetto_ruolo_id,
                      competenza_dal, competenza_al, meta,
                      termine_pagamento_id, modalita_pagamento_id)
                  VALUES (v_codice, p_tipo_commessa, p_policy_fatturazione, p_fatturazione_immediata,
                      p_priorita_operativa, p_billing_account_id, p_utility_id, v_emittente,
                      p_competenza_dal, p_competenza_al, COALESCE(p_meta, '{}'::jsonb),
                      p_termine_pagamento_id, p_modalita_pagamento_id)
                  RETURNING id INTO v_commessa_id;

                  RETURN v_commessa_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_commessa(bigint, integer, character varying, character varying, boolean, character varying, bigint, date, date, jsonb, boolean, bigint, integer)
              IS 'Recupera o crea commessa coerente con BA/utility e fallback emittente fiscale. Da D-R la chiave di raggruppamento comprende anche (termine_pagamento_id, modalita_pagamento_id): un documento sorgente con condizioni diverse apre una commessa NUOVA invece di riusarne una. Advisory lock previene la doppia creazione e include le stesse dimensioni del WHERE.';
