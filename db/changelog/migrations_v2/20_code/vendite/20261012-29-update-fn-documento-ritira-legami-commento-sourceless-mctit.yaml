                          v_sorgente.sorgente_tipo_id,
                          v_sorgente.sorgente_uid,
                          format('Ritiro all''annullo confermato del documento di origine (%s %s)',
                                 p_documento, p_id));
                  END LOOP;

                  -- 4d. ⭐ rev 2026-10-12 (D-1, D-7): la COMMESSA. Le sue righe
                  --     NON_EMESSA dal lettore, ciascuna dal verbo del suo genere:
                  --     - con sorgente (documento o consumo): la primitiva col registro,
                  --       limitata a QUESTA commessa (p_commessa_id, 20261012-18); lo
                  --       stato del preventivo lo riproietta il trigger delle righe;
                  --     - RETTIFICA: l'annullo dell'accredito (il reso torna da
                  --       accreditare), per riga di reso: l'unita' e' l'accredito intero;
                  --     - ONERE: l'annullo della riga manuale, col suo registro.
                  --     Una riga MANUALE (sourceless di genere ignoto) non ha verbo:
                  --     resta, e l'avviso rifiuta il cambio di stato (fail-closed).
                  IF p_documento = 'COMMESSA' THEN
                      v_motivo := format('Ritiro all''annullo confermato della commessa %s', p_id);

                      FOR v_sorgente IN
                          SELECT DISTINCT ca.sorgente_tipo_id, ca.sorgente_uid
                            FROM vendite.fn_documento_legami(p_documento, p_id) AS l
                            JOIN vendite.commesse_attivita ca ON ca.id = l.riga_id
                           WHERE ca.sorgente_tipo_id IS NOT NULL
                      LOOP
                          PERFORM vendite.fn_ritira_commessa_attivita_da_sorgente(
                              v_sorgente.sorgente_tipo_id, v_sorgente.sorgente_uid, v_motivo, p_id);
                      END LOOP;

                      FOR v_resi_riga_id IN
                          SELECT DISTINCT l.origine_riga_id
                            FROM vendite.fn_documento_legami(p_documento, p_id) AS l
                           WHERE l.origine = 'RESO'
                             AND l.origine_riga_id IS NOT NULL
                           ORDER BY l.origine_riga_id
                      LOOP
                          PERFORM vendite.fn_annulla_accredito_riga_reso(v_resi_riga_id, v_motivo);
                      END LOOP;

                      FOR v_ca_id IN
                          SELECT l.riga_id
                            FROM vendite.fn_documento_legami(p_documento, p_id) AS l
                           WHERE l.origine = 'ONERE'
                           ORDER BY l.riga_id
                      LOOP
                          PERFORM vendite.fn_annulla_commessa_attivita(v_ca_id, v_motivo);
                      END LOOP;
                  END IF;

                  RETURN v_legami;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_ritira_legami(text, bigint, integer) IS
                  'BB (2026-10-11, brief-db-annullo-documento-con-legami D-1/D-2/D-4/D-5): la conferma e il ritiro dei consumi di un documento che si annulla. Chi conferma DICHIARA quanti legami ha visto (vendite.fn_documento_legami); se non corrisponde, E_DOC_ANNULLO_CON_LEGAMI, lo stesso avviso del guard (stampo di E_CREDENZIALE_DA_CONFERMARE). Poi apre la porta del ritiro (GUC transazionale zeroerp.doc_ritira_legami = ''<DOCUMENTO>:<id>'', letta da vendite.fn_doc_porta_ritiro_ammette) e la LASCIA APERTA: la chiude il verbo dopo il cambio di stato, perche'' il guard dell''annullo la legge per i legami di provenienza. Ritira: legami della bolla con ordini e resi (vendite.fn_ddt_riga_ritira_legami); righe dell''ordine staccate dal preventivo (preventivo_riga_id a NULL), col preventivo EVASO che torna ACCETTATO se ha di nuovo un residuo; righe di commessa NON_EMESSA della sorgente (vendite.fn_ritira_commessa_attivita_da_sorgente, col registro). La provenienza (offerta) non si ritira. Ritorna i legami confermati, 0 se non ce n''erano. SECURITY INVOKER, EXECUTE a nessuno: lo chiamano i verbi DEFINER vendite.fn_annulla_ddt, fn_annulla_ordine, fn_annulla_preventivo, fn_annulla_contratto, che bloccano la testata prima. ⭐ rev 2026-10-12 (brief-db-annullo-a-valle-riapre-a-monte): (1) + COMMESSA (D-1, D-7): le righe NON_EMESSA della commessa, ciascuna dal verbo del suo genere — con sorgente, vendite.fn_ritira_commessa_attivita_da_sorgente limitata a quella commessa (il documento o il consumo torna da mandare: una riga ANNULLATA non occupa, D-5); RETTIFICA, vendite.fn_annulla_accredito_riga_reso (il reso torna da accreditare); ONERE, vendite.fn_annulla_commessa_attivita. (2) Prima cio'' che vieta (D-3), per ogni documento: prima della conferma solleva il primo motivo della check che il guard della testata solleverebbe (script.fn_check_preventivo_annullabile, fn_check_ordine_annullabile, fn_check_commessa_annullabile, fn_check_sorgente_chiudibile per bolla e contratto), cosi'' chi annulla non conferma un ritiro che il cambio di stato rifiuterebbe. (3) Lo stato del preventivo all''annullo dell''ordine dal BB vendite.fn_preventivo_proietta_stato_smistamento (D-10), non piu'' scritto qui. (4) Il ritiro dei legami di bolla (fn_ddt_riga_ritira_legami) solo per la bolla: anche la commessa ha legami di origine ORDINE e RESO. Lo chiama anche vendite.fn_annulla_commessa.';
