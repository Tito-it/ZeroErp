                      END LOOP;
                  END IF;

                  -- 4b. Ordine: le righe si staccano dal preventivo; lo stato del
                  --     preventivo lo riproietta il BB (EVASO con un residuo torna
                  --     ACCETTATO). rev 2026-10-12 (D-10): la regola non e' piu' qui.
