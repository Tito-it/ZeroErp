# NASCE vendite.vw_ordini_righe_dettaglio: la sorgente delle righe dell'ordine,
# per la lista configurabile `vendite.ordine_righe` e per il repository.
#
# -- PERCHE' --------------------------------------------------------------
#   Le righe dell'ordine esistevano solo come due query Python in
#   `ordini_repository` (`list_righe` e `get_riga`), con due proiezioni che gia'
#   divergevano: `get_riga` non ha evaso/residuo ne' la descrizione IVA. E
#   dentro c'erano due regole di dominio che al DB non stavano da nessuna
#   parte — l'importo di riga e il calcolo di evaso e residuo dalla tabella dei
#   fulfillment. Decisione di Tid, 2026-09-28: D-8.6 del brief, estesa a
#   ordini e DDT (la gemella del preventivo e' 20260928-17).
#
# -- LA FORMA ----------------------------------------------------------------
#   · le colonne e i nomi sono quelli di `list_righe` (il FE li legge gia'),
#     nello stesso ordine, piu' `imponibile_riga_full` accanto a
#     `importo_riga` come nella gemella del preventivo;
#   · `importo_riga` dalla sede unica script.fn_imponibile_riga (20260928-16).
#     ⚠️ Il repository scriveva `COALESCE(prezzo_unitario, 0)`: su
#     `ordini_righe.prezzo_unitario` NOT NULL e' un ramo morto, quindi il valore
#     non cambia; e se un giorno la colonna diventasse nullable, la regola
#     giusta e' quella del DDT (NULL, non zero), che e' quella della funzione;
#   · evaso e residuo in UoM operativa, identici al repository: la somma dei
#     `qta_evasa` (UoM base) diviso `factor_to_base`, residuo mai negativo,
#     6 decimali; `NULLIF` sul fattore, cosi' un fattore zero da' NULL e non una
#     divisione per zero;
#   · ⚠️ nessun filtro su `attivo` e nessun ORDER BY, come le gemelle;
#   · `security_invoker = true`: ordini_righe e ordini_righe_fulfillment sono
#     in RLS, e una vista senza flag girerebbe come il suo owner, che ne e'
#     esente. Il presidio `rls/test-rls-viste-security-invoker` la prende per
#     criterio, senza elenchi da aggiornare.
#
# Base: la SELECT di ordini_repository.list_righe al 2026-09-28.
# Cantiere: brief-db-liste-righe-documento §8.6 (D-8.6), §8.10 passo 2
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-18-create-vw-ordini-righe-dettaglio-mctit.yaml

  - changeSet:
      id: 20260928-18-create-vw-ordini-righe-dettaglio
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce vw_ordini_righe_dettaglio, sorgente delle righe d'ordine per la lista
        configurabile e per il repository: le colonne di ordini_repository.list_righe, con
        importo dalla sede unica script.fn_imponibile_riga ed evaso/residuo portati a DB.
        security_invoker, nessun ORDER BY, nessun filtro su attivo.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >-
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_imponibile_riga'
            - tableExists:
                schemaName: vendite
                tableName: ordini_righe_fulfillment
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW vendite.vw_ordini_righe_dettaglio
              WITH (security_invoker = true) AS
              SELECT r.id,
                  r.ordine_id,
                  r.riga_nr,
                  r.attivo,
                  r.articolo_id,
                  a.codice AS articolo_codice,
                  a.descrizione AS articolo_descrizione,
                  r.descrizione,
                  r.quantita,
                  r.qta_operativa,
                  r.factor_to_base,
                  r.uom_operativa_id,
                  um.codice AS uom_codice,
                  r.prezzo_unitario,
                  r.sconto_percentuale,
                  r.iva_id,
                  iva.codice AS iva_codice,
                  iva.descrizione AS iva_descrizione,
                  iva.aliquota_iva AS iva_aliquota,
                  -- Arrotondato per mostrare; pieno per chi aggrega.
                  round(script.fn_imponibile_riga(r.quantita, r.prezzo_unitario,
                                                  r.sconto_percentuale), 2) AS importo_riga,
                  script.fn_imponibile_riga(r.quantita, r.prezzo_unitario,
                                            r.sconto_percentuale) AS imponibile_riga_full,
                  -- Evaso e residuo in UoM OPERATIVA: i fulfillment sono in UoM base.
                  round(COALESCE(ful.qta_evasa_base, 0::numeric)
                        / NULLIF(r.factor_to_base, 0::numeric), 6) AS qta_evasa_operativa,
                  round(GREATEST(r.quantita - COALESCE(ful.qta_evasa_base, 0::numeric),
                                 0::numeric)
                        / NULLIF(r.factor_to_base, 0::numeric), 6) AS qta_residua_operativa,
                  r.meta,
                  r.data_insert,
                  r.data_update,
                  -- Le due date di consegna: la RICHIESTA e' del cliente, la
                  -- CONFERMATA e' la nostra promessa (nullable: si decide alla conferma).
                  r.data_consegna_richiesta_cliente,
                  r.data_consegna_confermata,
                  -- Vero se la riga ha almeno un componente attivo.
                  (EXISTS (SELECT 1
                             FROM vendite.ordini_righe_componenti rc
                            WHERE rc.riga_ordine_id = r.id
                              AND rc.attivo IS TRUE)) AS is_composito_caso_a
                FROM vendite.ordini_righe r
                LEFT JOIN catalogo.articoli a ON a.id = r.articolo_id
                LEFT JOIN catalogo.unita_misura um ON um.id = r.uom_operativa_id
                LEFT JOIN config.iva iva ON iva.id = r.iva_id
                LEFT JOIN LATERAL (
                    SELECT sum(f.qta_evasa) AS qta_evasa_base
                      FROM vendite.ordini_righe_fulfillment f
                     WHERE f.ordine_riga_id = r.id
                ) ful ON true;

              COMMENT ON VIEW vendite.vw_ordini_righe_dettaglio IS
                  'Righe dell''ordine con articolo, UoM, IVA, evaso e residuo: la SORGENTE delle '
                  'righe per la lista configurabile vendite.ordine_righe e per il repository '
                  '(brief-db-liste-righe-documento, D-8.6, 2026-09-28; prima esistevano solo come '
                  'due query Python con proiezioni diverse). Tutte le righe, anche le non attive: il '
                  'filtro lo mette chi legge. Nessun ORDER BY. importo_riga = round(…, 2) per '
                  'mostrare, imponibile_riga_full pieno per chi aggrega, entrambi da '
                  'script.fn_imponibile_riga. qta_evasa_operativa / qta_residua_operativa: somma dei '
                  'fulfillment (UoM base) divisa per factor_to_base, residuo mai negativo, 6 '
                  'decimali, NULL se il fattore e'' zero. security_invoker: ordini_righe e i '
                  'fulfillment sono in RLS.';

              -- ⚠️ Nessun GRANT qui: il SELECT a zeroerp_app lo dà il loop dei
              --    grant, come per le altre viste di vendite (es. 20260917-06).
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_ordini_righe_dettaglio;
