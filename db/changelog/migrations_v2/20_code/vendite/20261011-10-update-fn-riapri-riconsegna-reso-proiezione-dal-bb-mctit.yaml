  - changeSet:
      id: 20261011-10-update-fn-riapri-riconsegna-reso-proiezione-dal-bb
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_riapri_riconsegna_reso: la proiezione dello stato dell'ordine passa al building block
        vendite.fn_ordine_proietta_stato_evasione. Brief: brief-db-ddt-righe-evase-dall-ordine.
      preConditions:
