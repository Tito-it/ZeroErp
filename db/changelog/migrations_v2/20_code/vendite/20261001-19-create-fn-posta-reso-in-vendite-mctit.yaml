# P-2 — Il posting del reso passa in vendite: il registro non conosce i suoi consumatori
#   vendite.fn_posta_reso(p_reso_id)
#   Brief: brief-db-magazzino-registro-anello-interno, sezioni 2 (D-2) e 3 (P-2)
#
# -- PERCHE' QUI ----------------------------------------------------------------------------------
#   Gemella di 20261001-18. magazzino.fn_posta_reso leggeva resi, resi_righe,
#   resi_righe_rientri, ddt_righe, ddt_righe_prelievi e ddt_righe_componenti:
#   il registro conosceva il reso. Il posting sta nel dominio che muove la
#   merce (D-2), con lo stesso nome.
#
# -- IL CORPO -------------------------------------------------------------------------------------
#   Dalla doc auto-generata di magazzino.fn_posta_reso (identica allo YAML
#   20260928-94 e al prosrc vivo, md5 confrontato il 2026-10-01). Firma,
#   RETURNS TABLE e DECLARE ancorati come nell'originale. Cambiano SOLO le
#   coordinate di chi solleva (area 'vendite', funzione 'vendite.fn_posta_reso')
#   e il codice del guard di parametro, E_VENDITE_CHIAMATA_NON_VALIDA (stessa
#   classe TECNICO, stesso testo, stessi valori). Carichi, costo dell'uscita
#   d'origine, sorgente, causale: identici.
#   ⚠️ La lettura di magazzino.movimenti (il costo dell'uscita) resta: e' un
#   consumatore che legge il registro, il verso giusto.
#
# -- RISERVATA ------------------------------------------------------------------------------------
#   Ci si arriva solo da vendite.fn_conferma_reso (DEFINER). Postura nelle tre
#   sedi come la gemella; magazzino.fn_posta_reso si ritira in 90_end/20261001-24.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261001-19-create-fn-posta-reso-in-vendite-mctit.yaml

  - changeSet:
      id: 20261001-19-create-fn-posta-reso-in-vendite
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_posta_reso(p_reso_id): il posting del reso, un carico CARICO_RESO_VEN per
        rientro al costo dell'uscita d'origine, nello schema del documento che muove la merce
        (D-2). Corpo identico a magazzino.fn_posta_reso, che si ritira in 90_end/20261001-24; il
        guard di parametro solleva E_VENDITE_CHIAMATA_NON_VALIDA. DEFINER, riservata al verbo
        del reso. Brief: brief-db-magazzino-registro-anello-interno, sezione 3 (P-2).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: resi_righe_rientri
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'magazzino' AND p.proname = 'fn_scrivi_movimento';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_posta_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS TABLE(movimento_id magazzino.movimenti.id%TYPE,
                             rientro_id   vendite.resi_righe_rientri.id%TYPE,
                             qta          magazzino.movimenti.qta%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              -- Scopo: scrivere i carichi di un reso, uno per rientro, alla conferma.
              --   Non ricontrolla: la primitiva e' la rete, la check della merce ha gia'
              --   parlato. Non crea rientri, non guarda lo stato: QUANDO lo decide il verbo.
              DECLARE
                  v_reso        vendite.resi%ROWTYPE;
                  v_sorgente_id config.sorgenti.id%TYPE;
                  v_prel_src_id config.sorgenti.id%TYPE;
                  v_costo       magazzino.movimenti.costo_unitario%TYPE;
                  v_rientro     record;
              BEGIN
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_reso',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'reso maggiore di zero', 'p_reso_id', p_reso_id),
                          NULL::uuid, 'vendite.fn_posta_reso', 'p_reso_id (obbligatorio, maggiore di zero)');
                  END IF;

                  SELECT r.* INTO v_reso FROM vendite.resi r WHERE r.id = p_reso_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_reso',
                          'E_RESO_NOT_FOUND', jsonb_build_object('reso_id', p_reso_id), NULL::uuid,
                          p_reso_id::text);
                  END IF;

                  SELECT s.id INTO v_sorgente_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'RESO_VENDITA_RIENTRO' AND s.attivo;
                  SELECT s.id INTO v_prel_src_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'DDT_VENDITA_PRELIEVO';
                  IF v_sorgente_id IS NULL OR v_prel_src_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_reso',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.sorgenti.RESO_VENDITA_RIENTRO / DDT_VENDITA_PRELIEVO'),
                          NULL::uuid, VARIADIC ARRAY['sorgenti RESO_VENDITA_RIENTRO (attiva) e DDT_VENDITA_PRELIEVO (config.sorgenti)']);
                  END IF;

                  FOR v_rientro IN
                      SELECT x.id, x.qta AS x_qta, x.ubicazione_id,
                             p.id AS prelievo_id, p.lotto_id, p.asset_id,
                             COALESCE(drc.componente_id, dr.articolo_id) AS articolo_id
                        FROM vendite.resi_righe_rientri x
                        JOIN vendite.resi_righe rr          ON rr.id = x.resi_riga_id
                        JOIN vendite.ddt_righe_prelievi p   ON p.id = x.ddt_riga_prelievo_id
                        JOIN vendite.ddt_righe dr           ON dr.id = p.ddt_riga_id
                        LEFT JOIN vendite.ddt_righe_componenti drc ON drc.id = p.ddt_riga_componente_id
                       WHERE rr.reso_id = p_reso_id
                         AND rr.attivo
                       ORDER BY rr.riga_nr, rr.id, p.ddt_riga_componente_id NULLS FIRST, x.id
                  LOOP
                      -- Il costo dell'USCITA d'origine (D-3b-e): la merce rientra al valore al
                      -- quale era uscita, e la media non si sposta per un andata-e-ritorno.
                      -- Uscita senza costo (NULL) -> NULL, e vale la media: regola della primitiva.
                      SELECT m.costo_unitario INTO v_costo
                        FROM magazzino.movimenti m
                       WHERE m.sorgente_tipo_id = v_prel_src_id
                         AND m.sorgente_riga = v_rientro.prelievo_id
                         AND m.qta < 0
                         AND m.storno_di_movimento_id IS NULL
                       ORDER BY m.id
                       LIMIT 1;

                      movimento_id := magazzino.fn_scrivi_movimento(
                          p_magazzino_id     => v_reso.magazzino_id,
                          p_articolo_id      => v_rientro.articolo_id,
                          p_causale          => 'CARICO_RESO_VEN',
                          p_qta              => v_rientro.x_qta,
                          p_sorgente_tipo_id => v_sorgente_id,
                          p_sorgente_riga    => v_rientro.id,
                          p_costo_unitario   => v_costo,
                          p_lotto_id         => v_rientro.lotto_id,
                          p_asset_id         => v_rientro.asset_id,
                          p_ubicazione_id    => v_rientro.ubicazione_id,
                          p_data_mov         => v_reso.data::timestamptz);
                      rientro_id := v_rientro.id;
                      qta        := v_rientro.x_qta;
                      RETURN NEXT;
                  END LOOP;
                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_posta_reso(vendite.resi.id%TYPE) IS
                  'Il posting di un reso: un carico per rientro (sorgente RESO_VENDITA_RIENTRO, D-3b-d), righe '
                  'attive, in ordine di riga e di rientro. Nel magazzino del reso, causale CARICO_RESO_VEN, '
                  'quantita'' positiva, articolo, lotto e seriale dal prelievo d''origine, ubicazione del '
                  'rientro, data del reso. Il costo e'' quello dell''USCITA del prelievo d''origine (sorgente '
                  'DDT_VENDITA_PRELIEVO, non uno storno: D-3b-e), passato alla primitiva come '
                  'p_costo_unitario: la merce rientra al valore al quale era uscita; uscita senza costo -> '
                  'NULL, e vale la media. Non ricontrolla (la primitiva e'' la rete, la check della merce ha '
                  'gia'' parlato), non crea rientri, non guarda lo stato: QUANDO lo decide il verbo. '
                  'SECURITY DEFINER, RISERVATA: ci si arriva solo da vendite.fn_conferma_reso. Ritorna '
                  '(movimento_id, rientro_id, qta). Sta in vendite e non in magazzino: chi muove merce '
                  'scrive il proprio posting e chiama la primitiva, il registro non legge le tabelle di un '
                  'documento (D-2). Fino al 2026-10-01 era magazzino.fn_posta_reso. Brief: '
                  'brief-db-magazzino-lotto-3-bis-carico-da-reso (P-7), '
                  'brief-db-magazzino-registro-anello-interno (P-2).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_posta_reso(vendite.resi.id%TYPE);
