# LA CATENA DELLE REVISIONI ESCE DALLA VISTA DI LISTA
#   Brief: brief-db-liste-datatable-grezze.md §3.2
#
#   `vw_offerte_commerciali_lista` porta `revisione_radice_id` (passi -03..-06):
#   il tab «Revisioni» dell'offerta legge la catena dalla vista canonica con
#   `WHERE v.revisione_radice_id = <radice dell'offerta aperta>`, come il
#   preventivo legge `vw_preventivi_lista WHERE numero = …` — e il backend
#   ritira la sua CTE ricorsiva (offerte_repository.list_revisioni).
#
#   Corpo preso dalla doc auto-generata (docs/it/dbzero/vendite/views/
#   vw_offerte_commerciali_lista.md), verificato identico alla vista viva il
#   2026-09-27 a meno della qualifica di schema. Unica modifica: la colonna in
#   ULTIMA posizione (CREATE OR REPLACE VIEW puo' solo appendere).
#   ⛔ `security_invoker=on` ri-specificata: CREATE OR REPLACE la azzererebbe.
#   Il COMMENT della vista resta quello di prima (sopravvive al REPLACE); la
#   colonna nuova ha il suo COMMENT.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260927-07-update-vw-offerte-lista-revisione-radice-mctit.yaml

  - changeSet:
      id: 20260927-07-update-vw-offerte-lista-revisione-radice
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_offerte_commerciali_lista espone revisione_radice_id (ultima colonna): la
        catena delle revisioni si legge dalla vista canonica. Brief:
        brief-db-liste-datatable-grezze.md §3.2.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: offerte_commerciali
            columnName: revisione_radice_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_offerte_commerciali_lista
              WITH (security_invoker=on) AS
              SELECT o.id,
                  o.uid,
                  o.codice,
                  o.revisione_numero,
                  o.revisione_padre_id,
                  ((NOT sdo.is_superato) AND (NOT sdo.is_abortito)) AS is_attiva,
                  (EXISTS ( SELECT 1
                         FROM vendite.offerte_commerciali figlio
                        WHERE (figlio.revisione_padre_id = o.id))) AS has_next_revisione,
                  o.stato_doc_offerta_id,
                  sdo.codice_interno AS stato_codice_interno,
                  sdo.descrizione AS stato_descrizione,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.istanza_utility_id,
                  iu.codice AS istanza_utility_codice,
                  o.listino_id,
                  l.codice AS listino_codice,
                  o.listino_versione_id,
                  lv.codice_versione AS listino_versione_codice,
                  o.tipo_variazione_globale,
                  o.valore_variazione_globale,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.validita_dal,
                  o.validita_al,
                  ((o.validita_al IS NOT NULL) AND (o.validita_al < CURRENT_DATE)) AS is_scaduta,
                  o.data_emissione,
                  o.data_accettazione,
                  o.data_rifiuto,
                  o.data_annullamento,
                  o.data_insert,
                  o.user_insert,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sdo.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  sdo.is_superato AS is_superata,
                  sdo.is_abortito,
                  lin.frontiera_natura_doc_codice_interno,
                  lin.frontiera_tipo_codice_interno,
                  o.revisione_radice_id
                 FROM ((((((((((((vendite.offerte_commerciali o
                   JOIN config.stati_doc_offerte sdo ON ((sdo.id = o.stato_doc_offerta_id)))
                   LEFT JOIN anagrafiche.istanze_utilities iu ON ((iu.id = o.istanza_utility_id)))
                   LEFT JOIN anagrafiche.soggetti s ON ((s.id = iu.soggetto_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = o.billing_account_id)))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = o.emittente_fiscale_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = ef.soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                   LEFT JOIN config.utilities u ON ((u.id = o.utility_id)))
                   LEFT JOIN vendite.listini l ON ((l.id = o.listino_id)))
                   LEFT JOIN vendite.listini_versioni lv ON ((lv.id = o.listino_versione_id)))
                   LEFT JOIN config.valute v_val ON ((v_val.id = o.valuta_id)))
                   LEFT JOIN vendite.vw_documento_lineage lin ON (((lin.tipo_id = ( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE (((sorgenti.codice_interno)::text = 'OFFERTA_COMMERCIALE'::text) AND (sorgenti.attivo IS TRUE)))) AND (lin.uid = (o.uid)::text))));

              COMMENT ON COLUMN vendite.vw_offerte_commerciali_lista.revisione_radice_id IS
                'Identita'' della catena delle revisioni (vendite.offerte_commerciali.revisione_radice_id): '
                'le revisioni della stessa offerta sono le righe con lo stesso valore. Gemello di `numero` '
                'su vw_preventivi_lista. Brief: brief-db-liste-datatable-grezze §3.2 (2026-09-27).';
      rollback:
        - sql:
            sql: |
              -- La colonna in coda non si toglie con un REPLACE: si ricrea la vista
              -- dal changeSet precedente (20260829-02) se serve davvero.
              SELECT 1;
