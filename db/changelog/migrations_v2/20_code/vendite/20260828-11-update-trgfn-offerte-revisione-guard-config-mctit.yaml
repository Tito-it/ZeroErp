# ------------------------------------------------------------
# CODA 1 — IL LOOKUP CHE NON DICE DI NON AVER TROVATO
#   vendite.trgfn_offerte_commerciali_revisione
#   Piano: brief-db-revisione-attiva-due-domande, §10
#   Segnalato dal BE il 2026-08-28.
#
# ── ⚠️ IL FATTO ──────────────────────────────────────────────────────
#   La funzione risolve lo stato di superamento cosi':
#       SELECT id INTO v_stato_superata_id
#         FROM config.stati_doc_offerte WHERE codice_interno = 'SUPERATA';
#   e poi lo scrive sul padre. ⛔ `SELECT ... INTO` **non solleva niente** se
#   non trova la riga: azzera la variabile. Con lo stato assente, v_… resta
#   NULL, l'UPDATE prova a scrivere NULL su `stato_doc_offerta_id` che e'
#   NOT NULL, e l'errore arriva — ma e' un 23502 di PostgreSQL, che nomina una
#   colonna e non dice **la cosa vera**: manca una riga di catalogo.
#   ⭐ Non e' un errore mancante, e' un errore che racconta la storia sbagliata:
#   chi legge va a cercare un bug nell'INSERT dell'offerta, non nel seed.
#
# ── ⭐ IL PRECEDENTE E' IN CASA, e nella funzione gemella ────────────
#   `vendite.fn_crea_revisione_offerta` fa lo **stesso** lookup (stato BOZZA)
#   e ce l'ha, il guard: `IF v_stato_bozza_id IS NULL THEN … E_CONFIG_MANCANTE`
#   con la frase «stato BOZZA non trovato in config.stati_doc_offerte». Qui si
#   applica la stessa forma, con lo stesso codice registrato (TECNICO, 500):
#   nessun codice nuovo da coniare, e le due meta' della stessa operazione
#   smettono di comportarsi in modo diverso davanti allo stesso guasto.
#
# ── ⭐ E il lookup passa al CATALOGO ─────────────────────────────────
#   Il letterale `codice_interno = 'SUPERATA'` diventa `is_superato IS TRUE`
#   (colonna aggiunta dal 20260828-07). Cosi' il trigger che **scrive** il
#   superamento e la vista che lo **legge** guardano la stessa dichiarazione:
#   prima erano due sedi, e uno stato nuovo sarebbe entrato in una sola.
#   ⚠️ Il guard e' sull'ARITA', non sulla sola assenza: con due stati marcati
#   `is_superato`, un `SELECT INTO` senza STRICT ne prenderebbe uno **a caso** e
#   il trigger sceglierebbe in silenzio. Zero e due sono lo stesso difetto —
#   il catalogo non dice quale — e vanno detti tutti e due.
#
# ⚠️ Definizione ripresa dalla doc auto-gen (l'oggetto VIVO). Le sole differenze
#   sono il lookup sul catalogo e il guard sull'arita'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260828-11-update-trgfn-offerte-revisione-guard-config-mctit.yaml

  - changeSet:
      id: 20260828-11-update-trgfn-offerte-revisione-guard-config
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        brief-db-revisione-attiva-due-domande §10 (segnalazione BE 2026-08-28): il lookup
        dello stato di superamento passa da codice_interno='SUPERATA' a is_superato IS TRUE
        (catalogo, 20260828-07) e acquisisce il guard sull'arita'. Prima un catalogo senza
        quello stato lasciava la variabile NULL e l'UPDATE falliva con un 23502 che nominava
        la colonna invece della riga di catalogo mancante; due stati marcati ne avrebbero
        fatto scegliere uno a caso. Ora E_CONFIG_MANCANTE (TECNICO), stessa forma del guard
        gemello in fn_crea_revisione_offerta.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM information_schema.columns
                 WHERE table_schema = 'config'
                   AND table_name   = 'stati_doc_offerte'
                   AND column_name  = 'is_superato'
          # ⛔ 2026-09-02 — RIMOSSA la preCondition su config.codici_errore (codice = 'E_CONFIG_MANCANTE').
          #    `20_code` gira PRIMA di `80_data`: su un database ricostruito da zero
          #    — cioe' in CI — la riga cercata NON esiste ancora, e il migrate muore
          #    con «SQL Precondition failed. Expected '1' got '0'». Non e' un caso di
          #    bordo: e' l'UNICO modo in cui un seed nuovo puo' arrivare.
          #    Un codice errore si nomina come STRINGA e si risolve solo quando l'errore
          #    viene sollevato, cioe' a runtime.
          #    ⛔ Regola: docs/it/linee-guida-sql.md §11.4. Restano legittime le
          #    preCondition su cio' che viene PRIMA (tableExists, columnExists,
          #    pg_proc, arita'); quelle sul CONTENUTO di 80_data no.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_offerte_commerciali_revisione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: al momento dell'INSERT di una rev.N+1 (revisione_padre_id NOT NULL),
              -- porta la rev.N precedente nello stato di superamento tramite UPDATE diretto.
              -- L'UPDATE riattiva il guard _a10_ sulla stessa tabella: la transizione
              -- EMESSA->SUPERATA e' ammessa in config.stati_doc_offerte_transizioni (Step 4).
              -- Nota O4: l'UPDATE riguarda una riga diversa da quella inserita, nessuna
              -- autoricorsione ne' conflitto intra-transazione.
              -- rev 2026-08-28: lookup dal catalogo (is_superato) + guard sull'arita'.
              DECLARE
                  v_stato_superata_id config.stati_doc_offerte.id%TYPE;
                  v_n_stati           integer;
              BEGIN
                  -- Se non e' una revisione (prima rev.), niente da fare.
                  IF NEW.revisione_padre_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- Risolve lo stato di superamento dalla DICHIARAZIONE di catalogo
                  -- (config.stati_doc_offerte.is_superato), non da un letterale: e' la
                  -- stessa colonna che vw_offerte_commerciali_lista legge per is_superata.
                  SELECT count(*), min(s.id)
                    INTO v_n_stati, v_stato_superata_id
                    FROM config.stati_doc_offerte s
                   WHERE s.is_superato IS TRUE
                     AND s.attivo      IS TRUE;

                  -- ⛔ Guard sull'ARITA', non sulla sola assenza. Senza, con zero righe la
                  -- variabile resta NULL e l'UPDATE fallisce con un 23502 che nomina la
                  -- colonna invece della configurazione; con due righe un SELECT INTO senza
                  -- STRICT ne sceglierebbe una a caso, in silenzio. Il catalogo deve dire
                  -- esattamente uno stato di superamento, o non sta dicendo niente.
                  IF v_n_stati <> 1 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object(
                              'tabella',  'config.stati_doc_offerte',
                              'colonna',  'is_superato',
                              'attesi',   1,
                              'trovati',  v_n_stati
                          ),
                          NEW.tx_id,
                          'config.stati_doc_offerte: atteso esattamente uno stato attivo '
                          || 'con is_superato = true, trovati ' || v_n_stati::text
                      );
                  END IF;

                  -- Porta la revisione padre nello stato di superamento.
                  -- Il guard _a10_ verifica che EMESSA->SUPERATA sia transizione ammessa.
                  UPDATE vendite.offerte_commerciali
                     SET stato_doc_offerta_id = v_stato_superata_id
                   WHERE id = NEW.revisione_padre_id;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_offerte_commerciali_revisione()
              IS 'AFTER INSERT su offerte_commerciali: se revisione_padre_id IS NOT NULL, porta la '
                 'revisione padre nello stato di superamento. Lo stato si risolve dalla dichiarazione '
                 'di catalogo config.stati_doc_offerte.is_superato (rev 2026-08-28) — la stessa che '
                 'la vista di lista legge — e non piu'' da un letterale. Guard sull''ARITA'': se gli '
                 'stati marcati non sono esattamente uno, E_CONFIG_MANCANTE; prima zero righe '
                 'lasciavano la variabile NULL e l''errore era un 23502 che nominava la colonna '
                 'invece della riga di catalogo. Innesca il guard _a10_ (EMESSA->SUPERATA ammessa in '
                 'stati_doc_offerte_transizioni). Nota O4: agisce su riga diversa dall''INSERT '
                 'scatenante, nessun conflitto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristina la definizione viva pre-fix (lookup per letterale, senza guard).
              CREATE OR REPLACE FUNCTION vendite.trgfn_offerte_commerciali_revisione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_superata_id config.stati_doc_offerte.id%TYPE;
              BEGIN
                  IF NEW.revisione_padre_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT id INTO v_stato_superata_id
                    FROM config.stati_doc_offerte
                   WHERE codice_interno = 'SUPERATA';

                  UPDATE vendite.offerte_commerciali
                     SET stato_doc_offerta_id = v_stato_superata_id
                   WHERE id = NEW.revisione_padre_id;

                  RETURN NEW;
              END;
              $function$;
