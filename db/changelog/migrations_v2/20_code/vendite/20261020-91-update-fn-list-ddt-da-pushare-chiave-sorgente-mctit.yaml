# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2e (G-8, L2e-2 = (a)): il lister delle bolle compone la chiave col BB
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-8, §13.3.
#
#   I lister della push verso la commessa restituiscono la chiave d'idempotenza di ogni riga:
#   ora la compone script.fn_segment_key (20261020-65) col codice della sorgente come prefisso
#   (DDT -> DDT_VENDITA), anche dove la si confronta con fn_get_stato_push_segment. La chiave e' la stessa
#   espressione nei due punti, per costruzione.
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. Firma e RETURNS TABLE ricostruiti dal catalogo e ancorati con %TYPE dove una colonna
#   con lo stesso nome e lo stesso tipo esiste (verificato); nudi, col motivo, i valori calcolati.
#   ⚠️ Le chiavi gia' scritte nei dati di dbdev si convertono con lo SQL una tantum del giro.
# ------------------------------------------------------------

