                  x.d_uid,
                  x.dr_id,
                  x.ba_id,
                  x.ba_utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(x.ba_id),
                  x.d_data,
                  x.d_data,
                  -- Corsia di instradamento: valore reale del DDT.
                  x.d_fatt_immediata,
                  v_sorgente_tipo_id,
                  x.d_uid::text,
                  ('DDT:' || x.d_uid::text || ':R:' || x.dr_id::text)::varchar,
                  x.dr_articolo,
                  x.ba_istanza,
                  x.d_data,
                  x.a_uom,
                  -- La quantita' da fatturare E' la dose della diagnosi.
                  x.quantita_push,
                  -- qta_operativa scalata proporzionalmente (ratio = 1 se nessuna riduzione)
                  x.dr_qta_op * (x.quantita_push / NULLIF(x.dr_quantita, 0)),
                  x.dr_uom_op,
                  COALESCE(x.dr_factor, 1::numeric),
                  date_trunc('month', x.d_data)::date,
                  COALESCE(x.dr_prezzo, x.src_prezzo_unitario),
                  -- prezzo_bloccato: dipende dal PREZZO della riga,
                  -- INDIPENDENTE dal flag di corsia.
                  (COALESCE(x.dr_prezzo, x.src_prezzo_unitario) IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  COALESCE(x.d_valuta, x.src_valuta_id),
                  jsonb_build_object(
                    'ddt_numero',          x.d_numero,
                    'ddt_anno',            x.d_anno,
                    'ddt_serie',           x.d_serie,
                    'ordine_sorgente_uid', x.src_ordine_uid,
                    'ordine_fatturaz_trg', x.src_fatturazione_trigger,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM cand x
                ORDER BY x.d_id, x.dr_id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_ddt_da_pushare(date,bigint,integer,bigint) IS
                'rev 2026-09-21 (D14, seconda leva, forma B2): il lister DERIVA da vendite.fn_ddt_push_diagnosi — FROM fn_ddt_push_diagnosi(p_ddt_id) WHERE motivo IS NULL — e aggiunge solo i filtri di chiamata (competenza, BA, limit) e la proiezione dei 31 campi; BA, riga d''ordine sorgente e DOSE (quantita_push) li riceve dalla diagnosi. L''eleggibilita'' sta scritta in UN posto: un predicato nuovo si aggiunge alla diagnosi come rank, non qui. Contratto verso la pipeline invariato, stesse righe e stesse quantita'' per costruzione. rev 2026-09-21 (D14, quarta leva): la partita si legge da vendite.fn_partite_merce con il DDT chiesto come SEME (la chiusura del documento, non le partite di tutti); p_ddt_id NULL (lista push, cockpit) = tutte. Lista righe DDT eligible al push su commessa. rev 2026-08-17 (partita generalizzata S5): la quantita'' da fatturare e'' la DIFFERENZA della partita di merce, gia'' per riga di DDT — spariscono la ridistribuzione greedy della differenza d''ordine e il caso speciale standalone/compositi. ⚠️ Una partita NON MISURABILE non viene spinta (rank 9 della diagnosi). ⚠️ Nota per la nota di credito: quando una RETTIFICA abbassera'' il fatturato, la differenza tornera'' positiva e solo script.fn_get_stato_push_segment = LIBERA (rank 4) impedira'' la ri-spinta. rev 2026-07-18 (step 5b): esclude i DDT con causale di trasporto NON fatturabile (DL-28). rev 2026-07-18 (step 5): eleggibilita'' order-backed DALLO stato-trigger IN POI, cintura XOR != CONFERMATO PRESERVATA. rev 2026-06-28: sorgente/stato per codice_interno. rev 2026-07-19: esclusione su ALLOCAZIONE via fn_get_stato_push_segment. rev 2026-07-27: fatturazione_immediata dalla colonna. Espone termine_pagamento_id e modalita_pagamento_id a NULL (rev 2026-08-03, T.1). rev 2026-10-13 (20261013-21): tipo_consumo RITIRATO in tutta la catena del push (madre, batch, cinque lister, builder pgTAP). Non aveva un lettore, e il vocabolario della madre (ACCONTO/CONGUAGLIO/STORNO) non lo produceva nessuna sorgente con un significato: preventivi, ordini e DDT scrivevano la costante CONGUAGLIO, contratti (l''erogazione della riga) e consumi (CONSUMO) un valore che la madre rifiutava, quindi il loro push falliva sempre (E_PARAMETRO_INVALIDO). L''erogazione resta dove gia'' stava, in meta.tipo_erogazione. Decisione A di Tid, 2026-10-13. Colonna tipo_consumo tolta dal RETURNS TABLE (DROP + CREATE).';
