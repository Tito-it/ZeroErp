# R-4 — 3 di 5. La seconda vista che il brief dava per «eredita», e la piu'
# insidiosa delle cinque.
#
# ⚠️ 🔴 QUI IL PROBLEMA E' DOPPIO.
#
#    (a) Come per la «Situazione aperta» (-62), questa e' una vista separata
#        con proiezione a colonne ESPLICITE: la colonna aggiunta a monte non
#        arriva da sola, va elencata. E il backend legge QUESTA.
#
#    (b) ⭐ E in piu' questa vista non e' solo una lente sulla union dei
#        documenti: e' essa stessa una UNION di TRE rami, e due sono i RESI —
#        che nella union non hanno `emittente_soggetto_ruolo_id` (li' e'
#        NULL::bigint) ma hanno `emittente_fiscale_id`. Risolvere il nome solo
#        dal soggetto_ruolo avrebbe lasciato la colonna VUOTA su tutto il
#        blocco resi: non una riga sbagliata, una CATEGORIA intera muta. E
#        siccome i resi sono una minoranza delle righe, sarebbe passata per
#        «qualche riga senza emittente» invece che per un ramo mai risolto.
#
# ⭐ LA CURA E' UNA SOLA CATENA, non due. `emittenti_fiscali.soggetto_ruolo_id`
#    e' NOT NULL con UNIQUE: fra emittente fiscale e soggetto-ruolo c'e' una
#    corrispondenza uno-a-uno. Quindi basta un COALESCE sulla CHIAVE — prima il
#    soggetto_ruolo se c'e', altrimenti quello dedotto dall'emittente fiscale —
#    e la risoluzione del nome resta scritta una volta. L'alternativa (due
#    catene di JOIN e un COALESCE sul NOME) avrebbe funzionato uguale ma
#    lasciato due posti da tenere allineati.
#
# ⚠️ NON si tocca `emittente_soggetto_ruolo_id` sui rami resi: resta NULL come
#    oggi. Valorizzarla sarebbe un miglioramento vero, ma e' un cambio di
#    semantica di una colonna ESISTENTE, e non e' quello che chiede R-4. Va
#    deciso a parte.
#
# ⚠️ Ordine: numero maggiore di -61, che crea la colonna a monte.
# ⚠️ security_invoker = on va RI-SPECIFICATA o PostgreSQL la azzera.
#
# brief-db-perimetro-emittente-fase-e-e-ricerca.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-63-update-vw-dash-backlog-documenti-emittente-mctit.yaml

  - changeSet:
      id: 20260818-63-update-vw-dash-backlog-documenti-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        R-4 (3 di 5): `emittente_ragione_sociale` in coda a
        vw_dash_backlog_documenti. ⚠️ Non era nel brief (dato per «eredita») e
        ha un secondo strato: la vista e' una UNION di tre rami e i due rami
        RESI non hanno emittente_soggetto_ruolo_id (NULL) ma hanno
        emittente_fiscale_id. Risolvere solo dal soggetto-ruolo avrebbe
        lasciato muto tutto il blocco resi. Si risolve con un COALESCE sulla
        CHIAVE, sfruttando l'uno-a-uno emittenti_fiscali.soggetto_ruolo_id
        (NOT NULL + UNIQUE): una sola catena di JOIN. Brief Fase E, R-4.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM information_schema.columns
                 WHERE table_schema = 'vendite'
                   AND table_name = 'vw_dash_fatturazione_documenti'
                   AND column_name = 'emittente_ragione_sociale';
          - tableExists:
              schemaName: anagrafiche
              tableName: emittenti_fiscali
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_backlog_documenti
              WITH (security_invoker=on) AS
              WITH base AS (
                       SELECT d.area,
                          d.competenza_mese,
                          d.documento_id,
                          d.documento_uid,
                          d.codice,
                          d.cliente_display,
                          d.emittente_fiscale_id,
                          d.emittente_soggetto_ruolo_id,
                          (d.valore_totale - d.valore_transitato) AS valore_fermo,
                          (d.unita_totali - d.unita_transitate) AS unita_ferme,
                          d.motivo_fermo,
                          d.data_riferimento,
                          d.stato_codice_interno,
                          d.stato_codice,
                          d.fase
                         FROM vendite.vw_dash_fatturazione_documenti d
                        WHERE (d.motivo_fermo IS NOT NULL)
                      UNION ALL
                       -- ⚠️ Ramo RESI: emittente_soggetto_ruolo_id NULL, ma
                       --   emittente_fiscale_id valorizzato. La colonna resta
                       --   NULL come oggi (non e' questo il changeSet che la
                       --   cambia); il NOME si risolve comunque, fuori, via
                       --   emittente_fiscale_id.
                       SELECT 'RESI'::character varying AS area,
                          (date_trunc('month'::text, (q.data)::timestamp with time zone))::date AS competenza_mese,
                          q.reso_id AS documento_id,
                          (q.reso_uid)::text AS documento_uid,
                          (q.reso_numero)::text AS codice,
                          q.destinatario_denominazione AS cliente_display,
                          q.emittente_fiscale_id,
                          NULL::bigint AS emittente_soggetto_ruolo_id,
                          NULL::numeric AS valore_fermo,
                          (count(*))::integer AS unita_ferme,
                          'RICONSEGNA_NON_ESEGUITA'::character varying AS motivo_fermo,
                          q.data AS data_riferimento,
                          sdr.codice_interno AS stato_codice_interno,
                          sdr.codice AS stato_codice,
                          sdr.fase
                         FROM ((vendite.vw_resi_da_riconsegnare q
                           JOIN vendite.resi r2 ON ((r2.id = q.reso_id)))
                           JOIN config.stati_doc_reso sdr ON ((sdr.id = r2.stato_doc_reso_id)))
                        GROUP BY q.reso_id, q.reso_uid, q.reso_numero, q.data, q.destinatario_denominazione, q.emittente_fiscale_id, sdr.codice_interno, sdr.codice, sdr.fase
                      UNION ALL
                       SELECT 'RESI'::character varying AS area,
                          (date_trunc('month'::text, (a.data)::timestamp with time zone))::date AS competenza_mese,
                          a.reso_id AS documento_id,
                          (a.reso_uid)::text AS documento_uid,
                          (a.reso_numero)::text AS codice,
                          a.destinatario_denominazione AS cliente_display,
                          a.emittente_fiscale_id,
                          NULL::bigint AS emittente_soggetto_ruolo_id,
                          NULL::numeric AS valore_fermo,
                          (count(*))::integer AS unita_ferme,
                          'MERCE_RESA_GIA_FATTURATA'::character varying AS motivo_fermo,
                          a.data AS data_riferimento,
                          sdr.codice_interno AS stato_codice_interno,
                          sdr.codice AS stato_codice,
                          sdr.fase
                         FROM ((vendite.vw_resi_da_accreditare a
                           JOIN vendite.resi r3 ON ((r3.id = a.reso_id)))
                           JOIN config.stati_doc_reso sdr ON ((sdr.id = r3.stato_doc_reso_id)))
                        WHERE ((a.etichetta)::text = 'DOVUTA'::text)
                        GROUP BY a.reso_id, a.reso_uid, a.reso_numero, a.data, a.destinatario_denominazione, a.emittente_fiscale_id, sdr.codice_interno, sdr.codice, sdr.fase
                      )
               SELECT b.area,
                  b.competenza_mese,
                  b.documento_id,
                  b.documento_uid,
                  b.codice,
                  b.cliente_display,
                  b.emittente_fiscale_id,
                  b.emittente_soggetto_ruolo_id,
                  b.valore_fermo,
                  b.unita_ferme,
                  b.motivo_fermo,
                  COALESCE(mf.classe, 'ANOMALIA'::character varying) AS classe,
                  mf.azione,
                  b.data_riferimento,
                  (CURRENT_DATE - b.data_riferimento) AS anzianita_giorni,
                  b.stato_codice_interno,
                  b.stato_codice,
                  b.fase,
                  -- R-4: il nome dell'emittente, risolto per TUTTI e tre i rami.
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale
                 FROM (base b
                   LEFT JOIN config.motivi_fermo mf ON ((((mf.codice_interno)::text = (b.motivo_fermo)::text) AND (mf.attivo IS TRUE))))
                   -- ⚠️ Il COALESCE sta sulla CHIAVE, non sul nome, ed e' la
                   --   ragione per cui la catena di JOIN resta una sola:
                   --   emittenti_fiscali.soggetto_ruolo_id e' NOT NULL + UNIQUE,
                   --   quindi i due modi di indicare l'emittente (soggetto-ruolo
                   --   nei documenti, id fiscale nei resi) portano allo stesso
                   --   soggetto-ruolo. Si normalizza li' e si risolve una volta.
                   LEFT JOIN anagrafiche.emittenti_fiscali ef
                          ON ef.id = b.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef
                          ON sr_ef.id = COALESCE(b.emittente_soggetto_ruolo_id, ef.soggetto_ruolo_id)
                   LEFT JOIN anagrafiche.soggetti s_ef
                          ON s_ef.id = sr_ef.soggetto_id
                WHERE ((COALESCE(mf.classe, 'ANOMALIA'::character varying))::text <> 'FISIOLOGICO'::text);

              COMMENT ON VIEW vendite.vw_dash_backlog_documenti IS
                  'Backlog fatturazione (lente 2). rev 2026-07-18 (step 9, DL-24): la vista E'' '
                  'una UNION — ramo documenti (da vw_dash_fatturazione_documenti, invariato) + '
                  'DUE rami resi a grana (reso x motivo): RICONSEGNA_NON_ESEGUITA '
                  '(RECUPERABILE) da vw_resi_da_riconsegnare e MERCE_RESA_GIA_FATTURATA da '
                  'vw_resi_da_accreditare con etichetta DOVUTA (le facoltative sono opzione, '
                  'non arretrato). I resi NON stanno nella union pre-commessa: REVERSE_FLOW. '
                  'Misura a conteggi (DL-11): valore_fermo NULL, mai 0. Classe/azione risolte '
                  'UNA volta a valle su config.motivi_fermo, filtro classe <> FISIOLOGICO per '
                  'tutti i rami. Deroga dichiarata: unica area dove un documento (reso misto) '
                  'puo'' comparire due volte. security_invoker=on + RLS. '
                  '⭐ Rev 2026-08-18 (R-4, brief perimetro-emittente Fase E): aggiunta in coda '
                  '`emittente_ragione_sociale`. ⚠️ Due trappole, entrambe silenziose: (1) la '
                  'proiezione e'' a colonne esplicite, quindi la colonna NON si eredita dalla '
                  'vista a monte — va elencata, e il backend legge questa; (2) i due rami RESI '
                  'non hanno emittente_soggetto_ruolo_id (NULL) ma hanno emittente_fiscale_id: '
                  'risolvere solo dal soggetto-ruolo avrebbe lasciato muto l''INTERO blocco '
                  'resi, che essendo minoritario sarebbe passato per «qualche riga senza '
                  'emittente». Si risolve con un COALESCE sulla CHIAVE '
                  '(emittente_soggetto_ruolo_id, altrimenti emittenti_fiscali.soggetto_ruolo_id, '
                  'che e'' NOT NULL + UNIQUE): una sola catena di JOIN, un solo posto da '
                  'tenere allineato. ⚠️ emittente_soggetto_ruolo_id sui rami resi resta NULL '
                  'come prima: valorizzarla e'' un cambio di semantica di una colonna '
                  'esistente e va deciso a parte.';
      rollback:
        - sql:
            sql: |
              -- Nessun rollback automatico: rimuovere una colonna da una vista
              -- richiede DROP + ricreazione della catena a valle.
              SELECT 1;
