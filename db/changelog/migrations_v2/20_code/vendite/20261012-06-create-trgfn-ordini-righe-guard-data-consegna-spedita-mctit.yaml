# ------------------------------------------------------------
# LA DATA DI CONSEGNA CONFERMATA DI UNA RIGA GIA' SPEDITA E' FERMA
#   vendite.trgfn_ordini_righe_guard_data_consegna_spedita()
#   + trg_ordini_righe_a10_guard_data_consegna_spedita_upd
#   Brief: brief-db-date-consegna-righe-in-blocco (D-7, P-1, §4.2)
#
# -- IL CASO --------------------------------------------------------
#   Il lock delle righe (vendite.trgfn_doc_righe_lock_fuori_bozza) lascia
#   cambiare data_consegna_confermata in CONFERMATO e PARZIALMENTE_EVASO
#   guardando lo stato della TESTATA. In PARZIALMENTE_EVASO una riga gia'
#   partita con un DDT riceveva una data nuova: la promessa riscritta dopo la
#   consegna. D-7 di Tid: la data di consegna si scrive prima di spedire; P-1:
#   basta un DDT confermato, anche per una parte della riga.
#
# -- LA FORMA (linee-guida-sql §12.5.2) -------------------------------------
#   Il guard non contiene il predicato: CHIAMA
#   script.fn_check_ordine_riga_data_consegna_confermata e ne solleva il primo
#   motivo con script.fn_raise_primo_motivo_se_presente. La stessa check
#   spegne il pulsante nella vista del dettaglio righe e guida la selezione
#   dell'utility in blocco: guard e capability non possono divergere.
#   La check legge per id la riga che sta cambiando, cioe' OLD: va bene,
#   perche' non giudica la data nuova ma i legami della riga e lo stato del
#   suo ordine, che questo UPDATE non tocca.
#
# -- PERCHE' «WHEN» E NON «UPDATE OF» -----------------------------------------
#   Il guard reagisce a un CAMBIO di valore (linee-guida-trigger): con
#   UPDATE OF scatterebbe anche su un SET allo stesso valore, che non cambia
#   nessuna promessa. data_consegna_confermata non ha scrittori automatici
#   sulla tabella.
#   Fascia _a10_: dopo il lock fuori bozza (_a05_), che in uno stato che non
#   ammette la data parla per primo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261012-06-create-trgfn-ordini-righe-guard-data-consegna-spedita-mctit.yaml

  - changeSet:
      id: 20261012-06-create-trgfn-ordini-righe-guard-data-consegna-spedita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_ordini_righe_guard_data_consegna_spedita: la data di consegna confermata di una
        riga d'ordine gia' partita con un DDT (anche in parte) non cambia
        (E_ORDINE_RIGA_DATA_CONSEGNA_SPEDITA). Brief: brief-db-date-consegna-righe-in-blocco (D-7, P-1).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_ordine_riga_data_consegna_confermata';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                   WHERE t.tgrelid = 'vendite.ordini_righe'::regclass
                     AND t.tgname = 'trg_ordini_righe_a10_guard_data_consegna_spedita_upd';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.trgfn_ordini_righe_guard_data_consegna_spedita()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: la data di consegna confermata di una riga d'ordine gia'
              --   partita con un DDT, anche in parte, non cambia (D-7, P-1 di
              --   brief-db-date-consegna-righe-in-blocco). La regola sta in
              --   script.fn_check_ordine_riga_data_consegna_confermata: qui si
              --   solleva il suo primo motivo.
              -- Uso: BEFORE UPDATE FOR EACH ROW WHEN la data cambia, fascia _a10_.
              -- =========================================================
              BEGIN
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      script.fn_check_ordine_riga_data_consegna_confermata(OLD.id),
                      'data_consegna_confermata',
                      NEW.tx_id,
                      jsonb_build_object('ordine_riga_id', OLD.id,
                                         'ordine_id',      OLD.ordine_id));
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ordini_righe_guard_data_consegna_spedita() IS
                  'Guard (2026-10-11, brief-db-date-consegna-righe-in-blocco D-7, P-1): la data di consegna confermata di una riga d''ordine gia'' partita con un DDT uscito dalla bozza, anche per una parte della riga, non cambia piu'': la data di consegna si scrive prima di spedire. Prima il lock delle righe la lasciava cambiare in PARZIALMENTE_EVASO guardando solo lo stato della testata. Il predicato non sta qui (linee-guida-sql §12.5.2): solleva con script.fn_raise_primo_motivo_se_presente il primo motivo di script.fn_check_ordine_riga_data_consegna_confermata, la stessa check che spegne il pulsante (vendite.vw_ordini_righe_dettaglio.data_consegna_confermata_blocco). Codice E_ORDINE_RIGA_DATA_CONSEGNA_SPEDITA (CONFLITTO_STATO), campo data_consegna_confermata. BEFORE UPDATE con WHEN sul cambio di valore, fascia _a10_ dopo il lock fuori bozza (_a05_).';

              CREATE TRIGGER trg_ordini_righe_a10_guard_data_consegna_spedita_upd
                BEFORE UPDATE ON vendite.ordini_righe
                FOR EACH ROW
                WHEN (OLD.data_consegna_confermata IS DISTINCT FROM NEW.data_consegna_confermata)
                EXECUTE FUNCTION vendite.trgfn_ordini_righe_guard_data_consegna_spedita();

              COMMENT ON TRIGGER trg_ordini_righe_a10_guard_data_consegna_spedita_upd ON vendite.ordini_righe IS
                  'Data di consegna confermata ferma su una riga gia'' partita con un DDT, anche in parte (E_ORDINE_RIGA_DATA_CONSEGNA_SPEDITA). Scatta solo quando la data cambia (WHEN). Fascia _a10_, dopo il lock fuori bozza (_a05_). Brief: brief-db-date-consegna-righe-in-blocco (D-7, P-1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ordini_righe_a10_guard_data_consegna_spedita_upd ON vendite.ordini_righe;
              DROP FUNCTION IF EXISTS vendite.trgfn_ordini_righe_guard_data_consegna_spedita();
