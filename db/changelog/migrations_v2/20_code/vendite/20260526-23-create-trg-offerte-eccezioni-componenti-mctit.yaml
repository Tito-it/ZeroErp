# Trigger su vendite.offerte_commerciali_eccezioni_componenti e
# trigger propaga_qta su vendite.offerte_commerciali_eccezioni.
#
# Tutti i trigger (tranne audit e tx_id) sono wrapper delle helper
# generiche script.* (pattern identico a contratti_righe_componenti).
#
# Parametri trigger generici:
#   guard_bom_coerenza:  ('vendite','offerte_commerciali_eccezioni',
#                         'eccezione_offerta_id','offerte_commerciali',
#                         'offerta_id','validita_dal')
#   calcola_quantita:    ('vendite','offerte_commerciali_eccezioni',
#                         'eccezione_offerta_id')
#   ricalcola_padre:     ('vendite','offerte_commerciali_eccezioni',
#                         'offerte_commerciali_eccezioni_componenti',
#                         'eccezione_offerta_id')
#   propaga_qta (padre): ('vendite',
#                         'offerte_commerciali_eccezioni_componenti',
#                         'eccezione_offerta_id')
#   guard_pending:       ('eccezione_offerta_id')  [generico script.*]
#
# Ordine esecuzione su eccezioni_componenti (lessicografico):
#   BEFORE: _a10_guard_bom_coerenza
#           _a10_guard_obbligatorio (UPDATE OF attivo)
#           _a10_guard_pending      (UPDATE, generico)
#           _a10_prezzo_obbligatorio
#           _m50_calcola_quantita
#           audit_data_user
#           gen_tx_id
#   AFTER:  _a10_articoli_require_attivo
#           _a10_iva_require_attivo
#           _z90_ricalcola_padre
#
# Trigger aggiuntivi su offerte_commerciali_eccezioni (padre):
#   AFTER UPDATE OF quantita: _z90_propaga_qta_componenti
#
# Aggiornamento contratti:
#   Il trigger guard_pending su contratti_righe_componenti viene
#   aggiornato per usare script.trgfn_componenti_guard_pending
#   (generico, 20260526-02) al posto di vendite.trgfn_contratti_righe_componenti_guard_pending.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260526-23-create-trg-offerte-eccezioni-componenti-mctit.yaml

  # --- BEFORE INSERT OR UPDATE: guard coerenza BoM ----------------------
  - changeSet:
      id: 20260526-23-01-trg-oce-comp-a10-guard-bom
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE INSERT OR UPDATE: guard coerenza BoM CASO A su
        offerte_commerciali_eccezioni_componenti tramite
        script.trgfn_componenti_guard_coerenza_bom.
        col_data_testata = 'validita_dal' (offerte_commerciali.validita_dal date).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: offerte_commerciali_eccezioni_componenti
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'trgfn_componenti_guard_coerenza_bom';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_oce_comp_a10_guard_bom_coerenza_ins_upd
                  ON vendite.offerte_commerciali_eccezioni_componenti;

              CREATE TRIGGER trg_oce_comp_a10_guard_bom_coerenza_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON vendite.offerte_commerciali_eccezioni_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_guard_coerenza_bom(
                      'vendite',
                      'offerte_commerciali_eccezioni',
                      'eccezione_offerta_id',
                      'offerte_commerciali',
                      'offerta_id',
                      'validita_dal'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_oce_comp_a10_guard_bom_coerenza_ins_upd
                  ON vendite.offerte_commerciali_eccezioni_componenti;

