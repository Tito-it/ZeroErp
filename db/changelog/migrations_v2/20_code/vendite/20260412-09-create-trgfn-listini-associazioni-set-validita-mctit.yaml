# Migrazione daterange: trigger sync validita per listini_associazioni.
# Usa la funzione generica script.trgfn_set_validita().
# Vedi: migrazione-daterange.md §4.3
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260412-09-create-trgfn-listini-associazioni-set-validita-mctit.yaml

  - changeSet:
      id: 20260412-09-create-trgfn-listini-associazioni-set-validita
      author: mctit
      runOnChange: false
      comment: >
        Crea trigger sync validita su vendite.listini_associazioni usando
        la funzione generica script.trgfn_set_validita().
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger sync validita per vendite.listini_associazioni
              -- Usa la funzione generica script.trgfn_set_validita()
              DROP TRIGGER IF EXISTS trg_listini_associazioni_a20_set_validita_ins_upd ON vendite.listini_associazioni;

              CREATE TRIGGER trg_listini_associazioni_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON vendite.listini_associazioni
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();
