databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260222-08-fix-trgfn-attivita-guard-log-variadic-casts-mctit.yaml

  - changeSet:
      id: 20260222-08-01-update-trgfn-attivita-guard-ba-coerenza-log-casts
      author: mctit
      comment: "Fix chiamate fn_log_and_raise_error in trgfn_attivita_fatturabili_guard_ba_coerenza (variadic text)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_iu_id anagrafiche.billing_account.istanza_utility_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Validare coerenza tra billing_account e istanza_utility
                --   sulle righe attivita_fatturabili.
                --
                -- Regole:
                --   - se billing_account_id e` valorizzato, deve esistere
                --   - istanza_utility_id deve coincidere con quella del BA
                --   - variadic su fn_log_and_raise_error sempre testuali
                -- =========================================================

                IF NEW.billing_account_id IS NOT NULL THEN
                  SELECT b.istanza_utility_id
                    INTO v_iu_id
                    FROM anagrafiche.billing_account b
                   WHERE b.id = NEW.billing_account_id;

                  IF NOT FOUND THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'attivita_fatturabili',
                      'E_PARAMETRI_TABELLA',
                      jsonb_build_object(
                        'context','validazione billing_account_id',
                        'billing_account_id', NEW.billing_account_id
                      ),
                      NULL::uuid,
                      'billing_account', NEW.billing_account_id::text
                    );
                  END IF;

                  IF NEW.istanza_utility_id IS DISTINCT FROM v_iu_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'attivita_fatturabili',
                      'E_COERENZA_ID',
                      jsonb_build_object(
                        'context','validazione istanza_utility_id',
                        'istanza_utility_id', NEW.istanza_utility_id,
                        'billing_account_id', NEW.billing_account_id,
                        'istanza_utility_attesa', v_iu_id
                      ),
                      NULL::uuid,
                      'istanza_utility_id', COALESCE(NEW.istanza_utility_id::text, 'NULL'),
                      'billing_account', NEW.billing_account_id::text
                    );
                  END IF;
                END IF;

                RETURN NEW;
              END
              $$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza()
              IS 'Valida coerenza BA/istanza_utility su attivita_fatturabili; variadic error helper normalizzati a text.';

  - changeSet:
      id: 20260222-08-02-update-trgfn-attivita-guard-fonte-log-casts
      author: mctit
      comment: "Fix chiamate fn_log_and_raise_error in trgfn_attivita_fatturabili_guard_fonte (variadic text)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_fonte()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_fonte text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Validazioni su fonte_quantita e coerenza competenze.
                --
                -- Regole:
                --   - competenza_mese alternativo a competenza_dal/al
                --   - se competenza_dal/al presenti, devono essere coerenti
                --   - variadic su fn_log_and_raise_error sempre testuali
                -- =========================================================

                SELECT r.fonte_quantita
                  INTO v_fonte
                  FROM vendite.regole_fatturazione_articolo r
                 WHERE r.prodotto_id = NEW.articolo_id;

                IF v_fonte IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_REGOLA_FATTURAZIONE_MANCANTE',
                    jsonb_build_object(
                      'context', 'inserimento/aggiornamento attivita_fatturabili',
                      'articolo_id', NEW.articolo_id
                    ),
                    NULL::uuid,
                    NEW.articolo_id::text
                  );
                END IF;

                IF v_fonte NOT IN ('TIMESHEET','MANUALE','FISSA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_FONTE_QUANTITA_NON_VALIDA',
                    jsonb_build_object(
                      'context','validazione fonte_quantita',
                      'fonte_quantita', v_fonte,
                      'articolo_id', NEW.articolo_id
                    ),
                    NULL::uuid,
                    v_fonte,
                    NEW.articolo_id::text
                  );
                END IF;

                IF NEW.competenza_mese IS NOT NULL
                  AND date_trunc('month', NEW.data_attivita)::date > NEW.competenza_mese THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_COMPETENZA_SUPERATA',
                    jsonb_build_object(
                      'context','validazione competenza',
                      'data_attivita', NEW.data_attivita,
                      'competenza_mese', NEW.competenza_mese
                    ),
                    NULL::uuid,
                    NEW.data_attivita::text,
                    NEW.competenza_mese::text
                  );
                END IF;

                IF NEW.competenza_mese IS NOT NULL
                  AND (NEW.competenza_dal IS NOT NULL OR NEW.competenza_al IS NOT NULL) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_COMPETENZA',
                    jsonb_build_object(
                      'context','validazione competenza',
                      'competenza_mese', NEW.competenza_mese,
                      'competenza_dal', NEW.competenza_dal,
                      'competenza_al', NEW.competenza_al
                    ),
                    NULL::uuid,
                    NEW.competenza_mese::text,
                    COALESCE(NEW.competenza_dal::text, 'NULL'),
                    COALESCE(NEW.competenza_al::text, 'NULL')
                  );
                END IF;

                IF (NEW.competenza_dal IS NULL) <> (NEW.competenza_al IS NULL) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_COMPETENZA',
                    jsonb_build_object(
                      'context','validazione competenza',
                      'competenza_dal', NEW.competenza_dal,
                      'competenza_al', NEW.competenza_al
                    ),
                    NULL::uuid,
                    COALESCE(NEW.competenza_dal::text, 'NULL'),
                    COALESCE(NEW.competenza_al::text, 'NULL')
                  );
                END IF;

                IF NEW.competenza_dal IS NOT NULL
                  AND NEW.competenza_al IS NOT NULL
                  AND NEW.competenza_dal > NEW.competenza_al THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_COMPETENZA',
                    jsonb_build_object(
                      'context','validazione competenza',
                      'competenza_dal', NEW.competenza_dal,
                      'competenza_al', NEW.competenza_al
                    ),
                    NULL::uuid,
                    NEW.competenza_dal::text,
                    NEW.competenza_al::text
                  );
                END IF;

                IF NEW.competenza_dal IS NOT NULL
                  AND NEW.competenza_al IS NOT NULL
                  AND (NEW.data_attivita < NEW.competenza_dal OR NEW.data_attivita > NEW.competenza_al) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'attivita_fatturabili',
                    'E_COMPETENZA_SUPERATA',
                    jsonb_build_object(
                      'context','validazione competenza',
                      'data_attivita', NEW.data_attivita,
                      'competenza_dal', NEW.competenza_dal,
                      'competenza_al', NEW.competenza_al
                    ),
                    NULL::uuid,
                    NEW.data_attivita::text,
                    NEW.competenza_dal::text,
                    NEW.competenza_al::text
                  );
                END IF;

                RETURN NEW;
              END
              $$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_fonte()
              IS 'Valida fonte_quantita e competenze su attivita_fatturabili; variadic error helper normalizzati a text.';
