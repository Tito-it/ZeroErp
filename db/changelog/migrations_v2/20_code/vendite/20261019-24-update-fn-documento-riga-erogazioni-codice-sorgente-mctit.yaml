# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 1: vendite.fn_documento_riga_erogazioni
#   Brief: brief-db-grammatica-unica-documenti §9 (G-1, G-4 di Tid, 2026-10-18).
#
#   La famiglia dei documenti con eccezioni (contratto, offerta) passa dal
#   codice corto OFFERTA a quello della sorgente, OFFERTA_COMMERCIALE.
#   CONTRATTO e' gia' il codice della sorgente e non cambia.
#
#   p_documento era un text nudo «senza colonna-vocabolario»: col lotto 0 la
#   colonna c'e', config.sorgenti.codice_interno, e il parametro si ancora
#   li' (%TYPE in firma). Il tipo passa da text a character varying, quindi
#   la firma cambia: DROP + CREATE, non CREATE OR REPLACE (che creerebbe un
#   overload). Nessun dipendente registrato (plpgsql: le chiamate si
#   risolvono a runtime); il backend passa il codice come parametro
#   semplice, e un text si converte da solo in varchar.
#
#   Corpo dalla definizione viva (dbdev, 2026-10-19), firma e RETURNS
#   dall'ultimo YAML che li ha ancorati (20261007-68). COMMENT vivo con la nota
#   di revisione in coda.
#
#   Il corpo non nomina il codice: lo passa a script.fn_check_riga_erogazione
#   (-21). La chiama il backend (_documento_eccezioni_repo).
#
#   ⚠️ Applicare insieme al giro BE del lotto 1 (brief §9.4): dopo l'apply
#   il codice OFFERTA e' rifiutato (E_DOC_TIPO_NON_GESTITO / zero righe).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-24-update-fn-documento-riga-erogazioni-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-24-update-fn-documento-riga-erogazioni-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_documento_riga_erogazioni: p_documento e' CONTRATTO | OFFERTA_COMMERCIALE, ancorato a
        config.sorgenti.codice_interno (DROP + CREATE). Grammatica unica, lotto 1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_documento_riga_erogazioni(text, bigint, uuid);

              CREATE FUNCTION vendite.fn_documento_riga_erogazioni(
                  p_documento    config.sorgenti.codice_interno%TYPE,
                  p_documento_id bigint,
                  p_articolo_id  catalogo.articoli.id%TYPE)
              RETURNS TABLE(
                  tipo_erogazione       config.erogazioni_fonti.tipo_erogazione%TYPE,
                  fonte_quantita_attesa config.erogazioni_fonti.fonte_quantita_attesa%TYPE,
                  e_default             config.erogazioni_fonti.e_default%TYPE,
                  generazione_canone    config.listini_tipologie_erogazioni.generazione_canone%TYPE,
                  -- Nudo DICHIARATO: TIPOLOGIA | NATURA | DISTINTA (vendite.fn_articolo_erogazioni).
                  origine               text)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$

              -- ⚠️ p_documento ancorato a config.sorgenti.codice_interno (CONTRATTO |
              --   OFFERTA_COMMERCIALE, grammatica unica, lotto 1); p_documento_id nudo
              --   DICHIARATO (id polimorfo).
              -- Scopo: per il form delle righe (B-R4), le combinazioni (erogazione, fonte)
              --   che una riga con questo articolo puo' avere su questo documento, con
              --   quella che la riga erediterebbe (e_default). Le stesse righe di
              --   vendite.fn_articolo_erogazioni, che l'eredita' e il guard leggono: il form
              --   preseleziona cio' che il DB scriverebbe e propone solo cio' che il DB
              --   accetterebbe.
              -- Zero righe se l'articolo ha una tipologia che la utility del documento
              --   non prevede: per quell'articolo nessuna combinazione e' ammessa (il guard
              --   lo dice col campo articolo_id). Zero righe anche se documento o articolo
              --   non ci sono o non si vedono.
              -- Ordine: `ordine` di vendite.fn_articolo_erogazioni (20261007-66), lo stesso
              --   che usa l'eredita'. Il default in testa; dentro un'erogazione
              --   DERIVATA_COMPONENTI per ultima. Il form propone la prima fonte di
              --   un'erogazione e coincide col DB per costruzione.
              DECLARE
                  v_motivi jsonb;
              BEGIN
                  -- Lo stesso predicato del guard, sulla sola parte che non dipende dalla
                  -- combinazione (erogazione e fonte NULL: il motivo 2 tace).
                  v_motivi := script.fn_check_riga_erogazione(
                      p_documento, p_documento_id, p_articolo_id,
                      'AGGIUNTA'::vendite.tipo_eccezione_contratto, NULL, NULL);

                  IF jsonb_array_length(v_motivi) > 0 THEN
                      RETURN;
                  END IF;

                  RETURN QUERY
                  SELECT ae.tipo_erogazione, ae.fonte_quantita_attesa, ae.e_default,
                         ae.generazione_canone, ae.origine
                    FROM vendite.fn_articolo_erogazioni(p_articolo_id) ae
                   -- L'ordine del BB (§D.4 punto 1): la prima fonte di un'erogazione e'
                   -- quella che l'eredita' scriverebbe.
                   ORDER BY ae.ordine;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_riga_erogazioni(config.sorgenti.codice_interno%TYPE, bigint, catalogo.articoli.id%TYPE) IS
                'Lettura per il form delle righe di contratto (p_documento = CONTRATTO) e di offerta (OFFERTA), richiesta B-R4: le combinazioni (tipo_erogazione, fonte_quantita_attesa) che una riga con questo articolo può avere su questo documento, con e_default su quella che la riga erediterebbe, la generazione_canone da proporre sulle CANONE e l''origine. Sono le righe di vendite.fn_articolo_erogazioni, la stessa sede che leggono l''eredità e il guard: il form preseleziona ciò che il DB scriverebbe e propone solo ciò che accetterebbe. Prende il posto di fontiQuantitaErogazione.js nel frontend e della copia Python della matrice. Zero righe se l''articolo ha una tipologia che la utility del documento non prevede (script.fn_check_riga_erogazione, motivo TIPOLOGIA_FUORI_UTILITY) o se documento o articolo non si vedono. Ordinate come le ordina vendite.fn_articolo_erogazioni (colonna ordine), lo stesso ordine dell''eredità: il default in testa, dentro un''erogazione DERIVATA_COMPONENTI per ultima, quindi la prima fonte di un''erogazione è quella che il DB scriverebbe. Nasce il 2026-10-07, brief-db-offerta-emissione-ed-erogazione §C.7 (B4); ordine dal 20261007-68 (§D.4 punto 1). ⭐ rev 2026-10-19 (20261019-24, brief-db-grammatica-unica-documenti lotto 1, G-1 di Tid): il documento si nomina col codice della sorgente, CONTRATTO | OFFERTA_COMMERCIALE (era OFFERTA); dove sopra si legge OFFERTA come selettore, oggi e'' OFFERTA_COMMERCIALE. p_documento ancorato a config.sorgenti.codice_interno%TYPE: la firma passa da text a character varying (DROP + CREATE, nessun dipendente registrato).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_documento_riga_erogazioni(config.sorgenti.codice_interno%TYPE, bigint, catalogo.articoli.id%TYPE);

              CREATE FUNCTION vendite.fn_documento_riga_erogazioni(
                  p_documento    text,
                  p_documento_id bigint,
                  p_articolo_id  catalogo.articoli.id%TYPE)
              RETURNS TABLE(
                  tipo_erogazione       config.erogazioni_fonti.tipo_erogazione%TYPE,
                  fonte_quantita_attesa config.erogazioni_fonti.fonte_quantita_attesa%TYPE,
                  e_default             config.erogazioni_fonti.e_default%TYPE,
                  generazione_canone    config.listini_tipologie_erogazioni.generazione_canone%TYPE,
                  -- Nudo DICHIARATO: TIPOLOGIA | NATURA | DISTINTA (vendite.fn_articolo_erogazioni).
                  origine               text)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$

              -- ⚠️ p_documento e p_documento_id nudi DICHIARATI (selettore e id polimorfo).
              -- Scopo: per il form delle righe (B-R4), le combinazioni (erogazione, fonte)
              --   che una riga con questo articolo puo' avere su questo documento, con
              --   quella che la riga erediterebbe (e_default). Le stesse righe di
              --   vendite.fn_articolo_erogazioni, che l'eredita' e il guard leggono: il form
              --   preseleziona cio' che il DB scriverebbe e propone solo cio' che il DB
              --   accetterebbe.
              -- Zero righe se l'articolo ha una tipologia che la utility del documento
              --   non prevede: per quell'articolo nessuna combinazione e' ammessa (il guard
              --   lo dice col campo articolo_id). Zero righe anche se documento o articolo
              --   non ci sono o non si vedono.
              -- Ordine: `ordine` di vendite.fn_articolo_erogazioni (20261007-66), lo stesso
              --   che usa l'eredita'. Il default in testa; dentro un'erogazione
              --   DERIVATA_COMPONENTI per ultima. Il form propone la prima fonte di
              --   un'erogazione e coincide col DB per costruzione.
              DECLARE
                  v_motivi jsonb;
              BEGIN
                  -- Lo stesso predicato del guard, sulla sola parte che non dipende dalla
                  -- combinazione (erogazione e fonte NULL: il motivo 2 tace).
                  v_motivi := script.fn_check_riga_erogazione(
                      p_documento, p_documento_id, p_articolo_id,
                      'AGGIUNTA'::vendite.tipo_eccezione_contratto, NULL, NULL);

                  IF jsonb_array_length(v_motivi) > 0 THEN
                      RETURN;
                  END IF;

                  RETURN QUERY
                  SELECT ae.tipo_erogazione, ae.fonte_quantita_attesa, ae.e_default,
                         ae.generazione_canone, ae.origine
                    FROM vendite.fn_articolo_erogazioni(p_articolo_id) ae
                   -- L'ordine del BB (§D.4 punto 1): la prima fonte di un'erogazione e'
                   -- quella che l'eredita' scriverebbe.
                   ORDER BY ae.ordine;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_riga_erogazioni(text, bigint, uuid) IS
                'Lettura per il form delle righe di contratto (p_documento = CONTRATTO) e di offerta (OFFERTA), richiesta B-R4: le combinazioni (tipo_erogazione, fonte_quantita_attesa) che una riga con questo articolo può avere su questo documento, con e_default su quella che la riga erediterebbe, la generazione_canone da proporre sulle CANONE e l''origine. Sono le righe di vendite.fn_articolo_erogazioni, la stessa sede che leggono l''eredità e il guard: il form preseleziona ciò che il DB scriverebbe e propone solo ciò che accetterebbe. Prende il posto di fontiQuantitaErogazione.js nel frontend e della copia Python della matrice. Zero righe se l''articolo ha una tipologia che la utility del documento non prevede (script.fn_check_riga_erogazione, motivo TIPOLOGIA_FUORI_UTILITY) o se documento o articolo non si vedono. Ordinate come le ordina vendite.fn_articolo_erogazioni (colonna ordine), lo stesso ordine dell''eredità: il default in testa, dentro un''erogazione DERIVATA_COMPONENTI per ultima, quindi la prima fonte di un''erogazione è quella che il DB scriverebbe. Nasce il 2026-10-07, brief-db-offerta-emissione-ed-erogazione §C.7 (B4); ordine dal 20261007-68 (§D.4 punto 1).';
