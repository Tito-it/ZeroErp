# ------------------------------------------------------------
# LO STATO DELL'ORDINE DALLA SUA EVASIONE, IN UN POSTO SOLO
#   vendite.fn_ordine_proietta_stato_evasione(p_ordine_id) -> void
#   Brief: brief-db-ddt-righe-evase-dall-ordine (§5.2, regola del 2)
#
# -- IL CASO --------------------------------------------------------
#   La proiezione «residuo -> PARZIALMENTE_EVASO, niente residuo -> EVASO»
#   era scritta a mano in SEI madri: fn_genera_ddt_da_ordine (step 7) e i
#   cinque verbi del reso che riaprono o chiudono il residuo
#   (fn_conferma_reso, fn_annulla_reso, fn_chiudi_riconsegna_reso,
#   fn_riapri_riconsegna_reso, fn_genera_ddt_riconsegna). Il brief ne
#   aggiunge due consumatori (la correzione della quantita' evasa e il
#   ritiro del legame con la riga in bozza): si estrae, e le sei copie si
#   ritirano nello stesso giro (20261011-06 … -11).
#
# -- ⭐ IL TERZO ESITO: CONFERMATO -----------------------------------------
#   Le sei copie conoscevano due esiti, perche' ognuna girava DOPO che un
#   fulfillment era stato scritto. Il ritiro del legame in bozza (D-3) puo'
#   togliere l'ULTIMO fulfillment dell'ordine: l'ordine non e' piu' evaso
#   per niente, e il suo stato e' CONFERMATO. La matrice ammette i due
#   rientri (EVASO -> CONFERMATO, PARZIALMENTE_EVASO -> CONFERMATO,
#   transizioni 8 e 9).
#   ⚠️ Il discrimine e' l'ESISTENZA di un fulfillment, non il residuo pieno:
#   un ordine evaso e poi reso per intero ha residuo pieno ma e' stato
#   evaso, e resta PARZIALMENTE_EVASO come prima. Per i cinque verbi del
#   reso il comportamento non cambia: girano solo su ordini che hanno un
#   fulfillment (il reso nasce da una riga di DDT evasa).
#   ⚠️ Il rientro passa da trgfn_ordini_guard_transizione, Regola 4
#   (aliquota sulle righe con prezzo): le righe di un ordine confermato non
#   cambiano (lock delle righe), quindi la regola che le ha lasciate
#   passare alla conferma le lascia passare anche qui.
#
# -- COSA NON FA ------------------------------------------------------------
#   Non sceglie gli stati di partenza: come le sei copie, scrive lo stato
#   calcolato e lascia alla matrice (trgfn_ordini_guard_transizione) il
#   rifiuto di un passaggio non ammesso. SECURITY INVOKER: scrive l'ordine
#   con la RLS di chi chiama, come le madri da cui esce.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261011-05-create-fn-ordine-proietta-stato-evasione-mctit.yaml

  - changeSet:
      id: 20261011-05-create-fn-ordine-proietta-stato-evasione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_ordine_proietta_stato_evasione: lo stato dell'ordine dalla sua evasione (nessun
        fulfillment -> CONFERMATO, residuo -> PARZIALMENTE_EVASO, altrimenti EVASO). Building block
        estratto dalle sei madri che lo scrivevano a mano. Brief: brief-db-ddt-righe-evase-dall-ordine.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_ordine_proietta_stato_evasione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_ordine_proietta_stato_evasione(p_ordine_id vendite.ordini.id%TYPE)
              RETURNS void
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: portare l'ordine nello stato che la sua evasione dice.
              --   1. nessun fulfillment su nessuna riga -> CONFERMATO;
              --   2. residuo su almeno una riga (fn_ordine_ha_residuo_evasione,
              --      reso-aware)                       -> PARZIALMENTE_EVASO;
              --   3. altrimenti                         -> EVASO.
              --   La transizione passa dalla matrice (trgfn_ordini_guard_transizione):
              --   uno stato di partenza che non ammette il passaggio rifiuta li'.
              -- Consumatori: fn_genera_ddt_da_ordine, i cinque verbi del reso,
              --   fn_ddt_riga_correggi_qta_evasa e il ritiro del legame con la riga
              --   di DDT in bozza (trgfn_dlt_block_ordrig_ddtrig).
              -- Brief: brief-db-ddt-righe-evase-dall-ordine (§5.2).
              -- =========================================================
              DECLARE
                  v_stato_target    config.stati_doc_ordini.codice_interno%TYPE;
                  v_stato_target_id config.stati_doc_ordini.id%TYPE;
              BEGIN
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_ordine_proietta_stato_evasione',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ordine_id', p_ordine_id),
                          NULL::uuid, 'vendite.fn_ordine_proietta_stato_evasione',
                          'p_ordine_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- ⭐ Il discrimine del CONFERMATO e' l'esistenza di un legame, non
                  --    il residuo pieno: un ordine evaso e poi reso per intero e'
                  --    stato evaso, e resta PARZIALMENTE_EVASO.
                  IF NOT EXISTS (
                      SELECT 1
                        FROM vendite.ordini_righe_fulfillment f
                        JOIN vendite.ordini_righe orr ON orr.id = f.ordine_riga_id
                       WHERE orr.ordine_id = p_ordine_id
                  ) THEN
                      v_stato_target := 'CONFERMATO';
                  ELSIF vendite.fn_ordine_ha_residuo_evasione(p_ordine_id) THEN
                      v_stato_target := 'PARZIALMENTE_EVASO';
                  ELSE
                      v_stato_target := 'EVASO';
                  END IF;

                  SELECT s.id
                    INTO v_stato_target_id
                    FROM config.stati_doc_ordini s
                   WHERE s.codice_interno = v_stato_target
                     AND s.attivo IS TRUE;

                  UPDATE vendite.ordini
                     SET stato_doc_ordine_id = v_stato_target_id
                   WHERE id = p_ordine_id
                     AND stato_doc_ordine_id IS DISTINCT FROM v_stato_target_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ordine_proietta_stato_evasione(vendite.ordini.id%TYPE) IS
                  'Building block (2026-10-11, brief-db-ddt-righe-evase-dall-ordine §5.2): porta l''ordine nello stato che la sua evasione dice. Nessun fulfillment su nessuna riga -> CONFERMATO; residuo su almeno una riga (vendite.fn_ordine_ha_residuo_evasione, reso-aware) -> PARZIALMENTE_EVASO; altrimenti EVASO. Il discrimine del CONFERMATO e'' l''ESISTENZA di un legame, non il residuo pieno: un ordine evaso e poi reso per intero resta PARZIALMENTE_EVASO. La transizione passa dalla matrice (vendite.trgfn_ordini_guard_transizione), che rifiuta uno stato di partenza che non ammette il passaggio; UPDATE solo se lo stato cambia. SECURITY INVOKER: scrive con la RLS di chi chiama. Estratta dalle sei madri che la scrivevano a mano (fn_genera_ddt_da_ordine, fn_conferma_reso, fn_annulla_reso, fn_chiudi_riconsegna_reso, fn_riapri_riconsegna_reso, fn_genera_ddt_riconsegna), ritirate lo stesso giorno (20261011-06 … -11); consumatori nuovi: vendite.fn_ddt_riga_correggi_qta_evasa e il ritiro del legame in vendite.trgfn_dlt_block_ordrig_ddtrig. Parametro non valido: E_VENDITE_CHIAMATA_NON_VALIDA (TECNICO).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_ordine_proietta_stato_evasione(bigint);
