# IL GUARD UNICO SULLE RIGHE DI FATTURA: script.trgfn_guard_sorgente su vendite.fatture_righe
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.1.
#
#   Livello minimo DOCUMENTO: la provenienza di una riga di fattura puo' essere
#   un documento intero o una sua riga. Azione BLOCCA, come una FK: un'origine
#   citata non si cancella. Nome a10, come sulle altre righe di vendita.
#   Rollback: DROP TRIGGER.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261107-48-create-trigger-fatture-righe-guard-sorgente-mctit.yaml

  - changeSet:
      id: 20261107-48-create-trigger-fatture-righe-guard-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fatture_righe: montato script.trgfn_guard_sorgente(DOCUMENTO, BLOCCA). brief-db-
        sorgente-documento-e-riga §7.2 lotto C, giro C.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_fatture_righe_a10_guard_sorgente_ins_upd
                  BEFORE INSERT OR UPDATE OF sorgente_tipo_id, sorgente_id, sorgente_uid, sorgente_riga
                  ON vendite.fatture_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_guard_sorgente('DOCUMENTO', 'BLOCCA');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER trg_fatture_righe_a10_guard_sorgente_ins_upd ON vendite.fatture_righe;
