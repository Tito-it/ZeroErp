# `NULLS LAST` sull'ordinamento della lista attivita' di commessa.
#   Segnalazione del BE del 2026-08-16, dopo l'apply del changeSet -04.
#
# ── IL FATTO ────────────────────────────────────────────────────────────
#
#   Ordinando per `fatturata_il` DESC, in cima finivano le righe MAI
#   fatturate. Misurato dal BE sul dato vero:
#
#       desc:  7304 None · 7305 None · 7306 None · 7307 2026-08-16
#
#   Non e' un difetto della colonna nuova: e' il default di PostgreSQL, che
#   sul DESC mette i NULL in TESTA (e sull'ASC in coda). Ma la domanda da cui
#   la colonna e' nata — «fatturata ieri o tre mesi fa» — vuole in cima
#   l'ultima fatturata, non tre righe che non lo sono affatto.
#
#   ⚠️ Con quattro righe si nota appena. Su una commessa da cento righe di cui
#   dieci fatturate, le dieci che interessano finiscono in FONDO: l'ordinamento
#   diventa inutile esattamente dove serve.
#
# ── LA CORREZIONE, E PERCHE' VALE PER TUTTE LE COLONNE ──────────────────
#
#   `NULLS LAST` esplicito in ENTRAMBI i versi, non solo sul DESC. Sull'ASC e'
#   gia' il comportamento di PostgreSQL, quindi non cambia niente; scriverlo
#   una volta sola per tutti e due evita che l'ordinamento si comporti in due
#   modi diversi a seconda della freccia — che e' la cosa che chi guarda una
#   lista non puo' indovinare.
#
#   ⭐ La regola, detta una volta: *chi ordina per una colonna vuole vedere per
#   prime le righe che quel valore ce l'hanno.* Vale per `fatturata_il` come
#   per `competenza_mese` o `prezzo_snapshot`, nullable anche loro.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────────────
#
#   Nient'altro: stessa firma, stessa RETURNS TABLE, stessa whitelist. E'
#   `CREATE OR REPLACE` e non DROP+CREATE proprio perche' il tipo di ritorno
#   non si tocca.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260816-05-update-fn-list-commessa-attivita-nulls-last-mctit.yaml

  - changeSet:
      id: 20260816-05-update-fn-list-commessa-attivita-nulls-last
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_list_commessa_attivita: ORDER BY con NULLS LAST esplicito in
        entrambi i versi. Sul DESC PostgreSQL metteva i NULL in testa, quindi
        ordinando per fatturata_il le righe mai fatturate finivano prime.
        Segnalato dal BE dopo l'apply del -04.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'vendite' AND p.proname = 'fn_list_commessa_attivita'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_commessa_attivita(
                      p_commessa_id        vendite.commesse.id%TYPE,
                      p_stato_emissione    vendite.commesse_attivita.stato_emissione%TYPE DEFAULT NULL,
                      p_stato_approvazione vendite.commesse_attivita.stato_approvazione%TYPE DEFAULT NULL,
                      p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL,
                      p_limit              integer DEFAULT 1000,
                      p_offset             integer DEFAULT 0,
                      p_order_by           text DEFAULT NULL,
                      p_order_dir          text DEFAULT 'asc')
               RETURNS TABLE (
                      id                    vendite.commesse_attivita.id%TYPE,
                      commessa_id           vendite.commesse.id%TYPE,
                      segment_key           vendite.commesse_attivita.segment_key%TYPE,
                      articolo_id           vendite.commesse_attivita.articolo_id%TYPE,
                      istanza_utility_id    vendite.commesse_attivita.istanza_utility_id%TYPE,
                      data_attivita         vendite.commesse_attivita.data_attivita%TYPE,
                      uom_id                vendite.commesse_attivita.uom_id%TYPE,
                      quantita              vendite.commesse_attivita.quantita%TYPE,
                      competenza_mese       vendite.commesse_attivita.competenza_mese%TYPE,
                      competenza_dal        vendite.commesse_attivita.competenza_dal%TYPE,
                      competenza_al         vendite.commesse_attivita.competenza_al%TYPE,
                      prezzo_snapshot       vendite.commesse_attivita.prezzo_snapshot%TYPE,
                      prezzo_bloccato       vendite.commesse_attivita.prezzo_bloccato%TYPE,
                      prezzo_da_riallineare vendite.commesse_attivita.prezzo_da_riallineare%TYPE,
                      stato_approvazione    vendite.commesse_attivita.stato_approvazione%TYPE,
                      stato_emissione       vendite.commesse_attivita.stato_emissione%TYPE,
                      sorgente_tipo_id      vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                      sorgente_codice       config.sorgenti.codice%TYPE,
                      meta                  vendite.commesse_attivita.meta%TYPE,
                      data_update           vendite.commesse_attivita.data_update%TYPE,
                      fatturata             boolean,
                      -- ===== I tre campi chiesti dal BE il 2026-08-16 =====
                      fatturata_il          vendite.fatture_righe.data_insert%TYPE,
                      fattura_id            vendite.fatture.id%TYPE,
                      fattura_numero        vendite.fatture.numero%TYPE,
                      fattura_stato         config.stati_doc_fiscale.codice_interno%TYPE,
                      sorgente_uid          vendite.commesse_attivita.sorgente_uid%TYPE,
                      sorgente_area         config.sorgenti.area%TYPE,
                      sorgente_documento_id vendite.commesse.id%TYPE)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
                  v_order_col       text;
                  v_order_dir       text;
              BEGIN
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_commessa_attivita', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_commessa_id', 'valore', p_commessa_id), NULL::uuid, 'p_commessa_id obbligatorio e > 0');
                  END IF;

                  -- ⚠️ La whitelist si valida PRIMA di andare a cercare la
                  -- commessa: un parametro sbagliato non deve costare una query
                  -- per essere respinto. Stessa scelta fatta dal BE sulla coda
                  -- approvazioni, dove la validazione precede la risoluzione
                  -- utente/emittente.
                  -- Whitelist di ordinamento: mappa CHIUSA nome -> espressione.
                  -- Le chiavi sono i `campo_sorgente` che il seed manda dal FE
                  -- (<ListaConfigurabile> monta le Column su campo_sorgente).
                  -- NULL/vuoto = ordine storico `ca.id`: le chiamate che non
                  -- chiedono niente ottengono esattamente quello di prima.
                  v_order_col := CASE lower(btrim(COALESCE(p_order_by, '')))
                      WHEN ''                   THEN 'ca.id'
                      WHEN 'id'                 THEN 'ca.id'
                      WHEN 'data_attivita'      THEN 'ca.data_attivita'
                      WHEN 'competenza_mese'    THEN 'ca.competenza_mese'
                      WHEN 'segment_key'        THEN 'ca.segment_key'
                      WHEN 'quantita'           THEN 'ca.quantita'
                      WHEN 'prezzo_snapshot'    THEN 'ca.prezzo_snapshot'
                      WHEN 'stato_approvazione' THEN 'ca.stato_approvazione'
                      WHEN 'stato_emissione'    THEN 'ca.stato_emissione'
                      -- Nuove dal 2026-08-16. `fatturata_il` e' quella che serve
                      -- alla domanda che ha originato la richiesta: distinguere
                      -- una riga fatturata ieri da una di tre mesi fa.
                      WHEN 'fatturata_il'       THEN 'fatt.fatturata_il'
                      WHEN 'fattura_numero'     THEN 'fatt.fattura_numero'
                      ELSE NULL
                  END;

                  -- Fail-loud: un nome fuori whitelist NON ripiega sul default.
                  -- Un ripiego silenzioso e' la «freccia che non ordina»: a video
                  -- sembra funzionare e restituisce un ordine che nessuno ha chiesto.
                  IF v_order_col IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_commessa_attivita', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_order_by', 'valore', p_order_by),
                          NULL::uuid, concat('p_order_by non ammesso: ', p_order_by));
                  END IF;

                  v_order_dir := CASE WHEN lower(btrim(COALESCE(p_order_dir, 'asc'))) = 'desc'
                                      THEN 'DESC' ELSE 'ASC' END;

                  IF NOT EXISTS (SELECT 1 FROM vendite.commesse c WHERE c.id = p_commessa_id) THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_commessa_attivita', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id), NULL::uuid, concat('commessa_id ', p_commessa_id));
                  END IF;

                  -- Sanitize limit/offset
                  IF p_limit IS NULL OR p_limit <= 0 THEN p_limit := 1000; END IF;
                  IF p_limit > 10000 THEN p_limit := 10000; END IF;
                  IF p_offset IS NULL OR p_offset < 0 THEN p_offset := 0; END IF;

                  v_competenza_mese := CASE WHEN p_competenza_mese IS NOT NULL
                      THEN date_trunc('month', p_competenza_mese)::DATE ELSE NULL END;

                  -- SQL dinamico solo per l'ORDER BY (non parametrizzabile).
                  -- L'espressione viene dal CASE chiuso qui sopra, MAI dal
                  -- parametro: i valori restano parametri veri (USING).
                  -- Tiebreak ca.id: senza, righe con la stessa chiave possono
                  -- scambiarsi fra una pagina e l'altra.
                  -- ⚠️ NULLS LAST ESPLICITO, e non solo sul DESC: chi ordina per
                  -- una colonna vuole vedere per prime le righe che quel valore
                  -- ce l'hanno. Su ASC e' gia' il default di PostgreSQL, su DESC
                  -- e' l'opposto — scriverlo per entrambi i versi evita che
                  -- l'ordinamento si comporti in due modi diversi a seconda
                  -- della freccia.
                  RETURN QUERY EXECUTE format($q$
                      SELECT ca.id, ca.commessa_id, ca.segment_key, ca.articolo_id, ca.istanza_utility_id,
                             ca.data_attivita, ca.uom_id, ca.quantita, ca.competenza_mese, ca.competenza_dal,
                             ca.competenza_al, ca.prezzo_snapshot, ca.prezzo_bloccato, ca.prezzo_da_riallineare,
                             ca.stato_approvazione, ca.stato_emissione, ca.sorgente_tipo_id,
                             s.codice AS sorgente_codice, ca.meta, ca.data_update,
                             -- fatturata: specchio del guard BE _assert_non_fatturata.
                             -- ⚠️ Resta l'EXISTS su attivita_fatturabili, che NON ha
                             -- RLS, e non diventa `fatt.fattura_id IS NOT NULL`:
                             -- vendite.fatture ce l'ha, e chi non vede la fattura
                             -- leggerebbe «da fatturare» una riga gia' fatturata.
                             EXISTS (
                                 SELECT 1 FROM vendite.attivita_fatturabili af
                                  WHERE af.commessa_attivita_id = ca.id
                                    AND af.fattura_riga_id IS NOT NULL
                             ) AS fatturata,
                             -- Il momento in cui la riga e' stata PORTATA in
                             -- fattura: la nascita della riga di fattura, non
                             -- l'ultimo aggiornamento dell'attivita'.
                             fatt.fatturata_il,
                             fatt.fattura_id, fatt.fattura_numero, fatt.fattura_stato,
                             ca.sorgente_uid, s.area AS sorgente_area,
                             vendite.fn_get_sorgente_documento_id(ca.sorgente_tipo_id, ca.sorgente_uid)
                                 AS sorgente_documento_id
                        FROM vendite.commesse_attivita ca
                        LEFT JOIN config.sorgenti s ON s.id = ca.sorgente_tipo_id
                        -- ⚠️ LATERAL ordinato e non join nuda: oggi il rapporto
                        -- attivita' -> riga di fattura e' 1:1, ma e' una
                        -- fotografia e non un vincolo. Con una join diretta, il
                        -- giorno di una fatturazione parziale la lista
                        -- raddoppierebbe le righe — dati sbagliati, non un errore.
                        LEFT JOIN LATERAL (
                            SELECT fr.data_insert AS fatturata_il,
                                   f.id           AS fattura_id,
                                   f.numero       AS fattura_numero,
                                   sdf.codice_interno AS fattura_stato
                              FROM vendite.attivita_fatturabili af
                              JOIN vendite.fatture_righe fr ON fr.id = af.fattura_riga_id
                              JOIN vendite.fatture f        ON f.id  = fr.fattura_id
                              LEFT JOIN config.stati_doc_fiscale sdf ON sdf.id = f.stato_doc_fiscale_id
                             WHERE af.commessa_attivita_id = ca.id
                             ORDER BY fr.data_insert DESC, fr.id DESC
                             LIMIT 1
                        ) fatt ON TRUE
                       WHERE ca.commessa_id = $1
                         AND ($2 IS NULL OR ca.stato_emissione = $2)
                         AND ($3 IS NULL OR ca.stato_approvazione = $3)
                         AND ($4 IS NULL OR ca.competenza_mese = $4)
                       ORDER BY %s %s NULLS LAST, ca.id
                       LIMIT $5 OFFSET $6
                  $q$, v_order_col, v_order_dir)
                  USING p_commessa_id, p_stato_emissione, p_stato_approvazione,
                        v_competenza_mese, p_limit, p_offset;
              END;
              $function$;

              -- ⚠️ COMMENT con i tipi RISOLTI.
              COMMENT ON FUNCTION vendite.fn_list_commessa_attivita(BIGINT, CHARACTER VARYING, CHARACTER VARYING, DATE, INTEGER, INTEGER, TEXT, TEXT)
              IS 'Elenco paginato delle attivita'' di una commessa, con whitelist chiusa di ordinamento e fail-loud sul nome fuori whitelist. Rev 2026-08-16 (richiesta BE): porta a valle tre informazioni che si fermavano al database. (1) `fatturata_il` = vendite.fatture_righe.data_insert, cioe'' quando la riga e'' stata PORTATA in fattura — NON `data_update`, che e'' «ultimo aggiornamento» e oggi coincide solo per coincidenza: misurato il 2026-08-16, 10 righe su 37 gia'' divergono, e basta un riallineamento di prezzo dopo la fatturazione perche'' l''etichetta menta. (2) `fattura_id`, `fattura_numero`, `fattura_stato`: il documento su cui navigare, preso con un LATERAL ordinato + LIMIT 1 e non con una join nuda, perche'' il rapporto 1:1 fra attivita'' e riga di fattura e'' una fotografia e non un vincolo — con una join, una fatturazione parziale raddoppierebbe le righe della lista. (3) `sorgente_uid`, `sorgente_area` e `sorgente_documento_id` per l''azione «apri documento sorgente»: l''id numerico lo risolve vendite.fn_get_sorgente_documento_id, perche'' la chiave della sorgente e'' polimorfa e nel dato reale sorgente_uid contiene un UUID su 88 righe su 88, ordini e DDT compresi. ⚠️ Il booleano `fatturata` resta calcolato sull''EXISTS in vendite.attivita_fatturabili, che NON ha RLS, e non deriva dalla join: vendite.fatture ce l''ha, e chi non vede la fattura leggerebbe «da fatturare» una riga gia'' fatturata. Cosi'' invece legge fatturata = true con le colonne del documento a NULL: sa che e'' fatturata e sa di non poterci navigare. Rev 2026-08-16 (sera): ORDER BY con NULLS LAST esplicito in ENTRAMBI i versi. Il default di PostgreSQL mette i NULL in TESTA sul DESC, quindi ordinando per `fatturata_il` decrescente le righe MAI fatturate finivano prime e le fatturate in fondo — su una commessa con cento righe e dieci fatturate l''ordinamento diventa inutile proprio dove serve. Segnalato dal BE dopo l''apply. Richiesta BE del 2026-08-16.';
