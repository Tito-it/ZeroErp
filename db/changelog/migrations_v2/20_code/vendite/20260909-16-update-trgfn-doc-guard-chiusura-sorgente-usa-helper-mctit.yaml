# C-2 — IL GUARD DELLA CHIUSURA SORGENTE USA L'HELPER
#
# ── ⚠️ QUESTO SITO NON AVEVA UN DIFETTO ───────────────────────────
#   Passava `dettaglio`, cioe' il conteggio, ed era corretto. Entra nella
#   consegna perche' la sua check (fn_check_sorgente_chiudibile, changeSet -04)
#   deve emettere `valori` per l'ALTRO chiamante che la compone — e appena li
#   emette, questo sito entra nel perimetro del rubinetto e la coda a mano
#   diventa un debito.
#   ⭐ Il guard e' montato su TRE tabelle: una funzione, un changeSet.
#
# ── ⭐ COSA SPARISCE DA QUESTO CORPO ──────────────────────────────
#   La coda che sceglieva il primo motivo, ne spacchettava i `valori` e
#   componeva il contesto. Non sono righe risparmiate: sono TRE convenzioni che
#   sbagliate non fanno fallire niente — quale elemento si solleva (`-> 0`),
#   quale `tx_id` si passa, e come si spacchetta il VARIADIC.
#   Sede unica: script.fn_raise_primo_motivo_se_presente.
#
# ── ⚠️ L'`IF` SPARISCE, E NON E' FAIL-OPEN ────────────────────────
#   L'helper tace su un array vuoto — che e' esattamente la risposta «passa» —
#   ma su un NON-array resta rumoroso (22023 da jsonb_array_length): un
#   contratto rotto della check non si scambia per un permesso.
#
# ── ⚠️ IL `'motivi'` NON SI PASSA PIU' A MANO ─────────────────────
#   Lo mette sempre l'helper, da `p_motivi`. E' la chiave con cui il backend
#   puo' mostrare TUTTI i motivi anche se la frase ne nomina uno.
#
# ⛔ Questo changeSet dipende dai C-1 della stessa data: senza i `valori` nelle
#   check, l'helper passerebbe un VARIADIC vuoto e a video uscirebbero i `%s`
#   grezzi. La numerazione li mette prima, e vanno nella stessa consegna.
# ⭐ Il corpo e' quello VIVO (pg_get_functiondef), non ricostruito da uno YAML.
#
# Brief: brief-db-i-motivi-si-fermano-dentro-la-check.md (C-2)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260909-16-update-trgfn-doc-guard-chiusura-sorgente-usa-helper-mctit.yaml

  - changeSet:
      id: 20260909-16-update-trgfn-doc-guard-chiusura-sorgente-usa-helper
      author: mctit
      failOnError: true
      comment: >
        vendite.trgfn_doc_guard_chiusura_sorgente passa a script.fn_raise_primo_motivo_se_presente. Entra per via della check condivisa (20260909-04), non per un difetto suo.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_raise_primo_motivo_se_presente'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_doc_guard_chiusura_sorgente'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_doc_guard_chiusura_sorgente()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_sorgente_codice  text := TG_ARGV[0];
                  v_colonna_stato    text := TG_ARGV[1];
                  v_vocabolario      text := TG_ARGV[2];
                  v_sorgente_tipo_id config.sorgenti.id%TYPE;
                  v_stato_new        bigint;
                  v_stato_old        bigint;
                  v_chiude_new       boolean := false;
                  v_chiude_old       boolean := false;
                  v_motivi           jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare la CHIUSURA di un documento che ha spinto in
                  --   commessa righe gia' EMESSA. Quelle sono in volo verso
                  --   una fattura e non si ritirano; le NON_EMESSA le prende
                  --   il motore (trgfn_doc_ritira_commessa_attivita, _z90_).
                  --
                  -- ⭐ Generica: TG_ARGV[0] = codice_interno della sorgente,
                  --   TG_ARGV[1] = colonna di stato della testata,
                  --   TG_ARGV[2] = tabella del vocabolario degli stati.
                  --   Quattro copie divergerebbero.
                  --
                  -- ⭐ Si aggancia a `is_abortito` e NON a un codice cablato:
                  --   cosa significhi «chiuso» e' una proprieta' del DATO, come
                  --   gia' lo e' la matrice delle transizioni. Un secondo stato
                  --   abortito sara' coperto da solo.
                  -- =========================================================
                  v_stato_new := (to_jsonb(NEW) ->> v_colonna_stato)::bigint;
                  v_stato_old := (to_jsonb(OLD) ->> v_colonna_stato)::bigint;

                  -- No-op se lo stato non cambia davvero.
                  IF v_stato_new IS NOT DISTINCT FROM v_stato_old THEN
                      RETURN NEW;
                  END IF;

                  EXECUTE format(
                      'SELECT COALESCE(bool_or(s.is_abortito) FILTER (WHERE s.id = $1), false),'
                      '       COALESCE(bool_or(s.is_abortito) FILTER (WHERE s.id = $2), false)'
                      '  FROM %s s WHERE s.id IN ($1, $2)', v_vocabolario)
                     INTO v_chiude_new, v_chiude_old
                    USING v_stato_new, v_stato_old;

                  -- Interessa SOLO l'ingresso in uno stato abortito. Uscirne o
                  -- restarci non e' una chiusura.
                  IF NOT v_chiude_new OR v_chiude_old THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.id INTO v_sorgente_tipo_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = v_sorgente_codice;

                  IF v_sorgente_tipo_id IS NULL THEN
                      -- ⛔ Fail-closed su un trigger montato male: meglio un
                      --    errore parlante che un freno silenziosamente inerte.
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text,
                          'E_RITIRO_SORGENTE_PARAMETRO_MANCANTE',
                          jsonb_build_object('parametro', 'TG_ARGV[0]',
                                             'valore',    v_sorgente_codice),
                          NULL::uuid, 'TG_ARGV[0]');
                  END IF;

                  -- ⛔ LA CHIAVE e' `uid::text`: e' cio' che le cinque
                  --    fn_list_*_da_pushare scrivono in
                  --    commesse_attivita.sorgente_uid. NON e' la chiave di
                  --    commesse_sorgenti, che varia per sorgente — confonderle
                  --    non darebbe errore, darebbe ZERO motivi.
                  v_motivi := script.fn_check_sorgente_chiudibile(
                                  v_sorgente_tipo_id,
                                  (to_jsonb(NEW) ->> 'uid'));

                  -- ⭐ La coda del primo motivo sta in un posto solo: l'helper legge il
                  --   codice da `v_motivi -> 0`, ne prende i `valori` per la frase, fonde il
                  --   `dettaglio` nel contesto e ci mette sempre l'elenco COMPLETO dei motivi.
                  -- ⚠️ L'IF e' sparito e NON e' fail-open: l'helper tace su un array vuoto,
                  --   che e' esattamente la risposta «passa». Su un non-array resta rumoroso.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'database', TG_NAME::text,
                      v_motivi,
                      NULL,
                      NULL::uuid,
                      jsonb_build_object(
                          'sorgente',     v_sorgente_codice,
                          'sorgente_uid', (to_jsonb(NEW) ->> 'uid'),
                          'documento_id', (to_jsonb(NEW) ->> 'id')));

                  RETURN NEW;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_doc_guard_chiusura_sorgente()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_sorgente_codice  text := TG_ARGV[0];
                  v_colonna_stato    text := TG_ARGV[1];
                  v_vocabolario      text := TG_ARGV[2];
                  v_sorgente_tipo_id config.sorgenti.id%TYPE;
                  v_stato_new        bigint;
                  v_stato_old        bigint;
                  v_chiude_new       boolean := false;
                  v_chiude_old       boolean := false;
                  v_motivi           jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare la CHIUSURA di un documento che ha spinto in
                  --   commessa righe gia' EMESSA. Quelle sono in volo verso
                  --   una fattura e non si ritirano; le NON_EMESSA le prende
                  --   il motore (trgfn_doc_ritira_commessa_attivita, _z90_).
                  --
                  -- ⭐ Generica: TG_ARGV[0] = codice_interno della sorgente,
                  --   TG_ARGV[1] = colonna di stato della testata,
                  --   TG_ARGV[2] = tabella del vocabolario degli stati.
                  --   Quattro copie divergerebbero.
                  --
                  -- ⭐ Si aggancia a `is_abortito` e NON a un codice cablato:
                  --   cosa significhi «chiuso» e' una proprieta' del DATO, come
                  --   gia' lo e' la matrice delle transizioni. Un secondo stato
                  --   abortito sara' coperto da solo.
                  -- =========================================================
                  v_stato_new := (to_jsonb(NEW) ->> v_colonna_stato)::bigint;
                  v_stato_old := (to_jsonb(OLD) ->> v_colonna_stato)::bigint;

                  -- No-op se lo stato non cambia davvero.
                  IF v_stato_new IS NOT DISTINCT FROM v_stato_old THEN
                      RETURN NEW;
                  END IF;

                  EXECUTE format(
                      'SELECT COALESCE(bool_or(s.is_abortito) FILTER (WHERE s.id = $1), false),'
                      '       COALESCE(bool_or(s.is_abortito) FILTER (WHERE s.id = $2), false)'
