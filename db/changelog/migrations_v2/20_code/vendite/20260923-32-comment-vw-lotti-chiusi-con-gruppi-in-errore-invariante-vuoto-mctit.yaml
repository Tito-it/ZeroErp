# ⭐ L'INVARIANTE DI vw_lotti_chiusi_con_gruppi_in_errore TORNA «VUOTA».
#   Brief: brief-db-annullamento-chiude-la-vita §9.5-§9.6 (decisioni di Tid,
#   2026-09-23).
#
# ── PERCHE' SOLO IL COMMENT ──────────────────────────────────────
#   La definizione non cambia: la vista non filtra gli annullati, e non deve.
#   Un lotto annullato non ci compare piu' perche' l'annullo gli chiude gli
#   esiti (20260923-31) e il pregresso e' stato allineato allo stesso modo
#   (80_data 20260923-34): non ha piu' documenti in ERRORE. La regola «un lotto
#   annullato e' vuoto» sta nell'annullo, non in ogni lettore.
#   ⇒ `COMMENT ON VIEW` e non `CREATE OR REPLACE VIEW`: security_invoker resta
#   com'e' (un REPLACE lo azzererebbe se non lo si riscrive).
#
# ── COSA CAMBIA NEL TESTO ────────────────────────────────────────
#   * l'invariante torna da «nessuna riga non dichiarata» (rev 2026-09-07) a
#     «VUOTA»;
#   * il blocco del pregresso e' raccontato come CHIUSO, e perche';
#   * ⛔ la clausola del 07-09 «non si filtrano via» NON e' rovesciata: le righe
#     non sono nascoste da un filtro, sono uscite perche' i documenti di quei
#     lotti sono usciti dal giro. I lotti con stato_lotto falsificato (undici)
#     restano un fatto, e si ritrovano nello storico;
#   * da oggi COMPLETATO su un lotto fermo non si scrive (20260923-30): la vista
#     sorveglia l'altra porta, un documento marcato ERRORE su un lotto gia'
#     COMPLETATO;
#   * il lettore a catalogo e' dbops.vw_lotti_chiusi_con_errori_da_guardare
#     (20260923-33).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260923-32-comment-vw-lotti-chiusi-con-gruppi-in-errore-invariante-vuoto-mctit.yaml

  - changeSet:
      id: 20260923-32-comment-vw-lotti-chiusi-con-gruppi-in-errore-invariante-vuoto
      author: mctit
      failOnError: true
      comment: >
        COMMENT di vendite.vw_lotti_chiusi_con_gruppi_in_errore riscritto:
        l'invariante torna VUOTA (l'annullo chiude gli esiti, il pregresso e'
        allineato), il pregresso del 07-09 e' raccontato come chiuso, la porta
        rimasta aperta e' quella dell'esito. Definizione invariata.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: vendite
            viewName: vw_lotti_chiusi_con_gruppi_in_errore
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_lotti_chiusi_con_gruppi_in_errore
              IS 'PRESIDIO. Elenca una contraddizione: un lotto chiuso COMPLETATO che contiene documenti dichiarati in ERRORE. Sono due affermazioni che non possono stare insieme — o il giro e'' andato bene, o quei documenti non erano suoi. DEVE RESTARE VUOTA. ⭐ Nasce dalla decisione del 2026-09-06 di non sollevare piu'' quando falliscono TUTTE le commesse di un giro: senza l''eccezione lo stato finale del lotto lo decide il verdetto `fermo`, e con tutte le commesse fallite le fatture NON NASCONO. Il 2026-09-12 e'' successo davvero (LTF-0010972: un rilancio ha scritto COMPLETATO con due documenti in ERRORE, perche'' il verdetto del runner non contava ancora gli esiti). ⭐ Rev 2026-09-07: legge vendite.fatturazione_lotti_esiti, quindi vede anche i lotti SENZA perimetro (i giri di massa). ⭐ Rev 2026-09-23 — LE DUE PORTE. (1) La transizione verso COMPLETATO su un lotto fermo e'' rifiutata dal database (trg_fatturazione_lotti_a10_guard_completato_upd). (2) Resta aperta quella dell''ESITO: un documento marcato ERRORE su un lotto GIA'' COMPLETATO produce la stessa contraddizione senza toccare stato_lotto — ed e'' cio'' che questa vista continua a sorvegliare. ⭐ Rev 2026-09-23 — L''INVARIANTE TORNA VUOTA, E IL PREGRESSO E'' CHIUSO. Dal 2026-09-07 era «nessuna riga non dichiarata»: sei lotti annullati prima di quel giorno portavano stato_lotto = COMPLETATO scritto dal vecchio annullo, con un gruppo in ERRORE. Decisione di Tid del 2026-09-23: un lotto annullato e'' VUOTO — l''annullo chiude i suoi esiti come chiude fatture e task run (fn_annulla_lotto_da_draft, rev 2026-09-23), e i lotti gia'' annullati sono stati allineati allo stesso modo. Quei lotti non compaiono piu'' perche'' non hanno piu'' documenti in ERRORE, non perche'' un filtro li nasconda: la vista NON esclude gli annullati, e non deve. ⚠️ La falsificazione di stato_lotto su undici lotti (brief-db-esito-gruppo-lotto §25) resta un fatto e non e'' stata corretta (decisione del 07-09): l''elenco si chiede allo storico. Lettore a catalogo: dbops.vw_lotti_chiusi_con_errori_da_guardare. Brief: brief-db-esito-gruppo-lotto §15, §24, §25; brief-db-annullamento-chiude-la-vita §9.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il testo precedente e' nella doc auto-gen alla revisione 20260907-17:
              -- un rollback lo riapplica a mano, non lo reinventa.
              SELECT 1;
