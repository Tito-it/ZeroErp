# T-4 — LA LANE NON RI-OFFRE UN DOCUMENTO CHE UN LOTTO VIVO TIENE
#
# ── ⭐ IL LATO MACCHINA, e senza di lui il resto non serve ────────
#   Le colonne `emissione_blocco_*` (changeSet -24) spengono la casella
#   dell'operatore. Ma chi COSTRUISCE il lotto non passa da li': passa da
#   questa funzione. Finche' non guarda gli esiti, un secondo giro si prende lo
#   stesso documento e la casella grigia non lo impedisce.
#
# ── ⛔ IL DIFETTO, E SI VEDE SOLO SUL FALLIMENTO ──────────────────
#   La lane filtrava su `stato_emissione = 'NON_EMESSA'` e
#   `stato_approvazione = 'APPROVATA'`, e nient'altro. Quando un giro RIESCE la
#   fattura nasce, lo stato diventa EMESSA e il documento sparisce da solo — e
#   infatti nessuno se n'era accorto. Ma quando il pull FALLISCE non c'e'
#   nessuna fattura, quindi NON_EMESSA, quindi la lane lo rioffre mentre il
#   lotto lo tiene ancora.
#
# ── ⚠️ NON E' UN DOPPIONE DI CIO' CHE C'ERA — obiezione di Tid ────
#   «Mentre e' in esecuzione la lavorazione di un lotto i documenti risultano
#   bloccati: il meccanismo non e' simile?» Vero per meta'.
#   script.fn_get_stato_push_segment sa dire LIBERA / ALLOCATA / EMESSA, e le
#   cinque fn_list_*_da_pushare pretendono LIBERA.
#   ⭐ Ma quel classificatore misura l'ESITO del lavoro, non il fatto che il
#   lavoro sia IN CORSO: `EMESSA` dice «e' andato», `LIBERA` dice «non e' mai
#   partito». Manca la terza — «e' dentro un giro che non ha ancora finito».
#   ⛔ E per la stessa ragione le cinque `da_pushare` NON si toccano: quelle
#   portano SORGENTE -> COMMESSA e la loro regola c'e' gia'; il buco e' su
#   COMMESSA -> LOTTO, cioe' qui. Insegnargliela di nuovo sarebbe una seconda
#   sede — la prima stesura del brief lo voleva fare, ed e' stata cancellata.
#
# ── ⭐ IL PREDICATO SI INTERROGA, NON SI RISCRIVE ─────────────────
#   La sede e' vendite.vw_documenti_trattenuti_da_lotto (changeSet -23), che
#   legge il flag `is_abortito` fail-closed. ⚠️ Mai `congela_fiscale`: su
#   ANNULLATA vale TRUE, e un lotto annullato non trattiene niente.
#
# ── ⚠️ LA CHIAVE SI CHIEDE ALLA SUA FONTE ────────────────────────
#   `fn_build_gruppo_fatturabile_key(sorgente_tipo_id, sorgente_uid,
#   commessa_id)`, che questa query gia' chiama in altri tre punti. Comporla a
#   mano darebbe una chiave che somiglia a quella vera senza esserlo: il
#   confronto passerebbe e sbaglierebbe.
#
# ⭐ Il corpo e' quello VIVO (pg_get_functiondef), non ricostruito da uno YAML.
#   Nessuna variabile nuova; `v_competenza_mese` usa gia' `%TYPE`.
#
# Verifica: db/pgtap/vendite/test-fn-list-emittibili-lane.sql, test 14 e 15 —
#   un verso e il suo contrario. Senza questo changeSet il 14 e' rosso e il 15
#   resta verde, che e' la prova che il filtro non blocca troppo.
# Brief: brief-db-documento-trattenuto-da-un-lotto-vivo.md (T-4, decisione D-2)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260909-25-update-fn-list-emittibili-lane-salta-trattenuti-mctit.yaml

  - changeSet:
      id: 20260909-25-update-fn-list-emittibili-lane-salta-trattenuti
      author: mctit
      failOnError: true
      comment: >
        vendite.fn_list_emittibili_lane non offre piu' a un giro nuovo i
        documenti che un lotto ancora vivo sta trattenendo. E' il lato macchina
        della decisione D-2: la casella spenta a video non basta, perche' chi
        costruisce il lotto passa da qui.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_views
                   WHERE schemaname = 'vendite'
                     AND viewname = 'vw_documenti_trattenuti_da_lotto'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_emittibili_lane(p_competenza_mese date DEFAULT NULL::date, p_billing_account_id bigint DEFAULT NULL::bigint, p_utility_id integer DEFAULT NULL::integer, p_emittente_soggetto_ruolo_id bigint DEFAULT NULL::bigint, p_fatturazione_immediata boolean DEFAULT NULL::boolean, p_limit integer DEFAULT 1000, p_gruppi text[] DEFAULT NULL::text[])
               RETURNS TABLE(emittente_soggetto_ruolo_id bigint, tipo_doc_fiscale_id bigint, utility_id integer, competenza_mese date, total_candidate bigint, gruppi_coperti text[])
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
                v_corsia          record;
                v_n               integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo: rispondere al driver batch "quali TERNE distinte
                --   (emittente, tipo_doc, utility) hanno lavoro pronto da
                --   fatturare, e fino a quale competenza creare il lotto".
                -- Criteri:
                --   1. commessa in stato emittibile (stati_commessa.emittibile=true)
                --   2. righe commesse_attivita APPROVATA + NON_EMESSA (allineato pull)
                --   3. tipo_doc_fiscale_id NOT NULL (il lotto lo richiede)
                --   4. competenza CUMULATIVA: competenza_mese <= p_competenza_mese
                --      (coerente con fn_select_attivita_fatturabili); NULL = no limite
                --   5. filtri perimetro BA/utility/emittente; corsia fatturazione_immediata
                --   6. rev 2026-08-15: + gruppi_coperti text[] — QUALI gruppi
                --      fatturabili sono finiti in questa terna. Senza, un'emissione
                --      parziale (3 gruppi chiesti, 2 serviti) non sa dire quale sia
                --      rimasto fuori. ⚠️ E' una PREVISIONE: per il consuntivo di
                --      cio' che un giro ha davvero fatturato usare
                --      vendite.fn_esito_gruppi_giro(lotti).
                --   7. rev 2026-07-27: p_gruppi restringe ai GRUPPI FATTURABILI
                --      richiesti, cosi' l'emissione mirata non fa nascere un lotto
                --      per ogni altra terna del perimetro (lotti vuoti = rumore).
                --      NULL = nessuna restrizione (comportamento storico).
                --   8. rev 2026-08-15 (§9 F7): il TETTO non tronca piu' in
                --      silenzio una richiesta MIRATA. Vedi il blocco qui sotto.
                -- Grana: (emittente, tipo_doc, utility). utility_id e' NOT NULL a monte
                --   (commesse.utility_id) -> in output mai NULL.
                -- Output per terna: competenza_mese = max(...), total_candidate = count(*).
                -- Regole: p_limit max 10000/default 1000; competenza normalizzata al mese;
                --   STABLE (read-only); LIMIT sulle TERNE.
                -- =========================================================
                IF p_limit IS NULL OR p_limit <= 0 THEN
                  p_limit := 1000;
                END IF;
                IF p_limit > 10000 THEN
                  p_limit := 10000;
                END IF;

                v_competenza_mese := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                -- ⚠️ SI LEGGE UNA CORSIA IN PIU' DEL TETTO (LIMIT p_limit + 1).
                -- Alla corsia numero p_limit + 1 si sa che ce n'era dell'altra,
                -- e si puo' distinguere «erano esattamente p_limit» da «sono
                -- state tagliate». Il conto si fa scorrendo il risultato UNA
                -- volta: un secondo SELECT count(*) di controllo sarebbe stata
                -- una seconda copia dei filtri di discovery dentro la stessa
                -- funzione, cioe' l'errore che il §7.1 ha gia' corretto.
                FOR v_corsia IN
                  SELECT
                    c.emittente_soggetto_ruolo_id  AS emittente_sr,
                    ca.tipo_doc_fiscale_id         AS tipo_doc,
                    c.utility_id                   AS utility,
                    max(ca.competenza_mese)        AS competenza,
                    count(ca.id)::bigint           AS candidate,
                    -- I gruppi fatturabili coperti da questa terna. La chiave viene
                    -- dalla SOLA fonte di verita' (fn_build_gruppo_fatturabile_key),
                    -- mai ricostruita qui: e' la stessa funzione che filtra nel WHERE
                    -- e che alimenta vw_dash_competenza_gruppi.
                    -- ORDER BY dentro l'aggregato: l'ordine dev'essere DETERMINISTICO,
                    -- altrimenti due chiamate identiche danno array diversi e chi li
                    -- confronta (l'esito, un test) vede differenze che non esistono.
                    array_agg(DISTINCT vendite.fn_build_gruppo_fatturabile_key(
                                           ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id)
                              ORDER BY vendite.fn_build_gruppo_fatturabile_key(
                                           ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id)
                             )                     AS gruppi
                  FROM vendite.commesse c
                  JOIN vendite.stati_commessa sc
                    ON sc.id = c.stato_commessa_id
                   AND sc.emittibile = true
                  INNER JOIN vendite.commesse_attivita ca
                    ON ca.commessa_id = c.id
                   AND ca.stato_emissione = 'NON_EMESSA'
                   AND ca.stato_approvazione = 'APPROVATA'
                   AND ca.tipo_doc_fiscale_id IS NOT NULL
                   AND (v_competenza_mese IS NULL OR ca.competenza_mese <= v_competenza_mese)
                  WHERE true
                    AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                    AND (p_utility_id IS NULL OR c.utility_id = p_utility_id)
                    AND (p_emittente_soggetto_ruolo_id IS NULL OR c.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                    AND (p_fatturazione_immediata IS NULL OR c.fatturazione_immediata = p_fatturazione_immediata)
                    -- EMISSIONE MIRATA (rev 2026-07-27): chiave dalla funzione A1,
                    -- mai ricostruita qui. Un gruppo con righe di tipo doc diverso
                    -- resta su piu' terne, e vengono restituite tutte (G15).
                    -- ⛔ UN DOCUMENTO GIA' TRATTENUTO DA UN LOTTO VIVO NON SI OFFRE A UN
                    --   SECONDO GIRO, ed e' il lato MACCHINA della regola: la casella spenta
                    --   a video non basta, perche' chi costruisce il lotto lo prende da qui.
                    -- ⭐ Il predicato non si riscrive: si INTERROGA la sede unica
                    --   (vendite.vw_documenti_trattenuti_da_lotto, changeSet 20260909-23),
                    --   che legge il flag `is_abortito` fail-closed.
                    -- ⚠️ E non e' un doppione di cio' che c'era: script.fn_get_stato_push_-
                    --   segment, che guarda le cinque fn_list_*_da_pushare, sa dire LIBERA /
                    --   ALLOCATA / EMESSA — cioe' misura l'ESITO del lavoro, non il fatto che
                    --   il lavoro sia IN CORSO. Quelle cinque non si toccano: la loro regola
                    --   c'e' gia'.
                    AND NOT EXISTS (
                          SELECT 1
                            FROM vendite.vw_documenti_trattenuti_da_lotto t
                           WHERE t.gruppo_key = vendite.fn_build_gruppo_fatturabile_key(
                                     ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id))
                    AND (
                         p_gruppi IS NULL
                         OR vendite.fn_build_gruppo_fatturabile_key(
                                ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id
                            ) = ANY (p_gruppi)
                        )
                  GROUP BY
                    c.emittente_soggetto_ruolo_id,
                    ca.tipo_doc_fiscale_id,
                    c.utility_id
                  ORDER BY
                    c.emittente_soggetto_ruolo_id,
                    ca.tipo_doc_fiscale_id,
                    c.utility_id
                  LIMIT p_limit + 1
                LOOP
                  v_n := v_n + 1;

                  IF v_n > p_limit THEN
                    -- Siamo oltre il tetto: c'era altro lavoro e non entra.
                    IF p_gruppi IS NOT NULL THEN
                      -- MIRATA: il perimetro e' NOMINALE. Troncare una richiesta
                      -- nominale non e' un successo parziale, e' una richiesta
                      -- senza risposta — e a valle diventerebbe una diagnosi
                      -- FALSA («questi gruppi non sono fatturabili») su gruppi
                      -- che erano solo oltre il taglio.
                      -- ⚠️ Il RETURN NEXT accumula in un tuplestore: sollevando
                      -- qui il chiamante non riceve NESSUNA riga, mai una mezza
                      -- risposta accompagnata da un errore.
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_list_emittibili_lane',
                        'E_FATTURAZIONE_MIRATA_TRONCATA',
                        jsonb_build_object('p_limit', p_limit,
                                           'gruppi_richiesti', cardinality(p_gruppi)),
                        NULL::uuid, p_limit::text);
                    END IF;
                    -- MASSA: il tetto e' una valvola di sicurezza, e troncare
                    -- e' il comportamento storico. Si esce senza rumore.
                    EXIT;
                  END IF;

                  emittente_soggetto_ruolo_id := v_corsia.emittente_sr;
                  tipo_doc_fiscale_id         := v_corsia.tipo_doc;
                  utility_id                  := v_corsia.utility;
                  competenza_mese             := v_corsia.competenza;
                  total_candidate             := v_corsia.candidate;
                  gruppi_coperti              := v_corsia.gruppi;
                  RETURN NEXT;
                END LOOP;

                RETURN;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
