databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260211-10-create-fn-get-totale-fondi-fattura-mctit.yaml

  - changeSet:
      id: 20260211-10-create-fn-get-totale-fondi-fattura
      author: mctit
      comment: "Calcola totale fondi fattura per testata"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_totale_fondi_fattura(
                p_fattura_id vendite.fatture.id%TYPE
              )
              RETURNS vendite.fatture_fondi_fattura.importo%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_totale vendite.fatture_fondi_fattura.importo%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce il totale fondi fattura attivi per la fattura.
                -- =========================================================

                IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'vendite.fn_get_totale_fondi_fattura', 'E_GENERICO',
                    jsonb_build_object('detail','fattura_id obbligatoria'),
                    NULL::uuid,
                    'fattura_id non valido'
                  );
                END IF;

                SELECT COALESCE(SUM(ff.importo), 0)
                  INTO v_totale
                  FROM vendite.fatture_fondi_fattura ff
                 WHERE ff.fattura_id = p_fattura_id
                   AND ff.attivo IS TRUE;

                RETURN v_totale;
              END;
              $$;

              COMMENT ON FUNCTION vendite.fn_get_totale_fondi_fattura(vendite.fatture.id%TYPE)
                IS 'Restituisce il totale fondi fattura attivi per una fattura.';
