# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2c (G-5): il numeratore della bolla chiede la famiglia DDT_VENDITA
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-5, §10.4.
#
#   p_famiglia_documento => 'DDT' diventa 'DDT_VENDITA': la famiglia ha il codice della sua
#   sorgente dal 20261020-32. Nient'altro cambia; il DECLARE era gia' ancorato.
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. %TYPE in firma, DECLARE e RETURNS TABLE dove c'e' una colonna; nudi, col
#   motivo accanto, i valori che una colonna non ha (conteggi, testi composti).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-42-update-trgfn-ddt-gen-numero-emesso-famiglia-sorgente-mctit.yaml

  - changeSet:
      id: 20261020-42-update-trgfn-ddt-gen-numero-emesso-famiglia-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_ddt_gen_numero_emesso: la famiglia di numerazione e' DDT_VENDITA (era DDT). Grammatica unica, 2c (G-5).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_gen_numero_emesso()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la famiglia di numerazione e' DDT_VENDITA, il codice della
              --   sorgente (era DDT).
              DECLARE
                  v_stato        config.stati_doc_ddt.codice_interno%TYPE;
                  v_emittente_sr vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE;
                  v_registro     vendite.registri_fatturazione.id%TYPE;
                  v_ass          record;
                  v_anno         vendite.ddt.anno%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Assegnare ddt.numero alla transizione a EMESSO,
                  --   prendendolo dal MOTORE DEI REGISTRI.
                  --
                  -- ⭐ rev 2026-08-31: qui resta il MOMENTO, e basta. Il
                  --   formato — prefisso, suffisso, lunghezza — viene TUTTO
                  --   dal registro, e la composizione dalla funzione centrale.
                  -- ⛔ config.sistema_codici non ha piu' una riga 'ddt': il
                  --   20260831-53 l'ha tolta insieme alle altre tre. I DEFAULT
                  --   con cui nasce un registro stanno in
                  --   vendite.famiglie_documento.
                  -- =========================================================

                  -- Gia' numerato -> no-op (immutabilita' da
                  -- trgfn_v_ddt_protect_num).
                  IF NEW.numero IS NOT NULL AND btrim(NEW.numero::text) <> '' THEN
                      RETURN NEW;
                  END IF;

                  -- Numero solo a EMESSO (no buchi da bozze DRAFT scartate).
                  SELECT sdd.codice_interno INTO v_stato
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;
                  IF v_stato IS DISTINCT FROM 'EMESSO' THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Due convenzioni per lo stesso emittente: il DDT porta
                  --   l'id di anagrafiche.emittenti_fiscali, il registro porta
                  --   il soggetto_ruolo. La traduzione e' 1:1
                  --   (uq_emittenti_fiscali_ruolo) e si fa qui, esplicita.
                  SELECT ef.soggetto_ruolo_id INTO v_emittente_sr
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = NEW.emittente_fiscale_id;

                  -- ⛔ L'INVOLUCRO, non il lettore: qui si SCRIVE, e un
                  --   emittente senza registro DDT deve fermare — non emettere
                  --   un documento senza sezionale.
                  -- ⭐ I SEI PASSI IN UNA CHIAMATA SOLA. Stavano qui e in altre tre
                  --   funzioni identiche: risolvere il registro, ricavare l'anno,
                  --   chiedere il progressivo, leggere il formato, comporre.
                  --   ⚠️ Una correzione alla composizione andava fatta in QUATTRO
                  --   posti, e chi ne dimenticava uno produceva un documento
                  --   formattato diverso dagli altri — che nessun vincolo respinge.
                  -- ⭐ Qui resta l'unica cosa che distingue davvero questo documento
                  --   dagli altri tre: il MOMENTO, cioe' i guard qui sopra.
                  SELECT * INTO v_ass
                    FROM vendite.fn_assegna_numero_documento(
                             p_famiglia_documento          => 'DDT_VENDITA',
                             p_emittente_soggetto_ruolo_id => v_emittente_sr,
                             p_data                        => NEW.data,
                             p_documento_id                => NEW.id,
                             p_utility_id                  => NEW.utility_id,
                                      p_serie              => NEW.serie,
                             p_corpo                       => NULL) v;

                  -- ⚠️ Le colonne si scrivono INSIEME: numero, anno, serie e registro
                  --   sono una cosa sola — la chiave del documento — e scriverne
                  --   una senza le altre lascia la riga a raccontare un sezionale
                  --   che non e' il suo.
                  NEW.registro_id := v_ass.registro_id;
                  NEW.anno        := v_ass.anno;
                  NEW.serie       := NULLIF(v_ass.serie, '');
                  NEW.numero      := v_ass.numero;

                  RETURN NEW;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_ddt_gen_numero_emesso() IS
                'Assegna il numero a il DDT alla transizione a EMESSO, chiamando vendite.fn_assegna_numero_documento. ⭐ rev 2026-08-31 (brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4): i SEI PASSI della numerazione — risolvere il registro, ricavare l''anno dalla data documento, chiedere il progressivo, leggere il formato, comporre — non stanno piu'' qui. Stavano qui E in altre tre funzioni identiche (DDT, ordini, resi, commessa), verificato il 2026-08-31: gli stessi sei passi, quattro volte. ⚠️ Una correzione alla composizione andava fatta in QUATTRO posti, e chi ne dimenticava uno produceva un difetto MUTO — un documento formattato diverso dagli altri, che nessun vincolo respinge. ⭐ QUI RESTA L''UNICA COSA CHE DISTINGUE DAVVERO QUESTO DOCUMENTO DAGLI ALTRI TRE: il MOMENTO. I guard di uscita anticipata decidono SE e QUANDO numerare, poi la chiamata fa il resto — centralizzare anche il momento avrebbe messo in una funzione comune la sola cosa che comune non e''. ⭐ IL FORMATO VIENE TUTTO DAL REGISTRO — prefisso, suffisso e lunghezza, in una lettura sola — e i DEFAULT con cui un registro nasce stanno in vendite.famiglie_documento. ⛔ config.sistema_codici NON C''ENTRA PIU'': il 20260831-53 ne ha tolto le righe di ddt, ordine, reso e commessa. ⚠️ Fino al 20260831-54 questa descrizione diceva che il catalogo dei formati «conserva la sola LUNGHEZZA»: era vero fino al 53, e nel frattempo la funzione centrale continuava a leggerla da li'' — zero righe, lunghezza NULL, 7 cifre a tutti (giusto per caso qui, sbagliato sulla commessa). Corretto dal 20260831-55, e questa frase resta a ricordare che un COMMENT superato e'' una prova falsa a favore dell''ipotesi sbagliata. ⚠️ Il separatore non si legge piu'': se serve, si scrive dentro il prefisso. ⚠️ Le colonne della chiave si scrivono INSIEME, perche'' sono una cosa sola: scriverne una senza le altre lascerebbe la riga a raccontare un sezionale che non e'' il suo. Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4 e P-16. Rev 2026-10-20 (20261020-42, brief-db-grammatica-unica-documenti 2c, G-5): la famiglia di numerazione e'' DDT_VENDITA, il codice della sorgente (era DDT).';

