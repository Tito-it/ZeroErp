databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20251031-04-create-trgfn-fatture-norm-mctit.yaml

  - changeSet:
      id: 20251031-04-create-trgfn-fatture-norm
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Function coerente con tabella vendite.fatture
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatture_norm()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                ----------------------------------------------------------------
                -- Generazione codice/anno/data SOLO in INSERT e SOLO se numero mancante
                IF TG_OP = 'INSERT' AND (NEW.numero IS NULL OR btrim(NEW.numero) = '') THEN
                  NEW.numero := script.fn_generate_codice('fatture');
                 
                  -- imposta anno e data ai valori correnti di sistema
                  NEW.anno := EXTRACT(YEAR FROM CURRENT_DATE)::smallint;
                  NEW.data := CURRENT_DATE;
                END IF;

                RETURN NEW;
              END;
              $$;

              COMMENT ON FUNCTION vendite.trgfn_fatture_norm() IS
              'Normalizza vendite.fatture in INSERT: se numero è NULL/blank, genera numero e imposta anno/data correnti. Nessuna modifica in UPDATE.';

              -- Allineo il trigger alla function corretta (schema vendite)
              DROP TRIGGER IF EXISTS trg_fatture_ins_upd_norm ON vendite.fatture;

              CREATE TRIGGER trg_fatture_ins_upd_norm
                BEFORE INSERT OR UPDATE ON vendite.fatture
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_fatture_norm();

              COMMENT ON TRIGGER trg_fatture_ins_upd_norm ON vendite.fatture IS
              'Normalizza numero/anno/data in INSERT quando numero è mancante.';



  - changeSet:
      id: 20251101-04-dlt-trgfn-fatture-norm
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Rimuovo function e trigger vendite.trgfn_fatture_norm
              DROP TRIGGER IF EXISTS trg_fatture_ins_upd_norm ON vendite.fatture;

              DROP FUNCTION IF EXISTS vendite.trgfn_fatture_norm();