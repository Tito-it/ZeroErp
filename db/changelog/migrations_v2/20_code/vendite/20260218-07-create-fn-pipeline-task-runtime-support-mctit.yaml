  - changeSet:
      id: 20260218-07-07-create-fn-get-lotto-task-last-run
      author: mctit
      comment: "Recupera ultimo run task su lotto"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_lotto_task_last_run(
                p_lotto_id vendite.fatturazione_lotti_task_runs.lotto_id%TYPE,
                p_stato_doc_fiscale_id vendite.fatturazione_lotti_task_runs.stato_doc_fiscale_id%TYPE,
                p_task_code vendite.fatturazione_lotti_task_runs.task_code%TYPE
              )
              RETURNS TABLE(
                id vendite.fatturazione_lotti_task_runs.id%TYPE,
                lotto_id vendite.fatturazione_lotti_task_runs.lotto_id%TYPE,
                pipeline_id vendite.fatturazione_lotti_task_runs.pipeline_id%TYPE,
                stato_doc_fiscale_id vendite.fatturazione_lotti_task_runs.stato_doc_fiscale_id%TYPE,
                task_code vendite.fatturazione_lotti_task_runs.task_code%TYPE,
                fase vendite.fatturazione_lotti_task_runs.fase%TYPE,
                tentativo vendite.fatturazione_lotti_task_runs.tentativo%TYPE,
                task_stato vendite.fatturazione_lotti_task_runs.task_stato%TYPE,
                started_at vendite.fatturazione_lotti_task_runs.started_at%TYPE,
                ended_at vendite.fatturazione_lotti_task_runs.ended_at%TYPE,
                error_code vendite.fatturazione_lotti_task_runs.error_code%TYPE,
                error_message vendite.fatturazione_lotti_task_runs.error_message%TYPE,
                meta vendite.fatturazione_lotti_task_runs.meta%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce l'ultimo run disponibile per task+step+lotto.
                -- =========================================================
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_lotto_task_last_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','lotto_id obbligatorio','lotto_id',p_lotto_id)
                    ),
                    NULL::uuid,
                    'lotto_id obbligatorio'
                  );
                END IF;

                IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_lotto_task_last_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','task_code obbligatorio','task_code',p_task_code)
                    ),
                    NULL::uuid,
                    'task_code obbligatorio'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  r.id, r.lotto_id, r.pipeline_id, r.stato_doc_fiscale_id,
                  r.task_code, r.fase, r.tentativo, r.task_stato,
                  r.started_at, r.ended_at, r.error_code, r.error_message, r.meta
                FROM vendite.fatturazione_lotti_task_runs r
                WHERE r.lotto_id = p_lotto_id
                  AND r.task_code = p_task_code
                  AND r.stato_doc_fiscale_id IS NOT DISTINCT FROM p_stato_doc_fiscale_id
                ORDER BY r.tentativo DESC, r.id DESC
                LIMIT 1;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_lotto_task_last_run(bigint, integer, character varying)
              IS 'Restituisce l''ultimo run task per lotto/stato/task.';

  - changeSet:
