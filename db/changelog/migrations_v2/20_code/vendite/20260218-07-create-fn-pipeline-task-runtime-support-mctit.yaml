databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260218-07-create-fn-pipeline-task-runtime-support-mctit.yaml

  - changeSet:
      id: 20260218-07-01-create-fn-get-pipeline-task-policy
      author: mctit
      comment: "Recupera policy task pipeline"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_pipeline_task_policy(
                p_pipeline_id vendite.fatturazione_pipeline_task_policy.pipeline_id%TYPE,
                p_task_code vendite.fatturazione_pipeline_task_policy.task_code%TYPE
              )
              RETURNS TABLE(
                annullabile vendite.fatturazione_pipeline_task_policy.annullabile%TYPE,
                resume_mode vendite.fatturazione_pipeline_task_policy.resume_mode%TYPE,
                attivo vendite.fatturazione_pipeline_task_policy.attivo%TYPE,
                meta vendite.fatturazione_pipeline_task_policy.meta%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce la policy runtime del task per pipeline.
                -- =========================================================
                IF p_pipeline_id IS NULL OR p_pipeline_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','pipeline_id obbligatorio','pipeline_id',p_pipeline_id)
                    ),
                    NULL::uuid,
                    'pipeline_id obbligatorio'
                  );
                END IF;

                IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','task_code obbligatorio','task_code',p_task_code)
                    ),
                    NULL::uuid,
                    'task_code obbligatorio'
                  );
                END IF;

                RETURN QUERY
                SELECT p.annullabile, p.resume_mode, p.attivo, p.meta
                FROM vendite.fatturazione_pipeline_task_policy p
                WHERE p.pipeline_id = p_pipeline_id
                  AND p.task_code = p_task_code
                  AND p.attivo IS TRUE;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object(
                        'detail','policy task non trovata',
                        'pipeline_id',p_pipeline_id,
                        'task_code',p_task_code
                      )
                    ),
                    NULL::uuid,
                    concat('Policy task non trovata pipeline:', p_pipeline_id::text, ' task:', p_task_code)
                  );
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_pipeline_task_policy(bigint, character varying)
              IS 'Restituisce la policy attiva del task per pipeline (annullabile/resume_mode/meta).';

  - changeSet:
      id: 20260218-07-02-create-fn-check-pipeline-task-policy
      author: mctit
      comment: "Verifica presenza policy task pipeline"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_check_pipeline_task_policy(
                p_pipeline_id vendite.fatturazione_pipeline_task_policy.pipeline_id%TYPE,
                p_task_code vendite.fatturazione_pipeline_task_policy.task_code%TYPE
              )
              RETURNS boolean
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_exists boolean;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Verifica esistenza policy task attiva per pipeline.
                -- =========================================================
                IF p_pipeline_id IS NULL OR p_pipeline_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_check_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','pipeline_id obbligatorio','pipeline_id',p_pipeline_id)
                    ),
                    NULL::uuid,
                    'pipeline_id obbligatorio'
                  );
                END IF;

                IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_check_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','task_code obbligatorio','task_code',p_task_code)
                    ),
                    NULL::uuid,
                    'task_code obbligatorio'
                  );
                END IF;

                SELECT EXISTS (
                  SELECT 1
                  FROM vendite.fatturazione_pipeline_task_policy p
                  WHERE p.pipeline_id = p_pipeline_id
                    AND p.task_code = p_task_code
                    AND p.attivo IS TRUE
                )
                INTO v_exists;

                IF NOT v_exists THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_check_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object(
                        'detail','policy task non configurata',
                        'pipeline_id',p_pipeline_id,
                        'task_code',p_task_code
                      )
                    ),
                    NULL::uuid,
                    concat('Policy task non configurata pipeline:', p_pipeline_id::text, ' task:', p_task_code)
                  );
                END IF;

                RETURN v_exists;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_check_pipeline_task_policy(bigint, character varying)
              IS 'Verifica presenza di policy task attiva per pipeline; in assenza genera errore applicativo.';

  - changeSet:
      id: 20260218-07-03-create-fn-start-lotto-task-run
      author: mctit
      comment: "Apre run task di lotto (IN_ESECUZIONE)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_start_lotto_task_run(
                p_lotto_id vendite.fatturazione_lotti_task_runs.lotto_id%TYPE,
                p_pipeline_id vendite.fatturazione_lotti_task_runs.pipeline_id%TYPE,
                p_stato_doc_fiscale_id vendite.fatturazione_lotti_task_runs.stato_doc_fiscale_id%TYPE,
                p_task_code vendite.fatturazione_lotti_task_runs.task_code%TYPE,
                p_fase vendite.fatturazione_lotti_task_runs.fase%TYPE DEFAULT NULL::character varying,
                p_meta vendite.fatturazione_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS TABLE(
                task_run_id vendite.fatturazione_lotti_task_runs.id%TYPE,
                tentativo vendite.fatturazione_lotti_task_runs.tentativo%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_tentativo vendite.fatturazione_lotti_task_runs.tentativo%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Inserisce un nuovo task run in stato IN_ESECUZIONE.
                -- =========================================================
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_start_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','lotto_id obbligatorio','lotto_id',p_lotto_id)
                    ),
                    NULL::uuid,
                    'lotto_id obbligatorio'
                  );
                END IF;

                IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_start_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','task_code obbligatorio','task_code',p_task_code)
                    ),
                    NULL::uuid,
                    'task_code obbligatorio'
                  );
                END IF;

                SELECT COALESCE(MAX(r.tentativo), 0)::smallint + 1
                INTO v_tentativo
                FROM vendite.fatturazione_lotti_task_runs r
                WHERE r.lotto_id = p_lotto_id
                  AND r.task_code = p_task_code
                  AND r.stato_doc_fiscale_id IS NOT DISTINCT FROM p_stato_doc_fiscale_id;

                RETURN QUERY
                INSERT INTO vendite.fatturazione_lotti_task_runs (
                  lotto_id,
                  pipeline_id,
                  stato_doc_fiscale_id,
                  task_code,
                  fase,
                  tentativo,
                  task_stato,
                  started_at,
                  ended_at,
                  error_code,
                  error_message,
                  meta,
                  attivo,
                  data_insert,
                  user_insert,
                  data_update,
                  user_update
                )
                VALUES (
                  p_lotto_id,
                  p_pipeline_id,
                  p_stato_doc_fiscale_id,
                  p_task_code,
                  p_fase,
                  v_tentativo,
                  'IN_ESECUZIONE',
                  now(),
                  NULL,
                  NULL,
                  NULL,
                  COALESCE(p_meta, '{}'::jsonb),
                  true,
                  now(),
                  current_user,
                  now(),
                  current_user
                )
                RETURNING id, tentativo;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_start_lotto_task_run(bigint, bigint, integer, character varying, character varying, jsonb)
              IS 'Apre un task run di lotto in stato IN_ESECUZIONE e incrementa il tentativo.';

  - changeSet:
      id: 20260218-07-04-create-fn-complete-lotto-task-run
      author: mctit
      comment: "Chiude run task con esito COMPLETATO"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_complete_lotto_task_run(
                p_task_run_id vendite.fatturazione_lotti_task_runs.id%TYPE,
                p_meta vendite.fatturazione_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Chiude un task run con stato COMPLETATO.
                -- =========================================================
                IF p_task_run_id IS NULL OR p_task_run_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_complete_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','task_run_id obbligatorio','task_run_id',p_task_run_id)
                    ),
                    NULL::uuid,
                    'task_run_id obbligatorio'
                  );
                END IF;

                UPDATE vendite.fatturazione_lotti_task_runs
                   SET task_stato = 'COMPLETATO',
                       ended_at = now(),
                       meta = COALESCE(meta, '{}'::jsonb) || COALESCE(p_meta, '{}'::jsonb),
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_task_run_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_complete_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','task_run non trovato','task_run_id',p_task_run_id)
                    ),
                    NULL::uuid,
                    concat('task_run non trovato id:', p_task_run_id::text)
                  );
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_complete_lotto_task_run(bigint, jsonb)
              IS 'Chiude un task run lotto con esito COMPLETATO.';

  - changeSet:
      id: 20260218-07-05-create-fn-fail-lotto-task-run
      author: mctit
      comment: "Chiude run task con esito ERRORE"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_fail_lotto_task_run(
                p_task_run_id vendite.fatturazione_lotti_task_runs.id%TYPE,
                p_error_code vendite.fatturazione_lotti_task_runs.error_code%TYPE,
                p_error_message vendite.fatturazione_lotti_task_runs.error_message%TYPE,
                p_meta vendite.fatturazione_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Chiude un task run con stato ERRORE.
                -- =========================================================
                IF p_task_run_id IS NULL OR p_task_run_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_fail_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','LOTTO','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
