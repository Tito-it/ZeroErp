databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260226-09-update-fn-get-commessa-stato-ptype-mctit.yaml

  - changeSet:
      id: 20260226-09-update-fn-get-commessa-stato-ptype
      author: mctit
      # ⚠️ Era `true`: definisce vendite.fn_get_commessa_stato, che un changeSet PIU' RECENTE
      #   ridefinisce. Rigirando riportava indietro quella revisione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      comment: "Riscrive fn_get_commessa_stato con %TYPE su parametri e RETURNS TABLE. DROP preventivo per cambio tipi colonna."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Drop preventivo: RETURNS TABLE passa da tipi espliciti a %TYPE
              DROP FUNCTION IF EXISTS vendite.fn_get_commessa_stato(bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_get_commessa_stato(
                p_commessa_id vendite.commesse.id%TYPE
              )
              RETURNS TABLE(
                commessa_id vendite.commesse.id%TYPE,
                stato_commessa_id vendite.commesse.stato_commessa_id%TYPE,
                stato_commessa vendite.stati_commessa.codice%TYPE,
                chiude_commessa vendite.stati_commessa.chiude_commessa%TYPE,
                emittibile vendite.stati_commessa.emittibile%TYPE,
                modificabile vendite.stati_commessa.modificabile%TYPE,
                policy_fatturazione vendite.commesse.policy_fatturazione%TYPE,
                fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE,
                priorita_operativa vendite.commesse.priorita_operativa%TYPE,
                billing_account_id vendite.commesse.billing_account_id%TYPE,
                utility_id vendite.commesse.utility_id%TYPE,
                emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                total_attivita bigint,
                total_approvate bigint,
                total_non_approvate bigint,
                total_emesse bigint,
                total_non_emesse bigint,
                total_prezzo_da_riallineare bigint,
                last_update vendite.commesse.data_update%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Fornire in un'unica chiamata stato testata commessa,
                --   flag operativi da stati_commessa e contatori principali
                --   delle righe commessa.
                --
                -- Regole:
                --   - p_commessa_id obbligatorio e > 0
                --   - errore esplicito se commessa non trovata
                --   - stato_commessa restituito da stati_commessa.codice
                --     per backward compatibility
                -- =========================================================
                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_get_commessa_stato','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','commessa_id obbligatorio','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    'commessa_id obbligatorio'
                  );
                END IF;

                IF NOT EXISTS (
                  SELECT 1
                  FROM vendite.commesse c
                  WHERE c.id = p_commessa_id
                ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_get_commessa_stato','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','commessa non trovata','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    concat('commessa non trovata: ', p_commessa_id::text)
                  );
                END IF;

                RETURN QUERY
                SELECT
                  c.id AS commessa_id,
                  c.stato_commessa_id,
                  sc.codice AS stato_commessa,
                  sc.chiude_commessa,
                  sc.emittibile,
                  sc.modificabile,
                  c.policy_fatturazione,
                  c.fatturazione_immediata,
                  c.priorita_operativa,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  COALESCE(count(ca.id), 0)::bigint AS total_attivita,
                  COALESCE(count(*) FILTER (WHERE ca.stato_approvazione = 'APPROVATA'), 0)::bigint AS total_approvate,
                  COALESCE(count(*) FILTER (WHERE ca.stato_approvazione <> 'APPROVATA'), 0)::bigint AS total_non_approvate,
                  COALESCE(count(*) FILTER (WHERE ca.stato_emissione = 'EMESSA'), 0)::bigint AS total_emesse,
                  COALESCE(count(*) FILTER (WHERE ca.stato_emissione <> 'EMESSA'), 0)::bigint AS total_non_emesse,
                  COALESCE(count(*) FILTER (WHERE ca.prezzo_da_riallineare IS TRUE), 0)::bigint AS total_prezzo_da_riallineare,
                  GREATEST(c.data_update, COALESCE(max(ca.data_update), c.data_update)) AS last_update
                FROM vendite.commesse c
                JOIN vendite.stati_commessa sc
                  ON sc.id = c.stato_commessa_id
                LEFT JOIN vendite.commesse_attivita ca
                  ON ca.commessa_id = c.id
                WHERE c.id = p_commessa_id
                GROUP BY
                  c.id,
                  c.stato_commessa_id,
                  sc.codice,
                  sc.chiude_commessa,
                  sc.emittibile,
                  sc.modificabile,
                  c.policy_fatturazione,
                  c.fatturazione_immediata,
                  c.priorita_operativa,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.data_update;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_commessa_stato(bigint)
              IS 'Restituisce stato testata commessa (con FK stato_commessa_id + codice per backward compat), flag operativi (chiude/emittibile/modificabile) e contatori principali di commesse_attivita in un singolo round-trip.';
