# LA PERIODICITA' DEL KIT DI UNA VERSIONE DI LISTINO: SOLO IN BOZZA, DALLA CHECK
#   Brief: brief-db-stati-documento-dal-vocabolario §6.28, giro 6f-ter (R-L2 del
#   BE/FE; Tid, 2026-11-15).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   «Solo in bozza» stava nel corpo del guard, e nessuna superficie lo diceva:
#   il FE lo ricopiava (isBozza, azione periodicita-kit). Fuori dalla bozza il
#   guard sollevava E_RIGA_LISTINO_VERSIONE_CHIUSA anche su una ATTIVA.
#
# ── LA CORREZIONE ──────────────────────────────────────────────────
#   Il primo motivo di script.fn_check_listino_riga_scrivibile (20261115-65),
#   la regola delle righe e dei prezzi dei componenti (-69): CHIUSA
#   E_RIGA_LISTINO_VERSIONE_CHIUSA, la ATTIVA E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA.
#   Una versione che non si legge non si giudica piu' qui: la policy e la FK
#   della tabella. Il composito resta com'era.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, INVOKER, nessun SET; il montaggio non
#   cambia. Il rollback porta corpo e COMMENT letti dal catalogo dello scratch
#   il 2026-11-15 (il corpo del 20261115-48).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-70-update-trgfn-listini-kit-guard-dalla-check-mctit.yaml

  - changeSet:
      id: 20261115-70-update-trgfn-listini-kit-guard-dalla-check
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_kit_guard: il kit solo in bozza, dalla check delle righe.
        Brief: brief-db-stati-documento-dal-vocabolario, giro 6f-ter.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_kit_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: la riga di vendite.listini_kit si scrive solo in una versione in
              --   bozza (INSERT, UPDATE, DELETE), come le righe
              --   (script.fn_check_listino_riga_scrivibile, la stessa che dice la
              --   superficie della versione), e solo per un articolo composito.
              --   Regola completa nell'intestazione dei changeSet 20261031-30 e
              --   20261115-70.
              DECLARE
                  v_composito   catalogo.articoli.is_composito%TYPE;
                  v_codice      catalogo.articoli.codice%TYPE;
              BEGIN
                  -- 1. Solo in bozza.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      script.fn_check_listino_riga_scrivibile(
                          CASE WHEN TG_OP = 'INSERT' THEN NEW.listino_versione_id ELSE OLD.listino_versione_id END,
                          CASE WHEN TG_OP = 'INSERT' THEN NULL ELSE OLD.id END,
                          TG_OP),
                      NULL,
                      NULL::uuid,
                      jsonb_build_object('operazione', TG_OP, 'tabella', 'listini_kit'));

                  IF TG_OP = 'DELETE' THEN
                      RETURN OLD;
                  END IF;

                  -- 2. Il kit e' un composito.
                  SELECT a.is_composito, a.codice INTO v_composito, v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = NEW.articolo_padre_id;

                  IF v_composito IS NOT TRUE THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_LISTINO_KIT_NON_COMPOSITO',
                          jsonb_build_object(
                              'campo',               'articolo_padre_id',
                              'articolo_padre_id',   NEW.articolo_padre_id,
                              'listino_versione_id', NEW.listino_versione_id),
                          NULL::uuid,
                          COALESCE(v_codice, NEW.articolo_padre_id::text));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_kit_guard()
              IS 'Guard di vendite.listini_kit: la riga (la periodicita'' di un kit su una versione di listino) si scrive solo in una versione in bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni, in INSERT, UPDATE e DELETE, come le righe e i prezzi dei componenti: solleva il primo motivo di script.fn_check_listino_riga_scrivibile, la regola che dice anche la superficie vendite.vw_listini_versioni_azioni (periodicita_kit_blocco_*): CHIUSA E_RIGA_LISTINO_VERSIONE_CHIUSA, fuori dalla bozza E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA. E solo per un articolo composito (E_LISTINO_KIT_NON_COMPOSITO): la periodicita'' di un articolo semplice sta sulla sua riga di listino. L''identita'' la ferma il lucchetto generato. E'' il verbo dell''azione PERIODICITA_KIT_LISTINO nel registro config.azioni_riga: il kit si scrive direttamente, e chi rifiuta e'' questo guard.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_kit_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: la riga di vendite.listini_kit si scrive solo in una versione in
              --   bozza, lo stato iniziale del vocabolario (INSERT, UPDATE, DELETE), e
              --   solo per un articolo composito.
              --   Regola completa nell'intestazione del changeSet 20261031-30.
              DECLARE
                  v_stato       config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_iniziale    config.stati_doc_listino_versioni.iniziale%TYPE;
                  v_riga_id     vendite.listini_kit.id%TYPE;
                  v_versione_id vendite.listini_kit.listino_versione_id%TYPE;
                  v_composito   catalogo.articoli.is_composito%TYPE;
                  v_codice      catalogo.articoli.codice%TYPE;
              BEGIN
                  v_riga_id     := CASE WHEN TG_OP = 'DELETE' THEN OLD.id ELSE NEW.id END;
                  v_versione_id := CASE WHEN TG_OP = 'DELETE' THEN OLD.listino_versione_id
                                        ELSE NEW.listino_versione_id END;

                  SELECT s.codice_interno, s.iniziale INTO v_stato, v_iniziale
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = v_versione_id;

                  -- 1. Solo in bozza. Una versione che non si legge non e' una bozza.
                  IF v_iniziale IS NOT TRUE THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'operazione',          TG_OP,
                              'stato_versione',      v_stato,
                              'listino_versione_id', v_versione_id,
                              'riga_id',             v_riga_id,
                              'tabella',             'listini_kit'),
                          NULL::uuid,
                          TG_OP, COALESCE(v_riga_id::text, 'nuova'), COALESCE(v_stato, 'NULL'));
                  END IF;

                  IF TG_OP = 'DELETE' THEN
                      RETURN OLD;
                  END IF;

                  -- 2. Il kit e' un composito.
                  SELECT a.is_composito, a.codice INTO v_composito, v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = NEW.articolo_padre_id;

                  IF v_composito IS NOT TRUE THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_LISTINO_KIT_NON_COMPOSITO',
                          jsonb_build_object(
                              'campo',               'articolo_padre_id',
                              'articolo_padre_id',   NEW.articolo_padre_id,
                              'listino_versione_id', NEW.listino_versione_id),
                          NULL::uuid,
                          COALESCE(v_codice, NEW.articolo_padre_id::text));
                  END IF;

                  RETURN NEW;
              END;
              $function$
              ;

              COMMENT ON FUNCTION vendite.trgfn_listini_kit_guard()
              IS 'Guard di vendite.listini_kit: la riga (la periodicita'' di un kit su una versione di listino) si scrive solo in una versione in bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni, in INSERT, UPDATE e DELETE (E_RIGA_LISTINO_VERSIONE_CHIUSA, come i componenti), e solo per un articolo composito (E_LISTINO_KIT_NON_COMPOSITO): la periodicita'' di un articolo semplice sta sulla sua riga di listino. Una versione che non si legge non e'' una bozza. L''identita'' la ferma il lucchetto generato.';
