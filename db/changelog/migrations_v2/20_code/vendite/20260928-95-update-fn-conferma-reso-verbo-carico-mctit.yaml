# P-8 — La conferma del reso diventa un VERBO, e fa rientrare la merce
#   vendite.fn_conferma_reso(bigint) — DEFINER, permesso, porta, carico
#   Brief: brief-db-magazzino-lotto-3-bis-carico-da-reso, sezione 3 (D-3b-b, -c, -f)
#
# -- PERCHE' UN VERBO (D-3b-f) -----------------------------------------------------------------------
#   Il posting di magazzino e' riservato: una funzione INVOKER non lo puo'
#   chiamare. E per la D-1 del permesso nel verbo, un dominio passa al modello
#   «una scrittura = un verbo» quando un cantiere tocca le sue scritture: questo
#   lo fa. Lo stampo e' vendite.fn_cambia_stato_ddt (Lotto 3).
#   * SECURITY DEFINER del proprietario, search_path bloccato (ogni nome nel
#     corpo e' gia' qualificato);
#   * testata FOR UPDATE con il predicato della policy nella WHERE
#     (script.fn_scope_ef_whitelist_via_reso): fuori perimetro E_RESO_NOT_FOUND,
#     la stessa risposta di prima sotto RLS;
#   * script.fn_guard_azione(utente, 'conferma_reso') su OGNI conferma, anche di
#     un reso senza merce: la conferma apre il credito e riapre il residuo
#     dell'ordine, e' un atto di processo comunque (Tid, 28-09).
#
# -- LA MERCE (D-3b-b, -c) ---------------------------------------------------------------------------
#   Su un reso che fa rientrare merce, in quest'ordine:
#   1. lock della bolla d'origine: il tetto per prelievo somma i rientri di
#      TUTTI i suoi resi, e due conferme concorrenti si serializzano qui;
#   2. la conferma che parla: primo motivo di script.fn_check_reso_merce, che
#      conta gia' gli automatici (PRIMA di crearli: la stessa risposta della
#      capability);
#   3. i rientri automatici;
#   4. lo stato, con la porta del registro aperta per QUESTO reso;
#   5. in coda, i carichi (magazzino.fn_posta_reso).
#   Una transazione: o tutto, o niente.
#
# -- LA FIRMA NON CAMBIA -----------------------------------------------------------------------------
#   RETURNS void, come prima: il backend (resi_repository) e i pgTAP la
#   chiamano uguale. Cambiano SECURITY DEFINER e search_path, che un CREATE OR
#   REPLACE puo' cambiare senza DROP.
#   ⚠️ Chi la chiama deve avere l'azione conferma_reso: i pgTAP che confermano
#   un reso la concedono all'utente di prova (brief §5-bis).
#
#   Corpo di partenza: la doc auto-generata (rev 2026-07-17), non uno YAML. I
#   passi 3 (ordini) e 4 (flip della bolla) restano identici.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-95-update-fn-conferma-reso-verbo-carico-mctit.yaml

  - changeSet:
      id: 20260928-95-update-fn-conferma-reso-verbo-carico
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_conferma_reso diventa un VERBO: SECURITY DEFINER, perimetro nella WHERE, permesso
        conferma_reso su ogni conferma, porta del registro; su un reso che fa rientrare merce lock
        della bolla d'origine, primo motivo di script.fn_check_reso_merce, rientri automatici e
        carichi (magazzino.fn_posta_reso) nella stessa transazione. Firma invariata. Brief: brief-
        db-magazzino-lotto-3-bis-carico-da-reso, sezione 3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "4"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('magazzino', 'fn_posta_reso'),
                                                ('script', 'fn_check_reso_merce'),
                                                ('script', 'fn_guard_azione'),
                                                ('script', 'fn_scope_ef_whitelist_via_reso'));
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_conferma_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-f):
              --   VERBO del modello «una scrittura = un verbo». SECURITY DEFINER con
              --   search_path bloccato (ogni nome qui dentro e' qualificato), testata presa
              --   FOR UPDATE con il predicato della policy nella WHERE (fuori perimetro:
              --   E_RESO_NOT_FOUND, no-leak, come prima sotto RLS), permesso 'conferma_reso'
              --   (script.fn_guard_azione) prima di qualunque scrittura. Lo stato si scrive
              --   aprendo la porta del registro (GUC zeroerp.reso_cambio_stato, Regola 2 di
              --   vendite.trgfn_resi_guard_transizione).
              DECLARE
                  v_utente            config.user_override_azioni.auth_user_id%TYPE;
                  v_reso              vendite.resi%ROWTYPE;
                  v_muove             boolean;   -- calcolato, nessuna colonna
                  v_stato             config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_conf_id     config.stati_doc_reso.id%TYPE;
                  v_ddt_uid           vendite.resi.sorgente_uid%TYPE;
                  v_ddt_id            vendite.ddt.id%TYPE;
                  v_ddt_stato         config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_reso_ddt_id config.stati_doc_ddt.id%TYPE;
                  v_stato_target_id   config.stati_doc_ordini.id%TYPE;
                  v_tutto_reso        boolean;
                  v_ord               RECORD;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  -- 1) Guard input + reso in DRAFT + almeno una riga.
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT r.* INTO v_reso
                    FROM vendite.resi r
                   WHERE r.id = p_reso_id
                     AND script.fn_scope_ef_whitelist_via_reso(v_utente, r.id)
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  SELECT sdr.codice_interno INTO v_stato
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = v_reso.stato_doc_reso_id;
                  v_ddt_uid := v_reso.sorgente_uid;

                  -- Il permesso, prima di scrivere qualunque cosa (D-2). Su OGNI conferma,
                  -- anche di un reso che non muove merce (D-3b-f).
                  PERFORM script.fn_guard_azione(v_utente, 'conferma_reso');

                  IF v_stato IS DISTINCT FROM 'DRAFT' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_STATO_NON_CONFERMABILE',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_stato),
                          NULL::uuid, p_reso_id::text, v_stato);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM vendite.resi_righe
                                  WHERE reso_id = p_reso_id AND attivo IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_SENZA_RIGHE',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- 1-bis) La merce che rientra (rev 2026-09-28, D-3b-b/-c). Su un reso
                  --    che fa rientrare merce: il lock della bolla d'origine (il tetto per
                  --    prelievo somma i rientri di tutti i suoi resi: due conferme
                  --    concorrenti si serializzano qui), la conferma che parla (primo
                  --    motivo di script.fn_check_reso_merce, che conta gia' gli
                  --    automatici), poi i rientri automatici, finche' il reso e' in bozza.
                  v_muove := vendite.fn_reso_muove_merce(v_reso);
                  IF v_muove THEN
                      PERFORM 1 FROM vendite.ddt d WHERE d.uid = v_reso.sorgente_uid FOR UPDATE;
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', 'vendite.fn_conferma_reso',
                          script.fn_check_reso_merce(v_reso), NULL, NULL::uuid,
                          jsonb_build_object('reso_id', p_reso_id));
                      INSERT INTO vendite.resi_righe_rientri (resi_riga_id, ddt_riga_prelievo_id, qta)
                      SELECT m.resi_riga_id, m.prelievo_unico_id, m.qta
                        FROM vendite.fn_reso_merce_da_rientrare(v_reso) m
                       WHERE m.automatico;
                  END IF;

                  -- 2) Transizione a CONFERMATO (gen_numero + guard_transizione). La
                  --    porta del registro si apre per QUESTO reso (rev 2026-09-28).
                  SELECT id INTO v_stato_conf_id FROM config.stati_doc_reso
                   WHERE codice_interno = 'CONFERMATO' AND attivo IS TRUE;
                  PERFORM set_config('zeroerp.reso_cambio_stato', p_reso_id::text, true);
                  UPDATE vendite.resi
                     SET stato_doc_reso_id = v_stato_conf_id
                   WHERE id = p_reso_id;
                  PERFORM set_config('zeroerp.reso_cambio_stato', '', true);

                  -- 3) Proiezione stato ordine per ogni ordine coinvolto (solo
                  --    righe ri-consegna: quelle che riaprono il residuo).
                  FOR v_ord IN
                      SELECT DISTINCT orr.ordine_id
                        FROM vendite.resi_righe rr
                        JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                        JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                       WHERE rr.reso_id = p_reso_id
                         AND tr.riapre_residuo IS TRUE
                  LOOP
                      IF vendite.fn_ordine_ha_residuo_evasione(v_ord.ordine_id) THEN
                          SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                           WHERE codice_interno = 'PARZIALMENTE_EVASO' AND attivo IS TRUE;
                      ELSE
                          SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                           WHERE codice_interno = 'EVASO' AND attivo IS TRUE;
                      END IF;

                      UPDATE vendite.ordini
                         SET stato_doc_ordine_id = v_stato_target_id
                       WHERE id = v_ord.ordine_id
                         AND stato_doc_ordine_id IS DISTINCT FROM v_stato_target_id;
                  END LOOP;

                  -- 4) Flip DDT origine -> RESO se reso TOTALE (tutte le qta
                  --    consegnate del DDT rese da resi EFFETTIVI). Solo se il
                  --    DDT e' CONSEGNATO (matrice CONSEGNATO->RESO).
                  SELECT d.id, sdd.codice_interno
                    INTO v_ddt_id, v_ddt_stato
                    FROM vendite.ddt d
                    JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                   WHERE d.uid = v_ddt_uid;

                  IF v_ddt_id IS NOT NULL AND v_ddt_stato = 'CONSEGNATO' THEN
                      SELECT bool_and(COALESCE(reso_riga.tot, 0) >= dr.quantita)
                        INTO v_tutto_reso
                        FROM vendite.ddt_righe dr
                        LEFT JOIN (
                            -- rev 2026-07-17 (step 2): fonte unica
                            -- vw_resi_righe_effettive (CONFERMATE + attive, tutti
                            -- i tipi). Il flip non filtra il tipo: conta tutta la
                            -- merce tornata indietro su ogni riga DDT.
                            SELECT e.ddt_riga_id, SUM(e.quantita) AS tot
                              FROM vendite.vw_resi_righe_effettive e
                             GROUP BY e.ddt_riga_id
                        ) reso_riga ON reso_riga.ddt_riga_id = dr.id
                       WHERE dr.ddt_id = v_ddt_id
                         AND dr.attivo IS TRUE;

                      IF COALESCE(v_tutto_reso, false) THEN
                          SELECT id INTO v_stato_reso_ddt_id FROM config.stati_doc_ddt
                           WHERE codice_interno = 'RESO' AND attivo IS TRUE;
                          UPDATE vendite.ddt
                             SET stato_doc_ddt_id = v_stato_reso_ddt_id
                           WHERE id = v_ddt_id;
                      END IF;
                  END IF;

                  -- 5) I carichi (rev 2026-09-28, D-3b-c): uno per rientro, al costo
                  --    dell'uscita d'origine, nella stessa transazione della conferma.
                  IF v_muove THEN
                      PERFORM 1 FROM magazzino.fn_posta_reso(p_reso_id);
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_conferma_reso(p_reso_id vendite.resi.id%TYPE)
              IS 'Madre conferma reso: DRAFT->CONFERMATO (numero+guard), proiezione stato ordine (residuo reso-aware -> PARZIALMENTE_EVASO/EVASO), flip DDT origine CONSEGNATO->RESO se reso totale. brief §5. rev 2026-07-13. rev 2026-07-17 (step 2b): il flip conta solo i resi CONFERMATI. rev 2026-07-17 (step 2): il flip legge l helper unico vw_resi_righe_effettive (CONFERMATE+attive, tutti i tipi). ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-b/-c/-f): VERBO. SECURITY DEFINER con search_path bloccato; testata FOR UPDATE nel perimetro (script.fn_scope_ef_whitelist_via_reso nella WHERE, fuori perimetro E_RESO_NOT_FOUND); permesso conferma_reso su OGNI conferma (script.fn_guard_azione, E_PERMESSO_NEGATO). Su un reso che fa rientrare merce (vendite.fn_reso_muove_merce): lock della bolla d''origine, primo motivo di script.fn_check_reso_merce, rientri automatici, poi lo stato con la porta del registro aperta (GUC zeroerp.reso_cambio_stato) e in coda i carichi (magazzino.fn_posta_reso, CARICO_RESO_VEN al costo dell''uscita). UNA transazione. La firma non cambia (RETURNS void).';
