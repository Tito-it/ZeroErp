databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260213-18-update-fn-sync-pagamento-fondo-fattura-deprecated-mctit.yaml

  - changeSet:
      id: 20260213-18-update-fn-sync-pagamento-fondo-fattura-deprecated
      author: mctit
      comment: "Depreca fn_sync_pagamento_fondo_fattura delegando a fn_sync_contabili_fondo_fattura"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_pagamento_fondo_fattura(
                p_fattura_figlia_id vendite.fatture.id%TYPE
              )
              RETURNS TABLE(
                inserted_movimenti integer,
                updated_movimenti integer,
                annullati_source integer
              )
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_inserted integer := 0;
                v_updated integer := 0;
                v_annullati integer := 0;
              BEGIN
                -- =========================================================
                -- DEPRECATA:
                --   mantenuta per retrocompatibilita'. La logica reale ora
                --   e' in vendite.fn_sync_contabili_fondo_fattura().
                -- =========================================================

                SELECT s.inserted_righe, s.updated_righe, s.annullati_source
                  INTO v_inserted, v_updated, v_annullati
                  FROM vendite.fn_sync_contabili_fondo_fattura(
                    p_fattura_figlia_id => p_fattura_figlia_id
                  ) s;

                RETURN QUERY
                SELECT v_inserted, v_updated, v_annullati;
              END;
              $$;

              COMMENT ON FUNCTION vendite.fn_sync_pagamento_fondo_fattura(vendite.fatture.id%TYPE)
                IS 'DEPRECATA: wrapper retrocompatibile. Usa vendite.fn_sync_contabili_fondo_fattura().';
