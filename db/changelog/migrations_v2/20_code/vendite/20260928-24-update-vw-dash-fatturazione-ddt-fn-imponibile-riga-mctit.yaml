# vendite.vw_dash_fatturazione_ddt: il valore di riga dalla sede unica.
#
# `valore_riga` usa il prezzo del DDT o, se manca, quello della riga d'ordine
# evasa (COALESCE): quella scelta resta nella vista, e' un argomento della
# funzione, non una sua regola.
#
# ⚠️ Questa copia divideva lo sconto per `100.0` invece che per `100`: il
#   VALORE e' identico (la divisione per cento e' esatta in numeric), cambia
#   al piu' la SCALA del numeric non arrotondato. La vista espone somme che il
#   cruscotto formatta; l'equivalenza e' provata sul valore, riga per riga, nel
#   brief (§8.10).
#
# -- COSA CAMBIA, e cosa NO ------------------------------------------------
#   Solo l'espressione dell'imponibile: al posto della formula scritta a mano,
#   la sede unica script.fn_imponibile_riga (20260928-16, D-8.8 del brief).
#   Stesso valore, stesse colonne con gli stessi nomi, tipi e posizioni
#   (CREATE OR REPLACE VIEW non ammette altro), stessi filtri, stesso COMMENT
#   (resta sull'oggetto). `security_invoker` e' RIPETUTO: e' una reloption,
#   non sta nel corpo, e un CREATE OR REPLACE che non la ripete la azzera.
#
# Base: corpo vivo dalla doc auto-gen (identico a pg_get_viewdef sullo scratch
#   il 2026-09-28), patchato da uno script che dichiara la sostituzione e ne
#   CONTA le occorrenze: nessun'altra riga toccata.
# Cantiere: brief-db-liste-righe-documento §8.8 (D-8.8), §8.10 passo 3
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-24-update-vw-dash-fatturazione-ddt-fn-imponibile-riga-mctit.yaml

  - changeSet:
      id: 20260928-24-update-vw-dash-fatturazione-ddt-fn-imponibile-riga
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_dash_fatturazione_ddt: valore_riga da script.fn_imponibile_riga (stessi
        argomenti, prezzo con ripiego sull'ordine) invece della formula a mano. Stesso
        valore, security_invoker ripetuto.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_imponibile_riga'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_ddt
              WITH (security_invoker=on) AS
              WITH righe AS (
                       SELECT dr.ddt_id,
                          dr.id AS riga_id,
                          script.fn_imponibile_riga(dr.quantita, COALESCE(dr.prezzo_unitario, src.src_prezzo_unitario), dr.sconto_percentuale) AS valore_riga,
                          (EXISTS ( SELECT 1
                                 FROM vendite.commesse_attivita ca
                                WHERE (((ca.segment_key)::text = ((('DDT:'::text || (d2.uid)::text) || ':R:'::text) || (dr.id)::text)) AND ((ca.stato_emissione)::text = 'EMESSA'::text)))) AS transitata
                         FROM ((vendite.ddt_righe dr
                           JOIN vendite.ddt d2 ON ((d2.id = dr.ddt_id)))
                           LEFT JOIN LATERAL ( SELECT or_r.prezzo_unitario AS src_prezzo_unitario
                                 FROM (vendite.ordini_righe_fulfillment ful
                                   JOIN vendite.ordini_righe or_r ON ((or_r.id = ful.ordine_riga_id)))
                                WHERE (ful.ddt_riga_id = dr.id)
                                ORDER BY ful.id
                               LIMIT 1) src ON (true))
                        WHERE (dr.attivo IS TRUE)
                      )
               SELECT 'DDT'::character varying AS area,
                  (date_trunc('month'::text, (d.data)::timestamp with time zone))::date AS competenza_mese,
                  d.id AS documento_id,
                  (d.uid)::text AS documento_uid,
                  (d.numero)::text AS codice,
                  d.emittente_fiscale_id,
                  NULL::bigint AS emittente_soggetto_ruolo_id,
                  COALESCE(sum(r.valore_riga), (0)::numeric) AS valore_totale,
                  COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), (0)::numeric) AS valore_transitato,
                  (count(r.riga_id))::integer AS unita_totali,
                  (count(r.riga_id) FILTER (WHERE r.transitata))::integer AS unita_transitate,
                  ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) AS is_transitato,
                  sdd.is_abortito,
                  (
                      CASE
                          WHEN sdd.is_abortito THEN NULL::text
                          WHEN ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) THEN NULL::text
                          WHEN ((sdd.codice_interno)::text = 'DRAFT'::text) THEN 'DOC_BOZZA'::text
                          WHEN (sdd.ordine < COALESCE(trg.ordine, sped.ordine)) THEN 'IN_TRANSITO'::text
                          WHEN (count(r.riga_id) FILTER (WHERE r.transitata) = 0) THEN 'PUSH_NON_ESEGUITO'::text
                          ELSE 'PUSH_PARZIALE'::text
                      END)::character varying AS motivo_fermo,
                  sdd.codice_interno AS stato_codice_interno,
                  sdd.codice AS stato_codice,
                  sdd.fase,
                  s.ragione_sociale_completa AS cliente_display,
                  d.data AS data_riferimento
                 FROM ((((((((vendite.ddt d
                   JOIN config.stati_doc_ddt sdd ON ((sdd.id = d.stato_doc_ddt_id)))
                   JOIN config.causali_trasporto caus ON (((caus.id = d.causale_trasporto_id) AND (caus.fatturabile IS TRUE))))
                   LEFT JOIN LATERAL ( SELECT o_src.fatturazione_trigger
                         FROM (((vendite.ordini_righe_fulfillment ful
                           JOIN vendite.ordini_righe or_r ON ((or_r.id = ful.ordine_riga_id)))
                           JOIN vendite.ordini o_src ON ((o_src.id = or_r.ordine_id)))
                           JOIN vendite.ddt_righe dr2 ON ((dr2.id = ful.ddt_riga_id)))
                        WHERE (dr2.ddt_id = d.id)
                        ORDER BY ful.id
                       LIMIT 1) ord ON (true))
                   LEFT JOIN config.stati_doc_ddt trg ON (((trg.codice_interno)::text = (ord.fatturazione_trigger)::text)))
                   LEFT JOIN config.stati_doc_ddt sped ON (((sped.codice_interno)::text = 'SPEDITO'::text)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = d.destinatario_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   LEFT JOIN righe r ON ((r.ddt_id = d.id)))
                WHERE ((COALESCE(ord.fatturazione_trigger, 'SPEDITO'::character varying))::text <> 'CONFERMATO'::text)
                GROUP BY d.id, d.uid, d.numero, d.data, d.emittente_fiscale_id, sdd.codice_interno, sdd.codice, sdd.fase, sdd.is_abortito, sdd.ordine, trg.ordine, sped.ordine, s.ragione_sociale_completa;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino: il corpo vivo prima di questo changeSet (formula scritta
              -- a mano), dalla doc auto-gen del 2026-09-28.
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_ddt
              WITH (security_invoker=on) AS
              WITH righe AS (
                       SELECT dr.ddt_id,
                          dr.id AS riga_id,
                          ((dr.quantita * COALESCE(dr.prezzo_unitario, src.src_prezzo_unitario)) * ((1)::numeric - (COALESCE(dr.sconto_percentuale, (0)::numeric) / 100.0))) AS valore_riga,
                          (EXISTS ( SELECT 1
                                 FROM vendite.commesse_attivita ca
                                WHERE (((ca.segment_key)::text = ((('DDT:'::text || (d2.uid)::text) || ':R:'::text) || (dr.id)::text)) AND ((ca.stato_emissione)::text = 'EMESSA'::text)))) AS transitata
                         FROM ((vendite.ddt_righe dr
                           JOIN vendite.ddt d2 ON ((d2.id = dr.ddt_id)))
                           LEFT JOIN LATERAL ( SELECT or_r.prezzo_unitario AS src_prezzo_unitario
                                 FROM (vendite.ordini_righe_fulfillment ful
                                   JOIN vendite.ordini_righe or_r ON ((or_r.id = ful.ordine_riga_id)))
                                WHERE (ful.ddt_riga_id = dr.id)
                                ORDER BY ful.id
                               LIMIT 1) src ON (true))
                        WHERE (dr.attivo IS TRUE)
                      )
               SELECT 'DDT'::character varying AS area,
                  (date_trunc('month'::text, (d.data)::timestamp with time zone))::date AS competenza_mese,
                  d.id AS documento_id,
                  (d.uid)::text AS documento_uid,
                  (d.numero)::text AS codice,
                  d.emittente_fiscale_id,
                  NULL::bigint AS emittente_soggetto_ruolo_id,
                  COALESCE(sum(r.valore_riga), (0)::numeric) AS valore_totale,
                  COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), (0)::numeric) AS valore_transitato,
                  (count(r.riga_id))::integer AS unita_totali,
                  (count(r.riga_id) FILTER (WHERE r.transitata))::integer AS unita_transitate,
                  ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) AS is_transitato,
                  sdd.is_abortito,
                  (
                      CASE
                          WHEN sdd.is_abortito THEN NULL::text
                          WHEN ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) THEN NULL::text
                          WHEN ((sdd.codice_interno)::text = 'DRAFT'::text) THEN 'DOC_BOZZA'::text
                          WHEN (sdd.ordine < COALESCE(trg.ordine, sped.ordine)) THEN 'IN_TRANSITO'::text
                          WHEN (count(r.riga_id) FILTER (WHERE r.transitata) = 0) THEN 'PUSH_NON_ESEGUITO'::text
                          ELSE 'PUSH_PARZIALE'::text
                      END)::character varying AS motivo_fermo,
                  sdd.codice_interno AS stato_codice_interno,
                  sdd.codice AS stato_codice,
                  sdd.fase,
                  s.ragione_sociale_completa AS cliente_display,
                  d.data AS data_riferimento
                 FROM ((((((((vendite.ddt d
                   JOIN config.stati_doc_ddt sdd ON ((sdd.id = d.stato_doc_ddt_id)))
                   JOIN config.causali_trasporto caus ON (((caus.id = d.causale_trasporto_id) AND (caus.fatturabile IS TRUE))))
                   LEFT JOIN LATERAL ( SELECT o_src.fatturazione_trigger
                         FROM (((vendite.ordini_righe_fulfillment ful
                           JOIN vendite.ordini_righe or_r ON ((or_r.id = ful.ordine_riga_id)))
                           JOIN vendite.ordini o_src ON ((o_src.id = or_r.ordine_id)))
                           JOIN vendite.ddt_righe dr2 ON ((dr2.id = ful.ddt_riga_id)))
                        WHERE (dr2.ddt_id = d.id)
                        ORDER BY ful.id
                       LIMIT 1) ord ON (true))
                   LEFT JOIN config.stati_doc_ddt trg ON (((trg.codice_interno)::text = (ord.fatturazione_trigger)::text)))
                   LEFT JOIN config.stati_doc_ddt sped ON (((sped.codice_interno)::text = 'SPEDITO'::text)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = d.destinatario_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   LEFT JOIN righe r ON ((r.ddt_id = d.id)))
                WHERE ((COALESCE(ord.fatturazione_trigger, 'SPEDITO'::character varying))::text <> 'CONFERMATO'::text)
                GROUP BY d.id, d.uid, d.numero, d.data, d.emittente_fiscale_id, sdd.codice_interno, sdd.codice, sdd.fase, sdd.is_abortito, sdd.ordine, trg.ordine, sped.ordine, s.ragione_sociale_completa;
