# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 2a (le testate): i montaggi
# di vendite.trgfn_doc_indirizzi_seguono_cliente
#   Brief: brief-db-grammatica-unica-documenti §11 (G-1, G-4 di Tid; L2-1).
#
#   Il primo argomento del trigger e' il documento nella grammatica delle
#   testate, che passa ai codici di config.sorgenti (DDT -> DDT_VENDITA,
#   ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO ->
#   RESO_VENDITA). Gli argomenti di un trigger si cambiano solo smontando e
#   rimontando: 2 montaggi, rigenerati da pg_get_triggerdef su dbdev
#   (2026-10-19) con il solo primo argomento cambiato. Stesso nome, fase,
#   eventi, WHEN e argomenti successivi. I montaggi con CONTRATTO,
#   PREVENTIVO, COMMESSA o FATTURA non cambiano e non si toccano.
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-74-remount-trg-doc-indirizzi-seguono-cliente-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-74-remount-trg-doc-indirizzi-seguono-cliente-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Rimonta i 2 montaggi di vendite.trgfn_doc_indirizzi_seguono_cliente col documento nel codice della sorgente. Grammatica unica, lotto 2a.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_m50_indirizzi_seguono_cliente_upd ON vendite.ddt;
              CREATE TRIGGER trg_ddt_m50_indirizzi_seguono_cliente_upd AFTER UPDATE ON vendite.ddt FOR EACH ROW WHEN (((old.billing_account_id IS DISTINCT FROM new.billing_account_id) OR (old.destinatario_soggetto_ruolo_id IS DISTINCT FROM new.destinatario_soggetto_ruolo_id))) EXECUTE FUNCTION vendite.trgfn_doc_indirizzi_seguono_cliente('DDT_VENDITA');

              DROP TRIGGER IF EXISTS trg_offerte_commerciali_m50_indirizzi_seguono_cliente_upd ON vendite.offerte_commerciali;
              CREATE TRIGGER trg_offerte_commerciali_m50_indirizzi_seguono_cliente_upd AFTER UPDATE ON vendite.offerte_commerciali FOR EACH ROW WHEN (((old.billing_account_id IS DISTINCT FROM new.billing_account_id) OR (old.istanza_utility_id IS DISTINCT FROM new.istanza_utility_id))) EXECUTE FUNCTION vendite.trgfn_doc_indirizzi_seguono_cliente('OFFERTA_COMMERCIALE');

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_m50_indirizzi_seguono_cliente_upd ON vendite.ddt;
              CREATE TRIGGER trg_ddt_m50_indirizzi_seguono_cliente_upd AFTER UPDATE ON vendite.ddt FOR EACH ROW WHEN (((old.billing_account_id IS DISTINCT FROM new.billing_account_id) OR (old.destinatario_soggetto_ruolo_id IS DISTINCT FROM new.destinatario_soggetto_ruolo_id))) EXECUTE FUNCTION vendite.trgfn_doc_indirizzi_seguono_cliente('DDT');

              DROP TRIGGER IF EXISTS trg_offerte_commerciali_m50_indirizzi_seguono_cliente_upd ON vendite.offerte_commerciali;
              CREATE TRIGGER trg_offerte_commerciali_m50_indirizzi_seguono_cliente_upd AFTER UPDATE ON vendite.offerte_commerciali FOR EACH ROW WHEN (((old.billing_account_id IS DISTINCT FROM new.billing_account_id) OR (old.istanza_utility_id IS DISTINCT FROM new.istanza_utility_id))) EXECUTE FUNCTION vendite.trgfn_doc_indirizzi_seguono_cliente('OFFERTA');

