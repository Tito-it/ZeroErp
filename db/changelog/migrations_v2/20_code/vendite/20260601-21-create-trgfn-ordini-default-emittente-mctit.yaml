#
# Trigger BEFORE INSERT su vendite.ordini che valorizza
# emittente_fiscale_id da GUC app.current_user_id via
# script.fn_resolve_emittente_for_user (modello user-derived).
# Skip se gia' valorizzato esplicitamente nel payload.
# Aggiunge anche il trigger require-active su emittente_fiscale_id.
# Pattern simmetrico a trgfn_contratti_default_emittente (20260526-03).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260601-21-create-trgfn-ordini-default-emittente-mctit.yaml

  - changeSet:
      id: 20260601-21-create-trgfn-ordini-default-emittente
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        BEFORE INSERT trigger su vendite.ordini che setta
        emittente_fiscale_id dall'operatore loggato (GUC app.current_user_id
        -> fn_resolve_emittente_for_user). Skip se NEW.emittente_fiscale_id
        non NULL. Errore E_ORDINE_EMITTENTE_NON_RISOLTO (id=467). Aggiunge
        require_active_parent su emittente_fiscale_id. Naming
        trg_ordini_a10_default_emittente_ins (ordina prima di _a10_guard_*).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: ordini
            columnName: emittente_fiscale_id
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- Function: vendite.trgfn_ordini_default_emittente
              --
              -- Scopo: valorizzare ordini.emittente_fiscale_id a INSERT-time
              --        dall'operatore loggato (GUC app.current_user_id,
              --        popolata dal middleware JwtAuditAuthentication).
              -- Modello user-derived (simmetrico a preventivi/contratti).
              -- Skip se gia' valorizzato (admin globale esplicito, push da
              -- documento sorgente che propaga l'emittente).
              -- ==========================================================
              CREATE OR REPLACE FUNCTION vendite.trgfn_ordini_default_emittente()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_user_id_text text;
                v_user_id      integer;
              BEGIN
                -- 1) Skip se gia' valorizzato esplicitamente nel payload.
                IF NEW.emittente_fiscale_id IS NOT NULL THEN
                  RETURN NEW;
                END IF;

                -- 2) Lettura GUC app.current_user_id (missing_ok=true).
                v_user_id_text := current_setting('app.current_user_id', true);

                IF v_user_id_text IS NULL OR btrim(v_user_id_text) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'trgfn_ordini_default_emittente',
                    'E_ORDINE_EMITTENTE_NON_RISOLTO',
                    jsonb_build_object(
                      'detail', 'GUC app.current_user_id vuota e payload senza emittente_fiscale_id',
                      'numero_ordine', NEW.numero
                    ),
                    NULL::uuid,
                    concat('GUC vuota, numero=', NEW.numero)
                  );
                END IF;

                v_user_id := v_user_id_text::integer;

                -- 3) Resolver operatore -> emittente (NULL per admin globale).
                NEW.emittente_fiscale_id := script.fn_resolve_emittente_for_user(v_user_id);

                IF NEW.emittente_fiscale_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'trgfn_ordini_default_emittente',
                    'E_ORDINE_EMITTENTE_NON_RISOLTO',
                    jsonb_build_object(
                      'detail', 'Operatore senza EF assegnato (admin globale): payload deve specificare emittente_fiscale_id',
                      'auth_user_id', v_user_id,
                      'numero_ordine', NEW.numero
                    ),
                    NULL::uuid,
                    concat('auth_user_id=', v_user_id::text, ', numero=', NEW.numero)
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ordini_default_emittente()
              IS 'BEFORE INSERT trigger fn: setta ordini.emittente_fiscale_id '
                 'da GUC app.current_user_id via script.fn_resolve_emittente_for_user. '
                 'Skip se valorizzato esplicitamente. Solleva E_ORDINE_EMITTENTE_NON_RISOLTO '
                 'se GUC vuota o operatore admin globale senza payload esplicito. '
                 'Pattern simmetrico a trgfn_contratti_default_emittente.';

              DROP TRIGGER IF EXISTS trg_ordini_a10_default_emittente_ins
                ON vendite.ordini;

              CREATE TRIGGER trg_ordini_a10_default_emittente_ins
                BEFORE INSERT ON vendite.ordini
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_ordini_default_emittente();

              COMMENT ON TRIGGER trg_ordini_a10_default_emittente_ins
                ON vendite.ordini
              IS 'Default emittente_fiscale_id da operatore loggato (GUC app.current_user_id). '
                 'Fase _a10_default_*: ordina prima di _a10_guard_*.';

              -- ==========================================================
              -- Trigger AFTER INSERT OR UPDATE: require emittente attivo.
              -- ==========================================================
              DROP TRIGGER IF EXISTS trg_ordini_a10_emittenti_fiscali_require_attivo_ins_upd
                ON vendite.ordini;

              CREATE TRIGGER trg_ordini_a10_emittenti_fiscali_require_attivo_ins_upd
                AFTER INSERT OR UPDATE OF emittente_fiscale_id
                ON vendite.ordini
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                    'anagrafiche', 'emittenti_fiscali', 'attivo',
                    'emittente_fiscale_id', 'id'
                );

              COMMENT ON TRIGGER trg_ordini_a10_emittenti_fiscali_require_attivo_ins_upd
                ON vendite.ordini
              IS 'Garantisce che emittente_fiscale_id punti a un emittenti_fiscali.attivo=true.';
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_ordini_a10_default_emittente_ins ON vendite.ordini;
              DROP TRIGGER IF EXISTS trg_ordini_a10_emittenti_fiscali_require_attivo_ins_upd ON vendite.ordini;
              DROP FUNCTION IF EXISTS vendite.trgfn_ordini_default_emittente();
