# ------------------------------------------------------------
# I RIENTRI DEL RESO: «SOLO IN BOZZA» DAL BUILDING BLOCK, LA COPIA SI RITIRA
#   vendite.resi_righe_rientri:
#     - trg_resi_righe_rientri_a05_guard_ins_upd_dlt        (DROP)
#     + trg_resi_righe_rientri_a05_doc_bozza_ins_upd_dlt
#       -> vendite.trgfn_doc_righe_lock_fuori_bozza('RESO', 'resi_riga_id', 'DRAFT', 'RIGA')
#     + trg_resi_righe_rientri_a10_guard_ins_upd
#       -> vendite.trgfn_resi_righe_rientri_guard()  (solo la coerenza)
#   Brief: brief-db-righe-esclusione-solo-non-si-vende (§8.2 B3, regola del 2)
#
# -- PERCHE' --------------------------------------------------------
#   vendite.trgfn_resi_righe_rientri_guard (20260928-90) faceva due cose:
#   (1) «solo in bozza», risalendo a mano dalla riga di reso alla testata e
#   sollevando E_RIGA_DOC_NON_BOZZA; (2) la coerenza del prelievo nominato.
#   La (1) e' la regola del building block, scritta una seconda volta. Dal
#   20261005-16 il building block sa risalire dalla riga (livello RIGA), e i
#   componenti di contratto e offerta lo adottano (-17): lasciare qui la copia
#   avrebbe fatto tre versioni della stessa regola. Si ritira nello stesso
#   giro (regola del 2, AGENTS.md).
#
# -- COSA CAMBIA, E COSA NO -------------------------------------------
#   * Stessa frase, stesso codice, stessi valori (etichetta, stato, verbo):
#     test-reso-carico-v1 test 15 la legge e resta verde.
#   * La riga di reso ora si legge dal lettore DEFINER
#     (script.fn_get_testata_id_di_riga), non sotto RLS: chi non vede la riga
#     non passa piu' il controllo di stato per sottrazione.
#   * Il contesto dell'errore e' quello del building block (table, id,
#     documento, testata_id, stato, operazione, riga_documento_id): la chiave
#     `riga_id` di prima si chiama `riga_documento_id`. Nessun consumatore la
#     leggeva (grep di backend/ e db/pgtap, 2026-10-05).
#   * Il guard che resta giudica solo la coerenza, che non e' un rifiuto di
#     stato: scende in fascia _a10_ e non scatta piu' sul DELETE (non aveva
#     niente da dire sul DELETE oltre allo stato).
#   * I prelievi della bolla NON fanno lo stesso: la loro regola ammette, in
#     EMESSO e SPEDITO, il cambio della sola ubicazione d'arrivo. E' un'altra
#     regola, non una copia (vedi -16).
#
#   Corpo di partenza: 20260928-90 (unica definizione), uguale alla doc
#   auto-generata; tolto il passo 1 e il ramo DELETE, COMMENT riscritto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261005-18-update-resi-righe-rientri-lock-su-bb-mctit.yaml

  - changeSet:
      id: 20261005-18-update-resi-righe-rientri-lock-su-bb
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.resi_righe_rientri: «solo in bozza» dal building block
        vendite.trgfn_doc_righe_lock_fuori_bozza a livello RIGA; trgfn_resi_righe_rientri_guard
        tiene solo la coerenza del prelievo. Brief: brief-db-righe-esclusione-solo-non-si-vende
        (§8.2 B3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_trigger t
               WHERE t.tgrelid = 'vendite.resi_righe_rientri'::regclass
                 AND t.tgname = 'trg_resi_righe_rientri_a05_guard_ins_upd_dlt';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER trg_resi_righe_rientri_a05_guard_ins_upd_dlt ON vendite.resi_righe_rientri;

              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_righe_rientri_guard()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: un rientro nomina un prelievo della riga di bolla da cui la
              --   riga di reso viene, e non cambia riga ne' prelievo (D-3b-b).
              --   «Solo in bozza» NON sta qui: lo dice il building block
              --   vendite.trgfn_doc_righe_lock_fuori_bozza a livello RIGA (rev
              --   2026-10-05), montato prima di questo guard.
              DECLARE
                  v_reso_id     vendite.resi_righe.reso_id%TYPE;
                  v_riga_nr     vendite.resi_righe.riga_nr%TYPE;
                  v_ddt_riga_id vendite.resi_righe.ddt_riga_id%TYPE;
                  v_prel_riga   vendite.ddt_righe_prelievi.ddt_riga_id%TYPE;
                  v_regola      text;     -- frase composta qui, nessuna colonna
              BEGIN
                  -- La riga di reso, sotto RLS. Assente = fuori perimetro, che il
                  -- WITH CHECK della policy rifiuta comunque, o FK che parlera'.
                  SELECT rr.reso_id, rr.riga_nr, rr.ddt_riga_id
                    INTO v_reso_id, v_riga_nr, v_ddt_riga_id
                    FROM vendite.resi_righe rr
                   WHERE rr.id = NEW.resi_riga_id;
                  IF NOT FOUND THEN
                      RETURN NEW;
                  END IF;

                  -- Il prelievo e' della riga di bolla da cui viene la riga di reso.
                  IF TG_OP = 'UPDATE'
                     AND (NEW.resi_riga_id <> OLD.resi_riga_id
                          OR NEW.ddt_riga_prelievo_id <> OLD.ddt_riga_prelievo_id) THEN
                      v_regola := 'un rientro non cambia riga ne'' prelievo: toglierlo e scriverne un altro';
                  ELSE
                      SELECT p.ddt_riga_id INTO v_prel_riga
                        FROM vendite.ddt_righe_prelievi p
                       WHERE p.id = NEW.ddt_riga_prelievo_id;
                      IF v_prel_riga IS DISTINCT FROM v_ddt_riga_id THEN
                          v_regola := 'il prelievo indicato non e'' della riga di bolla da cui viene la riga di reso';
                      END IF;
                  END IF;

                  IF v_regola IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.trgfn_resi_righe_rientri_guard',
                          'E_RESO_RIENTRO_INCOERENTE',
                          jsonb_build_object('reso_id', v_reso_id, 'resi_riga_id', NEW.resi_riga_id,
                                             'ddt_riga_prelievo_id', NEW.ddt_riga_prelievo_id,
                                             'ddt_riga_id_attesa', v_ddt_riga_id),
                          NEW.tx_id,
                          v_riga_nr::text, v_regola);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_righe_rientri_guard() IS
                  'Guard BEFORE INSERT OR UPDATE su vendite.resi_righe_rientri: E_RESO_RIENTRO_INCOERENTE, '
                  'la regola nel VARIADIC — il prelievo nominato non e'' della riga di bolla della riga di '
                  'reso (resi_righe.ddt_riga_id), o un rientro cambia riga o prelievo. Quadratura, tetto per '
                  'prelievo e posizione (ubicazione secondo il magazzino) li giudica la check della conferma '
                  '(script.fn_check_reso_merce). «Solo in bozza» (E_RIGA_DOC_NON_BOZZA) non sta piu'' qui dal '
                  '2026-10-05: lo dice il building block vendite.trgfn_doc_righe_lock_fuori_bozza a livello '
                  'RIGA (trg_resi_righe_rientri_a05_doc_bozza_ins_upd_dlt), e la copia scritta qui e'' stata '
                  'ritirata (regola del 2; brief-db-righe-esclusione-solo-non-si-vende §8.2 B3). Brief '
                  'd''origine: brief-db-magazzino-lotto-3-bis-carico-da-reso.';

              CREATE TRIGGER trg_resi_righe_rientri_a05_doc_bozza_ins_upd_dlt
                  BEFORE INSERT OR UPDATE OR DELETE ON vendite.resi_righe_rientri
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_doc_righe_lock_fuori_bozza('RESO', 'resi_riga_id', 'DRAFT', 'RIGA');

              COMMENT ON TRIGGER trg_resi_righe_rientri_a05_doc_bozza_ins_upd_dlt ON vendite.resi_righe_rientri IS
                  'I rientri di una riga di reso si aggiungono, modificano e tolgono solo con il reso in '
                  'DRAFT: dopo la conferma la merce e'' a registro (building block '
                  'vendite.trgfn_doc_righe_lock_fuori_bozza a livello RIGA, E_RIGA_DOC_NON_BOZZA). Prende il '
                  'posto del passo 1 di vendite.trgfn_resi_righe_rientri_guard. Brief: '
                  'brief-db-righe-esclusione-solo-non-si-vende (§8.2 B3).';

              CREATE TRIGGER trg_resi_righe_rientri_a10_guard_ins_upd
                  BEFORE INSERT OR UPDATE ON vendite.resi_righe_rientri
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_resi_righe_rientri_guard();

              COMMENT ON TRIGGER trg_resi_righe_rientri_a10_guard_ins_upd ON vendite.resi_righe_rientri IS
                  'Coerenza del rientro col prelievo della riga di bolla (vendite.trgfn_resi_righe_rientri_guard, '
                  'E_RESO_RIENTRO_INCOERENTE). Fascia _a10_: parla dopo il rifiuto di stato _a05_. Era '
                  'trg_resi_righe_rientri_a05_guard_ins_upd_dlt fino al 2026-10-05. Brief: '
                  'brief-db-righe-esclusione-solo-non-si-vende (§8.2 B3).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente della funzione e' in 20260928-90.
              DROP TRIGGER IF EXISTS trg_resi_righe_rientri_a10_guard_ins_upd ON vendite.resi_righe_rientri;
              DROP TRIGGER IF EXISTS trg_resi_righe_rientri_a05_doc_bozza_ins_upd_dlt ON vendite.resi_righe_rientri;
