# IL CODICE ERRORE COMINCIA A ESSERE SCRITTO — 5/5, IL RESET DEI FONDI.
#   Lotto L1, passo P-6 del cantiere brief-db-liste-drawer-lotto.md (D-7).
#
# -- ⭐ NON E' LO STESSO LAVORO DEI TRE PRECEDENTI --------------------
#   -39, -40 e -41 CATTURANO un errore altrui in un ramo EXCEPTION e ne
#   prendono il codice da CONSTRAINT_NAME. Qui non c'e' niente da catturare:
#   la funzione DESCRIVE una condizione che ha visto lei — la contabile che
#   conteneva il fondo e' CHIUSA, quindi il minimo non si puo' ripristinare — e
#   scrive una nota `W` mentre il resto del reset va avanti.
#   ⚠️ Gemello esatto di 20260821-42, che porta la stessa decisione per esteso.
#   ⭐ E qui c'e' un vicino da non confondere: nel meta c'e' gia'
#   `cause = 'CONTABILE_CHIUSA'`. Resta dov'e' — e' il vocabolario LOCALE del
#   ramo, che nessuno legge fuori di qui (misurato: zero consumatori);
#   `error_code` e' il codice di CATALOGO, quello che la lista mostra. Due
#   cose diverse con lo stesso odore: togliere la prima sarebbe una pulizia
#   che non ci e' stata chiesta e che romperebbe chi domani la leggesse.
#
# -- LA DECISIONE: UN `W_`, SENZA MESSAGGIO A CATALOGO ----------------
#   Decisione di Tid del 2026-08-21 (opzione b delle tre in §6 del brief).
#   ⭐ Sono i primi `W_` **di dominio** del progetto: la famiglia aveva due
#   sole voci, entrambe infrastrutturali (W_MESSAGGIO_ARITA,
#   W_TXID_NOT_REGISTERED).
#   ⛔ E NON ricevono una entry in `config.messaggi_errore`, di proposito:
#   questo punto scrive la frase DIRETTAMENTE in vendite.fatture_log.messaggio
#   e non passa da script.fn_log_and_raise_error. Una entry a catalogo sarebbe
#   una SECONDA COPIA della stessa frase, che nessuno compone — la forma che il
#   cantiere dei segnaposti ha gia' pagato («due testi scritti due volte che
#   non si compongono»).
#   ✅ Ed e' una forma prevista dal disegno, non un'eccezione: la FK va da
#   messaggi_errore VERSO codici_errore (test 3 di test-codici-errore-identita),
#   quindi un codice senza figli e' legittimo. Un messaggio senza codice no.
#
# -- ⚠️ UN `W_` NON SI SOLLEVA MAI ------------------------------------
#   Si registra e il giro prosegue: un W_ sollevato diventa un HTTP 500.
#   Qui infatti il valore e' un LETTERALE dentro il meta del log, non un
#   argomento di fn_log_and_raise_error.
#   ℹ️ Conseguenza voluta: `dbops.vw_codici_errore_da_dichiarare` cerca nei
#   sorgenti i letterali `'E_...'` e questi non li vede — giusto cosi', non
#   c'e' nessuna policy HTTP da dichiarare per un avviso che non viaggia.
#
# -- CHE COSA NON CAMBIA ----------------------------------------------
#   Firma, RETURNS TABLE, la CTE del reset e tutto il resto del corpo. E' un
#   `CREATE OR REPLACE` puro: una chiave in piu' nel jsonb del log.
#
# Origine: corpo dalla doc auto-generata `dbzero` (l'oggetto vivo) col patch
#   mirato applicato sopra — NON ricopiato a mano e NON ripreso da un YAML.
# Dipendenze: codice W_FONDO_MINIMO_NON_RIPRISTINABILE, classe AVVISO — append al
#   solo `80_data/sql/config/codici_errore.csv`. ⚠️ 80_data gira DOPO 20_code:
#   fra il migrate di questo changeSet e quello del seed la funzione scrive un
#   codice non ancora a catalogo. E' innocuo — non c'e' nessuna FK sul valore
#   dentro un jsonb, e nessuno lo risolve — ma va saputo.
# Verifica: db/pgtap/vendite/test-fatture-log-error-code.sql (esteso, T-2)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260821-43-update-fn-reset-fondi-fattura-error-code-mctit.yaml

  - changeSet:
      id: 20260821-43-update-fn-reset-fondi-fattura-error-code
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.fn_reset_fondi_fattura dichiara W_FONDO_MINIMO_NON_RIPRISTINABILE nel meta della
        sua nota di avviso. Cambia specie rispetto ai tre changeSet precedenti: qui non c'e'
        nessun errore catturato da cui prendere il codice, la condizione la vede la funzione
        stessa. Secondo W_ di dominio, senza entry in messaggi_errore perche' la frase la compone
        gia' la funzione. `cause` resta accanto: vocabolario locale, non codice di catalogo.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_reset_fondi_fattura'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_reset_fondi_fattura(p_fattura_id bigint)
               RETURNS TABLE(updated_source integer, deleted_fondi integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_updated_source INTEGER := 0;
                  v_deleted_fondi  INTEGER := 0;
                  v_stato_contabile_chiusa_id pagamenti.vendite_contabili_stati.id%TYPE;
              BEGIN
                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_reset_fondi_fattura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                  END IF;

                  SELECT s.id INTO v_stato_contabile_chiusa_id
                    FROM pagamenti.vendite_contabili_stati s WHERE s.codice_interno = 'CHIUSA' AND s.attivo IS TRUE LIMIT 1;

                  IF v_stato_contabile_chiusa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_reset_fondi_fattura', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'CHIUSA'), NULL::uuid, 'stato contabile CHIUSA non configurato');
                  END IF;

                  -- Logica CTE invariata dall'originale.
                  -- src: lock SOLO delle righe source (alias s) da resettare; le JOIN su
                  -- tipi_fondi_fattura (t, filtro) e fatture (fs, display) NON vanno bloccate.
                  WITH src AS (
                      SELECT s.id AS source_id, s.fattura_sorgente_id, fs.numero AS fattura_sorgente_numero, fs.data AS fattura_sorgente_data
                        FROM vendite.fatture_fondi_fattura_source s
                        JOIN vendite.tipi_fondi_fattura t ON t.id = s.tipo_fondo_fattura_id
                        JOIN vendite.fatture fs ON fs.id = s.fattura_sorgente_id
                       WHERE s.fattura_figlia_id = p_fattura_id AND s.stato = 'ASSEGNATO' AND t.codice_interno = 'F_F_ADD_ACC'
                         FOR UPDATE OF s
                  ), bloccate AS (
                      SELECT DISTINCT src.source_id, src.fattura_sorgente_id, src.fattura_sorgente_numero, src.fattura_sorgente_data
                        FROM src
                        JOIN pagamenti.vendite_contabili_righe cr ON cr.attivo IS TRUE AND COALESCE(cr.meta->>'origine', '') = 'FONDO_FATTURA' AND COALESCE(cr.meta->>'fondo_source_id', '') = src.source_id::text
                        JOIN pagamenti.vendite_contabili c ON c.id = cr.contabile_id
                       WHERE c.stato_id = v_stato_contabile_chiusa_id
                  ), warn AS (
                      INSERT INTO vendite.fatture_log (fattura_id, data_ora, messaggio, status, disabilitato, meta, data_insert, user_insert, data_update, user_update)
                      SELECT p_fattura_id, now(), format('Minimo non ripristinabile: gia postato (fattura %s del %s)', COALESCE(b.fattura_sorgente_numero::text, 'N/D'), COALESCE(to_char(b.fattura_sorgente_data, 'YYYY-MM-DD'), 'N/D')),
                             -- ⭐ Codice DICHIARATO, non catturato: la contabile chiusa
                             --    non e' un errore di qualcun altro, e' cio' che questa
                             --    funzione ha trovato. `cause` resta dov'era: e' il
                             --    vocabolario locale del ramo, `error_code` e' il codice
                             --    di catalogo che la lista mostra.
                             'W', FALSE, jsonb_build_object('source_id', b.source_id, 'fattura_sorgente_id', b.fattura_sorgente_id, 'error_code', 'W_FONDO_MINIMO_NON_RIPRISTINABILE', 'cause', 'CONTABILE_CHIUSA'), now(), current_user, now(), current_user
                        FROM bloccate b RETURNING id
                  ), ann AS (
                      -- ⭐ La stessa frase che finiva solo nel diario ora sta anche
                      --    sul dato: chi legge la riga del fondo sa perche' e'
                      --    ANNULLATO senza dover cercare in fatture_log.
                      UPDATE vendite.fatture_fondi_fattura_source s
                         SET stato = 'ANNULLATO',
                             motivo = format('Minimo non ripristinabile: contabile gia CHIUSA (fattura %s del %s)',
                                             COALESCE(b.fattura_sorgente_numero::text, 'N/D'),
                                             COALESCE(to_char(b.fattura_sorgente_data, 'YYYY-MM-DD'), 'N/D')),
                             data_update = now(), user_update = current_user
                        FROM bloccate b WHERE s.id = b.source_id RETURNING s.id
                  ), resettabili AS (
                      SELECT s.* FROM src s WHERE NOT EXISTS (SELECT 1 FROM bloccate b WHERE b.source_id = s.source_id)
                  ), del_righe AS (
                      DELETE FROM pagamenti.vendite_contabili_righe cr USING resettabili r, pagamenti.vendite_contabili c
                      WHERE c.id = cr.contabile_id AND COALESCE(cr.meta->>'origine', '') = 'FONDO_FATTURA' AND COALESCE(cr.meta->>'fondo_source_id', '') = r.source_id::text AND c.stato_id IS DISTINCT FROM v_stato_contabile_chiusa_id RETURNING cr.id
                  ), upd AS (
                      UPDATE vendite.fatture_fondi_fattura_source s SET fattura_figlia_id = NULL, data_assegnazione = NULL, user_assegnazione = NULL, stato = 'DISPONIBILE', data_update = now(), user_update = current_user FROM resettabili r WHERE s.id = r.source_id RETURNING s.id, s.fattura_sorgente_id
                  ), del_ff AS (
                      DELETE FROM vendite.fatture_fondi_fattura ff USING upd u WHERE ff.fattura_id = p_fattura_id AND ff.riferimento_fattura_id = u.fattura_sorgente_id RETURNING ff.id
                  )
                  SELECT (SELECT COUNT(*)::INTEGER FROM upd), (SELECT COUNT(*)::INTEGER FROM del_ff) INTO v_updated_source, v_deleted_fondi;

                  RETURN QUERY SELECT COALESCE(v_updated_source, 0), COALESCE(v_deleted_fondi, 0);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_reset_fondi_fattura(p_fattura_id bigint)
              IS 'Reset dei fondi applicati a una fattura FIGLIA: riporta le source da ASSEGNATO a DISPONIBILE, cancella le righe fondi e le righe contabili generate, con blocco sulle contabili gia'' CHIUSA — quelle passano ad ANNULLATO e dal 2026-08-15 portano la ragione nella colonna `motivo`, non piu'' soltanto in un messaggio di vendite.fatture_log. ⚠️ E'' un''operazione TECNICA sul ciclo di vita della figlia (il ritorno di un lotto in bozza) e NON una reazione ai pagamenti: nessun incasso la chiama e nessun incasso deve chiamarla. E'' la risposta alla domanda F-2 del piano — un fondo assegnato non si tocca; l''eventuale doppio pagamento diventa un credito sulla sorgente e si governa nel processo rimborsi, in `pagamenti`. D-16 + D-5 di brief-db-fondo-fattura-ricalcolo-e-governo §8.2. ⭐ rev 2026-08-21 (cantiere brief-db-liste-drawer-lotto, L1/P-6): la nota di avviso sul minimo non ripristinabile dichiara W_FONDO_MINIMO_NON_RIPRISTINABILE in meta->>''error_code''. ⚠️ Cambia specie rispetto ai tre changeSet gemelli dello stesso giro (fn_log_pipeline_fase, fn_snapshot_fattura_lotto, fn_genera_scadenze_lotto): quelli CATTURANO un errore altrui in un ramo EXCEPTION e ne prendono il codice da CONSTRAINT_NAME, qui non c''e'' niente da catturare — la condizione la vede questa funzione, e il codice si DICHIARA. E'' un W_ perche'' non si solleva mai: si registra e il giro prosegue (un W_ sollevato sarebbe un HTTP 500). ⛔ Il codice NON ha una entry in config.messaggi_errore, di proposito e per decisione: questo punto scrive la frase direttamente in vendite.fatture_log.messaggio e non passa da script.fn_log_and_raise_error, quindi un messaggio a catalogo sarebbe una seconda copia della stessa frase che nessuno compone. La forma e'' prevista dal disegno: la FK va da messaggi_errore verso codici_errore, quindi un codice senza figli e'' legittimo mentre un messaggio senza padre no.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⛔ Nessun ripristino automatico: togliere la chiave lascia la
              --    colonna «codice» della lista segnalazioni vuota su tutte le
              --    righe di avviso, che sono il 100% di quelle prodotte qui.
              --    Si riapplica 20260815-13 solo sapendo questo.
              SELECT 1;
