databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/vendite/20260331-17-fix-vendite-fn-e-generico-batch8-mctit.yaml

    - changeSet:
          id: 20260331-17-fix-fn-list-fatturazione-pipeline-steps
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_list_fatturazione_pipeline_steps: 3x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 3x E_GENERICO → E_PARAMETRO_INVALIDO
                        CREATE OR REPLACE FUNCTION vendite.fn_list_fatturazione_pipeline_steps(
                            p_tipo_lotto          TEXT,
                            p_utility_id          config.utilities.id%TYPE DEFAULT NULL,
                            p_tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE DEFAULT NULL
                        )
                        RETURNS TABLE(stato_doc_fiscale_id BIGINT, descrizione TEXT, ordine SMALLINT)
                        LANGUAGE plpgsql
                        AS $function$
                        BEGIN
                            IF p_tipo_lotto IS NULL OR btrim(p_tipo_lotto) = '' THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_fatturazione_pipeline_steps', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_tipo_lotto', 'valore', p_tipo_lotto), NULL::uuid, 'p_tipo_lotto obbligatorio');
                            END IF;
                            IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_fatturazione_pipeline_steps', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_utility_id', 'valore', p_utility_id), NULL::uuid, 'p_utility_id se fornito deve essere > 0');
                            END IF;
                            IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_fatturazione_pipeline_steps', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', p_tipo_doc_fiscale_id), NULL::uuid, 'p_tipo_doc_fiscale_id se fornito deve essere > 0');
                            END IF;

                            RETURN QUERY
                            SELECT sd.id, COALESCE(rs.descrizione, sd.descrizione), sd.ordine
                              FROM config.stati_doc_fiscale sd
                              JOIN LATERAL vendite.fn_resolve_fatturazione_pipeline_step(p_tipo_lotto, sd.id, p_utility_id, p_tipo_doc_fiscale_id, FALSE) rs ON TRUE
                             WHERE COALESCE(sd.applica_lotto, FALSE) IS TRUE
                             ORDER BY sd.ordine;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_list_fatturazione_pipeline_steps(TEXT, INTEGER, BIGINT)
                          IS 'Step pipeline fatturazione risolti per tipo_lotto con fallback utility/tipo_doc.';

    - changeSet:
          id: 20260331-17-fix-fn-list-lotto-task-runs
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_list_lotto_task_runs: 1x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_PARAMETRO_INVALIDO
                        CREATE OR REPLACE FUNCTION vendite.fn_list_lotto_task_runs(
                            p_lotto_id             vendite.fatturazione_lotti.id%TYPE,
                            p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE DEFAULT NULL,
                            p_task_code            vendite.fatturazione_lotti_task_runs.task_code%TYPE DEFAULT NULL
                        )
                        RETURNS TABLE(id BIGINT, lotto_id BIGINT, pipeline_id BIGINT, stato_doc_fiscale_id INTEGER,
                            task_code CHARACTER VARYING, fase CHARACTER VARYING, tentativo SMALLINT,
                            task_stato CHARACTER VARYING, started_at TIMESTAMPTZ, ended_at TIMESTAMPTZ,
                            error_code CHARACTER VARYING, error_message TEXT, meta JSONB)
                        LANGUAGE plpgsql
                        AS $function$
                        BEGIN
                            IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_lotto_task_runs', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                            END IF;

                            RETURN QUERY
                            SELECT r.id, r.lotto_id, r.pipeline_id, r.stato_doc_fiscale_id,
                                   r.task_code, r.fase, r.tentativo, r.task_stato,
                                   r.started_at, r.ended_at, r.error_code, r.error_message, r.meta
                              FROM vendite.fatturazione_lotti_task_runs r
                             WHERE r.lotto_id = p_lotto_id
                               AND (p_stato_doc_fiscale_id IS NULL OR r.stato_doc_fiscale_id = p_stato_doc_fiscale_id::INTEGER)
                               AND (p_task_code IS NULL OR r.task_code = p_task_code)
                             ORDER BY r.started_at ASC, r.id ASC;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_list_lotto_task_runs(BIGINT, BIGINT, CHARACTER VARYING)
                          IS 'Task run del lotto con filtri opzionali per stato/task.';

    - changeSet:
          id: 20260331-17-fix-fn-list-ordini-da-pushare
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_list_ordini_da_pushare: 1x E_GENERICO → E_CODICE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_CODICE (sorgente ORDINE_VENDITA)
                        CREATE OR REPLACE FUNCTION vendite.fn_list_ordini_da_pushare(
                            p_competenza_mese    DATE DEFAULT NULL,
                            p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                            p_limit              INTEGER DEFAULT NULL
                        )
                        RETURNS TABLE(ordine_id BIGINT, ordine_uid UUID, riga_id BIGINT, billing_account_id BIGINT,
                            utility_id INTEGER, emittente_soggetto_ruolo_id BIGINT, competenza_dal DATE,
                            competenza_al DATE, fatturazione_immediata BOOLEAN, sorgente_tipo_id BIGINT,
                            sorgente_uid TEXT, segment_key CHARACTER VARYING, articolo_id UUID,
                            istanza_utility_id BIGINT, data_attivita DATE, uom_id BIGINT, quantita NUMERIC,
                            qta_operativa NUMERIC, uom_operativa_id BIGINT, factor_to_base NUMERIC,
                            competenza_mese DATE, prezzo_snapshot NUMERIC, prezzo_bloccato BOOLEAN,
                            pricing_mode CHARACTER VARYING, tipo_movimento CHARACTER VARYING,
                            tipo_consumo CHARACTER VARYING, valuta_id INTEGER, meta JSONB,
                            tipo_doc_fiscale_id BIGINT)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                            v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                            v_stato_confermato_id config.stati_doc_ordini.id%TYPE;
                        BEGIN
                            SELECT s.id, s.tipo_doc_fiscale_id INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                              FROM config.sorgenti s WHERE s.codice = 'ORDINE_VENDITA' AND s.attivo IS TRUE LIMIT 1;

                            IF v_sorgente_tipo_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_ordini_da_pushare', 'E_CODICE',
                                    jsonb_build_object('codice', 'ORDINE_VENDITA'), NULL::uuid, 'ORDINE_VENDITA', 'config.sorgenti');
                            END IF;

                            SELECT s.id INTO v_stato_confermato_id
                              FROM config.stati_doc_ordini s WHERE s.codice = 'CONFERMATO' AND s.attivo IS TRUE LIMIT 1;

                            RETURN QUERY
                            SELECT o.id, o.uid, or_r.id, o.billing_account_id, ba.utility_id,
                                   anagrafiche.fn_get_emittente_fiscale_id(o.billing_account_id),
                                   o.data, o.data, FALSE, v_sorgente_tipo_id, o.uid::text,
                                   ('ORD:' || o.uid::text || ':R:' || or_r.id::text)::VARCHAR,
                                   or_r.articolo_id, ba.istanza_utility_id, o.data, NULL::BIGINT,
                                   or_r.quantita, or_r.qta_operativa, or_r.uom_operativa_id,
                                   COALESCE(or_r.factor_to_base, 1::NUMERIC),
                                   date_trunc('month', o.data)::DATE, or_r.prezzo_unitario, TRUE,
                                   'FIXED'::VARCHAR, 'NORMALE'::VARCHAR, 'CONGUAGLIO'::VARCHAR,
                                   o.valuta_id,
                                   jsonb_build_object('ordine_numero', o.numero, 'ordine_anno', o.anno,
                                       'ordine_serie', o.serie, 'tipo_commessa', 'AUTO', 'policy_fatturazione', 'DA_DOCUMENTO'),
                                   v_tipo_doc_fiscale_id
                              FROM vendite.ordini o
                              JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                              JOIN vendite.ordini_righe or_r ON or_r.ordine_id = o.id AND or_r.attivo IS TRUE AND or_r.quantita > 0 AND or_r.prezzo_unitario >= 0
                             WHERE o.billing_account_id IS NOT NULL
                               AND (v_stato_confermato_id IS NULL OR o.stato_doc_ordine_id = v_stato_confermato_id)
                               AND o.fatturazione_trigger = 'CONFERMATO'
                               AND (p_competenza_mese IS NULL OR date_trunc('month', o.data)::DATE = p_competenza_mese)
                               AND (p_billing_account_id IS NULL OR o.billing_account_id = p_billing_account_id)
                               AND NOT EXISTS (
                                   SELECT 1 FROM vendite.commesse_attivita ca
                                    WHERE ca.segment_key = 'ORD:' || o.uid::text || ':R:' || or_r.id::text
                                      AND ca.stato_emissione = 'EMESSA'
                               )
                             ORDER BY o.id, or_r.id LIMIT p_limit;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_list_ordini_da_pushare(DATE, BIGINT, INTEGER)
                          IS 'Righe ordine eligible al push su commessa (stato CONFERMATO, trigger CONFERMATO).';

    - changeSet:
          id: 20260331-17-fix-fn-list-preventivi-da-pushare
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_list_preventivi_da_pushare: 1x E_GENERICO → E_CODICE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_CODICE (sorgente PREVENTIVO)
                        CREATE OR REPLACE FUNCTION vendite.fn_list_preventivi_da_pushare(
                            p_competenza_mese    DATE DEFAULT NULL,
                            p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                            p_limit              INTEGER DEFAULT NULL
                        )
                        RETURNS TABLE(preventivo_id BIGINT, preventivo_uid UUID, riga_id BIGINT,
                            billing_account_id BIGINT, utility_id INTEGER, emittente_soggetto_ruolo_id BIGINT,
                            competenza_dal DATE, competenza_al DATE, fatturazione_immediata BOOLEAN,
                            sorgente_tipo_id BIGINT, sorgente_uid TEXT, segment_key CHARACTER VARYING,
                            articolo_id UUID, istanza_utility_id BIGINT, data_attivita DATE, uom_id BIGINT,
                            quantita NUMERIC, qta_operativa NUMERIC, uom_operativa_id BIGINT,
                            factor_to_base NUMERIC, competenza_mese DATE, prezzo_snapshot NUMERIC,
                            prezzo_bloccato BOOLEAN, pricing_mode CHARACTER VARYING,
                            tipo_movimento CHARACTER VARYING, tipo_consumo CHARACTER VARYING,
                            valuta_id INTEGER, meta JSONB, tipo_doc_fiscale_id BIGINT)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                            v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                            v_stato_accettato_id  config.stati_doc_preventivi.id%TYPE;
                        BEGIN
                            SELECT s.id, s.tipo_doc_fiscale_id INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                              FROM config.sorgenti s WHERE s.codice = 'PREVENTIVO' AND s.attivo IS TRUE LIMIT 1;

                            IF v_sorgente_tipo_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_preventivi_da_pushare', 'E_CODICE',
                                    jsonb_build_object('codice', 'PREVENTIVO'), NULL::uuid, 'PREVENTIVO', 'config.sorgenti');
                            END IF;

                            SELECT s.id INTO v_stato_accettato_id
                              FROM config.stati_doc_preventivi s WHERE s.codice = 'ACCETTATO' AND s.attivo IS TRUE LIMIT 1;

                            RETURN QUERY
                            SELECT p.id, p.uid, pr.id, p.billing_account_id, p.utility_id,
                                   anagrafiche.fn_get_emittente_fiscale_id(p.billing_account_id),
                                   p.validita_dal, p.validita_al, p.fatturazione_immediata,
                                   v_sorgente_tipo_id, p.uid::text,
                                   ('PREV:' || p.uid::text || ':R:' || pr.id::text)::VARCHAR,
                                   pr.articolo_id, p.istanza_utility_id,
                                   COALESCE(p.validita_dal, p.data), NULL::BIGINT,
                                   pr.quantita, pr.qta_operativa, pr.uom_operativa_id,
                                   COALESCE(pr.factor_to_base, 1::NUMERIC),
                                   date_trunc('month', COALESCE(p.validita_dal, p.data))::DATE,
                                   pr.prezzo_unitario, COALESCE(p.fatturazione_immediata, FALSE),
                                   'FIXED'::VARCHAR, 'NORMALE'::VARCHAR, 'CONGUAGLIO'::VARCHAR,
                                   p.valuta_id,
                                   jsonb_build_object('preventivo_numero', p.numero, 'preventivo_rev', p.rev,
                                       'tipo_commessa', 'REALE', 'policy_fatturazione', 'DA_DOCUMENTO'),
                                   v_tipo_doc_fiscale_id
                              FROM vendite.preventivi p
                              JOIN vendite.preventivi_righe pr ON pr.preventivo_id = p.id AND pr.attivo IS TRUE AND pr.quantita > 0 AND pr.prezzo_unitario >= 0
                             WHERE p.billing_account_id IS NOT NULL AND p.utility_id IS NOT NULL
                               AND (v_stato_accettato_id IS NULL OR p.stato_doc_preventivo_id = v_stato_accettato_id)
                               AND (p_competenza_mese IS NULL OR date_trunc('month', COALESCE(p.validita_dal, p.data))::DATE = p_competenza_mese)
                               AND (p_billing_account_id IS NULL OR p.billing_account_id = p_billing_account_id)
                               AND NOT EXISTS (
                                   SELECT 1 FROM vendite.commesse_attivita ca
                                    WHERE ca.segment_key = 'PREV:' || p.uid::text || ':R:' || pr.id::text
                                      AND ca.stato_emissione = 'EMESSA'
                               )
                             ORDER BY p.id, pr.id LIMIT p_limit;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_list_preventivi_da_pushare(DATE, BIGINT, INTEGER)
                          IS 'Righe preventivo eligible al push su commessa (stato ACCETTATO).';
