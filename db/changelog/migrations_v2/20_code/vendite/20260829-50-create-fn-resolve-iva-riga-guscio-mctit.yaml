# `I2` (Fase 3) del brief brief-db-be-iva-risolutore-e-regime-cliente — `D21`:
# IL GUSCIO CHE SMISTA. E' questa la funzione che i chiamanti chiamano.
#
# ── ⭐ PERCHE' UN GUSCIO E NON UN PARAMETRO CON RAMI INTERNI ──────────
#
#   Decisione di Tid, 2026-08-29. Con un guscio, aggiungere un paese significa
#   **aggiungere una funzione** — `fn_resolve_iva_riga_xx` — e una riga qui;
#   con i rami dentro un corpo solo, significa **riaprire ogni volta la funzione
#   che calcola l'IVA di tutti**. La prima e' additiva, la seconda no.
#
#   Stampo gia' in casa: `anagrafiche.trgfn_soggetti_valida_cf_piva_dispatch` ->
#   `script.fn_validate_cf_piva_it`.
#
# ── ⛔ MA CON L'`ELSE` CHE SOLLEVA, e il precedente NON va copiato ────
#
#   Il dispatcher del codice fiscale fa `IF country = 'IT' THEN … END IF;` e
#   **non ha nessun `ELSE`**: per un paese diverso non valida niente, in
#   silenzio. Su una validazione e' un buco; su un risolutore IVA sarebbe
#   **un'imposta sbagliata senza errore**.
#   Qui il paese non implementato solleva `E_IVA_PAESE_NON_IMPLEMENTATO`.
#
# ── ⚠️ SMISTA SUL PAESE DELL'EMITTENTE, e va detto quale ─────────────
#
#   E' il regime fiscale di **chi emette** a stabilire quale legge si applica.
#   Il paese del **cliente** entra nella regola (per l'intracomunitario decide
#   il luogo di imposizione insieme alla natura dell'operazione), ma non decide
#   **quale implementazione** gira.
#
# ── ⭐ LA FIRMA E' IL PUNTO, NON LA LOGICA (D20) ──────────────────────
#
#   *«E' la firma a determinare il costo dell'internazionalizzazione, molto piu'
#   della logica interna: se prende (articolo, cliente, data) funziona benissimo
#   in Italia e ti obbliga a toccare ogni chiamante quando aggiungi un paese.»*
#
#   Percio' la firma prende gia' **il paese di entrambe le parti** e la **natura
#   dell'operazione** (cessione di beni / prestazione di servizi). Tutti e tre
#   sono **facoltativi e derivati** quando non passati, cosi' chi chiama oggi non
#   deve saperne niente.
#
#   ⚠️ **E oggi l'implementazione italiana non li usa.** Normalmente un
#   parametro accettato e non usato e' il difetto che questo cantiere combatte —
#   ma la differenza e' netta: quello e' un **campo che un operatore compila**
#   credendo di decidere qualcosa; questo e' un **punto di estensione
#   dichiarato**, che costa niente adesso e costerebbe ogni chiamante dopo.
#
# ── ℹ️ PERCHE' I TRE SI DERIVANO QUI E NON NEL CHIAMANTE ─────────────
#
#   Il chiamante ha gia' soggetto, emittente e articolo: fargli cercare anche i
#   due paesi e la natura dell'operazione vorrebbe dire ripetere tre lookup in
#   ogni punto che risolve l'IVA. Stabilire il contesto del dispatch e' mestiere
#   del guscio.
#
# Codice sollevato: E_IVA_PAESE_NON_IMPLEMENTATO (NON_ESEGUIBILE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260829-50-create-fn-resolve-iva-riga-guscio-mctit.yaml

  - changeSet:
      id: 20260829-50-create-fn-resolve-iva-riga-guscio
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.fn_resolve_iva_riga: il guscio che smista per paese (D21). Con un guscio,
        aggiungere un paese e' aggiungere una funzione e una riga qui; con i rami dentro un
        corpo solo sarebbe riaprire ogni volta la funzione che calcola l'IVA di tutti. ⛔ E
        con l'ELSE che SOLLEVA: il dispatcher del codice fiscale, che e' lo stampo, quel
        ramo non ce l'ha e per un paese diverso non valida niente in silenzio - su un
        risolutore IVA sarebbe un'imposta sbagliata senza errore. La firma prende gia' il
        paese di entrambe le parti e la natura dell'operazione (D20), derivati quando non
        passati: oggi l'implementazione italiana non li usa, ed e' un punto di estensione
        dichiarato, non un campo che promette e non succede.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: config
                tableName: nature_vendita
                columnName: e_cessione_beni
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_resolve_iva_riga_it';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_resolve_iva_riga(
                  p_articolo_id          catalogo.articoli.id%TYPE,
                  p_data_riferimento     date,
                  p_imponibile           numeric                                DEFAULT NULL,
                  p_billing_account_id   anagrafiche.billing_account.id%TYPE    DEFAULT NULL,
                  p_utility_id           config.utilities.id%TYPE               DEFAULT NULL,
                  p_soggetto_id          anagrafiche.soggetti.id%TYPE           DEFAULT NULL,
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE  DEFAULT NULL,
                  p_paese_emittente      config.stati.codice_iso2%TYPE          DEFAULT NULL,
                  p_paese_cliente        config.stati.codice_iso2%TYPE          DEFAULT NULL,
                  p_e_cessione_beni      config.nature_vendita.e_cessione_beni%TYPE DEFAULT NULL
              )
              RETURNS TABLE (
                  quota                 numeric,
                  iva_id                config.iva.id%TYPE,
                  aliquota              config.iva.aliquota_iva%TYPE,
                  natura_codice         config.iva_natura.codice%TYPE,
                  is_reverse_charge     config.iva_natura.is_reverse_charge%TYPE,
                  esigibilita           vendite.fatture_righe.esigibilita%TYPE,
                  split_payment         vendite.fatture_righe.split_payment%TYPE,
                  riferimento_normativo config.iva.descrizione%TYPE,
                  origine               varchar(16),
                  titolo_iva_id         anagrafiche.soggetti_titoli_iva.id%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: essere LA porta del risolutore IVA. Stabilisce il contesto
              --   del dispatch — paese di chi emette, paese del cliente, natura
              --   dell'operazione — e passa la palla all'implementazione del
              --   paese giusto. La regola vera sta li', non qui.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I2 / D20 / D21.
              -- ⚠️ I tre parametri di contesto sono FACOLTATIVI e derivati quando
              --   non passati: chi chiama oggi non deve saperne niente, e la
              --   firma non cambiera' il giorno che si aggiunge un paese.
              DECLARE
                  v_paese_emitt   config.stati.codice_iso2%TYPE;
                  v_paese_cli     config.stati.codice_iso2%TYPE;
                  v_cessione_beni config.nature_vendita.e_cessione_beni%TYPE;
              BEGIN
                  -- ══ IL CONTESTO DEL DISPATCH ═══════════════════════════════
                  -- ⚠️ Il paese si legge da config.stati.codice_iso2, che e' una
                  --   chiave naturale esterna (standard ISO) e quindi stabile per
                  --   costruzione — non un codice di casa che qualcuno rinomina.
                  --   E' lo stesso percorso del dispatcher CF/PIVA.
                  v_paese_emitt := p_paese_emittente;
                  IF v_paese_emitt IS NULL AND p_emittente_fiscale_id IS NOT NULL THEN
                      SELECT st.codice_iso2 INTO v_paese_emitt
                        FROM anagrafiche.emittenti_fiscali ef
                        JOIN anagrafiche.soggetti_ruoli sr ON sr.id = ef.soggetto_ruolo_id
                        JOIN anagrafiche.soggetti s        ON s.id  = sr.soggetto_id
                        JOIN config.stati st               ON st.id = s.stato_id
                       WHERE ef.id = p_emittente_fiscale_id;
                  END IF;

                  v_paese_cli := p_paese_cliente;
                  IF v_paese_cli IS NULL AND p_soggetto_id IS NOT NULL THEN
                      SELECT st.codice_iso2 INTO v_paese_cli
                        FROM anagrafiche.soggetti s
                        JOIN config.stati st ON st.id = s.stato_id
                       WHERE s.id = p_soggetto_id;
                  END IF;

                  -- Cessione di beni o prestazione di servizi: sta sul vocabolario
                  -- (D23), agganciato all'articolo via natura_vendita_id.
                  v_cessione_beni := p_e_cessione_beni;
                  IF v_cessione_beni IS NULL THEN
                      SELECT nv.e_cessione_beni INTO v_cessione_beni
                        FROM catalogo.articoli a
                        JOIN config.nature_vendita nv ON nv.id = a.natura_vendita_id
                       WHERE a.id = p_articolo_id;
                  END IF;

                  -- ══ LO SMISTAMENTO ═════════════════════════════════════════
                  -- ⚠️ Decide il paese di CHI EMETTE: e' il suo regime fiscale a
                  --   stabilire quale legge si applica. Il paese del cliente entra
                  --   nella regola, non nella scelta dell'implementazione.
                  -- ⚠️ Emittente assente -> si assume l'Italia, ed e' una scelta:
                  --   oggi e' l'unico paese implementato, e rifiutare una chiamata
                  --   che non nomina l'emittente spegnerebbe le anteprime di
                  --   documento che l'emittente non lo passano.
                  IF COALESCE(v_paese_emitt, 'IT') = 'IT' THEN
                      RETURN QUERY
                      SELECT * FROM vendite.fn_resolve_iva_riga_it(
                          p_articolo_id, p_data_riferimento, p_imponibile,
                          p_billing_account_id, p_utility_id,
                          p_soggetto_id, p_emittente_fiscale_id);
                      RETURN;
                  END IF;

                  -- ⛔ IL RAMO CHE IL DISPATCHER CF/PIVA NON HA. Li' un paese
                  --   diverso non valida niente, in silenzio; qui il silenzio
                  --   sarebbe un'imposta sbagliata senza errore.
                  PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_resolve_iva_riga', 'E_IVA_PAESE_NON_IMPLEMENTATO',
                      jsonb_build_object('paese_emittente', v_paese_emitt,
                                         'paese_cliente',   v_paese_cli,
                                         'cessione_beni',   v_cessione_beni,
                                         'articolo_id',     p_articolo_id),
                      NULL::uuid, v_paese_emitt);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_resolve_iva_riga(uuid, date, numeric, bigint, integer, uuid, bigint, character, character, boolean)
              IS 'LA PORTA del risolutore IVA: e'' questa che i chiamanti chiamano. Stabilisce il contesto del dispatch — paese di chi emette, paese del cliente, natura dell''operazione — e passa la palla all''implementazione del paese giusto; la regola vera sta li'' (oggi vendite.fn_resolve_iva_riga_it). ⭐ GUSCIO e non parametro con rami interni (D21, decisione di Tid): cosi'' aggiungere un paese e'' aggiungere una funzione piu'' una riga qui, mentre con i rami dentro un corpo solo sarebbe riaprire ogni volta la funzione che calcola l''IVA di tutti — la prima e'' additiva, la seconda no. Stampo gia'' in casa: anagrafiche.trgfn_soggetti_valida_cf_piva_dispatch -> script.fn_validate_cf_piva_it. ⛔ MA CON L''ELSE CHE SOLLEVA, e il precedente su questo NON va copiato: il dispatcher del codice fiscale fa IF country = IT e non ha nessun ELSE, quindi per un paese diverso non valida niente IN SILENZIO. Su una validazione e'' un buco; su un risolutore IVA sarebbe un''imposta sbagliata senza errore — qui si solleva E_IVA_PAESE_NON_IMPLEMENTATO. ⚠️ Smista sul paese di CHI EMETTE: e'' il suo regime fiscale a stabilire quale legge si applica; il paese del cliente entra nella regola (per l''intracomunitario decide il luogo di imposizione insieme alla natura dell''operazione) ma non nella scelta dell''implementazione. ⭐ LA FIRMA E'' IL PUNTO, non la logica (D20): prende gia'' il paese di ENTRAMBE le parti e la natura dell''operazione, tutti e tre facoltativi e DERIVATI quando non passati — chi chiama oggi non deve saperne niente, e la firma non cambiera'' il giorno che si aggiunge un paese. ⚠️ Oggi l''implementazione italiana quei tre non li usa: normalmente un parametro accettato e non usato e'' il difetto che questo cantiere combatte, ma la differenza e'' netta — quello e'' un campo che un OPERATORE compila credendo di decidere qualcosa, questo e'' un punto di estensione dichiarato, che costa niente adesso e costerebbe ogni chiamante dopo. ℹ️ I tre si derivano QUI e non nel chiamante perche'' stabilire il contesto del dispatch e'' mestiere del guscio: farli cercare a chi chiama vorrebbe dire ripetere tre lookup in ogni punto che risolve l''IVA. ⚠️ Emittente assente -> si assume l''Italia: oggi e'' l''unico paese implementato, e rifiutare una chiamata che non nomina l''emittente spegnerebbe le anteprime di documento che non lo passano. ⚠️ Il paese si legge da config.stati.codice_iso2, chiave naturale esterna (standard ISO) e quindi stabile per costruzione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_resolve_iva_riga(uuid, date, numeric, bigint, integer, uuid, bigint, character, character, boolean);
