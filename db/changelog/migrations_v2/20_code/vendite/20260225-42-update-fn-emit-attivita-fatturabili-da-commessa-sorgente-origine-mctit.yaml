databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260225-42-update-fn-emit-attivita-fatturabili-da-commessa-sorgente-origine-mctit.yaml

  - changeSet:
      id: 20260225-42-update-fn-emit-attivita-fatturabili-da-commessa-sorgente-origine
      author: mctit
      # runOnChange: true
      #  validCheckSum:
      #     - ANY
      comment: "§26 B: propaga sorgente_origine_tipo_id (sorgente business originale) da commesse_attivita ad attivita_fatturabili."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(
                p_commessa_id vendite.commesse.id%TYPE,
                p_lotto_attivita_id vendite.attivita_fatturabili.lotto_attivita_id%TYPE DEFAULT NULL::bigint,
                p_only_approved boolean DEFAULT true,
                p_dry_run boolean DEFAULT false
              )
              RETURNS TABLE(
                total_candidate integer,
                inserted_rows integer,
                updated_rows integer,
                skipped_rows integer
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_commessa vendite.commesse%ROWTYPE;
                v_root_id vendite.commesse_sorgenti.id%TYPE;
                v_commessa_source_id config.sorgenti.id%TYPE;
                v_existing_id vendite.attivita_fatturabili.id%TYPE;
                v_existing_fatturato vendite.attivita_fatturabili.fatturato%TYPE;
                v_sorgente_uid_uuid vendite.attivita_fatturabili.sorgente_uid%TYPE;
                v_row RECORD;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Emettere righe da commesse_attivita verso
                --   attivita_fatturabili in modalita idempotente.
                --
                -- Regole:
                --   - ROOT obbligatoria su commessa
                --   - sorgente AF sempre COMMESSA + hash(segment_key)
                --   - se riga AF esistente e gia fatturata -> errore
                --   - sorgente_origine_tipo_id propagato da
                --     commesse_attivita.sorgente_tipo_id (§26 B)
                -- =========================================================
                total_candidate := 0;
                inserted_rows := 0;
                updated_rows := 0;
                skipped_rows := 0;

                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','commessa_id obbligatorio','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    'commessa_id obbligatorio'
                  );
                END IF;

                IF p_lotto_attivita_id IS NOT NULL AND p_lotto_attivita_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','lotto_attivita_id non valido','lotto_attivita_id',p_lotto_attivita_id)
                    ),
                    NULL::uuid,
                    'lotto_attivita_id non valido'
                  );
                END IF;

                SELECT c.*
                INTO v_commessa
                FROM vendite.commesse c
                WHERE c.id = p_commessa_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','commessa non trovata','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    concat('commessa non trovata: ', p_commessa_id::text)
                  );
                END IF;

                IF p_lotto_attivita_id IS NOT NULL AND NOT EXISTS (
                  SELECT 1
                  FROM vendite.attivita_fatturabili_lotti l
                  WHERE l.id = p_lotto_attivita_id
                ) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','lotto attivita non trovato','lotto_attivita_id',p_lotto_attivita_id)
                    ),
                    NULL::uuid,
                    concat('lotto attivita non trovato: ', p_lotto_attivita_id::text)
                  );
                END IF;

                SELECT cs.id
                INTO v_root_id
                FROM vendite.commesse_sorgenti cs
                WHERE cs.commessa_id = p_commessa_id
                  AND cs.ruolo_link = 'ROOT'
                LIMIT 1;

                IF v_root_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','ROOT source mancante per commessa','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    concat('ROOT source mancante per commessa: ', p_commessa_id::text)
                  );
                END IF;

                SELECT s.id
                INTO v_commessa_source_id
                FROM config.sorgenti s
                WHERE s.codice = 'COMMESSA'
                  AND s.attivo IS TRUE
                LIMIT 1;

                IF v_commessa_source_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','sorgente COMMESSA non configurata/attiva')
                    ),
                    NULL::uuid,
                    concat('sorgente COMMESSA non configurata/attiva')
                  );
                END IF;

                FOR v_row IN
                  SELECT
                    ca.id,
                    ca.segment_key,
                    ca.articolo_id,
                    ca.istanza_utility_id,
                    ca.data_attivita,
                    ca.uom_id,
                    ca.quantita,
                    ca.qta_operativa,
                    ca.uom_operativa_id,
                    ca.factor_to_base,
                    ca.competenza_mese,
                    ca.competenza_dal,
                    ca.competenza_al,
                    ca.posticipa_al,
                    ca.tipo_doc_fiscale_id,
                    ca.valuta_id,
                    ca.area_geografica_id,
                    ca.prezzo_snapshot,
                    ca.prezzo_bloccato,
                    ca.stato_approvazione,
                    ca.meta,
                    -- §26 B: propaga sorgente business originale su AF
                    ca.sorgente_tipo_id AS ca_sorgente_tipo_id
                  FROM vendite.commesse_attivita ca
                  WHERE ca.commessa_id = p_commessa_id
                    AND ca.stato_emissione = 'NON_EMESSA'
                    AND (
                      p_only_approved IS FALSE
                      OR ca.stato_approvazione = 'APPROVATA'
                    )
                  ORDER BY ca.id
                LOOP
                  total_candidate := total_candidate + 1;

                  -- Mappa deterministicamente segment_key -> UUID per rispettare
                  -- il contratto attuale di attivita_fatturabili.sorgente_uid (uuid).
                  v_sorgente_uid_uuid :=
                    (
                      substr(md5(v_row.segment_key), 1, 8) || '-' ||
                      substr(md5(v_row.segment_key), 9, 4) || '-' ||
                      substr(md5(v_row.segment_key), 13, 4) || '-' ||
                      substr(md5(v_row.segment_key), 17, 4) || '-' ||
                      substr(md5(v_row.segment_key), 21, 12)
                    )::uuid;

                  SELECT a.id, a.fatturato
                  INTO v_existing_id, v_existing_fatturato
                  FROM vendite.attivita_fatturabili a
                  WHERE a.sorgente_tipo_id = v_commessa_source_id
                    AND a.sorgente_uid = v_sorgente_uid_uuid
                  FOR UPDATE;

                  IF p_dry_run THEN
                    IF v_existing_id IS NULL THEN
                      inserted_rows := inserted_rows + 1;
                    ELSE
                      updated_rows := updated_rows + 1;
                    END IF;
                    CONTINUE;
                  END IF;

                  IF v_existing_id IS NULL THEN
                    INSERT INTO vendite.attivita_fatturabili (
                      articolo_id,
                      billing_account_id,
                      istanza_utility_id,
                      data_attivita,
                      quantita,
                      competenza_mese,
                      approvato,
                      fatturato,
                      meta,
                      sorgente_riga,
                      posticipa_al,
                      sorgente_tipo_id,
                      sorgente_uid,
                      uom_id,
                      qta_operativa,
                      uom_operativa_id,
                      factor_to_base,
                      valuta_id,
                      prezzo_unitario,
                      lotto_attivita_id,
                      tipo_doc_fiscale_id,
                      competenza_dal,
                      competenza_al,
                      area_geografica_id,
                      stato_esecuzione,
                      prezzo_bloccato,
                      commessa_id,
                      commessa_attivita_id,
                      sorgente_origine_tipo_id
                    )
                    VALUES (
                      v_row.articolo_id,
                      v_commessa.billing_account_id,
                      v_row.istanza_utility_id,
                      v_row.data_attivita,
                      v_row.quantita,
                      v_row.competenza_mese,
                      (v_row.stato_approvazione = 'APPROVATA'),
                      false,
                      COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                        'scope','COMMESSE',
                        'commessa_id',p_commessa_id,
                        'commessa_attivita_id',v_row.id,
                        'segment_key',v_row.segment_key
                      ),
                      v_row.id,
                      v_row.posticipa_al,
                      v_commessa_source_id,
                      v_sorgente_uid_uuid,
                      v_row.uom_id,
                      v_row.qta_operativa,
                      v_row.uom_operativa_id,
                      v_row.factor_to_base,
                      v_row.valuta_id,
                      v_row.prezzo_snapshot,
                      p_lotto_attivita_id,
                      v_row.tipo_doc_fiscale_id,
                      v_row.competenza_dal,
                      v_row.competenza_al,
                      v_row.area_geografica_id,
                      'PENDING',
                      v_row.prezzo_bloccato,
                      p_commessa_id,
                      v_row.id,
                      v_row.ca_sorgente_tipo_id
                    );
                    inserted_rows := inserted_rows + 1;
                  ELSE
                    IF COALESCE(v_existing_fatturato, false) IS TRUE THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite','fn_emit_attivita_fatturabili_da_commessa','E_GENERICO',
                        jsonb_build_object(
                          'scope','COMMESSE','severity','C','code','E_GENERICO',
                          'lotto_id',p_lotto_attivita_id,'fattura_id',NULL,
                          'context',jsonb_build_object(
                            'detail','riga AF gia fatturata: update non consentito',
                            'attivita_fatturabili_id',v_existing_id,
                            'commessa_attivita_id',v_row.id
                          )
                        ),
                        NULL::uuid,
                        concat('riga AF gia fatturata: update non consentito - attivita_fatturabili_id=',
                        v_existing_id::text,' commessa_attivita_id=',v_row.id::text)
                      );
                    END IF;

                    UPDATE vendite.attivita_fatturabili a
                    SET articolo_id = v_row.articolo_id,
                        billing_account_id = v_commessa.billing_account_id,
                        istanza_utility_id = v_row.istanza_utility_id,
                        data_attivita = v_row.data_attivita,
                        quantita = v_row.quantita,
                        competenza_mese = v_row.competenza_mese,
                        approvato = (v_row.stato_approvazione = 'APPROVATA'),
                        meta = COALESCE(a.meta, '{}'::jsonb) || COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                          'scope','COMMESSE',
                          'commessa_id',p_commessa_id,
                          'commessa_attivita_id',v_row.id,
                          'segment_key',v_row.segment_key
                        ),
                        sorgente_riga = v_row.id,
                        posticipa_al = v_row.posticipa_al,
                        uom_id = v_row.uom_id,
                        qta_operativa = v_row.qta_operativa,
                        uom_operativa_id = v_row.uom_operativa_id,
                        factor_to_base = v_row.factor_to_base,
                        valuta_id = v_row.valuta_id,
                        prezzo_unitario = v_row.prezzo_snapshot,
                        lotto_attivita_id = COALESCE(p_lotto_attivita_id, a.lotto_attivita_id),
                        tipo_doc_fiscale_id = v_row.tipo_doc_fiscale_id,
                        competenza_dal = v_row.competenza_dal,
                        competenza_al = v_row.competenza_al,
                        area_geografica_id = v_row.area_geografica_id,
                        prezzo_bloccato = v_row.prezzo_bloccato,
                        commessa_id = p_commessa_id,
                        commessa_attivita_id = v_row.id,
                        sorgente_origine_tipo_id = v_row.ca_sorgente_tipo_id
                    WHERE a.id = v_existing_id;
                    updated_rows := updated_rows + 1;
                  END IF;

                  UPDATE vendite.commesse_attivita ca
                  SET stato_emissione = 'EMESSA'
                  WHERE ca.id = v_row.id;
                END LOOP;

                RETURN NEXT;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(bigint, bigint, boolean, boolean)
              IS 'Esegue il pull da commesse_attivita ad attivita_fatturabili con sorgente COMMESSA+segment_key (hash UUID) e idempotenza. Propaga sorgente_origine_tipo_id dalla sorgente business originale (§26 B).';
