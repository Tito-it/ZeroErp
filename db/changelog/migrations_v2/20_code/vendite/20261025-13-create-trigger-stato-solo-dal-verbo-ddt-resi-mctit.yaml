# ------------------------------------------------------------
# MONTAGGIO DELLA PORTA SU BOLLA E RESO
#   Brief: brief-modello-documento-vendita §7 (giro 5; S-1 b, T-3 di Tid,
#   2026-10-25).
#
#   script.trgfn_doc_stato_solo_dal_verbo (20261025-12), BEFORE UPDATE OF la
#   colonna di stato, fascia _a05_, su vendite.ddt e vendite.resi: i due
#   documenti di questo giro. Gli altri documenti la ricevono nel loro giro
#   (un documento per giro, M-1). I verbi che scrivono lo stato di bolla e reso
#   passano dalla scrittura comune da 20261025-16 … -18; il backend passa gia'
#   solo dai verbi (bolla: giro A1 del 2026-10-12; reso: solo conferma e
#   annullo, nessun cambio di stato generico).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261025-13-create-trigger-stato-solo-dal-verbo-ddt-resi-mctit.yaml

  - changeSet:
      id: 20261025-13-create-trigger-stato-solo-dal-verbo-ddt-resi
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta script.trgfn_doc_stato_solo_dal_verbo (BEFORE UPDATE OF colonna di stato, _a05_)
        su vendite.ddt e vendite.resi. Brief: brief-modello-documento-vendita §7 (S-1 b, T-3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'trgfn_doc_stato_solo_dal_verbo';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_ddt_a05_stato_solo_dal_verbo_upd
                  BEFORE UPDATE OF stato_doc_ddt_id ON vendite.ddt
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_solo_dal_verbo();

              COMMENT ON TRIGGER trg_ddt_a05_stato_solo_dal_verbo_upd ON vendite.ddt IS
                  'La porta (BB script.trgfn_doc_stato_solo_dal_verbo): lo stato della bolla si cambia solo dal suo verbo (vendite.fn_cambia_stato_ddt, vendite.fn_annulla_ddt; CONSEGNATO <-> RESO dai verbi del reso), che scrive con script.fn_doc_scrivi_stato. Un UPDATE diretto: E_DOC_STATO_SOLO_DAL_VERBO. Fascia _a05_. Brief: brief-modello-documento-vendita §7 (S-1 b, Tid 2026-10-25).';

              CREATE TRIGGER trg_resi_a05_stato_solo_dal_verbo_upd
                  BEFORE UPDATE OF stato_doc_reso_id ON vendite.resi
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_solo_dal_verbo();

              COMMENT ON TRIGGER trg_resi_a05_stato_solo_dal_verbo_upd ON vendite.resi IS
                  'La porta (BB script.trgfn_doc_stato_solo_dal_verbo): lo stato del reso si cambia solo dai suoi verbi (vendite.fn_conferma_reso, vendite.fn_annulla_reso), che scrivono con script.fn_doc_scrivi_stato. Un UPDATE diretto: E_DOC_STATO_SOLO_DAL_VERBO. Fascia _a05_. Brief: brief-modello-documento-vendita §7 (S-1 b, T-3, Tid 2026-10-25).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_a05_stato_solo_dal_verbo_upd ON vendite.ddt;
              DROP TRIGGER IF EXISTS trg_resi_a05_stato_solo_dal_verbo_upd ON vendite.resi;
