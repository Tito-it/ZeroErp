# NASCE vendite.vw_ddt_righe_dettaglio: la sorgente delle righe del DDT, per la
# lista configurabile `vendite.ddt_righe` e per il repository.
#
# -- PERCHE' --------------------------------------------------------------
#   Come per l'ordine (20260928-18): le righe del DDT esistevano solo come due
#   query Python in `ddt_repository` (`list_righe` e `get_riga`, gia' con
#   proiezioni diverse), e l'importo di riga era scritto li'. Decisione di Tid,
#   2026-09-28: D-8.6 del brief, estesa a ordini e DDT.
#
# -- LA FORMA ----------------------------------------------------------------
#   · colonne e nomi di `list_righe`, nello stesso ordine, piu'
#     `imponibile_riga_full` accanto a `importo_riga` come nelle gemelle;
#   · `importo_riga` dalla sede unica script.fn_imponibile_riga (20260928-16).
#     ⭐ Il DDT e' il documento dove la regola «prezzo assente -> NULL, non
#     zero» e' nata (V-2/DEC-6 di brief-ddt-righe-senza-prezzo): una riga di solo
#     trasporto non vale zero, non ha valore. La funzione la fa per tutti;
#   · ⚠️ nessun filtro su `attivo` e nessun ORDER BY, come le gemelle;
#   · `security_invoker = true`: ddt_righe e ddt_righe_componenti sono in RLS;
#     il presidio `rls/test-rls-viste-security-invoker` la prende per criterio.
#   · niente date di consegna: il DDT non le ha (e' la consegna).
#
# Base: la SELECT di ddt_repository.list_righe al 2026-09-28.
# Cantiere: brief-db-liste-righe-documento §8.6 (D-8.6), §8.10 passo 2
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-19-create-vw-ddt-righe-dettaglio-mctit.yaml

  - changeSet:
      id: 20260928-19-create-vw-ddt-righe-dettaglio
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce vw_ddt_righe_dettaglio, sorgente delle righe del DDT per la lista
        configurabile e per il repository: le colonne di ddt_repository.list_righe, con
        importo dalla sede unica script.fn_imponibile_riga (NULL se manca il prezzo).
        security_invoker, nessun ORDER BY, nessun filtro su attivo.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_imponibile_riga'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW vendite.vw_ddt_righe_dettaglio
              WITH (security_invoker = true) AS
              SELECT r.id,
                  r.ddt_id,
                  r.riga_nr,
                  r.attivo,
                  r.articolo_id,
                  a.codice AS articolo_codice,
                  a.descrizione AS articolo_descrizione,
                  r.descrizione,
                  r.quantita,
                  r.qta_operativa,
                  r.factor_to_base,
                  r.uom_operativa_id,
                  um.codice AS uom_codice,
                  r.prezzo_unitario,
                  r.sconto_percentuale,
                  r.iva_id,
                  iva.codice AS iva_codice,
                  iva.descrizione AS iva_descrizione,
                  iva.aliquota_iva AS iva_aliquota,
                  -- Arrotondato per mostrare; pieno per chi aggrega. Tutti e due
                  -- NULL sulla riga senza prezzo: mai uno zero finto.
                  round(script.fn_imponibile_riga(r.quantita, r.prezzo_unitario,
                                                  r.sconto_percentuale), 2) AS importo_riga,
                  script.fn_imponibile_riga(r.quantita, r.prezzo_unitario,
                                            r.sconto_percentuale) AS imponibile_riga_full,
                  r.meta,
                  r.data_insert,
                  r.data_update,
                  -- Vero se la riga ha almeno un componente attivo.
                  (EXISTS (SELECT 1
                             FROM vendite.ddt_righe_componenti rc
                            WHERE rc.riga_ddt_id = r.id
                              AND rc.attivo IS TRUE)) AS is_composito_caso_a
                FROM vendite.ddt_righe r
                LEFT JOIN catalogo.articoli a ON a.id = r.articolo_id
                LEFT JOIN catalogo.unita_misura um ON um.id = r.uom_operativa_id
                LEFT JOIN config.iva iva ON iva.id = r.iva_id;

              COMMENT ON VIEW vendite.vw_ddt_righe_dettaglio IS
                  'Righe del DDT con articolo, UoM e IVA: la SORGENTE delle righe per la lista '
                  'configurabile vendite.ddt_righe e per il repository (brief-db-liste-righe-documento, '
                  'D-8.6, 2026-09-28; prima esistevano solo come due query Python con proiezioni '
                  'diverse). Tutte le righe, anche le non attive: il filtro lo mette chi legge. '
                  'Nessun ORDER BY. importo_riga = round(…, 2) per mostrare, imponibile_riga_full '
                  'pieno per chi aggrega, entrambi da script.fn_imponibile_riga: NULL sulla riga '
                  'senza prezzo (DDT di solo trasporto), mai uno zero finto (V-2/DEC-6). '
                  'security_invoker: ddt_righe e'' in RLS.';

              -- ⚠️ Nessun GRANT qui: il SELECT a zeroerp_app lo dà il loop dei
              --    grant, come per le altre viste di vendite (es. 20260917-06).
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_ddt_righe_dettaglio;
