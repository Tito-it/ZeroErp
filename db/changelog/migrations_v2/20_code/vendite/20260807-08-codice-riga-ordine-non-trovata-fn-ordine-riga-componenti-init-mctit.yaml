# La riga ordine inesistente smette di dire «parametro non valido».
#   Brief: brief-db-be-terzo-lato-presidio-codici.md §19.4
#
# ⚠️ PERCHE' ARRIVA DOPO IL 20260807-02, che ha corretto la gemella
#   fn_contratto_riga_componenti_init. Nel referto al BE avevo riportato TRE
#   punti di questo tipo: erano SEI. Gli altri tre — questo, ordine e
#   preventivo — li avevo scartati come falsi positivi della lente **senza
#   leggerli**, assumendo che fossero come gli altri candidati scartati.
#   Non lo erano: stessa forma esatta, stesso jsonb_build_object('p_riga_id'),
#   stesso difetto. E' la lente stessa, rilanciata dopo le correzioni, ad
#   averli rimessi in fila — un candidato non letto resta un candidato.
#
# ℹ️ Il conto vero su E_PARAMETRO_INVALIDO non e' cinque punti ma OTTO: su 113
#   funzioni che lo nominano, otto lo usavano per un IF NOT FOUND. Resta il
#   codice giusto altrove, ed e' il motivo per cui la correzione sta qui e non
#   nella policy.
#
# Unica modifica al corpo: il codice sollevato nel ramo IF NOT FOUND e il suo
# valore variadico, che non ripete piu' la frase (la dice il messaggio).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260807-08-codice-riga-ordine-non-trovata-fn-ordine-riga-componenti-init-mctit.yaml

  - changeSet:
      id: 20260807-08-codice-riga-ordine-non-trovata-fn-ordine-riga-componenti-init
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        La riga ordine inesistente solleva E_ORDINE_RIGA_NON_TROVATA invece di
        E_PARAMETRO_INVALIDO: era 400 su un 404. Gemello del 20260807-02.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'vendite'
                AND p.proname = 'fn_ordine_riga_componenti_init'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ordine_riga_componenti_init(p_riga_id bigint, p_emittente_sr_id bigint, p_data_riferimento date, p_componenti_overrides jsonb DEFAULT NULL::jsonb)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: Popola ordini_righe_componenti per una riga composita.
              --   Modello unificato: tutti i componenti attivi inseriti con attivo=TRUE.
              --   BoM = contratto immutabile: l'operatore non sceglie quali includere.
              DECLARE
                  v_articolo_id      catalogo.articoli.id%TYPE;
                  v_codice_articolo  catalogo.articoli.codice%TYPE;
                  v_uom_id           catalogo.unita_misura.id%TYPE;
                  v_qta_padre        vendite.ordini_righe.quantita%TYPE;
                  v_ordine_id        vendite.ordini.id%TYPE;
                  v_is_composito     catalogo.articoli.is_composito%TYPE;
                  v_ba_id            anagrafiche.billing_account.id%TYPE;
                  v_utility_id       vendite.ordini.utility_id%TYPE;
                  v_comp             record;
                  v_resolve          record;
                  v_prezzo           vendite.listini_righe.prezzo%TYPE;
                  v_origine          vendite.ordini_righe_componenti.origine_prezzo%TYPE;
                  v_inserted         integer := 0;
              BEGIN
                  IF p_riga_id IS NULL OR p_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_riga_id'),
                          NULL::uuid, 'p_riga_id obbligatorio e > 0');
                  END IF;
                  IF p_emittente_sr_id IS NULL OR p_emittente_sr_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_emittente_sr_id'),
                          NULL::uuid, 'p_emittente_sr_id obbligatorio e > 0');
                  END IF;

                  SELECT or_.articolo_id, or_.uom_operativa_id, or_.quantita, or_.ordine_id,
                         a.is_composito, a.codice
                    INTO v_articolo_id, v_uom_id, v_qta_padre, v_ordine_id,
                         v_is_composito, v_codice_articolo
                    FROM vendite.ordini_righe or_
                    JOIN catalogo.articoli a ON a.id = or_.articolo_id
                   WHERE or_.id = p_riga_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          -- rev 2026-08-07: era E_PARAMETRO_INVALIDO, cioe' 400 su un 404.
                          --   Gemello di fn_contratto_riga_componenti_init (20260807-02):
                          --   stessa forma, stesso difetto, trovato dalla stessa lente.
                          'E_ORDINE_RIGA_NON_TROVATA',
                          jsonb_build_object('p_riga_id', p_riga_id),
                          NULL::uuid, p_riga_id::text);
                  END IF;
                  IF NOT COALESCE(v_is_composito, FALSE) THEN RETURN 0; END IF;

                  IF EXISTS (
                      SELECT 1 FROM vendite.ordini_righe_componenti
                       WHERE riga_ordine_id = p_riga_id
                  ) THEN RETURN 0; END IF;

                  SELECT o.billing_account_id, o.utility_id
                    INTO v_ba_id, v_utility_id
                    FROM vendite.ordini o WHERE o.id = v_ordine_id;

                  FOR v_comp IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             a.uom_id       AS componente_uom_id,
                             a.iva_id       AS componente_iva_id
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                       WHERE ac.prodotto_id        = v_articolo_id
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita           @> p_data_riferimento
                  LOOP
                      IF p_componenti_overrides IS NOT NULL
                         AND p_componenti_overrides ? v_comp.componente_id::text THEN
                          v_prezzo  := (p_componenti_overrides ->> v_comp.componente_id::text)::numeric;
                          v_origine := 'MANUALE';
                          IF v_prezzo = 0 AND COALESCE(v_comp.obbligatorio, TRUE) THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_ordine_riga_componenti_init',
                                  'E_PARAMETRO_INVALIDO',
                                  jsonb_build_object('componente_id', v_comp.componente_id,
                                      'hint', 'prezzo override deve essere diverso da zero'),
                                  NULL::uuid, p_riga_id::text);
                          END IF;
                          INSERT INTO vendite.ordini_righe_componenti (
                              riga_ordine_id, articolo_componente_id, componente_id,
                              coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                              prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                          ) VALUES (
                              p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                              v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                              v_comp.componente_uom_id, 1,
                              v_prezzo, v_comp.componente_iva_id, v_origine,
                              TRUE,
                              jsonb_build_object('override', true,
                                  'emittente_sr_id', p_emittente_sr_id,
                                  'data_riferimento', p_data_riferimento,
                                  'ba_id', v_ba_id, 'utility_id', v_utility_id)
                          );
                      ELSE
                          BEGIN
                              SELECT * INTO v_resolve
                                FROM vendite.fn_resolve_prezzo_listino_v2(
                                    v_comp.componente_id, v_comp.componente_uom_id,
                                    p_data_riferimento, v_ba_id, v_utility_id::integer,
                                    p_emittente_sr_id, NULL,
                                    v_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                                );
                              INSERT INTO vendite.ordini_righe_componenti (
                                  riga_ordine_id, articolo_componente_id, componente_id,
                                  coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                                  prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                              ) VALUES (
                                  p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                                  v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                                  v_comp.componente_uom_id, 1,
                                  v_resolve.prezzo_finale, v_comp.componente_iva_id,
                                  v_resolve.origine,
                                  TRUE,
                                  jsonb_build_object('emittente_sr_id', p_emittente_sr_id,
                                      'data_riferimento', p_data_riferimento,
                                      'ba_id', v_ba_id, 'utility_id', v_utility_id,
                                      'listino_id', v_resolve.listino_id,
                                      'listino_versione_id', v_resolve.listino_versione_id,
                                      'listino_riga_id', v_resolve.listino_riga_id,
                                      'contratto_id', v_resolve.contratto_id,
                                      'origine', v_resolve.origine)
                              );
                          -- ⚠️ rev 2026-08-07: qui c'era `EXCEPTION WHEN SQLSTATE 'P0001'`,
                          --   che catturava QUALUNQUE errore di dominio del resolver e lo
                          --   ri-sollevava come E_DOC_COMPONENTE_LISTINO_MANCANTE tenendo solo
                          --   MESSAGE_TEXT: il codice strutturato originale andava perso, e con
                          --   lui il tipo di risposta. Sette codici diversi arrivavano al client
                          --   come 422 «listino non configurato» anche quando il listino non
                          --   c'entrava nulla. Ora l'errore del resolver passa col proprio codice.
                          --   Il blocco BEGIN..END resta: non serve piu' a nulla di funzionale,
                          --   ma toglierlo vorrebbe dire re-indentare venticinque righe per
                          --   niente. Brief terzo lato §18.3.
                          END;
                      END IF;
                      v_inserted := v_inserted + 1;
                  END LOOP;

                  IF v_inserted = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          'E_DOC_COMPOSITO_BOM_VUOTA',
                          jsonb_build_object('articolo_id', v_articolo_id,
                              'data_riferimento', p_data_riferimento),
                          NULL::uuid,
                          v_codice_articolo,
                          p_data_riferimento::text
                      );
                  END IF;

                  RETURN v_inserted;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ordine_riga_componenti_init IS 'Inizializza componenti BoM per riga ordine. rev 2026-08-07: tolto l''handler EXCEPTION WHEN SQLSTATE P0001 che catturava qualunque errore del resolver listini e lo ri-sollevava come E_DOC_COMPONENTE_LISTINO_MANCANTE tenendo solo MESSAGE_TEXT (brief terzo lato §18.3). rev 2026-08-07 (bis): la riga inesistente solleva E_ORDINE_RIGA_NON_TROVATA (900) invece di E_PARAMETRO_INVALIDO, che dava 400 su un 404 — sesto e ultimo dei punti trovati dalla lente del quarto lato (§19.4).';
