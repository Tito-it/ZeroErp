# I TRIGGER DELLA QUANTITA' PER FONTE, SULLE DUE TABELLE GEMELLE
#   vendite.contratti_righe, vendite.offerte_commerciali_eccezioni
#   Brief: brief-db-offerta-emissione-ed-erogazione §D.4 punto 2, §E
#
# ── L'ORDINE (i BEFORE ROW girano per nome) ─────────────────────────
#   …_a10_default_erogazione_articolo_ins_upd   eredita / riallinea la fonte
#   …_a10_default_fonte_qta_ins_upd             la matrice generica
#   …_a10_guard_erogazione_obbligatoria_ins_upd
#   …_a10_guard_erogazione_perimetro_ins|_upd   la combinazione, prima
#   …_a10_guard_pending_upd                     (solo contratto)
#   …_a10_guard_quantita_per_fonte_ins_upd      QUESTO: la fonte e' ormai quella
#                                                definitiva, e la quantita' si
#                                                giudica su di lei
#   «de» < «gu»; «guard_e» < «guard_p» < «guard_q». Una fonte sbagliata la dice
#   il perimetro prima che si parli di quantita'.
#   ⚠️ UPDATE senza OF: la fonte la puo' riallineare default_erogazione_articolo
#   (UPDATE OF tipo_erogazione), e un UPDATE OF fonte non lo vedrebbe.
#
# ── IL CHECK RESTA LA RETE ───────────────────────────────────────────
#   chk_*_quantita_per_fonte (20261007-28): stessa regola, senza campo.
#   Ritorno indietro: DROP dei due trigger.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261007-30-create-trigger-righe-quantita-per-fonte-mctit.yaml

  - changeSet:
      id: 20261007-30-create-trigger-righe-quantita-per-fonte
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il guard della quantità per fonte sulle righe di contratto e offerta, su INSERT e UPDATE.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'trgfn_righe_guard_quantita_per_fonte'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_contratti_righe_a10_guard_quantita_per_fonte_ins_upd
                  BEFORE INSERT OR UPDATE ON vendite.contratti_righe
                  FOR EACH ROW
                  WHEN (NEW.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto)
                  EXECUTE FUNCTION script.trgfn_righe_guard_quantita_per_fonte('contratto_id');

              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_quantita_per_fonte_ins_upd
                  BEFORE INSERT OR UPDATE ON vendite.offerte_commerciali_eccezioni
                  FOR EACH ROW
                  WHEN (NEW.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto)
                  EXECUTE FUNCTION script.trgfn_righe_guard_quantita_per_fonte('offerta_id');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_quantita_per_fonte_ins_upd ON vendite.contratti_righe;
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_quantita_per_fonte_ins_upd ON vendite.offerte_commerciali_eccezioni;
