# ------------------------------------------------------------
# IL RESO HA IL CLIENTE DEL SUO DDT, SEMPRE
#   vendite.trgfn_resi_guard_cliente_ddt (trigger in -82).
#   Brief: brief-db-esecutivi-ba-coppia (§5.3, D-3, D-6)
#
# -- LA REGOLA ------------------------------------------------------
#   D-3 di Tid: il reso non e' mai standalone (resi.sorgente_tipo_id NOT
#   NULL) e il suo billing account e' quello del DDT sorgente, NULL compreso —
#   non «obbligatorio», «uguale». trgfn_resi_normalize lo eredita con un
#   COALESCE che TIENE un valore esplicito diverso: il normalize non cambia
#   (riempie quando manca), rifiuta questo guard.
#
# -- ⭐ PERCHE' NON SERVE UN LOCK FUORI BOZZA SUL RESO -----------------------
#   Il §5.3 lo chiedeva «come sul DDT». Ma questo guard gira su INSERT e su
#   ogni UPDATE che tocca BA o sorgente, in qualunque stato; il DDT sorgente e'
#   CONSEGNATO (trgfn_resi_guard_ddt_consegnato) e il suo cliente e' bloccato
#   fuori bozza (trg_ddt_a05_lock_fuori_bozza_upd). Il BA del reso quindi non
#   puo' cambiare mai: un lock in piu' direbbe la stessa regola due volte.
#   Utility e destinatario seguono il BA per la FK fk_resi_ba_cliente.
#
# -- DOVE NELL'ORDINE DEI TRIGGER ---------------------------------------
#   Fascia _z10_: dopo trg_resi_normalize_ins_upd, che su INSERT riempie BA,
#   utility e destinatario dal DDT; prima di trg_resi_z10_guard_emittente_ba
#   (c < e). Il DDT si legge come INVOKER, come il normalize.
#
# -- IL CODICE --------------------------------------------------------
#   E_DOC_CLIENTE_DIVERSO_DA_SORGENTE, lo stesso di DDT e fulfillment: una
#   regola, un codice.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261009-81-create-trgfn-resi-guard-cliente-ddt-mctit.yaml

  - changeSet:
      id: 20261009-81-create-trgfn-resi-guard-cliente-ddt
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_resi_guard_cliente_ddt: il reso ha il billing account del DDT da cui nasce,
        NULL compreso. Brief: brief-db-esecutivi-ba-coppia (D-3, D-6).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_guard_cliente_ddt()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il reso ha il billing account del DDT da cui nasce,
              --   NULL compreso (D-3 e D-6 di brief-db-esecutivi-ba-coppia).
              --   Su INSERT e su ogni UPDATE che tocca BA o sorgente, in
              --   qualunque stato: il BA del DDT sorgente e' bloccato fuori
              --   bozza, quindi quello del reso non cambia mai.
              -- Uso: BEFORE INSERT OR UPDATE, fascia _z10_ (dopo il normalize).
              DECLARE
                  v_ba_ddt   vendite.ddt.billing_account_id%TYPE;
                  v_ddt_lbl  text;
              BEGIN
                  IF TG_OP = 'UPDATE'
                     AND NEW.billing_account_id IS NOT DISTINCT FROM OLD.billing_account_id
                     AND NEW.sorgente_tipo_id   IS NOT DISTINCT FROM OLD.sorgente_tipo_id
                     AND NEW.sorgente_uid       IS NOT DISTINCT FROM OLD.sorgente_uid THEN
                      RETURN NEW;
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM config.sorgenti s
                                  WHERE s.id = NEW.sorgente_tipo_id
                                    AND s.codice_interno = 'DDT_VENDITA') THEN
                      RETURN NEW;
                  END IF;

                  SELECT d.billing_account_id, 'DDT ' || COALESCE(d.numero, '#' || d.id::text)
                    INTO v_ba_ddt, v_ddt_lbl
                    FROM vendite.ddt d
                   WHERE d.uid = NEW.sorgente_uid;

                  -- DDT non trovato (o non visibile): non c'e' niente da
                  -- confrontare, ed e' il caso di cui parlano i guard della
                  -- sorgente.
                  IF FOUND AND v_ba_ddt IS DISTINCT FROM NEW.billing_account_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_DOC_CLIENTE_DIVERSO_DA_SORGENTE',
                          jsonb_build_object(
                              'campo',                  'billing_account_id',
                              'reso_id',                NEW.id,
                              'billing_account_id',     NEW.billing_account_id,
                              'sorgente_uid',           NEW.sorgente_uid,
                              'billing_account_ddt',    v_ba_ddt),
                          NEW.tx_id,
                          'reso ' || COALESCE(NEW.numero, '#' || NEW.id::text),
                          v_ddt_lbl);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_guard_cliente_ddt()
              IS 'Guard BEFORE INSERT OR UPDATE su vendite.resi, fascia _z10_ (dopo trgfn_resi_normalize): il reso ha il billing account del DDT sorgente (DDT_VENDITA), NULL compreso (D-3, D-6 di brief-db-esecutivi-ba-coppia). E_DOC_CLIENTE_DIVERSO_DA_SORGENTE, come DDT e fulfillment. In qualunque stato: il BA del DDT sorgente e'' bloccato fuori bozza e il DDT di un reso e'' consegnato, quindi il BA del reso non cambia mai — per questo il reso non ha un lock fuori bozza sul cliente. DDT letto come INVOKER, come il normalize.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.trgfn_resi_guard_cliente_ddt();
