                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','tipo_variazione_applicata','valore',p_tipo_variazione_applicata),
