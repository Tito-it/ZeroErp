# vendite.fn_partite_merce LEGGE IL BB «MERCE PARTITA»
#   Brief: brief-db-date-consegna-righe-in-blocco (§4.1, regola del 2, scelta (a))
#
# -- COSA CAMBIA ----------------------------------------------------------
#   La CTE `soglia` (l'ordine di EMESSO) e le due espressioni che la usavano
#   lasciano il posto a script.vw_stati_doc_ddt_merce_partita (20261012-30):
#     - `riga`: il filtro «NOT is_abortito AND ordine >= EMESSO» diventa
#       `sm.merce_partita`;
#     - `ponte_riga`: `emesso` diventa `sm_n.merce_partita`.
#   Nient'altro: le altre 23 colonne, i semi, la chiusura, le CTE MATERIALIZED
#   sono quelle del 20260922-16 (corpo verificato identico al vivo, su
#   zeroerp_ci e su dbdev, prima di scrivere questo file).
#
# -- IL SIGNIFICATO -------------------------------------------------------
#   Per `riga` identico. Per `ponte_riga` la regola guadagna `NOT is_abortito`:
#   una ri-consegna in un DDT abortito conta come «in riconsegna» e non come
#   «riconsegnata». Il modello lo vuole cosi' (una bolla annullata non ha
#   fatto partire niente) e, per il modello stesso, il caso non si forma:
#   l'annullo ritira i legami (vendite.fn_documento_ritira_legami, guard
#   dell'annullo con legami). E un `emesso` NULL (stato con ordine NULL) non
#   fa piu' sparire la quantita' da tutte e due le colonne.
#
# -- LA FORMA -------------------------------------------------------------
#   ⛔ fn_partite_merce e' sensibile al piano (20260922-16: «un cambio di
#   FORMA si misura sulla funzione»). Qui la forma cambia il meno possibile:
#   un JOIN su un catalogo di sei righe al posto di JOIN + CROSS JOIN, stessi
#   nodi altrove. Misurata sulla funzione nella prova pre-apply (owner); la
#   misura come app la fa la corsa di Tid dopo l'apply.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261012-32-update-fn-partite-merce-dal-bb-merce-partita-mctit.yaml

  - changeSet:
      id: 20261012-32-update-fn-partite-merce-dal-bb-merce-partita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_partite_merce: «merce partita» dal BB script.vw_stati_doc_ddt_merce_partita nelle
        CTE riga e ponte_riga, al posto della CTE soglia. Stessa firma, stesse 23 colonne e stessi
        valori. Brief: brief-db-date-consegna-righe-in-blocco (§4.1, scelta (a)).
      preConditions:
        - onFail: HALT
        - and:
            # La forma di partenza: il 20260922-16, con la CTE `soglia`.
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                   WHERE p.oid = 'vendite.fn_partite_merce'::regproc
                     AND p.prosqlbody IS NOT NULL
                     AND pg_catalog.pg_get_functiondef(p.oid) ~ 'ordine_emesso'
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_class c
                    JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'script' AND c.relname = 'vw_stati_doc_ddt_merce_partita';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_partite_merce(p_ddt_ids bigint[] DEFAULT NULL::bigint[], p_ordine_ids bigint[] DEFAULT NULL::bigint[])
               RETURNS TABLE(ddt_riga_id bigint, ddt_id bigint, ddt_uid uuid, articolo_id uuid, is_composito boolean, ordine_riga_id bigint, ordine_id bigint, origine character varying, fatturabile boolean, consegnato numeric, reso numeric, in_riconsegna numeric, tenuti numeric, fatturato_merce numeric, fatturato_da_ordine numeric, fatturato numeric, misurabile boolean, differenza numeric, stato character varying, e_riconsegna boolean, sospetto_duplicato_ordine boolean, rettificato numeric, riconsegna_quota_nuova numeric)
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
               WITH semi AS MATERIALIZED (
                        SELECT dr.id AS ddt_riga_id
                          FROM vendite.ddt_righe dr
                         WHERE (dr.ddt_id = ANY (fn_partite_merce.p_ddt_ids))
                       UNION
                        SELECT f.ddt_riga_id
                          FROM (vendite.ordini_righe_fulfillment f
                            JOIN vendite.ordini_righe orr_1 ON ((orr_1.id = f.ordine_riga_id)))
                         WHERE (orr_1.ordine_id = ANY (fn_partite_merce.p_ordine_ids))
                       ), r1 AS MATERIALIZED (
                        SELECT f2.ddt_riga_id
                          FROM vendite.ordini_righe_fulfillment f2
                         WHERE (f2.ordine_riga_id IN ( SELECT min(f.ordine_riga_id) AS min
                                  FROM vendite.ordini_righe_fulfillment f
                                 WHERE (f.ddt_riga_id IN ( SELECT s.ddt_riga_id
                                          FROM semi s))
                                 GROUP BY f.ddt_riga_id))
                       ), chiusura AS MATERIALIZED (
                        SELECT s.ddt_riga_id
                          FROM semi s
                       UNION
                        SELECT r_1.ddt_riga_id
                          FROM r1 r_1
                       ), origini AS MATERIALIZED (
                        SELECT c.ddt_riga_id
                          FROM chiusura c
                       UNION
                        SELECT rr.ddt_riga_id
                          FROM (vendite.resi_righe_riconsegne rc
                            JOIN vendite.resi_righe rr ON ((rr.id = rc.resi_riga_id)))
                         WHERE (rc.ddt_riga_id IN ( SELECT c.ddt_riga_id
                                  FROM chiusura c))
                       ), dr_in AS MATERIALIZED (
                        SELECT dr.id,
                           dr.ddt_id,
                           dr.articolo_id,
                           dr.quantita
                          FROM (vendite.ddt_righe dr
                            JOIN chiusura c ON ((c.ddt_riga_id = dr.id)))
                         WHERE ((dr.attivo IS TRUE) AND (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL))))
                       UNION ALL
                        SELECT dr.id,
                           dr.ddt_id,
                           dr.articolo_id,
                           dr.quantita
                          FROM vendite.ddt_righe dr
                         WHERE ((dr.attivo IS TRUE) AND ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       ), riconsegne_in AS MATERIALIZED (
                        SELECT rr.ddt_riga_id AS ddt_riga_origine,
                           rc.ddt_riga_id AS ddt_riga_nuova,
                           rc.qta
                          FROM ((vendite.resi_righe_riconsegne rc
                            JOIN vendite.resi_righe rr ON ((rr.id = rc.resi_riga_id)))
                            JOIN origini o_1 ON ((o_1.ddt_riga_id = rr.ddt_riga_id)))
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       UNION ALL
                        SELECT rr.ddt_riga_id,
                           rc.ddt_riga_id,
                           rc.qta
                          FROM (vendite.resi_righe_riconsegne rc
                            JOIN vendite.resi_righe rr ON ((rr.id = rc.resi_riga_id)))
                         WHERE ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL))
                       ), fulfillment_in AS MATERIALIZED (
                        SELECT f.ddt_riga_id,
                           f.ordine_riga_id
                          FROM (vendite.ordini_righe_fulfillment f
                            JOIN chiusura c ON ((c.ddt_riga_id = f.ddt_riga_id)))
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       UNION ALL
                        SELECT f.ddt_riga_id,
                           f.ordine_riga_id
                          FROM vendite.ordini_righe_fulfillment f
                         WHERE ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL))
                       ), resi_in AS MATERIALIZED (
                        SELECT e.ddt_riga_id,
                           e.quantita
                          FROM (vendite.vw_resi_righe_effettive e
                            JOIN chiusura c ON ((c.ddt_riga_id = e.ddt_riga_id)))
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       UNION ALL
                        SELECT e.ddt_riga_id,
                           e.quantita
                          FROM vendite.vw_resi_righe_effettive e
                         WHERE ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL))
                       ), ddt_in AS MATERIALIZED (
                        SELECT DISTINCT dr.ddt_id
                          FROM dr_in dr
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       ), chiavi_af AS MATERIALIZED (
                        SELECT (((('DDT:'::text || (d.uid)::text) || ':R:'::text) || (dr.id)::text))::character varying AS k
                          FROM ((origini o_1
                            JOIN vendite.ddt_righe dr ON ((dr.id = o_1.ddt_riga_id)))
                            JOIN vendite.ddt d ON ((d.id = dr.ddt_id)))
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       UNION
                        SELECT (((('ORD:'::text || (od.uid)::text) || ':R:'::text) || (orr_1.id)::text))::character varying AS "varchar"
                          FROM ((fulfillment_in f
                            JOIN vendite.ordini_righe orr_1 ON ((orr_1.id = f.ordine_riga_id)))
                            JOIN vendite.ordini od ON ((od.id = orr_1.ordine_id)))
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       ), af AS MATERIALIZED (
                        SELECT a.corsia,
                           a.riga_id,
                           a.tipo_movimento,
                           a.quantita,
                           a.misurabile
                          FROM vendite.fn_af_merce_per_riga(( SELECT COALESCE(array_agg(c.k), '{}'::character varying[]) AS "coalesce"
                                  FROM chiavi_af c)) a(corsia, riga_id, tipo_movimento, quantita, misurabile, da_componenti, voci)
                         WHERE (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       UNION ALL
                        SELECT a.corsia,
                           a.riga_id,
                           a.tipo_movimento,
                           a.quantita,
                           a.misurabile
                          FROM vendite.fn_af_merce_per_riga(NULL::character varying[]) a(corsia, riga_id, tipo_movimento, quantita, misurabile, da_componenti, voci)
                         WHERE ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL))
                       ), ponte_riga AS (
                        SELECT ri.ddt_riga_origine,
                           ri.ddt_riga_nuova,
                           d_new.data AS ddt_nuovo_data,
                           sm_n.merce_partita AS emesso,
                           sum(ri.qta) AS qta
                          FROM (((riconsegne_in ri
                            JOIN vendite.ddt_righe dr_new ON ((dr_new.id = ri.ddt_riga_nuova)))
                            JOIN vendite.ddt d_new ON ((d_new.id = dr_new.ddt_id)))
                            JOIN script.vw_stati_doc_ddt_merce_partita sm_n ON ((sm_n.id = d_new.stato_doc_ddt_id)))
                         GROUP BY ri.ddt_riga_origine, ri.ddt_riga_nuova, d_new.data, sm_n.merce_partita
                       ), ponte AS (
                        SELECT p.ddt_riga_origine,
                           COALESCE(sum(p.qta) FILTER (WHERE p.emesso), (0)::numeric) AS riconsegnato,
                           COALESCE(sum(p.qta) FILTER (WHERE (NOT p.emesso)), (0)::numeric) AS in_riconsegna
                          FROM ponte_riga p
                         GROUP BY p.ddt_riga_origine
                       ), acc_origine AS (
                        SELECT DISTINCT p.ddt_riga_origine,
                           GREATEST((0)::numeric, (- COALESCE(ret.quantita, (0)::numeric))) AS accreditato
                          FROM (ponte_riga p
                            LEFT JOIN af ret ON ((((ret.corsia)::text = 'DDT'::text) AND (ret.riga_id = p.ddt_riga_origine) AND ((ret.tipo_movimento)::text = 'RETTIFICA'::text))))
                       ), migra AS (
                        SELECT p.ddt_riga_nuova,
                           p.ddt_riga_origine,
                           GREATEST((0)::numeric, LEAST(p.qta, (a.accreditato - COALESCE(sum(p.qta) OVER (PARTITION BY p.ddt_riga_origine ORDER BY p.ddt_nuovo_data, p.ddt_riga_nuova ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), (0)::numeric)))) AS quota
                          FROM (ponte_riga p
                            JOIN acc_origine a ON ((a.ddt_riga_origine = p.ddt_riga_origine)))
                         WHERE p.emesso
                       ), migra_origine AS (
                        SELECT m.ddt_riga_origine,
                           sum(m.quota) AS quota_migrata
                          FROM migra m
                         GROUP BY m.ddt_riga_origine
                       ), migra_nuova AS (
                        SELECT m.ddt_riga_nuova,
                           sum(m.quota) AS quota_nuova
                          FROM migra m
                         GROUP BY m.ddt_riga_nuova
                       ), riga AS (
                        SELECT dr.id AS ddt_riga_id,
                           dr.ddt_id,
                           d.uid AS ddt_uid,
                           d.data AS ddt_data,
                           dr.articolo_id,
                           COALESCE(art.is_composito, false) AS is_composito,
                           (EXISTS ( SELECT 1
                                  FROM vendite.resi_righe_riconsegne rc
                                 WHERE (rc.ddt_riga_id = dr.id))) AS e_riconsegna,
                           COALESCE(mn.quota_nuova, (0)::numeric) AS quota_nuova,
                           (((
                               CASE
                                   WHEN (EXISTS ( SELECT 1
                                      FROM vendite.resi_righe_riconsegne rc
                                     WHERE (rc.ddt_riga_id = dr.id))) THEN COALESCE(mn.quota_nuova, (0)::numeric)
                                   ELSE dr.quantita
                               END + COALESCE(pt.riconsegnato, (0)::numeric)) - COALESCE(mo.quota_migrata, (0)::numeric)))::numeric(18,6) AS consegnato,
                           COALESCE(pt.in_riconsegna, (0)::numeric) AS in_riconsegna,
                           COALESCE(caus.fatturabile, false) AS fatturabile
                          FROM (((((((dr_in dr
                            JOIN vendite.ddt d ON ((d.id = dr.ddt_id)))
                            JOIN script.vw_stati_doc_ddt_merce_partita sm ON ((sm.id = d.stato_doc_ddt_id)))
                            JOIN catalogo.articoli art ON ((art.id = dr.articolo_id)))
                            LEFT JOIN config.causali_trasporto caus ON ((caus.id = d.causale_trasporto_id)))
                            LEFT JOIN ponte pt ON ((pt.ddt_riga_origine = dr.id)))
                            LEFT JOIN migra_origine mo ON ((mo.ddt_riga_origine = dr.id)))
                            LEFT JOIN migra_nuova mn ON ((mn.ddt_riga_nuova = dr.id)))
                         WHERE sm.merce_partita
                       ), orig AS (
                        SELECT f.ddt_riga_id,
                           count(DISTINCT f.ordine_riga_id) AS n_origini,
                           min(f.ordine_riga_id) AS ordine_riga_id
                          FROM fulfillment_in f
                         GROUP BY f.ddt_riga_id
                       ), articoli_ordinati_per_ddt AS MATERIALIZED (
                        SELECT DISTINCT dr2.ddt_id,
                           orr_ord.articolo_id
                          FROM ((((ddt_in k
                            JOIN vendite.ddt_righe dr2 ON ((dr2.ddt_id = k.ddt_id)))
                            JOIN vendite.ordini_righe_fulfillment f2 ON ((f2.ddt_riga_id = dr2.id)))
                            JOIN vendite.ordini_righe orr_ful ON ((orr_ful.id = f2.ordine_riga_id)))
                            JOIN vendite.ordini_righe orr_ord ON ((orr_ord.ordine_id = orr_ful.ordine_id)))
                         WHERE ((dr2.attivo IS TRUE) AND (orr_ord.attivo IS TRUE) AND (NOT ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL))))
                       UNION
                        SELECT DISTINCT dr2.ddt_id,
                           orr_ord.articolo_id
                          FROM (((vendite.ddt_righe dr2
                            JOIN vendite.ordini_righe_fulfillment f2 ON ((f2.ddt_riga_id = dr2.id)))
                            JOIN vendite.ordini_righe orr_ful ON ((orr_ful.id = f2.ordine_riga_id)))
                            JOIN vendite.ordini_righe orr_ord ON ((orr_ord.ordine_id = orr_ful.ordine_id)))
                         WHERE ((dr2.attivo IS TRUE) AND (orr_ord.attivo IS TRUE) AND ((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)))
                       ), sospetto AS MATERIALIZED (
                        SELECT dr.id AS ddt_riga_id
                          FROM (vendite.ddt_righe dr
                            JOIN articoli_ordinati_per_ddt k ON (((k.ddt_id = dr.ddt_id) AND (k.articolo_id = dr.articolo_id))))
                         WHERE (NOT (EXISTS ( SELECT 1
                                  FROM vendite.ordini_righe_fulfillment f
                                 WHERE (f.ddt_riga_id = dr.id))))
                       ), res AS (
                        SELECT e.ddt_riga_id,
                           sum(e.quantita) AS reso
                          FROM resi_in e
                         GROUP BY e.ddt_riga_id
                       ), alloc AS (
                        SELECT r_1.ddt_riga_id,
                           GREATEST((0)::numeric, LEAST(r_1.consegnato, (COALESCE(fo.quantita, (0)::numeric) - COALESCE(sum(r_1.consegnato) OVER (PARTITION BY o_1.ordine_riga_id ORDER BY r_1.ddt_data, r_1.ddt_riga_id ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), (0)::numeric)))) AS fatturato_da_ordine,
                           COALESCE(fo.misurabile, true) AS ord_misurabile
                          FROM ((riga r_1
                            JOIN orig o_1 ON ((o_1.ddt_riga_id = r_1.ddt_riga_id)))
                            LEFT JOIN af fo ON ((((fo.corsia)::text = 'ORD'::text) AND (fo.riga_id = o_1.ordine_riga_id) AND ((fo.tipo_movimento)::text = 'NORMALE'::text))))
                         WHERE (NOT r_1.e_riconsegna)
                       )
                SELECT r.ddt_riga_id,
                   r.ddt_id,
                   r.ddt_uid,
                   r.articolo_id,
                   r.is_composito,
                   o.ordine_riga_id,
                   orr.ordine_id,
                   (
                       CASE
                           WHEN (o.ddt_riga_id IS NULL) THEN 'NESSUNA'::text
                           WHEN (o.n_origini > 1) THEN 'MULTIPLA'::text
                           ELSE 'ORDINE'::text
                       END)::character varying AS origine,
                   r.fatturabile,
                   r.consegnato,
                   COALESCE(res.reso, (0)::numeric) AS reso,
                   r.in_riconsegna,
                   v.tenuti,
                   COALESCE(fd.quantita, (0)::numeric) AS fatturato_merce,
                   COALESCE(al.fatturato_da_ordine, (0)::numeric) AS fatturato_da_ordine,
                   v.fatturato,
                   v.misurabile,
                       CASE
                           WHEN (w.conta_fatturazione AND v.misurabile AND ((NOT r.e_riconsegna) OR (r.quota_nuova > (0)::numeric))) THEN w.saldo
                           ELSE NULL::numeric
                       END AS differenza,
                   (
                       CASE
                           WHEN (r.e_riconsegna AND (r.quota_nuova <= (0)::numeric)) THEN 'RICONSEGNA'::text
                           WHEN (NOT w.conta_fatturazione) THEN 'NON_FATTURABILE'::text
                           WHEN (NOT v.misurabile) THEN 'NON_MISURABILE'::text
                           WHEN (w.saldo > (0)::numeric) THEN 'DA_FATTURARE'::text
                           WHEN (w.saldo < (0)::numeric) THEN 'DA_ACCREDITARE'::text
                           ELSE 'PAREGGIATA'::text
                       END)::character varying AS stato,
                   r.e_riconsegna,
                   (sos.ddt_riga_id IS NOT NULL) AS sospetto_duplicato_ordine,
                   COALESCE(fr.quantita, (0)::numeric) AS rettificato,
                   r.quota_nuova AS riconsegna_quota_nuova
                  FROM (((((((((riga r
                    LEFT JOIN orig o ON ((o.ddt_riga_id = r.ddt_riga_id)))
                    LEFT JOIN vendite.ordini_righe orr ON ((orr.id = o.ordine_riga_id)))
                    LEFT JOIN res ON ((res.ddt_riga_id = r.ddt_riga_id)))
                    LEFT JOIN sospetto sos ON ((sos.ddt_riga_id = r.ddt_riga_id)))
                    LEFT JOIN alloc al ON ((al.ddt_riga_id = r.ddt_riga_id)))
                    LEFT JOIN af fd ON ((((fd.corsia)::text = 'DDT'::text) AND (fd.riga_id = r.ddt_riga_id) AND ((fd.tipo_movimento)::text = 'NORMALE'::text))))
                    LEFT JOIN af fr ON ((((fr.corsia)::text = 'DDT'::text) AND (fr.riga_id = r.ddt_riga_id) AND ((fr.tipo_movimento)::text = 'RETTIFICA'::text))))
                    CROSS JOIN LATERAL ( SELECT (r.consegnato - COALESCE(res.reso, (0)::numeric)) AS tenuti,
                           ((COALESCE(fd.quantita, (0)::numeric) + COALESCE(al.fatturato_da_ordine, (0)::numeric)) + COALESCE(fr.quantita, (0)::numeric)) AS fatturato,
                           (COALESCE(fd.misurabile, true) AND COALESCE(al.ord_misurabile, true) AND COALESCE(fr.misurabile, true)) AS misurabile) v)
                    CROSS JOIN LATERAL ( SELECT (r.fatturabile OR (v.fatturato > (0)::numeric)) AS conta_fatturazione,
                           (v.tenuti - v.fatturato) AS saldo) w)
                 WHERE (((fn_partite_merce.p_ddt_ids IS NULL) AND (fn_partite_merce.p_ordine_ids IS NULL)) OR (r.ddt_id = ANY (fn_partite_merce.p_ddt_ids)) OR (orr.ordine_id = ANY (fn_partite_merce.p_ordine_ids)));
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_partite_merce(bigint[], bigint[]) IS
                'LA PARTITA DI MERCE PER DOCUMENTO (D14, quarta leva, 2026-09-21): lo stesso conto di vendite.vw_partite_merce — che ne e'' la proiezione senza filtro, fn_partite_merce(NULL, NULL) — ristretto alla CHIUSURA dei documenti chiesti. Semi: p_ddt_ids (i DDT) e p_ordine_ids (gli ordini: le righe che li evadono); entrambi NULL = tutte le partite; un array VUOTO semina zero righe. Con entrambi valorizzati l''uscita e'' l''unione: ddt_id nei DDT chiesti OR ordine_id negli ordini chiesti — e `ordine_id` e'' la colonna PROIETTATA (min(ordine_riga_id) di `orig`), quindi una riga MULTIPLA esce sotto l''ordine della riga minima, come la legge il backend. La chiusura: R0 = righe dei semi; R1 = righe che condividono con una di R0 la riga d''ordine di `orig` (la partizione della greedy `alloc` e'' completa); O = R0 ∪ R1 ∪ le origini di ri-consegna (la finestra di `migra` e'' intera). Equivalente alla vista per costruzione: ogni colonna dipende solo da cio'' che la chiusura conserva. ⛔ Chi aggiunge una finestra o un insieme con una chiave nuova (articolo, cliente, commessa) DEVE allargare la chiusura, o la funzione sbaglia SOLO con un seme e la vista resta giusta: il presidio e'' test-fn-partite-merce-chiusura-v1, a casi costruiti. `af` (fn_af_merce_per_riga) e'' letta PER CHIAVE dal giro 4 (D5, 2026-09-21): le chiavi DDT delle origini O e le chiavi ORD dei fulfillment della chiusura, chiave BASE (i suffissi #RET/#CMP li risolve la funzione); la chiave ORD nasce dall''uid dell''ordine, letto sotto RLS — ordine e commessa devono stare nello stesso perimetro, e il BA li tiene insieme. BEGIN ATOMIC: le dipendenze sono in pg_depend (rinomina a monte rifiutata; catena RLS leggibile dal presidio security_invoker). I due modi sono rami in UNION ALL, mai `p IS NULL OR col = ANY(p)`: in piano generico quell''OR e'' una scansione intera sotto policy. INVOKER: la RLS resta di chi legge. Chiamanti per documento: fn_list_ddt_da_pushare, fn_ddt_push_diagnosi, BE list_partite_merce. Brief: brief-db-partita-merce-per-documento. ⚠️ rev 2026-09-22 (giro 8 RITIRATO, brief §16.7): la catena del sospetto era stata seminata da `riga`; come app la diagnosi «tutte» e'' passata da 63 a 90 ms e la vista intera da 47 a 78, perche'' il planner ha cambiato il piano di `riga` (da Index Scan sulla PK di ddt a Seq Scan per riga). Ripristinata la forma del 20260921-53. ⛔ La catena resta il pezzo piu'' caro della partita (17,6 ms su 46, zero righe): il perche'' e'' sul modello — riempie la sola colonna sospetto_duplicato_ordine, un avviso per una PERSONA — ma la cura non e'' quella provata, e il banco di prova (corpo eseguito come query) NON predice il piano dentro la funzione. rev 2026-10-12 (20261012-32, brief-db-date-consegna-righe-in-blocco §4.1, regola del 2, scelta (a) di Tid): «merce partita» dal BB script.vw_stati_doc_ddt_merce_partita in `riga` (filtro) e in `ponte_riga` (emesso), al posto della CTE `soglia` con l''espressione scritta qui; la stessa regola viveva anche in vendite.fn_ordine_riga_spedita e in dbops.vw_ddt_emessi_senza_scarico. Uscita identica (EXCEPT ALL a zero nei due versi, prova pre-apply). Cambio di significato solo dove il modello lo ammette e i dati non lo producono: una ri-consegna in uno stato abortito (l''annullo ritira i legami, quindi non dovrebbe esistere) conta come in_riconsegna invece che riconsegnata, e uno stato con ordine NULL non fa piu'' sparire la quantita''. Commento: gli apostrofi raddoppiati due volte nella nota del 2026-09-22 tornano singoli.';
