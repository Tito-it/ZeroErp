# vendite.fn_contratto_righe_preview: la riga AGGIUNTA esce nella SUA UdM, e ogni
# riga porta ordine e uom_operativa_id della riga di contratti_righe.
#   Brief: brief-db-liste-righe-documento, sezione 9.11 (R-D1, R-D2)
#
# -- IL PROBLEMA (letto sul modello, non sui dati) ---------------------
#   · R-D1 🔴: le parti 2a/2b proiettavano a.uom_id / um.codice, l'UdM
#     dell'ARTICOLO, e non cr.uom_operativa_id, quella in cui la riga e'
#     quotata e quantificata (il form la sceglie fra le UdM operative). A
#     video, nell'export e in stampa quantita' e prezzo uscivano accanto a
#     un'UdM non loro; e il form di modifica, che legge
#     uom_operativa_id ?? uom_id, al primo «Salva» riscriveva la riga
#     nell'UdM dell'articolo, in silenzio. Stesso difetto nel jsonb dei
#     componenti di un bundle AGGIUNTA: af.uom_id invece di
#     crc.uom_operativa_id (NOT NULL), l'UdM in cui e' quotato il loro prezzo;
#   · R-D2: il form rimanda al PATCH anche ordine e uom_operativa_id, che la
#     funzione non esponeva: ripiegava su ordine = 10 (l'ordine azzerato a
#     ogni modifica) e indovinava l'UdM di un'eccezione.
#
# -- COSA CAMBIA ------------------------------------------------------
#   · 2a/2b: uom_id = COALESCE(cr.uom_operativa_id, a.uom_id), e il codice
#     della stessa. ⭐ NULL = l'UdM base dell'articolo: e' il ripiego che fa
#     gia' script.trgfn_qta_from_operativa su ogni scrittura con quantita';
#     NULL resta solo quando qta_operativa e' NULL (fonte non FISSA), e li'
#     la riga non ha scelto un'UdM. Un vincolo che lo escludesse sarebbe un
#     cantiere sulla tabella, non su questa lettura;
#   · componenti di un bundle AGGIUNTA: 'uom_id'/'uom_codice' da
#     crc.uom_operativa_id. I componenti del LISTINO (parte 1, dal core
#     fn_espandi_listino_versione) non si toccano;
#   · due colonne IN CODA: ordine, uom_operativa_id (vuote sulle DA_LISTINO,
#     che una riga di contratti_righe non ce l'hanno). Le 22 di prima
#     identiche, nello stesso ordine. riga_key non cambia ('L:<art>:<uom>'
#     resta l'UdM del listino; 'A:<id>' non porta l'UdM).
#
# -- FORMA -------------------------------------------------------------
#   · RETURNS TABLE cambia: DROP + CREATE + GRANT EXECUTE all'app. Nessuna
#     vista ne' funzione dipende; i pgTAP che la nominano controllano la
#     presenza di colonne, non il loro numero;
#   · firma e RETURNS TABLE scritti dal generatore, ancorati (%TYPE) anche
#     nel COMMENT, nel DROP e nel GRANT; tipi espliciti solo sui valori
#     calcolati, scritto accanto. tipo_eccezione ancorata alla colonna
#     (prima: il nome del tipo enum, stessa identita');
#   · SECURITY INVOKER reso esplicito, senza cambio;
#   · il corpo e' quello vivo (doc auto-gen, verificato identico al -53),
#     patchato con sostituzioni contate: nessun'altra riga toccata.
#
# -- RICADUTE ---------------------------------------------------------
#   · BE: nessuna modifica (repository e lista leggono v.*); il contesto di
#     stampa del contratto passa la riga intera, quindi vi compaiono due
#     chiavi nuove che nessun template legge, e l'UdM stampata delle
#     AGGIUNTA diventa quella giusta (e' la correzione);
#   · FE (lotto D): il form legge uom_operativa_id e ordine dalla riga.
#
# Verifica: db/pgtap/vendite/test-contratto-righe-lista-uom-riga-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261004-01-update-fn-contratto-righe-preview-uom-e-ordine-della-riga-mctit.yaml

  - changeSet:
      id: 20261004-01-update-fn-contratto-righe-preview-uom-e-ordine-della-riga
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_contratto_righe_preview: le AGGIUNTA (e i componenti di un bundle AGGIUNTA)
        escono nell'UdM della riga, non dell'articolo; in coda ordine e uom_operativa_id
        della riga di contratti_righe, che il form di modifica rimanda al PATCH.
        RETURNS TABLE cambiato: DROP + CREATE. Brief: brief-db-liste-righe-documento (9.11).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ RETURNS TABLE cambia (due colonne in coda): CREATE OR REPLACE non lo
              --    ammette, quindi DROP + CREATE. Nessuna vista ne' funzione dipende dalla
              --    funzione (la leggono il repository, il contesto di stampa e i pgTAP):
              --    il DROP non trascina niente.
              DROP FUNCTION vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE);

              CREATE FUNCTION vendite.fn_contratto_righe_preview(
                  p_contratto_id vendite.contratti.id%TYPE
              )
              RETURNS TABLE (
                  articolo_id          catalogo.articoli.id%TYPE,
                  articolo_codice      catalogo.articoli.codice%TYPE,
                  articolo_descrizione catalogo.articoli.descrizione%TYPE,
                  is_composito         catalogo.articoli.is_composito%TYPE,
                  uom_id               vendite.listini_righe.uom_id%TYPE,
                  uom_codice           catalogo.unita_misura.codice%TYPE,
                  prezzo_listino       vendite.listini_righe.prezzo%TYPE,
                  tipo_variazione      vendite.contratti.tipo_variazione_globale%TYPE,
                  valore_variazione    vendite.contratti.valore_variazione_globale%TYPE,
                  override_riga_id     vendite.contratti_righe.id%TYPE,
                  override_prezzo      vendite.contratti_righe.prezzo_unitario%TYPE,
                  tipo_eccezione       vendite.contratti_righe.tipo_eccezione%TYPE,
                  -- Tipo esplicito: valore CALCOLATO (DA_LISTINO | OVERRIDE | ESCLUSIONE |
                  -- AGGIUNTA), nessuna colonna di cui sia il riflesso.
                  origine              varchar,
                  prezzo_finale        vendite.listini_righe.prezzo%TYPE,
                  -- Tipo esplicito: aggregato calcolato (i componenti del bundle).
                  componenti           jsonb,
                  quantita             vendite.contratti_righe.quantita%TYPE,
                  qta_operativa        vendite.contratti_righe.qta_operativa%TYPE,
                  tipo_erogazione      vendite.contratti_righe.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.contratti_righe.fonte_quantita_attesa%TYPE,
                  -- ── in coda dal 2026-09-28 (D-8.4) ──────────────────────────────
                  -- Tipi espliciti: chiave composta, verbi e reason CALCOLATI.
                  riga_key             text,
                  azioni               text[],
                  escludi_blocco_codice text,
                  -- ── in coda dal 2026-10-04 (§9.11, R-D2) ────────────────────────
                  ordine               vendite.contratti_righe.ordine%TYPE,
                  uom_operativa_id     vendite.contratti_righe.uom_operativa_id%TYPE
              )
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$

              -- Scopo: righe drawer ContrattoRigheDrawer (output invariato).
              -- Parte 1: core fn_espandi_listino_versione (standalone+bundle) +
              --   overlay OVERRIDE/ESCLUSIONE via LEFT JOIN contratti_righe.
              -- Parte 2: AGGIUNTA standalone+bundle da contratti_righe/_componenti.
              -- Versione operativa: snapshot se ATTIVO, altrimenti lookup ATTIVA/CHIUSA.
              -- rev 2026-09-28 (brief-db-liste-righe-documento, D-8.4): la funzione e' la
              --   SORGENTE della lista vendite.contratto_righe, per le due forme del
              --   contratto. Tre colonne in coda:
              --   · riga_key: 'L:<articolo>:<uom>' per le righe del listino (uniche per
              --     versione, articolo, UoM), 'A:<id>' per le AGGIUNTA (la loro riga);
              --   · azioni: i verbi che l'origine ammette (SOVRASCRIVI_PREZZO, ESCLUDI,
              --     MODIFICA, RIPRISTINA_LISTINO, RIPRISTINA_ARTICOLO, RIMUOVI);
              --   · escludi_blocco_codice: il reason del PRIMO motivo di
              --     script.fn_check_esclusione_articolo_contratto, NULL = ammesso. Lo
              --     stesso predicato del guard: pulsante ed errore non divergono.
              --   ⚠️ Il blocco «fuori bozza» NON e' qui: e' di documento
              --     (trgfn_doc_righe_lock_fuori_bozza, capability del contratto).
              -- rev 2026-10-04 (brief-db-liste-righe-documento §9.11):
              --   · R-D1: l'UdM di una AGGIUNTA e' quella della RIGA (uom_operativa_id),
              --     non quella dell'articolo: quantita' e prezzo sono quotati li'.
              --     NULL = l'UdM base dell'articolo, lo stesso ripiego di
              --     script.trgfn_qta_from_operativa (NULL resta solo se qta_operativa e'
              --     NULL, cioe' fonte non FISSA). Idem per i componenti di un bundle
              --     AGGIUNTA: contratti_righe_componenti.uom_operativa_id (NOT NULL);
              --   · R-D2: due colonne in coda, ordine e uom_operativa_id della riga di
              --     contratti_righe (NULL sulle righe DA_LISTINO, che non ne hanno una):
              --     il form di modifica le rimanda al PATCH, e non deve indovinarle.
              DECLARE
                  v_listino_id          vendite.contratti.listino_id%TYPE;
                  v_listino_versione_id vendite.contratti.listino_versione_id%TYPE;
                  v_tipo_var            vendite.contratti.tipo_variazione_globale%TYPE;
                  v_valore_var          vendite.contratti.valore_variazione_globale%TYPE;
              BEGIN
                  SELECT c.listino_id, c.listino_versione_id,
                         c.tipo_variazione_globale, c.valore_variazione_globale
                    INTO v_listino_id, v_listino_versione_id, v_tipo_var, v_valore_var
                    FROM vendite.contratti c
                   WHERE c.id = p_contratto_id;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- Versione operativa per contratti DRAFT senza snapshot (BOZZA esclusa).
                  IF v_listino_id IS NOT NULL AND v_listino_versione_id IS NULL THEN
                      -- rev 2026-09-28: la sede unica (brief-db-liste-righe-documento §8.15).
              v_listino_versione_id := vendite.fn_listino_versione_in_vigore(v_listino_id, CURRENT_DATE);
                  END IF;

                  -- PARTE 1: righe dal listino (core) + overlay eccezioni OVERRIDE/ESCLUSIONE.
                  IF v_listino_versione_id IS NOT NULL THEN
                      RETURN QUERY
                      SELECT
                          base.articolo_id,
                          base.articolo_codice,
                          base.articolo_descrizione,
                          base.is_composito,
                          base.uom_id,
                          base.uom_codice,
                          base.prezzo_listino,
                          v_tipo_var,
                          v_valore_var,
                          cr.id,
                          cr.prezzo_unitario,
                          cr.tipo_eccezione,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN 'OVERRIDE'
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN 'ESCLUSIONE'
                              ELSE                                       'DA_LISTINO'
                          END::varchar,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN cr.prezzo_unitario
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN NULL
                              ELSE                                       base.prezzo_da_listino
                          END,
                          base.componenti,
                          cr.quantita,
                          cr.qta_operativa,
                          cr.tipo_erogazione,
                          cr.fonte_quantita_attesa,
                          ('L:' || base.articolo_id::text || ':' || base.uom_id::text),
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'
                                  THEN ARRAY['MODIFICA', 'RIPRISTINA_LISTINO']
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE'
                                  THEN ARRAY['MODIFICA', 'RIPRISTINA_ARTICOLO']
                              ELSE ARRAY['SOVRASCRIVI_PREZZO', 'ESCLUDI']
                          END,
                          -- Solo dove «Escludi» e' un'azione della riga (dal listino).
                          CASE
                              WHEN cr.tipo_eccezione IS NULL
                                  THEN script.fn_check_esclusione_articolo_contratto(
                                           p_contratto_id, base.articolo_id) -> 0 ->> 'reason'
                          END,
                          cr.ordine,
                          cr.uom_operativa_id
                        FROM vendite.fn_espandi_listino_versione(
                                 v_listino_versione_id, v_tipo_var, v_valore_var
                             ) base
                        LEFT JOIN vendite.contratti_righe cr
                               ON cr.contratto_id           = p_contratto_id
                              AND cr.articolo_id            = base.articolo_id
                              AND cr.tipo_eccezione         IN (
                                      'OVERRIDE'::vendite.tipo_eccezione_contratto,
                                      'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                                  )
                              AND COALESCE(cr.attivo, TRUE) = TRUE;
                  END IF;

                  -- PARTE 2a: AGGIUNTA standalone (non in listino). JOIN diretto.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, FALSE,
                      COALESCE(cr.uom_operativa_id, a.uom_id), um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario, NULL::jsonb,
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa,
                      ('A:' || cr.id::text), ARRAY['MODIFICA', 'RIMUOVI'], NULL::text,
                      cr.ordine, cr.uom_operativa_id
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = FALSE AND a.attivo = TRUE
                    -- R-D1: l'UdM della riga; NULL = la base dell'articolo.
                    JOIN catalogo.unita_misura um ON um.id = COALESCE(cr.uom_operativa_id, a.uom_id)
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;

                  -- PARTE 2b: AGGIUNTA bundle (non in listino). Componenti da contratti_righe_componenti.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, TRUE,
                      COALESCE(cr.uom_operativa_id, a.uom_id), um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario,
                      (
                          SELECT jsonb_agg(jsonb_build_object(
                              'articolo_componente_id', ac.id,
                              'componente_id',          af.id,
                              'componente_codice',      af.codice,
                              'componente_descrizione', af.descrizione,
                              'uom_id',                 crc.uom_operativa_id,
                              'uom_codice',             umf.codice,
                              'coeff_qta',              crc.coeff_qta_snapshot,
                              'prezzo',                 crc.prezzo_unitario,
                              'obbligatorio',           ac.obbligatorio,
                              'esposizione_in_fattura', ac.esposizione_in_fattura
                          ) ORDER BY crc.ordine, crc.id)
                            FROM vendite.contratti_righe_componenti crc
                            JOIN catalogo.articoli af ON af.id = crc.componente_id
                            -- R-D1: il prezzo del componente e' quotato nella SUA UdM operativa.
                            JOIN catalogo.unita_misura umf ON umf.id = crc.uom_operativa_id
                            JOIN catalogo.articoli_componenti ac ON ac.id = crc.articolo_componente_id
                           WHERE crc.riga_contratto_id = cr.id
                             AND crc.attivo            = TRUE
                      ),
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa,
                      ('A:' || cr.id::text), ARRAY['MODIFICA', 'RIMUOVI'], NULL::text,
                      cr.ordine, cr.uom_operativa_id
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = TRUE AND a.attivo = TRUE
                    -- R-D1: l'UdM della riga; NULL = la base dell'articolo.
                    JOIN catalogo.unita_misura um ON um.id = COALESCE(cr.uom_operativa_id, a.uom_id)
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_contratto_righe_preview(p_contratto_id vendite.contratti.id%TYPE)
              IS 'Le righe OPERATIVE di un contratto: parte 1 dal listino (core fn_espandi_listino_versione, standalone e bundle) con l''overlay delle eccezioni OVERRIDE/ESCLUSIONE; parte 2 le AGGIUNTA (standalone e bundle, componenti da contratti_righe_componenti). Versione del listino: fissata se il contratto e'' attivo, altrimenti la ATTIVA/CHIUSA valida oggi. ⭐ Dal 2026-09-28 (brief-db-liste-righe-documento, D-8.4) e'' la SORGENTE della lista configurabile vendite.contratto_righe, per le due forme del contratto (senza listino restano le sole AGGIUNTA), e porta tre colonne in coda: riga_key (L:<articolo>:<uom> per le righe del listino, A:<id> per le aggiunte: la chiave che prima il frontend inventava), azioni (i verbi che l''origine ammette: DA_LISTINO -> SOVRASCRIVI_PREZZO, ESCLUDI; OVERRIDE -> MODIFICA, RIPRISTINA_LISTINO; ESCLUSIONE -> MODIFICA, RIPRISTINA_ARTICOLO; AGGIUNTA -> MODIFICA, RIMUOVI) e escludi_blocco_codice (il reason del primo motivo di script.fn_check_esclusione_articolo_contratto, NULL = «Escludi» ammesso: lo stesso predicato del guard). Il blocco «fuori bozza» non e'' qui: e'' di documento. 24 colonne. rev 2026-10-01: nel jsonb componenti la chiave esposto_in_fattura diventa esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO) (brief-db-esposizione-componenti-kit-in-fattura). rev 2026-10-04 (brief-db-liste-righe-documento, sezione 9.11): le AGGIUNTA escono nell''UdM della RIGA (uom_operativa_id; NULL = la base dell''articolo, come trgfn_qta_from_operativa), e i componenti di un bundle AGGIUNTA nella loro; in coda ordine e uom_operativa_id della riga di contratti_righe (NULL sulle DA_LISTINO), che il form di modifica rimanda al PATCH.';

              -- ⚠️ Il DROP cancella i privilegi dati alla funzione: l'EXECUTE all'app si
              --    ridichiara. Nessun GRANT ai ruoli batch (provisioning, §11.6).
              GRANT EXECUTE ON FUNCTION vendite.fn_contratto_righe_preview(p_contratto_id vendite.contratti.id%TYPE)
                  TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Ripristino del -53: RETURNS TABLE a 22 colonne, quindi DROP + CREATE.
              DROP FUNCTION vendite.fn_contratto_righe_preview(vendite.contratti.id%TYPE);

              CREATE FUNCTION vendite.fn_contratto_righe_preview(
                  p_contratto_id vendite.contratti.id%TYPE
              )
              RETURNS TABLE (
                  articolo_id          catalogo.articoli.id%TYPE,
                  articolo_codice      catalogo.articoli.codice%TYPE,
                  articolo_descrizione catalogo.articoli.descrizione%TYPE,
                  is_composito         catalogo.articoli.is_composito%TYPE,
                  uom_id               vendite.listini_righe.uom_id%TYPE,
                  uom_codice           catalogo.unita_misura.codice%TYPE,
                  prezzo_listino       vendite.listini_righe.prezzo%TYPE,
                  tipo_variazione      vendite.contratti.tipo_variazione_globale%TYPE,
                  valore_variazione    vendite.contratti.valore_variazione_globale%TYPE,
                  override_riga_id     vendite.contratti_righe.id%TYPE,
                  override_prezzo      vendite.contratti_righe.prezzo_unitario%TYPE,
                  tipo_eccezione       vendite.tipo_eccezione_contratto,
                  -- Tipi espliciti, qui e sotto: valori CALCOLATI, nessuna colonna di cui
                  -- siano il riflesso.
                  origine              varchar,
                  prezzo_finale        vendite.listini_righe.prezzo%TYPE,
                  componenti           jsonb,
                  quantita             vendite.contratti_righe.quantita%TYPE,
                  qta_operativa        vendite.contratti_righe.qta_operativa%TYPE,
                  tipo_erogazione      vendite.contratti_righe.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.contratti_righe.fonte_quantita_attesa%TYPE,
                  -- ── in coda dal 2026-09-28 (D-8.4) ──────────────────────────────
                  riga_key             text,
                  azioni               text[],
                  escludi_blocco_codice text
              )
               LANGUAGE plpgsql
               STABLE
              AS $function$

              -- Scopo: righe drawer ContrattoRigheDrawer (output invariato).
              -- Parte 1: core fn_espandi_listino_versione (standalone+bundle) +
              --   overlay OVERRIDE/ESCLUSIONE via LEFT JOIN contratti_righe.
              -- Parte 2: AGGIUNTA standalone+bundle da contratti_righe/_componenti.
              -- Versione operativa: snapshot se ATTIVO, altrimenti lookup ATTIVA/CHIUSA.
              -- rev 2026-09-28 (brief-db-liste-righe-documento, D-8.4): la funzione e' la
              --   SORGENTE della lista vendite.contratto_righe, per le due forme del
              --   contratto. Tre colonne in coda:
              --   · riga_key: 'L:<articolo>:<uom>' per le righe del listino (uniche per
              --     versione, articolo, UoM), 'A:<id>' per le AGGIUNTA (la loro riga);
              --   · azioni: i verbi che l'origine ammette (SOVRASCRIVI_PREZZO, ESCLUDI,
              --     MODIFICA, RIPRISTINA_LISTINO, RIPRISTINA_ARTICOLO, RIMUOVI);
              --   · escludi_blocco_codice: il reason del PRIMO motivo di
              --     script.fn_check_esclusione_articolo_contratto, NULL = ammesso. Lo
              --     stesso predicato del guard: pulsante ed errore non divergono.
              --   ⚠️ Il blocco «fuori bozza» NON e' qui: e' di documento
              --     (trgfn_doc_righe_lock_fuori_bozza, capability del contratto).
              DECLARE
                  v_listino_id          vendite.contratti.listino_id%TYPE;
                  v_listino_versione_id vendite.contratti.listino_versione_id%TYPE;
                  v_tipo_var            vendite.contratti.tipo_variazione_globale%TYPE;
                  v_valore_var          vendite.contratti.valore_variazione_globale%TYPE;
              BEGIN
                  SELECT c.listino_id, c.listino_versione_id,
                         c.tipo_variazione_globale, c.valore_variazione_globale
                    INTO v_listino_id, v_listino_versione_id, v_tipo_var, v_valore_var
                    FROM vendite.contratti c
                   WHERE c.id = p_contratto_id;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- Versione operativa per contratti DRAFT senza snapshot (BOZZA esclusa).
                  IF v_listino_id IS NOT NULL AND v_listino_versione_id IS NULL THEN
                      -- rev 2026-09-28: la sede unica (brief-db-liste-righe-documento §8.15).
              v_listino_versione_id := vendite.fn_listino_versione_in_vigore(v_listino_id, CURRENT_DATE);
                  END IF;

                  -- PARTE 1: righe dal listino (core) + overlay eccezioni OVERRIDE/ESCLUSIONE.
                  IF v_listino_versione_id IS NOT NULL THEN
                      RETURN QUERY
                      SELECT
                          base.articolo_id,
                          base.articolo_codice,
                          base.articolo_descrizione,
                          base.is_composito,
                          base.uom_id,
                          base.uom_codice,
                          base.prezzo_listino,
                          v_tipo_var,
                          v_valore_var,
                          cr.id,
                          cr.prezzo_unitario,
                          cr.tipo_eccezione,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN 'OVERRIDE'
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN 'ESCLUSIONE'
                              ELSE                                       'DA_LISTINO'
                          END::varchar,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN cr.prezzo_unitario
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN NULL
                              ELSE                                       base.prezzo_da_listino
                          END,
                          base.componenti,
                          cr.quantita,
                          cr.qta_operativa,
                          cr.tipo_erogazione,
                          cr.fonte_quantita_attesa,
                          ('L:' || base.articolo_id::text || ':' || base.uom_id::text),
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'
                                  THEN ARRAY['MODIFICA', 'RIPRISTINA_LISTINO']
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE'
                                  THEN ARRAY['MODIFICA', 'RIPRISTINA_ARTICOLO']
                              ELSE ARRAY['SOVRASCRIVI_PREZZO', 'ESCLUDI']
                          END,
                          -- Solo dove «Escludi» e' un'azione della riga (dal listino).
                          CASE
                              WHEN cr.tipo_eccezione IS NULL
                                  THEN script.fn_check_esclusione_articolo_contratto(
                                           p_contratto_id, base.articolo_id) -> 0 ->> 'reason'
                          END
                        FROM vendite.fn_espandi_listino_versione(
                                 v_listino_versione_id, v_tipo_var, v_valore_var
                             ) base
                        LEFT JOIN vendite.contratti_righe cr
                               ON cr.contratto_id           = p_contratto_id
                              AND cr.articolo_id            = base.articolo_id
                              AND cr.tipo_eccezione         IN (
                                      'OVERRIDE'::vendite.tipo_eccezione_contratto,
                                      'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                                  )
                              AND COALESCE(cr.attivo, TRUE) = TRUE;
                  END IF;

                  -- PARTE 2a: AGGIUNTA standalone (non in listino). JOIN diretto.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, FALSE,
                      a.uom_id, um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario, NULL::jsonb,
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa,
                      ('A:' || cr.id::text), ARRAY['MODIFICA', 'RIMUOVI'], NULL::text
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = FALSE AND a.attivo = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;

                  -- PARTE 2b: AGGIUNTA bundle (non in listino). Componenti da contratti_righe_componenti.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, TRUE,
                      a.uom_id, um.codice,
                      NULL::numeric, NULL::varchar, NULL::numeric,
                      cr.id, cr.prezzo_unitario, cr.tipo_eccezione,
                      'AGGIUNTA'::varchar, cr.prezzo_unitario,
                      (
                          SELECT jsonb_agg(jsonb_build_object(
                              'articolo_componente_id', ac.id,
                              'componente_id',          af.id,
                              'componente_codice',      af.codice,
                              'componente_descrizione', af.descrizione,
                              'uom_id',                 af.uom_id,
                              'uom_codice',             umf.codice,
                              'coeff_qta',              crc.coeff_qta_snapshot,
                              'prezzo',                 crc.prezzo_unitario,
                              'obbligatorio',           ac.obbligatorio,
                              'esposizione_in_fattura', ac.esposizione_in_fattura
                          ) ORDER BY crc.ordine, crc.id)
                            FROM vendite.contratti_righe_componenti crc
                            JOIN catalogo.articoli af ON af.id = crc.componente_id
                            JOIN catalogo.unita_misura umf ON umf.id = af.uom_id
                            JOIN catalogo.articoli_componenti ac ON ac.id = crc.articolo_componente_id
                           WHERE crc.riga_contratto_id = cr.id
                             AND crc.attivo            = TRUE
                      ),
                      cr.quantita, cr.qta_operativa, cr.tipo_erogazione, cr.fonte_quantita_attesa,
                      ('A:' || cr.id::text), ARRAY['MODIFICA', 'RIMUOVI'], NULL::text
                    FROM vendite.contratti_righe cr
                    JOIN catalogo.articoli a
                      ON a.id = cr.articolo_id AND a.is_composito = TRUE AND a.attivo = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                   WHERE cr.contratto_id          = p_contratto_id
                     AND cr.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(cr.attivo, TRUE) = TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_contratto_righe_preview(p_contratto_id vendite.contratti.id%TYPE)
              IS 'Le righe OPERATIVE di un contratto: parte 1 dal listino (core fn_espandi_listino_versione, standalone e bundle) con l''overlay delle eccezioni OVERRIDE/ESCLUSIONE; parte 2 le AGGIUNTA (standalone e bundle, componenti da contratti_righe_componenti). Versione del listino: fissata se il contratto e'' attivo, altrimenti la ATTIVA/CHIUSA valida oggi. ⭐ Dal 2026-09-28 (brief-db-liste-righe-documento, D-8.4) e'' la SORGENTE della lista configurabile vendite.contratto_righe, per le due forme del contratto (senza listino restano le sole AGGIUNTA), e porta tre colonne in coda: riga_key (L:<articolo>:<uom> per le righe del listino, A:<id> per le aggiunte: la chiave che prima il frontend inventava), azioni (i verbi che l''origine ammette: DA_LISTINO -> SOVRASCRIVI_PREZZO, ESCLUDI; OVERRIDE -> MODIFICA, RIPRISTINA_LISTINO; ESCLUSIONE -> MODIFICA, RIPRISTINA_ARTICOLO; AGGIUNTA -> MODIFICA, RIMUOVI) e escludi_blocco_codice (il reason del primo motivo di script.fn_check_esclusione_articolo_contratto, NULL = «Escludi» ammesso: lo stesso predicato del guard). Il blocco «fuori bozza» non e'' qui: e'' di documento. 22 colonne. rev 2026-10-01: nel jsonb componenti la chiave esposto_in_fattura diventa esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO) (brief-db-esposizione-componenti-kit-in-fattura).';

              GRANT EXECUTE ON FUNCTION vendite.fn_contratto_righe_preview(p_contratto_id vendite.contratti.id%TYPE)
                  TO zeroerp_app;
