# IL COMMENT DELLA SUPERFICIE DELLE VERSIONI DI LISTINO: LA VARIAZIONE HA UN VERBO
#   Brief: brief-db-stati-documento-dal-vocabolario, dopo il giro 6f-ter
#   (richiesta del BE del 2026-11-15; via di Tid lo stesso giorno).
#
#   variazione_blocco_* diceva che la variazione la rifiuta il guard delle
#   righe, riga per riga: dal 20261115-79 la rifiuta il suo verbo, dalla
#   versione, anche a righe zero. La vista non cambia; cambia il COMMENT. Il
#   rollback porta quello del 20261115-72.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-81-comment-vw-listini-versioni-azioni-verbo-variazione-mctit.yaml

  - changeSet:
      id: 20261115-81-comment-vw-listini-versioni-azioni-verbo-variazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di vendite.vw_listini_versioni_azioni: variazione_blocco_* e' il motivo del verbo della variazione.
        Brief: brief-db-stati-documento-dal-vocabolario, dopo il giro 6f-ter.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_listini_versioni_azioni
              IS 'Le azioni di riga delle versioni di listino: una riga per versione (versione_id, listino_id). attivazione_blocco_reason / attivazione_blocco_reason_key: il primo motivo di script.fn_check_versione_listino_attivabile (la stessa fn_check che vendite.fn_attiva_versione_listino e il guard di transizione sollevano; NULL = niente vieta l''attivazione). eliminazione_blocco_reason / eliminazione_blocco_reason_key: il primo motivo di script.fn_check_versione_listino_eliminabile (la stessa che vendite.fn_elimina_versione_listino e il guard per stato sollevano: non in bozza, citata da un documento; NULL = si elimina). chiusura_blocco_reason / chiusura_blocco_reason_key: il primo motivo di script.fn_check_versione_listino_chiudibile senza data (non ATTIVA; NULL = «Chiudi» acceso; la fine nel passato la giudica vendite.fn_programma_chiusura_versione_listino con la data scelta). Le scritture della versione si fanno solo in bozza: il primo motivo di script.fn_check_listino_riga_scrivibile senza riga (VERSIONE_CHIUSA, VERSIONE_NON_IN_BOZZA; NULL = si scrive), in quattro azioni con le loro colonne: aggiunta_riga_blocco_reason / _key (una riga nuova, il guard vendite.trgfn_listini_righe_guard_stato), variazione_blocco_reason / _key (la variazione percentuale dei prezzi delle righe, il verbo vendite.fn_varia_prezzi_versione_listino, che la giudica dalla versione anche a righe zero), prezzi_bundle_blocco_reason / _key (i prezzi dei componenti dei kit, il guard vendite.trgfn_listini_righe_comp_guard_immutabilita_v5), periodicita_kit_blocco_reason / _key (la periodicita'' dei kit, il guard vendite.trgfn_listini_kit_guard). Il prezzo di una riga della versione in vigore si rettifica: la superficie e'' vendite.vw_listini_righe_azioni. «Clona» non ha colonne: si clona da qualunque stato. Lo stato non c''e'': chi puo'' attivare da quale stato lo dice la riga lista (script.fn_doc_azioni_permesse). E'' la superficie delle azioni ATTIVA_VERSIONE_LISTINO, ELIMINA_VERSIONE_LISTINO, CHIUDI_VERSIONE_LISTINO, AGGIUNGI_RIGA_LISTINO, VARIA_PREZZI_LISTINO, PREZZI_BUNDLE_LISTINO e PERIODICITA_KIT_LISTINO nel registro config.azioni_riga. security_invoker: i soli listini del proprio perimetro. Si filtra per listino_id o versione_id.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_listini_versioni_azioni
              IS 'Le azioni di riga delle versioni di listino: una riga per versione (versione_id, listino_id). attivazione_blocco_reason / attivazione_blocco_reason_key: il primo motivo di script.fn_check_versione_listino_attivabile (la stessa fn_check che vendite.fn_attiva_versione_listino e il guard di transizione sollevano; NULL = niente vieta l''attivazione). eliminazione_blocco_reason / eliminazione_blocco_reason_key: il primo motivo di script.fn_check_versione_listino_eliminabile (la stessa che vendite.fn_elimina_versione_listino e il guard per stato sollevano: non in bozza, citata da un documento; NULL = si elimina). chiusura_blocco_reason / chiusura_blocco_reason_key: il primo motivo di script.fn_check_versione_listino_chiudibile senza data (non ATTIVA; NULL = «Chiudi» acceso; la fine nel passato la giudica vendite.fn_programma_chiusura_versione_listino con la data scelta). Le scritture della versione si fanno solo in bozza: il primo motivo di script.fn_check_listino_riga_scrivibile senza riga (VERSIONE_CHIUSA, VERSIONE_NON_IN_BOZZA; NULL = si scrive), in quattro azioni con le loro colonne: aggiunta_riga_blocco_reason / _key (una riga nuova, il guard vendite.trgfn_listini_righe_guard_stato), variazione_blocco_reason / _key (la variazione percentuale dei prezzi delle righe, lo stesso guard riga per riga), prezzi_bundle_blocco_reason / _key (i prezzi dei componenti dei kit, il guard vendite.trgfn_listini_righe_comp_guard_immutabilita_v5), periodicita_kit_blocco_reason / _key (la periodicita'' dei kit, il guard vendite.trgfn_listini_kit_guard). Il prezzo di una riga della versione in vigore si rettifica: la superficie e'' vendite.vw_listini_righe_azioni. «Clona» non ha colonne: si clona da qualunque stato. Lo stato non c''e'': chi puo'' attivare da quale stato lo dice la riga lista (script.fn_doc_azioni_permesse). E'' la superficie delle azioni ATTIVA_VERSIONE_LISTINO, ELIMINA_VERSIONE_LISTINO, CHIUDI_VERSIONE_LISTINO, AGGIUNGI_RIGA_LISTINO, VARIA_PREZZI_LISTINO, PREZZI_BUNDLE_LISTINO e PERIODICITA_KIT_LISTINO nel registro config.azioni_riga. security_invoker: i soli listini del proprio perimetro. Si filtra per listino_id o versione_id.';
