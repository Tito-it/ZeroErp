# RICONDUZIONE 2/3 (step 2) — il flip a RESO di fn_conferma_reso legge l'helper
#   unico vw_resi_righe_effettive (20260717-07) invece di ripetere la catena di
#   JOIN + il filtro di stato (brief-db-fatturazione-ddt-resi §3b).
#
# CONTINUA 20260717-05 (step 2b): quello ha corretto l'ASSE STATO (le bozze non
# contano piu'); questo chiude la riconduzione portando anche il flip sulla fonte
# unica. Il flip NON applica filtro-tipo (conta tutta la merce tornata, tutti i
# tipi) -> legge la vista senza WHERE aggiuntivo, solo GROUP BY ddt_riga_id.
#
# ⚠️ CAMBIO DI COMPORTAMENTO, VOLUTO E CANONICO: la vista filtra anche
#   `rr.attivo IS TRUE` (20260717-05 aveva solo `= CONFERMATO`, era il perimetro
#   dichiarato dello step 2b). La definizione canonica (§3b) e' CONFERMATI +
#   ATTIVI + tutti i tipi: lo step 2 la completa. In pratica no-op (le righe di un
#   reso CONFERMATO non si disattivano), ma ora corretto per costruzione.
#
# I test 25/26 di test-resi-motore-v1 (caso-bozza del flip) usano resi CONFERMATI
#   ATTIVI -> passano IDENTICI, provando che la riconduzione preserva il
#   comportamento. Il filtro attivo e' coperto dal test dedicato della vista
#   (test-vw-resi-righe-effettive-v1).
#
# Origine: corpo = 20260717-05 (versione viva), con la sola sottoquery del flip
#   sostituita dalla lettura della vista. Firma e SECURITY INVOKER dallo YAML vivo
#   (20260713-31 / 20260717-05).
# Gemella: 20260717-10 (fn_annulla_reso, ri-flip speculare).
# Dipendenze: vendite.vw_resi_righe_effettive (20260717-07).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260717-09-update-fn-conferma-reso-flip-helper-mctit.yaml

  - changeSet:
      id: 20260717-09-update-fn-conferma-reso-flip-helper
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        Il flip DDT->RESO di fn_conferma_reso legge vw_resi_righe_effettive (fonte
        unica, CONFERMATE+attive, tutti i tipi) invece della sottoquery inline.
        Completa la riconduzione (step 2). Comportamento invariato sui casi coperti.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: vendite
            viewName: vw_resi_righe_effettive
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_conferma_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_stato             config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_conf_id     config.stati_doc_reso.id%TYPE;
                  v_ddt_uid           vendite.resi.sorgente_uid%TYPE;
                  v_ddt_id            vendite.ddt.id%TYPE;
                  v_ddt_stato         config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_reso_ddt_id config.stati_doc_ddt.id%TYPE;
                  v_stato_target_id   config.stati_doc_ordini.id%TYPE;
                  v_tutto_reso        boolean;
                  v_ord               RECORD;
              BEGIN
                  -- 1) Guard input + reso in DRAFT + almeno una riga.
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  SELECT sdr.codice_interno, r.sorgente_uid
                    INTO v_stato, v_ddt_uid
                    FROM vendite.resi r
                    JOIN config.stati_doc_reso sdr ON sdr.id = r.stato_doc_reso_id
                   WHERE r.id = p_reso_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  IF v_stato IS DISTINCT FROM 'DRAFT' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_STATO_NON_CONFERMABILE',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_stato),
                          NULL::uuid, p_reso_id::text, v_stato);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM vendite.resi_righe
                                  WHERE reso_id = p_reso_id AND attivo IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_SENZA_RIGHE',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- 2) Transizione a CONFERMATO (gen_numero + guard_transizione).
                  SELECT id INTO v_stato_conf_id FROM config.stati_doc_reso
                   WHERE codice_interno = 'CONFERMATO' AND attivo IS TRUE;
                  UPDATE vendite.resi
                     SET stato_doc_reso_id = v_stato_conf_id
                   WHERE id = p_reso_id;

                  -- 3) Proiezione stato ordine per ogni ordine coinvolto (solo
                  --    righe ri-consegna: quelle che riaprono il residuo).
                  FOR v_ord IN
                      SELECT DISTINCT orr.ordine_id
                        FROM vendite.resi_righe rr
                        JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                        JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                       WHERE rr.reso_id = p_reso_id
                         AND tr.riapre_residuo IS TRUE
                  LOOP
                      IF vendite.fn_ordine_ha_residuo_evasione(v_ord.ordine_id) THEN
                          SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                           WHERE codice_interno = 'PARZIALMENTE_EVASO' AND attivo IS TRUE;
                      ELSE
                          SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                           WHERE codice_interno = 'EVASO' AND attivo IS TRUE;
                      END IF;

                      UPDATE vendite.ordini
                         SET stato_doc_ordine_id = v_stato_target_id
                       WHERE id = v_ord.ordine_id
                         AND stato_doc_ordine_id IS DISTINCT FROM v_stato_target_id;
                  END LOOP;

                  -- 4) Flip DDT origine -> RESO se reso TOTALE (tutte le qta
                  --    consegnate del DDT rese da resi EFFETTIVI). Solo se il
                  --    DDT e' CONSEGNATO (matrice CONSEGNATO->RESO).
                  SELECT d.id, sdd.codice_interno
                    INTO v_ddt_id, v_ddt_stato
                    FROM vendite.ddt d
                    JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                   WHERE d.uid = v_ddt_uid;

                  IF v_ddt_id IS NOT NULL AND v_ddt_stato = 'CONSEGNATO' THEN
                      SELECT bool_and(COALESCE(reso_riga.tot, 0) >= dr.quantita)
                        INTO v_tutto_reso
                        FROM vendite.ddt_righe dr
                        LEFT JOIN (
                            -- rev 2026-07-17 (step 2): fonte unica
                            -- vw_resi_righe_effettive (CONFERMATE + attive, tutti
                            -- i tipi). Il flip non filtra il tipo: conta tutta la
                            -- merce tornata indietro su ogni riga DDT.
                            SELECT e.ddt_riga_id, SUM(e.quantita) AS tot
                              FROM vendite.vw_resi_righe_effettive e
                             GROUP BY e.ddt_riga_id
                        ) reso_riga ON reso_riga.ddt_riga_id = dr.id
                       WHERE dr.ddt_id = v_ddt_id
                         AND dr.attivo IS TRUE;

                      IF COALESCE(v_tutto_reso, false) THEN
                          SELECT id INTO v_stato_reso_ddt_id FROM config.stati_doc_ddt
                           WHERE codice_interno = 'RESO' AND attivo IS TRUE;
                          UPDATE vendite.ddt
                             SET stato_doc_ddt_id = v_stato_reso_ddt_id
                           WHERE id = v_ddt_id;
                      END IF;
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_conferma_reso(p_reso_id bigint)
              IS 'Madre conferma reso: DRAFT->CONFERMATO (numero+guard), proiezione stato ordine (residuo reso-aware -> PARZIALMENTE_EVASO/EVASO), flip DDT origine CONSEGNATO->RESO se reso totale. brief §5. rev 2026-07-13. rev 2026-07-17 (step 2b): il flip conta solo i resi CONFERMATI. rev 2026-07-17 (step 2): il flip legge l helper unico vw_resi_righe_effettive (CONFERMATE+attive, tutti i tipi).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: ripristino non automatizzato (CREATE OR REPLACE).
              -- Riapplicare 20260717-05 per tornare al flip con sottoquery inline
              -- (CONFERMATO, senza filtro attivo).
              SELECT 1;
