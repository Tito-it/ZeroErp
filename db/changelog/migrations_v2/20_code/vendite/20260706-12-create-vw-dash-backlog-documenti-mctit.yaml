# Lente 2 Backlog — lista dei non-collegati azionabili (brief-db §5.2;
# design due-lenti §5, decisioni DL-6/DL-7).
#
# Popolazione: i "fermi" della union (motivo_fermo IS NOT NULL) classificati
# dalla lookup config.motivi_fermo, ESCLUSO il verde FISIOLOGICO. Regola unica
# senza casi speciali per area (DL-7); conseguenze automatiche:
#   - contratti: fuori (tutto FISIOLOGICO finche' manca il push ricorrente);
#   - offerte: solo FIGLIO_ABORTITO (ANOMALIA) e IN_ATTESA_ACCETTAZIONE
#     (SOLLECITO_CLIENTE, filtro dedicato lato FE);
#   - preventivi/ordini/commesse: il loro RECUPERABILE.
#
# ANTI-DRIFT FAIL-VISIBLE (DB-3): LEFT JOIN sulla lookup + COALESCE(classe,
# 'ANOMALIA') — un motivo emesso dalle viste ma non mappato nella lookup
# COMPARE come anomalia rossa, non sparisce in silenzio (un INNER JOIN o un
# filtro diretto lo perderebbe). Coerenza garantita anche da pgTAP.
#
# Anzianita' (v1 proxy, design §5): data_riferimento (dai resolver, 20260706-
# 03..08) e anzianita_giorni = CURRENT_DATE - data_riferimento. L'ordinamento
# e' lato BE (le viste non garantiscono ORDER).
# Scope: ereditato dalla union (RLS aree documentali + GUC commesse).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260706-12-create-vw-dash-backlog-documenti-mctit.yaml

  - changeSet:
      id: 20260706-12-create-vw-dash-backlog-documenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Lente 2 Backlog: lista dei fermi non-verdi (RECUPERABILE + ANOMALIA +
        SOLLECITO_CLIENTE) da tutte le aree, con classe dalla lookup
        config.motivi_fermo (fail-visible: non mappato -> ANOMALIA) e
        anzianita' su data_riferimento.
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: motivi_fermo }
        - sqlCheck:
            expectedResult: '1'
            sql: |
              SELECT COUNT(*)
                FROM information_schema.columns
               WHERE table_schema = 'vendite'
                 AND table_name   = 'vw_dash_fatturazione_documenti'
                 AND column_name  = 'data_riferimento';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_backlog_documenti
              WITH (security_invoker = on) AS
              SELECT
                  d.area,
                  d.competenza_mese,
                  d.documento_id,
                  d.documento_uid,
                  d.codice,
                  d.cliente_display,
                  d.emittente_fiscale_id,
                  d.emittente_soggetto_ruolo_id,
                  -- Valore/unita' del solo fermo (NULL per le aree a conteggi).
                  (d.valore_totale - d.valore_transitato)  AS valore_fermo,
                  (d.unita_totali - d.unita_transitate)    AS unita_ferme,
                  d.motivo_fermo,
                  -- Fail-visible (DB-3): motivo non mappato = ANOMALIA, mai perso.
                  COALESCE(mf.classe, 'ANOMALIA')          AS classe,
                  mf.azione,
                  d.data_riferimento,
                  (CURRENT_DATE - d.data_riferimento)      AS anzianita_giorni,
                  d.stato_codice_interno,
                  d.stato_codice,
                  d.fase
                FROM vendite.vw_dash_fatturazione_documenti d
                LEFT JOIN config.motivi_fermo mf
                  ON mf.codice_interno = d.motivo_fermo
                 AND mf.attivo IS TRUE
               WHERE d.motivo_fermo IS NOT NULL
                 AND COALESCE(mf.classe, 'ANOMALIA') <> 'FISIOLOGICO';

              COMMENT ON VIEW vendite.vw_dash_backlog_documenti IS
                'Lente 2 Backlog (due lenti): i non-collegati azionabili — fermi della union vw_dash_fatturazione_documenti con classe non-FISIOLOGICO dalla lookup config.motivi_fermo (RECUPERABILE=lavoro interno, ANOMALIA=da rivedere, SOLLECITO_CLIENTE=palla al cliente in filtro dedicato). Fail-visible: motivo non mappato -> classe ANOMALIA (LEFT JOIN + COALESCE), mai perso in silenzio. anzianita_giorni = CURRENT_DATE - data_riferimento (proxy v1: data documento / mese scoperto). Regola unica DL-7, nessun caso speciale per area. Scope ereditato dalla union. security_invoker=on.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_dash_backlog_documenti;
