# D-L punto 1 — i nomi delle due funzioni di reset dicono cosa fanno
#   (piano-db-satelliti-fattura.md rilievo C-17, decisione D-L del 2026-07-30)
#
#   vendite.fn_reset_lotto_draft         → vendite.fn_annulla_lotto_da_draft
#   vendite.fn_reset_lotto_fattura_draft → vendite.fn_elimina_fattura_draft_da_lotto
#
# PERCHE'. I nomi vecchi promettono un «reset a DRAFT» che non esiste: la prima
#   non riporta un bel niente in bozza — CHIUDE il lotto e lo porta ad ANNULLATA
#   — e la seconda non resetta una fattura, la CANCELLA e la stacca dal lotto.
#   Il ritorno a DRAFT che quei nomi evocano e' un lavoro ancora da costruire
#   (Fase 6). Un nome che mente e' peggio di un nome brutto: chi legge la lista
#   dei task crede che una via d'uscita esista gia'.
#
#   Decisione presa il 2026-07-30 e non riaperta: **si rinomina su ENTRAMBI gli
#   strati**, DB e Python. Rinominare un solo strato scambia un disallineamento
#   con uno peggiore — un nome che mente ma e' coerente ovunque si impara una
#   volta, due nomi diversi per la stessa cosa si sbagliano ogni volta.
#
# ── CHI MUOVE PER PRIMO: l'unica cosa da concordare, e il BE ha risposto ──
#   Fra questo apply e la riga che il BE cambia in `ALLOWED_TASK_FUNCTIONS`, il
#   task `reset_lotto_draft` punta a una funzione che non esiste piu' e il passo
#   e' rotto. Non e' teorico: e' successo il 2026-07-31 con
#   `fn_snapshot_indirizzi_lotto` → `fn_snapshot_fattura_lotto`.
#   Risposta del BE (2026-08-01): «applicate pure, allineo subito dopo».
#   La finestra e' quindi voluta e sorvegliata, non subita.
#
# ⚠️ **Il `task_code` NON si tocca.** `reset_lotto_draft` resta il nome del
#   TASK — vive nei CSV di `pipeline_task_registry`, negli `impl`, nelle
#   `task_policy` e nei `processi` — ed e' l'identita' stabile del passo di
#   pipeline. E' la stessa distinzione gia' pagata con lo snapshot: il nome
#   della funzione si rinomina, il codice del task no. Chi cambiasse anche
#   quello sposterebbe di colpo tutte le righe di seed che lo nominano.
#
# ── COSA CAMBIA E COSA NO ─────────────────────────────────────────────────
#   Solo i NOMI. I corpi sono quelli vivi di oggi, `20260801-07` compreso: la
#   per-fattura passa `NULL` come `lock_batch_id` (C-22) e la primitiva di
#   cleanup storna gli arrotondamenti (C-23). Cambia anche il nome che le due
#   funzioni dichiarano a `script.fn_log_and_raise_error`: un errore che si
#   presenta col nome vecchio manderebbe a cercare una funzione inesistente.
#
#   `DROP` esplicita delle vecchie: rinominare creando la nuova e basta
#   lascerebbe due funzioni identiche, di cui una raggiungibile dal Python
#   per sbaglio — cioe' proprio il doppio strato che D-L esiste per togliere.
#
#   Nessuna funzione o vista di database le chiama (verificato il 2026-08-01 su
#   tutta la doc auto-gen): i chiamanti sono il backend e due pgTAP, adeguati
#   nello stesso giro.
#
# ⏭️ Restano fuori, e sono altri due punti di D-L: l'**asimmetria di perimetro**
#   fra la versione globale e quella per-fattura (D-L.2) e il ritorno a DRAFT
#   vero e proprio (Fase 6). Qui si cambiano i nomi, non i comportamenti.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260801-10-rename-funzioni-reset-lotto-mctit.yaml

  - changeSet:
      id: 20260801-10-rename-funzioni-reset-lotto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D-L pt.1 — fn_reset_lotto_draft diventa fn_annulla_lotto_da_draft e
        fn_reset_lotto_fattura_draft diventa fn_elimina_fattura_draft_da_lotto:
        i nomi vecchi promettevano un ritorno a DRAFT che non esiste (Fase 6).
        Solo i nomi, i corpi restano quelli di 20260801-07. Il task_code
        reset_lotto_draft del registry NON si tocca. Il BE allinea
        ALLOWED_TASK_FUNCTIONS subito dopo l'apply (accordo del 2026-08-01).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ══ 1. Annullamento del lotto dalla bozza ═══════════════════════
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_lotto_da_draft(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE
              )
              RETURNS TABLE(updated_lotti INTEGER, updated_attivita INTEGER,
                            deleted_fatture INTEGER, deleted_righe INTEGER)
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: rollback tecnico di un lotto MASSIVO in DRAFT — cancella
              --        le fatture PRE-FISCALI (DRAFT/EMESSA), ripristina le
              --        attivita' e CHIUDE il lotto portandolo ad ANNULLATA.
              -- Nome:  rinominata da fn_reset_lotto_draft il 2026-08-01 (D-L
              --        pt.1). Il vecchio nome prometteva un ritorno in bozza che
              --        questa funzione non fa e che ancora non esiste (Fase 6).
              DECLARE
                  v_tipo_lotto           vendite.fatturazione_lotti.tipo_lotto%TYPE;
                  v_stato_doc_fiscale_id vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_lock_batch_id        vendite.fatturazione_lotti.lock_batch_id%TYPE;
                  v_draft_id             config.stati_doc_fiscale.id%TYPE;
                  v_emessa_id            config.stati_doc_fiscale.id%TYPE;
                  v_annullata_id         config.stati_doc_fiscale.id%TYPE;
                  v_fatture_ids          BIGINT[];
                  v_bad_fatture          INTEGER := 0;
                  v_updated_lotti        INTEGER := 0;
                  v_updated_attivita     INTEGER := 0;
                  v_deleted_fatture      INTEGER := 0;
                  v_deleted_righe        INTEGER := 0;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  SELECT fl.tipo_lotto, fl.stato_doc_fiscale_id, fl.lock_batch_id
                    INTO v_tipo_lotto, v_stato_doc_fiscale_id, v_lock_batch_id
                    FROM vendite.fatturazione_lotti fl WHERE fl.id = p_lotto_id;

                  IF v_tipo_lotto IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_VALORE_MANCANTE',
                          jsonb_build_object('lotto_id', p_lotto_id), NULL::uuid, concat('lotto_id ', p_lotto_id));
                  END IF;

                  IF v_tipo_lotto <> 'MASSIVO' THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'tipo_lotto', 'valore', v_tipo_lotto, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('rollback solo per MASSIVO, tipo=', v_tipo_lotto));
                  END IF;

                  SELECT s.id INTO v_draft_id FROM config.stati_doc_fiscale s WHERE s.codice_interno = 'DRAFT' AND s.attivo IS TRUE LIMIT 1;
                  IF v_draft_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'DRAFT'), NULL::uuid, 'stato DRAFT non configurato');
                  END IF;

                  SELECT s.id INTO v_emessa_id FROM config.stati_doc_fiscale s WHERE s.codice_interno = 'EMESSA' AND s.attivo IS TRUE LIMIT 1;
                  IF v_emessa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'EMESSA'), NULL::uuid, 'stato EMESSA non configurato');
                  END IF;

                  SELECT s.id INTO v_annullata_id FROM config.stati_doc_fiscale s WHERE s.codice_interno = 'ANNULLATA' AND s.attivo IS TRUE LIMIT 1;
                  IF v_annullata_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'ANNULLATA'), NULL::uuid, 'stato ANNULLATA non configurato');
                  END IF;

                  IF v_stato_doc_fiscale_id IS DISTINCT FROM v_draft_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'stato_doc_fiscale', 'valore', v_stato_doc_fiscale_id, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('rollback solo se DRAFT, stato=', v_stato_doc_fiscale_id));
                  END IF;

                  -- Le fatture devono essere PRE-FISCALI (DRAFT o EMESSA): pre-fiscale = non
                  -- numerata -> cancellabile dal rollback. Le fiscali (DEFINITIVA+) sono rifiutate.
                  SELECT count(*) INTO v_bad_fatture
                    FROM vendite.fatture f JOIN vendite.fatturazione_lotti_fatture lf ON lf.fattura_id = f.id
                   WHERE lf.lotto_id = p_lotto_id
                     AND f.stato_doc_fiscale_id IS DISTINCT FROM v_draft_id
                     AND f.stato_doc_fiscale_id IS DISTINCT FROM v_emessa_id;

                  IF v_bad_fatture > 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_annulla_lotto_da_draft', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'fatture_non_pre_fiscali', 'count', v_bad_fatture, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('fatture non pre-fiscali (DRAFT/EMESSA): ', v_bad_fatture));
                  END IF;

                  SELECT array_agg(lf.fattura_id) INTO v_fatture_ids
                    FROM vendite.fatturazione_lotti_fatture lf WHERE lf.lotto_id = p_lotto_id;
                  IF v_fatture_ids IS NULL THEN v_fatture_ids := ARRAY[]::BIGINT[]; END IF;

                  -- ⚠️ Qui il lock_batch_id SI passa, ed e' corretto: il reset
                  -- globale deve liberare anche le attivita' agganciate al lotto
                  -- che non sono mai diventate riga. E' il per-fattura che deve
                  -- passare NULL (C-22).
                  SELECT c.deleted_fatture, c.deleted_righe, c.updated_attivita INTO v_deleted_fatture, v_deleted_righe, v_updated_attivita
                    FROM vendite.fn_cleanup_fatture_by_ids(v_fatture_ids, v_lock_batch_id) AS c;

                  UPDATE vendite.fatturazione_lotti SET stato_operativo = 'CHIUSO', stato_doc_fiscale_id = v_annullata_id, stato_lotto = 'COMPLETATO', data_update = now(), user_update = current_user WHERE id = p_lotto_id;
                  GET DIAGNOSTICS v_updated_lotti = ROW_COUNT;

                  RETURN QUERY SELECT v_updated_lotti, v_updated_attivita, v_deleted_fatture, v_deleted_righe;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_annulla_lotto_da_draft(bigint)
              IS 'Rollback tecnico lotto MASSIVO DRAFT: elimina fatture/righe PRE-FISCALI (DRAFT/EMESSA), ripristina le attivita e CHIUDE il lotto portandolo ad ANNULLATA. Rinominata da fn_reset_lotto_draft il 2026-08-01 (D-L pt.1, rilievo C-17): il nome vecchio prometteva un ritorno in bozza che questa funzione non fa — e che ancora non esiste, e'' la Fase 6. Il task_code del registry resta reset_lotto_draft, che e'' il nome del TASK e non della funzione.';

              -- ══ 2. Eliminazione di una fattura in bozza dal lotto ═══════════
              CREATE OR REPLACE FUNCTION vendite.fn_elimina_fattura_draft_da_lotto(
                  p_lotto_id   vendite.fatturazione_lotti.id%TYPE,
                  p_fattura_id vendite.fatture.id%TYPE
              )
              RETURNS TABLE(updated_attivita INTEGER, deleted_fatture INTEGER, deleted_righe INTEGER)
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: toglie UNA fattura DRAFT da un lotto MASSIVO, cancellandola,
              --        senza annullare il lotto.
              -- Nome:  rinominata da fn_reset_lotto_fattura_draft il 2026-08-01
              --        (D-L pt.1): non «resetta» una fattura, la elimina.
              -- Regole: C-22 — alla primitiva si passa `NULL` come
              --         `p_lock_batch_id`. Passando quello del lotto si
              --         libererebbero anche le attivita' delle ALTRE fatture, che
              --         pero' restano dove sono.
              DECLARE
                  v_tipo_lotto           vendite.fatturazione_lotti.tipo_lotto%TYPE;
                  v_stato_doc_fiscale_id vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_draft_id             config.stati_doc_fiscale.id%TYPE;
                  v_is_linked            BOOLEAN := FALSE;
                  v_updated_attivita     INTEGER := 0;
                  v_deleted_fatture      INTEGER := 0;
                  v_deleted_righe        INTEGER := 0;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                  END IF;

                  -- ⚠️ `lock_batch_id` del lotto NON si legge: non serve a questa
                  -- funzione e averlo a portata di mano e' cio' che ha portato a
                  -- passarlo (C-22).
                  SELECT fl.tipo_lotto, fl.stato_doc_fiscale_id
                    INTO v_tipo_lotto, v_stato_doc_fiscale_id
                    FROM vendite.fatturazione_lotti fl WHERE fl.id = p_lotto_id;

                  IF v_tipo_lotto IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_VALORE_MANCANTE',
                          jsonb_build_object('lotto_id', p_lotto_id), NULL::uuid, concat('lotto_id ', p_lotto_id));
                  END IF;

                  IF v_tipo_lotto <> 'MASSIVO' THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'tipo_lotto', 'valore', v_tipo_lotto, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('eliminazione solo per MASSIVO, tipo=', v_tipo_lotto));
                  END IF;

                  SELECT s.id INTO v_draft_id FROM config.stati_doc_fiscale s WHERE s.codice_interno = 'DRAFT' AND s.attivo IS TRUE LIMIT 1;
                  IF v_draft_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'DRAFT'), NULL::uuid, 'stato DRAFT non configurato');
                  END IF;

                  IF v_stato_doc_fiscale_id IS DISTINCT FROM v_draft_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'stato_doc_fiscale', 'valore', v_stato_doc_fiscale_id, 'lotto_id', p_lotto_id),
                          NULL::uuid, concat('eliminazione solo se il lotto e DRAFT, stato=', v_stato_doc_fiscale_id));
                  END IF;

                  SELECT EXISTS (
                      SELECT 1 FROM vendite.fatturazione_lotti_fatture lf
                      JOIN vendite.fatture f ON f.id = lf.fattura_id
                      WHERE lf.lotto_id = p_lotto_id AND lf.fattura_id = p_fattura_id AND f.stato_doc_fiscale_id = v_draft_id
                  ) INTO v_is_linked;

                  IF COALESCE(v_is_linked, FALSE) = FALSE THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_draft_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'fattura_non_collegata_o_non_draft', 'lotto_id', p_lotto_id, 'fattura_id', p_fattura_id),
                          NULL::uuid, 'fattura non collegata al lotto o non in DRAFT');
                  END IF;

                  -- C-22: NULL, non il lock_batch_id del lotto.
                  SELECT c.deleted_fatture, c.deleted_righe, c.updated_attivita INTO v_deleted_fatture, v_deleted_righe, v_updated_attivita
                    FROM vendite.fn_cleanup_fatture_by_ids(ARRAY[p_fattura_id], NULL::uuid) AS c;

                  RETURN QUERY SELECT v_updated_attivita, v_deleted_fatture, v_deleted_righe;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_elimina_fattura_draft_da_lotto(bigint, bigint)
              IS 'Toglie UNA fattura DRAFT da un lotto MASSIVO cancellandola, senza annullare il lotto. Rinominata da fn_reset_lotto_fattura_draft il 2026-08-01 (D-L pt.1, rilievo C-17): non «resetta» una fattura, la elimina. Da C-22 passa NULL come lock_batch_id alla primitiva di cleanup: col lock_batch_id del lotto si sbloccavano e si smarcavano come non fatturate anche le attivita delle ALTRE fatture, che pero'' restavano al loro posto. Prerequisito di D-N-bis e della Fase 6.';

              -- ══ 3. Via le vecchie ═══════════════════════════════════════════
              -- Non basta creare le nuove: due funzioni identiche con nomi diversi
              -- sono il doppio strato che D-L esiste per togliere, e la vecchia
              -- resterebbe raggiungibile dal Python per sbaglio.
              DROP FUNCTION IF EXISTS vendite.fn_reset_lotto_draft(bigint);
              DROP FUNCTION IF EXISTS vendite.fn_reset_lotto_fattura_draft(bigint, bigint);
