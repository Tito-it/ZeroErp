databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260124-21-create-trgfn-fatturazione-lotti-guard-stato-mctit.yaml

  - changeSet:
      id: 20260124-21-create-trgfn-fatturazione-lotti-guard-stato
      author: mctit
      comment: "Guard transizioni stato per fatturazione_lotti"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_ok boolean;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Valida le transizioni di stato dei lotti usando
                --   config.stati_doc_fiscale_transizioni.
                --
                -- Regole:
                --   - Stato applicabile a lotto (applica_lotto=true).
                --   - Transizione ammessa e non solo_fattura.
                -- =========================================================
                IF TG_OP = 'UPDATE'
                  AND NEW.stato_doc_fiscale_id IS NOT NULL
                  AND NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id
                THEN
                  IF OLD.stato_doc_fiscale_id IS NULL THEN
                    SELECT s.applica_lotto
                      INTO v_ok
                      FROM config.stati_doc_fiscale s
                     WHERE s.id = NEW.stato_doc_fiscale_id
                       AND s.attivo;

                    IF COALESCE(v_ok, false) = false THEN
                      PERFORM script.fn_log_and_raise_error(
                        TG_TABLE_SCHEMA,
                        TG_NAME,
                        'E_GENERICO',
                        jsonb_build_object(
                          'detail','Stato non applicabile a lotto',
                          'stato_id', NEW.stato_doc_fiscale_id
                        ),
                        NULL::uuid,
                        'Stato non applicabile a lotto'
                      );
                    END IF;
                  ELSE
                    SELECT EXISTS (
                      SELECT 1
                        FROM config.stati_doc_fiscale_transizioni t
                       WHERE t.ammesso
                         AND t.stato_from_id = OLD.stato_doc_fiscale_id
                         AND t.stato_to_id = NEW.stato_doc_fiscale_id
                         AND t.solo_fattura = false
                    )
                    INTO v_ok;

                    IF NOT v_ok THEN
                      PERFORM script.fn_log_and_raise_error(
                        TG_TABLE_SCHEMA,
                        TG_NAME,
                        'E_GENERICO',
                        jsonb_build_object(
                          'detail','Transizione stato lotto non ammessa',
                          'from', OLD.stato_doc_fiscale_id,
                          'to', NEW.stato_doc_fiscale_id
                        ),
                        NULL::uuid,
                        'Transizione stato lotto non ammessa'
                      );
                    END IF;
                  END IF;
                END IF;

                RETURN NEW;
              END
              $$;

              CREATE TRIGGER trg_fatturazione_lotti_a10_guard_stato_upd
              BEFORE UPDATE OF stato_doc_fiscale_id ON vendite.fatturazione_lotti
              FOR EACH ROW
              EXECUTE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato();

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
                IS 'Guard transizioni stato per vendite.fatturazione_lotti basato su config.stati_doc_fiscale_transizioni.';
