databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260222-07-refactor-stato-esecuzione-mapping-helper-mctit.yaml

  - changeSet:
      id: 20260222-07-01-create-fn-resolve-stato-esecuzione
      author: mctit
      comment: "Helper condiviso per mapping/normalizzazione stato_esecuzione"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_resolve_stato_esecuzione(
                p_stato_source text DEFAULT NULL::text,
                p_current_stato_esecuzione vendite.fatturazione_lotti_fatture.stato_esecuzione%TYPE DEFAULT NULL::varchar,
                p_has_critical boolean DEFAULT false,
                p_esclusa boolean DEFAULT false,
                p_fatturato boolean DEFAULT false,
                p_default_stato_esecuzione vendite.fatturazione_lotti_fatture.stato_esecuzione%TYPE DEFAULT 'PENDING'::varchar
              )
              RETURNS vendite.fatturazione_lotti_fatture.stato_esecuzione%TYPE
              LANGUAGE plpgsql
              IMMUTABLE
              AS $function$
              DECLARE
                v_source text;
                v_default vendite.fatturazione_lotti_fatture.stato_esecuzione%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Normalizzare e risolvere lo stato_esecuzione runtime
                --   evitando duplicazioni CASE nelle funzioni lotto/attivita.
                --
                -- Regole:
                --   - esclusa=true    -> mantiene stato corrente
                --   - critical=true   -> ERRORE
                --   - fatturato=true  -> COMPLETED
                --   - mapping source:
                --       IN_ESECUZIONE -> RUNNING
                --       COMPLETATO    -> COMPLETED
                --       ERRORE        -> ERRORE
                --       PENDING/RUNNING/COMPLETED pass-through
                --   - fallback su default (PENDING)
                -- =========================================================
                IF COALESCE(p_esclusa, false) THEN
                  RETURN p_current_stato_esecuzione;
                END IF;

                IF COALESCE(p_has_critical, false) THEN
                  RETURN 'ERRORE';
                END IF;

                IF COALESCE(p_fatturato, false) THEN
                  RETURN 'COMPLETED';
                END IF;

                v_source := upper(btrim(COALESCE(p_stato_source, '')));
                v_default := upper(btrim(COALESCE(p_default_stato_esecuzione, 'PENDING')));

                IF v_default NOT IN ('PENDING','RUNNING','COMPLETED','ERRORE') THEN
                  v_default := 'PENDING';
                END IF;

                IF v_source = '' THEN
                  RETURN v_default;
                END IF;

                IF v_source = 'IN_ESECUZIONE' THEN
                  RETURN 'RUNNING';
                ELSIF v_source = 'COMPLETATO' THEN
                  RETURN 'COMPLETED';
                ELSIF v_source IN ('PENDING','RUNNING','COMPLETED','ERRORE') THEN
                  RETURN v_source;
                END IF;

                RETURN v_default;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_resolve_stato_esecuzione(text, varchar, boolean, boolean, boolean, varchar)
              IS 'Helper condiviso: risolve stato_esecuzione con priorita esclusa/critical/fatturato e mapping stato_lotto.';

  - changeSet:
      id: 20260222-07-02-update-fn-set-fatturazione-lotto-stato-use-stato-helper
      author: mctit
      comment: "Refactor fn_set_fatturazione_lotto_stato: mapping stato_esecuzione via helper condiviso"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_set_fatturazione_lotto_stato(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_stato_lotto vendite.fatturazione_lotti.stato_lotto%TYPE,
                p_note text DEFAULT NULL::text
              )
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente vendite.fatturazione_lotti.stato_lotto%TYPE;
                v_stato_lotto_input vendite.fatturazione_lotti.stato_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Aggiorna lo stato tecnico del lotto e mantiene
                --   allineato stato_esecuzione su fatturazione_lotti_fatture.
                --
                -- Regole:
                --   - mapping stato_esecuzione delegato a helper condiviso
                --   - critical=true  -> ERRORE
                --   - esclusa=true   -> non forzare override stato_esecuzione
                -- =========================================================
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_stato_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id e stato_lotto obbligatori')),
                    NULL::uuid, 'Parametri obbligatori mancanti'
                  );
                END IF;

                v_stato_lotto_input := upper(btrim(p_stato_lotto));

                IF v_stato_lotto_input NOT IN ('IN_ESECUZIONE','COMPLETATO','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_lotto non valido', 'stato_lotto', p_stato_lotto)),
                    NULL::uuid, 'stato_lotto non valido'
                  );
                END IF;

                SELECT stato_lotto
                  INTO v_stato_corrente
                  FROM vendite.fatturazione_lotti
                 WHERE id = p_lotto_id
                 FOR UPDATE;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato', 'lotto_id', p_lotto_id)),
                    NULL::uuid,
                    concat('Lotto non trovato ', 'lotto_id: ', p_lotto_id::text)
                  );
                END IF;

                IF v_stato_corrente = v_stato_lotto_input THEN
                  RETURN;
                END IF;

                IF v_stato_corrente = 'IN_ESECUZIONE'
                   AND v_stato_lotto_input NOT IN ('COMPLETATO','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa', 'da', v_stato_corrente, 'a', v_stato_lotto_input)),
                    NULL::uuid,
                    concat('Transizione non ammessa: stato in esecuzione' , ' da ', v_stato_corrente, ' a ', v_stato_lotto_input)
                  );
                END IF;

                IF v_stato_corrente = 'ERRORE' AND v_stato_lotto_input <> 'IN_ESECUZIONE' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa', 'da', v_stato_corrente, 'a', v_stato_lotto_input)),
                    NULL::uuid,
                    concat('Transizione non ammessa: stato errore' , ' da ', v_stato_corrente, ' a ', v_stato_lotto_input)
                  );
                END IF;

                IF v_stato_corrente = 'COMPLETATO' AND v_stato_lotto_input <> 'IN_ESECUZIONE' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_fatturazione_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa', 'da', v_stato_corrente, 'a', v_stato_lotto_input)),
                    NULL::uuid,
                    concat('Transizione non ammessa: stato completato' , ' da ', v_stato_corrente, ' a ', v_stato_lotto_input)
                  );
                END IF;

                UPDATE vendite.fatturazione_lotti
                   SET stato_lotto = v_stato_lotto_input,
                       meta = CASE
                                WHEN p_note IS NULL THEN meta
                                ELSE jsonb_set(meta, '{note_stato}', to_jsonb(p_note), true)
                              END,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_lotto_id;

                UPDATE vendite.fatturazione_lotti_fatture lf
                   SET stato_esecuzione = vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => v_stato_lotto_input,
                         p_current_stato_esecuzione => lf.stato_esecuzione,
                         p_has_critical => COALESCE(f.critical, false),
                         p_esclusa => COALESCE(lf.esclusa, false),
                         p_fatturato => false,
                         p_default_stato_esecuzione => 'PENDING'
                       ),
                       data_update = now(),
                       user_update = current_user
                  FROM vendite.fatture f
                 WHERE lf.lotto_id = p_lotto_id
                   AND lf.fattura_id = f.id
                   AND lf.stato_esecuzione IS DISTINCT FROM vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => v_stato_lotto_input,
                         p_current_stato_esecuzione => lf.stato_esecuzione,
                         p_has_critical => COALESCE(f.critical, false),
                         p_esclusa => COALESCE(lf.esclusa, false),
                         p_fatturato => false,
                         p_default_stato_esecuzione => 'PENDING'
                       );
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_set_fatturazione_lotto_stato(
                vendite.fatturazione_lotti.id%TYPE,
                vendite.fatturazione_lotti.stato_lotto%TYPE,
                text
              ) IS 'Aggiorna stato_lotto tecnico e sincronizza stato_esecuzione fatture tramite helper condiviso.';

  - changeSet:
      id: 20260222-07-03-update-fn-sync-lotto-fatture-stato-use-stato-helper
      author: mctit
      comment: "Refactor fn_sync_lotto_fatture_stato: mapping stato_esecuzione via helper condiviso"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_lotto_fatture_stato(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_target_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE DEFAULT NULL::bigint
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_lotto vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                v_target config.stati_doc_fiscale.id%TYPE;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_inviata_id config.stati_doc_fiscale.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Allineare stato_doc_fiscale delle fatture del lotto
                --   e sincronizzare stato_esecuzione sul ponte lotto-fattura.
                --
                -- Regole:
                --   - le fatture critical non avanzano stato documento
                --   - mapping stato_esecuzione delegato a helper condiviso
                --   - su lotti GIORNALIERO in INVIATA: stato_operativo CHIUSO
                -- =========================================================
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id obbligatorio')),
                    NULL::uuid, 'lotto_id obbligatorio'
                  );
                END IF;

                IF p_target_stato_doc_fiscale_id IS NOT NULL AND p_target_stato_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','target stato_doc_fiscale non valido','stato_doc_fiscale_id',p_target_stato_doc_fiscale_id)),
                    NULL::uuid, 'stato_doc_fiscale target non valido'
                  );
                END IF;

                SELECT tipo_lotto, stato_doc_fiscale_id
                  INTO v_tipo_lotto, v_stato_lotto
                  FROM vendite.fatturazione_lotti
                 WHERE id = p_lotto_id
                 FOR UPDATE;

                IF v_stato_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato')),
                    NULL::uuid, concat('lotto non trovato: ', p_lotto_id::text)
                  );
                END IF;

                v_target := COALESCE(p_target_stato_doc_fiscale_id, v_stato_lotto);

                IF v_target IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_lotto_fatture_stato', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_doc_fiscale target obbligatorio')),
                    NULL::uuid, concat('stato_doc_fiscale target obbligatorio per lotto: ', p_lotto_id::text)
                  );
                END IF;

                UPDATE vendite.fatture f
                   SET stato_doc_fiscale_id = v_target,
                       data_update = now(),
                       user_update = current_user
                  FROM vendite.fatturazione_lotti_fatture lf
                 WHERE lf.lotto_id = p_lotto_id
                   AND COALESCE(lf.esclusa, false) IS FALSE
                   AND lf.fattura_id = f.id
                   AND COALESCE(f.critical, false) IS FALSE
                   AND f.stato_doc_fiscale_id IS DISTINCT FROM v_target;

                UPDATE vendite.fatturazione_lotti_fatture lf
                   SET stato_doc_fiscale_id = f.stato_doc_fiscale_id,
                       stato_esecuzione = vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => 'COMPLETATO',
                         p_current_stato_esecuzione => lf.stato_esecuzione,
                         p_has_critical => COALESCE(f.critical, false),
                         p_esclusa => COALESCE(lf.esclusa, false),
                         p_fatturato => false,
                         p_default_stato_esecuzione => 'COMPLETED'
                       ),
                       data_update = now(),
                       user_update = current_user
                  FROM vendite.fatture f
                 WHERE lf.lotto_id = p_lotto_id
                   AND lf.fattura_id = f.id;

                IF v_tipo_lotto = 'GIORNALIERO' THEN
                  SELECT id
                    INTO v_inviata_id
                    FROM config.stati_doc_fiscale
                   WHERE codice_interno = 'INVIATA'
                     AND attivo IS TRUE
                   ORDER BY ordine
                   LIMIT 1;

                  IF v_inviata_id IS NOT NULL AND v_target = v_inviata_id THEN
                    UPDATE vendite.fatturazione_lotti
                       SET stato_operativo = 'CHIUSO',
                           data_update = now(),
                           user_update = current_user
                     WHERE id = p_lotto_id;
                  END IF;
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_sync_lotto_fatture_stato(bigint, bigint)
              IS 'Allinea stato fatture collegate al lotto e sincronizza stato_esecuzione tramite helper condiviso.';

  - changeSet:
      id: 20260222-07-04-update-fn-sync-fatture-log-critical-lotto-use-stato-helper
      author: mctit
      comment: "Refactor fn_sync_fatture_log_critical_lotto: mapping stato_esecuzione via helper condiviso"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_fatture_log_critical_lotto(
                p_fattura_ids bigint[]
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Ricalcola flag critical sulle fatture toccate da log
                --   e propaga stato_esecuzione sul ponte lotto-fattura.
                --
                -- Regole:
                --   - mapping stato_esecuzione delegato a helper condiviso
                --   - has_critical=true -> ERRORE
                --   - lotto IN_ESECUZIONE -> RUNNING
                --   - altri casi attivi -> COMPLETED
                -- =========================================================
                IF p_fattura_ids IS NULL OR array_length(p_fattura_ids, 1) IS NULL THEN
                  RETURN;
                END IF;

                WITH changed AS (
                  SELECT DISTINCT x.fattura_id
                  FROM unnest(p_fattura_ids) AS x(fattura_id)
                  WHERE x.fattura_id IS NOT NULL
                    AND x.fattura_id > 0
                ),
                calc AS (
                  SELECT
                    c.fattura_id,
                    EXISTS (
                      SELECT 1
                      FROM vendite.fatture_log fl
                      WHERE fl.fattura_id = c.fattura_id
                        AND fl.disabilitato IS FALSE
                        AND fl.status = 'C'
                    ) AS has_critical
                  FROM changed c
                )
                UPDATE vendite.fatture f
                   SET critical = calc.has_critical,
                       data_update = now(),
                       user_update = current_user
                  FROM calc
                 WHERE f.id = calc.fattura_id
                   AND f.critical IS DISTINCT FROM calc.has_critical;

                WITH changed AS (
                  SELECT DISTINCT x.fattura_id
                  FROM unnest(p_fattura_ids) AS x(fattura_id)
                  WHERE x.fattura_id IS NOT NULL
                    AND x.fattura_id > 0
                ),
                calc AS (
                  SELECT
                    c.fattura_id,
                    EXISTS (
                      SELECT 1
                      FROM vendite.fatture_log fl
                      WHERE fl.fattura_id = c.fattura_id
                        AND fl.disabilitato IS FALSE
                        AND fl.status = 'C'
                    ) AS has_critical
                  FROM changed c
                )
                UPDATE vendite.fatturazione_lotti_fatture lf
                   SET stato_esecuzione = vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => l.stato_lotto,
                         p_current_stato_esecuzione => lf.stato_esecuzione,
                         p_has_critical => calc.has_critical,
                         p_esclusa => COALESCE(lf.esclusa, false),
                         p_fatturato => false,
                         p_default_stato_esecuzione => 'COMPLETED'
                       ),
                       data_update = now(),
                       user_update = current_user
                  FROM calc,
                       vendite.fatturazione_lotti l
                 WHERE lf.fattura_id = calc.fattura_id
                   AND l.id = lf.lotto_id
                   AND COALESCE(lf.esclusa, false) IS FALSE
                   AND (
                         l.stato_lotto = 'IN_ESECUZIONE'
                         OR l.stato_operativo = 'APERTO'
                       )
                   AND lf.stato_esecuzione IS DISTINCT FROM vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => l.stato_lotto,
                         p_current_stato_esecuzione => lf.stato_esecuzione,
                         p_has_critical => calc.has_critical,
                         p_esclusa => COALESCE(lf.esclusa, false),
                         p_fatturato => false,
                         p_default_stato_esecuzione => 'COMPLETED'
                       );
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_sync_fatture_log_critical_lotto(bigint[])
              IS 'Ricalcola fatture.critical e propaga stato_esecuzione su lotti_fatture tramite helper condiviso.';

  - changeSet:
      id: 20260222-07-05-update-fn-sync-attivita-stato-esecuzione-use-stato-helper
      author: mctit
      comment: "Refactor fn_sync_attivita_stato_esecuzione: mapping stato_esecuzione via helper condiviso"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_attivita_stato_esecuzione(
                p_lotto_attivita_id vendite.attivita_fatturabili_lotti.id%TYPE,
                p_target_stato_esecuzione vendite.attivita_fatturabili.stato_esecuzione%TYPE DEFAULT NULL::varchar
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_lotto vendite.attivita_fatturabili_lotti.stato_lotto%TYPE;
                v_target vendite.attivita_fatturabili.stato_esecuzione%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Sincronizza stato_esecuzione sulle attivita del lotto.
                --
                -- Regole:
                --   - target esplicito opzionale
                --   - fallback da stato_lotto tramite helper condiviso
                --   - attivita fatturate sempre COMPLETED
                -- =========================================================

                IF p_lotto_attivita_id IS NULL OR p_lotto_attivita_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_attivita_stato_esecuzione', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_attivita_id obbligatorio')),
                    NULL::uuid, 'lotto_attivita_id obbligatorio'
                  );
                END IF;

                SELECT l.stato_lotto
                  INTO v_stato_lotto
                  FROM vendite.attivita_fatturabili_lotti l
                 WHERE l.id = p_lotto_attivita_id
                 FOR UPDATE;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_attivita_stato_esecuzione', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto attivita non trovato')),
                    NULL::uuid, 'lotto attivita non trovato'
                  );
                END IF;

                v_target := upper(btrim(COALESCE(p_target_stato_esecuzione, '')));
                IF v_target IS NULL OR v_target = '' THEN
                  v_target := vendite.fn_resolve_stato_esecuzione(
                                p_stato_source => v_stato_lotto,
                                p_current_stato_esecuzione => NULL::varchar,
                                p_has_critical => false,
                                p_esclusa => false,
                                p_fatturato => false,
                                p_default_stato_esecuzione => 'PENDING'
                              );
                ELSE
                  v_target := upper(btrim(v_target));
                END IF;

                IF v_target NOT IN ('PENDING','RUNNING','COMPLETED','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_attivita_stato_esecuzione', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_esecuzione target non valido','stato_esecuzione',v_target)),
                    NULL::uuid, 'stato_esecuzione target non valido'
                  );
                END IF;

                UPDATE vendite.attivita_fatturabili a
                   SET stato_esecuzione = vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => v_target,
                         p_current_stato_esecuzione => a.stato_esecuzione,
                         p_has_critical => false,
                         p_esclusa => false,
                         p_fatturato => a.fatturato,
                         p_default_stato_esecuzione => 'PENDING'
                       ),
                       data_update = now(),
                       user_update = current_user
                 WHERE a.lotto_attivita_id = p_lotto_attivita_id
                   AND a.stato_esecuzione IS DISTINCT FROM vendite.fn_resolve_stato_esecuzione(
                         p_stato_source => v_target,
                         p_current_stato_esecuzione => a.stato_esecuzione,
                         p_has_critical => false,
                         p_esclusa => false,
                         p_fatturato => a.fatturato,
                         p_default_stato_esecuzione => 'PENDING'
                       );
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_sync_attivita_stato_esecuzione(bigint, varchar)
              IS 'Sincronizza stato_esecuzione sulle attivita del lotto tramite helper condiviso.';
