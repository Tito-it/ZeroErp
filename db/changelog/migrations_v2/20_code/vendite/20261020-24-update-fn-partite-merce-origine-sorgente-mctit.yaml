            sql: |
              COMMENT ON FUNCTION vendite.fn_partite_merce(bigint[], bigint[]) IS
                'LA PARTITA DI MERCE PER DOCUMENTO (D14, quarta leva, 2026-09-21): lo stesso conto di vendite.vw_partite_merce — che ne e'' la proiezione senza filtro, fn_partite_merce(NULL, NULL) — ristretto alla CHIUSURA dei documenti chiesti. Semi: p_ddt_ids (i DDT) e p_ordine_ids (gli ordini: le righe che li evadono); entrambi NULL = tutte le partite; un array VUOTO semina zero righe. Con entrambi valorizzati l''uscita e'' l''unione: ddt_id nei DDT chiesti OR ordine_id negli ordini chiesti — e `ordine_id` e'' la colonna PROIETTATA (min(ordine_riga_id) di `orig`), quindi una riga MULTIPLA esce sotto l''ordine della riga minima, come la legge il backend. La chiusura: R0 = righe dei semi; R1 = righe che condividono con una di R0 la riga d''ordine di `orig` (la partizione della greedy `alloc` e'' completa); O = R0 ∪ R1 ∪ le origini di ri-consegna (la finestra di `migra` e'' intera). Equivalente alla vista per costruzione: ogni colonna dipende solo da cio'' che la chiusura conserva. ⛔ Chi aggiunge una finestra o un insieme con una chiave nuova (articolo, cliente, commessa) DEVE allargare la chiusura, o la funzione sbaglia SOLO con un seme e la vista resta giusta: il presidio e'' test-fn-partite-merce-chiusura-v1, a casi costruiti. `af` (fn_af_merce_per_riga) e'' letta PER CHIAVE dal giro 4 (D5, 2026-09-21): le chiavi DDT delle origini O e le chiavi ORD dei fulfillment della chiusura, chiave BASE (i suffissi #RET/#CMP li risolve la funzione); la chiave ORD nasce dall''uid dell''ordine, letto sotto RLS — ordine e commessa devono stare nello stesso perimetro, e il BA li tiene insieme. BEGIN ATOMIC: le dipendenze sono in pg_depend (rinomina a monte rifiutata; catena RLS leggibile dal presidio security_invoker). I due modi sono rami in UNION ALL, mai `p IS NULL OR col = ANY(p)`: in piano generico quell''OR e'' una scansione intera sotto policy. INVOKER: la RLS resta di chi legge. Chiamanti per documento: fn_list_ddt_da_pushare, fn_ddt_push_diagnosi, BE list_partite_merce. Brief: brief-db-partita-merce-per-documento. ⚠️ rev 2026-09-22 (giro 8 RITIRATO, brief §16.7): la catena del sospetto era stata seminata da `riga`; come app la diagnosi «tutte» e'' passata da 63 a 90 ms e la vista intera da 47 a 78, perche'' il planner ha cambiato il piano di `riga` (da Index Scan sulla PK di ddt a Seq Scan per riga). Ripristinata la forma del 20260921-53. ⛔ La catena resta il pezzo piu'' caro della partita (17,6 ms su 46, zero righe): il perche'' e'' sul modello — riempie la sola colonna sospetto_duplicato_ordine, un avviso per una PERSONA — ma la cura non e'' quella provata, e il banco di prova (corpo eseguito come query) NON predice il piano dentro la funzione. rev 2026-10-12 (20261012-32, brief-db-date-consegna-righe-in-blocco §4.1, regola del 2, scelta (a) di Tid): «merce partita» dal BB script.vw_stati_doc_ddt_merce_partita in `riga` (filtro) e in `ponte_riga` (emesso), al posto della CTE `soglia` con l''espressione scritta qui; la stessa regola viveva anche in vendite.fn_ordine_riga_spedita e in dbops.vw_ddt_emessi_senza_scarico. Uscita identica (EXCEPT ALL a zero nei due versi, prova pre-apply). Cambio di significato solo dove il modello lo ammette e i dati non lo producono: una ri-consegna in uno stato abortito (l''annullo ritira i legami, quindi non dovrebbe esistere) conta come in_riconsegna invece che riconsegnata, e uno stato con ordine NULL non fa piu'' sparire la quantita''. Commento: gli apostrofi raddoppiati due volte nella nota del 2026-09-22 tornano singoli.';
