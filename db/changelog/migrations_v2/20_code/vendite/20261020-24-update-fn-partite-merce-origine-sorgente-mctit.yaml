 Brief: brief-db-partita-merce-per-documento. ⚠️ rev 2026-09-22 (giro 8 RITIRATO, brief §16.7): la catena del sospetto era stata seminata da `riga`; come app la diagnosi «tutte» e'' passata da 63 a 90 ms e la vista intera da 47 a 78, perche'' il planner ha cambiato il piano di `riga` (da Index Scan sulla PK di ddt a Seq Scan per riga). Ripristinata la forma del 20260921-53. ⛔ La catena resta il pezzo piu'' caro della partita (17,6 ms su 46, zero righe): il perche'' e'' sul modello — riempie la sola colonna sospetto_duplicato_ordine, un avviso per una PERSONA — ma la cura non e'' quella provata, e il banco di prova (corpo eseguito come query) NON predice il piano dentro la funzione. rev 2026-10-12 (20261012-32, brief-db-date-consegna-righe-in-blocco §4.1, regola del 2, scelta (a) di Tid): «merce partita» dal BB script.vw_stati_doc_ddt_merce_partita in `riga` (filtro) e in `ponte_riga` (emesso), al posto della CTE `soglia` con l''espressione scritta qui; la stessa regola viveva anche in vendite.fn_ordine_riga_spedita e in dbops.vw_ddt_emessi_senza_scarico. Uscita identica (EXCEPT ALL a zero nei due versi, prova pre-apply). Cambio di significato solo dove il modello lo ammette e i dati non lo producono: una ri-consegna in uno stato abortito (l''annullo ritira i legami, quindi non dovrebbe esistere) conta come in_riconsegna invece che riconsegnata, e uno stato con ordine NULL non fa piu'' sparire la quantita''. Commento: gli apostrofi raddoppiati due volte nella nota del 2026-09-22 tornano singoli. rev 2026-10-20 (20261020-24, brief-db-grammatica-unica-documenti §12.8, decisione di Tid): `origine` e'' il codice della sorgente da cui la merce parte (ORDINE -> ORDINE_VENDITA, la grammatica di config.sorgenti), oppure NESSUNA (nessuna riga d''ordine evasa) o MULTIPLA (piu'' righe d''ordine): questi due non sono sorgenti, dicono l''assenza e l''ambiguita'' dell''origine e restano. RETURNS TABLE ancorato con %TYPE dove la colonna esiste (origine su config.sorgenti.codice_interno: il tipo resta character varying); SECURITY INVOKER scritto. Nessun lettore confronta il valore ORDINE: fn_situazione_merce_ordine legge solo MULTIPLA (censimento su pg_get_functiondef, dbdev 2026-10-20).';
