# LA RIGA D'ORDINE DICE SE E' UN ONERE — vendite.vw_ordini_righe_dettaglio
#   Brief: brief-db-addebito-trasporto-ordine §7.3 (stampa: gli oneri dopo gli
#   articoli, lo ordina il BE col dato del DB), §8.1 «Stampa e maschera».
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Con gli articoli-onere sulle righe (20261103-17) il BE deve sapere quali
#   righe sono oneri (stampa: merce prima, oneri dopo; maschera) senza
#   ricostruire la regola. E l'evaso / residuo di un onere non hanno senso:
#   l'onere non si evade (decisione 3 di Tid).
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · + e_onere (boolean, in coda) = NOT script.fn_natura_e_merce(natura
#     CONGELATA della riga) (20261103-16): su ordine «non merce» = onere, lo
#     garantisce l'ammissione (-17). Calcolato una volta, in un LATERAL;
#   · + causale_onere_id (in coda) = la causale dell'articolo
#     (catalogo.articoli.causale_onere_id): il valore serve a chi raggruppa o
#     etichetta gli oneri; NULL sulla merce;
#   · qta_evasa_operativa e qta_residua_operativa: NULL sulla riga-onere (prima
#     0 e quantita' piena: un residuo che nessuna bolla deve spedire).
#   Colonne nuove IN CODA: CREATE OR REPLACE VIEW non sposta le altre.
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   Tutte le altre colonne, i join, nessun ORDER BY, tutte le righe (anche non
#   attive). Sulla merce evasa e residuo sono identici. security_invoker
#   ri-specificata (si azzera su CREATE OR REPLACE). COMMENT ON COLUMN di
#   data_consegna_confermata_blocco resta (CREATE OR REPLACE lo conserva).
#   Corpo dal vivo (doc auto-gen = 20261012-07, confrontato il 2026-11-03),
#   cambiato solo nei punti sopra.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261103-25-update-vw-ordini-righe-dettaglio-e-onere-mctit.yaml

  - changeSet:
      id: 20261103-25-update-vw-ordini-righe-dettaglio-e-onere
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_ordini_righe_dettaglio: + e_onere (NOT script.fn_natura_e_merce sulla natura congelata)
        e causale_onere_id (dall'articolo), in coda; qta_evasa_operativa e qta_residua_operativa NULL
        sulla riga-onere. brief-db-addebito-trasporto-ordine §7.3, §8.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_ordini_righe_dettaglio
              WITH (security_invoker=true) AS
              SELECT r.id,
                  r.ordine_id,
                  r.riga_nr,
                  r.attivo,
                  r.articolo_id,
                  a.codice AS articolo_codice,
                  a.descrizione AS articolo_descrizione,
                  r.descrizione,
                  r.quantita,
                  r.qta_operativa,
                  r.factor_to_base,
                  r.uom_operativa_id,
                  um.codice AS uom_codice,
                  r.prezzo_unitario,
                  r.sconto_percentuale,
                  r.iva_id,
                  iva.codice AS iva_codice,
                  iva.descrizione AS iva_descrizione,
                  iva.aliquota_iva AS iva_aliquota,
                  round(script.fn_imponibile_riga(r.quantita, r.prezzo_unitario, r.sconto_percentuale), 2) AS importo_riga,
                  script.fn_imponibile_riga(r.quantita, r.prezzo_unitario, r.sconto_percentuale) AS imponibile_riga_full,
                  -- ⭐ rev 2026-11-03: l'onere non si evade — evaso e residuo NULL.
                  CASE WHEN NOT k.e_onere THEN
                      round((COALESCE(ful.qta_evasa_base, (0)::numeric) / NULLIF(r.factor_to_base, (0)::numeric)), 6)
                  END AS qta_evasa_operativa,
                  CASE WHEN NOT k.e_onere THEN
                      round((GREATEST((r.quantita - COALESCE(ful.qta_evasa_base, (0)::numeric)), (0)::numeric) / NULLIF(r.factor_to_base, (0)::numeric)), 6)
                  END AS qta_residua_operativa,
                  r.meta,
                  r.data_insert,
                  r.data_update,
                  r.data_consegna_richiesta_cliente,
                  r.data_consegna_confermata,
                  (EXISTS ( SELECT 1
                         FROM vendite.ordini_righe_componenti rc
                        WHERE ((rc.riga_ordine_id = r.id) AND (rc.attivo IS TRUE)))) AS is_composito_caso_a,
                  (script.fn_check_ordine_riga_data_consegna_confermata(r.id) -> 0) ->> 'reason' AS data_consegna_confermata_blocco,
                  -- rev 2026-11-03: colonne nuove IN CODA.
                  k.e_onere,
                  a.causale_onere_id
                 FROM ((((vendite.ordini_righe r
                   LEFT JOIN catalogo.articoli a ON ((a.id = r.articolo_id)))
                   LEFT JOIN catalogo.unita_misura um ON ((um.id = r.uom_operativa_id)))
                   LEFT JOIN config.iva iva ON ((iva.id = r.iva_id)))
                   LEFT JOIN LATERAL ( SELECT sum(f.qta_evasa) AS qta_evasa_base
                         FROM vendite.ordini_righe_fulfillment f
                        WHERE (f.ordine_riga_id = r.id)) ful ON (true))
                   -- La riga e' un onere: il predicato unico, sulla natura congelata.
                   CROSS JOIN LATERAL ( SELECT NOT script.fn_natura_e_merce(r.natura_vendita_id) AS e_onere) k;

              COMMENT ON VIEW vendite.vw_ordini_righe_dettaglio IS
                  'Righe dell''ordine con articolo, UoM, IVA, evaso e residuo: la SORGENTE delle righe per la lista configurabile vendite.ordine_righe e per il repository (brief-db-liste-righe-documento, D-8.6, 2026-09-28; prima esistevano solo come due query Python con proiezioni diverse). Tutte le righe, anche le non attive: il filtro lo mette chi legge. Nessun ORDER BY. importo_riga = round(…, 2) per mostrare, imponibile_riga_full pieno per chi aggrega, entrambi da script.fn_imponibile_riga. qta_evasa_operativa / qta_residua_operativa: somma dei fulfillment (UoM base) divisa per factor_to_base, residuo mai negativo, 6 decimali, NULL se il fattore e'' zero. security_invoker: ordini_righe e i fulfillment sono in RLS. rev 2026-11-03 (20261103-25, brief-db-addebito-trasporto-ordine §7.3, §8.1): + e_onere e causale_onere_id in coda; sulla riga-onere qta_evasa_operativa e qta_residua_operativa sono NULL (l''onere non si evade).';

              COMMENT ON COLUMN vendite.vw_ordini_righe_dettaglio.e_onere IS
                  'La riga e'' un onere (addebito, non merce): NOT script.fn_natura_e_merce sulla natura CONGELATA della riga. Su ordine «non merce» = onere, perche'' l''ammissione (script.fn_check_articolo_riga_su_contesto) lascia entrare solo merce e articoli-onere. Lo legge il BE per la stampa (oneri dopo gli articoli, brief-db-addebito-trasporto-ordine §7.3) e per la maschera: la regola non si ricostruisce fuori dal DB. Sulla riga-onere evaso e residuo sono NULL.';

              COMMENT ON COLUMN vendite.vw_ordini_righe_dettaglio.causale_onere_id IS
                  'La causale dell''onere (config.causali_onere), letta dall''articolo (catalogo.articoli.causale_onere_id). NULL sulla merce. Il discrimine «e'' un onere» resta e_onere (natura congelata della riga): questa colonna porta il valore per chi raggruppa o etichetta. brief-db-addebito-trasporto-ordine §7.3.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Togliere colonne da una vista e' un DROP + CREATE, e il DROP
              --   perderebbe i grant che da' il loop di ci_apply. Il corpo
              --   precedente e' nella doc auto-gen alla revisione prima di questa.
              SELECT 1;
