      comment: >
        La madre dell'annullo accredito chiama l'helper. ⛔ Dei SEI punti di sollevamento ne cambia UNO.
        ⚠️ E qui il `dettaglio` di un motivo e'' uno SCALARE, non un oggetto: l''helper lo conserva
        sotto la sua chiave invece di fonderlo, che e'' esattamente cio'' che questo sito faceva a mano.
        Piano: brief-db-coda-primo-motivo-in-un-posto-solo, sezione 6.
