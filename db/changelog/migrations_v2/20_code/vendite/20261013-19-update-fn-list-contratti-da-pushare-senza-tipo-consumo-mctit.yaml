# TIPO_CONSUMO SI RITIRA — 4/8: IL LISTER CONTRATTI
#   vendite.fn_list_contratti_da_pushare: via la colonna tipo_consumo dal RETURNS TABLE e la sua
#   proiezione. La madre non ha piu' il parametro (20261013-16).
#
#   DROP + CREATE: un RETURNS TABLE diverso non passa da CREATE OR REPLACE.
#   Firma e RETURNS coi %TYPE e corpo dal 20261010-55, confrontato identico al
#   vivo su zeroerp_ci il 2026-10-13. COMMENT: il vivo + la rev.
#   Chiamanti DB: script.fn_available_actions_ordine (solo per gli ordini,
#   SELECT 1 / EXISTS: non legge la colonna). Il backend legge le colonne per
#   nome (PushableRow): richiesta al team BE.
#   Dipende da: 20261013-16.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261013-19-update-fn-list-contratti-da-pushare-senza-tipo-consumo-mctit.yaml

  - changeSet:
      id: 20261013-19-update-fn-list-contratti-da-pushare-senza-tipo-consumo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_list_contratti_da_pushare: via la colonna tipo_consumo (DROP + CREATE). Decisione A di Tid,
        2026-10-13: tipo_consumo e' ritirato dalla catena del push.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_catalog.pg_proc p WHERE p.oid::regprocedure::text = 'vendite.fn_list_contratti_da_pushare(date,bigint,integer,bigint)'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⛔ MAI con CASCADE: i chiamanti DB sono plpgsql (nessuna riga in
              --    pg_depend), e un CASCADE farebbe sparire in silenzio chi un giorno ne
              --    dipendera'.
              DROP FUNCTION IF EXISTS vendite.fn_list_contratti_da_pushare(date,bigint,integer,bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_list_contratti_da_pushare(p_competenza_mese vendite.attivita_fatturabili.competenza_mese%TYPE DEFAULT NULL::date, p_billing_account_id vendite.contratti.billing_account_id%TYPE DEFAULT NULL::bigint, p_limit integer DEFAULT NULL::integer, p_contratto_id vendite.contratti.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(contratto_id vendite.contratti.id%TYPE, contratto_uid vendite.contratti.uid%TYPE, riga_id vendite.contratti_righe.id%TYPE, billing_account_id vendite.contratti.billing_account_id%TYPE, utility_id vendite.contratti.utility_id%TYPE, emittente_soggetto_ruolo_id bigint, competenza_dal vendite.contratti.valido_dal%TYPE, competenza_al vendite.contratti.valido_al%TYPE, fatturazione_immediata vendite.contratti.fatturazione_immediata%TYPE, sorgente_tipo_id vendite.contratti.sorgente_tipo_id%TYPE, sorgente_uid text, segment_key character varying, articolo_id vendite.contratti_righe.articolo_id%TYPE, istanza_utility_id vendite.contratti.istanza_utility_id%TYPE, data_attivita date, uom_id catalogo.articoli.uom_id%TYPE, quantita vendite.contratti_righe.quantita%TYPE, qta_operativa vendite.contratti_righe.qta_operativa%TYPE, uom_operativa_id vendite.contratti_righe.uom_operativa_id%TYPE, factor_to_base vendite.contratti_righe.factor_to_base%TYPE, competenza_mese vendite.attivita_fatturabili.competenza_mese%TYPE, prezzo_snapshot vendite.contratti_righe.prezzo_unitario%TYPE, prezzo_bloccato boolean, pricing_mode character varying, tipo_movimento character varying, valuta_id integer, meta jsonb, tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE, termine_pagamento_id bigint, modalita_pagamento_id integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_attivo_id     config.stati_doc_contratti.id%TYPE;
              BEGIN
                -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente/stato
                -- risolti per codice_interno (immutabile), non per codice (mutabile).
                -- rev 2026-07-27 (brief emissione mirata PARTE B): fatturazione_immediata
                -- proiettata dalla COLONNA (era la costante FALSE). Il valore instrada
                -- la corsia via chiave di dedup di fn_get_or_create_commessa.
                -- rev 2026-10-04 (brief-db-erogazione-obbligatoria-righe-fatturate R4):
                -- le righe ESCLUSIONE non si listano (l'esclusione non si fattura: prima
                -- arrivavano in commessa senza prezzo, e il resolver risponde
                -- E_ARTICOLO_ESCLUSO_DA_CONTRATTO).
                -- rev 2026-10-10 (brief-db-istanza-nasce-col-ba-residui D-1, D-2): via il
                -- filtro billing_account_id IS NOT NULL (la colonna e' NOT NULL); lo stato
                -- ATTIVO che non si trova nel catalogo solleva E_CODICE come la sorgente,
                -- invece di far cadere il filtro di stato (prima: `IS NULL OR`, cioe'
                -- contratti in qualunque stato).
                -- rev 2026-10-13 (20261013-19, decisione A di Tid): via la colonna
                -- tipo_consumo, dove finiva l'erogazione della riga — la madre la
                -- rifiutava (vocabolario ACCONTO/CONGUAGLIO/STORNO), e nessun contratto
                -- arrivava in commessa. L'erogazione viaggia in meta.tipo_erogazione.
                IF p_contratto_id IS NOT NULL AND p_contratto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_contratto_id', 'valore', p_contratto_id),
                    NULL::uuid,
                    'p_contratto_id', p_contratto_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'CONTRATTO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CONTRATTO'),
                    NULL::uuid, 'CONTRATTO', 'config.sorgenti'
                  );
                END IF;

                SELECT s.id INTO v_stato_attivo_id
                FROM config.stati_doc_contratti s
                WHERE s.codice_interno = 'ATTIVO' AND s.attivo IS TRUE LIMIT 1;

                -- Senza lo stato il filtro non ha un valore: si ferma, come per la
                -- sorgente. Il push non lista mai contratti in uno stato qualunque.
                IF v_stato_attivo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'ATTIVO'),
                    NULL::uuid, 'ATTIVO', 'config.stati_doc_contratti'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  c.id, c.uid, cr.id,
                  c.billing_account_id,
                  c.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(c.billing_account_id),
                  c.valido_dal, c.valido_al,
                  -- Corsia di instradamento: valore reale del contratto.
                  c.fatturazione_immediata,
                  v_sorgente_tipo_id,
                  c.uid::text,
                  ('CONTR:' || c.uid::text || ':R:' || cr.id::text || ':M:' ||
                   to_char(date_trunc('month', COALESCE(c.valido_dal, c.data))::date, 'YYYY-MM'))::varchar,
                  cr.articolo_id,
                  c.istanza_utility_id,
                  COALESCE(c.valido_dal, c.data),
                  -- uom_id canonica da catalogo.articoli (fix bug proiezione NULL)
                  a.uom_id,
                  cr.quantita,
                  cr.qta_operativa,
                  cr.uom_operativa_id,
                  COALESCE(cr.factor_to_base, 1::numeric),
                  date_trunc('month', COALESCE(c.valido_dal, c.data))::date,
                  cr.prezzo_unitario,
                  -- prezzo_bloccato: dipende dalla RIGA (prezzo valorizzato),
                  -- INDIPENDENTE dal flag di corsia. Vedi header del changeSet.
                  (cr.prezzo_unitario IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  NULL::integer,
                  jsonb_build_object(
                    'contratto_numero',    c.numero,
                    'periodicita',         cr.periodicita,
                    'generazione_canone',  cr.generazione_canone,
                    'competenza_canone',   cr.competenza_canone,
                    'tipo_erogazione',     cr.tipo_erogazione,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM vendite.contratti c
                JOIN vendite.contratti_righe cr
                  ON cr.contratto_id = c.id
                 AND COALESCE(cr.attivo, TRUE) IS TRUE
                 -- L'esclusione non si fattura: dice solo che il contratto non vende
                 -- quell'articolo del listino.
                 AND cr.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                JOIN catalogo.articoli a ON a.id = cr.articolo_id
                WHERE c.stato_doc_contratto_id = v_stato_attivo_id
                  AND (c.valido_al IS NULL OR c.valido_al >= COALESCE(p_competenza_mese, (SELECT script.fn_data_operativa())))
                  AND (p_competenza_mese IS NULL
                       OR date_trunc('month', COALESCE(c.valido_dal, c.data))::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_contratto_id IS NULL OR c.id = p_contratto_id)
                  -- Esclusione "gia' inviato": eleggibile solo se MAI
                  -- instradata (LIBERA) — classificatore condiviso coi rami
                  -- reason della capability: vede anche i componenti #CMP e
                  -- non dipende piu' da stato_emissione (ALLOCATA basta).
                  AND script.fn_get_stato_push_segment(
                        'CONTR:' || c.uid::text || ':R:' || cr.id::text || ':M:' || to_char(date_trunc('month', COALESCE(c.valido_dal, c.data))::date, 'YYYY-MM')) = 'LIBERA'
                ORDER BY c.id, cr.id
                LIMIT p_limit;
              END
              $function$
              ;

              COMMENT ON FUNCTION vendite.fn_list_contratti_da_pushare(date,bigint,integer,bigint)
              IS 'Lista righe contratto eligible al push su commessa (stato ATTIVO). uom_id da catalogo.articoli (canonica). p_contratto_id opzionale: NULL=batch globale, NOT NULL=singolo contratto. Filtri in AND. Esclude EMESSA via NOT EXISTS. (20260511-33: cr.quantita_fissa -> cr.quantita dopo rename colonna) rev 2026-06-28: sorgente/stato per codice_interno (analisi-hardcoded-codice §3a). rev 2026-07-19: esclusione su ALLOCAZIONE del mese via script.fn_get_stato_push_segment (vede anche componenti #CMP), non piu'' solo EMESSA — brief-db-push-commessa-gia-inviato §4a. rev 2026-07-27: fatturazione_immediata proiettata dalla colonna vendite.contratti.fatturazione_immediata (era costante FALSE) — simmetria del flag di corsia, brief-db-emissione-fattura-per-documento-sorgente PARTE B. prezzo_bloccato resta legato alla riga (prezzo valorizzato): l''accoppiamento flag/prezzo esiste solo sui preventivi. Espone termine_pagamento_id e modalita_pagamento_id a NULL: i contratti non hanno colonne di pagamento, la cascata scende al livello successivo (rev 2026-08-03, T.1). rev 2026-10-04: le righe ESCLUSIONE non si listano (non si fatturano; prima arrivavano in commessa senza prezzo, e per quell''articolo il resolver risponde E_ARTICOLO_ESCLUSO_DA_CONTRATTO) e l''erogazione della riga senza ripiego su CANONE, obbligatoria per CHECK su ogni riga che non e'' ESCLUSIONE, andava nella colonna tipo_consumo (ritirata il 2026-10-13) — brief-db-erogazione-obbligatoria-righe-fatturate R4. rev 2026-10-10 (20261010-55): via il filtro billing_account_id IS NOT NULL (colonna NOT NULL); lo stato ATTIVO assente dal catalogo solleva E_CODICE (config.stati_doc_contratti) invece di far cadere il filtro di stato. Brief: brief-db-istanza-nasce-col-ba-residui (D-1, D-2). rev 2026-10-13 (20261013-19): tipo_consumo RITIRATO in tutta la catena del push (madre, batch, cinque lister, builder pgTAP). Non aveva un lettore, e il vocabolario della madre (ACCONTO/CONGUAGLIO/STORNO) non lo produceva nessuna sorgente con un significato: preventivi, ordini e DDT scrivevano la costante CONGUAGLIO, contratti (l''erogazione della riga) e consumi (CONSUMO) un valore che la madre rifiutava, quindi il loro push falliva sempre (E_PARAMETRO_INVALIDO). L''erogazione resta dove gia'' stava, in meta.tipo_erogazione. Decisione A di Tid, 2026-10-13. Colonna tipo_consumo tolta dal RETURNS TABLE (DROP + CREATE).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Il rollback NON ricrea la versione precedente: va ri-applicato il
              --    20261010-55 (dopo il DROP di questa forma) insieme al rollback del 20261013-16.
              SELECT 1;
