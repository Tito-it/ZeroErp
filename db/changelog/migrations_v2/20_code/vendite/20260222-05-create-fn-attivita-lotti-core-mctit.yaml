databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260222-05-create-fn-attivita-lotti-core-mctit.yaml

  - changeSet:
      id: 20260222-05-01-create-fn-get-or-create-lotto-attivita
      author: mctit
      comment: "Get/create lotto attivita con fallback emittente e coerenza BA/utility"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_lotto_attivita(
                p_lotto_id vendite.attivita_fatturabili_lotti.id%TYPE DEFAULT NULL::bigint,
                p_competenza_mese vendite.attivita_fatturabili_lotti.competenza_mese%TYPE DEFAULT NULL::date,
                p_utility_id vendite.attivita_fatturabili_lotti.utility_id%TYPE DEFAULT NULL::integer,
                p_billing_account_id vendite.attivita_fatturabili_lotti.billing_account_id%TYPE DEFAULT NULL::bigint,
                p_sorgente_tipo_id vendite.attivita_fatturabili_lotti.sorgente_tipo_id%TYPE DEFAULT NULL::bigint,
                p_lock_batch_id vendite.attivita_fatturabili_lotti.lock_batch_id%TYPE DEFAULT NULL::uuid,
                p_meta vendite.attivita_fatturabili_lotti.meta%TYPE DEFAULT NULL::jsonb,
                p_emittente_soggetto_ruolo_id vendite.attivita_fatturabili_lotti.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL::bigint
              )
              RETURNS vendite.attivita_fatturabili_lotti.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_lotto_id vendite.attivita_fatturabili_lotti.id%TYPE;
                v_competenza vendite.attivita_fatturabili_lotti.competenza_mese%TYPE;
                v_utility_id vendite.attivita_fatturabili_lotti.utility_id%TYPE;
                v_billing_account_id vendite.attivita_fatturabili_lotti.billing_account_id%TYPE;
                v_sorgente_tipo_id vendite.attivita_fatturabili_lotti.sorgente_tipo_id%TYPE;
                v_emittente_id vendite.attivita_fatturabili_lotti.emittente_soggetto_ruolo_id%TYPE;
                v_stato_lotto vendite.attivita_fatturabili_lotti.stato_lotto%TYPE;
                v_stato_operativo vendite.attivita_fatturabili_lotti.stato_operativo%TYPE;
                v_utility_from_ba anagrafiche.billing_account.utility_id%TYPE;
                v_emittente_from_ba anagrafiche.soggetti_ruoli.id%TYPE;
                v_emittente_attivo boolean;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recupera un lotto attivita esistente o lo crea se assente.
                --
                -- Regole:
                --   - fallback emittente tramite fn_get_emittente_fiscale_id
                --   - coerenza BA -> utility e BA -> emittente
                --   - blocco riuso lotto se IN_ESECUZIONE + stato_operativo CHIUSO
                -- =========================================================

                IF p_lotto_id = 0 THEN
                  p_lotto_id := NULL;
                END IF;

                IF p_lotto_id IS NOT NULL AND p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id non valido')),
                    NULL::uuid, 'lotto_id non valido'
                  );
                END IF;

                IF p_competenza_mese IS NOT NULL THEN
                  v_competenza := date_trunc('month', p_competenza_mese)::date;
                END IF;

                IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility_id non valido','utility_id',p_utility_id)),
                    NULL::uuid, 'utility_id non valido'
                  );
                END IF;

                IF p_billing_account_id IS NOT NULL AND p_billing_account_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account_id non valido','billing_account_id',p_billing_account_id)),
                    NULL::uuid, 'billing_account_id non valido'
                  );
                END IF;

                IF p_sorgente_tipo_id IS NOT NULL AND p_sorgente_tipo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','sorgente_tipo_id non valido','sorgente_tipo_id',p_sorgente_tipo_id)),
                    NULL::uuid, 'sorgente_tipo_id non valido'
                  );
                END IF;

                IF p_emittente_soggetto_ruolo_id IS NOT NULL AND p_emittente_soggetto_ruolo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente_soggetto_ruolo_id non valido','emittente_soggetto_ruolo_id',p_emittente_soggetto_ruolo_id)),
                    NULL::uuid, 'emittente_soggetto_ruolo_id non valido'
                  );
                END IF;

                v_utility_id := p_utility_id;
                v_billing_account_id := p_billing_account_id;
                v_sorgente_tipo_id := p_sorgente_tipo_id;

                IF v_billing_account_id IS NOT NULL THEN
                  SELECT ba.utility_id
                    INTO v_utility_from_ba
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = v_billing_account_id;

                  IF v_utility_from_ba IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non risolta da billing_account','billing_account_id',v_billing_account_id)),
                      NULL::uuid, 'utility non risolta da billing_account'
                    );
                  END IF;

                  IF v_utility_id IS NOT NULL AND v_utility_id <> v_utility_from_ba THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente con billing_account','billing_account_id',v_billing_account_id,'utility_id',v_utility_id)),
                      NULL::uuid, 'utility non coerente con billing_account'
                    );
                  END IF;

                  v_utility_id := COALESCE(v_utility_id, v_utility_from_ba);
                END IF;

                v_emittente_id := p_emittente_soggetto_ruolo_id;
                v_emittente_from_ba := anagrafiche.fn_get_emittente_fiscale_id(v_billing_account_id);

                IF v_emittente_id IS NOT NULL AND v_billing_account_id IS NOT NULL AND v_emittente_id <> v_emittente_from_ba THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente non coerente con billing_account','billing_account_id',v_billing_account_id,'emittente_soggetto_ruolo_id',v_emittente_id,'emittente_atteso',v_emittente_from_ba)),
                    NULL::uuid, 'emittente non coerente con billing_account'
                  );
                END IF;

                IF v_emittente_id IS NULL THEN
                  v_emittente_id := v_emittente_from_ba;
                END IF;

                SELECT EXISTS (
                  SELECT 1
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.soggetto_ruolo_id = v_emittente_id
                     AND ef.attivo IS TRUE
                )
                INTO v_emittente_attivo;

                IF COALESCE(v_emittente_attivo, false) IS FALSE THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente fiscale non attivo/non valido','emittente_soggetto_ruolo_id',v_emittente_id)),
                    NULL::uuid, 'emittente fiscale non attivo/non valido'
                  );
                END IF;

                IF p_lotto_id IS NOT NULL THEN
                  SELECT competenza_mese, utility_id, billing_account_id, sorgente_tipo_id,
                         emittente_soggetto_ruolo_id, stato_lotto, stato_operativo
                    INTO v_competenza, v_utility_id, v_billing_account_id, v_sorgente_tipo_id,
                         v_emittente_id, v_stato_lotto, v_stato_operativo
                    FROM vendite.attivita_fatturabili_lotti
                   WHERE id = p_lotto_id;

                  IF v_competenza IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato')),
                      NULL::uuid, concat('lotto non trovato lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_competenza_mese IS NOT NULL AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza non coerente')),
                      NULL::uuid, 'competenza non coerente'
                    );
                  END IF;

                  IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente')),
                      NULL::uuid, 'utility non coerente'
                    );
                  END IF;

                  IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account non coerente')),
                      NULL::uuid, 'billing_account non coerente'
                    );
                  END IF;

                  IF p_sorgente_tipo_id IS NOT NULL AND p_sorgente_tipo_id <> v_sorgente_tipo_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','sorgente_tipo non coerente')),
                      NULL::uuid, 'sorgente_tipo non coerente'
                    );
                  END IF;

                  IF p_emittente_soggetto_ruolo_id IS NOT NULL AND p_emittente_soggetto_ruolo_id <> v_emittente_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente non coerente')),
                      NULL::uuid, 'emittente non coerente'
                    );
                  END IF;

                  IF v_stato_lotto = 'IN_ESECUZIONE' AND v_stato_operativo = 'CHIUSO' THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto in esecuzione non riutilizzabile per stato_operativo','stato_operativo',v_stato_operativo)),
                      NULL::uuid, 'lotto in esecuzione non riutilizzabile'
                    );
                  END IF;

                  RETURN p_lotto_id;
                END IF;

                IF p_lock_batch_id IS NOT NULL THEN
                  SELECT id, competenza_mese, utility_id, billing_account_id, sorgente_tipo_id,
                         emittente_soggetto_ruolo_id, stato_lotto, stato_operativo
                    INTO v_lotto_id, v_competenza, v_utility_id, v_billing_account_id, v_sorgente_tipo_id,
                         v_emittente_id, v_stato_lotto, v_stato_operativo
                    FROM vendite.attivita_fatturabili_lotti
                   WHERE lock_batch_id = p_lock_batch_id
                   ORDER BY id DESC
                   LIMIT 1;

                  IF v_lotto_id IS NOT NULL THEN
                    IF p_competenza_mese IS NOT NULL AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza non coerente')),
                        NULL::uuid, 'competenza non coerente'
                      );
                    END IF;

                    IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente')),
                        NULL::uuid, 'utility non coerente'
                      );
                    END IF;

                    IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account non coerente')),
                        NULL::uuid, 'billing_account non coerente'
                      );
                    END IF;

                    IF p_sorgente_tipo_id IS NOT NULL AND p_sorgente_tipo_id <> v_sorgente_tipo_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','sorgente_tipo non coerente')),
                        NULL::uuid, 'sorgente_tipo non coerente'
                      );
                    END IF;

                    IF p_emittente_soggetto_ruolo_id IS NOT NULL AND p_emittente_soggetto_ruolo_id <> v_emittente_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente non coerente')),
                        NULL::uuid, 'emittente non coerente'
                      );
                    END IF;

                    IF v_stato_lotto = 'IN_ESECUZIONE' AND v_stato_operativo = 'CHIUSO' THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto in esecuzione non riutilizzabile per stato_operativo','stato_operativo',v_stato_operativo)),
                        NULL::uuid, 'lotto in esecuzione non riutilizzabile'
                      );
                    END IF;

                    RETURN v_lotto_id;
                  END IF;
                END IF;

                IF v_competenza IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza_mese obbligatoria in creazione lotto')),
                    NULL::uuid, 'competenza_mese obbligatoria in creazione lotto'
                  );
                END IF;

                INSERT INTO vendite.attivita_fatturabili_lotti (
                  lock_batch_id,
                  competenza_mese,
                  utility_id,
                  billing_account_id,
                  sorgente_tipo_id,
                  stato_lotto,
                  stato_operativo,
                  emittente_soggetto_ruolo_id,
                  meta
                )
                VALUES (
                  COALESCE(p_lock_batch_id, uuidv7()),
                  v_competenza,
                  v_utility_id,
                  v_billing_account_id,
                  v_sorgente_tipo_id,
                  'IN_ESECUZIONE',
                  'APERTO',
                  v_emittente_id,
                  COALESCE(p_meta, '{}'::jsonb)
                )
                RETURNING id INTO v_lotto_id;

                RETURN v_lotto_id;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_lotto_attivita(bigint, date, integer, bigint, bigint, uuid, jsonb, bigint)
              IS 'Recupera o crea lotto attivita; valida coerenza BA/utility/emittente e applica fallback emittente fiscale.';

  - changeSet:
      id: 20260222-05-02-create-fn-sync-attivita-stato-esecuzione
      author: mctit
      comment: "Sincronizza stato_esecuzione su attivita collegate al lotto"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_attivita_stato_esecuzione(
                p_lotto_attivita_id vendite.attivita_fatturabili_lotti.id%TYPE,
                p_target_stato_esecuzione vendite.attivita_fatturabili.stato_esecuzione%TYPE DEFAULT NULL::varchar
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_lotto vendite.attivita_fatturabili_lotti.stato_lotto%TYPE;
                v_target vendite.attivita_fatturabili.stato_esecuzione%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Sincronizza stato_esecuzione sulle attivita del lotto.
                --
                -- Regole:
                --   - target esplicito opzionale
                --   - fallback da stato_lotto: IN_ESECUZIONE/RUNNING,
                --     COMPLETATO/COMPLETED, ERRORE/ERRORE
                --   - attivita fatturate sempre COMPLETED
                -- =========================================================

                IF p_lotto_attivita_id IS NULL OR p_lotto_attivita_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_attivita_stato_esecuzione', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_attivita_id obbligatorio')),
                    NULL::uuid, 'lotto_attivita_id obbligatorio'
                  );
                END IF;

                SELECT l.stato_lotto
                  INTO v_stato_lotto
                  FROM vendite.attivita_fatturabili_lotti l
                 WHERE l.id = p_lotto_attivita_id
                 FOR UPDATE;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_attivita_stato_esecuzione', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto attivita non trovato')),
                    NULL::uuid, 'lotto attivita non trovato'
                  );
                END IF;

                v_target := upper(btrim(COALESCE(p_target_stato_esecuzione, '')));
                IF v_target IS NULL OR v_target = '' THEN
                  v_target := CASE
                                WHEN v_stato_lotto = 'IN_ESECUZIONE' THEN 'RUNNING'
                                WHEN v_stato_lotto = 'COMPLETATO' THEN 'COMPLETED'
                                WHEN v_stato_lotto = 'ERRORE' THEN 'ERRORE'
                                ELSE 'PENDING'
                              END;
                END IF;

                IF v_target NOT IN ('PENDING','RUNNING','COMPLETED','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_sync_attivita_stato_esecuzione', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_esecuzione target non valido','stato_esecuzione',v_target)),
                    NULL::uuid, 'stato_esecuzione target non valido'
                  );
                END IF;

                UPDATE vendite.attivita_fatturabili a
                   SET stato_esecuzione = CASE
                         WHEN a.fatturato IS TRUE THEN 'COMPLETED'
                         ELSE v_target
                       END,
                       data_update = now(),
                       user_update = current_user
                 WHERE a.lotto_attivita_id = p_lotto_attivita_id
                   AND a.stato_esecuzione IS DISTINCT FROM CASE
                         WHEN a.fatturato IS TRUE THEN 'COMPLETED'
                         ELSE v_target
                       END;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_sync_attivita_stato_esecuzione(bigint, varchar)
              IS 'Sincronizza stato_esecuzione sulle attivita del lotto (PENDING|RUNNING|COMPLETED|ERRORE).';

  - changeSet:
      id: 20260222-05-03-create-fn-set-attivita-lotto-stato
      author: mctit
      comment: "Aggiorna stato_lotto/stato_operativo lotto attivita e invoca sync stato_esecuzione"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_set_attivita_lotto_stato(
                p_lotto_id vendite.attivita_fatturabili_lotti.id%TYPE,
                p_stato_lotto vendite.attivita_fatturabili_lotti.stato_lotto%TYPE,
                p_note text DEFAULT NULL::text
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente vendite.attivita_fatturabili_lotti.stato_lotto%TYPE;
                v_stato_lotto_input vendite.attivita_fatturabili_lotti.stato_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Aggiorna stato tecnico e operativo del lotto attivita.
                --
                -- Regole:
                --   - IN_ESECUZIONE -> COMPLETATO | ERRORE
                --   - ERRORE -> IN_ESECUZIONE
                --   - COMPLETATO -> IN_ESECUZIONE
                -- =========================================================

                IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_stato_lotto IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_attivita_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id e stato_lotto obbligatori')),
                    NULL::uuid, 'lotto_id e stato_lotto obbligatori'
                  );
                END IF;

                v_stato_lotto_input := upper(btrim(p_stato_lotto));

                IF v_stato_lotto_input NOT IN ('IN_ESECUZIONE','COMPLETATO','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_attivita_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','stato_lotto non valido','stato_lotto',p_stato_lotto)),
                    NULL::uuid, 'stato_lotto non valido'
                  );
                END IF;

                SELECT l.stato_lotto
                  INTO v_stato_corrente
                  FROM vendite.attivita_fatturabili_lotti l
                 WHERE l.id = p_lotto_id
                 FOR UPDATE;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_attivita_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto attivita non trovato')),
                    NULL::uuid, 'lotto attivita non trovato'
                  );
                END IF;

                IF v_stato_corrente = v_stato_lotto_input THEN
                  RETURN;
                END IF;

                IF v_stato_corrente = 'IN_ESECUZIONE' AND v_stato_lotto_input NOT IN ('COMPLETATO','ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_attivita_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa','da',v_stato_corrente,'a',v_stato_lotto_input)),
                    NULL::uuid, 'transizione non ammessa'
                  );
                END IF;

                IF v_stato_corrente = 'ERRORE' AND v_stato_lotto_input <> 'IN_ESECUZIONE' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_attivita_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa','da',v_stato_corrente,'a',v_stato_lotto_input)),
                    NULL::uuid, 'transizione non ammessa'
                  );
                END IF;

                IF v_stato_corrente = 'COMPLETATO' AND v_stato_lotto_input <> 'IN_ESECUZIONE' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_set_attivita_lotto_stato', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','transizione non ammessa','da',v_stato_corrente,'a',v_stato_lotto_input)),
                    NULL::uuid, 'transizione non ammessa'
                  );
                END IF;

                UPDATE vendite.attivita_fatturabili_lotti
                   SET stato_lotto = v_stato_lotto_input,
                       stato_operativo = CASE
                                           WHEN v_stato_lotto_input = 'IN_ESECUZIONE' THEN 'APERTO'
                                           WHEN v_stato_lotto_input = 'COMPLETATO' THEN 'CHIUSO'
                                           WHEN v_stato_lotto_input = 'ERRORE' THEN 'ERRORE'
                                           ELSE stato_operativo
                                         END,
                       meta = CASE
                                WHEN p_note IS NULL THEN meta
                                ELSE jsonb_set(meta, '{note_stato}', to_jsonb(p_note), true)
                              END,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_lotto_id;

                PERFORM vendite.fn_sync_attivita_stato_esecuzione(p_lotto_id, NULL::varchar);
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_set_attivita_lotto_stato(bigint, text, text)
              IS 'Aggiorna stato_lotto/stato_operativo del lotto attivita e sincronizza stato_esecuzione sulle righe.';
