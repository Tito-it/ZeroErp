# «Quali fatture ha questo lotto, e con che chiave» — una definizione sola.
#   Passo R-3 di brief-db-fondo-fattura-ricalcolo-e-governo.md §8.3.
#
# ── PERCHE' ESISTE ──────────────────────────────────────────────────────
#
#   Lo scope delle fatture di un lotto oggi e' scritto in PYTHON
#   (`_SCOPE_FATTURE_LOTTO_SQL` in apps/vendite/db/pipeline_repository.py) e
#   serve a tre cose: la validazione dei campi, il giro di generazione e il
#   giro di applicazione. Il backend lo ha gia' ridotto a una sola copia dalla
#   sua parte — ma resta una regola di dominio scritta fuori dal database.
#
#   Con le due madri per lotto (changeSet -34 e -35) i lettori diventano
#   quattro. La definizione si sposta qui, dove sta il dominio.
#
# ── 🔴 DUE DIFFERENZE DALLA VERSIONE PYTHON, ED E' IL PUNTO ─────────────
#
#   1. **La utility.** La query Python la ricava da
#      `COALESCE(fl.utility_id, ba.utility_id)` — dal LOTTO o dal BILLING
#      ACCOUNT — mentre `fn_genera_fondi_fattura_source` filtra su
#      `f.utility_id`, la colonna DELLA FATTURA. Se le due divergono, la
#      funzione non trova niente e **non fa niente, in silenzio**: nessun
#      errore, nessun log, semplicemente nessun fondo. Qui si legge la
#      colonna che verra' confrontata, e basta.
#
#      ✅ Misurato il 2026-08-15 su dev: 12 fatture in lotto, **zero**
#      divergenze e zero utility mancanti. La correzione e' per «puo'
#      succedere», non per «e' successo» — `vendite.fatture.utility_id` e'
#      nullable, ed e' esattamente il motivo per cui il Python COALESCE-ava.
#
#   2. **Lo scope incompleto ferma il giro.** ⚠️ CAMBIO DI COMPORTAMENTO
#      rispetto a una utility mancante: prima il `COALESCE` la riempiva col
#      valore del billing account e il giro proseguiva **senza fare niente**;
#      adesso `E_PIPELINE_SCOPE_INCOMPLETE` ferma il task. E' la scelta
#      fail-closed, e per il fondo e' quella giusta: una fattura emessa
#      SENZA il fondo che le spettava non se ne accorge nessuno, un task
#      rosso si'.
#
# ── PERCHE' UNA `fn_get_*` PUO' SOLLEVARE ───────────────────────────────
#
#   Perche' lo scope di un documento rotto non e' «vuoto», e' INESISTENTE.
#   Restituire zero righe direbbe «questo lotto non ha niente da fare», che
#   e' una risposta diversa e falsa. La convenzione del progetto
#   (`fn_get_saldo_fattura` e sorelle) e' gia' questa: i getter sollevano su
#   input che non ha senso.
#
#   ⭐ Effetto collaterale voluto: il backend puo' cancellare la validazione
#   Python (`list_fatture_scope_by_lotto`) e leggere da qui — stesso codice
#   errore, stesso momento, una regola sola.
#
# ── ⚠️ RLS ──────────────────────────────────────────────────────────────
#
#   La funzione e' SECURITY INVOKER (il default): `vendite.fatture` ha la RLS
#   operatori e il perimetro resta quello del chiamante. Un lotto che
#   contiene fatture di un altro emittente ne mostra solo la parte visibile —
#   ed e' corretto, perche' e' quella che il chiamante puo' lavorare.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260815-33-create-fn-get-scope-fatture-lotto-mctit.yaml

  - changeSet:
      id: 20260815-33-create-fn-get-scope-fatture-lotto
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nuova vendite.fn_get_scope_fatture_lotto(lotto): la definizione unica
        dello scope per fattura di un lotto, con guard su lotto inesistente e
        su scope incompleto. Legge f.utility_id (la colonna che i giri
        confrontano) invece di COALESCE(lotto, billing account). R-3 §8.3.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: fatturazione_lotti_fatture
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_scope_fatture_lotto(
                      p_lotto_id vendite.fatturazione_lotti.id%TYPE)
               RETURNS TABLE (
                      fattura_id                  vendite.fatture.id%TYPE,
                      billing_account_id          anagrafiche.billing_account.id%TYPE,
                      utility_id                  config.utilities.id%TYPE,
                      tipo_doc_fiscale_id         config.tipi_doc_fiscale.id%TYPE,
                      emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                      valuta_id                   config.valute.id%TYPE)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_incomplete BIGINT[];
              BEGIN
                  -- ===== Guard parametri =====
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_scope_fatture_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  -- ===== Il lotto deve esistere =====
                  -- ⚠️ «lotto inesistente» e «lotto vuoto» sono due risposte
                  --    diverse: la seconda e' legittima (un giro che non ha
                  --    niente da fare), la prima e' un errore del chiamante.
                  --    Senza questo guard sarebbero indistinguibili, perche'
                  --    entrambe darebbero zero righe.
                  IF NOT EXISTS (
                      SELECT 1 FROM vendite.fatturazione_lotti l
                       WHERE l.id = p_lotto_id
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_scope_fatture_lotto', 'E_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::TEXT);
                  END IF;

                  -- ===== Lo scope dev'essere completo =====
                  -- Le tre colonne nullable della chiave. Le altre due
                  -- (billing account ed emittente) sono NOT NULL a schema.
                  SELECT array_agg(f.id ORDER BY f.id)
                    INTO v_incomplete
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND (f.utility_id          IS NULL
                       OR f.tipo_doc_fiscale_id IS NULL
                       OR f.valuta_id           IS NULL);

                  IF v_incomplete IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_scope_fatture_lotto', 'E_PIPELINE_SCOPE_INCOMPLETE',
                          jsonb_build_object(
                              'lotto_id', p_lotto_id,
                              'fatture',  to_jsonb(v_incomplete),
                              'campi',    jsonb_build_array('utility_id', 'tipo_doc_fiscale_id', 'valuta_id')),
                          -- ⚠️ Il valore VARIADIC non e' facoltativo: il
                          --    messaggio di questo codice non ha segnaposti,
                          --    ma senza almeno un argomento la chiamata non
                          --    risolve la firma di fn_log_and_raise_error.
                          NULL::uuid, p_lotto_id::TEXT);
                  END IF;

                  -- ===== Lo scope =====
                  -- ⭐ `f.utility_id` e non COALESCE(lotto, billing account):
                  --    e' la colonna su cui i giri filtrano davvero, e
                  --    passarne un'altra puo' solo produrre un no-op muto.
                  RETURN QUERY
                  SELECT f.id,
                         f.billing_account_id,
                         f.utility_id,
                         f.tipo_doc_fiscale_id,
                         f.emittente_soggetto_ruolo_id,
                         f.valuta_id
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                   ORDER BY f.id;
              END;
              $function$;

              -- ⚠️ COMMENT con i tipi RISOLTI (bigint): il %TYPE vale nella
              --    firma del CREATE, non nell'identificazione.
              COMMENT ON FUNCTION vendite.fn_get_scope_fatture_lotto(BIGINT)
              IS 'Le fatture di un lotto con i cinque elementi di scope che i giri usano come chiave: billing account, utility, tipo doc fiscale, emittente, valuta. Una riga per fattura, ordinata per id. ⭐ E'' la DEFINIZIONE UNICA dello scope del lotto: prima viveva in Python (_SCOPE_FATTURE_LOTTO_SQL) e serviva a validazione, generazione e applicazione; con le due madri per lotto i lettori diventano quattro, e una regola di dominio con quattro lettori non sta fuori dal database. 🔴 Legge `f.utility_id` e NON COALESCE(lotto, billing account) come faceva la versione Python: la colonna della fattura e'' quella su cui fn_genera_fondi_fattura_source filtra, e passarne un''altra non produce un errore ma un NO-OP MUTO — nessun fondo, nessun log. ⚠️ Solleva invece di restituire zero righe in due casi: lotto inesistente (E_LOTTO_NON_TROVATO, che «lotto vuoto» non deve poter mascherare) e scope incompleto (E_PIPELINE_SCOPE_INCOMPLETE, con gli id delle fatture nel contesto). Il secondo e'' un cambio di comportamento voluto: con una utility mancante prima il giro proseguiva senza fare niente, e una fattura emessa senza il fondo che le spettava non se ne accorge nessuno — un task rosso si''. ℹ️ SECURITY INVOKER: il perimetro RLS resta quello del chiamante. R-3 di brief-db-fondo-fattura-ricalcolo-e-governo §8.3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_get_scope_fatture_lotto(BIGINT);
