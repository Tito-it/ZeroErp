# ------------------------------------------------------------
# Il verbo: togliere un documento rotto dal giro, e far ripartire il lotto.
#   brief-db-uscita-documento-dal-giro §5.4 e §5.4-bis.
#
# ── ⭐ IL PROBLEMA CHE CHIUDE ────────────────────────────────────
#   Un giro prende in carico N documenti, uno e' rotto, e il lotto si ferma:
#   gli altri N-1 restano con le bozze in mano. L'unica azione che il database
#   offriva era «annulla» — buttare via tutto, bozze sane comprese.
#
# ── ⭐ FUNZIONE MADRE: UNA `SELECT`, ATOMICA PER COSTRUZIONE ─────
#   Compone piu' scritture (cancellazione bozze + marcatura + reset dei
#   trascinati). Una singola istruzione su connessione autocommit e' atomica per
#   costruzione: qualunque eccezione annulla l'intero effetto (linee-guida-sql
#   §5b). ⛔ Niente orchestrazione lato Python: sarebbe uno stato parziale in
#   attesa di succedere.
#   `SECURITY INVOKER` esplicito: gira come il chiamante, quindi RLS e perimetro
#   emittente restano applicati identici.
#
# ── ⭐ LA MADRE NON RISCRIVE IL PREDICATO: LO CHIAMA ─────────────
#   `script.fn_check_documento_escludibile_da_giro` e' la stessa funzione da cui
#   il frontend prende il motivo del pulsante spento. Cosi' tooltip e rifiuto
#   non «coincidono oggi»: non possono divergere. ⚠️ E si solleva il PRIMO
#   motivo — l'ordine dell'array e' il contratto.
#
# ── ⭐ D-2b: LA BOZZA CONDIVISA SI CANCELLA LO STESSO ────────────
#   Una bozza puo' coprire piu' documenti. Si cancella comunque, e gli altri
#   vengono TRASCINATI: tornano «da emettere» e si fatturano al giro dopo. La
#   bozza e' pre-fiscale, quindi non si distrugge niente — si rimanda.
#   ⛔ Rifiutare l'uscita su una bozza condivisa lascerebbe bloccati anche i
#   documenti di un'ALTRA bozza: il sequestro di partenza, in forma piu' stretta.
#
# ── ⚠️ L'ORDINE DEI PASSI E' PORTANTE ───────────────────────────
#   I trascinati si leggono PRIMA di cancellare: dopo, il legame non c'e' piu'
#   e la funzione direbbe «non trascina nessuno» su un lotto che ha appena
#   riaperto tre documenti.
#
# ── ⭐ I TRASCINATI TORNANO A `PENDING`, NON A `ESCLUSO` ─────────
#   Non sono usciti da niente: esce UNO, gli altri tornano in coda. E il loro
#   esito non puo' restare `COMPLETED` — direbbe «e' andato bene» su un
#   documento che non ha piu' nessuna fattura. `PENDING` e' gia' nel vocabolario
#   e dice il vero: preso in carico, non ancora concluso.
#
# ── ⛔ NON SI TOCCA IL PERIMETRO (D-1) ──────────────────────────
#   `fatturazione_lotti_gruppi` dice CHE COSA il giro ha chiesto di fatturare.
#   Il documento uscito resta li': se fra un mese qualcuno chiede perche' quel
#   documento non e' in quella fattura, la risposta deve stare nel lotto.
#
# Verifica: db/pgtap/vendite/test-uscita-documento-dal-giro-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-06-create-fn-escludi-documento-da-giro-mctit.yaml

  - changeSet:
      id: 20260908-06-create-fn-escludi-documento-da-giro
      author: mctit
      failOnError: true
      comment: >
        vendite.fn_escludi_documento_da_giro: toglie un documento rotto dal giro
        di fatturazione. Cancella le bozze che lo contengono (componendo
        fn_elimina_fattura_da_lotto), marca il suo esito ESCLUSO col motivo, e
        riporta a PENDING i documenti trascinati. Il lotto riparte quando non
        restano criticita' di documenti ancora in gioco.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti_esiti
                columnName: uscita_motivo
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_check_documento_escludibile_da_giro'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_escludi_documento_da_giro(
                  p_lotto_id   bigint,
                  p_gruppo_key text,
                  p_motivo     text)
              RETURNS jsonb
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: togliere UN documento dal giro di fatturazione, cosi' che
              --        il lotto possa ripartire con quelli che restano.
              -- Ritorna: un consuntivo di cio' che e' stato fatto, perche' il
              --        chiamante deve poterlo raccontare all'operatore.
              DECLARE
                  v_motivi      jsonb;
                  v_trascinati  jsonb;
                  v_fatture     bigint[];
                  v_fattura_id  vendite.fatture.id%TYPE;
                  v_cancellate  integer := 0;
                  v_riemesse    integer := 0;
                  v_riaperti    integer := 0;
                  v_esito_riga  RECORD;
              BEGIN
                  -- ── Guard di parametro ────────────────────────────────
                  -- ⚠️ Il motivo vuoto NON e' una condizione di dominio: il
                  --    frontend lo rende obbligatorio, quindi se arriva vuoto e'
                  --    un chiamante rotto. Il CHECK di tabella lo rifiuterebbe
                  --    comunque, ma con un messaggio che non parla all'operatore.
                  IF COALESCE(btrim(p_motivo), '') = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_escludi_documento_da_giro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_motivo'),
                          NULL::uuid, 'p_motivo obbligatorio: un documento che esce senza motivo non e'' spiegabile');
                  END IF;

                  -- ── Le precondizioni: sede unica, non riscritte qui ───
                  v_motivi := script.fn_check_documento_escludibile_da_giro(p_lotto_id, p_gruppo_key);
                  IF jsonb_array_length(v_motivi) > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_escludi_documento_da_giro',
                          v_motivi -> 0 ->> 'codice',
                          jsonb_build_object('lotto_id', p_lotto_id,
                                             'gruppo_key', p_gruppo_key,
                                             -- L'elenco COMPLETO nel contesto: il
                                             -- backend puo' mostrarli tutti anche
                                             -- se la frase ne nomina uno.
                                             'motivi', v_motivi,
                                             'bersaglio', jsonb_build_array(
                                                 jsonb_build_object('tipo', 'LOTTO',
                                                                    'id', p_lotto_id::text))),
                          NULL::uuid,
                          p_gruppo_key,
                          COALESCE(v_motivi -> 0 ->> 'dettaglio', '-'));
                  END IF;

                  -- ── Chi viene via insieme, PRIMA di cancellare ────────
                  -- ⚠️ Dopo la cancellazione il legame non c'e' piu': letto qui
                  --    dopo, direbbe «non trascina nessuno» su un lotto che ha
                  --    appena riaperto tre documenti.
                  v_trascinati := script.fn_gruppi_trascinati_da_uscita(p_lotto_id, p_gruppo_key);

                  SELECT COALESCE(array_agg(DISTINCT r.fattura_id), ARRAY[]::bigint[])
                    INTO v_fatture
                    FROM script.vw_lotto_documento_righe r
                   WHERE r.lotto_id = p_lotto_id
                     AND r.gruppo_key = p_gruppo_key;

                  -- ── Le bozze: si compone la primitiva, non se ne scrive una seconda
                  -- ⭐ fn_elimina_fattura_da_lotto ha la sua check e la sua
                  --    semantica gia' decise (RD-7: togliere = cancellare, le
                  --    attivita' tornano NON_EMESSA). Qui non si duplica niente.
                  -- ⚠️ Puo' essere piu' di una: le righe di un documento possono
                  --    finire in bozze diverse.
                  FOREACH v_fattura_id IN ARRAY v_fatture LOOP
                      SELECT c.deleted_fatture, c.riemesse_attivita
                        INTO STRICT v_esito_riga
                        FROM vendite.fn_elimina_fattura_da_lotto(p_lotto_id, v_fattura_id) AS c;
                      v_cancellate := v_cancellate + COALESCE(v_esito_riga.deleted_fatture, 0);
                      v_riemesse   := v_riemesse   + COALESCE(v_esito_riga.riemesse_attivita, 0);
                  END LOOP;

                  -- ── Il documento esce ────────────────────────────────
                  -- ⚠️ `uscita_quando` e `uscita_da` NON si scrivono qui: le
                  --    deriva il trigger dalla GUC. Scriverle sarebbe una seconda
                  --    sede della stessa regola.
                  UPDATE vendite.fatturazione_lotti_esiti
                     SET stato_esecuzione = 'ESCLUSO',
                         uscita_motivo    = btrim(p_motivo)
                   WHERE lotto_id = p_lotto_id
                     AND gruppo_key = p_gruppo_key;

                  -- ── I trascinati tornano in coda ─────────────────────
                  -- ⛔ `PENDING`, non `ESCLUSO`: non sono usciti da niente, e non
                  --    `COMPLETED`, che direbbe «e' andato bene» su un documento
                  --    che non ha piu' nessuna fattura.
                  IF jsonb_array_length(v_trascinati) > 0 THEN
                      UPDATE vendite.fatturazione_lotti_esiti e
                         SET stato_esecuzione = 'PENDING',
                             errore_codice    = NULL,
                             errore_messaggio = NULL,
                             errore_quando    = NULL
                       WHERE e.lotto_id = p_lotto_id
                         AND e.gruppo_key IN (
                             SELECT jsonb_array_elements_text(v_trascinati))
                         -- ⚠️ Un trascinato che fosse gia' uscito per conto suo
                         --    NON si riapre: dal suo stato terminale non si torna
                         --    indietro, e il guard rifiuterebbe la scrittura.
                         AND e.stato_esecuzione <> 'ESCLUSO';
                      GET DIAGNOSTICS v_riaperti = ROW_COUNT;
                  END IF;

                  RETURN jsonb_build_object(
                      'lotto_id',            p_lotto_id,
                      'gruppo_escluso',      p_gruppo_key,
                      'fatture_cancellate',  v_cancellate,
                      'attivita_riemesse',   v_riemesse,
                      'gruppi_riaperti',     v_trascinati,
                      'n_gruppi_riaperti',   v_riaperti);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_escludi_documento_da_giro(bigint, text, text)
              IS 'Toglie UN documento rotto dal giro di fatturazione, cosi'' che il lotto '
                 'possa ripartire con quelli che restano. Funzione MADRE: una sola '
                 'SELECT, atomica per costruzione, SECURITY INVOKER (RLS e perimetro '
                 'emittente restano applicati). ⭐ Non riscrive il predicato: CHIAMA '
                 'script.fn_check_documento_escludibile_da_giro — la stessa da cui il '
                 'frontend prende il motivo del pulsante spento — e solleva il codice del '
                 'PRIMO motivo, perche'' l''ordine dell''array e'' il contratto. ⭐ Compone '
                 'vendite.fn_elimina_fattura_da_lotto invece di riscriverne la semantica '
                 '(RD-7: togliere = cancellare, le attivita'' tornano NON_EMESSA). '
                 '⭐ D-2b: se la bozza copre PIU'' documenti si cancella lo stesso e li '
                 'TRASCINA — tornano da emettere, con l''esito riportato a PENDING e non '
                 'a ESCLUSO (non sono usciti da niente) ne'' lasciato a COMPLETED (non '
                 'hanno piu'' una fattura). Rifiutare su bozza condivisa lascerebbe '
                 'bloccati anche i documenti di un''ALTRA bozza. ⚠️ I trascinati si '
                 'leggono PRIMA di cancellare: dopo, il legame non esiste piu''. '
                 '⚠️ uscita_quando/uscita_da le deriva il trigger dalla GUC, non questa '
                 'funzione. ⛔ Il perimetro (fatturazione_lotti_gruppi) non si tocca '
                 '(D-1): il lotto ricorda di aver preso in carico anche il documento '
                 'uscito. Brief: brief-db-uscita-documento-dal-giro.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_escludi_documento_da_giro(bigint, text, text);
