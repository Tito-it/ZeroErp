# ------------------------------------------------------------
# fn_create_contratto: i TRE RIFERIMENTI DELL'ATTO entrano nella whitelist
#   (brief-db-fn-create-contratto-codici-atto, voce 2 di
#    brief-db-richieste-aperte-dal-backend)
#
# COSA CAMBIA: tre stringhe dentro `v_testata_allowed` — 'codice_cig',
#   'codice_cup', 'codice_commessa'. Nient'altro: l'INSERT e' gia' generico
#   (`jsonb_populate_record`), le tre colonne esistono dal 20260829-13 con i
#   loro COMMENT, e nessun'altra riga del corpo si muove.
#
# ── ⛔ PERCHE' SERVE, ED E' LO STESSO DIFETTO GIA' PAGATO QUI ──────────
#
#   Il filtro e' `WHERE key = ANY(v_testata_allowed)`: una chiave fuori
#   whitelist non viene RESPINTA, viene **scartata**. Il contratto nasce,
#   l'INSERT riesce, il backend risponde 200, l'operatore non vede nessun
#   errore — e il CIG non va da nessuna parte.
#
#   ⛔ E' identico a quanto successo il 2026-07-27 su QUESTA funzione con
#   `fatturazione_immediata`, ed e' scritto nel commento che gli sta accanto
#   (rev 2026-07-27, subito sopra la whitelist). Ripeterlo sarebbe la forma
#   peggiore di regressione: quella gia' documentata nel punto in cui si
#   ripete.
#
#   ⚠️ E il caso non e' di nicchia: un CIG nasce con la gara, cioe' PRIMA del
#   contratto. Il momento naturale per digitarlo e' la creazione. Oggi
#   l'operatore dovrebbe creare il contratto e poi rientrarci, e nel frattempo
#   il piano BE/FE tiene i tre campi NASCOSTI in creazione apposta, per non
#   offrire caselle che il database butta via.
#
# ── ⭐ QUI NON C'E' LA TRAPPOLA «CHIAVE ASSENTE vs CHIAVE NULL» ────────
#
#   Vale per `fatturazione_immediata`, che e' NOT NULL con DEFAULT false: li'
#   un `null` esplicito diventa un 23502 e il BE deve OMETTERE la chiave.
#   Le tre nuove sono **nullable**: un `null` e' un valore legittimo e
#   significa «non c'e' un CIG». Il backend puo' mandarle sempre, e questa
#   differenza va conosciuta perche' il contratto per il BE non e' lo stesso
#   sulle due famiglie di chiavi.
#
# ── ℹ️ COSA NON SI E' FATTO, E PERCHE' ────────────────────────────────
#
#   Non si e' resa fail-loud la whitelist nel suo insieme (chiave ignota ->
#   errore invece che scarto silenzioso). Sarebbe un cambio di comportamento
#   su TUTTE le chiavi di una madre gia' in uso dal backend, e resta la
#   proposta §6 del brief di luglio: fuori dal perimetro di questa voce.
#
# Firma e RETURNS TABLE INVARIATI -> CREATE OR REPLACE puro, nessun DROP.
#
# Base: doc auto-gen docs/it/dbzero/vendite/funzioni/fn_create_contratto.md
#   (corpo vivo, verificato identico al 20260727-40 — nessuna revisione
#   intermedia: `ls 20_code/vendite | grep create-contratto` da' due soli file)
#   + 20260727-40 per la firma con %TYPE, che l'auto-gen scioglie.
#   Dipendenze: 20260829-13 (colonne codice_cig/codice_cup/codice_commessa).
# Verifica: db/pgtap/vendite/test-fn-create-contratto-v1.sql, casi 13-15.
#   ⚠️ Casi aggiunti al file ESISTENTE e non in uno nuovo: e' lo stesso difetto
#   dei casi 10-12 (fatturazione_immediata), sulla stessa funzione, ed e' il
#   precedente gia' seguito da quel giro. La copertura di fn_create_contratto
#   sta in un posto solo.
#   ⛔ Il caso 13 e' l'unico che DISCRIMINA: rilegge i tre valori dalla riga.
#   Asserire che la chiamata riesce non prova niente — riesce anche con la
#   whitelist vecchia, perche' la funzione scarta e non solleva.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260831-24-update-fn-create-contratto-codici-atto-mctit.yaml

  - changeSet:
      id: 20260831-24-update-fn-create-contratto-codici-atto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_create_contratto accetta codice_cig, codice_cup e codice_commessa nel
        p_testata (whitelist v_testata_allowed). Nessun'altra modifica: l'INSERT
        e' gia' generico e le tre colonne esistono dal 20260829-13. Senza questa
        voce le tre chiavi venivano SCARTATE in silenzio in creazione, mentre in
        PATCH il backend le scriveva gia': stesso difetto pagato il 2026-07-27
        su questa funzione con fatturazione_immediata. ⭐ Le tre sono nullable,
        quindi qui un null e' un valore legittimo e il BE puo' mandarle sempre —
        differenza voluta rispetto a fatturazione_immediata, che e' NOT NULL.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: codice_cig
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: codice_cup
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: codice_commessa
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_create_contratto(
                  p_testata jsonb,
                  p_utility jsonb DEFAULT NULL
              )
              RETURNS TABLE (
                  contratto_id vendite.contratti.id%TYPE,
                  numero       vendite.contratti.numero%TYPE
              )
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS
              $BODY$
              DECLARE
                  v_numero       vendite.contratti.numero%TYPE;
                  v_stato_id     vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_contratto_id vendite.contratti.id%TYPE;
                  v_cols         text[];
                  v_insert_cols  text;
                  v_select_cols  text;
                  v_sql          text;
                  -- rev 2026-07-27: aggiunta 'fatturazione_immediata' (corsia di
                  -- instradamento, Fase B brief emissione mirata). Va decisa PRIMA
                  -- del push in commessa: in create e' il momento naturale, e senza
                  -- questa voce la chiave veniva scartata in silenzio.
                  -- rev 2026-08-31: aggiunti i TRE RIFERIMENTI DELL'ATTO — CIG, CUP
                  -- e commessa. Stesso difetto della riga sopra, sulla stessa
                  -- funzione: in PATCH il backend li scriveva gia', in CREATE la
                  -- chiave veniva scartata e il contratto nasceva senza il CIG,
                  -- senza nessun errore. ⚠️ A differenza di fatturazione_immediata
                  -- le tre sono NULLABLE: un null e' un valore legittimo e vuol
                  -- dire «non c'e' un CIG», quindi il BE puo' mandarle sempre.
                  v_testata_allowed text[] := ARRAY[
                      'billing_account_id', 'emittente_fiscale_id', 'istanza_utility_id',
                      'utility_id', 'ambito', 'valido_dal', 'valido_al',
                      'parent_contratto_id', 'data', 'listino_id',
                      'tipo_variazione_globale', 'valore_variazione_globale',
                      'categoria_cliente_id_snapshot', 'valuta_id',
                      'fatturazione_immediata',
                      'codice_cig', 'codice_cup', 'codice_commessa', 'meta'
                  ];
                  v_util_allowed text[] := ARRAY[
                      'istanza_utility_id', 'utility_id', 'istanza_dati_precontrattuali_id',
                      'tipo_utenza_id', 'classe_utenza_id', 'param_1_num',
                      'param_2_txt', 'meta'
                  ];
              BEGIN
                  -- ----------------------------------------------------
                  -- 1) Numero contratto (consuma il contatore; rolla con
                  --    la funzione se un qualsiasi step successivo fallisce).
                  -- ----------------------------------------------------
                  v_numero := script.fn_generate_codice('contratto');

                  -- 2) Stato iniziale DRAFT.
                  SELECT s.id
                    INTO v_stato_id
                    FROM config.stati_doc_contratti s
                   WHERE s.codice_interno = 'DRAFT';
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'vendite.fn_create_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_contratti.DRAFT'),
                          NULL::uuid,
                          VARIADIC ARRAY['stato iniziale DRAFT (config.stati_doc_contratti)']
                      );
                  END IF;

                  -- ----------------------------------------------------
                  -- 3) INSERT testata: solo chiavi whitelisted presenti
                  --    (le assenti ereditano default/trigger DB).
                  -- ----------------------------------------------------
                  SELECT array_agg(quote_ident(key) ORDER BY key)
                    INTO v_cols
                    FROM jsonb_object_keys(COALESCE(p_testata, '{}'::jsonb)) AS key
                   WHERE key = ANY(v_testata_allowed);

                  v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                  v_select_cols := COALESCE(
                      ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                 FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                      '');

                  v_sql := format(
                      'INSERT INTO vendite.contratti (numero, stato_doc_contratto_id%s) '
                      'SELECT $1, $2%s '
                      '  FROM jsonb_populate_record(NULL::vendite.contratti, $3) AS r '
                      'RETURNING id',
                      v_insert_cols, v_select_cols);
                  EXECUTE v_sql
                     INTO v_contratto_id
                    USING v_numero, v_stato_id, COALESCE(p_testata, '{}'::jsonb);

                  -- ----------------------------------------------------
                  -- 4) INSERT utility opzionale.
                  -- ----------------------------------------------------
                  IF p_utility IS NOT NULL AND p_utility <> '{}'::jsonb THEN
                      SELECT array_agg(quote_ident(key) ORDER BY key)
                        INTO v_cols
                        FROM jsonb_object_keys(p_utility) AS key
                       WHERE key = ANY(v_util_allowed);

                      v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                      v_select_cols := COALESCE(
                          ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                     FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                          '');

                      v_sql := format(
                          'INSERT INTO vendite.contratti_utilities (contratto_id%s) '
                          'SELECT $1%s '
                          '  FROM jsonb_populate_record(NULL::vendite.contratti_utilities, $2) AS r',
                          v_insert_cols, v_select_cols);
                      EXECUTE v_sql USING v_contratto_id, p_utility;
                  END IF;

                  RETURN QUERY
                  SELECT v_contratto_id, v_numero;
              END;
              $BODY$;

              COMMENT ON FUNCTION vendite.fn_create_contratto(jsonb, jsonb)
              IS 'Funzione madre atomica: genera il numero, crea la testata contratto (stato DRAFT) e l''eventuale riga utility in un''unica statement (o tutto o rollback, contatore numero incluso). INSERT dinamico delle sole chiavi whitelisted presenti (rispetta i default DB). SECURITY INVOKER. Ritorna (contratto_id, numero). rev 2026-07-27: ''fatturazione_immediata'' aggiunta a v_testata_allowed — la corsia di instradamento si decide PRIMA del push in commessa e la create e'' il momento naturale; senza questa voce la chiave veniva scartata in silenzio. rev 2026-08-31: aggiunti ''codice_cig'', ''codice_cup'' e ''codice_commessa'' — i tre riferimenti dell''atto, colonne dal 20260829-13. ⛔ E'' LO STESSO DIFETTO della rev precedente sulla stessa funzione: in PATCH il backend li scriveva gia'', in CREATE la chiave veniva SCARTATA e il contratto nasceva senza il CIG, con un 200 e nessun errore a video. Un CIG nasce con la gara, cioe'' PRIMA del contratto: la creazione e'' il momento naturale per digitarlo. ⚠️ IL FILTRO E'' SULLA PRESENZA DELLA CHIAVE, e la semantica del null NON e'' la stessa su tutte le voci: ''fatturazione_immediata'' e'' NOT NULL con DEFAULT false, quindi chiave assente = DEFAULT e chiave = null = 23502 (il BE deve omettere o mandare un booleano, mai null); i tre codici dell''atto sono NULLABLE, quindi un null e'' un valore legittimo che significa «non c''e'' un CIG» e il BE puo'' mandarli sempre. ⛔ La whitelist resta NON fail-loud (chiave ignota scartata e non respinta): renderla tale cambierebbe il comportamento di TUTTE le chiavi di una madre gia'' in uso dal backend, e resta la proposta §6 di brief-db-fatturazione-immediata-create-contratto. Piano: analisi-fix-transazioni Classe A #2 + brief-db-fatturazione-immediata-create-contratto + brief-db-fn-create-contratto-codici-atto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Rollback: ripristina la whitelist SENZA i tre riferimenti
              -- dell'atto (stato 20260727-40). Il corpo e' identico per il
              -- resto, COMMENT compreso: si torna alla rev 2026-07-27.
              CREATE OR REPLACE FUNCTION vendite.fn_create_contratto(
                  p_testata jsonb,
                  p_utility jsonb DEFAULT NULL
              )
              RETURNS TABLE (
                  contratto_id vendite.contratti.id%TYPE,
                  numero       vendite.contratti.numero%TYPE
              )
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS
              $BODY$
              DECLARE
                  v_numero       vendite.contratti.numero%TYPE;
                  v_stato_id     vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_contratto_id vendite.contratti.id%TYPE;
                  v_cols         text[];
                  v_insert_cols  text;
                  v_select_cols  text;
                  v_sql          text;
                  v_testata_allowed text[] := ARRAY[
                      'billing_account_id', 'emittente_fiscale_id', 'istanza_utility_id',
                      'utility_id', 'ambito', 'valido_dal', 'valido_al',
                      'parent_contratto_id', 'data', 'listino_id',
                      'tipo_variazione_globale', 'valore_variazione_globale',
                      'categoria_cliente_id_snapshot', 'valuta_id',
                      'fatturazione_immediata', 'meta'
                  ];
                  v_util_allowed text[] := ARRAY[
                      'istanza_utility_id', 'utility_id', 'istanza_dati_precontrattuali_id',
                      'tipo_utenza_id', 'classe_utenza_id', 'param_1_num',
                      'param_2_txt', 'meta'
                  ];
              BEGIN
                  v_numero := script.fn_generate_codice('contratto');

                  SELECT s.id
                    INTO v_stato_id
                    FROM config.stati_doc_contratti s
                   WHERE s.codice_interno = 'DRAFT';
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'vendite.fn_create_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_contratti.DRAFT'),
                          NULL::uuid,
                          VARIADIC ARRAY['stato iniziale DRAFT (config.stati_doc_contratti)']
                      );
                  END IF;

                  SELECT array_agg(quote_ident(key) ORDER BY key)
                    INTO v_cols
                    FROM jsonb_object_keys(COALESCE(p_testata, '{}'::jsonb)) AS key
                   WHERE key = ANY(v_testata_allowed);

                  v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                  v_select_cols := COALESCE(
                      ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                 FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                      '');

                  v_sql := format(
                      'INSERT INTO vendite.contratti (numero, stato_doc_contratto_id%s) '
                      'SELECT $1, $2%s '
                      '  FROM jsonb_populate_record(NULL::vendite.contratti, $3) AS r '
                      'RETURNING id',
                      v_insert_cols, v_select_cols);
                  EXECUTE v_sql
                     INTO v_contratto_id
                    USING v_numero, v_stato_id, COALESCE(p_testata, '{}'::jsonb);

                  IF p_utility IS NOT NULL AND p_utility <> '{}'::jsonb THEN
                      SELECT array_agg(quote_ident(key) ORDER BY key)
                        INTO v_cols
                        FROM jsonb_object_keys(p_utility) AS key
                       WHERE key = ANY(v_util_allowed);

                      v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                      v_select_cols := COALESCE(
                          ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                     FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                          '');

                      v_sql := format(
                          'INSERT INTO vendite.contratti_utilities (contratto_id%s) '
                          'SELECT $1%s '
                          '  FROM jsonb_populate_record(NULL::vendite.contratti_utilities, $2) AS r',
                          v_insert_cols, v_select_cols);
                      EXECUTE v_sql USING v_contratto_id, p_utility;
                  END IF;

                  RETURN QUERY
                  SELECT v_contratto_id, v_numero;
              END;
              $BODY$;

              COMMENT ON FUNCTION vendite.fn_create_contratto(jsonb, jsonb)
              IS 'Funzione madre atomica: genera il numero, crea la testata contratto (stato DRAFT) e l''eventuale riga utility in un''unica statement (o tutto o rollback, contatore numero incluso). INSERT dinamico delle sole chiavi whitelisted presenti (rispetta i default DB). SECURITY INVOKER. Ritorna (contratto_id, numero). rev 2026-07-27: ''fatturazione_immediata'' aggiunta a v_testata_allowed — la corsia di instradamento si decide PRIMA del push in commessa e la create e'' il momento naturale; senza questa voce la chiave veniva scartata in silenzio. Il filtro e'' sulla PRESENZA della chiave: chiave assente = DEFAULT false, chiave = null = NOT NULL violation (il BE deve omettere o mandare un booleano, mai null). Piano: analisi-fix-transazioni Classe A #2 + brief-db-fatturazione-immediata-create-contratto.';
