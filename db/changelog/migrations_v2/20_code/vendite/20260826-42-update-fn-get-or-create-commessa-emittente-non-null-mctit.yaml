# L4 — Il COALESCE(..., -1) esce dalla chiave di riuso
#   vendite.fn_get_or_create_commessa(...)   CREATE OR REPLACE, firma IDENTICA
#   Piano: brief-db-emittente-commessa-invariante, L4 (§7.4)
#
# ── ⭐ ERA L'INDIZIO, ED E' SCRITTO NEL BRIEF ───────────────────────
#   Nel WHERE della commessa riusabile c'era
#     COALESCE(c.emittente_soggetto_ruolo_id, -1) = COALESCE(v_emittente, -1)
#   Quel COALESCE difendeva da un NULL che *non dovrebbe potere esistere*:
#   quando il codice si protegge da uno stato impossibile, di solito e' perche'
#   impossibile non e'. Dopo il NOT NULL (20260826-41) lo stato e' davvero
#   impossibile, e il confronto torna un `=` puro.
#
# ── ⚠️ E NON RIAPRE LA TRAPPOLA DEL NULL NELLA CHIAVE ───────────────
#   La trappola gemella e' `IS NOT DISTINCT FROM` DOVE IL NULL PUO' ESSERCI.
#   Qui non puo' piu': la colonna e' NOT NULL e `v_emittente` non e' mai NULL
#   (o arriva dall'override, o dal risolutore che SOLLEVA invece di tornare
#   NULL). Le due dimensioni che restano `IS NOT DISTINCT FROM` — competenza e
#   condizioni di pagamento — sono nullable per davvero e non si toccano.
#
# ── ⛔ IL COALESCE DENTRO L'HASH DELL'ADVISORY LOCK NON SI TOCCA ────
#   Cambiare la stringa che si hasha cambia l'IDENTITA' del lock senza cambiare
#   niente di utile: due sessioni su due revisioni diverse della funzione
#   smetterebbero di serializzarsi. Resta, con il commento che dice perche'.
#
# ⚠️ Il commento sui «tre specchi» e' stato AGGIORNATO, non lasciato: diceva che
#   i tre vanno tenuti identici, e da qui in poi uno dei tre e'
#   deliberatamente diverso. Un commento che descrive il codice di ieri e' la
#   forma piu' economica di bug.
#
# ⚠️ CREATE OR REPLACE con firma IDENTICA: nessun DROP, nessun overload
#   (verificabile con pg_get_function_identity_arguments). Il parametro
#   p_emittente_soggetto_ruolo_id resta: la sua rimozione e' L5, che ha un
#   cancello sul backend.
# ⚠️ Corpo preso dalla doc auto-gen (l'oggetto vivo), firma e RETURNS
#   dall'ultimo YAML (l'auto-gen scioglie i %TYPE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260826-42-update-fn-get-or-create-commessa-emittente-non-null-mctit.yaml

  - changeSet:
      id: 20260826-42-update-fn-get-or-create-commessa-emittente-non-null
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L4: tolto il COALESCE(..., -1) dal WHERE della commessa riusabile. Era l'indizio del
        §3 del brief — quel COALESCE difendeva da un NULL che non dovrebbe potere esistere, e
        quando il codice si protegge da uno stato impossibile di solito e' perche' impossibile
        non e'. Dopo il NOT NULL del 20260826-41 lo stato e' davvero impossibile e il confronto
        torna un `=` puro. ⚠️ Non riapre la trappola del NULL nella chiave: quella e'
        IS NOT DISTINCT FROM dove il NULL PUO' esserci, e qui non puo' piu'. ⛔ Il COALESCE
        dentro l'hash dell'advisory lock NON si tocca: cambiare la stringa hashata cambia
        l'identita' del lock senza guadagno, e due sessioni su revisioni diverse smetterebbero
        di serializzarsi. ⚠️ Il commento sui «tre specchi» e' aggiornato, non lasciato: da qui
        uno dei tre e' deliberatamente diverso. CREATE OR REPLACE con firma identica, nessun
        DROP. Piano: brief-db-emittente-commessa-invariante, L4.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_get_or_create_commessa'
                     AND p.pronargs = 13;
            # Il `=` puro regge solo se la colonna e' davvero NOT NULL.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name   = 'commesse'
                     AND column_name  = 'emittente_soggetto_ruolo_id'
                     AND is_nullable  = 'NO';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_commessa(
                  p_billing_account_id          anagrafiche.billing_account.id%TYPE,
                  p_utility_id                  config.utilities.id%TYPE,
                  p_tipo_commessa               vendite.commesse.tipo_commessa%TYPE DEFAULT 'AUTO',
                  p_policy_fatturazione         vendite.commesse.policy_fatturazione%TYPE DEFAULT 'DA_DOCUMENTO',
                  p_fatturazione_immediata      vendite.commesse.fatturazione_immediata%TYPE DEFAULT FALSE,
                  p_priorita_operativa          vendite.commesse.priorita_operativa%TYPE DEFAULT 'NORMALE',
                  p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL,
                  p_competenza_dal              date DEFAULT NULL,
                  p_competenza_al               date DEFAULT NULL,
                  p_meta                        jsonb DEFAULT '{}'::jsonb,
                  p_force_new                   boolean DEFAULT FALSE,
                  p_termine_pagamento_id        config.termini_pagamento.id%TYPE DEFAULT NULL,
                  p_modalita_pagamento_id       config.modalita_pagamento.id%TYPE DEFAULT NULL
              )
              RETURNS bigint
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: recupera o crea la commessa coerente con il contesto
              --        dimensionale. Da D-R la chiave comprende anche le condizioni
              --        di pagamento: un documento con termine diverso NON riusa una
              --        commessa esistente, ne apre una nuova — cosi' la divergenza
              --        emerge al push e non a valle, in fattura.
              -- Regole: la chiave vive in TRE posti (hash del lock, WHERE del riuso,
              --         INSERT). ⚠️ Dal 2026-08-26 i tre NON sono piu' identici alla
              --         lettera, ed e' voluto: l'emittente e' NOT NULL sulla colonna
              --         (20260826-41), quindi il WHERE lo confronta con `=` puro,
              --         mentre l'hash conserva il proprio COALESCE — cambiare la
              --         stringa che si hasha cambierebbe l'IDENTITA' del lock senza
              --         guadagno. Le DIMENSIONI restano le stesse in tutti e tre:
              --         e' quello che va tenuto uguale, non il testo.
              DECLARE
                  v_commessa_id vendite.commesse.id%TYPE;
                  v_ba_utility  anagrafiche.billing_account.utility_id%TYPE;
                  v_ba_found    BOOLEAN := FALSE;
                  v_emittente   vendite.commesse.emittente_soggetto_ruolo_id%TYPE;
                  v_codice      vendite.commesse.codice%TYPE;
              BEGIN
                  -- Guard: parametri obbligatori
                  IF p_billing_account_id IS NULL OR p_billing_account_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_billing_account_id', 'valore', p_billing_account_id),
                          NULL::uuid, 'p_billing_account_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_utility_id IS NULL OR p_utility_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_utility_id', 'valore', p_utility_id),
                          NULL::uuid, 'p_utility_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_competenza_dal IS NOT NULL AND p_competenza_al IS NOT NULL AND p_competenza_dal > p_competenza_al THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_DATA_AL_MINORE_DAL',
                          jsonb_build_object('competenza_dal', p_competenza_dal, 'competenza_al', p_competenza_al),
                          NULL::uuid, p_competenza_al::text, p_competenza_dal::text
                      );
                  END IF;

                  -- Verifica BA
                  SELECT ba.utility_id, TRUE INTO v_ba_utility, v_ba_found
                    FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;

                  IF NOT v_ba_found THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_VALORE_MANCANTE',
                          jsonb_build_object('billing_account_id', p_billing_account_id),
                          NULL::uuid, concat('billing_account_id ', p_billing_account_id)
                      );
                  END IF;

                  IF v_ba_utility IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_BILLING_ACCOUNT_UTILITY_NULL',
                          jsonb_build_object('billing_account_id', p_billing_account_id),
                          NULL::uuid, p_billing_account_id::text
                      );
                  END IF;

                  IF v_ba_utility <> p_utility_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_commessa', 'E_CLIENTE_UTILITY_MISMATCH_BA',
                          jsonb_build_object('billing_account_id', p_billing_account_id, 'ba_utility_id', v_ba_utility, 'utility_id', p_utility_id),
                          NULL::uuid, p_billing_account_id::text, p_utility_id::text, v_ba_utility::text
                      );
                  END IF;

                  -- Risolve emittente.
                  -- ⚠️ v_emittente non e' mai NULL: o arriva dall'override, o
                  --   arriva dal risolutore, che SOLLEVA invece di tornare NULL.
                  --   ⭐ L'override e' un residuo: dal 2026-08-26 un valore
                  --   diverso da quello derivato lo respinge comunque
                  --   trgfn_commesse_guard_emittente_ba, e la sua rimozione e'
                  --   L5 del brief (ha un cancello sul backend).
                  v_emittente := COALESCE(p_emittente_soggetto_ruolo_id, anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id));

                  IF NOT p_force_new THEN
                      -- SPECCHIO 1 — advisory lock sul contesto dimensionale.
                      -- Le due dimensioni nuove entrano QUI: senza, due push
                      -- concorrenti con termini diversi non si serializzerebbero
                      -- e potrebbero creare due volte la stessa commessa.
                      -- ⛔ Il COALESCE su v_emittente resta anche se il NULL non
                      --    e' piu' possibile: quello che si hasha e' l'IDENTITA'
                      --    del lock, e cambiarla farebbe smettere di
                      --    serializzarsi a due sessioni che girassero su due
                      --    revisioni diverse di questa funzione. Nessun guadagno,
                      --    un rischio.
                      PERFORM pg_advisory_xact_lock(
                          hashtext('fn_get_or_create_commessa'),
                          hashtext(
                              p_billing_account_id::text || E'\x1F' || p_utility_id::text || E'\x1F' ||
                              p_tipo_commessa || E'\x1F' || p_policy_fatturazione || E'\x1F' ||
                              p_fatturazione_immediata::text || E'\x1F' || p_priorita_operativa || E'\x1F' ||
                              COALESCE(v_emittente::text, '') || E'\x1F' ||
                              COALESCE(p_competenza_dal::text, '') || E'\x1F' || COALESCE(p_competenza_al::text, '') || E'\x1F' ||
                              COALESCE(p_termine_pagamento_id::text, '') || E'\x1F' ||
                              COALESCE(p_modalita_pagamento_id::text, '')
                          )
                      );

                      -- SPECCHIO 2 — WHERE della commessa riusabile.
                      -- ⭐ L'emittente si confronta con `=` PURO dal 2026-08-26:
                      --   la colonna e' NOT NULL (20260826-41) e v_emittente non
                      --   e' mai NULL. Il COALESCE(..., -1) che c'era prima
                      --   difendeva da uno stato che il modello non ammette piu'.
                      -- ⚠️ IS NOT DISTINCT FROM resta sulle quattro dimensioni
                      --   davvero nullable (competenza e condizioni di pagamento):
                      --   li' il NULL c'e', e con `=` nessuna commessa verrebbe
                      --   mai riusata.
                      SELECT c.id INTO v_commessa_id
                        FROM vendite.commesse c
                        JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id AND sc.chiude_commessa = FALSE
                       WHERE c.billing_account_id = p_billing_account_id
                         AND c.utility_id = p_utility_id
                         AND c.tipo_commessa = p_tipo_commessa
                         AND c.policy_fatturazione = p_policy_fatturazione
                         AND c.fatturazione_immediata = p_fatturazione_immediata
                         AND c.priorita_operativa = p_priorita_operativa
                         AND c.emittente_soggetto_ruolo_id = v_emittente
                         AND c.competenza_dal IS NOT DISTINCT FROM p_competenza_dal
                         AND c.competenza_al IS NOT DISTINCT FROM p_competenza_al
                         AND c.termine_pagamento_id  IS NOT DISTINCT FROM p_termine_pagamento_id
                         AND c.modalita_pagamento_id IS NOT DISTINCT FROM p_modalita_pagamento_id
                       ORDER BY c.id DESC LIMIT 1;

                      IF v_commessa_id IS NOT NULL THEN RETURN v_commessa_id; END IF;
                  END IF;

                  v_codice := 'CMM-' || to_char(clock_timestamp(), 'YYYYMMDDHH24MISSMS') || '-' || substr(md5(random()::text), 1, 6);

                  -- SPECCHIO 3 — INSERT: la commessa nasce con la chiave completa.
                  INSERT INTO vendite.commesse (codice, tipo_commessa, policy_fatturazione, fatturazione_immediata,
                      priorita_operativa, billing_account_id, utility_id, emittente_soggetto_ruolo_id,
                      competenza_dal, competenza_al, meta,
                      termine_pagamento_id, modalita_pagamento_id)
                  VALUES (v_codice, p_tipo_commessa, p_policy_fatturazione, p_fatturazione_immediata,
                      p_priorita_operativa, p_billing_account_id, p_utility_id, v_emittente,
                      p_competenza_dal, p_competenza_al, COALESCE(p_meta, '{}'::jsonb),
                      p_termine_pagamento_id, p_modalita_pagamento_id)
                  RETURNING id INTO v_commessa_id;

                  RETURN v_commessa_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_commessa(bigint, integer, character varying, character varying, boolean, character varying, bigint, date, date, jsonb, boolean, bigint, integer)
              IS 'Recupera o crea commessa coerente con BA/utility e fallback emittente fiscale. Da D-R la chiave di raggruppamento comprende anche (termine_pagamento_id, modalita_pagamento_id): un documento sorgente con condizioni diverse apre una commessa NUOVA invece di riusarne una. Advisory lock previene la doppia creazione e include le stesse dimensioni del WHERE. rev 2026-08-26 (brief-db-emittente-commessa-invariante, L4): il WHERE confronta l''emittente con un `=` PURO invece di COALESCE(..., -1) — la colonna e'' NOT NULL e v_emittente non e'' mai NULL, quindi quel COALESCE difendeva da uno stato che il modello non ammette piu''. ⛔ Il COALESCE dentro l''hash dell''advisory lock NON e'' stato toccato: quello che si hasha e'' l''IDENTITA'' del lock, e cambiarla farebbe smettere di serializzarsi a due sessioni che girassero su revisioni diverse della funzione. ⚠️ Ne discende che i «tre specchi» (hash, WHERE, INSERT) non sono piu'' identici alla lettera, ed e'' voluto: cio'' che va tenuto uguale sono le DIMENSIONI, non il testo. ⚠️ IS NOT DISTINCT FROM resta sulle quattro dimensioni davvero nullable (competenza dal/al, termine e modalita'' di pagamento): li'' il NULL c''e'', e con `=` nessuna commessa verrebbe mai riusata. ⭐ p_emittente_soggetto_ruolo_id e'' ormai un RESIDUO: l''emittente e'' sempre derivato dal billing account (decisione D-1) e un override diverso lo respinge vendite.trgfn_commesse_guard_emittente_ba; la rimozione del parametro e'' L5 del brief e ha un cancello sul backend.';
      # ⛔ Nessun rollback: ripristinare la revisione precedente (20260801-02)
      #    vorrebbe dire rimettere il COALESCE(..., -1) nel WHERE, che con la
      #    colonna NOT NULL e' innocuo ma FALSO. Il rollback vero di questo
      #    lotto e' quello del 20260826-41.
      rollback:
        - empty: {}
