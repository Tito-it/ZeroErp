databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260209-10-update-trgfn-fatturazione-lotti-guard-stato-mctit.yaml

  - changeSet:
      id: 20260209-10-update-trgfn-fatturazione-lotti-guard-stato
      author: mctit
      #  runOnChange: true
      #   validCheckSum:
      #      - ANY
      comment: "Bypass guard stato lotto per reset tecnico via GUC"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
                  RETURNS trigger
                  LANGUAGE 'plpgsql'
                  COST 100
                  VOLATILE NOT LEAKPROOF
              AS $BODY$
              DECLARE
                v_ok boolean;
                v_bypass text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Valida le transizioni di stato dei lotti usando
                --   config.stati_doc_fiscale_transizioni.
                --
                -- Regole:
                --   - Stato applicabile a lotto (applica_lotto=true).
                --   - Transizione ammessa e non solo_fattura.
                --   - Bypass controllato via GUC per reset tecnico.
                -- =========================================================
                v_bypass := current_setting('zeroerp.maintenance_reset_lotto_draft', true);
                IF v_bypass IS NOT NULL AND lower(v_bypass) IN ('1','true','on','yes') THEN
                  RETURN NEW;
                END IF;

                IF TG_OP = 'UPDATE'
                  AND NEW.stato_doc_fiscale_id IS NOT NULL
                  AND NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id
                THEN
                  IF OLD.stato_doc_fiscale_id IS NULL THEN
                    SELECT s.applica_lotto
                      INTO v_ok
                      FROM config.stati_doc_fiscale s
                    WHERE s.id = NEW.stato_doc_fiscale_id
                      AND s.attivo;

                    IF COALESCE(v_ok, false) = false THEN
                      PERFORM script.fn_log_and_raise_error(
                        'database', 
                        'vendite.trgfn_fatturazione_lotti_guard_stato',
                        'E_GENERICO',
                        jsonb_build_object(
                          'detail','Stato non applicabile a lotto',
                          'stato_id', NEW.stato_doc_fiscale_id
                        ),
                        NULL::uuid,
                        concat('Stato non applicabile a lotto', ' stato_id: ', NEW.stato_doc_fiscale_id::text)
                      );
                    END IF;
                  ELSE
                    SELECT EXISTS (
                      SELECT 1
                        FROM config.stati_doc_fiscale_transizioni t
                      WHERE t.ammesso
                        AND t.stato_from_id = OLD.stato_doc_fiscale_id
                        AND t.stato_to_id = NEW.stato_doc_fiscale_id
                        AND t.solo_fattura = false
                    )
                    INTO v_ok;

                    IF NOT v_ok THEN
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        'vendite.trgfn_fatturazione_lotti_guard_stato',
                        'E_GENERICO',
                        jsonb_build_object(
                          'detail','Transizione stato lotto non ammessa',
                          'from', OLD.stato_doc_fiscale_id,
                          'to', NEW.stato_doc_fiscale_id
                        ),
                        NULL::uuid,
                        concat('Transizione stato lotto non ammessa', 
                                ' from: ', OLD.stato_doc_fiscale_id::text, 
                                ' to: ', NEW.stato_doc_fiscale_id::text)
                      );
                    END IF;
                  END IF;
                END IF;

                RETURN NEW;
              END
              $BODY$;

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
                  IS 'Guard transizioni stato per vendite.fatturazione_lotti basato su config.stati_doc_fiscale_transizioni; bypass via GUC zeroerp.maintenance_reset_lotto_draft.';

  - changeSet:
      id: 20260209-10-02-update-trgfn-fatturazione-lotti-guard-stato
      author: mctit
      comment: "Transizioni stato lotto vincolate a meta.tipo_lotto (se presente)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
                  RETURNS trigger
                  LANGUAGE 'plpgsql'
                  COST 100
                  VOLATILE NOT LEAKPROOF
              AS $BODY$
              DECLARE
                v_ok boolean;
                v_bypass text;
                v_tipo_lotto text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Valida le transizioni di stato dei lotti usando
                --   config.stati_doc_fiscale_transizioni.
                --
                -- Regole:
                --   - Stato applicabile a lotto (applica_lotto=true).
                --   - Transizione ammessa e non solo_fattura.
                --   - Se meta.tipo_lotto e' valorizzato, deve combaciare con
                --     vendite.fatturazione_lotti.tipo_lotto.
                --   - Bypass controllato via GUC per reset tecnico.
                -- =========================================================
                v_bypass := current_setting('zeroerp.maintenance_reset_lotto_draft', true);
                IF v_bypass IS NOT NULL AND lower(v_bypass) IN ('1','true','on','yes') THEN
                  RETURN NEW;
                END IF;

                IF TG_OP = 'UPDATE'
                  AND NEW.stato_doc_fiscale_id IS NOT NULL
                  AND NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id
                THEN
                  IF OLD.stato_doc_fiscale_id IS NULL THEN
                    SELECT s.applica_lotto
                      INTO v_ok
                      FROM config.stati_doc_fiscale s
                     WHERE s.id = NEW.stato_doc_fiscale_id
                       AND s.attivo;

                    IF COALESCE(v_ok, false) = false THEN
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        'vendite.trgfn_fatturazione_lotti_guard_stato',
                        'E_GENERICO',
                        jsonb_build_object(
                          'detail','Stato non applicabile a lotto',
                          'stato_id', NEW.stato_doc_fiscale_id
                        ),
                        NULL::uuid,
                        concat('Stato non applicabile a lotto', ' stato_id: ', NEW.stato_doc_fiscale_id::text)
                      );
                    END IF;
                  ELSE
                    SELECT EXISTS (
                      SELECT 1
                        FROM config.stati_doc_fiscale_transizioni t
                       WHERE t.ammesso
                         AND t.stato_from_id = OLD.stato_doc_fiscale_id
                         AND t.stato_to_id = NEW.stato_doc_fiscale_id
                         AND t.solo_fattura = false
                         AND (
                               (t.meta ->> 'tipo_lotto') IS NULL
                            OR (t.meta ->> 'tipo_lotto') = NEW.tipo_lotto
                         )
                    )
                    INTO v_ok;

                    IF NOT v_ok THEN
                      v_tipo_lotto := COALESCE(NEW.tipo_lotto, '');
                      PERFORM script.fn_log_and_raise_error(
                        'database',
                        'vendite.trgfn_fatturazione_lotti_guard_stato',
                        'E_GENERICO',
                        jsonb_build_object(
                          'detail','Transizione stato lotto non ammessa',
                          'from', OLD.stato_doc_fiscale_id,
                          'to', NEW.stato_doc_fiscale_id,
                          'tipo_lotto', v_tipo_lotto
                        ),
                        NULL::uuid,
                        concat('Transizione stato lotto non ammessa',
                                ' from: ', OLD.stato_doc_fiscale_id::text,
                                ' to: ', NEW.stato_doc_fiscale_id::text,
                                ' tipo_lotto: ', v_tipo_lotto)
                      );
                    END IF;
                  END IF;
                END IF;

                RETURN NEW;
              END
              $BODY$;

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
                  IS 'Guard transizioni stato per vendite.fatturazione_lotti basato su config.stati_doc_fiscale_transizioni; vincolo meta.tipo_lotto (se presente); bypass via GUC zeroerp.maintenance_reset_lotto_draft.';
