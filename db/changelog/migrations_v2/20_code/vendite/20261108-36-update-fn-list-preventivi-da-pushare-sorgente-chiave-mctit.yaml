# IL LISTER DEL PUSH CHIAMA LA CHIAVE COL SUO NOME: sorgente_chiave in vendite.fn_list_preventivi_da_pushare
#   Brief: brief-db-sorgente-documento-e-riga §7.2 «Il giro K.2» (decisione e via di Tid del 2026-11-07).
#
#   La colonna sorgente_uid del RETURNS TABLE diventa sorgente_chiave: e' la chiave
#   del documento come la riceve la madre (p_sorgente_chiave, 20261108-23) e come la
#   legge il batch (la chiave JSON sorgente_chiave, 20261108-24). Il nome sorgente_uid
#   diceva «la colonna uuid dei tipi a uid» (S-4), e il batch non la trovava.
#   ⚠️ %TYPE: l'ancora di prima (commesse_attivita.sorgente_uid%TYPE) si era risolta a
#   text al CREATE; oggi la colonna e' uuid (20261107-70), e ricreata darebbe uuid.
#   Il valore e' l'uid in testo che la madre traduce: text esplicito, col perche'
#   accanto. Le altre colonne restano ancorate, e si risolvono ai tipi di prima.
#   Il nome di una colonna di RETURNS TABLE non cambia con CREATE OR REPLACE: DROP +
#   CREATE della stessa firma. Nessun oggetto dipende dalla funzione (pg_depend, dbdev
#   e scratch, 2026-11-07): i chiamanti DB sono plpgsql e non leggono la colonna.
#   Dichiarazione e corpo dall'ultimo YAML (20261031-15), corpo uguale al vivo
#   (dbdev e scratch, 2026-11-07). Il COMMENT si riscrive al presente
#   (linee-guida-sql §5d); il GRANT a zeroerp_app torna, EXECUTE a PUBLIC lo da' la CREATE.
#   ⚠️ CHE COSA CAMBIA: chi legge la colonna per nome (il backend, PushableRow) non la
#   trova fino alla sua voce del §8 (BE-K.2-a).
#   Rollback: il nome di prima torna rieseguendo 20261031-15 dopo un DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261108-36-update-fn-list-preventivi-da-pushare-sorgente-chiave-mctit.yaml

  - changeSet:
      id: 20261108-36-update-fn-list-preventivi-da-pushare-sorgente-chiave
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_list_preventivi_da_pushare: la chiave del documento esce nella colonna sorgente_chiave (DROP + CREATE). brief-db-sorgente-documento-e-riga §7.2 «Il giro K.2» (via di Tid del 2026-11-07).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La colonna della chiave cambia nome nel RETURNS TABLE: CREATE OR REPLACE non lo ammette.
              -- ⛔ MAI con CASCADE: i chiamanti DB sono plpgsql (nessuna riga in pg_depend), e un
              --    CASCADE farebbe sparire in silenzio chi un giorno ne dipendera'.
              DROP FUNCTION vendite.fn_list_preventivi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.preventivi.id%TYPE, bigint[]);

              CREATE FUNCTION vendite.fn_list_preventivi_da_pushare(
                  p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                  -- un tetto di righe del chiamante: nessuna colonna dietro
                  p_limit              integer DEFAULT NULL::integer,
                  p_preventivo_id      vendite.preventivi.id%TYPE DEFAULT NULL::bigint,
                  p_righe_ids          bigint[] DEFAULT NULL::bigint[])
               RETURNS TABLE(
                  -- nudi (utility_id, fatturazione_immediata, termine_pagamento_id, modalita_pagamento_id): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  preventivo_id               vendite.preventivi.id%TYPE,
                  preventivo_uid              vendite.preventivi.uid%TYPE,
                  riga_id                     vendite.preventivi_righe.id%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  utility_id                  integer,
                  emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  competenza_dal              vendite.commesse_attivita.competenza_dal%TYPE,
                  competenza_al               vendite.commesse_attivita.competenza_al%TYPE,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  -- text esplicito, non %TYPE: e' la chiave del documento come la riceve la madre
                  -- (vendite.fn_upsert_commessa_attivita, p_sorgente_chiave), l'uid in testo. Non e' il
                  -- riflesso di una colonna: commesse_attivita.sorgente_uid e' uuid e tiene solo la
                  -- chiave dei tipi a uid.
                  sorgente_chiave             text,
                  segment_key                 vendite.commesse_attivita.segment_key%TYPE,
                  articolo_id                 vendite.commesse_attivita.articolo_id%TYPE,
                  istanza_utility_id          vendite.commesse_attivita.istanza_utility_id%TYPE,
                  data_attivita               vendite.commesse_attivita.data_attivita%TYPE,
                  uom_id                      vendite.commesse_attivita.uom_id%TYPE,
                  quantita                    vendite.commesse_attivita.quantita%TYPE,
                  qta_operativa               vendite.commesse_attivita.qta_operativa%TYPE,
                  uom_operativa_id            vendite.commesse_attivita.uom_operativa_id%TYPE,
                  factor_to_base              vendite.commesse_attivita.factor_to_base%TYPE,
                  competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                  prezzo_snapshot             vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  prezzo_bloccato             vendite.commesse_attivita.prezzo_bloccato%TYPE,
                  pricing_mode                vendite.commesse_attivita.pricing_mode%TYPE,
                  tipo_movimento              vendite.commesse_attivita.tipo_movimento%TYPE,
                  valuta_id                   vendite.commesse_attivita.valuta_id%TYPE,
                  meta                        vendite.commesse_attivita.meta%TYPE,
                  tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        bigint,
                  modalita_pagamento_id       integer)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- rev 2026-10-31 (20261031-15, brief-modello-documento-vendita §17):
              --   lo stato di accettazione dal vocabolario, non 'ACCETTATO'.
              -- rev 2026-10-20 (20261020-93, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave e' PREVENTIVO:<uid>:R:<riga>, composta da
              --   script.fn_segment_key (era PREV:...). Firma e RETURNS ancorati.
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_accettato_id  config.stati_doc_preventivi.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituire le righe preventivo pronte per il push su
                --   commessa, con tutti i campi necessari agli handler.
                --
                -- Regole:
                --   - stato documento ACCETTATO
                --   - predicato di riga dalla vista unica
                --     vw_preventivi_righe_smistabili_commessa (rev 12-06-2026):
                --     riga attiva, quantita > 0, prezzo >= 0, natura NULL
                --     (pregresso) o destinazione_tipo='COMMESSA', non gia'
                --     EMESSA in commessa. La merce (ORDINE) va su
                --     fn_push_preventivo_a_ordine, non qui.
                --   - prezzo_bloccato = fatturazione_immediata
                --   - tipo_commessa target: REALE, policy: DA_DOCUMENTO
                --
                -- rev 2026-10-10: via il filtro di «testata completa»
                --   (billing_account_id, utility_id NOT NULL): le due colonne
                --   sono NOT NULL dal 2026-10-08, il filtro non toglieva
                --   niente. Brief: brief-db-istanza-nasce-col-ba-residui (R-3).
                --   Lo stato ACCETTATO assente dal catalogo solleva E_CODICE,
                --   come la sorgente, invece di far cadere il filtro (D-2).
                --
                -- NOTE codice_interno (rev 2026-06-28, analisi-hardcoded-codice §3a):
                --   sorgente/stato risolti per codice_interno (immutabile), non per
                --   codice (mutabile). Difesa dai rename utente.
                --
                -- Competenza (rev 10-06-2026, brief competenza):
                --   - competenza_dal/al NON nulli (commesse_attivita NOT NULL):
                --     fallback validita -> competenza_mese -> data. GREATEST su
                --     competenza_al garantisce dal<=al anche con validita_dal
                --     NULL + validita_al valorizzato.
                --   - competenza_mese: policy p.competenza_mese autorevole, con
                --     fallback al derivato validita/data per il pregresso.
                --   - competenza_dal/al = periodo attivita'; competenza_mese =
                --     mese di fatturazione (policy). Indipendenti per costruzione.
                --
                -- Estensione 2026-05: p_preventivo_id (opzionale):
                --   NULL = lista globale batch; NOT NULL = singolo preventivo UI-driven.
                -- Estensione 2026-06-12: p_righe_ids (opzionale, brief smistamento):
                --   sottoinsieme righe del pannello; richiede p_preventivo_id.
                --   Righe non eleggibili nel sottoinsieme: skip silenzioso (D5).
                --
                -- NOTE:
                --   - uom_id: UoM canonica da catalogo.articoli (JOIN su pr.articolo_id).
                --     La colonna preventivi_righe.uom_id e` droppata (non usare).
                --   - uom_operativa_id: UoM di inserimento operatore (dalla riga).
                -- =========================================================

                IF p_preventivo_id IS NOT NULL AND p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_preventivi_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_preventivo_id', 'valore', p_preventivo_id),
                    NULL::uuid,
                    'p_preventivo_id', p_preventivo_id::text
                  );
                END IF;

                -- Sottoinsieme righe: ha senso solo sul push singolo UI-driven.
                IF p_righe_ids IS NOT NULL AND p_preventivo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_preventivi_da_pushare', 'E_PUSH_RIGHE_IDS_SENZA_PREVENTIVO',
                    jsonb_build_object('parametro', 'p_righe_ids', 'valore', p_righe_ids),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'PREVENTIVO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_preventivi_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'PREVENTIVO'),
                    NULL::uuid, 'PREVENTIVO', 'config.sorgenti'
                  );
                END IF;

                v_stato_accettato_id := script.fn_stato_accettazione_id('vendite.preventivi'::regclass);

                -- Senza lo stato il filtro non ha un valore: si ferma, come
                -- per la sorgente (rev 2026-10-10, D-2). Prima il filtro era
                -- `IS NULL OR` e cadeva: preventivi in qualunque stato.
                IF v_stato_accettato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_preventivi_da_pushare', 'E_CONFIG_MANCANTE',
                    jsonb_build_object('config', 'config.stati_doc_preventivi.accettazione'),
                    NULL::uuid, 'stato di accettazione (config.stati_doc_preventivi.accettazione)'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  p.id                                                          AS preventivo_id,
                  p.uid                                                         AS preventivo_uid,
                  pr.id                                                         AS riga_id,
                  p.billing_account_id,
                  p.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(p.billing_account_id) AS emittente_soggetto_ruolo_id,
                  -- competenza_dal/al NOT NULL-safe (brief competenza 10-06-2026)
                  COALESCE(p.validita_dal, p.competenza_mese, p.data)           AS competenza_dal,
                  GREATEST(
                    COALESCE(p.validita_dal, p.competenza_mese, p.data),
                    COALESCE(p.validita_al, p.validita_dal, p.competenza_mese, p.data)
                  )                                                             AS competenza_al,
                  p.fatturazione_immediata,
                  v_sorgente_tipo_id                                            AS sorgente_tipo_id,
                  p.uid::text                                                   AS sorgente_chiave,
                  script.fn_segment_key('PREVENTIVO', p.uid::text, pr.id) AS segment_key,
                  pr.articolo_id,
                  p.istanza_utility_id,
                  COALESCE(p.validita_dal, p.data)                              AS data_attivita,
                  -- uom_id canonica da catalogo.articoli (fix bug proiezione NULL)
                  a.uom_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  COALESCE(pr.factor_to_base, 1::numeric)                       AS factor_to_base,
                  -- competenza_mese: policy autorevole, fallback al derivato (pregresso)
                  COALESCE(
                    p.competenza_mese,
                    date_trunc('month', COALESCE(p.validita_dal, p.data))::date
                  )                                                             AS competenza_mese,
                  pr.prezzo_unitario                                            AS prezzo_snapshot,
                  COALESCE(p.fatturazione_immediata, false)                     AS prezzo_bloccato,
                  'FIXED'::varchar                                              AS pricing_mode,
                  'NORMALE'::varchar                                            AS tipo_movimento,
                  p.valuta_id,
                  jsonb_build_object(
                    'preventivo_numero',   p.numero,
                    'preventivo_rev',      p.rev,
                    'tipo_commessa',       'REALE',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  )                                                             AS meta,
                  v_tipo_doc_fiscale_id                                         AS tipo_doc_fiscale_id,
                  p.termine_pagamento_id,
                  NULL::integer
                FROM vendite.preventivi p
                -- Predicato di riga dalla vista unica (eleggibilita' condivisa
                -- con capability e pannello smistamento).
                JOIN vendite.vw_preventivi_righe_smistabili_commessa v
                  ON v.preventivo_id = p.id
                JOIN vendite.preventivi_righe pr ON pr.id = v.id
                JOIN catalogo.articoli a ON a.id = pr.articolo_id
                WHERE p.stato_doc_preventivo_id = v_stato_accettato_id
                  -- Filtro allineato alla stessa espressione del SELECT competenza_mese.
                  AND (p_competenza_mese IS NULL
                       OR COALESCE(
                            p.competenza_mese,
                            date_trunc('month', COALESCE(p.validita_dal, p.data))::date
                          ) = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR p.billing_account_id = p_billing_account_id)
                  AND (p_preventivo_id IS NULL OR p.id = p_preventivo_id)
                  -- Sottoinsieme righe del pannello (skip silenzioso delle non
                  -- eleggibili: gia' escluse dalla vista).
                  AND (p_righe_ids IS NULL OR pr.id = ANY(p_righe_ids))
                ORDER BY p.id, pr.id
                LIMIT p_limit;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_preventivi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.preventivi.id%TYPE, bigint[]) IS
                'Le righe dei preventivi da mandare in commessa: preventivi nello stato di accettazione (script.fn_stato_accettazione_id), righe dalla vista unica vendite.vw_preventivi_righe_smistabili_commessa, che decide quali righe si smistano. p_preventivo_id: un preventivo solo (NULL = tutti); p_righe_ids: un sottoinsieme delle sue righe, che richiede p_preventivo_id (E_PUSH_RIGHE_IDS_SENZA_PREVENTIVO), e le righe non eleggibili restano fuori in silenzio. Un id <= 0 solleva E_PUSH_SORGENTE_ID_INVALIDO, la sorgente PREVENTIVO assente dal catalogo E_CODICE, lo stato di accettazione non configurato E_CONFIG_MANCANTE. Filtri in AND, ordine per preventivo e riga, p_limit come tetto. La chiave del documento esce in sorgente_chiave, l''uid del preventivo in testo, come la riceve la madre vendite.fn_upsert_commessa_attivita (p_sorgente_chiave) e come la legge la chiave sorgente_chiave del batch vendite.fn_batch_upsert_commessa_attivita; la chiave del push PREVENTIVO:<uid>:R:<riga> la compone script.fn_segment_key. prezzo_bloccato segue fatturazione_immediata: sui preventivi il flag di corsia e il prezzo vanno insieme. Espone termine_pagamento_id del preventivo; modalita_pagamento_id e'' NULL, perche'' i preventivi non la portano. Il backend legge le colonne per nome.';

              GRANT EXECUTE ON FUNCTION vendite.fn_list_preventivi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.preventivi.id%TYPE, bigint[]) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il nome di prima torna rieseguendo 20261031-15 dopo un DROP della firma.
              SELECT 1;
