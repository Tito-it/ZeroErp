            sql: |
              COMMENT ON FUNCTION vendite.fn_documento_lineage_archi(bigint[], text[]) IS
                  '⭐ rev 2026-10-19 (20261019-89, brief-db-grammatica-unica-documenti lotto 2b): ricreata dopo '
                  'l''allargamento di vendite.ordini.documento_origine_tipo; l''origine dell''offerta e'' '
                  'OFFERTA_COMMERCIALE, il codice della sorgente (era OFFERTA). ⭐ rev 2026-10-11 (20261011-92): nei'
                  ' rami polimorfi B, E, F, U il join verso il documento e'' un confronto fra colonne dello stesso '
                  'tipo (cs_semi porta la chiave gia'' convertita): un cast nel join non e'' leakproof, e sotto RLS '
                  'faceva leggere l''intera tabella dell''altro capo per ogni sorgente. ⭐ rev 2026-10-11 '
                  '(20261011-67): SET jit = off e SET plan_cache_mode = force_generic_plan sulla funzione. Con un '
                  'seme non costante il piano tiene i rami dei due modi e il JIT ne compilava le espressioni a ogni'
                  ' chiamata; le clausole la rendono non incorporabile e la pianificano una volta per sessione: chi'
                  ' la chiama non deve dichiarare niente. Gli ARCHI della lineage dei documenti, GREZZI (chiavi, '
                  'ruolo, lettera A…U, is_ramo_inverso, rango_origine), per CHIAVE DEL NODO. Seme come '
                  'fn_documento_lineage_nodi: (tipo_id, uid::text) in due array paralleli; entrambi NULL = tutti '
                  'gli archi (vw_documento_lineage_archi ne e'' la proiezione decorata). Col seme: gli archi USCENTI'
                  ' da un nodo del seme e quelli ENTRANTI il cui from non sta nel seme, cioe'' gli archi incidenti, '
                  'ciascuno una volta, con gli stessi DISTINCT della vista. Il seme scende come array (`= ANY`) '
                  'sulla prima tabella di ogni ramo: passato come JOIN, sotto RLS il planner partiva dal lato '
                  'sbagliato. Chi la chiama in un ciclo plpgsql dichiara SET plan_cache_mode = force_generic_plan: '
