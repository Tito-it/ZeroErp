                          WHEN 'G' THEN 30
                          WHEN 'U' THEN 40 WHEN 'R' THEN 40
                          WHEN 'S' THEN 50 WHEN 'T' THEN 50 WHEN 'N' THEN 50
                      END)::smallint AS rango_origine
                FROM archi a;
              END;
