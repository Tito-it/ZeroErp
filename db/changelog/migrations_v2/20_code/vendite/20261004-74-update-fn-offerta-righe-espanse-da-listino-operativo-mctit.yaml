# ------------------------------------------------------------
# vendite.fn_offerta_righe_espanse legge la versione operativa dalla sede
# unica vendite.fn_documento_listino_operativo (20261004-42)
#   Brief: brief-db-righe-esclusione-solo-non-si-vende (R4, regola del 2)
#
# -- PERCHE' ------------------------------------------------------------
#   La domanda «quale versione del listino vale per questa offerta?» ha da
#   oggi una sede sola, comune a contratto e offerta. Questa funzione la
#   riscriveva per conto suo (SELECT sulla testata + ripiego sulla versione
#   in vigore): resterebbe la sola copia. Si ritira nello stesso giro.
#
# -- COSA CAMBIA --------------------------------------------------------
#   Solo l'intestazione: la SELECT sulla testata e il ripiego lasciano il
#   posto alla chiamata del risolutore, che risponde con la stessa regola
#   (versione fissata, o in vigore oggi; l'offerta ha sempre un listino).
#   Le tre parti della query sono quelle vive (doc auto-gen =
#   pg_get_functiondef sullo scratch, 2026-10-04: il 20260928-40),
#   carattere per carattere.
#   Firma e RETURNS TABLE invariati nei tipi base; ancorati con %TYPE
#   (iva_id e sconto_percentuale alla riga d'ordine, la loro destinazione:
#   integer e numeric, come prima). Restano nudi origine (etichetta
#   calcolata) e componenti (jsonb composto).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261004-74-update-fn-offerta-righe-espanse-da-listino-operativo-mctit.yaml

  - changeSet:
      id: 20261004-74-update-fn-offerta-righe-espanse-da-listino-operativo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_offerta_righe_espanse: versione operativa e variazione da
        vendite.fn_documento_listino_operativo, sede unica. Firma e colonne invariate. Brief:
        brief-db-righe-esclusione-solo-non-si-vende (R4).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_documento_listino_operativo';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_offerta_righe_espanse(
                  p_offerta_id vendite.offerte_commerciali.id%TYPE)
               RETURNS TABLE(
                  articolo_id        catalogo.articoli.id%TYPE,
                  articolo_codice    catalogo.articoli.codice%TYPE,
                  descrizione        catalogo.articoli.descrizione%TYPE,
                  is_composito       catalogo.articoli.is_composito%TYPE,
                  quantita           vendite.offerte_commerciali_eccezioni.quantita%TYPE,
                  uom_operativa_id   vendite.offerte_commerciali_eccezioni.uom_operativa_id%TYPE,
                  qta_operativa      vendite.offerte_commerciali_eccezioni.qta_operativa%TYPE,
                  factor_to_base     vendite.offerte_commerciali_eccezioni.factor_to_base%TYPE,
                  prezzo_unitario    vendite.offerte_commerciali_eccezioni.prezzo_unitario%TYPE,
                  sconto_percentuale vendite.ordini_righe.sconto_percentuale%TYPE,
                  iva_id             vendite.ordini_righe.iva_id%TYPE,
                  tipo_eccezione     vendite.offerte_commerciali_eccezioni.tipo_eccezione%TYPE,
                  origine            character varying,
                  componenti         jsonb)
               LANGUAGE plpgsql
               STABLE
              AS $function$

              -- Scopo: righe effettive ordine-ready di un'offerta (listino + variazione
              --   globale + eccezioni). Parte 1 dal core fn_espandi_listino_versione +
              --   overlay OVERRIDE (ESCLUSIONE rimossa); Parte 2 AGGIUNTA standalone+bundle.
              --   iva_id risolta dall'articolo (listino non porta iva; iva_perc non esiste
              --   su ordini_righe: la percentuale si deriva da iva_id). sconto NULL: lo
              --   sconto e' espresso come prezzo override (prezzo_unitario = prezzo netto).
              --   quantita default 1 per righe da-listino senza eccezione.
              -- rev 2026-10-04 (brief-db-righe-esclusione-solo-non-si-vende): la versione
              --   operativa e la variazione dalla sede unica vendite.fn_documento_listino_
              --   operativo('OFFERTA', id), comune con la lista delle righe e coi guard di
              --   contratto e offerta. Stessa regola di prima (versione fissata, o in
              --   vigore oggi). Firma e colonne invariate, ora ancorate con %TYPE (iva_id e
              --   sconto_percentuale alla riga d'ordine, che e' la loro destinazione).
              DECLARE
                  v_trovato             boolean := false;
                  v_listino_versione_id vendite.listini_versioni.id%TYPE;
                  v_tipo_var            vendite.offerte_commerciali.tipo_variazione_globale%TYPE;
                  v_valore_var          vendite.offerte_commerciali.valore_variazione_globale%TYPE;
              BEGIN
                  SELECT true, lo.listino_versione_id,
                         lo.tipo_variazione_globale, lo.valore_variazione_globale
                    INTO v_trovato, v_listino_versione_id, v_tipo_var, v_valore_var
                    FROM vendite.fn_documento_listino_operativo('OFFERTA', p_offerta_id) lo;

                  -- Offerta assente (o fuori perimetro): nessuna riga.
                  IF NOT COALESCE(v_trovato, false) THEN
                      RETURN;
                  END IF;

                  -- PARTE 1: righe dal listino (core) + overlay OVERRIDE; ESCLUSIONE rimossa.
                  RETURN QUERY
                  SELECT
                      base.articolo_id,
                      base.articolo_codice,
                      base.articolo_descrizione,
                      base.is_composito,
                      COALESCE(ecc.quantita, 1)::numeric,
                      COALESCE(ecc.uom_operativa_id, base.uom_id),
                      COALESCE(ecc.qta_operativa, COALESCE(ecc.quantita, 1))::numeric,
                      COALESCE(ecc.factor_to_base, 1)::numeric,
                      CASE
                          WHEN ecc.tipo_eccezione = 'OVERRIDE' THEN ecc.prezzo_unitario
                          ELSE                                      base.prezzo_da_listino
                      END,
                      NULL::numeric,
                      a.iva_id::integer,
                      ecc.tipo_eccezione,
                      CASE
                          WHEN ecc.tipo_eccezione = 'OVERRIDE' THEN 'OVERRIDE'
                          ELSE                                      'DA_LISTINO'
                      END::varchar,
                      base.componenti
                    FROM vendite.fn_espandi_listino_versione(
                             v_listino_versione_id, v_tipo_var, v_valore_var
                         ) base
                    JOIN catalogo.articoli a ON a.id = base.articolo_id
                    LEFT JOIN vendite.offerte_commerciali_eccezioni ecc
                           ON ecc.offerta_id            = p_offerta_id
                          AND ecc.articolo_id           = base.articolo_id
                          AND ecc.tipo_eccezione        IN (
                                  'OVERRIDE'::vendite.tipo_eccezione_contratto,
                                  'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                              )
                          AND COALESCE(ecc.attivo, TRUE) = TRUE
                   WHERE ecc.tipo_eccezione IS DISTINCT FROM 'ESCLUSIONE'::vendite.tipo_eccezione_contratto;

                  -- PARTE 2a: AGGIUNTA standalone (articolo non a listino).
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, FALSE,
                      COALESCE(ecc.quantita, 1)::numeric,
                      COALESCE(ecc.uom_operativa_id, a.uom_id),
                      COALESCE(ecc.qta_operativa, COALESCE(ecc.quantita, 1))::numeric,
                      COALESCE(ecc.factor_to_base, 1)::numeric,
                      ecc.prezzo_unitario,
                      NULL::numeric,
                      a.iva_id::integer,
                      ecc.tipo_eccezione,
                      'AGGIUNTA'::varchar,
                      NULL::jsonb
                    FROM vendite.offerte_commerciali_eccezioni ecc
                    JOIN catalogo.articoli a
                      ON a.id = ecc.articolo_id AND a.is_composito = FALSE AND a.attivo = TRUE
                   WHERE ecc.offerta_id           = p_offerta_id
                     AND ecc.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(ecc.attivo, TRUE) = TRUE;

                  -- PARTE 2b: AGGIUNTA bundle. Componenti da offerte_commerciali_eccezioni_componenti.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, TRUE,
                      COALESCE(ecc.quantita, 1)::numeric,
                      COALESCE(ecc.uom_operativa_id, a.uom_id),
                      COALESCE(ecc.qta_operativa, COALESCE(ecc.quantita, 1))::numeric,
                      COALESCE(ecc.factor_to_base, 1)::numeric,
                      ecc.prezzo_unitario,
                      NULL::numeric,
                      a.iva_id::integer,
                      ecc.tipo_eccezione,
                      'AGGIUNTA'::varchar,
                      (
                          SELECT jsonb_agg(jsonb_build_object(
                              'articolo_componente_id', oecc_c.articolo_componente_id,
                              'componente_id',          af.id,
                              'componente_codice',      af.codice,
                              'componente_descrizione', af.descrizione,
                              'uom_id',                 af.uom_id,
                              'uom_codice',             umf.codice,
                              'coeff_qta',              oecc_c.coeff_qta_snapshot,
                              'prezzo',                 oecc_c.prezzo_unitario,
                              'qta_operativa',          oecc_c.qta_operativa,
                              'uom_operativa_id',       oecc_c.uom_operativa_id,
                              'factor_to_base',         oecc_c.factor_to_base
                          ) ORDER BY oecc_c.ordine, oecc_c.id)
                            FROM vendite.offerte_commerciali_eccezioni_componenti oecc_c
                            JOIN catalogo.articoli af ON af.id = oecc_c.componente_id
                            JOIN catalogo.unita_misura umf ON umf.id = af.uom_id
                           WHERE oecc_c.eccezione_offerta_id = ecc.id
                             AND oecc_c.attivo               = TRUE
                      )
                    FROM vendite.offerte_commerciali_eccezioni ecc
                    JOIN catalogo.articoli a
                      ON a.id = ecc.articolo_id AND a.is_composito = TRUE AND a.attivo = TRUE
                   WHERE ecc.offerta_id           = p_offerta_id
                     AND ecc.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(ecc.attivo, TRUE) = TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_offerta_righe_espanse(vendite.offerte_commerciali.id%TYPE)
              IS 'Righe effettive ordine-ready di un''offerta (listino + variazione globale + eccezioni) per la conversione offerta->ordine. Parte 1 dal core fn_espandi_listino_versione + overlay OVERRIDE (ESCLUSIONE rimossa); Parte 2 AGGIUNTA standalone+bundle. iva_id da articolo (iva_perc non esiste su ordini_righe: si deriva da iva_id); sconto_percentuale NULL (prezzo gia'' netto); quantita default 1 per righe da-listino. Versione operativa e variazione da vendite.fn_documento_listino_operativo(''OFFERTA'', id) (rev 2026-10-04, brief-db-righe-esclusione-solo-non-si-vende: sede unica con la lista delle righe e coi guard). Non e'' la lista del drawer: quella e'' vendite.fn_offerta_righe_preview.';
