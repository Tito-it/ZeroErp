databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/vendite/20260707-12-create-fn-create-contratto-mctit.yaml

    - changeSet:
          id: 20260707-12-create-fn-create-contratto
          author: mctit

          # ------------------------------------------------------------
          # Scopo
          # ------------------------------------------------------------
          # Funzione madre atomica per la creazione di un contratto (testata +
          # eventuale riga utility).
          #
          # Contesto (piano analisi-fix-transazioni, Classe A, finding #2):
          #   Il service Python vendite.contratti_service.create_contratto
          #   eseguiva in sequenza, SENZA transazione unica:
          #     1) generate_numero()  -> script.fn_generate_codice('contratto')
          #                              (consuma il contatore config.sistema_codici)
          #     2) INSERT vendite.contratti
          #     3) INSERT vendite.contratti_utilities   (solo se payload.utility)
          #   In autocommit, se l'INSERT utility (3) veniva rifiutato da un guard,
          #   il contratto (2) restava committato e il numero (1) consumato:
          #   contratto orfano senza utility + buco nella numerazione. Questa
          #   funzione fonde numero + INSERT testata + INSERT utility in un'unica
          #   statement SQL: o tutto o rollback totale (il contatore incluso).
          #
          # Parametri:
          #   p_testata (jsonb) — campi della testata contratto. Vengono inseriti
          #             SOLO i campi whitelisted PRESENTI (le colonne assenti
          #             ereditano default/trigger DB: ambito, valido_dal, data,
          #             emittente_fiscale_id via trgfn_default_emittente, valuta
          #             via trgfn_default_valuta, meta, ecc.). `numero` e
          #             `stato_doc_contratto_id` sono risolti dalla funzione e non
          #             vanno passati (ignorati se presenti).
          #   p_utility (jsonb) — opzionale. Se NULL o '{}' nessuna riga utility.
          #             Altrimenti INSERT su contratti_utilities con le sole chiavi
          #             whitelisted presenti; contratto_id impostato dalla funzione.
          #
          # Ritorno (RETURNS TABLE, 1 riga):
          #   contratto_id (contratti.id%TYPE)     id del contratto creato.
          #   numero       (contratti.numero%TYPE) numero generato.
          #
          # Stato iniziale = DRAFT (config.stati_doc_contratti). Se assente =>
          # E_CONFIG_MANCANTE (id 205).
          #
          # Whitelist testata:
          #   billing_account_id, emittente_fiscale_id, istanza_utility_id,
          #   utility_id, ambito, valido_dal, valido_al, parent_contratto_id, data,
          #   listino_id, tipo_variazione_globale, valore_variazione_globale,
          #   categoria_cliente_id_snapshot, valuta_id, meta.
          # Whitelist utility:
          #   istanza_utility_id, utility_id, istanza_dati_precontrattuali_id,
          #   tipo_utenza_id, classe_utenza_id, param_1_num, param_2_txt, meta.
          #
          # NOTE tecniche:
          #   - INSERT dinamico delle sole chiavi presenti (via
          #     jsonb_populate_record per la tipizzazione + lista colonne
          #     whitelisted): rispetta i default/trigger DB delle colonne assenti,
          #     esattamente come faceva l'INSERT dinamico del repository Python.
          #   - Tipi ancorati con %TYPE (RETURNS TABLE, DECLARE, COMMENT).
          #   - SECURITY INVOKER: RLS + guard emittente-scope su contratti restano
          #     valutati come oggi dal Python (vincolo invariante §2-bis).
          #   - Audit/tx_id/validita/uid/categoria-snapshot: gestiti dai trigger
          #     esistenti su contratti/contratti_utilities.
          #   - VOLATILE (default): esegue DML.
          #   - DROP prima del CREATE: CREATE OR REPLACE non cambia RETURNS TABLE.
          # ------------------------------------------------------------

          preConditions:
              - onFail: HALT
              - onError: HALT
              - tableExists:
                    schemaName: vendite
                    tableName: contratti
              - tableExists:
                    schemaName: vendite
                    tableName: contratti_utilities

          changes:
              - sql:
                    splitStatements: FALSE
                    stripComments: false
                    endDelimiter: ";"

                    sql: |

                        DROP FUNCTION IF EXISTS vendite.fn_create_contratto(jsonb, jsonb);

                        CREATE OR REPLACE FUNCTION vendite.fn_create_contratto(
                            p_testata jsonb,
                            p_utility jsonb DEFAULT NULL
                        )
                        RETURNS TABLE (
                            contratto_id vendite.contratti.id%TYPE,
                            numero       vendite.contratti.numero%TYPE
                        )
                        LANGUAGE plpgsql
                        SECURITY INVOKER
                        AS
                        $BODY$
                        DECLARE
                            v_numero       vendite.contratti.numero%TYPE;
                            v_stato_id     vendite.contratti.stato_doc_contratto_id%TYPE;
                            v_contratto_id vendite.contratti.id%TYPE;
                            v_cols         text[];
                            v_insert_cols  text;
                            v_select_cols  text;
                            v_sql          text;
                            v_testata_allowed text[] := ARRAY[
                                'billing_account_id', 'emittente_fiscale_id', 'istanza_utility_id',
                                'utility_id', 'ambito', 'valido_dal', 'valido_al',
                                'parent_contratto_id', 'data', 'listino_id',
                                'tipo_variazione_globale', 'valore_variazione_globale',
                                'categoria_cliente_id_snapshot', 'valuta_id', 'meta'
                            ];
                            v_util_allowed text[] := ARRAY[
                                'istanza_utility_id', 'utility_id', 'istanza_dati_precontrattuali_id',
                                'tipo_utenza_id', 'classe_utenza_id', 'param_1_num',
                                'param_2_txt', 'meta'
                            ];
                        BEGIN
                            -- ----------------------------------------------------
                            -- 1) Numero contratto (consuma il contatore; rolla con
                            --    la funzione se un qualsiasi step successivo fallisce).
                            -- ----------------------------------------------------
                            v_numero := script.fn_generate_codice('contratto');

                            -- 2) Stato iniziale DRAFT.
                            SELECT s.id
                              INTO v_stato_id
                              FROM config.stati_doc_contratti s
                             WHERE s.codice_interno = 'DRAFT';
                            IF NOT FOUND THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'vendite.fn_create_contratto',
                                    'E_CONFIG_MANCANTE',
                                    jsonb_build_object('config', 'config.stati_doc_contratti.DRAFT'),
                                    NULL::uuid,
                                    VARIADIC ARRAY['stato iniziale DRAFT (config.stati_doc_contratti)']
                                );
                            END IF;

                            -- ----------------------------------------------------
                            -- 3) INSERT testata: solo chiavi whitelisted presenti
                            --    (le assenti ereditano default/trigger DB).
                            -- ----------------------------------------------------
                            SELECT array_agg(quote_ident(key) ORDER BY key)
                              INTO v_cols
                              FROM jsonb_object_keys(COALESCE(p_testata, '{}'::jsonb)) AS key
                             WHERE key = ANY(v_testata_allowed);

                            v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                            v_select_cols := COALESCE(
                                ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                           FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                                '');

                            v_sql := format(
                                'INSERT INTO vendite.contratti (numero, stato_doc_contratto_id%s) '
                                'SELECT $1, $2%s '
                                '  FROM jsonb_populate_record(NULL::vendite.contratti, $3) AS r '
                                'RETURNING id',
                                v_insert_cols, v_select_cols);
                            EXECUTE v_sql
                               INTO v_contratto_id
                              USING v_numero, v_stato_id, COALESCE(p_testata, '{}'::jsonb);

                            -- ----------------------------------------------------
                            -- 4) INSERT utility opzionale.
                            -- ----------------------------------------------------
                            IF p_utility IS NOT NULL AND p_utility <> '{}'::jsonb THEN
                                SELECT array_agg(quote_ident(key) ORDER BY key)
                                  INTO v_cols
                                  FROM jsonb_object_keys(p_utility) AS key
                                 WHERE key = ANY(v_util_allowed);

                                v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                                v_select_cols := COALESCE(
                                    ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                               FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                                    '');

                                v_sql := format(
                                    'INSERT INTO vendite.contratti_utilities (contratto_id%s) '
                                    'SELECT $1%s '
                                    '  FROM jsonb_populate_record(NULL::vendite.contratti_utilities, $2) AS r',
                                    v_insert_cols, v_select_cols);
                                EXECUTE v_sql USING v_contratto_id, p_utility;
                            END IF;

                            RETURN QUERY
                            SELECT v_contratto_id, v_numero;
                        END;
                        $BODY$;

                        COMMENT ON FUNCTION vendite.fn_create_contratto(jsonb, jsonb) IS
                        'Funzione madre atomica: genera il numero, crea la testata '
                        'contratto (stato DRAFT) e l''eventuale riga utility in un''unica '
                        'statement (o tutto o rollback, contatore numero incluso). '
                        'INSERT dinamico delle sole chiavi whitelisted presenti '
                        '(rispetta i default DB). SECURITY INVOKER. Ritorna '
                        '(contratto_id, numero). Piano: analisi-fix-transazioni '
                        'Classe A #2.';

          rollback:
              - sql:
                    sql: |
                        DROP FUNCTION IF EXISTS vendite.fn_create_contratto(jsonb, jsonb);
