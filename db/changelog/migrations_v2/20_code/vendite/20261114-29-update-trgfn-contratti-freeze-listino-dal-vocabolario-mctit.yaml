# IL FREEZE DEL LISTINO ALL'ATTIVAZIONE: IL PASSAGGIO DAL VOCABOLARIO
#   Brief: brief-db-stati-documento-dal-vocabolario §6.19, giro 6c (S-2,
#   Tid 2026-11-08; via di Tid del 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.trgfn_contratti_freeze_listino_versione scattava su 'DRAFT' ->
#   'ATTIVO' col codice. E' il passaggio dallo stato iniziale allo stato di
#   emissione, che il vocabolario marca; la capability somma lo stesso
#   motivo del listino (script.fn_check_listino_congelabile) verso lo stato di
#   emissione.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   La stessa SELECT legge iniziale della partenza ed emissione della
#   destinazione; il trigger esce se il passaggio non e' dall'uno all'altro.
#   Con il seed la risposta e' quella di prima.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma (trigger), INVOKER, nessun SET (pg_proc su
#   dbdev, 2026-11-14). Il montaggio non si tocca.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (il catalogo li scioglie). Il
#   rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-29-update-trgfn-contratti-freeze-listino-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261114-29-update-trgfn-contratti-freeze-listino-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_contratti_freeze_listino_versione: il passaggio dallo stato iniziale allo stato di
        emissione del vocabolario, non DRAFT -> ATTIVO. Brief: brief-db-stati-documento-dal-vocabolario, giro 6c.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_freeze_listino_versione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$

              -- Scopo: al momento dell'attivazione (DRAFT→ATTIVO), fissa la versione
              --   listino e verifica la coerenza del negoziato puro.
              -- A) listino_id IS NULL: verifica almeno una AGGIUNTA con prezzo.
              --    Errore: E_CONTRATTO_NEGOZIATO_PURO_SENZA_RIGHE (451).
              -- B) listino_id NOT NULL: congela la versione operativa,
              --    vendite.fn_listino_versione_operativa (la fissata, altrimenti quella
              --    in vigore oggi). Se non ce n'e' una il contratto NON si attiva
              --    (rev 2026-10-07, decisione A-D2 di Tid, brief-db-offerta-emissione-
              --    ed-erogazione §C.1.2): primo motivo di
              --    script.fn_check_listino_congelabile, lo stesso della capability.
              --    Prima si attivava con la versione NULL (§4.4 del 2026-05-18) e da li'
              --    il risolutore delle righe lo faceva galleggiare sulla versione in
              --    vigore di ogni giorno: l'opposto di «congela all'attivazione».
              -- C) listino_versione_id gia' valorizzato (dal push dell'offerta): resta.
              -- Esce senza effetti su qualsiasi transizione diversa da DRAFT→ATTIVO.
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6c): il
              --   passaggio e' dallo stato iniziale allo stato di emissione, che il
              --   vocabolario marca; dove sopra si legge DRAFT→ATTIVO vale quello.
              DECLARE
                  v_codice_da   config.stati_doc_contratti.codice_interno%TYPE;
                  v_codice_a    config.stati_doc_contratti.codice_interno%TYPE;
                  -- La partenza e' lo stato iniziale, la destinazione quello di emissione?
                  v_iniziale_da config.stati_doc_contratti.iniziale%TYPE;
                  v_emissione_a config.stati_doc_contratti.emissione%TYPE;
              BEGIN
                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_contratto_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_contratto_id THEN codice_interno END),
                      bool_or(iniziale)  FILTER (WHERE id = OLD.stato_doc_contratto_id),
                      bool_or(emissione) FILTER (WHERE id = NEW.stato_doc_contratto_id)
                    INTO v_codice_da, v_codice_a, v_iniziale_da, v_emissione_a
                    FROM config.stati_doc_contratti
                   WHERE id IN (OLD.stato_doc_contratto_id, NEW.stato_doc_contratto_id);

                  -- Attivo solo dallo stato iniziale allo stato di emissione.
                  IF (v_iniziale_da AND v_emissione_a) IS NOT TRUE THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.listino_id IS NULL THEN
                      -- Negoziato puro: almeno una AGGIUNTA con prezzo valorizzato
                      IF NOT EXISTS (
                          SELECT 1
                            FROM vendite.contratti_righe cr
                           WHERE cr.contratto_id = NEW.id
                             AND cr.tipo_eccezione = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                             AND cr.prezzo_unitario IS NOT NULL
                             AND cr.attivo = TRUE
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite',
                              TG_NAME::text,
                              'E_CONTRATTO_NEGOZIATO_PURO_SENZA_RIGHE',
                              jsonb_build_object('contratto_id', NEW.id, 'numero', NEW.numero),
                              NEW.tx_id,
                              NEW.id::text
                          );
                      END IF;
                      RETURN NEW;
                  END IF;

                  -- Con listino: prima il predicato, poi il congelamento (rev 2026-10-07).
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      script.fn_check_listino_congelabile('CONTRATTO', NEW.listino_id, NEW.listino_versione_id),
                      NULL,
                      NEW.tx_id,
                      jsonb_build_object('contratto_id', NEW.id, 'numero', NEW.numero));

                  NEW.listino_versione_id := vendite.fn_listino_versione_operativa(
                      NEW.listino_id, NEW.listino_versione_id);

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_freeze_listino_versione()
              IS 'Trigger BEFORE UPDATE su vendite.contratti, solo sul passaggio dallo stato iniziale allo stato di emissione (le colonne iniziale ed emissione di config.stati_doc_contratti: l''attivazione). Negoziato puro (listino_id NULL): richiede almeno un''AGGIUNTA attiva con prezzo (E_CONTRATTO_NEGOZIATO_PURO_SENZA_RIGHE). Con listino: solleva il primo motivo di script.fn_check_listino_congelabile(''CONTRATTO'', ...), cioe'' nessuna versione in vigore oggi (E_CONTRATTO_ATTIVAZIONE_SENZA_VERSIONE_LISTINO), e congela listino_versione_id con vendite.fn_listino_versione_operativa (la fissata, altrimenti quella in vigore oggi). Una versione gia'' fissata (dal push dell''offerta) resta anche se nel frattempo si e'' chiusa: e'' quella che il cliente ha accettato. La capability script.fn_available_actions_contratto legge la stessa check e spegne «Attiva» col motivo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_freeze_listino_versione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$

              -- Scopo: al momento dell'attivazione (DRAFT→ATTIVO), fissa la versione
              --   listino e verifica la coerenza del negoziato puro.
              -- A) listino_id IS NULL: verifica almeno una AGGIUNTA con prezzo.
              --    Errore: E_CONTRATTO_NEGOZIATO_PURO_SENZA_RIGHE (451).
              -- B) listino_id NOT NULL: congela la versione operativa,
              --    vendite.fn_listino_versione_operativa (la fissata, altrimenti quella
              --    in vigore oggi). Se non ce n'e' una il contratto NON si attiva
              --    (rev 2026-10-07, decisione A-D2 di Tid, brief-db-offerta-emissione-
              --    ed-erogazione §C.1.2): primo motivo di
              --    script.fn_check_listino_congelabile, lo stesso della capability.
              --    Prima si attivava con la versione NULL (§4.4 del 2026-05-18) e da li'
              --    il risolutore delle righe lo faceva galleggiare sulla versione in
              --    vigore di ogni giorno: l'opposto di «congela all'attivazione».
              -- C) listino_versione_id gia' valorizzato (dal push dell'offerta): resta.
              -- Esce senza effetti su qualsiasi transizione diversa da DRAFT→ATTIVO.
              DECLARE
                  v_codice_da   config.stati_doc_contratti.codice_interno%TYPE;
                  v_codice_a    config.stati_doc_contratti.codice_interno%TYPE;
              BEGIN
                  SELECT
