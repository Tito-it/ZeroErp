# ------------------------------------------------------------
# Simmetria piena (brief §1.3): guard coerenza emittente<->BA su
# vendite.offerte_commerciali (finora senza default ne' guard emittente).
# Mirror di trgfn_ordini_guard_emittente_ba, con NEW.codice come chiave
# documento (le offerte non hanno 'numero'). Fascia a10: BA da payload
# (billing_account_id e' NOT NULL sull'offerta).
#
# Nota: l'invariante e' gia' rispettata a valle (fn_push_offerta_a_contratto
# copia l'emittente sul contratto, che ha gia' il guard_emittente_ba);
# questo guard la rende esplicita anche in ingresso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-04-create-trgfn-offerte-guard-emittente-ba-mctit.yaml

  - changeSet:
      id: 20260713-04-create-trgfn-offerte-guard-emittente-ba
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_offerte_commerciali_guard_emittente_ba()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_ef_atteso_id anagrafiche.emittenti_fiscali.id%TYPE;
              BEGIN
                IF NEW.billing_account_id IS NULL THEN
                  RETURN NEW;
                END IF;

                v_ef_atteso_id := anagrafiche.fn_get_emittente_fiscale_pk(NEW.billing_account_id);

                IF NEW.emittente_fiscale_id IS DISTINCT FROM v_ef_atteso_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'trgfn_offerte_commerciali_guard_emittente_ba',
                    'E_OFFERTA_EMITTENTE_BA_INCOERENTE',
                    jsonb_build_object(
                      'billing_account_id',   NEW.billing_account_id,
                      'emittente_fiscale_id', NEW.emittente_fiscale_id,
                      'emittente_atteso_id',  v_ef_atteso_id,
                      'codice_offerta',       NEW.codice
                    ),
                    NULL::uuid,
                    concat('ba=', NEW.billing_account_id,
                           ', ef=', NEW.emittente_fiscale_id,
                           ', ef_atteso=', v_ef_atteso_id)
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              DROP TRIGGER IF EXISTS trg_offerte_commerciali_a10_guard_emittente_ba_ins_upd ON vendite.offerte_commerciali;
              CREATE TRIGGER trg_offerte_commerciali_a10_guard_emittente_ba_ins_upd
                BEFORE INSERT OR UPDATE OF billing_account_id, emittente_fiscale_id
                ON vendite.offerte_commerciali
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_offerte_commerciali_guard_emittente_ba();
