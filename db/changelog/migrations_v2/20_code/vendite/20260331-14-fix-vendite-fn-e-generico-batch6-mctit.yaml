    - changeSet:
          id: 20260331-14-fix-fn-get-valuta-id
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_get_valuta_id: 1x E_GENERICO → E_CONFIG_MANCANTE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_CONFIG_MANCANTE
                        CREATE OR REPLACE FUNCTION vendite.fn_get_valuta_id(
                            p_billing_account_id          anagrafiche.billing_account.id%TYPE,
                            p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE
                        )
                        RETURNS config.valute.id%TYPE
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_valuta_id config.valute.id%TYPE;
                        BEGIN
                            -- Risoluzione con fallback: BA → emittente → gestore
                            IF p_billing_account_id IS NOT NULL THEN
                                SELECT ba.valuta_id INTO v_valuta_id
                                  FROM anagrafiche.billing_account ba WHERE ba.id = p_billing_account_id;
                            END IF;

                            IF v_valuta_id IS NULL AND p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                                SELECT ef.valuta_id INTO v_valuta_id
                                  FROM anagrafiche.emittenti_fiscali ef WHERE ef.soggetto_ruolo_id = p_emittente_soggetto_ruolo_id;
                            END IF;

                            IF v_valuta_id IS NULL THEN
                                SELECT g.valuta_id INTO v_valuta_id
                                  FROM anagrafiche.gestori g ORDER BY g.id LIMIT 1;
                            END IF;

                            IF v_valuta_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_get_valuta_id', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('billing_account_id', p_billing_account_id, 'emittente', p_emittente_soggetto_ruolo_id),
                                    NULL::uuid, 'valuta non risolta (BA/emittente/gestore)');
                            END IF;

                            RETURN v_valuta_id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_get_valuta_id(BIGINT, BIGINT)
                          IS 'Risoluzione valuta_id: BA → emittente → gestore (fallback).';

    - changeSet:
          id: 20260331-14-fix-fn-group-attivita-fatturabili
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_group_attivita_fatturabili: 2x E_GENERICO →
              E_PARAMETRO_INVALIDO + E_VALORE_MANCANTE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 2x E_GENERICO → codici specifici
                        CREATE OR REPLACE FUNCTION vendite.fn_group_attivita_fatturabili(
                            p_attivita_id vendite.attivita_fatturabili.id%TYPE
                        )
                        RETURNS JSONB
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_articolo_id    catalogo.articoli.id%TYPE;
                            v_dest_ba_id     anagrafiche.billing_account.id%TYPE;
                            v_uom_id         catalogo.unita_misura.id%TYPE;
                            v_prezzo_unitario vendite.attivita_fatturabili.prezzo_unitario%TYPE;
                            v_iva_id         config.iva.id%TYPE;
                            v_regole         RECORD;
                            v_comp_dal       vendite.attivita_fatturabili.competenza_dal%TYPE;
                            v_comp_al        vendite.attivita_fatturabili.competenza_al%TYPE;
                            v_data_attivita  vendite.attivita_fatturabili.data_attivita%TYPE;
                            v_use_competenza BOOLEAN;
                        BEGIN
                            IF p_attivita_id IS NULL OR p_attivita_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_group_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_attivita_id', 'valore', p_attivita_id), NULL::uuid, 'p_attivita_id obbligatorio e > 0');
                            END IF;

                            SELECT a.articolo_id, a.billing_account_id, COALESCE(a.uom_id, art.uom_id),
                                   a.prezzo_unitario, art.iva_id, a.competenza_dal, a.competenza_al, a.data_attivita
                              INTO v_articolo_id, v_dest_ba_id, v_uom_id, v_prezzo_unitario, v_iva_id, v_comp_dal, v_comp_al, v_data_attivita
                              FROM vendite.attivita_fatturabili a
                              JOIN catalogo.articoli art ON art.id = a.articolo_id
                             WHERE a.id = p_attivita_id;

                            IF v_articolo_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_group_attivita_fatturabili', 'E_VALORE_MANCANTE',
                                    jsonb_build_object('attivita_id', p_attivita_id), NULL::uuid, concat('attivita_id ', p_attivita_id));
                            END IF;

                            SELECT COALESCE(r.visibilita_componenti, 'solo_padre'), COALESCE(r.calcolo_qta_padre, 'fissa'),
                                   COALESCE(r.arrotondamento_importi_dec, 2), COALESCE(r.arrotondamento_quantita_dec, 3),
                                   COALESCE(r.metodo_arrotondamento_importi, 'HALF_UP'), COALESCE(r.metodo_arrotondamento_quantita, 'HALF_UP')
                              INTO v_regole
                              FROM vendite.articolo_regole_fatturazione r WHERE r.articolo_id = v_articolo_id;

                            v_use_competenza := v_comp_dal IS NOT NULL AND v_comp_al IS NOT NULL
                                AND (v_comp_dal <> v_comp_al OR v_comp_dal <> v_data_attivita);

                            RETURN jsonb_build_object(
                                'articolo_id', v_articolo_id, 'dest_billing_account_id', v_dest_ba_id,
                                'uom_id', v_uom_id, 'prezzo_unitario', v_prezzo_unitario, 'iva_id', v_iva_id,
                                'competenza_dal', CASE WHEN v_use_competenza THEN v_comp_dal ELSE NULL END,
                                'competenza_al', CASE WHEN v_use_competenza THEN v_comp_al ELSE NULL END,
                                'visibilita_componenti', v_regole.visibilita_componenti,
                                'calcolo_qta_padre', v_regole.calcolo_qta_padre,
                                'arrotondamento_importi_dec', v_regole.arrotondamento_importi_dec,
                                'arrotondamento_quantita_dec', v_regole.arrotondamento_quantita_dec,
                                'metodo_arrotondamento_importi', v_regole.metodo_arrotondamento_importi,
                                'metodo_arrotondamento_quantita', v_regole.metodo_arrotondamento_quantita
                            );
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_group_attivita_fatturabili(BIGINT)
                          IS 'Chiave aggregazione riga fattura da attivita_fatturabili con fallback regole articolo.';

    - changeSet:
          id: 20260331-14-fix-fn-list-attivita-sorgenti-abilitate
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_list_attivita_sorgenti_abilitate: 1x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_PARAMETRO_INVALIDO
                        CREATE OR REPLACE FUNCTION vendite.fn_list_attivita_sorgenti_abilitate(
                            p_utility_id config.utilities.id%TYPE DEFAULT NULL
                        )
                        RETURNS TABLE(sorgente_tipo_id BIGINT, branch_code CHARACTER VARYING, abilitata BOOLEAN,
                                      acquisizione_mode CHARACTER VARYING, block_scope CHARACTER VARYING,
                                      priorita SMALLINT, meta JSONB)
                        LANGUAGE plpgsql
                        AS $function$
                        BEGIN
                            IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_list_attivita_sorgenti_abilitate', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_utility_id', 'valore', p_utility_id), NULL::uuid, 'p_utility_id se fornito deve essere > 0');
                            END IF;

                            RETURN QUERY
                            SELECT p.sorgente_tipo_id, p.branch_code, p.abilitata, p.acquisizione_mode,
                                   p.block_scope, p.priorita, p.meta
                              FROM vendite.attivita_fatturabili_sorgenti_branch_policy p
                             WHERE p.abilitata IS TRUE AND p.attivo IS TRUE
                             ORDER BY p.priorita, p.id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_list_attivita_sorgenti_abilitate(INTEGER)
                          IS 'Policy sorgenti abilitate per pipeline attivita ordinate per priorita.';
