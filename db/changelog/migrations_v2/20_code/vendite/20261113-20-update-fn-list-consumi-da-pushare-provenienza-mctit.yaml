# vendite.fn_list_consumi_da_pushare: le colonne della provenienza, vuote
#   Brief: brief-db-provenienza-prezzo-segue-il-prezzo (§8.7, giro 2, R-3)
#
#   R-5: un consumo non porta prezzo dalla sorgente (prezzo_snapshot NULL,
#   prezzo_bloccato FALSE), quindi non porta provenienza: le dieci colonne
#   escono NULL. Il prezzo lo da' il listino piu' tardi, e chi lo scrive scrive
#   anche la provenienza. Le colonne ci sono perche' i cinque lister hanno lo
#   stesso contratto: il BE li legge con un solo elenco.
#
#   Il RETURNS TABLE guadagna in coda le dieci colonne della provenienza del
#   prezzo, con i nomi e i tipi della riga di commessa (contratto_id esce come
#   prezzo_contratto_id: contratto_id e' gia' il documento in alcuni lister).
#   Nome o tipo di una colonna di RETURNS TABLE non cambiano con CREATE OR
#   REPLACE: DROP + CREATE, come nella revisione di partenza; COMMENT e GRANT
#   tornano (EXECUTE a PUBLIC lo da' la CREATE). Il corpo e' quello della
#   revisione di partenza, verificato identico al vivo il 2026-11-13.
#   Il BE legge le colonne per nome da un elenco chiuso (commesse_repository,
#   _PUSHABLE_SHARED_COLS): le nuove non lo rompono, le legge quando le aggiunge.
#   Rollback: la revisione di partenza.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261113-20-update-fn-list-consumi-da-pushare-provenienza-mctit.yaml

  - changeSet:
      id: 20261113-20-update-fn-list-consumi-da-pushare-provenienza
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_list_consumi_da_pushare: le colonne della provenienza, vuote. Brief: brief-db-provenienza-prezzo-segue-il-prezzo (§8.7).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- La colonna della chiave cambia nome nel RETURNS TABLE: CREATE OR REPLACE non lo ammette.
              -- ⛔ MAI con CASCADE: i chiamanti DB sono plpgsql (nessuna riga in pg_depend), e un
              --    CASCADE farebbe sparire in silenzio chi un giorno ne dipendera'.
              DROP FUNCTION vendite.fn_list_consumi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.attivita_consumi.id%TYPE);

              CREATE FUNCTION vendite.fn_list_consumi_da_pushare(
                  p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                  p_limit              integer DEFAULT NULL::integer,
                  p_consumo_id         vendite.attivita_consumi.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(
                  -- nudi (utility_id, fatturazione_immediata, termine_pagamento_id, modalita_pagamento_id): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  consumo_id                  vendite.attivita_consumi.id%TYPE,
                  consumo_uid                 vendite.attivita_consumi.uid%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  utility_id                  vendite.commesse.utility_id%TYPE,
                  emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  competenza_dal              vendite.commesse_attivita.competenza_dal%TYPE,
                  competenza_al               vendite.commesse_attivita.competenza_al%TYPE,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  -- text esplicito, non %TYPE: e' la chiave del documento come la riceve la madre
                  -- (vendite.fn_upsert_commessa_attivita, p_sorgente_chiave), l'uid in testo. Non e' il
                  -- riflesso di una colonna: commesse_attivita.sorgente_uid e' uuid e tiene solo la
                  -- chiave dei tipi a uid.
                  sorgente_chiave             text,
                  segment_key                 vendite.commesse_attivita.segment_key%TYPE,
                  articolo_id                 vendite.commesse_attivita.articolo_id%TYPE,
                  istanza_utility_id          vendite.commesse_attivita.istanza_utility_id%TYPE,
                  data_attivita               vendite.commesse_attivita.data_attivita%TYPE,
                  uom_id                      vendite.commesse_attivita.uom_id%TYPE,
                  quantita                    vendite.commesse_attivita.quantita%TYPE,
                  qta_operativa               vendite.commesse_attivita.qta_operativa%TYPE,
                  uom_operativa_id            vendite.commesse_attivita.uom_operativa_id%TYPE,
                  factor_to_base              vendite.commesse_attivita.factor_to_base%TYPE,
                  competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                  prezzo_snapshot             vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  prezzo_bloccato             vendite.commesse_attivita.prezzo_bloccato%TYPE,
                  pricing_mode                vendite.commesse_attivita.pricing_mode%TYPE,
                  tipo_movimento              vendite.commesse_attivita.tipo_movimento%TYPE,
                  valuta_id                   vendite.commesse_attivita.valuta_id%TYPE,
                  meta                        vendite.commesse_attivita.meta%TYPE,
                  tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        vendite.commesse.termine_pagamento_id%TYPE,
                  modalita_pagamento_id       vendite.commesse.modalita_pagamento_id%TYPE,
                  -- La provenienza del prezzo, le colonne della riga di commessa (R-3)
                  origine_prezzo                vendite.commesse_attivita.origine_prezzo%TYPE,
                  listino_versione_id           vendite.commesse_attivita.listino_versione_id%TYPE,
                  listino_riga_id               vendite.commesse_attivita.listino_riga_id%TYPE,
                  prezzo_base_snapshot          vendite.commesse_attivita.prezzo_base_snapshot%TYPE,
                  tipo_variazione_applicata     vendite.commesse_attivita.tipo_variazione_applicata%TYPE,
                  valore_variazione_applicata   vendite.commesse_attivita.valore_variazione_applicata%TYPE,
                  promo_id                      vendite.commesse_attivita.promo_id%TYPE,
                  prezzo_contratto_id           vendite.commesse_attivita.contratto_id%TYPE,
                  categoria_cliente_id_snapshot vendite.commesse_attivita.categoria_cliente_id_snapshot%TYPE,
                  classe_utenza_id_snapshot     vendite.commesse_attivita.classe_utenza_id_snapshot%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- rev 2026-10-20 (20261020-89, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave e' ATTIVITA_CONSUMI:<uid>, composta da
              --   script.fn_segment_key (era CONS:<uid>). Firma e RETURNS ancorati.
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
              BEGIN
                -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente risolta
                -- per codice_interno (immutabile), non per codice (mutabile).
                -- rev 2026-07-27 (brief emissione mirata PARTE B, D-6): a differenza
                -- di ordini/contratti/DDT, qui fatturazione_immediata RESTA la
                -- costante FALSE. Non e' una dimenticanza: e' dominio. Un consumo
                -- e' una misura, la corsia la decide il contratto che lo governa.
                -- Guard: p_consumo_id, se specificato, deve essere > 0.
                IF p_consumo_id IS NOT NULL AND p_consumo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'fn_list_consumi_da_pushare',
                    'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_consumo_id', 'valore', p_consumo_id),
                    NULL::uuid,
                    'p_consumo_id', p_consumo_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'ATTIVITA_CONSUMI' AND s.attivo IS TRUE
                LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_consumi_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'ATTIVITA_CONSUMI'),
                    NULL::uuid,
                    'ATTIVITA_CONSUMI', 'config.sorgenti'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  ac.id, ac.uid,
                  ac.billing_account_id,
                  ba.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(ac.billing_account_id),
                  ac.periodo_dal, ac.periodo_al,
                  -- fatturazione_immediata: costante FALSE PER SCELTA DI DOMINIO
                  -- (D-6, 2026-07-27). I consumi seguono sempre la corsia
                  -- differita; la corsia immediata si ottiene marcando il
                  -- CONTRATTO che governa la fornitura, non la singola lettura.
                  -- NON sostituire con una colonna: vedi header del changeSet.
                  FALSE,
                  v_sorgente_tipo_id,
                  ac.uid::text,
                  script.fn_segment_key('ATTIVITA_CONSUMI', ac.uid::text),
                  NULL::uuid,
                  ba.istanza_utility_id,
                  COALESCE(ac.periodo_dal, ac.competenza_mese),
                  ac.uom_id,
                  ac.consumo_totale,
                  ac.consumo_totale,
                  ac.uom_id,
                  1::numeric,
                  ac.competenza_mese,
                  NULL::numeric,
                  -- prezzo_bloccato: FALSE per una ragione DIVERSA e non
                  -- correlata alla precedente — un consumo non porta prezzo
                  -- dalla sorgente (prezzo_snapshot NULL sopra), quindi non
                  -- c'e' nulla da bloccare: il prezzo lo risolve il pricing.
                  FALSE,
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  NULL::integer,
                  jsonb_build_object(
                    'consumo_uid',         ac.uid,
                    'stato_calcolo',       ac.stato_calcolo,
                    'periodo_dal',         ac.periodo_dal,
                    'periodo_al',          ac.periodo_al,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer,
                  -- R-5: un consumo non porta prezzo, quindi nemmeno provenienza.
                  NULL::varchar, NULL::bigint, NULL::bigint, NULL::numeric, NULL::varchar,
                  NULL::numeric, NULL::bigint, NULL::bigint, NULL::smallint, NULL::integer
                FROM vendite.attivita_consumi ac
                JOIN anagrafiche.billing_account ba ON ba.id = ac.billing_account_id
                WHERE ac.stato_calcolo = 'OK'
                  AND ac.fattura_id IS NULL
                  AND (p_competenza_mese IS NULL OR ac.competenza_mese = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR ac.billing_account_id = p_billing_account_id)
                  -- Estensione 2026-05: NULL = lista globale; NOT NULL = singolo consumo.
                  AND (p_consumo_id IS NULL OR ac.id = p_consumo_id)
                  -- Esclusione "gia' inviato" (rev 2026-10-12, 20261012-10): dal
                  -- classificatore unico, sul segmento che questa funzione scrive
                  -- ('CONS:<uid>', sopra). Il NOT EXISTS di prima cercava
                  -- 'CONS:<uid>:%', con i due punti finali che il segmento base non
                  -- ha: vedeva solo le righe del fan-out per componente
                  -- (':COMP:<x>', HandlerConsumi._expand_rows), che e' uno stub
                  -- RIMANDATO (Tid, 2026-06-16) e non ne scrive. ⚠️ Il giorno in cui
                  -- il fan-out si accende deve usare il suffisso '#CMP:' che il
                  -- classificatore vede (DEC-2), non ':COMP:'. Una riga ANNULLATA
                  -- non occupa (D-5).
                  AND script.fn_get_stato_push_segment(
                        script.fn_segment_key('ATTIVITA_CONSUMI', ac.uid::text)) = 'LIBERA'
                ORDER BY ac.competenza_mese, ac.id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_consumi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.attivita_consumi.id%TYPE) IS
                'I consumi da mandare in commessa: stato_calcolo OK, non ancora fatturati (fattura_id NULL) e non gia'' instradati (script.fn_get_stato_push_segment = LIBERA: una riga ANNULLATA non occupa, e annullata la commessa il consumo torna da mandare). p_consumo_id: un consumo solo (NULL = tutti; <= 0 solleva E_PUSH_SORGENTE_ID_INVALIDO); la sorgente ATTIVITA_CONSUMI assente dal catalogo solleva E_CODICE. Filtri in AND, ordine per competenza e consumo, p_limit come tetto. Il consumo non ha righe: una riga di commessa per consumo, senza articolo e senza prezzo. La chiave del documento esce in sorgente_chiave, l''uid del consumo in testo, come la riceve la madre vendite.fn_upsert_commessa_attivita (p_sorgente_chiave) e come la legge la chiave sorgente_chiave del batch vendite.fn_batch_upsert_commessa_attivita; la chiave del push ATTIVITA_CONSUMI:<uid> la compone script.fn_segment_key. Un fan-out per componente dovra'' usare il suffisso #CMP:, che il classificatore vede. fatturazione_immediata e'' FALSE per scelta di dominio: un consumo e'' una misura, e la corsia la decide il contratto che lo governa; non va sostituita con una colonna. termine_pagamento_id e modalita_pagamento_id sono NULL: un consumo non ha condizioni di pagamento. Il backend legge le colonne per nome. Le dieci colonne della provenienza del prezzo (origine_prezzo … classe_utenza_id_snapshot) escono NULL: un consumo non porta prezzo dalla sorgente, e chi scrivera'' il prezzo ne scrivera'' la provenienza.';

              GRANT EXECUTE ON FUNCTION vendite.fn_list_consumi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.attivita_consumi.id%TYPE) TO zeroerp_app;
