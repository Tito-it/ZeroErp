              COMMENT ON FUNCTION vendite.fn_list_consumi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.attivita_consumi.id%TYPE) IS
                'I consumi da mandare in commessa: stato_calcolo OK, non ancora fatturati (fattura_id NULL) e non gia'' instradati (script.fn_get_stato_push_segment = LIBERA: una riga ANNULLATA non occupa, e annullata la commessa il consumo torna da mandare). p_consumo_id: un consumo solo (NULL = tutti; <= 0 solleva E_PUSH_SORGENTE_ID_INVALIDO); la sorgente ATTIVITA_CONSUMI assente dal catalogo solleva E_CODICE. Filtri in AND, ordine per competenza e consumo, p_limit come tetto. Il consumo non ha righe: una riga di commessa per consumo, senza articolo e senza prezzo. La chiave del documento esce in sorgente_chiave, l''uid del consumo in testo, come la riceve la madre vendite.fn_upsert_commessa_attivita (p_sorgente_chiave) e come la legge la chiave sorgente_chiave del batch vendite.fn_batch_upsert_commessa_attivita; la chiave del push ATTIVITA_CONSUMI:<uid> la compone script.fn_segment_key. Un fan-out per componente dovra'' usare il suffisso #CMP:, che il classificatore vede. fatturazione_immediata e'' FALSE per scelta di dominio: un consumo e'' una misura, e la corsia la decide il contratto che lo governa; non va sostituita con una colonna. termine_pagamento_id e modalita_pagamento_id sono NULL: un consumo non ha condizioni di pagamento. Il backend legge le colonne per nome.';

              GRANT EXECUTE ON FUNCTION vendite.fn_list_consumi_da_pushare(vendite.commesse_attivita.competenza_mese%TYPE, anagrafiche.billing_account.id%TYPE, integer, vendite.attivita_consumi.id%TYPE) TO zeroerp_app;
