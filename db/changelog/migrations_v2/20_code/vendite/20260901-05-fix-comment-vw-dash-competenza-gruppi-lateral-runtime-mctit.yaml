# CORREZIONE DI UN COMMENTO — solo COMMENT ON VIEW, nessun cambio di definizione
#   Piano: brief-db-riferimento-gruppi-lateral-costosa §1.2
#
#   Il changeSet 20260901-04 ha lasciato nel COMMENT ON VIEW una frase
#   SBAGLIATA sul meccanismo:
#     «E la LATERAL apriva SEI Seq Scan per gruppo comunque, perche'
#      d.area = s.area e' correlato e non pota l'Append»
#
#   ⚠️ SEI e' la forma del PIANO, non l'esecuzione. E' vero che l'Append non si
#   pota in fase di piano — d.area = s.area e' correlato — ma a RUNTIME quattro
#   rami non partono: ogni ramo della UNION emette un'area COSTANTE, quindi il
#   confronto diventa un One-Time Filter per ramo
#   (`One-Time Filter: ('PREVENTIVI'::text = (s.area)::text)`) e i rami non
#   corrispondenti risultano `never executed`.
#
#   ⛔ Perche' vale un changeSet e non una riga nel brief: quella frase, letta da
#   chi diagnostica un caso simile, insegna che l'Append non si pota MAI su un
#   quale correlato. E' falso, e lo porterebbe a progettare intorno a un vincolo
#   che non esiste. Un commento che sbaglia il meccanismo e' peggio di un
#   commento assente: viene creduto.
#
#   ⭐ La conclusione del -04 NON cambia, e la correzione la rafforza: il costo
#   non era «sei scansioni», era che l'UNICO ramo che parte e' il resolver
#   COMPLETO — tutta vendite.preventivi scandita, righe unite, smistamento
#   attraversato, aggregazione fatta, per tenere UNA riga e due colonne.
#   Fatto datato 2026-09-01 (competenza giugno, 48 gruppi, come zeroerp_app):
#   loops=31 sul ramo preventivi, loops=17 su ordini; 21.813 + 7.109 buffer su
#   31.789 totali.
#
# ── ⚠️ SECONDA CORREZIONE: IL RIPIEGO NON E' LA gruppo_key ────────────────
#   Il -04 diceva che senza documento «`riferimento` ripiegava sulla gruppo_key
#   (a video «PREVENTIVO:01a0…»)». Falso: `vendite.commesse.codice` e' NOT NULL
#   e `commesse_attivita.commessa_id` pure, quindi per un gruppo documento il
#   PRIMO ramo del COALESCE — `commessa_codice` — c'e' sempre, e la gruppo_key
#   e' IRRAGGIUNGIBILE.
#   ⭐ E la correzione peggiora la diagnosi, non la addolcisce: una chiave
#   grezza a video si vede che e' rotta; un codice commessa sembra un valore
#   legittimo, e la riga NOMINA UN OGGETTO DIVERSO da quello di cui parla senza
#   che nessuno se ne accorga. E' lo stesso difetto che il FE ha gia' corretto
#   sull'azione «Apri commessa» — «portava a un oggetto DIVERSO da quello
#   scritto nella riga».
#   Verificato il 2026-09-01 sul caso fabbricato dal pgTAP
#   test-vw-dash-competenza-gruppi-riferimento-sorgente-v1: risoluzione vecchia
#   -> riferimento = CMM-…, documento_id = NULL; nuova -> PGTAP-VGRIF e l'id
#   della revisione spinta.
#
# ⚠️ Nessun DDL: la definizione della vista resta quella del -04, e con essa
#    security_invoker=on. Qui si riscrive il solo commento.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260901-05-fix-comment-vw-dash-competenza-gruppi-lateral-runtime-mctit.yaml

  - changeSet:
      id: 20260901-05-fix-comment-vw-dash-competenza-gruppi-lateral-runtime
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Correzione del solo COMMENT ON VIEW lasciato da 20260901-04. ⚠️ Quel commento diceva
        che la LATERAL «apriva SEI Seq Scan per gruppo perche' d.area = s.area e' correlato e
        non pota l'Append»: sei e' la forma del PIANO, non l'esecuzione. A runtime quattro rami
        sono `never executed`, perche' ogni ramo della UNION emette un'area COSTANTE e il
        confronto diventa un One-Time Filter per ramo. ⛔ Vale un changeSet perche' la frase,
        letta da chi diagnostica un caso simile, insegna che l'Append non si pota mai su un
        quale correlato — e' falso e lo porterebbe a progettare intorno a un vincolo
        inesistente. ⭐ La conclusione del -04 non cambia e ne esce rafforzata: il costo non
        erano sei scansioni, era che l'UNICO ramo che parte e' il resolver COMPLETO.
        ⚠️ Seconda correzione: il -04 diceva che senza documento `riferimento` ripiegava sulla
        gruppo_key — falso, ripiega sul CODICE COMMESSA, perche' commesse.codice e' NOT NULL e
        la gruppo_key e' irraggiungibile per un gruppo documento. ⭐ Peggiora la diagnosi invece
        di addolcirla: un codice commessa sembra legittimo, quindi la riga nomina un oggetto
        DIVERSO senza che nessuno se ne accorga. Nessun DDL: definizione della vista e
        security_invoker=on restano quelle del -04.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_dash_competenza_gruppi
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_class c
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'vendite'
                     AND c.relname = 'vw_dash_competenza_gruppi'
                     AND 'security_invoker=on' = ANY (c.reloptions);
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_dash_competenza_gruppi IS
                  'Lente 1 Competenza, gruppi fatturabili: l''unita'' dell''emissione mirata. Una riga per '
                  '(competenza_mese, gruppo_key). security_invoker=on (scope emittente). ⭐ Rev 2026-09-01 '
                  '(P-1, brief-db-riferimento-gruppi-lateral-costosa): `riferimento` e `documento_id` '
                  'arrivano da vendite.fn_get_sorgente_documento_ref(sorgente_tipo_id, sorgente_uid) e non '
                  'piu'' da una LEFT JOIN LATERAL su vw_dash_fatturazione_documenti. ⛔ Il perche'' non e'' la '
                  'velocita'': il predicato di prima, `(uid)::text = sorgente_uid`, NON e'' indicizzabile '
                  'sotto RLS e non puo'' diventarlo — il cast uuid → text e'' un CoerceViaIO e '
                  'uuid_out/textin non sono leakproof, quindi il quale non puo'' essere valutato prima del '
                  'security qual e non diventa mai un Index Cond. Chi in futuro trovasse '
                  'ix_preventivi_uid_text inutilizzato e pensasse di aggiungere lo stesso indice sugli '
                  'altri cinque rami costruirebbe cinque indici morti. ⛔ E la LATERAL ricostruiva il '
                  'resolver INTERO dell''area del gruppo, una volta per gruppo. ⚠️ Il changeSet 20260901-04 '
                  'scriveva «apriva SEI Seq Scan per gruppo», e questa revisione lo corregge: sei e'' la '
                  'forma del PIANO — `d.area = s.area` e'' correlato, quindi l''Append non si pota in fase di '
                  'piano — ma a RUNTIME quattro rami non partono, perche'' ogni ramo emette un''area COSTANTE '
                  'e il confronto diventa un One-Time Filter per ramo (i non corrispondenti risultano '
                  '`never executed`). ⭐ Il costo vero e'' che quell''UNO e'' il resolver completo: per un '
                  'gruppo preventivi si scandisce tutta vendite.preventivi, si uniscono le righe, si passa '
                  'da vw_preventivi_smistamento_righe, si aggrega, e poi si tiene UNA riga per due colonne. '
                  'Fatto datato 2026-09-01, competenza giugno, 48 gruppi: loops=31 sul ramo preventivi e '
                  'loops=17 su ordini, 21.813 + 7.109 buffer su 31.789 totali. La pagavano anche '
                  'vw_dash_competenza_gruppi_riepilogo e fn_list_emittibili_lane, che `riferimento` non lo '
                  'leggono mai. ⭐ Sparisce l''ORDER BY … LIMIT 1: era de-duplicazione forzata dalla sorgente '
                  'sbagliata (vw_dash_fatturazione_commesse emette una riga per mese, quindi un documento '
                  'poteva uscire piu'' volte). Ora il documento e'' unico per costruzione, e il presidio '
                  'anti-fan-out non dipende piu'' da un «prendine una». ⚠️ Il guard `s.area IS NOT NULL` e'' '
                  'passato nella ON ed e'' SEMANTICO, non difensivo: una sorgente senza area (ATTIVITA, '
                  'ATTIVITA_CONSUMI, le *_RIGA) non e'' un documento apribile, e `documento_id` per quei '
                  'gruppi deve restare NULL — il resolver, chiamato, restituirebbe l''id della target_table, '
                  'cioe'' un valore vero in una colonna che afferma un''altra cosa. ⚠️ Effetto voluto sui '
                  'gruppi la cui sorgente e'' esclusa dai resolver — preventivo superato da una revisione '
                  '(is_attiva = NOT is_abortito AND NOT is_superata), DDT con causale non fatturabile: '
                  'prima `riferimento` ripiegava, e ⚠️ ripiegava sul CODICE COMMESSA e non sulla '
                  'gruppo_key: commesse.codice e'' NOT NULL e commesse_attivita.commessa_id pure, quindi il '
                  'primo ramo del COALESCE c''e'' sempre e la gruppo_key e'' IRRAGGIUNGIBILE per un gruppo '
                  'documento. ⭐ E'' la forma PEGGIORE del difetto, non la piu'' lieve: una chiave grezza si '
                  'vede che e'' rotta, un codice commessa sembra un valore legittimo — la riga NOMINA UN '
                  'OGGETTO DIVERSO da quello di cui parla, ed e'' lo stesso difetto che il FE ha gia'' '
                  'corretto sull''azione «Apri commessa» («portava a un oggetto DIVERSO da quello scritto '
                  'nella riga»). La ricerca per numero non trovava la riga, e `documento_id` NULL faceva '
                  'sparire l''azione «apri». Ora esce il numero e l''azione torna. ⭐ Decisione D-1: apre la '
                  'REVISIONE SPINTA, non la corrente — e'' quella da cui vengono quantita'' e prezzi che si '
                  'stanno per fatturare. Il testo a video e'' identico nei due casi (label_selector = '
                  'numero, condiviso fra le revisioni): cambia solo l''id dell''azione. Rev 2026-08-18 (P-4, '
                  'brief perimetro-emittente Q4): espone emittente_ragione_sociale, non piu'' il solo '
                  'emittente_soggetto_ruolo_id — un id a video non dichiara l''emittente, lo nasconde '
                  'meglio. E'' la lista PILOTA del giro P-4 perche'' e'' quella da cui parte l''emissione '
                  'mirata: si spuntano i gruppi e si fattura. Rev 2026-08-26 (L5, '
                  'brief-db-registro-e-data-prevista-in-competenza): quattro colonne in coda — '
                  'registri_ids, registri_n, registro_codice, data_documento_prevista. ⛔ «UNO OPPURE N» '
                  '(decisione D-2): un gruppo puo'' toccare piu'' sezionali per costruzione — la chiave del '
                  'gruppo non contiene ne'' tipo documento ne'' natura, che sono colonne di RIGA — e in quel '
                  'caso codice e data restano VUOTI. Mai il primo che capita: un min() o un LIMIT 1 darebbe '
                  'un valore plausibile che descrive meta'' di cio'' che sta per succedere. I due min() qui '
                  'ci sono, ma dentro un CASE che ha gia'' verificato che l''insieme abbia un elemento solo. '
                  '⭐ registri_ids e'' l''elemento PORTANTE e non un extra: e'' cio'' su cui il backend filtra '
                  'per sezionale (decisione D-5), con %% = ANY(registri_ids). Filtrare su registro_codice '
                  'non funzionerebbe — su un gruppo multi-sezionale e'' NULL per decisione, quindi il gruppo '
                  'sparirebbe da ENTRAMBI i filtri, cioe'' proprio quello che ha piu'' bisogno di essere '
                  'visto. La domanda giusta e'' «questo gruppo TOCCA quel sezionale?». ⭐ registri_n non e'' '
                  'una seconda verita'': e'' cardinality(registri_ids), la stessa espressione con due nomi, '
                  'calcolata nella stessa vista. ⚠️ array_agg INCLUDE i NULL mentre count(DISTINCT) li '
                  'scarta in silenzio: e'' cosi'' che un gruppo con una riga risolta e una NON risolvibile '
                  'conta 2 e legge «piu'' registri», invece di mostrare un sezionale solo. E su un gruppo '
                  'interamente fatturato — dove la previsione e'' azzerata a monte per la decisione D-9 — '
                  'l''array e'' {NULL}, cardinalita'' 1, con codice e data a NULL: a video «—». ⛔ La frase '
                  '«piu'' registri» NON nasce qui (decisione D-4): il database dice QUANTI sono, il testo lo '
                  'mette BE/FE. Una vista che restituisse quella stringa scriverebbe italiano dentro il '
                  'database, e il prodotto ha it.json E en.json; il precedente giusto e'' in questa stessa '
                  'vista, dove tipo_gruppo restituisce un CODICE e non una frase.';
