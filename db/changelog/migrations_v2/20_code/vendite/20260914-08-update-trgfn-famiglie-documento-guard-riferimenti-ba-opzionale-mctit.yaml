# ------------------------------------------------------------
# P-9 (2 di 5) — il guard dei riferimenti salta il billing account quando non e' dichiarato
#   vendite.trgfn_famiglie_documento_guard_riferimenti
#   Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 3-bis
#
# -- CHE COSA CAMBIA, e dove ------------------------------------------------------
#   Il terzo controllo (la colonna del billing account esiste su pg_attribute)
#   si esegue solo se la colonna e' DICHIARATA: `COALESCE(btrim(...), '') <> ''`,
#   cioe' la stessa forma gia' usata per colonna_serie due righe sotto. Sul
#   VALORE e non solo sul NULL, perche' un form che non compila il campo manda
#   la stringa vuota. Tabella e colonna del numero restano obbligatorie; la
#   serie resta com'era.
#
# -- IL SALTO STA PRIMA DI COMPORRE ---------------------------------------------
#   Qui il nome finisce in un confronto su pg_attribute, non in un format(): il
#   pericolo non e' l'errore grezzo ma il rifiuto SBAGLIATO — una famiglia
#   legittima respinta con E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE per
#   una colonna che non deve esistere. Le due funzioni della storia (-09, -10)
#   hanno invece il format(): li' il salto e' nella query che sceglie.
#
# -- CORPO DALLA FUNZIONE VIVA -----------------------------------------------------
#   pg_get_functiondef, identica alla doc auto-gen (verificato il 2026-09-14):
#   e' la rev 20260901-15 con la serie. Tutto il resto — il secondo controllo
#   sulla serie, i due codici — e' intatto.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260914-08-update-trgfn-famiglie-documento-guard-riferimenti-ba-opzionale-mctit.yaml

  - changeSet:
      id: 20260914-08-update-trgfn-famiglie-documento-guard-riferimenti-ba-opzionale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_famiglie_documento_guard_riferimenti: il controllo su pg_attribute
        della colonna del billing account si esegue solo se la colonna e' dichiarata
        (COALESCE(btrim, '') <> '', come per la serie). Tabella e numero restano
        obbligatori. Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo,
        sezione 3-bis (P-9).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_famiglie_documento_guard_riferimenti'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_attribute a
                   WHERE a.attrelid = 'vendite.famiglie_documento'::regclass
                     AND a.attname = 'colonna_billing_account' AND NOT a.attnotnull
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_famiglie_documento_guard_riferimenti()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_relid     oid;
                  v_mancante  text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Una riga di vendite.famiglie_documento deve nominare
                  --   oggetti che ESISTONO: la tabella, la colonna del numero,
                  --   quella del billing account SE DICHIARATA (dal 2026-09-14
                  --   e' opzionale come la serie) e - dal 2026-09-01 - quella
                  --   della serie, che in piu' deve DISCRIMINARE il numero.
                  --
                  -- ⛔ Perche' serve: il presidio sul cambio emittente del BA
                  --   compone quei nomi in SQL dinamico. Senza questo guard un
                  --   refuso resterebbe muto fino al primo spostamento di un
                  --   billing account, dove uscirebbe come undefined_table —
                  --   un errore che non nomina la sua causa e arriva in un
                  --   movimento che con le famiglie non c'entra.
                  --
                  -- ⚠️ Solo sulle famiglie ATTIVE: una famiglia ritirata puo'
                  --   nominare una tabella che non c'e' piu'. E' storia.
                  -- =========================================================
                  IF NOT NEW.attivo THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ to_regclass torna NULL invece di sollevare, anche se lo
                  --   schema non esiste: e' proprio cio' che serve a un guard
                  --   che vuole comporre la propria frase.
                  v_relid := to_regclass(format('%I.%I', NEW.schema_tabella, NEW.nome_tabella));

                  IF v_relid IS NULL THEN
                      v_mancante := format('%I.%I', NEW.schema_tabella, NEW.nome_tabella);

                  ELSIF NOT EXISTS (
                      SELECT 1 FROM pg_attribute a
                       WHERE a.attrelid = v_relid
                         AND a.attname  = NEW.colonna_numero
                         AND a.attnum   > 0
                         AND NOT a.attisdropped
                  ) THEN
                      v_mancante := format('%I.%I.%I',
                          NEW.schema_tabella, NEW.nome_tabella, NEW.colonna_numero);

                  -- ⭐ Il billing account e' OPZIONALE (20260914-07): il vuoto e'
                  --   la dichiarazione che questa famiglia non ne ha uno — la
                  --   controparte non e' un cliente (l'ordine di acquisto). Si
                  --   guarda il VALORE e non solo il NULL, come per la serie:
                  --   un form che non compila il campo manda la stringa vuota.
                  --   Il salto sta QUI, prima di comporre: un %I con NULL
                  --   solleverebbe un errore di PostgreSQL senza codice di dominio.
                  ELSIF COALESCE(btrim(NEW.colonna_billing_account), '') <> ''
                        AND NOT EXISTS (
                      SELECT 1 FROM pg_attribute a
                       WHERE a.attrelid = v_relid
                         AND a.attname  = NEW.colonna_billing_account
                         AND a.attnum   > 0
                         AND NOT a.attisdropped
                  ) THEN
                      v_mancante := format('%I.%I.%I',
                          NEW.schema_tabella, NEW.nome_tabella, NEW.colonna_billing_account);

                  -- ⭐ La serie e' OPZIONALE: il vuoto e' la dichiarazione che
                  --   questa famiglia una serie non ce l'ha (resi, commesse).
                  --   Si guarda il VALORE e non solo il NULL, perche' un form
                  --   che non compila il campo manda la stringa vuota.
                  ELSIF COALESCE(btrim(NEW.colonna_serie), '') <> ''
                        AND NOT EXISTS (
                            SELECT 1 FROM pg_attribute a
                             WHERE a.attrelid = v_relid
                               AND a.attname  = NEW.colonna_serie
                               AND a.attnum   > 0
                               AND NOT a.attisdropped
                        ) THEN
                      v_mancante := format('%I.%I.%I',
                          NEW.schema_tabella, NEW.nome_tabella, NEW.colonna_serie);
                  END IF;

                  IF v_mancante IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_famiglie_documento_guard_riferimenti',
                          'E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE',
                          jsonb_build_object(
                              'codice_interno',          NEW.codice_interno,
                              'schema_tabella',          NEW.schema_tabella,
                              'nome_tabella',            NEW.nome_tabella,
                              'colonna_numero',          NEW.colonna_numero,
                              'colonna_billing_account', NEW.colonna_billing_account,
                              'colonna_serie',           NEW.colonna_serie,
                              'riferimento_mancante',    v_mancante),
                          NULL::uuid,
                          NEW.codice_interno::text,
                          v_mancante);
                  END IF;

                  -- ---------------------------------------------------------
                  -- ⭐ LA SERIE DEVE ANCHE DISCRIMINARE IL NUMERO
                  --   Qui la colonna ESISTE: il difetto e' un altro, e ha un
                  --   codice suo. La serie entra nella chiave del contatore,
                  --   quindi apre un secchio che riparte da 1; se il documento
                  --   non la porta anche nel proprio vincolo di unicita', quel
                  --   numero collide con uno gia' emesso e il documento non si
                  --   numera piu'.
                  --
                  -- ⛔ Il confronto e' sul TESTO della definizione dell'indice,
                  --   non sugli attnum di indkey: uq_fatture_numero porta la
                  --   serie come COALESCE(serie, ''), cioe' un'espressione, e
                  --   un'espressione ha attnum 0. Il predicato «preciso»
                  --   rifiuterebbe la FATTURA — verificato.
                  -- ⭐ E' lo stesso predicato del test 5 di
                  --   db/pgtap/vendite/test-chiave-contatore-assi-dichiarati-v1.sql.
                  -- ---------------------------------------------------------
                  IF COALESCE(btrim(NEW.colonna_serie), '') <> ''
                     AND NOT EXISTS (
                         SELECT 1
                           FROM pg_index x
                          WHERE x.indrelid = v_relid
                            AND x.indisunique
                            AND pg_get_indexdef(x.indexrelid) ~ ('\m' || NEW.colonna_numero || '\M')
                            AND pg_get_indexdef(x.indexrelid) ~ ('\m' || NEW.colonna_serie  || '\M')
                     ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_famiglie_documento_guard_riferimenti',
                          'E_FAMIGLIA_DOCUMENTO_SERIE_NON_DISCRIMINA',
                          jsonb_build_object(
                              'codice_interno', NEW.codice_interno,
                              'schema_tabella', NEW.schema_tabella,
                              'nome_tabella',   NEW.nome_tabella,
                              'colonna_numero', NEW.colonna_numero,
                              'colonna_serie',  NEW.colonna_serie,
                              -- ⚠️ Il campo che il form deve accendere: la
                              --   serie e' il valore che l'operatore ha scelto,
                              --   il numero e' un fatto della tabella.
                              'campo',          'colonna_serie'),
                          NULL::uuid,
                          NEW.codice_interno::text,
                          NEW.colonna_serie::text);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_famiglie_documento_guard_riferimenti()
              IS 'Guard `_a10_` su vendite.famiglie_documento: una famiglia ATTIVA deve nominare oggetti che esistono — la tabella del documento, la colonna del numero, quella del billing account e, se dichiarata, quella della serie. ⛔ PERCHE'': quei nomi finiscono in SQL dinamico dentro il presidio sul cambio emittente del billing account, e un refuso resterebbe muto fino al primo spostamento, dove uscirebbe come undefined_table in un movimento che con le famiglie non c''entra. ⭐ SULLA SERIE CI SONO DUE CONTROLLI E DUE CODICI: se la colonna non esiste e'' un refuso come gli altri tre (E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE); se esiste ma NON compare in un vincolo di unicita'' insieme alla colonna del numero e'' il caso peggiore — il nome e'' giusto e si legge — e ha il suo codice E_FAMIGLIA_DOCUMENTO_SERIE_NON_DISCRIMINA, perche'' la serie entra nella chiave del contatore e apre un secchio che riparte da 1: senza il vincolo allargato quel numero collide con uno gia'' emesso. ⛔ IL PREDICATO E'' TESTUALE su pg_get_indexdef e non per attnum, ed e'' verificato: uq_fatture_numero porta la serie come COALESCE(serie, '''''''') — un''espressione, che in pg_index.indkey ha attnum 0 — quindi la versione «precisa» rifiuterebbe la FATTURA e farebbe fallire il migrate sul mirror delle famiglie. E'' lo stesso predicato del test 5 di test-chiave-contatore-assi-dichiarati-v1: due predicati sulla stessa invariante, prima o poi, dissentono. ⚠️ Solo sulle famiglie ATTIVE: una famiglia ritirata puo'' nominare una tabella che non c''e'' piu'', ed e'' storia. Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.3 (DB-1). ⭐ rev 2026-09-14 (P-9, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 3-bis): la colonna del billing account e'' OPZIONALE come la serie — NULL o vuota = «questa famiglia non ha un billing account» (l''ordine di acquisto, la cui controparte e'' un soggetto_ruolo) — e il controllo su pg_attribute si salta PRIMA di comporre, non dentro: un %I con N