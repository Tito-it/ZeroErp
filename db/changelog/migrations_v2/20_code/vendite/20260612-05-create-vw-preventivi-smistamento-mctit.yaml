# Richiesta B (brief-db-smistamento-preventivi.md) — fonte dati del
# Pannello Smistamento: rename + rifacimento natura-aware delle viste
# fatturazione-centriche (breaking ratificato, progetto non in prod):
#
#   vw_preventivi_stato_fatturazione_righe -> vw_preventivi_smistamento_righe
#   vw_preventivi_stato_fatturazione       -> vw_preventivi_smistamento
#
# Novita' della vista righe:
#   - natura per riga (codice + destinazione_tipo effettiva, con
#     natura NULL = pregresso -> COMMESSA);
#   - ramo ordine esposto (ordine_riga_id / ordine_id / ordine_numero,
#     via ordini_righe.preventivo_riga_id, UNIQUE -> niente fan-out);
#   - stato_smistamento: UNICA colonna autorevole per la UI
#     (RESIDUA / A_ORDINE / IN_COMMESSA / EMESSA_AF / FATTURATA);
#     i flag booleani in_commessa/emessa_af/fatturata sono RIMOSSI
#     (il BE si adegua, decisione brief §3);
#   - allineamento predicato (divergenza preesistente): "in commessa"
#     ora richiede stato_emissione='EMESSA' (stessa verita' di
#     fn_list_preventivi_da_pushare / vista smistabili / capability);
#     una commessa_attivita non-EMESSA non conta piu'. EXISTS al posto
#     dei LEFT JOIN su commesse_attivita/attivita_fatturabili: niente
#     fan-out da segment_key/sorgente duplicati.
#
# Vista aggregata: contatori per ramo + righe_residue (progress
# "X/Y smistate -> EVASO" del pannello, gate D6).
#
# security_invoker = on su entrambe (policy RLS); il pgTAP
# rls/test-rls-viste-security-invoker.sql e' aggiornato ai nuovi nomi
# in questa stessa consegna.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260612-05-create-vw-preventivi-smistamento-mctit.yaml

  - changeSet:
      id: 20260612-05-create-vw-preventivi-smistamento
      author: mctit
      runOnChange: false
      validCheckSums: [ANY]
      failOnError: true
      comment: >
        Rename+rework viste smistamento preventivi: righe natura-aware
        con stato_smistamento autorevole (predicato EMESSA allineato) e
        aggregata con contatori per ramo. Drop delle viste
        stato_fatturazione (breaking ratificato).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Drop delle viste fatturazione-centriche (ordine: prima
              -- l'aggregata, che dipende dalla vista righe).
              DROP VIEW IF EXISTS vendite.vw_preventivi_stato_fatturazione;
              DROP VIEW IF EXISTS vendite.vw_preventivi_stato_fatturazione_righe;

              -- Idempotenza runOnChange: drop anche delle viste nuove (un
              -- rerun con CREATE secco fallirebbe; DROP+CREATE regge anche
              -- futuri cambi colonne, dove CREATE OR REPLACE non basta).
              DROP VIEW IF EXISTS vendite.vw_preventivi_smistamento;
              DROP VIEW IF EXISTS vendite.vw_preventivi_smistamento_righe;

              -- Vista per riga: una riga per ogni riga attiva del preventivo,
              -- con natura, destinazione e stato di smistamento autorevole.
              CREATE VIEW vendite.vw_preventivi_smistamento_righe
              WITH (security_invoker = on) AS
              SELECT
                  p.id        AS preventivo_id,
                  p.uid       AS preventivo_uid,
                  p.numero    AS preventivo_numero,
                  pr.id       AS riga_id,
                  pr.ordine   AS riga_ordine,
                  pr.descrizione AS riga_descrizione,
                  pr.articolo_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.prezzo_unitario,
                  pr.natura_vendita_id,
                  nv.codice   AS natura_vendita_codice,
                  -- Destinazione effettiva: natura NULL = pregresso -> COMMESSA
                  -- (stessa convenzione di fn_list_preventivi_da_pushare).
                  COALESCE(nv.destinazione_tipo, 'COMMESSA') AS destinazione_tipo,
                  -- Ramo ordine: ordini_righe.preventivo_riga_id e' UNIQUE
                  -- (idempotenza di riga) -> LEFT JOIN senza fan-out.
                  orr.id      AS ordine_riga_id,
                  o.id        AS ordine_id,
                  o.numero    AS ordine_numero,
                  -- Stato di smistamento: UNICA colonna autorevole per la UI.
                  -- Progressivi sul ramo commessa (FATTURATA > EMESSA_AF >
                  -- IN_COMMESSA); A_ORDINE per il ramo merce; RESIDUA = non
                  -- smistata. "In commessa" = segment EMESSA (allineato a
                  -- capability/list-fn: una ca non-EMESSA non conta).
                  CASE
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.attivita_fatturabili af
                       WHERE af.sorgente_uid = p.uid
                         AND af.sorgente_riga = pr.id
                         AND af.fattura_riga_id IS NOT NULL
                    ) THEN 'FATTURATA'
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.attivita_fatturabili af
                       WHERE af.sorgente_uid = p.uid
                         AND af.sorgente_riga = pr.id
                    ) THEN 'EMESSA_AF'
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.commesse_attivita ca
                       WHERE ca.segment_key = 'PREV:' || p.uid::text || ':R:' || pr.id::text
                         AND ca.stato_emissione = 'EMESSA'
                    ) THEN 'IN_COMMESSA'
                    WHEN orr.id IS NOT NULL THEN 'A_ORDINE'
                    ELSE 'RESIDUA'
                  END AS stato_smistamento
              FROM vendite.preventivi p
              JOIN vendite.preventivi_righe pr
                ON pr.preventivo_id = p.id
               AND pr.attivo IS TRUE
              LEFT JOIN config.nature_vendita nv ON nv.id = pr.natura_vendita_id
              LEFT JOIN vendite.ordini_righe orr ON orr.preventivo_riga_id = pr.id
              LEFT JOIN vendite.ordini o ON o.id = orr.ordine_id;

              COMMENT ON VIEW vendite.vw_preventivi_smistamento_righe IS
                'Fonte dati del Pannello Smistamento (una riga per riga attiva del preventivo): natura/destinazione effettiva (NULL = pregresso -> COMMESSA), riferimenti ramo ordine, stato_smistamento autorevole (RESIDUA/A_ORDINE/IN_COMMESSA/EMESSA_AF/FATTURATA, "in commessa" = segment EMESSA). Sostituisce vw_preventivi_stato_fatturazione_righe (brief-db-smistamento-preventivi.md B).';

              -- Vista aggregata: contatori per ramo + residuo complessivo.
              CREATE VIEW vendite.vw_preventivi_smistamento
              WITH (security_invoker = on) AS
              SELECT
                  preventivo_id,
                  preventivo_uid,
                  preventivo_numero,
                  count(*) AS righe_totali,
                  count(*) FILTER (WHERE destinazione_tipo = 'ORDINE')   AS righe_merce,
                  count(*) FILTER (WHERE destinazione_tipo = 'COMMESSA') AS righe_servizi,
                  count(*) FILTER (WHERE stato_smistamento = 'A_ORDINE') AS righe_a_ordine,
                  -- Contatori progressivi ramo commessa (semantica invariata
                  -- rispetto ai vecchi flag: fatturata implica emessa implica
                  -- in commessa).
                  count(*) FILTER (WHERE stato_smistamento IN ('IN_COMMESSA','EMESSA_AF','FATTURATA')) AS righe_in_commessa,
                  count(*) FILTER (WHERE stato_smistamento IN ('EMESSA_AF','FATTURATA'))               AS righe_emesse_af,
                  count(*) FILTER (WHERE stato_smistamento = 'FATTURATA')                              AS righe_fatturate,
                  -- Residuo complessivo, qualunque ramo: alimenta il progress
                  -- "X/Y smistate -> EVASO" del pannello (gate D6).
                  count(*) FILTER (WHERE stato_smistamento = 'RESIDUA')                                AS righe_residue
              FROM vendite.vw_preventivi_smistamento_righe
              GROUP BY preventivo_id, preventivo_uid, preventivo_numero;

              COMMENT ON VIEW vendite.vw_preventivi_smistamento IS
                'Aggregata smistamento preventivo: contatori per ramo (merce/servizi, a ordine/in commessa/emesse/fatturate) + righe_residue complessivo per il progress "X/Y smistate -> EVASO" (gate D6). Sostituisce vw_preventivi_stato_fatturazione.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_preventivi_smistamento;
              DROP VIEW IF EXISTS vendite.vw_preventivi_smistamento_righe;
              -- Ripristino viste precedenti: vedi definizioni storiche
              -- vw_preventivi_stato_fatturazione* (changeSet pregressi).
