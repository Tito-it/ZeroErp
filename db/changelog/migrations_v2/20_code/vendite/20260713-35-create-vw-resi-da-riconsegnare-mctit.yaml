# Slice RESI vendita — coda "da ri-consegnare" vw_resi_da_riconsegnare (brief §5).
#
# Righe reso di tipo ri-consegna (tipi_reso.riapre_residuo = true, data-driven)
# su resi CONFERMATI con copertura incompleta (qta_resa > Sigma
# resi_righe_riconsegne.qta). Espone la copertura residua e lo STATO ri-consegna
# DERIVATO (DA_RICONSEGNARE/PARZIALE/COMPLETATA, brief §4b/§9 R1) come colonna
# virtuale — nessuna colonna di stato fisica. Coda per-reso agganciata al DDT:
# funziona anche per lo standalone; si auto-svuota quando la copertura raggiunge
# qta_resa. security_invoker=on + RLS sulla base.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-35-create-vw-resi-da-riconsegnare-mctit.yaml

  - changeSet:
      id: 20260713-35-create-vw-resi-da-riconsegnare
      author: mctit
      # ⚠️ Era `true`: definisce vendite.vw_resi_da_riconsegnare, che un changeSet PIU' RECENTE
      #   ridefinisce. Rigirando riportava indietro quella revisione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_resi_da_riconsegnare
              WITH (security_invoker=on) AS
              SELECT rr.id AS resi_riga_id,
                  r.id     AS reso_id,
                  r.uid    AS reso_uid,
                  r.numero AS reso_numero,
                  r.data,
                  r.emittente_fiscale_id,
                  r.billing_account_id,
                  r.destinatario_soggetto_ruolo_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  rr.articolo_id,
                  rr.descrizione,
                  rr.uom_operativa_id,
                  rr.quantita                       AS qta_resa,
                  COALESCE(ric.tot, 0)              AS qta_riconsegnata,
                  rr.quantita - COALESCE(ric.tot, 0) AS qta_residua,
                  CASE
                      WHEN COALESCE(ric.tot, 0) = 0            THEN 'DA_RICONSEGNARE'
                      WHEN COALESCE(ric.tot, 0) < rr.quantita  THEN 'PARZIALE'
                      ELSE 'COMPLETATA'
                  END AS stato_riconsegna,
                  rr.ddt_riga_id,
                  dr.ddt_id,
                  d.numero AS ddt_numero,
                  rr.ordine_riga_id
                 FROM vendite.resi_righe rr
                   JOIN vendite.resi r           ON r.id = rr.reso_id
                   JOIN config.stati_doc_reso sr ON sr.id = r.stato_doc_reso_id
                   JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                   JOIN vendite.ddt_righe dr     ON dr.id = rr.ddt_riga_id
                   JOIN vendite.ddt d            ON d.id = dr.ddt_id
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON sr_dest.id = r.destinatario_soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s_dest ON s_dest.id = sr_dest.soggetto_id
                   LEFT JOIN (
                       SELECT resi_riga_id, SUM(qta) AS tot
                         FROM vendite.resi_righe_riconsegne
                        GROUP BY resi_riga_id
                   ) ric ON ric.resi_riga_id = rr.id
                WHERE sr.codice_interno = 'CONFERMATO'
                  AND tr.riapre_residuo = true                 -- ri-consegna (data-driven)
                  AND rr.attivo IS TRUE
                  AND rr.quantita - COALESCE(ric.tot, 0) > 0;  -- copertura incompleta

              COMMENT ON VIEW vendite.vw_resi_da_riconsegnare IS
                'Coda righe reso da ri-consegnare (riapre_residuo=true, copertura incompleta), con stato_riconsegna derivato. Agganciata al DDT (funziona anche standalone), si auto-svuota. security_invoker=on + RLS su base. rev 2026-07-13.';
