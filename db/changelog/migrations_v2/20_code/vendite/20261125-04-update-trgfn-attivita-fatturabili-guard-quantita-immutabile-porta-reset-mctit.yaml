# comment-al-presente: ammesso — file gia' applicato e mergiato, non si riscrive (checksum): i suoi COMMENT li riscrive al presente 20_code/vendite/20261125-28.
# LA PORTA DEL RESET CHIEDE ANCHE IL PROPRIETARIO
#   vendite.trgfn_attivita_fatturabili_guard_quantita_immutabile
#   Brief: brief-db-porte-aperte-dalla-sola-guc §13.5 (giro 8 + 1-7, porte 1-7; D-A a, D-W a di Tid).
#
# -- CHE COSA CAMBIA ---------------------------------------------------------
#   La porta del reset del lotto si legge da vendite.fn_porta_reset_lotto_aperta
#   (20261125-02): GUC accesa E proprietario della tabella. Prima bastava la
#   GUC, e l'app poteva accenderla da se' e scrivere diretta. La lettura copiata
#   qui si ritira (regola del 2). Il resto del guard e' invariato; il COMMENT
#   si riscrive al presente (linee-guida-sql §5d).
#   Corpo dal catalogo di dbdev.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261125-04-update-trgfn-attivita-fatturabili-guard-quantita-immutabile-porta-reset-mctit.yaml

  - changeSet:
      id: 20261125-04-update-trgfn-attivita-fatturabili-guard-quantita-immutabile-porta-reset
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_attivita_fatturabili_guard_quantita_immutabile: la porta del reset del
        lotto dal BB, GUC e proprietario. Brief: brief-db-porte-aperte-dalla-sola-guc §13.5.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_quantita_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_qta_ca vendite.commesse_attivita.quantita%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La quantita dell'AF DEVE specchiare la commessa madre. Si
                  --   blocca solo l'UPDATE che disallinea l'AF dalla CA (valore
                  --   diverso). L'emit (upsert AF.quantita = ca.quantita) passa per
                  --   costruzione; un UPDATE manuale a valore diverso e' bloccato.
                  --   Brief immutabilita-quantita §4a (mirror-enforcement, 2026-07-21).
                  -- Regole:
                  --   - passa la porta del reset del lotto: GUC e proprietario
                  --     (vendite.fn_porta_reset_lotto_aperta);
                  --   - se commessa_attivita_id IS NULL non c'e' specchio da imporre.
                  -- =========================================================
                  IF vendite.fn_porta_reset_lotto_aperta(TG_RELID) THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.commessa_attivita_id IS NOT NULL
                     AND NEW.quantita IS DISTINCT FROM OLD.quantita THEN

                      SELECT ca.quantita INTO v_qta_ca
                        FROM vendite.commesse_attivita ca
                       WHERE ca.id = NEW.commessa_attivita_id;

                      IF NEW.quantita IS DISTINCT FROM v_qta_ca THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_ATTIVITA_FATTURABILE_QUANTITA_IMMUTABILE',
                              jsonb_build_object(
                                  'id', OLD.id,
                                  'commessa_attivita_id', NEW.commessa_attivita_id,
                                  'quantita_new', NEW.quantita,
                                  'quantita_commessa', v_qta_ca),
                              NULL::uuid, OLD.id::text, v_qta_ca::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_quantita_immutabile() IS $c$Guard mirror-enforcement quantita attivita_fatturabili: blocca UPDATE che porterebbe la quantita a un valore diverso dalla commessa madre (commessa_attivita_id). L'emit (upsert = specchio) passa; passa anche la porta del reset del lotto (vendite.fn_porta_reset_lotto_aperta: GUC zeroerp.maintenance_reset_lotto_draft e proprietario della tabella). Errore E_ATTIVITA_FATTURABILE_QUANTITA_IMMUTABILE. Brief immutabilita-quantita §4a (2026-07-21).$c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_quantita_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_bypass text;
                  v_qta_ca vendite.commesse_attivita.quantita%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La quantita dell'AF DEVE specchiare la commessa madre. Si
                  --   blocca solo l'UPDATE che disallinea l'AF dalla CA (valore
                  --   diverso). L'emit (upsert AF.quantita = ca.quantita) passa per
                  --   costruzione; un UPDATE manuale a valore diverso e' bloccato.
                  --   Brief immutabilita-quantita §4a (mirror-enforcement, 2026-07-21).
                  -- Regole:
                  --   - bypass tecnico via GUC zeroerp.maintenance_reset_lotto_draft;
                  --   - se commessa_attivita_id IS NULL non c'e' specchio da imporre.
                  -- =========================================================
                  v_bypass := current_setting('zeroerp.maintenance_reset_lotto_draft', true);
                  IF v_bypass IS NOT NULL AND lower(v_bypass) IN ('1','true','on','yes') THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.commessa_attivita_id IS NOT NULL
                     AND NEW.quantita IS DISTINCT FROM OLD.quantita THEN

                      SELECT ca.quantita INTO v_qta_ca
                        FROM vendite.commesse_attivita ca
                       WHERE ca.id = NEW.commessa_attivita_id;

                      IF NEW.quantita IS DISTINCT FROM v_qta_ca THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_ATTIVITA_FATTURABILE_QUANTITA_IMMUTABILE',
                              jsonb_build_object(
                                  'id', OLD.id,
                                  'commessa_attivita_id', NEW.commessa_attivita_id,
                                  'quantita_new', NEW.quantita,
                                  'quantita_commessa', v_qta_ca),
                              NULL::uuid, OLD.id::text, v_qta_ca::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_quantita_immutabile() IS $c$Guard mirror-enforcement quantita attivita_fatturabili: blocca UPDATE che porterebbe la quantita a un valore diverso dalla commessa madre (commessa_attivita_id). L'emit (upsert = specchio) passa; bypass via GUC zeroerp.maintenance_reset_lotto_draft. Errore E_ATTIVITA_FATTURABILE_QUANTITA_IMMUTABILE. Brief immutabilita-quantita §4a (2026-07-21).$c$;
