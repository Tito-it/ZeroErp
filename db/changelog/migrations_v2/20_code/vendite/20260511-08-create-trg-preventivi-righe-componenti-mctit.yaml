  # --- AFTER INSERT OR UPDATE: FK check articolo attivo ------------------
  - changeSet:
      id: 20260511-08-06-trg-prevrighe-comp-a10-articoli-attivo
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        AFTER INSERT OR UPDATE: verifica che l'articolo componente
        (componente_id) sia attivo in catalogo.articoli.
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_articoli_require_attivo_ins_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_a10_articoli_require_attivo_ins_upd
                  AFTER INSERT OR UPDATE
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                      'catalogo', 'articoli', 'attivo', 'componente_id', 'id'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_articoli_require_attivo_ins_upd
                  ON vendite.preventivi_righe_componenti;

  # --- AFTER INSERT OR UPDATE: FK check iva attivo (se valorizzato) ------
  - changeSet:
      id: 20260511-08-07-trg-prevrighe-comp-a10-iva-attivo
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        AFTER INSERT OR UPDATE: verifica che iva_id sia attivo in
        config.iva. Skip automatico se iva_id IS NULL (campo opzionale).
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_iva_require_attivo_ins_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_a10_iva_require_attivo_ins_upd
