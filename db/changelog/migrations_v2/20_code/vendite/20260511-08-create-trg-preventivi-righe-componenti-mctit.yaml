      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE INSERT OR UPDATE: audit data_update/user_update tramite
        script.trgfn_audit_data_user_generic.
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_audit_data_user_ins_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_audit_data_user_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_audit_data_user_generic();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_audit_data_user_ins_upd
                  ON vendite.preventivi_righe_componenti;

  # --- BEFORE INSERT OR UPDATE: tx_id ------------------------------------
  - changeSet:
      id: 20260511-08-05-trg-prevrighe-comp-tx-id
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE INSERT OR UPDATE: genera/recupera tx_id di sessione
