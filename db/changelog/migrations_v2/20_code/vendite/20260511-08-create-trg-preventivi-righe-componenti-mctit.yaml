# ------------------------------------------------------------
# Trigger su vendite.preventivi_righe_componenti.
#
# Ordine esecuzione (lessicografico):
#   BEFORE: _a10_guard_bom_coerenza (guard BoM)
#           _a10_guard_pending      (guard L3)
#           _m50_calcola_quantita   (calcola qta da coeff*padre)
#           audit_data_user         (audit ins/upd)
#           gen_tx_id               (tx_id managed)
#   AFTER:  _a10_articoli_require_attivo (FK check articolo)
#           _a10_iva_require_attivo      (FK check iva, se valorizzato)
#           _z90_ricalcola_padre         (SUM -> prezzo padre)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-08-create-trg-preventivi-righe-componenti-mctit.yaml

  # --- BEFORE INSERT OR UPDATE: guard coerenza BoM -----------------------
  - changeSet:
      id: 20260511-08-01-trg-prevrighe-comp-a10-guard-bom
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE INSERT OR UPDATE: verifica coerenza BoM CASO A tramite
        script.trgfn_componenti_guard_coerenza_bom. 5 guard:
        is_composito padre, appartenenza BoM, componente_id coerente,
        esposto_in_fattura=TRUE, validita BoM @> data documento.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: preventivi_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_componenti_guard_coerenza_bom';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_guard_bom_coerenza_ins_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_a10_guard_bom_coerenza_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_guard_coerenza_bom(
                      'vendite',
                      'preventivi_righe',
                      'riga_preventivo_id',
                      'preventivi',
                      'preventivo_id',
                      'data'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_guard_bom_coerenza_ins_upd
                  ON vendite.preventivi_righe_componenti;

  # --- BEFORE UPDATE: guard L3 PENDING -----------------------------------
  - changeSet:
      id: 20260511-08-02-trg-prevrighe-comp-a10-guard-pending
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE UPDATE: guard L3 — blocca campi struttura quando
        stato_approvazione_prezzo=PENDING. Solo UPDATE (non INSERT).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'trgfn_preventivi_righe_componenti_guard_pending';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_guard_pending_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_a10_guard_pending_upd
                  BEFORE UPDATE
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_preventivi_righe_componenti_guard_pending();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_a10_guard_pending_upd
                  ON vendite.preventivi_righe_componenti;

  # --- BEFORE INSERT OR UPDATE: calcola quantita (intermedio _m50_) ------
  - changeSet:
      id: 20260511-08-03-trg-prevrighe-comp-m50-calcola-quantita
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE INSERT OR UPDATE _m50_: imposta quantita =
        coeff_qta_snapshot * quantita_riga_padre. Fase _m50_ (intermedia)
        garantisce esecuzione dopo i guard _a10_ e prima di _z90_.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'trgfn_componenti_calcola_quantita';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_m50_calcola_quantita_ins_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_m50_calcola_quantita_ins_upd
                  BEFORE INSERT OR UPDATE
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_calcola_quantita(
                      'vendite',
                      'preventivi_righe',
                      'riga_preventivo_id'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_m50_calcola_quantita_ins_upd
                  ON vendite.preventivi_righe_componenti;

