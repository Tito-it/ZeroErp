  # --- AFTER INSERT OR UPDATE OR DELETE: ricalcola prezzo padre ----------
  - changeSet:
      id: 20260511-08-08-trg-prevrighe-comp-z90-ricalcola-padre
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        AFTER INSERT OR UPDATE OR DELETE _z90_: ricalcola prezzo_unitario
        della riga padre come SUM(prezzo_unitario * coeff_qta_snapshot)
        dei figli attivi. Tramite script.trgfn_componenti_ricalcola_padre.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'trgfn_componenti_ricalcola_padre';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_componenti_z90_ricalcola_padre_ins_upd_dlt
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_preventivi_righe_componenti_z90_ricalcola_padre_ins_upd_dlt
                  AFTER INSERT OR UPDATE OR DELETE
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_ricalcola_padre(
                      'vendite',
                      'preventivi_righe',
                      'preventivi_righe_componenti',
                      'riga_preventivo_id'
                  );
      rollback:
