# IL NORMALIZE DELL'ATTIVITA' FATTURABILE SENZA IL RAMO MORTO
#   Brief: brief-db-sorgente-documento-e-riga §7.3 «Trovato riscrivendo» (codice morto), giro finale.
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Il ramo «righe non da commessa» (competenza_mese al primo del mese, da
#   posticipa_al; competenza_dal/al dalla data dell'attivita'; valuta dalla
#   catena BA -> emittente -> gestore) gira solo con commessa_attivita_id NULL,
#   e la colonna e' NOT NULL: non si raggiunge da nessuna strada. Il modello non
#   ammette piu' un'attivita' senza riga di commessa. L'unico scrittore,
#   vendite.fn_emit_attivita_fatturabili_da_commessa, copia le competenze dalla
#   riga di commessa, che ha gia' il CHECK del primo del mese e le date NOT NULL;
#   sulla tabella restano chk_attivita_competenza_mese_primo e competenza_dal <=
#   competenza_al. Il comportamento non cambia.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Il corpo perde il ramo e l'IF che lo separava; il ramo vivo resta identico.
#   Il trigger non si rimonta: le colonne del suo UPDATE OF restano le stesse.
#   Il COMMENT al presente. Corpo di partenza: il vivo (dbdev, 2026-11-08),
#   uguale al 20261107-42. Rollback: il corpo e il COMMENT di prima.
#   pgTAP: vendite/test-attivita-fatturabili (i test 2 e 3.1 provano gia' che la
#   riga con competenze sbagliate o assenti e' respinta dai CHECK),
#   vendite/test-trigger-af-commessa-aware-v1, vendite/test-sorgente-commenti-al-presente-v1
#   (la forma del COMMENT).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261110-13-update-trgfn-attivita-fatturabili-normalize-senza-ramo-morto-mctit.yaml

  - changeSet:
      id: 20261110-13-update-trgfn-attivita-fatturabili-normalize-senza-ramo-morto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_attivita_fatturabili_normalize senza il ramo delle righe non da commessa,
        irraggiungibile (commessa_attivita_id NOT NULL); COMMENT al presente.
        brief-db-sorgente-documento-e-riga §7.3, giro finale.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_attribute
               WHERE attrelid = 'vendite.attivita_fatturabili'::regclass
                 AND attname = 'commessa_attivita_id' AND attnotnull;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_normalize()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_emittente_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                v_tipo_origine vendite.commesse_attivita.sorgente_tipo_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Completa tipo_doc_fiscale_id e valuta_id dell'attivita'
                --   fatturabile, che nasce sempre da una riga di commessa
                --   (commessa_attivita_id e' NOT NULL).
                --
                -- Regole:
                --   - le competenze (competenza_mese, competenza_dal/al) arrivano
                --     complete dalla riga di commessa: qui non si toccano. Le
                --     tengono i CHECK della tabella (primo del mese, dal <= al);
                --   - tipo_doc_fiscale_id, se manca: dal tipo del documento da cui
                --     nasce la riga di commessa (commesse_attivita.sorgente_tipo_id);
                --     la riga senza documento (onere, rettifica) prende il tipo
                --     COMMESSA;
                --   - valuta_id, se manca: dal billing account e dall'emittente
                --     della commessa.
                -- =========================================================

                IF TG_OP = 'DELETE' THEN
                  RETURN OLD;
                END IF;

                IF NEW.tipo_doc_fiscale_id IS NULL THEN
                  SELECT COALESCE(ca.sorgente_tipo_id, s.id)
                    INTO v_tipo_origine
                    FROM vendite.commesse_attivita ca
                    LEFT JOIN config.sorgenti s ON s.codice_interno = 'COMMESSA'
                   WHERE ca.id = NEW.commessa_attivita_id;
                  IF v_tipo_origine IS NOT NULL THEN
                    NEW.tipo_doc_fiscale_id := vendite.fn_get_tipo_doc_fiscale_id(v_tipo_origine);
                  END IF;
                END IF;

                IF NEW.valuta_id IS NULL AND NEW.billing_account_id IS NOT NULL THEN
                  SELECT c.emittente_soggetto_ruolo_id
                    INTO v_emittente_id
                    FROM vendite.commesse c
                   WHERE c.id = NEW.commessa_id;
                  NEW.valuta_id := vendite.fn_get_valuta_id(
                    NEW.billing_account_id, v_emittente_id
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_normalize() IS
                'Completa tipo_doc_fiscale_id e valuta_id di vendite.attivita_fatturabili, BEFORE INSERT OR UPDATE. L''attivita'' nasce sempre da una riga di commessa (commessa_attivita_id NOT NULL) e ne riceve le competenze gia'' complete: qui non si toccano, le tengono i CHECK della tabella. Se manca, tipo_doc_fiscale_id viene dal tipo del documento da cui nasce la riga di commessa (commesse_attivita.sorgente_tipo_id), o dal tipo COMMESSA per la riga senza documento (onere, rettifica), con vendite.fn_get_tipo_doc_fiscale_id; se manca, valuta_id viene dal billing account e dall''emittente della commessa (vendite.fn_get_valuta_id).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_normalize()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_emittente_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                v_tipo_origine vendite.commesse_attivita.sorgente_tipo_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Normalizza campi base e risolve tipo_doc_fiscale/valuta.
                --
                -- Regole:
                --   - competenza_mese sempre valorizzata e al primo del mese
                --   - se NULL -> mese di posticipa_al (se presente)
                --   - competenza_dal/al: se NULL, default su data_attivita
                --   - tipo_doc_fiscale_id: dal tipo del documento da cui nasce la
                --     riga di commessa (commesse_attivita.sorgente_tipo_id, per la FK
                --     commessa_attivita_id); la riga senza documento (onere, rettifica)
                --     nasce dalla commessa, e prende il tipo COMMESSA
                --   - valuta_id: BA -> emittente fiscale -> gestore
                --   - Commessa-aware: quando commessa_attivita_id IS NOT NULL
                --     lo snapshot CA e` gia` completo per competenze,
                --     si preserva risoluzione tipo_doc/valuta se NULL.
                -- =========================================================

                IF TG_OP = 'DELETE' THEN
                  RETURN OLD;
                END IF;

                -- -------------------------------------------------------
                -- Righe da commessa: lo snapshot competenze e` gia` completo.
                -- Si preserva risoluzione tipo_doc_fiscale_id e valuta_id
                -- perche` CA potrebbe non averli.
                -- -------------------------------------------------------
                IF NEW.commessa_attivita_id IS NOT NULL THEN
                  -- tipo_doc_fiscale_id: CA potrebbe non averlo. Il tipo si legge dalla
                  -- riga di commessa: la provenienza dell'attivita' e' la FK
                  -- commessa_attivita_id, e la riga di commessa dice da quale documento nasce.
                  IF NEW.tipo_doc_fiscale_id IS NULL THEN
                    SELECT COALESCE(ca.sorgente_tipo_id, s.id)
                      INTO v_tipo_origine
                      FROM vendite.commesse_attivita ca
                      LEFT JOIN config.sorgenti s ON s.codice_interno = 'COMMESSA'
                     WHERE ca.id = NEW.commessa_attivita_id;
                    IF v_tipo_origine IS NOT NULL THEN
                      NEW.tipo_doc_fiscale_id := vendite.fn_get_tipo_doc_fiscale_id(v_tipo_origine);
                    END IF;
                  END IF;

                  -- valuta_id: emittente dalla commessa (gia` risolto da fn_get_or_create_commessa)
                  IF NEW.valuta_id IS NULL AND NEW.billing_account_id IS NOT NULL THEN
                    SELECT c.emittente_soggetto_ruolo_id
                      INTO v_emittente_id
                      FROM vendite.commesse c
                     WHERE c.id = NEW.commessa_id;
                    NEW.valuta_id := vendite.fn_get_valuta_id(
                      NEW.billing_account_id, v_emittente_id
                    );
                  END IF;

                  RETURN NEW;
                END IF;

                -- -------------------------------------------------------
                -- Flusso standard (righe non da commessa)
                -- -------------------------------------------------------
                IF NEW.competenza_mese IS NULL AND NEW.posticipa_al IS NOT NULL THEN
                  NEW.competenza_mese := date_trunc('month', NEW.posticipa_al)::date;
                ELSIF NEW.competenza_mese IS NOT NULL THEN
                  NEW.competenza_mese := date_trunc('month', NEW.competenza_mese)::date;
                END IF;

                IF NEW.competenza_dal IS NULL THEN
                  NEW.competenza_dal := NEW.data_attivita;
                END IF;

                IF NEW.competenza_al IS NULL THEN
                  NEW.competenza_al := NEW.competenza_dal;
                END IF;

                -- Risolvi emittente da BA per risoluzione valuta
                IF NEW.billing_account_id IS NOT NULL THEN
                  v_emittente_id := anagrafiche.fn_get_emittente_fiscale_id(
                    NEW.billing_account_id
                  );
                END IF;

                IF NEW.valuta_id IS NULL THEN
                  NEW.valuta_id := vendite.fn_get_valuta_id(
                    NEW.billing_account_id,
                    v_emittente_id
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_normalize() IS
                'Normalizza le competenze e risolve tipo_doc_fiscale_id e valuta_id di vendite.attivita_fatturabili. Sulla riga nata da una riga di commessa (commessa_attivita_id) le competenze arrivano gia'' complete; se manca, tipo_doc_fiscale_id viene dal tipo del documento da cui nasce la riga di commessa (commesse_attivita.sorgente_tipo_id), o dal tipo COMMESSA per la riga senza documento (onere, rettifica), con vendite.fn_get_tipo_doc_fiscale_id; la valuta dall''emittente della commessa. Altrimenti competenza_mese al primo del mese, competenza_dal/al dalla data dell''attivita'', valuta dalla catena BA -> emittente -> gestore.';
