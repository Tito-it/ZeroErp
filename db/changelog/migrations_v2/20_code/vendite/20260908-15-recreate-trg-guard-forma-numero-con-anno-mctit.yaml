# ------------------------------------------------------------
# A-5 — IL GUARD DELLA FORMA IMPARA LA QUARTA COLONNA
#   vendite.trgfn_registri_fatturazione_guard_forma_numero + il suo trigger
#   Piano: brief-db-registri-numerazione-chiave-del-contatore, sezione 11.8
#
# -- PERCHE' -------------------------------------------------
#   `anno_nel_numero` cambia la stringa che il sezionale consegna, esattamente
#   come prefisso, suffisso e lunghezza. Spegnerla su un registro che ha gia'
#   numerato farebbe convivere DUE forme con numeri consecutivi — la ragione
#   per cui questo guard esiste da 20260901-03.
#   ⇒ Tre colonne presidiate e la quarta libera sarebbe una porta di servizio
#   sulla stessa regola.
#
# -- ⛔ E NON BASTAVA ALLARGARE `UPDATE OF`, che era la prima stesura
#   Il corpo del guard comincia con un confronto sui VALORI — il no-op che
#   lascia passare un UPDATE che nomina una colonna senza cambiarla, e che
#   serve perche' i mirror CSV riscrivono queste righe a ogni migrate.
#   Quel confronto guardava le TRE colonne: allargato il solo trigger, un
#   cambio della quarta arrivava al guard, trovava «nessuna delle tre e'
#   cambiata» e passava. Il rifiuto non scattava, e non falliva niente.
#   ⭐ L'ha trovato il TEST 7 di test-anno-nel-numero-v1 nella prova
#   d'insieme, non un ragionamento: allargare il trigger sembrava
#   sufficiente, e a leggerlo sembrava fatto.
#   ⇒ Qui si riscrivono ENTRAMBI: la funzione (il confronto) e il trigger
#   (l'elenco che lo sveglia). Una sola delle due non presidia niente.
#
# -- DROP + CREATE PER IL TRIGGER, NON ALTER ------------------
#   PostgreSQL non ha un `ALTER TRIGGER ... UPDATE OF`. ⚠️ `DROP TRIGGER IF
#   EXISTS`: su un database ricostruito da zero il trigger c'e' gia'
#   (20260901-03 sta prima nella timeline), ma l'IF EXISTS costa nulla ed e'
#   la forma che non muore mai.
#   ⛔ Non e' un trigger di automazione — lo scrive un changeSet, non
#   ci_apply — quindi linee-guida-sql §11.5 non lo riguarda.
#
# -- CORPO DALLA FUNZIONE VIVA -------------------------------
#   Il corpo e' quello in servizio piu' la riga di confronto; la firma non ha
#   parametri, quindi non c'e' nessun %TYPE da recuperare da un YAML.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-15-recreate-trg-guard-forma-numero-con-anno-mctit.yaml

  - changeSet:
      id: 20260908-15-recreate-trg-guard-forma-numero-con-anno
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il guard della forma del numero impara la quarta colonna: anno_nel_numero cambia la
        stringa consegnata quanto prefisso, suffisso e lunghezza, e spegnerla su un registro che
        ha gia'' numerato farebbe convivere due forme con numeri consecutivi. ⛔ Si riscrivono
        ENTRAMBI, funzione e trigger: allargare la sola clausola UPDATE OF non bastava, perche''
        il no-op in testa al guard confronta i VALORI delle sole tre colonne e vedeva «nessuna
        cambiata» proprio sul cambio nuovo - il rifiuto non scattava e non falliva niente.
        L''ha trovato il test 7 di test-anno-nel-numero-v1 nella prova d''insieme, non un
        ragionamento. Piano: brief-db-registri-numerazione-chiave-del-contatore, sezione 11.8 (A-5).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: anno_nel_numero
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'trgfn_registri_fatturazione_guard_forma_numero';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_registri_fatturazione_guard_forma_numero()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_motivi jsonb;
                  v_primo  jsonb;
                  v_campo  text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare il cambio della FORMA DEL NUMERO — prefisso,
                  --   suffisso, lunghezza_numero — su un registro che ha gia'
                  --   consegnato almeno un numero.
                  --
                  -- ⛔ Perche': il contatore NON riparte quando cambia la
                  --   forma, prosegue. Il documento successivo esce con una
                  --   forma nuova e un numero che continua la serie vecchia, e
                  --   nessun vincolo se ne accorge — la coppia (forma, numero)
                  --   non e' vincolata da nessuna parte.
                  --
                  -- ⭐ §12.5.2: QUI NON C'E' IL PREDICATO. Il guard chiama
                  --   script.fn_check_registro_forma_modificabile e solleva il
                  --   codice del PRIMO motivo. Cosi' il rifiuto e il tooltip
                  --   della maschera non «coincidono oggi»: non POSSONO
                  --   divergere, perche' la regola sta scritta in un posto
                  --   solo.
                  -- =========================================================

                  -- ⭐ Il no-op passa: `UPDATE OF` scatta quando lo statement
                  --   NOMINA la colonna, anche a valore invariato. Confrontare
                  --   i valori e' cio' che tiene il guard fuori dai piedi di un
                  --   mirror CSV che riscrivesse queste colonne.
                  IF NEW.prefisso         IS NOT DISTINCT FROM OLD.prefisso
                     AND NEW.suffisso     IS NOT DISTINCT FROM OLD.suffisso
                     AND NEW.lunghezza_numero IS NOT DISTINCT FROM OLD.lunghezza_numero
                     -- ⭐ LA QUARTA COLONNA DELLA FORMA, dal 2026-09-08. `anno_nel_numero`
                     --   cambia la stringa consegnata quanto le altre tre: un sezionale che
                     --   la spegne dopo aver numerato porterebbe due forme con numeri
                     --   consecutivi, che e' il difetto per cui questo guard esiste.
                     -- ⚠️ NON BASTAVA allargare la clausola UPDATE OF del trigger: questo
                     --   confronto e' il no-op, e senza la quarta riga vedeva «nessuna delle
                     --   tre e' cambiata» e lasciava passare proprio il cambio nuovo.
                     --   L'ha trovato il test 7 di test-anno-nel-numero-v1, non un
                     --   ragionamento: allargare il trigger sembrava sufficiente.
                     AND NEW.anno_nel_numero IS NOT DISTINCT FROM OLD.anno_nel_numero THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_registro_forma_modificabile(OLD.id);

                  -- Nessun motivo: il registro non ha ancora numerato, la forma
                  -- si cambia liberamente.
                  IF v_motivi IS NULL OR jsonb_array_length(v_motivi) = 0 THEN
                      RETURN NEW;
                  END IF;

                  v_primo := v_motivi -> 0;

                  -- ⚠️ Il campo da accendere nel form e' il PRIMO che e'
                  --   cambiato davvero, non uno fisso: l'operatore ne ha
                  --   toccato uno, e mandarlo a correggerne un altro e' peggio
                  --   che non dirglielo.
                  v_campo := CASE
                      WHEN NEW.prefisso IS DISTINCT FROM OLD.prefisso THEN 'prefisso'
                      WHEN NEW.suffisso IS DISTINCT FROM OLD.suffisso THEN 'suffisso'
                      ELSE 'lunghezza_numero'
                  END;

                  -- ⚠️ tx_id NULL e non NEW.tx_id: questo guard e' `_a10_` e
                  --   scatta PRIMA di trg_registri_fatturazione_gen_tx_id_ins_upd
                  --   (ordine alfabetico: 'a10' < 'gen'), quindi NEW.tx_id qui
                  --   porta ancora il valore vecchio.
                  PERFORM script.fn_log_and_raise_error(
                      'vendite',
                      'trgfn_registri_fatturazione_guard_forma_numero',
                      v_primo ->> 'codice',
                      COALESCE(v_primo -> 'dettaglio', '{}'::jsonb)
                          || jsonb_build_object('campo', v_campo),
                      NULL::uuid,
                      VARIADIC ARRAY(SELECT jsonb_array_elements_text(v_primo -> 'valori')));

                  -- Irraggiungibile: la riga sopra solleva sempre.
                  RETURN NEW;
              END;
              $function$;

              DROP TRIGGER IF EXISTS trg_registri_fatturazione_a10_guard_forma_numero_upd
                  ON vendite.registri_fatturazione;

              CREATE TRIGGER trg_registri_fatturazione_a10_guard_forma_numero_upd
                  BEFORE UPDATE OF prefisso, suffisso, lunghezza_numero, anno_nel_numero
                  ON vendite.registri_fatturazione
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_registri_fatturazione_guard_forma_numero();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⛔ Il ripristino della FUNZIONE e' ri-applicare 20260901-03: qui
              --    si rimette solo il trigger sulle tre colonne storiche, che
              --    senza la colonna nuova e' lo stato coerente.
              DROP TRIGGER IF EXISTS trg_registri_fatturazione_a10_guard_forma_numero_upd
                  ON vendite.registri_fatturazione;

              CREATE TRIGGER trg_registri_fatturazione_a10_guard_forma_numero_upd
                  BEFORE UPDATE OF prefisso, suffisso, lunghezza_numero
                  ON vendite.registri_fatturazione
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_registri_fatturazione_guard_forma_numero();
