# D14 — IL LISTER DEL PUSH LEGGE LA PARTITA PER DOCUMENTO (quarta leva, giro 1)
#   brief-db-partita-merce-per-documento §2.2; decisioni D1/D2 di Tid (21-09).
#
# ── COSA CAMBIA, in una riga ───────────────────────────────────────────
#
#   `JOIN vendite.vw_partite_merce pm` diventa
#   `JOIN vendite.fn_partite_merce(CASE WHEN p_ddt_id IS NULL THEN NULL
#    ELSE ARRAY[p_ddt_id] END, NULL) pm`. Niente altro: stessi predicati,
#   stesse colonne, stessa ORDER BY, stesso COMMENT piu' la rev.
#
# ── PERCHE' ────────────────────────────────────────────────────────────
#
#   script.fn_available_actions_ddt chiama questo lister con p_ddt_id per
#   ogni apertura del drawer: fino a oggi la vista dentro il JOIN
#   calcolava le partite di TUTTI i DDT e il WHERE sul documento non
#   entrava (CTE materializzate e finestre sulla popolazione). Con il seme
#   la funzione calcola la CHIUSURA del documento (brief §2). Il ramo
#   p_ddt_id NULL — la lista del push, il cockpit — resta «tutte»: e' la
#   lettura giusta per quel chiamante.
#
#   ⚠️ Il CASE e' un'espressione senza colonne: in piano custom si piega a
#   un letterale, in piano generico (dalla sesta esecuzione plpgsql) la
#   funzione lo riceve come parametro e i suoi rami in UNION ALL lo
#   trattano da One-Time Filter — mai una scansione intera (brief
#   §2-bis.2, provato con PREPARE + force_generic_plan).
#
# ── COSA NON CAMBIA ────────────────────────────────────────────────────
#
#   Il contratto verso la pipeline (RETURNS TABLE, i 31 campi, la
#   quantita' da fatturare = differenza della partita) e l'equivalenza
#   con fn_ddt_push_diagnosi (20260921-24, stessa sorgente). Il giro D4
#   (B2, lister derivato dalla diagnosi) e' a parte.
#
# Base: definizione VIVA (pg_get_functiondef il 21-09, identica alla
#   scheda auto-gen). Presidi: test-fn-list-ddt-da-pushare-contatore-v1
#   (7), test-fn-available-actions-ddt-reason-catch-all-v1 (8).
# Dipendenze: 20260921-21.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260921-23-update-fn-list-ddt-da-pushare-partita-per-documento-mctit.yaml

  - changeSet:
      id: 20260921-23-update-fn-list-ddt-da-pushare-partita-per-documento
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D14 quarta leva: fn_list_ddt_da_pushare legge la partita da
        vendite.fn_partite_merce col DDT chiesto come seme (chiusura del documento);
        p_ddt_id NULL = tutte, com'era. Stessi predicati, stesso contratto, stessi
        numeri (la vista e' la proiezione della stessa funzione).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc
                   WHERE proname = 'fn_partite_merce'
                     AND pronamespace = 'vendite'::regnamespace
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc
                   WHERE proname = 'fn_list_ddt_da_pushare'
                     AND pronamespace = 'vendite'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Firma e RETURNS TABLE ancorati (%TYPE) come nel 20260803-02, l'ultimo
              -- YAML che li aveva: il corpo vivo di pg_get_functiondef li scioglie e il
              -- 20260817-10 li aveva ricopiati sciolti. Stessi tipi risolti: nessun overload.
              CREATE OR REPLACE FUNCTION vendite.fn_list_ddt_da_pushare(
                  p_competenza_mese    date                                DEFAULT NULL,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE  DEFAULT NULL,
                  p_limit              integer                             DEFAULT NULL,
                  p_ddt_id             vendite.ddt.id%TYPE                 DEFAULT NULL)
               RETURNS TABLE(
                  ddt_id                      vendite.ddt.id%TYPE,
                  ddt_uid                     vendite.ddt.uid%TYPE,
                  riga_id                     vendite.ddt_righe.id%TYPE,
                  billing_account_id          vendite.ddt.billing_account_id%TYPE,
                  utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                  emittente_soggetto_ruolo_id bigint,   -- risolto da fn_get_emittente_fiscale_id, non una colonna
                  competenza_dal              date,     -- derivata da ddt.data
                  competenza_al               date,
                  fatturazione_immediata      vendite.ddt.fatturazione_immediata%TYPE,
                  sorgente_tipo_id            config.sorgenti.id%TYPE,
                  sorgente_uid                text,     -- uid reso a testo (chiave polimorfa)
                  segment_key                 character varying,   -- composta
                  articolo_id                 vendite.ddt_righe.articolo_id%TYPE,
                  istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                  data_attivita               date,
                  uom_id                      catalogo.articoli.uom_id%TYPE,
                  quantita                    vendite.ddt_righe.quantita%TYPE,
                  qta_operativa               vendite.ddt_righe.qta_operativa%TYPE,
                  uom_operativa_id            vendite.ddt_righe.uom_operativa_id%TYPE,
                  factor_to_base              vendite.ddt_righe.factor_to_base%TYPE,
                  competenza_mese             date,
                  prezzo_snapshot             vendite.ddt_righe.prezzo_unitario%TYPE,
                  prezzo_bloccato             boolean,  -- calcolato (prezzo presente)
                  pricing_mode                character varying,   -- letterali
                  tipo_movimento              character varying,
                  tipo_consumo                character varying,
                  valuta_id                   vendite.ddt.valuta_id%TYPE,
                  meta                        jsonb,
                  tipo_doc_fiscale_id         config.sorgenti.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        config.termini_pagamento.id%TYPE,
                  modalita_pagamento_id       config.modalita_pagamento.id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
              BEGIN
                -- rev 2026-06-28: sorgente/stato DDT per codice_interno (immutabile).
                -- rev 2026-07-17 (step 3): proietta la differenza del contatore.
                -- rev 2026-07-18 (step 5): eleggibilita' dallo stato-trigger IN POI.
                -- rev 2026-07-18 (step 5b): esclude le causali non fatturabili.
                -- rev 2026-07-27: fatturazione_immediata proiettata dalla COLONNA.
                -- rev 2026-08-03 (T.1): espone termine/modalita' di pagamento (NULL).
                -- rev 2026-08-17 (partita generalizzata S5): la differenza si legge
                --   da vw_partite_merce, che e' GIA' per riga di DDT. Spariscono la
                --   ridistribuzione greedy e il caso speciale standalone/compositi.
                -- rev 2026-09-21 (D14, quarta leva): la partita si legge da
                --   vendite.fn_partite_merce col DDT come seme — la CHIUSURA del
                --   documento, non le partite di tutti. p_ddt_id NULL (cockpit,
                --   lista push) = seme NULL = tutte, com'era. Stessi numeri: la
                --   vista e' la proiezione della stessa funzione.
                IF p_ddt_id IS NOT NULL AND p_ddt_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_ddt_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_ddt_id', 'valore', p_ddt_id),
                    NULL::uuid, 'p_ddt_id', p_ddt_id::text);
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'DDT_VENDITA' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_ddt_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'DDT_VENDITA'),
                    NULL::uuid, 'DDT_VENDITA', 'config.sorgenti');
                END IF;

                RETURN QUERY
                WITH cand AS (
                  -- Righe DDT eleggibili + riga d'ordine (via fulfillment) +
                  -- la differenza della LORO partita di merce.
                  SELECT
                    d.id            AS d_id,
                    d.uid           AS d_uid,
                    dr.id           AS dr_id,
                    COALESCE(d.billing_account_id, src.src_billing_account_id) AS ba_id,
                    ba.utility_id           AS ba_utility_id,
                    ba.istanza_utility_id   AS ba_istanza,
                    d.data          AS d_data,
                    d.numero        AS d_numero,
                    d.anno          AS d_anno,
                    d.serie         AS d_serie,
                    d.valuta_id     AS d_valuta,
                    -- Corsia di instradamento: trasportata fino alla SELECT finale.
                    d.fatturazione_immediata AS d_fatt_immediata,
                    dr.articolo_id  AS dr_articolo,
                    dr.quantita     AS dr_quantita,
                    dr.qta_operativa AS dr_qta_op,
                    dr.uom_operativa_id AS dr_uom_op,
                    dr.factor_to_base   AS dr_factor,
                    dr.prezzo_unitario  AS dr_prezzo,
                    a.uom_id        AS a_uom,
                    src.src_ordine_uid,
                    src.src_fatturazione_trigger,
                    src.src_prezzo_unitario,
                    src.src_valuta_id,
                    src.src_ordine_riga_id,
                    pm.differenza   AS partita_diff
                  FROM vendite.ddt d
                  JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                  -- CINTURA solo-trasporto (DL-28): la causale dichiara se la
                  -- merce che viaggia e' una vendita. Vale per entrambi i rami:
                  -- descrive il viaggio, non la provenienza del documento.
                  JOIN config.causali_trasporto caus
                    ON caus.id = d.causale_trasporto_id
                   AND caus.fatturabile IS TRUE
                  JOIN vendite.ddt_righe dr
                    ON dr.ddt_id = d.id
                   AND dr.attivo IS TRUE
                  JOIN catalogo.articoli a ON a.id = dr.articolo_id
                  -- LA PARTITA DI MERCE della riga. INNER JOIN, e non e' una
                  -- svista: se non c'e' una partita non c'e' merce uscita, e
                  -- non c'e' niente da fatturare. Copre TUTTE le famiglie —
                  -- order-backed, standalone, kit — con la stessa regola.
                  -- ⭐ Per DOCUMENTO: il seme e' il DDT chiesto (un letterale
                  -- ARRAY[p_ddt_id]); con p_ddt_id NULL il seme e' NULL = tutte.
                  -- Il CASE e' senza colonne: il planner lo piega (custom) o lo
                  -- solleva a One-Time Filter (generico) — mai una scansione intera.
                  JOIN vendite.fn_partite_merce(
                         CASE WHEN p_ddt_id IS NULL THEN NULL::bigint[] ELSE ARRAY[p_ddt_id] END,
                         NULL::bigint[]) pm ON pm.ddt_riga_id = dr.id
                  LEFT JOIN LATERAL (
                    SELECT
                      o_src.billing_account_id   AS src_billing_account_id,
                      o_src.fatturazione_trigger AS src_fatturazione_trigger,
                      o_src.uid                  AS src_ordine_uid,
                      o_src.valuta_id            AS src_valuta_id,
                      or_r.prezzo_unitario       AS src_prezzo_unitario,
                      or_r.id                    AS src_ordine_riga_id
                    FROM vendite.ordini_righe_fulfillment ful
                    JOIN vendite.ordini_righe or_r ON or_r.id = ful.ordine_riga_id
                    JOIN vendite.ordini o_src      ON o_src.id = or_r.ordine_id
                    WHERE ful.ddt_riga_id = dr.id
                    ORDER BY ful.id LIMIT 1
                  ) src ON TRUE
                  -- Rank dello stato-trigger dell'ordine, per chiave naturale
                  -- stabile. CONFERMATO non esiste fra gli stati DDT -> non
                  -- risolve -> il ramo order-backed e' falso (§3e.3).
                  LEFT JOIN config.stati_doc_ddt sdd_trg
                    ON sdd_trg.codice_interno = src.src_fatturazione_trigger
                  JOIN anagrafiche.billing_account ba
                    ON ba.id = COALESCE(d.billing_account_id, src.src_billing_account_id)
                  WHERE COALESCE(d.billing_account_id, src.src_billing_account_id) IS NOT NULL
                    -- ⚠️ PREDICATO ESPLICITO, non un COALESCE a zero che
                    -- lascerebbe fuori delle righe come effetto collaterale.
                    -- `differenza` vuota vuol dire «il conto non si applica», e
                    -- ha TRE cause, tutte buone ragioni per non fatturare:
                    --   - causale non fatturabile senza alcun fatturato;
                    --   - conto non misurabile (kit senza coefficiente): una
                    --     quantita' che nessuno ha saputo calcolare e' peggio
                    --     non fatturarla che fatturarla sbagliata;
                    --   - riga di RI-CONSEGNA: merce gia' contata sulla partita
                    --     d'origine. Fatturarla di nuovo sarebbe il «bug 1a».
                    AND pm.differenza IS NOT NULL
                    AND (
                      -- ORDER-BACKED: dallo stato-trigger IN POI (fix orfano §1c),
                      -- ma mai su un documento morto (ANNULLATO, via is_abortito)
                      -- ne' su merce tutta tornata indietro (RESO).
                      (src.src_fatturazione_trigger IS NOT NULL
                       AND src.src_fatturazione_trigger != 'CONFERMATO'   -- cintura XOR: NON toccare
                       AND sdd_trg.ordine IS NOT NULL
                       AND sdd.ordine >= sdd_trg.ordine
                       AND NOT sdd.is_abortito
                       AND sdd.codice_interno <> 'RESO')
                      OR
                      -- STANDALONE: invariato (gia' privo di RESO/ANNULLATO).
                      (src.src_fatturazione_trigger IS NULL
                       AND d.billing_account_id IS NOT NULL
                       AND sdd.codice_interno IN ('SPEDITO', 'CONSEGNATO'))
                    )
                    AND (p_competenza_mese IS NULL OR date_trunc('month', d.data)::date = p_competenza_mese)
                    AND (p_billing_account_id IS NULL
                         OR COALESCE(d.billing_account_id, src.src_billing_account_id) = p_billing_account_id)
                    AND (p_ddt_id IS NULL OR d.id = p_ddt_id)
                    -- Esclusione "gia' inviato": eleggibile solo se MAI
                    -- instradata (LIBERA) — classificatore condiviso coi rami
                    -- reason della capability: vede anche i componenti #CMP.
                    -- ⚠️ E' l'unica cintura che impedira' di ri-spingere una
                    -- riga la cui differenza torna positiva per una RETTIFICA
                    -- (nota di credito): chi introdurra' un segment_key nuovo
                    -- per la rettifica deve insegnarglielo.
                    AND script.fn_get_stato_push_segment(
                          'DDT:' || d.uid::text || ':R:' || dr.id::text) = 'LIBERA'
                )
                SELECT
                  x.d_id,
                  x.d_uid,
                  x.dr_id,
                  x.ba_id,
                  x.ba_utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(x.ba_id),
                  x.d_data,
                  x.d_data,
                  -- Corsia di instradamento: valore reale del DDT.
                  x.d_fatt_immediata,
                  v_sorgente_tipo_id,
                  x.d_uid::text,
                  ('DDT:' || x.d_uid::text || ':R:' || x.dr_id::text)::varchar,
                  x.dr_articolo,
                  x.ba_istanza,
                  x.d_data,
                  x.a_uom,
                  -- La quantita' da fatturare E' la differenza della partita.
                  -- Il cap a dr_quantita e' una cintura: oggi differenza non
                  -- puo' superare il consegnato, ma quando la nota di credito
                  -- abbassera' il fatturato quel rapporto va ri-verificato.
                  GREATEST(0::numeric, LEAST(x.dr_quantita, COALESCE(x.partita_diff, 0))) AS quantita_push,
                  -- qta_operativa scalata proporzionalmente (ratio = 1 se nessuna riduzione)
                  x.dr_qta_op
                    * (GREATEST(0::numeric, LEAST(x.dr_quantita, COALESCE(x.partita_diff, 0)))
                       / NULLIF(x.dr_quantita, 0)),
                  x.dr_uom_op,
                  COALESCE(x.dr_factor, 1::numeric),
                  date_trunc('month', x.d_data)::date,
                  COALESCE(x.dr_prezzo, x.src_prezzo_unitario),
                  -- prezzo_bloccato: dipende dal PREZZO della riga,
                  -- INDIPENDENTE dal flag di corsia.
                  (COALESCE(x.dr_prezzo, x.src_prezzo_unitario) IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  'CONGUAGLIO'::varchar,
                  COALESCE(x.d_valuta, x.src_valuta_id),
                  jsonb_build_object(
                    'ddt_numero',          x.d_numero,
                    'ddt_anno',            x.d_anno,
                    'ddt_serie',           x.d_serie,
                    'ordine_sorgente_uid', x.src_ordine_uid,
                    'ordine_fatturaz_trg', x.src_fatturazione_trigger,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM cand x
                WHERE GREATEST(0::numeric, LEAST(x.dr_quantita, COALESCE(x.partita_diff, 0))) > 0
                ORDER BY x.d_id, x.dr_id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_ddt_da_pushare(date, anagrafiche.billing_account.id%TYPE, integer, vendite.ddt.id%TYPE) IS
                'rev 2026-09-21 (D14, quarta leva): la partita si legge da vendite.fn_partite_merce con il DDT chiesto come SEME (ARRAY[p_ddt_id]): la funzione calcola la CHIUSURA del documento, non le partite di tutti — e'' la lettura che paga il drawer a ogni apertura. Con p_ddt_id NULL (lista push, cockpit) il seme e'' NULL = tutte, com''era. Stessi numeri per costruzione: vw_partite_merce e'' la proiezione della stessa funzione. Lista righe DDT eligible al push su commessa. rev 2026-08-17 (partita generalizzata S5): la quantita'' da fatturare e'' la DIFFERENZA della partita di merce (vendite.vw_partite_merce), che e'' gia'' per riga di DDT — spariscono la ridistribuzione greedy della differenza d''ordine e il caso speciale che mandava standalone e compositi a dr.quantita GREZZA, cioe'' senza alcun conto. Tutte le famiglie di merce passano ora sotto lo stesso dosatore. ⚠️ Cambio di comportamento dichiarato: una partita NON MISURABILE (kit di cui non si ricostruisce la quantita'' del padre) non viene piu'' spinta — predicato esplicito AND pm.misurabile, non un COALESCE a zero. ⚠️ Nota per la nota di credito: quando una RETTIFICA abbassera'' il fatturato, la differenza tornera'' positiva e solo script.fn_get_stato_push_segment = LIBERA impedira'' la ri-spinta. rev 2026-07-18 (step 5b): esclude i DDT con causale di trasporto NON fatturabile (DL-28). rev 2026-07-18 (step 5): eleggibilita'' order-backed DALLO stato-trigger IN POI, cintura XOR != CONFERMATO PRESERVATA. rev 2026-06-28: sorgente/stato per codice_interno. rev 2026-07-19: esclusione su ALLOCAZIONE via fn_get_stato_push_segment. rev 2026-07-27: fatturazione_immediata dalla colonna. Espone termine_pagamento_id e modalita_pagamento_id a NULL (rev 2026-08-03, T.1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Non si torna indietro da soli: va ri-applicato 20260817-10 (o la
              --    revisione viva precedente), col JOIN sulla vista.
              SELECT 1;
