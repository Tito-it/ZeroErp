# Monta script.trgfn_righe_guard_erogazione_obbligatoria (20261004-31) sulle
# due tabelle gemelle:
#   vendite.contratti_righe               -> trg_contratti_righe_a10_guard_erogazione_obbligatoria_ins_upd
#   vendite.offerte_commerciali_eccezioni -> trg_offerte_eccezioni_a10_guard_erogazione_obbligatoria_ins_upd
#
# -- EVENTI -------------------------------------------------------------
#   INSERT, e UPDATE OF tipo_erogazione, tipo_eccezione: le sole colonne da cui
#   la regola dipende (linee-guida-trigger, «UPDATE OF quando possibile»). Un
#   UPDATE di altre colonne non puo' rompere la regola, e il CHECK del
#   20261004-30 garantisce che nessuna riga ferma la violi gia'.
#
# -- FASCIA _a10_, e chi parla prima ------------------------------------
#   Non e' un «questa riga non si tocca» (_a05_): e' un giudizio sul valore
#   nuovo, come gli altri guard _a10_.
#   · contratti_righe: prima parlano _a05_doc_righe_lock_fuori_bozza (fuori
#     bozza nessuna riga si scrive) e _a05_guard_esclusione_immutabile; fra gli
#     _a10_ «guard_aggiunta_fuori_listino» viene prima («a» < «e»): un'AGGIUNTA
#     su un articolo del listino e' sbagliata comunque, erogazione o no.
#     default_fonte_qta gira prima («d» < «g») e con erogazione NULL lascia la
#     fonte NULL: il NOT NULL della fonte si valuta dopo tutti i BEFORE ROW,
#     quindi a parlare e' questo guard;
#   · offerte_commerciali_eccezioni: i trigger generati
#     trg_offerte_commerciali_eccezioni_* vengono prima per nome, e non
#     rifiutano su INSERT; poi default_fonte_qta, poi questo, poi guard_pending.
#
# -- NOME ---------------------------------------------------------------
#   Il trigger delle offerte e' lungo 63 caratteri: il limite di PostgreSQL,
#   non oltre (un nome piu' lungo verrebbe troncato, e il nome lo leggono i
#   presidi). Il prefisso trg_offerte_eccezioni_ e' quello dei trigger scritti a
#   mano sulla tabella.
#
# Brief: brief-db-erogazione-obbligatoria-righe-fatturate (R1, R2, R3).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261004-32-create-trigger-righe-eccezione-guard-erogazione-obbligatoria-mctit.yaml

  - changeSet:
      id: 20261004-32-create-trigger-righe-eccezione-guard-erogazione-obbligatoria
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Trigger _a10_ BEFORE INSERT OR UPDATE OF tipo_erogazione, tipo_eccezione su
        vendite.contratti_righe e vendite.offerte_commerciali_eccezioni, su
        script.trgfn_righe_guard_erogazione_obbligatoria. Brief:
        brief-db-erogazione-obbligatoria-righe-fatturate (R1, R2).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'trgfn_righe_guard_erogazione_obbligatoria';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_trigger
                   WHERE NOT tgisinternal
                     AND ((tgrelid = 'vendite.contratti_righe'::regclass
                           AND tgname = 'trg_contratti_righe_a10_guard_erogazione_obbligatoria_ins_upd')
                       OR (tgrelid = 'vendite.offerte_commerciali_eccezioni'::regclass
                           AND tgname = 'trg_offerte_eccezioni_a10_guard_erogazione_obbligatoria_ins_upd'));
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_contratti_righe_a10_guard_erogazione_obbligatoria_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_erogazione, tipo_eccezione ON vendite.contratti_righe
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_righe_guard_erogazione_obbligatoria('contratto_id');

              COMMENT ON TRIGGER trg_contratti_righe_a10_guard_erogazione_obbligatoria_ins_upd ON vendite.contratti_righe IS
                  'Una riga che si fattura (ogni tipo che non e'' ESCLUSIONE) vuole tipo_erogazione: '
                  'E_RIGA_EROGAZIONE_OBBLIGATORIA col campo, prima del CHECK '
                  'chk_contrighe_erogazione_per_tipo_eccezione. Fascia _a10_. '
                  'Brief: brief-db-erogazione-obbligatoria-righe-fatturate (R1).';

              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_erogazione_obbligatoria_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_erogazione, tipo_eccezione ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_righe_guard_erogazione_obbligatoria('offerta_id');

              COMMENT ON TRIGGER trg_offerte_eccezioni_a10_guard_erogazione_obbligatoria_ins_upd ON vendite.offerte_commerciali_eccezioni IS
                  'Mirror del guard sul contratto: una riga dell''offerta che si fattura vuole '
                  'tipo_erogazione, altrimenti fn_push_offerta_a_contratto farebbe nascere un contratto '
                  'rifiutato. Fascia _a10_. '
                  'Brief: brief-db-erogazione-obbligatoria-righe-fatturate (R2).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_erogazione_obbligatoria_ins_upd ON vendite.offerte_commerciali_eccezioni;
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_erogazione_obbligatoria_ins_upd ON vendite.contratti_righe;
