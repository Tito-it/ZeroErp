databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/vendite/20260331-27-fix-vendite-fn-e-generico-batch13-mctit.yaml

    - changeSet:
          id: 20260331-27-fix-fn-ricalcola-riepilogo-iva-fattura
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_ricalcola_riepilogo_iva_fattura: 3x E_GENERICO →
              E_PARAMETRO_INVALIDO + E_FATTURA_NON_TROVATA + E_PARAMETRO_INVALIDO (stato).
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 3x E_GENERICO → codici specifici
                        CREATE OR REPLACE FUNCTION vendite.fn_ricalcola_riepilogo_iva_fattura(
                            p_fattura_id vendite.fatture.id%TYPE
                        )
                        RETURNS TABLE(deleted_rows INTEGER, inserted_rows INTEGER)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_deleted_rows  INTEGER := 0;
                            v_inserted_rows INTEGER := 0;
                            v_stato_id      vendite.fatture.stato_doc_fiscale_id%TYPE;
                            v_codice_interno config.stati_doc_fiscale.codice_interno%TYPE;
                            v_stato_emittente_id anagrafiche.soggetti.stato_id%TYPE;
                        BEGIN
                            IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_ricalcola_riepilogo_iva_fattura', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                            END IF;

                            SELECT f.stato_doc_fiscale_id INTO v_stato_id FROM vendite.fatture f WHERE f.id = p_fattura_id;

                            IF v_stato_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_ricalcola_riepilogo_iva_fattura', 'E_FATTURA_NON_TROVATA',
                                    jsonb_build_object('fattura_id', p_fattura_id), NULL::uuid, p_fattura_id::text);
                            END IF;

                            SELECT s.codice_interno INTO v_codice_interno FROM config.stati_doc_fiscale s WHERE s.id = v_stato_id;

                            IF v_codice_interno NOT IN ('DRAFT', 'EMESSA') THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_ricalcola_riepilogo_iva_fattura', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'stato_doc_fiscale', 'valore', v_codice_interno, 'fattura_id', p_fattura_id),
                                    NULL::uuid, concat('ricalcolo IVA non ammesso per stato ', v_codice_interno));
                            END IF;

                            -- Recupero stato emittente per override aliquota IVA
                            SELECT s.stato_id INTO v_stato_emittente_id
                              FROM vendite.fatture f
                              JOIN anagrafiche.soggetti_ruoli sr ON sr.id = f.emittente_soggetto_ruolo_id
                              JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                             WHERE f.id = p_fattura_id;

                            DELETE FROM vendite.fatture_riepiloghi_iva WHERE fattura_id = p_fattura_id;
                            GET DIAGNOSTICS v_deleted_rows = ROW_COUNT;

                            INSERT INTO vendite.fatture_riepiloghi_iva (fattura_id, iva_id, natura_id, esigibilita, split_payment, imponibile, imposta, arrotondamento)
                            SELECT r.fattura_id, r.iva_id, n.id, r.esigibilita, r.split_payment,
                                   ROUND(SUM(COALESCE(r.imponibile_riga, 0)), 2),
                                   ROUND(ROUND(SUM(COALESCE(r.imponibile_riga, 0)), 2) * (COALESCE(config.fn_get_aliquota_iva(r.iva_id, v_stato_emittente_id), 0)::NUMERIC / 100::NUMERIC), 2),
                                   SUM(COALESCE(r.imponibile_riga, 0)) - ROUND(SUM(COALESCE(r.imponibile_riga, 0)), 2)
                              FROM vendite.fatture_righe r
                              LEFT JOIN config.iva i ON i.id = r.iva_id
                              LEFT JOIN config.iva_natura n ON n.codice = r.iva_natura
                             WHERE r.fattura_id = p_fattura_id
                             GROUP BY r.fattura_id, r.iva_id, n.id, r.esigibilita, r.split_payment;
                            GET DIAGNOSTICS v_inserted_rows = ROW_COUNT;

                            RETURN QUERY SELECT v_deleted_rows, v_inserted_rows;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_ricalcola_riepilogo_iva_fattura(BIGINT)
                          IS 'Ricalcola riepiloghi IVA fattura. Ammesso solo per DRAFT/EMESSA.';

    - changeSet:
          id: 20260331-27-fix-fn-ricalcola-totali-fattura
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_ricalcola_totali_fattura: 2x E_GENERICO →
              E_PARAMETRO_INVALIDO + E_CONFIG_MANCANTE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 2x E_GENERICO → codici specifici
                        CREATE OR REPLACE FUNCTION vendite.fn_ricalcola_totali_fattura(
                            p_fattura_id vendite.fatture.id%TYPE
                        )
                        RETURNS void
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_imponibile_tot  vendite.fatture.imponibile_tot%TYPE;
                            v_imposta_tot     vendite.fatture.imposta_tot%TYPE;
                            v_totale_doc      vendite.fatture.totale_doc%TYPE;
                            v_totale_fondi    vendite.fatture_fondi_fattura.importo%TYPE;
                            v_totale_a_pagare vendite.fatture.totale_a_pagare%TYPE;
                            v_raw_totale      vendite.fatture.totale_a_pagare%TYPE;
                            v_round_totale    vendite.fatture.totale_a_pagare%TYPE;
                            v_arro_attuale    vendite.fatture.arrotondamento_attuale%TYPE;
                            v_arro_precedente vendite.fatture.arrotondamento_precedente%TYPE;
                            v_billing_account_id         vendite.fatture.billing_account_id%TYPE;
                            v_tipo_doc_fiscale_id        vendite.fatture.tipo_doc_fiscale_id%TYPE;
                            v_emittente_soggetto_ruolo_id vendite.fatture.emittente_soggetto_ruolo_id%TYPE;
                            v_valuta_id      vendite.fatture.valuta_id%TYPE;
                            v_utility_id     config.utilities.id%TYPE;
                            v_min_soglia_min anagrafiche.emittenti_fiscali_utilities.minimo_soglia_min%TYPE;
                            v_min_soglia_max anagrafiche.emittenti_fiscali_utilities.minimo_soglia_max%TYPE;
                            v_decimali       anagrafiche.emittenti_fiscali_utilities.arrotondamento_importi_dec%TYPE;
                            v_metodo         anagrafiche.emittenti_fiscali_utilities.metodo_arrotondamento_importi%TYPE;
                        BEGIN
                            IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_ricalcola_totali_fattura', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                            END IF;

                            SELECT f.billing_account_id, f.tipo_doc_fiscale_id, f.emittente_soggetto_ruolo_id, f.valuta_id
                              INTO v_billing_account_id, v_tipo_doc_fiscale_id, v_emittente_soggetto_ruolo_id, v_valuta_id
                              FROM vendite.fatture f WHERE f.id = p_fattura_id;

                            SELECT COALESCE(
                                (SELECT fl.utility_id FROM vendite.fatturazione_lotti_fatture lf JOIN vendite.fatturazione_lotti fl ON fl.id = lf.lotto_id WHERE lf.fattura_id = p_fattura_id ORDER BY lf.id DESC LIMIT 1),
                                (SELECT ba.utility_id FROM anagrafiche.billing_account ba WHERE ba.id = v_billing_account_id)
                            ) INTO v_utility_id;

                            SELECT COALESCE(SUM(r.imponibile), 0), COALESCE(SUM(r.imposta), 0)
                              INTO v_imponibile_tot, v_imposta_tot
                              FROM vendite.fatture_riepiloghi_iva r WHERE r.fattura_id = p_fattura_id;

                            v_totale_fondi := vendite.fn_get_totale_fondi_fattura(p_fattura_id);
                            v_totale_doc := COALESCE(v_imponibile_tot, 0) + COALESCE(v_imposta_tot, 0);

                            SELECT e.minimo_soglia_min, e.minimo_soglia_max, e.arrotondamento_importi_dec, COALESCE(e.metodo_arrotondamento_importi, 'HALF_UP')
                              INTO v_min_soglia_min, v_min_soglia_max, v_decimali, v_metodo
                              FROM anagrafiche.emittenti_fiscali_utilities e
                             WHERE e.emittente_soggetto_ruolo_id = v_emittente_soggetto_ruolo_id AND e.utility_id = v_utility_id AND e.attivo IS TRUE LIMIT 1;

                            IF v_decimali IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_ricalcola_totali_fattura', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('emittente', v_emittente_soggetto_ruolo_id, 'utility_id', v_utility_id, 'fattura_id', p_fattura_id),
                                    NULL::uuid, concat('configurazione emittente/utility mancante per fattura ', p_fattura_id));
                            END IF;

                            v_arro_precedente := vendite.fn_get_arrotondamento_scope(v_billing_account_id, v_utility_id, v_tipo_doc_fiscale_id, v_emittente_soggetto_ruolo_id, v_valuta_id);
                            v_raw_totale := v_totale_doc + COALESCE(v_totale_fondi, 0) + COALESCE(v_arro_precedente, 0);
                            v_round_totale := 0;

                            IF v_metodo = 'UP' THEN
                                v_round_totale := (CASE WHEN v_raw_totale >= 0 THEN ceil(v_raw_totale * power(10::NUMERIC, v_decimali)) ELSE -ceil(abs(v_raw_totale) * power(10::NUMERIC, v_decimali)) END) / power(10::NUMERIC, v_decimali);
                            ELSIF v_metodo = 'DOWN' THEN
                                v_round_totale := (CASE WHEN v_raw_totale >= 0 THEN floor(v_raw_totale * power(10::NUMERIC, v_decimali)) ELSE -floor(abs(v_raw_totale) * power(10::NUMERIC, v_decimali)) END) / power(10::NUMERIC, v_decimali);
                            ELSIF v_metodo = 'HALF_DOWN' THEN
                                v_round_totale := (CASE WHEN v_raw_totale >= 0 THEN ceil((v_raw_totale * power(10::NUMERIC, v_decimali)) - 0.5) ELSE -ceil((abs(v_raw_totale) * power(10::NUMERIC, v_decimali)) - 0.5) END) / power(10::NUMERIC, v_decimali);
                            ELSE
                                v_round_totale := (CASE WHEN v_raw_totale >= 0 THEN floor((v_raw_totale * power(10::NUMERIC, v_decimali)) + 0.5) ELSE -floor((abs(v_raw_totale) * power(10::NUMERIC, v_decimali)) + 0.5) END) / power(10::NUMERIC, v_decimali);
                            END IF;

                            v_arro_attuale := v_round_totale - v_raw_totale;
                            v_totale_a_pagare := v_raw_totale + v_arro_attuale;

                            PERFORM vendite.fn_set_arrotondamento_scope(v_billing_account_id, v_utility_id, v_tipo_doc_fiscale_id, v_emittente_soggetto_ruolo_id, v_valuta_id, COALESCE(v_arro_precedente, 0) + COALESCE(v_arro_attuale, 0));

                            UPDATE vendite.fatture f
                               SET imponibile_tot = v_imponibile_tot, imposta_tot = v_imposta_tot, totale_doc = v_totale_doc,
                                   arrotondamento_precedente = v_arro_precedente, arrotondamento_attuale = v_arro_attuale, totale_a_pagare = v_totale_a_pagare,
                                   minimo = ((v_min_soglia_min IS NOT NULL AND v_totale_a_pagare >= v_min_soglia_min) AND (v_min_soglia_max IS NULL OR v_totale_a_pagare <= v_min_soglia_max)),
                                   data_update = now(), user_update = current_user
                             WHERE f.id = p_fattura_id;

                            PERFORM vendite.fn_sync_contabili_fondo_fattura(p_fattura_id);
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_ricalcola_totali_fattura(BIGINT)
                          IS 'Ricalcola totali fattura con arrotondamento da config emittente/utility e sync contabili fondi.';

    - changeSet:
          id: 20260331-27-fix-fn-select-attivita-fatturabili
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_select_attivita_fatturabili: 3x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 3x E_GENERICO → E_PARAMETRO_INVALIDO
                        CREATE OR REPLACE FUNCTION vendite.fn_select_attivita_fatturabili(
                            p_competenza_mese             DATE,
                            p_tipo_doc_fiscale_id         config.tipi_doc_fiscale.id%TYPE,
                            p_lock_batch_id               UUID DEFAULT NULL,
                            p_lock                        BOOLEAN DEFAULT FALSE,
                            p_data_fatturazione           DATE DEFAULT CURRENT_DATE,
                            p_billing_account_id          anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                            p_utility_id                  config.utilities.id%TYPE DEFAULT NULL,
                            p_valuta_id                   config.valute.id%TYPE DEFAULT NULL,
                            p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL,
                            p_area_geografica_id          BIGINT DEFAULT NULL,
                            p_limit                       INTEGER DEFAULT NULL
                        )
                        RETURNS SETOF vendite.attivita_fatturabili
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_competenza DATE;
                            v_data_fatturazione DATE;
                            v_where TEXT;
                            v_limit TEXT;
                            v_sql TEXT;
                        BEGIN
                            IF p_competenza_mese IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_competenza_mese', 'valore', NULL), NULL::uuid, 'p_competenza_mese obbligatoria');
                            END IF;
                            IF p_tipo_doc_fiscale_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', NULL), NULL::uuid, 'p_tipo_doc_fiscale_id obbligatorio');
                            END IF;
                            IF p_lock AND p_lock_batch_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_lock_batch_id', 'valore', NULL), NULL::uuid, 'p_lock_batch_id obbligatorio quando p_lock=true');
                            END IF;

                            v_competenza := date_trunc('month', p_competenza_mese)::DATE;
                            v_data_fatturazione := COALESCE(p_data_fatturazione, CURRENT_DATE);

                            v_where := ' WHERE a.approvato IS TRUE AND a.fatturato IS FALSE AND a.sospesa IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE'
                                || ' AND (a.posticipa_al IS NULL OR a.posticipa_al <= ' || quote_literal(v_data_fatturazione) || ')'
                                || ' AND a.competenza_mese <= ' || quote_literal(v_competenza)
                                || ' AND a.tipo_doc_fiscale_id = ' || quote_literal(p_tipo_doc_fiscale_id);

                            IF p_billing_account_id IS NOT NULL THEN v_where := v_where || ' AND a.billing_account_id = ' || quote_literal(p_billing_account_id); END IF;
                            IF p_utility_id IS NOT NULL THEN v_where := v_where || ' AND ba.utility_id = ' || quote_literal(p_utility_id); END IF;
                            IF p_valuta_id IS NOT NULL THEN v_where := v_where || ' AND a.valuta_id = ' || quote_literal(p_valuta_id); END IF;
                            IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                                v_where := v_where || ' AND a.billing_account_id IS NOT NULL AND anagrafiche.fn_get_emittente_fiscale_id(a.billing_account_id) = ' || quote_literal(p_emittente_soggetto_ruolo_id);
                            END IF;
                            IF p_area_geografica_id IS NOT NULL THEN v_where := v_where || ' AND a.area_geografica_id = ' || quote_literal(p_area_geografica_id); END IF;

                            v_limit := CASE WHEN p_limit IS NOT NULL THEN ' LIMIT ' || p_limit::TEXT ELSE '' END;

                            IF p_lock THEN
                                v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ' FOR UPDATE SKIP LOCKED) UPDATE vendite.attivita_fatturabili a SET lock_in_fatturazione = true, lock_batch_id = ' || quote_literal(p_lock_batch_id) || ', stato_esecuzione = ''PENDING'', data_update = now(), user_update = current_user FROM candidati c WHERE a.id = c.id AND a.fatturato IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE RETURNING a.*';
                            ELSE
                                v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ') SELECT a.* FROM vendite.attivita_fatturabili a JOIN candidati c ON c.id = a.id ORDER BY a.data_attivita, a.id';
                            END IF;

                            RETURN QUERY EXECUTE v_sql;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_select_attivita_fatturabili(DATE, BIGINT, UUID, BOOLEAN, DATE, BIGINT, INTEGER, INTEGER, BIGINT, BIGINT, INTEGER)
                          IS 'Select attivita_fatturabili eleggibili con lock opzionale e stato_esecuzione=PENDING.';

    - changeSet:
          id: 20260331-27-fix-fn-sync-fattura-critical
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_sync_fattura_critical: 1x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_PARAMETRO_INVALIDO
                        CREATE OR REPLACE FUNCTION vendite.fn_sync_fattura_critical(
                            p_fattura_id vendite.fatture.id%TYPE
                        )
                        RETURNS void
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_has_critical BOOLEAN;
                        BEGIN
                            IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_fattura_critical', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                            END IF;

                            SELECT EXISTS (SELECT 1 FROM vendite.fatture_log WHERE fattura_id = p_fattura_id AND disabilitato IS FALSE AND status = 'C') INTO v_has_critical;

                            UPDATE vendite.fatture SET critical = COALESCE(v_has_critical, FALSE), data_update = now(), user_update = current_user WHERE id = p_fattura_id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_sync_fattura_critical(BIGINT)
                          IS 'Allinea fatture.critical in base ai log attivi di gravita C.';
