# L7b pezzo 1 — IL FRENO: un documento con righe EMESSA non si chiude
#   vendite.trgfn_doc_guard_chiusura_sorgente()   [generica, fase _a10_]
#   Piano: brief-db-lavoro-che-non-torna-indietro, L7 / Q-5' strada A (§9.7.2)
#
# ── ⭐ LA REGOLA, DIVISA PER STATO ──────────────────────────────────
#   Quando un documento si chiude, cio' che aveva spinto in commessa segue due
#   strade diverse a seconda di dove e' arrivato:
#     · righe `NON_EMESSA` → **il documento le ritira** (pezzo 2, `_z90_`);
#     · righe `EMESSA`     → **la testata NON si chiude**, ed e' questo file.
#   Sono in volo verso una fattura: ritirarle lascerebbe un'attivita'
#   fatturabile orfana in viaggio, cioe' il residuo che questo cantiere chiude.
#
# ── ⭐ E ADESSO IL RIFIUTO HA UNA VIA D'USCITA ──────────────────────
#   Prima del lotto L5 questo blocco sarebbe stato un vicolo cieco — e infatti
#   `E_PREV_ANNULLA_COMMESSA_EMESSA` lo era. Con «Riporta da emettere» la riga
#   torna `NON_EMESSA` e da li' il ritiro la prende: il messaggio del codice
#   `E_SORGENTE_CON_RIGHE_EMESSE` nomina quella strada.
#
# ── ⭐ SI AGGANCIA AL DATO, NON A UN CODICE CABLATO ─────────────────
#   Non si confronta `codice_interno = 'ANNULLATO'`: si legge **`is_abortito`**
#   dal vocabolario degli stati del documento. ⭐ Tutti e quattro i vocabolari
#   ce l'hanno (`config.stati_doc_preventivi|ordini|ddt|contratti`, verificato),
#   ed e' la stessa scelta gia' fatta altrove nel dominio — la transizione e'
#   data-driven, e cosa significa «chiuso» e' una proprieta' del **dato**.
#   ⚠️ Il giorno che nasce un secondo stato abortito, questo guard lo copre da
#   solo. Con un codice cablato non l'avrebbe coperto, e in silenzio.
#
# ── ⭐ UNA FUNZIONE SOLA, PARAMETRIZZATA ────────────────────────────
#   `TG_ARGV[0]` = `codice_interno` della sorgente in `config.sorgenti`
#   `TG_ARGV[1]` = nome della colonna di stato sulla testata
#   `TG_ARGV[2]` = tabella del vocabolario degli stati (schema.tabella)
#   Il progetto ha gia' l'idioma (`dbops.trgfn_child_requires_active_parent`).
#   ⛔ Quattro copie divergerebbero, ed e' la stessa forma di difetto della
#   regola del 2.
#
# ── ⛔ LA CHIAVE E' `NEW.uid::text`, e vale per tutte le sorgenti ───
#   `vendite.commesse_attivita.sorgente_uid` porta `<testata>.uid::text` per
#   ogni sorgente — verificato sul corpo delle cinque `fn_list_*_da_pushare`.
#   ⚠️ NON e' la chiave di `vendite.commesse_sorgenti`, che varia (uid per il
#   preventivo, id per l'ordine): confonderle non darebbe errore, darebbe **zero
#   motivi**, cioe' un freno che lascia passare tutto.
#
# ── ⚠️ IL LIMITE, DETTO ─────────────────────────────────────────────
#   Il conteggio gira sotto ROW SECURITY (`vendite.commesse_attivita` ha la
#   RLS per emittente). Chi chiude un documento senza vedere le righe di
#   commessa che ne sono nate **non viene fermato**, e il ritiro del pezzo 2 non
#   le prende: il documento si chiude e le righe restano dove sono.
#   ⛔ E' il comportamento di OGGI, non un peggioramento — ma qui non c'e'
#   nessuna chiave esterna a fare da rete, quindi va scritto invece che dedotto.
#   ⭐ Il caso e' stretto: la commessa eredita l'emittente dal documento, quindi
#   chi vede l'uno vede normalmente le altre.
#
# ⚠️ Fase `_a10_`: e' un guard, e sta separato dal motore `_z90_` che agisce.
#   La cosa che BLOCCA e la cosa che FA restano due oggetti diversi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260826-34-create-trgfn-doc-guard-chiusura-sorgente-mctit.yaml

  - changeSet:
      id: 20260826-34-create-trgfn-doc-guard-chiusura-sorgente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L7b: il FRENO. Un documento che ha spinto in commessa righe gia' EMESSA non si chiude
        — sono in volo verso una fattura, e ritirarle lascerebbe un'attivita' fatturabile
        orfana in viaggio. Le NON_EMESSA invece le ritira il motore (_z90_). ⭐ Il rifiuto ha
        ora una via d'uscita, che il messaggio nomina: «Riporta da emettere» (L5) riporta la
        riga a NON_EMESSA e da li' il ritiro la prende. ⭐ Si aggancia al DATO e non a un
        codice cablato: legge `is_abortito` dal vocabolario degli stati, che tutti e quattro
        i documenti hanno — cosi' un secondo stato abortito sara' coperto da solo. UNA
        funzione parametrizzata su (sorgente, colonna di stato, vocabolario), non quattro
        copie. ⚠️ Il conteggio gira sotto RLS: chi non vede le righe non viene fermato — e'
        il comportamento di oggi, ma qui non c'e' una FK a fare da rete e va detto.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_check_sorgente_chiudibile'
                     AND p.pronargs = 2;
            # ⚠️ Il flag data-driven deve esistere su TUTTI i vocabolari che
            #    verranno montati: senza, il guard non saprebbe cosa sia
            #    «chiuso» e resterebbe silenziosamente inerte.
            - sqlCheck:
                expectedResult: 4
                sql: |
                  SELECT COUNT(*) FROM information_schema.columns
                   WHERE table_schema = 'config'
                     AND column_name = 'is_abortito'
                     AND table_name IN ('stati_doc_preventivi', 'stati_doc_ordini',
                                        'stati_doc_ddt', 'stati_doc_contratti');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_doc_guard_chiusura_sorgente()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_sorgente_codice  text := TG_ARGV[0];
                  v_colonna_stato    text := TG_ARGV[1];
                  v_vocabolario      text := TG_ARGV[2];
                  v_sorgente_tipo_id config.sorgenti.id%TYPE;
                  v_stato_new        bigint;
                  v_stato_old        bigint;
                  v_chiude_new       boolean := false;
                  v_chiude_old       boolean := false;
                  v_motivi           jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare la CHIUSURA di un documento che ha spinto in
                  --   commessa righe gia' EMESSA. Quelle sono in volo verso
                  --   una fattura e non si ritirano; le NON_EMESSA le prende
                  --   il motore (trgfn_doc_ritira_commessa_attivita, _z90_).
                  --
                  -- ⭐ Generica: TG_ARGV[0] = codice_interno della sorgente,
                  --   TG_ARGV[1] = colonna di stato della testata,
                  --   TG_ARGV[2] = tabella del vocabolario degli stati.
                  --   Quattro copie divergerebbero.
                  --
                  -- ⭐ Si aggancia a `is_abortito` e NON a un codice cablato:
                  --   cosa significhi «chiuso» e' una proprieta' del DATO, come
                  --   gia' lo e' la matrice delle transizioni. Un secondo stato
                  --   abortito sara' coperto da solo.
                  -- =========================================================
                  v_stato_new := (to_jsonb(NEW) ->> v_colonna_stato)::bigint;
                  v_stato_old := (to_jsonb(OLD) ->> v_colonna_stato)::bigint;

                  -- No-op se lo stato non cambia davvero.
                  IF v_stato_new IS NOT DISTINCT FROM v_stato_old THEN
                      RETURN NEW;
                  END IF;

                  EXECUTE format(
                      'SELECT COALESCE(bool_or(s.is_abortito) FILTER (WHERE s.id = $1), false),'
                      '       COALESCE(bool_or(s.is_abortito) FILTER (WHERE s.id = $2), false)'
                      '  FROM %s s WHERE s.id IN ($1, $2)', v_vocabolario)
                     INTO v_chiude_new, v_chiude_old
                    USING v_stato_new, v_stato_old;

                  -- Interessa SOLO l'ingresso in uno stato abortito. Uscirne o
                  -- restarci non e' una chiusura.
                  IF NOT v_chiude_new OR v_chiude_old THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.id INTO v_sorgente_tipo_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = v_sorgente_codice;

                  IF v_sorgente_tipo_id IS NULL THEN
                      -- ⛔ Fail-closed su un trigger montato male: meglio un
                      --    errore parlante che un freno silenziosamente inerte.
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text,
                          'E_RITIRO_SORGENTE_PARAMETRO_MANCANTE',
                          jsonb_build_object('parametro', 'TG_ARGV[0]',
                                             'valore',    v_sorgente_codice),
                          NULL::uuid, 'TG_ARGV[0]');
                  END IF;

                  -- ⛔ LA CHIAVE e' `uid::text`: e' cio' che le cinque
                  --    fn_list_*_da_pushare scrivono in
                  --    commesse_attivita.sorgente_uid. NON e' la chiave di
                  --    commesse_sorgenti, che varia per sorgente — confonderle
                  --    non darebbe errore, darebbe ZERO motivi.
                  v_motivi := script.fn_check_sorgente_chiudibile(
                                  v_sorgente_tipo_id,
                                  (to_jsonb(NEW) ->> 'uid'));

                  IF jsonb_array_length(v_motivi) > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text,
                          v_motivi -> 0 ->> 'codice',
                          jsonb_build_object(
                              'sorgente',         v_sorgente_codice,
                              'sorgente_uid',     (to_jsonb(NEW) ->> 'uid'),
                              'documento_id',     (to_jsonb(NEW) ->> 'id'),
                              'motivi',           v_motivi),
                          NULL::uuid,
                          v_motivi -> 0 ->> 'dettaglio');
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_doc_guard_chiusura_sorgente()
              IS 'FRENO generico: rifiuta la CHIUSURA di un documento che ha spinto in commessa righe gia'' EMESSA. ⭐ E'' meta'' della regola decisa con la strada A: quando un documento si chiude, le righe NON_EMESSA il documento le RITIRA (motore vendite.trgfn_doc_ritira_commessa_attivita, fase _z90_) e le EMESSA lo BLOCCANO — sono in volo verso una fattura, e ritirarle lascerebbe un''attivita'' fatturabile orfana in viaggio, cioe'' il residuo che questo cantiere esiste per chiudere. ⭐ E dal lotto L5 il rifiuto ha una VIA D''USCITA che il messaggio nomina: «Riporta da emettere» riporta la riga a NON_EMESSA e da li'' il ritiro la prende; prima di L5 sarebbe stato un vicolo cieco, ed e'' esattamente cio'' che E_PREV_ANNULLA_COMMESSA_EMESSA era. ⭐ SI AGGANCIA AL DATO e non a un codice cablato: legge is_abortito dal vocabolario degli stati del documento invece di confrontare codice_interno = ANNULLATO. Tutti e quattro i vocabolari (config.stati_doc_preventivi, _ordini, _ddt, _contratti) hanno quel flag, ed e'' la stessa scelta gia'' fatta per la matrice delle transizioni: cosa significhi «chiuso» e'' una proprieta'' del dato. ⚠️ Il giorno che nasce un secondo stato abortito, questo guard lo copre da solo — con un codice cablato non l''avrebbe coperto, e in silenzio. ⭐ UNA funzione parametrizzata su (TG_ARGV[0] = codice_interno della sorgente, TG_ARGV[1] = colonna di stato, TG_ARGV[2] = tabella del vocabolario), non quattro copie: e'' l''idioma di dbops.trgfn_child_requires_active_parent. ⛔ La CHIAVE passata alla check e'' NEW.uid::text, cioe'' quella di vendite.commesse_attivita — verificata sul corpo delle cinque fn_list_*_da_pushare, che compongono tutte x.uid::text. NON e'' la chiave di vendite.commesse_sorgenti, che varia per sorgente: confonderle non darebbe un errore, darebbe ZERO motivi, cioe'' un freno che lascia passare tutto. ⛔ Fail-closed su un trigger montato con un codice sorgente inesistente: solleva invece di restare inerte. ⚠️ IL LIMITE: il conteggio gira sotto ROW SECURITY (commesse_attivita ha la RLS per emittente), quindi chi chiude un documento senza vedere le righe che ne sono nate NON viene fermato, e il motore non le ritira — il documento si chiude e le righe restano dove sono. E'' il comportamento di oggi e non un peggioramento, ma qui NON c''e'' nessuna chiave esterna a fare da rete, quindi va scritto invece che dedotto; il caso resta stretto perche'' la commessa eredita l''emittente dal documento. Piano: brief-db-lavoro-che-non-torna-indietro, L7 / Q-5'' strada A.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.trgfn_doc_guard_chiusura_sorgente();
