databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260510-01-update-fn-list-preventivi-da-pushare-add-p-preventivo-id-mctit.yaml

  - changeSet:
      id: 20260510-01-update-fn-list-preventivi-da-pushare-add-p-preventivo-id
      author: mctit
      runOnChange: false
      comment: "Estensione 2026-05: aggiunge p_preventivo_id (opzionale) per push commessa di un singolo preventivo da UI (pulsante 'Push commessa' drawer preventivo)."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              -- Drop firma a 3 parametri: PostgreSQL non consente CREATE OR REPLACE
              -- per aggiungere parametri (creerebbe una overload distinta).
              DROP FUNCTION IF EXISTS vendite.fn_list_preventivi_da_pushare(date, bigint, integer);

              -- Estensione 2026-05: parametro p_preventivo_id per push commessa
              -- di un singolo preventivo (UI driven). NULL preserva il comportamento
              -- di lista globale del batch orchestrator.
              CREATE OR REPLACE FUNCTION vendite.fn_list_preventivi_da_pushare(
                p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL,
                p_billing_account_id anagrafiche.billing_account.id%TYPE           DEFAULT NULL,
                p_limit              integer                                        DEFAULT NULL,
                p_preventivo_id      vendite.preventivi.id%TYPE                    DEFAULT NULL
              )
              RETURNS TABLE(
                -- Identificatori sorgente
                preventivo_id                vendite.preventivi.id%TYPE,
                preventivo_uid               vendite.preventivi.uid%TYPE,
                riga_id                      vendite.preventivi_righe.id%TYPE,
                -- Per fn_get_or_create_commessa
                billing_account_id           anagrafiche.billing_account.id%TYPE,
                utility_id                   anagrafiche.billing_account.utility_id%TYPE,
                emittente_soggetto_ruolo_id  vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                competenza_dal               vendite.commesse.competenza_dal%TYPE,
                competenza_al                vendite.commesse.competenza_al%TYPE,
                fatturazione_immediata       vendite.preventivi.fatturazione_immediata%TYPE,
                -- Per fn_link_commessa_sorgente
                sorgente_tipo_id             config.sorgenti.id%TYPE,
                sorgente_uid                 vendite.commesse_attivita.sorgente_uid%TYPE,
                -- Per fn_upsert_commessa_attivita
                segment_key                  vendite.commesse_attivita.segment_key%TYPE,
                articolo_id                  vendite.commesse_attivita.articolo_id%TYPE,
                istanza_utility_id           vendite.commesse_attivita.istanza_utility_id%TYPE,
                data_attivita                vendite.commesse_attivita.data_attivita%TYPE,
                uom_id                       vendite.commesse_attivita.uom_id%TYPE,
                quantita                     vendite.commesse_attivita.quantita%TYPE,
                qta_operativa                vendite.commesse_attivita.qta_operativa%TYPE,
                uom_operativa_id             vendite.commesse_attivita.uom_operativa_id%TYPE,
                factor_to_base               vendite.commesse_attivita.factor_to_base%TYPE,
                competenza_mese              vendite.commesse_attivita.competenza_mese%TYPE,
                prezzo_snapshot              vendite.commesse_attivita.prezzo_snapshot%TYPE,
                prezzo_bloccato              vendite.commesse_attivita.prezzo_bloccato%TYPE,
                pricing_mode                 vendite.commesse_attivita.pricing_mode%TYPE,
                -- tipo_movimento e tipo_consumo sono campi di output normalizzati
                -- del contratto push; non sono colonne dirette di commesse_attivita.
                tipo_movimento               varchar,
                tipo_consumo                 varchar,
                valuta_id                    vendite.commesse_attivita.valuta_id%TYPE,
                meta                         vendite.commesse_attivita.meta%TYPE,
                tipo_doc_fiscale_id          config.tipi_doc_fiscale.id%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_accettato_id  config.stati_doc_preventivi.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituire le righe preventivo pronte per il push su
                --   commessa, con tutti i campi necessari agli handler.
                --
                -- Regole:
                --   - stato documento ACCETTATO (codice da config.stati_doc_preventivi)
                --   - esclude righe gia` EMESSA in commessa (via NOT EXISTS)
                --   - riga attivo = true, quantita > 0, prezzo >= 0
                --   - prezzo_bloccato = fatturazione_immediata (documento)
                --   - tipo_commessa target: REALE, policy: DA_DOCUMENTO
                --
                -- Estensione 2026-05: p_preventivo_id (opzionale):
                --   - NULL     -> lista globale filtrata, comportamento batch invariato
                --   - NOT NULL -> filtra al singolo preventivo (push UI-driven)
                --   Tutti i filtri (competenza_mese, billing_account_id,
                --   p_preventivo_id) sono applicati in AND.
                --
                -- NOTE:
                --   - preventivi_righe.uom_id droppata (mai popolata dal trigger);
                --     restituito NULL::bigint.
                -- =========================================================

                -- Guard: p_preventivo_id, se specificato, deve essere > 0.
                IF p_preventivo_id IS NOT NULL AND p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'fn_list_preventivi_da_pushare',
                    'E_VALIDAZIONE',
                    jsonb_build_object('p_preventivo_id', p_preventivo_id),
                    NULL::uuid,
                    'p_preventivo_id deve essere > 0 se specificato'
                  );
                END IF;

                -- Lookup sorgente PREVENTIVO attiva + tipo_doc_fiscale_id.
                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice = 'PREVENTIVO' AND s.attivo IS TRUE
                LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_preventivi_da_pushare', 'E_GENERICO',
                    jsonb_build_object(
                      'scope',    'COMMESSE',
                      'severity', 'C',
                      'code',     'E_GENERICO',
                      'lotto_id', NULL,
                      'fattura_id', NULL,
                      'context',  jsonb_build_object('detail', 'sorgente PREVENTIVO non configurata/attiva')
                    ),
                    NULL::uuid,
                    'sorgente PREVENTIVO non configurata/attiva'
                  );
                END IF;

                -- Lookup stato documento ACCETTATO.
                SELECT s.id INTO v_stato_accettato_id
                FROM config.stati_doc_preventivi s
                WHERE s.codice = 'ACCETTATO' AND s.attivo IS TRUE
                LIMIT 1;

                RETURN QUERY
                SELECT
                  p.id                                                          AS preventivo_id,
                  p.uid                                                         AS preventivo_uid,
                  pr.id                                                         AS riga_id,
                  p.billing_account_id,
                  p.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(p.billing_account_id) AS emittente_soggetto_ruolo_id,
                  p.validita_dal                                                AS competenza_dal,
                  p.validita_al                                                 AS competenza_al,
                  p.fatturazione_immediata,
                  v_sorgente_tipo_id                                            AS sorgente_tipo_id,
                  p.uid::text                                                   AS sorgente_uid,
                  -- segment_key: stabile e deterministico per idempotenza upsert
                  ('PREV:' || p.uid::text || ':R:' || pr.id::text)::varchar    AS segment_key,
                  pr.articolo_id,
                  p.istanza_utility_id,
                  COALESCE(p.validita_dal, p.data)                             AS data_attivita,
                  -- uom_id rimosso da preventivi_righe (colonna droppata, mai valorizzata)
                  NULL::bigint                                                  AS uom_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  COALESCE(pr.factor_to_base, 1::numeric)                      AS factor_to_base,
                  date_trunc('month', COALESCE(p.validita_dal, p.data))::date  AS competenza_mese,
                  pr.prezzo_unitario                                            AS prezzo_snapshot,
                  -- prezzo_bloccato = true solo per fatturazione immediata;
                  -- per periodica rimane ricalcolabile al momento del pull.
                  COALESCE(p.fatturazione_immediata, false)                    AS prezzo_bloccato,
                  'FIXED'::varchar                                              AS pricing_mode,
                  'NORMALE'::varchar                                            AS tipo_movimento,
                  'CONGUAGLIO'::varchar                                         AS tipo_consumo,
                  p.valuta_id,
                  jsonb_build_object(
                    'preventivo_numero',   p.numero,
                    'preventivo_rev',      p.rev,
                    'tipo_commessa',       'REALE',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  )                                                             AS meta,
                  v_tipo_doc_fiscale_id                                         AS tipo_doc_fiscale_id
                FROM vendite.preventivi p
                JOIN vendite.preventivi_righe pr
                  ON pr.preventivo_id = p.id
                 AND pr.attivo IS TRUE
                 AND pr.quantita > 0
                 AND pr.prezzo_unitario >= 0
                WHERE p.billing_account_id IS NOT NULL
                  AND p.utility_id IS NOT NULL
                  -- Stato documento: ACCETTATO (NULL = configurazione mancante, non filtra).
                  AND (v_stato_accettato_id IS NULL OR p.stato_doc_preventivo_id = v_stato_accettato_id)
                  -- Filtri opzionali: tutti applicati in AND.
                  AND (p_competenza_mese IS NULL
                       OR date_trunc('month', COALESCE(p.validita_dal, p.data))::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR p.billing_account_id = p_billing_account_id)
                  -- Estensione 2026-05: NULL = lista globale; NOT NULL = singolo preventivo.
                  AND (p_preventivo_id IS NULL OR p.id = p_preventivo_id)
                  -- Esclude righe gia` emesse in commessa (idempotenza batch).
                  AND NOT EXISTS (
                    SELECT 1
                    FROM vendite.commesse_attivita ca
                    WHERE ca.segment_key = 'PREV:' || p.uid::text || ':R:' || pr.id::text
                      AND ca.stato_emissione = 'EMESSA'
                  )
                ORDER BY p.id, pr.id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_preventivi_da_pushare(date, bigint, integer, bigint)
              IS 'Lista righe preventivo eligible al push su commessa (stato ACCETTATO). p_preventivo_id (opzionale): NULL=lista globale batch, NOT NULL=singolo preventivo UI-driven. Tutti i filtri applicati in AND. Esclude righe gia` emesse via NOT EXISTS su commesse_attivita.';
