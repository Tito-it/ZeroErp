                  NEW.iva_natura := v_natura_code;
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatture_righe_guard_normalize()
              IS 'Eredita il billing account di destinazione dalla testata, e CONGELA sulla riga il trattamento IVA preso dal master: il codice di natura (dal 2025) e, dal 2026-08-29, l''ALIQUOTA APPLICATA (D19 del cantiere IVA). ⭐ Le due colonne sono la stessa specie — snapshot — ed e'' per questo che `iva_natura` sopravvisse alla potatura che nel 2025 tolse `iva_perc`: quella era una denormalizzazione su un documento vivo, queste sono memoria. 🔴 L''aliquota serve sulla RIGA e non solo sul riepilogo perche'' vendite.fn_ricalcola_riepilogo_iva_fattura ricostruisce i riepiloghi DALLE RIGHE: senza, una rigenerazione dopo un cambio di aliquota produrrebbe numeri diversi dall''originale e niente potrebbe smentirla. ⚠️ L''aliquota non e'' config.iva.aliquota_iva e basta: config.iva_stati puo'' sovrascriverla per lo stato dell''emittente, e lo stato si ricava con lo STESSO identico percorso di fn_ricalcola_riepilogo_iva_fattura (fattura -> soggetti_ruoli -> soggetti) — se i due divergessero, riga e riepilogo dello stesso documento porterebbero aliquote diverse e nessuno se ne accorgerebbe finche'' non quadrasse un totale. ⚠️ La chiamata sta DENTRO il ramo «iva_id valorizzato» che gia'' esisteva: config.fn_get_aliquota_iva solleva su un id nullo, e il difetto §R-3 su quel fronte non si chiude qui. ⚠️ Su un documento vivo il valore si riallinea a ogni scrittura della riga, ed e'' voluto; dal congelamento in poi le righe non si toccano piu'' (trg_fatture_righe_a10_guard_congelamento_ins_upd_dlt), quindi resta fermo per costruzione senza un secondo presidio. ℹ️ Sistemato passando: v_parent_ba era `integer` mentre billing_account.id e'' bigint — ora ancorata con %TYPE. ℹ️ Il blocco 3 e'' ridondante rispetto al 2 e si lascia com''era: toglierlo e'' un''altra modifica.';