# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2e (G-8, L2e-2 = (a)): la diagnosi del push della bolla compone la chiave col BB
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-8, §13.3.
#
#   La chiave della riga di bolla la compone script.fn_segment_key (DDT_VENDITA:<uid>:R:<riga>).
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. Firma e RETURNS TABLE ricostruiti dal catalogo e ancorati con %TYPE dove una colonna
#   con lo stesso nome e lo stesso tipo esiste (verificato); nudi, col motivo, i valori calcolati.
#   ⚠️ Le chiavi gia' scritte nei dati di dbdev si convertono con lo SQL una tantum del giro.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-94-update-fn-ddt-push-diagnosi-chiave-sorgente-mctit.yaml

  - changeSet:
      id: 20261020-94-update-fn-ddt-push-diagnosi-chiave-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_ddt_push_diagnosi: la chiave da script.fn_segment_key (DDT_VENDITA); firma e RETURNS ancorati. Grammatica unica, 2e (G-8).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_push_diagnosi(
                  p_ddt_id vendite.ddt.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(
                  -- nudi (motivo_rank, motivo, segment, quantita_push): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  ddt_id             vendite.ddt.id%TYPE,
                  riga_id            vendite.ddt_righe.id%TYPE,
                  motivo_rank        integer,
                  motivo             text,
                  billing_account_id anagrafiche.billing_account.id%TYPE,
                  ordine_riga_id     vendite.ordini_righe.id%TYPE,
                  segment            text,
                  quantita_push      numeric)
               LANGUAGE sql
               STABLE
              -- rev 2026-10-20 (20261020-94, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave della riga di bolla la compone script.fn_segment_key
              --   (DDT_VENDITA). Firma e RETURNS ancorati.
              BEGIN ATOMIC
               WITH docs AS (
                        SELECT d.id,
                           d.uid,
                           d.stato_doc_ddt_id,
                           d.causale_trasporto_id,
                           d.billing_account_id
                          FROM vendite.ddt d
                         WHERE (d.id = fn_ddt_push_diagnosi.p_ddt_id)
                       UNION ALL
                        SELECT d.id,
                           d.uid,
                           d.stato_doc_ddt_id,
                           d.causale_trasporto_id,
                           d.billing_account_id
                          FROM vendite.ddt d
                         WHERE (fn_ddt_push_diagnosi.p_ddt_id IS NULL)
                       ), pm AS MATERIALIZED (
                        SELECT p.ddt_riga_id,
                           p.differenza,
                           p.stato
                          FROM vendite.fn_partite_merce(
                               CASE
                                   WHEN (fn_ddt_push_diagnosi.p_ddt_id IS NULL) THEN NULL::bigint[]
                                   ELSE ARRAY[fn_ddt_push_diagnosi.p_ddt_id]
                               END, NULL::bigint[]) p(ddt_riga_id, ddt_id, ddt_uid, articolo_id, is_composito, ordine_riga_id, ordine_id, origine, fatturabile, consegnato, reso, in_riconsegna, tenuti, fatturato_merce, fatturato_da_ordine, fatturato, misurabile, differenza, stato, e_riconsegna, sospetto_duplicato_ordine, rettificato, riconsegna_quota_nuova)
                       ), righe AS (
                        SELECT d.id AS d_id,
                           d.uid AS d_uid,
                           d.stato_doc_ddt_id,
                           d.causale_trasporto_id,
                           d.billing_account_id AS d_ba,
                           dr.id AS dr_id,
                           dr.quantita
                          FROM (docs d
                            JOIN vendite.ddt_righe dr ON (((dr.ddt_id = d.id) AND (dr.attivo IS TRUE))))
                       ), src AS MATERIALIZED (
                        SELECT r.dr_id,
                           s.src_fatturazione_trigger,
                           s.src_ordine_riga_id
                          FROM (righe r
                            LEFT JOIN LATERAL ( SELECT o.fatturazione_trigger AS src_fatturazione_trigger,
                                   orr.id AS src_ordine_riga_id
                                  FROM ((vendite.ordini_righe_fulfillment ful
                                    JOIN vendite.ordini_righe orr ON ((orr.id = ful.ordine_riga_id)))
                                    JOIN vendite.ordini o ON ((o.id = orr.ordine_id)))
                                 WHERE (ful.ddt_riga_id = r.dr_id)
                                 ORDER BY ful.id
                                LIMIT 1) s ON (true))
                       ), ba_vis AS MATERIALIZED (
                        SELECT b.id
                          FROM anagrafiche.billing_account b
                         WHERE (b.id IN ( SELECT DISTINCT r.d_ba
                                  FROM righe r
                                 WHERE (r.d_ba IS NOT NULL)))
                       ), cand AS (
                        SELECT r.d_id,
                           r.dr_id,
                           ba.id AS ba_id,
                           s.src_ordine_riga_id,
                           sdd.codice_interno AS sdd_cod,
                           sdd.ordine AS sdd_ord,
                           sdd.is_abortito AS sdd_abort,
                           caus.fatturabile AS caus_fatt,
                           s.src_fatturazione_trigger AS trg,
                           sdd_trg.ordine AS trg_ord,
                           pm.ddt_riga_id AS pm_presente,
                           pm.stato AS pm_stato,
                           script.fn_get_stato_push_segment(script.fn_segment_key('DDT_VENDITA'::character varying, (r.d_uid)::text, r.dr_id)) AS segment,
                           GREATEST((0)::numeric, LEAST(r.quantita, COALESCE(pm.differenza, (0)::numeric))) AS qta_push
                          FROM ((((((righe r
                            JOIN config.stati_doc_ddt sdd ON ((sdd.id = r.stato_doc_ddt_id)))
                            LEFT JOIN src s ON ((s.dr_id = r.dr_id)))
                            LEFT JOIN config.causali_trasporto caus ON ((caus.id = r.causale_trasporto_id)))
                            LEFT JOIN pm ON ((pm.ddt_riga_id = r.dr_id)))
                            LEFT JOIN ba_vis ba ON ((ba.id = r.d_ba)))
                            LEFT JOIN config.stati_doc_ddt sdd_trg ON (((sdd_trg.codice_interno)::text = (s.src_fatturazione_trigger)::text)))
                       ), diag AS (
                        SELECT c.d_id,
                           c.dr_id,
                           c.ba_id,
                           c.src_ordine_riga_id,
                           c.sdd_cod,
                           c.sdd_ord,
                           c.sdd_abort,
                           c.caus_fatt,
                           c.trg,
                           c.trg_ord,
                           c.pm_presente,
                           c.pm_stato,
                           c.segment,
                           c.qta_push,
                           ( SELECT r.rank
                                  FROM ( VALUES (1,c.sdd_abort), (1,((c.sdd_cod)::text = 'RESO'::text)), (2,(c.caus_fatt IS NOT TRUE)), (3,(c.ba_id IS NULL)), (4,(c.segment <> 'LIBERA'::text)), (5,((c.trg IS NOT NULL) AND ((c.trg)::text <> 'CONFERMATO'::text) AND ((c.trg_ord IS NULL) OR (c.sdd_ord < c.trg_ord)))), (5,((c.trg IS NULL) AND ((c.sdd_cod)::text <> ALL ((ARRAY['SPEDITO'::character varying, 'CONSEGNATO'::character varying])::text[])))), (6,((c.trg)::text = 'CONFERMATO'::text)), (7,((c.pm_stato)::text = 'RICONSEGNA'::text)), (8,((c.pm_stato)::text = 'NON_FATTURABILE'::text)), (9,((c.pm_stato)::text = 'NON_MISURABILE'::text)), (10,(c.pm_presente IS NULL)), (11,(c.qta_push <= (0)::numeric))) r(rank, hit)
                                 WHERE r.hit
                                 ORDER BY r.rank
                                LIMIT 1) AS mrank
                          FROM cand c
                       )
                SELECT diag.d_id,
                   diag.dr_id,
                   diag.mrank,
                       CASE diag.mrank
                           WHEN 1 THEN
                           CASE
                               WHEN ((diag.sdd_cod)::text = 'RESO'::text) THEN 'DDT_RESO'::text
                               ELSE 'DDT_ANNULLATO'::text
                           END
                           WHEN 2 THEN 'DDT_SOLO_TRASPORTO'::text
                           WHEN 3 THEN 'DDT_SENZA_BA'::text
                           WHEN 4 THEN 'DDT_ROUTED'::text
                           WHEN 5 THEN 'DDT_MERCE_IN_VIAGGIO'::text
                           WHEN 6 THEN 'DDT_FATTURA_DA_ORDINE'::text
                           WHEN 7 THEN 'DDT_RICONSEGNA'::text
                           WHEN 8 THEN 'DDT_NON_FATTURABILE'::text
                           WHEN 9 THEN 'DDT_NON_MISURABILE'::text
                           WHEN 10 THEN 'DDT_SENZA_PARTITA'::text
                           WHEN 11 THEN 'DDT_CONTATORE'::text
                           ELSE NULL::text
                       END AS "case",
                   diag.ba_id,
                   diag.src_ordine_riga_id,
                   diag.segment,
                   diag.qta_push
                  FROM diag;
              END;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_ddt_push_diagnosi(bigint) IS
                '⭐ rev 2026-10-11 (20261012-03): la CTE src (riga d''ordine sorgente) e'' MATERIALIZED. Senza, nel ramo «tutti» la sottoquery si ricalcolava per ogni riga esterna — righe² giri del LATERAL sotto RLS (~1,05 s su 1,18 con 58 righe, dbdev come app). Stesse righe. FONTE UNICA dell''eleggibilita'' al push a commessa (rev 2026-09-21, D14 seconda leva, forma B2): per ogni riga ATTIVA di DDT, IL motivo di esclusione (NULL = eleggibile) e i fatti per chi agisce — billing_account_id (della testata: NULL se manca o se invisibile a chi legge), ordine_riga_id (la riga d''ordine sorgente: primo fulfillment per id), segment (LIBERA/ALLOCATA/EMESSA da script.fn_get_stato_push_segment), quantita_push (la dose: GREATEST(0, LEAST(quantita, differenza della partita))). p_ddt_id NULL = tutte le righe. vendite.fn_list_ddt_da_pushare DERIVA da qui (FROM fn_ddt_push_diagnosi WHERE motivo IS NULL + filtri di chiamata e proiezione) e script.fn_available_actions_ddt la legge UNA volta: flag = esiste motivo NULL; poi ALLOCATA -> DDT_GIA_INVIATO, EMESSA -> DDT_GIA_FATTURATO; poi min(rank). ⛔ Un predicato di eleggibilita'' nuovo si aggiunge QUI come rank: nel lister non c''e'' piu'' un posto dove metterlo. motivo_rank = precedenza: 1 ANNULLATO/RESO, 2 SOLO_TRASPORTO (causale non fatturabile O assente), 3 SENZA_BA, 4 ROUTED, 5 MERCE_IN_VIAGGIO, 6 FATTURA_DA_ORDINE, 7 RICONSEGNA, 8 NON_FATTURABILE, 9 NON_MISURABILE, 10 SENZA_PARTITA, 11 CONTATORE. La capability mappa per STRINGA, non per numero, e il suo CASE ha un ELSE che fa cadere i motivi nuovi nel generico. BEGIN ATOMIC: le dipendenze (fn_partite_merce, fn_get_stato_push_segment, tabelle) sono in pg_depend. Il documento chiesto e'' un seme a due rami in UNION ALL, mai `p IS NULL OR`. ⭐ TUTTO SI LEGGE PER SEME, e le tre CTE MATERIALIZED sono la forma, non un suggerimento: la partita da vendite.fn_partite_merce col DDT come seme (quarta leva, 2026-09-21) in `pm` (giro 6: inlinata, come app era il lato interno di un nested loop ri-eseguito per ogni riga); i BILLING ACCOUNT in `ba_vis`, seminata dalle CHIAVI in gioco (giro 7, 2026-09-22: il LEFT JOIN alla tabella faceva rivalutare la policy su OGNI BA per OGNI riga, e nemmeno forzando l''indice diventava un Index Cond). ⚠️ `ba_vis` e'' letta come INVOKER: un BA che esiste ma che la policy non mostra non entra, e la riga esce SENZA_BA — semantica della rank 3 invariata, provata su casi COSTRUITI (sui dati vivi il ramo non e'' esercitato). `righe` e `src` escono da `cand` solo perche'' le chiavi dei BA siano calcolabili prima. ⭐ rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-6): il BA e'' UNO, quello della testata del DDT. Fino a questa revisione era COALESCE(BA del DDT, BA dell''ordine sorgente), per riga: un DDT senza BA con righe di ordini diversi spingeva su BA diversi, e uno col BA diverso dall''ordine spingeva col suo. Da oggi la riga che evade un ordine ha il BA del DDT (vendite.trgfn_ordini_ful_guard_consistenza) e la seconda fonte non aggiunge niente. I motivi 7/8/9 si leggono da `stato` (rev 2026-08-18, §23.2 brief-design-partita-merce-generalizzata). Brief: brief-db-partita-merce-per-documento §10, §13, §14; brief-db-ddt-reason-push-catch-all §3 (Decisione A). Rev 2026-10-20 (20261020-94, brief-db-grammatica-unica-documenti 2e, G-8): la chiave della riga di bolla la compone script.fn_segment_key (DDT_VENDITA).';

