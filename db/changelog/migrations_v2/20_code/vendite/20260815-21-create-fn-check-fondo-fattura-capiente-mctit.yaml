# ------------------------------------------------------------
# «La sorgente regge ancora questo fondo?» — la domanda, una volta sola.
#   Serve al passo D-10 di brief-db-fondo-fattura-ricalcolo-e-governo.md §8.2.
#
# ── PERCHE' ORA ─────────────────────────────────────────────────────────
#
#   La regola di capienza esisteva in UN posto: il WHERE di
#   fn_applica_fondi_fattura (guard D-3b). L'elenco «da decidere» ha bisogno
#   della STESSA regola per mostrare il caso NON_PIU_CAPIENTE — e con la
#   vista diventerebbero due. E' il secondo uso: la regola si estrae.
#
#   ⚠️ Il divario, se le si lasciasse separate, sarebbe di quelli che non si
#   vedono: l'elenco direbbe «questo fondo non e' piu' applicabile» mentre il
#   giro lo applica, o viceversa mostrerebbe come sano un fondo che il guard
#   scarta in silenzio a ogni corsa. Nessun errore, nessun log: solo due
#   verita'.
#
# ── LA FORMA: un predicato PURO ─────────────────────────────────────────
#
#   Prende i due NUMERI gia' calcolati — la capienza e l'importo dell'atto —
#   e non legge niente. E' quindi `IMMUTABLE` e in `LANGUAGE sql`, cioe'
#   inlinabile dal planner: dentro il WHERE di fn_applica non costa nulla.
#
#   ⭐ La scelta di NON fargli leggere la riga (firma `(source_id)`) e'
#   deliberata: chi lo chiama la capienza ce l'ha gia' — fn_applica la
#   calcola per il proprio LATERAL, la vista la mostra in colonna. Una firma
#   che la rilegge trasformerebbe una moltiplicazione in due letture, e
#   soprattutto renderebbe la funzione VOLATILE, cioe' non inlinabile.
#
# ── ⚠️ IL NULL NON E' NEUTRO, ED E' IL PUNTO PIU' DELICATO ──────────────
#
#   Con un argomento NULL la funzione torna FALSE, non NULL. La differenza
#   conta perche' i due chiamanti la usano in versi opposti:
#
#     · fn_applica:  `AND fn_check_...(...)`      FALSE = non applico   → chiuso
#     · la vista:    `AND NOT fn_check_...(...)`  FALSE = la mostro     → visibile
#
#   Con un ritorno NULL il primo si sarebbe comportato uguale, ma il secondo
#   avrebbe fatto SPARIRE la riga dall'elenco: il caso piu' anomalo sarebbe
#   stato l'unico invisibile. Fail-closed dove si scrive, fail-visible dove
#   si guarda — con la stessa funzione.
#
# ── NOMENCLATURA ────────────────────────────────────────────────────────
#
#   `fn_check_*` = predicato puro, nessuna raise. La convenzione del
#   progetto, e qui e' letterale: la funzione non conosce nemmeno gli id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260815-21-create-fn-check-fondo-fattura-capiente-mctit.yaml

  - changeSet:
      id: 20260815-21-create-fn-check-fondo-fattura-capiente
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nuova vendite.fn_check_fondo_fattura_capiente(capienza, importo):
        predicato puro e IMMUTABLE della regola di capienza, estratta dal
        WHERE di fn_applica_fondi_fattura perche' serve anche all'elenco
        vw_fondi_fattura_da_decidere. Ritorna FALSE sui NULL, non NULL.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_check_fondo_fattura_capiente(
                      p_capienza vendite.fatture.totale_a_pagare%TYPE,
                      p_importo  vendite.fatture_fondi_fattura_source.importo%TYPE)
               RETURNS BOOLEAN
               LANGUAGE sql
               IMMUTABLE
              AS $function$
                  -- ⚠️ Segno + valore assoluto, e non `p_capienza >= p_importo`:
                  --    su una sorgente a credito la capienza e' negativa e un
                  --    `>=` nudo direbbe sempre di no, spegnendo meta' del
                  --    meccanismo (il capo a credito della banda delle soglie).
                  --
                  -- ⚠️ I due IS NOT NULL non sono difensivi: senza di loro il
                  --    risultato sarebbe NULL, e un NULL fa sparire la riga
                  --    dall'elenco che usa questa funzione NEGATA. Il caso piu'
                  --    anomalo sarebbe l'unico invisibile.
                  SELECT p_capienza IS NOT NULL
                     AND p_importo  IS NOT NULL
                     AND sign(p_capienza) = sign(p_importo)
                     AND abs(p_capienza) >= abs(p_importo);
              $function$;

              -- ⚠️ COMMENT con i tipi RISOLTI (numeric, numeric): il %TYPE vale
              --    nella firma del CREATE, non nell'identificazione.
              COMMENT ON FUNCTION vendite.fn_check_fondo_fattura_capiente(NUMERIC, NUMERIC)
              IS 'La sorgente regge ancora questo fondo? Predicato PURO sulla capienza: stesso segno dell''importo dell''atto e non inferiore in valore assoluto. ⚠️ Segno + valore assoluto e non un `>=` nudo: su una sorgente a credito la capienza e'' negativa e il confronto diretto direbbe sempre di no, spegnendo il capo a credito della banda. ⚠️ Con un argomento NULL ritorna FALSE e non NULL, ed e'' il dettaglio piu'' delicato: i due chiamanti la usano in versi opposti — fn_applica_fondi_fattura come `AND` (FALSE = non applico, fail-closed) e vw_fondi_fattura_da_decidere come `AND NOT` (FALSE = la mostro, fail-visible). Un ritorno NULL avrebbe fatto sparire dall''elenco proprio il caso piu'' anomalo. Estratta il 2026-08-15 dal WHERE di fn_applica_fondi_fattura al secondo uso (regola del 2): due copie della regola di capienza direbbero, senza nessun errore e nessun log, due verita'' diverse — l''elenco che dichiara inapplicabile cio'' che il giro applica. IMMUTABLE e in LANGUAGE sql di proposito: cosi'' il planner la inlinea dentro il WHERE. Serve a D-10 di brief-db-fondo-fattura-ricalcolo-e-governo §8.2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_check_fondo_fattura_capiente(NUMERIC, NUMERIC);
