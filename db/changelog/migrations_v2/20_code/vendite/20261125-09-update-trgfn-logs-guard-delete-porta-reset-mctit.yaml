# LA PORTA DEL RESET CHIEDE ANCHE IL PROPRIETARIO
#   vendite.trgfn_logs_guard_delete
#   Brief: brief-db-porte-aperte-dalla-sola-guc §13.5 (giro 8 + 1-7, porte 1-7; D-A a, D-W a di Tid).
#
# -- CHE COSA CAMBIA ---------------------------------------------------------
#   La porta del reset del lotto si legge da vendite.fn_porta_reset_lotto_aperta
#   (20261125-02): GUC accesa E proprietario della tabella. Prima bastava la
#   GUC, e l'app poteva accenderla da se' e scrivere diretta. La lettura copiata
#   qui si ritira (regola del 2). Il resto del guard e' invariato; il COMMENT
#   si riscrive al presente (linee-guida-sql §5d).
#   Corpo dal catalogo di dbdev.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261125-09-update-trgfn-logs-guard-delete-porta-reset-mctit.yaml

  - changeSet:
      id: 20261125-09-update-trgfn-logs-guard-delete-porta-reset
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_logs_guard_delete: la porta del reset del lotto dal BB, GUC e
        proprietario. Brief: brief-db-porte-aperte-dalla-sola-guc §13.5.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_logs_guard_delete()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Proteggere fatture_log e fatturazione_lotti_log dalla
                  --   cancellazione ACCIDENTALE, distinguendo pero' fra
                  --   CANCELLARE LA STORIA e RITIRARE CIO' CHE E' SCADUTO.
                  --
                  -- Regole:
                  --   DELETE del reset tecnico   -> ammesso (la porta del reset:
                  --     GUC zeroerp.maintenance_reset_lotto_draft e proprietario,
                  --     vendite.fn_porta_reset_lotto_aperta)
                  --   DELETE di riga scaduta     -> ammesso (retention)
                  --   DELETE dalla porta di manutenzione -> ammesso
                  --     (zeroerp.maintenance_allow_delete_logs, solo per la
                  --      sessione del migratore, con la riga nel diario)
                  --   DELETE di riga viva        -> vietato
                  --
                  -- ⭐ Il criterio della retention non e' CHI cancella ma COSA:
                  --   cosi' dbops.fn_purge_cleanup_expired funziona com'e',
                  --   senza propagare GUC ne' riconoscere ruoli — parita' con
                  --   vendite.trgfn_event_log_append_only.
                  --
                  -- ⚠️ cleanup_at NULL = riga senza scadenza (nessuna regola
                  --   CLEANUP_AT quando e' nata): non si cancella. In dubbio
                  --   si conserva.
                  -- =========================================================

                  -- 1. Il reset tecnico di un lotto: la porta, col proprietario.
                  IF vendite.fn_porta_reset_lotto_aperta(TG_RELID) THEN
                      RETURN OLD;
                  END IF;

                  -- 2. Retention: la riga ha passato la sua scadenza.
                  IF OLD.cleanup_at IS NOT NULL AND OLD.cleanup_at <= now() THEN
                      RETURN OLD;
                  END IF;

                  -- 3. Manutenzione straordinaria: la porta del migratore.
                  IF script.fn_porta_manutenzione_aperta(
                         'zeroerp.maintenance_allow_delete_logs', TG_RELID, TG_OP, OLD.id::text) THEN
                      RETURN OLD;
                  END IF;

                  -- 4. Tutto il resto e' storia viva, e non si cancella.
                  PERFORM script.fn_log_and_raise_error(
                      'vendite', TG_NAME, 'E_DELETE_NOT_ALLOWED',
                      jsonb_build_object(
                          'table',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          'id',         OLD.id,
                          'cleanup_at', OLD.cleanup_at
                      ),
                      NULL::uuid, TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME, OLD.id::text
                  );

                  RETURN OLD;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_logs_guard_delete() IS $c$BEFORE DELETE su vendite.fatture_log e vendite.fatturazione_lotti_log. Vieta la cancellazione di una riga VIVA (E_DELETE_NOT_ALLOWED). La ammette: dal reset tecnico del lotto (la porta del reset, vendite.fn_porta_reset_lotto_aperta: GUC zeroerp.maintenance_reset_lotto_draft e proprietario della tabella, aperta solo durante la pulizia di vendite.fn_cleanup_fatture_by_ids); su una riga SCADUTA (cleanup_at <= now(), la retention, con lo stesso criterio di vendite.trgfn_event_log_append_only: non CHI cancella ma COSA, cosi' dbops.fn_purge_cleanup_expired funziona com'e'); dalla porta di manutenzione zeroerp.maintenance_allow_delete_logs, che apre solo per la sessione del migratore (script.fn_porta_manutenzione_aperta) e lascia la riga in dbops.porte_manutenzione_passaggi. cleanup_at NULL = non scade mai. ⛔ Legge OLD.cleanup_at: si monta solo su tabelle che hanno la colonna.$c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_logs_guard_delete()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- text nudo: il valore di una GUC, non il riflesso di una colonna
                  v_allow_reset text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Proteggere fatture_log e fatturazione_lotti_log dalla
                  --   cancellazione ACCIDENTALE, distinguendo pero' fra
                  --   CANCELLARE LA STORIA e RITIRARE CIO' CHE E' SCADUTO.
                  --
                  -- Regole:
                  --   DELETE del reset tecnico   -> ammesso (porta di verbo
                  --     zeroerp.maintenance_reset_lotto_draft, aperta da
                  --     vendite.fn_cleanup_fatture_by_ids)
                  --   DELETE di riga scaduta     -> ammesso (retention)
                  --   DELETE dalla porta di manutenzione -> ammesso
                  --     (zeroerp.maintenance_allow_delete_logs, solo per la
                  --      sessione del migratore, con la riga nel diario)
                  --   DELETE di riga viva        -> vietato
                  --
                  -- ⭐ Il criterio della retention non e' CHI cancella ma COSA:
                  --   cosi' dbops.fn_purge_cleanup_expired funziona com'e',
                  --   senza propagare GUC ne' riconoscere ruoli — parita' con
                  --   vendite.trgfn_event_log_append_only.
                  --
                  -- ⚠️ cleanup_at NULL = riga senza scadenza (nessuna regola
                  --   CLEANUP_AT quando e' nata): non si cancella. In dubbio
                  --   si conserva.
                  -- =========================================================

                  -- 1. Il reset tecnico di un lotto in bozza: porta di verbo, com'era.
                  v_allow_reset := current_setting('zeroerp.maintenance_reset_lotto_draft', true);

                  IF COALESCE(lower(v_allow_reset), 'off') IN ('on', 'true', '1') THEN
                      RETURN OLD;
                  END IF;

                  -- 2. Retention: la riga ha passato la sua scadenza.
                  IF OLD.cleanup_at IS NOT NULL AND OLD.cleanup_at <= now() THEN
                      RETURN OLD;
                  END IF;

                  -- 3. Manutenzione straordinaria: la porta del migratore.
                  IF script.fn_porta_manutenzione_aperta(
                         'zeroerp.maintenance_allow_delete_logs', TG_RELID, TG_OP, OLD.id::text) THEN
                      RETURN OLD;
                  END IF;

                  -- 4. Tutto il resto e' storia viva, e non si cancella.
                  PERFORM script.fn_log_and_raise_error(
                      'vendite', TG_NAME, 'E_DELETE_NOT_ALLOWED',
                      jsonb_build_object(
                          'table',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                          'id',         OLD.id,
                          'cleanup_at', OLD.cleanup_at
                      ),
                      NULL::uuid, TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME, OLD.id::text
                  );

                  RETURN OLD;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_logs_guard_delete() IS $c$BEFORE DELETE su vendite.fatture_log e vendite.fatturazione_lotti_log. Vieta la cancellazione di una riga VIVA (E_DELETE_NOT_ALLOWED). La ammette: dal reset tecnico del lotto in bozza (porta di verbo zeroerp.maintenance_reset_lotto_draft, aperta da vendite.fn_cleanup_fatture_by_ids); su una riga SCADUTA (cleanup_at <= now(), la retention, con lo stesso criterio di vendite.trgfn_event_log_append_only: non CHI cancella ma COSA, cosi' dbops.fn_purge_cleanup_expired funziona com'e'); dalla porta di manutenzione zeroerp.maintenance_allow_delete_logs, che apre solo per la sessione del migratore (script.fn_porta_manutenzione_aperta) e lascia la riga in dbops.porte_manutenzione_passaggi. cleanup_at NULL = non scade mai. ⛔ Legge OLD.cleanup_at: si monta solo su tabelle che hanno la colonna.$c$;
