                  p_documento    text,
                  p_documento_id bigint)
              RETURNS TABLE(
                  id                    vendite.contratti_righe.id%TYPE,
                  articolo_id           vendite.contratti_righe.articolo_id%TYPE,
                  tipo_eccezione        vendite.contratti_righe.tipo_eccezione%TYPE,
                  prezzo_unitario       vendite.contratti_righe.prezzo_unitario%TYPE,
                  quantita              vendite.contratti_righe.quantita%TYPE,
                  qta_operativa         vendite.contratti_righe.qta_operativa%TYPE,
                  uom_operativa_id      vendite.contratti_righe.uom_operativa_id%TYPE,
                  tipo_erogazione       vendite.contratti_righe.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.contratti_righe.fonte_quantita_attesa%TYPE,
                  ordine                vendite.contratti_righe.ordine%TYPE,
                  attivo                vendite.contratti_righe.attivo%TYPE)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$

              -- Scopo: le righe eccezione (OVERRIDE, ESCLUSIONE, AGGIUNTA) di un
              --   contratto o di un'offerta, con le stesse colonne. Tutte, attive
              --   e no: filtra chi legge.
              -- ⚠️ p_documento e p_documento_id nudi DICHIARATI: un selettore
              --   senza colonna-vocabolario e un id polimorfo (due testate).
              BEGIN
                  IF p_documento = 'CONTRATTO' THEN
                      RETURN QUERY
                      SELECT cr.id, cr.articolo_id, cr.tipo_eccezione, cr.prezzo_unitario,
                             cr.quantita, cr.qta_operativa, cr.uom_operativa_id,
                             cr.tipo_erogazione, cr.fonte_quantita_attesa, cr.ordine,
                             cr.attivo
