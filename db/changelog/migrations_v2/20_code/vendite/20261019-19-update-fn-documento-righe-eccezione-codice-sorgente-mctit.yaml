# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 1: vendite.fn_documento_righe_eccezione
#   Brief: brief-db-grammatica-unica-documenti §9 (G-1, G-4 di Tid, 2026-10-18).
#
#   La famiglia dei documenti con eccezioni (contratto, offerta) passa dal
#   codice corto OFFERTA a quello della sorgente, OFFERTA_COMMERCIALE.
#   CONTRATTO e' gia' il codice della sorgente e non cambia.
#
#   p_documento era un text nudo «senza colonna-vocabolario»: col lotto 0 la
#   colonna c'e', config.sorgenti.codice_interno, e il parametro si ancora
#   li' (%TYPE in firma). Il tipo passa da text a character varying, quindi
#   la firma cambia: DROP + CREATE, non CREATE OR REPLACE (che creerebbe un
#   overload). Nessun dipendente registrato (plpgsql: le chiamate si
#   risolvono a runtime); il backend passa il codice come parametro
#   semplice, e un text si converte da solo in varchar.
#
#   Corpo dalla definizione viva (dbdev, 2026-10-19), firma e RETURNS
#   dall'ultimo YAML che li ha ancorati (20261004-70). COMMENT vivo con la nota
#   di revisione in coda.
#
#   ⚠️ Applicare insieme al giro BE del lotto 1 (brief §9.4): dopo l'apply
#   il codice OFFERTA e' rifiutato (E_DOC_TIPO_NON_GESTITO / zero righe).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-19-update-fn-documento-righe-eccezione-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-19-update-fn-documento-righe-eccezione-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_documento_righe_eccezione: il documento e' CONTRATTO | OFFERTA_COMMERCIALE,
        p_documento ancorato a config.sorgenti.codice_interno (DROP + CREATE). Grammatica unica, lotto 1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_documento_righe_eccezione(text, bigint);

              CREATE FUNCTION vendite.fn_documento_righe_eccezione(
                  p_documento    config.sorgenti.codice_interno%TYPE,
                  p_documento_id bigint)
              RETURNS TABLE(
                  id                    vendite.contratti_righe.id%TYPE,
                  articolo_id           vendite.contratti_righe.articolo_id%TYPE,
                  tipo_eccezione        vendite.contratti_righe.tipo_eccezione%TYPE,
                  prezzo_unitario       vendite.contratti_righe.prezzo_unitario%TYPE,
                  quantita              vendite.contratti_righe.quantita%TYPE,
                  qta_operativa         vendite.contratti_righe.qta_operativa%TYPE,
                  uom_operativa_id      vendite.contratti_righe.uom_operativa_id%TYPE,
                  tipo_erogazione       vendite.contratti_righe.tipo_erogazione%TYPE,
                  fonte_quantita_attesa vendite.contratti_righe.fonte_quantita_attesa%TYPE,
                  ordine                vendite.contratti_righe.ordine%TYPE,
                  attivo                vendite.contratti_righe.attivo%TYPE)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$

              -- Scopo: le righe eccezione (OVERRIDE, ESCLUSIONE, AGGIUNTA) di un
              --   contratto o di un'offerta, con le stesse colonne. Tutte, attive
              --   e no: filtra chi legge.
              -- ⚠️ p_documento e' il codice della sorgente (CONTRATTO |
              --   OFFERTA_COMMERCIALE), ancorato a config.sorgenti.codice_interno
              --   (grammatica unica dei tipi di documento, lotto 1). p_documento_id
              --   nudo DICHIARATO: un id polimorfo (due testate).
              BEGIN
                  IF p_documento = 'CONTRATTO' THEN
                      RETURN QUERY
                      SELECT cr.id, cr.articolo_id, cr.tipo_eccezione, cr.prezzo_unitario,
                             cr.quantita, cr.qta_operativa, cr.uom_operativa_id,
                             cr.tipo_erogazione, cr.fonte_quantita_attesa, cr.ordine,
                             cr.attivo
                        FROM vendite.contratti_righe cr
                       WHERE cr.contratto_id = p_documento_id;

                  ELSIF p_documento = 'OFFERTA_COMMERCIALE' THEN
                      RETURN QUERY
                      SELECT oe.id, oe.articolo_id, oe.tipo_eccezione, oe.prezzo_unitario,
                             oe.quantita, oe.qta_operativa, oe.uom_operativa_id,
                             oe.tipo_erogazione, oe.fonte_quantita_attesa, oe.ordine,
                             oe.attivo
                        FROM vendite.offerte_commerciali_eccezioni oe
                       WHERE oe.offerta_id = p_documento_id;

                  ELSE
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'fn_documento_righe_eccezione',
                          'E_DOC_TIPO_NON_GESTITO',
                          jsonb_build_object('documento',    p_documento,
                                             'documento_id', p_documento_id),
                          NULL::uuid,
                          COALESCE(p_documento, '<null>'));
                  END IF;

                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_righe_eccezione(config.sorgenti.codice_interno%TYPE, bigint) IS
                'Le righe eccezione (OVERRIDE, ESCLUSIONE, AGGIUNTA) di un contratto (vendite.contratti_righe) o di un''offerta (vendite.offerte_commerciali_eccezioni), con le stesse colonne: le due tabelle sono gemelle per progetto. p_documento = CONTRATTO | OFFERTA; altro valore: E_DOC_TIPO_NON_GESTITO. Tutte le righe, attive e no. INVOKER: legge sotto la RLS di chi chiede. Colonne ancorate a contratti_righe (stesso tipo base sull''offerta; una funzione non porta il typmod). Consumatore: vendite.fn_documento_righe_preview, che senza di lei sceglierebbe la tabella in tre punti. Nasce il 2026-10-04, brief-db-righe-esclusione-solo-non-si-vende (R4). ⭐ rev 2026-10-19 (20261019-19, brief-db-grammatica-unica-documenti lotto 1, G-1 di Tid): il documento si nomina col codice della sorgente, CONTRATTO | OFFERTA_COMMERCIALE (era OFFERTA); dove sopra si legge OFFERTA come selettore, oggi e'' OFFERTA_COMMERCIALE. p_documento ancorato a config.sorgenti.codice_interno%TYPE: la firma passa da text a character varying (DROP + CREATE, nessun dipendente registrato).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
