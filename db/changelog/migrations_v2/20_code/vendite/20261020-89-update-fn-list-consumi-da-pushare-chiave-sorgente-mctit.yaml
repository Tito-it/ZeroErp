# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2e (G-8, L2e-2 = (a)): il lister dei consumi compone la chiave col BB
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-8, §13.3.
#
#   I lister della push verso la commessa restituiscono la chiave d'idempotenza di ogni riga:
#   ora la compone script.fn_segment_key (20261020-65) col codice della sorgente come prefisso
#   (CONS -> ATTIVITA_CONSUMI), anche dove la si confronta con fn_get_stato_push_segment. La chiave e' la stessa
#   espressione nei due punti, per costruzione.
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. Firma e RETURNS TABLE ricostruiti dal catalogo e ancorati con %TYPE dove una colonna
#   con lo stesso nome e lo stesso tipo esiste (verificato); nudi, col motivo, i valori calcolati.
#   ⚠️ Le chiavi gia' scritte nei dati di dbdev si convertono con lo SQL una tantum del giro.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-89-update-fn-list-consumi-da-pushare-chiave-sorgente-mctit.yaml

  - changeSet:
      id: 20261020-89-update-fn-list-consumi-da-pushare-chiave-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_list_consumi_da_pushare: la chiave da script.fn_segment_key (ATTIVITA_CONSUMI:<uid>); firma e RETURNS ancorati. Grammatica unica, 2e (G-8).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_consumi_da_pushare(
                  p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                  p_limit              integer DEFAULT NULL::integer,
                  p_consumo_id         vendite.attivita_consumi.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(
                  -- nudi (utility_id, fatturazione_immediata, termine_pagamento_id, modalita_pagamento_id): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  consumo_id                  vendite.attivita_consumi.id%TYPE,
                  consumo_uid                 vendite.attivita_consumi.uid%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  utility_id                  integer,
                  emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  competenza_dal              vendite.commesse_attivita.competenza_dal%TYPE,
                  competenza_al               vendite.commesse_attivita.competenza_al%TYPE,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  sorgente_uid                vendite.commesse_attivita.sorgente_uid%TYPE,
                  segment_key                 vendite.commesse_attivita.segment_key%TYPE,
                  articolo_id                 vendite.commesse_attivita.articolo_id%TYPE,
                  istanza_utility_id          vendite.commesse_attivita.istanza_utility_id%TYPE,
                  data_attivita               vendite.commesse_attivita.data_attivita%TYPE,
                  uom_id                      vendite.commesse_attivita.uom_id%TYPE,
                  quantita                    vendite.commesse_attivita.quantita%TYPE,
                  qta_operativa               vendite.commesse_attivita.qta_operativa%TYPE,
                  uom_operativa_id            vendite.commesse_attivita.uom_operativa_id%TYPE,
                  factor_to_base              vendite.commesse_attivita.factor_to_base%TYPE,
                  competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                  prezzo_snapshot             vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  prezzo_bloccato             vendite.commesse_attivita.prezzo_bloccato%TYPE,
                  pricing_mode                vendite.commesse_attivita.pricing_mode%TYPE,
                  tipo_movimento              vendite.commesse_attivita.tipo_movimento%TYPE,
                  valuta_id                   vendite.commesse_attivita.valuta_id%TYPE,
                  meta                        vendite.commesse_attivita.meta%TYPE,
                  tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        bigint,
                  modalita_pagamento_id       integer)
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-20 (20261020-89, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave e' ATTIVITA_CONSUMI:<uid>, composta da
              --   script.fn_segment_key (era CONS:<uid>). Firma e RETURNS ancorati.
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
              BEGIN
                -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente risolta
                -- per codice_interno (immutabile), non per codice (mutabile).
                -- rev 2026-07-27 (brief emissione mirata PARTE B, D-6): a differenza
                -- di ordini/contratti/DDT, qui fatturazione_immediata RESTA la
                -- costante FALSE. Non e' una dimenticanza: e' dominio. Un consumo
                -- e' una misura, la corsia la decide il contratto che lo governa.
                -- Guard: p_consumo_id, se specificato, deve essere > 0.
                IF p_consumo_id IS NOT NULL AND p_consumo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'fn_list_consumi_da_pushare',
                    'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_consumo_id', 'valore', p_consumo_id),
                    NULL::uuid,
                    'p_consumo_id', p_consumo_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'ATTIVITA_CONSUMI' AND s.attivo IS TRUE
                LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_consumi_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'ATTIVITA_CONSUMI'),
                    NULL::uuid,
                    'ATTIVITA_CONSUMI', 'config.sorgenti'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  ac.id, ac.uid,
                  ac.billing_account_id,
                  ba.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(ac.billing_account_id),
                  ac.periodo_dal, ac.periodo_al,
                  -- fatturazione_immediata: costante FALSE PER SCELTA DI DOMINIO
                  -- (D-6, 2026-07-27). I consumi seguono sempre la corsia
                  -- differita; la corsia immediata si ottiene marcando il
                  -- CONTRATTO che governa la fornitura, non la singola lettura.
                  -- NON sostituire con una colonna: vedi header del changeSet.
                  FALSE,
                  v_sorgente_tipo_id,
                  ac.uid::text,
                  script.fn_segment_key('ATTIVITA_CONSUMI', ac.uid::text),
                  NULL::uuid,
                  ba.istanza_utility_id,
                  COALESCE(ac.periodo_dal, ac.competenza_mese),
                  ac.uom_id,
                  ac.consumo_totale,
                  ac.consumo_totale,
                  ac.uom_id,
                  1::numeric,
                  ac.competenza_mese,
                  NULL::numeric,
                  -- prezzo_bloccato: FALSE per una ragione DIVERSA e non
                  -- correlata alla precedente — un consumo non porta prezzo
                  -- dalla sorgente (prezzo_snapshot NULL sopra), quindi non
                  -- c'e' nulla da bloccare: il prezzo lo risolve il pricing.
                  FALSE,
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  NULL::integer,
                  jsonb_build_object(
                    'consumo_uid',         ac.uid,
                    'stato_calcolo',       ac.stato_calcolo,
                    'periodo_dal',         ac.periodo_dal,
                    'periodo_al',          ac.periodo_al,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM vendite.attivita_consumi ac
                JOIN anagrafiche.billing_account ba ON ba.id = ac.billing_account_id
                WHERE ac.stato_calcolo = 'OK'
                  AND ac.fattura_id IS NULL
                  AND (p_competenza_mese IS NULL OR ac.competenza_mese = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR ac.billing_account_id = p_billing_account_id)
                  -- Estensione 2026-05: NULL = lista globale; NOT NULL = singolo consumo.
                  AND (p_consumo_id IS NULL OR ac.id = p_consumo_id)
                  -- Esclusione "gia' inviato" (rev 2026-10-12, 20261012-10): dal
                  -- classificatore unico, sul segmento che questa funzione scrive
                  -- ('CONS:<uid>', sopra). Il NOT EXISTS di prima cercava
                  -- 'CONS:<uid>:%', con i due punti finali che il segmento base non
                  -- ha: vedeva solo le righe del fan-out per componente
                  -- (':COMP:<x>', HandlerConsumi._expand_rows), che e' uno stub
                  -- RIMANDATO (Tid, 2026-06-16) e non ne scrive. ⚠️ Il giorno in cui
                  -- il fan-out si accende deve usare il suffisso '#CMP:' che il
                  -- classificatore vede (DEC-2), non ':COMP:'. Una riga ANNULLATA
                  -- non occupa (D-5).
                  AND script.fn_get_stato_push_segment(
                        script.fn_segment_key('ATTIVITA_CONSUMI', ac.uid::text)) = 'LIBERA'
                ORDER BY ac.competenza_mese, ac.id
                LIMIT p_limit;
              END
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_list_consumi_da_pushare(date,bigint,integer,bigint) IS
                'Lista consumi eligible al push su commessa (stato_calcolo OK, non fatturati). p_consumo_id (opzionale): NULL=lista globale batch, NOT NULL=singolo consumo. Tutti i filtri in AND. Esclude i consumi gia'' mandati in commessa (script.fn_get_stato_push_segment, dal 2026-10-12). rev 2026-06-28: sorgente per codice_interno (analisi-hardcoded-codice §3a). rev 2026-07-19: esclusione su ALLOCAZIONE (non piu'' solo emessi): il NOT EXISTS non filtra piu'' stato_emissione — brief-db-push-commessa-gia-inviato §4a. rev 2026-07-27: NESSUN cambio di comportamento — documentata come scelta di dominio (D-6) la costante FALSE su fatturazione_immediata: a differenza di ordini/contratti/DDT i consumi NON hanno il flag, perche'' un consumo e'' una misura e la corsia la decide il contratto che lo governa. Non sostituire con una colonna — brief-db-emissione-fattura-per-documento-sorgente PARTE B. Espone termine_pagamento_id e modalita_pagamento_id a NULL: i consumi non hanno un documento con condizioni di pagamento (rev 2026-08-03, T.1). rev 2026-10-12 (20261012-10, brief-db-annullo-a-valle-riapre-a-monte D-5): «gia'' mandato» dal classificatore unico script.fn_get_stato_push_segment(''CONS:<uid>'') invece del NOT EXISTS proprio, che cercava ''CONS:<uid>:%'' con due punti finali che il segmento scritto qui non ha, e quindi vedeva solo le righe del fan-out per componente '':COMP:<x>'' (stub rimandato, non ne scrive): il consumo gia'' mandato restava in lista, e all''idempotenza pensava solo l''ON CONFLICT dell''upsert nella stessa commessa. ⚠️ Quando il fan-out si accendera'' dovra'' usare il suffisso ''#CMP:'' che il classificatore vede. Una riga ANNULLATA non occupa: annullata la commessa, il consumo torna da mandare (D-7). rev 2026-10-13 (20261013-20): tipo_consumo RITIRATO in tutta la catena del push (madre, batch, cinque lister, builder pgTAP). Non aveva un lettore, e il vocabolario della madre (ACCONTO/CONGUAGLIO/STORNO) non lo produceva nessuna sorgente con un significato: preventivi, ordini e DDT scrivevano la costante CONGUAGLIO, contratti (l''erogazione della riga) e consumi (CONSUMO) un valore che la madre rifiutava, quindi il loro push falliva sempre (E_PARAMETRO_INVALIDO). L''erogazione resta dove gia'' stava, in meta.tipo_erogazione. Decisione A di Tid, 2026-10-13. Colonna tipo_consumo tolta dal RETURNS TABLE (DROP + CREATE). Rev 2026-10-20 (20261020-89, brief-db-grammatica-unica-documenti 2e, G-8): la chiave e'' ATTIVITA_CONSUMI:<uid>, composta da script.fn_segment_key (era CONS:<uid>).';

