# IL GUARD DEGLI INDIRIZZI ALL'EMISSIONE DELLA BOLLA: LO STATO DAL VOCABOLARIO
#   Brief: brief-db-stati-documento-dal-vocabolario §6.21, giro 6d (S-2,
#   Tid 2026-11-08; via di Tid del 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.trgfn_ddt_guard_indirizzi_obbligatori scattava sulla bolla con lo stato codice_interno = 'EMESSO'. E' lo
#   stato di emissione, che il vocabolario marca (colonna emissione); la
#   capability della bolla accende gli stessi motivi da li'.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   La SELECT legge la colonna emissione dello stato; il guard scatta sulla bolla nello stato di emissione. La variabile
#   del codice serviva solo a quel controllo ed esce. Con il seed la risposta
#   e' quella di prima.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma (trigger), INVOKER, nessun SET (pg_proc su
#   dbdev, 2026-11-14). Il montaggio non si tocca. Il COMMENT e' riscritto al
#   presente.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (il catalogo li scioglie). Il
#   rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-41-update-trgfn-ddt-guard-indirizzi-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261114-41-update-trgfn-ddt-guard-indirizzi-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_ddt_guard_indirizzi_obbligatori: lo stato di emissione dalla colonna emissione del vocabolario, non dal codice
        EMESSO. Brief: brief-db-stati-documento-dal-vocabolario, giro 6d.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_indirizzi_obbligatori()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-20 (20261020-60, brief-db-grammatica-unica-documenti, 2d G-6):
              --   l'ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della
              --   sorgente.
              -- Scopo: bloccare l'emissione (EMESSO) di un DDT privo degli
              --   indirizzi marcati obbligatori per l'ambito DDT, o con un
              --   indirizzo d'anagrafica che non e' del suo cliente.
              --   rev 2026-07-19: valutazione delegata a
              --   script.fn_check_ddt_emittibile — single source con la capability.
              --   rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente,
              --   D-3): + E_INDIRIZZO_DOC_NON_DEL_CLIENTE (punto 4-bis della check).
              -- ⚠️ v_motivi e v_motivo nudi: l'array dei motivi di una check e un
              --   suo elemento, jsonb senza colonna da ancorare.
              DECLARE
                  -- La bolla e' nello stato di emissione? Dal vocabolario.
                  v_emissione    config.stati_doc_ddt.emissione%TYPE;
                  v_motivi       jsonb;
                  v_motivo       jsonb;
                  v_mancanti     text[];
              BEGIN
                  SELECT sdd.emissione INTO v_emissione
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;

                  -- rev 2026-11-14 (giro 6d): lo stato di emissione, la colonna del
                  -- vocabolario. Uno stato che non si legge non e' l'emissione.
                  IF v_emissione IS NOT TRUE THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_ddt_emittibile(NEW);

                  -- 1. Indirizzi obbligatori mancanti.
                  SELECT m INTO v_motivo
                    FROM jsonb_array_elements(v_motivi) AS m
                   WHERE m->>'codice' = 'E_INDIRIZZO_DOC_OBBLIGATORIO'
                   LIMIT 1;

                  IF v_motivo IS NOT NULL THEN
                      SELECT array_agg(x) INTO v_mancanti
                        FROM jsonb_array_elements_text(v_motivo->'dettaglio'->'mancanti') AS x;

                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_INDIRIZZO_DOC_OBBLIGATORIO',
                          jsonb_build_object(
                              'ddt_id',   NEW.id,
                              'numero',   NEW.numero,
                              'ambito',   'DDT_VENDITA',
                              'mancanti', v_mancanti),
                          NEW.tx_id,
                          'DDT',
                          NEW.id::text,
                          array_to_string(v_mancanti, ', ')
                      );
                  END IF;

                  -- 2. Un indirizzo d'anagrafica che non e' del cliente della bolla
                  --    (rev 2026-10-11). La frase: il tipo leggibile, dal motivo.
                  v_motivo := NULL;
                  SELECT m INTO v_motivo
                    FROM jsonb_array_elements(v_motivi) AS m
                   WHERE m->>'codice' = 'E_INDIRIZZO_DOC_NON_DEL_CLIENTE'
                   LIMIT 1;

                  IF v_motivo IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_INDIRIZZO_DOC_NON_DEL_CLIENTE',
                          jsonb_build_object(
                              'campo',  'tipo_indirizzo_id',
                              'ddt_id', NEW.id,
                              'numero', NEW.numero,
                              'tipi',   v_motivo->'dettaglio'->'tipi'),
                          NEW.tx_id,
                          v_motivo->'valori'->>0
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_indirizzi_obbligatori()
              IS 'Il guard degli indirizzi all''emissione della bolla: quando la bolla e'' nello stato di emissione (la colonna emissione di config.stati_doc_ddt) solleva i motivi degli indirizzi di script.fn_check_ddt_emittibile, la stessa check della capability, chiamata una volta per i due rami: prima gli indirizzi obbligatori per l''ambito DDT_VENDITA che mancano (E_INDIRIZZO_DOC_OBBLIGATORIO), poi un indirizzo d''anagrafica che non e'' del cliente (E_INDIRIZZO_DOC_NON_DEL_CLIENTE, campo tipo_indirizzo_id, valore il tipo leggibile dal motivo).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_indirizzi_obbligatori()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-20 (20261020-60, brief-db-grammatica-unica-documenti, 2d G-6):
              --   l'ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della
              --   sorgente.
              -- Scopo: bloccare l'emissione (EMESSO) di un DDT privo degli
              --   indirizzi marcati obbligatori per l'ambito DDT, o con un
              --   indirizzo d'anagrafica che non e' del suo cliente.
              --   rev 2026-07-19: valutazione delegata a
              --   script.fn_check_ddt_emittibile — single source con la capability.
              --   rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente,
              --   D-3): + E_INDIRIZZO_DOC_NON_DEL_CLIENTE (punto 4-bis della check).
              -- ⚠️ v_motivi e v_motivo nudi: l'array dei motivi di una check e un
              --   suo elemento, jsonb senza colonna da ancorare.
              DECLARE
                  v_stato_codice config.stati_doc_ddt.codice_interno%TYPE;
                  v_motivi       jsonb;
                  v_motivo       jsonb;
                  v_mancanti     text[];
              BEGIN
                  SELECT sdd.codice_interno INTO v_stato_codice
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;

                  IF v_stato_codice IS DISTINCT FROM 'EMESSO' THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_ddt_emittibile(NEW);

                  -- 1. Indirizzi obbligatori mancanti.
                  SELECT m INTO v_motivo
                    FROM jsonb_array_elements(v_motivi) AS m
                   WHERE m->>'codice' = 'E_INDIRIZZO_DOC_OBBLIGATORIO'
                   LIMIT 1;

                  IF v_motivo IS NOT NULL THEN
                      SELECT array_agg(x) INTO v_mancanti
                        FROM jsonb_array_elements_text(v_motivo->'dettaglio'->'mancanti') AS x;

                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_INDIRIZZO_DOC_OBBLIGATORIO',
                          jsonb_build_object(
                              'ddt_id',   NEW.id,
                              'numero',   NEW.numero,
                              'ambito',   'DDT_VENDITA',
                              'mancanti', v_mancanti),
                          NEW.tx_id,
                          'DDT',
                          NEW.id::text,
                          array_to_string(v_mancanti, ', ')
                      );
                  END IF;

                  -- 2. Un indirizzo d'anagrafica che non e' del cliente della bolla
                  --    (rev 2026-10-11). La frase: il tipo leggibile, dal motivo.
                  v_motivo := NULL;
                  SELECT m INTO v_motivo
                    FROM jsonb_array_elements(v_motivi) AS m
                   WHERE m->>'codice' = 'E_INDIRIZZO_DOC_NON_DEL_CLIENTE'
                   LIMIT 1;

                  IF v_motivo IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME, 'E_INDIRIZZO_DOC_NON_DEL_CLIENTE',
                          jsonb_build_object(
                              'campo',  'tipo_indirizzo_id',
                              'ddt_id', NEW.id,
                              'numero', NEW.numero,
                              'tipi',   v_motivo->'dettaglio'->'tipi'),
                          NEW.tx_id,
                          v_motivo->'valori'->>0
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_indirizzi_obbligatori()
              IS 'Blocca l''emissione (EMESSO) di un DDT privo degli indirizzi marcati obbligatori per l''ambito DDT (E_INDIRIZZO_DOC_OBBLIGATORIO). rev 2026-07-19: valutazione delegata a script.fn_check_ddt_emittibile (single source con fn_available_actions_ddt); codice errore e argomenti invariati. rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente, D-3 di Tid): e'' il guard degli INDIRIZZI all''emissione, e solleva anche il punto 4-bis della check, E_INDIRIZZO_DOC_NON_DEL_CLIENTE (campo tipo_indirizzo_id, valore: il tipo leggibile dal motivo), dopo i mancanti come nella check. La check si chiama una volta per i due rami. Rev 2026-10-20 (20261020-60, brief-db-grammatica-unica-documenti 2d, G-6): l''ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della sorgente.';
