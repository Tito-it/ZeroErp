# SI RITIRANO LE SETTE COPIE DEL GUARD EMITTENTE <-> BA
#   vendite.trgfn_{preventivi,offerte_commerciali,contratti,ordini,ddt,resi,
#   commesse}_guard_emittente_ba: la regola la dice il BB
#   script.trgfn_doc_guard_emittente_ba (20261010-17), su cui i trigger sono
#   stati rimontati (20261010-18). Regola del 2: le copie si ritirano nello
#   stesso giro dell'estrazione.
#   Brief: brief-db-guard-emittente-ba-unico (§3)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261010-19-drop-sette-trgfn-guard-emittente-ba-mctit.yaml

  - changeSet:
      id: 20261010-19-drop-sette-trgfn-guard-emittente-ba
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Ritiro delle sette funzioni guard emittente <-> BA: le sostituisce il BB
        script.trgfn_doc_guard_emittente_ba. Brief: brief-db-guard-emittente-ba-unico.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*)
                FROM pg_trigger t
                JOIN pg_proc p ON p.oid = t.tgfoid
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname IN ('trgfn_preventivi_guard_emittente_ba',
                                   'trgfn_offerte_commerciali_guard_emittente_ba',
                                   'trgfn_contratti_guard_emittente_ba',
                                   'trgfn_ordini_guard_emittente_ba',
                                   'trgfn_ddt_guard_emittente_ba',
                                   'trgfn_resi_guard_emittente_ba',
                                   'trgfn_commesse_guard_emittente_ba');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.trgfn_preventivi_guard_emittente_ba();
              DROP FUNCTION IF EXISTS vendite.trgfn_offerte_commerciali_guard_emittente_ba();
              DROP FUNCTION IF EXISTS vendite.trgfn_contratti_guard_emittente_ba();
              DROP FUNCTION IF EXISTS vendite.trgfn_ordini_guard_emittente_ba();
              DROP FUNCTION IF EXISTS vendite.trgfn_ddt_guard_emittente_ba();
              DROP FUNCTION IF EXISTS vendite.trgfn_resi_guard_emittente_ba();
              DROP FUNCTION IF EXISTS vendite.trgfn_commesse_guard_emittente_ba();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I corpi sono nella doc auto-gen del 2026-10-10: si rimettono a
              -- mano se serve tornare indietro.
              SELECT 1;
