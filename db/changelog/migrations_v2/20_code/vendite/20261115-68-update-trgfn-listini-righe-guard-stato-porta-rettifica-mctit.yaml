# IL GUARD DELLE RIGHE DI LISTINO: SOLO IN BOZZA, E LA PORTA DELLA RETTIFICA
#   Brief: brief-db-stati-documento-dal-vocabolario §6.28, giro 6f-ter (R-L1 del
#   BE/FE; Tid, 2026-11-15).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   Il guard non sapeva riconoscere la rettifica controllata, e per lasciarla
#   passare lasciava passare ogni scrittura di una riga ATTIVA non propagata
#   (il §6.28 del brief).
#
# ── LA CORREZIONE ──────────────────────────────────────────────────
#   Fuori dalla porta: il primo motivo di script.fn_check_listino_riga_scrivibile,
#   che dal 20261115-65 dice «solo in bozza». Dentro la porta del verbo
#   vendite.fn_rettifica_riga_listino (-67: GUC zeroerp.listino_riga_rettifica =
#   id della riga, col proprietario della tabella) un UPDATE che cambia solo
#   prezzo e meta solleva il primo motivo di
#   script.fn_check_listino_riga_rettificabile (-66). Una porta aperta che
#   cambia altro ricade sulla regola di sempre. La forma della porta e' quella
#   di valido_al in vendite.trgfn_listini_versioni_guard_per_stato.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, INVOKER, nessun SET. Il montaggio non
#   cambia (20261115-55). Il rollback porta il corpo e il COMMENT del
#   20261115-54.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-68-update-trgfn-listini-righe-guard-stato-porta-rettifica-mctit.yaml

  - changeSet:
      id: 20261115-68-update-trgfn-listini-righe-guard-stato-porta-rettifica
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_righe_guard_stato: le righe solo in bozza; dalla porta del verbo della rettifica, il
        solo prezzo e meta. Brief: brief-db-stati-documento-dal-vocabolario, giro 6f-ter.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le righe di listino secondo lo stato della versione (BEFORE
              --   INSERT, UPDATE e DELETE). Si scrivono solo in bozza
              --   (script.fn_check_listino_riga_scrivibile, la stessa che dicono le
              --   superfici). L'unica eccezione e' la rettifica del prezzo, dalla
              --   porta del verbo vendite.fn_rettifica_riga_listino: li' risponde
              --   script.fn_check_listino_riga_rettificabile. Qui si solleva soltanto
              --   il primo motivo.
              DECLARE
                  -- Nomi di colonna della tabella: la rettifica cambia prezzo e meta,
                  --   le altre tre le scrivono i trigger generati.
                  v_rettifica text[] := ARRAY['prezzo', 'meta', 'data_update', 'user_update', 'tx_id'];
              BEGIN
                  -- La porta della rettifica: per QUESTA riga, dal proprietario della
                  -- tabella (il verbo e' SECURITY DEFINER), e solo prezzo e meta.
                  IF TG_OP = 'UPDATE'
                     AND COALESCE(current_setting('zeroerp.listino_riga_rettifica', true), '') = OLD.id::text
                     AND script.fn_is_proprietario_tabella(TG_RELID)
                     AND (to_jsonb(NEW) - v_rettifica) = (to_jsonb(OLD) - v_rettifica) THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', TG_NAME::text,
                          script.fn_check_listino_riga_rettificabile(OLD.id),
                          'prezzo',
                          OLD.tx_id,
                          jsonb_build_object('operazione', 'RETTIFICA', 'tabella', 'listini_righe'));
                      RETURN NEW;
                  END IF;

                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      script.fn_check_listino_riga_scrivibile(
                          CASE WHEN TG_OP = 'INSERT' THEN NEW.listino_versione_id ELSE OLD.listino_versione_id END,
                          CASE WHEN TG_OP = 'INSERT' THEN NULL ELSE OLD.id END,
                          TG_OP),
                      NULL,
                      CASE WHEN TG_OP = 'INSERT' THEN NEW.tx_id ELSE OLD.tx_id END,
                      jsonb_build_object('operazione', TG_OP, 'tabella', 'listini_righe'));

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato()
              IS 'Guard sulle righe di listino (BEFORE INSERT, UPDATE e DELETE, trg_listini_righe_a10_guard_stato_ins_upd_dlt): le righe si scrivono solo in bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni. Solleva il primo motivo di script.fn_check_listino_riga_scrivibile, la regola che dicono anche le superfici vendite.vw_listini_versioni_azioni (la riga nuova, la variazione) e vendite.vw_listini_righe_azioni (la riga che c''e''): CHIUSA E_RIGA_LISTINO_VERSIONE_CHIUSA, fuori dalla bozza E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA. Una sola eccezione, la rettifica: con la GUC transazionale zeroerp.listino_riga_rettifica = id della riga e il proprietario della tabella (script.fn_is_proprietario_tabella), un UPDATE che cambia il solo prezzo e meta solleva invece il primo motivo di script.fn_check_listino_riga_rettificabile (in bozza, CHIUSA, non in vigore, propagata). La porta l''apre solo il verbo vendite.fn_rettifica_riga_listino, che chiede il motivo e scrive la traccia. E'' il verbo delle azioni AGGIUNGI_RIGA_LISTINO, MODIFICA_RIGA_LISTINO e VARIA_PREZZI_LISTINO nel registro config.azioni_riga: quelle scritture sono dirette, e chi rifiuta e'' questo guard.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le righe di listino secondo lo stato della versione (BEFORE
              --   INSERT, UPDATE e DELETE). La regola sta in
              --   script.fn_check_listino_riga_scrivibile, la stessa che dicono le
              --   superfici (la riga nuova in vendite.vw_listini_versioni_azioni, la
              --   riga che c'e' in vendite.vw_listini_righe_azioni): qui si solleva
              --   soltanto il primo motivo.
              BEGIN
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      script.fn_check_listino_riga_scrivibile(
                          CASE WHEN TG_OP = 'INSERT' THEN NEW.listino_versione_id ELSE OLD.listino_versione_id END,
                          CASE WHEN TG_OP = 'INSERT' THEN NULL ELSE OLD.id END,
                          TG_OP),
                      NULL,
                      CASE WHEN TG_OP = 'INSERT' THEN NEW.tx_id ELSE OLD.tx_id END,
                      jsonb_build_object('operazione', TG_OP, 'tabella', 'listini_righe'));

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato()
              IS 'Guard sulle righe di listino (BEFORE INSERT, UPDATE e DELETE, trg_listini_righe_a10_guard_stato_ins_upd_dlt): solleva il primo motivo di script.fn_check_listino_riga_scrivibile, la regola che dicono anche le superfici vendite.vw_listini_versioni_azioni (la riga nuova) e vendite.vw_listini_righe_azioni (la riga che c''e''). In bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni, passa tutto; in una versione CHIUSA niente, nemmeno una riga nuova (E_RIGA_LISTINO_VERSIONE_CHIUSA); fuori dalla bozza una riga nuova e'' una rettifica e passa, una riga che c''e'' passa finche'' il suo prezzo non e'' stato usato da un documento (E_RIGA_LISTINO_PROPAGATA). Per cambiare il prezzo di una riga propagata si fa una versione nuova del listino. E'' il verbo delle azioni AGGIUNGI_RIGA_LISTINO e MODIFICA_RIGA_LISTINO nel registro config.azioni_riga: le righe di listino si scrivono direttamente, e chi rifiuta e'' questo guard.';
