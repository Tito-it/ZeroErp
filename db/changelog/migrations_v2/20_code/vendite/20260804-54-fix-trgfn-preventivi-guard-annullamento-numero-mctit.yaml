# Bonifica riferimenti morti — F5, 🔴 difetto nato oggi
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
# ── UN GUARD APPENA SCRITTO, GIA' ROTTO ──────────────────────────────────
#   `vendite.trgfn_preventivi_guard_annullamento` e' stata creata **oggi**
#   da `20260804-35`, dal cantiere *vie d'uscita operatore*. Usa
#   `NEW.codice`, che su `vendite.preventivi` non esiste: le colonne sono
#   `numero` (varchar, l'identificativo leggibile), `uid` (uuid, la chiave
#   delle catene documentali) e `rev`.
#
#   ⚠️ Il difetto e' nel ramo che **solleva**: quando il preventivo e'
#   annullabile la funzione esce prima e non tocca mai quella riga. Si
#   manifesta solo quando l'annullamento va rifiutato — cioe' quando il
#   guard deve fare il suo mestiere — e al posto del codice di dominio
#   arriva «il record "new" non ha un campo "codice"».
#   Un pgTAP che asserisse solo «solleva» lo vedrebbe verde.
#
#   E' la prova che il presidio serve **prima** che un cantiere si chiuda,
#   non sei mesi dopo: qui la distanza fra l'introduzione del difetto e la
#   sua scoperta e' stata di poche ore, e solo perche' il controllo e' stato
#   scritto lo stesso giorno.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260804-54-fix-trgfn-preventivi-guard-annullamento-numero-mctit.yaml

  - changeSet:
      id: 20260804-54-fix-trgfn-preventivi-guard-annullamento-numero
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F5 — vendite.trgfn_preventivi_guard_annullamento (creata oggi da
        20260804-35): NEW.codice non e' una colonna di vendite.preventivi,
        l'identificativo leggibile e' numero. Il ramo colpito e' quello che
        solleva, quindi il difetto si vede solo quando il guard deve bloccare.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_preventivi_guard_annullamento()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: impedire l'annullamento di un preventivo che ha gia'
              --   prodotto qualcosa a valle (un ordine generato, o l'ingresso
              --   in una commessa). La regola vive in
              --   script.fn_check_preventivo_annullabile, la stessa letta da
              --   fn_available_actions_preventivo per accendere il bottone:
              --   qui si solleva soltanto, col codice del PRIMO motivo.
              --   Brief: brief-db-vie-uscita-operatore §3.1.
              --
              -- rev 2026-08-04 (bonifica riferimenti morti, F5): `NEW.codice` non e' una
              --   colonna di vendite.preventivi. L'identificativo leggibile e' `numero`
              --   (varchar); ci sono anche `uid` (uuid, la chiave usata dalle catene
              --   documentali) e `rev`. Il refuso e' nato con la funzione, tre changeSet
              --   fa, ed e' arrivato al controllo lo stesso giorno.
              DECLARE
                  v_codice_a config.stati_doc_preventivi.codice_interno%TYPE;
                  v_motivi   jsonb;
              BEGIN
                  -- No-op se lo stato non cambia davvero.
                  IF NEW.stato_doc_preventivo_id IS NOT DISTINCT FROM OLD.stato_doc_preventivo_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT sdp.codice_interno
                    INTO v_codice_a
                    FROM config.stati_doc_preventivi sdp
                   WHERE sdp.id = NEW.stato_doc_preventivo_id;

                  IF v_codice_a IS DISTINCT FROM 'ANNULLATO' THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_preventivo_annullabile(NEW.id);

                  IF jsonb_array_length(v_motivi) > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          v_motivi -> 0 ->> 'codice',
                          jsonb_build_object(
                              'preventivo_id', NEW.id,
                              'numero',        NEW.numero,
                              'stato_a',       v_codice_a,
                              'motivi',        v_motivi
                          ),
                          NEW.tx_id,
                          coalesce(NEW.numero, NEW.id::text),
                          coalesce(v_motivi -> 0 ->> 'dettaglio', '0')
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 1;
