# fn_offerta_righe_espanse (db-brief-offerta-righe-espanse): espande un'offerta
# commerciale in righe EFFETTIVE ordine-ready (listino base + variazione globale
# + eccezioni), pronte per la conversione offerta -> ordine.
#
# Riusa il core condiviso vendite.fn_espandi_listino_versione (20260604-02) per
# la parte listino+BoM; applica l'overlay eccezioni su
# offerte_commerciali_eccezioni (mirror di contratti_righe).
#
# Differenze rispetto a fn_contratto_righe_preview (che serve il DRAWER):
#   - output ORDINE-READY: include iva_id (da articolo), sconto_perc,
#     uom_operativa_id/qta_operativa/factor_to_base mappati su ordini_righe;
#   - le righe ESCLUSIONE sono RIMOSSE (non si copiano in ordine), non mostrate;
#   - quantita default 1 per le righe da-listino senza eccezione (decisione brief);
#   - niente ramo "listino NULL": offerte_commerciali.listino_id e' NOT NULL.
# Read-only / STABLE: stato-agnostica (il guard ACCETTATA sta nella conversione BE).
#
# NB iva: si restituisce SOLO iva_id (da catalogo.articoli.iva_id). La percentuale
# (iva_perc) NON e' in output: ordini_righe NON ha la colonna iva_perc (allineata a
# preventivi_righe/fatture_righe; l'aliquota si deriva da iva_id via config.iva).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260604-04-create-fn-offerta-righe-espanse-mctit.yaml

  - changeSet:
      id: 20260604-04-create-fn-offerta-righe-espanse
      author: mctit
      # runOnChange:false — definizione INTERMEDIA (pre-rename sconto_perc).
      # Gira una volta sul 1o apply (schema vecchio); NON deve ri-spararsi
      # sul ci-apply (2o apply) contro lo schema gia' rinominato a
      # sconto_percentuale. La definizione canonica post-rename e'
      # 20260605-17 (runOnChange:true).
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        fn_offerta_righe_espanse: righe effettive ordine-ready dell'offerta
        (listino + variazione + eccezioni), per conversione offerta->ordine.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname='vendite' AND p.proname='fn_espandi_listino_versione';
            - tableExists: { schemaName: vendite, tableName: offerte_commerciali_eccezioni }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_offerta_righe_espanse(bigint);

              CREATE FUNCTION vendite.fn_offerta_righe_espanse(
                  p_offerta_id vendite.offerte_commerciali.id%TYPE
              )
              RETURNS TABLE (
                  articolo_id          catalogo.articoli.id%TYPE,
                  articolo_codice      catalogo.articoli.codice%TYPE,
                  descrizione          catalogo.articoli.descrizione%TYPE,
                  is_composito         catalogo.articoli.is_composito%TYPE,
                  quantita             vendite.ordini_righe.quantita%TYPE,
                  uom_operativa_id     vendite.ordini_righe.uom_operativa_id%TYPE,
                  qta_operativa        vendite.ordini_righe.qta_operativa%TYPE,
                  factor_to_base       vendite.ordini_righe.factor_to_base%TYPE,
                  prezzo_unitario      vendite.ordini_righe.prezzo_unitario%TYPE,
                  sconto_perc          vendite.ordini_righe.sconto_perc%TYPE,
                  iva_id               vendite.ordini_righe.iva_id%TYPE,
                  tipo_eccezione       vendite.tipo_eccezione_contratto,
                  origine              varchar,
                  componenti           jsonb
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo: righe effettive ordine-ready di un'offerta (listino + variazione
              --   globale + eccezioni). Parte 1 dal core fn_espandi_listino_versione +
              --   overlay OVERRIDE (ESCLUSIONE rimossa); Parte 2 AGGIUNTA standalone+bundle.
              --   iva_id risolta dall'articolo (listino non porta iva; iva_perc non esiste
              --   su ordini_righe: la percentuale si deriva da iva_id). sconto NULL: lo
              --   sconto e' espresso come prezzo override (prezzo_unitario = prezzo netto).
              --   quantita default 1 per righe da-listino senza eccezione.
              DECLARE
                  v_listino_id          vendite.offerte_commerciali.listino_id%TYPE;
                  v_listino_versione_id vendite.offerte_commerciali.listino_versione_id%TYPE;
                  v_tipo_var            vendite.offerte_commerciali.tipo_variazione_globale%TYPE;
                  v_valore_var          vendite.offerte_commerciali.valore_variazione_globale%TYPE;
              BEGIN
                  SELECT o.listino_id, o.listino_versione_id,
                         o.tipo_variazione_globale, o.valore_variazione_globale
                    INTO v_listino_id, v_listino_versione_id, v_tipo_var, v_valore_var
                    FROM vendite.offerte_commerciali o
                   WHERE o.id = p_offerta_id;

                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  -- Versione operativa se snapshot non fissato (offerta BOZZA).
                  -- listino_id e' NOT NULL: niente ramo "senza listino".
                  IF v_listino_versione_id IS NULL THEN
                      SELECT lv.id
                        INTO v_listino_versione_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.listino_id = v_listino_id
                         AND lv.attivo     = TRUE
                         AND lv.stato      IN ('ATTIVA', 'CHIUSA')
                         AND lv.validita  @> CURRENT_DATE
                       ORDER BY (lv.stato = 'ATTIVA') DESC
                       LIMIT 1;
                  END IF;

                  -- PARTE 1: righe dal listino (core) + overlay OVERRIDE; ESCLUSIONE rimossa.
                  RETURN QUERY
                  SELECT
                      base.articolo_id,
                      base.articolo_codice,
                      base.articolo_descrizione,
                      base.is_composito,
                      COALESCE(ecc.quantita, 1)::numeric,
                      COALESCE(ecc.uom_operativa_id, base.uom_id),
                      COALESCE(ecc.qta_operativa, COALESCE(ecc.quantita, 1))::numeric,
                      COALESCE(ecc.factor_to_base, 1)::numeric,
                      CASE
                          WHEN ecc.tipo_eccezione = 'OVERRIDE' THEN ecc.prezzo_unitario
                          ELSE                                      base.prezzo_da_listino
                      END,
                      NULL::numeric,
                      a.iva_id::integer,
                      ecc.tipo_eccezione,
                      CASE
                          WHEN ecc.tipo_eccezione = 'OVERRIDE' THEN 'OVERRIDE'
                          ELSE                                      'DA_LISTINO'
                      END::varchar,
                      base.componenti
                    FROM vendite.fn_espandi_listino_versione(
                             v_listino_versione_id, v_tipo_var, v_valore_var
                         ) base
                    JOIN catalogo.articoli a ON a.id = base.articolo_id
                    LEFT JOIN vendite.offerte_commerciali_eccezioni ecc
                           ON ecc.offerta_id            = p_offerta_id
                          AND ecc.articolo_id           = base.articolo_id
                          AND ecc.tipo_eccezione        IN (
                                  'OVERRIDE'::vendite.tipo_eccezione_contratto,
                                  'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                              )
                          AND COALESCE(ecc.attivo, TRUE) = TRUE
                   WHERE ecc.tipo_eccezione IS DISTINCT FROM 'ESCLUSIONE'::vendite.tipo_eccezione_contratto;

                  -- PARTE 2a: AGGIUNTA standalone (articolo non a listino).
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, FALSE,
                      COALESCE(ecc.quantita, 1)::numeric,
                      COALESCE(ecc.uom_operativa_id, a.uom_id),
                      COALESCE(ecc.qta_operativa, COALESCE(ecc.quantita, 1))::numeric,
                      COALESCE(ecc.factor_to_base, 1)::numeric,
                      ecc.prezzo_unitario,
                      NULL::numeric,
                      a.iva_id::integer,
                      ecc.tipo_eccezione,
                      'AGGIUNTA'::varchar,
                      NULL::jsonb
                    FROM vendite.offerte_commerciali_eccezioni ecc
                    JOIN catalogo.articoli a
                      ON a.id = ecc.articolo_id AND a.is_composito = FALSE AND a.attivo = TRUE
                   WHERE ecc.offerta_id           = p_offerta_id
                     AND ecc.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(ecc.attivo, TRUE) = TRUE;

                  -- PARTE 2b: AGGIUNTA bundle. Componenti da offerte_commerciali_eccezioni_componenti.
                  RETURN QUERY
                  SELECT
                      a.id, a.codice, a.descrizione, TRUE,
                      COALESCE(ecc.quantita, 1)::numeric,
                      COALESCE(ecc.uom_operativa_id, a.uom_id),
                      COALESCE(ecc.qta_operativa, COALESCE(ecc.quantita, 1))::numeric,
                      COALESCE(ecc.factor_to_base, 1)::numeric,
                      ecc.prezzo_unitario,
                      NULL::numeric,
                      a.iva_id::integer,
                      ecc.tipo_eccezione,
                      'AGGIUNTA'::varchar,
                      (
                          SELECT jsonb_agg(jsonb_build_object(
                              'articolo_componente_id', oecc_c.articolo_componente_id,
                              'componente_id',          af.id,
                              'componente_codice',      af.codice,
                              'componente_descrizione', af.descrizione,
                              'uom_id',                 af.uom_id,
                              'uom_codice',             umf.codice,
                              'coeff_qta',              oecc_c.coeff_qta_snapshot,
                              'prezzo',                 oecc_c.prezzo_unitario,
                              'qta_operativa',          oecc_c.qta_operativa,
                              'uom_operativa_id',       oecc_c.uom_operativa_id,
                              'factor_to_base',         oecc_c.factor_to_base
                          ) ORDER BY oecc_c.ordine, oecc_c.id)
                            FROM vendite.offerte_commerciali_eccezioni_componenti oecc_c
                            JOIN catalogo.articoli af ON af.id = oecc_c.componente_id
                            JOIN catalogo.unita_misura umf ON umf.id = af.uom_id
                           WHERE oecc_c.eccezione_offerta_id = ecc.id
                             AND oecc_c.attivo               = TRUE
                      )
                    FROM vendite.offerte_commerciali_eccezioni ecc
                    JOIN catalogo.articoli a
                      ON a.id = ecc.articolo_id AND a.is_composito = TRUE AND a.attivo = TRUE
                   WHERE ecc.offerta_id           = p_offerta_id
                     AND ecc.tipo_eccezione        = 'AGGIUNTA'::vendite.tipo_eccezione_contratto
                     AND COALESCE(ecc.attivo, TRUE) = TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_offerta_righe_espanse(bigint) IS
                  'Righe effettive ordine-ready di un''offerta (listino + variazione globale + '
                  'eccezioni) per la conversione offerta->ordine. Parte 1 dal core '
                  'fn_espandi_listino_versione + overlay OVERRIDE (ESCLUSIONE rimossa); Parte 2 '
                  'AGGIUNTA standalone+bundle. iva_id da articolo (iva_perc non esiste su '
                  'ordini_righe: si deriva da iva_id); sconto NULL (prezzo gia'' netto); '
                  'quantita default 1 per righe da-listino. listino_id NOT NULL: nessun ramo senza listino.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_offerta_righe_espanse(bigint);
