databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260510-04-update-fn-list-ddt-da-pushare-add-p-ddt-id-mctit.yaml

  - changeSet:
      id: 20260510-04-update-fn-list-ddt-da-pushare-add-p-ddt-id
      author: mctit
      runOnChange: false
      comment: "Estensione 2026-05 (coordinata): aggiunge p_ddt_id (opzionale) per uniformare la signature a fn_list_preventivi_da_pushare. Obbligatoria per non rompere il batch globale quando fetch_pushable_rows passa 4 args posizionali."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              DROP FUNCTION IF EXISTS vendite.fn_list_ddt_da_pushare(date, bigint, integer);

              -- Estensione 2026-05: p_ddt_id (opzionale) per uniformare signature batch.
              -- NULL = comportamento lista globale del batch orchestrator.
              CREATE OR REPLACE FUNCTION vendite.fn_list_ddt_da_pushare(
                p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL,
                p_billing_account_id anagrafiche.billing_account.id%TYPE           DEFAULT NULL,
                p_limit              integer                                        DEFAULT NULL,
                p_ddt_id             vendite.ddt.id%TYPE                           DEFAULT NULL
              )
              RETURNS TABLE(
                ddt_id                       vendite.ddt.id%TYPE,
                ddt_uid                      vendite.ddt.uid%TYPE,
                riga_id                      vendite.ddt_righe.id%TYPE,
                billing_account_id           anagrafiche.billing_account.id%TYPE,
                utility_id                   anagrafiche.billing_account.utility_id%TYPE,
                emittente_soggetto_ruolo_id  vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                competenza_dal               vendite.commesse.competenza_dal%TYPE,
                competenza_al                vendite.commesse.competenza_al%TYPE,
                fatturazione_immediata       vendite.commesse.fatturazione_immediata%TYPE,
                sorgente_tipo_id             config.sorgenti.id%TYPE,
                sorgente_uid                 vendite.commesse_attivita.sorgente_uid%TYPE,
                segment_key                  vendite.commesse_attivita.segment_key%TYPE,
                articolo_id                  vendite.commesse_attivita.articolo_id%TYPE,
                istanza_utility_id           vendite.commesse_attivita.istanza_utility_id%TYPE,
                data_attivita                vendite.commesse_attivita.data_attivita%TYPE,
                uom_id                       vendite.commesse_attivita.uom_id%TYPE,
                quantita                     vendite.commesse_attivita.quantita%TYPE,
                qta_operativa                vendite.commesse_attivita.qta_operativa%TYPE,
                uom_operativa_id             vendite.commesse_attivita.uom_operativa_id%TYPE,
                factor_to_base               vendite.commesse_attivita.factor_to_base%TYPE,
                competenza_mese              vendite.commesse_attivita.competenza_mese%TYPE,
                prezzo_snapshot              vendite.commesse_attivita.prezzo_snapshot%TYPE,
                prezzo_bloccato              vendite.commesse_attivita.prezzo_bloccato%TYPE,
                pricing_mode                 vendite.commesse_attivita.pricing_mode%TYPE,
                tipo_movimento               varchar,
                tipo_consumo                 varchar,
                valuta_id                    vendite.commesse_attivita.valuta_id%TYPE,
                meta                         vendite.commesse_attivita.meta%TYPE,
                tipo_doc_fiscale_id          config.tipi_doc_fiscale.id%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
              BEGIN
                -- Guard: p_ddt_id, se specificato, deve essere > 0.
                IF p_ddt_id IS NOT NULL AND p_ddt_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'fn_list_ddt_da_pushare',
                    'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_ddt_id', 'valore', p_ddt_id),
                    NULL::uuid,
                    'p_ddt_id', p_ddt_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice = 'DDT_VENDITA' AND s.attivo IS TRUE
                LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_ddt_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'DDT_VENDITA'),
                    NULL::uuid,
                    'DDT_VENDITA', 'config.sorgenti'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  d.id, d.uid, dr.id,
                  COALESCE(d.billing_account_id, src.src_billing_account_id),
                  ba.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(COALESCE(d.billing_account_id, src.src_billing_account_id)),
                  d.data, d.data,
                  FALSE,
                  v_sorgente_tipo_id,
                  d.uid::text,
                  ('DDT:' || d.uid::text || ':R:' || dr.id::text)::varchar,
                  dr.articolo_id,
                  ba.istanza_utility_id,
                  d.data,
                  NULL::bigint,
                  dr.quantita,
                  dr.qta_operativa,
                  dr.uom_operativa_id,
                  COALESCE(dr.factor_to_base, 1::numeric),
                  date_trunc('month', d.data)::date,
                  COALESCE(dr.prezzo_unitario, src.src_prezzo_unitario),
                  (COALESCE(dr.prezzo_unitario, src.src_prezzo_unitario) IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  'CONGUAGLIO'::varchar,
                  COALESCE(d.valuta_id, src.src_valuta_id),
                  jsonb_build_object(
                    'ddt_numero',              d.numero,
                    'ddt_anno',                d.anno,
                    'ddt_serie',               d.serie,
                    'ordine_sorgente_uid',     src.src_ordine_uid,
                    'ordine_fatturaz_trg',     src.src_fatturazione_trigger,
                    'tipo_commessa',           'AUTO',
                    'policy_fatturazione',     'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id
                FROM vendite.ddt d
                JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                JOIN vendite.ddt_righe dr
                  ON dr.ddt_id = d.id
                 AND dr.attivo IS TRUE
                LEFT JOIN LATERAL (
                  SELECT
                    o_src.billing_account_id  AS src_billing_account_id,
                    o_src.fatturazione_trigger AS src_fatturazione_trigger,
                    o_src.uid                  AS src_ordine_uid,
                    o_src.valuta_id            AS src_valuta_id,
                    or_r.prezzo_unitario       AS src_prezzo_unitario
                  FROM vendite.ordini_righe_fulfillment ful
                  JOIN vendite.ordini_righe or_r ON or_r.id = ful.ordine_riga_id
                  JOIN vendite.ordini o_src      ON o_src.id = or_r.ordine_id
                  WHERE ful.ddt_riga_id = dr.id
                  ORDER BY ful.id LIMIT 1
                ) src ON TRUE
                JOIN anagrafiche.billing_account ba
                  ON ba.id = COALESCE(d.billing_account_id, src.src_billing_account_id)
                WHERE COALESCE(d.billing_account_id, src.src_billing_account_id) IS NOT NULL
                  AND (
                    (src.src_fatturazione_trigger IS NOT NULL
                     AND src.src_fatturazione_trigger != 'CONFERMATO'
                     AND sdd.codice = src.src_fatturazione_trigger)
                    OR
                    (src.src_fatturazione_trigger IS NULL
                     AND d.billing_account_id IS NOT NULL
                     AND sdd.codice IN ('SPEDITO', 'CONSEGNATO'))
                  )
                  AND (p_competenza_mese IS NULL OR date_trunc('month', d.data)::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL
                       OR COALESCE(d.billing_account_id, src.src_billing_account_id) = p_billing_account_id)
                  -- Estensione 2026-05: NULL = lista globale; NOT NULL = singolo DDT.
                  AND (p_ddt_id IS NULL OR d.id = p_ddt_id)
                  AND NOT EXISTS (
                    SELECT 1 FROM vendite.commesse_attivita ca
                    WHERE ca.segment_key = 'DDT:' || d.uid::text || ':R:' || dr.id::text
                      AND ca.stato_emissione = 'EMESSA'
                  )
                ORDER BY d.id, dr.id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_ddt_da_pushare(date, bigint, integer, bigint)
              IS 'Lista righe DDT eligible al push su commessa (stato SPEDITO/CONSEGNATO o fatturazione_trigger specifico). p_ddt_id (opzionale): NULL=lista globale batch, NOT NULL=singolo DDT. Tutti i filtri in AND. Esclude righe gia` emesse via NOT EXISTS su commesse_attivita.';
