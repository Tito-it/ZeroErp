databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260513-04-create-trgfn-listini-righe-guard-no-composito-mctit.yaml

  # ---------------------------------------------------------------------------
  # Guard: vietato inserire righe listino direttamente su articoli compositi
  # (modello unificato BoM 2026-05-13, §9).
  #
  # Il prezzo di un articolo composito e' la somma dei prezzi dei suoi
  # componenti (via listini_righe_componenti). Una riga in listini_righe
  # per un composito sarebbe semanticamente errata e confliggerebbe col
  # resolver bundle-aware.
  #
  # 2 changeSet:
  #   04-01  trgfn vendite.trgfn_listini_righe_guard_no_composito
  #   04-02  trigger BEFORE INSERT su vendite.listini_righe
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260513-04-01-create-trgfn-listini-righe-guard-no-composito
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Trigger function vendite.trgfn_listini_righe_guard_no_composito.
        BEFORE INSERT: verifica che articolo_id non sia un articolo composito
        (is_composito=TRUE). Raise E_LISTINO_RIGA_COMPOSITO_VIETATO (446).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: listini_righe
          - tableExists:
              schemaName: catalogo
              tableName: articoli
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_no_composito()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE INSERT su listini_righe — blocca inserimento diretto
              --   di prezzo per articoli compositi. Il prezzo padre di un composito
              --   e' la somma dei prezzi componenti (listini_righe_componenti).
              DECLARE
                  v_is_composito catalogo.articoli.is_composito%TYPE;
                  v_codice       catalogo.articoli.codice%TYPE;
              BEGIN
                  SELECT a.is_composito, a.codice
                    INTO v_is_composito, v_codice
                    FROM catalogo.articoli a
                   WHERE a.id = NEW.articolo_id;

                  IF COALESCE(v_is_composito, FALSE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_LISTINO_RIGA_COMPOSITO_VIETATO',
                          jsonb_build_object(
                              'articolo_id',          NEW.articolo_id,
                              'listino_versione_id',  NEW.listino_versione_id
                          ),
                          NULL::uuid,
                          v_codice
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_no_composito() IS
                  'Trigger BEFORE INSERT su listini_righe: blocca inserimento per articoli '
                  'is_composito=TRUE. Prezzo composito = SUM componenti via listini_righe_componenti. '
                  'Raise E_LISTINO_RIGA_COMPOSITO_VIETATO (446). rev 2026-05-13.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS vendite.trgfn_listini_righe_guard_no_composito();

  - changeSet:
      id: 20260513-04-02-create-trg-listini-righe-guard-no-composito
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Trigger BEFORE INSERT su vendite.listini_righe, fase _a10_guard.
        Solo INSERT: UPDATE articolo_id e' bloccato da altri guard esistenti.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: listini_righe
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'vendite'
                   AND p.proname = 'trgfn_listini_righe_guard_no_composito';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_listini_righe_a10_guard_no_composito_ins
                  ON vendite.listini_righe;

              CREATE TRIGGER trg_listini_righe_a10_guard_no_composito_ins
                  BEFORE INSERT
                  ON vendite.listini_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_listini_righe_guard_no_composito();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_listini_righe_a10_guard_no_composito_ins
                  ON vendite.listini_righe;
