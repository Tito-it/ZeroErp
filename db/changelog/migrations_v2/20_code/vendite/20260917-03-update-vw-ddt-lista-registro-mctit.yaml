# P-1 / Q-E — vendite.vw_ddt_lista: + registro_codice, registro_descrizione
#   Brief: brief-db-distinta-ricerca-rate §4-bis.2 (decisione di Tid, 2026-09-17).
#
# -- LO STESSO BLOCCO SU TUTTE LE SORELLE CHE UN REGISTRO CE L'HANNO ---------
#   Il registro di numerazione (ddt.registro_id, dal 20260831) arriva in coda
#   con la stessa forma appesa a vw_fatture_lista nello stesso giro
#   (20260917-02): fatture, ddt, ordini e resi lo espongono allo stesso modo,
#   cosi' chi scrive l'ottava copia non la copia da una vista senza.
#   ⛔ contratti, preventivi e offerte NON hanno registro_id: non lo avranno.
#   ⚠️ Nessun numero_documento: qui `numero` e' gia' il parlante (varchar).
#
# -- IL REGISTRO E' LEFT: un documento senza registro compare senza registro.
# -- CREATE OR REPLACE: colonne in ULTIMA posizione (si consuma per nome).
# -- security_invoker=on RI-SPECIFICATA, o PostgreSQL la azzera.
# -- Nessun consumatore oggi: il repository legge v.*, la colonna arriva; il
#    seed di lista la prende quando servira'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260917-03-update-vw-ddt-lista-registro-mctit.yaml

  - changeSet:
      id: 20260917-03-update-vw-ddt-lista-registro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_ddt_lista: + registro_codice, registro_descrizione in coda (LEFT JOIN vendite.registri_fatturazione).
        security_invoker=on ri-specificata. Brief: brief-db-distinta-ricerca-rate,
        sezione 4-bis.2 (P-1, Q-E).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_ddt_lista
            - tableExists:
                schemaName: vendite
                tableName: registri_fatturazione
            - columnExists:
                schemaName: vendite
                tableName: ddt
                columnName: registro_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_ddt_lista
              WITH (security_invoker=on) AS
               SELECT d.id,
                  d.uid,
                  d.numero,
                  d.serie,
                  d.anno,
                  d.data,
                  d.stato_doc_ddt_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  d.destinatario_soggetto_ruolo_id,
                  s_dest.id AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  d.mittente_soggetto_ruolo_id,
                  s_mitt.ragione_sociale_completa AS mittente_denominazione,
                  d.vettore_soggetto_ruolo_id,
                  s_vett.ragione_sociale_completa AS vettore_denominazione,
                  d.billing_account_id,
                  ba.codice AS ba_codice,
                  d.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  d.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  d.valuta_id,
                  v_val.codice AS valuta_codice,
                  d.causale_trasporto_id,
                  ct.codice AS causale_trasporto_codice,
                  ct.descrizione AS causale_trasporto_descrizione,
                  d.aspetto_bene_id,
                  ab.codice AS aspetto_bene_codice,
                  ab.descrizione AS aspetto_bene_descrizione,
                  d.modalita_addebito_trasporto_id,
                  mat.codice AS modalita_addebito_trasporto_codice,
                  d.num_colli,
                  d.peso_lordo,
                  d.peso_netto,
                  d.volume,
                  d.targa,
                  d.autista,
                  d.data_ora_partenza,
                  d.data_ora_consegna_prev,
                  d.tracking_code,
                  d.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  d.sorgente_uid,
                  o_src.id AS ordine_origine_id,
                  o_src.numero AS ordine_origine_numero,
                  d.data_insert,
                  d.user_insert,
                  d.data_update,
                  d.user_update,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  lin.frontiera_natura_doc_codice_interno,
                  lin.frontiera_tipo_codice_interno,
                  reg.codice AS registro_codice,
                  reg.descrizione AS registro_descrizione
                 FROM vendite.ddt d
                   JOIN config.stati_doc_ddt sd ON sd.id = d.stato_doc_ddt_id
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON sr_dest.id = d.destinatario_soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s_dest ON s_dest.id = sr_dest.soggetto_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_mitt ON sr_mitt.id = d.mittente_soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_mitt ON s_mitt.id = sr_mitt.soggetto_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_vett ON sr_vett.id = d.vettore_soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_vett ON s_vett.id = sr_vett.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = d.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = d.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = d.utility_id
                   LEFT JOIN config.valute v_val ON v_val.id = d.valuta_id
                   LEFT JOIN config.causali_trasporto ct ON ct.id = d.causale_trasporto_id
                   LEFT JOIN config.aspetti_beni ab ON ab.id = d.aspetto_bene_id
                   LEFT JOIN config.modalita_addebito_trasporto mat ON mat.id = d.modalita_addebito_trasporto_id
                   LEFT JOIN config.sorgenti src ON src.id = d.sorgente_tipo_id
                   LEFT JOIN vendite.ordini o_src ON o_src.uid = d.sorgente_uid AND src.codice_interno::text = 'ORDINE_VENDITA'::text
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE sorgenti.codice_interno::text = 'DDT_VENDITA'::text AND sorgenti.attivo IS TRUE)) AND lin.uid = d.id::text
                   LEFT JOIN vendite.registri_fatturazione reg ON reg.id = d.registro_id;

              COMMENT ON VIEW vendite.vw_ddt_lista
              IS 'Vista flat canonica e self-contained DDT per la lista UI. Nomi canonici. Destinatario via soggetto_ruolo diretto; mittente/vettore nullable. +emittente_fiscale_id/_codice (scope, §15). Campi trasporto per il PDF. Ordine di origine via sorgente_uid. security_invoker=on. Mirror vw_ordini_lista. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da `config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql §6c vieta `codice_interno AS *_codice` perche'' il nome mentirebbe sulla sorgente — un consumatore che confronta contro un `*_codice` si aspetta la colonna MUTABILE. Il guardrail CI scripts/sql/check_naming_stato_codice.sql fallisce sul pattern. (2) arriva `frontiera_tipo_codice_interno`, il CODICE del tipo accanto al suo id: prima ogni consumatore se lo traduceva con lo stesso join a config.sorgenti — dieci copie scritte a mano nel backend, tutte fuori dalla portata del guardrail, che scansiona solo le viste. ⚠️ Il nome NON e'' `frontiera_tipo_codice`: quel valore e'' `config.sorgenti.codice_interno` e il FE lo usa per la chiave i18n e per instradare, cioe'' come LOGICA. Chiamarlo `*_codice` avrebbe spostato dieci mislabel nascosti dentro l''unico posto dove il guardrail li vede. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.2, Q-E): + registro_codice, registro_descrizione in coda, LEFT JOIN vendite.registri_fatturazione su registro_id (20260831). E'' lo stesso blocco appeso a vw_fatture_lista nello stesso giro: le sorelle che un registro ce l''hanno — fatture, ddt, ordini, resi — lo espongono allo stesso modo, cosi'' chi scrive l''ottava copia non la copia da una vista senza. ⛔ contratti, preventivi e offerte NON hanno registro_id e non avranno queste colonne: non e'' una dimenticanza. Nessun numero_documento qui: su questa vista `numero` e'' gia'' il numero parlante (varchar).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
