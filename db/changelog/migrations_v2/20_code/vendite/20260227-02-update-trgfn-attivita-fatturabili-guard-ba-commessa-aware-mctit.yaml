databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260227-02-update-trgfn-attivita-fatturabili-guard-ba-commessa-aware-mctit.yaml

  - changeSet:
      id: 20260227-02-update-trgfn-attivita-fatturabili-guard-ba-commessa-aware
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      comment: "Rende trgfn_attivita_fatturabili_guard_ba_coerenza commessa-aware: skip validazione quando commessa_attivita_id IS NOT NULL (coerenza garantita a monte dal push)."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_iu_id anagrafiche.billing_account.istanza_utility_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Validare coerenza tra billing_account e istanza_utility
                --   sulle righe attivita_fatturabili.
                --
                -- Regole:
                --   - se billing_account_id e` valorizzato, deve esistere
                --   - istanza_utility_id deve coincidere con quella del BA
                --   - variadic su fn_log_and_raise_error sempre testuali
                --   - Commessa-aware: quando commessa_attivita_id IS NOT NULL
                --     la coerenza BA/utility e` garantita a monte dal push
                --     (fn_get_or_create_commessa), skip validazione.
                -- =========================================================

                -- Righe da commessa: coerenza BA/utility garantita dal push.
                IF NEW.commessa_attivita_id IS NOT NULL THEN
                  RETURN NEW;
                END IF;

                IF NEW.billing_account_id IS NOT NULL THEN
                  SELECT b.istanza_utility_id
                    INTO v_iu_id
                    FROM anagrafiche.billing_account b
                   WHERE b.id = NEW.billing_account_id;

                  IF NOT FOUND THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'attivita_fatturabili',
                      'E_PARAMETRI_TABELLA',
                      jsonb_build_object(
                        'context','validazione billing_account_id',
                        'billing_account_id', NEW.billing_account_id
                      ),
                      NULL::uuid,
                      'billing_account', NEW.billing_account_id::text
                    );
                  END IF;

                  IF NEW.istanza_utility_id IS DISTINCT FROM v_iu_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'attivita_fatturabili',
                      'E_COERENZA_ID',
                      jsonb_build_object(
                        'context','validazione istanza_utility_id',
                        'istanza_utility_id', NEW.istanza_utility_id,
                        'billing_account_id', NEW.billing_account_id,
                        'istanza_utility_attesa', v_iu_id
                      ),
                      NULL::uuid,
                      'istanza_utility_id', COALESCE(NEW.istanza_utility_id::text, 'NULL'),
                      'billing_account', NEW.billing_account_id::text
                    );
                  END IF;
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_ba_coerenza()
              IS 'Valida coerenza BA/istanza_utility su attivita_fatturabili; variadic error helper normalizzati a text. Commessa-aware: skip quando commessa_attivita_id IS NOT NULL.';
