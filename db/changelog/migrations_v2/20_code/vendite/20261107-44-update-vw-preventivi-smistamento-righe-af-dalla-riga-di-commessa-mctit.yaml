# FATTURATA ED EMESSA_AF ATTRAVERSO LA RIGA DI COMMESSA: vendite.vw_preventivi_smistamento_righe
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.1 (V-2).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   I due stati cercavano l'attivita' fatturabile con sorgente_uid = l'uid del
#   preventivo e sorgente_riga = la riga del preventivo: nessuno scrive
#   un'attivita' cosi' (sorgente_uid era l'impronta, sorgente_riga la riga di
#   commessa), quindi non scattavano mai (V-2). L'attivita' nasce da una riga di
#   commessa: si cercano le righe di commessa del segmento della riga del
#   preventivo (segment_base = script.fn_segment_key(PREVENTIVO, uid, riga), la
#   stessa chiave di IN_COMMESSA), non annullate, e da loro l'attivita' per
#   commessa_attivita_id.
#
#   CREATE OR REPLACE con le stesse colonne: le sette viste che ne dipendono non
#   cambiano. security_invoker ripetuto. COMMENT riscritto al presente.
#   Rollback: la vista del 20261020-98.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261107-44-update-vw-preventivi-smistamento-righe-af-dalla-riga-di-commessa-mctit.yaml

  - changeSet:
      id: 20261107-44-update-vw-preventivi-smistamento-righe-af-dalla-riga-di-commessa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_preventivi_smistamento_righe: FATTURATA ed EMESSA_AF cercano l'attivita'
        fatturabile dalla riga di commessa del segmento (V-2). brief-db-sorgente-documento-e-riga
        §7.2 lotto C, giro C.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- security_invoker si AZZERA a ogni CREATE OR REPLACE VIEW: si ripete dal catalogo.
              CREATE OR REPLACE VIEW vendite.vw_preventivi_smistamento_righe WITH (security_invoker=on) AS
              SELECT p.id AS preventivo_id,
                  p.uid AS preventivo_uid,
                  p.numero AS preventivo_numero,
                  pr.id AS riga_id,
                  pr.ordine AS riga_ordine,
                  pr.descrizione AS riga_descrizione,
                  pr.articolo_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.prezzo_unitario,
                  pr.natura_vendita_id,
                  nv.codice AS natura_vendita_codice,
                  COALESCE(nv.destinazione_tipo, 'COMMESSA'::character varying) AS destinazione_tipo,
                  orr.id AS ordine_riga_id,
                  o.id AS ordine_id,
                  o.numero AS ordine_numero,
                      CASE
                          WHEN (EXISTS ( SELECT 1
                             FROM (vendite.commesse_attivita ca
                               JOIN vendite.attivita_fatturabili af ON ((af.commessa_attivita_id = ca.id)))
                            WHERE (((ca.segment_base)::text = (script.fn_segment_key('PREVENTIVO'::character varying, (p.uid)::text, pr.id))::text) AND ((ca.stato_emissione)::text <> 'ANNULLATA'::text) AND (af.fattura_riga_id IS NOT NULL)))) THEN 'FATTURATA'::text
                          WHEN (EXISTS ( SELECT 1
                             FROM (vendite.commesse_attivita ca
                               JOIN vendite.attivita_fatturabili af ON ((af.commessa_attivita_id = ca.id)))
                            WHERE (((ca.segment_base)::text = (script.fn_segment_key('PREVENTIVO'::character varying, (p.uid)::text, pr.id))::text) AND ((ca.stato_emissione)::text <> 'ANNULLATA'::text)))) THEN 'EMESSA_AF'::text
                          WHEN (script.fn_get_stato_push_segment(script.fn_segment_key('PREVENTIVO'::character varying, (p.uid)::text, pr.id)) <> 'LIBERA'::text) THEN 'IN_COMMESSA'::text
                          WHEN (orr.id IS NOT NULL) THEN 'A_ORDINE'::text
                          ELSE 'RESIDUA'::text
                      END AS stato_smistamento
                 FROM ((((vendite.preventivi p
                   JOIN vendite.preventivi_righe pr ON (((pr.preventivo_id = p.id) AND (pr.attivo IS TRUE))))
                   LEFT JOIN config.nature_vendita nv ON ((nv.id = pr.natura_vendita_id)))
                   LEFT JOIN vendite.ordini_righe orr ON ((orr.preventivo_riga_id = pr.id)))
                   LEFT JOIN vendite.ordini o ON ((o.id = orr.ordine_id)));
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_preventivi_smistamento_righe IS
                'Fonte dati del Pannello Smistamento: una riga per riga attiva del preventivo, con natura e destinazione effettiva (natura NULL = destinazione COMMESSA), i riferimenti del ramo ordine e lo stato_smistamento. Gli stati, nell''ordine in cui si decidono: FATTURATA (un''attivita'' fatturabile nata dal segmento della riga e'' in fattura), EMESSA_AF (l''attivita'' fatturabile c''e''), IN_COMMESSA (il segmento non e'' LIBERO per script.fn_get_stato_push_segment, la fonte unica del «gia'' mandato»), A_ORDINE (una riga d''ordine la consuma), RESIDUA. Il segmento della riga e'' script.fn_segment_key(PREVENTIVO, uid, riga); le righe di commessa del segmento sono quelle con quella segment_base, componenti e rettifiche comprese, e l''attivita'' fatturabile si raggiunge per commessa_attivita_id. Una riga di commessa ANNULLATA non conta: annullata la commessa, la riga del preventivo torna RESIDUA.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- security_invoker si AZZERA a ogni CREATE OR REPLACE VIEW: si ripete dal catalogo.
              CREATE OR REPLACE VIEW vendite.vw_preventivi_smistamento_righe WITH (security_invoker=on) AS
              SELECT p.id AS preventivo_id,
                  p.uid AS preventivo_uid,
                  p.numero AS preventivo_numero,
                  pr.id AS riga_id,
                  pr.ordine AS riga_ordine,
                  pr.descrizione AS riga_descrizione,
                  pr.articolo_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.prezzo_unitario,
                  pr.natura_vendita_id,
                  nv.codice AS natura_vendita_codice,
                  COALESCE(nv.destinazione_tipo, 'COMMESSA'::character varying) AS destinazione_tipo,
                  orr.id AS ordine_riga_id,
                  o.id AS ordine_id,
                  o.numero AS ordine_numero,
                      CASE
                          WHEN (EXISTS ( SELECT 1
                             FROM vendite.attivita_fatturabili af
                            WHERE ((af.sorgente_uid = p.uid) AND (af.sorgente_riga = pr.id) AND (af.fattura_riga_id IS NOT NULL)))) THEN 'FATTURATA'::text
                          WHEN (EXISTS ( SELECT 1
                             FROM vendite.attivita_fatturabili af
                            WHERE ((af.sorgente_uid = p.uid) AND (af.sorgente_riga = pr.id)))) THEN 'EMESSA_AF'::text
                          WHEN (script.fn_get_stato_push_segment(script.fn_segment_key('PREVENTIVO'::character varying, (p.uid)::text, pr.id)) <> 'LIBERA'::text) THEN 'IN_COMMESSA'::text
                          WHEN (orr.id IS NOT NULL) THEN 'A_ORDINE'::text
                          ELSE 'RESIDUA'::text
                      END AS stato_smistamento
                 FROM ((((vendite.preventivi p
                   JOIN vendite.preventivi_righe pr ON (((pr.preventivo_id = p.id) AND (pr.attivo IS TRUE))))
                   LEFT JOIN config.nature_vendita nv ON ((nv.id = pr.natura_vendita_id)))
                   LEFT JOIN vendite.ordini_righe orr ON ((orr.preventivo_riga_id = pr.id)))
                   LEFT JOIN vendite.ordini o ON ((o.id = orr.ordine_id)));

              COMMENT ON VIEW vendite.vw_preventivi_smistamento_righe IS
                'Fonte dati del Pannello Smistamento (una riga per riga attiva del preventivo): natura/destinazione effettiva (NULL = pregresso -> COMMESSA), riferimenti ramo ordine, stato_smistamento autorevole (RESIDUA/A_ORDINE/IN_COMMESSA/EMESSA_AF/FATTURATA). Sostituisce vw_preventivi_stato_fatturazione_righe (brief-db-smistamento-preventivi.md B). ⭐ rev 2026-10-12 (20261012-11, brief-db-annullo-a-valle-riapre-a-monte D-5): IN_COMMESSA = il segmento della riga non e'' LIBERO per script.fn_get_stato_push_segment, la fonte unica del «gia'' mandato». Prima era «segment EMESSA», allineato al predicato che la vista smistabili aveva fino al 2026-06-28: quando quella e'' passata all''allocazione, questa non l''ha seguita, e una riga mandata in commessa e non ancora emessa risultava RESIDUA mentre il push la dava gia'' inviata. Una riga di commessa ANNULLATA non occupa: annullata la commessa, la riga torna RESIDUA. Rev 2026-10-20 (20261020-98, brief-db-grammatica-unica-documenti 2e, G-8): la chiave della riga di preventivo la compone script.fn_segment_key (PREVENTIVO:<uid>:R:<riga>, era PREV:...).';
