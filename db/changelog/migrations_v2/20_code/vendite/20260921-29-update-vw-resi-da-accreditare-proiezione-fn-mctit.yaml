# D14 — LA CODA ACCREDITI E' LA PROIEZIONE DELLA FUNZIONE (giro 2 — D3)
#   brief-db-partita-merce-per-documento §7 «Giro 2»; decisioni D1 (un corpo)
#   e D3 di Tid del 2026-09-21.
#
# ── COSA CAMBIA ────────────────────────────────────────────────────────
#
#   Niente nel risultato: stesse 27 colonne, stessi tipi, stesse righe e
#   stessi numeri (EXCEPT ALL a zero nei due versi con la definizione viva,
#   fatto datato del 21-09). Cambia DOVE sta la coda: in
#   vendite.fn_resi_da_accreditare (20260921-28), di cui questa vista e' la
#   proiezione senza filtro — fn(NULL, NULL). Un corpo solo.
#
# ── PERCHE' NON `SELECT *` (brief §2-bis.1, la stessa trappola, CINQUE volte)
#
#   Un RETURNS TABLE perde il typmod, e qui ne cadrebbero cinque: reso_numero
#   varchar(32), ba_codice varchar(30), descrizione e motivo varchar(255),
#   ddt_numero varchar(20). `SELECT *` PASSEREBBE e cambierebbe il contratto
#   in silenzio; il ritorno sarebbe poi rifiutato. Colonne per NOME e i cinque
#   cast espliciti.
#
# ── security_invoker VA RI-SPECIFICATO ─────────────────────────────────
#
#   Senza, la funzione — e sotto di lei fn_partite_merce — girerebbe come
#   OWNER: bypass della RLS. Presidiato da rls/test-rls-viste-security-invoker.
#
# ── A VALLE ────────────────────────────────────────────────────────────
#
#   vw_dash_backlog_documenti dipende da questa vista (pg_depend): un CREATE OR
#   REPLACE a colonne invariate passa senza toccarla. La lista configurabile
#   `vendite.resi_da_accreditare` (ui.lista_definizione, id 10) legge la vista
#   intera: e' la coda aperta a mano, e «tutta» e' la risposta giusta.
#
# Presidio: test-fn-resi-da-accreditare-chiusura-v1 (pin di forma: la vista
#   nomina la funzione e nessuna tabella; 27 colonne coi cinque typmod) +
#   test-vw-resi-da-accreditare-contatore-v1 (10), test-vw-dash-backlog-resi-v1,
#   invariati.
# Dipendenze: 20260921-28.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260921-29-update-vw-resi-da-accreditare-proiezione-fn-mctit.yaml

  - changeSet:
      id: 20260921-29-update-vw-resi-da-accreditare-proiezione-fn
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D14 giro 2 (D1, D3): vendite.vw_resi_da_accreditare diventa la proiezione
        senza filtro di vendite.fn_resi_da_accreditare(NULL, NULL) — un corpo solo.
        Colonne per NOME coi cinque varchar ricastati al loro typmod (un SELECT *
        li perderebbe). Stesse 27 colonne, stessi tipi, stessi numeri.
        security_invoker=on ri-specificato.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_resi_da_accreditare
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc
                   WHERE proname = 'fn_resi_da_accreditare'
                     AND pronamespace = 'vendite'::regnamespace
                     AND prosqlbody IS NOT NULL
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_resi_da_accreditare
              WITH (security_invoker=on) AS
              -- D14 (2026-09-21, giro 2 — D3): la vista e' la PROIEZIONE senza filtro
              -- di fn_resi_da_accreditare. La coda sta nella funzione: chi legge per
              -- documento — il verbo, il guard del ponte, il backend — la chiama con
              -- un seme. Colonne per nome, non `*`: il RETURNS TABLE perde i typmod
              -- dei cinque varchar.
              SELECT q.resi_riga_id,
                     q.reso_id,
                     q.reso_uid,
                     q.reso_numero::character varying(32)     AS reso_numero,
                     q.data,
                     q.emittente_fiscale_id,
                     q.billing_account_id,
                     q.ba_codice::character varying(30)       AS ba_codice,
                     q.destinatario_soggetto_ruolo_id,
                     q.destinatario_denominazione,
                     q.articolo_id,
                     q.descrizione::character varying(255)    AS descrizione,
                     q.quantita,
                     q.qta_operativa,
                     q.uom_operativa_id,
                     q.motivo::character varying(255)         AS motivo,
                     q.ddt_riga_id,
                     q.ddt_id,
                     q.ddt_numero::character varying(20)      AS ddt_numero,
                     q.ordine_riga_id,
                     q.tenuti,
                     q.fatturati,
                     q.accredito_dovuto,
                     q.etichetta,
                     q.gia_accreditato,
                     q.blocco_codice,
                     q.annullo_blocco_codice
                FROM vendite.fn_resi_da_accreditare(NULL::bigint[], NULL::bigint[]) q;

              COMMENT ON VIEW vendite.vw_resi_da_accreditare
              IS 'La CODA ACCREDITI: le righe di reso per cui il conto della merce dichiara un accredito ancora dovuto. ⭐ rev 2026-09-21 (D14, giro 2 — D3): la coda NON sta piu'' qui — sta in vendite.fn_resi_da_accreditare(p_ddt_ids, p_ordine_ids), e questa vista ne e'' la proiezione senza filtro, fn(NULL, NULL): UN corpo solo (D1). Chi legge PER DOCUMENTO chiama la funzione con un seme e paga la coda di quel documento, non quella di tutti: fn_accredita_riga_reso e fn_resi_riga_tetti_accredito (il DDT della riga resa), BE per documento (richiesta nel brief). Chi legge tutto — la lista configurabile della coda, vw_dash_backlog_documenti — legge la vista. Colonne proiettate per NOME coi cinque varchar ricastati (reso_numero 32, ba_codice 30, descrizione e motivo 255, ddt_numero 20): un SELECT * perderebbe i typmod in silenzio. La quota della partita si ripartisce fra le righe di reso con una greedy per resi_riga_id. rev 2026-08-18 (brief-design-note-credito-resi N9): la finestra si applica alla quantita'' ANCORA ACCREDITABILE (quantita'' resa meno gia'' accreditato) e non alla quantita'' resa. ⚠️ Con la seconda, dopo il primo accredito la riga gia'' servita tornava in testa alla coda e si riprendeva il residuo della partita, mentre la riga che quel residuo lo doveva davvero usciva dalla coda: la quota diventava IRRAGGIUNGIBILE — la stessa malattia per cui il cantiere esiste, creata dal rimedio. ⭐ Ne discende che una riga esce dalla coda AL VERBO e non alla generazione della fattura: l''idempotenza smette di dipendere da una finestra temporale e diventa un numero che e'' gia'' sceso. Espone gia_accreditato e blocco_codice perche'' il frontend gate il bottone sui dati che la riga porta gia'', mai con una capability per riga di lista. ⭐ rev 2026-08-25 — annullo_blocco_codice: il motivo per cui l''ANNULLO dell''accredito e'' bloccato su quella riga, NULL se ammesso, dal `reason` del primo motivo di script.fn_check_accredito_annullabile. ⛔ E'' una colonna NUOVA e non un allargamento di blocco_codice: quella risponde a «perche'' non posso ACCREDITARE» e il suo unico valore, GIA_ACCREDITATO, e'' esattamente la condizione che ABILITA l''annullo. ⭐ La sede del predicato e'' UNA: la stessa funzione che la madre interroga per sollevare, cosi'' lettura e guardia non possono divergere. security_invoker=on ri-specificato (un CREATE OR REPLACE la azzera: qui significa far girare la funzione come owner, bypass della RLS).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Non si torna indietro da soli: va ri-applicato 20260825-24, che
              --    porta il corpo della coda dentro la vista.
              SELECT 1;
