#
# Trigger BEFORE INSERT su vendite.preventivi che valorizza valuta_id
# se non passato esplicitamente nel payload.
#
# Finora la valuta su preventivi era risolta solo lato BE
# (resolve_valuta_default) e passata nel payload: il DB non aveva una
# rete di sicurezza. Questo trigger aggiunge il seed DB-side riusando il
# resolver canonico vendite.fn_get_valuta_id (BA -> emittente -> gestore
# -> RAISE), portando preventivi alla stessa simmetria di
# offerte_commerciali e contratti.
#
# billing_account_id su preventivi e' NULLABLE: la fn salta il livello BA
# e risolve da emittente/gestore. emittente_fiscale_id (NOT NULL) e' gia'
# risolto dal trigger _a10_default_emittente (ordina prima).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260529-05-create-trgfn-preventivi-default-valuta-mctit.yaml

  - changeSet:
      id: 20260529-05-create-trgfn-preventivi-default-valuta
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        BEFORE INSERT trigger su vendite.preventivi che setta valuta_id
        via vendite.fn_get_valuta_id se NEW.valuta_id IS NULL. Rete di
        sicurezza DB-side simmetrica a offerte/contratti. Solleva
        E_CONFIG_MANCANTE (dalla fn) se la catena non risolve.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: preventivi
            columnName: valuta_id
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- Function: vendite.trgfn_preventivi_default_valuta
              --
              -- Scopo: valorizzare automaticamente preventivi.valuta_id a
              --        INSERT-time riusando vendite.fn_get_valuta_id, quando
              --        il payload non la fornisce (es. BE resolver -> {}).
              --
              -- Skip se NEW.valuta_id gia' valorizzato (caso standard: il BE
              -- passa la valuta risolta da resolve_valuta_default).
              --
              -- billing_account_id NULLABLE: la fn salta il livello BA.
              -- emittente_fiscale_id (NOT NULL) mappato a soggetto_ruolo_id.
              -- ==========================================================
              CREATE OR REPLACE FUNCTION vendite.trgfn_preventivi_default_valuta()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_emittente_sr_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
              BEGIN
                -- 1) Skip se gia' valorizzato esplicitamente nel payload.
                IF NEW.valuta_id IS NOT NULL THEN
                  RETURN NEW;
                END IF;

                -- 2) Mappa emittente PK -> soggetto_ruolo_id (gia' su NEW).
                IF NEW.emittente_fiscale_id IS NOT NULL THEN
                  SELECT ef.soggetto_ruolo_id
                    INTO v_emittente_sr_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = NEW.emittente_fiscale_id;
                END IF;

                -- 3) Resolver canonico: BA -> emittente -> gestore -> RAISE.
                NEW.valuta_id := vendite.fn_get_valuta_id(
                  NEW.billing_account_id,
                  v_emittente_sr_id
                );

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_preventivi_default_valuta()
              IS 'BEFORE INSERT trigger fn: setta preventivi.valuta_id via '
                 'vendite.fn_get_valuta_id (catena BA -> emittente -> gestore). '
                 'Skip se valorizzato esplicitamente (caso standard: BE resolver). '
                 'Solleva E_CONFIG_MANCANTE (dalla fn) se nulla risolve. Pattern '
                 'simmetrico a trgfn_offerte_commerciali_default_valuta / '
                 'trgfn_contratti_default_valuta.';

              -- Drop-and-recreate per ridefinizioni (runOnChange:true).
              DROP TRIGGER IF EXISTS trg_preventivi_a10_default_valuta_ins
                ON vendite.preventivi;

              -- Naming _a10_default_valuta_ins: ordina dopo _a10_default_emittente_ins.
              CREATE TRIGGER trg_preventivi_a10_default_valuta_ins
                BEFORE INSERT ON vendite.preventivi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_preventivi_default_valuta();

              COMMENT ON TRIGGER trg_preventivi_a10_default_valuta_ins
                ON vendite.preventivi
              IS 'Default valuta_id via fn_get_valuta_id. Fase _a10_default_*: '
                 'ordina dopo _a10_default_emittente_ins (emittente gia'' risolto).';
