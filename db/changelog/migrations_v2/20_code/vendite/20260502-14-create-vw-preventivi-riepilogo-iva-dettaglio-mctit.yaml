# Vista vendite.vw_preventivi_riepilogo_iva_dettaglio.
#
# Why: espone le righe di preventivi_riepiloghi_iva arricchite con
# codice/descrizione IVA e aliquota effettiva applicata (override
# stato emittente). Pensata per UI riepilogo IVA del preventivo
# (componente FE riusabile, simmetrico a quello fatture).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260502-14-create-vw-preventivi-riepilogo-iva-dettaglio-mctit.yaml

  - changeSet:
      id: 20260502-14-create-vw-preventivi-riepilogo-iva-dettaglio
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Vista vw_preventivi_riepilogo_iva_dettaglio: riepiloghi IVA
        per preventivo arricchiti con codice/descrizione IVA. Per UI.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: preventivi_riepiloghi_iva
            - tableExists:
                schemaName: config
                tableName: iva
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_preventivi_riepilogo_iva_dettaglio;

              CREATE VIEW vendite.vw_preventivi_riepilogo_iva_dettaglio AS
              SELECT
                ri.id,
                ri.preventivo_id,
                ri.iva_id,
                iva.codice                                AS iva_codice,
                iva.descrizione                           AS iva_descrizione,
                iva.aliquota_iva                          AS iva_aliquota,
                ri.natura_id,
                n.codice                                  AS natura_codice,
                ri.esigibilita,
                ri.split_payment,
                ri.imponibile,
                ri.imposta,
                ri.arrotondamento,
                ri.imponibile + ri.imposta                AS totale_riga,
                ri.data_insert,
                ri.data_update
              FROM vendite.preventivi_riepiloghi_iva ri
              LEFT JOIN config.iva iva
                ON iva.id = ri.iva_id
              LEFT JOIN config.iva_natura n
                ON n.id = ri.natura_id
              ORDER BY ri.preventivo_id, iva.aliquota_iva NULLS LAST, ri.id;

              COMMENT ON VIEW vendite.vw_preventivi_riepilogo_iva_dettaglio
              IS 'Riepilogo IVA per preventivo arricchito con codice/descrizione/aliquota IVA e codice natura. Per UI riepilogo IVA del preventivo (simmetrico a quello fatture).';
      rollback:
        - sql:
            sql: DROP VIEW IF EXISTS vendite.vw_preventivi_riepilogo_iva_dettaglio;
