# N3 (2/2) — IL LOOKUP E LA INSERT IMPARANO LE STESSE DUE COSE
#   brief-design-note-credito-resi.md §15 (N3)
#
#   Gemello obbligatorio di -33. Il commento vivo di questa funzione avverte
#   gia' del pericolo, ed e' scritto da chi ci era passato:
#
#       «il WHERE del lookup e la INSERT devono nominare gli STESSI elementi
#        della chiave prodotta da fn_build_fattura_key. Se la chiave separa e
#        il lookup no, le due meta' si annullano e le attivita' tornano nella
#        stessa fattura.»
#
# ── 🔴 LA TRAPPOLA GEMELLA, che riguarda la SERIE ──────────────────────
#
#   `vendite.fatture.serie` **non e' mai stato scritto dalla pipeline**: questa
#   INSERT non nominava la colonna, il valore restava NULL e
#   `fn_assign_numero_fattura` cadeva sul `serie_default` del registro. Con la
#   serie in chiave e la INSERT ferma, il risultato sarebbe stato una nota di
#   credito con **un numero valido nella serie delle fatture** — cioe' un
#   difetto che non solleva nulla e si scopre guardando un registro IVA.
#
#   Per questo la serie entra in tre posti nello stesso changeSet: il `WHERE`
#   del lookup, l'elenco colonne della `INSERT` e i suoi valori.
#
# ── ⚠️ `IS NOT DISTINCT FROM` sulla serie, e non `=` ───────────────────
#
#   La serie e' **nullable** — anzi, con il sezionale proprio (D-NC-3b) e' NULL
#   sempre. Con `=` il NULL non combacia mai, quindi ogni giro aprirebbe una
#   fattura nuova per la totalita' dei casi. E' la stessa trappola gia' pagata
#   tre volte in questo progetto (reseller, modalita' di pagamento, indice
#   d'ambito), e la funzione la tratta gia' cosi' per i tre elementi nullable
#   che aveva: la serie e' il quarto.
#
#   La natura invece e' NOT NULL su `fatture` e su `attivita_fatturabili`:
#   `=` e' corretto, e usare `IS NOT DISTINCT FROM` anche li' nasconderebbe
#   sotto un'uguaglianza permissiva un valore che non puo' mancare.
#
# ── LA COMPLETEZZA DELLA CHIAVE ────────────────────────────────────────
#
#   Il guard sugli elementi che non possono legittimamente mancare guadagna la
#   natura, per lo stesso motivo per cui contiene gia' `utility_id`: la colonna
#   e' NOT NULL a monte, quindi se qui arriva vuota **la chiave e' rotta**, non
#   «senza natura». La serie resta fuori: NULL e' il suo valore normale.
#
# Base: corpo dalla definizione VIVA
#   (docs/it/dbzero/vendite/funzioni/fn_get_or_create_fattura_header.md).
# Dipendenze: -26 (fatture.natura_doc_id), -33 (la chiave a undici elementi).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-34-update-fn-get-or-create-fattura-header-natura-e-serie-mctit.yaml

  - changeSet:
      id: 20260818-34-update-fn-get-or-create-fattura-header-natura-e-serie
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        N3 (2/2): il lookup della testata confronta natura e serie nel WHERE e
        le SCRIVE nella INSERT. Senza la prima meta' le attivita' di natura
        diversa tornerebbero nella stessa fattura; senza la seconda la nota di
        credito prenderebbe un numero valido nella serie delle fatture, in
        silenzio. Gemello obbligatorio di -33.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: fatture
            columnName: natura_doc_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ Parametri e RETURNS ANCORATI con %TYPE (linee-guida-sql §5b).
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_fattura_header(
                  p_lotto_id    vendite.fatturazione_lotti.id%TYPE,
                  p_attivita_id vendite.attivita_fatturabili.id%TYPE)
               RETURNS vendite.fatture.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: recupera o crea la testata DRAFT della fattura a cui
              --        l'attivita' appartiene, dentro il lotto dato.
              -- Regole: il `WHERE` del lookup e la INSERT devono nominare gli
              --         STESSI elementi della chiave prodotta da
              --         fn_build_fattura_key (§6). Se la chiave separa e il
              --         lookup no, le due meta' si annullano e le attivita'
              --         tornano nella stessa fattura.
              -- rev 2026-08-04 (D-M): la INSERT sul ponte non nomina piu'
              --         `esclusa`: era l'unico punto che la scriveva, e ci
              --         scriveva la costante FALSE.
              -- rev 2026-08-18 (brief nota di credito, N3): la chiave ha
              --         undici elementi. Natura e serie entrano nel WHERE E
              --         nella INSERT. ⚠️ La serie in particolare non era MAI
              --         stata scritta da qui: restava NULL e la numerazione
              --         cadeva sul serie_default del registro. Calcolarla
              --         senza scriverla avrebbe dato alla nota di credito un
              --         numero valido nella serie delle fatture.
              DECLARE
                  v_key          JSONB;
                  v_fattura_id   vendite.fatture.id%TYPE;
                  v_stato_doc_id config.stati_doc_fiscale.id%TYPE;
                  v_registro_id  vendite.registri_fatturazione.id%TYPE;
                  v_ba_id        anagrafiche.billing_account.id%TYPE;
                  v_tipo_doc_id  config.tipi_doc_fiscale.id%TYPE;
                  v_natura_id    config.nature_doc_fiscale.id%TYPE;
                  v_valuta_id    config.valute.id%TYPE;
                  v_utility_id   config.utilities.id%TYPE;
                  v_emittente_id anagrafiche.soggetti_ruoli.id%TYPE;
                  v_reseller_id  anagrafiche.soggetti_ruoli.id%TYPE;
                  v_serie        vendite.fatture.serie%TYPE;
                  v_termine_id   config.termini_pagamento.id%TYPE;
                  v_modalita_id  config.modalita_pagamento.id%TYPE;
              BEGIN
                  -- Guard: parametri obbligatori
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_attivita_id IS NULL OR p_attivita_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id/p_attivita_id', 'lotto_id', p_lotto_id, 'attivita_id', p_attivita_id),
                          NULL::uuid, 'p_lotto_id e p_attivita_id obbligatori e > 0'
                      );
                  END IF;

                  -- Chiave documento dall'attivita': undici elementi, e da qui
                  -- in giu' vanno usati tutti e undici.
                  v_key := vendite.fn_build_fattura_key(p_attivita_id);
                  v_ba_id        := (v_key->>'billing_account_id')::BIGINT;
                  v_tipo_doc_id  := (v_key->>'tipo_doc_fiscale_id')::BIGINT;
                  v_natura_id    := (v_key->>'natura_doc_id')::BIGINT;
                  v_valuta_id    := (v_key->>'valuta_id')::INTEGER;
                  v_emittente_id := (v_key->>'emittente_soggetto_ruolo_id')::BIGINT;
                  v_reseller_id  := NULLIF(v_key->>'reseller_soggetto_ruolo_id', '')::BIGINT;
                  v_utility_id   := NULLIF(v_key->>'utility_id', '')::INTEGER;
                  v_registro_id  := (v_key->>'registro_id')::BIGINT;
                  v_serie        := NULLIF(v_key->>'serie', '')::VARCHAR;
                  v_termine_id   := NULLIF(v_key->>'termine_pagamento_id', '')::BIGINT;
                  v_modalita_id  := NULLIF(v_key->>'modalita_pagamento_id', '')::INTEGER;

                  -- Completezza della chiave: si pretendono solo gli elementi
                  -- che NON possono legittimamente mancare. utility_id entra
                  -- nell'elenco perche' anagrafiche.billing_account.utility_id e'
                  -- NOT NULL: se qui arriva vuoto, la chiave e' rotta, non
                  -- «senza utility». Stesso ragionamento per natura_doc_id, che
                  -- e' NOT NULL su attivita_fatturabili. Termine e modalita'
                  -- restano fuori, e non e' una dimenticanza: la modalita' e'
                  -- NULL nella maggioranza dei casi (nessun default inventato,
                  -- finirebbe sulla FatturaPA) e il termine ha il default
                  -- TP_1RATA della catena — la sua assenza la presidia la Fase 4
                  -- al momento di generare le rate. E la SERIE resta fuori
                  -- perche' NULL e' il suo valore normale: significa «vale il
                  -- serie_default del registro».
                  IF v_ba_id IS NULL OR v_tipo_doc_id IS NULL OR v_natura_id IS NULL
                     OR v_valuta_id IS NULL
                     OR v_emittente_id IS NULL OR v_utility_id IS NULL OR v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_VALORE_MANCANTE',
                          jsonb_build_object('attivita_id', p_attivita_id, 'chiave', v_key),
                          NULL::uuid, concat('chiave documento incompleta per attivita_id ', p_attivita_id)
                      );
                  END IF;

                  -- Stato DRAFT
                  SELECT id INTO v_stato_doc_id
                    FROM config.stati_doc_fiscale
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE
                   ORDER BY id LIMIT 1;

                  IF v_stato_doc_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'DRAFT'),
                          NULL::uuid, 'stato DRAFT non trovato'
                      );
                  END IF;

                  -- Cerca fattura gia' nel lotto con la stessa chiave.
                  -- ⚠️ IS NOT DISTINCT FROM sui QUATTRO elementi nullable: con
                  -- `=` il NULL non combacia mai, quindi ogni giro aprirebbe una
                  -- fattura nuova per i casi — che sono la maggioranza — in cui
                  -- reseller, modalita' o serie non ci sono. E' la stessa
                  -- trappola dei NULL gia' pagata in 3b.0-b sul WHERE della
                  -- commessa e in 3b.4-bis sull'indice d'ambito, terza forma.
                  -- La NATURA invece usa `=`: e' NOT NULL, e un confronto
                  -- permissivo nasconderebbe sotto una uguaglianza un valore che
                  -- non puo' mancare.
                  SELECT f.id INTO v_fattura_id
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND f.billing_account_id = v_ba_id
                     AND f.tipo_doc_fiscale_id = v_tipo_doc_id
                     AND f.natura_doc_id = v_natura_id
                     AND f.valuta_id = v_valuta_id
                     AND f.emittente_soggetto_ruolo_id = v_emittente_id
                     AND f.reseller_soggetto_ruolo_id IS NOT DISTINCT FROM v_reseller_id
                     AND f.utility_id IS NOT DISTINCT FROM v_utility_id
                     AND f.registro_id = v_registro_id
                     AND f.serie IS NOT DISTINCT FROM v_serie
                     AND f.termine_pagamento_id IS NOT DISTINCT FROM v_termine_id
                     AND f.modalita_pagamento_id IS NOT DISTINCT FROM v_modalita_id
                   ORDER BY f.id LIMIT 1;

                  IF v_fattura_id IS NOT NULL THEN RETURN v_fattura_id; END IF;

                  -- Crea fattura + link lotto. Le colonne di testata sono il
                  -- secondo specchio: quello che la chiave ha deciso, qui si
                  -- scrive. ⚠️ `serie` compresa: e' la meta' che mancava.
                  INSERT INTO vendite.fatture (registro_id, data, tipo_doc_fiscale_id, natura_doc_id,
                      stato_doc_fiscale_id, serie,
                      emittente_soggetto_ruolo_id, billing_account_id, reseller_soggetto_ruolo_id,
                      utility_id, valuta_id, tasso_cambio,
                      termine_pagamento_id, modalita_pagamento_id, meta)
                  VALUES (v_registro_id, current_date, v_tipo_doc_id, v_natura_id,
                      v_stato_doc_id, v_serie,
                      v_emittente_id, v_ba_id, v_reseller_id,
                      v_utility_id, v_valuta_id, 1,
                      v_termine_id, v_modalita_id, jsonb_build_object('lotto_id', p_lotto_id))
                  RETURNING id INTO v_fattura_id;

                  INSERT INTO vendite.fatturazione_lotti_fatture (lotto_id, fattura_id, meta)
                  VALUES (p_lotto_id, v_fattura_id, jsonb_build_object('origine', 'bozza'));

                  RETURN v_fattura_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_fattura_header(bigint, bigint)
              IS 'Recupera o crea la testata DRAFT della fattura a cui l''attivita'' appartiene, dentro il lotto dato. Il WHERE del lookup e la INSERT nominano gli STESSI elementi della chiave di fn_build_fattura_key: se la chiave separa e il lookup no, le due meta'' si annullano e le attivita'' tornano nella stessa fattura. rev 2026-08-18 (brief-design-note-credito-resi N3): la chiave ha undici elementi, natura e serie compresi. ⚠️ `serie` non era MAI stata scritta da questa INSERT — restava NULL e fn_assign_numero_fattura cadeva sul serie_default del registro: calcolarla senza scriverla avrebbe dato alla nota di credito un numero VALIDO nella serie delle fatture, cioe'' un difetto che non solleva nulla e si scopre guardando un registro IVA. Confronto: `=` sulla natura (NOT NULL), IS NOT DISTINCT FROM sui quattro nullable (reseller, utility, serie, modalita''/termine).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Il rollback va fatto INSIEME a quello di -33 (ri-applicando
              --    20260804-20 e 20260801-04): chiave e lookup sono due meta'
              --    della stessa cosa, e disallinearle e' il difetto che questa
              --    slice presidia.
              SELECT 1;
