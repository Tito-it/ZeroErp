# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 2a (le testate): i montaggi
# di vendite.trgfn_doc_fornitura_guard_coppia
#   Brief: brief-db-grammatica-unica-documenti §11 (G-1, G-4 di Tid; L2-1).
#
#   Il primo argomento del trigger e' il documento nella grammatica delle
#   testate, che passa ai codici di config.sorgenti (DDT -> DDT_VENDITA,
#   ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO ->
#   RESO_VENDITA). Gli argomenti di un trigger si cambiano solo smontando e
#   rimontando: 1 montaggi, rigenerati da pg_get_triggerdef su dbdev
#   (2026-10-19) con il solo primo argomento cambiato. Stesso nome, fase,
#   eventi, WHEN e argomenti successivi. I montaggi con CONTRATTO,
#   PREVENTIVO, COMMESSA o FATTURA non cambiano e non si toccano.
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-76-remount-trg-doc-fornitura-guard-coppia-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-76-remount-trg-doc-fornitura-guard-coppia-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Rimonta i 1 montaggi di vendite.trgfn_doc_fornitura_guard_coppia col documento nel codice della sorgente. Grammatica unica, lotto 2a.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_utilities_a10_guard_coppia_ins_upd ON vendite.offerte_commerciali_utilities;
              CREATE TRIGGER trg_offerte_commerciali_utilities_a10_guard_coppia_ins_upd BEFORE INSERT OR UPDATE OF istanza_utility_id, utility_id, offerta_id ON vendite.offerte_commerciali_utilities FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_doc_fornitura_guard_coppia('OFFERTA_COMMERCIALE');

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_utilities_a10_guard_coppia_ins_upd ON vendite.offerte_commerciali_utilities;
              CREATE TRIGGER trg_offerte_commerciali_utilities_a10_guard_coppia_ins_upd BEFORE INSERT OR UPDATE OF istanza_utility_id, utility_id, offerta_id ON vendite.offerte_commerciali_utilities FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_doc_fornitura_guard_coppia('OFFERTA');

