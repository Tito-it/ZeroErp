# ------------------------------------------------------------
# E1 — vendite.fn_list_emittibili_lane: discovery delle CORSIE
# (emittente, tipo_doc_fiscale, competenza_mese) per il driver batch.
#
# Vedi brief-db-emittibili-lane-tipo-doc-fiscale.md. Approccio A3: nuova fn
# dedicata, fn_list_commesse_emittibili lasciata INTATTA.
#
# Decisioni (§4 del brief):
#  - criterio: stato_approvazione='APPROVATA' AND stato_emissione='NON_EMESSA'
#    (allineato alla pull fn_emit_attivita_fatturabili_da_commessa, only_approved=true).
#    NB: differenza con fn_list_commesse_emittibili, che NON filtra l'approvazione.
#  - tipo_doc_fiscale_id IS NULL escluso (il lotto lo richiede NOT NULL).
#  - competenza: filtro CUMULATIVO competenza_mese <= p_competenza_mese (coerente con
#    fn_select_attivita_fatturabili, che usa <=), e OUTPUT competenza_mese = max(...)
#    per coppia -> la competenza con cui il driver crea il lotto (la select <= spazza
#    poi tutti gli arretrati). Funziona anche con p_competenza_mese NULL (run-all).
#  - output count: total_candidate (righe candidate).
#  - STABLE, read-only; %TYPE; p_limit normalizzato; LIMIT sulle COPPIE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260619-01-create-fn-list-emittibili-lane-mctit.yaml

  - changeSet:
      id: 20260619-01-create-fn-list-emittibili-lane
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        E1: vendite.fn_list_emittibili_lane(competenza_mese, billing_account_id,
        utility_id, emittente_soggetto_ruolo_id, fatturazione_immediata, limit) ->
        TABLE(emittente_soggetto_ruolo_id, tipo_doc_fiscale_id, competenza_mese,
        total_candidate). Discovery read-only delle corsie (emittente, tipo_doc,
        competenza) per il driver batch. fn_list_commesse_emittibili intatta.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: vendite, tableName: commesse }
          - tableExists: { schemaName: vendite, tableName: commesse_attivita }
          - tableExists: { schemaName: vendite, tableName: stati_commessa }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- DROP difensivo (nuova fn; consente iterazioni in dev su RETURNS TABLE).
              DROP FUNCTION IF EXISTS vendite.fn_list_emittibili_lane(
                date, bigint, integer, bigint, boolean, integer
              );

              CREATE OR REPLACE FUNCTION vendite.fn_list_emittibili_lane(
                p_competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE        DEFAULT NULL::date,
                p_billing_account_id          vendite.commesse.billing_account_id%TYPE              DEFAULT NULL::bigint,
                p_utility_id                  vendite.commesse.utility_id%TYPE                       DEFAULT NULL::integer,
                p_emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE     DEFAULT NULL::bigint,
                p_fatturazione_immediata      vendite.commesse.fatturazione_immediata%TYPE          DEFAULT NULL::boolean,
                p_limit                       integer                                                DEFAULT 1000
              )
              RETURNS TABLE(
                emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                total_candidate             bigint
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo: rispondere al driver batch "quali coppie distinte
                --   (emittente, tipo_doc) hanno lavoro pronto da fatturare, e
                --   fino a quale competenza creare il lotto".
                -- Criteri:
                --   1. commessa in stato emittibile (stati_commessa.emittibile=true)
                --   2. righe commesse_attivita APPROVATA + NON_EMESSA (allineato pull)
                --   3. tipo_doc_fiscale_id NOT NULL (il lotto lo richiede)
                --   4. competenza CUMULATIVA: competenza_mese <= p_competenza_mese
                --      (coerente con fn_select_attivita_fatturabili); NULL = no limite
                --   5. filtri perimetro BA/utility/emittente; corsia fatturazione_immediata
                -- Output per coppia: competenza_mese = max(...), total_candidate = count(*).
                -- Regole: p_limit max 10000/default 1000; competenza normalizzata al mese;
                --   STABLE (read-only); LIMIT sulle COPPIE.
                -- =========================================================
                IF p_limit IS NULL OR p_limit <= 0 THEN
                  p_limit := 1000;
                END IF;
                IF p_limit > 10000 THEN
                  p_limit := 10000;
                END IF;

                v_competenza_mese := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                RETURN QUERY
                SELECT
                  c.emittente_soggetto_ruolo_id,
                  ca.tipo_doc_fiscale_id,
                  max(ca.competenza_mese)        AS competenza_mese,
                  count(ca.id)::bigint           AS total_candidate
                FROM vendite.commesse c
                JOIN vendite.stati_commessa sc
                  ON sc.id = c.stato_commessa_id
                 AND sc.emittibile = true
                INNER JOIN vendite.commesse_attivita ca
                  ON ca.commessa_id = c.id
                 AND ca.stato_emissione = 'NON_EMESSA'
                 AND ca.stato_approvazione = 'APPROVATA'
                 AND ca.tipo_doc_fiscale_id IS NOT NULL
                 AND (v_competenza_mese IS NULL OR ca.competenza_mese <= v_competenza_mese)
                WHERE true
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_utility_id IS NULL OR c.utility_id = p_utility_id)
                  AND (p_emittente_soggetto_ruolo_id IS NULL OR c.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                  AND (p_fatturazione_immediata IS NULL OR c.fatturazione_immediata = p_fatturazione_immediata)
                GROUP BY
                  c.emittente_soggetto_ruolo_id,
                  ca.tipo_doc_fiscale_id
                ORDER BY
                  c.emittente_soggetto_ruolo_id,
                  ca.tipo_doc_fiscale_id
                LIMIT p_limit;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_emittibili_lane(date, bigint, integer, bigint, boolean, integer)
              IS 'Read-only/STABLE: discovery delle corsie (emittente, tipo_doc_fiscale, competenza_mese) pronte da fatturare per il driver batch. Criterio APPROVATA+NON_EMESSA (allineato alla pull), tipo_doc NOT NULL, competenza cumulativa (<=) con output competenza_mese=max (competenza del lotto; la select <= spazza gli arretrati). Filtri perimetro + corsia fatturazione_immediata. fn_list_commesse_emittibili resta separata e invariata.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_list_emittibili_lane(
                date, bigint, integer, bigint, boolean, integer
              );
