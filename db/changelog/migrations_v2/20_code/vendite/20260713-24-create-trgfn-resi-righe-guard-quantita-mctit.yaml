# Slice RESI vendita — guard quantita su resi_righe (brief §4, §0.11).
#
# Non si rende piu' di quanto consegnato: Sigma quantita (base) dei resi
# NON-ANNULLATI sulla stessa ddt_riga_id <= ddt_righe.quantita (base).
# Lock FOR UPDATE serializzante (anti over-return concorrente), mirror di
# vendite.trgfn_ordini_ful_guard_consistenza.
#
# Fase a20: fira DOPO trg_resi_righe_a10_qta_from_operativa (che calcola la
# quantita base) -> confronta valori finali. Errore E_RESO_QTA_SUPERA_CONSEGNATO.
# L'editabilita' solo-DRAFT NON e' un guard DB (come sul DDT): la impone il BE
# via can_edit_righe (fn_available_actions_reso).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-24-create-trgfn-resi-righe-guard-quantita-mctit.yaml

  - changeSet:
      id: 20260713-24-create-trgfn-resi-righe-guard-quantita
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_righe_guard_quantita()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: guardia over-return su resi_righe. Sigma quantita (base)
              --   dei resi non-ANNULLATI sulla stessa ddt_riga_id <= consegnato
              --   (ddt_righe.quantita). Lock FOR UPDATE anti-concorrenza.
              DECLARE
                  v_consegnato vendite.ddt_righe.quantita%TYPE;
                  v_gia_reso   numeric;
                  v_residuo    numeric;
              BEGIN
                  -- 0) qta > 0 (difesa oltre al CHECK).
                  IF NEW.quantita IS NULL OR NEW.quantita <= 0 THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database','trgfn_resi_righe_guard_quantita','E_QTA_NON_POSITIVA',
                      jsonb_build_object('quantita', NEW.quantita),
                      NEW.tx_id, NEW.quantita::text);
                  END IF;

                  -- 1) Lock riga DDT sorgente + gruppo resi_righe sulla stessa
                  --    ddt_riga (serializza over-return concorrente).
                  PERFORM 1 FROM vendite.ddt_righe WHERE id = NEW.ddt_riga_id FOR UPDATE;
                  PERFORM 1 FROM vendite.resi_righe q WHERE q.ddt_riga_id = NEW.ddt_riga_id FOR UPDATE;

                  -- 2) Quantita consegnata di quella riga DDT (base).
                  SELECT quantita INTO v_consegnato
                    FROM vendite.ddt_righe WHERE id = NEW.ddt_riga_id;

                  -- 3) Somma resa sulla stessa riga DDT dai resi NON-ANNULLATI
                  --    (esclusa la riga corrente in UPDATE).
                  SELECT COALESCE(SUM(rr.quantita), 0)
                    INTO v_gia_reso
                    FROM vendite.resi_righe rr
                    JOIN vendite.resi r          ON r.id = rr.reso_id
                    JOIN config.stati_doc_reso s ON s.id = r.stato_doc_reso_id
                   WHERE rr.ddt_riga_id = NEW.ddt_riga_id
                     AND s.codice_interno <> 'ANNULLATO'
                     AND (TG_OP <> 'UPDATE' OR rr.id <> NEW.id);

                  v_residuo := v_consegnato - v_gia_reso;

                  IF NEW.quantita > v_residuo THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database','trgfn_resi_righe_guard_quantita','E_RESO_QTA_SUPERA_CONSEGNATO',
                      jsonb_build_object('ddt_riga_id', NEW.ddt_riga_id,
                                         'consegnato', v_consegnato,
                                         'gia_reso', v_gia_reso,
                                         'qta_nuova', NEW.quantita,
                                         'residuo', v_residuo),
                      NEW.tx_id,
                      NEW.ddt_riga_id::text, v_consegnato::text,
                      v_gia_reso::text, NEW.quantita::text, v_residuo::text);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_righe_guard_quantita()
              IS 'Guard over-return resi_righe: Sigma quantita non-ANNULLATI su ddt_riga <= consegnato (E_RESO_QTA_SUPERA_CONSEGNATO). Lock FOR UPDATE. Mirror trgfn_ordini_ful_guard_consistenza. Fase a20 (dopo qta_from_operativa). rev 2026-07-13.';

              DROP TRIGGER IF EXISTS trg_resi_righe_a20_guard_quantita_ins_upd ON vendite.resi_righe;
              CREATE TRIGGER trg_resi_righe_a20_guard_quantita_ins_upd
                BEFORE INSERT OR UPDATE OF quantita, qta_operativa, ddt_riga_id
                ON vendite.resi_righe
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_resi_righe_guard_quantita();
