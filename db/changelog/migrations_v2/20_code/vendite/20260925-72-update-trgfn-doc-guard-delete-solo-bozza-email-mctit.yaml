# vendite.trgfn_doc_guard_delete_solo_bozza — terzo adottante: la bozza email.
#   Brief: brief-db-email-visibilita-per-ambito §8 (decisione Tid 2026-09-25:
#   «una mail inviata non si cancella, la cancellazione e' solo in bozza»)
#   Corpo di partenza: letto dal database vivo (pg_get_functiondef).
#
# ── ⭐ PERCHE' QUESTO BUILDING BLOCK, e non un guard nuovo ──────────
#   «Un documento si cancella solo finche' e' in bozza» e' esattamente la
#   regola di Tid sulle mail: stesso significato, stessa frase
#   (E_DELETE_DOC_NON_BOZZA), stesso rimedio («non si elimina: si annulla»).
#   Una seconda funzione sarebbe una seconda sede della stessa regola.
#   ⚠️ Vive nello schema `vendite` perche' li' e' nata; montarla su una
#   tabella di `config` e' una dipendenza fra schemi dichiarata, non un
#   caso. Se il BB crescera' ancora, la sede giusta sara' `script`.
#
# ── IL RAMO ────────────────────────────────────────────────────────
#   Lo stato sta su OLD.stato, gia' codice: nessuna lettura, niente RLS.
#   Etichetta = l'oggetto, come nel lettore (20260925-71).
#
# ── ⛔ E CHIUDE LA PORTA DI SERVIZIO DEGLI ALLEGATI ──────────────────
#   La FK email_allegato → email_outbox e' ON DELETE CASCADE, e in un BEFORE
#   DELETE di riga innescato da un cascade la bozza risulta gia' cancellata:
#   il guard degli allegati non ne puo' leggere lo stato. Senza questo,
#   cancellare una bozza spedita sarebbe il modo di togliere al log i suoi
#   allegati senza che nessuno controllasse (brief §6.6).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260925-72-update-trgfn-doc-guard-delete-solo-bozza-email-mctit.yaml

  - changeSet:
      id: 20260925-72-update-trgfn-doc-guard-delete-solo-bozza-email
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_doc_guard_delete_solo_bozza impara config.email_outbox:
        una mail si elimina solo finche' e' una bozza DRAFT (decisione Tid
        2026-09-25). Chiude anche la porta del CASCADE verso gli allegati.
        Brief: brief-db-email-visibilita-per-ambito.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
               JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'trgfn_doc_guard_delete_solo_bozza'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_doc_guard_delete_solo_bozza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_documento text;
                v_stato     text;
                v_etichetta text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Un documento (DDT, ordine, bozza email) si cancella SOLO
                --   finche' e' in bozza. Regola di dominio, decisa da Tid il
                --   2026-08-26; la bozza email entra il 2026-09-25.
                --
                -- ⚠️ Nessuna lettura sotto RLS qui: lo stato sta su OLD, cioe'
                --    sulla riga che il chiamante sta gia' cancellando. Si
                --    legge solo il codice dello stato dal vocabolario, che
                --    RLS non ha (sulla bozza email lo stato e' gia' il codice).
                -- =========================================================
                IF TG_TABLE_NAME = 'ddt' THEN
                  v_documento := 'DDT';
                  v_etichetta := concat('DDT ', COALESCE(OLD.numero, '#' || OLD.id::text));
                  SELECT s.codice_interno::text
                    INTO v_stato
                    FROM config.stati_doc_ddt s
                   WHERE s.id = OLD.stato_doc_ddt_id;

                ELSIF TG_TABLE_NAME = 'ordini' THEN
                  v_documento := 'ORDINE';
                  v_etichetta := concat('Ordine ', COALESCE(OLD.numero, '#' || OLD.id::text));
                  SELECT s.codice_interno::text
                    INTO v_stato
                    FROM config.stati_doc_ordini s
                   WHERE s.id = OLD.stato_doc_ordine_id;

                ELSIF TG_TABLE_SCHEMA = 'config' AND TG_TABLE_NAME = 'email_outbox' THEN
                  -- rev 2026-09-25: la bozza email. Lo stato e' gia' il codice.
                  v_documento := 'EMAIL_BOZZA';
                  v_etichetta := concat('La mail «', left(OLD.oggetto, 80), '»');
                  v_stato     := OLD.stato::text;

                ELSE
                  -- Errore di MONTAGGIO, come nel gemello di riga.
                  PERFORM script.fn_log_and_raise_error(
                    'script', 'trgfn_doc_guard_delete_solo_bozza', 'E_DOC_TIPO_NON_GESTITO',
                    jsonb_build_object('table', TG_TABLE_NAME, 'id', OLD.id),
                    NULL::uuid,
                    TG_TABLE_NAME);
                END IF;

                -- ⚠️ IS DISTINCT FROM e non <>: se il vocabolario non
                --    restituisse lo stato (riga di stato mancante, che la FK
                --    non dovrebbe permettere) il guard RIFIUTA. Fail-closed:
                --    su un verbo distruttivo il default e' il no.
                IF v_stato IS DISTINCT FROM 'DRAFT' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'trgfn_doc_guard_delete_solo_bozza', 'E_DELETE_DOC_NON_BOZZA',
                    jsonb_build_object('table', TG_TABLE_NAME,
                                       'id', OLD.id,
                                       'documento', v_documento,
                                       'stato', v_stato),
                    NULL::uuid,
                    v_etichetta,
                    COALESCE(v_stato, '<sconosciuto>'));
                END IF;

                RETURN OLD;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il ramo email si toglie col corpo precedente: si riapplica il
              -- changeSet che l'aveva scritto. Il trigger di 20260925-74 va
              -- tolto prima.
              SELECT 1;
