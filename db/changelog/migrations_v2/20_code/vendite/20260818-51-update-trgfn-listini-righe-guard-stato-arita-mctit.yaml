# Arita' dei valori — `E_RIGA_LISTINO_VERSIONE_CHIUSA` passava 2 valori su 3 segnaposto
#   Brief: docs/it/dev/work-done/brief-db-segnaposti-messaggi-errore.md §7
#   Lotto: 20260818-47 .. -54, uno per funzione. Decisione Tid, 2026-08-18.
#
# ── IL DIFETTO, IN UNA RIGA ────────────────────────────────────────────
#   `script.fn_log_and_raise_error` compone il testo con
#   `format(messaggio, VARIADIC valori)`. Con MENO valori dei segnaposto,
#   `format()` non degrada: **alza `22023`**. E alza da DENTRO la funzione,
#   quindi il `RAISE` di dominio due righe sotto non viene mai eseguito —
#   niente `P0001`, niente codice nel canale `CONSTRAINT`, niente campo nel
#   canale `COLUMN`. Il guard blocca lo stesso (il dato resta integro, ed e'
#   il motivo per cui non se n'era accorto nessuno), ma il backend perde il
#   codice su cui decide 409/404/403 e l'operatore legge un errore interno al
#   posto della frase scritta per lui.
#
# ── ⚠️ IL VALORE MANCANTE C'ERA GIA' NEL CONTEXT ───────────────────────
#   `TG_OP` era gia' scritto nel `jsonb_build_object` sotto la chiave
#   `'operazione'`: il dato non mancava, mancava il passaggio. E' la stessa
#   forma vista nel cantiere del canale `COLUMN` (`20260808-05`) — il difetto
#   non e' «manca l'informazione», e' «manca l'ultimo passo».
#
# ── NOTE DI CASA ────────────────────────────────────────────────────────
#   · ⚠️ **PERMESSI — nessun prestito di proprieta', nessun `GRANT`.** Misurato
#     il 2026-08-18, non dedotto: questa funzione e' di **`titodb`** (che e' chi
#     migra), **non** e' `SECURITY DEFINER` e **non** e' nel registro
#     `dbops.sec_functions_owner`. Il precedente e' il `20260808-04` su
#     `script.fn_log_and_raise_error`, che documenta anche il perche' l'ACL
#     esplicita (`=X/titodb`, `zeroerp_app=X`, `zeroerp_batch_fatturazione=X`)
#     **sopravvive** a un `CREATE OR REPLACE` — sarebbe diverso con
#     `DROP` + `CREATE`, dove i privilegi si perdono e il loop di grant
#     `20260205-41` li rimetterebbe solo alla corsa `ci_apply` successiva.
#     ⚠️ Da non confondere con `script.fn_log_error_only`, che invece e' di
#     `postgres`, **e'** `SECURITY DEFINER` ed **e'** nel registro: quella,
#     riscriverla, il prestito lo richiede.
#   · Corpo dalla doc auto-gen `docs/it/dbzero/`, col `;` dopo `$function$`
#     aggiunto a mano: l'auto-gen non ce l'ha e senza quello il `COMMENT`
#     sotto da' «errore di sintassi a o presso COMMENT».
#   · Firma e `RETURNS` invariati: cambia solo la lista dei valori.
#   · Presidio: `db/pgtap/script/test-catalogo-messaggi-errore-completo.sql`
#     test 5. Rientra quando l'ultimo degli 8 changeSet e' applicato — e a
#     quel punto va tolta la riga di questo file da `baseline-rossi.tsv`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-51-update-trgfn-listini-righe-guard-stato-arita-mctit.yaml

  - changeSet:
      id: 20260818-51-update-trgfn-listini-righe-guard-stato-arita
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il ramo CHIUSA passava 2 valori a un messaggio con 3 segnaposto (mancava
        TG_OP, che era gia' nel context): format() alzava 22023 e l'errore di dominio
        non veniva sollevato. Il ramo E_RIGA_LISTINO_PROPAGATA, sotto, era gia' corretto.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_listini_righe_guard_stato'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: protezione righe listino in base allo stato della versione padre.
              --   BOZZA  → passa sempre
              --   ATTIVA → ammessa solo se la riga non e` propagata a valle
              --   CHIUSA → blocca sempre
              -- Perimetro: solo UPDATE e DELETE (INSERT su ATTIVA e` ammesso come rettifica).
              DECLARE
                  v_stato vendite.listini_versioni.stato%TYPE;
                  v_propagata boolean;
              BEGIN
                  -- Recupera stato della versione padre
                  SELECT lv.stato
                    INTO v_stato
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = OLD.listino_versione_id;

                  -- BOZZA: modifica libera
                  IF v_stato = 'BOZZA' THEN
                      RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                  END IF;

                  -- CHIUSA: blocca sempre
                  IF v_stato = 'CHIUSA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          -- ⚠️ ARITA' (2026-08-18): il messaggio comincia con «Operazione %s
                          --   non ammessa: ...» e di segnaposto ne ha TRE; qui ne arrivavano
                          --   due. Mancava proprio il primo, l'operazione — che il trigger
                          --   aveva gia' in mano (TG_OP) e metteva perfino nel context.
                          TG_OP, OLD.id::text, v_stato
                      );
                  END IF;

                  -- ATTIVA: verifica propagazione
                  -- Tabelle controllate per propagazione riga:
                  -- 1. vendite.commesse_attivita (listino_riga_id)
                  -- 2. vendite.attivita_fatturabili (listino_riga_id)
                  -- Per aggiungere nuove tabelle: UNION ALL qui sotto
                  SELECT EXISTS(
                      SELECT 1 FROM vendite.commesse_attivita
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.attivita_fatturabili
                       WHERE listino_riga_id = OLD.id
                  )
                  INTO v_propagata;

                  IF v_propagata THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_PROPAGATA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          OLD.id::text
                      );
                  END IF;

                  -- ATTIVA e non propagata: rettifica controllata ammessa
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato()
              IS 'Guard N6: protegge righe listino in base a stato versione. BOZZA=passa, ATTIVA=solo se non propagata, CHIUSA=blocca. Solo UPDATE/DELETE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Vuoto di proposito: il ripristino della versione precedente
              -- rimetterebbe in servizio la chiamata che alza 22023. Se serve
              -- tornare indietro, si scrive un changeSet in avanti.
              SELECT 1;
