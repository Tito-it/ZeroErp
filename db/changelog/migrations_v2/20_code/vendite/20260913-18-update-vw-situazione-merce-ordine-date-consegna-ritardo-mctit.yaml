# P-6 (3 di 4) — vendite.vw_situazione_merce_ordine:
#   + data_consegna_richiesta_cliente, data_consegna_confermata, giorni_ritardo
#   Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 5.2
#
# -- PERCHE' IL RITARDO STA QUI, E NON ALTROVE ---------------------------------
#   Il ritardo non e' «oggi > data richiesta»: e' «oggi > data di riferimento
#   E resta merce da spedire». Il residuo e la soglia dell'impegno vivono in
#   questa vista, che li calcola gia' (20260817-15, 20260818-06): metterlo
#   altrove significherebbe ricalcolarli, cioe' creare una seconda verita'
#   sul residuo. Ed e' anche il posto da cui si preme: il pannello situazione
#   merce dell'ordine (brief 5.5, voce 6).
#
# -- UNA SOLA VERITA' SUL RESIDUO: la LATERAL ds ------------------------------
#   giorni_ritardo legge da_spedire, e in una select list una colonna non
#   puo' leggerne un'altra. La formula del residuo (ordinato − Σ qta_evasa +
#   fn_ordine_riga_qta_riconsegna, solo se impegnata) esce dalla select list
#   e va in una CROSS JOIN LATERAL (ds), come gia' fanno `v.misurabile` e
#   `imp.impegnata`: la colonna da_spedire resta identica per posizione,
#   nome e tipo, e le due colonne leggono la STESSA espressione.
#
# -- LA DATA DI RIFERIMENTO: la promessa, e in sua assenza la richiesta ------
#   Il brief (5.2) scriveva «oggi > data richiesta»; il COMMENT di
#   data_consegna_confermata (20260913-06) dice che e' lei, col residuo, a
#   dare il ritardo. Le due frasi si conciliano sul modello: si e' in ritardo
#   rispetto a cio' a cui CI SI E' IMPEGNATI — se abbiamo confermato il 15
#   una richiesta per il 1°, il 10 non siamo in ritardo — e finche' non ci si
#   e' impegnati l'unica attesa e' quella del cliente. ⇒
#   COALESCE(data_consegna_confermata, data_consegna_richiesta_cliente).
#   ⚠️ E' una scelta di modello dichiarata nel brief (sezione 5.2, nota del
#   2026-09-13): se Tid preferisce la sola richiesta, cambia un COALESCE.
#
# -- LA POLARITA' DEI NULL, come nel resto della vista ----------------------
#   NULL = «non si applica»: da_spedire NULL (non impegnata) o zero (niente
#   da spedire), oppure nessuna data dichiarata. 0 = «c'e' da spedire e non
#   e' tardi». N > 0 = giorni di ritardo. «Non e' in ritardo» e «non c'e'
#   niente da spedire» sono due cose diverse (brief 5.2).
#
# -- CURRENT_DATE, e non script.fn_data_operativa() -----------------------------
#   E' un indicatore calcolato e non persistito, come anzianita_giorni di
#   vw_dash_backlog_documenti e is_scaduta di vw_offerte_commerciali_lista:
#   la convenzione «mai now() nudo» e' per le DATE DOCUMENTO che si scrivono.
#   fn_data_operativa() e' plpgsql e legge config.parameters: in una vista
#   sarebbe una chiamata per riga, per uno scarto di un giorno fra le 00:00 e
#   le 02:00 locali su un contatore di giorni. Dichiarato, non nascosto.
#
# -- CREATE OR REPLACE: colonne in ULTIMA posizione ---------------------------
#   PostgreSQL consente solo di appendere; il FROM puo' cambiare. Le
#   colonne esistenti restano identiche per posizione, nome e tipo
#   (da_spedire compresa: numeric).
#
# -- security_invoker=on RI-SPECIFICATA ------------------------------------
#   Senza, CREATE OR REPLACE VIEW la azzera. Presidiato sul merito da
#   db/pgtap/rls/test-rls-viste-security-invoker.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260913-18-update-vw-situazione-merce-ordine-date-consegna-ritardo-mctit.yaml

  - changeSet:
      id: 20260913-18-update-vw-situazione-merce-ordine-date-consegna-ritardo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_situazione_merce_ordine: + data_consegna_richiesta_cliente,
        data_consegna_confermata e giorni_ritardo (oggi - COALESCE(confermata, richiesta),
        solo se da_spedire > 0; NULL altrimenti, 0 se non in ritardo). La formula di
        da_spedire passa in una LATERAL letta da entrambe le colonne: una sola verita' sul
        residuo. security_invoker=on ri-specificata. Brief:
        brief-db-modifiche-certe-ciclo-vendita-e-articolo, sezione 5.2 (P-6).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_situazione_merce_ordine
            - columnExists:
                schemaName: vendite
                tableName: ordini_righe
                columnName: data_consegna_confermata
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_situazione_merce_ordine
              WITH (security_invoker=on) AS
              WITH soglia AS (
                       SELECT s.ordine AS ordine_confermato
                         FROM config.stati_doc_ordini s
                        WHERE s.codice_interno::text = 'CONFERMATO'::text
                      ), pm AS (
                       SELECT p.ordine_riga_id,
                          count(*)::integer AS partite_merce,
                          sum(p.consegnato) AS consegnato,
                          sum(p.reso) AS reso,
                          sum(p.in_riconsegna) AS in_riconsegna,
                          sum(p.tenuti) AS tenuti,
                          sum(p.fatturato_merce) AS fatturato_merce,
                          sum(p.fatturato_da_ordine) AS fatturato_da_ordine,
                          sum(p.differenza) AS differenza,
                          bool_and(p.misurabile) AS misurabile,
                          bool_or(p.origine::text = 'MULTIPLA'::text) AS ha_origine_multipla,
                          count(*) FILTER (WHERE p.differenza IS NOT NULL)::integer AS partite_con_conto
                         FROM vendite.vw_partite_merce p
                        WHERE p.ordine_riga_id IS NOT NULL AND NOT p.e_riconsegna
                        GROUP BY p.ordine_riga_id
                      ), ord AS (
                       SELECT f_1.riga_id AS ordine_riga_id,
                          f_1.quantita,
                          f_1.misurabile
                         FROM vendite.vw_af_merce_per_riga f_1
                        WHERE f_1.corsia::text = 'ORD'::text AND f_1.tipo_movimento::text = 'NORMALE'::text
                      ), ful AS (
                       SELECT f_1.ordine_riga_id,
                          sum(f_1.qta_evasa) AS evaso
                         FROM vendite.ordini_righe_fulfillment f_1
                        GROUP BY f_1.ordine_riga_id
                      )
               SELECT orr.id AS ordine_riga_id,
                  orr.ordine_id,
                  orr.riga_nr,
                  orr.articolo_id,
                  orr.quantita AS ordinato,
                  COALESCE(pm.consegnato, 0::numeric) AS consegnato,
                  COALESCE(pm.reso, 0::numeric) AS reso,
                  COALESCE(pm.in_riconsegna, 0::numeric) AS in_riconsegna,
                  COALESCE(pm.tenuti, 0::numeric) AS tenuti,
                  COALESCE(pm.fatturato_merce, 0::numeric) AS fatturato_merce,
                  COALESCE(pm.fatturato_da_ordine, 0::numeric) AS fatturato_da_ordine,
                  COALESCE(pm.fatturato_merce, 0::numeric) + COALESCE(pm.fatturato_da_ordine, 0::numeric) AS fatturato,
                  GREATEST(0::numeric, COALESCE(o.quantita, 0::numeric) - COALESCE(pm.fatturato_da_ordine, 0::numeric)) AS fatturato_anticipato,
                  ds.da_spedire,
                  COALESCE(pm.partite_merce, 0) AS partite_merce,
                  v.misurabile,
                      CASE
                          WHEN v.misurabile THEN pm.differenza
                          ELSE NULL::numeric
                      END AS differenza,
                      CASE
                          WHEN COALESCE(pm.partite_merce, 0) = 0 AND NOT imp.impegnata THEN 'NON_IMPEGNATA'::text
                          WHEN COALESCE(pm.partite_merce, 0) = 0 THEN 'NON_SPEDITA'::text
                          WHEN NOT v.misurabile THEN 'NON_MISURABILE'::text
                          WHEN pm.differenza IS NULL THEN 'NON_FATTURABILE'::text
                          WHEN pm.differenza > 0::numeric THEN 'DA_FATTURARE'::text
                          WHEN pm.differenza < 0::numeric THEN 'DA_ACCREDITARE'::text
                          ELSE 'PAREGGIATA'::text
                      END::character varying AS stato,
                  -- rev 2026-09-13 (P-6): le due date della riga e il RITARDO.
                  orr.data_consegna_richiesta_cliente,
                  orr.data_consegna_confermata,
                  -- giorni_ritardo: «oggi > data di riferimento E resta merce da spedire».
                  -- La data di riferimento e' la PROMESSA (confermata) se c'e', altrimenti
                  -- la richiesta del cliente. NULL quando da_spedire e' NULL o zero (non
                  -- impegnata, o niente da spedire) o quando nessuna data e' dichiarata;
                  -- 0 = c'e' da spedire e non e' tardi. Il residuo e' ds.da_spedire, la
                  -- STESSA espressione della colonna: una sola verita' sul residuo.
                      CASE
                          WHEN ds.da_spedire > 0::numeric
                               AND COALESCE(orr.data_consegna_confermata, orr.data_consegna_richiesta_cliente) IS NOT NULL
                          THEN GREATEST(0, CURRENT_DATE - COALESCE(orr.data_consegna_confermata, orr.data_consegna_richiesta_cliente))
                          ELSE NULL::integer
                      END AS giorni_ritardo
                 FROM vendite.ordini_righe orr
                   JOIN vendite.ordini o_rls ON o_rls.id = orr.ordine_id
                   JOIN config.stati_doc_ordini sdo ON sdo.id = o_rls.stato_doc_ordine_id
                   CROSS JOIN soglia sg
                   LEFT JOIN pm ON pm.ordine_riga_id = orr.id
                   LEFT JOIN ord o ON o.ordine_riga_id = orr.id
                   LEFT JOIN ful f ON f.ordine_riga_id = orr.id
                   CROSS JOIN LATERAL ( SELECT COALESCE(pm.misurabile, true) AND COALESCE(o.misurabile, true) AND NOT COALESCE(pm.ha_origine_multipla, false) AS misurabile) v
                   CROSS JOIN LATERAL ( SELECT COALESCE(sdo.ordine::integer, '-1'::integer) >= sg.ordine_confermato AND NOT sdo.is_abortito AS impegnata) imp
                   CROSS JOIN LATERAL ( SELECT
                              CASE
                                  WHEN imp.impegnata THEN GREATEST(0::numeric, orr.quantita - COALESCE(f.evaso, 0::numeric) + vendite.fn_ordine_riga_qta_riconsegna(orr.id))
                                  ELSE NULL::numeric
                              END AS da_spedire) ds
                WHERE orr.attivo IS TRUE;

              COMMENT ON VIEW vendite.vw_situazione_merce_ordine
              IS 'Aggregato PARLANTE per riga d''ordine, per il pannello situazione merce richiesta BE/FE del 2026-08-17; ragioni di disegno nelle intestazioni dei changeSet 20260817-15 e 20260818-06 e in dbzero/vendite/manual/vw_situazione_merce_ordine.md. Una riga per riga d''ordine ATTIVA, comprese quelle mai spedite — che vw_contatore_merce non contiene, ed erano 89 su 107. ⚠️ NON sostituisce vw_contatore_merce, che resta il contatore grezzo e dosa la fatturazione: questa gli sta accanto. `differenza` = Σ dei saldi delle PARTITE, con propagazione dei NULL (nessuna partita, o nessuna con un conto che si applica -> NULL, MAI zero: e'' la differenza fra «non si applica» e «non c''e'' nulla da fare»). Il fatturato in anticipo resta FUORI dal saldo, in `fatturato_anticipato`: ne discende che una riga fatturata alla conferma e spedita a meta'' esce PAREGGIATA e non «da accreditare», che sul contatore non era ottenibile senza rompere la parita''. ⚠️ `da_spedire` viene dalla formula del residuo GIA'' esistente (ordinato − Σ qta_evasa + fn_ordine_riga_qta_riconsegna), NON da ordinato − consegnato: le due divergono, perche'' il consegnato delle partite include le ri-consegne. Le righe di RI-CONSEGNA sono escluse (conterebbero due volte). origine MULTIPLA -> misurabile false: si dichiara, non si ripartisce. rev 2026-08-18 (20260818-06) — LA SOGLIA DELL''IMPEGNO, gemella della decisione D1 sul DDT: impegnata := stato dell''ordine >= soglia(CONFERMATO, per codice_interno) AND NOT is_abortito. Sotto soglia `da_spedire` e'' NULL e non un numero (su una bozza l''impegno non c''e'' ancora, su un ordine abortito non c''e'' piu'': «quanto resta da spedire» non si applica — erano 60 righe su 107 a dichiarare un arretrato che era un''intenzione) e `stato` e'' NON_IMPEGNATA. ⚠️ La riga NON sparisce: il pannello e'' per ordine e farla sparire renderebbe VUOTO il pannello di ogni bozza, cioe'' «non ho il permesso di saperlo» presentato come «non c''e'' nulla da fare». ⚠️ Le PARTITE hanno la precedenza: dove c''e'' merce uscita vince il verso del saldo anche su ordine annullato. ⚠️ Servono ENTRAMBE le clausole: ANNULLATO ha ordine 60 > 20, e su stati_doc_ordini la colonna `ordine` e'' un ordinamento di presentazione (EVASO 25 prima di ALLOCATO 30), non un ciclo di vita — assunzione inchiodata dal pgTAP. `stato` ha SETTE valori: NON_IMPEGNATA | NON_SPEDITA | NON_MISURABILE | NON_FATTURABILE | DA_FATTURARE | DA_ACCREDITARE | PAREGGIATA — i consumatori NON devono ri-tradurre il segno. security_invoker=on. ⭐ rev 2026-09-13 (P-6, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + data_consegna_richiesta_cliente, data_consegna_confermata e giorni_ritardo, in coda. Il ritardo sta QUI e non altrove perche'' non e'' «oggi > data richiesta»: e'' «oggi > data di riferimento E resta merce da spedire», e il residuo con la soglia dell''impegno vive gia'' in questa vista — metterlo altrove significherebbe ricalcolarlo, cioe'' una seconda verita'' sul residuo. Per questo la formula di da_spedire e'' passata in una LATERAL (ds) letta da entrambe le colonne. La data di riferimento e'' la PROMESSA (data_consegna_confermata) se c''e'', altrimenti la richiesta del cliente: si e'' in ritardo rispetto a cio'' a cui ci si e'' impegnati, e finche'' non ci si e'' impegnati l''unica attesa e'' quella del cliente. ⛔ giorni_ritardo e'' NULL quando da_spedire e'' NULL o zero, o nessuna data e'' dichiarata: «non e'' in ritardo» (0) e «non c''e'' niente da spedire» (NULL) sono due cose diverse, e questa vista ha gia'' la disciplina di non confonderle. CURRENT_DATE come in vw_dash_backlog_documenti.anzianita_giorni: e'' un indicatore non persistito, non una data documento. In ultima posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere; vendite_repository proietta 22 nomi e le tre vanno aggiunte (brief 5.5, voce 6).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_situazione_merce_ordine;
              CREATE VIEW vendite.vw_situazione_merce_ordine
              WITH (security_invoker=on) AS
              WITH soglia AS (
                       SELECT s.ordine AS ordine_confermato
                         FROM config.stati_doc_ordini s
                        WHERE s.codice_interno::text = 'CONFERMATO'::text
                      ), pm AS (
                       SELECT p.ordine_riga_id,
                          count(*)::integer AS partite_merce,
                          sum(p.consegnato) AS consegnato,
                          sum(p.reso) AS reso,
                          sum(p.in_riconsegna) AS in_riconsegna,
                          sum(p.tenuti) AS tenuti,
                          sum(p.fatturato_merce) AS fatturato_merce,
                          sum(p.fatturato_da_ordine) AS fatturato_da_ordine,
                          sum(p.differenza) AS differenza,
                          bool_and(p.misurabile) AS misurabile,
                          bool_or(p.origine::text = 'MULTIPLA'::text) AS ha_origine_multipla,
                          count(*) FILTER (WHERE p.differenza IS NOT NULL)::integer AS partite_con_conto
                         FROM vendite.vw_partite_merce p
                        WHERE p.ordine_riga_id IS NOT NULL AND NOT p.e_riconsegna
                        GROUP BY p.ordine_riga_id
                      ), ord AS (
                       SELECT f_1.riga_id AS ordine_riga_id,
                          f_1.quantita,
                          f_1.misurabile
                         FROM vendite.vw_af_merce_per_riga f_1
                        WHERE f_1.corsia::text = 'ORD'::text AND f_1.tipo_movimento::text = 'NORMALE'::text
                      ), ful AS (
                       SELECT f_1.ordine_riga_id,
                          sum(f_1.qta_evasa) AS evaso
                         FROM vendite.ordini_righe_fulfillment f_1
                        GROUP BY f_1.ordine_riga_id
                      )
               SELECT orr.id AS ordine_riga_id,
                  orr.ordine_id,
                  orr.riga_nr,
                  orr.articolo_id,
                  orr.quantita AS ordinato,
                  COALESCE(pm.consegnato, 0::numeric) AS consegnato,
                  COALESCE(pm.reso, 0::numeric) AS reso,
                  COALESCE(pm.in_riconsegna, 0::numeric) AS in_riconsegna,
                  COALESCE(pm.tenuti, 0::numeric) AS tenuti,
                  COALESCE(pm.fatturato_merce, 0::numeric) AS fatturato_merce,
                  COALESCE(pm.fatturato_da_ordine, 0::numeric) AS fatturato_da_ordine,
                  COALESCE(pm.fatturato_merce, 0::numeric) + COALESCE(pm.fatturato_da_ordine, 0::numeric) AS fatturato,
                  GREATEST(0::numeric, COALESCE(o.quantita, 0::numeric) - COALESCE(pm.fatturato_da_ordine, 0::numeric)) AS fatturato_anticipato,
                      CASE
                          WHEN imp.impegnata THEN GREATEST(0::numeric, orr.quantita - COALESCE(f.evaso, 0::numeric) + vendite.fn_ordine_riga_qta_riconsegna(orr.id))
                          ELSE NULL::numeric
                      END AS da_spedire,
                  COALESCE(pm.partite_merce, 0) AS partite_merce,
                  v.misurabile,
                      CASE
                          WHEN v.misurabile THEN pm.differenza
                          ELSE NULL::numeric
                      END AS differenza,
                      CASE
                          WHEN COALESCE(pm.partite_merce, 0) = 0 AND NOT imp.impegnata THEN 'NON_IMPEGNATA'::text
                          WHEN COALESCE(pm.partite_merce, 0) = 0 THEN 'NON_SPEDITA'::text
                          WHEN NOT v.misurabile THEN 'NON_MISURABILE'::text
                          WHEN pm.differenza IS NULL THEN 'NON_FATTURABILE'::text
                          WHEN pm.differenza > 0::numeric THEN 'DA_FATTURARE'::text
                          WHEN pm.differenza < 0::numeric THEN 'DA_ACCREDITARE'::text
                          ELSE 'PAREGGIATA'::text
                      END::character varying AS stato
                 FROM vendite.ordini_righe orr
                   JOIN vendite.ordini o_rls ON o_rls.id = orr.ordine_id
                   JOIN config.stati_doc_ordini sdo ON sdo.id = o_rls.stato_doc_ordine_id
                   CROSS JOIN soglia sg
                   LEFT JOIN pm ON pm.ordine_riga_id = orr.id
                   LEFT JOIN ord o ON o.ordine_riga_id = orr.id
                   LEFT JOIN ful f ON f.ordine_riga_id = orr.id
                   CROSS JOIN LATERAL ( SELECT COALESCE(pm.misurabile, true) AND COALESCE(o.misurabile, true) AND NOT COALESCE(pm.ha_origine_multipla, false) AS misurabile) v
                   CROSS JOIN LATERAL ( SELECT COALESCE(sdo.ordine::integer, '-1'::integer) >= sg.ordine_confermato AND NOT sdo.is_abortito AS impegnata) imp
                WHERE orr.attivo IS TRUE;
              COMMENT ON VIEW vendite.vw_situazione_merce_ordine
              IS 'Aggregato PARLANTE per riga d''ordine, per il pannello situazione merce richiesta BE/FE del 2026-08-17; ragioni di disegno nelle intestazioni dei changeSet 20260817-15 e 20260818-06 e in dbzero/vendite/manual/vw_situazione_merce_ordine.md. Una riga per riga d''ordine ATTIVA, comprese quelle mai spedite — che vw_contatore_merce non contiene, ed erano 89 su 107. ⚠️ NON sostituisce vw_contatore_merce, che resta il contatore grezzo e dosa la fatturazione: questa gli sta accanto. `differenza` = Σ dei saldi delle PARTITE, con propagazione dei NULL (nessuna partita, o nessuna con un conto che si applica -> NULL, MAI zero: e'' la differenza fra «non si applica» e «non c''e'' nulla da fare»). Il fatturato in anticipo resta FUORI dal saldo, in `fatturato_anticipato`: ne discende che una riga fatturata alla conferma e spedita a meta'' esce PAREGGIATA e non «da accreditare», che sul contatore non era ottenibile senza rompere la parita''. ⚠️ `da_spedire` viene dalla formula del residuo GIA'' esistente (ordinato − Σ qta_evasa + fn_ordine_riga_qta_riconsegna), NON da ordinato − consegnato: le due divergono, perche'' il consegnato delle partite include le ri-consegne. Le righe di RI-CONSEGNA sono escluse (conterebbero due volte). origine MULTIPLA -> misurabile false: si dichiara, non si ripartisce. rev 2026-08-18 (20260818-06) — LA SOGLIA DELL''IMPEGNO, gemella della decisione D1 sul DDT: impegnata := stato dell''ordine >= soglia(CONFERMATO, per codice_interno) AND NOT is_abortito. Sotto soglia `da_spedire` e'' NULL e non un numero (su una bozza l''impegno non c''e'' ancora, su un ordine abortito non c''e'' piu'': «quanto resta da spedire» non si applica — erano 60 righe su 107 a dichiarare un arretrato che era un''intenzione) e `stato` e'' NON_IMPEGNATA. ⚠️ La riga NON sparisce: il pannello e'' per ordine e farla sparire renderebbe VUOTO il pannello di ogni bozza, cioe'' «non ho il permesso di saperlo» presentato come «non c''e'' nulla da fare». ⚠️ Le PARTITE hanno la precedenza: dove c''e'' merce uscita vince il verso del saldo anche su ordine annullato. ⚠️ Servono ENTRAMBE le clausole: ANNULLATO ha ordine 60 > 20, e su stati_doc_ordini la colonna `ordine` e'' un ordinamento di presentazione (EVASO 25 prima di ALLOCATO 30), non un ciclo di vita — assunzione inchiodata dal pgTAP. `stato` ha SETTE valori: NON_IMPEGNATA | NON_SPEDITA | NON_MISURABILE | NON_FATTURABILE | DA_FATTURARE | DA_ACCREDITARE | PAREGGIATA — i consumatori NON devono ri-tradurre il segno. security_invoker=on.';
