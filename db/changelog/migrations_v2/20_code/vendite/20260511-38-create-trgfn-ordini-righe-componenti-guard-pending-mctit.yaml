# ------------------------------------------------------------
# Guard L3 per ordini_righe_componenti: blocca modifiche ai
# campi struttura quando stato_approvazione_prezzo = PENDING.
# Pattern simmetrico a trgfn_preventivi_righe_componenti_guard_pending.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-38-create-trgfn-ordini-righe-componenti-guard-pending-mctit.yaml

  # --- Funzione guard_pending ----------------------------------------
  - changeSet:
      id: 20260511-38-01-create-trgfn-ordrighe-comp-guard-pending
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Crea vendite.trgfn_ordini_righe_componenti_guard_pending.
        BEFORE UPDATE: quando stato_approvazione_prezzo = PENDING,
        blocca modifiche ai campi struttura del componente (denylist).
        Allowlist: stato_approvazione_prezzo, pratica_approvazione_prezzo_id,
        meta, audit (data_update/user_update).
        Raise E_COMPONENTE_PREZZO_PENDENTE (id=439).
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: ordini_righe_componenti
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ordini_righe_componenti_guard_pending()
              RETURNS TRIGGER
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                  -- Scopo:
                  --   Quando un componente BoM CASO A ha stato_approvazione_prezzo =
                  --   'PENDING' (richiesta L3 out-of-policy in attesa di esito),
                  --   bloccare modifiche ai campi struttura.
                  --   L'approvatore L3 decide SULLA RIGA ESATTA proposta.
                  --
                  -- Allowlist modificabile in PENDING:
                  --   stato_approvazione_prezzo, pratica_approvazione_prezzo_id,
                  --   meta, data_update, user_update (audit automatico).
                  --
                  -- Denylist (tutti gli altri campi struttura):
                  --   riga_ordine_id, articolo_componente_id, componente_id,
                  --   coeff_qta_snapshot, quantita, uom_operativa_id,
                  --   factor_to_base, qta_operativa, prezzo_unitario, iva_id,
                  --   origine_prezzo, ordine, attivo.

                  IF OLD.stato_approvazione_prezzo IS DISTINCT FROM
                     'PENDING'::config.stato_approvazione_prezzo
                  THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.riga_ordine_id             IS DISTINCT FROM OLD.riga_ordine_id
                  OR NEW.articolo_componente_id     IS DISTINCT FROM OLD.articolo_componente_id
                  OR NEW.componente_id              IS DISTINCT FROM OLD.componente_id
                  OR NEW.coeff_qta_snapshot         IS DISTINCT FROM OLD.coeff_qta_snapshot
                  OR NEW.quantita                   IS DISTINCT FROM OLD.quantita
                  OR NEW.uom_operativa_id           IS DISTINCT FROM OLD.uom_operativa_id
                  OR NEW.factor_to_base             IS DISTINCT FROM OLD.factor_to_base
                  OR NEW.qta_operativa              IS DISTINCT FROM OLD.qta_operativa
                  OR NEW.prezzo_unitario            IS DISTINCT FROM OLD.prezzo_unitario
                  OR NEW.iva_id                     IS DISTINCT FROM OLD.iva_id
                  OR NEW.origine_prezzo             IS DISTINCT FROM OLD.origine_prezzo
                  OR NEW.ordine                     IS DISTINCT FROM OLD.ordine
                  OR NEW.attivo                     IS DISTINCT FROM OLD.attivo
                  THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME,
                          'E_COMPONENTE_PREZZO_PENDENTE',
                          jsonb_build_object(
                              'componente_id',    OLD.id,
                              'riga_ordine_id',   OLD.riga_ordine_id,
                              'hint', 'Attendi esito approvazione (APPROVED/REJECTED) '
                                   || 'prima di modificare il componente.'
                          ),
                          NULL::uuid,
                          OLD.id::text
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ordini_righe_componenti_guard_pending()
              IS 'BEFORE UPDATE guard L3 su ordini_righe_componenti: blocca modifiche ai '
                 'campi struttura quando stato_approvazione_prezzo=PENDING. Pattern simmetrico '
                 'a trgfn_preventivi_righe_componenti_guard_pending. Raise E_COMPONENTE_PREZZO_PENDENTE.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS vendite.trgfn_ordini_righe_componenti_guard_pending();

  # --- Trigger BEFORE UPDATE su ordini_righe_componenti ----------------
  - changeSet:
      id: 20260511-38-02-trg-ordrighe-comp-a10-guard-pending
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        BEFORE UPDATE: guard L3 PENDING su ordini_righe_componenti.
        Blocca modifiche a campi struttura quando stato=PENDING.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'trgfn_ordini_righe_componenti_guard_pending';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ordini_righe_componenti_a10_guard_pending_upd
                  ON vendite.ordini_righe_componenti;

              CREATE TRIGGER trg_ordini_righe_componenti_a10_guard_pending_upd
                  BEFORE UPDATE
                  ON vendite.ordini_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_ordini_righe_componenti_guard_pending();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_ordini_righe_componenti_a10_guard_pending_upd
                  ON vendite.ordini_righe_componenti;
