                         (b.k || '#')::character varying AS k_dies,   -- la prima chiave con suffisso
                         (b.k || '$')::character varying AS k_hi      -- il primo byte DOPO '#'
                    FROM (SELECT DISTINCT split_part(u.k, '#', 1)::character varying AS k
                            FROM unnest(p_segment_keys) AS u(k)
                           WHERE u.k IS NOT NULL AND u.k <> '') b
              ), ca_in AS (
                  -- Le attivita' di commessa: quelle delle chiavi, o tutte.
                  SELECT ca.id, ca.segment_key, ca.meta, ca.stato_emissione
                    FROM chiavi s
                    JOIN vendite.commesse_attivita ca
                      -- ⭐ rev 2026-10-10 (20261010-81): l'UGUAGLIANZA sulla base e'
                      --   la condizione con cui si entra nell'indice. Il predicato di
                      --   prima resta come filtro residuo, e la implica (chiave esatta
                      --   o «comincia per k#» => base = k): risultati identici per
                      --   costruzione. Perche': con il seme come PARAMETRO (piano
                      --   generico) l'intervallo era stimato all'11 % della tabella per
                      --   chiave e perdeva contro la scansione intera sotto la policy.
