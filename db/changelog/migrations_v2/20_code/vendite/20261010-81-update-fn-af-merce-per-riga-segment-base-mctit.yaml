# fn_af_merce_per_riga ENTRA DALLA BASE DEL SEGMENTO
#   vendite.fn_af_merce_per_riga(character varying[])
#   Brief: brief-db-segment-base-commesse-attivita (P-2).
#
# ── COSA CAMBIA ─────────────────────────────────────────────────────
#   Solo il join di ca_in: `ca.segment_base = s.k AND (<predicato di prima>)`.
#   Il predicato di prima — chiave esatta, o intervallo [k#, k$) — implica
#   segment_base = k (k e' gia' la base: niente '#'), quindi l'aggiunta non
#   toglie righe: risultati identici per costruzione. L'uguaglianza e' la
#   clausola con cui il pianificatore entra nell'indice
#   ix_commesse_attivita_segment_base (20261010-80), anche nel piano generico.
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Dentro la capability del DDT la diagnosi gira col piano generico, e li'
#   le chiavi sono un parametro: l'intervallo veniva stimato all'11 % della
#   tabella per chiave, e la tabella si leggeva per intero con la policy su
#   ogni riga. Fatto datato 2026-10-10, dbdev come app: con 2 chiavi
#   letterali 1,6 ms, come parametro ~20 ms.
#
# Corpo di partenza: 20260921-51 (unica revisione; doc auto-generata
#   confrontata). Firma e RETURNS TABLE invariati, %TYPE compresi.
# ------------------------------------------------------------

