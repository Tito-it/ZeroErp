# DB-12 (seconda parte) — VIA IL `mese` DAL RETURNS
#   vendite.fn_numera_fattura_opz_emessa — DROP + CREATE
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §4 DB-12
#
# ── ⛔ PERCHE' UN `DROP` E NON UN `CREATE OR REPLACE` ───────────────
#   Togliere una colonna dal `RETURNS TABLE` cambia il tipo di ritorno, e
#   PostgreSQL risponde «cannot change return type of existing function». Serve
#   `DROP` + `CREATE`. ⚠️ Firma invariata `(bigint, boolean, character varying)`:
#   e' una revisione, non un overload.
#
# ── ⛔ QUESTO FILE VA PRIMA DEL 18, E L'ORDINE NON E' ARBITRARIO ────
#   Le due funzioni si toccano: questa chiama `fn_assign_numero_fattura`.
#     · togliendo `mese` PRIMA di qui (cioe' dal 18) e poi da qui, ci sarebbe un
#       momento in cui questa funzione fa `SELECT t.mese FROM
#       fn_assign_numero_fattura(...) t` su una funzione che quella colonna non
#       ce l'ha piu': **errore a runtime**;
#     · togliendolo PRIMA di qui, questa smette di chiedere `t.mese` mentre
#       l'altra ancora lo espone — e selezionare 4 colonne su 5 e' legittimo.
#   ⭐ Quindi: **17 la chiamante, 18 la chiamata**. Nessuna finestra rotta,
#   nemmeno dentro il migrate.
#
# ── ✅ NESSUN CONSUMATORE LEGGE `mese`, verificato uno per uno ──────
#   · `pipeline_repository.py:1960` — `SELECT vendite.fn_numera_fattura_opz_emessa(%s)`
#     in forma scalare, non legge nulla;
#   · `pipeline_repository.py:2106` (backstop stampa) — `SELECT * FROM …` seguito
#     da `cursor.fetchall()` per drenare il result set;
#   · `test-numera-fattura-opz-emessa.sql` — legge **per nome** (`numero`);
#   · `test-numera-nota-credito-riferimento-v1.sql` — `PERFORM`.
#   Nessuno legge per posizione, nessuno nomina `mese`.
#
# ── ℹ️ CADE ANCHE IL JOIN SUL REGISTRO ──────────────────────────────
#   Serviva solo a portare `r.reset_policy`. ⚠️ Era un INNER JOIN, quindi in
#   teoria filtrava — in pratica mai: `registro_id` e' `NOT NULL` con una FK, e
#   il registro esiste sempre. Con lui cade `v_data`, che era usata solo dentro
#   il `CASE` del mese.
#
# ── ⛔ COSA NON E' CAMBIATO ─────────────────────────────────────────
#   Tutto il resto e' il corpo vivo del 2026-08-24 (rev T-3b), ripreso dalla doc
#   auto-gen: il ritorno idempotente, la guardia
#   `E_FATTURA_RETTIFICATA_SENZA_NUMERO` col suo predicato PER RIGA e
#   fail-closed sulla visibilita', il bersaglio a due ruoli con i JOIN interni
#   contro i LEFT del predicato, il conteggio nella frase. ⚠️ In particolare la
#   guardia resta DOPO il ritorno idempotente.
#
# Dipendenze: nessuna sullo schema. ⚠️ Va applicato nella STESSA passata del
#             20260825-18, o resta una funzione che espone 4 colonne chiamandone
#             una che ne espone 5 — che funziona, ma e' uno stato a meta'.
# Verifica: db/pgtap/vendite/test-numera-fattura-opz-emessa.sql (invariato),
#           test-numera-nota-credito-riferimento-v1.sql (invariato)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260825-17-recreate-fn-numera-fattura-opz-emessa-senza-mese-mctit.yaml

  - changeSet:
      id: 20260825-17-recreate-fn-numera-fattura-opz-emessa-senza-mese
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-12: `mese` esce dal RETURNS TABLE, e con lui l'ultima lettura di reset_policy in
        questa funzione (piu' il JOIN sul registro che la portava e la variabile v_data che
        serviva solo al CASE). DROP + CREATE perche' il tipo di ritorno cambia; firma
        invariata, quindi revisione e non overload. ⛔ Questo file va PRIMA del 20260825-18 e
        l'ordine non e' arbitrario: qui si smette di chiedere t.mese mentre la funzione
        chiamata ancora lo espone — selezionare 4 colonne su 5 e' legittimo, il contrario e'
        un errore a runtime. ✅ Nessun consumatore legge mese: verificati uno per uno i due
        punti del backend (uno scalare, uno che drena) e i due pgTAP (leggono per nome o fanno
        PERFORM).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'fn_numera_fattura_opz_emessa';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_numera_fattura_opz_emessa(bigint, boolean, character varying);

              CREATE OR REPLACE FUNCTION vendite.fn_numera_fattura_opz_emessa(
                  p_fattura_id            vendite.fatture.id%TYPE,
                  p_set_emessa            boolean DEFAULT true,
                  p_codice_interno_emessa config.stati_doc_fiscale.codice_interno%TYPE DEFAULT 'EMESSA'
              )
               RETURNS TABLE(registro_id bigint, anno smallint, serie character varying, numero bigint)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- ⚠️ `BOOLEAN` esplicito: e' l'esito di un controllo, non il valore
                  --    di una colonna.
                  v_is_numbered  BOOLEAN;
                  v_registro_id  vendite.fatture.registro_id%TYPE;
                  v_anno         vendite.fatture.anno%TYPE;
                  v_serie        vendite.fatture.serie%TYPE;
                  v_numero       vendite.fatture.numero%TYPE;
                  v_stato_emessa_id config.stati_doc_fiscale.id%TYPE;
                  -- ⚠️ `integer` e `text` espliciti: sono un CONTEGGIO e un'ETICHETTA, non il
                  --    valore di una colonna. Non c'e' niente da ancorare, e va detto invece
                  --    di sembrare una dimenticanza.
                  --
                  -- ⭐ Dal 24-08-2026 `v_n_bloccanti` non e' piu' solo diagnostica: e' il
                  --    valore che riempie l'unico segnaposto del messaggio 937. Il conteggio
                  --    e' l'unica cosa che la frase puo' dire su QUANTI documenti mancano
                  --    quando i pulsanti sono al massimo cinque (linee-guida-sql §5).
                  v_n_bloccanti     integer;
                  -- ⭐ E `v_primo_bloccante` non e' piu' nella frase: resta nel context, cioe'
                  --    in dbops.error_log, per chi diagnostica. Due lettori, due canali.
                  v_primo_bloccante text;
                  -- Il BERSAGLIO: l'array di {tipo,id} che il frontend trasforma in
                  -- pulsanti. `jsonb` perche' e' la forma del context, non una colonna.
                  v_bersagli        jsonb;
              BEGIN
                  -- ⭐ rev 2026-08-25 (DB-12): `mese` e' uscito dal RETURNS TABLE.
                  --    Era calcolato da `reset_policy`, che ammetteva tre valori e
                  --    ne implementava uno; e nessun consumatore lo leggeva —
                  --    il backend drena il result set, i pgTAP leggono per nome.
                  --    Con lui sono caduti `v_reset`, `v_data` e il JOIN sul
                  --    registro, che serviva solo a portare reset_policy.

                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_numera_fattura_opz_emessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                  END IF;

                  IF p_set_emessa IS TRUE AND (p_codice_interno_emessa IS NULL OR btrim(p_codice_interno_emessa) = '') THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_numera_fattura_opz_emessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_codice_interno_emessa', 'valore', p_codice_interno_emessa),
                          NULL::uuid, 'p_codice_interno_emessa obbligatorio se p_set_emessa=true');
                  END IF;

                  -- Lock riga fattura (solo la riga fattura, alias f)
                  --
                  -- ⭐ E' ANCHE IL CANCELLO DI VISIBILITA' SU CUI POGGIA IL PRIMO BERSAGLIO:
                  --    la RLS e' attiva e la funzione e' SECURITY INVOKER, quindi una fattura
                  --    fuori dal perimetro di chi opera qui non si trova e si esce con
                  --    E_FATTURA_NON_TROVATA. Arrivare alla guardia significa che
                  --    `p_fattura_id` e' un documento che chi opera puo' aprire.
                  -- ⚠️ rev 2026-08-25: niente piu' JOIN su registri_fatturazione. Serviva solo
                  --    a portare reset_policy; era un INNER JOIN e in teoria filtrava, in
                  --    pratica mai (registro_id e' NOT NULL con una FK).
                  SELECT f.numero IS NOT NULL, f.registro_id, f.anno, f.serie, f.numero
                    INTO v_is_numbered, v_registro_id, v_anno, v_serie, v_numero
                    FROM vendite.fatture f
                   WHERE f.id = p_fattura_id FOR UPDATE OF f;

                  IF v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_numera_fattura_opz_emessa', 'E_FATTURA_NON_TROVATA',
                          jsonb_build_object('fattura_id', p_fattura_id), NULL::uuid, p_fattura_id::text);
                  END IF;

                  -- Idempotente: se gia' numerata ritorna valori correnti
                  IF v_is_numbered THEN
                      RETURN QUERY SELECT v_registro_id, v_anno, v_serie, v_numero;
                      RETURN;
                  END IF;

                  -- --------------------------------------------------
                  -- ⛔ IL RIFERIMENTO FISCALE DEVE ESISTERE PRIMA.
                  --    Un documento che RETTIFICA le righe di un'altra fattura non si puo'
                  --    numerare finche' quella fattura non ha un numero.
                  --
                  -- ⚠️ NON e' una questione di cronologia. Una nota di credito deve citare
                  --    numero e data del documento corretto nel blocco DatiFattureCollegate
                  --    della fattura elettronica (TD04): con il documento rettificato ancora
                  --    senza numero quel blocco non e' compilabile, e la nota nascerebbe
                  --    gia' inadatta a partire verso lo SDI. Il rifiuto arriva PRIMA di
                  --    consumare un numero, che e' l'unica cosa che non si torna indietro.
                  --
                  -- ⚠️ IL PREDICATO E' PER RIGA, NON PER DOCUMENTO: una nota di credito puo'
                  --    rettificare righe di fatture DIVERSE, e basta che UNA sia senza
                  --    numero perche' il blocco fiscale resti incompleto.
                  --
                  -- ⭐ E NON GUARDA LA NATURA. Sarebbe stato naturale scrivere «se natura =
                  --    NOTA_CREDITO allora...», ed e' sbagliato per due motivi: una nota di
                  --    DEBITO che rettifica ha lo stesso identico problema, e una fattura
                  --    ordinaria non ha righe con riga_rettificata_id — quindi il predicato
                  --    sulle righe copre tutti i casi senza mai bloccare quelli normali.
                  --    Il legame e' quello che esiste dalla generazione delle righe; il
                  --    ponte documentale vendite.fatture_rettifiche lo popola un task che
                  --    gira DOPO questa funzione, quindi qui sarebbe sempre vuoto.
                  --
                  -- ⛔ FAIL-CLOSED SULLA VISIBILITA'. vendite.fatture e vendite.fatture_righe
                  --    hanno la RLS e questa funzione e' SECURITY INVOKER: una fattura
                  --    rettificata fuori dal perimetro emittente di chi opera si legge come
                  --    «non c'e'». I JOIN sono quindi LEFT e la riga senza padre visibile
                  --    CONTA COME BLOCCANTE: il predicato non e' «risulta non numerata», e'
                  --    «non posso dimostrare che sia numerata». Con dei JOIN interni uno zero
                  --    avrebbe voluto dire «via libera» proprio nel caso in cui non si sa.
                  --
                  -- ⭐ 24-08-2026: `v_n_bloccanti` e' anche il valore che va nella frase.
                  --    Un padre invisibile entra quindi nel CONTEGGIO ma non nel bersaglio,
                  --    ed e' coerente: la frase dice quanti documenti mancano, i pulsanti
                  --    dicono dove si puo' andare. Sono due domande diverse, come i due
                  --    tipi di JOIN qui sotto.
                  -- --------------------------------------------------
                  SELECT count(DISTINCT COALESCE(rif.id::text, 'riga ' || fr.riga_rettificata_id::text))::integer,
                         min(COALESCE(rif.id::text, 'riga ' || fr.riga_rettificata_id::text))
                    INTO v_n_bloccanti, v_primo_bloccante
                    FROM vendite.fatture_righe fr
                    LEFT JOIN vendite.fatture_righe rr ON rr.id  = fr.riga_rettificata_id
                    LEFT JOIN vendite.fatture      rif ON rif.id = rr.fattura_id
                   WHERE fr.fattura_id = p_fattura_id
                     AND fr.riga_rettificata_id IS NOT NULL
                     AND (rif.id IS NULL OR rif.numero IS NULL);

                  IF v_n_bloccanti > 0 THEN
                      -- ⭐ IL BERSAGLIO, DUE RUOLI (24-08-2026, passo T-3b del brief).
                      --    E' la forma che il §4.2 dichiarava dal primo giro — «il documento
                      --    da numerare e la fattura rettificata» — ed e' la ragione per cui
                      --    questa chiave e' un ARRAY. Il pilota ne emetteva uno solo.
                      --
                      --    1. IL DOCUMENTO DA NUMERARE, sempre e per PRIMO.
                      --       ⭐ Senza di lui il T-3b non si potrebbe fare: dentro un giro di
                      --          lotto l'errore arriva su una fattura fra molte, e tolti gli
                      --          id dalla frase QUALE non lo direbbe piu' nessuno.
                      --       ⭐ E' sempre presente per costruzione: se non fosse visibile,
                      --          la SELECT ... FOR UPDATE qui sopra non l'avrebbe trovato e
                      --          saremmo usciti con E_FATTURA_NON_TROVATA.
                      --       ⭐ Ed e' PRIMO perche' il canale compatto tiene i primi cinque
                      --          elementi per ordinalita': in testa, la cosa che dice «quale»
                      --          sopravvive al tetto anche con sette padri bloccanti.
                      --
                      --    2. I PADRI BLOCCANTI, solo quelli VISIBILI, in ordine di id.
                      --       ⛔ JOIN INTERNI, al contrario del predicato qui sopra, e non e'
                      --          una svista: la guardia dev'essere fail-closed (un padre
                      --          invisibile BLOCCA), il bersaglio dev'essere onesto (a un
                      --          padre invisibile non si puo' mandare nessuno). Un pulsante
                      --          in un vicolo cieco e' peggio di nessun pulsante — §4.3.
                      --
                      -- ⚠️ Gira solo qui dentro, cioe' solo quando l'errore parte davvero:
                      --    sul percorso felice non costa niente.
                      SELECT jsonb_build_array(
                                 jsonb_build_object('tipo', 'FATTURA',
                                                    'id',   p_fattura_id::text))
                             || COALESCE(
                                  (SELECT jsonb_agg(jsonb_build_object('tipo', 'FATTURA',
                                                                       'id',   x.id::text)
                                                    ORDER BY x.id)
                                     FROM (SELECT DISTINCT rif.id
                                             FROM vendite.fatture_righe fr
                                             JOIN vendite.fatture_righe rr  ON rr.id  = fr.riga_rettificata_id
                                             JOIN vendite.fatture      rif  ON rif.id = rr.fattura_id
                                            WHERE fr.fattura_id = p_fattura_id
                                              AND fr.riga_rettificata_id IS NOT NULL
                                              AND rif.numero IS NULL) x),
                                  '[]'::jsonb)
                        INTO v_bersagli;

                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_numera_fattura_opz_emessa', 'E_FATTURA_RETTIFICATA_SENZA_NUMERO',
                          -- ⚠️ `primo_bloccante` resta QUI e non nella frase: nel ramo
                          --    fail-closed non e' nemmeno un id di fattura (e' la stringa
                          --    `riga <id>`), e non si nomina in chiaro una riga che il
                          --    lettore non puo' aprire. Per chi diagnostica e' invece
                          --    l'aggancio esatto, e dbops.error_log e' la sua sede.
                          jsonb_build_object('fattura_id',      p_fattura_id,
                                             'bloccanti',       v_n_bloccanti,
                                             'primo_bloccante', v_primo_bloccante,
                                             'bersaglio',       v_bersagli),
                          NULL::uuid,
                          -- ⭐ L'UNICO valore che entra nella frase, ed e' un CONTEGGIO, non
                          --    un identificativo: «Documenti da numerare prima: 2». Non c'e'
                          --    piu' niente da ricopiare in un campo di ricerca.
                          v_n_bloccanti::text);
                  END IF;

                  -- Assegna numero
                  SELECT t.registro_id, t.anno, t.serie, t.numero
                    INTO v_registro_id, v_anno, v_serie, v_numero
                    FROM vendite.fn_assign_numero_fattura(p_fattura_id) AS t;

                  -- Opzionale: stato EMESSA
                  IF p_set_emessa THEN
                      SELECT id INTO v_stato_emessa_id
                        FROM config.stati_doc_fiscale WHERE codice_interno = p_codice_interno_emessa LIMIT 1;

                      IF v_stato_emessa_id IS NOT NULL THEN
                          UPDATE vendite.fatture SET stato_doc_fiscale_id = COALESCE(stato_doc_fiscale_id, v_stato_emessa_id) WHERE id = p_fattura_id;
                      END IF;
                  END IF;

                  RETURN QUERY SELECT v_registro_id, v_anno, v_serie, v_numero;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_numera_fattura_opz_emessa(
                  vendite.fatture.id%TYPE, boolean, config.stati_doc_fiscale.codice_interno%TYPE)
                IS 'Assegna numero fattura (idempotente) e opzionalmente imposta stato EMESSA. ⭐ rev 2026-08-21: rifiuta di numerare un documento che RETTIFICA le righe di una fattura ancora senza numero (E_FATTURA_RETTIFICATA_SENZA_NUMERO). Non e'' cronologia: una nota di credito deve citare numero e data del documento corretto nel blocco DatiFattureCollegate della TD04, e con il padre senza numero quel blocco non e'' compilabile — la nota nascerebbe gia'' inadatta allo SDI. Il rifiuto arriva PRIMA di consumare un numero. ⚠️ Il predicato e'' PER RIGA (fatture_righe.riga_rettificata_id -> riga -> fattura): una nota puo'' rettificare righe di fatture diverse e ne basta UNA senza numero. ⭐ NON guarda la natura del documento: una nota di DEBITO che rettifica ha lo stesso problema, e una fattura ordinaria non ha righe con riga_rettificata_id. ⛔ FAIL-CLOSED sulla visibilita'': fatture e fatture_righe hanno la RLS e la funzione e'' SECURITY INVOKER, quindi i JOIN sono LEFT e una riga il cui padre non e'' visibile conta come BLOCCANTE — il predicato e'' «non posso dimostrare che sia numerata», non «risulta non numerata». ⚠️ La guardia sta DOPO il ritorno idempotente. ⭐ rev 2026-08-23/24 (T-3b): l''errore porta un BERSAGLIO a DUE RUOLI — il documento DA NUMERARE (sempre, e per PRIMO, cosi'' sopravvive al tetto di cinque elementi del canale compatto) e i padri bloccanti VISIBILI in ordine di id — e nella frase va un CONTEGGIO, non gli id. ⛔ Il bersaglio dei padri resta a JOIN INTERNI contro i LEFT JOIN del predicato: un padre invisibile entra nel CONTEGGIO ma NON fra i pulsanti. ⭐ rev 2026-08-25 (DB-12, cantiere numerazione-data-documento): `mese` ESCE dal RETURNS TABLE. Era calcolato da registri_fatturazione.reset_policy, che ammetteva tre valori e ne implementava uno — e non lo leggeva NESSUNO: il backend drena il result set (pipeline_repository.py, due punti: uno scalare e uno con fetchall), i pgTAP leggono per nome di colonna o fanno PERFORM. Con lui sono caduti v_reset, v_data e il JOIN su registri_fatturazione, che serviva solo a portare reset_policy (era INNER e in teoria filtrava, in pratica mai: registro_id e'' NOT NULL con una FK). Cambiare il RETURNS TABLE ha richiesto DROP + CREATE, con firma invariata: revisione, non overload. ⛔ Questo changeSet va applicato PRIMA di quello su fn_assign_numero_fattura: qui si smette di chiedere t.mese mentre la funzione chiamata ancora lo espone, e selezionare 4 colonne su 5 e'' legittimo — il contrario e'' un errore a runtime. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §4 DB-12.';

              -- ⚠️ I GRANT si perdono col DROP: si rimettono identici.
              GRANT EXECUTE ON FUNCTION vendite.fn_numera_fattura_opz_emessa(
                  vendite.fatture.id%TYPE, boolean,
                  config.stati_doc_fiscale.codice_interno%TYPE) TO zeroerp_app;
              -- ⛔ 2026-09-02 — NIENTE GRANT AL RUOLO BATCH IN UN changeSet.
              --    In CI il ruolo `zeroerp_batch_fatturazione` non esiste ancora: il workflow
              --    lo provisiona DOPO le migrazioni standard (BYPASSRLS vuole superuser,
              --    quindi lo crea `postgres` e non Liquibase), e il migrate moriva con
              --    «role "zeroerp_batch_fatturazione" does not exist».
              --    ⭐ Ed era anche INUTILE: provision_db_role_batch_fatturazione.sql fa
              --    GRANT SELECT/EXECUTE ON ALL ... IN SCHEMA sui 14 schemi applicativi piu'
              --    ALTER DEFAULT PRIVILEGES, quindi l'oggetto e' coperto su ogni ambiente —
              --    anche se nasce dopo. Verificato: una funzione del 2026-08-31 senza nessun
              --    GRANT esplicito risponde gia' EXECUTE = true per quel ruolo.
              --    ⚠️ La regola era gia' scritta il 2026-07-27 in 20260727-21, dopo lo stesso
              --    guasto: «i privilegi dei ruoli batch stanno nel provisioning, mai in un
              --    changeSet». linee-guida-sql.md §11.6
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Il rollback di questo file da solo non basta: rimette la forma
              --    a cinque colonne, che pero' legge t.mese da fn_assign_numero_fattura.
              --    Va rollato INSIEME al 20260825-18, e in ordine inverso.
              DROP FUNCTION IF EXISTS vendite.fn_numera_fattura_opz_emessa(bigint, boolean, character varying);
