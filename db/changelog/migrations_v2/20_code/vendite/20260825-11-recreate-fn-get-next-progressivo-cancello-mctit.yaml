# DB-8 — ⭐ IL CANCELLO SULLA SEQUENZA
#   vendite.fn_get_next_progressivo — DROP + CREATE
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §4 DB-8
#   Analisi: analisi-numerazione-fattura-data-e-sequenza.md §3 D3 e §6.B
#
# ── IL DIFETTO CHE CHIUDE ───────────────────────────────────────────
#   Il numero si consumava senza che nessuno confrontasse la data del documento
#   con quella dell'ultimo numero emesso nello stesso sezionale. `uq_fatture_numero`
#   garantisce l'unicita' del numero e **null'altro**: sulle date non dice niente.
#   Misurato il 2026-08-25 sul registro 3: **tre inversioni** su undici numeri.
#   Con tre vie d'innesco — lotto singolo, giro per competenza (che ordinava per
#   id di lotto) e backstop del worker di stampa (che non ordina affatto) —
#   l'inversione non era un incidente: era il comportamento atteso del sistema.
#
# ── ⛔ DOVE, E PERCHE' PROPRIO QUI ──────────────────────────────────
#   Dentro questa funzione, **dopo l'advisory lock**. Non in
#   `fn_assign_numero_fattura`, e non e' un dettaglio:
#     · un controllo letto PRIMA del lock e' soggetto a corsa — due transazioni
#       leggono lo stesso massimo, passano entrambe, poi si serializzano sul
#       contatore e producono proprio l'inversione che il cancello doveva
#       impedire. Sotto il lock, lettura e incremento sono lo stesso atto;
#     · ed e' l'unico punto **non aggirabile**: tutte e tre le vie che consumano
#       un numero passano di qui.
#
# ── 🔴 IL LOCK PERDE L'ANNO, ED E' LA CORREZIONE PIU' IMPORTANTE ────
#   Il lock esistente aveva chiave `registro|ANNO|serie`. Il cancello invece
#   legge il massimo **attraverso gli anni**, e il `FOR UPDATE` blocca la sola
#   riga del proprio anno.
#
#   Due transazioni con date in anni diversi sullo stesso `(registro, serie)`
#   avrebbero quindi preso **lock diversi**, letto lo stesso massimo e passato
#   entrambe: il cancello sarebbe stato aggirabile **proprio nel caso che
#   dichiara di coprire** — il documento retrodatato all'anno scorso.
#
#   ⭐ La regola generale: **il perimetro del lock deve coincidere col perimetro
#   del controllo che ci sta dentro.** Un lock piu' stretto di cio' che il
#   controllo legge non serializza niente.
#   Costo: si serializzano fra loro due numerazioni dello stesso sezionale in
#   anni diversi, cioe' qualche transazione a cavallo di Capodanno. La
#   correttezza di `last_numero` non ne dipende comunque — quella la tiene il
#   `FOR UPDATE` sulla riga. E' un restringimento, non un cambio di semantica.
#   ⚠️ Resta la forma a DUE argomenti (namespace + chiave): lo spazio a un
#   argomento e' condiviso fra feature scorrelate.
#
# ── ⚠️ LA CHIAVE E' (registro, serie), NON IL SOLO REGISTRO ─────────
#   Il modello ammette **due serie sullo stesso registro**:
#   `tipi_doc_fiscale_registri` mappa `(tipo_doc, natura) -> (registro, serie)`
#   e la sua UNIQUE lo consente apposta — il registro 5 riceve gia' due
#   mappature. Sul solo registro, due sequenze indipendenti si bloccherebbero a
#   vicenda.
#   ⚠️ Oggi nessuna mappatura valorizza la serie: la chiave giusta e' giusta
#   **per il modello**, non perche' i dati la esercitino gia'.
#
# ── ⛔ PERCHE' UN `DROP` E NON UN `CREATE OR REPLACE` ───────────────
#   La firma cresce di un parametro (`p_fattura_id`), e `CREATE OR REPLACE` non
#   puo' aggiungerne: creerebbe una **seconda** funzione, e con i default le due
#   sarebbero **ambigue su tre argomenti**.
#   ✅ Il `DROP` e' sicuro, riverificato il 2026-08-25 su quattro fronti:
#   `pg_proc` (unico chiamante `fn_assign_numero_fattura`), `backend/**.py`
#   (zero chiamate), `db/pgtap/` (solo `test-registri-progressivi.sql`, **con
#   argomenti nominati**, quindi compatibile) e le viste.
#   ⚠️ Dopo il `CREATE`, verificare con `pg_get_function_identity_arguments` che
#   non sia nato un overload.
#
#   ⚠️ `p_serie` resta `text` e NON diventa `%TYPE` della colonna: cambierebbe
#   l'identita' della funzione da `(bigint, date, text)` a
#   `(bigint, date, character varying)` senza alcun guadagno. Il valore che
#   arriva non e' il contenuto di una colonna — e' una serie gia' risolta col
#   `COALESCE` del chiamante.
#
# ── ℹ️ IL BERSAGLIO, E QUANDO NON C'E' ──────────────────────────────
#   Due elementi, nell'ordine che il canale compatto rispetta:
#     1. la fattura DA NUMERARE (`p_fattura_id`), che dice QUALE documento ha
#        rifiutato dentro un giro di lotto su molte fatture;
#     2. l'ultima numerata del sezionale, **se chi opera puo' vederla**.
#   ⚠️ Il secondo si cerca in `vendite.fatture`, che ha la RLS: se non e'
#   visibile la query non torna niente e il pulsante non nasce. A un documento
#   che non si puo' aprire non si manda nessuno.
#   ⭐ E si cerca **per DATA**, non per numero: nei registri con inversioni gia'
#   scritte — cioe' il registro 3, oggi — «l'ultimo per numero» puo' portare una
#   data DIVERSA da quella che la frase nomina, e il messaggio si
#   contraddirebbe da solo.
#   ⚠️ Se non c'e' nessun bersaglio (chiamata senza `p_fattura_id` e ultima non
#   visibile) la chiave si OMETTE: un array vuoto e' un bersaglio malformato e
#   lascerebbe un `W_BERSAGLIO_MALFORMATO` nel log per niente.
#   ⭐ Tutta questa roba gira SOLO nel ramo d'errore: sul percorso felice il
#   cancello e' un `max()` su una tabella di due righe.
#
# ── ℹ️ MENTRE CI SIAMO: il messaggio vecchio ────────────────────────
#   La versione precedente sollevava `E_PARAMETRO_INVALIDO` con nel `VARIADIC`
#   la stringa `'p_registro_id e p_data obbligatori'` — nomi di parametro
#   PL/pgSQL dentro la frase che legge una persona. Ora e'
#   `E_VENDITE_CHIAMATA_NON_VALIDA` (TECNICO), che e' la sede giusta per un
#   chiamante rotto, con i due guard separati (uno per parametro) e il controllo
#   `<= 0` che le linee-guida pretendono sugli id e che prima mancava.
#
# ── ⚠️ IL CHIAMANTE NON PASSA ANCORA p_fattura_id ───────────────────
#   `fn_assign_numero_fattura` lo passera' dal `20260825-17`. Fra i due, il
#   cancello funziona e l'errore esce **senza il primo bersaglio**. Non siamo in
#   produzione e i lotti si applicano nello stesso giro (decisione di Tid,
#   2026-08-25).
#
# Dipendenze: 20260825-09 (ultima_data), e la riga
#             E_FATTURA_DATA_ANTERIORE_ULTIMO_NUMERO nei due CSV di 80_data.
#             ⚠️ 80_data gira DOPO: fra le due fasi il codice esiste nel corpo ma
#             non a catalogo, e `fn_log_and_raise_error` ripiegherebbe su
#             E_MESSAGGIO_NON_DEFINITO. Nessuno numera in mezzo a un migrate.
# Verifica: db/pgtap/vendite/test-registri-progressivi.sql (casi 1..5 e 11, DB-13)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260825-11-recreate-fn-get-next-progressivo-cancello-mctit.yaml

  - changeSet:
      id: 20260825-11-recreate-fn-get-next-progressivo-cancello
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-8: il cancello di monotonia della sequenza, dentro fn_get_next_progressivo e SOTTO
        l'advisory lock — l'unico punto non aggirabile, perche' tutte e tre le vie che consumano
        un numero passano di qui, e l'unico non soggetto a corsa. 🔴 L'advisory lock PERDE
        L'ANNO dalla chiave, ed e' la correzione piu' importante del changeSet: il cancello
        legge il massimo attraverso gli anni, quindi con l'anno nel lock due transazioni con
        date in anni diversi avrebbero preso lock diversi e passato entrambe — il cancello
        sarebbe stato aggirabile proprio nel caso che dichiara di coprire. Il perimetro del lock
        deve coincidere con quello del controllo. Chiave (registro, serie) perche' il modello
        ammette due serie sullo stesso registro. DROP + CREATE perche' la firma cresce di un
        parametro. Il bersaglio si cerca per DATA e non per numero, e solo nel ramo d'errore.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione_progressivi
                columnName: ultima_data
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_get_next_progressivo';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ═══════════════════════════════════════════════════════════
              -- DROP: la firma cresce di un parametro e CREATE OR REPLACE
              -- non puo' aggiungerne — creerebbe un overload ambiguo.
              -- ⛔ Mai CASCADE: qui si sa esattamente che cosa si sta
              --    togliendo, e l'unico chiamante e' PL/pgSQL (le chiamate
              --    dentro un corpo non sono dipendenze registrate).
              -- ═══════════════════════════════════════════════════════════
              DROP FUNCTION IF EXISTS vendite.fn_get_next_progressivo(bigint, date, text);

              CREATE OR REPLACE FUNCTION vendite.fn_get_next_progressivo(
                  p_registro_id vendite.registri_fatturazione.id%TYPE,
                  p_data        vendite.fatture.data%TYPE,
                  -- ⚠️ `text` e non %TYPE della colonna: cambierebbe l'identita'
                  --    della funzione senza guadagno, e il valore che arriva non
                  --    e' il contenuto di una colonna ma una serie gia' risolta
                  --    col COALESCE del chiamante.
                  p_serie       text DEFAULT NULL,
                  -- ⭐ Serve SOLO al bersaglio dell'errore: dentro un giro di
                  --    lotto la frase non dice piu' quale documento ha rifiutato,
                  --    e senza questo id nessuno lo direbbe.
                  p_fattura_id  vendite.fatture.id%TYPE DEFAULT NULL
              )
               RETURNS bigint
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_anno       vendite.registri_fatturazione_progressivi.anno%TYPE;
                  -- ⚠️ Fermo a 0 finche' MENSILE non esiste: vedi il COMMENT
                  --    della colonna e la D-1 del brief.
                  v_mese       vendite.registri_fatturazione_progressivi.mese%TYPE := 0;
                  v_serie      TEXT := COALESCE(p_serie, '');
                  v_last       vendite.registri_fatturazione_progressivi.last_numero%TYPE;
                  v_next       vendite.registri_fatturazione_progressivi.last_numero%TYPE;
                  -- Il pavimento: la data sotto la quale non si puo' scendere.
                  v_pavimento  vendite.registri_fatturazione_progressivi.ultima_data%TYPE;
                  v_ultima_id  vendite.fatture.id%TYPE;
                  v_bersagli   jsonb;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Consegnare il prossimo numero del sezionale, e rifiutare
                  --   se la data del documento e' anteriore all'ultima gia'
                  --   numerata sullo stesso (registro, serie).
                  --
                  -- Regole:
                  --   - il controllo sta SOTTO il lock, o e' soggetto a corsa;
                  --   - il lock ha lo STESSO perimetro del controllo;
                  --   - la stessa data e' ammessa (>=, non >).
                  -- =========================================================

                  -- Guard di parametro, uno per parametro: un id nullo o non
                  -- positivo, o una data assente, non escono da nessuna
                  -- interfaccia — li produce solo un chiamante rotto, ed e' per
                  -- questo che il codice e' TECNICO.
                  IF p_registro_id IS NULL OR p_registro_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_get_next_progressivo',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object(
                              'detail', 'registro_id obbligatorio e maggiore di zero',
                              'p_registro_id', p_registro_id),
                          NULL::uuid,
                          'vendite.fn_get_next_progressivo',
                          'p_registro_id (obbligatorio, maggiore di zero)');
                  END IF;

                  IF p_data IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_get_next_progressivo',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object(
                              'detail', 'data documento obbligatoria',
                              'p_registro_id', p_registro_id),
                          NULL::uuid,
                          'vendite.fn_get_next_progressivo',
                          'p_data (obbligatorio)');
                  END IF;

                  v_anno := vendite.fn_get_anno_registro(p_data);

                  -- ─── IL LOCK ──────────────────────────────────────────────
                  -- 🔴 La chiave NON porta l'anno, e non e' una svista.
                  --    Il cancello qui sotto legge il massimo ATTRAVERSO GLI
                  --    ANNI: con l'anno nella chiave, due transazioni con date
                  --    in anni diversi sullo stesso sezionale prenderebbero
                  --    lock DIVERSI, leggerebbero lo stesso massimo e
                  --    passerebbero entrambe — il cancello sarebbe aggirabile
                  --    proprio nel caso che dichiara di coprire.
                  --    Il perimetro del lock deve coincidere con quello del
                  --    controllo che ci sta dentro.
                  -- ⚠️ Forma a DUE argomenti (namespace + chiave): lo spazio a
                  --    un argomento e' condiviso fra feature scorrelate.
                  PERFORM pg_advisory_xact_lock(
                      hashtext('registri_fatturazione_progressivi'),
                      hashtext(p_registro_id::text || '|' || v_serie)
                  );

                  -- ─── ⭐ IL CANCELLO ───────────────────────────────────────
                  -- Il massimo si prende su TUTTE le righe di contatore del
                  -- sezionale, non su quella dell'anno corrente: altrimenti un
                  -- documento retrodatato al 31/12 dell'anno scorso finirebbe
                  -- nel contatore dell'anno scorso e passerebbe indisturbato,
                  -- aprendo un numero in un anno gia' chiuso.
                  SELECT max(rp.ultima_data)
                    INTO v_pavimento
                    FROM vendite.registri_fatturazione_progressivi rp
                   WHERE rp.registro_id = p_registro_id
                     AND rp.serie       = v_serie;

                  -- ⚠️ `<` e non `<=`: la STESSA data dell'ultimo numerato e'
                  --    ammessa, ed e' il caso piu' comune (decisione 7).
                  IF v_pavimento IS NOT NULL AND p_data < v_pavimento THEN

                      -- ⭐ Da qui in giu' si e' gia' deciso di rifiutare: il
                      --    costo di comporre il bersaglio non tocca il percorso
                      --    felice.
                      v_bersagli := CASE
                          WHEN p_fattura_id IS NOT NULL
                          THEN jsonb_build_array(jsonb_build_object(
                                   'tipo', 'FATTURA', 'id', p_fattura_id::text))
                          ELSE '[]'::jsonb
                      END;

                      -- ⭐ L'ultima numerata si cerca PER DATA, non per numero:
                      --    in un registro con inversioni gia' scritte «l'ultimo
                      --    per numero» puo' portare una data diversa da quella
                      --    che la frase nomina, e il messaggio si
                      --    contraddirebbe da solo.
                      -- ⚠️ vendite.fatture ha la RLS e questa funzione e'
                      --    SECURITY INVOKER: se non e' visibile, qui non si
                      --    trova nulla e il pulsante non nasce. A un documento
                      --    che non si puo' aprire non si manda nessuno.
                      SELECT f.id
                        INTO v_ultima_id
                        FROM vendite.fatture f
                        JOIN vendite.registri_fatturazione r ON r.id = f.registro_id
                       WHERE f.registro_id = p_registro_id
                         AND COALESCE(f.serie, r.serie_default, '') = v_serie
                         AND f.numero IS NOT NULL
                         AND f.data   = v_pavimento
                       ORDER BY f.anno DESC, f.numero DESC
                       LIMIT 1;

                      IF v_ultima_id IS NOT NULL THEN
                          v_bersagli := v_bersagli || jsonb_build_array(
                              jsonb_build_object('tipo', 'FATTURA',
                                                 'id', v_ultima_id::text));
                      END IF;

                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_next_progressivo',
                          'E_FATTURA_DATA_ANTERIORE_ULTIMO_NUMERO',
                          jsonb_build_object(
                              -- il campo che il frontend deve accendere
                              'campo',          'data_documento',
                              -- il resto e' diagnosi, per dbops.error_log
                              'registro_id',    p_registro_id,
                              'serie',          v_serie,
                              'ultima_data',    v_pavimento,
                              'data_richiesta', p_data,
                              'fattura_id',     p_fattura_id)
                          -- ⚠️ La chiave si OMETTE se non c'e' nessun bersaglio:
                          --    un array vuoto e' malformato e lascerebbe un
                          --    W_BERSAGLIO_MALFORMATO nel log per niente.
                          || CASE WHEN jsonb_array_length(v_bersagli) > 0
                                  THEN jsonb_build_object('bersaglio', v_bersagli)
                                  ELSE '{}'::jsonb
                             END,
                          NULL::uuid,
                          -- ⭐ Nella frase va SOLO la data dell'ultimo numerato:
                          --    l'unico dato che serve a scegliere quella giusta.
                          --    Formato italiano, perche' a leggerlo e' una
                          --    persona. Nessun id, nessun nome di colonna.
                          to_char(v_pavimento, 'DD/MM/YYYY'));
                  END IF;

                  -- ─── IL CONTATORE ─────────────────────────────────────────
                  -- La riga e' per anno; il cancello guardava il sezionale.
                  SELECT rp.last_numero
                    INTO v_last
                    FROM vendite.registri_fatturazione_progressivi rp
                   WHERE rp.registro_id = p_registro_id
                     AND rp.anno  = v_anno
                     AND rp.mese  = v_mese
                     AND rp.serie = v_serie
                     FOR UPDATE;

                  IF v_last IS NULL THEN
                      INSERT INTO vendite.registri_fatturazione_progressivi
                             (registro_id, anno, mese, serie, last_numero, attivo)
                      VALUES (p_registro_id, v_anno, v_mese, v_serie, 0, true)
                      RETURNING last_numero INTO v_last;
                  END IF;

                  v_next := v_last + 1;

                  -- ⭐ `GREATEST` e non un'assegnazione secca: la memoria della
                  --    sequenza non deve MAI arretrare. Il cancello ammette la
                  --    data uguale, quindi due numeri consecutivi possono
                  --    portare la stessa data — e in quel caso il pavimento
                  --    resta dov'e'.
                  UPDATE vendite.registri_fatturazione_progressivi
                     SET last_numero = v_next,
                         ultima_data = GREATEST(COALESCE(ultima_data, p_data), p_data)
                   WHERE registro_id = p_registro_id
                     AND anno  = v_anno
                     AND mese  = v_mese
                     AND serie = v_serie;

                  RETURN v_next;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_next_progressivo(
                  vendite.registri_fatturazione.id%TYPE, vendite.fatture.data%TYPE,
                  text, vendite.fatture.id%TYPE)
                IS 'Prossimo progressivo del sezionale, con il CANCELLO DI MONOTONIA sulla data. ⛔ Rifiuta (E_FATTURA_DATA_ANTERIORE_ULTIMO_NUMERO) se p_data e'' anteriore all''ultima data gia'' numerata su (registro, serie); la data UGUALE e'' ammessa (decisione 7). ⭐ Il controllo sta QUI e SOTTO l''advisory lock per due ragioni: e'' l''unico punto NON AGGIRABILE — le tre vie che consumano un numero (lotto singolo, giro per competenza, backstop del worker di stampa) passano tutte di qui — e un controllo letto PRIMA del lock sarebbe soggetto a corsa, con due transazioni che leggono lo stesso massimo, passano entrambe e producono l''inversione che il cancello doveva impedire. 🔴 rev 2026-08-25: la chiave dell''advisory lock PERDE L''ANNO ed e'' ora (registro | serie). Il cancello legge il massimo ATTRAVERSO GLI ANNI, quindi con l''anno nella chiave due numerazioni con date in anni diversi sullo stesso sezionale avrebbero preso lock DIVERSI e passato entrambe: il perimetro del lock deve coincidere con quello del controllo che ci sta dentro, o il controllo e'' decorativo. Il FOR UPDATE sulla riga di contatore non basta, perche'' blocca la riga dell''anno corrente e non le altre. ⚠️ La chiave e'' (registro, serie) e non il solo registro: il modello ammette due serie sullo stesso registro (tipi_doc_fiscale_registri lo consente apposta) e sul solo registro due sequenze indipendenti si bloccherebbero a vicenda. ⚠️ Il massimo si legge dal CONTATORE e non da vendite.fatture: quella tabella ha la RLS e un max() sotto perimetro ristretto tornerebbe NULL, cioe'' «via libera» proprio quando non si sa. ⭐ ultima_data si aggiorna con GREATEST: la memoria della sequenza non arretra mai. ℹ️ Il BERSAGLIO ha due elementi — la fattura da numerare (p_fattura_id, che dice QUALE documento ha rifiutato dentro un giro di lotto) e l''ultima numerata del sezionale, cercata PER DATA e non per numero (in un registro con inversioni gia'' scritte «l''ultimo per numero» porterebbe una data diversa da quella che la frase nomina) e solo se visibile a chi opera. La chiave si omette se l''array sarebbe vuoto. Tutto questo gira SOLO nel ramo d''errore. ⚠️ p_serie resta `text` e non %TYPE: cambierebbe l''identita'' della funzione senza guadagno, e il valore che arriva e'' una serie gia'' risolta col COALESCE del chiamante. ⭐ I guard di parametro passano da E_PARAMETRO_INVALIDO — che portava nomi di variabili PL/pgSQL nella frase letta da una persona — a E_VENDITE_CHIAMATA_NON_VALIDA (TECNICO), uno per parametro, col controllo <= 0 sugli id che prima mancava. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §4 DB-8.';

              -- ⚠️ I GRANT si perdono col DROP. Si rimettono IDENTICI a com'erano
              --    (misurati il 2026-08-25 su pg_proc.proacl), o fra il migrate e
              --    il ciclo di ci_apply che li ridistribuisce l'applicazione non
              --    puo' numerare.
              GRANT EXECUTE ON FUNCTION vendite.fn_get_next_progressivo(
                  vendite.registri_fatturazione.id%TYPE, vendite.fatture.data%TYPE,
                  text, vendite.fatture.id%TYPE) TO zeroerp_app;
              -- ⛔ 2026-09-02 — NIENTE GRANT AL RUOLO BATCH IN UN changeSet.
              --    In CI il ruolo `zeroerp_batch_fatturazione` non esiste ancora: il workflow
              --    lo provisiona DOPO le migrazioni standard (BYPASSRLS vuole superuser,
              --    quindi lo crea `postgres` e non Liquibase), e il migrate moriva con
              --    «role "zeroerp_batch_fatturazione" does not exist».
              --    ⭐ Ed era anche INUTILE: provision_db_role_batch_fatturazione.sql fa
              --    GRANT SELECT/EXECUTE ON ALL ... IN SCHEMA sui 14 schemi applicativi piu'
              --    ALTER DEFAULT PRIVILEGES, quindi l'oggetto e' coperto su ogni ambiente —
              --    anche se nasce dopo. Verificato: una funzione del 2026-08-31 senza nessun
              --    GRANT esplicito risponde gia' EXECUTE = true per quel ruolo.
              --    ⚠️ La regola era gia' scritta il 2026-07-27 in 20260727-21, dopo lo stesso
              --    guasto: «i privilegi dei ruoli batch stanno nel provisioning, mai in un
              --    changeSet». linee-guida-sql.md §11.6
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Il rollback rimette la funzione SENZA cancello e con il lock
              --    per anno, cioe' il difetto: e' cio' che un rollback deve fare.
              DROP FUNCTION IF EXISTS vendite.fn_get_next_progressivo(bigint, date, text, bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_get_next_progressivo(p_registro_id bigint, p_data date, p_serie text DEFAULT NULL::text)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_anno  SMALLINT;
                  v_mese  SMALLINT := 0;
                  v_serie TEXT := COALESCE(p_serie, '');
                  v_last  BIGINT;
                  v_next  BIGINT;
              BEGIN
                  IF p_registro_id IS NULL OR p_data IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_next_progressivo', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_registro_id/p_data', 'registro_id', p_registro_id, 'data', p_data),
                          NULL::uuid, 'p_registro_id e p_data obbligatori'
                      );
                  END IF;

                  v_anno := vendite.fn_get_anno_registro(p_data);

                  PERFORM pg_advisory_xact_lock(
                      hashtext('registri_fatturazione_progressivi'),
                      hashtext(p_registro_id::text || '|' || v_anno::text || '|' || v_serie)
                  );

                  SELECT rp.last_numero INTO v_last
                    FROM vendite.registri_fatturazione_progressivi rp
                   WHERE rp.registro_id = p_registro_id
                     AND rp.anno = v_anno AND rp.mese = v_mese AND rp.serie = v_serie
                     FOR UPDATE;

                  IF v_last IS NULL THEN
                      INSERT INTO vendite.registri_fatturazione_progressivi (registro_id, anno, mese, serie, last_numero, attivo)
                      VALUES (p_registro_id, v_anno, v_mese, v_serie, 0, true)
                      RETURNING last_numero INTO v_last;
                  END IF;

                  v_next := v_last + 1;

                  UPDATE vendite.registri_fatturazione_progressivi
                     SET last_numero = v_next
                   WHERE registro_id = p_registro_id AND anno = v_anno AND mese = v_mese AND serie = v_serie;

                  RETURN v_next;
              END;
              $function$;

              GRANT EXECUTE ON FUNCTION vendite.fn_get_next_progressivo(bigint, date, text) TO zeroerp_app;
              -- ⛔ GRANT al ruolo batch rimosso il 2026-09-02 (vedi sopra) — linee-guida-sql §11.6
