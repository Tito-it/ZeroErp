#
# Espone pdf_mode dello stato corrente in vendite.vw_ordini_lista, per
# l'azione PDF per-riga data-driven nella lista Ordini (coda della slice
# "Bottone PDF data-driven via capabilities").
#
# NOTE TECNICHE:
#  - pdf_mode aggiunta come ULTIMA colonna della SELECT: CREATE OR REPLACE
#    VIEW ammette solo l'APPEND in coda (le colonne esistenti restano
#    identiche per nome/tipo/posizione). Per SELECT v.* la posizione e'
#    irrilevante (consumo per nome) -> nessun DROP VIEW necessario.
#  - WITH (security_invoker = on) RI-ASSERITO esplicitamente: pg_get_viewdef
#    (autogen) non mostra le reloptions; ometterlo rischierebbe di resettare
#    il flag e aprire un buco di scope RLS. Forma identica al create 20260603-14.
#  - DIPENDENZA: sd.pdf_mode esiste solo dopo 20260711-04 (ADD COLUMN su
#    config.stati_doc_ordini). 00_schema gira prima di 20_code -> ordine ok
#    nello stesso migrate.
#  - Corpo SELECT ribasato sulla doc auto-gen dbzero (definizione viva).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260711-12-update-vw-ordini-lista-pdf-mode-mctit.yaml

  - changeSet:
      id: 20260711-12-update-vw-ordini-lista-pdf-mode
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_ordini_lista: espone sd.pdf_mode (ultima colonna) per l'azione PDF
        per-riga della lista Ordini. security_invoker=on ri-asserito.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_ordini_lista
              WITH (security_invoker = on) AS
              SELECT o.id,
                  o.uid,
                  o.numero,
                  o.serie,
                  o.anno,
                  o.data,
                  o.stato_doc_ordine_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  o.soggetto_ruolo_id,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.imponibile_tot,
                  o.sconto_tot,
                  o.iva_tot,
                  o.totale_doc,
                  o.modalita_pagamento_id,
                  mp.codice AS modalita_pagamento_codice,
                  o.termine_pagamento_id,
                  tp.codice AS termine_pagamento_codice,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.tasso_cambio,
                  o.fatturazione_trigger,
                  o.canale_origine,
                  o.agente_soggetto_ruolo_id,
                  s_ag.ragione_sociale_completa AS agente_denominazione,
                  o.documento_origine_tipo,
                  o.documento_origine_id,
                      CASE o.documento_origine_tipo
                          WHEN 'PREVENTIVO'::text THEN pv.numero
                          WHEN 'OFFERTA'::text THEN (oc.codice)::character varying
                          ELSE NULL::character varying
                      END AS documento_origine_codice,
                  o.data_insert,
                  o.user_insert,
                  o.data_update,
                  o.user_update,
                  -- 2026-07-11: modalita PDF dello stato per azione PDF
                  -- per-riga della lista (data-driven, sostituisce la
                  -- costante FE STATI_ORDINE_CON_DOCUMENTO). Ultima colonna
                  -- (append CREATE OR REPLACE).
                  sd.pdf_mode
                 FROM (((((((((((((vendite.ordini o
                   JOIN config.stati_doc_ordini sd ON ((sd.id = o.stato_doc_ordine_id)))
                   JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = o.soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = o.billing_account_id)))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = o.emittente_fiscale_id)))
                   LEFT JOIN config.utilities u ON ((u.id = o.utility_id)))
                   LEFT JOIN config.modalita_pagamento mp ON ((mp.id = o.modalita_pagamento_id)))
                   LEFT JOIN config.termini_pagamento tp ON ((tp.id = o.termine_pagamento_id)))
                   LEFT JOIN config.valute v_val ON ((v_val.id = o.valuta_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ag ON ((sr_ag.id = o.agente_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ag ON ((s_ag.id = sr_ag.soggetto_id)))
                   LEFT JOIN vendite.preventivi pv ON (((pv.id = o.documento_origine_id) AND ((o.documento_origine_tipo)::text = 'PREVENTIVO'::text))))
                   LEFT JOIN vendite.offerte_commerciali oc ON (((oc.id = o.documento_origine_id) AND ((o.documento_origine_tipo)::text = 'OFFERTA'::text))));

              -- Ri-assert difensivo del flag (idempotente).
              ALTER VIEW vendite.vw_ordini_lista SET (security_invoker = on);

              COMMENT ON VIEW vendite.vw_ordini_lista IS
                'Vista canonica lista/dettaglio ordini vendita: testata + decodifiche denormalizzate (stato, cliente, billing/emittente/utility, pagamento, valuta, agente, documento origine) + pdf_mode (modalita'' bottone PDF per-riga, data-driven). Sola denormalizzazione: nessuno scope/filtro. security_invoker=on (RLS-ready). rev 2026-07-11: +pdf_mode.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: ri-applicare la definizione autogen antecedente (senza pdf_mode).
              SELECT 1;
