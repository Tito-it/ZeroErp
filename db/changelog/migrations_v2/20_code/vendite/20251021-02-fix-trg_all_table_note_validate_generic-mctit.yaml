databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20251021-02-fix-trg_all_table_note_validate_generic-mctit.yaml
  - changeSet:
      id: 20251021-02-fix-trg_all_table_note_validate_generic
    
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: vendite, tableName: note_contratto }
        - tableExists: { schemaName: vendite, tableName: note_preventivo }
        - tableExists: { schemaName: vendite, tableName: note_fatture }
        - tableExists: { schemaName: vendite, tableName: note_ordini }
        - tableExists: { schemaName: vendite, tableName: note_ddt }

      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                    -- CONTRATTO
                    DROP TRIGGER IF EXISTS trg_note_contratto_ins_upd_validate ON vendite.note_contratto;
                    CREATE TRIGGER trg_note_contratto_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON vendite.note_contratto
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('vendite.contratti_righe','contratto_id','CONTRATTO');
                    
                    -- PREVENTIVO
                    DROP TRIGGER IF EXISTS trg_note_preventivo_ins_upd_validate ON vendite.note_preventivo;
                    CREATE TRIGGER trg_note_preventivo_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON vendite.note_preventivo
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('vendite.preventivi_righe','preventivo_id','PREVENTIVO');
                   
                    -- FATTURA
                    DROP TRIGGER IF EXISTS trg_note_fatture_ins_upd_validate ON vendite.note_fatture;
                    CREATE TRIGGER trg_note_fatture_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON vendite.note_fatture
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('vendite.fatture_righe','fattura_id','FATTURA');

                    -- ORDINE
                    DROP TRIGGER IF EXISTS trg_note_ordini_ins_upd_validate ON vendite.note_ordini;
                    CREATE TRIGGER trg_note_ordini_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON vendite.note_ordini
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('vendite.ordini_righe','ordine_id','ORDINE');

                    -- DDT
                    DROP TRIGGER IF EXISTS trg_note_ddt_ins_upd_validate ON vendite.note_ddt;
                    CREATE TRIGGER trg_note_ddt_ins_upd_validate
                    BEFORE INSERT OR UPDATE ON vendite.note_ddt
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_note_validate_generic('vendite.ddt_righe','ddt_id','DDT');


                     -- cancella precedente funzione
                    DROP FUNCTION IF EXISTS vendite.trgfn_note_validate_generic();
