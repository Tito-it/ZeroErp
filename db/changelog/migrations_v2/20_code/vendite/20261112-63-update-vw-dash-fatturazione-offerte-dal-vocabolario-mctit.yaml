              IS 'Dashboard della fatturazione, area OFFERTA_COMMERCIALE: una riga per offerta, a conteggi. L''offerta e'' transitata se ha un figlio vivo: un contratto non annullato (is_abortito_snapshot) o un ordine con esito diverso da NEGATIVO, cioe'' un documento che la dichiara come provenienza (sorgente_tipo_id OFFERTA_COMMERCIALE, chiave dell''offerta in sorgente_uid o sorgente_id). Un''offerta ha al piu'' un figlio vivo ma puo'' averne piu'' annullati: i figli si riassumono in una riga per lato (esiste, vivo), cosi'' l''offerta non si duplica e un figlio annullato non nasconde quello vivo. motivo_fermo: FIGLIO_ABORTITO se ha solo figli annullati (si sblocca rigenerando), DOC_BOZZA, IN_ATTESA_ACCETTAZIONE, SENZA_FIGLIO; NULL se transitata o rifiutata. cliente_display e'' la ragione sociale dell''intestatario dell''istanza. La consuma vendite.vw_dash_fatturazione_documenti. security_invoker=on.';
