databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260225-36-trg-attivita-fatturabili-sorgente-origine-active-parent-mctit.yaml

  - changeSet:
      id: 20260225-36-trg-attivita-fatturabili-sorgente-origine-active-parent
      author: mctit
      # runOnChange: true
      #  validCheckSum:
      #     - ANY
      comment: "Trigger active-parent su sorgente_origine_tipo_id: blocca INSERT/UPDATE se config.sorgenti.attivo = false."
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- Guard: sorgente_origine_tipo_id deve puntare a sorgente attiva.
              DROP TRIGGER IF EXISTS trg_attivita_fatturabili_a10_sorgenti_origine_require_attivo_ins_upd
                ON vendite.attivita_fatturabili;

              CREATE TRIGGER trg_attivita_fatturabili_a10_sorgenti_origine_require_attivo_ins_upd
              AFTER INSERT OR UPDATE OF sorgente_origine_tipo_id
              ON vendite.attivita_fatturabili
              FOR EACH ROW
              EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                'config', 'sorgenti', 'attivo', 'sorgente_origine_tipo_id'
              );
