# LA SEGNALAZIONE DEL LOTTO DICHIARA LA COMMESSA: p_commessa_id in vendite.fn_log_pipeline_fase
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto Z, giro Z.5 (V-7-bis, Tid 2026-11-08).
#
#   Il nono parametro, in coda, scritto in fatturazione_lotti_log.commessa_id
#   (-80). Lo passa chi conosce la commessa: il pull per commessa del backend
#   (§8 del brief, BE-Z.5-a). Le cinque funzioni DB chiamanti lo omettono e
#   restano identiche: scrivono segnalazioni del giro, o l'uscita di un
#   documento, che la commessa non la sa.
#   Un parametro nuovo e' un DROP + CREATE: con la firma vecchia viva ogni
#   chiamata corta sarebbe ambigua. Nessun oggetto dipende dalla funzione
#   (pg_depend, dbdev e scratch, 2026-11-08); il corpo e' il vivo (uguale a
#   20260909-21) con la sola colonna nuova; il GRANT a zeroerp_app torna,
#   EXECUTE a PUBLIC lo da' la CREATE. %TYPE sul parametro nuovo e sulla
#   variabile; i parametri vecchi restano come sono.
#   ⚠️ CHE COSA CAMBIA: niente per chi la chiama oggi (per nome o con meno
#   argomenti).
#   Rollback: la firma di prima, dalla definizione viva.
# ------------------------------------------------------------

