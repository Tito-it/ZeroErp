# Dashboard fatturazione — resolver area CONTRATTI (brief-design-dashboard-
# fatturazione §5, Fase 1). Una riga per CONTRATTO x MESE coperto dalla
# validita', A CONTEGGI (decisione D-3: il canone mensile atteso non e' un
# campo pronto — v2): valore_* = NULL, unita_totali = 1 per mese.
#
# SEMANTICA:
#   - mesi generati da valido_dal fino a LEAST(valido_al, mese corrente):
#     la domanda "il canone del mese e' stato generato?" ha senso solo per
#     mesi non futuri; contratti aperti (valido_al NULL) si fermano al mese
#     corrente (nessuna esplosione di righe).
#   - transitato nel mese M = EXISTS attivita di commessa con sorgente
#     CONTRATTO (config.sorgenti.codice_interno, mai id letterale),
#     sorgente_uid = uid del contratto e competenza_mese = M, EMESSA —
#     stesso predicato di fn_list_contratti_da_pushare (che oggi ancora il
#     canone al mese di inizio validita': nei mesi successivi il contratto
#     apparira' fermo finche' non esistera' il push ricorrente. La dashboard
#     mostra la realta' operativa, non la maschera).
#   - i contratti abortiti (esito NEGATIVO, es. ANNULLATO) sono ESCLUSI dal
#     resolver (niente righe-mese): per quest'area n_abortiti = 0 in v1
#     (documentato nel brief §5).
#
# Vocabolario motivo_fermo: DOC_BOZZA, CANONE_NON_GENERATO.
#
# Consumata da vendite.vw_dash_fatturazione_documenti (20260703-56).
# Perf: EXISTS assistito da ix_commesse_attivita_sorgente_competenza
# (20260703-58, 90_end).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260703-54-create-vw-dash-fatturazione-contratti-mctit.yaml

  - changeSet:
      id: 20260703-54-create-vw-dash-fatturazione-contratti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Dashboard fatturazione Fase 1: crea vendite.vw_dash_fatturazione_contratti,
        resolver area CONTRATTI a conteggi (contratto x mese coperto,
        transito = canone del mese in commessa, predicato allineato a
        fn_list_contratti_da_pushare).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM information_schema.columns
               WHERE table_schema = 'config'
                 AND table_name   = 'stati_doc_contratti'
                 AND column_name  = 'esito';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_contratti AS
              SELECT
                  'CONTRATTI'::varchar                           AS area,
                  (m.mese_ts)::date                              AS competenza_mese,
                  c.id                                           AS documento_id,
                  (c.uid)::text                                  AS documento_uid,
                  (c.numero)::text                               AS codice,
                  c.emittente_fiscale_id,
                  NULL::bigint                                   AS emittente_soggetto_ruolo_id,
                  NULL::numeric                                  AS valore_totale,
                  NULL::numeric                                  AS valore_transitato,
                  1::integer                                     AS unita_totali,
                  CASE WHEN gen.canone_generato
                       THEN 1 ELSE 0 END::integer                AS unita_transitate,
                  gen.canone_generato                            AS is_transitato,
                  false                                          AS is_abortito,
                  CASE
                    WHEN gen.canone_generato THEN NULL
                    WHEN sdc.codice_interno = 'DRAFT' THEN 'DOC_BOZZA'
                    ELSE 'CANONE_NON_GENERATO'
                  END::varchar                                   AS motivo_fermo,
                  -- Alias FEDELI alla sorgente (linee-guida-sql §6c).
                  sdc.codice_interno                             AS stato_codice_interno,
                  sdc.codice                                     AS stato_codice,
                  sdc.fase
                FROM vendite.contratti c
                JOIN config.stati_doc_contratti sdc
                  ON sdc.id = c.stato_doc_contratto_id
                 AND sdc.esito IS DISTINCT FROM 'NEGATIVO'
                JOIN config.sorgenti s
                  ON s.codice_interno = 'CONTRATTO'
                 AND s.attivo IS TRUE
                CROSS JOIN LATERAL generate_series(
                    date_trunc('month', c.valido_dal),
                    LEAST(COALESCE(date_trunc('month', c.valido_al),
                                   date_trunc('month', CURRENT_DATE::timestamp)),
                          date_trunc('month', CURRENT_DATE::timestamp)),
                    interval '1 month') AS m(mese_ts)
                CROSS JOIN LATERAL (
                  SELECT EXISTS (
                    SELECT 1
                      FROM vendite.commesse_attivita ca
                     WHERE ca.sorgente_tipo_id = s.id
                       AND ca.sorgente_uid     = (c.uid)::text
                       AND ca.competenza_mese  = (m.mese_ts)::date
                       AND ca.stato_emissione  = 'EMESSA'
                  ) AS canone_generato
                ) gen;

              COMMENT ON VIEW vendite.vw_dash_fatturazione_contratti IS
                'Dashboard fatturazione (brief-design-dashboard-fatturazione §5): resolver area CONTRATTI, a conteggi (D-3: canone atteso in euro rinviato a v2). Una riga per contratto vivo x mese coperto dalla validita'' (cap al mese corrente). Transitato nel mese = attivita di commessa EMESSA con sorgente CONTRATTO, sorgente_uid=uid e competenza_mese del mese (predicato allineato a fn_list_contratti_da_pushare). Contratti con esito NEGATIVO esclusi (n_abortiti=0 per quest''area in v1). motivo_fermo: DOC_BOZZA | CANONE_NON_GENERATO. Consumata da vw_dash_fatturazione_documenti.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_dash_fatturazione_contratti;
