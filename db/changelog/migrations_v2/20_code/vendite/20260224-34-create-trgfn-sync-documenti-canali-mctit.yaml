databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260224-34-create-trgfn-sync-documenti-canali-mctit.yaml

  - changeSet:
      id: 20260224-34-create-trgfn-sync-documenti-canali

      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: "Sync canali fatturazione su eventi documento (ordini, ddt, ddt_ordini, contratti)."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_documenti_sync_canali()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_source_code config.sorgenti.codice%TYPE;
                v_order_uid text;
                v_ddt_uid text;
                v_ord_src_id config.sorgenti.id%TYPE;
                v_ddt_src_id config.sorgenti.id%TYPE;
                v_ctr_src_id config.sorgenti.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Sincronizzare il registro canali fatturabili su eventi
                --   documento principali del dominio vendite.
                --
                -- Regole:
                --   - ordini: apre canale ORDINE_VENDITA; se da PREVENTIVO,
                --     consuma canale PREVENTIVO
                --   - ddt: apre canale DDT_VENDITA; se da ORDINE_VENDITA,
                --     consuma canale ordine
                --   - ddt_ordini: safety net consumo ordine->ddt
                --   - contratti: apre canale DIRETTO su sorgente CONTRATTO
                -- =========================================================

                IF TG_TABLE_SCHEMA <> 'vendite' THEN
                  RETURN COALESCE(NEW, OLD);
                END IF;

                -- Lookup unico per i codici sorgente usati dalla funzione.
                SELECT
                  max(CASE WHEN s.codice = 'ORDINE_VENDITA' THEN s.id END),
                  max(CASE WHEN s.codice = 'DDT_VENDITA' THEN s.id END),
                  max(CASE WHEN s.codice = 'CONTRATTO' THEN s.id END)
                INTO
                  v_ord_src_id,
                  v_ddt_src_id,
                  v_ctr_src_id
                FROM config.sorgenti s
                WHERE s.attivo IS TRUE
                  AND s.codice IN ('ORDINE_VENDITA', 'DDT_VENDITA', 'CONTRATTO');

                -- ---------------------------------------------------------
                -- ORDINI
                -- ---------------------------------------------------------
                IF TG_TABLE_NAME = 'ordini' THEN
                  IF TG_OP = 'INSERT'
                     OR (TG_OP = 'UPDATE'
                         AND (
                           NEW.sorgente_tipo_id IS DISTINCT FROM OLD.sorgente_tipo_id
                           OR NEW.sorgente_uid IS DISTINCT FROM OLD.sorgente_uid
                         )) THEN

                    IF v_ord_src_id IS NOT NULL THEN
                      PERFORM vendite.fn_set_documento_canale_stato(
                        p_sorgente_tipo_id => v_ord_src_id,
                        p_sorgente_uid => NEW.uid::text,
                        p_canale_codice => 'ORDINE_VENDITA',
                        p_stato_canale => 'APERTO',
                        p_meta => jsonb_build_object('event', 'ORDINI_UPSERT', 'table', TG_TABLE_NAME)
                      );
                    END IF;

                    IF NEW.sorgente_tipo_id IS NOT NULL AND NEW.sorgente_uid IS NOT NULL THEN
                      SELECT s.codice INTO v_source_code
                      FROM config.sorgenti s
                      WHERE s.id = NEW.sorgente_tipo_id
                      LIMIT 1;

                      IF v_source_code = 'PREVENTIVO' THEN
                        PERFORM vendite.fn_set_documento_canale_stato(
                          p_sorgente_tipo_id => NEW.sorgente_tipo_id,
                          p_sorgente_uid => NEW.sorgente_uid::text,
                          p_canale_codice => 'PREVENTIVO',
                          p_stato_canale => 'CONSUMATO',
                          p_target_sorgente_tipo_id => v_ord_src_id,
                          p_target_sorgente_uid => NEW.uid::text,
                          p_meta => jsonb_build_object('event', 'PREVENTIVO_TO_ORDINE', 'ordine_id', NEW.id)
                        );
                      END IF;
                    END IF;
                  END IF;

                  RETURN NEW;
                END IF;

                -- ---------------------------------------------------------
                -- DDT
                -- ---------------------------------------------------------
                IF TG_TABLE_NAME = 'ddt' THEN
                  IF TG_OP = 'INSERT'
                     OR (TG_OP = 'UPDATE'
                         AND (
                           NEW.sorgente_tipo_id IS DISTINCT FROM OLD.sorgente_tipo_id
                           OR NEW.sorgente_uid IS DISTINCT FROM OLD.sorgente_uid
                         )) THEN

                    IF v_ddt_src_id IS NOT NULL THEN
                      PERFORM vendite.fn_set_documento_canale_stato(
                        p_sorgente_tipo_id => v_ddt_src_id,
                        p_sorgente_uid => NEW.uid::text,
                        p_canale_codice => 'DDT_VENDITA',
                        p_stato_canale => 'APERTO',
                        p_meta => jsonb_build_object('event', 'DDT_UPSERT', 'table', TG_TABLE_NAME)
                      );
                    END IF;

                    IF NEW.sorgente_tipo_id IS NOT NULL AND NEW.sorgente_uid IS NOT NULL THEN
                      SELECT s.codice INTO v_source_code
                      FROM config.sorgenti s
                      WHERE s.id = NEW.sorgente_tipo_id
                      LIMIT 1;

                      IF v_source_code = 'ORDINE_VENDITA' THEN
                        IF v_ord_src_id IS NOT NULL AND v_ddt_src_id IS NOT NULL THEN
                          PERFORM vendite.fn_set_documento_canale_stato(
                            p_sorgente_tipo_id => v_ord_src_id,
                            p_sorgente_uid => NEW.sorgente_uid::text,
                            p_canale_codice => 'ORDINE_VENDITA',
                            p_stato_canale => 'CONSUMATO',
                            p_target_sorgente_tipo_id => v_ddt_src_id,
                            p_target_sorgente_uid => NEW.uid::text,
                            p_meta => jsonb_build_object('event', 'ORDINE_TO_DDT', 'ddt_id', NEW.id)
                          );
                        END IF;
                      END IF;
                    END IF;
                  END IF;

                  RETURN NEW;
                END IF;

                -- ---------------------------------------------------------
                -- DDT_ORDINI (safety net)
                -- ---------------------------------------------------------
                IF TG_TABLE_NAME = 'ddt_ordini' AND TG_OP = 'INSERT' THEN
                  SELECT o.uid::text INTO v_order_uid
                  FROM vendite.ordini o
                  WHERE o.id = NEW.ordine_id;

                  SELECT d.uid::text INTO v_ddt_uid
                  FROM vendite.ddt d
                  WHERE d.id = NEW.ddt_id;

                  IF v_ord_src_id IS NOT NULL
                     AND v_ddt_src_id IS NOT NULL
                     AND v_order_uid IS NOT NULL
                     AND v_ddt_uid IS NOT NULL THEN
                    PERFORM vendite.fn_set_documento_canale_stato(
                      p_sorgente_tipo_id => v_ord_src_id,
                      p_sorgente_uid => v_order_uid,
                      p_canale_codice => 'ORDINE_VENDITA',
                      p_stato_canale => 'CONSUMATO',
                      p_target_sorgente_tipo_id => v_ddt_src_id,
                      p_target_sorgente_uid => v_ddt_uid,
                      p_meta => jsonb_build_object('event', 'ORDINE_TO_DDT_LINK', 'ddt_id', NEW.ddt_id, 'ordine_id', NEW.ordine_id)
                    );
                  END IF;

                  RETURN NEW;
                END IF;

                -- ---------------------------------------------------------
                -- CONTRATTI
                -- ---------------------------------------------------------
                IF TG_TABLE_NAME = 'contratti' AND TG_OP = 'INSERT' THEN
                  IF v_ctr_src_id IS NOT NULL THEN
                    PERFORM vendite.fn_set_documento_canale_stato(
                      p_sorgente_tipo_id => v_ctr_src_id,
                      p_sorgente_uid => NEW.uid::text,
                      p_canale_codice => 'DIRETTO',
                      p_stato_canale => 'APERTO',
                      p_meta => jsonb_build_object('event', 'CONTRATTO_UPSERT', 'contratto_id', NEW.id)
                    );
                  END IF;

                  RETURN NEW;
                END IF;

                RETURN COALESCE(NEW, OLD);
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_documenti_sync_canali()
              IS 'Sincronizza documenti_fatturazione_canali su eventi ordini/ddt/ddt_ordini/contratti con transizioni PREVENTIVO->ORDINE e ORDINE->DDT.';

              DROP TRIGGER IF EXISTS trg_ordini_z90_sync_canali_ins_upd ON vendite.ordini;
              CREATE TRIGGER trg_ordini_z90_sync_canali_ins_upd
                AFTER INSERT OR UPDATE OF sorgente_tipo_id, sorgente_uid
                ON vendite.ordini
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_documenti_sync_canali();

              DROP TRIGGER IF EXISTS trg_ddt_z90_sync_canali_ins_upd ON vendite.ddt;
              CREATE TRIGGER trg_ddt_z90_sync_canali_ins_upd
                AFTER INSERT OR UPDATE OF sorgente_tipo_id, sorgente_uid
                ON vendite.ddt
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_documenti_sync_canali();

              DROP TRIGGER IF EXISTS trg_contratti_z90_sync_canali_ins ON vendite.contratti;
              CREATE TRIGGER trg_contratti_z90_sync_canali_ins
                AFTER INSERT
                ON vendite.contratti
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_documenti_sync_canali();

              DO $$
              BEGIN
                IF to_regclass('vendite.ddt_ordini') IS NOT NULL THEN
                  EXECUTE 'DROP TRIGGER IF EXISTS trg_ddt_ordini_z90_sync_canali_ins ON vendite.ddt_ordini';
                  EXECUTE 'CREATE TRIGGER trg_ddt_ordini_z90_sync_canali_ins
                           AFTER INSERT ON vendite.ddt_ordini
                           FOR EACH ROW
                           EXECUTE FUNCTION vendite.trgfn_documenti_sync_canali()';
                END IF;
              END
              $$;
