databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260224-12-create-fn-upsert-commessa-attivita-mctit.yaml

  - changeSet:
      id: 20260224-12-create-fn-upsert-commessa-attivita
      author: mctit
      comment: "Upsert riga commessa con idempotenza su (commessa_id, segment_key)."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_upsert_commessa_attivita(
                p_commessa_id vendite.commesse_attivita.commessa_id%TYPE,
                p_segment_key vendite.commesse_attivita.segment_key%TYPE,
                p_articolo_id vendite.commesse_attivita.articolo_id%TYPE,
                p_istanza_utility_id vendite.commesse_attivita.istanza_utility_id%TYPE,
                p_data_attivita vendite.commesse_attivita.data_attivita%TYPE,
                p_uom_id vendite.commesse_attivita.uom_id%TYPE,
                p_quantita vendite.commesse_attivita.quantita%TYPE,
                p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE,
                p_competenza_dal vendite.commesse_attivita.competenza_dal%TYPE,
                p_competenza_al vendite.commesse_attivita.competenza_al%TYPE,
                p_prezzo_snapshot vendite.commesse_attivita.prezzo_snapshot%TYPE,
                p_qta_operativa vendite.commesse_attivita.qta_operativa%TYPE DEFAULT NULL::numeric,
                p_uom_operativa_id vendite.commesse_attivita.uom_operativa_id%TYPE DEFAULT NULL::bigint,
                p_factor_to_base vendite.commesse_attivita.factor_to_base%TYPE DEFAULT 1::numeric,
                p_posticipa_al vendite.commesse_attivita.posticipa_al%TYPE DEFAULT NULL::date,
                p_tipo_doc_fiscale_id vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE DEFAULT NULL::bigint,
                p_valuta_id vendite.commesse_attivita.valuta_id%TYPE DEFAULT NULL::integer,
                p_area_geografica_id vendite.commesse_attivita.area_geografica_id%TYPE DEFAULT NULL::bigint,
                p_listino_versione_id vendite.commesse_attivita.listino_versione_id%TYPE DEFAULT NULL::bigint,
                p_prezzo_bloccato vendite.commesse_attivita.prezzo_bloccato%TYPE DEFAULT false,
                p_pricing_mode vendite.commesse_attivita.pricing_mode%TYPE DEFAULT 'FIXED'::varchar,
                p_prezzo_da_riallineare vendite.commesse_attivita.prezzo_da_riallineare%TYPE DEFAULT false,
                p_stato_approvazione vendite.commesse_attivita.stato_approvazione%TYPE DEFAULT 'BOZZA'::varchar,
                p_stato_emissione vendite.commesse_attivita.stato_emissione%TYPE DEFAULT 'NON_EMESSA'::varchar,
                p_sorgente_tipo_id vendite.commesse_attivita.sorgente_tipo_id%TYPE DEFAULT NULL::bigint,
                p_sorgente_uid vendite.commesse_attivita.sorgente_uid%TYPE DEFAULT NULL::text,
                p_meta vendite.commesse_attivita.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS vendite.commesse_attivita.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_attivita_id vendite.commesse_attivita.id%TYPE;
                v_existing_stato_emissione vendite.commesse_attivita.stato_emissione%TYPE;
                v_commessa_stato vendite.commesse.stato_commessa%TYPE;
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Inserire/aggiornare una riga commessa mantenendo
                --   idempotenza su (commessa_id, segment_key).
                --
                -- Regole:
                --   - upsert solo su commesse aperte
                --   - vietato aggiornare righe gia emesse
                --   - segment_key obbligatoria e stabile
                -- =========================================================
                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','commessa_id obbligatorio','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    'commessa_id obbligatorio'
                  );
                END IF;

                IF p_segment_key IS NULL OR btrim(p_segment_key) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','segment_key obbligatoria')
                    ),
                    NULL::uuid,
                    'segment_key obbligatoria'
                  );
                END IF;

                IF length(btrim(p_segment_key)) > 128 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','segment_key troppo lunga')
                    ),
                    NULL::uuid,
                    'segment_key troppo lunga'
                  );
                END IF;

                IF p_uom_id IS NULL OR p_uom_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','uom_id obbligatorio','uom_id',p_uom_id)
                    ),
                    NULL::uuid,
                    'uom_id obbligatorio'
                  );
                END IF;

                IF p_istanza_utility_id IS NULL OR p_istanza_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','istanza_utility_id obbligatoria','istanza_utility_id',p_istanza_utility_id)
                    ),
                    NULL::uuid,
                    'istanza_utility_id obbligatoria'
                  );
                END IF;
               /*   
                IF p_quantita IS NULL OR p_quantita <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','quantita obbligatoria > 0','quantita',p_quantita)
                    ),
                    NULL::uuid,
                    'quantita obbligatoria > 0'
                  );
                END IF;

                IF p_prezzo_snapshot IS NULL OR p_prezzo_snapshot < 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','prezzo_snapshot non valido','prezzo_snapshot',p_prezzo_snapshot)
                    ),
                    NULL::uuid,
                    'prezzo_snapshot non valido'
                  );
                END IF; */

                v_competenza_mese := date_trunc('month', p_competenza_mese)::date;

                SELECT c.stato_commessa
                INTO v_commessa_stato
                FROM vendite.commesse c
                WHERE c.id = p_commessa_id;

                IF v_commessa_stato IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','commessa non trovata','commessa_id',p_commessa_id)
                    ),
                    NULL::uuid,
                    concat('commessa non trovata: ', p_commessa_id::text)
                  );
                END IF;

                IF v_commessa_stato IN ('CHIUSA', 'ANNULLATA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object(
                        'detail','commessa non modificabile in stato finale',
                        'commessa_id',p_commessa_id,
                        'stato_commessa',v_commessa_stato
                      )
                    ),
                    NULL::uuid,
                    concat('commessa non modificabile in stato finale: ', p_commessa_id::text, 
                    ' stato: ', v_commessa_stato)
                  );
                END IF;

                SELECT ca.stato_emissione
                INTO v_existing_stato_emissione
                FROM vendite.commesse_attivita ca
                WHERE ca.commessa_id = p_commessa_id
                  AND ca.segment_key = btrim(p_segment_key)
                FOR UPDATE;

                IF v_existing_stato_emissione IS NOT NULL
                   AND v_existing_stato_emissione <> 'NON_EMESSA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object(
                        'detail','riga commessa gia emessa, update non consentito',
                        'commessa_id',p_commessa_id,
                        'segment_key',p_segment_key,
                        'stato_emissione',v_existing_stato_emissione
                      )
                    ),
                    NULL::uuid,
                    concat('riga commessa gia emessa, update non consentito: ', p_commessa_id::text, 
                    ' segment_key: ', p_segment_key::text)
                  );
                END IF;

                INSERT INTO vendite.commesse_attivita (
                  commessa_id,
                  segment_key,
                  articolo_id,
                  istanza_utility_id,
                  data_attivita,
                  uom_id,
                  quantita,
                  qta_operativa,
                  uom_operativa_id,
                  factor_to_base,
                  competenza_mese,
                  competenza_dal,
                  competenza_al,
                  posticipa_al,
                  tipo_doc_fiscale_id,
                  valuta_id,
                  area_geografica_id,
                  listino_versione_id,
                  prezzo_snapshot,
                  prezzo_bloccato,
                  pricing_mode,
                  prezzo_da_riallineare,
                  stato_approvazione,
                  stato_emissione,
                  sorgente_tipo_id,
                  sorgente_uid,
                  meta
                )
                VALUES (
                  p_commessa_id,
                  btrim(p_segment_key),
                  p_articolo_id,
                  p_istanza_utility_id,
                  p_data_attivita,
                  p_uom_id,
                  p_quantita,
                  p_qta_operativa,
                  p_uom_operativa_id,
                  COALESCE(p_factor_to_base, 1::numeric),
                  v_competenza_mese,
                  p_competenza_dal,
                  p_competenza_al,
                  p_posticipa_al,
                  p_tipo_doc_fiscale_id,
                  p_valuta_id,
                  p_area_geografica_id,
                  p_listino_versione_id,
                  p_prezzo_snapshot,
                  COALESCE(p_prezzo_bloccato, false),
                  COALESCE(p_pricing_mode, 'FIXED'::varchar),
                  COALESCE(p_prezzo_da_riallineare, false),
                  COALESCE(p_stato_approvazione, 'BOZZA'::varchar),
                  COALESCE(p_stato_emissione, 'NON_EMESSA'::varchar),
                  p_sorgente_tipo_id,
                  NULLIF(btrim(p_sorgente_uid), ''),
                  COALESCE(p_meta, '{}'::jsonb)
                )
                ON CONFLICT (commessa_id, segment_key) DO UPDATE
                SET articolo_id = EXCLUDED.articolo_id,
                    istanza_utility_id = EXCLUDED.istanza_utility_id,
                    data_attivita = EXCLUDED.data_attivita,
                    uom_id = EXCLUDED.uom_id,
                    quantita = EXCLUDED.quantita,
                    qta_operativa = EXCLUDED.qta_operativa,
                    uom_operativa_id = EXCLUDED.uom_operativa_id,
                    factor_to_base = EXCLUDED.factor_to_base,
                    competenza_mese = EXCLUDED.competenza_mese,
                    competenza_dal = EXCLUDED.competenza_dal,
                    competenza_al = EXCLUDED.competenza_al,
                    posticipa_al = EXCLUDED.posticipa_al,
                    tipo_doc_fiscale_id = EXCLUDED.tipo_doc_fiscale_id,
                    valuta_id = EXCLUDED.valuta_id,
                    area_geografica_id = EXCLUDED.area_geografica_id,
                    listino_versione_id = EXCLUDED.listino_versione_id,
                    prezzo_snapshot = EXCLUDED.prezzo_snapshot,
                    prezzo_bloccato = EXCLUDED.prezzo_bloccato,
                    pricing_mode = EXCLUDED.pricing_mode,
                    prezzo_da_riallineare = EXCLUDED.prezzo_da_riallineare,
                    stato_approvazione = EXCLUDED.stato_approvazione,
                    stato_emissione = EXCLUDED.stato_emissione,
                    sorgente_tipo_id = EXCLUDED.sorgente_tipo_id,
                    sorgente_uid = EXCLUDED.sorgente_uid,
                    meta = COALESCE(vendite.commesse_attivita.meta, '{}'::jsonb) || COALESCE(EXCLUDED.meta, '{}'::jsonb)
                RETURNING id INTO v_attivita_id;

                RETURN v_attivita_id;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_upsert_commessa_attivita(bigint, varchar, uuid, bigint, date, bigint, numeric, date, date, date, numeric, numeric, bigint, numeric, date, bigint, integer, bigint, bigint, boolean, varchar, boolean, varchar, varchar, bigint, text, jsonb)
              IS 'Upsert idempotente di commesse_attivita su (commessa_id, segment_key), con blocco update per righe gia emesse.';

  - changeSet:
      id: 20260224-12-02-create-fn-upsert-commessa-attivita
      author: mctit
      comment: "Update upsert commessa_attivita: consente valori negativi, blocca quantita=0, aggiunge tipo_movimento e tipo_consumo in meta."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_upsert_commessa_attivita(
                p_commessa_id vendite.commesse_attivita.commessa_id%TYPE,
                p_segment_key vendite.commesse_attivita.segment_key%TYPE,
                p_articolo_id vendite.commesse_attivita.articolo_id%TYPE,
                p_istanza_utility_id vendite.commesse_attivita.istanza_utility_id%TYPE,
                p_data_attivita vendite.commesse_attivita.data_attivita%TYPE,
                p_uom_id vendite.commesse_attivita.uom_id%TYPE,
                p_quantita vendite.commesse_attivita.quantita%TYPE,
                p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE,
                p_competenza_dal vendite.commesse_attivita.competenza_dal%TYPE,
                p_competenza_al vendite.commesse_attivita.competenza_al%TYPE,
                p_prezzo_snapshot vendite.commesse_attivita.prezzo_snapshot%TYPE,
                p_qta_operativa vendite.commesse_attivita.qta_operativa%TYPE DEFAULT NULL::numeric,
                p_uom_operativa_id vendite.commesse_attivita.uom_operativa_id%TYPE DEFAULT NULL::bigint,
                p_factor_to_base vendite.commesse_attivita.factor_to_base%TYPE DEFAULT 1::numeric,
                p_posticipa_al vendite.commesse_attivita.posticipa_al%TYPE DEFAULT NULL::date,
                p_tipo_doc_fiscale_id vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE DEFAULT NULL::bigint,
                p_valuta_id vendite.commesse_attivita.valuta_id%TYPE DEFAULT NULL::integer,
                p_area_geografica_id vendite.commesse_attivita.area_geografica_id%TYPE DEFAULT NULL::bigint,
                p_listino_versione_id vendite.commesse_attivita.listino_versione_id%TYPE DEFAULT NULL::bigint,
                p_prezzo_bloccato vendite.commesse_attivita.prezzo_bloccato%TYPE DEFAULT false,
                p_pricing_mode vendite.commesse_attivita.pricing_mode%TYPE DEFAULT 'FIXED'::varchar,
                p_prezzo_da_riallineare vendite.commesse_attivita.prezzo_da_riallineare%TYPE DEFAULT false,
                p_stato_approvazione vendite.commesse_attivita.stato_approvazione%TYPE DEFAULT 'BOZZA'::varchar,
                p_stato_emissione vendite.commesse_attivita.stato_emissione%TYPE DEFAULT 'NON_EMESSA'::varchar,
                p_sorgente_tipo_id vendite.commesse_attivita.sorgente_tipo_id%TYPE DEFAULT NULL::bigint,
                p_sorgente_uid vendite.commesse_attivita.sorgente_uid%TYPE DEFAULT NULL::text,
                p_tipo_movimento varchar DEFAULT 'NORMALE',
                p_tipo_consumo varchar DEFAULT 'ACCONTO',
                p_meta vendite.commesse_attivita.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS vendite.commesse_attivita.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_attivita_id vendite.commesse_attivita.id%TYPE;
                v_existing_stato_emissione vendite.commesse_attivita.stato_emissione%TYPE;
                v_commessa_stato vendite.commesse.stato_commessa%TYPE;
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
                v_tipo_movimento varchar(32);
                v_tipo_consumo varchar(32);
                v_meta_effective jsonb;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Inserire/aggiornare una riga commessa mantenendo
                --   idempotenza su (commessa_id, segment_key).
                --
                -- Regole:
                --   - quantita != 0 (negativi ammessi per utility/rettifiche)
                --   - prezzo_snapshot obbligatorio (negativi ammessi)
                --   - tipo_movimento/tipo_consumo tracciati in meta
                -- =========================================================
                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','commessa_id obbligatorio','commessa_id',p_commessa_id)),
                    NULL::uuid, 'commessa_id obbligatorio'
                  );
                END IF;

                IF p_segment_key IS NULL OR btrim(p_segment_key) = '' OR length(btrim(p_segment_key)) > 128 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','segment_key non valida')),
                    NULL::uuid, 'segment_key non valida'
                  );
                END IF;

                IF p_uom_id IS NULL OR p_uom_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','uom_id obbligatorio','uom_id',p_uom_id)),
                    NULL::uuid, 'uom_id obbligatorio'
                  );
                END IF;

                IF p_istanza_utility_id IS NULL OR p_istanza_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','istanza_utility_id obbligatoria','istanza_utility_id',p_istanza_utility_id)),
                    NULL::uuid, 'istanza_utility_id obbligatoria'
                  );
                END IF;

                IF p_quantita IS NULL OR p_quantita = 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','quantita obbligatoria e diversa da 0','quantita',p_quantita)),
                    NULL::uuid, 'quantita obbligatoria e diversa da 0'
                  );
                END IF;

                IF p_prezzo_snapshot IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','prezzo_snapshot obbligatorio')),
                    NULL::uuid, 'prezzo_snapshot obbligatorio'
                  );
                END IF;

                v_tipo_movimento := upper(COALESCE(NULLIF(btrim(p_tipo_movimento), ''), 'NORMALE'));
                IF v_tipo_movimento NOT IN ('NORMALE', 'RETTIFICA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_movimento non valido','tipo_movimento',v_tipo_movimento)),
                    NULL::uuid, 'tipo_movimento non valido'
                  );
                END IF;

                v_tipo_consumo := upper(COALESCE(NULLIF(btrim(p_tipo_consumo), ''), 'CONGUAGLIO'));
                IF v_tipo_consumo NOT IN ('ACCONTO', 'CONGUAGLIO', 'STORNO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_consumo non valido','tipo_consumo',v_tipo_consumo)),
                    NULL::uuid, 'tipo_consumo non valido'
                  );
                END IF;

                v_competenza_mese := date_trunc('month', p_competenza_mese)::date;
                v_meta_effective := COALESCE(p_meta, '{}'::jsonb) || jsonb_build_object(
                  'tipo_movimento', v_tipo_movimento,
                  'tipo_consumo', v_tipo_consumo
                );

                SELECT c.stato_commessa INTO v_commessa_stato
                FROM vendite.commesse c
                WHERE c.id = p_commessa_id;

                IF v_commessa_stato IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','commessa non trovata','commessa_id',p_commessa_id)),
                    NULL::uuid, concat('commessa non trovata: ', p_commessa_id::text)
                  );
                END IF;

                IF v_commessa_stato IN ('CHIUSA', 'ANNULLATA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','commessa non modificabile in stato finale','commessa_id',p_commessa_id,'stato_commessa',v_commessa_stato)),
                    NULL::uuid, concat('commessa non modificabile in stato finale: ', p_commessa_id::text, ' stato: ', v_commessa_stato)
                  );
                END IF;

                SELECT ca.stato_emissione INTO v_existing_stato_emissione
                FROM vendite.commesse_attivita ca
                WHERE ca.commessa_id = p_commessa_id
                  AND ca.segment_key = btrim(p_segment_key)
                FOR UPDATE;

                IF v_existing_stato_emissione IS NOT NULL
                   AND v_existing_stato_emissione <> 'NON_EMESSA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_GENERICO',
                    jsonb_build_object('scope','COMMESSE','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','riga commessa gia emessa, update non consentito','commessa_id',p_commessa_id,'segment_key',p_segment_key,'stato_emissione',v_existing_stato_emissione)),
                    NULL::uuid, concat('riga commessa gia emessa, update non consentito: ', p_commessa_id::text, ' segment_key: ', p_segment_key::text)
                  );
                END IF;

                INSERT INTO vendite.commesse_attivita (
                  commessa_id, segment_key, articolo_id, istanza_utility_id, data_attivita,
                  uom_id, quantita, qta_operativa, uom_operativa_id, factor_to_base,
                  competenza_mese, competenza_dal, competenza_al, posticipa_al,
                  tipo_doc_fiscale_id, valuta_id, area_geografica_id, listino_versione_id,
                  prezzo_snapshot, prezzo_bloccato, pricing_mode, prezzo_da_riallineare,
                  stato_approvazione, stato_emissione, sorgente_tipo_id, sorgente_uid, meta
                )
                VALUES (
                  p_commessa_id, btrim(p_segment_key), p_articolo_id, p_istanza_utility_id, p_data_attivita,
                  p_uom_id, p_quantita, p_qta_operativa, p_uom_operativa_id, COALESCE(p_factor_to_base, 1::numeric),
                  v_competenza_mese, p_competenza_dal, p_competenza_al, p_posticipa_al,
                  p_tipo_doc_fiscale_id, p_valuta_id, p_area_geografica_id, p_listino_versione_id,
                  p_prezzo_snapshot, COALESCE(p_prezzo_bloccato, false), COALESCE(p_pricing_mode, 'FIXED'::varchar), COALESCE(p_prezzo_da_riallineare, false),
                  COALESCE(p_stato_approvazione, 'BOZZA'::varchar), COALESCE(p_stato_emissione, 'NON_EMESSA'::varchar), p_sorgente_tipo_id, NULLIF(btrim(p_sorgente_uid), ''), v_meta_effective
                )
                ON CONFLICT (commessa_id, segment_key) DO UPDATE
                SET articolo_id = EXCLUDED.articolo_id,
                    istanza_utility_id = EXCLUDED.istanza_utility_id,
                    data_attivita = EXCLUDED.data_attivita,
                    uom_id = EXCLUDED.uom_id,
                    quantita = EXCLUDED.quantita,
                    qta_operativa = EXCLUDED.qta_operativa,
                    uom_operativa_id = EXCLUDED.uom_operativa_id,
                    factor_to_base = EXCLUDED.factor_to_base,
                    competenza_mese = EXCLUDED.competenza_mese,
                    competenza_dal = EXCLUDED.competenza_dal,
                    competenza_al = EXCLUDED.competenza_al,
                    posticipa_al = EXCLUDED.posticipa_al,
                    tipo_doc_fiscale_id = EXCLUDED.tipo_doc_fiscale_id,
                    valuta_id = EXCLUDED.valuta_id,
                    area_geografica_id = EXCLUDED.area_geografica_id,
                    listino_versione_id = EXCLUDED.listino_versione_id,
                    prezzo_snapshot = EXCLUDED.prezzo_snapshot,
                    prezzo_bloccato = EXCLUDED.prezzo_bloccato,
                    pricing_mode = EXCLUDED.pricing_mode,
                    prezzo_da_riallineare = EXCLUDED.prezzo_da_riallineare,
                    stato_approvazione = EXCLUDED.stato_approvazione,
                    stato_emissione = EXCLUDED.stato_emissione,
                    sorgente_tipo_id = EXCLUDED.sorgente_tipo_id,
                    sorgente_uid = EXCLUDED.sorgente_uid,
                    meta = COALESCE(vendite.commesse_attivita.meta, '{}'::jsonb) || COALESCE(EXCLUDED.meta, '{}'::jsonb)
                RETURNING id INTO v_attivita_id;

                RETURN v_attivita_id;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_upsert_commessa_attivita(bigint, varchar, uuid, bigint, date, bigint, numeric, date, date, date, numeric, numeric, bigint, numeric, date, bigint, integer, bigint, bigint, boolean, varchar, boolean, varchar, varchar, bigint, text, varchar, varchar, jsonb)
              IS 'Upsert idempotente su commesse_attivita: quantita diversa da 0, prezzo obbligatorio (anche negativo), tipo_movimento/tipo_consumo salvati in meta.';

