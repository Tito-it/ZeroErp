# L'ESIGIBILITA' DI UNA RIGA DI FATTURA
#   vendite.fn_esigibilita_iva_fattura(p_fattura_id, p_iva_id)
#   Brief: brief-db-esigibilita-iva-per-cassa-emittente, sezioni 8.1, 8.2 (D-7, D-8)
#
# -- PERCHE' UNA FUNZIONE E NON UN BLOCCO NEL TRIGGER -------------
#   Due chiamanti con la stessa domanda: il trigger di riga
#   (vendite.trgfn_fatture_righe_guard_normalize, alla scrittura) e il
#   ricalcolo del riepilogo (vendite.fn_ricalcola_riepilogo_iva_fattura, che
#   riallinea le righe prima di aggregarle). Se la risposta stesse nel solo
#   trigger, il ricalcolo dovrebbe ricopiarla.
#
# -- IL REGIME: QUELLO DELLO SNAPSHOT, SE C'E' (D-8) --------------
#   Lo snapshot dell'intestazione congela regime_fiscale_rf. Da allora la
#   riga segue il regime che la testata stampa; prima, quello vivo.
#   ⚠️ L'emittente si raggiunge da emittente_soggetto_ruolo_id
#   (emittenti_fiscali.soggetto_ruolo_id e' UNIQUE): la fattura non ha
#   emittente_fiscale_id.
#
# ⚠️ Fattura inesistente: nessuna riga in testata, tutte le parti NULL, la
#   coppia esce NULL/NULL. Il chiamante e' un trigger di una riga che punta a
#   una fattura (FK): il caso non nasce dal percorso vero.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261001-05-create-fn-esigibilita-iva-fattura-mctit.yaml

  - changeSet:
      id: 20261001-05-create-fn-esigibilita-iva-fattura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_esigibilita_iva_fattura: la coppia (esigibilita, split_payment) di una
        riga di fattura, con il regime dello snapshot dell'intestazione se c'e' (D-8) e il
        cliente del billing account della testata. La chiamano il trigger di riga e il
        ricalcolo del riepilogo. Brief: brief-db-esigibilita-iva-per-cassa-emittente (D-7, D-8).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_esigibilita_iva_documento';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_esigibilita_iva_fattura(
                  p_fattura_id  vendite.fatture.id%TYPE,
                  p_iva_id      config.iva.id%TYPE
              )
              RETURNS TABLE(
                  esigibilita    vendite.fatture_righe.esigibilita%TYPE,
                  split_payment  vendite.fatture_righe.split_payment%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: la coppia (esigibilita, split_payment) di una riga della
              --   fattura p_fattura_id con codice IVA p_iva_id. Regime: quello
              --   congelato nello snapshot, se c'e', altrimenti quello vivo (D-8).
              DECLARE
                  v_emittente_id  anagrafiche.emittenti_fiscali.id%TYPE;
                  v_ba_id         vendite.fatture.billing_account_id%TYPE;
                  v_regime_snap   anagrafiche.emittenti_fiscali.regime_fiscale_rf%TYPE;
              BEGIN
                  SELECT ef.id,
                         f.billing_account_id,
                         f.emittente_snapshot ->> 'regime_fiscale_rf'
                    INTO v_emittente_id, v_ba_id, v_regime_snap
                    FROM vendite.fatture f
                    LEFT JOIN anagrafiche.emittenti_fiscali ef
                           ON ef.soggetto_ruolo_id = f.emittente_soggetto_ruolo_id
                   WHERE f.id = p_fattura_id;

                  RETURN QUERY
                  SELECT e.esigibilita, e.split_payment
                    FROM script.fn_esigibilita_iva_documento(
                             v_emittente_id, v_ba_id, p_iva_id, v_regime_snap) e;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_esigibilita_iva_fattura(
                  vendite.fatture.id%TYPE, config.iva.id%TYPE) IS
                  'La coppia (esigibilita, split_payment) di una riga di fattura: emittente dalla '
                  'testata (emittente_soggetto_ruolo_id -> emittenti_fiscali), cliente dal billing '
                  'account, e il REGIME congelato nello snapshot dell''intestazione se c''e'' '
                  '(emittente_snapshot ->> regime_fiscale_rf), quello vivo altrimenti: righe e '
                  'testata dicono lo stesso regime (D-8). La regola e'' script.fn_esigibilita_iva, '
                  'la catena delle parti script.fn_esigibilita_iva_documento. La chiamano '
                  'vendite.trgfn_fatture_righe_guard_normalize e '
                  'vendite.fn_ricalcola_riepilogo_iva_fattura. Brief: '
                  'brief-db-esigibilita-iva-per-cassa-emittente.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_esigibilita_iva_fattura(
                  vendite.fatture.id%TYPE, config.iva.id%TYPE);
