# IL RESO NASCE SOLO DA UNA BOLLA: vendite.trgfn_resi_guard_cliente_ddt
#   Brief: brief-db-sorgente-documento-e-riga §7.3 «Il giro finale bis», G-3 (Tid, 2026-11-08).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   La provenienza di un reso e' solo DDT_VENDITA (G-3). Il guard del cliente usciva in
#   silenzio davanti a un altro tipo: il reso passava senza il controllo del billing
#   account. Ora un altro tipo e' E_RESO_SORGENTE_NON_DDT (codice nuovo, codici_errore.csv
#   e messaggi_errore.csv). Il tipo lo fa valere qui perche' un CHECK non legge il
#   catalogo; la forma (la chiave in sorgente_id) la tiene chk_resi_sorgente_forma
#   (00_schema/vendite/20261110-20).
#   La bolla si cerca per sorgente_id: il ramo «OR d.uid = sorgente_uid» non trova mai
#   niente (la bolla ha chiave id, e sorgente_uid e' vuota per vincolo) e impedirebbe di
#   ritirare l'indice su sorgente_uid.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Corpo e COMMENT; il trigger non si rimonta. Corpo di partenza: il vivo (dbdev,
#   2026-11-08). Rollback: il corpo e il COMMENT di prima. pgTAP:
#   vendite/test-sorgente-testate-bolle-resi-v1 e il presidio
#   vendite/test-sorgente-commenti-al-presente-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261110-21-update-trgfn-resi-guard-cliente-ddt-solo-bolla-mctit.yaml

  - changeSet:
      id: 20261110-21-update-trgfn-resi-guard-cliente-ddt-solo-bolla
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_resi_guard_cliente_ddt: una provenienza del reso che non e' una bolla di vendita
        e' E_RESO_SORGENTE_NON_DDT; la bolla si cerca per sorgente_id. brief-db-sorgente-documento-e-riga
        §7.3, G-3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_resi_guard_cliente_ddt';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_guard_cliente_ddt()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: il reso nasce da una bolla di vendita, e ha il billing
              --   account di quella bolla, NULL compreso.
              --   Su INSERT e su ogni UPDATE che tocca billing account o sorgente,
              --   in qualunque stato: il billing account della bolla e' bloccato
              --   fuori bozza, quindi quello del reso non cambia mai.
              --   Una provenienza di un altro tipo e' E_RESO_SORGENTE_NON_DDT; una
              --   bolla che non si trova (o non si vede) e' E_DOC_SORGENTE_NON_TROVATA.
              --   La bolla ha chiave id: si cerca per sorgente_id (chk_resi_sorgente_forma
              --   vuole sorgente_uid vuota).
              -- Uso: BEFORE INSERT OR UPDATE, fascia _z10_ (dopo il normalize).
              DECLARE
                  v_ba_ddt   vendite.ddt.billing_account_id%TYPE;
                  v_ddt_lbl  text;
                  v_reso_lbl text;
                  v_tipo     config.sorgenti.codice_interno%TYPE;
              BEGIN
                  IF TG_OP = 'UPDATE'
                     AND NEW.billing_account_id IS NOT DISTINCT FROM OLD.billing_account_id
                     AND NEW.sorgente_tipo_id   IS NOT DISTINCT FROM OLD.sorgente_tipo_id
                     AND NEW.sorgente_uid       IS NOT DISTINCT FROM OLD.sorgente_uid
                     AND NEW.sorgente_id        IS NOT DISTINCT FROM OLD.sorgente_id THEN
                      RETURN NEW;
                  END IF;

                  v_reso_lbl := 'reso ' || COALESCE(NEW.numero, '#' || NEW.id::text);

                  SELECT s.codice_interno INTO v_tipo
                    FROM config.sorgenti s
                   WHERE s.id = NEW.sorgente_tipo_id;

                  IF v_tipo IS DISTINCT FROM 'DDT_VENDITA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_RESO_SORGENTE_NON_DDT',
                          jsonb_build_object(
                              'campo',            'sorgente_tipo_id',
                              'reso_id',          NEW.id,
                              'sorgente_tipo_id', NEW.sorgente_tipo_id,
                              'sorgente',         v_tipo),
                          NEW.tx_id,
                          v_reso_lbl,
                          COALESCE(v_tipo, '#' || COALESCE(NEW.sorgente_tipo_id::text, '?')));
                  END IF;

                  SELECT d.billing_account_id, 'DDT ' || COALESCE(d.numero, '#' || d.id::text)
                    INTO v_ba_ddt, v_ddt_lbl
                    FROM vendite.ddt d
                   WHERE d.id = NEW.sorgente_id;

                  -- Bolla dichiarata e non trovata, o invisibile sotto RLS: fail-closed.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_DOC_SORGENTE_NON_TROVATA',
                          jsonb_build_object(
                              'campo',        'sorgente_id',
                              'reso_id',      NEW.id,
                              'sorgente',     'DDT_VENDITA',
                              'sorgente_id',  NEW.sorgente_id),
                          NEW.tx_id,
                          v_reso_lbl,
                          'DDT');
                  END IF;

                  IF v_ba_ddt IS DISTINCT FROM NEW.billing_account_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_DOC_CLIENTE_DIVERSO_DA_SORGENTE',
                          jsonb_build_object(
                              'campo',                  'billing_account_id',
                              'reso_id',                NEW.id,
                              'billing_account_id',     NEW.billing_account_id,
                              'sorgente_id',            NEW.sorgente_id,
                              'billing_account_ddt',    v_ba_ddt),
                          NEW.tx_id,
                          v_reso_lbl,
                          v_ddt_lbl);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_guard_cliente_ddt() IS
                'Guard BEFORE INSERT OR UPDATE su vendite.resi, fascia _z10_ (dopo vendite.trgfn_resi_normalize): il reso nasce da una bolla di vendita e ne ha il billing account, NULL compreso. Una provenienza di un altro tipo e'' E_RESO_SORGENTE_NON_DDT; un billing account diverso e'' E_DOC_CLIENTE_DIVERSO_DA_SORGENTE, come bolla e fulfillment; una bolla dichiarata e non trovata, inesistente o invisibile sotto RLS, e'' E_DOC_SORGENTE_NON_TROVATA (su INSERT parla prima vendite.trgfn_resi_guard_ddt_consegnato). La bolla ha chiave id e si cerca per sorgente_id (chk_resi_sorgente_forma vuole sorgente_uid vuota). Non e'' un doppione del guard unico della provenienza (script.trgfn_guard_sorgente): quello verifica che la bolla esista quando si scrive la sorgente, questo fa valere il tipo, scatta anche quando cambia il solo billing account, e se non vede la bolla rifiuta invece di non confrontare. Vale in qualunque stato: il billing account della bolla e'' bloccato fuori bozza e la bolla di un reso e'' consegnata. La bolla si legge come INVOKER, come nel normalize.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_guard_cliente_ddt()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: il reso ha il billing account del DDT da cui nasce,
              --   NULL compreso (D-3 e D-6 di brief-db-esecutivi-ba-coppia).
              --   Su INSERT e su ogni UPDATE che tocca BA o sorgente, in
              --   qualunque stato: il BA del DDT sorgente e' bloccato fuori
              --   bozza, quindi quello del reso non cambia mai.
              --   rev 2026-10-10 (§10.2 domanda 3): un DDT sorgente che non si
              --   trova (o non si vede) e' un errore, non «niente da confrontare».
              -- Uso: BEFORE INSERT OR UPDATE, fascia _z10_ (dopo il normalize).
              DECLARE
                  v_ba_ddt   vendite.ddt.billing_account_id%TYPE;
                  v_ddt_lbl  text;
                  v_reso_lbl text;
              BEGIN
                  IF TG_OP = 'UPDATE'
                     AND NEW.billing_account_id IS NOT DISTINCT FROM OLD.billing_account_id
                     AND NEW.sorgente_tipo_id   IS NOT DISTINCT FROM OLD.sorgente_tipo_id
                     AND NEW.sorgente_uid       IS NOT DISTINCT FROM OLD.sorgente_uid
                     AND NEW.sorgente_id        IS NOT DISTINCT FROM OLD.sorgente_id THEN
                      RETURN NEW;
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM config.sorgenti s
                                  WHERE s.id = NEW.sorgente_tipo_id
                                    AND s.codice_interno = 'DDT_VENDITA') THEN
                      RETURN NEW;
                  END IF;

                  v_reso_lbl := 'reso ' || COALESCE(NEW.numero, '#' || NEW.id::text);

                  SELECT d.billing_account_id, 'DDT ' || COALESCE(d.numero, '#' || d.id::text)
                    INTO v_ba_ddt, v_ddt_lbl
                    FROM vendite.ddt d
                   WHERE (d.id = NEW.sorgente_id OR d.uid = NEW.sorgente_uid);

                  -- DDT dichiarato e non trovato, o invisibile sotto RLS: fail-
                  -- closed (rev 2026-10-10). Prima passava.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_DOC_SORGENTE_NON_TROVATA',
                          jsonb_build_object(
                              'campo',        'sorgente_uid',
                              'reso_id',      NEW.id,
                              'sorgente',     'DDT_VENDITA',
                              'sorgente_uid', NEW.sorgente_uid,
                              'sorgente_id',  NEW.sorgente_id),
                          NEW.tx_id,
                          v_reso_lbl,
                          'DDT');
                  END IF;

                  IF v_ba_ddt IS DISTINCT FROM NEW.billing_account_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME::text, 'E_DOC_CLIENTE_DIVERSO_DA_SORGENTE',
                          jsonb_build_object(
                              'campo',                  'billing_account_id',
                              'reso_id',                NEW.id,
                              'billing_account_id',     NEW.billing_account_id,
                              'sorgente_uid',           NEW.sorgente_uid,
                              'sorgente_id',            NEW.sorgente_id,
                              'billing_account_ddt',    v_ba_ddt),
                          NEW.tx_id,
                          v_reso_lbl,
                          v_ddt_lbl);
                  END IF;

                  RETURN NEW;
              END;
              $function$
              ;

              COMMENT ON FUNCTION vendite.trgfn_resi_guard_cliente_ddt() IS 'Guard BEFORE INSERT OR UPDATE su vendite.resi, fascia _z10_ (dopo vendite.trgfn_resi_normalize): il reso ha il billing account della bolla sorgente (DDT_VENDITA), NULL compreso; altrimenti E_DOC_CLIENTE_DIVERSO_DA_SORGENTE, come bolla e fulfillment. La bolla si cerca con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid), e un cambio di sorgente si vede su tutte e due le chiavi. Una bolla dichiarata e non trovata, inesistente o invisibile sotto RLS, e'' E_DOC_SORGENTE_NON_TROVATA (su INSERT parla prima vendite.trgfn_resi_guard_ddt_consegnato). Non e'' un doppione del guard unico della provenienza (script.trgfn_guard_sorgente): quello verifica la bolla quando si scrive la sorgente, questo scatta anche quando cambia il solo billing account, e se non vede la bolla rifiuta invece di non confrontare. Vale in qualunque stato: il billing account della bolla e'' bloccato fuori bozza e la bolla di un reso e'' consegnata, quindi il reso non ha un lock fuori bozza sul cliente. La bolla si legge come INVOKER, come nel normalize.';
