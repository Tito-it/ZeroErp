# Passo 2d-bis del piano §8 di brief-db-note-credito-prerequisiti-be-fe.md.
# La risposta alla domanda P-2 si scrive dove verra' cercata.
#
# ⭐ SOLO UN COMMENTO, e vale un changeSet. Il backend ha chiesto: «esiste un
#    percorso di reset che possa raggiungere un documento numerato? Se si',
#    fn_cleanup_fatture_by_ids deve cancellare anche la coppia in
#    vendite.fatture_rettifiche».
#
#    La risposta e' NO, e ci sono volute tre funzioni di check per stabilirlo.
#    Se resta nel brief, la prossima persona che si pone la stessa domanda —
#    guardando questa funzione, che e' il posto naturale da cui guardare —
#    rifara' tutta l'indagine. Peggio: potrebbe concludere che la cancellazione
#    manchi per dimenticanza e aggiungerla, che e' esattamente la modifica
#    sbagliata.
#
#    Un «non lo fa, e questo e' il motivo» costa una riga e chiude la domanda
#    per sempre. Un'assenza non commentata e' indistinguibile da una svista.
#
# ⚠️ E SI CORREGGE UNA RUGGINE, trovata scrivendo questo: il commento vivo
#    elenca i tre chiamanti e ne chiama uno `fn_elimina_fattura_da_lotto_draft`,
#    nome che NON esiste piu' dal 2026-08-04 (RD-7). E' la stessa ruggine che
#    aveva fatto scadere l'argomento del brief («tutti e tre sono *_da_draft»):
#    un ragionamento appoggiato ai NOMI invece che alle CONDIZIONI. Qui si
#    aggiusta il nome e si aggiunge la condizione, cosi' la prossima
#    rinominazione non porta via anche la garanzia.
#
# ⚠️ NIENTE TOCCA IL CORPO. `CREATE OR REPLACE FUNCTION` non serve: si cambia
#    solo il commento, quindi non c'e' nessun rischio di regressione su una
#    funzione che tre chiamanti danno per infallibile.
#
# brief-db-note-credito-prerequisiti-be-fe.md §7 C-1
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-69-comment-fn-cleanup-fatture-by-ids-rettifiche-mctit.yaml

  - changeSet:
      id: 20260818-69-comment-fn-cleanup-fatture-by-ids-rettifiche
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Scrive nel commento di fn_cleanup_fatture_by_ids la risposta alla
        domanda P-2 del backend: NON cancella da vendite.fatture_rettifiche, e
        non e' una dimenticanza — la proiezione esiste solo su documenti
        NUMERATI, e tutte e tre le porte di reset rifiutano una fattura
        numerata con un controllo esplicito sul numero. Corregge anche un nome
        stantio nel commento (fn_elimina_fattura_da_lotto_draft, rinominata il
        2026-08-04). Nessuna modifica al corpo. Piano §8 passo 2d-bis.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_cleanup_fatture_by_ids';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_cleanup_fatture_by_ids(bigint[], uuid) IS
                  'Pulizia centralizzata delle fatture e ripristino COMPLETO di cio'' che '
                  'avevano consumato. Cancella note, riepiloghi IVA, righe, log, collegamento '
                  'al lotto e testate; storna dall''ambito di compensazione l''arrotondamento '
                  'delle fatture cancellate (D-N pezzo 3 / C-23) PRIMA di toccarle; azzera i '
                  'fondi; sblocca le attivita_fatturabili; e — dal 2026-08-03, RD-4 — riporta '
                  'le commesse_attivita collegate a stato_emissione = NON_EMESSA. '
                  '⚠️ Quest''ultimo passo vive QUI e non nei chiamanti: sono TRE '
                  '(fn_annulla_lotto_da_draft, fn_elimina_fattura_da_lotto, '
                  'fn_riporta_lotto_a_draft) e la correttezza di ognuno dipende dal fatto che '
                  'facciano la stessa cosa — senza, le attivita'' restano emesse senza fattura '
                  'e nessun giro futuro le riprende. '
                  '⚠️ La popolazione delle commesse_attivita usa il predicato IDENTICO alla '
                  'UPDATE su attivita_fatturabili e si raccoglie PRIMA di essa, che azzera '
                  'fattura_riga_id. '
                  '⚠️ Il ramo su p_lock_batch_id prende TUTTE le attivita'' del batch: corretto '
                  'nel reset globale, ed e'' il motivo per cui il reset per-fattura deve '
                  'passare NULL (C-22). '
                  '⭐ NON cancella da vendite.fatture_rettifiche, e NON e'' una dimenticanza '
                  '(domanda del backend, 2026-08-18, brief note-credito P-2). La proiezione '
                  'del legame documentale delle note di credito la scrive il task '
                  'popola_fatture_rettifiche, che gira DOPO numera_fatture: esiste quindi solo '
                  'su documenti NUMERATI. E un documento numerato non e'' raggiungibile da '
                  'nessuna delle tre porte di reset, perche'' tutte e tre lo rifiutano con un '
                  'controllo ESPLICITO sul numero — fn_check_fattura_eliminabile_da_lotto '
                  'motivo 4 (E_FATTURA_GIA_NUMERATA), fn_check_lotto_riportabile_a_draft '
                  'motivo 3 e fn_check_lotto_annullabile motivo 3 (E_LOTTO_FATTURE_NUMERATE, '
                  'aggiunto il 2026-08-18 proprio per chiudere l''ultima che si affidava al '
                  'solo stato). ⚠️ La garanzia sta in quelle CONDIZIONI, non nei nomi delle '
                  'funzioni: l''argomento «sono tutte *_da_draft» era vero e ha smesso di '
                  'esserlo il 2026-08-04, quando fn_elimina_fattura_da_lotto_draft e'' stata '
                  'rinominata e il suo perimetro allargato al pre-fiscale (RD-7). '
                  '⚠️ Se un giorno una porta di reset ammettesse un documento numerato, questa '
                  'funzione dovrebbe cancellare anche la coppia in fatture_rettifiche: '
                  'fk_fatture_ret_fattura NON e'' ON DELETE CASCADE, quindi il reset '
                  'sbatterebbe su una violazione di chiave esterna grezza dentro una funzione '
                  'che i suoi chiamanti danno per infallibile.';
      rollback:
        - sql:
            sql: |
              -- Nessun rollback: e' solo un commento, e quello precedente
              -- conteneva un nome di funzione inesistente.
              SELECT 1;
