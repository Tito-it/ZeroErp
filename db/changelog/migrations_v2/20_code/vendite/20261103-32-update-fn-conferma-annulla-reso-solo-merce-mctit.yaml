              COMMENT ON FUNCTION vendite.fn_conferma_reso(vendite.resi.id%TYPE)
                IS 'Madre conferma reso: DRAFT->CONFERMATO (numero+guard), proiezione stato ordine (residuo reso-aware -> PARZIALMENTE_EVASO/EVASO), flip DDT origine CONSEGNATO->RESO se reso totale. brief §5. rev 2026-07-13. rev 2026-07-17 (step 2b): il flip conta solo i resi CONFERMATI. rev 2026-07-17 (step 2): il flip legge l helper unico vw_resi_righe_effettive (CONFERMATE+attive, tutti i tipi). ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-b/-c/-f): VERBO. SECURITY DEFINER con search_path bloccato; testata FOR UPDATE nel perimetro (script.fn_scope_ef_whitelist_via_reso nella WHERE, fuori perimetro E_RESO_NOT_FOUND); permesso conferma_reso su OGNI conferma (script.fn_guard_azione, E_PERMESSO_NEGATO). Su un reso che fa rientrare merce (vendite.fn_reso_muove_merce): lock della bolla d''origine, primo motivo di script.fn_check_reso_merce, rientri automatici, poi lo stato con la porta del registro aperta (GUC zeroerp.reso_cambio_stato) e in coda i carichi (vendite.fn_posta_reso, CARICO_RESO_VEN al costo dell''uscita). UNA transazione. La firma non cambia (RETURNS void). rev 2026-10-01 (brief-db-magazzino-registro-anello-interno, D-2): il posting sta in vendite, non nel registro. ⭐ rev 2026-10-11 (brief-db-ddt-righe-evase-dall-ordine §5.2): la proiezione dello stato dell''ordine e'' il building block vendite.fn_ordine_proietta_stato_evasione; la copia scritta a mano qui si ritira (regola del 2). Comportamento invariato. ⭐ rev 2026-10-25 (20261025-17, brief-modello-documento-vendita §7): il permesso dalla riga DRAFT -> CONFERMATO della matrice (config.transizioni_stati_reso.azione_processo_codename = conferma_reso) con script.fn_guard_passaggio, al posto di script.fn_guard_azione scritto nel corpo; un reso fuori bozza risponde E_RESO_STATO_NON_CONFERMABILE anche a chi non ha l''azione. Lo stato del reso e il flip della bolla (CONSEGNATO -> RESO, passaggio di processo) dalla scrittura comune script.fn_doc_scrivi_stato, attraverso la porta script.trgfn_doc_stato_solo_dal_verbo: la GUC zeroerp.reso_cambio_stato si ritira. Rev 2026-11-03 (20261103-32, brief-db-addebito-trasporto-ordine §8.1, decisioni di Tid del 2026-11-03): gli oneri diventano righe della bolla e non si rendono (guard vendite.trgfn_resi_righe_guard_origine_coerente, E_RESO_RIGA_ONERE): il bool_and(reso >= quantita) sulle righe della bolla che decide il flip CONSEGNATO -> RESO conta solo le righe di MERCE (script.fn_natura_e_merce sulla natura congelata). Senza il filtro una bolla con un onere non andrebbe mai a RESO. Firma ancorata (p_reso_id vendite.resi.id%TYPE, stesso tipo).';

              COMMENT ON FUNCTION vendite.fn_annulla_reso(vendite.resi.id%TYPE)
                IS 'Madre annullo reso con storno: -> ANNULLATO, ri-proiezione stato ordine, ri-flip DDT RESO->CONSEGNATO se non piu totale. Simmetrica a fn_conferma_reso. brief S2/S5. ⛔ DUE guardie di RIFIUTO, gemelle fra loro e tutte e due prima di qualunque scrittura: E_RESO_ANNULLO_CON_RICONSEGNE (la merce e'' gia'' ripartita) e - dal 2026-08-19 - E_RESO_ANNULLO_CON_ACCREDITO (esiste almeno una riga di ponte in vendite.resi_righe_accrediti). ⚠️ Senza la seconda un reso accreditato si annullava lasciando VIVE le rettifiche a quantita'' negativa in vendite.commesse_attivita, e il primo giro di fatturazione emetteva una nota di credito per un reso annullato: i due lister (fn_list_emittibili_lane, fn_emit_attivita_fatturabili_da_commessa) non nominano mai il reso e non riparano a valle. Il predicato e'' l''ESISTENZA del ponte, non lo stato delle rettifiche: se l''accredito e'' ormai troppo tardi per essere disfatto lo dice la sua madre con E_ACCREDITO_ANNULLO_NON_AMMESSO, e ricalcolare qui «tutte NON_EMESSA» sarebbe una seconda copia della stessa regola. ⛔ Si RIFIUTA e non si cascata: vendite.fn_annulla_accredito_riga_reso pretende un motivo obbligatorio che una cascata automatica dovrebbe inventarsi, e se una sola rettifica non e'' piu'' NON_EMESSA l''annullo del reso non deve avvenire affatto - non avvenire a meta''. ⭐⚠️ VINCOLO RECIPROCO su TRE posti (C-3), con script.fn_check_rinuncia_reversibile e vendite.fn_annulla_accredito_riga_reso: la guardia si auto-ripara perche'' l''annullo dell''accredito CANCELLA le righe di ponte - se un giorno diventasse un soft-delete i tre posti si cambiano INSIEME. rev 2026-07-13. rev 2026-07-17 (step 2b): il ri-flip conta solo i resi CONFERMATI. rev 2026-07-17 (step 2): il ri-flip legge l helper unico vw_resi_righe_effettive. rev 2026-08-19: guardia accredito (brief-design-note-credito-resi; segnalazione BE del 2026-08-19). ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-f, M-8): VERBO. SECURITY DEFINER con search_path bloccato; testata FOR UPDATE nel perimetro (fuori perimetro E_RESO_NOT_FOUND); permesso conferma_reso su OGNI annullo (script.fn_guard_azione). Lo stato si scrive con la porta del registro aperta (GUC zeroerp.reso_cambio_stato); annullando un reso CONFERMATO che aveva fatto rientrare merce, i suoi carichi si stornano (magazzino.fn_storna_movimenti_sorgente sui rientri, sorgente RESO_VENDITA_RIENTRO) al costo del carico — se la merce e'' gia'' uscita di nuovo, la primitiva rifiuta. Le due guardie di rifiuto (ri-consegne, accrediti) restano prima di ogni scrittura. La firma non cambia (RETURNS void). ⭐ rev 2026-10-11 (brief-db-ddt-righe-evase-dall-ordine §5.2): la proiezione dello stato dell''ordine e'' il building block vendite.fn_ordine_proietta_stato_evasione; la copia scritta a mano qui si ritira (regola del 2). Comportamento invariato. ⭐ rev 2026-10-25 (20261025-18, brief-modello-documento-vendita §7): il permesso dalla riga del passaggio con script.fn_guard_passaggio, al posto di script.fn_guard_azione scritto nel corpo: CONFERMATO -> ANNULLATO chiede conferma_reso (config.transizioni_stati_reso.azione_processo_codename), DRAFT -> ANNULLATO il solo permesso sul documento, che controlla il backend (M-4 di Tid: chi fa disfa, l''annullo di una bozza non e'' un passaggio pesante). Lo stato del reso e il ri-flip della bolla (RESO -> CONSEGNATO, passaggio di processo) dalla scrittura comune script.fn_doc_scrivi_stato, attraverso la porta script.trgfn_doc_stato_solo_dal_verbo: la GUC zeroerp.reso_cambio_stato si ritira. Rev 2026-11-03 (20261103-32, brief-db-addebito-trasporto-ordine §8.1, decisioni di Tid del 2026-11-03): gli oneri diventano righe della bolla e non si rendono (guard vendite.trgfn_resi_righe_guard_origine_coerente, E_RESO_RIGA_ONERE): il bool_and(reso >= quantita) sulle righe della bolla che decide il ri-flip RESO -> CONSEGNATO conta solo le righe di MERCE (script.fn_natura_e_merce sulla natura congelata). Senza il filtro una bolla con un onere non tornerebbe mai a CONSEGNATO dopo un reso totale della merce (che senza filtro non la porterebbe nemmeno a RESO). Firma ancorata (p_reso_id vendite.resi.id%TYPE, stesso tipo).';
