                   LEFT JOIN LATERAL pratiche.fn_pratica_del_documento(( SELECT so_pr.id
                         FROM config.sorgenti so_pr
                        WHERE so_pr.codice_interno::text = 'CONTRATTO'::text AND so_pr.attivo IS TRUE), c.id, c.uid) pr(n_pratiche, pratica_id, pratica_numero) ON true;

              COMMENT ON VIEW vendite.vw_contratti_lista
              IS 'Vista flat dei contratti per la lista UI configurabile vendite.contratti (ui.lista_definizione): cliente (billing account e soggetto), emittente fiscale con la ragione sociale, utility, stato con la sua fase, listino e versione, variazione globale, categoria cliente dallo snapshot del contratto (non quella corrente del billing account), valuta, audit e la pratica del contratto. Pura denormalizzazione: nessun filtro, scope, ordinamento o paginazione propri, che restano al repository consumer. security_invoker: vale la RLS di chi legge; billing account, soggetto, utility e stato sono JOIN interni, quindi un contratto col billing account fuori perimetro non compare, mentre emittente, listino, versione, categoria e valuta sono LEFT JOIN e lasciano NULL. stato_codice_interno = codice_interno (logica), stato_codice = codice (display). pratica_id, pratica_numero e n_pratiche vengono da pratiche.fn_pratica_del_documento, col tipo CONTRATTO (da config.sorgenti per codice_interno, solo se attivo) e le due chiavi del contratto, id e uid. Le colonne del grafo (frontiera, discendenti, transito) non sono nella vista: il backend le chiede a vendite.fn_documento_lineage_sintesi per i contratti della pagina.';

              GRANT SELECT, INSERT, UPDATE, DELETE ON vendite.vw_contratti_lista TO zeroerp_app;
