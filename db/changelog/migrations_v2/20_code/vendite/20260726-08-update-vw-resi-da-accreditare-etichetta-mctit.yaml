# vw_resi_da_accreditare: etichetta DOVUTA quando non resta copertura
#   (brief-db-chiusura-riconsegna-reso-definitivo §4.4, Fase 2 voce 7)
#
# COSA CAMBIA: l'etichetta era
#     CASE WHEN riapre_residuo THEN 'FACOLTATIVA' ELSE 'DOVUTA' END
# cioe' "se la merce tornera' al cliente, l'accredito e' una scelta". Vero
# finche' la ri-consegna e' possibile. Ma se la quota e' stata dichiarata
# DEFINITIVA (rinuncia), la merce NON torna e l'accredito non e' piu' una scelta:
#     riapre_residuo AND residuo_riconsegna > 0  -> FACOLTATIVA
#     altrimenti                                 -> DOVUTA
#
# E' l'ultimo pezzo che rende visibile la chiusura all'operatore: chi lavora la
# coda "dovute" prima non vedeva mai quelle righe (§2 del brief).
#
# ⚠️ L'IMPORTO NON CAMBIA. `accredito_dovuto` viene dal contatore
# (vw_contatore_merce, che somma vw_resi_righe_effettive SENZA filtro tipo) e le
# rinunce non toccano quella vista — decisione §4.2. Qui cambia SOLO l'etichetta:
# la riga resta in coda con lo stesso valore, ma smette di essere presentata come
# facoltativa. E' la promessa del §3: "chiudere la ri-consegna non cambia nessun
# numero", cambia la natura della quota.
# Se un domani l'importo cambiasse dopo una rinuncia, sarebbe il segnale che la
# sottrazione e' finita nella vista sbagliata: il pgTAP di scenario lo presidia.
#
# Il caso "tutto ri-consegnato" non si gestisce qui: quelle righe escono da sole
# dalla coda (il fulfillment rialza `evaso`, `differenza` torna a 0 — §3).
#
# Base: doc auto-gen docs/it/dbzero/vendite/views/vw_resi_da_accreditare.md.
# Nessuna colonna nuova, nessun cambio di tipo -> CREATE OR REPLACE VIEW pulito.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260726-08-update-vw-resi-da-accreditare-etichetta-mctit.yaml

  - changeSet:
      id: 20260726-08-update-vw-resi-da-accreditare-etichetta
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_resi_da_accreditare: etichetta DOVUTA anche quando non resta copertura
        ri-consegnabile (quota rinunciata). L'importo accredito_dovuto NON cambia.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_resi_da_accreditare
              WITH (security_invoker=on) AS
              WITH acc AS (
                       SELECT ct.ordine_riga_id,
                          ct.tenuti,
                          ct.fatturati,
                          (- ct.differenza) AS accredito_partita
                         FROM vendite.vw_contatore_merce ct
                        WHERE (ct.differenza < (0)::numeric)
                      ), dist AS (
                       SELECT e.resi_riga_id,
                          e.reso_id,
                          e.ddt_riga_id,
                          e.ordine_riga_id,
                          e.riapre_residuo,
                          e.quantita AS qta_resa,
                          a.tenuti,
                          a.fatturati,
                          GREATEST((0)::numeric, LEAST(e.quantita, (a.accredito_partita - COALESCE(sum(e.quantita) OVER (PARTITION BY e.ordine_riga_id ORDER BY e.resi_riga_id ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), (0)::numeric)))) AS accredito_dovuto
                         FROM (vendite.vw_resi_righe_effettive e
                           JOIN acc a ON ((a.ordine_riga_id = e.ordine_riga_id)))
                      )
               SELECT x.resi_riga_id,
                  r.id AS reso_id,
                  r.uid AS reso_uid,
                  r.numero AS reso_numero,
                  r.data,
                  r.emittente_fiscale_id,
                  r.billing_account_id,
                  ba.codice AS ba_codice,
                  r.destinatario_soggetto_ruolo_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  rr.articolo_id,
                  rr.descrizione,
                  rr.quantita,
                  rr.qta_operativa,
                  rr.uom_operativa_id,
                  rr.motivo,
                  x.ddt_riga_id,
                  dr.ddt_id,
                  d.numero AS ddt_numero,
                  x.ordine_riga_id,
                  x.tenuti,
                  x.fatturati,
                  x.accredito_dovuto,
                  (
                      CASE
                          -- rev 2026-07-26: FACOLTATIVA solo se la merce puo
                          -- ANCORA tornare al cliente. Se il residuo
                          -- ri-consegnabile e esaurito (tutto ri-spedito o
                          -- dichiarato definitivo) lo accredito e DOVUTO: non
                          -- c e piu nulla che possa compensarlo.
                          WHEN (x.riapre_residuo
                                AND vendite.fn_resi_riga_residuo_riconsegna(x.resi_riga_id) > (0)::numeric)
                               THEN 'FACOLTATIVA'::text
                          ELSE 'DOVUTA'::text
                      END)::character varying AS etichetta
                 FROM (((((((dist x
                   JOIN vendite.resi_righe rr ON ((rr.id = x.resi_riga_id)))
                   JOIN vendite.resi r ON ((r.id = x.reso_id)))
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON ((sr_dest.id = r.destinatario_soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s_dest ON ((s_dest.id = sr_dest.soggetto_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = r.billing_account_id)))
                   LEFT JOIN vendite.ddt_righe dr ON ((dr.id = x.ddt_riga_id)))
                   LEFT JOIN vendite.ddt d ON ((d.id = dr.ddt_id)))
                WHERE (x.accredito_dovuto > (0)::numeric);

              COMMENT ON VIEW vendite.vw_resi_da_accreditare IS
                'Coda degli accrediti dovuti al cliente, derivata dal contatore merce '
                '(vw_contatore_merce, differenza < 0). rev 2026-07-26 '
                '(brief-db-chiusura-riconsegna-reso-definitivo S4.4): etichetta '
                'FACOLTATIVA solo se la merce puo'' ANCORA tornare al cliente '
                '(riapre_residuo AND residuo ri-consegnabile > 0); appena il residuo '
                'si esaurisce - tutto ri-spedito o dichiarato definitivo tramite '
                'resi_righe_rinunce - l''accredito diventa DOVUTA. L''IMPORTO '
                'accredito_dovuto NON cambia: viene dal contatore, che le rinunce non '
                'toccano (S4.2). Cambia la natura della quota, non il numero.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: nessuna colonna cambia, ma la etichetta torna a
              -- ignorare le rinunce. Ri-applicare il changeset precedente che
              -- definisce la vista.
              SELECT 1;
