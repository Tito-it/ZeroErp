# vendite.vw_note: la proiezione di una nota di vendite, nella forma comune delle viste delle note.
#   Brief: brief-db-revisione-catalogo §19 voce 2, §20 (Tid, 2026-11-12: «per tutte, per rendere
#   omogeneo il meccanismo»).
#
# ⭐ PERCHE'. Una vista per ogni sede delle note, con le stesse colonne nello stesso ordine di
#   catalogo.vw_note (-31): la proiezione con stile e lingua sta a DB, e il backend legge la vista
#   della sede invece di comporre la sua query. Il presidio delle quattro gemelle e'
#   db/pgtap/dbops/test-viste-note-gemelle-v1.sql.
#
# ⭐ SICUREZZA. La madre ha la RLS (le tre policy per veste, operatore, cliente del portale, cliente dello shop): la vista e' security_invoker, e chi la legge vede le note che le policy della madre gli concedono, ne' una di piu' ne' una di meno.
#   Vista nuova, rollback: DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261112-32-create-vw-note-mctit.yaml

  - changeSet:
      id: 20261112-32-create-vw-note
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Vista vendite.vw_note: la proiezione di una nota di vendite, con stile e lingua, nella forma comune delle viste delle note (security_invoker). Brief: brief-db-revisione-catalogo §20.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_class WHERE oid = to_regclass('vendite.vw_note')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE VIEW vendite.vw_note
                WITH (security_invoker = true) AS
               SELECT n.id AS nota_id,
                  n.target_tipo AS nota_target_tipo,
                  n.target_id AS nota_target_id,
                  n.target_riga_id AS nota_target_riga_id,
                  n.anchor_tipo AS nota_anchor_tipo,
                  n.posizione AS nota_posizione,
                  n.seq AS nota_seq,
                  n.testo AS nota_testo,
                  n.testo_md AS nota_testo_md,
                  n.visibile AS nota_visibile,
                  n.solo_stampa AS nota_solo_stampa,
                  n.meta AS nota_meta,
                  n.data_insert AS nota_data_insert,
                  n.user_insert AS nota_user_insert,
                  n.data_update AS nota_data_update,
                  n.user_update AS nota_user_update,
                  ns.id AS stile_id,
                  ns.codice AS stile_codice,
                  ns.descrizione AS stile_descrizione,
                  l.id AS lingua_id,
                  l.codice_iso AS lingua_codice_iso,
                  l.descrizione AS lingua_descrizione,
                  l.descrizione_locale AS lingua_descrizione_locale,
                  ns.codice_interno AS stile_codice_interno
                 FROM vendite.note n
                   LEFT JOIN config.note_stili ns ON ns.id = n.id_stile
                   LEFT JOIN config.lingue l ON l.id = n.id_lingua;

              COMMENT ON VIEW vendite.vw_note IS
                'La proiezione di una nota di vendite, una riga per nota di ogni partizione di vendite.note, con la decodifica dello stile (config.note_stili: codice, descrizione, codice_interno) e della lingua (config.lingue). Non filtra: le note nascoste e quelle di sola stampa ci sono. Ha le stesse colonne, nello stesso ordine, di catalogo.vw_note, acquisti.vw_note, magazzino.vw_note: una vista per ogni sede delle note, e la proiezione sta solo qui. security_invoker: vendite.note e'' sotto RLS: la vista vede, per chi la interroga, le note che le policy della madre gli concedono. Si legge, non si scrive: le note si scrivono sul padre o sulla partizione.';

              GRANT SELECT ON vendite.vw_note TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_note;
