#
# Aggiorna vendite.fn_push_offerta_a_contratto per propagare
# emittente_fiscale_id dall'offerta al contratto generato.
#
# Motivazione: ora che contratti.emittente_fiscale_id esiste
# (20260526-02), il push 1:1 deve copiare l'emittente dell'offerta
# nel contratto. Passare il valore esplicitamente nel payload
# INSERT causa lo skip del trigger trgfn_contratti_default_emittente
# (che e' user-derived e non avrebbe contesto API al momento del push
# in contesti non-interattivi) e il trigger guard
# trgfn_contratti_guard_emittente_ba valida la coerenza.
#
# Il commento "emittente_fiscale_id: non esiste su contratti
# (confermato 2026-05-25)" e' obsoleto e viene rimosso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260526-05-update-fn-push-offerta-a-contratto-add-emittente-mctit.yaml

  - changeSet:
      id: 20260526-05-update-fn-push-offerta-a-contratto-add-emittente
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        Aggiunge emittente_fiscale_id alla INSERT di
        fn_push_offerta_a_contratto. Il valore viene copiato 1:1
        da v_offerta.emittente_fiscale_id. Il trigger
        trgfn_contratti_default_emittente salta (IS NOT NULL),
        il guard trgfn_contratti_guard_emittente_ba valida la coerenza.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: offerte_commerciali
            - tableExists:
                schemaName: vendite
                tableName: contratti
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: offerta_id
            - columnExists:
                schemaName: vendite
                tableName: contratti
                columnName: emittente_fiscale_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_push_offerta_a_contratto(
                  p_offerta_id  vendite.offerte_commerciali.id%TYPE,
                  p_pratica_id  bigint
              )
              RETURNS BIGINT
              LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Generare un contratto DRAFT da un'offerta commerciale in stato
              --   ACCETTATA, copiando 1:1 eccezioni e utility (§5.2 analisi).
              --   Idempotente: doppia invocazione fallisce con errore semantico,
              --   nessun duplicato e' possibile (pattern A §6.9.3 pratiche).
              --
              -- Parametri:
              --   p_offerta_id : ID offerta commerciale ACCETTATA da trasformare.
              --   p_pratica_id : ID pratica da collegare al contratto generato
              --                  (opzionale — NULL ammesso).
              --
              -- Regole:
              --   - stato ACCETTATA obbligatorio; qualsiasi altro -> errore.
              --   - nessun contratto con offerta_id = p_offerta_id deve esistere.
              --   - contratto creato in DRAFT; auto-attivazione NON prevista (§1.2).
              --   - emittente_fiscale_id copiato 1:1 dall'offerta (rev2, 2026-05-26).
              --   - stato_approvazione_prezzo / pratica_approvazione_prezzo_id
              --     inseriti NULL in contratti_righe (I4).
              --   - utility: UPSERT per gestire il trigger snapshot_precontrattuali
              --     che puo' aver gia' creato contratti_utilities sull'INSERT contratto.
              DECLARE
                  v_offerta               vendite.offerte_commerciali%ROWTYPE;
                  v_stato_cod             config.stati_doc_offerte.codice_interno%TYPE;
                  v_stato_draft_id        config.stati_doc_contratti.id%TYPE;
                  v_sorgente_ofc_id       config.sorgenti.id%TYPE;
                  v_sorgente_contratto_id config.sorgenti.id%TYPE;
                  v_contratto_id          vendite.contratti.id%TYPE;
                  v_contratto_uid         vendite.contratti.uid%TYPE;
              BEGIN
                  -- Guard: parametro obbligatorio e valido.
                  IF p_offerta_id IS NULL OR p_offerta_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('param', 'p_offerta_id', 'value', p_offerta_id),
                          NULL::uuid,
                          'p_offerta_id = ' || COALESCE(p_offerta_id::text, 'NULL')
                      );
                  END IF;

                  -- Carica offerta.
                  SELECT * INTO v_offerta
                    FROM vendite.offerte_commerciali
                   WHERE id = p_offerta_id;

                  -- Guard: offerta non trovata.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('offerta_id', p_offerta_id),
                          NULL::uuid,
                          'offerta non trovata: ' || p_offerta_id::text
                      );
                  END IF;

                  -- Recupera codice stato dell'offerta.
                  SELECT codice_interno INTO v_stato_cod
                    FROM config.stati_doc_offerte
                   WHERE id = v_offerta.stato_doc_offerta_id;

                  -- Guard: push ammesso SOLO da stato ACCETTATA.
                  -- BOZZA, EMESSA, RIFIUTATA, SUPERATA, ANNULLATA -> errore.
                  IF v_stato_cod IS DISTINCT FROM 'ACCETTATA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_OFFERTA_PUSH_STATO_NON_AMMESSO',
                          jsonb_build_object(
                              'offerta_id',     p_offerta_id,
                              'stato_corrente', COALESCE(v_stato_cod, 'NULL')
                          ),
                          NULL::uuid,
                          p_offerta_id::text,
                          COALESCE(v_stato_cod, 'NULL')
                      );
                  END IF;

                  -- Guard idempotenza: contratto gia' generato per questa offerta?
                  IF EXISTS (
                      SELECT 1 FROM vendite.contratti
                       WHERE offerta_id = p_offerta_id
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_OFFERTA_CONTRATTO_GIA_GENERATO',
                          jsonb_build_object('offerta_id', p_offerta_id),
                          NULL::uuid,
                          p_offerta_id::text
                      );
                  END IF;

                  -- Config: stato DRAFT contratto (config-driven, no hardcode).
                  SELECT id INTO v_stato_draft_id
                    FROM config.stati_doc_contratti
                   WHERE codice_interno = 'DRAFT';

                  IF v_stato_draft_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object(
                              'tabella', 'config.stati_doc_contratti',
                              'codice',  'DRAFT'
                          ),
                          NULL::uuid,
                          'stato DRAFT non trovato in config.stati_doc_contratti'
                      );
                  END IF;

                  -- Config: sorgente OFFERTA_COMMERCIALE.
                  SELECT id INTO v_sorgente_ofc_id
                    FROM config.sorgenti
                   WHERE codice_interno = 'OFFERTA_COMMERCIALE';

                  IF v_sorgente_ofc_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object(
                              'tabella', 'config.sorgenti',
                              'codice',  'OFFERTA_COMMERCIALE'
                          ),
                          NULL::uuid,
                          'sorgente OFFERTA_COMMERCIALE non trovata in config.sorgenti'
                      );
                  END IF;

                  -- INSERT contratto in DRAFT — copia campi business 1:1 dall'offerta.
                  -- numero/uid: generati da trigger trgfn_contratti_gen_codice / default.
                  -- categoria_cliente_id_snapshot: gestita da trigger.
                  -- emittente_fiscale_id: copiato 1:1 dall'offerta (rev2, 2026-05-26).
                  --   Il trigger trgfn_contratti_default_emittente salta perche'
                  --   il valore e' esplicitamente valorizzato nel payload.
                  --   Il trigger trgfn_contratti_guard_emittente_ba valida la coerenza.
                  INSERT INTO vendite.contratti (
                      billing_account_id,
                      istanza_utility_id,
                      utility_id,
                      listino_id,
                      listino_versione_id,
                      valore_variazione_globale,
                      tipo_variazione_globale,
                      valido_dal,
                      valido_al,
                      stato_doc_contratto_id,
                      sorgente_tipo_id,
                      sorgente_uid,
                      offerta_id,
                      emittente_fiscale_id,
                      meta
                  )
                  VALUES (
                      v_offerta.billing_account_id,
                      v_offerta.istanza_utility_id,
                      v_offerta.utility_id,
                      v_offerta.listino_id,
                      v_offerta.listino_versione_id,
                      v_offerta.valore_variazione_globale,
                      v_offerta.tipo_variazione_globale,
                      v_offerta.validita_dal,
                      v_offerta.validita_al,
                      v_stato_draft_id,
                      v_sorgente_ofc_id,
                      v_offerta.uid,
                      p_offerta_id,
                      v_offerta.emittente_fiscale_id,
                      COALESCE(v_offerta.meta, '{}'::jsonb)
                  )
                  RETURNING id, uid INTO v_contratto_id, v_contratto_uid;

                  -- Copia eccezioni offerta -> contratti_righe (1:1, §5.2).
                  -- tipo_eccezione: stesso enum tipo_eccezione_contratto, nessuna
                  --   conversione (B3).
                  -- stato_approvazione_prezzo / pratica_approvazione_prezzo_id:
                  --   inseriti NULL — il contratto DRAFT li acquisisce in fase di
                  --   negoziazione (I4).
                  INSERT INTO vendite.contratti_righe (
                      contratto_id,
                      articolo_id,
                      tipo_eccezione,
                      tipo_erogazione,
                      fonte_quantita_attesa,
                      periodicita,
                      generazione_canone,
                      competenza_canone,
                      prezzo_unitario,
                      quantita,
                      qta_operativa,
                      uom_operativa_id,
                      factor_to_base,
                      ordine,
                      attivo,
                      meta
                  )
                  SELECT
                      v_contratto_id,
                      oce.articolo_id,
                      oce.tipo_eccezione,
                      oce.tipo_erogazione,
                      oce.fonte_quantita_attesa,
                      oce.periodicita,
                      oce.generazione_canone,
                      oce.competenza_canone,
                      oce.prezzo_unitario,
                      oce.quantita,
                      oce.qta_operativa,
                      oce.uom_operativa_id,
                      oce.factor_to_base,
                      oce.ordine,
                      oce.attivo,
                      oce.meta
                  FROM vendite.offerte_commerciali_eccezioni oce
                  WHERE oce.offerta_id = p_offerta_id;

                  -- Copia utility offerta -> contratti_utilities (1:1, B1).
                  -- UPSERT: il trigger trg_contratti_z90_snapshot_precontrattuali_ins
                  --   si attiva AFTER INSERT su contratti e puo' aver gia' creato
                  --   un record da precontrattuali; in quel caso i dati negoziati
                  --   nell'offerta sovrascrivono il precontrattuale generico.
                  INSERT INTO vendite.contratti_utilities (
                      contratto_id,
                      istanza_utility_id,
                      utility_id,
                      istanza_dati_precontrattuali_id,
                      classe_utenza_id,
                      tipo_utenza_id,
                      param_1_num,
                      param_2_txt,
                      meta
                  )
                  SELECT
                      v_contratto_id,
                      ocu.istanza_utility_id,
                      ocu.utility_id,
                      ocu.istanza_dati_precontrattuali_id,
                      ocu.classe_utenza_id,
                      ocu.tipo_utenza_id,
                      ocu.param_1_num,
                      ocu.param_2_txt,
                      ocu.meta
                  FROM vendite.offerte_commerciali_utilities ocu
                  WHERE ocu.offerta_id = p_offerta_id
                  ON CONFLICT ON CONSTRAINT uq_contratti_utilities_contratto_id
                  DO UPDATE SET
                      istanza_utility_id              = EXCLUDED.istanza_utility_id,
                      utility_id                      = EXCLUDED.utility_id,
                      istanza_dati_precontrattuali_id = EXCLUDED.istanza_dati_precontrattuali_id,
                      classe_utenza_id                = EXCLUDED.classe_utenza_id,
                      tipo_utenza_id                  = EXCLUDED.tipo_utenza_id,
                      param_1_num                     = EXCLUDED.param_1_num,
                      param_2_txt                     = EXCLUDED.param_2_txt,
                      meta                            = EXCLUDED.meta;

                  -- Collegamento pratica (facoltativo).
                  -- Se p_pratica_id valorizzato, registra il contratto generato
                  -- come sorgente COLLEGATO della pratica.
                  -- La registrazione dell'evento nel giornale pratica e' delegata
                  -- al livello applicativo (pratiche_service.log_evento_dominio).
                  IF p_pratica_id IS NOT NULL THEN
                      SELECT id INTO v_sorgente_contratto_id
                        FROM config.sorgenti
                       WHERE codice_interno = 'CONTRATTO';

                      IF v_sorgente_contratto_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_push_offerta_a_contratto',
                              'E_CONFIG_MANCANTE',
                              jsonb_build_object(
                                  'tabella', 'config.sorgenti',
                                  'codice',  'CONTRATTO'
                              ),
                              NULL::uuid,
                              'sorgente CONTRATTO non trovata in config.sorgenti'
                          );
                      END IF;

                      -- UNIQUE uq_pratiche_sorgenti_pratica_tipo_uid_ruolo gestisce
                      -- l'idempotenza: il DO NOTHING evita errore su doppia invocazione.
                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id,
                          sorgente_tipo_id,
                          sorgente_uid,
                          ruolo_link
                      )
                      VALUES (
                          p_pratica_id,
                          v_sorgente_contratto_id,
                          v_contratto_uid::text,
                          'COLLEGATO'
                      )
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;
                  END IF;

                  RETURN v_contratto_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_push_offerta_a_contratto(bigint, bigint) IS
                  'Genera un contratto DRAFT da un''offerta commerciale ACCETTATA. '
                  'Copia 1:1 eccezioni (contratti_righe) e utility (contratti_utilities). '
                  'Rev2 (2026-05-26): propaga emittente_fiscale_id dall''offerta al contratto. '
                  'Idempotente: doppia invocazione fallisce con E_OFFERTA_CONTRATTO_GIA_GENERATO. '
                  'Guard stato: solo ACCETTATA — BOZZA/EMESSA/RIFIUTATA/SUPERATA/ANNULLATA -> errore. '
                  'Pattern A §6.9.3 pratiche: UNIQUE (offerta_id) + controllo esplicito. '
                  'Parametri: p_offerta_id (offerta ACCETTATA), p_pratica_id (NULL ok).';
