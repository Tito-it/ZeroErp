# ------------------------------------------------------------
# L'uscita dal giro si timbra da sola, e non si torna indietro.
#   brief-db-uscita-documento-dal-giro D-3 e D-5.
#
# ── ⭐ DUE COSE, UNA FUNZIONE ─────────────────────────────────────
#   1) IL DIVIETO: `ESCLUSO` e' TERMINALE. Il documento uscito non rientra —
#      se si vuole tutto in un lotto solo si annulla il lotto e si rigenera.
#   2) IL TIMBRO: `uscita_quando` e `uscita_da` le scrive il database, mai il
#      chiamante.
#   Stessa forma di `dbops.trgfn_coda_archiviazione`, che fa lo stesso mestiere
#   sulle due code — e da cui viene anche la lettura della GUC.
#
# ── ⛔ IL NOME NON PORTA `guard`, ED E' UNA REGOLA ────────────────
#   La funzione SCRIVE `NEW`. `fn_guard_*` e' riservato a chi verifica e
#   basta: chiamarla guard direbbe che l'unica cosa che fa e' rifiutare.
#
# ── ⚠️ IL RIFIUTO GUARDA LA DIREZIONE, NON LA MENZIONE ────────────
#   `UPDATE OF stato_esecuzione` scatta anche riassegnando lo STESSO valore. Un
#   guard scritto sulla menzione rifiuterebbe scritture che non cambiano niente
#   — lezione gia' pagata su `trgfn_coda_archiviazione`.
#
# ── ⚠️ PERCHE' ANCHE SU INSERT, E PERCHE' NON OSCURA IL CHECK ─────
#   Il TIMBRO deve valere anche su una riga che NASCE gia' esclusa, o quelle due
#   colonne resterebbero vuote su un fatto avvenuto.
#   ⛔ Ma sull'INSERT la funzione **non solleva mai**: scrive e basta. E' la
#   condizione che tiene buona la regola «un guard BEFORE ROW anche in INSERT
#   oscura il CHECK» — qui il CHECK `chk_..._uscita_parlante` continua a
#   valutare dopo, e a rifiutare l'uscita senza motivo.
#   ⛔ E la matrice delle transizioni resta fuori dall'INSERT (linee-guida-sql
#   §7c.6): il divieto scatta solo su UPDATE.
#
# ── ⭐ LE DERIVATE SONO IMMUTABILI ────────────────────────────────
#   Una riga che resta esclusa non si lascia riscrivere il timbro: chi passasse
#   con una data propria non la vedrebbe attecchire. E una riga che NON e'
#   esclusa non puo' portare un timbro d'uscita — sarebbe un dato composito
#   spostato a meta', cioe' una riga che dice due cose che si smentiscono.
#
# ── ⚠️ CODICE ERRORE: `TECNICO`, E NON E' UN DETTAGLIO ────────────
#   Chi arriva a violare l'irreversibilita' NON e' un operatore: la madre
#   `fn_escludi_documento_da_giro` chiede prima alla sua check, quindi qui ci si
#   arriva solo con un UPDATE diretto — cioe' un chiamante rotto. Un 409 direbbe
#   a una persona di rileggere uno stato che non ha nessun modo di cambiare.
#   ⇒ Il rifiuto che l'operatore puo' vedere e' un altro codice, sollevato dalla
#   madre (`20260908-06`).
#
# Verifica: db/pgtap/vendite/test-uscita-documento-dal-giro-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-03-create-trgfn-fatturazione-lotti-esiti-uscita-mctit.yaml

  - changeSet:
      id: 20260908-03-create-trgfn-fatturazione-lotti-esiti-uscita
      author: mctit
      failOnError: true
      comment: >
        vendite.trgfn_fatturazione_lotti_esiti_uscita: ESCLUSO e' terminale (il
        documento uscito dal giro non rientra) e il timbro dell'uscita
        (uscita_quando, uscita_da) lo deriva il database dalla GUC, mai il
        chiamante. Una funzione, due mestieri, come trgfn_coda_archiviazione.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti_esiti
                columnName: uscita_motivo
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti_esiti
                columnName: uscita_quando
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatturazione_lotti_esiti_uscita()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: governa l'uscita di un documento dal giro.
              --        1) DIVIETO: ESCLUSO e' terminale, non si torna indietro;
              --        2) TIMBRO : uscita_quando/uscita_da le scrive il database.
              -- Uso:   BEFORE INSERT OR UPDATE OF stato_esecuzione FOR EACH ROW.
              DECLARE
                  v_utente vendite.fatturazione_lotti_esiti.uscita_da%TYPE;
              BEGIN
                  -- ── 1) IL DIVIETO ─────────────────────────────────────
                  -- ⚠️ Solo su UPDATE: la matrice delle transizioni non
                  --    vincola l'INSERT (seed, import, riga che nasce gia'
                  --    nello stato finale).
                  -- ⚠️ E guarda la DIREZIONE: riassegnare ESCLUSO a una riga
                  --    gia' esclusa non cambia niente e non si rifiuta.
                  IF TG_OP = 'UPDATE'
                     AND OLD.stato_esecuzione = 'ESCLUSO'
                     AND NEW.stato_esecuzione IS DISTINCT FROM OLD.stato_esecuzione THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_fatturazione_lotti_esiti_uscita',
                          'E_LOTTO_DOC_USCITA_IRREVERSIBILE',
                          jsonb_build_object('lotto_id',   NEW.lotto_id,
                                             'gruppo_key', NEW.gruppo_key,
                                             'stato_richiesto', NEW.stato_esecuzione,
                                             -- ⭐ Il bersaglio e' il LOTTO: chi
                                             --   legge questo errore sta guardando
                                             --   il giro, non la riga di esito.
                                             'bersaglio',  jsonb_build_array(
                                                 jsonb_build_object('tipo', 'LOTTO',
                                                                    'id', NEW.lotto_id::text))),
                          NULL::uuid,
                          -- ⛔ Nel VARIADIC va la cosa che una persona riconosce:
                          --   il documento, non il nome della colonna.
                          NEW.gruppo_key,
                          NEW.stato_esecuzione);
                  END IF;

                  -- ── 2) IL TIMBRO ──────────────────────────────────────
                  IF NEW.stato_esecuzione = 'ESCLUSO'
                     AND (TG_OP = 'INSERT'
                          OR OLD.stato_esecuzione IS DISTINCT FROM 'ESCLUSO') THEN
                      -- Il documento esce ADESSO: data e nome li mette il database.
                      v_utente := COALESCE(
                          NULLIF(current_setting('app.jwt_user', true), ''),
                          CURRENT_USER);
                      NEW.uscita_quando := CURRENT_TIMESTAMP;
                      NEW.uscita_da     := v_utente;

                  ELSIF NEW.stato_esecuzione = 'ESCLUSO' THEN
                      -- ⭐ Resta esclusa: le derivate NON si toccano piu'. Chi
                      --    passasse con una data propria non la vedrebbe
                      --    attecchire, e non c'e' modo di far dire alla riga una
                      --    cosa che il suo stato smentisce.
                      NEW.uscita_quando := OLD.uscita_quando;
                      NEW.uscita_da     := OLD.uscita_da;

                  ELSE
                      -- ⚠️ Non e' esclusa: non puo' portare un timbro d'uscita.
                      --    «Non uscita, uscita il 3 settembre» e' un dato
                      --    composito spostato a meta'.
                      NEW.uscita_quando := NULL;
                      NEW.uscita_da     := NULL;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_esiti_uscita()
              IS 'Governa l''uscita di un documento dal giro di fatturazione. '
                 '1) ESCLUSO e'' TERMINALE: il documento uscito non rientra (D-3 del '
                 'brief) — se si vuole tutto in un lotto solo si annulla il lotto e si '
                 'rigenera. 2) uscita_quando/uscita_da le DERIVA questa funzione dalla '
                 'GUC app.jwt_user, mai il chiamante: data_update e user_update le '
                 'riscriverebbe qualunque aggiornamento successivo e il momento '
                 'dell''uscita si perderebbe in silenzio. ⚠️ Il rifiuto guarda la '
                 'DIREZIONE e non la menzione della colonna (UPDATE OF scatta anche '
                 'riassegnando lo stesso valore). ⛔ Su INSERT non solleva mai — solo '
                 'timbra —, quindi il CHECK chk_fatturazione_lotti_esiti_uscita_parlante '
                 'continua a valutare dopo e a rifiutare l''uscita senza motivo. ⛔ Il '
                 'nome non porta guard perche'' la funzione scrive NEW. Errore: '
                 'E_LOTTO_DOC_USCITA_IRREVERSIBILE, classe TECNICO — qui ci arriva solo '
                 'un UPDATE diretto, perche'' la madre fn_escludi_documento_da_giro '
                 'chiede prima alla sua check. Brief: brief-db-uscita-documento-dal-giro.';

              DROP TRIGGER IF EXISTS trg_fatturazione_lotti_esiti_a10_uscita_ins_upd
                  ON vendite.fatturazione_lotti_esiti;

              CREATE TRIGGER trg_fatturazione_lotti_esiti_a10_uscita_ins_upd
                  BEFORE INSERT OR UPDATE OF stato_esecuzione
                  ON vendite.fatturazione_lotti_esiti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_fatturazione_lotti_esiti_uscita();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_fatturazione_lotti_esiti_a10_uscita_ins_upd
                  ON vendite.fatturazione_lotti_esiti;
              DROP FUNCTION IF EXISTS vendite.trgfn_fatturazione_lotti_esiti_uscita();
