# Fase 1 del cantiere emittente — le 6 viste di lista smettono di dipendere da
#   anagrafiche.emittenti_fiscali.descrizione
#   (brief-emittente-ragione-sociale-dal-soggetto.md §5 Fase 1.1)
#
# ── COSA C'ERA DAVVERO, E PERCHE' IL BRIEF SI SBAGLIAVA ───────────────────
#   Il brief prevedeva di «cambiare la sorgente»: proiettare la ragione sociale
#   del soggetto invece di ef.descrizione. Misurato sulla doc auto-gen il
#   2026-08-02, tutte e sei le viste facevano gia':
#
#       COALESCE(s_ef.ragione_sociale_completa, (ef.descrizione)::text)
#
#   La sorgente giusta c'era gia' ed era gia' preferita. Quello che si toglie
#   qui non e' una sorgente sbagliata: e' un **fallback**.
#
#   🔴 Ed e' esattamente la stessa toppa che il brief §1 addita sul frontend
#   come «la spia» — `opt.ragione_sociale || opt.descrizione`. Il DB ce l'aveva
#   in sei posti, scritta prima e mai notata. Il §7 del brief argomenta pure
#   CONTRO l'aggiungere un fallback del genere («coprirebbe un caso che non
#   esiste, sarebbe codice che nasce da rimuovere») senza accorgersi che
#   esisteva gia'. La lezione e' la stessa che il piano liste ha gia' pagato
#   due volte: un difetto puo' essere descritto benissimo in un punto del
#   documento e non riconosciuto nel punto in cui morde.
#
# ── CONSEGUENZA CHE CAMBIA LE PRIORITA' ──────────────────────────────────
#   Le 9 liste seedate che leggono queste viste mostrano GIA' oggi la ragione
#   sociale del soggetto. Quindi:
#     - questo changeSet **non cambia il valore visibile** su nessuna lista,
#       finche' ragione_sociale_completa e' valorizzata (misura: 26 su 26);
#     - la Fase 3.4 del brief («dopo la Fase 1 le liste devono mostrare la
#       ragione sociale») non e' una verifica: passerebbe anche senza fare
#       niente. La verifica vera e' quella del pgTAP che accompagna questo
#       changeSet, con una fixture in cui i due valori DIVERGONO di proposito.
#
# ── PERCHE' SI TOGLIE COMUNQUE, ORA ──────────────────────────────────────
#   Perche' la Fase 4 e' `DROP COLUMN`: finche' una sola vista nomina
#   ef.descrizione, la DROP non passa. Toglierlo adesso, ad alias invariato, e'
#   la fase invisibile e reversibile che il brief descrive — solo con un
#   contenuto diverso da quello che credeva.
#
# ⚠️ LA GARANZIA E' EMPIRICA, NON STRUTTURALE. `soggetti.ragione_sociale_completa`
#   e' NULLABLE e nessun trigger di anagrafiche.soggetti la scrive: lo «0 vuoti
#   su 26» del brief §3 e' una misura sui dati, non un invariante del modello.
#   Si toglie lo stesso — un fallback su una colonna in via di eliminazione non
#   e' una rete, e' un rinvio — ma va scritto che se un giorno un soggetto
#   nascesse senza ragione_sociale_completa la lista mostrerebbe una cella
#   vuota invece dell'etichetta interna. Che e' il comportamento corretto:
#   una cella vuota si vede e si corregge, «TEST» no.
#   Cfr. fn_snapshot_intestazione_fattura, che gia' la difende con
#   NULLIF(btrim(...), '') perche' scrive uno snapshot immutabile.
#
# ── COSA NON CAMBIA ──────────────────────────────────────────────────────
#   L'ALIAS resta `emittente_fiscale_descrizione`, identico. E' cio' che rende
#   questa fase invisibile ai 42 punti Python e ai 4 file FE: nessun lettore a
#   valle si accorge di niente. La rinomina dell'alias, se la si vuole, e' una
#   fase separata e successiva (brief §7).
#   I JOIN a ef restano: serve ancora `ef.codice`, che non e' in discussione.
#
# 🔒 `security_invoker=on` RI-SPECIFICATA su tutte e sei: la reloption non e'
#   visibile in pg_get_viewdef e PostgreSQL la AZZERA a ogni CREATE OR REPLACE.
#   Dimenticarla riaprirebbe il buco RLS sullo scope emittente chiuso dal fix V-1.
#
# ⚠️ Definizioni prese dalla doc auto-gen (docs/it/dbzero/vendite/views/), non
#   dagli YAML: i changeSet runOnChange precedenti sono superati da quelli con
#   numerazione piu' alta e ripartire da li' regredirebbe le revisioni intermedie.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260802-20-update-vw-lista-emittente-solo-da-soggetto-mctit.yaml

  - changeSet:
      id: 20260802-20-update-vw-lista-emittente-solo-da-soggetto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Le 6 viste vw_*_lista proiettano emittente_fiscale_descrizione dalla
        sola ragione sociale del soggetto: cade il fallback COALESCE su
        ef.descrizione, prerequisito della DROP di Fase 4. Alias invariato,
        nessun lettore a valle cambia.
      preConditions:
        - onFail: HALT
        - and:
          - columnExists:
              schemaName: anagrafiche
              tableName: emittenti_fiscali
              columnName: soggetto_ruolo_id
          - columnExists:
              schemaName: anagrafiche
              tableName: soggetti
              columnName: ragione_sociale_completa
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_contratti_lista
              WITH (security_invoker=on) AS
              SELECT c.id,
                  c.uid,
                  c.numero,
                  c.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  c.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  c.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  c.ambito,
                  c.data,
                  c.valido_dal,
                  c.valido_al,
                  c.stato_doc_contratto_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.codice AS stato_codice,
                  sd.descrizione AS stato_descrizione,
                  c.listino_id,
                  l.codice AS listino_codice,
                  l.descrizione AS listino_descrizione,
                  c.listino_versione_id,
                  lv.codice_versione AS listino_versione_codice,
                  c.tipo_variazione_globale,
                  c.valore_variazione_globale,
                  c.categoria_cliente_id_snapshot,
                  cc_snap.codice AS categoria_cliente_snapshot_codice,
                  cc_snap.descrizione AS categoria_cliente_snapshot_descrizione,
                  c.valuta_id,
                  v_val.codice AS valuta_codice,
                  v_val.descrizione AS valuta_descrizione,
                  c.data_insert,
                  c.user_insert,
                  c.data_update,
                  c.user_update,
                  -- Solo dal soggetto: il fallback su ef.descrizione e' caduto
                  -- (Fase 1 del cantiere emittente).
                  s_ef.ragione_sociale_completa AS emittente_fiscale_descrizione,
                  sd.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato
                 FROM (((((((((((((vendite.contratti c
                   JOIN anagrafiche.billing_account ba ON ((ba.id = c.billing_account_id)))
                   JOIN anagrafiche.soggetti_ruoli sr ON ((sr.id = ba.soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s ON ((s.id = sr.soggetto_id)))
                   JOIN config.utilities u ON ((u.id = c.utility_id)))
                   JOIN config.stati_doc_contratti sd ON ((sd.id = c.stato_doc_contratto_id)))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = c.emittente_fiscale_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = ef.soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                   LEFT JOIN vendite.listini l ON ((l.id = c.listino_id)))
                   LEFT JOIN vendite.listini_versioni lv ON ((lv.id = c.listino_versione_id)))
                   LEFT JOIN anagrafiche.categorie_clienti cc_snap ON ((cc_snap.id = c.categoria_cliente_id_snapshot)))
                   LEFT JOIN config.valute v_val ON ((v_val.id = c.valuta_id)))
                   LEFT JOIN vendite.vw_documento_lineage lin ON (((lin.tipo_id = ( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE (((sorgenti.codice_interno)::text = 'CONTRATTO'::text) AND (sorgenti.attivo IS TRUE)))) AND (lin.uid = (c.id)::text))));

