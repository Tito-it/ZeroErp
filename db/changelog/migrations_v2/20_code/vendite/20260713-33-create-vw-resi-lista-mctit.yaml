# Slice RESI vendita — vw_resi_lista (brief §6, §0.10).
#
# Mirror di vendite.vw_ddt_lista per il dominio reso: decodifiche stato,
# destinatario, billing/emittente/utility/valuta, sorgente (DDT origine via
# sorgente_uid). Espone emittente_fiscale_id + emittente_fiscale_codice (filtro
# applicativo BE) e emittente_fiscale_descrizione = COALESCE(ragione sociale del
# soggetto emittente, ef.descrizione) (brief etichetta 2026-07-13).
#
# security_invoker=on: RLS del chiamante (rls_resi_ef_whitelist) applicata sulla
# base. La reloption NON e' visibile in pg_get_viewdef e va RI-SPECIFICATA in
# ogni CREATE OR REPLACE VIEW, altrimenti PostgreSQL la azzera.
# Alias FEDELI alla sorgente (linee-guida-sql §6c).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-33-create-vw-resi-lista-mctit.yaml

  - changeSet:
      id: 20260713-33-create-vw-resi-lista
      author: mctit
      # ⚠️ Era `true`: definisce vendite.vw_resi_lista, che un changeSet PIU' RECENTE
      #   ridefinisce. Rigirando riportava indietro quella revisione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_resi_lista
              WITH (security_invoker=on) AS
              SELECT r.id,
                  r.uid,
                  r.numero,
                  r.anno,
                  r.data,
                  r.stato_doc_reso_id,
                  sr.codice_interno AS stato_codice_interno,
                  sr.descrizione    AS stato_descrizione,
                  r.destinatario_soggetto_ruolo_id,
                  s_dest.id                        AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa  AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  r.billing_account_id,
                  ba.codice AS ba_codice,
                  r.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  COALESCE(s_ef.ragione_sociale_completa, (ef.descrizione)::text)
                            AS emittente_fiscale_descrizione,
                  r.utility_id,
                  u.codice      AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  r.valuta_id,
                  v_val.codice AS valuta_codice,
                  r.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  r.sorgente_uid,
                  d_src.id     AS ddt_origine_id,
                  d_src.numero AS ddt_origine_numero,
                  r.data_insert,
                  r.user_insert,
                  r.data_update,
                  r.user_update
                 FROM vendite.resi r
                   JOIN config.stati_doc_reso sr ON sr.id = r.stato_doc_reso_id
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON sr_dest.id = r.destinatario_soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s_dest ON s_dest.id = sr_dest.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = r.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = r.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = r.utility_id
                   LEFT JOIN config.valute v_val ON v_val.id = r.valuta_id
                   LEFT JOIN config.sorgenti src ON src.id = r.sorgente_tipo_id
                   LEFT JOIN vendite.ddt d_src ON d_src.uid = r.sorgente_uid;

              COMMENT ON VIEW vendite.vw_resi_lista IS
                'Lista/dettaglio resi vendita (mirror vw_ddt_lista). security_invoker=on + RLS su base; espone emittente_fiscale_id/_codice/_descrizione. rev 2026-07-13.';
