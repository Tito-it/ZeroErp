# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 2a (le testate): vendite.fn_annulla_ordine
#   Brief: brief-db-grammatica-unica-documenti §11 (G-1, G-4 di Tid; L2-1 del
#   2026-10-19: il lotto 2 in cinque sotto-giri, questo e' il primo).
#
#   La grammatica delle testate (V3 del censimento) passa ai codici di
#   config.sorgenti: DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA,
#   OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL.
#   PREVENTIVO, CONTRATTO, COMMESSA, FATTURA sono gia' i codici delle sorgenti.
#
#   Chiama fn_documento_ritira_legami con ORDINE_VENDITA.
#
#   Corpo dalla definizione viva (dbdev, 2026-10-19); firma e RETURNS
#   dall'ultimo YAML che li ha ancorati (20261011-86); proprieta' (volatilita',
#   SECURITY, SET search_path) dal catalogo vivo, ripetute. COMMENT vivo con la
#   nota di revisione in coda.
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-61-update-fn-annulla-ordine-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-61-update-fn-annulla-ordine-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_annulla_ordine: Chiama fn_documento_ritira_legami con ORDINE_VENDITA. Grammatica unica, lotto 2a.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_ordine(
                  p_ordine_id         vendite.ordini.id%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
              RETURNS integer
              LANGUAGE plpgsql
              VOLATILE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$

              -- =========================================================
              -- Scopo: annullare un ordine. Con legami: conferma e ritiro
              --   dal BB vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ordine',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ordine_id', p_ordine_id),
                          NULL::uuid, 'vendite.fn_annulla_ordine',
                          'p_ordine_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.ordini t
                   WHERE t.id = p_ordine_id
                     AND script.fn_scope_ef_whitelist_via_ordine(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ordine',
                          'E_ORD_NOT_FOUND', jsonb_build_object('id', p_ordine_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('ORDINE_VENDITA', p_ordine_id, p_legami_confermati);

                  -- 4. Lo stato. I guard della tabella fanno il resto: matrice,
                  --    freni (righe di commessa EMESSA, figli vivi), avviso.
                  UPDATE vendite.ordini o
                     SET stato_doc_ordine_id = (SELECT s.id FROM config.stati_doc_ordini s
                                                 WHERE s.codice_interno = 'ANNULLATO')
                   WHERE o.id = p_ordine_id;

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_annulla_ordine(vendite.ordini.id%TYPE, integer) IS
                'VERBO (2026-10-11, brief-db-annullo-documento-con-legami D-1/D-4): annulla un ordine. Testata FOR UPDATE nel perimetro (script.fn_scope_ef_whitelist_via_ordine; fuori perimetro E_ORD_NOT_FOUND). Conferma e ritiro dal BB vendite.fn_documento_ritira_legami: chi conferma DICHIARA quanti legami ha visto (p_legami_confermati, le righe di vendite.fn_documento_legami(''ORDINE'', id): righe di preventivo, offerta d''origine, righe di commessa NON_EMESSA); se non corrisponde, E_DOC_ANNULLO_CON_LEGAMI. Poi lo stato passa ad ANNULLATO (i guard della tabella applicano matrice e freni) e la porta del ritiro si chiude. UNA transazione. Senza legami non c''e'' niente da confermare. Ritorna i legami confermati. SECURITY DEFINER con search_path bloccato: la porta del ritiro vuole il proprietario. EXECUTE solo all''app. ⭐ rev 2026-10-19 (20261019-61, brief-db-grammatica-unica-documenti lotto 2a, G-1 di Tid): la grammatica delle testate passa ai codici delle sorgenti (DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL; PREVENTIVO, CONTRATTO, COMMESSA, FATTURA invariati); dove sopra si legge un codice corto come selettore, oggi vale il codice della sorgente.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
