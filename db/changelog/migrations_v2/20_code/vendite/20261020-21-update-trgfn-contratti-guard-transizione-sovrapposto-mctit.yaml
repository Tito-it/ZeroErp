# IL CONTRATTO NON SI ATTIVA SOPRA UN CONTRATTO VINCOLANTE: COL CODICE, NON COL 23P01
#   vendite.trgfn_contratti_guard_transizione_stato
#   Richiesta BE del 2026-10-19 (niente brief: decisioni D-1/D-2 di Tid in chat)
#
#   Verso ATTIVO si solleva, dopo gli indirizzi, il motivo di
#   script.fn_check_contratto_sovrapposto (20261020-19) con la quintupla di
#   NEW: E_CONTRATTO_OVERLAP_ESISTENTE, che nomina il contratto in conflitto.
#   La capability lo somma nello stesso punto (20261020-20). L'EXCLUDE
#   ex_contratti_no_overlap resta la difesa dura (23P01), e scatta dopo i
#   BEFORE ROW: chi passa dal verbo prende il codice parlante.
#   ⚠️ D-1 di Tid: il codice e' quello gia' a catalogo del push offerta ->
#   contratto (stesso significato, stesso %s = numero); il testo e' reso
#   generale nel CSV dei messaggi, nello stesso giro.
#   Corpo: pg_get_functiondef (= doc auto-generata, = 20261011-58), col solo
#   blocco nuovo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-21-update-trgfn-contratti-guard-transizione-sovrapposto-mctit.yaml

  - changeSet:
      id: 20261020-21-update-trgfn-contratti-guard-transizione-sovrapposto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_contratti_guard_transizione_stato: verso ATTIVO solleva anche
        E_CONTRATTO_OVERLAP_ESISTENTE (contratto vincolante sovrapposto). Richiesta BE del 2026-10-19.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_guard_transizione_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca transizioni stato non ammesse sul workflow contratti.
              -- Workflow: DRAFT -> ATTIVO -> CESSATO
              --           DRAFT -> ANNULLATO (sempre ammessa, nessuna fatturazione su DRAFT)
              --
              -- ATTIVO->CESSATO: distingue job automatico da cessazione manuale.
              --   Job (GUC app.cessazione_automatica='true'): valido_al < CURRENT_DATE.
              --   Manuale: valido_al >= CURRENT_DATE (no riscrittura storica).
              --   Manuale retroattiva: E_CONTRATTO_VALIDO_AL_RETROATTIVO (449).
              -- ATTIVO->ANNULLATO: non ammessa (cade nel catch generico).
              -- ->ATTIVO: blocca se righe o componenti BoM attivi hanno un prezzo
              --   non autorizzato (PENDING o REJECTED).
              -- Aggiornato 2026-05-12: check PENDING componenti.
              -- Aggiornato 2026-05-14: no-retroattiva su cessazione manuale.
              -- Aggiornato 2026-05-20: DRAFT->ANNULLATO ammessa.
              -- Aggiornato 2026-09-24: il controllo del prezzo all'attivazione passa
              --   dal building block script.fn_check_prezzi_autorizzati — righe E
              --   componenti, PENDING E REJECTED (brief-db-preventivi-congelamento-
              --   pricing, D-4/D-5).
              -- Aggiornato 2026-10-11: ->ATTIVO solleva anche il primo motivo di
              --   script.fn_check_indirizzi_documento_cliente — un indirizzo d'anagrafica
              --   che non e' del cliente del contratto (brief-db-indirizzi-documento-
              --   seguono-il-cliente, D-3).
              -- Aggiornato 2026-10-20: ->ATTIVO solleva per ultimo il motivo di
              --   script.fn_check_contratto_sovrapposto — un contratto vincolante
              --   sovrapposto sulla quintupla dell'EXCLUDE (richiesta BE del 2026-10-19).
              DECLARE
                  v_codice_da config.stati_doc_contratti.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_contratti.codice_interno%TYPE;
                  v_ammessa   boolean := false;
              BEGIN
                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_contratto_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_contratto_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_contratti
                   WHERE id IN (OLD.stato_doc_contratto_id, NEW.stato_doc_contratto_id);

                  IF v_codice_da = 'DRAFT' AND v_codice_a = 'ATTIVO' THEN
                      v_ammessa := true;

                  ELSIF v_codice_da = 'DRAFT' AND v_codice_a = 'ANNULLATO' THEN
                      -- DRAFT->ANNULLATO: sempre ammessa (nessuna fatturazione su DRAFT).
                      v_ammessa := true;

                  ELSIF v_codice_da = 'ATTIVO' AND v_codice_a = 'CESSATO' THEN
                      IF current_setting('app.cessazione_automatica', true) = 'true' THEN
                          -- Job notturno (fn_apply_chiusura_scadenze): contratto gia' scaduto.
                          v_ammessa := (NEW.valido_al IS NOT NULL
                                        AND NEW.valido_al < (SELECT script.fn_data_operativa()));
                      ELSE
                          -- Cessazione manuale: vietata la riscrittura storica.
                          IF NEW.valido_al IS NOT NULL AND NEW.valido_al < script.fn_data_operativa() THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME::text,
                                  'E_CONTRATTO_VALIDO_AL_RETROATTIVO',
                                  jsonb_build_object(
                                      'contratto_id', NEW.id,
                                      'numero',       NEW.numero,
                                      'valido_al',    NEW.valido_al,
                                      'today',        (SELECT script.fn_data_operativa())
                                  ),
                                  NEW.tx_id,
                                  NEW.valido_al::text,
                                  (SELECT script.fn_data_operativa())::text
                              );
                          END IF;
                          v_ammessa := (NEW.valido_al IS NOT NULL);
                      END IF;
                  END IF;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text, 'E_CONTRATTO_STATO_TRANSIZIONE_INVALIDA',
                          jsonb_build_object('contratto_id', NEW.id, 'numero', NEW.numero,
                              'stato_da', v_codice_da, 'stato_a', v_codice_a,
                              'valido_al', NEW.valido_al),
                          NEW.tx_id, NEW.id::text,
                          coalesce(v_codice_da, 'NULL'),
                          coalesce(v_codice_a,  'NULL'),
                          coalesce(NEW.valido_al::text, 'NULL')
                      );
                  END IF;

                  -- Prezzi non autorizzati (rev 2026-09-24): un contratto con un prezzo
                  -- che nessuno ha autorizzato — in attesa o rifiutato, su righe o
                  -- componenti BoM attivi — non si attiva (D-1, D-4).
                  --
                  -- ⭐ Il predicato e' il building block script.fn_check_prezzi_autorizzati,
                  --   lo STESSO che fn_available_actions_contratto usa per spegnere
                  --   «Attiva»: qui si solleva soltanto.
                  -- ⚠️ Fino a questa revisione il controllo guardava i SOLI componenti
                  --   PENDING: una riga con un prezzo in attesa, o un prezzo rifiutato,
                  --   passavano. E sollevava E_COMPONENTE_PREZZO_PENDENTE, il codice del
                  --   guard PER RIGA dei componenti — che resta suo.
                  -- ⚠️ Sulla DESTINAZIONE: oggi ci si arriva solo da DRAFT (le altre
                  --   strade verso ATTIVO non sono ammesse sopra).
                  IF v_codice_a = 'ATTIVO' THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'database', TG_NAME::text,
                          script.fn_check_prezzi_autorizzati('vendite.contratti'::regclass, NEW.id),
                          NULL,
                          NEW.tx_id,
                          jsonb_build_object(
                              'contratto_id', NEW.id,
                              'numero',       NEW.numero,
                              'stato_da',     v_codice_da,
                              'stato_a',      v_codice_a));
                  END IF;

                  -- Indirizzi del cliente (rev 2026-10-11, brief-db-indirizzi-documento-
                  -- seguono-il-cliente, D-3 di Tid): il cliente del contratto (BA/istanza)
                  -- si cambia in DRAFT, e un indirizzo d'anagrafica del cliente di prima, o
                  -- di una fornitura che il contratto non ha piu', non si attiva.
                  -- ⭐ Il predicato e' script.fn_check_indirizzi_documento_cliente, lo
                  --   stesso che fn_available_actions_contratto somma per spegnere «Attiva»,
                  --   dopo listino e prezzi: lo stesso ordine qui.
                  IF v_codice_a = 'ATTIVO' THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'database', TG_NAME::text,
                          script.fn_check_indirizzi_documento_cliente('CONTRATTO', NEW.id),
                          'tipo_indirizzo_id',
                          NEW.tx_id,
                          jsonb_build_object(
                              'contratto_id', NEW.id,
                              'numero',       NEW.numero,
                              'stato_da',     v_codice_da,
                              'stato_a',      v_codice_a));
                  END IF;

                  -- Contratto vincolante sovrapposto (rev 2026-10-20, richiesta BE del
                  -- 2026-10-19): un periodo che si sovrappone a un contratto non in bozza e
                  -- non abortito dello stesso cliente, punto di fornitura, utility e ambito
                  -- non si attiva. Fin qui lo fermava solo l'EXCLUDE ex_contratti_no_overlap,
                  -- con un 23P01 che non nomina il contratto in conflitto: l'EXCLUDE resta la
                  -- difesa dura, il codice parlante arriva da qui.
                  -- ⭐ Il predicato e' script.fn_check_contratto_sovrapposto, lo stesso che
                  --   fn_available_actions_contratto somma per ultimo per spegnere «Attiva»:
                  --   lo stesso ordine qui.
                  -- ⚠️ La quintupla e' quella di NEW: un UPDATE che porta ad ATTIVO
                  --   cambiando le date nella stessa istruzione si giudica sulle date nuove
                  --   (la riga salvata e' ancora quella di ieri).
                  -- ⚠️ Nessun campo: il rimedio sta nelle date o nell'altro contratto, non
                  --   in un input solo.
                  IF v_codice_a = 'ATTIVO' THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'database', TG_NAME::text,
                          script.fn_check_contratto_sovrapposto(
                              NEW.billing_account_id, NEW.istanza_utility_id, NEW.utility_id,
                              NEW.ambito, NEW.valido_dal, NEW.valido_al),
                          NULL,
                          NEW.tx_id,
                          jsonb_build_object(
                              'contratto_id', NEW.id,
                              'numero',       NEW.numero,
                              'stato_da',     v_codice_da,
                              'stato_a',      v_codice_a));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_guard_transizione_stato()
              IS 'Trigger function: controlla transizioni stato contratto. DRAFT->ATTIVO: sempre ammessa (check PENDING componenti BoM). DRAFT->ANNULLATO: sempre ammessa (nessuna fatturazione su DRAFT). ATTIVO->ANNULLATO: non ammessa (raise E_CONTRATTO_STATO_TRANSIZIONE_INVALIDA). ATTIVO->CESSATO: job automatico (GUC app.cessazione_automatica=true) ammette valido_al<oggi; cessazione manuale ammette valido_al>=oggi (no retroattiva). Retroattiva raise E_CONTRATTO_VALIDO_AL_RETROATTIVO (449); NULL raise E_CONTRATTO_STATO_TRANSIZIONE_INVALIDA. rev 2026-05-20 (DRAFT->ANNULLATO). rev 2026-09-24: all''''ingresso in ATTIVO il controllo del prezzo passa dal building block script.fn_check_prezzi_autorizzati via fn_raise_primo_motivo_se_presente — righe E componenti BoM attivi, PENDING E REJECTED, codici E_DOC_PREZZO_PENDENTE / E_DOC_PREZZO_RIFIUTATO. Prima guardava i soli componenti PENDING e sollevava E_COMPONENTE_PREZZO_PENDENTE (che resta al guard per riga dei componenti). La capability fn_available_actions_contratto legge la stessa funzione. Brief: brief-db-preventivi-congelamento-pricing (D-1, D-4, D-5). rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente, D-3 di Tid): verso ATTIVO, dopo i prezzi, solleva il primo motivo di script.fn_check_indirizzi_documento_cliente(''CONTRATTO'', id) — E_INDIRIZZO_DOC_NON_DEL_CLIENTE, un indirizzo d''anagrafica che non e'' del cliente del contratto — nell''ordine della capability. rev 2026-10-20 (richiesta BE del 2026-10-19): verso ATTIVO, dopo gli indirizzi, solleva il primo motivo di script.fn_check_contratto_sovrapposto(NEW.quintupla) — E_CONTRATTO_OVERLAP_ESISTENTE col numero del contratto vincolante (ATTIVO o CESSATO) sovrapposto — nell''ordine della capability. L''EXCLUDE ex_contratti_no_overlap resta la difesa dura.';
