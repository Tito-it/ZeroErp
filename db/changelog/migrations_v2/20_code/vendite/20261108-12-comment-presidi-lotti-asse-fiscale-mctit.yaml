# ------------------------------------------------------------
# I COMMENT che descrivono la spartizione dei due presidi dei lotti
#   Brief: brief-db-revisione-dbops, giro 6 (Q14 ⑦).
#
# Il 20261108-10 porta l'asse dei due presidi sullo stato fiscale e rinomina la
# vista dei lotti chiusi in «congelati». Tre COMMENT la nominano o descrivono la
# spartizione vecchia (linee-guida-sql §5d: il COMMENT si corregge insieme alla
# regola):
#   * vendite.trgfn_fatturazione_lotti_guard_completato() — «la porta dell'esito
#     la sorveglia vw_lotti_chiusi_con_gruppi_in_errore»;
#   * vendite.vw_lotti_segnalazioni_summary — «la spartizione con
#     vw_lotti_chiusi_con_gruppi_in_errore sull'asse pre_fiscale»;
#   * dbops.vw_lotti_fermi_da_guardare — «un DEFINITIVA con un esito ERRORE e'
#     la contraddizione di vw_lotti_chiusi…», e «sull'ignoto pre_fiscale il
#     lotto non compare», che con l'asse nuovo non e' piu' vero: l'ignoto cade
#     nella vista dei congelati.
# Solo i COMMENT: nessun corpo cambia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261108-12-comment-presidi-lotti-asse-fiscale-mctit.yaml

  - changeSet:
      id: 20261108-12-comment-presidi-lotti-asse-fiscale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT del guard del COMPLETATO, di vendite.vw_lotti_segnalazioni_summary e di
        dbops.vw_lotti_fermi_da_guardare riallineati all'asse fiscale dei due presidi dei
        lotti e al nome vw_lotti_congelati_con_gruppi_in_errore. Giro 6 di
        brief-db-revisione-dbops (Q14 ⑦).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_class
               WHERE oid = to_regclass('vendite.vw_lotti_congelati_con_gruppi_in_errore')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_completato() IS
                  'Guard BEFORE UPDATE OF stato_lotto su vendite.fatturazione_lotti: COMPLETATO si '
                  'rifiuta (E_LOTTO_COMPLETATO_NON_GUADAGNATO, TECNICO) se lo stato fiscale del '
                  'lotto e'' abortito (config.stati_doc_fiscale.is_abortito, letto da NEW) o se la '
                  'sede unica vendite.vw_lotti_segnalazioni_summary lo dice fermo — letto, non '
                  'ricalcolato. ⭐ Sulla COLONNA e non in una funzione: il runner scrive stato_lotto '
                  'con un UPDATE diretto. (rev 2026-10-27, 20261027-28: la funzione di allora, '
                  'fn_set_fatturazione_lotto_stato, e'' ritirata da 20261027-07; i passaggi ammessi '
                  'del job stanno nella matrice config.transizioni_stati_lotto_job, e li giudica '
                  'trgfn_fatturazione_lotti_guard_stato_job. Questo guard resta la sola regola del '
                  'fermo: COMPLETATO solo se guadagnato.) Nasce da LTF-0010972 (2026-09-12): un '
                  'rilancio ha scritto COMPLETATO con due documenti ancora in ERRORE. ⚠️ Non chiude '
                  'la porta dell''esito (ERRORE scritto dopo il COMPLETATO): la sorvegliano i due '
                  'presidi dei lotti, sull''asse fiscale — dbops.vw_lotti_fermi_da_guardare finche'' '
                  'il lotto e'' pre-fiscale, vendite.vw_lotti_congelati_con_gruppi_in_errore quando '
                  'e'' congelato (rev 2026-11-07, brief-db-revisione-dbops giro 6). Solo UPDATE: un '
                  'lotto che nasce COMPLETATO non ha righe figlie. Brief: '
                  'brief-db-annullamento-chiude-la-vita §9.3.';

              COMMENT ON VIEW vendite.vw_lotti_segnalazioni_summary IS
                  'SEDE UNICA del riepilogo segnalazioni di un lotto e del verdetto «fermo» (D-1 di '
                  'Tid, 2026-09-18: «la regola va a DB»). Una riga per lotto con i DIECI conteggi '
                  'che fn_get_lotto_segnalazioni_summary restituiva dalle proprie CTE — sei storici '
                  '(segnalazioni C/W/I per canale fattura e lotto, righe di ponte in ERRORE), tre '
                  'del banner (documenti bloccanti, presi in carico, critiche del giro), il decimo '
                  '(esiti ERRORE) — piu'' TRE colonne nuove. ⭐ fermo = (fatture_critical + '
                  'lotto_critical) > 0 OR fatture_stato_esecuzione_errore > 0 OR '
                  'esiti_stato_esecuzione_errore > 0: era LottoSegnalazioniService.evaluate_lotto_status, '
                  'ricopiato qui UNA volta per non doverlo ricopiare mai piu'' — il backend lo LEGGE '
                  '(undicesima colonna della funzione). ⚠️ E'' il verdetto su OGNI lotto, qualunque '
                  'sia lo stato fiscale: la spartizione sull''asse fiscale la fanno i due presidi '
                  '(dbops.vw_lotti_fermi_da_guardare per i pre-fiscali, '
                  'vendite.vw_lotti_congelati_con_gruppi_in_errore per i congelati), non questa '
                  'vista. ⭐ fermo_motivo: vocabolario chiuso CRITICHE | FATTURE_IN_ERRORE | '
                  'ESITI_IN_ERRORE, con la precedenza del banner; NULL se non fermo. ⭐ fermo_da: il '
                  'PIU'' RECENTE dei fatti che lo fermano (data_ora della critica viva, data_update '
                  'della riga di ponte in ERRORE, errore_quando dell''esito con data_update a '
                  'ripiego) — il presidio chiede «da quanto nessuno lo rilancia ne'' lo scioglie», e '
                  'un rilancio fallito di nuovo riparte l''orologio; NOT NULL ogni volta che fermo e'' '
                  'vero. ⛔ Gli aggregati vivono SOLO qui: la funzione e il presidio sono due '
                  'lettori, e un addendo nuovo si aggiunge in un posto solo. Gli stessi filtri della '
                  'funzione: disabilitato IS FALSE, il NOT EXISTS su ESCLUSO nel canale lotto (con '
                  'gruppo_key NULL la riga CONTA: la critica del giro ferma il giro), il denominatore '
                  'sugli ESITI e non sul perimetro. security_invoker: una persona legge i propri '
                  'lotti; un lotto fuori perimetro NON e'' nella vista. Brief: '
                  'brief-db-osservabilita-lotto-fermo-r6-indici §2; rev 2026-11-07 '
                  'brief-db-revisione-dbops giro 6.';

              COMMENT ON VIEW dbops.vw_lotti_fermi_da_guardare IS
                  'PRESIDIO: i giri di fatturazione PRE-FISCALI che la sede unica '
                  '(vendite.vw_lotti_segnalazioni_summary) dichiara `fermo` — critiche vive, riga di '
                  'ponte in ERRORE o esito ERRORE — da OLTRE UN''ORA, e che nessuno ha rilanciato ne'' '
                  'sciolto, qualunque sia stato_lotto (un COMPLETATO in bozza con un esito in errore '
                  'e'' qui). DEVE restare VUOTA. Il banner lo dice a chi apre il lotto; questa riga '
                  'lo dice a chi non lo apre. ⭐ E'' un LETTORE: nessun addendo e'' ricalcolato qui — '
                  '`motivo` e `fermo_da` sono le colonne della sede, e un addendo nuovo del verdetto '
                  'lo vedono insieme il banner, il digest e il pallino (D-1 di Tid, 18-09: una sede a '
                  'DB, il backend trasporta). ⭐ SOLO PRE-FISCALI (vw_lotti_fase.pre_fiscale): un '
                  'lotto congelato con un esito ERRORE, o con lo stato fiscale ignoto, e'' la '
                  'contraddizione di vendite.vw_lotti_congelati_con_gruppi_in_errore — i due presidi '
                  'si spartiscono lo stesso asse, quello fiscale, senza buchi ne'' doppioni (rev '
                  '2026-11-07, brief-db-revisione-dbops giro 6: prima l''altro guardava stato_lotto). '
                  '⚠️ Un''ora non e'' una misura: il rilancio e'' il gesto di una persona, e le tre '
                  'viste delle code usano la stessa soglia per la stessa ragione. L''orologio e'' '
                  '`fermo_da`, il fatto PIU'' RECENTE che ferma il lotto: un rilancio che fallisce di '
                  'nuovo lo riparte, e la domanda resta «da quanto nessuno ci mette le mani». La '
                  'soglia sta qui, non nel catalogo. ⛔ Perimetro DEFINER a catalogo: le tabelle '
                  'sotto hanno la RLS e la vista e'' security_invoker — da una sessione senza GUC '
                  'risponde zero PER CECITA'', il digest conta da proprietario con fn_conta_presidio, '
                  'una persona legge col proprio perimetro. Brief: '
                  'brief-db-osservabilita-lotto-fermo-r6-indici §2; analisi-osservabilita-log §4 '
                  'Passo C.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Solo COMMENT: il testo precedente sta nei changeSet di origine.
              SELECT 1;
