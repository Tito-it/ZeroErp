# Read-side DDT (brief §13) — vista sorgente CANONICA e self-contained per la
# lista configurabile vendite.ddt. Mirror di vendite.vw_ordini_lista
# (20260603-14): pura DENORMALIZZAZIONE (JOIN + campi display), NESSUN
# filtro/scope/paginazione (restano nel repository BE).
#
# security_invoker=on: la vista gira col contesto del chiamante -> le policy RLS
# della tabella base vendite.ddt si applicano (no RLS cosmetica, linee-guida §10).
#
# Specificita' DDT vs ordini:
#   - destinatario (soggetto_ruolo NOT NULL) al posto di "cliente"; +mittente,
#     +vettore (soggetti_ruolo nullable).
#   - campi trasporto/logistica (causale, aspetto, modalita addebito, colli/pesi/
#     volume, targa, autista, date, tracking) per il PDF (D-3).
#   - provenienza: sorgente_tipo_id/sorgente_uid -> ordine di origine
#     (o_src.numero via uid), simmetrico a documento_origine di ordini.
#   - nomi canonici: ragione_sociale_completa, id_fiscale_univoco_cf_piva,
#     ba_codice, stato_codice_interno. numero NUDO (NULL in DRAFT, valorizzato a
#     EMESSO da trgfn_ddt_gen_numero_emesso).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260709-15-create-vw-ddt-lista-mctit.yaml

  - changeSet:
      id: 20260709-15-create-vw-ddt-lista
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea vendite.vw_ddt_lista (security_invoker=on), canonica e
        self-contained, per la lista configurabile DDT. Mirror di
        vw_ordini_lista. Destinatario/mittente/vettore + campi trasporto +
        ordine di origine via sorgente_uid.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: ddt
            - tableExists:
                schemaName: config
                tableName: stati_doc_ddt
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_ddt_lista;
              CREATE VIEW vendite.vw_ddt_lista
              WITH (security_invoker = on) AS
              SELECT
                  d.id,
                  d.uid,
                  d.numero,
                  d.serie,
                  d.anno,
                  d.data,
                  -- Stato
                  d.stato_doc_ddt_id,
                  sd.codice_interno                         AS stato_codice_interno,
                  sd.descrizione                            AS stato_descrizione,
                  -- Destinatario (soggetto_ruolo NOT NULL): nomi canonici
                  d.destinatario_soggetto_ruolo_id,
                  s_dest.id                                 AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa           AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  -- Mittente / vettore (nullable)
                  d.mittente_soggetto_ruolo_id,
                  s_mitt.ragione_sociale_completa           AS mittente_denominazione,
                  d.vettore_soggetto_ruolo_id,
                  s_vett.ragione_sociale_completa           AS vettore_denominazione,
                  -- Billing / utility / valuta (ereditati dall'ordine)
                  d.billing_account_id,
                  ba.codice                                 AS ba_codice,
                  d.utility_id,
                  u.codice                                  AS utility_codice,
                  u.descrizione                             AS utility_descrizione,
                  d.valuta_id,
                  v_val.codice                              AS valuta_codice,
                  -- Trasporto (PDF D-3)
                  d.causale_trasporto_id,
                  ct.codice                                 AS causale_trasporto_codice,
                  ct.descrizione                            AS causale_trasporto_descrizione,
                  d.aspetto_bene_id,
                  ab.codice                                 AS aspetto_bene_codice,
                  ab.descrizione                            AS aspetto_bene_descrizione,
                  d.modalita_addebito_trasporto_id,
                  mat.codice                                AS modalita_addebito_trasporto_codice,
                  -- Logistica
                  d.num_colli,
                  d.peso_lordo,
                  d.peso_netto,
                  d.volume,
                  d.targa,
                  d.autista,
                  d.data_ora_partenza,
                  d.data_ora_consegna_prev,
                  d.tracking_code,
                  -- Provenienza (sorgente): ordine di origine via uid
                  d.sorgente_tipo_id,
                  src.codice_interno                        AS sorgente_codice_interno,
                  d.sorgente_uid,
                  o_src.id                                  AS ordine_origine_id,
                  o_src.numero                              AS ordine_origine_numero,
                  -- Audit
                  d.data_insert,
                  d.user_insert,
                  d.data_update,
                  d.user_update
              FROM vendite.ddt d
              JOIN config.stati_doc_ddt sd
                ON sd.id = d.stato_doc_ddt_id
              -- Destinatario (NOT NULL): join diretto a soggetto
              JOIN anagrafiche.soggetti_ruoli sr_dest
                ON sr_dest.id = d.destinatario_soggetto_ruolo_id
              JOIN anagrafiche.soggetti s_dest
                ON s_dest.id = sr_dest.soggetto_id
              -- Mittente (nullable)
              LEFT JOIN anagrafiche.soggetti_ruoli sr_mitt
                ON sr_mitt.id = d.mittente_soggetto_ruolo_id
              LEFT JOIN anagrafiche.soggetti s_mitt
                ON s_mitt.id = sr_mitt.soggetto_id
              -- Vettore (nullable)
              LEFT JOIN anagrafiche.soggetti_ruoli sr_vett
                ON sr_vett.id = d.vettore_soggetto_ruolo_id
              LEFT JOIN anagrafiche.soggetti s_vett
                ON s_vett.id = sr_vett.soggetto_id
              LEFT JOIN anagrafiche.billing_account ba
                ON ba.id = d.billing_account_id
              LEFT JOIN config.utilities u
                ON u.id = d.utility_id
              LEFT JOIN config.valute v_val
                ON v_val.id = d.valuta_id
              LEFT JOIN config.causali_trasporto ct
                ON ct.id = d.causale_trasporto_id
              LEFT JOIN config.aspetti_beni ab
                ON ab.id = d.aspetto_bene_id
              LEFT JOIN config.modalita_addebito_trasporto mat
                ON mat.id = d.modalita_addebito_trasporto_id
              LEFT JOIN config.sorgenti src
                ON src.id = d.sorgente_tipo_id
              -- Ordine di origine (quando sorgente = ORDINE_VENDITA): uid match
              LEFT JOIN vendite.ordini o_src
                ON o_src.uid = d.sorgente_uid;

              COMMENT ON VIEW vendite.vw_ddt_lista IS
                'Vista flat canonica e self-contained DDT di vendita per la lista '
                'UI configurabile (vendite.ddt). Nomi canonici. Destinatario via '
                'soggetto_ruolo diretto; mittente/vettore nullable. Campi trasporto '
                '(causale/aspetto/modalita/colli/pesi/tracking) per il PDF. Ordine '
                'di origine via sorgente_uid. Pura denormalizzazione: nessuno '
                'scope/filtro. security_invoker=on (RLS-ready). Mirror vw_ordini_lista.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_ddt_lista;
