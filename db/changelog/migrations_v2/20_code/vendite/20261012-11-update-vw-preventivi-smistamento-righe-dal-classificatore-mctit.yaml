# ------------------------------------------------------------
# IL PANNELLO DI SMISTAMENTO: «IN COMMESSA» DAL CLASSIFICATORE
#   vendite.vw_preventivi_smistamento_righe
#   Brief: brief-db-annullo-a-valle-riapre-a-monte (D-5 di Tid, R-7)
#
# ── IL DIFETTO (trovato nel censimento del 2026-10-12) ──────────────
#   stato_smistamento = IN_COMMESSA solo se il segmento della riga ha
#   un'attivita' EMESSA. Era allineato al predicato che la vista smistabili
#   aveva alla nascita (20260612-02); il 2026-06-28 quella e' passata
#   all'ALLOCAZIONE (qualunque stato) e questa no. Effetto: una riga
#   mandata in commessa e non ancora emessa risultava RESIDUA nel pannello
#   mentre il push la dava gia' inviata (e il contatore righe_residue di
#   vw_preventivi_smistamento la contava da smistare). Letto sui corpi delle
#   due viste e sul test che fissava il vecchio allineamento
#   (vendite/test-vw-preventivi-smistamento-v1, test 6).
#
# ── COSA CAMBIA ─────────────────────────────────────────────────────
#   IN_COMMESSA = script.fn_get_stato_push_segment('PREV:<uid>:R:<id>')
#   <> 'LIBERA': la stessa domanda della vista smistabili (20261012-09) e del
#   lister. FATTURATA ed EMESSA_AF restano prima, invariati. Una riga di
#   commessa ANNULLATA non occupa: torna RESIDUA (D-5).
#   Colonne identiche: CREATE OR REPLACE VIEW, grant e vista aggregata
#   restano. Corpo di partenza: 20260612-05 (unica versione).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261012-11-update-vw-preventivi-smistamento-righe-dal-classificatore-mctit.yaml

  - changeSet:
      id: 20261012-11-update-vw-preventivi-smistamento-righe-dal-classificatore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_preventivi_smistamento_righe: IN_COMMESSA quando il segmento non e' LIBERO per script.fn_get_stato_push_segment, invece che solo a riga EMESSA (copia rimasta indietro dal 2026-06-28; D-5). Brief: brief-db-annullo-a-valle-riapre-a-monte (R-7).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'vendite' AND c.relname = 'vw_preventivi_smistamento_righe'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_preventivi_smistamento_righe
              WITH (security_invoker = on) AS
              SELECT
                  p.id        AS preventivo_id,
                  p.uid       AS preventivo_uid,
                  p.numero    AS preventivo_numero,
                  pr.id       AS riga_id,
                  pr.ordine   AS riga_ordine,
                  pr.descrizione AS riga_descrizione,
                  pr.articolo_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.prezzo_unitario,
                  pr.natura_vendita_id,
                  nv.codice   AS natura_vendita_codice,
                  -- Destinazione effettiva: natura NULL = pregresso -> COMMESSA
                  -- (stessa convenzione di fn_list_preventivi_da_pushare).
                  COALESCE(nv.destinazione_tipo, 'COMMESSA') AS destinazione_tipo,
                  -- Ramo ordine: ordini_righe.preventivo_riga_id e' UNIQUE
                  -- (idempotenza di riga) -> LEFT JOIN senza fan-out.
                  orr.id      AS ordine_riga_id,
                  o.id        AS ordine_id,
                  o.numero    AS ordine_numero,
                  -- Stato di smistamento: UNICA colonna autorevole per la UI.
                  -- Progressivi sul ramo commessa (FATTURATA > EMESSA_AF >
                  -- IN_COMMESSA); A_ORDINE per il ramo merce; RESIDUA = non
                  -- smistata. "In commessa" = il segmento non e' LIBERO per il
                  -- classificatore unico (rev 2026-10-12, 20261012-11): la
                  -- stessa domanda della vista smistabili e del lister, quindi
                  -- una riga gia' mandata e non ancora emessa e' in commessa, e
                  -- una riga ANNULLATA (commessa annullata) torna RESIDUA.
                  CASE
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.attivita_fatturabili af
                       WHERE af.sorgente_uid = p.uid
                         AND af.sorgente_riga = pr.id
                         AND af.fattura_riga_id IS NOT NULL
                    ) THEN 'FATTURATA'
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.attivita_fatturabili af
                       WHERE af.sorgente_uid = p.uid
                         AND af.sorgente_riga = pr.id
                    ) THEN 'EMESSA_AF'
                    WHEN script.fn_get_stato_push_segment(
                           ('PREV:' || p.uid::text || ':R:' || pr.id::text)::varchar) <> 'LIBERA'
                      THEN 'IN_COMMESSA'
                    WHEN orr.id IS NOT NULL THEN 'A_ORDINE'
                    ELSE 'RESIDUA'
                  END AS stato_smistamento
              FROM vendite.preventivi p
              JOIN vendite.preventivi_righe pr
                ON pr.preventivo_id = p.id
               AND pr.attivo IS TRUE
              LEFT JOIN config.nature_vendita nv ON nv.id = pr.natura_vendita_id
              LEFT JOIN vendite.ordini_righe orr ON orr.preventivo_riga_id = pr.id
              LEFT JOIN vendite.ordini o ON o.id = orr.ordine_id;

              COMMENT ON VIEW vendite.vw_preventivi_smistamento_righe IS
                'Fonte dati del Pannello Smistamento (una riga per riga attiva del preventivo): natura/destinazione effettiva (NULL = pregresso -> COMMESSA), riferimenti ramo ordine, stato_smistamento autorevole (RESIDUA/A_ORDINE/IN_COMMESSA/EMESSA_AF/FATTURATA). Sostituisce vw_preventivi_stato_fatturazione_righe (brief-db-smistamento-preventivi.md B). ⭐ rev 2026-10-12 (20261012-11, brief-db-annullo-a-valle-riapre-a-monte D-5): IN_COMMESSA = il segmento della riga non e'' LIBERO per script.fn_get_stato_push_segment, la fonte unica del «gia'' mandato». Prima era «segment EMESSA», allineato al predicato che la vista smistabili aveva fino al 2026-06-28: quando quella e'' passata all''allocazione, questa non l''ha seguita, e una riga mandata in commessa e non ancora emessa risultava RESIDUA mentre il push la dava gia'' inviata. Una riga di commessa ANNULLATA non occupa: annullata la commessa, la riga torna RESIDUA.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_preventivi_smistamento_righe
              WITH (security_invoker = on) AS
              SELECT
                  p.id        AS preventivo_id,
                  p.uid       AS preventivo_uid,
                  p.numero    AS preventivo_numero,
                  pr.id       AS riga_id,
                  pr.ordine   AS riga_ordine,
                  pr.descrizione AS riga_descrizione,
                  pr.articolo_id,
                  pr.quantita,
                  pr.qta_operativa,
                  pr.uom_operativa_id,
                  pr.prezzo_unitario,
                  pr.natura_vendita_id,
                  nv.codice   AS natura_vendita_codice,
                  -- Destinazione effettiva: natura NULL = pregresso -> COMMESSA
                  -- (stessa convenzione di fn_list_preventivi_da_pushare).
                  COALESCE(nv.destinazione_tipo, 'COMMESSA') AS destinazione_tipo,
                  -- Ramo ordine: ordini_righe.preventivo_riga_id e' UNIQUE
                  -- (idempotenza di riga) -> LEFT JOIN senza fan-out.
                  orr.id      AS ordine_riga_id,
                  o.id        AS ordine_id,
                  o.numero    AS ordine_numero,
                  -- Stato di smistamento: UNICA colonna autorevole per la UI.
                  -- Progressivi sul ramo commessa (FATTURATA > EMESSA_AF >
                  -- IN_COMMESSA); A_ORDINE per il ramo merce; RESIDUA = non
                  -- smistata. "In commessa" = segment EMESSA (allineato a
                  -- capability/list-fn: una ca non-EMESSA non conta).
                  CASE
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.attivita_fatturabili af
                       WHERE af.sorgente_uid = p.uid
                         AND af.sorgente_riga = pr.id
                         AND af.fattura_riga_id IS NOT NULL
                    ) THEN 'FATTURATA'
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.attivita_fatturabili af
                       WHERE af.sorgente_uid = p.uid
                         AND af.sorgente_riga = pr.id
                    ) THEN 'EMESSA_AF'
                    WHEN EXISTS (
                      SELECT 1 FROM vendite.commesse_attivita ca
                       WHERE ca.segment_key = 'PREV:' || p.uid::text || ':R:' || pr.id::text
                         AND ca.stato_emissione = 'EMESSA'
                    ) THEN 'IN_COMMESSA'
                    WHEN orr.id IS NOT NULL THEN 'A_ORDINE'
                    ELSE 'RESIDUA'
                  END AS stato_smistamento
              FROM vendite.preventivi p
              JOIN vendite.preventivi_righe pr
                ON pr.preventivo_id = p.id
               AND pr.attivo IS TRUE
              LEFT JOIN config.nature_vendita nv ON nv.id = pr.natura_vendita_id
              LEFT JOIN vendite.ordini_righe orr ON orr.preventivo_riga_id = pr.id
              LEFT JOIN vendite.ordini o ON o.id = orr.ordine_id;
