databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260222-12-create-fn-attivita-pipeline-task-runtime-support-mctit.yaml

  - changeSet:
      id: 20260222-12-create-fn-attivita-pipeline-task-runtime-support
      author: mctit
      comment: "Runtime support pipeline attivita: policy lookup e tracing task-runs per branch."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_attivita_pipeline_task_policy(
                p_pipeline_id vendite.attivita_fatturabili_pipeline_task_policy.pipeline_id%TYPE,
                p_task_code vendite.attivita_fatturabili_pipeline_task_policy.task_code%TYPE,
                p_branch_code vendite.attivita_fatturabili_pipeline_task_policy.branch_code%TYPE DEFAULT 'DEFAULT'::character varying
              )
              RETURNS TABLE(
                annullabile vendite.attivita_fatturabili_pipeline_task_policy.annullabile%TYPE,
                resume_mode vendite.attivita_fatturabili_pipeline_task_policy.resume_mode%TYPE,
                block_scope vendite.attivita_fatturabili_pipeline_task_policy.block_scope%TYPE,
                depends_on vendite.attivita_fatturabili_pipeline_task_policy.depends_on%TYPE,
                attivo vendite.attivita_fatturabili_pipeline_task_policy.attivo%TYPE,
                meta vendite.attivita_fatturabili_pipeline_task_policy.meta%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_branch vendite.attivita_fatturabili_pipeline_task_policy.branch_code%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituire la policy runtime task per pipeline attivita,
                --   con fallback branch-specific -> DEFAULT.
                --
                -- Regole:
                --   - p_pipeline_id e p_task_code obbligatori
                --   - priorita` branch richiesto
                --   - fallback su branch_code='DEFAULT'
                -- =========================================================
                IF p_pipeline_id IS NULL OR p_pipeline_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_attivita_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','pipeline_id obbligatorio','pipeline_id',p_pipeline_id)),
                    NULL::uuid,
                    'pipeline_id obbligatorio'
                  );
                END IF;

                IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_attivita_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_code obbligatorio')),
                    NULL::uuid,
                    'task_code obbligatorio'
                  );
                END IF;

                v_branch := COALESCE(NULLIF(btrim(p_branch_code), ''), 'DEFAULT');

                RETURN QUERY
                SELECT p.annullabile, p.resume_mode, p.block_scope, p.depends_on, p.attivo, p.meta
                FROM vendite.attivita_fatturabili_pipeline_task_policy p
                WHERE p.pipeline_id = p_pipeline_id
                  AND p.task_code = p_task_code
                  AND p.branch_code IN (v_branch, 'DEFAULT')
                  AND p.attivo IS TRUE
                ORDER BY CASE WHEN p.branch_code = v_branch THEN 0 ELSE 1 END
                LIMIT 1;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_attivita_pipeline_task_policy', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','policy task non trovata','pipeline_id',p_pipeline_id,'task_code',p_task_code,'branch_code',v_branch)
                    ),
                    NULL::uuid,
                    'Policy task pipeline attivita non trovata'
                  );
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_attivita_pipeline_task_policy(bigint, character varying, character varying)
              IS 'Restituisce policy runtime task per pipeline attivita con fallback branch specifico -> DEFAULT.';

              CREATE OR REPLACE FUNCTION vendite.fn_start_attivita_lotto_task_run(
                p_lotto_attivita_id vendite.attivita_fatturabili_lotti_task_runs.lotto_attivita_id%TYPE,
                p_pipeline_id vendite.attivita_fatturabili_lotti_task_runs.pipeline_id%TYPE,
                p_task_code vendite.attivita_fatturabili_lotti_task_runs.task_code%TYPE,
                p_branch_code vendite.attivita_fatturabili_lotti_task_runs.branch_code%TYPE DEFAULT 'DEFAULT'::character varying,
                p_sorgente_tipo_id vendite.attivita_fatturabili_lotti_task_runs.sorgente_tipo_id%TYPE DEFAULT NULL::bigint,
                p_fase vendite.attivita_fatturabili_lotti_task_runs.fase%TYPE DEFAULT NULL::character varying,
                p_block_scope vendite.attivita_fatturabili_lotti_task_runs.block_scope%TYPE DEFAULT 'BRANCH'::character varying,
                p_depends_on vendite.attivita_fatturabili_lotti_task_runs.depends_on%TYPE DEFAULT '[]'::jsonb,
                p_meta vendite.attivita_fatturabili_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS TABLE(
                task_run_id vendite.attivita_fatturabili_lotti_task_runs.id%TYPE,
                tentativo vendite.attivita_fatturabili_lotti_task_runs.tentativo%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_branch vendite.attivita_fatturabili_lotti_task_runs.branch_code%TYPE;
                v_scope vendite.attivita_fatturabili_lotti_task_runs.block_scope%TYPE;
                v_tentativo vendite.attivita_fatturabili_lotti_task_runs.tentativo%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Aprire un task-run runtime su lotto attivita con
                --   tracking tentativo per branch/task.
                --
                -- Regole:
                --   - lotto_attivita_id e task_code obbligatori
                --   - block_scope ammesso: BRANCH|GLOBAL
                --   - tentativo incrementale per (lotto,pipeline,branch,task)
                -- =========================================================
                IF p_lotto_attivita_id IS NULL OR p_lotto_attivita_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_start_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_attivita_id obbligatorio')),
                    NULL::uuid,
                    'lotto_attivita_id obbligatorio'
                  );
                END IF;

                IF p_pipeline_id IS NOT NULL AND p_pipeline_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_start_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','pipeline_id non valido','pipeline_id',p_pipeline_id)),
                    NULL::uuid,
                    'pipeline_id non valido'
                  );
                END IF;

                IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_start_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','task_code obbligatorio')),
                    NULL::uuid,
                    'task_code obbligatorio'
                  );
                END IF;

                v_branch := COALESCE(NULLIF(btrim(p_branch_code), ''), 'DEFAULT');
                v_scope := upper(COALESCE(NULLIF(btrim(p_block_scope), ''), 'BRANCH'));

                IF v_scope NOT IN ('BRANCH', 'GLOBAL') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_start_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','block_scope non valido','block_scope',p_block_scope)),
                    NULL::uuid,
                    'block_scope non valido'
                  );
                END IF;

                SELECT COALESCE(max(r.tentativo), 0)::smallint + 1
                  INTO v_tentativo
                FROM vendite.attivita_fatturabili_lotti_task_runs r
                WHERE r.lotto_attivita_id = p_lotto_attivita_id
                  AND COALESCE(r.pipeline_id, -1) = COALESCE(p_pipeline_id, -1)
                  AND r.branch_code = v_branch
                  AND r.task_code = p_task_code;

                INSERT INTO vendite.attivita_fatturabili_lotti_task_runs (
                  lotto_attivita_id,
                  pipeline_id,
                  sorgente_tipo_id,
                  branch_code,
                  task_code,
                  fase,
                  tentativo,
                  task_stato,
                  block_scope,
                  depends_on,
                  started_at,
                  meta
                ) VALUES (
                  p_lotto_attivita_id,
                  p_pipeline_id,
                  p_sorgente_tipo_id,
                  v_branch,
                  p_task_code,
                  p_fase,
                  v_tentativo,
                  'IN_ESECUZIONE',
                  v_scope,
                  COALESCE(p_depends_on, '[]'::jsonb),
                  now(),
                  COALESCE(p_meta, '{}'::jsonb)
                )
                RETURNING id, tentativo INTO task_run_id, tentativo;

                RETURN NEXT;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_start_attivita_lotto_task_run(bigint, bigint, character varying, character varying, bigint, character varying, character varying, jsonb, jsonb)
              IS 'Apre un task-run runtime su lotto attivita, incrementa tentativo e marca stato IN_ESECUZIONE.';

              CREATE OR REPLACE FUNCTION vendite.fn_complete_attivita_lotto_task_run(
                p_task_run_id vendite.attivita_fatturabili_lotti_task_runs.id%TYPE,
                p_meta vendite.attivita_fatturabili_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Scopo: chiudere con successo un task-run runtime attivita.
                IF p_task_run_id IS NULL OR p_task_run_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_complete_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_run_id obbligatorio','task_run_id',p_task_run_id)),
                    NULL::uuid,
                    'task_run_id obbligatorio'
                  );
                END IF;

                UPDATE vendite.attivita_fatturabili_lotti_task_runs
                   SET task_stato = 'COMPLETATO',
                       ended_at = now(),
                       error_code = NULL,
                       error_message = NULL,
                       meta = COALESCE(meta, '{}'::jsonb) || COALESCE(p_meta, '{}'::jsonb),
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_task_run_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_complete_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_run non trovato','task_run_id',p_task_run_id)),
                    NULL::uuid,
                    'task_run non trovato'
                  );
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_complete_attivita_lotto_task_run(bigint, jsonb)
              IS 'Completa un task-run runtime attivita impostando stato COMPLETATO e ended_at.';

              CREATE OR REPLACE FUNCTION vendite.fn_fail_attivita_lotto_task_run(
                p_task_run_id vendite.attivita_fatturabili_lotti_task_runs.id%TYPE,
                p_error_code vendite.attivita_fatturabili_lotti_task_runs.error_code%TYPE,
                p_error_message vendite.attivita_fatturabili_lotti_task_runs.error_message%TYPE,
                p_meta vendite.attivita_fatturabili_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Scopo: chiudere in errore un task-run runtime attivita.
                IF p_task_run_id IS NULL OR p_task_run_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_fail_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_run_id obbligatorio','task_run_id',p_task_run_id)),
                    NULL::uuid,
                    'task_run_id obbligatorio'
                  );
                END IF;

                UPDATE vendite.attivita_fatturabili_lotti_task_runs
                   SET task_stato = 'ERRORE',
                       ended_at = now(),
                       error_code = COALESCE(NULLIF(btrim(p_error_code), ''), 'E_TASK_RUNTIME'),
                       error_message = p_error_message,
                       meta = COALESCE(meta, '{}'::jsonb) || COALESCE(p_meta, '{}'::jsonb),
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_task_run_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_fail_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_run non trovato','task_run_id',p_task_run_id)),
                    NULL::uuid,
                    'task_run non trovato'
                  );
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_fail_attivita_lotto_task_run(bigint, character varying, text, jsonb)
              IS 'Marca in ERRORE un task-run runtime attivita valorizzando codice e messaggio errore.';

              CREATE OR REPLACE FUNCTION vendite.fn_cancel_attivita_lotto_task_run(
                p_task_run_id vendite.attivita_fatturabili_lotti_task_runs.id%TYPE,
                p_meta vendite.attivita_fatturabili_lotti_task_runs.meta%TYPE DEFAULT '{}'::jsonb
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- Scopo: annullare un task-run runtime attivita.
                IF p_task_run_id IS NULL OR p_task_run_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cancel_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_run_id obbligatorio','task_run_id',p_task_run_id)),
                    NULL::uuid,
                    'task_run_id obbligatorio'
                  );
                END IF;

                UPDATE vendite.attivita_fatturabili_lotti_task_runs
                   SET task_stato = 'ANNULLATO',
                       ended_at = now(),
                       meta = COALESCE(meta, '{}'::jsonb) || COALESCE(p_meta, '{}'::jsonb),
                       data_update = now(),
                       user_update = current_user
                 WHERE id = p_task_run_id;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cancel_attivita_lotto_task_run', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','task_run non trovato','task_run_id',p_task_run_id)),
                    NULL::uuid,
                    'task_run non trovato'
                  );
                END IF;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_cancel_attivita_lotto_task_run(bigint, jsonb)
              IS 'Marca ANNULLATO un task-run runtime attivita e imposta ended_at.';

              CREATE OR REPLACE FUNCTION vendite.fn_list_attivita_lotto_task_runs(
                p_lotto_attivita_id vendite.attivita_fatturabili_lotti_task_runs.lotto_attivita_id%TYPE,
                p_branch_code vendite.attivita_fatturabili_lotti_task_runs.branch_code%TYPE DEFAULT NULL::character varying,
                p_task_code vendite.attivita_fatturabili_lotti_task_runs.task_code%TYPE DEFAULT NULL::character varying
              )
              RETURNS TABLE(
                id vendite.attivita_fatturabili_lotti_task_runs.id%TYPE,
                lotto_attivita_id vendite.attivita_fatturabili_lotti_task_runs.lotto_attivita_id%TYPE,
                pipeline_id vendite.attivita_fatturabili_lotti_task_runs.pipeline_id%TYPE,
                sorgente_tipo_id vendite.attivita_fatturabili_lotti_task_runs.sorgente_tipo_id%TYPE,
                branch_code vendite.attivita_fatturabili_lotti_task_runs.branch_code%TYPE,
                task_code vendite.attivita_fatturabili_lotti_task_runs.task_code%TYPE,
                fase vendite.attivita_fatturabili_lotti_task_runs.fase%TYPE,
                tentativo vendite.attivita_fatturabili_lotti_task_runs.tentativo%TYPE,
                task_stato vendite.attivita_fatturabili_lotti_task_runs.task_stato%TYPE,
                block_scope vendite.attivita_fatturabili_lotti_task_runs.block_scope%TYPE,
                depends_on vendite.attivita_fatturabili_lotti_task_runs.depends_on%TYPE,
                started_at vendite.attivita_fatturabili_lotti_task_runs.started_at%TYPE,
                ended_at vendite.attivita_fatturabili_lotti_task_runs.ended_at%TYPE,
                error_code vendite.attivita_fatturabili_lotti_task_runs.error_code%TYPE,
                error_message vendite.attivita_fatturabili_lotti_task_runs.error_message%TYPE,
                meta vendite.attivita_fatturabili_lotti_task_runs.meta%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_branch vendite.attivita_fatturabili_lotti_task_runs.branch_code%TYPE;
              BEGIN
                -- Scopo: restituire i task-runs di un lotto attivita con filtri opzionali.
                IF p_lotto_attivita_id IS NULL OR p_lotto_attivita_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_attivita_lotto_task_runs', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_attivita_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_attivita_id obbligatorio')),
                    NULL::uuid,
                    'lotto_attivita_id obbligatorio'
                  );
                END IF;

                v_branch := NULLIF(btrim(p_branch_code), '');

                RETURN QUERY
                SELECT r.id,
                       r.lotto_attivita_id,
                       r.pipeline_id,
                       r.sorgente_tipo_id,
                       r.branch_code,
                       r.task_code,
                       r.fase,
                       r.tentativo,
                       r.task_stato,
                       r.block_scope,
                       r.depends_on,
                       r.started_at,
                       r.ended_at,
                       r.error_code,
                       r.error_message,
                       r.meta
                FROM vendite.attivita_fatturabili_lotti_task_runs r
                WHERE r.lotto_attivita_id = p_lotto_attivita_id
                  AND (v_branch IS NULL OR r.branch_code = v_branch)
                  AND (p_task_code IS NULL OR r.task_code = p_task_code)
                ORDER BY r.started_at DESC, r.id DESC;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_attivita_lotto_task_runs(bigint, character varying, character varying)
              IS 'Elenca task-runs runtime del lotto attivita con filtri opzionali per branch e task_code.';
