# ------------------------------------------------------------
# Slice RESI vendita — numerazione reso a CONFERMATO (brief §2.2).
#
# Mirror di vendite.trgfn_ddt_gen_numero_emesso: assegna resi.numero alla
# transizione a CONFERMATO (no buchi fiscali da bozze DRAFT scartate), fuori dal
# framework sistema_codici (usa_sequenza=false). Formato da config.sistema_codici
# riga 'reso' (prefisso/separatore/lunghezza) + sequenza vendite.resi_numero_seq.
# Immutabilita' garantita da trgfn_v_resi_protect_num (20260713-27).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-26-create-trgfn-resi-gen-numero-mctit.yaml

  - changeSet:
      id: 20260713-26-create-trgfn-resi-gen-numero
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_gen_numero()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: assegna resi.numero alla transizione a CONFERMATO,
              --   fuori dal framework sistema_codici (mirror ddt/fatture).
              DECLARE
                  v_stato  config.stati_doc_reso.codice_interno%TYPE;
                  v_prefix config.sistema_codici.prefisso%TYPE;
                  v_sep    config.sistema_codici.separatore%TYPE;
                  v_len    config.sistema_codici.lunghezza_numero%TYPE;
                  v_seq    bigint;
              BEGIN
                  -- Gia' numerato -> no-op (immutabilita' da trgfn_v_resi_protect_num).
                  IF NEW.numero IS NOT NULL AND btrim(NEW.numero::text) <> '' THEN
                      RETURN NEW;
                  END IF;

                  -- Numero solo a CONFERMATO (no buchi da bozze DRAFT scartate).
                  SELECT sdr.codice_interno INTO v_stato
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = NEW.stato_doc_reso_id;
                  IF v_stato IS DISTINCT FROM 'CONFERMATO' THEN
                      RETURN NEW;
                  END IF;

                  -- Formato data-driven dalla riga sistema_codici 'reso'
                  -- (usa_sequenza=false; default se la riga non esiste ancora).
                  SELECT prefisso, separatore, lunghezza_numero
                    INTO v_prefix, v_sep, v_len
                    FROM config.sistema_codici
                   WHERE codice_interno = 'reso';

                  v_seq := nextval('vendite.resi_numero_seq');
                  NEW.numero := COALESCE(v_prefix, 'RESO')
                             || COALESCE(v_sep, '')
                             || lpad(v_seq::text, COALESCE(v_len, 7), '0');
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_gen_numero()
              IS 'Assegna resi.numero alla transizione a CONFERMATO, fuori dal framework sistema_codici (mirror trgfn_ddt_gen_numero_emesso). Formato da config.sistema_codici riga reso + sequenza vendite.resi_numero_seq. Immutabilita: trgfn_v_resi_protect_num. rev 2026-07-13.';

              DROP TRIGGER IF EXISTS trg_resi_a10_gen_numero_ins_upd ON vendite.resi;
              CREATE TRIGGER trg_resi_a10_gen_numero_ins_upd
                BEFORE INSERT OR UPDATE ON vendite.resi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_resi_gen_numero();
