# vendite.vw_dash_fatturazione_preventivi: il valore di riga dalla sede unica.
#
# Il cruscotto della fatturazione calcolava `valore_riga` con la formula a
# mano, sulla quantita' dello smistamento (COALESCE a zero) e lo sconto della
# riga di preventivo. Stessi argomenti, ora passati alla funzione.
#
# ⚠️ Questa copia divideva lo sconto per `100.0` invece che per `100`: il
#   VALORE e' identico (la divisione per cento e' esatta in numeric), cambia
#   al piu' la SCALA del numeric non arrotondato. La vista espone somme che il
#   cruscotto formatta; l'equivalenza e' provata sul valore, riga per riga, nel
#   brief (§8.10).
#
# -- COSA CAMBIA, e cosa NO ------------------------------------------------
#   Solo l'espressione dell'imponibile: al posto della formula scritta a mano,
#   la sede unica script.fn_imponibile_riga (20260928-16, D-8.8 del brief).
#   Stesso valore, stesse colonne con gli stessi nomi, tipi e posizioni
#   (CREATE OR REPLACE VIEW non ammette altro), stessi filtri, stesso COMMENT
#   (resta sull'oggetto). `security_invoker` e' RIPETUTO: e' una reloption,
#   non sta nel corpo, e un CREATE OR REPLACE che non la ripete la azzera.
#
# Base: corpo vivo dalla doc auto-gen (identico a pg_get_viewdef sullo scratch
#   il 2026-09-28), patchato da uno script che dichiara la sostituzione e ne
#   CONTA le occorrenze: nessun'altra riga toccata.
# Cantiere: brief-db-liste-righe-documento §8.8 (D-8.8), §8.10 passo 3
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-22-update-vw-dash-fatturazione-preventivi-fn-imponibile-riga-mctit.yaml

  - changeSet:
      id: 20260928-22-update-vw-dash-fatturazione-preventivi-fn-imponibile-riga
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_dash_fatturazione_preventivi: valore_riga da script.fn_imponibile_riga (stessi
        argomenti) invece della formula a mano. Stesso valore, security_invoker ripetuto.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_imponibile_riga'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_preventivi
              WITH (security_invoker=on) AS
              WITH righe AS (
                       SELECT sr.preventivo_id,
                          sr.riga_id,
                          script.fn_imponibile_riga(COALESCE(sr.quantita, (0)::numeric), sr.prezzo_unitario, pr.sconto_percentuale) AS valore_riga,
                          (sr.stato_smistamento <> 'RESIDUA'::text) AS transitata
                         FROM (vendite.vw_preventivi_smistamento_righe sr
                           JOIN vendite.preventivi_righe pr ON ((pr.id = sr.riga_id)))
                      )
               SELECT 'PREVENTIVI'::character varying AS area,
                  COALESCE(p.competenza_mese, (date_trunc('month'::text, (p.validita_dal)::timestamp with time zone))::date, (date_trunc('month'::text, (p.data)::timestamp with time zone))::date) AS competenza_mese,
                  p.id AS documento_id,
                  (p.uid)::text AS documento_uid,
                  (p.numero)::text AS codice,
                  p.emittente_fiscale_id,
                  NULL::bigint AS emittente_soggetto_ruolo_id,
                  COALESCE(sum(r.valore_riga), (0)::numeric) AS valore_totale,
                  COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), (0)::numeric) AS valore_transitato,
                  (count(r.riga_id))::integer AS unita_totali,
                  (count(r.riga_id) FILTER (WHERE r.transitata))::integer AS unita_transitate,
                  ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) AS is_transitato,
                  COALESCE(((sdp.esito)::text = 'NEGATIVO'::text), false) AS is_abortito,
                  (
                      CASE
                          WHEN COALESCE(((sdp.esito)::text = 'NEGATIVO'::text), false) THEN NULL::text
                          WHEN ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) THEN NULL::text
                          WHEN ((sdp.codice_interno)::text = 'DRAFT'::text) THEN 'DOC_BOZZA'::text
                          WHEN ((sdp.codice_interno)::text = 'EMESSO'::text) THEN 'IN_ATTESA_ACCETTAZIONE'::text
                          ELSE 'RIGA_RESIDUA'::text
                      END)::character varying AS motivo_fermo,
                  sdp.codice_interno AS stato_codice_interno,
                  sdp.codice AS stato_codice,
                  sdp.fase,
                  s.ragione_sociale_completa AS cliente_display,
                  p.data AS data_riferimento
                 FROM ((((vendite.vw_preventivi p
                   JOIN config.stati_doc_preventivi sdp ON ((sdp.id = p.stato_doc_preventivo_id)))
                   LEFT JOIN righe r ON ((r.preventivo_id = p.id)))
                   LEFT JOIN anagrafiche.istanze_utilities iu ON ((iu.id = p.istanza_utility_id)))
                   LEFT JOIN anagrafiche.soggetti s ON ((s.id = iu.soggetto_id)))
                WHERE p.is_attiva
                GROUP BY p.id, p.uid, p.numero, p.competenza_mese, p.validita_dal, p.data, p.emittente_fiscale_id, sdp.codice_interno, sdp.codice, sdp.fase, sdp.esito, s.ragione_sociale_completa;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino: il corpo vivo prima di questo changeSet (formula scritta
              -- a mano), dalla doc auto-gen del 2026-09-28.
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_preventivi
              WITH (security_invoker=on) AS
              WITH righe AS (
                       SELECT sr.preventivo_id,
                          sr.riga_id,
                          ((COALESCE(sr.quantita, (0)::numeric) * sr.prezzo_unitario) * ((1)::numeric - (COALESCE(pr.sconto_percentuale, (0)::numeric) / 100.0))) AS valore_riga,
                          (sr.stato_smistamento <> 'RESIDUA'::text) AS transitata
                         FROM (vendite.vw_preventivi_smistamento_righe sr
                           JOIN vendite.preventivi_righe pr ON ((pr.id = sr.riga_id)))
                      )
               SELECT 'PREVENTIVI'::character varying AS area,
                  COALESCE(p.competenza_mese, (date_trunc('month'::text, (p.validita_dal)::timestamp with time zone))::date, (date_trunc('month'::text, (p.data)::timestamp with time zone))::date) AS competenza_mese,
                  p.id AS documento_id,
                  (p.uid)::text AS documento_uid,
                  (p.numero)::text AS codice,
                  p.emittente_fiscale_id,
                  NULL::bigint AS emittente_soggetto_ruolo_id,
                  COALESCE(sum(r.valore_riga), (0)::numeric) AS valore_totale,
                  COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), (0)::numeric) AS valore_transitato,
                  (count(r.riga_id))::integer AS unita_totali,
                  (count(r.riga_id) FILTER (WHERE r.transitata))::integer AS unita_transitate,
                  ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) AS is_transitato,
                  COALESCE(((sdp.esito)::text = 'NEGATIVO'::text), false) AS is_abortito,
                  (
                      CASE
                          WHEN COALESCE(((sdp.esito)::text = 'NEGATIVO'::text), false) THEN NULL::text
                          WHEN ((count(r.riga_id) > 0) AND (count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata))) THEN NULL::text
                          WHEN ((sdp.codice_interno)::text = 'DRAFT'::text) THEN 'DOC_BOZZA'::text
                          WHEN ((sdp.codice_interno)::text = 'EMESSO'::text) THEN 'IN_ATTESA_ACCETTAZIONE'::text
                          ELSE 'RIGA_RESIDUA'::text
                      END)::character varying AS motivo_fermo,
                  sdp.codice_interno AS stato_codice_interno,
                  sdp.codice AS stato_codice,
                  sdp.fase,
                  s.ragione_sociale_completa AS cliente_display,
                  p.data AS data_riferimento
                 FROM ((((vendite.vw_preventivi p
                   JOIN config.stati_doc_preventivi sdp ON ((sdp.id = p.stato_doc_preventivo_id)))
                   LEFT JOIN righe r ON ((r.preventivo_id = p.id)))
                   LEFT JOIN anagrafiche.istanze_utilities iu ON ((iu.id = p.istanza_utility_id)))
                   LEFT JOIN anagrafiche.soggetti s ON ((s.id = iu.soggetto_id)))
                WHERE p.is_attiva
                GROUP BY p.id, p.uid, p.numero, p.competenza_mese, p.validita_dal, p.data, p.emittente_fiscale_id, sdp.codice_interno, sdp.codice, sdp.fase, sdp.esito, s.ragione_sociale_completa;
