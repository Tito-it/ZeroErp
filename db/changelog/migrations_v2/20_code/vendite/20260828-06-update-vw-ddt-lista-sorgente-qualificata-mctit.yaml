# FASE D (coda) — IL JOIN ALL'ORDINE SI QUALIFICA SUL TIPO SORGENTE
#   vendite.vw_ddt_lista
#   Piano: brief-db-ddt-riconsegna-eredita-testata, §8.5
#
# ── ⚠️ IL FATTO, e non e' un bug di oggi ─────────────────────────────
#   La vista risolve l'ordine di origine cosi':
#     LEFT JOIN vendite.ordini o_src ON o_src.uid = d.sorgente_uid
#   senza guardare CHE TIPO di sorgente sia. Finche' l'unica sorgente possibile
#   per un DDT era ORDINE_VENDITA la cosa non si notava; dal 20260828-04 un DDT
#   di ri-consegna standalone porta RESO_VENDITA + resi.uid, e quel join non
#   trova nulla — che e' l'esito GIUSTO, ma ci arriva per ASSENZA DI COLLISIONI
#   fra spazi di uuid, non per decisione.
#
# ── ⭐ PERCHE' SI TOCCA ADESSO, visto che l'esito e' gia' giusto ──────
#   Un join che risponde bene per una proprieta' che nessuno ha dichiarato e'
#   un presidio che non c'e'. Costa una condizione, e toglie una domanda a chi
#   legge la vista fra sei mesi: «e se due documenti diversi avessero lo stesso
#   uid?». Con la condizione la domanda non si pone piu'.
#   ⛔ E non e' prudenza generica: la colonna `sorgente_uid` di un DDT ha ora
#   DUE popolazioni possibili, e questa e' l'unica vista che la traduce senza
#   dire quale sta traducendo.
#
# ── ⚠️ COSA NON CAMBIA ───────────────────────────────────────────────
#   Nessuna colonna esposta cambia nome, tipo o valore per i DDT esistenti:
#   `src` (config.sorgenti) resta il tipo, e continua a valorizzarsi anche per
#   RESO_VENDITA — la lista dira' quindi da dove viene il documento, mentre le
#   colonne dell'ordine restano vuote perche' un ordine non c'e'.
#
# ── ⛔ security_invoker=on VA RI-SPECIFICATA ─────────────────────────
#   PostgreSQL la AZZERA su un CREATE OR REPLACE VIEW che non la ripete, e la
#   vista scavalcherebbe la RLS senza dirlo. E' nel testo qui sotto.
#
# ⚠️ Definizione ripresa dalla doc auto-gen (l'oggetto VIVO). L'unica differenza
#   rispetto al vivo e' la condizione aggiunta sul join a vendite.ordini.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260828-06-update-vw-ddt-lista-sorgente-qualificata-mctit.yaml

  - changeSet:
      id: 20260828-06-update-vw-ddt-lista-sorgente-qualificata
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Coda della Fase D del brief-db-ddt-riconsegna-eredita-testata (§8.5): il LEFT JOIN a
        vendite.ordini si qualifica su src.codice_interno = 'ORDINE_VENDITA'. Prima la vista
        traduceva d.sorgente_uid in un ordine senza guardare che tipo di sorgente fosse: con
        una sorgente RESO (20260828-04) il join non trova nulla — l'esito giusto — ma ci
        arrivava per assenza di collisioni fra spazi di uuid, non per decisione. ⭐ Si tocca
        adesso perche' da oggi quella colonna ha DUE popolazioni possibili e questa e' l'unica
        vista che la traduce senza dire quale sta traducendo. ⚠️ Nessuna colonna esposta cambia
        per i DDT esistenti; `src` continua a valorizzarsi anche per RESO_VENDITA, quindi la
        lista dice da dove viene il documento mentre le colonne dell'ordine restano vuote.
        ⛔ security_invoker=on ri-specificata: un CREATE OR REPLACE che non la ripete la azzera.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE n.nspname = 'vendite' AND c.relname = 'vw_ddt_lista' AND c.relkind = 'v';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_ddt_lista
              WITH (security_invoker=on) AS
              SELECT d.id,
                  d.uid,
                  d.numero,
                  d.serie,
                  d.anno,
                  d.data,
                  d.stato_doc_ddt_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  d.destinatario_soggetto_ruolo_id,
                  s_dest.id AS destinatario_soggetto_id,
                  s_dest.ragione_sociale_completa AS destinatario_denominazione,
                  s_dest.id_fiscale_univoco_cf_piva,
                  d.mittente_soggetto_ruolo_id,
                  s_mitt.ragione_sociale_completa AS mittente_denominazione,
                  d.vettore_soggetto_ruolo_id,
                  s_vett.ragione_sociale_completa AS vettore_denominazione,
                  d.billing_account_id,
                  ba.codice AS ba_codice,
                  d.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  d.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  d.valuta_id,
                  v_val.codice AS valuta_codice,
                  d.causale_trasporto_id,
                  ct.codice AS causale_trasporto_codice,
                  ct.descrizione AS causale_trasporto_descrizione,
                  d.aspetto_bene_id,
                  ab.codice AS aspetto_bene_codice,
                  ab.descrizione AS aspetto_bene_descrizione,
                  d.modalita_addebito_trasporto_id,
                  mat.codice AS modalita_addebito_trasporto_codice,
                  d.num_colli,
                  d.peso_lordo,
                  d.peso_netto,
                  d.volume,
                  d.targa,
                  d.autista,
                  d.data_ora_partenza,
                  d.data_ora_consegna_prev,
                  d.tracking_code,
                  d.sorgente_tipo_id,
                  src.codice_interno AS sorgente_codice_interno,
                  d.sorgente_uid,
                  o_src.id AS ordine_origine_id,
                  o_src.numero AS ordine_origine_numero,
                  d.data_insert,
                  d.user_insert,
                  d.data_update,
                  d.user_update,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato
                 FROM (((((((((((((((((((vendite.ddt d
                   JOIN config.stati_doc_ddt sd ON ((sd.id = d.stato_doc_ddt_id)))
                   JOIN anagrafiche.soggetti_ruoli sr_dest ON ((sr_dest.id = d.destinatario_soggetto_ruolo_id)))
                   JOIN anagrafiche.soggetti s_dest ON ((s_dest.id = sr_dest.soggetto_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_mitt ON ((sr_mitt.id = d.mittente_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_mitt ON ((s_mitt.id = sr_mitt.soggetto_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_vett ON ((sr_vett.id = d.vettore_soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_vett ON ((s_vett.id = sr_vett.soggetto_id)))
                   LEFT JOIN anagrafiche.billing_account ba ON ((ba.id = d.billing_account_id)))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = d.emittente_fiscale_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = ef.soggetto_ruolo_id)))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                   LEFT JOIN config.utilities u ON ((u.id = d.utility_id)))
                   LEFT JOIN config.valute v_val ON ((v_val.id = d.valuta_id)))
                   LEFT JOIN config.causali_trasporto ct ON ((ct.id = d.causale_trasporto_id)))
                   LEFT JOIN config.aspetti_beni ab ON ((ab.id = d.aspetto_bene_id)))
                   LEFT JOIN config.modalita_addebito_trasporto mat ON ((mat.id = d.modalita_addebito_trasporto_id)))
                   LEFT JOIN config.sorgenti src ON ((src.id = d.sorgente_tipo_id)))
                   LEFT JOIN vendite.ordini o_src ON (((o_src.uid = d.sorgente_uid) AND ((src.codice_interno)::text = 'ORDINE_VENDITA'::text))))
                   LEFT JOIN vendite.vw_documento_lineage lin ON (((lin.tipo_id = ( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE (((sorgenti.codice_interno)::text = 'DDT_VENDITA'::text) AND (sorgenti.attivo IS TRUE)))) AND (lin.uid = (d.id)::text))));
              ;
      rollback:
        - empty: {}
