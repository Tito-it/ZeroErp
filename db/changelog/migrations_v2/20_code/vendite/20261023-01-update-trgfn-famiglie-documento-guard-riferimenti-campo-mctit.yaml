# UN RIFERIMENTO SBAGLIATO NELLA FAMIGLIA E' UN ERRORE DI CHI LA COMPILA (D1)
#   Brief: brief-be-verifica-documentazione-api, tabella «Aperto per il team DB», D1.
#
#   E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE nacque TECNICO il 2026-08-31 con la
#   premessa «la riga la scrive una migrazione». Dal 2026-09-02 la scrive anche
#   l'amministratore dal CRUD delle famiglie: le tre colonne le digita lui, la
#   sorgente la sceglie lui (la tendina offre solo sorgenti con tabella,
#   list_sorgenti_numerabili; un client che scrive il codice a mano resta un input).
#   Quindi il codice passa a DATO_ERRATO (400) in codici_errore.csv, e il guard
#   deve dire QUALE campo accendere: context ->> 'campo'.
#
#   ⭐ La frase del caso «la sorgente non dichiara una tabella» non nomina piu'
#   config.sorgenti.target_table: con la classe DATO_ERRATO la legge l'operatore.
#   ⚠️ Gemelli gia' in regola: E_FAMIGLIA_DOCUMENTO_SERIE_NON_DISCRIMINA e
#   _TABELLA_GIA_NUMERATA portavano gia' il campo.
#
#   Corpo e COMMENT dalla doc auto-generata (dbdev, 2026-10-23), identici al primo
#   blocco di 20261020-35; sette sostituzioni contate dal generatore. Nessun %TYPE
#   nuovo: v_campo e' un nome di colonna come valore.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261023-01-update-trgfn-famiglie-documento-guard-riferimenti-campo-mctit.yaml

  - changeSet:
      id: 20261023-01-update-trgfn-famiglie-documento-guard-riferimenti-campo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        trgfn_famiglie_documento_guard_riferimenti: E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE
        porta il campo da correggere (context campo) e una frase per l'operatore nel caso della
        sorgente senza tabella; il codice diventa DATO_ERRATO. Brief: brief-be-verifica-documentazione-api D1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_famiglie_documento_guard_riferimenti()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-23 (brief-be-verifica-documentazione-api, D1): il codice
              --   E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE diventa DATO_ERRATO e porta
              --   il CAMPO da correggere (context ->> 'campo'): ogni riferimento lo scrive
              --   l'amministratore dal CRUD delle famiglie, sorgente compresa.
              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la tabella dei documenti e' la target_table della sorgente della
              --   famiglia (config.fn_sorgente_tabella), non piu'
              --   schema_tabella/nome_tabella; entra la regola di una famiglia
              --   attiva per tabella, che era l'indice
              --   uq_famiglie_documento_tabella_attiva
              --   (E_FAMIGLIA_DOCUMENTO_TABELLA_GIA_NUMERATA).
              DECLARE
                  v_relid     pg_catalog.pg_class.oid%TYPE;
                  v_schema    pg_catalog.pg_namespace.nspname%TYPE;
                  v_nome      pg_catalog.pg_class.relname%TYPE;
                  -- la famiglia attiva che numera gia' la stessa tabella
                  v_altra     vendite.famiglie_documento.codice_interno%TYPE;
                  -- un riferimento composto per la frase (schema.tabella.colonna):
                  --   nessuna colonna di cui sia il riflesso
                  v_mancante  text;
                  -- il NOME del campo del form da accendere (codice_interno, colonna_*):
                  --   un nome di colonna come valore, nessuna colonna di cui sia il riflesso
                  v_campo     text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Una riga di vendite.famiglie_documento deve nominare
                  --   oggetti che ESISTONO: la tabella, la colonna del numero,
                  --   quella del billing account SE DICHIARATA (dal 2026-09-14
                  --   e' opzionale come la serie) e - dal 2026-09-01 - quella
                  --   della serie, che in piu' deve DISCRIMINARE il numero.
                  --
                  -- ⛔ Perche' serve: il presidio sul cambio emittente del BA
                  --   compone quei nomi in SQL dinamico. Senza questo guard un
                  --   refuso resterebbe muto fino al primo spostamento di un
                  --   billing account, dove uscirebbe come undefined_table —
                  --   un errore che non nomina la sua causa e arriva in un
                  --   movimento che con le famiglie non c'entra.
                  --
                  -- ⚠️ Solo sulle famiglie ATTIVE: una famiglia ritirata puo'
                  --   nominare una tabella che non c'e' piu'. E' storia.
                  -- =========================================================
                  IF NOT NEW.attivo THEN
                      RETURN NEW;
                  END IF;

                  -- ⭐ rev 2026-10-20: la tabella e' la target_table della sorgente
                  --   (G-5), risolta dal BB. Nessuna riga = la sorgente non dichiara
                  --   una tabella: e' il riferimento mancante, con la sua frase.
                  SELECT t.relid, t.schema_tabella, t.nome_tabella
                    INTO v_relid, v_schema, v_nome
                    FROM config.fn_sorgente_tabella(NEW.codice_interno) t;

                  IF v_relid IS NULL THEN
                      v_mancante := format('la tabella dei documenti della sorgente %s', NEW.codice_interno);
                      v_campo    := 'codice_interno';

                  ELSIF NOT EXISTS (
                      SELECT 1 FROM pg_attribute a
                       WHERE a.attrelid = v_relid
                         AND a.attname  = NEW.colonna_numero
                         AND a.attnum   > 0
                         AND NOT a.attisdropped
                  ) THEN
                      v_mancante := format('%I.%I.%I',
                          v_schema, v_nome, NEW.colonna_numero);
                      v_campo    := 'colonna_numero';

                  -- ⭐ Il billing account e' OPZIONALE (20260914-07): il vuoto e'
                  --   la dichiarazione che questa famiglia non ne ha uno — la
                  --   controparte non e' un cliente (l'ordine di acquisto). Si
                  --   guarda il VALORE e non solo il NULL, come per la serie:
                  --   un form che non compila il campo manda la stringa vuota.
                  --   Il salto sta QUI, prima di comporre: un %I con NULL
                  --   solleverebbe un errore di PostgreSQL senza codice di dominio.
                  ELSIF COALESCE(btrim(NEW.colonna_billing_account), '') <> ''
                        AND NOT EXISTS (
                      SELECT 1 FROM pg_attribute a
                       WHERE a.attrelid = v_relid
                         AND a.attname  = NEW.colonna_billing_account
                         AND a.attnum   > 0
                         AND NOT a.attisdropped
                  ) THEN
                      v_mancante := format('%I.%I.%I',
                          v_schema, v_nome, NEW.colonna_billing_account);
                      v_campo    := 'colonna_billing_account';

                  -- ⭐ La serie e' OPZIONALE: il vuoto e' la dichiarazione che
                  --   questa famiglia una serie non ce l'ha (resi, commesse).
                  --   Si guarda il VALORE e non solo il NULL, perche' un form
                  --   che non compila il campo manda la stringa vuota.
                  ELSIF COALESCE(btrim(NEW.colonna_serie), '') <> ''
                        AND NOT EXISTS (
                            SELECT 1 FROM pg_attribute a
                             WHERE a.attrelid = v_relid
                               AND a.attname  = NEW.colonna_serie
                               AND a.attnum   > 0
                               AND NOT a.attisdropped
                        ) THEN
                      v_mancante := format('%I.%I.%I',
                          v_schema, v_nome, NEW.colonna_serie);
                      v_campo    := 'colonna_serie';
                  END IF;

                  IF v_mancante IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_famiglie_documento_guard_riferimenti',
                          'E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE',
                          jsonb_build_object(
                              'codice_interno',          NEW.codice_interno,
                              'schema_tabella',          v_schema,
                              'nome_tabella',            v_nome,
                              'colonna_numero',          NEW.colonna_numero,
                              'colonna_billing_account', NEW.colonna_billing_account,
                              'colonna_serie',           NEW.colonna_serie,
                              'riferimento_mancante',    v_mancante,
                              -- il campo che il form deve accendere (DATO_ERRATO dal 2026-10-23)
                              'campo',                   v_campo),
                          NULL::uuid,
                          NEW.codice_interno::text,
                          v_mancante);
                  END IF;

                  -- ---------------------------------------------------------
                  -- ⭐ UNA TABELLA, UNA FAMIGLIA (rev 2026-10-20: era l'indice
                  --   uq_famiglie_documento_tabella_attiva, decisione di Tid del
                  --   2026-09-01). Due famiglie ATTIVE non numerano la stessa
                  --   tabella: la famiglia E' il tipo di documento. Dal G-5 la
                  --   tabella viene dalla sorgente, cioe' da un'altra tabella, e
                  --   un indice non fa join: la regola sta qui. Il modello ammette
                  --   due sorgenti con la stessa target_table; non due famiglie
                  --   che le numerano.
                  -- ⚠️ Non e' a prova di concorrenza come l'indice: due creazioni
                  --   simultanee passerebbero entrambe. Dichiarato (intestazione
                  --   del changeSet 20261020-35).
                  -- ---------------------------------------------------------
                  SELECT f.codice_interno INTO v_altra
                    FROM vendite.famiglie_documento f
                    CROSS JOIN LATERAL config.fn_sorgente_tabella(f.codice_interno) t
                   WHERE f.attivo
                     AND f.id IS DISTINCT FROM NEW.id
                     AND t.relid = v_relid
                   ORDER BY f.id
                   LIMIT 1;

                  IF v_altra IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_famiglie_documento_guard_riferimenti',
                          'E_FAMIGLIA_DOCUMENTO_TABELLA_GIA_NUMERATA',
                          jsonb_build_object(
                              'codice_interno', NEW.codice_interno,
                              'tabella',        format('%I.%I', v_schema, v_nome),
                              'altra_famiglia', v_altra,
                              -- il campo che il form deve accendere: la sorgente scelta
                              'campo',          'codice_interno'),
                          NULL::uuid,
                          NEW.codice_interno::text,
                          format('%I.%I', v_schema, v_nome),
                          v_altra::text);
                  END IF;

                  -- ---------------------------------------------------------
                  -- ⭐ LA SERIE DEVE ANCHE DISCRIMINARE IL NUMERO
                  --   Qui la colonna ESISTE: il difetto e' un altro, e ha un
                  --   codice suo. La serie entra nella chiave del contatore,
                  --   quindi apre un secchio che riparte da 1; se il documento
                  --   non la porta anche nel proprio vincolo di unicita', quel
                  --   numero collide con uno gia' emesso e il documento non si
                  --   numera piu'.
                  --
                  -- ⛔ Il confronto e' sul TESTO della definizione dell'indice,
                  --   non sugli attnum di indkey: uq_fatture_numero porta la
                  --   serie come COALESCE(serie, ''), cioe' un'espressione, e
                  --   un'espressione ha attnum 0. Il predicato «preciso»
                  --   rifiuterebbe la FATTURA — verificato.
                  -- ⭐ E' lo stesso predicato del test 5 di
                  --   db/pgtap/vendite/test-chiave-contatore-assi-dichiarati-v1.sql.
                  -- ---------------------------------------------------------
                  IF COALESCE(btrim(NEW.colonna_serie), '') <> ''
                     AND NOT EXISTS (
                         SELECT 1
                           FROM pg_index x
                          WHERE x.indrelid = v_relid
                            AND x.indisunique
                            AND pg_get_indexdef(x.indexrelid) ~ ('\m' || NEW.colonna_numero || '\M')
                            AND pg_get_indexdef(x.indexrelid) ~ ('\m' || NEW.colonna_serie  || '\M')
                     ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_famiglie_documento_guard_riferimenti',
                          'E_FAMIGLIA_DOCUMENTO_SERIE_NON_DISCRIMINA',
                          jsonb_build_object(
                              'codice_interno', NEW.codice_interno,
                              'schema_tabella', v_schema,
                              'nome_tabella',   v_nome,
                              'colonna_numero', NEW.colonna_numero,
                              'colonna_serie',  NEW.colonna_serie,
                              -- ⚠️ Il campo che il form deve accendere: la
                              --   serie e' il valore che l'operatore ha scelto,
                              --   il numero e' un fatto della tabella.
                              'campo',          'colonna_serie'),
                          NULL::uuid,
                          NEW.codice_interno::text,
                          NEW.colonna_serie::text);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_famiglie_documento_guard_riferimenti()
                IS 'Guard `_a10_` su vendite.famiglie_documento: una famiglia ATTIVA deve nominare oggetti che esistono — la tabella del documento, la colonna del numero, quella del billing account e, se dichiarata, quella della serie. ⛔ PERCHE'': quei nomi finiscono in SQL dinamico dentro il presidio sul cambio emittente del billing account, e un refuso resterebbe muto fino al primo spostamento, dove uscirebbe come undefined_table in un movimento che con le famiglie non c''entra. ⭐ SULLA SERIE CI SONO DUE CONTROLLI E DUE CODICI: se la colonna non esiste e'' un refuso come gli altri tre (E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE); se esiste ma NON compare in un vincolo di unicita'' insieme alla colonna del numero e'' il caso peggiore — il nome e'' giusto e si legge — e ha il suo codice E_FAMIGLIA_DOCUMENTO_SERIE_NON_DISCRIMINA, perche'' la serie entra nella chiave del contatore e apre un secchio che riparte da 1: senza il vincolo allargato quel numero collide con uno gia'' emesso. ⛔ IL PREDICATO E'' TESTUALE su pg_get_indexdef e non per attnum, ed e'' verificato: uq_fatture_numero porta la serie come COALESCE(serie, '''''''') — un''espressione, che in pg_index.indkey ha attnum 0 — quindi la versione «precisa» rifiuterebbe la FATTURA e farebbe fallire il migrate sul mirror delle famiglie. E'' lo stesso predicato del test 5 di test-chiave-contatore-assi-dichiarati-v1: due predicati sulla stessa invariante, prima o poi, dissentono. ⚠️ Solo sulle famiglie ATTIVE: una famiglia ritirata puo'' nominare una tabella che non c''e'' piu'', ed e'' storia. Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.3 (DB-1). ⭐ rev 2026-09-14 (P-9, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 3-bis): la colonna del billing account e'' OPZIONALE come la serie — NULL o vuota = «questa famiglia non ha un billing account» (l''ordine di acquisto, la cui controparte e'' un soggetto_ruolo) — e il controllo su pg_attribute si salta PRIMA di comporre, non dentro: un %I con NULL solleverebbe un errore di PostgreSQL senza codice di dominio. Il numero e la tabella restano obbligatori. Rev 2026-10-20 (20261020-35, brief-db-grammatica-unica-documenti 2c, G-5): la tabella dei documenti e'' la target_table della sorgente della famiglia (config.fn_sorgente_tabella); entra la regola di una famiglia ATTIVA per tabella, che era l''indice uq_famiglie_documento_tabella_attiva (E_FAMIGLIA_DOCUMENTO_TABELLA_GIA_NUMERATA). Non e'' a prova di concorrenza come l''indice: dichiarato. Rev 2026-10-23 (brief-be-verifica-documentazione-api, D1): E_FAMIGLIA_DOCUMENTO_RIFERIMENTO_INESISTENTE e'' DATO_ERRATO e porta il campo (context campo: codice_interno, colonna_numero, colonna_billing_account o colonna_serie): ogni riferimento lo sceglie l''amministratore dal CRUD delle famiglie, anche la sorgente.';
