# CHI ACCODA DICE CHE COSA STAMPARE
#   vendite.fn_accoda_stampe_lotto (rev di 20260804-20): parametro
#   p_tipo_documento_output_id DEFAULT NULL, ON CONFLICT sul vincolo di esclusione
#   Brief: brief-db-modelli-documento-standard, §9.2 Q-1 e Q-2 (C-1, C-2 di Tid, 2026-10-20)
#
# -- IL PARAMETRO (C-1) -------------------------------------------------------------
#   Il tipo arriva da chi accoda, non dal lotto. Il lotto e' un insieme fiscale
#   (emittente, tipo di documento fiscale, competenza): dice QUALI fatture, non
#   CHE COSA stampare. Una fattura che deve produrre due documenti sono due
#   chiamate, ognuna idempotente sul suo tipo. Il tipo sta in una sede sola, la
#   riga della coda.
#   In coda alla firma, col DEFAULT NULL che riproduce l'accodamento di prima: il
#   chiamante di oggi (pipeline_repository.accoda_stampe_lotto, un argomento per
#   posizione) non cambia comportamento.
#   Nessun controllo «tipo stampabile per la FATTURA»: l'esistenza la da' la FK,
#   se il tipo puo' stampare lo decide la risoluzione al drenaggio
#   (E_DOCUMENTI_TEMPLATE_NON_RISOLTO sulla riga). Ripeterlo qui sarebbe una
#   seconda copia di documenti.fn_risolvi_template_applicabile.
#
# -- L'ON CONFLICT (C-2) -------------------------------------------------------------
#   Il bersaglio e' ex_fatture_stampa_coda_vivo (20261020-29), un vincolo di
#   ESCLUSIONE: ammette solo ON CONFLICT DO NOTHING senza bersaglio. L'unico altro
#   vincolo che l'INSERT puo' incontrare e' la chiave primaria, generata.
#   La semantica resta quella di prima: una riga viva che copre gia' la fattura
#   vince, e il valore di ritorno conta solo le righe nuove. Il caso «tipo X
#   accodato mentre e' viva una riga col tipo NULL» si chiude da solo: se il
#   candidato e' uno, la riga NULL stampa proprio quello; se sono due, arriva a
#   ERRORE per AMBIGUO, e il riaccodamento col tipo passa.
#
# -- LA FORMA ------------------------------------------------------------------------
#   Un parametro in piu' crea un overload: DROP della firma (bigint) + CREATE.
#   Nel DB non la chiama nessuno (solo il BE); nessun GRANT da ripetere: la
#   versione di prima non ne dava, valgono i privilegi di default.
#   uq_fatture_stampa_coda_vivo si ritira nel changeSet dopo (20261020-31): fino
#   a qui la funzione di prima lo nominava.
#
# Codici: nessuno nuovo (E_PARAMETRO_INVALIDO, E_VALORE_MANCANTE come prima).
# Verifica: db/pgtap/vendite/test-stampa-coda-tipo-documento-v1.sql,
#   db/pgtap/vendite/test-stampa-coda-fondamenta-v1.sql (10, 13, 14)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-30-update-fn-accoda-stampe-lotto-tipo-documento-mctit.yaml

  - changeSet:
      id: 20261020-30-update-fn-accoda-stampe-lotto-tipo-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_accoda_stampe_lotto(p_lotto_id, p_tipo_documento_output_id DEFAULT NULL): chi accoda
        dice che cosa stampare; idempotente sul vincolo di esclusione ex_fatture_stampa_coda_vivo. Brief:
        brief-db-modelli-documento-standard §9.2 Q-1, Q-2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*)
                FROM pg_constraint
               WHERE conrelid = 'vendite.fatture_stampa_coda'::regclass
                 AND conname = 'ex_fatture_stampa_coda_vivo'
                 AND contype = 'x';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_accoda_stampe_lotto(bigint);

              CREATE FUNCTION vendite.fn_accoda_stampe_lotto(
                  p_lotto_id                  vendite.fatture_stampa_coda.lotto_id%TYPE,
                  p_tipo_documento_output_id  vendite.fatture_stampa_coda.tipo_documento_output_id%TYPE DEFAULT NULL
              )
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_sorgente_tipo_id config.sorgenti.id%TYPE;
                  -- tipo esplicito: un conteggio, non una colonna
                  v_accodate         integer := 0;
              BEGIN
                  -- Scopo: accoda un work-item di stampa PENDING per ogni
                  --   fattura del lotto; delega numerazione+render al worker.
                  --   Idempotente: il vincolo di esclusione scarta le righe vive
                  --   che coprono gia' la fattura per quel tipo.
                  -- rev 2026-08-04 (D-M): via il predicato su lf.esclusa. Il
                  --   flag era dormiente, quindi «ogni fattura non esclusa»
                  --   ha sempre voluto dire «ogni fattura».
                  -- rev 2026-10-20 (20261020-30): il tipo di documento da
                  --   stampare lo dice chi accoda; NULL = decide il DB alla
                  --   stampa, se il candidato e' uno.

                  -- Guard parametri ID: no NULL, no <= 0 (non normalizzare).
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_accoda_stampe_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;
                  IF p_tipo_documento_output_id IS NOT NULL AND p_tipo_documento_output_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_accoda_stampe_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_tipo_documento_output_id',
                                             'valore', p_tipo_documento_output_id),
                          NULL::uuid, 'p_tipo_documento_output_id > 0 se indicato');
                  END IF;

                  -- Tipo sorgente FATTURA risolto da config (no hardcode dell'id).
                  SELECT s.id INTO v_sorgente_tipo_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'FATTURA';

                  IF v_sorgente_tipo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_accoda_stampe_lotto', 'E_VALORE_MANCANTE',
                          jsonb_build_object('sorgente', 'FATTURA'),
                          NULL::uuid, 'config.sorgenti FATTURA assente');
                  END IF;

                  -- Accoda le fatture del lotto.
                  -- sorgente_uid = id::text (key_selector FATTURA).
                  -- ON CONFLICT senza bersaglio: ex_fatture_stampa_coda_vivo e'
                  -- un vincolo di esclusione, e l'unico altro vincolo e' la PK.
                  INSERT INTO vendite.fatture_stampa_coda
                      (sorgente_tipo_id, sorgente_id, sorgente_uid, lotto_id,
                       tipo_documento_output_id)
                  SELECT v_sorgente_tipo_id, f.id, f.id::text, p_lotto_id,
                         p_tipo_documento_output_id
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                  ON CONFLICT DO NOTHING;

                  GET DIAGNOSTICS v_accodate = ROW_COUNT;
                  RETURN v_accodate;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_accoda_stampe_lotto(
                  vendite.fatture_stampa_coda.lotto_id%TYPE,
                  vendite.fatture_stampa_coda.tipo_documento_output_id%TYPE) IS
                  'Accoda in vendite.fatture_stampa_coda un work-item PENDING per ogni fattura del lotto (sorgente FATTURA, sorgente_uid=id::text), col tipo di documento da stampare p_tipo_documento_output_id (NULL = decide il DB alla stampa, se fra i modelli che possono stampare ce n''e'' uno solo). Idempotente via il vincolo di esclusione ex_fatture_stampa_coda_vivo (ON CONFLICT DO NOTHING): una riga viva per (fattura, tipo), e una riga col tipo NULL esclude le altre righe vive della stessa fattura. Ritorna il numero di righe effettivamente accodate. Chiamata dal task pipeline stampa_documenti_lotto; numerazione (backstop) e render vivono nel worker drainer. Brief: brief-db-processi-fatturazione-cockpit §4; rev 2026-08-04 (D-M): via il predicato su lf.esclusa; rev 2026-10-20 (brief-db-modelli-documento-standard §9): il parametro del tipo.';
