#
# Trigger BEFORE INSERT su vendite.contratti che valorizza
# emittente_fiscale_id da GUC app.current_user_id via
# script.fn_resolve_emittente_for_user (modello user-derived).
# Skip se gia' valorizzato esplicitamente nel payload
# (admin globale, push da offerta via fn_push_offerta_a_contratto).
#
# Pattern simmetrico a trgfn_preventivi_default_emittente
# (20_code/vendite/20260501-12).
#
# Aggiunge anche il trigger AFTER INSERT OR UPDATE
# trg_contratti_a10_emittenti_fiscali_require_attivo_ins_upd
# per garantire che emittente_fiscale_id non possa puntare a un
# emittente disattivato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260526-03-create-trgfn-contratti-default-emittente-mctit.yaml

  - changeSet:
      id: 20260526-03-create-trgfn-contratti-default-emittente
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        BEFORE INSERT trigger su vendite.contratti che setta
        emittente_fiscale_id da operatore loggato.
        Naming trg_contratti_a10_default_emittente_ins (ordina
        alfabeticamente prima di _a10_guard_*).
        Skip se NEW.emittente_fiscale_id non NULL.
        Errore: E_CONTRATTO_EMITTENTE_NON_RISOLTO (id=463).
        Aggiunge anche require_active_parent su emittente_fiscale_id.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: contratti
            columnName: emittente_fiscale_id
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- Function: vendite.trgfn_contratti_default_emittente
              --
              -- Scopo: valorizzare automaticamente contratti.emittente_fiscale_id
              --        a INSERT-time, leggendo l'operatore loggato dalla GUC
              --        app.current_user_id (popolata dal middleware
              --        JwtAuditAuthentication su tutte le richieste API).
              --
              -- Modello user-derived (simmetrico a preventivi, sessione 2026-05-26):
              -- l'emittente di un contratto e' lo snapshot dell'emittente
              -- dell'OPERATORE che ha creato la riga, NON del BA del documento.
              --
              -- Skip se NEW.emittente_fiscale_id e' gia' valorizzato:
              -- caso ammesso per admin globale che specifica esplicitamente
              -- l'emittente nel payload, o per push da offerta commerciale
              -- (fn_push_offerta_a_contratto propaga v_offerta.emittente_fiscale_id).
              --
              -- Contract GUC (per chiamanti diversi dall'API):
              --   - Contesto API (JwtAuditAuthentication): GUC sempre popolata
              --   - pgAgent jobs / Liquibase data / DBA: se la GUC e' vuota,
              --     il chiamante DEVE valorizzare NEW.emittente_fiscale_id
              --     esplicitamente, altrimenti si solleva
              --     E_CONTRATTO_EMITTENTE_NON_RISOLTO.
              -- ==========================================================
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_default_emittente()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_user_id_text text;
                v_user_id      integer;
              BEGIN
                -- 1) Skip se gia' valorizzato esplicitamente nel payload
                --    (admin globale, batch job, migration data, push da offerta).
                IF NEW.emittente_fiscale_id IS NOT NULL THEN
                  RETURN NEW;
                END IF;

                -- 2) Lettura GUC app.current_user_id (missing_ok=true).
                --    JwtAuditAuthentication la setta SEMPRE su request auth ok.
                v_user_id_text := current_setting('app.current_user_id', true);

                IF v_user_id_text IS NULL OR btrim(v_user_id_text) = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'trgfn_contratti_default_emittente',
                    'E_CONTRATTO_EMITTENTE_NON_RISOLTO',
                    jsonb_build_object(
                      'detail', 'GUC app.current_user_id vuota e payload senza emittente_fiscale_id',
                      'numero_contratto', NEW.numero
                    ),
                    NULL::uuid,
                    concat('GUC vuota, numero=', NEW.numero)
                  );
                END IF;

                -- Cast safe: la GUC e' sempre numerica se valorizzata.
                v_user_id := v_user_id_text::integer;

                -- 3) Resolver operatore -> emittente (modello 1-a-1).
                --    Ritorna NULL per admin globale (no riga in user_emittenti_fiscali).
                NEW.emittente_fiscale_id := script.fn_resolve_emittente_for_user(v_user_id);

                IF NEW.emittente_fiscale_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'trgfn_contratti_default_emittente',
                    'E_CONTRATTO_EMITTENTE_NON_RISOLTO',
                    jsonb_build_object(
                      'detail', 'Operatore senza EF assegnato (admin globale): payload deve specificare emittente_fiscale_id',
                      'auth_user_id', v_user_id,
                      'numero_contratto', NEW.numero
                    ),
                    NULL::uuid,
                    concat('auth_user_id=', v_user_id::text, ', numero=', NEW.numero)
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_default_emittente()
              IS 'BEFORE INSERT trigger fn: setta contratti.emittente_fiscale_id '
                 'da GUC app.current_user_id via script.fn_resolve_emittente_for_user. '
                 'Skip se valorizzato esplicitamente (admin globale, push da offerta). '
                 'Solleva E_CONTRATTO_EMITTENTE_NON_RISOLTO se GUC vuota o '
                 'operatore admin globale senza payload esplicito. '
                 'Pattern simmetrico a trgfn_preventivi_default_emittente.';

              -- Drop-and-recreate per ridefinizioni (runOnChange:true).
              DROP TRIGGER IF EXISTS trg_contratti_a10_default_emittente_ins
                ON vendite.contratti;

              -- Naming: _a10_default_* ordina prima di _a10_guard_* per firing order.
              CREATE TRIGGER trg_contratti_a10_default_emittente_ins
                BEFORE INSERT ON vendite.contratti
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_contratti_default_emittente();

              COMMENT ON TRIGGER trg_contratti_a10_default_emittente_ins
                ON vendite.contratti
              IS 'Default emittente_fiscale_id da operatore loggato (GUC app.current_user_id). '
                 'Fase _a10_default_*: ordina alfabeticamente prima di _a10_guard_*.';

              -- ==========================================================
              -- Trigger AFTER INSERT OR UPDATE: require emittente attivo.
              -- Garantisce che emittente_fiscale_id non punti a un EF
              -- disattivato (pattern simmetrico agli altri FK attivo su contratti).
              -- ==========================================================
              DROP TRIGGER IF EXISTS trg_contratti_a10_emittenti_fiscali_require_attivo_ins_upd
                ON vendite.contratti;

              CREATE TRIGGER trg_contratti_a10_emittenti_fiscali_require_attivo_ins_upd
                AFTER INSERT OR UPDATE OF emittente_fiscale_id
                ON vendite.contratti
                FOR EACH ROW
                EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                    'anagrafiche', 'emittenti_fiscali', 'attivo',
                    'emittente_fiscale_id', 'id'
                );

              COMMENT ON TRIGGER trg_contratti_a10_emittenti_fiscali_require_attivo_ins_upd
                ON vendite.contratti
              IS 'Garantisce che emittente_fiscale_id punti a un emittente_fiscali.attivo=true.';
