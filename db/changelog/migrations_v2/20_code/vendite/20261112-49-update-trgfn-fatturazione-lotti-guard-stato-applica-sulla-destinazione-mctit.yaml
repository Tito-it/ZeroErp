# IL GUARD DEL LOTTO GIUDICA applica_lotto SULLA DESTINAZIONE
#   Brief: brief-db-stati-documento-dal-vocabolario §4.5, difetto ⑥, S-7
#   (Tid, 2026-11-08). Giro 1: il vocabolario fiscale. Gemello di -48.
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   applica_lotto si guardava solo nel ramo «prima assegnazione» (stato
#   precedente NULL). Sul lotto era raggiungibile finche' la colonna era
#   nullable; con -45 e -46 un lotto nasce sempre con lo stato, e il ramo e'
#   morto come quello della fattura. Il passaggio normale non guardava
#   applica_lotto della destinazione.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · a ogni cambio di stato: la destinazione deve avere applica_lotto,
#     stesso codice e parametri del ramo ritirato;
#   · il ramo «prima assegnazione» si ritira (nascita: CHECK di -44);
#   · bypass del reset, matrice con tipo_lotto, verdetto del lotto fermo:
#     invariati. Il controllo «stato attivo» del ramo ritirato lo fa il
#     trigger generato sull'FK (…_stati_doc_fiscale_require_attivo).
#   Fatto datato, 2026-11-12: ogni stato fiscale ha applica_lotto true.
#
# ── DA DOVE ─────────────────────────────────────────────────────────
#   Corpo da pg_get_functiondef su dbdev (2026-11-12). Il trigger non cambia.
#   COMMENT riscritto al presente. Rollback: il corpo e il COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261112-49-update-trgfn-fatturazione-lotti-guard-stato-applica-sulla-destinazione-mctit.yaml

  - changeSet:
      id: 20261112-49-update-trgfn-fatturazione-lotti-guard-stato-applica-sulla-destinazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard dello stato del lotto: applica_lotto sulla destinazione di ogni cambio, via il ramo «prima assegnazione». Brief: brief-db-stati-documento-dal-vocabolario §4.5, S-7.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('vendite.trgfn_fatturazione_lotti_guard_stato()')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- =========================================================
              -- Scopo: il cambio di stato del lotto (BEFORE UPDATE OF
              --   stato_doc_fiscale_id).
              --   1. Lo stato d'arrivo si applica al lotto
              --      (config.stati_doc_fiscale.applica_lotto), sulla
              --      DESTINAZIONE; la nascita la copre il CHECK
              --      chk_stati_doc_fiscale_iniziale_applica.
              --   2. Il passaggio e' una riga ammessa della matrice con
              --      solo_fattura = false e, se la riga lo dichiara, il
              --      tipo_lotto.
              --   3. Un lotto fermo non entra in uno stato congelato e non
              --      abortito: il verdetto dalla sede unica.
              -- =========================================================
              DECLARE
                  v_ok BOOLEAN;  -- esito di EXISTS sulla matrice
                  v_applica   config.stati_doc_fiscale.applica_lotto%TYPE;
                  v_bypass TEXT;
                  v_tipo_lotto TEXT;
                  v_congela   config.stati_doc_fiscale.congela_fiscale%TYPE;
                  v_abortito  config.stati_doc_fiscale.is_abortito%TYPE;
                  v_fermo     boolean;  -- verdetto della sede unica
                  v_motivo    text;     -- motivo del fermo, dalla sede unica
              BEGIN
                  -- Bypass per reset tecnico
                  v_bypass := current_setting('zeroerp.maintenance_reset_lotto_draft', true);
                  IF v_bypass IS NOT NULL AND lower(v_bypass) IN ('1', 'true', 'on', 'yes') THEN
                      RETURN NEW;
                  END IF;
                  IF NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id THEN
                      -- 1. La destinazione si applica al lotto.
                      SELECT s.applica_lotto INTO v_applica
                        FROM config.stati_doc_fiscale s
                       WHERE s.id = NEW.stato_doc_fiscale_id;
                      IF v_applica IS NOT TRUE THEN
                          PERFORM script.fn_log_and_raise_error('database', 'vendite.trgfn_fatturazione_lotti_guard_stato', 'E_LOTTO_PARAMETRO_NON_COERENTE',
                              jsonb_build_object('parametro', 'stato_doc_fiscale_id', 'atteso', 'applica_lotto=true', 'ricevuto', NEW.stato_doc_fiscale_id),
                              NULL::uuid, 'stato non applicabile a lotto', NEW.stato_doc_fiscale_id::text);
                      END IF;

                      -- 2. Il passaggio e' ammesso e non solo_fattura.
                      SELECT EXISTS (
                          SELECT 1 FROM config.stati_doc_fiscale_transizioni t
                           WHERE t.ammesso AND t.stato_from_id = OLD.stato_doc_fiscale_id AND t.stato_to_id = NEW.stato_doc_fiscale_id
                             AND t.solo_fattura = FALSE
                             AND ((t.meta->>'tipo_lotto') IS NULL OR (t.meta->>'tipo_lotto') = NEW.tipo_lotto)
                      ) INTO v_ok;
                      IF NOT v_ok THEN
                          v_tipo_lotto := COALESCE(NEW.tipo_lotto, '');
                          PERFORM script.fn_log_and_raise_error('database', 'vendite.trgfn_fatturazione_lotti_guard_stato', 'E_LOTTO_PARAMETRO_NON_COERENTE',
                              jsonb_build_object('parametro', 'transizione_stato', 'atteso', concat(OLD.stato_doc_fiscale_id, '→ammessa'), 'ricevuto', NEW.stato_doc_fiscale_id, 'tipo_lotto', v_tipo_lotto),
                              NULL::uuid, concat('transizione ', OLD.stato_doc_fiscale_id, '→', NEW.stato_doc_fiscale_id), v_tipo_lotto);
                      END IF;

                      -- 3. Un lotto fermo non diventa definitivo. Stato congelato
                      -- e non abortito, dal vocabolario; il verdetto dalla sede unica
                      -- (legge le righe figlie, non questa colonna: in BEFORE ROW va
                      -- bene).
                      SELECT COALESCE(s.congela_fiscale, FALSE), COALESCE(s.is_abortito, FALSE)
                        INTO v_congela, v_abortito
                        FROM config.stati_doc_fiscale s
                       WHERE s.id = NEW.stato_doc_fiscale_id;
                      IF v_congela IS TRUE AND v_abortito IS FALSE THEN
                          SELECT s.fermo, s.fermo_motivo
                            INTO v_fermo, v_motivo
                            FROM vendite.vw_lotti_segnalazioni_summary s
                           WHERE s.lotto_id = NEW.id;
                          IF v_fermo IS TRUE THEN
                              PERFORM script.fn_log_and_raise_error('database', 'vendite.trgfn_fatturazione_lotti_guard_stato', 'E_PIPELINE_LOTTO_CRITICAL',
                                  jsonb_build_object('lotto_id', NEW.id, 'codice', NEW.codice,
                                                     'stato_da', OLD.stato_doc_fiscale_id, 'stato_a', NEW.stato_doc_fiscale_id,
                                                     'fermo_motivo', v_motivo),
                                  NULL::uuid, VARIADIC ARRAY[]::text[]);
                          END IF;
                      END IF;
                  END IF;
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato() IS
                  'Guard (BEFORE UPDATE OF stato_doc_fiscale_id) del cambio di stato del lotto di fatturazione. Lo stato d''arrivo deve applicarsi al lotto (config.stati_doc_fiscale.applica_lotto): la regola sta sulla destinazione; la nascita la copre il CHECK chk_stati_doc_fiscale_iniziale_applica. Il passaggio deve essere una riga ammessa di config.stati_doc_fiscale_transizioni con solo_fattura = false e, se la riga lo dichiara in meta, lo stesso tipo_lotto. Errore dei due controlli: E_LOTTO_PARAMETRO_NON_COERENTE (parametro stato_doc_fiscale_id o transizione_stato). Un lotto fermo (vendite.vw_lotti_segnalazioni_summary.fermo: segnalazioni critiche, fatture o documenti in errore) non entra in uno stato congelato e non abortito (congela_fiscale, is_abortito): E_PIPELINE_LOTTO_CRITICAL, lo stesso codice del runner; l''annullo resta ammesso. Bypass per il reset tecnico: GUC zeroerp.maintenance_reset_lotto_draft.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- rev 2026-10-24 (20261024-35, brief-modello-documento-vendita
              --   R-1): un lotto FERMO non entra in uno stato congelato e non
              --   abortito. Il verdetto si legge dalla sede unica.
              DECLARE
                  v_ok BOOLEAN;
                  v_bypass TEXT;
                  v_tipo_lotto TEXT;
                  v_congela   config.stati_doc_fiscale.congela_fiscale%TYPE;
                  v_abortito  config.stati_doc_fiscale.is_abortito%TYPE;
                  v_fermo     boolean;  -- verdetto della sede unica
                  v_motivo    text;     -- motivo del fermo, dalla sede unica
              BEGIN
                  -- Bypass per reset tecnico
                  v_bypass := current_setting('zeroerp.maintenance_reset_lotto_draft', true);
                  IF v_bypass IS NOT NULL AND lower(v_bypass) IN ('1', 'true', 'on', 'yes') THEN
                      RETURN NEW;
                  END IF;
                  IF TG_OP = 'UPDATE'
                     AND NEW.stato_doc_fiscale_id IS NOT NULL
                     AND NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id
                  THEN
                      IF OLD.stato_doc_fiscale_id IS NULL THEN
                          -- Prima assegnazione: verifica applica_lotto
                          SELECT s.applica_lotto INTO v_ok
                            FROM config.stati_doc_fiscale s
                           WHERE s.id = NEW.stato_doc_fiscale_id AND s.attivo;
                          IF COALESCE(v_ok, FALSE) = FALSE THEN
                              PERFORM script.fn_log_and_raise_error('database', 'vendite.trgfn_fatturazione_lotti_guard_stato', 'E_LOTTO_PARAMETRO_NON_COERENTE',
                                  jsonb_build_object('parametro', 'stato_doc_fiscale_id', 'atteso', 'applica_lotto=true', 'ricevuto', NEW.stato_doc_fiscale_id),
                                  NULL::uuid, 'stato non applicabile a lotto', NEW.stato_doc_fiscale_id::text);
                          END IF;
                      ELSE
                          -- Transizione: verifica ammessa e non solo_fattura
                          SELECT EXISTS (
                              SELECT 1 FROM config.stati_doc_fiscale_transizioni t
                               WHERE t.ammesso AND t.stato_from_id = OLD.stato_doc_fiscale_id AND t.stato_to_id = NEW.stato_doc_fiscale_id
                                 AND t.solo_fattura = FALSE
                                 AND ((t.meta->>'tipo_lotto') IS NULL OR (t.meta->>'tipo_lotto') = NEW.tipo_lotto)
                          ) INTO v_ok;
                          IF NOT v_ok THEN
                              v_tipo_lotto := COALESCE(NEW.tipo_lotto, '');
                              PERFORM script.fn_log_and_raise_error('database', 'vendite.trgfn_fatturazione_lotti_guard_stato', 'E_LOTTO_PARAMETRO_NON_COERENTE',
                                  jsonb_build_object('parametro', 'transizione_stato', 'atteso', concat(OLD.stato_doc_fiscale_id, '→ammessa'), 'ricevuto', NEW.stato_doc_fiscale_id, 'tipo_lotto', v_tipo_lotto),
                                  NULL::uuid, concat('transizione ', OLD.stato_doc_fiscale_id, '→', NEW.stato_doc_fiscale_id), v_tipo_lotto);
                          END IF;
                      END IF;

                      -- R-1: un lotto fermo non diventa definitivo. Stato congelato
                      -- e non abortito, dal vocabolario; il verdetto dalla sede unica
                      -- (legge le righe figlie, non questa colonna: in BEFORE ROW va
                      -- bene).
                      SELECT COALESCE(s.congela_fiscale, FALSE), COALESCE(s.is_abortito, FALSE)
                        INTO v_congela, v_abortito
                        FROM config.stati_doc_fiscale s
                       WHERE s.id = NEW.stato_doc_fiscale_id;
                      IF v_congela IS TRUE AND v_abortito IS FALSE THEN
                          SELECT s.fermo, s.fermo_motivo
                            INTO v_fermo, v_motivo
                            FROM vendite.vw_lotti_segnalazioni_summary s
                           WHERE s.lotto_id = NEW.id;
                          IF v_fermo IS TRUE THEN
                              PERFORM script.fn_log_and_raise_error('database', 'vendite.trgfn_fatturazione_lotti_guard_stato', 'E_PIPELINE_LOTTO_CRITICAL',
                                  jsonb_build_object('lotto_id', NEW.id, 'codice', NEW.codice,
                                                     'stato_da', OLD.stato_doc_fiscale_id, 'stato_a', NEW.stato_doc_fiscale_id,
                                                     'fermo_motivo', v_motivo),
                                  NULL::uuid, VARIADIC ARRAY[]::text[]);
                          END IF;
                      END IF;
                  END IF;
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato() IS
                  'Guard transizioni stato lotti via config.stati_doc_fiscale_transizioni (solo_fattura = false, filtro meta tipo_lotto). Bypass via GUC zeroerp.maintenance_reset_lotto_draft. ⭐ rev 2026-10-24 (20261024-35, R-1 di Tid): un lotto FERMO (vendite.vw_lotti_segnalazioni_summary.fermo: segnalazioni critiche, fatture o documenti in errore) non entra in uno stato congelato e non abortito (config.stati_doc_fiscale.congela_fiscale / is_abortito): E_PIPELINE_LOTTO_CRITICAL, lo stesso codice del runner. Prima i documenti in errore si tolgono dal lotto (o si correggono e si rilancia lo step). L''annullo resta ammesso.';
