# ------------------------------------------------------------
# IL TRAVERSAL RENDE LA NATURA (4 di 4) — e smette di ricalcolare la lettera.
#
# -- COSA CAMBIA ------------------------------------------------------
#   Due colonne in coda alla RETURNS TABLE: from_natura_doc_codice e
#   to_natura_doc_codice. Sono cio' che, nel pannello «Passaggi», distingue la
#   fattura dalla nota di credito che la rettifica — due nodi che oggi hanno
#   stesso tipo, stesso stato e `codice` NULL finche' non sono numerati.
#   E is_ramo_inverso non e' piu' calcolato qui come `arco = 'R'`: arriva dalla
#   vista, che e' l'unica sede dell'elenco dei rami di ritorno.
#
# -- ⛔ DROP + CREATE, e il GRANT che ne discende ----------------------
#   La RETURNS TABLE cambia, e PostgreSQL non lo consente in place: serve un
#   DROP. Misurato prima di scriverlo: nessuna funzione e nessuna vista del
#   database la chiamano — il solo consumatore e' il backend
#   (vendite_repository, pannello «Passaggi»), che seleziona per nome e non si
#   rompe per due colonne in coda. Niente CASCADE.
#   ⚠️ Il DROP porta via anche i GRANT. Senza la riga finale il pannello e i
#   pgTAP (che girano come zeroerp_app) prenderebbero «permesso negato» fino
#   alla passata serale di ci_apply: stesso rimedio di 20260819-07.
#   ⚠️ Solo zeroerp_app: i ruoli batch si concedono nel provisioning, non qui.
#
# -- ⚠️ UNA CONSEGUENZA DA SAPERE, PER CHI RENDE A VIDEO ---------------
#   Camminando in avanti da una commessa, la nota di credito compare DUE volte:
#   una come figlia diretta (arco G, dalla commessa) e una a livello 2 (arco N,
#   dalla fattura che rettifica). Non e' un difetto: sono due relazioni
#   diverse verso lo stesso documento, e il traversal ritorna ARCHI, non nodi.
#   Il FE distingue gia' i rami di ritorno con is_ramo_inverso, che sull'arco N
#   e' true.
#
# -- IL CANTIERE ------------------------------------------------------
#   Messaggio del team BE dal collaudo, prova 6 (2026-08-20): la prima nota di
#   credito esiste — fattura 15353, natura NOTA_CREDITO, tre righe che
#   rettificano le righe 461/465/468 della fattura 835 — e il documento e'
#   corretto. Restano due cose, e le due si toccano nel grafo di genealogia.
#   Cantiere: brief-design-note-credito-resi §44.
#
# -- ⚠️ UNA MISURA DEL BE NON SI RIPRODUCE ----------------------------
#   Il messaggio dice «FATTURA 835 · indietro: 0 archi · avanti: 0 archi».
#   Rimisurato il 2026-08-21 in contesto operatore: da 835 indietro escono
#   SETTE archi (G verso tre commesse, E, A) e dalla NC 15353 ne escono due.
#   Il grafo attraversa gia' le fatture: quello che manca davvero e' l'arco
#   FRA le due fatture, che e' un'altra cosa e la richiesta la nomina bene.
# ------------------------------------------------------------

# Origine: corpo da pg_get_functiondef del 2026-08-21; firma dallo YAML vivo
#   20260714-11.
# Dipendenze: 20260821-02 (is_ramo_inverso e le nature sugli archi).
# Verifica: db/pgtap/vendite/test-documento-lineage-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260821-04-recreate-fn-documento-lineage-natura-mctit.yaml

  - changeSet:
      id: 20260821-04-recreate-fn-documento-lineage-natura
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DROP + CREATE (la RETURNS TABLE cambia): il traversal espone la natura dei due estremi,
        cosi' nel pannello «Passaggi» la nota di credito smette di essere una seconda riga
        «Fattura · EMESSA». is_ramo_inverso arriva dalla vista invece di essere ricalcolato.
        Il DROP porta via i GRANT: si ri-concede a zeroerp_app nello stesso changeSet.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_documento_lineage'
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name   = 'vw_documento_lineage_archi'
                     AND column_name  = 'to_natura_doc_codice'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⛔ DROP e non CREATE OR REPLACE: la RETURNS TABLE cambia (due colonne in
              --    piu') e PostgreSQL non lo consente in place. Il DROP e' esplicito e senza
              --    CASCADE — misurato che nessuna funzione e nessuna vista la chiamano: il
              --    solo consumatore e' il backend (vendite_repository, pannello «Passaggi»),
              --    che seleziona per nome e non si rompe per due colonne in coda.
              DROP FUNCTION IF EXISTS vendite.fn_documento_lineage(bigint, text, text);

              CREATE OR REPLACE FUNCTION vendite.fn_documento_lineage(
                  p_tipo_id   config.sorgenti.id%TYPE,
                  -- ⚠️ p_uid NON e' ancorabile: e' la chiave POLIMORFA del nodo — uuid per
                  --    preventivi e offerte, id per tutto il resto, secondo il key_selector
                  --    di config.sorgenti — resa a text. Non e' il riflesso di UNA colonna.
                  p_uid       text,
                  -- ⚠️ idem p_direzione: 'avanti'|'indietro' non e' il valore di una colonna.
                  p_direzione text DEFAULT 'avanti'
              )
               RETURNS TABLE(
                             -- livello e ordine li CALCOLA il traversal: non c'e' colonna.
                             livello                 integer,
                             ordine                  integer,
                             -- la lettera diagnostica nasce nella vista archi, non in tabella.
                             arco                    text,
                             ruolo                   vendite.commesse_sorgenti.ruolo_link%TYPE,
                             from_tipo_id            config.sorgenti.id%TYPE,
                             -- from_uid/to_uid e from_codice/to_codice: stessa ragione di
                             -- p_uid — chiave polimorfa e `numero` di otto tabelle diverse.
                             from_uid                text,
                             from_codice             text,
                             to_tipo_id              config.sorgenti.id%TYPE,
                             to_uid                  text,
                             to_codice               text,
                             -- lo stato arriva dalla UNION di otto config.stati_doc_*:
                             -- nessuna singola colonna da ancorare.
                             to_stato_codice_interno character varying,
                             to_fase                 character varying,
                             to_is_abortito          boolean,
                             is_ramo_inverso         boolean,
                             -- ⭐ rev 2026-08-20: la NATURA dei due estremi. Senza, nel
                             --    pannello «Passaggi» due nodi FATTURA della stessa commessa
                             --    — la fattura e la nota di credito che la rettifica — sono
                             --    la stessa riga scritta due volte: stesso tipo, stesso
                             --    stato, e `codice` NULL finche' non sono numerati.
                             from_natura_doc_codice  config.nature_doc_fiscale.codice_interno%TYPE,
                             to_natura_doc_codice    config.nature_doc_fiscale.codice_interno%TYPE)
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- Guard parametri (AGENTS: ID numerici NOT NULL e > 0).
                  IF p_tipo_id IS NULL OR p_tipo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'E_ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_tipo_id obbligatorio e > 0',
                                             'p_tipo_id', p_tipo_id),
                          NULL::uuid,
                          concat('p_tipo_id non valido: ', COALESCE(p_tipo_id::text, 'NULL')));
                  END IF;

                  IF p_uid IS NULL OR btrim(p_uid) = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'E_ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_uid obbligatorio (chiave nodo)'),
                          NULL::uuid,
                          'p_uid non valido (NULL o vuoto)');
                  END IF;

                  IF p_direzione IS NULL OR p_direzione NOT IN ('avanti', 'indietro') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_documento_lineage', 'E_ERRORE_PARAMETRI',
                          jsonb_build_object('detail', 'p_direzione deve essere avanti|indietro',
                                             'p_direzione', p_direzione),
                          NULL::uuid,
                          concat('p_direzione non valido: ', COALESCE(p_direzione, 'NULL')));
                  END IF;

                  RETURN QUERY
                  WITH RECURSIVE trav AS (
                      -- Livello 1: archi adiacenti al nodo di partenza nella direzione scelta.
                      SELECT a.from_tipo_id, a.from_uid, a.from_codice,
                             a.to_tipo_id, a.to_uid, a.to_codice,
                             a.to_stato_codice_interno, a.to_fase, a.to_is_abortito,
                             a.ruolo, a.arco, a.is_ramo_inverso,
                             a.from_natura_doc_codice, a.to_natura_doc_codice,
                             1 AS livello,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END AS cur_tipo,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_uid    ELSE a.from_uid    END AS cur_uid,
                             ARRAY[
                                 p_tipo_id::text || ':' || p_uid,
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                     || ':' ||
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                             ] AS visited
                        FROM vendite.vw_documento_lineage_archi a
                       WHERE (p_direzione = 'avanti'   AND a.from_tipo_id = p_tipo_id AND a.from_uid = p_uid)
                          OR (p_direzione = 'indietro' AND a.to_tipo_id   = p_tipo_id AND a.to_uid   = p_uid)
                      UNION ALL
                      -- Espansione: dal nodo corrente segui gli archi nella stessa direzione.
                      SELECT a.from_tipo_id, a.from_uid, a.from_codice,
                             a.to_tipo_id, a.to_uid, a.to_codice,
                             a.to_stato_codice_interno, a.to_fase, a.to_is_abortito,
                             a.ruolo, a.arco, a.is_ramo_inverso,
                             a.from_natura_doc_codice, a.to_natura_doc_codice,
                             t.livello + 1,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END,
                             CASE WHEN p_direzione = 'avanti' THEN a.to_uid    ELSE a.from_uid    END,
                             t.visited || (
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                     || ':' ||
                                 (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                             )
                        FROM trav t
                        JOIN vendite.vw_documento_lineage_archi a
                          ON (p_direzione = 'avanti'   AND a.from_tipo_id = t.cur_tipo AND a.from_uid = t.cur_uid)
                          OR (p_direzione = 'indietro' AND a.to_tipo_id   = t.cur_tipo AND a.to_uid   = t.cur_uid)
                       WHERE t.livello < 10
                         AND NOT (
                             (CASE WHEN p_direzione = 'avanti' THEN a.to_tipo_id ELSE a.from_tipo_id END)::text
                                 || ':' ||
                             (CASE WHEN p_direzione = 'avanti' THEN a.to_uid ELSE a.from_uid END)
                         ) = ANY (t.visited)
                  )
                  -- Cast espliciti al tipo dichiarato dalla RETURNS TABLE: la union di
                  -- vw_documento_lineage_nodi.codice risolve a varchar, quindi from_codice/
                  -- to_codice arrivano varchar mentre la firma li vuole text (PG e' rigido
                  -- sul match esatto, SQLSTATE 42804).
                  SELECT t.livello::integer,
                         (ROW_NUMBER() OVER (ORDER BY t.livello,
                                                      t.from_tipo_id, t.from_uid,
                                                      t.to_tipo_id, t.to_uid))::integer AS ordine,
                         t.arco::text, t.ruolo::varchar,
                         t.from_tipo_id, t.from_uid::text, t.from_codice::text,
                         t.to_tipo_id, t.to_uid::text, t.to_codice::text,
                         t.to_stato_codice_interno::varchar, t.to_fase::varchar, t.to_is_abortito,
                         -- ⭐ rev 2026-08-20: NON si ricalcola piu' `t.arco = 'R'`. La
                         --    proprieta' arriva da vw_documento_lineage_archi, che e' l'unica
                         --    sede dell'elenco dei rami di ritorno. Con l'arrivo dell'arco N
                         --    (nota di credito) quella lettera era scritta a mano in tre
                         --    posti: qui e nei due WHERE della summary. Il posto dimenticato
                         --    non avrebbe dato nessun errore — solo un ramo di ritorno reso
                         --    come avanzamento del flusso.
                         t.is_ramo_inverso,
                         t.from_natura_doc_codice::varchar, t.to_natura_doc_codice::varchar
                    FROM trav t
                   ORDER BY ordine;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_lineage(bigint, text, text)
              IS 'Traversal ricorsivo del grafo di genealogia documenti (pannello «Passaggi»): ritorna la catena degli archi dal nodo di partenza, con livello/ordine per il rendering e lo stato di ogni tappa. Sorgente unica: vendite.vw_documento_lineage_archi. STABLE, SECURITY INVOKER: la RLS emittente delle viste security_invoker resta applicata. Cycle guard sul percorso (set dei visitati) e livello < 10. ⭐ rev 2026-08-20 — DUE COSE, entrambe per la nota di credito. (1) espone from_natura_doc_codice/to_natura_doc_codice: senza, due nodi FATTURA della stessa commessa — la fattura e la nota di credito che la rettifica — erano la stessa riga scritta due volte (stesso tipo, stesso stato, `codice` NULL finche'' non numerati). (2) is_ramo_inverso non e'' piu'' ricalcolato qui come `arco = ''R''` ma arriva dalla vista, che e'' l''unica sede dell''elenco dei rami di ritorno: con l''arco N quella lettera viveva in TRE posti e il terzo dimenticato non avrebbe dato errori, solo un ramo di ritorno reso come avanzamento. ⛔ La firma e'' cambiata (RETURNS TABLE), quindi questa revisione e'' un DROP + CREATE: il DROP porta via i GRANT, ri-concessi a zeroerp_app nello stesso changeSet.';

              -- Il DROP ha portato via i GRANT: senza questa riga il pannello «Passaggi»
              -- e i pgTAP (che girano come zeroerp_app) prendono «permesso negato» fino
              -- alla passata serale di ci_apply. Stesso rimedio di 20260819-07.
              -- ⚠️ Solo zeroerp_app: i ruoli batch si concedono nel provisioning, non qui.
              GRANT EXECUTE ON FUNCTION vendite.fn_documento_lineage(bigint, text, text) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Ripristino non automatizzato: si riapplica 20260714-11.
              -- ⚠️ E si ri-concede il GRANT a zeroerp_app: anche quel ripristino e'
              --    un DROP + CREATE.
              SELECT 1;
