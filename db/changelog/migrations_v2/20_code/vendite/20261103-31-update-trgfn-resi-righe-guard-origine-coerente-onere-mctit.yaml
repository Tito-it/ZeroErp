# UN ONERE NON SI RENDE — vendite.trgfn_resi_righe_guard_origine_coerente
#   Brief: brief-db-addebito-trasporto-ordine §8.1 (riga «Reso») e decisioni
#   di Tid del 2026-11-03 (l'onere non si rende, non si riconsegna).
#
# ── ⭐ PERCHE' QUI ───────────────────────────────────────────────────
#   Il guard giudica gia' A COSA si riferisce la riga di reso (la riga di bolla
#   e la sua origine d'ordine), e scatta su INSERT e su UPDATE OF ddt_riga_id:
#   e' il punto in cui il riferimento nasce o cambia. Ordine dei guard a20:
#   «origine» precede «quantita» per nome, quindi l'onere parla col suo codice
#   prima che il guard della quantita' lo misuri. Censimento §8.1: con questo
#   rifiuto accredito, riconsegna e coda sono a posto per costruzione.
#   Nessuna capability da accendere: il reso sceglie le righe dalla partita
#   (vendite.fn_partite_merce, 20261103-30), che l'onere non ce l'ha.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · passo 0 nuovo: la natura CONGELATA della riga di bolla, giudicata dal
#     building block script.fn_natura_e_merce (20261103-16). Falso = onere
#     (su bolla l'ammissione lascia entrare solo merce e articoli-onere,
#     20261103-17) -> E_RESO_RIGA_ONERE. NULL (riga non visibile) non decide:
#     lo fanno i guard di esistenza del padre;
#   · contesto: campo ddt_riga_id, bersaglio [reso, bolla]; valori numero di
#     riga, etichetta della bolla, codice dell'articolo;
#   · SECURITY INVOKER scritto (era il default).
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   I due rami di E_RESO_ORIGINE_INCOERENTE, il trigger (BEFORE INSERT OR
#   UPDATE OF ddt_riga_id, ordine_riga_id): non si ricrea.
#
#   Corpo dal vivo (= doc auto-gen, confrontato il 2026-11-03), cambiato solo
#   nei punti sopra. Dichiarazione dal 20260817-13.
#   ⚠️ Codice nuovo E_RESO_RIGA_ONERE (id 1425): lo aggiunge il coordinatore in
#   80_data (codici_errore.csv, messaggi_errore.csv). Risolto a runtime.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261103-31-update-trgfn-resi-righe-guard-origine-coerente-onere-mctit.yaml

  - changeSet:
      id: 20261103-31-update-trgfn-resi-righe-guard-origine-coerente-onere
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_resi_righe_guard_origine_coerente: una riga di reso non si riferisce a una riga-onere della
        bolla (script.fn_natura_e_merce sulla natura congelata), E_RESO_RIGA_ONERE. Prima della coerenza
        dell'origine. brief-db-addebito-trasporto-ordine §8.1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_righe_guard_origine_coerente()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: coerenza fra il riferimento all'ordine portato dalla riga
              --   di reso e il fulfillment della riga di DDT da cui la merce e'
              --   tornata. `ordine_riga_id` e' una denormalizzazione, e un
              --   riferimento che non descrive la merce lascia il residuo
              --   dell'ordine non riaperto (fn_ordine_riga_qta_riconsegna).
              -- rev 2026-11-03 (20261103-31, brief-db-addebito-trasporto-ordine §8.1):
              --   prima di tutto, la riga resa deve essere MERCE: un onere della bolla
              --   (trasporto, spese) non torna indietro (E_RESO_RIGA_ONERE).
              DECLARE
                  v_n_origini  integer;
                  v_combacia   boolean;
                  v_natura     vendite.ddt_righe.natura_vendita_id%TYPE;
                  v_riga_nr    vendite.ddt_righe.riga_nr%TYPE;
                  v_ddt_id     vendite.ddt_righe.ddt_id%TYPE;
                  v_articolo   catalogo.articoli.codice%TYPE;
                  -- Etichetta dal lettore del lock (script.fn_get_stato_testata_documento,
                  -- RETURNS TABLE di text): composta, nessuna colonna di cui sia il riflesso.
                  v_etichetta  text;
              BEGIN
                  -- 0. Un onere non si rende (rev 2026-11-03). La natura e' quella
                  --    CONGELATA della riga di bolla; il predicato e' il building block
                  --    script.fn_natura_e_merce. Riga non visibile (NULL): decidono i
                  --    guard di esistenza del padre, non questo.
                  SELECT dr.natura_vendita_id, dr.riga_nr, dr.ddt_id, a.codice
                    INTO v_natura, v_riga_nr, v_ddt_id, v_articolo
                    FROM vendite.ddt_righe dr
                    LEFT JOIN catalogo.articoli a ON a.id = dr.articolo_id
                   WHERE dr.id = NEW.ddt_riga_id;

                  IF script.fn_natura_e_merce(v_natura) IS FALSE THEN
                    SELECT t.etichetta INTO v_etichetta
                      FROM script.fn_get_stato_testata_documento('DDT_VENDITA', v_ddt_id) AS t;
                    PERFORM script.fn_log_and_raise_error(
                      'vendite','trgfn_resi_righe_guard_origine_coerente','E_RESO_RIGA_ONERE',
                      jsonb_build_object('campo',       'ddt_riga_id',
                                         'ddt_riga_id', NEW.ddt_riga_id,
                                         'bersaglio',   jsonb_build_array(
                                             jsonb_build_object('tipo', 'RESO_VENDITA', 'id', NEW.reso_id::text),
                                             jsonb_build_object('tipo', 'DDT_VENDITA',  'id', v_ddt_id::text))),
                      NEW.tx_id,
                      v_riga_nr::text, COALESCE(v_etichetta, v_ddt_id::text), COALESCE(v_articolo, ''));
                  END IF;

                  -- Quante righe d'ordine sono evase da questa riga di DDT, e se
                  -- il valore proposto e' fra quelle. Una sola scansione.
                  SELECT COUNT(*),
                         COALESCE(bool_or(f.ordine_riga_id = NEW.ordine_riga_id), false)
                    INTO v_n_origini, v_combacia
                    FROM vendite.ordini_righe_fulfillment f
                   WHERE f.ddt_riga_id = NEW.ddt_riga_id;

                  -- Riga di merce ORDER-BACKED: il riferimento va valorizzato, e
                  -- dev'essere UNA delle origini. Non «la prima»: il fulfillment
                  -- ne ammette piu' di una, e scegliere sarebbe arbitrio.
                  IF v_n_origini > 0 AND NOT v_combacia THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database','trgfn_resi_righe_guard_origine_coerente','E_RESO_ORIGINE_INCOERENTE',
                      jsonb_build_object('ddt_riga_id',    NEW.ddt_riga_id,
                                         'ordine_riga_id', NEW.ordine_riga_id,
                                         'origini_valide', v_n_origini,
                                         'motivo',         CASE WHEN NEW.ordine_riga_id IS NULL
                                                                THEN 'mancante su merce ordinata'
                                                                ELSE 'non fra le origini della riga DDT' END),
                      NEW.tx_id,
                      -- ⚠️ Il valore VARIADIC non e' decorativo: senza almeno un
                      -- argomento la risoluzione dell'overload fallisce e l'errore
                      -- che esce e' «la funzione non esiste» (42883) invece del
                      -- codice di dominio. Un `throws_ok` senza SQLSTATE lo
                      -- accetterebbe, e il guard sembrerebbe funzionare.
                      NEW.ddt_riga_id::text, NEW.ordine_riga_id::text);
                  END IF;

                  -- Riga di merce SENZA ordine (standalone, o aggiunta a mano):
                  -- un riferimento qui riaprirebbe il residuo di un ordine che
                  -- non ha spedito questa merce.
                  IF v_n_origini = 0 AND NEW.ordine_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database','trgfn_resi_righe_guard_origine_coerente','E_RESO_ORIGINE_INCOERENTE',
                      jsonb_build_object('ddt_riga_id',    NEW.ddt_riga_id,
                                         'ordine_riga_id', NEW.ordine_riga_id,
                                         'origini_valide', 0,
                                         'motivo',         'valorizzato su merce senza ordine'),
                      NEW.tx_id,
                      NEW.ddt_riga_id::text, NEW.ordine_riga_id::text);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_righe_guard_origine_coerente() IS
                'Guard di coerenza dell''origine sul reso (partita merce generalizzata S6a): resi_righe.ordine_riga_id deve combaciare col fulfillment di resi_righe.ddt_riga_id — valorizzato e coincidente con UNA delle origini se la riga di DDT e'' order-backed, VUOTO se non lo e''. Bicondizionale: le due direzioni sono lo stesso errore visto dai due lati. Perche'' serve: `ordine_riga_id` e'' una denormalizzazione ricavabile dal fulfillment, e la legge fn_ordine_riga_qta_riconsegna per riaprire il residuo dell''ordine — sbagliata o vuota, la merce torna e l''ordine non se ne accorge. ⚠️ Il fulfillment ammette piu'' righe d''ordine per una riga di DDT (unicita'' sulla COPPIA): si chiede che il valore sia una delle origini, non «la prima». Il backend deriva gia'' il campo dallo snapshot della riga DDT: questo guard copre le scritture che non passano dal service. Errore E_RESO_ORIGINE_INCOERENTE (DATO_ERRATO). Rev 2026-11-03 (20261103-31, brief-db-addebito-trasporto-ordine §8.1, decisioni di Tid del 2026-11-03): PRIMA della coerenza dell''origine, la riga di bolla resa deve essere MERCE (script.fn_natura_e_merce sulla natura congelata della riga): un onere della bolla (trasporto, spese) non torna indietro, E_RESO_RIGA_ONERE (DATO_ERRATO; valori numero di riga, etichetta della bolla, codice dell''articolo; campo ddt_riga_id; bersaglio il reso, poi la bolla). Con questo guard accredito, riconsegna e coda accrediti sono a posto per costruzione: nessun reso nasce su un onere.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' nella doc auto-gen alla revisione prima di questa.
              -- Non si riscrive un corpo stantio.
              SELECT 1;
