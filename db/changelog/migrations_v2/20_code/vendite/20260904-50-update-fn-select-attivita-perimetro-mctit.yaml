# D1+D2 pezzo 4 — LA SELECT RICEVE IL PERIMETRO, E IL RIFIUTO DECIDE
#   vendite.fn_select_attivita_fatturabili: filtra per `emit_batch_id`
#   Piano: brief-residuo-fatturabili-e-bandiere-esito-parziale, sezione 9
#
# ── ⭐ E' IL PEZZO CHE CHIUDE LA CREPA ─────────────────────────────
#   Il pull firmava (20260904-32) e nessuno leggeva. Da qui in poi un giro
#   fattura SOLO cio' che il proprio pull ha consegnato: una commessa respinta
#   non e' marchiata, quindi non viene fatturata. «Commessa rifiutata» e
#   «commessa non fatturata» tornano a essere la stessa affermazione.
#
# ── 🔴🔴 QUESTO CHANGESET FERMA LA FATTURAZIONE FINCHE' IL BACKEND ─
#   ⛔ Va letto prima di applicarlo, non dopo. Finche'
#   `pull_attivita_da_commessa` non passa il `lock_batch_id` del lotto a
#   `fn_emit_attivita_fatturabili_da_commessa`, NESSUNA riga porta il marchio:
#   la select non trova niente e il giro chiude con ZERO fatture — senza
#   errore, perche' «zero righe eleggibili» e' un esito legittimo.
#   ⇒ **Decisione di Tid, 2026-09-04**, presa sapendolo: meglio una
#   fatturazione ferma e visibile che un perimetro facoltativo. La forma con
#   l'interruttore (`p_solo_marchiate`) e' stata scartata: avrebbe reso la
#   correttezza opt-in e lasciato in casa un'impalcatura da togliere.
#   ⭐ Lo sblocco lato BE e' UNA RIGA: il valore e' gia' in `LottoContext`.
#
# ── ⭐ PERCHE' NON SI PUO' DIMENTICARE ─────────────────────────────
#   Non c'e' nessun parametro nuovo da ricordarsi. Chi lucchetta e' GIA'
#   obbligato a dichiarare il proprio giro — il guard esistente pretende
#   `p_lock_batch_id` quando `p_lock` — e da adesso dichiarare il giro
#   SIGNIFICA prendersene il perimetro. Le due cose non possono divergere
#   perche' sono lo stesso parametro.
#
# ── ⚠️ LA CONDIZIONE E' SULLA PRESENZA DEL GIRO, NON SU `p_lock` ───
#   Non e' la stessa cosa, ed e' voluto: un'ANTEPRIMA che dichiara il proprio
#   giro vede esattamente cio' che il giro vero prendera'. Filtrata
#   diversamente sarebbe peggio di nessuna anteprima — mostrerebbe un elenco
#   che poi non si avvera.
#   Una chiamata senza giro resta senza filtro: non lucchetta, non fattura,
#   non puo' fare danni.
#
# ── ⚠️ E il registro del debito si legge PRIMA di applicare ────────
#   `dbops.vw_af_senza_giro` elenca le righe che nessun giro rivendica: sono
#   quelle che da qui in poi NON verranno piu' fatturate finche' un pull non
#   le ri-adotta. Non e' un effetto collaterale, e' l'effetto — ma va guardato
#   con gli occhi aperti, non scoperto dopo.
#
# ── ℹ️ CREATE OR REPLACE basta ─────────────────────────────────────
#   Firma e `RETURNS SETOF vendite.attivita_fatturabili` invariati: nessun
#   DROP, nessun chiamante da toccare.
#   ⚠️ La firma viva aveva perso i `%TYPE` dell'originale (20260727-13) perche'
#   `pg_get_functiondef` li scioglie: sono stati rimessi, e `p_lock_batch_id`
#   ne guadagna uno — ora dice da dove viene, cioe' dal lotto.
#
# Dipendenze: la colonna del 20260904-31 e il marchio del 20260904-32.
# Verifica: db/pgtap/vendite/test-select-perimetro-consegnato-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260904-50-update-fn-select-attivita-perimetro-mctit.yaml

  - changeSet:
      id: 20260904-50-update-fn-select-attivita-perimetro
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_select_attivita_fatturabili sceglie per MARCHIO e non piu'' per sole coordinate: un giro
        fattura solo cio'' che il proprio pull ha consegnato. ⭐ E'' il pezzo che chiude D1+D2 — il pull
        firmava dal 20260904-32 e nessuno leggeva. ⭐ Non si puo'' dimenticare: nessun interruttore, chi
        lucchetta e'' gia'' obbligato a dichiarare il giro e da adesso dichiararlo significa prendersene il
        perimetro. 🔴 ATTENZIONE: finche'' il backend non passa il lock_batch_id del lotto al pull, nessuna
        riga e'' marchiata e il giro chiude con ZERO fatture, senza errore. Decisione di Tid del
        2026-09-04, presa sapendolo: meglio una fatturazione ferma e visibile che un perimetro
        facoltativo. Lo sblocco lato BE e'' una riga, il valore e'' gia'' in LottoContext.
        Piano: brief-residuo-fatturabili-e-bandiere-esito-parziale, sezione 9.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: attivita_fatturabili
                columnName: emit_batch_id
            # Il marchio dev'essere gia' scritto da qualcuno, o questo filtro
            # nasce cieco per costruzione.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_emit_attivita_fatturabili_da_commessa'
                     AND pg_get_function_arguments(p.oid) ILIKE '%p_emit_batch_id%';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_select_attivita_fatturabili(
                  p_competenza_mese             DATE,
                  p_tipo_doc_fiscale_id         config.tipi_doc_fiscale.id%TYPE,
                  -- ⭐ Da 2026-09-04 questo parametro dice DUE cose, e la seconda e' nuova:
                  --    e' la chiave del lucchetto E l'identita' del GIRO. Il %TYPE lo lega
                  --    alla sua sorgente vera, la colonna del lotto, invece di lasciarlo un
                  --    `UUID` qualunque.
                  p_lock_batch_id               vendite.fatturazione_lotti.lock_batch_id%TYPE DEFAULT NULL,
                  p_lock                        BOOLEAN DEFAULT FALSE,
                  p_data_fatturazione           DATE DEFAULT CURRENT_DATE,
                  p_billing_account_id          anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                  p_utility_id                  config.utilities.id%TYPE DEFAULT NULL,
                  p_valuta_id                   config.valute.id%TYPE DEFAULT NULL,
                  p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL,
                  p_area_geografica_id          BIGINT DEFAULT NULL,
                  p_limit                       INTEGER DEFAULT NULL,
                  p_gruppi                      TEXT[] DEFAULT NULL
              )
               RETURNS SETOF vendite.attivita_fatturabili
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: seleziona (e opzionalmente blocca) le attivita' fatturabili
              --        eleggibili di un perimetro, marcandole stato_esecuzione=PENDING.
              -- rev 2026-06-19: FOR UPDATE OF a (lock ristretto ad attivita_fatturabili).
              -- rev 2026-07-27 (brief emissione mirata A4): p_gruppi restringe la
              --        selezione ai GRUPPI FATTURABILI richiesti. E' il secondo e
              --        decisivo punto di applicazione del perimetro mirato: qui si
              --        filtrano le AF GIA' ESISTENTI, che il filtro sul pull
              --        (fn_emit_attivita_fatturabili_da_commessa) non puo' vedere.
              DECLARE
                  v_competenza DATE;
                  v_data_fatturazione DATE;
                  v_where TEXT;
                  v_join TEXT;
                  v_limit TEXT;
                  v_sql TEXT;
              BEGIN
                  IF p_competenza_mese IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_competenza_mese', 'valore', NULL), NULL::uuid, 'p_competenza_mese obbligatoria');
                  END IF;
                  IF p_tipo_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', NULL), NULL::uuid, 'p_tipo_doc_fiscale_id obbligatorio');
                  END IF;
                  IF p_lock AND p_lock_batch_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lock_batch_id', 'valore', NULL), NULL::uuid, 'p_lock_batch_id obbligatorio quando p_lock=true');
                  END IF;

                  v_competenza := date_trunc('month', p_competenza_mese)::DATE;
                  v_data_fatturazione := COALESCE(p_data_fatturazione, CURRENT_DATE);

                  v_where := ' WHERE a.approvato IS TRUE AND a.fatturato IS FALSE AND a.sospesa IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE'
                      || ' AND (a.posticipa_al IS NULL OR a.posticipa_al <= ' || quote_literal(v_data_fatturazione) || ')'
                      || ' AND a.competenza_mese <= ' || quote_literal(v_competenza)
                      || ' AND a.tipo_doc_fiscale_id = ' || quote_literal(p_tipo_doc_fiscale_id);

                  -- 🔴 D1+D2 — IL PERIMETRO CONSEGNATO, e da qui in poi il rifiuto DECIDE.
                  --   Fino al 2026-09-04 il perimetro di un giro era «tutto cio' che e'
                  --   libero e in competenza»: una riga liberata da un giro disfatto era
                  --   indistinguibile da una appena consegnata dal pull, quindi la commessa
                  --   che il pull aveva RESPINTO finiva in fattura lo stesso — e senza
                  --   nessun errore, perche' quella fattura di troppo e' una fattura
                  --   normale.
                  --   ⇒ Adesso si fattura solo cio' che il pull di QUESTO giro ha firmato.
                  --
                  -- ⭐ IL PERIMETRO NON SI PUO' DIMENTICARE, ed e' il punto della forma.
                  --   Non c'e' nessun interruttore da ricordarsi di accendere: chi lucchetta
                  --   e' gia' OBBLIGATO a dichiarare il proprio giro (il guard qui sopra
                  --   pretende `p_lock_batch_id` quando `p_lock`), e dichiarare il giro
                  --   SIGNIFICA prendersi il suo perimetro. Le due cose non possono piu'
                  --   divergere perche' sono lo stesso parametro.
                  --
                  -- ⚠️ La condizione e' sulla PRESENZA del giro e non su `p_lock`, e non e'
                  --   la stessa cosa: cosi' anche un'anteprima che dichiara il proprio giro
                  --   vede ESATTAMENTE cio' che il giro vero prendera'. Un'anteprima
                  --   filtrata diversamente dal giro e' peggio di nessuna anteprima —
                  --   mostra un elenco che poi non si avvera.
                  --   Una chiamata senza giro (`p_lock_batch_id` NULL, quindi per forza
                  --   senza lucchetto) resta senza filtro: non fattura niente e non puo'
                  --   fare danni.
                  IF p_lock_batch_id IS NOT NULL THEN
                      v_where := v_where || ' AND a.emit_batch_id = ' || quote_literal(p_lock_batch_id);
                  END IF;

                  IF p_billing_account_id IS NOT NULL THEN v_where := v_where || ' AND a.billing_account_id = ' || quote_literal(p_billing_account_id); END IF;
                  IF p_utility_id IS NOT NULL THEN v_where := v_where || ' AND ba.utility_id = ' || quote_literal(p_utility_id); END IF;
                  IF p_valuta_id IS NOT NULL THEN v_where := v_where || ' AND a.valuta_id = ' || quote_literal(p_valuta_id); END IF;
                  IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                      v_where := v_where || ' AND a.billing_account_id IS NOT NULL AND anagrafiche.fn_get_emittente_fiscale_id(a.billing_account_id) = ' || quote_literal(p_emittente_soggetto_ruolo_id);
                  END IF;
                  IF p_area_geografica_id IS NOT NULL THEN v_where := v_where || ' AND a.area_geografica_id = ' || quote_literal(p_area_geografica_id); END IF;

                  -- ============================================
                  -- EMISSIONE MIRATA (rev 2026-07-27): filtro per gruppo.
                  -- ============================================
                  -- Il join alla riga di commessa si aggiunge SOLO quando il
                  -- filtro e' attivo: senza p_gruppi la query resta identica a
                  -- prima, sia come forma sia come piano (garanzia G1).
                  -- commessa_attivita_id e' NOT NULL su attivita_fatturabili,
                  -- quindi l'INNER JOIN non perde righe.
                  -- L'array entra come letterale quotato + cast, coerente con
                  -- gli altri parametri iniettati sopra.
                  v_join := '';
                  IF p_gruppi IS NOT NULL THEN
                      v_join := ' JOIN vendite.commesse_attivita ca ON ca.id = a.commessa_attivita_id';
                      v_where := v_where
                          || ' AND vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) = ANY ('
                          || quote_literal(p_gruppi::text) || '::text[])';
                  END IF;

                  v_limit := CASE WHEN p_limit IS NOT NULL THEN ' LIMIT ' || p_limit::TEXT ELSE '' END;

                  IF p_lock THEN
                      -- ⚠️ FOR UPDATE OF a: il lock resta ristretto ad
                      -- attivita_fatturabili anche in presenza del join. Non
                      -- estenderlo a ca: serializzerebbe la fatturazione con le
                      -- operazioni di commessa.
                      v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_join || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ' FOR UPDATE OF a SKIP LOCKED) UPDATE vendite.attivita_fatturabili a SET lock_in_fatturazione = true, lock_batch_id = ' || quote_literal(p_lock_batch_id) || ', stato_esecuzione = ''PENDING'', data_update = now(), user_update = current_user FROM candidati c WHERE a.id = c.id AND a.fatturato IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE RETURNING a.*';
                  ELSE
                      v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_join || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ') SELECT a.* FROM vendite.attivita_fatturabili a JOIN candidati c ON c.id = a.id ORDER BY a.data_attivita, a.id';
                  END IF;

                  RETURN QUERY EXECUTE v_sql;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Torna a scegliere per sole coordinate. ⚠️ Rimette anche il
              -- difetto D1: una commessa respinta torna fatturabile.
              CREATE OR REPLACE FUNCTION vendite.fn_select_attivita_fatturabili(
                  p_competenza_mese             DATE,
                  p_tipo_doc_fiscale_id         config.tipi_doc_fiscale.id%TYPE,
                  p_lock_batch_id               UUID DEFAULT NULL,
                  p_lock                        BOOLEAN DEFAULT FALSE,
                  p_data_fatturazione           DATE DEFAULT CURRENT_DATE,
                  p_billing_account_id          anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                  p_utility_id                  config.utilities.id%TYPE DEFAULT NULL,
                  p_valuta_id                   config.valute.id%TYPE DEFAULT NULL,
                  p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL,
                  p_area_geografica_id          BIGINT DEFAULT NULL,
                  p_limit                       INTEGER DEFAULT NULL,
                  p_gruppi                      TEXT[] DEFAULT NULL
              )
               RETURNS SETOF vendite.attivita_fatturabili
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: seleziona (e opzionalmente blocca) le attivita' fatturabili
              --        eleggibili di un perimetro, marcandole stato_esecuzione=PENDING.
              -- rev 2026-06-19: FOR UPDATE OF a (lock ristretto ad attivita_fatturabili).
              -- rev 2026-07-27 (brief emissione mirata A4): p_gruppi restringe la
              --        selezione ai GRUPPI FATTURABILI richiesti. E' il secondo e
              --        decisivo punto di applicazione del perimetro mirato: qui si
              --        filtrano le AF GIA' ESISTENTI, che il filtro sul pull
              --        (fn_emit_attivita_fatturabili_da_commessa) non puo' vedere.
              DECLARE
                  v_competenza DATE;
                  v_data_fatturazione DATE;
                  v_where TEXT;
                  v_join TEXT;
                  v_limit TEXT;
                  v_sql TEXT;
              BEGIN
                  IF p_competenza_mese IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_competenza_mese', 'valore', NULL), NULL::uuid, 'p_competenza_mese obbligatoria');
                  END IF;
                  IF p_tipo_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', NULL), NULL::uuid, 'p_tipo_doc_fiscale_id obbligatorio');
                  END IF;
                  IF p_lock AND p_lock_batch_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lock_batch_id', 'valore', NULL), NULL::uuid, 'p_lock_batch_id obbligatorio quando p_lock=true');
                  END IF;

                  v_competenza := date_trunc('month', p_competenza_mese)::DATE;
                  v_data_fatturazione := COALESCE(p_data_fatturazione, CURRENT_DATE);

                  v_where := ' WHERE a.approvato IS TRUE AND a.fatturato IS FALSE AND a.sospesa IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE'
                      || ' AND (a.posticipa_al IS NULL OR a.posticipa_al <= ' || quote_literal(v_data_fatturazione) || ')'
                      || ' AND a.competenza_mese <= ' || quote_literal(v_competenza)
                      || ' AND a.tipo_doc_fiscale_id = ' || quote_literal(p_tipo_doc_fiscale_id);

                  IF p_billing_account_id IS NOT NULL THEN v_where := v_where || ' AND a.billing_account_id = ' || quote_literal(p_billing_account_id); END IF;
                  IF p_utility_id IS NOT NULL THEN v_where := v_where || ' AND ba.utility_id = ' || quote_literal(p_utility_id); END IF;
                  IF p_valuta_id IS NOT NULL THEN v_where := v_where || ' AND a.valuta_id = ' || quote_literal(p_valuta_id); END IF;
                  IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                      v_where := v_where || ' AND a.billing_account_id IS NOT NULL AND anagrafiche.fn_get_emittente_fiscale_id(a.billing_account_id) = ' || quote_literal(p_emittente_soggetto_ruolo_id);
                  END IF;
                  IF p_area_geografica_id IS NOT NULL THEN v_where := v_where || ' AND a.area_geografica_id = ' || quote_literal(p_area_geografica_id); END IF;

                  -- ============================================
                  -- EMISSIONE MIRATA (rev 2026-07-27): filtro per gruppo.
                  -- ============================================
                  -- Il join alla riga di commessa si aggiunge SOLO quando il
                  -- filtro e' attivo: senza p_gruppi la query resta identica a
                  -- prima, sia come forma sia come piano (garanzia G1).
                  -- commessa_attivita_id e' NOT NULL su attivita_fatturabili,
                  -- quindi l'INNER JOIN non perde righe.
                  -- L'array entra come letterale quotato + cast, coerente con
                  -- gli altri parametri iniettati sopra.
                  v_join := '';
                  IF p_gruppi IS NOT NULL THEN
                      v_join := ' JOIN vendite.commesse_attivita ca ON ca.id = a.commessa_attivita_id';
                      v_where := v_where
                          || ' AND vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) = ANY ('
                          || quote_literal(p_gruppi::text) || '::text[])';
                  END IF;

                  v_limit := CASE WHEN p_limit IS NOT NULL THEN ' LIMIT ' || p_limit::TEXT ELSE '' END;

                  IF p_lock THEN
                      -- ⚠️ FOR UPDATE OF a: il lock resta ristretto ad
                      -- attivita_fatturabili anche in presenza del join. Non
                      -- estenderlo a ca: serializzerebbe la fatturazione con le
                      -- operazioni di commessa.
                      v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_join || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ' FOR UPDATE OF a SKIP LOCKED) UPDATE vendite.attivita_fatturabili a SET lock_in_fatturazione = true, lock_batch_id = ' || quote_literal(p_lock_batch_id) || ', stato_esecuzione = ''PENDING'', data_update = now(), user_update = current_user FROM candidati c WHERE a.id = c.id AND a.fatturato IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE RETURNING a.*';
                  ELSE
                      v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_join || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ') SELECT a.* FROM vendite.attivita_fatturabili a JOIN candidati c ON c.id = a.id ORDER BY a.data_attivita, a.id';
                  END IF;

                  RETURN QUERY EXECUTE v_sql;
              END;
              $function$;
