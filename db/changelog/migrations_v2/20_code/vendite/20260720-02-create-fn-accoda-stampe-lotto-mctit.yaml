# brief-db-processi-fatturazione-cockpit §4 (G1) — accodatore stampa lotto.
#
# Rende il task pipeline stampa_documenti_lotto un one-liner (D-7: adattatore
# stupido): SELECT vendite.fn_accoda_stampe_lotto(<lotto_id>). Accoda un
# work-item PENDING per ogni fattura NON esclusa del lotto. Idempotente:
# l'indice unico parziale uq_fatture_stampa_coda_vivo assorbe i doppioni
# (ON CONFLICT DO NOTHING) -> un secondo accodamento sullo stesso lotto non
# duplica i work-item vivi. Il backstop numerazione e il render vivono nel
# worker (brief BE), non qui.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260720-02-create-fn-accoda-stampe-lotto-mctit.yaml

  - changeSet:
      id: 20260720-02-create-fn-accoda-stampe-lotto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_accoda_stampe_lotto: accoda in vendite.fatture_stampa_coda un
        work-item PENDING per fattura non esclusa del lotto (idempotente via
        indice unico parziale). Ritorna il numero di righe accodate.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: vendite, tableName: fatture_stampa_coda }
            - tableExists:
                { schemaName: vendite, tableName: fatturazione_lotti_fatture }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_accoda_stampe_lotto(
              p_lotto_id vendite.fatturazione_lotti.id%TYPE)
               RETURNS integer
               LANGUAGE plpgsql
               VOLATILE
              AS $function$
              DECLARE
                  v_sorgente_tipo_id config.sorgenti.id%TYPE;
                  v_accodate         integer := 0;
              BEGIN
                  -- Scopo: accoda un work-item di stampa PENDING per ogni fattura
                  --   NON esclusa del lotto; delega numerazione+render al worker.
                  --   Idempotente: l'indice unico parziale scarta i doppioni vivi.

                  -- Guard parametro ID: no NULL, no <= 0 (non normalizzare).
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_accoda_stampe_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  -- Tipo sorgente FATTURA risolto da config (no hardcode dell'id).
                  SELECT s.id INTO v_sorgente_tipo_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'FATTURA';

                  IF v_sorgente_tipo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_accoda_stampe_lotto', 'E_VALORE_MANCANTE',
                          jsonb_build_object('sorgente', 'FATTURA'),
                          NULL::uuid, 'config.sorgenti FATTURA assente');
                  END IF;

                  -- Accoda le fatture del lotto (escluse le esclusa=true).
                  -- sorgente_uid = id::text (key_selector FATTURA).
                  INSERT INTO vendite.fatture_stampa_coda
                      (sorgente_tipo_id, sorgente_id, sorgente_uid, lotto_id)
                  SELECT v_sorgente_tipo_id, f.id, f.id::text, p_lotto_id
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND lf.esclusa IS NOT TRUE
                  ON CONFLICT (sorgente_tipo_id, sorgente_id)
                     WHERE stato IN ('PENDING', 'IN_CORSO')
                     DO NOTHING;

                  GET DIAGNOSTICS v_accodate = ROW_COUNT;
                  RETURN v_accodate;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_accoda_stampe_lotto(bigint) IS
                  'Accoda in vendite.fatture_stampa_coda un work-item PENDING per ogni fattura non esclusa del lotto (sorgente FATTURA, sorgente_uid=id::text). Idempotente via indice unico parziale uq_fatture_stampa_coda_vivo (ON CONFLICT DO NOTHING). Ritorna il numero di righe effettivamente accodate. Chiamata dal task pipeline stampa_documenti_lotto; numerazione (backstop) e render vivono nel worker drainer. Brief: brief-db-processi-fatturazione-cockpit §4.';
