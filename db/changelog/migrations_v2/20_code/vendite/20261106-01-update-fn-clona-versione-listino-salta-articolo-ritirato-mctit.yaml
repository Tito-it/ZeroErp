# LA COPIA DI UN LISTINO SALTA L'ARTICOLO RITIRATO: vendite.fn_clona_versione_listino
#   Brief: brief-db-articoli-obsoleto-dal §7.3 lotto C (O-6 di Tid, 2026-11-04).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   O-2: una versione nuova di listino e' un impegno nuovo a vendere, quindi
#   l'articolo ritirato non si ricopia. O-6: la riga si SALTA e la copia non si
#   ferma. Senza questo, la copia urterebbe il guard di riga (motivo
#   E_ARTICOLO_OBSOLETO, lotto A) e quello dei kit (20261106-02) e fallirebbe
#   per intero.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · le righe il cui articolo e' ritirato alla data operativa non si copiano;
#   · nemmeno i componenti e i kit di quell'articolo (articolo_padre_id);
#   · il predicato e' il BB script.fn_e_obsoleto, lo stesso del guard e del
#     picker: la copia scrive solo cio' che il guard accetta;
#   · + righe_saltate in CODA al RETURNS TABLE, accanto a componenti_saltati:
#     chi copia sa che qualcosa non e' passato. componenti_saltati conta anche
#     quelli dell'articolo ritirato (era gia' «sorgente meno copiati»).
#   ⚠️ RETURNS TABLE cambia: DROP + CREATE, poi REVOKE, GRANT e COMMENT di
#   nuovo. Nessun oggetto dipende dalla funzione (pg_depend, 2026-11-06).
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   Firma, controlli, versione nuova, periodicita', intersezione dei periodi
#   dei componenti. Corpo dal vivo di dbdev (= 20261031-38, confrontato il
#   2026-11-06). Dichiarazioni dal 20261031-38.
#   Chi legge il risultato (listini_repository.clone_versione: row_to_dict;
#   i pgTAP per nome di colonna) non si rompe con una colonna in coda.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261106-01-update-fn-clona-versione-listino-salta-articolo-ritirato-mctit.yaml

  - changeSet:
      id: 20261106-01-update-fn-clona-versione-listino-salta-articolo-ritirato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_clona_versione_listino: salta le righe, i componenti e i kit dell'articolo ritirato
        (script.fn_e_obsoleto); + righe_saltate in coda al risultato. brief-db-articoli-obsoleto-dal §7.3 (O-6).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_e_obsoleto';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_clona_versione_listino(bigint, character varying, date, date);

              CREATE FUNCTION vendite.fn_clona_versione_listino(
                  p_sorgente_id     vendite.listini_versioni.id%TYPE,
                  p_codice_versione vendite.listini_versioni.codice_versione%TYPE,
                  p_valido_dal      vendite.listini_versioni.valido_dal%TYPE,
                  p_valido_al       vendite.listini_versioni.valido_al%TYPE DEFAULT NULL)
               RETURNS TABLE(versione_id          vendite.listini_versioni.id%TYPE,
                             -- CONTEGGI delle righe copiate e saltate.
                             righe_copiate        integer,
                             componenti_copiati   integer,
                             componenti_saltati   integer,
                             righe_saltate        integer)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_listino_id vendite.listini_versioni.listino_id%TYPE;
                  v_tx_id      vendite.listini_versioni.tx_id%TYPE;
                  v_nuova_id   vendite.listini_versioni.id%TYPE;
                  -- CONTEGGI delle righe copiate e dei componenti della sorgente.
                  v_righe      integer;
                  v_righe_sorg integer;
                  v_componenti integer;
                  v_comp_sorg  integer;
              BEGIN
                  -- ==========================================================
                  -- Scopo: copiare una versione di listino, con le sue righe
                  --   e i suoi componenti attivi, in una versione nuova in
                  --   BOZZA dello stesso listino, in una transazione.
                  --   Vedi l'intestazione del changeSet 20261029-04.
                  -- ==========================================================

                  -- 1. Parametri e sorgente, nel perimetro (RLS).
                  IF p_sorgente_id IS NULL OR p_sorgente_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_sorgente_id', p_sorgente_id),
                          NULL::uuid, 'vendite.fn_clona_versione_listino',
                          'p_sorgente_id (obbligatorio, maggiore di zero)');
                  END IF;
                  IF NULLIF(btrim(p_codice_versione), '') IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_codice_versione', p_codice_versione),
                          NULL::uuid, 'vendite.fn_clona_versione_listino',
                          'p_codice_versione (obbligatorio, non vuoto)');
                  END IF;
                  IF p_valido_dal IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_valido_dal', p_valido_dal),
                          NULL::uuid, 'vendite.fn_clona_versione_listino',
                          'p_valido_dal (obbligatorio)');
                  END IF;

                  SELECT lv.listino_id, lv.tx_id
                    INTO v_listino_id, v_tx_id
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = p_sorgente_id
                     FOR KEY SHARE OF lv;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_sorgente_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Prima cio' che vieta, prima di scrivere.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_clona_versione_listino',
                      script.fn_check_versione_listino_clonabile(p_sorgente_id, p_valido_dal),
                      'valido_dal',
                      v_tx_id,
                      jsonb_build_object('sorgente_id', p_sorgente_id,
                                         'listino_id', v_listino_id,
                                         'valido_dal', p_valido_dal));

                  -- 3. La versione nuova: lo stato dal guard della nascita.
                  INSERT INTO vendite.listini_versioni (listino_id, codice_versione, valido_dal, valido_al)
                  VALUES (v_listino_id, p_codice_versione, p_valido_dal, p_valido_al)
                  RETURNING id INTO v_nuova_id;

                  -- 4. Le righe attive.
                  -- rev 2026-10-31 (20261031-38): con la periodicita', che il clone perdeva.
                  -- rev 2026-11-06 (20261106-01, O-6): l'articolo ritirato si salta, con
                  --   lo stesso BB del guard di riga: la copia scrive solo cio' che passa.
                  SELECT count(*) INTO v_righe_sorg
                    FROM vendite.listini_righe r
                   WHERE r.listino_versione_id = p_sorgente_id
                     AND r.attivo IS TRUE;

                  INSERT INTO vendite.listini_righe (listino_versione_id, articolo_id, uom_id,
                                                     prezzo, periodicita, meta, attivo)
                  SELECT v_nuova_id, r.articolo_id, r.uom_id, r.prezzo, r.periodicita, r.meta, TRUE
                    FROM vendite.listini_righe r
                    JOIN catalogo.articoli a ON a.id = r.articolo_id
                   WHERE r.listino_versione_id = p_sorgente_id
                     AND r.attivo IS TRUE
                     AND NOT script.fn_e_obsoleto(a.obsoleto_dal);
                  GET DIAGNOSTICS v_righe = ROW_COUNT;

                  -- 5. I componenti attivi, nel periodo comune alla riga di
                  --    distinta e alla versione nuova; gli altri si saltano.
                  --    Si saltano anche quelli dell'articolo ritirato (O-6).
                  SELECT count(*) INTO v_comp_sorg
                    FROM vendite.listini_righe_componenti c
                   WHERE c.listino_versione_id = p_sorgente_id
                     AND c.attivo IS TRUE;

                  INSERT INTO vendite.listini_righe_componenti (
                         listino_versione_id, articolo_componente_id, articolo_padre_id,
                         articolo_figlio_id, prezzo, iva_id, valido_dal, valido_al, attivo)
                  SELECT v_nuova_id, c.articolo_componente_id, c.articolo_padre_id,
                         c.articolo_figlio_id, c.prezzo, c.iva_id,
                         GREATEST(ac.valido_dal, p_valido_dal),
                         -- LEAST ignora i NULL: NULL solo se aperte entrambe.
                         LEAST(ac.valido_al, p_valido_al),
                         TRUE
                    FROM vendite.listini_righe_componenti c
                    JOIN catalogo.articoli_componenti ac ON ac.id = c.articolo_componente_id
                    JOIN catalogo.articoli ap ON ap.id = c.articolo_padre_id
                   WHERE c.listino_versione_id = p_sorgente_id
                     AND c.attivo IS TRUE
                     AND NOT script.fn_e_obsoleto(ap.obsoleto_dal)
                     AND GREATEST(ac.valido_dal, p_valido_dal)
                         <= LEAST(COALESCE(ac.valido_al, 'infinity'::date),
                                  COALESCE(p_valido_al,  'infinity'::date));
                  GET DIAGNOSTICS v_componenti = ROW_COUNT;

                  -- 6. rev 2026-10-31 (20261031-38, D-2-bis): i kit, con la loro periodicita'.
                  --    rev 2026-11-06 (O-6): non quelli dell'articolo ritirato.
                  INSERT INTO vendite.listini_kit (listino_versione_id, articolo_padre_id, periodicita, meta)
                  SELECT v_nuova_id, k.articolo_padre_id, k.periodicita, k.meta
                    FROM vendite.listini_kit k
                    JOIN catalogo.articoli ap ON ap.id = k.articolo_padre_id
                   WHERE k.listino_versione_id = p_sorgente_id
                     AND NOT script.fn_e_obsoleto(ap.obsoleto_dal);

                  RETURN QUERY SELECT v_nuova_id, v_righe, v_componenti, v_comp_sorg - v_componenti,
                                      v_righe_sorg - v_righe;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              REVOKE EXECUTE ON FUNCTION vendite.fn_clona_versione_listino(bigint, character varying, date, date) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION vendite.fn_clona_versione_listino(bigint, character varying, date, date) TO zeroerp_app;

              COMMENT ON FUNCTION vendite.fn_clona_versione_listino(bigint, character varying, date, date) IS
                'VERBO «Clona» di una versione di listino, in una transazione: la sorgente nel perimetro, da qualunque stato (SECURITY INVOKER, la RLS delle tabelle del listino; FOR KEY SHARE; non trovata E_VENDITE_LISTINO_VERSIONE_NOT_FOUND); prima cio'' che vieta, sul campo valido_dal (il primo motivo di script.fn_check_versione_listino_clonabile: E_LISTINO_VERSIONE_CLONE_PRIMA_DELLA_SORGENTE, decisione D2); poi la versione nuova dello stesso listino (codice, decorrenza e fine dai parametri; nasce BOZZA, attivo e meta dai default), le righe attive della sorgente (articolo, uom, prezzo, meta) e i componenti attivi con la validita'' ricalcolata come intersezione fra la riga di distinta e la versione nuova. Si saltano i componenti senza intersezione. Ritorna la versione nuova, righe e componenti copiati, componenti saltati. Prende il posto di listini_repository.clone_versione e della regola D2 del service. Il permesso d''area resta al backend. EXECUTE solo all''applicazione. Brief: brief-modello-documento-vendita §16.14 (C-1 = a, Tid 2026-10-29). rev 2026-10-31 (20261031-38): copia la periodicita'' delle righe e i kit. ⭐ rev 2026-11-06 (20261106-01, brief-db-articoli-obsoleto-dal O-6): l''articolo ritirato alla data operativa (script.fn_e_obsoleto, lo stesso BB del guard di riga e del picker) non si ricopia: si saltano la sua riga, i suoi componenti e i suoi kit, e la copia non si ferma (O-2: una versione nuova e'' un impegno nuovo a vendere). + righe_saltate in coda al risultato; componenti_saltati conta anche i componenti dell''articolo ritirato. RETURNS TABLE cambiato: DROP + CREATE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
