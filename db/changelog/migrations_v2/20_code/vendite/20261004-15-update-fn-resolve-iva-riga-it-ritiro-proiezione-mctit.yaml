# IL RISOLUTORE IVA NON PROIETTA PIU' LA SPEZZATURA SUL RESIDUO
#   vendite.fn_resolve_iva_riga_it
#   Brief: brief-db-bom-flag-quantita-e-kit-in-fattura §15.4, R-DB-C10
#   (decisione di Tid del 2026-10-04: orfano -> si ritira).
#
# ── IL DIFETTO ─────────────────────────────────────────────────────────
#
#   Con un importo (p_imponibile valorizzato e p_consumo = false) la funzione
#   PROIETTAVA la spezzatura sul residuo del titolo. Dal giro C del BE nessuno
#   la chiede piu': il plafond in fattura usa la domanda di consumo, e
#   documenti ed endpoint di anteprima passano NULL (brief §15.3). Un ramo
#   senza chiamanti che da' una risposta che la madre del consumo sul netto
#   smentirebbe e' una trappola per il prossimo chiamante.
#
# ── LA REGOLA ──────────────────────────────────────────────────────────
#
#   Si toglie il RAMO, non il parametro: la firma non si riordina (Tid,
#   2026-10-04). p_imponibile valorizzato SOLLEVA E_IVA_RESOLVE_NON_INVOCABILE,
#   con qualunque p_consumo: accettarlo e ignorarlo farebbe credere al
#   chiamante di aver avuto una proiezione. Il guard nuovo assorbe i due di
#   prima (consumo con importo, importo negativo). La colonna quota resta nel
#   RETURNS TABLE ed esce sempre NULL. Anteprima e consumo: invariati.
#
#   Il guscio vendite.fn_resolve_iva_riga non si tocca: inoltra p_imponibile
#   senza logica sua.
#
#   Firma e RETURNS TABLE invariati (quelli del -03, coi %TYPE): CREATE OR
#   REPLACE. Origine del corpo: doc auto-gen (corpo vivo = 20261004-03,
#   verificato uguale), con sostituzioni mirate: guard, ripartizione,
#   intestazione e COMMENT.
#
# Messaggio: messaggi_errore.csv, E_IVA_RESOLVE_NON_INVOCABILE diceva
#   «invocata senza %s», falso per un parametro valorizzato che non va
#   passato; ora «con un parametro assente o non valido: %s».
# Presidio: vendite/test-fn-resolve-iva-riga.sql (12-13 riscritti: la
#   proiezione rifiutata, l'anteprima a tetto con una riga sola).

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261004-15-update-fn-resolve-iva-riga-it-ritiro-proiezione-mctit.yaml

  - changeSet:
      id: 20261004-15-update-fn-resolve-iva-riga-it-ritiro-proiezione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_resolve_iva_riga_it: ritirato il ramo di proiezione sul residuo
        (p_imponibile valorizzato), senza chiamanti; il parametro resta nella firma e un
        valore qualunque solleva E_IVA_RESOLVE_NON_INVOCABILE. Brief:
        brief-db-bom-flag-quantita-e-kit-in-fattura §15.4 (R-DB-C10).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('vendite.fn_resolve_iva_riga_it(uuid, date, numeric, bigint, integer, uuid, bigint, boolean)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_resolve_iva_riga_it(
                  p_articolo_id          catalogo.articoli.id%TYPE,
                  p_data_riferimento     date,
                  p_imponibile           numeric                                  DEFAULT NULL,
                  p_billing_account_id   anagrafiche.billing_account.id%TYPE      DEFAULT NULL,
                  p_utility_id           config.utilities.id%TYPE                 DEFAULT NULL,
                  p_soggetto_id          anagrafiche.soggetti.id%TYPE             DEFAULT NULL,
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE    DEFAULT NULL,
                  -- ⭐ In CODA (2026-10-04, decisione C): la firma non si riordina.
                  p_consumo              boolean                                  DEFAULT false
              )
              RETURNS TABLE (
                  quota                 numeric,
                  iva_id                config.iva.id%TYPE,
                  aliquota              config.iva.aliquota_iva%TYPE,
                  natura_codice         config.iva_natura.codice%TYPE,
                  is_reverse_charge     config.iva_natura.is_reverse_charge%TYPE,
                  esigibilita           vendite.fatture_righe.esigibilita%TYPE,
                  split_payment         vendite.fatture_righe.split_payment%TYPE,
                  riferimento_normativo config.iva.descrizione%TYPE,
                  origine               varchar(16),
                  titolo_iva_id         anagrafiche.soggetti_titoli_iva.id%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: dire quale trattamento IVA si applica a UNA riga di
              --   documento, e in che proporzione, secondo la regola ITALIANA.
              --   Due stadi (D6/D7): A stabilisce l'aliquota che compete alla
              --   merce, B verifica se un titolo del soggetto la sostituisce SU
              --   QUESTA RIGA (D12).
              --   Perimetro: sola lettura. NON consuma il plafond (D14).
              --   Risultato: una riga nell'anteprima; DUE nella domanda di consumo con
              --   un titolo a tetto, nell'ordine «prima il titolo, poi l'ordinario» — e
              --   l'ordine e' il contratto.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I2.
              -- ⭐ rev 2026-10-04 (decisione C, brief-db-bom-flag-quantita-e-kit-in-
              --   fattura §13): p_consumo, IN CODA alla firma, apre la domanda del giro
              --   del plafond in fattura — QUALE titolo vale e quali sono i due
              --   trattamenti, senza proiezione sul residuo. Con un titolo a tetto escono
              --   DUE righe sempre, prima il titolo e poi l'ordinario, quota NULL: quanto
              --   copre il titolo lo decide anagrafiche.fn_consuma_plafond_titolo_iva_righe
              --   sul NETTO della fattura. Senza p_consumo (default false) tutto come
              --   prima: anteprima con p_imponibile NULL, proiezione con l'importo.
              -- ⛔ rev 2026-10-04 bis (R-DB-C10, brief-db-bom-flag-quantita-e-kit-in-
              --   fattura §15.4; decisione di Tid: orfano -> si ritira): la PROIEZIONE sul
              --   residuo (p_imponibile valorizzato) e' RITIRATA. Dal passaggio del BE al
              --   consumo nessuno la chiede piu', e dava una spezzatura che la madre del
              --   consumo sul netto avrebbe smentito. p_imponibile RESTA nella firma (non
              --   si riordina) e un valore qualunque SOLLEVA: un chiamante che credesse
              --   di chiedere una proiezione non deve ricevere in silenzio l'anteprima.
              --   La colonna quota resta nel RETURNS TABLE, ed esce sempre NULL.
              -- ⚠️ La data e' un PARAMETRO: mai CURRENT_DATE (D14).
              -- ⛔ Il congelamento oltre la DEFINITIVA (D15) NON si controlla
              --   qui: e' una proprieta' del documento, ed e' contratto dei
              --   chiamanti.
              DECLARE
                  v_art_iva        catalogo.articoli.iva_id%TYPE;
                  v_art_gruppo     catalogo.articoli.gruppo_voce_id%TYPE;
                  v_art_tipo       catalogo.articoli.tipo_voce_id%TYPE;
                  v_art_trovato    boolean := false;
                  v_tipo_utenza_id config.tipi_utenze.id%TYPE;
                  v_iva_ord        config.iva.id%TYPE;
                  v_origine_ord    varchar(16);
                  v_stato_emitt    anagrafiche.soggetti.stato_id%TYPE;
                  v_split_sogg     anagrafiche.soggetti.split_payment%TYPE;
                  -- ⚠️ Scalari e non un `record`: PostgreSQL non ammette di
                  --   mescolare uno scalare (il conteggio dei pari) e un record
                  --   nella stessa INTO — «v_titolo non e' una variabile scalare».
                  v_tit_id         anagrafiche.soggetti_titoli_iva.id%TYPE;
                  v_tit_iva        config.iva.id%TYPE;
                  v_tit_plafond    anagrafiche.soggetti_titoli_iva.plafond%TYPE;
                  v_tit_usato      anagrafiche.soggetti_titoli_iva.imponibile_utilizzato%TYPE;
                  v_tit_ha_plaf    config.tipi_titolo_iva.ha_plafond%TYPE;
                  v_n_pari         bigint;
                  v_residuo        anagrafiche.soggetti_titoli_iva.plafond%TYPE;
                  -- la ripartizione: al massimo due parti
                  v_q1             numeric;
                  v_iva1           config.iva.id%TYPE;
                  v_org1           varchar(16);
                  v_tit1           anagrafiche.soggetti_titoli_iva.id%TYPE;
                  v_q2             numeric;
                  v_iva2           config.iva.id%TYPE;
                  v_org2           varchar(16);
                  v_due_parti      boolean := false;
                  -- il contorno del composito: le PARTI della regola di esigibilita'
                  --   (rev 2026-10-01). La coppia esigibilita/split non e' piu' uguale
                  --   su tutte le parti: dipende anche dalla natura di ciascuna.
                  v_per_cassa      config.regimi_fiscali.iva_per_cassa%TYPE;
                  v_piva_sogg      anagrafiche.soggetti.partita_iva%TYPE;
              BEGIN
                  -- ══ GUARD DI INVOCAZIONE ═══════════════════════════════════
                  -- ⚠️ TECNICI: non li produce una persona che compila un form,
                  --   li produce un chiamante rotto. Il messaggio nomina il
                  --   PARAMETRO, ed e' il solo caso in cui farlo e' giusto.
                  IF p_articolo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'articolo_id'), NULL::uuid, 'articolo_id');
                  END IF;
                  IF p_data_riferimento IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'data_riferimento'), NULL::uuid, 'data_riferimento');
                  END IF;
                  -- ⚠️ NULL non e' «anteprima»: e' un chiamante che non ha detto quale
                  --   domanda fa.
                  IF p_consumo IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'consumo'), NULL::uuid, 'consumo');
                  END IF;
                  -- ⛔ rev 2026-10-04 bis (R-DB-C10): nessuna domanda prende piu' un
                  --   importo. La proiezione sul residuo e' ritirata, e il consumo non l'ha
                  --   mai preso (quanto copre il titolo lo decide la madre sul netto).
                  --   ⚠️ Si RIFIUTA invece di ignorarlo: un importo accettato e non usato
                  --   farebbe credere al chiamante di aver avuto una spezzatura.
                  --   Assorbe i due guard di prima (consumo con importo, importo negativo).
                  IF p_imponibile IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'imponibile', 'valore', p_imponibile,
                                             'consumo', p_consumo),
                          NULL::uuid, 'imponibile');
                  END IF;

                  -- ══ STADIO A — QUALE ALIQUOTA COMPETE ALLA MERCE ═══════════
                  SELECT a.iva_id, a.gruppo_voce_id, a.tipo_voce_id, true
                    INTO v_art_iva, v_art_gruppo, v_art_tipo, v_art_trovato
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id;

                  -- ⚠️ SELECT INTO senza righe azzera le variabili e prosegue:
                  --   senza questo guard un articolo inesistente darebbe
                  --   «nessuna aliquota» invece di dire che la chiamata e' rotta.
                  IF NOT COALESCE(v_art_trovato, false) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'articolo_id', 'valore', p_articolo_id),
                          NULL::uuid, 'articolo_id');
                  END IF;

                  v_iva_ord     := v_art_iva;          -- A1: l'articolo
                  v_origine_ord := 'ARTICOLO';

                  -- A2: l'uso della fornitura, SOLO dove l'articolo tace (D17).
                  IF v_iva_ord IS NULL THEN
                      v_tipo_utenza_id := vendite.fn_get_tipo_utenza_fornitura(
                                              p_billing_account_id, p_utility_id, p_data_riferimento);
                      IF v_tipo_utenza_id IS NOT NULL THEN
                          SELECT tu.iva_id INTO v_iva_ord
                            FROM config.tipi_utenze tu WHERE tu.id = v_tipo_utenza_id;
                          IF v_iva_ord IS NOT NULL THEN
                              v_origine_ord := 'TIPO_UTENZA';
                          END IF;
                      END IF;
                  END IF;

                  -- ⭐ «Non lo so» si DICE, non si tace: chi legge deve poter
                  --   distinguere un'aliquota assente da una non cercata.
                  IF v_iva_ord IS NULL THEN
                      v_origine_ord := 'ASSENTE';
                  END IF;

                  -- ══ IL CONTORNO DEL COMPOSITO ══════════════════════════════
                  -- Lo stato dell'emittente serve all'override di aliquota per
                  -- stato; split e esigibilita' vengono dal SOGGETTO (D8) e, dal
                  -- 2026-10-01, anche dal REGIME dell'emittente (IVA per cassa).
                  IF p_emittente_fiscale_id IS NOT NULL THEN
                      SELECT s.stato_id INTO v_stato_emitt
                        FROM anagrafiche.emittenti_fiscali ef
                        JOIN anagrafiche.soggetti_ruoli sr ON sr.id = ef.soggetto_ruolo_id
                        JOIN anagrafiche.soggetti s        ON s.id  = sr.soggetto_id
                       WHERE ef.id = p_emittente_fiscale_id;

                      -- ⚠️ Una query sua e non un JOIN in quella sopra: un emittente
                      --   senza soggetto risolto non deve perdere il regime, e
                      --   viceversa.
                      SELECT rf.iva_per_cassa INTO v_per_cassa
                        FROM anagrafiche.emittenti_fiscali ef
                        JOIN config.regimi_fiscali rf ON rf.codice_interno = ef.regime_fiscale_rf
                       WHERE ef.id = p_emittente_fiscale_id;
                  END IF;

                  IF p_soggetto_id IS NOT NULL THEN
                      SELECT s.split_payment, s.partita_iva INTO v_split_sogg, v_piva_sogg
                        FROM anagrafiche.soggetti s WHERE s.id = p_soggetto_id;
                  END IF;

                  -- ⚠️ TRASPORTATI, NON USATI: la scissione dei pagamenti non
                  --   cambia l'aliquota, cambia CHI VERSA l'imposta (D4). Non
                  --   entra nella scelta del codice, ma esce nel composito
                  --   perche' chi costruisce la riga di fattura ha bisogno di un
                  --   oggetto solo (D18).
                  -- ⭐ rev 2026-10-01: la coppia esigibilita/split non si calcola
                  --   piu' qui. La regola e' UNA, script.fn_esigibilita_iva, la
                  --   stessa del trigger di riga della fattura: prima erano due
                  --   copie che coincidevano solo perche' guardavano il solo
                  --   cliente. Si chiama PER PARTE nel RETURN QUERY, perche' con
                  --   l'IVA per cassa la risposta dipende dalla natura del codice,
                  --   e le due parti di una riga spezzata dal plafond hanno codici
                  --   diversi (brief esigibilita-iva-per-cassa, sezione 8.5).
                  -- ⛔ La disciplina D32 resta, e ora vive nella regola: senza il
                  --   soggetto la coppia esce NULL/NULL, «non lo so», non
                  --   «immediata, non scissa». Senza emittente il regime non e'
                  --   noto: fuori dalla scissione l'esigibilita' esce NULL.

                  -- ══ STADIO B — UN TITOLO CHE LA SOSTITUISCE, SU QUESTA RIGA ═
                  IF p_soggetto_id IS NOT NULL AND p_emittente_fiscale_id IS NOT NULL THEN
                      WITH candidati AS (
                          SELECT t.id, t.iva_id, t.plafond, t.imponibile_utilizzato, tt.ha_plafond,
                                 MAX(CASE
                                       WHEN t.ambito  = 'TUTTO'    THEN 1
                                       WHEN a.livello = 'ARTICOLO' THEN 3
                                       ELSE 2   -- GRUPPO_VOCE e TIPO_VOCE: stessa banda (D13)
                                     END) AS specificita
                            FROM anagrafiche.soggetti_titoli_iva t
                            JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id
                            LEFT JOIN anagrafiche.soggetti_titoli_iva_ambiti a
                                   ON a.titolo_iva_id = t.id
                                  AND (   (a.livello = 'ARTICOLO'    AND a.articolo_id    = p_articolo_id)
                                       OR (a.livello = 'GRUPPO_VOCE' AND a.gruppo_voce_id = v_art_gruppo)
                                       OR (a.livello = 'TIPO_VOCE'   AND a.tipo_voce_id   = v_art_tipo))
                           WHERE t.soggetto_id          = p_soggetto_id
                             AND t.emittente_fiscale_id = p_emittente_fiscale_id
                             AND t.attivo               IS TRUE
                             AND t.validita            @> p_data_riferimento
                             AND tt.attivo              IS TRUE
                             AND (t.ambito = 'TUTTO' OR a.id IS NOT NULL)
                           GROUP BY t.id, t.iva_id, t.plafond, t.imponibile_utilizzato, tt.ha_plafond
                      ), vincitori AS (
                          SELECT c.* FROM candidati c
                           WHERE c.specificita = (SELECT MAX(c2.specificita) FROM candidati c2)
                      )
                      SELECT (SELECT count(*) FROM vincitori), v.id, v.iva_id,
                             v.plafond, v.imponibile_utilizzato, v.ha_plafond
                        INTO v_n_pari, v_tit_id, v_tit_iva,
                             v_tit_plafond, v_tit_usato, v_tit_ha_plaf
                        FROM vincitori v
                       -- ⚠️ ORDER BY prima del LIMIT: se i pari sono due si
                       --   solleva subito sotto, ma senza ordine il messaggio
                       --   nominerebbe un titolo diverso a ogni corsa.
                       ORDER BY v.id
                       LIMIT 1;

                      -- ⛔ D13: a parita' di specificita' non c'e' niente da
                      --   scegliere. Un'ambiguita' che si risolve sull'ordine
                      --   degli id e' un difetto del modello, non una scelta.
                      IF COALESCE(v_n_pari, 0) > 1 THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_TITOLI_AMBIGUI',
                              jsonb_build_object('articolo_id', p_articolo_id,
                                                 'soggetto_id', p_soggetto_id,
                                                 'emittente_fiscale_id', p_emittente_fiscale_id,
                                                 'titoli_in_pari', v_n_pari),
                              NULL::uuid, v_n_pari::text,
                              to_char(p_data_riferimento, 'DD/MM/YYYY'));
                      END IF;
                  END IF;

                  -- ══ LA RIPARTIZIONE ════════════════════════════════════════
                  IF v_tit_id IS NULL THEN
                      -- Nessun titolo: risponde lo stadio A.
                      v_q1 := NULL; v_iva1 := v_iva_ord; v_org1 := v_origine_ord; v_tit1 := NULL;

                  ELSIF v_tit_ha_plaf IS NOT TRUE THEN
                      -- Titolo senza tetto: sostituisce e basta.
                      v_q1 := NULL; v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;

                  ELSE
                      -- ⚠️ GREATEST(..., 0): un titolo gia' sfondato da una
                      --   forzatura ha residuo negativo. Sfondato vuol dire
                      --   capienza zero, non capienza al contrario.
                      v_residuo := GREATEST(v_tit_plafond - v_tit_usato, 0);

                      IF p_consumo THEN
                          -- ⭐ CONSUMO: il titolo e l'ordinario, sempre tutti e due e
                          --   senza guardare il residuo. Quanto copre il titolo lo sa
                          --   solo la madre del consumo, che prende il lock e conosce il
                          --   NETTO della fattura: una riga negativa restituisce capienza a
                          --   quelle prima, e una proiezione qui, riga per riga, non puo'
                          --   saperlo. E a residuo zero il titolo deve restare visibile:
                          --   e' la madre a dire che non copre piu' niente.
                          v_q1 := NULL; v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;
                          v_due_parti := true;
                          v_q2 := NULL; v_iva2 := v_iva_ord; v_org2 := v_origine_ord;
                      ELSE
                          -- ⭐ Anteprima senza importo: la spezzatura non e'
                          --   calcolabile e non si inventa. Si dice cosa vale sul
                          --   PRIMO euro, che e' cio' che serve a un form quando
                          --   l'operatore ha appena scelto l'articolo.
                          v_q1 := NULL;
                          IF v_residuo > 0 THEN
                              v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;
                          ELSE
                              v_iva1 := v_iva_ord; v_org1 := v_origine_ord; v_tit1 := NULL;
                          END IF;
                      END IF;
                  END IF;

                  -- ══ IL COMPOSITO (D18) ═════════════════════════════════════
                  -- ⚠️ Il CASE attorno a fn_get_aliquota_iva e' la guardia che
                  --   §R-3 ha insegnato: quella funzione SOLLEVA su un id nullo,
                  --   e un COALESCE non farebbe in tempo a difendere. Le viste
                  --   sorelle ce l'hanno gia'.
                  -- ⚠️ `descrizione` come riferimento normativo e' D24: non c'e'
                  --   una colonna sua perche' config.iva e' gia' piu' fine della
                  --   natura — EC, VG e VF condividono natura 10 e differiscono
                  --   solo per l'articolo citato.
                  RETURN QUERY
                  WITH parti(ord, q, iva, org, tit) AS (
                      VALUES (1, v_q1, v_iva1, v_org1, v_tit1),
                             (2, v_q2, v_iva2, v_org2, NULL::bigint)
                  )
                  SELECT p.q,
                         p.iva,
                         CASE WHEN p.iva IS NOT NULL
                              THEN config.fn_get_aliquota_iva(p.iva, v_stato_emitt) END,
                         n.codice,
                         n.is_reverse_charge,
                         e.esigibilita,
                         e.split_payment,
                         i.descrizione,
                         p.org,
                         p.tit
                    FROM parti p
                    LEFT JOIN config.iva i        ON i.id = p.iva
                    LEFT JOIN config.iva_natura n ON n.id = i.natura_iva_id
                    LEFT JOIN LATERAL script.fn_esigibilita_iva(
                               v_per_cassa, v_split_sogg, v_piva_sogg, p.iva) e ON true
                   WHERE p.ord = 1 OR v_due_parti
                   ORDER BY p.ord;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_resolve_iva_riga_it(p_articolo_id uuid, p_data_riferimento date, p_imponibile numeric, p_billing_account_id bigint, p_utility_id integer, p_soggetto_id uuid, p_emittente_fiscale_id bigint, p_consumo boolean)
              IS 'La logica ITALIANA del risolutore IVA di riga (I2 di brief-db-be-iva-risolutore-e-regime-cliente). Chi chiama passa dal guscio vendite.fn_resolve_iva_riga, che smista per paese (D21): qui c''e'' la regola italiana e basta, e il giorno che ne serve un''altra nasce una _xx accanto senza toccare il guscio. ⭐ DUE STADI che non competono (D6/D7): A stabilisce quale aliquota compete alla MERCE, B verifica se un TITOLO del soggetto la sostituisce — B non vince su A, sostituisce il risultato di A dopo che A ha risposto. STADIO A a due livelli: l''articolo, e l''uso della fornitura SOLO dove l''articolo tace (D17) — catalogo.articoli.iva_id e'' nullable, quindi l''articolo puo'' dichiarare di non avere un''opinione, mentre config.tipi_utenze.iva_id non ha modo di dire su quali merci vale e applicato per primo si prenderebbe ogni riga della fornitura, cauzioni comprese. ⛔ I bundle restano fuori (D16): l''aliquota accanto al prezzo esiste solo sui componenti, e la portano gia'' le *_righe_componenti del documento. STADIO B si valuta PER RIGA (D12), con specificita'' articolo > categoria > tutto e GRUPPO_VOCE/TIPO_VOCE nella stessa banda; a parita'' si solleva E_IVA_TITOLI_AMBIGUI invece di scegliere (D13). ⭐ RITORNA UN COMPOSITO (D18) e non un numerico: le operazioni non imponibili hanno tutte aliquota zero ma non sono la stessa cosa, e la fattura elettronica pretende che si dica QUALE zero — quindi accanto alla quota escono codice, aliquota, natura, inversione contabile, esigibilita'', split payment e riferimento normativo. ⚠️ esigibilita e split_payment sono TRASPORTATI e NON usati nella scelta del codice: e'' cio'' che tiene insieme D4 (la scissione non cambia l''aliquota, cambia chi versa) e D18 (chi costruisce la riga di fattura vuole un oggetto solo). ⚠️ Il riferimento normativo e'' config.iva.descrizione (D24): nessuna colonna nuova, perche'' config.iva e'' gia'' piu'' fine della natura — EC, VG e VF condividono natura 10 e differiscono solo per l''articolo citato, quindi il riferimento e'' l''identita'' della riga. ⭐ E RITORNA UNA RIPARTIZIONE: nella domanda di consumo, con un titolo a tetto, due righe, e l''ORDINE delle righe e'' il contratto — prima il titolo, poi l''ordinario. ⚠️ STABLE: NON consuma (D14); il consumo lo fa anagrafiche.fn_consuma_plafond_titolo_iva_righe all''emissione, sul netto della fattura, e per questo esce titolo_iva_id. ⚠️ La data e'' un parametro e mai CURRENT_DATE. ⛔ Il congelamento (D15) non si controlla qui: e'' una proprieta'' del documento, contratto dei chiamanti. ⚠️ Il CASE attorno a config.fn_get_aliquota_iva e'' la guardia che §R-3 ha insegnato: quella funzione solleva su un id nullo e un COALESCE non farebbe in tempo a difendere. ⚠️ SECURITY INVOKER (decisione di Tid): chi chiama deve avere un contesto che vede i titoli — l''applicazione passa l''emittente del documento, i ruoli batch hanno BYPASSRLS; un chiamante senza contesto legge zero titoli e ottiene l''aliquota ordinaria in silenzio, e qui il costo e'' un''imposta applicata dove non andava. ⛔ rev 2026-08-29 bis (D31): split_payment usciva NULL ogni volta che il soggetto non era noto, mentre esigibilita nello stesso composito usciva ''I'' - due risposte alla stessa domanda che dissentivano sulla stessa riga. Ora il flag e'' (v_split_sogg = ''S'') IS TRUE, cioe'' entrambe dicono «non scissa» quando il soggetto non e'' noto. Non si allinea verso il nullo perche'' fatture_righe.esigibilita non lo ammette. Trovato dal caso 6 di test-fn-resolve-iva-riga. ⛔ rev 2026-08-29 ter (D32): la revisione bis aveva allineato la coppia esigibilita/split VERSO IL VALORE, con una motivazione falsa - «esigibilita non ammette il nullo». vendite.fatture_righe.esigibilita e'' NULLABILE e non ha nemmeno un CHECK: quella frase non era stata letta dal catalogo. Il verso giusto e'' l''altro: senza il soggetto il regime di scissione non e'' stato determinato, e rispondere «immediata, non scissa» e'' un''AFFERMAZIONE su un documento che potrebbe essere verso una PA. Ora entrambi i campi escono NULL quando il soggetto non e'' noto - la stessa disciplina di origine = ''ASSENTE''. Sul percorso vero (I5) il soggetto c''e'' sempre. ⭐ rev 2026-10-01 (brief-db-esigibilita-iva-per-cassa-emittente, sezione 8.5): la coppia esigibilita/split_payment esce da script.fn_esigibilita_iva, la regola unica condivisa col trigger di riga della fattura, chiamata PER PARTE perche'' con l''IVA per cassa dipende anche dalla natura del codice (inversione contabile). Entrano il regime dell''emittente (config.regimi_fiscali.iva_per_cassa), scissione e partita IVA del soggetto. Senza soggetto: NULL/NULL; senza emittente, fuori dalla scissione: esigibilita NULL (regime non noto). ⭐ rev 2026-10-04 (decisione C, brief-db-bom-flag-quantita-e-kit-in-fattura §13): p_consumo, in CODA alla firma (default false = tutto come prima), apre la domanda del giro del plafond in fattura — con un titolo a tetto DUE righe sempre, prima il titolo e poi l''ordinario, quota NULL, senza leggere il residuo: quanto copre il titolo lo decide anagrafiche.fn_consuma_plafond_titolo_iva_righe sul NETTO della fattura, e una proiezione riga per riga sarebbe sbagliata per costruzione (una riga negativa restituisce capienza a quelle prima). A residuo zero il titolo resta nella risposta. Il consumo non prende un importo: p_consumo con p_imponibile valorizzato solleva E_IVA_RESOLVE_NON_INVOCABILE. ⛔ rev 2026-10-04 bis (R-DB-C10, brief-db-bom-flag-quantita-e-kit-in-fattura §15.4; decisione di Tid: orfano -> si ritira): la PROIEZIONE sul residuo (p_imponibile valorizzato) e'' RITIRATA, senza chiamanti dal passaggio del BE al consumo. p_imponibile resta nella firma, che non si riordina, e un valore qualunque solleva E_IVA_RESOLVE_NON_INVOCABILE: un importo accettato e non usato farebbe credere al chiamante di aver avuto una spezzatura. La colonna quota resta ed esce sempre NULL.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_resolve_iva_riga_it(
                  p_articolo_id          catalogo.articoli.id%TYPE,
                  p_data_riferimento     date,
                  p_imponibile           numeric                                  DEFAULT NULL,
                  p_billing_account_id   anagrafiche.billing_account.id%TYPE      DEFAULT NULL,
                  p_utility_id           config.utilities.id%TYPE                 DEFAULT NULL,
                  p_soggetto_id          anagrafiche.soggetti.id%TYPE             DEFAULT NULL,
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE    DEFAULT NULL,
                  -- ⭐ In CODA (2026-10-04, decisione C): la firma non si riordina.
                  p_consumo              boolean                                  DEFAULT false
              )
              RETURNS TABLE (
                  quota                 numeric,
                  iva_id                config.iva.id%TYPE,
                  aliquota              config.iva.aliquota_iva%TYPE,
                  natura_codice         config.iva_natura.codice%TYPE,
                  is_reverse_charge     config.iva_natura.is_reverse_charge%TYPE,
                  esigibilita           vendite.fatture_righe.esigibilita%TYPE,
                  split_payment         vendite.fatture_righe.split_payment%TYPE,
                  riferimento_normativo config.iva.descrizione%TYPE,
                  origine               varchar(16),
                  titolo_iva_id         anagrafiche.soggetti_titoli_iva.id%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: dire quale trattamento IVA si applica a UNA riga di
              --   documento, e in che proporzione, secondo la regola ITALIANA.
              --   Due stadi (D6/D7): A stabilisce l'aliquota che compete alla
              --   merce, B verifica se un titolo del soggetto la sostituisce SU
              --   QUESTA RIGA (D12).
              --   Perimetro: sola lettura. NON consuma il plafond — la
              --   ripartizione e' una proiezione sul residuo (D14).
              --   Risultato: una riga nel caso ordinario, DUE quando il plafond
              --   finisce a meta' riga (P2), nell'ordine «prima la quota coperta
              --   dal titolo, poi il resto» — e l'ordine e' il contratto.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I2.
              -- ⭐ rev 2026-10-04 (decisione C, brief-db-bom-flag-quantita-e-kit-in-
              --   fattura §13): p_consumo, IN CODA alla firma, apre la domanda del giro
              --   del plafond in fattura — QUALE titolo vale e quali sono i due
              --   trattamenti, senza proiezione sul residuo. Con un titolo a tetto escono
              --   DUE righe sempre, prima il titolo e poi l'ordinario, quota NULL: quanto
              --   copre il titolo lo decide anagrafiche.fn_consuma_plafond_titolo_iva_righe
              --   sul NETTO della fattura. Senza p_consumo (default false) tutto come
              --   prima: anteprima con p_imponibile NULL, proiezione con l'importo.
              -- ⚠️ La data e' un PARAMETRO: mai CURRENT_DATE (D14).
              -- ⛔ Il congelamento oltre la DEFINITIVA (D15) NON si controlla
              --   qui: e' una proprieta' del documento, ed e' contratto dei
              --   chiamanti.
              DECLARE
                  v_art_iva        catalogo.articoli.iva_id%TYPE;
                  v_art_gruppo     catalogo.articoli.gruppo_voce_id%TYPE;
                  v_art_tipo       catalogo.articoli.tipo_voce_id%TYPE;
                  v_art_trovato    boolean := false;
                  v_tipo_utenza_id config.tipi_utenze.id%TYPE;
                  v_iva_ord        config.iva.id%TYPE;
                  v_origine_ord    varchar(16);
                  v_stato_emitt    anagrafiche.soggetti.stato_id%TYPE;
                  v_split_sogg     anagrafiche.soggetti.split_payment%TYPE;
                  -- ⚠️ Scalari e non un `record`: PostgreSQL non ammette di
                  --   mescolare uno scalare (il conteggio dei pari) e un record
                  --   nella stessa INTO — «v_titolo non e' una variabile scalare».
                  v_tit_id         anagrafiche.soggetti_titoli_iva.id%TYPE;
                  v_tit_iva        config.iva.id%TYPE;
                  v_tit_plafond    anagrafiche.soggetti_titoli_iva.plafond%TYPE;
                  v_tit_usato      anagrafiche.soggetti_titoli_iva.imponibile_utilizzato%TYPE;
                  v_tit_ha_plaf    config.tipi_titolo_iva.ha_plafond%TYPE;
                  v_n_pari         bigint;
                  v_residuo        anagrafiche.soggetti_titoli_iva.plafond%TYPE;
                  v_coperta        numeric;
                  -- la ripartizione: al massimo due parti
                  v_q1             numeric;
                  v_iva1           config.iva.id%TYPE;
                  v_org1           varchar(16);
                  v_tit1           anagrafiche.soggetti_titoli_iva.id%TYPE;
                  v_q2             numeric;
                  v_iva2           config.iva.id%TYPE;
                  v_org2           varchar(16);
                  v_due_parti      boolean := false;
                  -- il contorno del composito: le PARTI della regola di esigibilita'
                  --   (rev 2026-10-01). La coppia esigibilita/split non e' piu' uguale
                  --   su tutte le parti: dipende anche dalla natura di ciascuna.
                  v_per_cassa      config.regimi_fiscali.iva_per_cassa%TYPE;
                  v_piva_sogg      anagrafiche.soggetti.partita_iva%TYPE;
              BEGIN
                  -- ══ GUARD DI INVOCAZIONE ═══════════════════════════════════
                  -- ⚠️ TECNICI: non li produce una persona che compila un form,
                  --   li produce un chiamante rotto. Il messaggio nomina il
                  --   PARAMETRO, ed e' il solo caso in cui farlo e' giusto.
                  IF p_articolo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'articolo_id'), NULL::uuid, 'articolo_id');
                  END IF;
                  IF p_data_riferimento IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'data_riferimento'), NULL::uuid, 'data_riferimento');
                  END IF;
                  -- ⚠️ NULL non e' «anteprima»: e' un chiamante che non ha detto quale
                  --   domanda fa. E il consumo non prende un importo: la proiezione sul
                  --   residuo e' un'altra domanda, e mescolarle darebbe una quota che il
                  --   consumo sul netto smentirebbe.
                  IF p_consumo IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'consumo'), NULL::uuid, 'consumo');
                  END IF;
                  IF p_consumo AND p_imponibile IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'imponibile', 'valore', p_imponibile,
                                             'consumo', true),
                          NULL::uuid, 'imponibile');
                  END IF;
                  IF p_imponibile IS NOT NULL AND p_imponibile < 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'imponibile', 'valore', p_imponibile),
                          NULL::uuid, 'imponibile');
                  END IF;

                  -- ══ STADIO A — QUALE ALIQUOTA COMPETE ALLA MERCE ═══════════
                  SELECT a.iva_id, a.gruppo_voce_id, a.tipo_voce_id, true
                    INTO v_art_iva, v_art_gruppo, v_art_tipo, v_art_trovato
                    FROM catalogo.articoli a
                   WHERE a.id = p_articolo_id;

                  -- ⚠️ SELECT INTO senza righe azzera le variabili e prosegue:
                  --   senza questo guard un articolo inesistente darebbe
                  --   «nessuna aliquota» invece di dire che la chiamata e' rotta.
                  IF NOT COALESCE(v_art_trovato, false) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_RESOLVE_NON_INVOCABILE',
                          jsonb_build_object('parametro', 'articolo_id', 'valore', p_articolo_id),
                          NULL::uuid, 'articolo_id');
                  END IF;

                  v_iva_ord     := v_art_iva;          -- A1: l'articolo
                  v_origine_ord := 'ARTICOLO';

                  -- A2: l'uso della fornitura, SOLO dove l'articolo tace (D17).
                  IF v_iva_ord IS NULL THEN
                      v_tipo_utenza_id := vendite.fn_get_tipo_utenza_fornitura(
                                              p_billing_account_id, p_utility_id, p_data_riferimento);
                      IF v_tipo_utenza_id IS NOT NULL THEN
                          SELECT tu.iva_id INTO v_iva_ord
                            FROM config.tipi_utenze tu WHERE tu.id = v_tipo_utenza_id;
                          IF v_iva_ord IS NOT NULL THEN
                              v_origine_ord := 'TIPO_UTENZA';
                          END IF;
                      END IF;
                  END IF;

                  -- ⭐ «Non lo so» si DICE, non si tace: chi legge deve poter
                  --   distinguere un'aliquota assente da una non cercata.
                  IF v_iva_ord IS NULL THEN
                      v_origine_ord := 'ASSENTE';
                  END IF;

                  -- ══ IL CONTORNO DEL COMPOSITO ══════════════════════════════
                  -- Lo stato dell'emittente serve all'override di aliquota per
                  -- stato; split e esigibilita' vengono dal SOGGETTO (D8) e, dal
                  -- 2026-10-01, anche dal REGIME dell'emittente (IVA per cassa).
                  IF p_emittente_fiscale_id IS NOT NULL THEN
                      SELECT s.stato_id INTO v_stato_emitt
                        FROM anagrafiche.emittenti_fiscali ef
                        JOIN anagrafiche.soggetti_ruoli sr ON sr.id = ef.soggetto_ruolo_id
                        JOIN anagrafiche.soggetti s        ON s.id  = sr.soggetto_id
                       WHERE ef.id = p_emittente_fiscale_id;

                      -- ⚠️ Una query sua e non un JOIN in quella sopra: un emittente
                      --   senza soggetto risolto non deve perdere il regime, e
                      --   viceversa.
                      SELECT rf.iva_per_cassa INTO v_per_cassa
                        FROM anagrafiche.emittenti_fiscali ef
                        JOIN config.regimi_fiscali rf ON rf.codice_interno = ef.regime_fiscale_rf
                       WHERE ef.id = p_emittente_fiscale_id;
                  END IF;

                  IF p_soggetto_id IS NOT NULL THEN
                      SELECT s.split_payment, s.partita_iva INTO v_split_sogg, v_piva_sogg
                        FROM anagrafiche.soggetti s WHERE s.id = p_soggetto_id;
                  END IF;

                  -- ⚠️ TRASPORTATI, NON USATI: la scissione dei pagamenti non
                  --   cambia l'aliquota, cambia CHI VERSA l'imposta (D4). Non
                  --   entra nella scelta del codice, ma esce nel composito
                  --   perche' chi costruisce la riga di fattura ha bisogno di un
                  --   oggetto solo (D18).
                  -- ⭐ rev 2026-10-01: la coppia esigibilita/split non si calcola
                  --   piu' qui. La regola e' UNA, script.fn_esigibilita_iva, la
                  --   stessa del trigger di riga della fattura: prima erano due
                  --   copie che coincidevano solo perche' guardavano il solo
                  --   cliente. Si chiama PER PARTE nel RETURN QUERY, perche' con
                  --   l'IVA per cassa la risposta dipende dalla natura del codice,
                  --   e le due parti di una riga spezzata dal plafond hanno codici
                  --   diversi (brief esigibilita-iva-per-cassa, sezione 8.5).
                  -- ⛔ La disciplina D32 resta, e ora vive nella regola: senza il
                  --   soggetto la coppia esce NULL/NULL, «non lo so», non
                  --   «immediata, non scissa». Senza emittente il regime non e'
                  --   noto: fuori dalla scissione l'esigibilita' esce NULL.

                  -- ══ STADIO B — UN TITOLO CHE LA SOSTITUISCE, SU QUESTA RIGA ═
                  IF p_soggetto_id IS NOT NULL AND p_emittente_fiscale_id IS NOT NULL THEN
                      WITH candidati AS (
                          SELECT t.id, t.iva_id, t.plafond, t.imponibile_utilizzato, tt.ha_plafond,
                                 MAX(CASE
                                       WHEN t.ambito  = 'TUTTO'    THEN 1
                                       WHEN a.livello = 'ARTICOLO' THEN 3
                                       ELSE 2   -- GRUPPO_VOCE e TIPO_VOCE: stessa banda (D13)
                                     END) AS specificita
                            FROM anagrafiche.soggetti_titoli_iva t
                            JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id
                            LEFT JOIN anagrafiche.soggetti_titoli_iva_ambiti a
                                   ON a.titolo_iva_id = t.id
                                  AND (   (a.livello = 'ARTICOLO'    AND a.articolo_id    = p_articolo_id)
                                       OR (a.livello = 'GRUPPO_VOCE' AND a.gruppo_voce_id = v_art_gruppo)
                                       OR (a.livello = 'TIPO_VOCE'   AND a.tipo_voce_id   = v_art_tipo))
                           WHERE t.soggetto_id          = p_soggetto_id
                             AND t.emittente_fiscale_id = p_emittente_fiscale_id
                             AND t.attivo               IS TRUE
                             AND t.validita            @> p_data_riferimento
                             AND tt.attivo              IS TRUE
                             AND (t.ambito = 'TUTTO' OR a.id IS NOT NULL)
                           GROUP BY t.id, t.iva_id, t.plafond, t.imponibile_utilizzato, tt.ha_plafond
                      ), vincitori AS (
                          SELECT c.* FROM candidati c
                           WHERE c.specificita = (SELECT MAX(c2.specificita) FROM candidati c2)
                      )
                      SELECT (SELECT count(*) FROM vincitori), v.id, v.iva_id,
                             v.plafond, v.imponibile_utilizzato, v.ha_plafond
                        INTO v_n_pari, v_tit_id, v_tit_iva,
                             v_tit_plafond, v_tit_usato, v_tit_ha_plaf
                        FROM vincitori v
                       -- ⚠️ ORDER BY prima del LIMIT: se i pari sono due si
                       --   solleva subito sotto, ma senza ordine il messaggio
                       --   nominerebbe un titolo diverso a ogni corsa.
                       ORDER BY v.id
                       LIMIT 1;

                      -- ⛔ D13: a parita' di specificita' non c'e' niente da
                      --   scegliere. Un'ambiguita' che si risolve sull'ordine
                      --   degli id e' un difetto del modello, non una scelta.
                      IF COALESCE(v_n_pari, 0) > 1 THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_resolve_iva_riga_it', 'E_IVA_TITOLI_AMBIGUI',
                              jsonb_build_object('articolo_id', p_articolo_id,
                                                 'soggetto_id', p_soggetto_id,
                                                 'emittente_fiscale_id', p_emittente_fiscale_id,
                                                 'titoli_in_pari', v_n_pari),
                              NULL::uuid, v_n_pari::text,
                              to_char(p_data_riferimento, 'DD/MM/YYYY'));
                      END IF;
                  END IF;

                  -- ══ LA RIPARTIZIONE ════════════════════════════════════════
                  IF v_tit_id IS NULL THEN
                      -- Nessun titolo: risponde lo stadio A.
                      v_q1 := p_imponibile; v_iva1 := v_iva_ord; v_org1 := v_origine_ord; v_tit1 := NULL;

                  ELSIF v_tit_ha_plaf IS NOT TRUE THEN
                      -- Titolo senza tetto: sostituisce e basta.
                      v_q1 := p_imponibile; v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;

                  ELSE
                      -- ⚠️ GREATEST(..., 0): un titolo gia' sfondato da una
                      --   forzatura ha residuo negativo. Sfondato vuol dire
                      --   capienza zero, non capienza al contrario.
                      v_residuo := GREATEST(v_tit_plafond - v_tit_usato, 0);

                      IF p_consumo THEN
                          -- ⭐ CONSUMO: il titolo e l'ordinario, sempre tutti e due e
                          --   senza guardare il residuo. Quanto copre il titolo lo sa
                          --   solo la madre del consumo, che prende il lock e conosce il
                          --   NETTO della fattura: una riga negativa restituisce capienza a
                          --   quelle prima, e una proiezione qui, riga per riga, non puo'
                          --   saperlo. E a residuo zero il titolo deve restare visibile:
                          --   e' la madre a dire che non copre piu' niente.
                          v_q1 := NULL; v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;
                          v_due_parti := true;
                          v_q2 := NULL; v_iva2 := v_iva_ord; v_org2 := v_origine_ord;
                      ELSIF p_imponibile IS NULL THEN
                          -- ⭐ Anteprima senza importo: la spezzatura non e'
                          --   calcolabile e non si inventa. Si dice cosa vale sul
                          --   PRIMO euro, che e' cio' che serve a un form quando
                          --   l'operatore ha appena scelto l'articolo.
                          v_q1 := NULL;
                          IF v_residuo > 0 THEN
                              v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;
                          ELSE
                              v_iva1 := v_iva_ord; v_org1 := v_origine_ord; v_tit1 := NULL;
                          END IF;
                      ELSE
                          v_coperta := LEAST(p_imponibile, v_residuo);
                          IF v_coperta <= 0 THEN
                              -- Plafond esaurito: il titolo non copre piu' niente.
                              v_q1 := p_imponibile; v_iva1 := v_iva_ord; v_org1 := v_origine_ord; v_tit1 := NULL;
                          ELSE
                              v_q1 := v_coperta; v_iva1 := v_tit_iva; v_org1 := 'TITOLO'; v_tit1 := v_tit_id;
                              IF p_imponibile > v_coperta THEN
                                  -- ⭐ P2: il resto torna all'aliquota ordinaria.
                                  --   Puo' uscire con origine ASSENTE, ed e'
                                  --   corretto: il titolo copriva una parte, e sul
                                  --   resto nessuno sa dire l'aliquota. Il cancello
                                  --   all'emissione lo fermera'.
                                  v_due_parti := true;
                                  v_q2 := p_imponibile - v_coperta;
                                  v_iva2 := v_iva_ord; v_org2 := v_origine_ord;
                              END IF;
                          END IF;
                      END IF;
                  END IF;

                  -- ══ IL COMPOSITO (D18) ═════════════════════════════════════
                  -- ⚠️ Il CASE attorno a fn_get_aliquota_iva e' la guardia che
                  --   §R-3 ha insegnato: quella funzione SOLLEVA su un id nullo,
                  --   e un COALESCE non farebbe in tempo a difendere. Le viste
                  --   sorelle ce l'hanno gia'.
                  -- ⚠️ `descrizione` come riferimento normativo e' D24: non c'e'
                  --   una colonna sua perche' config.iva e' gia' piu' fine della
                  --   natura — EC, VG e VF condividono natura 10 e differiscono
                  --   solo per l'articolo citato.
                  RETURN QUERY
                  WITH parti(ord, q, iva, org, tit) AS (
                      VALUES (1, v_q1, v_iva1, v_org1, v_tit1),
                             (2, v_q2, v_iva2, v_org2, NULL::bigint)
                  )
                  SELECT p.q,
                         p.iva,
                         CASE WHEN p.iva IS NOT NULL
                              THEN config.fn_get_aliquota_iva(p.iva, v_stato_emitt) END,
                         n.codice,
                         n.is_reverse_charge,
                         e.esigibilita,
                         e.split_payment,
                         i.descrizione,
                         p.org,
                         p.tit
                    FROM parti p
                    LEFT JOIN config.iva i        ON i.id = p.iva
                    LEFT JOIN config.iva_natura n ON n.id = i.natura_iva_id
                    LEFT JOIN LATERAL script.fn_esigibilita_iva(
                               v_per_cassa, v_split_sogg, v_piva_sogg, p.iva) e ON true
                   WHERE p.ord = 1 OR v_due_parti
                   ORDER BY p.ord;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_resolve_iva_riga_it(p_articolo_id uuid, p_data_riferimento date, p_imponibile numeric, p_billing_account_id bigint, p_utility_id integer, p_soggetto_id uuid, p_emittente_fiscale_id bigint, p_consumo boolean)
              IS 'La logica ITALIANA del risolutore IVA di riga (I2 di brief-db-be-iva-risolutore-e-regime-cliente). Chi chiama passa dal guscio vendite.fn_resolve_iva_riga, che smista per paese (D21): qui c''e'' la regola italiana e basta, e il giorno che ne serve un''altra nasce una _xx accanto senza toccare il guscio. ⭐ DUE STADI che non competono (D6/D7): A stabilisce quale aliquota compete alla MERCE, B verifica se un TITOLO del soggetto la sostituisce — B non vince su A, sostituisce il risultato di A dopo che A ha risposto. STADIO A a due livelli: l''articolo, e l''uso della fornitura SOLO dove l''articolo tace (D17) — catalogo.articoli.iva_id e'' nullable, quindi l''articolo puo'' dichiarare di non avere un''opinione, mentre config.tipi_utenze.iva_id non ha modo di dire su quali merci vale e applicato per primo si prenderebbe ogni riga della fornitura, cauzioni comprese. ⛔ I bundle restano fuori (D16): l''aliquota accanto al prezzo esiste solo sui componenti, e la portano gia'' le *_righe_componenti del documento. STADIO B si valuta PER RIGA (D12), con specificita'' articolo > categoria > tutto e GRUPPO_VOCE/TIPO_VOCE nella stessa banda; a parita'' si solleva E_IVA_TITOLI_AMBIGUI invece di scegliere (D13). ⭐ RITORNA UN COMPOSITO (D18) e non un numerico: le operazioni non imponibili hanno tutte aliquota zero ma non sono la stessa cosa, e la fattura elettronica pretende che si dica QUALE zero — quindi accanto alla quota escono codice, aliquota, natura, inversione contabile, esigibilita'', split payment e riferimento normativo. ⚠️ esigibilita e split_payment sono TRASPORTATI e NON usati nella scelta del codice: e'' cio'' che tiene insieme D4 (la scissione non cambia l''aliquota, cambia chi versa) e D18 (chi costruisce la riga di fattura vuole un oggetto solo). ⚠️ Il riferimento normativo e'' config.iva.descrizione (D24): nessuna colonna nuova, perche'' config.iva e'' gia'' piu'' fine della natura — EC, VG e VF condividono natura 10 e differiscono solo per l''articolo citato, quindi il riferimento e'' l''identita'' della riga. ⭐ E RITORNA UNA RIPARTIZIONE (P2): il plafond puo'' finire a meta'' riga, e l''ORDINE delle righe e'' il contratto — prima la quota coperta dal titolo, poi il resto. ⚠️ STABLE: NON consuma, la ripartizione e'' una proiezione sul residuo (D14); il consumo lo fa anagrafiche.fn_consuma_plafond_titolo_iva alla DEFINITIVA, e per questo esce titolo_iva_id. ⚠️ La data e'' un parametro e mai CURRENT_DATE. ⛔ Il congelamento (D15) non si controlla qui: e'' una proprieta'' del documento, contratto dei chiamanti. ⚠️ Il CASE attorno a config.fn_get_aliquota_iva e'' la guardia che §R-3 ha insegnato: quella funzione solleva su un id nullo e un COALESCE non farebbe in tempo a difendere. ⚠️ SECURITY INVOKER (decisione di Tid): chi chiama deve avere un contesto che vede i titoli — l''applicazione passa l''emittente del documento, i ruoli batch hanno BYPASSRLS; un chiamante senza contesto legge zero titoli e ottiene l''aliquota ordinaria in silenzio, e qui il costo e'' un''imposta applicata dove non andava. ⛔ rev 2026-08-29 bis (D31): split_payment usciva NULL ogni volta che il soggetto non era noto, mentre esigibilita nello stesso composito usciva ''I'' - due risposte alla stessa domanda che dissentivano sulla stessa riga. Ora il flag e'' (v_split_sogg = ''S'') IS TRUE, cioe'' entrambe dicono «non scissa» quando il soggetto non e'' noto. Non si allinea verso il nullo perche'' fatture_righe.esigibilita non lo ammette. Trovato dal caso 6 di test-fn-resolve-iva-riga. ⛔ rev 2026-08-29 ter (D32): la revisione bis aveva allineato la coppia esigibilita/split VERSO IL VALORE, con una motivazione falsa - «esigibilita non ammette il nullo». vendite.fatture_righe.esigibilita e'' NULLABILE e non ha nemmeno un CHECK: quella frase non era stata letta dal catalogo. Il verso giusto e'' l''altro: senza il soggetto il regime di scissione non e'' stato determinato, e rispondere «immediata, non scissa» e'' un''AFFERMAZIONE su un documento che potrebbe essere verso una PA. Ora entrambi i campi escono NULL quando il soggetto non e'' noto - la stessa disciplina di origine = ''ASSENTE''. Sul percorso vero (I5) il soggetto c''e'' sempre. ⭐ rev 2026-10-01 (brief-db-esigibilita-iva-per-cassa-emittente, sezione 8.5): la coppia esigibilita/split_payment esce da script.fn_esigibilita_iva, la regola unica condivisa col trigger di riga della fattura, chiamata PER PARTE perche'' con l''IVA per cassa dipende anche dalla natura del codice (inversione contabile). Entrano il regime dell''emittente (config.regimi_fiscali.iva_per_cassa), scissione e partita IVA del soggetto. Senza soggetto: NULL/NULL; senza emittente, fuori dalla scissione: esigibilita NULL (regime non noto). ⭐ rev 2026-10-04 (decisione C, brief-db-bom-flag-quantita-e-kit-in-fattura §13): p_consumo, in CODA alla firma (default false = tutto come prima), apre la domanda del giro del plafond in fattura — con un titolo a tetto DUE righe sempre, prima il titolo e poi l''ordinario, quota NULL, senza leggere il residuo: quanto copre il titolo lo decide anagrafiche.fn_consuma_plafond_titolo_iva_righe sul NETTO della fattura, e una proiezione riga per riga sarebbe sbagliata per costruzione (una riga negativa restituisce capienza a quelle prima). A residuo zero il titolo resta nella risposta. Il consumo non prende un importo: p_consumo con p_imponibile valorizzato solleva E_IVA_RESOLVE_NON_INVOCABILE.';
