# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2c (G-5): i due guard delle
#   famiglie tornano al loro posto.
#   Brief: brief-db-grammatica-unica-documenti §10.4.
#
#   Tolti in 00_schema (20261020-33) perche' nominavano in UPDATE OF le due colonne ritirate;
#   rimontati con le colonne di oggi, stessi nomi (l'ordine BEFORE ROW si governa col nome)
#   e stessi COMMENT, con la revisione in coda. Montati a mano, non da ci_apply.
#   Le funzioni sono quelle del 20261020-35 e -36.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-37-recreate-trigger-famiglie-documento-guard-senza-tabella-mctit.yaml

  - changeSet:
      id: 20261020-37-recreate-trigger-famiglie-documento-guard-senza-tabella
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Rimonta i due guard di vendite.famiglie_documento (riferimenti, struttura) senza
        schema_tabella e nome_tabella in UPDATE OF. Grammatica unica, 2c (G-5).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "0"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_trigger
               WHERE tgrelid = 'vendite.famiglie_documento'::regclass
                 AND tgname IN ('trg_famiglie_documento_a10_guard_riferimenti_ins_upd',
                                'trg_famiglie_documento_a10_guard_chiave_struttura_upd')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- 🔴 L'ordine BEFORE ROW si governa col nome (a10_guard_chiave_... prima di
              --    a10_guard_riferimenti): i nomi restano quelli di prima.
              CREATE TRIGGER trg_famiglie_documento_a10_guard_chiave_struttura_upd BEFORE UPDATE OF colonna_numero, colonna_billing_account, colonna_serie ON vendite.famiglie_documento FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_famiglie_documento_guard_struttura();

              COMMENT ON TRIGGER trg_famiglie_documento_a10_guard_chiave_struttura_upd ON vendite.famiglie_documento IS
                'Dove vive il documento non si cambia sotto un registro. 🔴 IL NOME PORTA `chiave` PER ORDINARLO PRIMA DI `guard_riferimenti`: i trigger BEFORE ROW scattano in ordine alfabetico, e senza questo accorgimento un cambio di `nome_tabella` su una famiglia con registri usciva col messaggio del riferimento inesistente — vero, ma non il punto: quella colonna non si cambia affatto, e l''operatore avrebbe corretto il riferimento per sbattere un attimo dopo contro il muro vero. Prima l''immutabilita'', poi la validita'' del valore nuovo. ⛔ Solo UPDATE: alla nascita non c''e'' niente da proteggere — una famiglia nuova non ha registri — e un guard BEFORE ROW montato in INSERT oscurerebbe i CHECK della tabella. ⚠️ La funzione esce subito sul no-op, cosi'' i mirror CSV che riscrivono queste colonne a ogni migrate non lo svegliano. ⛔ codice_interno non e'' nella lista: e'' del lock automatico. Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.5 (DB-3). Rev 2026-10-20 (20261020-37, brief-db-grammatica-unica-documenti 2c, G-5): rimontato senza schema_tabella e nome_tabella, ritirate; la tabella dei documenti e'' quella della sorgente.';

              CREATE TRIGGER trg_famiglie_documento_a10_guard_riferimenti_ins_upd BEFORE INSERT OR UPDATE OF colonna_numero, colonna_billing_account, colonna_serie, attivo ON vendite.famiglie_documento FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_famiglie_documento_guard_riferimenti();

              COMMENT ON TRIGGER trg_famiglie_documento_a10_guard_riferimenti_ins_upd ON vendite.famiglie_documento IS
                'Una famiglia ATTIVA deve nominare oggetti che esistono. ⛔ `colonna_serie` e'' nella lista `UPDATE OF` dal 2026-09-01: prima non c''era, e un UPDATE che toccava solo quella colonna — cioe'' esattamente quello che fa il mirror 20260901-12 — passava accanto al guard senza svegliarlo. ⚠️ `attivo` resta nella lista perche'' riaccendere una famiglia ne rimette in gioco i riferimenti. Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.3 (DB-1). Rev 2026-10-20 (20261020-37, brief-db-grammatica-unica-documenti 2c, G-5): rimontato senza schema_tabella e nome_tabella, ritirate; la tabella dei documenti e'' quella della sorgente.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER trg_famiglie_documento_a10_guard_riferimenti_ins_upd ON vendite.famiglie_documento;
              DROP TRIGGER trg_famiglie_documento_a10_guard_chiave_struttura_upd ON vendite.famiglie_documento;
