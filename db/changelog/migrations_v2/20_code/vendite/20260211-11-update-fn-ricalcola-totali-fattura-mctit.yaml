databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260211-11-update-fn-ricalcola-totali-fattura-mctit.yaml

  - changeSet:
      id: 20260211-11-update-fn-ricalcola-totali-fattura
      author: mctit
      comment: "Ricalcolo totali fattura con totale fondi via funzione dedicata"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ricalcola_totali_fattura(p_fattura_id bigint)
               RETURNS void
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_imponibile_tot vendite.fatture.imponibile_tot%TYPE;
                v_imposta_tot vendite.fatture.imposta_tot%TYPE;
                v_totale_doc vendite.fatture.totale_doc%TYPE;
                v_totale_fondi vendite.fatture_fondi_fattura.importo%TYPE;
                v_totale_a_pagare vendite.fatture.totale_a_pagare%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Ricalcolo totali testata a partire da riepiloghi IVA
                --   e fondi fattura (tabella dedicata).
                -- =========================================================

                IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'vendite.fn_ricalcola_totali_fattura', 'E_GENERICO',
                    jsonb_build_object('detail','fattura_id obbligatoria'),
                    NULL::uuid,
                    'fattura_id non valido'
                  );
                END IF;

                SELECT
                  COALESCE(SUM(r.imponibile), 0),
                  COALESCE(SUM(r.imposta), 0)
                  INTO v_imponibile_tot, v_imposta_tot
                FROM vendite.fatture_riepiloghi_iva r
                WHERE r.fattura_id = p_fattura_id;

                -- Recupero totale fondi fattura tramite funzione dedicata
                v_totale_fondi := vendite.fn_get_totale_fondi_fattura(p_fattura_id);

                --  Il totale documento è dato da imponibile + imposta
                v_totale_doc := COALESCE(v_imponibile_tot, 0) + COALESCE(v_imposta_tot, 0);
                -- Il totale a pagare è dato da totale documento + fondi fattura + arrotondamenti
                v_totale_a_pagare := v_totale_doc
                  + COALESCE((SELECT f.arrotondamento_precedente + f.arrotondamento_attuale FROM vendite.fatture f WHERE f.id = p_fattura_id), 0)
                  + COALESCE(v_totale_fondi, 0);

                UPDATE vendite.fatture f
                   SET imponibile_tot = v_imponibile_tot,
                       imposta_tot = v_imposta_tot,
                       totale_doc = v_totale_doc,
                       totale_a_pagare = v_totale_a_pagare,
                       data_update = now(),
                       user_update = current_user
                 WHERE f.id = p_fattura_id;
              END;
              $function$;
