# ------------------------------------------------------------
# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 1: i due montaggi del
# guard dell'erogazione sull'offerta
#   Brief: brief-db-grammatica-unica-documenti §9 (G-1, G-4 di Tid, 2026-10-18).
#
#   script.trgfn_righe_guard_erogazione_perimetro passa TG_ARGV[0] a
#   script.fn_check_riga_erogazione, che dal -21 accetta OFFERTA_COMMERCIALE e
#   non piu' OFFERTA. Gli argomenti di un trigger si cambiano solo smontando e
#   rimontando: qui i due di vendite.offerte_commerciali_eccezioni, con lo
#   stesso nome, la stessa fase, gli stessi eventi e lo stesso WHEN di prima
#   (pg_get_triggerdef su dbdev, 2026-10-19). I due del contratto passano
#   CONTRATTO, che e' gia' il codice della sorgente: non si toccano.
#
#   Senza questo changeSet ogni riga d'offerta che non e' un'ESCLUSIONE
#   sarebbe rifiutata con E_DOC_TIPO_NON_GESTITO.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-30-remount-trg-offerte-eccezioni-guard-erogazione-perimetro-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-30-remount-trg-offerte-eccezioni-guard-erogazione-perimetro-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Rimonta i due guard dell'erogazione su vendite.offerte_commerciali_eccezioni con
        OFFERTA_COMMERCIALE negli argomenti (era OFFERTA). Stessa forma di prima. Grammatica
        unica, lotto 1.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: offerte_commerciali_eccezioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_erogazione_perimetro_ins
                ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_erogazione_perimetro_ins
                BEFORE INSERT ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                WHEN (NEW.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto)
                EXECUTE FUNCTION script.trgfn_righe_guard_erogazione_perimetro('OFFERTA_COMMERCIALE', 'offerta_id');

              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_erogazione_perimetro_upd
                ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_erogazione_perimetro_upd
                BEFORE UPDATE ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                WHEN (NEW.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                      AND (OLD.articolo_id IS DISTINCT FROM NEW.articolo_id
                           OR OLD.tipo_erogazione::text IS DISTINCT FROM NEW.tipo_erogazione::text
                           OR OLD.fonte_quantita_attesa::text IS DISTINCT FROM NEW.fonte_quantita_attesa::text))
                EXECUTE FUNCTION script.trgfn_righe_guard_erogazione_perimetro('OFFERTA_COMMERCIALE', 'offerta_id');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_erogazione_perimetro_ins
                ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_erogazione_perimetro_ins
                BEFORE INSERT ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                WHEN (NEW.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto)
                EXECUTE FUNCTION script.trgfn_righe_guard_erogazione_perimetro('OFFERTA', 'offerta_id');

              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_erogazione_perimetro_upd
                ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_erogazione_perimetro_upd
                BEFORE UPDATE ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                WHEN (NEW.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                      AND (OLD.articolo_id IS DISTINCT FROM NEW.articolo_id
                           OR OLD.tipo_erogazione::text IS DISTINCT FROM NEW.tipo_erogazione::text
                           OR OLD.fonte_quantita_attesa::text IS DISTINCT FROM NEW.fonte_quantita_attesa::text))
                EXECUTE FUNCTION script.trgfn_righe_guard_erogazione_perimetro('OFFERTA', 'offerta_id');
