                    JOIN config.sorgenti s_from ON s_from.id = cs.sorgente_tipo_id AND s_from.codice_interno = 'PREVENTIVO'
                    JOIN vendite.preventivi p
                      ON p.uid = CASE WHEN cs.sorgente_tipo_id = s_from.id THEN cs.sorgente_uid::uuid END
                    JOIN vendite.commesse cm ON cm.id = cs.commessa_id
                    JOIN config.sorgenti s_to ON s_to.codice_interno = 'COMMESSA' AND s_to.attivo IS TRUE
                   WHERE NOT (fn_documento_lineage_archi.p_tipo_ids IS NULL AND fn_documento_lineage_archi.p_uids IS NULL)
                     AND cs.commessa_id = ANY ((SELECT k.com_ids FROM chiavi k)::bigint[])
                     AND (p.uid = ANY ((SELECT k.prev_uids FROM chiavi k)::uuid[])) IS NOT TRUE
                  -- C offerta → contratto
                  UNION ALL
                  SELECT s_from.id, oc.uid::text, s_to.id, c.id::text, NULL::varchar, 'C'
