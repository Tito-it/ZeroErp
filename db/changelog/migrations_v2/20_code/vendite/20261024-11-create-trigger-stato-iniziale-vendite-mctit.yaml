# IL BB DELLA NASCITA, MONTATO SULLE OTTO TESTATE DI VENDITA
#   Brief: brief-modello-documento-vendita §4-ter (N-2 di Tid, 2026-10-24):
#   una sede (script.trgfn_doc_stato_iniziale, 20261024-10), montata su ogni
#   documento con un vocabolario degli stati.
#
#   Fascia _a05_: il trigger deve scattare PRIMA di ogni altro BEFORE INSERT
#   della testata, perche' alcuni leggono lo stato (trg_ddt_z10_gen_numero_
#   emesso_ins_upd, trg_resi_a10_gen_numero_ins_upd,
#   trg_contratti_a10_set_categoria_cliente_snapshot_ins_upd) e lo snapshot
#   _z90_ di ordini e contratti lo copia. «a05» viene prima di «a10», di
#   «audit», «gen_tx_id» e «normalize» su tutte e otto le tabelle.
#
#   Effetti attesi, dichiarati a Tid e al team BE (brief §4-ter):
#   - chi creava un documento scrivendo lo stato iniziale continua a
#     funzionare; chi non lo scrive (fatture, commesse) lo riceve;
#   - chi creava un documento gia' avanti (52 pgTAP, due test del backend) ora
#     prende E_DOC_STATO_INIZIALE_NON_VALIDO: si portano alla nascita in bozza
#     nello stesso giro (i pgTAP) o dal team BE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261024-11-create-trigger-stato-iniziale-vendite-mctit.yaml

  - changeSet:
      id: 20261024-11-create-trigger-stato-iniziale-vendite
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta script.trgfn_doc_stato_iniziale (BEFORE INSERT, _a05_) sulle testate di vendite:
        preventivi, offerte_commerciali, contratti, ordini, ddt, resi, commesse, fatture. Brief: brief-modello-documento-vendita (N-2, Tid
        2026-10-24).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'trgfn_doc_stato_iniziale';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_preventivi_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.preventivi
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_preventivo_id', 'config.stati_doc_preventivi');

              COMMENT ON TRIGGER trg_preventivi_a05_stato_iniziale_ins ON vendite.preventivi IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_preventivi; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_offerte_commerciali_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.offerte_commerciali
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_offerta_id', 'config.stati_doc_offerte');

              COMMENT ON TRIGGER trg_offerte_commerciali_a05_stato_iniziale_ins ON vendite.offerte_commerciali IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_offerte; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_contratti_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.contratti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_contratto_id', 'config.stati_doc_contratti');

              COMMENT ON TRIGGER trg_contratti_a05_stato_iniziale_ins ON vendite.contratti IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_contratti; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_ordini_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.ordini
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_ordine_id', 'config.stati_doc_ordini');

              COMMENT ON TRIGGER trg_ordini_a05_stato_iniziale_ins ON vendite.ordini IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_ordini; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_ddt_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.ddt
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_ddt_id', 'config.stati_doc_ddt');

              COMMENT ON TRIGGER trg_ddt_a05_stato_iniziale_ins ON vendite.ddt IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_ddt; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_resi_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.resi
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_reso_id', 'config.stati_doc_reso');

              COMMENT ON TRIGGER trg_resi_a05_stato_iniziale_ins ON vendite.resi IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_reso; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_commesse_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.commesse
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_commessa_id', 'vendite.stati_commessa');

              COMMENT ON TRIGGER trg_commesse_a05_stato_iniziale_ins ON vendite.commesse IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di vendite.stati_commessa; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';

              CREATE TRIGGER trg_fatture_a05_stato_iniziale_ins
                  BEFORE INSERT ON vendite.fatture
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_doc_stato_iniziale(
                      'stato_doc_fiscale_id', 'config.stati_doc_fiscale');

              COMMENT ON TRIGGER trg_fatture_a05_stato_iniziale_ins ON vendite.fatture IS
                  'Nascita nello stato iniziale (BB script.trgfn_doc_stato_iniziale): stato assente -> lo stato iniziale di config.stati_doc_fiscale; altro stato -> E_DOC_STATO_INIZIALE_NON_VALIDO. Fascia _a05_: prima di ogni altro trigger BEFORE INSERT. Brief: brief-modello-documento-vendita (N-1 … N-3, P-2, Tid 2026-10-24).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_a05_stato_iniziale_ins ON vendite.preventivi;
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_a05_stato_iniziale_ins ON vendite.offerte_commerciali;
              DROP TRIGGER IF EXISTS trg_contratti_a05_stato_iniziale_ins ON vendite.contratti;
              DROP TRIGGER IF EXISTS trg_ordini_a05_stato_iniziale_ins ON vendite.ordini;
              DROP TRIGGER IF EXISTS trg_ddt_a05_stato_iniziale_ins ON vendite.ddt;
              DROP TRIGGER IF EXISTS trg_resi_a05_stato_iniziale_ins ON vendite.resi;
              DROP TRIGGER IF EXISTS trg_commesse_a05_stato_iniziale_ins ON vendite.commesse;
              DROP TRIGGER IF EXISTS trg_fatture_a05_stato_iniziale_ins ON vendite.fatture;
