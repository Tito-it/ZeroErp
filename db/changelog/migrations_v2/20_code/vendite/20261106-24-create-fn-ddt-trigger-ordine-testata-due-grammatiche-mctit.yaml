# vendite.fn_ddt_trigger_ordine_testata NELLE DUE GRAMMATICHE (firma con sorgente_id in coda)
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto 0 giro 0.3 («i lettori trasversali sul BB che risolve»).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   La sorgente di una testata (bolla -> ordine, reso -> bolla) oggi porta l'uid
#   del documento in sorgente_uid; il lotto T la converte all'id, in sorgente_id
#   (S-5). Un lettore che confronta solo l'uid, dopo il lotto T, torna zero righe
#   in silenzio. Qui legge con la regola d'incontro del modello:
#     (doc.id = x.sorgente_id OR doc.uid = x.sorgente_uid)
#   vera nelle due grammatiche e anche nel modello finale (una sola delle due
#   chiavi e' valorizzata, il guard unico lo garantisce): il lettore non si
#   ritocca nei lotti di famiglia. E' il join della chiave polimorfa, come il
#   join di una FK: si scrive in linea, non dietro una funzione, perche' il
#   planner deve poterla usare sugli indici (id, uid, (tipo, sorgente_*)).
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Firma nuova: (sorgente_tipo_id, sorgente_uid, sorgente_id DEFAULT NULL), il
#   parametro nuovo in coda. Nasce accanto alla vecchia; i due chiamanti (diagnosi
#   del push 20261106-25, check di emissione -26) passano alla nuova, poi -27 ritira
#   la vecchia (la diagnosi e' BEGIN ATOMIC: la dipendenza va spostata prima).
#   Sui dati di oggi (solo sorgente_uid valorizzata) il risultato e' lo stesso.
#   ⚠️ BEGIN ATOMIC da solo nel suo sql:, COMMENT e GRANT nel secondo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261106-24-create-fn-ddt-trigger-ordine-testata-due-grammatiche-mctit.yaml

  - changeSet:
      id: 20261106-24-create-fn-ddt-trigger-ordine-testata-due-grammatiche
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_ddt_trigger_ordine_testata(tipo, uid, id): l'ordine di testata nelle due grammatiche.
        brief-db-sorgente-documento-e-riga §7.2 lotto 0 giro 0.3.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM information_schema.columns
               WHERE table_schema = 'vendite' AND table_name = 'ddt' AND column_name = 'sorgente_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_ddt_trigger_ordine_testata(
                  p_sorgente_tipo_id vendite.ddt.sorgente_tipo_id%TYPE,
                  p_sorgente_uid     vendite.ddt.sorgente_uid%TYPE,
                  p_sorgente_id      vendite.ddt.sorgente_id%TYPE DEFAULT NULL)
              RETURNS vendite.ordini.fatturazione_trigger%TYPE
              LANGUAGE sql
              STABLE
              PARALLEL SAFE
              SECURITY INVOKER
              BEGIN ATOMIC
                SELECT o.fatturazione_trigger
                  FROM config.sorgenti so
                  JOIN vendite.ordini o ON (o.id = p_sorgente_id OR o.uid = p_sorgente_uid)
                 WHERE so.id = p_sorgente_tipo_id
                   AND so.codice_interno = 'ORDINE_VENDITA';
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_ddt_trigger_ordine_testata(vendite.ddt.sorgente_tipo_id%TYPE, vendite.ddt.sorgente_uid%TYPE, vendite.ddt.sorgente_id%TYPE) IS
                '⭐ rev 2026-11-06 (20261106-24, brief-db-sorgente-documento-e-riga §7.2 lotto 0 giro 0.3): l''ordine di testata si cerca nelle due grammatiche della sorgente: (o.id = p_sorgente_id OR o.uid = p_sorgente_uid). Oggi la bolla porta l''uid dell''ordine; dal lotto T l''id (S-5). Il parametro nuovo e'' in coda, DEFAULT NULL: chi passa solo (tipo, uid) ha il comportamento di prima. La firma (tipo, uid) si ritira (20261106-27). Building block: il fatturazione_trigger dell''ordine sorgente di TESTATA di una bolla (config.sorgenti ORDINE_VENDITA + vendite.ordini.uid = sorgente_uid). NULL se la bolla non viene da un ordine, se la sorgente manca o se l''ordine non e'' visibile (SECURITY INVOKER: la RLS di chi chiede). Serve alla riga-onere SENZA legame di fulfillment, scritta a mano sulla bolla: il suo trigger non si legge dal legame. Sede unica (regola del 2) della lettura che stava in linea in vendite.fn_ddt_push_diagnosi (20261103-39) e in script.fn_check_ddt_emittibile (20261103-41), sostituite da 20261103-44 e -45. BEGIN ATOMIC (linee-guida-sql §5c). brief-db-addebito-trasporto-ordine §9.5 P-1.';

              GRANT EXECUTE ON FUNCTION vendite.fn_ddt_trigger_ordine_testata(vendite.ddt.sorgente_tipo_id%TYPE, vendite.ddt.sorgente_uid%TYPE, vendite.ddt.sorgente_id%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_ddt_trigger_ordine_testata(vendite.ddt.sorgente_tipo_id%TYPE, vendite.ddt.sorgente_uid%TYPE, vendite.ddt.sorgente_id%TYPE);
