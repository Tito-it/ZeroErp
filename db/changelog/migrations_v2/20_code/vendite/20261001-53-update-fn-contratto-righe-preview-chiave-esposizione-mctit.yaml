# vendite.fn_contratto_righe_preview: nel jsonb `componenti` la chiave esposto_in_fattura diventa
# esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO).
#   Brief: brief-db-esposizione-componenti-kit-in-fattura, sezione 4.5
#
#   E' l'anteprima delle righe del contratto (sorgente della lista vendite.contratto_righe). La colonna di catalogo letta e' stata convertita da
#   20261001-42: con il corpo di prima la funzione fallirebbe alla prima
#   chiamata. La chiave cambia nome insieme alla colonna — tenere il nome
#   vecchio su un valore che non e' piu' un booleano direbbe il falso.
#   Lettori della chiave: contratti_repository e il pannello componenti del FE (richieste nel brief, sezione 5).
#
# -- FORMA -------------------------------------------------------------
#   · RETURNS TABLE invariato: CREATE OR REPLACE, nessun DROP, privilegi intatti;
#   · firma e RETURNS TABLE dall'ultimo YAML che li ha ancorati (20260928-39);
#     dove quello YAML aveva un tipo nudo con una colonna sorgente, ora %TYPE
#     (stessa identita': CREATE OR REPLACE la accetta). Restano espliciti solo i
#     valori calcolati (jsonb, chiavi, azioni), che non riflettono una colonna;
#   · corpo vivo dalla doc auto-gen, patchato da script con sostituzioni contate
#     (la riga della chiave, la coda del COMMENT). Nessun'altra riga toccata.
# ------------------------------------------------------------

