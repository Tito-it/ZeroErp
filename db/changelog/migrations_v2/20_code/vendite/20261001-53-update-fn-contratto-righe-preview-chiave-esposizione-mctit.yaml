                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN 'OVERRIDE'
                              WHEN cr.tipo_eccezione = 'ESCLUSIONE' THEN 'ESCLUSIONE'
                              ELSE                                       'DA_LISTINO'
                          END::varchar,
                          CASE
                              WHEN cr.tipo_eccezione = 'OVERRIDE'   THEN cr.prezzo_unitario
