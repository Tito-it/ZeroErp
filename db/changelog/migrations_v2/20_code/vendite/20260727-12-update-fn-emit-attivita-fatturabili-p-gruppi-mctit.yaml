# fn_emit_attivita_fatturabili_da_commessa + p_gruppi: il PULL impara a
#   fermarsi ai gruppi richiesti
#   (brief-db-emissione-fattura-per-documento-sorgente PARTE A, step A3)
#
# IL PROBLEMA CHE CHIUDE (fatto F10). Questa funzione cicla TUTTE le righe
#   NON_EMESSA della commessa e mette stato_emissione='EMESSA' su OGNUNA.
#   La commessa e' multi-sorgente: contiene il preventivo, il contratto e gli
#   oneri dello stesso cliente. Chiedere "fattura solo il preventivo" e poi far
#   girare questo pull non filtrato significa che anche le righe del contratto
#   escono da "Da emettere", diventano attivita' fatturabili orfane e NON sono
#   piu' quello che erano. Il requisito A2.3 del brief chiede l'opposto: cio'
#   che non si e' chiesto di fatturare deve restare esattamente com'era.
#   -> garanzie G2 (solo le righe chieste), G3 (le altre intatte e ancora
#      fatturabili), G13 (stato_emissione delle altre resta NON_EMESSA).
#
# FORMA DEL FILTRO: un predicato in piu' nel WHERE del cursore, che confronta
#   la chiave prodotta da fn_build_gruppo_fatturabile_key con l'array richiesto.
#   La chiave NON e' ricalcolata a mano qui: la funzione A1 e' l'unica fonte di
#   verita', cosi' elenco (A8) ed emissione filtrano sulla stessa stringa e non
#   possono divergere (garanzia G8).
#
# SEMANTICA DELL'ARGOMENTO — tre casi, tutti voluti:
#   p_gruppi = NULL   -> nessuna restrizione: comportamento IDENTICO a prima
#                        (default, retro-compatibilita' del giro schedulato, G1);
#   p_gruppi = '{}'   -> "non ho chiesto nulla": zero righe, nessun errore.
#                        E' il comportamento naturale di = ANY('{}'), e va
#                        lasciato tale: un array vuoto e' una richiesta vuota,
#                        non una richiesta di tutto (che sarebbe l'opposto, e
#                        col perimetro sbagliato fatturerebbe il mondo);
#   p_gruppi = {...}  -> solo le righe di quei gruppi. Chiave inesistente ->
#                        zero righe, nessun errore (garanzia G6).
#
# ⚠️ text[] E NON commesse_attivita.sorgente_uid%TYPE[]: PostgreSQL non
#   supporta la sintassi colonna%TYPE[]. L'array e' esplicito per necessita'
#   del linguaggio, non per scelta.
#
# ⚠️ DROP + CREATE OBBLIGATORIO (fatto F13). Aggiungere un parametro con
#   DEFAULT a una funzione RETURNS TABLE crea un OVERLOAD: con la firma a 3 e
#   quella a 4 argomenti entrambe presenti, ogni chiamata che omette p_gruppi
#   fallisce con "function is not unique". Il DROP della vecchia firma sta
#   nello stesso changeSet, prima della CREATE.
#   Superficie d'impatto: il chiamante Python
#   (_handle_pull_attivita_da_commessa_task -> CommesseRepository.emit_attivita_fatturabili)
#   usa parametri nominati e continua a funzionare invariato; i pgTAP che la
#   chiamano passano p_commessa_id per nome.
#
# NON TOCCATO: propagazione dello snapshot pricing v5 (8 colonne), di
#   tipo_movimento (rev 2026-07-17) e l'idempotenza su (sorgente COMMESSA,
#   hash md5 della segment_key). Il corpo e' ripreso 1:1 dalla doc auto-gen:
#   l'unica modifica e' il predicato nel cursore.
#
# Base: corpo da doc auto-gen fn_emit_attivita_fatturabili_da_commessa.md
#   (rev 2026-07-17), firma da 20260717-04 (l'auto-gen scioglie i %TYPE).
# Dipendenze: 20260727-10 (fn_build_gruppo_fatturabile_key).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260727-12-update-fn-emit-attivita-fatturabili-p-gruppi-mctit.yaml

  - changeSet:
      id: 20260727-12-update-fn-emit-attivita-fatturabili-p-gruppi
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_emit_attivita_fatturabili_da_commessa + p_gruppi text[] (default NULL =
        comportamento odierno): il pull emette solo le righe dei gruppi richiesti.
        DROP della firma a 3 argomenti per evitare overload ambiguo.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'fn_build_gruppo_fatturabile_key'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Overload ambiguo: la vecchia firma a 3 argomenti deve sparire
              -- PRIMA della nuova, altrimenti ogni chiamata che omette p_gruppi
              -- fallisce con "function is not unique".
              DROP FUNCTION IF EXISTS vendite.fn_emit_attivita_fatturabili_da_commessa(bigint, boolean, boolean);

              CREATE OR REPLACE FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(
                  p_commessa_id   vendite.commesse.id%TYPE,
                  p_only_approved boolean DEFAULT true,
                  p_dry_run       boolean DEFAULT false,
                  p_gruppi        text[]  DEFAULT NULL)
               RETURNS TABLE(total_candidate integer, inserted_rows integer, updated_rows integer, skipped_rows integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: emette righe da commesse_attivita verso attivita_fatturabili
              --        in modalita' idempotente (sorgente COMMESSA + segment_key).
              --        Propaga lo snapshot audit pricing v5 (8 colonne) 1:1 e il
              --        registro tipo_movimento (colonna dal 2026-07-17).
              -- Sottosistema lotto rimosso (deprecato 20260227-16).
              -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente COMMESSA
              --        risolta per codice_interno (immutabile), non per codice.
              -- rev 2026-07-17: propaga tipo_movimento (brief immutabilita §4c.2);
              --        e' il filtro con cui il contatore tenuti-fatturati tiene
              --        fuori dal libro mastro della merce le righe non-NORMALE.
              -- rev 2026-07-27 (brief emissione mirata A3): p_gruppi restringe
              --        l'emissione ai soli GRUPPI FATTURABILI richiesti. NULL =
              --        nessuna restrizione (comportamento storico). E' il primo
              --        dei due punti in cui il perimetro mirato va applicato:
              --        l'altro e' fn_select_attivita_fatturabili, che filtra le
              --        AF gia' esistenti (senza quello, le righe di un altro
              --        gruppo rimaste da un giro precedente verrebbero comunque
              --        rastrellate — garanzia G12).
              DECLARE
                  v_commessa              vendite.commesse%ROWTYPE;
                  v_root_id               vendite.commesse_sorgenti.id%TYPE;
                  v_commessa_source_id    config.sorgenti.id%TYPE;
                  v_existing_id           vendite.attivita_fatturabili.id%TYPE;
                  v_existing_fatturato    vendite.attivita_fatturabili.fatturato%TYPE;
                  v_sorgente_uid_uuid     vendite.attivita_fatturabili.sorgente_uid%TYPE;
                  v_row                   RECORD;
              BEGIN
                  total_candidate := 0;
                  inserted_rows := 0;
                  updated_rows := 0;
                  skipped_rows := 0;

                  -- Guard: parametri
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_commessa_id', 'valore', p_commessa_id),
                          NULL::uuid, 'p_commessa_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera commessa
                  SELECT c.* INTO v_commessa
                    FROM vendite.commesse c WHERE c.id = p_commessa_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id),
                          NULL::uuid, concat('commessa_id ', p_commessa_id)
                      );
                  END IF;

                  -- ROOT source obbligatoria
                  SELECT cs.id INTO v_root_id
                    FROM vendite.commesse_sorgenti cs
                   WHERE cs.commessa_id = p_commessa_id AND cs.ruolo_link = 'ROOT'
                   LIMIT 1;

                  IF v_root_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id),
                          NULL::uuid, concat('ROOT source mancante per commessa ', p_commessa_id)
                      );
                  END IF;

                  -- Sorgente COMMESSA
                  SELECT s.id INTO v_commessa_source_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'COMMESSA' AND s.attivo IS TRUE
                   LIMIT 1;

                  IF v_commessa_source_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_CODICE',
                          jsonb_build_object('codice', 'COMMESSA'),
                          NULL::uuid, 'COMMESSA', 'config.sorgenti'
                      );
                  END IF;

                  -- Loop emissione righe
                  FOR v_row IN
                      SELECT ca.id, ca.segment_key, ca.articolo_id, ca.istanza_utility_id,
                             ca.data_attivita, ca.uom_id, ca.quantita, ca.qta_operativa,
                             ca.uom_operativa_id, ca.factor_to_base, ca.competenza_mese,
                             ca.competenza_dal, ca.competenza_al, ca.posticipa_al,
                             ca.tipo_doc_fiscale_id, ca.valuta_id, ca.area_geografica_id,
                             ca.prezzo_snapshot, ca.prezzo_bloccato, ca.stato_approvazione, ca.meta,
                             ca.tipo_movimento,
                             ca.sorgente_tipo_id AS ca_sorgente_tipo_id,
                             -- Snapshot audit pricing v5 (propagati 1:1)
                             ca.prezzo_base_snapshot, ca.origine_prezzo,
                             ca.tipo_variazione_applicata, ca.valore_variazione_applicata,
                             ca.promo_id, ca.contratto_id,
                             ca.categoria_cliente_id_snapshot, ca.classe_utenza_id_snapshot
                        FROM vendite.commesse_attivita ca
                       WHERE ca.commessa_id = p_commessa_id
                         AND ca.stato_emissione = 'NON_EMESSA'
                         AND (p_only_approved IS FALSE OR ca.stato_approvazione = 'APPROVATA')
                         -- EMISSIONE MIRATA (rev 2026-07-27): NULL = nessuna
                         -- restrizione; array vuoto = richiesta vuota -> zero righe;
                         -- chiave inesistente -> zero righe, nessun errore (G6).
                         -- La chiave viene dalla funzione A1, mai ricostruita qui.
                         AND (
                              p_gruppi IS NULL
                              OR vendite.fn_build_gruppo_fatturabile_key(
                                     ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id
                                 ) = ANY (p_gruppi)
                             )
                       ORDER BY ca.id
                  LOOP
                      total_candidate := total_candidate + 1;

                      -- Hash segment_key -> UUID deterministico
                      v_sorgente_uid_uuid := (
                          substr(md5(v_row.segment_key), 1, 8) || '-' ||
                          substr(md5(v_row.segment_key), 9, 4) || '-' ||
                          substr(md5(v_row.segment_key), 13, 4) || '-' ||
                          substr(md5(v_row.segment_key), 17, 4) || '-' ||
                          substr(md5(v_row.segment_key), 21, 12)
                      )::uuid;

                      SELECT a.id, a.fatturato INTO v_existing_id, v_existing_fatturato
                        FROM vendite.attivita_fatturabili a
                       WHERE a.sorgente_tipo_id = v_commessa_source_id
                         AND a.sorgente_uid = v_sorgente_uid_uuid
                         FOR UPDATE;

                      IF p_dry_run THEN
                          IF v_existing_id IS NULL THEN inserted_rows := inserted_rows + 1;
                          ELSE updated_rows := updated_rows + 1; END IF;
                          CONTINUE;
                      END IF;

                      IF v_existing_id IS NULL THEN
                          INSERT INTO vendite.attivita_fatturabili (
                              articolo_id, billing_account_id, istanza_utility_id, data_attivita,
                              quantita, competenza_mese, approvato, fatturato, meta, sorgente_riga,
                              posticipa_al, sorgente_tipo_id, sorgente_uid, uom_id, qta_operativa,
                              uom_operativa_id, factor_to_base, valuta_id, prezzo_unitario,
                              tipo_doc_fiscale_id, competenza_dal, competenza_al,
                              area_geografica_id, stato_esecuzione, prezzo_bloccato,
                              commessa_id, commessa_attivita_id, sorgente_origine_tipo_id,
                              tipo_movimento,
                              prezzo_base_snapshot, origine_prezzo, tipo_variazione_applicata,
                              valore_variazione_applicata, promo_id, contratto_id,
                              categoria_cliente_id_snapshot, classe_utenza_id_snapshot
                          )
                          VALUES (
                              v_row.articolo_id, v_commessa.billing_account_id, v_row.istanza_utility_id,
                              v_row.data_attivita, v_row.quantita, v_row.competenza_mese,
                              (v_row.stato_approvazione = 'APPROVATA'), false,
                              COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                                  'scope', 'COMMESSE', 'commessa_id', p_commessa_id,
                                  'commessa_attivita_id', v_row.id, 'segment_key', v_row.segment_key
                              ),
                              v_row.id, v_row.posticipa_al, v_commessa_source_id, v_sorgente_uid_uuid,
                              v_row.uom_id, v_row.qta_operativa, v_row.uom_operativa_id, v_row.factor_to_base,
                              v_row.valuta_id, v_row.prezzo_snapshot,
                              v_row.tipo_doc_fiscale_id, v_row.competenza_dal, v_row.competenza_al,
                              v_row.area_geografica_id, 'PENDING', v_row.prezzo_bloccato,
                              p_commessa_id, v_row.id, v_row.ca_sorgente_tipo_id,
                              v_row.tipo_movimento,
                              v_row.prezzo_base_snapshot, v_row.origine_prezzo, v_row.tipo_variazione_applicata,
                              v_row.valore_variazione_applicata, v_row.promo_id, v_row.contratto_id,
                              v_row.categoria_cliente_id_snapshot, v_row.classe_utenza_id_snapshot
                          );
                          inserted_rows := inserted_rows + 1;
                      ELSE
                          -- Riga esistente: errore se gia' fatturata
                          IF COALESCE(v_existing_fatturato, false) IS TRUE THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_RIGA_GIA_FATTURATA',
                                  jsonb_build_object('attivita_fatturabili_id', v_existing_id, 'commessa_attivita_id', v_row.id),
                                  NULL::uuid, v_existing_id::text
                              );
                          END IF;

                          UPDATE vendite.attivita_fatturabili a
                             SET articolo_id = v_row.articolo_id,
                                 billing_account_id = v_commessa.billing_account_id,
                                 istanza_utility_id = v_row.istanza_utility_id,
                                 data_attivita = v_row.data_attivita,
                                 quantita = v_row.quantita,
                                 competenza_mese = v_row.competenza_mese,
                                 approvato = (v_row.stato_approvazione = 'APPROVATA'),
                                 meta = COALESCE(a.meta, '{}'::jsonb) || COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                                     'scope', 'COMMESSE', 'commessa_id', p_commessa_id,
                                     'commessa_attivita_id', v_row.id, 'segment_key', v_row.segment_key
                                 ),
                                 sorgente_riga = v_row.id,
                                 posticipa_al = v_row.posticipa_al,
                                 uom_id = v_row.uom_id,
                                 qta_operativa = v_row.qta_operativa,
                                 uom_operativa_id = v_row.uom_operativa_id,
                                 factor_to_base = v_row.factor_to_base,
                                 valuta_id = v_row.valuta_id,
                                 prezzo_unitario = v_row.prezzo_snapshot,
                                 tipo_doc_fiscale_id = v_row.tipo_doc_fiscale_id,
                                 competenza_dal = v_row.competenza_dal,
                                 competenza_al = v_row.competenza_al,
                                 area_geografica_id = v_row.area_geografica_id,
                                 prezzo_bloccato = v_row.prezzo_bloccato,
                                 commessa_id = p_commessa_id,
                                 commessa_attivita_id = v_row.id,
                                 sorgente_origine_tipo_id = v_row.ca_sorgente_tipo_id,
                                 -- Registro della riga: lo specchio segue la CA
                                 -- (la riga gia' fatturata e' respinta sopra).
                                 tipo_movimento = v_row.tipo_movimento,
                                 -- Refresh snapshot audit pricing v5 (riga non ancora fatturata)
                                 prezzo_base_snapshot = v_row.prezzo_base_snapshot,
                                 origine_prezzo = v_row.origine_prezzo,
                                 tipo_variazione_applicata = v_row.tipo_variazione_applicata,
                                 valore_variazione_applicata = v_row.valore_variazione_applicata,
                                 promo_id = v_row.promo_id,
                                 contratto_id = v_row.contratto_id,
                                 categoria_cliente_id_snapshot = v_row.categoria_cliente_id_snapshot,
                                 classe_utenza_id_snapshot = v_row.classe_utenza_id_snapshot
                           WHERE a.id = v_existing_id;
                          updated_rows := updated_rows + 1;
                      END IF;

                      UPDATE vendite.commesse_attivita ca SET stato_emissione = 'EMESSA' WHERE ca.id = v_row.id;
                  END LOOP;

                  RETURN NEXT;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(bigint, boolean, boolean, text[])
              IS 'Pull da commesse_attivita ad attivita_fatturabili con sorgente COMMESSA+segment_key (hash UUID) e idempotenza. Propaga lo snapshot audit pricing v5 (8 colonne) 1:1 e tipo_movimento. Sottosistema lotto rimosso (deprecato 20260227-16). rev 2026-06-28: sorgente per codice_interno (analisi-hardcoded-codice §3a). rev 2026-07-17: propaga tipo_movimento (colonna, brief immutabilita §4c.2). rev 2026-07-27 (brief emissione mirata A3): p_gruppi text[] restringe l''emissione ai soli gruppi fatturabili richiesti — NULL = nessuna restrizione (comportamento storico, garanzia G1), array vuoto = richiesta vuota (zero righe), chiave inesistente = zero righe senza errore (G6). La chiave arriva da vendite.fn_build_gruppo_fatturabile_key, mai ricostruita a mano: elenco ed emissione filtrano cosi'' sulla stessa stringa (G8). Senza questo filtro un giro mirato porterebbe fuori da "Da emettere" anche le righe degli altri documenti della stessa commessa, che e'' multi-sorgente (G3/G13). ⚠️ Filtrare qui NON basta: le AF gia'' esistenti le filtra fn_select_attivita_fatturabili (G12).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: rimuove la firma a 4 argomenti. Il ripristino della
              -- versione a 3 argomenti richiede di ri-applicare 20260717-04.
              DROP FUNCTION IF EXISTS vendite.fn_emit_attivita_fatturabili_da_commessa(bigint, boolean, boolean, text[]);
