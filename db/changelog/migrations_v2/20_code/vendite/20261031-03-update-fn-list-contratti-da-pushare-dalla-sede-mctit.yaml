# IL LISTER DEI CONTRATTI LEGGE LA SEDE DEGLI ADDEBITI — vendite.fn_list_contratti_da_pushare
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §6.13 (Lotto 8).
#
#   Il corpo passa a vendite.fn_contratti_addebiti_maturati (20261031-02), che lo
#   condivide con la dashboard. Qui restano:
#   · la sorgente CONTRATTO e il suo tipo di documento fiscale (E_CODICE se manca);
#   · il filtro: scarto NULL (gli scartati li segnala la dashboard);
#   · le colonne costanti della commessa (FIXED, NORMALE, sorgente, ...);
#   · ORDER BY contratto, ramo, chiave e LIMIT p_limit.
#   Il controllo di p_contratto_id (E_PUSH_SORGENTE_ID_INVALIDO) e gli stati
#   ATTIVO/CESSATO (E_CODICE) li fa la sede.
#   RETURNS TABLE invariato (CREATE OR REPLACE); stesse righe del 20261031-01.
#
# Ritorno indietro: il corpo di 20261031-01.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261031-03-update-fn-list-contratti-da-pushare-dalla-sede-mctit.yaml

  - changeSet:
      id: 20261031-03-update-fn-list-contratti-da-pushare-dalla-sede
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_list_contratti_da_pushare legge vendite.fn_contratti_addebiti_maturati (la
        sede comune con la dashboard) e ne tiene le righe senza scarto. Brief:
        brief-db-contratto-righe-periodiche-in-commessa §6.13 (Lotto 8).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_contratti_da_pushare(
                  p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                  p_limit              integer DEFAULT NULL::integer,
                  p_contratto_id       vendite.contratti.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(
                  -- nudi (utility_id, fatturazione_immediata, termine_pagamento_id, modalita_pagamento_id): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  contratto_id                vendite.contratti.id%TYPE,
                  contratto_uid               vendite.contratti.uid%TYPE,
                  riga_id                     vendite.contratti_righe.id%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  utility_id                  integer,
                  emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  competenza_dal              vendite.commesse_attivita.competenza_dal%TYPE,
                  competenza_al               vendite.commesse_attivita.competenza_al%TYPE,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  sorgente_uid                vendite.commesse_attivita.sorgente_uid%TYPE,
                  segment_key                 vendite.commesse_attivita.segment_key%TYPE,
                  articolo_id                 vendite.commesse_attivita.articolo_id%TYPE,
                  istanza_utility_id          vendite.commesse_attivita.istanza_utility_id%TYPE,
                  data_attivita               vendite.commesse_attivita.data_attivita%TYPE,
                  uom_id                      vendite.commesse_attivita.uom_id%TYPE,
                  quantita                    vendite.commesse_attivita.quantita%TYPE,
                  qta_operativa               vendite.commesse_attivita.qta_operativa%TYPE,
                  uom_operativa_id            vendite.commesse_attivita.uom_operativa_id%TYPE,
                  factor_to_base              vendite.commesse_attivita.factor_to_base%TYPE,
                  competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                  prezzo_snapshot             vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  prezzo_bloccato             vendite.commesse_attivita.prezzo_bloccato%TYPE,
                  pricing_mode                vendite.commesse_attivita.pricing_mode%TYPE,
                  tipo_movimento              vendite.commesse_attivita.tipo_movimento%TYPE,
                  valuta_id                   vendite.commesse_attivita.valuta_id%TYPE,
                  meta                        vendite.commesse_attivita.meta%TYPE,
                  tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        bigint,
                  modalita_pagamento_id       integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le righe di commessa che i contratti devono mandare a questo giro:
              --   gli addebiti maturati di vendite.fn_contratti_addebiti_maturati (la sede
              --   della regola: una tantum, canoni, storni) senza gli scartati, con le
              --   colonne della commessa che non dipendono dalla riga.
              -- rev 2026-10-30 (20261030-01): i tre rami; prima solo UNA_TANTUM.
              -- rev 2026-10-31 (20261031-01): lo storno segue la fine anche quando si
              --   sposta dopo il primo storno.
              -- rev 2026-10-31 (20261031-03): il corpo passa a
              --   vendite.fn_contratti_addebiti_maturati (20261031-02), che lo condivide
              --   con la dashboard; qui resta il filtro.
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
              BEGIN
                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'CONTRATTO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CONTRATTO'),
                    NULL::uuid, 'CONTRATTO', 'config.sorgenti'
                  );
                END IF;

                RETURN QUERY
                SELECT
                  a.contratto_id, a.contratto_uid, a.riga_id,
                  a.billing_account_id, a.utility_id, a.emittente_soggetto_ruolo_id,
                  a.competenza_dal, a.competenza_al,
                  -- Corsia di instradamento: valore reale del contratto.
                  a.fatturazione_immediata,
                  v_sorgente_tipo_id,
                  a.contratto_uid::text,
                  a.segment_key,
                  a.articolo_id, a.istanza_utility_id, a.data_attivita, a.uom_id,
                  a.quantita, a.qta_operativa, a.uom_operativa_id, a.factor_to_base,
                  a.competenza_mese,
                  a.prezzo_snapshot, a.prezzo_bloccato,
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  NULL::integer,
                  a.meta,
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM vendite.fn_contratti_addebiti_maturati(
                       p_competenza_mese, p_billing_account_id, p_contratto_id) a
                -- Gli scartati non partono: li segnala la dashboard.
                WHERE a.scarto IS NULL
                ORDER BY a.contratto_id, a.ramo, a.segment_key
                LIMIT p_limit;
              END
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_list_contratti_da_pushare(date,bigint,integer,bigint) IS
                'Le righe di commessa che i contratti ATTIVO e CESSATO devono mandare a questo giro, in tre rami. (1) UNA_TANTUM: le righe ADESIONE e AGGIUNTA dei contratti ATTIVO, una volta, con competenza il giorno di attivazione (valido_dal); l''OVERRIDE non si addebita (F-1, e'' il prezzo del cliente), l''ESCLUSIONE non si fattura. (2) CANONE: i pezzi di periodo maturati e non ancora addebitati, da vendite.fn_canone_periodi (sede unica della regola), per le righe a canone ADESIONE e AGGIUNTA, per l''OVERRIDE solo su una quota fissa (prende il posto della riga di listino), e per le quote fisse del listino (config.listini_tipologie.e_quota_fissa, erogazione di default CANONE) senza una riga del contratto sullo stesso articolo: quantita'' 1 a periodo, periodicita'' della riga di listino. Il «da» e'' il giorno dopo l''ultimo pezzo addebitato della fonte; la generazione e'' coalesce(riga, testata); quantita'' fissa = riga x frazione, durata = giorni del pezzo o mesi (frazione x mesi). Prezzo: della riga, o del listino del contratto all''inizio del pezzo (vendite.fn_resolve_prezzo_listino_v2_esito, con la variazione globale; senza prezzo la riga non parte). Chiave CONTRATTO:<uid>:R:<riga>:M:<AAAA-MM> (mese d''inizio del pezzo) o, per la quota fissa del listino, CONTRATTO:<uid>:A:<articolo>:M:<AAAA-MM>. (3) STORNO: un pezzo addebitato che va oltre valido_al si storna per la parte non goduta (addebitato meno dovuto con la fine nota, stessa regola dei mesi e dei giorni), una riga per riga addebitata, al prezzo addebitato. La fine si puo'' spostare finche'' il contratto e'' ATTIVO: lo storno e'' la differenza fra il dovuto con la fine di oggi e quanto e'' gia'' stornato per il pezzo (negativa se la fine arretra, positiva se avanza o sparisce), chiave <base del pezzo>#STO[:<n>][#CMP:...]: la prima #STO, le successive #STO:2, #STO:3, ... Canone e storno hanno competenza_mese = il mese del giro (fine del mese di p_competenza_mese, o l''oggi aziendale), competenza_dal/al = il pezzo. Esclusione gia'' inviato: script.fn_get_stato_push_segment = LIBERA. Righe senza periodicita'' o senza prezzo non partono: le segnala la dashboard (vendite.vw_dash_fatturazione_contratti, CANONE_NON_GENERABILE). Il corpo e'' in vendite.fn_contratti_addebiti_maturati (20261031-02), sede comune con la dashboard; qui il filtro (scarto NULL), le colonne costanti della commessa, l''ordine e il limite. Storia nei changeSet, l''ultimo 20261031-03: brief-db-contratto-righe-periodiche-in-commessa §6.12, §6.13.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_contratti_da_pushare(
                  p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                  p_limit              integer DEFAULT NULL::integer,
                  p_contratto_id       vendite.contratti.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(
                  -- nudi (utility_id, fatturazione_immediata, termine_pagamento_id, modalita_pagamento_id): valori calcolati o polimorfi: nessuna colonna di cui siano il riflesso
                  contratto_id                vendite.contratti.id%TYPE,
                  contratto_uid               vendite.contratti.uid%TYPE,
                  riga_id                     vendite.contratti_righe.id%TYPE,
                  billing_account_id          anagrafiche.billing_account.id%TYPE,
                  utility_id                  integer,
                  emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                  competenza_dal              vendite.commesse_attivita.competenza_dal%TYPE,
                  competenza_al               vendite.commesse_attivita.competenza_al%TYPE,
                  fatturazione_immediata      boolean,
                  sorgente_tipo_id            vendite.commesse_attivita.sorgente_tipo_id%TYPE,
                  sorgente_uid                vendite.commesse_attivita.sorgente_uid%TYPE,
                  segment_key                 vendite.commesse_attivita.segment_key%TYPE,
                  articolo_id                 vendite.commesse_attivita.articolo_id%TYPE,
                  istanza_utility_id          vendite.commesse_attivita.istanza_utility_id%TYPE,
                  data_attivita               vendite.commesse_attivita.data_attivita%TYPE,
                  uom_id                      vendite.commesse_attivita.uom_id%TYPE,
                  quantita                    vendite.commesse_attivita.quantita%TYPE,
                  qta_operativa               vendite.commesse_attivita.qta_operativa%TYPE,
                  uom_operativa_id            vendite.commesse_attivita.uom_operativa_id%TYPE,
                  factor_to_base              vendite.commesse_attivita.factor_to_base%TYPE,
                  competenza_mese             vendite.commesse_attivita.competenza_mese%TYPE,
                  prezzo_snapshot             vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  prezzo_bloccato             vendite.commesse_attivita.prezzo_bloccato%TYPE,
                  pricing_mode                vendite.commesse_attivita.pricing_mode%TYPE,
                  tipo_movimento              vendite.commesse_attivita.tipo_movimento%TYPE,
                  valuta_id                   vendite.commesse_attivita.valuta_id%TYPE,
                  meta                        vendite.commesse_attivita.meta%TYPE,
                  tipo_doc_fiscale_id         vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        bigint,
                  modalita_pagamento_id       integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le righe di commessa che i contratti devono mandare a questo giro,
              --   in tre rami (brief-db-contratto-righe-periodiche-in-commessa §6.12):
              --   1. UNA_TANTUM: una volta, il giorno di attivazione (come dal 20261013-24);
              --   2. CANONE: i pezzi di periodo maturati e non ancora addebitati, da
              --      vendite.fn_canone_periodi, per ogni riga a canone del contratto e per
              --      ogni quota fissa del listino che il contratto non ritocca;
              --   3. STORNO: la parte non goduta di un pezzo addebitato oltre valido_al,
              --      come differenza dal gia' stornato (la fine si puo' spostare).
              --   Regola completa nell'intestazione dei changeSet 20261030-01 e 20261031-01.
              -- rev 2026-10-30 (20261030-01): i tre rami; prima solo UNA_TANTUM.
              -- rev 2026-10-31 (20261031-01): lo storno segue la fine anche quando si
              --   sposta dopo il primo storno.
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_attivo_id     config.stati_doc_contratti.id%TYPE;
                v_stato_cessato_id    config.stati_doc_contratti.id%TYPE;
                v_data_giro           vendite.commesse_attivita.competenza_al%TYPE;
                v_mese_giro           vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                IF p_contratto_id IS NOT NULL AND p_contratto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_contratto_id', 'valore', p_contratto_id),
                    NULL::uuid,
                    'p_contratto_id', p_contratto_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'CONTRATTO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CONTRATTO'),
                    NULL::uuid, 'CONTRATTO', 'config.sorgenti'
                  );
                END IF;

                SELECT s.id INTO v_stato_attivo_id
                FROM config.stati_doc_contratti s
                WHERE s.codice_interno = 'ATTIVO' AND s.attivo IS TRUE LIMIT 1;

                -- Senza lo stato il filtro non ha un valore: si ferma, come per la
                -- sorgente. Il push non lista mai contratti in uno stato qualunque.
                IF v_stato_attivo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'ATTIVO'),
                    NULL::uuid, 'ATTIVO', 'config.stati_doc_contratti'
                  );
                END IF;

                -- I CESSATO generano i periodi mancanti fino a valido_al, e gli storni (G-2).
                SELECT s.id INTO v_stato_cessato_id
                FROM config.stati_doc_contratti s
                WHERE s.codice_interno = 'CESSATO' AND s.attivo IS TRUE LIMIT 1;

                IF v_stato_cessato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CESSATO'),
                    NULL::uuid, 'CESSATO', 'config.stati_doc_contratti'
                  );
                END IF;

                -- La data del giro (F-6): l'ultimo giorno del mese chiesto, o l'oggi
                -- aziendale. La competenza delle righe di canone e storno e' il suo mese.
                v_data_giro := CASE
                  WHEN p_competenza_mese IS NOT NULL
                    THEN (date_trunc('month', p_competenza_mese) + interval '1 month' - interval '1 day')::date
                  ELSE script.fn_data_operativa()
                END;
                v_mese_giro := date_trunc('month', v_data_giro)::date;

                RETURN QUERY
                WITH ctr AS (
                  -- I contratti del giro: ATTIVO e CESSATO. Il ramo UNA_TANTUM ne tiene
                  -- solo gli ATTIVO (sotto).
                  SELECT c.id, c.uid, c.numero, c.billing_account_id, c.utility_id,
                         c.istanza_utility_id, c.fatturazione_immediata, c.stato_doc_contratto_id,
                         c.valido_dal, c.valido_al, c.data, c.generazione_canone, c.mese_partenza_canone,
                         anagrafiche.fn_get_emittente_fiscale_id(c.billing_account_id) AS emittente_id,
                         lo.listino_versione_id
                    FROM vendite.contratti c
                    LEFT JOIN LATERAL vendite.fn_documento_listino_operativo('CONTRATTO', c.id) lo ON true
                   WHERE c.stato_doc_contratto_id IN (v_stato_attivo_id, v_stato_cessato_id)
                     AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                     AND (p_contratto_id IS NULL OR c.id = p_contratto_id)
                ),
                fonti AS (
                  -- Chi si addebita a canone (G-0, F-1). Una riga per articolo e contratto.
                  --   · Le righe del contratto: ADESIONE e AGGIUNTA; l'OVERRIDE solo su una
                  --     quota fissa (prende il posto della riga di listino che ritocca):
                  --     altrove l'OVERRIDE e' solo il prezzo del cliente (F-1).
                  --   · Le quote fisse del listino senza una riga del contratto sullo stesso
                  --     articolo (un'eccezione la sostituisce o, l'ESCLUSIONE, la toglie):
                  --     quantita' 1 per periodo, periodicita' della riga di listino.
                  -- Senza periodicita', o a durata su un'unita' che non si conta dal
                  -- calendario, la riga non si puo' addebitare: la segnala la dashboard (L8).
                  SELECT c.id AS contratto_id, cr.id AS riga_id, cr.articolo_id,
                         a.uom_id, cr.periodicita,
                         coalesce(cr.generazione_canone, c.generazione_canone) AS generazione,
                         cr.fonte_quantita_attesa AS fonte, um.conta_dal_calendario AS calendario,
                         cr.quantita AS qta, cr.qta_operativa, cr.uom_operativa_id, cr.factor_to_base,
                         cr.prezzo_unitario AS prezzo, NULL::bigint AS listino_riga_id,
                         c.uid::text AS uid_chiave, 'RIGA'::text AS origine
                    FROM ctr c
                    JOIN vendite.contratti_righe cr
                      ON cr.contratto_id = c.id
                     AND COALESCE(cr.attivo, TRUE) IS TRUE
                     AND cr.tipo_erogazione = 'CANONE'
                     AND cr.periodicita IS NOT NULL
                    JOIN catalogo.articoli a ON a.id = cr.articolo_id
                    LEFT JOIN catalogo.unita_misura um ON um.id = a.uom_id
                    LEFT JOIN config.listini_tipologie t ON t.id = a.listino_tipologia_id
                   WHERE (cr.tipo_eccezione IN ('ADESIONE'::vendite.tipo_eccezione_contratto,
                                                'AGGIUNTA'::vendite.tipo_eccezione_contratto)
                          OR (cr.tipo_eccezione = 'OVERRIDE'::vendite.tipo_eccezione_contratto
                              AND t.e_quota_fissa IS TRUE))
                     AND (cr.fonte_quantita_attesa <> 'DURATA' OR um.conta_dal_calendario IS NOT NULL)
                  UNION ALL
                  SELECT q.contratto_id, NULL::bigint, q.articolo_id, q.uom_id, q.periodicita,
                         q.generazione, q.fonte, q.calendario, 1::numeric, 1::numeric, q.uom_id, 1::numeric,
                         NULL::numeric, q.listino_riga_id,
                         -- La chiave della quota fissa nomina l'ARTICOLO, non la riga di
                         -- listino: una versione nuova cambia la riga, non la quota.
                         q.uid::text || ':A:' || q.articolo_id::text, 'LISTINO'::text
                    FROM (
                      SELECT DISTINCT ON (c.id, lr.articolo_id)
                             c.id AS contratto_id, c.uid, lr.articolo_id, lr.uom_id, lr.periodicita,
                             c.generazione_canone AS generazione, er.fonte_quantita_attesa AS fonte,
                             um.conta_dal_calendario AS calendario, lr.id AS listino_riga_id
                        FROM ctr c
                        JOIN vendite.listini_righe lr
                          ON lr.listino_versione_id = c.listino_versione_id
                         AND lr.attivo IS TRUE
                         AND lr.periodicita IS NOT NULL
                        JOIN catalogo.articoli a ON a.id = lr.articolo_id
                        JOIN config.listini_tipologie t
                          ON t.id = a.listino_tipologia_id AND t.e_quota_fissa IS TRUE
                        LEFT JOIN catalogo.unita_misura um ON um.id = lr.uom_id
                        -- L'erogazione di default dell'articolo: solo se e' un canone.
                        JOIN LATERAL (
                          SELECT e.fonte_quantita_attesa
                            FROM vendite.fn_articolo_erogazioni(lr.articolo_id) e
                           WHERE e.e_default IS TRUE AND e.tipo_erogazione = 'CANONE'
                           LIMIT 1) er ON true
                       WHERE NOT EXISTS (
                               SELECT 1 FROM vendite.contratti_righe cx
                                WHERE cx.contratto_id = c.id
                                  AND cx.articolo_id = lr.articolo_id
                                  AND COALESCE(cx.attivo, TRUE) IS TRUE)
                         AND (er.fonte_quantita_attesa <> 'DURATA' OR um.conta_dal_calendario IS NOT NULL)
                       ORDER BY c.id, lr.articolo_id, lr.id
                    ) q
                ),
                fonti_k AS (
                  SELECT f.*, script.fn_segment_key('CONTRATTO', f.uid_chiave, f.riga_id) AS prefisso,
                         p.mesi
                    FROM fonti f
                    JOIN config.periodicita p ON p.codice = f.periodicita
                ),
                una_tantum AS (
                  SELECT
                    c.id AS contratto_id, c.uid AS contratto_uid, cr.id AS riga_id,
                    c.billing_account_id, c.utility_id, c.emittente_id,
                    -- Competenza della riga UNA_TANTUM: il giorno di attivazione, in tutte
                    -- e due le colonne (D-1 di Tid, 2026-10-13). valido_dal e' NOT NULL.
                    c.valido_dal AS competenza_dal, c.valido_dal AS competenza_al,
                    c.fatturazione_immediata,
                    script.fn_segment_key('CONTRATTO', c.uid::text, cr.id, COALESCE(c.valido_dal, c.data)) AS segment_key,
                    cr.articolo_id, c.istanza_utility_id,
                    COALESCE(c.valido_dal, c.data) AS data_attivita,
                    -- uom_id canonica da catalogo.articoli (fix bug proiezione NULL)
                    a.uom_id,
                    cr.quantita, cr.qta_operativa, cr.uom_operativa_id,
                    COALESCE(cr.factor_to_base, 1::numeric) AS factor_to_base,
                    date_trunc('month', COALESCE(c.valido_dal, c.data))::date AS competenza_mese,
                    -- L'ADESIONE non ha un prezzo suo: quello del listino, alla data
                    -- dell'attivazione (G-0-ter).
                    COALESCE(cr.prezzo_unitario, rp.prezzo_finale) AS prezzo,
                    -- prezzo_bloccato: dipende dalla RIGA (prezzo valorizzato),
                    -- INDIPENDENTE dal flag di corsia.
                    (cr.prezzo_unitario IS NOT NULL) AS prezzo_bloccato,
                    jsonb_build_object(
                      'contratto_numero',    c.numero,
                      'tipo_erogazione',     cr.tipo_erogazione,
                      'tipo_commessa',       'AUTO',
                      'policy_fatturazione', 'DA_DOCUMENTO'
                    ) AS meta,
                    0 AS ramo
                  FROM ctr c
                  JOIN vendite.contratti_righe cr
                    ON cr.contratto_id = c.id
                   AND COALESCE(cr.attivo, TRUE) IS TRUE
                   -- Si addebitano ADESIONE e AGGIUNTA. L'ESCLUSIONE non si fattura; l'OVERRIDE
                   -- e' il prezzo del cliente, se e quando compra (F-1).
                   AND cr.tipo_eccezione IN ('ADESIONE'::vendite.tipo_eccezione_contratto,
                                             'AGGIUNTA'::vendite.tipo_eccezione_contratto)
                   AND cr.tipo_erogazione = 'UNA_TANTUM'
                  JOIN catalogo.articoli a ON a.id = cr.articolo_id
                  LEFT JOIN LATERAL (
                    SELECT r.prezzo_finale
                      FROM vendite.fn_resolve_prezzo_listino_v2_esito(
                             cr.articolo_id, a.uom_id, c.valido_dal, c.billing_account_id,
                             c.utility_id, c.emittente_id, NULL::integer, NULL::uuid,
                             c.listino_versione_id) r
                     WHERE cr.prezzo_unitario IS NULL
                       AND r.esito_codice IS NULL) rp ON true
                  WHERE c.stato_doc_contratto_id = v_stato_attivo_id
                    AND (c.valido_al IS NULL OR c.valido_al >= COALESCE(p_competenza_mese, (SELECT script.fn_data_operativa())))
                    AND (p_competenza_mese IS NULL
                         OR date_trunc('month', COALESCE(c.valido_dal, c.data))::date = p_competenza_mese)
                ),
                canoni AS (
                  SELECT
                    c.id AS contratto_id, c.uid AS contratto_uid, f.riga_id,
                    c.billing_account_id, c.utility_id, c.emittente_id,
                    p.periodo_dal AS competenza_dal, p.periodo_al AS competenza_al,
                    c.fatturazione_immediata,
                    script.fn_segment_key('CONTRATTO', f.uid_chiave, f.riga_id, p.periodo_dal) AS segment_key,
                    f.articolo_id, c.istanza_utility_id,
                    p.periodo_dal AS data_attivita,
                    f.uom_id,
                    -- La quantita' del pezzo: a quantita' fissa la riga per la frazione del
                    -- periodo; a durata i giorni del pezzo, o i mesi (frazione x mesi), e
                    -- il periodo incompleto e' gia' dentro (G-9).
                    CASE WHEN f.fonte = 'DURATA' THEN m.misura
                         ELSE round(COALESCE(f.qta, 1) * m.misura, 6) END AS quantita,
                    CASE WHEN f.fonte = 'DURATA' THEN m.misura
                         ELSE round(COALESCE(f.qta_operativa, f.qta, 1) * m.misura, 6) END AS qta_operativa,
                    CASE WHEN f.fonte = 'DURATA' THEN f.uom_id
                         ELSE COALESCE(f.uom_operativa_id, f.uom_id) END AS uom_operativa_id,
                    CASE WHEN f.fonte = 'DURATA' THEN 1::numeric
                         ELSE COALESCE(f.factor_to_base, 1::numeric) END AS factor_to_base,
                    p.competenza_mese,
                    -- Il prezzo: quello della riga (OVERRIDE, AGGIUNTA), o quello del
                    -- listino del contratto all'inizio del pezzo (ADESIONE, quota fissa),
                    -- con la variazione globale (G-0).
                    COALESCE(f.prezzo, rp.prezzo_finale) AS prezzo,
                    (f.prezzo IS NOT NULL) AS prezzo_bloccato,
                    jsonb_build_object(
                      'contratto_numero',      c.numero,
                      'tipo_erogazione',       'CANONE',
                      'fonte_quantita_attesa', f.fonte,
                      'periodicita',           f.periodicita,
                      'generazione_canone',    f.generazione,
                      'periodo_dal',           p.periodo_intero_dal,
                      'periodo_al',            p.periodo_intero_al,
                      'frazione',              p.frazione,
                      'origine_canone',        f.origine,
                      'listino_riga_id',       f.listino_riga_id,
                      'tipo_commessa',         'AUTO',
                      'policy_fatturazione',   'DA_DOCUMENTO'
                    ) AS meta,
                    1 AS ramo
                  FROM fonti_k f
                  JOIN ctr c ON c.id = f.contratto_id
                  -- Il «da» del giro (G-2): il giorno dopo l'ultimo pezzo addebitato di
                  -- questa fonte (gli storni, negativi, non contano; i componenti di un
                  -- kit hanno la base del pezzo e contano).
                  LEFT JOIN LATERAL (
                    SELECT max(ca.competenza_al) AS al
                      FROM vendite.commesse_attivita ca
                     WHERE ca.sorgente_uid = c.uid::text
                       AND ca.segment_base::text ~>=~ (f.prefisso || ':M:')
                       AND ca.segment_base::text ~<~ (f.prefisso || ':M;')
                       AND ca.tipo_movimento = 'NORMALE'
                       AND ca.quantita > 0
                       AND ca.stato_emissione <> 'ANNULLATA') u ON true
                  CROSS JOIN LATERAL vendite.fn_canone_periodi(
                    c.valido_dal, c.valido_al, f.periodicita, c.mese_partenza_canone,
                    f.generazione, v_data_giro, u.al + 1) p
                  CROSS JOIN LATERAL (
                    SELECT CASE WHEN f.fonte = 'DURATA' AND f.calendario = 'GIORNO'
                                  THEN (p.periodo_al - p.periodo_dal + 1)::numeric
                                WHEN f.fonte = 'DURATA'
                                  THEN round(p.frazione * f.mesi, 6)
                                ELSE p.frazione END AS misura) m
                  LEFT JOIN LATERAL (
                    SELECT r.prezzo_finale
                      FROM vendite.fn_resolve_prezzo_listino_v2_esito(
                             f.articolo_id, f.uom_id, p.periodo_dal, c.billing_account_id,
                             c.utility_id, c.emittente_id, NULL::integer, NULL::uuid,
                             c.listino_versione_id) r
                     WHERE f.prezzo IS NULL
                       AND r.esito_codice IS NULL) rp ON true
                ),
                storni AS (
                  -- Lo storno (G-5): un pezzo addebitato che va oltre valido_al si storna
                  -- per la parte non goduta, con la stessa regola dei mesi e dei giorni
                  -- (F-2): addebitato meno quanto si sarebbe addebitato con la fine nota.
                  -- Una riga per ogni riga addebitata (anche i componenti di un kit), al
                  -- prezzo addebitato.
                  -- La fine si puo' spostare finche' il contratto e' ATTIVO (prima, dopo,
                  -- o toglierla): lo storno e' la DIFFERENZA fra il dovuto con la fine di
                  -- oggi e quanto e' gia' stornato per quel pezzo. Negativa se la fine
                  -- arretra, positiva se avanza o sparisce (si riaddebita). Ogni rettifica
                  -- ha la sua chiave: #STO la prima, #STO:<n> le successive.
                  SELECT
                    c.id AS contratto_id, c.uid AS contratto_uid, NULL::bigint AS riga_id,
                    c.billing_account_id, c.utility_id, c.emittente_id,
                    CASE WHEN d.quantita < 0 THEN greatest(c.valido_al + 1, ca.competenza_dal)
                         ELSE ca.competenza_dal END AS competenza_dal,
                    ca.competenza_al,
                    c.fatturazione_immediata,
                    -- La chiave: la base del pezzo col suffisso, prima dell'eventuale #CMP
                    -- del componente.
                    (ca.segment_base::text || '#STO'
                      || CASE WHEN g.n = 0 THEN '' ELSE ':' || (g.n + 1)::text END
                      || substr(ca.segment_key::text, length(ca.segment_base::text) + 1))::varchar AS segment_key,
                    ca.articolo_id, ca.istanza_utility_id,
                    CASE WHEN d.quantita < 0 THEN greatest(c.valido_al + 1, ca.competenza_dal)
                         ELSE ca.competenza_dal END AS data_attivita,
                    ca.uom_id,
                    d.quantita, d.qta_operativa,
                    ca.uom_operativa_id, ca.factor_to_base,
                    v_mese_giro AS competenza_mese,
                    ca.prezzo_snapshot AS prezzo,
                    true AS prezzo_bloccato,
                    ca.meta || jsonb_build_object('movimento', 'STORNO_CANONE',
                                                  'storno_di_attivita_id', ca.id) AS meta,
                    2 AS ramo
                  FROM fonti_k f
                  JOIN ctr c ON c.id = f.contratto_id
                  -- I pezzi addebitati della fonte: le righe del canone, non le rettifiche.
                  JOIN vendite.commesse_attivita ca
                    ON ca.sorgente_uid = c.uid::text
                   AND ca.segment_base::text ~>=~ (f.prefisso || ':M:')
                   AND ca.segment_base::text ~<~ (f.prefisso || ':M;')
                   AND ca.segment_key::text !~ '#STO'
                   AND ca.tipo_movimento = 'NORMALE'
                   AND ca.quantita > 0
                   AND ca.stato_emissione <> 'ANNULLATA'
                  -- Le rettifiche gia' scritte per il pezzo: n le conta tutte, anche le
                  -- annullate (la chiave resta occupata nella commessa); la somma solo le
                  -- vive.
                  CROSS JOIN LATERAL (
                    SELECT count(*) AS n,
                           COALESCE(sum(s.quantita) FILTER (WHERE s.stato_emissione <> 'ANNULLATA'), 0) AS q,
                           COALESCE(sum(s.qta_operativa) FILTER (WHERE s.stato_emissione <> 'ANNULLATA'), 0) AS qo
                      FROM vendite.commesse_attivita s
                     WHERE s.sorgente_uid = ca.sorgente_uid
                       AND s.segment_base = ca.segment_base
                       AND s.segment_key::text ~ '#STO'
                       AND s.meta ->> 'storno_di_attivita_id' = ca.id::text) g
                  -- La misura del pezzo com'era e come sarebbe con la fine di oggi.
                  CROSS JOIN LATERAL (
                    SELECT x.frazione, (x.periodo_al - x.periodo_dal + 1) AS giorni
                      FROM vendite.fn_canone_periodi(c.valido_dal, NULL, f.periodicita,
                             c.mese_partenza_canone, 'INIZIO_PERIODO', ca.competenza_dal,
                             ca.competenza_dal) x
                     WHERE x.periodo_dal = ca.competenza_dal
                     LIMIT 1) prima
                  LEFT JOIN LATERAL (
                    SELECT x.frazione, (x.periodo_al - x.periodo_dal + 1) AS giorni
                      FROM vendite.fn_canone_periodi(c.valido_dal, c.valido_al, f.periodicita,
                             c.mese_partenza_canone, 'INIZIO_PERIODO', ca.competenza_dal,
                             ca.competenza_dal) x
                     WHERE x.periodo_dal = ca.competenza_dal
                     LIMIT 1) dopo ON true
                  CROSS JOIN LATERAL (
                    SELECT CASE WHEN f.fonte = 'DURATA' AND f.calendario = 'GIORNO'
                                  THEN COALESCE(dopo.giorni, 0)::numeric / prima.giorni
                                ELSE COALESCE(dopo.frazione, 0) / NULLIF(prima.frazione, 0) END AS rapporto) r
                  CROSS JOIN LATERAL (
                    SELECT round(ca.quantita * r.rapporto, 6) - ca.quantita - g.q AS quantita,
                           round(ca.qta_operativa * r.rapporto, 6) - ca.qta_operativa - g.qo AS qta_operativa) d
                  -- Solo i pezzi che la fine taglia, o che hanno gia' una rettifica (la
                  -- fine e' poi avanzata o sparita).
                  WHERE r.rapporto IS NOT NULL
                    AND ((c.valido_al IS NOT NULL AND ca.competenza_al > c.valido_al) OR g.n > 0)
                ),
                tutte AS (
                  SELECT * FROM una_tantum
                  UNION ALL
                  SELECT * FROM canoni
                  UNION ALL
                  SELECT * FROM storni
                )
                SELECT
                  t.contratto_id, t.contratto_uid, t.riga_id,
                  t.billing_account_id, t.utility_id, t.emittente_id,
                  t.competenza_dal, t.competenza_al,
                  -- Corsia di instradamento: valore reale del contratto.
                  t.fatturazione_immediata,
                  v_sorgente_tipo_id,
                  t.contratto_uid::text,
                  t.segment_key,
                  t.articolo_id, t.istanza_utility_id, t.data_attivita, t.uom_id,
                  t.quantita, t.qta_operativa, t.uom_operativa_id, t.factor_to_base,
                  t.competenza_mese,
                  t.prezzo, t.prezzo_bloccato,
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  NULL::integer,
                  t.meta,
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM tutte t
                -- Senza prezzo (il listino non lo da' alla data) la riga non parte: la
                -- segnala la dashboard (L8). Una quantita' a zero non e' un addebito.
                WHERE t.prezzo IS NOT NULL
                  AND t.quantita <> 0
                  -- Esclusione "gia' inviato": eleggibile solo se MAI instradata (LIBERA),
                  -- classificatore condiviso coi rami reason della capability: vede anche
                  -- i componenti #CMP e non dipende da stato_emissione (ALLOCATA basta).
                  AND script.fn_get_stato_push_segment(t.segment_key) = 'LIBERA'
                ORDER BY t.contratto_id, t.ramo, t.segment_key
                LIMIT p_limit;
              END
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_list_contratti_da_pushare(date,bigint,integer,bigint) IS
                'Le righe di commessa che i contratti ATTIVO e CESSATO devono mandare a questo giro, in tre rami. (1) UNA_TANTUM: le righe ADESIONE e AGGIUNTA dei contratti ATTIVO, una volta, con competenza il giorno di attivazione (valido_dal); l''OVERRIDE non si addebita (F-1, e'' il prezzo del cliente), l''ESCLUSIONE non si fattura. (2) CANONE: i pezzi di periodo maturati e non ancora addebitati, da vendite.fn_canone_periodi (sede unica della regola), per le righe a canone ADESIONE e AGGIUNTA, per l''OVERRIDE solo su una quota fissa (prende il posto della riga di listino), e per le quote fisse del listino (config.listini_tipologie.e_quota_fissa, erogazione di default CANONE) senza una riga del contratto sullo stesso articolo: quantita'' 1 a periodo, periodicita'' della riga di listino. Il «da» e'' il giorno dopo l''ultimo pezzo addebitato della fonte; la generazione e'' coalesce(riga, testata); quantita'' fissa = riga x frazione, durata = giorni del pezzo o mesi (frazione x mesi). Prezzo: della riga, o del listino del contratto all''inizio del pezzo (vendite.fn_resolve_prezzo_listino_v2_esito, con la variazione globale; senza prezzo la riga non parte). Chiave CONTRATTO:<uid>:R:<riga>:M:<AAAA-MM> (mese d''inizio del pezzo) o, per la quota fissa del listino, CONTRATTO:<uid>:A:<articolo>:M:<AAAA-MM>. (3) STORNO: un pezzo addebitato che va oltre valido_al si storna per la parte non goduta (addebitato meno dovuto con la fine nota, stessa regola dei mesi e dei giorni), una riga per riga addebitata, al prezzo addebitato. La fine si puo'' spostare finche'' il contratto e'' ATTIVO: lo storno e'' la differenza fra il dovuto con la fine di oggi e quanto e'' gia'' stornato per il pezzo (negativa se la fine arretra, positiva se avanza o sparisce), chiave <base del pezzo>#STO[:<n>][#CMP:...]: la prima #STO, le successive #STO:2, #STO:3, ... Canone e storno hanno competenza_mese = il mese del giro (fine del mese di p_competenza_mese, o l''oggi aziendale), competenza_dal/al = il pezzo. Esclusione gia'' inviato: script.fn_get_stato_push_segment = LIBERA. Righe senza periodicita'' o senza prezzo non partono: le segnala la dashboard (L8). Storia nei changeSet, l''ultimo 20261031-01: brief-db-contratto-righe-periodiche-in-commessa §6.12, §6.13.';
