# ------------------------------------------------------------
# Guard di coerenza semantica articolo <-> listino:
# la tipologia dell'articolo (catalogo.articoli.listino_tipologia_id)
# deve coincidere con la tipologia del listino a cui appartiene la
# versione in cui viene inserita la riga.
# Pricing v5 - riferimento sviluppo-listini-v5.md
# sezione 7.2.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/vendite/20260414-16-create-trgfn-listini-righe-guard-tipologia-mctit.yaml

    - changeSet:
          id: 20260414-16-create-trgfn-listini-righe-guard-tipologia
          author: mctit
          runOnChange: false
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_tipologia()
                            RETURNS trigger
                            LANGUAGE plpgsql
                        AS $$
                        DECLARE
                            v_articolo_tipologia_id catalogo.articoli.listino_tipologia_id%TYPE;
                            v_listino_tipologia_id  vendite.listini.tipologia_id%TYPE;
                        BEGIN
                            -- Recupera in una sola query articolo.tipologia e listino.tipologia
                            -- risalendo versione -> listino.
                            SELECT a.listino_tipologia_id, l.tipologia_id
                              INTO v_articolo_tipologia_id, v_listino_tipologia_id
                              FROM catalogo.articoli a
                              JOIN vendite.listini_versioni lv
                                ON lv.id = NEW.listino_versione_id
                              JOIN vendite.listini l
                                ON l.id = lv.listino_id
                             WHERE a.id = NEW.articolo_id;

                            -- Articolo senza tipologia: non puo' entrare in listino tipizzato.
                            -- Valori per %s del template: articolo_id, listino_versione_id.
                            IF v_articolo_tipologia_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite',
                                    TG_NAME,
                                    'E_ARTICOLO_TIPOLOGIA_MANCANTE',
                                    jsonb_build_object(
                                        'articolo_id', NEW.articolo_id,
                                        'listino_versione_id', NEW.listino_versione_id,
                                        'listino_tipologia_id', v_listino_tipologia_id
                                    ),
                                    NULL::uuid,
                                    NEW.articolo_id::text,
                                    NEW.listino_versione_id::text
                                );
                            END IF;

                            -- Incompatibilita' tra tipologia articolo e tipologia listino.
                            -- Valori per %s: articolo_id, articolo.tipologia, listino.tipologia, versione.
                            IF v_articolo_tipologia_id IS DISTINCT FROM v_listino_tipologia_id THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite',
                                    TG_NAME,
                                    'E_ARTICOLO_TIPOLOGIA_INCOMPATIBILE',
                                    jsonb_build_object(
                                        'articolo_id', NEW.articolo_id,
                                        'articolo_tipologia_id', v_articolo_tipologia_id,
                                        'listino_versione_id', NEW.listino_versione_id,
                                        'listino_tipologia_id', v_listino_tipologia_id
                                    ),
                                    NULL::uuid,
                                    NEW.articolo_id::text,
                                    v_articolo_tipologia_id::text,
                                    v_listino_tipologia_id::text,
                                    NEW.listino_versione_id::text
                                );
                            END IF;

                            RETURN NEW;
                        END
                        $$;

                        COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_tipologia() IS
                            'Guard BEFORE INS/UPD su vendite.listini_righe: articolo.listino_tipologia_id deve coincidere con listino.tipologia_id. Pricing v5.';

    - changeSet:
          id: 20260414-16-trg-listini-righe-guard-tipologia
          author: mctit
          runOnChange: false
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        DROP TRIGGER IF EXISTS trg_listini_righe_a10_guard_tipologia_ins_upd
                            ON vendite.listini_righe;
                        CREATE TRIGGER trg_listini_righe_a10_guard_tipologia_ins_upd
                            BEFORE INSERT OR UPDATE OF articolo_id, listino_versione_id
                            ON vendite.listini_righe
                            FOR EACH ROW
                            EXECUTE FUNCTION vendite.trgfn_listini_righe_guard_tipologia();
