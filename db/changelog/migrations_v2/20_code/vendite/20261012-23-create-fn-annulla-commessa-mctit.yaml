# ------------------------------------------------------------
# IL VERBO: ANNULLARE UNA COMMESSA, CON CONFERMA
#   vendite.fn_annulla_commessa(p_commessa_id, p_legami_confermati) -> integer
#   Brief: brief-db-annullo-a-valle-riapre-a-monte (D-1, D-2, D-3, D-7 di Tid; R-3)
#
# ── I LEGAMI DI UNA COMMESSA ────────────────────────────────────────
#   Le sue righe NON_EMESSA (vendite.fn_documento_legami('COMMESSA', id),
#   20261012-19): i documenti e i consumi che le hanno spinte tornano da
#   mandare, i resi tornano da accreditare, gli oneri si annullano. Le righe
#   EMESSA bloccano (script.fn_check_commessa_annullabile, D-3) e parlano
#   per prime, prima della conferma.
#
# ── COSA FA, IN ORDINE ──────────────────────────────────────────────
#   1. guard di parametro; 2. testata FOR UPDATE nel perimetro
#   (script.fn_scope_ef_whitelist_via_commessa; fuori: E_COMMESSA_NON_TROVATA,
#   come il verbo di stato); 3. prima cio' che vieta, conferma e ritiro dal
#   BB vendite.fn_documento_ritira_legami (20261012-22); 4. lo stato dal verbo
#   di stato della commessa, vendite.fn_cambia_stato_commessa (matrice e
#   motivi, lo stesso che chiama il backend); 5. porta chiusa.
#   UNA transazione. Lo stato dei preventivi lo riproietta il trigger delle
#   righe di commessa (20261012-15); l'ordine non cambia stato (D-6).
#   Stampo dei quattro verbi di D29 (vendite.fn_annulla_preventivo, ...).
#   SECURITY DEFINER con search_path bloccato. EXECUTE solo all'app.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261012-23-create-fn-annulla-commessa-mctit.yaml

  - changeSet:
      id: 20261012-23-create-fn-annulla-commessa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Verbo vendite.fn_annulla_commessa: annulla una commessa con conferma; le righe NON_EMESSA si
        ritirano dal verbo del loro genere (BB vendite.fn_documento_ritira_legami) e i documenti a
        monte si riaprono; poi lo stato passa ad ANNULLATA. SECURITY DEFINER.
        Brief: brief-db-annullo-a-valle-riapre-a-monte (D-1, D-2, R-3).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_documento_ritira_legami';
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_annulla_commessa';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_annulla_commessa(
                  p_commessa_id        vendite.commesse.id%TYPE,
                  p_legami_confermati  integer DEFAULT NULL)
              RETURNS integer
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare una commessa. Con legami: prima cio' che
              --   vieta, poi conferma e ritiro dal BB
              --   vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_commessa',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_commessa_id', p_commessa_id),
                          NULL::uuid, 'vendite.fn_annulla_commessa',
                          'p_commessa_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.commesse t
                   WHERE t.id = p_commessa_id
                     AND script.fn_scope_ef_whitelist_via_commessa(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_commessa',
                          'E_COMMESSA_NON_TROVATA',
                          jsonb_build_object('p_commessa_id', p_commessa_id), NULL::uuid,
                          p_commessa_id::text);
                  END IF;

                  -- 3. Prima cio' che vieta (righe EMESSA), poi conferma e ritiro:
                  --    il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('COMMESSA', p_commessa_id, p_legami_confermati);

                  -- 4. Lo stato. I guard della tabella fanno il resto: matrice,
                  --    motivi, avviso (che con le righe ritirate non ha piu' niente
                  --    da dire).
                  PERFORM vendite.fn_cambia_stato_commessa(p_commessa_id, 'ANNULLATA', NULL);

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_annulla_commessa(vendite.commesse.id%TYPE, integer) IS
                  'VERBO (2026-10-12, brief-db-annullo-a-valle-riapre-a-monte D-1/D-2/D-3/D-7 di Tid): annulla una commessa. Testata FOR UPDATE nel perimetro (script.fn_scope_ef_whitelist_via_commessa; fuori perimetro E_COMMESSA_NON_TROVATA). Dal BB vendite.fn_documento_ritira_legami: prima i motivi che vietano (script.fn_check_commessa_annullabile, righe EMESSA: E_COMMESSA_ANNULLA_CON_RIGHE_EMESSE), poi la conferma — chi conferma DICHIARA quanti legami ha visto (p_legami_confermati, le righe di vendite.fn_documento_legami(''COMMESSA'', id): le righe NON_EMESSA); se non corrisponde, E_DOC_ANNULLO_CON_LEGAMI — poi il ritiro: righe con sorgente ANNULLATA col registro (il documento o il consumo torna da mandare, il preventivo EVASO torna ACCETTATO dal trigger delle righe), accrediti annullati (il reso torna da accreditare), oneri annullati. Poi lo stato passa ad ANNULLATA (vendite.fn_cambia_stato_commessa: matrice e guard) e la porta del ritiro si chiude. L''ordine non cambia stato (D-6): torna solo da mandare. UNA transazione. Senza legami non c''e'' niente da confermare. Ritorna i legami confermati. SECURITY DEFINER con search_path bloccato. EXECUTE solo all''app.';

              REVOKE EXECUTE ON FUNCTION vendite.fn_annulla_commessa(vendite.commesse.id%TYPE, integer) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION vendite.fn_annulla_commessa(vendite.commesse.id%TYPE, integer) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_annulla_commessa(vendite.commesse.id%TYPE, integer);
