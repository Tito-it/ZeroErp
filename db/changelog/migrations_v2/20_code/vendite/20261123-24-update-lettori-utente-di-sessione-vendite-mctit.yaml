            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_chiudi_preventivi_scaduti()
               -- integer: un CONTEGGIO, nessuna colonna di cui sia il riflesso.
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_emesso_id   config.stati_doc_preventivi.id%TYPE;
                  v_scaduto_id  config.stati_doc_preventivi.id%TYPE;
                  v_id          vendite.preventivi.id%TYPE;
                  -- CONTEGGIO dei preventivi portati allo stato di scadenza.
                  v_n           integer := 0;
              BEGIN
                  -- ==========================================================
                  -- Scopo: portare allo stato di scadenza i preventivi emessi
                  --   con la validita' finita, nel perimetro della sessione.
                  --   Vedi l'intestazione del changeSet 20261031-66.
                  -- Ritorna: quanti preventivi sono scaduti.
                  -- ==========================================================
                  v_utente     := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  v_emesso_id  := script.fn_stato_emissione_id('vendite.preventivi'::regclass);
                  v_scaduto_id := script.fn_stato_scadenza_id('vendite.preventivi'::regclass);

                  IF v_emesso_id IS NULL OR v_scaduto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_chiudi_preventivi_scaduti',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_preventivi',
                                             'emesso_id', v_emesso_id, 'scaduto_id', v_scaduto_id),
                          NULL::uuid, 'stato di emissione e di scadenza (config.stati_doc_preventivi)');
                  END IF;

                  FOR v_id IN
                      SELECT p.id
                        FROM vendite.preventivi p
                       WHERE p.stato_doc_preventivo_id = v_emesso_id
                         AND p.validita_al IS NOT NULL
                         AND p.validita_al < (SELECT script.fn_data_operativa())
                         AND script.fn_scope_ef_whitelist_via_preventivo(v_utente, p.id)
                       ORDER BY p.id
                         FOR UPDATE OF p
                  LOOP
                      PERFORM script.fn_doc_scrivi_stato('vendite.preventivi'::regclass, v_id, v_scaduto_id);
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_chiudi_versioni_listino_scadute()
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente    config.user_override_azioni.auth_user_id%TYPE;
                  v_attiva_id config.stati_doc_listino_versioni.id%TYPE;
                  v_chiusa_id config.stati_doc_listino_versioni.id%TYPE;
                  v_id        vendite.listini_versioni.id%TYPE;
                  -- CONTEGGIO delle versioni chiuse.
                  v_n         integer := 0;
              BEGIN
                  -- ==========================================================
                  -- Scopo: chiudere le versioni attive scadute del perimetro.
                  --   Vedi l'intestazione del changeSet 20261028-13.
                  -- Ritorna: quante versioni sono state chiuse.
                  -- ==========================================================
                  v_utente    := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  v_attiva_id := script.fn_doc_stato_id('vendite.listini_versioni'::regclass, 'ATTIVA');
                  v_chiusa_id := script.fn_doc_stato_id('vendite.listini_versioni'::regclass, 'CHIUSA');

                  IF v_attiva_id IS NULL OR v_chiusa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_chiudi_versioni_listino_scadute',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_listino_versioni',
                                             'attiva_id', v_attiva_id, 'chiusa_id', v_chiusa_id),
                          NULL::uuid, 'stati ATTIVA e CHIUSA (config.stati_doc_listino_versioni)');
                  END IF;

                  FOR v_id IN
                      SELECT lv.id
                        FROM vendite.listini_versioni lv
                       WHERE lv.stato_doc_listino_versione_id = v_attiva_id
                         AND lv.valido_al IS NOT NULL
                         AND lv.valido_al < (SELECT script.fn_data_operativa())
                         AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id)
                       ORDER BY lv.id
                         FOR UPDATE OF lv
                  LOOP
                      PERFORM script.fn_doc_scrivi_stato('vendite.listini_versioni'::regclass, v_id, v_chiusa_id);
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_listini_attivi_uom_non_convertibili(
                  p_articolo_id  catalogo.articoli.id%TYPE,
                  p_uom_id       catalogo.unita_misura.id%TYPE,
                  p_uom_altra_id catalogo.unita_misura.id%TYPE)
               RETURNS TABLE(
                  riga_id             vendite.listini_righe.id%TYPE,
                  listino_versione_id vendite.listini_righe.listino_versione_id%TYPE,
                  listino_id          vendite.listini_versioni.listino_id%TYPE,
                  articolo_id         vendite.listini_righe.articolo_id%TYPE,
                  primo_giorno        date,
                  nel_perimetro       boolean)
               LANGUAGE sql
               STABLE
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pg_temp'
              BEGIN ATOMIC
               WITH r AS (
                        SELECT lr.id,
                           lr.listino_versione_id,
                           lv.listino_id,
                           lr.articolo_id,
                           catalogo.fn_uom_primo_giorno_non_convertibile(lr.articolo_id, lr.uom_id, lv.validita) AS primo,
                           script.fn_scope_ef_whitelist_via_listino_versione((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer, lr.listino_versione_id) AS visibile
                          FROM (((vendite.listini_righe lr
                            JOIN catalogo.articoli a ON ((a.id = lr.articolo_id)))
                            JOIN vendite.listini_versioni lv ON ((lv.id = lr.listino_versione_id)))
                            JOIN config.stati_doc_listino_versioni s ON ((s.id = lv.stato_doc_listino_versione_id)))
                         WHERE (((s.codice_interno)::text = 'ATTIVA'::text) AND (lv.attivo IS TRUE) AND (lr.attivo IS TRUE) AND
                               CASE
                                   WHEN (fn_listini_attivi_uom_non_convertibili.p_articolo_id IS NOT NULL) THEN ((lr.articolo_id = fn_listini_attivi_uom_non_convertibili.p_articolo_id) AND (lr.uom_id = fn_listini_attivi_uom_non_convertibili.p_uom_id))
                                   ELSE (((lr.uom_id = fn_listini_attivi_uom_non_convertibili.p_uom_id) AND (a.uom_id = fn_listini_attivi_uom_non_convertibili.p_uom_altra_id)) OR ((lr.uom_id = fn_listini_attivi_uom_non_convertibili.p_uom_altra_id) AND (a.uom_id = fn_listini_attivi_uom_non_convertibili.p_uom_id)))
                               END)
                       )
                SELECT
                       CASE
                           WHEN r.visibile THEN r.id
                           ELSE NULL::bigint
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.listino_versione_id
                           ELSE NULL::bigint
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.listino_id
                           ELSE NULL::bigint
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.articolo_id
                           ELSE NULL::uuid
                       END AS "case",
                   r.primo,
                   COALESCE(r.visibile, false) AS "coalesce"
                  FROM r
                 WHERE (r.primo IS NOT NULL)
                 ORDER BY COALESCE(r.visibile, false) DESC, r.primo, r.listino_id, r.id;
              END
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_prezzi_legame_oltre_la_fine(
                  p_articolo_componente_id vendite.listini_righe_componenti.articolo_componente_id%TYPE,
                  p_valido_al              vendite.listini_righe_componenti.valido_al%TYPE)
               RETURNS TABLE(
                  riga_id             vendite.listini_righe_componenti.id%TYPE,
                  listino_versione_id vendite.listini_righe_componenti.listino_versione_id%TYPE,
                  listino_id          vendite.listini.id%TYPE,
                  listino_codice      vendite.listini.codice%TYPE,
                  codice_versione     vendite.listini_versioni.codice_versione%TYPE,
                  stato_versione      config.stati_doc_listino_versioni.codice_interno%TYPE,
                  valido_dal          vendite.listini_righe_componenti.valido_dal%TYPE,
                  valido_al           vendite.listini_righe_componenti.valido_al%TYPE,
                  prezzo              vendite.listini_righe_componenti.prezzo%TYPE,
                  importo_per_kit     vendite.listini_righe_componenti.prezzo%TYPE,
                  attivo              vendite.listini_righe_componenti.attivo%TYPE,
                  nel_perimetro       boolean,
                  esito               text)
               LANGUAGE sql
               STABLE
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pg_temp'
              BEGIN ATOMIC
               WITH r AS (
                        SELECT lrc.id,
                           lrc.listino_versione_id,
                           lv.listino_id,
                           l.codice AS listino_codice,
                           lv.codice_versione,
                           s.codice_interno AS stato,
                           lrc.valido_dal,
                           lrc.valido_al,
                           lrc.prezzo,
                           (lrc.prezzo * ac.coeff_qta) AS importo_per_kit,
                           lrc.attivo,
                           script.fn_scope_ef_whitelist_via_listino_versione((NULLIF(current_setting('app.current_user_id'::text, true), ''::text))::integer, lrc.listino_versione_id) AS visibile,
                               CASE
                                   WHEN (lrc.valido_dal <= fn_prezzi_legame_oltre_la_fine.p_valido_al) THEN 'CHIUDE'::text
                                   WHEN s.iniziale THEN 'TOGLIE'::text
                                   ELSE 'BLOCCA'::text
                               END AS esito
                          FROM ((((vendite.listini_righe_componenti lrc
                            JOIN catalogo.articoli_componenti ac ON ((ac.id = lrc.articolo_componente_id)))
                            JOIN vendite.listini_versioni lv ON ((lv.id = lrc.listino_versione_id)))
                            JOIN vendite.listini l ON ((l.id = lv.listino_id)))
                            JOIN config.stati_doc_listino_versioni s ON ((s.id = lv.stato_doc_listino_versione_id)))
                         WHERE ((lrc.articolo_componente_id = fn_prezzi_legame_oltre_la_fine.p_articolo_componente_id) AND (fn_prezzi_legame_oltre_la_fine.p_valido_al IS NOT NULL) AND (COALESCE(lrc.valido_al, 'infinity'::date) > fn_prezzi_legame_oltre_la_fine.p_valido_al))
                       )
                SELECT
                       CASE
                           WHEN r.visibile THEN r.id
                           ELSE NULL::bigint
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.listino_versione_id
                           ELSE NULL::bigint
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.listino_id
                           ELSE NULL::bigint
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.listino_codice
                           ELSE NULL::character varying
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.codice_versione
                           ELSE NULL::character varying
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.stato
                           ELSE NULL::character varying
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.valido_dal
                           ELSE NULL::date
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.valido_al
                           ELSE NULL::date
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.prezzo
                           ELSE NULL::numeric
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.importo_per_kit
                           ELSE NULL::numeric
                       END AS "case",
                       CASE
                           WHEN r.visibile THEN r.attivo
                           ELSE NULL::boolean
                       END AS "case",
                   COALESCE(r.visibile, false) AS "coalesce",
                   r.esito
                  FROM r
                 ORDER BY COALESCE(r.visibile, false) DESC, r.listino_id, r.listino_versione_id, r.id;
              END
