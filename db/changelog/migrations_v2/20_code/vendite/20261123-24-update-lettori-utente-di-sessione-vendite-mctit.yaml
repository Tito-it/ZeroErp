# vendite: i lettori di app.current_user_id passano a script.fn_utente_di_sessione.
#   Brief: brief-db-revisione-ui (§3.6-sexies, giro 8; Q60 (a)).
#
# Il perche': ognuna convertiva la GUC da se',
#   NULLIF(current_setting('app.current_user_id', true), '')::integer, e un
#   valore che non e' un intero dava il 22P02 grezzo. Ora la legge il BB
#   (20261123-16): assente o vuota resta NULL, come prima; un valore che non
#   e' l'id di un utente da' E_SCRIPT_CHIAMATA_NON_VALIDA, col nome della
#   funzione che legge.
# Funzioni: fn_annulla_reso, fn_cambia_stato_ddt, fn_annulla_commessa,
#   fn_annulla_ddt, fn_annulla_ordine, fn_annulla_preventivo,
#   fn_cessa_contratti_scaduti, fn_conferma_reso, fn_fattura_proietta_stato,
#   fn_lotto_proietta_stato_step, fn_varia_prezzi_versione_listino,
#   fn_annulla_contratto, fn_cambia_stato_commessa, fn_cambia_stato_offerta,
#   fn_cambia_stato_preventivo, fn_cessa_contratto,
#   fn_ddt_riga_correggi_qta_evasa, fn_attiva_versione_listino,
#   trgfn_event_log_deriva_scope, fn_cambia_stato_lotto, fn_annulla_offerta,
#   fn_cambia_stato_contratto, fn_programma_chiusura_versione_listino,
#   fn_rettifica_riga_listino, fn_cambia_stato_ordine,
#   fn_chiudi_preventivi_scaduti, fn_chiudi_versioni_listino_scadute,
#   fn_listini_attivi_uom_non_convertibili, fn_prezzi_legame_oltre_la_fine.
# fn_listini_attivi_uom_non_convertibili e fn_prezzi_legame_oltre_la_fine hanno
#   il corpo BEGIN ATOMIC: ciascuna sta da sola nel suo change sql (pgjdbc non
#   spezza dopo l'END), il corpo e' quello normalizzato dal catalogo.
# Cambia solo la lettura. Corpo dal vivo (dbdev, 2026-11-23); firma, RETURNS e
#   attributi dall'ultimo changeSet che ha ancora i %TYPE. Firma, volatilita',
#   sicurezza, proprietario e GRANT invariati: CREATE OR REPLACE. La rollback
#   riporta i corpi di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261123-24-update-lettori-utente-di-sessione-vendite-mctit.yaml

  - changeSet:
      id: 20261123-24-update-lettori-utente-di-sessione-vendite
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite: le funzioni che leggono app.current_user_id passano a script.fn_utente_di_sessione invece
        di convertire la GUC da se'. Brief: brief-db-revisione-ui (§3.6-sexies, Q60).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "30"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname, p.proname) IN (('script', 'fn_utente_di_sessione'), ('vendite', 'fn_annulla_reso'), ('vendite', 'fn_cambia_stato_ddt'), ('vendite', 'fn_annulla_commessa'), ('vendite', 'fn_annulla_ddt'), ('vendite', 'fn_annulla_ordine'), ('vendite', 'fn_annulla_preventivo'), ('vendite', 'fn_cessa_contratti_scaduti'), ('vendite', 'fn_conferma_reso'), ('vendite', 'fn_fattura_proietta_stato'), ('vendite', 'fn_lotto_proietta_stato_step'), ('vendite', 'fn_varia_prezzi_versione_listino'), ('vendite', 'fn_annulla_contratto'), ('vendite', 'fn_cambia_stato_commessa'), ('vendite', 'fn_cambia_stato_offerta'), ('vendite', 'fn_cambia_stato_preventivo'), ('vendite', 'fn_cessa_contratto'), ('vendite', 'fn_ddt_riga_correggi_qta_evasa'), ('vendite', 'fn_attiva_versione_listino'), ('vendite', 'trgfn_event_log_deriva_scope'), ('vendite', 'fn_cambia_stato_lotto'), ('vendite', 'fn_annulla_offerta'), ('vendite', 'fn_cambia_stato_contratto'), ('vendite', 'fn_programma_chiusura_versione_listino'), ('vendite', 'fn_rettifica_riga_listino'), ('vendite', 'fn_cambia_stato_ordine'), ('vendite', 'fn_chiudi_preventivi_scaduti'), ('vendite', 'fn_chiudi_versioni_listino_scadute'), ('vendite', 'fn_listini_attivi_uom_non_convertibili'), ('vendite', 'fn_prezzi_legame_oltre_la_fine'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6e): la destinazione e' lo stato
              --   di annullo (script.fn_stato_abortito_id); E_RESO_STATO_NON_ANNULLABILE dove
              --   la matrice non ha il passaggio (script.fn_doc_passaggio); lo storno se lo
              --   stato di partenza e' quello di emissione. Dove sotto si legge DRAFT,
              --   CONFERMATO o ANNULLATO, vale lo stato che il vocabolario e la matrice
              --   dicono.
              -- ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-f):
              --   VERBO del modello «una scrittura = un verbo». SECURITY DEFINER con
              --   search_path bloccato (ogni nome qui dentro e' qualificato), testata presa
              --   FOR UPDATE con il predicato della policy nella WHERE (fuori perimetro:
              --   E_RESO_NOT_FOUND, no-leak, come prima sotto RLS).
              -- ⭐ rev 2026-10-25 (20261025-18, brief-modello-documento-vendita §7): il
              --   permesso dalla riga del passaggio (script.fn_guard_passaggio:
              --   CONFERMATO -> ANNULLATO chiede conferma_reso, DRAFT -> ANNULLATO il solo
              --   permesso sul documento, M-4), prima di qualunque scrittura; lo stato del
              --   reso e quello della bolla dalla scrittura comune (script.fn_doc_scrivi_stato),
              --   attraverso la porta.
              -- rev 2026-11-03 (20261103-32, brief-db-addebito-trasporto-ordine §8.1):
              --   il ri-flip RESO -> CONSEGNATO (non piu' totale) conta solo la MERCE della bolla
              --   (script.fn_natura_e_merce): un onere non si rende, e senza il
              --   filtro una bolla con un onere non cambierebbe mai stato.
              DECLARE
                  v_utente            config.user_override_azioni.auth_user_id%TYPE;
                  v_reso              vendite.resi%ROWTYPE;
                  v_muove             boolean;   -- calcolato, nessuna colonna
                  v_stato            config.stati_doc_reso.codice_interno%TYPE;
                  v_emissione        config.stati_doc_reso.emissione%TYPE;
                  v_stato_ann_id     config.stati_doc_reso.id%TYPE;
                  v_ddt_id           vendite.ddt.id%TYPE;
                  v_ddt_stato        config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_cons_id    config.stati_doc_ddt.id%TYPE;
                  v_tutto_reso       boolean;
                  v_ord              RECORD;
                  v_sorgente_id      config.sorgenti.id%TYPE;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_annulla_reso');
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT r.* INTO v_reso
                    FROM vendite.resi r
                   WHERE r.id = p_reso_id
                     AND script.fn_scope_ef_whitelist_via_reso(v_utente, r.id)
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  SELECT sdr.codice_interno, sdr.emissione INTO v_stato, v_emissione
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = v_reso.stato_doc_reso_id;

                  -- Il permesso del passaggio, prima di scrivere qualunque cosa: dalla sua
                  -- riga della matrice (M-3). Chi fa disfa: l'annullo di un reso CONFERMATO
                  -- chiede conferma_reso; quello di una bozza solo il permesso sul documento,
                  -- che controlla il backend (M-4).
                  -- La destinazione: lo stato di annullo del vocabolario.
                  v_stato_ann_id := script.fn_stato_abortito_id('vendite.resi'::regclass);
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.resi'::regclass,
                                                    v_reso.stato_doc_reso_id, v_stato_ann_id);

                  -- Da dove si annulla lo dice la matrice: il passaggio che il guard ha
                  -- appena letto. Senza, lo stato non e' annullabile.
                  IF NOT EXISTS (SELECT 1
                                   FROM script.fn_doc_passaggio('vendite.resi'::regclass,
                                                                v_reso.stato_doc_reso_id, v_stato_ann_id)) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_STATO_NON_ANNULLABILE',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_stato),
                          NULL::uuid, p_reso_id::text, v_stato);
                  END IF;

                  -- Reso gia' ri-spedito -> storno complesso fuori scope.
                  IF EXISTS (
                      SELECT 1
                        FROM vendite.resi_righe_riconsegne rrr
                        JOIN vendite.resi_righe rr ON rr.id = rrr.resi_riga_id
                       WHERE rr.reso_id = p_reso_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_ANNULLO_CON_RICONSEGNE',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- ⛔ Reso gia' ACCREDITATO -> l'annullo si RIFIUTA.
                  --    Gemella di E_RESO_ANNULLO_CON_RICONSEGNE: stessa classe di
                  --    problema, un effetto gia' in viaggio. Qui l'effetto e' una
                  --    rettifica a quantita' NEGATIVA in vendite.commesse_attivita,
                  --    che il giro di fatturazione raccoglie da se': annullare il
                  --    reso senza disfarla emetterebbe una nota di credito per un
                  --    reso che non esiste piu'. E il lister non ripara a valle -
                  --    vendite.fn_list_emittibili_lane e
                  --    vendite.fn_emit_attivita_fatturabili_da_commessa non nominano
                  --    mai il reso: per loro quella rettifica e' materia normale.
                  --
                  -- ⚠️ IL PREDICATO E' L'ESISTENZA DEL PONTE, NON LO STATO DELLE
                  --    RETTIFICHE. Se l'accredito e' ormai troppo tardi per essere
                  --    disfatto lo dice la sua madre con il proprio messaggio
                  --    (E_ACCREDITO_ANNULLO_NON_AMMESSO): ricalcolare qui «tutte
                  --    NON_EMESSA» sarebbe una seconda copia della stessa regola,
                  --    destinata a divergere al primo ritocco.
                  --
                  -- ⛔ SI RIFIUTA, NON SI CASCATA. vendite.fn_annulla_accredito_riga_reso
                  --    pretende un motivo obbligatorio (E_ACCREDITO_MOTIVO_OBBLIGATORIO)
                  --    e la traccia del perche' vive solo in commesse_attivita_log:
                  --    una cascata automatica dovrebbe inventarselo. E se anche una
                  --    sola rettifica ha lasciato NON_EMESSA, quella madre rifiuta:
                  --    li' l'annullo del reso non deve avvenire affatto, non avvenire
                  --    a meta'.
                  --
                  -- ⭐⚠️ VINCOLO RECIPROCO, ora su TRE posti (C-3): questa guardia,
                  --    script.fn_check_rinuncia_reversibile e la madre dell'annullo
                  --    accredito. Si auto-ripara perche' l'annullo dell'accredito
                  --    CANCELLA le righe di ponte - ed e' anche il motivo per cui
                  --    E_ACCREDITO_NON_TROVATO copre insieme «mai accreditato» e
                  --    «gia' annullato». Se un giorno diventasse un soft-delete,
                  --    questo ramo continuerebbe a vedere la riga e vieterebbe PER
                  --    SEMPRE l'annullo di un reso ormai annullabile, IN SILENZIO:
                  --    i tre posti si cambiano INSIEME.
                  --
                  -- ⚠️ Sta DOPO le ri-consegne di proposito: un reso che ha entrambe
                  --    rispondeva gia' con E_RESO_ANNULLO_CON_RICONSEGNE, e cambiargli
                  --    messaggio adesso non direbbe nulla di piu' a chi lo legge.
                  --    Nessuna delle due tabelle lette ha la RLS (ce l'ha solo
                  --    vendite.resi, gia' attraversata sopra): qui uno zero e' un
                  --    dato, non un fail-closed.
                  IF EXISTS (
                      SELECT 1
                        FROM vendite.resi_righe rr
                        JOIN vendite.resi_righe_accrediti a ON a.resi_riga_id = rr.id
                       WHERE rr.reso_id = p_reso_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_ANNULLO_CON_ACCREDITO',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- La merce che era rientrata (rev 2026-09-28): letta PRIMA di cambiare
                  -- lo stato, sulla riga del reso com'e'.
                  v_muove := vendite.fn_reso_muove_merce(v_reso);

                  -- Transizione -> ANNULLATO, dalla scrittura comune: la porta si apre per
                  -- QUESTO reso.
                  PERFORM script.fn_doc_scrivi_stato('vendite.resi'::regclass, p_reso_id, v_stato_ann_id);

                  -- Storno effetti solo se il reso era emesso: gli effetti (ordine, bolla,
                  -- carichi) nascono alla conferma, che e' l'emissione (la colonna
                  -- emissione dello stato di partenza).
                  IF v_emissione THEN
                      FOR v_ord IN
                          SELECT DISTINCT orr.ordine_id
                            FROM vendite.resi_righe rr
                            JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                            JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                           WHERE rr.reso_id = p_reso_id
                             AND tr.riapre_residuo IS TRUE
                      LOOP
                          -- ⭐ rev 2026-10-11: la proiezione e' il building block
                          --    vendite.fn_ordine_proietta_stato_evasione (brief-db-ddt-righe-evase-dall-ordine).
                          PERFORM vendite.fn_ordine_proietta_stato_evasione(v_ord.ordine_id);
                      END LOOP;

                      -- Ri-flip DDT RESO->CONSEGNATO se non piu' reso totale (passaggio di
                      -- processo: lo scrive questo verbo, con la sola scrittura comune).
                      SELECT d.id, sdd.codice_interno
                        INTO v_ddt_id, v_ddt_stato
                        FROM vendite.ddt d
                        JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                       WHERE d.id = v_reso.sorgente_id;

                      IF v_ddt_id IS NOT NULL AND v_ddt_stato = 'RESO' THEN
                          SELECT bool_and(COALESCE(reso_riga.tot, 0) >= dr.quantita)
                            INTO v_tutto_reso
                            FROM vendite.ddt_righe dr
                            LEFT JOIN (
                                -- rev 2026-07-17 (step 2): fonte unica
                                -- vw_resi_righe_effettive (CONFERMATE + attive,
                                -- tutti i tipi). Il ri-flip non filtra il tipo.
                                SELECT e.ddt_riga_id, SUM(e.quantita) AS tot
                                  FROM vendite.vw_resi_righe_effettive e
                                 GROUP BY e.ddt_riga_id
                            ) reso_riga ON reso_riga.ddt_riga_id = dr.id
                           WHERE dr.ddt_id = v_ddt_id
                             AND dr.attivo IS TRUE
                             -- rev 2026-11-03: solo la merce (un onere non si rende).
                             AND script.fn_natura_e_merce(dr.natura_vendita_id);

                          IF NOT COALESCE(v_tutto_reso, false) THEN
                              SELECT id INTO v_stato_cons_id FROM config.stati_doc_ddt
                               WHERE codice_interno = 'CONSEGNATO' AND attivo IS TRUE;
                              PERFORM script.fn_doc_scrivi_stato('vendite.ddt'::regclass, v_ddt_id, v_stato_cons_id);
                          END IF;
                      END IF;

                      -- Lo storno dei carichi (rev 2026-09-28, M-8): la merce riesce con
                      -- una riga opposta, al costo del carico. Se nel frattempo e' gia'
                      -- uscita di nuovo, la primitiva rifiuta l'uscita dello storno: il
                      -- registro non va sotto zero per un annullo.
                      IF v_muove THEN
                          -- Lo storno per DOCUMENTO: i carichi del reso, tutti (righe NULL).
                          -- ⛔ Il tipo che manca non e' «niente da stornare»: e' una
                          --    configurazione rotta, e un annullo che non storna lascerebbe
                          --    in giacenza merce che non c'e'.
                          SELECT s.id INTO v_sorgente_id
                            FROM config.sorgenti s
                           WHERE s.codice_interno = 'RESO_VENDITA';
                          IF v_sorgente_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_annulla_reso',
                                  'E_CONFIG_MANCANTE',
                                  jsonb_build_object('config', 'config.sorgenti.RESO_VENDITA'),
                                  NULL::uuid, VARIADIC ARRAY['sorgente RESO_VENDITA (config.sorgenti)']);
                          END IF;
                          PERFORM 1 FROM magazzino.fn_storna_movimenti_sorgente(
                                             v_sorgente_id, NULL::bigint[], p_sorgente_id => p_reso_id);
                      END IF;
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_ddt(
                  p_ddt_id vendite.ddt.id%TYPE,
                  p_stato  config.stati_doc_ddt.codice_interno%TYPE)
               RETURNS TABLE(
                  movimento_id magazzino.movimenti.id%TYPE,
                  prelievo_id  vendite.ddt_righe_prelievi.id%TYPE,
                  qta          magazzino.movimenti.qta%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              -- Scopo: portare una bolla in un nuovo stato e, se il passaggio tocca il
              --   registro di una bolla che muove merce, scrivere i movimenti nella
              --   stessa transazione. Vedi l'intestazione del changeSet.
              -- Ritorna: i movimenti scritti (uscite, entrate o storni); nessuna riga
              --   se il passaggio non tocca il registro.
              -- rev 2026-10-25 (20261025-16, brief-modello-documento-vendita §7): il
              --   permesso dalla riga del passaggio (script.fn_guard_passaggio), lo
              --   stato dalla scrittura comune (script.fn_doc_scrivi_stato).
              DECLARE
                  v_utente       config.user_override_azioni.auth_user_id%TYPE;
                  v_ddt          vendite.ddt%ROWTYPE;
                  v_da           config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_a_id   config.stati_doc_ddt.id%TYPE;
                  v_causale      config.causali_trasporto.causale_magazzino%TYPE;
                  v_muove        boolean;
                  v_emissione    boolean;
                  v_emesso_id    config.stati_doc_ddt.id%TYPE;
                  v_annullo      boolean;
                  v_consegna_tr  boolean;
                  v_sorgente_id  config.sorgenti.id%TYPE;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_cambia_stato_ddt');

                  -- Guard di parametro: forme che nessuna interfaccia produce.
                  IF p_ddt_id IS NULL OR p_ddt_id <= 0 OR p_stato IS NULL OR btrim(p_stato) = '' THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'bolla maggiore di zero e stato di destinazione obbligatorio',
                                             'p_ddt_id', p_ddt_id, 'p_stato', p_stato),
                          NULL::uuid, 'vendite.fn_cambia_stato_ddt',
                          'p_ddt_id (obbligatorio, maggiore di zero), p_stato (codice dello stato di destinazione)');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT d.* INTO v_ddt
                    FROM vendite.ddt d
                   WHERE d.id = p_ddt_id
                     AND script.fn_scope_ef_whitelist_via_ddt(v_utente, d.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                          'E_DDT_NOT_FOUND', jsonb_build_object('ddt_id', p_ddt_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  SELECT s.codice_interno INTO v_da FROM config.stati_doc_ddt s WHERE s.id = v_ddt.stato_doc_ddt_id;
                  -- rev 2026-10-25 (20261025-44): codice -> id dal lettore comune.
                  -- rev 2026-10-26 (20261026-02): lo stato sconosciuto come i gemelli
                  -- (fn_cambia_stato_ordine, fn_cambia_stato_preventivo).
                  v_stato_a_id := script.fn_doc_stato_id('vendite.ddt'::regclass, p_stato);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                          'E_STATO_WORKFLOW_NON_TROVATO',
                          jsonb_build_object('codice', p_stato),
                          NULL::uuid,
                          COALESCE(p_stato, 'NULL'));
                  END IF;

                  -- Il permesso del passaggio, prima di scrivere qualunque cosa: dalla
                  -- sua riga della matrice (M-3). Un passaggio di processo chiesto qui
                  -- (CONSEGNATO <-> RESO, dei verbi del reso) si ferma qui, e cosi' lo
                  -- stato che la bolla ha gia' (rev 2026-10-26, 20261026-01).
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.ddt'::regclass,
                                                    v_ddt.stato_doc_ddt_id, v_stato_a_id);

                  v_causale     := vendite.fn_ddt_causale_magazzino(v_ddt);
                  v_muove       := vendite.fn_ddt_muove_merce(v_ddt);
                  -- rev 2026-10-25 (20261025-44): lo stato di emissione dal
                  -- vocabolario, non dal letterale (l'emissione si raggiunge solo
                  -- dalla bozza: lo dice la matrice).
                  v_emesso_id   := script.fn_stato_emissione_id('vendite.ddt'::regclass);
                  v_emissione   := v_stato_a_id = v_emesso_id;
                  -- rev 2026-10-25 (20261025-78): lo stato d'annullo dal vocabolario.
                  v_annullo     := v_ddt.stato_doc_ddt_id = v_emesso_id
                                   AND v_stato_a_id = script.fn_stato_abortito_id('vendite.ddt'::regclass);
                  v_consegna_tr := p_stato = 'CONSEGNATO' AND v_causale = 'TRASF_OUT' AND v_muove;

                  -- Il permesso dell'operazione di magazzino dentro il passaggio: la
                  -- consegna di un trasferimento scrive gli arrivi (T-4 di Tid).
                  IF v_consegna_tr THEN
                      PERFORM script.fn_guard_azione(v_utente, 'registra_magazzino');
                  END IF;

                  -- All'emissione di una bolla che muove merce: la conferma che parla,
                  -- poi i prelievi automatici, finche' la bolla e' in bozza.
                  IF v_emissione AND v_muove THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', 'vendite.fn_cambia_stato_ddt',
                          script.fn_check_ddt_merce(v_ddt), NULL, NULL::uuid,
                          jsonb_build_object('ddt_id', p_ddt_id));

                      INSERT INTO vendite.ddt_righe_prelievi (ddt_riga_id, ddt_riga_componente_id, qta)
                      SELECT m.ddt_riga_id, m.ddt_riga_componente_id, m.qta
                        FROM vendite.fn_ddt_merce_da_movimentare(v_ddt) m
                       WHERE m.prelevata = 0
                         AND m.automatico;
                  END IF;

                  -- Lo stato, dalla scrittura comune: la porta si apre per QUESTA bolla,
                  -- e i guard di sempre girano.
                  PERFORM script.fn_doc_scrivi_stato('vendite.ddt'::regclass, p_ddt_id, v_stato_a_id);

                  -- I movimenti.
                  IF v_emissione AND v_muove THEN
                      RETURN QUERY
                          SELECT pd.movimento_id, pd.prelievo_id, pd.qta
                            FROM vendite.fn_posta_ddt(p_ddt_id, 'USCITA') pd;
                  ELSIF v_consegna_tr THEN
                      RETURN QUERY
                          SELECT pd.movimento_id, pd.prelievo_id, pd.qta
                            FROM vendite.fn_posta_ddt(p_ddt_id, 'ARRIVO') pd;
                  ELSIF v_annullo AND v_muove THEN
                      -- Lo storno per DOCUMENTO: i movimenti della bolla, tutti (righe NULL).
                      -- ⛔ Il tipo che manca non e' «niente da stornare»: e' una configurazione
                      --    rotta, e un annullo che non storna lascerebbe la giacenza falsa.
                      SELECT s.id INTO v_sorgente_id
                        FROM config.sorgenti s
                       WHERE s.codice_interno = 'DDT_VENDITA';
                      IF v_sorgente_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                              'E_CONFIG_MANCANTE',
                              jsonb_build_object('config', 'config.sorgenti.DDT_VENDITA'),
                              NULL::uuid, VARIADIC ARRAY['sorgente DDT_VENDITA (config.sorgenti)']);
                      END IF;
                      RETURN QUERY
                          SELECT st.movimento_id, NULL::bigint, st.qta
                            FROM magazzino.fn_storna_movimenti_sorgente(
                                     v_sorgente_id, NULL::bigint[], p_sorgente_id => p_ddt_id) st;
                  END IF;

                  RETURN;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_commessa(
                  p_commessa_id        vendite.commesse.id%TYPE,
                  p_legami_confermati  integer DEFAULT NULL)
              RETURNS integer
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare una commessa. Con legami: prima cio' che
              --   vieta, poi conferma e ritiro dal BB
              --   vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  -- Esito della presa della testata (SELECT true): un flag, nessuna
                  -- colonna di cui sia il riflesso.
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_annulla_commessa');

                  -- 1. Parametri.
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_commessa',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_commessa_id', p_commessa_id),
                          NULL::uuid, 'vendite.fn_annulla_commessa',
                          'p_commessa_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.commesse t
                   WHERE t.id = p_commessa_id
                     AND script.fn_scope_ef_whitelist_via_commessa(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_commessa',
                          'E_COMMESSA_NON_TROVATA',
                          jsonb_build_object('p_commessa_id', p_commessa_id), NULL::uuid,
                          p_commessa_id::text);
                  END IF;

                  -- 3. Prima cio' che vieta (righe EMESSA), poi conferma e ritiro:
                  --    il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('COMMESSA', p_commessa_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato (rev 2026-10-26, 20261026-33,
                  --    brief-modello-documento-vendita §14): firma senza p_user (C-4),
                  --    lo stato d'annullo dal vocabolario, non dal letterale. La prima
                  --    riga del verbo chiede l'azione del passaggio (cambia_stato_commessa
                  --    sull'annullo di una commessa non in bozza, C-1); i guard della
                  --    tabella fanno il resto: matrice, motivi, avviso (che con le righe
                  --    ritirate non ha piu' niente da dire).
                  PERFORM vendite.fn_cambia_stato_commessa(
                      p_commessa_id,
                      script.fn_doc_stato_codice('vendite.commesse'::regclass,
                                                 script.fn_stato_abortito_id('vendite.commesse'::regclass)));

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_ddt(
                  p_ddt_id            vendite.ddt.id%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
              RETURNS TABLE(
                  movimento_id magazzino.movimenti.id%TYPE,
                  prelievo_id  vendite.ddt_righe_prelievi.id%TYPE,
                  qta          magazzino.movimenti.qta%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$

              #variable_conflict use_column
              -- =========================================================
              -- Scopo: annullare una bolla. Con legami: conferma e ritiro dal
              --   BB vendite.fn_documento_ritira_legami, poi lo stato dal verbo
              --   di stato. p_legami_confermati e' un CONTEGGIO: tipo nudo.
              --   Vedi l'intestazione del changeSet.
              -- Ritorna: i movimenti di storno del verbo di stato (nessuno se
              --   la bolla non muove merce).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_annulla_ddt');

                  -- 1. Parametri.
                  IF p_ddt_id IS NULL OR p_ddt_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ddt',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ddt_id', p_ddt_id),
                          NULL::uuid, 'vendite.fn_annulla_ddt',
                          'p_ddt_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.ddt d
                   WHERE d.id = p_ddt_id
                     AND script.fn_scope_ef_whitelist_via_ddt(v_utente, d.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ddt',
                          'E_DDT_NOT_FOUND', jsonb_build_object('ddt_id', p_ddt_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  PERFORM vendite.fn_documento_ritira_legami('DDT_VENDITA', p_ddt_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato: matrice, permesso, storno. Lo stato
                  --    di annullo e' quello che il vocabolario marca (is_abortito; rev
                  --    2026-11-14, giro 6d), come in vendite.fn_annulla_ordine.
                  RETURN QUERY
                      SELECT c.movimento_id, c.prelievo_id, c.qta
                        FROM vendite.fn_cambia_stato_ddt(
                                 p_ddt_id,
                                 script.fn_doc_stato_codice('vendite.ddt'::regclass,
                                                            script.fn_stato_abortito_id('vendite.ddt'::regclass))) AS c;

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
