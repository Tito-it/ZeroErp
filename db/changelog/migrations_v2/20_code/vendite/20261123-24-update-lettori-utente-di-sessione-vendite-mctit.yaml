            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6e): la destinazione e' lo stato
              --   di annullo (script.fn_stato_abortito_id); E_RESO_STATO_NON_ANNULLABILE dove
              --   la matrice non ha il passaggio (script.fn_doc_passaggio); lo storno se lo
              --   stato di partenza e' quello di emissione. Dove sotto si legge DRAFT,
              --   CONFERMATO o ANNULLATO, vale lo stato che il vocabolario e la matrice
              --   dicono.
              -- ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-f):
              --   VERBO del modello «una scrittura = un verbo». SECURITY DEFINER con
              --   search_path bloccato (ogni nome qui dentro e' qualificato), testata presa
              --   FOR UPDATE con il predicato della policy nella WHERE (fuori perimetro:
              --   E_RESO_NOT_FOUND, no-leak, come prima sotto RLS).
              -- ⭐ rev 2026-10-25 (20261025-18, brief-modello-documento-vendita §7): il
              --   permesso dalla riga del passaggio (script.fn_guard_passaggio:
              --   CONFERMATO -> ANNULLATO chiede conferma_reso, DRAFT -> ANNULLATO il solo
              --   permesso sul documento, M-4), prima di qualunque scrittura; lo stato del
              --   reso e quello della bolla dalla scrittura comune (script.fn_doc_scrivi_stato),
              --   attraverso la porta.
              -- rev 2026-11-03 (20261103-32, brief-db-addebito-trasporto-ordine §8.1):
              --   il ri-flip RESO -> CONSEGNATO (non piu' totale) conta solo la MERCE della bolla
              --   (script.fn_natura_e_merce): un onere non si rende, e senza il
              --   filtro una bolla con un onere non cambierebbe mai stato.
              DECLARE
                  v_utente            config.user_override_azioni.auth_user_id%TYPE;
                  v_reso              vendite.resi%ROWTYPE;
                  v_muove             boolean;   -- calcolato, nessuna colonna
                  v_stato            config.stati_doc_reso.codice_interno%TYPE;
                  v_emissione        config.stati_doc_reso.emissione%TYPE;
                  v_stato_ann_id     config.stati_doc_reso.id%TYPE;
                  v_ddt_id           vendite.ddt.id%TYPE;
                  v_ddt_stato        config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_cons_id    config.stati_doc_ddt.id%TYPE;
                  v_tutto_reso       boolean;
                  v_ord              RECORD;
                  v_sorgente_id      config.sorgenti.id%TYPE;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT r.* INTO v_reso
                    FROM vendite.resi r
                   WHERE r.id = p_reso_id
                     AND script.fn_scope_ef_whitelist_via_reso(v_utente, r.id)
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  SELECT sdr.codice_interno, sdr.emissione INTO v_stato, v_emissione
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = v_reso.stato_doc_reso_id;

                  -- Il permesso del passaggio, prima di scrivere qualunque cosa: dalla sua
                  -- riga della matrice (M-3). Chi fa disfa: l'annullo di un reso CONFERMATO
                  -- chiede conferma_reso; quello di una bozza solo il permesso sul documento,
                  -- che controlla il backend (M-4).
                  -- La destinazione: lo stato di annullo del vocabolario.
                  v_stato_ann_id := script.fn_stato_abortito_id('vendite.resi'::regclass);
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.resi'::regclass,
                                                    v_reso.stato_doc_reso_id, v_stato_ann_id);

                  -- Da dove si annulla lo dice la matrice: il passaggio che il guard ha
                  -- appena letto. Senza, lo stato non e' annullabile.
                  IF NOT EXISTS (SELECT 1
                                   FROM script.fn_doc_passaggio('vendite.resi'::regclass,
                                                                v_reso.stato_doc_reso_id, v_stato_ann_id)) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_STATO_NON_ANNULLABILE',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_stato),
                          NULL::uuid, p_reso_id::text, v_stato);
                  END IF;

                  -- Reso gia' ri-spedito -> storno complesso fuori scope.
                  IF EXISTS (
                      SELECT 1
                        FROM vendite.resi_righe_riconsegne rrr
                        JOIN vendite.resi_righe rr ON rr.id = rrr.resi_riga_id
                       WHERE rr.reso_id = p_reso_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_ANNULLO_CON_RICONSEGNE',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- ⛔ Reso gia' ACCREDITATO -> l'annullo si RIFIUTA.
                  --    Gemella di E_RESO_ANNULLO_CON_RICONSEGNE: stessa classe di
                  --    problema, un effetto gia' in viaggio. Qui l'effetto e' una
                  --    rettifica a quantita' NEGATIVA in vendite.commesse_attivita,
                  --    che il giro di fatturazione raccoglie da se': annullare il
                  --    reso senza disfarla emetterebbe una nota di credito per un
                  --    reso che non esiste piu'. E il lister non ripara a valle -
                  --    vendite.fn_list_emittibili_lane e
                  --    vendite.fn_emit_attivita_fatturabili_da_commessa non nominano
                  --    mai il reso: per loro quella rettifica e' materia normale.
                  --
                  -- ⚠️ IL PREDICATO E' L'ESISTENZA DEL PONTE, NON LO STATO DELLE
                  --    RETTIFICHE. Se l'accredito e' ormai troppo tardi per essere
                  --    disfatto lo dice la sua madre con il proprio messaggio
                  --    (E_ACCREDITO_ANNULLO_NON_AMMESSO): ricalcolare qui «tutte
                  --    NON_EMESSA» sarebbe una seconda copia della stessa regola,
                  --    destinata a divergere al primo ritocco.
                  --
                  -- ⛔ SI RIFIUTA, NON SI CASCATA. vendite.fn_annulla_accredito_riga_reso
                  --    pretende un motivo obbligatorio (E_ACCREDITO_MOTIVO_OBBLIGATORIO)
                  --    e la traccia del perche' vive solo in commesse_attivita_log:
                  --    una cascata automatica dovrebbe inventarselo. E se anche una
                  --    sola rettifica ha lasciato NON_EMESSA, quella madre rifiuta:
                  --    li' l'annullo del reso non deve avvenire affatto, non avvenire
                  --    a meta'.
                  --
                  -- ⭐⚠️ VINCOLO RECIPROCO, ora su TRE posti (C-3): questa guardia,
                  --    script.fn_check_rinuncia_reversibile e la madre dell'annullo
                  --    accredito. Si auto-ripara perche' l'annullo dell'accredito
                  --    CANCELLA le righe di ponte - ed e' anche il motivo per cui
                  --    E_ACCREDITO_NON_TROVATO copre insieme «mai accreditato» e
                  --    «gia' annullato». Se un giorno diventasse un soft-delete,
                  --    questo ramo continuerebbe a vedere la riga e vieterebbe PER
                  --    SEMPRE l'annullo di un reso ormai annullabile, IN SILENZIO:
                  --    i tre posti si cambiano INSIEME.
                  --
                  -- ⚠️ Sta DOPO le ri-consegne di proposito: un reso che ha entrambe
                  --    rispondeva gia' con E_RESO_ANNULLO_CON_RICONSEGNE, e cambiargli
                  --    messaggio adesso non direbbe nulla di piu' a chi lo legge.
                  --    Nessuna delle due tabelle lette ha la RLS (ce l'ha solo
                  --    vendite.resi, gia' attraversata sopra): qui uno zero e' un
                  --    dato, non un fail-closed.
                  IF EXISTS (
                      SELECT 1
                        FROM vendite.resi_righe rr
                        JOIN vendite.resi_righe_accrediti a ON a.resi_riga_id = rr.id
                       WHERE rr.reso_id = p_reso_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_annulla_reso','E_RESO_ANNULLO_CON_ACCREDITO',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- La merce che era rientrata (rev 2026-09-28): letta PRIMA di cambiare
                  -- lo stato, sulla riga del reso com'e'.
                  v_muove := vendite.fn_reso_muove_merce(v_reso);

                  -- Transizione -> ANNULLATO, dalla scrittura comune: la porta si apre per
                  -- QUESTO reso.
                  PERFORM script.fn_doc_scrivi_stato('vendite.resi'::regclass, p_reso_id, v_stato_ann_id);

                  -- Storno effetti solo se il reso era emesso: gli effetti (ordine, bolla,
                  -- carichi) nascono alla conferma, che e' l'emissione (la colonna
                  -- emissione dello stato di partenza).
                  IF v_emissione THEN
                      FOR v_ord IN
                          SELECT DISTINCT orr.ordine_id
                            FROM vendite.resi_righe rr
                            JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                            JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                           WHERE rr.reso_id = p_reso_id
                             AND tr.riapre_residuo IS TRUE
                      LOOP
                          -- ⭐ rev 2026-10-11: la proiezione e' il building block
                          --    vendite.fn_ordine_proietta_stato_evasione (brief-db-ddt-righe-evase-dall-ordine).
                          PERFORM vendite.fn_ordine_proietta_stato_evasione(v_ord.ordine_id);
                      END LOOP;

                      -- Ri-flip DDT RESO->CONSEGNATO se non piu' reso totale (passaggio di
                      -- processo: lo scrive questo verbo, con la sola scrittura comune).
                      SELECT d.id, sdd.codice_interno
                        INTO v_ddt_id, v_ddt_stato
                        FROM vendite.ddt d
                        JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                       WHERE d.id = v_reso.sorgente_id;

                      IF v_ddt_id IS NOT NULL AND v_ddt_stato = 'RESO' THEN
                          SELECT bool_and(COALESCE(reso_riga.tot, 0) >= dr.quantita)
                            INTO v_tutto_reso
                            FROM vendite.ddt_righe dr
                            LEFT JOIN (
                                -- rev 2026-07-17 (step 2): fonte unica
                                -- vw_resi_righe_effettive (CONFERMATE + attive,
                                -- tutti i tipi). Il ri-flip non filtra il tipo.
                                SELECT e.ddt_riga_id, SUM(e.quantita) AS tot
                                  FROM vendite.vw_resi_righe_effettive e
                                 GROUP BY e.ddt_riga_id
                            ) reso_riga ON reso_riga.ddt_riga_id = dr.id
                           WHERE dr.ddt_id = v_ddt_id
                             AND dr.attivo IS TRUE
                             -- rev 2026-11-03: solo la merce (un onere non si rende).
                             AND script.fn_natura_e_merce(dr.natura_vendita_id);

                          IF NOT COALESCE(v_tutto_reso, false) THEN
                              SELECT id INTO v_stato_cons_id FROM config.stati_doc_ddt
                               WHERE codice_interno = 'CONSEGNATO' AND attivo IS TRUE;
                              PERFORM script.fn_doc_scrivi_stato('vendite.ddt'::regclass, v_ddt_id, v_stato_cons_id);
                          END IF;
                      END IF;

                      -- Lo storno dei carichi (rev 2026-09-28, M-8): la merce riesce con
                      -- una riga opposta, al costo del carico. Se nel frattempo e' gia'
                      -- uscita di nuovo, la primitiva rifiuta l'uscita dello storno: il
                      -- registro non va sotto zero per un annullo.
                      IF v_muove THEN
                          -- Lo storno per DOCUMENTO: i carichi del reso, tutti (righe NULL).
                          -- ⛔ Il tipo che manca non e' «niente da stornare»: e' una
                          --    configurazione rotta, e un annullo che non storna lascerebbe
                          --    in giacenza merce che non c'e'.
                          SELECT s.id INTO v_sorgente_id
                            FROM config.sorgenti s
                           WHERE s.codice_interno = 'RESO_VENDITA';
                          IF v_sorgente_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_annulla_reso',
                                  'E_CONFIG_MANCANTE',
                                  jsonb_build_object('config', 'config.sorgenti.RESO_VENDITA'),
                                  NULL::uuid, VARIADIC ARRAY['sorgente RESO_VENDITA (config.sorgenti)']);
                          END IF;
                          PERFORM 1 FROM magazzino.fn_storna_movimenti_sorgente(
                                             v_sorgente_id, NULL::bigint[], p_sorgente_id => p_reso_id);
                      END IF;
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_ddt(
                  p_ddt_id vendite.ddt.id%TYPE,
                  p_stato  config.stati_doc_ddt.codice_interno%TYPE)
               RETURNS TABLE(
                  movimento_id magazzino.movimenti.id%TYPE,
                  prelievo_id  vendite.ddt_righe_prelievi.id%TYPE,
                  qta          magazzino.movimenti.qta%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              -- Scopo: portare una bolla in un nuovo stato e, se il passaggio tocca il
              --   registro di una bolla che muove merce, scrivere i movimenti nella
              --   stessa transazione. Vedi l'intestazione del changeSet.
              -- Ritorna: i movimenti scritti (uscite, entrate o storni); nessuna riga
              --   se il passaggio non tocca il registro.
              -- rev 2026-10-25 (20261025-16, brief-modello-documento-vendita §7): il
              --   permesso dalla riga del passaggio (script.fn_guard_passaggio), lo
              --   stato dalla scrittura comune (script.fn_doc_scrivi_stato).
              DECLARE
                  v_utente       config.user_override_azioni.auth_user_id%TYPE;
                  v_ddt          vendite.ddt%ROWTYPE;
                  v_da           config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_a_id   config.stati_doc_ddt.id%TYPE;
                  v_causale      config.causali_trasporto.causale_magazzino%TYPE;
                  v_muove        boolean;
                  v_emissione    boolean;
                  v_emesso_id    config.stati_doc_ddt.id%TYPE;
                  v_annullo      boolean;
                  v_consegna_tr  boolean;
                  v_sorgente_id  config.sorgenti.id%TYPE;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- Guard di parametro: forme che nessuna interfaccia produce.
                  IF p_ddt_id IS NULL OR p_ddt_id <= 0 OR p_stato IS NULL OR btrim(p_stato) = '' THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'bolla maggiore di zero e stato di destinazione obbligatorio',
                                             'p_ddt_id', p_ddt_id, 'p_stato', p_stato),
                          NULL::uuid, 'vendite.fn_cambia_stato_ddt',
                          'p_ddt_id (obbligatorio, maggiore di zero), p_stato (codice dello stato di destinazione)');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT d.* INTO v_ddt
                    FROM vendite.ddt d
                   WHERE d.id = p_ddt_id
                     AND script.fn_scope_ef_whitelist_via_ddt(v_utente, d.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                          'E_DDT_NOT_FOUND', jsonb_build_object('ddt_id', p_ddt_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  SELECT s.codice_interno INTO v_da FROM config.stati_doc_ddt s WHERE s.id = v_ddt.stato_doc_ddt_id;
                  -- rev 2026-10-25 (20261025-44): codice -> id dal lettore comune.
                  -- rev 2026-10-26 (20261026-02): lo stato sconosciuto come i gemelli
                  -- (fn_cambia_stato_ordine, fn_cambia_stato_preventivo).
                  v_stato_a_id := script.fn_doc_stato_id('vendite.ddt'::regclass, p_stato);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                          'E_STATO_WORKFLOW_NON_TROVATO',
                          jsonb_build_object('codice', p_stato),
                          NULL::uuid,
                          COALESCE(p_stato, 'NULL'));
                  END IF;

                  -- Il permesso del passaggio, prima di scrivere qualunque cosa: dalla
                  -- sua riga della matrice (M-3). Un passaggio di processo chiesto qui
                  -- (CONSEGNATO <-> RESO, dei verbi del reso) si ferma qui, e cosi' lo
                  -- stato che la bolla ha gia' (rev 2026-10-26, 20261026-01).
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.ddt'::regclass,
                                                    v_ddt.stato_doc_ddt_id, v_stato_a_id);

                  v_causale     := vendite.fn_ddt_causale_magazzino(v_ddt);
                  v_muove       := vendite.fn_ddt_muove_merce(v_ddt);
                  -- rev 2026-10-25 (20261025-44): lo stato di emissione dal
                  -- vocabolario, non dal letterale (l'emissione si raggiunge solo
                  -- dalla bozza: lo dice la matrice).
                  v_emesso_id   := script.fn_stato_emissione_id('vendite.ddt'::regclass);
                  v_emissione   := v_stato_a_id = v_emesso_id;
                  -- rev 2026-10-25 (20261025-78): lo stato d'annullo dal vocabolario.
                  v_annullo     := v_ddt.stato_doc_ddt_id = v_emesso_id
                                   AND v_stato_a_id = script.fn_stato_abortito_id('vendite.ddt'::regclass);
                  v_consegna_tr := p_stato = 'CONSEGNATO' AND v_causale = 'TRASF_OUT' AND v_muove;

                  -- Il permesso dell'operazione di magazzino dentro il passaggio: la
                  -- consegna di un trasferimento scrive gli arrivi (T-4 di Tid).
                  IF v_consegna_tr THEN
                      PERFORM script.fn_guard_azione(v_utente, 'registra_magazzino');
                  END IF;

                  -- All'emissione di una bolla che muove merce: la conferma che parla,
                  -- poi i prelievi automatici, finche' la bolla e' in bozza.
                  IF v_emissione AND v_muove THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', 'vendite.fn_cambia_stato_ddt',
                          script.fn_check_ddt_merce(v_ddt), NULL, NULL::uuid,
                          jsonb_build_object('ddt_id', p_ddt_id));

                      INSERT INTO vendite.ddt_righe_prelievi (ddt_riga_id, ddt_riga_componente_id, qta)
                      SELECT m.ddt_riga_id, m.ddt_riga_componente_id, m.qta
                        FROM vendite.fn_ddt_merce_da_movimentare(v_ddt) m
                       WHERE m.prelevata = 0
                         AND m.automatico;
                  END IF;

                  -- Lo stato, dalla scrittura comune: la porta si apre per QUESTA bolla,
                  -- e i guard di sempre girano.
                  PERFORM script.fn_doc_scrivi_stato('vendite.ddt'::regclass, p_ddt_id, v_stato_a_id);

                  -- I movimenti.
                  IF v_emissione AND v_muove THEN
                      RETURN QUERY
                          SELECT pd.movimento_id, pd.prelievo_id, pd.qta
                            FROM vendite.fn_posta_ddt(p_ddt_id, 'USCITA') pd;
                  ELSIF v_consegna_tr THEN
                      RETURN QUERY
                          SELECT pd.movimento_id, pd.prelievo_id, pd.qta
                            FROM vendite.fn_posta_ddt(p_ddt_id, 'ARRIVO') pd;
                  ELSIF v_annullo AND v_muove THEN
                      -- Lo storno per DOCUMENTO: i movimenti della bolla, tutti (righe NULL).
                      -- ⛔ Il tipo che manca non e' «niente da stornare»: e' una configurazione
                      --    rotta, e un annullo che non storna lascerebbe la giacenza falsa.
                      SELECT s.id INTO v_sorgente_id
                        FROM config.sorgenti s
                       WHERE s.codice_interno = 'DDT_VENDITA';
                      IF v_sorgente_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_cambia_stato_ddt',
                              'E_CONFIG_MANCANTE',
                              jsonb_build_object('config', 'config.sorgenti.DDT_VENDITA'),
                              NULL::uuid, VARIADIC ARRAY['sorgente DDT_VENDITA (config.sorgenti)']);
                      END IF;
                      RETURN QUERY
                          SELECT st.movimento_id, NULL::bigint, st.qta
                            FROM magazzino.fn_storna_movimenti_sorgente(
                                     v_sorgente_id, NULL::bigint[], p_sorgente_id => p_ddt_id) st;
                  END IF;

                  RETURN;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_commessa(
                  p_commessa_id        vendite.commesse.id%TYPE,
                  p_legami_confermati  integer DEFAULT NULL)
              RETURNS integer
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare una commessa. Con legami: prima cio' che
              --   vieta, poi conferma e ritiro dal BB
              --   vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  -- Esito della presa della testata (SELECT true): un flag, nessuna
                  -- colonna di cui sia il riflesso.
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_commessa',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_commessa_id', p_commessa_id),
                          NULL::uuid, 'vendite.fn_annulla_commessa',
                          'p_commessa_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.commesse t
                   WHERE t.id = p_commessa_id
                     AND script.fn_scope_ef_whitelist_via_commessa(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_commessa',
                          'E_COMMESSA_NON_TROVATA',
                          jsonb_build_object('p_commessa_id', p_commessa_id), NULL::uuid,
                          p_commessa_id::text);
                  END IF;

                  -- 3. Prima cio' che vieta (righe EMESSA), poi conferma e ritiro:
                  --    il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('COMMESSA', p_commessa_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato (rev 2026-10-26, 20261026-33,
                  --    brief-modello-documento-vendita §14): firma senza p_user (C-4),
                  --    lo stato d'annullo dal vocabolario, non dal letterale. La prima
                  --    riga del verbo chiede l'azione del passaggio (cambia_stato_commessa
                  --    sull'annullo di una commessa non in bozza, C-1); i guard della
                  --    tabella fanno il resto: matrice, motivi, avviso (che con le righe
                  --    ritirate non ha piu' niente da dire).
                  PERFORM vendite.fn_cambia_stato_commessa(
                      p_commessa_id,
                      script.fn_doc_stato_codice('vendite.commesse'::regclass,
                                                 script.fn_stato_abortito_id('vendite.commesse'::regclass)));

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_ddt(
                  p_ddt_id            vendite.ddt.id%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
              RETURNS TABLE(
                  movimento_id magazzino.movimenti.id%TYPE,
                  prelievo_id  vendite.ddt_righe_prelievi.id%TYPE,
                  qta          magazzino.movimenti.qta%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$

              #variable_conflict use_column
              -- =========================================================
              -- Scopo: annullare una bolla. Con legami: conferma e ritiro dal
              --   BB vendite.fn_documento_ritira_legami, poi lo stato dal verbo
              --   di stato. p_legami_confermati e' un CONTEGGIO: tipo nudo.
              --   Vedi l'intestazione del changeSet.
              -- Ritorna: i movimenti di storno del verbo di stato (nessuno se
              --   la bolla non muove merce).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_ddt_id IS NULL OR p_ddt_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ddt',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ddt_id', p_ddt_id),
                          NULL::uuid, 'vendite.fn_annulla_ddt',
                          'p_ddt_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.ddt d
                   WHERE d.id = p_ddt_id
                     AND script.fn_scope_ef_whitelist_via_ddt(v_utente, d.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ddt',
                          'E_DDT_NOT_FOUND', jsonb_build_object('ddt_id', p_ddt_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  PERFORM vendite.fn_documento_ritira_legami('DDT_VENDITA', p_ddt_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato: matrice, permesso, storno. Lo stato
                  --    di annullo e' quello che il vocabolario marca (is_abortito; rev
                  --    2026-11-14, giro 6d), come in vendite.fn_annulla_ordine.
                  RETURN QUERY
                      SELECT c.movimento_id, c.prelievo_id, c.qta
                        FROM vendite.fn_cambia_stato_ddt(
                                 p_ddt_id,
                                 script.fn_doc_stato_codice('vendite.ddt'::regclass,
                                                            script.fn_stato_abortito_id('vendite.ddt'::regclass))) AS c;

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_ordine(
                  p_ordine_id         vendite.ordini.id%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$

              -- =========================================================
              -- Scopo: annullare un ordine. Con legami: conferma e ritiro
              --   dal BB vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ordine',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ordine_id', p_ordine_id),
                          NULL::uuid, 'vendite.fn_annulla_ordine',
                          'p_ordine_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.ordini t
                   WHERE t.id = p_ordine_id
                     AND script.fn_scope_ef_whitelist_via_ordine(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_ordine',
                          'E_ORD_NOT_FOUND', jsonb_build_object('id', p_ordine_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('ORDINE_VENDITA', p_ordine_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato (rev 2026-10-25, 20261025-76):
                  --    lo stato d'annullo dal vocabolario, non dal letterale. I guard
                  --    della tabella fanno il resto: matrice, freni (righe di
                  --    commessa EMESSA, figli vivi), avviso. L'azione del passaggio
                  --    (emetti_ordine sull'annullo del confermato) la chiede la sua
                  --    prima riga.
                  PERFORM vendite.fn_cambia_stato_ordine(
                      p_ordine_id,
                      script.fn_doc_stato_codice('vendite.ordini'::regclass,
                                                 script.fn_stato_abortito_id('vendite.ordini'::regclass)));

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_preventivo(
                  p_preventivo_id     vendite.preventivi.id%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare un preventivo. Con legami: conferma e ritiro
              --   dal BB vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_preventivo',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_preventivo_id', p_preventivo_id),
                          NULL::uuid, 'vendite.fn_annulla_preventivo',
                          'p_preventivo_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.preventivi t
                   WHERE t.id = p_preventivo_id
                     AND script.fn_scope_ef_whitelist_via_preventivo(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_preventivo',
                          'E_PREV_NOT_FOUND', jsonb_build_object('id', p_preventivo_id), NULL::uuid,
                          p_preventivo_id::text);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('PREVENTIVO', p_preventivo_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato (rev 2026-10-25, 20261025-43:
                  --    firma senza p_user). I guard della tabella fanno il resto:
                  --    matrice, freni (righe di commessa EMESSA, figli vivi), avviso.
                  --    L'azione del passaggio (emetti_preventivo sull'annullo
                  --    dell'emesso e dell'accettato) la chiede la sua prima riga.
                  --    rev 2026-10-25 (20261025-77): lo stato d'annullo dal
                  --    vocabolario, non dal letterale.
                  PERFORM vendite.fn_cambia_stato_preventivo(
                      p_preventivo_id,
                      script.fn_doc_stato_codice('vendite.preventivi'::regclass,
                                                 script.fn_stato_abortito_id('vendite.preventivi'::regclass)));

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cessa_contratti_scaduti()
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente     config.user_override_azioni.auth_user_id%TYPE;
                  v_attivo_id  config.stati_doc_contratti.id%TYPE;
                  v_cessato_id config.stati_doc_contratti.id%TYPE;
                  v_id         vendite.contratti.id%TYPE;
                  -- CONTEGGIO dei contratti cessati.
                  v_n          integer := 0;
              BEGIN
                  -- ==========================================================
                  -- Scopo: cessare i contratti attivi scaduti del perimetro.
                  --   Vedi l'intestazione del changeSet.
                  --   rev 2026-10-31 (20261031-12, brief-modello-documento-vendita §17): anche lo
                  --   stato di cessazione dal vocabolario, non 'CESSATO'.
                  -- Ritorna: quanti contratti sono stati cessati.
                  -- ==========================================================
                  v_utente     := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  v_attivo_id  := script.fn_stato_emissione_id('vendite.contratti'::regclass);
                  v_cessato_id := script.fn_stato_cessazione_id('vendite.contratti'::regclass);

                  IF v_attivo_id IS NULL OR v_cessato_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratti_scaduti',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_contratti',
                                             'attivo_id', v_attivo_id, 'cessato_id', v_cessato_id),
                          NULL::uuid, 'stato di emissione e di cessazione (config.stati_doc_contratti)');
                  END IF;

                  FOR v_id IN
                      SELECT c.id
                        FROM vendite.contratti c
                       WHERE c.stato_doc_contratto_id = v_attivo_id
                         AND c.valido_al IS NOT NULL
                         AND c.valido_al < (SELECT script.fn_data_operativa())
                         AND script.fn_scope_ef_whitelist_via_contratto(v_utente, c.id)
                       ORDER BY c.id
                         FOR UPDATE OF c
                  LOOP
                      PERFORM script.fn_doc_scrivi_stato('vendite.contratti'::regclass, v_id, v_cessato_id);
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_conferma_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6e): la destinazione e' lo stato
              --   di emissione (script.fn_stato_emissione_id); E_RESO_STATO_NON_CONFERMABILE
              --   dove la matrice non ha il passaggio (script.fn_doc_passaggio), non fuori da
              --   DRAFT. Dove sotto si legge DRAFT o CONFERMATO, vale lo stato che il
              --   vocabolario e la matrice dicono.
              -- ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-f):
              --   VERBO del modello «una scrittura = un verbo». SECURITY DEFINER con
              --   search_path bloccato (ogni nome qui dentro e' qualificato), testata presa
              --   FOR UPDATE con il predicato della policy nella WHERE (fuori perimetro:
              --   E_RESO_NOT_FOUND, no-leak, come prima sotto RLS).
              -- ⭐ rev 2026-10-25 (20261025-17, brief-modello-documento-vendita §7): il
              --   permesso dalla riga del passaggio (script.fn_guard_passaggio: DRAFT ->
              --   CONFERMATO chiede conferma_reso), prima di qualunque scrittura; lo
              --   stato del reso e quello della bolla dalla scrittura comune
              --   (script.fn_doc_scrivi_stato), attraverso la porta.
              -- rev 2026-11-03 (20261103-32, brief-db-addebito-trasporto-ordine §8.1):
              --   il flip CONSEGNATO -> RESO (reso totale) conta solo la MERCE della bolla
              --   (script.fn_natura_e_merce): un onere non si rende, e senza il
              --   filtro una bolla con un onere non cambierebbe mai stato.
              DECLARE
                  v_utente            config.user_override_azioni.auth_user_id%TYPE;
                  v_reso              vendite.resi%ROWTYPE;
                  v_muove             boolean;   -- calcolato, nessuna colonna
                  v_stato             config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_conf_id     config.stati_doc_reso.id%TYPE;
                  v_ddt_id            vendite.ddt.id%TYPE;
                  v_ddt_stato         config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_reso_ddt_id config.stati_doc_ddt.id%TYPE;
                  v_tutto_reso        boolean;
                  v_ord               RECORD;
              BEGIN
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  -- 1) Guard input + reso in uno stato da cui la matrice conferma + almeno
                  --    una riga.
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT r.* INTO v_reso
                    FROM vendite.resi r
                   WHERE r.id = p_reso_id
                     AND script.fn_scope_ef_whitelist_via_reso(v_utente, r.id)
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  SELECT sdr.codice_interno INTO v_stato
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = v_reso.stato_doc_reso_id;

                  -- Il permesso del passaggio, prima di scrivere qualunque cosa: dalla
                  -- riga DRAFT -> CONFERMATO della matrice (M-3), su OGNI conferma,
                  -- anche di un reso che non muove merce (D-3b-f).
                  -- La conferma e' l'emissione del reso: lo stato marcato emissione.
                  v_stato_conf_id := script.fn_stato_emissione_id('vendite.resi'::regclass);
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.resi'::regclass,
                                                    v_reso.stato_doc_reso_id, v_stato_conf_id);

                  -- Da dove si conferma lo dice la matrice: il passaggio che il guard ha
                  -- appena letto. Senza, lo stato non e' confermabile.
                  IF NOT EXISTS (SELECT 1
                                   FROM script.fn_doc_passaggio('vendite.resi'::regclass,
                                                                v_reso.stato_doc_reso_id, v_stato_conf_id)) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_STATO_NON_CONFERMABILE',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_stato),
                          NULL::uuid, p_reso_id::text, v_stato);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM vendite.resi_righe
                                  WHERE reso_id = p_reso_id AND attivo IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_SENZA_RIGHE',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- 1-bis) La merce che rientra (rev 2026-09-28, D-3b-b/-c). Su un reso
                  --    che fa rientrare merce: il lock della bolla d'origine (il tetto per
                  --    prelievo somma i rientri di tutti i suoi resi: due conferme
                  --    concorrenti si serializzano qui), la conferma che parla (primo
                  --    motivo di script.fn_check_reso_merce, che conta gia' gli
                  --    automatici), poi i rientri automatici, finche' il reso e' in bozza.
                  v_muove := vendite.fn_reso_muove_merce(v_reso);
                  IF v_muove THEN
                      PERFORM 1 FROM vendite.ddt d
                       WHERE d.id = v_reso.sorgente_id FOR UPDATE;
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', 'vendite.fn_conferma_reso',
                          script.fn_check_reso_merce(v_reso), NULL, NULL::uuid,
                          jsonb_build_object('reso_id', p_reso_id));
                      INSERT INTO vendite.resi_righe_rientri (resi_riga_id, ddt_riga_prelievo_id, qta)
                      SELECT m.resi_riga_id, m.prelievo_unico_id, m.qta
                        FROM vendite.fn_reso_merce_da_rientrare(v_reso) m
                       WHERE m.automatico;
                  END IF;

                  -- 2) Transizione a CONFERMATO (gen_numero + guard_transizione), dalla
                  --    scrittura comune: la porta si apre per QUESTO reso.
                  PERFORM script.fn_doc_scrivi_stato('vendite.resi'::regclass, p_reso_id, v_stato_conf_id);

                  -- 3) Proiezione stato ordine per ogni ordine coinvolto (solo
                  --    righe ri-consegna: quelle che riaprono il residuo).
                  FOR v_ord IN
                      SELECT DISTINCT orr.ordine_id
                        FROM vendite.resi_righe rr
                        JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                        JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                       WHERE rr.reso_id = p_reso_id
                         AND tr.riapre_residuo IS TRUE
                  LOOP
                      -- ⭐ rev 2026-10-11: la proiezione e' il building block
                      --    vendite.fn_ordine_proietta_stato_evasione (brief-db-ddt-righe-evase-dall-ordine).
                      PERFORM vendite.fn_ordine_proietta_stato_evasione(v_ord.ordine_id);
                  END LOOP;

                  -- 4) Flip DDT origine -> RESO se reso TOTALE (tutte le qta
                  --    consegnate del DDT rese da resi EFFETTIVI). Solo se il
                  --    DDT e' CONSEGNATO (matrice CONSEGNATO->RESO, passaggio di
                  --    processo: lo scrive questo verbo, con la sola scrittura comune).
                  SELECT d.id, sdd.codice_interno
                    INTO v_ddt_id, v_ddt_stato
                    FROM vendite.ddt d
                    JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                   WHERE d.id = v_reso.sorgente_id;

                  IF v_ddt_id IS NOT NULL AND v_ddt_stato = 'CONSEGNATO' THEN
                      SELECT bool_and(COALESCE(reso_riga.tot, 0) >= dr.quantita)
                        INTO v_tutto_reso
                        FROM vendite.ddt_righe dr
                        LEFT JOIN (
                            -- rev 2026-07-17 (step 2): fonte unica
                            -- vw_resi_righe_effettive (CONFERMATE + attive, tutti
                            -- i tipi). Il flip non filtra il tipo: conta tutta la
                            -- merce tornata indietro su ogni riga DDT.
                            SELECT e.ddt_riga_id, SUM(e.quantita) AS tot
                              FROM vendite.vw_resi_righe_effettive e
                             GROUP BY e.ddt_riga_id
                        ) reso_riga ON reso_riga.ddt_riga_id = dr.id
                       WHERE dr.ddt_id = v_ddt_id
                         AND dr.attivo IS TRUE
                         -- rev 2026-11-03: solo la merce (un onere non si rende).
                         AND script.fn_natura_e_merce(dr.natura_vendita_id);

                      IF COALESCE(v_tutto_reso, false) THEN
                          SELECT id INTO v_stato_reso_ddt_id FROM config.stati_doc_ddt
                           WHERE codice_interno = 'RESO' AND attivo IS TRUE;
                          PERFORM script.fn_doc_scrivi_stato('vendite.ddt'::regclass, v_ddt_id, v_stato_reso_ddt_id);
                      END IF;
                  END IF;

                  -- 5) I carichi (rev 2026-09-28, D-3b-c): uno per rientro, al costo
                  --    dell'uscita d'origine, nella stessa transazione della conferma.
                  IF v_muove THEN
                      PERFORM 1 FROM vendite.fn_posta_reso(p_reso_id);
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_fattura_proietta_stato(
                  p_fattura_id           vendite.fatture.id%TYPE,
                  p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da vendite.fatture.stato_doc_fiscale_id%TYPE;
                  v_manuale  boolean;  -- la riga del passaggio e' manuale (script.fn_doc_passaggio)
              BEGIN
                  -- ==========================================================
                  -- Scopo: lo stato fiscale di una fattura, scritto dalla
                  --   pipeline che ne e' la causa (passaggio di processo,
                  --   scrittura comune).
                  -- rev 2026-10-27 (20261027-10, brief-modello-documento-
                  --   vendita §15): nasce, al posto degli UPDATE della pipeline.
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 OR p_stato_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_fattura_proietta_stato',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_fattura_id', p_fattura_id,
                                             'p_stato_doc_fiscale_id', p_stato_doc_fiscale_id),
                          NULL::uuid, 'vendite.fn_fattura_proietta_stato',
                          'p_fattura_id (maggiore di zero) e p_stato_doc_fiscale_id obbligatori');
                  END IF;

                  -- La fattura FOR UPDATE, nel perimetro (predicato della policy).
                  SELECT f.stato_doc_fiscale_id
                    INTO v_stato_da
                    FROM vendite.fatture f
                   WHERE f.id = p_fattura_id
                     AND script.fn_scope_ef_whitelist_via_fattura(v_utente, f.id)
                     FOR UPDATE OF f;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_fattura_proietta_stato',
                          'E_FATTURA_NON_TROVATA', jsonb_build_object('fattura_id', p_fattura_id),
                          NULL::uuid, p_fattura_id::text);
                  END IF;

                  -- Lo stato che ha gia': niente da scrivere.
                  IF v_stato_da IS NOT DISTINCT FROM p_stato_doc_fiscale_id THEN
                      RETURN;
                  END IF;

                  -- Un passaggio manuale non e' di processo: non si scrive da qui.
                  SELECT p.manuale INTO v_manuale
                    FROM script.fn_doc_passaggio('vendite.fatture'::regclass,
                                                 v_stato_da, p_stato_doc_fiscale_id) p;
                  IF v_manuale IS TRUE THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_fattura_proietta_stato',
                          'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'passaggio_manuale',
                                             'fattura_id', p_fattura_id,
                                             'stato_da_id', v_stato_da,
                                             'stato_a_id', p_stato_doc_fiscale_id),
                          NULL::uuid,
                          concat('il passaggio ', v_stato_da, ' -> ', p_stato_doc_fiscale_id,
                                 ' della fattura e'' manuale: non lo scrive la pipeline'),
                          p_fattura_id::text);
                  END IF;

                  -- La scrittura comune, attraverso la porta: il guard di
                  -- transizione della fattura giudica la matrice.
                  PERFORM script.fn_doc_scrivi_stato('vendite.fatture'::regclass,
                                                     p_fattura_id, p_stato_doc_fiscale_id);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_lotto_proietta_stato_step(
                  p_lotto_id             vendite.fatturazione_lotti.id%TYPE,
                  p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente     config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da   vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: lo stato fiscale del lotto allo step del giro della
                  --   pipeline (passaggio di processo, scrittura comune).
                  -- rev 2026-10-27 (20261027-09, brief-modello-documento-
                  --   vendita §15): nasce, al posto dell'UPDATE del runner.
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_stato_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_lotto_proietta_stato_step',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_lotto_id', p_lotto_id,
                                             'p_stato_doc_fiscale_id', p_stato_doc_fiscale_id),
                          NULL::uuid, 'vendite.fn_lotto_proietta_stato_step',
                          'p_lotto_id (maggiore di zero) e p_stato_doc_fiscale_id obbligatori');
                  END IF;

                  -- Il lotto FOR UPDATE, nel perimetro (predicato della policy).
                  SELECT l.stato_doc_fiscale_id, l.tipo_lotto
                    INTO v_stato_da, v_tipo_lotto
                    FROM vendite.fatturazione_lotti l
                   WHERE l.id = p_lotto_id
                     AND script.fn_scope_ef_whitelist_via_lotto(v_utente, l.id)
                     FOR UPDATE OF l;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_lotto_proietta_stato_step',
                          'E_LOTTO_NON_TROVATO', jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::text);
                  END IF;

                  -- Lo stato che ha gia': niente da scrivere.
                  IF v_stato_da IS NOT DISTINCT FROM p_stato_doc_fiscale_id THEN
                      RETURN;
                  END IF;

                  -- Lo stato di uno step della pipeline del suo tipo, e non
                  -- l'iniziale (il ritorno in bozza e' un verbo).
                  IF NOT EXISTS (
                         SELECT 1 FROM vendite.fatturazione_pipeline p
                          WHERE p.attivo IS TRUE
                            AND p.stato_doc_fiscale_id = p_stato_doc_fiscale_id
                            AND p.tipo_lotto = v_tipo_lotto)
                     OR EXISTS (
                         SELECT 1 FROM config.stati_doc_fiscale s
                          WHERE s.id = p_stato_doc_fiscale_id
                            AND s.iniziale IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_lotto_proietta_stato_step',
                          'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'stato_step',
                                             'lotto_id', p_lotto_id,
                                             'tipo_lotto', v_tipo_lotto,
                                             'stato_da_id', v_stato_da,
                                             'stato_a_id', p_stato_doc_fiscale_id),
                          NULL::uuid,
                          concat('lo stato ', p_stato_doc_fiscale_id,
                                 ' non e'' uno step della pipeline ', v_tipo_lotto,
                                 ' (o e'' lo stato iniziale)'),
                          p_lotto_id::text);
                  END IF;

                  -- La scrittura comune, attraverso la porta: il guard di
                  -- transizione giudica la matrice e il fermo.
                  PERFORM script.fn_doc_scrivi_stato('vendite.fatturazione_lotti'::regclass,
                                                     p_lotto_id, p_stato_doc_fiscale_id);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_varia_prezzi_versione_listino(
                  p_listino_versione_id vendite.listini_versioni.id%TYPE,
                  -- Tipo esplicito: una percentuale, nessuna colonna di cui sia il riflesso.
                  p_variazione_pct      numeric,
                  -- Tipo esplicito: i decimali dell'arrotondamento, argomento di round().
                  p_decimali            integer,
                  -- Tipo esplicito: un array di id di catalogo.articoli; NULL = tutte le righe.
                  p_filtro_articoli     uuid[] DEFAULT NULL,
                  -- Tipo esplicito: l'interruttore del chiamante (true = anteprima).
                  p_dry_run             boolean DEFAULT false)
               RETURNS TABLE(listino_riga_id      vendite.listini_righe.id%TYPE,
                             articolo_id          vendite.listini_righe.articolo_id%TYPE,
                             articolo_codice      catalogo.articoli.codice%TYPE,
                             articolo_descrizione catalogo.articoli.descrizione%TYPE,
                             prezzo_precedente    vendite.listini_righe.prezzo%TYPE,
                             prezzo_nuovo         vendite.listini_righe.prezzo%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_tx_id   vendite.listini_versioni.tx_id%TYPE;
                  -- Tipo esplicito: un conteggio di righe.
                  v_n       integer;
                  -- Gli intervalli: una costante sola, letta dal controllo e dal
                  --   messaggio.
                  c_pct_min CONSTANT numeric := -99;
                  c_pct_max CONSTANT numeric := 1000;
                  c_dec_min CONSTANT integer := 0;
                  c_dec_max CONSTANT integer := 10;
              BEGIN
                  -- ==========================================================
                  -- Scopo: variare in percentuale i prezzi delle righe attive di
                  --   una versione di listino (tutte, o quelle degli articoli del
                  --   filtro), o mostrarne l'anteprima. Si fa solo in bozza, e lo
                  --   dice la versione, non le righe che il gesto prende. Vedi
                  --   l'intestazione del changeSet 20261115-79.
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_listino_versione_id IS NULL OR p_listino_versione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_listino_versione_id', p_listino_versione_id),
                          NULL::uuid, 'vendite.fn_varia_prezzi_versione_listino',
                          'p_listino_versione_id (obbligatorio, maggiore di zero)');
                  END IF;
                  IF p_variazione_pct IS NULL OR p_decimali IS NULL OR p_dry_run IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_listino_versione_id', p_listino_versione_id,
                                             'p_variazione_pct', p_variazione_pct,
                                             'p_decimali', p_decimali, 'p_dry_run', p_dry_run),
                          NULL::uuid, 'vendite.fn_varia_prezzi_versione_listino',
                          'p_variazione_pct, p_decimali e p_dry_run (obbligatori)');
                  END IF;

                  -- 2. La versione, nel perimetro. Nel gesto vero FOR UPDATE: fra la
                  --    check e la scrittura la versione non cambia stato.
                  IF p_dry_run THEN
                      SELECT lv.tx_id INTO v_tx_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.id = p_listino_versione_id
                         AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id);
                  ELSE
                      SELECT lv.tx_id INTO v_tx_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.id = p_listino_versione_id
                         AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id)
                         FOR UPDATE OF lv;
                  END IF;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_listino_versione_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Prima cio' che vieta: il primo motivo della check della
                  --    versione, senza riga, come la superficie. Anche
                  --    nell'anteprima.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                      script.fn_check_listino_riga_scrivibile(p_listino_versione_id, NULL, 'UPDATE'),
                      NULL,
                      v_tx_id,
                      jsonb_build_object('listino_versione_id', p_listino_versione_id,
                                         'variazione_pct', p_variazione_pct,
                                         'dry_run', p_dry_run));

                  -- 4. Gli intervalli. Il campo da correggere ha il nome del
                  --    parametro dell'endpoint: esce nel canale COLUMN.
                  IF p_variazione_pct < c_pct_min OR p_variazione_pct > c_pct_max
                     OR p_decimali < c_dec_min OR p_decimali > c_dec_max THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_LISTINO_VARIAZIONE_FUORI_INTERVALLO',
                          jsonb_build_object('campo', CASE WHEN p_variazione_pct BETWEEN c_pct_min AND c_pct_max
                                                           THEN 'arrotondamento_decimali'
                                                           ELSE 'variazione_percentuale' END,
                                             'listino_versione_id', p_listino_versione_id,
                                             'variazione_pct', p_variazione_pct,
                                             'decimali', p_decimali),
                          v_tx_id,
                          c_pct_min::text, c_pct_max::text, c_dec_min::text, c_dec_max::text);
                  END IF;

                  -- 5. Il prezzo nuovo, calcolato in un posto solo: l'anteprima lo
                  --    restituisce, il gesto lo scrive (il guard delle righe, in
                  --    bozza, passa) e restituisce il prezzo salvato, alla scala
                  --    della colonna. Prezzo negativo: il CHECK della tabella.
                  RETURN QUERY
                  WITH calc AS (
                      SELECT r.id                                                   AS riga_id,
                             r.articolo_id                                          AS art_id,
                             a.codice                                               AS art_codice,
                             a.descrizione                                          AS art_descrizione,
                             r.prezzo                                               AS prima,
                             round(r.prezzo * (1 + p_variazione_pct / 100), p_decimali) AS dopo
                        FROM vendite.listini_righe r
                        JOIN catalogo.articoli a ON a.id = r.articolo_id
                       WHERE r.listino_versione_id = p_listino_versione_id
                         AND r.attivo
                         AND (p_filtro_articoli IS NULL OR r.articolo_id = ANY (p_filtro_articoli))
                  ), scritte AS (
                      UPDATE vendite.listini_righe lr
                         SET prezzo = c.dopo
                        FROM calc c
                       WHERE lr.id = c.riga_id
                         AND NOT p_dry_run
                      RETURNING lr.id AS riga_id, lr.prezzo AS salvato
                  )
                  SELECT c.riga_id, c.art_id, c.art_codice, c.art_descrizione, c.prima,
                         COALESCE(s.salvato, c.dopo)
                    FROM calc c
                    LEFT JOIN scritte s ON s.riga_id = c.riga_id
                   ORDER BY c.art_codice, c.riga_id;
                  GET DIAGNOSTICS v_n = ROW_COUNT;

                  -- 6. La traccia del gesto, anche a righe zero.
                  IF NOT p_dry_run THEN
                      UPDATE vendite.listini_versioni lv
                         SET meta = jsonb_set(
                                        lv.meta, '{variazioni_percentuali}',
                                        COALESCE(lv.meta -> 'variazioni_percentuali', '[]'::jsonb)
                                        || jsonb_build_array(jsonb_build_object(
                                               'data',                    now(),
                                               'operatore',               v_utente,
                                               'variazione_percentuale',  p_variazione_pct::text,
                                               'arrotondamento_decimali', p_decimali,
                                               'righe_aggiornate',        v_n,
                                               'filtro_articoli',         to_jsonb(p_filtro_articoli))))
                       WHERE lv.id = p_listino_versione_id;
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
