            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_attiva_versione_listino(
                  p_versione_id vendite.listini_versioni.id%TYPE)
               RETURNS TABLE(versione_id      vendite.listini_versioni.id%TYPE,
                             stato_precedente config.stati_doc_listino_versioni.codice_interno%TYPE,
                             stato_nuovo      config.stati_doc_listino_versioni.codice_interno%TYPE,
                             versioni_chiuse  integer)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  c_attiva      CONSTANT config.stati_doc_listino_versioni.codice_interno%TYPE := 'ATTIVA';
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_stato_da_id vendite.listini_versioni.stato_doc_listino_versione_id%TYPE;
                  v_stato_a_id  config.stati_doc_listino_versioni.id%TYPE;
                  v_tx_id       vendite.listini_versioni.tx_id%TYPE;
                  v_prec_id     vendite.listini_versioni.id%TYPE;
                  v_fine        vendite.listini_versioni.valido_al%TYPE;
                  -- CONTEGGIO delle versioni chiuse.
                  v_chiuse      integer := 0;
              BEGIN
                  -- ==========================================================
                  -- Scopo: attivare una versione di listino, chiudendo le
                  --   precedenti. Vedi l'intestazione dei changeSet 20261028-12, -32
                  --   e 20261029-09.
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametro e versione, nel perimetro.
                  IF p_versione_id IS NULL OR p_versione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_attiva_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_versione_id', p_versione_id),
                          NULL::uuid, 'vendite.fn_attiva_versione_listino',
                          'p_versione_id (obbligatorio, maggiore di zero)');
                  END IF;

                  SELECT lv.stato_doc_listino_versione_id, s.codice_interno, lv.tx_id
                    INTO v_stato_da_id, v_stato_da, v_tx_id
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = p_versione_id
                     AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id)
                     FOR UPDATE OF lv;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_attiva_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_versione_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Prima riga comune: lo stato che ha gia', l'azione.
                  v_stato_a_id := script.fn_doc_stato_id('vendite.listini_versioni'::regclass, c_attiva);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_attiva_versione_listino',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_listino_versioni',
                                             'codice', c_attiva),
                          NULL::uuid, 'stato ATTIVA (config.stati_doc_listino_versioni)');
                  END IF;
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.listini_versioni'::regclass,
                                                    v_stato_da_id, v_stato_a_id);

                  -- 3. Prima cio' che vieta, prima di toccare le altre versioni.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_attiva_versione_listino',
                      script.fn_check_versione_listino_attivabile(p_versione_id),
                      NULL,
                      v_tx_id,
                      jsonb_build_object('versione_id', p_versione_id,
                                         'stato_da', v_stato_da, 'stato_a', c_attiva));

                  -- 4. Le precedenti che si sovrappongono si chiudono il giorno
                  --    prima della decorrenza nuova: lo stesso lettore
                  --    dell'anteprima. Una alla volta, con la porta aperta
                  --    sulla sua versione (il guard per stato, 20261029-07).
                  FOR v_prec_id, v_fine IN
                      SELECT d.versione_id, d.valido_al_dopo
                        FROM vendite.fn_versioni_listino_da_chiudere(p_versione_id) d
                  LOOP
                      PERFORM set_config('zeroerp.listino_versione_fine', v_prec_id::text, true);
                      UPDATE vendite.listini_versioni lv
                         SET valido_al = v_fine
                       WHERE lv.id = v_prec_id;
                      v_chiuse := v_chiuse + 1;
                  END LOOP;
                  PERFORM set_config('zeroerp.listino_versione_fine', '', true);

                  -- 5. Lo stato, attraverso la porta.
                  PERFORM script.fn_doc_scrivi_stato('vendite.listini_versioni'::regclass,
                                                     p_versione_id, v_stato_a_id);

                  RETURN QUERY SELECT p_versione_id, v_stato_da, c_attiva, v_chiuse;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_event_log_deriva_scope()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  -- ⚠️ %TYPE su tutto cio' che riflette una colonna
                  --    (linee-guida-sql §5). `v_modo` no: e' un letterale
                  --    di dispatch.
                  v_modo         text;
                  v_sr_id        vendite.event_log.emittente_soggetto_ruolo_id%TYPE;
                  v_auth_user_id vendite.event_log.auth_user_id%TYPE;
                  v_ammessi      text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Compilare da se' le cose che il database sa e il
                  --   chiamante no: DI CHI e' la riga e CHI l'ha scritta.
                  --
                  -- ⭐ LA REGOLA (D-12):
                  --   il diario rifiuta una riga SOLO quando non riesce a dire
                  --   di chi e'. Un emittente disattivato o un documento
                  --   annullato si registrano lo stesso: il fatto e' accaduto,
                  --   e rifiutare la riga distruggerebbe l'unica prova che lo
                  --   spiegherebbe. L'attivita' NUOVA su un emittente
                  --   disattivato e' gia' bloccata sui documenti.
                  --
                  -- ⚠️ Non si fida di cio' che passa il chiamante su nessuno
                  --   dei due campi: sono fatti del database, e la logica non
                  --   si duplica in Python.
                  --
                  -- ⭐ Rev 2026-09-18 (Passo D): QUANDO SCADE non si calcola
                  --   piu' qui. Lo scrive `dbops.trgfn_cleanup_at_alla_nascita`
                  --   (trigger _m50_, dopo questo), che legge termine e
                  --   colonna base dalla regola CLEANUP_AT: lo stesso BB dei
                  --   quattro registri di fatturazione e push. La copia
                  --   `vendite.fn_event_log_ttl_days` e' ritirata.
                  -- =========================================================

                  -- 1. Da che parte si guarda.
                  -- ⭐ Rev 2026-08-22 (L4). Qui c'era un CASE scritto a mano con i tre
                  --   tipi. Il modo vive adesso nella STESSA RIGA del tipo, in
                  --   config.tipi_entita: aggiungere un tipo giornalabile e' un seed,
                  --   non tre modifiche coordinate (CHECK + questo CASE + il modo in
                  --   fn_resolve_emittente_sr_id). Configurazione e trigger non
                  --   possono piu' dissentire, perche' sono lo stesso dato.
                  -- ⚠️ NULL qui significa DUE cose, e vanno entrambe rifiutate allo
                  --   stesso modo: il tipo non esiste a catalogo, oppure esiste ma NON
                  --   e' giornalabile (modo NULL, come TASK_RUN — puntabile da un
                  --   errore, senza un padrone da cui derivare il perimetro).
                  SELECT te.modo_risoluzione_emittente
                    INTO v_modo
                    FROM config.tipi_entita te
                   WHERE te.codice = NEW.entity_type
                     AND NOT script.fn_e_obsoleto(te.obsoleto_dal);

                  -- ⛔ Rev 2026-08-22 (20260822-47). Questo ramo mancava, e la
                  --   versione precedente si affidava al CHECK sulla colonna.
                  --   Ma i BEFORE ROW girano PRIMA dei CHECK: con un tipo fuori
                  --   vocabolario il CASE cadeva a NULL e il risolutore
                  --   rispondeva «il modo di risoluzione «» non esiste» —
                  --   E_PARAMETRO_INVALIDO, e un messaggio che nomina un
                  --   concetto interno al database invece del dato passato.
                  --   Il CHECK resta come invariante della colonna; qui si
                  --   presidia il PERCORSO.
                  IF v_modo IS NULL THEN
                      -- ⭐ L'elenco dei tipi ammessi si legge dal CATALOGO, non si
                      --   scrive nel messaggio: cosi' la frase resta vera il giorno che
                      --   il catalogo cresce. E' il motivo per cui il messaggio 980 e'
                      --   passato da uno a due segnaposto nella stessa passata
                      --   (arita': due `%s`, due valori nel VARIADIC).
                      SELECT string_agg(te.codice, ', ' ORDER BY te.codice)
                        INTO v_ammessi
                        FROM config.tipi_entita te
                       WHERE te.modo_risoluzione_emittente IS NOT NULL
                         AND NOT script.fn_e_obsoleto(te.obsoleto_dal);

                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_event_log_deriva_scope',
                          'E_EVENT_LOG_ENTITY_TYPE_IGNOTO',
                          jsonb_build_object(
                              'detail',      'entity_type fuori dal vocabolario del giornale',
                              'entity_type', NEW.entity_type,
                              'entity_id',   NEW.entity_id,
                              'event_code',  NEW.event_code
                          ),
                          NULL::uuid,
                          NEW.entity_type,
                          v_ammessi
                      );
                  END IF;

                  -- 2. Di chi e'. La risoluzione gira FUORI dalla row security
                  --    (SECURITY DEFINER): «non la vedo» non e' «non esiste».
                  v_sr_id := script.fn_resolve_emittente_sr_id(v_modo, NEW.entity_id);

                  IF v_sr_id IS NULL THEN
                      -- ⛔ L'entita' non esiste: non c'e' modo di dire di chi
                      --    sia la riga. Codice DIVERSO dal precedente perche'
                      --    il rimedio e' diverso — li' «usa uno dei tre tipi»,
                      --    qui «quell'entita' non c'e'».
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_event_log_deriva_scope',
                          'E_EVENT_LOG_SCOPE_NON_RISOLTO',
                          jsonb_build_object(
                              'detail',      'Entita non trovata: perimetro non derivabile',
                              'entity_type', NEW.entity_type,
                              'entity_id',   NEW.entity_id,
                              'event_code',  NEW.event_code
                          ),
                          NULL::uuid,
                          NEW.entity_type,
                          NEW.entity_id::text
                      );
                  END IF;

                  NEW.emittente_soggetto_ruolo_id := v_sr_id;

                  -- 3. Chi, come numero. `user_insert` (il nome) lo scrive il
                  --    trigger di audit leggendo app.jwt_user; qui si tiene
                  --    l'id, che regge a un rename. NULL sul canale batch, dove
                  --    non c'e' un utente: li' «chi» resta user_insert.
                  v_auth_user_id := NULLIF(
                      current_setting('app.current_user_id', true), ''
                  )::bigint;
                  NEW.auth_user_id := v_auth_user_id;

                  RETURN NEW;
              END
              $function$;
