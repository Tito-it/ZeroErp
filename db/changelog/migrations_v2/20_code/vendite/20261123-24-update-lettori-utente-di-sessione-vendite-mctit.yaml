              CREATE OR REPLACE FUNCTION vendite.fn_cessa_contratti_scaduti()
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente     config.user_override_azioni.auth_user_id%TYPE;
                  v_attivo_id  config.stati_doc_contratti.id%TYPE;
                  v_cessato_id config.stati_doc_contratti.id%TYPE;
                  v_id         vendite.contratti.id%TYPE;
                  -- CONTEGGIO dei contratti cessati.
                  v_n          integer := 0;
              BEGIN
                  -- ==========================================================
                  -- Scopo: cessare i contratti attivi scaduti del perimetro.
                  --   Vedi l'intestazione del changeSet.
                  --   rev 2026-10-31 (20261031-12, brief-modello-documento-vendita §17): anche lo
                  --   stato di cessazione dal vocabolario, non 'CESSATO'.
                  -- Ritorna: quanti contratti sono stati cessati.
                  -- ==========================================================
                  v_utente     := script.fn_utente_di_sessione('vendite.fn_cessa_contratti_scaduti');
                  v_attivo_id  := script.fn_stato_emissione_id('vendite.contratti'::regclass);
                  v_cessato_id := script.fn_stato_cessazione_id('vendite.contratti'::regclass);

                  IF v_attivo_id IS NULL OR v_cessato_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratti_scaduti',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_contratti',
                                             'attivo_id', v_attivo_id, 'cessato_id', v_cessato_id),
                          NULL::uuid, 'stato di emissione e di cessazione (config.stati_doc_contratti)');
                  END IF;

                  FOR v_id IN
                      SELECT c.id
                        FROM vendite.contratti c
                       WHERE c.stato_doc_contratto_id = v_attivo_id
                         AND c.valido_al IS NOT NULL
                         AND c.valido_al < (SELECT script.fn_data_operativa())
                         AND script.fn_scope_ef_whitelist_via_contratto(v_utente, c.id)
                       ORDER BY c.id
                         FOR UPDATE OF c
                  LOOP
                      PERFORM script.fn_doc_scrivi_stato('vendite.contratti'::regclass, v_id, v_cessato_id);
                      v_n := v_n + 1;
                  END LOOP;

                  RETURN v_n;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_conferma_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6e): la destinazione e' lo stato
              --   di emissione (script.fn_stato_emissione_id); E_RESO_STATO_NON_CONFERMABILE
              --   dove la matrice non ha il passaggio (script.fn_doc_passaggio), non fuori da
              --   DRAFT. Dove sotto si legge DRAFT o CONFERMATO, vale lo stato che il
              --   vocabolario e la matrice dicono.
              -- ⭐ rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-f):
              --   VERBO del modello «una scrittura = un verbo». SECURITY DEFINER con
              --   search_path bloccato (ogni nome qui dentro e' qualificato), testata presa
              --   FOR UPDATE con il predicato della policy nella WHERE (fuori perimetro:
              --   E_RESO_NOT_FOUND, no-leak, come prima sotto RLS).
              -- ⭐ rev 2026-10-25 (20261025-17, brief-modello-documento-vendita §7): il
              --   permesso dalla riga del passaggio (script.fn_guard_passaggio: DRAFT ->
              --   CONFERMATO chiede conferma_reso), prima di qualunque scrittura; lo
              --   stato del reso e quello della bolla dalla scrittura comune
              --   (script.fn_doc_scrivi_stato), attraverso la porta.
              -- rev 2026-11-03 (20261103-32, brief-db-addebito-trasporto-ordine §8.1):
              --   il flip CONSEGNATO -> RESO (reso totale) conta solo la MERCE della bolla
              --   (script.fn_natura_e_merce): un onere non si rende, e senza il
              --   filtro una bolla con un onere non cambierebbe mai stato.
              DECLARE
                  v_utente            config.user_override_azioni.auth_user_id%TYPE;
                  v_reso              vendite.resi%ROWTYPE;
                  v_muove             boolean;   -- calcolato, nessuna colonna
                  v_stato             config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_conf_id     config.stati_doc_reso.id%TYPE;
                  v_ddt_id            vendite.ddt.id%TYPE;
                  v_ddt_stato         config.stati_doc_ddt.codice_interno%TYPE;
                  v_stato_reso_ddt_id config.stati_doc_ddt.id%TYPE;
                  v_tutto_reso        boolean;
                  v_ord               RECORD;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_conferma_reso');
                  -- 1) Guard input + reso in uno stato da cui la matrice conferma + almeno
                  --    una riga.
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  -- La testata, FOR UPDATE, nel perimetro (predicato della policy: DEFINER).
                  SELECT r.* INTO v_reso
                    FROM vendite.resi r
                   WHERE r.id = p_reso_id
                     AND script.fn_scope_ef_whitelist_via_reso(v_utente, r.id)
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  SELECT sdr.codice_interno INTO v_stato
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = v_reso.stato_doc_reso_id;

                  -- Il permesso del passaggio, prima di scrivere qualunque cosa: dalla
                  -- riga DRAFT -> CONFERMATO della matrice (M-3), su OGNI conferma,
                  -- anche di un reso che non muove merce (D-3b-f).
                  -- La conferma e' l'emissione del reso: lo stato marcato emissione.
                  v_stato_conf_id := script.fn_stato_emissione_id('vendite.resi'::regclass);
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.resi'::regclass,
                                                    v_reso.stato_doc_reso_id, v_stato_conf_id);

                  -- Da dove si conferma lo dice la matrice: il passaggio che il guard ha
                  -- appena letto. Senza, lo stato non e' confermabile.
                  IF NOT EXISTS (SELECT 1
                                   FROM script.fn_doc_passaggio('vendite.resi'::regclass,
                                                                v_reso.stato_doc_reso_id, v_stato_conf_id)) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_STATO_NON_CONFERMABILE',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_stato),
                          NULL::uuid, p_reso_id::text, v_stato);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM vendite.resi_righe
                                  WHERE reso_id = p_reso_id AND attivo IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_conferma_reso','E_RESO_SENZA_RIGHE',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- 1-bis) La merce che rientra (rev 2026-09-28, D-3b-b/-c). Su un reso
                  --    che fa rientrare merce: il lock della bolla d'origine (il tetto per
                  --    prelievo somma i rientri di tutti i suoi resi: due conferme
                  --    concorrenti si serializzano qui), la conferma che parla (primo
                  --    motivo di script.fn_check_reso_merce, che conta gia' gli
                  --    automatici), poi i rientri automatici, finche' il reso e' in bozza.
                  v_muove := vendite.fn_reso_muove_merce(v_reso);
                  IF v_muove THEN
                      PERFORM 1 FROM vendite.ddt d
                       WHERE d.id = v_reso.sorgente_id FOR UPDATE;
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', 'vendite.fn_conferma_reso',
                          script.fn_check_reso_merce(v_reso), NULL, NULL::uuid,
                          jsonb_build_object('reso_id', p_reso_id));
                      INSERT INTO vendite.resi_righe_rientri (resi_riga_id, ddt_riga_prelievo_id, qta)
                      SELECT m.resi_riga_id, m.prelievo_unico_id, m.qta
                        FROM vendite.fn_reso_merce_da_rientrare(v_reso) m
                       WHERE m.automatico;
                  END IF;

                  -- 2) Transizione a CONFERMATO (gen_numero + guard_transizione), dalla
                  --    scrittura comune: la porta si apre per QUESTO reso.
                  PERFORM script.fn_doc_scrivi_stato('vendite.resi'::regclass, p_reso_id, v_stato_conf_id);

                  -- 3) Proiezione stato ordine per ogni ordine coinvolto (solo
                  --    righe ri-consegna: quelle che riaprono il residuo).
                  FOR v_ord IN
                      SELECT DISTINCT orr.ordine_id
                        FROM vendite.resi_righe rr
                        JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                        JOIN config.tipi_reso tr      ON tr.id = rr.tipo_reso_id
                       WHERE rr.reso_id = p_reso_id
                         AND tr.riapre_residuo IS TRUE
                  LOOP
                      -- ⭐ rev 2026-10-11: la proiezione e' il building block
                      --    vendite.fn_ordine_proietta_stato_evasione (brief-db-ddt-righe-evase-dall-ordine).
                      PERFORM vendite.fn_ordine_proietta_stato_evasione(v_ord.ordine_id);
                  END LOOP;

                  -- 4) Flip DDT origine -> RESO se reso TOTALE (tutte le qta
                  --    consegnate del DDT rese da resi EFFETTIVI). Solo se il
                  --    DDT e' CONSEGNATO (matrice CONSEGNATO->RESO, passaggio di
                  --    processo: lo scrive questo verbo, con la sola scrittura comune).
                  SELECT d.id, sdd.codice_interno
                    INTO v_ddt_id, v_ddt_stato
                    FROM vendite.ddt d
                    JOIN config.stati_doc_ddt sdd ON sdd.id = d.stato_doc_ddt_id
                   WHERE d.id = v_reso.sorgente_id;

                  IF v_ddt_id IS NOT NULL AND v_ddt_stato = 'CONSEGNATO' THEN
                      SELECT bool_and(COALESCE(reso_riga.tot, 0) >= dr.quantita)
                        INTO v_tutto_reso
                        FROM vendite.ddt_righe dr
                        LEFT JOIN (
                            -- rev 2026-07-17 (step 2): fonte unica
                            -- vw_resi_righe_effettive (CONFERMATE + attive, tutti
                            -- i tipi). Il flip non filtra il tipo: conta tutta la
                            -- merce tornata indietro su ogni riga DDT.
                            SELECT e.ddt_riga_id, SUM(e.quantita) AS tot
                              FROM vendite.vw_resi_righe_effettive e
                             GROUP BY e.ddt_riga_id
                        ) reso_riga ON reso_riga.ddt_riga_id = dr.id
                       WHERE dr.ddt_id = v_ddt_id
                         AND dr.attivo IS TRUE
                         -- rev 2026-11-03: solo la merce (un onere non si rende).
                         AND script.fn_natura_e_merce(dr.natura_vendita_id);

                      IF COALESCE(v_tutto_reso, false) THEN
                          SELECT id INTO v_stato_reso_ddt_id FROM config.stati_doc_ddt
                           WHERE codice_interno = 'RESO' AND attivo IS TRUE;
                          PERFORM script.fn_doc_scrivi_stato('vendite.ddt'::regclass, v_ddt_id, v_stato_reso_ddt_id);
                      END IF;
                  END IF;

                  -- 5) I carichi (rev 2026-09-28, D-3b-c): uno per rientro, al costo
                  --    dell'uscita d'origine, nella stessa transazione della conferma.
                  IF v_muove THEN
                      PERFORM 1 FROM vendite.fn_posta_reso(p_reso_id);
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_fattura_proietta_stato(
                  p_fattura_id           vendite.fatture.id%TYPE,
                  p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente   config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da vendite.fatture.stato_doc_fiscale_id%TYPE;
                  v_manuale  boolean;  -- la riga del passaggio e' manuale (script.fn_doc_passaggio)
              BEGIN
                  -- ==========================================================
                  -- Scopo: lo stato fiscale di una fattura, scritto dalla
                  --   pipeline che ne e' la causa (passaggio di processo,
                  --   scrittura comune).
                  -- rev 2026-10-27 (20261027-10, brief-modello-documento-
                  --   vendita §15): nasce, al posto degli UPDATE della pipeline.
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_fattura_proietta_stato');

                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 OR p_stato_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_fattura_proietta_stato',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_fattura_id', p_fattura_id,
                                             'p_stato_doc_fiscale_id', p_stato_doc_fiscale_id),
                          NULL::uuid, 'vendite.fn_fattura_proietta_stato',
                          'p_fattura_id (maggiore di zero) e p_stato_doc_fiscale_id obbligatori');
                  END IF;

                  -- La fattura FOR UPDATE, nel perimetro (predicato della policy).
                  SELECT f.stato_doc_fiscale_id
                    INTO v_stato_da
                    FROM vendite.fatture f
                   WHERE f.id = p_fattura_id
                     AND script.fn_scope_ef_whitelist_via_fattura(v_utente, f.id)
                     FOR UPDATE OF f;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_fattura_proietta_stato',
                          'E_FATTURA_NON_TROVATA', jsonb_build_object('fattura_id', p_fattura_id),
                          NULL::uuid, p_fattura_id::text);
                  END IF;

                  -- Lo stato che ha gia': niente da scrivere.
                  IF v_stato_da IS NOT DISTINCT FROM p_stato_doc_fiscale_id THEN
                      RETURN;
                  END IF;

                  -- Un passaggio manuale non e' di processo: non si scrive da qui.
                  SELECT p.manuale INTO v_manuale
                    FROM script.fn_doc_passaggio('vendite.fatture'::regclass,
                                                 v_stato_da, p_stato_doc_fiscale_id) p;
                  IF v_manuale IS TRUE THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_fattura_proietta_stato',
                          'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'passaggio_manuale',
                                             'fattura_id', p_fattura_id,
                                             'stato_da_id', v_stato_da,
                                             'stato_a_id', p_stato_doc_fiscale_id),
                          NULL::uuid,
                          concat('il passaggio ', v_stato_da, ' -> ', p_stato_doc_fiscale_id,
                                 ' della fattura e'' manuale: non lo scrive la pipeline'),
                          p_fattura_id::text);
                  END IF;

                  -- La scrittura comune, attraverso la porta: il guard di
                  -- transizione della fattura giudica la matrice.
                  PERFORM script.fn_doc_scrivi_stato('vendite.fatture'::regclass,
                                                     p_fattura_id, p_stato_doc_fiscale_id);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_lotto_proietta_stato_step(
                  p_lotto_id             vendite.fatturazione_lotti.id%TYPE,
                  p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente     config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da   vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: lo stato fiscale del lotto allo step del giro della
                  --   pipeline (passaggio di processo, scrittura comune).
                  -- rev 2026-10-27 (20261027-09, brief-modello-documento-
                  --   vendita §15): nasce, al posto dell'UPDATE del runner.
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_lotto_proietta_stato_step');

                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_stato_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_lotto_proietta_stato_step',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_lotto_id', p_lotto_id,
                                             'p_stato_doc_fiscale_id', p_stato_doc_fiscale_id),
                          NULL::uuid, 'vendite.fn_lotto_proietta_stato_step',
                          'p_lotto_id (maggiore di zero) e p_stato_doc_fiscale_id obbligatori');
                  END IF;

                  -- Il lotto FOR UPDATE, nel perimetro (predicato della policy).
                  SELECT l.stato_doc_fiscale_id, l.tipo_lotto
                    INTO v_stato_da, v_tipo_lotto
                    FROM vendite.fatturazione_lotti l
                   WHERE l.id = p_lotto_id
                     AND script.fn_scope_ef_whitelist_via_lotto(v_utente, l.id)
                     FOR UPDATE OF l;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_lotto_proietta_stato_step',
                          'E_LOTTO_NON_TROVATO', jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::text);
                  END IF;

                  -- Lo stato che ha gia': niente da scrivere.
                  IF v_stato_da IS NOT DISTINCT FROM p_stato_doc_fiscale_id THEN
                      RETURN;
                  END IF;

                  -- Lo stato di uno step della pipeline del suo tipo, e non
                  -- l'iniziale (il ritorno in bozza e' un verbo).
                  IF NOT EXISTS (
                         SELECT 1 FROM vendite.fatturazione_pipeline p
                          WHERE p.attivo IS TRUE
                            AND p.stato_doc_fiscale_id = p_stato_doc_fiscale_id
                            AND p.tipo_lotto = v_tipo_lotto)
                     OR EXISTS (
                         SELECT 1 FROM config.stati_doc_fiscale s
                          WHERE s.id = p_stato_doc_fiscale_id
                            AND s.iniziale IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_lotto_proietta_stato_step',
                          'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'stato_step',
                                             'lotto_id', p_lotto_id,
                                             'tipo_lotto', v_tipo_lotto,
                                             'stato_da_id', v_stato_da,
                                             'stato_a_id', p_stato_doc_fiscale_id),
                          NULL::uuid,
                          concat('lo stato ', p_stato_doc_fiscale_id,
                                 ' non e'' uno step della pipeline ', v_tipo_lotto,
                                 ' (o e'' lo stato iniziale)'),
                          p_lotto_id::text);
                  END IF;

                  -- La scrittura comune, attraverso la porta: il guard di
                  -- transizione giudica la matrice e il fermo.
                  PERFORM script.fn_doc_scrivi_stato('vendite.fatturazione_lotti'::regclass,
                                                     p_lotto_id, p_stato_doc_fiscale_id);
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_varia_prezzi_versione_listino(
                  p_listino_versione_id vendite.listini_versioni.id%TYPE,
                  -- Tipo esplicito: una percentuale, nessuna colonna di cui sia il riflesso.
                  p_variazione_pct      numeric,
                  -- Tipo esplicito: i decimali dell'arrotondamento, argomento di round().
                  p_decimali            integer,
                  -- Tipo esplicito: un array di id di catalogo.articoli; NULL = tutte le righe.
                  p_filtro_articoli     uuid[] DEFAULT NULL,
                  -- Tipo esplicito: l'interruttore del chiamante (true = anteprima).
                  p_dry_run             boolean DEFAULT false)
               RETURNS TABLE(listino_riga_id      vendite.listini_righe.id%TYPE,
                             articolo_id          vendite.listini_righe.articolo_id%TYPE,
                             articolo_codice      catalogo.articoli.codice%TYPE,
                             articolo_descrizione catalogo.articoli.descrizione%TYPE,
                             prezzo_precedente    vendite.listini_righe.prezzo%TYPE,
                             prezzo_nuovo         vendite.listini_righe.prezzo%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_tx_id   vendite.listini_versioni.tx_id%TYPE;
                  -- Tipo esplicito: un conteggio di righe.
                  v_n       integer;
                  -- Gli intervalli: una costante sola, letta dal controllo e dal
                  --   messaggio.
                  c_pct_min CONSTANT numeric := -99;
                  c_pct_max CONSTANT numeric := 1000;
                  c_dec_min CONSTANT integer := 0;
                  c_dec_max CONSTANT integer := 10;
              BEGIN
                  -- ==========================================================
                  -- Scopo: variare in percentuale i prezzi delle righe attive di
                  --   una versione di listino (tutte, o quelle degli articoli del
                  --   filtro), o mostrarne l'anteprima. Si fa solo in bozza, e lo
                  --   dice la versione, non le righe che il gesto prende. Vedi
                  --   l'intestazione del changeSet 20261115-79.
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_varia_prezzi_versione_listino');

                  -- 1. Parametri.
                  IF p_listino_versione_id IS NULL OR p_listino_versione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_listino_versione_id', p_listino_versione_id),
                          NULL::uuid, 'vendite.fn_varia_prezzi_versione_listino',
                          'p_listino_versione_id (obbligatorio, maggiore di zero)');
                  END IF;
                  IF p_variazione_pct IS NULL OR p_decimali IS NULL OR p_dry_run IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_listino_versione_id', p_listino_versione_id,
                                             'p_variazione_pct', p_variazione_pct,
                                             'p_decimali', p_decimali, 'p_dry_run', p_dry_run),
                          NULL::uuid, 'vendite.fn_varia_prezzi_versione_listino',
                          'p_variazione_pct, p_decimali e p_dry_run (obbligatori)');
                  END IF;

                  -- 2. La versione, nel perimetro. Nel gesto vero FOR UPDATE: fra la
                  --    check e la scrittura la versione non cambia stato.
                  IF p_dry_run THEN
                      SELECT lv.tx_id INTO v_tx_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.id = p_listino_versione_id
                         AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id);
                  ELSE
                      SELECT lv.tx_id INTO v_tx_id
                        FROM vendite.listini_versioni lv
                       WHERE lv.id = p_listino_versione_id
                         AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id)
                         FOR UPDATE OF lv;
                  END IF;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_listino_versione_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Prima cio' che vieta: il primo motivo della check della
                  --    versione, senza riga, come la superficie. Anche
                  --    nell'anteprima.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                      script.fn_check_listino_riga_scrivibile(p_listino_versione_id, NULL, 'UPDATE'),
                      NULL,
                      v_tx_id,
                      jsonb_build_object('listino_versione_id', p_listino_versione_id,
                                         'variazione_pct', p_variazione_pct,
                                         'dry_run', p_dry_run));

                  -- 4. Gli intervalli. Il campo da correggere ha il nome del
                  --    parametro dell'endpoint: esce nel canale COLUMN.
                  IF p_variazione_pct < c_pct_min OR p_variazione_pct > c_pct_max
                     OR p_decimali < c_dec_min OR p_decimali > c_dec_max THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_varia_prezzi_versione_listino',
                          'E_LISTINO_VARIAZIONE_FUORI_INTERVALLO',
                          jsonb_build_object('campo', CASE WHEN p_variazione_pct BETWEEN c_pct_min AND c_pct_max
                                                           THEN 'arrotondamento_decimali'
                                                           ELSE 'variazione_percentuale' END,
                                             'listino_versione_id', p_listino_versione_id,
                                             'variazione_pct', p_variazione_pct,
                                             'decimali', p_decimali),
                          v_tx_id,
                          c_pct_min::text, c_pct_max::text, c_dec_min::text, c_dec_max::text);
                  END IF;

                  -- 5. Il prezzo nuovo, calcolato in un posto solo: l'anteprima lo
                  --    restituisce, il gesto lo scrive (il guard delle righe, in
                  --    bozza, passa) e restituisce il prezzo salvato, alla scala
                  --    della colonna. Prezzo negativo: il CHECK della tabella.
                  RETURN QUERY
                  WITH calc AS (
                      SELECT r.id                                                   AS riga_id,
                             r.articolo_id                                          AS art_id,
                             a.codice                                               AS art_codice,
                             a.descrizione                                          AS art_descrizione,
                             r.prezzo                                               AS prima,
                             round(r.prezzo * (1 + p_variazione_pct / 100), p_decimali) AS dopo
                        FROM vendite.listini_righe r
                        JOIN catalogo.articoli a ON a.id = r.articolo_id
                       WHERE r.listino_versione_id = p_listino_versione_id
                         AND r.attivo
                         AND (p_filtro_articoli IS NULL OR r.articolo_id = ANY (p_filtro_articoli))
                  ), scritte AS (
                      UPDATE vendite.listini_righe lr
                         SET prezzo = c.dopo
                        FROM calc c
                       WHERE lr.id = c.riga_id
                         AND NOT p_dry_run
                      RETURNING lr.id AS riga_id, lr.prezzo AS salvato
                  )
                  SELECT c.riga_id, c.art_id, c.art_codice, c.art_descrizione, c.prima,
                         COALESCE(s.salvato, c.dopo)
                    FROM calc c
                    LEFT JOIN scritte s ON s.riga_id = c.riga_id
                   ORDER BY c.art_codice, c.riga_id;
                  GET DIAGNOSTICS v_n = ROW_COUNT;

                  -- 6. La traccia del gesto, anche a righe zero.
                  IF NOT p_dry_run THEN
                      UPDATE vendite.listini_versioni lv
                         SET meta = jsonb_set(
                                        lv.meta, '{variazioni_percentuali}',
                                        COALESCE(lv.meta -> 'variazioni_percentuali', '[]'::jsonb)
                                        || jsonb_build_array(jsonb_build_object(
                                               'data',                    now(),
                                               'operatore',               v_utente,
                                               'variazione_percentuale',  p_variazione_pct::text,
                                               'arrotondamento_decimali', p_decimali,
                                               'righe_aggiornate',        v_n,
                                               'filtro_articoli',         to_jsonb(p_filtro_articoli))))
                       WHERE lv.id = p_listino_versione_id;
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_contratto(
                  p_contratto_id      vendite.contratti.id%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare un contratto. Con legami: conferma e ritiro
              --   dal BB vendite.fn_documento_ritira_legami, poi lo stato.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_annulla_contratto');

                  -- 1. Parametri.
                  IF p_contratto_id IS NULL OR p_contratto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_contratto',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_contratto_id', p_contratto_id),
                          NULL::uuid, 'vendite.fn_annulla_contratto',
                          'p_contratto_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.contratti t
                   WHERE t.id = p_contratto_id
                     AND script.fn_scope_ef_whitelist_via_contratto(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_contratto',
                          'E_CONTRATTO_NON_TROVATO', jsonb_build_object('id', p_contratto_id), NULL::uuid,
                          p_contratto_id::text);
                  END IF;

                  -- 3. Conferma e ritiro: il BB apre la porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('CONTRATTO', p_contratto_id, p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato (rev 2026-10-26, 20261026-09):
                  --    lo stato d'annullo dal vocabolario, non dal letterale. I guard
                  --    della tabella fanno il resto: matrice, freni (righe di
                  --    commessa EMESSA, figli vivi), avviso. La prima riga del verbo
                  --    dice lo stato che ha gia' (E_DOC_GIA_NELLO_STATO).
                  PERFORM vendite.fn_cambia_stato_contratto(
                      p_contratto_id,
                      script.fn_doc_stato_codice('vendite.contratti'::regclass,
                                                 script.fn_stato_abortito_id('vendite.contratti'::regclass)));

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_commessa(
                  p_commessa_id vendite.commesse.id%TYPE,
                  p_stato       vendite.stati_commessa.codice_interno%TYPE)
               RETURNS TABLE(commessa_id vendite.commesse.id%TYPE,
                             stato_da    vendite.stati_commessa.codice_interno%TYPE,
                             stato_a     vendite.stati_commessa.codice_interno%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    vendite.stati_commessa.codice_interno%TYPE;
                  v_stato_da_id vendite.commesse.stato_commessa_id%TYPE;
                  v_stato_a_id  vendite.stati_commessa.id%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: il verbo di ogni cambio di stato manuale di una
                  --   commessa (modello del documento: prima riga comune,
                  --   scrittura comune). Matrice e condizioni dei passaggi le
                  --   giudica il guard di transizione, all'UPDATE.
                  -- Ritorna: commessa_id, stato_da, stato_a (codice_interno).
                  -- rev 2026-10-26 (20261026-30, brief-modello-documento-
                  --   vendita §14, C-4): sul verbo comune, DEFINER, senza p_user.
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_cambia_stato_commessa');

                  -- 1. Parametri.
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_commessa',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_commessa_id', p_commessa_id),
                          NULL::uuid, 'vendite.fn_cambia_stato_commessa',
                          'p_commessa_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT c.stato_commessa_id, s.codice_interno
                    INTO v_stato_da_id, v_stato_da
                    FROM vendite.commesse c
                    JOIN vendite.stati_commessa s ON s.id = c.stato_commessa_id
                   WHERE c.id = p_commessa_id
                     AND script.fn_scope_ef_whitelist_via_commessa(v_utente, c.id)
                     FOR UPDATE OF c;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_commessa',
                          'E_COMMESSA_NON_TROVATA', jsonb_build_object('p_commessa_id', p_commessa_id),
                          NULL::uuid, p_commessa_id::text);
                  END IF;

                  -- 3. Lo stato chiesto: il codice di uno stato attivo.
                  v_stato_a_id := script.fn_doc_stato_id('vendite.commesse'::regclass, p_stato);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_commessa',
                          'E_STATO_WORKFLOW_NON_TROVATO',
                          jsonb_build_object('p_nuovo_stato', p_stato),
                          NULL::uuid,
                          COALESCE(p_stato, 'NULL'));
                  END IF;

                  -- 4. Prima riga comune: lo stato che ha gia', passaggio di
                  --    processo, azione.
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.commesse'::regclass,
                                                    v_stato_da_id, v_stato_a_id);

                  -- 5. Lo stato, attraverso la porta. Il guard di transizione
                  --    giudica matrice e condizioni; il guard dell'annullo i
                  --    legami.
                  PERFORM script.fn_doc_scrivi_stato('vendite.commesse'::regclass,
                                                     p_commessa_id, v_stato_a_id);

                  RETURN QUERY SELECT p_commessa_id, v_stato_da, p_stato;
              END;
              $function$;
