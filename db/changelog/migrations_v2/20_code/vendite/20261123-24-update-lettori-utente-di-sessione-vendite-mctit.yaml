              CREATE OR REPLACE FUNCTION vendite.fn_programma_chiusura_versione_listino(
                  p_versione_id vendite.listini_versioni.id%TYPE,
                  p_valido_al   vendite.listini_versioni.valido_al%TYPE)
               RETURNS TABLE(versione_id     vendite.listini_versioni.id%TYPE,
                             valido_al_prima vendite.listini_versioni.valido_al%TYPE,
                             valido_al_dopo  vendite.listini_versioni.valido_al%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente     config.user_override_azioni.auth_user_id%TYPE;
                  v_listino_id vendite.listini_versioni.listino_id%TYPE;
                  v_prima      vendite.listini_versioni.valido_al%TYPE;
                  v_stato      config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_tx_id      vendite.listini_versioni.tx_id%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: fissare (o togliere, p_valido_al NULL) la fine
                  --   della validita' di una versione di listino ATTIVA.
                  --   Vedi l'intestazione dei changeSet 20261029-02 e -08.
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametro e versione, nel perimetro.
                  IF p_versione_id IS NULL OR p_versione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_programma_chiusura_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_versione_id', p_versione_id),
                          NULL::uuid, 'vendite.fn_programma_chiusura_versione_listino',
                          'p_versione_id (obbligatorio, maggiore di zero)');
                  END IF;

                  SELECT lv.listino_id, lv.valido_al, s.codice_interno, lv.tx_id
                    INTO v_listino_id, v_prima, v_stato, v_tx_id
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = p_versione_id
                     AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id)
                     FOR UPDATE OF lv;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_programma_chiusura_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_versione_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Prima cio' che vieta.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_programma_chiusura_versione_listino',
                      script.fn_check_versione_listino_chiudibile(p_versione_id, p_valido_al),
                      'valido_al',
                      v_tx_id,
                      jsonb_build_object('versione_id', p_versione_id,
                                         'listino_id', v_listino_id, 'stato', v_stato,
                                         'valido_al_prima', v_prima, 'valido_al', p_valido_al));

                  -- 3. La fine, con la porta aperta per questa versione. Lo
                  --    stato non cambia: CHIUSA la scrive il job.
                  IF p_valido_al IS DISTINCT FROM v_prima THEN
                      PERFORM set_config('zeroerp.listino_versione_fine', p_versione_id::text, true);
                      UPDATE vendite.listini_versioni lv
                         SET valido_al = p_valido_al
                       WHERE lv.id = p_versione_id;
                      PERFORM set_config('zeroerp.listino_versione_fine', '', true);
                  END IF;

                  RETURN QUERY SELECT p_versione_id, v_prima, p_valido_al;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_rettifica_riga_listino(
                  p_listino_riga_id vendite.listini_righe.id%TYPE,
                  p_prezzo          vendite.listini_righe.prezzo%TYPE,
                  -- Tipo esplicito: la frase dell'operatore, che finisce in meta
                  --   (jsonb), nessuna colonna di cui sia il riflesso.
                  p_motivo          text)
               RETURNS TABLE(listino_riga_id   vendite.listini_righe.id%TYPE,
                             prezzo_precedente vendite.listini_righe.prezzo%TYPE,
                             prezzo_nuovo      vendite.listini_righe.prezzo%TYPE,
                             motivo            text)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_versione_id vendite.listini_righe.listino_versione_id%TYPE;
                  v_prima       vendite.listini_righe.prezzo%TYPE;
              v_dopo        vendite.listini_righe.prezzo%TYPE;
                  v_tx_id       vendite.listini_righe.tx_id%TYPE;
                  -- Tipo esplicito: il motivo ripulito, come p_motivo.
                  v_motivo      text := btrim(p_motivo);
                  -- Il tetto del motivo: una costante sola, letta dal controllo e
                  --   dal messaggio.
                  c_motivo_max  CONSTANT integer := 500;
              BEGIN
                  -- ==========================================================
                  -- Scopo: rettificare il prezzo di una riga del listino in uso,
                  --   col motivo, e lasciarne la traccia nella riga
                  --   (meta.rettifiche_controllate[]). E' l'unica scrittura di una
                  --   riga fuori dalla bozza. Vedi l'intestazione del changeSet
                  --   20261115-67.
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri e riga, nel perimetro.
                  IF p_listino_riga_id IS NULL OR p_listino_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_rettifica_riga_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_listino_riga_id', p_listino_riga_id),
                          NULL::uuid, 'vendite.fn_rettifica_riga_listino',
                          'p_listino_riga_id (obbligatorio, maggiore di zero)');
                  END IF;
                  IF p_prezzo IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_rettifica_riga_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_listino_riga_id', p_listino_riga_id, 'campo', 'prezzo'),
                          NULL::uuid, 'vendite.fn_rettifica_riga_listino',
                          'p_prezzo (obbligatorio)');
                  END IF;

                  SELECT lr.listino_versione_id, lr.prezzo, lr.tx_id
                    INTO v_versione_id, v_prima, v_tx_id
                    FROM vendite.listini_righe lr
                   WHERE lr.id = p_listino_riga_id
                     AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lr.listino_versione_id)
                     FOR UPDATE OF lr;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_rettifica_riga_listino',
                          'E_VENDITE_LISTINO_RIGA_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_listino_riga_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Prima cio' che vieta: il primo motivo della check, sul prezzo.
                  --    La riga e' sotto FOR UPDATE: un documento non la cita fra la
                  --    check e la scrittura (la FK prende il KEY SHARE).
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_rettifica_riga_listino',
                      script.fn_check_listino_riga_rettificabile(p_listino_riga_id),
                      'prezzo',
                      v_tx_id,
                      jsonb_build_object('listino_riga_id', p_listino_riga_id,
                                         'listino_versione_id', v_versione_id,
                                         'prezzo_prima', v_prima, 'prezzo', p_prezzo));

                  -- 3. Il motivo: obbligatorio, al piu' c_motivo_max caratteri.
                  IF v_motivo IS NULL OR v_motivo = '' OR length(v_motivo) > c_motivo_max THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_rettifica_riga_listino',
                          'E_RIGA_LISTINO_RETTIFICA_MOTIVO_OBBLIGATORIO',
                          jsonb_build_object('campo', 'motivo', 'listino_riga_id', p_listino_riga_id,
                                             'lunghezza', length(v_motivo)),
                          v_tx_id,
                          c_motivo_max::text);
                  END IF;

                  -- 4. Il prezzo e la traccia, con la porta aperta per QUESTA riga: il
                  --    guard delle righe la onora col proprietario della tabella, e
                  --    dentro la porta lascia cambiare solo il prezzo e meta. Prezzo
                  --    negativo: il CHECK della tabella. La porta si richiude anche
                  --    in errore.
                  BEGIN
                      PERFORM set_config('zeroerp.listino_riga_rettifica', p_listino_riga_id::text, true);
                      -- Il prezzo, poi la traccia col valore SALVATO (alla scala
                      -- della colonna, come prezzo_precedente).
                      UPDATE vendite.listini_righe lr
                         SET prezzo = p_prezzo
                       WHERE lr.id = p_listino_riga_id
                      RETURNING lr.prezzo INTO v_dopo;
                      UPDATE vendite.listini_righe lr
                         SET meta = jsonb_set(
                                        lr.meta, '{rettifiche_controllate}',
                                        COALESCE(lr.meta -> 'rettifiche_controllate', '[]'::jsonb)
                                        || jsonb_build_array(jsonb_build_object(
                                               'data',              now(),
                                               'operatore',         v_utente,
                                               'prezzo_precedente', v_prima::text,
                                               'prezzo_nuovo',      v_dopo::text,
                                               'motivo',            v_motivo)))
                       WHERE lr.id = p_listino_riga_id;
                      PERFORM set_config('zeroerp.listino_riga_rettifica', '', true);
                  EXCEPTION WHEN OTHERS THEN
                      PERFORM set_config('zeroerp.listino_riga_rettifica', '', true);
                      RAISE;
                  END;

                  RETURN QUERY SELECT p_listino_riga_id, v_prima, v_dopo, v_motivo;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_ordine(
                  p_ordine_id vendite.ordini.id%TYPE,
                  p_stato     config.stati_doc_ordini.codice_interno%TYPE)
               RETURNS TABLE(ordine_id        vendite.ordini.id%TYPE,
                             stato_precedente config.stati_doc_ordini.codice_interno%TYPE,
                             stato_nuovo      config.stati_doc_ordini.codice_interno%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    config.stati_doc_ordini.codice_interno%TYPE;
                  v_stato_da_id vendite.ordini.stato_doc_ordine_id%TYPE;
                  v_stato_a_id  config.stati_doc_ordini.id%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: il verbo di ogni cambio di stato manuale di un
                  --   ordine (modello del documento: prima riga comune,
                  --   scrittura comune). Matrice, righe, aliquote, prezzi e
                  --   annullabilita' li giudica il guard di transizione,
                  --   all'UPDATE.
                  -- Ritorna: ordine_id, stato_precedente, stato_nuovo
                  --   (codice_interno).
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_ordine',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('param', 'p_ordine_id', 'value', p_ordine_id),
                          NULL::uuid,
                          'p_ordine_id = ' || COALESCE(p_ordine_id::text, 'NULL'));
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT o.stato_doc_ordine_id, s.codice_interno
                    INTO v_stato_da_id, v_stato_da
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini s ON s.id = o.stato_doc_ordine_id
                   WHERE o.id = p_ordine_id
                     AND script.fn_scope_ef_whitelist_via_ordine(v_utente, o.id)
                     FOR UPDATE OF o;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_ordine',
                          'E_ORD_NOT_FOUND', jsonb_build_object('id', p_ordine_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 3. Lo stato chiesto: il codice di uno stato attivo.
                  v_stato_a_id := script.fn_doc_stato_id('vendite.ordini'::regclass, p_stato);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_ordine',
                          'E_STATO_WORKFLOW_NON_TROVATO',
                          jsonb_build_object('codice', p_stato),
                          NULL::uuid,
                          COALESCE(p_stato, 'NULL'));
                  END IF;

                  -- 4. Prima riga comune: passaggio di processo, azione.
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.ordini'::regclass,
                                                    v_stato_da_id, v_stato_a_id);

                  -- 5. Lo stato, attraverso la porta. Il guard di transizione
                  --    giudica matrice, righe attive alla conferma, aliquote,
                  --    prezzi autorizzati e annullabilita'.
                  PERFORM script.fn_doc_scrivi_stato('vendite.ordini'::regclass,
                                                     p_ordine_id, v_stato_a_id);

                  RETURN QUERY SELECT p_ordine_id, v_stato_da, p_stato;
              END;
              $function$;
        - sql:
            dbms: postgresql
