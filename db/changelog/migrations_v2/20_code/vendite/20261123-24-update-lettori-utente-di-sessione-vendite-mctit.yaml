            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cessa_contratto(
                  p_contratto_id vendite.contratti.id%TYPE,
                  p_valido_al    vendite.contratti.valido_al%TYPE)
               RETURNS TABLE(contratto_id     vendite.contratti.id%TYPE,
                             stato_precedente config.stati_doc_contratti.codice_interno%TYPE,
                             stato_nuovo      config.stati_doc_contratti.codice_interno%TYPE,
                             programmata      boolean)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    config.stati_doc_contratti.codice_interno%TYPE;
                  v_stato_da_id vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_cessato     config.stati_doc_contratti.codice_interno%TYPE;
                  v_cessato_id  config.stati_doc_contratti.id%TYPE;
                  v_oggi        vendite.contratti.valido_al%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: cessare un contratto alla data p_valido_al. Oggi:
                  --   data e stato; futura: solo la data (la chiude il job).
                  --   Vedi l'intestazione del changeSet.
                  --   rev 2026-10-31 (20261031-11, brief-modello-documento-vendita §17): la destinazione
                  --   e' lo stato di cessazione del vocabolario, non 'CESSATO'.
                  -- Ritorna: contratto_id, stato_precedente, stato_nuovo
                  --   (codice_interno), programmata (lo stato non e' cambiato).
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_cessa_contratto');

                  -- 1. Parametri.
                  IF p_contratto_id IS NULL OR p_contratto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratto',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_contratto_id', p_contratto_id),
                          NULL::uuid, 'vendite.fn_cessa_contratto',
                          'p_contratto_id (obbligatorio, maggiore di zero)');
                  END IF;

                  IF p_valido_al IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratto',
                          'E_CONTRATTO_CESSAZIONE_SENZA_DATA',
                          jsonb_build_object('contratto_id', p_contratto_id, 'campo', 'valido_al'),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT c.stato_doc_contratto_id, s.codice_interno
                    INTO v_stato_da_id, v_stato_da
                    FROM vendite.contratti c
                    JOIN config.stati_doc_contratti s ON s.id = c.stato_doc_contratto_id
                   WHERE c.id = p_contratto_id
                     AND script.fn_scope_ef_whitelist_via_contratto(v_utente, c.id)
                     FOR UPDATE OF c;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratto',
                          'E_CONTRATTO_NON_TROVATO', jsonb_build_object('id', p_contratto_id), NULL::uuid,
                          p_contratto_id::text);
                  END IF;

                  -- 3. La destinazione del passaggio: lo stato di cessazione, dal
                  --    vocabolario; il suo codice per i messaggi e la risposta.
                  v_cessato_id := script.fn_stato_cessazione_id('vendite.contratti'::regclass);
                  IF v_cessato_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_contratti.cessazione'),
                          NULL::uuid, 'stato di cessazione (config.stati_doc_contratti.cessazione)');
                  END IF;
                  v_cessato := script.fn_doc_stato_codice('vendite.contratti'::regclass, v_cessato_id);

                  -- 4. Prima riga comune: lo stato che ha gia', azione.
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.contratti'::regclass,
                                                    v_stato_da_id, v_cessato_id);

                  -- 5. La strada, dalla matrice: la cessazione programmata non
                  --    scrive lo stato, e il guard di transizione non la vede.
                  IF NOT EXISTS (SELECT 1
                                   FROM script.fn_doc_passaggio('vendite.contratti'::regclass,
                                                                v_stato_da_id, v_cessato_id)) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratto',
                          'E_CONTRATTO_STATO_TRANSIZIONE_INVALIDA',
                          jsonb_build_object('contratto_id', p_contratto_id,
                                             'stato_da', v_stato_da, 'stato_a', v_cessato,
                                             'valido_al', p_valido_al),
                          NULL::uuid,
                          p_contratto_id::text, v_stato_da, v_cessato, p_valido_al::text);
                  END IF;

                  -- 6. Niente riscrittura storica: la data non e' nel passato.
                  v_oggi := script.fn_data_operativa();
                  IF p_valido_al < v_oggi THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cessa_contratto',
                          'E_CONTRATTO_VALIDO_AL_RETROATTIVO',
                          jsonb_build_object('contratto_id', p_contratto_id,
                                             'valido_al',    p_valido_al,
                                             'today',        v_oggi,
                                             'campo',        'valido_al'),
                          NULL::uuid,
                          p_valido_al::text, v_oggi::text);
                  END IF;

                  -- 7. La data. I guard della testata la giudicano (le date di
                  --    validita', il lucchetto fuori bozza).
                  UPDATE vendite.contratti c
                     SET valido_al = p_valido_al
                   WHERE c.id = p_contratto_id
                     AND c.valido_al IS DISTINCT FROM p_valido_al;

                  -- 8. Oggi: lo stato, attraverso la porta. Futura: e' programmata.
                  IF p_valido_al = v_oggi THEN
                      PERFORM script.fn_doc_scrivi_stato('vendite.contratti'::regclass,
                                                         p_contratto_id, v_cessato_id);
                      RETURN QUERY SELECT p_contratto_id, v_stato_da, v_cessato, false;
                  ELSE
                      RETURN QUERY SELECT p_contratto_id, v_stato_da, v_stato_da, true;
                  END IF;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_riga_correggi_qta_evasa(
                  p_ddt_riga_id   vendite.ddt_righe.id%TYPE,
                  p_qta_operativa vendite.ddt_righe.qta_operativa%TYPE
              )
              RETURNS vendite.ordini_righe_fulfillment.qta_evasa%TYPE
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: correggere la quantita' evasa di una riga di DDT in
              --   bozza (D-2 di brief-db-ddt-righe-evase-dall-ordine): riga e
              --   legame nella stessa operazione, entro il residuo, poi lo stato
              --   dell'ordine. Vedi l'intestazione del changeSet.
              -- Ritorna: la nuova qta_evasa (unita' base).
              -- =========================================================
              DECLARE
                  v_utente    config.user_override_azioni.auth_user_id%TYPE;
                  v_ddt_id    vendite.ddt_righe.ddt_id%TYPE;
                  v_qta_base  vendite.ddt_righe.quantita%TYPE;
                  v_ordine_id vendite.ordini.id%TYPE;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_ddt_riga_correggi_qta_evasa');

                  -- 1. Parametri.
                  IF p_ddt_riga_id IS NULL OR p_ddt_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_ddt_riga_correggi_qta_evasa',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ddt_riga_id', p_ddt_riga_id),
                          NULL::uuid, 'vendite.fn_ddt_riga_correggi_qta_evasa',
                          'p_ddt_riga_id (obbligatorio, maggiore di zero)');
                  END IF;

                  IF p_qta_operativa IS NULL OR p_qta_operativa <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_ddt_riga_correggi_qta_evasa',
                          'E_QTA_NON_POSITIVA',
                          jsonb_build_object('campo', 'qta_operativa',
                                             'ddt_riga_id', p_ddt_riga_id,
                                             'qta_operativa', p_qta_operativa),
                          NULL::uuid, COALESCE(p_qta_operativa::text, 'vuota'));
                  END IF;

                  -- 2. La riga e il suo DDT, FOR UPDATE, nel perimetro (predicato
                  --    della policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT dr.ddt_id
                    INTO v_ddt_id
                    FROM vendite.ddt_righe dr
                    JOIN vendite.ddt d ON d.id = dr.ddt_id
                   WHERE dr.id = p_ddt_riga_id
                     AND script.fn_scope_ef_whitelist_via_ddt(v_utente, d.id)
                     FOR UPDATE OF d, dr;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_ddt_riga_correggi_qta_evasa',
                          'E_DDT_RIGA_NON_TROVATA',
                          jsonb_build_object('ddt_riga_id', p_ddt_riga_id),
                          NULL::uuid, p_ddt_riga_id::text);
                  END IF;

                  -- 3. La regola sta nella check: qui si solleva il primo motivo.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_ddt_riga_correggi_qta_evasa',
                      script.fn_check_ddt_riga_correggi_qta_evasa(p_ddt_riga_id),
                      NULL, NULL::uuid,
                      jsonb_build_object('ddt_riga_id', p_ddt_riga_id, 'ddt_id', v_ddt_id));

                  -- 4. Riga e legame, con la porta aperta per QUESTA riga. La
                  --    quantita' base la ricalcola trgfn_qta_from_operativa; il
                  --    residuo lo giudica il guard di consistenza del legame.
                  PERFORM set_config('zeroerp.ddt_riga_correggi_qta', p_ddt_riga_id::text, true);

                  UPDATE vendite.ddt_righe dr
                     SET qta_operativa = p_qta_operativa
                   WHERE dr.id = p_ddt_riga_id
                  RETURNING dr.quantita INTO v_qta_base;

                  -- Il legame con l'ordine (se c'e')...
                  UPDATE vendite.ordini_righe_fulfillment f
                     SET qta_evasa = v_qta_base
                   WHERE f.ddt_riga_id = p_ddt_riga_id;

                  -- ...e quello con il reso da ri-consegnare (se c'e', D-7).
                  UPDATE vendite.resi_righe_riconsegne rr
                     SET qta = v_qta_base
                   WHERE rr.ddt_riga_id = p_ddt_riga_id;

                  PERFORM set_config('zeroerp.ddt_riga_correggi_qta', '', true);

                  -- 5. Lo stato dell'ordine, se la riga ne evade uno (al piu' un
                  --    legame: lo garantisce la check).
                  SELECT orr.ordine_id
                    INTO v_ordine_id
                    FROM vendite.ordini_righe_fulfillment f
                    JOIN vendite.ordini_righe orr ON orr.id = f.ordine_riga_id
                   WHERE f.ddt_riga_id = p_ddt_riga_id;

                  IF v_ordine_id IS NOT NULL THEN
                      PERFORM vendite.fn_ordine_proietta_stato_evasione(v_ordine_id);
                  END IF;

                  RETURN v_qta_base;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_attiva_versione_listino(
                  p_versione_id vendite.listini_versioni.id%TYPE)
               RETURNS TABLE(versione_id      vendite.listini_versioni.id%TYPE,
                             stato_precedente config.stati_doc_listino_versioni.codice_interno%TYPE,
                             stato_nuovo      config.stati_doc_listino_versioni.codice_interno%TYPE,
                             versioni_chiuse  integer)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  c_attiva      CONSTANT config.stati_doc_listino_versioni.codice_interno%TYPE := 'ATTIVA';
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_stato_da_id vendite.listini_versioni.stato_doc_listino_versione_id%TYPE;
                  v_stato_a_id  config.stati_doc_listino_versioni.id%TYPE;
                  v_tx_id       vendite.listini_versioni.tx_id%TYPE;
                  v_prec_id     vendite.listini_versioni.id%TYPE;
                  v_fine        vendite.listini_versioni.valido_al%TYPE;
                  -- CONTEGGIO delle versioni chiuse.
                  v_chiuse      integer := 0;
              BEGIN
                  -- ==========================================================
                  -- Scopo: attivare una versione di listino, chiudendo le
                  --   precedenti. Vedi l'intestazione dei changeSet 20261028-12, -32
                  --   e 20261029-09.
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_attiva_versione_listino');

                  -- 1. Parametro e versione, nel perimetro.
                  IF p_versione_id IS NULL OR p_versione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_attiva_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_versione_id', p_versione_id),
                          NULL::uuid, 'vendite.fn_attiva_versione_listino',
                          'p_versione_id (obbligatorio, maggiore di zero)');
                  END IF;

                  SELECT lv.stato_doc_listino_versione_id, s.codice_interno, lv.tx_id
                    INTO v_stato_da_id, v_stato_da, v_tx_id
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = p_versione_id
                     AND script.fn_scope_ef_whitelist_via_listino_versione(v_utente, lv.id)
                     FOR UPDATE OF lv;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_attiva_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_versione_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Prima riga comune: lo stato che ha gia', l'azione.
                  v_stato_a_id := script.fn_doc_stato_id('vendite.listini_versioni'::regclass, c_attiva);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_attiva_versione_listino',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_listino_versioni',
                                             'codice', c_attiva),
                          NULL::uuid, 'stato ATTIVA (config.stati_doc_listino_versioni)');
                  END IF;
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.listini_versioni'::regclass,
                                                    v_stato_da_id, v_stato_a_id);

                  -- 3. Prima cio' che vieta, prima di toccare le altre versioni.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_attiva_versione_listino',
                      script.fn_check_versione_listino_attivabile(p_versione_id),
                      NULL,
                      v_tx_id,
                      jsonb_build_object('versione_id', p_versione_id,
                                         'stato_da', v_stato_da, 'stato_a', c_attiva));

                  -- 4. Le precedenti che si sovrappongono si chiudono il giorno
                  --    prima della decorrenza nuova: lo stesso lettore
                  --    dell'anteprima. Una alla volta, con la porta aperta
                  --    sulla sua versione (il guard per stato, 20261029-07).
                  FOR v_prec_id, v_fine IN
                      SELECT d.versione_id, d.valido_al_dopo
                        FROM vendite.fn_versioni_listino_da_chiudere(p_versione_id) d
                  LOOP
                      PERFORM set_config('zeroerp.listino_versione_fine', v_prec_id::text, true);
                      UPDATE vendite.listini_versioni lv
                         SET valido_al = v_fine
                       WHERE lv.id = v_prec_id;
                      v_chiuse := v_chiuse + 1;
                  END LOOP;
                  PERFORM set_config('zeroerp.listino_versione_fine', '', true);

                  -- 5. Lo stato, attraverso la porta.
                  PERFORM script.fn_doc_scrivi_stato('vendite.listini_versioni'::regclass,
                                                     p_versione_id, v_stato_a_id);

                  RETURN QUERY SELECT p_versione_id, v_stato_da, c_attiva, v_chiuse;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_event_log_deriva_scope()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  -- ⚠️ %TYPE su tutto cio' che riflette una colonna
                  --    (linee-guida-sql §5). `v_modo` no: e' un letterale
                  --    di dispatch.
                  v_modo         text;
                  v_sr_id        vendite.event_log.emittente_soggetto_ruolo_id%TYPE;
                  v_auth_user_id vendite.event_log.auth_user_id%TYPE;
                  v_ammessi      text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Compilare da se' le cose che il database sa e il
                  --   chiamante no: DI CHI e' la riga e CHI l'ha scritta.
                  --
                  -- ⭐ LA REGOLA (D-12):
                  --   il diario rifiuta una riga SOLO quando non riesce a dire
                  --   di chi e'. Un emittente disattivato o un documento
                  --   annullato si registrano lo stesso: il fatto e' accaduto,
                  --   e rifiutare la riga distruggerebbe l'unica prova che lo
                  --   spiegherebbe. L'attivita' NUOVA su un emittente
                  --   disattivato e' gia' bloccata sui documenti.
                  --
                  -- ⚠️ Non si fida di cio' che passa il chiamante su nessuno
                  --   dei due campi: sono fatti del database, e la logica non
                  --   si duplica in Python.
                  --
                  -- ⭐ Rev 2026-09-18 (Passo D): QUANDO SCADE non si calcola
                  --   piu' qui. Lo scrive `dbops.trgfn_cleanup_at_alla_nascita`
                  --   (trigger _m50_, dopo questo), che legge termine e
                  --   colonna base dalla regola CLEANUP_AT: lo stesso BB dei
                  --   quattro registri di fatturazione e push. La copia
                  --   `vendite.fn_event_log_ttl_days` e' ritirata.
                  -- =========================================================

                  -- 1. Da che parte si guarda.
                  -- ⭐ Rev 2026-08-22 (L4). Qui c'era un CASE scritto a mano con i tre
                  --   tipi. Il modo vive adesso nella STESSA RIGA del tipo, in
                  --   config.tipi_entita: aggiungere un tipo giornalabile e' un seed,
                  --   non tre modifiche coordinate (CHECK + questo CASE + il modo in
                  --   fn_resolve_emittente_sr_id). Configurazione e trigger non
                  --   possono piu' dissentire, perche' sono lo stesso dato.
                  -- ⚠️ NULL qui significa DUE cose, e vanno entrambe rifiutate allo
                  --   stesso modo: il tipo non esiste a catalogo, oppure esiste ma NON
                  --   e' giornalabile (modo NULL, come TASK_RUN — puntabile da un
                  --   errore, senza un padrone da cui derivare il perimetro).
                  SELECT te.modo_risoluzione_emittente
                    INTO v_modo
                    FROM config.tipi_entita te
                   WHERE te.codice = NEW.entity_type
                     AND NOT script.fn_e_obsoleto(te.obsoleto_dal);

                  -- ⛔ Rev 2026-08-22 (20260822-47). Questo ramo mancava, e la
                  --   versione precedente si affidava al CHECK sulla colonna.
                  --   Ma i BEFORE ROW girano PRIMA dei CHECK: con un tipo fuori
                  --   vocabolario il CASE cadeva a NULL e il risolutore
                  --   rispondeva «il modo di risoluzione «» non esiste» —
                  --   E_PARAMETRO_INVALIDO, e un messaggio che nomina un
                  --   concetto interno al database invece del dato passato.
                  --   Il CHECK resta come invariante della colonna; qui si
                  --   presidia il PERCORSO.
                  IF v_modo IS NULL THEN
                      -- ⭐ L'elenco dei tipi ammessi si legge dal CATALOGO, non si
                      --   scrive nel messaggio: cosi' la frase resta vera il giorno che
                      --   il catalogo cresce. E' il motivo per cui il messaggio 980 e'
                      --   passato da uno a due segnaposto nella stessa passata
                      --   (arita': due `%s`, due valori nel VARIADIC).
                      SELECT string_agg(te.codice, ', ' ORDER BY te.codice)
                        INTO v_ammessi
                        FROM config.tipi_entita te
                       WHERE te.modo_risoluzione_emittente IS NOT NULL
                         AND NOT script.fn_e_obsoleto(te.obsoleto_dal);

                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_event_log_deriva_scope',
                          'E_EVENT_LOG_ENTITY_TYPE_IGNOTO',
                          jsonb_build_object(
                              'detail',      'entity_type fuori dal vocabolario del giornale',
                              'entity_type', NEW.entity_type,
                              'entity_id',   NEW.entity_id,
                              'event_code',  NEW.event_code
                          ),
                          NULL::uuid,
                          NEW.entity_type,
                          v_ammessi
                      );
                  END IF;

                  -- 2. Di chi e'. La risoluzione gira FUORI dalla row security
                  --    (SECURITY DEFINER): «non la vedo» non e' «non esiste».
                  v_sr_id := script.fn_resolve_emittente_sr_id(v_modo, NEW.entity_id);

                  IF v_sr_id IS NULL THEN
                      -- ⛔ L'entita' non esiste: non c'e' modo di dire di chi
                      --    sia la riga. Codice DIVERSO dal precedente perche'
                      --    il rimedio e' diverso — li' «usa uno dei tre tipi»,
                      --    qui «quell'entita' non c'e'».
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_event_log_deriva_scope',
                          'E_EVENT_LOG_SCOPE_NON_RISOLTO',
                          jsonb_build_object(
                              'detail',      'Entita non trovata: perimetro non derivabile',
                              'entity_type', NEW.entity_type,
                              'entity_id',   NEW.entity_id,
                              'event_code',  NEW.event_code
                          ),
                          NULL::uuid,
                          NEW.entity_type,
                          NEW.entity_id::text
                      );
                  END IF;

                  NEW.emittente_soggetto_ruolo_id := v_sr_id;

                  -- 3. Chi, come numero. `user_insert` (il nome) lo scrive il
                  --    trigger di audit leggendo app.jwt_user; qui si tiene
                  --    l'id, che regge a un rename. NULL sul canale batch, dove
                  --    non c'e' un utente: li' «chi» resta user_insert.
                  v_auth_user_id := script.fn_utente_di_sessione('vendite.trgfn_event_log_deriva_scope');
                  NEW.auth_user_id := v_auth_user_id;

                  RETURN NEW;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_lotto(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                  p_stato    config.stati_doc_fiscale.codice_interno%TYPE)
               RETURNS TABLE(lotto_id vendite.fatturazione_lotti.id%TYPE,
                             stato_da config.stati_doc_fiscale.codice_interno%TYPE,
                             stato_a  config.stati_doc_fiscale.codice_interno%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    config.stati_doc_fiscale.codice_interno%TYPE;
                  v_stato_da_id vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                  v_stato_a_id  config.stati_doc_fiscale.id%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: il verbo dei passaggi manuali dello stato fiscale
                  --   di un lotto (modello del documento: prima riga comune,
                  --   scrittura comune). La matrice la giudica il guard di
                  --   transizione, all'UPDATE.
                  -- Ritorna: lotto_id, stato_da, stato_a (codice_interno).
                  -- rev 2026-10-27 (20261027-08, brief-modello-documento-
                  --   vendita §15): nasce.
                  -- ==========================================================
                  v_utente := script.fn_utente_di_sessione('vendite.fn_cambia_stato_lotto');

                  -- 1. Parametri.
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_lotto',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_lotto_id', p_lotto_id),
                          NULL::uuid, 'vendite.fn_cambia_stato_lotto',
                          'p_lotto_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. Il lotto FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT l.stato_doc_fiscale_id, s.codice_interno
                    INTO v_stato_da_id, v_stato_da
                    FROM vendite.fatturazione_lotti l
                    JOIN config.stati_doc_fiscale s ON s.id = l.stato_doc_fiscale_id
                   WHERE l.id = p_lotto_id
                     AND script.fn_scope_ef_whitelist_via_lotto(v_utente, l.id)
                     FOR UPDATE OF l;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_lotto',
                          'E_LOTTO_NON_TROVATO', jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::text);
                  END IF;

                  -- 3. Lo stato chiesto: il codice di uno stato attivo.
                  v_stato_a_id := script.fn_doc_stato_id('vendite.fatturazione_lotti'::regclass, p_stato);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_lotto',
                          'E_STATO_WORKFLOW_NON_TROVATO',
                          jsonb_build_object('p_nuovo_stato', p_stato),
                          NULL::uuid,
                          COALESCE(p_stato, 'NULL'));
                  END IF;

                  -- 4. Prima riga comune: lo stato che ha gia', passaggio di
                  --    processo, azione.
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.fatturazione_lotti'::regclass,
                                                    v_stato_da_id, v_stato_a_id);

                  -- 5. Lo stato, attraverso la porta. Il guard di transizione
                  --    giudica la matrice; la coerenza lotto <-> fatture le
                  --    fatture.
                  PERFORM script.fn_doc_scrivi_stato('vendite.fatturazione_lotti'::regclass,
                                                     p_lotto_id, v_stato_a_id);

                  RETURN QUERY SELECT p_lotto_id, v_stato_da, p_stato;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_annulla_offerta(
                  p_offerta_id        vendite.offerte_commerciali.id%TYPE,
                  p_motivazione       vendite.offerte_commerciali.motivazione_rifiuto%TYPE,
                  p_legami_confermati integer DEFAULT NULL)
               RETURNS integer
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: annullare un'offerta. Con legami (la revisione
              --   precedente che torna emessa): conferma dal BB
              --   vendite.fn_documento_ritira_legami, poi lo stato col verbo
              --   di stato, che chiede la motivazione.
              --   p_legami_confermati e' un CONTEGGIO: tipo nudo. Vedi
              --   l'intestazione del changeSet.
              -- Ritorna: i legami confermati (0 se non ce n'erano).
              -- =========================================================
              DECLARE
                  v_utente  config.user_override_azioni.auth_user_id%TYPE;
                  v_trovato boolean;
                  -- CONTEGGIO dei legami confermati.
                  v_legami  integer;
              BEGIN
                  v_utente := script.fn_utente_di_sessione('vendite.fn_annulla_offerta');

                  -- 1. Parametri.
                  IF p_offerta_id IS NULL OR p_offerta_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_offerta',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_offerta_id', p_offerta_id),
                          NULL::uuid, 'vendite.fn_annulla_offerta',
                          'p_offerta_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT true
                    INTO v_trovato
                    FROM vendite.offerte_commerciali t
                   WHERE t.id = p_offerta_id
                     AND script.fn_scope_ef_whitelist_via_offerta(v_utente, t.id)
                     FOR UPDATE;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_annulla_offerta',
                          'E_OFFERTA_NON_TROVATA', jsonb_build_object('id', p_offerta_id), NULL::uuid,
                          p_offerta_id::text);
                  END IF;

                  -- 3. Prima cio' che vieta, poi la conferma: il BB apre la
                  --    porta e la lascia aperta.
                  v_legami := vendite.fn_documento_ritira_legami('OFFERTA_COMMERCIALE', p_offerta_id,
                                                                 p_legami_confermati);

                  -- 4. Lo stato, dal verbo di stato, con la motivazione (O-3):
                  --    lo stato d'annullo dal vocabolario. La prima riga del
                  --    verbo dice lo stato che ha gia' e l'azione (emetti_offerta
                  --    sull'annullo dell'accettata); i guard della tabella fanno
                  --    il resto: matrice, documenti vivi, avviso.
                  PERFORM vendite.fn_cambia_stato_offerta(
                      p_offerta_id,
                      script.fn_doc_stato_codice('vendite.offerte_commerciali'::regclass,
                                                 script.fn_stato_abortito_id('vendite.offerte_commerciali'::regclass)),
                      p_motivazione);

                  -- 5. Porta chiusa.
                  PERFORM set_config('zeroerp.doc_ritira_legami', '', true);

                  RETURN v_legami;
              END;
              $function$;
