# ------------------------------------------------------------
# FASE C (C-1, pezzo 2) — IL GUARD SOLLEVA ANCHE L'ALIQUOTA MANCANTE
#   vendite.trgfn_ddt_guard_causale_emissione
#   Piano: brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter
#
# ── ⭐ PERCHE' QUESTO GUARD E NON UNO NUOVO ───────────────────────────
#   E' gia' il gate del VALORE DELLA RIGA: sollevava
#   E_DDT_CAUSALE_OBBLIGATORIA (l'intento) e E_DDT_PREZZO_NON_RISOLVIBILE (il
#   prezzo). L'aliquota e' la terza faccia della stessa cosa, e la struttura del
#   corpo — un LOOP sui motivi con un ELSIF per codice — e' fatta per crescere
#   cosi'. Un trigger nuovo aggiungerebbe un BEFORE UPDATE in piu' sulla stessa
#   tabella per una condizione che questa funzione gia' riceve.
#
# ── ⚠️ IL NOME ORA DICE MENO DI QUEL CHE FA, E LO SCRIVO ─────────────
#   `trgfn_ddt_guard_causale_emissione` nominava la causale quando i motivi
#   erano uno; oggi ne solleva tre e la causale e' solo il primo. Il nome NON si
#   cambia — rinominare una trigger function significa rinominare il trigger,
#   ogni doc auto-gen che la cita e ogni pgTAP che la nomina, per un guadagno di
#   sola leggibilita'. Ma chi legge deve saperlo dal corpo, non dedurlo: sta
#   scritto nello Scopo qui sotto.
#
# ── ⚠️ IL VARIADIC PORTA IL NUMERO DI RIGA, NON L'ID ─────────────────
#   Il gemello E_DDT_PREZZO_NON_RISOLVIBILE passa `riga_id` — un id tecnico che
#   a una persona non dice niente e che non si puo' cercare a mano. Il VARIADIC
#   compone la FRASE CHE UNA PERSONA LEGGE, quindi il codice nuovo passa
#   `riga_nr`, che e' il numero stampato sul documento. L'id resta nel context,
#   che e' il canale di chi diagnostica. ⭐ Non si "corregge" il gemello nello
#   stesso file: sarebbe cambiare il testo di un messaggio in servizio dentro un
#   changeSet che parla d'altro.
#
# ── ⚠️ CONFLITTO_STATO, non DATO_ERRATO ──────────────────────────────
#   E_DDT_RIGA_IVA_MANCANTE nasce CONFLITTO_STATO (409) come i suoi due
#   gemelli, e lo decide la descrizione della classe: la richiesta e' «porta il
#   DDT a EMESSO», e non c'e' un campo di QUELLA richiesta da correggere — e'
#   la situazione del documento a non consentirla. Ne discende che nel context
#   NON va la chiave `campo`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260828-03-update-trgfn-ddt-guard-causale-emissione-iva-mctit.yaml

  - changeSet:
      id: 20260828-03-update-trgfn-ddt-guard-causale-emissione-iva
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Fase C (C-1, pezzo 2): il gate di emissione DDT solleva anche E_DDT_RIGA_IVA_MANCANTE,
        il motivo aggiunto a script.fn_check_ddt_emittibile dal 20260828-02. Si estende questo
        guard e non se ne crea uno nuovo perche' e' gia' il gate del valore della riga
        (intento + prezzo), e il LOOP con ELSIF per codice e' fatto per crescere cosi'.
        ⚠️ Il VARIADIC porta il NUMERO di riga e non l'id: quel valore compone la frase che
        legge una persona, e un id tecnico non si cerca a mano. L'id resta nel context, per chi
        diagnostica. ⚠️ Il nome della funzione nomina la sola causale e ora i motivi sono tre:
        non si rinomina (costerebbe trigger, doc e pgTAP per sola leggibilita') ma lo Scopo nel
        corpo lo dichiara, invece di lasciarlo dedurre.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'trgfn_ddt_guard_causale_emissione';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_causale_emissione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: gate all'emissione (EMESSO) di un DDT sul VALORE DELLA
              --   RIGA, in tre facce (brief-db-fatturazione-ddt-resi §4a, DL-28):
              --     1. la causale di trasporto e' dichiarata;
              --     2. se e' fatturabile, ogni riga attiva ha un prezzo
              --        risolvibile (proprio o ereditato dalla riga d'ordine);
              --     3. ogni riga attiva CHE PORTA UN PREZZO ha anche l'aliquota.
              --   rev 2026-07-19: valutazione delegata a
              --   script.fn_check_ddt_emittibile — single source con la capability.
              --   rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C):
              --   + E_DDT_RIGA_IVA_MANCANTE.
              --
              -- ⚠️ IL NOME NOMINA LA SOLA CAUSALE, ed e' rimasto quello di quando
              --   il motivo era uno. Non si rinomina — costerebbe il trigger, ogni
              --   doc auto-gen e ogni pgTAP che la citano, per sola leggibilita' —
              --   ma chi legge non deve dedurlo: e' scritto qui.
              --
              -- ⚠️ Il LOOP non ha un ELSE: i motivi che questa funzione non
              --   riconosce li solleva un altro dei quattro guard di emissione. Un
              --   catch-all qui farebbe sollevare a QUESTO trigger anche gli
              --   indirizzi mancanti, con l'area e il nome sbagliati nel log.
              DECLARE
                  v_stato_codice  config.stati_doc_ddt.codice_interno%TYPE;
                  v_motivo        jsonb;
              BEGIN
                  SELECT sdd.codice_interno INTO v_stato_codice
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;

                  IF v_stato_codice IS DISTINCT FROM 'EMESSO' THEN
                      RETURN NEW;
                  END IF;

                  FOR v_motivo IN
                      SELECT jsonb_array_elements(script.fn_check_ddt_emittibile(NEW))
                  LOOP
                      IF v_motivo->>'codice' = 'E_DDT_CAUSALE_OBBLIGATORIA' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_CAUSALE_OBBLIGATORIA',
                              jsonb_build_object(
                                  'ddt_id', NEW.id,
                                  'numero', NEW.numero),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text)
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_PREZZO_NON_RISOLVIBILE' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_PREZZO_NON_RISOLVIBILE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_id', 'NULL')
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_RIGA_IVA_MANCANTE' THEN
                          -- ⚠️ Nel VARIADIC va il NUMERO di riga, non l'id: quel
                          --   valore riempie i %s, cioe' compone la frase che una
                          --   persona legge, e un id tecnico non si cerca a mano
                          --   sul documento. L'id viaggia nel context, che e' il
                          --   canale di chi diagnostica.
                          -- ⛔ E nessuna chiave `campo`: il codice e'
                          --   CONFLITTO_STATO, non DATO_ERRATO — la richiesta e'
                          --   «porta il DDT a EMESSO», e non c'e' un campo di
                          --   QUELLA richiesta da accendere.
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_RIGA_IVA_MANCANTE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint,
                                  'riga_nr',  (v_motivo->'dettaglio'->>'riga_nr')::integer),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_nr', '?')
                          );
                      END IF;
                  END LOOP;

                  RETURN NEW;
              END;
              $function$
              ;

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_causale_emissione()
              IS 'Gate all''emissione DDT sul VALORE DELLA RIGA (brief-db-fatturazione-ddt-resi §4a, DL-28), in tre facce: (1) causale di trasporto obbligatoria — in DRAFT il NULL resta legittimo; (2) se la causale e'' fatturabile, ogni riga attiva deve avere un prezzo risolvibile (proprio o ereditato dalla riga ordine via fulfillment); (3) ogni riga attiva CHE PORTA UN PREZZO deve avere anche l''aliquota. rev 2026-07-19: valutazione delegata a script.fn_check_ddt_emittibile (single source con fn_available_actions_ddt); codici errore e argomenti invariati (544/545). ⭐ rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter): + E_DDT_RIGA_IVA_MANCANTE. Si e'' esteso questo guard invece di crearne uno nuovo perche'' e'' gia'' il gate del valore della riga e il LOOP con ELSIF per codice e'' fatto per crescere cosi''. ⚠️ Nel VARIADIC del codice nuovo va il NUMERO di riga e non l''id: quel valore compone la frase che legge una persona, e un id tecnico non si cerca a mano; l''id resta nel context. ⚠️ Il nome nomina la sola causale ed e'' rimasto quello di quando il motivo era uno: non si rinomina (costerebbe trigger, doc auto-gen e pgTAP per sola leggibilita''), ma lo Scopo nel corpo lo dichiara.';
      rollback:
        - empty: {}
