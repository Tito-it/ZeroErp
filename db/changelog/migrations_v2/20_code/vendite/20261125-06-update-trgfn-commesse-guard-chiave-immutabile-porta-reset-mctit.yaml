# LA PORTA DEL RESET CHIEDE ANCHE IL PROPRIETARIO
#   vendite.trgfn_commesse_guard_chiave_immutabile
#   Brief: brief-db-porte-aperte-dalla-sola-guc §13.5 (giro 8 + 1-7, porte 1-7; D-A a, D-W a di Tid).
#
# -- CHE COSA CAMBIA ---------------------------------------------------------
#   La porta del reset del lotto si legge da vendite.fn_porta_reset_lotto_aperta
#   (20261125-02): GUC accesa E proprietario della tabella. Prima bastava la
#   GUC, e l'app poteva accenderla da se' e scrivere diretta. La lettura copiata
#   qui si ritira (regola del 2). Il resto del guard e' invariato; il COMMENT
#   si riscrive al presente (linee-guida-sql §5d).
#   Corpo dal catalogo di dbdev.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261125-06-update-trgfn-commesse-guard-chiave-immutabile-porta-reset-mctit.yaml

  - changeSet:
      id: 20261125-06-update-trgfn-commesse-guard-chiave-immutabile-porta-reset
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_commesse_guard_chiave_immutabile: la porta del reset del lotto dal BB, GUC
        e proprietario. Brief: brief-db-porte-aperte-dalla-sola-guc §13.5.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_commesse_guard_chiave_immutabile()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- =========================================================
              -- Scopo:
              --   Le condizioni di pagamento sono elemento della chiave di
              --   raggruppamento della commessa (D-R): una volta che alla
              --   commessa e' stato attaccato del lavoro, cambiarle lascerebbe
              --   quelle attivita' sotto una chiave che non le descrive.
              -- Regole:
              --   - blocca UPDATE di termine/modalita' se esiste almeno una
              --     riga in commesse_attivita per questa commessa;
              --   - commessa ancora vuota: modifica ammessa (non ha raggruppato
              --     nulla, non c'e' promessa da tradire);
              --   - riscrivere lo STESSO valore non e' un cambio di chiave e
              --     passa (IS DISTINCT FROM);
              --   - passa la porta del reset del lotto: GUC e proprietario
              --     (vendite.fn_porta_reset_lotto_aperta), come gli altri guard.
              -- =========================================================
              DECLARE
                  v_attivita  bigint;
                  v_campo     text;
              BEGIN
                  IF vendite.fn_porta_reset_lotto_aperta(TG_RELID) THEN
                      RETURN NEW;
                  END IF;

                  IF NEW.termine_pagamento_id IS NOT DISTINCT FROM OLD.termine_pagamento_id
                     AND NEW.modalita_pagamento_id IS NOT DISTINCT FROM OLD.modalita_pagamento_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT count(*) INTO v_attivita
                    FROM vendite.commesse_attivita ca
                   WHERE ca.commessa_id = OLD.id;

                  IF v_attivita = 0 THEN
                      RETURN NEW;
                  END IF;

                  -- Quale delle due si sta muovendo: finisce nel messaggio, cosi'
                  -- chi lo legge sa dove guardare senza aprire il payload.
                  v_campo := CASE
                      WHEN NEW.termine_pagamento_id IS DISTINCT FROM OLD.termine_pagamento_id
                       AND NEW.modalita_pagamento_id IS DISTINCT FROM OLD.modalita_pagamento_id
                          THEN 'termine e modalita'' di pagamento'
                      WHEN NEW.termine_pagamento_id IS DISTINCT FROM OLD.termine_pagamento_id
                          THEN 'termine di pagamento'
                      ELSE 'modalita'' di pagamento'
                  END;

                  PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_COMMESSA_CHIAVE_IMMUTABILE',
                      jsonb_build_object(
                          'commessa_id', OLD.id,
                          'codice', OLD.codice,
                          'attivita_collegate', v_attivita,
                          'termine_old', OLD.termine_pagamento_id,
                          'termine_new', NEW.termine_pagamento_id,
                          'modalita_old', OLD.modalita_pagamento_id,
                          'modalita_new', NEW.modalita_pagamento_id),
                      NULL::uuid, OLD.codice, v_campo, v_attivita::text
                  );

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_commesse_guard_chiave_immutabile() IS $c$Guard D-R: termine/modalita' di pagamento sono elemento della chiave di raggruppamento della commessa, quindi non si cambiano una volta che ci sono attivita' collegate (si apre una commessa nuova). Commessa vuota: ammesso. Riscrittura dello stesso valore: ammessa. Passa la porta del reset del lotto (vendite.fn_porta_reset_lotto_aperta: GUC zeroerp.maintenance_reset_lotto_draft e proprietario della tabella). Errore E_COMMESSA_CHIAVE_IMMUTABILE.$c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_commesse_guard_chiave_immutabile()
