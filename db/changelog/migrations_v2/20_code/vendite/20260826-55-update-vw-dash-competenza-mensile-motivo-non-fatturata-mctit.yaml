# D-2 — LA DIMENSIONE ENTRA NEL `GROUP BY` DELL'AGGREGATA
#   Piano: brief-db-residui-competenza-dimensione-e-chiave, D-2
#
# ── ⭐ PERCHE' UNA DIMENSIONE E NON UNA COLONNA `n_residui` ────────
#   C'e' un precedente esatto, sulla STESSA vista, con la stessa forma e la
#   stessa ragione: la rev del 2026-08-20 che ha aggiunto `tipo_movimento` al
#   raggruppamento. Il suo COMMENT dice che «la compensazione NASCONDE LAVORO»
#   e conclude che «si aggiunge la DIMENSIONE e non una colonna
#   valore_rettifiche, che avrebbe messo i valori dell'enum dentro la vista».
#   ⛔ Qui vale identico: una colonna `n_residui` costringerebbe la vista a
#   conoscere il valore `RESIDUO`, cioe' a cablare un elemento del vocabolario
#   in una aggregazione. La dimensione non conosce nessun valore: li porta.
#
# ── 🔴 CAMBIA LA CARDINALITA', ED E' DICHIARATO ───────────────────
#   Un bucket `EMESSA_NON_FATTURATA` che contiene situazioni diverse si spezza
#   in una riga per situazione. ⚠️ I totali del consumatore REGGONO perche' il
#   pivot accumula, ma il BREAKDOWN elenca una voce per riga: senza adeguamento
#   il frontend mostrerebbe `EMESSA_NON_FATTURATA` due volte. E' lavoro BE/FE,
#   sta nel brief applicativo, e va fatto NELLO STESSO GIRO.
#   ⚠️ E' esattamente la conseguenza gia' pagata il 2026-08-20 con
#   `tipo_movimento`: la si dichiara di nuovo perche' colpisce un consumatore
#   diverso (la card che si spezza in due).
#
# ── ⚠️ IL TEST CHE DIVENTA ROSSO, E VA PORTATO SULLA REGOLA NUOVA ─
#   `db/pgtap/vendite/test-fn-list-commessa-attivita-provenienza-v1.sql`, test
#   22, confronta il numero di righe della mensile col GROUP BY del dettaglio:
#   e' un presidio di GRANA, e cambiando la grana va aggiornato — non spento.
#   ⭐ Cercato dal CODICE e non dalla direzione del cambio: la lezione della
#   regressione di L7b e' che un guard ALLARGATO rompe i test come uno
#   ristretto, al contrario ([[feedback_guard_breaks_existing_tests]]).
#
# ── ⛔ security_invoker=on VA RI-SPECIFICATO ───────────────────────
#   Lo scope emittente di questa vista arriva tutto da
#   `vw_dash_competenza_attivita` (GUC fail-closed), e la reloption non e'
#   visibile in `pg_get_viewdef`: un `CREATE OR REPLACE` che non la ripete la
#   AZZERA in silenzio. Presidiata dal test 21 dello stesso file pgTAP.
#
# Dipendenze: 20260826-54 (la vista di dettaglio espone motivo_non_fatturata).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260826-55-update-vw-dash-competenza-mensile-motivo-non-fatturata-mctit.yaml

  - changeSet:
      id: 20260826-55-update-vw-dash-competenza-mensile-motivo-non-fatturata
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D-2: motivo_non_fatturata entra fra le DIMENSIONI di vw_dash_competenza_mensile,
        accanto a stadio, stato_fattura_codice_interno e tipo_movimento. ⭐ Dimensione e non
        una colonna n_residui: c'e' un precedente esatto sulla stessa vista (rev 2026-08-20,
        tipo_movimento) con la stessa ragione — una colonna dedicata avrebbe messo un valore
        dell'enum dentro l'aggregazione. Serve perche' la card «Emesse non fatturate» si
        spezza in due: due popolazioni con rimedi opposti non possono stare dietro un numero
        solo. 🔴 CAMBIA LA CARDINALITA': un bucket EMESSA_NON_FATTURATA che contiene situazioni
        diverse si spezza in una riga per situazione. I totali del consumatore reggono perche'
        il pivot accumula, ma il breakdown elenca una voce per riga — senza adeguamento BE/FE
        mostrerebbe EMESSA_NON_FATTURATA due volte, e va fatto nello stesso giro. ⚠️ Il test
        22 di pgtap/vendite/test-fn-list-commessa-attivita-provenienza-v1 e' un presidio di
        GRANA e va portato sulla regola nuova, non spento. ⛔ security_invoker=on
        RI-SPECIFICATO: lo scope emittente arriva tutto dalla vista di dettaglio.
      preConditions:
        - onFail: HALT
        - and:
            # ⛔ La dimensione deve gia' esistere sul dettaglio: senza, questo
            #   changeSet fallirebbe con «colonna inesistente» a meta' timeline.
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_attribute a
                   WHERE a.attrelid = 'vendite.vw_dash_competenza_attivita'::regclass
                     AND a.attname  = 'motivo_non_fatturata'
                     AND a.attnum > 0 AND NOT a.attisdropped;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_competenza_mensile
              WITH (security_invoker=on) AS
              SELECT competenza_mese,
                  stadio,
                  stato_fattura_codice_interno,
                  (count(*))::integer AS n_attivita,
                  COALESCE(sum(valore), (0)::numeric) AS valore_tot,
                  COALESCE(sum(valore_fatturato), (0)::numeric) AS valore_fatturato_tot,
                  (count(*) FILTER (WHERE emessa_in_ritardo))::integer AS n_in_ritardo,
                  COALESCE(sum(valore) FILTER (WHERE emessa_in_ritardo), (0)::numeric) AS valore_in_ritardo,
                  tipo_movimento,
                  -- ⭐ LA DIMENSIONE (D-2). In coda perche' la colonna nuova di
                  --   un CREATE OR REPLACE VIEW puo' solo aggiungersi in fondo,
                  --   e perche' l'ordine delle colonne non e' il contratto: il
                  --   contratto e' il nome.
                  -- 🔴 Entrando nel GROUP BY qui sotto CAMBIA LA CARDINALITA'
                  --   dell'aggregata: e' voluto, ed e' la stessa conseguenza
                  --   dichiarata il 2026-08-20 per tipo_movimento.
                  motivo_non_fatturata
                 FROM vendite.vw_dash_competenza_attivita
                GROUP BY competenza_mese, stadio, stato_fattura_codice_interno, tipo_movimento, motivo_non_fatturata;

              COMMENT ON VIEW vendite.vw_dash_competenza_mensile IS
                  'Lente 1 Competenza, aggregata in FORMATO LUNGO: una riga per '
                  '(competenza_mese, stadio, stato fattura, tipo_movimento, '
                  'motivo_non_fatturata). Il pivot alla griglia 12 mesi x 4 stadi e'' del '
                  'service, non della vista. security_invoker=on: lo scope emittente arriva da '
                  'vw_dash_competenza_attivita (GUC fail-closed) e va RI-SPECIFICATO a ogni '
                  'REPLACE, perche'' la reloption non e'' visibile in pg_get_viewdef e verrebbe '
                  'azzerata in silenzio. '
                  '⭐ Rev 2026-08-20 (richiesta BE, punto 3): `tipo_movimento` entra nel '
                  'raggruppamento. Prima si perdeva qui, e il residuo del mese — che e'' una '
                  'somma CON SEGNO — compensava le rettifiche con le fatture da emettere: '
                  'agosto 2026 segnava 101% di copertura perche'' il residuo era −29,50, cioe'' '
                  'due note di credito da emettere. Con una sola fattura da 29,50 in sospeso '
                  'il residuo sarebbe andato a zero e la dashboard avrebbe detto «100%, niente '
                  'da fare» con tre documenti da produrre: la compensazione NASCONDE LAVORO. '
                  '⭐ E non riguarda le sole rettifiche — a luglio 2026 ci sono 5.000 EUR di '
                  'ONERI nello stesso totale: la somma mescolava tre cose di natura diversa, '
                  'ed e'' il motivo per cui si aggiunge la DIMENSIONE e non una colonna '
                  '`valore_rettifiche`, che avrebbe messo i valori dell''enum dentro la vista. '
                  '🔴 Cambia la CARDINALITA'': 7 righe -> 8 sul dato del 2026-08-20, unico '
                  'bucket spezzato 2026-07 FATTURATA/EMESSA (NORMALE + ONERE). I totali del '
                  'consumatore reggono perche'' il pivot accumula, ma il breakdown per stato '
                  'documento fiscale elenca una voce per riga: senza adeguamento BE mostra '
                  'EMESSA due volte. brief-design-note-credito-resi §40.2. '
                  '⭐ Rev 2026-08-26 (D-2, brief-db-residui-competenza-dimensione-e-chiave): '
                  '`motivo_non_fatturata` entra nel raggruppamento, per la STESSA ragione e '
                  'nella STESSA forma. Lo stadio EMESSA_NON_FATTURATA guarda solo '
                  'fattura_riga_id, e dentro quel valore convivono situazioni con RIMEDI '
                  'OPPOSTI: in attesa del proprio lotto (nessun rimedio, il prossimo giro la '
                  'prende), dentro un giro vivo (nessun rimedio, si aspetta) e RESIDUO — '
                  'l''unica su cui «Riporta da emettere» ha effetto. Un numero solo per rimedi '
                  'opposti dice all''operatore che c''e'' qualcosa da fare quando non c''e'', o '
                  'nasconde il lavoro vero dentro un transito sano. '
                  '⛔ Dimensione e NON una colonna `n_residui`: quella avrebbe costretto '
                  'l''aggregata a conoscere il valore RESIDUO, cioe'' a cablare un elemento del '
                  'vocabolario dentro una somma. La dimensione non conosce nessun valore: li '
                  'porta. '
                  '🔴 E cambia di nuovo la CARDINALITA'': un bucket EMESSA_NON_FATTURATA che '
                  'contiene piu'' situazioni si spezza in una riga per situazione. I totali '
                  'reggono, il breakdown no — l''adeguamento BE/FE va fatto nello stesso giro. '
                  '⚠️ Il presidio di grana e'' il test 22 di '
                  'db/pgtap/vendite/test-fn-list-commessa-attivita-provenienza-v1.sql, che '
                  'confronta le righe della mensile col GROUP BY del dettaglio: cambiando la '
                  'grana va portato sulla regola nuova, mai spento.';
