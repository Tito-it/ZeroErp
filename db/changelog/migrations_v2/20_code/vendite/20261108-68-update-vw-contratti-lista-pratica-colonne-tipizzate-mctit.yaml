# vendite.vw_contratti_lista: LA PRATICA DEL DOCUMENTO SULLE COLONNE DEL MODELLO
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto P, giro P.1 (S-4).
#
#   La vista chiedeva la pratica con la chiave testuale del documento
#   (c.id::text). Passa alla firma tipizzata di
#   pratiche.fn_pratica_del_documento (20261108-67) con l'id e l'uid del documento:
#   la regola d'incontro trova il link senza leggere il key_selector. L'unica
#   riga che cambia e' la LATERAL della pratica; colonne, ordine e COMMENT
#   restano (corpo dal catalogo, dbdev e scratch identici, 2026-11-08).
#   security_invoker ripetuto: un CREATE OR REPLACE VIEW lo azzera.
#   Rollback: forward-only (la firma testuale la ritira 20261108-76).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261108-68-update-vw-contratti-lista-pratica-colonne-tipizzate-mctit.yaml

  - changeSet:
      id: 20261108-68-update-vw-contratti-lista-pratica-colonne-tipizzate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_contratti_lista: la pratica del documento con la firma tipizzata di
        pratiche.fn_pratica_del_documento (id e uid del documento). brief-db-sorgente-documento-e-riga
        §7.2 lotto P, giro P.1.
      preConditions:
        - onFail: HALT
        - viewExists:
            schemaName: vendite
            viewName: vw_contratti_lista
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- security_invoker si AZZERA a ogni CREATE OR REPLACE VIEW: si ripete dal catalogo.
              CREATE OR REPLACE VIEW vendite.vw_contratti_lista WITH (security_invoker=on) AS
               SELECT c.id,
                  c.uid,
                  c.numero,
                  c.billing_account_id,
                  ba.codice AS ba_codice,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  c.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  c.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  c.ambito,
                  c.data,
                  c.valido_dal,
                  c.valido_al,
                  c.stato_doc_contratto_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.codice AS stato_codice,
                  sd.descrizione AS stato_descrizione,
                  c.listino_id,
                  l.codice AS listino_codice,
                  l.descrizione AS listino_descrizione,
                  c.listino_versione_id,
                  lv.codice_versione AS listino_versione_codice,
                  c.tipo_variazione_globale,
                  c.valore_variazione_globale,
                  c.categoria_cliente_id_snapshot,
                  cc_snap.codice AS categoria_cliente_snapshot_codice,
                  cc_snap.descrizione AS categoria_cliente_snapshot_descrizione,
                  c.valuta_id,
                  v_val.codice AS valuta_codice,
                  v_val.descrizione AS valuta_descrizione,
                  c.data_insert,
                  c.user_insert,
                  c.data_update,
                  c.user_update,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  pr.pratica_id,
                  pr.pratica_numero,
                  pr.n_pratiche
                 FROM vendite.contratti c
                   JOIN anagrafiche.billing_account ba ON ba.id = c.billing_account_id
                   JOIN anagrafiche.soggetti_ruoli sr ON sr.id = ba.soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                   JOIN config.utilities u ON u.id = c.utility_id
                   JOIN config.stati_doc_contratti sd ON sd.id = c.stato_doc_contratto_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = c.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN vendite.listini l ON l.id = c.listino_id
                   LEFT JOIN vendite.listini_versioni lv ON lv.id = c.listino_versione_id
                   LEFT JOIN anagrafiche.categorie_clienti cc_snap ON cc_snap.id = c.categoria_cliente_id_snapshot
                   LEFT JOIN config.valute v_val ON v_val.id = c.valuta_id
                   LEFT JOIN LATERAL pratiche.fn_pratica_del_documento(( SELECT so_pr.id
                         FROM config.sorgenti so_pr
                        WHERE so_pr.codice_interno::text = 'CONTRATTO'::text AND so_pr.attivo IS TRUE), c.id, c.uid) pr(n_pratiche, pratica_id, pratica_numero) ON true;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: la firma testuale della pratica del documento si ritira nello stesso giro.
              SELECT 1;
