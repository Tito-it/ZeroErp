# LA CATEGORIA DEL CLIENTE NEL CONTRATTO: SOLO ALLA NASCITA, IL CONGELAMENTO E' DEL LOCK
#   Brief: brief-db-stati-documento-dal-vocabolario §6.20, giro 6c-bis (decisione
#   di Tid del 2026-11-14: «ritiriamolo»).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.trgfn_contratti_set_categoria_cliente_snapshot aveva due rami. In
#   INSERT riempie categoria_cliente_id_snapshot dal billing account. In UPDATE
#   rifiutava il cambio fuori bozza con E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE:
#   una seconda sede della regola del lock della testata
#   (trg_contratti_a05_lock_fuori_bozza_upd), che blocca la stessa colonna in
#   tutti gli stati fuori bozza (ATTIVO, CESSATO, ANNULLATO: nessuna eccezione,
#   dbdev 2026-11-14) con E_DOC_CONDIZIONI_FUORI_BOZZA, e parla per primo (a05
#   prima di a10). Il guard non parlava mai (pgTAP del §6.19, test 3 e 9).
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   La funzione tiene il solo ramo INSERT; il trigger si rimonta BEFORE INSERT
#   (nome con l'evento giusto: …_ins). Il codice resta a catalogo con
#   obsoleto_dal = 2026-11-14 (80_data/sql/config/codici_errore.csv) e smette di
#   essere sollevato.
#   Verificato prima (dbdev, 2026-11-14): il lock non ha porte di override; la
#   colonna la scrivono in INSERT vendite.fn_create_contratto e in UPDATE la PATCH
#   del backend, che passa dal lock; nessun pgTAP solleva il codice.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE della funzione (stessa firma, INVOKER, nessun SET). Il
#   trigger si rimonta per funzione: l'unico nome nei changelog e'
#   trg_contratti_a10_set_categoria_cliente_snapshot_ins_upd (20260415-12),
#   tolto con IF EXISTS; nasce trg_contratti_a10_set_categoria_cliente_snapshot_ins,
#   stessa fase a10 (l'ordine coi BEFORE INSERT della tabella non cambia). Non e'
#   un trigger generato da ci_apply (§11.5).
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14 (il 20261114-31 applicato). Il
#   rollback porta il corpo, il COMMENT e il montaggio di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-35-update-trgfn-contratti-categoria-snapshot-solo-alla-nascita-mctit.yaml

  - changeSet:
      id: 20261114-35-update-trgfn-contratti-categoria-snapshot-solo-alla-nascita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_contratti_set_categoria_cliente_snapshot: resta il solo ramo INSERT (la categoria
        dal billing account); il congelamento fuori bozza e' del lock della testata, e il trigger si
        rimonta BEFORE INSERT. Ritira E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE. Brief:
        brief-db-stati-documento-dal-vocabolario, giro 6c-bis.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: alla nascita del contratto, la categoria del cliente dal
              --   billing account, se chi crea non la passa.
              -- ⛔ Il congelamento fuori bozza NON sta qui: lo fa il lock della
              --   testata (trg_contratti_a05_lock_fuori_bozza_upd,
              --   E_DOC_CONDIZIONI_FUORI_BOZZA). Il ramo UPDATE che lo ripeteva
              --   (E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE) e' ritirato il
              --   2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro
              --   6c-bis): non parlava mai, il lock arriva prima.
              DECLARE
                  v_categoria_id anagrafiche.billing_account.categoria_cliente_id%TYPE;
              BEGIN
                  IF NEW.categoria_cliente_id_snapshot IS NULL THEN
                      SELECT ba.categoria_cliente_id
                        INTO v_categoria_id
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = NEW.billing_account_id;

                      NEW.categoria_cliente_id_snapshot := v_categoria_id;
                  END IF;

                  RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
              IS 'Trigger BEFORE INSERT su vendite.contratti: categoria_cliente_id_snapshot dal billing account, se chi crea non la passa. Il congelamento fuori bozza lo fa il lock della testata (trg_contratti_a05_lock_fuori_bozza_upd, E_DOC_CONDIZIONI_FUORI_BOZZA): in bozza la categoria si cambia, per esempio per una riclassificazione del billing account mentre il contratto si prepara.';

              DROP TRIGGER IF EXISTS trg_contratti_a10_set_categoria_cliente_snapshot_ins_upd
                  ON vendite.contratti;

              CREATE TRIGGER trg_contratti_a10_set_categoria_cliente_snapshot_ins
                  BEFORE INSERT ON vendite.contratti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_a10_set_categoria_cliente_snapshot_ins
                  ON vendite.contratti;

              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_categoria_id anagrafiche.billing_account.categoria_cliente_id%TYPE;
              BEGIN
                  -- INSERT: auto-populate da BA se il caller non lo passa.
                  IF TG_OP = 'INSERT' AND NEW.categoria_cliente_id_snapshot IS NULL THEN
                      SELECT ba.categoria_cliente_id
                        INTO v_categoria_id
                        FROM anagrafiche.billing_account ba
                       WHERE ba.id = NEW.billing_account_id;

                      NEW.categoria_cliente_id_snapshot := v_categoria_id;
                  END IF;

                  -- UPDATE: immutabilita' post-attivazione.
                  -- In bozza la categoria puo' essere cambiata (es. riclassificazione
                  -- BA durante la preparazione del contratto). Fuori dalla bozza e'
                  -- congelata: modifica bloccata.
                  -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6c):
                  --   la bozza e' lo stato iniziale, la colonna del vocabolario, non il
                  --   codice. IS FALSE: uno stato che non si legge non rifiuta.
                  IF TG_OP = 'UPDATE'
                     AND OLD.categoria_cliente_id_snapshot IS DISTINCT FROM NEW.categoria_cliente_id_snapshot
                  THEN
                      IF (SELECT s.iniziale
                            FROM config.stati_doc_contratti s
                           WHERE s.id = NEW.stato_doc_contratto_id) IS FALSE
                      THEN
                          -- E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE: 1 %s = contratto.
                          PERFORM script.fn_log_and_raise_error(
                              'vendite',
                              TG_NAME,
                              'E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE',
                              jsonb_build_object(
                                  'contratto_id', NEW.id,
                                  'old_categoria', OLD.categoria_cliente_id_snapshot,
                                  'new_categoria', NEW.categoria_cliente_id_snapshot
                              ),
                              NULL::uuid,
                              NEW.id::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
              IS 'Trigger su vendite.contratti. In INSERT: categoria_cliente_id_snapshot dal billing account, se chi crea non la passa. In UPDATE: la categoria si cambia solo nello stato iniziale del vocabolario (la bozza, la colonna iniziale di config.stati_doc_contratti), per esempio per una riclassificazione del billing account mentre il contratto si prepara; fuori dalla bozza e'' congelata: E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE.';

              CREATE TRIGGER trg_contratti_a10_set_categoria_cliente_snapshot_ins_upd
                  BEFORE INSERT OR UPDATE OF categoria_cliente_id_snapshot ON vendite.contratti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot();
