databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260126-01-create-fn-get-registro-id-mctit.yaml

  - changeSet:
      id: 20260126-01-create-fn-get-registro-id
      author: mctit
      validCheckSum:
        - ANY
      comment: "Risoluzione registro_id (sorgente -> utility -> errore)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_registro_id(
                p_sorgente_tipo_id config.sorgenti.id%TYPE,
                p_utility_id config.utilities.id%TYPE
              )
              RETURNS vendite.registri_fatturazione.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_registro_id vendite.registri_fatturazione.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Risolve il registro di fatturazione con priorita' su:
                --   1) config.sorgenti.registro_id
                --   2) config.utilities.registro_id
                --   3) errore se ancora NULL
                -- =========================================================

                IF p_sorgente_tipo_id IS NOT NULL THEN
                  SELECT s.registro_id
                    INTO v_registro_id
                    FROM config.sorgenti s
                   WHERE s.id = p_sorgente_tipo_id;
                END IF;

                IF v_registro_id IS NULL AND p_utility_id IS NOT NULL THEN
                  SELECT u.registro_id
                    INTO v_registro_id
                    FROM config.utilities u
                   WHERE u.id = p_utility_id;
                END IF;

                IF v_registro_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'fn_get_registro_id',
                    'E_GENERICO',
                    jsonb_build_object(
                      'detail','Registro non risolto (sorgente/utility)',
                      'sorgente_tipo_id', p_sorgente_tipo_id,
                      'utility_id', p_utility_id
                    ),
                    NULL::uuid,
                    concat('Registro non risolto (sorgente/utility)', 
                    ' sorgente_tipo_id ', p_sorgente_tipo_id::text,
                      ', utility_id ', p_utility_id::text
                     )
                  );
                END IF;

                RETURN v_registro_id;
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_get_registro_id(
                config.sorgenti.id%TYPE,
                config.utilities.id%TYPE
              ) IS 'Risoluzione registro_id: sorgente -> utility -> errore.';
