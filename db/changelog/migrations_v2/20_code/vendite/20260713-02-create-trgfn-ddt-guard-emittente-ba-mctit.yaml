# Guard coerenza emittente<->BA su vendite.ddt (decisione Tid 2026-07-13).
# Logica IDENTICA a trgfn_ordini_guard_emittente_ba (skip se BA NULL,
# errore E_DDT_EMITTENTE_BA_INCOERENTE). Chiude il buco aperto dal payload
# emittente lato BE.
#
# DEVIAZIONE VOLUTA dal "mirror esatto" ordini sul PIAZZAMENTO:
#   su ordini il BA arriva nel payload -> guard in fascia a10 (prima).
#   Sui DDT il BA e' spesso RISOLTO da trgfn_ddt_normalize (evasione: dal
#   sorgente; standalone: fallback), che fira DOPO gli a10. Un guard a10
#   vedrebbe BA=NULL e salterebbe proprio i casi da chiudere. Quindi qui il
#   guard fira DOPO il normalize: nome 'z10' -> ordina dopo
#   trg_ddt_normalize_ins_upd e prima di z90. Cosi' controlla i valori FINALI
#   risolti (evasione/fallback coerenti per costruzione -> pass; divergenza
#   da payload -> raise).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-02-create-trgfn-ddt-guard-emittente-ba-mctit.yaml

  - changeSet:
      id: 20260713-02-create-trgfn-ddt-guard-emittente-ba
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_emittente_ba()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_ef_atteso_id anagrafiche.emittenti_fiscali.id%TYPE;
              BEGIN
                -- Skip: nessun BA su cui ancorare la coerenza.
                IF NEW.billing_account_id IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Emittente atteso per il BA del DDT.
                v_ef_atteso_id := anagrafiche.fn_get_emittente_fiscale_pk(NEW.billing_account_id);

                IF NEW.emittente_fiscale_id IS DISTINCT FROM v_ef_atteso_id THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'trgfn_ddt_guard_emittente_ba',
                    'E_DDT_EMITTENTE_BA_INCOERENTE',
                    jsonb_build_object(
                      'billing_account_id',   NEW.billing_account_id,
                      'emittente_fiscale_id', NEW.emittente_fiscale_id,
                      'emittente_atteso_id',  v_ef_atteso_id,
                      'numero_ddt',           NEW.numero
                    ),
                    NULL::uuid,
                    concat('ba=', NEW.billing_account_id,
                           ', ef=', NEW.emittente_fiscale_id,
                           ', ef_atteso=', v_ef_atteso_id)
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              DROP TRIGGER IF EXISTS trg_ddt_z10_guard_emittente_ba_ins_upd ON vendite.ddt;
              CREATE TRIGGER trg_ddt_z10_guard_emittente_ba_ins_upd
                BEFORE INSERT OR UPDATE OF billing_account_id, emittente_fiscale_id
                ON vendite.ddt
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_ddt_guard_emittente_ba();
