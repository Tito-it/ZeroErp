# DB-B (db-brief-lista-preventivi-offerte §3.1): vista sorgente CANONICA per la
# lista configurabile vendite.preventivi.
#
# Riscrittura canonica della lista preventivi (gemella di vw_preventivi_list)
# seguendo la lezione DEF-8: i nomi colonna combaciano con i nomi CANONICI usati
# dal catalogo (campo_sorgente validato dal trigger B2):
#   - cliente_denominazione        -> ragione_sociale_completa  (nome canonico soggetto)
#   - id_fiscale                   -> id_fiscale_univoco_cf_piva (nome canonico soggetto)
#   - billing_account_codice       -> ba_codice                 (codice BA: alias ba_* legittimo)
# In piu': JOIN emittenti_fiscali per emittente_fiscale_codice (extra opt-in).
#
# Sorgente: vendite.vw_preventivi (NON la tabella): la colonna is_revision_attiva
# e' stata droppata (20260515-05) e is_attiva e' DERIVATA in vw_preventivi
# (20260515-03). Si riusa quella derivazione (no logica duplicata), esattamente
# come fa vw_preventivi_list corrente (FROM vendite.vw_preventivi p, p.is_attiva).
#
# Pura DENORMALIZZAZIONE: nessun filtro/scope/paginazione (restano nel repository
# consumer). security_invoker=on (brief contratti §0-bis #3, standard liste
# DEF-8): la vista gira col contesto del chiamante, cosi' eventuali policy RLS
# della tabella base si applicano e non e' "RLS cosmetica" (linee-guida-sql §10.1).
#
# Soggetto via istanze_utilities (1 join, sempre valorizzato anche per prospect),
# billing_account LEFT (ba_codice NULL per prospect): logica 1:1 da vw_preventivi_list.
#
# NB: vw_preventivi_list NON viene droppata qui (consegna non-breaking): resta viva
# finche' il BE non commuta list_preventivi + list_revisioni sulla vista canonica.
# Drop differito in changeset di cleanup dedicato (vedi brief §6 NOTA).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260603-05-create-vw-preventivi-lista-mctit.yaml

  - changeSet:
      id: 20260603-05-create-vw-preventivi-lista
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea vendite.vw_preventivi_lista (security_invoker=on) come sorgente
        denormalizzata canonica per la lista configurabile vendite.preventivi.
        Nomi canonici (ragione_sociale_completa, id_fiscale_univoco_cf_piva,
        ba_codice, is_attiva). Nessuno scope/filtro: restano nel repository.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: preventivi
          - tableExists:
              schemaName: anagrafiche
              tableName: istanze_utilities
          - columnExists:
              schemaName: anagrafiche
              tableName: soggetti
              columnName: id_fiscale_univoco_cf_piva
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_preventivi_lista;
              CREATE VIEW vendite.vw_preventivi_lista
              WITH (security_invoker = on) AS
              SELECT
                  p.id,
                  p.uid,
                  p.numero,
                  p.rev,
                  -- Revisione attiva (predicato "mostra storico revisioni"):
                  -- derivata da vw_preventivi (la colonna fisica e' stata droppata).
                  p.is_attiva,
                  p.data,
                  -- Stato
                  p.stato_doc_preventivo_id,
                  sdp.codice_interno                        AS stato_codice_interno,
                  sdp.descrizione                           AS stato_descrizione,
                  -- Cliente: soggetto via istanza (nomi CANONICI, senza alias)
                  p.billing_account_id,
                  ba.codice                                 AS ba_codice,
                  s.id                                      AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  -- Emittente fiscale
                  p.emittente_fiscale_id,
                  ef.codice                                 AS emittente_fiscale_codice,
                  -- Contesto utility + istanza
                  p.utility_id,
                  u.codice                                  AS utility_codice,
                  u.descrizione                             AS utility_descrizione,
                  p.istanza_utility_id,
                  iu.codice                                 AS istanza_utility_codice,
                  -- Importi
                  p.totale_imponibile,
                  p.totale_iva,
                  p.totale_documento,
                  -- Condizioni / valuta
                  p.valuta_id,
                  v_val.codice                              AS valuta_codice,
                  -- Validita' e competenza
                  p.validita_dal,
                  p.validita_al,
                  p.competenza_mese,
                  -- Audit
                  p.data_insert
              FROM vendite.vw_preventivi p
              JOIN config.stati_doc_preventivi sdp
                ON sdp.id = p.stato_doc_preventivo_id
              -- Istanza (NOT NULL): radice del lookup soggetto
              LEFT JOIN anagrafiche.istanze_utilities iu
                ON iu.id = p.istanza_utility_id
              LEFT JOIN anagrafiche.soggetti s
                ON s.id = iu.soggetto_id
              -- BA opzionale per prospect: solo per ba_codice
              LEFT JOIN anagrafiche.billing_account ba
                ON ba.id = p.billing_account_id
              LEFT JOIN anagrafiche.emittenti_fiscali ef
                ON ef.id = p.emittente_fiscale_id
              LEFT JOIN config.utilities u
                ON u.id = p.utility_id
              LEFT JOIN config.valute v_val
                ON v_val.id = p.valuta_id;

              COMMENT ON VIEW vendite.vw_preventivi_lista IS
                'Vista flat canonica preventivi per la lista UI configurabile '
                '(vendite.preventivi). Nomi canonici (ragione_sociale_completa, '
                'id_fiscale_univoco_cf_piva, ba_codice, is_attiva). Pura '
                'denormalizzazione: nessuno scope/filtro/paginazione (restano nel '
                'repository consumer). security_invoker=on (RLS-ready). Soggetto via '
                'istanze_utilities (1 join, valorizzato anche per prospect). '
                'Sostituisce vw_preventivi_list (deprecata, drop differito post-BE).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_preventivi_lista;
