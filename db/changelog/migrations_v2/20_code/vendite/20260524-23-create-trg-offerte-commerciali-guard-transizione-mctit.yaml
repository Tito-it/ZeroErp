# Trigger guard state machine per vendite.offerte_commerciali.
#
# trgfn_offerte_commerciali_guard_transizione (BEFORE UPDATE OF stato_doc_offerta_id):
#   1. Verifica transizione ammessa in config.stati_doc_offerte_transizioni
#      (config-driven, solo righe attive).
#      Errore: E_OFFERTA_TRANSIZIONE_NON_AMMESSA
#   2. Su BOZZA->EMESSA:
#      a. listino_versione_id NOT NULL
#         Errore: E_OFFERTA_EMISSIONE_SENZA_VERSIONE_LISTINO
#      b. Versione listino in stato 'ATTIVA' (vendite.listini_versioni.stato)
#         Errore: E_OFFERTA_EMISSIONE_VERSIONE_LISTINO_NON_ATTIVA
#   3. Valorizza timestamp del passaggio:
#      EMESSA     -> data_emissione      = NOW()
#      ACCETTATA  -> data_accettazione   = NOW()
#      RIFIUTATA  -> data_rifiuto        = NOW()
#      ANNULLATA  -> data_annullamento   = NOW()   (addendum A2)
#
# Trigger: trg_offerte_commerciali_a10_guard_transizione_upd
#   BEFORE UPDATE OF stato_doc_offerta_id ON vendite.offerte_commerciali
#   Fase _a10_ (guard bloccante, eseguito prima di ogni altro trigger).
#
# Dipendenze:
#   - vendite.offerte_commerciali (20260524-03)
#   - config.stati_doc_offerte_transizioni (20260524-21 + 20260524-22)
#   - vendite.listini_versioni (schema catalogo/vendite esistente)
#   - script.fn_log_and_raise_error
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260524-23-create-trg-offerte-commerciali-guard-transizione-mctit.yaml

  - changeSet:
      id: 20260524-23-create-trg-offerte-commerciali-guard-transizione
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Crea vendite.trgfn_offerte_commerciali_guard_transizione e trigger
        trg_offerte_commerciali_a10_guard_transizione_upd.
        State machine config-driven via config.stati_doc_offerte_transizioni.
        Guard listino BOZZA->EMESSA. Set timestamp passaggio stato.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: offerte_commerciali
            - tableExists:
                schemaName: config
                tableName: stati_doc_offerte_transizioni
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger function: guard state machine offerte commerciali.
              -- Verifica transizione in config.stati_doc_offerte_transizioni,
              -- applica guard listino su BOZZA->EMESSA, valorizza timestamp.
              CREATE OR REPLACE FUNCTION vendite.trgfn_offerte_commerciali_guard_transizione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: bloccare transizioni stato non ammesse sul workflow offerta
              -- commerciale (config-driven via stati_doc_offerte_transizioni).
              -- Valorizza i timestamp di passaggio stato e applica guard listino
              -- al momento dell'emissione (BOZZA->EMESSA).
              DECLARE
                  v_codice_da config.stati_doc_offerte.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_offerte.codice_interno%TYPE;
                  v_stato_versione vendite.listini_versioni.stato%TYPE;
              BEGIN
                  -- Nessuna transizione effettiva: niente da validare.
                  IF OLD.stato_doc_offerta_id = NEW.stato_doc_offerta_id THEN
                      RETURN NEW;
                  END IF;

                  -- Risolve i codici interni degli stati per messaggi leggibili.
                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_offerta_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_offerta_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_offerte
                   WHERE id IN (OLD.stato_doc_offerta_id, NEW.stato_doc_offerta_id);

                  -- Verifica transizione ammessa (config-driven, solo righe attive).
                  IF NOT EXISTS (
                      SELECT 1
                        FROM config.stati_doc_offerte_transizioni
                       WHERE stato_da_id = OLD.stato_doc_offerta_id
                         AND stato_a_id  = NEW.stato_doc_offerta_id
                         AND attivo = true
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_OFFERTA_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'offerta_id', NEW.id,
                              'stato_da',   coalesce(v_codice_da, OLD.stato_doc_offerta_id::text),
                              'stato_a',    coalesce(v_codice_a,  NEW.stato_doc_offerta_id::text)
                          ),
                          NEW.tx_id,
                          coalesce(v_codice_da, OLD.stato_doc_offerta_id::text),
                          coalesce(v_codice_a,  NEW.stato_doc_offerta_id::text)
                      );
                  END IF;

                  -- Guard specifica BOZZA -> EMESSA: listino_versione_id obbligatorio + ATTIVA.
                  IF v_codice_da = 'BOZZA' AND v_codice_a = 'EMESSA' THEN

                      -- listino_versione_id deve essere valorizzato.
                      IF NEW.listino_versione_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME::text,
                              'E_OFFERTA_EMISSIONE_SENZA_VERSIONE_LISTINO',
                              jsonb_build_object('offerta_id', NEW.id),
                              NEW.tx_id
                          );
                      END IF;

                      -- La versione listino deve essere in stato ATTIVA.
                      SELECT stato INTO v_stato_versione
                        FROM vendite.listini_versioni
                       WHERE id = NEW.listino_versione_id;

                      IF v_stato_versione IS DISTINCT FROM 'ATTIVA' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME::text,
                              'E_OFFERTA_EMISSIONE_VERSIONE_LISTINO_NON_ATTIVA',
                              jsonb_build_object(
                                  'offerta_id',          NEW.id,
                                  'listino_versione_id', NEW.listino_versione_id,
                                  'stato_versione',      v_stato_versione
                              ),
                              NEW.tx_id,
                              coalesce(v_stato_versione, 'NULL')
                          );
                      END IF;

                  END IF;

                  -- Valorizza il timestamp corrispondente al passaggio stato.
                  CASE v_codice_a
                      WHEN 'EMESSA'    THEN NEW.data_emissione    := now();
                      WHEN 'ACCETTATA' THEN NEW.data_accettazione := now();
                      WHEN 'RIFIUTATA' THEN NEW.data_rifiuto      := now();
                      WHEN 'ANNULLATA' THEN NEW.data_annullamento  := now();
                      ELSE NULL;
                  END CASE;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_offerte_commerciali_guard_transizione() IS
                  'BEFORE UPDATE OF stato_doc_offerta_id: blocca transizioni non ammesse '
                  '(config-driven via config.stati_doc_offerte_transizioni). '
                  'Guard BOZZA->EMESSA: listino_versione_id NOT NULL + stato ATTIVA. '
                  'Valorizza data_emissione|data_accettazione|data_rifiuto|data_annullamento. '
                  'rev 2026-05-24.';

              -- Trigger _a10_ (guard bloccante, prima di ogni altro trigger UPDATE).
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_a10_guard_transizione_upd
                  ON vendite.offerte_commerciali;

              CREATE TRIGGER trg_offerte_commerciali_a10_guard_transizione_upd
              BEFORE UPDATE OF stato_doc_offerta_id ON vendite.offerte_commerciali
              FOR EACH ROW
              EXECUTE FUNCTION vendite.trgfn_offerte_commerciali_guard_transizione();

              COMMENT ON TRIGGER trg_offerte_commerciali_a10_guard_transizione_upd
                  ON vendite.offerte_commerciali IS
                  'Guard state machine offerta commerciale. '
                  'Fase _a10_: eseguito prima di ogni altro trigger. '
                  'Blocca transizioni non ammesse, applica guard listino BOZZA->EMESSA, '
                  'valorizza timestamp passaggio stato.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_a10_guard_transizione_upd
                  ON vendite.offerte_commerciali;
              DROP FUNCTION IF EXISTS vendite.trgfn_offerte_commerciali_guard_transizione();
