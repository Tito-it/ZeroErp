# I9 (Fase 1) del brief brief-db-be-iva-risolutore-e-regime-cliente — meta'
# PREVENTIVI, secondo pezzo di tre. Il guard di transizione acquisisce la
# Regola 2: ->EMESSO passa da script.fn_check_preventivo_emettibile
# (20260829-09).
#
# ⭐ NEL TRIGGER, E NON NELLA PORTA — ed e' la decisione di questo changeSet.
#   Il commento del corpo attuale dice, di sua mano, che «la regola "documento
#   senza righe" vive ancora nella porta vendite.fn_cambia_stato_preventivo e un
#   UPDATE diretto la aggira: e' un'asimmetria dichiarata, non una
#   dimenticanza». Quella e' la descrizione di una DEBOLEZZA, non un modello da
#   imitare: una regola che protegge un numero fiscale non puo' dipendere da
#   quale porta ha usato il chiamante. Il DDT (20260828-03) e l'ordine
#   (20260829-07) la mettono nel trigger, e qui si fa lo stesso.
#
# ⚠️ IL PERIMETRO E' QUALUNQUE transizione verso EMESSO, non un
#   `DRAFT->EMESSO` cablato. Oggi la matrice ne ammette una sola, ma e' una
#   lettura del SEED: il predicato si scrive sulla DESTINAZIONE, cosi' una
#   strada nuova verso EMESSO nasce gia' coperta. Stessa forma della Regola 4
#   sugli ordini.
#
# ⛔ NON e' un NOT NULL di colonna: vendite.preventivi_righe.iva_id e' nullable
#   e la bozza deve restare libera. Il vincolo e' all'emissione, non al
#   salvataggio — come per la causale del DDT.
#
# ℹ️ Il guard dell'ANNULLAMENTO resta dov'e' (trgfn_preventivi_guard_annullamento,
#   20260804-35): questo file non lo tocca.
#
# Base: corpo vivo da docs/it/dbzero/vendite/funzioni/trgfn_preventivi_guard_transizione.md.
#   Firma invariata (trigger function) -> CREATE OR REPLACE puro.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260829-10-update-trgfn-preventivi-guard-transizione-iva-mctit.yaml

  - changeSet:
      id: 20260829-10-update-trgfn-preventivi-guard-transizione-iva
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        trgfn_preventivi_guard_transizione: Regola 2 — ogni transizione verso
        EMESSO passa da script.fn_check_preventivo_emettibile, che rifiuta un
        preventivo con una riga attiva, con quantità e prezzo, senza aliquota
        IVA. Nel trigger e non nella porta: vale per ogni chiamante.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_check_preventivo_emettibile'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_preventivi_guard_transizione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: enforcement DB-first del grafo transizioni del preventivo.
              --   La transizione (OLD.stato -> NEW.stato) e' ammessa solo se
              --   presente e ATTIVA in config.transizioni_stati_preventivi.
              --   Letto dalla matrice, nessun grafo hardcodato: stessa sorgente
              --   di fn_available_actions_preventivo, quindi la UI non puo'
              --   proporre cio' che il database rifiuta, ne' viceversa.
              --   Mirror di vendite.trgfn_ordini_guard_transizione (Regola 1).
              --   Brief: brief-db-vie-uscita-operatore §6.2, §7.4 punto 3.
              --   rev 2026-08-29: Regola 2, l'aliquota sulle righe che entrano
              --   nel riepilogo IVA (brief-db-be-iva-risolutore-e-regime-cliente,
              --   I9).
              --
              -- Cosa NON fa, per scelta:
              --   - l'annullamento ha il suo guard dedicato
              --     (trgfn_preventivi_guard_annullamento, 20260804-35): qui si
              --     verifica solo che la strada esista, non che sia percorribile;
              --   - la regola "documento senza righe" vive ancora nella porta
              --     vendite.fn_cambia_stato_preventivo e un UPDATE diretto la
              --     aggira: e' un'asimmetria dichiarata, non una dimenticanza.
              --     ⚠️ La Regola 2 NON la imita: una regola che protegge un
              --     numero fiscale non puo' dipendere da quale porta ha usato
              --     il chiamante.
              DECLARE
                  v_codice_da config.stati_doc_preventivi.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_preventivi.codice_interno%TYPE;
                  v_ammessa   boolean := false;
                  v_motivi    jsonb;
              BEGIN
                  -- No-op se lo stato non cambia davvero (UPDATE su altre colonne).
                  IF NEW.stato_doc_preventivo_id IS NOT DISTINCT FROM OLD.stato_doc_preventivo_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_preventivo_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_preventivo_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_preventivi
                   WHERE id IN (OLD.stato_doc_preventivo_id, NEW.stato_doc_preventivo_id);

                  -- Regola 1: la transizione deve esistere ed essere attiva.
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_preventivi t
                       WHERE t.stato_da_id = OLD.stato_doc_preventivo_id
                         AND t.stato_a_id  = NEW.stato_doc_preventivo_id
                         AND t.attivo IS TRUE
                  ) INTO v_ammessa;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_PREV_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object(
                              'preventivo_id', NEW.id,
                              'numero',        NEW.numero,
                              'stato_da',      v_codice_da,
                              'stato_a',       v_codice_a
                          ),
                          NEW.tx_id,
                          coalesce(v_codice_da, 'NULL'),
                          coalesce(v_codice_a,  'NULL')
                      );
                  END IF;

                  -- Regola 2 (rev 2026-08-29): una riga che entra nel riepilogo
                  -- IVA deve portare un'aliquota. La regola vive nella funzione
                  -- pura, la STESSA che fn_available_actions_preventivo usa per
                  -- spegnere il bottone: qui si solleva soltanto, col codice del
                  -- PRIMO motivo.
                  --
                  -- ⚠️ Il predicato e' sulla DESTINAZIONE e non su una coppia
                  --   cablata: oggi la matrice ha solo DRAFT->EMESSO, ma e' una
                  --   lettura del seed. Cosi' una strada nuova verso EMESSO
                  --   nasce gia' coperta.
                  --
                  -- ⛔ Nel VARIADIC va la DESCRIZIONE della riga e non un numero:
                  --   vendite.preventivi_righe NON HA riga_nr, e la colonna
                  --   `ordine` ha default 0 — «la riga 0» non aiuterebbe nessuno.
                  --   L'id viaggia nel context, che e' il canale di chi diagnostica.
                  -- ⛔ E nessuna chiave `campo`: il codice e' CONFLITTO_STATO, non
                  --   DATO_ERRATO — la richiesta e' «porta il preventivo a
                  --   EMESSO», e non c'e' un campo di QUELLA richiesta da accendere.
                  IF v_codice_a = 'EMESSO' THEN
                      v_motivi := script.fn_check_preventivo_emettibile(NEW.id);

                      IF jsonb_array_length(v_motivi) > 0 THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME::text,
                              v_motivi -> 0 ->> 'codice',
                              jsonb_build_object(
                                  'preventivo_id', NEW.id,
                                  'numero',        NEW.numero,
                                  'stato_da',      v_codice_da,
                                  'stato_a',       v_codice_a,
                                  'riga_id',       (v_motivi -> 0 -> 'dettaglio' ->> 'riga_id')::bigint,
                                  'motivi',        v_motivi
                              ),
                              NEW.tx_id,
                              coalesce(NEW.numero, NEW.id::text),
                              coalesce(v_motivi -> 0 -> 'dettaglio' ->> 'descrizione', 'senza descrizione')
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_preventivi_guard_transizione()
              IS 'Trigger function: enforcement del grafo transizioni del preventivo (matrice config.transizioni_stati_preventivi) e, dal 2026-08-29, controlli sull''EMISSIONE delegati a script.fn_check_preventivo_emettibile — la stessa funzione letta da fn_available_actions_preventivo, cosi'' bottone e guard non divergono. ⭐ rev 2026-08-29 (brief-db-be-iva-risolutore-e-regime-cliente, I9): Regola 2, una riga attiva con quantita e prezzo deve portare un''aliquota, altrimenti il preventivo non si emette. Chiude il difetto silenzioso gemello di DDT e ordine: fn_ricalcola_riepilogo_iva_preventivo aggrega le righe attive con quantita > 0 e calcola l''imposta con COALESCE(fn_get_aliquota_iva(iva_id, stato), 0), quindi la riga senza aliquota finisce in preventivi_riepiloghi_iva con imponibile pieno e imposta zero. ⭐ NEL TRIGGER e non nella porta: il commento di questo stesso corpo dichiara che la regola «documento senza righe» vive in vendite.fn_cambia_stato_preventivo e che un UPDATE diretto la aggira — e'' la descrizione di una debolezza, non un modello da imitare. Una regola che protegge un numero fiscale non puo'' dipendere da quale porta ha usato il chiamante. ⚠️ Il predicato e'' sulla DESTINAZIONE (v_codice_a = ''EMESSO'') e non su una coppia cablata: oggi la matrice ha solo DRAFT->EMESSO, ma e'' una lettura del seed, e una strada nuova verso EMESSO nasce gia'' coperta. ⛔ Nel VARIADIC va la DESCRIZIONE della riga: preventivi_righe non ha riga_nr e la colonna `ordine` ha default 0. ⛔ Non e'' un NOT NULL di colonna: preventivi_righe.iva_id e'' nullable e la bozza deve restare libera. ℹ️ Il guard dell''annullamento resta trgfn_preventivi_guard_annullamento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: torna al corpo con la sola Regola 1. Va eseguito PRIMA
              -- del rollback di 20260829-09, che elimina la funzione chiamata.
              CREATE OR REPLACE FUNCTION vendite.trgfn_preventivi_guard_transizione()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_codice_da config.stati_doc_preventivi.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_preventivi.codice_interno%TYPE;
                  v_ammessa   boolean := false;
              BEGIN
                  IF NEW.stato_doc_preventivo_id IS NOT DISTINCT FROM OLD.stato_doc_preventivo_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_preventivo_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_preventivo_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_preventivi
                   WHERE id IN (OLD.stato_doc_preventivo_id, NEW.stato_doc_preventivo_id);

                  SELECT EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_preventivi t
                       WHERE t.stato_da_id = OLD.stato_doc_preventivo_id
                         AND t.stato_a_id  = NEW.stato_doc_preventivo_id
                         AND t.attivo IS TRUE
                  ) INTO v_ammessa;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text, 'E_PREV_TRANSIZIONE_NON_AMMESSA',
                          jsonb_build_object('preventivo_id', NEW.id, 'numero', NEW.numero,
                                             'stato_da', v_codice_da, 'stato_a', v_codice_a),
                          NEW.tx_id, coalesce(v_codice_da, 'NULL'), coalesce(v_codice_a, 'NULL'));
                  END IF;

                  RETURN NEW;
              END;
              $function$;
