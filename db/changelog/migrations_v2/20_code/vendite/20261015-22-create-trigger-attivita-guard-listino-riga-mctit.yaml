# ------------------------------------------------------------
# MONTAGGIO: vendite.trgfn_attivita_guard_listino_riga (20261015-21) su
#   vendite.commesse_attivita e vendite.attivita_fatturabili.
#
#   AFTER INSERT OR UPDATE, FOR EACH ROW, senza WHEN: in INSERT non c'e' OLD,
#   e il filtro «cambia una delle quattro colonne» sta nel corpo.
#   Trigger scritti a mano, non da ci_apply (linee-guida-sql §11.5).
#   ⛔ Nomi sotto i 63 caratteri (51 e 55).
#
#   ORDINE fra gli AFTER: le FK (RI_ConstraintTrigger_*, maiuscole) vengono
#   prima, quindi una riga di listino che non esiste la rifiuta la FK. Fra gli
#   a10 generati, _guard_listino_riga precede _listini_righe_require_attivo:
#   su una riga incoerente E disattivata parla l'incoerenza.
#   Brief: brief-db-coerenza-listino-della-riga-di-commessa (§5, primo giro).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261015-22-create-trigger-attivita-guard-listino-riga-mctit.yaml

  - changeSet:
      id: 20261015-22-create-trigger-attivita-guard-listino-riga
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta vendite.trgfn_attivita_guard_listino_riga su vendite.commesse_attivita e
        vendite.attivita_fatturabili (AFTER INSERT OR UPDATE): la riga di listino citata per il prezzo
        e' coerente con la riga. Decisione di Tid, 2026-10-15.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_trigger t
               WHERE t.tgname IN ('trg_commesse_attivita_a10_guard_listino_riga_ins_upd',
                                  'trg_attivita_fatturabili_a10_guard_listino_riga_ins_upd')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_commesse_attivita_a10_guard_listino_riga_ins_upd
                  AFTER INSERT OR UPDATE
                  ON vendite.commesse_attivita
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_attivita_guard_listino_riga();

              CREATE TRIGGER trg_attivita_fatturabili_a10_guard_listino_riga_ins_upd
                  AFTER INSERT OR UPDATE
                  ON vendite.attivita_fatturabili
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_attivita_guard_listino_riga();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_commesse_attivita_a10_guard_listino_riga_ins_upd
                  ON vendite.commesse_attivita;
              DROP TRIGGER IF EXISTS trg_attivita_fatturabili_a10_guard_listino_riga_ins_upd
                  ON vendite.attivita_fatturabili;
