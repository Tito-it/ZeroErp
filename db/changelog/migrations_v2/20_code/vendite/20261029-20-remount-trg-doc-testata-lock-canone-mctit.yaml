# ------------------------------------------------------------
# FUORI DALLA BOZZA I CANONI DELLA TESTATA NON CAMBIANO: i montaggi del lock di testata
#   di vendite.contratti e vendite.offerte_commerciali
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §6.4 (F-2, F-7), §6.6 (Lotto 5)
#
#   generazione_canone e mese_partenza_canone (20261029-15) sono condizioni del
#   documento, come listino, variazione e validita': cambiandole su un
#   contratto attivo cambierebbero i periodi gia' addebitati, e su un'offerta
#   emessa quello che il cliente ha davanti. Si aggiungono alle terne del lock
#   (vendite.trgfn_doc_testata_lock_fuori_bozza) col codice delle condizioni,
#   E_DOC_CONDIZIONI_FUORI_BOZZA, in tutti gli stati fuori dalla bozza ('').
#
#   Gli argomenti di un trigger si cambiano solo smontando e rimontando: i due
#   montaggi rigenerati da pg_get_triggerdef su dbdev (2026-10-29), con le due
#   terne in piu' dopo l'ultima delle validita'. Stesso nome, fase, eventi,
#   argomenti precedenti e successivi. ⚠️ Lettori di tgargs: la funzione del
#   lock e la sua grammatica (terne colonna, codice, stati), che non cambia.
#
# Ritorno indietro: i due montaggi di prima, da pg_get_triggerdef.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261029-20-remount-trg-doc-testata-lock-canone-mctit.yaml

  - changeSet:
      id: 20261029-20-remount-trg-doc-testata-lock-canone
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Rimonta il lock di testata di contratti e offerte con generazione_canone e
        mese_partenza_canone fra le condizioni ferme fuori dalla bozza. Brief:
        brief-db-contratto-righe-periodiche-in-commessa §6.6 (Lotto 5).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_a05_lock_fuori_bozza_upd ON vendite.contratti;
              CREATE TRIGGER trg_contratti_a05_lock_fuori_bozza_upd BEFORE UPDATE ON vendite.contratti FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza('CONTRATTO', 'DRAFT', 'data', 'E_DOC_IDENTITA_FUORI_BOZZA', '', 'valuta_id', 'E_DOC_IDENTITA_FUORI_BOZZA', '', 'billing_account_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '', 'istanza_utility_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '', 'utility_id', 'E_DOC_UTILITY_IMMUTABILE', '-', 'emittente_fiscale_id', 'E_DOC_EMITTENTE_IMMUTABILE', '-', 'listino_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'listino_versione_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'tipo_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'valore_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'ambito', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'valido_dal', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'generazione_canone', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'mese_partenza_canone', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'parent_contratto_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'categoria_cliente_id_snapshot', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'offerta_id', 'E_DOC_SORGENTE_FUORI_BOZZA', '', 'sorgente_tipo_id', 'E_DOC_SORGENTE_FUORI_BOZZA', '', 'sorgente_uid', 'E_DOC_SORGENTE_FUORI_BOZZA', '', 'valido_al', 'E_DOC_CHIUSO', 'ATTIVO', 'codice_cig', 'E_DOC_CHIUSO', 'ATTIVO', 'codice_cup', 'E_DOC_CHIUSO', 'ATTIVO', 'codice_commessa', 'E_DOC_CHIUSO', 'ATTIVO', 'meta', 'E_DOC_CHIUSO', 'ATTIVO');

              DROP TRIGGER IF EXISTS trg_offerte_commerciali_a05_lock_fuori_bozza_upd ON vendite.offerte_commerciali;
              CREATE TRIGGER trg_offerte_commerciali_a05_lock_fuori_bozza_upd BEFORE UPDATE ON vendite.offerte_commerciali FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza('OFFERTA_COMMERCIALE', 'BOZZA', 'valuta_id', 'E_DOC_IDENTITA_FUORI_BOZZA', '', 'billing_account_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '', 'istanza_utility_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '', 'utility_id', 'E_DOC_UTILITY_IMMUTABILE', '-', 'emittente_fiscale_id', 'E_DOC_EMITTENTE_IMMUTABILE', '-', 'listino_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'listino_versione_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'tipo_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'valore_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'validita_dal', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'validita_al', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'generazione_canone', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'mese_partenza_canone', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '', 'meta', 'E_DOC_CHIUSO', 'EMESSA,ACCETTATA', 'motivazione_rifiuto', 'E_DOC_CHIUSO', 'EMESSA,ACCETTATA');

      rollback:
