databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260515-04-update-fn-crea-revisione-preventivo-mctit.yaml

  # ---------------------------------------------------------------------------
  # Refactor vendite.fn_crea_revisione_preventivo (rev 2026-05-15):
  #
  # 1. RIMUOVE l'UPDATE is_revision_attiva = false sul predecessore:
  #    non serve piu' — con is_attiva derivata in vw_preventivi, la nuova
  #    revisione DRAFT (is_abortito=FALSE) rende automaticamente la rev
  #    precedente non-attiva per costruzione.
  #
  # 2. RIMUOVE is_revision_attiva dall'INSERT della nuova testata:
  #    la colonna viene droppata in 20260515-05.
  #
  # 3. AGGIUNGE copia preventivi_righe_componenti con FK remap (bug fix #1.2):
  #    rev N+1 ora include i componenti BoM delle righe padre composite.
  #    FK remap old_riga_id → new_riga_id via ROW_NUMBER su (ordine, id):
  #    l'INSERT righe usa ORDER BY ordine, id → i nuovi id (IDENTITY sequenziale)
  #    sono assegnati nell'ordine della SELECT, garantendo allineamento 1:1.
  #    Filtro: solo componenti con attivo IS TRUE.
  #
  # 4. Aggiunge ORDER BY ordine, id alla copia righe (prerequisito remap).
  #
  # Versione precedente: rev 03-05-2026.
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260515-04-update-fn-crea-revisione-preventivo
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Refactor fn_crea_revisione_preventivo: rimuove gestione is_revision_attiva
        (derivata in vw_preventivi), aggiunge copia preventivi_righe_componenti
        con FK remap via ROW_NUMBER (fix: revisione generava righe padre senza componenti).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: preventivi
            - tableExists:
                schemaName: vendite
                tableName: preventivi_righe_componenti
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_crea_revisione_preventivo'
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_crea_revisione_preventivo(
                  p_preventivo_id vendite.preventivi.id%TYPE,
                  p_user          text
              )
              RETURNS TABLE(nuovo_preventivo_id vendite.preventivi.id%TYPE,
                  numero vendite.preventivi.numero%TYPE, nuova_rev vendite.preventivi.rev%TYPE)
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente_cod  config.stati_doc_preventivi.codice%TYPE;
                v_numero              vendite.preventivi.numero%TYPE;
                v_max_rev             vendite.preventivi.rev%TYPE;
                v_stato_draft_id      config.stati_doc_preventivi.id%TYPE;
                v_new_id              vendite.preventivi.id%TYPE;
                v_new_rev             vendite.preventivi.rev%TYPE;
                v_has_draft           boolean;
              BEGIN
                -- ==========================================================
                -- Scopo:
                --   Creare una nuova revisione in DRAFT a partire da un
                --   preventivo in stato EMESSO. Copia testata, righe attive,
                --   indirizzi e componenti BoM (con FK remap). Non gestisce
                --   is_revision_attiva: l'attivazione e' derivata in
                --   vendite.vw_preventivi tramite is_abortito degli stati.
                --
                -- Regole (rev 2026-05-15):
                --   - stato corrente DEVE essere EMESSO
                --   - non deve esistere gia' una revisione DRAFT per lo stesso numero
                --   - la nuova revisione ha rev = max(rev)+1, stato DRAFT
                --   - righe copiate: solo attive con quantita > 0, ORDER BY ordine, id
                --   - componenti BoM: copiati con FK remap old→new riga_id
                --     via ROW_NUMBER su (ordine, id); solo attivi
                --   - indirizzi: tutti copiati
                --
                -- Parametri:
                --   p_preventivo_id : ID del preventivo da revisionare
                --   p_user          : utente che esegue l'operazione
                -- ==========================================================

                -- Guard: parametro obbligatorio
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('param', 'p_preventivo_id', 'value', p_preventivo_id),
                    NULL::uuid,
                    'p_preventivo_id = ' || COALESCE(p_preventivo_id::text, 'NULL')
                  );
                END IF;

                -- Recupera stato corrente e numero
                SELECT sdp.codice, p.numero
                  INTO v_stato_corrente_cod, v_numero
                  FROM vendite.preventivi p
                  JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                 WHERE p.id = p_preventivo_id;

                IF v_stato_corrente_cod IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'PREV_STATO_CORRENTE_NON_TROVATO',
                    jsonb_build_object('preventivo_id', p_preventivo_id),
                    NULL::uuid,
                    p_preventivo_id::text
                  );
                END IF;

                -- Guard: revisione ammessa SOLO da EMESSO
                IF v_stato_corrente_cod NOT IN ('EMESSO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'PREV_REVISIONE_STATO_NON_AMMESSO',
                    jsonb_build_object(
                      'preventivo_id', p_preventivo_id,
                      'stato_corrente', v_stato_corrente_cod
                    ),
                    NULL::uuid,
                    p_preventivo_id::text, v_stato_corrente_cod
                  );
                END IF;

                -- Guard: non deve esistere gia' una revisione DRAFT
                SELECT EXISTS(
                  SELECT 1
                    FROM vendite.preventivi p2
                    JOIN config.stati_doc_preventivi sdp2 ON sdp2.id = p2.stato_doc_preventivo_id
                   WHERE p2.numero = v_numero
                     AND sdp2.codice = 'DRAFT'
                ) INTO v_has_draft;

                IF v_has_draft THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'PREV_REVISIONE_BOZZA_ESISTENTE',
                    jsonb_build_object('numero', v_numero),
                    NULL::uuid,
                    v_numero
                  );
                END IF;

                -- Recupera stato DRAFT id
                SELECT id INTO v_stato_draft_id
                  FROM config.stati_doc_preventivi
                 WHERE codice = 'DRAFT' AND attivo IS TRUE;

                IF v_stato_draft_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_CONFIG_MANCANTE',
                    jsonb_build_object('tabella', 'config.stati_doc_preventivi', 'codice', 'DRAFT'),
                    NULL::uuid,
                    'stato DRAFT non trovato o non attivo in config.stati_doc_preventivi'
                  );
                END IF;

                -- Calcola nuova revisione
                SELECT COALESCE(MAX(p.rev), 0) + 1
                  INTO v_new_rev
                  FROM vendite.preventivi p
                 WHERE p.numero = v_numero;

                -- Crea nuova testata (copia campi dal preventivo originale).
                -- Totali a 0: il trigger STATEMENT su preventivi_righe li ricalcolera'
                -- dopo l'INSERT bulk delle righe copiate (una sola invocazione).
                INSERT INTO vendite.preventivi (
                  numero, rev,
                  billing_account_id, istanza_utility_id, utility_id,
                  validita_dal, validita_al,
                  totale_imponibile, totale_iva, totale_documento,
                  valuta_id, competenza_mese, fatturazione_immediata,
                  stato_doc_preventivo_id, data, termine_pagamento_id,
                  storicizza, meta,
                  user_insert, user_update
                )
                SELECT
                  p.numero, v_new_rev,
                  p.billing_account_id, p.istanza_utility_id, p.utility_id,
                  p.validita_dal, p.validita_al,
                  0, 0, 0,
                  p.valuta_id, p.competenza_mese, p.fatturazione_immediata,
                  v_stato_draft_id, CURRENT_DATE, p.termine_pagamento_id,
                  p.storicizza, p.meta,
                  COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                FROM vendite.preventivi p
                WHERE p.id = p_preventivo_id
                RETURNING id INTO v_new_id;

                -- Copia righe attive.
                -- ORDER BY ordine, id: ordine deterministico necessario per il
                -- remap FK componenti tramite ROW_NUMBER (vedi blocco successivo).
                INSERT INTO vendite.preventivi_righe (
                  preventivo_id, articolo_id, descrizione,
                  quantita, prezzo_unitario, sconto_percentuale,
                  iva_id, ordine, attivo,
                  qta_operativa, uom_operativa_id, factor_to_base,
                  meta,
                  user_insert, user_update
                )
                SELECT
                  v_new_id, pr.articolo_id, pr.descrizione,
                  pr.quantita, pr.prezzo_unitario, pr.sconto_percentuale,
                  pr.iva_id, pr.ordine, pr.attivo,
                  pr.qta_operativa, pr.uom_operativa_id, pr.factor_to_base,
                  pr.meta,
                  COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                FROM vendite.preventivi_righe pr
                WHERE pr.preventivo_id = p_preventivo_id
                  AND pr.attivo IS TRUE
                  AND pr.quantita > 0
                ORDER BY pr.ordine, pr.id;

                -- Copia componenti BoM per le righe padre composite.
                -- FK remap old_riga_id → new_riga_id via ROW_NUMBER su (ordine, id):
                -- la SELECT righe usa ORDER BY ordine, id → i nuovi id (IDENTITY
                -- sequenziale) sono assegnati nello stesso ordine → RN allineati 1:1.
                -- Il trigger trgfn_componenti_calcola_quantita (BEFORE INSERT)
                -- ricalcola quantita/qta_operativa da coeff_qta_snapshot: i valori
                -- copiati vengono sovrасcritti correttamente.
                WITH old_righe AS (
                    SELECT id AS old_riga_id,
                           ROW_NUMBER() OVER (ORDER BY ordine, id) AS rn
                      FROM vendite.preventivi_righe
                     WHERE preventivo_id = p_preventivo_id
                       AND attivo IS TRUE
                       AND quantita > 0
                ),
                new_righe AS (
                    SELECT id AS new_riga_id,
                           ROW_NUMBER() OVER (ORDER BY ordine, id) AS rn
                      FROM vendite.preventivi_righe
                     WHERE preventivo_id = v_new_id
                ),
                riga_map AS (
                    SELECT old_r.old_riga_id, new_r.new_riga_id
                      FROM old_righe old_r
                      JOIN new_righe new_r USING (rn)
                )
                INSERT INTO vendite.preventivi_righe_componenti (
                    riga_preventivo_id, articolo_componente_id, componente_id,
                    coeff_qta_snapshot, quantita, prezzo_unitario, iva_id,
                    origine_prezzo, prezzo_resolver_context,
                    stato_approvazione_prezzo, pratica_approvazione_prezzo_id,
                    uom_operativa_id, factor_to_base, qta_operativa,
                    ordine, attivo, meta,
                    user_insert, user_update
                )
                SELECT
                    rm.new_riga_id,
                    prc.articolo_componente_id, prc.componente_id,
                    prc.coeff_qta_snapshot, prc.quantita, prc.prezzo_unitario, prc.iva_id,
                    prc.origine_prezzo, prc.prezzo_resolver_context,
                    prc.stato_approvazione_prezzo, prc.pratica_approvazione_prezzo_id,
                    prc.uom_operativa_id, prc.factor_to_base, prc.qta_operativa,
                    prc.ordine, prc.attivo, prc.meta,
                    COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                  FROM vendite.preventivi_righe_componenti prc
                  JOIN riga_map rm ON rm.old_riga_id = prc.riga_preventivo_id
                 WHERE prc.attivo IS TRUE;

                -- Copia indirizzi
                INSERT INTO vendite.preventivi_indirizzi (
                  preventivo_id, tipo_indirizzo_id, snapshot,
                  origine_indirizzo_id, origine_soggetto_ruolo_id,
                  user_insert, user_update
                )
                SELECT
                  v_new_id, pi.tipo_indirizzo_id, pi.snapshot,
                  pi.origine_indirizzo_id, pi.origine_soggetto_ruolo_id,
                  COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                FROM vendite.preventivi_indirizzi pi
                WHERE pi.preventivo_id = p_preventivo_id;

                -- Ritorna risultato
                RETURN QUERY
                SELECT v_new_id, v_numero, v_new_rev;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_crea_revisione_preventivo(bigint, text) IS
                  'Crea nuova revisione preventivo: copia testata + righe attive + '
                  'componenti BoM (con FK remap ROW_NUMBER) + indirizzi. '
                  'Non gestisce is_revision_attiva (derivata in vendite.vw_preventivi '
                  'tramite stati_doc_preventivi.is_abortito). '
                  'Guard: stato EMESSO, no DRAFT esistente. rev 2026-05-15.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS
                  vendite.fn_crea_revisione_preventivo(bigint, text);
