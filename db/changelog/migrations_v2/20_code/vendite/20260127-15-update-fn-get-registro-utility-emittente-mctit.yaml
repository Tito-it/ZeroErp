databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260127-15-update-fn-get-registro-utility-emittente-mctit.yaml

  - changeSet:
      id: 20260127-15-update-fn-get-registro-utility-emittente
      author: mctit
      comment: "Estende fn_get_registro_id con utility/emittente e fallback"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_registro_id(
                p_tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE,
                p_utility_id config.utilities.id%TYPE DEFAULT NULL,
                p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL
              )
              RETURNS vendite.registri_fatturazione.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_registro_id vendite.registri_fatturazione.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Risolve il registro dal mapping tipo_doc_fiscale -> registro
                --   con fallback su utility/emittente.
                --
                -- Regole (ordine):
                --   1) tipo_doc + utility + emittente
                --   2) tipo_doc + utility
                --   3) tipo_doc + emittente
                --   4) tipo_doc (generico)
                -- =========================================================

                IF p_tipo_doc_fiscale_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_registro_id', 'E_GENERICO',
                    jsonb_build_object('detail','tipo_doc_fiscale_id obbligatorio'),
                    NULL::uuid,
                    'tipo_doc_fiscale_id obbligatorio'
                  );
                END IF;

                SELECT m.registro_id
                  INTO v_registro_id
                  FROM vendite.tipi_doc_fiscale_registri m
                 WHERE m.tipo_doc_fiscale_id = p_tipo_doc_fiscale_id
                   AND (m.utility_id IS NULL OR m.utility_id = p_utility_id)
                   AND (m.emittente_soggetto_ruolo_id IS NULL OR m.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                 ORDER BY
                   CASE
                     WHEN m.utility_id = p_utility_id AND m.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id THEN 1
                     WHEN m.utility_id = p_utility_id AND m.emittente_soggetto_ruolo_id IS NULL THEN 2
                     WHEN m.utility_id IS NULL AND m.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id THEN 3
                     WHEN m.utility_id IS NULL AND m.emittente_soggetto_ruolo_id IS NULL THEN 4
                     ELSE 9
                   END,
                   m.id
                 LIMIT 1;

                IF v_registro_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_registro_id', 'E_GENERICO',
                    jsonb_build_object(
                      'detail','Registro non risolto (tipo_doc/utility/emittente)',
                      'tipo_doc_fiscale_id', p_tipo_doc_fiscale_id,
                      'utility_id', p_utility_id,
                      'emittente_soggetto_ruolo_id', p_emittente_soggetto_ruolo_id
                    ),
                    NULL::uuid,
                    'Registro non risolto (tipo_doc/utility/emittente)'
                  );
                END IF;

                RETURN v_registro_id;
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_get_registro_id(
                config.tipi_doc_fiscale.id%TYPE,
                config.utilities.id%TYPE,
                anagrafiche.soggetti_ruoli.id%TYPE
              ) IS 'Risoluzione registro_id: tipo_doc + utility/emittente con fallback.';
