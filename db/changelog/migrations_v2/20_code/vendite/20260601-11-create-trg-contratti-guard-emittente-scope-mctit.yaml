databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260601-11-create-trg-contratti-guard-emittente-scope-mctit.yaml

  - changeSet:
      id: 20260601-11-create-trg-contratti-guard-emittente-scope
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Aggancia il write-guard scope emittente a vendite.contratti (brief RLS
        §7, simmetria scrittura convenzione PK). Modalita' 'fiscale': la colonna
        emittente_fiscale_id contiene direttamente la PK. Fase _a10_ (guard);
        l'ordine alfabetico fa scattare trg_..._default_emittente prima del
        guard, cosi' NEW.emittente_fiscale_id e' gia' valorizzato.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: vendite, tableName: contratti }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_guard_emittente_scope';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_a10_guard_emittente_scope_ins_upd
                ON vendite.contratti;

              CREATE TRIGGER trg_contratti_a10_guard_emittente_scope_ins_upd
                BEFORE INSERT OR UPDATE ON vendite.contratti
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_guard_emittente_scope(
                  'fiscale', 'emittente_fiscale_id'
                );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_a10_guard_emittente_scope_ins_upd
                ON vendite.contratti;
