# IL VERBO «CLONA» DI UNA VERSIONE DI LISTINO
#   Brief: brief-modello-documento-vendita §16.14 (C-1 = a di Tid,
#   2026-10-29).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Il «cambio prezzi»: si clona V001 in V002, si cambiano i prezzi, si
#   attiva V002. La copia la faceva il backend su tre tabelle
#   (listini_repository.clone_versione), con la regola D2 nel service. Una
#   scrittura = un verbo: qui, in una transazione, con la regola prima.
#
# ── IL PERCORSO ─────────────────────────────────────────────────────
#   1. Parametri; la sorgente nel perimetro (RLS), FOR KEY SHARE (non sparisce
#      durante la copia). Non trovata: E_VENDITE_LISTINO_VERSIONE_NOT_FOUND.
#      Da qualunque stato (C-1 = a, O1).
#   2. Prima cio' che vieta: il primo motivo di
#      script.fn_check_versione_listino_clonabile (D2), sul campo valido_dal.
#   3. La versione nuova, dello stesso listino: nasce BOZZA (il guard della
#      nascita); attivo e meta dai default, non dalla sorgente.
#   4. Le righe ATTIVE della sorgente (articolo, uom, prezzo, meta), accese.
#   5. I componenti ATTIVI della sorgente, accesi, con la validita'
#      ricalcolata: l'intersezione fra la riga di distinta
#      (catalogo.articoli_componenti) e la versione NUOVA (i prezzi valgono
#      per il periodo nuovo, non per quello della sorgente). Si saltano i
#      componenti senza intersezione: il guard comune delle date li
#      rifiuterebbe, e un solo componente fuori periodo farebbe fallire tutta
#      la copia. Una riga di distinta spenta non c'e': non si spegne finche'
#      un componente di listino attivo la usa (block_deact).
#   Ritorna la versione nuova, quante righe e quanti componenti ha copiato e
#   quanti componenti ha saltato. La copia e' quella del backend di prima.
#
# ── SECURITY INVOKER ────────────────────────────────────────────────
#   Come vendite.fn_elimina_versione_listino: la RLS delle tabelle del listino
#   decide il perimetro (anche nel WITH CHECK delle INSERT), l'applicazione ha
#   gia' INSERT. Il permesso d'area resta al backend.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261029-04-create-fn-clona-versione-listino-mctit.yaml

  - changeSet:
      id: 20261029-04-create-fn-clona-versione-listino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_clona_versione_listino: il verbo che copia una versione di listino (righe e
        componenti) in una versione nuova in BOZZA, dopo la check D2. Brief:
        brief-modello-documento-vendita §16.14.
      preConditions:
        - onFail: HALT
        - not:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_clona_versione_listino';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_check_versione_listino_clonabile';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.fn_clona_versione_listino(
                  p_sorgente_id     vendite.listini_versioni.id%TYPE,
                  p_codice_versione vendite.listini_versioni.codice_versione%TYPE,
                  p_valido_dal      vendite.listini_versioni.valido_dal%TYPE,
                  p_valido_al       vendite.listini_versioni.valido_al%TYPE DEFAULT NULL)
               RETURNS TABLE(versione_id          vendite.listini_versioni.id%TYPE,
                             -- CONTEGGI delle righe copiate e saltate.
                             righe_copiate        integer,
                             componenti_copiati   integer,
                             componenti_saltati   integer)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_listino_id vendite.listini_versioni.listino_id%TYPE;
                  v_tx_id      vendite.listini_versioni.tx_id%TYPE;
                  v_nuova_id   vendite.listini_versioni.id%TYPE;
                  -- CONTEGGI delle righe copiate e dei componenti della sorgente.
                  v_righe      integer;
                  v_componenti integer;
                  v_comp_sorg  integer;
              BEGIN
                  -- ==========================================================
                  -- Scopo: copiare una versione di listino, con le sue righe
                  --   e i suoi componenti attivi, in una versione nuova in
                  --   BOZZA dello stesso listino, in una transazione.
                  --   Vedi l'intestazione del changeSet 20261029-04.
                  -- ==========================================================

                  -- 1. Parametri e sorgente, nel perimetro (RLS).
                  IF p_sorgente_id IS NULL OR p_sorgente_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_sorgente_id', p_sorgente_id),
                          NULL::uuid, 'vendite.fn_clona_versione_listino',
                          'p_sorgente_id (obbligatorio, maggiore di zero)');
                  END IF;
                  IF NULLIF(btrim(p_codice_versione), '') IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_codice_versione', p_codice_versione),
                          NULL::uuid, 'vendite.fn_clona_versione_listino',
                          'p_codice_versione (obbligatorio, non vuoto)');
                  END IF;
                  IF p_valido_dal IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_valido_dal', p_valido_dal),
                          NULL::uuid, 'vendite.fn_clona_versione_listino',
                          'p_valido_dal (obbligatorio)');
                  END IF;

                  SELECT lv.listino_id, lv.tx_id
                    INTO v_listino_id, v_tx_id
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = p_sorgente_id
                     FOR KEY SHARE OF lv;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_clona_versione_listino',
                          'E_VENDITE_LISTINO_VERSIONE_NOT_FOUND',
                          -- Frase chiusa: nessun segnaposto, il variadico vuoto e' esplicito.
                          jsonb_build_object('id', p_sorgente_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Prima cio' che vieta, prima di scrivere.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'vendite.fn_clona_versione_listino',
                      script.fn_check_versione_listino_clonabile(p_sorgente_id, p_valido_dal),
                      'valido_dal',
                      v_tx_id,
                      jsonb_build_object('sorgente_id', p_sorgente_id,
                                         'listino_id', v_listino_id,
                                         'valido_dal', p_valido_dal));

                  -- 3. La versione nuova: lo stato dal guard della nascita.
                  INSERT INTO vendite.listini_versioni (listino_id, codice_versione, valido_dal, valido_al)
                  VALUES (v_listino_id, p_codice_versione, p_valido_dal, p_valido_al)
                  RETURNING id INTO v_nuova_id;

                  -- 4. Le righe attive.
                  INSERT INTO vendite.listini_righe (listino_versione_id, articolo_id, uom_id,
                                                     prezzo, meta, attivo)
                  SELECT v_nuova_id, r.articolo_id, r.uom_id, r.prezzo, r.meta, TRUE
                    FROM vendite.listini_righe r
                   WHERE r.listino_versione_id = p_sorgente_id
                     AND r.attivo IS TRUE;
                  GET DIAGNOSTICS v_righe = ROW_COUNT;

                  -- 5. I componenti attivi, nel periodo comune alla riga di
                  --    distinta e alla versione nuova; gli altri si saltano.
                  SELECT count(*) INTO v_comp_sorg
                    FROM vendite.listini_righe_componenti c
                   WHERE c.listino_versione_id = p_sorgente_id
                     AND c.attivo IS TRUE;

                  INSERT INTO vendite.listini_righe_componenti (
                         listino_versione_id, articolo_componente_id, articolo_padre_id,
                         articolo_figlio_id, prezzo, iva_id, valido_dal, valido_al, attivo)
                  SELECT v_nuova_id, c.articolo_componente_id, c.articolo_padre_id,
                         c.articolo_figlio_id, c.prezzo, c.iva_id,
                         GREATEST(ac.valido_dal, p_valido_dal),
                         -- LEAST ignora i NULL: NULL solo se aperte entrambe.
                         LEAST(ac.valido_al, p_valido_al),
                         TRUE
                    FROM vendite.listini_righe_componenti c
                    JOIN catalogo.articoli_componenti ac ON ac.id = c.articolo_componente_id
                   WHERE c.listino_versione_id = p_sorgente_id
                     AND c.attivo IS TRUE
                     AND GREATEST(ac.valido_dal, p_valido_dal)
                         <= LEAST(COALESCE(ac.valido_al, 'infinity'::date),
                                  COALESCE(p_valido_al,  'infinity'::date));
                  GET DIAGNOSTICS v_componenti = ROW_COUNT;

                  RETURN QUERY SELECT v_nuova_id, v_righe, v_componenti, v_comp_sorg - v_componenti;
              END;
              $function$;

              REVOKE EXECUTE ON FUNCTION vendite.fn_clona_versione_listino(bigint, character varying, date, date) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION vendite.fn_clona_versione_listino(bigint, character varying, date, date) TO zeroerp_app;

              COMMENT ON FUNCTION vendite.fn_clona_versione_listino(bigint, character varying, date, date) IS
                  'VERBO «Clona» di una versione di listino, in una transazione: la sorgente nel perimetro, da qualunque stato (SECURITY INVOKER, la RLS delle tabelle del listino; FOR KEY SHARE; non trovata E_VENDITE_LISTINO_VERSIONE_NOT_FOUND); prima cio'' che vieta, sul campo valido_dal (il primo motivo di script.fn_check_versione_listino_clonabile: E_LISTINO_VERSIONE_CLONE_PRIMA_DELLA_SORGENTE, decisione D2); poi la versione nuova dello stesso listino (codice, decorrenza e fine dai parametri; nasce BOZZA, attivo e meta dai default), le righe attive della sorgente (articolo, uom, prezzo, meta) e i componenti attivi con la validita'' ricalcolata come intersezione fra la riga di distinta e la versione nuova. Si saltano i componenti senza intersezione. Ritorna la versione nuova, righe e componenti copiati, componenti saltati. Prende il posto di listini_repository.clone_versione e della regola D2 del service. Il permesso d''area resta al backend. EXECUTE solo all''applicazione. Brief: brief-modello-documento-vendita §16.14 (C-1 = a, Tid 2026-10-29).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_clona_versione_listino(bigint, character varying, date, date);
