# ------------------------------------------------------------
# AGGIORNATO: vendite.fn_push_preventivo_a_ordine
#   La riga d'ordine porta la natura della riga di preventivo.
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-4, §9.2)
#
#   vendite.ordini_righe.natura_vendita_id (20261013-07) e' la natura con cui
#   la riga e' stata venduta; script.trgfn_righe_natura_vendita (modo
#   CHIAMANTE) accetta quella portata da chi copia la riga. Qui la si prende
#   dalla vista-predicato vw_preventivi_righe_smistabili_ordine, che la espone
#   gia' (e' la natura congelata della riga di preventivo): un articolo che ha
#   cambiato natura dopo il preventivo non cambia cio' che si e' venduto.
#   Corpo base: 20261012-13 (uguale al corpo vivo su dbdev, verificato il
#   2026-10-13), firma ANCORATA invariata. Tre punti toccati: la SELECT, la
#   lista delle colonne, i VALUES. Rollback: il corpo di 20261012-13.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261013-11-update-fn-push-preventivo-a-ordine-porta-la-natura-mctit.yaml

  - changeSet:
      id: 20261013-11-update-fn-push-preventivo-a-ordine-porta-la-natura
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_push_preventivo_a_ordine: la riga d'ordine porta la natura della riga di preventivo.
        Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-4).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_push_preventivo_a_ordine(p_preventivo_id vendite.preventivi.id%TYPE, p_righe_ids bigint[] DEFAULT NULL::bigint[], p_pratica_id pratiche.pratiche.id%TYPE DEFAULT NULL::bigint, p_fatturazione_trigger vendite.ordini.fatturazione_trigger%TYPE DEFAULT NULL::character varying, p_flusso_id pratiche.flussi.id%TYPE DEFAULT NULL::bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_accettato_id   config.stati_doc_preventivi.id%TYPE;
                  v_stato_draft_ord_id   config.stati_doc_ordini.id%TYPE;
                  v_ba_id                vendite.preventivi.billing_account_id%TYPE;
                  v_utility_id           vendite.preventivi.utility_id%TYPE;
                  v_emittente_fiscale_id vendite.preventivi.emittente_fiscale_id%TYPE;
                  v_valuta_id            vendite.preventivi.valuta_id%TYPE;
                  v_termine_pag_id       vendite.preventivi.termine_pagamento_id%TYPE;
                  v_preventivo_uid       vendite.preventivi.uid%TYPE;
                  -- Il BERSAGLIO del rifiuto. ⚠️ `jsonb` esplicito: e' un frammento del
                  -- context, non il valore di una colonna.
                  v_bersagli             jsonb;
                  v_soggetto_ruolo_id    vendite.ordini.soggetto_ruolo_id%TYPE;
                  v_emittente_sr_id      anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_fatt_trigger         vendite.ordini.fatturazione_trigger%TYPE;
                  v_data                 vendite.ordini.data%TYPE := script.fn_data_operativa();
                  v_n_residue            integer;
                  v_ordine_id            vendite.ordini.id%TYPE;
                  v_new_riga_id          vendite.ordini_righe.id%TYPE;
                  v_overrides            jsonb;
                  v_sorg_prev_id         config.sorgenti.id%TYPE;
                  v_sorg_ord_id          config.sorgenti.id%TYPE;
                  v_riga                 RECORD;
              BEGIN
                  -- 1) Guard input.
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine', 'E_VALIDAZIONE',
                          jsonb_build_object('p_preventivo_id', p_preventivo_id),
                          NULL::uuid, 'p_preventivo_id deve essere > 0');
                  END IF;

                  -- 2) Stato ACCETTATO obbligatorio + lettura testata preventivo.
                  SELECT id INTO v_stato_accettato_id
                    FROM config.stati_doc_preventivi
                   WHERE codice_interno = 'ACCETTATO' AND attivo IS TRUE;

                  SELECT p.billing_account_id, p.utility_id, p.emittente_fiscale_id,
                         p.valuta_id, p.termine_pagamento_id, p.uid
                    INTO v_ba_id, v_utility_id, v_emittente_fiscale_id,
                         v_valuta_id, v_termine_pag_id, v_preventivo_uid
                    FROM vendite.preventivi p
                   WHERE p.id = p_preventivo_id
                     AND p.stato_doc_preventivo_id = v_stato_accettato_id;

                  IF NOT FOUND THEN
                      -- Preventivo inesistente o non ACCETTATO: stesso errore parlante.
                      --
                      -- ⭐ IL BERSAGLIO, e qui va SUL PREVENTIVO: a differenza dei guard di
                      --    idempotenza dell'offerta, la cosa da raggiungere e' proprio il
                      --    documento nominato — l'operatore deve andarci per accettarlo.
                      --
                      -- ⭐ E SI CITA PER UID, non per id. E' il primo uso reale di
                      --    config.tipi_entita.key_selector: il preventivo, come l'offerta,
                      --    il progetto lo indirizza da fuori con l'uid (la stessa scelta di
                      --    config.sorgenti). Mandare l'id numerico avrebbe prodotto un
                      --    pulsante che non apre niente.
                      --
                      -- ⛔ E SOLO SE ESISTE. Questo errore copre due casi — «non c'e'» e
                      --    «c'e' ma non e' ACCETTATO» — e solo il secondo ha un posto dove
                      --    mandare qualcuno. Se il preventivo non esiste (o non e' visibile,
                      --    che per chi opera e' la stessa cosa) il messaggio si mostra lo
                      --    stesso e il pulsante non compare: il bersaglio e' un'offerta, non
                      --    una promessa.
                      --
                      -- ⚠️ La lettura e' SENZA il filtro di stato — quello di sopra ha appena
                      --    fallito proprio per lo stato: rimetterlo qui darebbe sempre NULL.
                      -- ⚠️ L'ID, non l'uid — correzione del 2026-08-24 su rilievo del backend.
                      --    Al primo giro qui c'era `pv.uid::text`, ereditato da
                      --    `config.sorgenti.key_selector`. Misurato: le rotte del preventivo
                      --    sono `<int:preventivo_id>` e gli endpoint che accettano un uid
                      --    sono ZERO — quel bersaglio avrebbe prodotto un pulsante che non
                      --    apre niente.
                      --    ⭐ Le due colonne si chiamano uguale e rispondono a domande
                      --    diverse: `config.sorgenti` dice con quale chiave il LINEAGE
                      --    collega il documento, `config.tipi_entita` con quale chiave lo si
                      --    RAGGIUNGE. Il valore si misura sulle rotte, non si eredita.
                      SELECT jsonb_build_array(jsonb_build_object('tipo', 'PREVENTIVO',
                                                                  'id',   pv.id::text))
                        INTO v_bersagli
                        FROM vendite.preventivi pv
                       WHERE pv.id = p_preventivo_id;

                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine',
                          'E_VENDITA_PREVENTIVO_PUSH_STATO_NON_AMMESSO',
                          -- ⚠️ La chiave si aggiunge solo se c'e' qualcosa da dire: una
                          --    chiave a NULL sarebbe letta come bersaglio malformato.
                          jsonb_build_object('preventivo_id', p_preventivo_id)
                          || CASE WHEN v_bersagli IS NULL THEN '{}'::jsonb
                                  ELSE jsonb_build_object('bersaglio', v_bersagli) END,
                          NULL::uuid, p_preventivo_id::text);
                  END IF;

                  -- Cliente (soggetto_ruolo) dal billing_account; emittente soggetto_ruolo
                  -- per l'init componenti BoM.
                  SELECT soggetto_ruolo_id INTO v_soggetto_ruolo_id
                    FROM anagrafiche.billing_account WHERE id = v_ba_id;
                  SELECT soggetto_ruolo_id INTO v_emittente_sr_id
                    FROM anagrafiche.emittenti_fiscali WHERE id = v_emittente_fiscale_id;

                  SELECT id INTO v_stato_draft_ord_id
                    FROM config.stati_doc_ordini
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE;

                  v_fatt_trigger := p_fatturazione_trigger;   -- NULL = «non scelto» -> eredita dal BA (trgfn_ordini_normalize)

                  -- 3) Conta le righe RESIDUE da smistare a ORDINE leggendo la
                  --    vista-predicato unica (MERCE + ATTIVA + non gia' allocata),
                  --    ristretta al sottoinsieme richiesto (D5 idempotenza di riga).
                  SELECT count(*) INTO v_n_residue
                    FROM vendite.vw_preventivi_righe_smistabili_ordine v
                   WHERE v.preventivo_id = p_preventivo_id
                     AND (p_righe_ids IS NULL OR v.id = ANY(p_righe_ids));

                  IF v_n_residue = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine',
                          'E_VENDITA_PREVENTIVO_NESSUNA_RIGA_ORDINE',
                          jsonb_build_object('preventivo_id', p_preventivo_id,
                                             'righe_ids', to_jsonb(p_righe_ids)),
                          NULL::uuid, p_preventivo_id::text);
                  END IF;

                  -- 4) Testata ordine: DRAFT, documento_origine = (PREVENTIVO, id).
                  --    numero/serie/anno li genera il trigger trgfn_ordini_gen_numero
                  --    (motore dei registri, 20260831-*; fino al 2026-09-13 qui c'era il
                  --    nome morto trgfn_ordini_gen_codice — brief prefisso-sul-registro 6.3).
                  INSERT INTO vendite.ordini (
                      soggetto_ruolo_id, billing_account_id, utility_id, valuta_id,
                      termine_pagamento_id, emittente_fiscale_id, data,
                      stato_doc_ordine_id, fatturazione_trigger,
                      documento_origine_tipo, documento_origine_id)
                  VALUES (
                      v_soggetto_ruolo_id, v_ba_id, v_utility_id, v_valuta_id,
                      v_termine_pag_id, v_emittente_fiscale_id, v_data,
                      v_stato_draft_ord_id, v_fatt_trigger,
                      'PREVENTIVO', p_preventivo_id)
                  RETURNING id INTO v_ordine_id;

                  -- 4-bis) Cascata indirizzi (D-1): copia 1:1 gli snapshot del
                  --   preventivo filtrati sui tipi ammessi in ambito ORDINI.
                  --   origine_* propagati; idempotente (uno-per-tipo).
                  INSERT INTO vendite.ordini_indirizzi (
                      ordine_id, tipo_indirizzo_id, snapshot,
                      origine_indirizzo_id, origine_soggetto_ruolo_id)
                  SELECT v_ordine_id, pi.tipo_indirizzo_id, pi.snapshot,
                         pi.origine_indirizzo_id, pi.origine_soggetto_ruolo_id
                    FROM vendite.preventivi_indirizzi pi
                    JOIN config.tipi_indirizzi_allowed a
                      ON a.tipo_indirizzo_id = pi.tipo_indirizzo_id
                     AND a.ambito = 'ORDINI'
                     AND a.attivo IS TRUE
                   WHERE pi.preventivo_id = p_preventivo_id
                  ON CONFLICT (ordine_id, tipo_indirizzo_id) DO NOTHING;

                  -- 5) Copia le righe residue (snapshot prezzi) dalla vista-predicato.
                  --    La INNER JOIN a catalogo.articoli e' PROIEZIONE: serve
                  --    is_composito e, come oggi, scarta righe senza articolo.
                  --    riga_nr progressivo; quantita derivata dal trigger
                  --    qta_from_operativa; link di riga preventivo_riga_id (idempotenza).
                  FOR v_riga IN
                      SELECT v.id AS riga_id, v.articolo_id, v.descrizione,
                             v.prezzo_unitario, v.sconto_percentuale, v.iva_id,
                             v.qta_operativa, v.uom_operativa_id, v.factor_to_base,
                             -- rev 2026-09-13 (P-5): la data chiesta dal cliente sulla riga di
                             -- preventivo, esposta dalla vista in 20260913-16. Si porta avanti
                             -- qui, nel punto in cui il documento cambia natura, o si perde.
                             v.data_consegna_richiesta_cliente,
                             v.natura_vendita_id,
                             a.is_composito,
                             row_number() OVER (ORDER BY v.ordine NULLS LAST, v.id) AS rn
                        FROM vendite.vw_preventivi_righe_smistabili_ordine v
                        JOIN catalogo.articoli a ON a.id = v.articolo_id
                       WHERE v.preventivo_id = p_preventivo_id
                         AND (p_righe_ids IS NULL OR v.id = ANY(p_righe_ids))
                       ORDER BY rn
                  LOOP
                      INSERT INTO vendite.ordini_righe (
                          ordine_id, riga_nr, articolo_id, descrizione,
                          prezzo_unitario, sconto_percentuale, iva_id,
                          qta_operativa, uom_operativa_id, factor_to_base,
                          stato_doc_ordine_id, preventivo_riga_id,
                          data_consegna_richiesta_cliente, natura_vendita_id)
                      VALUES (
                          v_ordine_id, v_riga.rn::integer, v_riga.articolo_id,
                          COALESCE(v_riga.descrizione,
                                   (SELECT descrizione FROM catalogo.articoli
                                     WHERE id = v_riga.articolo_id)),
                          -- Padre composito: 0 placeholder, il prezzo lo ricalcola
                          -- il trigger dai componenti inizializzati sotto.
                          CASE WHEN v_riga.is_composito THEN 0 ELSE v_riga.prezzo_unitario END,
                          COALESCE(v_riga.sconto_percentuale, 0), v_riga.iva_id,
                          v_riga.qta_operativa, v_riga.uom_operativa_id,
                          COALESCE(v_riga.factor_to_base, 1),
                          v_stato_draft_ord_id, v_riga.riga_id,
                          -- La richiesta del cliente si copia; la conferma (nostra) resta
                          -- NULL: su un preventivo non c'e' ancora niente da confermare.
                          v_riga.data_consegna_richiesta_cliente,
                          -- La natura con cui il preventivo ha venduto la riga (A-4): la
                          -- riga d'ordine la porta, anche se l'articolo nel frattempo e' cambiato.
                          v_riga.natura_vendita_id)
                      RETURNING id INTO v_new_riga_id;

                      -- 6) BoM CASO A: prezzi snapshot del preventivo come override
                      --    (no ri-prezzatura). Stesso pattern del push offerta->ordine.
                      IF v_riga.is_composito THEN
                          SELECT jsonb_object_agg(prc.componente_id::text, prc.prezzo_unitario)
                            INTO v_overrides
                            FROM vendite.preventivi_righe_componenti prc
                           WHERE prc.riga_preventivo_id = v_riga.riga_id
                             AND COALESCE(prc.attivo, TRUE) IS TRUE
                             AND prc.prezzo_unitario <> 0;

                          PERFORM vendite.fn_ordine_riga_componenti_init(
                              v_new_riga_id, v_emittente_sr_id, v_data, v_overrides);
                      END IF;
                  END LOOP;

                  -- 7) Aggancio pratica (D4, solo se la pratica esiste):
                  --    preventivo ROOT + ordine COLLEGATO. Idempotente.
                  --    D-B: il link COLLEGATO valorizza flusso_id (p_flusso_id) =
                  --    flusso dello step generatore; NULL retro-compatibile.
                  IF p_pratica_id IS NOT NULL THEN
                      SELECT id INTO v_sorg_prev_id FROM config.sorgenti
                       WHERE codice_interno = 'PREVENTIVO';
                      SELECT id INTO v_sorg_ord_id FROM config.sorgenti
                       WHERE codice_interno = 'ORDINE_VENDITA';

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id, sorgente_tipo_id, sorgente_uid, ruolo_link)
                      VALUES (p_pratica_id, v_sorg_prev_id, v_preventivo_uid::text, 'ROOT')
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id, sorgente_tipo_id, sorgente_uid, ruolo_link, flusso_id)
                      VALUES (p_pratica_id, v_sorg_ord_id, v_ordine_id::text, 'COLLEGATO', p_flusso_id)
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;
                  END IF;

                  -- 8) Lo stato del preventivo dal suo smistamento (atomico con la
                  --    creazione dell'ordine, finding #10): ACCETTATO senza residuo su
                  --    nessuna strada -> EVASO. rev 2026-10-12 (20261012-13): la regola
                  --    non e' piu' scritta qui ma nel BB
                  --    vendite.fn_preventivo_proietta_stato_smistamento, la sede unica che
                  --    leggono anche l'annullo dell'ordine e l'invio in commessa
                  --    (brief-db-annullo-a-valle-riapre-a-monte, D-10).
                  PERFORM vendite.fn_preventivo_proietta_stato_smistamento(p_preventivo_id);

                  RETURN v_ordine_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_push_preventivo_a_ordine(vendite.preventivi.id%TYPE, bigint[], pratiche.pratiche.id%TYPE, vendite.ordini.fatturazione_trigger%TYPE, pratiche.flussi.id%TYPE) IS
                  'Push preventivo ACCETTATO -> ordine DRAFT (testata + righe + BoM). Aggancio pratica opzionale (ROOT preventivo + COLLEGATO ordine con flusso_id, D-B). Sezione 8: gate EVASO bi-ramo atomico (finding #10 analisi-fix-transazioni): niente piu'' ordine creato + preventivo bloccato in ACCETTATO. p_flusso_id DEFAULT NULL retro-compatibile. rev 2026-08-17: p_fatturazione_trigger NON viene piu'' portato a ''CONFERMATO'' con un COALESCE locale — passa in testata cosi'' com''e'', NULL compreso, e la risoluzione (testata -> billing_account -> CONFERMATO) sta in un posto solo, vendite.trgfn_ordini_normalize. Prima questa funzione raccoglieva il parametro e quel trigger lo sovrascriveva un istante dopo: il parametro era inerte (segnalazione BE 2026-08-16; brief-be-fan-out-isolato-e-esito-parziale.md §13.2, brief-design-fatturazione-due-lenti.md §6-quater DL-19). ⭐ rev 2026-08-24: il rifiuto porta il BERSAGLIO sul preventivo, e lo cita per ID — primo uso reale di config.tipi_entita.key_selector: il progetto indirizza preventivi e offerte con l''uid (come dichiara config.sorgenti), e mandare l''id numerico avrebbe prodotto un pulsante che non apre niente. ⛔ Solo se il preventivo ESISTE: questo errore copre due casi — «non c''e''» e «c''e'' ma non e'' ACCETTATO» — e solo il secondo ha un posto dove mandare qualcuno; se non esiste, il messaggio si mostra lo stesso e il pulsante non compare. ⚠️ La lettura dell''uid e'' senza filtro di stato: quello di sopra ha appena fallito proprio per lo stato. Brief: brief-db-bersaglio-errore.md §6 L6. ⚠️ rev 2026-08-24 (correzione): il bersaglio cita l''ID e non piu'' l''uid. Rilievo del backend, misurato: le rotte del preventivo sono <int:preventivo_id> e gli endpoint che accettano un uid sono zero — un bersaglio a uid avrebbe prodotto un pulsante che non apre niente, cioe'' esattamente il difetto che config.tipi_entita.key_selector esiste per evitare. ⭐ La lezione: quella colonna dice con quale chiave si RAGGIUNGE l''entita'', e il valore si misura sulle ROTTE; config.sorgenti.key_selector dice un''altra cosa (con quale chiave il lineage collega il documento) e non si eredita. ⭐ rev 2026-09-13 (P-5, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 2.4): porta avanti data_consegna_richiesta_cliente dalla riga di preventivo alla riga d''ordine, leggendola dalla vista-predicato vw_preventivi_righe_smistabili_ordine (20260913-16) e non con un JOIN suo, che sarebbe una seconda sede della stessa lista di righe. Senza, la data si perdeva nel punto in cui il documento cambia natura, cioe'' dove gli utenti smetterebbero di fidarsene. data_consegna_confermata resta NULL: e'' la promessa nostra e si decide alla conferma dell''ordine. Tolto il nome morto trgfn_ordini_gen_codice dal commento del passo 4 (era dichiarato «alla prossima occasione» nel brief prefisso-sul-registro 6.3): il numero lo assegna trgfn_ordini_gen_numero dal motore dei registri. ⚠️ rev 2026-09-14: nessun cambio di comportamento — la FIRMA torna ANCORATA (%TYPE su preventivi.id, pratiche.pratiche.id, ordini.fatturazione_trigger, pratiche.flussi.id, RETURNS ordini.id) com''era in 20260824-02: 20260824-10 e 20260913-20 l''avevano ricopiata sciolta dal corpo vivo di pg_get_functiondef, che scioglie i %TYPE al CREATE. Identita'' byte-identica, nessun overload. ⭐ rev 2026-10-12 (20261012-13, brief-db-annullo-a-valle-riapre-a-monte D-10): la sezione 8 non scrive piu'' la regola EVASO: chiama il BB vendite.fn_preventivo_proietta_stato_smistamento, la sede unica di ACCETTATO <-> EVASO, che leggono anche l''annullo dell''ordine (vendite.fn_documento_ritira_legami) e l''invio in commessa (trigger sulle righe di commessa). Comportamento invariato su questo percorso; firma invariata. ⭐ rev 2026-10-13 (20261013-11, brief-db-articoli-ammessi-per-documento A-4): la riga d''ordine porta la natura della riga di preventivo (natura_vendita_id da vw_preventivi_righe_smistabili_ordine), che script.trgfn_righe_natura_vendita in modo CHIAMANTE accetta: la natura venduta e'' quella del preventivo, non quella che l''articolo ha oggi. Firma invariata.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_push_preventivo_a_ordine(p_preventivo_id vendite.preventivi.id%TYPE, p_righe_ids bigint[] DEFAULT NULL::bigint[], p_pratica_id pratiche.pratiche.id%TYPE DEFAULT NULL::bigint, p_fatturazione_trigger vendite.ordini.fatturazione_trigger%TYPE DEFAULT NULL::character varying, p_flusso_id pratiche.flussi.id%TYPE DEFAULT NULL::bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_accettato_id   config.stati_doc_preventivi.id%TYPE;
                  v_stato_draft_ord_id   config.stati_doc_ordini.id%TYPE;
                  v_ba_id                vendite.preventivi.billing_account_id%TYPE;
                  v_utility_id           vendite.preventivi.utility_id%TYPE;
                  v_emittente_fiscale_id vendite.preventivi.emittente_fiscale_id%TYPE;
                  v_valuta_id            vendite.preventivi.valuta_id%TYPE;
                  v_termine_pag_id       vendite.preventivi.termine_pagamento_id%TYPE;
                  v_preventivo_uid       vendite.preventivi.uid%TYPE;
                  -- Il BERSAGLIO del rifiuto. ⚠️ `jsonb` esplicito: e' un frammento del
                  -- context, non il valore di una colonna.
                  v_bersagli             jsonb;
                  v_soggetto_ruolo_id    vendite.ordini.soggetto_ruolo_id%TYPE;
                  v_emittente_sr_id      anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_fatt_trigger         vendite.ordini.fatturazione_trigger%TYPE;
                  v_data                 vendite.ordini.data%TYPE := script.fn_data_operativa();
                  v_n_residue            integer;
                  v_ordine_id            vendite.ordini.id%TYPE;
                  v_new_riga_id          vendite.ordini_righe.id%TYPE;
                  v_overrides            jsonb;
                  v_sorg_prev_id         config.sorgenti.id%TYPE;
                  v_sorg_ord_id          config.sorgenti.id%TYPE;
                  v_riga                 RECORD;
              BEGIN
                  -- 1) Guard input.
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine', 'E_VALIDAZIONE',
                          jsonb_build_object('p_preventivo_id', p_preventivo_id),
                          NULL::uuid, 'p_preventivo_id deve essere > 0');
                  END IF;

                  -- 2) Stato ACCETTATO obbligatorio + lettura testata preventivo.
                  SELECT id INTO v_stato_accettato_id
                    FROM config.stati_doc_preventivi
                   WHERE codice_interno = 'ACCETTATO' AND attivo IS TRUE;

                  SELECT p.billing_account_id, p.utility_id, p.emittente_fiscale_id,
                         p.valuta_id, p.termine_pagamento_id, p.uid
                    INTO v_ba_id, v_utility_id, v_emittente_fiscale_id,
                         v_valuta_id, v_termine_pag_id, v_preventivo_uid
                    FROM vendite.preventivi p
                   WHERE p.id = p_preventivo_id
                     AND p.stato_doc_preventivo_id = v_stato_accettato_id;

                  IF NOT FOUND THEN
                      -- Preventivo inesistente o non ACCETTATO: stesso errore parlante.
                      --
                      -- ⭐ IL BERSAGLIO, e qui va SUL PREVENTIVO: a differenza dei guard di
                      --    idempotenza dell'offerta, la cosa da raggiungere e' proprio il
                      --    documento nominato — l'operatore deve andarci per accettarlo.
                      --
                      -- ⭐ E SI CITA PER UID, non per id. E' il primo uso reale di
                      --    config.tipi_entita.key_selector: il preventivo, come l'offerta,
                      --    il progetto lo indirizza da fuori con l'uid (la stessa scelta di
                      --    config.sorgenti). Mandare l'id numerico avrebbe prodotto un
                      --    pulsante che non apre niente.
                      --
                      -- ⛔ E SOLO SE ESISTE. Questo errore copre due casi — «non c'e'» e
                      --    «c'e' ma non e' ACCETTATO» — e solo il secondo ha un posto dove
                      --    mandare qualcuno. Se il preventivo non esiste (o non e' visibile,
                      --    che per chi opera e' la stessa cosa) il messaggio si mostra lo
                      --    stesso e il pulsante non compare: il bersaglio e' un'offerta, non
                      --    una promessa.
                      --
                      -- ⚠️ La lettura e' SENZA il filtro di stato — quello di sopra ha appena
                      --    fallito proprio per lo stato: rimetterlo qui darebbe sempre NULL.
                      -- ⚠️ L'ID, non l'uid — correzione del 2026-08-24 su rilievo del backend.
                      --    Al primo giro qui c'era `pv.uid::text`, ereditato da
                      --    `config.sorgenti.key_selector`. Misurato: le rotte del preventivo
                      --    sono `<int:preventivo_id>` e gli endpoint che accettano un uid
                      --    sono ZERO — quel bersaglio avrebbe prodotto un pulsante che non
                      --    apre niente.
                      --    ⭐ Le due colonne si chiamano uguale e rispondono a domande
                      --    diverse: `config.sorgenti` dice con quale chiave il LINEAGE
                      --    collega il documento, `config.tipi_entita` con quale chiave lo si
                      --    RAGGIUNGE. Il valore si misura sulle rotte, non si eredita.
                      SELECT jsonb_build_array(jsonb_build_object('tipo', 'PREVENTIVO',
                                                                  'id',   pv.id::text))
                        INTO v_bersagli
                        FROM vendite.preventivi pv
                       WHERE pv.id = p_preventivo_id;

                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine',
                          'E_VENDITA_PREVENTIVO_PUSH_STATO_NON_AMMESSO',
                          -- ⚠️ La chiave si aggiunge solo se c'e' qualcosa da dire: una
                          --    chiave a NULL sarebbe letta come bersaglio malformato.
                          jsonb_build_object('preventivo_id', p_preventivo_id)
                          || CASE WHEN v_bersagli IS NULL THEN '{}'::jsonb
                                  ELSE jsonb_build_object('bersaglio', v_bersagli) END,
                          NULL::uuid, p_preventivo_id::text);
                  END IF;

                  -- Cliente (soggetto_ruolo) dal billing_account; emittente soggetto_ruolo
                  -- per l'init componenti BoM.
                  SELECT soggetto_ruolo_id INTO v_soggetto_ruolo_id
                    FROM anagrafiche.billing_account WHERE id = v_ba_id;
                  SELECT soggetto_ruolo_id INTO v_emittente_sr_id
                    FROM anagrafiche.emittenti_fiscali WHERE id = v_emittente_fiscale_id;

                  SELECT id INTO v_stato_draft_ord_id
                    FROM config.stati_doc_ordini
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE;

                  v_fatt_trigger := p_fatturazione_trigger;   -- NULL = «non scelto» -> eredita dal BA (trgfn_ordini_normalize)

                  -- 3) Conta le righe RESIDUE da smistare a ORDINE leggendo la
                  --    vista-predicato unica (MERCE + ATTIVA + non gia' allocata),
                  --    ristretta al sottoinsieme richiesto (D5 idempotenza di riga).
                  SELECT count(*) INTO v_n_residue
                    FROM vendite.vw_preventivi_righe_smistabili_ordine v
                   WHERE v.preventivo_id = p_preventivo_id
                     AND (p_righe_ids IS NULL OR v.id = ANY(p_righe_ids));

                  IF v_n_residue = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine',
                          'E_VENDITA_PREVENTIVO_NESSUNA_RIGA_ORDINE',
                          jsonb_build_object('preventivo_id', p_preventivo_id,
                                             'righe_ids', to_jsonb(p_righe_ids)),
                          NULL::uuid, p_preventivo_id::text);
                  END IF;

                  -- 4) Testata ordine: DRAFT, documento_origine = (PREVENTIVO, id).
                  --    numero/serie/anno li genera il trigger trgfn_ordini_gen_numero
                  --    (motore dei registri, 20260831-*; fino al 2026-09-13 qui c'era il
                  --    nome morto trgfn_ordini_gen_codice — brief prefisso-sul-registro 6.3).
                  INSERT INTO vendite.ordini (
                      soggetto_ruolo_id, billing_account_id, utility_id, valuta_id,
                      termine_pagamento_id, emittente_fiscale_id, data,
                      stato_doc_ordine_id, fatturazione_trigger,
                      documento_origine_tipo, documento_origine_id)
                  VALUES (
                      v_soggetto_ruolo_id, v_ba_id, v_utility_id, v_valuta_id,
                      v_termine_pag_id, v_emittente_fiscale_id, v_data,
                      v_stato_draft_ord_id, v_fatt_trigger,
                      'PREVENTIVO', p_preventivo_id)
                  RETURNING id INTO v_ordine_id;

                  -- 4-bis) Cascata indirizzi (D-1): copia 1:1 gli snapshot del
                  --   preventivo filtrati sui tipi ammessi in ambito ORDINI.
                  --   origine_* propagati; idempotente (uno-per-tipo).
                  INSERT INTO vendite.ordini_indirizzi (
                      ordine_id, tipo_indirizzo_id, snapshot,
                      origine_indirizzo_id, origine_soggetto_ruolo_id)
                  SELECT v_ordine_id, pi.tipo_indirizzo_id, pi.snapshot,
                         pi.origine_indirizzo_id, pi.origine_soggetto_ruolo_id
                    FROM vendite.preventivi_indirizzi pi
                    JOIN config.tipi_indirizzi_allowed a
                      ON a.tipo_indirizzo_id = pi.tipo_indirizzo_id
                     AND a.ambito = 'ORDINI'
                     AND a.attivo IS TRUE
                   WHERE pi.preventivo_id = p_preventivo_id
                  ON CONFLICT (ordine_id, tipo_indirizzo_id) DO NOTHING;

                  -- 5) Copia le righe residue (snapshot prezzi) dalla vista-predicato.
                  --    La INNER JOIN a catalogo.articoli e' PROIEZIONE: serve
                  --    is_composito e, come oggi, scarta righe senza articolo.
                  --    riga_nr progressivo; quantita derivata dal trigger
                  --    qta_from_operativa; link di riga preventivo_riga_id (idempotenza).
                  FOR v_riga IN
                      SELECT v.id AS riga_id, v.articolo_id, v.descrizione,
                             v.prezzo_unitario, v.sconto_percentuale, v.iva_id,
                             v.qta_operativa, v.uom_operativa_id, v.factor_to_base,
                             -- rev 2026-09-13 (P-5): la data chiesta dal cliente sulla riga di
                             -- preventivo, esposta dalla vista in 20260913-16. Si porta avanti
                             -- qui, nel punto in cui il documento cambia natura, o si perde.
                             v.data_consegna_richiesta_cliente,
                             a.is_composito,
                             row_number() OVER (ORDER BY v.ordine NULLS LAST, v.id) AS rn
                        FROM vendite.vw_preventivi_righe_smistabili_ordine v
                        JOIN catalogo.articoli a ON a.id = v.articolo_id
                       WHERE v.preventivo_id = p_preventivo_id
                         AND (p_righe_ids IS NULL OR v.id = ANY(p_righe_ids))
                       ORDER BY rn
                  LOOP
                      INSERT INTO vendite.ordini_righe (
                          ordine_id, riga_nr, articolo_id, descrizione,
                          prezzo_unitario, sconto_percentuale, iva_id,
                          qta_operativa, uom_operativa_id, factor_to_base,
                          stato_doc_ordine_id, preventivo_riga_id,
                          data_consegna_richiesta_cliente)
                      VALUES (
                          v_ordine_id, v_riga.rn::integer, v_riga.articolo_id,
                          COALESCE(v_riga.descrizione,
                                   (SELECT descrizione FROM catalogo.articoli
                                     WHERE id = v_riga.articolo_id)),
                          -- Padre composito: 0 placeholder, il prezzo lo ricalcola
                          -- il trigger dai componenti inizializzati sotto.
                          CASE WHEN v_riga.is_composito THEN 0 ELSE v_riga.prezzo_unitario END,
                          COALESCE(v_riga.sconto_percentuale, 0), v_riga.iva_id,
                          v_riga.qta_operativa, v_riga.uom_operativa_id,
                          COALESCE(v_riga.factor_to_base, 1),
                          v_stato_draft_ord_id, v_riga.riga_id,
                          -- La richiesta del cliente si copia; la conferma (nostra) resta
                          -- NULL: su un preventivo non c'e' ancora niente da confermare.
                          v_riga.data_consegna_richiesta_cliente)
                      RETURNING id INTO v_new_riga_id;

                      -- 6) BoM CASO A: prezzi snapshot del preventivo come override
                      --    (no ri-prezzatura). Stesso pattern del push offerta->ordine.
                      IF v_riga.is_composito THEN
                          SELECT jsonb_object_agg(prc.componente_id::text, prc.prezzo_unitario)
                            INTO v_overrides
                            FROM vendite.preventivi_righe_componenti prc
                           WHERE prc.riga_preventivo_id = v_riga.riga_id
                             AND COALESCE(prc.attivo, TRUE) IS TRUE
                             AND prc.prezzo_unitario <> 0;

                          PERFORM vendite.fn_ordine_riga_componenti_init(
                              v_new_riga_id, v_emittente_sr_id, v_data, v_overrides);
                      END IF;
                  END LOOP;

                  -- 7) Aggancio pratica (D4, solo se la pratica esiste):
                  --    preventivo ROOT + ordine COLLEGATO. Idempotente.
                  --    D-B: il link COLLEGATO valorizza flusso_id (p_flusso_id) =
                  --    flusso dello step generatore; NULL retro-compatibile.
                  IF p_pratica_id IS NOT NULL THEN
                      SELECT id INTO v_sorg_prev_id FROM config.sorgenti
                       WHERE codice_interno = 'PREVENTIVO';
                      SELECT id INTO v_sorg_ord_id FROM config.sorgenti
                       WHERE codice_interno = 'ORDINE_VENDITA';

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id, sorgente_tipo_id, sorgente_uid, ruolo_link)
                      VALUES (p_pratica_id, v_sorg_prev_id, v_preventivo_uid::text, 'ROOT')
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id, sorgente_tipo_id, sorgente_uid, ruolo_link, flusso_id)
                      VALUES (p_pratica_id, v_sorg_ord_id, v_ordine_id::text, 'COLLEGATO', p_flusso_id)
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;
                  END IF;

                  -- 8) Lo stato del preventivo dal suo smistamento (atomico con la
                  --    creazione dell'ordine, finding #10): ACCETTATO senza residuo su
                  --    nessuna strada -> EVASO. rev 2026-10-12 (20261012-13): la regola
                  --    non e' piu' scritta qui ma nel BB
                  --    vendite.fn_preventivo_proietta_stato_smistamento, la sede unica che
                  --    leggono anche l'annullo dell'ordine e l'invio in commessa
                  --    (brief-db-annullo-a-valle-riapre-a-monte, D-10).
                  PERFORM vendite.fn_preventivo_proietta_stato_smistamento(p_preventivo_id);

                  RETURN v_ordine_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_push_preventivo_a_ordine(vendite.preventivi.id%TYPE, bigint[], pratiche.pratiche.id%TYPE, vendite.ordini.fatturazione_trigger%TYPE, pratiche.flussi.id%TYPE) IS
                  'Push preventivo ACCETTATO -> ordine DRAFT (testata + righe + BoM). Aggancio pratica opzionale (ROOT preventivo + COLLEGATO ordine con flusso_id, D-B). Sezione 8: gate EVASO bi-ramo atomico (finding #10 analisi-fix-transazioni): niente piu'' ordine creato + preventivo bloccato in ACCETTATO. p_flusso_id DEFAULT NULL retro-compatibile. rev 2026-08-17: p_fatturazione_trigger NON viene piu'' portato a ''CONFERMATO'' con un COALESCE locale — passa in testata cosi'' com''e'', NULL compreso, e la risoluzione (testata -> billing_account -> CONFERMATO) sta in un posto solo, vendite.trgfn_ordini_normalize. Prima questa funzione raccoglieva il parametro e quel trigger lo sovrascriveva un istante dopo: il parametro era inerte (segnalazione BE 2026-08-16; brief-be-fan-out-isolato-e-esito-parziale.md §13.2, brief-design-fatturazione-due-lenti.md §6-quater DL-19). ⭐ rev 2026-08-24: il rifiuto porta il BERSAGLIO sul preventivo, e lo cita per ID — primo uso reale di config.tipi_entita.key_selector: il progetto indirizza preventivi e offerte con l''uid (come dichiara config.sorgenti), e mandare l''id numerico avrebbe prodotto un pulsante che non apre niente. ⛔ Solo se il preventivo ESISTE: questo errore copre due casi — «non c''e''» e «c''e'' ma non e'' ACCETTATO» — e solo il secondo ha un posto dove mandare qualcuno; se non esiste, il messaggio si mostra lo stesso e il pulsante non compare. ⚠️ La lettura dell''uid e'' senza filtro di stato: quello di sopra ha appena fallito proprio per lo stato. Brief: brief-db-bersaglio-errore.md §6 L6. ⚠️ rev 2026-08-24 (correzione): il bersaglio cita l''ID e non piu'' l''uid. Rilievo del backend, misurato: le rotte del preventivo sono <int:preventivo_id> e gli endpoint che accettano un uid sono zero — un bersaglio a uid avrebbe prodotto un pulsante che non apre niente, cioe'' esattamente il difetto che config.tipi_entita.key_selector esiste per evitare. ⭐ La lezione: quella colonna dice con quale chiave si RAGGIUNGE l''entita'', e il valore si misura sulle ROTTE; config.sorgenti.key_selector dice un''altra cosa (con quale chiave il lineage collega il documento) e non si eredita. ⭐ rev 2026-09-13 (P-5, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 2.4): porta avanti data_consegna_richiesta_cliente dalla riga di preventivo alla riga d''ordine, leggendola dalla vista-predicato vw_preventivi_righe_smistabili_ordine (20260913-16) e non con un JOIN suo, che sarebbe una seconda sede della stessa lista di righe. Senza, la data si perdeva nel punto in cui il documento cambia natura, cioe'' dove gli utenti smetterebbero di fidarsene. data_consegna_confermata resta NULL: e'' la promessa nostra e si decide alla conferma dell''ordine. Tolto il nome morto trgfn_ordini_gen_codice dal commento del passo 4 (era dichiarato «alla prossima occasione» nel brief prefisso-sul-registro 6.3): il numero lo assegna trgfn_ordini_gen_numero dal motore dei registri. ⚠️ rev 2026-09-14: nessun cambio di comportamento — la FIRMA torna ANCORATA (%TYPE su preventivi.id, pratiche.pratiche.id, ordini.fatturazione_trigger, pratiche.flussi.id, RETURNS ordini.id) com''era in 20260824-02: 20260824-10 e 20260913-20 l''avevano ricopiata sciolta dal corpo vivo di pg_get_functiondef, che scioglie i %TYPE al CREATE. Identita'' byte-identica, nessun overload. ⭐ rev 2026-10-12 (20261012-13, brief-db-annullo-a-valle-riapre-a-monte D-10): la sezione 8 non scrive piu'' la regola EVASO: chiama il BB vendite.fn_preventivo_proietta_stato_smistamento, la sede unica di ACCETTATO <-> EVASO, che leggono anche l''annullo dell''ordine (vendite.fn_documento_ritira_legami) e l''invio in commessa (trigger sulle righe di commessa). Comportamento invariato su questo percorso; firma invariata.';
