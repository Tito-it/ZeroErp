# L'EMISSIONE DELLA BOLLA SOLLEVA I MOTIVI SUGLI ONERI — vendite.trgfn_ddt_guard_causale_emissione
#   Brief: brief-db-addebito-trasporto-ordine §8.3, K-2, K-7, K-8 (decisioni
#   di Tid del 2026-11-03).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   script.fn_check_ddt_emittibile e' pura: elenca i motivi. Chi li SOLLEVA
#   all'emissione sono i guard di emissione, ognuno coi suoi codici, e il
#   LOOP di questo non ha un ELSE (scelta scritta nel corpo). I due motivi
#   nuovi del 20261103-41 senza un ramo qui sarebbero solo un bottone spento
#   in bozza: un UPDATE fuori dalla capability li passerebbe.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · ramo E_DDT_EMISSIONE_SOLO_ONERI (VARIADIC: documento);
#   · ramo E_DDT_ONERE_NON_FATTURABILE (VARIADIC: documento, numero di riga;
#     context con riga_id e riga_nr).
#   Qui e non nel guard di transizione (che solleva E_DDT_EMISSIONE_SENZA_RIGHE):
#   questo e' il gate del valore della riga, e il suo LOOP per codice cresce
#   cosi' per costruzione.
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   I rami esistenti e il loro ordine. Il guard solleva il PRIMO motivo che
#   riconosce, nell'ordine della check (1-bis prima della causale, 3-ter dopo
#   l'aliquota): lo stesso che la capability mostra come primo, salvo i motivi
#   che un guard precedente per nome (a10_guard_approvazione) solleva prima —
#   comportamento di oggi, invariato. Codici nuovi registrati dal coordinatore
#   (CSV, id 1429-1430).
#
#   Corpo dal vivo (doc auto-gen, identico al 20261009-77, confrontato il
#   2026-11-03); dichiarazione dall'ultimo YAML. COMMENT in un change suo.
#   Dipende da: 20261103-41.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261103-42-update-trgfn-ddt-guard-causale-emissione-oneri-mctit.yaml

  - changeSet:
      id: 20261103-42-update-trgfn-ddt-guard-causale-emissione-oneri
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_ddt_guard_causale_emissione: solleva E_DDT_EMISSIONE_SOLO_ONERI e
        E_DDT_ONERE_NON_FATTURABILE, i due motivi nuovi di script.fn_check_ddt_emittibile.
        brief-db-addebito-trasporto-ordine §8.3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_causale_emissione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: gate all'emissione (EMESSO) di un DDT sul VALORE DELLA
              --   RIGA, in tre facce (brief-db-fatturazione-ddt-resi §4a, DL-28):
              --     1. la causale di trasporto e' dichiarata;
              --     2. se e' fatturabile, ogni riga attiva ha un prezzo
              --        risolvibile (proprio o ereditato dalla riga d'ordine);
              --     3. ogni riga attiva CHE PORTA UN PREZZO ha anche l'aliquota.
              --   rev 2026-07-19: valutazione delegata a
              --   script.fn_check_ddt_emittibile — single source con la capability.
              --   rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C):
              --   + E_DDT_RIGA_IVA_MANCANTE.
              --   rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2):
              --   + E_DDT_CLIENTE_OBBLIGATORIO (la causale vuole un cliente e il
              --   billing account manca).
              --   rev 2026-11-03 (20261103-42, brief-db-addebito-trasporto-ordine §8.3):
              --   + E_DDT_EMISSIONE_SOLO_ONERI (righe, ma nessuna di merce: K-2) e
              --   + E_DDT_ONERE_NON_FATTURABILE (un onere che non verrebbe mai
              --   fatturato: causale non fatturabile, o onere senza legame su una bolla
              --   di un ordine che fattura alla conferma).
              --
              -- ⚠️ IL NOME NOMINA LA SOLA CAUSALE, ed e' rimasto quello di quando
              --   il motivo era uno. Non si rinomina — costerebbe il trigger, ogni
              --   doc auto-gen e ogni pgTAP che la citano, per sola leggibilita' —
              --   ma chi legge non deve dedurlo: e' scritto qui.
              --
              -- ⚠️ Il LOOP non ha un ELSE: i motivi che questa funzione non
              --   riconosce li solleva un altro dei quattro guard di emissione. Un
              --   catch-all qui farebbe sollevare a QUESTO trigger anche gli
              --   indirizzi mancanti, con l'area e il nome sbagliati nel log.
              DECLARE
                  v_stato_codice  config.stati_doc_ddt.codice_interno%TYPE;
                  v_motivo        jsonb;
              BEGIN
                  SELECT sdd.codice_interno INTO v_stato_codice
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;

                  IF v_stato_codice IS DISTINCT FROM 'EMESSO' THEN
                      RETURN NEW;
                  END IF;

                  FOR v_motivo IN
                      SELECT jsonb_array_elements(script.fn_check_ddt_emittibile(NEW))
                  LOOP
                      IF v_motivo->>'codice' = 'E_DDT_CAUSALE_OBBLIGATORIA' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_CAUSALE_OBBLIGATORIA',
                              jsonb_build_object(
                                  'ddt_id', NEW.id,
                                  'numero', NEW.numero),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text)
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_CLIENTE_OBBLIGATORIO' THEN
                          -- rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2): la
                          --   causale manda merce a un cliente e il billing account
                          --   manca. Nel VARIADIC il documento e il CODICE della causale
                          --   (la cosa che l'operatore ha scelto e riconosce); il campo
                          --   da accendere e' il billing account — ma il codice e'
                          --   CONFLITTO_STATO come i fratelli: la richiesta e' «emetti».
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_CLIENTE_OBBLIGATORIO',
                              jsonb_build_object(
                                  'ddt_id',  NEW.id,
                                  'numero',  NEW.numero,
                                  'causale', v_motivo->'dettaglio'->>'causale'),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'causale', '?')
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_PREZZO_NON_RISOLVIBILE' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_PREZZO_NON_RISOLVIBILE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_id', 'NULL')
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_RIGA_IVA_MANCANTE' THEN
                          -- ⚠️ Nel VARIADIC va il NUMERO di riga, non l'id: quel
                          --   valore riempie i %s, cioe' compone la frase che una
                          --   persona legge, e un id tecnico non si cerca a mano
                          --   sul documento. L'id viaggia nel context, che e' il
                          --   canale di chi diagnostica.
                          -- ⛔ E nessuna chiave `campo`: il codice e'
                          --   CONFLITTO_STATO, non DATO_ERRATO — la richiesta e'
                          --   «porta il DDT a EMESSO», e non c'e' un campo di
                          --   QUELLA richiesta da accendere.
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_RIGA_IVA_MANCANTE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint,
                                  'riga_nr',  (v_motivo->'dettaglio'->>'riga_nr')::integer),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_nr', '?')
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_EMISSIONE_SOLO_ONERI' THEN
                          -- rev 2026-11-03 (K-2): la bolla ha righe, ma nessuna di merce.
                          --   VARIADIC: il documento. CONFLITTO_STATO come i fratelli: la
                          --   richiesta e' «emetti», nessun campo da accendere.
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_EMISSIONE_SOLO_ONERI',
                              jsonb_build_object(
                                  'ddt_id', NEW.id,
                                  'numero', NEW.numero),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text)
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_ONERE_NON_FATTURABILE' THEN
                          -- rev 2026-11-03 (§8.3, K-7/K-8): la riga-onere che non verrebbe
                          --   mai fatturata. VARIADIC: documento e NUMERO di riga (la frase
                          --   la legge una persona); l'id resta nel context.
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_ONERE_NON_FATTURABILE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint,
                                  'riga_nr',  (v_motivo->'dettaglio'->>'riga_nr')::integer),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_nr', '?')
                          );
                      END IF;
                  END LOOP;

                  RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_causale_emissione() IS
                'Gate all''emissione DDT sul VALORE DELLA RIGA (brief-db-fatturazione-ddt-resi §4a, DL-28), in tre facce: (1) causale di trasporto obbligatoria — in DRAFT il NULL resta legittimo; (2) se la causale e'' fatturabile, ogni riga attiva deve avere un prezzo risolvibile (proprio o ereditato dalla riga ordine via fulfillment); (3) ogni riga attiva CHE PORTA UN PREZZO deve avere anche l''aliquota. rev 2026-07-19: valutazione delegata a script.fn_check_ddt_emittibile (single source con fn_available_actions_ddt); codici errore e argomenti invariati (544/545). ⭐ rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter): + E_DDT_RIGA_IVA_MANCANTE. Si e'' esteso questo guard invece di crearne uno nuovo perche'' e'' gia'' il gate del valore della riga e il LOOP con ELSIF per codice e'' fatto per crescere cosi''. ⚠️ Nel VARIADIC del codice nuovo va il NUMERO di riga e non l''id: quel valore compone la frase che legge una persona, e un id tecnico non si cerca a mano; l''id resta nel context. ⚠️ Il nome nomina la sola causale ed e'' rimasto quello di quando il motivo era uno: non si rinomina (costerebbe trigger, doc auto-gen e pgTAP per sola leggibilita''), ma lo Scopo nel corpo lo dichiara. rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2/D-2-bis): + E_DDT_CLIENTE_OBBLIGATORIO, la causale manda merce a un cliente (config.causali_trasporto.richiede_cliente) e la bolla non ha il billing account; VARIADIC: documento e codice della causale. ⭐ Rev 2026-11-03 (20261103-42, brief-db-addebito-trasporto-ordine §8.3, K-2/K-7/K-8): solleva i due motivi nuovi di script.fn_check_ddt_emittibile sugli oneri di bolla — E_DDT_EMISSIONE_SOLO_ONERI (righe attive, nessuna di merce; VARIADIC: documento) e E_DDT_ONERE_NON_FATTURABILE (un onere che non verrebbe mai fatturato: causale non fatturabile, anche se copiato, o onere senza legame su una bolla il cui ordine sorgente di testata fattura alla conferma; VARIADIC: documento e numero di riga). Qui e non in trgfn_ddt_guard_transizione: e'' il gate del valore della riga, e il LOOP per codice e'' fatto per crescere cosi''. CONFLITTO_STATO come i fratelli.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente (senza i due rami sugli oneri) e' nella doc auto-gen
              -- alla revisione prima di questa. Non si riscrive un corpo stantio.
              SELECT 1;
