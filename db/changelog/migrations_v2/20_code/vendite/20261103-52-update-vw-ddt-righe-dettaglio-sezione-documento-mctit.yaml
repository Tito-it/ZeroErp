# LA SEZIONE DEL DOCUMENTO SULLE RIGHE DI BOLLA — vendite.vw_ddt_righe_dettaglio
#   Brief: brief-db-addebito-trasporto-ordine §9.8 (richiesta BE, 2026-11-03).
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   In coda sezione_documento smallint: 1 articoli, 2 oneri (lo stesso
#   predicato di e_onere). L'ordine del documento e' sezione_documento,
#   riga_nr, gemello di ordine (-51) e fattura (-50).
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   Il resto, riga per riga. Corpo dal 20261103-34 (applicato, = vivo);
#   security_invoker e COMMENT ON COLUMN ripetuti come li ripete il -34.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261103-52-update-vw-ddt-righe-dettaglio-sezione-documento-mctit.yaml

  - changeSet:
      id: 20261103-52-update-vw-ddt-righe-dettaglio-sezione-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_ddt_righe_dettaglio: in coda sezione_documento (1 articoli, 2 oneri), la prima chiave dell'ordine del documento:
        gli oneri dopo gli articoli, decisione del DB. brief-db-addebito-trasporto-ordine §9.8.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_ddt_righe_dettaglio
              WITH (security_invoker=true) AS
              SELECT r.id,
                  r.ddt_id,
                  r.riga_nr,
                  r.attivo,
                  r.articolo_id,
                  a.codice AS articolo_codice,
                  a.descrizione AS articolo_descrizione,
                  r.descrizione,
                  r.quantita,
                  r.qta_operativa,
                  r.factor_to_base,
                  r.uom_operativa_id,
                  um.codice AS uom_codice,
                  r.prezzo_unitario,
                  r.sconto_percentuale,
                  r.iva_id,
                  iva.codice AS iva_codice,
                  iva.descrizione AS iva_descrizione,
                  iva.aliquota_iva AS iva_aliquota,
                  round(script.fn_imponibile_riga(r.quantita, r.prezzo_unitario, r.sconto_percentuale), 2) AS importo_riga,
                  script.fn_imponibile_riga(r.quantita, r.prezzo_unitario, r.sconto_percentuale) AS imponibile_riga_full,
                  r.meta,
                  r.data_insert,
                  r.data_update,
                  (EXISTS ( SELECT 1
                         FROM vendite.ddt_righe_componenti rc
                        WHERE rc.riga_ddt_id = r.id AND rc.attivo IS TRUE)) AS is_composito_caso_a,
                  vendite.fn_ddt_riga_evasa(r.id) AS evasa,
                  (script.fn_check_ddt_riga_correggi_qta_evasa(r.id) -> 0) ->> 'reason'::text AS correggi_qta_evasa_blocco,
                  -- rev 2026-11-03 (20261103-34): in coda, la riga-onere e la sua causale.
                  NOT script.fn_natura_e_merce(r.natura_vendita_id) AS e_onere,
                  a.causale_onere_id,
                  -- rev 2026-11-03 (20261103-52): la sezione del documento, prima
                  --   chiave dell'ordine (sezione_documento, riga_nr): oneri in fondo.
                  (CASE WHEN script.fn_natura_e_merce(r.natura_vendita_id) IS FALSE THEN 2 ELSE 1 END)::smallint AS sezione_documento
                 FROM vendite.ddt_righe r
                   LEFT JOIN catalogo.articoli a ON a.id = r.articolo_id
                   LEFT JOIN catalogo.unita_misura um ON um.id = r.uom_operativa_id
                   LEFT JOIN config.iva iva ON iva.id = r.iva_id;

              COMMENT ON VIEW vendite.vw_ddt_righe_dettaglio IS
                  'Righe del DDT con articolo, UoM e IVA: la SORGENTE delle righe per la lista configurabile vendite.ddt_righe e per il repository (brief-db-liste-righe-documento, D-8.6, 2026-09-28; prima esistevano solo come due query Python con proiezioni diverse). Tutte le righe, anche le non attive: il filtro lo mette chi legge. Nessun ORDER BY. importo_riga = round(…, 2) per mostrare, imponibile_riga_full pieno per chi aggrega, entrambi da script.fn_imponibile_riga: NULL sulla riga senza prezzo (DDT di solo trasporto), mai uno zero finto (V-2/DEC-6). security_invoker: ddt_righe e'' in RLS. Rev 2026-10-11 (20261011-19): evasa e correggi_qta_evasa_blocco. Rev 2026-11-03 (20261103-34, brief-db-addebito-trasporto-ordine §7.3, §8.1, decisione 9 di Tid): gli oneri diventano righe della bolla; in coda e_onere (la riga e'' un onere: NOT script.fn_natura_e_merce sulla natura congelata) e causale_onere_id (dall''articolo), perche'' il BE in stampa metta gli oneri dopo gli articoli senza ricostruire la regola. evasa resta il predicato del guard (un onere copiato dall''ordine e'' evaso: la sua quantita'' e'' ferma); il blocco della correzione dice RIGA_ONERE. Rev 2026-11-03 (20261103-52, brief-db-addebito-trasporto-ordine §9.8): in coda sezione_documento smallint (1 articoli, 2 oneri, da e_onere): l''ordine del documento e'' sezione_documento, riga_nr, cosi'' lista e stampa mettono gli oneri dopo gli articoli e la regola sta nel DB. Gemella di vw_fattura_righe_lista.';
              COMMENT ON COLUMN vendite.vw_ddt_righe_dettaglio.evasa IS
                  'TRUE se la riga porta un legame con una riga d''ordine o con una riga di reso da ri-consegnare (vendite.fn_ddt_riga_evasa, lo stesso predicato del guard): articolo, UoM e quantita'' sono fermi, la quantita'' si corregge col verbo vendite.fn_ddt_riga_correggi_qta_evasa. Brief: brief-db-ddt-righe-evase-dall-ordine. Un onere copiato dall''ordine e'' evaso (porta il legame) ma la sua quantita'' non si corregge: correggi_qta_evasa_blocco = RIGA_ONERE (rev 2026-11-03).';
              COMMENT ON COLUMN vendite.vw_ddt_righe_dettaglio.correggi_qta_evasa_blocco IS
                  'Il reason del primo motivo per cui la quantita'' evasa NON si corregge ora (script.fn_check_ddt_riga_correggi_qta_evasa): DDT_NON_IN_BOZZA, RIGA_ONERE (rev 2026-11-03), RIGA_NON_EVASA, DDT_SENZA_ORIGINE, LEGAMI_MULTIPLI. NULL = azione ammessa. reason_key vendite.ddt.correggi_qta_evasa_reason.<reason minuscolo>.';
              COMMENT ON COLUMN vendite.vw_ddt_righe_dettaglio.e_onere IS
                  'TRUE se la riga e'' un onere (trasporto, spese…), FALSE se e'' merce: NOT script.fn_natura_e_merce sulla natura CONGELATA della riga. Su bolla «non merce» = onere, perche'' l''ammissione lascia entrare solo merce e articoli-onere. Serve alla stampa (oneri dopo gli articoli, §7.3) e alla maschera. rev 2026-11-03, brief-db-addebito-trasporto-ordine.';
              COMMENT ON COLUMN vendite.vw_ddt_righe_dettaglio.causale_onere_id IS
                  'La causale dell''onere (config.causali_onere), letta dall''articolo; NULL sulla merce. rev 2026-11-03, brief-db-addebito-trasporto-ordine.';

              COMMENT ON COLUMN vendite.vw_ddt_righe_dettaglio.sezione_documento IS
                'Sezione del documento: 1 articoli, 2 oneri (e_onere). Prima chiave dell''ordine del documento (sezione_documento, riga_nr): gli oneri dopo gli articoli, a video e in stampa. Rev 2026-11-03, brief-db-addebito-trasporto-ordine §9.8.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Una vista non perde colonne con CREATE OR REPLACE: il ritorno indietro e'
              -- un DROP + CREATE dal changeSet precedente, da fare a mano se servisse.
              SELECT 1;
