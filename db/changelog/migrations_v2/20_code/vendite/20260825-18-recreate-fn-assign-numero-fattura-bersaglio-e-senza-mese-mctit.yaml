# DB-8 (chiamante) + DB-12 — DUE MODIFICHE IN UN SOLO DROP
#   vendite.fn_assign_numero_fattura — DROP + CREATE
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md
#          §4 DB-8 e DB-12 · decisione D-4 di Tid (2026-08-25): i due recreate si FONDONO
#
# ── LE DUE COSE ─────────────────────────────────────────────────────
#   1. **passa `p_fattura_id` a `fn_get_next_progressivo`** (DB-8). Senza, il
#      cancello di monotonia solleva senza il primo bersaglio, e dentro un giro
#      di lotto su molte fatture nessuno direbbe piu' QUALE ha rifiutato: la
#      frase porta solo la data del pavimento.
#   2. **`mese` esce dal `RETURNS TABLE`** (DB-12), e con lui l'ultima lettura di
#      `reset_policy` in questa funzione.
#
#   ⭐ Fuse in un `DROP + CREATE` solo perche' il secondo lo richiedeva comunque:
#   tenerle separate avrebbe voluto dire riscrivere la stessa funzione due volte
#   nello stesso giorno.
#
# ── ⛔ QUESTO FILE VA DOPO IL 17 ────────────────────────────────────
#   `fn_numera_fattura_opz_emessa` chiama questa. Se `mese` sparisse di qui
#   PRIMA che quella smetta di chiederlo, ci sarebbe un momento in cui fa
#   `SELECT t.mese FROM fn_assign_numero_fattura(...) t` su una colonna che non
#   esiste: errore a runtime. Nell'ordine giusto — prima la chiamante (17), poi
#   la chiamata (18) — non c'e' nessuna finestra rotta.
#
# ── ⛔ IL JOIN SUL REGISTRO RESTA ───────────────────────────────────
#   Al contrario del 17. Li' serviva solo a `reset_policy`; qui porta anche
#   `r.serie_default`, che entra nel `COALESCE(f.serie, r.serie_default, '')` —
#   cioe' e' il punto in cui la SERIE di un documento si risolve davvero.
#   ⚠️ Ed e' la stessa risoluzione che devono usare
#   `fn_get_data_minima_numerabile` e il backfill: se una delle tre diverge,
#   cerca una riga di contatore che non esiste e risponde «nessun vincolo».
#
# ── ⛔ COSA NON E' CAMBIATO ─────────────────────────────────────────
#   Il guard D3 (niente righe) e tutto il guard D-K con le sue SETTE condizioni,
#   ripresi dal corpo vivo del 2026-08-24 via doc auto-gen: totali non
#   calcolati, riepilogo IVA assente, piano rate assente o non quadrato, rate su
#   totale non positivo, riepiloghi non coerenti coi totali di testata,
#   `totale_a_pagare` che non deriva dai suoi addendi, e il SEGNO
#   (`natura = NOTA_CREDITO <=> totale_a_pagare <= 0`).
#   ⚠️ Resta anche il `array_append` invece di `|| 'testo'`: con un letterale non
#   tipizzato PostgreSQL prova a leggerlo come letterale di ARRAY.
#
# ── ℹ️ IL GUARD D-K RESTA PRIMA DEL PROGRESSIVO ─────────────────────
#   E adesso ci sono DUE cose prima del numero: il D-K (il documento merita un
#   numero?) e il cancello di monotonia dentro `fn_get_next_progressivo` (la
#   data puo' stare in fondo alla sequenza?). Il secondo e' sotto l'advisory
#   lock, il primo no — e va bene: il D-K guarda la fattura, non la sequenza.
#
# Dipendenze: 20260825-11 (la firma a quattro parametri di fn_get_next_progressivo),
#             20260825-17 (che deve essere gia' passato).
# Verifica: db/pgtap/vendite/test-numerazione-guard-coerenza-v1.sql (invariato: legge
#           per nome e non nomina mai `mese`)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260825-18-recreate-fn-assign-numero-fattura-bersaglio-e-senza-mese-mctit.yaml

  - changeSet:
      id: 20260825-18-recreate-fn-assign-numero-fattura-bersaglio-e-senza-mese
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Due modifiche in un solo DROP + CREATE (decisione D-4): la funzione passa p_fattura_id
        a fn_get_next_progressivo — senza, il cancello di monotonia solleva senza il primo
        bersaglio e dentro un giro di lotto nessuno direbbe piu' QUALE fattura ha rifiutato —
        e `mese` esce dal RETURNS TABLE, con l'ultima lettura di reset_policy. ⛔ Va DOPO il
        20260825-17: fn_numera_fattura_opz_emessa chiama questa, e se mese sparisse prima che
        quella smetta di chiederlo sarebbe un errore a runtime. ⛔ Il JOIN sul registro RESTA,
        al contrario del 17: qui porta serie_default, cioe' il punto in cui la SERIE di un
        documento si risolve davvero — la stessa risoluzione che devono usare
        fn_get_data_minima_numerabile e il backfill. Guard D3 e D-K (sette condizioni)
        invariati.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_get_next_progressivo'
                     AND pg_get_function_identity_arguments(p.oid) LIKE '%p_fattura_id%';
            - sqlCheck:
                expectedResult: 0
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_numera_fattura_opz_emessa'
                     AND pg_get_function_result(p.oid) LIKE '%mese%';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_assign_numero_fattura(bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_assign_numero_fattura(
                  p_fattura_id vendite.fatture.id%TYPE
              )
               RETURNS TABLE(registro_id bigint, anno smallint, serie character varying, numero bigint)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_registro_id vendite.fatture.registro_id%TYPE;
                  v_data        vendite.fatture.data%TYPE;
                  v_serie       vendite.fatture.serie%TYPE;
                  v_anno        vendite.fatture.anno%TYPE;
                  v_numero      vendite.fatture.numero%TYPE;
                  -- D-K: stato dei satelliti, letto una volta sola.
                  v_tot_pagare  vendite.fatture.totale_a_pagare%TYPE;
                  v_tot_doc     vendite.fatture.totale_doc%TYPE;
                  v_impo_tot    vendite.fatture.imponibile_tot%TYPE;
                  v_imps_tot    vendite.fatture.imposta_tot%TYPE;
                  v_n_iva       INTEGER;
                  v_sum_impo    NUMERIC;
                  v_sum_imps    NUMERIC;
                  v_n_rate      INTEGER;
                  v_sum_rate    NUMERIC;
                  v_fondi       NUMERIC;
                  v_arr_prec    vendite.fatture.arrotondamento_precedente%TYPE;
                  v_arr_att     vendite.fatture.arrotondamento_attuale%TYPE;
                  v_motivi      TEXT[] := ARRAY[]::TEXT[];
                  -- D-K condizione 7: la natura del documento, per chiave naturale.
                  v_natura_cod  config.nature_doc_fiscale.codice_interno%TYPE;
              BEGIN
                  -- ⭐ rev 2026-08-25 (cantiere numerazione-data-documento):
                  --    1) si passa p_fattura_id a fn_get_next_progressivo, che
                  --       ne ha bisogno per il BERSAGLIO del cancello di
                  --       monotonia — dentro un giro di lotto la frase non dice
                  --       piu' quale documento ha rifiutato;
                  --    2) `mese` esce dal RETURNS TABLE, e con lui reset_policy.

                  -- Guard: parametro obbligatorio
                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id),
                          NULL::uuid, 'p_fattura_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera dati fattura + registro con lock (solo la riga fattura, alias f)
                  -- ⛔ Il JOIN sul registro RESTA: porta serie_default, cioe' il
                  --    punto in cui la SERIE di un documento si risolve davvero.
                  --    E' la stessa risoluzione che usano
                  --    fn_get_data_minima_numerabile e il backfill di ultima_data:
                  --    se una delle tre diverge, cerca una riga di contatore che
                  --    non esiste e risponde «nessun vincolo».
                  SELECT f.registro_id,
                         f.data,
                         COALESCE(f.serie, r.serie_default, '')
                    INTO v_registro_id, v_data, v_serie
                    FROM vendite.fatture f
                    JOIN vendite.registri_fatturazione r ON r.id = f.registro_id
                   WHERE f.id = p_fattura_id
                     FOR UPDATE OF f;

                  IF v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_VALORE_MANCANTE',
                          jsonb_build_object('fattura_id', p_fattura_id),
                          NULL::uuid, concat('fattura_id ', p_fattura_id)
                      );
                  END IF;

                  -- ----------------------------------------------------
                  -- Guard D3: un documento senza righe non si numera.
                  -- ⚠️ RETTIFICA 2026-08-02: la motivazione originale diceva
                  --    «nextval non fa rollback». Non e' vero qui —
                  --    fn_get_next_progressivo e' table-based e transazionale
                  --    (verificato: nessuna sequence su
                  --    registri_fatturazione_progressivi.last_numero). Il guard
                  --    resta PRIMA, ma perche' non si scrive prima di aver
                  --    validato e per non entrare in contesa sull'advisory lock
                  --    del registro: vedi l'intestazione del changeSet.
                  -- brief-fix-importi-riga-fattura-zero §4.5.
                  -- ----------------------------------------------------
                  PERFORM 1
                     FROM vendite.fatture_righe r
                    WHERE r.fattura_id = p_fattura_id
                    LIMIT 1;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_FATTURA_SENZA_RIGHE',
                          jsonb_build_object('fattura_id', p_fattura_id,
                                             'registro_id', v_registro_id,
                                             -- ⭐ Il bersaglio: questa funzione gira DENTRO il
                                             --    giro di lotto, su molte fatture. La frase
                                             --    dice quale ha rifiutato, il bersaglio la fa
                                             --    aprire. La fattura e' gia' stata letta.
                                             'bersaglio', jsonb_build_array(
                                                 jsonb_build_object('tipo', 'FATTURA',
                                                                    'id', p_fattura_id::text))),
                          NULL::uuid, p_fattura_id::text
                      );
                  END IF;

                  -- ----------------------------------------------------
                  -- Guard D-K (Fase 4b): coerenza del documento, sempre
                  -- PRIMA di consumare il progressivo.
                  -- Si guarda il RISULTATO, non chi avrebbe dovuto scriverlo:
                  -- cosi' il presidio copre anche il caso piu' probabile, cioe'
                  -- un task dello step EMESSA che non ha girato affatto.
                  -- Da qui in poi sappiamo gia' che le righe esistono.
                  -- ----------------------------------------------------
                  SELECT f.totale_a_pagare, f.totale_doc, f.imponibile_tot, f.imposta_tot,
                         (SELECT count(*)::int             FROM vendite.fatture_riepiloghi_iva i WHERE i.fattura_id = p_fattura_id),
                         (SELECT COALESCE(sum(i.imponibile), 0) FROM vendite.fatture_riepiloghi_iva i WHERE i.fattura_id = p_fattura_id),
                         (SELECT COALESCE(sum(i.imposta), 0)    FROM vendite.fatture_riepiloghi_iva i WHERE i.fattura_id = p_fattura_id),
                         (SELECT count(*)::int             FROM vendite.fatture_scadenze s WHERE s.fattura_id = p_fattura_id),
                         (SELECT COALESCE(sum(s.importo), 0)    FROM vendite.fatture_scadenze s WHERE s.fattura_id = p_fattura_id),
                         COALESCE(vendite.fn_get_totale_fondi_fattura(p_fattura_id), 0),
                         f.arrotondamento_precedente, f.arrotondamento_attuale,
                         nd.codice_interno
                    INTO v_tot_pagare, v_tot_doc, v_impo_tot, v_imps_tot,
                         v_n_iva, v_sum_impo, v_sum_imps, v_n_rate, v_sum_rate,
                         v_fondi, v_arr_prec, v_arr_att, v_natura_cod
                    FROM vendite.fatture f
                    JOIN config.nature_doc_fiscale nd ON nd.id = f.natura_doc_id
                   WHERE f.id = p_fattura_id;

                  -- ⚠️ `array_append` e non `|| 'testo'`: con un letterale non
                  --    tipizzato PostgreSQL prova a leggerlo come letterale di
                  --    ARRAY e solleva «l'array deve iniziare con {». I rami che
                  --    usano format() non lo mostrano — format() restituisce gia'
                  --    un text — quindi il difetto si nasconde nei soli casi a
                  --    testo fisso. Qui la forma e' una sola per tutti e cinque.

                  -- 1) I totali non sono mai stati calcolati.
                  IF v_tot_pagare IS NULL THEN
                      v_motivi := array_append(v_motivi, 'totali non calcolati (totale_a_pagare assente)');
                  END IF;

                  -- 2) Righe presenti (verificato sopra) ma nessun riepilogo IVA.
                  IF v_n_iva = 0 THEN
                      v_motivi := array_append(v_motivi, 'riepilogo IVA assente');
                  END IF;

                  -- 3) Documento da incassare: il piano rate deve esserci e quadrare.
                  --    L'uguaglianza e' esatta perche' il generatore quadra per
                  --    costruzione (l'ultima rata assorbe la differenza) e i tipi
                  --    sono NUMERIC, non floating point.
                  IF v_tot_pagare > 0 AND v_n_rate = 0 THEN
                      v_motivi := array_append(v_motivi, 'piano rate assente');
                  ELSIF v_tot_pagare > 0 AND v_sum_rate <> v_tot_pagare THEN
                      v_motivi := array_append(v_motivi, format(
                          'somma delle rate (%s) diversa dal totale a pagare (%s)',
                          v_sum_rate, v_tot_pagare));
                  END IF;

                  -- 4) D-D allo specchio: un documento non positivo non si rateizza.
                  IF v_tot_pagare IS NOT NULL AND v_tot_pagare <= 0 AND v_n_rate > 0 THEN
                      v_motivi := array_append(v_motivi, format(
                          'presenti %s rate su un totale a pagare non positivo (%s)',
                          v_n_rate, v_tot_pagare));
                  END IF;

                  -- 5) I riepiloghi IVA devono quadrare con i totali di testata.
                  --    Si controlla la catena intera e non il solo estremo: due
                  --    scostamenti che si compensano darebbero un totale giusto
                  --    con dentro numeri sbagliati.
                  IF COALESCE(v_sum_impo, 0) <> COALESCE(v_impo_tot, 0)
                     OR COALESCE(v_sum_imps, 0) <> COALESCE(v_imps_tot, 0)
                     OR COALESCE(v_impo_tot, 0) + COALESCE(v_imps_tot, 0) <> COALESCE(v_tot_doc, 0) THEN
                      v_motivi := array_append(v_motivi, format(
                          'riepilogo IVA non coerente con i totali di testata (imponibile %s vs %s, imposta %s vs %s, totale_doc %s)',
                          v_sum_impo, v_impo_tot, v_sum_imps, v_imps_tot, v_tot_doc));
                  END IF;

                  -- 6) L'ultimo anello: `totale_a_pagare` deve DERIVARE da
                  --    `totale_doc`. Senza questo controllo la catena resta
                  --    aperta nel mezzo — la 5 lega i riepiloghi a totale_doc e
                  --    la 3 lega le rate a totale_a_pagare, ma nulla legherebbe
                  --    i due totali fra loro, e un fondo aggiunto dopo il
                  --    ricalcolo passerebbe indisturbato: rate che quadrano con
                  --    un totale che non tiene conto dell'acconto.
                  --    L'identita' e' quella di fn_ricalcola_totali_fattura:
                  --      totale_a_pagare = totale_doc + fondi
                  --                        + arrotondamento_precedente
                  --                        + arrotondamento_attuale
                  --    Non si ricalcola nulla: si verifica che il valore scritto
                  --    sia ancora quello che i suoi addendi producono.
                  --    Saltata se il totale e' NULL: l'ha gia' detto la 1, e
                  --    ripeterlo qui come «0 non corrisponde» sarebbe rumore.
                  IF v_tot_pagare IS NOT NULL
                     AND v_tot_pagare <> COALESCE(v_tot_doc, 0) + COALESCE(v_fondi, 0)
                                         + COALESCE(v_arr_prec, 0) + COALESCE(v_arr_att, 0) THEN
                      v_motivi := array_append(v_motivi, format(
                          'totale a pagare (%s) non corrisponde alla somma dei suoi addendi: totale_doc %s + fondi %s + arrotondamenti %s/%s',
                          v_tot_pagare, v_tot_doc, v_fondi, v_arr_prec, v_arr_att));
                  END IF;

                  -- 7) IL SEGNO PORTA IL SIGNIFICATO, e qui smette di essere una
                  --    convenzione (brief nota di credito, S12.4-bis.6):
                  --      natura = NOTA_CREDITO  <=>  totale_a_pagare <= 0
                  --    Controllato PRIMA che il progressivo venga consumato, cioe'
                  --    prima del punto in cui la guida dice che l'errore diventa
                  --    irreparabile: «un numero fiscale valido su un documento
                  --    invalido si ripara solo con una nota di variazione».
                  --    ⚠️ Lo ZERO e' ammesso da entrambe le parti: un documento a
                  --    saldo nullo e' strano ma non incoerente, e vietarlo qui
                  --    sarebbe una regola inventata da questo guard invece che
                  --    decisa. Si presidia il SEGNO, non l'importo.
                  --    ⚠️ La seconda meta' e' scritta come «diverso da NOTA_CREDITO»
                  --    e non come «uguale a FATTURA»: copre anche NOTA_DEBITO senza
                  --    doverla nominare, ed e' il verso <= dell'equivalenza.
                  IF v_tot_pagare IS NOT NULL AND v_natura_cod = 'NOTA_CREDITO' AND v_tot_pagare > 0 THEN
                      v_motivi := array_append(v_motivi, format(
                          'natura NOTA_CREDITO con totale a pagare positivo (%s)', v_tot_pagare));
                  ELSIF v_tot_pagare IS NOT NULL AND v_natura_cod <> 'NOTA_CREDITO' AND v_tot_pagare < 0 THEN
                      v_motivi := array_append(v_motivi, format(
                          'natura %s con totale a pagare negativo (%s)', v_natura_cod, v_tot_pagare));
                  END IF;

                  -- Un errore solo, con TUTTI i motivi: chi lo riceve vede in una
                  -- volta cosa manca al documento invece di scoprirlo un giro
                  -- alla volta.
                  IF array_length(v_motivi, 1) > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_FATTURA_NON_NUMERABILE_INCOERENTE',
                          jsonb_build_object(
                              'fattura_id',      p_fattura_id,
                              'registro_id',     v_registro_id,
                              'natura',          v_natura_cod,
                              'motivi',          to_jsonb(v_motivi),
                              'totale_a_pagare', v_tot_pagare,
                              'totale_doc',      v_tot_doc,
                              'riepiloghi_iva',  v_n_iva,
                              'rate',            v_n_rate,
                              'somma_rate',      v_sum_rate,
                              'fondi',           v_fondi,
                              'arrotondamento_precedente', v_arr_prec,
                              'arrotondamento_attuale',    v_arr_att),
                          NULL::uuid,
                          p_fattura_id::text,
                          array_to_string(v_motivi, '; ')
                      );
                  END IF;

                  -- Calcolo progressivo
                  -- ⭐ rev 2026-08-25: si passa p_fattura_id, che serve SOLO al
                  --    bersaglio del cancello di monotonia. Senza, dentro un giro
                  --    di lotto l'errore direbbe da quale data ripartire ma non
                  --    su quale documento e' successo.
                  v_anno := vendite.fn_get_anno_registro(v_data);
                  v_numero := vendite.fn_get_next_progressivo(
                                  v_registro_id, v_data, v_serie, p_fattura_id);

                  -- Aggiorna testata fattura
                  UPDATE vendite.fatture
                     SET anno = v_anno,
                         serie = NULLIF(v_serie, ''),
                         numero = v_numero,
                         data_update = now(),
                         user_update = current_user
                   WHERE id = p_fattura_id;

                  RETURN QUERY SELECT v_registro_id, v_anno, NULLIF(v_serie, '')::VARCHAR, v_numero;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_assign_numero_fattura(vendite.fatture.id%TYPE)
                IS 'Assegna anno, serie e numero a una fattura, dopo il guard D-K di coerenza del documento. Il guard gira SEMPRE prima di consumare il progressivo, perche'' un numero fiscale valido su un documento invalido si ripara solo con una nota di variazione. rev 2026-08-18 (brief-design-note-credito-resi N11): SETTIMA condizione — natura = NOTA_CREDITO <=> totale_a_pagare <= 0. ⭐ Trasforma la scelta di D-NC-2 (il segno vive nel numero, non in un''etichetta) da convenzione a invariante VERIFICATO, e chiude il cerchio con la FatturaPA dove lo stesso invariante si legge TipoDocumento = TD04 <=> totale_doc < 0. ⚠️ Lo zero e'' ammesso da entrambe le parti: si presidia il SEGNO, non l''importo. ⚠️ La seconda meta'' dice «diverso da NOTA_CREDITO» e non «uguale a FATTURA»: copre anche NOTA_DEBITO senza nominarla. ⭐ rev 2026-08-24: E_FATTURA_SENZA_RIGHE porta il BERSAGLIO sulla fattura. ⭐ rev 2026-08-25 (cantiere numerazione-data-documento), DUE modifiche in un solo DROP + CREATE (decisione D-4): (1) si passa p_fattura_id a fn_get_next_progressivo, che ne ha bisogno per il BERSAGLIO del cancello di monotonia — senza, dentro un giro di lotto l''errore direbbe da quale data ripartire ma non su quale documento e'' successo; (2) `mese` ESCE dal RETURNS TABLE, e con lui l''ultima lettura di registri_fatturazione.reset_policy, che ammetteva tre valori e ne implementava uno. ⛔ Questo changeSet va DOPO quello su fn_numera_fattura_opz_emessa, che chiama questa funzione: se `mese` sparisse prima che quella smetta di chiederlo sarebbe un errore a runtime. ⛔ Il JOIN su registri_fatturazione RESTA, al contrario di quanto fatto nella chiamante: qui porta serie_default, cioe'' il punto in cui la SERIE di un documento si risolve davvero — ed e'' la stessa risoluzione, COALESCE(f.serie, r.serie_default, ''''), che devono usare fn_get_data_minima_numerabile e il backfill di ultima_data; se una delle tre diverge, cerca una riga di contatore che non esiste e risponde «nessun vincolo». ℹ️ Adesso prima del numero ci sono DUE cose: il D-K (il documento merita un numero?) e il cancello di monotonia dentro fn_get_next_progressivo (la data puo'' stare in fondo alla sequenza?). Il secondo e'' sotto l''advisory lock, il primo no — e va bene: il D-K guarda la fattura, non la sequenza. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §4 DB-8 e DB-12.';

              -- ⚠️ I GRANT si perdono col DROP: si rimettono identici.
              GRANT EXECUTE ON FUNCTION vendite.fn_assign_numero_fattura(
                  vendite.fatture.id%TYPE) TO zeroerp_app;
              -- ⛔ 2026-09-02 — NIENTE GRANT AL RUOLO BATCH IN UN changeSet.
              --    In CI il ruolo `zeroerp_batch_fatturazione` non esiste ancora: il workflow
              --    lo provisiona DOPO le migrazioni standard (BYPASSRLS vuole superuser,
              --    quindi lo crea `postgres` e non Liquibase), e il migrate moriva con
              --    «role "zeroerp_batch_fatturazione" does not exist».
              --    ⭐ Ed era anche INUTILE: provision_db_role_batch_fatturazione.sql fa
              --    GRANT SELECT/EXECUTE ON ALL ... IN SCHEMA sui 14 schemi applicativi piu'
              --    ALTER DEFAULT PRIVILEGES, quindi l'oggetto e' coperto su ogni ambiente —
              --    anche se nasce dopo. Verificato: una funzione del 2026-08-31 senza nessun
              --    GRANT esplicito risponde gia' EXECUTE = true per quel ruolo.
              --    ⚠️ La regola era gia' scritta il 2026-07-27 in 20260727-21, dopo lo stesso
              --    guasto: «i privilegi dei ruoli batch stanno nel provisioning, mai in un
              --    changeSet». linee-guida-sql.md §11.6
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Da rollare INSIEME al 20260825-17, e PRIMA di quello: la forma
              --    a cinque colonne va ripristinata mentre la chiamante ancora
              --    non chiede `mese`.
              DROP FUNCTION IF EXISTS vendite.fn_assign_numero_fattura(bigint);
