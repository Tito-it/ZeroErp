# D5 — vw_fattura_righe_esposte: come il documento va rappresentato
#   (brief-fix-importi-riga-fattura-zero.md §4.7-bis)
#
# ⚠️ NON E' «LA VISTA DI STAMPA». E' la RAPPRESENTAZIONE del documento, e deve
#   essere letta da OGNI uscita verso l'esterno: PDF, XML SDI, portale. Se il PDF
#   mostrasse il kit raggruppato e l'XML trasmettesse i componenti, avremmo due
#   uscite dello stesso documento con dettagli diversi — totali uguali, quindi
#   niente di irregolare, ma una divergenza che nessuno ha deciso. Chiamarla «di
#   stampa» significherebbe costruirla gia' divergente.
#
# IL PRINCIPIO: `vendite.fatture_righe` resta il DETTAGLIO — tutte le componenti,
#   con articolo, quantita' e prezzo propri. Questa vista produce la SINTESI, e
#   non esiste un secondo dato da tenere allineato.
#
# PERCHE' UNA VISTA E NON UNA TABELLA MATERIALIZZATA: una tabella porterebbe tre
#   domande — quando la generi, cosa succede se la stampa viene rilanciata, cosa
#   se qualcuno tocca le righe dopo. Con la vista spariscono tutte: fonte unica,
#   nessun momento di generazione, nessuna idempotenza da garantire. Se un domani
#   costasse troppo, materializzarla e' banale: la definizione e' gia' qui.
#
# LE TRE REGOLE, dal disegno «modello unificato componenti BoM» del 2026-05-13:
#   * riga non di kit           -> passa cosi' com'e';
#   * kit                       -> UNA riga padre che porta il TOTALE;
#   * componenti con flag TRUE  -> righe DESCRITTIVE sotto il padre, senza importo.
#   I componenti con flag FALSE non compaiono: il loro valore e' gia' dentro il
#   totale del padre. Il totale del documento non cambia mai al variare
#   dell'esposizione.
#
# LE CONVENZIONI DECISE DA TID (2026-07-28):
#   * quantita' della riga padre = MEDIA delle quantita' dei componenti. In un kit
#     da 2 pezzi tutti i componenti portano 2 e il padre porta 2: la media da' 2.
#     ⚠️ Regge finche' `coeff_qta_snapshot` vale 1 — verificato: 30 righe su 30.
#     Con un coefficiente diverso la media diventerebbe un numero che non
#     corrisponde a nulla (kit da 2 con un componente a coefficiente 3 -> media di
#     {2,6,6}). Il rimedio, se servira', e' congelare `kit_qta_padre` alla
#     generazione.
#   * `riga_nr` della riga padre = il PRIMO dei suoi componenti.
#   * importo della riga padre = SOMMA dei componenti.
#
# PREZZO UNITARIO DEL PADRE: derivato, `importo / quantita`. Sul caso reale torna
#   il prezzo vero del padre (2+6+9 = 17 su qta 1 -> 17,00, che e' il prezzo della
#   riga d'ordine 589). E' il prezzo IMPLICITO della riga stampata, non una
#   lettura dal catalogo: quello a catalogo puo' essere cambiato dopo l'emissione.
#
# ⚠️ RAGGRUPPAMENTO PER IVA. La riga padre e' costruita per
#   (fattura, kit, iva, billing account destinatario) e non per solo (fattura,
#   kit): se un kit avesse componenti con aliquote diverse, una riga padre sola
#   non potrebbe rappresentarle e falserebbe il riepilogo IVA. Cosi' se ne
#   ottengono due, che e' l'esito corretto. Oggi il caso non si presenta.
#
# ⚠️ IMPORTO NULL E NON ZERO sulle righe descrittive: NULL dice «questa riga non
#   porta importo», zero direbbe «vale zero». Un consumatore che somma ottiene
#   comunque il totale corretto, perche' SUM ignora i NULL.
#
# ORDINAMENTO: `ordinamento` (il riga_nr del capogruppo) + `livello` (0 padre o
#   riga normale, 1 componente descrittivo). Cosi' i componenti si dispongono
#   sempre sotto il proprio padre, in modo deterministico.
#
# 🔒 `security_invoker=on`: la vista gira coi permessi del chiamante, come le
#   altre viste applicative del progetto.
#
# Dipendenze: 20260728-14 (colonne kit), 20260728-15 (popolamento).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260728-16-create-vw-fattura-righe-esposte-mctit.yaml

  - changeSet:
      id: 20260728-16-create-vw-fattura-righe-esposte
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vw_fattura_righe_esposte: rappresentazione unica del documento per PDF,
        SDI e portale. Riga non-kit invariata; kit come riga padre col totale e
        componenti esposti come righe descrittive senza importo.
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: vendite
            tableName: fatture_righe
            columnName: kit_esposto_in_fattura
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_fattura_righe_esposte
              WITH (security_invoker=on) AS
              WITH kit AS (
                  -- Una riga padre per (fattura, kit, iva, BA destinatario):
                  -- l'IVA entra nel raggruppamento perche' una riga sola non
                  -- potrebbe rappresentare aliquote diverse senza falsare il
                  -- riepilogo.
                  -- articolo e descrizione del padre stanno nel GROUP BY, non
                  -- in un aggregato: sono costanti dentro il kit (e per uuid non
                  -- esiste max()). Se per qualche ragione divergessero si
                  -- otterrebbero due righe padre invece di una fusione
                  -- silenziosa — degradazione sicura, stesso criterio del
                  -- raggruppamento in fn_generate_fatture_righe.
                  SELECT r.fattura_id,
                         r.kit_key,
                         r.iva_id,
                         r.dest_billing_account_id,
                         r.kit_articolo_padre_id            AS articolo_padre_id,
                         r.kit_descrizione_padre            AS descrizione_padre,
                         min(r.riga_nr)                     AS riga_nr_padre,
                         max(r.uom_id)                      AS uom_id,
                         avg(r.qta)                         AS qta_media,
                         sum(r.imponibile_riga)             AS imponibile_totale,
                         max(r.iva_natura)                  AS iva_natura
                    FROM vendite.fatture_righe r
                   WHERE r.kit_key IS NOT NULL
                   GROUP BY r.fattura_id, r.kit_key, r.iva_id, r.dest_billing_account_id,
                            r.kit_articolo_padre_id, r.kit_descrizione_padre
              )
              -- 1) Righe non di kit: passano cosi' come sono.
              SELECT r.fattura_id,
                     'NORMALE'::text                         AS tipo_riga,
                     r.riga_nr,
                     r.riga_nr                               AS ordinamento,
                     0::smallint                             AS livello,
                     r.id                                    AS fatture_righe_id,
                     r.articolo_id,
                     r.descrizione,
                     r.uom_id,
                     r.qta,
                     r.prezzo_unitario,
                     r.sconto_percentuale,
                     r.iva_id,
                     r.iva_natura,
                     r.imponibile_riga                       AS imponibile,
                     r.dest_billing_account_id,
                     NULL::text                              AS kit_key
                FROM vendite.fatture_righe r
               WHERE r.kit_key IS NULL

              UNION ALL

              -- 2) La riga padre del kit: porta il TOTALE.
              SELECT k.fattura_id,
                     'KIT_PADRE'::text                       AS tipo_riga,
                     k.riga_nr_padre                         AS riga_nr,
                     k.riga_nr_padre                          AS ordinamento,
                     0::smallint                             AS livello,
                     NULL::bigint                            AS fatture_righe_id,
                     k.articolo_padre_id                     AS articolo_id,
                     k.descrizione_padre                     AS descrizione,
                     k.uom_id,
                     k.qta_media                             AS qta,
                     -- Prezzo IMPLICITO della riga stampata: totale / quantita'.
                     CASE WHEN COALESCE(k.qta_media, 0) = 0 THEN NULL::numeric
                          ELSE k.imponibile_totale / k.qta_media
                     END                                     AS prezzo_unitario,
                     NULL::numeric                           AS sconto_percentuale,
                     k.iva_id,
                     k.iva_natura,
                     k.imponibile_totale                     AS imponibile,
                     k.dest_billing_account_id,
                     k.kit_key
                FROM kit k

              UNION ALL

              -- 3) I componenti ESPOSTI: righe descrittive, senza importo.
              --    Quelli con flag FALSE non compaiono: il loro valore e' gia'
              --    dentro il totale del padre.
              SELECT r.fattura_id,
                     'KIT_COMPONENTE'::text                  AS tipo_riga,
                     r.riga_nr,
                     k.riga_nr_padre                         AS ordinamento,
                     1::smallint                             AS livello,
                     r.id                                    AS fatture_righe_id,
                     r.articolo_id,
                     r.descrizione,
                     r.uom_id,
                     r.qta,
                     NULL::numeric                           AS prezzo_unitario,
                     NULL::numeric                           AS sconto_percentuale,
                     r.iva_id,
                     r.iva_natura,
                     -- NULL e non zero: «questa riga non porta importo».
                     NULL::numeric                           AS imponibile,
                     r.dest_billing_account_id,
                     r.kit_key
                FROM vendite.fatture_righe r
                JOIN kit k
                  ON k.fattura_id = r.fattura_id
                 AND k.kit_key    = r.kit_key
                 AND k.iva_id IS NOT DISTINCT FROM r.iva_id
                 AND k.dest_billing_account_id IS NOT DISTINCT FROM r.dest_billing_account_id
               WHERE r.kit_key IS NOT NULL
                 AND r.kit_esposto_in_fattura IS TRUE;

              COMMENT ON VIEW vendite.vw_fattura_righe_esposte
              IS 'Rappresentazione del documento per OGNI uscita verso l''esterno: PDF, XML SDI, portale. ⚠️ NON e'' «la vista di stampa»: se il PDF mostrasse il kit raggruppato e l''XML trasmettesse i componenti avremmo due uscite dello stesso documento con dettagli diversi. vendite.fatture_righe resta il DETTAGLIO (tutte le componenti, con articolo/quantita''/prezzo propri), questa vista produce la SINTESI — nessun secondo dato da tenere allineato. Tre regole, dal modello unificato componenti BoM del 2026-05-13: riga non-kit invariata; kit come UNA riga padre che porta il totale; componenti con esposto_in_fattura=TRUE come righe DESCRITTIVE senza importo (NULL, non zero). I componenti non esposti non compaiono: il loro valore e'' gia'' nel totale del padre, quindi il totale del documento non cambia mai al variare dell''esposizione. Convenzioni: quantita'' del padre = MEDIA dei componenti (regge finche'' coeff_qta_snapshot vale 1), riga_nr = il primo dei componenti, prezzo unitario derivato come totale/quantita''. La riga padre e'' costruita per (fattura, kit, IVA, BA destinatario): un kit con aliquote diverse produce due righe padre, che e'' l''esito corretto. Ordinamento: `ordinamento` + `livello` dispongono i componenti sotto il proprio padre. brief-fix-importi-riga-fattura-zero §4.7-bis (D5).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_fattura_righe_esposte;
