databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260130-10-update-fn-get-or-create-lotto-mctit.yaml

  - changeSet:
      id: 20260130-10-update-fn-get-or-create-lotto
      author: mctit
      comment: "Allinea fn_get_or_create_lotto con tipo_lotto e pipeline"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_lotto(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE DEFAULT NULL,
                p_competenza_mese vendite.fatturazione_lotti.competenza_mese%TYPE DEFAULT NULL,
                p_tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE DEFAULT NULL,
                p_utility_id config.utilities.id%TYPE DEFAULT NULL,
                p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                p_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE DEFAULT NULL,
                p_meta jsonb DEFAULT NULL,
                p_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE DEFAULT 'MASSIVO'
              )
              RETURNS vendite.fatturazione_lotti.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_competenza vendite.fatturazione_lotti.competenza_mese%TYPE;
                v_utility_id config.utilities.id%TYPE;
                v_tipo_doc_id config.tipi_doc_fiscale.id%TYPE;
                v_billing_account_id anagrafiche.billing_account.id%TYPE;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recupera un lotto esistente o lo crea se assente.
                --
                -- Regole:
                --   - tipo_lotto obbligatorio (MASSIVO | GIORNALIERO)
                --   - se p_lotto_id presente, valida coerenza parametri
                --   - se p_lock_batch_id presente, riusa lotto se esistente
                -- =========================================================

                IF p_tipo_lotto IS NULL OR p_tipo_lotto NOT IN ('MASSIVO','GIORNALIERO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('detail','tipo_lotto non valido', 'tipo_lotto', p_tipo_lotto),
                    NULL::uuid, 'tipo_lotto non valido'
                  );
                END IF;

                IF p_lotto_id IS NOT NULL THEN
                  SELECT competenza_mese, utility_id, tipo_doc_fiscale_id, billing_account_id, tipo_lotto
                    INTO v_competenza, v_utility_id, v_tipo_doc_id, v_billing_account_id, v_tipo_lotto
                    FROM vendite.fatturazione_lotti
                   WHERE id = p_lotto_id;

                  IF v_competenza IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Lotto non trovato', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Lotto non trovato', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_competenza_mese IS NOT NULL
                    AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Competenza non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Competenza non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Utility non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, concat('Utility non coerente', ' lotto_id: ', p_lotto_id::text) 
                    );
                  END IF;

                  IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <> v_tipo_doc_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Tipo documento non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, 
                      concat('Tipo documento non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Billing account non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, concat('Billing account non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF v_tipo_lotto IS NOT NULL AND v_tipo_lotto <> p_tipo_lotto THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('detail','Tipo lotto non coerente', 'lotto_id', p_lotto_id),
                      NULL::uuid, concat('Tipo lotto non coerente', ' lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  RETURN p_lotto_id;
                END IF;

                IF p_lock_batch_id IS NOT NULL THEN
                  SELECT id
                    INTO v_lotto_id
                    FROM vendite.fatturazione_lotti
                   WHERE lock_batch_id = p_lock_batch_id;

                  IF v_lotto_id IS NOT NULL THEN
                    RETURN v_lotto_id;
                  END IF;
                END IF;

                v_lotto_id := vendite.fn_create_fatturazione_lotto(
                  p_competenza_mese,
                  p_tipo_doc_fiscale_id,
                  p_utility_id,
                  p_billing_account_id,
                  p_lock_batch_id,
                  p_meta
                );

                UPDATE vendite.fatturazione_lotti
                   SET tipo_lotto = p_tipo_lotto,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = v_lotto_id;

                RETURN v_lotto_id;
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_lotto(
                vendite.fatturazione_lotti.id%TYPE,
                vendite.fatturazione_lotti.competenza_mese%TYPE,
                config.tipi_doc_fiscale.id%TYPE,
                config.utilities.id%TYPE,
                anagrafiche.billing_account.id%TYPE,
                vendite.fatturazione_lotti.lock_batch_id%TYPE,
                jsonb,
                vendite.fatturazione_lotti.tipo_lotto%TYPE
              ) IS 'Recupera o crea lotto; valida coerenza e imposta tipo_lotto.';
