# D3 — nessuna numerazione fiscale su una fattura senza righe
#   (brief-fix-importi-riga-fattura-zero.md §4.5)
#
# IL FATTO. Le fatture 207 e 208 sono DEFINITIVE e non hanno ALCUNA riga:
#   esisteva quindi un percorso che assegna numerazione fiscale a un documento
#   vuoto, e nulla lo intercettava. Non e' una curiosita' sui dati di test: e' la
#   stessa famiglia di difetto del resto del brief — un invariante che tutti
#   danno per acquisito e nessuno presidia.
#
# PERCHE' QUI E NON SULLA TRANSIZIONE DI STATO. Il brief lasciava aperto il
#   punto in cui armare il guard («va verificato dove il modello assegna davvero
#   la numerazione»). Verificato: vendite.fn_assign_numero_fattura e' il PUNTO
#   UNICO in cui il progressivo viene assegnato — le uniche due funzioni che
#   scrivono vendite.fatture.numero sono lei e
#   vendite.fn_numera_fattura_opz_emessa, che le DELEGA. Mettendo il guard qui,
#   qualunque percorso ci arrivi — pipeline, numerazione opzionale da EMESSA,
#   chiamata diretta — trova lo stesso presidio, senza doverli enumerare.
#   Un guard sulla transizione di stato avrebbe invece coperto una sola strada.
#
# ⚠️ PRIMA CHE IL PROGRESSIVO VENGA CONSUMATO. Il controllo e' inserito DOPO la
#   risoluzione del registro e PRIMA di vendite.fn_get_next_progressivo: il
#   progressivo di registro non torna indietro (nextval non fa rollback), quindi
#   fallire dopo averlo consumato lascerebbe comunque un buco nella numerazione
#   fiscale. L'ordine delle due istruzioni e' sostanza, non stile.
#
# NON RETROATTIVO: le fatture gia' numerate restano come sono (decisione Tid
#   2026-07-28 su §7 del brief — nessun intervento sui dati esistenti).
#
# COSA CAMBIA rispetto alla versione precedente: solo il blocco di guard. Firma,
#   RETURNS TABLE, lock `FOR UPDATE OF f` e corpo restano identici ->
#   CREATE OR REPLACE puro, nessun DROP.
#
# Base: doc auto-gen docs/it/dbzero/vendite/funzioni/fn_assign_numero_fattura.md
#   (corpo) + 20260619-13 (firma con %TYPE, che l'auto-gen scioglie).
#   Dipendenze: codice errore E_FATTURA_SENZA_RIGHE (id 563, seed CSV).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260728-05-update-fn-assign-numero-fattura-guard-righe-mctit.yaml

  - changeSet:
      id: 20260728-05-update-fn-assign-numero-fattura-guard-righe
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_assign_numero_fattura rifiuta di numerare una fattura senza righe
        (E_FATTURA_SENZA_RIGHE), prima che il progressivo venga consumato.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_assign_numero_fattura(
                  p_fattura_id vendite.fatture.id%TYPE
              )
              RETURNS TABLE(
                  registro_id vendite.fatture.registro_id%TYPE,
                  anno        vendite.fatture.anno%TYPE,
                  mese        SMALLINT,
                  serie       vendite.fatture.serie%TYPE,
                  numero      vendite.fatture.numero%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_registro_id vendite.fatture.registro_id%TYPE;
                  v_data        vendite.fatture.data%TYPE;
                  v_serie       vendite.fatture.serie%TYPE;
                  v_reset       vendite.registri_fatturazione.reset_policy%TYPE;
                  v_anno        vendite.fatture.anno%TYPE;
                  v_mese        SMALLINT;
                  v_numero      vendite.fatture.numero%TYPE;
              BEGIN
                  -- Guard: parametro obbligatorio
                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id),
                          NULL::uuid, 'p_fattura_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera dati fattura + registro con lock (solo la riga fattura, alias f)
                  SELECT f.registro_id,
                         f.data,
                         COALESCE(f.serie, r.serie_default, ''),
                         r.reset_policy
                    INTO v_registro_id, v_data, v_serie, v_reset
                    FROM vendite.fatture f
                    JOIN vendite.registri_fatturazione r ON r.id = f.registro_id
                   WHERE f.id = p_fattura_id
                     FOR UPDATE OF f;

                  IF v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_VALORE_MANCANTE',
                          jsonb_build_object('fattura_id', p_fattura_id),
                          NULL::uuid, concat('fattura_id ', p_fattura_id)
                      );
                  END IF;

                  -- ----------------------------------------------------
                  -- Guard D3: un documento senza righe non si numera.
                  -- ⚠️ QUI e non piu' sotto: il progressivo di registro non
                  --    torna indietro (nextval non fa rollback), quindi fallire
                  --    dopo fn_get_next_progressivo lascerebbe comunque un buco
                  --    nella numerazione fiscale.
                  -- brief-fix-importi-riga-fattura-zero §4.5.
                  -- ----------------------------------------------------
                  PERFORM 1
                     FROM vendite.fatture_righe r
                    WHERE r.fattura_id = p_fattura_id
                    LIMIT 1;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_FATTURA_SENZA_RIGHE',
                          jsonb_build_object('fattura_id', p_fattura_id,
                                             'registro_id', v_registro_id),
                          NULL::uuid, p_fattura_id::text
                      );
                  END IF;

                  -- Calcolo progressivo
                  v_anno := vendite.fn_get_anno_registro(v_data);
                  v_numero := vendite.fn_get_next_progressivo(v_registro_id, v_data, v_serie);
                  v_mese := CASE WHEN v_reset = 'MENSILE'
                                 THEN EXTRACT(MONTH FROM v_data)::SMALLINT
                                 ELSE NULL
                             END;

                  -- Aggiorna testata fattura
                  UPDATE vendite.fatture
                     SET anno = v_anno,
                         serie = NULLIF(v_serie, ''),
                         numero = v_numero,
                         data_update = now(),
                         user_update = current_user
                   WHERE id = p_fattura_id;

                  RETURN QUERY SELECT v_registro_id, v_anno, v_mese, NULLIF(v_serie, '')::VARCHAR, v_numero;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_assign_numero_fattura(bigint)
              IS 'Assegna anno/serie/numero alla fattura usando registro e progressivo con lock. rev 2026-07-28: rifiuta con E_FATTURA_SENZA_RIGHE una fattura priva di righe, PRIMA di consumare il progressivo (nextval non fa rollback: fallire dopo lascerebbe comunque un buco nella numerazione fiscale). E'' il punto UNICO in cui il progressivo viene assegnato — fn_numera_fattura_opz_emessa delega qui — quindi il presidio vale per qualunque percorso, senza doverli enumerare. Origine: fatture 207 e 208, DEFINITIVE e senza alcuna riga. Non retroattivo. brief-fix-importi-riga-fattura-zero §4.5 (D3).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Rollback: rimuove il solo guard D3, corpo per il resto identico.
              CREATE OR REPLACE FUNCTION vendite.fn_assign_numero_fattura(
                  p_fattura_id vendite.fatture.id%TYPE
              )
              RETURNS TABLE(
                  registro_id vendite.fatture.registro_id%TYPE,
                  anno        vendite.fatture.anno%TYPE,
                  mese        SMALLINT,
                  serie       vendite.fatture.serie%TYPE,
                  numero      vendite.fatture.numero%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_registro_id vendite.fatture.registro_id%TYPE;
                  v_data        vendite.fatture.data%TYPE;
                  v_serie       vendite.fatture.serie%TYPE;
                  v_reset       vendite.registri_fatturazione.reset_policy%TYPE;
                  v_anno        vendite.fatture.anno%TYPE;
                  v_mese        SMALLINT;
                  v_numero      vendite.fatture.numero%TYPE;
              BEGIN
                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id),
                          NULL::uuid, 'p_fattura_id obbligatorio e > 0'
                      );
                  END IF;

                  SELECT f.registro_id,
                         f.data,
                         COALESCE(f.serie, r.serie_default, ''),
                         r.reset_policy
                    INTO v_registro_id, v_data, v_serie, v_reset
                    FROM vendite.fatture f
                    JOIN vendite.registri_fatturazione r ON r.id = f.registro_id
                   WHERE f.id = p_fattura_id
                     FOR UPDATE OF f;

                  IF v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_assign_numero_fattura', 'E_VALORE_MANCANTE',
                          jsonb_build_object('fattura_id', p_fattura_id),
                          NULL::uuid, concat('fattura_id ', p_fattura_id)
