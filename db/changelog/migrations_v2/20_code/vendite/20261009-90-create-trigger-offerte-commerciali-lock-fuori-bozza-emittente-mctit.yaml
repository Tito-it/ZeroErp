# L'EMITTENTE DI UN'OFFERTA SI SCEGLIE SOLO IN BOZZA
#   vendite.offerte_commerciali: trg_offerte_commerciali_a05_lock_fuori_bozza_upd sul BB vendite.trgfn_doc_testata_lock_fuori_bozza
#   (20261009-70).
#   Brief: brief-db-esecutivi-ba-coppia (§9.8)
#
# -- PERCHE' (decisione di Tid del 2026-10-09, brief §9.8) -----------------
#   L'emittente di un documento non era bloccato da nessuna parte fuori dal
#   preventivo: nessuno l'aveva mai chiuso. Il 2026-06-05 (20260605-05) era
#   nato anzi un trigger che RICALCOLAVA i totali dell'ordine dopo un cambio di
#   emittente: gestiva l'effetto invece di vietare la causa. Col BA (D-1) e un
#   emittente per BA, in bozza l'emittente lo lega gia' al cliente il guard
#   emittente <-> BA; fuori bozza il documento e' stampato, numerato sul
#   registro DI QUELL'AZIENDA e magari in fatturazione: cambiare chi lo emette
#   lo riscriverebbe. E dove il BA manca (DDT di trasferimento, conto lavoro)
#   fuori bozza l'emittente si cambiava davvero, con un UPDATE.
#   Il blocco e' fuori bozza e non assoluto: sull'offerta in bozza il backend
#   cambia cliente ed emittente insieme (offerte_service.UPDATE_KEYS_OFFERTA),
#   ed e' un flusso legittimo.
#   Codice E_DOC_EMITTENTE_FUORI_BOZZA, uno per tutti i documenti (VARIADIC: lo
#   stato, la forma del BB). Non E_EMITTENTE_NON_MODIFICABILE: e' il codice
#   dell'associazione operatore <-> emittente, e la sua frase parla di quella.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261009-90-create-trigger-offerte-commerciali-lock-fuori-bozza-emittente-mctit.yaml

  - changeSet:
      id: 20261009-90-create-trigger-offerte-commerciali-lock-fuori-bozza-emittente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.offerte_commerciali: emittente_fiscale_id bloccato fuori bozza (E_DOC_EMITTENTE_FUORI_BOZZA) sul BB di testata. Brief: brief-db-esecutivi-ba-coppia (9.8).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_doc_testata_lock_fuori_bozza'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_offerte_commerciali_a05_lock_fuori_bozza_upd
                BEFORE UPDATE ON vendite.offerte_commerciali
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza(
                'OFFERTA', 'BOZZA',
                'emittente_fiscale_id', 'E_DOC_EMITTENTE_FUORI_BOZZA');

              COMMENT ON TRIGGER trg_offerte_commerciali_a05_lock_fuori_bozza_upd ON vendite.offerte_commerciali
              IS 'Fuori bozza (stato VECCHIO diverso da BOZZA) l''offerta non cambia l''azienda che la emette (E_DOC_EMITTENTE_FUORI_BOZZA). In bozza cliente ed emittente cambiano insieme, e li lega il guard emittente <-> BA. BB vendite.trgfn_doc_testata_lock_fuori_bozza, fascia _a05_. Brief: brief-db-esecutivi-ba-coppia (9.8).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_a05_lock_fuori_bozza_upd ON vendite.offerte_commerciali;
