                  -- Ritorna: quanti contratti sono stati cessati.
                  -- ==========================================================
                  v_utente     := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                  v_attivo_id  := script.fn_stato_emissione_id('vendite.contratti'::regclass);
