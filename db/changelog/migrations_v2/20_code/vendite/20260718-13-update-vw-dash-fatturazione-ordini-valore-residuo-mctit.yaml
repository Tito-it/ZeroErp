# STEP 8 — ordine al valore RESIDUO da spedire nel serbatoio
#   (brief-db-fatturazione-ddt-resi §4c, DL-23 EMENDATO 2026-07-17).
#
# IL PROBLEMA (doppio conteggio): ordine 1.000, trigger CONSEGNATO, meta'
# spedita -> serbatoio con ordine a valore pieno 1.000 + DDT a 500 = 1.500 per
# una fattura che sara' di 1.000.
#
# LA REGOLA (emendata — ⚠️ CONDIZIONATA AL TRIGGER, il punto 🔴 del §4c):
#   trigger SPEDITO/CONSEGNATO  -> valore = RESIDUO da spedire
#                                  (e' il DDT il veicolo di billing: cio' che e'
#                                  spedito lo porta lui, l'ordine porta il resto)
#   trigger CONFERMATO          -> valore PIENO, invariato
#                                  (fattura l'ordine alla conferma: il DDT non
#                                  conta nulla, non c'e' doppio conteggio da
#                                  evitare — col netto, un ordine interamente
#                                  spedito ma non pushato mostrerebbe 0 senza
#                                  che il DDT compensi: NUOVO buco cieco, sulla
#                                  configurazione di DEFAULT)
#
# LA MISURA: residuo DA SPEDIRE (via ordini_righe_fulfillment), NON il
# "non transitato" — per un ordine trigger CONSEGNATO il transitato e' sempre 0
# e non aiuta (§4c). Formula per riga, RESO-AWARE, riusata non riscritta:
#     GREATEST(0, quantita − Σ ful.qta_evasa + fn_ordine_riga_qta_riconsegna(riga))
# fn_ordine_riga_qta_riconsegna e' il single-source dell'addendo reso (Σ righe
# reso CONFERMATE+attive con riapre_residuo, via vw_resi_righe_effettive) —
# stessa formula di fn_ordine_ha_residuo_evasione e del guard fulfillment.
# Chiamata per riga come gia' fa l'EXISTS "transitata": stile della vista.
#
# DOVE: nel RESOLVER (vw_dash_fatturazione_ordini.valore_totale), non in una
# proiezione a valle — la union e' la fonte unica da cui le lenti derivano
# senza modifiche (§4a). Consumatori censiti: vw_dash_aperto_* eredita il netto
# (l'effetto voluto); vw_dash_backlog_* non mostra questi ordini (IN_ATTESA_DDT
# FISIOLOGICO, step 7); le vw_dash_competenza_* NON leggono questo resolver.
# Accettato (§4c): l'area Ordini diventa l'unica a misura netta.
#
# ⚠️ SFUMATURA DICHIARATA (dal §4c, contro la giustificazione barrata «la somma
# fa sempre 1.000»): a DDT CONSEGNATO il DDT esce dal serbatoio (fase CHIUSO,
# DL-15) mentre l'ordine e' gia' a 0 -> in quella finestra il valore vive nel
# BACKLOG, come DL-22 dichiara. Il buco cieco e' chiuso nella finestra
# EMESSO/SPEDITO; l'argomento vero di DL-23 e' il doppio conteggio.
#
# ⚠️ security_invoker=on RI-SPECIFICATO (V-1). Origine: definizione da
# 20260718-12 (step 7, ultima a definire la vista), identica salvo la CTE righe
# estesa (residuo per riga) e il CASE sul valore.
# Dipendenze: fn_ordine_riga_qta_riconsegna (20260717-08),
#   ordini_righe_fulfillment.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260718-13-update-vw-dash-fatturazione-ordini-valore-residuo-mctit.yaml

  - changeSet:
      id: 20260718-13-update-vw-dash-fatturazione-ordini-valore-residuo
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      failOnError: true
      comment: >
        vw_dash_fatturazione_ordini (DL-23 emendato): per trigger
        SPEDITO/CONSEGNATO valore_totale = residuo da spedire (reso-aware,
        formula single-source fn_ordine_riga_qta_riconsegna); trigger CONFERMATO
        resta a valore pieno. security_invoker=on ri-specificato.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_dash_fatturazione_ordini
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT COUNT(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_ordine_riga_qta_riconsegna'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_ordini
              WITH (security_invoker=on) AS
              WITH righe AS (
                  SELECT orr.ordine_id,
                         orr.id AS riga_id,
                         orr.quantita * orr.prezzo_unitario
                           * (1::numeric - COALESCE(orr.sconto_percentuale, 0::numeric) / 100.0) AS valore_riga,
                         -- STEP 8 (DL-23): residuo DA SPEDIRE per riga, reso-aware.
                         -- Formula single-source (§4c): quantita − Σ evaso + Σ riconsegne
                         -- (l'addendo reso e' fn_ordine_riga_qta_riconsegna, come per
                         -- fn_ordine_ha_residuo_evasione e il guard fulfillment).
                         GREATEST(0::numeric,
                             orr.quantita
                             - COALESCE(ful.evasa, 0::numeric)
                             + vendite.fn_ordine_riga_qta_riconsegna(orr.id))
                           * orr.prezzo_unitario
                           * (1::numeric - COALESCE(orr.sconto_percentuale, 0::numeric) / 100.0) AS valore_riga_residua,
                         (EXISTS ( SELECT 1
                                FROM vendite.commesse_attivita ca
                               WHERE ca.segment_key::text = ((('ORD:'::text || o2.uid::text) || ':R:'::text) || orr.id::text)
                                 AND ca.stato_emissione::text = 'EMESSA'::text)) AS transitata
                    FROM vendite.ordini_righe orr
                    JOIN vendite.ordini o2 ON o2.id = orr.ordine_id
                    LEFT JOIN ( SELECT f.ordine_riga_id, sum(f.qta_evasa) AS evasa
                                  FROM vendite.ordini_righe_fulfillment f
                                 GROUP BY f.ordine_riga_id) ful ON ful.ordine_riga_id = orr.id
                   WHERE orr.attivo IS TRUE
              )
              SELECT 'ORDINI'::character varying AS area,
                     date_trunc('month'::text, o.data::timestamp with time zone)::date AS competenza_mese,
                     o.id AS documento_id,
                     o.uid::text AS documento_uid,
                     o.numero::text AS codice,
                     o.emittente_fiscale_id,
                     NULL::bigint AS emittente_soggetto_ruolo_id,
                     -- DL-23 emendato: netto SOLO quando il veicolo di billing e' il
                     -- DDT; con trigger CONFERMATO il pieno (il DDT non conta nulla).
                     CASE
                         WHEN o.fatturazione_trigger::text IN ('SPEDITO', 'CONSEGNATO')
                           THEN COALESCE(sum(r.valore_riga_residua), 0::numeric)
                         ELSE COALESCE(sum(r.valore_riga), 0::numeric)
                     END AS valore_totale,
                     COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), 0::numeric) AS valore_transitato,
                     count(r.riga_id)::integer AS unita_totali,
                     count(r.riga_id) FILTER (WHERE r.transitata)::integer AS unita_transitate,
                     count(r.riga_id) > 0 AND count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata) AS is_transitato,
                     COALESCE(sdo.esito::text = 'NEGATIVO'::text, false) AS is_abortito,
                         CASE
                             WHEN COALESCE(sdo.esito::text = 'NEGATIVO'::text, false) THEN NULL::text
                             WHEN count(r.riga_id) > 0 AND count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata) THEN NULL::text
                             WHEN sdo.codice_interno::text = 'DRAFT'::text THEN 'DOC_BOZZA'::text
                             -- DL-20 (step 7): con trigger SPEDITO/CONSEGNATO il push
                             -- spetta ai DDT — mai i motivi di push.
                             WHEN o.fatturazione_trigger::text IN ('SPEDITO', 'CONSEGNATO') THEN 'IN_ATTESA_DDT'::text
                             WHEN count(r.riga_id) FILTER (WHERE r.transitata) = 0 THEN 'PUSH_NON_ESEGUITO'::text
                             ELSE 'PUSH_PARZIALE'::text
                         END::character varying AS motivo_fermo,
                     sdo.codice_interno AS stato_codice_interno,
                     sdo.codice AS stato_codice,
                     sdo.fase,
                     s.ragione_sociale_completa AS cliente_display,
                     o.data AS data_riferimento
                FROM vendite.ordini o
                  JOIN config.stati_doc_ordini sdo ON sdo.id = o.stato_doc_ordine_id
                  LEFT JOIN righe r ON r.ordine_id = o.id
                  LEFT JOIN anagrafiche.soggetti_ruoli sr ON sr.id = o.soggetto_ruolo_id
                  LEFT JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
               GROUP BY o.id, o.uid, o.numero, o.data, o.emittente_fiscale_id, o.fatturazione_trigger,
                        sdo.codice_interno, sdo.codice, sdo.fase, sdo.esito, s.ragione_sociale_completa;

              COMMENT ON VIEW vendite.vw_dash_fatturazione_ordini IS
                'Resolver ordini per la dashboard fatturazione. rev 2026-07-18 (step 8, DL-23 EMENDATO): '
                'per trigger SPEDITO/CONSEGNATO valore_totale = RESIDUO DA SPEDIRE (per riga: '
                'GREATEST(0, quantita − Σ fulfillment.qta_evasa + fn_ordine_riga_qta_riconsegna) × prezzo '
                'scontato — reso-aware, formula single-source) perche'' il valore spedito lo porta il DDT: '
                'chiude il doppio conteggio ordine-pieno + DDT. Con trigger CONFERMATO valore PIENO '
                'invariato (fattura l''ordine: col netto un ordine spedito-ma-non-pushato mostrerebbe 0 '
                'senza compensazione — buco cieco sulla configurazione di default). L''area Ordini e'' '
                'l''unica a misura netta (accettato, §4c). rev 2026-07-18 (step 7, DL-20): trigger-aware, '
                'motivo IN_ATTESA_DDT (FISIOLOGICO) per trigger SPEDITO/CONSEGNATO. security_invoker=on + RLS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: ripristino non automatizzato (CREATE OR REPLACE).
              -- Riapplicare 20260718-12 (step 7) per tornare al valore pieno
              -- (ATTENZIONE: reintroduce il doppio conteggio ordine+DDT nel
              -- serbatoio; ri-specificare security_invoker=on).
              SELECT 1;
