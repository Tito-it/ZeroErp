# ------------------------------------------------------------
# Aggiorna trgfn_contratti_guard_transizione_stato per
# includere il check su contratti_righe_componenti.
#
# Con l'introduzione di contratti_righe_componenti (BoM CASO A),
# anche i componenti contratto possono avere
# stato_approvazione_prezzo=PENDING (L3 out-of-policy).
# Il guard esistente controllava solo le transizioni ammesse;
# ora blocca DRAFT->ATTIVO anche se un componente e' PENDING.
#
# Logica: ATTIVO = contratto operativo. Non deve diventare
# operativo con prezzi in attesa di approvazione.
# CESSATO non e' in scope: la cessazione avviene su contratti
# gia' attivi dove i prezzi sono gia' stati approvati.
#
# Nessun DROP: firma identica, usa CREATE OR REPLACE.
# runOnChange: true per ri-applicare ad ogni modifica.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-41-update-trgfn-contratti-guard-transizione-stato-mctit.yaml

  - changeSet:
      id: 20260511-41-01-update-trgfn-contratti-guard-transizione-stato
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Aggiorna vendite.trgfn_contratti_guard_transizione_stato:
        aggiunge check EXISTS su contratti_righe_componenti per bloccare
        la transizione DRAFT->ATTIVO se un componente BoM CASO A ha
        stato_approvazione_prezzo=PENDING.
        Raise E_COMPONENTE_PREZZO_PENDENTE con hint specifico.
        Logica transizioni (DRAFT->ATTIVO, ATTIVO->CESSATO) invariata.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: vendite
            tableName: contratti_righe_componenti
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_guard_transizione_stato()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: bloccare transizioni stato non ammesse sul workflow
              -- contratti (DRAFT -> ATTIVO -> CESSATO).
              -- Regola chiave: ATTIVO -> CESSATO ammessa solo se
              -- valido_al < CURRENT_DATE. Coerente col job pgAgent
              -- chiusura_scadenze_daily che soddisfa la condizione per
              -- costruzione.
              -- Aggiornato 2026-05-12: blocca DRAFT->ATTIVO anche se
              -- un componente BoM CASO A ha prezzo in attesa di approvazione
              -- (stato_approvazione_prezzo = PENDING).
              DECLARE
                  v_codice_da config.stati_doc_contratti.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_contratti.codice_interno%TYPE;
                  v_ammessa   boolean := false;
              BEGIN
                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_contratto_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_contratto_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_contratti
                   WHERE id IN (OLD.stato_doc_contratto_id, NEW.stato_doc_contratto_id);

                  IF v_codice_da = 'DRAFT' AND v_codice_a = 'ATTIVO' THEN
                      v_ammessa := true;
                  ELSIF v_codice_da = 'ATTIVO' AND v_codice_a = 'CESSATO' THEN
                      v_ammessa := (NEW.valido_al IS NOT NULL
                                    AND NEW.valido_al < CURRENT_DATE);
                  END IF;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_CONTRATTO_STATO_TRANSIZIONE_INVALIDA',
                          jsonb_build_object(
                              'contratto_id', NEW.id,
                              'numero',       NEW.numero,
                              'stato_da',     v_codice_da,
                              'stato_a',      v_codice_a,
                              'valido_al',    NEW.valido_al
                          ),
                          NEW.tx_id,
                          NEW.id::text,
                          coalesce(v_codice_da, 'NULL'),
                          coalesce(v_codice_a,  'NULL'),
                          coalesce(NEW.valido_al::text, 'NULL')
                      );
                  END IF;

                  -- Check componenti BoM CASO A con prezzo PENDING (solo su DRAFT->ATTIVO).
                  -- La cessazione avviene su contratti gia' attivi con prezzi approvati.
                  IF v_codice_da = 'DRAFT' AND v_codice_a = 'ATTIVO' THEN
                      IF EXISTS (
                          SELECT 1
                            FROM vendite.contratti_righe cr
                            JOIN vendite.contratti_righe_componenti crc
                              ON crc.riga_contratto_id = cr.id
                           WHERE cr.contratto_id = NEW.id
                             AND crc.stato_approvazione_prezzo =
                                 'PENDING'::config.stato_approvazione_prezzo
                      ) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database',
                              TG_NAME::text,
                              'E_COMPONENTE_PREZZO_PENDENTE',
                              jsonb_build_object(
                                  'contratto_id', NEW.id,
                                  'hint', 'Componente BoM CASO A in attesa di approvazione prezzo. '
                                       || 'Attendi esito su tutti i componenti prima di attivare il contratto.'
                              ),
                              NEW.tx_id,
                              NEW.id::text
                          );
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_guard_transizione_stato()
              IS 'Trigger function: controlla transizioni stato contratto (DRAFT->ATTIVO->CESSATO). '
                 'ATTIVO->CESSATO solo se valido_al < CURRENT_DATE. '
                 'Aggiornato 2026-05-12: blocca DRAFT->ATTIVO se componenti BoM CASO A '
                 'hanno stato_approvazione_prezzo=PENDING (E_COMPONENTE_PREZZO_PENDENTE).';
      rollback:
        - sql:
            splitStatements: false
            sql: |
