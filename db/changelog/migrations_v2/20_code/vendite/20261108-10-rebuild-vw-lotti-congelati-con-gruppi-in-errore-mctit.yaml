# vendite.vw_lotti_chiusi_con_gruppi_in_errore -> vw_lotti_congelati_con_gruppi_in_errore
#   Brief: brief-db-revisione-dbops, giro 6 (Q14 ⑦).
#
# ── ⭐ L'ASSE DIVENTA UNO SOLO: LO STATO FISCALE ─────────────────
#   I due presidi dei lotti si spartivano l'asse su criteri diversi:
#   dbops.vw_lotti_fermi_da_guardare sullo stato FISCALE (pre_fiscale), questa
#   vista sullo stato del JOB (stato_lotto = 'COMPLETATO'). Ne nascevano:
#     * un BUCO: un lotto congelato con stato_lotto IN_ESECUZIONE o ERRORE (la
#       matrice dei job lo ammette) e un esito in ERRORE non lo vedeva nessuno
#       (e' il caso della R-1);
#     * un DOPPIONE: un lotto COMPLETATO ancora in bozza con un esito in ERRORE
#       lo vedevano tutti e due.
#   Ora: non congelato -> il presidio dei lotti fermi, invariato; congelato con
#   un esito in ERRORE -> questa vista, qualunque stato_lotto.
#   `stato_lotto = 'COMPLETATO'` lascia il posto a `NOT pre_fiscale` di
#   vendite.vw_lotti_fase, che e' COALESCE(..., false): uno stato fiscale
#   IGNOTO cade qui, dove un lotto con un esito in errore e' sempre visibile.
#
# ── ⭐ IL NOME ───────────────────────────────────────────────────
#   «chiusi» diceva stato_lotto = COMPLETATO, che non e' piu' il criterio:
#   «congelati» dice l'asse vero (decisione di Tid, 2026-11-07). Nessun lettore
#   in backend ne' frontend; l'unico lettore nel database e' il presidio di
#   dbops, che si toglie qui e rinasce col nome nuovo nel 20261108-11.
#
# ── ⚠️ GLI ANNULLATI ─────────────────────────────────────────────
#   Restano fuori perche' l'annullo chiude gli esiti (fn_annulla_lotto_da_draft,
#   rev 2026-09-23), non per un filtro: la vista non li esclude, e non deve.
#
# ⛔ DROP + CREATE e non CREATE OR REPLACE: cambiano nome e colonne. I GRANT
#   li danno i privilegi di default dello schema (zeroerp_app), come a ogni
#   vista nuova.
# ⚠️ Il commento nel corpo di vendite.fn_annulla_lotto_da_draft nomina ancora
#   il nome vecchio: e' un fatto datato (2026-09-07), vero allora, e non si
#   riscrive la funzione per un commento storico.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261108-10-rebuild-vw-lotti-congelati-con-gruppi-in-errore-mctit.yaml

  - changeSet:
      id: 20261108-10-rebuild-vw-lotti-congelati-con-gruppi-in-errore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_lotti_chiusi_con_gruppi_in_errore diventa
        vw_lotti_congelati_con_gruppi_in_errore: i lotti congelati (NOT pre_fiscale di
        vw_lotti_fase, lo stato fiscale ignoto compreso) con un esito in ERRORE,
        qualunque stato_lotto. Toglie il presidio di dbops che la legge (rinasce nel
        20261108-11). Giro 6 di brief-db-revisione-dbops (Q14 ⑦).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_class
               WHERE oid = to_regclass('vendite.vw_lotti_fase')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Il lettore prima della vista che legge.
              DROP VIEW IF EXISTS dbops.vw_lotti_chiusi_con_errori_da_guardare;
              DROP VIEW IF EXISTS vendite.vw_lotti_chiusi_con_gruppi_in_errore;

              CREATE VIEW vendite.vw_lotti_congelati_con_gruppi_in_errore
              WITH (security_invoker = true) AS
              SELECT l.id                  AS lotto_id,
                     l.codice              AS lotto_codice,
                     l.stato_lotto,
                     f.stato_codice_interno,
                     l.competenza_mese,
                     l.emittente_soggetto_ruolo_id,
                     count(*)              AS gruppi_in_errore,
                     min(e.errore_quando)  AS primo_errore,
                     max(e.errore_quando)  AS ultimo_errore,
                     array_agg(DISTINCT e.errore_codice)
                         FILTER (WHERE e.errore_codice IS NOT NULL) AS codici_errore
                FROM vendite.fatturazione_lotti l
                JOIN vendite.vw_lotti_fase f ON f.lotto_id = l.id
                JOIN vendite.fatturazione_lotti_esiti e ON e.lotto_id = l.id
               WHERE e.stato_esecuzione = 'ERRORE'
                 AND NOT f.pre_fiscale
               GROUP BY l.id, l.codice, l.stato_lotto, f.stato_codice_interno,
                        l.competenza_mese, l.emittente_soggetto_ruolo_id;

              COMMENT ON VIEW vendite.vw_lotti_congelati_con_gruppi_in_errore IS
                  'PRESIDIO. Elenca una contraddizione: un lotto CONGELATO (lo stato fiscale '
                  'non e'' piu'' pre-fiscale: vendite.vw_lotti_fase.pre_fiscale falso, o ignoto) '
                  'che contiene documenti dichiarati in ERRORE, qualunque sia stato_lotto. Il '
                  'fiscale e'' fermo, i documenti non sono nati: non possono stare insieme. DEVE '
                  'RESTARE VUOTA. ⭐ L''asse e'' lo stato FISCALE, lo stesso di '
                  'dbops.vw_lotti_fermi_da_guardare: un lotto ancora pre-fiscale con un esito in '
                  'errore e'' un lotto fermo e lo dice quel presidio; uno congelato lo dice '
                  'questo. Nessun buco (congelato con stato_lotto IN_ESECUZIONE o ERRORE), nessun '
                  'doppione (COMPLETATO in bozza). ⭐ Le porte: COMPLETATO su un lotto fermo lo '
                  'rifiuta il database (trg_fatturazione_lotti_a10_guard_completato_upd); un esito '
                  'scritto ERRORE dopo il congelamento, o un congelamento con esiti in errore, '
                  'sono cio'' che questa vista sorveglia. ⭐ Un lotto annullato non compare perche'' '
                  'l''annullo gli chiude gli esiti (fn_annulla_lotto_da_draft), non per un filtro: '
                  'la vista non esclude gli annullati, e non deve. Legge '
                  'vendite.fatturazione_lotti_esiti, quindi vede anche i lotti senza perimetro (i '
                  'giri di massa). Lettore a catalogo: dbops.vw_lotti_congelati_con_errori_da_guardare. '
                  'Fino al 2026-11-07 si chiamava vw_lotti_chiusi_con_gruppi_in_errore e guardava '
                  'stato_lotto = COMPLETATO (storia: brief-db-esito-gruppo-lotto §15, §24, §25; '
                  'brief-db-annullamento-chiude-la-vita §9). Brief: brief-db-revisione-dbops, '
                  'giro 6 (Q14 ⑦).';

              COMMENT ON COLUMN vendite.vw_lotti_congelati_con_gruppi_in_errore.stato_lotto IS
                  'Lo stato del JOB del lotto: qui e'' un dato da leggere, non il criterio. Un '
                  'lotto congelato compare con qualunque stato_lotto, IN_ESECUZIONE ed ERRORE '
                  'compresi.';
              COMMENT ON COLUMN vendite.vw_lotti_congelati_con_gruppi_in_errore.stato_codice_interno IS
                  'Lo stato fiscale del lotto (config.stati_doc_fiscale.codice_interno), da '
                  'vendite.vw_lotti_fase: e'' l''asse del presidio. NULL se lo stato fiscale e'' '
                  'ignoto: il lotto compare lo stesso.';
              COMMENT ON COLUMN vendite.vw_lotti_congelati_con_gruppi_in_errore.gruppi_in_errore IS
                  'Quanti esiti del lotto (vendite.fatturazione_lotti_esiti) sono in ERRORE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il rollback non ricrea le viste vecchie: si ripristina dal changeSet
              -- di origine (20260907-15 per vendite, 20260923-33 per dbops).
              DROP VIEW IF EXISTS dbops.vw_lotti_congelati_con_errori_da_guardare;
              DROP VIEW IF EXISTS vendite.vw_lotti_congelati_con_gruppi_in_errore;
