# IL GATE ALL'EMISSIONE SOLLEVA IL CLIENTE MANCANTE
#   vendite.trgfn_ddt_guard_causale_emissione: ramo E_DDT_CLIENTE_OBBLIGATORIO.
#   Brief: brief-db-esecutivi-ba-coppia (§5.2, D-2)
#
#   Il motivo lo produce script.fn_check_ddt_emittibile (20261009-76); questo
#   guard e' gia' quello che solleva i motivi «di valore» dell'emissione, col
#   LOOP che cresce per ELSIF (lo dichiara il suo commento). Senza il ramo il
#   motivo uscirebbe dalla capability ma nessun trigger lo solleverebbe: il
#   LOOP non ha ELSE, di proposito.
#   VARIADIC: il documento (numero o id, come i fratelli) e il codice della
#   causale.
#
# Corpo: pg_get_functiondef del corpo vivo (= doc auto-gen, md5 verificato il
# 2026-10-09), con il solo ramo aggiunto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261009-77-update-trgfn-ddt-guard-causale-emissione-cliente-mctit.yaml

  - changeSet:
      id: 20261009-77-update-trgfn-ddt-guard-causale-emissione-cliente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_ddt_guard_causale_emissione: solleva E_DDT_CLIENTE_OBBLIGATORIO, il motivo
        nuovo di script.fn_check_ddt_emittibile. Brief: brief-db-esecutivi-ba-coppia (D-2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_causale_emissione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: gate all'emissione (EMESSO) di un DDT sul VALORE DELLA
              --   RIGA, in tre facce (brief-db-fatturazione-ddt-resi §4a, DL-28):
              --     1. la causale di trasporto e' dichiarata;
              --     2. se e' fatturabile, ogni riga attiva ha un prezzo
              --        risolvibile (proprio o ereditato dalla riga d'ordine);
              --     3. ogni riga attiva CHE PORTA UN PREZZO ha anche l'aliquota.
              --   rev 2026-07-19: valutazione delegata a
              --   script.fn_check_ddt_emittibile — single source con la capability.
              --   rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C):
              --   + E_DDT_RIGA_IVA_MANCANTE.
              --   rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2):
              --   + E_DDT_CLIENTE_OBBLIGATORIO (la causale vuole un cliente e il
              --   billing account manca).
              --
              -- ⚠️ IL NOME NOMINA LA SOLA CAUSALE, ed e' rimasto quello di quando
              --   il motivo era uno. Non si rinomina — costerebbe il trigger, ogni
              --   doc auto-gen e ogni pgTAP che la citano, per sola leggibilita' —
              --   ma chi legge non deve dedurlo: e' scritto qui.
              --
              -- ⚠️ Il LOOP non ha un ELSE: i motivi che questa funzione non
              --   riconosce li solleva un altro dei quattro guard di emissione. Un
              --   catch-all qui farebbe sollevare a QUESTO trigger anche gli
              --   indirizzi mancanti, con l'area e il nome sbagliati nel log.
              DECLARE
                  v_stato_codice  config.stati_doc_ddt.codice_interno%TYPE;
                  v_motivo        jsonb;
              BEGIN
                  SELECT sdd.codice_interno INTO v_stato_codice
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;

                  IF v_stato_codice IS DISTINCT FROM 'EMESSO' THEN
                      RETURN NEW;
                  END IF;

                  FOR v_motivo IN
                      SELECT jsonb_array_elements(script.fn_check_ddt_emittibile(NEW))
                  LOOP
                      IF v_motivo->>'codice' = 'E_DDT_CAUSALE_OBBLIGATORIA' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_CAUSALE_OBBLIGATORIA',
                              jsonb_build_object(
                                  'ddt_id', NEW.id,
                                  'numero', NEW.numero),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text)
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_CLIENTE_OBBLIGATORIO' THEN
                          -- rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2): la
                          --   causale manda merce a un cliente e il billing account
                          --   manca. Nel VARIADIC il documento e il CODICE della causale
                          --   (la cosa che l'operatore ha scelto e riconosce); il campo
                          --   da accendere e' il billing account — ma il codice e'
                          --   CONFLITTO_STATO come i fratelli: la richiesta e' «emetti».
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_CLIENTE_OBBLIGATORIO',
                              jsonb_build_object(
                                  'ddt_id',  NEW.id,
                                  'numero',  NEW.numero,
                                  'causale', v_motivo->'dettaglio'->>'causale'),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'causale', '?')
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_PREZZO_NON_RISOLVIBILE' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_PREZZO_NON_RISOLVIBILE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_id', 'NULL')
                          );
                      ELSIF v_motivo->>'codice' = 'E_DDT_RIGA_IVA_MANCANTE' THEN
                          -- ⚠️ Nel VARIADIC va il NUMERO di riga, non l'id: quel
                          --   valore riempie i %s, cioe' compone la frase che una
                          --   persona legge, e un id tecnico non si cerca a mano
                          --   sul documento. L'id viaggia nel context, che e' il
                          --   canale di chi diagnostica.
                          -- ⛔ E nessuna chiave `campo`: il codice e'
                          --   CONFLITTO_STATO, non DATO_ERRATO — la richiesta e'
                          --   «porta il DDT a EMESSO», e non c'e' un campo di
                          --   QUELLA richiesta da accendere.
                          PERFORM script.fn_log_and_raise_error(
                              'database', TG_NAME, 'E_DDT_RIGA_IVA_MANCANTE',
                              jsonb_build_object(
                                  'ddt_id',   NEW.id,
                                  'numero',   NEW.numero,
                                  'riga_id',  (v_motivo->'dettaglio'->>'riga_id')::bigint,
                                  'riga_nr',  (v_motivo->'dettaglio'->>'riga_nr')::integer),
                              NEW.tx_id,
                              COALESCE(NEW.numero, NEW.id::text),
                              COALESCE(v_motivo->'dettaglio'->>'riga_nr', '?')
                          );
                      END IF;
                  END LOOP;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_causale_emissione()
              IS 'Gate all''emissione DDT sul VALORE DELLA RIGA (brief-db-fatturazione-ddt-resi §4a, DL-28), in tre facce: (1) causale di trasporto obbligatoria — in DRAFT il NULL resta legittimo; (2) se la causale e'' fatturabile, ogni riga attiva deve avere un prezzo risolvibile (proprio o ereditato dalla riga ordine via fulfillment); (3) ogni riga attiva CHE PORTA UN PREZZO deve avere anche l''aliquota. rev 2026-07-19: valutazione delegata a script.fn_check_ddt_emittibile (single source con fn_available_actions_ddt); codici errore e argomenti invariati (544/545). ⭐ rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter): + E_DDT_RIGA_IVA_MANCANTE. Si e'' esteso questo guard invece di crearne uno nuovo perche'' e'' gia'' il gate del valore della riga e il LOOP con ELSIF per codice e'' fatto per crescere cosi''. ⚠️ Nel VARIADIC del codice nuovo va il NUMERO di riga e non l''id: quel valore compone la frase che legge una persona, e un id tecnico non si cerca a mano; l''id resta nel context. ⚠️ Il nome nomina la sola causale ed e'' rimasto quello di quando il motivo era uno: non si rinomina (costerebbe trigger, doc auto-gen e pgTAP per sola leggibilita''), ma lo Scopo nel corpo lo dichiara. rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2/D-2-bis): + E_DDT_CLIENTE_OBBLIGATORIO, la causale manda merce a un cliente (config.causali_trasporto.richiede_cliente) e la bolla non ha il billing account; VARIADIC: documento e codice della causale.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' nella doc auto-gen del 2026-10-09.
              SELECT 1;
