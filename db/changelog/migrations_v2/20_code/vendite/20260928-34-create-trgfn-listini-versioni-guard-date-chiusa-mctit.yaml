# ------------------------------------------------------------
# Le date di una versione di listino CHIUSA non si modificano piu'.
#
# -- IL BUCO ------------------------------------------------------------
#   Una versione passa ad ATTIVA -> CHIUSA solo a `valido_al` gia' scaduto
#   (trgfn_listini_versioni_guard_transizione_stato), ma dopo la chiusura
#   nessuno impediva di cambiarne le date: allungarne la fine la faceva tornare
#   «valida oggi» accanto all'ATTIVA, e spostarle riscriveva quale versione
#   valeva in un periodo gia' fatturato. Decisione di Tid, 2026-09-28: «non si
#   puo' modificare una sequenza di date di listino, sarebbe un disastro».
#   Brief: brief-db-liste-righe-documento §8.15, passo b).
#
# -- LA FORMA -----------------------------------------------------------
#   · trigger BEFORE UPDATE OF valido_dal, valido_al, WHEN (OLD.stato = 'CHIUSA'):
#     gira solo quando serve; `validita` e' derivata dalle due date, quindi non
#     si tocca da sola;
#   · rifiuta solo un CAMBIO vero (IS DISTINCT FROM): un UPDATE che riscrive lo
#     stesso valore passa;
#   · la chiusura stessa (ATTIVA -> CHIUSA con valido_al nello stesso UPDATE)
#     non e' toccata: OLD.stato e' ancora ATTIVA;
#   · codice nuovo E_LISTINO_VERSIONE_CHIUSA_DATE_IMMUTABILI (CONFLITTO_STATO,
#     catalogo e messaggi nello stesso giro); VARIADIC = il codice della versione.
#     ⚠️ La policy HTTP del codice sta in backend (error_policies.py): richiesta
#     al BE nel brief, o test_error_codes_db_policy_guardrail e' rosso.
#   · nome del trigger `a10_guard_date_chiusa`: fra i BEFORE ROW di a10 viene
#     dopo `a10_date_validita` (coerenza delle date) e prima di
#     `a10_guard_transizione_stato`, in ordine alfabetico.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-34-create-trgfn-listini-versioni-guard-date-chiusa-mctit.yaml

  - changeSet:
      id: 20260928-34-create-trgfn-listini-versioni-guard-date-chiusa
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Guard: le date (valido_dal, valido_al) di una versione di listino CHIUSA non si
        modificano piu' (E_LISTINO_VERSIONE_CHIUSA_DATE_IMMUTABILI). Chiude il buco che
        poteva far tornare valida una versione chiusa accanto all'attiva.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_versioni_guard_date_chiusa()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: rifiutare il cambio di valido_dal / valido_al su una
              --   versione di listino CHIUSA. Una versione chiusa e' la storia dei
              --   prezzi di un periodo: spostarne le date riscrive quale versione
              --   valeva in quelle date, e allungarne la fine la fa tornare valida
              --   accanto all'ATTIVA.
              -- Uso:   BEFORE UPDATE OF valido_dal, valido_al FOR EACH ROW
              --        WHEN (OLD.stato = 'CHIUSA').
              -- brief-db-liste-righe-documento §8.15 b), 2026-09-28.
              BEGIN
                  IF NEW.valido_dal IS DISTINCT FROM OLD.valido_dal
                     OR NEW.valido_al IS DISTINCT FROM OLD.valido_al THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          TG_NAME::text,
                          'E_LISTINO_VERSIONE_CHIUSA_DATE_IMMUTABILI',
                          jsonb_build_object(
                              'versione_id',   OLD.id,
                              'listino_id',    OLD.listino_id,
                              'valido_dal_da', OLD.valido_dal,
                              'valido_dal_a',  NEW.valido_dal,
                              'valido_al_da',  OLD.valido_al,
                              'valido_al_a',   NEW.valido_al),
                          NEW.tx_id,
                          OLD.codice_versione::text);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_versioni_guard_date_chiusa() IS
                  'Guard: le date di validita'' (valido_dal, valido_al) di una versione di listino '
                  'CHIUSA non si modificano piu'' (E_LISTINO_VERSIONE_CHIUSA_DATE_IMMUTABILI). Una '
                  'versione chiusa e'' la storia dei prezzi di un periodo: spostarne le date '
                  'riscriverebbe quale versione valeva in quelle date, e allungarne la fine la farebbe '
                  'tornare valida accanto all''ATTIVA. Rifiuta solo un cambio vero (IS DISTINCT FROM); '
                  'la chiusura stessa (ATTIVA -> CHIUSA) non e'' toccata. Con '
                  'ex_listini_versioni_no_overlap esteso a CHIUSA garantisce che per ogni data la '
                  'versione in vigore sia al piu'' una (vendite.fn_listino_versione_in_vigore). '
                  'Decisione di Tid del 2026-09-28, brief-db-liste-righe-documento §8.15.';

              CREATE TRIGGER trg_listini_versioni_a10_guard_date_chiusa_upd
                  BEFORE UPDATE OF valido_dal, valido_al ON vendite.listini_versioni
                  FOR EACH ROW
                  WHEN (OLD.stato = 'CHIUSA')
                  EXECUTE FUNCTION vendite.trgfn_listini_versioni_guard_date_chiusa();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_listini_versioni_a10_guard_date_chiusa_upd
                  ON vendite.listini_versioni;
              DROP FUNCTION IF EXISTS vendite.trgfn_listini_versioni_guard_date_chiusa();
