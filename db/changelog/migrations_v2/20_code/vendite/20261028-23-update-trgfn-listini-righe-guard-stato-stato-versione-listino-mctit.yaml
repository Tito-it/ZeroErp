# IL GUARD DELLE RIGHE DI LISTINO: LO STATO DELLA VERSIONE DAL VOCABOLARIO
#   Brief: brief-modello-documento-vendita §16 (giro 12; L-1 di Tid,
#   2026-10-28). Corpo di partenza: 20260818-51, uguale al vivo.
#
#   La colonna stato (testo col CHECK) e' diventata stato_doc_listino_versione_id
#   (id del vocabolario config.stati_doc_listino_versioni, 20261028-04). Qui il
#   codice si legge dal vocabolario con una JOIN; i confronti coi codici
#   (codice_interno, la chiave stabile) restano quelli di prima. Nient'altro cambia.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261028-23-update-trgfn-listini-righe-guard-stato-stato-versione-listino-mctit.yaml

  - changeSet:
      id: 20261028-23-update-trgfn-listini-righe-guard-stato-stato-versione-listino
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_righe_guard_stato: il guard delle righe di listino: lo stato della
        versione dal vocabolario. Brief: brief-modello-documento-vendita §16 (L-1).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: listini_versioni
                columnName: stato_doc_listino_versione_id
            - tableExists: { schemaName: config, tableName: stati_doc_listino_versioni }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: protezione righe listino in base allo stato della versione padre.
              --   BOZZA  → passa sempre
              --   ATTIVA → ammessa solo se la riga non e` propagata a valle
              --   CHIUSA → blocca sempre
              -- Perimetro: solo UPDATE e DELETE (INSERT su ATTIVA e` ammesso come rettifica).
              DECLARE
                  v_stato config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_propagata boolean;
              BEGIN
                  -- Recupera stato della versione padre
                  SELECT s.codice_interno
                    INTO v_stato
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = OLD.listino_versione_id;

                  -- BOZZA: modifica libera
                  IF v_stato = 'BOZZA' THEN
                      RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                  END IF;

                  -- CHIUSA: blocca sempre
                  IF v_stato = 'CHIUSA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          -- ⚠️ ARITA' (2026-08-18): il messaggio comincia con «Operazione %s
                          --   non ammessa: ...» e di segnaposto ne ha TRE; qui ne arrivavano
                          --   due. Mancava proprio il primo, l'operazione — che il trigger
                          --   aveva gia' in mano (TG_OP) e metteva perfino nel context.
                          TG_OP, OLD.id::text, v_stato
                      );
                  END IF;

                  -- ATTIVA: verifica propagazione
                  -- Tabelle controllate per propagazione riga:
                  -- 1. vendite.commesse_attivita (listino_riga_id)
                  -- 2. vendite.attivita_fatturabili (listino_riga_id)
                  -- Per aggiungere nuove tabelle: UNION ALL qui sotto
                  SELECT EXISTS(
                      SELECT 1 FROM vendite.commesse_attivita
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.attivita_fatturabili
                       WHERE listino_riga_id = OLD.id
                  )
                  INTO v_propagata;

                  IF v_propagata THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_PROPAGATA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          OLD.id::text
                      );
                  END IF;

                  -- ATTIVA e non propagata: rettifica controllata ammessa
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato() IS
                  'Guard N6: protegge righe listino in base a stato versione. BOZZA=passa, ATTIVA=solo se non propagata, CHIUSA=blocca. Solo UPDATE/DELETE. Rev 2026-10-28 (20261028-23, brief-modello-documento-vendita §16, L-1): lo stato della versione di listino si legge dal vocabolario config.stati_doc_listino_versioni (codice_interno), non piu'' dalla colonna testo stato.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima nominava la colonna stato, che solo il
              -- rollback del 20261028-04 rimette: si torna dal 20260818-51.
              SELECT 1;
