# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Guard N6 terzo livello: protegge le righe listino in base
# allo stato della versione padre.
#
# - BOZZA: passa sempre (modifica libera)
# - ATTIVA: ammessa solo se la riga non e` propagata
#   (nessun riferimento in commesse_attivita o attivita_fatturabili)
# - CHIUSA: blocca sempre
#
# Solo UPDATE e DELETE — INSERT su versione ATTIVA e` ammesso
# (aggiunta riga = rettifica controllata).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260412-37-create-trgfn-listini-righe-guard-stato-mctit.yaml

  - changeSet:
      id: 20260412-37-create-trgfn-listini-righe-guard-stato
      author: mctit
      runOnChange: false
      comment: >
        Guard stato versione su UPDATE/DELETE di vendite.listini_righe.
        BOZZA = passa, ATTIVA = solo se non propagata, CHIUSA = blocca.
        Terzo livello di protezione N6 (espansione concentrica).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_stato()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $fn$
              -- Scopo: protezione righe listino in base allo stato della versione padre.
              --   BOZZA  → passa sempre
              --   ATTIVA → ammessa solo se la riga non e` propagata a valle
              --   CHIUSA → blocca sempre
              -- Perimetro: solo UPDATE e DELETE (INSERT su ATTIVA e` ammesso come rettifica).
              DECLARE
                  v_stato vendite.listini_versioni.stato%TYPE;
                  v_propagata boolean;
              BEGIN
                  -- Recupera stato della versione padre
                  SELECT lv.stato
                    INTO v_stato
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = OLD.listino_versione_id;

                  -- BOZZA: modifica libera
                  IF v_stato = 'BOZZA' THEN
                      RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
                  END IF;

                  -- CHIUSA: blocca sempre
                  IF v_stato = 'CHIUSA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          OLD.id::text, v_stato
                      );
                  END IF;

                  -- ATTIVA: verifica propagazione
                  -- Tabelle controllate per propagazione riga:
                  -- 1. vendite.commesse_attivita (listino_riga_id)
                  -- 2. vendite.attivita_fatturabili (listino_riga_id)
                  -- Per aggiungere nuove tabelle: UNION ALL qui sotto
                  SELECT EXISTS(
                      SELECT 1 FROM vendite.commesse_attivita
                       WHERE listino_riga_id = OLD.id
                      UNION ALL
                      SELECT 1 FROM vendite.attivita_fatturabili
                       WHERE listino_riga_id = OLD.id
                  )
                  INTO v_propagata;

                  IF v_propagata THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'vendite.trgfn_listini_righe_guard_stato',
                          'E_RIGA_LISTINO_PROPAGATA',
                          jsonb_build_object(
                              'listino_riga_id', OLD.id,
                              'listino_versione_id', OLD.listino_versione_id,
                              'stato', v_stato,
                              'operazione', TG_OP
                          ),
                          OLD.tx_id,
                          OLD.id::text
                      );
                  END IF;

                  -- ATTIVA e non propagata: rettifica controllata ammessa
                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $fn$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_stato()
              IS 'Guard N6: protegge righe listino in base a stato versione. BOZZA=passa, ATTIVA=solo se non propagata, CHIUSA=blocca. Solo UPDATE/DELETE.';

              -- Trigger fase _a10_ (guard/block) — solo UPDATE e DELETE
              DROP TRIGGER IF EXISTS trg_listini_righe_a10_guard_stato_upd_dlt ON vendite.listini_righe;

              CREATE TRIGGER trg_listini_righe_a10_guard_stato_upd_dlt
                  BEFORE UPDATE OR DELETE
                  ON vendite.listini_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_listini_righe_guard_stato();
