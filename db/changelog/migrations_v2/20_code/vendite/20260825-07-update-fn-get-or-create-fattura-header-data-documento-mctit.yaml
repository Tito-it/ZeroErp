# DB-6 — LA DATA DELLA FATTURA SMETTE DI ESSERE UN EFFETTO COLLATERALE
#   vendite.fn_get_or_create_fattura_header
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §4 DB-6
#
# ── ⛔ QUESTA E' L'UNICA RIGA IN TUTTO IL REPO CHE SCRIVE fatture.data ─
#   Verificato il 2026-08-25 su `pg_proc` (nessun'altra funzione fa `INSERT INTO
#   vendite.fatture (`, nessuna fa `SET data =`), su `backend/` e sulla doc
#   auto-gen: non c'e' un secondo scrittore, non c'e' un endpoint, non c'e' una
#   schermata. **Cambiarla qui cambia il comportamento ovunque**, ed e' anche il
#   motivo per cui il difetto e' rimasto invisibile: non c'era nessun posto in
#   cui guardare due implementazioni divergenti.
#
# ── PRIMA / DOPO, IN UNA RIGA ───────────────────────────────────────
#   prima:  VALUES (v_registro_id, current_date, ...)
#   dopo:   VALUES (v_registro_id, v_data,       ...)
#           con v_data = fn_calcola_data_documento(registro, competenza, dichiarata)
#
#   `current_date` faceva due danni insieme: prendeva la data del giorno in cui
#   qualcuno ha premuto «Fattura» (non una decisione: l'orario di un batch), e la
#   prendeva nel fuso DELLA SESSIONE — UTC da Django. Ogni documento generato fra
#   la mezzanotte e le 02:00 locali portava la data del giorno prima.
#
# ── ⭐ IL LOTTO SI LEGGE SOLO QUANDO SERVE ──────────────────────────
#   La lettura sta DOPO il lookup della fattura esistente, non prima: la
#   funzione gira una volta per ATTIVITA', e nella stragrande maggioranza dei
#   giri trova la testata gia' creata e ritorna subito. Mettere la lettura in
#   testa avrebbe aggiunto una query per ogni attivita' di ogni lotto per un
#   valore che serve solo alla prima.
#
# ── ⚠️ IL LOTTO HA LA RLS, E QUI E' UN BENE ─────────────────────────
#   `vendite.fatturazione_lotti` ha `rls_fatturazione_lotti_ef_whitelist` (FOR
#   ALL) e questa funzione e' SECURITY INVOKER: un lotto fuori dal perimetro
#   emittente di chi opera si legge come «non c'e'» e si esce con
#   `E_LOTTO_NON_TROVATO`. E' fail-closed, ed e' la risposta giusta — non si
#   crea una testata dentro un lotto che non si puo' vedere.
#   ⚠️ Il ramo non era raggiungibile prima (la funzione il lotto non lo leggeva
#   affatto): e' un controllo NUOVO, e va detto, perche' un `p_lotto_id`
#   sbagliato oggi produce una fattura orfana e domani un errore parlante.
#
# ── ⛔ COSA NON E' CAMBIATO, e va verificato leggendo ────────────────
#   Tutto il resto e' il corpo vivo del 2026-08-18, ripreso dalla doc auto-gen
#   e non da uno YAML: la chiave a undici elementi, i quattro
#   `IS NOT DISTINCT FROM` sui nullable, il `=` sulla natura, il controllo di
#   completezza, il lookup dello stato DRAFT, la INSERT sul ponte lotto-fattura.
#   ⚠️ In particolare la `serie` resta scritta nella INSERT: e' la meta' che
#   mancava fino al 18-08 e senza la quale una nota di credito prendeva un
#   numero valido nella serie delle fatture.
#
# Dipendenze: 20260825-06 (fn_calcola_data_documento), che a sua volta vuole
#             20260825-02, -03 e -04. ⚠️ E vuole la riga SYSTEM_FUSO_ORARIO in
#             config.parameters, che arriva in 80_data: fra il migrate di questa
#             fase e il caricamento del CSV, una fattura su un registro OGGI
#             non si crea e lo dice (E_CONFIG_MANCANTE). E' voluto — meglio un
#             errore parlante che una data presa da un fuso a caso — ma va
#             saputo: NON si generano bozze in mezzo a un migrate.
# Verifica: db/pgtap/vendite/test-chiave-fattura-tre-specchi-v1.sql (invariato)
#           + i casi 6/7 di DB-13
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260825-07-update-fn-get-or-create-fattura-header-data-documento-mctit.yaml

  - changeSet:
      id: 20260825-07-update-fn-get-or-create-fattura-header-data-documento
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-6: la testata della fattura smette di nascere con current_date e prende la data da
        vendite.fn_calcola_data_documento(registro, competenza del lotto, data dichiarata sul
        lotto). ⛔ E' l'UNICA riga in tutto il repo che scrive vendite.fatture.data (verificato
        su pg_proc, backend e doc auto-gen): cambiarla qui cambia il comportamento ovunque.
        current_date faceva due danni insieme — prendeva l'istante del batch invece di una
        decisione, e lo prendeva nel fuso della SESSIONE, che da Django e' UTC (7 fatture su
        18 sfasate di un giorno). Il lotto si legge solo quando la testata va creata davvero,
        non a ogni attivita'. ⚠️ Il lotto ha la RLS: fuori perimetro si esce con
        E_LOTTO_NON_TROVATO, ed e' un controllo NUOVO. Tutto il resto e' il corpo vivo del
        2026-08-18, ripreso dalla doc auto-gen.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti
                columnName: data_documento
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_calcola_data_documento';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_fattura_header(p_lotto_id bigint, p_attivita_id bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: recupera o crea la testata DRAFT della fattura a cui
              --        l'attivita' appartiene, dentro il lotto dato.
              -- Regole: il `WHERE` del lookup e la INSERT devono nominare gli
              --         STESSI elementi della chiave prodotta da
              --         fn_build_fattura_key (§6). Se la chiave separa e il
              --         lookup no, le due meta' si annullano e le attivita'
              --         tornano nella stessa fattura.
              -- rev 2026-08-04 (D-M): la INSERT sul ponte non nomina piu'
              --         `esclusa`: era l'unico punto che la scriveva, e ci
              --         scriveva la costante FALSE.
              -- rev 2026-08-18 (brief nota di credito, N3): la chiave ha
              --         undici elementi. Natura e serie entrano nel WHERE E
              --         nella INSERT. ⚠️ La serie in particolare non era MAI
              --         stata scritta da qui: restava NULL e la numerazione
              --         cadeva sul serie_default del registro. Calcolarla
              --         senza scriverla avrebbe dato alla nota di credito un
              --         numero valido nella serie delle fatture.
              -- rev 2026-08-25 (DB-6, cantiere numerazione-data-documento):
              --         la data non e' piu' `current_date`. ⛔ Questa e' l'unica
              --         riga in tutto il repo che scrive vendite.fatture.data,
              --         e `current_date` faceva due danni insieme: prendeva il
              --         giorno in cui qualcuno ha premuto «Fattura» — l'orario
              --         di un batch, non una decisione — e lo prendeva nel fuso
              --         DELLA SESSIONE, che da Django e' UTC. Ogni documento
              --         generato fra la mezzanotte e le 02:00 locali portava la
              --         data del giorno prima (7 fatture su 18, misurate).
              DECLARE
                  v_key          JSONB;
                  v_fattura_id   vendite.fatture.id%TYPE;
                  v_stato_doc_id config.stati_doc_fiscale.id%TYPE;
                  v_registro_id  vendite.registri_fatturazione.id%TYPE;
                  v_ba_id        anagrafiche.billing_account.id%TYPE;
                  v_tipo_doc_id  config.tipi_doc_fiscale.id%TYPE;
                  v_natura_id    config.nature_doc_fiscale.id%TYPE;
                  v_valuta_id    config.valute.id%TYPE;
                  v_utility_id   config.utilities.id%TYPE;
                  v_emittente_id anagrafiche.soggetti_ruoli.id%TYPE;
                  v_reseller_id  anagrafiche.soggetti_ruoli.id%TYPE;
                  v_serie        vendite.fatture.serie%TYPE;
                  v_termine_id   config.termini_pagamento.id%TYPE;
                  v_modalita_id  config.modalita_pagamento.id%TYPE;
                  -- rev 2026-08-25: i tre ingredienti della data.
                  v_competenza_mese vendite.fatturazione_lotti.competenza_mese%TYPE;
                  v_data_dichiarata vendite.fatturazione_lotti.data_documento%TYPE;
                  v_data            vendite.fatture.data%TYPE;
              BEGIN
                  -- Guard: parametri obbligatori
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_attivita_id IS NULL OR p_attivita_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id/p_attivita_id', 'lotto_id', p_lotto_id, 'attivita_id', p_attivita_id),
                          NULL::uuid, 'p_lotto_id e p_attivita_id obbligatori e > 0'
                      );
                  END IF;

                  -- Chiave documento dall'attivita': undici elementi, e da qui
                  -- in giu' vanno usati tutti e undici.
                  v_key := vendite.fn_build_fattura_key(p_attivita_id);
                  v_ba_id        := (v_key->>'billing_account_id')::BIGINT;
                  v_tipo_doc_id  := (v_key->>'tipo_doc_fiscale_id')::BIGINT;
                  v_natura_id    := (v_key->>'natura_doc_id')::BIGINT;
                  v_valuta_id    := (v_key->>'valuta_id')::INTEGER;
                  v_emittente_id := (v_key->>'emittente_soggetto_ruolo_id')::BIGINT;
                  v_reseller_id  := NULLIF(v_key->>'reseller_soggetto_ruolo_id', '')::BIGINT;
                  v_utility_id   := NULLIF(v_key->>'utility_id', '')::INTEGER;
                  v_registro_id  := (v_key->>'registro_id')::BIGINT;
                  v_serie        := NULLIF(v_key->>'serie', '')::VARCHAR;
                  v_termine_id   := NULLIF(v_key->>'termine_pagamento_id', '')::BIGINT;
                  v_modalita_id  := NULLIF(v_key->>'modalita_pagamento_id', '')::INTEGER;

                  -- Completezza della chiave: si pretendono solo gli elementi
                  -- che NON possono legittimamente mancare. utility_id entra
                  -- nell'elenco perche' anagrafiche.billing_account.utility_id e'
                  -- NOT NULL: se qui arriva vuoto, la chiave e' rotta, non
                  -- «senza utility». Stesso ragionamento per natura_doc_id, che
                  -- e' NOT NULL su attivita_fatturabili. Termine e modalita'
                  -- restano fuori, e non e' una dimenticanza: la modalita' e'
                  -- NULL nella maggioranza dei casi (nessun default inventato,
                  -- finirebbe sulla FatturaPA) e il termine ha il default
                  -- TP_1RATA della catena — la sua assenza la presidia la Fase 4
                  -- al momento di generare le rate. E la SERIE resta fuori
                  -- perche' NULL e' il suo valore normale: significa «vale il
                  -- serie_default del registro».
                  IF v_ba_id IS NULL OR v_tipo_doc_id IS NULL OR v_natura_id IS NULL
                     OR v_valuta_id IS NULL
                     OR v_emittente_id IS NULL OR v_utility_id IS NULL OR v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_VALORE_MANCANTE',
                          jsonb_build_object('attivita_id', p_attivita_id, 'chiave', v_key),
                          NULL::uuid, concat('chiave documento incompleta per attivita_id ', p_attivita_id)
                      );
                  END IF;

                  -- Stato DRAFT
                  SELECT id INTO v_stato_doc_id
                    FROM config.stati_doc_fiscale
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE
                   ORDER BY id LIMIT 1;

                  IF v_stato_doc_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'DRAFT'),
                          NULL::uuid, 'stato DRAFT non trovato'
                      );
                  END IF;

                  -- Cerca fattura gia' nel lotto con la stessa chiave.
                  -- ⚠️ IS NOT DISTINCT FROM sui QUATTRO elementi nullable: con
                  -- `=` il NULL non combacia mai, quindi ogni giro aprirebbe una
                  -- fattura nuova per i casi — che sono la maggioranza — in cui
                  -- reseller, modalita' o serie non ci sono. E' la stessa
                  -- trappola dei NULL gia' pagata in 3b.0-b sul WHERE della
                  -- commessa e in 3b.4-bis sull'indice d'ambito, terza forma.
                  -- La NATURA invece usa `=`: e' NOT NULL, e un confronto
                  -- permissivo nasconderebbe sotto una uguaglianza un valore che
                  -- non puo' mancare.
                  SELECT f.id INTO v_fattura_id
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND f.billing_account_id = v_ba_id
                     AND f.tipo_doc_fiscale_id = v_tipo_doc_id
                     AND f.natura_doc_id = v_natura_id
                     AND f.valuta_id = v_valuta_id
                     AND f.emittente_soggetto_ruolo_id = v_emittente_id
                     AND f.reseller_soggetto_ruolo_id IS NOT DISTINCT FROM v_reseller_id
                     AND f.utility_id IS NOT DISTINCT FROM v_utility_id
                     AND f.registro_id = v_registro_id
                     AND f.serie IS NOT DISTINCT FROM v_serie
                     AND f.termine_pagamento_id IS NOT DISTINCT FROM v_termine_id
                     AND f.modalita_pagamento_id IS NOT DISTINCT FROM v_modalita_id
                   ORDER BY f.id LIMIT 1;

                  IF v_fattura_id IS NOT NULL THEN RETURN v_fattura_id; END IF;

                  -- ─── rev 2026-08-25 (DB-6): LA DATA ───────────────────────
                  -- ⭐ Il lotto si legge QUI e non in testa: questa funzione gira
                  --    una volta per ATTIVITA', e nella stragrande maggioranza
                  --    dei giri esce dalla riga qui sopra con la testata gia'
                  --    creata. In testa, sarebbe una query in piu' per ogni
                  --    attivita' di ogni lotto, per un valore che serve solo
                  --    alla prima.
                  -- ⚠️ fatturazione_lotti ha la RLS (ef_whitelist, FOR ALL) e
                  --    questa funzione e' SECURITY INVOKER: un lotto fuori dal
                  --    perimetro di chi opera si legge come «non c'e'». E'
                  --    fail-closed ed e' la risposta giusta — non si crea una
                  --    testata dentro un lotto che non si puo' vedere.
                  SELECT fl.competenza_mese, fl.data_documento
                    INTO v_competenza_mese, v_data_dichiarata
                    FROM vendite.fatturazione_lotti fl
                   WHERE fl.id = p_lotto_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_lotto_id,
                                             'attivita_id', p_attivita_id),
                          NULL::uuid, p_lotto_id::text
                      );
                  END IF;

                  -- ⭐ La regola sta nel registro (e la dichiarazione sul lotto
                  --    la scavalca): qui non si decide niente, si chiede.
                  v_data := vendite.fn_calcola_data_documento(
                                v_registro_id, v_competenza_mese, v_data_dichiarata);

                  -- Crea fattura + link lotto. Le colonne di testata sono il
                  -- secondo specchio: quello che la chiave ha deciso, qui si
                  -- scrive. ⚠️ `serie` compresa: e' la meta' che mancava.
                  INSERT INTO vendite.fatture (registro_id, data, tipo_doc_fiscale_id, natura_doc_id,
                      stato_doc_fiscale_id, serie,
                      emittente_soggetto_ruolo_id, billing_account_id, reseller_soggetto_ruolo_id,
                      utility_id, valuta_id, tasso_cambio,
                      termine_pagamento_id, modalita_pagamento_id, meta)
                  VALUES (v_registro_id, v_data, v_tipo_doc_id, v_natura_id,
                      v_stato_doc_id, v_serie,
                      v_emittente_id, v_ba_id, v_reseller_id,
                      v_utility_id, v_valuta_id, 1,
                      v_termine_id, v_modalita_id, jsonb_build_object('lotto_id', p_lotto_id))
                  RETURNING id INTO v_fattura_id;

                  INSERT INTO vendite.fatturazione_lotti_fatture (lotto_id, fattura_id, meta)
                  VALUES (p_lotto_id, v_fattura_id, jsonb_build_object('origine', 'bozza'));

                  RETURN v_fattura_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_fattura_header(p_lotto_id bigint, p_attivita_id bigint)
                IS 'Recupera o crea la testata DRAFT della fattura a cui l''attivita'' appartiene, dentro il lotto dato. Il WHERE del lookup e la INSERT nominano gli STESSI elementi della chiave di fn_build_fattura_key: se la chiave separa e il lookup no, le due meta'' si annullano e le attivita'' tornano nella stessa fattura. rev 2026-08-18 (brief-design-note-credito-resi N3): la chiave ha undici elementi, natura e serie compresi. ⚠️ `serie` non era MAI stata scritta da questa INSERT — restava NULL e fn_assign_numero_fattura cadeva sul serie_default del registro: calcolarla senza scriverla avrebbe dato alla nota di credito un numero VALIDO nella serie delle fatture, cioe'' un difetto che non solleva nulla e si scopre guardando un registro IVA. Confronto: `=` sulla natura (NOT NULL), IS NOT DISTINCT FROM sui quattro nullable (reseller, utility, serie, modalita''/termine). ⭐ rev 2026-08-25 (DB-6, cantiere numerazione-data-documento): la data non e'' piu'' `current_date` ma vendite.fn_calcola_data_documento(registro, competenza del lotto, data dichiarata sul lotto). ⛔ Questa e'' l''UNICA riga in tutto il repo che scrive vendite.fatture.data — verificato su pg_proc, su backend/ e sulla doc auto-gen — quindi cambiarla qui cambia il comportamento ovunque, ed e'' anche il motivo per cui il difetto e'' rimasto invisibile: non c''era un secondo posto in cui vedere due implementazioni divergenti. `current_date` faceva due danni insieme: prendeva il giorno in cui qualcuno ha premuto «Fattura» (l''orario di un batch, non una decisione) e lo prendeva nel fuso DELLA SESSIONE, che da Django e'' UTC — ogni documento generato fra mezzanotte e le 02:00 locali portava la data del giorno prima, misurato su 7 fatture su 18. ⭐ Il lotto si legge DOPO il lookup e non in testa: la funzione gira una volta per attivita'' e quasi sempre trova la testata gia'' creata, quindi in testa sarebbe una query in piu'' per ogni attivita'' di ogni lotto. ⚠️ vendite.fatturazione_lotti ha la RLS e questa funzione e'' SECURITY INVOKER: un lotto fuori perimetro si legge come «non c''e''» e si esce con E_LOTTO_NON_TROVATO — controllo NUOVO, prima il lotto non veniva letto affatto. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §4 DB-6.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Il rollback rimette `current_date`, cioe' il difetto: e' cio'
              --    che un rollback deve fare. Ripristina il corpo del 2026-08-18
              --    per intero, senza la lettura del lotto.
              --    Vedi la doc auto-gen docs/it/dbzero/vendite/funzioni/fn_get_or_create_fattura_header.md
              --    alla revisione precedente per il testo integrale.
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_fattura_header(p_lotto_id bigint, p_attivita_id bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_key          JSONB;
                  v_fattura_id   vendite.fatture.id%TYPE;
                  v_stato_doc_id config.stati_doc_fiscale.id%TYPE;
                  v_registro_id  vendite.registri_fatturazione.id%TYPE;
                  v_ba_id        anagrafiche.billing_account.id%TYPE;
                  v_tipo_doc_id  config.tipi_doc_fiscale.id%TYPE;
                  v_natura_id    config.nature_doc_fiscale.id%TYPE;
                  v_valuta_id    config.valute.id%TYPE;
                  v_utility_id   config.utilities.id%TYPE;
                  v_emittente_id anagrafiche.soggetti_ruoli.id%TYPE;
                  v_reseller_id  anagrafiche.soggetti_ruoli.id%TYPE;
                  v_serie        vendite.fatture.serie%TYPE;
                  v_termine_id   config.termini_pagamento.id%TYPE;
                  v_modalita_id  config.modalita_pagamento.id%TYPE;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 OR p_attivita_id IS NULL OR p_attivita_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id/p_attivita_id', 'lotto_id', p_lotto_id, 'attivita_id', p_attivita_id),
                          NULL::uuid, 'p_lotto_id e p_attivita_id obbligatori e > 0'
                      );
                  END IF;

                  v_key := vendite.fn_build_fattura_key(p_attivita_id);
                  v_ba_id        := (v_key->>'billing_account_id')::BIGINT;
                  v_tipo_doc_id  := (v_key->>'tipo_doc_fiscale_id')::BIGINT;
                  v_natura_id    := (v_key->>'natura_doc_id')::BIGINT;
                  v_valuta_id    := (v_key->>'valuta_id')::INTEGER;
                  v_emittente_id := (v_key->>'emittente_soggetto_ruolo_id')::BIGINT;
                  v_reseller_id  := NULLIF(v_key->>'reseller_soggetto_ruolo_id', '')::BIGINT;
                  v_utility_id   := NULLIF(v_key->>'utility_id', '')::INTEGER;
                  v_registro_id  := (v_key->>'registro_id')::BIGINT;
                  v_serie        := NULLIF(v_key->>'serie', '')::VARCHAR;
                  v_termine_id   := NULLIF(v_key->>'termine_pagamento_id', '')::BIGINT;
                  v_modalita_id  := NULLIF(v_key->>'modalita_pagamento_id', '')::INTEGER;

                  IF v_ba_id IS NULL OR v_tipo_doc_id IS NULL OR v_natura_id IS NULL
                     OR v_valuta_id IS NULL
                     OR v_emittente_id IS NULL OR v_utility_id IS NULL OR v_registro_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_VALORE_MANCANTE',
                          jsonb_build_object('attivita_id', p_attivita_id, 'chiave', v_key),
                          NULL::uuid, concat('chiave documento incompleta per attivita_id ', p_attivita_id)
                      );
                  END IF;

                  SELECT id INTO v_stato_doc_id
                    FROM config.stati_doc_fiscale
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE
                   ORDER BY id LIMIT 1;

                  IF v_stato_doc_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_or_create_fattura_header', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno', 'DRAFT'),
                          NULL::uuid, 'stato DRAFT non trovato'
                      );
                  END IF;

                  SELECT f.id INTO v_fattura_id
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND f.billing_account_id = v_ba_id
                     AND f.tipo_doc_fiscale_id = v_tipo_doc_id
                     AND f.natura_doc_id = v_natura_id
                     AND f.valuta_id = v_valuta_id
                     AND f.emittente_soggetto_ruolo_id = v_emittente_id
                     AND f.reseller_soggetto_ruolo_id IS NOT DISTINCT FROM v_reseller_id
                     AND f.utility_id IS NOT DISTINCT FROM v_utility_id
                     AND f.registro_id = v_registro_id
                     AND f.serie IS NOT DISTINCT FROM v_serie
                     AND f.termine_pagamento_id IS NOT DISTINCT FROM v_termine_id
                     AND f.modalita_pagamento_id IS NOT DISTINCT FROM v_modalita_id
                   ORDER BY f.id LIMIT 1;

                  IF v_fattura_id IS NOT NULL THEN RETURN v_fattura_id; END IF;

                  INSERT INTO vendite.fatture (registro_id, data, tipo_doc_fiscale_id, natura_doc_id,
                      stato_doc_fiscale_id, serie,
                      emittente_soggetto_ruolo_id, billing_account_id, reseller_soggetto_ruolo_id,
                      utility_id, valuta_id, tasso_cambio,
                      termine_pagamento_id, modalita_pagamento_id, meta)
                  VALUES (v_registro_id, current_date, v_tipo_doc_id, v_natura_id,
                      v_stato_doc_id, v_serie,
                      v_emittente_id, v_ba_id, v_reseller_id,
                      v_utility_id, v_valuta_id, 1,
                      v_termine_id, v_modalita_id, jsonb_build_object('lotto_id', p_lotto_id))
                  RETURNING id INTO v_fattura_id;

                  INSERT INTO vendite.fatturazione_lotti_fatture (lotto_id, fattura_id, meta)
                  VALUES (p_lotto_id, v_fattura_id, jsonb_build_object('origine', 'bozza'));

                  RETURN v_fattura_id;
              END;
              $function$;
