# Trigger su vendite.preventivi_righe (tabella esistente):
# propaga quantita ai figli in preventivi_righe_componenti
# quando la quantita della riga padre cambia.
#
# File separato da YAML 08 perche' agisce su una tabella diversa
# (preventivi_righe, gia' esistente) rispetto alla tabella nuova.
#
# Naming _z90_propaga_: fase finale, ordine lessicografico
# 'propaga' < 'ricalcola' garantisce esecuzione prima di
# trg_preventivi_righe_z90_ricalcola_totali_*.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-09-create-trg-preventivi-righe-propaga-qta-componenti-mctit.yaml

  - changeSet:
      id: 20260511-09-01-trg-prevrighe-z90-propaga-qta-componenti
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        AFTER UPDATE OF quantita su vendite.preventivi_righe _z90_:
        propaga la nuova quantita ai componenti BoM CASO A come
        quantita = coeff_qta_snapshot * NEW.quantita.
        UPDATE OF quantita: scatta solo quando quantita cambia,
        evita overhead su ogni UPDATE.
        Ordine: _z90_propaga_ < _z90_ricalcola_ (lessicografico).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: preventivi_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_componenti_propaga_qta';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_z90_propaga_qta_componenti_upd
                  ON vendite.preventivi_righe;

              CREATE TRIGGER trg_preventivi_righe_z90_propaga_qta_componenti_upd
                  AFTER UPDATE OF quantita
                  ON vendite.preventivi_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_propaga_qta(
                      'vendite',
                      'preventivi_righe_componenti',
                      'riga_preventivo_id'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_z90_propaga_qta_componenti_upd
                  ON vendite.preventivi_righe;
