                          SELECT orr.id, orr.riga_nr, 'PREVENTIVO'::text, 'CONSUMO'::text,
                                 pr.preventivo_id, orr.preventivo_riga_id, orr.quantita::numeric
                            FROM vendite.ordini_righe orr
