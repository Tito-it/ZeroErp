# IL LETTORE UNICO DEI LEGAMI CONOSCE LA COMMESSA
#   vendite.fn_documento_legami('COMMESSA', p_id)
#   Brief: brief-db-annullo-a-valle-riapre-a-monte (D-1, D-2, D-7 di Tid; R-1)
#
# ── I LEGAMI DI UNA COMMESSA ────────────────────────────────────────
#   La commessa e' a valle di tutto cio' che la riempie. Ogni sua riga
#   NON_EMESSA e' un legame (le EMESSA bloccano l'annullo,
#   script.fn_check_commessa_annullabile, D-3):
#
#   | La riga                    | origine                            | natura   | All'annullo della commessa |
#   | con sorgente documento     | PREVENTIVO, ORDINE, CONTRATTO, DDT | CONSUMO  | si ritira, il documento torna da mandare (D-5) |
#   | con sorgente consumo       | CONSUMI                            | CONSUMO  | si ritira, il consumo torna da mandare (D-7) |
#   | RETTIFICA (sourceless)     | RESO (del suo accredito)           | CONSUMO  | l'accredito si annulla, il reso torna da accreditare (D-7) |
#   | ONERE (sourceless)         | ONERE                              | ANNULLO  | si annulla con la commessa: niente a monte (D-7) |
#   | altra sourceless (nessun verbo la scrive) | MANUALE             | CONSUMO  | nessun ritiro la prende: l'avviso rifiuta, fail-closed |
#
#   ⭐ natura ANNULLO e' nuova: la finestra deve poter dire «si annulla»
#   invece di «si riapre». Per l'avviso conta come un consumo (rifiuta
#   sempre finche' c'e', 20261012-20): solo la PROVENIENZA passa con la
#   porta aperta.
#   origine_id: il documento (o il reso) dall'altra parte, dal resolver unico
#   della sorgente polimorfa (vendite.fn_get_sorgente_documento_ref: non
#   solleva, restituisce sempre una riga); origine_riga_id: la riga di reso
#   dell'accredito. Le commesse annullate non si filtrano (D-9): con l'avviso
#   e il verbo, una commessa annullata non ha piu' righe NON_EMESSA.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   RETURNS TABLE invariato: CREATE OR REPLACE, SECURITY DEFINER e grant
#   restano. Corpo di partenza: 20261011-77 (identico al vivo su
#   zeroerp_ci, 2026-10-12); il ramo COMMESSA esce con un RETURN suo,
#   prima della lettura finale delle righe di commessa del documento, che
#   per la commessa non ha senso.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261012-19-update-fn-documento-legami-commessa-mctit.yaml

  - changeSet:
      id: 20261012-19-update-fn-documento-legami-commessa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_documento_legami: + COMMESSA, un legame per riga NON_EMESSA (documento o consumo da rimandare, reso da riaccreditare, onere che si annulla). D-1, D-2, D-7.
        Brief: brief-db-annullo-a-valle-riapre-a-monte (R-1).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_documento_legami';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_documento_legami(
                  p_documento text,
                  p_id        bigint)
              RETURNS TABLE(
                  riga_id         bigint,
                  riga_nr         integer,
                  origine         text,
                  natura          text,
                  origine_id      bigint,
                  origine_riga_id bigint,
                  qta             numeric)
              LANGUAGE plpgsql
              STABLE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              -- =========================================================
              -- Scopo: i legami di un documento, una riga per legame: che
              --   cosa si riapre se lo annullo, e dove. Vedi l'intestazione
              --   del changeSet per la tabella dei legami.
              -- Parametri: p_documento e' il codice dei lettori di testata
              --   (DDT, ORDINE, PREVENTIVO, CONTRATTO, COMMESSA), p_id la
              --   testata: polimorfi, tipi nudi.
              -- rev 2026-10-12 (brief-db-annullo-a-valle-riapre-a-monte, D-2,
              --   D-7): + COMMESSA, il ramo in fondo all'IF.
              -- =========================================================
              DECLARE
                  -- La sorgente di commessa del documento e la sua chiave
                  -- (commesse_attivita.sorgente_uid porta <testata>.uid::text).
                  v_sorgente config.sorgenti.codice_interno%TYPE;
                  v_uid      text;
              BEGIN
                  IF p_id IS NULL OR p_id <= 0
                     OR p_documento IS NULL
                     OR p_documento NOT IN ('DDT', 'ORDINE', 'PREVENTIVO', 'CONTRATTO', 'COMMESSA') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_documento_legami',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_documento', p_documento, 'p_id', p_id),
                          NULL::uuid, 'vendite.fn_documento_legami',
                          'documento (DDT, ORDINE, PREVENTIVO, CONTRATTO, COMMESSA) e id maggiore di zero');
                  END IF;

                  IF p_documento = 'DDT' THEN
                      v_sorgente := 'DDT_VENDITA';
                      SELECT d.uid::text INTO v_uid FROM vendite.ddt d WHERE d.id = p_id;

                      RETURN QUERY
                          SELECT dr.id, dr.riga_nr, 'ORDINE'::text, 'CONSUMO'::text,
                                 orr.ordine_id, f.ordine_riga_id, f.qta_evasa::numeric
                            FROM vendite.ddt_righe dr
                            JOIN vendite.ordini_righe_fulfillment f ON f.ddt_riga_id = dr.id
                            JOIN vendite.ordini_righe orr ON orr.id = f.ordine_riga_id
                           WHERE dr.ddt_id = p_id
                          UNION ALL
                          SELECT dr.id, dr.riga_nr, 'RESO'::text, 'CONSUMO'::text,
                                 r.reso_id, rr.resi_riga_id, rr.qta::numeric
                            FROM vendite.ddt_righe dr
                            JOIN vendite.resi_righe_riconsegne rr ON rr.ddt_riga_id = dr.id
                            JOIN vendite.resi_righe r ON r.id = rr.resi_riga_id
                           WHERE dr.ddt_id = p_id;

                  ELSIF p_documento = 'ORDINE' THEN
                      v_sorgente := 'ORDINE_VENDITA';
                      SELECT o.uid::text INTO v_uid FROM vendite.ordini o WHERE o.id = p_id;

                      RETURN QUERY
                          SELECT orr.id, orr.riga_nr, 'PREVENTIVO'::text, 'CONSUMO'::text,
                                 pr.preventivo_id, orr.preventivo_riga_id, orr.quantita::numeric
                            FROM vendite.ordini_righe orr
                            JOIN vendite.preventivi_righe pr ON pr.id = orr.preventivo_riga_id
                           WHERE orr.ordine_id = p_id
                          UNION ALL
                          SELECT NULL::bigint, NULL::integer, 'OFFERTA'::text, 'PROVENIENZA'::text,
                                 o.documento_origine_id, NULL::bigint, NULL::numeric
                            FROM vendite.ordini o
                           WHERE o.id = p_id
                             AND o.documento_origine_tipo = 'OFFERTA'
                             AND o.documento_origine_id IS NOT NULL;

                  ELSIF p_documento = 'PREVENTIVO' THEN
                      v_sorgente := 'PREVENTIVO';
                      SELECT p.uid::text INTO v_uid FROM vendite.preventivi p WHERE p.id = p_id;

                  ELSIF p_documento = 'COMMESSA' THEN
                      -- ⭐ rev 2026-10-12 (D-1, D-2, D-7 di Tid): la commessa e' a
                      --   valle di tutto cio' che la riempie. Un legame per riga
                      --   NON_EMESSA (le EMESSA non sono legami: bloccano,
                      --   script.fn_check_commessa_annullabile):
                      --   - con sorgente: il documento che l'ha spinta (PREVENTIVO,
                      --     ORDINE, CONTRATTO, DDT) o il consumo (CONSUMI); CONSUMO,
                      --     si riapre: torna da mandare in commessa;
                      --   - RETTIFICA (sourceless per progetto): il RESO del suo
                      --     accredito; CONSUMO, il reso torna da accreditare;
                      --   - ONERE (sourceless): niente a monte; natura ANNULLO, la
                      --     riga si annulla con la commessa e la finestra lo dice;
                      --   - ogni altra riga sourceless (oggi nessun verbo la scrive):
                      --     MANUALE, CONSUMO. Nessun ritiro la prende, quindi l'avviso
                      --     rifiuta sempre: fail-closed.
                      -- riga_id: la riga di commessa; origine_id: il documento (o il
                      --   reso) dall'altra parte, dal resolver unico della sorgente
                      --   polimorfa (vendite.fn_get_sorgente_documento_ref);
                      --   origine_riga_id: la riga di reso dell'accredito.
                      RETURN QUERY
                          SELECT ca.id,
                                 NULL::integer,
                                 CASE
                                   WHEN ca.sorgente_tipo_id IS NOT NULL THEN
                                     CASE s.codice_interno
                                       WHEN 'PREVENTIVO'       THEN 'PREVENTIVO'
                                       WHEN 'ORDINE_VENDITA'   THEN 'ORDINE'
                                       WHEN 'CONTRATTO'        THEN 'CONTRATTO'
                                       WHEN 'DDT_VENDITA'      THEN 'DDT'
                                       WHEN 'ATTIVITA_CONSUMI' THEN 'CONSUMI'
                                       ELSE s.codice_interno::text
                                     END
                                   WHEN ca.tipo_movimento = 'RETTIFICA' THEN 'RESO'
                                   WHEN ca.tipo_movimento = 'ONERE'     THEN 'ONERE'
                                   ELSE 'MANUALE'
                                 END::text,
                                 CASE
                                   WHEN ca.sorgente_tipo_id IS NULL AND ca.tipo_movimento = 'ONERE'
                                     THEN 'ANNULLO'
                                   ELSE 'CONSUMO'
                                 END::text,
                                 CASE
                                   WHEN ca.sorgente_tipo_id IS NOT NULL THEN ref.documento_id
                                   ELSE acc.reso_id
                                 END,
                                 acc.resi_riga_id,
                                 ca.quantita::numeric
                            FROM vendite.commesse_attivita ca
                            LEFT JOIN config.sorgenti s ON s.id = ca.sorgente_tipo_id
                            LEFT JOIN LATERAL (
                                   SELECT r.documento_id
                                     FROM vendite.fn_get_sorgente_documento_ref(
                                            ca.sorgente_tipo_id, ca.sorgente_uid) AS r
                                    WHERE ca.sorgente_tipo_id IS NOT NULL
                                 ) ref ON true
                            LEFT JOIN LATERAL (
                                   SELECT a.resi_riga_id, rr.reso_id
                                     FROM vendite.resi_righe_accrediti a
                                     JOIN vendite.resi_righe rr ON rr.id = a.resi_riga_id
                                    WHERE a.commessa_attivita_id = ca.id
                                      AND ca.tipo_movimento = 'RETTIFICA'
                                    ORDER BY a.id
                                    LIMIT 1
                                 ) acc ON true
                           WHERE ca.commessa_id = p_id
                             AND ca.stato_emissione = 'NON_EMESSA'
                           ORDER BY ca.id;
                      RETURN;

                  ELSE  -- CONTRATTO
                      v_sorgente := 'CONTRATTO';
                      SELECT c.uid::text INTO v_uid FROM vendite.contratti c WHERE c.id = p_id;

                      RETURN QUERY
                          SELECT NULL::bigint, NULL::integer, 'OFFERTA'::text, 'PROVENIENZA'::text,
                                 c.offerta_id, NULL::bigint, NULL::numeric
                            FROM vendite.contratti c
                           WHERE c.id = p_id
                             AND c.offerta_id IS NOT NULL;
                  END IF;

                  -- Le righe di commessa che il documento ha spinto e che
                  -- nessuno ha ancora emesso: le stesse che il ritiro porta ad
                  -- ANNULLATA (vendite.fn_ritira_commessa_attivita_da_sorgente).
                  -- Documento inesistente o invisibile: v_uid NULL, nessuna riga.
                  RETURN QUERY
                      SELECT NULL::bigint, NULL::integer, 'COMMESSA'::text, 'CONSUMO'::text,
                             ca.commessa_id, ca.id, ca.quantita::numeric
                        FROM vendite.commesse_attivita ca
                        JOIN config.sorgenti s ON s.id = ca.sorgente_tipo_id
                       WHERE s.codice_interno  = v_sorgente
                         AND ca.sorgente_uid   = v_uid
                         AND ca.stato_emissione = 'NON_EMESSA'
                       ORDER BY ca.id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_documento_legami(text, bigint) IS
                  'I legami di un documento, una riga per legame (2026-10-11, brief-db-annullo-documento-con-legami D-4): che cosa si riapre se lo annullo, e dove. p_documento: DDT, ORDINE, PREVENTIVO, CONTRATTO, COMMESSA (codici dei lettori di testata). origine/natura: ORDINE e RESO (consumi della bolla: fulfillment e ponte di ri-consegna), PREVENTIVO (consumo dell''ordine: ordini_righe.preventivo_riga_id), OFFERTA (PROVENIENZA di ordine e contratto: resta sul documento annullato, l''offerta torna trasformabile perche'' l''unicita'' vale sui vivi), COMMESSA (righe di commessa NON_EMESSA spinte dal documento). Le righe EMESSA non sono legami: bloccano (script.fn_check_sorgente_chiudibile). riga_id/riga_nr: la riga del documento, NULL per testata e commessa; origine_id: la testata (o la commessa) dall''altra parte; origine_riga_id: la sua riga. Niente etichette: il nome lo da'' il lineage. Lettore unico di: guard vendite.trgfn_doc_guard_annullo_con_legami (avviso), BB vendite.fn_documento_ritira_legami (conferma e ritiro), finestra di conferma del backend. Generalizza e sostituisce vendite.fn_ddt_legami. Documento sconosciuto: E_VENDITE_CHIAMATA_NON_VALIDA. SECURITY DEFINER con search_path bloccato: avviso (guard, come l''app), conferma (verbo DEFINER) e finestra (backend) contano la stessa cosa anche dove la RLS dei legami ne nasconderebbe una parte. EXECUTE solo all''app. ⭐ rev 2026-10-12 (brief-db-annullo-a-valle-riapre-a-monte, D-1/D-2/D-7 di Tid): + COMMESSA, a valle di tutto cio'' che la riempie. Un legame per riga NON_EMESSA della commessa (riga_id = la riga di commessa): con sorgente, il documento che l''ha spinta (PREVENTIVO, ORDINE, CONTRATTO, DDT) o il consumo (CONSUMI), natura CONSUMO, torna da mandare; RETTIFICA (sourceless), il RESO del suo accredito (origine_riga_id = la riga di reso), natura CONSUMO, il reso torna da accreditare; ONERE (sourceless), natura ANNULLO: niente a monte, la riga si annulla con la commessa; ogni altra riga sourceless: MANUALE, CONSUMO (nessun ritiro la prende: l''avviso rifiuta sempre, fail-closed). origine_id dal resolver unico della sorgente polimorfa (vendite.fn_get_sorgente_documento_ref). Le righe EMESSA non sono legami: bloccano (script.fn_check_commessa_annullabile).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
