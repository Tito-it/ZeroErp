# La fotografia di un gruppo fatturabile scende nel DB. E' l'ultima copia della
#   regola di emittibilita' rimasta fuori.
#   brief-db-emittibilita-visibile-e-sbloccabile §9 F4; offerta dal BE il
#   2026-08-04 nel §5.2 e rimasta senza risposta fino a oggi.
#
# ── 🟠 IL PROBLEMA ───────────────────────────────────────────────────────
#   `CommesseRepository.diagnostica_gruppi` contiene ~60 righe di SQL che
#   riproducono i filtri di `fn_list_emittibili_lane`: `APPROVATA`,
#   `NON_EMESSA`, `tipo_doc_fiscale_id NOT NULL`, competenza `<=`. E' la
#   seconda copia di una regola che il DB possiede — la stessa forma che il
#   §7.1 di questo brief ha gia' dovuto estrarre una volta, quando il guard di
#   transizione aveva in casa la condizione «almeno una riga approvata» mentre
#   le uscite terminali delegavano gia' alle funzioni pure.
#
#   Il BE lo aveva visto e si era offerto: «Se ritenete che debba scendere a DB
#   come funzione, siamo d'accordo: ditecelo e ve la passiamo». La risposta
#   arriva adesso, ed e' si'.
#
# ── ⚠️ E NEL FRATTEMPO LA COPIA AVEVA GIA' UN DIFETTO ────────────────────
#   La versione Python aggrega per `gruppo_key` con `min(commessa_codice)`,
#   `min(stato_commessa)`, `bool_or(commessa_emittibile)`. Ma `gruppo_key`, per
#   una riga con documento sorgente, vale `<codice_interno>:<uid>` e **non
#   contiene la commessa**. Se lo stesso documento alimentasse righe su due
#   commesse — una in BOZZA e una PRONTA_FATTURAZIONE — il `bool_or` direbbe
#   «emittibile» perche' *una* lo e', e la diagnosi cadrebbe in
#   `NON_DETERMINATO` invece di dire «la commessa e' in BOZZA»: cioe' proprio il
#   caso che questa diagnostica esiste per raccontare.
#
#   ⚠️ `vw_dash_competenza_gruppi` la commessa la tiene **gia'** nel proprio
#   `GROUP BY`: la vista ammette il caso, il repository lo collassa. Qui la
#   grana e' `(gruppo_key, commessa_id)`, e il difetto non puo' esistere.
#
#   Calibrazione onesta: sul database di sviluppo i gruppi multi-commessa sono
#   **zero**, e `commesse_sorgenti` ha `UNIQUE (sorgente_tipo_id, sorgente_uid)`
#   che rende il caso improbabile. Ma nessun vincolo lo impedisce su
#   `commesse_attivita`: la domanda e' «puo' succedere?», non «e' successo?», e
#   in SQL evitarlo costa una colonna nel GROUP BY.
#
# ── ℹ️ COSA RESTA AL BACKEND, E PERCHE' ──────────────────────────────────
#   Scende la **fotografia** (i contatori), non la **prosa**.
#   `classifica_gruppo_non_servito` compone frasi italiane — «3 attivita' non
#   sono ancora approvate», con l'accordo di genere e numero — e quella e'
#   presentazione: nel DB starebbe male e in EN andra' comunque rifatta. La
#   linea di taglio e' netta: il DB dice *quanti* e *in che stato*, il BE dice
#   *come si racconta*.
#
# ── ℹ️ LA DESCRIZIONE DELLO STATO, CHE CHIUDE ANCHE IL §8.3 ──────────────
#   Il BE aveva notato che `diagnostica_gruppi` restituisce il codice interno
#   come `stato_commessa`, e che quel valore finisce **nella frase** letta
#   dall'operatore: «la commessa e' in stato BOZZA». Questa funzione restituisce
#   codice interno **e** descrizione, come le due viste dopo `20260815-24/25`.
#   La nota in coda al §8.3 si chiude qui.
#
# ── ℹ️ RIGHE E COMPETENZA ────────────────────────────────────────────────
#   `n_fuori_competenza` conta le righe pronte con competenza **successiva** al
#   mese richiesto: e' la sola classe che dipende da `p_competenza_mese`, ed e'
#   il motivo per cui il parametro esiste. `NULL` = nessun limite, e allora
#   quella classe e' vuota per costruzione (e le righe finiscono in `n_pronte`).
#   Il mese si normalizza al primo giorno, come fa il chiamante.
#
# ⚠️ Un gruppo richiesto e SCONOSCIUTO (nessuna riga) esce comunque, con
#   `commessa_id` NULL e tutti i contatori a zero. E' deliberato: e' il caso
#   `MOTIVO_GRUPPO_SCONOSCIUTO` del BE, e una chiave che sparisce dal risultato
#   invece di dichiararsi ignota sarebbe un silenzio.
#
# ── 🔒 SCOPE ─────────────────────────────────────────────────────────────
#   `commesse` e `commesse_attivita` hanno la RLS: la fotografia e' gia' scoped
#   per emittente, esattamente come lo era la query del repository. STABLE, sola
#   lettura, nessun `SECURITY DEFINER`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260815-29-create-fn-diagnostica-gruppi-fatturabili-mctit.yaml

  - changeSet:
      id: 20260815-29-create-fn-diagnostica-gruppi-fatturabili
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_diagnostica_gruppi_fatturabili(p_gruppi, p_competenza_mese): la
        fotografia per gruppo fatturabile — quante righe, in che stato, e la
        testata della commessa con codice interno E descrizione. Porta a DB
        l'SQL di CommesseRepository.diagnostica_gruppi, ultima copia della regola
        di emittibilita' fuori dal database (offerta dal BE il 2026-08-04).
        Grana (gruppo_key, commessa_id): la versione Python collassava piu'
        commesse con min()/bool_or(). La prosa dei motivi resta al BE.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'vendite'
                    AND p.proname = 'fn_build_gruppo_fatturabile_key'
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM information_schema.columns
                  WHERE table_schema = 'vendite'
                    AND table_name = 'stati_commessa'
                    AND column_name = 'descrizione'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_diagnostica_gruppi_fatturabili(
                      -- ⚠️ text[] esplicito: PostgreSQL non supporta `colonna%TYPE[]`.
                      p_gruppi          text[],
                      p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL)
               RETURNS TABLE(gruppo_key                    text,
                             commessa_id                   bigint,
                             commessa_codice               text,
                             commessa_stato_codice_interno text,
                             commessa_stato_descrizione    text,
                             commessa_emittibile           boolean,
                             n_righe                       bigint,
                             n_emesse                      bigint,
                             n_annullate                   bigint,
                             n_rifiutate                   bigint,
                             n_non_approvate               bigint,
                             n_senza_tipo_doc              bigint,
                             n_fuori_competenza            bigint,
                             n_pronte                      bigint)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_bound vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo: la FOTOGRAFIA di uno o piu' gruppi fatturabili —
                --   quante righe hanno, in che stato sono, e in che stato e'
                --   la testata della commessa. Serve a spiegare all'operatore
                --   perche' un gruppo che aveva chiesto di fatturare non e'
                --   stato servito.
                --   Porta a DB l'SQL che stava in
                --   CommesseRepository.diagnostica_gruppi: era la seconda copia
                --   dei filtri di fn_list_emittibili_lane.
                --   brief-db-emittibilita-visibile-e-sbloccabile §9 F4.
                --
                -- Grana: (gruppo_key, commessa_id). ⚠️ La commessa NON e'
                --   ridondante: gruppo_key per una riga con documento sorgente
                --   vale '<codice_interno>:<uid>' e non la contiene, quindi lo
                --   stesso documento potrebbe in linea di principio alimentare
                --   righe su due commesse. La versione Python aggregava con
                --   min()/bool_or() e in quel caso avrebbe detto «emittibile»
                --   perche' UNA lo era, mancando proprio la diagnosi che serve.
                --   vw_dash_competenza_gruppi la commessa la tiene gia' nel
                --   proprio GROUP BY: qui si fa lo stesso.
                --
                -- Divisione di competenze: qui i CONTATORI, al BE la PROSA
                --   (classifica_gruppo_non_servito compone le frasi italiane,
                --   con accordo di genere e numero). Il DB dice quanti e in che
                --   stato, il BE dice come si racconta.
                --
                -- Un gruppo richiesto e sconosciuto esce comunque, con
                --   commessa_id NULL e contatori a zero: e' il caso
                --   «chiave ignota», e farlo sparire sarebbe un silenzio.
                --
                -- STABLE, sola lettura. commesse e commesse_attivita hanno la
                --   RLS: la fotografia e' gia' scoped per emittente.
                -- =========================================================

                -- Nessun gruppo chiesto, nessuna diagnosi: e' l'identita', non
                -- un errore. Il chiamante filtra a monte, come gia' faceva.
                IF p_gruppi IS NULL OR cardinality(p_gruppi) = 0 THEN
                  RETURN;
                END IF;

                -- Bound di competenza normalizzato al primo del mese, come fa
                -- il chiamante. NULL = nessun limite, e allora la classe
                -- «fuori competenza» resta vuota per costruzione.
                v_bound := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                RETURN QUERY
                WITH richiesti AS (
                  -- Normalizzazione allineata a fn_build_gruppo_fatturabile_key:
                  -- una chiave con spazi in coda non combacerebbe MAI con quella
                  -- costruita dal DB, e filtrerebbe zero righe senza dirlo.
                  SELECT DISTINCT btrim(k) AS gruppo_key
                    FROM unnest(p_gruppi) AS k
                   WHERE btrim(COALESCE(k, '')) <> ''
                ),
                righe AS (
                  SELECT vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) AS gruppo_key,
                         co.id                                        AS commessa_id,
                         co.codice::text                              AS commessa_codice,
                         sc.codice_interno::text                      AS commessa_stato_codice_interno,
                         -- Descrizione di DISPLAY, stessa forma delle due viste
                         -- dashboard: chiude la nota in coda al §8.3, perche'
                         -- questo valore finisce NELLA FRASE che l'operatore legge.
                         COALESCE(sc.descrizione, sc.codice)::text    AS commessa_stato_descrizione,
                         sc.emittibile                                AS commessa_emittibile,
                         ca.stato_emissione,
                         ca.stato_approvazione,
                         ca.tipo_doc_fiscale_id,
                         ca.competenza_mese
                    FROM vendite.commesse_attivita ca
                    JOIN vendite.commesse co       ON co.id = ca.commessa_id
                    JOIN vendite.stati_commessa sc ON sc.id = co.stato_commessa_id
                   WHERE vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id)
                         IN (SELECT q.gruppo_key FROM richiesti q)
                )
                SELECT d.gruppo_key,
                       x.commessa_id,
                       x.commessa_codice,
                       x.commessa_stato_codice_interno,
                       x.commessa_stato_descrizione,
                       x.commessa_emittibile,
                       count(x.gruppo_key)::bigint AS n_righe,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'EMESSA')::bigint AS n_emesse,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'ANNULLATA')::bigint AS n_annullate,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text = 'RIFIUTATA')::bigint AS n_rifiutate,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text NOT IN ('APPROVATA', 'RIFIUTATA'))::bigint AS n_non_approvate,
                       -- Le tre classi qui sotto sono i filtri della lane, uno
                       -- per uno: e' l'unico punto in cui vanno ripetuti, e da
                       -- oggi e' UNO solo.
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text = 'APPROVATA'
                           AND x.tipo_doc_fiscale_id IS NULL)::bigint AS n_senza_tipo_doc,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text = 'APPROVATA'
                           AND x.tipo_doc_fiscale_id IS NOT NULL
                           AND v_bound IS NOT NULL
                           AND x.competenza_mese > v_bound)::bigint AS n_fuori_competenza,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text = 'APPROVATA'
                           AND x.tipo_doc_fiscale_id IS NOT NULL
                           AND (v_bound IS NULL OR x.competenza_mese <= v_bound))::bigint AS n_pronte
                  FROM richiesti d
                  -- LEFT JOIN: un gruppo senza righe deve uscire lo stesso, con
                  -- commessa NULL e contatori a zero.
                  LEFT JOIN righe x ON x.gruppo_key = d.gruppo_key
                 GROUP BY d.gruppo_key,
                          x.commessa_id,
                          x.commessa_codice,
                          x.commessa_stato_codice_interno,
                          x.commessa_stato_descrizione,
                          x.commessa_emittibile
                 -- Ordine DETERMINISTICO: il chiamante compone una frase con i
                 -- primi N, e due chiamate uguali devono dare la stessa frase.
                 ORDER BY d.gruppo_key, x.commessa_id NULLS FIRST;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_diagnostica_gruppi_fatturabili(p_gruppi text[], p_competenza_mese date)
              IS 'FOTOGRAFIA di uno o piu'' gruppi fatturabili: quante righe hanno e in che stato, piu'' la testata della commessa (codice, stato codice interno E descrizione, flag emittibile). Serve a spiegare perche'' un gruppo che l''operatore aveva chiesto di fatturare non e'' stato servito. Porta a DB l''SQL che stava in CommesseRepository.diagnostica_gruppi — ultima copia dei filtri di vendite.fn_list_emittibili_lane rimasta fuori dal database, offerta dal BE il 2026-08-04 (§5.2 di brief-db-emittibilita-visibile-e-sbloccabile) e accolta il 2026-08-15 (§9 F4). ⚠️ Grana (gruppo_key, commessa_id), e la commessa NON e'' ridondante: gruppo_key per una riga con documento sorgente vale ''<codice_interno>:<uid>'' e non la contiene, quindi lo stesso documento potrebbe alimentare righe su due commesse. La versione Python aggregava con min()/bool_or() e in quel caso avrebbe risposto «emittibile» perche'' UNA commessa lo era, perdendo proprio la diagnosi che serve; vw_dash_competenza_gruppi la commessa la tiene gia'' nel proprio GROUP BY. Sul DB di sviluppo i gruppi multi-commessa sono zero e commesse_sorgenti ha UNIQUE su (sorgente_tipo_id, sorgente_uid), ma nessun vincolo lo impedisce su commesse_attivita: la domanda e'' «puo'' succedere?», non «e'' successo?». DIVISIONE DI COMPETENZE: qui i contatori, al BE la prosa — classifica_gruppo_non_servito compone le frasi italiane con accordo di genere e numero, ed e'' presentazione. La descrizione dello stato chiude la nota in coda al §8.3: quel valore finisce nella frase che l''operatore legge, e un codice interno dentro una frase e'' il sintomo che la decodifica e'' nel posto sbagliato. n_fuori_competenza e'' la sola classe che dipende da p_competenza_mese (righe pronte con competenza SUCCESSIVA al mese richiesto); NULL = nessun limite e quella classe resta vuota, con le righe in n_pronte. Un gruppo richiesto e sconosciuto esce comunque con commessa_id NULL e contatori a zero: farlo sparire sarebbe un silenzio. Le chiavi si normalizzano con btrim, come fa fn_build_gruppo_fatturabile_key: una chiave con spazi in coda non combacerebbe mai e filtrerebbe zero righe senza dirlo. STABLE, sola lettura; commesse e commesse_attivita hanno la RLS, quindi la fotografia e'' gia'' scoped per emittente.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_diagnostica_gruppi_fatturabili(text[], date);
