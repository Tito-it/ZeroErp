# UPDATE: vendite.fn_create_contratto(p_testata, p_utility)
#   Alla nascita, la scheda di fornitura dell'operatore corregge quella
#   dell'anagrafica invece di collidere con lei.
#   Brief: brief-db-indirizzi-documento-seguono-il-cliente (§8.4, D-7)
#
# -- IL CASO ------------------------------------------------------------
#   Lo step 3 inserisce la testata, e il trigger alla nascita
#   (trg_contratti_z90_snapshot_precontrattuali_ins) scrive subito la scheda
#   di fornitura dai dati precontrattuali della coppia, se ce ne sono. Lo
#   step 4 faceva poi l'INSERT della scheda dell'operatore (p_utility): su
#   una fornitura con dati precontrattuali collideva su
#   uq_contratti_utilities_contratto_id, e il drawer riceveva «Questo
#   contratto ha gia' una riga utility associata». Il pgTAP della funzione
#   lo evitava scegliendo apposta coppie senza precontrattuali.
#
# -- LA REGOLA (D-7 di Tid, 2026-10-12) ---------------------------------
#   Vince l'operatore, come nel push dall'offerta (fn_push_offerta_a_contratto,
#   ON CONFLICT ... DO UPDATE): l'anagrafica fa da base, le chiavi mandate
#   la correggono, quelle non mandate restano dell'anagrafica. A patto che
#   l'operatore veda i dati dell'anagrafica prima di creare: il drawer li
#   legge da vendite.fn_get_fornitura_da_anagrafica (20261012-35), la stessa
#   lettura che scrive il trigger.
#
# -- LA FORMA ------------------------------------------------------------
#   Scheda gia' scritta: UPDATE delle sole chiavi whitelisted presenti.
#   ⚠️ Non INSERT ... ON CONFLICT DO UPDATE: i trigger BEFORE INSERT
#   (trgfn_contratti_utilities_guard_tipo_classe) giudicano la riga PROPOSTA
#   prima del conflitto, e un payload parziale (la sola classe, i soli
#   parametri) sarebbe rifiutato anche quando la riga finale e' coerente.
#   L'UPDATE fa giudicare la riga finale.
#   Nessuna scheda dall'anagrafica: l'INSERT di prima, invariato.
#   Il resto del corpo e' quello del 20261011-60 (uguale alla doc
#   auto-generata, salvo l'ancoraggio %TYPE del RETURNS TABLE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261012-42-update-fn-create-contratto-scheda-operatore-mctit.yaml

  - changeSet:
      id: 20261012-42-update-fn-create-contratto-scheda-operatore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_create_contratto: la scheda di fornitura dell'operatore corregge con un UPDATE
        quella scritta dal trigger alla nascita, invece di collidere su
        uq_contratti_utilities_contratto_id. Brief: brief-db-indirizzi-documento-seguono-il-cliente
        (§8.4, D-7).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_create_contratto(p_testata jsonb, p_utility jsonb DEFAULT NULL::jsonb)
               RETURNS TABLE(contratto_id vendite.contratti.id%TYPE, numero vendite.contratti.numero%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_numero       vendite.contratti.numero%TYPE;
                  v_stato_id     vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_contratto_id vendite.contratti.id%TYPE;
                  v_cols         text[];
                  v_insert_cols  text;
                  v_select_cols  text;
                  v_sql          text;
                  -- rev 2026-07-27: aggiunta 'fatturazione_immediata' (corsia di
                  -- instradamento, Fase B brief emissione mirata). Va decisa PRIMA
                  -- del push in commessa: in create e' il momento naturale, e senza
                  -- questa voce la chiave veniva scartata in silenzio.
                  -- rev 2026-08-31: aggiunti i TRE RIFERIMENTI DELL'ATTO — CIG, CUP
                  -- e commessa. Stesso difetto della riga sopra, sulla stessa
                  -- funzione: in PATCH il backend li scriveva gia', in CREATE la
                  -- chiave veniva scartata e il contratto nasceva senza il CIG,
                  -- senza nessun errore. ⚠️ A differenza di fatturazione_immediata
                  -- le tre sono NULLABLE: un null e' un valore legittimo e vuol
                  -- dire «non c'e' un CIG», quindi il BE puo' mandarle sempre.
                  v_testata_allowed text[] := ARRAY[
                      'billing_account_id', 'emittente_fiscale_id', 'istanza_utility_id',
                      'utility_id', 'ambito', 'valido_dal', 'valido_al',
                      'parent_contratto_id', 'data', 'listino_id',
                      'tipo_variazione_globale', 'valore_variazione_globale',
                      'categoria_cliente_id_snapshot', 'valuta_id',
                      'fatturazione_immediata',
                      'codice_cig', 'codice_cup', 'codice_commessa', 'meta'
                  ];
                  v_util_allowed text[] := ARRAY[
                      'istanza_utility_id', 'utility_id', 'istanza_dati_precontrattuali_id',
                      'tipo_utenza_id', 'classe_utenza_id', 'param_1_num',
                      'param_2_txt', 'meta'
                  ];
              BEGIN
                  -- ----------------------------------------------------
                  -- 1) Numero contratto (consuma il contatore; rolla con
                  --    la funzione se un qualsiasi step successivo fallisce).
                  -- ----------------------------------------------------
                  v_numero := script.fn_generate_codice('contratto');

                  -- 2) Stato iniziale DRAFT.
                  SELECT s.id
                    INTO v_stato_id
                    FROM config.stati_doc_contratti s
                   WHERE s.codice_interno = 'DRAFT';
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'vendite.fn_create_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_contratti.DRAFT'),
                          NULL::uuid,
                          VARIADIC ARRAY['stato iniziale DRAFT (config.stati_doc_contratti)']
                      );
                  END IF;

                  -- ----------------------------------------------------
                  -- 3) INSERT testata: solo chiavi whitelisted presenti
                  --    (le assenti ereditano default/trigger DB).
                  -- ----------------------------------------------------
                  SELECT array_agg(quote_ident(key) ORDER BY key)
                    INTO v_cols
                    FROM jsonb_object_keys(COALESCE(p_testata, '{}'::jsonb)) AS key
                   WHERE key = ANY(v_testata_allowed);

                  v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                  v_select_cols := COALESCE(
                      ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                 FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                      '');

                  v_sql := format(
                      'INSERT INTO vendite.contratti (numero, stato_doc_contratto_id%s) '
                      'SELECT $1, $2%s '
                      '  FROM jsonb_populate_record(NULL::vendite.contratti, $3) AS r '
                      'RETURNING id',
                      v_insert_cols, v_select_cols);
                  EXECUTE v_sql
                     INTO v_contratto_id
                    USING v_numero, v_stato_id, COALESCE(p_testata, '{}'::jsonb);

                  -- ----------------------------------------------------
                  -- 4) La scheda di fornitura dell'operatore (opzionale).
                  --    rev 2026-10-12 (brief-db-indirizzi-documento-seguono-il-cliente,
                  --    D-7 di Tid): il trigger alla nascita (step 3) ha gia' scritto
                  --    la scheda dall'anagrafica, se la coppia ha dati
                  --    precontrattuali. Prima l'INSERT dell'operatore collideva su
                  --    uq_contratti_utilities_contratto_id e il contratto non si
                  --    creava. Ora VINCE L'OPERATORE, come nel push dall'offerta:
                  --    l'anagrafica fa da base, le sue chiavi la correggono.
                  --    ⚠️ UPDATE e non INSERT ... ON CONFLICT: i trigger BEFORE
                  --    INSERT giudicano la riga PROPOSTA prima del conflitto, e il
                  --    guard tipo/classe la rifiuterebbe se l'operatore manda solo
                  --    una parte della scheda. L'UPDATE giudica la riga finale.
                  -- ----------------------------------------------------
                  IF p_utility IS NOT NULL AND p_utility <> '{}'::jsonb THEN
                      SELECT array_agg(quote_ident(key) ORDER BY key)
                        INTO v_cols
                        FROM jsonb_object_keys(p_utility) AS key
                       WHERE key = ANY(v_util_allowed);

                      v_insert_cols := COALESCE(', ' || array_to_string(v_cols, ', '), '');
                      v_select_cols := COALESCE(
                          ', ' || (SELECT string_agg('r.' || c, ', ' ORDER BY n)
                                     FROM unnest(v_cols) WITH ORDINALITY AS u(c, n)),
                          '');

                      IF EXISTS (SELECT 1
                                   FROM vendite.contratti_utilities cu
                                  WHERE cu.contratto_id = v_contratto_id) THEN
                          -- La scheda dall'anagrafica c'e': si correggono le sole chiavi
                          -- mandate. ROW(...) anche con una colonna sola.
                          IF v_cols IS NOT NULL THEN
                              v_sql := format(
                                  'UPDATE vendite.contratti_utilities u '
                                  '   SET (%s) = ROW(%s) '
                                  '  FROM jsonb_populate_record(NULL::vendite.contratti_utilities, $2) AS r '
                                  ' WHERE u.contratto_id = $1',
                                  array_to_string(v_cols, ', '), substr(v_select_cols, 3));
                              EXECUTE v_sql USING v_contratto_id, p_utility;
                          END IF;
                      ELSE
                          v_sql := format(
                              'INSERT INTO vendite.contratti_utilities (contratto_id%s) '
                              'SELECT $1%s '
                              '  FROM jsonb_populate_record(NULL::vendite.contratti_utilities, $2) AS r',
                              v_insert_cols, v_select_cols);
                          EXECUTE v_sql USING v_contratto_id, p_utility;
                      END IF;
                  END IF;

                  -- ----------------------------------------------------
                  -- 5) Lo slot di default dall'anagrafica del cliente (rev 2026-10-11,
                  --    brief-db-indirizzi-documento-seguono-il-cliente, D-2 e decisione di
                  --    Tid sul «quando»: alla creazione lo fa scattare chi crea). La regola
                  --    sta in vendite.fn_doc_indirizzo_default; prima la applicava il
                  --    backend dopo questa funzione (auto_assegna_indirizzo_default).
                  --    Dopo la fornitura: l'istanza del contratto c'e' gia' in testata.
                  -- ----------------------------------------------------
                  PERFORM vendite.fn_doc_indirizzo_default('CONTRATTO', v_contratto_id);

                  RETURN QUERY
                  SELECT v_contratto_id, v_numero;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_create_contratto(p_testata jsonb, p_utility jsonb)
              IS 'Funzione madre atomica: genera il numero, crea la testata contratto (stato DRAFT) e l''eventuale riga utility in un''unica statement (o tutto o rollback, contatore numero incluso). INSERT dinamico delle sole chiavi whitelisted presenti (rispetta i default DB). SECURITY INVOKER. Ritorna (contratto_id, numero). rev 2026-07-27: ''fatturazione_immediata'' aggiunta a v_testata_allowed — la corsia di instradamento si decide PRIMA del push in commessa e la create e'' il momento naturale; senza questa voce la chiave veniva scartata in silenzio. rev 2026-08-31: aggiunti ''codice_cig'', ''codice_cup'' e ''codice_commessa'' — i tre riferimenti dell''atto, colonne dal 20260829-13. ⛔ E'' LO STESSO DIFETTO della rev precedente sulla stessa funzione: in PATCH il backend li scriveva gia'', in CREATE la chiave veniva SCARTATA e il contratto nasceva senza il CIG, con un 200 e nessun errore a video. Un CIG nasce con la gara, cioe'' PRIMA del contratto: la creazione e'' il momento naturale per digitarlo. ⚠️ IL FILTRO E'' SULLA PRESENZA DELLA CHIAVE, e la semantica del null NON e'' la stessa su tutte le voci: ''fatturazione_immediata'' e'' NOT NULL con DEFAULT false, quindi chiave assente = DEFAULT e chiave = null = 23502 (il BE deve omettere o mandare un booleano, mai null); i tre codici dell''atto sono NULLABLE, quindi un null e'' un valore legittimo che significa «non c''e'' un CIG» e il BE puo'' mandarli sempre. ⛔ La whitelist resta NON fail-loud (chiave ignota scartata e non respinta): renderla tale cambierebbe il comportamento di TUTTE le chiavi di una madre gia'' in uso dal backend, e resta la proposta §6 di brief-db-fatturazione-immediata-create-contratto. Piano: analisi-fix-transazioni Classe A #2 + brief-db-fatturazione-immediata-create-contratto + brief-db-fn-create-contratto-codici-atto. rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente, D-2): in coda, lo slot di default dall''anagrafica del cliente con vendite.fn_doc_indirizzo_default(''CONTRATTO'', id) — prima lo faceva il backend dopo questa funzione. RETURNS TABLE ancorato (vendite.contratti.id%TYPE, vendite.contratti.numero%TYPE: stessi tipi). rev 2026-10-12 (brief-db-indirizzi-documento-seguono-il-cliente, D-7 di Tid): la scheda di fornitura dell''operatore CORREGGE quella che il trigger alla nascita ha appena scritto dall''anagrafica (vendite.fn_doc_fornitura_da_anagrafica), con un UPDATE delle sole chiavi mandate; prima l''INSERT collideva su uq_contratti_utilities_contratto_id e un contratto su una fornitura con dati precontrattuali non si creava. Vince l''operatore, come nel push dall''offerta; perche'' veda i dati dell''anagrafica prima di creare, il drawer li legge da vendite.fn_get_fornitura_da_anagrafica. UPDATE e non ON CONFLICT: i trigger BEFORE INSERT giudicherebbero la riga proposta, parziale. Senza scheda dall''anagrafica resta l''INSERT di prima.';
