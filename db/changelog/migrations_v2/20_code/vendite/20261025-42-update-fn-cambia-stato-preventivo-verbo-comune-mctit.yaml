# IL VERBO DEL PREVENTIVO SUL MODELLO
#   Brief: brief-modello-documento-vendita §8 (giro 6; M-1, M-3, M-4, S-1 b,
#   S-2 a, U-1 … U-3 di Tid, 2026-10-24/25). Stampo: il verbo della bolla
#   (20261025-16).
#
# ── CHE COSA CAMBIA ─────────────────────────────────────────────────
#   - il permesso del passaggio lo dice la riga della matrice
#     (config.transizioni_stati_preventivi.azione_processo_codename:
#     emetti_preventivo sull'emissione e sull'annullo dell'emesso e
#     dell'accettato) e lo applica la prima riga comune,
#     script.fn_guard_passaggio. Un passaggio di processo chiesto qui
#     (ACCETTATO <-> EVASO, EMESSO -> SCADUTO): E_DOC_PASSAGGIO_DI_PROCESSO;
#   - lo stato si scrive con la scrittura comune, script.fn_doc_scrivi_stato,
#     attraverso la porta (montata in 20261025-46);
#   - SECURITY DEFINER con search_path bloccato, come la bolla: la porta
#     vuole il proprietario. La RLS non c'e' piu', quindi la testata si prende
#     FOR UPDATE col predicato della policy nella WHERE (fuori perimetro
#     E_PREV_NOT_FOUND, no-leak: lo stampo di vendite.fn_annulla_preventivo);
#   - il codice dello stato chiesto si traduce con script.fn_doc_stato_id
#     (la copia nel corpo si ritira).
#
# ── LE COPIE CHE SI RITIRANO DAL CORPO ──────────────────────────────
#   - la matrice: la rifiutava il corpo E il guard di transizione
#     (vendite.trgfn_preventivi_guard_transizione), con lo stesso codice
#     E_PREV_TRANSIZIONE_NON_AMMESSA. Resta il guard: un giudice solo;
#   - verso ANNULLATO: il primo motivo di script.fn_check_preventivo_annullabile
#     lo solleva gia' vendite.trgfn_preventivi_guard_annullamento, col contesto
#     intero. Resta il guard.
#
# ── CHE COSA RESTA DEL PREVENTIVO ───────────────────────────────────
#   La condizione delle righe all'emissione (E_PREV_NESSUNA_RIGA_ATTIVA): e'
#   sua, ed e' una sola sede. Lo stato di emissione si legge dal vocabolario
#   (script.fn_stato_emissione_id), non dal letterale 'EMESSO'.
#
# ── LA FIRMA ────────────────────────────────────────────────────────
#   (p_preventivo_id, p_stato), come la bolla: esce p_user, che riempiva
#   user_update a mano accanto al trigger di audit
#   (script.trgfn_audit_data_user_generic), la sede di quella colonna. Cambia
#   la firma: DROP e CREATE; l'unico chiamante del database,
#   vendite.fn_annulla_preventivo, si riscrive in 20261025-43; il backend e i
#   pgTAP sono nella richiesta e nel porting del giro. RETURNS TABLE invariato.
#
#   Corpo di partenza dalla doc auto-generata
#   (vendite/funzioni/fn_cambia_stato_preventivo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261025-42-update-fn-cambia-stato-preventivo-verbo-comune-mctit.yaml

  - changeSet:
      id: 20261025-42-update-fn-cambia-stato-preventivo-verbo-comune
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_cambia_stato_preventivo sul verbo comune: firma (id, stato), SECURITY
        DEFINER col predicato della policy, permesso dalla riga del passaggio
        (script.fn_guard_passaggio), stato da script.fn_doc_scrivi_stato; matrice e annullo
        restano ai guard della tabella. Brief: brief-modello-documento-vendita §8.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "4"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname IN ('fn_guard_passaggio', 'fn_doc_scrivi_stato',
                                   'fn_doc_stato_id', 'fn_stato_emissione_id');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_cambia_stato_preventivo(bigint, character varying, text);

              CREATE FUNCTION vendite.fn_cambia_stato_preventivo(
                  p_preventivo_id vendite.preventivi.id%TYPE,
                  p_stato         config.stati_doc_preventivi.codice_interno%TYPE)
               RETURNS TABLE(preventivo_id    vendite.preventivi.id%TYPE,
                             stato_precedente config.stati_doc_preventivi.codice_interno%TYPE,
                             stato_nuovo      config.stati_doc_preventivi.codice_interno%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              DECLARE
                  v_utente      config.user_override_azioni.auth_user_id%TYPE;
                  v_stato_da    config.stati_doc_preventivi.codice_interno%TYPE;
                  v_stato_da_id vendite.preventivi.stato_doc_preventivo_id%TYPE;
                  v_stato_a_id  config.stati_doc_preventivi.id%TYPE;
                  v_numero      vendite.preventivi.numero%TYPE;
              BEGIN
                  -- ==========================================================
                  -- Scopo: il verbo di ogni cambio di stato manuale di un
                  --   preventivo (modello del documento: prima riga comune,
                  --   scrittura comune). Matrice, condizioni dell'emissione,
                  --   prezzi all'accettazione, annullabilita' e legami li
                  --   giudicano i guard della tabella, all'UPDATE.
                  -- Ritorna: preventivo_id, stato_precedente, stato_nuovo
                  --   (codice_interno).
                  -- ==========================================================
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  -- 1. Parametri.
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_preventivo',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('param', 'p_preventivo_id', 'value', p_preventivo_id),
                          NULL::uuid,
                          'p_preventivo_id = ' || COALESCE(p_preventivo_id::text, 'NULL'));
                  END IF;

                  -- 2. La testata FOR UPDATE, nel perimetro (predicato della
                  --    policy: DEFINER). Fuori perimetro come inesistente.
                  SELECT p.stato_doc_preventivo_id, s.codice_interno, p.numero
                    INTO v_stato_da_id, v_stato_da, v_numero
                    FROM vendite.preventivi p
                    JOIN config.stati_doc_preventivi s ON s.id = p.stato_doc_preventivo_id
                   WHERE p.id = p_preventivo_id
                     AND script.fn_scope_ef_whitelist_via_preventivo(v_utente, p.id)
                     FOR UPDATE OF p;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_preventivo',
                          'E_PREV_NOT_FOUND', jsonb_build_object('id', p_preventivo_id), NULL::uuid,
                          p_preventivo_id::text);
                  END IF;

                  -- 3. Lo stato chiesto: il codice di uno stato attivo.
                  v_stato_a_id := script.fn_doc_stato_id('vendite.preventivi'::regclass, p_stato);
                  IF v_stato_a_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_preventivo',
                          'E_STATO_WORKFLOW_NON_TROVATO',
                          jsonb_build_object('codice', p_stato),
                          NULL::uuid,
                          COALESCE(p_stato, 'NULL'));
                  END IF;

                  -- 4. Prima riga comune: passaggio di processo, azione.
                  PERFORM script.fn_guard_passaggio(v_utente, 'vendite.preventivi'::regclass,
                                                    v_stato_da_id, v_stato_a_id);

                  -- 5. L'emissione chiede almeno una riga attiva (solo la
                  --    presenza: un totale zero si emette, rev 2026-07-16).
                  IF v_stato_a_id = script.fn_stato_emissione_id('vendite.preventivi'::regclass)
                     AND NOT EXISTS (SELECT 1
                                       FROM vendite.preventivi_righe pr
                                      WHERE pr.preventivo_id = p_preventivo_id
                                        AND pr.attivo IS TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_cambia_stato_preventivo',
                          'E_PREV_NESSUNA_RIGA_ATTIVA',
                          jsonb_build_object('preventivo_id', p_preventivo_id),
                          NULL::uuid,
                          COALESCE(v_numero, p_preventivo_id::text));
                  END IF;

                  -- 6. Lo stato, attraverso la porta, con i guard di sempre.
                  PERFORM script.fn_doc_scrivi_stato('vendite.preventivi'::regclass,
                                                     p_preventivo_id, v_stato_a_id);

                  RETURN QUERY SELECT p_preventivo_id, v_stato_da, p_stato;
              END;
              $function$;

              -- Funzione nuova (la firma cambia): DEFINER, EXECUTE solo
              -- all'applicazione, come vendite.fn_annulla_preventivo.
              REVOKE EXECUTE ON FUNCTION vendite.fn_cambia_stato_preventivo(bigint, character varying) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION vendite.fn_cambia_stato_preventivo(bigint, character varying) TO zeroerp_app;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_cambia_stato_preventivo(p_preventivo_id bigint, p_stato character varying)
                IS 'VERBO di ogni cambio di stato manuale di un preventivo (modello del documento, brief-modello-documento-vendita §8). Permesso: dalla riga del passaggio (config.transizioni_stati_preventivi.azione_processo_codename: emetti_preventivo su DRAFT -> EMESSO, EMESSO -> ANNULLATO e ACCETTATO -> ANNULLATO) con script.fn_guard_passaggio, prima di ogni scrittura; un passaggio di processo (ACCETTATO <-> EVASO della proiezione dello smistamento, EMESSO -> SCADUTO) chiesto qui: E_DOC_PASSAGGIO_DI_PROCESSO; gli altri passaggi al permesso sul documento, che controlla il backend. SECURITY DEFINER con search_path bloccato: la testata si prende FOR UPDATE col predicato della policy nella WHERE (script.fn_scope_ef_whitelist_via_preventivo; fuori perimetro E_PREV_NOT_FOUND, no-leak). Lo stato chiesto per codice_interno (script.fn_doc_stato_id; nessuno stato attivo: E_STATO_WORKFLOW_NON_TROVATO). L''emissione (lo stato di script.fn_stato_emissione_id) chiede almeno una riga attiva: E_PREV_NESSUNA_RIGA_ATTIVA. Lo stato lo scrive script.fn_doc_scrivi_stato attraverso la porta (script.trgfn_doc_stato_solo_dal_verbo), e i guard della tabella giudicano il resto: matrice (E_PREV_TRANSIZIONE_NON_AMMESSA), condizioni dell''emissione, prezzi all''accettazione, annullabilita'' e legami. Ritorna preventivo_id, stato_precedente, stato_nuovo (codice_interno). rev 2026-10-25 (20261025-42): il verbo comune; firma (id, stato) senza p_user (user_update lo scrive il trigger di audit); ritirate dal corpo le copie della matrice e dell''annullabilita''. Storia precedente: analisi-hardcoded-codice §3a #1 (2026-06-28), solo presenza righe (2026-07-16), brief-db-vie-uscita-operatore (2026-08-04/05), brief-db-be-terzo-lato-presidio-codici §11.2 (2026-08-06).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_cambia_stato_preventivo(bigint, character varying);
