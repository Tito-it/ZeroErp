# ------------------------------------------------------------
# PARTE B — LA LISTA DELLE RIGHE FATTURA CON IL PERIODO
#   vendite.vw_fattura_righe_lista
#   Brief: brief-db-bom-flag-quantita-e-kit-in-fattura, parte B (D-3, D-3.1)
#
#   Forma viva di 20261001-47 (identica alla doc auto-gen), con tre cambi che
#   seguono 20261002-64:
#   · il periodo nella PARTIZIONE dei componenti: un kit su due periodi sono due
#     padri, e ognuno porta i suoi componenti;
#   · il periodo nella tupla di riga_key del padre di kit: due padri dello
#     stesso kit su due periodi avrebbero la stessa chiave. ⚠️ La chiave dei
#     padri di kit cambia valore per tutte le righe: e' calcolata, nessuno la
#     memorizza;
#   · in coda competenza_dal, competenza_al, ha_periodo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261002-65-update-vw-fattura-righe-lista-periodo-mctit.yaml

  - changeSet:
      id: 20261002-65-update-vw-fattura-righe-lista-periodo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vw_fattura_righe_lista: il periodo entra nella partizione dei componenti e nella
        riga_key del padre di kit (lo stesso kit su due periodi sono due padri); in coda
        competenza_dal, competenza_al e ha_periodo. Brief:
        brief-db-bom-flag-quantita-e-kit-in-fattura (D-3, D-3.1).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_fattura_righe_lista
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_attribute
                   WHERE attrelid = 'vendite.vw_fattura_righe_esposte'::regclass
                     AND attname = 'ha_periodo' AND NOT attisdropped;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_fattura_righe_lista
              WITH (security_invoker=true) AS
              SELECT x.riga_key,
                  x.fattura_id,
                  x.tipo_riga,
                  x.riga_nr,
                  x.ordinamento,
                  x.fatture_righe_id,
                  x.articolo_id,
                  x.articolo_codice,
                  x.articolo_descrizione,
                  x.descrizione,
                  x.uom_id,
                  x.uom_codice,
                  x.qta AS quantita,
                  x.prezzo_unitario,
                  x.sconto_percentuale,
                  x.iva_id,
                  x.iva_codice,
                  x.iva_descrizione,
                  x.iva_aliquota,
                  x.iva_natura,
                  x.imponibile AS importo_riga,
                  x.dest_billing_account_id,
                  x.riga_capofila_id,
                  fr.riga_rettificata_id,
                  orig.riga_nr AS riga_rettificata_nr,
                  forig.id AS riga_rettificata_fattura_id,
                  vendite.fn_numero_documento_fattura(forig.numero, forig.serie) AS riga_rettificata_documento,
                  x.componenti,
                  x.componenti_numero,
                  -- ── in coda dal 2026-10-02: il periodo, e se c'e' ────────────
                  x.competenza_dal,
                  x.competenza_al,
                  x.ha_periodo
                 FROM (((( SELECT e.fattura_id,
                          e.tipo_riga,
                          e.riga_nr,
                          e.ordinamento,
                          e.livello,
                          e.fatture_righe_id,
                          e.articolo_id,
                          a.codice AS articolo_codice,
                          a.descrizione AS articolo_descrizione,
                          e.descrizione,
                          e.uom_id,
                          um.codice AS uom_codice,
                          e.qta,
                          e.prezzo_unitario,
                          e.sconto_percentuale,
                          e.iva_id,
                          iva.codice AS iva_codice,
                          iva.descrizione AS iva_descrizione,
                          iva.aliquota_iva AS iva_aliquota,
                          e.iva_natura,
                          e.imponibile,
                          e.dest_billing_account_id,
                          e.riga_capofila_id,
                          e.competenza_dal,
                          e.competenza_al,
                          e.ha_periodo,
                              CASE
                                  WHEN (e.fatture_righe_id IS NOT NULL) THEN ('R:'::text || (e.fatture_righe_id)::text)
                                  ELSE ((('K:'::text || (e.fattura_id)::text) || ':'::text) || md5(concat_ws('|'::text, e.kit_key, e.iva_id, e.dest_billing_account_id, e.articolo_id, e.descrizione, e.competenza_dal, e.competenza_al)))
                              END AS riga_key,
                          -- rev 2026-10-01: + esposizione, prezzo, sconto, importo. Sono
                          -- quelli della vista madre: NULL sul DESCRITTIVO, valorizzati sul
                          -- VALORIZZATO.
                          jsonb_agg(jsonb_build_object(
                              'fatture_righe_id', e.fatture_righe_id,
                              'riga_nr', e.riga_nr,
                              'articolo_id', e.articolo_id,
                              'articolo_codice', a.codice,
                              'descrizione', e.descrizione,
                              'quantita', e.qta,
                              'uom_codice', um.codice,
                              'esposizione', e.esposizione,
                              'prezzo_unitario', e.prezzo_unitario,
                              'sconto_percentuale', e.sconto_percentuale,
                              'importo_riga', e.imponibile)) FILTER (WHERE (e.livello = 1)) OVER kit AS componenti,
                          (count(*) FILTER (WHERE (e.livello = 1)) OVER kit)::integer AS componenti_numero
                         FROM (((vendite.vw_fattura_righe_esposte e
                           LEFT JOIN catalogo.articoli a ON ((a.id = e.articolo_id)))
                           LEFT JOIN catalogo.unita_misura um ON ((um.id = e.uom_id)))
                           LEFT JOIN config.iva iva ON ((iva.id = e.iva_id)))
                        WINDOW kit AS (PARTITION BY e.fattura_id, e.kit_key, e.iva_id, e.dest_billing_account_id, e.competenza_dal, e.competenza_al ORDER BY e.riga_nr, e.fatture_righe_id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)) x
                   LEFT JOIN vendite.fatture_righe fr ON ((fr.id = x.fatture_righe_id)))
                   LEFT JOIN vendite.fatture_righe orig ON ((orig.id = fr.riga_rettificata_id)))
                   LEFT JOIN vendite.fatture forig ON ((forig.id = orig.fattura_id)))
                WHERE (x.livello = 0);

              COMMENT ON VIEW vendite.vw_fattura_righe_lista IS
                  'Le righe di una fattura come LISTA (brief-db-liste-righe-documento, D-8.3, 2026-09-28): '
                  'SOLO il primo livello di vw_fattura_righe_esposte (NORMALE, PARTE_PLAFOND, KIT_PADRE), '
                  'cosi'' ordinamento e paginazione lavorano sulle righe del documento e un kit si muove '
                  'intero. riga_key identifica ogni riga: R:<id> per le righe vere, K:<fattura>:<md5> per '
                  'il padre di un kit (che non ha PK), costruita sulla stessa tupla con cui la vista madre '
                  'lo compone. I componenti ESPOSTI stanno nel padre (componenti jsonb, componenti_numero). '
                  '⭐ rev 2026-10-01 (brief-db-esposizione-componenti-kit-in-fattura): ogni componente '
                  'porta esposizione (DESCRITTIVO | VALORIZZATO), prezzo_unitario, sconto_percentuale e '
                  'importo_riga, valorizzati solo sul VALORIZZATO. ⚠️ Quindi importo_riga della lista NON '
                  'somma al totale del documento: l''importo dei valorizzati sta dentro componenti, e il '
                  'padre di un kit senza resto ha importo_riga NULL. E'' voluto: il componente resta '
                  'legato al kit. Il totale si legge dalla testata. Nessun calcolo rifatto: la '
                  'rappresentazione resta di vw_fattura_righe_esposte. Il numero della fattura rettificata '
                  'e'' quello parlante (fn_numero_documento_fattura). Nessun ORDER BY: l''ordine del '
                  'documento e'' ordinamento, riga_nr, riga_key. security_invoker: fatture_righe e'' in RLS. '
                  '⭐ rev 2026-10-02 (brief-db-bom-flag-quantita-e-kit-in-fattura): lo stesso kit su due '
                  'periodi sono due padri, quindi il periodo entra nella partizione dei componenti e '
                  'nella tupla di riga_key; in coda competenza_dal, competenza_al e ha_periodo dalla '
                  'vista madre (si stampa il periodo quando ha_periodo e'' vero).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- CREATE OR REPLACE non toglie colonne: DROP e la forma di 20261001-47.
              DROP VIEW IF EXISTS vendite.vw_fattura_righe_lista;
              CREATE VIEW vendite.vw_fattura_righe_lista
              WITH (security_invoker=true) AS
              SELECT x.riga_key,
                  x.fattura_id,
                  x.tipo_riga,
                  x.riga_nr,
                  x.ordinamento,
                  x.fatture_righe_id,
                  x.articolo_id,
                  x.articolo_codice,
                  x.articolo_descrizione,
                  x.descrizione,
                  x.uom_id,
                  x.uom_codice,
                  x.qta AS quantita,
                  x.prezzo_unitario,
                  x.sconto_percentuale,
                  x.iva_id,
                  x.iva_codice,
                  x.iva_descrizione,
                  x.iva_aliquota,
                  x.iva_natura,
                  x.imponibile AS importo_riga,
                  x.dest_billing_account_id,
                  x.riga_capofila_id,
                  fr.riga_rettificata_id,
                  orig.riga_nr AS riga_rettificata_nr,
                  forig.id AS riga_rettificata_fattura_id,
                  vendite.fn_numero_documento_fattura(forig.numero, forig.serie) AS riga_rettificata_documento,
                  x.componenti,
                  x.componenti_numero
                 FROM (((( SELECT e.fattura_id,
                          e.tipo_riga,
                          e.riga_nr,
                          e.ordinamento,
                          e.livello,
                          e.fatture_righe_id,
                          e.articolo_id,
                          a.codice AS articolo_codice,
                          a.descrizione AS articolo_descrizione,
                          e.descrizione,
                          e.uom_id,
                          um.codice AS uom_codice,
                          e.qta,
                          e.prezzo_unitario,
                          e.sconto_percentuale,
                          e.iva_id,
                          iva.codice AS iva_codice,
                          iva.descrizione AS iva_descrizione,
                          iva.aliquota_iva AS iva_aliquota,
                          e.iva_natura,
                          e.imponibile,
                          e.dest_billing_account_id,
                          e.riga_capofila_id,
                              CASE
                                  WHEN (e.fatture_righe_id IS NOT NULL) THEN ('R:'::text || (e.fatture_righe_id)::text)
                                  ELSE ((('K:'::text || (e.fattura_id)::text) || ':'::text) || md5(concat_ws('|'::text, e.kit_key, e.iva_id, e.dest_billing_account_id, e.articolo_id, e.descrizione)))
                              END AS riga_key,
                          -- rev 2026-10-01: + esposizione, prezzo, sconto, importo. Sono
                          -- quelli della vista madre: NULL sul DESCRITTIVO, valorizzati sul
                          -- VALORIZZATO.
                          jsonb_agg(jsonb_build_object(
                              'fatture_righe_id', e.fatture_righe_id,
                              'riga_nr', e.riga_nr,
                              'articolo_id', e.articolo_id,
                              'articolo_codice', a.codice,
                              'descrizione', e.descrizione,
                              'quantita', e.qta,
                              'uom_codice', um.codice,
                              'esposizione', e.esposizione,
                              'prezzo_unitario', e.prezzo_unitario,
                              'sconto_percentuale', e.sconto_percentuale,
                              'importo_riga', e.imponibile)) FILTER (WHERE (e.livello = 1)) OVER kit AS componenti,
                          (count(*) FILTER (WHERE (e.livello = 1)) OVER kit)::integer AS componenti_numero
                         FROM (((vendite.vw_fattura_righe_esposte e
                           LEFT JOIN catalogo.articoli a ON ((a.id = e.articolo_id)))
                           LEFT JOIN catalogo.unita_misura um ON ((um.id = e.uom_id)))
                           LEFT JOIN config.iva iva ON ((iva.id = e.iva_id)))
                        WINDOW kit AS (PARTITION BY e.fattura_id, e.kit_key, e.iva_id, e.dest_billing_account_id ORDER BY e.riga_nr, e.fatture_righe_id ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)) x
                   LEFT JOIN vendite.fatture_righe fr ON ((fr.id = x.fatture_righe_id)))
                   LEFT JOIN vendite.fatture_righe orig ON ((orig.id = fr.riga_rettificata_id)))
                   LEFT JOIN vendite.fatture forig ON ((forig.id = orig.fattura_id)))
                WHERE (x.livello = 0);

              COMMENT ON VIEW vendite.vw_fattura_righe_lista IS
                  'Le righe di una fattura come LISTA (brief-db-liste-righe-documento, D-8.3, 2026-09-28): '
                  'SOLO il primo livello di vw_fattura_righe_esposte (NORMALE, PARTE_PLAFOND, KIT_PADRE), '
                  'cosi'' ordinamento e paginazione lavorano sulle righe del documento e un kit si muove '
                  'intero. riga_key identifica ogni riga: R:<id> per le righe vere, K:<fattura>:<md5> per '
                  'il padre di un kit (che non ha PK), costruita sulla stessa tupla con cui la vista madre '
                  'lo compone. I componenti ESPOSTI stanno nel padre (componenti jsonb, componenti_numero). '
                  '⭐ rev 2026-10-01 (brief-db-esposizione-componenti-kit-in-fattura): ogni componente '
                  'porta esposizione (DESCRITTIVO | VALORIZZATO), prezzo_unitario, sconto_percentuale e '
                  'importo_riga, valorizzati solo sul VALORIZZATO. ⚠️ Quindi importo_riga della lista NON '
                  'somma al totale del documento: l''importo dei valorizzati sta dentro componenti, e il '
                  'padre di un kit senza resto ha importo_riga NULL. E'' voluto: il componente resta '
                  'legato al kit. Il totale si legge dalla testata. Nessun calcolo rifatto: la '
                  'rappresentazione resta di vw_fattura_righe_esposte. Il numero della fattura rettificata '
                  'e'' quello parlante (fn_numero_documento_fattura). Nessun ORDER BY: l''ordine del '
                  'documento e'' ordinamento, riga_nr, riga_key. security_invoker: fatture_righe e'' in RLS.';
