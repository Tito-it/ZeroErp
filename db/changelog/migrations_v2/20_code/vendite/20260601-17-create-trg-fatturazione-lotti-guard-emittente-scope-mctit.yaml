databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260601-17-create-trg-fatturazione-lotti-guard-emittente-scope-mctit.yaml

  - changeSet:
      id: 20260601-17-create-trg-fatturazione-lotti-guard-emittente-scope
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Aggancia il write-guard scope emittente a vendite.fatturazione_lotti
        (brief RLS §7, Ondata 1 famiglia fatture - convenzione SR). Modalita'
        'soggetto_ruolo' su emittente_soggetto_ruolo_id. NB: la colonna e'
        nullable; righe a emittente NULL passano il guard (skip), coerente con
        la sanazione strutturale pianificata (backfill + SET NOT NULL) prima
        dell'ENABLE in lettura.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: vendite, tableName: fatturazione_lotti }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_guard_emittente_scope';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_fatturazione_lotti_a10_guard_emittente_scope_ins_upd
                ON vendite.fatturazione_lotti;

              CREATE TRIGGER trg_fatturazione_lotti_a10_guard_emittente_scope_ins_upd
                BEFORE INSERT OR UPDATE ON vendite.fatturazione_lotti
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_guard_emittente_scope(
                  'soggetto_ruolo', 'emittente_soggetto_ruolo_id'
                );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_fatturazione_lotti_a10_guard_emittente_scope_ins_upd
                ON vendite.fatturazione_lotti;
