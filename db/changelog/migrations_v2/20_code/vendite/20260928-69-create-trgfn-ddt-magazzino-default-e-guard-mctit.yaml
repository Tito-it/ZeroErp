# P-3 — Il magazzino della bolla: il default e le regole che un CHECK non vede
#   vendite.trgfn_ddt_default_magazzino()  + trg_ddt_a10_default_magazzino_ins
#   vendite.trgfn_ddt_guard_magazzino()    + trg_ddt_a10_guard_magazzino_ins_upd
#   Brief: brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 3 (D-L3-a, D-L3-h)
#
# -- IL DEFAULT (D-L3-h) --------------------------------------------------------------------------
#   Una bolla nata senza magazzino prende il PREDEFINITO del suo emittente
#   (uno solo per emittente, 20260928-65). Solo all'INSERT, e solo se manca:
#   chi lo sceglie non viene sovrascritto, e in bozza lo si cambia.
#   ⚠️ Prima occorrenza di un «default per emittente» su un valore che non e'
#   l'emittente: resta scritta qui (regola del 2). Il BB
#   script.trgfn_default_emittente_fiscale risolve l'EMITTENTE, non un oggetto
#   dell'emittente — non e' la stessa regola.
#   ⭐ Ordine dei BEFORE INSERT (alfabetico): a10_default_emittente, POI
#   a10_default_magazzino (l'emittente serve per scegliere), POI
#   a10_guard_magazzino e a10_guard_emittente_scope.
#
# -- IL GUARD (D-L3-a) ----------------------------------------------------------------------------
#   Tre regole che guardano fuori dalla riga, quindi non sono CHECK:
#   1. IMMUTABILI fuori bozza: si guarda lo stato VECCHIO, come
#      trgfn_ddt_guard_causale_immutabile — l'UPDATE che emette e sceglie il
#      magazzino insieme resta lecito;   -> E_DDT_MAGAZZINO_IMMUTABILE
#   2. l'arrivo lo porta SOLO la bolla di trasferimento (causale di magazzino
#      TRASF_OUT, D-L3-g), ed e' diverso dalla partenza (il CHECK
#      chk_ddt_magazzino_arrivo_distinto resta la rete, il guard da' la frase);
#   3. i magazzini sono dell'EMITTENTE della bolla (M-6: nessuna operazione
#      attraversa due emittenti). Letti sotto RLS: un magazzino di un altro
#      emittente non si vede, e la risposta e' la stessa — no-leak.
#                                         -> E_DDT_MAGAZZINO_INCOERENTE
#   ⚠️ Non si pretende l'arrivo in bozza: e' un motivo dell'emissione
#   (script.fn_check_ddt_merce), la bozza si compila per gradi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260928-69-create-trgfn-ddt-magazzino-default-e-guard-mctit.yaml

  - changeSet:
      id: 20260928-69-create-trgfn-ddt-magazzino-default-e-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il magazzino della bolla: default dal predefinito dell'emittente all'INSERT (D-L3-h) e
        guard delle regole che un CHECK non vede — immutabile fuori bozza, arrivo solo per la bolla
        di trasferimento e diverso dalla partenza, magazzini dell'emittente della bolla (D-L3-a).
        Brief: brief-db-magazzino-lotto-3-scarico-da-ddt, sezione 3.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: ddt
                columnName: magazzino_arrivo_id
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_ddt_causale_magazzino';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_default_magazzino()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: una bolla nata senza magazzino prende il predefinito del suo
              --   emittente (D-L3-h). Solo se manca: chi lo sceglie vince.
              DECLARE
                  v_magazzino_id magazzino.magazzini.id%TYPE;
              BEGIN
                  IF NEW.magazzino_id IS NULL AND NEW.emittente_fiscale_id IS NOT NULL THEN
                      SELECT m.id INTO v_magazzino_id
                        FROM magazzino.magazzini m
                       WHERE m.emittente_fiscale_id = NEW.emittente_fiscale_id
                         AND m.predefinito
                         AND m.attivo;
                      NEW.magazzino_id := v_magazzino_id;   -- NULL se non c'e' un predefinito
                  END IF;
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_default_magazzino() IS
                  'BEFORE INSERT su vendite.ddt: se magazzino_id manca, prende il magazzino '
                  'predefinito e attivo dell''emittente della bolla (uno solo per emittente, '
                  'uq_mag_magazzini_predefinito_emittente) — D-L3-h. Nessun predefinito: resta '
                  'NULL, e se la bolla muove merce lo chiede la check dell''emissione. Gira dopo '
                  'il default dell''emittente (ordine alfabetico dei trigger). Brief: '
                  'brief-db-magazzino-lotto-3-scarico-da-ddt.';

              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_magazzino()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le regole del magazzino della bolla che un CHECK non vede
              --   (D-L3-a): immutabile fuori bozza, arrivo solo per la bolla di
              --   trasferimento e diverso dalla partenza, magazzini dell'emittente
              --   della bolla. Un solo codice per le regole di coerenza: la frase la
              --   compone il VARIADIC, che dice quale.
              DECLARE
                  v_stato_old config.stati_doc_ddt.codice_interno%TYPE;
                  v_causale   config.causali_trasporto.causale_magazzino%TYPE;
                  v_ef        magazzino.magazzini.emittente_fiscale_id%TYPE;
                  v_mag_id    magazzino.magazzini.id%TYPE;
              BEGIN
                  -- 1. Immutabili fuori bozza: lo stato VECCHIO decide.
                  IF TG_OP = 'UPDATE'
                     AND (NEW.magazzino_id        IS DISTINCT FROM OLD.magazzino_id
                          OR NEW.magazzino_arrivo_id IS DISTINCT FROM OLD.magazzino_arrivo_id) THEN
                      SELECT s.codice_interno INTO v_stato_old
                        FROM config.stati_doc_ddt s
                       WHERE s.id = OLD.stato_doc_ddt_id;
                      IF v_stato_old IS DISTINCT FROM 'DRAFT' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_IMMUTABILE',
                              jsonb_build_object('ddt_id', NEW.id, 'stato', v_stato_old,
                                                 'magazzino_da', OLD.magazzino_id, 'magazzino_a', NEW.magazzino_id,
                                                 'arrivo_da', OLD.magazzino_arrivo_id, 'arrivo_a', NEW.magazzino_arrivo_id),
                              -- Niente bersaglio: DDT non e' (ancora) un tipo di
                              -- config.tipi_entita, e l'operatore e' gia' sulla bolla.
                              NEW.tx_id,
                              COALESCE(v_stato_old, 'NULL'));
                      END IF;
                  END IF;

                  -- 2. L'arrivo: solo la bolla di trasferimento, e un ALTRO magazzino.
                  IF NEW.magazzino_arrivo_id IS NOT NULL THEN
                      v_causale := vendite.fn_ddt_causale_magazzino(NEW);
                      IF v_causale IS DISTINCT FROM 'TRASF_OUT' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_INCOERENTE',
                              jsonb_build_object('ddt_id', NEW.id, 'regola', 'ARRIVO_SOLO_TRASFERIMENTO',
                                                 'causale_magazzino', v_causale),
                              NEW.tx_id,
                              'il magazzino di arrivo lo indica solo una bolla di trasferimento fra depositi');
                      END IF;
                      IF NEW.magazzino_arrivo_id = NEW.magazzino_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_INCOERENTE',
                              jsonb_build_object('ddt_id', NEW.id, 'regola', 'ARRIVO_UGUALE_PARTENZA',
                                                 'magazzino_id', NEW.magazzino_id),
                              NEW.tx_id,
                              'il magazzino di arrivo coincide con quello di partenza');
                      END IF;
                  END IF;

                  -- 3. Dell'emittente della bolla (M-6). Sotto RLS: un magazzino di un
                  --    altro emittente non si vede, e la frase e' la stessa.
                  FOREACH v_mag_id IN ARRAY ARRAY[NEW.magazzino_id, NEW.magazzino_arrivo_id] LOOP
                      CONTINUE WHEN v_mag_id IS NULL;
                      v_ef := NULL;
                      SELECT m.emittente_fiscale_id INTO v_ef
                        FROM magazzino.magazzini m
                       WHERE m.id = v_mag_id;
                      IF v_ef IS DISTINCT FROM NEW.emittente_fiscale_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_INCOERENTE',
                              jsonb_build_object('ddt_id', NEW.id, 'regola', 'EMITTENTE',
                                                 'magazzino_id', v_mag_id,
                                                 'emittente_ddt', NEW.emittente_fiscale_id),
                              NEW.tx_id,
                              'il magazzino indicato non appartiene all''azienda che emette la bolla');
                      END IF;
                  END LOOP;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_magazzino() IS
                  'Guard BEFORE INSERT OR UPDATE OF magazzino_id, magazzino_arrivo_id, '
                  'causale_trasporto_id, emittente_fiscale_id su vendite.ddt (D-L3-a). '
                  'E_DDT_MAGAZZINO_IMMUTABILE: il magazzino (o l''arrivo) cambia su una bolla '
                  'che non era in bozza — stato VECCHIO, come la causale. '
                  'E_DDT_MAGAZZINO_INCOERENTE, con la regola nel VARIADIC: arrivo su una bolla che '
                  'non e'' di trasferimento (causale di magazzino diversa da TRASF_OUT), arrivo '
                  'uguale alla partenza, magazzino di un altro emittente (letto sotto RLS: '
                  'invisibile e inesistente rispondono uguale). L''arrivo mancante NON e'' qui: e'' '
                  'un motivo dell''emissione (script.fn_check_ddt_merce). Brief: '
                  'brief-db-magazzino-lotto-3-scarico-da-ddt.';

              CREATE TRIGGER trg_ddt_a10_default_magazzino_ins
                  BEFORE INSERT ON vendite.ddt
                  FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_ddt_default_magazzino();

              CREATE TRIGGER trg_ddt_a10_guard_magazzino_ins_upd
                  BEFORE INSERT OR UPDATE OF magazzino_id, magazzino_arrivo_id,
                                             causale_trasporto_id, emittente_fiscale_id
                  ON vendite.ddt
                  FOR EACH ROW EXECUTE FUNCTION vendite.trgfn_ddt_guard_magazzino();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_a10_guard_magazzino_ins_upd ON vendite.ddt;
              DROP TRIGGER IF EXISTS trg_ddt_a10_default_magazzino_ins ON vendite.ddt;
              DROP FUNCTION IF EXISTS vendite.trgfn_ddt_guard_magazzino();
              DROP FUNCTION IF EXISTS vendite.trgfn_ddt_default_magazzino();
