# ------------------------------------------------------------
# Trigger su vendite.ddt_righe (tabella esistente):
# propaga quantita ai figli in ddt_righe_componenti
# quando la quantita della riga padre cambia.
#
# File separato da YAML 26 perche' agisce su una tabella diversa
# (ddt_righe, gia' esistente) rispetto alla tabella nuova.
#
# Naming _z90_propaga_: fase finale, ordine lessicografico
# 'propaga' < 'ricalcola' garantisce esecuzione prima di
# eventuali trg_ddt_righe_z90_ricalcola_*.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-27-create-trg-ddt-righe-propaga-qta-componenti-mctit.yaml

  - changeSet:
      id: 20260511-27-01-trg-ddtrighe-z90-propaga-qta-componenti
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        AFTER UPDATE OF quantita su vendite.ddt_righe _z90_:
        propaga la nuova quantita ai componenti BoM CASO A come
        quantita = coeff_qta_snapshot * NEW.quantita.
        UPDATE OF quantita: scatta solo quando quantita cambia,
        evita overhead su ogni UPDATE.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: ddt_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_componenti_propaga_qta';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_righe_z90_propaga_qta_componenti_upd
                  ON vendite.ddt_righe;

              CREATE TRIGGER trg_ddt_righe_z90_propaga_qta_componenti_upd
                  AFTER UPDATE OF quantita
                  ON vendite.ddt_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_propaga_qta(
                      'vendite',
                      'ddt_righe_componenti',
                      'riga_ddt_id'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_righe_z90_propaga_qta_componenti_upd
                  ON vendite.ddt_righe;
