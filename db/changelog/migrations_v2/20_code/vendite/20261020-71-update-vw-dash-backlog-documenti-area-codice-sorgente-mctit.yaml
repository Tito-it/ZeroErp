# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2d (G-6): vw_dash_backlog_documenti: l'area RESI diventa RESO_VENDITA
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-6, §10.4.
#
#   La dashboard raggruppa per codice della sorgente (G-6): il valore della colonna area passa
#   dal plurale (RESI) al codice (RESO_VENDITA). Stesso tipo, stessa colonna: CREATE OR REPLACE,
#   le viste sopra (vw_dash_fatturazione_documenti, i riepiloghi) restano in piedi.
#   ⚠️ CAMBIA UN VALORE nelle risposte della dashboard: le costanti DASH_*_AREE del backend e
#   il frontend della dashboard seguono nello stesso giro.
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. %TYPE in firma, DECLARE e RETURNS TABLE dove c'e' una colonna; nudi, col
#   motivo accanto, i valori che una colonna non ha (conteggi, jsonb di lavoro, array).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-71-update-vw-dash-backlog-documenti-area-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261020-71-update-vw-dash-backlog-documenti-area-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_dash_backlog_documenti: l'area RESI diventa RESO_VENDITA, il codice della sorgente. Grammatica unica, 2d (G-6).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- security_invoker si AZZERA a ogni CREATE OR REPLACE VIEW: si ripete dal catalogo.
              CREATE OR REPLACE VIEW vendite.vw_dash_backlog_documenti WITH (security_invoker=on) AS
              WITH base AS (
                       SELECT d.area,
                          d.competenza_mese,
                          d.documento_id,
                          d.documento_uid,
                          d.codice,
                          d.cliente_display,
                          d.emittente_fiscale_id,
                          d.emittente_soggetto_ruolo_id,
                          (d.valore_totale - d.valore_transitato) AS valore_fermo,
                          (d.unita_totali - d.unita_transitate) AS unita_ferme,
                          d.motivo_fermo,
                          d.data_riferimento,
                          d.stato_codice_interno,
                          d.stato_codice,
                          d.fase
                         FROM vendite.vw_dash_fatturazione_documenti d
                        WHERE (d.motivo_fermo IS NOT NULL)
                      UNION ALL
                       SELECT 'RESO_VENDITA'::character varying AS area,
                          (date_trunc('month'::text, (q.data)::timestamp with time zone))::date AS competenza_mese,
                          q.reso_id AS documento_id,
                          (q.reso_uid)::text AS documento_uid,
                          (q.reso_numero)::text AS codice,
                          q.destinatario_denominazione AS cliente_display,
                          q.emittente_fiscale_id,
                          NULL::bigint AS emittente_soggetto_ruolo_id,
                          NULL::numeric AS valore_fermo,
                          (count(*))::integer AS unita_ferme,
                          'RICONSEGNA_NON_ESEGUITA'::character varying AS motivo_fermo,
                          q.data AS data_riferimento,
                          sdr.codice_interno AS stato_codice_interno,
                          sdr.codice AS stato_codice,
                          sdr.fase
                         FROM ((vendite.vw_resi_da_riconsegnare q
                           JOIN vendite.resi r2 ON ((r2.id = q.reso_id)))
                           JOIN config.stati_doc_reso sdr ON ((sdr.id = r2.stato_doc_reso_id)))
                        GROUP BY q.reso_id, q.reso_uid, q.reso_numero, q.data, q.destinatario_denominazione, q.emittente_fiscale_id, sdr.codice_interno, sdr.codice, sdr.fase
                      UNION ALL
                       SELECT 'RESO_VENDITA'::character varying AS area,
                          (date_trunc('month'::text, (a.data)::timestamp with time zone))::date AS competenza_mese,
                          a.reso_id AS documento_id,
                          (a.reso_uid)::text AS documento_uid,
                          (a.reso_numero)::text AS codice,
                          a.destinatario_denominazione AS cliente_display,
                          a.emittente_fiscale_id,
                          NULL::bigint AS emittente_soggetto_ruolo_id,
                          NULL::numeric AS valore_fermo,
                          (count(*))::integer AS unita_ferme,
                          'MERCE_RESA_GIA_FATTURATA'::character varying AS motivo_fermo,
                          a.data AS data_riferimento,
                          sdr.codice_interno AS stato_codice_interno,
                          sdr.codice AS stato_codice,
                          sdr.fase
                         FROM ((vendite.vw_resi_da_accreditare a
                           JOIN vendite.resi r3 ON ((r3.id = a.reso_id)))
                           JOIN config.stati_doc_reso sdr ON ((sdr.id = r3.stato_doc_reso_id)))
                        WHERE ((a.etichetta)::text = 'DOVUTA'::text)
                        GROUP BY a.reso_id, a.reso_uid, a.reso_numero, a.data, a.destinatario_denominazione, a.emittente_fiscale_id, sdr.codice_interno, sdr.codice, sdr.fase
                      )
               SELECT b.area,
                  b.competenza_mese,
                  b.documento_id,
                  b.documento_uid,
                  b.codice,
                  b.cliente_display,
                  b.emittente_fiscale_id,
                  b.emittente_soggetto_ruolo_id,
                  b.valore_fermo,
                  b.unita_ferme,
                  b.motivo_fermo,
                  COALESCE(mf.classe, 'ANOMALIA'::character varying) AS classe,
                  mf.azione,
                  b.data_riferimento,
                  (( SELECT script.fn_data_operativa() AS fn_data_operativa) - b.data_riferimento) AS anzianita_giorni,
                  b.stato_codice_interno,
                  b.stato_codice,
                  b.fase,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale
                 FROM ((((base b
                   LEFT JOIN config.motivi_fermo mf ON ((((mf.codice_interno)::text = (b.motivo_fermo)::text) AND (mf.attivo IS TRUE))))
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ((ef.id = b.emittente_fiscale_id)))
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON ((sr_ef.id = COALESCE(b.emittente_soggetto_ruolo_id, ef.soggetto_ruolo_id))))
                   LEFT JOIN anagrafiche.soggetti s_ef ON ((s_ef.id = sr_ef.soggetto_id)))
                WHERE ((COALESCE(mf.classe, 'ANOMALIA'::character varying))::text <> 'FISIOLOGICO'::text);

              COMMENT ON VIEW vendite.vw_dash_backlog_documenti IS
                'Backlog fatturazione (lente 2). rev 2026-07-18 (step 9, DL-24): la vista E'' una UNION — ramo documenti (da vw_dash_fatturazione_documenti, invariato) + DUE rami resi a grana (reso x motivo): RICONSEGNA_NON_ESEGUITA (RECUPERABILE) da vw_resi_da_riconsegnare e MERCE_RESA_GIA_FATTURATA da vw_resi_da_accreditare con etichetta DOVUTA (le facoltative sono opzione, non arretrato). I resi NON stanno nella union pre-commessa: REVERSE_FLOW. Misura a conteggi (DL-11): valore_fermo NULL, mai 0. Classe/azione risolte UNA volta a valle su config.motivi_fermo, filtro classe <> FISIOLOGICO per tutti i rami. Deroga dichiarata: unica area dove un documento (reso misto) puo'' comparire due volte. security_invoker=on + RLS. ⭐ Rev 2026-08-18 (R-4, brief perimetro-emittente Fase E): aggiunta in coda `emittente_ragione_sociale`. ⚠️ Due trappole, entrambe silenziose: (1) la proiezione e'' a colonne esplicite, quindi la colonna NON si eredita dalla vista a monte — va elencata, e il backend legge questa; (2) i due rami RESI non hanno emittente_soggetto_ruolo_id (NULL) ma hanno emittente_fiscale_id: risolvere solo dal soggetto-ruolo avrebbe lasciato muto l''INTERO blocco resi, che essendo minoritario sarebbe passato per «qualche riga senza emittente». Si risolve con un COALESCE sulla CHIAVE (emittente_soggetto_ruolo_id, altrimenti emittenti_fiscali.soggetto_ruolo_id, che e'' NOT NULL + UNIQUE): una sola catena di JOIN, un solo posto da tenere allineato. ⚠️ emittente_soggetto_ruolo_id sui rami resi resta NULL come prima: valorizzarla e'' un cambio di semantica di una colonna esistente e va deciso a parte. Rev 2026-10-20 (20261020-71, brief-db-grammatica-unica-documenti 2d, G-6): l''area RESI diventa RESO_VENDITA, il codice della sorgente (il plurale e'' ritirato).';

      rollback:
