# DB-B (refactor-lista-contratti §3.1): vista sorgente per la lista
# configurabile vendite.contratti.
#
# Pura DENORMALIZZAZIONE (JOIN + campi display): NESSUN filtro/scope/
# paginazione. Scope emittente, filtri e LIMIT/OFFSET restano nel
# repository consumer (BE), come per fornitori/clienti.
#
# RLS ATTIVA su vendite.contratti (lotto 20260601-28/41) -> la vista e'
# WITH (security_invoker = on): viene eseguita col contesto del chiamante
# (zeroerp_app NOBYPASSRLS + GUC), cosi' le policy RLS della tabella base
# si applicano e non e' "RLS cosmetica" (linee-guida-sql §10.1, precedente
# 20260601-26 sulle viste lotto).
#
# Nomi colonna ALLA LETTERA dello standard liste (lezione DEF-8):
#   - ragione_sociale_completa, id_fiscale_univoco_cf_piva: nomi canonici
#     del soggetto, SENZA alias ba_* (campo_sorgente del catalogo li valida
#     contro la vista via trigger B2).
#   - ba_codice: ECCEZIONE legittima (codice del billing account, non del
#     soggetto): ba.codice nudo collidererebbe -> alias ba_codice corretto.
#   - stato_codice = stati_doc_contratti.codice_interno (per severity Tag FE).
#
# Deviazione voluta vs ContrattiRepository._FROM_JOINS_CONTRATTO: join
# DIRETTO a anagrafiche.soggetti (billing_account -> soggetti_ruoli ->
# soggetti) invece di annidare anagrafiche.vw_soggetti_ruoli_dettaglio. Una
# vista nidificata non-invoker reintrodurrebbe il rischio RLS-cosmetica; il
# join diretto e' allineato al pattern di vw_clienti_lista. ragione_sociale_
# completa e id_fiscale_univoco_cf_piva sono colonne reali su soggetti.
#
# CREATE OR REPLACE preceduto da DROP per poter cambiare la struttura su
# re-run (runOnChange).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260602-15-create-vw-contratti-lista-mctit.yaml

  - changeSet:
      id: 20260602-15-create-vw-contratti-lista
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea vendite.vw_contratti_lista (security_invoker=on) come sorgente
        denormalizzata per la lista configurabile vendite.contratti. Nessun
        scope/filtro: restano nel repository consumer.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: contratti
          - tableExists:
              schemaName: anagrafiche
              tableName: billing_account
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_contratti_lista;
              CREATE VIEW vendite.vw_contratti_lista
              WITH (security_invoker = on) AS
              SELECT
                  c.id,
                  c.uid,
                  c.numero,
                  c.billing_account_id,
                  ba.codice                        AS ba_codice,
                  s.id                             AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  c.emittente_fiscale_id,
                  ef.codice                        AS emittente_fiscale_codice,
                  c.utility_id,
                  u.codice                         AS utility_codice,
                  u.descrizione                    AS utility_descrizione,
                  c.ambito,
                  c.data,
                  c.valido_dal,
                  c.valido_al,
                  c.stato_doc_contratto_id,
                  sd.codice_interno                AS stato_codice,
                  sd.descrizione                   AS stato_descrizione,
                  c.listino_id,
                  l.codice                         AS listino_codice,
                  l.descrizione                    AS listino_descrizione,
                  c.listino_versione_id,
                  lv.codice_versione               AS listino_versione_codice,
                  c.tipo_variazione_globale,
                  c.valore_variazione_globale,
                  c.categoria_cliente_id_snapshot,
                  cc_snap.codice                   AS categoria_cliente_snapshot_codice,
                  cc_snap.descrizione              AS categoria_cliente_snapshot_descrizione,
                  c.valuta_id,
                  v_val.codice                     AS valuta_codice,
                  v_val.descrizione                AS valuta_descrizione,
                  c.data_insert,
                  c.user_insert,
                  c.data_update,
                  c.user_update
              FROM vendite.contratti c
              JOIN anagrafiche.billing_account ba    ON ba.id = c.billing_account_id
              JOIN anagrafiche.soggetti_ruoli sr     ON sr.id = ba.soggetto_ruolo_id
              JOIN anagrafiche.soggetti s            ON s.id  = sr.soggetto_id
              JOIN config.utilities u                ON u.id  = c.utility_id
              JOIN config.stati_doc_contratti sd     ON sd.id = c.stato_doc_contratto_id
              LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = c.emittente_fiscale_id
              LEFT JOIN vendite.listini l            ON l.id  = c.listino_id
              LEFT JOIN vendite.listini_versioni lv  ON lv.id = c.listino_versione_id
              LEFT JOIN anagrafiche.categorie_clienti cc_snap ON cc_snap.id = c.categoria_cliente_id_snapshot
              LEFT JOIN config.valute v_val          ON v_val.id = c.valuta_id;

              COMMENT ON VIEW vendite.vw_contratti_lista IS
                'Vista flat contratti per la lista UI configurabile (vendite.contratti). '
                'Pura denormalizzazione: nessuno scope/filtro/paginazione (restano nel '
                'repository consumer). security_invoker=on per rispettare la RLS della '
                'tabella base. Sorgente dati per ui.lista_definizione codice=''vendite.contratti''.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_contratti_lista;
