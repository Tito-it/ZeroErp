# vendite.fn_offerta_eccezione_componenti_init: provenienza del componente nelle colonne, override con provenienza
#   Brief: brief-db-provenienza-prezzo-segue-il-prezzo (§8.8, giro 3, R-4, D-3)
#
#   Due cose, nella stessa funzione:
#     · il ramo del resolver scrive versione e riga di listino nelle colonne del
#       componente (giro 1), non piu' nel contesto (D-3): il contesto ha le chiavi
#       del risultato del resolver (vendite.fn_prezzo_resolver_contesto), piu' le
#       condizioni della risoluzione (emittente, data, billing account, utility);
#     · l'override puo' portare la sua provenienza: un prezzo resta MANUALE, un
#       oggetto {prezzo, origine_prezzo, listino_versione_id, listino_riga_id,
#       prezzo_resolver_context} la dichiara (vendite.fn_componente_override). Lo
#       passano le funzioni che copiano un documento in un altro (R-4); il BE
#       passa numeri, e per lui non cambia niente.
#   Il resto del corpo e il COMMENT sono quelli della revisione di partenza,
#   verificata identica al vivo il 2026-11-13. Rollback: quella revisione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261113-29-update-fn-offerta-eccezione-componenti-init-provenienza-mctit.yaml

  - changeSet:
      id: 20261113-29-update-fn-offerta-eccezione-componenti-init-provenienza
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_offerta_eccezione_componenti_init: versione e riga di listino del componente nelle colonne, override con la sua provenienza. Brief: brief-db-provenienza-prezzo-segue-il-prezzo (§8.8).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_offerta_eccezione_componenti_init(
                   p_eccezione_id          vendite.offerte_commerciali_eccezioni.id%TYPE,
                   -- Nudi DICHIARATI: il soggetto-ruolo emittente, la data di riferimento
                   -- del prezzo e gli override dei prezzi dei componenti (jsonb).
                   p_emittente_sr_id       anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                   p_data_riferimento      date,
                   p_componenti_overrides  jsonb DEFAULT NULL::jsonb)
                RETURNS integer
                LANGUAGE plpgsql
                SECURITY INVOKER
               AS $function$
              -- Scopo: Popola offerte_commerciali_eccezioni_componenti per un'eccezione composita CASO A.
              --   Modello unificato rev 2026-05-27: tutti i componenti attivi inseriti con attivo=TRUE;
              --   nessun filtro esposto_in_fattura. Chiave overrides: componente_id::text
              --   (uuid articolo figlio — allineato al FE ComponentiDialog).
              --   Guard override=0 solo su obbligatori. Check BOM vuota post-loop.
              --   Fallback resolver P0001: prezzo=0/MANUALE (offerta permissiva vs contratto strict).
              --   No-op su quantita IS NULL (eccezione a consumo). Idempotente.
              --   rev 2026-06-05: guard difensivo — no-op su tipo_eccezione = 'ESCLUSIONE'
              --   (articolo escluso interamente, nessun componente; protegge il CHECK prezzo NULL).
              DECLARE
                  v_articolo_id     catalogo.articoli.id%TYPE;
                  v_codice_articolo catalogo.articoli.codice%TYPE;
                  v_uom_id          catalogo.unita_misura.id%TYPE;
                  v_qta_padre       vendite.offerte_commerciali_eccezioni.quantita%TYPE;
                  v_offerta_id      vendite.offerte_commerciali.id%TYPE;
                  v_tipo_eccezione  vendite.offerte_commerciali_eccezioni.tipo_eccezione%TYPE;
                  v_is_composito    catalogo.articoli.is_composito%TYPE;
                  v_ba_id           anagrafiche.billing_account.id%TYPE;
                  v_utility_id      vendite.offerte_commerciali.utility_id%TYPE;
                  v_istanza_id      vendite.offerte_commerciali.istanza_utility_id%TYPE;
                  v_comp            record;
                  v_resolve         record;
                  v_prezzo          vendite.listini_righe.prezzo%TYPE;
                  v_origine         vendite.offerte_commerciali_eccezioni_componenti.origine_prezzo%TYPE;
                  -- La provenienza dichiarata da un override (vendite.fn_componente_override).
                  v_ov_versione      vendite.listini_righe.listino_versione_id%TYPE;
                  v_ov_riga          vendite.listini_righe.id%TYPE;
                  v_ov_contesto      vendite.preventivi_righe.prezzo_resolver_context%TYPE;
                  v_inserted        integer := 0;
              BEGIN
                  IF p_eccezione_id IS NULL OR p_eccezione_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_offerta_eccezione_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_eccezione_id'),
                          NULL::uuid,
                          'p_eccezione_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_emittente_sr_id IS NULL OR p_emittente_sr_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_offerta_eccezione_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_emittente_sr_id'),
                          NULL::uuid,
                          'p_emittente_sr_id obbligatorio e > 0'
                      );
                  END IF;

                  SELECT oce.articolo_id,
                         oce.uom_operativa_id,
                         oce.quantita,
                         oce.offerta_id,
                         oce.tipo_eccezione
                    INTO v_articolo_id, v_uom_id, v_qta_padre, v_offerta_id, v_tipo_eccezione
                    FROM vendite.offerte_commerciali_eccezioni oce
                   WHERE oce.id = p_eccezione_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_offerta_eccezione_componenti_init',
                          -- rev 2026-08-07: era E_PARAMETRO_INVALIDO, cioe' 400 su un 404.
                          'E_OFFERTA_ECCEZIONE_NON_TROVATA',
                          jsonb_build_object('p_eccezione_id', p_eccezione_id),
                          NULL::uuid,
                          p_eccezione_id::text
                      );
                  END IF;

                  SELECT a.is_composito, a.codice
                    INTO v_is_composito, v_codice_articolo
                    FROM catalogo.articoli a WHERE a.id = v_articolo_id;

                  IF NOT v_is_composito THEN
                      RETURN 0;
                  END IF;

                  -- Guard difensivo: ESCLUSIONE = articolo escluso interamente,
                  -- nessun prezzo (CHECK chk_offerte_eccezioni_prezzo_per_tipo_eccezione
                  -- impone prezzo_unitario IS NULL) e quindi nessun componente BoM.
                  -- Inizializzare i componenti scatenerebbe il ricalcolo del prezzo padre
                  -- (trigger _z90_ricalcola_padre -> SUM figli) in violazione del CHECK.
                  -- rev 2026-10-29 (20261029-43, G-0-ter): anche l'ADESIONE (senza prezzo suo).
                  IF v_tipo_eccezione IN ('ESCLUSIONE', 'ADESIONE') THEN
                      RETURN 0;
                  END IF;

                  -- No-op su eccezione a consumo: quantita NULL non permette
                  -- il calcolo delle quantita dei componenti.
                  IF v_qta_padre IS NULL THEN
                      RETURN 0;
                  END IF;

                  IF EXISTS (
                      SELECT 1 FROM vendite.offerte_commerciali_eccezioni_componenti
                       WHERE eccezione_offerta_id = p_eccezione_id
                  ) THEN
                      RETURN 0;
                  END IF;

                  SELECT o.billing_account_id, o.utility_id, o.istanza_utility_id
                    INTO v_ba_id, v_utility_id, v_istanza_id
                    FROM vendite.offerte_commerciali o WHERE o.id = v_offerta_id;

                  -- Loop per-componente sulla BoM attiva alla data (tutti i componenti, no filtro esposto).
                  -- Chiave overrides: componente_id::text (uuid articolo figlio).
                  FOR v_comp IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             a.uom_id       AS componente_uom_id,
                             a.iva_id       AS componente_iva_id
                        FROM catalogo.fn_distinta_alla_data(v_articolo_id, p_data_riferimento) ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                  LOOP
                      IF p_componenti_overrides IS NOT NULL
                         AND p_componenti_overrides ? v_comp.componente_id::text
                      THEN
                          -- L'override: un prezzo (MANUALE) o un prezzo con la sua provenienza, quando
                          -- lo passa chi copia i componenti da un documento a monte.
                          SELECT o.prezzo, o.origine_prezzo, o.listino_versione_id, o.listino_riga_id, o.prezzo_resolver_context
                            INTO v_prezzo, v_origine, v_ov_versione, v_ov_riga, v_ov_contesto
                            FROM vendite.fn_componente_override(p_componenti_overrides -> v_comp.componente_id::text) o;
                          -- Guard prezzo=0 solo per componenti obbligatori
                          IF v_prezzo = 0 AND v_comp.obbligatorio THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_offerta_eccezione_componenti_init',
                                  -- rev 2026-08-07: era E_PARAMETRO_INVALIDO. Non e' un parametro
                                  --   malformato: e' una regola di dominio, e il codice giusto
                                  --   esisteva gia'. Il suo messaggio dice «Componente obbligatorio
                                  --   [%s]», quindi il valore variadico e' il COMPONENTE, non il
                                  --   documento. Brief terzo lato §19.4.
                                  'E_DOC_COMPONENTE_OBBLIGATORIO_PREZZO_ZERO',
                                  jsonb_build_object('componente_id', v_comp.componente_id,
                                      'eccezione_id', p_eccezione_id,
                                      'hint', 'prezzo override deve essere diverso da zero'),
                                  NULL::uuid, v_comp.componente_id::text);
                          END IF;
                          INSERT INTO vendite.offerte_commerciali_eccezioni_componenti (
                              eccezione_offerta_id,
                              articolo_componente_id,
                              componente_id,
                              coeff_qta_snapshot,
                              quantita,
                              uom_operativa_id,
                              factor_to_base,
                              prezzo_unitario,
                              iva_id,
                              origine_prezzo,
                              attivo,
                              listino_versione_id,
                              listino_riga_id,
                              prezzo_resolver_context
                          ) VALUES (
                              p_eccezione_id,
                              v_comp.bom_entry_id,
                              v_comp.componente_id,
                              v_comp.coeff_qta,
                              v_comp.coeff_qta * v_qta_padre,
                              v_comp.componente_uom_id,
                              1,
                              v_prezzo,
                              v_comp.componente_iva_id,
                              v_origine,
                              TRUE,
                              v_ov_versione, v_ov_riga,
                              jsonb_build_object(
                                  'override',           true,
                                  'emittente_sr_id',    p_emittente_sr_id,
                                  'data_riferimento',   p_data_riferimento,
                                  'ba_id',              v_ba_id,
                                  'utility_id',         v_utility_id,
                                  'istanza_utility_id', v_istanza_id
                              ) || COALESCE(v_ov_contesto, '{}'::jsonb)
                          );
                      ELSE
                          BEGIN
                              SELECT * INTO v_resolve
                                FROM vendite.fn_resolve_prezzo_listino_v2(
                                    v_comp.componente_id,
                                    v_comp.componente_uom_id,
                                    p_data_riferimento,
                                    v_ba_id,
                                    v_utility_id::integer,
                                    p_emittente_sr_id,
                                    NULL,
                                    v_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                                );
                              INSERT INTO vendite.offerte_commerciali_eccezioni_componenti (
                                  eccezione_offerta_id,
                                  articolo_componente_id,
                                  componente_id,
                                  coeff_qta_snapshot,
                                  quantita,
                                  uom_operativa_id,
                                  factor_to_base,
                                  prezzo_unitario,
                                  iva_id,
                                  origine_prezzo,
                                  attivo,
                                  listino_versione_id,
                                  listino_riga_id,
                                  prezzo_resolver_context
                              ) VALUES (
                                  p_eccezione_id,
                                  v_comp.bom_entry_id,
                                  v_comp.componente_id,
                                  v_comp.coeff_qta,
                                  v_comp.coeff_qta * v_qta_padre,
                                  v_comp.componente_uom_id,
                                  1,
                                  v_resolve.prezzo_finale,
                                  v_comp.componente_iva_id,
                                  v_resolve.origine,
                                  TRUE,
                                  v_resolve.listino_versione_id, v_resolve.listino_riga_id,
                                  jsonb_build_object(
                                      'emittente_sr_id',     p_emittente_sr_id,
                                      'data_riferimento',    p_data_riferimento,
                                      'ba_id',               v_ba_id,
                                      'utility_id',          v_utility_id,
                                      'istanza_utility_id',  v_istanza_id
                                  ) || vendite.fn_prezzo_resolver_contesto(to_jsonb(v_resolve))
                              );
                          EXCEPTION WHEN SQLSTATE 'P0001' THEN
                              -- Fallback permissivo (offerta vs contratto strict):
                              -- componente senza listino inserito a prezzo=0/MANUALE.
                              -- Il trigger trgfn_componenti_check_prezzo_obbligatorio
                              -- bloccherà l'INSERT se obbligatorio=TRUE.
                              INSERT INTO vendite.offerte_commerciali_eccezioni_componenti (
                                  eccezione_offerta_id,
                                  articolo_componente_id,
                                  componente_id,
                                  coeff_qta_snapshot,
                                  quantita,
                                  uom_operativa_id,
                                  factor_to_base,
                                  prezzo_unitario,
                                  iva_id,
                                  origine_prezzo,
                                  attivo,
                                  listino_versione_id,
                                  listino_riga_id,
                                  prezzo_resolver_context
                              ) VALUES (
                                  p_eccezione_id,
                                  v_comp.bom_entry_id,
                                  v_comp.componente_id,
                                  v_comp.coeff_qta,
                                  v_comp.coeff_qta * v_qta_padre,
                                  v_comp.componente_uom_id,
                                  1,
                                  0,
                                  v_comp.componente_iva_id,
                                  'MANUALE',
                                  TRUE,
                                  NULL::bigint, NULL::bigint,
                                  jsonb_build_object(
                                      'error',              'resolver_not_found',
                                      'emittente_sr_id',    p_emittente_sr_id,
                                      'data_riferimento',   p_data_riferimento,
                                      'ba_id',              v_ba_id,
                                      'utility_id',         v_utility_id,
                                      'istanza_utility_id', v_istanza_id
                                  )
                              );
                          END;
                      END IF;
                      v_inserted := v_inserted + 1;
                  END LOOP;

                  -- Check BOM vuota: articolo composito senza componenti attivi alla data
                  -- (raggiunto solo se v_qta_padre IS NOT NULL, cioe' eccezione non a consumo)
                  IF v_inserted = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_offerta_eccezione_componenti_init',
                          'E_DOC_COMPOSITO_BOM_VUOTA',
                          jsonb_build_object('articolo_id', v_articolo_id,
                              'data_riferimento', p_data_riferimento),
                          NULL::uuid,
                          v_codice_articolo,
                          p_data_riferimento::text
                      );
                  END IF;

                  RETURN v_inserted;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
