# N1b + N5 — LA CATENA IMPARA DUE COSE, IN UN SOLO PASSAGGIO
#   brief-design-note-credito-resi.md §15 (N1b, N5)
#
#   commesse_attivita  ->  attivita_fatturabili
#     fn_upsert_commessa_attivita        fn_emit_attivita_fatturabili_da_commessa
#
#   Cosa imparano: `natura_doc_id` (D-NC-3) e `fattura_riga_rettificata_id`
#   (D-NC-9). E' la stessa coreografia gia' fatta per `tipo_movimento`
#   (20260717-01..04) e per `causale_onere_id` (20260721-04/-06).
#
# ── ⚠️ PERCHE' `DROP` + `CREATE` E NON `CREATE OR REPLACE` ──────────────
#
#   `fn_upsert_commessa_attivita` ha 38 parametri, di cui 19 con DEFAULT.
#   Aggiungerne uno con `CREATE OR REPLACE` **non sostituisce la funzione**:
#   PostgreSQL identifica una funzione dalla sua firma, quindi ne nascerebbe
#   una SECONDA — un overload — e con i DEFAULT su entrambe ogni chiamata
#   esistente diventerebbe ambigua (`function is not unique`). Il DROP e'
#   obbligatorio, ed e' il motivo per cui i due parametri entrano INSIEME:
#   farlo due volte costerebbe due DROP di una funzione che sta sul percorso
#   di ogni push.
#
#   ⛔ E il DROP e' **senza CASCADE**, mai con. I quattro chiamanti DB
#   (`fn_aggiungi_onere_commessa`, `fn_batch_upsert_commessa_attivita`, e i due
#   che la nominano solo nei commenti) la risolvono per nome a runtime: non c'e'
#   dipendenza strutturale da propagare, e un CASCADE porterebbe via oggetti
#   che nessuno voleva toccare.
#
#   ✅ Censimento dei chiamanti, fatto prima di scrivere: tutti — i quattro DB,
#   `commesse_repository.upsert_attivita` e i sei smoke-test Python — usano
#   **argomenti nominali**. Due parametri nuovi in coda con DEFAULT NULL sono
#   quindi trasparenti: nessun chiamante va toccato.
#
# ── ⭐ `p_natura_doc_id` DEFAULT NULL, non DEFAULT «FATTURA» ────────────
#
#   Il default vero e' FATTURA, ma si risolve DENTRO la funzione con un
#   COALESCE sulla chiave naturale. Il motivo e' lo stesso del DEFAULT di
#   colonna (-25): un id cablato nella firma sarebbe una fotografia del
#   catalogo di oggi. Cosi' invece la firma resta stabile anche se il catalogo
#   viene ricostruito.
#
# ── ⚠️ IL RE-PUSH NON DECLASSA, e va detto ──────────────────────────────
#
#   Nell'`ON CONFLICT` la natura segue il chiamante (`EXCLUDED`), come gia' fa
#   `tipo_movimento`. Non serve il COALESCE difensivo che protegge
#   `tipo_doc_fiscale_id`, perche' i segment_key non si incrociano: un push
#   (`ORD:`/`DDT:`) non puo' atterrare sul segmento di una rettifica
#   (`...#RET:<n>`), quindi non esiste il percorso in cui un giro di push
#   riporterebbe una nota di credito a FATTURA. La riga a monte — «una riga gia'
#   EMESSA non si tocca» — resta la prima difesa.
#
# ── I DUE GUARD NUOVI ───────────────────────────────────────────────────
#
#   1. natura non risolta -> `E_CONFIG_MANCANTE`. Non e' teorico: succede se
#      qualcuno passa un codice che non c'e', o se il catalogo e' stato
#      disattivato. Meglio un errore parlante qui che un `not-null violation`
#      tre livelli piu' in basso;
#   2. `fattura_riga_rettificata_id` valorizzata **solo** su una RETTIFICA.
#      Il CHECK di tabella (-27) e' la rete finale; qui il messaggio dice quale
#      parametro e' incoerente, sullo stesso modello del guard gia' presente
#      per `causale_onere_id`.
#
#   ⚠️ Nessun guard sul SEGNO della quantita': una rettifica di accredito e'
#   negativa (D-NC-2), ma una futura nota di DEBITO sarebbe positiva. Vietare
#   qui il positivo chiuderebbe una porta che il vocabolario apre.
#
# Base: corpo delle due funzioni dalle definizioni VIVE
#   (docs/it/dbzero/vendite/funzioni/fn_upsert_commessa_attivita.md e
#    fn_emit_attivita_fatturabili_da_commessa.md), con sopra queste modifiche.
# Dipendenze: -26 (natura_doc_id), -27 (fattura_riga_rettificata_id),
#   config.fn_get_natura_doc_fiscale_id (-25).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-29-update-catena-attivita-natura-e-rettificata-mctit.yaml

  - changeSet:
      id: 20260818-29-update-catena-attivita-natura-e-rettificata
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        N1b+N5: fn_upsert_commessa_attivita (DROP + CREATE, +2 parametri in coda
        con DEFAULT NULL - l'aggiunta con CREATE OR REPLACE creerebbe un
        overload ambiguo) e fn_emit_attivita_fatturabili_da_commessa imparano
        natura_doc_id e fattura_riga_rettificata_id. Tutti i chiamanti usano
        argomenti nominali: nessuno va toccato.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: commesse_attivita
                columnName: natura_doc_id
            - columnExists:
                schemaName: vendite
                tableName: commesse_attivita
                columnName: fattura_riga_rettificata_id
            - columnExists:
                schemaName: vendite
                tableName: attivita_fatturabili
                columnName: fattura_riga_rettificata_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- 1) fn_upsert_commessa_attivita: DROP + CREATE.
              --    ⛔ MAI con CASCADE (vedi nota in testa).
              -- =========================================================
              DROP FUNCTION IF EXISTS vendite.fn_upsert_commessa_attivita(
                  bigint, character varying, uuid, bigint, date, bigint, numeric, date,
                  date, date, numeric, numeric, character varying, character varying,
                  numeric, bigint, bigint, smallint, integer, numeric, bigint, numeric,
                  date, bigint, integer, bigint, bigint, boolean, character varying,
                  boolean, character varying, character varying, bigint, text,
                  character varying, character varying, jsonb, bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_upsert_commessa_attivita(
                  -- ⚠️ Tipi ANCORATI con %TYPE (linee-guida-sql §5b): parametri,
                  --    RETURNS TABLE, DECLARE e COMMENT. Un tipo scritto a mano
                  --    smette di seguire la colonna il giorno in cui la colonna
                  --    cambia, e il disallineamento non solleva nulla: fa un cast
                  --    implicito. ⚠️ Il %TYPE in FIRMA e' pero' una FOTOGRAFIA:
                  --    si risolve al CREATE e non si riaggancia da solo — chi
                  --    cambia una di queste colonne deve ricreare la funzione.
                  --    ⚠️ I typmod non sopravvivono nella firma (PostgreSQL li
                  --    scarta sugli argomenti): numeric(18,6)%TYPE diventa
                  --    `numeric`, ed e' il motivo per cui il DROP qui sopra
                  --    nomina i tipi RISOLTI.
                  p_commessa_id                   vendite.commesse_attivita.commessa_id%TYPE,
                  p_segment_key                   vendite.commesse_attivita.segment_key%TYPE,
                  p_articolo_id                   vendite.commesse_attivita.articolo_id%TYPE,
                  p_istanza_utility_id            vendite.commesse_attivita.istanza_utility_id%TYPE,
                  p_data_attivita                 vendite.commesse_attivita.data_attivita%TYPE,
                  p_uom_id                        vendite.commesse_attivita.uom_id%TYPE,
                  p_quantita                      vendite.commesse_attivita.quantita%TYPE,
                  p_competenza_mese               vendite.commesse_attivita.competenza_mese%TYPE,
                  p_competenza_dal                vendite.commesse_attivita.competenza_dal%TYPE,
                  p_competenza_al                 vendite.commesse_attivita.competenza_al%TYPE,
                  p_prezzo_snapshot               vendite.commesse_attivita.prezzo_snapshot%TYPE,
                  p_prezzo_base_snapshot          vendite.commesse_attivita.prezzo_base_snapshot%TYPE,
                  p_origine_prezzo                vendite.commesse_attivita.origine_prezzo%TYPE,
                  p_tipo_variazione_applicata     vendite.commesse_attivita.tipo_variazione_applicata%TYPE,
                  p_valore_variazione_applicata   vendite.commesse_attivita.valore_variazione_applicata%TYPE,
                  p_promo_id                      vendite.commesse_attivita.promo_id%TYPE,
                  p_contratto_id                  vendite.commesse_attivita.contratto_id%TYPE,
                  p_categoria_cliente_id_snapshot vendite.commesse_attivita.categoria_cliente_id_snapshot%TYPE,
                  p_classe_utenza_id_snapshot     vendite.commesse_attivita.classe_utenza_id_snapshot%TYPE,
                  p_qta_operativa                 vendite.commesse_attivita.qta_operativa%TYPE               DEFAULT NULL,
                  p_uom_operativa_id              vendite.commesse_attivita.uom_operativa_id%TYPE            DEFAULT NULL,
                  p_factor_to_base                vendite.commesse_attivita.factor_to_base%TYPE              DEFAULT 1,
                  p_posticipa_al                  vendite.commesse_attivita.posticipa_al%TYPE                DEFAULT NULL,
                  p_tipo_doc_fiscale_id           vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE         DEFAULT NULL,
                  p_valuta_id                     vendite.commesse_attivita.valuta_id%TYPE                   DEFAULT NULL,
                  p_area_geografica_id            vendite.commesse_attivita.area_geografica_id%TYPE          DEFAULT NULL,
                  p_listino_versione_id           vendite.commesse_attivita.listino_versione_id%TYPE         DEFAULT NULL,
                  p_prezzo_bloccato               vendite.commesse_attivita.prezzo_bloccato%TYPE             DEFAULT false,
                  p_pricing_mode                  vendite.commesse_attivita.pricing_mode%TYPE                DEFAULT 'FIXED',
                  p_prezzo_da_riallineare         vendite.commesse_attivita.prezzo_da_riallineare%TYPE       DEFAULT false,
                  p_stato_approvazione            vendite.commesse_attivita.stato_approvazione%TYPE          DEFAULT 'BOZZA',
                  p_stato_emissione               vendite.commesse_attivita.stato_emissione%TYPE             DEFAULT 'NON_EMESSA',
                  p_sorgente_tipo_id              vendite.commesse_attivita.sorgente_tipo_id%TYPE            DEFAULT NULL,
                  p_sorgente_uid                  vendite.commesse_attivita.sorgente_uid%TYPE                DEFAULT NULL,
                  p_tipo_movimento                vendite.commesse_attivita.tipo_movimento%TYPE              DEFAULT 'NORMALE',
                  -- ⚠️ tipo_consumo NON ha una colonna: vive in `meta`. Qui il
                  --    tipo resta esplicito perche' non c'e' niente da ancorare,
                  --    e va detto invece di lasciarlo sembrare una svista.
                  p_tipo_consumo                  character varying                                          DEFAULT 'CONGUAGLIO',
                  p_meta                          vendite.commesse_attivita.meta%TYPE                        DEFAULT '{}'::jsonb,
                  p_causale_onere_id              vendite.commesse_attivita.causale_onere_id%TYPE            DEFAULT NULL,
                  p_natura_doc_id                 vendite.commesse_attivita.natura_doc_id%TYPE               DEFAULT NULL,
                  p_fattura_riga_rettificata_id   vendite.commesse_attivita.fattura_riga_rettificata_id%TYPE DEFAULT NULL
              )
               RETURNS TABLE(attivita_id vendite.commesse_attivita.id%TYPE, is_new boolean)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_attivita_id              vendite.commesse_attivita.id%TYPE;
                v_is_new                   boolean;
                v_existing_stato_emissione vendite.commesse_attivita.stato_emissione%TYPE;
                v_modificabile             vendite.stati_commessa.modificabile%TYPE;
                v_competenza_mese          vendite.commesse_attivita.competenza_mese%TYPE;
                v_tipo_doc_fiscale_id      vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE;
                v_tipo_movimento           vendite.commesse_attivita.tipo_movimento%TYPE;
                v_natura_doc_id            vendite.commesse_attivita.natura_doc_id%TYPE;
                v_tipo_consumo             varchar(32);
                v_meta_effective           jsonb;
              BEGIN
                -- =========================================================
                -- Upsert idempotente su (commessa_id, segment_key) con
                -- snapshot pricing v5 obbligatorio.
                -- Return: (attivita_id, is_new) tramite xmax=0.
                -- rev 2026-08-18 (brief nota di credito, N1b+N5): la riga
                -- porta anche la NATURA del documento che produrra'
                -- (FATTURA / NOTA_CREDITO / ...) e, per una rettifica, la
                -- riga di fattura che sta correggendo.
                -- =========================================================

                -- Validazione parametri obbligatori "core".
                -- E_PARAMETRO_INVALIDO ha 1 %s (descrizione del parametro);
                -- il jsonb context conserva il dettaglio strutturato.
                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','commessa_id','valore',p_commessa_id),
                    NULL::uuid, 'commessa_id obbligatorio (>0)'
                  );
                END IF;

                IF p_segment_key IS NULL OR btrim(p_segment_key) = '' OR length(btrim(p_segment_key)) > 128 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','segment_key','valore',p_segment_key),
                    NULL::uuid, 'segment_key non valida (vuota o > 128 char)'
                  );
                END IF;

                IF p_uom_id IS NULL OR p_uom_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','uom_id','valore',p_uom_id),
                    NULL::uuid, 'uom_id obbligatorio (>0)'
                  );
                END IF;

                IF p_istanza_utility_id IS NULL OR p_istanza_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','istanza_utility_id','valore',p_istanza_utility_id),
                    NULL::uuid, 'istanza_utility_id obbligatoria (>0)'
                  );
                END IF;

                -- ⚠️ La quantita' puo' essere NEGATIVA (rettifica di accredito,
                --    D-NC-2): il predicato e' « = 0 », non « <= 0 ». Non e' una
                --    svista storica da correggere — e' la porta da cui la nota
                --    di credito entra senza una seconda pipeline.
                IF p_quantita IS NULL OR p_quantita = 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','quantita','valore',p_quantita),
                    NULL::uuid, 'quantita obbligatoria e diversa da 0'
                  );
                END IF;

                IF p_prezzo_snapshot IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','prezzo_snapshot'),
                    NULL::uuid, 'prezzo_snapshot obbligatorio'
                  );
                END IF;

                -- Validazione dominio enum snapshot pricing v5: i CHECK DB
                -- (chk_commesse_attivita_origine_prezzo,
                --  chk_commesse_attivita_tipo_variazione_applicata) li
                -- garantirebbero comunque, ma qui la fail-fast e' piu'
                -- chiara come messaggio.
                IF p_origine_prezzo IS NOT NULL
                   AND p_origine_prezzo NOT IN ('PROMO','CONTRATTO_OVERRIDE','CONTRATTO_LISTINO','CATEGORIA','MANUALE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','origine_prezzo','valore',p_origine_prezzo),
                    NULL::uuid, concat('origine_prezzo non valida: ', p_origine_prezzo)
                  );
                END IF;

                IF p_tipo_variazione_applicata IS NOT NULL
                   AND p_tipo_variazione_applicata NOT IN ('PERCENTUALE','VALORE_FISSO','PREZZO_FISSO','NESSUNA') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','tipo_variazione_applicata','valore',p_tipo_variazione_applicata),
                    NULL::uuid, concat('tipo_variazione_applicata non valido: ', p_tipo_variazione_applicata)
                  );
                END IF;

                -- Normalizzazione tipo_movimento (COLONNA dal 2026-07-17) e
                -- tipo_consumo (resta in meta).
                -- Dominio tipo_movimento: NORMALE (push, specchio dell'origine) |
                -- ONERE (porta voce manuale, qta=1) | RETTIFICA (accrediti e
                -- conguagli). Il CHECK chk_commesse_attivita_tipo_movimento e'
                -- la difesa finale.
                v_tipo_movimento := upper(COALESCE(NULLIF(btrim(p_tipo_movimento), ''), 'NORMALE'));
                IF v_tipo_movimento NOT IN ('NORMALE', 'RETTIFICA', 'ONERE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','tipo_movimento','valore',v_tipo_movimento),
                    NULL::uuid, concat('tipo_movimento non valido: ', v_tipo_movimento)
                  );
                END IF;

                -- Coerenza causale <-> registro (difesa fail-fast; il CHECK
                -- chk_commesse_attivita_causale_onere e' la rete finale sul DB).
                -- La causale appartiene SOLO alle righe ONERE (porta oneri): una
                -- riga ONERE deve averla, una NORMALE/RETTIFICA non puo'.
                IF (v_tipo_movimento = 'ONERE') <> (p_causale_onere_id IS NOT NULL) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','causale_onere_id','valore',p_causale_onere_id,'tipo_movimento',v_tipo_movimento),
                    NULL::uuid, 'causale_onere_id ammessa se e solo se tipo_movimento=ONERE'
                  );
                END IF;

                -- NATURA del documento (rev 2026-08-18, D-NC-3). Default
                -- risolto QUI e non nella firma: un id cablato fra i DEFAULT
                -- sarebbe una fotografia del catalogo di oggi, e resterebbe
                -- valido — cioe' sbagliato in silenzio — dopo un reseed.
                v_natura_doc_id := COALESCE(
                    p_natura_doc_id,
                    config.fn_get_natura_doc_fiscale_id('FATTURA'));

                IF v_natura_doc_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_CONFIG_MANCANTE',
                    jsonb_build_object('parametro','natura_doc_id','valore',p_natura_doc_id),
                    NULL::uuid, 'natura documento non risolta (config.nature_doc_fiscale)'
                  );
                END IF;

                -- Coerenza rettifica <-> riga rettificata (rev 2026-08-18,
                -- D-NC-9). IMPLICAZIONE, non equivalenza: chi porta la riga
                -- rettificata E' una rettifica, ma una rettifica puo' non
                -- nascere da una riga di fattura (conguagli). Il CHECK
                -- chk_commesse_attivita_rettificata_e_rettifica e' la rete
                -- finale; qui il messaggio dice QUALE parametro e' incoerente.
                IF p_fattura_riga_rettificata_id IS NOT NULL
                   AND v_tipo_movimento <> 'RETTIFICA' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','fattura_riga_rettificata_id',
                                       'valore',p_fattura_riga_rettificata_id,
                                       'tipo_movimento',v_tipo_movimento),
                    NULL::uuid, 'fattura_riga_rettificata_id ammessa solo con tipo_movimento=RETTIFICA'
                  );
                END IF;

                v_tipo_consumo := upper(COALESCE(NULLIF(btrim(p_tipo_consumo), ''), 'CONGUAGLIO'));
                IF v_tipo_consumo NOT IN ('ACCONTO', 'CONGUAGLIO', 'STORNO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','tipo_consumo','valore',v_tipo_consumo),
                    NULL::uuid, concat('tipo_consumo non valido: ', v_tipo_consumo)
                  );
                END IF;

                v_competenza_mese := date_trunc('month', p_competenza_mese)::date;
                -- tipo_movimento NON entra piu' in meta: vive sulla colonna
                -- (una casa sola). tipo_consumo resta qui.
                v_meta_effective  := COALESCE(p_meta, '{}'::jsonb) || jsonb_build_object(
                  'tipo_consumo', v_tipo_consumo
                );

                -- Normalize tipo_doc_fiscale_id (NO derivazione di business).
                -- Se non passato esplicitamente, applica il default OPZIONALE
                -- configurato sulla sorgente (config.sorgenti.tipo_doc_fiscale_id).
                -- Single source of truth lato DB. Se la sorgente non ha default,
                -- resta NULL: l'obbligo di valorizzazione sullo stato emittibile
                -- (APPROVATA+NON_EMESSA) e' imposto dal guard
                -- trg_commesse_attivita_a10_guard_tipo_doc_emittibile, non qui.
                v_tipo_doc_fiscale_id := p_tipo_doc_fiscale_id;
                IF v_tipo_doc_fiscale_id IS NULL AND p_sorgente_tipo_id IS NOT NULL THEN
                  SELECT s.tipo_doc_fiscale_id
                    INTO v_tipo_doc_fiscale_id
                    FROM config.sorgenti s
                   WHERE s.id = p_sorgente_tipo_id;
                END IF;

                -- Guard: commessa esistente e in stato modificabile.
                SELECT sc.modificabile
                INTO v_modificabile
                FROM vendite.commesse c
                JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id
                WHERE c.id = p_commessa_id;

                IF NOT FOUND THEN
                  -- E_COMMESSA_NON_TROVATA: 1 %s = commessa_id.
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_COMMESSA_NON_TROVATA',
                    jsonb_build_object('commessa_id',p_commessa_id),
                    NULL::uuid, p_commessa_id::text
                  );
                END IF;

                IF NOT v_modificabile THEN
                  -- E_COMMESSA_NON_MODIFICABILE: 1 %s = commessa_id.
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_COMMESSA_NON_MODIFICABILE',
                    jsonb_build_object('commessa_id',p_commessa_id),
                    NULL::uuid, p_commessa_id::text
                  );
                END IF;

                -- Guard: riga esistente non gia' emessa.
                SELECT ca.stato_emissione INTO v_existing_stato_emissione
                FROM vendite.commesse_attivita ca
                WHERE ca.commessa_id = p_commessa_id
                  AND ca.segment_key = btrim(p_segment_key)
                FOR UPDATE;

                IF v_existing_stato_emissione IS NOT NULL
                   AND v_existing_stato_emissione <> 'NON_EMESSA' THEN
                  -- E_COMMESSA_ATTIVITA_GIA_EMESSA: 3 %s = commessa, segment, stato.
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_upsert_commessa_attivita','E_COMMESSA_ATTIVITA_GIA_EMESSA',
                    jsonb_build_object(
                      'commessa_id', p_commessa_id,
                      'segment_key', p_segment_key,
                      'stato_emissione', v_existing_stato_emissione
                    ),
                    NULL::uuid,
                    p_commessa_id::text,
                    p_segment_key::text,
                    v_existing_stato_emissione::text
                  );
                END IF;

                -- Upsert idempotente su (commessa_id, segment_key).
                INSERT INTO vendite.commesse_attivita (
                  commessa_id, segment_key, articolo_id, istanza_utility_id, data_attivita,
                  uom_id, quantita, qta_operativa, uom_operativa_id, factor_to_base,
                  competenza_mese, competenza_dal, competenza_al, posticipa_al,
                  tipo_doc_fiscale_id, valuta_id, area_geografica_id, listino_versione_id,
                  prezzo_snapshot, prezzo_bloccato, pricing_mode, prezzo_da_riallineare,
                  stato_approvazione, stato_emissione, sorgente_tipo_id, sorgente_uid,
                  tipo_movimento, causale_onere_id, meta,
                  -- Natura del documento e riga di fattura rettificata (2026-08-18)
                  natura_doc_id, fattura_riga_rettificata_id,
                  -- Snapshot pricing v5
                  prezzo_base_snapshot, origine_prezzo,
                  tipo_variazione_applicata, valore_variazione_applicata,
                  promo_id, contratto_id,
                  categoria_cliente_id_snapshot, classe_utenza_id_snapshot
                )
                VALUES (
                  p_commessa_id, btrim(p_segment_key), p_articolo_id, p_istanza_utility_id, p_data_attivita,
                  p_uom_id, p_quantita, p_qta_operativa, p_uom_operativa_id, COALESCE(p_factor_to_base, 1::numeric),
                  v_competenza_mese, p_competenza_dal, p_competenza_al, p_posticipa_al,
                  v_tipo_doc_fiscale_id, p_valuta_id, p_area_geografica_id, p_listino_versione_id,
                  p_prezzo_snapshot, COALESCE(p_prezzo_bloccato, false), COALESCE(p_pricing_mode, 'FIXED'::varchar), COALESCE(p_prezzo_da_riallineare, false),
                  COALESCE(p_stato_approvazione, 'BOZZA'::varchar), COALESCE(p_stato_emissione, 'NON_EMESSA'::varchar), p_sorgente_tipo_id, NULLIF(btrim(p_sorgente_uid), ''),
                  v_tipo_movimento, p_causale_onere_id, v_meta_effective,
                  v_natura_doc_id, p_fattura_riga_rettificata_id,
                  p_prezzo_base_snapshot, p_origine_prezzo,
                  p_tipo_variazione_applicata, p_valore_variazione_applicata,
                  p_promo_id, p_contratto_id,
                  p_categoria_cliente_id_snapshot, p_classe_utenza_id_snapshot
                )
                ON CONFLICT (commessa_id, segment_key) DO UPDATE
                SET articolo_id                    = EXCLUDED.articolo_id,
                    istanza_utility_id             = EXCLUDED.istanza_utility_id,
                    data_attivita                  = EXCLUDED.data_attivita,
                    uom_id                         = EXCLUDED.uom_id,
                    quantita                       = EXCLUDED.quantita,
                    qta_operativa                  = EXCLUDED.qta_operativa,
                    uom_operativa_id               = EXCLUDED.uom_operativa_id,
                    factor_to_base                 = EXCLUDED.factor_to_base,
                    competenza_mese                = EXCLUDED.competenza_mese,
                    competenza_dal                 = EXCLUDED.competenza_dal,
                    competenza_al                  = EXCLUDED.competenza_al,
                    posticipa_al                   = EXCLUDED.posticipa_al,
                    -- No-regressione: un re-push con tipo_doc in arrivo NULL non
                    -- azzera un valore gia' risolto (brief-db-guard-tipo-doc-attivita).
                    tipo_doc_fiscale_id            = COALESCE(EXCLUDED.tipo_doc_fiscale_id, vendite.commesse_attivita.tipo_doc_fiscale_id),
                    valuta_id                      = EXCLUDED.valuta_id,
                    area_geografica_id             = EXCLUDED.area_geografica_id,
                    listino_versione_id            = EXCLUDED.listino_versione_id,
                    prezzo_snapshot                = EXCLUDED.prezzo_snapshot,
                    prezzo_bloccato                = EXCLUDED.prezzo_bloccato,
                    pricing_mode                   = EXCLUDED.pricing_mode,
                    prezzo_da_riallineare          = EXCLUDED.prezzo_da_riallineare,
                    stato_approvazione             = EXCLUDED.stato_approvazione,
                    stato_emissione                = EXCLUDED.stato_emissione,
                    sorgente_tipo_id               = EXCLUDED.sorgente_tipo_id,
                    sorgente_uid                   = EXCLUDED.sorgente_uid,
                    -- Il registro della riga lo dichiara il chiamante (mai NULL:
                    -- normalizzato a NORMALE). I segment_key non si incrociano fra
                    -- push (ORD:/DDT:) e porta manuale (MAN:), quindi un push
                    -- non puo' declassare una riga ONERE.
                    tipo_movimento                 = EXCLUDED.tipo_movimento,
                    -- La causale segue il registro (coerente col CHECK
                    -- biconditional): NULL per NORMALE, valorizzata per ONERE.
                    causale_onere_id               = EXCLUDED.causale_onere_id,
                    -- Natura e riga rettificata seguono il chiamante, come
                    -- tipo_movimento: nessun COALESCE difensivo, perche' non
                    -- esiste un percorso in cui un push atterri sul segmento di
                    -- una rettifica (i suffissi #RET: non si incrociano con
                    -- ORD:/DDT:/MAN:).
                    natura_doc_id                  = EXCLUDED.natura_doc_id,
                    fattura_riga_rettificata_id    = EXCLUDED.fattura_riga_rettificata_id,
                    meta                           = COALESCE(vendite.commesse_attivita.meta, '{}'::jsonb) || COALESCE(EXCLUDED.meta, '{}'::jsonb),
                    -- Snapshot pricing v5: sovrascrive sempre (rappresenta
                    -- lo snapshot del calcolo corrente).
                    prezzo_base_snapshot           = EXCLUDED.prezzo_base_snapshot,
                    origine_prezzo                 = EXCLUDED.origine_prezzo,
                    tipo_variazione_applicata      = EXCLUDED.tipo_variazione_applicata,
                    valore_variazione_applicata    = EXCLUDED.valore_variazione_applicata,
                    promo_id                       = EXCLUDED.promo_id,
                    contratto_id                   = EXCLUDED.contratto_id,
                    categoria_cliente_id_snapshot  = EXCLUDED.categoria_cliente_id_snapshot,
                    classe_utenza_id_snapshot      = EXCLUDED.classe_utenza_id_snapshot
                RETURNING id, (xmax = 0) INTO v_attivita_id, v_is_new;

                RETURN QUERY SELECT v_attivita_id, v_is_new;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_upsert_commessa_attivita(
                  bigint, character varying, uuid, bigint, date, bigint, numeric, date,
                  date, date, numeric, numeric, character varying, character varying,
                  numeric, bigint, bigint, smallint, integer, numeric, bigint, numeric,
                  date, bigint, integer, bigint, bigint, boolean, character varying,
                  boolean, character varying, character varying, bigint, text,
                  character varying, character varying, jsonb, bigint, bigint, bigint)
              IS 'Upsert idempotente di una riga operativa di commessa su (commessa_id, segment_key), con snapshot pricing v5 obbligatorio. Ritorna (attivita_id, is_new). rev 2026-08-18 (brief-design-note-credito-resi N1b+N5): due parametri nuovi in coda — p_natura_doc_id (FATTURA / NOTA_CREDITO / ..., default risolto per chiave naturale e non cablato nella firma) e p_fattura_riga_rettificata_id (la riga di fattura che una RETTIFICA corregge). ⚠️ L''aggiunta ha richiesto DROP + CREATE e non CREATE OR REPLACE: con 38 parametri di cui 19 con DEFAULT, una firma nuova avrebbe creato un OVERLOAD e reso ambigua ogni chiamata esistente. Tutti i chiamanti (4 DB, commesse_repository.upsert_attivita, 6 smoke-test) usano argomenti nominali, quindi nessuno e'' stato toccato. ⚠️ p_quantita ammette valori NEGATIVI (il predicato e'' « = 0 », non « <= 0 »): e'' la porta da cui la nota di credito entra senza una seconda pipeline (D-NC-2).';

              -- =========================================================
              -- 2) fn_emit_attivita_fatturabili_da_commessa: propaga.
              --    Firma e RETURNS invariati -> CREATE OR REPLACE basta.
              -- =========================================================
              CREATE OR REPLACE FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(
                  p_commessa_id   vendite.commesse.id%TYPE,
                  p_only_approved boolean  DEFAULT true,
                  p_dry_run       boolean  DEFAULT false,
                  -- ⚠️ `text[]` esplicito: PostgreSQL non ammette
                  --    `colonna%TYPE[]`, e la chiave di gruppo non e'
                  --    comunque una colonna (la costruisce
                  --    fn_build_gruppo_fatturabile_key).
                  p_gruppi        text[]   DEFAULT NULL)
               RETURNS TABLE(total_candidate integer, inserted_rows integer, updated_rows integer, skipped_rows integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: emette righe da commesse_attivita verso attivita_fatturabili
              --        in modalita' idempotente (sorgente COMMESSA + segment_key).
              --        Propaga lo snapshot audit pricing v5 (8 colonne) 1:1 e il
              --        registro tipo_movimento (colonna dal 2026-07-17).
              -- Sottosistema lotto rimosso (deprecato 20260227-16).
              -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente COMMESSA
              --        risolta per codice_interno (immutabile), non per codice.
              -- rev 2026-07-17: propaga tipo_movimento (brief immutabilita §4c.2);
              --        e' il filtro con cui il contatore tenuti-fatturati tiene
              --        fuori dal libro mastro della merce le righe non-NORMALE.
              -- rev 2026-07-27 (brief emissione mirata A3): p_gruppi restringe
              --        l'emissione ai soli GRUPPI FATTURABILI richiesti. NULL =
              --        nessuna restrizione (comportamento storico). E' il primo
              --        dei due punti in cui il perimetro mirato va applicato:
              --        l'altro e' fn_select_attivita_fatturabili, che filtra le
              --        AF gia' esistenti (senza quello, le righe di un altro
              --        gruppo rimaste da un giro precedente verrebbero comunque
              --        rastrellate — garanzia G12).
              -- rev 2026-08-18 (brief nota di credito N1b+N5): propaga anche
              --        natura_doc_id e fattura_riga_rettificata_id. La natura
              --        deve arrivare fino alla TESTATA (e' li' che la FatturaPA
              --        chiedera' TD01 o TD04): se si fermasse qui, la chiave
              --        documento non avrebbe cosa separare.
              DECLARE
                  v_commessa              vendite.commesse%ROWTYPE;
                  v_root_id               vendite.commesse_sorgenti.id%TYPE;
                  v_commessa_source_id    config.sorgenti.id%TYPE;
                  v_existing_id           vendite.attivita_fatturabili.id%TYPE;
                  v_existing_fatturato    vendite.attivita_fatturabili.fatturato%TYPE;
                  v_sorgente_uid_uuid     vendite.attivita_fatturabili.sorgente_uid%TYPE;
                  v_row                   RECORD;
              BEGIN
                  total_candidate := 0;
                  inserted_rows := 0;
                  updated_rows := 0;
                  skipped_rows := 0;

                  -- Guard: parametri
                  IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_commessa_id', 'valore', p_commessa_id),
                          NULL::uuid, 'p_commessa_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Recupera commessa
                  SELECT c.* INTO v_commessa
                    FROM vendite.commesse c WHERE c.id = p_commessa_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id),
                          NULL::uuid, concat('commessa_id ', p_commessa_id)
                      );
                  END IF;

                  -- ROOT source obbligatoria
                  SELECT cs.id INTO v_root_id
                    FROM vendite.commesse_sorgenti cs
                   WHERE cs.commessa_id = p_commessa_id AND cs.ruolo_link = 'ROOT'
                   LIMIT 1;

                  IF v_root_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                          jsonb_build_object('commessa_id', p_commessa_id),
                          NULL::uuid, concat('ROOT source mancante per commessa ', p_commessa_id)
                      );
                  END IF;

                  -- Sorgente COMMESSA
                  SELECT s.id INTO v_commessa_source_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'COMMESSA' AND s.attivo IS TRUE
                   LIMIT 1;

                  IF v_commessa_source_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_CODICE',
                          jsonb_build_object('codice', 'COMMESSA'),
                          NULL::uuid, 'COMMESSA', 'config.sorgenti'
                      );
                  END IF;

                  -- Loop emissione righe
                  FOR v_row IN
                      SELECT ca.id, ca.segment_key, ca.articolo_id, ca.istanza_utility_id,
                             ca.data_attivita, ca.uom_id, ca.quantita, ca.qta_operativa,
                             ca.uom_operativa_id, ca.factor_to_base, ca.competenza_mese,
                             ca.competenza_dal, ca.competenza_al, ca.posticipa_al,
                             ca.tipo_doc_fiscale_id, ca.valuta_id, ca.area_geografica_id,
                             ca.prezzo_snapshot, ca.prezzo_bloccato, ca.stato_approvazione, ca.meta,
                             ca.tipo_movimento,
                             ca.natura_doc_id, ca.fattura_riga_rettificata_id,
                             ca.sorgente_tipo_id AS ca_sorgente_tipo_id,
                             -- Snapshot audit pricing v5 (propagati 1:1)
                             ca.prezzo_base_snapshot, ca.origine_prezzo,
                             ca.tipo_variazione_applicata, ca.valore_variazione_applicata,
                             ca.promo_id, ca.contratto_id,
                             ca.categoria_cliente_id_snapshot, ca.classe_utenza_id_snapshot
                        FROM vendite.commesse_attivita ca
                       WHERE ca.commessa_id = p_commessa_id
                         AND ca.stato_emissione = 'NON_EMESSA'
                         AND (p_only_approved IS FALSE OR ca.stato_approvazione = 'APPROVATA')
                         -- EMISSIONE MIRATA (rev 2026-07-27): NULL = nessuna
                         -- restrizione; array vuoto = richiesta vuota -> zero righe;
                         -- chiave inesistente -> zero righe, nessun errore (G6).
                         -- La chiave viene dalla funzione A1, mai ricostruita qui.
                         AND (
                              p_gruppi IS NULL
                              OR vendite.fn_build_gruppo_fatturabile_key(
                                     ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id
                                 ) = ANY (p_gruppi)
                             )
                       ORDER BY ca.id
                  LOOP
                      total_candidate := total_candidate + 1;

                      -- Hash segment_key -> UUID deterministico
                      v_sorgente_uid_uuid := (
                          substr(md5(v_row.segment_key), 1, 8) || '-' ||
                          substr(md5(v_row.segment_key), 9, 4) || '-' ||
                          substr(md5(v_row.segment_key), 13, 4) || '-' ||
                          substr(md5(v_row.segment_key), 17, 4) || '-' ||
                          substr(md5(v_row.segment_key), 21, 12)
                      )::uuid;

                      SELECT a.id, a.fatturato INTO v_existing_id, v_existing_fatturato
                        FROM vendite.attivita_fatturabili a
                       WHERE a.sorgente_tipo_id = v_commessa_source_id
                         AND a.sorgente_uid = v_sorgente_uid_uuid
                         FOR UPDATE;

                      IF p_dry_run THEN
                          IF v_existing_id IS NULL THEN inserted_rows := inserted_rows + 1;
                          ELSE updated_rows := updated_rows + 1; END IF;
                          CONTINUE;
                      END IF;

                      IF v_existing_id IS NULL THEN
                          INSERT INTO vendite.attivita_fatturabili (
                              articolo_id, billing_account_id, istanza_utility_id, data_attivita,
                              quantita, competenza_mese, approvato, fatturato, meta, sorgente_riga,
                              posticipa_al, sorgente_tipo_id, sorgente_uid, uom_id, qta_operativa,
                              uom_operativa_id, factor_to_base, valuta_id, prezzo_unitario,
                              tipo_doc_fiscale_id, competenza_dal, competenza_al,
                              area_geografica_id, stato_esecuzione, prezzo_bloccato,
                              commessa_id, commessa_attivita_id, sorgente_origine_tipo_id,
                              tipo_movimento,
                              natura_doc_id, fattura_riga_rettificata_id,
                              prezzo_base_snapshot, origine_prezzo, tipo_variazione_applicata,
                              valore_variazione_applicata, promo_id, contratto_id,
                              categoria_cliente_id_snapshot, classe_utenza_id_snapshot
                          )
                          VALUES (
                              v_row.articolo_id, v_commessa.billing_account_id, v_row.istanza_utility_id,
                              v_row.data_attivita, v_row.quantita, v_row.competenza_mese,
                              (v_row.stato_approvazione = 'APPROVATA'), false,
                              COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                                  'scope', 'COMMESSE', 'commessa_id', p_commessa_id,
                                  'commessa_attivita_id', v_row.id, 'segment_key', v_row.segment_key
                              ),
                              v_row.id, v_row.posticipa_al, v_commessa_source_id, v_sorgente_uid_uuid,
                              v_row.uom_id, v_row.qta_operativa, v_row.uom_operativa_id, v_row.factor_to_base,
                              v_row.valuta_id, v_row.prezzo_snapshot,
                              v_row.tipo_doc_fiscale_id, v_row.competenza_dal, v_row.competenza_al,
                              v_row.area_geografica_id, 'PENDING', v_row.prezzo_bloccato,
                              p_commessa_id, v_row.id, v_row.ca_sorgente_tipo_id,
                              v_row.tipo_movimento,
                              v_row.natura_doc_id, v_row.fattura_riga_rettificata_id,
                              v_row.prezzo_base_snapshot, v_row.origine_prezzo, v_row.tipo_variazione_applicata,
                              v_row.valore_variazione_applicata, v_row.promo_id, v_row.contratto_id,
                              v_row.categoria_cliente_id_snapshot, v_row.classe_utenza_id_snapshot
                          );
                          inserted_rows := inserted_rows + 1;
                      ELSE
                          -- Riga esistente: errore se gia' fatturata
                          IF COALESCE(v_existing_fatturato, false) IS TRUE THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_RIGA_GIA_FATTURATA',
                                  jsonb_build_object('attivita_fatturabili_id', v_existing_id, 'commessa_attivita_id', v_row.id),
                                  NULL::uuid, v_existing_id::text
                              );
                          END IF;

                          UPDATE vendite.attivita_fatturabili a
                             SET articolo_id = v_row.articolo_id,
                                 billing_account_id = v_commessa.billing_account_id,
                                 istanza_utility_id = v_row.istanza_utility_id,
                                 data_attivita = v_row.data_attivita,
                                 quantita = v_row.quantita,
                                 competenza_mese = v_row.competenza_mese,
                                 approvato = (v_row.stato_approvazione = 'APPROVATA'),
                                 meta = COALESCE(a.meta, '{}'::jsonb) || COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                                     'scope', 'COMMESSE', 'commessa_id', p_commessa_id,
                                     'commessa_attivita_id', v_row.id, 'segment_key', v_row.segment_key
                                 ),
                                 sorgente_riga = v_row.id,
                                 posticipa_al = v_row.posticipa_al,
                                 uom_id = v_row.uom_id,
                                 qta_operativa = v_row.qta_operativa,
                                 uom_operativa_id = v_row.uom_operativa_id,
                                 factor_to_base = v_row.factor_to_base,
                                 valuta_id = v_row.valuta_id,
                                 prezzo_unitario = v_row.prezzo_snapshot,
                                 tipo_doc_fiscale_id = v_row.tipo_doc_fiscale_id,
                                 competenza_dal = v_row.competenza_dal,
                                 competenza_al = v_row.competenza_al,
                                 area_geografica_id = v_row.area_geografica_id,
                                 prezzo_bloccato = v_row.prezzo_bloccato,
                                 commessa_id = p_commessa_id,
                                 commessa_attivita_id = v_row.id,
                                 sorgente_origine_tipo_id = v_row.ca_sorgente_tipo_id,
                                 -- Registro della riga: lo specchio segue la CA
                                 -- (la riga gia' fatturata e' respinta sopra).
                                 tipo_movimento = v_row.tipo_movimento,
                                 -- Natura e riga rettificata: stesso specchio.
                                 natura_doc_id = v_row.natura_doc_id,
                                 fattura_riga_rettificata_id = v_row.fattura_riga_rettificata_id,
                                 -- Refresh snapshot audit pricing v5 (riga non ancora fatturata)
                                 prezzo_base_snapshot = v_row.prezzo_base_snapshot,
                                 origine_prezzo = v_row.origine_prezzo,
                                 tipo_variazione_applicata = v_row.tipo_variazione_applicata,
                                 valore_variazione_applicata = v_row.valore_variazione_applicata,
                                 promo_id = v_row.promo_id,
                                 contratto_id = v_row.contratto_id,
                                 categoria_cliente_id_snapshot = v_row.categoria_cliente_id_snapshot,
                                 classe_utenza_id_snapshot = v_row.classe_utenza_id_snapshot
                           WHERE a.id = v_existing_id;
                          updated_rows := updated_rows + 1;
                      END IF;

                      UPDATE vendite.commesse_attivita ca SET stato_emissione = 'EMESSA' WHERE ca.id = v_row.id;
                  END LOOP;

                  RETURN NEXT;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(bigint, boolean, boolean, text[])
              IS 'Emette righe da vendite.commesse_attivita verso vendite.attivita_fatturabili, idempotente su (sorgente COMMESSA, hash del segment_key). Propaga 1:1 lo snapshot audit pricing v5, tipo_movimento (dal 2026-07-17) e, dal 2026-08-18, natura_doc_id e fattura_riga_rettificata_id (brief-design-note-credito-resi N1b+N5). ⭐ La natura deve arrivare fino alla TESTATA — e'' li'' che il builder XML della FatturaPA chiedera'' se sta trasmettendo un TD01 o un TD04 — quindi fermarla qui avrebbe lasciato la chiave documento senza nulla da separare, e fatture e note di credito sarebbero finite sulla stessa testata. rev 2026-08-18.';
      rollback:
        - sql:
            dbms: postgresql
