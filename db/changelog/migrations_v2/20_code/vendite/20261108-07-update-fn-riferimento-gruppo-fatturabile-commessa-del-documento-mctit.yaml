# IL RIFERIMENTO DI UN GRUPPO SENZA NUMERO E' IL CODICE DELLA COMMESSA
#   Brief: brief-db-sorgente-documento-e-riga §3.6, V-7 (Tid, 2026-11-07: vale il
#   codice della commessa, come la dashboard).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   La scala di ripiego del riferimento e' scritta due volte:
#   vendite.vw_dash_competenza_gruppi.riferimento e questa funzione. Per un
#   documento senza numero (un consumo: label_selector NULL) la vista ripiega sul
#   codice della commessa del gruppo, la funzione sulla chiave grezza: conosceva
#   la commessa solo dalla forma 'MAN:<commessa>'. La dashboard Competenza e la
#   scheda Critiche del lotto nominavano lo stesso gruppo in due modi.
#
# ── LA CURA ─────────────────────────────────────────────────────────
#   Per la forma documento la commessa e' quella APERTA in cui il documento sta:
#   vendite.fn_commessa_viva_di_sorgente, con l'id del documento (gia' risolto per
#   il numero) e l'uid della chiave, con la regola d'incontro. Si cerca solo
#   quando il numero manca. La firma non cambia; nessun DROP.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Il riferimento di un gruppo di consumi (e di ogni documento senza numero) e'
#   il codice della commessa invece della chiave grezza. Un documento che non sta
#   piu' in una commessa aperta (commessa chiusa o annullata) ripiega ancora sulla
#   chiave: la commessa viva e' la sola che il push riconosce per un documento.
#   Unico lettore: vendite.fn_list_lotto_segnalazioni (scheda Critiche).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261108-07-update-fn-riferimento-gruppo-fatturabile-commessa-del-documento-mctit.yaml

  - changeSet:
      id: 20261108-07-update-fn-riferimento-gruppo-fatturabile-commessa-del-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_riferimento_gruppo_fatturabile: per un documento senza numero il riferimento e' il
        codice della commessa aperta del documento, come in vw_dash_competenza_gruppi.
        brief-db-sorgente-documento-e-riga §3.6, V-7.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_riferimento_gruppo_fatturabile(
                  -- ⚠️ `text` esplicito: la chiave di gruppo non e' la colonna di
                  --    una tabella, la costruisce vendite.fn_build_gruppo_fatturabile_key
                  --    e la ospitano tre tabelle (perimetro, esiti, log).
                  p_gruppo_key text)
              -- `text` esplicito: il riferimento e' un numero di documento, un codice
              -- di commessa o la chiave stessa, secondo cio' che si trova.
              RETURNS text
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: il RIFERIMENTO leggibile di un gruppo fatturabile — cioe'
              --        cio' che una persona riconosce al posto della chiave.
              --        'ORDINE_VENDITA:01a06ce4-…' -> 'ORD0036004'.
              -- Ritorna: il numero del documento; se non c'e', il codice della
              --        commessa; se non c'e' nemmeno quello, la CHIAVE GREZZA.
              -- ⚠️ NON SOLLEVA MAI: la chiama una lista.
              DECLARE
                  v_key         text := NULLIF(btrim(COALESCE(p_gruppo_key, '')), '');
                  v_src         record;
                  v_documento   vendite.commesse_sorgenti.sorgente_id%TYPE;
                  v_numero      text;
                  v_commessa_id vendite.commesse.id%TYPE;
                  v_codice      vendite.commesse.codice%TYPE;
              BEGIN
                  -- ⚠️ NULL entra e NULL esce: sulla scheda Critiche una chiave
                  --    assente vuol dire «la segnalazione e' del GIRO», e li' non
                  --    c'e' nessun documento da nominare. Inventare un'etichetta
                  --    direbbe una cosa falsa.
                  IF v_key IS NULL THEN
                      RETURN NULL;
                  END IF;

                  SELECT * INTO v_src
                    FROM vendite.fn_split_gruppo_fatturabile_key(v_key);

                  -- Il documento e il suo numero, dalla sede unica della
                  -- risoluzione polimorfa. Non risolve niente da se': legge il
                  -- `label_selector` che la sorgente dichiara a catalogo.
                  SELECT d.documento_id, d.documento_numero
                    INTO v_documento, v_numero
                    FROM vendite.fn_get_sorgente_documento_ref(
                             v_src.sorgente_tipo_id, v_src.sorgente_uid) d;

                  -- Il contenitore, quando il numero manca.
                  -- * Forma sourceless ('MAN:<commessa_id>'): un documento non c'e'
                  --   per progetto, la commessa e' nella chiave.
                  -- * Forma documento senza numero (un consumo): la commessa
                  --   APERTA in cui il documento sta, la sola che il push
                  --   riconosce. Regola d'incontro: l'id del documento e l'uid
                  --   della chiave, la colonna che il key_selector non usa e' NULL
                  --   nel link. Il BB della chiave da' NULL, non solleva, su un
                  --   uid fuori forma.
                  IF v_src.commessa_id IS NOT NULL THEN
                      v_commessa_id := v_src.commessa_id;
                  ELSIF NULLIF(btrim(COALESCE(v_numero, '')), '') IS NULL
                        AND v_src.sorgente_tipo_id IS NOT NULL THEN
                      v_commessa_id := vendite.fn_commessa_viva_di_sorgente(
                          v_src.sorgente_tipo_id,
                          v_documento,
                          script.fn_sorgente_chiave_uuid(v_src.sorgente_uid));
                  END IF;

                  IF v_commessa_id IS NOT NULL THEN
                      SELECT c.codice INTO v_codice
                        FROM vendite.commesse c WHERE c.id = v_commessa_id;
                  END IF;

                  -- IL RIPIEGO A TRE LIVELLI, e l'ultimo non e' una resa: la
                  -- chiave grezza e' esattamente cio' che l'operatore vedeva
                  -- prima di questa funzione.
                  -- ⚠️ Stessa scala di vw_dash_competenza_gruppi.riferimento. La
                  --    vista non la chiama, per non risolvere due volte per riga
                  --    (le serve anche documento_id dallo stesso LATERAL, e la
                  --    commessa la conosce dal gruppo): la seconda scrittura e'
                  --    dichiarata e presidiata da un pgTAP che chiede alle due la
                  --    stessa stringa, anche per un documento senza numero.
                  RETURN COALESCE(
                      NULLIF(btrim(COALESCE(v_numero, '')), ''),
                      NULLIF(btrim(COALESCE(v_codice, '')), ''),
                      v_key);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_riferimento_gruppo_fatturabile(text) IS
                'Il RIFERIMENTO leggibile di un gruppo fatturabile: cio'' che una persona riconosce al posto della chiave, ''ORDINE_VENDITA:01a06ce4-…'' diventa ''ORD0036004''. La usa la scheda Critiche del lotto (vendite.fn_list_lotto_segnalazioni), dove la gruppo_key serve al pulsante (fn_escludi_documento_da_giro la vuole), non all''occhio. Compone vendite.fn_split_gruppo_fatturabile_key e vendite.fn_get_sorgente_documento_ref, che risolve il documento e il suo numero leggendo il label_selector dichiarato dalla sorgente a catalogo. Ripiego a TRE livelli: il numero del documento; poi il codice della commessa, che per la forma sourceless ''MAN:<id>'' sta nella chiave e per un documento senza numero (un consumo) e'' la commessa aperta in cui il documento sta (vendite.fn_commessa_viva_di_sorgente); poi la CHIAVE GREZZA, che e'' esattamente cio'' che si vedeva prima, quindi peggiorare e'' impossibile. Un documento che non sta in una commessa aperta ripiega sulla chiave. NULL entra e NULL esce: una chiave assente vuol dire «la segnalazione e'' del GIRO», e li'' non c''e'' nessun documento da nominare. NON SOLLEVA MAI: la chiama una lista. Stessa scala di ripiego di vw_dash_competenza_gruppi.riferimento, che NON la chiama per non risolvere due volte per riga: la seconda scrittura e'' dichiarata e presidiata da un pgTAP che chiede alle due la stessa stringa sulla stessa chiave, per un documento con numero e per uno senza. STABLE, SECURITY INVOKER.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima torna rieseguendo 20260908-31 (CREATE OR REPLACE, stessa firma).
              SELECT 1;
