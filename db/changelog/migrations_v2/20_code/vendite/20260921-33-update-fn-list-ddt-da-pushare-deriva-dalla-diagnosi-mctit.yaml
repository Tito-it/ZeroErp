# D14 — IL LISTER DEL PUSH DERIVA DALLA DIAGNOSI (seconda leva, forma B2;
#   decisione D4 di Tid del 2026-09-21; giro 3 di
#   brief-db-partita-merce-per-documento §2-bis.8, §10). Secondo di tre:
#   -32 la diagnosi (fonte unica), -33 questo, -34 la capability.
#
# ── COSA CAMBIA ────────────────────────────────────────────────────────
#
#   La `cand` del lister non ripete piu' i predicati di eleggibilita'
#   (stato, causale, BA, segmento LIBERA, trigger dell'ordine, differenza
#   della partita, dose > 0): parte da
#     FROM vendite.fn_ddt_push_diagnosi(p_ddt_id) g WHERE g.motivo IS NULL
#   e vi aggiunge SOLO cio' che e' suo — i filtri di chiamata (competenza,
#   BA, limit) e la proiezione dei 31 campi. I fatti che la proiezione
#   richiede li riceve dalla diagnosi: `billing_account_id`,
#   `ordine_riga_id` (da cui ordine e prezzo sorgente con due JOIN per
#   chiave), `quantita_push` (la dose, calcolata una volta).
#
# ── PERCHE' ────────────────────────────────────────────────────────────
#
#   Lister e diagnosi erano DUE copie della stessa regola, tenute uguali
#   da un pgTAP che confrontava le righe vive. Il contratto di api.md —
#   «il motivo lo produce la STESSA funzione che il database usa per
#   agire» — si soddisfa per costruzione solo se una delle due deriva
#   dall'altra: la diagnosi e' quella che sa spiegare, quindi e' lei la
#   fonte e il lister ne e' la proiezione filtrata (D1 per la vista, D4
#   per il lister: stessa mossa).
#
# ── COSA NON CAMBIA ────────────────────────────────────────────────────
#
#   Il contratto verso la pipeline: firma, RETURNS TABLE (31 campi, stessi
#   ancoraggi), ORDER BY, LIMIT, il guard su p_ddt_id <= 0, la risoluzione
#   di DDT_VENDITA. E i numeri: le righe sono le stesse (motivo NULL <=>
#   tutti i predicati di prima) e `quantita` e' la stessa dose. I JOIN su
#   ddt / ddt_righe / articoli / billing_account restano per la
#   PROIEZIONE, non per escludere: articolo_id e' NOT NULL senza RLS, e il
#   BA la diagnosi lo ha gia' attraversato (rank 3).
#
# Base: definizione VIVA (pg_get_functiondef il 21-09 sera, md5 prosrc
#   7acace75…), firma e ancoraggi dal 20260921-23.
# Presidi: test-fn-list-ddt-da-pushare-contatore-v1 (7), -v1, -v2, -orfano,
#   test-fatturazione-immediata-simmetria-sorgenti-v1, test-ddt-solo-
#   trasporto-causale-v1 — invariati; test-fn-available-actions-ddt-reason-
#   catch-all-v2 (i casi costruiti). Il plpgsql_check dei riferimenti morti
#   risolve la diagnosi nuova.
# Dipendenze: 20260921-32.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260921-33-update-fn-list-ddt-da-pushare-deriva-dalla-diagnosi-mctit.yaml

  - changeSet:
      id: 20260921-33-update-fn-list-ddt-da-pushare-deriva-dalla-diagnosi
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        D14 seconda leva (D4, B2): fn_list_ddt_da_pushare deriva da
        fn_ddt_push_diagnosi (motivo IS NULL) e aggiunge solo i filtri di chiamata e
        la proiezione. Contratto verso la pipeline invariato, stessi numeri.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc
                   WHERE proname = 'fn_list_ddt_da_pushare'
                     AND pronamespace = 'vendite'::regnamespace
            # La diagnosi deve gia' esporre le colonne che qui si leggono.
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                   WHERE p.proname = 'fn_ddt_push_diagnosi'
                     AND p.pronamespace = 'vendite'::regnamespace
                     AND pg_get_function_result(p.oid) LIKE '%quantita_push%'
                     AND pg_get_function_result(p.oid) LIKE '%ordine_riga_id%'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Firma e RETURNS TABLE ancorati (%TYPE) come nel 20260921-23: il corpo
              -- vivo li scioglie. Stessi tipi risolti: nessun overload.
              CREATE OR REPLACE FUNCTION vendite.fn_list_ddt_da_pushare(
                  p_competenza_mese    date                                DEFAULT NULL,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE  DEFAULT NULL,
                  p_limit              integer                             DEFAULT NULL,
                  p_ddt_id             vendite.ddt.id%TYPE                 DEFAULT NULL)
               RETURNS TABLE(
                  ddt_id                      vendite.ddt.id%TYPE,
                  ddt_uid                     vendite.ddt.uid%TYPE,
                  riga_id                     vendite.ddt_righe.id%TYPE,
                  billing_account_id          vendite.ddt.billing_account_id%TYPE,
                  utility_id                  anagrafiche.billing_account.utility_id%TYPE,
                  emittente_soggetto_ruolo_id bigint,   -- risolto da fn_get_emittente_fiscale_id, non una colonna
                  competenza_dal              date,     -- derivata da ddt.data
                  competenza_al               date,
                  fatturazione_immediata      vendite.ddt.fatturazione_immediata%TYPE,
                  sorgente_tipo_id            config.sorgenti.id%TYPE,
                  sorgente_uid                text,     -- uid reso a testo (chiave polimorfa)
                  segment_key                 character varying,   -- composta
                  articolo_id                 vendite.ddt_righe.articolo_id%TYPE,
                  istanza_utility_id          anagrafiche.billing_account.istanza_utility_id%TYPE,
                  data_attivita               date,
                  uom_id                      catalogo.articoli.uom_id%TYPE,
                  quantita                    vendite.ddt_righe.quantita%TYPE,
                  qta_operativa               vendite.ddt_righe.qta_operativa%TYPE,
                  uom_operativa_id            vendite.ddt_righe.uom_operativa_id%TYPE,
                  factor_to_base              vendite.ddt_righe.factor_to_base%TYPE,
                  competenza_mese             date,
                  prezzo_snapshot             vendite.ddt_righe.prezzo_unitario%TYPE,
                  prezzo_bloccato             boolean,  -- calcolato (prezzo presente)
                  pricing_mode                character varying,   -- letterali
                  tipo_movimento              character varying,
                  tipo_consumo                character varying,
                  valuta_id                   vendite.ddt.valuta_id%TYPE,
                  meta                        jsonb,
                  tipo_doc_fiscale_id         config.sorgenti.tipo_doc_fiscale_id%TYPE,
                  termine_pagamento_id        config.termini_pagamento.id%TYPE,
                  modalita_pagamento_id       config.modalita_pagamento.id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
              BEGIN
                -- rev 2026-06-28: sorgente/stato DDT per codice_interno (immutabile).
                -- rev 2026-07-17 (step 3): proietta la differenza del contatore.
                -- rev 2026-07-18 (step 5): eleggibilita' dallo stato-trigger IN POI.
                -- rev 2026-07-18 (step 5b): esclude le causali non fatturabili.
                -- rev 2026-07-27: fatturazione_immediata proiettata dalla COLONNA.
                -- rev 2026-08-03 (T.1): espone termine/modalita' di pagamento (NULL).
                -- rev 2026-08-17 (partita generalizzata S5): la differenza si legge
                --   dalla partita, che e' GIA' per riga di DDT.
                -- rev 2026-09-21 (D14, quarta leva): la partita col DDT come seme.
                -- ⭐ rev 2026-09-21 (D14, seconda leva, forma B2): QUESTA FUNZIONE
                --   NON DECIDE PIU' CHI E' ELEGGIBILE. Deriva da
                --   vendite.fn_ddt_push_diagnosi — la fonte unica: ogni predicato
                --   che qui era un JOIN o una riga di WHERE la' e' una rank — e
                --   aggiunge solo i filtri di chiamata e la proiezione. Le righe
                --   e le quantita' sono le stesse di prima per costruzione: la
                --   dose la calcola la diagnosi (quantita_push), una volta.
                --   ⛔ Un predicato di eleggibilita' nuovo si aggiunge alla
                --   diagnosi come rank, non qui: qui non c'e' piu' un posto.
                IF p_ddt_id IS NOT NULL AND p_ddt_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_ddt_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_ddt_id', 'valore', p_ddt_id),
                    NULL::uuid, 'p_ddt_id', p_ddt_id::text);
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'DDT_VENDITA' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_ddt_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'DDT_VENDITA'),
                    NULL::uuid, 'DDT_VENDITA', 'config.sorgenti');
                END IF;

                RETURN QUERY
                WITH cand AS (
                  -- Le righe ELEGGIBILI le dice la diagnosi (motivo NULL). I JOIN
                  -- qui sotto servono alla PROIEZIONE, non a escludere:
                  --   - ddt / ddt_righe: le righe che la diagnosi ha gia' letto
                  --     sotto la stessa RLS;
                  --   - articoli: articolo_id e' NOT NULL e la tabella non ha RLS;
                  --   - billing_account: g.billing_account_id e' NOT NULL per una
                  --     riga eleggibile (rank 3) e la diagnosi lo ha gia'
                  --     attraversato sotto policy;
                  --   - ordini_righe / ordini: per CHIAVE, dalla riga d'ordine
                  --     sorgente che la diagnosi ha scelto (primo fulfillment).
                  SELECT
                    d.id            AS d_id,
                    d.uid           AS d_uid,
                    dr.id           AS dr_id,
                    g.billing_account_id AS ba_id,
                    ba.utility_id           AS ba_utility_id,
                    ba.istanza_utility_id   AS ba_istanza,
                    d.data          AS d_data,
                    d.numero        AS d_numero,
                    d.anno          AS d_anno,
                    d.serie         AS d_serie,
                    d.valuta_id     AS d_valuta,
                    -- Corsia di instradamento: trasportata fino alla SELECT finale.
                    d.fatturazione_immediata AS d_fatt_immediata,
                    dr.articolo_id  AS dr_articolo,
                    dr.quantita     AS dr_quantita,
                    dr.qta_operativa AS dr_qta_op,
                    dr.uom_operativa_id AS dr_uom_op,
                    dr.factor_to_base   AS dr_factor,
                    dr.prezzo_unitario  AS dr_prezzo,
                    a.uom_id        AS a_uom,
                    o_src.uid                  AS src_ordine_uid,
                    o_src.fatturazione_trigger AS src_fatturazione_trigger,
                    or_r.prezzo_unitario       AS src_prezzo_unitario,
                    o_src.valuta_id            AS src_valuta_id,
                    -- La DOSE, dalla diagnosi: e' la stessa che la rank 11 ha
                    -- giudicato > 0. Non si ricalcola.
                    g.quantita_push AS quantita_push
                  FROM vendite.fn_ddt_push_diagnosi(p_ddt_id) g
                  JOIN vendite.ddt d        ON d.id  = g.ddt_id
                  JOIN vendite.ddt_righe dr ON dr.id = g.riga_id
                  JOIN catalogo.articoli a  ON a.id  = dr.articolo_id
                  JOIN anagrafiche.billing_account ba ON ba.id = g.billing_account_id
                  LEFT JOIN vendite.ordini_righe or_r ON or_r.id = g.ordine_riga_id
                  LEFT JOIN vendite.ordini o_src      ON o_src.id = or_r.ordine_id
                  WHERE g.motivo IS NULL
                    -- I filtri DI CHIAMATA: non decidono l'eleggibilita', scelgono
                    -- una fetta delle righe eleggibili (lista push per mese/BA).
                    AND (p_competenza_mese IS NULL OR date_trunc('month', d.data)::date = p_competenza_mese)
                    AND (p_billing_account_id IS NULL OR g.billing_account_id = p_billing_account_id)
                )
                SELECT
                  x.d_id,
                  x.d_uid,
                  x.dr_id,
                  x.ba_id,
                  x.ba_utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(x.ba_id),
                  x.d_data,
                  x.d_data,
                  -- Corsia di instradamento: valore reale del DDT.
                  x.d_fatt_immediata,
                  v_sorgente_tipo_id,
                  x.d_uid::text,
                  ('DDT:' || x.d_uid::text || ':R:' || x.dr_id::text)::varchar,
                  x.dr_articolo,
                  x.ba_istanza,
                  x.d_data,
                  x.a_uom,
                  -- La quantita' da fatturare E' la dose della diagnosi.
                  x.quantita_push,
                  -- qta_operativa scalata proporzionalmente (ratio = 1 se nessuna riduzione)
                  x.dr_qta_op * (x.quantita_push / NULLIF(x.dr_quantita, 0)),
                  x.dr_uom_op,
                  COALESCE(x.dr_factor, 1::numeric),
                  date_trunc('month', x.d_data)::date,
                  COALESCE(x.dr_prezzo, x.src_prezzo_unitario),
                  -- prezzo_bloccato: dipende dal PREZZO della riga,
                  -- INDIPENDENTE dal flag di corsia.
                  (COALESCE(x.dr_prezzo, x.src_prezzo_unitario) IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  'CONGUAGLIO'::varchar,
                  COALESCE(x.d_valuta, x.src_valuta_id),
                  jsonb_build_object(
                    'ddt_numero',          x.d_numero,
                    'ddt_anno',            x.d_anno,
                    'ddt_serie',           x.d_serie,
                    'ordine_sorgente_uid', x.src_ordine_uid,
                    'ordine_fatturaz_trg', x.src_fatturazione_trigger,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM cand x
                ORDER BY x.d_id, x.dr_id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_ddt_da_pushare(date, anagrafiche.billing_account.id%TYPE, integer, vendite.ddt.id%TYPE) IS
                'rev 2026-09-21 (D14, seconda leva, forma B2): il lister DERIVA da vendite.fn_ddt_push_diagnosi — FROM fn_ddt_push_diagnosi(p_ddt_id) WHERE motivo IS NULL — e aggiunge solo i filtri di chiamata (competenza, BA, limit) e la proiezione dei 31 campi; BA, riga d''ordine sorgente e DOSE (quantita_push) li riceve dalla diagnosi. L''eleggibilita'' sta scritta in UN posto: un predicato nuovo si aggiunge alla diagnosi come rank, non qui. Contratto verso la pipeline invariato, stesse righe e stesse quantita'' per costruzione. rev 2026-09-21 (D14, quarta leva): la partita si legge da vendite.fn_partite_merce con il DDT chiesto come SEME (la chiusura del documento, non le partite di tutti); p_ddt_id NULL (lista push, cockpit) = tutte. Lista righe DDT eligible al push su commessa. rev 2026-08-17 (partita generalizzata S5): la quantita'' da fatturare e'' la DIFFERENZA della partita di merce, gia'' per riga di DDT — spariscono la ridistribuzione greedy della differenza d''ordine e il caso speciale standalone/compositi. ⚠️ Una partita NON MISURABILE non viene spinta (rank 9 della diagnosi). ⚠️ Nota per la nota di credito: quando una RETTIFICA abbassera'' il fatturato, la differenza tornera'' positiva e solo script.fn_get_stato_push_segment = LIBERA (rank 4) impedira'' la ri-spinta. rev 2026-07-18 (step 5b): esclude i DDT con causale di trasporto NON fatturabile (DL-28). rev 2026-07-18 (step 5): eleggibilita'' order-backed DALLO stato-trigger IN POI, cintura XOR != CONFERMATO PRESERVATA. rev 2026-06-28: sorgente/stato per codice_interno. rev 2026-07-19: esclusione su ALLOCAZIONE via fn_get_stato_push_segment. rev 2026-07-27: fatturazione_immediata dalla colonna. Espone termine_pagamento_id e modalita_pagamento_id a NULL (rev 2026-08-03, T.1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Non si torna indietro da soli: va ri-applicato 20260921-23 (i
              --    predicati dentro il lister) insieme al 20260921-24 e al 20260810-06.
              SELECT 1;
