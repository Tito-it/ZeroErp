databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260510-02-update-fn-list-ordini-da-pushare-add-p-ordine-id-mctit.yaml

  - changeSet:
      id: 20260510-02-update-fn-list-ordini-da-pushare-add-p-ordine-id
      author: mctit
      runOnChange: false
      comment: "Estensione 2026-05 (coordinata): aggiunge p_ordine_id (opzionale) per uniformare la signature a fn_list_preventivi_da_pushare. Obbligatoria per non rompere il batch globale quando fetch_pushable_rows passa 4 args posizionali."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              DROP FUNCTION IF EXISTS vendite.fn_list_ordini_da_pushare(date, bigint, integer);

              -- Estensione 2026-05: p_ordine_id (opzionale) per uniformare signature batch.
              -- NULL = comportamento lista globale del batch orchestrator.
              CREATE OR REPLACE FUNCTION vendite.fn_list_ordini_da_pushare(
                p_competenza_mese    vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL,
                p_billing_account_id anagrafiche.billing_account.id%TYPE           DEFAULT NULL,
                p_limit              integer                                        DEFAULT NULL,
                p_ordine_id          vendite.ordini.id%TYPE                        DEFAULT NULL
              )
              RETURNS TABLE(
                ordine_id                    vendite.ordini.id%TYPE,
                ordine_uid                   vendite.ordini.uid%TYPE,
                riga_id                      vendite.ordini_righe.id%TYPE,
                billing_account_id           anagrafiche.billing_account.id%TYPE,
                utility_id                   anagrafiche.billing_account.utility_id%TYPE,
                emittente_soggetto_ruolo_id  vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                competenza_dal               vendite.commesse.competenza_dal%TYPE,
                competenza_al                vendite.commesse.competenza_al%TYPE,
                fatturazione_immediata       vendite.commesse.fatturazione_immediata%TYPE,
                sorgente_tipo_id             config.sorgenti.id%TYPE,
                sorgente_uid                 vendite.commesse_attivita.sorgente_uid%TYPE,
                segment_key                  vendite.commesse_attivita.segment_key%TYPE,
                articolo_id                  vendite.commesse_attivita.articolo_id%TYPE,
                istanza_utility_id           vendite.commesse_attivita.istanza_utility_id%TYPE,
                data_attivita                vendite.commesse_attivita.data_attivita%TYPE,
                uom_id                       vendite.commesse_attivita.uom_id%TYPE,
                quantita                     vendite.commesse_attivita.quantita%TYPE,
                qta_operativa                vendite.commesse_attivita.qta_operativa%TYPE,
                uom_operativa_id             vendite.commesse_attivita.uom_operativa_id%TYPE,
                factor_to_base               vendite.commesse_attivita.factor_to_base%TYPE,
                competenza_mese              vendite.commesse_attivita.competenza_mese%TYPE,
                prezzo_snapshot              vendite.commesse_attivita.prezzo_snapshot%TYPE,
                prezzo_bloccato              vendite.commesse_attivita.prezzo_bloccato%TYPE,
                pricing_mode                 vendite.commesse_attivita.pricing_mode%TYPE,
                tipo_movimento               varchar,
                tipo_consumo                 varchar,
                valuta_id                    vendite.commesse_attivita.valuta_id%TYPE,
                meta                         vendite.commesse_attivita.meta%TYPE,
                tipo_doc_fiscale_id          config.tipi_doc_fiscale.id%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_confermato_id config.stati_doc_ordini.id%TYPE;
              BEGIN
                -- Guard: p_ordine_id, se specificato, deve essere > 0.
                IF p_ordine_id IS NOT NULL AND p_ordine_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite',
                    'fn_list_ordini_da_pushare',
                    'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_ordine_id', 'valore', p_ordine_id),
                    NULL::uuid,
                    'p_ordine_id', p_ordine_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice = 'ORDINE_VENDITA' AND s.attivo IS TRUE
                LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_ordini_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'ORDINE_VENDITA'),
                    NULL::uuid,
                    'ORDINE_VENDITA', 'config.sorgenti'
                  );
                END IF;

                SELECT s.id INTO v_stato_confermato_id
                FROM config.stati_doc_ordini s
                WHERE s.codice = 'CONFERMATO' AND s.attivo IS TRUE
                LIMIT 1;

                RETURN QUERY
                SELECT
                  o.id, o.uid, or_r.id,
                  o.billing_account_id,
                  ba.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(o.billing_account_id),
                  o.data, o.data,
                  FALSE,
                  v_sorgente_tipo_id,
                  o.uid::text,
                  ('ORD:' || o.uid::text || ':R:' || or_r.id::text)::varchar,
                  or_r.articolo_id,
                  ba.istanza_utility_id,
                  o.data,
                  NULL::bigint,
                  or_r.quantita,
                  or_r.qta_operativa,
                  or_r.uom_operativa_id,
                  COALESCE(or_r.factor_to_base, 1::numeric),
                  date_trunc('month', o.data)::date,
                  or_r.prezzo_unitario,
                  TRUE,
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  'CONGUAGLIO'::varchar,
                  o.valuta_id,
                  jsonb_build_object(
                    'ordine_numero',       o.numero,
                    'ordine_anno',         o.anno,
                    'ordine_serie',        o.serie,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id
                FROM vendite.ordini o
                JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                JOIN vendite.ordini_righe or_r
                  ON or_r.ordine_id = o.id
                 AND or_r.attivo IS TRUE
                 AND or_r.quantita > 0
                 AND or_r.prezzo_unitario >= 0
                WHERE o.billing_account_id IS NOT NULL
                  AND (v_stato_confermato_id IS NULL OR o.stato_doc_ordine_id = v_stato_confermato_id)
                  AND o.fatturazione_trigger = 'CONFERMATO'
                  AND (p_competenza_mese IS NULL OR date_trunc('month', o.data)::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR o.billing_account_id = p_billing_account_id)
                  -- Estensione 2026-05: NULL = lista globale; NOT NULL = singolo ordine.
                  AND (p_ordine_id IS NULL OR o.id = p_ordine_id)
                  AND NOT EXISTS (
                    SELECT 1 FROM vendite.commesse_attivita ca
                    WHERE ca.segment_key = 'ORD:' || o.uid::text || ':R:' || or_r.id::text
                      AND ca.stato_emissione = 'EMESSA'
                  )
                ORDER BY o.id, or_r.id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_ordini_da_pushare(date, bigint, integer, bigint)
              IS 'Lista righe ordine eligible al push su commessa (stato CONFERMATO, fatturazione_trigger CONFERMATO). p_ordine_id (opzionale): NULL=lista globale batch, NOT NULL=singolo ordine. Tutti i filtri in AND. Esclude righe gia` emesse via NOT EXISTS su commesse_attivita.';
