# L6b′/L6c′ — Il confronto si sposta sugli EMITTENTI, e sparisce un giro
#   vendite.fn_check_commessa_sorgente_emittente_omogeneo(...)
#   vendite.fn_guard_commessa_sorgente_emittente(...)
#   Piano: brief-db-emittente-commessa-invariante, L6 (rev 2026-08-26)
#
# ── ⭐ COSA CAMBIA, E PERCHE' E' PIU' SEMPLICE ──────────────────────
#   Prima: commessa -> billing account -> emittente, e documento -> billing
#   account -> emittente. Due deviazioni, e quella del documento passava da una
#   colonna NULLABLE su quattro tabelle su sei (vedi 20260826-50).
#   Adesso: la commessa l'emittente CE L'HA GIA' addosso — `NOT NULL` dal
#   20260826-41 — e il documento lo dice da se'. Il confronto e' fra due
#   colonne, senza intermediari.
#
# ── ⛔ E CADE LA SCORCIATOIA «stesso billing account -> true» ───────
#   Serviva a evitare due risoluzioni nel caso normale. Con la lettura diretta
#   non c'e' piu' niente da evitare, e una scorciatoia che non fa risparmiare
#   nulla e' solo un ramo in piu' da mantenere.
#
# ⚠️ Il codice sollevato non cambia (E_COMMESSA_SORGENTE_EMITTENTE_MISTO) e
#   nemmeno la sua classe: cambia da dove viene la risposta, non la regola.
# ⚠️ Nessun DROP: firme identiche, `CREATE OR REPLACE`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260826-51-update-check-guard-commessa-sorgente-emittente-mctit.yaml

  - changeSet:
      id: 20260826-51-update-check-guard-commessa-sorgente-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L6b′/L6c′: il check e il guard sull'omogeneita' delle sorgenti passano al risolutore
        per EMITTENTE (20260826-50) e leggono l'emittente della commessa direttamente dalla sua
        colonna, che dal 20260826-41 e' NOT NULL. ⭐ Spariscono due deviazioni dal billing
        account, e con esse la scorciatoia «stesso BA -> true»: serviva a evitare due
        risoluzioni, e con la lettura diretta non c'e' piu' niente da evitare — una scorciatoia
        che non fa risparmiare nulla e' solo un ramo in piu' da mantenere. ⚠️ La REGOLA non
        cambia, e nemmeno il codice sollevato: cambia da dove viene la risposta.
        Piano: brief-db-emittente-commessa-invariante, L6.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_get_sorgente_emittente_sr_id'
                     AND p.pronargs = 2;
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name   = 'commesse'
                     AND column_name  = 'emittente_soggetto_ruolo_id'
                     AND is_nullable  = 'NO';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_check_commessa_sorgente_emittente_omogeneo(
                  p_commessa_id      vendite.commesse.id%TYPE,
                  p_sorgente_tipo_id config.sorgenti.id%TYPE,
                  p_sorgente_uid     vendite.commesse_sorgenti.sorgente_uid%TYPE
              )
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_ef_commessa vendite.commesse.emittente_soggetto_ruolo_id%TYPE;
                  v_ef_sorgente anagrafiche.soggetti_ruoli.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   «Una commessa non puo' aggregare diversi emittenti
                  --   insieme» (Tid). Qui si risponde SI/NO per una singola
                  --   sorgente che si sta per collegare.
                  --
                  -- ⭐ Il confronto e' fra DUE COLONNE, senza intermediari: la
                  --   commessa l'emittente ce l'ha addosso (NOT NULL dal
                  --   20260826-41) e il documento lo dice da se'
                  --   (script.fn_get_sorgente_emittente_sr_id).
                  --   La versione precedente passava dal billing account su
                  --   entrambi i lati, e su quattro tabelle sorgente su sei
                  --   quella colonna e' NULLABLE: si fermava su documenti
                  --   validi.
                  --
                  -- Convenzione fn_check_*: boolean, nessun raise proprio.
                  -- ⚠️ Puo' pero' PROPAGARE i fail-closed del risolutore
                  --   (E_SORG_*): non sono verdetti di dominio, sono difetti
                  --   di configurazione o riferimenti rotti, e mascherarli qui
                  --   li renderebbe invisibili.
                  -- =========================================================
                  IF p_commessa_id IS NULL OR p_sorgente_tipo_id IS NULL OR p_sorgente_uid IS NULL THEN
                      -- ⛔ Fail-closed: «non so dirlo» non e' «va bene».
                      RETURN false;
                  END IF;

                  -- ⚠️ SECURITY DEFINER: senza, una commessa fuori perimetro
                  --   sarebbe invisibile e questo NOT FOUND direbbe il falso.
                  SELECT c.emittente_soggetto_ruolo_id
                    INTO v_ef_commessa
                    FROM vendite.commesse c
                   WHERE c.id = p_commessa_id;

                  IF NOT FOUND OR v_ef_commessa IS NULL THEN
                      RETURN false;
                  END IF;

                  v_ef_sorgente := script.fn_get_sorgente_emittente_sr_id(
                                       p_sorgente_tipo_id, p_sorgente_uid);

                  -- ⛔ NULL = fail-closed, e NON `IS NOT DISTINCT FROM`: con
                  --   quello due emittenti irrisolti direbbero «omogeneo»,
                  --   cioe' la trappola del NULL nella chiave riaperta qui.
                  IF v_ef_sorgente IS NULL THEN
                      RETURN false;
                  END IF;

                  RETURN v_ef_commessa = v_ef_sorgente;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_check_commessa_sorgente_emittente_omogeneo(bigint, bigint, text)
              IS 'Pure check (boolean, nessun raise proprio): la sorgente che si sta collegando appartiene allo STESSO emittente fiscale della commessa? E'' l''invariante detto da Tid — «una commessa non puo'' aggregare diversi emittenti insieme» — sull''asse dei documenti (H4). ⭐ rev 2026-08-26: il confronto e'' fra DUE COLONNE, senza intermediari — la commessa porta l''emittente addosso (NOT NULL dal 20260826-41) e il documento lo dice da se'' via script.fn_get_sorgente_emittente_sr_id. La versione precedente passava dal BILLING ACCOUNT su entrambi i lati, e su quattro tabelle sorgente su sei (ordini, preventivi, ddt, resi) quella colonna e'' NULLABLE: si fermava fail-closed su documenti perfettamente validi. ⛔ E'' caduta anche la scorciatoia «stesso billing account -> true»: serviva a evitare due risoluzioni, e con la lettura diretta non c''e'' piu'' niente da evitare — una scorciatoia che non fa risparmiare nulla e'' solo un ramo in piu'' da mantenere. ⭐ Il criterio resta l''EMITTENTE e non l''identita'' del billing account (decisione D-4): bloccare sul BA vieterebbe per sempre che un documento di un BA figlio contribuisca alla commessa del padre, e l''albero dei billing account esiste apposta perche'' piu'' BA stiano sotto lo stesso emittente — una decisione di dominio che nessuno ha preso. ⚠️ SECURITY DEFINER: legge vendite.commesse, che ha la RLS. ⛔ NULL -> false (fail-closed) e NON IS NOT DISTINCT FROM. ⚠️ Puo'' PROPAGARE i fail-closed del risolutore (E_SORG_*): difetti di configurazione o riferimenti rotti, non verdetti di dominio. Piano: brief-db-emittente-commessa-invariante, L6.';

              CREATE OR REPLACE FUNCTION vendite.fn_guard_commessa_sorgente_emittente(
                  p_commessa_id      vendite.commesse.id%TYPE,
                  p_sorgente_tipo_id config.sorgenti.id%TYPE,
                  p_sorgente_uid     vendite.commesse_sorgenti.sorgente_uid%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_codice_commessa vendite.commesse.codice%TYPE;
                  v_ef_commessa     vendite.commesse.emittente_soggetto_ruolo_id%TYPE;
                  v_codice_sorgente config.sorgenti.codice_interno%TYPE;
                  v_ef_sorgente     anagrafiche.soggetti_ruoli.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Fail-fast sull'invariante «una commessa non aggrega due
                  --   emittenti». La DECISIONE sta nel check: qui si compone
                  --   soltanto la frase che una persona legge.
                  -- =========================================================
                  IF vendite.fn_check_commessa_sorgente_emittente_omogeneo(
                         p_commessa_id, p_sorgente_tipo_id, p_sorgente_uid) THEN
                      RETURN;
                  END IF;

                  SELECT c.codice, c.emittente_soggetto_ruolo_id
                    INTO v_codice_commessa, v_ef_commessa
                    FROM vendite.commesse c
                   WHERE c.id = p_commessa_id;

                  SELECT s.codice_interno INTO v_codice_sorgente
                    FROM config.sorgenti s WHERE s.id = p_sorgente_tipo_id;

                  BEGIN
                      v_ef_sorgente := script.fn_get_sorgente_emittente_sr_id(
                                           p_sorgente_tipo_id, p_sorgente_uid);
                  EXCEPTION WHEN OTHERS THEN
                      -- ⚠️ Il messaggio non deve MAI mangiarsi il verdetto: se
                      --   la risoluzione fallisce qui, l'errore di dominio esce
                      --   lo stesso con un «?» al posto dell'emittente.
                      v_ef_sorgente := NULL;
                  END;

                  PERFORM script.fn_log_and_raise_error(
                      'vendite',
                      'fn_guard_commessa_sorgente_emittente',
                      'E_COMMESSA_SORGENTE_EMITTENTE_MISTO',
                      jsonb_build_object(
                          'commessa_id',           p_commessa_id,
                          'codice',                v_codice_commessa,
                          'sorgente_tipo_id',      p_sorgente_tipo_id,
                          'sorgente_codice',       v_codice_sorgente,
                          'sorgente_uid',          p_sorgente_uid,
                          'emittente_sr_commessa', v_ef_commessa,
                          'emittente_sr_sorgente', v_ef_sorgente),
                      NULL::uuid,
                      COALESCE(v_codice_commessa, p_commessa_id::text),
                      concat(COALESCE(v_codice_sorgente, p_sorgente_tipo_id::text), ' ', p_sorgente_uid),
                      COALESCE(v_ef_commessa::text, '?'),
                      COALESCE(v_ef_sorgente::text, '?'));
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_guard_commessa_sorgente_emittente(bigint, bigint, text)
              IS 'Guard fail-fast sull''invariante «una commessa non puo'' aggregare diversi emittenti insieme» (H4): la sorgente che si sta collegando deve stare sullo stesso emittente fiscale della commessa. Solleva E_COMMESSA_SORGENTE_EMITTENTE_MISTO nominando la commessa, il documento e i due emittenti. ⭐ La DECISIONE non e'' qui: sta in vendite.fn_check_commessa_sorgente_emittente_omogeneo, e questa funzione compone soltanto la frase — si condivide la funzione, non una copia della sua logica. rev 2026-08-26: l''emittente della commessa si legge dalla sua colonna (NOT NULL) e quello del documento da script.fn_get_sorgente_emittente_sr_id; nessuno dei due passa piu'' dal billing account. ⚠️ SECURITY DEFINER: per comporre il messaggio rilegge vendite.commesse, che ha la RLS. ⚠️ La risoluzione del messaggio e'' avvolta in un blocco EXCEPTION: se fallisce, l''errore di dominio esce lo stesso con un «?» al posto dell''emittente — il messaggio non deve mai mangiarsi il verdetto. ⛔ Nessuna GUC di override e nessuna eccezione per il pregresso. Piano: brief-db-emittente-commessa-invariante, L6.';
      rollback:
        - empty: {}
