databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260513-20-create-trgfn-listini-righe-comp-guard-immutabilita-v5-mctit.yaml

  # ---------------------------------------------------------------------------
  # Guard immutabilita' v5 su vendite.listini_righe_componenti (2026-05-13, §8.2).
  #
  # Pattern listini v5: INSERT solo su versione BOZZA; UPDATE prezzo/iva_id/validita
  # bloccato se versione ATTIVA o CHIUSA; DELETE bloccato sempre (usare attivo=FALSE).
  #
  # Errori riutilizzati da listini_righe: E_RIGA_LISTINO_VERSIONE_CHIUSA (362).
  #
  # 2 changeSet:
  #   20-01  trgfn vendite.trgfn_listini_righe_comp_guard_immutabilita_v5
  #   20-02  trigger BEFORE INSERT OR UPDATE OR DELETE su listini_righe_componenti
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260513-20-01-create-trgfn-listini-righe-comp-guard-immutabilita-v5
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Trigger function vendite.trgfn_listini_righe_comp_guard_immutabilita_v5.
        DELETE: raise sempre (usare attivo=FALSE).
        INSERT: solo se versione.stato = 'BOZZA'.
        UPDATE prezzo/iva_id/validita: solo se versione.stato = 'BOZZA'.
        Raise E_RIGA_LISTINO_VERSIONE_CHIUSA (362).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: listini_righe_componenti
          - tableExists:
              schemaName: vendite
              tableName: listini_versioni
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_comp_guard_immutabilita_v5()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE INS/UPD/DEL su listini_righe_componenti — immutabilita' v5.
              --   Pattern listini: INSERT solo in versione BOZZA, UPDATE campi core
              --   bloccato in versione non-BOZZA, DELETE sempre bloccato.
              DECLARE
                  v_stato   vendite.listini_versioni.stato%TYPE;
                  v_riga_id vendite.listini_righe_componenti.id%TYPE;
              BEGIN
                  v_riga_id := CASE WHEN TG_OP = 'DELETE' THEN OLD.id ELSE NEW.id END;

                  -- DELETE bloccato: usare attivo=FALSE
                  IF TG_OP = 'DELETE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'operazione', 'DELETE',
                              'hint',       'Usare attivo=FALSE per disattivare la riga.',
                              'riga_id',    v_riga_id
                          ),
                          NULL::uuid,
                          'DELETE', v_riga_id::text, 'PROTETTA'
                      );
                  END IF;

                  -- Legge stato versione
                  SELECT lv.stato INTO v_stato
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = NEW.listino_versione_id;

                  -- INSERT: solo in versione BOZZA
                  IF TG_OP = 'INSERT' AND COALESCE(v_stato, 'BOZZA') <> 'BOZZA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          jsonb_build_object(
                              'operazione',         'INSERT',
                              'stato_versione',     v_stato,
                              'listino_versione_id', NEW.listino_versione_id
                          ),
                          NULL::uuid,
                          'INSERT', v_riga_id::text, v_stato
                      );
                  END IF;

                  -- UPDATE campi core: bloccato se versione non BOZZA
                  IF TG_OP = 'UPDATE' AND COALESCE(v_stato, 'BOZZA') <> 'BOZZA' THEN
                      IF NEW.prezzo    IS DISTINCT FROM OLD.prezzo
                         OR NEW.iva_id   IS DISTINCT FROM OLD.iva_id
                         OR NEW.validita IS DISTINCT FROM OLD.validita
                      THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', TG_NAME, 'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                              jsonb_build_object(
                                  'operazione',         'UPDATE_CAMPI_CORE',
                                  'stato_versione',     v_stato,
                                  'listino_versione_id', NEW.listino_versione_id,
                                  'riga_id',            NEW.id
                              ),
                              NULL::uuid,
                              'UPDATE', NEW.id::text, v_stato
                          );
                      END IF;
                  END IF;

                  RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_comp_guard_immutabilita_v5() IS
                  'Trigger BEFORE INS/UPD/DEL su listini_righe_componenti: immutabilita'' v5. '
                  'DELETE sempre bloccato (usare attivo=FALSE). INSERT solo in BOZZA. '
                  'UPDATE prezzo/iva_id/validita bloccato in non-BOZZA. '
                  'Raise E_RIGA_LISTINO_VERSIONE_CHIUSA (362). rev 2026-05-13.';
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS
              vendite.trgfn_listini_righe_comp_guard_immutabilita_v5();

  - changeSet:
      id: 20260513-20-02-create-trg-listrighe-comp-guard-immutabilita-v5
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Trigger BEFORE INSERT OR UPDATE OR DELETE su vendite.listini_righe_componenti,
        fase _a10_guard. Immutabilita' v5 listini.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: listini_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'vendite'
                   AND p.proname = 'trgfn_listini_righe_comp_guard_immutabilita_v5';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_listrighe_comp_a10_guard_immutabilita_v5_ins_upd_dlt
                  ON vendite.listini_righe_componenti;

              CREATE TRIGGER trg_listrighe_comp_a10_guard_immutabilita_v5_ins_upd_dlt
                  BEFORE INSERT OR UPDATE OR DELETE
                  ON vendite.listini_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_listini_righe_comp_guard_immutabilita_v5();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_listrighe_comp_a10_guard_immutabilita_v5_ins_upd_dlt
                  ON vendite.listini_righe_componenti;
