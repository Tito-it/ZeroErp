# ------------------------------------------------------------
# Estende fn_resolve_prezzo_composito per restituire origine_prezzo
# in CASO A (N righe componenti). Il campo e' aggiunto in coda al
# RETURNS TABLE per backward-compat by-position con caller esistenti.
#
# Motivazione: fn_preventivo_riga_componenti_init deve popolare
# preventivi_righe_componenti.origine_prezzo con l'origine resolver
# per ogni componente CASO A. Senza questo campo il resolver composito
# scartava v_resolve.origine di fn_resolve_prezzo_listino_v2.
#
# DROP FUNCTION IF EXISTS obbligatorio: RETURNS TABLE cambia firma
# (feedback_pg_returns_table_drop_required).
#
# Nota iva_id: mantenuto bigint (non %TYPE su config.iva.id) per
# backward-compat by-position — la colonna sorgente e' integer ma
# la funzione ha sempre esposto bigint verso i caller esistenti.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-04-update-fn-resolve-prezzo-composito-add-origine-mctit.yaml

  - changeSet:
      id: 20260511-04-01-update-fn-resolve-prezzo-composito-add-origine
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Estende vendite.fn_resolve_prezzo_composito: aggiunge origine_prezzo
        come ultima colonna RETURNS TABLE (backward-compat by-position).
        CASO A: origine_prezzo = v_resolve.origine per ogni componente.
        CASO B1: origine_prezzo = v_resolve.origine (prezzo diretto padre).
        CASO B2: origine_prezzo = NULL (Sigma multi-componente).
        Parametri e RETURNS TABLE aggiornati a %TYPE.
        DROP FUNCTION IF EXISTS richiesto: modifica RETURNS TABLE.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: commesse_attivita
          - columnExists:
              schemaName: vendite
              tableName: commesse_attivita
              columnName: origine_prezzo
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_resolve_prezzo_composito(uuid, bigint, date, bigint, integer, bigint, integer);

              CREATE OR REPLACE FUNCTION vendite.fn_resolve_prezzo_composito(
                  p_prodotto_id                 catalogo.articoli.id%TYPE,
                  p_uom_id                      catalogo.unita_misura.id%TYPE,
                  p_data_riferimento            vendite.preventivi.data%TYPE,
                  p_ba_id                       anagrafiche.billing_account.id%TYPE,
                  p_utility_id                  vendite.preventivi.utility_id%TYPE,
                  p_emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  p_classe_utenza_id            config.classi_utenze.id%TYPE DEFAULT NULL
              )
              RETURNS TABLE(
                  componente_id       catalogo.articoli.id%TYPE,
                  uom_id              catalogo.unita_misura.id%TYPE,
                  prezzo_unitario     vendite.listini_righe.prezzo%TYPE,
                  iva_id              bigint,
                  descrizione_fattura catalogo.articoli.descrizione%TYPE,
                  esposto_in_fattura  catalogo.articoli_componenti.esposto_in_fattura%TYPE,
                  coeff_qta           catalogo.articoli_componenti.coeff_qta%TYPE,
                  origine_prezzo      vendite.commesse_attivita.origine_prezzo%TYPE
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_has_esposti     boolean;
                  v_prezzo_padre    vendite.listini_righe.prezzo%TYPE;
                  v_origine_b1      vendite.commesse_attivita.origine_prezzo%TYPE;
                  v_prezzo_totale   vendite.listini_righe.prezzo%TYPE := 0;
                  v_articolo_iva_id catalogo.articoli.iva_id%TYPE;
                  v_articolo_desc   catalogo.articoli.descrizione%TYPE;
                  v_rec             record;
                  v_resolve         record;
              BEGIN
                  -- =========================================================
                  -- Scopo (post 22-04-2026, DB-3 Sprint C):
                  --   Resolver BoM ibrido pricing v5. N righe se composito
                  --   ha componenti esposti (CASO A), 1 riga altrimenti
                  --   (CASO B1 prezzo diretto, CASO B2 Sigma pesata).
                  --   Espone coeff_qta per BoMComponentExpander (DEC-3 §14.4.1).
                  --
                  -- Estensione 2026-05-11:
                  --   Aggiunto origine_prezzo (ultima colonna, backward-compat).
                  --   CASO A: origine per componente da fn_resolve_prezzo_listino_v2.
                  --   CASO B1: origine dal resolver padre.
                  --   CASO B2: NULL (Sigma aggregata).
                  -- =========================================================

                  IF p_prodotto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'fn_resolve_prezzo_composito',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_prodotto_id'),
                          NULL::uuid,
                          'p_prodotto_id obbligatorio'
                      );
                  END IF;

                  SELECT EXISTS (
                      SELECT 1
                        FROM catalogo.articoli_componenti ac
                       WHERE ac.prodotto_id            = p_prodotto_id
                         AND ac.esposto_in_fattura     = TRUE
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita              @> p_data_riferimento
                  )
                  INTO v_has_esposti;

                  -- CASO A: almeno un componente esposto -> N righe
                  IF v_has_esposti THEN
                      FOR v_rec IN
                          SELECT ac.componente_id,
                                 ac.esposto_in_fattura,
                                 ac.coeff_qta,
                                 a.uom_id      AS componente_uom_id,
                                 a.iva_id      AS componente_iva_id,
                                 a.descrizione AS componente_descrizione
                            FROM catalogo.articoli_componenti ac
                            JOIN catalogo.articoli a ON a.id = ac.componente_id
                           WHERE ac.prodotto_id            = p_prodotto_id
                             AND ac.obbligatorio           = TRUE
                             AND COALESCE(ac.attivo, TRUE) = TRUE
                             AND ac.validita              @> p_data_riferimento
                      LOOP
                          SELECT *
                            INTO v_resolve
                            FROM vendite.fn_resolve_prezzo_listino_v2(
                                v_rec.componente_id,
                                v_rec.componente_uom_id,
                                p_data_riferimento,
                                p_ba_id,
                                p_utility_id,
                                p_emittente_soggetto_ruolo_id,
                                p_classe_utenza_id
                            );

                          componente_id       := v_rec.componente_id;
                          uom_id              := v_rec.componente_uom_id;
                          prezzo_unitario     := v_resolve.prezzo_finale;
                          iva_id              := v_rec.componente_iva_id;
                          descrizione_fattura := v_rec.componente_descrizione;
                          esposto_in_fattura  := v_rec.esposto_in_fattura;
                          coeff_qta           := v_rec.coeff_qta;
                          origine_prezzo      := v_resolve.origine;
                          RETURN NEXT;
                      END LOOP;

                      RETURN;
                  END IF;

                  -- CASO B: metadati padre
                  SELECT a.iva_id, a.descrizione
                    INTO v_articolo_iva_id, v_articolo_desc
                    FROM catalogo.articoli a
                   WHERE a.id = p_prodotto_id;

                  -- CASO B1: prezzo diretto sul padre
                  BEGIN
                      SELECT *
                        INTO v_resolve
                        FROM vendite.fn_resolve_prezzo_listino_v2(
                            p_prodotto_id,
                            p_uom_id,
                            p_data_riferimento,
                            p_ba_id,
                            p_utility_id,
                            p_emittente_soggetto_ruolo_id,
                            p_classe_utenza_id
                        );
                      v_prezzo_padre := v_resolve.prezzo_finale;
                      v_origine_b1   := v_resolve.origine;
                  EXCEPTION
                      WHEN SQLSTATE 'P0001' THEN
                          v_prezzo_padre := NULL;
                          v_origine_b1   := NULL;
                  END;

                  IF v_prezzo_padre IS NOT NULL THEN
                      componente_id       := p_prodotto_id;
                      uom_id              := p_uom_id;
                      prezzo_unitario     := v_prezzo_padre;
                      iva_id              := v_articolo_iva_id;
                      descrizione_fattura := v_articolo_desc;
                      esposto_in_fattura  := FALSE;
                      coeff_qta           := 1::numeric;
                      origine_prezzo      := v_origine_b1;
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  -- CASO B2: Sigma pesata, origine_prezzo = NULL
                  FOR v_rec IN
                      SELECT ac.componente_id,
                             ac.coeff_qta,
                             a.uom_id AS componente_uom_id
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                       WHERE ac.prodotto_id            = p_prodotto_id
                         AND ac.obbligatorio           = TRUE
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita              @> p_data_riferimento
                  LOOP
                      SELECT *
                        INTO v_resolve
                        FROM vendite.fn_resolve_prezzo_listino_v2(
                            v_rec.componente_id,
                            v_rec.componente_uom_id,
                            p_data_riferimento,
                            p_ba_id,
                            p_utility_id,
                            p_emittente_soggetto_ruolo_id,
                            p_classe_utenza_id
                        );
                      v_prezzo_totale := v_prezzo_totale + v_resolve.prezzo_finale * v_rec.coeff_qta;
                  END LOOP;

                  componente_id       := p_prodotto_id;
                  uom_id              := p_uom_id;
                  prezzo_unitario     := v_prezzo_totale;
                  iva_id              := v_articolo_iva_id;
                  descrizione_fattura := v_articolo_desc;
                  esposto_in_fattura  := FALSE;
                  coeff_qta           := 1::numeric;
                  origine_prezzo      := NULL;
                  RETURN NEXT;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_resolve_prezzo_composito(uuid, bigint, date, bigint, integer, bigint, integer)
              IS 'Resolver BoM ibrido pricing v5 (post 22-04-2026): N righe se composito ha componenti esposti, 1 riga altrimenti (prezzo diretto o Sigma pesata). Espone coeff_qta per BoMComponentExpander (DEC-3 §14.4.1). origine_prezzo aggiunta 2026-05-11 (ultima colonna, backward-compat by-position): CASO A = origine componente, CASO B1 = origine padre, CASO B2 = NULL.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_resolve_prezzo_composito(uuid, bigint, date, bigint, integer, bigint, integer);
