# L'AVVISO MONTATO SU BOLLA, ORDINE, PREVENTIVO E CONTRATTO
#   trg_ddt_m10_guard_annullo_con_legami_upd
#   trg_ordini_m10_guard_annullo_con_legami_upd
#   trg_preventivi_m10_guard_annullo_con_legami_upd
#   trg_contratti_m10_guard_annullo_con_legami_upd
#   Brief: brief-db-annullo-documento-con-legami (§7.2, D-1, D-4, D-5 di Tid)
#
# ── LA FORMA ────────────────────────────────────────────────────────
#   Il BB vendite.trgfn_doc_guard_annullo_con_legami (20261011-81), BEFORE
#   UPDATE con WHEN sul cambio della colonna di stato (linee-guida-trigger:
#   si reagisce a un CAMBIO di valore). Fascia _m10_: dopo tutti i guard
#   _a10_ della tabella, perche' prima parla cio' che vieta (matrice,
#   righe di commessa EMESSA, figli vivi) e poi cio' che chiede conferma.
#   Sulla bolla prende il posto della Regola 4 di
#   vendite.trgfn_ddt_guard_transizione, che si ritira in 20261011-83.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261011-82-create-trigger-doc-guard-annullo-con-legami-mctit.yaml

  - changeSet:
      id: 20261011-82-create-trigger-doc-guard-annullo-con-legami
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta vendite.trgfn_doc_guard_annullo_con_legami (fascia _m10_, BEFORE UPDATE sul cambio di
        stato) su ddt, ordini, preventivi e contratti: l'avviso E_DOC_ANNULLO_CON_LEGAMI.
        Brief: brief-db-annullo-documento-con-legami (D-1, D-4, D-5).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_doc_guard_annullo_con_legami';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE TRIGGER trg_ddt_m10_guard_annullo_con_legami_upd
                  BEFORE UPDATE ON vendite.ddt
                  FOR EACH ROW
                  WHEN (OLD.stato_doc_ddt_id IS DISTINCT FROM NEW.stato_doc_ddt_id)
                  EXECUTE FUNCTION vendite.trgfn_doc_guard_annullo_con_legami(
                      'DDT', 'stato_doc_ddt_id', 'config.stati_doc_ddt');

              CREATE TRIGGER trg_ordini_m10_guard_annullo_con_legami_upd
                  BEFORE UPDATE ON vendite.ordini
                  FOR EACH ROW
                  WHEN (OLD.stato_doc_ordine_id IS DISTINCT FROM NEW.stato_doc_ordine_id)
                  EXECUTE FUNCTION vendite.trgfn_doc_guard_annullo_con_legami(
                      'ORDINE', 'stato_doc_ordine_id', 'config.stati_doc_ordini');

              CREATE TRIGGER trg_preventivi_m10_guard_annullo_con_legami_upd
                  BEFORE UPDATE ON vendite.preventivi
                  FOR EACH ROW
                  WHEN (OLD.stato_doc_preventivo_id IS DISTINCT FROM NEW.stato_doc_preventivo_id)
                  EXECUTE FUNCTION vendite.trgfn_doc_guard_annullo_con_legami(
                      'PREVENTIVO', 'stato_doc_preventivo_id', 'config.stati_doc_preventivi');

              CREATE TRIGGER trg_contratti_m10_guard_annullo_con_legami_upd
                  BEFORE UPDATE ON vendite.contratti
                  FOR EACH ROW
                  WHEN (OLD.stato_doc_contratto_id IS DISTINCT FROM NEW.stato_doc_contratto_id)
                  EXECUTE FUNCTION vendite.trgfn_doc_guard_annullo_con_legami(
                      'CONTRATTO', 'stato_doc_contratto_id', 'config.stati_doc_contratti');

              COMMENT ON TRIGGER trg_ddt_m10_guard_annullo_con_legami_upd ON vendite.ddt IS
                  'Avviso dell''annullo con legami (BB vendite.trgfn_doc_guard_annullo_con_legami): una bolla con legami (ordini, resi, righe di commessa NON_EMESSA) si annulla solo da vendite.fn_annulla_ddt, con conferma. Prende il posto della Regola 4 di vendite.trgfn_ddt_guard_transizione. 2026-10-11, brief-db-annullo-documento-con-legami.';
              COMMENT ON TRIGGER trg_ordini_m10_guard_annullo_con_legami_upd ON vendite.ordini IS
                  'Avviso dell''annullo con legami (BB vendite.trgfn_doc_guard_annullo_con_legami): un ordine con legami (righe di preventivo, offerta d''origine, righe di commessa NON_EMESSA) si annulla solo da vendite.fn_annulla_ordine, con conferma. 2026-10-11, brief-db-annullo-documento-con-legami.';
              COMMENT ON TRIGGER trg_preventivi_m10_guard_annullo_con_legami_upd ON vendite.preventivi IS
                  'Avviso dell''annullo con legami (BB vendite.trgfn_doc_guard_annullo_con_legami): un preventivo con righe di commessa NON_EMESSA si annulla solo da vendite.fn_annulla_preventivo, con conferma. 2026-10-11, brief-db-annullo-documento-con-legami.';
              COMMENT ON TRIGGER trg_contratti_m10_guard_annullo_con_legami_upd ON vendite.contratti IS
                  'Avviso dell''annullo con legami (BB vendite.trgfn_doc_guard_annullo_con_legami): un contratto con legami (offerta d''origine, righe di commessa NON_EMESSA) si annulla solo da vendite.fn_annulla_contratto, con conferma. 2026-10-11, brief-db-annullo-documento-con-legami.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_m10_guard_annullo_con_legami_upd ON vendite.ddt;
              DROP TRIGGER IF EXISTS trg_ordini_m10_guard_annullo_con_legami_upd ON vendite.ordini;
              DROP TRIGGER IF EXISTS trg_preventivi_m10_guard_annullo_con_legami_upd ON vendite.preventivi;
              DROP TRIGGER IF EXISTS trg_contratti_m10_guard_annullo_con_legami_upd ON vendite.contratti;
