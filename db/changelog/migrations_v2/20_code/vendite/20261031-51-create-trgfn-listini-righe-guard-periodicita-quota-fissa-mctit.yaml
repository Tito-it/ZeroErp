# LA QUOTA FISSA NON PERDE LA PERIODICITA' FUORI DALLA BOZZA: vendite.trgfn_listini_righe_guard_periodicita_quota_fissa
#   Brief: brief-db-contratto-righe-periodiche-in-commessa §7.10 (decisione di Tid del 2026-10-31,
#   sul trovato del §7.7).
#
# -- IL BUCO ------------------------------------------------------------------------------------
#   Una versione con una quota fissa a canone senza periodicita' non si attiva
#   (D-3, 20261031-39). Ma vendite.trgfn_listini_righe_guard_stato ammette in
#   ATTIVA la rettifica di una riga non propagata, e la periodicita' non e' nel
#   lucchetto: la quota poteva perderla dopo l'attivazione, e da li' ogni
#   contratto del listino restava in CANONE_NON_GENERABILE.
#
# -- LA REGOLA (Tid) ----------------------------------------------------------------------------
#   Fuori dalla bozza la riga di una quota fissa a canone
#   (vendite.fn_articolo_quota_fissa_a_canone, 20261031-49) non resta senza
#   periodicita': un UPDATE che la toglie si rifiuta
#   (E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA, col campo). Cambiarla con
#   un'altra resta una rettifica, come il prezzo: la regola di guard_stato non
#   cambia. In bozza tutto e' libero, e decide l'attivazione.
#   ⚠️ Resta una strada sola per una quota senza periodicita' su una versione
#   attiva: il catalogo che cambia dopo (la tipologia dell'articolo, o la sua
#   erogazione di default). La segnala la dashboard (SENZA_PERIODICITA), come
#   la quota che smette di essere un canone (QUOTA_FISSA_SENZA_CANONE).
#
#   Montaggio 20261031-52: BEFORE UPDATE OF periodicita, WHEN la periodicita'
#   va da un valore a NULL. Nessun altro trigger scrive listini_righe.periodicita
#   (UPDATE OF e' la forma giusta, linee-guida-trigger). Il nome viene dopo
#   _a10_guard_stato_upd_dlt: su una versione CHIUSA parla prima lei.
#   Funzione nuova: %TYPE, SECURITY INVOKER esplicito.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261031-51-create-trgfn-listini-righe-guard-periodicita-quota-fissa-mctit.yaml

  - changeSet:
      id: 20261031-51-create-trgfn-listini-righe-guard-periodicita-quota-fissa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_righe_guard_periodicita_quota_fissa: fuori dalla bozza la riga di una
        quota fissa a canone non resta senza periodicita'. Brief:
        brief-db-contratto-righe-periodiche-in-commessa §7.10.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('vendite.fn_articolo_quota_fissa_a_canone(uuid)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_periodicita_quota_fissa()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: fuori dalla bozza la riga di una quota fissa a canone non resta
              --   senza periodicita'. Regola completa nell'intestazione del changeSet
              --   20261031-51.
              DECLARE
                  v_stato    config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_versione vendite.listini_versioni.codice_versione%TYPE;
                  v_codice   catalogo.articoli.codice%TYPE;
              BEGIN
                  IF NEW.periodicita IS NOT NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.codice_interno, lv.codice_versione INTO v_stato, v_versione
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = NEW.listino_versione_id;

                  IF v_stato = 'BOZZA' OR NOT vendite.fn_articolo_quota_fissa_a_canone(NEW.articolo_id) THEN
                      RETURN NEW;
                  END IF;

                  SELECT a.codice INTO v_codice FROM catalogo.articoli a WHERE a.id = NEW.articolo_id;

                  PERFORM script.fn_log_and_raise_error(
                      'vendite', TG_NAME, 'E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA',
                      jsonb_build_object(
                          'campo',               'periodicita',
                          'listino_riga_id',     NEW.id,
                          'listino_versione_id', NEW.listino_versione_id,
                          'stato_versione',      v_stato),
                      NEW.tx_id,
                      COALESCE(v_codice, NEW.articolo_id::text),
                      COALESCE(v_versione, NEW.listino_versione_id::text));
                  RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_periodicita_quota_fissa() IS
                'Guard di vendite.listini_righe (BEFORE UPDATE OF periodicita, quando la periodicita'' va a NULL): fuori dalla bozza la riga di una quota fissa a canone (vendite.fn_articolo_quota_fissa_a_canone) non resta senza periodicita'' (E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA, campo periodicita). Cambiarla con un''altra resta una rettifica, come il prezzo (vendite.trgfn_listini_righe_guard_stato). Chiude il buco del controllo all''attivazione (D-3): senza, la quota la perdeva dopo, e ogni contratto del listino restava in CANONE_NON_GENERABILE. Nasce il 2026-10-31 (20261031-51), brief-db-contratto-righe-periodiche-in-commessa §7.10.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.trgfn_listini_righe_guard_periodicita_quota_fissa();
