# DB-11 — DICHIARARE LA DATA DI UN LOTTO
#   vendite.fn_imposta_data_documento_lotto(lotto, data)
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §4 DB-11
#
# ── E' UNA FUNZIONE «MADRE» ─────────────────────────────────────────
#   Compone QUATTRO scritture — la data sul lotto, la data sulle fatture, la
#   cancellazione e la riscrittura dei piani rate — e si invoca con una sola
#   `SELECT`. ⭐ Una singola istruzione su connessione in autocommit e' atomica
#   per costruzione: se il terzo passo fallisce, i primi due non restano
#   (linee-guida-sql §5b). Farle in sequenza dal backend lascerebbe una data
#   nuova con le rate vecchie, che e' esattamente il difetto da evitare.
#
# ── ⛔ IL PUNTO 4 NON E' OPZIONALE: LE RATE SI RIGENERANO ───────────
#   Le scadenze si calcolano da `f.data` (`v_data_rata := f.data + offset`) nello
#   step EMESSA, cioe' PRIMA del numero. Cambiare la data senza rigenerarle
#   produce scadenze sbagliate su un documento che il guard D-K lascia passare:
#   quel guard verifica che Σ rate = `totale_a_pagare`, e la SOMMA non cambia —
#   cambiano le DATE. Il difetto passerebbe in silenzio.
#
#   ⚠️ Ma si rigenera SOLO dove un piano esiste gia'. Una fattura in DRAFT senza
#   totali non ha rate e non deve averne: chiamarci sopra
#   `fn_genera_scadenze_fattura` alzerebbe `E_SCADENZE_BASE_NON_PRONTA` e farebbe
#   fallire l'intera dichiarazione su un caso legittimo. Se il piano non c'e'
#   ancora, lo step EMESSA lo creera' con la data nuova: non c'e' niente da
#   riparare. Misurato il 2026-08-25: 9 fatture su 18 hanno un piano rate.
#
# ── ⚠️ SI SALTANO LE NUMERATE, NON SI RIFIUTA IL LOTTO ─────────────
#   Il caso «lotto numerato a meta'» ESISTE nei dati: i lotti 4212 e 4213 hanno
#   fatture numerate in giorni diversi. Rifiutare l'intero lotto renderebbe
#   irrisolvibile proprio il caso per cui questa funzione esiste. Il conteggio
#   restituito lo dice al chiamante, che lo mostra.
#   ⭐ E il filtro e' `numero IS NULL`, non lo stato: una fattura viene numerata
#   MENTRE e' in EMESSA, quindi una soglia per stato lascerebbe passare una
#   numerata — che il guard di `20260825-15` rifiuterebbe, facendo fallire tutto.
#
# ── ℹ️ TRE NUMERI DI RITORNO, NON DUE ───────────────────────────────
#   Il brief ne chiedeva due (`aggiornate`, `saltate_numerate`). Il terzo —
#   `rate_rigenerate` — c'e' perche' senza di esso il punto 4 e' invisibile: il
#   backend non potrebbe dire all'operatore che i piani rate sono cambiati, ed e'
#   la conseguenza meno attesa dell'atto che ha appena compiuto.
#
# ── ℹ️ IL GUARD SUL PAVIMENTO E' UNA CORTESIA, NON IL PRESIDIO ──────
#   Si rifiuta subito una data sotto il minimo invece di lasciare che il rifiuto
#   arrivi a meta' giro di numerazione. ⚠️ Ma la lettura e' fail-open sotto RLS
#   (vedi 20260825-13): se sfugge, rifiutera' il cancello vero. Nessuna delle due
#   cose e' un buco — la seconda e' il presidio, questa e' la sua anticamera.
#
# ── ℹ️ COSA SCATTA SCRIVENDO ────────────────────────────────────────
#   Sul lotto: guard di perimetro emittente, audit, tx_id e STORICO (la
#   ridichiarazione di una data fiscale lascia traccia, ed e' voluto).
#   Sulle fatture: audit, tx_id, storico. ⚠️ Il guard di congelamento della
#   testata NON scatta: e' agganciato alle sole colonne snapshot.
#
# Dipendenze: 20260825-04 (data_documento sul lotto), 20260825-13 (il pavimento),
#             e il codice E_FATTURA_DATA_ANTERIORE_ULTIMO_NUMERO gia' a catalogo.
# Verifica: db/pgtap/vendite/test-registri-progressivi.sql (caso 8, DB-13)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260825-14-create-fn-imposta-data-documento-lotto-mctit.yaml

  - changeSet:
      id: 20260825-14-create-fn-imposta-data-documento-lotto
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-11: la madre che dichiara la data documento di un lotto. Scrive la data sul lotto e
        sulle fatture non ancora numerate, poi RIGENERA i piani rate — e il punto 4 non e'
        opzionale: le scadenze si calcolano da f.data prima del numero, e cambiare la data
        senza rigenerarle produce scadenze sbagliate che il guard D-K non vede (verifica la
        SOMMA, che non cambia). ⚠️ Si rigenera solo dove un piano esiste gia': su una DRAFT
        senza totali fn_genera_scadenze_fattura alzerebbe E_SCADENZE_BASE_NON_PRONTA e farebbe
        fallire un caso legittimo. ⚠️ Le fatture gia' numerate si SALTANO e si contano — il
        lotto numerato a meta' esiste nei dati (4212, 4213) e rifiutarlo renderebbe
        irrisolvibile il caso per cui la funzione esiste. Il filtro e' `numero IS NULL` e non
        lo stato: si numera MENTRE si e' in EMESSA.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti
                columnName: data_documento
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_get_data_minima_numerabile_lotto';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_imposta_data_documento_lotto(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                  p_data     vendite.fatturazione_lotti.data_documento%TYPE
              )
               RETURNS TABLE(aggiornate integer, saltate_numerate integer, rate_rigenerate integer)
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_pavimento  vendite.registri_fatturazione_progressivi.ultima_data%TYPE;
                  -- ⚠️ `bigint[]` esplicito: `colonna%TYPE[]` non esiste in PostgreSQL.
                  v_toccate    bigint[];
                  v_id         vendite.fatture.id%TYPE;
                  -- ⚠️ `integer` esplicito: sono CONTEGGI, non valori di colonna.
                  v_aggiornate integer := 0;
                  v_saltate    integer := 0;
                  v_rate       integer := 0;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dichiarare la data documento di un lotto: la scrive sul
                  --   lotto, la propaga alle fatture non ancora numerate e
                  --   rigenera i loro piani rate.
                  --
                  -- Regole:
                  --   - le fatture gia' numerate si SALTANO e si contano;
                  --   - le rate si rigenerano solo dove un piano esiste;
                  --   - una data sotto il pavimento del sezionale si rifiuta
                  --     subito, con lo stesso codice del cancello.
                  -- =========================================================

                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_imposta_data_documento_lotto',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object(
                              'detail', 'lotto_id obbligatorio e maggiore di zero',
                              'p_lotto_id', p_lotto_id),
                          NULL::uuid,
                          'vendite.fn_imposta_data_documento_lotto',
                          'p_lotto_id (obbligatorio, maggiore di zero)');
                  END IF;

                  IF p_data IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_imposta_data_documento_lotto',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object(
                              'detail', 'data documento obbligatoria',
                              'p_lotto_id', p_lotto_id),
                          NULL::uuid,
                          'vendite.fn_imposta_data_documento_lotto',
                          'p_data (obbligatorio)');
                  END IF;

                  -- Il lotto deve esistere ED essere visibile: sotto RLS le due
                  -- cose coincidono, e va bene cosi' — non si dichiara la data
                  -- di un lotto che non si puo' vedere.
                  PERFORM 1 FROM vendite.fatturazione_lotti fl WHERE fl.id = p_lotto_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_imposta_data_documento_lotto',
                          'E_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::text);
                  END IF;

                  -- ─── 1) IL PAVIMENTO ──────────────────────────────────────
                  -- ⭐ Stesso codice del cancello di fn_get_next_progressivo,
                  --    sollevato QUI e subito invece che a meta' giro di
                  --    numerazione. Non e' un secondo presidio: e' la sua
                  --    anticamera, e se sfugge (la lettura e' fail-open sotto
                  --    RLS) rifiutera' il cancello vero.
                  v_pavimento := vendite.fn_get_data_minima_numerabile_lotto(p_lotto_id);

                  IF v_pavimento IS NOT NULL AND p_data < v_pavimento THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_imposta_data_documento_lotto',
                          'E_FATTURA_DATA_ANTERIORE_ULTIMO_NUMERO',
                          jsonb_build_object(
                              'campo',          'data_documento',
                              'lotto_id',       p_lotto_id,
                              'ultima_data',    v_pavimento,
                              'data_richiesta', p_data,
                              -- ⭐ Qui il bersaglio e' il LOTTO: e' la cosa che
                              --    l'operatore ha davanti, e la fattura
                              --    colpevole non e' ancora stata scelta.
                              'bersaglio', jsonb_build_array(
                                  jsonb_build_object('tipo', 'LOTTO',
                                                     'id', p_lotto_id::text))),
                          NULL::uuid,
                          to_char(v_pavimento, 'DD/MM/YYYY'));
                  END IF;

                  -- ─── 2) QUANTE SI SALTANO ─────────────────────────────────
                  SELECT count(*)::integer
                    INTO v_saltate
                    FROM vendite.fatturazione_lotti_fatture lf
                    JOIN vendite.fatture f ON f.id = lf.fattura_id
                   WHERE lf.lotto_id = p_lotto_id
                     AND f.numero IS NOT NULL;

                  -- ─── 3) LA DATA SUL LOTTO ─────────────────────────────────
                  -- ⚠️ Anche se nessuna fattura si muove: la dichiarazione vale
                  --    per i documenti che il lotto produrra' dopo.
                  UPDATE vendite.fatturazione_lotti
                     SET data_documento = p_data
                   WHERE id = p_lotto_id
                     AND data_documento IS DISTINCT FROM p_data;

                  -- ─── 4) LA DATA SULLE FATTURE ─────────────────────────────
                  -- ⛔ Filtro su `numero IS NULL` e NON sullo stato: una fattura
                  --    viene numerata MENTRE e' in EMESSA, quindi una soglia per
                  --    stato lascerebbe passare una numerata — e il guard
                  --    trg_fatture_a10_guard_data_numerata_upd la rifiuterebbe,
                  --    facendo fallire l'intera dichiarazione.
                  -- ⚠️ Lo stato serve lo stesso, per non toccare documenti oltre
                  --    la finestra in cui le rate sono ancora rigenerabili.
                  -- ⚠️ `IS DISTINCT FROM`: senza, si riscriverebbe la stessa data
                  --    generando storico e audit per niente.
                  WITH aggiornate AS (
                      UPDATE vendite.fatture f
                         SET data = p_data
                       WHERE f.id IN (SELECT lf.fattura_id
                                        FROM vendite.fatturazione_lotti_fatture lf
                                       WHERE lf.lotto_id = p_lotto_id)
                         AND f.numero IS NULL
                         AND f.data IS DISTINCT FROM p_data
                         AND f.stato_doc_fiscale_id IN (
                                 SELECT sd.id FROM config.stati_doc_fiscale sd
                                  WHERE sd.codice_interno IN ('DRAFT', 'EMESSA'))
                      RETURNING f.id
                  )
                  SELECT array_agg(a.id), count(*)::integer
                    INTO v_toccate, v_aggiornate
                    FROM aggiornate a;

                  -- ─── 5) I PIANI RATE SEGUONO LA DATA ──────────────────────
                  -- ⛔ Non e' opzionale: le scadenze si calcolano da f.data, e il
                  --    guard D-K verifica la SOMMA delle rate, che non cambia —
                  --    quindi una data nuova con rate vecchie passa in silenzio.
                  -- ⚠️ Solo dove un piano ESISTE: su una DRAFT senza totali
                  --    fn_genera_scadenze_fattura alzerebbe
                  --    E_SCADENZE_BASE_NON_PRONTA e farebbe fallire un caso
                  --    legittimo. Se il piano non c'e', lo step EMESSA lo creera'
                  --    con la data nuova.
                  -- ⚠️ In un'istruzione SEPARATA dall'UPDATE qui sopra: dentro la
                  --    stessa, la snapshot leggerebbe la data VECCHIA.
                  FOREACH v_id IN ARRAY COALESCE(v_toccate, ARRAY[]::bigint[]) LOOP
                      IF EXISTS (SELECT 1 FROM vendite.fatture_scadenze s
                                  WHERE s.fattura_id = v_id) THEN
                          PERFORM vendite.fn_genera_scadenze_fattura(v_id);
                          v_rate := v_rate + 1;
                      END IF;
                  END LOOP;

                  RETURN QUERY SELECT COALESCE(v_aggiornate, 0), v_saltate, v_rate;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_imposta_data_documento_lotto(
                  vendite.fatturazione_lotti.id%TYPE, vendite.fatturazione_lotti.data_documento%TYPE)
                IS 'Dichiara la data documento di un lotto: la scrive sul lotto, la propaga alle fatture NON ancora numerate e rigenera i loro piani rate. ⭐ E'' una funzione MADRE — quattro scritture, una sola SELECT, atomica per costruzione (linee-guida-sql §5b): farle in sequenza dal backend lascerebbe una data nuova con le rate vecchie. ⛔ LA RIGENERAZIONE DELLE RATE NON E'' OPZIONALE: le scadenze si calcolano da f.data (v_data_rata := f.data + offset) nello step EMESSA, cioe'' PRIMA del numero, e il guard D-K verifica che la SOMMA delle rate quadri col totale — la somma non cambia, cambiano le DATE, quindi una data nuova con rate vecchie passerebbe in silenzio. ⚠️ Si rigenera SOLO dove un piano esiste gia'': su una fattura DRAFT senza totali fn_genera_scadenze_fattura alzerebbe E_SCADENZE_BASE_NON_PRONTA e farebbe fallire l''intera dichiarazione su un caso legittimo; se il piano non c''e'' ancora, lo step EMESSA lo creera'' con la data nuova. ⚠️ Le fatture GIA'' NUMERATE si SALTANO e si contano, non fanno fallire il lotto: il caso «lotto numerato a meta''» esiste nei dati (lotti 4212 e 4213, fatture numerate in giorni diversi) e rifiutare l''intero lotto renderebbe irrisolvibile proprio il caso per cui questa funzione esiste. ⛔ Il filtro e'' `numero IS NULL` e NON lo stato: una fattura viene numerata MENTRE e'' in EMESSA, quindi una soglia per stato lascerebbe passare una numerata e il guard trg_fatture_a10_guard_data_numerata_upd la rifiuterebbe. Lo stato serve comunque, per non toccare documenti oltre la finestra in cui le rate sono rigenerabili. ℹ️ Il guard sul pavimento solleva lo STESSO codice del cancello (E_FATTURA_DATA_ANTERIORE_ULTIMO_NUMERO) qui e subito, invece che a meta'' giro di numerazione: non e'' un secondo presidio, e'' la sua anticamera — la lettura e'' fail-open sotto RLS e se sfugge rifiutera'' il cancello vero. Il bersaglio e'' il LOTTO, che e'' la cosa che l''operatore ha davanti. ℹ️ Torna TRE numeri e non due: rate_rigenerate c''e'' perche'' senza di esso il punto 4 sarebbe invisibile al backend, ed e'' la conseguenza meno attesa dell''atto appena compiuto. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §4 DB-11.';

              GRANT EXECUTE ON FUNCTION vendite.fn_imposta_data_documento_lotto(
                  vendite.fatturazione_lotti.id%TYPE,
                  vendite.fatturazione_lotti.data_documento%TYPE) TO zeroerp_app;
              -- ⛔ 2026-09-02 — NIENTE GRANT AL RUOLO BATCH IN UN changeSet.
              --    In CI il ruolo `zeroerp_batch_fatturazione` non esiste ancora: il workflow
              --    lo provisiona DOPO le migrazioni standard (BYPASSRLS vuole superuser,
              --    quindi lo crea `postgres` e non Liquibase), e il migrate moriva con
              --    «role "zeroerp_batch_fatturazione" does not exist».
              --    ⭐ Ed era anche INUTILE: provision_db_role_batch_fatturazione.sql fa
              --    GRANT SELECT/EXECUTE ON ALL ... IN SCHEMA sui 14 schemi applicativi piu'
              --    ALTER DEFAULT PRIVILEGES, quindi l'oggetto e' coperto su ogni ambiente —
              --    anche se nasce dopo. Verificato: una funzione del 2026-08-31 senza nessun
              --    GRANT esplicito risponde gia' EXECUTE = true per quel ruolo.
              --    ⚠️ La regola era gia' scritta il 2026-07-27 in 20260727-21, dopo lo stesso
              --    guasto: «i privilegi dei ruoli batch stanno nel provisioning, mai in un
              --    changeSet». linee-guida-sql.md §11.6
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_imposta_data_documento_lotto(bigint, date);
