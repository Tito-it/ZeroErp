databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260210-17-update-fn-ricalcola-fattura-mctit.yaml

  - changeSet:
      id: 20260210-17-update-fn-ricalcola-fattura
      author: mctit
      comment: "Aggiorna wrapper ricalcolo fattura (void)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              DROP FUNCTION IF EXISTS vendite.fn_ricalcola_fattura(vendite.fatture.id%TYPE);

              CREATE OR REPLACE FUNCTION vendite.fn_ricalcola_fattura(
                p_fattura_id vendite.fatture.id%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              AS $$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Wrapper per ricalcolo riepiloghi IVA e totali testata.
                -- =========================================================

                PERFORM vendite.fn_ricalcola_riepilogo_iva_fattura(p_fattura_id);
                PERFORM vendite.fn_ricalcola_totali_fattura(p_fattura_id);
              END;
              $$;

              COMMENT ON FUNCTION vendite.fn_ricalcola_fattura(vendite.fatture.id%TYPE)
                IS 'Wrapper per ricalcolo riepiloghi IVA e totali testata.';
