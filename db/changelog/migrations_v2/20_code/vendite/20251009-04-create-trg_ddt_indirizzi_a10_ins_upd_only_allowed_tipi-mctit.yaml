databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20251009-03-create-trg_ddt_indirizzi_a10_ins_upd_only_allowed_tipi-mctit.yaml
  - changeSet:
      id: 20251009-03-create-trg_ddt_indirizzi_a10_ins_upd_only_allowed_tipi
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                -- Cancella precedente trigger
                DROP TRIGGER IF EXISTS trg_ddt_indirizzi_a10_ins_upd_only_allowed_tipi
                ON vendite.ddt_indirizzi;
                
                -- Cancella funzione precedente specifica per la tabella
                DROP FUNCTION IF EXISTS vendite.trgfn_ddt_indirizzi_only_allowed_tipi();

                -- Genera trigger con funzione parametrica
                 CREATE TRIGGER trg_ddt_indirizzi_a10_ins_upd_only_allowed_tipi
                    BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                    ON vendite.ddt_indirizzi
                    FOR EACH ROW
                    EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('DDT');