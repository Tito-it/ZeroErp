# P-16 — I QUATTRO GENERATORI SMETTONO DI NOMINARE IL CATALOGO
#   vendite.trgfn_ddt_gen_numero_emesso / trgfn_ordini_gen_numero /
#   trgfn_resi_gen_numero / fn_get_or_create_commessa  (COMMENT su tutti e
#   quattro, piu' il corpo di DDT e ordine)
#   Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-16
#
# ── ⛔ QUATTRO COMMENT CHE MENTONO, E UNO DENTRO IL CORPO ────────
#   Tutti e quattro dicono «di config.sistema_codici resta la sola LUNGHEZZA».
#   Era vero fino al 20260831-53, che ne ha tolto le quattro righe. Da allora
#   quella frase manda chi cerca la lunghezza a guardare una tabella dove non
#   c'e' piu' niente da guardare — e nel corpo del DDT c'e' anche un commento
#   che nomina la «riga 'ddt'» del catalogo, che non esiste.
#
# ── ⭐ PERCHE' VALE UN changeSet DEDICATO ────────────────────────
#   Un COMMENT sbagliato non produce un dato sbagliato, ma e' la prima cosa
#   che si legge quando si indaga su un numero storto. ⚠️ Ed e' esattamente
#   quello che e' successo: il difetto corretto dal 20260831-55 era descritto
#   come «gia' risolto» proprio da queste frasi.
#   ⇒ Un commento che descrive uno stato superato non e' rumore: e' una prova
#   falsa a favore dell'ipotesi sbagliata.
#
# ⚠️ DUE dei quattro vengono RISCRITTI — il DDT e l'ordine — e solo perche' la
#   frase sta anche nel CORPO. I corpi sono identici agli attuali tranne quel
#   blocco di commento: nessun cambio di comportamento.
# ⚠️ Gli altri due ricevono il solo COMMENT: sostituire una funzione per
#   cambiarne la descrizione sarebbe un rischio senza guadagno.
# ⚠️ Il presidio 10 di db/pgtap/vendite/test-documenti-numerazione-trasloco-v1.sql
#   cerca la LETTURA (`FROM config.sistema_codici`), non la parola. Vietare la
#   parola sembrava piu' severo, ma e' una regola che nessuno puo' rispettare:
#   queste stesse correzioni devono poter dire da dove veniva la lunghezza, o si
#   perde l'unica spiegazione del perche' la commessa aveva sette cifre.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260831-56-comment-generatori-formato-tutto-dal-registro-mctit.yaml

  - changeSet:
      id: 20260831-56-comment-generatori-formato-tutto-dal-registro
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        P-16: i quattro generatori smettono di nominare il catalogo dei formati. ⛔ Tutti e
        quattro i COMMENT dicevano «di config.sistema_codici resta la sola LUNGHEZZA» — vero fino
        al 20260831-53, che ne ha tolto le righe — e il corpo del DDT nominava perfino la «riga
        ''ddt''» di quel catalogo. ⭐ Un COMMENT sbagliato non produce un dato sbagliato, ma e'' la
        prima cosa che si legge quando si indaga su un numero storto: il difetto corretto dal
        20260831-55 era descritto come gia'' risolto proprio da queste frasi, cioe'' era una prova
        falsa a favore dell''ipotesi sbagliata. ⚠️ DDT e ordine vengono riscritti, perche'' la frase sta
        anche nel corpo; i corpi sono identici tranne quel commento. Gli altri due ricevono il
        solo COMMENT. ⚠️ Il presidio 10 del pgTAP del trasloco cerca la
        LETTURA, non la parola: vietare la parola impedirebbe a queste stesse correzioni di dire
        da dove veniva la lunghezza.
        Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-16.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                onFailMessage: >-
                  vendite.fn_assegna_numero_documento legge ancora config.sistema_codici: il
                  changeSet 20260831-55 non e' stato applicato, e questi COMMENT direbbero una
                  cosa che il codice non fa.
                sql: |
                  SELECT COUNT(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_assegna_numero_documento'
                     AND p.prosrc !~ 'FROM config\.sistema_codici';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- =========================================================
              -- 1) IL DDT — riscritto, perche' la frase falsa sta nel CORPO
              -- =========================================================
              -- ⚠️ Il corpo e' identico a quello vivo tranne il blocco di
              --   commento in testa: nessun cambio di comportamento.
              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_gen_numero_emesso()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato        config.stati_doc_ddt.codice_interno%TYPE;
                  v_emittente_sr vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE;
                  v_registro     vendite.registri_fatturazione.id%TYPE;
                  v_ass          record;
                  v_anno         vendite.ddt.anno%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Assegnare ddt.numero alla transizione a EMESSO,
                  --   prendendolo dal MOTORE DEI REGISTRI.
                  --
                  -- ⭐ rev 2026-08-31: qui resta il MOMENTO, e basta. Il
                  --   formato — prefisso, suffisso, lunghezza — viene TUTTO
                  --   dal registro, e la composizione dalla funzione centrale.
                  -- ⛔ config.sistema_codici non ha piu' una riga 'ddt': il
                  --   20260831-53 l'ha tolta insieme alle altre tre. I DEFAULT
                  --   con cui nasce un registro stanno in
                  --   vendite.famiglie_documento.
                  -- =========================================================

                  -- Gia' numerato -> no-op (immutabilita' da
                  -- trgfn_v_ddt_protect_num).
                  IF NEW.numero IS NOT NULL AND btrim(NEW.numero::text) <> '' THEN
                      RETURN NEW;
                  END IF;

                  -- Numero solo a EMESSO (no buchi da bozze DRAFT scartate).
                  SELECT sdd.codice_interno INTO v_stato
                    FROM config.stati_doc_ddt sdd
                   WHERE sdd.id = NEW.stato_doc_ddt_id;
                  IF v_stato IS DISTINCT FROM 'EMESSO' THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Due convenzioni per lo stesso emittente: il DDT porta
                  --   l'id di anagrafiche.emittenti_fiscali, il registro porta
                  --   il soggetto_ruolo. La traduzione e' 1:1
                  --   (uq_emittenti_fiscali_ruolo) e si fa qui, esplicita.
                  SELECT ef.soggetto_ruolo_id INTO v_emittente_sr
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = NEW.emittente_fiscale_id;

                  -- ⛔ L'INVOLUCRO, non il lettore: qui si SCRIVE, e un
                  --   emittente senza registro DDT deve fermare — non emettere
                  --   un documento senza sezionale.
                  -- ⭐ I SEI PASSI IN UNA CHIAMATA SOLA. Stavano qui e in altre tre
                  --   funzioni identiche: risolvere il registro, ricavare l'anno,
                  --   chiedere il progressivo, leggere il formato, comporre.
                  --   ⚠️ Una correzione alla composizione andava fatta in QUATTRO
                  --   posti, e chi ne dimenticava uno produceva un documento
                  --   formattato diverso dagli altri — che nessun vincolo respinge.
                  -- ⭐ Qui resta l'unica cosa che distingue davvero questo documento
                  --   dagli altri tre: il MOMENTO, cioe' i guard qui sopra.
                  SELECT * INTO v_ass
                    FROM vendite.fn_assegna_numero_documento(
                             p_famiglia_documento          => 'DDT',
                             p_emittente_soggetto_ruolo_id => v_emittente_sr,
                             p_data                        => NEW.data,
                             p_documento_id                => NEW.id,
                             p_utility_id                  => NEW.utility_id,
                                      p_serie              => NEW.serie,
                             p_corpo                       => NULL) v;

                  -- ⚠️ Le colonne si scrivono INSIEME: numero, anno, serie e registro
                  --   sono una cosa sola — la chiave del documento — e scriverne
                  --   una senza le altre lascia la riga a raccontare un sezionale
                  --   che non e' il suo.
                  NEW.registro_id := v_ass.registro_id;
                  NEW.anno        := v_ass.anno;
                  NEW.serie       := NULLIF(v_ass.serie, '');
                  NEW.numero      := v_ass.numero;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_gen_numero_emesso()
              IS 'Assegna il numero a il DDT alla transizione a EMESSO, chiamando vendite.fn_assegna_numero_documento. ⭐ rev 2026-08-31 (brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4): i SEI PASSI della numerazione — risolvere il registro, ricavare l''anno dalla data documento, chiedere il progressivo, leggere il formato, comporre — non stanno piu'' qui. Stavano qui E in altre tre funzioni identiche (DDT, ordini, resi, commessa), verificato il 2026-08-31: gli stessi sei passi, quattro volte. ⚠️ Una correzione alla composizione andava fatta in QUATTRO posti, e chi ne dimenticava uno produceva un difetto MUTO — un documento formattato diverso dagli altri, che nessun vincolo respinge. ⭐ QUI RESTA L''UNICA COSA CHE DISTINGUE DAVVERO QUESTO DOCUMENTO DAGLI ALTRI TRE: il MOMENTO. I guard di uscita anticipata decidono SE e QUANDO numerare, poi la chiamata fa il resto — centralizzare anche il momento avrebbe messo in una funzione comune la sola cosa che comune non e''. ⭐ IL FORMATO VIENE TUTTO DAL REGISTRO — prefisso, suffisso e lunghezza, in una lettura sola — e i DEFAULT con cui un registro nasce stanno in vendite.famiglie_documento. ⛔ config.sistema_codici NON C''ENTRA PIU'': il 20260831-53 ne ha tolto le righe di ddt, ordine, reso e commessa. ⚠️ Fino al 20260831-54 questa descrizione diceva che il catalogo dei formati «conserva la sola LUNGHEZZA»: era vero fino al 53, e nel frattempo la funzione centrale continuava a leggerla da li'' — zero righe, lunghezza NULL, 7 cifre a tutti (giusto per caso qui, sbagliato sulla commessa). Corretto dal 20260831-55, e questa frase resta a ricordare che un COMMENT superato e'' una prova falsa a favore dell''ipotesi sbagliata. ⚠️ Il separatore non si legge piu'': se serve, si scrive dentro il prefisso. ⚠️ Le colonne della chiave si scrivono INSIEME, perche'' sono una cosa sola: scriverne una senza le altre lascerebbe la riga a raccontare un sezionale che non e'' il suo. Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4 e P-16.';

              -- =========================================================
              -- 2) L'ORDINE — riscritto per la stessa ragione del DDT
              -- =========================================================
              -- ⚠️ Qui la frase non era falsa: «invece che dalla sequenza
              --   generica di config.sistema_codici» racconta cosa e' cambiato,
              --   ed e' storia vera. ⛔ Ma la dice al PRESENTE, di una tabella
              --   che per questa famiglia non ha piu' righe — ed e' proprio
              --   una frase al presente su uno stato superato che ha coperto
              --   per un'intera giornata il difetto del 20260831-55.
              -- ⭐ Si riscrive al passato, con la data del changeSet che ha
              --   tolto la riga: la storia resta, il presente diventa vero.
              CREATE OR REPLACE FUNCTION vendite.trgfn_ordini_gen_numero()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_emittente_sr vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE;
                  v_registro     vendite.registri_fatturazione.id%TYPE;
                  v_ass          record;
                  v_anno         vendite.ordini.anno%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Assegnare ordini.numero all'INSERT, prendendolo dal
                  --   MOTORE DEI REGISTRI. Fino al 2026-08-31 il numero veniva
                  --   dalla sequenza generica del catalogo dei formati, la cui
                  --   riga 'ordine' e' uscita col changeSet 20260831-53.
                  --
                  -- ⭐ Il MOMENTO non cambia: nessuno stato da guardare,
                  --   l'ordine nasce numerato. ⛔ E i buchi da bozza scartata
                  --   restano: e' la conseguenza dichiarata di quella scelta.
                  -- =========================================================

                  -- ⭐ Gia' numerato -> no-op. Serve a due cose: rispettare un
                  --   numero fornito da fuori, e rendere INNOCUA la finestra in
                  --   cui questo trigger convive con quello generico (il CSV
                  --   che lo spegne vive in 80_data, che gira dopo 20_code).
                  IF NEW.numero IS NOT NULL AND btrim(NEW.numero::text) <> '' THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Due convenzioni per lo stesso emittente: l'ordine porta
                  --   l'id di anagrafiche.emittenti_fiscali, il registro porta
                  --   il soggetto_ruolo. Traduzione 1:1, esplicita.
                  SELECT ef.soggetto_ruolo_id INTO v_emittente_sr
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = NEW.emittente_fiscale_id;

                  -- ⛔ L'involucro, non il lettore: qui si SCRIVE, e un
                  --   emittente senza registro ORDINE deve fermare.
                  -- ⭐ I SEI PASSI IN UNA CHIAMATA SOLA. Stavano qui e in altre tre
                  --   funzioni identiche: risolvere il registro, ricavare l'anno,
                  --   chiedere il progressivo, leggere il formato, comporre.
                  --   ⚠️ Una correzione alla composizione andava fatta in QUATTRO
                  --   posti, e chi ne dimenticava uno produceva un documento
                  --   formattato diverso dagli altri — che nessun vincolo respinge.
                  -- ⭐ Qui resta l'unica cosa che distingue davvero questo documento
                  --   dagli altri tre: il MOMENTO, cioe' i guard qui sopra.
                  SELECT * INTO v_ass
                    FROM vendite.fn_assegna_numero_documento(
                             p_famiglia_documento          => 'ORDINE',
                             p_emittente_soggetto_ruolo_id => v_emittente_sr,
                             p_data                        => NEW.data,
                             p_documento_id                => NEW.id,
                             p_utility_id                  => NEW.utility_id,
                                      p_serie              => NEW.serie,
                             p_corpo                       => NULL) v;

                  -- ⚠️ Le colonne si scrivono INSIEME: numero, anno, serie e registro
                  --   sono una cosa sola — la chiave del documento — e scriverne
                  --   una senza le altre lascia la riga a raccontare un sezionale
                  --   che non e' il suo.
                  NEW.registro_id := v_ass.registro_id;
                  NEW.anno        := v_ass.anno;
                  NEW.serie       := NULLIF(v_ass.serie, '');
                  NEW.numero      := v_ass.numero;

                  RETURN NEW;
              END;
              $function$;

              -- =========================================================
              -- 3) GLI ALTRI DUE — il solo COMMENT
              -- =========================================================
              COMMENT ON FUNCTION vendite.trgfn_ordini_gen_numero()
              IS 'Assegna il numero all''ordine alla creazione, chiamando vendite.fn_assegna_numero_documento. ⭐ rev 2026-08-31 (brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4): i SEI PASSI della numerazione — risolvere il registro, ricavare l''anno dalla data documento, chiedere il progressivo, leggere il formato, comporre — non stanno piu'' qui. Stavano qui E in altre tre funzioni identiche (DDT, ordini, resi, commessa), verificato il 2026-08-31: gli stessi sei passi, quattro volte. ⚠️ Una correzione alla composizione andava fatta in QUATTRO posti, e chi ne dimenticava uno produceva un difetto MUTO — un documento formattato diverso dagli altri, che nessun vincolo respinge. ⭐ QUI RESTA L''UNICA COSA CHE DISTINGUE DAVVERO QUESTO DOCUMENTO DAGLI ALTRI TRE: il MOMENTO. I guard di uscita anticipata decidono SE e QUANDO numerare, poi la chiamata fa il resto — centralizzare anche il momento avrebbe messo in una funzione comune la sola cosa che comune non e''. ⭐ IL FORMATO VIENE TUTTO DAL REGISTRO — prefisso, suffisso e lunghezza, in una lettura sola — e i DEFAULT con cui un registro nasce stanno in vendite.famiglie_documento. ⛔ config.sistema_codici NON C''ENTRA PIU'': il 20260831-53 ne ha tolto le righe di ddt, ordine, reso e commessa. ⚠️ Fino al 20260831-54 questa descrizione diceva che il catalogo dei formati «conserva la sola LUNGHEZZA»: era vero fino al 53, e nel frattempo la funzione centrale continuava a leggerla da li'' — zero righe, lunghezza NULL, 7 cifre a tutti (giusto per caso qui, sbagliato sulla commessa). Corretto dal 20260831-55. ⚠️ Il separatore non si legge piu'': se serve, si scrive dentro il prefisso. ⚠️ Le colonne della chiave si scrivono INSIEME, perche'' sono una cosa sola: scriverne una senza le altre lascerebbe la riga a raccontare un sezionale che non e'' il suo. Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4 e P-16.';

              COMMENT ON FUNCTION vendite.trgfn_resi_gen_numero()
              IS 'Assegna il numero a il reso alla transizione a CONFERMATO, chiamando vendite.fn_assegna_numero_documento. ⭐ rev 2026-08-31 (brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4): i SEI PASSI della numerazione — risolvere il registro, ricavare l''anno dalla data documento, chiedere il progressivo, leggere il formato, comporre — non stanno piu'' qui. Stavano qui E in altre tre funzioni identiche (DDT, ordini, resi, commessa), verificato il 2026-08-31: gli stessi sei passi, quattro volte. ⚠️ Una correzione alla composizione andava fatta in QUATTRO posti, e chi ne dimenticava uno produceva un difetto MUTO — un documento formattato diverso dagli altri, che nessun vincolo respinge. ⭐ QUI RESTA L''UNICA COSA CHE DISTINGUE DAVVERO QUESTO DOCUMENTO DAGLI ALTRI TRE: il MOMENTO. I guard di uscita anticipata decidono SE e QUANDO numerare, poi la chiamata fa il resto — centralizzare anche il momento avrebbe messo in una funzione comune la sola cosa che comune non e''. ⭐ IL FORMATO VIENE TUTTO DAL REGISTRO — prefisso, suffisso e lunghezza, in una lettura sola — e i DEFAULT con cui un registro nasce stanno in vendite.famiglie_documento. ⛔ config.sistema_codici NON C''ENTRA PIU'': il 20260831-53 ne ha tolto le righe di ddt, ordine, reso e commessa. ⚠️ Fino al 20260831-54 questa descrizione diceva che il catalogo dei formati «conserva la sola LUNGHEZZA»: era vero fino al 53, e nel frattempo la funzione centrale continuava a leggerla da li'' — zero righe, lunghezza NULL, 7 cifre a tutti (giusto per caso qui, sbagliato sulla commessa). Corretto dal 20260831-55. ⚠️ Il separatore non si legge piu'': se serve, si scrive dentro il prefisso. ⚠️ Le colonne della chiave si scrivono INSIEME, perche'' sono una cosa sola: scriverne una senza le altre lascerebbe la riga a raccontare un sezionale che non e'' il suo. Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4 e P-16.';

              COMMENT ON FUNCTION vendite.fn_get_or_create_commessa(anagrafiche.billing_account.id%TYPE, config.utilities.id%TYPE, vendite.commesse.tipo_commessa%TYPE, vendite.commesse.policy_fatturazione%TYPE, vendite.commesse.fatturazione_immediata%TYPE, vendite.commesse.priorita_operativa%TYPE, date, date, jsonb, boolean, config.termini_pagamento.id%TYPE, config.modalita_pagamento.id%TYPE)
              IS 'Trova o crea la commessa di un billing account, componendone il codice come <prefisso><sigla emittente>-<anno>-<progressivo><suffisso>. ⭐ rev 2026-08-31 (brief-db-prefisso-sul-registro-e-allineamento-contatori, P-5): chiama vendite.fn_assegna_numero_documento come DDT, ordini e resi, invece di rifare per conto proprio i sei passi della numerazione. ⭐ CI STA DENTRO GRAZIE AL PARAMETRO `corpo`: il codice commessa porta sigla e anno DENTRO la stringa — e'' l''unico dei cinque la cui IDENTITA'' e'' la stringa nuda, perche'' uq_commesse_codice guarda quella e non una quadrupla di colonne — quindi passa quei due pezzi come corpo, che per gli altri tre e'' vuoto. ⭐ PREFISSO, SUFFISSO e LUNGHEZZA vengono TUTTI dal REGISTRO (decisione di Tid, 2026-08-31: «cosi'' diventa parametrizzabile anche quello», e il suffisso «come standard» insieme agli altri); i DEFAULT con cui un registro nasce stanno in vendite.famiglie_documento, che per la commessa dichiara 9 cifre contro le 7 degli altri. ⛔ config.sistema_codici NON C''ENTRA PIU'': il 20260831-53 ne ha tolto le righe. ⚠️ ED E'' PROPRIO QUI CHE SI E'' VISTO IL DANNO: fino al 20260831-54 la funzione centrale leggeva la lunghezza da quel catalogo, e tolte le righe la trovava NULL — 7 cifre a tutti, cioe'' giusto per caso su DDT, ordini e resi e SBAGLIATO su questa commessa (CMM-ACME-2026-0000007 invece di CMM-ACME-2026-000000007), senza nessun errore. Corretto dal 20260831-55. ⚠️ IL SEPARATORE si e'' sdoppiato, ed e'' la parte che si dimentica: quello FRA I PEZZI del corpo (sigla-anno-) e'' del DOMINIO commessa e vive qui; quello davanti al prefisso NON ESISTE PIU'' — se serve si scrive dentro il prefisso del registro (''CMM-''). ⛔ Cosi'' sparisce un caso speciale che la commessa aveva e gli altri no: un prefisso vuoto le lasciava un separatore ORFANO in testa (`-ACME-2026-000000001`), che spezzato sul trattino dava un primo pezzo VUOTO. ⚠️ La data e'' quella di CREAZIONE (script.fn_data_operativa(), mai now() nudo), perche'' la commessa non ha una data documento — ed e'' il motivo per cui il cancello di monotonia non puo'' morderla. Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-5 e P-16.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              SELECT 'Rollback non previsto: rimetterebbe quattro descrizioni che nominano un catalogo dove non c''e'' piu'' niente da leggere.'::text;
