# ------------------------------------------------------------
# Aggancio trigger whitelist a10 su vendite.offerte_commerciali_indirizzi
# con ambito 'OFFERTE' (funzione parametrica condivisa).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260711-22-create-trg-offerte-commerciali-indirizzi-only-allowed-mctit.yaml

  - changeSet:
      id: 20260711-22-create-trg-offerte-commerciali-indirizzi-only-allowed
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_commerciali_indirizzi_a10_ins_upd_only_allowed_tipi
                ON vendite.offerte_commerciali_indirizzi;

              CREATE TRIGGER trg_offerte_commerciali_indirizzi_a10_ins_upd_only_allowed_tipi
                BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                ON vendite.offerte_commerciali_indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('OFFERTE');
