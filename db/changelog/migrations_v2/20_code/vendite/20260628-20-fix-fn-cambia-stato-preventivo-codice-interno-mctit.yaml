# Copyright (C) 2026 Tid (Michele Carlo Titini)
#
# Fix hardcode codice -> codice_interno (analisi-hardcoded-codice.md §3a #1, lotto C).
#
# State-machine entrypoint dei preventivi: l'intero corpo confronta lo stato per
# `codice` (mutabile). Correzione a corpo intero (non solo la riga del lookup):
#   PRIMA:
#     DECLARE v_stato_corrente_cod config.stati_doc_preventivi.codice%TYPE
#     SELECT sdp.codice INTO v_stato_corrente_cod         (stato corrente)
#     WHERE codice = p_nuovo_stato                        (risoluzione destinazione)
#   DOPO: tutto su `codice_interno` (immutabile).
# INVARIATI: i literali DRAFT/EMESSO/ANNULLATO (sono codice_interno) e la matrice
#   transizioni (lavora per id). Pre-check seed: codice == codice_interno -> zero-risk.
#
# IMPATTO SEMANTICO: il RETURNS (stato_precedente/stato_nuovo) ora espone il
#   codice_interno (identificatore immutabile di sistema), non piu' il codice
#   display. Valori odierni identici (codice == codice_interno). Coordinamento BE:
#   p_nuovo_stato deve viaggiare come codice_interno (oggi gia' cosi' di fatto).
#
# Convenzione %TYPE (richiesta Tid): firma e RETURNS a %TYPE (p_nuovo_stato e gli
#   stati di ritorno -> config.stati_doc_preventivi.codice_interno%TYPE; id ->
#   vendite.preventivi.id%TYPE). Tipi verificati 1:1 (codice_interno = character
#   varying), nessun cambio di return type.
# CREATE OR REPLACE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260628-20-fix-fn-cambia-stato-preventivo-codice-interno-mctit.yaml

  - changeSet:
      id: 20260628-20-fix-fn-cambia-stato-preventivo-codice-interno
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_cambia_stato_preventivo: stato corrente e destinazione risolti per
        codice_interno (immutabile) su tutto il corpo + firma/RETURNS a %TYPE. Fix §3a #1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cambia_stato_preventivo(
                  p_preventivo_id vendite.preventivi.id%TYPE,
                  p_nuovo_stato   config.stati_doc_preventivi.codice_interno%TYPE,
                  p_user          text)
               RETURNS TABLE(
                  preventivo_id    vendite.preventivi.id%TYPE,
                  stato_precedente config.stati_doc_preventivi.codice_interno%TYPE,
                  stato_nuovo      config.stati_doc_preventivi.codice_interno%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente_id   vendite.preventivi.stato_doc_preventivo_id%TYPE;
                v_stato_corrente_cod  config.stati_doc_preventivi.codice_interno%TYPE;
                v_nuovo_stato_id      config.stati_doc_preventivi.id%TYPE;
                v_transizione_ok      boolean;
                v_count_righe         bigint;
                v_totale_doc          vendite.preventivi.totale_documento%TYPE;
                v_has_commessa        boolean;
                v_numero              vendite.preventivi.numero%TYPE;
                v_uid                 vendite.preventivi.uid%TYPE;
              BEGIN
                -- ==========================================================
                -- Scopo:
                --   Eseguire la transizione di stato di un preventivo vendita,
                --   validando la transizione tramite la matrice configurabile
                --   config.transizioni_stati_preventivi.
                --
                -- Regole:
                --   - La transizione deve essere presente e attiva nella matrice
                --   - DRAFT → EMESSO: richiede almeno una riga attiva con qta > 0
                --     e totale_documento > 0
                --   - Verso ANNULLATO: blocco duro se il preventivo ha righe
                --     gia' inviate in commessa (stato_emissione EMESSA)
                --
                -- Parametri:
                --   p_preventivo_id : ID del preventivo
                --   p_nuovo_stato   : codice_interno dello stato destinazione
                --   p_user          : utente che esegue la transizione
                --
                -- Ritorna:
                --   preventivo_id, stato_precedente (codice_interno), stato_nuovo (codice_interno)
                --
                -- NOTE codice_interno (rev 2026-06-28, analisi-hardcoded-codice §3a #1):
                --   stato corrente e destinazione risolti per codice_interno
                --   (immutabile), non per codice (mutabile). Literali DRAFT/EMESSO/
                --   ANNULLATO sono codice_interno.
                -- ==========================================================

                -- Guard: parametri obbligatori
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('param', 'p_preventivo_id', 'value', p_preventivo_id),
                    NULL::uuid,
                    'p_preventivo_id = ' || COALESCE(p_preventivo_id::text, 'NULL')
                  );
                END IF;

                -- Recupera stato corrente, numero e uid in una sola query
                SELECT p.stato_doc_preventivo_id, sdp.codice_interno, p.numero, p.uid
                  INTO v_stato_corrente_id, v_stato_corrente_cod, v_numero, v_uid
                  FROM vendite.preventivi p
                  JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                 WHERE p.id = p_preventivo_id;

                IF v_stato_corrente_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'PREV_STATO_CORRENTE_NON_TROVATO',
                    jsonb_build_object('preventivo_id', p_preventivo_id),
                    NULL::uuid,
                    p_preventivo_id::text
                  );
                END IF;

                -- Recupera ID dello stato destinazione
                SELECT id INTO v_nuovo_stato_id
                  FROM config.stati_doc_preventivi
                 WHERE codice_interno = p_nuovo_stato AND attivo IS TRUE;

                IF v_nuovo_stato_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'E_STATO_SCONOSCIUTO',
                    jsonb_build_object('codice', p_nuovo_stato),
                    NULL::uuid,
                    p_nuovo_stato
                  );
                END IF;

                -- Valida transizione via matrice config
                SELECT EXISTS(
                  SELECT 1
                    FROM config.transizioni_stati_preventivi t
                   WHERE t.stato_da_id = v_stato_corrente_id
                     AND t.stato_a_id  = v_nuovo_stato_id
                     AND t.attivo IS TRUE
                ) INTO v_transizione_ok;

                IF NOT v_transizione_ok THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_cambia_stato_preventivo',
                    'PREV_TRANSIZIONE_NON_AMMESSA',
                    jsonb_build_object(
                      'preventivo_id', p_preventivo_id,
                      'stato_da', v_stato_corrente_cod,
                      'stato_a', p_nuovo_stato
                    ),
                    NULL::uuid,
                    v_stato_corrente_cod, p_nuovo_stato
                  );
                END IF;

                -- Guard DRAFT → EMESSO: almeno una riga attiva con quantita > 0
                IF v_stato_corrente_cod = 'DRAFT' AND p_nuovo_stato = 'EMESSO' THEN
                  SELECT COUNT(*)
                    INTO v_count_righe
                    FROM vendite.preventivi_righe pr
                   WHERE pr.preventivo_id = p_preventivo_id
                     AND pr.attivo IS TRUE
                     AND pr.quantita > 0;

                  IF v_count_righe = 0 THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_cambia_stato_preventivo',
                      'PREV_NESSUNA_RIGA_ATTIVA',
                      jsonb_build_object('preventivo_id', p_preventivo_id),
                      NULL::uuid,
                      v_numero
                    );
                  END IF;

                  -- Guard: totale_documento > 0
                  SELECT p.totale_documento
                    INTO v_totale_doc
                    FROM vendite.preventivi p
                   WHERE p.id = p_preventivo_id;

                  IF COALESCE(v_totale_doc, 0) <= 0 THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_cambia_stato_preventivo',
                      'PREV_TOTALE_NON_POSITIVO',
                      jsonb_build_object(
                        'preventivo_id', p_preventivo_id,
                        'totale_documento', v_totale_doc
                      ),
                      NULL::uuid,
                      v_numero, COALESCE(v_totale_doc, 0)::text
                    );
                  END IF;
                END IF;

                -- Guard verso ANNULLATO: blocco se righe in commessa attive.
                -- Usa v_uid gia' caricato e starts_with() (PG 18, index-friendly).
                IF p_nuovo_stato = 'ANNULLATO' THEN
                  SELECT EXISTS(
                    SELECT 1
                      FROM vendite.commesse_attivita ca
                     WHERE starts_with(ca.segment_key, 'PREV:' || v_uid::text || ':R:')
                       AND ca.stato_emissione = 'EMESSA'
                  ) INTO v_has_commessa;

                  IF v_has_commessa THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_cambia_stato_preventivo',
                      'PREV_ANNULLAMENTO_COMMESSA_ATTIVA',
                      jsonb_build_object('preventivo_id', p_preventivo_id),
                      NULL::uuid,
                      v_numero
                    );
                  END IF;
                END IF;

                -- Esecuzione: aggiorna stato
                UPDATE vendite.preventivi
                   SET stato_doc_preventivo_id = v_nuovo_stato_id,
                       user_update = COALESCE(p_user, CURRENT_USER)
                 WHERE id = p_preventivo_id;

                -- Ritorna risultato
                RETURN QUERY
                SELECT p_preventivo_id, v_stato_corrente_cod, p_nuovo_stato;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_cambia_stato_preventivo(p_preventivo_id bigint, p_nuovo_stato character varying, p_user text)
              IS 'Transizione di stato preventivo validata dalla matrice config.transizioni_stati_preventivi. Guard DRAFT->EMESSO (righe+totale) e verso ANNULLATO (no commessa EMESSA). Stato corrente/destinazione e RETURNS per codice_interno (immutabile). rev 2026-06-28: analisi-hardcoded-codice §3a #1.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: ri-applicare la definizione autogen antecedente a
              -- 20260628-20 (stato per `codice`). Non duplicata qui.
              SELECT 1;
