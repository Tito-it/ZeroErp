# vendite: «OGGI» E' IL GIORNO DELL'AZIENDA, NON QUELLO DELLA SESSIONE
#   brief-be-db-fe-un-solo-fuso-aziendale §5.1 D-3.
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   CURRENT_DATE e' il giorno nel fuso della SESSIONE che esegue, e le
#   sessioni non hanno tutte lo stesso fuso: il backend si connette in UTC,
#   psql/Liquibase/pgAgent nel fuso del server. Fra la mezzanotte dell'azienda
#   e quella della sessione, la stessa funzione risponde un giorno diverso
#   secondo chi la chiama: una data documento di ieri, un guard di validita'
#   che scatta o non scatta. Non dipende dai dati: e' la struttura, e vale per
#   ogni installazione il cui fuso non coincide con quello della sessione.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Ogni CURRENT_DATE di codice diventa script.fn_data_operativa() (il giorno
#   nel fuso di SYSTEM_FUSO_ORARIO, letto dalla sede unica
#   script.fn_fuso_operativo, 20261009-40/41). Tre forme, scelte dal posto:
#   - in un'istruzione SQL (WHERE, SELECT, VALUES, SQL dinamico):
#     `(SELECT script.fn_data_operativa())` — la sottoquery scalare e'
#     valutata UNA volta per istruzione, non per riga (misurato su
#     zeroerp_ci il 2026-10-09: 20.000 righe, 122 ms per riga contro 2 ms);
#   - in un'espressione PL/pgSQL (`:=`, IF, RETURN) la chiamata diretta,
#     valutata una volta;
#   - nel DEFAULT di un parametro la chiamata diretta: li' una sottoquery non
#     e' ammessa.
#   I commenti che citano CURRENT_DATE restano: raccontano la regola di prima.
#
# ── COSA NON CAMBIA ─────────────────────────────────────────────────
#   Firme, tipi, volatilita', sicurezza, commenti e GRANT delle funzioni (il
#   CREATE OR REPLACE li conserva). Il corpo e' quello vivo, preso da
#   pg_get_functiondef su zeroerp_ci il 2026-10-09 e confrontato con la doc
#   auto-generata (identici), con la sola sostituzione di CURRENT_DATE.
#
# ── %TYPE: FIRMA, RETURNS TABLE, DECLARE ───────────────────────────
#   Il corpo vivo (pg_get_functiondef) scioglie i %TYPE della firma: quelli
#   gia' scritti nell'ultimo changeSet di ogni funzione sono stati RIPRESI
#   (anche nel rollback), e in questo giro si sono ancorati i parametri, le
#   colonne di RETURNS TABLE e le variabili che riflettono una colonna.
#   Verificato in transazione annullata su zeroerp_ci: argomenti e risultato
#   di ogni funzione restano byte-identici (nessun overload, nessun chiamante
#   rotto). Restano a TIPO ESPLICITO, perche' non sono il riflesso di nessuna
#   colonna, le voci elencate sotto per funzione: contatori, interruttori del
#   chiamante, jsonb e testi di lavoro, valori calcolati o costanti tipizzate,
#   chiavi polimorfe, il giorno operativo.
#
# ── FUNZIONI (21) ──────────────────────────────────────────────
#     - vendite.fn_accredita_riga_reso — tipo esplicito: v_progressivo,
#         v_is_new
#     - vendite.fn_aggiungi_onere_commessa — tipo esplicito: p_motivo,
#         v_progressivo, v_is_new
#     - vendite.fn_crea_revisione_preventivo — tipo esplicito: v_has_draft
#     - vendite.fn_espandi_listino_versione — tipo esplicito: componenti
#     - vendite.fn_genera_ddt_da_ordine — tipo esplicito: p_righe,
#         v_residuo_base, v_qta_op, v_n_evase, v_bersagli
#     - vendite.fn_genera_ddt_riconsegna — tipo esplicito: p_righe,
#         v_residuo_ric, v_qta_ric, v_qta_op, v_n
#     - vendite.fn_list_contratti_da_pushare — tipo esplicito: p_limit,
#         emittente_soggetto_ruolo_id, sorgente_uid, segment_key,
#         data_attivita, prezzo_bloccato, pricing_mode, tipo_movimento,
#         valuta_id, meta, termine_pagamento_id, modalita_pagamento_id.
#         emittente, segment_key, sorgente_uid, data_attivita, meta,
#         prezzo_bloccato, pricing_mode e tipo_movimento sono CALCOLATI o
#         costanti; valuta, termine e modalita' di pagamento sono NULL
#         tipizzati
#     - vendite.fn_listino_versione_operativa — tutto ancorato
#     - vendite.fn_push_preventivo_a_ordine — tipo esplicito: p_righe_ids,
#         v_bersagli, v_n_residue, v_overrides
#     - vendite.fn_select_attivita_fatturabili — tipo esplicito: p_lock,
#         p_limit, p_gruppi, v_where, v_join, v_limit, v_sql
#     - vendite.fn_situazione_merce_ordine — tipo esplicito: p_ddt_ids,
#         p_ordine_ids, consegnato, reso, in_riconsegna, tenuti,
#         fatturato_merce, fatturato_da_ordine, fatturato,
#         fatturato_anticipato, da_spedire, partite_merce, misurabile,
#         differenza, stato, giorni_ritardo. le quantita' e lo stato sono
#         AGGREGATI e derivati, non colonne
#     - vendite.fn_sync_contabili_fondo_fattura — tipo esplicito:
#         inserted_righe, updated_righe, annullati_source, v_inserted,
#         v_updated, v_annullati
#     - vendite.trgfn_contratti_guard_transizione_stato — tipo esplicito:
#         v_ammessa
#     - vendite.trgfn_contratti_normalize — tutto ancorato
#     - vendite.trgfn_ddt_normalize — tutto ancorato
#     - vendite.trgfn_event_log_deriva_scope — tipo esplicito: v_modo,
#         v_ammessi
#     - vendite.trgfn_listini_versioni_guard_transizione_stato — tipo
#         esplicito: v_ammessa
#     - vendite.trgfn_ordini_normalize — tutto ancorato
#     - vendite.trgfn_preventivi_normalize — tutto ancorato
#     - vendite.trgfn_promo_articoli_guard_data_driven — tipo esplicito:
#         v_today
#     - vendite.trgfn_resi_normalize — tutto ancorato
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261009-50-update-oggi-dal-fuso-aziendale-vendite-mctit.yaml

  - changeSet:
      id: 20261009-50-update-oggi-dal-fuso-aziendale-vendite
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite: CURRENT_DATE -> script.fn_data_operativa() in 21 funzioni, perche'
        «oggi» e' il giorno dell'azienda (SYSTEM_FUSO_ORARIO) e non quello della sessione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 22
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE (n.nspname = 'vendite' AND p.proname IN ('fn_accredita_riga_reso', 'fn_aggiungi_onere_commessa', 'fn_crea_revisione_preventivo', 'fn_espandi_listino_versione', 'fn_genera_ddt_da_ordine', 'fn_genera_ddt_riconsegna', 'fn_list_contratti_da_pushare', 'fn_listino_versione_operativa', 'fn_push_preventivo_a_ordine', 'fn_select_attivita_fatturabili', 'fn_situazione_merce_ordine', 'fn_sync_contabili_fondo_fattura', 'trgfn_contratti_guard_transizione_stato', 'trgfn_contratti_normalize', 'trgfn_ddt_normalize', 'trgfn_event_log_deriva_scope', 'trgfn_listini_versioni_guard_transizione_stato', 'trgfn_ordini_normalize', 'trgfn_preventivi_normalize', 'trgfn_promo_articoli_guard_data_driven', 'trgfn_resi_normalize'))
                  OR (n.nspname = 'script' AND p.proname = 'fn_fuso_operativo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_accredita_riga_reso(p_resi_riga_id vendite.resi_righe.id%TYPE)
               RETURNS TABLE(accredito_id vendite.resi_righe_accrediti.id%TYPE, commessa_attivita_id vendite.commesse_attivita.id%TYPE, fattura_riga_rettificata_id vendite.fatture_righe.id%TYPE, qta vendite.resi_righe_accrediti.qta%TYPE, qta_partita vendite.resi_righe_accrediti.qta_partita%TYPE)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: madre DB del verbo «accredita». Dalla coda accrediti
              --   genera le righe di RETTIFICA in commessa (quantita'
              --   NEGATIVA, prezzo copiato dalla riga di fattura) e le
              --   registra sul ponte vendite.resi_righe_accrediti.
              -- Perimetro: una sola unita' atomica (la chiamata). Riusa
              --   fn_upsert_commessa_attivita per non duplicarne il mapping.
              --   Il documento NON nasce qui: nasce nel giro di fatturazione,
              --   ed e' il motivo per cui un esito parziale del fan-out non
              --   lascia mai mezzo documento.
              -- Il presidio permessi (post_permission) vive sul BE, non qui:
              --   la madre deve restare usabile da un processo autorizzato.
              DECLARE
                  v_coda            record;
                  -- D3 (2026-09-21): il DDT della riga resa e' il SEME della coda.
                  v_ddt_id          vendite.ddt.id%TYPE;
                  v_grp             record;
                  v_cmp             record;
                  v_ddt_uid         vendite.ddt.uid%TYPE;
                  v_ordine_uid      vendite.ordini.uid%TYPE;
                  v_seg_ddt         vendite.commesse_attivita.segment_key%TYPE;
                  v_seg_ord         vendite.commesse_attivita.segment_key%TYPE;
                  v_natura_nc       config.nature_doc_fiscale.id%TYPE;
                  -- Residuo e quota si misurano in unita' di MERCE, il valore
                  -- documentale in unita' di RIGA DI FATTURA: due colonne
                  -- diverse, due ancoraggi diversi. Non e' pedanteria — e'
                  -- la distinzione che il kit rende necessaria.
                  v_residuo         vendite.resi_righe_accrediti.qta_partita%TYPE;
                  v_quota           vendite.resi_righe_accrediti.qta_partita%TYPE;
                  v_qta_doc         vendite.resi_righe_accrediti.qta%TYPE;
                  -- ⚠️ `integer` esplicito: il progressivo del suffisso #RET
                  --    e' un contatore, non il valore di una colonna. Non c'e'
                  --    nulla da ancorare, e va detto invece di sembrare
                  --    una dimenticanza.
                  v_progressivo     integer;
                  v_segment_key     vendite.commesse_attivita.segment_key%TYPE;
                  v_attivita_id     vendite.commesse_attivita.id%TYPE;
                  v_is_new          boolean;
                  v_accredito_id    vendite.resi_righe_accrediti.id%TYPE;
                  v_data            vendite.commesse_attivita.data_attivita%TYPE;
              BEGIN
                  -- --------------------------------------------------
                  -- 1) Guard sul parametro (AGENTS.md: NULL o <=0 ->
                  --    errore parlante, mai normalizzazione silenziosa).
                  -- --------------------------------------------------
                  IF p_resi_riga_id IS NULL OR p_resi_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_accredita_riga_reso','E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro','resi_riga_id','valore',p_resi_riga_id),
                          NULL::uuid, 'resi_riga_id obbligatorio (>0)');
                  END IF;

                  -- --------------------------------------------------
                  -- 2) La riga dev'essere IN CODA. Non e' un filtro di
                  --    comodo: e' la coda a dire quanto vale l'accredito
                  --    (D-NC-6), e fuori di li' quel numero non esiste.
                  --    ⭐ D3 (2026-09-21, D14 giro 2): la coda si chiede
                  --    PER DOCUMENTO — fn_resi_da_accreditare col seme
                  --    del DDT della riga resa — e non piu' alla vista,
                  --    che e' la coda di TUTTI. Il DDT si legge prima:
                  --    se la riga non c'e' (o chi agisce non la vede,
                  --    RLS) v_ddt_id e' NULL, ARRAY[NULL] semina zero
                  --    righe e si cade nel NOT FOUND qui sotto, come
                  --    prima. ⛔ Non e' un array NULL: quello sarebbe
                  --    «tutta la coda».
                  -- --------------------------------------------------
                  SELECT dr.ddt_id INTO v_ddt_id
                    FROM vendite.resi_righe rr
                    JOIN vendite.ddt_righe dr ON dr.id = rr.ddt_riga_id
                   WHERE rr.id = p_resi_riga_id;

                  SELECT q.resi_riga_id, q.ddt_riga_id, q.ordine_riga_id,
                         q.accredito_dovuto, q.etichetta
                    INTO v_coda
                    FROM vendite.fn_resi_da_accreditare(ARRAY[v_ddt_id], NULL::bigint[]) q
                   WHERE q.resi_riga_id = p_resi_riga_id;

                  IF NOT FOUND OR COALESCE(v_coda.accredito_dovuto, 0) <= 0 THEN
                      -- Stesso cancello, due messaggi: «l'hai gia' fatto» dice
                      -- una cosa diversa da «non c'e' niente da accreditare»,
                      -- e chi clicca due volte merita il primo.
                      -- ⚠️ Il presidio VERO e' che la riga esce dalla coda AL
                      --    VERBO: la coda (fn_resi_da_accreditare) sottrae la quota gia'
                      --    accreditata, quindi non serve un flag da mantenere
                      --    ne' aspettare il giro di fatturazione.
                      IF EXISTS (SELECT 1 FROM vendite.resi_righe_accrediti a
                                  WHERE a.resi_riga_id = p_resi_riga_id) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite','fn_accredita_riga_reso','E_ACCREDITO_GIA_ESEGUITO',
                              jsonb_build_object('resi_riga_id', p_resi_riga_id),
                              NULL::uuid, p_resi_riga_id::text);
                      END IF;
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_accredita_riga_reso','E_ACCREDITO_NON_IN_CODA',
                          jsonb_build_object('resi_riga_id', p_resi_riga_id),
                          NULL::uuid, p_resi_riga_id::text);
                  END IF;

                  -- --------------------------------------------------
                  -- 3) D-NC-1. La partita e' la SPEDIZIONE, sempre.
                  --    ⛔ Qui ci andava un COALESCE («se il DDT non c'e',
                  --    prendi il primo»): sarebbe stato un ramo morto, e
                  --    il giorno in cui qualcosa lo raggiungesse
                  --    scriverebbe su ORD: spostando l'accredito sulla
                  --    spedizione sbagliata, in silenzio. La cintura c'e',
                  --    ma parla.
                  -- --------------------------------------------------
                  IF v_coda.ddt_riga_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_accredita_riga_reso','E_ACCREDITO_SENZA_SPEDIZIONE',
                          jsonb_build_object('resi_riga_id', p_resi_riga_id),
                          NULL::uuid, p_resi_riga_id::text);
                  END IF;

                  -- Natura del documento che nascera'.
                  v_natura_nc := config.fn_get_natura_doc_fiscale_id('NOTA_CREDITO');
                  IF v_natura_nc IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_accredita_riga_reso','E_CONFIG_MANCANTE',
                          jsonb_build_object('codice_interno','NOTA_CREDITO'),
                          NULL::uuid, 'natura NOTA_CREDITO non trovata in config.nature_doc_fiscale');
                  END IF;

                  -- Segmenti della partita: quello della SPEDIZIONE (su cui si
                  -- scrive) e quello dell'ORDINE (da cui si puo' aver
                  -- fatturato, e quindi da cui si legge il prezzo).
                  SELECT d.uid INTO v_ddt_uid
                    FROM vendite.ddt_righe dr
                    JOIN vendite.ddt d ON d.id = dr.ddt_id
                   WHERE dr.id = v_coda.ddt_riga_id;

                  v_seg_ddt := 'DDT:' || v_ddt_uid::text || ':R:' || v_coda.ddt_riga_id::text;

                  IF v_coda.ordine_riga_id IS NOT NULL THEN
                      SELECT o.uid INTO v_ordine_uid
                        FROM vendite.ordini_righe orr
                        JOIN vendite.ordini o ON o.id = orr.ordine_id
                       WHERE orr.id = v_coda.ordine_riga_id;
                      v_seg_ord := 'ORD:' || v_ordine_uid::text || ':R:' || v_coda.ordine_riga_id::text;
                  END IF;

                  -- --------------------------------------------------
                  -- 5) Advisory lock TRANSAZIONALE sulla PARTITA, forma a
                  --    DUE argomenti (namespace + chiave): lo spazio dei
                  --    lock a un argomento e' condiviso con altre feature.
                  --    Sta QUI, dopo tutte le guard: una chiamata invalida
                  --    non deve serializzare gli altri operatori.
                  --    La chiave e' la riga di DDT e non la commessa,
                  --    perche' e' sul SEGMENTO che gira il progressivo
                  --    #RET, e un segmento puo' attraversare due commesse.
                  -- --------------------------------------------------
                  PERFORM pg_advisory_xact_lock(
                      hashtext('vendite.fn_accredita_riga_reso'),
                      hashtext(v_coda.ddt_riga_id::text));

                  -- Progressivo del suffisso dal MASSIMO, non dal count: il
                  -- conteggio assume l'invariante «count = max», che nulla
                  -- garantisce. I buchi sono ammessi e non significano nulla.
                  SELECT COALESCE(MAX(NULLIF(substring(ca.segment_key, '#RET:([0-9]+)'), '')::integer), 0) + 1
                    INTO v_progressivo
                    FROM vendite.commesse_attivita ca
                   WHERE ca.segment_key LIKE v_seg_ddt || '#RET:%';

                  v_residuo := v_coda.accredito_dovuto;
                  v_data    := script.fn_data_operativa();

                  -- --------------------------------------------------
                  -- 6) Le UNITA' FATTURANTI della partita, consumate LIFO
                  --    (D-NC-5: dall'ultima fatturata a scalare).
                  --    Il raggruppamento e' per `kit_key` e la quantita' si
                  --    legge in UNITA' PADRE — max(quantita/coeff_qta), non
                  --    la somma — esattamente come vw_af_merce_per_riga.
                  -- --------------------------------------------------
                  FOR v_grp IN
                      WITH af AS (
                          SELECT ca.id                                        AS ca_id,
                                 ca.segment_key,
                                 af.id                                        AS af_id,
                                 af.fattura_riga_id,
                                 af.quantita,
                                 split_part(ca.segment_key::text, '#CMP:', 1) AS kit_key,
                                 (ca.segment_key::text LIKE '%#CMP:%')        AS e_componente,
                                 CASE
                                     WHEN (ca.meta ->> 'coeff_qta') ~ '^[0-9]+(\.[0-9]+){0,1}$'
                                     THEN NULLIF((ca.meta ->> 'coeff_qta')::numeric, 0::numeric)
                                 END                                          AS coeff_qta,
                                 -- ⭐ Il secondo tasto del contratto kit. Il primo
                                 --    (coeff_qta) era gia' qui e gia' guardato: questo no,
                                 --    ed e' l'asimmetria che P-7 chiude.
                                 NULLIF(btrim(ca.meta ->> 'componente_di'), '') AS componente_di,
                                 f.data                                       AS fattura_data
                            FROM vendite.commesse_attivita ca
                            JOIN vendite.attivita_fatturabili af ON af.commessa_attivita_id = ca.id
                            LEFT JOIN vendite.fatture_righe fr ON fr.id = af.fattura_riga_id
                            LEFT JOIN vendite.fatture f ON f.id = fr.fattura_id
                           WHERE ca.tipo_movimento::text = 'NORMALE'
                             AND ( ca.segment_key::text = v_seg_ddt::text
                                   OR ca.segment_key::text LIKE v_seg_ddt::text || '#CMP:%'
                                   OR ( v_seg_ord IS NOT NULL
                                        AND ( ca.segment_key::text = v_seg_ord::text
                                              OR ca.segment_key::text LIKE v_seg_ord::text || '#CMP:%' ) ) )
                      ), gia AS (
                          -- Quanto e' gia' stato accreditato su ciascun gruppo,
                          -- in UNITA' PADRE. Si legge come MAX fra le righe di
                          -- fattura del gruppo e non come somma: per un kit
                          -- ogni componente porta la stessa quota padre
                          -- replicata, quindi sommarle la moltiplicherebbe.
                          SELECT a.kit_key,
                                 COALESCE(max(x.tot), 0::numeric) AS accreditato_padre
                            FROM af a
                            LEFT JOIN LATERAL (
                                SELECT COALESCE(sum(ra.qta_partita), 0::numeric) AS tot
                                  FROM vendite.resi_righe_accrediti ra
                                 WHERE ra.fattura_riga_rettificata_id = a.fattura_riga_id
                            ) x ON TRUE
                           GROUP BY a.kit_key
                      )
                      SELECT a.kit_key,
                             max(a.fattura_data)                                                     AS fattura_data,
                             max(CASE WHEN a.e_componente THEN a.quantita / a.coeff_qta
                                      ELSE a.quantita END)                                           AS qta_padre,
                             bool_or(a.fattura_riga_id IS NULL)                                       AS senza_fattura,
                             bool_or(a.e_componente AND a.coeff_qta IS NULL)                          AS coeff_mancante,
                             bool_or(a.e_componente AND a.componente_di IS NULL)                       AS padre_mancante,
                             COALESCE(max(g.accreditato_padre), 0::numeric)                           AS accreditato_padre
                        FROM af a
                        LEFT JOIN gia g ON g.kit_key = a.kit_key
                       GROUP BY a.kit_key
                       -- LIFO: dall'ULTIMA fatturata a scalare.
                       ORDER BY max(a.fattura_data) DESC NULLS LAST, a.kit_key DESC
                  LOOP
                      EXIT WHEN v_residuo <= 0;

                      -- ⚠️ Un'attivita' mai finita in una fattura non ha un
                      --    prezzo da cui accreditare. Non e' un caso da
                      --    gestire con un ripiego: e' la condizione che rende
                      --    l'accredito impossibile, e va detta.
                      IF v_grp.senza_fattura THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite','fn_accredita_riga_reso','E_ACCREDITO_ATTIVITA_NON_FATTURATA',
                              jsonb_build_object('resi_riga_id', p_resi_riga_id,
                                                 'segmento',     v_grp.kit_key),
                              NULL::uuid, p_resi_riga_id::text, v_grp.kit_key);
                      END IF;

                      -- Kit senza coefficiente: la quantita' padre non e'
                      -- calcolabile, e inventarla accrediterebbe un numero
                      -- che nessuno sa da dove viene.
                      IF v_grp.coeff_mancante THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite','fn_accredita_riga_reso','E_ACCREDITO_KIT_NON_MISURABILE',
                              jsonb_build_object('resi_riga_id', p_resi_riga_id,
                                                 'segmento',     v_grp.kit_key),
                              NULL::uuid, p_resi_riga_id::text, v_grp.kit_key);
                      END IF;

                      -- ⛔ Kit senza il PADRE nel meta: la rettifica nascerebbe
                      --    dichiarandosi componente (#CMP: nel segmento) senza dire
                      --    di CHI, e il generatore righe la rifiuterebbe con
                      --    E_ATTIVITA_KIT_SENZA_PADRE — giustamente, perche'
                      --    trattarla come riga normale la fatturerebbe DUE volte:
                      --    dentro il totale del padre e per conto suo (R11).
                      --    ⚠️ Senza questo guard il difetto arriva a valle nella
                      --    forma PEGGIORE fra le tre possibili: il verbo riesce, la
                      --    riga ESCE DALLA CODA e il documento non nasce. La coda
                      --    dice fatto e la nota di credito non c'e'.
                      --    Trovato dallo smoke del BE il 2026-08-18 (§28 del brief
                      --    principale) su una riga di reso a tre componenti.
                      --    Gemello esatto di E_ACCREDITO_KIT_NON_MISURABILE qui
                      --    sopra: stessa forma, stesso momento, altro tasto dello
                      --    stesso contratto.
                      IF v_grp.padre_mancante THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite','fn_accredita_riga_reso','E_ACCREDITO_KIT_SENZA_PADRE',
                              jsonb_build_object('resi_riga_id', p_resi_riga_id,
                                                 'segmento',     v_grp.kit_key),
                              NULL::uuid, p_resi_riga_id::text, v_grp.kit_key);
                      END IF;

                      -- Capienza residua del gruppo, in unita' padre.
                      v_quota := LEAST(v_residuo,
                                       v_grp.qta_padre - v_grp.accreditato_padre);
                      CONTINUE WHEN v_quota <= 0;

                      -- Una rettifica per RIGA DI FATTURA del gruppo: su un
                      -- articolo composito sono N, una per componente, e
                      -- ciascuna e' lo specchio della SUA riga di fattura.
                      FOR v_cmp IN
                          SELECT ca.id                                        AS ca_id,
                                 ca.commessa_id,
                                 ca.segment_key,
                                 ca.articolo_id,
                                 ca.istanza_utility_id,
                                 ca.uom_id,
                                 ca.uom_operativa_id,
                                 ca.factor_to_base,
                                 ca.quantita                                  AS ca_quantita,
                                 ca.qta_operativa                             AS ca_qta_operativa,
                                 COALESCE(ca.tipo_doc_fiscale_id, af.tipo_doc_fiscale_id) AS tipo_doc_fiscale_id,
                                 COALESCE(ca.valuta_id, af.valuta_id)         AS valuta_id,
                                 ca.area_geografica_id,
                                 af.fattura_riga_id,
                                 fr.prezzo_unitario,
                                 (ca.segment_key::text LIKE '%#CMP:%')        AS e_componente,
                                 split_part(ca.segment_key::text, '#CMP:', 2) AS componente,
                                 CASE
                                     WHEN (ca.meta ->> 'coeff_qta') ~ '^[0-9]+(\.[0-9]+){0,1}$'
                                     THEN NULLIF((ca.meta ->> 'coeff_qta')::numeric, 0::numeric)
                                 END                                          AS coeff_qta,
                                 -- ⭐ Il meta INTERO della riga rettificata, non due
                                 --    chiavi scelte a mano: vedi p_meta piu' sotto.
                                 COALESCE(ca.meta, '{}'::jsonb)               AS ca_meta
                            FROM vendite.commesse_attivita ca
                            JOIN vendite.attivita_fatturabili af ON af.commessa_attivita_id = ca.id
                            JOIN vendite.fatture_righe fr ON fr.id = af.fattura_riga_id
                           WHERE ca.tipo_movimento::text = 'NORMALE'
                             AND split_part(ca.segment_key::text, '#CMP:', 1) = v_grp.kit_key
                           ORDER BY ca.segment_key
                      LOOP
                          -- Quantita' in unita' di RIGA DI FATTURA.
                          v_qta_doc := v_quota * COALESCE(v_cmp.coeff_qta, 1::numeric);

                          -- Il segmento porta SEMPRE la spedizione (D-NC-1),
                          -- anche quando l'attivita' consumata sta sulla
                          -- corsia ORD. `#RET:<n>` prima di `#CMP:<comp>`,
                          -- cosi' `split_part(..., '#CMP:', 1)` continua a
                          -- dare il kit_key e vw_af_merce_per_riga legge la
                          -- rettifica senza modifiche.
                          v_segment_key := v_seg_ddt || '#RET:' || v_progressivo::text
                              || CASE WHEN v_cmp.e_componente
                                      THEN '#CMP:' || v_cmp.componente
                                      ELSE '' END;

                          SELECT u.attivita_id, u.is_new
                            INTO v_attivita_id, v_is_new
                            FROM vendite.fn_upsert_commessa_attivita(
                                p_commessa_id                   => v_cmp.commessa_id,
                                p_segment_key                   => v_segment_key,
                                p_articolo_id                   => v_cmp.articolo_id,
                                p_istanza_utility_id            => v_cmp.istanza_utility_id,
                                p_data_attivita                 => v_data,
                                p_uom_id                        => v_cmp.uom_id,
                                -- ⭐ D-NC-2: il segno sta nel NUMERO, non in
                                --    un'etichetta che ogni consumatore
                                --    dovrebbe saper tradurre.
                                p_quantita                      => - v_qta_doc,
                                p_competenza_mese               => date_trunc('month', v_data)::date,
                                p_competenza_dal                => v_data,
                                p_competenza_al                 => v_data,
                                -- ⭐ N-1: COPIATO dalla riga di fattura, mai
                                --    ricalcolato, mai riletto dal listino.
                                p_prezzo_snapshot               => v_cmp.prezzo_unitario,
                                p_prezzo_base_snapshot          => v_cmp.prezzo_unitario,
                                p_origine_prezzo                => 'MANUALE',
                                p_tipo_variazione_applicata     => 'NESSUNA',
                                p_valore_variazione_applicata   => NULL,
                                p_promo_id                      => NULL,
                                p_contratto_id                  => NULL,
                                p_categoria_cliente_id_snapshot => NULL,
                                p_classe_utenza_id_snapshot     => NULL,
                                p_qta_operativa                 => CASE
                                        WHEN v_cmp.ca_qta_operativa IS NOT NULL AND v_cmp.ca_quantita <> 0
                                        THEN - (v_qta_doc * v_cmp.ca_qta_operativa / v_cmp.ca_quantita)
                                    END,
                                p_uom_operativa_id              => v_cmp.uom_operativa_id,
                                p_factor_to_base                => COALESCE(v_cmp.factor_to_base, 1::numeric),
                                p_posticipa_al                  => NULL,
                                p_tipo_doc_fiscale_id           => v_cmp.tipo_doc_fiscale_id,
                                p_valuta_id                     => v_cmp.valuta_id,
                                p_area_geografica_id            => v_cmp.area_geografica_id,
                                p_listino_versione_id           => NULL,
                                p_prezzo_bloccato               => true,
                                p_pricing_mode                  => 'FIXED',
                                p_prezzo_da_riallineare         => false,
                                p_stato_approvazione            => 'APPROVATA',
                                p_stato_emissione               => 'NON_EMESSA',
                                -- ⭐ SOURCELESS DI PROPOSITO, e questa e' l'unica riga di
                                --    questa chiamata che ha bisogno di essere spiegata.
                                --    Una RETTIFICA non nasce da un documento: nasce CONTRO una
                                --    commessa. Il reso c'e', e viaggia nel SEGMENTO
                                --    (DDT:<uid>:R:<riga>#RET:<n>), ma non e' la sua sorgente.
                                -- ⛔ E non e' una scelta libera: il CHECK
                                --    chk_commesse_attivita_sorgente_pair impone la coppia
                                --    TUTTA-NULL o TUTTA-PIENA, quindi valorizzarne una sola —
                                --    la tentazione di chi passa di qui e pensa «il DDT lo
                                --    conosco» — solleverebbe. E valorizzarle entrambe col DDT
                                --    non solleverebbe affatto: cambierebbe in silenzio il
                                --    GRUPPO FATTURABILE.
                                -- ⚠️ LA CONSEGUENZA CHE SORPRENDE, ed e' il motivo per cui il
                                --    commento sta qui e non nel COMMENT della funzione:
                                --    vendite.fn_build_gruppo_fatturabile_key(NULL, NULL, id)
                                --    risponde 'MAN:<commessa_id>', cioe' il gruppo «oneri di
                                --    commessa». Verificato sulla REGOLA e non sui dati il
                                --    2026-08-29: (NULL, NULL, 999) -> 'MAN:999'.
                                --    Il gruppo di una rettifica NON e' il DDT da cui la merce
                                --    e' tornata, ed e' corretto: il gruppo e' l'unita'
                                --    dell'emissione mirata, non del documento. Chi
                                --    «riparasse» questi due NULL col DDT farebbe finire la
                                --    rettifica nel gruppo della merce, senza nessun errore.
                                -- ⭐ Che poi non finisca nella fattura ordinaria lo garantisce
                                --    un'altra cosa ancora: fn_build_fattura_key porta la
                                --    NATURA (rev 2026-08-18). Sono due presidi distinti, e
                                --    vale sapere quale fa cosa.
                                p_sorgente_tipo_id              => NULL,
                                p_sorgente_uid                  => NULL,
                                p_tipo_movimento                => 'RETTIFICA',
                                -- ⭐ P-7: si EREDITA il meta della riga rettificata e ci si
                                --    sovrappone il proprio, invece di enumerare le chiavi da
                                --    copiare. La rettifica e' lo specchio della riga
                                --    rettificata e da lei copia gia' prezzo, IVA, unita' di
                                --    misura e coefficiente: il meta era l'unica cosa che NON
                                --    copiava, e quell'asimmetria era il difetto.
                                --    ⚠️ Il contratto kit (backend _kit_meta.py) ha QUATTRO
                                --    tasti — componente_di, esposto_in_fattura, segment_key,
                                --    coeff_qta — e qui ne arrivava uno solo. Enumerarne due
                                --    in piu' avrebbe messo quei letterali in un TERZO posto,
                                --    per giunta in SQL dove _kit_meta.py non si puo'
                                --    importare: e' esattamente il difetto contro cui quel
                                --    file e' nato («un refuso da una parte produce righe che
                                --    spariscono dall'esposizione in fattura senza un
                                --    errore»). Ereditando, il quinto tasto che qualcuno
                                --    aggiungera' viaggia da solo.
                                --    ⛔ Le TRE chiavi che potrebbero mentire sono coperte:
                                --    `tipo_consumo` lo riscrive comunque
                                --    fn_upsert_commessa_attivita, `segment_key` lo riscrive
                                --    comunque fn_emit_attivita_fatturabili_da_commessa —
                                --    entrambi a destra del `||`, quindi vincono loro — e
                                --    `qta_padre` (rev 2026-10-03) lo riscrive questa stessa
                                --    chiamata, qui sotto.
                                p_meta                          => COALESCE(v_cmp.ca_meta, '{}'::jsonb)
                                                                   || jsonb_strip_nulls(jsonb_build_object(
                                        'coeff_qta',    v_cmp.coeff_qta,
                                        -- ⭐ rev 2026-10-03 (brief-db-bom-flag-quantita-e-kit-in-
                                        --    fattura, R-DB-B8): la quantita' PADRE della
                                        --    rettifica, NEGATIVA come la quantita' del componente
                                        --    (D-NC-2: le due descrivono la stessa attivita').
                                        --    v_quota e' gia' in unita' padre. Ereditata, sarebbe
                                        --    quella della riga rettificata: positiva e intera, e
                                        --    la nota di credito direbbe «+N kit». Solo sui
                                        --    componenti: su una riga che non e' di kit la chiave
                                        --    non nasce (jsonb_strip_nulls). uom_padre_id resta
                                        --    quella ereditata, ed e' giusta.
                                        'qta_padre',    CASE WHEN v_cmp.e_componente THEN - v_quota END,
                                        'accredito_da', 'RESO',
                                        'resi_riga_id', p_resi_riga_id)),
                                p_causale_onere_id              => NULL,
                                p_natura_doc_id                 => v_natura_nc,
                                p_fattura_riga_rettificata_id   => v_cmp.fattura_riga_id
                            ) AS u;

                          -- Difesa in profondita': l'accredito e' una CREATE,
                          -- non una upsert. Riusa fn_upsert_commessa_attivita
                          -- solo per non duplicarne il mapping a 40 parametri,
                          -- ma un «update» qui non e' MAI legittimo. Col lock
                          -- e il MAX+1 sopra non deve mai scattare: se scatta
                          -- e' una regressione.
                          IF NOT v_is_new THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite','fn_accredita_riga_reso','E_ACCREDITO_SEGMENT_DUPLICATO',
                                  jsonb_build_object('resi_riga_id', p_resi_riga_id,
                                                     'segment_key',  v_segment_key,
                                                     'attivita_id',  v_attivita_id),
                                  NULL::uuid, v_segment_key, p_resi_riga_id::text);
                          END IF;

                          -- Il FATTO e il PRESIDIO, nella stessa riga.
                          -- `gruppo` = il segmento della rettifica privato del
                          -- suffisso #CMP: identifica l'UNITA' CONSUMATA, cosi'
                          -- la quota in unita' di merce si somma una volta per
                          -- gruppo e non una volta per componente.
                          INSERT INTO vendite.resi_righe_accrediti
                                 (resi_riga_id, fattura_riga_rettificata_id,
                                  qta, qta_partita, gruppo, commessa_attivita_id, meta)
                          VALUES (p_resi_riga_id, v_cmp.fattura_riga_id,
                                  v_qta_doc, v_quota,
                                  v_seg_ddt || '#RET:' || v_progressivo::text,
                                  v_attivita_id,
                                  jsonb_build_object('segment_key',      v_segment_key,
                                                     'segmento_origine', v_cmp.segment_key,
                                                     'etichetta',        v_coda.etichetta))
                          RETURNING id INTO v_accredito_id;

                          -- Audit: chi, quando, quanto, contro quale riga di
                          -- fattura. Senza, la rettifica direbbe COSA e' stato
                          -- fatto, non A FRONTE DI COSA.
                          INSERT INTO vendite.commesse_attivita_log (commessa_attivita_id, evento, dettaglio)
                          VALUES (v_attivita_id, 'ACCREDITO_RICHIESTO',
                                  jsonb_build_object(
                                      'resi_riga_id',                p_resi_riga_id,
                                      'ddt_riga_id',                 v_coda.ddt_riga_id,
                                      'ordine_riga_id',              v_coda.ordine_riga_id,
                                      'etichetta',                   v_coda.etichetta,
                                      'accredito_dovuto',            v_coda.accredito_dovuto,
                                      'fattura_riga_rettificata_id', v_cmp.fattura_riga_id,
                                      'prezzo_copiato',              v_cmp.prezzo_unitario,
                                      'qta_documento',               v_qta_doc,
                                      'qta_partita',                 v_quota,
                                      'segment_key',                 v_segment_key,
                                      'accredito_id',                v_accredito_id));

                          accredito_id                := v_accredito_id;
                          commessa_attivita_id        := v_attivita_id;
                          fattura_riga_rettificata_id := v_cmp.fattura_riga_id;
                          qta                         := v_qta_doc;
                          qta_partita                 := v_quota;
                          RETURN NEXT;
                      END LOOP;

                      v_residuo     := v_residuo - v_quota;
                      v_progressivo := v_progressivo + 1;
                  END LOOP;

                  -- --------------------------------------------------
                  -- 8) L'UGUAGLIANZA DI D-NC-6, e il tetto della MERCE.
                  --    L'accredito e' sempre PIENO: un residuo che nessuno
                  --    puo' chiudere e' la malattia per cui questo cantiere
                  --    esiste — la riga che resta in coda a chiedere per
                  --    sempre. Meglio non farlo che farlo a meta'.
                  --    ⚠️ Sta QUI e non nel guard del ponte perche' la
                  --    merce si misura in unita' PADRE: su un kit tre righe
                  --    di ponte valgono UNA unita', e un trigger di riga
                  --    che le sommasse rifiuterebbe il secondo componente.
                  -- --------------------------------------------------
                  IF v_residuo > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_accredita_riga_reso','E_ACCREDITO_QUOTA_NON_COPERTA',
                          jsonb_build_object('resi_riga_id',     p_resi_riga_id,
                                             'accredito_dovuto', v_coda.accredito_dovuto,
                                             'non_coperto',      v_residuo),
                          NULL::uuid,
                          p_resi_riga_id::text, v_residuo::text, v_coda.accredito_dovuto::text);
                  END IF;

                  RETURN;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_aggiungi_onere_commessa(p_commessa_id vendite.commesse.id%TYPE, p_istanza_utility_id anagrafiche.istanze_utilities.id%TYPE, p_articolo_onere_id catalogo.articoli.id%TYPE, p_importo vendite.commesse_attivita.prezzo_snapshot%TYPE, p_tipo_doc_fiscale_id vendite.commesse_attivita.tipo_doc_fiscale_id%TYPE, p_motivo text DEFAULT NULL::text, p_data_attivita vendite.commesse_attivita.data_attivita%TYPE DEFAULT NULL::date)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_data            vendite.commesse_attivita.data_attivita%TYPE;
                v_comp_mese       vendite.commesse_attivita.competenza_mese%TYPE;
                v_uom_id          catalogo.articoli.uom_id%TYPE;
                v_causale_id      catalogo.articoli.causale_onere_id%TYPE;
                -- v_progressivo e' un contatore (MAX+1 sulla chiave), non il riflesso di una colonna.
                v_progressivo     integer;
                v_segment_key     vendite.commesse_attivita.segment_key%TYPE;
                v_attivita_id     vendite.commesse_attivita.id%TYPE;
                -- v_is_new e' l'esito di fn_upsert_commessa_attivita (RETURNS TABLE), non una colonna.
                v_is_new          boolean;
              BEGIN
                -- Scopo: madre DB della "porta oneri". Crea una riga
                -- commesse_attivita di puro valore (qta=1, tipo_movimento='ONERE')
                -- gia' APPROVATA, da un ARTICOLO-ONERE (che porta causale+uom+IVA).
                -- Perimetro: una sola unita' atomica (la chiamata), riusa
                -- fn_upsert_commessa_attivita per lo specchio idempotente, e scrive
                -- l'audit su commesse_attivita_log. Risultato: id della riga creata.
                -- Il presidio permessi (carica_voce_manuale) vive sul BE, non qui:
                -- la madre e' usabile anche da un processo autorizzato.

                -- Guard parametri ID (AGENTS.md: NULL o <=0 -> errore parlante).
                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_aggiungi_onere_commessa','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','commessa_id','valore',p_commessa_id),
                    NULL::uuid, 'commessa_id obbligatorio (>0)');
                END IF;

                IF p_istanza_utility_id IS NULL OR p_istanza_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_aggiungi_onere_commessa','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','istanza_utility_id','valore',p_istanza_utility_id),
                    NULL::uuid, 'istanza_utility_id obbligatoria (>0)');
                END IF;

                -- La riga nasce APPROVATA+NON_EMESSA = emittibile: il guard
                -- tipo_doc_emittibile esige tipo_doc valorizzato -> obbligatorio qui.
                IF p_tipo_doc_fiscale_id IS NULL OR p_tipo_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_aggiungi_onere_commessa','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','tipo_doc_fiscale_id','valore',p_tipo_doc_fiscale_id),
                    NULL::uuid, 'tipo_doc_fiscale_id obbligatorio (>0): la riga onere nasce emittibile');
                END IF;

                -- Importo: solo positivo (la porta porta valore, qta=1). Una NC
                -- travestita (importo negativo) e' vietata per costruzione.
                IF p_importo IS NULL OR p_importo <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_aggiungi_onere_commessa','E_ONERE_IMPORTO_NON_VALIDO',
                    jsonb_build_object('campo','importo','importo',p_importo),
                    NULL::uuid, COALESCE(p_importo::text,'NULL'));
                END IF;

                -- Articolo-onere: deve esistere, essere attivo ed ESSERE un onere
                -- (causale_onere_id NOT NULL). Da qui derivano causale e uom (e a
                -- valle l'IVA, che e' la iva_id dell'articolo).
                SELECT a.uom_id, a.causale_onere_id
                  INTO v_uom_id, v_causale_id
                  FROM catalogo.articoli a
                 WHERE a.id = p_articolo_onere_id
                   AND a.attivo
                   AND a.causale_onere_id IS NOT NULL;

                IF NOT FOUND THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_aggiungi_onere_commessa','E_ONERE_ARTICOLO_MANCANTE',
                    jsonb_build_object('campo','articolo_onere_id','articolo_onere_id',p_articolo_onere_id),
                    NULL::uuid, COALESCE(p_articolo_onere_id::text,'NULL'));
                END IF;

                v_data      := COALESCE(p_data_attivita, script.fn_data_operativa());
                v_comp_mese := date_trunc('month', v_data)::date;

                -- =====================================================
                -- segment_key progressivo della porta manuale per la commessa.
                -- Convenzione dedicata MAN:<commessa>:<n> (nessun prefisso manuale
                -- esisteva prima). Non si incrocia con i segment di push (ORD:/DDT:).
                --
                -- CONCORRENZA (brief-db-race-segment-key-onere, 2026-07-23):
                -- il progressivo va calcolato SOTTO LOCK. Senza, due operatori
                -- sulla stessa commessa leggono lo stesso valore, generano la
                -- stessa segment_key e la fn_upsert (ON CONFLICT su
                -- (commessa_id, segment_key)) AGGIORNA la riga del primo invece
                -- di crearne una nuova: un onere perso in silenzio, 200 OK a
                -- entrambi. La porta manuale e' il primo scrittore concorrente
                -- reale di questa fn (i push serializzano su worker singolo).
                --
                -- Advisory lock TRANSAZIONALE per commessa: serializza solo gli
                -- oneri della stessa commessa, si rilascia da solo a fine
                -- transazione, nessun oggetto nuovo. Sta QUI, dopo tutte le
                -- guard e dopo il lookup articolo: una chiamata invalida non
                -- deve serializzare gli altri operatori.
                -- Forma a 2 argomenti (namespace + chiave): lo spazio dei lock a
                -- 1 argomento e' condiviso con altre feature del progetto.
                -- =====================================================
                PERFORM pg_advisory_xact_lock(
                  hashtext('vendite.fn_aggiungi_onere_commessa'),
                  hashtext(p_commessa_id::text)
                );

                -- NOTA ISOLAMENTO: sotto READ COMMITTED (default PostgreSQL e
                -- Django) la SELECT qui sotto prende uno snapshot NUOVO e vede la
                -- riga committata da chi ha appena rilasciato il lock, quindi il
                -- progressivo e' corretto. Sotto REPEATABLE READ/SERIALIZABLE lo
                -- snapshot resta fisso all'inizio della transazione e il progressivo
                -- sarebbe stale: in quel caso e' il guard
                -- E_ONERE_SEGMENT_DUPLICATO a valle a impedire la perdita
                -- silenziosa (fallisce invece di sovrascrivere).
                --
                -- Progressivo dal MASSIMO, non dal count: il conteggio assume
                -- l'invariante "count = max", che nulla garantisce. Una sola
                -- DELETE di una riga MAN: e count+1 punterebbe su una chiave gia'
                -- esistente -> stessa collisione, senza nemmeno la concorrenza.
                -- I buchi nella numerazione sono ammessi e non significano nulla.
                -- Il match e' sulla forma PIENA della chiave (commessa inclusa):
                -- una chiave MAN: non auto-coerente non entra nel calcolo.
                SELECT COALESCE(MAX((split_part(ca.segment_key, ':', 3))::integer), 0) + 1
                  INTO v_progressivo
                  FROM vendite.commesse_attivita ca
                 WHERE ca.commessa_id = p_commessa_id
                   AND ca.segment_key ~ ('^MAN:' || p_commessa_id || ':[0-9]+$');

                v_segment_key := format('MAN:%s:%s', p_commessa_id, v_progressivo);

                -- Crea la riga onere. Nasce APPROVATA (nessuna approvazione a due
                -- passi); poi fa il giro normale: emissione -> AF -> fattura.
                -- SOURCELESS (sorgente NULL) + tipo_movimento='ONERE' + causale
                -- snapshottata dall'articolo.
                SELECT u.attivita_id, u.is_new
                  INTO v_attivita_id, v_is_new
                  FROM vendite.fn_upsert_commessa_attivita(
                    p_commessa_id                 => p_commessa_id,
                    p_segment_key                 => v_segment_key,
                    p_articolo_id                 => p_articolo_onere_id,
                    p_istanza_utility_id          => p_istanza_utility_id,
                    p_data_attivita               => v_data,
                    p_uom_id                      => v_uom_id,
                    p_quantita                    => 1,
                    p_competenza_mese             => v_comp_mese,
                    p_competenza_dal              => v_data,
                    p_competenza_al               => v_data,
                    p_prezzo_snapshot             => p_importo,
                    p_prezzo_base_snapshot        => p_importo,
                    p_origine_prezzo              => 'MANUALE',
                    p_tipo_variazione_applicata   => 'NESSUNA',
                    p_valore_variazione_applicata => NULL,
                    p_promo_id                    => NULL,
                    p_contratto_id                => NULL,
                    p_categoria_cliente_id_snapshot => NULL,
                    p_classe_utenza_id_snapshot   => NULL,
                    p_qta_operativa               => NULL,
                    p_uom_operativa_id            => NULL,
                    p_factor_to_base              => 1,
                    p_posticipa_al                => NULL,
                    p_tipo_doc_fiscale_id         => p_tipo_doc_fiscale_id,
                    p_valuta_id                   => NULL,
                    p_area_geografica_id          => NULL,
                    p_listino_versione_id         => NULL,
                    p_prezzo_bloccato             => true,
                    p_pricing_mode                => 'FIXED',
                    p_prezzo_da_riallineare       => false,
                    p_stato_approvazione          => 'APPROVATA',
                    p_stato_emissione             => 'NON_EMESSA',
                    p_sorgente_tipo_id            => NULL,
                    p_sorgente_uid                => NULL,
                    p_tipo_movimento              => 'ONERE',
                    p_meta                        => jsonb_strip_nulls(jsonb_build_object('motivo_onere', p_motivo)),
                    p_causale_onere_id            => v_causale_id
                  ) AS u;

                -- Difesa in profondita' (brief-db-race-segment-key-onere §2):
                -- la porta oneri e' una CREATE, non una upsert. Riusa
                -- fn_upsert_commessa_attivita solo per non duplicarne il mapping
                -- a 38 parametri (no logica duplicata fra livelli), ma un
                -- "update" qui non e' MAI legittimo: ogni chiamata e' un onere
                -- NUOVO. Se is_new e' false siamo su una collisione di
                -- segment_key -> fallire rumorosamente invece di sovrascrivere
                -- l'onere di un altro operatore.
                -- Il guard sta QUI e non dentro fn_upsert_commessa_attivita:
                -- la' l'update e' la semantica corretta (re-push idempotente dei
                -- documenti sorgente) e spostarlo romperebbe i push.
                -- Con il lock + MAX(...)+1 sopra non deve mai scattare: se scatta
                -- e' una regressione, o una transazione fuori READ COMMITTED.
                IF NOT v_is_new THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_aggiungi_onere_commessa','E_ONERE_SEGMENT_DUPLICATO',
                    jsonb_build_object(
                      'commessa_id', p_commessa_id,
                      'segment_key', v_segment_key,
                      'attivita_id', v_attivita_id),
                    NULL::uuid, v_segment_key, p_commessa_id::text);
                END IF;

                -- Audit: PRIMO evento vero di commesse_attivita_log (finora nessun
                -- writer). tx_id e audit sono gestiti dai trigger della tabella.
                -- is_new resta nel dettaglio come testimone dell'invariante: dopo
                -- il guard qui sopra puo' valere solo true.
                INSERT INTO vendite.commesse_attivita_log (commessa_attivita_id, evento, dettaglio)
                VALUES (
                  v_attivita_id,
                  'ONERE_AGGIUNTO',
                  jsonb_build_object(
                    'articolo_onere_id',  p_articolo_onere_id,
                    'causale_onere_id',   v_causale_id,
                    'importo',            p_importo,
                    'motivo',             p_motivo,
                    'istanza_utility_id', p_istanza_utility_id,
                    'tipo_doc_fiscale_id',p_tipo_doc_fiscale_id,
                    'segment_key',        v_segment_key,
                    'is_new',             v_is_new
                  )
                );

                RETURN v_attivita_id;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_crea_revisione_preventivo(p_preventivo_id vendite.preventivi.id%TYPE, p_user vendite.preventivi.user_update%TYPE)
               RETURNS TABLE(nuovo_preventivo_id vendite.preventivi.id%TYPE, numero vendite.preventivi.numero%TYPE, nuova_rev vendite.preventivi.rev%TYPE)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_stato_corrente_cod  config.stati_doc_preventivi.codice_interno%TYPE;
                v_numero              vendite.preventivi.numero%TYPE;
                v_max_rev             vendite.preventivi.rev%TYPE;
                v_stato_draft_id      config.stati_doc_preventivi.id%TYPE;
                v_new_id              vendite.preventivi.id%TYPE;
                v_new_rev             vendite.preventivi.rev%TYPE;
                v_has_draft           boolean;
                v_riga                vendite.preventivi_righe%ROWTYPE;
                v_new_riga_id         vendite.preventivi_righe.id%TYPE;
              BEGIN
                -- ==========================================================
                -- Scopo:
                --   Creare una nuova revisione in DRAFT a partire da un
                --   preventivo in stato EMESSO. Copia testata, righe attive,
                --   indirizzi e componenti BoM (con FK remap). Non gestisce
                --   is_revision_attiva: l'attivazione e' derivata in
                --   vendite.vw_preventivi tramite is_abortito degli stati.
                --
                -- Regole (rev 2026-05-15):
                --   - stato corrente DEVE essere EMESSO
                --   - non deve esistere gia' una revisione DRAFT per lo stesso numero
                --   - la nuova revisione ha rev = max(rev)+1, stato DRAFT
                --   - righe copiate: solo attive con quantita > 0, ORDER BY ordine, id
                --   - componenti BoM delle righe copiate: TUTTI, anche gli opzionali
                --     spenti, rimappati sulla riga nuova per identita' (rev 2026-10-08)
                --   - indirizzi: tutti copiati
                --
                -- Parametri:
                --   p_preventivo_id : ID del preventivo da revisionare
                --   p_user          : utente che esegue l'operazione
                --
                -- NOTE codice_interno (rev 2026-06-28, analisi-hardcoded-codice §3a #2):
                --   stato corrente e risoluzione DRAFT per codice_interno (immutabile),
                --   non per codice (mutabile). Literali EMESSO/DRAFT sono codice_interno.
                --
                -- NOTE data di consegna (rev 2026-09-14, 20260914-13):
                --   le righe copiate portano data_consegna_richiesta_cliente. La data
                --   e' del CLIENTE, non una promessa nostra: una revisione rinegozia
                --   prezzi e quantita', non cio' che il cliente ha chiesto. Le righe si
                --   copiano con un elenco ESPLICITO di colonne, quindi una colonna non
                --   nominata non passa — e' lo stesso punto in cui si perdeva al push
                --   (20260913-20). Brief: brief-db-modifiche-certe-ciclo-vendita-e-articolo.
                --
                -- NOTE marche di approvazione prezzo (rev 2026-09-14, 20260914-14, D di Tid):
                --   stato_approvazione_prezzo e pratica_approvazione_prezzo_id si copiano
                --   1:1 sulla riga, come gia' sui componenti qui sotto e come
                --   fn_crea_revisione_offerta (20260601-05). Ragione: i gate L3 scattano
                --   sull'edit, non alla revisione; lo stato e' l'unico marcatore
                --   persistente che un prezzo fuori policy e' autorizzato o in attesa.
                --   Azzerarlo faceva nascere la rev N+1 con lo stesso prezzo e senza
                --   marca (com'era dal 2026-04-22 al 20260914-13). Una riga PENDING
                --   copiata resta protetta da trgfn_righe_guard_pending. ⚠️ Caveat, lo
                --   stesso dell'offerta: la pratica resta agganciata per id a ENTRAMBE
                --   le righe e il suo meta nomina la riga della rev N — il ciclo di vita
                --   della pratica su una rev superata e' del dominio approvazioni (BE),
                --   refactor-prezzi.md 4.7. Non si decide qui.
                --
                -- NOTE l'ancora si copia (rev 2026-09-15, 20260915-41, D3 di Tid):
                --   la testata della rev N+1 porta emittente_fiscale_id della rev N.
                --   Prima NON era nella lista colonne e lo riempiva il trigger di default
                --   di sessione (la copia per documento di allora, oggi il BB
                --   script.trgfn_default_emittente_fiscale): per un operatore della
                --   stessa azienda lo stesso valore; per un super admin con emittente
                --   attivo B che revisiona un preventivo di A, la rev N+1 prendeva B e
                --   trgfn_preventivi_guard_emittente_ba la rifiutava — un difetto
                --   mascherato da un guard. La revisione e' LO STESSO documento: copia
                --   l'ancora, come fn_crea_revisione_offerta. Trovato censendo chi si
                --   appoggiava al default senza dirlo (brief-db-emittente-di-default-un-bb-solo, 7.1).
                --
                --   ⚠️ Colonne che NON si copiano di proposito: natura_vendita_id (la
                --   deriva e la congela il trigger BEFORE INSERT dall'articolo), tx_id
                --   (framework), id/data_insert/data_update (identity e audit). Il
                --   presidio che pretende l'elenco COMPLETO o la dichiarazione e'
                --   db/pgtap/vendite/test-fn-crea-revisione-preventivo-riga-completa-v1.
                --
                -- NOTE i componenti (rev 2026-10-08, 20261008-35, D-1 di Tid):
                --   brief-db-righe-e-componenti-le-altre-famiglie §2.1, la forma di
                --   fn_crea_revisione_offerta (20261005-19). Due cambi:
                --   * si copiano TUTTI i componenti delle righe copiate, anche gli
                --     opzionali spenti. Spegnere un opzionale e' una scelta del
                --     preventivo, e la revisione e' lo stesso documento: non portarlo la
                --     cancellava, e nella rev N+1 non si poteva piu' riaccendere. Non
                --     cambia cosa si vende: il push a ordine porta solo gli attivi;
                --   * la riga nuova si lega alla vecchia per IDENTITA': una riga alla
                --     volta, col suo RETURNING, e i componenti sull'id restituito. Prima
                --     un ROW_NUMBER su (ordine, id) dei due insiemi, che regge solo finche'
                --     gli id nuovi nascono nell'ordine della SELECT — una proprieta'
                --     dell'esecuzione, non un contratto di SQL.
                --   I trigger del componente lavorano come alla nascita: m50 ricalcola la
                --   quantita' dalla riga; z90 il prezzo della riga dai componenti ATTIVI,
                --   cioe' lo stesso della rev N. La revisione e' in DRAFT: il lock «fuori
                --   bozza» dei componenti (20261008-34) la lascia passare.
                --   ⚠️ I totali: il trigger STATEMENT su preventivi_righe ora scatta una
                --   volta per riga invece che una volta sola. L'ultimo passaggio vede
                --   tutte le righe: il risultato e' lo stesso.
                -- ==========================================================

                -- Guard: parametro obbligatorio
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('param', 'p_preventivo_id', 'value', p_preventivo_id),
                    NULL::uuid,
                    'p_preventivo_id = ' || COALESCE(p_preventivo_id::text, 'NULL')
                  );
                END IF;

                -- Recupera stato corrente e numero
                SELECT sdp.codice_interno, p.numero
                  INTO v_stato_corrente_cod, v_numero
                  FROM vendite.preventivi p
                  JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                 WHERE p.id = p_preventivo_id;

                IF v_stato_corrente_cod IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_PREV_STATO_CORRENTE_NON_TROVATO',
                    jsonb_build_object('preventivo_id', p_preventivo_id),
                    NULL::uuid,
                    p_preventivo_id::text
                  );
                END IF;

                -- Guard: revisione ammessa SOLO da EMESSO
                IF v_stato_corrente_cod NOT IN ('EMESSO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_PREV_REVISIONE_STATO_NON_AMMESSO',
                    jsonb_build_object(
                      'preventivo_id', p_preventivo_id,
                      'stato_corrente', v_stato_corrente_cod
                    ),
                    NULL::uuid,
                    p_preventivo_id::text, v_stato_corrente_cod
                  );
                END IF;

                -- Guard: non deve esistere gia' una revisione DRAFT
                SELECT EXISTS(
                  SELECT 1
                    FROM vendite.preventivi p2
                    JOIN config.stati_doc_preventivi sdp2 ON sdp2.id = p2.stato_doc_preventivo_id
                   WHERE p2.numero = v_numero
                     AND sdp2.codice_interno = 'DRAFT'
                ) INTO v_has_draft;

                IF v_has_draft THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_PREV_REVISIONE_BOZZA_ESISTENTE',
                    jsonb_build_object('numero', v_numero),
                    NULL::uuid,
                    v_numero
                  );
                END IF;

                -- Guard (rev 2026-09-24): nessuna revisione con un prezzo IN ATTESA.
                --   La revisione ricopia stato e pratica di approvazione 1:1 (sotto): una
                --   riga in attesa ricopiata resterebbe legata alla pratica della rev N,
                --   l'esito arriverebbe li' e sulla rev N+1 l'attesa non finirebbe piu' —
                --   bloccata dal guard per riga e, dal 20260924-21, anche all'emissione.
                --   Decisione di Tid del 2026-09-24: prima l'esito, poi la revisione.
                -- ⭐ Il predicato e' script.fn_check_prezzi_in_attesa, lo STESSO con cui
                --   fn_available_actions_preventivo spegne «Crea revisione»: qui si
                --   solleva soltanto. Approvato e rifiutato NON bloccano: si ricopiano.
                PERFORM script.fn_raise_primo_motivo_se_presente(
                  'vendite', 'fn_crea_revisione_preventivo',
                  script.fn_check_prezzi_in_attesa('vendite.preventivi'::regclass, p_preventivo_id),
                  NULL,
                  NULL::uuid,
                  jsonb_build_object('preventivo_id', p_preventivo_id, 'numero', v_numero));

                -- Recupera stato DRAFT id
                SELECT id INTO v_stato_draft_id
                  FROM config.stati_doc_preventivi
                 WHERE codice_interno = 'DRAFT' AND attivo IS TRUE;

                IF v_stato_draft_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_crea_revisione_preventivo',
                    'E_CONFIG_MANCANTE',
                    jsonb_build_object('tabella', 'config.stati_doc_preventivi', 'codice', 'DRAFT'),
                    NULL::uuid,
                    'stato DRAFT non trovato o non attivo in config.stati_doc_preventivi'
                  );
                END IF;

                -- Calcola nuova revisione
                SELECT COALESCE(MAX(p.rev), 0) + 1
                  INTO v_new_rev
                  FROM vendite.preventivi p
                 WHERE p.numero = v_numero;

                -- Crea nuova testata (copia campi dal preventivo originale).
                -- Totali a 0: il trigger STATEMENT su preventivi_righe li ricalcola
                -- dopo ogni INSERT delle righe copiate (una riga alla volta dal
                -- 2026-10-08: l'ultimo passaggio vede tutte le righe).
                INSERT INTO vendite.preventivi (
                  numero, rev, emittente_fiscale_id,
                  billing_account_id, istanza_utility_id, utility_id,
                  validita_dal, validita_al,
                  totale_imponibile, totale_iva, totale_documento,
                  valuta_id, competenza_mese, fatturazione_immediata,
                  stato_doc_preventivo_id, data, termine_pagamento_id,
                  storicizza, meta,
                  user_insert, user_update
                )
                SELECT
                  p.numero, v_new_rev, p.emittente_fiscale_id,
                  p.billing_account_id, p.istanza_utility_id, p.utility_id,
                  p.validita_dal, p.validita_al,
                  0, 0, 0,
                  p.valuta_id, p.competenza_mese, p.fatturazione_immediata,
                  v_stato_draft_id, (SELECT script.fn_data_operativa()), p.termine_pagamento_id,
                  p.storicizza, p.meta,
                  COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                FROM vendite.preventivi p
                WHERE p.id = p_preventivo_id
                RETURNING id INTO v_new_id;

                -- Copia righe attive, e per ciascuna i suoi componenti BoM.
                -- Una riga alla volta, con RETURNING (rev 2026-10-08): la
                -- corrispondenza vecchia -> nuova e' quella dell'INSERT, non un ordine
                -- di assegnazione degli id dato per scontato.
                FOR v_riga IN
                    SELECT pr.*
                      FROM vendite.preventivi_righe pr
                     WHERE pr.preventivo_id = p_preventivo_id
                       AND pr.attivo IS TRUE
                       AND pr.quantita > 0
                     ORDER BY pr.ordine, pr.id
                LOOP
                  INSERT INTO vendite.preventivi_righe (
                    preventivo_id, articolo_id, descrizione,
                    quantita, prezzo_unitario, sconto_percentuale,
                    iva_id, ordine, attivo,
                    qta_operativa, uom_operativa_id, factor_to_base,
                    data_consegna_richiesta_cliente,
                    stato_approvazione_prezzo, pratica_approvazione_prezzo_id,
                    meta,
                    user_insert, user_update
                  )
                  VALUES (
                    v_new_id, v_riga.articolo_id, v_riga.descrizione,
                    v_riga.quantita, v_riga.prezzo_unitario, v_riga.sconto_percentuale,
                    v_riga.iva_id, v_riga.ordine, v_riga.attivo,
                    v_riga.qta_operativa, v_riga.uom_operativa_id, v_riga.factor_to_base,
                    v_riga.data_consegna_richiesta_cliente,
                    v_riga.stato_approvazione_prezzo, v_riga.pratica_approvazione_prezzo_id,
                    v_riga.meta,
                    COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                  )
                  RETURNING id INTO v_new_riga_id;

                  -- I componenti si copiano TUTTI, attivi e no (D-1 di Tid, 2026-10-08).
                  -- Il trigger trgfn_componenti_calcola_quantita (BEFORE INSERT)
                  -- ricalcola quantita/qta_operativa da coeff_qta_snapshot: i valori
                  -- copiati vengono sovrascritti correttamente.
                  -- Un componente SPENTO in attesa si copia SENZA marca e senza pratica
                  -- (D-3 di Tid, 2026-10-08, brief-db-righe-e-componenti-debiti-residui
                  -- §3): la pratica e' della rev N, e sulla rev N+1 non si esiterebbe
                  -- mai. Un attivo in attesa qui non arriva (guard di testa). Approvato e
                  -- rifiutato si copiano 1:1. ⚠️ La richiesta nuova alla riaccensione e'
                  -- dell'L3 dei componenti, che non esiste ancora: debito dichiarato.
                  INSERT INTO vendite.preventivi_righe_componenti (
                      riga_preventivo_id, articolo_componente_id, componente_id,
                      coeff_qta_snapshot, quantita, prezzo_unitario, iva_id,
                      origine_prezzo, prezzo_resolver_context,
                      stato_approvazione_prezzo, pratica_approvazione_prezzo_id,
                      uom_operativa_id, factor_to_base, qta_operativa,
                      ordine, attivo, meta,
                      user_insert, user_update
                  )
                  SELECT
                      v_new_riga_id,
                      prc.articolo_componente_id, prc.componente_id,
                      prc.coeff_qta_snapshot, prc.quantita, prc.prezzo_unitario, prc.iva_id,
                      prc.origine_prezzo, prc.prezzo_resolver_context,
                      CASE WHEN prc.attivo IS NOT TRUE AND prc.stato_approvazione_prezzo = 'PENDING'
                           THEN NULL ELSE prc.stato_approvazione_prezzo END,
                      CASE WHEN prc.attivo IS NOT TRUE AND prc.stato_approvazione_prezzo = 'PENDING'
                           THEN NULL ELSE prc.pratica_approvazione_prezzo_id END,
                      prc.uom_operativa_id, prc.factor_to_base, prc.qta_operativa,
                      prc.ordine, prc.attivo, prc.meta,
                      COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                    FROM vendite.preventivi_righe_componenti prc
                   WHERE prc.riga_preventivo_id = v_riga.id
                   ORDER BY prc.ordine, prc.id;
                END LOOP;

                -- Copia indirizzi
                INSERT INTO vendite.preventivi_indirizzi (
                  preventivo_id, tipo_indirizzo_id, snapshot,
                  origine_indirizzo_id, origine_soggetto_ruolo_id,
                  user_insert, user_update
                )
                SELECT
                  v_new_id, pi.tipo_indirizzo_id, pi.snapshot,
                  pi.origine_indirizzo_id, pi.origine_soggetto_ruolo_id,
                  COALESCE(p_user, CURRENT_USER), COALESCE(p_user, CURRENT_USER)
                FROM vendite.preventivi_indirizzi pi
                WHERE pi.preventivo_id = p_preventivo_id;

                -- Ritorna risultato
                RETURN QUERY
                SELECT v_new_id, v_numero, v_new_rev;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_espandi_listino_versione(p_listino_versione_id vendite.listini_versioni.id%TYPE, p_tipo_var vendite.contratti.tipo_variazione_globale%TYPE, p_valore_var vendite.contratti.valore_variazione_globale%TYPE)
               RETURNS TABLE(articolo_id catalogo.articoli.id%TYPE, articolo_codice catalogo.articoli.codice%TYPE, articolo_descrizione catalogo.articoli.descrizione%TYPE, is_composito catalogo.articoli.is_composito%TYPE, uom_id vendite.listini_righe.uom_id%TYPE, uom_codice catalogo.unita_misura.codice%TYPE, prezzo_listino vendite.listini_righe.prezzo%TYPE, prezzo_da_listino vendite.listini_righe.prezzo%TYPE, componenti jsonb)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: espande una versione di listino in righe piatte.
              --   STANDALONE (is_composito=FALSE): prezzo_da_listino = listino +/- variazione globale.
              --   BUNDLE (is_composito=TRUE): prezzo_da_listino = SUM(componenti) (NO variazione,
              --     come fn_contratto_righe_preview); componenti aggregati in jsonb.
              --   prezzo_listino: prezzo unitario di riga listino (NULL per bundle).
              -- Core condiviso: nessuna eccezione di dominio.
              BEGIN
                  IF p_listino_versione_id IS NULL THEN
                      RETURN;
                  END IF;

                  -- STANDALONE: articoli semplici dal listino, prezzo con variazione globale.
                  RETURN QUERY
                  SELECT
                      a.id,
                      a.codice,
                      a.descrizione,
                      FALSE,
                      lr.uom_id,
                      um.codice,
                      lr.prezzo,
                      CASE
                          WHEN p_tipo_var = 'PERCENTUALE'  THEN lr.prezzo * (1 + p_valore_var / 100.0)
                          WHEN p_tipo_var = 'VALORE_FISSO' THEN lr.prezzo + p_valore_var
                          ELSE                                  lr.prezzo
                      END,
                      NULL::jsonb
                    FROM vendite.listini_righe lr
                    JOIN catalogo.articoli a
                      ON a.id           = lr.articolo_id
                     AND a.is_composito = FALSE
                     AND a.attivo       = TRUE
                    JOIN catalogo.unita_misura um ON um.id = lr.uom_id
                   WHERE lr.listino_versione_id = p_listino_versione_id
                     AND lr.attivo              = TRUE;

                  -- BUNDLE: padri compositi; prezzo = SUM(componenti) (NO variazione).
                  RETURN QUERY
                  SELECT
                      a.id,
                      a.codice,
                      a.descrizione,
                      TRUE,
                      a.uom_id,
                      um.codice,
                      NULL::numeric,
                      bsum.somma,
                      bcomp.componenti
                    FROM (
                        SELECT DISTINCT lrc_p.articolo_padre_id
                          FROM vendite.listini_righe_componenti lrc_p
                         WHERE lrc_p.listino_versione_id = p_listino_versione_id
                           AND lrc_p.attivo              = TRUE
                           AND lrc_p.validita           @> (SELECT script.fn_data_operativa())
                    ) padri
                    JOIN catalogo.articoli a
                      ON a.id           = padri.articolo_padre_id
                     AND a.is_composito = TRUE
                     AND a.attivo       = TRUE
                    JOIN catalogo.unita_misura um ON um.id = a.uom_id
                    CROSS JOIN LATERAL (
                        SELECT SUM(lrc2.prezzo * ac2.coeff_qta) AS somma
                          FROM vendite.listini_righe_componenti lrc2
                          JOIN catalogo.articoli_componenti ac2
                            ON ac2.id = lrc2.articolo_componente_id
                         WHERE lrc2.listino_versione_id = p_listino_versione_id
                           AND lrc2.articolo_padre_id   = a.id
                           AND lrc2.attivo              = TRUE
                           AND lrc2.validita           @> (SELECT script.fn_data_operativa())
                    ) bsum
                    CROSS JOIN LATERAL (
                        SELECT jsonb_agg(jsonb_build_object(
                            'articolo_componente_id', ac.id,
                            'componente_id',          af.id,
                            'componente_codice',      af.codice,
                            'componente_descrizione', af.descrizione,
                            'uom_id',                 af.uom_id,
                            'uom_codice',             umf.codice,
                            'coeff_qta',              ac.coeff_qta,
                            'prezzo',                 lrc.prezzo,
                            'obbligatorio',           ac.obbligatorio,
                            'esposizione_in_fattura', ac.esposizione_in_fattura
                        ) ORDER BY lrc.id) AS componenti
                          FROM vendite.listini_righe_componenti lrc
                          JOIN catalogo.articoli_componenti ac
                            ON ac.id = lrc.articolo_componente_id
                          JOIN catalogo.articoli af
                            ON af.id = lrc.articolo_figlio_id
                          JOIN catalogo.unita_misura umf
                            ON umf.id = af.uom_id
                         WHERE lrc.listino_versione_id = p_listino_versione_id
                           AND lrc.articolo_padre_id   = a.id
                           AND lrc.attivo              = TRUE
                           AND lrc.validita           @> (SELECT script.fn_data_operativa())
                    ) bcomp;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_genera_ddt_da_ordine(p_ordine_id vendite.ordini.id%TYPE, p_righe jsonb DEFAULT NULL::jsonb, p_data vendite.ddt.data%TYPE DEFAULT script.fn_data_operativa())
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_sorg_ord_id     config.sorgenti.id%TYPE;
                  v_stato_draft_id  config.stati_doc_ddt.id%TYPE;
                  v_stato_ord       config.stati_doc_ordini.codice_interno%TYPE;
                  v_stato_target_id config.stati_doc_ordini.id%TYPE;
                  v_ordine_uid      vendite.ordini.uid%TYPE;
                  v_dest_ruolo_id   vendite.ordini.soggetto_ruolo_id%TYPE;
                  v_ddt_id          vendite.ddt.id%TYPE;
                  v_new_riga_id     vendite.ddt_righe.id%TYPE;
                  v_qta_base        vendite.ddt_righe.quantita%TYPE;
                  v_riga            RECORD;
                  v_residuo_base    numeric;
                  v_qta_op          numeric;
                  v_riga_nr         vendite.ddt_righe.riga_nr%TYPE := 0;
                  v_n_evase         integer := 0;
                  -- Il BERSAGLIO dei due rifiuti di evasione. ⚠️ `jsonb` esplicito: e' un
                  -- frammento del context, non il valore di una colonna.
                  v_bersagli        jsonb;
              BEGIN
                  -- 1) Guard input.
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_da_ordine','E_VALIDAZIONE',
                          jsonb_build_object('p_ordine_id', p_ordine_id),
                          NULL::uuid, 'p_ordine_id deve essere > 0');
                  END IF;

                  -- 2) Ordine esiste + stato evadibile.
                  SELECT o.uid, o.soggetto_ruolo_id, sdo.codice_interno
                    INTO v_ordine_uid, v_dest_ruolo_id, v_stato_ord
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini sdo ON sdo.id = o.stato_doc_ordine_id
                   WHERE o.id = p_ordine_id;

                  IF NOT FOUND THEN
                      -- ⛔ QUI NESSUN BERSAGLIO, ed e' una scelta. L'ordine non esiste —
                      --    oppure la RLS lo nasconde, che per chi opera e' la stessa cosa —
                      --    quindi non c'e' nessun posto dove mandarlo. Un pulsante che apre
                      --    il vuoto e' peggio di nessun pulsante (§4.3 del brief).
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_da_ordine','E_DDT_ORDINE_NOT_FOUND',
                          jsonb_build_object('ordine_id', p_ordine_id),
                          NULL::uuid, p_ordine_id::text);
                  END IF;

                  -- ⭐ IL BERSAGLIO, composto UNA VOLTA e riusato dai due rifiuti sotto.
                  --    Qui l'ordine e' certo: la SELECT sopra l'ha letto, quindi esiste ED
                  --    e' visibile a chi opera. Nessuna query in piu' — l'id ce l'abbiamo
                  --    gia' — e nessun ramo condizionale da mantenere.
                  --
                  -- ⚠️ Perche' serve, visto che l'operatore l'ordine lo sta gia' guardando:
                  --    l'evasione si lancia anche in massa, su piu' ordini in una passata, e
                  --    li' la frase dice QUALE ordine ha rifiutato ma non ci porta. E' lo
                  --    stesso caso del messaggio 937 dentro un giro di lotto.
                  v_bersagli := jsonb_build_array(
                      jsonb_build_object('tipo', 'ORDINE_VENDITA', 'id', p_ordine_id::text));

                  IF v_stato_ord NOT IN ('CONFERMATO','PARZIALMENTE_EVASO') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_da_ordine','E_DDT_ORDINE_STATO_NON_EVADIBILE',
                          jsonb_build_object('ordine_id', p_ordine_id, 'stato', v_stato_ord,
                                             'bersaglio', v_bersagli),
                          NULL::uuid, p_ordine_id::text, v_stato_ord);
                  END IF;

                  -- 3) Sorgente ORDINE_VENDITA (C1) + stato DRAFT DDT (per codice_interno).
                  SELECT id INTO v_sorg_ord_id FROM config.sorgenti
                   WHERE codice_interno = 'ORDINE_VENDITA' AND attivo IS TRUE;
                  SELECT id INTO v_stato_draft_id FROM config.stati_doc_ddt
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE;

                  -- 4) Testata DDT DRAFT. Billing/utility/valuta via trgfn_ddt_normalize.
                  INSERT INTO vendite.ddt (
                      data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                      sorgente_tipo_id, sorgente_uid)
                  VALUES (
                      COALESCE(p_data, (SELECT script.fn_data_operativa())), v_stato_draft_id, v_dest_ruolo_id,
                      v_sorg_ord_id, v_ordine_uid)
                  RETURNING id INTO v_ddt_id;

                  -- 4-bis) Cascata indirizzi (D-1): copia 1:1 gli snapshot dell'ordine
                  --   filtrati sui tipi ammessi in ambito DDT (di fatto solo CON).
                  --   origine_* propagati; idempotente (uno-per-tipo).
                  INSERT INTO vendite.ddt_indirizzi (
                      ddt_id, tipo_indirizzo_id, snapshot,
                      origine_indirizzo_id, origine_soggetto_ruolo_id)
                  SELECT v_ddt_id, oi.tipo_indirizzo_id, oi.snapshot,
                         oi.origine_indirizzo_id, oi.origine_soggetto_ruolo_id
                    FROM vendite.ordini_indirizzi oi
                    JOIN config.tipi_indirizzi_allowed a
                      ON a.tipo_indirizzo_id = oi.tipo_indirizzo_id
                     AND a.ambito = 'DDT'
                     AND a.attivo IS TRUE
                   WHERE oi.ordine_id = p_ordine_id
                  ON CONFLICT (ddt_id, tipo_indirizzo_id) DO NOTHING;

                  -- 5) Righe: copia snapshot A-2 + componenti + fulfillment.
                  FOR v_riga IN
                      SELECT orr.id AS ordine_riga_id, orr.articolo_id, orr.descrizione,
                             orr.prezzo_unitario, orr.sconto_percentuale, orr.iva_id,
                             orr.uom_operativa_id, orr.factor_to_base,
                             orr.quantita AS qta_ord_base,
                             COALESCE(orr.factor_to_base, 1) AS factor,
                             COALESCE((
                                 SELECT SUM(f.qta_evasa)
                                   FROM vendite.ordini_righe_fulfillment f
                                  WHERE f.ordine_riga_id = orr.id
                             ), 0) AS qta_evasa_prec,
                             a.is_composito,
                             (SELECT (elem->>'qta_da_evadere')::numeric
                                FROM jsonb_array_elements(COALESCE(p_righe,'[]'::jsonb)) elem
                               WHERE (elem->>'ordine_riga_id')::bigint = orr.id
                               LIMIT 1) AS qta_richiesta_op
                        FROM vendite.ordini_righe orr
                        JOIN catalogo.articoli a ON a.id = orr.articolo_id
                       WHERE orr.ordine_id = p_ordine_id
                         AND orr.attivo IS TRUE
                         AND (p_righe IS NULL OR orr.id IN (
                               SELECT (elem->>'ordine_riga_id')::bigint
                                 FROM jsonb_array_elements(p_righe) elem))
                       ORDER BY orr.riga_nr, orr.id
                  LOOP
                      v_residuo_base := v_riga.qta_ord_base - v_riga.qta_evasa_prec;
                      IF v_residuo_base <= 0 THEN
                          CONTINUE;  -- riga gia' evasa
                      END IF;

                      -- Qta da evadere in OPERATIVA: esplicito -> richiesto,
                      -- implicito -> tutto il residuo (residuo_base / factor).
                      IF p_righe IS NOT NULL THEN
                          v_qta_op := COALESCE(v_riga.qta_richiesta_op, 0);
                      ELSE
                          v_qta_op := v_residuo_base / v_riga.factor;
                      END IF;

                      IF v_qta_op IS NULL OR v_qta_op <= 0 THEN
                          CONTINUE;
                      END IF;
                      -- NB: over-shipping (v_qta_op*factor > residuo_base) e'
                      -- bloccato dal guard fulfillment (E_QTA_SUPERA_RESIDUO, C2).

                      v_riga_nr := v_riga_nr + 1;

                      -- Riga DDT (snapshot A-2). Padre composito: prezzo 0
                      -- placeholder (ricalcolato dai componenti). qta_operativa
                      -- valorizzata: il trigger qta_from_operativa deriva quantita.
                      INSERT INTO vendite.ddt_righe (
                          ddt_id, riga_nr, articolo_id, descrizione,
                          prezzo_unitario, sconto_percentuale, iva_id,
                          qta_operativa, uom_operativa_id, factor_to_base)
                      VALUES (
                          v_ddt_id, v_riga_nr, v_riga.articolo_id, v_riga.descrizione,
                          CASE WHEN v_riga.is_composito THEN 0 ELSE v_riga.prezzo_unitario END,
                          v_riga.sconto_percentuale, v_riga.iva_id,
                          v_qta_op, v_riga.uom_operativa_id, v_riga.factor_to_base)
                      RETURNING id, quantita INTO v_new_riga_id, v_qta_base;

                      -- Componenti CASO A (A-2): copia 1:1 (no resolver). La qta
                      -- del componente la scala m50_calcola_quantita (coeff*qta_padre);
                      -- il prezzo padre lo ricalcola z90_ricalcola_padre.
                      IF v_riga.is_composito THEN
                          INSERT INTO vendite.ddt_righe_componenti (
                              riga_ddt_id, articolo_componente_id, componente_id,
                              coeff_qta_snapshot, uom_operativa_id, factor_to_base,
                              qta_operativa, prezzo_unitario, iva_id, origine_prezzo,
                              prezzo_resolver_context, stato_approvazione_prezzo,
                              pratica_approvazione_prezzo_id, meta, ordine)
                          SELECT
                              v_new_riga_id, orc.articolo_componente_id, orc.componente_id,
                              orc.coeff_qta_snapshot, orc.uom_operativa_id, orc.factor_to_base,
                              orc.qta_operativa, orc.prezzo_unitario, orc.iva_id, orc.origine_prezzo,
                              orc.prezzo_resolver_context, orc.stato_approvazione_prezzo,
                              orc.pratica_approvazione_prezzo_id, orc.meta, orc.ordine
                            FROM vendite.ordini_righe_componenti orc
                           WHERE orc.riga_ordine_id = v_riga.ordine_riga_id
                             AND COALESCE(orc.attivo, TRUE) IS TRUE;
                      END IF;

                      -- Fulfillment: collega DDT<->ordine. Prima questa riga diceva
                      -- "e alimenta mv_ddt_ordini": quella vista materializzata e' stata
                      -- ritirata il 2026-08-05 (nessuno la leggeva, nessuno la
                      -- aggiornava). Il legame ordine<->DDT si ricava da qui e da
                      -- ddt.sorgente_uid, che e' cio' che l'applicazione usa davvero.
                      -- qta_evasa = quantita base della riga DDT (derivata dal trigger).
                      -- Il guard fulfillment valida articolo/uom/residuo (C2).
                      INSERT INTO vendite.ordini_righe_fulfillment (
                          ordine_riga_id, ddt_riga_id, qta_evasa)
                      VALUES (
                          v_riga.ordine_riga_id, v_new_riga_id, v_qta_base);

                      v_n_evase := v_n_evase + 1;
                  END LOOP;

                  -- 6) Idempotenza/completezza: se nulla da evadere -> errore
                  --    (rollback della testata orfana, atomico).
                  IF v_n_evase = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_da_ordine','E_DDT_NIENTE_DA_EVADERE',
                          jsonb_build_object('ordine_id', p_ordine_id, 'righe', p_righe,
                                             'bersaglio', v_bersagli),
                          NULL::uuid, p_ordine_id::text);
                  END IF;

                  -- 7) Proiezione stato ordine (C5), atomica. residuo 0 -> EVASO,
                  --    altrimenti PARZIALMENTE_EVASO. La transizione passa per
                  --    trgfn_ordini_guard_transizione (matrice).
                  IF NOT vendite.fn_ordine_ha_residuo_evasione(p_ordine_id) THEN
                      SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                       WHERE codice_interno = 'EVASO' AND attivo IS TRUE;
                  ELSE
                      SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                       WHERE codice_interno = 'PARZIALMENTE_EVASO' AND attivo IS TRUE;
                  END IF;

                  UPDATE vendite.ordini
                     SET stato_doc_ordine_id = v_stato_target_id
                   WHERE id = p_ordine_id
                     AND stato_doc_ordine_id IS DISTINCT FROM v_stato_target_id;

                  RETURN v_ddt_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_genera_ddt_riconsegna(p_reso_id vendite.resi.id%TYPE, p_righe jsonb DEFAULT NULL::jsonb, p_data vendite.ddt.data%TYPE DEFAULT script.fn_data_operativa())
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato          config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_draft_id config.stati_doc_ddt.id%TYPE;
                  v_sorg_ord_id    config.sorgenti.id%TYPE;
                  v_ordine_uid     vendite.ordini.uid%TYPE;
                  v_sorgente_tipo_id config.sorgenti.id%TYPE;
                  v_sorgente_uid   vendite.ddt.sorgente_uid%TYPE;
                  v_reso_uid       vendite.resi.uid%TYPE;
                  v_new_ddt_id     vendite.ddt.id%TYPE;
                  v_new_riga_id    vendite.ddt_righe.id%TYPE;
                  v_qta_base       vendite.ddt_righe.quantita%TYPE;
                  v_orig           RECORD;
                  v_riga           RECORD;
                  v_ord            RECORD;
                  v_stato_target_id config.stati_doc_ordini.id%TYPE;
                  v_residuo_ric    numeric;
                  v_qta_ric        numeric;
                  v_qta_op         numeric;
                  v_riga_nr        vendite.ddt_righe.riga_nr%TYPE := 0;
                  v_n              integer := 0;
              BEGIN
                  -- 1) Guard input.
                  IF p_reso_id IS NULL OR p_reso_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_riconsegna','E_VALIDAZIONE',
                          jsonb_build_object('p_reso_id', p_reso_id),
                          NULL::uuid, 'p_reso_id deve essere > 0');
                  END IF;

                  -- 2) Reso CONFERMATO + testata origine (DDT sorgente).
                  --    rev 2026-08-28 (Fase A): si legge anche il blocco
                  --    «relazione» — le colonne che dicono CON CHI e PERCHE'
                  --    la merce si muove. Sono le stesse per il viaggio di
                  --    andata e per la ri-consegna, perche' e' la stessa
                  --    relazione commerciale eseguita una seconda volta.
                  --
                  -- ⚠️ I tre LEFT JOIN di catalogo NON sono decorativi: le
                  --    colonne corrispondenti su vendite.ddt hanno un trigger
                  --    dbops.trgfn_child_requires_active_parent. Ereditare un
                  --    elemento RITIRATO DOPO farebbe FALLIRE la generazione
                  --    della ri-consegna. Filtrando su `attivo` la colonna
                  --    resta NULL — cioe' lo stato di prima di questa rev — e
                  --    il documento si genera lo stesso. Un'eredita' che puo'
                  --    impedire di generare e' un guasto nuovo, non una
                  --    comodita'.
                  --
                  -- ⚠️ Il LEFT JOIN sulla testata puo' non trovare niente:
                  --    resi.sorgente_uid e' NOT NULL ma nulla impone che il
                  --    tipo sia DDT_VENDITA. In quel caso v_orig.* resta
                  --    tutto NULL e NON si solleva: e' lo stato di oggi, e i
                  --    guard dell'emissione fanno gia' il loro mestiere.
                  SELECT sdr.codice_interno AS stato,
                         r.uid AS reso_uid,
                         d.id  AS ddt_origine_id,
                         d.destinatario_soggetto_ruolo_id, d.billing_account_id,
                         d.utility_id, d.valuta_id, d.emittente_fiscale_id,
                         ct.id AS causale_trasporto_id,
                         ab.id AS aspetto_bene_id,
                         ma.id AS modalita_addebito_trasporto_id,
                         d.mittente_soggetto_ruolo_id,
                         d.vettore_soggetto_ruolo_id,
                         d.fatturazione_immediata
                    INTO v_orig
                    FROM vendite.resi r
                    JOIN config.stati_doc_reso sdr ON sdr.id = r.stato_doc_reso_id
                    LEFT JOIN vendite.ddt d ON d.uid = r.sorgente_uid
                    LEFT JOIN config.causali_trasporto ct
                           ON ct.id = d.causale_trasporto_id AND ct.attivo IS TRUE
                    LEFT JOIN config.aspetti_beni ab
                           ON ab.id = d.aspetto_bene_id AND ab.attivo IS TRUE
                    LEFT JOIN config.modalita_addebito_trasporto ma
                           ON ma.id = d.modalita_addebito_trasporto_id AND ma.attivo IS TRUE
                   WHERE r.id = p_reso_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_riconsegna','E_RESO_NOT_FOUND',
                          jsonb_build_object('reso_id', p_reso_id),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  IF v_orig.stato IS DISTINCT FROM 'CONFERMATO' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_riconsegna','E_RESO_NON_CONFERMATO',
                          jsonb_build_object('reso_id', p_reso_id, 'stato', v_orig.stato),
                          NULL::uuid, p_reso_id::text, v_orig.stato);
                  END IF;

                  -- 3) Order-backing: ordine di provenienza (righe ri-consegna
                  --    condividono lo stesso ordine, o nessuno se standalone).
                  SELECT o.uid INTO v_ordine_uid
                    FROM vendite.resi_righe rr
                    JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                    JOIN vendite.ordini o         ON o.id = orr.ordine_id
                   WHERE rr.reso_id = p_reso_id
                     AND rr.ordine_riga_id IS NOT NULL
                   LIMIT 1;

                  -- rev 2026-08-28 (Fase D / R6): la sorgente si dichiara SEMPRE.
                  --   Order-backed -> ORDINE_VENDITA + uid dell'ordine (invariato).
                  --   Standalone   -> RESO_VENDITA  + uid del reso, che prima restava
                  --   NULL: il documento dichiarava di non venire da nessuna parte,
                  --   mentre viene da un reso, e su Transito/Passaggi quel DDT non
                  --   aveva origine.
                  --
                  -- config.sorgenti NON si tocca, ed e' la domanda che il brief si era
                  --   posto: key_selector governa la chiave POLIMORFA TESTUALE
                  --   (commesse_sorgenti, pratiche_sorgenti, le vw_stato_sorgente_*),
                  --   non questa colonna, che e' un uuid tipizzato. ORDINE_VENDITA e'
                  --   gia' a key_selector='id' e qui ci mette da sempre ordini.uid; e
                  --   vendite.fn_get_sorgente_documento_ref — quella che accende
                  --   l'azione «apri documento sorgente» — prova la via uuid PRIMA di
                  --   guardare il selettore, quindi risolve resi.uid e ne legge il
                  --   numero leggibile.
                  IF v_ordine_uid IS NOT NULL THEN
                      SELECT id INTO v_sorg_ord_id FROM config.sorgenti
                       WHERE codice_interno = 'ORDINE_VENDITA' AND attivo IS TRUE;
                      v_sorgente_tipo_id := v_sorg_ord_id;
                      v_sorgente_uid     := v_ordine_uid;
                  ELSE
                      SELECT id INTO v_sorgente_tipo_id FROM config.sorgenti
                       WHERE codice_interno = 'RESO_VENDITA' AND attivo IS TRUE;
                      -- Se il tipo non fosse a catalogo la colonna resta NULL, che e' il
                      --   comportamento di prima: un documento senza origine dichiarata.
                      --   NON si solleva — la ri-consegna e' merce che deve partire, e un
                      --   catalogo incompleto non e' un buon motivo per non farla partire.
                      v_sorgente_uid := CASE WHEN v_sorgente_tipo_id IS NOT NULL
                                             THEN v_orig.reso_uid END;
                  END IF;

                  SELECT id INTO v_stato_draft_id FROM config.stati_doc_ddt
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE;

                  -- 4) Nuovo DDT DRAFT. Denormalizzati dal DDT origine (normalize
                  --    COALESCE li preserva). Order-backed -> sorgente ORDINE_VENDITA.
                  --
                  -- ⭐ rev 2026-08-28 (Fase A, R1+R5): si eredita il blocco
                  --    «relazione». Il gemello fn_genera_ddt_da_ordine parte
                  --    da un ORDINE — che un blocco trasporto non ce l'ha
                  --    proprio — e ciononostante fa cascadere gli indirizzi;
                  --    qui si parte da un DDT, cioe' dall'unico documento che
                  --    quel blocco ce l'ha TUTTO. Non era un caso di nicchia:
                  --    era la stessa regola scritta in un posto e non
                  --    nell'altro.
                  --
                  -- ⛔ COSA NON SI COPIA, ED E' DELIBERATO. Qui sotto NON
                  --    compaiono, e nessuno le rimetta senza aver letto il
                  --    perche':
                  --      num_colli, peso_lordo, peso_netto, volume
                  --        -> sbagliati PER COSTRUZIONE, non «stantii»: la
                  --           ri-consegna porta un SOTTOINSIEME delle righe e
                  --           su quelle una FRAZIONE della quantita' (il
                  --           residuo di fn_resi_riga_residuo_riconsegna). Un
                  --           peso copiato e' il peso di un collo che non e'
                  --           quello che parte.
                  --      targa, autista
                  --        -> il mezzo e la persona di un viaggio GIA'
                  --           AVVENUTO. Sono una misura, non una scelta.
                  --      data_ora_partenza, data_ora_consegna_prev
                  --        -> date di un viaggio concluso, su un documento
                  --           che nasce in DRAFT.
                  --      tracking_code
                  --        -> il peggiore: punterebbe il cliente al COLLO
                  --           PRECEDENTE. Un codice di tracciamento copiato
                  --           non e' un campo vuoto, e' un'informazione
                  --           sbagliata data a un terzo.
                  --    Il criterio, in una riga: EREDITA CIO' CHE E' UNA
                  --    SCELTA, NON CIO' CHE E' UNA MISURA.
                  --
                  -- ⚠️ fatturazione_immediata e' NOT NULL DEFAULT false: il
                  --    COALESCE serve per il caso in cui la testata d'origine
                  --    non sia stata trovata. Non e' un cancello sulla doppia
                  --    fatturazione — quella e' gia' impedita a monte da
                  --    vw_partite_merce/fn_list_ddt_da_pushare — e' una
                  --    corsia di instradamento, cioe' un patto commerciale
                  --    come le altre colonne di questo blocco.
                  INSERT INTO vendite.ddt (
                      data, stato_doc_ddt_id, destinatario_soggetto_ruolo_id,
                      sorgente_tipo_id, sorgente_uid, billing_account_id,
                      utility_id, valuta_id, emittente_fiscale_id,
                      causale_trasporto_id, aspetto_bene_id,
                      modalita_addebito_trasporto_id,
                      mittente_soggetto_ruolo_id, vettore_soggetto_ruolo_id,
                      fatturazione_immediata)
                  VALUES (
                      COALESCE(p_data, (SELECT script.fn_data_operativa())), v_stato_draft_id,
                      v_orig.destinatario_soggetto_ruolo_id,
                      v_sorgente_tipo_id, v_sorgente_uid, v_orig.billing_account_id,
                      v_orig.utility_id, v_orig.valuta_id, v_orig.emittente_fiscale_id,
                      v_orig.causale_trasporto_id, v_orig.aspetto_bene_id,
                      v_orig.modalita_addebito_trasporto_id,
                      v_orig.mittente_soggetto_ruolo_id, v_orig.vettore_soggetto_ruolo_id,
                      COALESCE(v_orig.fatturazione_immediata, false))
                  RETURNING id INTO v_new_ddt_id;

                  -- 4-bis) Cascata indirizzi (R2): copia 1:1 gli snapshot del
                  --   DDT d'origine, filtrati sui tipi ammessi in ambito DDT.
                  --   origine_* propagati; idempotente (uno-per-tipo).
                  --   Modellata sul passo 4-bis di fn_genera_ddt_da_ordine.
                  --
                  -- ⭐ E' il pezzo che oggi BLOCCA l'emissione: senza
                  --   indirizzi, trgfn_ddt_guard_indirizzi_obbligatori alza
                  --   E_INDIRIZZO_DOC_OBBLIGATORIO su un documento che il
                  --   database ha generato da se'.
                  --
                  -- ⚠️ Il filtro su config.tipi_indirizzi_allowed SEMBRA
                  --   ridondante — le righe di ddt_indirizzi sono gia'
                  --   passate da trgfn_tipi_indirizzi_only_allowed('DDT') — e
                  --   non lo e': un tipo RITIRATO DOPO resterebbe sulle righe
                  --   vecchie e farebbe fallire questo INSERT contro lo
                  --   stesso trigger. E' cio' che rende la copia tollerante
                  --   al ritiro di un tipo.
                  --
                  -- ⚠️ Se la testata d'origine non e' stata trovata,
                  --   v_orig.ddt_origine_id e' NULL e questa INSERT non
                  --   inserisce niente: nessun ramo condizionale da
                  --   mantenere.
                  INSERT INTO vendite.ddt_indirizzi (
                      ddt_id, tipo_indirizzo_id, snapshot,
                      origine_indirizzo_id, origine_soggetto_ruolo_id)
                  SELECT v_new_ddt_id, di.tipo_indirizzo_id, di.snapshot,
                         di.origine_indirizzo_id, di.origine_soggetto_ruolo_id
                    FROM vendite.ddt_indirizzi di
                    JOIN config.tipi_indirizzi_allowed a
                      ON a.tipo_indirizzo_id = di.tipo_indirizzo_id
                     AND a.ambito = 'DDT'
                     AND a.attivo IS TRUE
                   WHERE di.ddt_id = v_orig.ddt_origine_id
                  ON CONFLICT (ddt_id, tipo_indirizzo_id) DO NOTHING;

                  -- 5) Righe ri-consegna con copertura residua.
                  --    rev 2026-07-26: il residuo viene dall'helper UNICO
                  --    fn_resi_riga_residuo_riconsegna, che sottrae anche le
                  --    RINUNCE. Cosi' la quota dichiarata definitiva non e' piu'
                  --    ri-spedibile: la richiesta viene troncata dal LEAST, e se
                  --    tutto e' rinunciato la riga si salta (CONTINUE) fino a
                  --    E_RESO_NESSUNA_RICONSEGNA_PENDENTE.
                  --
                  -- ⭐ rev 2026-08-28 (Fase A, R4+R4-quater): si legge anche
                  --    il VALORE dalla riga di DDT d'origine.
                  --    vendite.resi_righe.ddt_riga_id e' NOT NULL, quindi la
                  --    sorgente c'e' sempre — a un salto solo, ed e' la
                  --    stessa relazione da cui gia' arrivano articolo,
                  --    descrizione e UoM.
                  -- ⚠️ NON e' resi_righe la sorgente del valore: quella
                  --    tabella il prezzo NON ce l'ha (articolo, descrizione,
                  --    quantita', UoM, tipo, motivo — nessuna colonna di
                  --    valore). Il reso e' uno snapshot di QUANTITA', non di
                  --    VALORE. Chi cercasse il prezzo li' concluderebbe che
                  --    «non c'e'», mentre sta sulla riga a monte.
                  -- ⚠️ src_iva_id passa da un LEFT JOIN su config.iva
                  --    filtrato su `attivo`, per la stessa ragione del passo
                  --    2: vendite.ddt_righe ha un require_active_parent su
                  --    iva_id, e un'aliquota ritirata farebbe fallire
                  --    l'INSERT invece di lasciare il campo da scegliere.
                  FOR v_riga IN
                      SELECT rr.id AS resi_riga_id, rr.articolo_id, rr.descrizione,
                             rr.uom_operativa_id, COALESCE(rr.factor_to_base, 1) AS factor,
                             rr.quantita AS qta_resa, rr.ordine_riga_id,
                             dr_src.prezzo_unitario     AS src_prezzo_unitario,
                             dr_src.sconto_percentuale  AS src_sconto_percentuale,
                             iva_src.id                 AS src_iva_id,
                             vendite.fn_resi_riga_residuo_riconsegna(rr.id) AS residuo_ric,
                             (SELECT (e->>'qta')::numeric
                                FROM jsonb_array_elements(COALESCE(p_righe,'[]'::jsonb)) e
                               WHERE (e->>'resi_riga_id')::bigint = rr.id
                               LIMIT 1) AS qta_richiesta
                        FROM vendite.resi_righe rr
                        JOIN config.tipi_reso tr ON tr.id = rr.tipo_reso_id
                        JOIN vendite.ddt_righe dr_src ON dr_src.id = rr.ddt_riga_id
                        LEFT JOIN config.iva iva_src
                               ON iva_src.id = dr_src.iva_id AND iva_src.attivo IS TRUE
                       WHERE rr.reso_id = p_reso_id
                         AND rr.attivo IS TRUE
                         AND tr.riapre_residuo IS TRUE
                         AND (p_righe IS NULL OR rr.id IN (
                               SELECT (e->>'resi_riga_id')::bigint
                                 FROM jsonb_array_elements(p_righe) e))
                       ORDER BY rr.riga_nr, rr.id
                  LOOP
                      v_residuo_ric := v_riga.residuo_ric;   -- base, al netto di ric+rin
                      IF v_residuo_ric <= 0 THEN
                          CONTINUE;  -- gia' ri-consegnata o interamente rinunciata
                      END IF;

                      IF p_righe IS NOT NULL THEN
                          v_qta_ric := LEAST(COALESCE(v_riga.qta_richiesta, 0), v_residuo_ric);
                      ELSE
                          v_qta_ric := v_residuo_ric;
                      END IF;
                      IF v_qta_ric IS NULL OR v_qta_ric <= 0 THEN
                          CONTINUE;
                      END IF;

                      v_qta_op := v_qta_ric / v_riga.factor;
                      v_riga_nr := v_riga_nr + 1;

                      -- Riga DDT (qta_operativa -> quantita via qta_from_operativa).
                      --
                      -- ⛔ IL VALORE SI SCRIVE SOLO NELLO STANDALONE, e la
                      --    lettura sopra invece si fa sempre. Nell'ORDER-BACKED
                      --    il prezzo si risale a ordini_righe_fulfillment al
                      --    momento della lettura — e' il COALESCE di
                      --    fn_list_ddt_da_pushare, lo stesso che fa il punto 3
                      --    di script.fn_check_ddt_emittibile. Copiarlo qui
                      --    creerebbe una SECONDA copia di un numero che ha gia'
                      --    una sorgente, e le due divergono al primo cambio di
                      --    prezzo sull'ordine.
                      --    ⚠️ Nello STANDALONE quel secondo termine non esiste
                      --    (il passo 5 non scrive nessun fulfillment), quindi
                      --    senza questa copia la riga non ha NIENTE da cui
                      --    ereditare e il documento non si emette.
                      --
                      -- ⚠️ iva_id: la copia e' una MISURA DI ATTESA, non la
                      --    sede. Con il risolutore IVA la riga prendera'
                      --    l'aliquota DA LI', come ogni altra riga — il
                      --    documento a monte proietta, la fattura decide —
                      --    e QUESTA COPIA VA TOLTA, o saranno due meccanismi
                      --    per lo stesso campo. Finche' il risolutore non
                      --    c'e', copiarla e' meglio del NULL: una riga con
                      --    prezzo e senza aliquota entra in
                      --    vw_ddt_righe_iva_base (che filtra il prezzo e NON
                      --    l'aliquota) e produce una riga di riepilogo con
                      --    imponibile pieno, codice IVA vuoto e imposta zero.
                      INSERT INTO vendite.ddt_righe (
                          ddt_id, riga_nr, articolo_id, descrizione,
                          prezzo_unitario, sconto_percentuale, iva_id,
                          qta_operativa, uom_operativa_id, factor_to_base)
                      VALUES (
                          v_new_ddt_id, v_riga_nr, v_riga.articolo_id, v_riga.descrizione,
                          CASE WHEN v_riga.ordine_riga_id IS NULL
                               THEN v_riga.src_prezzo_unitario END,
                          CASE WHEN v_riga.ordine_riga_id IS NULL
                               THEN v_riga.src_sconto_percentuale END,
                          CASE WHEN v_riga.ordine_riga_id IS NULL
                               THEN v_riga.src_iva_id END,
                          v_qta_op, v_riga.uom_operativa_id, v_riga.factor)
                      RETURNING id, quantita INTO v_new_riga_id, v_qta_base;

                      -- Aggancio duro: ponte reso -> riga DDT (chiude la coda).
                      INSERT INTO vendite.resi_righe_riconsegne (
                          resi_riga_id, ddt_riga_id, qta)
                      VALUES (v_riga.resi_riga_id, v_new_riga_id, v_qta_base);

                      -- Order-backed: fulfillment -> chiude il residuo ordine
                      --   (guard reso-aware). Standalone -> nessun fulfillment.
                      IF v_riga.ordine_riga_id IS NOT NULL THEN
                          INSERT INTO vendite.ordini_righe_fulfillment (
                              ordine_riga_id, ddt_riga_id, qta_evasa)
                          VALUES (v_riga.ordine_riga_id, v_new_riga_id, v_qta_base);
                      END IF;

                      v_n := v_n + 1;
                  END LOOP;

                  -- 6) Nessuna ri-consegna pendente -> errore (rollback testata orfana).
                  IF v_n = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite','fn_genera_ddt_riconsegna','E_RESO_NESSUNA_RICONSEGNA_PENDENTE',
                          jsonb_build_object('reso_id', p_reso_id, 'righe', p_righe),
                          NULL::uuid, p_reso_id::text);
                  END IF;

                  -- 7) Ri-proiezione stato ordine per gli ordini coinvolti: il
                  --    fulfillment appena creato ha chiuso (in tutto o in parte)
                  --    il residuo riaperto dal reso -> allinea lo stato ordine.
                  FOR v_ord IN
                      SELECT DISTINCT orr.ordine_id
                        FROM vendite.resi_righe rr
                        JOIN vendite.ordini_righe orr ON orr.id = rr.ordine_riga_id
                       WHERE rr.reso_id = p_reso_id
                         AND rr.ordine_riga_id IS NOT NULL
                  LOOP
                      IF vendite.fn_ordine_ha_residuo_evasione(v_ord.ordine_id) THEN
                          SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                           WHERE codice_interno = 'PARZIALMENTE_EVASO' AND attivo IS TRUE;
                      ELSE
                          SELECT id INTO v_stato_target_id FROM config.stati_doc_ordini
                           WHERE codice_interno = 'EVASO' AND attivo IS TRUE;
                      END IF;
                      UPDATE vendite.ordini
                         SET stato_doc_ordine_id = v_stato_target_id
                       WHERE id = v_ord.ordine_id
                         AND stato_doc_ordine_id IS DISTINCT FROM v_stato_target_id;
                  END LOOP;

                  RETURN v_new_ddt_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_list_contratti_da_pushare(p_competenza_mese vendite.attivita_fatturabili.competenza_mese%TYPE DEFAULT NULL::date, p_billing_account_id vendite.contratti.billing_account_id%TYPE DEFAULT NULL::bigint, p_limit integer DEFAULT NULL::integer, p_contratto_id vendite.contratti.id%TYPE DEFAULT NULL::bigint)
               RETURNS TABLE(contratto_id vendite.contratti.id%TYPE, contratto_uid vendite.contratti.uid%TYPE, riga_id vendite.contratti_righe.id%TYPE, billing_account_id vendite.contratti.billing_account_id%TYPE, utility_id vendite.contratti.utility_id%TYPE, emittente_soggetto_ruolo_id bigint, competenza_dal vendite.contratti.valido_dal%TYPE, competenza_al vendite.contratti.valido_al%TYPE, fatturazione_immediata vendite.contratti.fatturazione_immediata%TYPE, sorgente_tipo_id vendite.contratti.sorgente_tipo_id%TYPE, sorgente_uid text, segment_key character varying, articolo_id vendite.contratti_righe.articolo_id%TYPE, istanza_utility_id vendite.contratti.istanza_utility_id%TYPE, data_attivita date, uom_id catalogo.articoli.uom_id%TYPE, quantita vendite.contratti_righe.quantita%TYPE, qta_operativa vendite.contratti_righe.qta_operativa%TYPE, uom_operativa_id vendite.contratti_righe.uom_operativa_id%TYPE, factor_to_base vendite.contratti_righe.factor_to_base%TYPE, competenza_mese vendite.attivita_fatturabili.competenza_mese%TYPE, prezzo_snapshot vendite.contratti_righe.prezzo_unitario%TYPE, prezzo_bloccato boolean, pricing_mode character varying, tipo_movimento character varying, tipo_consumo vendite.contratti_righe.tipo_erogazione%TYPE, valuta_id integer, meta jsonb, tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE, termine_pagamento_id bigint, modalita_pagamento_id integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_sorgente_tipo_id    config.sorgenti.id%TYPE;
                v_tipo_doc_fiscale_id config.sorgenti.tipo_doc_fiscale_id%TYPE;
                v_stato_attivo_id     config.stati_doc_contratti.id%TYPE;
              BEGIN
                -- rev 2026-06-28 (analisi-hardcoded-codice §3a): sorgente/stato
                -- risolti per codice_interno (immutabile), non per codice (mutabile).
                -- rev 2026-07-27 (brief emissione mirata PARTE B): fatturazione_immediata
                -- proiettata dalla COLONNA (era la costante FALSE). Il valore instrada
                -- la corsia via chiave di dedup di fn_get_or_create_commessa.
                -- rev 2026-10-04 (brief-db-erogazione-obbligatoria-righe-fatturate R4):
                -- le righe ESCLUSIONE non si listano (l'esclusione non si fattura: prima
                -- arrivavano in commessa senza prezzo, e il resolver risponde
                -- E_ARTICOLO_ESCLUSO_DA_CONTRATTO); tipo_consumo e' l'erogazione della riga,
                -- senza ripiego su CANONE (obbligatoria per CHECK su ogni riga listata).
                IF p_contratto_id IS NOT NULL AND p_contratto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_PUSH_SORGENTE_ID_INVALIDO',
                    jsonb_build_object('parametro', 'p_contratto_id', 'valore', p_contratto_id),
                    NULL::uuid,
                    'p_contratto_id', p_contratto_id::text
                  );
                END IF;

                SELECT s.id, s.tipo_doc_fiscale_id
                  INTO v_sorgente_tipo_id, v_tipo_doc_fiscale_id
                FROM config.sorgenti s
                WHERE s.codice_interno = 'CONTRATTO' AND s.attivo IS TRUE LIMIT 1;

                IF v_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_list_contratti_da_pushare', 'E_CODICE',
                    jsonb_build_object('codice', 'CONTRATTO'),
                    NULL::uuid, 'CONTRATTO', 'config.sorgenti'
                  );
                END IF;

                SELECT s.id INTO v_stato_attivo_id
                FROM config.stati_doc_contratti s
                WHERE s.codice_interno = 'ATTIVO' AND s.attivo IS TRUE LIMIT 1;

                RETURN QUERY
                SELECT
                  c.id, c.uid, cr.id,
                  c.billing_account_id,
                  c.utility_id,
                  anagrafiche.fn_get_emittente_fiscale_id(c.billing_account_id),
                  c.valido_dal, c.valido_al,
                  -- Corsia di instradamento: valore reale del contratto.
                  c.fatturazione_immediata,
                  v_sorgente_tipo_id,
                  c.uid::text,
                  ('CONTR:' || c.uid::text || ':R:' || cr.id::text || ':M:' ||
                   to_char(date_trunc('month', COALESCE(c.valido_dal, c.data))::date, 'YYYY-MM'))::varchar,
                  cr.articolo_id,
                  c.istanza_utility_id,
                  COALESCE(c.valido_dal, c.data),
                  -- uom_id canonica da catalogo.articoli (fix bug proiezione NULL)
                  a.uom_id,
                  cr.quantita,
                  cr.qta_operativa,
                  cr.uom_operativa_id,
                  COALESCE(cr.factor_to_base, 1::numeric),
                  date_trunc('month', COALESCE(c.valido_dal, c.data))::date,
                  cr.prezzo_unitario,
                  -- prezzo_bloccato: dipende dalla RIGA (prezzo valorizzato),
                  -- INDIPENDENTE dal flag di corsia. Vedi header del changeSet.
                  (cr.prezzo_unitario IS NOT NULL),
                  'FIXED'::varchar,
                  'NORMALE'::varchar,
                  -- Erogazione della riga, senza ripiego: obbligatoria su ogni riga che
                  -- non e' ESCLUSIONE (chk_contrighe_erogazione_per_tipo_eccezione), e le
                  -- ESCLUSIONE qui non arrivano.
                  cr.tipo_erogazione::varchar,
                  NULL::integer,
                  jsonb_build_object(
                    'contratto_numero',    c.numero,
                    'periodicita',         cr.periodicita,
                    'generazione_canone',  cr.generazione_canone,
                    'competenza_canone',   cr.competenza_canone,
                    'tipo_erogazione',     cr.tipo_erogazione,
                    'tipo_commessa',       'AUTO',
                    'policy_fatturazione', 'DA_DOCUMENTO'
                  ),
                  v_tipo_doc_fiscale_id,
                  NULL::bigint,
                  NULL::integer
                FROM vendite.contratti c
                JOIN vendite.contratti_righe cr
                  ON cr.contratto_id = c.id
                 AND COALESCE(cr.attivo, TRUE) IS TRUE
                 -- L'esclusione non si fattura: dice solo che il contratto non vende
                 -- quell'articolo del listino.
                 AND cr.tipo_eccezione <> 'ESCLUSIONE'::vendite.tipo_eccezione_contratto
                JOIN catalogo.articoli a ON a.id = cr.articolo_id
                WHERE c.billing_account_id IS NOT NULL
                  AND (v_stato_attivo_id IS NULL OR c.stato_doc_contratto_id = v_stato_attivo_id)
                  AND (c.valido_al IS NULL OR c.valido_al >= COALESCE(p_competenza_mese, (SELECT script.fn_data_operativa())))
                  AND (p_competenza_mese IS NULL
                       OR date_trunc('month', COALESCE(c.valido_dal, c.data))::date = p_competenza_mese)
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_contratto_id IS NULL OR c.id = p_contratto_id)
                  -- Esclusione "gia' inviato": eleggibile solo se MAI
                  -- instradata (LIBERA) — classificatore condiviso coi rami
                  -- reason della capability: vede anche i componenti #CMP e
                  -- non dipende piu' da stato_emissione (ALLOCATA basta).
                  AND script.fn_get_stato_push_segment(
                        'CONTR:' || c.uid::text || ':R:' || cr.id::text || ':M:' || to_char(date_trunc('month', COALESCE(c.valido_dal, c.data))::date, 'YYYY-MM')) = 'LIBERA'
                ORDER BY c.id, cr.id
                LIMIT p_limit;
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_listino_versione_operativa(p_listino_id vendite.listini.id%TYPE, p_listino_versione_id vendite.listini_versioni.id%TYPE)
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: la versione di listino che governa un documento con eccezioni
              --   (contratto, offerta), dai VALORI della sua testata: la versione
              --   fissata se c'e'; altrimenti quella in vigore oggi
              --   (vendite.fn_listino_versione_in_vigore); NULL senza listino o
              --   senza una versione in vigore.
              -- ⭐ Sui valori e non sull'id del documento: la chiamano anche i
              --   guard BEFORE ROW di emissione e attivazione, che hanno in mano NEW
              --   e congelano QUESTA versione nella stessa scrittura. Una funzione
              --   per id leggerebbe la riga di prima.
              -- ⛔ Non STRICT: un listino senza versione fissata (NULL) e' il caso
              --   normale di un documento in bozza.
              BEGIN
                  IF p_listino_versione_id IS NOT NULL THEN
                      RETURN p_listino_versione_id;
                  END IF;

                  IF p_listino_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  RETURN vendite.fn_listino_versione_in_vigore(p_listino_id, script.fn_data_operativa());
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_push_preventivo_a_ordine(p_preventivo_id vendite.preventivi.id%TYPE, p_righe_ids bigint[] DEFAULT NULL::bigint[], p_pratica_id pratiche.pratiche.id%TYPE DEFAULT NULL::bigint, p_fatturazione_trigger vendite.ordini.fatturazione_trigger%TYPE DEFAULT NULL::character varying, p_flusso_id pratiche.flussi.id%TYPE DEFAULT NULL::bigint)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_accettato_id   config.stati_doc_preventivi.id%TYPE;
                  v_stato_draft_ord_id   config.stati_doc_ordini.id%TYPE;
                  v_stato_evaso_id       config.stati_doc_preventivi.id%TYPE;
                  v_ba_id                vendite.preventivi.billing_account_id%TYPE;
                  v_utility_id           vendite.preventivi.utility_id%TYPE;
                  v_emittente_fiscale_id vendite.preventivi.emittente_fiscale_id%TYPE;
                  v_valuta_id            vendite.preventivi.valuta_id%TYPE;
                  v_termine_pag_id       vendite.preventivi.termine_pagamento_id%TYPE;
                  v_preventivo_uid       vendite.preventivi.uid%TYPE;
                  -- Il BERSAGLIO del rifiuto. ⚠️ `jsonb` esplicito: e' un frammento del
                  -- context, non il valore di una colonna.
                  v_bersagli             jsonb;
                  v_soggetto_ruolo_id    vendite.ordini.soggetto_ruolo_id%TYPE;
                  v_emittente_sr_id      anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE;
                  v_fatt_trigger         vendite.ordini.fatturazione_trigger%TYPE;
                  v_data                 vendite.ordini.data%TYPE := script.fn_data_operativa();
                  v_n_residue            integer;
                  v_ordine_id            vendite.ordini.id%TYPE;
                  v_new_riga_id          vendite.ordini_righe.id%TYPE;
                  v_overrides            jsonb;
                  v_sorg_prev_id         config.sorgenti.id%TYPE;
                  v_sorg_ord_id          config.sorgenti.id%TYPE;
                  v_riga                 RECORD;
              BEGIN
                  -- 1) Guard input.
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine', 'E_VALIDAZIONE',
                          jsonb_build_object('p_preventivo_id', p_preventivo_id),
                          NULL::uuid, 'p_preventivo_id deve essere > 0');
                  END IF;

                  -- 2) Stato ACCETTATO obbligatorio + lettura testata preventivo.
                  SELECT id INTO v_stato_accettato_id
                    FROM config.stati_doc_preventivi
                   WHERE codice_interno = 'ACCETTATO' AND attivo IS TRUE;

                  SELECT p.billing_account_id, p.utility_id, p.emittente_fiscale_id,
                         p.valuta_id, p.termine_pagamento_id, p.uid
                    INTO v_ba_id, v_utility_id, v_emittente_fiscale_id,
                         v_valuta_id, v_termine_pag_id, v_preventivo_uid
                    FROM vendite.preventivi p
                   WHERE p.id = p_preventivo_id
                     AND p.stato_doc_preventivo_id = v_stato_accettato_id;

                  IF NOT FOUND THEN
                      -- Preventivo inesistente o non ACCETTATO: stesso errore parlante.
                      --
                      -- ⭐ IL BERSAGLIO, e qui va SUL PREVENTIVO: a differenza dei guard di
                      --    idempotenza dell'offerta, la cosa da raggiungere e' proprio il
                      --    documento nominato — l'operatore deve andarci per accettarlo.
                      --
                      -- ⭐ E SI CITA PER UID, non per id. E' il primo uso reale di
                      --    config.tipi_entita.key_selector: il preventivo, come l'offerta,
                      --    il progetto lo indirizza da fuori con l'uid (la stessa scelta di
                      --    config.sorgenti). Mandare l'id numerico avrebbe prodotto un
                      --    pulsante che non apre niente.
                      --
                      -- ⛔ E SOLO SE ESISTE. Questo errore copre due casi — «non c'e'» e
                      --    «c'e' ma non e' ACCETTATO» — e solo il secondo ha un posto dove
                      --    mandare qualcuno. Se il preventivo non esiste (o non e' visibile,
                      --    che per chi opera e' la stessa cosa) il messaggio si mostra lo
                      --    stesso e il pulsante non compare: il bersaglio e' un'offerta, non
                      --    una promessa.
                      --
                      -- ⚠️ La lettura e' SENZA il filtro di stato — quello di sopra ha appena
                      --    fallito proprio per lo stato: rimetterlo qui darebbe sempre NULL.
                      -- ⚠️ L'ID, non l'uid — correzione del 2026-08-24 su rilievo del backend.
                      --    Al primo giro qui c'era `pv.uid::text`, ereditato da
                      --    `config.sorgenti.key_selector`. Misurato: le rotte del preventivo
                      --    sono `<int:preventivo_id>` e gli endpoint che accettano un uid
                      --    sono ZERO — quel bersaglio avrebbe prodotto un pulsante che non
                      --    apre niente.
                      --    ⭐ Le due colonne si chiamano uguale e rispondono a domande
                      --    diverse: `config.sorgenti` dice con quale chiave il LINEAGE
                      --    collega il documento, `config.tipi_entita` con quale chiave lo si
                      --    RAGGIUNGE. Il valore si misura sulle rotte, non si eredita.
                      SELECT jsonb_build_array(jsonb_build_object('tipo', 'PREVENTIVO',
                                                                  'id',   pv.id::text))
                        INTO v_bersagli
                        FROM vendite.preventivi pv
                       WHERE pv.id = p_preventivo_id;

                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine',
                          'E_VENDITA_PREVENTIVO_PUSH_STATO_NON_AMMESSO',
                          -- ⚠️ La chiave si aggiunge solo se c'e' qualcosa da dire: una
                          --    chiave a NULL sarebbe letta come bersaglio malformato.
                          jsonb_build_object('preventivo_id', p_preventivo_id)
                          || CASE WHEN v_bersagli IS NULL THEN '{}'::jsonb
                                  ELSE jsonb_build_object('bersaglio', v_bersagli) END,
                          NULL::uuid, p_preventivo_id::text);
                  END IF;

                  -- Cliente (soggetto_ruolo) dal billing_account; emittente soggetto_ruolo
                  -- per l'init componenti BoM.
                  SELECT soggetto_ruolo_id INTO v_soggetto_ruolo_id
                    FROM anagrafiche.billing_account WHERE id = v_ba_id;
                  SELECT soggetto_ruolo_id INTO v_emittente_sr_id
                    FROM anagrafiche.emittenti_fiscali WHERE id = v_emittente_fiscale_id;

                  SELECT id INTO v_stato_draft_ord_id
                    FROM config.stati_doc_ordini
                   WHERE codice_interno = 'DRAFT' AND attivo IS TRUE;

                  v_fatt_trigger := p_fatturazione_trigger;   -- NULL = «non scelto» -> eredita dal BA (trgfn_ordini_normalize)

                  -- 3) Conta le righe RESIDUE da smistare a ORDINE leggendo la
                  --    vista-predicato unica (MERCE + ATTIVA + non gia' allocata),
                  --    ristretta al sottoinsieme richiesto (D5 idempotenza di riga).
                  SELECT count(*) INTO v_n_residue
                    FROM vendite.vw_preventivi_righe_smistabili_ordine v
                   WHERE v.preventivo_id = p_preventivo_id
                     AND (p_righe_ids IS NULL OR v.id = ANY(p_righe_ids));

                  IF v_n_residue = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_preventivo_a_ordine',
                          'E_VENDITA_PREVENTIVO_NESSUNA_RIGA_ORDINE',
                          jsonb_build_object('preventivo_id', p_preventivo_id,
                                             'righe_ids', to_jsonb(p_righe_ids)),
                          NULL::uuid, p_preventivo_id::text);
                  END IF;

                  -- 4) Testata ordine: DRAFT, documento_origine = (PREVENTIVO, id).
                  --    numero/serie/anno li genera il trigger trgfn_ordini_gen_numero
                  --    (motore dei registri, 20260831-*; fino al 2026-09-13 qui c'era il
                  --    nome morto trgfn_ordini_gen_codice — brief prefisso-sul-registro 6.3).
                  INSERT INTO vendite.ordini (
                      soggetto_ruolo_id, billing_account_id, utility_id, valuta_id,
                      termine_pagamento_id, emittente_fiscale_id, data,
                      stato_doc_ordine_id, fatturazione_trigger,
                      documento_origine_tipo, documento_origine_id)
                  VALUES (
                      v_soggetto_ruolo_id, v_ba_id, v_utility_id, v_valuta_id,
                      v_termine_pag_id, v_emittente_fiscale_id, v_data,
                      v_stato_draft_ord_id, v_fatt_trigger,
                      'PREVENTIVO', p_preventivo_id)
                  RETURNING id INTO v_ordine_id;

                  -- 4-bis) Cascata indirizzi (D-1): copia 1:1 gli snapshot del
                  --   preventivo filtrati sui tipi ammessi in ambito ORDINI.
                  --   origine_* propagati; idempotente (uno-per-tipo).
                  INSERT INTO vendite.ordini_indirizzi (
                      ordine_id, tipo_indirizzo_id, snapshot,
                      origine_indirizzo_id, origine_soggetto_ruolo_id)
                  SELECT v_ordine_id, pi.tipo_indirizzo_id, pi.snapshot,
                         pi.origine_indirizzo_id, pi.origine_soggetto_ruolo_id
                    FROM vendite.preventivi_indirizzi pi
                    JOIN config.tipi_indirizzi_allowed a
                      ON a.tipo_indirizzo_id = pi.tipo_indirizzo_id
                     AND a.ambito = 'ORDINI'
                     AND a.attivo IS TRUE
                   WHERE pi.preventivo_id = p_preventivo_id
                  ON CONFLICT (ordine_id, tipo_indirizzo_id) DO NOTHING;

                  -- 5) Copia le righe residue (snapshot prezzi) dalla vista-predicato.
                  --    La INNER JOIN a catalogo.articoli e' PROIEZIONE: serve
                  --    is_composito e, come oggi, scarta righe senza articolo.
                  --    riga_nr progressivo; quantita derivata dal trigger
                  --    qta_from_operativa; link di riga preventivo_riga_id (idempotenza).
                  FOR v_riga IN
                      SELECT v.id AS riga_id, v.articolo_id, v.descrizione,
                             v.prezzo_unitario, v.sconto_percentuale, v.iva_id,
                             v.qta_operativa, v.uom_operativa_id, v.factor_to_base,
                             -- rev 2026-09-13 (P-5): la data chiesta dal cliente sulla riga di
                             -- preventivo, esposta dalla vista in 20260913-16. Si porta avanti
                             -- qui, nel punto in cui il documento cambia natura, o si perde.
                             v.data_consegna_richiesta_cliente,
                             a.is_composito,
                             row_number() OVER (ORDER BY v.ordine NULLS LAST, v.id) AS rn
                        FROM vendite.vw_preventivi_righe_smistabili_ordine v
                        JOIN catalogo.articoli a ON a.id = v.articolo_id
                       WHERE v.preventivo_id = p_preventivo_id
                         AND (p_righe_ids IS NULL OR v.id = ANY(p_righe_ids))
                       ORDER BY rn
                  LOOP
                      INSERT INTO vendite.ordini_righe (
                          ordine_id, riga_nr, articolo_id, descrizione,
                          prezzo_unitario, sconto_percentuale, iva_id,
                          qta_operativa, uom_operativa_id, factor_to_base,
                          stato_doc_ordine_id, preventivo_riga_id,
                          data_consegna_richiesta_cliente)
                      VALUES (
                          v_ordine_id, v_riga.rn::integer, v_riga.articolo_id,
                          COALESCE(v_riga.descrizione,
                                   (SELECT descrizione FROM catalogo.articoli
                                     WHERE id = v_riga.articolo_id)),
                          -- Padre composito: 0 placeholder, il prezzo lo ricalcola
                          -- il trigger dai componenti inizializzati sotto.
                          CASE WHEN v_riga.is_composito THEN 0 ELSE v_riga.prezzo_unitario END,
                          COALESCE(v_riga.sconto_percentuale, 0), v_riga.iva_id,
                          v_riga.qta_operativa, v_riga.uom_operativa_id,
                          COALESCE(v_riga.factor_to_base, 1),
                          v_stato_draft_ord_id, v_riga.riga_id,
                          -- La richiesta del cliente si copia; la conferma (nostra) resta
                          -- NULL: su un preventivo non c'e' ancora niente da confermare.
                          v_riga.data_consegna_richiesta_cliente)
                      RETURNING id INTO v_new_riga_id;

                      -- 6) BoM CASO A: prezzi snapshot del preventivo come override
                      --    (no ri-prezzatura). Stesso pattern del push offerta->ordine.
                      IF v_riga.is_composito THEN
                          SELECT jsonb_object_agg(prc.componente_id::text, prc.prezzo_unitario)
                            INTO v_overrides
                            FROM vendite.preventivi_righe_componenti prc
                           WHERE prc.riga_preventivo_id = v_riga.riga_id
                             AND COALESCE(prc.attivo, TRUE) IS TRUE
                             AND prc.prezzo_unitario <> 0;

                          PERFORM vendite.fn_ordine_riga_componenti_init(
                              v_new_riga_id, v_emittente_sr_id, v_data, v_overrides);
                      END IF;
                  END LOOP;

                  -- 7) Aggancio pratica (D4, solo se la pratica esiste):
                  --    preventivo ROOT + ordine COLLEGATO. Idempotente.
                  --    D-B: il link COLLEGATO valorizza flusso_id (p_flusso_id) =
                  --    flusso dello step generatore; NULL retro-compatibile.
                  IF p_pratica_id IS NOT NULL THEN
                      SELECT id INTO v_sorg_prev_id FROM config.sorgenti
                       WHERE codice_interno = 'PREVENTIVO';
                      SELECT id INTO v_sorg_ord_id FROM config.sorgenti
                       WHERE codice_interno = 'ORDINE_VENDITA';

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id, sorgente_tipo_id, sorgente_uid, ruolo_link)
                      VALUES (p_pratica_id, v_sorg_prev_id, v_preventivo_uid::text, 'ROOT')
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id, sorgente_tipo_id, sorgente_uid, ruolo_link, flusso_id)
                      VALUES (p_pratica_id, v_sorg_ord_id, v_ordine_id::text, 'COLLEGATO', p_flusso_id)
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;
                  END IF;

                  -- 8) Gate EVASO bi-ramo (atomico con la creazione ordine, finding #10):
                  --    se non resta residuo smistabile su NESSUN ramo (merce->ordine +
                  --    servizi->commessa, predicati DB simmetrici) il preventivo ACCETTATO
                  --    transita a EVASO. Sostituisce la chiamata separata (non atomica)
                  --    transiziona_a_evaso_se_smistato del service: la transizione ora
                  --    rolla insieme all'ordine se qualcosa fallisce.
                  IF NOT vendite.fn_preventivo_ha_residuo_ordine(p_preventivo_id)
                     AND NOT vendite.fn_preventivo_ha_residuo_commessa(p_preventivo_id) THEN
                      SELECT id INTO v_stato_evaso_id
                        FROM config.stati_doc_preventivi
                       WHERE codice_interno = 'EVASO' AND attivo IS TRUE;
                      IF NOT FOUND THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_push_preventivo_a_ordine', 'E_CONFIG_MANCANTE',
                              jsonb_build_object('config', 'config.stati_doc_preventivi.EVASO'),
                              NULL::uuid, 'stato EVASO (config.stati_doc_preventivi)');
                      END IF;
                      UPDATE vendite.preventivi
                         SET stato_doc_preventivo_id = v_stato_evaso_id
                       WHERE id = p_preventivo_id;
                  END IF;

                  RETURN v_ordine_id;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_select_attivita_fatturabili(p_competenza_mese vendite.attivita_fatturabili.competenza_mese%TYPE, p_tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE, p_lock_batch_id vendite.attivita_fatturabili.lock_batch_id%TYPE DEFAULT NULL::uuid, p_lock boolean DEFAULT false, p_data_fatturazione vendite.fatture.data%TYPE DEFAULT script.fn_data_operativa(), p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint, p_utility_id config.utilities.id%TYPE DEFAULT NULL::integer, p_valuta_id config.valute.id%TYPE DEFAULT NULL::integer, p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL::bigint, p_area_geografica_id vendite.attivita_fatturabili.area_geografica_id%TYPE DEFAULT NULL::bigint, p_limit integer DEFAULT NULL::integer, p_gruppi text[] DEFAULT NULL::text[])
               RETURNS SETOF vendite.attivita_fatturabili
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: seleziona (e opzionalmente blocca) le attivita' fatturabili
              --        eleggibili di un perimetro, marcandole stato_esecuzione=PENDING.
              -- rev 2026-06-19: FOR UPDATE OF a (lock ristretto ad attivita_fatturabili).
              -- rev 2026-07-27 (brief emissione mirata A4): p_gruppi restringe la
              --        selezione ai GRUPPI FATTURABILI richiesti. E' il secondo e
              --        decisivo punto di applicazione del perimetro mirato: qui si
              --        filtrano le AF GIA' ESISTENTI, che il filtro sul pull
              --        (fn_emit_attivita_fatturabili_da_commessa) non puo' vedere.
              DECLARE
                  v_competenza vendite.attivita_fatturabili.competenza_mese%TYPE;
                  v_data_fatturazione vendite.fatture.data%TYPE;
                  v_where TEXT;
                  v_join TEXT;
                  v_limit TEXT;
                  v_sql TEXT;
              BEGIN
                  IF p_competenza_mese IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_competenza_mese', 'valore', NULL), NULL::uuid, 'p_competenza_mese obbligatoria');
                  END IF;
                  IF p_tipo_doc_fiscale_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', NULL), NULL::uuid, 'p_tipo_doc_fiscale_id obbligatorio');
                  END IF;
                  IF p_lock AND p_lock_batch_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_select_attivita_fatturabili', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lock_batch_id', 'valore', NULL), NULL::uuid, 'p_lock_batch_id obbligatorio quando p_lock=true');
                  END IF;

                  v_competenza := date_trunc('month', p_competenza_mese)::DATE;
                  v_data_fatturazione := COALESCE(p_data_fatturazione, script.fn_data_operativa());

                  v_where := ' WHERE a.approvato IS TRUE AND a.fatturato IS FALSE AND a.sospesa IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE'
                      || ' AND (a.posticipa_al IS NULL OR a.posticipa_al <= ' || quote_literal(v_data_fatturazione) || ')'
                      || ' AND a.competenza_mese <= ' || quote_literal(v_competenza)
                      || ' AND a.tipo_doc_fiscale_id = ' || quote_literal(p_tipo_doc_fiscale_id);

                  -- 🔴 D1+D2 — IL PERIMETRO CONSEGNATO, e da qui in poi il rifiuto DECIDE.
                  --   Fino al 2026-09-04 il perimetro di un giro era «tutto cio' che e'
                  --   libero e in competenza»: una riga liberata da un giro disfatto era
                  --   indistinguibile da una appena consegnata dal pull, quindi la commessa
                  --   che il pull aveva RESPINTO finiva in fattura lo stesso — e senza
                  --   nessun errore, perche' quella fattura di troppo e' una fattura
                  --   normale.
                  --   ⇒ Adesso si fattura solo cio' che il pull di QUESTO giro ha firmato.
                  --
                  -- ⭐ IL PERIMETRO NON SI PUO' DIMENTICARE, ed e' il punto della forma.
                  --   Non c'e' nessun interruttore da ricordarsi di accendere: chi lucchetta
                  --   e' gia' OBBLIGATO a dichiarare il proprio giro (il guard qui sopra
                  --   pretende `p_lock_batch_id` quando `p_lock`), e dichiarare il giro
                  --   SIGNIFICA prendersi il suo perimetro. Le due cose non possono piu'
                  --   divergere perche' sono lo stesso parametro.
                  --
                  -- ⚠️ La condizione e' sulla PRESENZA del giro e non su `p_lock`, e non e'
                  --   la stessa cosa: cosi' anche un'anteprima che dichiara il proprio giro
                  --   vede ESATTAMENTE cio' che il giro vero prendera'. Un'anteprima
                  --   filtrata diversamente dal giro e' peggio di nessuna anteprima —
                  --   mostra un elenco che poi non si avvera.
                  --   Una chiamata senza giro (`p_lock_batch_id` NULL, quindi per forza
                  --   senza lucchetto) resta senza filtro: non fattura niente e non puo'
                  --   fare danni.
                  IF p_lock_batch_id IS NOT NULL THEN
                      v_where := v_where || ' AND a.emit_batch_id = ' || quote_literal(p_lock_batch_id);
                  END IF;

                  IF p_billing_account_id IS NOT NULL THEN v_where := v_where || ' AND a.billing_account_id = ' || quote_literal(p_billing_account_id); END IF;
                  IF p_utility_id IS NOT NULL THEN v_where := v_where || ' AND ba.utility_id = ' || quote_literal(p_utility_id); END IF;
                  IF p_valuta_id IS NOT NULL THEN v_where := v_where || ' AND a.valuta_id = ' || quote_literal(p_valuta_id); END IF;
                  IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                      v_where := v_where || ' AND a.billing_account_id IS NOT NULL AND anagrafiche.fn_get_emittente_fiscale_id(a.billing_account_id) = ' || quote_literal(p_emittente_soggetto_ruolo_id);
                  END IF;
                  IF p_area_geografica_id IS NOT NULL THEN v_where := v_where || ' AND a.area_geografica_id = ' || quote_literal(p_area_geografica_id); END IF;

                  -- ============================================
                  -- EMISSIONE MIRATA (rev 2026-07-27): filtro per gruppo.
                  -- ============================================
                  -- Il join alla riga di commessa si aggiunge SOLO quando il
                  -- filtro e' attivo: senza p_gruppi la query resta identica a
                  -- prima, sia come forma sia come piano (garanzia G1).
                  -- commessa_attivita_id e' NOT NULL su attivita_fatturabili,
                  -- quindi l'INNER JOIN non perde righe.
                  -- L'array entra come letterale quotato + cast, coerente con
                  -- gli altri parametri iniettati sopra.
                  v_join := '';
                  IF p_gruppi IS NOT NULL THEN
                      v_join := ' JOIN vendite.commesse_attivita ca ON ca.id = a.commessa_attivita_id';
                      v_where := v_where
                          || ' AND vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) = ANY ('
                          || quote_literal(p_gruppi::text) || '::text[])';
                  END IF;

                  v_limit := CASE WHEN p_limit IS NOT NULL THEN ' LIMIT ' || p_limit::TEXT ELSE '' END;

                  IF p_lock THEN
                      -- ⚠️ FOR UPDATE OF a: il lock resta ristretto ad
                      -- attivita_fatturabili anche in presenza del join. Non
                      -- estenderlo a ca: serializzerebbe la fatturazione con le
                      -- operazioni di commessa.
                      v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_join || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ' FOR UPDATE OF a SKIP LOCKED) UPDATE vendite.attivita_fatturabili a SET lock_in_fatturazione = true, lock_batch_id = ' || quote_literal(p_lock_batch_id) || ', stato_esecuzione = ''PENDING'', data_update = now(), user_update = current_user FROM candidati c WHERE a.id = c.id AND a.fatturato IS FALSE AND COALESCE(a.lock_in_fatturazione, false) IS FALSE RETURNING a.*';
                  ELSE
                      v_sql := 'WITH candidati AS (SELECT a.id FROM vendite.attivita_fatturabili a JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' || v_join || v_where || ' ORDER BY a.data_attivita, a.id' || v_limit || ') SELECT a.* FROM vendite.attivita_fatturabili a JOIN candidati c ON c.id = a.id ORDER BY a.data_attivita, a.id';
                  END IF;

                  RETURN QUERY EXECUTE v_sql;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_situazione_merce_ordine(p_ddt_ids bigint[] DEFAULT NULL::bigint[], p_ordine_ids bigint[] DEFAULT NULL::bigint[])
               RETURNS TABLE(ordine_riga_id vendite.ordini_righe.id%TYPE, ordine_id vendite.ordini_righe.ordine_id%TYPE, riga_nr vendite.ordini_righe.riga_nr%TYPE, articolo_id vendite.ordini_righe.articolo_id%TYPE, ordinato vendite.ordini_righe.quantita%TYPE, consegnato numeric, reso numeric, in_riconsegna numeric, tenuti numeric, fatturato_merce numeric, fatturato_da_ordine numeric, fatturato numeric, fatturato_anticipato numeric, da_spedire numeric, partite_merce integer, misurabile boolean, differenza numeric, stato character varying, data_consegna_richiesta_cliente vendite.ordini_righe.data_consegna_richiesta_cliente%TYPE, data_consegna_confermata vendite.ordini_righe.data_consegna_confermata%TYPE, giorni_ritardo integer)
               LANGUAGE sql
               STABLE
              BEGIN ATOMIC
               WITH ordini_in AS MATERIALIZED (
                        SELECT o_1.ordine_id
                          FROM unnest(fn_situazione_merce_ordine.p_ordine_ids) o_1(ordine_id)
                       UNION
                        SELECT orr_1.ordine_id
                          FROM ((vendite.ddt_righe dr
                            JOIN vendite.ordini_righe_fulfillment f_1 ON ((f_1.ddt_riga_id = dr.id)))
                            JOIN vendite.ordini_righe orr_1 ON ((orr_1.id = f_1.ordine_riga_id)))
                         WHERE (dr.ddt_id = ANY (fn_situazione_merce_ordine.p_ddt_ids))
                       ), righe_toccate AS MATERIALIZED (
                        SELECT DISTINCT f_1.ordine_riga_id
                          FROM (vendite.ddt_righe dr
                            JOIN vendite.ordini_righe_fulfillment f_1 ON ((f_1.ddt_riga_id = dr.id)))
                         WHERE (dr.ddt_id = ANY (fn_situazione_merce_ordine.p_ddt_ids))
                       ), orr_semi AS MATERIALIZED (
                        SELECT orr_1.id,
                           orr_1.ordine_id,
                           orr_1.riga_nr,
                           orr_1.articolo_id,
                           orr_1.quantita,
                           orr_1.data_consegna_richiesta_cliente,
                           orr_1.data_consegna_confermata
                          FROM vendite.ordini_righe orr_1
                         WHERE ((orr_1.attivo IS TRUE) AND (orr_1.ordine_id = ANY (fn_situazione_merce_ordine.p_ordine_ids)))
                       UNION
                        SELECT orr_1.id,
                           orr_1.ordine_id,
                           orr_1.riga_nr,
                           orr_1.articolo_id,
                           orr_1.quantita,
                           orr_1.data_consegna_richiesta_cliente,
                           orr_1.data_consegna_confermata
                          FROM (vendite.ordini_righe orr_1
                            JOIN righe_toccate t ON ((t.ordine_riga_id = orr_1.id)))
                         WHERE (orr_1.attivo IS TRUE)
                       ), orr_in AS MATERIALIZED (
                        SELECT s.id,
                           s.ordine_id,
                           s.riga_nr,
                           s.articolo_id,
                           s.quantita,
                           s.data_consegna_richiesta_cliente,
                           s.data_consegna_confermata
                          FROM orr_semi s
                         WHERE (NOT ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL)))
                       UNION ALL
                        SELECT orr_1.id,
                           orr_1.ordine_id,
                           orr_1.riga_nr,
                           orr_1.articolo_id,
                           orr_1.quantita,
                           orr_1.data_consegna_richiesta_cliente,
                           orr_1.data_consegna_confermata
                          FROM vendite.ordini_righe orr_1
                         WHERE ((orr_1.attivo IS TRUE) AND ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL)))
                       ), pm_src AS (
                        SELECT p.ordine_riga_id,
                           p.consegnato,
                           p.reso,
                           p.in_riconsegna,
                           p.tenuti,
                           p.fatturato_merce,
                           p.fatturato_da_ordine,
                           p.differenza,
                           p.misurabile,
                           p.origine,
                           p.e_riconsegna
                          FROM vendite.fn_partite_merce(NULL::bigint[], NULL::bigint[]) p(ddt_riga_id, ddt_id, ddt_uid, articolo_id, is_composito, ordine_riga_id, ordine_id, origine, fatturabile, consegnato, reso, in_riconsegna, tenuti, fatturato_merce, fatturato_da_ordine, fatturato, misurabile, differenza, stato, e_riconsegna, sospetto_duplicato_ordine, rettificato, riconsegna_quota_nuova)
                         WHERE ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL))
                       UNION ALL
                        SELECT p.ordine_riga_id,
                           p.consegnato,
                           p.reso,
                           p.in_riconsegna,
                           p.tenuti,
                           p.fatturato_merce,
                           p.fatturato_da_ordine,
                           p.differenza,
                           p.misurabile,
                           p.origine,
                           p.e_riconsegna
                          FROM vendite.fn_partite_merce(NULL::bigint[], ( SELECT COALESCE(array_agg(oi.ordine_id), '{}'::bigint[]) AS "coalesce"
                                  FROM ordini_in oi)) p(ddt_riga_id, ddt_id, ddt_uid, articolo_id, is_composito, ordine_riga_id, ordine_id, origine, fatturabile, consegnato, reso, in_riconsegna, tenuti, fatturato_merce, fatturato_da_ordine, fatturato, misurabile, differenza, stato, e_riconsegna, sospetto_duplicato_ordine, rettificato, riconsegna_quota_nuova)
                         WHERE (NOT ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL)))
                       ), soglia AS (
                        SELECT s.ordine AS ordine_confermato
                          FROM config.stati_doc_ordini s
                         WHERE ((s.codice_interno)::text = 'CONFERMATO'::text)
                       ), pm AS (
                        SELECT p.ordine_riga_id,
                           (count(*))::integer AS partite_merce,
                           sum(p.consegnato) AS consegnato,
                           sum(p.reso) AS reso,
                           sum(p.in_riconsegna) AS in_riconsegna,
                           sum(p.tenuti) AS tenuti,
                           sum(p.fatturato_merce) AS fatturato_merce,
                           sum(p.fatturato_da_ordine) AS fatturato_da_ordine,
                           sum(p.differenza) AS differenza,
                           bool_and(p.misurabile) AS misurabile,
                           bool_or(((p.origine)::text = 'MULTIPLA'::text)) AS ha_origine_multipla,
                           (count(*) FILTER (WHERE (p.differenza IS NOT NULL)))::integer AS partite_con_conto
                          FROM pm_src p
                         WHERE ((p.ordine_riga_id IS NOT NULL) AND (NOT p.e_riconsegna))
                         GROUP BY p.ordine_riga_id
                       ), ord AS (
                        SELECT f_1.riga_id AS ordine_riga_id,
                           f_1.quantita,
                           f_1.misurabile
                          FROM vendite.fn_af_merce_per_riga(( SELECT COALESCE(array_agg((((('ORD:'::text || (o_k.uid)::text) || ':R:'::text) || (x.id)::text))::character varying), '{}'::character varying[]) AS "coalesce"
                                  FROM (orr_in x
                                    JOIN vendite.ordini o_k ON ((o_k.id = x.ordine_id))))) f_1(corsia, riga_id, tipo_movimento, quantita, misurabile, da_componenti, voci)
                         WHERE (((f_1.corsia)::text = 'ORD'::text) AND ((f_1.tipo_movimento)::text = 'NORMALE'::text) AND (NOT ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL))))
                       UNION ALL
                        SELECT f_1.riga_id,
                           f_1.quantita,
                           f_1.misurabile
                          FROM vendite.fn_af_merce_per_riga(NULL::character varying[]) f_1(corsia, riga_id, tipo_movimento, quantita, misurabile, da_componenti, voci)
                         WHERE (((f_1.corsia)::text = 'ORD'::text) AND ((f_1.tipo_movimento)::text = 'NORMALE'::text) AND ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL)))
                       ), ful AS (
                        SELECT f_1.ordine_riga_id,
                           sum(f_1.qta_evasa) AS evaso
                          FROM (vendite.ordini_righe_fulfillment f_1
                            JOIN orr_in x ON ((x.id = f_1.ordine_riga_id)))
                         WHERE (NOT ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL)))
                         GROUP BY f_1.ordine_riga_id
                       UNION ALL
                        SELECT f_1.ordine_riga_id,
                           sum(f_1.qta_evasa) AS evaso
                          FROM vendite.ordini_righe_fulfillment f_1
                         WHERE ((fn_situazione_merce_ordine.p_ddt_ids IS NULL) AND (fn_situazione_merce_ordine.p_ordine_ids IS NULL))
                         GROUP BY f_1.ordine_riga_id
                       )
                SELECT orr.id AS ordine_riga_id,
                   orr.ordine_id,
                   orr.riga_nr,
                   orr.articolo_id,
                   orr.quantita AS ordinato,
                   COALESCE(pm.consegnato, (0)::numeric) AS consegnato,
                   COALESCE(pm.reso, (0)::numeric) AS reso,
                   COALESCE(pm.in_riconsegna, (0)::numeric) AS in_riconsegna,
                   COALESCE(pm.tenuti, (0)::numeric) AS tenuti,
                   COALESCE(pm.fatturato_merce, (0)::numeric) AS fatturato_merce,
                   COALESCE(pm.fatturato_da_ordine, (0)::numeric) AS fatturato_da_ordine,
                   (COALESCE(pm.fatturato_merce, (0)::numeric) + COALESCE(pm.fatturato_da_ordine, (0)::numeric)) AS fatturato,
                   GREATEST((0)::numeric, (COALESCE(o.quantita, (0)::numeric) - COALESCE(pm.fatturato_da_ordine, (0)::numeric))) AS fatturato_anticipato,
                   ds.da_spedire,
                   COALESCE(pm.partite_merce, 0) AS partite_merce,
                   v.misurabile,
                       CASE
                           WHEN v.misurabile THEN pm.differenza
                           ELSE NULL::numeric
                       END AS differenza,
                   (
                       CASE
                           WHEN ((COALESCE(pm.partite_merce, 0) = 0) AND (NOT imp.impegnata)) THEN 'NON_IMPEGNATA'::text
                           WHEN (COALESCE(pm.partite_merce, 0) = 0) THEN 'NON_SPEDITA'::text
                           WHEN (NOT v.misurabile) THEN 'NON_MISURABILE'::text
                           WHEN (pm.differenza IS NULL) THEN 'NON_FATTURABILE'::text
                           WHEN (pm.differenza > (0)::numeric) THEN 'DA_FATTURARE'::text
                           WHEN (pm.differenza < (0)::numeric) THEN 'DA_ACCREDITARE'::text
                           ELSE 'PAREGGIATA'::text
                       END)::character varying AS stato,
                   orr.data_consegna_richiesta_cliente,
                   orr.data_consegna_confermata,
                       CASE
                           WHEN ((ds.da_spedire > (0)::numeric) AND (COALESCE(orr.data_consegna_confermata, orr.data_consegna_richiesta_cliente) IS NOT NULL)) THEN GREATEST(0, ((SELECT script.fn_data_operativa()) - COALESCE(orr.data_consegna_confermata, orr.data_consegna_richiesta_cliente)))
                           ELSE NULL::integer
                       END AS giorni_ritardo
                  FROM (((((((((orr_in orr
                    JOIN vendite.ordini o_rls ON ((o_rls.id = orr.ordine_id)))
                    JOIN config.stati_doc_ordini sdo ON ((sdo.id = o_rls.stato_doc_ordine_id)))
                    CROSS JOIN soglia sg)
                    LEFT JOIN pm ON ((pm.ordine_riga_id = orr.id)))
                    LEFT JOIN ord o ON ((o.ordine_riga_id = orr.id)))
                    LEFT JOIN ful f ON ((f.ordine_riga_id = orr.id)))
                    CROSS JOIN LATERAL ( SELECT (COALESCE(pm.misurabile, true) AND COALESCE(o.misurabile, true) AND (NOT COALESCE(pm.ha_origine_multipla, false))) AS misurabile) v)
                    CROSS JOIN LATERAL ( SELECT ((COALESCE((sdo.ordine)::integer, '-1'::integer) >= sg.ordine_confermato) AND (NOT sdo.is_abortito)) AS impegnata) imp)
                    CROSS JOIN LATERAL ( SELECT
                               CASE
                                   WHEN imp.impegnata THEN GREATEST((0)::numeric, ((orr.quantita - COALESCE(f.evaso, (0)::numeric)) + vendite.fn_ordine_riga_qta_riconsegna(orr.id)))
                                   ELSE NULL::numeric
                               END AS da_spedire) ds);
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_contabili_fondo_fattura(p_fattura_figlia_id vendite.fatture.id%TYPE)
               RETURNS TABLE(inserted_righe integer, updated_righe integer, annullati_source integer)
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_centro_fondo_id  pagamenti.centri_riscossione.id%TYPE;
                  v_stato_contabile_codice pagamenti.vendite_contabili_stati.codice_interno%TYPE := 'VALIDATA';
                  v_stato_riga_id    pagamenti.vendite_contabili_righe_stati.id%TYPE;
                  v_inserted INTEGER := 0;
                  v_updated  INTEGER := 0;
                  v_annullati INTEGER := 0;
                  v_riga_id      pagamenti.vendite_contabili_righe.id%TYPE;
                  v_riga_stato_id   pagamenti.vendite_contabili_righe_stati.id%TYPE;
                  v_riga_stato      pagamenti.vendite_contabili_righe_stati.codice_interno%TYPE;
                  v_contabile_id pagamenti.vendite_contabili.id%TYPE;
                  v_lotto_id     vendite.fatturazione_lotti.id%TYPE;
                  v_data_valuta  pagamenti.vendite_contabili_righe.data_valuta%TYPE;
                  v_saldo_effettivo vendite.fatture.totale_a_pagare%TYPE;
                  r RECORD;
              BEGIN
                  IF p_fattura_figlia_id IS NULL OR p_fattura_figlia_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_contabili_fondo_fattura', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_figlia_id', 'valore', p_fattura_figlia_id), NULL::uuid, 'p_fattura_figlia_id obbligatorio e > 0');
                  END IF;

                  -- Centro riscossione fondo fattura
                  SELECT c.id INTO v_centro_fondo_id FROM pagamenti.centri_riscossione c WHERE c.attivo IS TRUE AND c.is_fondo_fattura IS TRUE ORDER BY c.id LIMIT 1;

                  IF v_centro_fondo_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_contabili_fondo_fattura', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'centri_riscossione.is_fondo_fattura'), NULL::uuid, 'il centro di riscossione dei fondi fattura');
                  END IF;

                  -- =========================================================
                  -- Stato riga contabile target: ABBINATA, e SOLO quello.
                  --
                  -- 🔴 C-6: fino al 2026-08-21 qui c'era un ripiego su «uno
                  --    stato qualunque» (ORDER BY s.id LIMIT 1). Era gia'
                  --    sbagliato, ed e' PEGGIORATO col lotto 2: una riga
                  --    ripiegata su IMPORTATA ha richiede_abbinamento = false,
                  --    quindi sfuggirebbe anche al guard nuovo e resterebbe
                  --    non registrabile per sempre, in silenzio.
                  --    Uno stato mancante e' una configurazione rotta: si dice.
                  -- =========================================================
                  SELECT s.id INTO v_stato_riga_id FROM pagamenti.vendite_contabili_righe_stati s WHERE s.attivo IS TRUE AND s.codice_interno = 'ABBINATA' LIMIT 1;
                  IF v_stato_riga_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_contabili_fondo_fattura', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'vendite_contabili_righe_stati.ABBINATA'), NULL::uuid, 'lo stato ABBINATA delle righe contabili');
                  END IF;

                  -- Lotto associato
                  SELECT lf.lotto_id INTO v_lotto_id FROM vendite.fatturazione_lotti_fatture lf WHERE lf.fattura_id = p_fattura_figlia_id ORDER BY lf.id DESC LIMIT 1;

                  -- Loop fondi assegnati
                  -- ⭐ Il filtro su ASSEGNATO e' cio' che, dal 2026-08-21, tiene
                  --    fuori i fondi ESEGUITI: il quarto stato li porta via da
                  --    qui senza che questa WHERE cambi.
                  FOR r IN
                      SELECT s.id AS source_id, s.fattura_sorgente_id, s.importo, s.billing_account_id, fsrc.data AS data_fattura_sorgente
                        FROM vendite.fatture_fondi_fattura_source s
                        JOIN vendite.tipi_fondi_fattura t ON t.id = s.tipo_fondo_fattura_id
                        JOIN vendite.fatture fsrc ON fsrc.id = s.fattura_sorgente_id
                       WHERE s.fattura_figlia_id = p_fattura_figlia_id AND s.attivo IS TRUE AND s.stato = 'ASSEGNATO' AND t.codice_interno = 'F_F_ADD_ACC'
                       ORDER BY s.id
                  LOOP
                      -- =====================================================
                      -- La riga contabile di QUESTO atto, letta dalla COLONNA
                      -- (S1-14) e non piu' da una stringa dentro il meta.
                      --
                      -- ⚠️ Si cerca PRIMA di calcolare il saldo, ed e' parte
                      --    del rimedio: con l'ordine vecchio un fondo con riga
                      --    registrata e saldo zero passava per il ramo di
                      --    annullamento (C-3) prima che la rete lo vedesse.
                      --
                      -- ORDER BY id DESC: per invariante c'e' una riga sola
                      -- per atto, ma se ce ne fossero due vale la piu' recente.
                      -- =====================================================
                      SELECT cr.id, cr.stato_id, st.codice_interno
                        INTO v_riga_id, v_riga_stato_id, v_riga_stato
                        FROM pagamenti.vendite_contabili_righe cr
                        JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                       WHERE cr.attivo IS TRUE
                         AND cr.fondo_source_id = r.source_id
                       ORDER BY cr.id DESC
                       LIMIT 1;

                      -- =====================================================
                      -- 🛟 S1-8 — LA RETE. Non e' il rimedio (quello e' il
                      --    quarto stato del fondo): e' il fail-closed
                      --    sull'invariante «un fondo ASSEGNATO non ha righe
                      --    che non possono tornare ad ABBINATA».
                      --
                      -- ⭐ La domanda si fa alla MATRICE, non a un elenco di
                      --    stati scritto qui: copre POSTATA (terminale) e
                      --    anche SCARTATA, da cui non esiste passaggio verso
                      --    ABBINATA — e che oggi farebbe cadere il ricalcolo
                      --    della fattura con un errore che accusa il ricalcolo.
                      --
                      -- ⛔ Si LOGGA e si salta: mai un RAISE, questa funzione
                      --    e' su percorso vivo della pipeline.
                      -- =====================================================
                      IF v_riga_id IS NOT NULL
                         AND v_riga_stato_id IS DISTINCT FROM v_stato_riga_id
                         AND NOT EXISTS (
                             SELECT 1
                               FROM pagamenti.transizioni_stati_contabile_riga t
                              WHERE t.stato_da_id = v_riga_stato_id
                                AND t.stato_a_id  = v_stato_riga_id
                                AND t.attivo IS TRUE)
                      THEN
                          INSERT INTO vendite.fatture_log (fattura_id, data_ora, messaggio, status, disabilitato, meta, data_insert, user_insert, data_update, user_update)
                          VALUES (
                              p_fattura_figlia_id,
                              now(),
                              format('Fondo non sincronizzato: la riga contabile e'' in stato %s e da li'' non si torna ad ABBINATA', v_riga_stato),
                              'W',
                              FALSE,
                              jsonb_build_object(
                                  'source_id',         r.source_id,
                                  'contabile_riga_id', v_riga_id,
                                  'stato_riga',        v_riga_stato,
                                  'error_code',        'W_FONDO_RIGA_CONTABILE_NON_AGGIORNABILE',
                                  'cause',             'RIGA_NON_RIPORTABILE_AD_ABBINATA'),
                              now(), current_user, now(), current_user);
                          CONTINUE;
                      END IF;

                      -- Formula unica (changeSet 20260815-05): il residuo della
                      -- sorgente al netto del contributo di QUESTO fondo.
                      v_saldo_effettivo := vendite.fn_saldo_sorgente_fondo(r.fattura_sorgente_id, r.source_id);

                      IF COALESCE(v_saldo_effettivo, 0) = 0 THEN
                          -- ⭐ La ragione dell'annullamento sta ora SUL DATO, non
                          --    solo nel comportamento: chi guarda la riga sa
                          --    perche' e' finita li'.
                          UPDATE vendite.fatture_fondi_fattura_source s
                             SET stato = 'ANNULLATO',
                                 motivo = COALESCE(s.motivo, 'Sorgente gia coperta: saldo effettivo zero alla sincronizzazione contabile'),
                                 data_update = now(), user_update = current_user
                           WHERE s.id = r.source_id AND s.stato IS DISTINCT FROM 'ANNULLATO';
                          IF FOUND THEN v_annullati := v_annullati + 1; END IF;
                          CONTINUE;
                      END IF;

                      v_data_valuta := CASE WHEN script.fn_data_operativa() > r.data_fattura_sorgente THEN script.fn_data_operativa() ELSE r.data_fattura_sorgente END;

                      v_contabile_id := pagamenti.fn_get_or_create_vendite_contabile(
                          p_centro_riscossione_id => v_centro_fondo_id, p_data_contabile => r.data_fattura_sorgente,
                          p_data_registrazione => r.data_fattura_sorgente, p_ente_incasso_id => NULL, p_lotto_id => v_lotto_id,
                          p_codice_stato_interno => v_stato_contabile_codice,
                          p_meta => jsonb_build_object('origine', 'FONDO_FATTURA', 'fattura_figlia_id', p_fattura_figlia_id));

                      IF v_riga_id IS NULL THEN
                          INSERT INTO pagamenti.vendite_contabili_righe (contabile_id, riferimento_ente, data_pagamento, data_valuta, data_operazione, importo, fattura_id, billing_account_id, stato_id, motivo_sospeso, fondo_source_id, meta, attivo, data_insert, user_insert, data_update, user_update)
                          VALUES (v_contabile_id, concat('FONDO_SRC_', r.source_id::TEXT), r.data_fattura_sorgente, v_data_valuta, now(), r.importo, r.fattura_sorgente_id, r.billing_account_id, v_stato_riga_id, NULL, r.source_id, jsonb_build_object('origine', 'FONDO_FATTURA', 'fattura_figlia_id', p_fattura_figlia_id), TRUE, now(), current_user, now(), current_user);
                          v_inserted := v_inserted + 1;
                      ELSE
                          -- ⚠️ `- 'fondo_source_id'` toglie la chiave storica dal
                          --    meta: il legame ha una colonna, e due sorgenti di
                          --    verita' sulla stessa cosa sono il difetto che
                          --    S1-14 chiude.
                          UPDATE pagamenti.vendite_contabili_righe cr SET contabile_id = v_contabile_id, riferimento_ente = concat('FONDO_SRC_', r.source_id::TEXT), data_pagamento = r.data_fattura_sorgente, data_valuta = v_data_valuta, data_operazione = r.data_fattura_sorgente, importo = r.importo, fattura_id = r.fattura_sorgente_id, billing_account_id = r.billing_account_id, stato_id = v_stato_riga_id, motivo_sospeso = NULL, fondo_source_id = r.source_id, meta = (COALESCE(cr.meta, '{}'::JSONB) - 'fondo_source_id') || jsonb_build_object('origine', 'FONDO_FATTURA', 'fattura_figlia_id', p_fattura_figlia_id), data_update = now(), user_update = current_user WHERE cr.id = v_riga_id;
                          v_updated := v_updated + 1;
                      END IF;
                  END LOOP;

                  RETURN QUERY SELECT v_inserted, v_updated, v_annullati;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_guard_transizione_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: blocca transizioni stato non ammesse sul workflow contratti.
              -- Workflow: DRAFT -> ATTIVO -> CESSATO
              --           DRAFT -> ANNULLATO (sempre ammessa, nessuna fatturazione su DRAFT)
              --
              -- ATTIVO->CESSATO: distingue job automatico da cessazione manuale.
              --   Job (GUC app.cessazione_automatica='true'): valido_al < CURRENT_DATE.
              --   Manuale: valido_al >= CURRENT_DATE (no riscrittura storica).
              --   Manuale retroattiva: E_CONTRATTO_VALIDO_AL_RETROATTIVO (449).
              -- ATTIVO->ANNULLATO: non ammessa (cade nel catch generico).
              -- ->ATTIVO: blocca se righe o componenti BoM attivi hanno un prezzo
              --   non autorizzato (PENDING o REJECTED).
              -- Aggiornato 2026-05-12: check PENDING componenti.
              -- Aggiornato 2026-05-14: no-retroattiva su cessazione manuale.
              -- Aggiornato 2026-05-20: DRAFT->ANNULLATO ammessa.
              -- Aggiornato 2026-09-24: il controllo del prezzo all'attivazione passa
              --   dal building block script.fn_check_prezzi_autorizzati — righe E
              --   componenti, PENDING E REJECTED (brief-db-preventivi-congelamento-
              --   pricing, D-4/D-5).
              DECLARE
                  v_codice_da config.stati_doc_contratti.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_contratti.codice_interno%TYPE;
                  v_ammessa   boolean := false;
              BEGIN
                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_contratto_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_contratto_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_contratti
                   WHERE id IN (OLD.stato_doc_contratto_id, NEW.stato_doc_contratto_id);

                  IF v_codice_da = 'DRAFT' AND v_codice_a = 'ATTIVO' THEN
                      v_ammessa := true;

                  ELSIF v_codice_da = 'DRAFT' AND v_codice_a = 'ANNULLATO' THEN
                      -- DRAFT->ANNULLATO: sempre ammessa (nessuna fatturazione su DRAFT).
                      v_ammessa := true;

                  ELSIF v_codice_da = 'ATTIVO' AND v_codice_a = 'CESSATO' THEN
                      IF current_setting('app.cessazione_automatica', true) = 'true' THEN
                          -- Job notturno (fn_apply_chiusura_scadenze): contratto gia' scaduto.
                          v_ammessa := (NEW.valido_al IS NOT NULL
                                        AND NEW.valido_al < (SELECT script.fn_data_operativa()));
                      ELSE
                          -- Cessazione manuale: vietata la riscrittura storica.
                          IF NEW.valido_al IS NOT NULL AND NEW.valido_al < script.fn_data_operativa() THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database',
                                  TG_NAME::text,
                                  'E_CONTRATTO_VALIDO_AL_RETROATTIVO',
                                  jsonb_build_object(
                                      'contratto_id', NEW.id,
                                      'numero',       NEW.numero,
                                      'valido_al',    NEW.valido_al,
                                      'today',        (SELECT script.fn_data_operativa())
                                  ),
                                  NEW.tx_id,
                                  NEW.valido_al::text,
                                  (SELECT script.fn_data_operativa())::text
                              );
                          END IF;
                          v_ammessa := (NEW.valido_al IS NOT NULL);
                      END IF;
                  END IF;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text, 'E_CONTRATTO_STATO_TRANSIZIONE_INVALIDA',
                          jsonb_build_object('contratto_id', NEW.id, 'numero', NEW.numero,
                              'stato_da', v_codice_da, 'stato_a', v_codice_a,
                              'valido_al', NEW.valido_al),
                          NEW.tx_id, NEW.id::text,
                          coalesce(v_codice_da, 'NULL'),
                          coalesce(v_codice_a,  'NULL'),
                          coalesce(NEW.valido_al::text, 'NULL')
                      );
                  END IF;

                  -- Prezzi non autorizzati (rev 2026-09-24): un contratto con un prezzo
                  -- che nessuno ha autorizzato — in attesa o rifiutato, su righe o
                  -- componenti BoM attivi — non si attiva (D-1, D-4).
                  --
                  -- ⭐ Il predicato e' il building block script.fn_check_prezzi_autorizzati,
                  --   lo STESSO che fn_available_actions_contratto usa per spegnere
                  --   «Attiva»: qui si solleva soltanto.
                  -- ⚠️ Fino a questa revisione il controllo guardava i SOLI componenti
                  --   PENDING: una riga con un prezzo in attesa, o un prezzo rifiutato,
                  --   passavano. E sollevava E_COMPONENTE_PREZZO_PENDENTE, il codice del
                  --   guard PER RIGA dei componenti — che resta suo.
                  -- ⚠️ Sulla DESTINAZIONE: oggi ci si arriva solo da DRAFT (le altre
                  --   strade verso ATTIVO non sono ammesse sopra).
                  IF v_codice_a = 'ATTIVO' THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'database', TG_NAME::text,
                          script.fn_check_prezzi_autorizzati('vendite.contratti'::regclass, NEW.id),
                          NULL,
                          NEW.tx_id,
                          jsonb_build_object(
                              'contratto_id', NEW.id,
                              'numero',       NEW.numero,
                              'stato_da',     v_codice_da,
                              'stato_a',      v_codice_a));
                  END IF;

                  RETURN NEW;
              END;
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_normalize()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                ----------------------------------------------------------------
                -- Imposta data se numero e' presente e data mancante
                IF TG_OP = 'INSERT' AND (NEW.numero IS NOT NULL AND btrim(NEW.numero) <> '') THEN
                  IF NEW.data IS NULL  THEN
                    NEW.data := script.fn_data_operativa();
                  END IF;
                END IF;

                RETURN NEW;
              END;
              $function$;
        - sql:
