# vendite.fn_ddt_riga_componenti_init e vendite.fn_ddt_riga_componenti_preview: i componenti
#   del kit per la bolla si leggono da catalogo.fn_distinta_alla_data (R2).
#   Brief: brief-db-revisione-catalogo, giro 1-bis.
#
#   Il filtro della distinta alla data (prodotto_id, attivo, validita @> data) era
#   scritto a mano nei due corpi; ora lo risponde il BB di -85. Comportamento uguale:
#   via soltanto il COALESCE su attivo, che e' NOT NULL. I COMMENT delle funzioni non
#   cambiano (non descrivono il filtro).
#   Corpi di partenza da pg_get_functiondef su dbdev (2026-11-09); rollback = i corpi
#   di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261110-88-update-fn-ddt-componenti-distinta-alla-data-mctit.yaml

  - changeSet:
      id: 20261110-88-update-fn-ddt-componenti-distinta-alla-data
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_ddt_riga_componenti_init e fn_ddt_riga_componenti_preview: la distinta alla data dal BB catalogo.fn_distinta_alla_data. Brief: brief-db-revisione-catalogo, giro 1-bis.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid IN (to_regprocedure('vendite.fn_ddt_riga_componenti_init(bigint, bigint, date, jsonb)'),
                             to_regprocedure('vendite.fn_ddt_riga_componenti_preview(uuid, bigint, numeric, date, bigint, integer, bigint, integer)'))
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_riga_componenti_init(p_riga_id bigint, p_emittente_sr_id bigint, p_data_riferimento date, p_componenti_overrides jsonb DEFAULT NULL::jsonb)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$

              -- Scopo: Popola ddt_righe_componenti per una riga composita.
              --   Modello unificato: tutti i componenti attivi inseriti con attivo=TRUE.
              --   BoM = contratto immutabile: l'operatore non sceglie quali includere.
              DECLARE
                  v_articolo_id      catalogo.articoli.id%TYPE;
                  v_codice_articolo  catalogo.articoli.codice%TYPE;
                  v_uom_id           catalogo.unita_misura.id%TYPE;
                  v_qta_padre        vendite.ddt_righe.quantita%TYPE;
                  v_ddt_id           vendite.ddt.id%TYPE;
                  v_is_composito     catalogo.articoli.is_composito%TYPE;
                  v_ba_id            anagrafiche.billing_account.id%TYPE;
                  v_utility_id       vendite.ddt.utility_id%TYPE;
                  v_comp             record;
                  v_resolve          record;
                  v_prezzo           vendite.listini_righe.prezzo%TYPE;
                  v_origine          vendite.ddt_righe_componenti.origine_prezzo%TYPE;
                  v_inserted         integer := 0;
              BEGIN
                  IF p_riga_id IS NULL OR p_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_riga_id'),
                          NULL::uuid, 'p_riga_id obbligatorio e > 0');
                  END IF;
                  IF p_emittente_sr_id IS NULL OR p_emittente_sr_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_emittente_sr_id'),
                          NULL::uuid, 'p_emittente_sr_id obbligatorio e > 0');
                  END IF;

                  SELECT dr.articolo_id, dr.uom_operativa_id, dr.quantita, dr.ddt_id,
                         a.is_composito, a.codice
                    INTO v_articolo_id, v_uom_id, v_qta_padre, v_ddt_id,
                         v_is_composito, v_codice_articolo
                    FROM vendite.ddt_righe dr
                    JOIN catalogo.articoli a ON a.id = dr.articolo_id
                   WHERE dr.id = p_riga_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          -- rev 2026-08-07: era E_PARAMETRO_INVALIDO, cioe' 400 su un 404.
                          --   Gemello di fn_contratto_riga_componenti_init (20260807-02):
                          --   stessa forma, stesso difetto, trovato dalla stessa lente.
                          'E_DDT_RIGA_NON_TROVATA',
                          jsonb_build_object('p_riga_id', p_riga_id),
                          NULL::uuid, p_riga_id::text);
                  END IF;
                  IF NOT COALESCE(v_is_composito, FALSE) THEN RETURN 0; END IF;

                  IF EXISTS (
                      SELECT 1 FROM vendite.ddt_righe_componenti
                       WHERE riga_ddt_id = p_riga_id
                  ) THEN RETURN 0; END IF;

                  SELECT d.billing_account_id, d.utility_id
                    INTO v_ba_id, v_utility_id
                    FROM vendite.ddt d WHERE d.id = v_ddt_id;

                  FOR v_comp IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             a.uom_id       AS componente_uom_id,
                             a.iva_id       AS componente_iva_id
                        FROM catalogo.fn_distinta_alla_data(v_articolo_id, p_data_riferimento) ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                  LOOP
                      IF p_componenti_overrides IS NOT NULL
                         AND p_componenti_overrides ? v_comp.componente_id::text THEN
                          v_prezzo  := (p_componenti_overrides ->> v_comp.componente_id::text)::numeric;
                          v_origine := 'MANUALE';
                          -- ⚠️ Stessa regola della clausola WHEN del trigger (20260819-15):
                          --   l'override a zero su un componente obbligatorio si vieta
                          --   finche' il documento vende. Senza questa condizione il divieto
                          --   sarebbe stato allentato nel trigger e rimasto qui, cioe' in
                          --   due posti che dicono cose diverse sulla stessa regola.
                          IF v_prezzo = 0 AND COALESCE(v_comp.obbligatorio, TRUE)
                             AND vendite.fn_check_ddt_riga_richiede_prezzo(p_riga_id) THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_ddt_riga_componenti_init',
                                  'E_PARAMETRO_INVALIDO',
                                  jsonb_build_object('componente_id', v_comp.componente_id,
                                      'hint', 'prezzo override deve essere diverso da zero'),
                                  NULL::uuid, p_riga_id::text);
                          END IF;
                          INSERT INTO vendite.ddt_righe_componenti (
                              riga_ddt_id, articolo_componente_id, componente_id,
                              coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                              prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                          ) VALUES (
                              p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                              v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                              v_comp.componente_uom_id, 1,
                              v_prezzo, v_comp.componente_iva_id, v_origine,
                              TRUE,
                              jsonb_build_object('override', true,
                                  'emittente_sr_id', p_emittente_sr_id,
                                  'data_riferimento', p_data_riferimento,
                                  'ba_id', v_ba_id, 'utility_id', v_utility_id)
                          );
                      ELSE
                          -- rev 2026-08-19: il BEGIN..END resta un blocco nudo, senza
                          --   EXCEPTION. Il commento storico diceva che lo si teneva per non
                          --   re-indentare venticinque righe: ora che la chiamata cambia
                          --   comunque, la ragione decade — ma toglierlo sposterebbe righe
                          --   che questo changeSet non ha motivo di toccare, e un diff piu'
                          --   grande e' un diff piu' difficile da rivedere.
                          BEGIN
                              SELECT * INTO v_resolve
                                FROM vendite.fn_resolve_prezzo_listino_v2_esito(
                                    v_comp.componente_id, v_comp.componente_uom_id,
                                    p_data_riferimento, v_ba_id, v_utility_id::integer,
                                    p_emittente_sr_id, NULL,
                                    v_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                                );
                              INSERT INTO vendite.ddt_righe_componenti (
                                  riga_ddt_id, articolo_componente_id, componente_id,
                                  coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                                  prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                              ) VALUES (
                                  p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                                  v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                                  v_comp.componente_uom_id, 1,
                                  -- ⭐ Prezzo NULL quando il nucleo non ha risolto: e' il
                                  --   punto in cui un kit puo' finalmente viaggiare senza
                                  --   vendersi. Prima qui il resolver sollevava e la riga
                                  --   non si creava affatto.
                                  CASE WHEN v_resolve.esito_codice IS NULL
                                       THEN v_resolve.prezzo_finale END,
                                  v_comp.componente_iva_id,
                                  v_resolve.origine,
                                  TRUE,
                                  jsonb_build_object('emittente_sr_id', p_emittente_sr_id,
                                      'data_riferimento', p_data_riferimento,
                                      'ba_id', v_ba_id, 'utility_id', v_utility_id,
                                      'listino_id', v_resolve.listino_id,
                                      'listino_versione_id', v_resolve.listino_versione_id,
                                      'listino_riga_id', v_resolve.listino_riga_id,
                                      'contratto_id', v_resolve.contratto_id,
                                      'origine', v_resolve.origine,
                                      -- Il motivo per cui il prezzo manca resta scritto qui:
                                      -- NULL se ha risolto, il codice dell'esito altrimenti.
                                      'esito_codice', v_resolve.esito_codice)
                              );
                          -- ⚠️ rev 2026-08-07: qui c'era `EXCEPTION WHEN SQLSTATE 'P0001'`,
                          --   che catturava QUALUNQUE errore di dominio del resolver e lo
                          --   ri-sollevava come E_DOC_COMPONENTE_LISTINO_MANCANTE tenendo solo
                          --   MESSAGE_TEXT: il codice strutturato originale andava perso, e con
                          --   lui il tipo di risposta. Sette codici diversi arrivavano al client
                          --   come 422 «listino non configurato» anche quando il listino non
                          --   c'entrava nulla. Ora l'errore del resolver passa col proprio codice.
                          --   Il blocco BEGIN..END resta: non serve piu' a nulla di funzionale,
                          --   ma toglierlo vorrebbe dire re-indentare venticinque righe per
                          --   niente. Brief terzo lato §18.3.
                          END;
                      END IF;
                      v_inserted := v_inserted + 1;
                  END LOOP;

                  IF v_inserted = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_DOC_COMPOSITO_BOM_VUOTA',
                          jsonb_build_object('articolo_id', v_articolo_id,
                              'data_riferimento', p_data_riferimento),
                          NULL::uuid,
                          v_codice_articolo,
                          p_data_riferimento::text
                      );
                  END IF;

                  RETURN v_inserted;
              END;

              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_riga_componenti_preview(p_articolo_id uuid, p_uom_id bigint, p_quantita_padre numeric, p_data_riferimento date, p_ba_id bigint, p_utility_id integer, p_emittente_sr_id bigint, p_classe_utenza_id integer DEFAULT NULL::integer)
               RETURNS TABLE(articolo_componente_id uuid, componente_id uuid, componente_codice character varying, componente_descrizione character varying, coeff_qta_snapshot numeric, quantita_componente numeric, uom_id bigint, uom_codice character varying, iva_id bigint, prezzo_suggerito numeric, origine_prezzo character varying, resolver_error_reason text, obbligatorio boolean, esposizione_in_fattura character varying)
               LANGUAGE plpgsql
               STABLE
              AS $function$

              -- Scopo: preview read-only dei componenti BoM CASO A per il drawer riga DDT
              --   (form atomic). Per ogni componente attivo e valido tenta
              --   fn_resolve_prezzo_listino_v2; se fallisce ritorna prezzo_suggerito=NULL
              --   + motivazione in resolver_error_reason. Nessun side-effect (STABLE).
              --   rev 2026-05-13: modello unificato — rimosso filtro esposto_in_fattura=TRUE;
              --   obbligatorio e esposto_in_fattura sono ora esposti nella proiezione.
              --   rev 2026-10-01: esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO)
              --   al posto del booleano esposto_in_fattura
              --   (brief-db-esposizione-componenti-kit-in-fattura).
              DECLARE
                  v_rec     record;
                  v_resolve record;
                  v_msg     text;
              BEGIN
                  FOR v_rec IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             ac.esposizione_in_fattura,
                             a.codice       AS a_codice,
                             a.descrizione  AS a_descrizione,
                             a.uom_id       AS a_uom_id,
                             a.iva_id       AS a_iva_id,
                             um.codice      AS um_codice
                        FROM catalogo.fn_distinta_alla_data(p_articolo_id, p_data_riferimento) ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                        LEFT JOIN catalogo.unita_misura um ON um.id = a.uom_id
                  LOOP
                      articolo_componente_id := v_rec.bom_entry_id;
                      componente_id          := v_rec.componente_id;
                      componente_codice      := v_rec.a_codice;
                      componente_descrizione := v_rec.a_descrizione;
                      coeff_qta_snapshot     := v_rec.coeff_qta;
                      quantita_componente    := v_rec.coeff_qta * p_quantita_padre;
                      uom_id                 := v_rec.a_uom_id;
                      uom_codice             := v_rec.um_codice;
                      iva_id                 := v_rec.a_iva_id;
                      obbligatorio           := v_rec.obbligatorio;
                      esposizione_in_fattura := v_rec.esposizione_in_fattura;

                      -- ⭐ Si chiama il NUCLEO, non il guscio (2026-08-19, slice C).
                      --   Prima qui c'era un BEGIN..EXCEPTION che catturava il P0001 del
                      --   resolver e lo trasformava in prezzo_suggerito NULL + motivazione.
                      --   Il risultato per il chiamante era gia' quello giusto — questa e'
                      --   una preview, non deve fallire — ma il costo era invisibile: il
                      --   database SCRIVE la riga di dbops.error_log PRIMA di sollevare, via
                      --   dblink fuori transazione, quindi catturare l'eccezione nascondeva
                      --   l'errore e lasciava il log. Una riga per componente non risolto, a
                      --   ogni apertura del drawer.
                      --   Il nucleo non solleva e non logga: riporta l'esito e basta.
                      SELECT * INTO v_resolve
                        FROM vendite.fn_resolve_prezzo_listino_v2_esito(
                            v_rec.componente_id,
                            v_rec.a_uom_id,
                            p_data_riferimento,
                            p_ba_id,
                            p_utility_id::integer,
                            p_emittente_sr_id,
                            p_classe_utenza_id,
                            p_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                        );

                      IF v_resolve.esito_codice IS NULL THEN
                          prezzo_suggerito      := v_resolve.prezzo_finale;
                          origine_prezzo        := v_resolve.origine;
                          resolver_error_reason := NULL;
                      ELSE
                          prezzo_suggerito := NULL;
                          origine_prezzo   := NULL;

                          -- Il testo mostrato resta una FRASE, come prima: il chiamante
                          -- e' un drawer e l'operatore legge questo. Il codice
                          -- strutturato viaggia in coda, per chi distingue i casi.
                          v_msg := script.fn_get_messaggio(v_resolve.esito_codice, NULL, 'it');

                          -- ⚠️ I SEGNAPOSTO VANNO SOSTITUITI, e fn_get_messaggio non lo fa:
                          --   accetta un valore solo, e questi messaggi ne hanno fino a
                          --   cinque. Senza format() l'operatore leggerebbe «Nessuna mappa
                          --   categoria %s -> listino per utility %s», che e' peggio di
                          --   nessun messaggio: sembra un difetto del programma.
                          --   ⛔ E format() con MENO valori dei segnaposto non degrada:
                          --   alza 22023. Il ripiego e' lo stesso che
                          --   script.fn_log_and_raise_error si e' dato il 2026-08-18 — se la
                          --   sostituzione fallisce resta il modello, brutto da leggere ma
                          --   innocuo. Una preview non deve rompersi per un messaggio.
                          IF array_length(v_resolve.esito_valori, 1) IS NOT NULL THEN
                              BEGIN
                                  v_msg := format(v_msg, VARIADIC v_resolve.esito_valori);
                              EXCEPTION WHEN OTHERS THEN
                                  NULL;  -- v_msg resta il modello
                              END;
                          END IF;

                          resolver_error_reason := v_msg || ' [' || v_resolve.esito_codice || ']';
                      END IF;

                      RETURN NEXT;
                  END LOOP;
              END;

              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_riga_componenti_init(p_riga_id bigint, p_emittente_sr_id bigint, p_data_riferimento date, p_componenti_overrides jsonb DEFAULT NULL::jsonb)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$

              -- Scopo: Popola ddt_righe_componenti per una riga composita.
              --   Modello unificato: tutti i componenti attivi inseriti con attivo=TRUE.
              --   BoM = contratto immutabile: l'operatore non sceglie quali includere.
              DECLARE
                  v_articolo_id      catalogo.articoli.id%TYPE;
                  v_codice_articolo  catalogo.articoli.codice%TYPE;
                  v_uom_id           catalogo.unita_misura.id%TYPE;
                  v_qta_padre        vendite.ddt_righe.quantita%TYPE;
                  v_ddt_id           vendite.ddt.id%TYPE;
                  v_is_composito     catalogo.articoli.is_composito%TYPE;
                  v_ba_id            anagrafiche.billing_account.id%TYPE;
                  v_utility_id       vendite.ddt.utility_id%TYPE;
                  v_comp             record;
                  v_resolve          record;
                  v_prezzo           vendite.listini_righe.prezzo%TYPE;
                  v_origine          vendite.ddt_righe_componenti.origine_prezzo%TYPE;
                  v_inserted         integer := 0;
              BEGIN
                  IF p_riga_id IS NULL OR p_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_riga_id'),
                          NULL::uuid, 'p_riga_id obbligatorio e > 0');
                  END IF;
                  IF p_emittente_sr_id IS NULL OR p_emittente_sr_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_emittente_sr_id'),
                          NULL::uuid, 'p_emittente_sr_id obbligatorio e > 0');
                  END IF;

                  SELECT dr.articolo_id, dr.uom_operativa_id, dr.quantita, dr.ddt_id,
                         a.is_composito, a.codice
                    INTO v_articolo_id, v_uom_id, v_qta_padre, v_ddt_id,
                         v_is_composito, v_codice_articolo
                    FROM vendite.ddt_righe dr
                    JOIN catalogo.articoli a ON a.id = dr.articolo_id
                   WHERE dr.id = p_riga_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          -- rev 2026-08-07: era E_PARAMETRO_INVALIDO, cioe' 400 su un 404.
                          --   Gemello di fn_contratto_riga_componenti_init (20260807-02):
                          --   stessa forma, stesso difetto, trovato dalla stessa lente.
                          'E_DDT_RIGA_NON_TROVATA',
                          jsonb_build_object('p_riga_id', p_riga_id),
                          NULL::uuid, p_riga_id::text);
                  END IF;
                  IF NOT COALESCE(v_is_composito, FALSE) THEN RETURN 0; END IF;

                  IF EXISTS (
                      SELECT 1 FROM vendite.ddt_righe_componenti
                       WHERE riga_ddt_id = p_riga_id
                  ) THEN RETURN 0; END IF;

                  SELECT d.billing_account_id, d.utility_id
                    INTO v_ba_id, v_utility_id
                    FROM vendite.ddt d WHERE d.id = v_ddt_id;

                  FOR v_comp IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             a.uom_id       AS componente_uom_id,
                             a.iva_id       AS componente_iva_id
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                       WHERE ac.prodotto_id        = v_articolo_id
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita           @> p_data_riferimento
                  LOOP
                      IF p_componenti_overrides IS NOT NULL
                         AND p_componenti_overrides ? v_comp.componente_id::text THEN
                          v_prezzo  := (p_componenti_overrides ->> v_comp.componente_id::text)::numeric;
                          v_origine := 'MANUALE';
                          -- ⚠️ Stessa regola della clausola WHEN del trigger (20260819-15):
                          --   l'override a zero su un componente obbligatorio si vieta
                          --   finche' il documento vende. Senza questa condizione il divieto
                          --   sarebbe stato allentato nel trigger e rimasto qui, cioe' in
                          --   due posti che dicono cose diverse sulla stessa regola.
                          IF v_prezzo = 0 AND COALESCE(v_comp.obbligatorio, TRUE)
                             AND vendite.fn_check_ddt_riga_richiede_prezzo(p_riga_id) THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_ddt_riga_componenti_init',
                                  'E_PARAMETRO_INVALIDO',
                                  jsonb_build_object('componente_id', v_comp.componente_id,
                                      'hint', 'prezzo override deve essere diverso da zero'),
                                  NULL::uuid, p_riga_id::text);
                          END IF;
                          INSERT INTO vendite.ddt_righe_componenti (
                              riga_ddt_id, articolo_componente_id, componente_id,
                              coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                              prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                          ) VALUES (
                              p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                              v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                              v_comp.componente_uom_id, 1,
                              v_prezzo, v_comp.componente_iva_id, v_origine,
                              TRUE,
                              jsonb_build_object('override', true,
                                  'emittente_sr_id', p_emittente_sr_id,
                                  'data_riferimento', p_data_riferimento,
                                  'ba_id', v_ba_id, 'utility_id', v_utility_id)
                          );
                      ELSE
                          -- rev 2026-08-19: il BEGIN..END resta un blocco nudo, senza
                          --   EXCEPTION. Il commento storico diceva che lo si teneva per non
                          --   re-indentare venticinque righe: ora che la chiamata cambia
                          --   comunque, la ragione decade — ma toglierlo sposterebbe righe
                          --   che questo changeSet non ha motivo di toccare, e un diff piu'
                          --   grande e' un diff piu' difficile da rivedere.
                          BEGIN
                              SELECT * INTO v_resolve
                                FROM vendite.fn_resolve_prezzo_listino_v2_esito(
                                    v_comp.componente_id, v_comp.componente_uom_id,
                                    p_data_riferimento, v_ba_id, v_utility_id::integer,
                                    p_emittente_sr_id, NULL,
                                    v_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                                );
                              INSERT INTO vendite.ddt_righe_componenti (
                                  riga_ddt_id, articolo_componente_id, componente_id,
                                  coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                                  prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                              ) VALUES (
                                  p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                                  v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                                  v_comp.componente_uom_id, 1,
                                  -- ⭐ Prezzo NULL quando il nucleo non ha risolto: e' il
                                  --   punto in cui un kit puo' finalmente viaggiare senza
                                  --   vendersi. Prima qui il resolver sollevava e la riga
                                  --   non si creava affatto.
                                  CASE WHEN v_resolve.esito_codice IS NULL
                                       THEN v_resolve.prezzo_finale END,
                                  v_comp.componente_iva_id,
                                  v_resolve.origine,
                                  TRUE,
                                  jsonb_build_object('emittente_sr_id', p_emittente_sr_id,
                                      'data_riferimento', p_data_riferimento,
                                      'ba_id', v_ba_id, 'utility_id', v_utility_id,
                                      'listino_id', v_resolve.listino_id,
                                      'listino_versione_id', v_resolve.listino_versione_id,
                                      'listino_riga_id', v_resolve.listino_riga_id,
                                      'contratto_id', v_resolve.contratto_id,
                                      'origine', v_resolve.origine,
                                      -- Il motivo per cui il prezzo manca resta scritto qui:
                                      -- NULL se ha risolto, il codice dell'esito altrimenti.
                                      'esito_codice', v_resolve.esito_codice)
                              );
                          -- ⚠️ rev 2026-08-07: qui c'era `EXCEPTION WHEN SQLSTATE 'P0001'`,
                          --   che catturava QUALUNQUE errore di dominio del resolver e lo
                          --   ri-sollevava come E_DOC_COMPONENTE_LISTINO_MANCANTE tenendo solo
                          --   MESSAGE_TEXT: il codice strutturato originale andava perso, e con
                          --   lui il tipo di risposta. Sette codici diversi arrivavano al client
                          --   come 422 «listino non configurato» anche quando il listino non
                          --   c'entrava nulla. Ora l'errore del resolver passa col proprio codice.
                          --   Il blocco BEGIN..END resta: non serve piu' a nulla di funzionale,
                          --   ma toglierlo vorrebbe dire re-indentare venticinque righe per
                          --   niente. Brief terzo lato §18.3.
                          END;
                      END IF;
                      v_inserted := v_inserted + 1;
                  END LOOP;

                  IF v_inserted = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_DOC_COMPOSITO_BOM_VUOTA',
                          jsonb_build_object('articolo_id', v_articolo_id,
                              'data_riferimento', p_data_riferimento),
                          NULL::uuid,
                          v_codice_articolo,
                          p_data_riferimento::text
                      );
                  END IF;

                  RETURN v_inserted;
              END;

              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_riga_componenti_preview(p_articolo_id uuid, p_uom_id bigint, p_quantita_padre numeric, p_data_riferimento date, p_ba_id bigint, p_utility_id integer, p_emittente_sr_id bigint, p_classe_utenza_id integer DEFAULT NULL::integer)
               RETURNS TABLE(articolo_componente_id uuid, componente_id uuid, componente_codice character varying, componente_descrizione character varying, coeff_qta_snapshot numeric, quantita_componente numeric, uom_id bigint, uom_codice character varying, iva_id bigint, prezzo_suggerito numeric, origine_prezzo character varying, resolver_error_reason text, obbligatorio boolean, esposizione_in_fattura character varying)
               LANGUAGE plpgsql
               STABLE
              AS $function$

              -- Scopo: preview read-only dei componenti BoM CASO A per il drawer riga DDT
              --   (form atomic). Per ogni componente attivo e valido tenta
              --   fn_resolve_prezzo_listino_v2; se fallisce ritorna prezzo_suggerito=NULL
              --   + motivazione in resolver_error_reason. Nessun side-effect (STABLE).
              --   rev 2026-05-13: modello unificato — rimosso filtro esposto_in_fattura=TRUE;
              --   obbligatorio e esposto_in_fattura sono ora esposti nella proiezione.
              --   rev 2026-10-01: esposizione_in_fattura (NASCOSTO | DESCRITTIVO | VALORIZZATO)
              --   al posto del booleano esposto_in_fattura
              --   (brief-db-esposizione-componenti-kit-in-fattura).
              DECLARE
                  v_rec     record;
                  v_resolve record;
                  v_msg     text;
              BEGIN
                  FOR v_rec IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             ac.esposizione_in_fattura,
                             a.codice       AS a_codice,
                             a.descrizione  AS a_descrizione,
                             a.uom_id       AS a_uom_id,
                             a.iva_id       AS a_iva_id,
                             um.codice      AS um_codice
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                        LEFT JOIN catalogo.unita_misura um ON um.id = a.uom_id
                       WHERE ac.prodotto_id        = p_articolo_id
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita           @> p_data_riferimento
                  LOOP
                      articolo_componente_id := v_rec.bom_entry_id;
                      componente_id          := v_rec.componente_id;
                      componente_codice      := v_rec.a_codice;
                      componente_descrizione := v_rec.a_descrizione;
                      coeff_qta_snapshot     := v_rec.coeff_qta;
                      quantita_componente    := v_rec.coeff_qta * p_quantita_padre;
                      uom_id                 := v_rec.a_uom_id;
                      uom_codice             := v_rec.um_codice;
                      iva_id                 := v_rec.a_iva_id;
                      obbligatorio           := v_rec.obbligatorio;
                      esposizione_in_fattura := v_rec.esposizione_in_fattura;

                      -- ⭐ Si chiama il NUCLEO, non il guscio (2026-08-19, slice C).
                      --   Prima qui c'era un BEGIN..EXCEPTION che catturava il P0001 del
                      --   resolver e lo trasformava in prezzo_suggerito NULL + motivazione.
                      --   Il risultato per il chiamante era gia' quello giusto — questa e'
                      --   una preview, non deve fallire — ma il costo era invisibile: il
                      --   database SCRIVE la riga di dbops.error_log PRIMA di sollevare, via
                      --   dblink fuori transazione, quindi catturare l'eccezione nascondeva
                      --   l'errore e lasciava il log. Una riga per componente non risolto, a
                      --   ogni apertura del drawer.
                      --   Il nucleo non solleva e non logga: riporta l'esito e basta.
                      SELECT * INTO v_resolve
                        FROM vendite.fn_resolve_prezzo_listino_v2_esito(
                            v_rec.componente_id,
                            v_rec.a_uom_id,
                            p_data_riferimento,
                            p_ba_id,
                            p_utility_id::integer,
                            p_emittente_sr_id,
                            p_classe_utenza_id,
                            p_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                        );

                      IF v_resolve.esito_codice IS NULL THEN
                          prezzo_suggerito      := v_resolve.prezzo_finale;
                          origine_prezzo        := v_resolve.origine;
                          resolver_error_reason := NULL;
                      ELSE
                          prezzo_suggerito := NULL;
                          origine_prezzo   := NULL;

                          -- Il testo mostrato resta una FRASE, come prima: il chiamante
                          -- e' un drawer e l'operatore legge questo. Il codice
                          -- strutturato viaggia in coda, per chi distingue i casi.
                          v_msg := script.fn_get_messaggio(v_resolve.esito_codice, NULL, 'it');

                          -- ⚠️ I SEGNAPOSTO VANNO SOSTITUITI, e fn_get_messaggio non lo fa:
                          --   accetta un valore solo, e questi messaggi ne hanno fino a
                          --   cinque. Senza format() l'operatore leggerebbe «Nessuna mappa
                          --   categoria %s -> listino per utility %s», che e' peggio di
                          --   nessun messaggio: sembra un difetto del programma.
                          --   ⛔ E format() con MENO valori dei segnaposto non degrada:
                          --   alza 22023. Il ripiego e' lo stesso che
                          --   script.fn_log_and_raise_error si e' dato il 2026-08-18 — se la
                          --   sostituzione fallisce resta il modello, brutto da leggere ma
                          --   innocuo. Una preview non deve rompersi per un messaggio.
                          IF array_length(v_resolve.esito_valori, 1) IS NOT NULL THEN
                              BEGIN
                                  v_msg := format(v_msg, VARIADIC v_resolve.esito_valori);
                              EXCEPTION WHEN OTHERS THEN
                                  NULL;  -- v_msg resta il modello
                              END;
                          END IF;

                          resolver_error_reason := v_msg || ' [' || v_resolve.esito_codice || ']';
                      END IF;

                      RETURN NEXT;
                  END LOOP;
              END;

              $function$;
