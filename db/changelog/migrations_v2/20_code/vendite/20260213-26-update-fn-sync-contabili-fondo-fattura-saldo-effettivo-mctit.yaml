databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260213-26-update-fn-sync-contabili-fondo-fattura-saldo-effettivo-mctit.yaml

  - changeSet:
      id: 20260213-26-update-fn-sync-contabili-fondo-fattura-saldo-effettivo
      author: mctit
      comment: "Sync contabili fondo su saldo effettivo (residuo al netto postabili)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_sync_contabili_fondo_fattura(
                p_fattura_figlia_id vendite.fatture.id%TYPE
              )
              RETURNS TABLE(
                inserted_righe integer,
                updated_righe integer,
                annullati_source integer
              )
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_centro_fondo_id pagamenti.centri_riscossione.id%TYPE;
                v_stato_contabile_codice text := 'VALIDATA';
                v_stato_riga_id pagamenti.vendite_contabili_righe_stati.id%TYPE;
                v_inserted integer := 0;
                v_updated integer := 0;
                v_annullati integer := 0;
                v_riga_id pagamenti.vendite_contabili_righe.id%TYPE;
                v_contabile_id pagamenti.vendite_contabili.id%TYPE;
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_data_valuta pagamenti.vendite_contabili_righe.data_valuta%TYPE;
                v_saldo numeric;
                v_has_movimenti boolean;
                v_saldo_contabile_tot numeric;
                v_has_righe_postabili boolean;
                v_saldo_contabile_source numeric;
                v_saldo_effettivo numeric;
                r record;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Sincronizza i fondi assegnati su righe contabili:
                --   - annulla la source se il saldo effettivo e' zero
                --   - inserisce/aggiorna la riga contabile altrimenti.
                -- =========================================================

                IF p_fattura_figlia_id IS NULL OR p_fattura_figlia_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'vendite.fn_sync_contabili_fondo_fattura', 'E_GENERICO',
                    jsonb_build_object('detail','p_fattura_figlia_id obbligatorio'),
                    NULL::uuid,
                    'p_fattura_figlia_id non valido'
                  );
                END IF;

                -- 1) Centro riscossione per fondo fattura.
                SELECT c.id
                  INTO v_centro_fondo_id
                  FROM pagamenti.centri_riscossione c
                 WHERE c.attivo IS TRUE
                   AND c.is_fondo_fattura IS TRUE
                 ORDER BY c.id
                 LIMIT 1;

                IF v_centro_fondo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'vendite.fn_sync_contabili_fondo_fattura', 'E_GENERICO',
                    jsonb_build_object('detail','Centro riscossione fondo fattura non configurato'),
                    NULL::uuid,
                    'Centro riscossione is_fondo_fattura mancante'
                  );
                END IF;

                -- 2) Stato riga contabile target.
                SELECT s.id
                  INTO v_stato_riga_id
                  FROM pagamenti.vendite_contabili_righe_stati s
                 WHERE s.attivo IS TRUE
                   AND s.codice_interno = 'ABBINATA'
                 LIMIT 1;

                IF v_stato_riga_id IS NULL THEN
                  SELECT s.id
                    INTO v_stato_riga_id
                    FROM pagamenti.vendite_contabili_righe_stati s
                   WHERE s.attivo IS TRUE
                   ORDER BY s.id
                   LIMIT 1;
                END IF;

                IF v_stato_riga_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'vendite.fn_sync_contabili_fondo_fattura', 'E_GENERICO',
                    jsonb_build_object('detail','Stato riga contabile non configurato'),
                    NULL::uuid,
                    'Stato riga contabile mancante'
                  );
                END IF;

                -- 3) Lotto associato alla fattura figlia (se presente).
                SELECT lf.lotto_id
                  INTO v_lotto_id
                  FROM vendite.fatturazione_lotti_fatture lf
                 WHERE lf.fattura_id = p_fattura_figlia_id
                 ORDER BY lf.id DESC
                 LIMIT 1;

                FOR r IN
                  SELECT
                    s.id AS source_id,
                    s.fattura_sorgente_id,
                    s.importo,
                    s.billing_account_id,
                    fsrc.data AS data_fattura_sorgente
                  FROM vendite.fatture_fondi_fattura_source s
                  JOIN vendite.tipi_fondi_fattura t
                    ON t.id = s.tipo_fondo_fattura_id
                  JOIN vendite.fatture fsrc
                    ON fsrc.id = s.fattura_sorgente_id
                 WHERE s.fattura_figlia_id = p_fattura_figlia_id
                   AND s.attivo IS TRUE
                   AND s.stato = 'ASSEGNATO'
                   AND t.codice_interno = 'F_F_ADD_ACC'
                  ORDER BY s.id
                LOOP
                  -- 4) Saldo fattura (residuo) e saldo contabile postabile totale.
                  SELECT sf.saldo, sf.has_movimenti
                    INTO v_saldo, v_has_movimenti
                    FROM pagamenti.fn_get_saldo_fattura(r.fattura_sorgente_id) sf;

                  SELECT sc.saldo_contabile, sc.has_righe_postabili
                    INTO v_saldo_contabile_tot, v_has_righe_postabili
                    FROM pagamenti.fn_get_saldo_fattura_contabili(r.fattura_sorgente_id) sc;

                  -- 5) Quota contabile del source corrente (per idempotenza):
                  --    viene esclusa dal saldo contabile totale.
                  SELECT COALESCE(SUM(cr.importo), 0)::numeric
                    INTO v_saldo_contabile_source
                    FROM pagamenti.vendite_contabili_righe cr
                    JOIN pagamenti.vendite_contabili_righe_stati st
                      ON st.id = cr.stato_id
                   WHERE cr.attivo IS TRUE
                     AND st.is_postabile IS TRUE
                     AND cr.fattura_id = r.fattura_sorgente_id
                     AND COALESCE(cr.meta ->> 'origine', '') = 'FONDO_FATTURA'
                     AND COALESCE(cr.meta ->> 'fondo_source_id', '') = r.source_id::text;

                  v_saldo_effettivo := COALESCE(v_saldo, 0)
                                     - (COALESCE(v_saldo_contabile_tot, 0) - COALESCE(v_saldo_contabile_source, 0));

                  IF COALESCE(v_saldo_effettivo, 0) = 0 THEN
                    UPDATE vendite.fatture_fondi_fattura_source s
                       SET stato = 'ANNULLATO',
                           data_update = now(),
                           user_update = current_user
                     WHERE s.id = r.source_id
                       AND s.stato IS DISTINCT FROM 'ANNULLATO';

                    IF FOUND THEN
                      v_annullati := v_annullati + 1;
                    END IF;

                    CONTINUE;
                  END IF;

                  -- 6) Regola data_valuta.
                  IF current_date > r.data_fattura_sorgente THEN
                    v_data_valuta := current_date;
                  ELSE
                    v_data_valuta := r.data_fattura_sorgente;
                  END IF;

                  -- 7) Testata contabile target.
                  v_contabile_id := pagamenti.fn_get_or_create_vendite_contabile(
                    p_centro_riscossione_id => v_centro_fondo_id,
                    p_data_contabile => r.data_fattura_sorgente,
                    p_data_registrazione => r.data_fattura_sorgente,
                    p_ente_incasso_id => NULL,
                    p_lotto_id => v_lotto_id,
                    p_codice_stato_interno => v_stato_contabile_codice,
                    p_meta => jsonb_build_object(
                      'origine', 'FONDO_FATTURA',
                      'fattura_figlia_id', p_fattura_figlia_id
                    )
                  );

                  -- 8) Lookup riga esistente per source (idempotenza).
                  SELECT cr.id
                    INTO v_riga_id
                    FROM pagamenti.vendite_contabili_righe cr
                   WHERE cr.attivo IS TRUE
                     AND COALESCE(cr.meta ->> 'origine', '') = 'FONDO_FATTURA'
                     AND COALESCE(cr.meta ->> 'fondo_source_id', '') = r.source_id::text
                   ORDER BY cr.id DESC
                   LIMIT 1;

                  -- 9) Upsert riga contabile fondo.
                  IF v_riga_id IS NULL THEN
                    INSERT INTO pagamenti.vendite_contabili_righe (
                      contabile_id,
                      riferimento_ente,
                      data_pagamento,
                      data_valuta,
                      data_operazione,
                      importo,
                      fattura_id,
                      billing_account_id,
                      stato_id,
                      motivo_sospeso,
                      meta,
                      attivo,
                      data_insert,
                      user_insert,
                      data_update,
                      user_update
                    ) VALUES (
                      v_contabile_id,
                      concat('FONDO_SRC_', r.source_id::text),
                      r.data_fattura_sorgente,
                      v_data_valuta,
                      now(),
                      r.importo,
                      r.fattura_sorgente_id,
                      r.billing_account_id,
                      v_stato_riga_id,
                      NULL,
                      jsonb_build_object(
                        'origine', 'FONDO_FATTURA',
                        'fondo_source_id', r.source_id,
                        'fattura_figlia_id', p_fattura_figlia_id
                      ),
                      TRUE,
                      now(),
                      current_user,
                      now(),
                      current_user
                    );
                    v_inserted := v_inserted + 1;
                  ELSE
                    UPDATE pagamenti.vendite_contabili_righe cr
                       SET contabile_id = v_contabile_id,
                           riferimento_ente = concat('FONDO_SRC_', r.source_id::text),
                           data_pagamento = r.data_fattura_sorgente,
                           data_valuta = v_data_valuta,
                           data_operazione = r.data_fattura_sorgente,
                           importo = r.importo,
                           fattura_id = r.fattura_sorgente_id,
                           billing_account_id = r.billing_account_id,
                           stato_id = v_stato_riga_id,
                           motivo_sospeso = NULL,
                           meta = COALESCE(cr.meta, '{}'::jsonb)
                                  || jsonb_build_object(
                                    'origine', 'FONDO_FATTURA',
                                    'fondo_source_id', r.source_id,
                                    'fattura_figlia_id', p_fattura_figlia_id
                                  ),
                           data_update = now(),
                           user_update = current_user
                     WHERE cr.id = v_riga_id;
                    v_updated := v_updated + 1;
                  END IF;
                END LOOP;

                RETURN QUERY
                SELECT v_inserted, v_updated, v_annullati;
              END;
              $$;

              COMMENT ON FUNCTION vendite.fn_sync_contabili_fondo_fattura(vendite.fatture.id%TYPE)
                IS 'Sincronizza righe contabili fondo fattura su saldo effettivo (residuo al netto postabili), preservando idempotenza.';
