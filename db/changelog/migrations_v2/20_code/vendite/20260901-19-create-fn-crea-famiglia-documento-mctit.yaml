# LA MADRE — creare una famiglia E darle i suoi registri, o niente
#   vendite.fn_crea_famiglia_documento
#   Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.7 (DB-5)
#
# ── ⛔ PERCHE' UNA MADRE E NON DUE CHIAMATE ──────────────────────
#   Creare la famiglia e provvisionarne i registri sono DUE scritture. Fatte in
#   sequenza da fuori, se la seconda fallisce resta una famiglia senza registri:
#   una riga di catalogo che promette un documento che non si numerera' mai, e
#   che nessun vincolo segnala. E' il caso della §5b delle linee guida — «una
#   sola SELECT su connessione autocommit e' atomica per costruzione».
#
# ── ⭐ COSA LA MADRE NON FA, ed e' deliberato ────────────────────
#   Non valida i riferimenti (lo fa il guard `a10_guard_riferimenti`), non
#   scrive audit ne' tx_id (ci sono i trigger), non decide se la famiglia sia
#   fiscale. Fa le DUE scritture e le tiene insieme: tutto il resto ha gia' la
#   sua sede, e rifarlo qui sarebbe il secondo elenco.
#
# ── ⛔ E NON C'E' UNA MADRE PER `update` NE' PER `attivo` ────────
#   Sono scritture singole: il backend le fa come gia' fa sui registri —
#   UPDATE diretto e traduzione dei vincoli. Una madre dove non c'e' niente da
#   tenere insieme e' solo un livello in piu' da attraversare per leggere il
#   codice.
#
# ── ⚠️ SECURITY INVOKER, motivato ───────────────────────────────
#   Scrive su vendite.famiglie_documento, che non ha RLS e su cui zeroerp_app
#   ha gia' INSERT. Il provisioning che chiama e' DEFINER per conto suo, e la
#   ragione sta nella sua intestazione: qui non serve nessun privilegio in piu'.
#
# ── ⚠️ IL CONTEGGIO DEI REGISTRI TORNA AL CHIAMANTE ─────────────
#   `registri_creati` non e' una curiosita': una famiglia ATTIVA che ne crea
#   ZERO significa che non c'e' nessun emittente, e il documento di quella
#   famiglia non nascera' comunque. Il backend lo mostra, non lo ignora.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260901-19-create-fn-crea-famiglia-documento-mctit.yaml

  - changeSet:
      id: 20260901-19-create-fn-crea-famiglia-documento
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        La funzione MADRE del CRUD delle famiglie: crea la riga di catalogo E le da'' i registri di
        numerazione su tutti gli emittenti, in una transazione sola. ⛔ Sono due scritture (§5b delle
        linee guida): fatte in sequenza da fuori, un fallimento della seconda lascia una famiglia senza
        registri — una riga che promette un documento che non si numerera'' mai, e che nessun vincolo
        segnala. ⭐ Non valida i riferimenti e non scrive audit: hanno gia'' la loro sede nei trigger.
        ⛔ Non esiste una madre per update e per attivo: sono scritture singole. ⚠️ Torna anche
        `registri_creati`, perche'' ZERO su una famiglia attiva vuol dire che non c''e'' nessun emittente
        e quel documento non nascera'' comunque. Piano:
        brief-be-fe-crud-registri-di-numerazione, sezione 11.7 (DB-5).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: famiglie_documento
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_provision_registri_famiglia';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_crea_famiglia_documento(
                      p_codice_interno          vendite.famiglie_documento.codice_interno%TYPE,
                      p_descrizione             vendite.famiglie_documento.descrizione%TYPE,
                      p_schema_tabella          vendite.famiglie_documento.schema_tabella%TYPE,
                      p_nome_tabella            vendite.famiglie_documento.nome_tabella%TYPE,
                      p_colonna_numero          vendite.famiglie_documento.colonna_numero%TYPE,
                      p_colonna_billing_account vendite.famiglie_documento.colonna_billing_account%TYPE,
                      p_colonna_serie           vendite.famiglie_documento.colonna_serie%TYPE DEFAULT NULL,
                      p_prefisso_default        vendite.famiglie_documento.prefisso_default%TYPE DEFAULT NULL,
                      p_lunghezza_default       vendite.famiglie_documento.lunghezza_default%TYPE DEFAULT 7,
                      p_attivo                  vendite.famiglie_documento.attivo%TYPE DEFAULT TRUE,
                      p_meta                    vendite.famiglie_documento.meta%TYPE DEFAULT '{}'::jsonb)
               RETURNS TABLE (
                      famiglia_id      vendite.famiglie_documento.id%TYPE,
                      codice_interno   vendite.famiglie_documento.codice_interno%TYPE,
                      registri_creati  integer)
               LANGUAGE plpgsql
               SECURITY INVOKER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_id      vendite.famiglie_documento.id%TYPE;
                  v_codice  vendite.famiglie_documento.codice_interno%TYPE;
                  v_creati  integer;
                  v_campo   text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Creare una famiglia di documento E provvisionarne i
                  --   registri su tutti gli emittenti, come UNA cosa sola.
                  --   Torna (id, codice_interno, registri_creati).
                  --
                  -- ⛔ Perche' una madre: sono due scritture. Se la seconda
                  --   fallisse dopo la prima, resterebbe una famiglia senza
                  --   registri — un documento promesso che non si numerera'
                  --   mai, e nessun vincolo lo dice. Una sola SELECT su
                  --   connessione autocommit e' atomica per costruzione
                  --   (§5b delle linee guida).
                  --
                  -- ⭐ Cosa NON fa: non valida i riferimenti (lo fa il guard
                  --   a10_guard_riferimenti), non scrive audit ne' tx_id (ci
                  --   sono i trigger), non ricontrolla la serie (c'e' il guard).
                  --   Fa le due scritture e le tiene insieme.
                  -- =========================================================

                  -- ---- I sei obbligatori --------------------------------
                  -- ⚠️ Il NOT NULL della colonna non basta: una stringa VUOTA
                  --   lo attraversa, e un codice_interno vuoto sarebbe il
                  --   bersaglio di una FK — cioe' un riferimento che non si
                  --   riesce piu' a nominare. Qui si guarda il VALORE.
                  -- ⭐ `campo` nel contesto: e' il canale con cui il frontend
                  --   accende l'input giusto. Il messaggio a catalogo resta
                  --   generico di proposito — la frase utile la compone la
                  --   maschera, che sa come si chiama quel campo a video.
                  v_campo := CASE
                      WHEN COALESCE(btrim(p_codice_interno), '')          = '' THEN 'codice_interno'
                      WHEN COALESCE(btrim(p_descrizione), '')             = '' THEN 'descrizione'
                      WHEN COALESCE(btrim(p_schema_tabella), '')          = '' THEN 'schema_tabella'
                      WHEN COALESCE(btrim(p_nome_tabella), '')            = '' THEN 'nome_tabella'
                      WHEN COALESCE(btrim(p_colonna_numero), '')          = '' THEN 'colonna_numero'
                      WHEN COALESCE(btrim(p_colonna_billing_account), '') = '' THEN 'colonna_billing_account'
                      ELSE NULL
                  END;

                  IF v_campo IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_crea_famiglia_documento',
                          'E_VENDITE_VALIDATION',
                          jsonb_build_object('campo', v_campo),
                          NULL::uuid,
                          -- ⚠️ `VARIADIC ARRAY[]::text[]` e non la chiamata a
                          --   cinque argomenti: senza, PostgreSQL non risolve
                          --   la firma variadica e risponde «la funzione non
                          --   esiste» — un errore TECNICO al posto di quello di
                          --   dominio, cioe' il guard che si autoannulla.
                          --   ⭐ Il messaggio a catalogo non ha segnaposti: qui
                          --   non c'e' niente da passare, ma va passato lo
                          --   stesso, vuoto.
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- ---- 1a scrittura: la riga di catalogo -----------------
                  -- ⚠️ La stringa vuota su `colonna_serie` diventa NULL: il
                  --   vuoto e' la dichiarazione che questa famiglia una serie
                  --   non ce l'ha, e un '' salvato al posto di NULL la
                  --   renderebbe indistinguibile da una serie che si chiama
                  --   cosi'. Stesso trattamento per il prefisso.
                  INSERT INTO vendite.famiglie_documento (
                      codice_interno, descrizione, schema_tabella, nome_tabella,
                      colonna_numero, colonna_billing_account, colonna_serie,
                      prefisso_default, lunghezza_default, attivo, meta)
                  VALUES (
                      btrim(p_codice_interno), btrim(p_descrizione),
                      btrim(p_schema_tabella), btrim(p_nome_tabella),
                      btrim(p_colonna_numero), btrim(p_colonna_billing_account),
                      NULLIF(btrim(COALESCE(p_colonna_serie, '')), ''),
                      NULLIF(btrim(COALESCE(p_prefisso_default, '')), ''),
                      COALESCE(p_lunghezza_default, 7),
                      COALESCE(p_attivo, TRUE),
                      COALESCE(p_meta, '{}'::jsonb))
                  RETURNING id, vendite.famiglie_documento.codice_interno
                       INTO v_id, v_codice;

                  -- ---- 2a scrittura: i registri mancanti -----------------
                  -- ⚠️ Su una famiglia creata SPENTA il provisioning torna 0
                  --   per costruzione (il filtro `fd.attivo` sta nella
                  --   primitiva). Non e' un errore: e' il caso «si semina
                  --   prima, si accende dopo».
                  v_creati := vendite.fn_provision_registri_famiglia(v_codice);

                  RETURN QUERY SELECT v_id, v_codice, v_creati;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_crea_famiglia_documento(
                      vendite.famiglie_documento.codice_interno%TYPE,
                      vendite.famiglie_documento.descrizione%TYPE,
                      vendite.famiglie_documento.schema_tabella%TYPE,
                      vendite.famiglie_documento.nome_tabella%TYPE,
                      vendite.famiglie_documento.colonna_numero%TYPE,
                      vendite.famiglie_documento.colonna_billing_account%TYPE,
                      vendite.famiglie_documento.colonna_serie%TYPE,
                      vendite.famiglie_documento.prefisso_default%TYPE,
                      vendite.famiglie_documento.lunghezza_default%TYPE,
                      vendite.famiglie_documento.attivo%TYPE,
                      vendite.famiglie_documento.meta%TYPE)
              IS 'MADRE del CRUD delle famiglie di documento: crea la riga di catalogo E le da'' i registri di numerazione su tutti gli emittenti, come una cosa sola. Torna (famiglia_id, codice_interno, registri_creati). ⛔ PERCHE'' UNA MADRE: sono DUE scritture, e fatte in sequenza da fuori un fallimento della seconda lascerebbe una famiglia senza registri — cioe'' una riga di catalogo che promette un documento che non si numerera'' mai, e che nessun vincolo segnala. Una sola SELECT su connessione autocommit e'' atomica per costruzione (§5b delle linee guida). ⭐ COSA NON FA, ed e'' deliberato: non valida i riferimenti (c''e'' il guard a10_guard_riferimenti), non scrive audit ne'' tx_id (ci sono i trigger), non ricontrolla la serie. Rifare qui quei controlli sarebbe il secondo elenco che diverge. ⛔ NON ESISTE una madre per l''update ne'' per il verbo attivo: sono scritture singole, e il backend le fa come gia'' fa sui registri. ⚠️ I sei campi obbligatori si controllano sul VALORE e non sul NULL: una stringa vuota attraversa il NOT NULL, e un codice_interno vuoto sarebbe il bersaglio di una FK — un riferimento che non si riesce piu'' a nominare. Il `campo` viaggia nel contesto perche'' e'' il canale con cui il frontend accende l''input giusto. ⚠️ Su una famiglia creata SPENTA il provisioning torna 0 per costruzione: e'' il caso «si semina prima, si accende dopo», non un errore. ⚠️ Il conteggio torna al chiamante perche'' ZERO su una famiglia ATTIVA significa che non c''e'' nessun emittente, e quel documento non nascera'' comunque. ⚠️ SECURITY INVOKER: scrive su una tabella senza RLS su cui zeroerp_app ha gia'' INSERT; il provisioning che chiama e'' DEFINER per conto suo. Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.7 (DB-5).';

              GRANT EXECUTE ON FUNCTION vendite.fn_crea_famiglia_documento(
                      vendite.famiglie_documento.codice_interno%TYPE,
                      vendite.famiglie_documento.descrizione%TYPE,
                      vendite.famiglie_documento.schema_tabella%TYPE,
                      vendite.famiglie_documento.nome_tabella%TYPE,
                      vendite.famiglie_documento.colonna_numero%TYPE,
                      vendite.famiglie_documento.colonna_billing_account%TYPE,
                      vendite.famiglie_documento.colonna_serie%TYPE,
                      vendite.famiglie_documento.prefisso_default%TYPE,
                      vendite.famiglie_documento.lunghezza_default%TYPE,
                      vendite.famiglie_documento.attivo%TYPE,
                      vendite.famiglie_documento.meta%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_crea_famiglia_documento(
                      character varying, character varying, text, text, text, text,
                      text, character varying, integer, boolean, jsonb);
