# ------------------------------------------------------------
# D2: trigger auto-populate + immutabilita' per
# vendite.contratti.categoria_cliente_id_snapshot.
#
# INSERT: se il caller non passa il valore (NULL), lo popola
#         automaticamente da billing_account.categoria_cliente_id.
# UPDATE: blocca modifica se il valore precedente era NOT NULL
#         (immutabilita' post-creazione). Eccezione: se il vecchio
#         valore era NULL (backfill) la modifica e' ammessa (una sola
#         volta, poi diventa immutabile).
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: /migrations_v2/20_code/vendite/20260415-12-create-trgfn-contratti-set-categoria-cliente-snapshot-mctit.yaml

    - changeSet:
          id: 20260415-12-create-trgfn-contratti-set-categoria-cliente-snapshot
          author: mctit
          runOnChange: false
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot()
                            RETURNS trigger
                            LANGUAGE plpgsql
                        AS $$
                        DECLARE
                            v_categoria_id anagrafiche.billing_account.categoria_cliente_id%TYPE;
                        BEGIN
                            -- INSERT: auto-populate da BA se il caller non lo passa.
                            IF TG_OP = 'INSERT' AND NEW.categoria_cliente_id_snapshot IS NULL THEN
                                SELECT ba.categoria_cliente_id
                                  INTO v_categoria_id
                                  FROM anagrafiche.billing_account ba
                                 WHERE ba.id = NEW.billing_account_id;

                                NEW.categoria_cliente_id_snapshot := v_categoria_id;
                            END IF;

                            -- UPDATE: immutabilita' post-attivazione.
                            -- In DRAFT la categoria puo' essere cambiata (es. riclassificazione
                            -- BA durante la preparazione del contratto). Fuori da DRAFT e'
                            -- congelata: modifica bloccata.
                            IF TG_OP = 'UPDATE'
                               AND OLD.categoria_cliente_id_snapshot IS DISTINCT FROM NEW.categoria_cliente_id_snapshot
                            THEN
                                IF (SELECT s.codice_interno
                                      FROM config.stati_doc_contratti s
                                     WHERE s.id = NEW.stato_doc_contratto_id) <> 'DRAFT'
                                THEN
                                    -- E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE: 1 %s = contratto.
                                    PERFORM script.fn_log_and_raise_error(
                                        'vendite',
                                        TG_NAME,
                                        'E_CONTRATTO_CATEGORIA_SNAPSHOT_IMMUTABILE',
                                        jsonb_build_object(
                                            'contratto_id', NEW.id,
                                            'old_categoria', OLD.categoria_cliente_id_snapshot,
                                            'new_categoria', NEW.categoria_cliente_id_snapshot
                                        ),
                                        NULL::uuid,
                                        NEW.id::text
                                    );
                                END IF;
                            END IF;

                            RETURN NEW;
                        END
                        $$;

                        COMMENT ON FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot() IS
                            'Auto-populate categoria_cliente_id_snapshot da BA su INSERT. In UPDATE: modifica ammessa solo in stato DRAFT; fuori da DRAFT il valore e'' congelato (immutabile).';

                        DROP TRIGGER IF EXISTS trg_contratti_a10_set_categoria_cliente_snapshot_ins_upd
                            ON vendite.contratti;
                        CREATE TRIGGER trg_contratti_a10_set_categoria_cliente_snapshot_ins_upd
                            BEFORE INSERT OR UPDATE OF categoria_cliente_id_snapshot
                            ON vendite.contratti
                            FOR EACH ROW
                            EXECUTE FUNCTION vendite.trgfn_contratti_set_categoria_cliente_snapshot();
