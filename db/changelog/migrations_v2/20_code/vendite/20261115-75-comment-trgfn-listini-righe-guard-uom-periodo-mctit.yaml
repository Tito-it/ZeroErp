# IL COMMENT DEL GUARD DELL'UNITA' DELLE RIGHE DI LISTINO, AL PRESENTE
#   Brief: brief-db-stati-documento-dal-vocabolario §6.28, D-GUARD-MUTI decisa (a)
#   da Tid il 2026-11-15.
#
#   Il COMMENT diceva che un prezzo nuovo nasce «in BOZZA, o in ATTIVA come
#   rettifica»: dal 20261115-65 una riga nuova nasce solo in bozza, e fuori
#   dalla bozza parla prima il guard di stato. Il guard resta: giudica la riga
#   nuova in bozza e la riga riaccesa. Cambia solo il COMMENT; il rollback porta
#   quello di prima, letto dal catalogo dello scratch il 2026-11-15.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-75-comment-trgfn-listini-righe-guard-uom-periodo-mctit.yaml

  - changeSet:
      id: 20261115-75-comment-trgfn-listini-righe-guard-uom-periodo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di vendite.trgfn_listini_righe_guard_uom_periodo al presente: la riga nuova nasce solo in bozza.
        Brief: brief-db-stati-documento-dal-vocabolario, D-GUARD-MUTI (a).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_uom_periodo()
              IS 'Guard dell''unita'' delle righe di listino (vendite.listini_righe): l''unita'' di un prezzo si converte per l''articolo in ogni giorno del periodo della versione (catalogo.fn_uom_primo_giorno_non_convertibile sulla validita della versione). BEFORE INSERT e UPDATE OF attivo, per una riga attiva: un prezzo nuovo e un prezzo riacceso, che si scrivono in bozza (fuori dalla bozza parla prima il guard di stato, vendite.trgfn_listini_righe_guard_stato). Articolo, unita'' e versione di una riga non cambiano (E_LISTINO_RIGA_IDENTITA_IMMUTABILE). Scoperto -> E_LISTINO_UOM_NON_CONVERTIBILE (campo uom_id; valori: versione, unita'', articolo, primo giorno scoperto; bersaglio LISTINO_VERSIONE). Gli altri due lati della regola: il periodo della versione (vendite.trgfn_listini_versioni_guard_uom_periodo) e il catalogo che cambia (catalogo.trgfn_uom_guard_listini_attivi); per una bozza, l''attivazione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_uom_periodo()
              IS 'Guard dell''unita'' delle righe di listino (vendite.listini_righe): l''unita'' di un prezzo si converte per l''articolo in ogni giorno del periodo della versione (catalogo.fn_uom_primo_giorno_non_convertibile sulla validita della versione). BEFORE INSERT e UPDATE OF attivo, per una riga attiva: un prezzo nuovo (in BOZZA, o in ATTIVA come rettifica) e un prezzo riacceso. Articolo, unita'' e versione di una riga non cambiano (E_LISTINO_RIGA_IDENTITA_IMMUTABILE). Scoperto -> E_LISTINO_UOM_NON_CONVERTIBILE (campo uom_id; valori: versione, unita'', articolo, primo giorno scoperto; bersaglio LISTINO_VERSIONE). Gli altri due lati della regola: il periodo della versione (vendite.trgfn_listini_versioni_guard_uom_periodo) e il catalogo che cambia (catalogo.trgfn_uom_guard_listini_attivi); per una BOZZA, l''attivazione.';
