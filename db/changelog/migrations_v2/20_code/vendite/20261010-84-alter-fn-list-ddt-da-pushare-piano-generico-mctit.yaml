# IL LISTER DEI DDT DA SPINGERE SI PIANIFICA UNA VOLTA: plan_cache_mode = force_generic_plan
#   vendite.fn_list_ddt_da_pushare(date, bigint, integer, bigint)
#   Brief: brief-db-segment-base-commesse-attivita §6, P-10 (decisione di Tid:
#   strada 1 anche qui, dopo la misura).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   Stessa causa di 20261010-83: il lister e' plpgsql e chiama la diagnosi
#   vendite.fn_ddt_push_diagnosi — SQL incorporata, una query enorme — con un
#   parametro. In modo `auto` la plancache la ripianifica a ogni chiamata. Il
#   backend lo chiama per singolo DDT (ddt_repository: fn_list_ddt_da_pushare(
#   NULL, NULL, NULL, <ddt>)).
#   Fatti datati 2026-10-10, dbdev come app, dopo 20261010-83:
#     56 chiamate per DDT: auto 1,30 s, generico 0,45 s;
#     senza filtri (una chiamata): auto 1,19 s, generico 1,11 s — il generico
#     non peggiora il caso «tutti».
#
# ── LA CURA ─────────────────────────────────────────────────────────
#   ALTER FUNCTION … SET plan_cache_mode = force_generic_plan.
#   ⭐ ALTER, non CREATE OR REPLACE: corpo, firma e %TYPE restano.
#
# ── ⛔ PROPRIETA' INVISIBILE NEL CORPO ───────────────────────────────
#   Un CREATE OR REPLACE senza la clausola SET la perde, con risultati
#   identici. Presidio:
#   db/pgtap/script/test-fn-available-actions-ddt-piano-generico-v1.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261010-84-alter-fn-list-ddt-da-pushare-piano-generico-mctit.yaml

  - changeSet:
      id: 20261010-84-alter-fn-list-ddt-da-pushare-piano-generico
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.fn_list_ddt_da_pushare: SET plan_cache_mode = force_generic_plan. Chiamato per DDT,
        in modo auto ripianificava a ogni chiamata la diagnosi incorporata: 1,30 s contro 0,45 s su
        56 chiamate; il caso senza filtri non cambia. ALTER: corpo e %TYPE restano.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'fn_list_ddt_da_pushare';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⛔ Si perde a ogni CREATE OR REPLACE che non ripete la clausola SET:
              --    presidio in script/test-fn-available-actions-ddt-piano-generico-v1.sql.
              ALTER FUNCTION vendite.fn_list_ddt_da_pushare(date, bigint, integer, bigint)
                SET plan_cache_mode = force_generic_plan;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER FUNCTION vendite.fn_list_ddt_da_pushare(date, bigint, integer, bigint) RESET plan_cache_mode;
