# LETTORE: LE COPPIE (TIPO DOCUMENTO, NATURA) CHE UN EMITTENTE NON SA FATTURARE
#   vendite.fn_coppie_fattura_scoperte(p_emittente_soggetto_ruolo_id): per ogni
#   emittente attivo (o per quello indicato), le coppie (tipo documento attivo,
#   natura attiva) per cui vendite.fn_lookup_registro_id NON trova un registro
#   valido per tutte le utility.
#   R-BE-14 del BE, decisioni D-14a … D-14d di Tid (2026-10-18),
#   brief-db-processi-accensione-per-ambiente §6.12 (richiesta) e §6.14
#   (risposta).
#
# -- PERCHE' UN LETTORE A SE' ----------------------------------------------------
#   La stessa domanda — «quali coppie non hanno registro?» — serve due volte
#   alla primitiva del provisioning (20261019-08: per far nascere il registro
#   standard e per collegarlo) e serve al pgTAP. Scritta tre volte, divergerebbe.
#
# -- «COPERTA» VUOL DIRE QUELLO CHE DICE IL LOOKUP --------------------------------
#   Una coppia e' coperta se vendite.fn_lookup_registro_id(tipo, natura, NULL,
#   emittente) risponde un registro, cioe' se l'emittente ha un registro con
#   utility NULL (valido per tutte) collegato a quella coppia. Non si riscrive
#   la ricerca: si CHIAMA la funzione che la fa, cosi' la copertura non puo'
#   dire una cosa diversa da quella che vedra' chi emette. Un registro legato a
#   UNA utility non copre le altre, e la coppia resta scoperta.
#
# -- SOLO EMITTENTI ATTIVI ---------------------------------------------------------
#   Un emittente spento non emette: le sue coppie non sono un buco. Quando si
#   riaccende, il trigger su anagrafiche.emittenti_fiscali lo provisiona.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-07-create-fn-coppie-fattura-scoperte-mctit.yaml

  - changeSet:
      id: 20261019-07-create-fn-coppie-fattura-scoperte
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Crea vendite.fn_coppie_fattura_scoperte: per ogni emittente attivo, le coppie (tipo
        documento attivo, natura attiva) che fn_lookup_registro_id non sa risolvere. Lettore
        della primitiva del provisioning (20261019-08). R-BE-14, D-14a … D-14d di Tid,
        brief-db-processi-accensione-per-ambiente §6.14.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_coppie_fattura_scoperte(
                  p_emittente_soggetto_ruolo_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE DEFAULT NULL)
               RETURNS TABLE(
                  emittente_soggetto_ruolo_id vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE,
                  tipo_doc_fiscale_id         vendite.tipi_doc_fiscale_registri.tipo_doc_fiscale_id%TYPE,
                  natura_doc_id               vendite.tipi_doc_fiscale_registri.natura_doc_id%TYPE)
               LANGUAGE plpgsql
               SECURITY INVOKER
               STABLE
              AS $function$
              #variable_conflict use_column
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Le coppie (tipo documento, natura) per cui un emittente
                  --   non ha un registro delle fatture: quelle su cui
                  --   vendite.fn_get_registro_id solleverebbe
                  --   «registro non risolto».
                  --
                  -- Regole:
                  --   - p_emittente_soggetto_ruolo_id NULL = tutti gli
                  --     emittenti attivi;
                  --   - solo tipi documento e nature attivi;
                  --   - «coperta» = fn_lookup_registro_id risponde con
                  --     utility NULL: si chiama il lookup, non lo si riscrive.
                  -- =========================================================
                  RETURN QUERY
                  SELECT ef.soggetto_ruolo_id, t.id, n.id
                    FROM anagrafiche.emittenti_fiscali ef
                   CROSS JOIN config.tipi_doc_fiscale t
                   CROSS JOIN config.nature_doc_fiscale n
                   WHERE (p_emittente_soggetto_ruolo_id IS NULL
                          OR ef.soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                     AND ef.attivo IS TRUE
                     AND t.attivo IS TRUE
                     AND n.attivo IS TRUE
                     AND NOT EXISTS (
                           SELECT 1
                             FROM vendite.fn_lookup_registro_id(
                                      p_tipo_doc_fiscale_id         => t.id,
                                      p_natura_doc_id               => n.id,
                                      p_utility_id                  => NULL,
                                      p_emittente_soggetto_ruolo_id => ef.soggetto_ruolo_id) k
                            WHERE k.registro_id IS NOT NULL)
                   ORDER BY ef.soggetto_ruolo_id, t.id, n.id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_coppie_fattura_scoperte(
                      anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE)
              IS 'LETTORE (2026-10-18): per ogni emittente ATTIVO (o per quello indicato), le coppie (tipo documento attivo, natura attiva) che vendite.fn_lookup_registro_id non sa risolvere con utility NULL, cioe'' i documenti per cui vendite.fn_get_registro_id solleverebbe «registro non risolto». ⭐ La copertura la decide il lookup, CHIAMATO e non riscritto: non puo'' dire una cosa diversa da quella che vede chi emette. Un registro legato a UNA utility non copre le altre. Un emittente spento non e'' un buco: lo provisiona il trigger su anagrafiche.emittenti_fiscali quando si riaccende. Lettori: vendite.fn_provision_registri (registro standard delle fatture e suoi collegamenti, 20261019-08), il pgTAP vendite/test-registro-fattura-nasce-con-emittente-v1. R-BE-14, D-14a … D-14d di Tid, brief-db-processi-accensione-per-ambiente §6.14.';

              GRANT EXECUTE ON FUNCTION vendite.fn_coppie_fattura_scoperte(
                      anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            sql: >
              DROP FUNCTION IF EXISTS vendite.fn_coppie_fattura_scoperte(anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE);
