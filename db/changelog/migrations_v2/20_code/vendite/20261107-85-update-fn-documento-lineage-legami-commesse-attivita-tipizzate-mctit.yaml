# IL LEGAME DELLA LINEAGE SULLE RIGHE DI COMMESSA DEL MODELLO: vendite.fn_documento_lineage_legami
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto C, giro C.3.
#
#   Gli archi documento -> commessa (B, E, F, U) confrontavano commesse_attivita.sorgente_uid
#   con l'uid testuale del documento: dal 20261107-70 la chiave sta nella colonna del
#   key_selector. Il documento si risolve come prima dalla chiave del nodo (testo, il ponte
#   del BB che risolve), e le righe si cercano con la regola d'incontro su id e uid.
#   Corpo dal vivo (dbdev, 2026-11-07; stringa SQL, non BEGIN ATOMIC), firma dal 20261106-44
#   (tipi nudi dichiarati: chiavi polimorfe dei nodi), clausole del vivo (DEFINER,
#   search_path, jit). COMMENT riscritto al presente (§5d).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261107-85-update-fn-documento-lineage-legami-commesse-attivita-tipizzate-mctit.yaml

  - changeSet:
      id: 20261107-85-update-fn-documento-lineage-legami-commesse-attivita-tipizzate
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_documento_lineage_legami: gli archi documento -> commessa cercano le righe di
        commessa con la regola d'incontro. brief-db-sorgente-documento-e-riga §7.2 lotto C, giro
        C.3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_documento_lineage_legami(
                  -- ⚠️ Tipi nudi DICHIARATI: la lettera nasce in
                  --   fn_documento_lineage_archi; tipi e chiavi sono quelle POLIMORFE
                  --   dei nodi (config.sorgenti.id, chiave resa a text). Array
                  --   paralleli, un arco per posizione.
                  p_archi         text[],
                  p_from_tipo_ids bigint[],
                  p_from_uids     text[],
                  p_to_tipo_ids   bigint[],
                  p_to_uids       text[])
              RETURNS TABLE(arco text, from_tipo_id bigint, from_uid text,
                            to_tipo_id bigint, to_uid text, is_legame_ritirato boolean)
              LANGUAGE sql
              STABLE SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              SET jit TO 'off'
              AS $function$
                  -- Scopo: per ogni arco chiesto, il suo legame e' ritirato con i due
                  --   nodi vivi? true / false; NULL per una lettera non censita.
                  --   Il censimento, arco per arco, e' nell'intestazione del changeSet
                  --   20261013-69 e nel COMMENT.
                  WITH a AS (
                      SELECT DISTINCT x.arco, x.ft, x.fu, x.tt, x.tu
                        FROM unnest(p_archi, p_from_tipo_ids, p_from_uids,
                                    p_to_tipo_ids, p_to_uids) AS x(arco, ft, fu, tt, tu)
                  )
                  SELECT a.arco, a.ft, a.fu, a.tt, a.tu,
                         CASE
                           -- Documento -> commessa: nessuna riga NON annullata di quel
                           -- documento nella commessa. Il documento si risolve dalla
                           -- chiave del nodo (testo) col ponte del BB che risolve, e le
                           -- righe si cercano con la regola d'incontro su id e uid.
                           -- ⭐ rev 2026-11-06 (20261106-44, giro 0.3): l'uid del documento
                           --   dal BB che risolve (ponte: la chiave del nodo e' testo), per
                           --   ogni tipo; niente piu' un ramo per tabella.
                           WHEN a.arco IN ('B', 'E', 'F', 'U') THEN NOT EXISTS (
                             SELECT 1
                               FROM vendite.commesse_attivita ca
                              WHERE ca.commessa_id      = script.fn_sorgente_chiave_id(a.tu)
                                AND ca.sorgente_tipo_id = a.ft
                                AND ca.stato_emissione <> 'ANNULLATA'
                                AND EXISTS (
                                      SELECT 1
                                        FROM script.fn_sorgente_documento_da_chiave(a.ft, a.fu) d
                                       WHERE ca.sorgente_id = d.documento_id
                                          OR ca.sorgente_uid = d.documento_uid))
                           -- Preventivo -> ordine: nessuna riga ATTIVA dell'ordine viene
                           -- da una riga del preventivo.
                           WHEN a.arco = 'A' THEN NOT EXISTS (
                             SELECT 1
                               FROM vendite.ordini_righe orr
                               JOIN vendite.preventivi_righe pr ON pr.id = orr.preventivo_riga_id
                               JOIN vendite.preventivi p        ON p.id  = pr.preventivo_id
                              WHERE orr.ordine_id = script.fn_sorgente_chiave_id(a.tu)
                                AND p.uid         = script.fn_sorgente_chiave_uuid(a.fu)
                                AND orr.attivo)
                           -- Ordine -> bolla: nessuna riga ATTIVA della bolla evade una
                           -- riga dell'ordine.
                           WHEN a.arco = 'H' THEN NOT EXISTS (
                             SELECT 1
                               FROM vendite.ordini_righe_fulfillment f
                               JOIN vendite.ordini_righe orr ON orr.id = f.ordine_riga_id
                               JOIN vendite.ddt_righe dr     ON dr.id  = f.ddt_riga_id
                              WHERE orr.ordine_id = script.fn_sorgente_chiave_id(a.fu)
                                AND dr.ddt_id     = script.fn_sorgente_chiave_id(a.tu)
                                AND dr.attivo)
                           -- Bolla -> reso: nessuna riga ATTIVA del reso viene da una riga
                           -- della bolla.
                           WHEN a.arco = 'R' THEN NOT EXISTS (
                             SELECT 1
                               FROM vendite.resi_righe rr
                               JOIN vendite.ddt_righe dr ON dr.id = rr.ddt_riga_id
                              WHERE rr.reso_id = script.fn_sorgente_chiave_id(a.tu)
                                AND dr.ddt_id  = script.fn_sorgente_chiave_id(a.fu)
                                AND rr.attivo)
                           -- Legame solo di testata (C, D; V, la revisione dell'offerta,
                           -- dal 2026-10-31), o arco che nasce dalle righe di legame e
                           -- sparisce con loro (G, N, S, T): nessun ritiro con i due nodi vivi.
                           WHEN a.arco IN ('C', 'D', 'G', 'N', 'S', 'T', 'V') THEN false
                         END
                    FROM a;
              $function$;
              
              COMMENT ON FUNCTION vendite.fn_documento_lineage_legami(text[], bigint[], text[], bigint[], text[]) IS
                'Decoratore SECURITY DEFINER degli ARCHI della lineage, gemello di vendite.fn_documento_lineage_nodi: i nodi danno lo stato, questo il LEGAME. Per ogni arco (array paralleli: lettera, tipo e chiave dei due estremi) dice se il legame e'' ritirato con i due nodi vivi: true / false; NULL per una lettera non censita («non so», non «vivo»). B, E, F, U (documento -> commessa): ritirato se nella commessa non resta nessuna riga di quel documento con stato_emissione <> ANNULLATA (una riga EMESSA e'' viva); il documento si risolve dalla chiave del nodo, che e'' testo, col ponte script.fn_sorgente_documento_da_chiave, e le righe di commessa si cercano con la regola d''incontro (sorgente_id = id del documento OR sorgente_uid = uid del documento): un tipo nuovo non va aggiunto a mano. Commessa annullata -> true insieme a to_is_abortito. A (preventivo -> ordine): ritirato se nessuna riga ATTIVA dell''ordine viene da una riga del preventivo. H (ordine -> bolla): se nessuna riga ATTIVA della bolla evade una riga dell''ordine (ordini_righe_fulfillment). R (bolla -> reso): se nessuna riga ATTIVA del reso viene da una riga della bolla. C, D, V (offerta -> contratto/ordine, revisione dell''offerta): false, il legame e'' solo di testata. G, N, S, T: false per costruzione, l''arco nasce dalle righe di legame e sparisce con loro. SECURITY DEFINER: righe di commessa, ordine, bolla e reso hanno la RLS, e righe vive fuori perimetro farebbero dire «ritirato» a torto; restituisce un booleano per un arco che chi legge ha gia''. Consumatore: vendite.fn_documento_lineage (colonna is_legame_ritirato).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only, come 20261107-70.
              SELECT 1;
