# DB-5 — CHE DATA PORTA QUESTO DOCUMENTO
#   vendite.fn_calcola_data_documento(registro, competenza, dichiarata)
#   Piano: brief-db-numerazione-data-documento-e-sequenza.md §4 DB-5
#
# ── LA REGOLA, IN TRE RIGHE ─────────────────────────────────────────
#   1. se qualcuno ha DICHIARATO una data sul lotto, vince quella;
#   2. altrimenti decide la politica del REGISTRO:
#        OGGI                 -> script.fn_data_operativa()
#        FINE_MESE_COMPETENZA -> ultimo giorno di competenza_mese
#   3. non esiste un terzo caso silenzioso.
#
# ── ⛔ LA COMPETENZA NON HA RIPIEGO ─────────────────────────────────
#   Con politica `FINE_MESE_COMPETENZA` e competenza assente si SOLLEVA, non si
#   ripiega su oggi. Un ripiego darebbe una data PLAUSIBILE E SBAGLIATA su un
#   documento fiscale — cioe' il difetto peggiore possibile qui: nessuno lo
#   nota, e quando lo si nota il numero e' gia' stato consumato.
#   ⚠️ Nei dati `fatturazione_lotti.competenza_mese` e' NOT NULL, quindi il ramo
#   si raggiunge solo da un chiamante che passa NULL a mano: e' un guasto di
#   programma, classe TECNICO.
#
# ── ⭐ E NON C'E' UN `ELSE` CHE INGOIA ──────────────────────────────
#   Una politica non riconosciuta solleva invece di comportarsi come `OGGI`.
#   Il CHECK di colonna rende il ramo irraggiungibile finche' regge — ma e'
#   esattamente il ragionamento gia' scritto in `fn_genera_scadenze_fattura`
#   sulla ripartizione: «un piano rate calcolato con una regola che non esiste
#   sarebbe peggio di un errore». Vale identico per una data.
#   ⚠️ Il giorno in cui il CHECK si allargasse (per dire, a `FINE_MESE_EMISSIONE`)
#   questa funzione si ferma e lo dice, invece di datare i documenti a oggi
#   fingendo di aver capito.
#
# ── ℹ️ IL REGISTRO SI LEGGE SEMPRE, ANCHE CON LA DATA DICHIARATA ────
#   Costa una lettura per chiave primaria su una tabella di sei righe, e in
#   cambio un registro inesistente non passa mai inosservato. La scorciatoia
#   («se c'e' la dichiarata, esci subito») avrebbe reso la funzione cieca
#   proprio nel caso in cui il chiamante ha sbagliato tutto.
#   ⚠️ `registri_fatturazione` NON ha RLS (verificato su pg_class.relrowsecurity):
#   qui «non trovato» significa davvero «non esiste», non «non lo vedi».
#
# ── ℹ️ DATE_TRUNC ANCHE SE LA COMPETENZA E' GIA' IL PRIMO DEL MESE ──
#   Misurato: 49 lotti, tutti con `competenza_mese` al primo del mese. Il
#   `date_trunc` non serve OGGI — serve perche' la funzione non deve dipendere
#   da un'abitudine che nessun vincolo impone.
#
# ── ℹ️ STABLE ──────────────────────────────────────────────────────
#   Legge e non scrive; `fn_data_operativa()` e' a sua volta STABLE.
#
# Dipendenze: 20260825-02 (script.fn_data_operativa),
#             20260825-03 (registri_fatturazione.politica_data_documento).
# Verifica: db/pgtap/vendite/test-registri-progressivi.sql (casi 6, 7, DB-13)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260825-06-create-fn-calcola-data-documento-mctit.yaml

  - changeSet:
      id: 20260825-06-create-fn-calcola-data-documento
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-5: la data che porta un documento. Data dichiarata sul lotto se c'e', altrimenti la
        politica del registro (OGGI -> fn_data_operativa, FINE_MESE_COMPETENZA -> ultimo giorno
        della competenza). ⛔ Nessun ripiego: competenza mancante con politica FINE_MESE
        solleva, e una politica non riconosciuta solleva invece di comportarsi come OGGI —
        una data plausibile e sbagliata su un documento fiscale e' peggio di un errore, ed e'
        lo stesso ragionamento gia' scritto in fn_genera_scadenze_fattura sulla ripartizione.
        Il registro si legge sempre, anche quando la data e' dichiarata: costa una lettura per
        PK su sei righe e in cambio un registro inesistente non passa inosservato.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: politica_data_documento
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_data_operativa';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_calcola_data_documento(
                  p_registro_id     vendite.registri_fatturazione.id%TYPE,
                  p_competenza_mese vendite.fatturazione_lotti.competenza_mese%TYPE,
                  p_data_dichiarata vendite.fatturazione_lotti.data_documento%TYPE DEFAULT NULL
              )
               RETURNS date
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_politica vendite.registri_fatturazione.politica_data_documento%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Che data porta un documento emesso su questo registro,
                  --   per questa competenza, con questa eventuale
                  --   dichiarazione dell'operatore.
                  --
                  -- Regole:
                  --   - la dichiarata vince su tutto;
                  --   - altrimenti decide la politica del registro;
                  --   - non esiste un terzo caso silenzioso: ogni ramo non
                  --     previsto solleva.
                  -- =========================================================

                  -- Guard di parametro: un id nullo o non positivo non esce da
                  -- nessuna interfaccia — lo produce solo un chiamante rotto,
                  -- ed e' per questo che il codice e' TECNICO.
                  IF p_registro_id IS NULL OR p_registro_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_calcola_data_documento',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object(
                              'detail', 'registro_id obbligatorio e maggiore di zero',
                              'p_registro_id', p_registro_id),
                          NULL::uuid,
                          'vendite.fn_calcola_data_documento',
                          'p_registro_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- Il registro si legge SEMPRE, anche quando la data e' gia'
                  -- dichiarata: e' l'unico punto in cui un registro inesistente
                  -- si fa notare. ⚠️ Questa tabella non ha RLS: «non trovato»
                  -- vuol dire davvero «non esiste».
                  SELECT r.politica_data_documento
                    INTO v_politica
                    FROM vendite.registri_fatturazione r
                   WHERE r.id = p_registro_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'vendite.fn_calcola_data_documento',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('registro_id', p_registro_id),
                          NULL::uuid,
                          concat('registro di fatturazione ', p_registro_id, ' inesistente'));
                  END IF;

                  -- 1) La dichiarazione vince. ⭐ Vale per TUTTI i documenti del
                  --    lotto, qualunque sia il loro registro: e' il senso di
                  --    «una data sola per l'intero atto» (decisione 5).
                  IF p_data_dichiarata IS NOT NULL THEN
                      RETURN p_data_dichiarata;
                  END IF;

                  -- 2) Altrimenti decide il sezionale.
                  IF v_politica = 'FINE_MESE_COMPETENZA' THEN
                      -- ⛔ Niente ripiego su oggi: una data plausibile e
                      --    sbagliata su un documento fiscale non la nota
                      --    nessuno, e quando la si nota il numero e' gia'
                      --    stato consumato.
                      IF p_competenza_mese IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'vendite.fn_calcola_data_documento',
                              'E_VENDITE_CHIAMATA_NON_VALIDA',
                              jsonb_build_object(
                                  'detail', 'competenza obbligatoria con politica FINE_MESE_COMPETENZA',
                                  'registro_id', p_registro_id,
                                  'politica', v_politica),
                              NULL::uuid,
                              'vendite.fn_calcola_data_documento',
                              'p_competenza_mese (obbligatorio con politica FINE_MESE_COMPETENZA)');
                      END IF;

                      -- ℹ️ date_trunc anche se la competenza e' gia' il primo
                      --    del mese in tutti i 49 lotti misurati: la funzione
                      --    non deve dipendere da un'abitudine che nessun
                      --    vincolo impone.
                      RETURN (date_trunc('month', p_competenza_mese)
                              + interval '1 month - 1 day')::date;

                  ELSIF v_politica = 'OGGI' THEN
                      RETURN script.fn_data_operativa();
                  END IF;

                  -- 3) ⭐ Nessun ELSE che ingoia. Il CHECK di colonna rende
                  --    questo ramo irraggiungibile finche' regge; se un giorno
                  --    si allargasse, la funzione si ferma e lo DICE invece di
                  --    datare i documenti a oggi fingendo di aver capito.
                  --    Stesso ragionamento gia' scritto in
                  --    fn_genera_scadenze_fattura sulla ripartizione.
                  PERFORM script.fn_log_and_raise_error(
                      'database', 'vendite.fn_calcola_data_documento',
                      'E_CONFIG_MANCANTE',
                      jsonb_build_object('registro_id', p_registro_id,
                                         'politica_data_documento', v_politica),
                      NULL::uuid,
                      concat('politica data documento non gestita: ',
                             quote_literal(v_politica),
                             ' sul registro ', p_registro_id));

                  -- Irraggiungibile: la riga sopra solleva sempre. Serve al
                  -- compilatore, che pretende un ritorno su ogni percorso.
                  RETURN NULL;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_calcola_data_documento(
                  vendite.registri_fatturazione.id%TYPE,
                  vendite.fatturazione_lotti.competenza_mese%TYPE,
                  vendite.fatturazione_lotti.data_documento%TYPE)
                IS 'Che data porta un documento emesso su questo registro. Ordine: (1) la data DICHIARATA sul lotto vince su tutto — vale per tutti i documenti dell''atto, qualunque sia il loro registro, ed e'' il senso della decisione «una data sola per l''intero atto»; (2) altrimenti decide la politica del sezionale — OGGI usa script.fn_data_operativa(), FINE_MESE_COMPETENZA l''ultimo giorno di competenza_mese. ⛔ NESSUN RIPIEGO, in due punti: competenza assente con politica FINE_MESE_COMPETENZA solleva (E_VENDITE_CHIAMATA_NON_VALIDA, TECNICO: competenza_mese e'' NOT NULL sul lotto, quindi un NULL qui e'' un guasto di programma), e una politica non riconosciuta solleva invece di comportarsi come OGGI. Una data PLAUSIBILE E SBAGLIATA su un documento fiscale non la nota nessuno, e quando la si nota il numero e'' gia'' stato consumato — e'' lo stesso ragionamento gia'' scritto in fn_genera_scadenze_fattura sulla ripartizione non gestita. ⚠️ Il registro si legge SEMPRE, anche con la data dichiarata: costa una lettura per PK su sei righe ed e'' l''unico punto in cui un registro inesistente si fa notare; la tabella non ha RLS, quindi «non trovato» vuol dire davvero «non esiste». ℹ️ date_trunc sulla competenza anche se nei 49 lotti misurati e'' sempre il primo del mese: nessun vincolo lo impone. Brief: docs/it/dev/work-in-progress/brief-db-numerazione-data-documento-e-sequenza.md §4 DB-5.';

              GRANT EXECUTE ON FUNCTION vendite.fn_calcola_data_documento(
                  vendite.registri_fatturazione.id%TYPE,
                  vendite.fatturazione_lotti.competenza_mese%TYPE,
                  vendite.fatturazione_lotti.data_documento%TYPE) TO zeroerp_app;
              -- ⛔ 2026-09-02 — NIENTE GRANT AL RUOLO BATCH IN UN changeSet.
              --    In CI il ruolo `zeroerp_batch_fatturazione` non esiste ancora: il workflow
              --    lo provisiona DOPO le migrazioni standard (BYPASSRLS vuole superuser,
              --    quindi lo crea `postgres` e non Liquibase), e il migrate moriva con
              --    «role "zeroerp_batch_fatturazione" does not exist».
              --    ⭐ Ed era anche INUTILE: provision_db_role_batch_fatturazione.sql fa
              --    GRANT SELECT/EXECUTE ON ALL ... IN SCHEMA sui 14 schemi applicativi piu'
              --    ALTER DEFAULT PRIVILEGES, quindi l'oggetto e' coperto su ogni ambiente —
              --    anche se nasce dopo. Verificato: una funzione del 2026-08-31 senza nessun
              --    GRANT esplicito risponde gia' EXECUTE = true per quel ruolo.
              --    ⚠️ La regola era gia' scritta il 2026-07-27 in 20260727-21, dopo lo stesso
              --    guasto: «i privilegi dei ruoli batch stanno nel provisioning, mai in un
              --    changeSet». linee-guida-sql.md §11.6
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_calcola_data_documento(bigint, date, date);
