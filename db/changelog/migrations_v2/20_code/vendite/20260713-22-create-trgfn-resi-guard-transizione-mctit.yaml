# Slice RESI vendita — trgfn_resi_guard_transizione (brief §2.1).
#
# Enforcement DB-first del grafo transizioni stato reso: la transizione
# (OLD.stato -> NEW.stato) e' ammessa solo se presente e attiva in
# config.transizioni_stati_reso (nessun grafo hardcodato). Mirror di
# vendite.trgfn_ddt_guard_transizione. Errore E_STATO_RESO_TRANSIZIONE_NON_VALIDA.
#
# Firing a10 su UPDATE OF stato_doc_reso_id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-22-create-trgfn-resi-guard-transizione-mctit.yaml

  - changeSet:
      id: 20260713-22-create-trgfn-resi-guard-transizione
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_guard_transizione()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: enforcement DB-first del grafo transizioni stato reso.
              --   La transizione (OLD.stato -> NEW.stato) e' ammessa solo se
              --   presente e attiva in config.transizioni_stati_reso (no grafo
              --   hardcodato). Mirror di trgfn_ddt_guard_transizione.
              DECLARE
                  v_codice_da config.stati_doc_reso.codice_interno%TYPE;
                  v_codice_a  config.stati_doc_reso.codice_interno%TYPE;
                  v_ammessa   boolean := false;
              BEGIN
                  -- No-op se lo stato non cambia davvero (UPDATE su altre colonne).
                  IF NEW.stato_doc_reso_id IS NOT DISTINCT FROM OLD.stato_doc_reso_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT
                      max(CASE WHEN id = OLD.stato_doc_reso_id THEN codice_interno END),
                      max(CASE WHEN id = NEW.stato_doc_reso_id THEN codice_interno END)
                    INTO v_codice_da, v_codice_a
                    FROM config.stati_doc_reso
                   WHERE id IN (OLD.stato_doc_reso_id, NEW.stato_doc_reso_id);

                  -- La transizione deve esistere ed essere attiva in matrice.
                  SELECT EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_reso t
                       WHERE t.stato_da_id = OLD.stato_doc_reso_id
                         AND t.stato_a_id  = NEW.stato_doc_reso_id
                         AND t.attivo IS TRUE
                  ) INTO v_ammessa;

                  IF NOT v_ammessa THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          TG_NAME::text,
                          'E_STATO_RESO_TRANSIZIONE_NON_VALIDA',
                          jsonb_build_object(
                              'reso_id',  NEW.id,
                              'numero',   NEW.numero,
                              'stato_da', v_codice_da,
                              'stato_a',  v_codice_a
                          ),
                          NEW.tx_id,
                          NEW.id::text,
                          coalesce(v_codice_da, 'NULL'),
                          coalesce(v_codice_a,  'NULL')
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_guard_transizione()
              IS 'Trigger function: enforcement grafo transizioni stato reso letto da config.transizioni_stati_reso (E_STATO_RESO_TRANSIZIONE_NON_VALIDA). Mirror di trgfn_ddt_guard_transizione. rev 2026-07-13.';

              DROP TRIGGER IF EXISTS trg_resi_a10_guard_transizione_upd ON vendite.resi;
              CREATE TRIGGER trg_resi_a10_guard_transizione_upd
                BEFORE UPDATE OF stato_doc_reso_id ON vendite.resi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_resi_guard_transizione();
