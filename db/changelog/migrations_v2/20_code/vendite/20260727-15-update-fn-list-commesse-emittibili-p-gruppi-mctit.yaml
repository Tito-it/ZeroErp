# fn_list_commesse_emittibili + p_gruppi: il pull visita solo le commesse che
#   contengono lavoro richiesto
#   (brief-db-emissione-fattura-per-documento-sorgente PARTE A, step A6)
#
# DOVE SI INSERISCE: e' la discovery dello step di PULL. Il task
#   pull_attivita_da_commessa la chiama coi campi del lotto per sapere quali
#   commesse passare a fn_emit_attivita_fatturabili_da_commessa, e poi cicla
#   commessa per commessa con un savepoint ciascuna.
#
# PERCHE' IL FILTRO. Senza, un'emissione mirata su un preventivo farebbe
#   comunque il giro di TUTTE le commesse emittibili del perimetro: ognuna
#   aprirebbe un savepoint, chiamerebbe l'emit (ora filtrato) e tornerebbe con
#   zero righe. Nessun danno ai dati, ma lavoro e log inutili proporzionali al
#   numero di commesse del cliente — e un log che dice "ho lavorato 40
#   commesse" per un'operazione che ne riguardava una sola e' fuorviante
#   quando poi si va a leggere cosa e' successo.
#   Filtrando qui, il pull visita solo le commesse effettivamente coinvolte.
#
# ⚠️ NON SOSTITUISCE IL FILTRO DENTRO L'EMIT (20260727-12). Questa funzione
#   restringe QUALI COMMESSE, non QUALI RIGHE. Una commessa multi-sorgente che
#   contiene sia il preventivo richiesto sia il contratto non richiesto passa
#   comunque il filtro — e' l'emit che, dentro, prende solo le righe del
#   preventivo. I due filtri lavorano su assi diversi e servono entrambi.
#
# DIFFERENZA DI COMPETENZA rispetto a fn_list_emittibili_lane (da conoscere,
#   non introdotta qui): la lane usa competenza CUMULATIVA (<=), questa usa
#   uguaglianza (= v_competenza_mese). E' la semantica storica delle due
#   funzioni e NON viene toccata da questo changeSet.
#
# SEMANTICA DELL'ARGOMENTO: identica al resto della catena — NULL = nessuna
#   restrizione (G1), '{}' = zero commesse, chiave inesistente = zero commesse
#   senza errore (G6).
#
# ⚠️ DROP + CREATE: RETURNS TABLE + parametro con DEFAULT = overload ambiguo
#   (fatto F13). Chiamante Python: CommesseRepository.list_commesse_emittibili,
#   parametri nominati. ⚠️ Esiste un pgTAP dedicato che chiama questa funzione
#   con p_fatturazione_immediata per nome
#   (test-fn-list-commesse-emittibili-fatturazione-immediata-v1.sql): la
#   chiamata resta valida, ma va rifatto girare (step A11).
#
# Base: corpo da doc auto-gen fn_list_commesse_emittibili.md, firma da 20260615-11.
# Dipendenze: 20260727-10 (fn_build_gruppo_fatturabile_key).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260727-15-update-fn-list-commesse-emittibili-p-gruppi-mctit.yaml

  - changeSet:
      id: 20260727-15-update-fn-list-commesse-emittibili-p-gruppi
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_list_commesse_emittibili + p_gruppi text[]: il pull visita solo le
        commesse che contengono almeno un gruppo richiesto. Non sostituisce il
        filtro per riga dentro fn_emit_attivita_fatturabili_da_commessa.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite'
                 AND p.proname = 'fn_build_gruppo_fatturabile_key'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_list_commesse_emittibili(
                  date, bigint, integer, bigint, boolean, integer);

              CREATE OR REPLACE FUNCTION vendite.fn_list_commesse_emittibili(
                p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL::date,
                p_billing_account_id vendite.commesse.billing_account_id%TYPE DEFAULT NULL::bigint,
                p_utility_id vendite.commesse.utility_id%TYPE DEFAULT NULL::integer,
                p_emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL::bigint,
                p_fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE DEFAULT NULL::boolean,
                p_limit integer DEFAULT 1000,
                p_gruppi text[] DEFAULT NULL
              )
              RETURNS TABLE(
                commessa_id vendite.commesse.id%TYPE,
                codice vendite.commesse.codice%TYPE,
                stato_commessa_id vendite.commesse.stato_commessa_id%TYPE,
                stato_commessa vendite.stati_commessa.codice%TYPE,
                billing_account_id vendite.commesse.billing_account_id%TYPE,
                utility_id vendite.commesse.utility_id%TYPE,
                emittente_soggetto_ruolo_id vendite.commesse.emittente_soggetto_ruolo_id%TYPE,
                fatturazione_immediata vendite.commesse.fatturazione_immediata%TYPE,
                competenza_dal vendite.commesse.competenza_dal%TYPE,
                competenza_al vendite.commesse.competenza_al%TYPE,
                total_non_emesse bigint
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                v_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Elencare le commesse pronte per l'emissione verso AF.
                --   Usata dal backend come discovery per il batch di
                --   emissione (fn_emit_attivita_fatturabili_da_commessa).
                --
                -- Criteri:
                --   1. Stato emittibile (stati_commessa.emittibile = true)
                --   2. Esistono righe commesse_attivita NON_EMESSA
                --   3. Competenza: se p_competenza_mese fornito, filtra righe
                --      commesse_attivita il cui competenza_mese coincide
                --      (coerente con pipeline AF che opera per mese)
                --   4. Filtri opzionali per perimetro billing/utility/emittente
                --   5. Filtro opzionale corsia: p_fatturazione_immediata
                --      (true=solo immediate / false=solo differite /
                --       NULL=indifferente, comportamento storico)
                --   6. rev 2026-07-27: p_gruppi restringe alle commesse che
                --      contengono almeno una riga di un gruppo richiesto.
                --      NON sostituisce il filtro per RIGA dentro l'emit: qui si
                --      sceglie QUALI COMMESSE visitare, li' QUALI RIGHE emettere.
                --      NULL = nessuna restrizione (comportamento storico).
                --
                -- Regole:
                --   - p_limit max 10000, default 1000
                --   - p_competenza_mese normalizzato al primo del mese
                --   - funzione STABLE (read-only)
                -- =========================================================
                IF p_limit IS NULL OR p_limit <= 0 THEN
                  p_limit := 1000;
                END IF;
                IF p_limit > 10000 THEN
                  p_limit := 10000;
                END IF;

                -- Normalizza al primo del mese
                v_competenza_mese := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                RETURN QUERY
                SELECT
                  c.id AS commessa_id,
                  c.codice,
                  c.stato_commessa_id,
                  sc.codice AS stato_commessa,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.fatturazione_immediata,
                  c.competenza_dal,
                  c.competenza_al,
                  count(ca.id)::bigint AS total_non_emesse
                FROM vendite.commesse c
                JOIN vendite.stati_commessa sc
                  ON sc.id = c.stato_commessa_id
                 AND sc.emittibile = true
                INNER JOIN vendite.commesse_attivita ca
                  ON ca.commessa_id = c.id
                 AND ca.stato_emissione = 'NON_EMESSA'
                 AND (v_competenza_mese IS NULL OR ca.competenza_mese = v_competenza_mese)
                WHERE true
                  -- Filtro perimetro billing/utility/emittente
                  AND (p_billing_account_id IS NULL OR c.billing_account_id = p_billing_account_id)
                  AND (p_utility_id IS NULL OR c.utility_id = p_utility_id)
                  AND (p_emittente_soggetto_ruolo_id IS NULL OR c.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id)
                  -- Filtro corsia immediata/differita (NULL = indifferente)
                  AND (p_fatturazione_immediata IS NULL OR c.fatturazione_immediata = p_fatturazione_immediata)
                  -- EMISSIONE MIRATA (rev 2026-07-27): il conteggio
                  -- total_non_emesse segue il filtro, cioe' riporta le righe
                  -- dei soli gruppi richiesti. E' voluto: e' il numero che
                  -- l'emit lavorera' davvero su quella commessa.
                  AND (
                       p_gruppi IS NULL
                       OR vendite.fn_build_gruppo_fatturabile_key(
                              ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id
                          ) = ANY (p_gruppi)
                      )
                GROUP BY
                  c.id,
                  c.codice,
                  c.stato_commessa_id,
                  sc.codice,
                  c.billing_account_id,
                  c.utility_id,
                  c.emittente_soggetto_ruolo_id,
                  c.fatturazione_immediata,
                  c.competenza_dal,
                  c.competenza_al
                ORDER BY c.id
                LIMIT p_limit;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_list_commesse_emittibili(date, bigint, integer, bigint, boolean, integer, text[])
              IS 'Read-only: elenca commesse in stato emittibile con attivita` NON_EMESSA. Filtro competenza_mese su commesse_attivita (coerente con pipeline AF). Filtri opzionali per billing_account_id, utility_id, emittente_soggetto_ruolo_id e fatturazione_immediata (corsia immediata/differita, NULL=indifferente). Espone fatturazione_immediata in output. Usata dal backend per il batch di emissione. rev 2026-07-27 (brief emissione mirata A6): p_gruppi text[] restringe alle commesse che contengono almeno una riga di un gruppo richiesto — NULL = nessuna restrizione (G1). ⚠️ NON sostituisce il filtro per RIGA dentro fn_emit_attivita_fatturabili_da_commessa: qui si sceglie QUALI COMMESSE visitare, li'' QUALI RIGHE emettere; una commessa multi-sorgente passa comunque il filtro e sara'' l''emit a prendere solo le righe richieste. Con p_gruppi valorizzato anche total_non_emesse segue il filtro: e'' il numero di righe che l''emit lavorera'' davvero.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: rimuove la firma a 7 argomenti. Ripristino della
              -- versione a 6 argomenti: ri-applicare 20260615-11.
              DROP FUNCTION IF EXISTS vendite.fn_list_commesse_emittibili(
                  date, bigint, integer, bigint, boolean, integer, text[]);
