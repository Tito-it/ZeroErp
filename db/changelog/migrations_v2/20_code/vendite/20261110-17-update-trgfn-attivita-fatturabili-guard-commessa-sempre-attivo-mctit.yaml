# ------------------------------------------------------------
# IL GUARD DELLA COMMESSA DELL'ATTIVITA' FATTURABILE CONTROLLA SEMPRE
#   vendite.trgfn_attivita_fatturabili_guard_commessa
#   Brief: brief-db-sorgente-documento-e-riga §7.3 «Il giro finale bis», G-1 (Tid, 2026-11-08).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   Il guard lavorava solo con il parametro attivita_fatturabili_require_commessa
#   acceso: il parametro serviva all'attivita' senza commessa, che il modello non
#   ammette piu' (commessa_id e commessa_attivita_id NOT NULL). Spento, toglieva in
#   silenzio il controllo d'appartenenza. Il parametro si ritira (80_data/20261110-18);
#   qui il guard smette di leggerlo e controlla sempre.
#   I rami «coppia obbligatoria» e «commessa obbligatoria» ripetevano il NOT NULL delle
#   due colonne: un BEFORE ROW vede la riga prima del vincolo, quindi scattavano, ma
#   dicevano la stessa regola con un codice diverso (E_PARAMETRO_INVALIDO). Ora, con una
#   delle due colonne NULL, il guard lascia la parola al vincolo (23502, che nomina la
#   colonna) e controlla solo cio' che il vincolo non sa dire: che la riga di commessa
#   esista e appartenga alla commessa dichiarata (E_COMMESSA_ATTIVITA_NON_COERENTE).
#   Il bypass di manutenzione (GUC zeroerp.maintenance_allow_attivita_bypass, solo
#   superuser) resta com'era.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Corpo e COMMENT. Il trigger non si rimonta. Corpo di partenza: il vivo (dbdev,
#   2026-11-08). Rollback: il corpo e il COMMENT di prima (il parametro torna col
#   rollback del 20261110-18). pgTAP: vendite/test-attivita-guardrail-commessa-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261110-17-update-trgfn-attivita-fatturabili-guard-commessa-sempre-attivo-mctit.yaml

  - changeSet:
      id: 20261110-17-update-trgfn-attivita-fatturabili-guard-commessa-sempre-attivo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_attivita_fatturabili_guard_commessa controlla sempre (senza il parametro
        attivita_fatturabili_require_commessa) e solo la coerenza commessa / riga di commessa: i NULL
        li rifiuta il NOT NULL. brief-db-sorgente-documento-e-riga §7.3, G-1.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_attivita_fatturabili_guard_commessa';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_bypass_setting text;
                  v_bypass_enabled boolean := false;
                  v_is_superuser boolean := false;
                  v_commessa_from_attivita vendite.commesse_attivita.commessa_id%TYPE;
              BEGIN
                  -- Bypass di manutenzione: solo superuser, con la GUC accesa.
                  BEGIN
                      SELECT usesuper INTO v_is_superuser FROM pg_user WHERE usename = current_user;
                  EXCEPTION WHEN OTHERS THEN v_is_superuser := false;
                  END;

                  IF v_is_superuser THEN
                      BEGIN
                          v_bypass_setting := current_setting('zeroerp.maintenance_allow_attivita_bypass', true);
                          IF v_bypass_setting IS NOT NULL AND btrim(v_bypass_setting) <> '' THEN
                              v_bypass_enabled := v_bypass_setting::boolean;
                          END IF;
                      EXCEPTION WHEN OTHERS THEN v_bypass_enabled := false;
                      END;
                  END IF;

                  IF v_bypass_enabled THEN
                      RETURN NEW;
                  END IF;

                  -- Una delle due colonne vuota: la rifiuta il NOT NULL, che nomina la colonna.
                  IF NEW.commessa_id IS NULL OR NEW.commessa_attivita_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- La riga di commessa esiste?
                  SELECT ca.commessa_id INTO v_commessa_from_attivita
                    FROM vendite.commesse_attivita ca WHERE ca.id = NEW.commessa_attivita_id;

                  IF v_commessa_from_attivita IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_attivita_id', NEW.commessa_attivita_id), NULL::uuid,
                          concat('commessa_attivita_id ', NEW.commessa_attivita_id, ' non trovata'));
                  END IF;

                  -- E appartiene alla commessa dichiarata?
                  IF v_commessa_from_attivita <> NEW.commessa_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_id', NEW.commessa_id, 'commessa_attivita_id', NEW.commessa_attivita_id, 'commessa_attesa', v_commessa_from_attivita),
                          NULL::uuid, concat('attivita ', NEW.commessa_attivita_id, ' appartiene a commessa ', v_commessa_from_attivita, ' non a ', NEW.commessa_id));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa() IS
                'Guard BEFORE INSERT OR UPDATE OF commessa_id, commessa_attivita_id su vendite.attivita_fatturabili: la riga di commessa dell''attivita'' (commessa_attivita_id) esiste e appartiene alla commessa dichiarata (commessa_id); altrimenti E_COMMESSA_ATTIVITA_NON_COERENTE. Controlla sempre: non dipende da un parametro. Le due colonne vuote le rifiuta il loro NOT NULL, non il guard. Bypass di manutenzione solo per un superuser con la GUC zeroerp.maintenance_allow_attivita_bypass accesa.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_guard_enabled BOOLEAN := FALSE;
                  v_bypass_setting TEXT;
                  v_bypass_enabled BOOLEAN := FALSE;
                  v_is_superuser BOOLEAN := FALSE;
                  v_commessa_from_attivita vendite.commesse_attivita.commessa_id%TYPE;
              BEGIN
                  -- Config flag
                  BEGIN
                      SELECT COALESCE(NULLIF(btrim(p.default_value), ''), 'false')::BOOLEAN INTO v_guard_enabled
                        FROM config.parameters p WHERE p.code = 'attivita_fatturabili_require_commessa' LIMIT 1;
                  EXCEPTION WHEN OTHERS THEN v_guard_enabled := FALSE;
                  END;

                  -- Bypass solo superuser
                  BEGIN
                      SELECT usesuper INTO v_is_superuser FROM pg_user WHERE usename = current_user;
                  EXCEPTION WHEN OTHERS THEN v_is_superuser := FALSE;
                  END;

                  IF v_is_superuser THEN
                      BEGIN
                          v_bypass_setting := current_setting('zeroerp.maintenance_allow_attivita_bypass', TRUE);
                          IF v_bypass_setting IS NOT NULL AND btrim(v_bypass_setting) <> '' THEN v_bypass_enabled := v_bypass_setting::BOOLEAN; END IF;
                      EXCEPTION WHEN OTHERS THEN v_bypass_enabled := FALSE;
                      END;
                  END IF;

                  IF v_bypass_enabled OR NOT v_guard_enabled THEN RETURN NEW; END IF;

                  -- Guard: coppia obbligatoria
                  IF (NEW.commessa_id IS NULL AND NEW.commessa_attivita_id IS NOT NULL)
                     OR (NEW.commessa_id IS NOT NULL AND NEW.commessa_attivita_id IS NULL) THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('commessa_id', NEW.commessa_id, 'commessa_attivita_id', NEW.commessa_attivita_id),
                          NULL::uuid, 'commessa_id e commessa_attivita_id devono essere valorizzati a coppia');
                  END IF;

                  -- Guard: commessa obbligatoria
                  IF NEW.commessa_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('attivita_id', NEW.id), NULL::uuid, 'inserimento senza commessa non consentito');
                  END IF;

                  -- Guard: commessa_attivita_id deve esistere
                  SELECT ca.commessa_id INTO v_commessa_from_attivita
                    FROM vendite.commesse_attivita ca WHERE ca.id = NEW.commessa_attivita_id;

                  IF v_commessa_from_attivita IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_attivita_id', NEW.commessa_attivita_id), NULL::uuid, concat('commessa_attivita_id ', NEW.commessa_attivita_id, ' non trovata'));
                  END IF;

                  -- Guard: coerenza commessa_id ↔ commessa_attivita_id
                  IF v_commessa_from_attivita <> NEW.commessa_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_id', NEW.commessa_id, 'commessa_attivita_id', NEW.commessa_attivita_id, 'commessa_attesa', v_commessa_from_attivita),
                          NULL::uuid, concat('attivita ', NEW.commessa_attivita_id, ' appartiene a commessa ', v_commessa_from_attivita, ' non a ', NEW.commessa_id));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa() IS
                'Guard anti-bypass: commessa_id+commessa_attivita_id obbligatori e coerenti. Bypass GUC solo superuser.';
