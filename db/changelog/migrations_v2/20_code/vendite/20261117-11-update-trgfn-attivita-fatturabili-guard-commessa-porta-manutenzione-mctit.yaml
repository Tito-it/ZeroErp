# ------------------------------------------------------------
# vendite.trgfn_attivita_fatturabili_guard_commessa: la porta
#   zeroerp.maintenance_allow_attivita_bypass passa da
#   script.fn_porta_manutenzione_aperta (20261117-06).
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.5, §16.9)
#
# Che cosa cambia:
#   - chi apre: prima un superuser (current_user, letto da pg_user), ora la
#     sessione del migratore (session_user membro del proprietario di dbops, o
#     superuser). Il migratore e' gia' il proprietario delle tabelle: la porta
#     non gli da' niente che non abbia;
#   - «accesa» e' on, true o 1: prima il valore passava da ::boolean (anche
#     yes, t, y). Le forme in piu' non le usa nessuno (censimento §16.9);
#   - la porta si chiede solo quando il controllo rifiuterebbe, e lascia la
#     riga nel diario.
# Corpo vivo letto da pg_get_functiondef su dbdev il 2026-11-18. Attributi vivi:
#   INVOKER, VOLATILE, nessun SET, owner zeroerp_owner.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261117-11-update-trgfn-attivita-fatturabili-guard-commessa-porta-manutenzione-mctit.yaml

  - changeSet:
      id: 20261117-11-update-trgfn-attivita-fatturabili-guard-commessa-porta-manutenzione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_attivita_fatturabili_guard_commessa: la porta di manutenzione passa da
        script.fn_porta_manutenzione_aperta, solo dove il guard rifiuterebbe. Brief:
        brief-db-seed-primo-impianto-non-si-riscrive.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('vendite.trgfn_attivita_fatturabili_guard_commessa()')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('script.fn_porta_manutenzione_aperta(text,regclass,text,text)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_commessa_from_attivita vendite.commesse_attivita.commessa_id%TYPE;
              BEGIN
                  -- Una delle due colonne vuota: la rifiuta il NOT NULL, che nomina la colonna.
                  IF NEW.commessa_id IS NULL OR NEW.commessa_attivita_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- La riga di commessa esiste?
                  SELECT ca.commessa_id INTO v_commessa_from_attivita
                    FROM vendite.commesse_attivita ca WHERE ca.id = NEW.commessa_attivita_id;

                  IF v_commessa_from_attivita IS NULL
                     OR v_commessa_from_attivita <> NEW.commessa_id THEN
                      -- La porta di manutenzione: si chiede solo qui, dove il guard
                      -- rifiuterebbe. Aperta solo per la sessione del migratore, con
                      -- la riga nel diario.
                      IF script.fn_porta_manutenzione_aperta(
                             'zeroerp.maintenance_allow_attivita_bypass', TG_RELID, TG_OP,
                             to_jsonb(NEW) ->> 'id') THEN
                          RETURN NEW;
                      END IF;
                  END IF;

                  IF v_commessa_from_attivita IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_attivita_id', NEW.commessa_attivita_id), NULL::uuid,
                          concat('commessa_attivita_id ', NEW.commessa_attivita_id, ' non trovata'));
                  END IF;

                  -- E appartiene alla commessa dichiarata?
                  IF v_commessa_from_attivita <> NEW.commessa_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_id', NEW.commessa_id, 'commessa_attivita_id', NEW.commessa_attivita_id, 'commessa_attesa', v_commessa_from_attivita),
                          NULL::uuid, concat('attivita ', NEW.commessa_attivita_id, ' appartiene a commessa ', v_commessa_from_attivita, ' non a ', NEW.commessa_id));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa() IS
                  'Guard BEFORE INSERT OR UPDATE OF commessa_id, commessa_attivita_id su vendite.attivita_fatturabili: la riga di commessa dell''attivita'' (commessa_attivita_id) esiste e appartiene alla commessa dichiarata (commessa_id); altrimenti E_COMMESSA_ATTIVITA_NON_COERENTE. Controlla sempre: non dipende da un parametro. Le due colonne vuote le rifiuta il loro NOT NULL, non il guard. Porta di manutenzione zeroerp.maintenance_allow_attivita_bypass: apre solo per la sessione del migratore (script.fn_porta_manutenzione_aperta), solo dove il guard rifiuterebbe, e lascia la riga in dbops.porte_manutenzione_passaggi.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_bypass_setting text;
                  v_bypass_enabled boolean := false;
                  v_is_superuser boolean := false;
                  v_commessa_from_attivita vendite.commesse_attivita.commessa_id%TYPE;
              BEGIN
                  -- Bypass di manutenzione: solo superuser, con la GUC accesa.
                  BEGIN
                      SELECT usesuper INTO v_is_superuser FROM pg_user WHERE usename = current_user;
                  EXCEPTION WHEN OTHERS THEN v_is_superuser := false;
                  END;

                  IF v_is_superuser THEN
                      BEGIN
                          v_bypass_setting := current_setting('zeroerp.maintenance_allow_attivita_bypass', true);
                          IF v_bypass_setting IS NOT NULL AND btrim(v_bypass_setting) <> '' THEN
                              v_bypass_enabled := v_bypass_setting::boolean;
                          END IF;
                      EXCEPTION WHEN OTHERS THEN v_bypass_enabled := false;
                      END;
                  END IF;

                  IF v_bypass_enabled THEN
                      RETURN NEW;
                  END IF;

                  -- Una delle due colonne vuota: la rifiuta il NOT NULL, che nomina la colonna.
                  IF NEW.commessa_id IS NULL OR NEW.commessa_attivita_id IS NULL THEN
                      RETURN NEW;
                  END IF;

                  -- La riga di commessa esiste?
                  SELECT ca.commessa_id INTO v_commessa_from_attivita
                    FROM vendite.commesse_attivita ca WHERE ca.id = NEW.commessa_attivita_id;

                  IF v_commessa_from_attivita IS NULL THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_attivita_id', NEW.commessa_attivita_id), NULL::uuid,
                          concat('commessa_attivita_id ', NEW.commessa_attivita_id, ' non trovata'));
                  END IF;

                  -- E appartiene alla commessa dichiarata?
                  IF v_commessa_from_attivita <> NEW.commessa_id THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'trgfn_attivita_fatturabili_guard_commessa', 'E_COMMESSA_ATTIVITA_NON_COERENTE',
                          jsonb_build_object('commessa_id', NEW.commessa_id, 'commessa_attivita_id', NEW.commessa_attivita_id, 'commessa_attesa', v_commessa_from_attivita),
                          NULL::uuid, concat('attivita ', NEW.commessa_attivita_id, ' appartiene a commessa ', v_commessa_from_attivita, ' non a ', NEW.commessa_id));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_commessa() IS
                  'Guard BEFORE INSERT OR UPDATE OF commessa_id, commessa_attivita_id su vendite.attivita_fatturabili: la riga di commessa dell''attivita'' (commessa_attivita_id) esiste e appartiene alla commessa dichiarata (commessa_id); altrimenti E_COMMESSA_ATTIVITA_NON_COERENTE. Controlla sempre: non dipende da un parametro. Le due colonne vuote le rifiuta il loro NOT NULL, non il guard. Bypass di manutenzione solo per un superuser con la GUC zeroerp.maintenance_allow_attivita_bypass accesa.';
