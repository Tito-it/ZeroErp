# IL GUARD DELLA FATTURA GIUDICA applica_fattura SULLA DESTINAZIONE
#   Brief: brief-db-stati-documento-dal-vocabolario §4.5, difetto ⑥, S-7
#   (Tid, 2026-11-08). Giro 1: il vocabolario fiscale.
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   applica_fattura si guardava solo nel ramo «prima assegnazione» (stato
#   precedente NULL), irraggiungibile per contratto: la colonna e' NOT NULL e
#   la mette il trigger della nascita. Il passaggio normale non guardava
#   applica_fattura della destinazione: lo diceva solo la matrice
#   (solo_lotto), che non lega la riga alle colonne del vocabolario.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · a ogni cambio di stato: la destinazione deve avere applica_fattura,
#     stesso codice e stessi parametri del ramo ritirato;
#   · il ramo «prima assegnazione» si ritira; la nascita la copre il CHECK
#     chk_stati_doc_fiscale_iniziale_applica (-44);
#   · la matrice e il cancello IVA all'emissione: invariati. Il cancello resta
#     sul codice EMESSA: la colonna di emissione del vocabolario fiscale e'
#     una decisione aperta (S-3 del brief), fuori da questo giro.
#   Fatto datato, 2026-11-12: ogni stato fiscale ha applica_fattura true, quindi
#   nessun passaggio della matrice cambia esito.
#
# ── DA DOVE ─────────────────────────────────────────────────────────
#   Corpo da pg_get_functiondef su dbdev (2026-11-12). Il trigger non cambia.
#   COMMENT riscritto al presente. Rollback: il corpo e il COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261112-48-update-trgfn-fatture-guard-stato-applica-sulla-destinazione-mctit.yaml

  - changeSet:
      id: 20261112-48-update-trgfn-fatture-guard-stato-applica-sulla-destinazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Guard dello stato della fattura: applica_fattura sulla destinazione di ogni cambio, via il ramo «prima assegnazione». Brief: brief-db-stati-documento-dal-vocabolario §4.5, S-7.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('vendite.trgfn_fatture_guard_stato()')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatture_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- =========================================================
              -- Scopo: il cambio di stato della fattura (BEFORE UPDATE OF
              --   stato_doc_fiscale_id).
              --   1. Lo stato d'arrivo si applica alla fattura
              --      (config.stati_doc_fiscale.applica_fattura). Sulla
              --      DESTINAZIONE, non sulla coppia: copre ogni strada, anche
              --      una futura. La nascita non e' un cambio: la copre il CHECK
              --      chk_stati_doc_fiscale_iniziale_applica.
              --   2. Il passaggio e' una riga ammessa della matrice
              --      config.stati_doc_fiscale_transizioni con solo_lotto =
              --      false: nessuna riga della fattura torna indietro.
              --   3. Entrando in EMESSA, i motivi di
              --      script.fn_check_fattura_emettibile.
              -- =========================================================
              DECLARE
                  v_ok         boolean;  -- esito di EXISTS sulla matrice
                  v_applica    config.stati_doc_fiscale.applica_fattura%TYPE;
                  v_codice_a   config.stati_doc_fiscale.codice_interno%TYPE;
              BEGIN
                  -- UPDATE OF scatta anche a valore uguale: senza cambio, niente.
                  IF NEW.stato_doc_fiscale_id IS NOT DISTINCT FROM OLD.stato_doc_fiscale_id THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.applica_fattura, s.codice_interno
                    INTO v_applica, v_codice_a
                    FROM config.stati_doc_fiscale s
                   WHERE s.id = NEW.stato_doc_fiscale_id;

                  -- 1. La destinazione si applica alla fattura.
                  IF v_applica IS NOT TRUE THEN
                      PERFORM script.fn_log_and_raise_error(TG_TABLE_SCHEMA, TG_NAME, 'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'stato_doc_fiscale_id', 'atteso', 'applica_fattura=true', 'ricevuto', NEW.stato_doc_fiscale_id),
                          NULL::uuid, 'stato non applicabile a fattura', NEW.stato_doc_fiscale_id::text);
                  END IF;

                  -- 2. Il passaggio e' ammesso dalla matrice.
                  SELECT EXISTS (
                      SELECT 1 FROM config.stati_doc_fiscale_transizioni t
                       WHERE t.ammesso AND t.stato_from_id = OLD.stato_doc_fiscale_id AND t.stato_to_id = NEW.stato_doc_fiscale_id AND t.solo_lotto = FALSE
                  ) INTO v_ok;
                  IF NOT v_ok THEN
                      PERFORM script.fn_log_and_raise_error(TG_TABLE_SCHEMA, TG_NAME, 'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'transizione_stato', 'atteso', concat(OLD.stato_doc_fiscale_id, '→ammessa'), 'ricevuto', NEW.stato_doc_fiscale_id),
                          NULL::uuid, concat('transizione ', OLD.stato_doc_fiscale_id, '→', NEW.stato_doc_fiscale_id), 'fattura');
                  END IF;

                  -- 3. IL CANCELLO ALL'EMISSIONE. Entrando in EMESSA, da
                  --   qualunque stato, la fattura non deve avere motivi: oggi una
                  --   riga senza aliquota IVA (E_FATTURA_RIGA_IVA_MANCANTE). Il
                  --   predicato sta nella check; l'helper solleva il codice del
                  --   primo motivo e tace su [].
                  -- ⚠️ Sulla DESTINAZIONE, non su una coppia DRAFT -> EMESSA.
                  -- ⛔ La bozza resta libera: il vincolo e' all'emissione, non al
                  --   salvataggio della riga.
                  -- ⚠️ EMESSA per codice: il vocabolario fiscale non dichiara
                  --   ancora quale stato e' l'emissione.
                  IF v_codice_a = 'EMESSA' THEN
                      PERFORM script.fn_raise_primo_motivo_se_presente(
                          'vendite', TG_NAME::text,
                          script.fn_check_fattura_emettibile(NEW.id),
                          NULL,
                          NEW.tx_id,
                          jsonb_build_object('fattura_id', NEW.id,
                                             'stato_a',    v_codice_a));
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatture_guard_stato() IS
                  'Guard (BEFORE UPDATE OF stato_doc_fiscale_id) del cambio di stato della fattura. Lo stato d''arrivo deve applicarsi alla fattura (config.stati_doc_fiscale.applica_fattura): la regola sta sulla destinazione e vale per ogni strada; la nascita la copre il CHECK chk_stati_doc_fiscale_iniziale_applica. Il passaggio deve essere una riga ammessa di config.stati_doc_fiscale_transizioni con solo_lotto = false: nessuna riga della fattura torna indietro. Errore dei due controlli: E_LOTTO_PARAMETRO_NON_COERENTE (parametro stato_doc_fiscale_id o transizione_stato). Entrando in EMESSA, da qualunque stato, solleva il primo motivo di script.fn_check_fattura_emettibile (una riga senza aliquota IVA) con script.fn_raise_primo_motivo_se_presente; la bozza resta libera. Lo stato lo scrivono i verbi (porta script.trgfn_doc_stato_solo_dal_verbo): vendite.fn_fattura_proietta_stato.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_fatture_guard_stato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le transizioni di stato della fattura (matrice
              --   config.stati_doc_fiscale_transizioni) e, entrando in EMESSA, i motivi
              --   di script.fn_check_fattura_emettibile.
              -- Rev 2026-10-22 (20261022-07, D-3 di Tid; §9.9 di
              --   brief-be-utenti-di-sviluppo): il cancello IVA all'emissione.
              -- Rev 2026-10-27 (20261027-16, brief-modello-documento-vendita §15): via il
              --   «blocco retrocessione GIORNALIERO», che decideva «indietro» confrontando
              --   la colonna ordine (R-1 vuole avanti/indietro dal vocabolario, non da un
              --   ordine) ed era gia' coperto dalla matrice: nessuna riga della fattura
              --   (solo_lotto = false) torna indietro, per nessun tipo di lotto. Un
              --   passaggio all'indietro lo rifiuta la matrice, qui sotto, con lo stesso
              --   codice (parametro transizione_stato).
              DECLARE
                  v_ok BOOLEAN;
                  v_codice_a   config.stati_doc_fiscale.codice_interno%TYPE;
              BEGIN
                  IF TG_OP = 'UPDATE'
                     AND NEW.stato_doc_fiscale_id IS NOT NULL
                     AND NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id
                  THEN
                      IF OLD.stato_doc_fiscale_id IS NULL THEN
                          -- Prima assegnazione
                          SELECT s.applica_fattura INTO v_ok FROM config.stati_doc_fiscale s WHERE s.id = NEW.stato_doc_fiscale_id AND s.attivo;
                          IF COALESCE(v_ok, FALSE) = FALSE THEN
                              PERFORM script.fn_log_and_raise_error(TG_TABLE_SCHEMA, TG_NAME, 'E_LOTTO_PARAMETRO_NON_COERENTE',
                                  jsonb_build_object('parametro', 'stato_doc_fiscale_id', 'atteso', 'applica_fattura=true', 'ricevuto', NEW.stato_doc_fiscale_id),
                                  NULL::uuid, 'stato non applicabile a fattura', NEW.stato_doc_fiscale_id::text);
                          END IF;
                      ELSE
                          -- Transizione ammessa
                          SELECT EXISTS (
                              SELECT 1 FROM config.stati_doc_fiscale_transizioni t
                               WHERE t.ammesso AND t.stato_from_id = OLD.stato_doc_fiscale_id AND t.stato_to_id = NEW.stato_doc_fiscale_id AND t.solo_lotto = FALSE
                          ) INTO v_ok;
                          IF NOT v_ok THEN
                              PERFORM script.fn_log_and_raise_error(TG_TABLE_SCHEMA, TG_NAME, 'E_LOTTO_PARAMETRO_NON_COERENTE',
                                  jsonb_build_object('parametro', 'transizione_stato', 'atteso', concat(OLD.stato_doc_fiscale_id, '→ammessa'), 'ricevuto', NEW.stato_doc_fiscale_id),
                                  NULL::uuid, concat('transizione ', OLD.stato_doc_fiscale_id, '→', NEW.stato_doc_fiscale_id), 'fattura');
                          END IF;
                      END IF;
                  END IF;

                  -- ⭐ IL CANCELLO ALL'EMISSIONE (rev 2026-10-22, 20261022-07).
                  --   Entrando in EMESSA, da qualunque stato (anche da uno stato vuoto:
                  --   vendite.fn_numera_fattura_opz_emessa lo scrive cosi'), la fattura
                  --   non deve avere motivi: oggi una riga senza aliquota IVA
                  --   (E_FATTURA_RIGA_IVA_MANCANTE). Il predicato sta nella check;
                  --   l'helper solleva il codice del primo motivo e tace su [].
                  -- ⚠️ Sulla DESTINAZIONE, non su una coppia DRAFT -> EMESSA: una strada
                  --   nuova verso EMESSA nasce gia' coperta (stessa forma del preventivo).
                  -- ⛔ La bozza resta libera: il vincolo e' all'emissione, non al
                  --   salvataggio della riga (decisione di Tid del 2026-08-29).
                  IF TG_OP = 'UPDATE'
                     AND NEW.stato_doc_fiscale_id IS DISTINCT FROM OLD.stato_doc_fiscale_id THEN
                      SELECT s.codice_interno INTO v_codice_a
                        FROM config.stati_doc_fiscale s
                       WHERE s.id = NEW.stato_doc_fiscale_id;

                      IF v_codice_a = 'EMESSA' THEN
                          PERFORM script.fn_raise_primo_motivo_se_presente(
                              'vendite', TG_NAME::text,
                              script.fn_check_fattura_emettibile(NEW.id),
                              NULL,
                              NEW.tx_id,
                              jsonb_build_object('fattura_id', NEW.id,
                                                 'stato_a',    v_codice_a));
                      END IF;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatture_guard_stato() IS
                  'Guard transizioni stato fatture via config.stati_doc_fiscale_transizioni (righe solo_lotto = false). Rev 2026-10-22 (20261022-07, D-3 di Tid; §9.9 di brief-be-utenti-di-sviluppo): entrando in EMESSA, da qualunque stato, solleva il primo motivo di script.fn_check_fattura_emettibile (E_FATTURA_RIGA_IVA_MANCANTE: una riga senza aliquota IVA) con script.fn_raise_primo_motivo_se_presente. La bozza resta libera; la guardia del riepilogo e'' in vendite.fn_ricalcola_riepilogo_iva_fattura. Rev 2026-10-27 (20261027-16, brief-modello-documento-vendita §15, R-1): via il blocco della retrocessione di un GIORNALIERO, che decideva «indietro» dalla colonna ordine ed era gia'' coperto dalla matrice (nessuna riga della fattura torna indietro). Lo stato lo scrivono i verbi (porta script.trgfn_doc_stato_solo_dal_verbo): vendite.fn_fattura_proietta_stato.';
