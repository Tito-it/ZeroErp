# vendite.fn_elimina_fattura_da_lotto — perimetro del LOTTO allargato al
#   pre-fiscale, precondizioni da una sede sola, nome che torna vero
#   (piano-db-ritorno-lotto-a-draft.md, Slice 6-B passo B2 — RD-7)
#
# ── LE TRE COSE CHE CAMBIANO ─────────────────────────────────────────────
#   1. **Perimetro.** Il LOTTO non deve piu' essere in DRAFT: basta che
#      sia pre-fiscale (DRAFT o EMESSA). E' lo stesso confine delle due
#      sorelle — fn_annulla_lotto_da_draft e fn_riporta_lotto_a_draft
#      lavorano su documenti non ancora numerati — e la fattura lo aveva
#      gia' da D-L pt.2 (2026-08-02). Il lotto era rimasto indietro.
#   2. **Precondizioni.** Non si scrivono piu' qui: arrivano da
#      script.fn_check_fattura_eliminabile_da_lotto (20260804-17), che e'
#      anche la fonte del messaggio per il BE. Si solleva il codice del
#      PRIMO motivo, con l'elenco completo nel context.
#   3. **Nome.** `_da_lotto_draft` diceva «il lotto dev'essere in bozza»:
#      dopo il punto 1 non e' piu' vero. Si rinomina in
#      `fn_elimina_fattura_da_lotto`. Terzo caso identico in questo
#      cantiere: `fn_elimina_fattura_draft_da_lotto` -> `_da_lotto_draft`
#      (02-08) e `fn_reset_lotto_draft` -> `fn_annulla_lotto_da_draft`
#      (01-08, D-L pt.1). Un nome che mente e' un bug che aspetta.
#
# ── 🔴 CHIUDE UN BUG VIVO, non aggiunge una funzionalita' ────────────────
#   Misura M2 del piano: `LottoDrawer.vue` gate la voce di riga sul solo
#   stato della FATTURA (`preFiscale`) e non guarda lo stato del LOTTO.
#   Su un lotto EMESSA la voce compare gia' oggi e la chiamata fallisce
#   con E_PARAMETRO_INVALIDO. E' la terza occorrenza dello stesso difetto,
#   dopo «Annulla lotto» (07-31) e «Riporta a bozza». Si chiude allineando
#   il DB al FE — il perimetro giusto era quello del FE — invece di
#   aggiungere l'ennesimo gate in Vue.
#
# ── COSA NON CAMBIA ──────────────────────────────────────────────────────
#   Il corpo operativo: una sola chiamata a fn_cleanup_fatture_by_ids con
#   `NULL` come lock_batch_id. ⚠️ Il NULL e' il punto C-22 e resta: passare
#   il batch del lotto libererebbe anche le attivita' delle ALTRE fatture,
#   che invece restano dove sono. RD-7 non tocca nulla di questo — anzi,
#   e' proprio perche' la primitiva sa gia' cancellare bene che il modello
#   «reperto» e' caduto.
#
# ── ROTTURE PER IL BE (volute) ───────────────────────────────────────────
#   * il **nome** della funzione (pipeline_repository lo cita per esteso);
#   * un **contatore in piu'** nel RETURNS TABLE: `riemesse_attivita`,
#     coerente con le sorelle. Dal 2026-08-03 (RD-4) la primitiva riporta
#     le commesse_attivita a NON_EMESSA, ed e' un fatto diverso dallo
#     sblocco delle attivita_fatturabili: un numero solo direbbe «10 cose
#     fatte» senza distinguere. Il nome cambia comunque, quindi si paga
#     una rottura sola invece di due;
#   * i **codici errore** diventano parlanti (831-834 + E_LOTTO_NON_TROVATO
#     / E_FATTURA_NON_TROVATA) al posto di quattro E_PARAMETRO_INVALIDO
#     indistinguibili.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260804-18-rename-fn-elimina-fattura-da-lotto-pre-fiscale-mctit.yaml

  - changeSet:
      id: 20260804-18-rename-fn-elimina-fattura-da-lotto-pre-fiscale
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_elimina_fattura_da_lotto_draft diventa fn_elimina_fattura_da_lotto: il
        lotto non deve piu' essere in DRAFT ma solo pre-fiscale (RD-7), le
        precondizioni arrivano da script.fn_check_fattura_eliminabile_da_lotto e i
        contatori diventano quattro. Chiude il disallineamento DB/FE della voce di
        riga nel drawer.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Rinomina reale: il vecchio nome sparisce. Niente alias di
              -- transizione — non siamo in produzione e un secondo nome vivo
              -- e' esattamente il modo in cui i due si sfilano.
              DROP FUNCTION IF EXISTS vendite.fn_elimina_fattura_da_lotto_draft(bigint, bigint);

              CREATE OR REPLACE FUNCTION vendite.fn_elimina_fattura_da_lotto(
                  p_lotto_id   vendite.fatturazione_lotti.id%TYPE,
                  p_fattura_id vendite.fatture.id%TYPE
              )
               RETURNS TABLE(updated_attivita integer, deleted_fatture integer,
                             deleted_righe integer, riemesse_attivita integer)
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: toglie UNA fattura da un lotto PRE-FISCALE, cancellandola,
              --        senza toccare il lotto ne' le altre fatture.
              -- RD-7 (2026-08-04): togliere = CANCELLARE. Il modello «reperto»
              --        (fattura staccata e portata ad ANNULLATA) e' caduto: era
              --        incoerente che riportare in bozza un lotto INTERO
              --        cancellasse le sue fatture EMESSA mentre la stessa
              --        operazione su UNA riga lasciasse un documento vuoto.
              -- Perimetro: lotto PRE-FISCALE (DRAFT o EMESSA) e fattura
              --        PRE-FISCALE. Prima si pretendeva il lotto in DRAFT: era
              --        il perimetro sbagliato, e il caso che conta e' proprio la
              --        fattura critica dentro un lotto EMESSA.
              -- Regole: C-22 — alla primitiva si passa `NULL` come
              --         `p_lock_batch_id`. Passando quello del lotto si
              --         libererebbero anche le attivita' delle ALTRE fatture.
              DECLARE
                  v_motivi            jsonb;
                  v_updated_attivita  INTEGER := 0;
                  v_deleted_fatture   INTEGER := 0;
                  v_deleted_righe     INTEGER := 0;
                  v_riemesse_attivita INTEGER := 0;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  IF p_fattura_id IS NULL OR p_fattura_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'fn_elimina_fattura_da_lotto', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_fattura_id', 'valore', p_fattura_id), NULL::uuid, 'p_fattura_id obbligatorio e > 0');
                  END IF;

                  -- PRECONDIZIONI — sede unica. Il check verifica anche
                  -- l'esistenza di lotto e fattura e solleva il codice del
                  -- PRIMO motivo; il context porta l'elenco completo, cosi'
                  -- il BE puo' mostrarli tutti.
                  v_motivi := script.fn_check_fattura_eliminabile_da_lotto(p_lotto_id, p_fattura_id);
                  IF jsonb_array_length(v_motivi) > 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_elimina_fattura_da_lotto',
                          v_motivi -> 0 ->> 'codice',
                          jsonb_build_object('lotto_id', p_lotto_id, 'fattura_id', p_fattura_id, 'motivi', v_motivi),
                          NULL::uuid,
                          v_motivi -> 0 ->> 'dettaglio');
                  END IF;

                  -- C-22: NULL, non il lock_batch_id del lotto.
                  SELECT c.deleted_fatture, c.deleted_righe, c.updated_attivita, c.riemesse_attivita
                    INTO v_deleted_fatture, v_deleted_righe, v_updated_attivita, v_riemesse_attivita
                    FROM vendite.fn_cleanup_fatture_by_ids(ARRAY[p_fattura_id], NULL::uuid) AS c;

                  RETURN QUERY SELECT v_updated_attivita, v_deleted_fatture,
                                      v_deleted_righe, v_riemesse_attivita;
              END;
              $function$;

              -- COMMENT esige tipi RISOLTI: qui il %TYPE non si usa.
              COMMENT ON FUNCTION vendite.fn_elimina_fattura_da_lotto(bigint, bigint)
              IS 'Toglie UNA fattura da un lotto PRE-FISCALE cancellandola, senza toccare il lotto ne'' le altre fatture. Rinominata da fn_elimina_fattura_da_lotto_draft il 2026-08-04 (RD-7): il «draft» era riferito al LOTTO, che ora non deve piu'' essere in bozza — basta che sia pre-fiscale, lo stesso confine delle due sorelle. ⚠️ L''allargamento chiude un disallineamento vivo: il drawer gatava la voce di riga sul solo stato della fattura, quindi su un lotto EMESSA la proponeva e la chiamata falliva (terza occorrenza dello stesso difetto). RD-7: togliere = CANCELLARE, il modello «reperto» e'' caduto perche'' era incoerente che il ritorno in bozza di un lotto INTERO cancellasse le sue fatture EMESSA mentre la stessa operazione su UNA riga lasciasse un documento vuoto. ⚠️ La cancellazione NON lascia traccia del contenuto: vendite.fatture.storicizza e'' false di default; resta storicizzata la sola riga di ponte. Le precondizioni non sono scritte qui — arrivano da script.fn_check_fattura_eliminabile_da_lotto, che solleva codici parlanti (831-834) al posto di quattro E_PARAMETRO_INVALIDO indistinguibili. Da C-22 passa NULL come lock_batch_id alla primitiva: il batch del lotto libererebbe anche le attivita'' delle altre fatture. Quarto contatore riemesse_attivita dal 2026-08-04, coerente con le sorelle (RD-4: le commesse_attivita tornano NON_EMESSA, ed e'' un fatto diverso dallo sblocco delle attivita_fatturabili).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              SELECT 1;
