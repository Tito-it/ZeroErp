# Trigger su vendite.contratti_righe (tabella esistente):
# propaga quantita ai figli in contratti_righe_componenti
# quando la quantita della riga padre cambia.
#
# Usa colonna 'quantita' (rinominata da quantita_fissa in 20260511-31).
# File separato da YAML 35 perche' agisce su una tabella diversa.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-36-create-trg-contratti-righe-propaga-qta-componenti-mctit.yaml

  - changeSet:
      id: 20260511-36-01-trg-contrighe-z90-propaga-qta-componenti
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        AFTER UPDATE OF quantita su vendite.contratti_righe _z90_:
        propaga la nuova quantita ai componenti BoM CASO A come
        quantita = coeff_qta_snapshot * NEW.quantita.
        Usa colonna 'quantita' (rinominata da quantita_fissa in 20260511-31).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: contratti_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_componenti_propaga_qta';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_righe_z90_propaga_qta_componenti_upd
                  ON vendite.contratti_righe;

              CREATE TRIGGER trg_contratti_righe_z90_propaga_qta_componenti_upd
                  AFTER UPDATE OF quantita
                  ON vendite.contratti_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_propaga_qta(
                      'vendite',
                      'contratti_righe_componenti',
                      'riga_contratto_id'
                  );
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_righe_z90_propaga_qta_componenti_upd
                  ON vendite.contratti_righe;
