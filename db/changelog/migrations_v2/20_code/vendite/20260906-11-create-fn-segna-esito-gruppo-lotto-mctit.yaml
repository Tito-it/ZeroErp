# ------------------------------------------------------------
# Chi scrive l'esito di un gruppo di lotto — uno solo, e sa ritrovarsi il gruppo.
#   Colonne: changeSet 20260906-10.
#
# ── ⭐ PERCHE' UNA FUNZIONE E NON UN `UPDATE` DAL BACKEND ───────────
#   Il pezzo difficile non e' scrivere la riga: e' sapere QUALE riga. Chi
#   fallisce ha in mano la **commessa**, il lotto ha in mano i **gruppi**, e i
#   due si incontrano solo passando dalla chiave di raggruppamento.
#   ⛔ Se quella derivazione la rifa' il backend, diventa una seconda scrittura
#   della stessa regola — e il giorno in cui la chiave cambia forma, le due
#   versioni dissentono in silenzio.
#   ⇒ La derivazione resta dov'e' gia': `vendite.fn_build_gruppo_fatturabile_key`,
#     la stessa che costruisce la chiave per la dashboard di competenza. Qui non
#     si ricostruisce niente, si chiama.
#
# ── ⭐ IL CHIAMANTE PASSA CIO' CHE HA, NON CIO' CHE SERVIREBBE ──────
#   Al punto in cui il giro fallisce c'e' la commessa, non il gruppo (si vede
#   nelle segnalazioni: `commessa_id` e nessuna chiave di gruppo). Pretendere il
#   gruppo vorrebbe dire far calcolare al chiamante proprio la cosa che questa
#   funzione esiste per sapere.
#   ⇒ Si accettano tutti e due: chi ha il gruppo lo passa, chi ha solo la
#     commessa passa quella e la funzione ritrova il gruppo **dentro quel lotto**.
#
# ── ⛔ NON SOLLEVA MAI, E NON E' PIGRIZIA ───────────────────────────
#   La chiama un gestore d'eccezione: sta annotando **un fallimento gia'
#   avvenuto**. Se sollevasse, sostituirebbe l'errore vero — quello che dice
#   cosa sistemare — con un errore su di se'. E' la stessa scelta gia' presa per
#   `maintenance.fn_job_run_log_failure`.
#   ⇒ Ogni via d'uscita e' un `RAISE WARNING`, e il valore di ritorno e' il
#     numero di gruppi marcati: **zero e' una risposta**, e chi chiama puo'
#     guardarla.
#   ⚠️ Il rovescio va detto: quando non riesce a ritrovare il gruppo, TACE
#     (nel senso che non ferma niente). Per questo lo zero va guardato, ed e'
#     cio' che il pgTAP presidia.
#
# ── ⚠️ PERCHE' PUO' MARCARE PIU' DI UN GRUPPO ──────────────────────
#   Una commessa puo' alimentare piu' di un documento. Se dentro quel lotto ne
#   tocca due, l'esito va su tutti e due: erano tutti e due nel giro fallito.
#   ⛔ Sceglierne uno «il primo» sarebbe una scommessa travestita da regola.
#
# ── ⛔ COSA QUESTA FUNZIONE NON FA ──────────────────────────────────
#   Non tocca la commessa, non tocca l'emittibilita', non toglie il documento
#   dalla competenza. Segna com'e' andato un tentativo — decisione di Tid del
#   2026-09-06, motivata nell'intestazione del changeSet 20260906-10.
#
# Verifica: db/pgtap/vendite/test-lotti-gruppi-esito.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260906-11-create-fn-segna-esito-gruppo-lotto-mctit.yaml

  - changeSet:
      id: 20260906-11-create-fn-segna-esito-gruppo-lotto
      author: mctit
      failOnError: true
      comment: >
        vendite.fn_segna_esito_gruppo_lotto: scrive l'esito su una riga di
        vendite.fatturazione_lotti_gruppi. Il chiamante passa il gruppo se ce
        l'ha, altrimenti la commessa: la funzione ritrova il gruppo dentro quel
        lotto riusando fn_build_gruppo_fatturabile_key. Non solleva mai — la
        chiama un gestore d'eccezione — e torna quanti gruppi ha marcato.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: vendite, tableName: fatturazione_lotti_gruppi, columnName: stato_esecuzione }
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                   JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_build_gruppo_fatturabile_key'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_segna_esito_gruppo_lotto(
                  p_lotto_id        vendite.fatturazione_lotti.id%TYPE,
                  p_stato           text,
                  p_gruppo_key      text   DEFAULT NULL,
                  p_commessa_id     bigint DEFAULT NULL,
                  p_errore_codice   text   DEFAULT NULL,
                  p_errore_messaggio text  DEFAULT NULL)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_marcati integer := 0;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dire come e' andato UN documento dentro un lotto, sulla
                  --   riga che il lotto ha gia' scritto quando ha deciso cosa
                  --   lavorare. Serve perche' un documento che fallisce prima
                  --   di diventare fattura non ha nessun'altra riga dove
                  --   comparire, e senza questa resta invisibile due volte:
                  --   assente dal lotto, e apparentemente sano nella
                  --   competenza.
                  --
                  -- ⛔ Nessun RAISE: la chiama un gestore d'eccezione.
                  -- =========================================================

                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      RAISE WARNING
                          'fn_segna_esito_gruppo_lotto: lotto non indicato, esito non scritto.';
                      RETURN 0;
                  END IF;

                  IF p_stato IS NULL THEN
                      RAISE WARNING
                          'fn_segna_esito_gruppo_lotto: stato non indicato per il lotto %, esito non scritto.',
                          p_lotto_id;
                      RETURN 0;
                  END IF;

                  IF p_gruppo_key IS NULL AND p_commessa_id IS NULL THEN
                      RAISE WARNING
                          'fn_segna_esito_gruppo_lotto: per il lotto % non e'' stato indicato ne'' il gruppo ne'' la commessa: non c''e'' modo di sapere quale riga marcare.',
                          p_lotto_id;
                      RETURN 0;
                  END IF;

                  -- ⚠️ Il CHECK di tabella pretende, su ERRORE, almeno una fra
                  --   causa e frase. Qui si controlla PRIMA: farlo scoprire al
                  --   vincolo vorrebbe dire sollevare, ed e' cio' che questa
                  --   funzione non deve fare.
                  IF p_stato = 'ERRORE'
                     AND p_errore_codice IS NULL
                     AND p_errore_messaggio IS NULL THEN
                      RAISE WARNING
                          'fn_segna_esito_gruppo_lotto: errore senza causa ne'' frase sul lotto %: un errore muto non si scrive.',
                          p_lotto_id;
                      RETURN 0;
                  END IF;

                  -- =========================================================
                  -- Si marca il gruppo indicato, oppure QUELLI che quella
                  -- commessa alimenta dentro QUESTO lotto.
                  -- ⭐ La chiave si costruisce con la funzione che la
                  --   costruisce gia' per la dashboard: non se ne riscrive
                  --   una seconda versione.
                  -- =========================================================
                  UPDATE vendite.fatturazione_lotti_gruppi g
                     SET stato_esecuzione  = p_stato,
                         errore_codice     = CASE WHEN p_stato = 'ERRORE' THEN p_errore_codice END,
                         errore_messaggio  = CASE WHEN p_stato = 'ERRORE' THEN p_errore_messaggio END,
                         errore_quando     = CASE WHEN p_stato = 'ERRORE' THEN clock_timestamp() END
                   WHERE g.lotto_id = p_lotto_id
                     AND (
                          (p_gruppo_key IS NOT NULL AND g.gruppo_key = p_gruppo_key)
                       OR (p_gruppo_key IS NULL AND EXISTS (
                              SELECT 1
                                FROM vendite.commesse_attivita ca
                               WHERE ca.commessa_id = p_commessa_id
                                 AND vendite.fn_build_gruppo_fatturabile_key(
                                         ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id
                                     ) = g.gruppo_key))
                     );

                  GET DIAGNOSTICS v_marcati = ROW_COUNT;

                  -- ⚠️ Zero e' una risposta, e va detta: vuol dire che il
                  --   fallimento non e' stato appeso a niente, cioe' che il
                  --   lotto continuera' a raccontare un errore su un documento
                  --   che non mostra.
                  IF v_marcati = 0 THEN
                      RAISE WARNING
                          'fn_segna_esito_gruppo_lotto: nessun gruppo trovato nel lotto % (gruppo=%, commessa=%): esito non appeso a nessun documento.',
                          p_lotto_id, p_gruppo_key, p_commessa_id;
                  END IF;

                  RETURN v_marcati;
              END;
              $function$;

              -- ⚠️ Qui i tipi si scrivono SCIOLTI: COMMENT ON FUNCTION non
              --    accetta %TYPE nella firma, lo accetta solo la CREATE.
              COMMENT ON FUNCTION vendite.fn_segna_esito_gruppo_lotto(
                  bigint, text, text, bigint, text, text) IS
                  'Scrive l''esito di UN documento dentro un lotto sulla riga di '
                  'vendite.fatturazione_lotti_gruppi che il lotto ha gia'' creato quando ha '
                  'deciso cosa lavorare. ⭐ Nasce dal lotto LTF-0009578: tre ordini presi '
                  'in carico, due fatturati, e il terzo caduto al primo passo — che restava '
                  'fuori dal lotto (nessuna fattura a cui appendersi) e dentro i documenti '
                  'da emettere senza un segno, quindi sembrava fatturabile. ⭐ Il chiamante '
                  'passa il gruppo se ce l''ha, altrimenti la COMMESSA — che e'' cio'' che ha '
                  'in mano quando fallisce — e la funzione ritrova il gruppo dentro quel '
                  'lotto riusando vendite.fn_build_gruppo_fatturabile_key: la derivazione '
                  'resta in un posto solo. ⚠️ Puo'' marcare piu'' di un gruppo se la commessa '
                  'ne alimenta piu'' d''uno in quel lotto: erano tutti nel giro fallito, e '
                  'sceglierne uno sarebbe una scommessa. ⛔ NON solleva mai: la chiama un '
                  'gestore d''eccezione, e un errore su di se'' coprirebbe l''errore vero. '
                  'Ogni via d''uscita e'' un WARNING e torna quanti gruppi ha marcato — zero '
                  'e'' una risposta e va guardata. ⛔ Non tocca la commessa ne'' '
                  'l''emittibilita'': dice che un tentativo e'' fallito, non che il documento '
                  'non si possa fatturare (decisione di Tid, 2026-09-06).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_segna_esito_gruppo_lotto(
                  bigint, text, text, bigint, text, text);
