# IL GUARD DEI PASSAGGI DELLO STATO DEL JOB DEL LOTTO
#   Brief: brief-modello-documento-vendita §15 (giro 11; F-4, Q-F4 di Tid,
#   2026-10-27).
#
# ── PERCHE' UN GUARD E NON UN VERBO ──────────────────────────────────
#   F-4: «una regola sola, nel database; il processo non cambia». L'unico
#   scrittore vivo di stato_lotto e' il runner del backend
#   (pipeline_repository.set_lotto_job_stato, un UPDATE), che teneva la sua
#   copia della regola. La funzione DB che avrebbe dovuto scriverlo,
#   vendite.fn_set_fatturazione_lotto_stato, non la chiama nessuno e fa una
#   cosa in piu' (riscrive stato_esecuzione delle fatture del lotto):
#   farne lo scrittore avrebbe cambiato il processo. Quindi la regola sta in
#   un guard, che giudica OGNI scrittura dello stato (chiunque la faccia), e
#   il backend ritira la sua copia (richiesta del §15). La funzione morta si
#   ritira in 20261027-07.
#
# ── LA REGOLA ───────────────────────────────────────────────────────
#   Un cambio di stato_lotto e' ammesso se la matrice
#   config.transizioni_stati_lotto_job ha la riga attiva (da, a). Riscrivere
#   lo stesso stato non e' un passaggio: passa (il runner lo fa, ed e' un
#   no-op). Lo stato fuori vocabolario lo rifiuta la FK (20261027-05).
#   Il fermo del lotto («COMPLETATO solo se non fermo») resta del suo guard,
#   trgfn_fatturazione_lotti_guard_completato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261027-06-create-trgfn-fatturazione-lotti-guard-stato-job-mctit.yaml

  - changeSet:
      id: 20261027-06-create-trgfn-fatturazione-lotti-guard-stato-job
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_fatturazione_lotti_guard_stato_job (BEFORE UPDATE OF stato_lotto): i passaggi
        dello stato del job dalla matrice config.transizioni_stati_lotto_job. Brief:
        brief-modello-documento-vendita §15 (F-4, Q-F4).
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: transizioni_stati_lotto_job }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato_job()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- ==========================================================
                  -- Scopo: la sola regola dei passaggi dello stato del job di
                  --   un lotto (stato_lotto), letta dalla matrice. Riscrivere
                  --   lo stesso stato passa.
                  -- rev 2026-10-27 (20261027-06, brief-modello-documento-
                  --   vendita §15, F-4): nasce; la copia del backend si ritira.
                  -- ==========================================================
                  IF NEW.stato_lotto IS NOT DISTINCT FROM OLD.stato_lotto THEN
                      RETURN NEW;
                  END IF;

                  IF NOT EXISTS (
                      SELECT 1
                        FROM config.transizioni_stati_lotto_job t
                        JOIN config.stati_lotto_job sd ON sd.id = t.stato_da_id
                        JOIN config.stati_lotto_job sa ON sa.id = t.stato_a_id
                       WHERE t.attivo IS TRUE
                         AND sd.codice_interno = OLD.stato_lotto
                         AND sa.codice_interno = NEW.stato_lotto
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          TG_TABLE_SCHEMA, TG_NAME, 'E_LOTTO_PARAMETRO_NON_COERENTE',
                          jsonb_build_object('parametro', 'transizione_stato_lotto',
                                             'lotto_id', NEW.id,
                                             'da', OLD.stato_lotto,
                                             'a', NEW.stato_lotto),
                          NEW.tx_id,
                          concat('stato del job ', OLD.stato_lotto, ' -> ', NEW.stato_lotto,
                                 ' non ammesso (config.transizioni_stati_lotto_job)'),
                          NEW.id::text);
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato_job()
                IS 'Guard (BEFORE UPDATE OF stato_lotto su vendite.fatturazione_lotti): la sola regola dei passaggi dello stato del JOB del lotto. Un cambio di stato e'' ammesso se config.transizioni_stati_lotto_job ha la riga attiva (da, a), letta per codice_interno (la colonna del lotto porta il codice, P-1); riscrivere lo stesso stato passa. Altrimenti E_LOTTO_PARAMETRO_NON_COERENTE (parametro transizione_stato_lotto, con da e a nel contesto). Lo stato fuori vocabolario lo rifiuta la FK fk_fatturazione_lotti_stato_lotto; il fermo del lotto (COMPLETATO solo se non fermo) resta di trgfn_fatturazione_lotti_guard_completato. Prima la regola era scritta due volte, in disaccordo: nel backend (pipeline_repository.set_lotto_job_stato, l''unico scrittore) e in vendite.fn_set_fatturazione_lotto_stato (morta, ritirata). Brief: brief-modello-documento-vendita §15 (F-4, Q-F4, Tid 2026-10-27).';

              CREATE TRIGGER trg_fatturazione_lotti_a10_guard_stato_job_upd
                  BEFORE UPDATE OF stato_lotto ON vendite.fatturazione_lotti
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_fatturazione_lotti_guard_stato_job();

              COMMENT ON TRIGGER trg_fatturazione_lotti_a10_guard_stato_job_upd ON vendite.fatturazione_lotti IS
                  'I passaggi dello stato del job del lotto dalla matrice config.transizioni_stati_lotto_job (vendite.trgfn_fatturazione_lotti_guard_stato_job). Brief: brief-modello-documento-vendita §15 (F-4).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_fatturazione_lotti_a10_guard_stato_job_upd ON vendite.fatturazione_lotti;
              DROP FUNCTION IF EXISTS vendite.trgfn_fatturazione_lotti_guard_stato_job();
