# La scheda Critiche smette di far leggere un uuid.
#   Richiesta BE del 2026-09-08 · brief-db-uscita-documento-dal-giro §6.2.
#
# ── ⭐ COSA CAMBIA, IN UNA RIGA ─────────────────────────────────
#   Accanto a `gruppo_key` esce `riferimento`: la stessa cosa, leggibile.
#     ORDINE_VENDITA:01a06ce4-35a6-721a-9cd8-9da48bf77626  ->  ORD0036004
#   La chiave RESTA in riga — la vuole `fn_escludi_documento_da_giro`, cioe' il
#   pulsante «Togli dal giro» — ma smette di essere una colonna che si vede
#   (seed: la riga `gruppo_fatturabile` va a `attivo = f`).
#   ⛔ La risoluzione non e' scritta qui: la fa
#   `vendite.fn_riferimento_gruppo_fatturabile` (20260908-31). Riscriverla
#   sarebbe la terza sede della stessa scala di ripiego.
#
# ── ⚠️ E' UN DROP + CREATE ──────────────────────────────────────
#   `CREATE OR REPLACE` non puo' cambiare una `RETURNS TABLE`: aggiungere una
#   colonna vuole il DROP. ⭐ `riferimento` va IN CODA, dopo `gruppo_key`, e non
#   accanto a `documento_display` dove si leggerebbe meglio: le colonne
#   esistenti non si spostano, o ogni lettore posizionale cambia significato
#   senza fallire.
#
# ── ⭐ SI ORDINA SUL RIFERIMENTO (decisione di Tid, 2026-09-08) ──
#   La voce nuova della whitelist e' `riferimento`, non `gruppo_key`: e'
#   l'etichetta che l'operatore legge, e raggruppare le critiche per documento
#   e' come si legge questa scheda.
#   ⛔ `gruppo_key` NON entra: la sua colonna e' spenta a catalogo, quindi non
#   c'e' nessuna freccia da cliccare — e una voce in whitelist che il seed non
#   offre e' una capacita' irraggiungibile che il presidio di
#   `gen_seed_lista.py` (ramo `irraggiungibili`) segnala.
#   ⚠️ Le due modifiche sono ACCOPPIATE: la riga `riferimento` nel CSV nasce
#   `ordinabile = t`, o il presidio si accende dall'altro lato (`bugiarde`).
#
# ── ⛔ LE CRITICHE DEL GIRO VANNO IN TESTA (decisione di Tid) ────
#   Il `NULLS LAST` fisso di prima e' scritto per le colonne dove il NULL vuol
#   dire «questo dato non c'e'» — l'importo su una riga di lotto, la fase su
#   una riga di fattura. Sul riferimento il NULL e' un'ALTRA cosa: e' la
#   critica DEL GIRO, quella che blocca e che non si puo' togliere in nessun
#   modo. In coda finirebbe sotto le altre, su una lista paginata magari a
#   pagina due: l'operatore toglierebbe trenta documenti uno per uno e il lotto
#   non ripartirebbe lo stesso, per una riga che non ha mai visto.
#   ⇒ `NULLS FIRST` quando si ordina per riferimento, `NULLS LAST` altrove. In
#   entrambi i versi, come il LAST che sostituisce: la posizione dice «questa
#   e' di un'altra specie», non «e' la piu' piccola».
#
# ── ⭐ TIPI: FIRMA ANCORATA, `RETURNS TABLE` QUASI TUTTA ESPLICITA ─
#   ⚠️ E il «quasi» e' il punto. Questa funzione e' la UNION di DUE registri
#   (`fatture_log` e `fatturazione_lotti_log`): dietro `origine`, `livello`,
#   `messaggio`, `riga_key`, `total_count`, `job_corrente` non c'e' UNA colonna,
#   c'e' una scelta fra due o un calcolo. Ancorarle direbbe una cosa falsa.
#   Si ancora solo dove una colonna esiste davvero, verificato in sola lettura
#   con `atttypid::regtype` che ogni ancora risolva al tipo IDENTICO.
#   ⚠️ `riferimento` e' esplicito: e' un'ETICHETTA composta da un ripiego a tre
#   livelli, non il riflesso di una colonna.
#
# Origine del corpo: pg_get_functiondef del 2026-09-08, patchato con
#   sostituzioni DICHIARATE da uno script, mai a mano.
# Verifica: db/pgtap/vendite/test-riferimento-gruppo-fatturabile-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-32-update-fn-list-lotto-segnalazioni-riferimento-mctit.yaml

  - changeSet:
      id: 20260908-32-update-fn-list-lotto-segnalazioni-riferimento
      author: mctit
      failOnError: true
      comment: >
        vendite.fn_list_lotto_segnalazioni espone `riferimento` accanto a
        `gruppo_key` — la stessa cosa leggibile, ORD0036004 invece di un uuid —
        e lo offre in ordinamento con le critiche del GIRO in testa. DROP +
        CREATE: la RETURNS TABLE cambia. La colonna nuova e' in coda, cosi' i
        lettori posizionali non si spostano.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'fn_riferimento_gruppo_fatturabile'
            - columnExists:
                { schemaName: vendite, tableName: fatturazione_lotti_log, columnName: gruppo_key }
            - columnExists:
                { schemaName: vendite, tableName: fatture, columnName: totale_doc }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ DROP obbligatorio: CREATE OR REPLACE non cambia una RETURNS TABLE.
              DROP FUNCTION IF EXISTS vendite.fn_list_lotto_segnalazioni(
                  vendite.fatturazione_lotti.id%TYPE, text,
                  vendite.fatturazione_lotti_log.status%TYPE,
                  boolean, boolean, integer, integer, text, text);

              CREATE OR REPLACE FUNCTION vendite.fn_list_lotto_segnalazioni(
                  p_lotto_id          vendite.fatturazione_lotti.id%TYPE,
                  -- ⚠️ Espliciti e non ancorati, ed e' motivato: `p_origine` e'
                  --    un vocabolario della funzione (FATTURA/LOTTO), non una
                  --    colonna; gli altri sono interruttori e paginazione del
                  --    chiamante. `%TYPE` solo dove una colonna esiste.
                  p_origine           text    DEFAULT NULL,
                  p_livello           vendite.fatturazione_lotti_log.status%TYPE DEFAULT NULL,
                  p_solo_attive       boolean DEFAULT true,
                  p_solo_job_corrente boolean DEFAULT false,
                  p_limit             integer DEFAULT 500,
                  p_offset            integer DEFAULT 0,
                  p_order_by          text    DEFAULT NULL,
                  p_order_dir         text    DEFAULT 'desc')
              -- ⚠️ Quasi tutta esplicita di NECESSITA': e' la UNION di due
              --    registri, e dietro origine/livello/messaggio/riga_key non c'e'
              --    UNA colonna ma una scelta fra due o un calcolo.
              RETURNS TABLE (
                  riga_key          text,
                  id                vendite.fatturazione_lotti_log.id%TYPE,
                  origine           text,
                  data_ora          vendite.fatturazione_lotti_log.data_ora%TYPE,
                  livello           vendite.fatturazione_lotti_log.status%TYPE,
                  messaggio         vendite.fatturazione_lotti_log.messaggio%TYPE,
                  error_code        text,
                  fase              vendite.fatturazione_lotti_log.fase%TYPE,
                  fattura_id        vendite.fatture.id%TYPE,
                  documento_display text,
                  importo           vendite.fatture.totale_doc%TYPE,
                  disabilitato      vendite.fatturazione_lotti_log.disabilitato%TYPE,
                  job_corrente      boolean,
                  total_count       bigint,
                  fuori_job_count   bigint,
                  target            jsonb,
                  gruppo_key        vendite.fatturazione_lotti_log.gruppo_key%TYPE,
                  -- ⭐ IN CODA, e non accanto a documento_display dove si
                  --    leggerebbe meglio: spostare le colonne esistenti cambia
                  --    significato a ogni lettore posizionale, senza fallire.
                  -- ⚠️ Esplicito: e' un'ETICHETTA composta da un ripiego a tre
                  --    livelli, non il riflesso di una colonna.
                  riferimento       text)
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$

              DECLARE
                  v_order_col   text;
                  -- ⭐ Il verso dei NULL non e' piu' una costante: dipende da COSA vuol dire
                  --    il NULL su quella colonna. Vedi dove viene deciso, piu' sotto.
                  v_order_nulls text;
                  v_order_dir   text;
                  v_solo_attive boolean;
                  v_solo_job    boolean;
                  v_limit       integer;
                  v_offset      integer;
                  -- L'istante di inizio dell'ultima corsa. `timestamptz` esplicito:
                  -- e' un confine, non il valore di una colonna di queste tabelle.
                  v_ancora      timestamptz;
              BEGIN
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_list_lotto_segnalazioni', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                  END IF;

                  -- ⚠️ Un valore fuori vocabolario SOLLEVA e non filtra a vuoto:
                  --    una lista vuota si legge come «non c'e' niente», cioe' il
                  --    difetto si traveste da dato. Stessa scelta di
                  --    fn_list_commessa_attivita su p_tipo_movimento.
                  IF p_origine IS NOT NULL
                     AND upper(btrim(p_origine)) NOT IN ('FATTURA', 'LOTTO') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_list_lotto_segnalazioni', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_origine', 'valore', p_origine),
                          NULL::uuid, concat('p_origine non ammesso: ', p_origine));
                  END IF;

                  IF p_livello IS NOT NULL
                     AND upper(btrim(p_livello::text)) NOT IN ('C', 'W', 'I') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_list_lotto_segnalazioni', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_livello', 'valore', p_livello),
                          NULL::uuid, concat('p_livello non ammesso: ', p_livello));
                  END IF;

                  -- ⛔ IL PERIMETRO VIENE DAL LOTTO. `fatturazione_lotti` ha la RLS
                  --    e questa funzione e' SECURITY INVOKER: un lotto fuori dal
                  --    perimetro emittente si legge come «non c'e'». Qui si SOLLEVA
                  --    invece di rispondere zero righe, perche' «non lo vedo» e
                  --    «non ce ne sono» non devono leggersi uguali.
                  PERFORM 1 FROM vendite.fatturazione_lotti l WHERE l.id = p_lotto_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_list_lotto_segnalazioni', 'E_VALORE_MANCANTE',
                          jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, concat('lotto_id ', p_lotto_id));
                  END IF;

                  v_solo_attive := COALESCE(p_solo_attive, TRUE);
                  v_solo_job    := COALESCE(p_solo_job_corrente, FALSE);
                  v_limit       := LEAST(GREATEST(COALESCE(p_limit, 500), 1), 500);
                  v_offset      := GREATEST(COALESCE(p_offset, 0), 0);

                  -- ⭐ L'ANCORA DELL'ULTIMO JOB. Il runner scrive PIPELINE_STARTED
                  --    a ogni corsa: e' l'unica cosa che distingue una corsa dalla
                  --    precedente (il correlation_id e' il lock_batch_id, che due
                  --    corse condividono).
                  --    ⚠️ NULL = il lotto non e' mai passato dal runner: allora non
                  --    c'e' nessuna corsa precedente da cui distinguersi, e tutto
                  --    conta come corrente.
                  SELECT max(e.event_time)
                    INTO v_ancora
                    FROM vendite.event_log e
                   -- ⚠️ Rev 2026-08-22 (L4): via il filtro `e.domain = 'PIPELINE'`.
                   --   Era RIDONDANTE — la query filtra gia' `event_code =
                   --   'PIPELINE_STARTED'`, e un codice appartiene a un dominio solo —
                   --   e la colonna non esiste piu': il dominio e' una proprieta' del
                   --   codice e vive in config.eventi_dominio, non copiata su ogni riga
                   --   dove potrebbe dissentire.
                   WHERE e.entity_type = 'LOTTO'
                     AND e.entity_id   = p_lotto_id
                     AND e.event_code  = 'PIPELINE_STARTED';

                  -- ⭐ WHITELIST CHIUSA. I nomi sono i `campo_sorgente` delle
                  --    colonne del seed della lista `vendite.lotto_segnalazioni`.
                  --    ⚠️ `messaggio` e `disabilitato` NON ci sono di proposito: il
                  --    seed li offre `ordinabile = f`, e una voce che il seed non
                  --    offre e' una capacita' irraggiungibile che il presidio
                  --    segnala.
                  v_order_col := CASE lower(btrim(COALESCE(p_order_by, '')))
                      -- ⛔ Il default e la voce `livello` NON ordinano per il valore
                      --    dello status: 'C' viene prima di 'I' in ordine alfabetico
                      --    PER CASO, e 'W' finisce in fondo PER CASO. Serve un rango.
                      --    ⚠️ I tre letterali sono MAIUSCOLI di necessita': il
                      --    lettore della whitelist (gen_seed_lista.py) cerca
                      --    `WHEN '<nome>' THEN` con [a-z_0-9]+, quindi un `WHEN 'c'`
                      --    verrebbe scambiato per il nome di una colonna ordinabile.
                      WHEN ''                  THEN 'CASE x.livello WHEN ''C'' THEN 3 WHEN ''W'' THEN 2 ELSE 1 END'
                      WHEN 'livello'           THEN 'CASE x.livello WHEN ''C'' THEN 3 WHEN ''W'' THEN 2 ELSE 1 END'
                      WHEN 'data_ora'          THEN 'x.data_ora'
                      WHEN 'origine'           THEN 'x.origine'
                      WHEN 'documento_display' THEN 'x.documento_display'
                      WHEN 'importo'           THEN 'x.importo'
                      WHEN 'error_code'        THEN 'x.error_code'
                      WHEN 'fase'              THEN 'x.fase'
                      WHEN 'job_corrente'      THEN 'x.job_corrente'
                      -- ⭐ Si ordina sul RIFERIMENTO, non sulla chiave: e' l'etichetta che
                      --    l'operatore legge, e raggruppare le critiche per documento e'
                      --    come si legge questa scheda.
                      -- ⛔ `gruppo_key` NON entra in whitelist: dal 2026-09-08 la sua colonna
                      --    e' spenta a catalogo (la chiave viaggia in riga per il pulsante,
                      --    non per l'occhio), quindi non c'e' nessuna freccia da cliccare —
                      --    e una voce che il seed non offre e' una capacita' irraggiungibile
                      --    che il presidio di gen_seed_lista.py segnala.
                      WHEN 'riferimento'       THEN 'x.riferimento'
                      ELSE NULL
                  END;

                  IF v_order_col IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_list_lotto_segnalazioni', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_order_by', 'valore', p_order_by),
                          NULL::uuid, concat('p_order_by non ammesso: ', p_order_by));
                  END IF;

                  v_order_dir := CASE WHEN lower(btrim(COALESCE(p_order_dir, 'desc'))) = 'asc'
                                      THEN 'ASC' ELSE 'DESC' END;

                  -- ⭐ DOVE VANNO LE CRITICHE DEL GIRO, e non e' un dettaglio estetico.
                  --    Il NULLS LAST di default e' scritto per le colonne dove il NULL vuol
                  --    dire «questo dato non c'e'» — l'importo su una riga di lotto, la fase
                  --    su una riga di fattura. Roba da mettere in fondo.
                  -- ⛔ Sul RIFERIMENTO il NULL non e' un dato mancante: e' la critica DEL
                  --    GIRO, quella che blocca e che l'operatore non puo' togliere in nessun
                  --    modo. In coda finirebbe sotto le altre — su una lista paginata,
                  --    magari a pagina due: l'operatore toglierebbe trenta documenti uno per
                  --    uno e il lotto non ripartirebbe lo stesso, per una riga che non ha
                  --    mai visto.
                  -- ⚠️ FIRST in ENTRAMBI i versi, come il LAST che sostituisce: la posizione
                  --    dice «questa e' di un'altra specie», non «e' la piu' piccola».
                  v_order_nulls := CASE WHEN v_order_col = 'x.riferimento'
                                        THEN 'NULLS FIRST' ELSE 'NULLS LAST' END;

                  -- ⚠️ NULLS LAST in ENTRAMBI i versi: meta' delle colonne e' NULL
                  --    su meta' delle righe PER COSTRUZIONE (documento e importo
                  --    solo su FATTURA, fase solo su LOTTO). Sul DESC PostgreSQL
                  --    mette i NULL in testa, quindi «per importo, dal piu' grande»
                  --    comincerebbe dagli eventi di lotto, che un importo non ce
                  --    l'hanno.
                  --    Il pareggio si rompe su (origine, id): la union ha due spazi
                  --    di id, e la coppia e' l'unica chiave stabile.
                  RETURN QUERY EXECUTE format($q$
                      WITH base AS (
                          SELECT 'FATTURA'::text                                  AS origine,
                                 fl.id,
                                 fl.data_ora,
                                 fl.status                                        AS livello,
                                 fl.messaggio,
                                 NULLIF(btrim(fl.meta->>'error_code'), '')        AS error_code,
                                 NULL::text                                       AS fase,
                                 fl.fattura_id,
                                 -- ⭐ L'identita' del documento si legge dallo
                                 --    SNAPSHOT sulla riga fattura, non da un join ad
                                 --    anagrafiche: `billing_account` ha la RLS, e il
                                 --    nome sparirebbe per una ragione che col log non
                                 --    c'entra. Lo snapshot lo scrive il task DRAFT
                                 --    `snapshot_indirizzi_lotto`, quindi su un lotto
                                 --    che ha girato c'e'; il ripiego sul codice del
                                 --    billing account copre la fattura che non ci e'
                                 --    ancora passata.
                                 COALESCE(
                                     NULLIF(btrim(f.cliente_snapshot->>'denominazione'), ''),
                                     NULLIF(btrim(f.cliente_snapshot->>'ba_codice'), '')
                                 )                                                AS documento_display,
                                 f.totale_doc                                     AS importo,
                                 fl.disabilitato,
                                 ($2 IS NULL OR fl.data_ora >= $2)                AS job_corrente,
                                 -- ⭐ IL BERSAGLIO, dalla stessa borsa da cui esce il
                                 --   codice: la strada esisteva gia'.
                                 -- ⚠️ La chiave scritta e' `bersagli`; la colonna si
                                 --   chiama `target` perche' e' il nome deciso dal brief
                                 --   del bersaglio (§4.2) e quello con cui il toast lo
                                 --   conosce. La normalizzazione sta QUI, in un posto
                                 --   solo: cosi' le due superfici usano lo stesso
                                 --   resolver, che e' la ragione della richiesta.
                                 -- ⛔ L'array passa INTATTO, elementi `{id, type}`: NON
                                 --   si traduce `type` in `tipo`. Dev'essere
                                 --   byte-identico a quello che il toast riceve
                                 --   dall'envelope, o per risolvere una seconda forma ne
                                 --   avremmo creata una terza. Il disallineamento
                                 --   `bersaglio`/`bersagli`/`target` si chiude a monte:
                                 --   qui si dichiara, non si nasconde.
                                 fl.meta -> 'bersagli'                            AS target,
                                 -- ⛔ NULL, e non e' un buco: una bozza puo' coprire PIU'
                                 --   documenti, quindi una segnalazione appesa alla FATTURA
                                 --   non ne nomina uno. Sceglierne uno sarebbe una scommessa.
                                 NULL::text                                       AS gruppo_key,
                                 -- Senza chiave non c'e' riferimento: e' lo stesso NULL di
                                 -- sopra, letto dall'altro lato.
                                 NULL::text                                       AS riferimento
                            FROM vendite.fatturazione_lotti_fatture lf
                            JOIN vendite.fatture_log fl ON fl.fattura_id = lf.fattura_id
                            -- LEFT: il log esiste anche se la fattura non e'
                            -- visibile; la riga resta, senza nome e senza importo.
                            LEFT JOIN vendite.fatture f ON f.id = lf.fattura_id
                           WHERE lf.lotto_id = $1

                          UNION ALL

                          SELECT 'LOTTO'::text,
                                 ll.id,
                                 ll.data_ora,
                                 ll.status,
                                 ll.messaggio,
                                 -- 🔴 CORREZIONE 2026-08-24. Due scrittori, due chiavi:
                                 --   `fn_log_pipeline_fase` (DB) scrive `error_code`, il
                                 --   PipelineErrorLogger (backend) scrive `code`, e il
                                 --   lettore ne conosceva una sola.
                                 -- ⚠️ Le righe del backend sono 17 e TUTTE di livello `C`:
                                 --   il codice mancava esattamente dove serve. Nessuno se
                                 --   n'era accorto perche' il percorso DB funziona, quindi
                                 --   il meccanismo SEMBRA a posto.
                                 -- ⚠️ COALESCE e non sostituzione: regge entrambe, quindi
                                 --   non si rompe ne' oggi ne' il giorno che chi scrive
                                 --   si allinea.
                                 COALESCE(
                                     NULLIF(btrim(ll.meta->>'error_code'), ''),
                                     NULLIF(btrim(ll.meta->>'code'), '')
                                 ),
                                 ll.fase,
                                 NULL::bigint,
                                 NULL::text,
                                 NULL::numeric,
                                 ll.disabilitato,
                                 ($2 IS NULL OR ll.data_ora >= $2),
                                 -- ⚠️ Nessun bersaglio sul ramo LOTTO, e non e' un buco
                                 --   da riempire adesso: nessuno lo scrive (misurato: 14
                                 --   chiavi in `meta`, nessuna e' un bersaglio). Il patto
                                 --   e' offerta, non promessa — li' nessun pulsante.
                                 NULL::jsonb,
                                 -- ⭐ Di CHI parla questa segnalazione. NULL = e' del GIRO
                                 --   (un emittente non risolto, una configurazione mancante):
                                 --   non ha un documento da togliere, e blocca.
                                 ll.gruppo_key,
                                 -- ⭐ L'ETICHETTA, accanto alla chiave. La chiave serve al
                                 --   PULSANTE (fn_escludi_documento_da_giro la vuole), il
                                 --   riferimento serve alla persona: 'ORD0036004' invece di
                                 --   'ORDINE_VENDITA:01a06ce4-35a6-721a-9cd8-9da48bf77626'.
                                 -- ⛔ La risoluzione NON e' scritta qui: vive in
                                 --   vendite.fn_riferimento_gruppo_fatturabile, che compone
                                 --   lo split della chiave e fn_get_sorgente_documento_ref.
                                 --   Riscriverla qui sarebbe la terza sede della stessa
                                 --   scala di ripiego.
                                 -- ⚠️ NULL entra e NULL esce: la segnalazione del GIRO non
                                 --   ha un documento da nominare.
                                 vendite.fn_riferimento_gruppo_fatturabile(ll.gruppo_key)
                            FROM vendite.fatturazione_lotti_log ll
                           WHERE ll.lotto_id = $1
                      ), filtrata AS (
                          SELECT b.*
                            FROM base b
                           WHERE ($3 IS NULL OR b.origine = upper(btrim($3)))
                             AND ($4 IS NULL OR b.livello = upper(btrim($4)))
                             AND (NOT $5 OR b.disabilitato IS FALSE)
                      )
                      SELECT format('%%s:%%s', x.origine, x.id)                   AS riga_key,
                             x.id,
                             x.origine,
                             x.data_ora,
                             x.livello,
                             x.messaggio,
                             x.error_code,
                             x.fase,
                             x.fattura_id,
                             x.documento_display,
                             x.importo,
                             x.disabilitato,
                             x.job_corrente,
                             count(*) OVER ()::bigint                             AS total_count,
                             -- ⭐ Quante righe VIVE restano fuori dalla finestra del
                             --    job. Si conta su `filtrata`, cioe' PRIMA del filtro
                             --    sul job: e' l'unico posto da cui si vedono.
                             (SELECT count(*) FROM filtrata y
                               WHERE y.job_corrente IS FALSE)::bigint             AS fuori_job_count,
                             x.target,
                             x.gruppo_key,
                             x.riferimento
                        FROM filtrata x
                       WHERE (NOT $6 OR x.job_corrente)
                       ORDER BY %s %s %s, x.data_ora DESC, x.origine, x.id
                       LIMIT $7 OFFSET $8
                  $q$, v_order_col, v_order_dir, v_order_nulls)
                  USING p_lotto_id, v_ancora, p_origine, p_livello,
                        v_solo_attive, v_solo_job, v_limit, v_offset;
              END;
              $function$;

                            COMMENT ON FUNCTION vendite.fn_list_lotto_segnalazioni(
