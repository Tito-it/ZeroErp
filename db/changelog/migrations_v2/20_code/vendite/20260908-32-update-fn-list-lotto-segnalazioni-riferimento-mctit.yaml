                                vendite.fatturazione_lotti_log.status%TYPE,
                                boolean, boolean, integer, integer, text, text)
                            IS 'Le segnalazioni di un lotto, dai DUE registri (fatture_log e '
                               'fatturazione_lotti_log) in una lista sola, paginata e ordinabile. '
                               '⭐ rev 2026-09-08: espone `riferimento` accanto a `gruppo_key` — la stessa '
