                               'esistenti cambia significato a ogni lettore posizionale senza fallire. '
                               '⚠️ DROP + CREATE, perche'' CREATE OR REPLACE non cambia una RETURNS TABLE. '
                               'Brief: brief-db-uscita-documento-dal-giro §6.2.';
