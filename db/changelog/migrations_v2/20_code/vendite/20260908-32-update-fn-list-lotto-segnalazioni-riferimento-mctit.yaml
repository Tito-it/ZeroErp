                               'una capacita'' irraggiungibile che il presidio di gen_seed_lista.py '
                               'segnala. ⛔ Ordinando per riferimento i NULL vanno in TESTA e non in coda: '
                               'li'' il NULL non e'' un dato mancante, e'' la critica DEL GIRO — quella che '
                               'blocca e che non si puo'' togliere in nessun modo. In coda, su una lista '
                               'paginata, l''operatore toglierebbe trenta documenti uno per uno e il lotto '
