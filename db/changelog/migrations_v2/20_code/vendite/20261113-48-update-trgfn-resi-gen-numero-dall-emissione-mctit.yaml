# IL NUMERO DEL RESO NASCE NELLO STATO DI EMISSIONE, DETTO DAL VOCABOLARIO
#   Brief: brief-db-stati-documento-dal-vocabolario, giro 3 (S-3: l'emissione
#   del reso).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.trgfn_resi_gen_numero numerava «alla transizione a CONFERMATO»,
#   col letterale: lo stato in cui il reso e' emesso, detto con un codice.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Il trigger legge config.stati_doc_reso.emissione (20261113-42) dello
#   stato nuovo. Con il seed e' CONFERMATO: nessun cambio di comportamento.
#   Il COMMENT, una cronaca di revisioni, e' riscritto al presente.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma; VOLATILE, nessun SET, non SECURITY
#   DEFINER (pg_proc su dbdev, 2026-11-14). Il montaggio non cambia.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   prosrc su dbdev, 2026-11-14 (ultimo changeSet: 20261020-44). Il rollback
#   porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261113-48-update-trgfn-resi-gen-numero-dall-emissione-mctit.yaml

  - changeSet:
      id: 20261113-48-update-trgfn-resi-gen-numero-dall-emissione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_resi_gen_numero: il numero nasce nello stato di emissione del reso
        (config.stati_doc_reso.emissione), non nel codice CONFERMATO. COMMENT al presente. Brief:
        brief-db-stati-documento-dal-vocabolario, giro 3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_gen_numero()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$

              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la famiglia di numerazione e' RESO_VENDITA, il codice della
              --   sorgente (era RESO).
              DECLARE
                  v_emissione    config.stati_doc_reso.emissione%TYPE;
                  v_emittente_sr vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE;
                  v_registro     vendite.registri_fatturazione.id%TYPE;
                  v_ass          record;
                  v_anno         vendite.resi.anno%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Assegnare resi.numero all'ingresso nello stato di
                  --   emissione del reso (config.stati_doc_reso.emissione),
                  --   prendendolo dal MOTORE DEI REGISTRI.
                  --
                  -- ⭐ rev 2026-08-31: cambia SOLO il contatore. Formato,
                  --   composizione e momento restano quelli di prima.
                  -- =========================================================

                  -- Gia' numerato -> no-op (immutabilita' da
                  -- trgfn_v_resi_protect_num).
                  IF NEW.numero IS NOT NULL AND btrim(NEW.numero::text) <> '' THEN
                      RETURN NEW;
                  END IF;

                  -- Numero solo nello stato di emissione (no buchi da bozze
                  -- scartate). Lo dice il vocabolario, non il codice.
                  SELECT sdr.emissione INTO v_emissione
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = NEW.stato_doc_reso_id;
                  IF v_emissione IS NOT TRUE THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Il reso porta l'id di emittenti_fiscali, il registro il
                  --   soggetto_ruolo: traduzione 1:1, esplicita.
                  SELECT ef.soggetto_ruolo_id INTO v_emittente_sr
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = NEW.emittente_fiscale_id;

                  -- ⛔ L'involucro: qui si SCRIVE, e un emittente senza
                  --   registro RESO deve fermare.
                  -- ⭐ I SEI PASSI IN UNA CHIAMATA SOLA. Stavano qui e in altre tre
                  --   funzioni identiche: risolvere il registro, ricavare l'anno,
                  --   chiedere il progressivo, leggere il formato, comporre.
                  --   ⚠️ Una correzione alla composizione andava fatta in QUATTRO
                  --   posti, e chi ne dimenticava uno produceva un documento
                  --   formattato diverso dagli altri — che nessun vincolo respinge.
                  -- ⭐ Qui resta l'unica cosa che distingue davvero questo documento
                  --   dagli altri tre: il MOMENTO, cioe' i guard qui sopra.
                  SELECT * INTO v_ass
                    FROM vendite.fn_assegna_numero_documento(
                             p_famiglia_documento          => 'RESO_VENDITA',
                             p_emittente_soggetto_ruolo_id => v_emittente_sr,
                             p_data                        => NEW.data,
                             p_documento_id                => NEW.id,
                             p_utility_id                  => NEW.utility_id,
                             p_corpo                       => NULL) v;

                  -- ⚠️ Le colonne si scrivono INSIEME: numero, anno e registro
                  --   sono una cosa sola — la chiave del documento — e scriverne
                  --   una senza le altre lascia la riga a raccontare un sezionale
                  --   che non e' il suo.
                  NEW.registro_id := v_ass.registro_id;
                  NEW.anno        := v_ass.anno;
                  NEW.numero      := v_ass.numero;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_gen_numero() IS
                  'Assegna il numero al reso quando entra nello stato di emissione del suo vocabolario (config.stati_doc_reso.emissione), chiamando vendite.fn_assegna_numero_documento con la famiglia RESO_VENDITA. Un reso gia'' numerato resta com''e'' (l''immutabilita'' la fa valere vendite.trgfn_v_resi_protect_num); fuori dallo stato di emissione non si numera, cosi'' una bozza scartata non lascia buchi. I passi della numerazione (registro, anno dalla data, progressivo, formato, composizione) stanno in vendite.fn_assegna_numero_documento: qui resta solo il momento. Il formato viene tutto dal registro. Numero, anno e registro si scrivono insieme, perche'' sono la chiave del documento.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_gen_numero()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$

              -- rev 2026-10-20 (brief-db-grammatica-unica-documenti, 2c G-5):
              --   la famiglia di numerazione e' RESO_VENDITA, il codice della
              --   sorgente (era RESO).
              DECLARE
                  v_stato        config.stati_doc_reso.codice_interno%TYPE;
                  v_emittente_sr vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE;
                  v_registro     vendite.registri_fatturazione.id%TYPE;
                  v_ass          record;
                  v_anno         vendite.resi.anno%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Assegnare resi.numero alla transizione a CONFERMATO,
                  --   prendendolo dal MOTORE DEI REGISTRI.
                  --
                  -- ⭐ rev 2026-08-31: cambia SOLO il contatore. Formato,
                  --   composizione e momento restano quelli di prima.
                  -- =========================================================

                  -- Gia' numerato -> no-op (immutabilita' da
                  -- trgfn_v_resi_protect_num).
                  IF NEW.numero IS NOT NULL AND btrim(NEW.numero::text) <> '' THEN
                      RETURN NEW;
                  END IF;

                  -- Numero solo a CONFERMATO (no buchi da bozze scartate).
                  SELECT sdr.codice_interno INTO v_stato
                    FROM config.stati_doc_reso sdr
                   WHERE sdr.id = NEW.stato_doc_reso_id;
                  IF v_stato IS DISTINCT FROM 'CONFERMATO' THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Il reso porta l'id di emittenti_fiscali, il registro il
                  --   soggetto_ruolo: traduzione 1:1, esplicita.
                  SELECT ef.soggetto_ruolo_id INTO v_emittente_sr
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = NEW.emittente_fiscale_id;

                  -- ⛔ L'involucro: qui si SCRIVE, e un emittente senza
                  --   registro RESO deve fermare.
                  -- ⭐ I SEI PASSI IN UNA CHIAMATA SOLA. Stavano qui e in altre tre
                  --   funzioni identiche: risolvere il registro, ricavare l'anno,
                  --   chiedere il progressivo, leggere il formato, comporre.
                  --   ⚠️ Una correzione alla composizione andava fatta in QUATTRO
                  --   posti, e chi ne dimenticava uno produceva un documento
                  --   formattato diverso dagli altri — che nessun vincolo respinge.
                  -- ⭐ Qui resta l'unica cosa che distingue davvero questo documento
                  --   dagli altri tre: il MOMENTO, cioe' i guard qui sopra.
                  SELECT * INTO v_ass
                    FROM vendite.fn_assegna_numero_documento(
                             p_famiglia_documento          => 'RESO_VENDITA',
                             p_emittente_soggetto_ruolo_id => v_emittente_sr,
                             p_data                        => NEW.data,
                             p_documento_id                => NEW.id,
                             p_utility_id                  => NEW.utility_id,
                             p_corpo                       => NULL) v;

                  -- ⚠️ Le colonne si scrivono INSIEME: numero, anno e registro
                  --   sono una cosa sola — la chiave del documento — e scriverne
                  --   una senza le altre lascia la riga a raccontare un sezionale
                  --   che non e' il suo.
                  NEW.registro_id := v_ass.registro_id;
                  NEW.anno        := v_ass.anno;
                  NEW.numero      := v_ass.numero;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_gen_numero() IS
                  'Assegna il numero a il reso alla transizione a CONFERMATO, chiamando vendite.fn_assegna_numero_documento. ⭐ rev 2026-08-31 (brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4): i SEI PASSI della numerazione — risolvere il registro, ricavare l''anno dalla data documento, chiedere il progressivo, leggere il formato, comporre — non stanno piu'' qui. Stavano qui E in altre tre funzioni identiche (DDT, ordini, resi, commessa), verificato il 2026-08-31: gli stessi sei passi, quattro volte. ⚠️ Una correzione alla composizione andava fatta in QUATTRO posti, e chi ne dimenticava uno produceva un difetto MUTO — un documento formattato diverso dagli altri, che nessun vincolo respinge. ⭐ QUI RESTA L''UNICA COSA CHE DISTINGUE DAVVERO QUESTO DOCUMENTO DAGLI ALTRI TRE: il MOMENTO. I guard di uscita anticipata decidono SE e QUANDO numerare, poi la chiamata fa il resto — centralizzare anche il momento avrebbe messo in una funzione comune la sola cosa che comune non e''. ⭐ IL FORMATO VIENE TUTTO DAL REGISTRO — prefisso, suffisso e lunghezza, in una lettura sola — e i DEFAULT con cui un registro nasce stanno in vendite.famiglie_documento. ⛔ config.sistema_codici NON C''ENTRA PIU'': il 20260831-53 ne ha tolto le righe di ddt, ordine, reso e commessa. ⚠️ Fino al 20260831-54 questa descrizione diceva che il catalogo dei formati «conserva la sola LUNGHEZZA»: era vero fino al 53, e nel frattempo la funzione centrale continuava a leggerla da li'' — zero righe, lunghezza NULL, 7 cifre a tutti (giusto per caso qui, sbagliato sulla commessa). Corretto dal 20260831-55. ⚠️ Il separatore non si legge piu'': se serve, si scrive dentro il prefisso. ⚠️ Le colonne della chiave si scrivono INSIEME, perche'' sono una cosa sola: scriverne una senza le altre lascerebbe la riga a raccontare un sezionale che non e'' il suo. Piano: brief-db-prefisso-sul-registro-e-allineamento-contatori, P-4 e P-16. Rev 2026-10-20 (20261020-44, brief-db-grammatica-unica-documenti 2c, G-5): la famiglia di numerazione e'' RESO_VENDITA, il codice della sorgente (era RESO).';

