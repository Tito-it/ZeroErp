# Stesso pattern di 20260513-09 per DDT.
# Modello unificato: rimuove filtro esposto_in_fattura,
#   aggiunge ac.obbligatorio, v_codice_articolo,
#   guard override=0 condizionale su obbligatorio,
#   check BOM vuota post-loop con E_DOC_COMPOSITO_BOM_VUOTA.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260513-11-update-fn-ddt-riga-componenti-init-modello-unificato-mctit.yaml

  - changeSet:
      id: 20260513-11-update-fn-ddt-riga-componenti-init-modello-unificato
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Modello unificato fn_ddt_riga_componenti_init: rimuove filtro
        esposto_in_fattura, aggiunge obbligatorio per guard override=0
        condizionale, attivo nell'INSERT, check BOM vuota post-loop.
        Fix: SELECT riga+articolo unificata in JOIN; resolver con
        p_articolo_padre_contesto=v_articolo_id (STADIO BUNDLE); aggiunti
        listino_riga_id e contratto_id nel prezzo_resolver_context.
        Allineato a 20260513-09. Rev 2026-05-13.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: ddt_righe
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ddt_riga_componenti_init(
                  p_riga_id                vendite.ddt_righe.id%TYPE,
                  p_emittente_sr_id        anagrafiche.soggetti_ruoli.id%TYPE,
                  p_data_riferimento       date,
                  p_componenti_overrides   jsonb DEFAULT NULL
              )
              RETURNS integer
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: Popola ddt_righe_componenti per una riga composita CASO A.
              --   Loop per-componente con fn_resolve_prezzo_listino_v2.
              --   Override: mappa {componente_id::text: prezzo_numeric}.
              --   Strict path: se nessun override e resolver fail -> raise.
              --   Idempotente: no-op se componenti gia' presenti o articolo non composito.
              --   Modello unificato: tutti i componenti attivi (no filtro esposto_in_fattura).
              DECLARE
                  v_articolo_id      catalogo.articoli.id%TYPE;
                  v_codice_articolo  catalogo.articoli.codice%TYPE;
                  v_uom_id           catalogo.unita_misura.id%TYPE;
                  v_qta_padre        vendite.ddt_righe.quantita%TYPE;
                  v_ddt_id           vendite.ddt.id%TYPE;
                  v_is_composito     catalogo.articoli.is_composito%TYPE;
                  v_ba_id            anagrafiche.billing_account.id%TYPE;
                  v_utility_id       vendite.ddt.utility_id%TYPE;
                  v_comp             record;
                  v_resolve          record;
                  v_prezzo           vendite.listini_righe.prezzo%TYPE;
                  v_origine          vendite.ddt_righe_componenti.origine_prezzo%TYPE;
                  v_err_msg          text;
                  v_inserted         integer := 0;
              BEGIN
                  IF p_riga_id IS NULL OR p_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_riga_id'),
                          NULL::uuid, 'p_riga_id obbligatorio e > 0');
                  END IF;
                  IF p_emittente_sr_id IS NULL OR p_emittente_sr_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_emittente_sr_id'),
                          NULL::uuid, 'p_emittente_sr_id obbligatorio e > 0');
                  END IF;

                  SELECT dr.articolo_id, dr.uom_operativa_id, dr.quantita, dr.ddt_id,
                         a.is_composito, a.codice
                    INTO v_articolo_id, v_uom_id, v_qta_padre, v_ddt_id,
                         v_is_composito, v_codice_articolo
                    FROM vendite.ddt_righe dr
                    JOIN catalogo.articoli a ON a.id = dr.articolo_id
                   WHERE dr.id = p_riga_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('p_riga_id', p_riga_id),
                          NULL::uuid, 'riga ddt non trovata');
                  END IF;
                  IF NOT COALESCE(v_is_composito, FALSE) THEN RETURN 0; END IF;

                  -- Idempotenza: no-op se componenti gia' presenti
                  IF EXISTS (
                      SELECT 1 FROM vendite.ddt_righe_componenti
                       WHERE riga_ddt_id = p_riga_id
                  ) THEN RETURN 0; END IF;

                  SELECT d.billing_account_id, d.utility_id
                    INTO v_ba_id, v_utility_id
                    FROM vendite.ddt d WHERE d.id = v_ddt_id;

                  -- Loop per-componente sulla BoM attiva alla data (tutti i componenti, no filtro esposto)
                  FOR v_comp IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             a.uom_id       AS componente_uom_id,
                             a.iva_id       AS componente_iva_id
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                       WHERE ac.prodotto_id        = v_articolo_id
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita           @> p_data_riferimento
                  LOOP
                      -- Controlla se override presente per questo componente
                      IF p_componenti_overrides IS NOT NULL
                         AND p_componenti_overrides ?? v_comp.componente_id::text THEN
                          v_prezzo  := (p_componenti_overrides ->> v_comp.componente_id::text)::numeric;
                          v_origine := 'MANUALE';
                          -- Guard prezzo=0 solo per componenti obbligatori
                          IF v_prezzo = 0 AND COALESCE(v_comp.obbligatorio, TRUE) THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_ddt_riga_componenti_init',
                                  'E_PARAMETRO_INVALIDO',
                                  jsonb_build_object('componente_id', v_comp.componente_id,
                                      'hint', 'prezzo override deve essere diverso da zero'),
                                  NULL::uuid, p_riga_id::text);
                          END IF;
                          INSERT INTO vendite.ddt_righe_componenti (
                              riga_ddt_id, articolo_componente_id, componente_id,
                              coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                              prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                          ) VALUES (
                              p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                              v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                              v_comp.componente_uom_id, 1,
                              v_prezzo, v_comp.componente_iva_id, v_origine,
                              v_comp.obbligatorio,
                              jsonb_build_object('override', true,
                                  'emittente_sr_id', p_emittente_sr_id,
                                  'data_riferimento', p_data_riferimento,
                                  'ba_id', v_ba_id, 'utility_id', v_utility_id)
                          );
                      ELSE
                          -- Resolver path per singolo componente
                          BEGIN
                              SELECT * INTO v_resolve
                                FROM vendite.fn_resolve_prezzo_listino_v2(
                                    v_comp.componente_id, v_comp.componente_uom_id,
                                    p_data_riferimento, v_ba_id, v_utility_id::integer,
                                    p_emittente_sr_id, NULL,
                                    v_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                                );
                              INSERT INTO vendite.ddt_righe_componenti (
                                  riga_ddt_id, articolo_componente_id, componente_id,
                                  coeff_qta_snapshot, quantita, uom_operativa_id, factor_to_base,
                                  prezzo_unitario, iva_id, origine_prezzo, attivo, prezzo_resolver_context
                              ) VALUES (
                                  p_riga_id, v_comp.bom_entry_id, v_comp.componente_id,
                                  v_comp.coeff_qta, v_comp.coeff_qta * v_qta_padre,
                                  v_comp.componente_uom_id, 1,
                                  v_resolve.prezzo_finale, v_comp.componente_iva_id,
                                  v_resolve.origine,
                                  v_comp.obbligatorio,
                                  jsonb_build_object('emittente_sr_id', p_emittente_sr_id,
                                      'data_riferimento', p_data_riferimento,
                                      'ba_id', v_ba_id, 'utility_id', v_utility_id,
                                      'listino_id', v_resolve.listino_id,
                                      'listino_versione_id', v_resolve.listino_versione_id,
                                      'listino_riga_id', v_resolve.listino_riga_id,
                                      'contratto_id', v_resolve.contratto_id,
                                      'origine', v_resolve.origine)
                              );
                          EXCEPTION WHEN SQLSTATE 'P0001' THEN
                              GET STACKED DIAGNOSTICS v_err_msg = MESSAGE_TEXT;
                              PERFORM script.fn_log_and_raise_error(
                                  'vendite', 'fn_ddt_riga_componenti_init',
                                  'E_DOC_COMPONENTE_LISTINO_MANCANTE',
                                  jsonb_build_object('p_riga_id', p_riga_id,
                                      'componente_id', v_comp.componente_id,
                                      'data_riferimento', p_data_riferimento,
                                      'dettaglio', v_err_msg),
                                  NULL::uuid, p_riga_id::text);
                          END;
                      END IF;
                      v_inserted := v_inserted + 1;
                  END LOOP;

                  -- Check BOM vuota: articolo composito senza componenti attivi alla data
                  IF v_inserted = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ddt_riga_componenti_init',
                          'E_DOC_COMPOSITO_BOM_VUOTA',
                          jsonb_build_object('articolo_id', v_articolo_id,
                              'data_riferimento', p_data_riferimento),
                          NULL::uuid,
                          v_codice_articolo,
                          p_data_riferimento::text
                      );
                  END IF;

                  RETURN v_inserted;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ddt_riga_componenti_init(vendite.ddt_righe.id%TYPE, anagrafiche.soggetti_ruoli.id%TYPE, date, jsonb)
              IS 'Inizializza componenti BoM CASO A per una riga DDT. Modello unificato: tutti i componenti attivi (no filtro esposto_in_fattura). Guard override=0 solo se obbligatorio=true. Check BOM vuota post-loop. Rev 2026-05-13, modello unificato.';
      rollback:
        - sql:
            sql: SELECT 1;
