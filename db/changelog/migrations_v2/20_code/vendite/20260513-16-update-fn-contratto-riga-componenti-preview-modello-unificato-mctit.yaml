# ------------------------------------------------------------
# UPDATE vendite.fn_contratto_riga_componenti_preview
#   rev 2026-05-13 — modello unificato: aggiunta obbligatorio +
#   esposto_in_fattura nella proiezione; rimosso filtro
#   AND ac.esposto_in_fattura = TRUE dal WHERE. Necessario DROP
#   preventivo perché cambia RETURNS TABLE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260513-16-update-fn-contratto-riga-componenti-preview-modello-unificato-mctit.yaml

  - changeSet:
      id: 20260513-16-01-drop-fn-contratto-riga-componenti-preview
      author: mctit
      comment: DROP necessario per modifica RETURNS TABLE (aggiunta obbligatorio, esposto_in_fattura).
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_contratto_riga_componenti_preview';
      changes:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_contratto_riga_componenti_preview(uuid, bigint, numeric, date, bigint, integer, bigint, integer);
      rollback:
        - sql:
            sql: SELECT 1;

  - changeSet:
      id: 20260513-16-02-create-fn-contratto-riga-componenti-preview-modello-unificato
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Aggiorna fn_contratto_riga_componenti_preview al modello unificato:
        aggiunta obbligatorio + esposto_in_fattura nella proiezione RETURNS TABLE;
        rimosso filtro AND ac.esposto_in_fattura = TRUE dal WHERE (ora tutti i componenti
        attivi e validi sono inclusi; il BE/FE decide cosa mostrare/obbligare).
        rev 2026-05-13, modello unificato.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: catalogo
            tableName: articoli_componenti
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_contratto_riga_componenti_preview(
                  p_articolo_id         catalogo.articoli.id%TYPE,
                  p_uom_id              catalogo.unita_misura.id%TYPE,
                  p_quantita_padre      vendite.contratti_righe.quantita%TYPE,
                  p_data_riferimento    date,
                  p_ba_id               anagrafiche.billing_account.id%TYPE,
                  p_utility_id          vendite.contratti.utility_id%TYPE,
                  p_emittente_sr_id     anagrafiche.soggetti_ruoli.id%TYPE,
                  p_classe_utenza_id    config.classi_utenze.id%TYPE DEFAULT NULL
              )
              RETURNS TABLE (
                  articolo_componente_id catalogo.articoli_componenti.id%TYPE,
                  componente_id          catalogo.articoli.id%TYPE,
                  componente_codice      catalogo.articoli.codice%TYPE,
                  componente_descrizione catalogo.articoli.descrizione%TYPE,
                  coeff_qta_snapshot     catalogo.articoli_componenti.coeff_qta%TYPE,
                  quantita_componente    catalogo.articoli_componenti.coeff_qta%TYPE,
                  uom_id                 catalogo.articoli.uom_id%TYPE,
                  uom_codice             catalogo.unita_misura.codice%TYPE,
                  iva_id                 catalogo.articoli.iva_id%TYPE,
                  prezzo_suggerito       vendite.listini_righe.prezzo%TYPE,
                  origine_prezzo         vendite.contratti_righe_componenti.origine_prezzo%TYPE,
                  resolver_error_reason  text,
                  obbligatorio           boolean,
                  esposto_in_fattura     boolean
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo: preview read-only dei componenti BoM CASO A per il drawer riga contratto
              --   (form atomic). Per ogni componente attivo e valido tenta
              --   fn_resolve_prezzo_listino_v2; se fallisce ritorna prezzo_suggerito=NULL
              --   + motivazione in resolver_error_reason. Nessun side-effect (STABLE).
              --   rev 2026-05-13: modello unificato — rimosso filtro esposto_in_fattura=TRUE;
              --   obbligatorio e esposto_in_fattura sono ora esposti nella proiezione.
              DECLARE
                  v_rec     record;
                  v_resolve record;
              BEGIN
                  FOR v_rec IN
                      SELECT ac.id          AS bom_entry_id,
                             ac.componente_id,
                             ac.coeff_qta,
                             ac.obbligatorio,
                             ac.esposto_in_fattura,
                             a.codice       AS a_codice,
                             a.descrizione  AS a_descrizione,
                             a.uom_id       AS a_uom_id,
                             a.iva_id       AS a_iva_id,
                             um.codice      AS um_codice
                        FROM catalogo.articoli_componenti ac
                        JOIN catalogo.articoli a ON a.id = ac.componente_id
                        LEFT JOIN catalogo.unita_misura um ON um.id = a.uom_id
                       WHERE ac.prodotto_id        = p_articolo_id
                         AND COALESCE(ac.attivo, TRUE) = TRUE
                         AND ac.validita           @> p_data_riferimento
                  LOOP
                      articolo_componente_id := v_rec.bom_entry_id;
                      componente_id          := v_rec.componente_id;
                      componente_codice      := v_rec.a_codice;
                      componente_descrizione := v_rec.a_descrizione;
                      coeff_qta_snapshot     := v_rec.coeff_qta;
                      quantita_componente    := v_rec.coeff_qta * p_quantita_padre;
                      uom_id                 := v_rec.a_uom_id;
                      uom_codice             := v_rec.um_codice;
                      iva_id                 := v_rec.a_iva_id;
                      obbligatorio           := v_rec.obbligatorio;
                      esposto_in_fattura     := v_rec.esposto_in_fattura;

                      BEGIN
                          SELECT * INTO v_resolve
                            FROM vendite.fn_resolve_prezzo_listino_v2(
                                v_rec.componente_id,
                                v_rec.a_uom_id,
                                p_data_riferimento,
                                p_ba_id,
                                p_utility_id::integer,
                                p_emittente_sr_id,
                                p_classe_utenza_id,
                                p_articolo_id  -- p_articolo_padre_contesto: attiva STADIO BUNDLE
                            );
                          prezzo_suggerito      := v_resolve.prezzo_finale;
                          origine_prezzo        := v_resolve.origine;
                          resolver_error_reason := NULL;
                      EXCEPTION WHEN SQLSTATE 'P0001' THEN
                          GET STACKED DIAGNOSTICS resolver_error_reason = MESSAGE_TEXT;
                          prezzo_suggerito := NULL;
                          origine_prezzo   := NULL;
                      END;

                      RETURN NEXT;
                  END LOOP;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_contratto_riga_componenti_preview(
                  catalogo.articoli.id%TYPE, catalogo.unita_misura.id%TYPE,
                  vendite.contratti_righe.quantita%TYPE, date,
                  anagrafiche.billing_account.id%TYPE, vendite.contratti.utility_id%TYPE,
                  anagrafiche.soggetti_ruoli.id%TYPE, config.classi_utenze.id%TYPE)
              IS 'Preview componenti BoM CASO A per drawer riga contratto (form atomic). Read-only STABLE. rev 2026-05-13, modello unificato: aggiunta obbligatorio + esposto_in_fattura nella proiezione. Rimosso filtro esposto_in_fattura=TRUE: tutti i componenti attivi e validi sono restituiti. prezzo_suggerito=NULL + resolver_error_reason se listino mancante.';
