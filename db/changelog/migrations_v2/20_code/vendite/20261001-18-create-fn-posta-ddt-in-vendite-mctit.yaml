# P-1 — Il posting della bolla passa in vendite: il registro non conosce i suoi consumatori
#   vendite.fn_posta_ddt(p_ddt_id, p_fase)   p_fase = 'USCITA' | 'ARRIVO'
#   Brief: brief-db-magazzino-registro-anello-interno, sezioni 2 (D-2) e 3 (P-1)
#
# -- PERCHE' QUI ----------------------------------------------------------------------------------
#   Il registro di magazzino e' un servizio dell'anello 2 (D-1): una porta sola
#   (fn_scrivi_movimento), un catalogo delle sorgenti come punto di estensione,
#   nessuna conoscenza di chi lo usa. magazzino.fn_posta_ddt leggeva ddt,
#   ddt_righe, ddt_righe_componenti e ddt_righe_prelievi: il registro conosceva
#   la bolla. D-2: chi muove merce scrive il PROPRIO posting nel proprio schema
#   e chiama la primitiva. Lo stesso nome, nello schema che lo possiede.
#
# -- IL CORPO -------------------------------------------------------------------------------------
#   Dalla doc auto-generata di magazzino.fn_posta_ddt (identica allo YAML
#   20260928-74 e al prosrc vivo, md5 confrontato il 2026-10-01). Firma,
#   RETURNS TABLE e DECLARE ancorati come nell'originale. Cambiano SOLO le
#   coordinate di chi solleva:
#     * area e funzione di fn_log_and_raise_error: 'vendite', 'vendite.fn_posta_ddt';
#     * il guard di parametro solleva E_VENDITE_CHIAMATA_NON_VALIDA e non
#       E_MAG_CHIAMATA_NON_VALIDA: il codice nomina la famiglia di funzioni che
#       lo solleva (catalogo: «guard di parametro delle funzioni di vendite»).
#       Stessa classe (TECNICO), stesso testo («Chiamata non valida a %s: %s.»),
#       stessi due valori: per il backend nessuna differenza.
#   Movimenti, ordine, costo, sorgente, causali: identici.
#
# -- RISERVATA ------------------------------------------------------------------------------------
#   SECURITY DEFINER del proprietario, NON concessa all'app: ci si arriva solo
#   da vendite.fn_cambia_stato_ddt. La postura (REVOKE a PUBLIC e all'app) nelle
#   tre sedi: forward 90_end/20261001-24, loop 90_end/ci_apply/20260205-41
#   (v_fn_riservate), scripts/sql/provision_db_roles.sql.
#   magazzino.fn_posta_ddt si ritira in 90_end/20261001-24, non qui: due
#   preConditions di 90_end (20260928-83, -98) la pretendono esistente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261001-18-create-fn-posta-ddt-in-vendite-mctit.yaml

  - changeSet:
      id: 20261001-18-create-fn-posta-ddt-in-vendite
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_posta_ddt(p_ddt_id, p_fase): il posting della bolla, un movimento per
        prelievo, nello schema del documento che muove la merce (D-2). Corpo identico a
        magazzino.fn_posta_ddt, che si ritira in 90_end/20261001-24; il guard di parametro
        solleva E_VENDITE_CHIAMATA_NON_VALIDA. DEFINER, riservata al verbo della bolla. Brief:
        brief-db-magazzino-registro-anello-interno, sezione 3 (P-1).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: ddt_righe_prelievi
            - sqlCheck:
                expectedResult: "2"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE (n.nspname, p.proname) IN (('magazzino', 'fn_scrivi_movimento'),
                                                    ('vendite', 'fn_ddt_causale_magazzino'));
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_posta_ddt(
                  p_ddt_id vendite.ddt.id%TYPE,
                  p_fase   text)
               RETURNS TABLE(
                  movimento_id magazzino.movimenti.id%TYPE,
                  prelievo_id  vendite.ddt_righe_prelievi.id%TYPE,
                  qta          magazzino.movimenti.qta%TYPE)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              #variable_conflict use_column
              -- Scopo: scrivere i movimenti di una bolla, uno per prelievo, nella
              --   fase chiesta — USCITA all'emissione, ARRIVO alla consegna di una
              --   bolla di trasferimento. Non ricontrolla: la primitiva e' la rete.
              -- ⚠️ p_fase e' text e non %TYPE: e' un selettore (USCITA | ARRIVO)
              --   senza colonna-vocabolario, validato qui sotto.
              DECLARE
                  v_ddt         vendite.ddt%ROWTYPE;
                  v_causale     config.causali_trasporto.causale_magazzino%TYPE;
                  v_sorgente_id config.sorgenti.id%TYPE;
                  v_prel        record;
              BEGIN
                  IF p_ddt_id IS NULL OR p_ddt_id <= 0
                     OR p_fase IS NULL OR p_fase NOT IN ('USCITA', 'ARRIVO') THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_ddt',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'bolla maggiore di zero, fase USCITA o ARRIVO',
                                             'p_ddt_id', p_ddt_id, 'p_fase', p_fase),
                          NULL::uuid, 'vendite.fn_posta_ddt',
                          'p_ddt_id (obbligatorio, maggiore di zero), p_fase (USCITA | ARRIVO)');
                  END IF;

                  SELECT d.* INTO v_ddt FROM vendite.ddt d WHERE d.id = p_ddt_id;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_ddt',
                          'E_DDT_NOT_FOUND', jsonb_build_object('ddt_id', p_ddt_id), NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  v_causale := vendite.fn_ddt_causale_magazzino(v_ddt);
                  -- L'arrivo esiste solo per la bolla di trasferimento: una chiamata
                  -- diversa e' un chiamante rotto, non un dato.
                  IF v_causale IS NULL OR (p_fase = 'ARRIVO' AND v_causale <> 'TRASF_OUT') THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_ddt',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'la bolla non muove merce in questa fase',
                                             'ddt_id', p_ddt_id, 'p_fase', p_fase, 'causale_magazzino', v_causale),
                          NULL::uuid, 'vendite.fn_posta_ddt',
                          'una bolla che muove merce (ARRIVO: solo la bolla di trasferimento)');
                  END IF;

                  SELECT s.id INTO v_sorgente_id
                    FROM config.sorgenti s
                   WHERE s.codice_interno = 'DDT_VENDITA_PRELIEVO' AND s.attivo;
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error('vendite', 'vendite.fn_posta_ddt',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.sorgenti.DDT_VENDITA_PRELIEVO'),
                          NULL::uuid, VARIADIC ARRAY['sorgente DDT_VENDITA_PRELIEVO (config.sorgenti, attiva)']);
                  END IF;

                  FOR v_prel IN
                      SELECT p.id, p.qta AS p_qta, p.lotto_id, p.asset_id,
                             p.ubicazione_id, p.ubicazione_arrivo_id,
                             COALESCE(drc.componente_id, dr.articolo_id) AS articolo_id
                        FROM vendite.ddt_righe_prelievi p
                        JOIN vendite.ddt_righe dr ON dr.id = p.ddt_riga_id
                        LEFT JOIN vendite.ddt_righe_componenti drc ON drc.id = p.ddt_riga_componente_id
                       WHERE dr.ddt_id = p_ddt_id
                         AND dr.attivo
                       ORDER BY dr.riga_nr, dr.id, p.ddt_riga_componente_id NULLS FIRST, p.id
                  LOOP
                      IF p_fase = 'USCITA' THEN
                          movimento_id := magazzino.fn_scrivi_movimento(
                              p_magazzino_id     => v_ddt.magazzino_id,
                              p_articolo_id      => v_prel.articolo_id,
                              p_causale          => v_causale,
                              p_qta              => -v_prel.p_qta,
                              p_sorgente_tipo_id => v_sorgente_id,
                              p_sorgente_riga    => v_prel.id,
                              p_lotto_id         => v_prel.lotto_id,
                              p_asset_id         => v_prel.asset_id,
                              p_ubicazione_id    => v_prel.ubicazione_id,
                              p_data_mov         => v_ddt.data::timestamptz,
                              p_transfer_uid     => CASE WHEN v_causale = 'TRASF_OUT' THEN v_ddt.uid END);
                          qta := -v_prel.p_qta;
                      ELSE
                          movimento_id := magazzino.fn_scrivi_movimento(
                              p_magazzino_id     => v_ddt.magazzino_arrivo_id,
                              p_articolo_id      => v_prel.articolo_id,
                              p_causale          => 'TRASF_IN',
                              p_qta              => v_prel.p_qta,
                              p_sorgente_tipo_id => v_sorgente_id,
                              p_sorgente_riga    => v_prel.id,
                              p_lotto_id         => v_prel.lotto_id,
                              p_asset_id         => v_prel.asset_id,
                              p_ubicazione_id    => v_prel.ubicazione_arrivo_id,
                              p_data_mov         => now(),
                              p_transfer_uid     => v_ddt.uid);
                          qta := v_prel.p_qta;
                      END IF;
                      prelievo_id := v_prel.id;
                      RETURN NEXT;
                  END LOOP;
                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_posta_ddt(vendite.ddt.id%TYPE, text) IS
                  'Il posting di una bolla: un movimento per prelievo (sorgente '
                  'DDT_VENDITA_PRELIEVO, D-L3-d), righe attive, in ordine di riga e di prelievo. '
                  'p_fase = USCITA (all''EMESSO): dal magazzino della bolla, con la causale di '
                  'magazzino della sua causale di trasporto (vendite.fn_ddt_causale_magazzino), '
                  'quantita'' negativa, ubicazione di partenza, data della bolla; per la bolla di '
                  'trasferimento transfer_uid = uid della bolla. p_fase = ARRIVO (al CONSEGNATO, '
                  'solo trasferimento): nel magazzino di arrivo, TRASF_IN, ubicazione di arrivo, '
                  'stesso transfer_uid — il costo e'' quello dell''uscita, lo trova la primitiva. '
                  'Non ricontrolla (la primitiva e'' la rete, la check della merce ha gia'' '
                  'parlato), non crea prelievi, non guarda lo stato: QUANDO lo decide il verbo. '
                  'SECURITY DEFINER, RISERVATA: ci si arriva solo da vendite.fn_cambia_stato_ddt. '
                  'Ritorna (movimento_id, prelievo_id, qta). Sta in vendite e non in magazzino: '
                  'chi muove merce scrive il proprio posting e chiama la primitiva, il registro '
                  'non legge le tabelle di un documento (D-2). Fino al 2026-10-01 era '
                  'magazzino.fn_posta_ddt. Brief: brief-db-magazzino-lotto-3-scarico-da-ddt (P-7), '
                  'brief-db-magazzino-registro-anello-interno (P-1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_posta_ddt(vendite.ddt.id%TYPE, text);
