# R-4 (brief perimetro-emittente Fase E) — 1 di 5.
#
# ⭐ LA JOIN SI SCRIVE UNA VOLTA SOLA, e non nelle sei viste di ramo. Questa e'
#    una UNION ALL di sei resolver (preventivi, ordini, offerte, contratti,
#    commesse, DDT) che portano tutti `emittente_soggetto_ruolo_id`: basta
#    avvolgere la union e risolvere il nome all'esterno. Aggiungere la colonna
#    ai sei rami darebbe lo stesso risultato al prezzo di sei modifiche e di
#    sei occasioni di divergere.
#
# ⚠️ 🔴 IL BRIEF SBAGLIA UN PUNTO, ed e' il motivo per cui i changeSet sono
#    CINQUE e non tre. R-4 dice che le liste «Situazione aperta» e «Backlog»
#    EREDITANO la colonna da questa vista. Non e' vero: sono due viste separate
#    (vw_dash_aperto_documenti, vw_dash_backlog_documenti) con proiezione a
#    colonne ESPLICITE, e il backend legge quelle, non questa. Una colonna
#    aggiunta qui non arriva a valle da sola. Seguono nei changeSet -62 e -63.
#    L'errore era invisibile perche' la frase «eredita» e' vera del DATO
#    (nasce qui) ma falsa della PROIEZIONE (va ri-elencata).
#
# ⚠️ Due vincoli di CREATE OR REPLACE VIEW, silenziosi se sbagliati:
#    1) `security_invoker = on` va RI-SPECIFICATA o PostgreSQL la azzera — e su
#       questa vista ci si appoggia lo scope emittente: senza, la RLS smette di
#       filtrare per chi legge;
#    2) si possono solo APPENDERE colonne in coda: la nuova e' per forza
#       l'ultima. Il `d.*` la mette li' da solo, perche' si espande alla
#       creazione nell'ordine esatto della union.
#
# brief-db-perimetro-emittente-fase-e-e-ricerca.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260818-61-update-vw-dash-fatturazione-documenti-emittente-mctit.yaml

  - changeSet:
      id: 20260818-61-update-vw-dash-fatturazione-documenti-emittente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        R-4 (1 di 5): `emittente_ragione_sociale` in coda a
        vw_dash_fatturazione_documenti. La union dei sei resolver viene
        avvolta e il nome si risolve una volta sola all'esterno, invece che
        nei sei rami. security_invoker=on ri-specificata. ⚠️ Le liste aperto e
        backlog NON ereditano: leggono due viste separate a colonne esplicite
        (changeSet -62 e -63). Brief Fase E, R-4.
      preConditions:
        - onFail: HALT
        - and:
          - viewExists:
              schemaName: vendite
              viewName: vw_dash_fatturazione_documenti
          - tableExists:
              schemaName: anagrafiche
              tableName: soggetti_ruoli
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_documenti
              WITH (security_invoker=on) AS
              SELECT d.*,
                     -- R-4: il nome dell'emittente, risolto una volta per tutti
                     -- i sei rami. LEFT: un documento senza emittente resta in
                     -- lista con la colonna vuota — la dashboard non e' il posto
                     -- dove far sparire i documenti mal configurati.
                     s_ef.ragione_sociale_completa AS emittente_ragione_sociale
                FROM (
                       SELECT p.area,
                           p.competenza_mese,
                           p.documento_id,
                           p.documento_uid,
                           p.codice,
                           p.emittente_fiscale_id,
                           p.emittente_soggetto_ruolo_id,
                           p.valore_totale,
                           p.valore_transitato,
                           p.unita_totali,
                           p.unita_transitate,
                           p.is_transitato,
                           p.is_abortito,
                           p.motivo_fermo,
                           p.stato_codice_interno,
                           p.stato_codice,
                           p.fase,
                           p.cliente_display,
                           p.data_riferimento
                          FROM vendite.vw_dash_fatturazione_preventivi p
                       UNION ALL
                        SELECT o.area,
                           o.competenza_mese,
                           o.documento_id,
                           o.documento_uid,
                           o.codice,
                           o.emittente_fiscale_id,
                           o.emittente_soggetto_ruolo_id,
                           o.valore_totale,
                           o.valore_transitato,
                           o.unita_totali,
                           o.unita_transitate,
                           o.is_transitato,
                           o.is_abortito,
                           o.motivo_fermo,
                           o.stato_codice_interno,
                           o.stato_codice,
                           o.fase,
                           o.cliente_display,
                           o.data_riferimento
                          FROM vendite.vw_dash_fatturazione_ordini o
                       UNION ALL
                        SELECT f.area,
                           f.competenza_mese,
                           f.documento_id,
                           f.documento_uid,
                           f.codice,
                           f.emittente_fiscale_id,
                           f.emittente_soggetto_ruolo_id,
                           f.valore_totale,
                           f.valore_transitato,
                           f.unita_totali,
                           f.unita_transitate,
                           f.is_transitato,
                           f.is_abortito,
                           f.motivo_fermo,
                           f.stato_codice_interno,
                           f.stato_codice,
                           f.fase,
                           f.cliente_display,
                           f.data_riferimento
                          FROM vendite.vw_dash_fatturazione_offerte f
                       UNION ALL
                        SELECT c.area,
                           c.competenza_mese,
                           c.documento_id,
                           c.documento_uid,
                           c.codice,
                           c.emittente_fiscale_id,
                           c.emittente_soggetto_ruolo_id,
                           c.valore_totale,
                           c.valore_transitato,
                           c.unita_totali,
                           c.unita_transitate,
                           c.is_transitato,
                           c.is_abortito,
                           c.motivo_fermo,
                           c.stato_codice_interno,
                           c.stato_codice,
                           c.fase,
                           c.cliente_display,
                           c.data_riferimento
                          FROM vendite.vw_dash_fatturazione_contratti c
                       UNION ALL
                        SELECT m.area,
                           m.competenza_mese,
                           m.documento_id,
                           m.documento_uid,
                           m.codice,
                           m.emittente_fiscale_id,
                           m.emittente_soggetto_ruolo_id,
                           m.valore_totale,
                           m.valore_transitato,
                           m.unita_totali,
                           m.unita_transitate,
                           m.is_transitato,
                           m.is_abortito,
                           m.motivo_fermo,
                           m.stato_codice_interno,
                           m.stato_codice,
                           m.fase,
                           m.cliente_display,
                           m.data_riferimento
                          FROM vendite.vw_dash_fatturazione_commesse m
                       UNION ALL
                        SELECT t.area,
                           t.competenza_mese,
                           t.documento_id,
                           t.documento_uid,
                           t.codice,
                           t.emittente_fiscale_id,
                           t.emittente_soggetto_ruolo_id,
                           t.valore_totale,
                           t.valore_transitato,
                           t.unita_totali,
                           t.unita_transitate,
                           t.is_transitato,
                           t.is_abortito,
                           t.motivo_fermo,
                           t.stato_codice_interno,
                           t.stato_codice,
                           t.fase,
                           t.cliente_display,
                           t.data_riferimento
                          FROM vendite.vw_dash_fatturazione_ddt t
                     ) d
                LEFT JOIN anagrafiche.soggetti_ruoli sr_ef
                       ON sr_ef.id = d.emittente_soggetto_ruolo_id
                LEFT JOIN anagrafiche.soggetti s_ef
                       ON s_ef.id = sr_ef.soggetto_id;

              COMMENT ON VIEW vendite.vw_dash_fatturazione_documenti IS
                  'Union dei resolver per la dashboard fatturazione: preventivi, ordini, '
                  'offerte, contratti, commesse e — dal 2026-07-18 (step 6, '
                  'brief-db-fatturazione-ddt-resi §4a) — DDT. Le due lenti derivano da qui: '
                  'il serbatoio filtra fase <> CHIUSO, il backlog filtra classe <> '
                  'FISIOLOGICO. security_invoker=on (ri-specificato a ogni REPLACE: la '
                  'reloption non e'' visibile in pg_get_viewdef e verrebbe azzerata in '
                  'silenzio -> bypass RLS). '
                  '⭐ Rev 2026-08-18 (R-4, brief perimetro-emittente Fase E): aggiunta in coda '
                  '`emittente_ragione_sociale`. La JOIN e'' scritta UNA volta avvolgendo la '
                  'union, non sei volte nei rami: i sei resolver portano tutti '
                  'emittente_soggetto_ruolo_id, quindi il nome si risolve all''esterno. '
                  '⚠️ Le due lenti NON ereditano la colonna: vw_dash_aperto_documenti e '
                  'vw_dash_backlog_documenti hanno proiezione a colonne esplicite e sono le '
                  'viste che il backend legge davvero — vanno aggiornate a parte (changeSet '
                  '20260818-62 e -63). «Eredita» e'' vero del dato, falso della proiezione.';
      rollback:
        - sql:
            sql: |
              -- Nessun rollback automatico: rimuovere una colonna da una vista
              -- richiede DROP + ricreazione della catena a valle. Se serve
              -- tornare indietro si scrive un changeSet nuovo con numerazione
              -- successiva.
              SELECT 1;
