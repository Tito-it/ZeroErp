# P-1 / Q-E — vendite.vw_ordini_lista: + registro_codice, registro_descrizione
#   Brief: brief-db-distinta-ricerca-rate §4-bis.2 (decisione di Tid, 2026-09-17).
#
# -- LO STESSO BLOCCO SU TUTTE LE SORELLE CHE UN REGISTRO CE L'HANNO ---------
#   Il registro di numerazione (ordini.registro_id, dal 20260831) arriva in coda
#   con la stessa forma appesa a vw_fatture_lista nello stesso giro
#   (20260917-02): fatture, ddt, ordini e resi lo espongono allo stesso modo,
#   cosi' chi scrive l'ottava copia non la copia da una vista senza.
#   ⛔ contratti, preventivi e offerte NON hanno registro_id: non lo avranno.
#   ⚠️ Nessun numero_documento: qui `numero` e' gia' il parlante (varchar).
#
# -- IL REGISTRO E' LEFT: un documento senza registro compare senza registro.
# -- CREATE OR REPLACE: colonne in ULTIMA posizione (si consuma per nome).
# -- security_invoker=on RI-SPECIFICATA, o PostgreSQL la azzera.
# -- Nessun consumatore oggi: il repository legge v.*, la colonna arriva; il
#    seed di lista la prende quando servira'.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260917-04-update-vw-ordini-lista-registro-mctit.yaml

  - changeSet:
      id: 20260917-04-update-vw-ordini-lista-registro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_ordini_lista: + registro_codice, registro_descrizione in coda (LEFT JOIN vendite.registri_fatturazione).
        security_invoker=on ri-specificata. Brief: brief-db-distinta-ricerca-rate,
        sezione 4-bis.2 (P-1, Q-E).
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_ordini_lista
            - tableExists:
                schemaName: vendite
                tableName: registri_fatturazione
            - columnExists:
                schemaName: vendite
                tableName: ordini
                columnName: registro_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_ordini_lista
              WITH (security_invoker=on) AS
               SELECT o.id,
                  o.uid,
                  o.numero,
                  o.serie,
                  o.anno,
                  o.data,
                  o.stato_doc_ordine_id,
                  sd.codice_interno AS stato_codice_interno,
                  sd.descrizione AS stato_descrizione,
                  o.soggetto_ruolo_id,
                  s.id AS soggetto_id,
                  s.ragione_sociale_completa,
                  s.id_fiscale_univoco_cf_piva,
                  o.billing_account_id,
                  ba.codice AS ba_codice,
                  o.emittente_fiscale_id,
                  ef.codice AS emittente_fiscale_codice,
                  o.utility_id,
                  u.codice AS utility_codice,
                  u.descrizione AS utility_descrizione,
                  o.imponibile_tot,
                  o.sconto_tot,
                  o.iva_tot,
                  o.totale_doc,
                  o.modalita_pagamento_id,
                  mp.codice AS modalita_pagamento_codice,
                  o.termine_pagamento_id,
                  tp.codice AS termine_pagamento_codice,
                  o.valuta_id,
                  v_val.codice AS valuta_codice,
                  o.tasso_cambio,
                  o.fatturazione_trigger,
                  o.canale_origine,
                  o.agente_soggetto_ruolo_id,
                  s_ag.ragione_sociale_completa AS agente_denominazione,
                  o.documento_origine_tipo,
                  o.documento_origine_id,
                      CASE o.documento_origine_tipo
                          WHEN 'PREVENTIVO'::text THEN pv.numero
                          WHEN 'OFFERTA'::text THEN oc.codice::character varying
                          ELSE NULL::character varying
                      END AS documento_origine_codice,
                  o.data_insert,
                  o.user_insert,
                  o.data_update,
                  o.user_update,
                  sd.pdf_mode,
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  sd.fase,
                  lin.pratica_id,
                  lin.pratica_numero,
                  lin.n_pratiche,
                  lin.frontiera_tipo_id,
                  lin.frontiera_codice,
                  lin.frontiera_stato_codice_interno,
                  lin.frontiera_fase,
                  lin.n_discendenti_attivi,
                  lin.is_transitato,
                  lin.frontiera_natura_doc_codice_interno,
                  lin.frontiera_tipo_codice_interno,
                  dcr.data_consegna_richiesta_cliente_min,
                  reg.codice AS registro_codice,
                  reg.descrizione AS registro_descrizione
                 FROM vendite.ordini o
                   JOIN config.stati_doc_ordini sd ON sd.id = o.stato_doc_ordine_id
                   JOIN anagrafiche.soggetti_ruoli sr ON sr.id = o.soggetto_ruolo_id
                   JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                   LEFT JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                   LEFT JOIN anagrafiche.emittenti_fiscali ef ON ef.id = o.emittente_fiscale_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = ef.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id
                   LEFT JOIN config.utilities u ON u.id = o.utility_id
                   LEFT JOIN config.modalita_pagamento mp ON mp.id = o.modalita_pagamento_id
                   LEFT JOIN config.termini_pagamento tp ON tp.id = o.termine_pagamento_id
                   LEFT JOIN config.valute v_val ON v_val.id = o.valuta_id
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ag ON sr_ag.id = o.agente_soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ag ON s_ag.id = sr_ag.soggetto_id
                   LEFT JOIN vendite.preventivi pv ON pv.id = o.documento_origine_id AND o.documento_origine_tipo::text = 'PREVENTIVO'::text
                   LEFT JOIN vendite.offerte_commerciali oc ON oc.id = o.documento_origine_id AND o.documento_origine_tipo::text = 'OFFERTA'::text
                   LEFT JOIN vendite.vw_documento_lineage lin ON lin.tipo_id = (( SELECT sorgenti.id
                         FROM config.sorgenti
                        WHERE sorgenti.codice_interno::text = 'ORDINE_VENDITA'::text AND sorgenti.attivo IS TRUE)) AND lin.uid = o.id::text
                   LEFT JOIN LATERAL ( SELECT min(orr.data_consegna_richiesta_cliente) AS data_consegna_richiesta_cliente_min
                         FROM vendite.ordini_righe orr
                        WHERE orr.ordine_id = o.id AND orr.attivo IS TRUE) dcr ON true
                   LEFT JOIN vendite.registri_fatturazione reg ON reg.id = o.registro_id;

              COMMENT ON VIEW vendite.vw_ordini_lista
              IS 'Vista canonica lista/dettaglio ordini vendita: testata + decodifiche denormalizzate (stato, cliente, billing/emittente/utility, pagamento, valuta, agente, documento origine) + pdf_mode (modalita'' bottone PDF per-riga, data-driven). Sola denormalizzazione: nessuno scope/filtro. security_invoker=on (RLS-ready). rev 2026-07-11: +pdf_mode. ⭐ rev 2026-08-29 — porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama «Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev 2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da `config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql §6c vieta `codice_interno AS *_codice` perche'' il nome mentirebbe sulla sorgente — un consumatore che confronta contro un `*_codice` si aspetta la colonna MUTABILE. Il guardrail CI scripts/sql/check_naming_stato_codice.sql fallisce sul pattern. (2) arriva `frontiera_tipo_codice_interno`, il CODICE del tipo accanto al suo id: prima ogni consumatore se lo traduceva con lo stesso join a config.sorgenti — dieci copie scritte a mano nel backend, tutte fuori dalla portata del guardrail, che scansiona solo le viste. ⚠️ Il nome NON e'' `frontiera_tipo_codice`: quel valore e'' `config.sorgenti.codice_interno` e il FE lo usa per la chiave i18n e per instradare, cioe'' come LOGICA. Chiamarlo `*_codice` avrebbe spostato dieci mislabel nascosti dentro l''unico posto dove il guardrail li vede. ⭐ rev 2026-09-13 (P-6, brief-db-modifiche-certe-ciclo-vendita-e-articolo sezione 5.2): + data_consegna_richiesta_cliente_min, la prima data di consegna chiesta dal cliente sulle righe ATTIVE dell''ordine. E'' un min() calcolato dalle righe e non una colonna di testata, perche'' una colonna sarebbe una seconda sorgente di verita'' che va fuori sincrono al primo cambio di riga; il suffisso _cliente dice di chi e'' la data (D-16: non marcato = nostro, marcato = della controparte). NULL = nessuna riga attiva la dichiara. In ultima posizione perche'' CREATE OR REPLACE VIEW puo'' solo appendere. Serve la lista (ui.lista_colonna 746) e il drawer di testata, che leggono SELECT v.*. ⭐ rev 2026-09-17 (brief-db-distinta-ricerca-rate §4-bis.2, Q-E): + registro_codice, registro_descrizione in coda, LEFT JOIN vendite.registri_fatturazione su registro_id (20260831). E'' lo stesso blocco appeso a vw_fatture_lista nello stesso giro: le sorelle che un registro ce l''hanno — fatture, ddt, ordini, resi — lo espongono allo stesso modo, cosi'' chi scrive l''ottava copia non la copia da una vista senza. ⛔ contratti, preventivi e offerte NON hanno registro_id e non avranno queste colonne: non e'' una dimenticanza. Nessun numero_documento qui: su questa vista `numero` e'' gia'' il numero parlante (varchar).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_ordini_lista;
