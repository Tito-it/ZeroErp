# ------------------------------------------------------------
# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 2a (le testate): i montaggi
# di script.trgfn_doc_guard_emittente_ba
#   Brief: brief-db-grammatica-unica-documenti §11 (G-1, G-4 di Tid; L2-1).
#
#   Il primo argomento del trigger e' il documento nella grammatica delle
#   testate, che passa ai codici di config.sorgenti (DDT -> DDT_VENDITA,
#   ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO ->
#   RESO_VENDITA). Gli argomenti di un trigger si cambiano solo smontando e
#   rimontando: 1 montaggi, rigenerati da pg_get_triggerdef su dbdev
#   (2026-10-19) con il solo primo argomento cambiato. Stesso nome, fase,
#   eventi, WHEN e argomenti successivi. I montaggi con CONTRATTO,
#   PREVENTIVO, COMMESSA o FATTURA non cambiano e non si toccano.
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261019-75-remount-trg-doc-guard-emittente-ba-codice-sorgente-mctit.yaml

  - changeSet:
      id: 20261019-75-remount-trg-doc-guard-emittente-ba-codice-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Rimonta i 1 montaggi di script.trgfn_doc_guard_emittente_ba col documento nel codice della sorgente. Grammatica unica, lotto 2a.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_z10_guard_emittente_ba_ins_upd ON vendite.ddt;
              CREATE TRIGGER trg_ddt_z10_guard_emittente_ba_ins_upd BEFORE INSERT OR UPDATE OF billing_account_id, emittente_fiscale_id ON vendite.ddt FOR EACH ROW EXECUTE FUNCTION script.trgfn_doc_guard_emittente_ba('DDT_VENDITA', 'numero', 'emittente_fiscale_id', 'E_DOC_EMITTENTE_BA_INCOERENTE');

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_ddt_z10_guard_emittente_ba_ins_upd ON vendite.ddt;
              CREATE TRIGGER trg_ddt_z10_guard_emittente_ba_ins_upd BEFORE INSERT OR UPDATE OF billing_account_id, emittente_fiscale_id ON vendite.ddt FOR EACH ROW EXECUTE FUNCTION script.trgfn_doc_guard_emittente_ba('DDT', 'numero', 'emittente_fiscale_id', 'E_DOC_EMITTENTE_BA_INCOERENTE');

