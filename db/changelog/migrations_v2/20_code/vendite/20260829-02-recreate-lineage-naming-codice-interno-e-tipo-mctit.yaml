                  'is_abortito (annullato), piu'' has_next_revisione. Il toggle «Mostra storico revisioni» si '
                  'scrive is_superata IS FALSE: is_attiva nasconde anche gli annullati e rende vuoto per '
                  'costruzione il filtro di stato «Annullato». Pura denormalizzazione: nessuno '
                  'scope/filtro/paginazione (restano nel repository consumer). security_invoker=on (RLS-ready). '
                  'Soggetto via istanze_utilities (1 join, valorizzato anche per prospect). ⭐ rev 2026-08-29 — '
                  'porta avanti anche frontiera_natura_doc_codice da vendite.vw_documento_lineage, accanto alle '
                  'altre quattro frontiera_*. Senza, il chip «Transito» decodifica il solo tipo e chiama '
                  '«Fattura» una nota di credito: vendite.fatture e'' UNA tabella, e la chiave del nodo di '
                  'frontiera (frontiera_uid) da questa vista non esce, quindi il consumatore non ha modo onesto '
                  'di ricavarsela. ⚠️ La colonna e'' in ULTIMA posizione perche'' CREATE OR REPLACE VIEW puo'' '
                  'solo appendere: non e'' un disordine da sistemare. ⛔ NULL non significa «non lo so» ma «la '
                  'frontiera non e'' un documento fiscale»: la natura esiste solo per le fatture. ⛔ rev '
                  '2026-08-29 — BONIFICA NAMING §6c + il CODICE DEL TIPO. (1) `frontiera_natura_doc_codice` si '
                  'chiama ora `frontiera_natura_doc_codice_interno`: il valore viene da '
                  '`config.nature_doc_fiscale.codice_interno`, che e'' la colonna IMMUTABILE, e linee-guida-sql '
