# ------------------------------------------------------------
# «SOLO IN BOZZA», CON LE COLONNE CHE IL DOMINIO CAMBIA DOPO
#   vendite.trgfn_doc_righe_lock_fuori_bozza() — due argomenti opzionali in coda:
#   [4] colonne che un UPDATE puo' cambiare fuori bozza, [5] gli stati in cui
#   Brief: brief-db-righe-e-componenti-debiti-residui (§1, D-1 di Tid, 2026-10-08)
#
# -- PERCHE' --------------------------------------------------------
#   Le righe d'ordine avevano il building block solo sul DELETE, perche'
#   data_consegna_confermata cambia dopo la conferma (Tid, 2026-09-14): per
#   lasciare aperta una colonna restavano aperte tutte. A DB la quantita' di
#   una riga d'ordine confermato si cambiava, e a un ordine confermato si
#   aggiungeva una riga. D-1: le tre porte chiuse, aperta solo quella colonna,
#   solo negli stati da evadere.
#
# -- REGOLA DEL 2 ----------------------------------------------------
#   «Fuori bozza tutto chiuso, salvo queste colonne in questi stati» c'era
#   gia', scritta a mano, in vendite.trgfn_ddt_righe_prelievi_guard: in
#   EMESSO e SPEDITO la sola ubicazione_arrivo_id. Il 20261005-16 l'aveva
#   giudicata «un'altra regola, non una copia» perche' il building block
#   non sapeva dire l'eccezione; con le righe d'ordine la stessa forma
#   compare la seconda volta, e il building block la impara. La copia dei
#   prelievi si ritira nello stesso giro (20261008-92, -93).
#
# -- COME ----------------------------------------------------------------
#   * [4] e [5] sono testo separato da virgola, come gli altri argomenti:
#     stanno in pg_trigger.tgargs, e vanno insieme (uno senza l'altro, o una
#     colonna che la riga non ha, e' E_DOC_RIGHE_LOCK_MONTAGGIO).
#   * L'eccezione vale SOLO sull'UPDATE e SOLO negli stati [5]: tolte le [4]
#     e le colonne tecniche (data_update, user_update, tx_id), la riga deve
#     essere identica. Allowlist come script.trgfn_righe_guard_pending: una
#     colonna nuova nasce chiusa.
#   * Gli stati si dicono per codice_interno, come lo stato bozza [2]. Un
#     flag di catalogo che dica «da evadere» non c'e': config.stati_doc_ordini
#     ha `fase`, ma IN_CORSO comprende anche SPEDITO e CONSEGNATO, che la
#     decisione non nomina.
#   * Senza [4]/[5] nulla cambia per gli adottanti di oggi.
#
#   Corpo di partenza: pg_get_functiondef su dbdev (= 20261005-16, verificato
#   il 2026-10-08); COMMENT: quello vivo (rev fino al 20261008-34) piu' la
#   rev di oggi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261008-89-update-trgfn-doc-righe-lock-fuori-bozza-colonne-ammesse-mctit.yaml

  - changeSet:
      id: 20261008-89-update-trgfn-doc-righe-lock-fuori-bozza-colonne-ammesse
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_doc_righe_lock_fuori_bozza: argomenti opzionali [4] colonne ammesse fuori bozza
        e [5] stati in cui lo sono, solo su UPDATE. Brief: brief-db-righe-e-componenti-debiti-residui (§1, D-1).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_doc_righe_lock_fuori_bozza()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- TG_ARGV[0]: tipo documento per script.fn_get_stato_testata_documento
                v_documento    text;
                -- TG_ARGV[1]: colonna della riga che porta l'id del padre
                v_fk_col       text;
                -- TG_ARGV[2] (opz.): codice_interno dello stato «bozza», default DRAFT
                v_stato_bozza  text;
                -- TG_ARGV[3] (opz.): livello del padre, TESTATA (default) o RIGA
                v_livello      text;
                -- TG_ARGV[4] (opz.): colonne che un UPDATE puo' cambiare fuori bozza
                v_ammesse      text[];
                -- TG_ARGV[5] (opz., obbligatorio con [4]): stati in cui le [4] si cambiano
                v_stati_amm    text[];

                v_riga         jsonb;          -- la riga che sta cambiando (NEW, o OLD sul DELETE)
                v_padri        bigint[];       -- i padri coinvolti: uno, due se la riga cambia padre
                v_padre_id     bigint;
                v_testata_id   bigint;
                v_stato        text;
                v_etichetta    text;
                v_verbo        text;
                v_ignora       text[];         -- colonne fuori dal confronto dell'eccezione
                v_solo_ammesse boolean := false;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Le righe di un documento si aggiungono, modificano e
                --   tolgono SOLO finche' il documento e' in bozza. Fuori dalla
                --   bozza il contenuto non e' piu' una proposta ma un fatto
                --   (una spedizione, una merce instradata a fatturazione, un
                --   pricing attivo): le correzioni passano da documenti di
                --   rettifica, non da una riga che cambia.
                --
                -- Building block, montato per documento con fino a sei
                -- argomenti:
                --   [0] tipo documento (DDT | ORDINE | CONTRATTO | OFFERTA |
                --       RESO | PREVENTIVO — decide il lettore
                --       script.fn_get_stato_testata_documento);
                --   [1] colonna FK della riga verso il padre;
                --   [2] (opz.) codice dello stato bozza, default 'DRAFT';
                --   [3] (opz.) livello del padre: 'TESTATA' (default) se la FK
                --       punta alla testata, 'RIGA' se punta a una riga del
                --       documento (tabelle NIPOTI: componenti, rientri). Nel
                --       secondo caso la testata la da'
                --       script.fn_get_testata_id_di_riga (rev 2026-10-05);
                --   [4] (opz.) le colonne che un UPDATE puo' cambiare FUORI
                --       bozza, separate da virgola (rev 2026-10-08);
                --   [5] (opz., obbligatorio con [4]) gli stati — codice_interno,
                --       separati da virgola — in cui le [4] si cambiano.
                --
                -- ⭐ L'eccezione [4]/[5] (rev 2026-10-08): un UPDATE con il
                --    documento in uno degli stati [5] passa se, tolte le [4] e
                --    le colonne tecniche (data_update, user_update, tx_id), la
                --    riga e' IDENTICA a com'era. Allowlist e non denylist, come
                --    script.trgfn_righe_guard_pending: una colonna nuova nasce
                --    chiusa. INSERT e DELETE non hanno eccezioni.
                --
                -- ⛔ Stato e testata si leggono da lettori SECURITY DEFINER:
                --    testate e righe hanno RLS, e un guard invoker non
                --    distinguerebbe «non c'e'» da «non la vedo».
                -- ⚠️ Padre assente = cascade partito dal padre (DELETE), o FK
                --    che parlera' (INSERT/UPDATE): il guard PASSA. La regola di
                --    stato sul padre l'ha gia' applicata il suo guard (la
                --    testata col guard di testata, la riga con questo stesso
                --    building block), e le FK sono NOT NULL: un figlio orfano
                --    non esiste, quindi «assente» non puo' voler dire altro.
                -- ⭐ Fascia _a05_: il rifiuto di stato deve parlare PRIMA dei
                --    guard _a10_ sui legami (fulfillment, figli), o l'operatore
                --    legge un rimedio che non e' il rimedio.
                -- =========================================================

                -- ── Argomenti: errore di MONTAGGIO, non di dato ───────────
                IF COALESCE(array_length(TG_ARGV, 1), 0) < 2
                   OR NULLIF(TG_ARGV[0], '') IS NULL
                   OR NULLIF(TG_ARGV[1], '') IS NULL
                   OR COALESCE(NULLIF(TG_ARGV[3], ''), 'TESTATA') NOT IN ('TESTATA', 'RIGA')
                   -- [4] e [5] vanno insieme: colonne senza stati, o stati senza
                   -- colonne, sono un montaggio a meta'.
                   OR (NULLIF(btrim(COALESCE(TG_ARGV[4], '')), '') IS NULL)
                      <> (NULLIF(btrim(COALESCE(TG_ARGV[5], '')), '') IS NULL) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', TG_NAME::text, 'E_DOC_RIGHE_LOCK_MONTAGGIO',
                    jsonb_build_object('trigger', TG_NAME,
                                       'table',   TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                       'tg_argv', TG_ARGV),
                    NULL::uuid,
                    TG_NAME::text,
                    TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                    'attesi: tipo documento, colonna FK della riga [, codice stato bozza [, livello TESTATA | RIGA [, colonne ammesse fuori bozza, stati in cui sono ammesse]]]');
                END IF;

                v_documento   := TG_ARGV[0];
                v_fk_col      := TG_ARGV[1];
                v_stato_bozza := COALESCE(NULLIF(TG_ARGV[2], ''), 'DRAFT');
                v_livello     := COALESCE(NULLIF(TG_ARGV[3], ''), 'TESTATA');
                v_ammesse     := ARRAY(SELECT btrim(x)
                                         FROM unnest(string_to_array(COALESCE(TG_ARGV[4], ''), ',')) AS x
                                        WHERE btrim(x) <> '');
                v_stati_amm   := ARRAY(SELECT btrim(x)
                                         FROM unnest(string_to_array(COALESCE(TG_ARGV[5], ''), ',')) AS x
                                        WHERE btrim(x) <> '');

                -- ── La riga, letta una volta (niente SQL dinamico per riga) ─
                v_riga := CASE WHEN TG_OP = 'DELETE' THEN to_jsonb(OLD) ELSE to_jsonb(NEW) END;

                IF NOT (v_riga ? v_fk_col) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', TG_NAME::text, 'E_DOC_RIGHE_LOCK_MONTAGGIO',
                    jsonb_build_object('trigger', TG_NAME,
                                       'table',   TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                       'fk_col',  v_fk_col),
                    NULL::uuid,
                    TG_NAME::text,
                    TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                    format('la colonna %s non esiste sulla riga', v_fk_col));
                END IF;

                -- Una colonna ammessa che la riga non ha e' un refuso del montaggio:
                -- l'eccezione non scatterebbe mai, e nessuno se ne accorgerebbe.
                IF EXISTS (SELECT 1 FROM unnest(v_ammesse) AS c WHERE NOT (v_riga ? c)) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', TG_NAME::text, 'E_DOC_RIGHE_LOCK_MONTAGGIO',
                    jsonb_build_object('trigger', TG_NAME,
                                       'table',   TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                       'colonne_ammesse', to_jsonb(v_ammesse)),
                    NULL::uuid,
                    TG_NAME::text,
                    TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                    format('le colonne ammesse %s non esistono tutte sulla riga', array_to_string(v_ammesse, ', ')));
                END IF;

                -- ── L'eccezione: un UPDATE che cambia solo le colonne ammesse ─
                -- Calcolata una volta: se la riga cambia padre, la FK non e' fra
                -- le ammesse e il confronto e' gia' falso.
                IF TG_OP = 'UPDATE' AND cardinality(v_ammesse) > 0 THEN
                  v_ignora := v_ammesse || ARRAY['data_update', 'user_update', 'tx_id'];
                  v_solo_ammesse := (to_jsonb(OLD) - v_ignora) = (v_riga - v_ignora);
                END IF;

                -- ── I padri da guardare ───────────────────────────────────
                -- Su UPDATE anche quello di provenienza: spostare una riga da
                -- un documento emesso a una bozza e' comunque una modifica del
                -- documento emesso.
                v_padri := ARRAY[(v_riga ->> v_fk_col)::bigint];
                IF TG_OP = 'UPDATE'
                   AND (to_jsonb(OLD) ->> v_fk_col) IS DISTINCT FROM (v_riga ->> v_fk_col) THEN
                  v_padri := ARRAY[(to_jsonb(OLD) ->> v_fk_col)::bigint] || v_padri;
                END IF;

                v_verbo := CASE TG_OP
                             WHEN 'INSERT' THEN 'aggiungere'
                             WHEN 'UPDATE' THEN 'modificare'
                             ELSE               'togliere'
                           END;

                FOREACH v_padre_id IN ARRAY v_padri LOOP
                  v_stato := NULL;
                  v_etichetta := NULL;

                  -- Livello RIGA: dalla riga alla sua testata. Riga assente:
                  -- cascade dalla riga, o FK che parlera'. Si passa.
                  IF v_livello = 'RIGA' THEN
                    v_testata_id := script.fn_get_testata_id_di_riga(v_documento, v_padre_id);
                    CONTINUE WHEN v_testata_id IS NULL;
                  ELSE
                    v_testata_id := v_padre_id;
                  END IF;

                  SELECT t.stato, t.etichetta
                    INTO v_stato, v_etichetta
                    FROM script.fn_get_stato_testata_documento(v_documento, v_testata_id) AS t;

                  -- Assente: cascade dalla testata, o FK che parlera'. Si passa.
                  CONTINUE WHEN v_stato IS NULL;

                  -- L'eccezione dichiarata nel montaggio: solo le colonne ammesse,
                  -- solo negli stati ammessi.
                  CONTINUE WHEN v_solo_ammesse AND v_stato = ANY (v_stati_amm);

                  IF v_stato <> v_stato_bozza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', TG_NAME::text, 'E_RIGA_DOC_NON_BOZZA',
                      jsonb_build_object('table',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                         'id',         v_riga ->> 'id',
                                         'documento',  v_documento,
                                         'testata_id', v_testata_id,
                                         'stato',      v_stato,
                                         'operazione', TG_OP)
                      || CASE WHEN v_livello = 'RIGA'
                              THEN jsonb_build_object('riga_documento_id', v_padre_id)
                              ELSE '{}'::jsonb
                         END
                      || CASE WHEN cardinality(v_ammesse) > 0
                              THEN jsonb_build_object('colonne_ammesse', to_jsonb(v_ammesse),
                                                      'stati_ammessi',   to_jsonb(v_stati_amm))
                              ELSE '{}'::jsonb
                         END,
                      (v_riga ->> 'tx_id')::uuid,
                      v_etichetta,
                      v_stato,
                      v_verbo);
                  END IF;
                END LOOP;

                RETURN CASE WHEN TG_OP = 'DELETE' THEN OLD ELSE NEW END;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_doc_righe_lock_fuori_bozza()
              IS 'Building block (2026-09-22): le righe di un documento si aggiungono, modificano e tolgono SOLO '
                  'finche'' il documento e'' in bozza. BEFORE INSERT OR UPDATE OR DELETE FOR EACH ROW, TG_ARGV = [0] '
                  'tipo documento per script.fn_get_stato_testata_documento (DDT | ORDINE | CONTRATTO | OFFERTA | RESO '
                  '| PREVENTIVO, quest''ultimo dal 2026-10-08), [1] colonna FK della riga verso il padre, [2] (opz.) '
                  'codice_interno dello stato bozza, default DRAFT, [3] (opz., dal 2026-10-05) livello del padre: '
                  'TESTATA (default) o RIGA. Rifiuta con E_RIGA_DOC_NON_BOZZA (CONFLITTO_STATO; valori: etichetta, '
                  'stato, verbo). ⛔ Stato e testata si leggono da lettori SECURITY DEFINER perche'' testate e righe '
                  'hanno RLS: un guard invoker non distinguerebbe «non c''e''» da «non la vedo». Padre assente = '
                  'cascade dal padre o FK che parlera'': passa. Su UPDATE guarda anche il padre di provenienza se la '
                  'riga cambia padre. ⭐ Fascia _a05_: il rifiuto di stato parla PRIMA dei guard _a10_ sui legami '
                  '(fulfillment, figli), o l''operatore legge un rimedio che non e'' il rimedio. Nasce da D7 di '
                  'brief-db-partita-merce-per-documento (una riga di DDT gia'' instradata a fatturazione poteva essere '
                  'disattivata) e ritira nello stesso giro le due copie che la regola aveva a DB: '
                  'vendite.trgfn_contratti_righe_lock_post_attivazione (droppata) e il ramo 1 di '
                  'vendite.trgfn_dlt_block_ordrig_ddtrig. Adottanti: vendite.ddt_righe (tre porte), '
                  'vendite.ordini_righe (solo DELETE: INSERT/UPDATE restano aperti di proposito, '
                  'data_consegna_confermata cambia dopo la conferma), vendite.contratti_righe (tre porte). Montaggio '
                  'errato: E_DOC_RIGHE_LOCK_MONTAGGIO (TECNICO). rev 2026-09-29 '
                  '(brief-db-magazzino-lotto-3-bis-carico-da-reso, D-3b-h): quarto adottante, vendite.resi_righe (tre '
                  'porte, tipo RESO, colonna reso_id): dal Lotto 3-bis la conferma del reso carica la merce, e una riga'
                  ' cambiata dopo farebbe divergere reso e registro. rev 2026-10-04 '
                  '(brief-db-righe-esclusione-solo-non-si-vende, R5a): quinto adottante, '
                  'vendite.offerte_commerciali_eccezioni (tre porte, tipo OFFERTA, colonna offerta_id, stato bozza '
                  'BOZZA come terzo argomento): fn_push_offerta_a_contratto copia le righe 1:1 nel contratto, e la '
                  'regola che il backend diceva da solo ora sta ai due capi. rev 2026-10-05 '
                  '(brief-db-righe-esclusione-solo-non-si-vende §8.2 B3): livello RIGA per le tabelle NIPOTI, la cui FK'
                  ' punta a una riga del documento: la testata la da'' script.fn_get_testata_id_di_riga (SECURITY '
                  'DEFINER), e nel contesto entra riga_documento_id. Adottanti a livello RIGA: '
                  'vendite.contratti_righe_componenti e vendite.offerte_commerciali_eccezioni_componenti (prima li '
                  'proteggeva solo il ricalcolo della riga madre, un effetto), vendite.resi_righe_rientri (ritira la '
                  'copia scritta a mano in vendite.trgfn_resi_righe_rientri_guard). Non adottante: '
                  'vendite.ddt_righe_prelievi, la cui regola ammette in EMESSO/SPEDITO il cambio della sola ubicazione '
                  'd''arrivo — un''altra regola, non una copia. rev 2026-10-08 '
                  '(brief-db-righe-e-componenti-le-altre-famiglie §2.2): altri tre adottanti a livello RIGA, '
                  'vendite.preventivi_righe_componenti (tipo PREVENTIVO), vendite.ordini_righe_componenti (ORDINE) e '
                  'vendite.ddt_righe_componenti (DDT); i due lettori DEFINER conoscono le tre famiglie. Le righe '
                  'd''ordine restano chiuse solo sul DELETE e quelle del preventivo non sono chiuse: su una riga kit la'
                  ' quantita'' cambiata fuori bozza ora la respinge il lock del componente, su una semplice no (debito '
                  'nel brief, §5.1). rev 2026-10-08 (brief-db-righe-e-componenti-debiti-residui §1, D-1 di Tid): due '
                  'argomenti opzionali, [4] le colonne che un UPDATE puo'' cambiare FUORI bozza (separate da virgola) e'
                  ' [5] gli stati, per codice_interno, in cui si cambiano; vanno insieme, uno senza l''altro e'' '
                  'E_DOC_RIGHE_LOCK_MONTAGGIO, come una colonna ammessa che la riga non ha. Un UPDATE in uno stato [5] '
                  'passa se, tolte le [4] e le colonne tecniche (data_update, user_update, tx_id), la riga e'' '
                  'identica: allowlist, come script.trgfn_righe_guard_pending, quindi una colonna nuova nasce chiusa. '
                  'INSERT e DELETE non hanno eccezioni. Nel contesto del rifiuto entrano colonne_ammesse e '
                  'stati_ammessi. Regola del 2: la forma esisteva gia'', scritta a mano, in '
                  'vendite.trgfn_ddt_righe_prelievi_guard (la sola ubicazione_arrivo_id in EMESSO/SPEDITO), che la '
                  'ritira nello stesso giro (20261008-92/-93); la seconda occorrenza e'' vendite.ordini_righe (la sola '
                  'data_consegna_confermata in CONFERMATO e PARZIALMENTE_EVASO). Adottanti di oggi: '
                  'vendite.ordini_righe passa alle tre porte con l''eccezione (20261008-90), vendite.preventivi_righe '
                  'alle tre porte senza eccezioni (20261008-91), vendite.ddt_righe_prelievi a livello RIGA con '
                  'l''eccezione (20261008-93).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Manovra di emergenza: il corpo precedente e' 20261005-16 e si riapplica
              --   a mano (con i trigger di 20261008-90/-91/-93 tolti prima).
              SELECT 1;
