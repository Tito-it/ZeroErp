# ------------------------------------------------------------
# MONTAGGI: script.trgfn_righe_guard_articolo_ammesso sulle righe d'eccezione
#   di offerta e contratto — e RITIRO dei due guard per regola che la check
#   ha assorbito (Lotto 3b)
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-2, A-5, §9.3.3)
#
# -- I MONTAGGI ----------------------------------------------------------
#   BEFORE INSERT OR UPDATE OF articolo_id (tipo_eccezione non cambia: lock
#   di colonna E_CONTRATTO_RIGA_TIPO_ECCEZIONE_IMMUTABILE).
#   ⭐ L'ordine dei nomi e' PORTANTE, fascia _a10_:
#     ..._a10_default_erogazione_articolo  (eredita' dell'erogazione)
#     ..._a10_guard_articolo_ammesso       QUESTO: i motivi dell'articolo
#     ..._a10_guard_erogazione_obbligatoria, _perimetro  i motivi della riga
#   Prima l'articolo, poi la riga: un articolo che non si eroga in nessun
#   modo lo dice questo guard (SENZA_EROGAZIONE), non «manca l'erogazione».
#   ⛔ Nomi sotto i 63 caratteri (56 e 54).
#
# -- IL RITIRO -----------------------------------------------------------
#   script.trgfn_righe_guard_aggiunta_fuori_listino (AGGIUNTA gia' in listino)
#   e script.trgfn_righe_guard_esclusione_figlio_bundle (ESCLUSIONE di un
#   figlio di bundle) se ne vanno, coi loro quattro trigger: le due regole
#   sono ora i motivi della check (20261013-55), con gli stessi codici. Le
#   copie si ritirano nello stesso giro (AGENTS.md, regola del 2). Erano
#   montate solo qui (verificato su pg_trigger il 2026-10-13). Restano
#   script.fn_check_esclusione_articolo_documento (la compone la check, e la
#   legge vendite.fn_documento_righe_preview) e i guard di riga.
#   Trigger scritti a mano, non da ci_apply: il DROP e' lecito (§11.5).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261013-57-create-trigger-eccezioni-guard-articolo-ammesso-mctit.yaml

  - changeSet:
      id: 20261013-57-create-trigger-eccezioni-guard-articolo-ammesso
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Monta script.trgfn_righe_guard_articolo_ammesso su offerte_commerciali_eccezioni
        (OFFERTA_COMMERCIALE) e contratti_righe (CONTRATTO), prima dei guard di riga; ritira i guard
        «aggiunta fuori listino» ed «esclusione figlio di bundle», ora motivi della check. Brief:
        brief-db-articoli-ammessi-per-documento (§9.3.3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_trigger t
               WHERE t.tgrelid IN ('vendite.offerte_commerciali_eccezioni'::regclass,
                                   'vendite.contratti_righe'::regclass)
                 AND t.tgname LIKE '%_a10_guard_articolo_ammesso_ins_upd'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_aggiunta_fuori_listino_ins_upd
                  ON vendite.contratti_righe;
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_aggiunta_fuori_listino_ins_upd
                  ON vendite.offerte_commerciali_eccezioni;
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_esclusione_figlio_bundle_ins_upd
                  ON vendite.contratti_righe;
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_escl_figlio_bundle_ins_upd
                  ON vendite.offerte_commerciali_eccezioni;
              DROP FUNCTION IF EXISTS script.trgfn_righe_guard_aggiunta_fuori_listino();
              DROP FUNCTION IF EXISTS script.trgfn_righe_guard_esclusione_figlio_bundle();

              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_articolo_ammesso_ins_upd
                  BEFORE INSERT OR UPDATE OF articolo_id
                  ON vendite.offerte_commerciali_eccezioni
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_righe_guard_articolo_ammesso('OFFERTA_COMMERCIALE', 'offerta_id');

              CREATE TRIGGER trg_contratti_righe_a10_guard_articolo_ammesso_ins_upd
                  BEFORE INSERT OR UPDATE OF articolo_id
                  ON vendite.contratti_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_righe_guard_articolo_ammesso('CONTRATTO', 'contratto_id');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_articolo_ammesso_ins_upd
                  ON vendite.offerte_commerciali_eccezioni;
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_articolo_ammesso_ins_upd
                  ON vendite.contratti_righe;
              -- ⚠️ I due guard ritirati non tornano da soli: vanno ri-applicati i loro
              --    changeSet d'origine (funzione e trigger).
