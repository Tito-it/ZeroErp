# Repoint dei trigger guard_pending riga-level al building-block generico
# script.trgfn_righe_guard_pending (20260601-02) + drop delle 2 funzioni
# dedicate ora morte (contract della regola del 2).
#
# Trigger ripuntati (3):
#   - vendite.preventivi_righe              -> ('preventivo_id')
#   - vendite.contratti_righe               -> ('contratto_id')
#   - vendite.offerte_commerciali_eccezioni -> ('offerta_id')   [nuovo consumer]
#
# Ordine: per ogni tabella DROP TRIGGER + CREATE TRIGGER (sul generico) PRIMA
# del DROP FUNCTION, per evitare errori di dipendenza.
#
# Equivalenza comportamentale: l'allowlist del generico blocca gli stessi campi
# delle vecchie denylist (le sole colonne extra-bloccate, id/data_insert/
# user_insert, sono immutabili in UPDATE). Ordine lessicografico _a10_ del
# trigger guard_pending invariato. I test pgTAP guard_pending sono il
# regression-gate (vedi refactor-prezzi-db.md §4).
#
# Nuovo trigger offerta: nome coerente con i domain-trigger gia' presenti su
# offerte_commerciali_eccezioni (prefisso trg_offerte_eccezioni_a10_*).
#
# Riferimento: refactor-prezzi-db.md §1.1, §3.3
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260601-03-repoint-righe-guard-pending-generic-mctit.yaml

  - changeSet:
      id: 20260601-03-01-repoint-righe-guard-pending-generic
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Ripunta i 3 trigger *_a10_guard_pending_upd (preventivi_righe,
        contratti_righe, offerte_commerciali_eccezioni) a
        script.trgfn_righe_guard_pending(<col_fk>) e droppa le 2 funzioni
        dedicate (trgfn_preventivi_righe_guard_pending,
        trgfn_contratti_righe_guard_pending) ora inutilizzate.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_righe_guard_pending';
          - columnExists:
              schemaName: vendite
              tableName: offerte_commerciali_eccezioni
              columnName: stato_approvazione_prezzo
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ---- preventivi_righe ------------------------------------------
              DROP TRIGGER IF EXISTS trg_preventivi_righe_a10_guard_pending_upd
                  ON vendite.preventivi_righe;
              CREATE TRIGGER trg_preventivi_righe_a10_guard_pending_upd
                  BEFORE UPDATE
                  ON vendite.preventivi_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_righe_guard_pending('preventivo_id');

              -- ---- contratti_righe -------------------------------------------
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_pending_upd
                  ON vendite.contratti_righe;
              CREATE TRIGGER trg_contratti_righe_a10_guard_pending_upd
                  BEFORE UPDATE
                  ON vendite.contratti_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_righe_guard_pending('contratto_id');

              -- ---- offerte_commerciali_eccezioni (nuovo consumer) ------------
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_pending_upd
                  ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_a10_guard_pending_upd
                  BEFORE UPDATE
                  ON vendite.offerte_commerciali_eccezioni
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_righe_guard_pending('offerta_id');

              -- ---- contract: drop funzioni dedicate ora morte ----------------
              DROP FUNCTION IF EXISTS vendite.trgfn_preventivi_righe_guard_pending();
              DROP FUNCTION IF EXISTS vendite.trgfn_contratti_righe_guard_pending();
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Rollback: rimuove il trigger del nuovo consumer offerta e ripunta
              -- preventivi/contratti alle rispettive funzioni dedicate (riapplicare
              -- 20260422-07 e 20260518-02 per ricreare le funzioni droppate).
              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_a10_guard_pending_upd
                  ON vendite.offerte_commerciali_eccezioni;
              DROP TRIGGER IF EXISTS trg_preventivi_righe_a10_guard_pending_upd
                  ON vendite.preventivi_righe;
              DROP TRIGGER IF EXISTS trg_contratti_righe_a10_guard_pending_upd
                  ON vendite.contratti_righe;
