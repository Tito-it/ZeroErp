databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260222-06-refactor-lotti-resolve-emittente-utility-helper-mctit.yaml

  - changeSet:
      id: 20260222-06-01-create-fn-resolve-lotto-utility-emittente
      author: mctit
      comment: "Helper condiviso per risoluzione/validazione utility+emittente da billing_account"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_resolve_lotto_utility_emittente(
                p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL::bigint,
                p_utility_id config.utilities.id%TYPE DEFAULT NULL::integer,
                p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL::bigint,
                p_scope text DEFAULT 'LOTTO'::text,
                p_caller text DEFAULT 'fn_resolve_lotto_utility_emittente'::text,
                p_check_emittente_attivo boolean DEFAULT true
              )
              RETURNS TABLE(
                resolved_utility_id config.utilities.id%TYPE,
                resolved_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_utility_from_ba anagrafiche.billing_account.utility_id%TYPE;
                v_emittente_from_ba anagrafiche.soggetti_ruoli.id%TYPE;
                v_emittente_attivo boolean;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Risolvere e validare utility/emittente per i lotti.
                --
                -- Regole:
                --   - utility da BA se BA presente
                --   - emittente da fn_get_emittente_fiscale_id(BA)
                --     (include fallback default globale)
                --   - se emittente passato e BA presente: deve coincidere
                -- =========================================================

                IF p_billing_account_id IS NOT NULL AND p_billing_account_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', p_caller, 'E_GENERICO',
                    jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account_id non valido','billing_account_id',p_billing_account_id)),
                    NULL::uuid, 'billing_account_id non valido'
                  );
                END IF;

                IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', p_caller, 'E_GENERICO',
                    jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility_id non valido','utility_id',p_utility_id)),
                    NULL::uuid, 'utility_id non valido'
                  );
                END IF;

                IF p_emittente_soggetto_ruolo_id IS NOT NULL AND p_emittente_soggetto_ruolo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', p_caller, 'E_GENERICO',
                    jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente_soggetto_ruolo_id non valido','emittente_soggetto_ruolo_id',p_emittente_soggetto_ruolo_id)),
                    NULL::uuid, 'emittente_soggetto_ruolo_id non valido'
                  );
                END IF;

                resolved_utility_id := p_utility_id;

                IF p_billing_account_id IS NOT NULL THEN
                  SELECT ba.utility_id
                    INTO v_utility_from_ba
                    FROM anagrafiche.billing_account ba
                   WHERE ba.id = p_billing_account_id;

                  IF v_utility_from_ba IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', p_caller, 'E_GENERICO',
                      jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non risolta da billing_account','billing_account_id',p_billing_account_id)),
                      NULL::uuid, 'utility non risolta da billing_account'
                    );
                  END IF;

                  IF resolved_utility_id IS NOT NULL AND resolved_utility_id <> v_utility_from_ba THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', p_caller, 'E_GENERICO',
                      jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente con billing_account','billing_account_id',p_billing_account_id,'utility_id',resolved_utility_id,'utility_attesa',v_utility_from_ba)),
                      NULL::uuid, 'utility non coerente con billing_account'
                    );
                  END IF;

                  resolved_utility_id := COALESCE(resolved_utility_id, v_utility_from_ba);
                END IF;

                v_emittente_from_ba := anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id);

                IF p_emittente_soggetto_ruolo_id IS NOT NULL
                   AND p_billing_account_id IS NOT NULL
                   AND p_emittente_soggetto_ruolo_id <> v_emittente_from_ba THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', p_caller, 'E_GENERICO',
                    jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente non coerente con billing_account','billing_account_id',p_billing_account_id,'emittente_soggetto_ruolo_id',p_emittente_soggetto_ruolo_id,'emittente_atteso',v_emittente_from_ba)),
                    NULL::uuid, 'emittente non coerente con billing_account'
                  );
                END IF;

                resolved_emittente_soggetto_ruolo_id := COALESCE(p_emittente_soggetto_ruolo_id, v_emittente_from_ba);

                IF p_check_emittente_attivo THEN
                  SELECT EXISTS (
                    SELECT 1
                      FROM anagrafiche.emittenti_fiscali ef
                     WHERE ef.soggetto_ruolo_id = resolved_emittente_soggetto_ruolo_id
                       AND ef.attivo IS TRUE
                  )
                  INTO v_emittente_attivo;

                  IF COALESCE(v_emittente_attivo, false) IS FALSE THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', p_caller, 'E_GENERICO',
                      jsonb_build_object('scope',p_scope,'severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente fiscale non attivo/non valido','emittente_soggetto_ruolo_id',resolved_emittente_soggetto_ruolo_id)),
                      NULL::uuid, 'emittente fiscale non attivo/non valido'
                    );
                  END IF;
                END IF;

                RETURN NEXT;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_resolve_lotto_utility_emittente(bigint, integer, bigint, text, text, boolean)
              IS 'Helper condiviso: risolve e valida utility/emittente per i lotti (con fallback default emittente).';

  - changeSet:
      id: 20260222-06-02-update-fn-get-or-create-lotto-use-helper
      author: mctit
      comment: "Refactor fn_get_or_create_lotto con helper condiviso utility/emittente"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_lotto(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE DEFAULT NULL::bigint,
                p_competenza_mese vendite.fatturazione_lotti.competenza_mese%TYPE DEFAULT NULL::date,
                p_tipo_doc_fiscale_id vendite.fatturazione_lotti.tipo_doc_fiscale_id%TYPE DEFAULT NULL::bigint,
                p_utility_id vendite.fatturazione_lotti.utility_id%TYPE DEFAULT NULL::integer,
                p_billing_account_id vendite.fatturazione_lotti.billing_account_id%TYPE DEFAULT NULL::bigint,
                p_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE DEFAULT NULL::uuid,
                p_meta vendite.fatturazione_lotti.meta%TYPE DEFAULT NULL::jsonb,
                p_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE DEFAULT 'MASSIVO'::text,
                p_emittente_soggetto_ruolo_id vendite.fatturazione_lotti.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL::bigint
              )
              RETURNS vendite.fatturazione_lotti.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_lotto_id vendite.fatturazione_lotti.id%TYPE;
                v_competenza vendite.fatturazione_lotti.competenza_mese%TYPE;
                v_utility_id config.utilities.id%TYPE;
                v_tipo_doc_id config.tipi_doc_fiscale.id%TYPE;
                v_billing_account_id anagrafiche.billing_account.id%TYPE;
                v_emittente_id vendite.fatturazione_lotti.emittente_soggetto_ruolo_id%TYPE;
                v_tipo_lotto vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_stato_lotto vendite.fatturazione_lotti.stato_lotto%TYPE;
                v_stato_operativo vendite.fatturazione_lotti.stato_operativo%TYPE;
                v_tipo_lotto_input vendite.fatturazione_lotti.tipo_lotto%TYPE;
                v_resolved_utility_id config.utilities.id%TYPE;
                v_resolved_emittente_id vendite.fatturazione_lotti.emittente_soggetto_ruolo_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recupera un lotto esistente o lo crea se assente.
                --
                -- Regole:
                --   - tipo_lotto obbligatorio (MASSIVO | GIORNALIERO)
                --   - validazioni coerenza complete su lotto esistente
                --   - blocco riuso solo con IN_ESECUZIONE + CHIUSO
                -- =========================================================

                IF p_lotto_id = 0 THEN
                  p_lotto_id := NULL;
                END IF;

                v_tipo_lotto_input := upper(btrim(COALESCE(p_tipo_lotto, '')));
                IF v_tipo_lotto_input IS NULL OR v_tipo_lotto_input = '' OR v_tipo_lotto_input NOT IN ('MASSIVO','GIORNALIERO') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_lotto non valido','tipo_lotto',p_tipo_lotto)),
                    NULL::uuid, 'tipo_lotto non valido'
                  );
                END IF;

                IF p_lotto_id IS NOT NULL AND p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id non valido','lotto_id',p_lotto_id)),
                    NULL::uuid, 'lotto_id non valido'
                  );
                END IF;

                IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                    jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo_doc_fiscale_id non valido','tipo_doc_fiscale_id',p_tipo_doc_fiscale_id)),
                    NULL::uuid, 'tipo_doc_fiscale_id non valido'
                  );
                END IF;

                SELECT r.resolved_utility_id, r.resolved_emittente_soggetto_ruolo_id
                  INTO v_resolved_utility_id, v_resolved_emittente_id
                  FROM vendite.fn_resolve_lotto_utility_emittente(
                    p_billing_account_id => p_billing_account_id,
                    p_utility_id => p_utility_id,
                    p_emittente_soggetto_ruolo_id => p_emittente_soggetto_ruolo_id,
                    p_scope => 'LOTTO',
                    p_caller => 'fn_get_or_create_lotto',
                    p_check_emittente_attivo => true
                  ) r;

                IF p_lotto_id IS NOT NULL THEN
                  SELECT competenza_mese, utility_id, tipo_doc_fiscale_id, billing_account_id,
                         emittente_soggetto_ruolo_id, tipo_lotto, stato_lotto, stato_operativo
                    INTO v_competenza, v_utility_id, v_tipo_doc_id, v_billing_account_id,
                         v_emittente_id, v_tipo_lotto, v_stato_lotto, v_stato_operativo
                    FROM vendite.fatturazione_lotti
                   WHERE id = p_lotto_id;

                  IF v_competenza IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato')),
                      NULL::uuid, concat('lotto non trovato lotto_id: ', p_lotto_id::text)
                    );
                  END IF;

                  IF p_competenza_mese IS NOT NULL AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza non coerente')),
                      NULL::uuid, 'competenza non coerente'
                    );
                  END IF;

                  IF v_resolved_utility_id IS NOT NULL AND v_resolved_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente')),
                      NULL::uuid, 'utility non coerente'
                    );
                  END IF;

                  IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <> v_tipo_doc_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo documento non coerente')),
                      NULL::uuid, 'tipo documento non coerente'
                    );
                  END IF;

                  IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account non coerente')),
                      NULL::uuid, 'billing_account non coerente'
                    );
                  END IF;

                  IF v_resolved_emittente_id IS NOT NULL AND v_resolved_emittente_id <> v_emittente_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente fiscale non coerente')),
                      NULL::uuid, 'emittente fiscale non coerente'
                    );
                  END IF;

                  IF v_tipo_lotto IS NOT NULL AND v_tipo_lotto <> v_tipo_lotto_input THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo lotto non coerente')),
                      NULL::uuid, 'tipo lotto non coerente'
                    );
                  END IF;

                  IF v_stato_lotto = 'IN_ESECUZIONE' AND v_stato_operativo = 'CHIUSO' THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                      jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto in esecuzione non riutilizzabile per stato_operativo','stato_operativo',v_stato_operativo)),
                      NULL::uuid, 'lotto in esecuzione non riutilizzabile'
                    );
                  END IF;

                  RETURN p_lotto_id;
                END IF;

                IF p_lock_batch_id IS NOT NULL THEN
                  SELECT id, competenza_mese, utility_id, tipo_doc_fiscale_id, billing_account_id,
                         emittente_soggetto_ruolo_id, tipo_lotto, stato_lotto, stato_operativo
                    INTO v_lotto_id, v_competenza, v_utility_id, v_tipo_doc_id, v_billing_account_id,
                         v_emittente_id, v_tipo_lotto, v_stato_lotto, v_stato_operativo
                    FROM vendite.fatturazione_lotti
                   WHERE lock_batch_id = p_lock_batch_id
                   ORDER BY id DESC
                   LIMIT 1;

                  IF v_lotto_id IS NOT NULL THEN
                    IF p_competenza_mese IS NOT NULL AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza non coerente')),
                        NULL::uuid, 'competenza non coerente'
                      );
                    END IF;

                    IF v_resolved_utility_id IS NOT NULL AND v_resolved_utility_id <> v_utility_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente')),
                        NULL::uuid, 'utility non coerente'
                      );
                    END IF;

                    IF p_tipo_doc_fiscale_id IS NOT NULL AND p_tipo_doc_fiscale_id <> v_tipo_doc_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo documento non coerente')),
                        NULL::uuid, 'tipo documento non coerente'
                      );
                    END IF;

                    IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account non coerente')),
                        NULL::uuid, 'billing_account non coerente'
                      );
                    END IF;

                    IF v_resolved_emittente_id IS NOT NULL AND v_resolved_emittente_id <> v_emittente_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente fiscale non coerente')),
                        NULL::uuid, 'emittente fiscale non coerente'
                      );
                    END IF;

                    IF v_tipo_lotto IS NOT NULL AND v_tipo_lotto <> v_tipo_lotto_input THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','tipo lotto non coerente')),
                        NULL::uuid, 'tipo lotto non coerente'
                      );
                    END IF;

                    IF v_stato_lotto = 'IN_ESECUZIONE' AND v_stato_operativo = 'CHIUSO' THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto', 'E_GENERICO',
                        jsonb_build_object('scope','LOTTO','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto in esecuzione non riutilizzabile per stato_operativo','stato_operativo',v_stato_operativo)),
                        NULL::uuid, 'lotto in esecuzione non riutilizzabile'
                      );
                    END IF;

                    RETURN v_lotto_id;
                  END IF;
                END IF;

                v_lotto_id := vendite.fn_create_fatturazione_lotto(
                  p_competenza_mese => p_competenza_mese,
                  p_tipo_doc_fiscale_id => p_tipo_doc_fiscale_id,
                  p_utility_id => COALESCE(v_resolved_utility_id, p_utility_id),
                  p_billing_account_id => p_billing_account_id,
                  p_lock_batch_id => p_lock_batch_id,
                  p_meta => p_meta,
                  p_emittente_soggetto_ruolo_id => v_resolved_emittente_id
                );

                UPDATE vendite.fatturazione_lotti
                   SET tipo_lotto = v_tipo_lotto_input,
                       data_update = now(),
                       user_update = current_user
                 WHERE id = v_lotto_id;

                RETURN v_lotto_id;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_lotto(bigint, date, bigint, integer, bigint, uuid, jsonb, text, bigint)
              IS 'Recupera o crea lotto usando helper condiviso per coerenza utility/emittente fiscale.';

  - changeSet:
      id: 20260222-06-03-update-fn-get-or-create-lotto-attivita-use-helper
      author: mctit
      comment: "Refactor fn_get_or_create_lotto_attivita con helper condiviso utility/emittente"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_or_create_lotto_attivita(
                p_lotto_id vendite.attivita_fatturabili_lotti.id%TYPE DEFAULT NULL::bigint,
                p_competenza_mese vendite.attivita_fatturabili_lotti.competenza_mese%TYPE DEFAULT NULL::date,
                p_utility_id vendite.attivita_fatturabili_lotti.utility_id%TYPE DEFAULT NULL::integer,
                p_billing_account_id vendite.attivita_fatturabili_lotti.billing_account_id%TYPE DEFAULT NULL::bigint,
                p_sorgente_tipo_id vendite.attivita_fatturabili_lotti.sorgente_tipo_id%TYPE DEFAULT NULL::bigint,
                p_lock_batch_id vendite.attivita_fatturabili_lotti.lock_batch_id%TYPE DEFAULT NULL::uuid,
                p_meta vendite.attivita_fatturabili_lotti.meta%TYPE DEFAULT NULL::jsonb,
                p_emittente_soggetto_ruolo_id vendite.attivita_fatturabili_lotti.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL::bigint
              )
              RETURNS vendite.attivita_fatturabili_lotti.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_lotto_id vendite.attivita_fatturabili_lotti.id%TYPE;
                v_competenza vendite.attivita_fatturabili_lotti.competenza_mese%TYPE;
                v_utility_id vendite.attivita_fatturabili_lotti.utility_id%TYPE;
                v_billing_account_id vendite.attivita_fatturabili_lotti.billing_account_id%TYPE;
                v_sorgente_tipo_id vendite.attivita_fatturabili_lotti.sorgente_tipo_id%TYPE;
                v_emittente_id vendite.attivita_fatturabili_lotti.emittente_soggetto_ruolo_id%TYPE;
                v_stato_lotto vendite.attivita_fatturabili_lotti.stato_lotto%TYPE;
                v_stato_operativo vendite.attivita_fatturabili_lotti.stato_operativo%TYPE;
                v_resolved_utility_id config.utilities.id%TYPE;
                v_resolved_emittente_id vendite.attivita_fatturabili_lotti.emittente_soggetto_ruolo_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Recupera un lotto attivita esistente o lo crea se assente.
                --
                -- Regole:
                --   - fallback emittente allineato a fatturazione
                --   - coerenza BA/utility/emittente anche su riuso lotto
                --   - blocco riuso lotto con IN_ESECUZIONE + CHIUSO
                -- =========================================================

                IF p_lotto_id = 0 THEN
                  p_lotto_id := NULL;
                END IF;

                IF p_lotto_id IS NOT NULL AND p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto_id non valido')),
                    NULL::uuid, 'lotto_id non valido'
                  );
                END IF;

                IF p_sorgente_tipo_id IS NOT NULL AND p_sorgente_tipo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','sorgente_tipo_id non valido','sorgente_tipo_id',p_sorgente_tipo_id)),
                    NULL::uuid, 'sorgente_tipo_id non valido'
                  );
                END IF;

                SELECT r.resolved_utility_id, r.resolved_emittente_soggetto_ruolo_id
                  INTO v_resolved_utility_id, v_resolved_emittente_id
                  FROM vendite.fn_resolve_lotto_utility_emittente(
                    p_billing_account_id => p_billing_account_id,
                    p_utility_id => p_utility_id,
                    p_emittente_soggetto_ruolo_id => p_emittente_soggetto_ruolo_id,
                    p_scope => 'ATTIVITA_FATTURABILI',
                    p_caller => 'fn_get_or_create_lotto_attivita',
                    p_check_emittente_attivo => true
                  ) r;

                IF p_lotto_id IS NOT NULL THEN
                  SELECT competenza_mese, utility_id, billing_account_id, sorgente_tipo_id,
                         emittente_soggetto_ruolo_id, stato_lotto, stato_operativo
                    INTO v_competenza, v_utility_id, v_billing_account_id, v_sorgente_tipo_id,
                         v_emittente_id, v_stato_lotto, v_stato_operativo
                    FROM vendite.attivita_fatturabili_lotti
                   WHERE id = p_lotto_id;

                  IF v_competenza IS NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto non trovato')),
                      NULL::uuid, 'lotto non trovato'
                    );
                  END IF;

                  IF p_competenza_mese IS NOT NULL AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza non coerente')),
                      NULL::uuid, 'competenza non coerente'
                    );
                  END IF;

                  IF v_resolved_utility_id IS NOT NULL AND v_resolved_utility_id <> v_utility_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente')),
                      NULL::uuid, 'utility non coerente'
                    );
                  END IF;

                  IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account non coerente')),
                      NULL::uuid, 'billing_account non coerente'
                    );
                  END IF;

                  IF p_sorgente_tipo_id IS NOT NULL AND p_sorgente_tipo_id <> v_sorgente_tipo_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','sorgente_tipo non coerente')),
                      NULL::uuid, 'sorgente_tipo non coerente'
                    );
                  END IF;

                  IF v_resolved_emittente_id IS NOT NULL AND v_resolved_emittente_id <> v_emittente_id THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente non coerente')),
                      NULL::uuid, 'emittente non coerente'
                    );
                  END IF;

                  IF v_stato_lotto = 'IN_ESECUZIONE' AND v_stato_operativo = 'CHIUSO' THEN
                    PERFORM script.fn_log_and_raise_error(
                      'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                      jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',p_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto in esecuzione non riutilizzabile per stato_operativo','stato_operativo',v_stato_operativo)),
                      NULL::uuid, 'lotto in esecuzione non riutilizzabile'
                    );
                  END IF;

                  RETURN p_lotto_id;
                END IF;

                IF p_lock_batch_id IS NOT NULL THEN
                  SELECT id, competenza_mese, utility_id, billing_account_id, sorgente_tipo_id,
                         emittente_soggetto_ruolo_id, stato_lotto, stato_operativo
                    INTO v_lotto_id, v_competenza, v_utility_id, v_billing_account_id, v_sorgente_tipo_id,
                         v_emittente_id, v_stato_lotto, v_stato_operativo
                    FROM vendite.attivita_fatturabili_lotti
                   WHERE lock_batch_id = p_lock_batch_id
                   ORDER BY id DESC
                   LIMIT 1;

                  IF v_lotto_id IS NOT NULL THEN
                    IF p_competenza_mese IS NOT NULL AND date_trunc('month', p_competenza_mese)::date <> v_competenza THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza non coerente')),
                        NULL::uuid, 'competenza non coerente'
                      );
                    END IF;

                    IF v_resolved_utility_id IS NOT NULL AND v_resolved_utility_id <> v_utility_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','utility non coerente')),
                        NULL::uuid, 'utility non coerente'
                      );
                    END IF;

                    IF p_billing_account_id IS NOT NULL AND p_billing_account_id <> v_billing_account_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','billing_account non coerente')),
                        NULL::uuid, 'billing_account non coerente'
                      );
                    END IF;

                    IF p_sorgente_tipo_id IS NOT NULL AND p_sorgente_tipo_id <> v_sorgente_tipo_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','sorgente_tipo non coerente')),
                        NULL::uuid, 'sorgente_tipo non coerente'
                      );
                    END IF;

                    IF v_resolved_emittente_id IS NOT NULL AND v_resolved_emittente_id <> v_emittente_id THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','emittente non coerente')),
                        NULL::uuid, 'emittente non coerente'
                      );
                    END IF;

                    IF v_stato_lotto = 'IN_ESECUZIONE' AND v_stato_operativo = 'CHIUSO' THEN
                      PERFORM script.fn_log_and_raise_error(
                        'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                        jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',v_lotto_id,'fattura_id',NULL,'context',jsonb_build_object('detail','lotto in esecuzione non riutilizzabile per stato_operativo','stato_operativo',v_stato_operativo)),
                        NULL::uuid, 'lotto in esecuzione non riutilizzabile'
                      );
                    END IF;

                    RETURN v_lotto_id;
                  END IF;
                END IF;

                IF p_competenza_mese IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_or_create_lotto_attivita', 'E_GENERICO',
                    jsonb_build_object('scope','ATTIVITA_FATTURABILI','severity','C','code','E_GENERICO','lotto_id',NULL,'fattura_id',NULL,'context',jsonb_build_object('detail','competenza_mese obbligatoria in creazione lotto')),
                    NULL::uuid, 'competenza_mese obbligatoria in creazione lotto'
                  );
                END IF;

                INSERT INTO vendite.attivita_fatturabili_lotti (
                  lock_batch_id,
                  competenza_mese,
                  utility_id,
                  billing_account_id,
                  sorgente_tipo_id,
                  stato_lotto,
                  stato_operativo,
                  emittente_soggetto_ruolo_id,
                  meta
                )
                VALUES (
                  COALESCE(p_lock_batch_id, uuidv7()),
                  date_trunc('month', p_competenza_mese)::date,
                  COALESCE(v_resolved_utility_id, p_utility_id),
                  p_billing_account_id,
                  p_sorgente_tipo_id,
                  'IN_ESECUZIONE',
                  'APERTO',
                  v_resolved_emittente_id,
                  COALESCE(p_meta, '{}'::jsonb)
                )
                RETURNING id INTO v_lotto_id;

                RETURN v_lotto_id;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_or_create_lotto_attivita(bigint, date, integer, bigint, bigint, uuid, jsonb, bigint)
              IS 'Recupera o crea lotto attivita usando helper condiviso per coerenza utility/emittente fiscale.';
