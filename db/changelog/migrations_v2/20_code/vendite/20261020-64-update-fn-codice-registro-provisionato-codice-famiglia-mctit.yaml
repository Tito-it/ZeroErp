# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — L2c-1 (decisa da Tid il 2026-10-20: (a)):
#   il codice di un registro provvisionato e' il codice della famiglia, non le sue tre
#   prime lettere.
#   Brief: brief-db-grammatica-unica-documenti §13.3-bis.
#
#   «Prime tre lettere + id dell'emittente» era unico solo finche' le famiglie avevano
#   iniziali diverse: con i codici delle sorgenti ORDINE_ACQUISTO e ORDINE_VENDITA danno
#   entrambe ORD. Il codice intero della famiglia e' unico (e' la PK naturale della famiglia),
#   leggibile e uguale su ogni installazione. Non entra piu' nei 16 caratteri: la colonna si
#   allarga nel 20261020-74. I registri gia' provvisionati su dbdev prendono il codice nuovo
#   con lo SQL una tantum del giro (lo standard della FATTURA si riconosce solo dal codice).
#   Firma e RETURNS ancorati.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261020-64-update-fn-codice-registro-provisionato-codice-famiglia-mctit.yaml

  - changeSet:
      id: 20261020-64-update-fn-codice-registro-provisionato-codice-famiglia
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_codice_registro_provisionato: <codice della famiglia>-<id dell'emittente> al posto delle prime tre lettere; firma ancorata. Grammatica unica, L2c-1 (a).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_codice_registro_provisionato(
                  p_famiglia_documento          vendite.famiglie_documento.codice_interno%TYPE,
                  p_emittente_soggetto_ruolo_id vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE)
               RETURNS vendite.registri_fatturazione.codice%TYPE
               LANGUAGE sql
               IMMUTABLE
              AS $function$
              -- rev 2026-10-20 (20261020-64, brief-db-grammatica-unica-documenti L2c-1):
              --   il codice intero della famiglia, non le prime tre lettere; firma ancorata.
                  -- ⚠️ Il codice INTERO della famiglia + id dell'emittente:
                  --   deterministico e unico per costruzione (il codice della
                  --   famiglia e' unico, l'emittente pure). Rev 2026-10-20
                  --   (L2c-1): erano le prime tre lettere, che collidono fra
                  --   ORDINE_VENDITA e ORDINE_ACQUISTO. ⛔ NON la sigla
                  --   dell'emittente: troncarla su una UNIQUE trasformerebbe
                  --   due sigle simili in una collisione. La parte parlante sta
                  --   nella descrizione.
                  SELECT p_famiglia_documento || '-' || p_emittente_soggetto_ruolo_id::text;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_codice_registro_provisionato(vendite.famiglie_documento.codice_interno%TYPE, vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE) IS
                'La regola del CODICE di un registro nato dal provisioning: prime tre lettere della famiglia, un trattino, l''id del soggetto_ruolo dell''emittente (es. DDT-123, FAT-123). Deterministica e unica per costruzione, dentro i 16 caratteri della colonna; mai la sigla dell''emittente (varchar(32), troncata su una UNIQUE farebbe collidere due sigle simili). ⭐ Esce dalla primitiva vendite.fn_provision_registri il 2026-10-18 (20261019-08) perche'' serve tre volte: i registri delle famiglie, il registro standard delle fatture, e il RITROVARLO per collegargli le coppie (tipo documento, natura). R-BE-14, brief-db-processi-accensione-per-ambiente §6.14. Rev 2026-10-20 (20261020-64, brief-db-grammatica-unica-documenti L2c-1): <codice della famiglia>-<id dell''emittente> (ORDINE_ACQUISTO-31848), non piu'' le prime tre lettere, che collidevano fra famiglie con le stesse iniziali.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_codice_registro_provisionato(p_famiglia_documento character varying, p_emittente_soggetto_ruolo_id bigint)
               RETURNS character varying
               LANGUAGE sql
               IMMUTABLE
              AS $function$
                  -- ⚠️ Prime tre lettere della famiglia + id dell'emittente:
                  --   deterministico, unico per costruzione, e dentro i 16
                  --   caratteri della colonna. ⛔ NON la sigla
                  --   dell'emittente: e' varchar(32) contro 16, e troncarla
                  --   su una UNIQUE trasformerebbe due sigle simili in una
                  --   collisione. La parte parlante sta nella descrizione.
                  SELECT left(p_famiglia_documento, 3) || '-' || p_emittente_soggetto_ruolo_id::text;
              $function$;

              COMMENT ON FUNCTION vendite.fn_codice_registro_provisionato(character varying,bigint) IS
                'La regola del CODICE di un registro nato dal provisioning: prime tre lettere della famiglia, un trattino, l''id del soggetto_ruolo dell''emittente (es. DDT-123, FAT-123). Deterministica e unica per costruzione, dentro i 16 caratteri della colonna; mai la sigla dell''emittente (varchar(32), troncata su una UNIQUE farebbe collidere due sigle simili). ⭐ Esce dalla primitiva vendite.fn_provision_registri il 2026-10-18 (20261019-08) perche'' serve tre volte: i registri delle famiglie, il registro standard delle fatture, e il RITROVARLO per collegargli le coppie (tipo documento, natura). R-BE-14, brief-db-processi-accensione-per-ambiente §6.14.';
