# ------------------------------------------------------------
# EMITTENTE E UTILITY FERMI SEMPRE: tre montaggi del lock di testata
#   preventivi, offerte_commerciali, contratti
#   Brief: brief-db-indirizzi-documento-seguono-il-cliente (§8.7; B-4 ed E-3 di Tid)
#
# -- LA REGOLA ---------------------------------------------------------
#   «Emittente e utility di un documento non si cambiano in modifica: si
#   cambia il cliente, dentro la stessa utility.» Fino a oggi la diceva solo
#   il backend, in tre modi diversi (§8.7.1); il DB fermava le due colonne
#   solo fuori bozza. Da qui sono ferme in ogni stato, bozza compresa: terna
#   con '-' (grammatica 20261018-65, decisione -66).
#
# -- I CODICI ----------------------------------------------------------
#   utility_id            E_DOC_UTILITY_IMMUTABILE    (era E_DOC_CLIENTE_FUORI_BOZZA)
#   emittente_fiscale_id  E_DOC_EMITTENTE_IMMUTABILE  (era E_DOC_EMITTENTE_FUORI_BOZZA)
#   Codici nuovi, CONFLITTO_STATO come la famiglia dei lock: la frase di
#   prima diceva «si sceglie solo in bozza», che qui e' falso. DDT, reso e
#   ordine tengono i loro codici.
#
# -- PERCHE' NEL MONTAGGIO DEL LOCK DI TESTATA ---------------------------
#   * la capability legge non_editable_fields da questo montaggio
#     (script.fn_doc_testata_in_stato): la colonna ferma arriva al form senza
#     una seconda lista (il preventivo ritira la sua nel -68);
#   * fascia _a05_: l'immutabilita' parla prima dei guard sul valore nuovo
#     (trg_*_a10_guard_emittente_ba, _guard_emittente_scope, e sul preventivo
#     _guard_utility_istanza_coerenza), che risponderebbero con un rimedio
#     che non e' il rimedio. Il registro dei lock di colonna genera
#     trg_*_a10_lock_columns_upd, che parlerebbe dopo di loro.
#
# -- CHI SCRIVE LE DUE COLONNE IN UPDATE (censito il 2026-10-18) ----------
#   Nessun verbo e nessun trigger del DB (corpi della doc auto-generata):
#   l'emittente lo scrive solo trgfn_default_emittente_fiscale, in INSERT.
#   pgTAP: test-fornitura-documento-segue-cliente-v1 (test 12, il contratto
#   portato su un'altra utility), riscritto in questo giro. Backend:
#   offerte_service (UPDATE_KEYS_OFFERTA ha le due colonne) e' la ricaduta
#   del §8.7.3; un UPDATE allo stesso valore passa (il lock guarda il cambio).
#
#   Montaggi: gli argomenti del vivo (doc auto-generata, = 20261010-68), con
#   le due terne cambiate. DDL scritta a mano, non da ci_apply (§11.5).
#   COMMENT della funzione del trigger: vivo, con la rev in coda.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261018-67-update-lock-testata-emittente-utility-ferme-mctit.yaml

  - changeSet:
      id: 20261018-67-update-lock-testata-emittente-utility-ferme
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Lock di testata di preventivo, offerta e contratto: utility_id ed emittente_fiscale_id fermi sempre,
        anche in bozza (E_DOC_UTILITY_IMMUTABILE, E_DOC_EMITTENTE_IMMUTABILE). Brief:
        brief-db-indirizzi-documento-seguono-il-cliente (§8.7).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "3"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_trigger t
                   WHERE t.tgfoid = 'vendite.trgfn_doc_testata_lock_fuori_bozza'::regproc
                     AND t.tgname IN ('trg_preventivi_a05_lock_fuori_bozza_upd',
                                      'trg_offerte_commerciali_a05_lock_fuori_bozza_upd',
                                      'trg_contratti_a05_lock_fuori_bozza_upd')
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*)
                   WHERE script.fn_doc_lock_colonna_bloccata(
                           script.fn_doc_lock_regola('TESTATA', ARRAY['X', 'B', 'c', 'E_X', '-']),
                           'B', ARRAY['c']) = 'c'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER trg_preventivi_a05_lock_fuori_bozza_upd ON vendite.preventivi;

              CREATE TRIGGER trg_preventivi_a05_lock_fuori_bozza_upd
                BEFORE UPDATE ON vendite.preventivi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza(
                    'PREVENTIVO', 'DRAFT',
                    'data', 'E_DOC_IDENTITA_FUORI_BOZZA', '',
                    'valuta_id', 'E_DOC_IDENTITA_FUORI_BOZZA', '',
                    'rev', 'E_DOC_IDENTITA_FUORI_BOZZA', '',
                    'billing_account_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '',
                    'istanza_utility_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '',
                    'utility_id', 'E_DOC_UTILITY_IMMUTABILE', '-',
                    'emittente_fiscale_id', 'E_DOC_EMITTENTE_IMMUTABILE', '-',
                    'termine_pagamento_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'validita_dal', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'validita_al', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'competenza_mese', 'E_DOC_CONDIZIONI_FUORI_BOZZA', 'EMESSO,ACCETTATO',
                    'meta', 'E_DOC_CHIUSO', 'EMESSO,ACCETTATO');

              COMMENT ON TRIGGER trg_preventivi_a05_lock_fuori_bozza_upd ON vendite.preventivi IS
                'Il preventivo fuori bozza (D-3, D-6, D-7, D-9, D-8/D-10): identita'', cliente e condizioni bloccati; competenza_mese aperta in EMESSO e ACCETTATO (si sceglie accettando, D-9), le note pure; fermi in EVASO, RIFIUTATO, SCADUTO, ANNULLATO. Utility ed emittente fermi sempre, anche in bozza (B-4 di Tid, terna con ''-''): si cambia il cliente dentro la stessa utility. fatturazione_immediata la governa il guard di commessa. Building block vendite.trgfn_doc_testata_lock_fuori_bozza, terne (colonna, codice, stati aperti). Brief: brief-db-testata-dopo-emissione (fase 2); brief-db-indirizzi-documento-seguono-il-cliente (§8.7).';

              DROP TRIGGER trg_offerte_commerciali_a05_lock_fuori_bozza_upd ON vendite.offerte_commerciali;

              CREATE TRIGGER trg_offerte_commerciali_a05_lock_fuori_bozza_upd
                BEFORE UPDATE ON vendite.offerte_commerciali
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza(
                    'OFFERTA', 'BOZZA',
                    'valuta_id', 'E_DOC_IDENTITA_FUORI_BOZZA', '',
                    'billing_account_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '',
                    'istanza_utility_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '',
                    'utility_id', 'E_DOC_UTILITY_IMMUTABILE', '-',
                    'emittente_fiscale_id', 'E_DOC_EMITTENTE_IMMUTABILE', '-',
                    'listino_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'listino_versione_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'tipo_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'valore_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'validita_dal', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'validita_al', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'meta', 'E_DOC_CHIUSO', 'EMESSA,ACCETTATA',
                    'motivazione_rifiuto', 'E_DOC_CHIUSO', 'EMESSA,ACCETTATA');

              COMMENT ON TRIGGER trg_offerte_commerciali_a05_lock_fuori_bozza_upd ON vendite.offerte_commerciali IS
                'L''offerta fuori bozza (D-3, D-6, D-7, D-8/D-10): valuta, cliente e condizioni (listino, variazioni, validita'') bloccati; note e motivazione del rifiuto aperte in EMESSA e ACCETTATA, ferme in RIFIUTATA, SUPERATA, ANNULLATA. Utility ed emittente fermi sempre, anche in bozza (E-3 di Tid, terna con ''-''): si cambia il cliente dentro la stessa utility. listino_versione_id la congela l''emissione, dalla bozza. Building block vendite.trgfn_doc_testata_lock_fuori_bozza, terne (colonna, codice, stati aperti). Brief: brief-db-testata-dopo-emissione (fase 2); brief-db-indirizzi-documento-seguono-il-cliente (§8.7).';

              DROP TRIGGER trg_contratti_a05_lock_fuori_bozza_upd ON vendite.contratti;

              CREATE TRIGGER trg_contratti_a05_lock_fuori_bozza_upd
                BEFORE UPDATE ON vendite.contratti
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza(
                    'CONTRATTO', 'DRAFT',
                    'data', 'E_DOC_IDENTITA_FUORI_BOZZA', '',
                    'valuta_id', 'E_DOC_IDENTITA_FUORI_BOZZA', '',
                    'billing_account_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '',
                    'istanza_utility_id', 'E_DOC_CLIENTE_FUORI_BOZZA', '',
                    'utility_id', 'E_DOC_UTILITY_IMMUTABILE', '-',
                    'emittente_fiscale_id', 'E_DOC_EMITTENTE_IMMUTABILE', '-',
                    'listino_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'listino_versione_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'tipo_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'valore_variazione_globale', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'ambito', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'valido_dal', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'parent_contratto_id', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'categoria_cliente_id_snapshot', 'E_DOC_CONDIZIONI_FUORI_BOZZA', '',
                    'offerta_id', 'E_DOC_SORGENTE_FUORI_BOZZA', '',
                    'sorgente_tipo_id', 'E_DOC_SORGENTE_FUORI_BOZZA', '',
                    'sorgente_uid', 'E_DOC_SORGENTE_FUORI_BOZZA', '',
                    'valido_al', 'E_DOC_CHIUSO', 'ATTIVO',
                    'codice_cig', 'E_DOC_CHIUSO', 'ATTIVO',
                    'codice_cup', 'E_DOC_CHIUSO', 'ATTIVO',
                    'codice_commessa', 'E_DOC_CHIUSO', 'ATTIVO',
                    'meta', 'E_DOC_CHIUSO', 'ATTIVO');

              COMMENT ON TRIGGER trg_contratti_a05_lock_fuori_bozza_upd ON vendite.contratti IS
                'Il contratto fuori bozza (D-3, D-5, D-6, D-7, D-8/D-10): identita'', cliente, condizioni (comprese le quattro di pricing, dal lock post-attivazione ritirato, e la categoria cliente congelata) e sorgente bloccati; valido_al, CIG, CUP, codice commessa e note aperti in ATTIVO, fermi in CESSATO e ANNULLATO. Utility ed emittente fermi sempre, anche in bozza (B-4 di Tid, terna con ''-''): si cambia il cliente dentro la stessa utility. Parla prima del guard del listino (_a05_ < _a10_). Building block vendite.trgfn_doc_testata_lock_fuori_bozza, terne (colonna, codice, stati aperti). Brief: brief-db-testata-dopo-emissione (fase 2); brief-db-indirizzi-documento-seguono-il-cliente (§8.7).';

              COMMENT ON FUNCTION vendite.trgfn_doc_testata_lock_fuori_bozza()
              IS 'Building block (2026-10-09, brief-db-esecutivi-ba-coppia): una colonna della TESTATA di un documento si sceglie solo finche'' il documento e'' in bozza. BEFORE UPDATE FOR EACH ROW, TG_ARGV = [0] tipo documento per script.fn_get_stato_testata_documento, [1] codice_interno dello stato bozza, [2..] coppie (colonna, codice errore) come script.trgfn_lock_columns. Decide lo stato VECCHIO, letto dal lettore SECURITY DEFINER dentro il BEFORE ROW: l''UPDATE che esce dalla bozza scegliendo la colonna e'' legittimo. Si legge lo stato solo se una colonna bloccata cambia (confronto to_jsonb). Solleva il codice della PRIMA colonna che cambia, nell''ordine degli argomenti; VARIADIC: lo stato; nel contesto etichetta, colonna, valore_da, valore_a. Montaggio errato (evento diverso da UPDATE, argomenti spaiati, colonna che la testata non ha): E_DOC_RIGHE_LOCK_MONTAGGIO, come il gemello delle righe vendite.trgfn_doc_righe_lock_fuori_bozza. Si monta in fascia _a05_: l''immutabilita'' parla prima dei guard sul valore nuovo. Regola del 2: ritira vendite.trgfn_ddt_guard_causale_immutabile e il punto 1 di vendite.trgfn_ddt_guard_magazzino e di vendite.trgfn_resi_guard_magazzino. Adottanti: vendite.ddt (causale, cliente, magazzino), vendite.resi (magazzino). Dal 2026-10-09 (20261009-86…-92, brief-db-esecutivi-ba-coppia) anche l''emittente (emittente_fiscale_id, E_DOC_EMITTENTE_FUORI_BOZZA) su ddt, resi, ordini, offerte_commerciali, contratti e preventivi: adottanti vendite.ddt, vendite.resi, vendite.ordini, vendite.offerte_commerciali, vendite.contratti, vendite.preventivi. rev 2026-10-10 (brief-db-testata-dopo-emissione fase 1, R-1): la grammatica degli argomenti e la decisione escono dal corpo in due building block condivisi col lettore del montaggio. script.fn_doc_lock_regola legge TG_ARGV (le coppie diventano colonne con il loro codice e gli stati in cui restano aperte fuori bozza: per le coppie nessuno); script.fn_doc_lock_colonna_bloccata decide quale colonna nominata, fra quelle che cambiano, lo stato vecchio non lascia cambiare (la prima nell''ordine del montaggio). Se nessuna colonna nominata cambia lo stato non si legge (la decisione con lo stato NULL). Le stesse due le usa script.fn_doc_lock_montaggi: lock e capability leggono lo stesso montaggio con la stessa grammatica. La forma per stato della testata (D-8, fase 2) si aggiunge alla grammatica, e trigger e lettore la seguono insieme. Codici, contesto e valori invariati; la frase del montaggio sbagliato dice l''evento (si monta BEFORE UPDATE) o gli argomenti attesi. rev 2026-10-10 (fase 2): le coppie diventano terne (colonna, codice, stati in cui resta aperta fuori bozza); la colonna nominata si ferma se lo stato vecchio non e'' la bozza ne'' uno dei suoi stati. Famiglie del brief: identita'' (E_DOC_IDENTITA_FUORI_BOZZA), condizioni (E_DOC_CONDIZIONI_FUORI_BOZZA), cliente (E_DOC_CLIENTE_FUORI_BOZZA, e i codici di bolla e reso), sorgente (E_DOC_SORGENTE_FUORI_BOZZA), emittente, e le colonne aperte che si fermano a documento chiuso (E_DOC_CHIUSO). Sul contratto assorbe vendite.trgfn_contratti_lock_post_attivazione (ritirato). rev 2026-10-18 (brief-db-indirizzi-documento-seguono-il-cliente §8.7, B-4 ed E-3 di Tid): una terna puo'' dire ''-'' al posto degli stati, la colonna e'' ferma sempre, bozza compresa (script.fn_doc_lock_regola, script.fn_doc_lock_colonna_bloccata). Il corpo non cambia: lo stato si legge solo se una colonna nominata cambia, e con lo stato NULL la decisione ferma ogni colonna nominata che cambia, ferma sempre o no. Prime colonne ferme sempre: emittente_fiscale_id (E_DOC_EMITTENTE_IMMUTABILE) e utility_id (E_DOC_UTILITY_IMMUTABILE) di preventivo, offerta e contratto: in bozza si cambia il cliente, dentro la stessa utility e dello stesso emittente. VARIADIC: lo stato, come per le altre.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Manovra di emergenza: i montaggi di prima sono in 20261010-68 (utility
              --   E_DOC_CLIENTE_FUORI_BOZZA, emittente E_DOC_EMITTENTE_FUORI_BOZZA, terne
              --   con stati vuoti). Si rimontano a mano, insieme al -65, -66 e -68.
              SELECT 1;
