# CINQUE VISTE DI VENDITE: IL COMMENT AL PRESENTE
#   Brief: brief-db-stati-documento-dal-vocabolario, giro 5 (R-2), seguito.
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   20261114-07 toglie in_gioco da vendite.vw_lotti_fase e ricrea la catena
#   delle dipendenti con i loro COMMENT come stavano a catalogo. Cinque di
#   quei COMMENT portano storia (brief, «Rev …», id di changeSet, sigle di
#   decisione, misure datate): la §5d di linee-guida-sql dice che il debito
#   si riscrive quando un lavoro riapre gli oggetti, e 07 li riapre. 07 e'
#   gia' applicato e mergiato, quindi non si tocca (il checksum su dbdev non
#   tornerebbe, e un changeSet spento non ri-esegue: dbdev terrebbe il
#   testo vecchio e la CI quello nuovo). La riscrittura sta qui.
#
#   Due COMMENT dicevano anche una cosa falsa: elencavano IN_ATTESA_LOTTO
#   fra i valori di motivo_non_fatturata, ritirato da 20260912-36.
#   Riscritti, danno i tre valori che il CASE produce: GIRO_IN_CORSO,
#   RESIDUO, SENZA_ATTIVITA_FATTURABILE.
#
# ── COME ────────────────────────────────────────────────────────────
#   Solo COMMENT ON VIEW, nessuna definizione cambia. Il rollback rimette
#   i testi che 07 scrive.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-72-update-comment-viste-competenza-al-presente-mctit.yaml

  - changeSet:
      id: 20261114-72-update-comment-viste-competenza-al-presente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I COMMENT di cinque viste di vendite ricreate da 20261114-07 si riscrivono al presente
        (linee-guida-sql §5d): via brief, revisioni, id di changeSet e il valore ritirato
        IN_ATTESA_LOTTO.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_lotti_congelati_con_gruppi_in_errore IS
                  'PRESIDIO. Elenca una contraddizione: un lotto CONGELATO (lo stato fiscale non e'' piu'' pre-fiscale: vendite.vw_lotti_fase.pre_fiscale falso, o ignoto) che contiene documenti dichiarati in ERRORE, qualunque sia stato_lotto. Il fiscale e'' fermo, i documenti non sono nati: non possono stare insieme. DEVE RESTARE VUOTA. ⭐ L''asse e'' lo stato FISCALE, lo stesso di dbops.vw_lotti_fermi_da_guardare: un lotto ancora pre-fiscale con un esito in errore e'' un lotto fermo e lo dice quel presidio; uno congelato lo dice questo. Nessun buco (congelato con stato_lotto IN_ESECUZIONE o ERRORE), nessun doppione (COMPLETATO in bozza). ⭐ Le porte: COMPLETATO su un lotto fermo lo rifiuta il database (trg_fatturazione_lotti_a10_guard_completato_upd); un esito scritto ERRORE dopo il congelamento, o un congelamento con esiti in errore, sono cio'' che questa vista sorveglia. ⭐ Un lotto annullato non compare perche'' l''annullo gli chiude gli esiti (fn_annulla_lotto_da_draft), non per un filtro: la vista non esclude gli annullati, e non deve. Legge vendite.fatturazione_lotti_esiti, quindi vede anche i lotti senza perimetro (i giri di massa). Lettore a catalogo: dbops.vw_lotti_congelati_con_errori_da_guardare.';

              COMMENT ON VIEW vendite.vw_commesse_attivita_emittibilita IS
                  'SEDE UNICA del criterio «questa riga di commessa puo'' entrare in un giro di fatturazione, e se no perche''». Una riga per riga di commessa. Consumatori: vendite.fn_list_emittibili_lane (filtra classe = PRONTA), vendite.fn_list_commesse_emittibili (quali commesse visitare), vendite.fn_emit_attivita_fatturabili_da_commessa (quali righe emettere) e vendite.fn_diagnostica_gruppi_fatturabili (conta per classe).
              ⭐ IL CRITERIO E'' SCRITTO UNA VOLTA SOLA, QUI: la lane lo FILTRA e la diagnostica lo CONTA, ed e'' «lo specchio della lane» solo perche'' leggono la stessa classe. Un criterio aggiunto a uno solo dei due lettori farebbe rispondere alla diagnostica «era pronto» su un documento che la lane non ha offerto, senza nessun errore: per questo non e'' scritto in nessuno dei due.
              ⭐ I DUE FATTORI SONO ORTOGONALI: `classe_emittibilita` descrive la RIGA, `commessa_emittibile` la TESTATA, e chi decide dichiara quali dei due usa. ⛔ Fonderli toglierebbe alla diagnostica la sola cosa che sa dire meglio della lane («le righe sarebbero pronte, e'' la commessa a essere in BOZZA»).
              ⭐ VOCABOLARIO CHIUSO di sei valori: EMESSA · ANNULLATA · RIFIUTATA · NON_APPROVATA · TRATTENUTA · PRONTA.
              ⛔ NON contiene il PERIMETRO DELLA DOMANDA — tetto di competenza, billing account, utility, emittente, corsia, p_gruppi, e l''auto-esclusione del proprio lotto nel pull: quelli dipendono da chi chiede. E'' anche il motivo per cui «fuori competenza» non e'' una classe: quella riga e'' PRONTA, solo non per quel mese.
              ⭐ MA IL LEGAME DI COMPETENZA DEL TRATTENUTO SI'': qui la competenza della riga c''e''. E'' `lotto_competenza_mese >= ca.competenza_mese`, perche'' la selezione e'' CUMULATIVA. ⛔ Non e'' un''uguaglianza: il LATERAL dell''esito su vw_dash_competenza_gruppi lega =, e copiarlo darebbe un blocco piu'' stretto della regola.
              ⚠️ `tipo_doc_fiscale_id IS NOT NULL` non e'' fra i criteri: e'' un ramo irraggiungibile, perche'' chk_commesse_attivita_tipo_doc_emittibile e'' VALIDATO, e i presidi sono i test 9 e 10 di test-diagnostica-gruppi-fatturabili-v1.sql.
              ⚠️ `trattenuta_da_lotti` e'' NULL quando la riga non e'' trattenuta (mai un array vuoto) ed e'' ORDINATO per lotto_id: chi ne vuole uno prende il primo e non scommette.';

              COMMENT ON VIEW vendite.vw_dash_competenza_attivita IS
                  'Lente 1 Competenza, grana ATTIVITA'': una riga per attivita'' di commessa con lo stadio del ciclo (DA_APPROVARE / DA_EMETTERE / EMESSA_NON_FATTURATA / FATTURATA), il valore, il collegamento a fattura e lotto e lo stato della commessa. Alimenta il drill-down commesse, che il backend AGGREGA per commessa. SCOPE EMITTENTE via fn_get_emittenti_scope_sr_ids(GUC): fail-closed. security_invoker=on. ⭐ `emittente_ragione_sociale` si puo'' mettere nel GROUP BY del drill-down in sicurezza: l''emittente e'' una colonna di vendite.commesse e commessa_id ne e'' la chiave primaria, quindi una commessa non puo'' avere attivita'' di emittenti diversi — l''emittente non sta sull''attivita''. La colonna nel GROUP BY serve comunque: su una colonna di VISTA PostgreSQL non deduce la dipendenza funzionale. ⚠️ Due catene distinte sulle stesse tabelle: sr/s sono il CLIENTE (via billing account), sr_ef/s_ef l''EMITTENTE. Scambiarle non darebbe nessun errore, solo un nome sbagliato a video. ⭐ registro_id, registro_codice, politica_data_documento e data_documento_prevista rispondono alle due domande che la schermata da cui si fattura deve saper dire PRIMA di premere: su quale sezionale finira'' il documento, e che data portera''. Il sezionale si risolve chiamando vendite.fn_resolve_registro_documento, cioe'' LA STESSA funzione che usa fn_build_fattura_key quando la fattura nasce davvero: la previsione e'' una lettura, non una profezia, e non puo'' divergere dal documento perche'' non e'' una seconda implementazione. ⚠️ Le si passa co.billing_account_id, il BA della RIGA: la funzione risale al padre da se'', e passarle il BA di fatturazione darebbe una previsione plausibile e sbagliata proprio sui BA con padre. ⛔ L''aggancio e'' CONDIZIONATO — ON (af.fattura_riga_id IS NULL): dove il documento esiste gia'' la previsione non si fa, o la colonna mentirebbe al proprio nome. ⚠️ Il discriminante e'' la riga di fattura e non lo stadio: su EMESSA_NON_FATTURATA il documento non c''e'' ancora — e li'' finiscono le attivita'' rimaste orfane di una fattura eliminata, cioe'' lavoro da ri-emettere, per cui sapere dove finira'' e'' proprio l''informazione utile. ⛔ Il CASE sulla data e'' obbligatorio e non difensivo: fn_calcola_data_documento SOLLEVA su registro nullo, un CASE cortocircuita e un argomento no — senza, la prima riga con un sezionale non risolvibile farebbe morire l''intera lista. ⚠️ registro_codice viene da registri_fatturazione.codice, colonna MUTABILE: e'' display, l''alias e'' fedele alla sorgente (linee-guida-sql §6c) e quella tabella non espone codice_interno. Nessuna logica puo'' appoggiarcisi — chi filtra lo fa su registro_id. ℹ️ Costo dichiarato: due chiamate di funzione per riga su una vista che ne alimenta altre. Tutta la catena e'' STABLE e le tabelle di configurazione lette non hanno RLS. ⛔ attivita_fatturabile_id e'' LA CHIAVE DEL VERBO: vendite.fn_riporta_attivita_da_emettere consuma vendite.attivita_fatturabili.id. Tradurre commessa_attivita_id -> af.id lato backend sarebbe una SECONDA IMPLEMENTAZIONE di un legame che il database conosce gia''. E'' un identificatore, non una colonna da mostrare. ⭐ motivo_non_fatturata e'' LA DIMENSIONE, a vocabolario chiuso di TRE valori e NULL fuori dallo stadio EMESSA_NON_FATTURATA: GIRO_IN_CORSO (lucchettata con stato_esecuzione diverso da COMPLETED, oppure libera col marchio di un lotto ancora pre-fiscale: il transito fra pull e select), RESIDUO (lucchettata e COMPLETED senza riga di fattura, oppure libera col marchio di un lotto non piu'' pre-fiscale o senza marchio: la DIVERGENZA fra i due livelli, che nessun giro riprende. Sono le sole che il verbo tocca) e SENZA_ATTIVITA_FATTURABILE. Il lotto pre-fiscale si legge da vendite.vw_lotti_fase.pre_fiscale, la sede unica, con un EXISTS valutato SOLO su quel ramo del CASE (una lettura per riga libera dello stadio, zero sulle altre). ⛔ Nel vocabolario non c''e'' un «il prossimo giro la prende da se''»: dentro questo stadio e'' falso PER COSTRUZIONE — la riga di commessa e'' EMESSA, il pull non la vede e la select di un altro lotto non trova il suo marchio. Un valore che la vista non puo'' produrre non sta nel vocabolario, e nasconderebbe il verbo proprio sulle righe che nessun giro riprende. ⛔ La dimensione serve perche'' lo stadio guarda SOLO fattura_riga_id, e dentro EMESSA_NON_FATTURATA finiscono situazioni con RIMEDI OPPOSTI: due non chiedono nessuna azione, una si''. ⛔ E NON si spezza il valore EMESSA_NON_FATTURATA in due stadi: lo STADIO dice a che punto del ciclo e'' il lavoro, e le situazioni sono allo STESSO punto — cambia la loro salute, non il loro avanzamento; e'' la stessa forma di tipo_movimento in vendite.vw_dash_competenza_mensile. ⛔ I rami sono, uno per uno, gli stessi di script.fn_check_attivita_riportabile_da_emettere (motivo 5, motivo 4 e «nessun motivo»; il motivo 3 — libera con la riga NON_EMESSA — sta fuori da questo stadio per costruzione): cambiarne uno qui senza cambiarlo li'' non produce nessun errore — la lista proporrebbe il verbo su una riga che la mutazione rifiuta, o lo nasconderebbe su una che accetta. Il presidio che lega le due superfici e'' db/pgtap/vendite/test-motivo-non-fatturata-v1.sql, con una fixture COSTRUITA per ciascun caso. ⛔ IS DISTINCT FROM ''COMPLETED'' e non <>: stato_esecuzione e'' NULLABLE e il CHECK ammette anche ERRORE, quindi con <> un lucchetto a NULL darebbe NULL e il CASE cadrebbe su RESIDUO dove la funzione dice E_ATTIVITA_IN_LAVORAZIONE. ERRORE finisce percio'' in GIRO_IN_CORSO, e il rimedio (aspettare che il lotto si chiuda) e'' lo stesso. ⭐ SENZA_ATTIVITA_FATTURABILE ha un ramo suo perche'' il modello AMMETTE una riga di commessa a EMESSA senza NESSUNA riga in attivita_fatturabili (il JOIN e'' LEFT, e il guard di DELETE ammette per progetto la cancellazione di una riga non fatturata): la pull filtra su stato_emissione e non la riprende mai piu'', e attivita_fatturabile_id e'' NULL, quindi il verbo non ha la chiave. ⛔ NON si usa `fatturato` come discriminante: e'' una colonna GENERATA da fattura_riga_id, quindi dentro EMESSA_NON_FATTURATA e'' sempre falsa e non distingue niente. ⭐ lotto_provenienza_id/_codice rispondono a «da dove viene questo residuo», e NON sono lotto_id: quello nasce dalla catena della FATTURA e su un residuo la fattura non c''e''. Arrivano da vendite.fatturazione_lotti via COALESCE(lock_batch_id, emit_batch_id): un residuo DIVERGENTE il lucchetto non ce l''ha, e la sua provenienza e'' il MARCHIO del giro (emit_batch_id), che e'' il lock_batch_id del lotto che l''ha presa in carico; per un''attivita'' lucchettata i due coincidono. La chiave sul lato lotti e'' lock_batch_id, che li'' ha un UNIQUE — quindi il LEFT JOIN non puo'' moltiplicare righe. LEFT e non INNER perche'' fatturazione_lotti ha la RLS: un lotto fuori perimetro lascia le colonne a NULL e non fa sparire il residuo. lotto_provenienza_codice viene da codice, MUTABILE: e'' display (§6c) e nessuna logica puo'' appoggiarcisi. ⭐ articolo_codice/articolo_descrizione dicono CHE LAVORO E'': articolo_id e'' un UUID, e una lista di residui su cui si deve AGIRE senza il nome del lavoro non e'' azionabile. Il decode e'' lo stesso di vendite.fn_list_commessa_attivita, che lo fa un livello sopra sulla stessa colonna. LEFT anche se articolo_id e'' NOT NULL: un decode non deve poter far sparire la riga che sta decorando, e catalogo.articoli non ha RLS. ℹ️ I due JOIN di decode NON li paga chi non li usa, e la ragione e'' STRUTTURALE: sono LEFT JOIN su chiavi con indice UNIQUE (uq_fatturazione_lotti_lock_batch_id, pk_articoli), quindi PostgreSQL puo'' PROVARE che non moltiplicano le righe e li elimina dal piano quando nessuna delle loro colonne e'' selezionata (left join removal). ⚠️ La condizione che regge tutto e'' il UNIQUE: togliendolo l''eliminazione smetterebbe di essere lecita e la vista comincerebbe a contare doppio — per questo ha un test suo. ⭐ Lo STADIO si calcola UNA volta sola, nella CROSS JOIN LATERAL `st`, e serve sia la colonna stadio sia motivo_non_fatturata: quest''ultima e'' definita SOPRA lo stadio e in SQL un alias di SELECT non e'' riferibile da un''altra espressione della stessa SELECT. Ricopiare il CASE metterebbe la definizione dello stadio in DUE posti della stessa vista, dove divergere non produce nessun errore.';

              COMMENT ON VIEW vendite.vw_dash_competenza_gruppi IS
                  'I documenti da emettere di una competenza, un gruppo per riga, con l''esito dell''ULTIMO tentativo di fatturazione (ultimo_esito, ultimo_errore_codice, ultimo_errore_messaggio, ultimo_errore_quando, ultimo_lotto_codice). L''esito si legge da vendite.fatturazione_lotti_esiti, che c''e'' anche sui giri che non dichiarano un perimetro (i giri di massa): un documento fallito ha il suo segno comunque sia nato il giro. Il segno NON spegne stadio ne'' commessa_emittibile: dice che un tentativo e'' fallito, non che il documento non si possa fatturare. Il legame e'' (documento, mese di competenza): senza il mese, il documento di settembre erediterebbe l''errore di agosto. documento_apribile dice se la sorgente del documento si apre (config.sorgenti.apribile), e il numero del documento si risolve solo quando lo e''.';

              COMMENT ON VIEW vendite.vw_dash_competenza_mensile IS
                  'Lente 1 Competenza, aggregata in FORMATO LUNGO: una riga per (competenza_mese, stadio, stato fattura, tipo_movimento, motivo_non_fatturata). Il pivot alla griglia 12 mesi x 4 stadi e'' del service, non della vista. security_invoker=on: lo scope emittente arriva da vw_dash_competenza_attivita (GUC fail-closed) e va RI-SPECIFICATO a ogni REPLACE, perche'' la reloption non e'' visibile in pg_get_viewdef e verrebbe azzerata in silenzio. ⭐ `tipo_movimento` e'' nel raggruppamento perche'' il valore e'' una somma CON SEGNO: senza, le rettifiche (note di credito da emettere) compenserebbero le fatture da emettere, e il residuo del mese potrebbe dire «niente da fare» con documenti ancora da produrre: la compensazione NASCONDE LAVORO. Lo stesso vale per gli ONERI, che sono un''altra natura nello stesso totale. Per questo e'' una DIMENSIONE e non una colonna `valore_rettifiche`, che metterebbe i valori dell''enum dentro la vista. ⭐ `motivo_non_fatturata` e'' nel raggruppamento per la STESSA ragione e nella STESSA forma. Lo stadio EMESSA_NON_FATTURATA guarda solo fattura_riga_id, e dentro quel valore convivono situazioni con RIMEDI OPPOSTI: dentro un giro vivo (GIRO_IN_CORSO, nessun rimedio: si aspetta), RESIDUO (l''unica su cui «Riporta da emettere» ha effetto) e SENZA_ATTIVITA_FATTURABILE. Un numero solo per rimedi opposti dice all''operatore che c''e'' qualcosa da fare quando non c''e'', o nasconde il lavoro vero dentro un transito sano. ⛔ Dimensione e NON una colonna `n_residui`: quella costringerebbe l''aggregata a conoscere il valore RESIDUO, cioe'' a cablare un elemento del vocabolario dentro una somma. La dimensione non conosce nessun valore: li porta. ⚠️ Le due dimensioni spezzano un bucket in una riga per (tipo_movimento, motivo_non_fatturata): i totali reggono se il consumatore accumula, un breakdown che elenca una voce per riga mostra invece lo stesso stato piu'' volte. ⚠️ Il presidio di grana e'' il test 22 di db/pgtap/vendite/test-fn-list-commessa-attivita-provenienza-v1.sql, che confronta le righe della mensile col GROUP BY del dettaglio: cambiando la grana va portato sulla regola nuova, mai spento.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON VIEW vendite.vw_lotti_congelati_con_gruppi_in_errore IS
                  'PRESIDIO. Elenca una contraddizione: un lotto CONGELATO (lo stato fiscale non e'' piu'' pre-fiscale: vendite.vw_lotti_fase.pre_fiscale falso, o ignoto) che contiene documenti dichiarati in ERRORE, qualunque sia stato_lotto. Il fiscale e'' fermo, i documenti non sono nati: non possono stare insieme. DEVE RESTARE VUOTA. ⭐ L''asse e'' lo stato FISCALE, lo stesso di dbops.vw_lotti_fermi_da_guardare: un lotto ancora pre-fiscale con un esito in errore e'' un lotto fermo e lo dice quel presidio; uno congelato lo dice questo. Nessun buco (congelato con stato_lotto IN_ESECUZIONE o ERRORE), nessun doppione (COMPLETATO in bozza). ⭐ Le porte: COMPLETATO su un lotto fermo lo rifiuta il database (trg_fatturazione_lotti_a10_guard_completato_upd); un esito scritto ERRORE dopo il congelamento, o un congelamento con esiti in errore, sono cio'' che questa vista sorveglia. ⭐ Un lotto annullato non compare perche'' l''annullo gli chiude gli esiti (fn_annulla_lotto_da_draft), non per un filtro: la vista non esclude gli annullati, e non deve. Legge vendite.fatturazione_lotti_esiti, quindi vede anche i lotti senza perimetro (i giri di massa). Lettore a catalogo: dbops.vw_lotti_congelati_con_errori_da_guardare. Fino al 2026-11-07 si chiamava vw_lotti_chiusi_con_gruppi_in_errore e guardava stato_lotto = COMPLETATO (storia: brief-db-esito-gruppo-lotto §15, §24, §25; brief-db-annullamento-chiude-la-vita §9). Brief: brief-db-revisione-dbops, giro 6 (Q14 ⑦).';

              COMMENT ON VIEW vendite.vw_commesse_attivita_emittibilita IS
                  'SEDE UNICA del criterio «questa riga di commessa puo'' entrare in un giro di fatturazione, e se no perche''». Una riga per riga di commessa. Consumatori: vendite.fn_list_emittibili_lane (filtra classe = PRONTA), vendite.fn_list_commesse_emittibili (quali commesse visitare), vendite.fn_emit_attivita_fatturabili_da_commessa (quali righe emettere) e vendite.fn_diagnostica_gruppi_fatturabili (conta per classe).
