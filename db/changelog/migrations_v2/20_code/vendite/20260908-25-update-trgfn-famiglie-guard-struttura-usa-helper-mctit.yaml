# H-2 — Il guard della struttura della famiglia chiama l'helper
#   vendite.trgfn_famiglie_documento_guard_struttura
#   Piano: brief-db-coda-primo-motivo-in-un-posto-solo, sezione 6
#
# -- PERCHE' -------------------------------------------------
#   Il `campo` resta calcolato dalla TESTA — e' il primo che e' cambiato
#   davvero, e mandare l'operatore a correggerne un altro e' peggio che non
#   dirglielo. All'helper si passa il risultato, non la regola.
#
# -- COSA CAMBIA, E COSA NO ----------------------------------
#   Cambia SOLO la coda che solleva il primo motivo della check. La TESTA —
#   quale check chiamare, su quali colonne, con quale confronto di no-op —
#   resta identica, ed e' il §3 del brief: due funzioni che finiscono uguali
#   non sono due funzioni da unire, sono due funzioni che chiamano la stessa
#   cosa.
#   ⛔ Il corpo di partenza e' quello VIVO (pg_get_functiondef), non uno YAML:
#   di questa funzione ci sono piu' revisioni e solo l'ultima conta.
#
# -- IL ROLLBACK --------------------------------------------
#   Rimette il corpo esattamente com'era prima di questo changeSet.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-25-update-trgfn-famiglie-guard-struttura-usa-helper-mctit.yaml

  - changeSet:
      id: 20260908-25-update-trgfn-famiglie-guard-struttura-usa-helper
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il guard della struttura della famiglia chiama l'helper. Il `campo` resta calcolato dalla TESTA
        — e'' il primo che e'' cambiato davvero, e mandare l''operatore a correggerne un altro e''
        peggio che non dirglielo. All''helper si passa il risultato, non la regola. Piano: brief-db-
        coda-primo-motivo-in-un-posto-solo, sezione 6.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_raise_primo_motivo_se_presente';
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite'
                     AND p.proname = 'trgfn_famiglie_documento_guard_struttura';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_famiglie_documento_guard_struttura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- ⛔ NUDI, e non per fretta: `v_motivi` e' il valore di ritorno di una
                  --   fn_check_* (nessuna colonna dietro), e `v_campo` e' il NOME di una
                  --   colonna e non il suo valore — la stessa ragione per cui
                  --   script.fn_log_and_raise_error dichiara `v_campo text` e lo difende
                  --   con un commento. Non c'e' niente da ancorare.
                  v_motivi jsonb;
                  v_campo  text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare il cambio delle colonne che dicono DOVE VIVE
                  --   IL DOCUMENTO — schema_tabella, nome_tabella,
                  --   colonna_numero, colonna_billing_account, colonna_serie —
                  --   su una famiglia che ha gia' dei registri.
                  --
                  -- ⛔ Perche': quelle colonne non descrivono la famiglia, la
                  --   fanno funzionare. Il caso peggiore e' colonna_serie
                  --   portata a NULL: da quel momento i registri che una serie
                  --   ce l'hanno restano con un secchio del contatore che il
                  --   documento non sa piu' distinguere, e nessun vincolo se
                  --   ne accorge.
                  --
                  -- ⭐ §12.5.2: QUI NON C'E' IL PREDICATO. Si chiama
                  --   script.fn_check_famiglia_documento_struttura_modificabile
                  --   e si solleva il codice del primo motivo.
                  -- =========================================================

                  -- ⭐ IL NO-OP PASSA, ed e' la riga che tiene in piedi il
                  --   migrate: i due mirror CSV riscrivono queste colonne a
                  --   OGNI migrate con gli stessi valori, e `UPDATE OF` scatta
                  --   comunque perche' e' lo statement a nominarle.
                  IF NEW.schema_tabella          IS NOT DISTINCT FROM OLD.schema_tabella
                     AND NEW.nome_tabella            IS NOT DISTINCT FROM OLD.nome_tabella
                     AND NEW.colonna_numero          IS NOT DISTINCT FROM OLD.colonna_numero
                     AND NEW.colonna_billing_account IS NOT DISTINCT FROM OLD.colonna_billing_account
                     AND NEW.colonna_serie           IS NOT DISTINCT FROM OLD.colonna_serie THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_famiglia_documento_struttura_modificabile(OLD.id);

                  -- Nessun motivo: la famiglia non ha ancora registri, la
                  -- struttura si cambia liberamente.
                  IF v_motivi IS NULL OR jsonb_array_length(v_motivi) = 0 THEN
                      RETURN NEW;
                  END IF;

                  -- ⚠️ Il campo da accendere nel form e' il PRIMO che e'
                  --   cambiato davvero, non uno fisso: l'operatore ne ha
                  --   toccato uno, e mandarlo a correggerne un altro e' peggio
                  --   che non dirglielo.
                  v_campo := CASE
                      WHEN NEW.schema_tabella          IS DISTINCT FROM OLD.schema_tabella          THEN 'schema_tabella'
                      WHEN NEW.nome_tabella            IS DISTINCT FROM OLD.nome_tabella            THEN 'nome_tabella'
                      WHEN NEW.colonna_numero          IS DISTINCT FROM OLD.colonna_numero          THEN 'colonna_numero'
                      WHEN NEW.colonna_billing_account IS DISTINCT FROM OLD.colonna_billing_account THEN 'colonna_billing_account'
                      ELSE 'colonna_serie'
                  END;

                  -- ⭐ La coda sta in un posto solo (20260908-17): quale motivo si solleva,
                  --   come si spacchettano i valori e come si compone il contesto li decide
                  --   l'helper. Qui resta la TESTA — quale check chiamare, su cosa.
                  -- ⚠️ `NULL::uuid` e non NEW.tx_id: questo guard sta su un trigger `_a10_`
                  --   che, confrontato per NOME INTERO, precede `..._gen_tx_id_ins_upd`
                  --   ('a10' < 'gen'), quindi la transazione non e' ancora assegnata.
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', 'trgfn_famiglie_documento_guard_struttura',
                      v_motivi,
                      v_campo,
                      NULL::uuid);

                  -- ⭐ Ora RAGGIUNGIBILE, ed e' il ramo «passa»: l'helper tace quando la
                  --   check non ha trovato nessun motivo.
                  RETURN NEW;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_famiglie_documento_guard_struttura()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_motivi jsonb;
                  v_primo  jsonb;
                  v_campo  text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rifiutare il cambio delle colonne che dicono DOVE VIVE
                  --   IL DOCUMENTO — schema_tabella, nome_tabella,
                  --   colonna_numero, colonna_billing_account, colonna_serie —
                  --   su una famiglia che ha gia' dei registri.
                  --
                  -- ⛔ Perche': quelle colonne non descrivono la famiglia, la
                  --   fanno funzionare. Il caso peggiore e' colonna_serie
                  --   portata a NULL: da quel momento i registri che una serie
                  --   ce l'hanno restano con un secchio del contatore che il
                  --   documento non sa piu' distinguere, e nessun vincolo se
                  --   ne accorge.
                  --
                  -- ⭐ §12.5.2: QUI NON C'E' IL PREDICATO. Si chiama
                  --   script.fn_check_famiglia_documento_struttura_modificabile
                  --   e si solleva il codice del primo motivo.
                  -- =========================================================

                  -- ⭐ IL NO-OP PASSA, ed e' la riga che tiene in piedi il
                  --   migrate: i due mirror CSV riscrivono queste colonne a
                  --   OGNI migrate con gli stessi valori, e `UPDATE OF` scatta
                  --   comunque perche' e' lo statement a nominarle.
                  IF NEW.schema_tabella          IS NOT DISTINCT FROM OLD.schema_tabella
                     AND NEW.nome_tabella            IS NOT DISTINCT FROM OLD.nome_tabella
                     AND NEW.colonna_numero          IS NOT DISTINCT FROM OLD.colonna_numero
                     AND NEW.colonna_billing_account IS NOT DISTINCT FROM OLD.colonna_billing_account
                     AND NEW.colonna_serie           IS NOT DISTINCT FROM OLD.colonna_serie THEN
                      RETURN NEW;
                  END IF;

                  v_motivi := script.fn_check_famiglia_documento_struttura_modificabile(OLD.id);

                  -- Nessun motivo: la famiglia non ha ancora registri, la
                  -- struttura si cambia liberamente.
                  IF v_motivi IS NULL OR jsonb_array_length(v_motivi) = 0 THEN
                      RETURN NEW;
                  END IF;

                  v_primo := v_motivi -> 0;

                  -- ⚠️ Il campo da accendere nel form e' il PRIMO che e'
                  --   cambiato davvero, non uno fisso: l'operatore ne ha
                  --   toccato uno, e mandarlo a correggerne un altro e' peggio
                  --   che non dirglielo.
                  v_campo := CASE
                      WHEN NEW.schema_tabella          IS DISTINCT FROM OLD.schema_tabella          THEN 'schema_tabella'
                      WHEN NEW.nome_tabella            IS DISTINCT FROM OLD.nome_tabella            THEN 'nome_tabella'
                      WHEN NEW.colonna_numero          IS DISTINCT FROM OLD.colonna_numero          THEN 'colonna_numero'
                      WHEN NEW.colonna_billing_account IS DISTINCT FROM OLD.colonna_billing_account THEN 'colonna_billing_account'
                      ELSE 'colonna_serie'
                  END;

                  -- ⚠️ tx_id NULL e non NEW.tx_id: questo guard e' `_a10_` e
                  --   scatta PRIMA di trg_famiglie_documento_gen_tx_id_ins_upd
                  --   (ordine alfabetico: 'a10' < 'gen'), quindi NEW.tx_id qui
                  --   porta ancora il valore vecchio.
                  PERFORM script.fn_log_and_raise_error(
                      'vendite',
                      'trgfn_famiglie_documento_guard_struttura',
                      v_primo ->> 'codice',
                      COALESCE(v_primo -> 'dettaglio', '{}'::jsonb)
                          || jsonb_build_object('campo', v_campo),
                      NULL::uuid,
                      VARIADIC ARRAY(SELECT jsonb_array_elements_text(v_primo -> 'valori')));

                  -- Irraggiungibile: la riga sopra solleva sempre.
                  RETURN NEW;
              END;
              $function$;
