# IL CRUSCOTTO DEI PREVENTIVI: IL MOTIVO DEL FERMO DAL VOCABOLARIO
#   Brief: brief-db-stati-documento-dal-vocabolario §6.15, giro 6a (S-2,
#   Tid 2026-11-08; via ai giri di Tid del 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.vw_dash_fatturazione_preventivi dava motivo_fermo DOC_BOZZA con
#   codice_interno = 'DRAFT' e IN_ATTESA_ACCETTAZIONE con codice_interno =
#   'EMESSO': lo stato iniziale e lo stato di emissione, che il vocabolario
#   dichiara gia' in colonna. Ora: sdp.iniziale, sdp.emissione, come
#   l'offerta (20261112-63). esito NEGATIVO resta: e' un valore del
#   vocabolario degli esiti, non un codice di stato.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE VIEW con le stesse colonne, nello stesso ordine e dello
#   stesso tipo: la consuma vendite.vw_dash_fatturazione_documenti, che non
#   si tocca. Le due colonne del vocabolario entrano nel GROUP BY, che elenca
#   le colonne di sdp una per una: una per stato, quindi le righe non cambiano.
#   WITH (security_invoker = on) si ripete: un CREATE OR REPLACE senza opzioni
#   le azzera. GRANT e COMMENT di colonna restano. Il COMMENT della vista, che
#   portava una cronaca, e' riscritto al presente.
#
# ── DA DOVE VIENE LA DEFINIZIONE ────────────────────────────────────
#   pg_get_viewdef su dbdev (search_path = pg_catalog), 2026-11-14. Il
#   rollback porta la definizione, le opzioni e il COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-12-update-vw-dash-fatturazione-preventivi-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261114-12-update-vw-dash-fatturazione-preventivi-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.vw_dash_fatturazione_preventivi: motivo_fermo DOC_BOZZA e IN_ATTESA_ACCETTAZIONE
        dalle colonne iniziale ed emissione del vocabolario, non dai codici. Stesse colonne,
        security_invoker ripetuto. Brief: brief-db-stati-documento-dal-vocabolario, giro 6a.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_preventivi WITH (security_invoker = on) AS
               WITH righe AS (
                       SELECT sr.preventivo_id,
                          sr.riga_id,
                          script.fn_imponibile_riga(COALESCE(sr.quantita, 0::numeric), sr.prezzo_unitario, pr.sconto_percentuale) AS valore_riga,
                          sr.stato_smistamento <> 'RESIDUA'::text AS transitata
                         FROM vendite.vw_preventivi_smistamento_righe sr
                           JOIN vendite.preventivi_righe pr ON pr.id = sr.riga_id
                      )
               SELECT 'PREVENTIVO'::character varying AS area,
                  COALESCE(p.competenza_mese, date_trunc('month'::text, p.validita_dal::timestamp with time zone)::date, date_trunc('month'::text, p.data::timestamp with time zone)::date) AS competenza_mese,
                  p.id AS documento_id,
                  p.uid::text AS documento_uid,
                  p.numero::text AS codice,
                  p.emittente_fiscale_id,
                  NULL::bigint AS emittente_soggetto_ruolo_id,
                  COALESCE(sum(r.valore_riga), 0::numeric) AS valore_totale,
                  COALESCE(sum(r.valore_riga) FILTER (WHERE r.transitata), 0::numeric) AS valore_transitato,
                  count(r.riga_id)::integer AS unita_totali,
                  count(r.riga_id) FILTER (WHERE r.transitata)::integer AS unita_transitate,
                  count(r.riga_id) > 0 AND count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata) AS is_transitato,
                  COALESCE(sdp.esito::text = 'NEGATIVO'::text, false) AS is_abortito,
                      CASE
                          WHEN COALESCE(sdp.esito::text = 'NEGATIVO'::text, false) THEN NULL::text
                          WHEN count(r.riga_id) > 0 AND count(r.riga_id) = count(r.riga_id) FILTER (WHERE r.transitata) THEN NULL::text
                          WHEN sdp.iniziale THEN 'DOC_BOZZA'::text
                          WHEN sdp.emissione THEN 'IN_ATTESA_ACCETTAZIONE'::text
                          ELSE 'RIGA_RESIDUA'::text
                      END::character varying AS motivo_fermo,
                  sdp.codice_interno AS stato_codice_interno,
                  sdp.codice AS stato_codice,
                  sdp.fase,
                  s.ragione_sociale_completa AS cliente_display,
                  p.data AS data_riferimento
                 FROM vendite.vw_preventivi p
                   JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                   LEFT JOIN righe r ON r.preventivo_id = p.id
                   LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = p.istanza_utility_id
                   LEFT JOIN anagrafiche.soggetti s ON s.id = iu.soggetto_id
                WHERE p.is_attiva
                GROUP BY p.id, p.uid, p.numero, p.competenza_mese, p.validita_dal, p.data, p.emittente_fiscale_id, sdp.codice_interno, sdp.codice, sdp.fase, sdp.esito, sdp.iniziale, sdp.emissione, s.ragione_sociale_completa;

              COMMENT ON VIEW vendite.vw_dash_fatturazione_preventivi
              IS 'Dashboard della fatturazione, area PREVENTIVO: una riga per preventivo, la sola revisione attiva (vendite.vw_preventivi.is_attiva). Valore imponibile totale e transitato dalle righe di vendite.vw_preventivi_smistamento_righe: una riga e'' transitata quando non e'' piu'' RESIDUA. competenza_mese: COALESCE(competenza_mese, mese di validita_dal, mese della data). is_abortito: esito NEGATIVO dello stato (null-safe). motivo_fermo: NULL se abortito o transitato per intero; DOC_BOZZA nello stato iniziale del vocabolario, IN_ATTESA_ACCETTAZIONE nello stato di emissione, altrimenti RIGA_RESIDUA. cliente_display: la ragione sociale dell''intestatario dell''istanza. La consuma vendite.vw_dash_fatturazione_documenti. security_invoker=on.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
