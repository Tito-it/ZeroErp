              COMMENT ON VIEW vendite.vw_dash_fatturazione_preventivi
              IS 'Dashboard fatturazione: resolver area PREVENTIVI. Valore imponibile totale vs transitato (vw_preventivi_smistamento_righe, ramo commessa EMESSA). Competenza COALESCE(competenza_mese, mese validita_dal, mese data). is_abortito=esito NEGATIVO (null-safe). cliente_display=ragione sociale intestatario istanza (path vw_preventivi_lista). Consumata da vw_dash_fatturazione_documenti. Rev 2026-10-20 (20261020-70, brief-db-grammatica-unica-documenti 2d, G-6): l''area PREVENTIVI diventa PREVENTIVO, il codice della sorgente (il plurale e'' ritirato).';
