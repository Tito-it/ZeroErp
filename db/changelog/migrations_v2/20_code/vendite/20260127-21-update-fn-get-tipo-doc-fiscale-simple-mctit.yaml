databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260127-21-update-fn-get-tipo-doc-fiscale-simple-mctit.yaml

  - changeSet:
      id: 20260127-21-update-fn-get-tipo-doc-fiscale-simple
      author: mctit
      comment: "Semplifica fn_get_tipo_doc_fiscale_id (solo sorgente, no fallback utility)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_get_tipo_doc_fiscale_id(
                p_sorgente_tipo_id config.sorgenti.id%TYPE
              )
              RETURNS config.tipi_doc_fiscale.id%TYPE
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_tipo_doc_id config.tipi_doc_fiscale.id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Risolve il tipo documento fiscale dalla sorgente.
                --
                -- Regole:
                --   1) config.sorgenti.tipo_doc_fiscale_id
                --   2) errore
                -- =========================================================

                IF p_sorgente_tipo_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_tipo_doc_fiscale_id', 'E_GENERICO',
                    jsonb_build_object('detail','sorgente_tipo_id obbligatorio'),
                    NULL::uuid,
                    'sorgente_tipo_id obbligatorio'
                  );
                END IF;

                SELECT s.tipo_doc_fiscale_id
                  INTO v_tipo_doc_id
                  FROM config.sorgenti s
                 WHERE s.id = p_sorgente_tipo_id;

                IF v_tipo_doc_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_get_tipo_doc_fiscale_id', 'E_GENERICO',
                    jsonb_build_object(
                      'detail','Tipo documento fiscale non risolto (sorgente)',
                      'sorgente_tipo_id', p_sorgente_tipo_id
                    ),
                    NULL::uuid,
                    'Tipo documento fiscale non risolto (sorgente)'
                  );
                END IF;

                RETURN v_tipo_doc_id;
              END
              $$;

              COMMENT ON FUNCTION vendite.fn_get_tipo_doc_fiscale_id(
                config.sorgenti.id%TYPE
              ) IS 'Risoluzione tipo_doc_fiscale_id dalla sorgente (no fallback).';
