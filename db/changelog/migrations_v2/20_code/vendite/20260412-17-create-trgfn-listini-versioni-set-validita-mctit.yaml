# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: trigger sync validita per listini_versioni.
# Usa la funzione generica script.trgfn_set_validita().
# Vedi: migrazione-daterange.md §4.3
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260412-17-create-trgfn-listini-versioni-set-validita-mctit.yaml

  - changeSet:
      id: 20260412-17-create-trgfn-listini-versioni-set-validita
      author: mctit
      runOnChange: false
      comment: >
        Crea trigger sync validita su vendite.listini_versioni usando
        la funzione generica script.trgfn_set_validita().
        Fase _a20_: dopo guard, prima di logica applicativa.
        UPDATE OF valido_dal, valido_al: si attiva solo su cambio colonne sorgente.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger sync validita per vendite.listini_versioni
              -- Usa la funzione generica script.trgfn_set_validita()
              DROP TRIGGER IF EXISTS trg_listini_versioni_a20_set_validita_ins_upd ON vendite.listini_versioni;

              CREATE TRIGGER trg_listini_versioni_a20_set_validita_ins_upd
                  BEFORE INSERT OR UPDATE OF valido_dal, valido_al
                  ON vendite.listini_versioni
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_set_validita();
