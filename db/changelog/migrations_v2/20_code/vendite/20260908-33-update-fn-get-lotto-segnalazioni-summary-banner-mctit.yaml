# Il banner smette di contare gli allarmi e comincia a contare i GESTI.
#   Richiesta BE del 2026-09-08 · brief-db-uscita-documento-dal-giro §7 e §6.3.
#
# ── ⛔ IL DIFETTO: «N segnalazioni bloccanti» NON DICE COSA FARE ──
#   Il riepilogo conta SEGNALAZIONI. Ma i gesti che l'operatore ha davanti sono
#   uno per DOCUMENTO — «togli questo dal giro» — e un documento con tre
#   critiche resta un documento solo. Dire «3 segnalazioni bloccanti» su un
#   documento fermo e' un numero vero che descrive la cosa sbagliata.
#
# ── ⛔ MA «N DOCUMENTI SU M» DA SOLO DIREBBE IL FALSO ────────────
#   Le critiche sono di DUE specie (§4.1), e una non e' un documento:
#     * di un DOCUMENTO (`gruppo_key` valorizzata) -> si toglie dal giro;
#     * del GIRO (`gruppo_key IS NULL`) -> emittente non risolto, configurazione
#       mancante: blocca e NON C'E' NIENTE DA TOGLIERE.
#   Su un lotto fermo per un emittente non risolto, «N documenti su M» direbbe
#   «0 documenti su 4»: un banner che dichiara che non c'e' niente da fare
#   mentre il giro e' bloccato.
#   ⇒ I numeri nuovi sono TRE, non due. Il terzo non e' un di piu': e' cio' che
#   rende la frase vera.
#
# ── ⛔ IL DENOMINATORE NON VIENE DAL PERIMETRO ───────────────────
#   `M` si conta su `fatturazione_lotti_esiti` — i documenti PRESI IN CARICO —
#   e non su `fatturazione_lotti_gruppi`. Il perimetro e' VUOTO sui giri di
#   massa: e' esattamente la ragione per cui la tabella degli esiti e' nata il
#   2026-09-07. Col perimetro il banner direbbe «su 0» su meta' dei giri, e
#   nessuno collegherebbe il difetto a questa riga.
#
# ── ⚠️ I TRE NUMERI DESCRIVONO IL CANALE «LOTTO», E VA DETTO ─────
#   La `gruppo_key` vive solo li'. Gli altri due canali che bloccano —
#   `fatture_log` e lo stato della riga di ponte — parlano per FATTURA, e una
#   bozza puo' coprire piu' documenti: i loro conteggi non sono sommabili a
#   questi senza scommettere. Restano dove sono, con i nomi che hanno.
#   ⛔ Per questo le colonne si chiamano `documenti_*` e non `totali`: il nome
#   dice di quale specie parla il numero.
#
# ── ⚠️ E' UN DROP + CREATE, E LE COLONNE VANNO IN CODA ───────────
#   `CREATE OR REPLACE` non cambia una `RETURNS TABLE`. ⛔ E la posizione qui
#   e' portante: il backend legge questa riga per POSIZIONE
#   (`pipeline_repository.py`, `row[0]`..`row[5]`). Infilare i numeri nuovi in
#   mezzo farebbe scivolare i sei esistenti — e una lettura posizionale
#   sbagliata non protesta: mostrerebbe numeri plausibili e falsi.
#
# ── ⭐ IL FILTRO SULL'ESCLUSO E' GIA' SCRITTO, E SI EREDITA ──────
#   `lotto_agg` esclude gia' le critiche dei documenti usciti dal giro
#   (`20260908-07`). I due conteggi nuovi nascono DENTRO quella CTE, quindi la
#   regola non si ripete: un documento tolto dal giro sparisce dal numeratore
#   per costruzione.
#
# ⛔ `blocks_next_step` resta in Python e NON deve sapere niente di questo
#   changeSet: somma i conteggi che gia' leggeva. Questi tre sono per la FRASE,
#   non per la decisione.
#
# Origine del corpo: pg_get_functiondef del 2026-09-08, patchato con
#   sostituzioni DICHIARATE da uno script, mai a mano.
# Verifica: db/pgtap/vendite/test-riferimento-gruppo-fatturabile-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-33-update-fn-get-lotto-segnalazioni-summary-banner-mctit.yaml

  - changeSet:
      id: 20260908-33-update-fn-get-lotto-segnalazioni-summary-banner
      author: mctit
      failOnError: true
      comment: >
        vendite.fn_get_lotto_segnalazioni_summary aggiunge tre conteggi IN CODA
        per il banner del lotto: quanti DOCUMENTI sono fermi, quanti il lotto ne
        ha presi in carico, e quante critiche sono del GIRO (che non sono
        documenti e non si possono togliere). Senza il terzo, «N documenti su M»
        direbbe «0 su 4» su un lotto fermo per un emittente non risolto.
        DROP + CREATE: la RETURNS TABLE cambia. In coda: il backend legge per
        posizione.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: vendite, tableName: fatturazione_lotti_log, columnName: gruppo_key }
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti_esiti
                columnName: stato_esecuzione
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⚠️ DROP obbligatorio: CREATE OR REPLACE non cambia una RETURNS TABLE.
              DROP FUNCTION IF EXISTS vendite.fn_get_lotto_segnalazioni_summary(
                  vendite.fatturazione_lotti.id%TYPE);

              CREATE OR REPLACE FUNCTION vendite.fn_get_lotto_segnalazioni_summary(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE)
              -- ⚠️ Tutti `bigint` espliciti: sono CONTEGGI, non il riflesso di
              --    una colonna. `%TYPE` solo dove una colonna esiste davvero.
              RETURNS TABLE (
                  fatture_critical_count                bigint,
                  fatture_warning_count                 bigint,
                  lotto_critical_count                  bigint,
                  lotto_warning_count                   bigint,
                  lotto_info_count                      bigint,
                  fatture_stato_esecuzione_errore_count bigint,
                  -- ⭐ I TRE NUOVI, IN CODA. Vedi la testata: il backend legge
                  --    questa riga per posizione.
                  documenti_bloccanti_count             bigint,
                  documenti_presi_in_carico_count       bigint,
                  critiche_giro_count                   bigint)
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$

              BEGIN
                  -- Guard: parametro obbligatorio
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_get_lotto_segnalazioni_summary', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio e > 0'
                      );
                  END IF;

                  RETURN QUERY
                  WITH fatture_agg AS (
                      -- ⭐ Non si tocca: la bozza cancellata porta via la riga di
                      --    ponte, e questo conteggio scende da se'.
                      SELECT COUNT(*) FILTER (WHERE fl.status = 'C') AS fc,
                             COUNT(*) FILTER (WHERE fl.status = 'W') AS fw
                        FROM vendite.fatturazione_lotti_fatture lf
                        JOIN vendite.fatture_log fl ON fl.fattura_id = lf.fattura_id
                       WHERE lf.lotto_id = p_lotto_id AND fl.disabilitato IS FALSE
                  ),
                  lotto_agg AS (
                      SELECT COUNT(*) FILTER (WHERE ll.status = 'C') AS lc,
                             COUNT(*) FILTER (WHERE ll.status = 'W') AS lw,
                             COUNT(*) FILTER (WHERE ll.status = 'I') AS li,
                             -- ⭐ QUANTI DOCUMENTI, non quante segnalazioni. Un documento con
                             --   tre critiche e' UN documento fermo: il banner dice all'operatore
                             --   quanti gesti gli restano, e i gesti sono uno per documento.
                             --   ⚠️ DISTINCT sulla chiave, e solo dove la chiave c'e'.
                             COUNT(DISTINCT ll.gruppo_key)
                                 FILTER (WHERE ll.status = 'C'
                                           AND ll.gruppo_key IS NOT NULL)      AS docs_bloccanti,
                             -- ⭐ E LE CRITICHE DEL GIRO, che sono l'altra meta' del vocabolario
                             --   (§4.1) e NON sono documenti: emittente non risolto,
                             --   configurazione mancante. Bloccano e non hanno niente da togliere.
                             -- ⛔ Senza questo numero il banner direbbe «0 documenti su 4» su un
                             --   lotto fermo — cioe' che non c'e' niente da fare mentre il giro
                             --   e' bloccato. Il terzo numero non e' un di piu': e' cio' che
                             --   rende la frase vera.
                             COUNT(*) FILTER (WHERE ll.status = 'C'
                                           AND ll.gruppo_key IS NULL)          AS critiche_giro
                        FROM vendite.fatturazione_lotti_log ll
                       WHERE ll.lotto_id = p_lotto_id AND ll.disabilitato IS FALSE
                         -- ⭐ La segnalazione di un documento USCITO non conta piu':
                         --   non e' stata ritirata, e' che il suo documento non e'
                         --   piu' in gioco. Resta leggibile nella storia del lotto.
                         -- ⚠️ Con `gruppo_key` NULL il NOT EXISTS e' vero e la riga
                         --   CONTA: «segnalazione del giro» ferma il giro. La regola
                         --   viene gratis dal confronto, non e' un ramo a parte.
                         AND NOT EXISTS (
                             SELECT 1
                               FROM vendite.fatturazione_lotti_esiti e
                              WHERE e.lotto_id         = ll.lotto_id
                                AND e.gruppo_key       = ll.gruppo_key
                                AND e.stato_esecuzione = 'ESCLUSO')
                  ),
                  esiti_agg AS (
                      -- ⭐ IL DENOMINATORE, e la sorgente non e' scontata: si contano gli
                      --   ESITI, cioe' i documenti che il lotto ha PRESO IN CARICO.
                      -- ⛔ NON `fatturazione_lotti_gruppi`: il perimetro e' VUOTO sui giri di
                      --   massa — e' esattamente la ragione per cui fatturazione_lotti_esiti
                      --   e' nata il 2026-09-07. Col perimetro il banner direbbe «su 0» su
                      --   meta' dei giri, e nessuno collegherebbe il difetto a questa riga.
                      SELECT COUNT(*) AS dt
                        FROM vendite.fatturazione_lotti_esiti e
                       WHERE e.lotto_id = p_lotto_id
                  ),
                  ponte_agg AS (
                      -- ⭐ Nemmeno questo: stessa ragione di fatture_agg.
                      SELECT COUNT(*) FILTER (WHERE lf.stato_esecuzione = 'ERRORE') AS pe
                        FROM vendite.fatturazione_lotti_fatture lf
                       WHERE lf.lotto_id = p_lotto_id
                  )
                  -- ⚠️ I TRE NUMERI NUOVI VANNO IN CODA, e non e' estetica: il backend
                  --   legge questa riga per POSIZIONE (row[0]..row[5]). Infilarli in mezzo
                  --   farebbe scivolare i sei esistenti, e una lettura posizionale sbagliata
                  --   non protesta: mostrerebbe numeri plausibili e falsi.
                  SELECT COALESCE(fa.fc, 0), COALESCE(fa.fw, 0),
                         COALESCE(la.lc, 0), COALESCE(la.lw, 0), COALESCE(la.li, 0),
                         COALESCE(pa.pe, 0),
                         COALESCE(la.docs_bloccanti, 0),
                         COALESCE(ea.dt, 0),
                         COALESCE(la.critiche_giro, 0)
                    FROM fatture_agg fa CROSS JOIN lotto_agg la CROSS JOIN ponte_agg pa
                                        CROSS JOIN esiti_agg ea;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_get_lotto_segnalazioni_summary(
                  vendite.fatturazione_lotti.id%TYPE)
              IS 'Il riepilogo delle segnalazioni di un lotto: sei conteggi storici piu'' tre per il '
                 'BANNER, aggiunti il 2026-09-08. ⭐ I sei contano SEGNALAZIONI; i tre nuovi contano '
                 'GESTI, perche'' l''operatore ne ha uno per DOCUMENTO (togli questo dal giro) e un '
                 'documento con tre critiche resta un documento solo. documenti_bloccanti_count = '
                 'quanti documenti hanno almeno una critica viva (DISTINCT sulla chiave); '
                 'documenti_presi_in_carico_count = il denominatore; critiche_giro_count = le critiche '
                 'che un documento NON ce l''hanno. ⛔ Il terzo numero non e'' un di piu'': senza, N '
                 'documenti su M direbbe 0 documenti su 4 su un lotto fermo per un emittente non '
                 'risolto, cioe'' che non c''e'' niente da fare mentre il giro e'' bloccato. Le critiche '
                 'sono di DUE specie (brief §4.1) e una non e'' un documento. ⛔ Il denominatore si '
                 'conta sugli ESITI e non sul perimetro: fatturazione_lotti_gruppi e'' vuota sui giri di '
                 'massa, ed e'' la ragione per cui la tabella degli esiti e'' nata. ⚠️ I tre '
                 'descrivono il canale LOTTO, dove la gruppo_key vive: gli altri due canali parlano per '
                 'FATTURA, e una bozza puo'' coprire piu'' documenti, quindi non sono sommabili senza '
                 'scommettere. ⭐ Il filtro sui documenti USCITI dal giro non si ripete: i due '
                 'conteggi nascono dentro lotto_agg, che ce l''ha gia''. ⚠️ Le colonne nuove '
                 'sono IN CODA perche'' il backend legge questa riga per POSIZIONE: infilarle in mezzo '
                 'mostrerebbe numeri plausibili e falsi, senza fallire. ⛔ blocks_next_step resta in '
                 'Python e non deve sapere niente di questi tre: sono per la FRASE, non per la '
                 'decisione. Brief: brief-db-uscita-documento-dal-giro §7.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⛔ Nessun ripristino automatico: tornare ai sei conteggi rimette
              --    il banner a contare allarmi invece di gesti, che e' il difetto
              --    per cui questo changeSet esiste. Se serve, si riapplica
              --    20260908-07.
              SELECT 1;
