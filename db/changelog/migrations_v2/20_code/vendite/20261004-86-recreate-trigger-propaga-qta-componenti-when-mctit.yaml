# I cinque trigger «propaga quantita' ai componenti» passano da
# AFTER UPDATE OF quantita a AFTER UPDATE … WHEN (OLD.quantita IS DISTINCT
# FROM NEW.quantita).
#
# -- IL DIFETTO ---------------------------------------------------------
#   In PostgreSQL un trigger UPDATE OF col scatta se col e' nella lista del
#   SET — anche a valore uguale — e NON scatta se col la cambia un altro
#   trigger BEFORE. Su queste cinque tabelle quantita la calcola
#   trgfn_qta_from_operativa (BEFORE, fascia _a10_) da qta_operativa e
#   dall'UdM. Un UPDATE che nomina solo qta_operativa o uom_operativa_id
#   cambia quantita senza far scattare la propagazione: i componenti del kit
#   restano con la quantita' vecchia. Il backend lo fa davvero sui
#   preventivi, dove fra le colonne aggiornabili ci sono qta_operativa e
#   uom_operativa_id ma non quantita.
#   Trovato censendo i trigger UPDATE OF dopo la correzione di
#   linee-guida-trigger.md, che descriveva UPDATE OF al contrario («non
#   scatta se non cambiano quelle colonne»): il commento della funzione
#   ripeteva la stessa frase (-85).
#
# -- LA FORMA -----------------------------------------------------------
#   · AFTER UPDATE senza OF + WHEN sul valore: il WHEN di un trigger AFTER
#     guarda la riga FINALE, dopo tutti i BEFORE, quindi vede la quantita'
#     ricalcolata, chiunque l'abbia scritta;
#   · nessuna propagazione spuria: un UPDATE del solo prezzo (che i
#     componenti stessi provocano ricalcolando il padre) ha quantita
#     invariata e il WHEN lo lascia fuori, come faceva l'OF;
#   · stessi nomi, stessa funzione, stessi argomenti: cambia solo l'evento.
#     Trigger scritti a mano (20260511-09/-23/-27/-36, 20260526-23), non da
#     ci_apply: il DROP + CREATE qui e' lecito (linee-guida-sql §11.5).
#
# ⚠️ Dati gia' scritti: i componenti di un kit la cui quantita' e' cambiata
#   solo via qta_operativa portano la quantita' vecchia. Su dev si
#   correggono a mano, se servono (AGENTS.md, «bug di dati in sviluppo»).
#
# Brief: brief-db-esclusioni-implicite (UPDATE OF).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261004-86-recreate-trigger-propaga-qta-componenti-when-mctit.yaml

  - changeSet:
      id: 20261004-86-recreate-trigger-propaga-qta-componenti-when
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I cinque trigger z90_propaga_qta_componenti: da AFTER UPDATE OF quantita a AFTER UPDATE
        WHEN (OLD.quantita IS DISTINCT FROM NEW.quantita). UPDATE OF non scattava quando quantita
        la ricalcola trgfn_qta_from_operativa. Brief: brief-db-esclusioni-implicite.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "5"
            sql: >
              SELECT count(*) FROM pg_trigger t JOIN pg_proc p ON p.oid = t.tgfoid
               WHERE p.proname = 'trgfn_componenti_propaga_qta'
                 AND t.tgname IN ('trg_preventivi_righe_z90_propaga_qta_componenti_upd',
                                  'trg_ordini_righe_z90_propaga_qta_componenti_upd',
                                  'trg_ddt_righe_z90_propaga_qta_componenti_upd',
                                  'trg_contratti_righe_z90_propaga_qta_componenti_upd',
                                  'trg_offerte_eccezioni_z90_propaga_qta_componenti_upd')
                 AND NOT t.tgisinternal;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER trg_preventivi_righe_z90_propaga_qta_componenti_upd ON vendite.preventivi_righe;
              CREATE TRIGGER trg_preventivi_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE ON vendite.preventivi_righe
                FOR EACH ROW
                WHEN (OLD.quantita IS DISTINCT FROM NEW.quantita)
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'preventivi_righe_componenti', 'riga_preventivo_id');

              DROP TRIGGER trg_ordini_righe_z90_propaga_qta_componenti_upd ON vendite.ordini_righe;
              CREATE TRIGGER trg_ordini_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE ON vendite.ordini_righe
                FOR EACH ROW
                WHEN (OLD.quantita IS DISTINCT FROM NEW.quantita)
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'ordini_righe_componenti', 'riga_ordine_id');

              DROP TRIGGER trg_ddt_righe_z90_propaga_qta_componenti_upd ON vendite.ddt_righe;
              CREATE TRIGGER trg_ddt_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE ON vendite.ddt_righe
                FOR EACH ROW
                WHEN (OLD.quantita IS DISTINCT FROM NEW.quantita)
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'ddt_righe_componenti', 'riga_ddt_id');

              DROP TRIGGER trg_contratti_righe_z90_propaga_qta_componenti_upd ON vendite.contratti_righe;
              CREATE TRIGGER trg_contratti_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE ON vendite.contratti_righe
                FOR EACH ROW
                WHEN (OLD.quantita IS DISTINCT FROM NEW.quantita)
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'contratti_righe_componenti', 'riga_contratto_id');

              DROP TRIGGER trg_offerte_eccezioni_z90_propaga_qta_componenti_upd ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_z90_propaga_qta_componenti_upd
                AFTER UPDATE ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                WHEN (OLD.quantita IS DISTINCT FROM NEW.quantita)
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'offerte_commerciali_eccezioni_componenti', 'eccezione_offerta_id');
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_righe_z90_propaga_qta_componenti_upd ON vendite.preventivi_righe;
              CREATE TRIGGER trg_preventivi_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE OF quantita ON vendite.preventivi_righe
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'preventivi_righe_componenti', 'riga_preventivo_id');

              DROP TRIGGER IF EXISTS trg_ordini_righe_z90_propaga_qta_componenti_upd ON vendite.ordini_righe;
              CREATE TRIGGER trg_ordini_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE OF quantita ON vendite.ordini_righe
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'ordini_righe_componenti', 'riga_ordine_id');

              DROP TRIGGER IF EXISTS trg_ddt_righe_z90_propaga_qta_componenti_upd ON vendite.ddt_righe;
              CREATE TRIGGER trg_ddt_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE OF quantita ON vendite.ddt_righe
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'ddt_righe_componenti', 'riga_ddt_id');

              DROP TRIGGER IF EXISTS trg_contratti_righe_z90_propaga_qta_componenti_upd ON vendite.contratti_righe;
              CREATE TRIGGER trg_contratti_righe_z90_propaga_qta_componenti_upd
                AFTER UPDATE OF quantita ON vendite.contratti_righe
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'contratti_righe_componenti', 'riga_contratto_id');

              DROP TRIGGER IF EXISTS trg_offerte_eccezioni_z90_propaga_qta_componenti_upd ON vendite.offerte_commerciali_eccezioni;
              CREATE TRIGGER trg_offerte_eccezioni_z90_propaga_qta_componenti_upd
                AFTER UPDATE OF quantita ON vendite.offerte_commerciali_eccezioni
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_componenti_propaga_qta('vendite', 'offerte_commerciali_eccezioni_componenti', 'eccezione_offerta_id');
