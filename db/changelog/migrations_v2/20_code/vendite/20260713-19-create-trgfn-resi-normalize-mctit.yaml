# Slice RESI vendita — trgfn_resi_normalize (brief §3, §0.6).
#
# Mirror NELLA FORMA di vendite.trgfn_ddt_normalize, ma la FONTE del reso e' il
# DDT (sorgente DDT_VENDITA), non l'ordine: eredita billing/destinatario/utility/
# valuta/emittente dal DDT di provenienza (JOIN vendite.ddt su uid = sorgente_uid,
# risoluzione sorgente per codice_interno). L'emittente sul DDT e' gia' NOT NULL
# -> eredita' pulita. Fallback standalone da billing_account (predisposizione,
# inerte in questa slice: sorgente NOT NULL).
#
# Firing: trg_resi_normalize_ins_upd (senza token di fase) -> fira dopo gli a10
# e PRIMA di z10_guard_emittente_ba (che verifica i valori FINALI risolti).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260713-19-create-trgfn-resi-normalize-mctit.yaml

  - changeSet:
      id: 20260713-19-create-trgfn-resi-normalize
      author: mctit
      # ⚠️ Era `true`. In CI Liquibase gira DUE volte (--contexts="!provision" poi
      #   --contexts=ci_apply): un runOnChange ri-esegue nella seconda passata, FUORI
      #   dall'ordine di timeline, e rimette questo corpo sopra le revisioni piu'
      #   recenti. Regola dal 2026-08-06: in 00_schema e 20_code runOnChange e' VIETATO
      #   (cancello scripts/guardrail_run_on_change.py). Per aggiornare un oggetto si
      #   crea un file nuovo con numerazione successiva, non si rigira questo.
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_resi_normalize()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo: normalizzazione reso su INSERT/UPDATE.
                --   1. anno/data se numero presente (INSERT).
                --   2. eredita billing/destinatario/utility/valuta/emittente
                --      dal DDT sorgente (DDT_VENDITA, lookup per codice_interno
                --      via uid) su INSERT se non gia' valorizzati.
                --   3. fallback emittente da billing_account (standalone,
                --      predisposizione: sorgente NOT NULL in questa slice).
                -- =========================================================

                -- 1. anno/data
                IF TG_OP = 'INSERT' AND (NEW.numero IS NOT NULL AND btrim(NEW.numero) <> '') THEN
                  IF NEW.anno IS NULL OR NEW.anno = 0 THEN
                    NEW.anno := EXTRACT(YEAR FROM CURRENT_DATE)::smallint;
                  END IF;
                  IF NEW.data IS NULL THEN
                    NEW.data := CURRENT_DATE;
                  END IF;
                END IF;

                -- 2. eredita billing/destinatario/utility/valuta/emittente dal DDT sorgente
                IF TG_OP = 'INSERT'
                   AND NEW.sorgente_tipo_id IS NOT NULL
                   AND NEW.sorgente_uid IS NOT NULL
                   AND (NEW.billing_account_id IS NULL
                        OR NEW.destinatario_soggetto_ruolo_id IS NULL
                        OR NEW.utility_id IS NULL
                        OR NEW.valuta_id IS NULL
                        OR NEW.emittente_fiscale_id IS NULL)
                THEN
                  IF EXISTS (
                    SELECT 1 FROM config.sorgenti
                    WHERE id = NEW.sorgente_tipo_id AND codice_interno = 'DDT_VENDITA'
                  ) THEN
                    SELECT
                      COALESCE(NEW.billing_account_id, d.billing_account_id),
                      COALESCE(NEW.destinatario_soggetto_ruolo_id, d.destinatario_soggetto_ruolo_id),
                      COALESCE(NEW.utility_id, d.utility_id),
                      COALESCE(NEW.valuta_id, d.valuta_id),
                      COALESCE(NEW.emittente_fiscale_id, d.emittente_fiscale_id)
                    INTO
                      NEW.billing_account_id,
                      NEW.destinatario_soggetto_ruolo_id,
                      NEW.utility_id,
                      NEW.valuta_id,
                      NEW.emittente_fiscale_id
                    FROM vendite.ddt d
                    WHERE d.uid = NEW.sorgente_uid
                    LIMIT 1;
                  END IF;
                END IF;

                -- 3. fallback standalone: emittente da billing_account (convenzione PK).
                IF TG_OP = 'INSERT'
                   AND NEW.emittente_fiscale_id IS NULL
                   AND NEW.billing_account_id IS NOT NULL
                THEN
                  NEW.emittente_fiscale_id :=
                    anagrafiche.fn_get_emittente_fiscale_pk(NEW.billing_account_id);
                END IF;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_resi_normalize()
              IS 'Normalize reso: anno/data; eredita billing/destinatario/utility/valuta/emittente dal DDT sorgente (DDT_VENDITA, per codice_interno, JOIN vendite.ddt su uid) su INSERT; fallback emittente da billing_account. Mirror trgfn_ddt_normalize (fonte = DDT). rev 2026-07-13.';

              DROP TRIGGER IF EXISTS trg_resi_normalize_ins_upd ON vendite.resi;
              CREATE TRIGGER trg_resi_normalize_ins_upd
                BEFORE INSERT OR UPDATE ON vendite.resi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_resi_normalize();
