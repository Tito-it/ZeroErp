# LA PROIEZIONE DELL'EVASIONE: IL RITORNO ALLO STATO DI EMISSIONE
#   Brief: brief-db-stati-documento-dal-vocabolario §6.15, giro 6b (S-2,
#   Tid 2026-11-08; via ai giri di Tid del 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   vendite.fn_ordine_proietta_stato_evasione, senza legami di evasione,
#   riportava l'ordine a 'CONFERMATO' col codice. Non e' una destinazione del
#   processo: e' lo stato da cui l'evasione parte, quello che il vocabolario
#   marca emissione e da cui vendite.fn_genera_ddt_da_ordine evade. Con la
#   marca spostata l'ordine tornava in uno stato che non e' piu' l'emissione.
#   E' la forma di D-PROI del preventivo (Tid, 2026-11-14, (a)).
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   Il ramo senza legami va a script.fn_stato_emissione_id('vendite.ordini').
#   PARZIALMENTE_EVASO ed EVASO restano col codice (script.fn_doc_stato_id):
#   sono le destinazioni del processo, come le nomina la matrice (S-3).
#   E_CONFIG_MANCANTE resta, col nome di cio' che manca.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, SECURITY DEFINER, SET search_path
#   (pg_proc su dbdev, 2026-11-14). Il COMMENT e' riscritto al presente.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (il catalogo li scioglie). Il
#   rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261114-16-update-fn-ordine-proietta-stato-evasione-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261114-16-update-fn-ordine-proietta-stato-evasione-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.fn_ordine_proietta_stato_evasione: senza legami di evasione l'ordine torna allo
        stato di emissione del vocabolario; PARZIALMENTE_EVASO ed EVASO restano col codice. Brief:
        brief-db-stati-documento-dal-vocabolario, giro 6b.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ordine_proietta_stato_evasione(
                  p_ordine_id vendite.ordini.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: portare l'ordine nello stato che la sua evasione dice.
              --   1. nessun fulfillment su nessuna riga MERCE -> lo stato di emissione;
              --   2. residuo su almeno una riga merce (fn_ordine_ha_residuo_evasione,
              --      reso-aware)                       -> PARZIALMENTE_EVASO;
              --   3. altrimenti                         -> EVASO.
              --   La transizione passa dalla matrice (trgfn_ordini_guard_transizione):
              --   uno stato di partenza che non ammette il passaggio rifiuta li'.
              -- Consumatori: fn_genera_ddt_da_ordine, i cinque verbi del reso,
              --   fn_ddt_riga_correggi_qta_evasa e il ritiro del legame con la riga
              --   di DDT in bozza (trgfn_dlt_block_ordrig_ddtrig).
              -- Brief: brief-db-ddt-righe-evase-dall-ordine (§5.2).
              -- rev 2026-10-25 (20261025-79, brief-modello-documento-vendita
              --   §9): e' il verbo dei passaggi di PROCESSO dell'ordine
              --   (manuale = false): scrive con la sola seconda meta' del
              --   verbo comune, attraverso la porta. DEFINER, perche' la porta
              --   vuole il proprietario; lo stato e' la proiezione
              --   dell'evasione, non una scelta di chi chiama.
              -- rev 2026-11-03 (20261103-23, brief-db-addebito-trasporto-ordine
              --   §8.1): l'onere non decide lo stato. Il ramo 1 conta solo i
              --   legami verso righe merce (script.fn_natura_e_merce); i rami
              --   2 e 3 lo seguono dal residuo (20261103-22).
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6b):
              --   il ramo 1 va allo stato di emissione del vocabolario (la colonna),
              --   non al codice CONFERMATO; PARZIALMENTE_EVASO ed EVASO, destinazioni
              --   del processo, restano col codice.
              -- =========================================================
              DECLARE
                  -- Il nome della destinazione, per il messaggio: un codice o la colonna
                  -- emissione, nessuna colonna di cui sia il riflesso.
                  v_stato_target    text;
                  v_stato_target_id config.stati_doc_ordini.id%TYPE;
                  v_stato_id        vendite.ordini.stato_doc_ordine_id%TYPE;
              BEGIN
                  IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_ordine_proietta_stato_evasione',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_ordine_id', p_ordine_id),
                          NULL::uuid, 'vendite.fn_ordine_proietta_stato_evasione',
                          'p_ordine_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- ⭐ Il discrimine del CONFERMATO e' l'esistenza di un legame, non
                  --    il residuo pieno: un ordine evaso e poi reso per intero e'
                  --    stato evaso, e resta PARZIALMENTE_EVASO.
                  -- ⭐ rev 2026-11-03: un legame verso una riga MERCE. Il legame
                  --    dell'onere copiato in bolla (fn_genera_ddt_da_ordine) non
                  --    dice che la merce e' partita.
                  IF NOT EXISTS (
                      SELECT 1
                        FROM vendite.ordini_righe_fulfillment f
                        JOIN vendite.ordini_righe orr ON orr.id = f.ordine_riga_id
                       WHERE orr.ordine_id = p_ordine_id
                         AND script.fn_natura_e_merce(orr.natura_vendita_id)
                  ) THEN
                      v_stato_target    := 'emissione';
                      v_stato_target_id := script.fn_stato_emissione_id('vendite.ordini'::regclass);
                  ELSIF vendite.fn_ordine_ha_residuo_evasione(p_ordine_id) THEN
                      v_stato_target    := 'PARZIALMENTE_EVASO';
                      v_stato_target_id := script.fn_doc_stato_id('vendite.ordini'::regclass, v_stato_target);
                  ELSE
                      v_stato_target    := 'EVASO';
                      v_stato_target_id := script.fn_doc_stato_id('vendite.ordini'::regclass, v_stato_target);
                  END IF;

                  IF v_stato_target_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'vendite.fn_ordine_proietta_stato_evasione',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.stati_doc_ordini.' || v_stato_target),
                          NULL::uuid, 'stato ' || v_stato_target || ' (config.stati_doc_ordini)');
                  END IF;

                  -- Lo stato di oggi. Ordine assente, o gia' nello stato giusto:
                  -- niente (come la WHERE dell'UPDATE di prima).
                  SELECT o.stato_doc_ordine_id
                    INTO v_stato_id
                    FROM vendite.ordini o
                   WHERE o.id = p_ordine_id;

                  IF NOT FOUND OR v_stato_id = v_stato_target_id THEN
                      RETURN;
                  END IF;

                  -- La matrice la giudica il guard di transizione, all'UPDATE.
                  PERFORM script.fn_doc_scrivi_stato('vendite.ordini'::regclass,
                                                     p_ordine_id, v_stato_target_id);
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ordine_proietta_stato_evasione(p_ordine_id vendite.ordini.id%TYPE)
              IS 'Porta l''ordine nello stato che la sua evasione dice. Nessun legame di evasione (vendite.ordini_righe_fulfillment) su nessuna riga merce -> lo stato di emissione (la colonna emissione di config.stati_doc_ordini); residuo su almeno una riga merce (vendite.fn_ordine_ha_residuo_evasione, che conta i resi) -> PARZIALMENTE_EVASO; altrimenti EVASO. Il discrimine dello stato di emissione e'' l''esistenza di un legame, non il residuo pieno: un ordine evaso e poi reso per intero resta PARZIALMENTE_EVASO. L''onere non decide lo stato: contano solo i legami verso righe merce (script.fn_natura_e_merce sulla natura congelata). L''emissione e'' un significato e si legge dalla colonna; EVASO e PARZIALMENTE_EVASO sono le destinazioni del processo e si nominano col codice (script.fn_doc_stato_id), come le nomina la matrice. Destinazione assente dal vocabolario: E_CONFIG_MANCANTE. Scrive solo se lo stato cambia, con script.fn_doc_scrivi_stato attraverso la porta (script.trgfn_doc_stato_solo_dal_verbo): e'' il verbo dei passaggi di processo dell''ordine (manuale = false nella matrice), e il passaggio lo giudica vendite.trgfn_ordini_guard_transizione. Consumatori: vendite.fn_genera_ddt_da_ordine, i cinque verbi del reso (vendite.fn_conferma_reso, vendite.fn_annulla_reso, vendite.fn_chiudi_riconsegna_reso, vendite.fn_riapri_riconsegna_reso, vendite.fn_genera_ddt_riconsegna), vendite.fn_ddt_riga_correggi_qta_evasa e vendite.fn_ddt_riga_ritira_legami. SECURITY DEFINER con search_path bloccato, perche'' la porta vuole il proprietario: lo stato e'' la proiezione dell''evasione, non una scelta di chi chiama, e il perimetro di chi agisce lo controllano i consumatori. Parametro non valido: E_VENDITE_CHIAMATA_NON_VALIDA (TECNICO).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ordine_proietta_stato_evasione(
                  p_ordine_id vendite.ordini.id%TYPE)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- =========================================================
              -- Scopo: portare l'ordine nello stato che la sua evasione dice.
              --   1. nessun fulfillment su nessuna riga MERCE -> CONFERMATO;
              --   2. residuo su almeno una riga merce (fn_ordine_ha_residuo_evasione,
              --      reso-aware)                       -> PARZIALMENTE_EVASO;
              --   3. altrimenti                         -> EVASO.
              --   La transizione passa dalla matrice (trgfn_ordini_guard_transizione):
              --   uno stato di partenza che non ammette il passaggio rifiuta li'.
