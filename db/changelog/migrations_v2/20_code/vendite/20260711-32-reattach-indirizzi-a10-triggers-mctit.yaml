# Ri-aggancio dei trigger whitelist a10 sulle 4 tabelle *_indirizzi
# esistenti, DROPpati in 20260711-15 per poter fare l'ALTER TYPE della
# colonna tipo_indirizzo_id. Stessi nomi e stessi ambiti; puntano alla
# funzione parametrica condivisa (versione aggiornata da 20260711-19).
# Idempotente: DROP IF EXISTS + CREATE (copre anche il build pulito, dove
# l'attach originale 2025 li ha gia' creati).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260711-32-reattach-indirizzi-a10-triggers-mctit.yaml

  - changeSet:
      id: 20260711-32-reattach-indirizzi-a10-triggers
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_preventivi_indirizzi_a10_only_allowed_tipi_ins_upd
                ON vendite.preventivi_indirizzi;
              CREATE TRIGGER trg_preventivi_indirizzi_a10_only_allowed_tipi_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                ON vendite.preventivi_indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('PREVENTIVI');

              DROP TRIGGER IF EXISTS trg_ordini_indirizzi_a10_only_allowed_tipi_ins_upd
                ON vendite.ordini_indirizzi;
              CREATE TRIGGER trg_ordini_indirizzi_a10_only_allowed_tipi_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                ON vendite.ordini_indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('ORDINI');

              DROP TRIGGER IF EXISTS trg_fatture_indirizzi_a10_only_allowed_tipi_ins_upd
                ON vendite.fatture_indirizzi;
              CREATE TRIGGER trg_fatture_indirizzi_a10_only_allowed_tipi_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                ON vendite.fatture_indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('FATTURE');

              DROP TRIGGER IF EXISTS trg_ddt_indirizzi_a10_only_allowed_tipi_ins_upd
                ON vendite.ddt_indirizzi;
              CREATE TRIGGER trg_ddt_indirizzi_a10_only_allowed_tipi_ins_upd
                BEFORE INSERT OR UPDATE OF tipo_indirizzo_id
                ON vendite.ddt_indirizzi
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_tipi_indirizzi_only_allowed('DDT');
