# DB-4 — LA LISTA DA CUI SI FATTURA DICE IL SEZIONALE E LA DATA
#   Piano: brief-db-registro-e-data-prevista-in-competenza §11.5 L5
#   E' la consegna che il cantiere aveva come richiesta iniziale: la schermata
#   da cui si preme «fattura» non diceva ne' su quale sezionale sarebbe finito
#   il documento ne' che data avrebbe portato. Ora lo dice PRIMA di premere.
#
# ── ⛔ «UNO OPPURE N», E MAI IL PRIMO CHE CAPITA ────────────────────
#   Un gruppo puo' toccare PIU' sezionali, ed e' ammesso per costruzione: la
#   chiave del gruppo (sorgente_tipo, sorgente_uid, commessa) NON contiene ne'
#   tipo documento ne' natura, che sono colonne di RIGA. Un gruppo di oneri con
#   una riga FRONTOFFICE e una BACKOFFICE finisce su due sezionali con due
#   politiche di data diverse — ed e' il ramo NORMALE della porta manuale, non
#   un caso limite.
#   ⛔ Con piu' di un sezionale la colonna resta VUOTA (decisione D-2): un
#   `min()` o un `LIMIT 1` darebbe un valore plausibile che descrive solo meta'
#   di cio' che sta per succedere. ⭐ Qui il `min()` c'e', ma dentro un `CASE`
#   che ha gia' verificato che l'insieme abbia UN elemento: non e' un LIMIT 1
#   travestito.
#
# ── ⭐ `registri_ids` E' L'ELEMENTO PORTANTE, NON UN EXTRA ──────────
#   E' cio' su cui il backend FILTRA (decisione D-5, filtro per sezionale):
#   `%s = ANY(g.registri_ids)`. ⛔ Filtrare su `registro_codice` non
#   funzionerebbe: su un gruppo multi-sezionale quella colonna e' NULL per
#   decisione, quindi il gruppo sparirebbe da ENTRAMBI i filtri — proprio
#   quello che ha piu' bisogno di essere visto. La domanda giusta non e' «qual
#   e' il sezionale di questo gruppo» ma «questo gruppo TOCCA quel sezionale?».
#
# ── ⭐ `registri_n` NON E' UNA SECONDA VERITA' ─────────────────────
#   E' `cardinality(registri_ids)`: la stessa espressione con due nomi,
#   calcolata nella stessa vista. Non possono divergere.
#
# ── ⚠️ array_agg INCLUDE I NULL, ED E' PROPRIO IL PUNTO ────────────
#   `count(DISTINCT …)` scarta i NULL in silenzio: un gruppo con una riga
#   risolta e una NON risolvibile risponderebbe «1» e mostrerebbe un sezionale
#   solo — la stessa mezza verita' del LIMIT 1, presa dall'altra parte.
#   `array_agg(DISTINCT …)` invece il NULL lo tiene come elemento: quel gruppo
#   produce `{5,NULL}`, cardinalita' 2, e legge «piu' registri».
#   ℹ️ E su un gruppo interamente FATTURATO — dove D-9 azzera la previsione su
#   ogni riga — l'array e' `{NULL}`, cardinalita' 1, con codice e data a NULL:
#   il frontend mostra «—», che e' la cosa giusta.
#
# ── ⛔ LA FRASE «PIU' REGISTRI» NON NASCE QUI ──────────────────────
#   Decisione D-4 di Tid: il database dice QUANTI, il testo lo mette BE/FE.
#   Una vista che restituisse la stringa «piu' registri» scriverebbe italiano
#   dentro il database, e il prodotto ha it.json E en.json. Il precedente giusto
#   e' nella stessa vista: `tipo_gruppo` restituisce un CODICE
#   (`ONERI_COMMESSA`), non una frase.
#   ⭐ E l'export non e' un buco: quello di queste liste e' server-side e passa
#   dalla STESSA proiezione della lista, quindi componendo la frase nel BE
#   compare anche nel file.
#
# ── ⚠️ DUE COSE DA NON DIMENTICARE in una CREATE OR REPLACE VIEW ───
#   1) `security_invoker=on` va RI-SPECIFICATA, o PostgreSQL la azzera — e
#      questa vista ci appoggia lo scope emittente;
#   2) si possono solo APPENDERE colonne in coda: le quattro nuove vanno per
#      forza dopo `emittente_ragione_sociale`, e non e' una scelta estetica.
#
# ── ⚠️ NON BASTA QUESTO CHANGE SET perche' le colonne si vedano ────
#   La lista ha `vista_sql = NULL`: le righe le compone il repository di
#   dominio, che elenca le colonne ESPLICITAMENTE. Servono BE-1 (proiezione),
#   BE-2 (whitelist ordinamento) e BE-3 (chiavi i18n) del brief. Una colonna a
#   catalogo senza il campo a monte si spunta e resta VUOTA.
#
# Dipendenze: 20260826-18 (le quattro colonne su vw_dash_competenza_attivita).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260826-19-update-vw-dash-competenza-gruppi-registro-mctit.yaml

  - changeSet:
      id: 20260826-19-update-vw-dash-competenza-gruppi-registro
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        DB-4: la lista da cui si fattura dice il SEZIONALE e la DATA PREVISTA — ed e' la
        richiesta che ha aperto il cantiere. Quattro colonne in coda: registri_ids,
        registri_n, registro_codice, data_documento_prevista. ⛔ «Uno oppure N»: un gruppo
        puo' toccare piu' sezionali per costruzione (la chiave del gruppo non contiene tipo
        documento ne' natura, che sono colonne di riga), e in quel caso codice e data restano
        VUOTI — mai il primo che capita. ⭐ registri_ids e' l'elemento portante: e' cio' su cui
        il BE filtra (D-5), perche' filtrare su registro_codice escluderebbe da ENTRAMBI i
        filtri proprio il gruppo multi-sezionale. registri_n e' cardinality(registri_ids), la
        stessa espressione con due nomi. ⚠️ array_agg INCLUDE i NULL mentre count(DISTINCT)
        li scarta: e' cosi' che «uno risolto + uno ignoto» legge «piu' registri» invece di
        mostrare un sezionale solo. ⛔ La frase «piu' registri» NON nasce qui (D-4): il DB dice
        quanti, il testo lo mette BE/FE — il precedente e' tipo_gruppo, che restituisce un
        codice e non una frase. ⚠️ security_invoker=on ri-specificata; colonne appese in coda.
      preConditions:
        - onFail: HALT
        - and:
            - viewExists:
                schemaName: vendite
                viewName: vw_dash_competenza_gruppi
            - sqlCheck:
                expectedResult: 4
                sql: |
                  SELECT COUNT(*) FROM information_schema.columns
                   WHERE table_schema = 'vendite'
                     AND table_name = 'vw_dash_competenza_attivita'
                     AND column_name IN ('registro_id', 'registro_codice',
                                         'politica_data_documento', 'data_documento_prevista');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_competenza_gruppi
              WITH (security_invoker=on) AS
              WITH aggregato AS (
                       SELECT a.competenza_mese,
                          a.gruppo_key,
                          a.sorgente_tipo_id,
                          a.sorgente_uid,
                          a.commessa_id,
                          a.commessa_codice,
                          a.emittente_soggetto_ruolo_id,
                          a.cliente_display,
                          a.stadio,
                          a.commessa_emittibile,
                          a.commessa_stato_codice_interno,
                          a.commessa_stato_descrizione,
                          a.billing_account_id,
                          count(*) AS n_attivita,
                          COALESCE(sum(a.valore), (0)::numeric) AS valore,
                          min(a.data_attivita) AS data_attivita_min,
                          max(a.data_attivita) AS data_attivita_max,
                          bool_or(((a.tipo_movimento)::text = 'ONERE'::text)) AS ha_oneri,
                          -- ⭐ 2026-08-26 (L5): i sezionali che il gruppo tocca.
                          -- ⚠️ array_agg e NON count(DISTINCT): il secondo scarta
                          --    i NULL in silenzio, e un gruppo con una riga
                          --    risolta e una NON risolvibile risponderebbe «1»,
                          --    mostrando un sezionale solo. Qui il NULL resta un
                          --    elemento, quindi quel gruppo conta 2 e legge
                          --    «piu' registri».
                          array_agg(DISTINCT a.registro_id) AS registri_ids,
                          -- ⚠️ I due `min()` NON sono un LIMIT 1 travestito: chi
                          --    li legge (il SELECT esterno) li usa SOLO dopo aver
                          --    verificato che l'insieme abbia un elemento.
                          min(a.registro_codice) AS registro_codice_unico,
                          min(a.data_documento_prevista) AS data_prevista_unica
                         FROM vendite.vw_dash_competenza_attivita a
                        GROUP BY a.competenza_mese, a.gruppo_key, a.sorgente_tipo_id, a.sorgente_uid, a.commessa_id, a.commessa_codice, a.emittente_soggetto_ruolo_id, a.cliente_display, a.stadio, a.commessa_emittibile, a.commessa_stato_codice_interno, a.commessa_stato_descrizione, a.billing_account_id
                      )
               SELECT g.competenza_mese,
                  g.gruppo_key,
                  COALESCE(s.codice_interno, 'ONERI_COMMESSA'::character varying) AS tipo_gruppo,
                  s.area AS area_documento,
                  COALESCE(doc.codice, g.commessa_codice, g.gruppo_key) AS riferimento,
                  g.commessa_id,
                  g.commessa_codice,
                  g.emittente_soggetto_ruolo_id,
                  g.cliente_display,
                  g.stadio,
                  g.n_attivita,
                  g.valore,
                  g.data_attivita_min,
                  g.data_attivita_max,
                  g.ha_oneri,
                  g.sorgente_tipo_id,
                  g.sorgente_uid,
                  g.commessa_emittibile,
                  g.commessa_stato_codice_interno,
                  g.commessa_stato_descrizione,
                  doc.documento_id,
                  COALESCE(ba_riga.parent_account_id, ba_riga.id) AS ba_fatturazione_id,
                  ba_fatt.codice AS ba_codice_fatturazione,
                  sog.ragione_sociale_completa AS cliente_fatturazione_display,
                  sog.id_fiscale_univoco_cf_piva AS id_fiscale,
                  -- ⭐ P-4: la riga dichiara da quale emittente arriva.
                  --    In coda per forza: CREATE OR REPLACE VIEW puo' solo
                  --    APPENDERE colonne, non inserirle in mezzo.
                  s_ef.ragione_sociale_completa AS emittente_ragione_sociale,
                  -- ⭐ 2026-08-26 (L5): il sezionale e la data, «uno oppure N».
                  -- ⭐ registri_ids e' l'elemento PORTANTE, non un extra: e' cio'
                  --    su cui il BE filtra (`%s = ANY(...)`), perche' su un
                  --    gruppo multi-sezionale registro_codice e' NULL per
                  --    decisione e filtrarci sopra escluderebbe il gruppo da
                  --    ENTRAMBI i filtri.
                  g.registri_ids,
                  -- ⭐ Non e' una seconda verita': e' cardinality() della stessa
                  --    espressione, calcolata nella stessa vista.
                  cardinality(g.registri_ids)::smallint AS registri_n,
                  -- ⛔ UNO OPPURE N (D-2): con piu' di un sezionale restano
                  --    VUOTI. Il testo «piu' registri» lo mette BE/FE (D-4): qui
                  --    si dice QUANTI sono, non come si chiamano — una vista che
                  --    restituisse quella frase scriverebbe italiano dentro il
                  --    database, e il prodotto ha anche en.json.
                  CASE WHEN cardinality(g.registri_ids) = 1
                       THEN g.registro_codice_unico END AS registro_codice,
                  CASE WHEN cardinality(g.registri_ids) = 1
                       THEN g.data_prevista_unica END AS data_documento_prevista
                 FROM aggregato g
                   LEFT JOIN config.sorgenti s ON s.id = g.sorgente_tipo_id
                   LEFT JOIN LATERAL ( SELECT d.codice,
                          d.documento_id
                         FROM vendite.vw_dash_fatturazione_documenti d
                        WHERE ((s.area IS NOT NULL) AND ((d.area)::text = (s.area)::text) AND (d.documento_uid = g.sorgente_uid))
                        ORDER BY d.competenza_mese DESC NULLS LAST
                       LIMIT 1) doc ON true
                   LEFT JOIN anagrafiche.billing_account ba_riga ON ba_riga.id = g.billing_account_id
                   LEFT JOIN anagrafiche.billing_account ba_fatt ON ba_fatt.id = COALESCE(ba_riga.parent_account_id, ba_riga.id)
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_fatt ON sr_fatt.id = ba_fatt.soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti sog ON sog.id = sr_fatt.soggetto_id
                   -- Emittente della riga: soggetto_ruolo -> soggetto. Stessa
                   -- forma delle sei viste documento che la mostrano gia'.
                   LEFT JOIN anagrafiche.soggetti_ruoli sr_ef ON sr_ef.id = g.emittente_soggetto_ruolo_id
                   LEFT JOIN anagrafiche.soggetti s_ef ON s_ef.id = sr_ef.soggetto_id;

              COMMENT ON VIEW vendite.vw_dash_competenza_gruppi IS
                  'Lente 1 Competenza, gruppi fatturabili: l''unita'' dell''emissione mirata. '
                  'Una riga per (competenza_mese, gruppo_key). security_invoker=on (scope '
                  'emittente). Rev 2026-08-18 (P-4, brief perimetro-emittente Q4): espone '
                  'emittente_ragione_sociale, non piu'' il solo emittente_soggetto_ruolo_id — '
                  'un id a video non dichiara l''emittente, lo nasconde meglio. E'' la lista '
                  'PILOTA del giro P-4 perche'' e'' quella da cui parte l''emissione mirata: si '
                  'spuntano i gruppi e si fattura. ⚠️ La colonna arriva a video solo con la '
                  'richiesta BE-2 (la lista ha vista_sql NULL: le righe le compone il '
                  'repository, che elenca le colonne esplicitamente). '
                  '⭐ Rev 2026-08-26 (L5, brief-db-registro-e-data-prevista-in-competenza): '
                  'quattro colonne in coda — registri_ids, registri_n, registro_codice, '
                  'data_documento_prevista. Rispondono alla domanda che ha aperto il cantiere: '
                  'la schermata da cui si preme «fattura» non diceva ne'' su quale sezionale '
                  'sarebbe finito il documento ne'' che data avrebbe portato, e sono le due '
                  'cose che governano tutto cio'' che viene dopo. '
                  '⛔ «UNO OPPURE N» (decisione D-2): un gruppo puo'' toccare piu'' sezionali per '
                  'costruzione — la chiave del gruppo non contiene ne'' tipo documento ne'' '
                  'natura, che sono colonne di RIGA — e in quel caso codice e data restano '
                  'VUOTI. Mai il primo che capita: un min() o un LIMIT 1 darebbe un valore '
                  'plausibile che descrive meta'' di cio'' che sta per succedere. I due min() '
                  'qui ci sono, ma dentro un CASE che ha gia'' verificato che l''insieme abbia '
                  'un elemento solo. '
                  '⭐ registri_ids e'' l''elemento PORTANTE e non un extra: e'' cio'' su cui il '
                  'backend filtra per sezionale (decisione D-5), con %% = ANY(registri_ids). '
                  'Filtrare su registro_codice non funzionerebbe — su un gruppo '
                  'multi-sezionale e'' NULL per decisione, quindi il gruppo sparirebbe da '
                  'ENTRAMBI i filtri, cioe'' proprio quello che ha piu'' bisogno di essere '
                  'visto. La domanda giusta e'' «questo gruppo TOCCA quel sezionale?». '
                  '⭐ registri_n non e'' una seconda verita'': e'' cardinality(registri_ids), la '
                  'stessa espressione con due nomi, calcolata nella stessa vista. '
                  '⚠️ array_agg INCLUDE i NULL mentre count(DISTINCT) li scarta in silenzio: '
                  'e'' cosi'' che un gruppo con una riga risolta e una NON risolvibile conta 2 '
                  'e legge «piu'' registri», invece di mostrare un sezionale solo. E su un '
                  'gruppo interamente fatturato — dove la previsione e'' azzerata a monte per '
                  'la decisione D-9 — l''array e'' {NULL}, cardinalita'' 1, con codice e data a '
                  'NULL: a video «—». '
                  '⛔ La frase «piu'' registri» NON nasce qui (decisione D-4): il database dice '
                  'QUANTI sono, il testo lo mette BE/FE. Una vista che restituisse quella '
                  'stringa scriverebbe italiano dentro il database, e il prodotto ha it.json '
                  'E en.json; il precedente giusto e'' in questa stessa vista, dove '
                  'tipo_gruppo restituisce un CODICE e non una frase.';
