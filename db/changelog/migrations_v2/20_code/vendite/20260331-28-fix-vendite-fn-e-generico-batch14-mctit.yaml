    - changeSet:
          id: 20260331-28-fix-fn-start-lotto-task-run
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_start_lotto_task_run: 3x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 3x E_GENERICO → E_PARAMETRO_INVALIDO
                        CREATE OR REPLACE FUNCTION vendite.fn_start_lotto_task_run(
                            p_lotto_id             vendite.fatturazione_lotti.id%TYPE,
                            p_pipeline_id          vendite.fatturazione_pipeline.id%TYPE,
                            p_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE,
                            p_task_code            vendite.fatturazione_lotti_task_runs.task_code%TYPE,
                            p_fase                 CHARACTER VARYING DEFAULT NULL,
                            p_meta                 JSONB DEFAULT '{}'
                        )
                        RETURNS TABLE(task_run_id BIGINT, tentativo SMALLINT)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_tentativo vendite.fatturazione_lotti_task_runs.tentativo%TYPE;
                        BEGIN
                            IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_start_lotto_task_run', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                            END IF;
                            IF p_pipeline_id IS NULL OR p_pipeline_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_start_lotto_task_run', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_pipeline_id', 'valore', p_pipeline_id), NULL::uuid, 'p_pipeline_id obbligatorio e > 0');
                            END IF;
                            IF p_task_code IS NULL OR btrim(p_task_code) = '' THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_start_lotto_task_run', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_task_code', 'valore', p_task_code), NULL::uuid, 'p_task_code obbligatorio');
                            END IF;

                            SELECT COALESCE(MAX(r.tentativo), 0)::SMALLINT + 1 INTO v_tentativo
                              FROM vendite.fatturazione_lotti_task_runs r
                             WHERE r.lotto_id = p_lotto_id AND r.task_code = p_task_code
                               AND r.stato_doc_fiscale_id IS NOT DISTINCT FROM p_stato_doc_fiscale_id::INTEGER;

                            RETURN QUERY
                            INSERT INTO vendite.fatturazione_lotti_task_runs AS r (
                                lotto_id, pipeline_id, stato_doc_fiscale_id, task_code, fase, tentativo,
                                task_stato, started_at, ended_at, error_code, error_message, meta,
                                attivo, data_insert, user_insert, data_update, user_update
                            ) VALUES (
                                p_lotto_id, p_pipeline_id, p_stato_doc_fiscale_id::INTEGER, p_task_code, p_fase, v_tentativo,
                                'IN_ESECUZIONE', now(), NULL, NULL, NULL, COALESCE(p_meta, '{}'::JSONB),
                                TRUE, now(), current_user, now(), current_user
                            ) RETURNING r.id, r.tentativo;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_start_lotto_task_run(BIGINT, BIGINT, BIGINT, CHARACTER VARYING, CHARACTER VARYING, JSONB)
                          IS 'Apre task run lotto in stato IN_ESECUZIONE e incrementa tentativo.';

    - changeSet:
          id: 20260331-28-fix-fn-sync-contabili-fondo-fattura
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_sync_contabili_fondo_fattura: 3x E_GENERICO →
              E_PARAMETRO_INVALIDO + E_CONFIG_MANCANTE (2).
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 3x E_GENERICO → codici specifici
                        CREATE OR REPLACE FUNCTION vendite.fn_sync_contabili_fondo_fattura(
                            p_fattura_figlia_id vendite.fatture.id%TYPE
                        )
                        RETURNS TABLE(inserted_righe INTEGER, updated_righe INTEGER, annullati_source INTEGER)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_centro_fondo_id  pagamenti.centri_riscossione.id%TYPE;
                            v_stato_contabile_codice TEXT := 'VALIDATA';
                            v_stato_riga_id    pagamenti.vendite_contabili_righe_stati.id%TYPE;
                            v_inserted INTEGER := 0;
                            v_updated  INTEGER := 0;
                            v_annullati INTEGER := 0;
                            v_riga_id      pagamenti.vendite_contabili_righe.id%TYPE;
                            v_contabile_id pagamenti.vendite_contabili.id%TYPE;
                            v_lotto_id     vendite.fatturazione_lotti.id%TYPE;
                            v_data_valuta  pagamenti.vendite_contabili_righe.data_valuta%TYPE;
                            v_saldo NUMERIC;
                            v_has_movimenti BOOLEAN;
                            v_saldo_contabile_tot NUMERIC;
                            v_has_righe_postabili BOOLEAN;
                            v_saldo_contabile_source NUMERIC;
                            v_saldo_effettivo NUMERIC;
                            r RECORD;
                        BEGIN
                            IF p_fattura_figlia_id IS NULL OR p_fattura_figlia_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_contabili_fondo_fattura', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_fattura_figlia_id', 'valore', p_fattura_figlia_id), NULL::uuid, 'p_fattura_figlia_id obbligatorio e > 0');
                            END IF;

                            -- Centro riscossione fondo fattura
                            SELECT c.id INTO v_centro_fondo_id FROM pagamenti.centri_riscossione c WHERE c.attivo IS TRUE AND c.is_fondo_fattura IS TRUE ORDER BY c.id LIMIT 1;

                            IF v_centro_fondo_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_contabili_fondo_fattura', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('config', 'centri_riscossione.is_fondo_fattura'), NULL::uuid, 'centro riscossione fondo fattura non configurato');
                            END IF;

                            -- Stato riga contabile target
                            SELECT s.id INTO v_stato_riga_id FROM pagamenti.vendite_contabili_righe_stati s WHERE s.attivo IS TRUE AND s.codice_interno = 'ABBINATA' LIMIT 1;
                            IF v_stato_riga_id IS NULL THEN
                                SELECT s.id INTO v_stato_riga_id FROM pagamenti.vendite_contabili_righe_stati s WHERE s.attivo IS TRUE ORDER BY s.id LIMIT 1;
                            END IF;
                            IF v_stato_riga_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_contabili_fondo_fattura', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('config', 'vendite_contabili_righe_stati'), NULL::uuid, 'stato riga contabile non configurato');
                            END IF;

                            -- Lotto associato
                            SELECT lf.lotto_id INTO v_lotto_id FROM vendite.fatturazione_lotti_fatture lf WHERE lf.fattura_id = p_fattura_figlia_id ORDER BY lf.id DESC LIMIT 1;

                            -- Loop fondi assegnati
                            FOR r IN
                                SELECT s.id AS source_id, s.fattura_sorgente_id, s.importo, s.billing_account_id, fsrc.data AS data_fattura_sorgente
                                  FROM vendite.fatture_fondi_fattura_source s
                                  JOIN vendite.tipi_fondi_fattura t ON t.id = s.tipo_fondo_fattura_id
                                  JOIN vendite.fatture fsrc ON fsrc.id = s.fattura_sorgente_id
                                 WHERE s.fattura_figlia_id = p_fattura_figlia_id AND s.attivo IS TRUE AND s.stato = 'ASSEGNATO' AND t.codice_interno = 'F_F_ADD_ACC'
                                 ORDER BY s.id
                            LOOP
                                SELECT sf.saldo, sf.has_movimenti INTO v_saldo, v_has_movimenti FROM pagamenti.fn_get_saldo_fattura(r.fattura_sorgente_id) sf;
                                SELECT sc.saldo_contabile, sc.has_righe_postabili INTO v_saldo_contabile_tot, v_has_righe_postabili FROM pagamenti.fn_get_saldo_fattura_contabili(r.fattura_sorgente_id) sc;

                                SELECT COALESCE(SUM(cr.importo), 0)::NUMERIC INTO v_saldo_contabile_source
                                  FROM pagamenti.vendite_contabili_righe cr
                                  JOIN pagamenti.vendite_contabili_righe_stati st ON st.id = cr.stato_id
                                 WHERE cr.attivo IS TRUE AND st.is_postabile IS TRUE AND cr.fattura_id = r.fattura_sorgente_id
                                   AND COALESCE(cr.meta->>'origine', '') = 'FONDO_FATTURA' AND COALESCE(cr.meta->>'fondo_source_id', '') = r.source_id::TEXT;

                                v_saldo_effettivo := COALESCE(v_saldo, 0) - (COALESCE(v_saldo_contabile_tot, 0) - COALESCE(v_saldo_contabile_source, 0));

                                IF COALESCE(v_saldo_effettivo, 0) = 0 THEN
                                    UPDATE vendite.fatture_fondi_fattura_source s SET stato = 'ANNULLATO', data_update = now(), user_update = current_user WHERE s.id = r.source_id AND s.stato IS DISTINCT FROM 'ANNULLATO';
                                    IF FOUND THEN v_annullati := v_annullati + 1; END IF;
                                    CONTINUE;
                                END IF;

                                v_data_valuta := CASE WHEN current_date > r.data_fattura_sorgente THEN current_date ELSE r.data_fattura_sorgente END;

                                v_contabile_id := pagamenti.fn_get_or_create_vendite_contabile(
                                    p_centro_riscossione_id => v_centro_fondo_id, p_data_contabile => r.data_fattura_sorgente,
                                    p_data_registrazione => r.data_fattura_sorgente, p_ente_incasso_id => NULL, p_lotto_id => v_lotto_id,
                                    p_codice_stato_interno => v_stato_contabile_codice,
                                    p_meta => jsonb_build_object('origine', 'FONDO_FATTURA', 'fattura_figlia_id', p_fattura_figlia_id));

                                SELECT cr.id INTO v_riga_id FROM pagamenti.vendite_contabili_righe cr
                                 WHERE cr.attivo IS TRUE AND COALESCE(cr.meta->>'origine', '') = 'FONDO_FATTURA' AND COALESCE(cr.meta->>'fondo_source_id', '') = r.source_id::TEXT ORDER BY cr.id DESC LIMIT 1;

                                IF v_riga_id IS NULL THEN
                                    INSERT INTO pagamenti.vendite_contabili_righe (contabile_id, riferimento_ente, data_pagamento, data_valuta, data_operazione, importo, fattura_id, billing_account_id, stato_id, motivo_sospeso, meta, attivo, data_insert, user_insert, data_update, user_update)
                                    VALUES (v_contabile_id, concat('FONDO_SRC_', r.source_id::TEXT), r.data_fattura_sorgente, v_data_valuta, now(), r.importo, r.fattura_sorgente_id, r.billing_account_id, v_stato_riga_id, NULL, jsonb_build_object('origine', 'FONDO_FATTURA', 'fondo_source_id', r.source_id, 'fattura_figlia_id', p_fattura_figlia_id), TRUE, now(), current_user, now(), current_user);
                                    v_inserted := v_inserted + 1;
                                ELSE
                                    UPDATE pagamenti.vendite_contabili_righe cr SET contabile_id = v_contabile_id, riferimento_ente = concat('FONDO_SRC_', r.source_id::TEXT), data_pagamento = r.data_fattura_sorgente, data_valuta = v_data_valuta, data_operazione = r.data_fattura_sorgente, importo = r.importo, fattura_id = r.fattura_sorgente_id, billing_account_id = r.billing_account_id, stato_id = v_stato_riga_id, motivo_sospeso = NULL, meta = COALESCE(cr.meta, '{}'::JSONB) || jsonb_build_object('origine', 'FONDO_FATTURA', 'fondo_source_id', r.source_id, 'fattura_figlia_id', p_fattura_figlia_id), data_update = now(), user_update = current_user WHERE cr.id = v_riga_id;
                                    v_updated := v_updated + 1;
                                END IF;
                            END LOOP;

                            RETURN QUERY SELECT v_inserted, v_updated, v_annullati;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_sync_contabili_fondo_fattura(BIGINT)
                          IS 'Sync righe contabili fondi fattura assegnati. Annulla source a saldo effettivo zero.';

    - changeSet:
          id: 20260331-28-fix-fn-sync-lotto-fatture-stato
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_sync_lotto_fatture_stato: 4x E_GENERICO →
              E_PARAMETRO_INVALIDO (2) + E_LOTTO_NON_TROVATO (1) + E_PARAMETRO_INVALIDO (1).
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 4x E_GENERICO → codici specifici
                        CREATE OR REPLACE FUNCTION vendite.fn_sync_lotto_fatture_stato(
                            p_lotto_id                    vendite.fatturazione_lotti.id%TYPE,
                            p_target_stato_doc_fiscale_id config.stati_doc_fiscale.id%TYPE DEFAULT NULL
                        )
                        RETURNS void
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_stato_lotto vendite.fatturazione_lotti.stato_doc_fiscale_id%TYPE;
                            v_target      config.stati_doc_fiscale.id%TYPE;
                            v_tipo_lotto  vendite.fatturazione_lotti.tipo_lotto%TYPE;
                            v_inviata_id  config.stati_doc_fiscale.id%TYPE;
                        BEGIN
                            IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_lotto_fatture_stato', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id), NULL::uuid, 'p_lotto_id obbligatorio e > 0');
                            END IF;

                            IF p_target_stato_doc_fiscale_id IS NOT NULL AND p_target_stato_doc_fiscale_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_lotto_fatture_stato', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_target_stato_doc_fiscale_id', 'valore', p_target_stato_doc_fiscale_id), NULL::uuid, 'p_target_stato_doc_fiscale_id se fornito deve essere > 0');
                            END IF;

                            SELECT tipo_lotto, stato_doc_fiscale_id INTO v_tipo_lotto, v_stato_lotto
                              FROM vendite.fatturazione_lotti WHERE id = p_lotto_id FOR UPDATE;

                            IF v_stato_lotto IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_lotto_fatture_stato', 'E_LOTTO_NON_TROVATO',
                                    jsonb_build_object('lotto_id', p_lotto_id), NULL::uuid, p_lotto_id::text);
                            END IF;

                            v_target := COALESCE(p_target_stato_doc_fiscale_id, v_stato_lotto);

                            IF v_target IS NULL THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_lotto_fatture_stato', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'stato_doc_fiscale_target', 'lotto_id', p_lotto_id), NULL::uuid, concat('stato_doc_fiscale target obbligatorio per lotto ', p_lotto_id));
                            END IF;

                            -- Allinea stato fatture (escluse critical e escluse)
                            UPDATE vendite.fatture f SET stato_doc_fiscale_id = v_target, data_update = now(), user_update = current_user
                              FROM vendite.fatturazione_lotti_fatture lf
                             WHERE lf.lotto_id = p_lotto_id AND COALESCE(lf.esclusa, FALSE) IS FALSE AND lf.fattura_id = f.id
                               AND COALESCE(f.critical, FALSE) IS FALSE AND f.stato_doc_fiscale_id IS DISTINCT FROM v_target;

                            -- Sync stato_esecuzione sul ponte
                            UPDATE vendite.fatturazione_lotti_fatture lf
                               SET stato_doc_fiscale_id = f.stato_doc_fiscale_id,
                                   stato_esecuzione = vendite.fn_resolve_stato_esecuzione(
                                       p_stato_source => 'COMPLETATO', p_current_stato_esecuzione => lf.stato_esecuzione,
                                       p_has_critical => COALESCE(f.critical, FALSE), p_esclusa => COALESCE(lf.esclusa, FALSE),
                                       p_fatturato => FALSE, p_default_stato_esecuzione => 'COMPLETED'),
                                   data_update = now(), user_update = current_user
                              FROM vendite.fatture f WHERE lf.lotto_id = p_lotto_id AND lf.fattura_id = f.id;

                            -- GIORNALIERO + INVIATA → chiusura lotto
                            IF v_tipo_lotto = 'GIORNALIERO' THEN
                                SELECT id INTO v_inviata_id FROM config.stati_doc_fiscale WHERE codice_interno = 'INVIATA' AND attivo IS TRUE ORDER BY ordine LIMIT 1;
                                IF v_inviata_id IS NOT NULL AND v_target = v_inviata_id THEN
                                    UPDATE vendite.fatturazione_lotti SET stato_operativo = 'CHIUSO', data_update = now(), user_update = current_user WHERE id = p_lotto_id;
                                END IF;
                            END IF;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_sync_lotto_fatture_stato(BIGINT, BIGINT)
                          IS 'Allinea stato fatture del lotto e sincronizza stato_esecuzione. GIORNALIERO+INVIATA chiude lotto.';

    - changeSet:
          id: 20260331-28-fix-fn-sync-pagamento-fondo-fattura
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_sync_pagamento_fondo_fattura: 1x E_GENERICO → E_PARAMETRO_INVALIDO.
              Wrapper deprecato.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- Fix 20260331: 1x E_GENERICO → E_PARAMETRO_INVALIDO (wrapper deprecato)
                        CREATE OR REPLACE FUNCTION vendite.fn_sync_pagamento_fondo_fattura(
                            p_fattura_figlia_id vendite.fatture.id%TYPE
                        )
                        RETURNS TABLE(inserted_movimenti INTEGER, updated_movimenti INTEGER, annullati_source INTEGER)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_inserted INTEGER := 0;
                            v_updated  INTEGER := 0;
                            v_annullati INTEGER := 0;
                        BEGIN
                            IF p_fattura_figlia_id IS NULL OR p_fattura_figlia_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_sync_pagamento_fondo_fattura', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_fattura_figlia_id', 'valore', p_fattura_figlia_id), NULL::uuid, 'p_fattura_figlia_id obbligatorio e > 0');
                            END IF;

                            SELECT s.inserted_righe, s.updated_righe, s.annullati_source INTO v_inserted, v_updated, v_annullati
                              FROM vendite.fn_sync_contabili_fondo_fattura(p_fattura_figlia_id => p_fattura_figlia_id) s;

                            RETURN QUERY SELECT v_inserted, v_updated, v_annullati;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_sync_pagamento_fondo_fattura(BIGINT)
                          IS 'Wrapper deprecato: delega a fn_sync_contabili_fondo_fattura.';
