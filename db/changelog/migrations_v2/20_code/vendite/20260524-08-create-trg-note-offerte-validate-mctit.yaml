# ------------------------------------------------------------
# Trigger specifici per vendite.note_offerte_commerciali:
#
#   trg_note_offerte_commerciali_validate_ins_upd
#     BEFORE INSERT OR UPDATE
#     -> script.trgfn_note_validate_generic(
#            'vendite.offerte_commerciali_eccezioni', 'offerta_id', 'OFFERTA_COMMERCIALE')
#     Verifica che target_riga_id, quando valorizzato, punti a una riga
#     che appartiene effettivamente all'offerta (target_id) dichiarata.
#
#   trg_note_offerte_commerciali_a10_eccezioni_require_attivo_ins_upd
#     AFTER INSERT OR UPDATE
#     -> dbops.trgfn_child_requires_active_parent(
#            'vendite', 'offerte_commerciali_eccezioni', 'attivo', 'target_riga_id', 'id')
#     Blocca note su righe disattivate.
#
# Audit (audit_data_user) e tx_id sono gestiti da automation_rules (*all).
#
# Dipendenze:
#   - vendite.note_offerte_commerciali (migration 20260524-07)
#   - script.trgfn_note_validate_generic
#   - dbops.trgfn_child_requires_active_parent
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260524-08-create-trg-note-offerte-validate-mctit.yaml

  - changeSet:
      id: 20260524-08-create-trg-note-offerte-validate
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Trigger validate e require_attivo per vendite.note_offerte_commerciali.
        Pattern identico a note_contratto e note_preventivo.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: note_offerte_commerciali
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Trigger: valida coerenza target_riga_id con l'offerta dichiarata.
              -- target_riga_id, se valorizzato, deve appartenere all'offerta indicata
              -- in target_id (colonna offerta_id su offerte_commerciali_eccezioni).
              DROP TRIGGER IF EXISTS trg_note_offerte_commerciali_validate_ins_upd
                  ON vendite.note_offerte_commerciali;

              CREATE TRIGGER trg_note_offerte_commerciali_validate_ins_upd
              BEFORE INSERT OR UPDATE ON vendite.note_offerte_commerciali
              FOR EACH ROW
              EXECUTE FUNCTION script.trgfn_note_validate_generic(
                  'vendite.offerte_commerciali_eccezioni',
                  'offerta_id',
                  'OFFERTA'
              );

              -- Trigger: blocca note su eccezioni disattivate.
              DROP TRIGGER IF EXISTS trg_note_offerte_commerciali_a10_eccezioni_require_attivo_ins_upd
                  ON vendite.note_offerte_commerciali;

              CREATE TRIGGER trg_note_offerte_commerciali_a10_eccezioni_require_attivo_ins_upd
              AFTER INSERT OR UPDATE ON vendite.note_offerte_commerciali
              FOR EACH ROW
              EXECUTE FUNCTION dbops.trgfn_child_requires_active_parent(
                  'vendite',
                  'offerte_commerciali_eccezioni',
                  'attivo',
                  'target_riga_id',
                  'id'
              );
