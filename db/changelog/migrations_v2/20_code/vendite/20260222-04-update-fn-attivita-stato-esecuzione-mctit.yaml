databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260222-04-update-fn-attivita-stato-esecuzione-mctit.yaml

  - changeSet:
      id: 20260222-04-01-update-fn-select-attivita-fatturabili-stato-esecuzione
      author: mctit
      comment: "Imposta stato_esecuzione=PENDING quando locka attivita per lotto"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_select_attivita_fatturabili(
                p_competenza_mese vendite.attivita_fatturabili.competenza_mese%TYPE,
                p_tipo_doc_fiscale_id config.tipi_doc_fiscale.id%TYPE,
                p_lock_batch_id vendite.attivita_fatturabili.lock_batch_id%TYPE DEFAULT NULL,
                p_lock boolean DEFAULT false,
                p_data_fatturazione date DEFAULT CURRENT_DATE,
                p_billing_account_id anagrafiche.billing_account.id%TYPE DEFAULT NULL,
                p_utility_id config.utilities.id%TYPE DEFAULT NULL,
                p_valuta_id config.valute.id%TYPE DEFAULT NULL,
                p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE DEFAULT NULL,
                p_area_geografica_id vendite.area_geografica_fatturazione.id%TYPE DEFAULT NULL,
                p_limit integer DEFAULT NULL
              )
              RETURNS SETOF vendite.attivita_fatturabili
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_competenza date;
                v_data_fatturazione date;
                v_where text;
                v_limit text;
                v_sql text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Seleziona attivita_fatturabili eleggibili con lock opzionale.
                --
                -- Regole:
                --   - tipo_doc_fiscale obbligatorio
                --   - competenza_mese obbligatoria (mese di fatturazione)
                --   - con lock imposta stato_esecuzione='PENDING'
                -- =========================================================

                IF p_competenza_mese IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_select_attivita_fatturabili', 'E_GENERICO',
                    jsonb_build_object('detail','competenza_mese obbligatoria'),
                    NULL::uuid, 'competenza_mese obbligatoria'
                  );
                END IF;

                IF p_tipo_doc_fiscale_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_select_attivita_fatturabili', 'E_GENERICO',
                    jsonb_build_object('detail','tipo_doc_fiscale_id obbligatorio'),
                    NULL::uuid, 'tipo_doc_fiscale_id obbligatorio'
                  );
                END IF;

                IF p_lock AND p_lock_batch_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_select_attivita_fatturabili', 'E_GENERICO',
                    jsonb_build_object('detail','lock_batch_id obbligatorio quando p_lock=true'),
                    NULL::uuid, 'lock_batch_id obbligatorio quando p_lock=true'
                  );
                END IF;

                v_competenza := date_trunc('month', p_competenza_mese)::date;
                v_data_fatturazione := COALESCE(p_data_fatturazione, CURRENT_DATE);

                v_where :=
                  ' WHERE a.approvato IS TRUE' ||
                  ' AND a.fatturato IS FALSE' ||
                  ' AND a.sospesa IS FALSE' ||
                  ' AND COALESCE(a.lock_in_fatturazione, false) IS FALSE' ||
                  ' AND (a.posticipa_al IS NULL OR a.posticipa_al <= ' || quote_literal(v_data_fatturazione) || ')' ||
                  ' AND a.competenza_mese <= ' || quote_literal(v_competenza) ||
                  ' AND a.tipo_doc_fiscale_id = ' || quote_literal(p_tipo_doc_fiscale_id);

                IF p_billing_account_id IS NOT NULL THEN
                  v_where := v_where || ' AND a.billing_account_id = ' || quote_literal(p_billing_account_id);
                END IF;

                IF p_utility_id IS NOT NULL THEN
                  v_where := v_where || ' AND ba.utility_id = ' || quote_literal(p_utility_id);
                END IF;

                IF p_valuta_id IS NOT NULL THEN
                  v_where := v_where || ' AND a.valuta_id = ' || quote_literal(p_valuta_id);
                END IF;

                IF p_emittente_soggetto_ruolo_id IS NOT NULL THEN
                  v_where := v_where ||
                    ' AND a.billing_account_id IS NOT NULL' ||
                    ' AND anagrafiche.fn_get_emittente_fiscale_id(a.billing_account_id) = ' ||
                    quote_literal(p_emittente_soggetto_ruolo_id);
                END IF;

                IF p_area_geografica_id IS NOT NULL THEN
                  v_where := v_where || ' AND a.area_geografica_id = ' || quote_literal(p_area_geografica_id);
                END IF;

                v_limit := CASE WHEN p_limit IS NOT NULL THEN ' LIMIT ' || p_limit::text ELSE '' END;

                IF p_lock THEN
                  v_sql :=
                    'WITH candidati AS (' ||
                    '  SELECT a.id' ||
                    '    FROM vendite.attivita_fatturabili a' ||
                    '    JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' ||
                         v_where ||
                    '   ORDER BY a.data_attivita, a.id' ||
                         v_limit ||
                    '   FOR UPDATE SKIP LOCKED' ||
                    ')' ||
                    ' UPDATE vendite.attivita_fatturabili a' ||
                    '    SET lock_in_fatturazione = true,' ||
                    '        lock_batch_id = ' || quote_literal(p_lock_batch_id) || ',' ||
                    '        stato_esecuzione = ''PENDING'',' ||
                    '        data_update = now(),' ||
                    '        user_update = current_user' ||
                    '   FROM candidati c' ||
                    '  WHERE a.id = c.id' ||
                    '    AND a.fatturato IS FALSE' ||
                    '    AND COALESCE(a.lock_in_fatturazione, false) IS FALSE' ||
                    ' RETURNING a.*';
                ELSE
                  v_sql :=
                    'WITH candidati AS (' ||
                    '  SELECT a.id' ||
                    '    FROM vendite.attivita_fatturabili a' ||
                    '    JOIN anagrafiche.billing_account ba ON ba.id = a.billing_account_id' ||
                         v_where ||
                    '   ORDER BY a.data_attivita, a.id' ||
                         v_limit ||
                    ')' ||
                    ' SELECT a.*' ||
                    '   FROM vendite.attivita_fatturabili a' ||
                    '   JOIN candidati c ON c.id = a.id' ||
                    '  ORDER BY a.data_attivita, a.id';
                END IF;

                RETURN QUERY EXECUTE v_sql;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_select_attivita_fatturabili(
                vendite.attivita_fatturabili.competenza_mese%TYPE,
                config.tipi_doc_fiscale.id%TYPE,
                vendite.attivita_fatturabili.lock_batch_id%TYPE,
                boolean,
                date,
                anagrafiche.billing_account.id%TYPE,
                config.utilities.id%TYPE,
                config.valute.id%TYPE,
                anagrafiche.soggetti_ruoli.id%TYPE,
                vendite.area_geografica_fatturazione.id%TYPE,
                integer
              ) IS 'Select attivita_fatturabili con lock opzionale e stato_esecuzione=PENDING in lock.';

  - changeSet:
      id: 20260222-04-02-update-fn-generate-fatture-righe-stato-esecuzione
      author: mctit
      comment: "Aggiorna stato_esecuzione attivita su RUNNING/COMPLETED durante generazione righe"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_generate_fatture_righe(
                p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                p_dry_run boolean DEFAULT false
              )
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_count integer := 0;
                v_row record;
                v_fattura_id vendite.fatture.id%TYPE;
                v_group jsonb;
                v_riga_nr integer;
                v_fattura_riga_id vendite.fatture_righe.id%TYPE;
                v_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Genera le righe fattura da attivita lockate sul lotto e
                --   mantiene allineato stato_esecuzione sulle attivita.
                --
                -- Regole:
                --   - prima dell'esecuzione: PENDING -> RUNNING
                --   - a riga creata: stato_esecuzione -> COMPLETED
                --   - in dry_run: nessuna mutazione stato
                -- =========================================================

                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite', 'fn_generate_fatture_righe', 'E_GENERICO',
                    jsonb_build_object(
                      'scope','FATTURA',
                      'severity','C',
                      'code','E_GENERICO',
                      'lotto_id', p_lotto_id,
                      'fattura_id', NULL,
                      'context', jsonb_build_object('detail','lotto_id obbligatorio', 'lotto_id', p_lotto_id)
                    ),
                    NULL::uuid, 'lotto_id obbligatorio'
                  );
                END IF;

                SELECT fl.lock_batch_id
                  INTO v_lock_batch_id
                  FROM vendite.fatturazione_lotti fl
                 WHERE fl.id = p_lotto_id;

                IF NOT p_dry_run AND v_lock_batch_id IS NOT NULL THEN
                  UPDATE vendite.attivita_fatturabili a
                     SET stato_esecuzione = 'RUNNING',
                         data_update = now(),
                         user_update = current_user
                   WHERE a.lock_batch_id = v_lock_batch_id
                     AND a.fatturato IS FALSE
                     AND COALESCE(a.lock_in_fatturazione, false) IS TRUE
                     AND (
                       a.stato_esecuzione IS NULL
                       OR a.stato_esecuzione IN ('PENDING','RUNNING')
                     );
                END IF;

                FOR v_row IN
                  SELECT a.id, a.articolo_id, a.quantita, a.prezzo_unitario,
                         a.uom_id, a.sorgente_tipo_id, a.sorgente_uid, a.sorgente_riga
                    FROM vendite.attivita_fatturabili a
                   WHERE a.lock_batch_id = v_lock_batch_id
                     AND a.fatturato IS FALSE
                     AND COALESCE(a.lock_in_fatturazione, false) IS TRUE
                   ORDER BY a.id
                LOOP
                  v_fattura_id := vendite.fn_get_or_create_fattura_header(p_lotto_id, v_row.id);
                  v_group := vendite.fn_group_attivita_fatturabili(v_row.id);

                  IF p_dry_run THEN
                    v_count := v_count + 1;
                    CONTINUE;
                  END IF;

                  SELECT COALESCE(max(r.riga_nr), 0) + 1
                    INTO v_riga_nr
                    FROM vendite.fatture_righe r
                   WHERE r.fattura_id = v_fattura_id;

                  INSERT INTO vendite.fatture_righe (
                    fattura_id,
                    riga_nr,
                    articolo_id,
                    descrizione,
                    uom_id,
                    qta,
                    prezzo_unitario,
                    iva_id,
                    dest_billing_account_id,
                    sorgente_tipo_id,
                    sorgente_uid,
                    sorgente_riga,
                    meta
                  )
                  VALUES (
                    v_fattura_id,
                    v_riga_nr,
                    v_row.articolo_id,
                    (SELECT descrizione FROM catalogo.articoli WHERE id = v_row.articolo_id),
                    (v_group->>'uom_id')::bigint,
                    v_row.quantita,
                    v_row.prezzo_unitario,
                    (v_group->>'iva_id')::integer,
                    (v_group->>'dest_billing_account_id')::bigint,
                    v_row.sorgente_tipo_id,
                    v_row.sorgente_uid,
                    v_row.sorgente_riga,
                    jsonb_build_object('group_key', v_group)
                  )
                  RETURNING id
                  INTO v_fattura_riga_id;

                  UPDATE vendite.attivita_fatturabili
                     SET fattura_riga_id = v_fattura_riga_id,
                         fatturato = true,
                         stato_esecuzione = 'COMPLETED',
                         data_update = now(),
                         user_update = current_user
                   WHERE id = v_row.id;

                  v_count := v_count + 1;
                END LOOP;

                RETURN v_count;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_generate_fatture_righe(bigint, boolean)
              IS 'Genera righe fattura da attivita lockate e aggiorna stato_esecuzione (RUNNING/COMPLETED).';

  - changeSet:
      id: 20260222-04-03-update-fn-cleanup-fatture-by-ids-reset-stato-esecuzione
      author: mctit
      comment: "Resetta stato_esecuzione a NULL nel ripristino attivita"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_cleanup_fatture_by_ids(
                p_fatture_ids bigint[],
                p_lock_batch_id vendite.fatturazione_lotti.lock_batch_id%TYPE
              )
              RETURNS TABLE(
                deleted_fatture integer,
                deleted_righe integer,
                updated_attivita integer
              )
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_righe_ids bigint[];
                v_deleted_fatture integer := 0;
                v_deleted_righe integer := 0;
                v_updated_attivita integer := 0;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Cleanup centralizzato di fatture/righe e ripristino
                --   attivita_fatturabili collegate.
                --
                -- Regole:
                --   - usa GUC di manutenzione per bypass guard fatturato
                --   - su ripristino: stato_esecuzione torna a NULL
                -- =========================================================
                IF p_fatture_ids IS NULL OR array_length(p_fatture_ids, 1) IS NULL THEN
                  RETURN QUERY SELECT 0, 0, 0;
                  RETURN;
                END IF;

                PERFORM set_config('zeroerp.maintenance_reset_lotto_draft', 'on', true);

                PERFORM vendite.fn_reset_fondi_fattura(f_id)
                  FROM unnest(p_fatture_ids) AS f_id;

                SELECT array_agg(r.id)
                  INTO v_righe_ids
                  FROM vendite.fatture_righe r
                 WHERE r.fattura_id = ANY(p_fatture_ids);

                IF v_righe_ids IS NULL THEN
                  v_righe_ids := ARRAY[]::bigint[];
                END IF;

                DELETE FROM vendite.note
                 WHERE target_tipo = 'FATTURA'
                   AND target_riga_id = ANY(v_righe_ids);

                DELETE FROM vendite.note
                 WHERE target_tipo = 'FATTURA'
                   AND target_id = ANY(p_fatture_ids);

                DELETE FROM vendite.fatture_riepiloghi_iva
                 WHERE fattura_id = ANY(p_fatture_ids);

                DELETE FROM vendite.fatture_righe
                 WHERE fattura_id = ANY(p_fatture_ids);
                GET DIAGNOSTICS v_deleted_righe = ROW_COUNT;

                DELETE FROM vendite.fatture_log
                 WHERE fattura_id = ANY(p_fatture_ids);

                DELETE FROM vendite.fatturazione_lotti_fatture
                 WHERE fattura_id = ANY(p_fatture_ids);

                DELETE FROM vendite.fatture
                 WHERE id = ANY(p_fatture_ids);
                GET DIAGNOSTICS v_deleted_fatture = ROW_COUNT;

                UPDATE vendite.attivita_fatturabili
                   SET lock_in_fatturazione = false,
                       lock_batch_id = NULL,
                       fatturato = false,
                       fattura_riga_id = NULL,
                       stato_esecuzione = NULL,
                       data_update = now(),
                       user_update = current_user
                 WHERE (p_lock_batch_id IS NOT NULL AND lock_batch_id = p_lock_batch_id)
                    OR fattura_riga_id = ANY(v_righe_ids);
                GET DIAGNOSTICS v_updated_attivita = ROW_COUNT;

                RETURN QUERY
                SELECT v_deleted_fatture, v_deleted_righe, v_updated_attivita;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_cleanup_fatture_by_ids(bigint[], uuid)
                IS 'Cleanup centralizzato fatture/righe con ripristino attivita e reset stato_esecuzione=NULL.';
