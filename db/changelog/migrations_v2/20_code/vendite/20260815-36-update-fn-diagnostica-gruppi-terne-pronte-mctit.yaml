# La diagnostica dice anche IN QUALE CORSIA sta il lavoro ancora pronto.
#   Risposta alla domanda §10.6 del BE in
#   brief-db-emittibilita-visibile-e-sbloccabile.
#
# ── 🟠 LA DOMANDA ────────────────────────────────────────────────────────
#   In un giro mirato PARZIALE con una terna andata in errore, i gruppi di
#   quella terna hanno ancora righe da emettere: il consuntivo li dichiara
#   `NON_SERVITO`, giustamente. Il BE pero' su ogni `NON_SERVITO` fa girare la
#   diagnosi di perimetro, che risponde con la causa piu' prossima che vede —
#   «verificare emittente e utility della commessa». Emittente e utility sono a
#   posto: e' la pipeline che si e' rotta, magari per un lock transiente.
#   L'operatore viene mandato a controllare una cosa giusta, e non sa che
#   basterebbe riprovare.
#
#   Il BE **non l'ha chiusa da solo**, ed e' la parte che merita rispetto:
#   l'unico modo che aveva era rimettere in gioco `gruppi_coperti`, cioe' la
#   PREVISIONE che il §9.7 ha chiesto di togliere. Ha preferito la domanda a un
#   rimedio che disfaceva in silenzio una decisione presa insieme.
#
# ── ⭐ LA RISPOSTA: NON SERVE UNA PREVISIONE, SERVE UNA MISURA ───────────
#   La corsia di un gruppo non va prevista: si **misura adesso**. Le righe
#   ancora pronte di un gruppo portano gia' la terna con se' —
#   `commesse.emittente_soggetto_ruolo_id`, `commesse_attivita.tipo_doc_fiscale_id`,
#   `commesse.utility_id` — e sono esattamente le tre colonne su cui
#   `fn_list_emittibili_lane` raggruppa. Non e' «quale corsia la discovery
#   pensava»: e' «in quale corsia questo lavoro **ricade**, in questo momento».
#
#   Il BE ha gia' dall'altra parte il pezzo che gli manca: le terne FALLITE
#   stanno in `summary['esiti']` con `ok: False`, e sono fatti, non stime.
#   Intersecando le due cose sa distinguere:
#
#     gruppo pronto la cui terna e' fra le fallite -> l'ESECUZIONE si e' rotta,
#         si riprova, e la diagnosi di perimetro NON va raccontata;
#     gruppo pronto la cui terna non e' fra le fallite -> e' davvero perimetro,
#         e la diagnosi dice il vero.
#
#   E' la stessa distinzione che l'handler applica gia' sul giro VUOTO
#   («terne trovate ma pipeline fallita -> niente diagnosi di perimetro»),
#   portata dove finora non poteva arrivare.
#
# ── ℹ️ PERCHE' QUI E NON IN `fn_esito_gruppi_giro` ───────────────────────
#   Sembrava piu' naturale metterlo nel consuntivo, che i lotti del giro ce li
#   ha gia'. ⚠️ Ma il consuntivo NON conosce i criteri di «riga pronta»: il suo
#   `n_attivita_residue` conta le sole `NON_EMESSA`, ed e' deliberatamente
#   ottuso proprio per non ricopiare i filtri della lane. Per dire «in quale
#   corsia» servirebbero `APPROVATA` + tipo documento + competenza, cioe'
#   importare li' quei criteri: la duplicazione che questo cantiere ha passato
#   due settimane a togliere.
#   Qui invece quei criteri ci sono **gia'**, sono quelli con cui si calcola
#   `n_pronte`, e la corsia esce dalla stessa passata. Zero righe di regola in
#   piu'.
#
# ── ℹ️ PERCHE' UN ARRAY, E NON TRE COLONNE ───────────────────────────────
#   Un gruppo puo' stare su PIU' corsie: `tipo_doc_fiscale_id` sta sulla RIGA,
#   non sulla testata del documento (fatto G15, gia' il motivo per cui l'esito
#   verso il BE e' una lista di lotto_id). Tre colonne scalari avrebbero dovuto
#   scegliere una corsia sola, e la scelta sarebbe stata arbitraria; oppure
#   spaccare la grana in `(gruppo, commessa, tipo_doc)`, rompendo un contratto
#   che il BE ha adottato lo stesso giorno.
#   `terne_pronte jsonb` e' un array di oggetti con le tre chiavi, ORDINATO in
#   modo deterministico: due chiamate identiche danno lo stesso valore, e chi
#   confronta non vede differenze che non esistono.
#
# ⚠️ Vuoto (`[]`) quando `n_pronte = 0`, mai `NULL`: «nessuna riga pronta» e
#   «non calcolato» devono restare distinguibili — la stessa ambiguita' che il
#   `20260815-02` aveva gia' scelto di non creare su `gruppi_coperti`.
#
# ── ⚠️ SERVE UN DROP ─────────────────────────────────────────────────────
#   Cambia il `RETURNS TABLE`. Chiamanti DB: **zero**. Il BE la nomina colonna
#   per colonna (`commesse_repository.diagnostica_gruppi`), quindi **non si
#   rompe**: il campo nuovo e' opt-in, lo prende aggiungendolo alla SELECT.
#   I GRANT tornano da `ALTER DEFAULT PRIVILEGES` (ruolo titodb).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260815-36-update-fn-diagnostica-gruppi-terne-pronte-mctit.yaml

  - changeSet:
      id: 20260815-36-update-fn-diagnostica-gruppi-terne-pronte
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_diagnostica_gruppi_fatturabili: + terne_pronte jsonb, la corsia
        (emittente, tipo doc, utility) in cui ricadono le righe ancora pronte del
        gruppo. Risponde al §10.6: incrociandola con le terne FALLITE che il BE
        ha gia' negli esiti, un gruppo non servito per rottura della pipeline
        smette di essere raccontato come problema di perimetro. E' una misura sul
        presente, non la previsione che il §9.7 ha chiesto di togliere.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'vendite'
                AND p.proname = 'fn_diagnostica_gruppi_fatturabili'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_diagnostica_gruppi_fatturabili(text[], date);

              CREATE OR REPLACE FUNCTION vendite.fn_diagnostica_gruppi_fatturabili(
                      -- ⚠️ text[] esplicito: PostgreSQL non supporta `colonna%TYPE[]`.
                      p_gruppi          text[],
                      p_competenza_mese vendite.commesse_attivita.competenza_mese%TYPE DEFAULT NULL)
               RETURNS TABLE(gruppo_key                    text,
                             commessa_id                   bigint,
                             commessa_codice               text,
                             commessa_stato_codice_interno text,
                             commessa_stato_descrizione    text,
                             commessa_emittibile           boolean,
                             n_righe                       bigint,
                             n_emesse                      bigint,
                             n_annullate                   bigint,
                             n_rifiutate                   bigint,
                             n_non_approvate               bigint,
                             n_fuori_competenza            bigint,
                             n_pronte                      bigint,
                             terne_pronte                  jsonb)
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_bound vendite.commesse_attivita.competenza_mese%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo: la FOTOGRAFIA di uno o piu' gruppi fatturabili —
                --   quante righe hanno, in che stato sono, in che stato e'
                --   la testata della commessa, e in quale CORSIA ricade il
                --   lavoro ancora pronto. Serve a spiegare all'operatore
                --   perche' un gruppo che aveva chiesto di fatturare non e'
                --   stato servito.
                --   brief-db-emittibilita-visibile-e-sbloccabile §9 F4, §10.6.
                --
                -- Grana: (gruppo_key, commessa_id). ⚠️ La commessa NON e'
                --   ridondante: gruppo_key per una riga con documento sorgente
                --   vale '<codice_interno>:<uid>' e non la contiene, quindi lo
                --   stesso documento potrebbe alimentare righe su due commesse.
                --   La versione Python aggregava con min()/bool_or() e in quel
                --   caso avrebbe detto «emittibile» perche' UNA lo era,
                --   mancando proprio la diagnosi che serve.
                --
                -- rev 2026-08-15 (a): via `n_senza_tipo_doc` — dopo la
                --   validazione del CHECK (20260815-30) e' un ramo
                --   irraggiungibile, e un ramo che sembra coperto e non lo e'
                --   vale meno di zero.
                -- rev 2026-08-15 (b): + `terne_pronte`. La corsia non si
                --   prevede, si MISURA: le righe ancora pronte portano gia' la
                --   terna con se', ed e' quella su cui la lane raggruppa.
                --   Incrociata con le terne FALLITE del giro (che il BE ha
                --   negli esiti, come fatti) distingue «non servito perche' il
                --   perimetro non lo ammetteva» da «non servito perche'
                --   l'esecuzione si e' rotta» — il primo si corregge, il
                --   secondo si riprova.
                --   ⚠️ Sta QUI e non nel consuntivo perche' qui i criteri di
                --   «riga pronta» ci sono gia' (sono quelli di n_pronte):
                --   metterlo in fn_esito_gruppi_giro avrebbe voluto dire
                --   ricopiarli, ed e' la duplicazione che questo cantiere ha
                --   tolto.
                --
                -- Divisione di competenze: qui i CONTATORI e i FATTI, al BE la
                --   PROSA. Il DB dice quanti, in che stato e in quale corsia;
                --   il BE dice come si racconta.
                --
                -- STABLE, sola lettura. commesse e commesse_attivita hanno la
                --   RLS: la fotografia e' gia' scoped per emittente.
                -- =========================================================

                -- Nessun gruppo chiesto, nessuna diagnosi: e' l'identita', non
                -- un errore. Il chiamante filtra a monte, come gia' faceva.
                IF p_gruppi IS NULL OR cardinality(p_gruppi) = 0 THEN
                  RETURN;
                END IF;

                -- Bound di competenza normalizzato al primo del mese, come fa
                -- il chiamante. NULL = nessun limite, e allora la classe
                -- «fuori competenza» resta vuota per costruzione.
                v_bound := CASE
                  WHEN p_competenza_mese IS NOT NULL
                  THEN date_trunc('month', p_competenza_mese)::date
                  ELSE NULL
                END;

                RETURN QUERY
                WITH richiesti AS (
                  -- Normalizzazione allineata a fn_build_gruppo_fatturabile_key:
                  -- una chiave con spazi in coda non combacerebbe MAI con quella
                  -- costruita dal DB, e filtrerebbe zero righe senza dirlo.
                  SELECT DISTINCT btrim(k) AS gruppo_key
                    FROM unnest(p_gruppi) AS k
                   WHERE btrim(COALESCE(k, '')) <> ''
                ),
                righe AS (
                  SELECT vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id) AS gruppo_key,
                         co.id                                        AS commessa_id,
                         co.codice::text                              AS commessa_codice,
                         sc.codice_interno::text                      AS commessa_stato_codice_interno,
                         -- Descrizione di DISPLAY: questo valore finisce NELLA
                         -- FRASE che l'operatore legge (§8.3, nota in coda).
                         COALESCE(sc.descrizione, sc.codice)::text    AS commessa_stato_descrizione,
                         sc.emittibile                                AS commessa_emittibile,
                         ca.stato_emissione,
                         ca.stato_approvazione,
                         ca.tipo_doc_fiscale_id,
                         ca.competenza_mese,
                         -- La CORSIA della riga: le tre colonne su cui
                         -- fn_list_emittibili_lane raggruppa, prese dove
                         -- stanno. Non e' una chiave nuova, e' la stessa.
                         co.emittente_soggetto_ruolo_id               AS terna_emittente,
                         co.utility_id                                AS terna_utility,
                         -- ⚠️ Il predicato di «riga pronta», scritto UNA volta e
                         -- riusato sia dal contatore sia dalla corsia: se un
                         -- giorno cambia, cambia per entrambi o per nessuno.
                         ((ca.stato_emissione)::text = 'NON_EMESSA'
                          AND (ca.stato_approvazione)::text = 'APPROVATA'
                          AND ca.tipo_doc_fiscale_id IS NOT NULL
                          AND (v_bound IS NULL OR ca.competenza_mese <= v_bound)) AS e_pronta
                    FROM vendite.commesse_attivita ca
                    JOIN vendite.commesse co       ON co.id = ca.commessa_id
                    JOIN vendite.stati_commessa sc ON sc.id = co.stato_commessa_id
                   WHERE vendite.fn_build_gruppo_fatturabile_key(ca.sorgente_tipo_id, ca.sorgente_uid, ca.commessa_id)
                         IN (SELECT q.gruppo_key FROM richiesti q)
                )
                SELECT d.gruppo_key,
                       x.commessa_id,
                       x.commessa_codice,
                       x.commessa_stato_codice_interno,
                       x.commessa_stato_descrizione,
                       x.commessa_emittibile,
                       count(x.gruppo_key)::bigint AS n_righe,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'EMESSA')::bigint AS n_emesse,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'ANNULLATA')::bigint AS n_annullate,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text = 'RIFIUTATA')::bigint AS n_rifiutate,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text NOT IN ('APPROVATA', 'RIFIUTATA'))::bigint AS n_non_approvate,
                       count(*) FILTER (
                         WHERE (x.stato_emissione)::text = 'NON_EMESSA'
                           AND (x.stato_approvazione)::text = 'APPROVATA'
                           AND x.tipo_doc_fiscale_id IS NOT NULL
                           AND v_bound IS NOT NULL
                           AND x.competenza_mese > v_bound)::bigint AS n_fuori_competenza,
                       -- n_pronte e terne_pronte guardano lo STESSO predicato
                       -- (`e_pronta`): il conteggio e l'elenco delle corsie non
                       -- possono raccontare due cose diverse.
                       count(*) FILTER (WHERE x.e_pronta)::bigint AS n_pronte,
                       -- Le corsie in cui ricade il lavoro ancora pronto.
                       -- ⚠️ Array e non tre colonne: un gruppo puo' stare su
                       -- piu' corsie, perche' tipo_doc_fiscale_id sta sulla
                       -- RIGA (fatto G15). ⚠️ '[]' e mai NULL quando non c'e'
                       -- nulla di pronto: «nessuna corsia» e «non calcolato»
                       -- devono restare distinguibili.
                       -- ⚠️ ORDER BY dentro l'aggregato: l'ordine dev'essere
                       -- DETERMINISTICO, o due chiamate identiche danno valori
                       -- diversi e chi li confronta vede differenze finte.
                       COALESCE(
                         jsonb_agg(DISTINCT jsonb_build_object(
                                     'emittente_soggetto_ruolo_id', x.terna_emittente,
                                     'tipo_doc_fiscale_id',         x.tipo_doc_fiscale_id,
                                     'utility_id',                  x.terna_utility)
                                   ORDER BY jsonb_build_object(
                                     'emittente_soggetto_ruolo_id', x.terna_emittente,
                                     'tipo_doc_fiscale_id',         x.tipo_doc_fiscale_id,
                                     'utility_id',                  x.terna_utility))
                           FILTER (WHERE x.e_pronta),
                         '[]'::jsonb) AS terne_pronte
                  FROM richiesti d
                  -- LEFT JOIN: un gruppo senza righe deve uscire lo stesso, con
                  -- commessa NULL e contatori a zero.
                  LEFT JOIN righe x ON x.gruppo_key = d.gruppo_key
                 GROUP BY d.gruppo_key,
                          x.commessa_id,
                          x.commessa_codice,
                          x.commessa_stato_codice_interno,
                          x.commessa_stato_descrizione,
                          x.commessa_emittibile
                 -- Ordine DETERMINISTICO: il chiamante compone una frase con i
                 -- primi N, e due chiamate uguali devono dare la stessa frase.
                 ORDER BY d.gruppo_key, x.commessa_id NULLS FIRST;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_diagnostica_gruppi_fatturabili(p_gruppi text[], p_competenza_mese date)
              IS 'FOTOGRAFIA di uno o piu'' gruppi fatturabili: quante righe hanno e in che stato, la testata della commessa (codice, stato codice interno E descrizione, flag emittibile), e in quale CORSIA ricade il lavoro ancora pronto. Serve a spiegare perche'' un gruppo che l''operatore aveva chiesto di fatturare non e'' stato servito. Porta a DB l''SQL che stava in CommesseRepository.diagnostica_gruppi — ultima copia dei filtri di vendite.fn_list_emittibili_lane rimasta fuori dal database (brief-db-emittibilita-visibile-e-sbloccabile §5.2, accolta §9 F4). ⚠️ Grana (gruppo_key, commessa_id), e la commessa NON e'' ridondante: gruppo_key per una riga con documento sorgente vale ''<codice_interno>:<uid>'' e non la contiene. DIVISIONE DI COMPETENZE: qui i contatori e i fatti, al BE la prosa. n_fuori_competenza e'' la sola classe che dipende da p_competenza_mese; NULL = nessun limite e quella classe resta vuota. Un gruppo richiesto e sconosciuto esce comunque con commessa_id NULL e contatori a zero: farlo sparire sarebbe un silenzio. Le chiavi si normalizzano con btrim. rev 2026-08-15 (a): TOLTO n_senza_tipo_doc — dopo il 20260815-30 (CHECK validato) e'' un ramo irraggiungibile. rev 2026-08-15 (b): + terne_pronte jsonb, risposta alla domanda §10.6 del BE. In un giro mirato parziale con una terna FALLITA, i gruppi di quella terna hanno ancora righe da emettere e il consuntivo li dichiara NON_SERVITO — corretto — ma la diagnosi di perimetro a valle attribuisce la causa piu'' prossima che vede («verificare emittente e utility»), mandando l''operatore a controllare una cosa giusta mentre bastava riprovare. terne_pronte da'' la corsia (emittente_soggetto_ruolo_id, tipo_doc_fiscale_id, utility_id) delle righe ancora pronte: incrociata con le terne fallite, che il BE ha gia'' negli esiti del giro come FATTI, distingue «non servito perche'' il perimetro non lo ammetteva» da «non servito perche'' l''esecuzione si e'' rotta». ⭐ NON e'' una previsione: la corsia non si stima, si misura sul presente — sono le stesse tre colonne su cui la lane raggruppa. Era il vincolo della domanda: il BE non aveva chiuso il caso da solo per non rimettere in gioco gruppi_coperti, che il §9.7 aveva chiesto di togliere. ⚠️ Sta qui e non in fn_esito_gruppi_giro perche'' qui i criteri di «riga pronta» esistono gia'' (sono quelli di n_pronte, e il predicato e'' scritto una volta sola e condiviso): nel consuntivo avrebbero dovuto essere ricopiati. ⚠️ Array e non tre colonne scalari: un gruppo puo'' stare su piu'' corsie perche'' tipo_doc_fiscale_id sta sulla RIGA (fatto G15). ⚠️ Vale ''[]'' e mai NULL quando non c''e'' nulla di pronto: «nessuna corsia» e «non calcolato» devono restare distinguibili. Ordine deterministico. STABLE, sola lettura; commesse e commesse_attivita hanno la RLS.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS vendite.fn_diagnostica_gruppi_fatturabili(text[], date);
