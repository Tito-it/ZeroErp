# Aggiorna vendite.fn_push_offerta_a_contratto (rev6): guard di MUTUA
# ESCLUSIVITA' offerta -> (contratto XOR ordine).
#
# Contesto: la capability script.fn_available_actions_offerta (rev 2026-06-08,
#   20260608-12) rende push_contratto e genera_ordine mutuamente esclusive: nasconde
#   il bottone "push" se l'offerta ha gia' un ordine. Ma la capability e' solo un
#   suggerimento UI: una chiamata diretta/stale a fn_push_offerta_a_contratto
#   creerebbe comunque un contratto accanto a un ordine gia' esistente, violando
#   l'invariante. Questo guard chiude il write-path lato contratto.
#
# Unica differenza rispetto a rev5 (20260601-04): aggiunto un guard EXISTS su
#   vendite.ordini.documento_origine_* ('OFFERTA', p_offerta_id) subito dopo il
#   guard di idempotenza contratto; su match solleva E_OFFERTA_ORDINE_GIA_GENERATO
#   (id=478, registrato in 20260608-13). Firma e resto del corpo INVARIATI
#   (CREATE OR REPLACE, nessun DROP).
#
# NB: il lato ordine (impedire un ordine se esiste gia' un contratto) resta
#   presidiato dal guard BE crea_ordine_da_offerta (fuori scope DB). La race
#   cross-tab in-transazione (push + genera_ordine simultanei) NON e' coperta:
#   servirebbe un trigger incrociato — scelta esplicita di non introdurlo
#   (back-office mono-utente).
#
# Brief: brief-db-univocita-offerta-ordine.md §10
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260608-14-update-fn-push-offerta-a-contratto-guard-ordine-mctit.yaml

  - changeSet:
      id: 20260608-14-update-fn-push-offerta-a-contratto-guard-ordine
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        CREATE OR REPLACE fn_push_offerta_a_contratto(bigint,bigint,boolean) rev6:
        guard mutua esclusivita' offerta->contratto/ordine. Solleva
        E_OFFERTA_ORDINE_GIA_GENERATO se l'offerta ha gia' generato un ordine.
        Resto invariato (rev5).
      preConditions:
        - onFail: HALT
        - and:
          - columnExists:
              schemaName: vendite
              tableName: ordini
              columnName: documento_origine_tipo
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'vendite'
                   AND p.proname = 'fn_push_offerta_a_contratto'
                   AND pg_get_function_identity_arguments(p.oid)
                       = 'p_offerta_id bigint, p_pratica_id bigint, p_chiudi_contratto_esistente boolean';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_push_offerta_a_contratto(
                  p_offerta_id                 vendite.offerte_commerciali.id%TYPE,
                  p_pratica_id                 bigint,
                  p_chiudi_contratto_esistente boolean DEFAULT false
              )
              RETURNS BIGINT
              LANGUAGE plpgsql
              AS $function$
              -- Scopo:
              --   Generare un contratto DRAFT da un'offerta commerciale in stato
              --   ACCETTATA, copiando 1:1 eccezioni (con componenti BoM) e utility.
              --   Idempotente: doppia invocazione fallisce con errore semantico.
              --   Consumatore del meccanismo generico di successione contratti:
              --   su overlap mostra/risolve il conflitto invece di lasciar trapelare
              --   l'errore grezzo GiST (brief §3.3/§3.4).
              --
              -- Parametri:
              --   p_offerta_id : ID offerta commerciale ACCETTATA da trasformare.
              --   p_pratica_id : ID pratica da collegare (opzionale — NULL ammesso).
              --   p_chiudi_contratto_esistente : se true e c'e' overlap, chiude il
              --       contratto esistente per successione (accorcia valido_al) e poi
              --       genera il nuovo; se false (default) su overlap solleva
              --       E_CONTRATTO_OVERLAP_ESISTENTE senza creare nulla.
              --
              -- Regole:
              --   - stato ACCETTATA obbligatorio; qualsiasi altro -> errore.
              --   - nessun contratto con offerta_id = p_offerta_id deve esistere.
              --   - MUTUA ESCLUSIVITA' (rev6, 2026-06-08): nessun ordine generato
              --     dall'offerta deve esistere (documento_origine ('OFFERTA', id)).
              --     Contratto e ordine sono alternativi: l'offerta ne genera al
              --     massimo uno. Specchio del guard lato capability
              --     script.fn_available_actions_offerta.
              --   - contratto creato in DRAFT; auto-attivazione NON prevista.
              --   - emittente_fiscale_id copiato 1:1 dall'offerta.
              --   - eccezioni: loop per-eccezione (mapping eccezione.id->riga.id),
              --     componenti copiati dopo ogni INSERT riga.
              --   - stato_approvazione_prezzo / pratica_approvazione_prezzo_id:
              --     trasportati 1:1 dall'offerta sia sulla RIGA (rev5, 2026-06-01)
              --     sia sui COMPONENTI (rev3). L'approvazione L3 ottenuta in offerta
              --     non va riapprovata sul contratto.
              --   - utility: UPSERT per gestire trigger snapshot_precontrattuali.
              --   - overlap: advisory lock + rilevamento + routing + backstop
              --     (vedi header del changelog 20260531-04).
              DECLARE
                  v_offerta               vendite.offerte_commerciali%ROWTYPE;
                  v_stato_cod             config.stati_doc_offerte.codice_interno%TYPE;
                  v_stato_draft_id        config.stati_doc_contratti.id%TYPE;
                  v_sorgente_ofc_id       config.sorgenti.id%TYPE;
                  v_sorgente_contratto_id config.sorgenti.id%TYPE;
                  v_contratto_id          vendite.contratti.id%TYPE;
                  v_contratto_uid         vendite.contratti.uid%TYPE;
                  v_eccezione             vendite.offerte_commerciali_eccezioni%ROWTYPE;
                  v_riga_id               vendite.contratti_righe.id%TYPE;
                  v_overlap_id            vendite.contratti.id%TYPE;
                  v_overlap_numero        vendite.contratti.numero%TYPE;
                  -- ambito assunto dal nuovo contratto: l'INSERT non valorizza la
                  -- colonna, che assume il DEFAULT 'COMMODITY'. INVARIANTE da
                  -- mantenere allineata al rilevamento.
                  c_ambito        CONSTANT vendite.contratti.ambito%TYPE := 'COMMODITY';
              BEGIN
                  -- Guard: parametro obbligatorio e valido.
                  IF p_offerta_id IS NULL OR p_offerta_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('param', 'p_offerta_id', 'value', p_offerta_id),
                          NULL::uuid,
                          'p_offerta_id = ' || COALESCE(p_offerta_id::text, 'NULL')
                      );
                  END IF;

                  -- Carica offerta.
                  SELECT * INTO v_offerta
                    FROM vendite.offerte_commerciali
                   WHERE id = p_offerta_id;

                  -- Guard: offerta non trovata.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('offerta_id', p_offerta_id),
                          NULL::uuid,
                          'offerta non trovata: ' || p_offerta_id::text
                      );
                  END IF;

                  -- Recupera codice stato dell'offerta.
                  SELECT codice_interno INTO v_stato_cod
                    FROM config.stati_doc_offerte
                   WHERE id = v_offerta.stato_doc_offerta_id;

                  -- Guard: push ammesso SOLO da stato ACCETTATA.
                  IF v_stato_cod IS DISTINCT FROM 'ACCETTATA' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_OFFERTA_PUSH_STATO_NON_AMMESSO',
                          jsonb_build_object(
                              'offerta_id',     p_offerta_id,
                              'stato_corrente', COALESCE(v_stato_cod, 'NULL')
                          ),
                          NULL::uuid,
                          p_offerta_id::text,
                          COALESCE(v_stato_cod, 'NULL')
                      );
                  END IF;

                  -- Guard idempotenza: contratto gia' generato per questa offerta?
                  IF EXISTS (
                      SELECT 1 FROM vendite.contratti
                       WHERE offerta_id = p_offerta_id
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_OFFERTA_CONTRATTO_GIA_GENERATO',
                          jsonb_build_object('offerta_id', p_offerta_id),
                          NULL::uuid,
                          p_offerta_id::text
                      );
                  END IF;

                  -- Guard mutua esclusivita': ordine gia' generato per questa offerta?
                  -- Contratto e ordine sono ALTERNATIVI: un'offerta ne genera al
                  -- massimo uno. Check cross-dominio su vendite.ordini.documento_origine_*
                  -- ('OFFERTA', id). Specchio del guard lato capability
                  -- script.fn_available_actions_offerta (20260608-12).
                  IF EXISTS (
                      SELECT 1 FROM vendite.ordini
                       WHERE documento_origine_tipo = 'OFFERTA'
                         AND documento_origine_id   = p_offerta_id
                  ) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_OFFERTA_ORDINE_GIA_GENERATO',
                          jsonb_build_object('offerta_id', p_offerta_id),
                          NULL::uuid,
                          p_offerta_id::text
                      );
                  END IF;

                  -- Config: stato DRAFT contratto.
                  SELECT id INTO v_stato_draft_id
                    FROM config.stati_doc_contratti
                   WHERE codice_interno = 'DRAFT';

                  IF v_stato_draft_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('tabella', 'config.stati_doc_contratti', 'codice', 'DRAFT'),
                          NULL::uuid,
                          'stato DRAFT non trovato in config.stati_doc_contratti'
                      );
                  END IF;

                  -- Config: sorgente OFFERTA_COMMERCIALE.
                  SELECT id INTO v_sorgente_ofc_id
                    FROM config.sorgenti
                   WHERE codice_interno = 'OFFERTA_COMMERCIALE';

                  IF v_sorgente_ofc_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_push_offerta_a_contratto',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object('tabella', 'config.sorgenti', 'codice', 'OFFERTA_COMMERCIALE'),
                          NULL::uuid,
                          'sorgente OFFERTA_COMMERCIALE non trovata in config.sorgenti'
                      );
                  END IF;

                  -- =====================================================
                  -- Successione su overlap (meccanismo generico, brief §3.4)
                  -- =====================================================
                  -- 1) Advisory lock sulla quintupla: serializza push concorrenti
                  --    sullo stesso (BA, istanza, utility, ambito). Non blocca
                  --    l'intera tabella; rilascio automatico a fine transazione.
                  PERFORM pg_advisory_xact_lock(
                      hashtext('vendite.contratti.overlap:'
                               || v_offerta.billing_account_id::text || ':'
                               || v_offerta.istanza_utility_id::text || ':'
                               || v_offerta.utility_id::text || ':'
                               || c_ambito)
                  );

                  -- 2) Rilevamento overlap (read-only).
                  v_overlap_id := vendite.fn_contratto_sovrapposto(
                      v_offerta.billing_account_id,
                      v_offerta.istanza_utility_id,
                      v_offerta.utility_id,
                      c_ambito,
                      v_offerta.validita_dal,
                      v_offerta.validita_al
                  );

                  -- 3) Routing.
                  IF v_overlap_id IS NOT NULL THEN
                      SELECT numero INTO v_overlap_numero
                        FROM vendite.contratti WHERE id = v_overlap_id;

                      IF NOT COALESCE(p_chiudi_contratto_esistente, false) THEN
                          -- Caso B: overlap senza conferma -> errore parlante, nessun INSERT.
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_push_offerta_a_contratto',
                              'E_CONTRATTO_OVERLAP_ESISTENTE',
                              jsonb_build_object(
                                  'offerta_id',           p_offerta_id,
                                  'contratto_overlap_id', v_overlap_id,
                                  'numero',               v_overlap_numero,
                                  'validita_dal',         v_offerta.validita_dal,
                                  'validita_al',          v_offerta.validita_al
                              ),
                              NULL::uuid,
                              COALESCE(v_overlap_numero, v_overlap_id::text)
                          );
                      ELSE
                          -- Caso C: conferma esplicita -> chiusura per successione.
                          PERFORM vendite.fn_chiudi_contratto_per_successione(
                              v_overlap_id, v_offerta.validita_dal
                          );
                      END IF;
                  END IF;
                  -- Caso A (v_overlap_id IS NULL): nessuna azione, prosegue l'INSERT.

                  -- INSERT contratto in DRAFT — copia campi business 1:1 dall'offerta.
                  -- Backstop: cattura un eventuale exclusion_violation residuo
                  -- (ex_contratti_no_overlap) e lo ritraduce in errore parlante.
                  BEGIN
                      INSERT INTO vendite.contratti (
                          billing_account_id,
                          istanza_utility_id,
                          utility_id,
                          listino_id,
                          listino_versione_id,
                          valore_variazione_globale,
                          tipo_variazione_globale,
                          valido_dal,
                          valido_al,
                          stato_doc_contratto_id,
                          sorgente_tipo_id,
                          sorgente_uid,
                          offerta_id,
                          emittente_fiscale_id,
                          meta
                      )
                      VALUES (
                          v_offerta.billing_account_id,
                          v_offerta.istanza_utility_id,
                          v_offerta.utility_id,
                          v_offerta.listino_id,
                          v_offerta.listino_versione_id,
                          v_offerta.valore_variazione_globale,
                          v_offerta.tipo_variazione_globale,
                          v_offerta.validita_dal,
                          v_offerta.validita_al,
                          v_stato_draft_id,
                          v_sorgente_ofc_id,
                          v_offerta.uid,
                          p_offerta_id,
                          v_offerta.emittente_fiscale_id,
                          COALESCE(v_offerta.meta, '{}'::jsonb)
                      )
                      RETURNING id, uid INTO v_contratto_id, v_contratto_uid;
                  EXCEPTION
                      WHEN exclusion_violation THEN
                          -- Conflitto residuo (gara sfuggita al lock, percorso senza
                          -- lock, o multi-overlap non risolto dalla singola chiusura).
                          v_overlap_id := vendite.fn_contratto_sovrapposto(
                              v_offerta.billing_account_id,
                              v_offerta.istanza_utility_id,
                              v_offerta.utility_id,
                              c_ambito,
                              v_offerta.validita_dal,
                              v_offerta.validita_al
                          );
                          SELECT numero INTO v_overlap_numero
                            FROM vendite.contratti WHERE id = v_overlap_id;

                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_push_offerta_a_contratto',
                              'E_CONTRATTO_OVERLAP_ESISTENTE',
                              jsonb_build_object(
                                  'offerta_id',           p_offerta_id,
                                  'contratto_overlap_id', v_overlap_id,
                                  'numero',               v_overlap_numero,
                                  'backstop',             true
                              ),
                              NULL::uuid,
                              COALESCE(v_overlap_numero, COALESCE(v_overlap_id::text, '?'))
                          );
                  END;

                  -- Copia eccezioni offerta → contratti_righe (loop per-eccezione).
                  -- Loop necessario per preservare il mapping eccezione.id →
                  -- riga_contratto.id e copiare i componenti associati.
                  FOR v_eccezione IN
                      SELECT *
                        FROM vendite.offerte_commerciali_eccezioni
                       WHERE offerta_id = p_offerta_id
                       ORDER BY id
                  LOOP
                      INSERT INTO vendite.contratti_righe (
                          contratto_id,
                          articolo_id,
                          tipo_eccezione,
                          tipo_erogazione,
                          fonte_quantita_attesa,
                          periodicita,
                          generazione_canone,
                          competenza_canone,
                          prezzo_unitario,
                          quantita,
                          qta_operativa,
                          uom_operativa_id,
                          factor_to_base,
                          ordine,
                          attivo,
                          meta,
                          stato_approvazione_prezzo,
                          pratica_approvazione_prezzo_id
                      )
                      VALUES (
                          v_contratto_id,
                          v_eccezione.articolo_id,
                          v_eccezione.tipo_eccezione,
                          v_eccezione.tipo_erogazione,
                          v_eccezione.fonte_quantita_attesa,
                          v_eccezione.periodicita,
                          v_eccezione.generazione_canone,
                          v_eccezione.competenza_canone,
                          v_eccezione.prezzo_unitario,
                          v_eccezione.quantita,
                          v_eccezione.qta_operativa,
                          v_eccezione.uom_operativa_id,
                          v_eccezione.factor_to_base,
                          v_eccezione.ordine,
                          v_eccezione.attivo,
                          v_eccezione.meta,
                          v_eccezione.stato_approvazione_prezzo,
                          v_eccezione.pratica_approvazione_prezzo_id
                      )
                      RETURNING id INTO v_riga_id;

                      -- Copia componenti dell'eccezione → contratti_righe_componenti.
                      INSERT INTO vendite.contratti_righe_componenti (
                          riga_contratto_id,
                          articolo_componente_id,
                          componente_id,
                          coeff_qta_snapshot,
                          quantita,
                          uom_operativa_id,
                          factor_to_base,
                          qta_operativa,
                          prezzo_unitario,
                          iva_id,
                          origine_prezzo,
                          prezzo_resolver_context,
                          stato_approvazione_prezzo,
                          pratica_approvazione_prezzo_id,
                          meta,
                          ordine,
                          attivo
                      )
                      SELECT
                          v_riga_id,
                          occ.articolo_componente_id,
                          occ.componente_id,
                          occ.coeff_qta_snapshot,
                          occ.quantita,
                          occ.uom_operativa_id,
                          occ.factor_to_base,
                          occ.qta_operativa,
                          occ.prezzo_unitario,
                          occ.iva_id,
                          occ.origine_prezzo,
                          occ.prezzo_resolver_context,
                          occ.stato_approvazione_prezzo,
                          occ.pratica_approvazione_prezzo_id,
                          occ.meta,
                          occ.ordine,
                          occ.attivo
                      FROM vendite.offerte_commerciali_eccezioni_componenti occ
                      WHERE occ.eccezione_offerta_id = v_eccezione.id;
                  END LOOP;

                  -- Copia utility offerta → contratti_utilities (1:1).
                  -- UPSERT: il trigger trg_contratti_z90_snapshot_precontrattuali_ins
                  -- si attiva AFTER INSERT su contratti e puo' aver gia' creato un record.
                  INSERT INTO vendite.contratti_utilities (
                      contratto_id,
                      istanza_utility_id,
                      utility_id,
                      istanza_dati_precontrattuali_id,
                      classe_utenza_id,
                      tipo_utenza_id,
                      param_1_num,
                      param_2_txt,
                      meta
                  )
                  SELECT
                      v_contratto_id,
                      ocu.istanza_utility_id,
                      ocu.utility_id,
                      ocu.istanza_dati_precontrattuali_id,
                      ocu.classe_utenza_id,
                      ocu.tipo_utenza_id,
                      ocu.param_1_num,
                      ocu.param_2_txt,
                      ocu.meta
                  FROM vendite.offerte_commerciali_utilities ocu
                  WHERE ocu.offerta_id = p_offerta_id
                  ON CONFLICT ON CONSTRAINT uq_contratti_utilities_contratto_id
                  DO UPDATE SET
                      istanza_utility_id              = EXCLUDED.istanza_utility_id,
                      utility_id                      = EXCLUDED.utility_id,
                      istanza_dati_precontrattuali_id = EXCLUDED.istanza_dati_precontrattuali_id,
                      classe_utenza_id                = EXCLUDED.classe_utenza_id,
                      tipo_utenza_id                  = EXCLUDED.tipo_utenza_id,
                      param_1_num                     = EXCLUDED.param_1_num,
                      param_2_txt                     = EXCLUDED.param_2_txt,
                      meta                            = EXCLUDED.meta;

                  -- Collegamento pratica (facoltativo).
                  IF p_pratica_id IS NOT NULL THEN
                      SELECT id INTO v_sorgente_contratto_id
                        FROM config.sorgenti
                       WHERE codice_interno = 'CONTRATTO';

                      IF v_sorgente_contratto_id IS NULL THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'fn_push_offerta_a_contratto',
                              'E_CONFIG_MANCANTE',
                              jsonb_build_object('tabella', 'config.sorgenti', 'codice', 'CONTRATTO'),
                              NULL::uuid,
                              'sorgente CONTRATTO non trovata in config.sorgenti'
                          );
                      END IF;

                      INSERT INTO pratiche.pratiche_sorgenti (
                          pratica_id,
                          sorgente_tipo_id,
                          sorgente_uid,
                          ruolo_link
                      )
                      VALUES (
                          p_pratica_id,
                          v_sorgente_contratto_id,
                          v_contratto_uid::text,
                          'COLLEGATO'
                      )
                      ON CONFLICT ON CONSTRAINT uq_pratiche_sorgenti_pratica_tipo_uid_ruolo
                      DO NOTHING;
                  END IF;

                  RETURN v_contratto_id;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_push_offerta_a_contratto(bigint, bigint, boolean) IS
                  'Genera un contratto DRAFT da un''offerta commerciale ACCETTATA. '
                  'Rev6 (2026-06-08): guard di mutua esclusivita'' offerta->contratto/ordine '
                  '(E_OFFERTA_ORDINE_GIA_GENERATO) — un''offerta genera al massimo uno tra '
                  'contratto e ordine. Rev5 (2026-06-01): trasporta 1:1 '
                  'stato_approvazione_prezzo + pratica_approvazione_prezzo_id anche sulle '
                  'RIGHE (oltre che sui componenti). Rev4 (2026-05-31): consumatore del '
                  'meccanismo generico di successione contratti (advisory lock + overlap + '
                  'routing + backstop). Copia eccezioni+componenti e utility; idempotente '
                  '(E_OFFERTA_CONTRATTO_GIA_GENERATO).';
      rollback:
        - sql:
            sql: |
              -- Rollback: ripristina la rev5 (senza guard mutua esclusivita')
              -- rieseguendo 20260601-04. Qui si lascia la funzione corrente.
              SELECT 1;
