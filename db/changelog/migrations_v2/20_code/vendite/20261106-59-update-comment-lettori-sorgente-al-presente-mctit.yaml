# I COMMENT DEI LETTORI DELLA SORGENTE, AL PRESENTE
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto R, giro R.2 (decisione di Tid del 2026-11-06: «accetto la tua proposta»).
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   I COMMENT scritti dal giro 0.3 (20261106-22 … -45) cominciano con
#   «⭐ rev 2026-11-06 (20261106-NN, brief-…)» davanti al testo di prima, che
#   a sua volta e' una cronaca di rev, brief e changeSet. linee-guida-sql §5d:
#   il COMMENT descrive l'oggetto al presente, e ogni COMMENT nuovo o riscritto
#   la rispetta da subito. Sono una famiglia sola (i lettori della sorgente):
#   si riscrivono interi, insieme.
#
# ── ⚠️ CHE COSA CAMBIA ──────────────────────────────────────────────
#   Solo COMMENT ON: 21 funzioni e 2 indici. Nessun corpo, nessuna firma
#   (le firme dei COMMENT sono quelle ancorate dei changeSet del giro 0.3).
#   Il presidio e' vendite/test-sorgente-commenti-al-presente-v1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261106-59-update-comment-lettori-sorgente-al-presente-mctit.yaml

  - changeSet:
      id: 20261106-59-update-comment-lettori-sorgente-al-presente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT dei lettori della sorgente (giro 0.3) riscritti al presente, linee-guida-sql §5d. brief-db-sorgente-documento-e-riga §7.2 lotto R, giro R.2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_ddt_trigger_ordine_testata' AND p.pronargs = 3;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION vendite.fn_documento_ritira_legami(config.sorgenti.codice_interno%TYPE, bigint, integer) IS
                'La conferma e il ritiro dei consumi di un documento che si annulla. p_documento e'' il codice della sorgente (DDT_VENDITA, ORDINE_VENDITA, PREVENTIVO, CONTRATTO, COMMESSA, OFFERTA_COMMERCIALE). Prima solleva il primo motivo della check che il guard della testata solleverebbe (script.fn_check_preventivo_annullabile, fn_check_ordine_annullabile, fn_check_commessa_annullabile, fn_check_offerta_annullabile, fn_check_sorgente_chiudibile per bolla e contratto): chi annulla non conferma un ritiro che il cambio di stato rifiuterebbe. Poi la conferma: chi annulla dichiara quanti legami ha visto (vendite.fn_documento_legami); se non corrisponde, E_DOC_ANNULLO_CON_LEGAMI, lo stesso avviso del guard. Apre la porta del ritiro (GUC transazionale zeroerp.doc_ritira_legami = ''<codice della sorgente>:<id>'', letta da vendite.fn_doc_porta_ritiro_ammette) e la lascia aperta: la chiude il verbo dopo il cambio di stato, perche'' il guard dell''annullo la legge per i legami di provenienza. Ritira: della bolla, i legami con ordini e resi (vendite.fn_ddt_riga_ritira_legami); dell''ordine, il consumo delle righe di preventivo (preventivo_riga_id a NULL; lo stato del preventivo lo proietta vendite.fn_preventivo_proietta_stato_smistamento); le righe di commessa NON_EMESSA del documento (vendite.fn_ritira_commessa_attivita_da_sorgente, col registro); della commessa, ogni riga NON_EMESSA col verbo del suo genere (con sorgente fn_ritira_commessa_attivita_da_sorgente limitata alla commessa, RETTIFICA vendite.fn_annulla_accredito_riga_reso, ONERE vendite.fn_annulla_commessa_attivita). La chiave delle righe di commessa del documento la da'' script.fn_sorgente_documento. La provenienza (l''offerta, la revisione precedente dell''offerta) non si ritira: il rientro dell''offerta lo scrive vendite.fn_offerta_proietta_stato_revisione. Ritorna i legami confermati, 0 se non ce n''erano. SECURITY INVOKER, EXECUTE a nessuno: lo chiamano i verbi DEFINER di annullo (vendite.fn_annulla_ddt, fn_annulla_ordine, fn_annulla_preventivo, fn_annulla_contratto, fn_annulla_commessa, fn_annulla_offerta), che bloccano la testata prima.';

              COMMENT ON FUNCTION vendite.trgfn_resi_normalize() IS
                'Normalize del reso, BEFORE INSERT OR UPDATE: anno e data; su INSERT eredita billing account, destinatario, utility, valuta ed emittente dalla bolla sorgente (DDT_VENDITA), cercata con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid); senza bolla l''emittente viene dal billing account. Gemello di vendite.trgfn_ddt_normalize.';

              COMMENT ON FUNCTION vendite.fn_documento_lineage_legami(text[], bigint[], text[], bigint[], text[]) IS
                'Decoratore degli ARCHI della lineage, gemello di vendite.fn_documento_lineage_nodi: i nodi danno lo stato, questo il LEGAME. Per ogni arco (array paralleli: lettera, tipo e chiave dei due estremi) dice se il legame e'' ritirato con i due nodi vivi: true / false; NULL per una lettera non censita («non so», non «vivo»). B, E, F, U (documento -> commessa): ritirato se nella commessa non resta nessuna riga di quel documento con stato_emissione diverso da ANNULLATA; la chiave delle righe e'' l''uid del documento, letto per ogni tipo dal BB script.fn_sorgente_documento_da_chiave; commessa annullata -> true insieme a to_is_abortito. A (preventivo -> ordine): ritirato se nessuna riga attiva dell''ordine viene da una riga del preventivo. H (ordine -> bolla): se nessuna riga attiva della bolla evade una riga dell''ordine (ordini_righe_fulfillment). R (bolla -> reso): se nessuna riga attiva del reso viene da una riga della bolla. C, D, V (legami di sola testata) e G, N, S, T (l''arco nasce e sparisce con le righe di legame): false. SECURITY DEFINER: righe di commessa, ordine, bolla e reso hanno la RLS, e righe vive fuori perimetro farebbero dire «ritirato» a torto; restituisce un booleano per un arco che chi legge ha gia''. Consumatore: vendite.fn_documento_lineage (is_legame_ritirato).';

              COMMENT ON FUNCTION vendite.trgfn_resi_guard_cliente_ddt() IS
                'Guard BEFORE INSERT OR UPDATE su vendite.resi, fascia _z10_ (dopo vendite.trgfn_resi_normalize): il reso ha il billing account della bolla sorgente (DDT_VENDITA), NULL compreso; altrimenti E_DOC_CLIENTE_DIVERSO_DA_SORGENTE, come bolla e fulfillment. La bolla si cerca con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid), e un cambio di sorgente si vede su tutte e due le chiavi. Una bolla dichiarata e non trovata, inesistente o invisibile sotto RLS, e'' E_DOC_SORGENTE_NON_TROVATA (su INSERT parla prima vendite.trgfn_resi_guard_ddt_consegnato). Vale in qualunque stato: il billing account della bolla e'' bloccato fuori bozza e la bolla di un reso e'' consegnata, quindi il reso non ha un lock fuori bozza sul cliente. La bolla si legge come INVOKER, come nel normalize.';

              COMMENT ON FUNCTION vendite.fn_documento_lineage_archi(bigint[], text[]) IS
                'Gli ARCHI della lineage dei documenti, grezzi (chiavi, ruolo, lettera A…V, is_ramo_inverso, rango_origine), per chiave del nodo. Il seme e'' quello di vendite.fn_documento_lineage_nodi: (tipo_id, uid::text) in due array paralleli; entrambi NULL = tutti gli archi (vendite.vw_documento_lineage_archi ne e'' la proiezione decorata). Col seme: gli archi uscenti da un nodo del seme e quelli entranti il cui from non sta nel seme, ciascuno una volta, con gli stessi DISTINCT della vista. Il seme scende come array (= ANY) sulla prima tabella di ogni ramo. Gli archi H (ordine -> bolla) e R (bolla -> reso) leggono la sorgente di testata con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid), in tutti e due i modi, con gli indici ix_ddt_v_sorgente / ix_ddt_v_sorgente_id e ix_resi_sorgente / ix_resi_sorgente_id. Nei rami polimorfi B, E, F, U il join verso il documento confronta colonne dello stesso tipo: un cast nel join non sarebbe leakproof. V e'' la revisione dell''offerta (madre -> figlia, revisione_padre_id), rango 60, non un''origine. Il vocabolario delle lettere e'' quello di vendite.vw_documento_lineage_archi: un arco nuovo si aggiunge qui, nei due modi. SET jit = off e plan_cache_mode = force_generic_plan: la funzione si pianifica una volta per sessione. BEGIN ATOMIC, SECURITY INVOKER.';

              COMMENT ON FUNCTION vendite.fn_documento_legami(config.sorgenti.codice_interno%TYPE, bigint) IS
                'I legami di un documento, una riga per legame: che cosa si riapre se lo annullo, e dove. p_documento e'' il codice della sorgente: DDT_VENDITA, ORDINE_VENDITA, PREVENTIVO, CONTRATTO, COMMESSA, OFFERTA_COMMERCIALE; uno sconosciuto e'' E_VENDITE_CHIAMATA_NON_VALIDA. origine e'' il codice della sorgente dall''altra parte, natura che cosa succede: ORDINE_VENDITA e RESO_VENDITA (consumi della bolla: fulfillment e ponte di riconsegna); PREVENTIVO (consumo dell''ordine, ordini_righe.preventivo_riga_id); OFFERTA_COMMERCIALE come PROVENIENZA di ordine e contratto (resta sul documento annullato: l''offerta torna trasformabile perche'' l''unicita'' vale sui vivi) e, per l''offerta, la revisione precedente che torna emessa (vendite.fn_offerta_proietta_stato_revisione); COMMESSA (righe NON_EMESSA spinte dal documento, con la chiave del documento dal BB script.fn_sorgente_documento). Della commessa: un legame per riga NON_EMESSA, con sorgente il documento o il consumo che l''ha spinta (natura CONSUMO, torna da mandare; origine_id da vendite.fn_get_sorgente_documento_ref), RETTIFICA il reso del suo accredito (CONSUMO, il reso torna da accreditare), ONERE natura ANNULLO. Le righe EMESSA non sono legami: bloccano (script.fn_check_sorgente_chiudibile, script.fn_check_commessa_annullabile). riga_id/riga_nr: la riga del documento, NULL per la testata; origine_id: la testata dall''altra parte; origine_riga_id: la sua riga. Niente etichette: il nome lo da'' la lineage. Lettore unico del guard vendite.trgfn_doc_guard_annullo_con_legami (avviso), di vendite.fn_documento_ritira_legami (conferma e ritiro) e della finestra di conferma del backend. SECURITY DEFINER con search_path bloccato: avviso, conferma e finestra contano la stessa cosa anche dove la RLS dei legami ne nasconderebbe una parte. EXECUTE solo all''app.';

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_cliente_sorgente() IS
                'Guard BEFORE INSERT OR UPDATE su vendite.ddt, fascia _z10_ (dopo vendite.trgfn_ddt_normalize): la bolla ha il billing account del documento da cui nasce. I vincoli li dice vendite.fn_ddt_vincoli_cliente, la stessa funzione da cui script.fn_available_actions_ddt spegne il campo, con la sorgente intera (tipo, uid, id): (1) sorgente di testata ORDINE_VENDITA o RESO_VENDITA -> il billing account del documento, NULL compreso; (2) su UPDATE il billing account non cambia se la bolla evade gia'' righe d''ordine. E_DOC_CLIENTE_DIVERSO_DA_SORGENTE, coi valori leggibili di documento e sorgente; una sorgente dichiarata e non trovata, inesistente o invisibile sotto RLS, e'' E_DOC_SORGENTE_NON_TROVATA. Una sorgente di un altro tipo resta fuori dal confronto. Il cambio di sorgente si vede su tutte e due le chiavi; il fulfillment si legge solo quando il billing account cambia. Ordine e reso si leggono come INVOKER. Le altre porte: il fulfillment (vendite.trgfn_ordini_ful_guard_consistenza) e il reso (vendite.trgfn_resi_guard_cliente_ddt).';

              COMMENT ON FUNCTION script.fn_get_sorgente_emittente_sr_id(config.sorgenti.id%TYPE, vendite.commesse_sorgenti.sorgente_uid%TYPE) IS
                'La porta testuale di script.fn_get_sorgente_emittente_sr_id(tipo, sorgente_id, sorgente_uid): «chi emette questo documento», per un tipo di config.sorgenti e la sua chiave in testo, nella forma CANONICA secondo il key_selector (quella che vendite.fn_link_commessa_sorgente scrive). Controlla tipo e chiave e passa alla firma sulle colonne del modello la chiave che il key_selector chiede: tipo assente o spento -> E_SORG_CONF; chiave mancante -> E_SORG_KEY_MISSING; chiave non canonica -> E_SORG_FORMATO (la regola e'' di script.fn_sorgente_chiave_id / _uuid, la stessa del guard); key_selector fuori catalogo -> E_SORG_KEYSEL. Il resto (le tre strade, E_SORG_EMITTENTE_NON_RISOLTO, fail-closed) e'' della firma sulle colonne. SECURITY DEFINER, come lei.';

              COMMENT ON FUNCTION script.trgfn_default_emittente_fiscale() IS
                'BEFORE INSERT generico: riempie emittente_fiscale_id, se NULL, con l''emittente di lavoro di chi scrive (script.fn_resolve_emittente_for_user dalla GUC app.current_user_id). TG_ARGV[0] = SOLLEVA (niente da cui dedurre -> E_EMITTENTE_NON_RISOLTO, DATO_ERRATO, campo emittente_fiscale_id) oppure LASCIA_NULL (decide un normalize a valle o il NOT NULL). TG_ARGV[1] facoltativo = SALTA_CON_SORGENTE: una riga con sorgente_tipo_id e una chiave della sorgente (sorgente_id o sorgente_uid) non si tocca, perche'' l''emittente e'' quello del documento padre; una tabella senza sorgente_id la legge NULL dal JSON. Un valore esplicito non si sovrascrive mai. Argomenti non ammessi -> E_TRIGGER_ARGOMENTI_INVALIDI. La colonna e'' sempre emittente_fiscale_id, l''ancora del perimetro.';

              COMMENT ON FUNCTION script.fn_get_sorgente_emittente_sr_id(config.sorgenti.id%TYPE, bigint, uuid) IS
                '«Chi emette questo documento», per la sorgente polimorfa, sulle colonne del modello: dato il tipo (config.sorgenti) e la chiave del documento (sorgente_id o sorgente_uid) restituisce il soggetto_ruolo dell''emittente. Il documento lo risolve script.fn_sorgente_documento, con la chiave che riceve; qui si legge solo l''emittente, per id, per tre strade in ordine di direttezza: (1) emittente_soggetto_ruolo_id se la tabella ce l''ha (commesse, fatture, lotti); (2) emittente_fiscale_id tradotto in soggetto_ruolo (i documenti: e'' NOT NULL, mentre il billing account e'' facoltativo su ordini, preventivi, bolle e resi); (3) billing_account_id con anagrafiche.fn_get_emittente_fiscale_id (attivita_consumi, attivita_fatturabili). La strada la sceglie il catalogo prima del documento. Fail-closed, mai un NULL silenzioso: tipo assente o spento -> E_SORG_CONF; nessuna chiave -> E_SORG_KEY_MISSING; tabella senza nessuna delle tre colonne -> E_SORG_CONF; documento inesistente o senza emittente -> E_SORG_EMITTENTE_NON_RISOLTO. SECURITY DEFINER: da INVOKER la sorgente di un altro emittente sarebbe invisibile sotto RLS, e il chiamante concluderebbe «non esiste» invece di «e'' di un altro». La porta testuale (tipo, chiave text) controlla la forma e passa qui.';

              COMMENT ON FUNCTION vendite.fn_ddt_trigger_ordine_testata(vendite.ddt.sorgente_tipo_id%TYPE, vendite.ddt.sorgente_uid%TYPE, vendite.ddt.sorgente_id%TYPE) IS
                'Il fatturazione_trigger dell''ordine sorgente di TESTATA di una bolla: tipo ORDINE_VENDITA e l''ordine cercato con la regola (o.id = p_sorgente_id OR o.uid = p_sorgente_uid). NULL se la bolla non viene da un ordine, se la sorgente manca o se l''ordine non e'' visibile (SECURITY INVOKER: la RLS di chi chiede). Serve alla riga-onere senza legame di fulfillment, scritta a mano sulla bolla, il cui trigger non si legge dal legame. La leggono vendite.fn_ddt_push_diagnosi e script.fn_check_ddt_emittibile. p_sorgente_id e'' in coda, DEFAULT NULL. BEGIN ATOMIC.';

              COMMENT ON FUNCTION vendite.fn_ddt_vincoli_cliente(vendite.ddt.id%TYPE, vendite.ddt.sorgente_tipo_id%TYPE, vendite.ddt.sorgente_uid%TYPE, vendite.ddt.sorgente_id%TYPE) IS
                'Da dove viene il cliente di una bolla, cioe'' che cosa gli impedisce di cambiare. Una riga per vincolo: SORGENTE (la sorgente di testata, ORDINE_VENDITA o RESO_VENDITA, c''e'' quando il tipo e una delle due chiavi sono valorizzati; il documento si cerca con (doc.id = p_sorgente_id OR doc.uid = p_sorgente_uid); billing_account_id del documento, NULL compreso; etichetta NULL = dichiarato e non trovato, o invisibile sotto RLS) e FULFILLMENT (la bolla evade gia'' righe d''ordine; etichetta = il primo ordine). Nessuna riga = cliente libero. Predicato condiviso: il guard vendite.trgfn_ddt_guard_cliente_sorgente solleva da qui, la capability script.fn_available_actions_ddt spegne billing_account_id da qui. p_sorgente_id e'' in coda, DEFAULT NULL. INVOKER e STABLE, come il guard: ordine, reso e fulfillment si leggono sotto la RLS di chi scrive.';

              COMMENT ON FUNCTION vendite.trgfn_resi_guard_ddt_consegnato() IS
                'Guard del reso: la bolla sorgente (DDT_VENDITA, cercata con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid)) deve essere CONSEGNATA (E_RESO_DDT_NON_CONSEGNATO). Prima, una bolla di trasferimento fra depositi (causale di magazzino TRASF_OUT) non genera un reso (E_RESO_DA_DDT_TRASFERIMENTO): la merce e'' rimasta nostra, e un reso la farebbe rientrare due volte. Il dettaglio dei due errori porta tipo e chiavi della sorgente.';

              COMMENT ON FUNCTION script.fn_check_ordine_annullabile(p_ordine_id vendite.ordini.id%TYPE) IS
                'Pure check: i motivi che impediscono l''annullamento di un ordine; [] = lecito. 1) una bolla figlia viva, cercata con la regola (d.sorgente_id = id dell''ordine OR d.sorgente_uid = uid dell''ordine): E_ORD_ANNULLA_CON_DDT. Conta solo le bolle vive (config.stati_doc_ddt.is_abortito false): un figlio annullato non blocca il padre; la bolla in stato RESO continua a bloccare, perche'' il documento e'' vissuto. 2) righe di commessa gia'' EMESSA spinte dall''ordine (script.fn_check_sorgente_chiudibile): E_SORGENTE_CON_RIGHE_EMESSE. Le righe NON_EMESSA non bloccano: si ritirano con la conferma all''annullo (vendite.fn_annulla_ordine). Sede unica del guard di transizione e di script.fn_available_actions_ordine.';

              COMMENT ON FUNCTION script.fn_available_actions_ddt(p_ddt_id vendite.ddt.id%TYPE) IS
                'La capability della bolla per il dettaglio API. available_actions: i passaggi manuali permessi da script.fn_doc_azioni_permesse, con target_state e target_state_descrizione; un passaggio con un''azione di processo si nasconde a chi non l''ha (script.fn_check_azione_processo: permesso => nascondi, stato => disabilita col motivo); verso EMESSO il primo motivo di script.fn_check_ddt_emittibile. push_commessa: la partita del push si legge una volta da vendite.fn_ddt_push_diagnosi, la fonte unica dell''eleggibilita'' (can_push_commessa = esiste una riga senza motivo; poi il segmento, ALLOCATA -> DDT_GIA_INVIATO, EMESSA -> DDT_GIA_FATTURATO; poi il motivo piu'' forte, mappato per stringa con un ELSE generico). can_change_state; can_edit_testata e non_editable_fields dal montaggio del lock di testata (script.fn_doc_testata_in_stato); billing_account_id fra le colonne ferme solo se un vincolo lo tiene, letto da vendite.fn_ddt_vincoli_cliente con la sorgente intera (tipo, uid, id), la stessa del guard vendite.trgfn_ddt_guard_cliente_sorgente; can_edit_indirizzi dal lock di vendite.ddt_indirizzi (script.fn_doc_riga_modificabile). stato_info_key dal meta dello stato corrente (proprieta'' nessuna_azione_key), sempre presente nel blob, null quando non si applica. stato_codice. Le azioni portano il significato (key, label_key, outlined): icona e colore li sceglie il frontend dal verbo. Gemella di script.fn_available_actions_ordine.';

              COMMENT ON FUNCTION vendite.trgfn_ddt_normalize() IS
                'Normalize della bolla: anno e data; su INSERT eredita billing account, utility, valuta ed emittente dall''ordine sorgente (ORDINE_VENDITA), cercato con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid); senza ordine l''emittente viene dal billing account (fn_get_emittente_fiscale_pk). Utility e destinatario sono copie del billing account, dette dal BB script.fn_cliente_dal_billing_account: scritte se mancano, E_DOC_CLIENTE_DIVERSO_DA_BA se dissentono (fk_ddt_ba_cliente resta la rete sotto); il quando e'' qui: INSERT, e UPDATE in bozza di billing account, destinatario o utility, con la copia non toccata che segue il billing account nuovo. Un billing account tolto toglie la utility e lascia il destinatario.';

              COMMENT ON FUNCTION vendite.trgfn_resi_default_magazzino() IS
                'BEFORE INSERT su vendite.resi: se magazzino_id manca, prende il magazzino della bolla d''origine (DDT_VENDITA, cercata con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid)): la merce rientra, di norma, da dove era partita. Non il predefinito dell''emittente. Bolla senza magazzino: resta NULL, e se il reso muove merce lo chiede la check della conferma. Gira dopo vendite.trgfn_resi_normalize e prima del guard (ordine alfabetico, fascia z10).';

              COMMENT ON FUNCTION vendite.fn_conferma_reso(p_reso_id vendite.resi.id%TYPE) IS
                'Il verbo della conferma di un reso: DRAFT -> CONFERMATO. SECURITY DEFINER con search_path bloccato; testata FOR UPDATE nel perimetro (script.fn_scope_ef_whitelist_via_reso; fuori perimetro E_RESO_NOT_FOUND); il permesso dalla riga del passaggio della matrice (script.fn_guard_passaggio, conferma_reso); fuori bozza E_RESO_STATO_NON_CONFERMABILE. Su un reso che fa rientrare merce (vendite.fn_reso_muove_merce): lock della bolla d''origine, primo motivo di script.fn_check_reso_merce, rientri automatici, carichi in coda (vendite.fn_posta_reso, CARICO_RESO_VEN al costo dell''uscita). Lo stato del reso e il passaggio della bolla CONSEGNATO -> RESO, se il reso copre tutta la merce (le sole righe di merce, script.fn_natura_e_merce; contano i resi confermati, vw_resi_righe_effettive), dalla scrittura comune script.fn_doc_scrivi_stato. La bolla si cerca con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid). Lo stato dell''ordine lo proietta vendite.fn_ordine_proietta_stato_evasione. Una transazione; RETURNS void.';

              COMMENT ON FUNCTION vendite.fn_annulla_reso(p_reso_id vendite.resi.id%TYPE) IS
                'Il verbo dell''annullo di un reso, con storno: -> ANNULLATO, gemello di vendite.fn_conferma_reso. SECURITY DEFINER con search_path bloccato; testata FOR UPDATE nel perimetro (fuori perimetro E_RESO_NOT_FOUND); il permesso dalla riga del passaggio (script.fn_guard_passaggio): CONFERMATO -> ANNULLATO chiede conferma_reso, DRAFT -> ANNULLATO il solo permesso sul documento. Due rifiuti prima di qualunque scrittura: E_RESO_ANNULLO_CON_RICONSEGNE (la merce e'' gia'' ripartita) ed E_RESO_ANNULLO_CON_ACCREDITO (esiste una riga in vendite.resi_righe_accrediti: senza, le rettifiche negative resterebbero vive e la fatturazione emetterebbe una nota di credito per un reso annullato). Si rifiuta e non si cascata: l''annullo dell''accredito (vendite.fn_annulla_accredito_riga_reso) chiede un motivo, e un accredito non piu'' disfacibile lo dice lui (E_ACCREDITO_ANNULLO_NON_AMMESSO). Vincolo reciproco con script.fn_check_rinuncia_reversibile e vendite.fn_annulla_accredito_riga_reso: l''annullo dell''accredito cancella le righe di ponte, e i tre posti cambiano insieme. Annullando un reso confermato che aveva fatto rientrare merce, i carichi si stornano (magazzino.fn_storna_movimenti_sorgente sui rientri) al costo del carico; se la merce e'' gia'' uscita di nuovo, la primitiva rifiuta. Lo stato del reso e il ritorno della bolla RESO -> CONSEGNATO, se il reso non copre piu'' tutta la merce (le sole righe di merce; contano i resi confermati), dalla scrittura comune script.fn_doc_scrivi_stato. La bolla si cerca con la regola (doc.id = sorgente_id OR doc.uid = sorgente_uid). Lo stato dell''ordine lo proietta vendite.fn_ordine_proietta_stato_evasione. RETURNS void.';

              COMMENT ON FUNCTION vendite.fn_ddt_push_diagnosi(p_ddt_id vendite.ddt.id%TYPE) IS
                'La fonte unica dell''eleggibilita'' al push a commessa: per ogni riga ATTIVA di bolla, il motivo di esclusione (NULL = eleggibile) e i fatti per chi agisce: billing_account_id (della testata; NULL se manca o se invisibile a chi legge), ordine_riga_id (la riga d''ordine sorgente, primo fulfillment per id), segment (LIBERA, ALLOCATA, EMESSA da script.fn_get_stato_push_segment), quantita_push (GREATEST(0, LEAST(quantita, differenza della partita))). p_ddt_id NULL = tutte le righe. vendite.fn_list_ddt_da_pushare deriva da qui, script.fn_available_actions_ddt la legge una volta: un predicato di eleggibilita'' nuovo si aggiunge qui come rank. motivo_rank = precedenza: 1 ANNULLATO/RESO, 2 SOLO_TRASPORTO (causale non fatturabile o assente), 3 SENZA_BA, 4 ROUTED, 5 MERCE_IN_VIAGGIO, 6 FATTURA_DA_ORDINE, 7 RICONSEGNA, 8 NON_FATTURABILE, 9 NON_MISURABILE, 10 SENZA_PARTITA, 11 CONTATORE. La riga-onere (script.fn_natura_e_merce false sulla natura congelata) non e'' merce: le rank della partita (7-11) non la guardano e la dose e'' la sua quantita''; le rank 1-6 valgono come per la merce, e per l''onere senza legame il trigger dell''ordine si legge da vendite.fn_ddt_trigger_ordine_testata con la sorgente intera della bolla (tipo, uid, id). La chiave della riga la compone script.fn_segment_key. Il billing account e'' uno, quello della testata. Tutto si legge per seme, e le CTE MATERIALIZED sono la forma: la partita da vendite.fn_partite_merce col seme della bolla (pm), i billing account visibili seminati dalle chiavi in gioco (ba_vis, INVOKER: un billing account che la policy non mostra lascia la riga SENZA_BA), la riga d''ordine sorgente (src). Il documento chiesto e'' un seme a due rami in UNION ALL. BEGIN ATOMIC.';

              COMMENT ON FUNCTION script.fn_check_ddt_emittibile(p_ddt vendite.ddt) IS
                'I motivi che impediscono l''emissione (EMESSO) di una bolla. Pura: non solleva; [] se emittibile, altrimenti un array ordinato di {codice, reason, reason_key, dettaglio}, e l''ordine e'' il contratto (la capability legge il primo). 1) righe attive (543); 1-bis) almeno una riga di merce, E_DDT_EMISSIONE_SOLO_ONERI (un addebito senza merce si fa in commessa); 2) causale (544); 2-bis) il cliente, se la causale lo chiede (config.causali_trasporto.richiede_cliente): E_DDT_CLIENTE_OBBLIGATORIO; 3) prezzo risolvibile, se la causale e'' fatturabile (545); 3-bis) l''aliquota su ogni riga attiva con prezzo, E_DDT_RIGA_IVA_MANCANTE (il discrimine e'' il prezzo della riga, come in vw_ddt_righe_iva_base); 3-ter) la riga-onere che non verrebbe mai fatturata, E_DDT_ONERE_NON_FATTURABILE: qualunque onere su una causale non fatturabile, o un onere senza legame su una bolla il cui ordine di testata fattura alla conferma (il trigger da vendite.fn_ddt_trigger_ordine_testata, con la sorgente intera della bolla); 3-quater) il trasporto non dovuto, E_DDT_TRASPORTO_NON_DOVUTO: un articolo con causale onere TRASPORTO su una bolla con addebito ASSEGNATO o TERZI; 4) indirizzi obbligatori; 4-bis) indirizzi del cliente della bolla (script.fn_check_indirizzi_documento_cliente), E_INDIRIZZO_DOC_NON_DEL_CLIENTE; 5) se la causale vende, i prezzi dei componenti attivi di righe attive (script.fn_check_prezzi_autorizzati: E_DOC_PREZZO_PENDENTE, E_DOC_PREZZO_RIFIUTATO); 6) in coda, i motivi fisici di una bolla che muove merce (script.fn_check_ddt_merce). Li sollevano i guard della bolla (vendite.trgfn_ddt_guard_causale_emissione, trgfn_ddt_guard_indirizzi_obbligatori, trgfn_ddt_guard_transizione_approvazione) e il verbo vendite.fn_cambia_stato_ddt.';

              COMMENT ON INDEX vendite.ix_ddt_v_sorgente_id IS
                'Le bolle nate da un documento a chiave id, per tipo e id: il ramo sorgente_id della regola d''incontro dei lettori della sorgente di testata. Gemello di ix_ddt_v_sorgente (ramo uid). Non unico: piu'' bolle per ordine.';

              COMMENT ON INDEX vendite.ix_resi_sorgente_id IS
                'I resi nati da una bolla, per tipo e id: il ramo sorgente_id della regola d''incontro dei lettori della sorgente di testata. Gemello di ix_resi_sorgente (ramo uid). Non unico: piu'' resi per bolla.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- I COMMENT di prima sono nei changeSet del giro 0.3: un rollback li riprende da li'.
              SELECT 1;
