databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20251103-04-create-trg_a10_ins_upd_ddt_righe_qta_from_operativa-mctit.yaml

  - changeSet:
      id: 20251103-04-create-trg_a10_ins_upd_ddt_righe_qta_from_operativa
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
                  DROP TRIGGER IF EXISTS trg_a10_ins_upd_ddt_righe_qta_from_operativa ON vendite.ddt_righe;

                  CREATE TRIGGER trg_a10_ins_upd_ddt_righe_qta_from_operativa
                  BEFORE INSERT OR UPDATE ON vendite.ddt_righe
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_qta_from_operativa();
