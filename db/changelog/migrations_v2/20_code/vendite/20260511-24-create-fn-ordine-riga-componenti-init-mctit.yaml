# ------------------------------------------------------------
# Funzione di dominio: inizializza i componenti BoM CASO A per
# una riga ordine composita.
#
# Chiamata dal BE dopo INSERT di ordini_righe se articolo
# is_composito=TRUE e CASO A (almeno un componente esposto).
#
# Logica:
#   1. Legge articolo_id, uom_operativa_id, quantita, ordine_id
#      dalla riga padre.
#   2. Se not is_composito -> RETURN 0 (no-op silenzioso, CASO B).
#   3. Idempotenza: se componenti gia' presenti -> RETURN 0.
#   4. Legge billing_account_id da ordini (utility_id: assente -> NULL).
#   5. Chiama fn_resolve_prezzo_composito (CASO A: N righe esposti).
#   6. Per ogni componente esposto: INSERT in
#      ordini_righe_componenti con prezzo/origine dal resolver.
#   7. Fallback: se resolver solleva P0001 (listino non trovato),
#      inserisce tutti i componenti dalla BoM con prezzo=0/MANUALE.
#      L'operatore digita il prezzo manualmente in UI.
#   8. Ritorna numero componenti inseriti (0 = no-op).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260511-24-create-fn-ordine-riga-componenti-init-mctit.yaml

  - changeSet:
      id: 20260511-24-01-create-fn-ordine-riga-componenti-init
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Crea vendite.fn_ordine_riga_componenti_init.
        Popola ordini_righe_componenti per una riga composita CASO A.
        Idempotente. Fallback resolver: inserisce con prezzo=0/MANUALE.
        Ritorna INTEGER: numero componenti inseriti.
        ordini non ha utility_id: il resolver riceve NULL per quel parametro.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: ordini_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'vendite'
                   AND p.proname = 'fn_resolve_prezzo_composito';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_ordine_riga_componenti_init(
                  p_riga_id             vendite.ordini_righe.id%TYPE,
                  p_emittente_sr_id     anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE,
                  p_data_riferimento    vendite.ordini.data%TYPE
              ) RETURNS integer
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Scopo: Popola ordini_righe_componenti per una riga composita CASO A.
                  --   Chiama fn_resolve_prezzo_composito per prezzi/origini per componente.
                  --   Idempotente: no-op se componenti gia' presenti o articolo non composito.
                  --   Fallback P0001: inserisce tutti i componenti BoM con prezzo=0, MANUALE.
                  --   ordini non ha utility_id: il resolver riceve NULL per quel parametro.
                  v_articolo_id    catalogo.articoli.id%TYPE;
                  v_uom_id         catalogo.unita_misura.id%TYPE;
                  v_qta_padre      vendite.ordini_righe.quantita%TYPE;
                  v_ordine_id      vendite.ordini.id%TYPE;
                  v_is_composito   catalogo.articoli.is_composito%TYPE;
                  v_ba_id          anagrafiche.billing_account.id%TYPE;
                  v_bom_entry_id   catalogo.articoli_componenti.id%TYPE;
                  v_comp           record;
                  v_bom_rec        record;
                  v_inserted       integer := 0;
                  v_resolve_failed boolean := FALSE;
              BEGIN
                  -- Guard input
                  IF p_riga_id IS NULL OR p_riga_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_riga_id'),
                          NULL::uuid,
                          'p_riga_id obbligatorio e > 0'
                      );
                  END IF;

                  IF p_emittente_sr_id IS NULL OR p_emittente_sr_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_emittente_sr_id'),
                          NULL::uuid,
                          'p_emittente_sr_id obbligatorio e > 0'
                      );
                  END IF;

                  -- Legge dati riga padre
                  SELECT or_.articolo_id,
                         or_.uom_operativa_id,
                         or_.quantita,
                         or_.ordine_id
                    INTO v_articolo_id, v_uom_id, v_qta_padre, v_ordine_id
                    FROM vendite.ordini_righe or_
                   WHERE or_.id = p_riga_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite', 'fn_ordine_riga_componenti_init',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('p_riga_id', p_riga_id),
                          NULL::uuid,
                          'riga ordine non trovata'
                      );
                  END IF;

                  -- No-op silenzioso su articolo non composito (CASO B)
                  SELECT a.is_composito INTO v_is_composito
                    FROM catalogo.articoli a WHERE a.id = v_articolo_id;

                  IF NOT COALESCE(v_is_composito, FALSE) THEN
                      RETURN 0;
                  END IF;

                  -- Idempotenza: se gia' presenti componenti, no-op
                  IF EXISTS (
                      SELECT 1 FROM vendite.ordini_righe_componenti
                       WHERE riga_ordine_id = p_riga_id
                  ) THEN
                      RETURN 0;
                  END IF;

                  -- Legge billing_account_id dall'ordine (utility_id non presente su ordini)
                  SELECT o.billing_account_id
                    INTO v_ba_id
                    FROM vendite.ordini o WHERE o.id = v_ordine_id;

                  -- Chiama resolver composito (CASO A: N righe, solo esposti)
                  -- Sottoblocco con savepoint: cattura P0001 (listino mancante)
                  -- e attiva fallback.
                  BEGIN
                      FOR v_comp IN
                          SELECT *
                            FROM vendite.fn_resolve_prezzo_composito(
                                v_articolo_id,
                                COALESCE(v_uom_id, (SELECT uom_id FROM catalogo.articoli WHERE id = v_articolo_id)),
                                p_data_riferimento,
                                v_ba_id,
                                NULL,          -- utility_id: non presente su ordini
                                p_emittente_sr_id,
                                NULL
                            )
                           WHERE esposto_in_fattura = TRUE
                      LOOP
                          -- Trova id riga BoM per il componente
                          SELECT ac.id INTO v_bom_entry_id
                            FROM catalogo.articoli_componenti ac
                           WHERE ac.prodotto_id            = v_articolo_id
                             AND ac.componente_id          = v_comp.componente_id
                             AND ac.esposto_in_fattura     = TRUE
                             AND COALESCE(ac.attivo, TRUE) = TRUE
                             AND ac.validita              @> p_data_riferimento
                           LIMIT 1;

                          IF v_bom_entry_id IS NULL THEN
                              CONTINUE;
                          END IF;

                          INSERT INTO vendite.ordini_righe_componenti (
                              riga_ordine_id,
                              articolo_componente_id,
                              componente_id,
                              coeff_qta_snapshot,
                              quantita,
                              uom_operativa_id,
                              factor_to_base,
                              prezzo_unitario,
                              iva_id,
                              origine_prezzo,
                              prezzo_resolver_context
                          ) VALUES (
                              p_riga_id,
                              v_bom_entry_id,
                              v_comp.componente_id,
                              v_comp.coeff_qta,
                              v_comp.coeff_qta * v_qta_padre,
                              v_comp.uom_id,
                              1,
                              v_comp.prezzo_unitario,
                              v_comp.iva_id::integer,
                              COALESCE(v_comp.origine_prezzo, 'MANUALE'),
                              jsonb_build_object(
                                  'emittente_sr_id',  p_emittente_sr_id,
                                  'data_riferimento', p_data_riferimento,
                                  'ba_id',            v_ba_id
                              )
                          );
                          v_inserted := v_inserted + 1;
                      END LOOP;

                  EXCEPTION WHEN SQLSTATE 'P0001' THEN
                      -- Resolver fallito: rollback inserimenti parziali, attiva fallback
                      v_inserted       := 0;
                      v_resolve_failed := TRUE;
                  END;

                  -- Fallback: resolver ha fallito -> inserisce tutti i componenti
                  -- dalla BoM con prezzo=0 e origine=MANUALE.
                  IF v_resolve_failed THEN
                      FOR v_bom_rec IN
                          SELECT ac.id     AS bom_entry_id,
                                 ac.componente_id,
                                 ac.coeff_qta,
                                 a.uom_id  AS componente_uom_id,
                                 a.iva_id  AS componente_iva_id
                            FROM catalogo.articoli_componenti ac
                            JOIN catalogo.articoli a ON a.id = ac.componente_id
                           WHERE ac.prodotto_id        = v_articolo_id
                             AND ac.esposto_in_fattura = TRUE
                             AND ac.validita          @> p_data_riferimento
                      LOOP
                          INSERT INTO vendite.ordini_righe_componenti (
                              riga_ordine_id,
                              articolo_componente_id,
                              componente_id,
                              coeff_qta_snapshot,
                              quantita,
                              uom_operativa_id,
                              factor_to_base,
                              prezzo_unitario,
                              iva_id,
                              origine_prezzo,
                              prezzo_resolver_context
                          ) VALUES (
                              p_riga_id,
                              v_bom_rec.bom_entry_id,
                              v_bom_rec.componente_id,
                              v_bom_rec.coeff_qta,
                              v_bom_rec.coeff_qta * v_qta_padre,
                              v_bom_rec.componente_uom_id,
                              1,
                              0,
                              v_bom_rec.componente_iva_id,
                              'MANUALE',
                              jsonb_build_object(
                                  'error',            'resolver_failed',
                                  'emittente_sr_id',  p_emittente_sr_id,
                                  'data_riferimento', p_data_riferimento,
                                  'ba_id',            v_ba_id
                              )
                          );
                          v_inserted := v_inserted + 1;
                      END LOOP;
                  END IF;

                  RETURN v_inserted;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.fn_ordine_riga_componenti_init(bigint, bigint, date)
              IS 'Inizializza componenti BoM CASO A per una riga ordine composita. '
                 'Chiama fn_resolve_prezzo_composito e inserisce una riga per ogni '
                 'componente esposto_in_fattura=TRUE. Idempotente (no-op se componenti '
                 'gia'' presenti o articolo non composito). Fallback P0001: inserisce '
                 'tutti i componenti con prezzo=0/MANUALE. Ritorna n. componenti inseriti. '
                 'ordini non ha utility_id: il resolver riceve NULL per quel parametro.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS vendite.fn_ordine_riga_componenti_init(bigint, bigint, date);
