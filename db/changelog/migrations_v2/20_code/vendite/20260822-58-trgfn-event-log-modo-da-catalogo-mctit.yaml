# IL DISPATCH SMETTE DI ESSERE SCRITTO A MANO — lotto L4
#   vendite.trgfn_event_log_deriva_scope
#   Brief: brief-db-event-log-scope-e-riga-parlante.md §3.7
#
# ── ⭐ COSA CAMBIA, E PERCHE' VALE ──────────────────────────────────
#   Il `CASE NEW.entity_type WHEN 'LOTTO' ... END` sparisce: il modo di
#   risoluzione si legge da `config.tipi_entita`, cioe' dalla STESSA RIGA del
#   tipo.
#
#     prima: aggiungere un tipo giornalabile = TRE modifiche coordinate
#            (il CHECK sulla colonna + questo CASE + il modo in
#             script.fn_resolve_emittente_sr_id), e se una restava indietro
#             il difetto era muto
#     dopo:  UN SEED
#
#   ⭐ E soprattutto: configurazione e trigger **non possono piu' dissentire**,
#   perche' sono lo stesso dato. Era l'obiezione con cui avevo scartato il
#   catalogo (D-9) — «si potrebbe seedare un tipo che il trigger non sa
#   risolvere» — e il catalogo la risolve meglio di quanto facesse il CHECK.
#
# ── ⚠️ NULL SIGNIFICA DUE COSE, E VANNO RIFIUTATE ALLO STESSO MODO ──
#     * il tipo non e' a catalogo (o e' deprecato) -> non sappiamo cos'e';
#     * il tipo c'e' ma NON e' giornalabile (modo NULL, come `TASK_RUN`):
#       e' puntabile dal bersaglio di un errore, ma non ha un padrone da cui
#       derivare il perimetro.
#   In entrambi i casi il giornale non sa **dove collocare** l'evento, ed e'
#   esattamente cio' che il codice E_EVENT_LOG_ENTITY_TYPE_IGNOTO dice.
#
# ── ⭐ E IL MESSAGGIO SMETTE DI MENTIRE COL TEMPO ───────────────────
#   L'elenco dei tipi ammessi si LEGGE dal catalogo invece di stare scritto
#   nella frase: cosi' resta vero il giorno che il catalogo cresce.
#   ⚠️ Il messaggio 980 passa quindi da UNO a DUE segnaposto, e il CSV cambia
#   nella STESSA passata: meno valori dei segnaposto significa `22023`, cioe'
#   un errore tecnico opaco al posto dell'errore di dominio — e il caso rotto
#   sarebbe proprio quello che il messaggio esiste per gestire.
#
# ⚠️ Il corpo e' ripreso dall'oggetto VIVO (`pg_get_functiondef`), non da uno
#   YAML. Le uniche differenze sono la lettura dal catalogo, la variabile
#   `v_ammessi` e il secondo valore nel VARIADIC.
#
# Dipendenze: config.tipi_entita seminata (20260822-53/-55),
#             messaggio 980 a due segnaposto (CSV, stessa passata).
# Verifica: db/pgtap/vendite/test-event-log-deriva-scope.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260822-58-trgfn-event-log-modo-da-catalogo-mctit.yaml

  - changeSet:
      id: 20260822-58-trgfn-event-log-modo-da-catalogo
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        vendite.trgfn_event_log_deriva_scope legge il modo di risoluzione da
        config.tipi_entita al posto del CASE scritto a mano: aggiungere un tipo
        giornalabile passa da tre modifiche coordinate a un seed, e configurazione e
        trigger non possono piu' dissentire perche' sono lo stesso dato. ⭐ L'elenco dei
        tipi ammessi nel messaggio si legge dal catalogo, cosi' la frase non invecchia —
        per questo il messaggio 980 passa a due segnaposto nella stessa passata.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: tipi_entita
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_event_log_deriva_scope';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_event_log_deriva_scope()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- ⚠️ %TYPE su tutto cio' che riflette una colonna
                  --    (linee-guida-sql §5). `v_modo` e `v_ttl_days` no: il
                  --    primo e' un letterale di dispatch, il secondo esce da
                  --    un jsonb (params->>'ttl_days') e non ha una colonna.
                  v_modo         text;
                  v_sr_id        vendite.event_log.emittente_soggetto_ruolo_id%TYPE;
                  v_auth_user_id vendite.event_log.auth_user_id%TYPE;
                  v_ttl_days     integer;
                  v_ammessi      text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Compilare da se' le cose che il database sa e il
                  --   chiamante no: DI CHI e' la riga, CHI l'ha scritta, e
                  --   quando scade.
                  --
                  -- ⭐ LA REGOLA (D-12):
                  --   il diario rifiuta una riga SOLO quando non riesce a dire
                  --   di chi e'. Un emittente disattivato o un documento
                  --   annullato si registrano lo stesso: il fatto e' accaduto,
                  --   e rifiutare la riga distruggerebbe l'unica prova che lo
                  --   spiegherebbe. L'attivita' NUOVA su un emittente
                  --   disattivato e' gia' bloccata sui documenti.
                  --
                  -- ⚠️ Non si fida di cio' che passa il chiamante su nessuno
                  --   dei tre campi: sono fatti del database, e la logica non
                  --   si duplica in Python.
                  -- =========================================================

                  -- 1. Da che parte si guarda.
                  -- ⭐ Rev 2026-08-22 (L4). Qui c'era un CASE scritto a mano con i tre
                  --   tipi. Il modo vive adesso nella STESSA RIGA del tipo, in
                  --   config.tipi_entita: aggiungere un tipo giornalabile e' un seed,
                  --   non tre modifiche coordinate (CHECK + questo CASE + il modo in
                  --   fn_resolve_emittente_sr_id). Configurazione e trigger non
                  --   possono piu' dissentire, perche' sono lo stesso dato.
                  -- ⚠️ NULL qui significa DUE cose, e vanno entrambe rifiutate allo
                  --   stesso modo: il tipo non esiste a catalogo, oppure esiste ma NON
                  --   e' giornalabile (modo NULL, come TASK_RUN — puntabile da un
                  --   errore, senza un padrone da cui derivare il perimetro).
                  SELECT te.modo_risoluzione_emittente
                    INTO v_modo
                    FROM config.tipi_entita te
                   WHERE te.codice = NEW.entity_type
                     AND (te.obsoleto_dal IS NULL OR te.obsoleto_dal > CURRENT_DATE);

                  -- ⛔ Rev 2026-08-22 (20260822-47). Questo ramo mancava, e la
                  --   versione precedente si affidava al CHECK sulla colonna.
                  --   Ma i BEFORE ROW girano PRIMA dei CHECK: con un tipo fuori
                  --   vocabolario il CASE cadeva a NULL e il risolutore
                  --   rispondeva «il modo di risoluzione «» non esiste» —
                  --   E_PARAMETRO_INVALIDO, e un messaggio che nomina un
                  --   concetto interno al database invece del dato passato.
                  --   Il CHECK resta come invariante della colonna; qui si
                  --   presidia il PERCORSO.
                  IF v_modo IS NULL THEN
                      -- ⭐ L'elenco dei tipi ammessi si legge dal CATALOGO, non si
                      --   scrive nel messaggio: cosi' la frase resta vera il giorno che
                      --   il catalogo cresce. E' il motivo per cui il messaggio 980 e'
                      --   passato da uno a due segnaposto nella stessa passata
                      --   (arita': due `%s`, due valori nel VARIADIC).
                      SELECT string_agg(te.codice, ', ' ORDER BY te.codice)
                        INTO v_ammessi
                        FROM config.tipi_entita te
                       WHERE te.modo_risoluzione_emittente IS NOT NULL
                         AND (te.obsoleto_dal IS NULL OR te.obsoleto_dal > CURRENT_DATE);

                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_event_log_deriva_scope',
                          'E_EVENT_LOG_ENTITY_TYPE_IGNOTO',
                          jsonb_build_object(
                              'detail',      'entity_type fuori dal vocabolario del giornale',
                              'entity_type', NEW.entity_type,
                              'entity_id',   NEW.entity_id,
                              'event_code',  NEW.event_code
                          ),
                          NULL::uuid,
                          NEW.entity_type,
                          v_ammessi
                      );
                  END IF;

                  -- 2. Di chi e'. La risoluzione gira FUORI dalla row security
                  --    (SECURITY DEFINER): «non la vedo» non e' «non esiste».
                  v_sr_id := script.fn_resolve_emittente_sr_id(v_modo, NEW.entity_id);

                  IF v_sr_id IS NULL THEN
                      -- ⛔ L'entita' non esiste: non c'e' modo di dire di chi
                      --    sia la riga. Codice DIVERSO dal precedente perche'
                      --    il rimedio e' diverso — li' «usa uno dei tre tipi»,
                      --    qui «quell'entita' non c'e'».
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'trgfn_event_log_deriva_scope',
                          'E_EVENT_LOG_SCOPE_NON_RISOLTO',
                          jsonb_build_object(
                              'detail',      'Entita non trovata: perimetro non derivabile',
                              'entity_type', NEW.entity_type,
                              'entity_id',   NEW.entity_id,
                              'event_code',  NEW.event_code
                          ),
                          NULL::uuid,
                          NEW.entity_type,
                          NEW.entity_id::text
                      );
                  END IF;

                  NEW.emittente_soggetto_ruolo_id := v_sr_id;

                  -- 3. Chi, come numero. `user_insert` (il nome) lo scrive il
                  --    trigger di audit leggendo app.jwt_user; qui si tiene
                  --    l'id, che regge a un rename. NULL sul canale batch, dove
                  --    non c'e' un utente: li' «chi» resta user_insert.
                  v_auth_user_id := NULLIF(
                      current_setting('app.current_user_id', true), ''
                  )::bigint;
                  NEW.auth_user_id := v_auth_user_id;

                  -- 4. Quando scade. ⭐ Si valorizza QUI e non con
                  --    dbops.fn_apply_cleanup_at, che userebbe un UPDATE —
                  --    vietato su questa tabella. Effetto voluto: il veto
                  --    sull'UPDATE rende la scadenza immutabile.
                  v_ttl_days := vendite.fn_event_log_ttl_days();

                  IF v_ttl_days IS NOT NULL THEN
                      NEW.cleanup_at := COALESCE(NEW.event_time, now())
                                        + make_interval(days => v_ttl_days);
                  END IF;

                  RETURN NEW;
              END
              $function$;
      # ⚠️ Nessun rollback: tornare indietro rimetterebbe il CASE scritto a
      #    mano, cioe' il vocabolario in tre posti. La strada indietro, se
      #    servisse, e' un altro changeSet in avanti.
      rollback:
        - empty: {}
