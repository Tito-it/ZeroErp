# Liquibase changelog per Zero ERP
# Snapshot precontrattuali su creazione contratto
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260120-03-trgfn-contratti-snapshot-precontrattuali-mctit.yaml

  - changeSet:
      id: 20260120-03-trgfn-contratti-snapshot-precontrattuali
      author: mctit
      comment: >
        Inserisce lo snapshot precontrattuale in vendite.contratti_utilities al momento
        della creazione del contratto, se esiste un record precontrattuale.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_contratti_snapshot_precontrattuali()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_idp_id anagrafiche.istanze_dati_precontrattuali.id%TYPE;
                v_classe_utenza_id anagrafiche.istanze_dati_precontrattuali.classe_utenza_id%TYPE;
                v_param_1_num anagrafiche.istanze_dati_precontrattuali.param_1_num%TYPE;
                v_param_2_txt anagrafiche.istanze_dati_precontrattuali.param_2_txt%TYPE;
                v_meta anagrafiche.istanze_dati_precontrattuali.meta%TYPE;
              BEGIN
                IF EXISTS (
                  SELECT 1
                  FROM vendite.contratti_utilities cu
                  WHERE cu.contratto_id = NEW.id
                ) THEN
                  RETURN NEW;
                END IF;

                SELECT id,
                       classe_utenza_id,
                       param_1_num,
                       param_2_txt,
                       meta
                  INTO v_idp_id,
                       v_classe_utenza_id,
                       v_param_1_num,
                       v_param_2_txt,
                       v_meta
                  FROM anagrafiche.istanze_dati_precontrattuali
                 WHERE istanza_utility_id = NEW.istanza_utility_id
                   AND utility_id = NEW.utility_id
                 ORDER BY data_update DESC, id DESC
                 LIMIT 1;

                IF v_idp_id IS NULL THEN
                  RETURN NEW;
                END IF;

                INSERT INTO vendite.contratti_utilities (
                  contratto_id,
                  istanza_utility_id,
                  utility_id,
                  istanza_dati_precontrattuali_id,
                  classe_utenza_id,
                  param_1_num,
                  param_2_txt,
                  meta
                )
                VALUES (
                  NEW.id,
                  NEW.istanza_utility_id,
                  NEW.utility_id,
                  v_idp_id,
                  v_classe_utenza_id,
                  v_param_1_num,
                  v_param_2_txt,
                  COALESCE(v_meta, '{}'::jsonb)
                );

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_contratti_snapshot_precontrattuali()
                IS 'Snapshot precontrattuali su INSERT di vendite.contratti (crea vendite.contratti_utilities se disponibile).';

              DROP TRIGGER IF EXISTS trg_contratti_z90_snapshot_precontrattuali_ins
                ON vendite.contratti;

              CREATE TRIGGER trg_contratti_z90_snapshot_precontrattuali_ins
                AFTER INSERT
                ON vendite.contratti
                FOR EACH ROW
                EXECUTE FUNCTION vendite.trgfn_contratti_snapshot_precontrattuali();

              COMMENT ON TRIGGER trg_contratti_z90_snapshot_precontrattuali_ins
                ON vendite.contratti
                IS 'Crea snapshot precontrattuale in vendite.contratti_utilities al momento della creazione del contratto.';
