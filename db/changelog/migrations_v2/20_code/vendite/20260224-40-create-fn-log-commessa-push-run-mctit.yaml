databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260224-40-create-fn-log-commessa-push-run-mctit.yaml

  - changeSet:
      id: 20260224-40-create-fn-log-commessa-push-run
      author: mctit
      comment: "Registra un run dell'orchestratore push commesse in vendite.commesse_push_log."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.fn_log_commessa_push_run(
                p_dry_run vendite.commesse_push_log.dry_run%TYPE DEFAULT false,
                p_source_types vendite.commesse_push_log.source_types%TYPE DEFAULT NULL,
                p_risultato vendite.commesse_push_log.risultato%TYPE DEFAULT '{}'::jsonb,
                p_stato vendite.commesse_push_log.stato%TYPE DEFAULT 'COMPLETATO'::varchar,
                p_durata_ms vendite.commesse_push_log.durata_ms%TYPE DEFAULT NULL,
                p_user_run vendite.commesse_push_log.user_run%TYPE DEFAULT NULL
              )
              RETURNS vendite.commesse_push_log.id%TYPE
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_id vendite.commesse_push_log.id%TYPE;
                v_stato vendite.commesse_push_log.stato%TYPE;
                v_user_run vendite.commesse_push_log.user_run%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Inserire una riga audit append-only per il run del push
                --   commesse, con validazioni fail-fast sui campi principali.
                --
                -- Regole:
                --   - stato ammesso: COMPLETATO | PARZIALE | ERRORE
                --   - durata_ms, se valorizzata, deve essere >= 0
                --   - user_run fallback a current_user se non fornito
                -- =========================================================
                v_stato := upper(COALESCE(NULLIF(btrim(p_stato), ''), ''));
                IF v_stato = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_log_commessa_push_run','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object('detail','stato run obbligatorio')
                    ),
                    NULL::uuid,
                    'stato run obbligatorio'
                  );
                END IF;

                IF v_stato NOT IN ('COMPLETATO', 'PARZIALE', 'ERRORE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_log_commessa_push_run','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object(
                        'detail','stato run non valido',
                        'stato',v_stato
                      )
                    ),
                    NULL::uuid,
                    concat('stato run non valido: ', v_stato)
                  );
                END IF;

                IF p_durata_ms IS NOT NULL AND p_durata_ms < 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'vendite','fn_log_commessa_push_run','E_GENERICO',
                    jsonb_build_object(
                      'scope','COMMESSE','severity','C','code','E_GENERICO',
                      'lotto_id',NULL,'fattura_id',NULL,
                      'context',jsonb_build_object(
                        'detail','durata_ms non valida',
                        'durata_ms',p_durata_ms
                      )
                    ),
                    NULL::uuid,
                    'durata_ms non valida'
                  );
                END IF;

                v_user_run := COALESCE(NULLIF(btrim(p_user_run), ''), current_user);

                INSERT INTO vendite.commesse_push_log (
                  dry_run,
                  source_types,
                  risultato,
                  stato,
                  durata_ms,
                  user_run
                )
                VALUES (
                  COALESCE(p_dry_run, false),
                  p_source_types,
                  COALESCE(p_risultato, '{}'::jsonb),
                  v_stato,
                  p_durata_ms,
                  v_user_run
                )
                RETURNING id INTO v_id;

                RETURN v_id;
              END
              $function$;

              COMMENT ON FUNCTION vendite.fn_log_commessa_push_run(boolean, text[], jsonb, varchar, integer, text)
              IS 'Registra il run dell''orchestratore push commesse in vendite.commesse_push_log con validazioni su stato e durata.';
