    - changeSet:
          id: 20260331-09-fix-fn-create-fatturazione-lotto
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_create_fatturazione_lotto: 13x E_GENERICO → codici specifici.
              Semplificato JSONB context.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_create_fatturazione_lotto
                        --
                        -- Scopo: crea un lotto di fatturazione con parametri coerenti
                        --        e stato iniziale DRAFT.
                        --
                        -- Regole emittente (fallback operativo):
                        --   1) se p_emittente_soggetto_ruolo_id presente → usa/valida
                        --   2) se BA presente → mapping via fn_get_emittente_fiscale_id
                        --   3) se esiste un unico emittente attivo → usa quello
                        --   4) altrimenti → errore bloccante
                        --
                        -- Fix 20260331: 13x E_GENERICO → codici specifici
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION vendite.fn_create_fatturazione_lotto(
                            p_competenza_mese             DATE,
                            p_tipo_doc_fiscale_id         config.tipi_doc_fiscale.id%TYPE,
                            p_utility_id                  config.utilities.id%TYPE              DEFAULT NULL,
                            p_billing_account_id          anagrafiche.billing_account.id%TYPE   DEFAULT NULL,
                            p_lock_batch_id               UUID                                  DEFAULT NULL,
                            p_meta                        JSONB                                 DEFAULT NULL,
                            p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE    DEFAULT NULL
                        )
                        RETURNS vendite.fatturazione_lotti.id%TYPE
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_competenza          vendite.fatturazione_lotti.competenza_mese%TYPE;
                            v_utility_id          config.utilities.id%TYPE;
                            v_lock_batch_id       vendite.fatturazione_lotti.lock_batch_id%TYPE;
                            v_lotto_id            vendite.fatturazione_lotti.id%TYPE;
                            v_stato_doc_id        config.stati_doc_fiscale.id%TYPE;
                            v_map_exists          BOOLEAN;
                            v_emittente_id        vendite.fatturazione_lotti.emittente_soggetto_ruolo_id%TYPE;
                            v_single_emittente_count BIGINT;
                        BEGIN
                            -- Guard: parametri obbligatori
                            IF p_competenza_mese IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_competenza_mese', 'valore', NULL),
                                    NULL::uuid, 'p_competenza_mese obbligatoria'
                                );
                            END IF;

                            IF p_tipo_doc_fiscale_id IS NULL OR p_tipo_doc_fiscale_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', p_tipo_doc_fiscale_id),
                                    NULL::uuid, 'p_tipo_doc_fiscale_id obbligatorio e > 0'
                                );
                            END IF;

                            IF p_utility_id IS NOT NULL AND p_utility_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_utility_id', 'valore', p_utility_id),
                                    NULL::uuid, 'p_utility_id se fornito deve essere > 0'
                                );
                            END IF;

                            IF p_billing_account_id IS NOT NULL AND p_billing_account_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_billing_account_id', 'valore', p_billing_account_id),
                                    NULL::uuid, 'p_billing_account_id se fornito deve essere > 0'
                                );
                            END IF;

                            IF p_emittente_soggetto_ruolo_id IS NOT NULL AND p_emittente_soggetto_ruolo_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_emittente_soggetto_ruolo_id', 'valore', p_emittente_soggetto_ruolo_id),
                                    NULL::uuid, 'p_emittente_soggetto_ruolo_id se fornito deve essere > 0'
                                );
                            END IF;

                            -- Competenza normalizzata al primo del mese
                            v_competenza := date_trunc('month', p_competenza_mese)::DATE;

                            -- Risolvi utility da BA se fornito
                            v_utility_id := p_utility_id;
                            IF p_billing_account_id IS NOT NULL THEN
                                SELECT ba.utility_id
                                  INTO v_utility_id
                                  FROM anagrafiche.billing_account ba
                                 WHERE ba.id = p_billing_account_id;

                                IF v_utility_id IS NULL THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'vendite', 'fn_create_fatturazione_lotto', 'E_VALORE_MANCANTE',
                                        jsonb_build_object('billing_account_id', p_billing_account_id),
                                        NULL::uuid, concat('utility non risolta da BA ', p_billing_account_id)
                                    );
                                END IF;

                                IF p_utility_id IS NOT NULL AND p_utility_id <> v_utility_id THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'vendite', 'fn_create_fatturazione_lotto', 'E_CLIENTE_UTILITY_MISMATCH_BA',
                                        jsonb_build_object('billing_account_id', p_billing_account_id, 'utility_da_parametro', p_utility_id, 'utility_da_ba', v_utility_id),
                                        NULL::uuid, p_billing_account_id::text, p_utility_id::text, v_utility_id::text
                                    );
                                END IF;
                            END IF;

                            IF v_utility_id IS NULL OR v_utility_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'utility_id', 'valore', v_utility_id),
                                    NULL::uuid, 'utility_id obbligatoria (da parametro o da billing_account)'
                                );
                            END IF;

                            -- Risolvi emittente fiscale (fallback operativo)
                            v_emittente_id := p_emittente_soggetto_ruolo_id;

                            IF v_emittente_id IS NULL AND p_billing_account_id IS NOT NULL THEN
                                v_emittente_id := anagrafiche.fn_get_emittente_fiscale_id(p_billing_account_id);
                            END IF;

                            IF v_emittente_id IS NULL THEN
                                SELECT COUNT(*)::BIGINT INTO v_single_emittente_count
                                  FROM anagrafiche.emittenti_fiscali ef
                                 WHERE ef.attivo IS TRUE;

                                IF v_single_emittente_count = 1 THEN
                                    SELECT ef.soggetto_ruolo_id INTO v_emittente_id
                                      FROM anagrafiche.emittenti_fiscali ef
                                     WHERE ef.attivo IS TRUE
                                     LIMIT 1;
                                END IF;
                            END IF;

                            IF v_emittente_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_EMITTENTE_DEFAULT_MISSING',
                                    jsonb_build_object('billing_account_id', p_billing_account_id),
                                    NULL::uuid, 'Emittente fiscale non determinabile'
                                );
                            END IF;

                            -- Verifica emittente attivo
                            SELECT EXISTS (
                                SELECT 1 FROM anagrafiche.emittenti_fiscali ef
                                 WHERE ef.soggetto_ruolo_id = v_emittente_id AND ef.attivo IS TRUE
                            ) INTO v_map_exists;

                            IF NOT v_map_exists THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_CODICE',
                                    jsonb_build_object('emittente_soggetto_ruolo_id', v_emittente_id),
                                    NULL::uuid, v_emittente_id::text, 'anagrafiche.emittenti_fiscali'
                                );
                            END IF;

                            -- Verifica tipo doc fiscale attivo
                            SELECT EXISTS (
                                SELECT 1 FROM config.tipi_doc_fiscale t
                                 WHERE t.id = p_tipo_doc_fiscale_id AND t.attivo IS TRUE
                            ) INTO v_map_exists;

                            IF NOT v_map_exists THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_CODICE',
                                    jsonb_build_object('tipo_doc_fiscale_id', p_tipo_doc_fiscale_id),
                                    NULL::uuid, p_tipo_doc_fiscale_id::text, 'config.tipi_doc_fiscale'
                                );
                            END IF;

                            -- Verifica mapping tipo_doc → registro
                            SELECT EXISTS (
                                SELECT 1 FROM vendite.tipi_doc_fiscale_registri m
                                 WHERE m.tipo_doc_fiscale_id = p_tipo_doc_fiscale_id
                            ) INTO v_map_exists;

                            IF NOT v_map_exists THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('tipo_doc_fiscale_id', p_tipo_doc_fiscale_id),
                                    NULL::uuid, concat('mapping tipo_doc_fiscale→registro per id ', p_tipo_doc_fiscale_id)
                                );
                            END IF;

                            -- Stato iniziale DRAFT
                            SELECT id INTO v_stato_doc_id
                              FROM config.stati_doc_fiscale
                             WHERE codice_interno = 'DRAFT'
                               AND applica_lotto IS TRUE
                               AND attivo IS TRUE
                             ORDER BY ordine
                             LIMIT 1;

                            IF v_stato_doc_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_create_fatturazione_lotto', 'E_CONFIG_MANCANTE',
                                    jsonb_build_object('codice_interno', 'DRAFT'),
                                    NULL::uuid, 'stato DRAFT non disponibile per lotto'
                                );
                            END IF;

                            v_lock_batch_id := COALESCE(p_lock_batch_id, uuidv7());

                            -- Creazione lotto
                            INSERT INTO vendite.fatturazione_lotti (
                                lock_batch_id, competenza_mese, utility_id, billing_account_id,
                                emittente_soggetto_ruolo_id, tipo_doc_fiscale_id,
                                stato_doc_fiscale_id, meta
                            )
                            VALUES (
                                v_lock_batch_id, v_competenza, v_utility_id, p_billing_account_id,
                                v_emittente_id, p_tipo_doc_fiscale_id,
                                v_stato_doc_id, COALESCE(p_meta, '{}'::jsonb)
                            )
                            RETURNING id INTO v_lotto_id;

                            RETURN v_lotto_id;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_create_fatturazione_lotto(DATE, BIGINT, INTEGER, BIGINT, UUID, JSONB, BIGINT)
                          IS 'Crea lotto fatturazione validando coerenza competenza/utility/tipo_doc e risolvendo emittente fiscale.';

    - changeSet:
          id: 20260331-09-fix-fn-emit-attivita-fatturabili-da-commessa
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_emit_attivita_fatturabili_da_commessa: 8x E_GENERICO → codici specifici.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_emit_attivita_fatturabili_da_commessa
                        --
                        -- Scopo: emette righe da commesse_attivita verso
                        --        attivita_fatturabili in modalita' idempotente.
                        --
                        -- Fix 20260331: 8x E_GENERICO → codici specifici
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(
                            p_commessa_id      vendite.commesse.id%TYPE,
                            p_lotto_attivita_id BIGINT DEFAULT NULL,
                            p_only_approved    BOOLEAN DEFAULT TRUE,
                            p_dry_run          BOOLEAN DEFAULT FALSE
                        )
                        RETURNS TABLE(total_candidate INTEGER, inserted_rows INTEGER, updated_rows INTEGER, skipped_rows INTEGER)
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_commessa              vendite.commesse%ROWTYPE;
                            v_root_id               vendite.commesse_sorgenti.id%TYPE;
                            v_commessa_source_id    config.sorgenti.id%TYPE;
                            v_existing_id           vendite.attivita_fatturabili.id%TYPE;
                            v_existing_fatturato    vendite.attivita_fatturabili.fatturato%TYPE;
                            v_sorgente_uid_uuid     vendite.attivita_fatturabili.sorgente_uid%TYPE;
                            v_row                   RECORD;
                        BEGIN
                            total_candidate := 0;
                            inserted_rows := 0;
                            updated_rows := 0;
                            skipped_rows := 0;

                            -- Guard: parametri
                            IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_commessa_id', 'valore', p_commessa_id),
                                    NULL::uuid, 'p_commessa_id obbligatorio e > 0'
                                );
                            END IF;

                            IF p_lotto_attivita_id IS NOT NULL AND p_lotto_attivita_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_lotto_attivita_id', 'valore', p_lotto_attivita_id),
                                    NULL::uuid, 'p_lotto_attivita_id se fornito deve essere > 0'
                                );
                            END IF;

                            -- Recupera commessa
                            SELECT c.* INTO v_commessa
                              FROM vendite.commesse c WHERE c.id = p_commessa_id;

                            IF NOT FOUND THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                                    jsonb_build_object('commessa_id', p_commessa_id),
                                    NULL::uuid, concat('commessa_id ', p_commessa_id)
                                );
                            END IF;

                            -- Verifica lotto attivita' se fornito
                            IF p_lotto_attivita_id IS NOT NULL AND NOT EXISTS (
                                SELECT 1 FROM vendite.attivita_fatturabili_lotti l WHERE l.id = p_lotto_attivita_id
                            ) THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                                    jsonb_build_object('lotto_attivita_id', p_lotto_attivita_id),
                                    NULL::uuid, concat('lotto_attivita_id ', p_lotto_attivita_id)
                                );
                            END IF;

                            -- ROOT source obbligatoria
                            SELECT cs.id INTO v_root_id
                              FROM vendite.commesse_sorgenti cs
                             WHERE cs.commessa_id = p_commessa_id AND cs.ruolo_link = 'ROOT'
                             LIMIT 1;

                            IF v_root_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_VALORE_MANCANTE',
                                    jsonb_build_object('commessa_id', p_commessa_id),
                                    NULL::uuid, concat('ROOT source mancante per commessa ', p_commessa_id)
                                );
                            END IF;

                            -- Sorgente COMMESSA
                            SELECT s.id INTO v_commessa_source_id
                              FROM config.sorgenti s
                             WHERE s.codice = 'COMMESSA' AND s.attivo IS TRUE
                             LIMIT 1;

                            IF v_commessa_source_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_CODICE',
                                    jsonb_build_object('codice', 'COMMESSA'),
                                    NULL::uuid, 'COMMESSA', 'config.sorgenti'
                                );
                            END IF;

                            -- Loop emissione righe
                            FOR v_row IN
                                SELECT ca.id, ca.segment_key, ca.articolo_id, ca.istanza_utility_id,
                                       ca.data_attivita, ca.uom_id, ca.quantita, ca.qta_operativa,
                                       ca.uom_operativa_id, ca.factor_to_base, ca.competenza_mese,
                                       ca.competenza_dal, ca.competenza_al, ca.posticipa_al,
                                       ca.tipo_doc_fiscale_id, ca.valuta_id, ca.area_geografica_id,
                                       ca.prezzo_snapshot, ca.prezzo_bloccato, ca.stato_approvazione, ca.meta,
                                       ca.sorgente_tipo_id AS ca_sorgente_tipo_id
                                  FROM vendite.commesse_attivita ca
                                 WHERE ca.commessa_id = p_commessa_id
                                   AND ca.stato_emissione = 'NON_EMESSA'
                                   AND (p_only_approved IS FALSE OR ca.stato_approvazione = 'APPROVATA')
                                 ORDER BY ca.id
                            LOOP
                                total_candidate := total_candidate + 1;

                                -- Hash segment_key → UUID deterministico
                                v_sorgente_uid_uuid := (
                                    substr(md5(v_row.segment_key), 1, 8) || '-' ||
                                    substr(md5(v_row.segment_key), 9, 4) || '-' ||
                                    substr(md5(v_row.segment_key), 13, 4) || '-' ||
                                    substr(md5(v_row.segment_key), 17, 4) || '-' ||
                                    substr(md5(v_row.segment_key), 21, 12)
                                )::uuid;

                                SELECT a.id, a.fatturato INTO v_existing_id, v_existing_fatturato
                                  FROM vendite.attivita_fatturabili a
                                 WHERE a.sorgente_tipo_id = v_commessa_source_id
                                   AND a.sorgente_uid = v_sorgente_uid_uuid
                                   FOR UPDATE;

                                IF p_dry_run THEN
                                    IF v_existing_id IS NULL THEN inserted_rows := inserted_rows + 1;
                                    ELSE updated_rows := updated_rows + 1; END IF;
                                    CONTINUE;
                                END IF;

                                IF v_existing_id IS NULL THEN
                                    INSERT INTO vendite.attivita_fatturabili (
                                        articolo_id, billing_account_id, istanza_utility_id, data_attivita,
                                        quantita, competenza_mese, approvato, fatturato, meta, sorgente_riga,
                                        posticipa_al, sorgente_tipo_id, sorgente_uid, uom_id, qta_operativa,
                                        uom_operativa_id, factor_to_base, valuta_id, prezzo_unitario,
                                        lotto_attivita_id, tipo_doc_fiscale_id, competenza_dal, competenza_al,
                                        area_geografica_id, stato_esecuzione, prezzo_bloccato,
                                        commessa_id, commessa_attivita_id, sorgente_origine_tipo_id
                                    )
                                    VALUES (
                                        v_row.articolo_id, v_commessa.billing_account_id, v_row.istanza_utility_id,
                                        v_row.data_attivita, v_row.quantita, v_row.competenza_mese,
                                        (v_row.stato_approvazione = 'APPROVATA'), false,
                                        COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                                            'scope', 'COMMESSE', 'commessa_id', p_commessa_id,
                                            'commessa_attivita_id', v_row.id, 'segment_key', v_row.segment_key
                                        ),
                                        v_row.id, v_row.posticipa_al, v_commessa_source_id, v_sorgente_uid_uuid,
                                        v_row.uom_id, v_row.qta_operativa, v_row.uom_operativa_id, v_row.factor_to_base,
                                        v_row.valuta_id, v_row.prezzo_snapshot, p_lotto_attivita_id,
                                        v_row.tipo_doc_fiscale_id, v_row.competenza_dal, v_row.competenza_al,
                                        v_row.area_geografica_id, 'PENDING', v_row.prezzo_bloccato,
                                        p_commessa_id, v_row.id, v_row.ca_sorgente_tipo_id
                                    );
                                    inserted_rows := inserted_rows + 1;
                                ELSE
                                    -- Riga esistente: errore se gia' fatturata
                                    IF COALESCE(v_existing_fatturato, false) IS TRUE THEN
                                        PERFORM script.fn_log_and_raise_error(
                                            'vendite', 'fn_emit_attivita_fatturabili_da_commessa', 'E_RIGA_GIA_FATTURATA',
                                            jsonb_build_object('attivita_fatturabili_id', v_existing_id, 'commessa_attivita_id', v_row.id),
                                            NULL::uuid, v_existing_id::text
                                        );
                                    END IF;

                                    UPDATE vendite.attivita_fatturabili a
                                       SET articolo_id = v_row.articolo_id,
                                           billing_account_id = v_commessa.billing_account_id,
                                           istanza_utility_id = v_row.istanza_utility_id,
                                           data_attivita = v_row.data_attivita,
                                           quantita = v_row.quantita,
                                           competenza_mese = v_row.competenza_mese,
                                           approvato = (v_row.stato_approvazione = 'APPROVATA'),
                                           meta = COALESCE(a.meta, '{}'::jsonb) || COALESCE(v_row.meta, '{}'::jsonb) || jsonb_build_object(
                                               'scope', 'COMMESSE', 'commessa_id', p_commessa_id,
                                               'commessa_attivita_id', v_row.id, 'segment_key', v_row.segment_key
                                           ),
                                           sorgente_riga = v_row.id,
                                           posticipa_al = v_row.posticipa_al,
                                           uom_id = v_row.uom_id,
                                           qta_operativa = v_row.qta_operativa,
                                           uom_operativa_id = v_row.uom_operativa_id,
                                           factor_to_base = v_row.factor_to_base,
                                           valuta_id = v_row.valuta_id,
                                           prezzo_unitario = v_row.prezzo_snapshot,
                                           lotto_attivita_id = COALESCE(p_lotto_attivita_id, a.lotto_attivita_id),
                                           tipo_doc_fiscale_id = v_row.tipo_doc_fiscale_id,
                                           competenza_dal = v_row.competenza_dal,
                                           competenza_al = v_row.competenza_al,
                                           area_geografica_id = v_row.area_geografica_id,
                                           prezzo_bloccato = v_row.prezzo_bloccato,
                                           commessa_id = p_commessa_id,
                                           commessa_attivita_id = v_row.id,
                                           sorgente_origine_tipo_id = v_row.ca_sorgente_tipo_id
                                     WHERE a.id = v_existing_id;
                                    updated_rows := updated_rows + 1;
                                END IF;

                                UPDATE vendite.commesse_attivita ca SET stato_emissione = 'EMESSA' WHERE ca.id = v_row.id;
                            END LOOP;

                            RETURN NEXT;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_emit_attivita_fatturabili_da_commessa(BIGINT, BIGINT, BOOLEAN, BOOLEAN)
                          IS 'Pull da commesse_attivita ad attivita_fatturabili con sorgente COMMESSA+segment_key (hash UUID) e idempotenza.';

    - changeSet:
          id: 20260331-09-fix-fn-genera-fondi-fattura-source
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_genera_fondi_fattura_source: 6x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_genera_fondi_fattura_source
                        --
                        -- Scopo: sincronizza la source fondi sul saldo effettivo
                        --        (saldo_fattura - saldo_contabile_postabile).
                        --
                        -- Fix 20260331: 6x E_GENERICO → E_PARAMETRO_INVALIDO
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION vendite.fn_genera_fondi_fattura_source(
                            p_billing_account_id         anagrafiche.billing_account.id%TYPE,
                            p_utility_id                 config.utilities.id%TYPE,
                            p_tipo_doc_fiscale_id        config.tipi_doc_fiscale.id%TYPE,
                            p_emittente_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE,
                            p_valuta_id                  config.valute.id%TYPE,
                            p_tipo_fondo_fattura_id      vendite.tipi_fondi_fattura.id%TYPE
                        )
                        RETURNS INTEGER
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_updated INTEGER := 0;
                            v_inserted INTEGER := 0;
                        BEGIN
                            -- Guard: tutti i parametri obbligatori e > 0
                            IF p_billing_account_id IS NULL OR p_billing_account_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_genera_fondi_fattura_source', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_billing_account_id', 'valore', p_billing_account_id), NULL::uuid, 'p_billing_account_id obbligatorio e > 0');
                            END IF;
                            IF p_utility_id IS NULL OR p_utility_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_genera_fondi_fattura_source', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_utility_id', 'valore', p_utility_id), NULL::uuid, 'p_utility_id obbligatorio e > 0');
                            END IF;
                            IF p_tipo_doc_fiscale_id IS NULL OR p_tipo_doc_fiscale_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_genera_fondi_fattura_source', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_tipo_doc_fiscale_id', 'valore', p_tipo_doc_fiscale_id), NULL::uuid, 'p_tipo_doc_fiscale_id obbligatorio e > 0');
                            END IF;
                            IF p_emittente_soggetto_ruolo_id IS NULL OR p_emittente_soggetto_ruolo_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_genera_fondi_fattura_source', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_emittente_soggetto_ruolo_id', 'valore', p_emittente_soggetto_ruolo_id), NULL::uuid, 'p_emittente_soggetto_ruolo_id obbligatorio e > 0');
                            END IF;
                            IF p_valuta_id IS NULL OR p_valuta_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_genera_fondi_fattura_source', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_valuta_id', 'valore', p_valuta_id), NULL::uuid, 'p_valuta_id obbligatorio e > 0');
                            END IF;
                            IF p_tipo_fondo_fattura_id IS NULL OR p_tipo_fondo_fattura_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error('vendite', 'fn_genera_fondi_fattura_source', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_tipo_fondo_fattura_id', 'valore', p_tipo_fondo_fattura_id), NULL::uuid, 'p_tipo_fondo_fattura_id obbligatorio e > 0');
                            END IF;

                            -- 1) Update source esistenti non assegnate
                            WITH base AS (
                                SELECT f.id AS fattura_sorgente_id,
                                       (COALESCE(sf.saldo, 0) - COALESCE(sc.saldo_contabile, 0))::NUMERIC AS importo_target
                                  FROM vendite.fatture f
                                  CROSS JOIN LATERAL pagamenti.fn_get_saldo_fattura(f.id) sf
                                  CROSS JOIN LATERAL pagamenti.fn_get_saldo_fattura_contabili(f.id) sc
                                 WHERE f.minimo IS TRUE
                                   AND f.billing_account_id = p_billing_account_id
                                   AND f.tipo_doc_fiscale_id = p_tipo_doc_fiscale_id
                                   AND f.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id
                                   AND f.valuta_id = p_valuta_id
                            ), upd AS (
                                UPDATE vendite.fatture_fondi_fattura_source s
                                   SET importo = b.importo_target,
                                       stato = CASE WHEN COALESCE(b.importo_target, 0) = 0 THEN 'ANNULLATO' ELSE 'DISPONIBILE' END,
                                       utility_id = p_utility_id,
                                       data_update = now(), user_update = current_user
                                  FROM base b
                                 WHERE s.fattura_sorgente_id = b.fattura_sorgente_id
                                   AND s.tipo_fondo_fattura_id = p_tipo_fondo_fattura_id
                                   AND s.fattura_figlia_id IS NULL
                                   AND (s.importo IS DISTINCT FROM b.importo_target
                                        OR s.stato IS DISTINCT FROM (CASE WHEN COALESCE(b.importo_target, 0) = 0 THEN 'ANNULLATO' ELSE 'DISPONIBILE' END)
                                        OR s.utility_id IS DISTINCT FROM p_utility_id)
                                RETURNING s.id
                            )
                            SELECT COUNT(*)::INTEGER INTO v_updated FROM upd;

                            -- 2) Insert nuove source DISPONIBILE
                            WITH base AS (
                                SELECT f.id AS fattura_sorgente_id,
                                       (COALESCE(sf.saldo, 0) - COALESCE(sc.saldo_contabile, 0))::NUMERIC AS importo_target
                                  FROM vendite.fatture f
                                  CROSS JOIN LATERAL pagamenti.fn_get_saldo_fattura(f.id) sf
                                  CROSS JOIN LATERAL pagamenti.fn_get_saldo_fattura_contabili(f.id) sc
                                 WHERE f.minimo IS TRUE
                                   AND f.billing_account_id = p_billing_account_id
                                   AND f.tipo_doc_fiscale_id = p_tipo_doc_fiscale_id
                                   AND f.emittente_soggetto_ruolo_id = p_emittente_soggetto_ruolo_id
                                   AND f.valuta_id = p_valuta_id
                                   AND (COALESCE(sf.saldo, 0) - COALESCE(sc.saldo_contabile, 0)) <> 0
                            ), ins AS (
                                INSERT INTO vendite.fatture_fondi_fattura_source (
                                    fattura_sorgente_id, tipo_fondo_fattura_id, importo, stato,
                                    fattura_figlia_id, data_assegnazione, user_assegnazione,
                                    billing_account_id, utility_id, tipo_doc_fiscale_id,
                                    emittente_soggetto_ruolo_id, valuta_id, meta, attivo,
                                    data_insert, user_insert, data_update, user_update
                                )
                                SELECT b.fattura_sorgente_id, p_tipo_fondo_fattura_id, b.importo_target,
                                       'DISPONIBILE', NULL, NULL, NULL,
                                       p_billing_account_id, p_utility_id, p_tipo_doc_fiscale_id,
                                       p_emittente_soggetto_ruolo_id, p_valuta_id, '{}'::jsonb, TRUE,
                                       now(), current_user, now(), current_user
                                  FROM base b
                                 WHERE NOT EXISTS (
                                     SELECT 1 FROM vendite.fatture_fondi_fattura_source s
                                      WHERE s.fattura_sorgente_id = b.fattura_sorgente_id
                                        AND s.tipo_fondo_fattura_id = p_tipo_fondo_fattura_id
                                 )
                                RETURNING id
                            )
                            SELECT COUNT(*)::INTEGER INTO v_inserted FROM ins;

                            RETURN COALESCE(v_updated, 0) + COALESCE(v_inserted, 0);
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_genera_fondi_fattura_source(BIGINT, INTEGER, BIGINT, BIGINT, INTEGER, BIGINT)
                          IS 'Sincronizza source fondi fattura sul saldo effettivo (saldo fattura - saldo contabile postabile).';

    - changeSet:
          id: 20260331-09-fix-fn-generate-fatture-righe
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_generate_fatture_righe: 1x E_GENERICO → E_PARAMETRO_INVALIDO.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_generate_fatture_righe
                        --
                        -- Scopo: genera righe fattura da attivita' lockate sul lotto.
                        --
                        -- Fix 20260331: 1x E_GENERICO → E_PARAMETRO_INVALIDO
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION vendite.fn_generate_fatture_righe(
                            p_lotto_id vendite.fatturazione_lotti.id%TYPE,
                            p_dry_run  BOOLEAN DEFAULT FALSE
                        )
                        RETURNS INTEGER
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_count          INTEGER := 0;
                            v_row            RECORD;
                            v_fattura_id     vendite.fatture.id%TYPE;
                            v_group          JSONB;
                            v_riga_nr        INTEGER;
                            v_fattura_riga_id vendite.fatture_righe.id%TYPE;
                            v_lock_batch_id  vendite.fatturazione_lotti.lock_batch_id%TYPE;
                        BEGIN
                            -- Guard: parametro obbligatorio
                            IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'vendite', 'fn_generate_fatture_righe', 'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                                    NULL::uuid, 'p_lotto_id obbligatorio e > 0'
                                );
                            END IF;

                            -- Recupera lock_batch_id dal lotto
                            SELECT fl.lock_batch_id INTO v_lock_batch_id
                              FROM vendite.fatturazione_lotti fl WHERE fl.id = p_lotto_id;

                            -- Marca attivita' come RUNNING
                            IF NOT p_dry_run AND v_lock_batch_id IS NOT NULL THEN
                                UPDATE vendite.attivita_fatturabili a
                                   SET stato_esecuzione = 'RUNNING',
                                       data_update = now(), user_update = current_user
                                 WHERE a.lock_batch_id = v_lock_batch_id
                                   AND a.fatturato IS FALSE
                                   AND COALESCE(a.lock_in_fatturazione, false) IS TRUE
                                   AND (a.stato_esecuzione IS NULL OR a.stato_esecuzione IN ('PENDING', 'RUNNING'));
                            END IF;

                            -- Loop generazione righe
                            FOR v_row IN
                                SELECT a.id, a.articolo_id, a.quantita, a.prezzo_unitario,
                                       a.uom_id, a.sorgente_tipo_id, a.sorgente_uid, a.sorgente_riga
                                  FROM vendite.attivita_fatturabili a
                                 WHERE a.lock_batch_id = v_lock_batch_id
                                   AND a.fatturato IS FALSE
                                   AND COALESCE(a.lock_in_fatturazione, false) IS TRUE
                                 ORDER BY a.id
                            LOOP
                                v_fattura_id := vendite.fn_get_or_create_fattura_header(p_lotto_id, v_row.id);
                                v_group := vendite.fn_group_attivita_fatturabili(v_row.id);

                                IF p_dry_run THEN
                                    v_count := v_count + 1;
                                    CONTINUE;
                                END IF;

                                SELECT COALESCE(max(r.riga_nr), 0) + 1 INTO v_riga_nr
                                  FROM vendite.fatture_righe r WHERE r.fattura_id = v_fattura_id;

                                INSERT INTO vendite.fatture_righe (
                                    fattura_id, riga_nr, articolo_id, descrizione, uom_id,
                                    qta, prezzo_unitario, iva_id, dest_billing_account_id,
                                    sorgente_tipo_id, sorgente_uid, sorgente_riga, meta
                                )
                                VALUES (
                                    v_fattura_id, v_riga_nr, v_row.articolo_id,
                                    (SELECT descrizione FROM catalogo.articoli WHERE id = v_row.articolo_id),
                                    (v_group->>'uom_id')::BIGINT, v_row.quantita, v_row.prezzo_unitario,
                                    (v_group->>'iva_id')::INTEGER, (v_group->>'dest_billing_account_id')::BIGINT,
                                    v_row.sorgente_tipo_id, v_row.sorgente_uid, v_row.sorgente_riga,
                                    jsonb_build_object('group_key', v_group)
                                )
                                RETURNING id INTO v_fattura_riga_id;

                                UPDATE vendite.attivita_fatturabili
                                   SET fattura_riga_id = v_fattura_riga_id, fatturato = true,
                                       stato_esecuzione = 'COMPLETED',
                                       data_update = now(), user_update = current_user
                                 WHERE id = v_row.id;

                                v_count := v_count + 1;
                            END LOOP;

                            RETURN v_count;
                        END;
                        $function$;

                        COMMENT ON FUNCTION vendite.fn_generate_fatture_righe(BIGINT, BOOLEAN)
                          IS 'Genera righe fattura da attivita lockate e aggiorna stato_esecuzione (RUNNING/COMPLETED).';
