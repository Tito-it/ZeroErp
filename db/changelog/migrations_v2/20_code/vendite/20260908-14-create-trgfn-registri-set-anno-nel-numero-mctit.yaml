# A-4 — L'ANNO NEL NUMERO SI RISOLVE ALLA NASCITA, NON SI CHIEDE
#   vendite.trgfn_registri_fatturazione_set_anno_nel_numero
#   Piano: brief-db-registri-numerazione-chiave-del-contatore, sezione 11.8
#
# -- LA REGOLA, IN UNA RIGA -----------------------------------
#   Un sezionale che azzera il progressivo ogni anno, di una famiglia il cui
#   numero porta l'anno, NASCE con l'anno nel numero. Non e' una domanda che
#   si fa a chi crea il registro: e' una conseguenza di due cose che ha gia'
#   dichiarato — la politica e la famiglia.
#
# -- PERCHE' UN RISOLUTORE E NON UN GUARD CHE RIFIUTA ---------
#   La prima stesura era un guard: `ANNUALE` + famiglia che espone + colonna
#   a false => rifiuto, con codice errore e check per la maschera. E'
#   stato scartato PRIMA di scriverlo, per una misura che ha cambiato il
#   progetto invece di confermarlo:
#     * SEI file pgTAP creano registri DDT/ORDINE/RESO `ANNUALE` senza
#       nominare la colonna nuova — sarebbero diventati rossi tutti insieme;
#     * il backend crea i registri con una whitelist di colonne che la nuova
#       non la contiene: ogni creazione dall'app sarebbe stata rifiutata
#       finche' il BE non fosse stato adeguato.
#   ⛔ Un cancello che spegne sei test e una maschera viene disattivato, e un
#   presidio spento e' peggio di uno assente. ⭐ E c'e' di meglio: se non
#   esiste un caso legittimo di «ANNUALE senza anno» per quelle famiglie,
#   allora non e' una scelta da difendere — e' un valore da DERIVARE. Cosi'
#   l'invariante vale per costruzione invece che per rifiuto, ed e' la stessa
#   lettura del 20260908-10: si ripara il meccanismo, non si vieta.
#
# -- E NON E' IL DIFETTO DI config.sistema_codici -------------
#   La regola di casa dice «sul registro si RIFIUTA, non si ignora», e
#   parlava di un campo che l'amministratore cambiava senza ottenere niente.
#   Qui non si ignora nessuna scelta: il valore viene RISOLTO e diventa
#   effettivo — la stringa del numero cambia davvero, e la si vede.
#
# -- PERCHE' IN UN TRIGGER E NON NEL PROVISIONING -------------
#   fn_provision_registri legge gia' prefisso_default e lunghezza_default
#   dalla famiglia, e la tentazione era aggiungere la terza riga li'. ⛔ Ma
#   quelle due sono DEFAULT di una scelta libera (un sezionale puo' avere il
#   prefisso che vuole), mentre questa e' una DERIVAZIONE: metterla nel solo
#   provisioning lascerebbe scoperte le altre due porte — il backend e chi
#   scrive a mano — e sarebbe la seconda sorgente di verita' che tutto questo
#   cantiere esiste per non avere.
#
# -- SOLO INSERT ----------------------------------------------
#   L'anno nel numero e' FORMA DEL NUMERO: su un sezionale che ha gia'
#   consegnato numeri non si cambia, e a impedirlo e' il guard di
#   20260901-03 (che il changeSet 20260908-15 estende a questa colonna).
#   Alla nascita, invece, non c'e' nessun numero da contraddire.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260908-14-create-trgfn-registri-set-anno-nel-numero-mctit.yaml

  - changeSet:
      id: 20260908-14-create-trgfn-registri-set-anno-nel-numero
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Alla NASCITA di un registro l''anno nel numero si risolve invece di chiederlo: se il
        sezionale azzera il progressivo ogni anno (ANNUALE) e la sua famiglia dichiara
        anno_nel_numero_default, la colonna nasce a true. ⭐ Un RISOLUTORE e non un guard che
        rifiuta, e la scelta viene da una misura: sei file pgTAP creano registri DDT/ORDINE/RESO
        ANNUALE senza nominare la colonna, e il backend li crea con una whitelist che non la
        contiene - un cancello li avrebbe spenti tutti insieme, e un presidio spento e'' peggio di
        uno assente. Se non esiste un caso legittimo di «ANNUALE senza anno» per quelle famiglie,
        il valore non e'' una scelta da difendere ma una derivazione: cosi'' l''invariante vale per
        costruzione. ⛔ In un trigger e non nel provisioning, che e'' solo una delle tre porte.
        ⛔ Solo INSERT: dopo il primo numero la forma non si tocca. Piano:
        brief-db-registri-numerazione-chiave-del-contatore, sezione 11.8 (A-4).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: registri_fatturazione
                columnName: anno_nel_numero
            - columnExists:
                schemaName: vendite
                tableName: famiglie_documento
                columnName: anno_nel_numero_default
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_registri_fatturazione_set_anno_nel_numero()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_default vendite.famiglie_documento.anno_nel_numero_default%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Risolvere alla nascita se questo sezionale espone l'anno
                  --   dentro il numero. Non e' una scelta di chi crea il
                  --   registro: discende dalla POLITICA (azzera per anno?) e
                  --   dalla FAMIGLIA (il mio numero porta l'anno?).
                  --
                  -- ⛔ PERCHE': con reset_policy = ANNUALE il progressivo
                  --   riparte da 1 a gennaio, quindi la stringa consegnata
                  --   TORNA identica su un documento diverso. L'unicita' del
                  --   documento porta l'anno in colonna, quindi non fallisce
                  --   NIENTE: l'ambiguita' non la vede il database, la vede
                  --   chi legge una lista o cita un numero al telefono.
                  --   E' l'invariante degli assi dichiarati applicata alla
                  --   stringa che una persona legge.
                  --
                  -- ⭐ NON TOCCA `NESSUNA`, ed e' voluto: un progressivo che
                  --   non riparte non si ripete, quindi la stringa e' gia'
                  --   univoca senza l'anno. La derivazione e' CONDIZIONATA
                  --   alla politica, non secca.
                  --
                  -- ⭐ E NON TOCCA CHI HA GIA' DETTO SI': se la colonna arriva
                  --   gia' true — dal backend, da una migrazione, da chi
                  --   scrive a mano — resta true. Qui si riempie un silenzio,
                  --   non si sovrascrive una risposta.
                  -- =========================================================

                  IF COALESCE(NEW.anno_nel_numero, false) THEN
                      RETURN NEW;
                  END IF;

                  IF COALESCE(NEW.reset_policy, '') <> 'ANNUALE'
                     OR NEW.famiglia_documento IS NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT f.anno_nel_numero_default
                    INTO v_default
                    FROM vendite.famiglie_documento f
                   WHERE f.codice_interno = NEW.famiglia_documento;

                  -- ⚠️ Famiglia non trovata: si tace. In esercizio la FK
                  --   garantisce la riga; il ramo esiste per la finestra del
                  --   migrate di un database ricostruito da zero, dove il
                  --   mirror dei registri gira prima di quello delle famiglie
                  --   (includeAll ordina per nome file). SELECT INTO senza
                  --   righe lascia v_default a NULL, e il COALESCE lo rende
                  --   innocuo.
                  IF COALESCE(v_default, false) THEN
                      NEW.anno_nel_numero := true;
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_registri_fatturazione_set_anno_nel_numero()
              IS 'Risolutore `_a10_` in INSERT su vendite.registri_fatturazione: un sezionale che azzera il progressivo ogni anno (reset_policy = ANNUALE), di una famiglia che dichiara anno_nel_numero_default, nasce con anno_nel_numero = true. ⛔ PERCHE'': il progressivo riparte a gennaio e la stringa consegnata torna identica su un documento diverso; l''unicita'' del documento porta l''anno in colonna, quindi nessuna scrittura fallisce e l''ambiguita'' arriva intera alle liste e a chi cita il numero. ⭐ UN RISOLUTORE E NON UN GUARD: se non esiste un caso legittimo di «ANNUALE senza anno» per quelle famiglie, il valore non e'' una scelta da difendere ma una derivazione - e cosi'' l''invariante vale per costruzione invece che per rifiuto. La misura che ha deciso: sei file pgTAP creano registri DDT/ORDINE/RESO ANNUALE senza nominare la colonna, e il backend li crea con una whitelist che non la contiene. ⭐ Riempie un silenzio, non sovrascrive una risposta: un true in arrivo resta true. ⭐ Non tocca NESSUNA: un progressivo che non riparte non si ripete. ⛔ Solo INSERT: dopo il primo numero la forma non si cambia (20260901-03). Piano: brief-db-registri-numerazione-chiave-del-contatore, sezione 11.8.';

              DROP TRIGGER IF EXISTS trg_registri_fatturazione_a10_set_anno_nel_numero_ins
                  ON vendite.registri_fatturazione;

              -- ⚠️ Fase `_a10_` come i guard, e il nome viene DOPO in ordine
              --   alfabetico rispetto a `guard_serie_ammessa`: due BEFORE ROW
              --   sulla stessa tabella parlano in ordine alfabetico, e questo
              --   deve poter scrivere NEW senza che nessuno l'abbia gia' letto
              --   per rifiutare. Nessuno dei guard esistenti legge
              --   anno_nel_numero, quindi l'ordine e' indifferente oggi: sta
              --   scritto perche' domani non lo sia per caso.
              CREATE TRIGGER trg_registri_fatturazione_a10_set_anno_nel_numero_ins
                  BEFORE INSERT ON vendite.registri_fatturazione
                  FOR EACH ROW
                  EXECUTE FUNCTION vendite.trgfn_registri_fatturazione_set_anno_nel_numero();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS trg_registri_fatturazione_a10_set_anno_nel_numero_ins
                  ON vendite.registri_fatturazione;
              DROP FUNCTION IF EXISTS vendite.trgfn_registri_fatturazione_set_anno_nel_numero();
