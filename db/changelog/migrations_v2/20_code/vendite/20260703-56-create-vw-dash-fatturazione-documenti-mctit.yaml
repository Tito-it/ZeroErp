# Dashboard fatturazione — vista union dei 5 resolver di area (brief-design-
# dashboard-fatturazione §5, Fase 1). Contratto colonne unico per il
# drill-down BE (endpoint /dashboard-fatturazione/fermi/) e per l'aggregata
# mensile (20260703-57).
#
# Layering identico alla proiezione stato dominio: resolver per area
# (20260703-51..55) -> union. Il BE consuma SOLO questa vista e l'aggregata,
# mai i resolver singoli.
#
# RLS: la vista gira come invoker — lo scope emittente degli operatori
# (preventivi/ordini/offerte/contratti) si applica automaticamente; le
# commesse non sono in RLS: filtro applicativo a carico del BE se necessario
# (emittente_soggetto_ruolo_id esposto allo scopo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20260703-56-create-vw-dash-fatturazione-documenti-mctit.yaml

  - changeSet:
      id: 20260703-56-create-vw-dash-fatturazione-documenti
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Dashboard fatturazione Fase 1: crea vendite.vw_dash_fatturazione_documenti,
        union dei 5 resolver di area (contratto colonne unico per drill-down
        e aggregata mensile).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 5
            sql: |
              SELECT COUNT(*)
                FROM pg_views
               WHERE schemaname = 'vendite'
                 AND viewname IN ('vw_dash_fatturazione_preventivi',
                                  'vw_dash_fatturazione_ordini',
                                  'vw_dash_fatturazione_offerte',
                                  'vw_dash_fatturazione_contratti',
                                  'vw_dash_fatturazione_commesse');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE VIEW vendite.vw_dash_fatturazione_documenti AS
              SELECT * FROM vendite.vw_dash_fatturazione_preventivi
              UNION ALL
              SELECT * FROM vendite.vw_dash_fatturazione_ordini
              UNION ALL
              SELECT * FROM vendite.vw_dash_fatturazione_offerte
              UNION ALL
              SELECT * FROM vendite.vw_dash_fatturazione_contratti
              UNION ALL
              SELECT * FROM vendite.vw_dash_fatturazione_commesse;

              COMMENT ON VIEW vendite.vw_dash_fatturazione_documenti IS
                'Dashboard fatturazione (brief-design-dashboard-fatturazione §5): union dei 5 resolver di area (PREVENTIVI, ORDINI, OFFERTE, CONTRATTI, COMMESSE). Una riga per documento x mese di competenza: valore/unita totali vs transitati, is_transitato, is_abortito (esito NEGATIVO - fuori dal confronto), motivo_fermo (vocabolario chiuso per drill-down), stato + fase. Consumata dal BE per il drill-down fermi e da vw_dash_fatturazione_mensile.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP VIEW IF EXISTS vendite.vw_dash_fatturazione_documenti;
