# LA QUOTA FISSA FUORI DALLA BOZZA TIENE LA PERIODICITA': LA BOZZA DALLA COLONNA iniziale
#   Brief: brief-db-stati-documento-dal-vocabolario §6.26, giro 6f (S-2 e S-3,
#   Tid 2026-11-08; via di Tid del 2026-11-15).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   In bozza il guard taceva con codice_interno = 'BOZZA'.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   La colonna iniziale; il codice resta nel contesto. Stessa lettura del NULL
#   (una versione che non si legge non passa). Con il seed la risposta e' quella
#   di prima.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, INVOKER, nessun SET (pg_proc su dbdev,
#   2026-11-15). Il montaggio non cambia. Il COMMENT, che era una cronaca, e'
#   riscritto al presente.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-15; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (20261031-51: il catalogo li scioglie).
#   Il rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261115-50-update-trgfn-listini-righe-guard-periodicita-quota-fissa-bozza-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261115-50-update-trgfn-listini-righe-guard-periodicita-quota-fissa-bozza-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_listini_righe_guard_periodicita_quota_fissa: la bozza dalla colonna iniziale, non dal
        codice BOZZA. Brief: brief-db-stati-documento-dal-vocabolario, giro 6f.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_periodicita_quota_fissa()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: fuori dalla bozza la riga di una quota fissa a canone non resta
              --   senza periodicita'. Regola completa nell'intestazione del changeSet
              --   20261031-51.
              DECLARE
                  v_stato    config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_iniziale config.stati_doc_listino_versioni.iniziale%TYPE;
                  v_versione vendite.listini_versioni.codice_versione%TYPE;
                  v_codice   catalogo.articoli.codice%TYPE;
              BEGIN
                  IF NEW.periodicita IS NOT NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.codice_interno, s.iniziale, lv.codice_versione INTO v_stato, v_iniziale, v_versione
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = NEW.listino_versione_id;

                  IF v_iniziale OR NOT vendite.fn_articolo_quota_fissa_a_canone(NEW.articolo_id) THEN
                      RETURN NEW;
                  END IF;

                  SELECT a.codice INTO v_codice FROM catalogo.articoli a WHERE a.id = NEW.articolo_id;

                  PERFORM script.fn_log_and_raise_error(
                      'vendite', TG_NAME, 'E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA',
                      jsonb_build_object(
                          'campo',               'periodicita',
                          'listino_riga_id',     NEW.id,
                          'listino_versione_id', NEW.listino_versione_id,
                          'stato_versione',      v_stato),
                      NEW.tx_id,
                      COALESCE(v_codice, NEW.articolo_id::text),
                      COALESCE(v_versione, NEW.listino_versione_id::text));
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_periodicita_quota_fissa()
              IS 'Guard di vendite.listini_righe (BEFORE UPDATE OF periodicita, quando la periodicita'' va a NULL): fuori dalla bozza (lo stato iniziale del vocabolario config.stati_doc_listino_versioni) la riga di una quota fissa a canone (vendite.fn_articolo_quota_fissa_a_canone) non resta senza periodicita'' (E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA, campo periodicita). Cambiarla con un''altra resta una rettifica, come il prezzo (vendite.trgfn_listini_righe_guard_stato). Completa il controllo all''attivazione: senza, la riga perderebbe la periodicita'' dopo, e ogni contratto del listino resterebbe in CANONE_NON_GENERABILE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_listini_righe_guard_periodicita_quota_fissa()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Scopo: fuori dalla bozza la riga di una quota fissa a canone non resta
              --   senza periodicita'. Regola completa nell'intestazione del changeSet
              --   20261031-51.
              DECLARE
                  v_stato    config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_versione vendite.listini_versioni.codice_versione%TYPE;
                  v_codice   catalogo.articoli.codice%TYPE;
              BEGIN
                  IF NEW.periodicita IS NOT NULL THEN
                      RETURN NEW;
                  END IF;

                  SELECT s.codice_interno, lv.codice_versione INTO v_stato, v_versione
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = NEW.listino_versione_id;

                  IF v_stato = 'BOZZA' OR NOT vendite.fn_articolo_quota_fissa_a_canone(NEW.articolo_id) THEN
                      RETURN NEW;
                  END IF;

                  SELECT a.codice INTO v_codice FROM catalogo.articoli a WHERE a.id = NEW.articolo_id;

                  PERFORM script.fn_log_and_raise_error(
                      'vendite', TG_NAME, 'E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA',
                      jsonb_build_object(
                          'campo',               'periodicita',
                          'listino_riga_id',     NEW.id,
                          'listino_versione_id', NEW.listino_versione_id,
                          'stato_versione',      v_stato),
                      NEW.tx_id,
                      COALESCE(v_codice, NEW.articolo_id::text),
                      COALESCE(v_versione, NEW.listino_versione_id::text));
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_listini_righe_guard_periodicita_quota_fissa()
              IS 'Guard di vendite.listini_righe (BEFORE UPDATE OF periodicita, quando la periodicita'' va a NULL): fuori dalla bozza la riga di una quota fissa a canone (vendite.fn_articolo_quota_fissa_a_canone) non resta senza periodicita'' (E_LISTINO_QUOTA_FISSA_PERIODICITA_FERMA, campo periodicita). Cambiarla con un''altra resta una rettifica, come il prezzo (vendite.trgfn_listini_righe_guard_stato). Chiude il buco del controllo all''attivazione (D-3): senza, la quota la perdeva dopo, e ogni contratto del listino restava in CANONE_NON_GENERABILE. Nasce il 2026-10-31 (20261031-51), brief-db-contratto-righe-periodiche-in-commessa §7.10.';
