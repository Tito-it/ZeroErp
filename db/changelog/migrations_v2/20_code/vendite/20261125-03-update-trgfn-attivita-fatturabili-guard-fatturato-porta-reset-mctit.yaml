# LA PORTA DEL RESET CHIEDE ANCHE IL PROPRIETARIO
#   vendite.trgfn_attivita_fatturabili_guard_fatturato
#   Brief: brief-db-porte-aperte-dalla-sola-guc §13.5 (giro 8 + 1-7, porte 1-7; D-A a, D-W a di Tid).
#
# -- CHE COSA CAMBIA ---------------------------------------------------------
#   La porta del reset del lotto si legge da vendite.fn_porta_reset_lotto_aperta
#   (20261125-02): GUC accesa E proprietario della tabella. Prima bastava la
#   GUC, e l'app poteva accenderla da se' e scrivere diretta. La lettura copiata
#   qui si ritira (regola del 2). Il resto del guard e' invariato; il COMMENT
#   si riscrive al presente (linee-guida-sql §5d).
#   Corpo dal catalogo di dbdev.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/vendite/20261125-03-update-trgfn-attivita-fatturabili-guard-fatturato-porta-reset-mctit.yaml

  - changeSet:
      id: 20261125-03-update-trgfn-attivita-fatturabili-guard-fatturato-porta-reset
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        vendite.trgfn_attivita_fatturabili_guard_fatturato: la porta del reset del lotto dal BB,
        GUC e proprietario. Brief: brief-db-porte-aperte-dalla-sola-guc §13.5.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_fatturato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Blocca UPDATE/DELETE se la riga e' gia' fatturata
                --   (fattura_riga_id valorizzato).
                --   Passa solo dalla porta del reset del lotto: GUC e proprietario
                --   (vendite.fn_porta_reset_lotto_aperta).
                -- =========================================================
                IF vendite.fn_porta_reset_lotto_aperta(TG_RELID) THEN
                  IF TG_OP = 'DELETE' THEN
                    RETURN OLD;
                  END IF;
                  RETURN NEW;
                END IF;

                IF TG_OP = 'UPDATE' THEN
                  IF OLD.fattura_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_RIGA_GIA_FATTURATA',
                      jsonb_build_object('id', OLD.id, 'fattura_riga_id', OLD.fattura_riga_id),
                      NULL::uuid, OLD.id::text
                    );
                  END IF;
                  RETURN NEW;
                ELSIF TG_OP = 'DELETE' THEN
                  IF OLD.fattura_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_RIGA_GIA_FATTURATA',
                      jsonb_build_object('id', OLD.id, 'fattura_riga_id', OLD.fattura_riga_id),
                      NULL::uuid, OLD.id::text
                    );
                  END IF;
                  RETURN OLD;
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_fatturato() IS $c$Blocca update/delete se fattura_riga_id e' valorizzato; la scrittura la lascia passare solo la porta del reset del lotto (vendite.fn_porta_reset_lotto_aperta: GUC zeroerp.maintenance_reset_lotto_draft e proprietario della tabella, dentro la pulizia di vendite.fn_cleanup_fatture_by_ids).$c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION vendite.trgfn_attivita_fatturabili_guard_fatturato()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_bypass text;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Blocca UPDATE/DELETE se la riga e' gia' fatturata
                --   (fattura_riga_id valorizzato).
                --   Bypass controllato via GUC per reset tecnico.
                -- =========================================================
                v_bypass := current_setting('zeroerp.maintenance_reset_lotto_draft', true);
                IF v_bypass IS NOT NULL AND lower(v_bypass) IN ('1','true','on','yes') THEN
                  IF TG_OP = 'DELETE' THEN
                    RETURN OLD;
                  END IF;
                  RETURN NEW;
                END IF;

                IF TG_OP = 'UPDATE' THEN
                  IF OLD.fattura_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_RIGA_GIA_FATTURATA',
                      jsonb_build_object('id', OLD.id, 'fattura_riga_id', OLD.fattura_riga_id),
                      NULL::uuid, OLD.id::text
                    );
                  END IF;
                  RETURN NEW;
                ELSIF TG_OP = 'DELETE' THEN
                  IF OLD.fattura_riga_id IS NOT NULL THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database', TG_NAME, 'E_RIGA_GIA_FATTURATA',
                      jsonb_build_object('id', OLD.id, 'fattura_riga_id', OLD.fattura_riga_id),
                      NULL::uuid, OLD.id::text
                    );
                  END IF;
                  RETURN OLD;
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_attivita_fatturabili_guard_fatturato() IS $c$Blocca update/delete se fattura_riga_id e' valorizzato; bypass via GUC zeroerp.maintenance_reset_lotto_draft.$c$;
