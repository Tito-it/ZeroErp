# LA CHECK IMPARA IL SETTIMO GUARD: `vendite.commesse`
#   script.fn_check_registro_disattivabile  (era 20260831-38)
#
# ── ⭐ L'HA TROVATO UN PRESIDIO, ED E' IL MOTIVO PER CUI ESISTE ───────
#
#   `db/pgtap/script/test-fn-check-registro-disattivabile-v1.sql` §6 confronta
#   i guard MONTATI (letti da `pg_trigger`) con quelli che la check COPRE. Il
#   2026-09-02 e' diventato rosso da solo:
#
#       have: commesse,ddt,fatture,ordini,registri_fatturazione_progressivi,resi,tipi_doc_fiscale_registri
#       want: ddt,fatture,ordini,registri_fatturazione_progressivi,resi,tipi_doc_fiscale_registri
#
#   ⭐ La sua intestazione lo aveva scritto in anticipo: «il giorno che ne
#   compare una quarta, diventa rosso — invece di lasciare la check a spegnere
#   un cestino che il trigger poi rifiuta». E' successo esattamente cosi'.
#
# ── ⛔ PERCHE' NON E' «UN TEST DA AGGIORNARE» ────────────────────────
#
#   Il difetto e' reale e MUTO: senza questo blocco la check risponde `[]` su un
#   registro che ha commesse, quindi la lista accende il cestino, l'operatore
#   preme e il trigger rifiuta con un P0001. Il tooltip e il rifiuto direbbero
#   cose diverse sullo stesso registro — che e' precisamente il difetto che
#   questa funzione esiste per non avere.
#
# ── ⭐ DA DOVE ARRIVA IL SETTIMO GUARD ───────────────────────────────
#
#   `vendite.commesse` ha guadagnato `registro_id` il 2026-09-02 (changeSet
#   `20260902-07`, che chiudeva il debito «la commessa e' l'unica famiglia la
#   cui identita' e' una stringa nuda»). L'automazione ATTIVO monta il guard di
#   disattivazione DA SOLA a partire dalla FK, al migrate: nessuno ha deciso di
#   aggiungerlo, ed e' proprio per questo che serviva qualcuno che se ne
#   accorgesse.
#
# ── ⭐ VA PRIMO, E NON E' UN DETTAGLIO DI STILE ──────────────────────
#
#   L'ordine dei motivi non e' di comodo: i `BEFORE ROW` scattano in ordine
#   ALFABETICO di nome, e i guard si chiamano
#   `trg_registri_fatturazione_a10_<figlia>_…`. `commesse` viene prima di `ddt`,
#   quindi e' il trigger che scatterebbe per PRIMO ed e' la frase che
#   l'operatore vedrebbe davvero. Metterlo in coda farebbe dire al tooltip «ha
#   DDT» e all'errore «ha commesse», sullo stesso registro.
#
# ── ⚠️ RAMO `_EXIST`, VERIFICATO E NON DEDOTTO ──────────────────────
#
#   `vendite.commesse` NON ha la colonna `attivo` (letto da `pg_attribute` il
#   2026-09-02), quindi `dbops.trgfn_prevent_deactivate_if_children` cade nel
#   ramo dell'ESISTENZA e solleva `E_ATTIVO_BLOCK_CHILDREN_EXIST`. Confermato
#   una seconda volta dal messaggio reale del rifiuto, raccolto lo stesso
#   giorno. Una check che chiedesse «attive» direbbe «si puo' disattivare» dove
#   il trigger rifiuta.
#
#   ⛔ CONSEGUENZA DA SAPERE, e non e' un effetto collaterale di questo file:
#   una commessa non si cancella e non ha uno stato «non attiva» a questo fine,
#   quindi un registro che ha numerato anche UNA sola commessa non si spegne
#   piu'. E' la stessa durezza gia' accettata il 2026-08-31 per ddt, ordini e
#   resi — qui si rende soltanto VISIBILE prima del click, invece che dopo.
#
# ── 🔴 DEBITO VERSO IL FRONTEND (§12.3) ──────────────────────────────
#
#   La `reason_key` nuova e'
#   `amministrazione.registri_fatturazione.disattiva_blocco.ha_commesse`, e nei
#   locales NON C'E' (verificato su `frontend/src/locales/it.json`, dove le
#   sorelle `ha_ddt`/`ha_fatture`/`ha_ordini`/`ha_resi`/`ha_progressivi`/
#   `ha_mapping_tipo_doc` ci sono tutte). Va aggiunta lato FE, o il tooltip
#   mostrera' la chiave al posto della frase.
#   ⚠️ `scripts/check_i18n_keys.py` non guarda `20_code`, quindi questo file
#   non lo fa rosso: il debito e' dichiarato qui perche' altrimenti non lo
#   direbbe nessuno finche' non si rigenera la doc `dbzero`.
#
# ⚠️ `CREATE OR REPLACE` e non DROP: la firma e il tipo di ritorno non cambiano
#   (`(bigint) RETURNS jsonb`), quindi non serve — e un DROP porterebbe via i
#   privilegi di esecuzione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260902-12-update-fn-check-registro-disattivabile-commesse-mctit.yaml

  - changeSet:
      id: 20260902-12-update-fn-check-registro-disattivabile-commesse
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        script.fn_check_registro_disattivabile impara il SETTIMO guard, vendite.commesse. ⭐ L''ha
        trovato il pgTAP §6, che confronta i guard montati con quelli coperti ed e'' diventato rosso da
        solo: `commesse` ha guadagnato `registro_id` col changeSet 20260902-07 e l''automazione ATTIVO
        ha montato il guard dalla FK, al migrate, senza annunciarlo. ⛔ Non e'' un test da aggiornare:
        senza il blocco la check risponde [] su un registro che ha commesse, la lista accende il
        cestino e il trigger poi rifiuta — tooltip e rifiuto direbbero cose diverse. ⭐ Va PRIMO
        perche'' i BEFORE ROW scattano in ordine alfabetico e `commesse` precede `ddt`: e'' la frase
        che l''operatore vedrebbe davvero. ⚠️ Ramo _EXIST verificato: vendite.commesse non ha la
        colonna `attivo`. 🔴 reason_key `...ha_commesse` da aggiungere ai locales FE.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: commesse
            - columnExists:
                schemaName: vendite
                tableName: commesse
                columnName: registro_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_registro_disattivabile(p_registro_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_motivi  jsonb := '[]'::jsonb;
                  v_codice  vendite.registri_fatturazione.codice%TYPE;
                  v_n       bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Elencare i motivi che impediscono di DISATTIVARE un
                  --   registro di numerazione. Funzione PURA (fn_check_*):
                  --   nessuna scrittura, e nessun raise di dominio.
                  --   Consumatori: la lista dei registri, che spegne il cestino
                  --   di riga e dice perche' invece di far scoprire il vincolo
                  --   sbagliando.
                  --
                  -- Ritorna: [] se si puo' disattivare; altrimenti array
                  --   ORDINATO di {codice, reason, reason_key, dettaglio, valori}
                  --   (§12.5.1). ⚠️ L'ordine e' il contratto: la superficie
                  --   mostra il primo.
                  --
                  -- ⭐ L'ORDINE E' QUELLO DEI TRIGGER, non uno di comodo. I
                  --   BEFORE ROW scattano in ordine ALFABETICO di nome, e i
                  --   guard si chiamano trg_registri_fatturazione_a10_<figlia>_…
                  --   ⇒ i motivi seguono il NOME DELLA TABELLA FIGLIA, cosi' il
                  --   primo motivo e' quello che il rifiuto nominerebbe davvero.
                  --   Un ordine diverso farebbe dire al tooltip «ha fatture» e
                  --   all'errore «ha DDT», sullo stesso registro.
                  --
                  -- ⛔ SU QUESTA TABELLA I GUARD SONO SETTE, ed erano tre fino al
                  --   2026-08-31 e sei fino al 2026-09-02: ddt, ordini e resi
                  --   hanno guadagnato `registro_id` col trasloco, e `commesse`
                  --   col changeSet 20260902-07. Ogni volta l'automazione ATTIVO
                  --   ha montato il guard DA SOLA a partire dalla FK, al migrate,
                  --   senza annunciarlo — a dirlo e' stato il pgTAP §6, che
                  --   confronta i montati con i coperti.
                  --   ⚠️ Quello che sorprende resta il contatore: un registro
                  --   che ha numerato anche UN SOLO documento ha una riga di
                  --   progressivi viva, quindi non si spegne piu'. Il cestino e'
                  --   percio' quasi sempre indisponibile — e senza un motivo a
                  --   video l'operatore lo scopre premendo.
                  --
                  -- ⚠️ SECURITY DEFINER: si legge vendite.fatture, vendite.ddt,
                  --   vendite.ordini, vendite.resi e vendite.commesse, che hanno
                  --   la RLS. Sotto il perimetro di un operatore i documenti di
                  --   un altro emittente sono invisibili, e la check
                  --   concluderebbe «si puo' disattivare» PROPRIO nel caso da
                  --   bloccare.
                  -- =========================================================

                  -- Guard di parametro: un id assente o non positivo non esce da
                  -- nessuna interfaccia, lo produce un chiamante rotto.
                  IF p_registro_id IS NULL OR p_registro_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_registro_disattivabile',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_registro_id',
                                             'valore', p_registro_id),
                          NULL::uuid,
                          'script.fn_check_registro_disattivabile',
                          'identificativo del registro non valido');
                  END IF;

                  SELECT r.codice INTO v_codice
                    FROM vendite.registri_fatturazione r
                   WHERE r.id = p_registro_id;

                  -- ⚠️ Qui «non esiste» e' davvero «non esiste»: la funzione e'
                  --   DEFINER, quindi non c'e' il caso «non lo vedo».
                  -- ⭐ E non si risponde []: sarebbe «si puo' disattivare», che su
                  --   una riga inesistente e' una frase senza senso. Stesso ramo
                  --   della gemella script.fn_check_annullo_movimento_titolo_iva.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_registro_disattivabile',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('registro_id', p_registro_id),
                          NULL::uuid,
                          'script.fn_check_registro_disattivabile',
                          concat('registro ', p_registro_id, ' inesistente'));
                  END IF;

                  -- ---- MOTIVO 1 — ha commesse ------------------------------
                  -- ⛔ NUOVO dal 2026-09-02, e PRIMO perche' `commesse` precede
                  --   `ddt` in ordine alfabetico: e' il guard che scatta per
                  --   primo, quindi e' la frase che l'operatore vedrebbe.
                  -- ⚠️ «ESISTONO» e non «esistono ATTIVE»: vendite.commesse non
                  --   ha la colonna `attivo`, quindi il trigger cade nel ramo
                  --   dell'ESISTENZA (_EXIST). Verificato su pg_attribute, e
                  --   confermato dal messaggio reale del rifiuto.
                  -- ⭐ Da qui discende una durezza che conviene sapere: una
                  --   commessa non si cancella, quindi un registro che ne ha
                  --   numerata anche una sola non si spegne piu'.
                  SELECT count(*) INTO v_n
                    FROM vendite.commesse cm
                   WHERE cm.registro_id = p_registro_id;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                          'reason',     'HA_COMMESSE',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_commesse',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.commesse'));
                  END IF;

                  -- ---- MOTIVO 2 — ha documenti di trasporto ----------------
                  -- ⛔ NUOVO dal 2026-08-31.
                  -- ⚠️ «ESISTONO» e non «esistono ATTIVI»: vendite.ddt non ha la
                  --   colonna `attivo`, quindi il trigger cade nel ramo
                  --   dell'ESISTENZA (_EXIST). Verificato, non dedotto.
                  SELECT count(*) INTO v_n
                    FROM vendite.ddt d
                   WHERE d.registro_id = p_registro_id;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                          'reason',     'HA_DDT',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_ddt',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.ddt'));
                  END IF;

                  -- ---- MOTIVO 3 — ha fatture -------------------------------
                  -- ⛔ «ESISTONO», non «esistono ATTIVE»: vendite.fatture NON HA
                  --   la colonna `attivo`, quindi dbops.trgfn_prevent_deactivate_if_children
                  --   cade nel ramo dell'ESISTENZA e solleva
                  --   E_ATTIVO_BLOCK_CHILDREN_EXIST. Una check che chiedesse
                  --   «attive» direbbe «si puo' disattivare» dove il trigger
                  --   rifiuta: i due divergerebbero in silenzio, ed e' il difetto
                  --   che questa funzione esiste per non avere.
                  SELECT count(*) INTO v_n
                    FROM vendite.fatture f
                   WHERE f.registro_id = p_registro_id;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                          'reason',     'HA_FATTURE',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_fatture',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          -- ⭐ I quattro valori compongono ESATTAMENTE la frase che il
                          --   trigger produrrebbe: «Non si puo' disattivare %s (%s = %s):
                          --   ci sono ancora righe collegate in %s.»
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.fatture'));
                  END IF;

                  -- ---- MOTIVO 4 — ha ordini --------------------------------
                  -- ⛔ NUOVO dal 2026-08-31. _EXIST: vendite.ordini non ha `attivo`.
                  SELECT count(*) INTO v_n
                    FROM vendite.ordini o
                   WHERE o.registro_id = p_registro_id;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                          'reason',     'HA_ORDINI',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_ordini',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.ordini'));
                  END IF;

                  -- ---- MOTIVO 5 — ha progressivi ---------------------------
                  -- ⭐ E' quello che sorprende: basta UN documento numerato perche'
                  --   esista una riga di contatore, e da li' il registro non si
                  --   spegne piu'.
                  -- ⚠️ Qui «ATTIVE» e' corretto — vendite.registri_fatturazione_progressivi
                  --   la colonna `attivo` ce l'ha — quindi il codice e' _ACTIVE e non
                  --   _EXIST: i progressivi gia' spenti non bloccano, ed e' il pattern
                  --   «figli prima, padre poi».
                  SELECT count(*) INTO v_n
                    FROM vendite.registri_fatturazione_progressivi p
                   WHERE p.registro_id = p_registro_id
                     AND p.attivo IS TRUE;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_ACTIVE',
                          'reason',     'HA_PROGRESSIVI',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_progressivi',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.registri_fatturazione_progressivi'));
                  END IF;

                  -- ---- MOTIVO 6 — ha resi ----------------------------------
                  -- ⛔ NUOVO dal 2026-08-31. _EXIST: vendite.resi non ha `attivo`.
                  SELECT count(*) INTO v_n
                    FROM vendite.resi re
                   WHERE re.registro_id = p_registro_id;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                          'reason',     'HA_RESI',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_resi',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.resi'));
                  END IF;

                  -- ---- MOTIVO 7 — ha mapping tipo documento ----------------
                  -- ⚠️ Anche qui ESISTENZA e non «attive»: vendite.tipi_doc_fiscale_registri
                  --   non ha la colonna `attivo`.
                  SELECT count(*) INTO v_n
                    FROM vendite.tipi_doc_fiscale_registri m
                   WHERE m.registro_id = p_registro_id;

                  IF v_n > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                          'reason',     'HA_MAPPING_TIPO_DOC',
                          'reason_key', 'amministrazione.registri_fatturazione.disattiva_blocco.ha_mapping_tipo_doc',
                          'dettaglio',  jsonb_build_object('registro_id', p_registro_id,
                                                           'codice',      v_codice,
                                                           'quante',      v_n),
                          'valori',     jsonb_build_array('vendite.registri_fatturazione',
                                                          'id',
                                                          p_registro_id::text,
                                                          'vendite.tipi_doc_fiscale_registri'));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Il rollback riporta la check a SEI motivi, cioe' la rimette
              --   INDIETRO rispetto ai guard montati: il pgTAP §6 tornerebbe
              --   rosso, ed e' giusto cosi' — quel rosso e' la segnalazione, non
              --   l'inconveniente.
              SELECT 1;
