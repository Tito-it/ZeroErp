# «PRE-FISCALE» DAL VOCABOLARIO: congela_fiscale, NON DRAFT ED EMESSA
#   Brief: brief-db-stati-documento-dal-vocabolario §4.1 e §4.2, S-2
#   (Tid, 2026-11-08). Giro 1: il vocabolario fiscale.
#
# ── ⭐ PERCHE' ───────────────────────────────────────────────────────
#   La check leggeva gli id di 'DRAFT' ed 'EMESSA' per dire «non ancora
#   congelata». Lo dice config.stati_doc_fiscale.congela_fiscale, sede unica
#   della soglia (il suo COMMENT: chi deve sapere se un documento e' congelato
#   legge questa colonna). La leggono gia' script.fn_check_lotto_riportabile_a_draft,
#   vendite.fn_snapshot_fattura_lotto, vendite.fn_genera_scadenze_fattura e
#   fratelli: questa era una copia.
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   · conta le fatture del lotto il cui stato non e' un non-congelato
#     (NOT EXISTS: fail-closed come prima);
#   · via i due E_CONFIG_MANCANTE di «DRAFT/EMESSA non configurato»: non si
#     cerca piu' nessuno stato per codice;
#   · firma e forma del risultato invariate (p_lotto_id ancorato, risolve a
#     bigint).
#   Fatto datato, 2026-11-12: DRAFT ed EMESSA sono gli unici stati con
#   congela_fiscale false, quindi l'esito non cambia su nessuna fattura.
#
# ── DA DOVE ─────────────────────────────────────────────────────────
#   Corpo da pg_get_functiondef su dbdev (2026-11-12). STABLE, INVOKER: come
#   prima. COMMENT riscritto al presente. Rollback: il corpo e il COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261112-50-update-fn-check-lotto-fatture-pre-fiscali-dal-vocabolario-mctit.yaml

  - changeSet:
      id: 20261112-50-update-fn-check-lotto-fatture-pre-fiscali-dal-vocabolario
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_lotto_fatture_pre_fiscali legge la soglia da congela_fiscale, non da DRAFT ed EMESSA. Brief: brief-db-stati-documento-dal-vocabolario §4.1, S-2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('script.fn_check_lotto_fatture_pre_fiscali(bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_lotto_fatture_pre_fiscali(
                  p_lotto_id vendite.fatturazione_lotti.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: elencare i motivi, sul versante FATTURE, che impediscono
              --   di demolire il contenuto di un lotto. Funzione PURA
              --   (fn_check_*): nessun raise di dominio, nessuna scrittura.
              --   Consumatori: script.fn_check_lotto_annullabile,
              --   script.fn_check_lotto_riportabile_a_draft e — per loro
              --   tramite — script.fn_available_actions_lotto.
              -- Pre-fiscale = in uno stato non ancora congelato
              --   (config.stati_doc_fiscale.congela_fiscale = false): lo
              --   snapshot fiscale non e' preso, la fattura non e' numerata.
              --   La soglia si legge dal vocabolario, non da un elenco di codici.
              -- Ritorna: [] se tutte le fatture del lotto sono pre-fiscali;
              --   altrimenti array di {codice, reason, reason_key, dettaglio}.
              DECLARE
                v_motivi    jsonb := '[]'::jsonb;
                v_bad       integer;  -- un conteggio
              BEGIN
                -- Guard parametro (AGENTS.md): id assente o non valido e' un
                -- errore di programmazione, non una condizione di dominio.
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_lotto_fatture_pre_fiscali','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','lotto_id','valore',p_lotto_id),
                    NULL::uuid, 'lotto_id obbligatorio (>0)');
                END IF;

                -- MOTIVO UNICO — almeno una fattura oltre il pre-fiscale.
                -- NOT EXISTS e non un JOIN: una fattura il cui stato non si
                -- trova conta come NON pre-fiscale (fail-closed).
                SELECT count(*)
                  INTO v_bad
                  FROM vendite.fatture f
                  JOIN vendite.fatturazione_lotti_fatture lf
                    ON lf.fattura_id = f.id
                 WHERE lf.lotto_id = p_lotto_id
                   AND NOT EXISTS (SELECT 1
                                     FROM config.stati_doc_fiscale s
                                    WHERE s.id = f.stato_doc_fiscale_id
                                      AND s.congela_fiscale IS FALSE);

                IF v_bad > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_LOTTO_FATTURE_NON_PRE_FISCALI',
                    'reason',     'FATTURE_NON_PRE_FISCALI',
                    'reason_key', 'vendite.lotti.azione_reason.fatture_non_pre_fiscali',
                    'dettaglio',  v_bad);
                END IF;

                RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_lotto_fatture_pre_fiscali(bigint) IS
                  'Funzione pura (fn_check_*): i motivi, sul versante delle fatture, che impediscono di demolire il contenuto di un lotto. Ritorna [] se tutte le fatture del lotto sono pre-fiscali, cioe'' in uno stato non ancora congelato (config.stati_doc_fiscale.congela_fiscale = false: lo snapshot fiscale non e'' preso, la fattura non e'' numerata); altrimenti un motivo {codice, reason, reason_key, dettaglio} col conteggio (E_LOTTO_FATTURE_NON_PRE_FISCALI). La soglia si legge dal vocabolario, non da un elenco di codici. Una fattura il cui stato non si trova conta come non pre-fiscale (fail-closed). La usano script.fn_check_lotto_annullabile e script.fn_check_lotto_riportabile_a_draft, e per loro tramite i verbi e le capability del lotto. Errore: E_PARAMETRO_INVALIDO su un id assente o non positivo.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_lotto_fatture_pre_fiscali(p_lotto_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: elencare i motivi, sul versante FATTURE, che impediscono
              --   di demolire il contenuto di un lotto. Funzione PURA
              --   (fn_check_*): nessun raise di dominio, nessuna scrittura.
              --   Consumatori: script.fn_check_lotto_annullabile,
              --   script.fn_check_lotto_riportabile_a_draft e — per loro
              --   tramite — script.fn_available_actions_lotto.
              -- Ritorna: [] se tutte le fatture del lotto sono pre-fiscali;
              --   altrimenti array di {codice, reason, reason_key, dettaglio}.
              DECLARE
                v_motivi    jsonb := '[]'::jsonb;
                v_draft_id  config.stati_doc_fiscale.id%TYPE;
                v_emessa_id config.stati_doc_fiscale.id%TYPE;
                v_bad       integer;
              BEGIN
                -- Guard parametro (AGENTS.md): id assente o non valido e' un
                -- errore di programmazione, non una condizione di dominio.
                IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_lotto_fatture_pre_fiscali','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','lotto_id','valore',p_lotto_id),
                    NULL::uuid, 'lotto_id obbligatorio (>0)');
                END IF;

                SELECT s.id INTO v_draft_id
                  FROM config.stati_doc_fiscale s
                 WHERE s.codice_interno = 'DRAFT' AND s.attivo IS TRUE LIMIT 1;
                IF v_draft_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_lotto_fatture_pre_fiscali','E_CONFIG_MANCANTE',
                    jsonb_build_object('codice_interno','DRAFT'),
                    NULL::uuid, 'stato DRAFT non configurato');
                END IF;

                SELECT s.id INTO v_emessa_id
                  FROM config.stati_doc_fiscale s
                 WHERE s.codice_interno = 'EMESSA' AND s.attivo IS TRUE LIMIT 1;
                IF v_emessa_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_lotto_fatture_pre_fiscali','E_CONFIG_MANCANTE',
                    jsonb_build_object('codice_interno','EMESSA'),
                    NULL::uuid, 'stato EMESSA non configurato');
                END IF;

                -- MOTIVO UNICO — almeno una fattura oltre il pre-fiscale.
                -- IS DISTINCT FROM su entrambi gli id: lo stato NULL conta
                -- come NON pre-fiscale (fail-closed), un JOIN lo perderebbe.
                SELECT count(*)
                  INTO v_bad
                  FROM vendite.fatture f
                  JOIN vendite.fatturazione_lotti_fatture lf
                    ON lf.fattura_id = f.id
                 WHERE lf.lotto_id = p_lotto_id
                   AND f.stato_doc_fiscale_id IS DISTINCT FROM v_draft_id
                   AND f.stato_doc_fiscale_id IS DISTINCT FROM v_emessa_id;

                IF v_bad > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_LOTTO_FATTURE_NON_PRE_FISCALI',
                    'reason',     'FATTURE_NON_PRE_FISCALI',
                    'reason_key', 'vendite.lotti.azione_reason.fatture_non_pre_fiscali',
                    'dettaglio',  v_bad);
                END IF;

                RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_lotto_fatture_pre_fiscali(bigint) IS
                  'Funzione PURA (fn_check_*): motivi ostativi, sul versante FATTURE, alla demolizione del contenuto di un lotto. Ritorna [] se tutte le fatture sono pre-fiscali (DRAFT o EMESSA, cioe'' non ancora numerate — C-19), altrimenti {codice, reason, reason_key, dettaglio} con il conteggio (codice 799). Sede UNICA della definizione di «pre-fiscale» per le fatture di un lotto: la usano script.fn_check_lotto_annullabile e script.fn_check_lotto_riportabile_a_draft, e per loro tramite le due fn di mutazione e le capabilities. ⚠️ La condizione e'' IS DISTINCT FROM sui due id e non un NOT IN sui codici: una fattura con stato_doc_fiscale_id NULL deve contare come NON pre-fiscale (fail-closed). rev 2026-08-04.';
