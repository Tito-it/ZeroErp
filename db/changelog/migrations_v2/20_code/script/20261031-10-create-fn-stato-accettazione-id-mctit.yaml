# ------------------------------------------------------------
# BB: LO STATO DI ACCETTAZIONE DI UNA TESTATA
#   Brief: brief-modello-documento-vendita §17 (ok di Tid 2026-10-31).
#   Gemello di script.fn_stato_emissione_id e script.fn_stato_abortito_id:
#   la logica e' del lettore comune script.fn_stato_per_colonna_id
#   (20261031-06), qui la porta con il nome.
#
# ── CHE COSA DICE ───────────────────────────────────────────────────
#   L'id dello stato di accettazione (accettazione = true) nel vocabolario della
#   testata. Oggi e' ACCETTATO del preventivo e ACCETTATA dell'offerta.
#   NULL per gli altri documenti, che il cliente non accetta: il loro vocabolario non ha la colonna.
#   Al massimo uno, ed e' attivo: indice unico parziale e CHECK in
#   20261031-05.
#
# ── LE COPIE CHE SI RITIRANO ────────────────────────────────────────
#   Il letterale 'ACCETTATO' / 'ACCETTATA' per dire «lo stato di accettazione»: i consumatori
#   riscritti nello stesso giro (§17), elencati nel COMMENT.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261031-10-create-fn-stato-accettazione-id-mctit.yaml

  - changeSet:
      id: 20261031-10-create-fn-stato-accettazione-id
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB script.fn_stato_accettazione_id(regclass): l'id dello stato di accettazione
        (accettazione) nel vocabolario di una testata della mappa, NULL se il vocabolario non ha la
        colonna o non ne dichiara. Gemello di script.fn_stato_emissione_id, dal lettore comune
        script.fn_stato_per_colonna_id. Brief: brief-modello-documento-vendita §17.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_stato_per_colonna_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_stato_accettazione_id(p_testata regclass)
               -- bigint: l'id di uno stato di un vocabolario qualunque della
               -- mappa; nessuna colonna comune a cui ancorarlo.
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato di accettazione della testata, dal suo
                  --   vocabolario (colonna accettazione = true). La logica e' del
                  --   lettore comune:
                  --   - testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - vocabolario senza la colonna accettazione: il documento
                  --     non ha quello stato, NULL;
                  --   - nessuno stato dichiarato: NULL.
                  -- =========================================================
                  RETURN script.fn_stato_per_colonna_id(p_testata, 'accettazione', 'script.fn_stato_accettazione_id');
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_stato_accettazione_id(p_testata regclass)
              IS 'BB del modello del documento: l''id dello stato di ACCETTAZIONE di una testata, letto dal suo vocabolario degli stati (colonna accettazione = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''ACCETTATO'' / ''ACCETTATA'' per dire «lo stato di accettazione». Al massimo uno per vocabolario, ed e'' attivo (uq_<vocabolario>_accettazione, chk_<vocabolario>_accettazione_attivo). NULL se il vocabolario non ha la colonna (i documenti che il cliente non accetta: tutti tranne preventivo e offerta) o non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. La logica e'' di script.fn_stato_per_colonna_id, comune ai gemelli script.fn_stato_emissione_id, script.fn_stato_abortito_id, script.fn_stato_cessazione_id; il codice si legge con script.fn_doc_stato_codice. Consumatori: vendite.fn_list_preventivi_da_pushare, vendite.fn_push_preventivo_a_ordine; chi ha gia'' in mano la riga del vocabolario legge la colonna (le capability di preventivo e offerta, vendite.fn_push_offerta_a_contratto, vendite.fn_genera_ordine_da_offerta); il backend al posto dei letterali di preventivi_service e StatoOfferta. Brief: brief-modello-documento-vendita §17 (Tid, 2026-10-31).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_stato_accettazione_id(regclass);
