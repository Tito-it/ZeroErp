# script.fn_veste_utilizzabile(identita_id): UNA VESTE VALE OGGI?
#   Brief: brief-db-veste-utilizzabile (L-6 del piano accessi, A-7)
#
# -- IL DIFETTO ---------------------------------------------------------------------
#   Il modello da' a ogni veste un interruttore (attivo) e una finestra
#   (valido_dal NOT NULL, valido_al nullable): una veste puo' essere ACCESA ma
#   fuori dalle sue date. La domanda «questa veste vale oggi?» era scritta in
#   piu' sedi, e non uguale: chi guardava la finestra e chi no, chi il soggetto
#   e chi no, e per l'operatore una sola sede (fn_get_user_profile) guardava
#   anche il rapporto di lavoro. Il backend non guardava nessuna data.
#
# -- LA REGOLA (decisioni di Tid del 2026-10-07, brief §3-bis) ----------------------
#   Utilizzabile oggi se:
#     * la veste e' accesa e CURRENT_DATE sta nella sua finestra, estremi compresi;
#     * il soggetto della veste e' attivo (D-3: era la condizione in piu' di
#       fn_sync_auth_user_is_active, nessuna sede la perde);
#     * D-2, strada (a): per l'operatore UMANO anche il rapporto (la risorsa umana
#       dello stesso soggetto_ruolo) e' attivo e nella sua finestra. Il drawer
#       operatore scrive la fine del rapporto: cosi' quella data chiude l'accesso.
#       ⭐ Solo umano: l'identita' TECNICA di un processo (tecnica = true) e'
#       OPERATORE per la RLS ma per costruzione non ha una risorsa umana
#       (fn_crea_utente_tecnico non la crea). Pretenderla spegnerebbe i processi.
#       ⭐ Operatore umano SENZA risorsa umana: non utilizzabile (fail-closed). Il
#       modello lo ammette (nessuna FK fra le due), la madre non lo produce.
#   Un id assente o NULL risponde false.
#
# -- FORMA --------------------------------------------------------------------------
#   LANGUAGE sql BEGIN ATOMIC, STABLE, INVOKER: legge solo tabelle senza RLS
#   (identita_digitali, soggetti_ruoli, soggetti, risorse_umane), leggibili
#   dall'app. Il booleano e' la forma decisa con D-4: nessun motivo, un solo esito.
#   RETURNS boolean esplicito: e' una risposta, non il riflesso di una colonna.
#   ⚠️ Non e' inlineabile (un EXISTS e' una sublink): il backend la chiama una
#   volta per richiesta, le funzioni di scope una volta per riga, come gia' oggi.
#   ⛔ BEGIN ATOMIC da solo nel suo `- sql:`, il COMMENT nel secondo: pgjdbc dopo
#   END non riprende a spezzare le istruzioni.
#   L'appartenenza della veste alla credenziale resta al chiamante: il BB
#   risponde sulla veste, non sulla sessione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-01-create-fn-veste-utilizzabile-mctit.yaml

  - changeSet:
      id: 20261007-01-create-fn-veste-utilizzabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_veste_utilizzabile(identita_id): true se la veste vale oggi (accesa, nelle
        sue date, soggetto attivo; per l'operatore umano anche il rapporto attivo e nelle sue
        date). Building block unico della regola, letto dalle sedi che la ricopiavano.
        Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_veste_utilizzabile';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_veste_utilizzabile(
                  p_identita_id anagrafiche.identita_digitali.id%TYPE)
              RETURNS boolean  -- una risposta si/no: nessuna colonna dietro
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              BEGIN ATOMIC
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali idg
                        JOIN anagrafiche.soggetti_ruoli    sr ON sr.id = idg.soggetto_ruolo_id
                        JOIN anagrafiche.soggetti          s  ON s.id  = sr.soggetto_id
                       WHERE idg.id = p_identita_id
                         AND idg.attivo
                         AND idg.valido_dal <= CURRENT_DATE
                         AND (idg.valido_al IS NULL OR idg.valido_al >= CURRENT_DATE)
                         AND s.attivo
                         -- D-2: l'operatore umano vale finche' vale il suo rapporto.
                         AND (   idg.ruolo_applicativo <> 'OPERATORE'::config.ruolo_applicativo
                              OR idg.tecnica
                              OR EXISTS (
                                     SELECT 1
                                       FROM anagrafiche.risorse_umane ru
                                      WHERE ru.soggetto_ruolo_id = idg.soggetto_ruolo_id
                                        AND ru.attivo
                                        AND ru.valido_dal <= CURRENT_DATE
                                        AND (ru.valido_al IS NULL OR ru.valido_al >= CURRENT_DATE)))
                  );
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_veste_utilizzabile(
                  anagrafiche.identita_digitali.id%TYPE) IS
                  'Una veste vale oggi? true se e'' accesa, CURRENT_DATE sta nella sua finestra '
                  '(estremi compresi) e il suo soggetto e'' attivo; per l''operatore UMANO '
                  '(OPERATORE, tecnica = false) anche il rapporto, cioe'' la risorsa umana dello '
                  'stesso soggetto_ruolo, e'' attivo e nella sua finestra (senza risorsa umana: '
                  'false). L''identita'' tecnica di un processo non ha risorsa umana e non la '
                  'pretende. false per un id assente o NULL. Building block unico della regola '
                  '(regola del 2): la leggono fn_has_identita_attiva, fn_is_super_admin_account, '
                  'fn_check_ultimo_super_admin_attivo, fn_check_almeno_un_super_admin_attivo, '
                  'fn_get_profili_accesso_applicabili, fn_get_setup_status, fn_get_user_profile, '
                  'le fn_scope_* sulle vesti, anagrafiche.fn_sync_auth_user_is_active e '
                  'fn_sync_auth_user_expired; il backend al login, a ogni richiesta, al refresh, '
                  'al secondo passo e al cambio password. L''appartenenza della veste alla '
                  'credenziale resta al chiamante. Brief: brief-db-veste-utilizzabile.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_veste_utilizzabile(bigint);
