# L7b pezzo 5 — IL PREVENTIVO RITIRA IL SUO DIVIETO (Q-9)
#   script.fn_check_preventivo_annullabile
#   Piano: brief-db-lavoro-che-non-torna-indietro, L7 / Q-9 (§14.7.1)
#
# ── ⛔ COSA CAMBIA, E PERCHE' ERA GIUSTO CHIEDERLO ─────────────────
#   `E_PREV_GIA_IN_COMMESSA` vietava di annullare un ordine che aveva spinto
#   in commessa. Il motivo del divieto era uno solo: **non c'era modo di
#   disfare il push**. Adesso c'e' — alla chiusura il documento ritira da se'
#   le righe che nessuno ha ancora emesso.
#
#   ⚠️ Il brief (§9.7.1) diceva che sull'ordine «la porta e' aperta e senza
#   rete». Era **falso**: questo codice esisteva ed era chiamato dal guard di
#   transizione, cioe' da un trigger. La Q-9 era stata decisa su una mappa in
#   cui non compariva, e la decisione e' stata riaperta e confermata larga:
#   **si ritirano entrambi**, preventivo e ordine.
#
# ── ⭐ AL SUO POSTO, UNA CONDIZIONE VERA ────────────────────────────
#   Resta un freno solo: **ci sono righe gia' EMESSA**. Quelle sono in volo
#   verso una fattura, e hanno una via d'uscita che il messaggio nomina
#   («Riporta da emettere»). Il conteggio non si riscrive qui: si **delega** a
#   `script.fn_check_sorgente_chiudibile`, la stessa che il guard generico usa.
#   ⭐ Una implementazione, due superfici: questa accende il pulsante
#   (`fn_available_actions_ordine`), quella ferma la scrittura.
#
# ── ⛔ E LA CHIAVE CAMBIA INSIEME AL CRITERIO ───────────────────────
#   Il vecchio conteggio leggeva `vendite.commesse_sorgenti` con `id::text`; la
#   primitiva legge `vendite.commesse_attivita` con `uid::text`. ⚠️ Sono chiavi
#   polimorfe **diverse**, e deliberatamente: passare quella vecchia non
#   darebbe un errore, darebbe **zero motivi**.
#
# ⚠️ Il codice ritirato resta a catalogo con `obsoleto_dal`: non si cancella,
#   smette di essere sollevato.
# ⚠️ Corpo dall'oggetto VIVO; l'unica differenza e' il blocco sostituito.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260826-38-update-fn-check-preventivo-annullabile-ritiro-mctit.yaml

  - changeSet:
      id: 20260826-38-update-fn-check-preventivo-annullabile-ritiro
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        L7b / Q-9: E_PREV_GIA_IN_COMMESSA si ritira. Vietava di annullare un ordine che
        aveva spinto in commessa perche' non c'era modo di disfare il push; adesso c'e', e
        alla chiusura il documento ritira da se' le righe non ancora emesse. ⚠️ Il brief
        diceva che sull'ordine la porta era «aperta e senza rete»: era falso, questo codice
        esisteva ed era chiamato da un trigger — la Q-9 e' stata riaperta e confermata larga.
        ⭐ Al suo posto un freno solo e vero (righe gia' EMESSA), delegato alla primitiva
        condivisa fn_check_sorgente_chiudibile: una implementazione, due superfici. ⛔ E la
        chiave cambia con il criterio (commesse_attivita.uid::text, non
        commesse_sorgenti.id::text): passare quella vecchia darebbe zero motivi, non errore.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_check_sorgente_chiudibile'
                 AND p.pronargs = 2;
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_preventivo_annullabile(p_preventivo_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono l'ANNULLAMENTO di un
              --   preventivo. Funzione PURA (fn_check_*): nessun raise di
              --   dominio, nessuna scrittura. Consumatori: il guard di
              --   transizione, la porta vendite.fn_cambia_stato_preventivo e
              --   script.fn_available_actions_preventivo.
              --   Brief: brief-db-vie-uscita-operatore §3.1 e §7.3.
              -- Ritorna: [] se annullabile; altrimenti array ordinato di
              --   {codice, reason, reason_key, dettaglio}. L'ordine e' quello
              --   di gravita': chi consuma solleva il PRIMO.
              -- rev 2026-08-04 (§7.3): assorbito il criterio che viveva dentro
              --   la porta (righe gia' EMESSA in commessa) -> MOTIVO 2. Da qui
              --   la porta non ha piu' una regola propria: chiama questa.
              -- rev 2026-08-10: il MOTIVO 1 non era mai scattato. Cercava
              --   l'ordine figlio su ordini.sorgente_uid, che e' l'origine
              --   IMPORT (0 righe valorizzate su 90) e non il legame al
              --   documento a monte; quello vive su documento_origine_tipo/id
              --   (66 su 90). Scritto per simmetria col gemello sui DDT, dove
              --   la colonna omonima E' il legame ed E' popolata: la trappola
              --   §4a di docs/it/guide/sorgente-polimorfa.md, colonne che
              --   sembrano polimorfe e non lo sono (vendite.ordini non ha il
              --   guard, quindi non e' consumatrice del meccanismo).
              --   + esclusi gli ordini figli ANNULLATI via is_abortito:
              --   altrimenti un figlio morto bloccherebbe il padre per
              --   sempre. Decisione di Tid 2026-08-10: qualunque altro stato
              --   blocca, bozza compresa (la via d'uscita e' abbandonare
              --   prima la bozza dell'ordine).
              DECLARE
                v_motivi  jsonb := '[]'::jsonb;
                v_uid     vendite.preventivi.uid%TYPE;
                v_ordini  integer := 0;
                v_emesse  integer := 0;
              BEGIN
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_preventivo_annullabile','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','preventivo_id','valore',p_preventivo_id),
                    NULL::uuid, 'preventivo_id obbligatorio (>0)');
                END IF;

                SELECT p.uid INTO v_uid
                  FROM vendite.preventivi p
                 WHERE p.id = p_preventivo_id;

                IF v_uid IS NULL THEN
                  RETURN v_motivi;   -- preventivo inesistente: decide il chiamante
                END IF;

                -- MOTIVO 1 — un ordine e' gia' nato da questo preventivo.
                -- ⚠️ Il legame preventivo -> ordine e' la coppia
                -- (documento_origine_tipo, documento_origine_id), non
                -- ordini.sorgente_uid: quella e' l'ORIGINE IMPORT
                -- (commento della colonna) e nessuno la valorizza per
                -- questa catena. Fonti: guida sorgente-polimorfa §6, che
                -- elenca ordini.documento_origine_id fra le colonne
                -- dirette, e vw_documento_lineage_archi, che lega
                -- preventivo e ordine con lo stesso predicato.
                -- ⚠️ NON copiare qui la forma del gemello sui DDT
                -- (ddt.sorgente_uid): la' la colonna omonima E' il legame
                -- al padre ed E' popolata. E' la stessa parola per due
                -- cose diverse, e la simmetria apparente e' cio' che ha
                -- tenuto questo motivo spento senza che nessuno lo vedesse.
                -- Gli ordini figli ANNULLATI non contano: un documento
                -- morto non deve bloccare il padre per sempre.
                SELECT count(*)
                  INTO v_ordini
                  FROM vendite.ordini o
                  JOIN config.stati_doc_ordini so ON so.id = o.stato_doc_ordine_id
                 WHERE o.documento_origine_tipo = 'PREVENTIVO'
                   AND o.documento_origine_id   = p_preventivo_id
                   AND so.is_abortito IS NOT TRUE;

                IF v_ordini > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_ORDINE_GIA_GENERATO',
                    'reason',     'ORDINE_GIA_GENERATO',
                    'reason_key', 'vendite.preventivi.azione_reason.ordine_gia_generato',
                    'dettaglio',  v_ordini);
                END IF;

                -- MOTIVO 2 — righe gia' EMESSE in commessa: a valle esiste un
                -- documento fiscale. E' il criterio che stava dentro la porta
                -- (§7.3) e legge l'EFFETTO (le attivita' di commessa, scritte
                -- dalle funzioni di dominio), non la registrazione della
                -- sorgente letta dal MOTIVO 3, che la scrive il backend con una
                -- chiamata separata. Sono due fatti diversi: oggi coincidono,
                -- per costruzione non devono.
                -- starts_with() (PG 18, index-friendly) come nella porta.
                -- ⭐ rev 2026-08-26 (L7b) — il CONTEGGIO si delega, il CODICE resta.
                -- La condizione e' la stessa di tutti gli altri documenti («ci sono righe
                -- gia' EMESSA»), quindi si calcola in UN posto solo:
                -- script.fn_check_sorgente_chiudibile. Ma Tid ha deciso (Q-9) che il
                -- preventivo tiene il PROPRIO codice, che il frontend gia' mappa: qui il
                -- motivo si RIETICHETTA, non si ricalcola.
                -- ⭐ Una implementazione, due superfici. E' anche il motivo per cui sui
                -- preventivi NON si monta il guard generico: uscirebbero due codici diversi
                -- per lo stesso rifiuto, a seconda di quale trigger parla per primo.
                -- ⚠️ Cambia anche la CHIAVE, ed e' un guadagno: prima si contava con
                -- starts_with() sul segment_key ('PREV:<uid>:R:'), cioe' su una convenzione
                -- di stringa; adesso sulla coppia (sorgente_tipo_id, sorgente_uid), che e'
                -- il legame dichiarato. Le due oggi coincidono, per costruzione non devono.
                SELECT count(*)
                  INTO v_emesse
                  FROM jsonb_array_elements(
                         script.fn_check_sorgente_chiudibile(
                             (SELECT s.id FROM config.sorgenti s WHERE s.codice_interno = 'PREVENTIVO'),
                             v_uid::text)) AS m
                 WHERE m ->> 'codice' = 'E_SORGENTE_CON_RIGHE_EMESSE';

                IF v_emesse > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_ANNULLA_COMMESSA_EMESSA',
                    'reason',     'COMMESSA_GIA_EMESSA',
                    'reason_key', 'vendite.preventivi.azione_reason.commessa_gia_emessa',
                    'dettaglio',  v_emesse);
                END IF;

                -- MOTIVO 3 — il preventivo e' gia' entrato in una commessa,
                -- anche se nulla e' ancora uscito. Tabella polimorfa: la chiave
                -- e' testo, e per PREVENTIVO config.sorgenti.key_selector dice
                -- 'uid'.
                -- ⛔ rev 2026-08-26 (L7b, Q-9) — E_PREV_GIA_IN_COMMESSA SI RITIRA.
                -- Vietava di annullare un preventivo che aveva gia' spinto in commessa
                -- «anche se nulla e' ancora uscito», e il motivo era che NON C'ERA MODO di
                -- disfare il push. Adesso c'e': alla chiusura il documento RITIRA da se' le
                -- righe che nessuno ha ancora emesso
                -- (trg_preventivi_z90_ritira_commessa_attivita_upd).
                -- ⭐ E il preventivo si allinea agli altri documenti: l'ordine aveva lo
                -- stesso divieto (E_ORD_ANNULLA_IN_COMMESSA) e si ritira insieme a questo.
                -- Resta il solo MOTIVO 2, che e' una condizione vera e ha una via d'uscita.
                -- ⚠️ Il codice resta a catalogo con `obsoleto_dal`: non si cancella, smette
                -- di essere sollevato.

                RETURN v_motivi;
              END;
              $function$
              ;
      rollback:
        - empty: {}
