databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260227-08-migrate-audit-triggers-insert-or-update-mctit.yaml

  - changeSet:
      id: 20260227-08-migrate-audit-triggers-insert-or-update
      author: mctit
      comment: "Migra tutti i trigger audit (trgfn_audit_data_user_generic) da BEFORE UPDATE a BEFORE INSERT OR UPDATE per supportare user_insert con JWT."
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                r record;
                v_count integer := 0;
              BEGIN
                FOR r IN
                  SELECT n.nspname  AS schema_name,
                         c.relname  AS table_name,
                         t.tgname   AS trigger_name
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid = t.tgrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  JOIN pg_proc p ON p.oid = t.tgfoid
                  JOIN pg_namespace pn ON pn.oid = p.pronamespace
                  WHERE pn.nspname = 'script'
                    AND p.proname = 'trgfn_audit_data_user_generic'
                    AND NOT t.tgisinternal
                  ORDER BY n.nspname, c.relname
                LOOP
                  EXECUTE format('DROP TRIGGER IF EXISTS %I ON %I.%I',
                    r.trigger_name, r.schema_name, r.table_name);

                  EXECUTE format($f$
                    CREATE TRIGGER %I
                    BEFORE INSERT OR UPDATE ON %I.%I
                    FOR EACH ROW
                    EXECUTE FUNCTION script.trgfn_audit_data_user_generic()
                  $f$, r.trigger_name, r.schema_name, r.table_name);

                  v_count := v_count + 1;
                END LOOP;

                RAISE NOTICE 'Migrati % trigger audit a BEFORE INSERT OR UPDATE', v_count;
              END
              $$;
