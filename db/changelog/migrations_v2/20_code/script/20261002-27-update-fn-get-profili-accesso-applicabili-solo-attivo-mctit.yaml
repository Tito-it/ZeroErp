# script.fn_get_profili_accesso_applicabili: «SPENTA» SI LEGGE SOLO DA attivo
#   Brief: brief-db-be-fe-area-accessi, R-DB-1 (sezione 7.2)
#
#   Cadono i due `AND id.ruolo_applicativo <> 'DISABILITATO'` dei rami AD_HOC e
#   PORTALE (il REPARTO filtrava gia' su OPERATORE): dal -25 il valore non esiste
#   nella tabella viva. Il risultato non cambia per nessuna riga ammessa.
#
#   ⚠️ LANGUAGE sql a stringa com'era: la forma non si cambia in un giro che
#   tocca due righe. CREATE OR REPLACE con firma e RETURNS TABLE identici, quindi
#   le due BEGIN ATOMIC che la leggono (fn_get_permessi_ereditati_aree / _azioni)
#   restano valide. Corpo vivo = 20260925-80 (uguale alla doc auto-gen il
#   2026-10-02), sostituzioni contate.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261002-27-update-fn-get-profili-accesso-applicabili-solo-attivo-mctit.yaml

  - changeSet:
      id: 20261002-27-update-fn-get-profili-accesso-applicabili-solo-attivo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_get_profili_accesso_applicabili: cadono i due controlli su DISABILITATO (rami AD_HOC
        e PORTALE), la veste spenta si legge solo da attivo. Firma e RETURNS invariati. Brief:
        brief-db-be-fe-area-accessi R-DB-1.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_profili_accesso_applicabili';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_profili_accesso_applicabili(
                  p_auth_user_id       anagrafiche.identita_digitali.auth_user_id%TYPE,
                  p_ruolo_applicativo  anagrafiche.identita_digitali.ruolo_applicativo%TYPE DEFAULT NULL
              )
              RETURNS TABLE(
                  profilo_accesso_id  config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  priorita            smallint   -- calcolata dal tipo di binding: nessuna colonna dietro
              )
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- =========================================================
                  -- Risolve i profili di accesso applicabili a un utente
                  -- via bindings, dal piu' specifico al piu' generale:
                  --   AD_HOC  prio 1 (sull'identita')
                  --   REPARTO prio 2 (sull'unita' organizzativa)
                  --   PORTALE prio 3 (sulla veste, cioe' tutti)
                  -- Rev 20260925-80 (D-3): PORTALE era 2, a pari merito col
                  -- REPARTO; sotto la veste OPERATORE i due coesistono e
                  -- LIMIT 1 sceglieva a caso.
                  --
                  -- p_ruolo_applicativo:
                  --   NULL -> tutti i profili applicabili all'user
                  --           (comportamento legacy, tutte le vesti)
                  --   non NULL -> solo le identita dell'user con quel
                  --               ruolo_applicativo (veste corrente)
                  -- ⚠️ Con una veste sola ogni priorita' ha al massimo UN
                  --   profilo (indici unici dei binding e di risorse_umane):
                  --   chi ordina per priorita' ha uno spareggio determinato.
                  --   Con NULL no: due vesti di portale danno due PORTALE.
                  -- =========================================================

                  -- 1) AD_HOC: binding diretto sull'identita
                  SELECT DISTINCT
                         pab.profilo_accesso_id,
                         1::smallint AS priorita
                    FROM anagrafiche.identita_digitali id
                    JOIN config.profili_accesso_bindings pab
                      ON pab.identita_digitale_id = id.id
                    JOIN config.profili_accesso pa
                      ON pa.id = pab.profilo_accesso_id
                   WHERE id.auth_user_id      = p_auth_user_id
                     AND id.attivo            = true
                     AND (p_ruolo_applicativo IS NULL
                          OR id.ruolo_applicativo = p_ruolo_applicativo)
                     AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                     AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                     AND pab.attivo = true
                     AND pa.attivo  = true
                     AND pa.tipo    = 'AD_HOC'::config.tipo_profilo_accesso

                  UNION ALL

                  -- 2) REPARTO: binding per UO (solo identita OPERATORE)
                  SELECT DISTINCT
                         pab.profilo_accesso_id,
                         2::smallint AS priorita
                    FROM anagrafiche.identita_digitali id
                    JOIN anagrafiche.risorse_umane ru
                      ON ru.soggetto_ruolo_id = id.soggetto_ruolo_id
                    JOIN config.profili_accesso_bindings pab
                      ON pab.unita_organizzativa_id = ru.unita_organizzativa_id
                    JOIN config.profili_accesso pa
                      ON pa.id = pab.profilo_accesso_id
                   WHERE id.auth_user_id      = p_auth_user_id
                     AND id.attivo            = true
                     AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                     AND (p_ruolo_applicativo IS NULL
                          OR p_ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo)
                     AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                     AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                     AND ru.attivo  = true
                     AND pab.attivo = true
                     AND pa.attivo  = true
                     AND pa.tipo    = 'REPARTO'::config.tipo_profilo_accesso

                  UNION ALL

                  -- 3) PORTALE: binding per ruolo_applicativo dell'identita
                  SELECT DISTINCT
                         pab.profilo_accesso_id,
                         3::smallint AS priorita
                    FROM anagrafiche.identita_digitali id
                    JOIN config.profili_accesso_bindings pab
                      ON pab.ruolo_applicativo = id.ruolo_applicativo
                    JOIN config.profili_accesso pa
                      ON pa.id = pab.profilo_accesso_id
                   WHERE id.auth_user_id      = p_auth_user_id
                     AND id.attivo            = true
                     AND (p_ruolo_applicativo IS NULL
                          OR id.ruolo_applicativo = p_ruolo_applicativo)
                     AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                     AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                     AND pab.attivo = true
                     AND pa.attivo  = true
                     AND pa.tipo    = 'PORTALE'::config.tipo_profilo_accesso;
              $function$;

              COMMENT ON FUNCTION script.fn_get_profili_accesso_applicabili(integer, config.ruolo_applicativo) IS
                  'Profili applicabili a un auth_user, dal piu'' specifico al piu'' generale: AD_HOC '
                  'priorita'' 1 (sull''identita''), REPARTO 2 (sull''unita'' organizzativa), PORTALE 3 '
                  '(sulla veste). Rev 20260925-80 (D-3 di brief-db-pgtap-permessi-ereditati): PORTALE '
                  'era 2, a pari merito col REPARTO, e sotto la veste OPERATORE lo spareggio per '
                  'priorita'' sceglieva a caso. p_ruolo_applicativo NULL = tutte le vesti (legacy), '
                  'valorizzato = solo quella veste; con una veste sola ogni priorita'' ha al massimo un '
                  'profilo (indici unici dei binding e di risorse_umane). I resolver dei permessi da '
                  'operatore passano ''OPERATORE'' tramite script.fn_get_permessi_ereditati_aree / '
                  '_azioni (D-1). Rev 2026-10-02 (brief-db-be-fe-area-accessi R-DB-1): una veste '
                  'spenta si riconosce solo da attivo; il controllo su DISABILITATO (rami AD_HOC e '
                  'PORTALE) e'' caduto con il tipo.';
      rollback:
