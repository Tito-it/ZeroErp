# ------------------------------------------------------------
# IL CODICE DEL CLIENTE ENTRA NELLA FRASE SOLO NEL PERIMETRO DI CHI AGISCE
#   script.trgfn_doc_guard_emittente_ba (20261010-17): CREATE OR REPLACE.
#   Brief: brief-db-magazzino-tutte-le-scritture-dal-verbo, §5.3 (il guard
#   montato sul seriale, 20261122-12).
#   Corpo di partenza: pg_get_functiondef su dbdev.
#
# -- PERCHE' --------------------------------------------------------------
#   La frase dell'incoerenza nomina il codice del billing account indicato.
#   Il BB e' INVOKER: dall'app il BA di un'altra azienda e' nascosto dalla
#   sua RLS e la frase porta l'id. Dentro un verbo SECURITY DEFINER (il
#   seriale nasce da magazzino.fn_aggiungi_asset) la RLS non filtra, e la
#   frase dava il codice del cliente altrui: provato da
#   db/pgtap/magazzino/test-assets-guard-emittente-ba-v1 (caso 5).
#   Ora il codice si legge col predicato esplicito della policy,
#   script.fn_scope_ef_whitelist_via_efba: la stessa risposta da ogni
#   scrittore, come il guard del padre dell'ubicazione (20261122-11).
#   ⚠️ I nomi delle aziende restano nella frase: anagrafiche.soggetti non ha
#   RLS, un operatore li legge comunque. Non sono un'informazione protetta.
#
# -- CHI PASSA ANCORA --------------------------------------------------
#   * documenti di vendita scritti dall'app: la stessa frase di prima (la
#     policy e il predicato fanno la stessa domanda);
#   * senza operatore in sessione: decide la RLS di chi scrive, come prima.
#   Il controllo (l'emittente incoerente si rifiuta) non cambia: cambia solo
#   un pezzo della frase.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261122-13-update-trgfn-doc-guard-emittente-ba-codice-ba-nel-perimetro-mctit.yaml

  - changeSet:
      id: 20261122-13-update-trgfn-doc-guard-emittente-ba-codice-ba-nel-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Il guard script.trgfn_doc_guard_emittente_ba mette nella frase il codice del billing account
        solo se il BA e' nel perimetro di chi agisce (script.fn_scope_ef_whitelist_via_efba): dentro un
        verbo SECURITY DEFINER non nomina il cliente di un'altra azienda.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "2"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname IN ('trgfn_doc_guard_emittente_ba', 'fn_scope_ef_whitelist_via_efba');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_doc_guard_emittente_ba()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- TG_ARGV: [0] etichetta del documento, [1] colonna che lo
                -- identifica, [2] colonna dell'emittente, [3] codice d'errore.
                v_tipo        text;
                v_col_ident   text;
                v_col_emit    text;
                v_codice      config.codici_errore.codice%TYPE;
                v_new         jsonb;
                v_ba          anagrafiche.billing_account.id%TYPE;
                v_emittente   bigint;  -- id della colonna [2]: emittente_fiscale_id o emittente_soggetto_ruolo_id
                v_atteso      bigint;  -- lo stesso, risolto dal BA
                v_documento   text;  -- etichetta + identificativo, composti per la frase
                v_nome        text;  -- ragione sociale o '#id': un pezzo di frase, non una colonna
                v_nome_atteso text;  -- idem
                v_ba_codice   anagrafiche.billing_account.codice%TYPE;
                v_contesto    jsonb;
                v_utente      config.user_override_aree.auth_user_id%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Un documento di vendita e' emesso dall'azienda del suo
                --   cliente: l'emittente e' quello che il billing account
                --   risolve. Building block, montato BEFORE INSERT OR UPDATE OF
                --   (billing_account_id, <colonna dell'emittente>).
                -- ⚠️ BA NULL: esce, su ogni tabella. Dove il BA e' NOT NULL
                --   parla il vincolo, che si controlla dopo i BEFORE ROW; dove e'
                --   NULL ammesso (DDT, reso) non c'e' niente da confrontare.
                -- ⚠️ I risolutori possono propagare E_EMITTENTE_DEFAULT_MISSING:
                --   e' un difetto di configurazione, non si maschera.
                -- ⛔ No-leak: il codice del BA entra nella frase solo se il BA e' nel
                --   perimetro di chi agisce (fn_scope_ef_whitelist_via_efba, la domanda
                --   della policy). Dentro un verbo SECURITY DEFINER la RLS non filtra,
                --   e la frase direbbe il codice di un cliente di un'altra azienda.
                --   Senza operatore in sessione decide la RLS di chi scrive.
                -- =========================================================
                v_new := to_jsonb(NEW);

                -- ── Argomenti: errore di MONTAGGIO, non di dato ───────────
                IF COALESCE(array_length(TG_ARGV, 1), 0) <> 4
                   OR TG_OP NOT IN ('INSERT', 'UPDATE')
                   OR TG_ARGV[2] NOT IN ('emittente_fiscale_id', 'emittente_soggetto_ruolo_id')
                   OR NOT (v_new ? TG_ARGV[1])
                   OR NOT (v_new ? TG_ARGV[2])
                   OR NOT (v_new ? 'billing_account_id') THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', TG_NAME::text, 'E_DOC_RIGHE_LOCK_MONTAGGIO',
                    jsonb_build_object('trigger', TG_NAME,
                                       'table',   TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                       'evento',  TG_OP,
                                       'tg_argv', TG_ARGV),
                    NULL::uuid,
                    TG_NAME::text,
                    TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                    'attesi: etichetta del documento, colonna che lo identifica, colonna dell''emittente (emittente_fiscale_id | emittente_soggetto_ruolo_id) e codice d''errore, su una tabella con billing_account_id');
                END IF;

                v_tipo      := TG_ARGV[0];
                v_col_ident := TG_ARGV[1];
                v_col_emit  := TG_ARGV[2];
                v_codice    := TG_ARGV[3];

                v_ba := (v_new ->> 'billing_account_id')::bigint;
                IF v_ba IS NULL THEN
                  RETURN NEW;
                END IF;

                v_emittente := (v_new ->> v_col_emit)::bigint;
                IF v_col_emit = 'emittente_fiscale_id' THEN
                  v_atteso := anagrafiche.fn_get_emittente_fiscale_pk(v_ba);
                ELSE
                  v_atteso := anagrafiche.fn_get_emittente_fiscale_id(v_ba);
                END IF;

                IF v_emittente IS NOT DISTINCT FROM v_atteso THEN
                  RETURN NEW;
                END IF;

                -- ── La frase: nomi, non id (D-2) ─────────────────────────
                v_documento := v_tipo || ' '
                               || COALESCE(v_new ->> v_col_ident, '#' || (v_new ->> 'id'));

                -- Il nome dell'azienda: dal ruolo dell'emittente al soggetto.
                -- Con la PK dell'emittente si passa da emittenti_fiscali.
                SELECT s.ragione_sociale_completa INTO v_nome
                  FROM anagrafiche.soggetti_ruoli sr
                  JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                 WHERE sr.id = CASE WHEN v_col_emit = 'emittente_fiscale_id'
                                    THEN (SELECT ef.soggetto_ruolo_id FROM anagrafiche.emittenti_fiscali ef
                                           WHERE ef.id = v_emittente)
                                    ELSE v_emittente END;
                SELECT s.ragione_sociale_completa INTO v_nome_atteso
                  FROM anagrafiche.soggetti_ruoli sr
                  JOIN anagrafiche.soggetti s ON s.id = sr.soggetto_id
                 WHERE sr.id = CASE WHEN v_col_emit = 'emittente_fiscale_id'
                                    THEN (SELECT ef.soggetto_ruolo_id FROM anagrafiche.emittenti_fiscali ef
                                           WHERE ef.id = v_atteso)
                                    ELSE v_atteso END;
                v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                SELECT ba.codice INTO v_ba_codice
                  FROM anagrafiche.billing_account ba
                 WHERE ba.id = v_ba
                   AND (v_utente IS NULL OR script.fn_scope_ef_whitelist_via_efba(v_utente, ba.id));

                v_contesto := jsonb_build_object(
                    'tabella',             TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                    'id',                  v_new -> 'id',
                    'billing_account_id',  v_ba,
                    'colonna',             v_col_emit,
                    'emittente',           v_emittente,
                    'emittente_atteso',    v_atteso);
                -- `campo` solo se l'errore e' di una persona: su un TECNICO
                -- (la commessa) non c'e' un campo da accendere.
                IF EXISTS (SELECT 1 FROM config.codici_errore ce
                            WHERE ce.codice = v_codice AND ce.classe <> 'TECNICO') THEN
                  v_contesto := v_contesto || jsonb_build_object('campo', v_col_emit);
                END IF;

                PERFORM script.fn_log_and_raise_error(
                  'database', TG_NAME::text, v_codice,
                  v_contesto,
                  (v_new ->> 'tx_id')::uuid,
                  v_documento,
                  COALESCE(v_nome,        '#' || COALESCE(v_emittente::text, '?')),
                  COALESCE(v_nome_atteso, '#' || COALESCE(v_atteso::text, '?')),
                  COALESCE(v_ba_codice,   '#' || v_ba::text));
                -- fn_log_and_raise_error solleva: non si arriva qui.
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_doc_guard_emittente_ba() IS
                  'Building block: l''emittente di un documento (di vendita, o di un seriale di magazzino) e'' quello che il suo billing account risolve. BEFORE INSERT OR UPDATE OF (billing_account_id, <colonna dell''emittente>) FOR EACH ROW; TG_ARGV = [0] etichetta del documento, [1] colonna che lo identifica, [2] colonna dell''emittente (emittente_fiscale_id -> anagrafiche.fn_get_emittente_fiscale_pk; emittente_soggetto_ruolo_id -> anagrafiche.fn_get_emittente_fiscale_id), [3] codice d''errore (E_DOC_EMITTENTE_BA_INCOERENTE per preventivo, offerta, contratto, ordine, DDT, reso, seriale; E_COMMESSA_EMITTENTE_BA_INCOERENTE, TECNICO, per la commessa). BA NULL: esce. VARIADIC: documento, nome dell''azienda indicata, nome di quella del cliente (soggetti.ragione_sociale_completa, o l''id), codice del BA (solo se il BA e'' nel perimetro di chi agisce, script.fn_scope_ef_whitelist_via_efba; altrimenti l''id); nel contesto gli id, e `campo` solo se il codice non e'' TECNICO; tx_id della riga. Montaggio errato: E_DOC_RIGHE_LOCK_MONTAGGIO. I risolutori possono propagare E_EMITTENTE_DEFAULT_MISSING.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >
              SELECT 'ripristino a mano: il corpo di 20261010-17 dalla doc auto-generata';
