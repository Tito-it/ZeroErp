# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2e (G-8, L2e-2 = (a)): script.fn_segment_key_sorgente, chi legge il documento della chiave.
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-8, §13.3 (L2e-2 decisa da Tid il 2026-10-20).
#
#   La chiave d'idempotenza del push verso la commessa (vendite.commesse_attivita.segment_key) ha la
#   forma <SORGENTE>:<uid>[:R:<riga>][:M:<AAAA-MM>][#CMP:<componente>|#RET:<...>]. G-8: il prefisso
#   e' il codice della sorgente (ORDINE_VENDITA, non ORD), la costruisce un solo BB, e chi la legge
#   non ricopia split_part a mano. L2e-2 = (a): le rettifiche da reso non hanno sorgente
#   (chk_commesse_attivita_senza_sorgente_onere_rettifica), quindi «di che documento e'?» si legge
#   dalla chiave, con questi BB.
#   ⭐ LANGUAGE sql, senza SET: il planner li espande in linea (le funzioni veloci della merce
#   li usano dentro join e intervalli d'indice). I suffissi #CMP:/#RET: restano a chi li scrive.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261020-66-create-fn-segment-key-sorgente-mctit.yaml

  - changeSet:
      id: 20261020-66-create-fn-segment-key-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_segment_key_sorgente: il codice della sorgente letto dalla chiave del push. Grammatica unica, 2e (G-8, L2e-2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_segment_key_sorgente(
                  p_segment_key vendite.commesse_attivita.segment_key%TYPE)
              RETURNS config.sorgenti.codice_interno%TYPE
              LANGUAGE sql
              IMMUTABLE
              SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: il documento da cui viene una riga di commessa, letto
              --   dalla sua chiave: il codice della sorgente (DDT_VENDITA,
              --   ORDINE_VENDITA, ...), oppure MAN per le righe a mano.
              -- ⭐ Perche' dalla chiave e non da sorgente_tipo_id (L2e-2 =
              --   (a)): le rettifiche da reso e gli oneri non hanno sorgente
              --   per progetto (chk_commesse_attivita_senza_sorgente_onere_
              --   rettifica), e la rettifica conta nella merce della bolla.
              --   Il documento sta solo nella chiave.
              -- ⚠️ Il prefisso finisce al primo ':': un codice di sorgente
              --   non contiene ':'. Nessun SET: si espande in linea.
              -- Brief: brief-db-grammatica-unica-documenti §13.3 (2e).
              -- =========================================================
              SELECT split_part(p_segment_key, ':', 1);
              $function$;

              COMMENT ON FUNCTION script.fn_segment_key_sorgente(vendite.commesse_attivita.segment_key%TYPE) IS
                'Il documento da cui viene una riga di commessa, letto dalla chiave: il codice della sorgente (o MAN). Dalla chiave e non da sorgente_tipo_id perche'' rettifiche e oneri non hanno sorgente per progetto (L2e-2 = (a)). LANGUAGE sql IMMUTABLE senza SET: si espande in linea. Brief: brief-db-grammatica-unica-documenti §13.3.';

              GRANT EXECUTE ON FUNCTION script.fn_segment_key_sorgente(vendite.commesse_attivita.segment_key%TYPE) TO zeroerp_app;

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION script.fn_segment_key_sorgente(vendite.commesse_attivita.segment_key%TYPE);
