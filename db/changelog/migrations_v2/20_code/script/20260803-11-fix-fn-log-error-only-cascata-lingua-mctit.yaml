# Fix — cascata lingua in script.fn_log_error_only
#   (brief-db-seed-messaggi-errore-mancanti.md §9.4, 2026-08-03).
#
# COS'E' SUCCESSO. Tre funzioni leggono config.messaggi_errore e due su tre
#   ripiegano su 'it' quando la lingua di sessione non ha riga per quel codice:
#     - fn_get_messaggio        -> WHERE lingua IN (lingua_eff, 'it')  ✔
#     - fn_log_and_raise_error  -> WHERE lingua IN (v_lang, 'it')      ✔
#     - fn_log_error_only       -> WHERE lingua = v_lang               ✘ questa
#
# ⚠️ PERCHE' NON E' UN DETTAGLIO DI TRADUZIONE. `v_lang` viene da
#   `myapp.user_language`, che UserLanguageMiddleware valorizza dall'header
#   Accept-Language su OGNI richiesta /api/. Il catalogo e' di fatto monolingua
#   (373 righe 'it', una sola 'en'). Quindi per un client inglese, oggi:
#     1. il codice non si risolve                    -> si va al ripiego;
#     2. nemmeno MESSAGGIO_NON_DEFINITO si risolve, perche' esiste solo in 'it';
#     3. v_id resta NULL -> RAISE WARNING «log non persistito» -> RETURN.
#   Il risultato non e' un log degradato: e' NESSUN log. L'errore accade,
#   l'utente lo vede, e il registro non ne conserva traccia — un modo di
#   perdere l'informazione peggiore del MESSAGGIO_NON_DEFINITO che il seed
#   dei 221 codici va a ridurre.
#
# COSA CAMBIA. Le due SELECT della funzione (lookup del codice e ripiego su
#   MESSAGGIO_NON_DEFINITO) adottano la stessa forma gia' usata dalle altre due
#   funzioni: `lingua IN (v_lang, 'it')` con `ORDER BY (lingua = v_lang) DESC`.
#   La riga nella lingua richiesta vince quando c'e'; altrimenti si usa quella
#   italiana invece di non loggare. Con v_lang = 'it' la IN degenera e il
#   comportamento e' identico a prima: nessuna regressione sul percorso caldo.
#
# SECONDA MODIFICA — il ripiego smette di essere distruttivo (brief §9.9,
#   decisione di Tid 2026-08-03). Nel ramo NOT FOUND il codice originale finiva
#   in v_msg e li' moriva, perche' error_log conserva solo la FK
#   messaggio_errore_id: la riga restava, il nome dell'errore no. Ora il codice
#   viene scritto nel `context` sotto la chiave `codice_errore_originale`.
#   Non e' una toppa al seed: e' la garanzia che il PROSSIMO codice mancante —
#   e ce ne sara' uno — resti attribuibile invece di sparire. Il BE aveva
#   proposto una colonna dedicata (brief §5): la chiave jsonb ottiene lo stesso
#   risultato senza toccare il modello di error_log.
#
# ℹ️ NON tocca il resto della funzione: canale dblink, gestione DSN/logconn,
#   assenza di RAISE verso il chiamante, SECURITY DEFINER e search_path restano
#   quelli del corpo vivo (doc auto-gen script/funzioni/fn_log_error_only.md).
#
# ⚠️ PERCHE' IL changeSet FA IL GIRO DELL'OWNER. `script.fn_log_error_only` e'
#   una delle quattro funzioni sensibili registrate in
#   `dbops.sec_functions_owner`: e' SECURITY DEFINER e deve essere posseduta da
#   `postgres` per poter scrivere via dblink. Il migratore (`titodb`) non e'
#   proprietario, e in PostgreSQL CREATE OR REPLACE su funzione altrui e'
#   negato — il primo tentativo di questo changeSet e' morto proprio cosi'.
#
#   Il progetto ha gia' il meccanismo per questo: `dbops.fn_sync_functions_owner()`
#   e' SECURITY DEFINER posseduta da postgres, quindi puo' riassegnare owner.
#   Il changeSet la usa in tre tempi:
#     1. chiede in prestito la proprieta' (required_owner -> utente corrente,
#        poi sync) e verifica FAIL-LOUD di averla ottenuta;
#     2. sostituisce la funzione;
#     3. restituisce la proprieta' a postgres (required_owner -> postgres, sync).
#   Due reti di sicurezza sotto: il seed 80_data riscrive comunque
#   `required_owner = postgres`, e 90_end/20251123-04 rilancia la sync a ogni
#   update con runAlways. Se il changeSet fallisce a meta', il rollback della
#   transazione Liquibase annulla anche l'ALTER OWNER (in PostgreSQL il DDL e'
#   transazionale).
#
# ℹ️ Su database appena creato (CI) il giro e' inerte e innocuo: la tabella
#   sec_functions_owner e' ancora vuota (si popola in 80_data, che gira dopo
#   20_code) e la funzione e' ancora di titodb, che l'ha appena creata.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/script/20260803-11-fix-fn-log-error-only-cascata-lingua-mctit.yaml

    - changeSet:
          id: 20260803-11-fix-fn-log-error-only-cascata-lingua
          author: mctit

          runOnChange: false
          validCheckSums:
              - ANY
          failOnError: true
          comment: >
              fn_log_error_only ripiega su lingua 'it' quando la lingua di
              sessione non ha riga per il codice, come gia' fanno
              fn_get_messaggio e fn_log_and_raise_error (senza, una richiesta
              con Accept-Language non italiano non produce alcuna riga in
              dbops.error_log), e conserva il codice originale nel context
              quando ripiega su MESSAGGIO_NON_DEFINITO. La sostituzione passa
              da dbops.fn_sync_functions_owner perche' la funzione e' posseduta
              da postgres.
          preConditions:
              - onFail: HALT
              - sqlCheck:
                    expectedResult: 1
                    sql: >
                        SELECT count(*) FROM pg_proc p
                        JOIN pg_namespace n ON n.oid = p.pronamespace
                        WHERE n.nspname = 'script'
                          AND p.proname = 'fn_log_error_only'
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    sql: |
                        -- ==========================================================
                        -- 1) Presa in prestito della proprieta'.
                        --    La funzione e' posseduta da postgres (voce in
                        --    dbops.sec_functions_owner): senza questo passaggio il
                        --    CREATE OR REPLACE qui sotto viene rifiutato.
                        --    fn_sync_functions_owner e' SECURITY DEFINER/postgres,
                        --    quindi puo' eseguire l'ALTER FUNCTION ... OWNER TO.
                        -- ==========================================================
                        UPDATE dbops.sec_functions_owner
                           SET required_owner = current_user
                         WHERE schema_name   = 'script'
                           AND function_name = 'fn_log_error_only';

                        SELECT dbops.fn_sync_functions_owner();

                        DO $guard$
                        DECLARE
                          v_owner text;
                        BEGIN
                          -- fn_sync_functions_owner non solleva mai: degrada a WARNING.
                          -- Qui si verifica l'esito, perche' un prestito fallito deve
                          -- fermare il changeSet con un messaggio comprensibile e non
                          -- con un generico "bisogna essere proprietari".
                          SELECT pg_get_userbyid(p.proowner)
                            INTO v_owner
                            FROM pg_proc p
                            JOIN pg_namespace n ON n.oid = p.pronamespace
                           WHERE n.nspname = 'script'
                             AND p.proname = 'fn_log_error_only';

                          IF v_owner IS DISTINCT FROM current_user THEN
                            RAISE EXCEPTION
                              'fn_log_error_only e'' di %, non di % : il prestito della proprieta'' via dbops.fn_sync_functions_owner() non e'' riuscito. Verificare che dbops.fn_sync_functions_owner sia SECURITY DEFINER e posseduta da postgres, e che esista la voce in dbops.sec_functions_owner.',
                              coalesce(v_owner, '(funzione assente)'), current_user;
                          END IF;
                        END
                        $guard$;

                        -- ==========================================================
                        -- 2) Sostituzione della funzione.
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION script.fn_log_error_only(
                            p_area          text,
                            p_function_name text,
                            p_error_code    text,
                            p_context       jsonb,
                            p_tx_id         uuid,
                            VARIADIC p_valori text[]
                        )
                        RETURNS void
                        LANGUAGE plpgsql
                        SECURITY DEFINER
                        SET search_path TO 'public', 'pg_temp'
                        AS $function$
                        DECLARE
                          v_id bigint;
                          v_msg text;
                          v_detail text;
                          v_hint text;
                          v_lang text := coalesce(current_setting('myapp.user_language', true), 'it');
                          v_ctx jsonb := coalesce(p_context, '{}'::jsonb);
                          v_sql text;
                          v_dsn text;
                          v_has_dblink boolean := false;
                          v_has_logconn boolean := false;
                          v_vals text[] := coalesce(p_valori, ARRAY[]::text[]);
                        BEGIN
                          -- =========================================================
                          -- Scopo:
                          --   Registrare errori in modo persistente anche quando la
                          --   transazione chiamante viene rollbackata.
                          --
                          -- Regole:
                          --   - usa solo connessione separata via dblink (out-of-tx)
                          --   - non solleva eccezioni verso il chiamante
                          --   - in caso di failure del canale di log emette WARNING
                          --   - cascata lingua: preferisce v_lang, ripiega su 'it'
                          --     (2026-08-03: prima era un lookup secco su v_lang e
                          --     una sessione non italiana non loggava affatto)
                          --   - se il codice non e' a catalogo, il codice originale
                          --     viene conservato in context->>'codice_errore_originale'
                          -- =========================================================

                          IF p_tx_id IS NULL THEN
                            p_tx_id := dbops.fn_get_or_create_session_tx_id();
                          END IF;

                          -- Riga nella lingua di sessione se esiste, altrimenti la
                          -- riga italiana: ORDER BY booleano, TRUE prima in DESC.
                          SELECT id, messaggio, causa, soluzione
                            INTO v_id, v_msg, v_detail, v_hint
                          FROM config.messaggi_errore
                          WHERE codice = p_error_code
                            AND lingua IN (v_lang, 'it')
                          ORDER BY (lingua = v_lang) DESC
                          LIMIT 1;

                          IF NOT FOUND THEN
                            -- Il codice originale sopravvive al ripiego: error_log
                            -- conserva solo la FK messaggio_errore_id, quindi senza
                            -- questa riga la registrazione resta ma il nome
                            -- dell'errore si perde per sempre (brief §9.9).
                            v_ctx := v_ctx || jsonb_build_object(
                                       'codice_errore_originale', p_error_code);

                            -- Fallback: recupera ANCHE id da MESSAGGIO_NON_DEFINITO
                            -- (stessa cascata: la riga esiste solo in 'it').
                            SELECT id, messaggio || ' ' || p_error_code, causa, soluzione
                              INTO v_id, v_msg, v_detail, v_hint
                            FROM config.messaggi_errore
                            WHERE codice = 'MESSAGGIO_NON_DEFINITO'
                              AND lingua IN (v_lang, 'it')
                            ORDER BY (lingua = v_lang) DESC
                            LIMIT 1;

                            IF v_msg IS NULL THEN
                              v_msg := '[MESSAGGIO NON DEFINITO: ' || p_error_code || ']';
                              v_detail := 'Catalogo mancante=' || quote_literal(p_error_code);
                              v_hint := 'Aggiungere record in config.messaggi_errore';
                              v_id := NULL;
                            END IF;
                          END IF;

                          BEGIN
                            IF cardinality(v_vals) > 0 THEN
                              v_msg := format(v_msg, VARIADIC v_vals);
                            END IF;
                          EXCEPTION WHEN OTHERS THEN
                            NULL;
                          END;

                          -- Se non abbiamo un messaggio_errore_id valido, non possiamo
                          -- inserire in error_log (colonna NOT NULL). Warn e return.
                          IF v_id IS NULL THEN
                            RAISE WARNING 'script.fn_log_error_only: messaggio_errore_id non trovato per code=%, log non persistito.',
                              p_error_code;
                            RETURN;
                          END IF;

                          v_sql := format(
                            'INSERT INTO dbops.error_log(occurred_at, area, function_name, messaggio_errore_id, context, tx_id)
                             VALUES (now(), %L, %L, %s, %L::jsonb, %L::uuid)',
                            p_area,
                            p_function_name,
                            v_id::text,
                            v_ctx::text,
                            p_tx_id::text
                          );

                          SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'dblink')
                            INTO v_has_dblink;

                          IF NOT v_has_dblink THEN
                            RAISE WARNING 'script.fn_log_error_only: estensione dblink non disponibile, log non persistito (code=%).',
                              p_error_code;
                            RETURN;
                          END IF;

                          v_dsn := coalesce(
                            nullif(coalesce(current_setting('myapp.logconn', true), ''), ''),
                            nullif(coalesce(current_setting('myapp.dblink_log_connection', true), ''), '')
                          );

                          IF v_dsn IS NOT NULL AND v_dsn <> '' THEN
                            BEGIN
                              PERFORM dblink_exec(v_dsn, v_sql, true);
                              RETURN;
                            EXCEPTION WHEN OTHERS THEN
                              RAISE WARNING 'script.fn_log_error_only: dblink_exec DSN fallita (code=%): %',
                                p_error_code, SQLERRM;
                            END;
                          END IF;

                          BEGIN
                            PERFORM script.fn_ensure_logconn();
                          EXCEPTION WHEN OTHERS THEN
                            NULL;
                          END;

                          BEGIN
                            WITH conns AS (
                              SELECT unnest(dblink_get_connections()) AS name
                            )
                            SELECT EXISTS (SELECT 1 FROM conns WHERE name = 'logconn')
                              INTO v_has_logconn;
                          EXCEPTION WHEN OTHERS THEN
                            v_has_logconn := false;
                          END;

                          IF v_has_logconn THEN
                            BEGIN
                              PERFORM dblink_exec('logconn', v_sql, true);
                              RETURN;
                            EXCEPTION WHEN OTHERS THEN
                              RAISE WARNING 'script.fn_log_error_only: dblink_exec logconn fallita (code=%): %',
                                p_error_code, SQLERRM;
                            END;
                          END IF;

                          RAISE WARNING 'script.fn_log_error_only: nessuna connessione dblink valida, log non persistito (code=%).',
                            p_error_code;
                        END;
                        $function$;

                        COMMENT ON FUNCTION script.fn_log_error_only(p_area text, p_function_name text, p_error_code text, p_context jsonb, p_tx_id uuid, VARIADIC p_valori text[])
                        IS 'Logga su dbops.error_log via connessione dblink separata (out-of-transaction), senza sollevare eccezioni. Post 2026-08-03: cascata lingua con ripiego su ''it'' (come fn_get_messaggio e fn_log_and_raise_error) e, se il codice non e'' a catalogo, conservazione del codice originale in context->>''codice_errore_originale''.';

                        -- ==========================================================
                        -- 3) Restituzione della proprieta' a postgres.
                        --    Ridondante ma esplicito: il seed 80_data riscrive
                        --    comunque required_owner='postgres' e 90_end/20251123-04
                        --    rilancia la sync a ogni update (runAlways). Farlo qui
                        --    evita che il database resti anche solo per il tempo di
                        --    una migration con una SECURITY DEFINER di proprieta'
                        --    del migratore.
                        -- ==========================================================
                        UPDATE dbops.sec_functions_owner
                           SET required_owner = 'postgres'
                         WHERE schema_name   = 'script'
                           AND function_name = 'fn_log_error_only';

                        SELECT dbops.fn_sync_functions_owner();
