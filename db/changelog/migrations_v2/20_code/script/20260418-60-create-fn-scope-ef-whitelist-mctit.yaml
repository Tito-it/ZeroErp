databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260418-60-create-fn-scope-ef-whitelist-mctit.yaml

  - changeSet:
      id: 20260418-60-create-fn-scope-ef-whitelist
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Scope policy EF_WHITELIST: implementa la logica legacy di whitelist
        emittenti fiscali (config.user_emittenti_fiscali) nel nuovo framework
        multi-face auth (§4.4 WIP). L'identita accede al target emittente
        (soggetto_ruolo_id) se e solo se:
          - non ha righe in user_emittenti_fiscali (accesso globale a tutti
            gli emittenti, comportamento attuale per operatori senza restrizioni)
          OPPURE
          - esiste una riga in user_emittenti_fiscali che, via
            emittenti_fiscali.id -> emittenti_fiscali.soggetto_ruolo_id, punta
            al target passato.
        LANGUAGE sql STABLE per favorire l'inlining nelle RLS future.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: config,      tableName: user_emittenti_fiscali }
          - tableExists: { schemaName: anagrafiche, tableName: emittenti_fiscali }
          - tableExists: { schemaName: anagrafiche, tableName: identita_digitali }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Firma con %TYPE sui parametri (policy ZeroErp):
              --   p_identita_id          = anagrafiche.identita_digitali.id
              --   p_emittente_sr_id      = anagrafiche.emittenti_fiscali.soggetto_ruolo_id
              -- STABLE: non modifica DB; legge solo tabelle (eligible per inlining).
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist(
                  p_identita_id     anagrafiche.identita_digitali.id%TYPE,
                  p_emittente_sr_id anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  -- Logica legacy riprodotta + defense-in-depth:
                  --   - identita inesistente / non attiva -> false (fail-closed)
                  --   - whitelist vuota (nessuna riga)    -> true (accesso globale)
                  --   - whitelist valorizzata             -> true solo se il
                  --                                          soggetto_ruolo
                  --                                          emittente target e' in lista
                  WITH ctx AS (
                      SELECT id.auth_user_id
                        FROM anagrafiche.identita_digitali id
                       WHERE id.id     = p_identita_id
                         AND id.attivo = true
                  )
                  SELECT
                      -- Gate: l'identita deve esistere ed essere attiva. Senza
                      -- questo, una CTE vuota farebbe passare il NOT EXISTS
                      -- sottostante in modo vacuously true (leak).
                      EXISTS (SELECT 1 FROM ctx)
                      AND (
                          NOT EXISTS (
                              -- caso 1: nessuna riga in whitelist -> accesso a tutti
                              SELECT 1
                                FROM config.user_emittenti_fiscali uef
                                JOIN ctx ON ctx.auth_user_id = uef.auth_user_id
                          )
                          OR EXISTS (
                              -- caso 2: whitelist valorizzata -> target deve essere in lista
                              SELECT 1
                                FROM config.user_emittenti_fiscali uef
                                JOIN ctx ON ctx.auth_user_id = uef.auth_user_id
                                JOIN anagrafiche.emittenti_fiscali ef
                                  ON ef.id = uef.emittente_fiscale_id
                               WHERE ef.soggetto_ruolo_id = p_emittente_sr_id
                          )
                      );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist(
                  anagrafiche.identita_digitali.id%TYPE,
                  anagrafiche.emittenti_fiscali.soggetto_ruolo_id%TYPE
              ) IS
                  'Scope policy EF_WHITELIST: ritorna true se l''identita puo '
                  'vedere le righe con il soggetto_ruolo emittente specificato. '
                  'Replica la logica legacy di config.user_emittenti_fiscali '
                  '(whitelist vuota = accesso globale). STABLE, inlineable.';
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS script.fn_scope_ef_whitelist(bigint, bigint);
