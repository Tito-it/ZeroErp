# R2, R3, R6 — LE AZIONI EFFETTIVE DI UN OPERATORE, IN UN POSTO SOLO:
#   script.fn_get_permessi_effettivi_azioni(p_auth_user_id, p_permission_codename DEFAULT NULL)
#   Brief: brief-db-permessi-tetto-area, sezioni 1, 3 (D-2, D-3, D-4) e 4 (R2, R3, R6)
#
# -- PERCHE' ------------------------------------------------------------------------------------
#   La catena delle azioni (gate di contesto, identita' OPERATORE, super admin, override,
#   profilo, negata) era scritta DUE volte: puntuale in fn_check_azione_processo e
#   set-based in fn_get_user_actions_map. Il tetto d'area andrebbe in tutte e due, e il
#   pannello (R6) ne vorrebbe una terza per dire «abilitata, ma limitata dall'area».
#   ⭐ Qui la catena sta una volta: i due resolver (-55, -56) la LEGGONO, e il pannello
#   anche (regola del 2: le copie si ritirano nello stesso giro).
#
# -- LA CATENA ----------------------------------------------------------------------------------
#   0. gate GUC: app.ruolo_applicativo valorizzata e diversa da OPERATORE -> tutto negato
#   1. nessuna identita' OPERATORE attiva -> tutto negato
#   2. super admin -> tutto abilitato, PRIMA del tetto (come oggi)
#   3. abilitata_specifica = override valido -> ereditato dal profilo
#      (script.fn_get_permessi_ereditati_azioni) -> negata. E' la catena di ieri.
#   4. abilitata = abilitata_specifica E l'area consente (script.fn_area_consente_azione,
#      livello d'area da script.fn_resolve_livello_area, sede della catena d'area).
#   limitata_da_area = abilitata_specifica E NON abilitata: l'override o il profilo dice si',
#   l'area dice no. E' il dormiente di D-3, che il pannello deve mostrare.
#   D-2: il tetto vale su qualunque fonte dello specifico, override o profilo.
#
# -- DUE MODI -----------------------------------------------------------------------------------
#   p_permission_codename NULL -> tutte le azioni del catalogo, attive e no (la mappa filtra
#   attivo; il pannello legge). Valorizzato -> UNA riga, anche per un codename che il
#   catalogo non ha (li' vale negata, e per il super admin abilitata: come il resolver di
#   ieri). I due rami in UNION ALL, mai in OR: il ramo spento e' un One-Time Filter.
#   Il livello d'area si risolve una volta per area distinta, non per azione.
#
# -- FORMA --------------------------------------------------------------------------------------
#   plpgsql: il gate legge la sessione. STABLE, INVOKER. Le colonne del RETURNS TABLE sono
#   variabili OUT: ogni colonna delle query e' qualificata, e le colonne delle CTE hanno
#   nomi propri. Ancorate dove sono proiezioni di colonne (le due abilitazioni sono il
#   riflesso di user_override_azioni.abilitata); limitata_da_area e i flag del DECLARE sono
#   risposte calcolate, senza una colonna: boolean esplicito.
#   Niente guard sul parametro: la catena tratta un utente NULL o
#   inesistente come «nessuna identita'» (fail-closed), come i resolver che la leggono.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-53-create-fn-get-permessi-effettivi-azioni-mctit.yaml

  - changeSet:
      id: 20261004-53-create-fn-get-permessi-effettivi-azioni
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_permessi_effettivi_azioni(p_auth_user_id, p_permission_codename DEFAULT
        NULL): per ogni azione (o per una) la catena completa col tetto d'area —
        abilitata_specifica, livello_area, livello_minimo_area, abilitata, limitata_da_area.
        Sede unica della catena delle azioni (resolver, mappa, pannello). Brief:
        brief-db-permessi-tetto-area R2, R3, R6.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "3"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname IN ('fn_area_consente_azione', 'fn_get_permessi_ereditati_azioni',
                                   'fn_resolve_livello_area');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_permessi_effettivi_azioni(
                  p_auth_user_id        anagrafiche.identita_digitali.auth_user_id%TYPE,
                  p_permission_codename config.azioni_processo.permission_codename%TYPE DEFAULT NULL
              )
              RETURNS TABLE (
                  permission_codename config.azioni_processo.permission_codename%TYPE,
                  azione_id           config.azioni_processo.id%TYPE,
                  area_id             config.azioni_processo.area_id%TYPE,
                  attivo              config.azioni_processo.attivo%TYPE,
                  abilitata_specifica config.user_override_azioni.abilitata%TYPE,  -- catena senza tetto
                  livello_area        config.user_override_aree.livello%TYPE,
                  livello_minimo_area config.azioni_processo.livello_minimo_area%TYPE,
                  abilitata           config.user_override_azioni.abilitata%TYPE,  -- catena col tetto
                  limitata_da_area    boolean    -- calcolato: lo specifico dice si', l'area no (nessuna colonna)
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: la catena delle azioni di processo di un operatore, col tetto d'area
              --   (brief-db-permessi-tetto-area). Sede unica: la leggono
              --   fn_check_azione_processo, fn_get_user_actions_map e il pannello permessi.
              DECLARE
                  v_ctx_ruolo    anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
                  v_has_identita boolean;   -- flag calcolato (fn_has_identita_attiva)
                  v_is_super     boolean;   -- flag calcolato (fn_is_super_admin)
              BEGIN
                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      v_has_identita := false;
                      v_is_super     := false;
                  ELSE
                      -- 1-2. Identita' OPERATORE attiva, super admin.
                      v_has_identita := script.fn_has_identita_attiva(
                                            p_auth_user_id,
                                            'OPERATORE'::config.ruolo_applicativo);
                      v_is_super     := v_has_identita
                                        AND script.fn_is_super_admin(p_auth_user_id);
                  END IF;

                  RETURN QUERY
                  WITH voci AS (
                      -- Tutto il catalogo (mappa, pannello).
                      SELECT ap.permission_codename AS v_codename, ap.id AS v_azione_id,
                             ap.area_id AS v_area_id, ap.attivo AS v_attivo,
                             ap.livello_minimo_area AS v_minimo
                        FROM config.azioni_processo ap
                       WHERE p_permission_codename IS NULL
                      UNION ALL
                      -- Una sola azione (resolver puntuale): la riga c'e' anche per un
                      -- codename fuori catalogo, e li' vale il default.
                      SELECT q.codename, ap.id, ap.area_id, ap.attivo, ap.livello_minimo_area
                        FROM (VALUES (p_permission_codename)) q(codename)
                        LEFT JOIN config.azioni_processo ap
                          ON ap.permission_codename = q.codename
                       WHERE p_permission_codename IS NOT NULL
                  ),
                  livelli AS (
                      -- Il livello d'area: dalla sede della catena d'area, una volta per area.
                      SELECT d.l_area_id,
                             script.fn_resolve_livello_area(p_auth_user_id, d.l_schema_db) AS l_livello
                        FROM (SELECT DISTINCT v.v_area_id AS l_area_id, af.schema_db AS l_schema_db
                                FROM voci v
                                JOIN config.aree_funzionali af ON af.id = v.v_area_id) d
                  ),
                  specifiche AS (
                      -- 3. La catena senza tetto: override valido -> profilo -> negata.
                      SELECT v.*, l.l_livello,
                             CASE
                                 WHEN NOT v_has_identita THEN false
                                 WHEN v_is_super          THEN true
                                 ELSE COALESCE(uoa.abilitata, e.abilitata, false)
                             END AS s_specifica
                        FROM voci v
                        LEFT JOIN livelli l
                          ON l.l_area_id = v.v_area_id
                        LEFT JOIN config.user_override_azioni uoa
                          ON uoa.auth_user_id = p_auth_user_id
                         AND uoa.azione_id    = v.v_azione_id
                         AND uoa.validita @> CURRENT_DATE
                        LEFT JOIN script.fn_get_permessi_ereditati_azioni(p_auth_user_id) e
                          ON e.azione_id = v.v_azione_id
                  ),
                  effettive AS (
                      -- 4. Il tetto: il super admin lo precede, tutti gli altri lo subiscono.
                      SELECT s.*,
                             CASE
                                 WHEN v_is_super THEN true
                                 ELSE s.s_specifica
                                      AND script.fn_area_consente_azione(s.l_livello, s.v_minimo)
                             END AS s_effettiva
                        FROM specifiche s
                  )
                  SELECT f.v_codename, f.v_azione_id, f.v_area_id, f.v_attivo,
                         f.s_specifica, f.l_livello, f.v_minimo,
                         f.s_effettiva,
                         f.s_specifica AND NOT f.s_effettiva
                    FROM effettive f;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_permessi_effettivi_azioni(anagrafiche.identita_digitali.auth_user_id%TYPE, config.azioni_processo.permission_codename%TYPE) IS
                  'Le azioni di processo effettive di un operatore, col tetto d''area (brief-db-permessi-tetto-area, D-1…D-4). Per ogni azione: abilitata_specifica (la catena senza tetto: gate di contesto, identita'' OPERATORE attiva, super admin, override valido, ereditato dal profilo con script.fn_get_permessi_ereditati_azioni, default negata), livello_area (script.fn_resolve_livello_area sull''area dell''azione), livello_minimo_area, abilitata (= specifica E script.fn_area_consente_azione; il super admin precede il tetto) e limitata_da_area (specifica si'', area no: l''override o il profilo e'' dormiente, D-3). p_permission_codename NULL -> tutto il catalogo, attive e no; valorizzato -> una riga, anche per un codename fuori catalogo (negata). Sede UNICA della catena delle azioni: la leggono script.fn_check_azione_processo, script.fn_get_user_actions_map e il pannello permessi (backend). plpgsql, STABLE, INVOKER.';

              GRANT EXECUTE ON FUNCTION script.fn_get_permessi_effettivi_azioni(anagrafiche.identita_digitali.auth_user_id%TYPE, config.azioni_processo.permission_codename%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_permessi_effettivi_azioni(integer, character varying);
