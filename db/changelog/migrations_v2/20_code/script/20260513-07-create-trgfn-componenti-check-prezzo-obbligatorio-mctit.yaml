databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260513-07-create-trgfn-componenti-check-prezzo-obbligatorio-mctit.yaml

  # ---------------------------------------------------------------------------
  # Trigger guard prezzo obbligatorio su *_righe_componenti (2026-05-13, §3.1).
  #
  # Sostituisce il CHECK universale (<> 0) rimosso da 20260513-06.
  # Regola: se articolo_componente.obbligatorio = TRUE, prezzo_unitario <> 0.
  # Opzionali e padre composito (calcolato) ammettono qualsiasi valore.
  #
  # 1 changeSet funzione (runOnChange) + 4 changeSet trigger (uno per sorgente):
  #   07-01  trgfn script.trgfn_componenti_check_prezzo_obbligatorio
  #   07-02  trigger preventivi_righe_componenti
  #   07-03  trigger ordini_righe_componenti
  #   07-04  trigger ddt_righe_componenti
  #   07-05  trigger contratti_righe_componenti
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260513-07-01-create-trgfn-componenti-check-prezzo-obbligatorio
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Trigger function script.trgfn_componenti_check_prezzo_obbligatorio.
        BEFORE INSERT OR UPDATE: se articoli_componenti.obbligatorio=TRUE e
        prezzo_unitario=0 -> raise E_DOC_COMPONENTE_OBBLIGATORIO_PREZZO_ZERO (444).
        Opzionali e padre ammettono 0 e negativi.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: catalogo
              tableName: articoli_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_componenti_check_prezzo_obbligatorio()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE INSERT OR UPDATE su *_righe_componenti — blocca
              --   prezzo_unitario=0 solo per componenti obbligatori. Componenti
              --   opzionali ammettono prezzo=0 (incluso a costo zero). Negativi
              --   ammessi per entrambi (sconti, abbuoni).
              DECLARE
                  v_obbligatorio  catalogo.articoli_componenti.obbligatorio%TYPE;
                  v_codice_comp   catalogo.articoli.codice%TYPE;
              BEGIN
                  -- Legge obbligatorio e codice componente in unica query
                  SELECT ac.obbligatorio, a.codice
                    INTO v_obbligatorio, v_codice_comp
                    FROM catalogo.articoli_componenti ac
                    JOIN catalogo.articoli a ON a.id = ac.componente_id
                   WHERE ac.id = NEW.articolo_componente_id;

                  -- Obbligatorio + prezzo zero: bloccato
                  IF COALESCE(v_obbligatorio, TRUE) AND NEW.prezzo_unitario = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_DOC_COMPONENTE_OBBLIGATORIO_PREZZO_ZERO',
                          jsonb_build_object(
                              'articolo_componente_id', NEW.articolo_componente_id,
                              'componente_id',          NEW.componente_id,
                              'prezzo_unitario',        NEW.prezzo_unitario
                          ),
                          NULL::uuid,
                          COALESCE(v_codice_comp, NEW.componente_id::text)
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_componenti_check_prezzo_obbligatorio() IS
                  'Trigger BEFORE INS/UPD su *_righe_componenti: blocca prezzo_unitario=0 '
                  'se articoli_componenti.obbligatorio=TRUE. Opzionali e padre ammettono 0. '
                  'Raise E_DOC_COMPONENTE_OBBLIGATORIO_PREZZO_ZERO (444). rev 2026-05-13.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS script.trgfn_componenti_check_prezzo_obbligatorio();

  - changeSet:
      id: 20260513-07-02-create-trg-prevrighe-comp-check-prezzo-obbligatorio
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Trigger BEFORE INSERT OR UPDATE su vendite.preventivi_righe_componenti,
        fase _a10_guard. Chiama trgfn_componenti_check_prezzo_obbligatorio.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: preventivi_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_componenti_check_prezzo_obbligatorio';
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_prevrighe_comp_a10_prezzo_obbligatorio_ins_upd
                  ON vendite.preventivi_righe_componenti;

              CREATE TRIGGER trg_prevrighe_comp_a10_prezzo_obbligatorio_ins_upd
                  BEFORE INSERT OR UPDATE OF prezzo_unitario, articolo_componente_id
                  ON vendite.preventivi_righe_componenti
                  FOR EACH ROW
                  EXECUTE FUNCTION script.trgfn_componenti_check_prezzo_obbligatorio();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_prevrighe_comp_a10_prezzo_obbligatorio_ins_upd
                  ON vendite.preventivi_righe_componenti;

