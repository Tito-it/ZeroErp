# Liquibase changelog per Zero ERP
# CREATE script.fn_get_setup_status
# Aiuto informativo per il banner UI "advise, don't enforce" (D1).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260408-19-create-fn-get-setup-status-mctit.yaml

  - changeSet:
      id: 20260408-19-create-fn-get-setup-status
      author: mctit
      runOnChange: false
      # validCheckSum:
      #    - ANY
      comment: >
        Ritorna lo stato di setup operatore-emittente in un singolo jsonb:
        emittenti_attivi, operatori_totali, operatori_assegnati,
        operatori_admin_globali, operatori_non_assegnati. Pensata per essere
        chiamata dal frontend (banner di amministrazione operatori).
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: anagrafiche, tableName: emittenti_fiscali }
        - tableExists:
            { schemaName: anagrafiche, tableName: risorse_umane_auth_user }
        - tableExists: { schemaName: config, tableName: user_emittenti_fiscali }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- IMPORTANTE: LANGUAGE plpgsql (NON sql) per "deferred parsing".
              -- In CI Liquibase gira prima di Django migrate, quindi
              -- django.auth_user non esiste ancora al momento del CREATE.
              -- LANGUAGE sql parsa subito e fallirebbe con
              -- "relation django.auth_user does not exist". LANGUAGE plpgsql
              -- risolve i riferimenti SQL embedded solo al primo invoke
              -- (a quel punto Django ha gia' migrato).
              -- La query interna resta invariata: una sola CTE single-scan
              -- con FILTER aggregations, wrappata in BEGIN/END plpgsql.
              CREATE OR REPLACE FUNCTION script.fn_get_setup_status()
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_result jsonb;
              BEGIN
                  WITH sub_emittenti AS (
                      SELECT COUNT(*)::bigint AS emittenti_attivi
                        FROM anagrafiche.emittenti_fiscali
                       WHERE attivo = true
                  ),
                  sub_op AS (
                      SELECT
                          COUNT(*)::bigint AS operatori_totali,
                          COUNT(*) FILTER (WHERE uef.auth_user_id IS NOT NULL)::bigint
                              AS operatori_assegnati,
                          COUNT(*) FILTER (
                              WHERE uef.auth_user_id IS NULL
                                AND rau.ruolo_sistema = 'ADMIN'::config.ruolo_sistema
                          )::bigint AS operatori_admin_globali
                        FROM anagrafiche.risorse_umane_auth_user rau
                        JOIN django.auth_user au
                          ON au.id = rau.auth_user_id
                        LEFT JOIN config.user_emittenti_fiscali uef
                          ON uef.auth_user_id = rau.auth_user_id
                       WHERE rau.attivo = true
                         AND rau.ruolo_sistema <> 'DISABILITATO'::config.ruolo_sistema
                         AND au.is_active = true
                  )
                  SELECT jsonb_build_object(
                      'emittenti_attivi',         sub_emittenti.emittenti_attivi,
                      'operatori_totali',         sub_op.operatori_totali,
                      'operatori_assegnati',      sub_op.operatori_assegnati,
                      'operatori_admin_globali',  sub_op.operatori_admin_globali,
                      'operatori_non_assegnati',  greatest(
                          sub_op.operatori_totali - sub_op.operatori_assegnati, 0
                      )
                  )
                    INTO v_result
                    FROM sub_emittenti, sub_op;

                  RETURN v_result;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_setup_status()
              IS 'Stato di setup operatore-emittente in un singolo jsonb (emittenti_attivi, operatori_totali, operatori_assegnati, operatori_admin_globali, operatori_non_assegnati). Aiuto informativo per il banner di amministrazione operatori (pattern advise, don''t enforce).';
