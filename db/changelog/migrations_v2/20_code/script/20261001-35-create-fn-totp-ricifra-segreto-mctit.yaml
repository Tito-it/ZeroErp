# IL SEGRETO TOTP SEGUE LA ROTAZIONE DELLE CHIAVI:
#   script.fn_totp_ricifra_segreto(p_auth_user_id, p_secret_atteso, p_secret_nuovo)
#   Brief: brief-db-totp-ricifra-segreto, sezione 2 (strada A, decisione 9 di
#   brief-be-fe-sicurezza-header-token-mfa §6).
#
# ── ⭐ PERCHE' SERVE UN VERBO ────────────────────────────────────────
#   Il segreto lo cifra il backend (MultiFernet sulle chiavi di
#   DJANGO_FIELD_ENCRYPTION_KEYS): quando le chiavi ruotano, solo lui puo'
#   aprirlo e richiuderlo con la chiave nuova. Ma su config.auth_totp_device
#   l'app ha il SOLO SELECT (la porta, 90_end/20260929-24): il comando di
#   rotazione non puo' scrivere con un UPDATE diretto. Questo verbo e' la sua
#   sola scrittura, e non apre altro.
#
# ── ⭐ CONFRONTA E SOSTITUISCI, IN UNA ISTRUZIONE ─────────────────────
#   UPDATE … WHERE secret_encrypted = p_secret_atteso: il comando legge senza
#   FOR UPDATE, e se nel frattempo il device e' stato riconfigurato o
#   disabilitato il WHERE non combacia piu' e il verbo risponde false (non e'
#   un errore: il comando lo conta e lo dice). Due scritture simultanee si
#   mettono in fila sulla riga, e la seconda rivaluta il WHERE sul valore
#   appena scritto. Vale per un device in QUALUNQUE stato: anche il segreto di
#   un setup a meta' va portato sulla chiave nuova.
#   Non tocca altro: ne' confermato, ne' l'anti-replay, ne' i codici di
#   recupero, ne' ultimo_uso_at (ricifrare non e' un uso).
#
# ── ⚠️ NESSUNO AGISCE: LO CHIAMA UN COMANDO DI MANUTENZIONE ──────────
#   Come fn_totp_registra_uso e fn_totp_consuma_recovery. Il limite e' quello
#   gia' scritto per i verbi del dominio: il modello protegge da un backend che
#   SBAGLIA, non da uno MANOMESSO. Non e' un potere nuovo: il segreto lo apre
#   solo chi ha le chiavi, cioe' il backend. Il confronto protegge dall'errore
#   vero, sovrascrivere un segreto cambiato fra la lettura e la scrittura.
#
# ── ⛔ IL SEGRETO NON ENTRA NEL LOG ──────────────────────────────────
#   Il contesto di fn_log_and_raise_error finisce in dbops.error_log: ci vanno
#   solo i segni (vuoto? uguali?), mai i due token, nemmeno cifrati.
#
# SECURITY DEFINER del PROPRIETARIO, search_path bloccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261001-35-create-fn-totp-ricifra-segreto-mctit.yaml

  - changeSet:
      id: 20261001-35-create-fn-totp-ricifra-segreto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_totp_ricifra_segreto(p_auth_user_id, p_secret_atteso, p_secret_nuovo) -> boolean:
        sostituisce secret_encrypted di config.auth_totp_device solo se e' ancora il valore letto
        (confronta e sostituisci, una istruzione), per la rotazione delle chiavi di cifratura del
        backend; false se il segreto e' cambiato o il device non c'e'. Parametri rotti ->
        E_AUTH_CHIAMATA_NON_VALIDA. Nessuno agisce. SECURITY DEFINER del proprietario. Brief:
        brief-db-totp-ricifra-segreto §2.
      preConditions:
        - onFail: HALT
        - columnExists:
            { schemaName: config, tableName: auth_totp_device, columnName: secret_encrypted }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_totp_ricifra_segreto(
                  p_auth_user_id  integer,
                  p_secret_atteso config.auth_totp_device.secret_encrypted%TYPE,
                  p_secret_nuovo  config.auth_totp_device.secret_encrypted%TYPE
              )
              RETURNS boolean
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: portare il segreto di un device sulla chiave di cifratura
              --   nuova, solo se e' ancora quello che il comando ha letto.
              BEGIN
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0
                     OR p_secret_atteso IS NULL OR btrim(p_secret_atteso) = ''
                     OR p_secret_nuovo  IS NULL OR btrim(p_secret_nuovo)  = ''
                     OR p_secret_atteso = p_secret_nuovo THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_totp_ricifra_segreto', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          -- Solo i segni, mai i token: il contesto finisce nel log.
                          jsonb_build_object(
                              'p_auth_user_id', p_auth_user_id,
                              'atteso_vuoto',   p_secret_atteso IS NULL OR btrim(p_secret_atteso) = '',
                              'nuovo_vuoto',    p_secret_nuovo  IS NULL OR btrim(p_secret_nuovo)  = '',
                              'uguali',         p_secret_atteso = p_secret_nuovo),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_totp_ricifra_segreto',
                                         'credenziale, segreto atteso e segreto nuovo (diversi) obbligatori']);
                  END IF;

                  -- Confronto e scrittura insieme: chi ha cambiato il segreto
                  -- nel frattempo vince, e qui il WHERE non combacia piu'.
                  UPDATE config.auth_totp_device d
                     SET secret_encrypted = p_secret_nuovo
                   WHERE d.auth_user_id     = p_auth_user_id
                     AND d.secret_encrypted = p_secret_atteso;

                  RETURN FOUND;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_totp_ricifra_segreto(integer, character varying, character varying) IS
                  'Porta il segreto TOTP sulla chiave di cifratura nuova alla rotazione delle chiavi del backend (manage.py ricifra_campi_cifrati): sostituisce secret_encrypted solo se e'' ancora il valore letto, confronto e scrittura in UNA istruzione. true se ha scritto; false se il segreto e'' cambiato nel frattempo (device riconfigurato o disabilitato) o il device non c''e'': il comando lo conta, non e'' un errore. Vale per un device in qualunque stato, DA_CONFERMARE compreso. Non tocca altro: ne'' confermato, ne'' l''anti-replay, ne'' i codici di recupero, ne'' ultimo_uso_at. Id NULL o <= 0, segreti NULL o vuoti, atteso = nuovo -> E_AUTH_CHIAMATA_NON_VALIDA (i segreti non entrano nel contesto del log). Nessuno agisce: lo chiama un comando di manutenzione. Limite: il backend sostituisce un segreto senza dire chi e'' — non e'' un potere nuovo, il segreto lo apre solo chi ha le chiavi; il modello protegge da un backend che sbaglia, non da uno manomesso. SECURITY DEFINER del PROPRIETARIO, search_path bloccato; la tabella resta in sola lettura per l''app. Brief: brief-db-totp-ricifra-segreto §2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_totp_ricifra_segreto(integer, character varying, character varying);
