# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — lotto 3 (le note): lo smistatore del cliente del
#   portale sul padre vendite.note parla i codici nuovi.
#   Brief: brief-db-grammatica-unica-documenti §14 (Tid, 2026-10-25: ok alle proposte, via).
#
#   Dopo il 20261025-54 la partizione degli ordini e' ORDINE_VENDITA (FATTURA uguale). Corpo vivo
#   (dbdev, 2026-10-25, ultima revisione 20261021-38): cambia solo il codice del ramo dell'ordine;
#   i modi del risolutore ('fattura', 'ordine') restano (L3-6). Firma %TYPE dal padre nuovo,
#   SECURITY INVOKER, STABLE, COST 5000 come prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-63-update-fn-scope-note-cliente-perimetro-codici-grammatica-mctit.yaml

  - changeSet:
      id: 20261025-63-update-fn-scope-note-cliente-perimetro-codici-grammatica
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_scope_note_cliente_perimetro: il ramo dell'ordine sul codice ORDINE_VENDITA.
        Grammatica unica, lotto 3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_note_cliente_perimetro(
                  p_perimetro   anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  p_target_tipo vendite.note.target_tipo%TYPE,
                  p_target_id   vendite.note.target_id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE SECURITY INVOKER COST 5000
              AS $function$
                  -- Scopo: la nota e' del cliente che guarda? Smista su target_tipo per
                  --   il PADRE partizionato vendite.note, veste CLIENTE_PORTALE.
                  -- Il perimetro (il soggetto dell'identita') NON lo calcola lei: glielo
                  --   passa la policy in UNA sottoquery su
                  --   script.fn_get_identita_sr_perimetro, valutata una volta per
                  --   istruzione. Per riga resta il cliente della testata, dal
                  --   risolutore DEFINER con lo stesso modo della partizione.
                  -- ⛔ L'ELSE false e' la riga che conta: un target_tipo senza ramo
                  --   rende quelle note INVISIBILI al cliente, non visibili.
                  SELECT CASE p_target_tipo
                      WHEN 'FATTURA'        THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('fattura', p_target_id))
                      WHEN 'ORDINE_VENDITA' THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('ordine', p_target_id))
                      ELSE false
                  END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_note_cliente_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE) IS
              'Smistatore di scope per il PADRE partizionato vendite.note, veste CLIENTE_PORTALE: la nota e'' del cliente che guarda? Il perimetro (il soggetto dell''identita'') lo passa la policy, calcolato UNA volta per istruzione da script.fn_get_identita_sr_perimetro; per riga resta il cliente della testata, da script.fn_resolve_controparte_sr_id (FATTURA: modo fattura; ORDINE_VENDITA: modo ordine, gli stessi delle partizioni), confrontato da script.fn_scope_sr_perimetro (linee-guida-sql §10.3). ⛔ ELSE false: un target_tipo senza ramo rende quelle note invisibili al cliente. Rev 2026-10-21 (20261021-38, giro 4 di brief-db-perimetro-una-volta-famiglie-residue): prende il posto di fn_scope_note_cliente, che calcolava il perimetro per riga. Rev 2026-10-25 (20261025-63, brief-db-grammatica-unica-documenti lotto 3): il ramo dell''ordine parla ORDINE_VENDITA.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Torna il corpo del 20261021-38, testo e COMMENT compresi (il codice corto).
              CREATE OR REPLACE FUNCTION script.fn_scope_note_cliente_perimetro(
                  p_perimetro   anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  p_target_tipo vendite.note.target_tipo%TYPE,
                  p_target_id   vendite.note.target_id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE SECURITY INVOKER COST 5000
              AS $function$
                  -- Scopo: la nota e' del cliente che guarda? Smista su target_tipo per
                  --   il PADRE partizionato vendite.note, veste CLIENTE_PORTALE.
                  -- Il perimetro (il soggetto dell'identita') NON lo calcola lei: glielo
                  --   passa la policy in UNA sottoquery su
                  --   script.fn_get_identita_sr_perimetro, valutata una volta per
                  --   istruzione. Per riga resta il cliente della testata, dal
                  --   risolutore DEFINER con lo stesso modo della partizione.
                  -- ⛔ L'ELSE false e' la riga che conta: un target_tipo senza ramo
                  --   rende quelle note INVISIBILI al cliente, non visibili.
                  SELECT CASE p_target_tipo
                      WHEN 'FATTURA' THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('fattura', p_target_id))
                      WHEN 'ORDINE'  THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('ordine', p_target_id))
                      ELSE false
                  END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_note_cliente_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE) IS
              'Smistatore di scope per il PADRE partizionato vendite.note, veste CLIENTE_PORTALE: la nota e'' del cliente che guarda? Il perimetro (il soggetto dell''identita'') lo passa la policy, calcolato UNA volta per istruzione da script.fn_get_identita_sr_perimetro; per riga resta il cliente della testata, da script.fn_resolve_controparte_sr_id (FATTURA: modo fattura; ORDINE: modo ordine, gli stessi delle partizioni), confrontato da script.fn_scope_sr_perimetro (linee-guida-sql §10.3). ⛔ ELSE false: un target_tipo senza ramo rende quelle note invisibili al cliente. Rev 2026-10-21 (20261021-38, giro 4 di brief-db-perimetro-una-volta-famiglie-residue): prende il posto di fn_scope_note_cliente, che calcolava il perimetro per riga.';
