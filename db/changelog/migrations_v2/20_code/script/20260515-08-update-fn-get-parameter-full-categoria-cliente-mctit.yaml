databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260515-08-update-fn-get-parameter-full-categoria-cliente-mctit.yaml

  # ---------------------------------------------------------------------------
  # Step 1.2 — Refactor cascata parametri: nuovo overload fn_get_parameter_full
  #
  # Crea un NUOVO overload a 7 parametri di script.fn_get_parameter_full
  # aggiungendo p_categoria_cliente_id smallint DEFAULT NULL come ULTIMO
  # parametro (backward compatible: tutti i caller posizionali a 6 arg
  # continuano a chiamare il vecchio overload a 6 param senza modifiche).
  #
  # Cascata del nuovo overload:
  #   user -> categoria_cliente -> group -> emittente -> session -> function -> default
  #
  # Il vecchio overload (6 param) rimane invariato come compatibilita'.
  # Caller che vogliono il livello categoria_cliente devono esplicitamente
  # passare il 7° argomento (o usare named arg p_categoria_cliente_id =>).
  #
  # Vedere: brief-db-refactor-contratti-completo.md §Fase 1 Step 1.2
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260515-08-update-fn-get-parameter-full-categoria-cliente
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Nuovo overload script.fn_get_parameter_full a 7 parametri con
        p_categoria_cliente_id smallint DEFAULT NULL in coda.
        Cascata: user -> categoria_cliente -> group -> emittente -> session -> function -> default.
        L'overload a 6 parametri esistente resta invariato.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: config
                tableName: parameter_overrides
            - columnExists:
                schemaName: config
                tableName: parameter_overrides
                columnName: categoria_cliente_id
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_parameter_full(
                  p_code                  text,
                  p_emittente_fiscale_id  config.parameter_overrides.emittente_fiscale_id%TYPE  DEFAULT NULL,
                  p_django_user_id        config.parameter_overrides.django_user_id%TYPE        DEFAULT NULL,
                  p_group_ids             integer[]                                              DEFAULT NULL,
                  p_session_key           config.parameter_overrides.session_key%TYPE           DEFAULT NULL,
                  p_function_name         config.parameter_overrides.function_name%TYPE         DEFAULT NULL,
                  p_categoria_cliente_id  config.parameter_overrides.categoria_cliente_id%TYPE  DEFAULT NULL
              )
              RETURNS text
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Cascata: user -> categoria_cliente -> group -> emittente -> session -> function -> default.
              -- p_categoria_cliente_id e' l'ultimo parametro per backward compatibility:
              -- i caller posizionali a 6 arg usano l'overload precedente senza modifiche.
              -- Ogni subquery usa NULL-equality: se il param di scope e' NULL, la WHERE
              -- restituisce 0 righe e quel livello viene saltato naturalmente.
              -- p_group_ids resta integer[] esplicito: %TYPE[] non e' sintassi valida in PG.
              DECLARE
                  v_param_id  config.parameters.id%TYPE;
                  v_default   config.parameters.default_value%TYPE;
                  v_result    config.parameter_overrides.overridden_value%TYPE;
              BEGIN
                  SELECT id, default_value
                    INTO v_param_id, v_default
                    FROM config.parameters
                   WHERE code = p_code;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_get_parameter_full',
                          'ERRORE_PARAMETRI_TABELLA',
                          jsonb_build_object(
                              'codice_parametro', p_code,
                              'nome_tabella',      'config.parameters'
                          ),
                          NULL::uuid,
                          'config.parameters',
                          p_code::text
                      );
                  END IF;

                  SELECT COALESCE(
                      -- 1. user (massima priorita')
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id    = v_param_id
                          AND po.django_user_id  = p_django_user_id
                          AND po.attivo          = true
                        LIMIT 1),
                      -- 2. categoria_cliente (NUOVO: vince su group/emittente)
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id         = v_param_id
                          AND po.categoria_cliente_id = p_categoria_cliente_id
                          AND po.attivo               = true
                        LIMIT 1),
                      -- 3. group
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id    = v_param_id
                          AND po.django_group_id = ANY(p_group_ids)
                          AND po.attivo          = true
                        ORDER BY po.id
                        LIMIT 1),
                      -- 4. emittente
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id          = v_param_id
                          AND po.emittente_fiscale_id  = p_emittente_fiscale_id
                          AND po.attivo                = true
                        LIMIT 1),
                      -- 5. session
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id  = v_param_id
                          AND po.session_key   = p_session_key
                          AND po.attivo        = true
                        LIMIT 1),
                      -- 6. function
                      (SELECT po.overridden_value
                         FROM config.parameter_overrides po
                        WHERE po.parameter_id  = v_param_id
                          AND po.function_name = p_function_name
                          AND po.attivo        = true
                        LIMIT 1),
                      -- 7. default
                      v_default
                  ) INTO v_result;

                  RETURN v_result;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_parameter_full(
                  text, bigint, integer, integer[], text, text, smallint
              ) IS 'Cascata 7 livelli: user -> categoria_cliente -> group -> emittente -> session -> function -> default. '
                   'p_categoria_cliente_id (smallint, ultimo param) abilita il livello categoria cliente. '
                   'Backward compatible: caller con 6 arg usano il vecchio overload a 6 param. '
                   'p_group_ids integer[] esplicito (%%TYPE[] non valido in PG). '
                   'Usa config.parameter_overrides filtrato su attivo=TRUE.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_parameter_full(
                  text, bigint, integer, integer[], text, text, smallint
              );
