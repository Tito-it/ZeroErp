# script.fn_check_listino_congelabile: SI PUO' CONGELARE LA VERSIONE DI LISTINO?
#   Brief: brief-db-offerta-emissione-ed-erogazione §C.1.3 punti 1, 4, 5
#
# ── IL DIFETTO ───────────────────────────────────────────────────
#   Quattro sedi rispondevano alla domanda «con che versione emetto
#   l'offerta», in tre modi diversi (§A.1): la capability guardava la colonna
#   nuda e spegneva «Emetti» proprio perche' il congelamento non c'era ancora
#   stato. E il contratto si attivava senza versione, e da li' galleggiava
#   (§C.1.2, decisione A-D2 di Tid: non deve).
#
# ── COSA FA ──────────────────────────────────────────────────────
#   Il predicato, una volta, sui valori. Lo leggono i due guard di
#   transizione (-43, -45) e le due capability (-44, -46).
#   ⭐ Nessun codice nuovo per l'offerta: i due che il guard sollevava gia'.
#   Uno nuovo per il contratto, E_CONTRATTO_ATTIVAZIONE_SENZA_VERSIONE_LISTINO
#   (CSV dei messaggi e dei codici, stesso giro).
#   Ritorno indietro: DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-41-create-fn-check-listino-congelabile-mctit.yaml

  - changeSet:
      id: 20261007-41-create-fn-check-listino-congelabile
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce script.fn_check_listino_congelabile: i motivi per cui un'offerta non si
        emette o un contratto non si attiva per la versione di listino.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'fn_listino_versione_operativa'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_check_listino_congelabile(
                  p_documento           text,
                  p_listino_id          vendite.listini.id%TYPE,
                  p_listino_versione_id vendite.listini_versioni.id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- ⚠️ p_documento nudo DICHIARATO: un selettore (OFFERTA | CONTRATTO)
              --   senza colonna-vocabolario, come in fn_documento_listino_operativo.
              DECLARE
                  v_versione vendite.listini_versioni.id%TYPE;
                  v_stato    vendite.listini_versioni.stato%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dire perche' un documento NON puo' congelare la sua versione
                  --   di listino: l'offerta all'emissione, il contratto
                  --   all'attivazione. '[]' = puo'. Non solleva: sollevare e'
                  --   mestiere dei guard di transizione, che la CHIAMANO, come le
                  --   capability che spengono il pulsante (linee-guida-sql §12.5.2).
                  --
                  --   La versione giudicata e' quella che verrebbe congelata:
                  --   vendite.fn_listino_versione_operativa (la fissata, altrimenti
                  --   quella in vigore oggi).
                  --
                  -- Motivi (il primo e' quello che il guard solleva):
                  --   1. nessuna versione in vigore oggi (OFFERTA, CONTRATTO);
                  --   2. la versione fissata non e' ATTIVA (solo OFFERTA: il
                  --      contratto tiene la versione che l'offerta accettata gli ha
                  --      portato, anche se nel frattempo si e' chiusa).
                  --   Senza listino (negoziato puro del contratto): nessun motivo,
                  --   lo giudica il guard del negoziato puro.
                  -- =========================================================

                  IF p_documento IS NULL OR p_documento NOT IN ('OFFERTA', 'CONTRATTO') THEN
                      -- Errore di CHIAMANTE, non di dato: lo stesso codice del
                      -- risolutore delle righe.
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'script.fn_check_listino_congelabile',
                          'E_DOC_TIPO_NON_GESTITO',
                          jsonb_build_object('documento', p_documento),
                          NULL::uuid,
                          COALESCE(p_documento, '<null>'));
                  END IF;

                  IF p_listino_id IS NULL THEN
                      RETURN jsonb_build_array();
                  END IF;

                  v_versione := vendite.fn_listino_versione_operativa(p_listino_id, p_listino_versione_id);

                  -- 1. Nessuna versione in vigore oggi: offerta.
                  IF v_versione IS NULL AND p_documento = 'OFFERTA' THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_OFFERTA_EMISSIONE_SENZA_VERSIONE_LISTINO',
                          'reason',     'LISTINO_SENZA_VERSIONE_IN_VIGORE',
                          'reason_key', 'vendite.offerte.azione_reason.listino_senza_versione_in_vigore',
                          'dettaglio',  jsonb_build_object('listino_id', p_listino_id, 'data', CURRENT_DATE),
                          -- Frase chiusa: niente da infilare nei segnaposto.
                          'valori',     jsonb_build_array()));
                  END IF;

                  -- 1. Nessuna versione in vigore oggi: contratto.
                  IF v_versione IS NULL AND p_documento = 'CONTRATTO' THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_CONTRATTO_ATTIVAZIONE_SENZA_VERSIONE_LISTINO',
                          'reason',     'LISTINO_SENZA_VERSIONE_IN_VIGORE',
                          'reason_key', 'vendite.contratti.azione_reason.listino_senza_versione_in_vigore',
                          'dettaglio',  jsonb_build_object('listino_id', p_listino_id, 'data', CURRENT_DATE),
                          'valori',     jsonb_build_array()));
                  END IF;

                  IF p_documento = 'CONTRATTO' THEN
                      RETURN jsonb_build_array();
                  END IF;

                  -- 2. Offerta: la versione che congelerebbe dev'essere ATTIVA.
                  --    Quella in vigore oggi lo e' per costruzione (una CHIUSA ha
                  --    valido_al passato); qui risponde la versione FISSATA prima
                  --    dell'emissione.
                  SELECT lv.stato
                    INTO v_stato
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = v_versione;
                  IF v_stato IS DISTINCT FROM 'ATTIVA' THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_OFFERTA_EMISSIONE_VERSIONE_LISTINO_NON_ATTIVA',
                          'reason',     'LISTINO_VERSIONE_NON_ATTIVA',
                          'reason_key', 'vendite.offerte.azione_reason.listino_versione_non_attiva',
                          'dettaglio',  jsonb_build_object('listino_id', p_listino_id,
                                                           'listino_versione_id', v_versione,
                                                           'stato_versione', v_stato),
                          'valori',     jsonb_build_array()));
                  END IF;

                  RETURN jsonb_build_array();
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_listino_congelabile(text, vendite.listini.id%TYPE, vendite.listini_versioni.id%TYPE)
              IS 'Check pura: i motivi per cui un documento con eccezioni non può congelare la sua versione di listino — l''offerta all''emissione (p_documento = OFFERTA), il contratto all''attivazione (CONTRATTO). ''[]'' = può. Giudica la versione che verrebbe congelata, vendite.fn_listino_versione_operativa (la fissata, altrimenti quella in vigore oggi), sui valori della testata: la chiamano anche i guard BEFORE ROW. Motivi in ordine: 1) nessuna versione in vigore oggi — E_OFFERTA_EMISSIONE_SENZA_VERSIONE_LISTINO / E_CONTRATTO_ATTIVAZIONE_SENZA_VERSIONE_LISTINO, reason LISTINO_SENZA_VERSIONE_IN_VIGORE, reason_key vendite.offerte.azione_reason.listino_senza_versione_in_vigore / vendite.contratti.azione_reason.listino_senza_versione_in_vigore; 2) solo OFFERTA, la versione fissata non è ATTIVA — E_OFFERTA_EMISSIONE_VERSIONE_LISTINO_NON_ATTIVA, reason LISTINO_VERSIONE_NON_ATTIVA, reason_key vendite.offerte.azione_reason.listino_versione_non_attiva. Il contratto tiene la versione che l''offerta gli ha portato anche se nel frattempo si è chiusa. Senza listino nessun motivo (negoziato puro, lo giudica trgfn_contratti_freeze_listino_versione). Altro p_documento: E_DOC_TIPO_NON_GESTITO. Lettori: vendite.trgfn_offerte_commerciali_guard_transizione e vendite.trgfn_contratti_freeze_listino_versione (sollevano il primo motivo), script.fn_available_actions_offerta e script.fn_available_actions_contratto (spengono «Emetti» e «Attiva» col motivo): pulsanti e guard non possono dissentire. Nasce il 2026-10-07, brief-db-offerta-emissione-ed-erogazione §C.1.3 (decisioni A-D2, A-D3 di Tid).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_listino_congelabile(text, bigint, bigint);
