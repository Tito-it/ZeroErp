# ------------------------------------------------------------
# NASCE script.trgfn_righe_guard_esclusione_figlio_bundle: «si esclude il
# bundle, non il suo componente», per il contratto E per l'offerta.
#
# -- PERCHE' ------------------------------------------------------------
#   Prende il posto di vendite.trgfn_contratti_righe_guard_esclusione_
#   figlio_bundle (ritirata nello stesso giro, 20261004-73), che valeva per
#   il solo contratto. Sull'offerta la regola mancava: un'offerta che esclude
#   un figlio di bundle passava, e fn_push_offerta_a_contratto, che copia le
#   righe 1:1, faceva nascere un contratto rifiutato al push
#   (brief-db-righe-esclusione-solo-non-si-vende, R5c).
#
# -- LA FORMA -----------------------------------------------------------
#   Identica alla funzione che sostituisce: chiede i motivi alla check
#   (ora script.fn_check_esclusione_articolo_documento, 20261004-43) e
#   solleva il PRIMO con script.fn_raise_primo_motivo_se_presente, cosi'
#   tooltip ed errore non possono dire cose diverse.
#   · TG_ARGV[0] = documento ('CONTRATTO' | 'OFFERTA'), il selettore della
#     check; TG_ARGV[1] = la colonna del documento padre ('contratto_id',
#     'offerta_id'), letta da to_jsonb(NEW): la riga non e' tipizzata;
#   · montata BEFORE INSERT OR UPDATE ... WHEN (NEW.tipo_eccezione =
#     'ESCLUSIONE'), fascia _a10_ (20261004-48/-49), come prima;
#   · in script, accanto a trgfn_righe_default_fonte_qta e
#     trgfn_righe_guard_erogazione_obbligatoria: servono le stesse due
#     tabelle gemelle.
#   ⚠️ Il conteggio del presidio script/test-rubinetto-primo-motivo-v1 (le
#   chiamate a fn_raise_primo_motivo_se_presente) non cambia: un sito entra,
#   uno esce col ritiro della funzione del contratto.
#
# Brief: brief-db-righe-esclusione-solo-non-si-vende (R5c).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-44-create-trgfn-righe-guard-esclusione-figlio-bundle-mctit.yaml

  - changeSet:
      id: 20261004-44-create-trgfn-righe-guard-esclusione-figlio-bundle
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.trgfn_righe_guard_esclusione_figlio_bundle: rifiuta l'ESCLUSIONE di un componente
        di bundle su contratto e offerta (primo motivo di fn_check_esclusione_articolo_documento).
        Brief: brief-db-righe-esclusione-solo-non-si-vende (R5c).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'trgfn_righe_guard_esclusione_figlio_bundle';
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_check_esclusione_articolo_documento';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.trgfn_righe_guard_esclusione_figlio_bundle()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: rifiutare una riga ESCLUSIONE (contratto o offerta) su un
              --   articolo che e' componente di un bundle del listino del
              --   documento: il bundle si vende come unita', si esclude il padre,
              --   mai il figlio.
              -- Uso:   BEFORE INSERT OR UPDATE FOR EACH ROW
              --        WHEN (NEW.tipo_eccezione = 'ESCLUSIONE'), fascia _a10_.
              -- TG_ARGV[0]: documento ('CONTRATTO' | 'OFFERTA'), il selettore di
              --   script.fn_check_esclusione_articolo_documento.
              -- TG_ARGV[1]: colonna del documento padre ('contratto_id',
              --   'offerta_id').
              -- Il predicato vive nella check, la stessa con cui la lista delle
              --   righe spegne «Escludi»: qui si solleva il suo PRIMO motivo, e
              --   basta. Su un array vuoto l'helper tace (= passa).
              BEGIN
                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite',
                      TG_NAME::text,
                      script.fn_check_esclusione_articolo_documento(
                          TG_ARGV[0],
                          (to_jsonb(NEW) ->> TG_ARGV[1])::bigint,
                          NEW.articolo_id),
                      'articolo_id',
                      NEW.tx_id);

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_righe_guard_esclusione_figlio_bundle()
              IS 'Guard: una riga ESCLUSIONE di vendite.contratti_righe o di vendite.offerte_commerciali_eccezioni non puo'' escludere un componente di un bundle della versione operativa del listino: si esclude il bundle padre (E_CONTRATTO_ESCLUSIONE_FIGLIO_BUNDLE_VIETATA, campo articolo_id). Solleva il primo motivo di script.fn_check_esclusione_articolo_documento, lo stesso predicato con cui la lista delle righe spegne «Escludi». TG_ARGV[0] = documento (CONTRATTO | OFFERTA), TG_ARGV[1] = colonna del padre (contratto_id | offerta_id). Trigger _a10_ BEFORE INSERT OR UPDATE WHEN (NEW.tipo_eccezione = ''ESCLUSIONE''). Prende il posto di vendite.trgfn_contratti_righe_guard_esclusione_figlio_bundle (solo contratto, ritirata nello stesso giro): fn_push_offerta_a_contratto copia le righe 1:1 e la regola deve valere ai due capi. Nasce il 2026-10-04, brief-db-righe-esclusione-solo-non-si-vende (R5c).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.trgfn_righe_guard_esclusione_figlio_bundle();
