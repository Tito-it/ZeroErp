# Liquibase changelog per Zero ERP
#
# Aggiunge GUC override a trgfn_lock_columns:
#   SET LOCAL zeroerp.allow_lock_columns_override = 'on';
# consente di modificare colonne protette in contesti di
# manutenzione senza dover DISABLE/ENABLE TRIGGER.
# Pattern coerente con trgfn_delete_block_by_guc.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/script/20260328-02-update-trgfn-lock-columns-guc-override-mctit.yaml

  - changeSet:
      id: 20260328-02-update-trgfn-lock-columns-guc-override
      author: mctit
      runOnChange: false
      comment: >
        Aggiunge GUC override zeroerp.allow_lock_columns_override
        a script.trgfn_lock_columns. Se impostata a 'on' nella
        sessione/transazione, il trigger permette la modifica
        delle colonne protette. Per manutenzione e migrazioni dati.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              -- ==========================================================
              -- trgfn_lock_columns con GUC override
              --
              -- Scopo: impedisce la modifica di colonne protette.
              --        Se la GUC zeroerp.allow_lock_columns_override = 'on',
              --        il controllo viene saltato (manutenzione).
              --
              -- Regole:
              --   - Argomenti a coppie: (colonna, codice_messaggio)
              --   - Se n_args dispari: errore E_ARGOMENTI_A_COPPIE
              --   - Per ogni coppia: confronta OLD.col vs NEW.col
              --   - Se diversi e GUC non attiva: errore con codice messaggio
              --
              -- GUC: zeroerp.allow_lock_columns_override
              --   Uso: SET LOCAL zeroerp.allow_lock_columns_override = 'on';
              --   Scope: transazione corrente (SET LOCAL)
              --   Default: assente/off (colonne protette)
              -- ==========================================================
              CREATE OR REPLACE FUNCTION script.trgfn_lock_columns()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                n_args  int := array_length(TG_ARGV, 1);
                i       int;
                col     text;
                msgcode text;
                oldval  text;
                newval  text;
              BEGIN
                -- 0) GUC override per manutenzione
                IF current_setting('zeroerp.allow_lock_columns_override', true) = 'on' THEN
                  RETURN NEW;
                END IF;

                -- 1) Se il numero di argomenti non e pari, errore
                IF n_args % 2 <> 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    TG_NAME,
                    'E_ARGOMENTI_A_COPPIE',
                    jsonb_build_object('expected_pairs', n_args/2),
                    NULL::uuid,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                -- 2) Ciclo sulle coppie (colonna, codice messaggio)
                FOR i IN 1..n_args BY 2 LOOP
                  col     := TG_ARGV[i-1];
                  msgcode := TG_ARGV[i];

                  -- Leggo dinamicamente OLD.col e NEW.col
                  EXECUTE format(
                    'SELECT ($1).%I::text, ($2).%I::text',
                    col, col
                  ) USING OLD, NEW INTO oldval, newval;

                  IF oldval IS DISTINCT FROM newval THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      TG_NAME,
                      msgcode,
                      jsonb_build_object(
                        'column',    col,
                        'old_value', oldval,
                        'new_value', newval
                      ),
                      NULL::uuid,
                      col
                    );
                  END IF;
                END LOOP;

                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_lock_columns() IS
                'Impedisce modifica colonne protette. Override: SET LOCAL zeroerp.allow_lock_columns_override = ''on''. Argomenti a coppie (colonna, codice_messaggio).';
