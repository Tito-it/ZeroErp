# LA CAPABILITY DEL PREVENTIVO: in_smistamento
#   Brief: brief-db-stati-documento-dal-vocabolario §6.23 (R-V3), §6.24, giro 6g
#   (D-SMIST (a), Tid 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   Il drawer apriva il pannello dello smistamento con stato ACCETTATO o EVASO,
#   col codice: la capability dava can_push_commessa e can_genera_ordine
#   (eseguibili adesso), non «il preventivo e' uno che si smista».
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   + in_smistamento, da vendite.fn_preventivo_in_smistamento (-76), la stessa
#   risposta da cui parte la proiezione (-77). Le altre chiavi non cambiano.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, STABLE, INVOKER, nessun SET (pg_proc su
#   dbdev, 2026-11-14).
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14 (dopo 20261114-10); la firma, coi
#   suoi %TYPE, dal changeSet che l'ha scritta per ultimo. Il rollback porta il
#   corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261114-78-update-fn-available-actions-preventivo-in-smistamento-mctit.yaml

  - changeSet:
      id: 20261114-78-update-fn-available-actions-preventivo-in-smistamento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_available_actions_preventivo: + in_smistamento da vendite.fn_preventivo_in_smistamento.
        Brief: brief-db-stati-documento-dal-vocabolario, giro 6g (D-SMIST).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_preventivo(p_preventivo_id vendite.preventivi.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6g,
              --   D-SMIST): + in_smistamento, «il preventivo e' uno che si smista»,
              --   da vendite.fn_preventivo_in_smistamento, la sede unica della risposta.
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6a):
              --   can_edit_righe dal lock delle righe (script.fn_doc_riga_modificabile),
              --   non dal codice della bozza. COMMENT riscritto al presente.
              -- rev 2026-10-31 (20261031-64, brief-db-scadenza-preventivi §8.1):
              --   «Accetta» spento dai motivi di script.fn_check_preventivo_accettabile
              --   (la validita' finita, poi i prezzi non autorizzati: E-2); «Crea
              --   revisione» proposto anche dallo stato di scadenza del vocabolario
              --   (colonna scadenza, oggi SCADUTO: E-3 (ii)).
              -- rev 2026-10-31 (20261031-19, brief-modello-documento-vendita §17):
              --   accettazione, annullo ed emissione dal vocabolario (accettazione,
              --   is_abortito, emissione), non 'ACCETTATO', 'ANNULLATO', 'EMESSO'.
              -- Scopo: capability preventivo per detail API (pattern data-driven).
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_preventivi (bottone PDF data-driven via capabilities).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-07-19: label_key e reason_key nel namespace i18n
              --   vendite.preventivi.* (era preventivi.*, radice spostata dal FE
              --   nella migrazione radici i18n) — brief-i18n-radici-uniformi §5.
              --   rev 2026-08-04: + reasons sull'annullamento, da
              --   script.fn_check_preventivo_annullabile — la STESSA funzione che
              --   vendite.trgfn_preventivi_guard_annullamento usa per sollevare
              --   (sorgente unica: la UI non puo' divergere dal guard). I motivi
              --   si SOMMANO a quello di requires_righe in un array solo, da cui
              --   discendono enabled/reason/reason_key. + nessuna_azione_key
              --   dal meta dello stato, esposta quando nessuna azione e' abilitata
              --   (brief-db-vie-uscita-operatore §4 regola R3 e §6).
              --   rev 2026-08-06: + outlined dal meta della transizione (era
              --   l'unica insieme all'offerta a non emetterlo: il dato del seed
              --   non arrivava al pulsante) e + target_state_descrizione, la
              --   forma leggibile dello stato di destinazione. Serve alla frase
              --   di conferma «portare il documento nello stato X»: il
              --   codice_interno non basta a derivarla (DRAFT -> Bozza) e
              --   tradurla nel FE sarebbe una seconda copia del vocabolario
              --   degli stati. NULL sulle azioni che non cambiano stato.
              --   rev 2026-08-10: i motivi di push_commessa / genera_ordine non
              --   promettono piu' l'accettazione sugli stati CHIUSI. Il ramo
              --   `v_stato_cod <> 'ACCETTATO'` copriva per negazione due
              --   situazioni opposte — prima dell'accettazione (istruzione
              --   corretta) e dopo o fuori (promessa falsa: l'EVASO e' evaso
              --   PERCHE' accettato). Ramo nuovo su fase = 'CHIUSO' davanti a
              --   quello vecchio; reason PREVENTIVO_STATO_CHIUSO. Rilievo in-app
              --   di Tid su PRV0000192 (brief-db-vie-uscita-operatore §12).
              --   rev 2026-08-10 (2): la nota di stato non e' piu' subordinata alla
              --   lista vuota, e cambia nome. Decisione §5 di Tid: «la nota spiega lo
              --   stato chiuso, e compare sempre» — anche accanto a un'azione ancora
              --   viva, dove l'operatore legge cos'e' successo E ha il suo bottone.
              --   Cade quindi il presupposto che la faceva sparire: via
              --   v_nessuna_azione e il suo NOT EXISTS, che erano diventati codice
              --   morto, e via il commento che spiegava perche' non si appoggiavano a
              --   v_can_change — era la motivazione di una regola che non esiste piu'.
              --   Il campo si chiama ora `stato_info_key`: `nessuna_azione_key`
              --   diventava falso proprio nel momento in cui inizia a mostrarsi
              --   quando le azioni ci sono, e il vocabolario giusto era gia' dall'altra
              --   parte (le chiavi i18n stanno sotto vendite.<dominio>.stato_info.*).
              --   ⚠️ La PROPRIETA' nel meta dello stato resta `nessuna_azione_key`, ed
              --   e' voluto: il presidio scripts/check_i18n_keys.py trova quelle chiavi
              --   proprio per quel nome (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e
              --   rinominarla senza toccare il guard lo renderebbe verde per cecita' —
              --   il caso peggiore, gia' denunciato nel §8.3 del brief. Rinomina della
              --   proprieta' proposta come slice a se'.
              --   brief-db-vie-uscita-operatore §4; attivita-urgenti-del-10-08 §2.
              --   rev 2026-09-24: le azioni verso ACCETTATO espongono i motivi dei
              --   prezzi non autorizzati da script.fn_check_prezzi_autorizzati — lo
              --   stesso building block della Regola 3 del guard di transizione. Verso
              --   EMESSO arrivano gia' dentro fn_check_preventivo_emettibile.
              --   (brief-db-preventivi-congelamento-pricing, D-1/D-2).
              --   rev 2026-09-24 (2): «Crea revisione» spento col motivo se c'e' un
              --   prezzo IN ATTESA (script.fn_check_prezzi_in_attesa, stessa funzione
              --   della madre fn_crea_revisione_preventivo); can_create_revisione
              --   veritiero. Brief §10.
              --   rev 2026-10-10: via il ramo «testata incompleta» del motivo del push
              --   (il motivo «senza billing account»): BA e utility del preventivo sono
              --   NOT NULL, il ramo non si raggiungeva. Brief:
              --   brief-db-istanza-nasce-col-ba-residui (R-1).
              --   rev 2026-10-18: via c_sempre_non_edit. La sola colonna che
              --   nominava, utility_id, e' ora ferma sempre nel montaggio del lock di
              --   testata (con l'emittente): non_editable_fields la riceve da li', in
              --   ogni stato. La lista era la seconda copia della regola. Brief:
              --   brief-db-indirizzi-documento-seguono-il-cliente (§8.7).
              DECLARE
                  -- Tipi nudi solo per valori CALCOLATI (azioni e motivi jsonb, flag,
                  -- motivi e chiavi i18n composti): nessuna colonna di cui siano il riflesso.
                  v_stato_id          vendite.preventivi.stato_doc_preventivo_id%TYPE;
                  v_stato_cod         config.stati_doc_preventivi.codice_interno%TYPE;
                  -- Proiezione normalizzata dello stato: APERTO | IN_CORSO |
                  -- IN_ATTESA | CHIUSO. Serve a distinguere "non ancora
                  -- accettato" da "chiuso", che il solo codice_interno
                  -- confondeva in un unico ramo per negazione.
                  v_fase              config.stati_doc_preventivi.fase%TYPE;
                  -- Lo stato di oggi e' l'accettazione? l'emissione? Dal vocabolario.
                  v_accettazione      config.stati_doc_preventivi.accettazione%TYPE;
                  v_emissione         config.stati_doc_preventivi.emissione%TYPE;
                  -- ... la scadenza? (rev 2026-10-31: da li' si ripropone, E-3 (ii))
                  v_scadenza          config.stati_doc_preventivi.scadenza%TYPE;
                  -- L'ultimo giorno valido, per i motivi dell'accettazione (E-2).
                  v_validita_al       vendite.preventivi.validita_al%TYPE;
                  v_pdf_mode          config.stati_doc_preventivi.pdf_mode%TYPE;
                  v_pdf_allow         config.stati_doc_preventivi.pdf_allow_allegati%TYPE;
                  v_stato_info_key       text;
                  v_actions           jsonb;
                  v_ha_righe          boolean := false;
                  v_mot_annulla       jsonb := '[]'::jsonb;
                  v_mot_emetti        jsonb := '[]'::jsonb;
                  v_mot_accetta       jsonb := '[]'::jsonb;
                  v_mot_rev           jsonb := '[]'::jsonb;
                  v_can_edit          boolean;
                  v_can_push          boolean;
                  v_can_rev           boolean;
                  v_push_reason       text;
                  v_push_reason_key   text;
                  v_can_ordine        boolean;
                  v_ordine_reason     text;
                  v_ordine_reason_key text;
                  -- Motivo "documento vuoto" nella STESSA forma dei motivi delle
                  -- fn_check_* ({codice, reason, reason_key, dettaglio}), cosi' i
                  -- due mondi si concatenano senza conversioni. `codice` e' quello
                  -- che il guard della porta solleva davvero (PREV_NESSUNA_RIGA_ATTIVA
                  -- in vendite.fn_cambia_stato_preventivo): qui non si solleva nulla,
                  -- ma un codice inventato diventerebbe una bugia il giorno in cui
                  -- qualcuno lo confronta con l'errore ricevuto.
                  c_motivo_senza_righe CONSTANT jsonb := jsonb_build_array(
                      jsonb_build_object(
                          'codice',     'E_PREV_NESSUNA_RIGA_ATTIVA',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  0));
                  -- Azioni applicative: non sono transizioni, quindi
                  -- target_state e target_state_descrizione restano NULL.
                  c_action_crea_revisione CONSTANT jsonb := jsonb_build_object(
                      'key',                      'crea_revisione',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.preventivi.azione_crea_revisione',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  c_action_push_commessa CONSTANT jsonb := jsonb_build_object(
                      'key',                      'push_commessa',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.preventivi.azione_push_commessa',
                      'requires_motivazione',     false,
                      'requires_confirm',         true,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  c_action_genera_ordine CONSTANT jsonb := jsonb_build_object(
                      'key',                      'genera_ordine',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.preventivi.azione_genera_ordine',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  -- La testata nello stato, dal montaggio del lock (rev 2026-10-10):
                  -- {modificabile, non_modificabili}.
                  v_testata jsonb;
              BEGIN
                  -- Stato corrente + fase + capability PDF
                  -- (pdf_mode/allow_allegati) + la chiave "nessuna azione"
                  -- dello stato (dato, non codice).
                  SELECT p.stato_doc_preventivo_id, sdp.codice_interno, sdp.fase,
                         sdp.accettazione, sdp.emissione, sdp.scadenza, p.validita_al,
                         sdp.pdf_mode, sdp.pdf_allow_allegati,
                         -- ⚠️ La PROPRIETA' nel meta resta `nessuna_azione_key` mentre il
                         -- campo del blob si chiama ora `stato_info_key`. L'asimmetria e'
                         -- voluta e la spiega la rev 2026-08-10 (2) in testa: il presidio
                         -- i18n si aggancia a QUESTO nome.
                         sdp.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_fase,
                         v_accettazione, v_emissione, v_scadenza, v_validita_al,
                         v_pdf_mode, v_pdf_allow, v_stato_info_key
                    FROM vendite.preventivi p
                    JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                   WHERE p.id = p_preventivo_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard di fn_cambia_stato_preventivo
                  -- (PREV_NESSUNA_RIGA_ATTIVA, rev 2026-07-16): SOLO presenza di
                  -- riga attiva, nessun vincolo su quantita/prezzo/totale.
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.preventivi_righe pr
                       WHERE pr.preventivo_id = p_preventivo_id
                         AND pr.attivo IS TRUE
                  );

                  -- Motivi ostativi all'ANNULLAMENTO, calcolati UNA VOLTA SOLA.
                  -- Fn pura: [] quando e' lecito. E' la stessa che solleva nel guard.
                  v_mot_annulla := script.fn_check_preventivo_annullabile(p_preventivo_id);

                  -- Motivi ostativi all'EMISSIONE, anch'essi calcolati UNA VOLTA SOLA.
                  -- Stessa forma e stessa ragione della riga sopra: e' la funzione che il
                  -- guard di transizione usa per sollevare (Regola 2), quindi bottone e
                  -- guard non possono divergere. rev 2026-08-29, brief IVA I9.
                  v_mot_emetti := script.fn_check_preventivo_emettibile(p_preventivo_id);

                  -- Motivi ostativi all'ACCETTAZIONE. E' la check che la Regola 3 del
                  -- guard di transizione usa per sollevare, quindi «Accetta» e guard
                  -- non possono divergere. rev 2026-09-24 i prezzi non autorizzati
                  -- (brief-db-preventivi-congelamento-pricing, D-2); rev 2026-10-31
                  -- (20261031-64) dalla check dell'accettazione, che prima porta la
                  -- validita' finita (brief-db-scadenza-preventivi, E-2). La data e' un
                  -- parametro: la stessa check la legge il guard BEFORE ROW da NEW.
                  v_mot_accetta := script.fn_check_preventivo_accettabile(p_preventivo_id,
                                                                          v_validita_al);

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              -- Tutto discende dall'array dei motivi: nessuna
                              -- regola puo' mascherarne un'altra.
                              'enabled',          jsonb_array_length(m.motivi) = 0,
                              'reason',           m.motivi -> 0 ->> 'reason',
                              'reason_key',       m.motivi -> 0 ->> 'reason_key',
                              'reasons',          m.motivi
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  -- I passaggi manuali che l'utente puo' fare, dal BB comune (rev
                  -- 2026-10-27, 20261027-41, §15.14): matrice viva, manuale, permesso.
                  FROM script.fn_doc_azioni_permesse('vendite.preventivi'::regclass, v_stato_id) t
                  JOIN config.stati_doc_preventivi sa ON sa.id = t.stato_a_id
                  -- I motivi della destinazione, sommati in un array solo.
                  -- Ordine: prima quelli specifici della destinazione, poi il
                  -- generico "documento vuoto"; il primo e' quello che il FE
                  -- mostra nel caso singolare.
                  CROSS JOIN LATERAL (
                      SELECT CASE WHEN sa.is_abortito
                                  THEN v_mot_annulla ELSE '[]'::jsonb END
                          -- Lo stato di emissione dal vocabolario (rev 2026-10-25).
                          || CASE WHEN sa.emissione
                                  THEN v_mot_emetti ELSE '[]'::jsonb END
                          || CASE WHEN sa.accettazione
                                  THEN v_mot_accetta ELSE '[]'::jsonb END
                          || CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                       AND NOT v_ha_righe
                                  THEN c_motivo_senza_righe ELSE '[]'::jsonb END AS motivi
                  ) m
                  WHERE t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Le righe si modificano dove il lock delle righe le lascia scrivere
                  -- (rev 2026-11-14): la stessa risposta del trigger
                  -- vendite.trgfn_doc_righe_lock_fuori_bozza, che riconosce la bozza dallo
                  -- stato iniziale del vocabolario.
                  v_can_edit := script.fn_doc_riga_modificabile('vendite.preventivi_righe'::regclass, v_stato_cod);
                  -- Dallo stato di emissione e da quello di scadenza (rev 2026-10-31,
                  -- E-3 (ii)): le due strade che la madre della revisione ammette.
                  v_can_rev  := v_emissione OR v_scadenza;

                  v_can_push := v_accettazione
                      AND vendite.fn_preventivo_ha_residuo_commessa(p_preventivo_id);

                  v_can_ordine := v_accettazione
                      AND vendite.fn_preventivo_ha_residuo_ordine(p_preventivo_id);

                  -- «Crea revisione» (rev 2026-09-24): proposta da EMESSO (e dal
                  -- 2026-10-31 da SCADUTO, dal vocabolario), SPENTA col
                  -- motivo se il documento ha un prezzo IN ATTESA — lo stesso
                  -- script.fn_check_prezzi_in_attesa con cui la madre
                  -- vendite.fn_crea_revisione_preventivo rifiuta. Pulsante e madre non possono
                  -- dissentire. ⭐ can_create_revisione diventa VERITIERO: vero solo se
                  -- la revisione si puo' davvero creare (il FE legge l'azione, non il
                  -- flag; il BE lo trasporta).
                  IF v_can_rev THEN
                      v_mot_rev := script.fn_check_prezzi_in_attesa('vendite.preventivi'::regclass, p_preventivo_id);
                      v_actions := v_actions || jsonb_build_array(
                          c_action_crea_revisione || jsonb_build_object(
                              'enabled',    jsonb_array_length(v_mot_rev) = 0,
                              'reason',     v_mot_rev -> 0 ->> 'reason',
                              'reason_key', v_mot_rev -> 0 ->> 'reason_key',
                              'reasons',    v_mot_rev));
                      v_can_rev := jsonb_array_length(v_mot_rev) = 0;
                  END IF;

                  IF v_can_push THEN
                      v_actions := v_actions || jsonb_build_array(c_action_push_commessa);
                  END IF;

                  IF v_can_ordine THEN
                      v_actions := v_actions || jsonb_build_array(c_action_genera_ordine);
                  END IF;

                  -- Motivo del push a commessa. ⚠️ L'ORDINE DEI RAMI E'
                  -- PORTANTE: "chiuso" viene prima di "non accettato".
                  -- `NOT v_accettazione` copre per negazione due
                  -- situazioni opposte — prima dell'accettazione la frase
                  -- «sara' disponibile dopo l'accettazione» istruisce, dopo o
                  -- fuori mente (l'EVASO e' evaso PERCHE' e' stato accettato e
                  -- smistato; ANNULLATO/RIFIUTATO/SCADUTO non ci arriveranno
                  -- mai). Il ramo su `fase` scioglie la negazione nei suoi due
                  -- versi. Rilievo in-app 2026-08-10 su PRV0000192.
                  IF v_can_push THEN
                      v_push_reason     := NULL;
                      v_push_reason_key := NULL;
                  ELSIF v_fase = 'CHIUSO' THEN
                      v_push_reason     := 'PREVENTIVO_STATO_CHIUSO';
                      v_push_reason_key := 'vendite.preventivi.push_commessa_reason.stato_chiuso';
                  ELSIF NOT v_accettazione THEN
                      v_push_reason     := 'PREVENTIVO_NON_ACCETTATO';
                      v_push_reason_key := 'vendite.preventivi.push_commessa_reason.non_accettato';
                  ELSE
                      v_push_reason     := 'PREVENTIVO_NESSUNA_RIGA_COMMESSA';
                      v_push_reason_key := 'vendite.preventivi.push_commessa_reason.nessuna_riga';
                  END IF;

                  -- Ramo gemello per la generazione dell'ordine: stessa
                  -- correzione, stesso ordine dei rami.
                  IF v_can_ordine THEN
                      v_ordine_reason     := NULL;
                      v_ordine_reason_key := NULL;
                  ELSIF v_fase = 'CHIUSO' THEN
                      v_ordine_reason     := 'PREVENTIVO_STATO_CHIUSO';
                      v_ordine_reason_key := 'vendite.preventivi.genera_ordine_reason.stato_chiuso';
                  ELSIF NOT v_accettazione THEN
                      v_ordine_reason     := 'PREVENTIVO_NON_ACCETTATO';
                      v_ordine_reason_key := 'vendite.preventivi.genera_ordine_reason.non_accettato';
                  ELSE
                      v_ordine_reason     := 'PREVENTIVO_NESSUNA_RIGA_ORDINE';
                      v_ordine_reason_key := 'vendite.preventivi.genera_ordine_reason.nessuna_riga';
                  END IF;

                  -- La testata nello stato, letta dal montaggio del lock di testata
                  -- (rev 2026-10-10): le colonne che il lock blocca in questo stato,
                  -- comprese quelle ferme sempre (rev 2026-10-18). Nessuno stato e
                  -- nessuna colonna scritti qui.
                  v_testata := script.fn_doc_testata_in_stato('vendite.preventivi'::regclass, v_stato_cod);

                  RETURN jsonb_build_object(
                      'available_actions',            v_actions,
                      'can_edit_testata',  (v_testata ->> 'modificabile')::boolean,
                      'can_edit_righe',               v_can_edit,
                      -- Dal montaggio del lock dei satelliti (rev 2026-10-11, R-DB-3).
                      'can_edit_indirizzi',  script.fn_doc_riga_modificabile('vendite.preventivi_indirizzi'::regclass, v_stato_cod),
                      'can_push_commessa',            v_can_push,
                      'can_push_commessa_reason',     v_push_reason,
                      'can_push_commessa_reason_key', v_push_reason_key,
                      'can_genera_ordine',            v_can_ordine,
                      'can_genera_ordine_reason',     v_ordine_reason,
                      'can_genera_ordine_reason_key', v_ordine_reason_key,
                      'can_create_revisione',         v_can_rev,
                      -- Lo stato e' uno da cui il preventivo si smista (accettazione o
                      -- EVASO): non dice che un invio si possa fare adesso, quello lo
                      -- dicono can_push_commessa e can_genera_ordine.
                      'in_smistamento',               vendite.fn_preventivo_in_smistamento(v_accettazione, v_stato_cod),
                      'stato_info_key',           v_stato_info_key,
                      'non_editable_fields', v_testata -> 'non_modificabili',
                      'pdf',                          jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_codice',                 v_stato_cod
                  );
              END;
              $function$

              ;

              COMMENT ON FUNCTION script.fn_available_actions_preventivo(p_preventivo_id vendite.preventivi.id%TYPE)
              IS 'Capability del preventivo per il dettaglio (NULL se il preventivo non c''e''). available_actions: i passaggi manuali permessi da script.fn_doc_azioni_permesse (matrice viva, manuale; un passaggio con un''azione di processo si nasconde a chi non ce l''ha), ognuno con enabled, reason e reason_key dal primo motivo e reasons, l''array intero; target_state e target_state_descrizione dalla destinazione; label_key, requires_confirm, outlined dal meta del passaggio. I motivi, sul significato della destinazione: verso lo stato di annullo (is_abortito) script.fn_check_preventivo_annullabile, verso lo stato di emissione script.fn_check_preventivo_emettibile, verso lo stato di accettazione script.fn_check_preventivo_accettabile (la validita'' finita, poi i prezzi non autorizzati); poi DOCUMENTO_SENZA_RIGHE dove il meta del passaggio chiede requires_righe e il preventivo non ha righe attive. Sono gli stessi predicati di vendite.trgfn_preventivi_guard_annullamento e vendite.trgfn_preventivi_guard_transizione. Azioni applicative: crea_revisione dallo stato di emissione e da quello di scadenza, spenta col motivo di script.fn_check_prezzi_in_attesa, le strade e il predicato di vendite.fn_crea_revisione_preventivo (can_create_revisione e'' vero solo se la revisione si puo'' creare); push_commessa e genera_ordine dallo stato di accettazione con un residuo su quella strada (vendite.fn_preventivo_ha_residuo_commessa, vendite.fn_preventivo_ha_residuo_ordine). in_smistamento: lo stato corrente e'' uno da cui il preventivo si smista (vendite.fn_preventivo_in_smistamento: lo stato di accettazione o EVASO), la stessa risposta da cui parte vendite.fn_preventivo_proietta_stato_smistamento; non dice che un invio si possa fare adesso. can_push_commessa, can_genera_ordine e i loro reason e reason_key: PREVENTIVO_STATO_CHIUSO nella fase CHIUSO, PREVENTIVO_NON_ACCETTATO fuori dallo stato di accettazione, altrimenti PREVENTIVO_NESSUNA_RIGA_COMMESSA o PREVENTIVO_NESSUNA_RIGA_ORDINE. Cosa si modifica: can_edit_testata e non_editable_fields dal montaggio del lock di testata (script.fn_doc_testata_in_stato), can_edit_righe e can_edit_indirizzi dal lock delle righe e dei satelliti (script.fn_doc_riga_modificabile), lo stesso che il trigger fa rispettare. pdf {mode, allow_allegati} dal vocabolario. stato_info_key: la nota dello stato dal suo meta (proprieta'' nessuna_azione_key), sempre presente, null quando lo stato non la dichiara. stato_codice: il codice_interno dello stato corrente. Le reason_key sono chiavi i18n del frontend.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_preventivo(p_preventivo_id vendite.preventivi.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6a):
              --   can_edit_righe dal lock delle righe (script.fn_doc_riga_modificabile),
              --   non dal codice della bozza. COMMENT riscritto al presente.
              -- rev 2026-10-31 (20261031-64, brief-db-scadenza-preventivi §8.1):
              --   «Accetta» spento dai motivi di script.fn_check_preventivo_accettabile
              --   (la validita' finita, poi i prezzi non autorizzati: E-2); «Crea
              --   revisione» proposto anche dallo stato di scadenza del vocabolario
              --   (colonna scadenza, oggi SCADUTO: E-3 (ii)).
              -- rev 2026-10-31 (20261031-19, brief-modello-documento-vendita §17):
              --   accettazione, annullo ed emissione dal vocabolario (accettazione,
              --   is_abortito, emissione), non 'ACCETTATO', 'ANNULLATO', 'EMESSO'.
              -- Scopo: capability preventivo per detail API (pattern data-driven).
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_preventivi (bottone PDF data-driven via capabilities).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-07-19: label_key e reason_key nel namespace i18n
              --   vendite.preventivi.* (era preventivi.*, radice spostata dal FE
              --   nella migrazione radici i18n) — brief-i18n-radici-uniformi §5.
              --   rev 2026-08-04: + reasons sull'annullamento, da
              --   script.fn_check_preventivo_annullabile — la STESSA funzione che
              --   vendite.trgfn_preventivi_guard_annullamento usa per sollevare
              --   (sorgente unica: la UI non puo' divergere dal guard). I motivi
              --   si SOMMANO a quello di requires_righe in un array solo, da cui
              --   discendono enabled/reason/reason_key. + nessuna_azione_key
              --   dal meta dello stato, esposta quando nessuna azione e' abilitata
              --   (brief-db-vie-uscita-operatore §4 regola R3 e §6).
              --   rev 2026-08-06: + outlined dal meta della transizione (era
              --   l'unica insieme all'offerta a non emetterlo: il dato del seed
              --   non arrivava al pulsante) e + target_state_descrizione, la
              --   forma leggibile dello stato di destinazione. Serve alla frase
              --   di conferma «portare il documento nello stato X»: il
              --   codice_interno non basta a derivarla (DRAFT -> Bozza) e
              --   tradurla nel FE sarebbe una seconda copia del vocabolario
              --   degli stati. NULL sulle azioni che non cambiano stato.
              --   rev 2026-08-10: i motivi di push_commessa / genera_ordine non
              --   promettono piu' l'accettazione sugli stati CHIUSI. Il ramo
              --   `v_stato_cod <> 'ACCETTATO'` copriva per negazione due
              --   situazioni opposte — prima dell'accettazione (istruzione
              --   corretta) e dopo o fuori (promessa falsa: l'EVASO e' evaso
              --   PERCHE' accettato). Ramo nuovo su fase = 'CHIUSO' davanti a
              --   quello vecchio; reason PREVENTIVO_STATO_CHIUSO. Rilievo in-app
              --   di Tid su PRV0000192 (brief-db-vie-uscita-operatore §12).
              --   rev 2026-08-10 (2): la nota di stato non e' piu' subordinata alla
              --   lista vuota, e cambia nome. Decisione §5 di Tid: «la nota spiega lo
              --   stato chiuso, e compare sempre» — anche accanto a un'azione ancora
              --   viva, dove l'operatore legge cos'e' successo E ha il suo bottone.
              --   Cade quindi il presupposto che la faceva sparire: via
              --   v_nessuna_azione e il suo NOT EXISTS, che erano diventati codice
              --   morto, e via il commento che spiegava perche' non si appoggiavano a
              --   v_can_change — era la motivazione di una regola che non esiste piu'.
              --   Il campo si chiama ora `stato_info_key`: `nessuna_azione_key`
              --   diventava falso proprio nel momento in cui inizia a mostrarsi
              --   quando le azioni ci sono, e il vocabolario giusto era gia' dall'altra
              --   parte (le chiavi i18n stanno sotto vendite.<dominio>.stato_info.*).
              --   ⚠️ La PROPRIETA' nel meta dello stato resta `nessuna_azione_key`, ed
              --   e' voluto: il presidio scripts/check_i18n_keys.py trova quelle chiavi
              --   proprio per quel nome (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e
              --   rinominarla senza toccare il guard lo renderebbe verde per cecita' —
              --   il caso peggiore, gia' denunciato nel §8.3 del brief. Rinomina della
              --   proprieta' proposta come slice a se'.
              --   brief-db-vie-uscita-operatore §4; attivita-urgenti-del-10-08 §2.
              --   rev 2026-09-24: le azioni verso ACCETTATO espongono i motivi dei
              --   prezzi non autorizzati da script.fn_check_prezzi_autorizzati — lo
              --   stesso building block della Regola 3 del guard di transizione. Verso
              --   EMESSO arrivano gia' dentro fn_check_preventivo_emettibile.
              --   (brief-db-preventivi-congelamento-pricing, D-1/D-2).
              --   rev 2026-09-24 (2): «Crea revisione» spento col motivo se c'e' un
              --   prezzo IN ATTESA (script.fn_check_prezzi_in_attesa, stessa funzione
              --   della madre fn_crea_revisione_preventivo); can_create_revisione
              --   veritiero. Brief §10.
              --   rev 2026-10-10: via il ramo «testata incompleta» del motivo del push
              --   (il motivo «senza billing account»): BA e utility del preventivo sono
              --   NOT NULL, il ramo non si raggiungeva. Brief:
              --   brief-db-istanza-nasce-col-ba-residui (R-1).
              --   rev 2026-10-18: via c_sempre_non_edit. La sola colonna che
              --   nominava, utility_id, e' ora ferma sempre nel montaggio del lock di
              --   testata (con l'emittente): non_editable_fields la riceve da li', in
              --   ogni stato. La lista era la seconda copia della regola. Brief:
              --   brief-db-indirizzi-documento-seguono-il-cliente (§8.7).
              DECLARE
                  -- Tipi nudi solo per valori CALCOLATI (azioni e motivi jsonb, flag,
                  -- motivi e chiavi i18n composti): nessuna colonna di cui siano il riflesso.
                  v_stato_id          vendite.preventivi.stato_doc_preventivo_id%TYPE;
                  v_stato_cod         config.stati_doc_preventivi.codice_interno%TYPE;
                  -- Proiezione normalizzata dello stato: APERTO | IN_CORSO |
                  -- IN_ATTESA | CHIUSO. Serve a distinguere "non ancora
                  -- accettato" da "chiuso", che il solo codice_interno
                  -- confondeva in un unico ramo per negazione.
                  v_fase              config.stati_doc_preventivi.fase%TYPE;
                  -- Lo stato di oggi e' l'accettazione? l'emissione? Dal vocabolario.
                  v_accettazione      config.stati_doc_preventivi.accettazione%TYPE;
                  v_emissione         config.stati_doc_preventivi.emissione%TYPE;
                  -- ... la scadenza? (rev 2026-10-31: da li' si ripropone, E-3 (ii))
                  v_scadenza          config.stati_doc_preventivi.scadenza%TYPE;
                  -- L'ultimo giorno valido, per i motivi dell'accettazione (E-2).
                  v_validita_al       vendite.preventivi.validita_al%TYPE;
                  v_pdf_mode          config.stati_doc_preventivi.pdf_mode%TYPE;
                  v_pdf_allow         config.stati_doc_preventivi.pdf_allow_allegati%TYPE;
                  v_stato_info_key       text;
                  v_actions           jsonb;
                  v_ha_righe          boolean := false;
                  v_mot_annulla       jsonb := '[]'::jsonb;
                  v_mot_emetti        jsonb := '[]'::jsonb;
                  v_mot_accetta       jsonb := '[]'::jsonb;
                  v_mot_rev           jsonb := '[]'::jsonb;
                  v_can_edit          boolean;
                  v_can_push          boolean;
                  v_can_rev           boolean;
                  v_push_reason       text;
                  v_push_reason_key   text;
                  v_can_ordine        boolean;
                  v_ordine_reason     text;
                  v_ordine_reason_key text;
                  -- Motivo "documento vuoto" nella STESSA forma dei motivi delle
                  -- fn_check_* ({codice, reason, reason_key, dettaglio}), cosi' i
                  -- due mondi si concatenano senza conversioni. `codice` e' quello
                  -- che il guard della porta solleva davvero (PREV_NESSUNA_RIGA_ATTIVA
                  -- in vendite.fn_cambia_stato_preventivo): qui non si solleva nulla,
                  -- ma un codice inventato diventerebbe una bugia il giorno in cui
                  -- qualcuno lo confronta con l'errore ricevuto.
                  c_motivo_senza_righe CONSTANT jsonb := jsonb_build_array(
                      jsonb_build_object(
                          'codice',     'E_PREV_NESSUNA_RIGA_ATTIVA',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  0));
                  -- Azioni applicative: non sono transizioni, quindi
                  -- target_state e target_state_descrizione restano NULL.
                  c_action_crea_revisione CONSTANT jsonb := jsonb_build_object(
                      'key',                      'crea_revisione',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.preventivi.azione_crea_revisione',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  c_action_push_commessa CONSTANT jsonb := jsonb_build_object(
                      'key',                      'push_commessa',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.preventivi.azione_push_commessa',
                      'requires_motivazione',     false,
                      'requires_confirm',         true,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  c_action_genera_ordine CONSTANT jsonb := jsonb_build_object(
                      'key',                      'genera_ordine',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.preventivi.azione_genera_ordine',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  -- La testata nello stato, dal montaggio del lock (rev 2026-10-10):
                  -- {modificabile, non_modificabili}.
                  v_testata jsonb;
              BEGIN
                  -- Stato corrente + fase + capability PDF
                  -- (pdf_mode/allow_allegati) + la chiave "nessuna azione"
                  -- dello stato (dato, non codice).
                  SELECT p.stato_doc_preventivo_id, sdp.codice_interno, sdp.fase,
                         sdp.accettazione, sdp.emissione, sdp.scadenza, p.validita_al,
                         sdp.pdf_mode, sdp.pdf_allow_allegati,
                         -- ⚠️ La PROPRIETA' nel meta resta `nessuna_azione_key` mentre il
                         -- campo del blob si chiama ora `stato_info_key`. L'asimmetria e'
                         -- voluta e la spiega la rev 2026-08-10 (2) in testa: il presidio
                         -- i18n si aggancia a QUESTO nome.
                         sdp.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_fase,
                         v_accettazione, v_emissione, v_scadenza, v_validita_al,
                         v_pdf_mode, v_pdf_allow, v_stato_info_key
                    FROM vendite.preventivi p
                    JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                   WHERE p.id = p_preventivo_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard di fn_cambia_stato_preventivo
                  -- (PREV_NESSUNA_RIGA_ATTIVA, rev 2026-07-16): SOLO presenza di
                  -- riga attiva, nessun vincolo su quantita/prezzo/totale.
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.preventivi_righe pr
                       WHERE pr.preventivo_id = p_preventivo_id
                         AND pr.attivo IS TRUE
                  );

                  -- Motivi ostativi all'ANNULLAMENTO, calcolati UNA VOLTA SOLA.
                  -- Fn pura: [] quando e' lecito. E' la stessa che solleva nel guard.
                  v_mot_annulla := script.fn_check_preventivo_annullabile(p_preventivo_id);

                  -- Motivi ostativi all'EMISSIONE, anch'essi calcolati UNA VOLTA SOLA.
                  -- Stessa forma e stessa ragione della riga sopra: e' la funzione che il
                  -- guard di transizione usa per sollevare (Regola 2), quindi bottone e
                  -- guard non possono divergere. rev 2026-08-29, brief IVA I9.
                  v_mot_emetti := script.fn_check_preventivo_emettibile(p_preventivo_id);

                  -- Motivi ostativi all'ACCETTAZIONE. E' la check che la Regola 3 del
                  -- guard di transizione usa per sollevare, quindi «Accetta» e guard
                  -- non possono divergere. rev 2026-09-24 i prezzi non autorizzati
                  -- (brief-db-preventivi-congelamento-pricing, D-2); rev 2026-10-31
                  -- (20261031-64) dalla check dell'accettazione, che prima porta la
                  -- validita' finita (brief-db-scadenza-preventivi, E-2). La data e' un
                  -- parametro: la stessa check la legge il guard BEFORE ROW da NEW.
                  v_mot_accetta := script.fn_check_preventivo_accettabile(p_preventivo_id,
                                                                          v_validita_al);

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              -- Tutto discende dall'array dei motivi: nessuna
                              -- regola puo' mascherarne un'altra.
                              'enabled',          jsonb_array_length(m.motivi) = 0,
                              'reason',           m.motivi -> 0 ->> 'reason',
                              'reason_key',       m.motivi -> 0 ->> 'reason_key',
                              'reasons',          m.motivi
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  -- I passaggi manuali che l'utente puo' fare, dal BB comune (rev
                  -- 2026-10-27, 20261027-41, §15.14): matrice viva, manuale, permesso.
                  FROM script.fn_doc_azioni_permesse('vendite.preventivi'::regclass, v_stato_id) t
                  JOIN config.stati_doc_preventivi sa ON sa.id = t.stato_a_id
                  -- I motivi della destinazione, sommati in un array solo.
                  -- Ordine: prima quelli specifici della destinazione, poi il
                  -- generico "documento vuoto"; il primo e' quello che il FE
                  -- mostra nel caso singolare.
                  CROSS JOIN LATERAL (
                      SELECT CASE WHEN sa.is_abortito
                                  THEN v_mot_annulla ELSE '[]'::jsonb END
                          -- Lo stato di emissione dal vocabolario (rev 2026-10-25).
                          || CASE WHEN sa.emissione
                                  THEN v_mot_emetti ELSE '[]'::jsonb END
                          || CASE WHEN sa.accettazione
                                  THEN v_mot_accetta ELSE '[]'::jsonb END
                          || CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                       AND NOT v_ha_righe
                                  THEN c_motivo_senza_righe ELSE '[]'::jsonb END AS motivi
                  ) m
                  WHERE t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Le righe si modificano dove il lock delle righe le lascia scrivere
                  -- (rev 2026-11-14): la stessa risposta del trigger
                  -- vendite.trgfn_doc_righe_lock_fuori_bozza, che riconosce la bozza dallo
                  -- stato iniziale del vocabolario.
                  v_can_edit := script.fn_doc_riga_modificabile('vendite.preventivi_righe'::regclass, v_stato_cod);
                  -- Dallo stato di emissione e da quello di scadenza (rev 2026-10-31,
                  -- E-3 (ii)): le due strade che la madre della revisione ammette.
                  v_can_rev  := v_emissione OR v_scadenza;

                  v_can_push := v_accettazione
                      AND vendite.fn_preventivo_ha_residuo_commessa(p_preventivo_id);

                  v_can_ordine := v_accettazione
                      AND vendite.fn_preventivo_ha_residuo_ordine(p_preventivo_id);

                  -- «Crea revisione» (rev 2026-09-24): proposta da EMESSO (e dal
                  -- 2026-10-31 da SCADUTO, dal vocabolario), SPENTA col
                  -- motivo se il documento ha un prezzo IN ATTESA — lo stesso
                  -- script.fn_check_prezzi_in_attesa con cui la madre
                  -- vendite.fn_crea_revisione_preventivo rifiuta. Pulsante e madre non possono
                  -- dissentire. ⭐ can_create_revisione diventa VERITIERO: vero solo se
                  -- la revisione si puo' davvero creare (il FE legge l'azione, non il
                  -- flag; il BE lo trasporta).
                  IF v_can_rev THEN
                      v_mot_rev := script.fn_check_prezzi_in_attesa('vendite.preventivi'::regclass, p_preventivo_id);
                      v_actions := v_actions || jsonb_build_array(
                          c_action_crea_revisione || jsonb_build_object(
                              'enabled',    jsonb_array_length(v_mot_rev) = 0,
                              'reason',     v_mot_rev -> 0 ->> 'reason',
                              'reason_key', v_mot_rev -> 0 ->> 'reason_key',
                              'reasons',    v_mot_rev));
                      v_can_rev := jsonb_array_length(v_mot_rev) = 0;
                  END IF;

                  IF v_can_push THEN
                      v_actions := v_actions || jsonb_build_array(c_action_push_commessa);
                  END IF;

                  IF v_can_ordine THEN
                      v_actions := v_actions || jsonb_build_array(c_action_genera_ordine);
                  END IF;

                  -- Motivo del push a commessa. ⚠️ L'ORDINE DEI RAMI E'
                  -- PORTANTE: "chiuso" viene prima di "non accettato".
                  -- `NOT v_accettazione` copre per negazione due
                  -- situazioni opposte — prima dell'accettazione la frase
                  -- «sara' disponibile dopo l'accettazione» istruisce, dopo o
                  -- fuori mente (l'EVASO e' evaso PERCHE' e' stato accettato e
                  -- smistato; ANNULLATO/RIFIUTATO/SCADUTO non ci arriveranno
                  -- mai). Il ramo su `fase` scioglie la negazione nei suoi due
                  -- versi. Rilievo in-app 2026-08-10 su PRV0000192.
                  IF v_can_push THEN
                      v_push_reason     := NULL;
                      v_push_reason_key := NULL;
                  ELSIF v_fase = 'CHIUSO' THEN
                      v_push_reason     := 'PREVENTIVO_STATO_CHIUSO';
                      v_push_reason_key := 'vendite.preventivi.push_commessa_reason.stato_chiuso';
                  ELSIF NOT v_accettazione THEN
                      v_push_reason     := 'PREVENTIVO_NON_ACCETTATO';
                      v_push_reason_key := 'vendite.preventivi.push_commessa_reason.non_accettato';
                  ELSE
                      v_push_reason     := 'PREVENTIVO_NESSUNA_RIGA_COMMESSA';
                      v_push_reason_key := 'vendite.preventivi.push_commessa_reason.nessuna_riga';
                  END IF;

                  -- Ramo gemello per la generazione dell'ordine: stessa
                  -- correzione, stesso ordine dei rami.
                  IF v_can_ordine THEN
                      v_ordine_reason     := NULL;
                      v_ordine_reason_key := NULL;
                  ELSIF v_fase = 'CHIUSO' THEN
                      v_ordine_reason     := 'PREVENTIVO_STATO_CHIUSO';
                      v_ordine_reason_key := 'vendite.preventivi.genera_ordine_reason.stato_chiuso';
                  ELSIF NOT v_accettazione THEN
                      v_ordine_reason     := 'PREVENTIVO_NON_ACCETTATO';
                      v_ordine_reason_key := 'vendite.preventivi.genera_ordine_reason.non_accettato';
                  ELSE
                      v_ordine_reason     := 'PREVENTIVO_NESSUNA_RIGA_ORDINE';
                      v_ordine_reason_key := 'vendite.preventivi.genera_ordine_reason.nessuna_riga';
                  END IF;

                  -- La testata nello stato, letta dal montaggio del lock di testata
                  -- (rev 2026-10-10): le colonne che il lock blocca in questo stato,
                  -- comprese quelle ferme sempre (rev 2026-10-18). Nessuno stato e
                  -- nessuna colonna scritti qui.
                  v_testata := script.fn_doc_testata_in_stato('vendite.preventivi'::regclass, v_stato_cod);

                  RETURN jsonb_build_object(
                      'available_actions',            v_actions,
                      'can_edit_testata',  (v_testata ->> 'modificabile')::boolean,
                      'can_edit_righe',               v_can_edit,
                      -- Dal montaggio del lock dei satelliti (rev 2026-10-11, R-DB-3).
                      'can_edit_indirizzi',  script.fn_doc_riga_modificabile('vendite.preventivi_indirizzi'::regclass, v_stato_cod),
                      'can_push_commessa',            v_can_push,
                      'can_push_commessa_reason',     v_push_reason,
                      'can_push_commessa_reason_key', v_push_reason_key,
                      'can_genera_ordine',            v_can_ordine,
                      'can_genera_ordine_reason',     v_ordine_reason,
                      'can_genera_ordine_reason_key', v_ordine_reason_key,
                      'can_create_revisione',         v_can_rev,
                      'stato_info_key',           v_stato_info_key,
                      'non_editable_fields', v_testata -> 'non_modificabili',
                      'pdf',                          jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_codice',                 v_stato_cod
                  );
              END;
              $function$

              ;

              COMMENT ON FUNCTION script.fn_available_actions_preventivo(p_preventivo_id vendite.preventivi.id%TYPE)
              IS 'Capability del preventivo per il dettaglio (NULL se il preventivo non c''e''). available_actions: i passaggi manuali permessi da script.fn_doc_azioni_permesse (matrice viva, manuale; un passaggio con un''azione di processo si nasconde a chi non ce l''ha), ognuno con enabled, reason e reason_key dal primo motivo e reasons, l''array intero; target_state e target_state_descrizione dalla destinazione; label_key, requires_confirm, outlined dal meta del passaggio. I motivi, sul significato della destinazione: verso lo stato di annullo (is_abortito) script.fn_check_preventivo_annullabile, verso lo stato di emissione script.fn_check_preventivo_emettibile, verso lo stato di accettazione script.fn_check_preventivo_accettabile (la validita'' finita, poi i prezzi non autorizzati); poi DOCUMENTO_SENZA_RIGHE dove il meta del passaggio chiede requires_righe e il preventivo non ha righe attive. Sono gli stessi predicati di vendite.trgfn_preventivi_guard_annullamento e vendite.trgfn_preventivi_guard_transizione. Azioni applicative: crea_revisione dallo stato di emissione e da quello di scadenza, spenta col motivo di script.fn_check_prezzi_in_attesa, le strade e il predicato di vendite.fn_crea_revisione_preventivo (can_create_revisione e'' vero solo se la revisione si puo'' creare); push_commessa e genera_ordine dallo stato di accettazione con un residuo su quella strada (vendite.fn_preventivo_ha_residuo_commessa, vendite.fn_preventivo_ha_residuo_ordine). can_push_commessa, can_genera_ordine e i loro reason e reason_key: PREVENTIVO_STATO_CHIUSO nella fase CHIUSO, PREVENTIVO_NON_ACCETTATO fuori dallo stato di accettazione, altrimenti PREVENTIVO_NESSUNA_RIGA_COMMESSA o PREVENTIVO_NESSUNA_RIGA_ORDINE. Cosa si modifica: can_edit_testata e non_editable_fields dal montaggio del lock di testata (script.fn_doc_testata_in_stato), can_edit_righe e can_edit_indirizzi dal lock delle righe e dei satelliti (script.fn_doc_riga_modificabile), lo stesso che il trigger fa rispettare. pdf {mode, allow_allegati} dal vocabolario. stato_info_key: la nota dello stato dal suo meta (proprieta'' nessuna_azione_key), sempre presente, null quando lo stato non la dichiara. stato_codice: il codice_interno dello stato corrente. Le reason_key sono chiavi i18n del frontend.';
