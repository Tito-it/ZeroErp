# ------------------------------------------------------------
# script.fn_is_super_admin_account: un'identita' tecnica non e' mai
# SUPER_ADMIN (S63, D-G2-3 di Tid, 2026-11-26).
#
#   I guard del 20261125-64 e -65 impediscono di legare il profilo a
#   un'identita' tecnica; questa funzione, che decide il bypass dei permessi
#   (dentro script.fn_is_super_admin) e l'obbligo del secondo fattore, non
#   esclude `tecnica`. Difesa in profondita': un binding scritto prima dei
#   guard, o da una strada che li salta (il migrate), non da' comunque il
#   bypass a un processo.
#
#   LANGUAGE sql a stringa, come il 20261007-03: corpo vivo con la riga
#   `AND NOT id.tecnica`; firma ri-ancorata dal 20261007-03 (il vivo scioglie il
#   %TYPE). COMMENT riscritto al presente (§5d).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261125-66-update-fn-is-super-admin-account-esclude-tecnica-mctit.yaml

  - changeSet:
      id: 20261125-66-update-fn-is-super-admin-account-esclude-tecnica
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_is_super_admin_account: esclude le identita' tecniche.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('script.fn_is_super_admin_account(integer)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_is_super_admin_account(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE)
               RETURNS boolean  -- una risposta si/no: nessuna colonna dietro
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: la CREDENZIALE ha un binding SUPER_ADMIN attivo? Senza
                  --   il cancello della veste di script.fn_is_super_admin, che
                  --   chiede questa funzione nel suo ramo ELSE.
                  -- Il SUPER_ADMIN si lega solo a un'identita' OPERATORE di una
                  -- PERSONA (binding per identita', privilegio personale): mai
                  -- a un'identita' tecnica, che e' un processo.
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN config.profili_accesso_bindings pab
                          ON pab.identita_digitale_id = id.id
                        JOIN config.profili_accesso pa
                          ON pa.id = pab.profilo_accesso_id
                       WHERE id.auth_user_id      = p_auth_user_id
                         AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                         AND NOT id.tecnica
                         AND script.fn_veste_utilizzabile(id.id)
                         AND pab.attivo = true
                         AND pa.attivo  = true
                         AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_is_super_admin_account(anagrafiche.identita_digitali.auth_user_id%TYPE) IS
                  'La CREDENZIALE (django.auth_user.id) ha un binding SUPER_ADMIN attivo: identita'' OPERATORE di una persona (mai tecnica), utilizzabile oggi (script.fn_veste_utilizzabile), binding e profilo attivi. Senza il cancello della veste: e'' la seconda delle due domande di script.fn_is_super_admin, che la chiede nel suo ramo ELSE. La usa da sola script.fn_totp_obbligatorio: l''obbligo del secondo fattore vale su tutte le porte, anche dove il bypass dei permessi non si accende. Non e'' la domanda dell''anti-lockout (script.fn_check_almeno_un_super_admin_attivo), che conta tutti gli amministratori raggiungibili. LANGUAGE sql, STABLE, INVOKER, inlineabile.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: la versione precedente e' il 20261007-03
