                         AND lrc.validita           @> (SELECT script.fn_data_operativa())
                  ) INTO v_e_figlio_bundle;

                  -- ---- MOTIVO 1 — e' un componente di un bundle ------------------
                  -- Il bundle si vende come unita': si esclude il padre, mai il
