                          'reason',     'FIGLIO_DI_BUNDLE',
                          'reason_key', 'vendite.contratti.escludi_blocco.figlio_di_bundle',
                          'dettaglio',  jsonb_build_object(
                                            'documento',           p_documento,
                                            'documento_id',        p_documento_id,
                                            'articolo_id',         p_articolo_id,
                                            'listino_id',          v_listino_id,
                                            'listino_versione_id', v_listino_versione_id),
                          'valori',     jsonb_build_array(p_articolo_id::text));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_esclusione_articolo_documento(text, bigint, uuid) IS
                'Check pura (fn_check_*): i motivi per cui un articolo NON si puo'' escludere da un contratto o da un''offerta (p_documento = CONTRATTO | OFFERTA). Oggi un motivo: l''articolo e'' componente (articolo_figlio_id) di un bundle della versione operativa del listino del documento (vendite.fn_documento_listino_operativo) — il bundle si vende come unita'', si esclude il padre (E_CONTRATTO_ESCLUSIONE_FIGLIO_BUNDLE_VIETATA, reason FIGLIO_DI_BUNDLE). [] = ammesso; nessuna versione operativa = []. Consumatori: il guard script.trgfn_righe_guard_esclusione_figlio_bundle (solleva il primo motivo) e vendite.fn_documento_righe_preview (escludi_blocco_codice): pulsante ed errore non divergono. Prende il posto di script.fn_check_esclusione_articolo_contratto (ritirata nello stesso giro), che valeva per il solo contratto: fn_push_offerta_a_contratto copia le righe 1:1 e la regola deve valere ai due capi. Nasce il 2026-10-04, brief-db-righe-esclusione-solo-non-si-vende (R4, R5c).';
