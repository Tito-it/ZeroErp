# D-T5 — LO SBLOCCO DAL SERVER LASCIA TRACCIA: script.fn_totp_disabilita_device
#   Brief: brief-db-secondo-fattore-totp, §9.6 (decisione di Tid del 2026-09-29:
#   strada B).
#
# ── ⭐ COSA CAMBIA ───────────────────────────────────────────────────
#   Solo nel ramo della SESSIONE DEL MIGRATORE (D-T4), dopo la cancellazione
#   riuscita, il verbo scrive una riga in dbops.sessioni_utente: evento
#   TOTP_DISABILITATO (ammesso da 00_schema/dbops/20260929-25), la credenziale,
#   e nel dettaglio da dove (SERVER), chi (il ruolo di login: dentro una DEFINER
#   user_insert sarebbe il proprietario), l'utente applicativo se la sessione ne
#   dichiarava uno, e il motivo. Stessa istruzione: se la riga non si scrive,
#   la disattivazione si annulla — niente sblocco senza traccia.
#
# ── ⚠️ COSA NON CAMBIA ──────────────────────────────────────────────
#   I rami «utente stesso» e SUPER_ADMIN: li' la traccia e' del backend (D-T3),
#   che passa dall'applicazione. Firma, attori, codici d'errore identici.
#   Corpo dal vivo (= 20260929-22, applicato il 2026-09-29).
#
# SECURITY DEFINER del PROPRIETARIO (possiede anche dbops.sessioni_utente),
# search_path bloccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260929-26-update-fn-totp-disabilita-device-traccia-dal-server-mctit.yaml

  - changeSet:
      id: 20260929-26-update-fn-totp-disabilita-device-traccia-dal-server
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_totp_disabilita_device: nel ramo della sessione del migratore (sblocco dal server,
        D-T4) scrive l'evento TOTP_DISABILITATO in dbops.sessioni_utente (da dove, chi, perche'),
        nella stessa istruzione della cancellazione. Gli altri rami invariati (la traccia e' del
        backend, D-T3). Brief: brief-db-secondo-fattore-totp §9.6 (D-T5).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_totp_disabilita_device';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_totp_disabilita_device(
                  p_auth_user_id integer,
                  -- Esplicito: il motivo non si scrive in una colonna del device (D-T3);
                  -- dal server finisce nel dettaglio dell'evento (D-T5).
                  p_motivo       text
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: cancellare il device del secondo fattore di una credenziale:
              --   l'utente stesso, oppure un altro (migratore o SUPER_ADMIN) con
              --   un motivo. Dal server lascia la traccia nell'audit degli accessi.
              DECLARE
                  v_utente     integer;
                  v_device_id  config.auth_totp_device.id%TYPE;
                  -- Esplicito: un flag calcolato, non una colonna.
                  v_dal_server boolean := false;
              BEGIN
                  -- Prima riga: chi agisce. Se non e' la credenziale stessa deve
                  -- essere la sessione del migratore o un SUPER_ADMIN, con un motivo.
                  v_utente := NULLIF(current_setting('app.current_user_id', true), '')::integer;

                  IF v_utente IS DISTINCT FROM p_auth_user_id THEN
                      v_dal_server := dbops.fn_sessione_del_migratore();
                      IF NOT v_dal_server THEN
                          PERFORM script.fn_guard_super_admin(v_utente);
                      END IF;

                      IF p_motivo IS NULL OR btrim(p_motivo) = '' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'script.fn_totp_disabilita_device', 'E_TOTP_MOTIVO_OBBLIGATORIO',
                              jsonb_build_object('campo', 'motivo', 'auth_user_id', p_auth_user_id),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]);
                      END IF;
                  END IF;

                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_totp_disabilita_device', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_auth_user_id', 'valore', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_totp_disabilita_device',
                                         'credenziale assente o non valida']);
                  END IF;

                  DELETE FROM config.auth_totp_device d
                   WHERE d.auth_user_id = p_auth_user_id
                  RETURNING d.id INTO v_device_id;

                  IF v_device_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_totp_disabilita_device', 'E_TOTP_DEVICE_ASSENTE',
                          jsonb_build_object('auth_user_id', p_auth_user_id,
                                             'chi_agisce',   v_utente,
                                             'motivo',       btrim(p_motivo)),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- D-T5: dal server il backend non c'e', la traccia la scrive il
                  -- verbo. session_user e non user_insert: dentro una DEFINER
                  -- CURRENT_USER e' il proprietario.
                  IF v_dal_server THEN
                      INSERT INTO dbops.sessioni_utente (auth_user_id, evento, dettaglio)
                      VALUES (p_auth_user_id, 'TOTP_DISABILITATO',
                              jsonb_build_object('via',       'SERVER',
                                                 'sessione',  session_user,
                                                 'chi_agisce', v_utente,
                                                 'motivo',    btrim(p_motivo)));
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_totp_disabilita_device(integer, text) IS
                  'Disabilita il secondo fattore (TOTP) di una credenziale CANCELLANDO il device: segreto e codici spariscono (D-T3). Chi agisce: la credenziale stessa (motivo facoltativo); oppure un ALTRO, con motivo obbligatorio (E_TOTP_MOTIVO_OBBLIGATORIO): la sessione del migratore (dbops.fn_sessione_del_migratore: il caso senza via d''uscita, l''unico super admin senza telefono e codici; D-T4, lo sblocco si fa dal server, l''app non raggiunge questo ramo) o un SUPER_ADMIN (script.fn_guard_super_admin, se no E_PERMESSO_NEGATO). La traccia: dall''applicazione la scrive il backend (D-T3); DAL SERVER la scrive il verbo, nella stessa istruzione, in dbops.sessioni_utente (evento TOTP_DISABILITATO, dettaglio: via SERVER, sessione = ruolo di login, chi_agisce, motivo — D-T5, 2026-09-29). Device assente -> E_TOTP_DEVICE_ASSENTE. Chi ha l''obbligo torna al setup al prossimo accesso (middleware del backend). SECURITY DEFINER del PROPRIETARIO, search_path bloccato. Brief: brief-db-secondo-fattore-totp §3, §9.6.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' 20260929-22 (senza traccia dal server), nella
              -- doc auto-gen alla revisione prima di questa.
              SELECT 1;
