# script.fn_riattiva_utente_tecnico: il super admin a DB, e la revoca tolta
# col verbo (D-R7).
#
#   Anche lo spegnimento di un utente tecnico lascia il segno della revoca
#   (D-R2, D-R7): riattivarlo e' il gesto dell'amministratore che lo toglie.
#   Due cambi, nient'altro:
#   1. in testa, script.fn_guard_super_admin sull'utente della sessione. Fino a
#      oggi il permesso lo chiedeva solo il backend (la porta di amm_software,
#      solo super admin): la funzione e' eseguibile da zeroerp_app, e ora
#      toglie un segno che nessun'altra strada senza permesso puo' togliere;
#   2. prima di riaccendere l'identita', anagrafiche.fn_togli_revoca_veste su
#      ogni veste tecnica revocata di quell'utente. La sede unica di «togliere il
#      segno» resta quel verbo (regola del 2): qui non si scrive revocata_at.
#      Senza, il guard del 20261125-52 rifiuterebbe l'accensione con
#      E_VESTE_REVOCATA.
#
#   ⚠️ Resta INVOKER: l'UPDATE di attivo lo fa ancora l'app. Al passo 3c
#   (l'app perde la scrittura di attivo) diventa SECURITY DEFINER, insieme a
#   anagrafiche.fn_accendi_veste.
#
#   Corpo = il vivo (pg_get_functiondef su zeroerp_ruoli, 2026-11-25, uguale al
#   20261104-37), con i due inserti; firma ri-ancorata dal 20261104-37 (i %TYPE
#   che il vivo scioglie). Firma invariata: CREATE OR REPLACE, GRANT invariati.
#   Il COMMENT si riscrive al presente (linee-guida-sql §5d): quello di prima
#   portava brief e marcatori di revisione.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261125-56-update-fn-riattiva-utente-tecnico-revoca-mctit.yaml

  - changeSet:
      id: 20261125-56-update-fn-riattiva-utente-tecnico-revoca
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_riattiva_utente_tecnico: chiede il super admin a DB e toglie il segno della revoca
        dalle vesti tecniche con anagrafiche.fn_togli_revoca_veste prima di riaccendere.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('anagrafiche.fn_togli_revoca_veste(bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_riattiva_utente_tecnico(
                  p_processo_codice  dbops.processi.codice%TYPE,
                  p_emittente_codice anagrafiche.emittenti_fiscali.codice%TYPE
              )
               RETURNS integer   -- ⚠️ niente %TYPE su django.*
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_username     text;
                  v_auth_user_id integer;   -- ⚠️ niente %TYPE su django.*
                  v_processo     dbops.processi%ROWTYPE;
                  v_emittente    anagrafiche.emittenti_fiscali%ROWTYPE;
                  v_emit_perim   anagrafiche.emittenti_fiscali.id%TYPE;
                  v_utente       anagrafiche.identita_digitali.revocata_da_user_id%TYPE;
                  v_veste_id     anagrafiche.identita_digitali.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Riaccendere un utente tecnico che ESISTE ed e' spento.
                  --   ⛔ Non crea niente: se manca un pezzo, la coppia non e'
                  --   «da riattivare», e' rotta — e va guardata da una persona.
                  --
                  -- ⭐ Perche' esiste: lo username degli utenti tecnici e'
                  --   deterministico (processo@emittente) e il suo UNIQUE non
                  --   ha condizioni. Disattivare il legame — la via che il
                  --   brief documenta per sostituire l'utente di un processo —
                  --   non libera lo username, quindi la fabbrica non puo'
                  --   rifarlo. Senza questo verbo quella strada e' chiusa.
                  -- =========================================================

                  -- Guard 0: e' il gesto dell'amministratore (toglie anche la
                  -- revoca): solo SUPER_ADMIN, dalla sessione.
                  v_utente := script.fn_utente_di_sessione('script.fn_riattiva_utente_tecnico');
                  PERFORM script.fn_guard_super_admin(v_utente);

                  -- Guard 1: il processo deve esistere. «Non c'e'» e «non e'
                  -- eleggibile» sono due cose diverse (DB-8).
                  SELECT * INTO v_processo
                    FROM dbops.processi
                   WHERE codice = p_processo_codice;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_riattiva_utente_tecnico',
                          'E_PROCESSO_NON_TROVATO',
                          jsonb_build_object('processo_codice', p_processo_codice),
                          NULL::uuid, p_processo_codice);
                  END IF;

                  SELECT * INTO v_emittente
                    FROM anagrafiche.emittenti_fiscali
                   WHERE codice = script.fn_codice_normalizzato(p_emittente_codice);

                  IF NOT FOUND OR NOT v_emittente.attivo THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_riattiva_utente_tecnico',
                          'E_UTENTE_TECNICO_EMITTENTE_NON_VALIDO',
                          jsonb_build_object('emittente_codice', p_emittente_codice),
                          NULL::uuid, p_emittente_codice);
                  END IF;

                  -- Guard 2: c'e' qualcosa da riattivare?
                  -- Col codice SALVATO dell'emittente, come lo compone la fabbrica
                  -- (rev 2026-11-04).
                  v_username := p_processo_codice || '@' || v_emittente.codice;

                  SELECT au.id INTO v_auth_user_id
                    FROM django.auth_user au
                   WHERE au.username = v_username;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_riattiva_utente_tecnico',
                          'E_UTENTE_TECNICO_NON_TROVATO',
                          jsonb_build_object('processo_codice',  p_processo_codice,
                                             'emittente_codice', p_emittente_codice,
                                             'username',         v_username),
                          NULL::uuid, p_processo_codice, p_emittente_codice);
                  END IF;

                  -- ⛔ Guard 3: IL PERIMETRO NON SI SPOSTA.
                  --   config.user_emittenti_fiscali e' 1-a-1 e l'emittente e'
                  --   immutabile. Se quell'utente aveva un'altra azienda,
                  --   riaccenderlo lo farebbe lavorare per l'azienda sbagliata:
                  --   il guasto silenzioso che questo cantiere esiste per
                  --   impedire. Meglio fermarsi e farlo guardare.
                  SELECT uef.emittente_fiscale_id INTO v_emit_perim
                    FROM config.user_emittenti_fiscali uef
                   WHERE uef.auth_user_id = v_auth_user_id;

                  IF v_emit_perim IS DISTINCT FROM v_emittente.id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_riattiva_utente_tecnico',
                          'E_UTENTE_TECNICO_NON_TROVATO',
                          jsonb_build_object(
                              'detail', 'utente presente ma con perimetro diverso o assente',
                              'username',              v_username,
                              'emittente_atteso',      v_emittente.id,
                              'emittente_del_perimetro', v_emit_perim),
                          NULL::uuid, p_processo_codice, p_emittente_codice);
                  END IF;

                  -- La revoca si toglie col suo verbo, prima di riaccendere:
                  -- con il segno il guard della tabella rifiuta l'accensione.
                  FOR v_veste_id IN
                      SELECT idg.id
                        FROM anagrafiche.identita_digitali idg
                       WHERE idg.auth_user_id = v_auth_user_id
                         AND idg.tecnica
                         AND idg.revocata_at IS NOT NULL
                       ORDER BY idg.id
                  LOOP
                      PERFORM anagrafiche.fn_togli_revoca_veste(v_veste_id);
                  END LOOP;

                  -- ⭐ I TRE LIVELLI, e si riaccendono INSIEME: spegnerne uno
                  --   solo basta a fermare l'utente, quindi riaccenderne uno
                  --   solo lo lascerebbe inerte in un modo che non si vede.
                  UPDATE django.auth_user
                     SET is_active = true
                   WHERE id = v_auth_user_id
                     AND is_active IS DISTINCT FROM true;

                  UPDATE anagrafiche.identita_digitali
                     SET attivo = true
                   WHERE auth_user_id = v_auth_user_id
                     AND tecnica
                     AND attivo IS DISTINCT FROM true;

                  UPDATE dbops.processi_identita
                     SET attivo = true
                   WHERE auth_user_id = v_auth_user_id
                     AND processo_id = v_processo.id
                     AND attivo IS DISTINCT FROM true;

                  RETURN v_auth_user_id;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_riattiva_utente_tecnico(
                  dbops.processi.codice%TYPE,
                  anagrafiche.emittenti_fiscali.codice%TYPE) IS
                  'Riaccende un utente tecnico che ESISTE ed e'' spento, per la coppia (processo, emittente): il legame in dbops.processi_identita, l''identita'' in anagrafiche.identita_digitali e l''utente in django.auth_user. Ritorna l''auth_user_id. E'' un gesto dell''amministratore: chiede SUPER_ADMIN all''utente della sessione (script.fn_guard_super_admin, E_PERMESSO_NEGATO) e toglie il segno della revoca dalle vesti tecniche con anagrafiche.fn_togli_revoca_veste prima di riaccenderle. Esiste perche'' lo username degli utenti tecnici e'' deterministico (processo@emittente) e il suo UNIQUE non ha condizioni: disattivare il legame non libera lo username, quindi la fabbrica non puo'' rifare l''utente. Non ricostruisce niente: non crea soggetti, non tocca il perimetro, non assegna profili; se manca un pezzo la coppia e'' rotta (E_UTENTE_TECNICO_NON_TROVATO). Il perimetro non si sposta: se l''utente aveva un''altra azienda si ferma invece di riaccenderlo. L''emittente si cerca con script.fn_codice_normalizzato, e lo username si compone col codice salvato dell''emittente, come in script.fn_crea_utente_tecnico, la sua compagna: quella crea cio'' che non c''e'', questa riaccende cio'' che c''e''.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: la versione precedente e' il 20261104-37
