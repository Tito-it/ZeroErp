# La riga di contesto del preambolo pgTAP COSTRUISCE il mondo quando il
#   database non ne ha uno.
#   Brief: migliorie-generali-da-test-valutazione.md, D7.
#
# IL PROBLEMA CHE CHIUDE. `script.fn_pgtap_set_contesto_operatore()` senza
#   argomento CERCA un operatore con un emittente in whitelist. Su un database
#   ricostruito dai changelog — la CI, un'installazione nuova — le anagrafiche
#   sono a zero: non lo trova, imposta `app.current_user_id` a NULL e lascia
#   che il file muoia venti righe piu' in la' («Nessun emittente fiscale
#   attivo», «p_billing_account_id obbligatorio»). L'intestazione della rev
#   20260805-27 diceva che «fallisce parlando»: il corpo non lo ha mai fatto.
#
# ⚠️ MISURATO IL 2026-09-20, sullo scratch `zeroerp_ci` (stesso metro della
#   CI), rieseguendo i 362 file di `baseline-rossi-ci.tsv` come `zeroerp_app`:
#   130 muoiono su «Nessun emittente fiscale attivo», 45 su un billing account
#   cercato e non trovato, 38 su un NULL incassato da un lookup — e' UNA causa,
#   il contesto vuoto, in tre forme. Sostituendo in copia la riga di contesto
#   con «costruisci azienda+operatore, poi contesto su quello»: 62 file
#   VERDI, 16 da fixture ad asserzione, e altri 53 fermi solo su un residuo
#   dello scratch. E' un fatto datato, non il motivo: il motivo e' la regola
#   della guida — «il mondo si costruisce, non si cerca» — che il blocco
#   documentato in `dbops.fn_pgtap_crea_emittente_operatore` chiedeva di
#   ricopiare in ogni file. 352 file hanno la stessa riga di contesto:
#   352 copie di sei righe sono il BB sbagliato; il BB e' questa funzione.
#
# ⭐ COSA CAMBIA, e cosa no.
#   - Con argomento: identico a prima (il chiamante ha gia' costruito il suo
#     mondo e sceglie l'operatore).
#   - Senza argomento, operatore trovato: identico a prima. Sul database di
#     sviluppo questa e' l'unica strada che si percorre: NIENTE cambia li'.
#   - Senza argomento, NESSUN operatore: si costruisce un'azienda con il suo
#     operatore (`dbops.fn_pgtap_crea_emittente_operatore`) e il contesto si
#     apre su quello. Ordine obbligato: prima il mondo, poi le GUC — con un
#     operatore gia' in sessione il legame BA -> emittente lo scriverebbe anche
#     il trigger z90 del billing account (guida, §«Il mondo si costruisce»).
#
# ⚠️ L'OPERATORE COSTRUITO E' UN UTENTE TECNICO — e' l'unico percorso di
#   produzione che lega un utente a un emittente (`script.fn_crea_utente_tecnico`).
#   Per la RLS e per i guard e' un operatore a tutti gli effetti; un test il
#   cui SOGGETTO e' l'operatore umano (flag tecnica, profili di accesso) deve
#   costruirsi il suo caso e passarlo come argomento, come gia' oggi.
#   Su quei file l'effetto e' che cadono in asserzione invece che in fixture:
#   piu' leggibile, non peggio.
#
# ℹ️ La fixture apre e richiude una finestra `SET CONSTRAINTS ALL DEFERRED`
#   (saga dell'utente tecnico): la riga di contesto del template sta PRIMA di
#   `SET CONSTRAINTS ALL IMMEDIATE`, quindi il file esce con i vincoli come li
#   ha sempre avuti.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260920-01-update-fn-pgtap-set-contesto-operatore-costruisce-se-vuoto-mctit.yaml

  - changeSet:
      id: 20260920-01-update-fn-pgtap-set-contesto-operatore-costruisce-se-vuoto
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        script.fn_pgtap_set_contesto_operatore(): senza argomento, se il
        database non ha nessun operatore con un emittente in whitelist (la CI,
        un'installazione nuova), costruisce azienda+operatore con
        dbops.fn_pgtap_crea_emittente_operatore() e apre il contesto su quello,
        invece di lasciare le GUC vuote e far morire il file a valle. Con
        argomento, o dove un operatore c'e', comportamento invariato.
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: user_emittenti_fiscali
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*)
                FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'dbops'
                 AND p.proname = 'fn_pgtap_crea_emittente_operatore'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_pgtap_set_contesto_operatore(
                  p_auth_user_id integer DEFAULT NULL
              )
              RETURNS integer
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: dare a una sessione pgTAP lo stesso contesto che il
              --   middleware multi-face auth da' a una richiesta applicativa,
              --   cosi' i test attraversano la RLS invece di saltarla.
              --   Brief: brief-db-pgtap-runner-rls-baseline §8.
              -- Ritorna: l'auth_user_id usato, cosi' il test puo' stamparlo in
              --   diagnostica quando qualcosa non torna.
              -- Uso, in testa al file di test:
              --   SELECT script.fn_pgtap_set_contesto_operatore();
              -- Rev 2026-09-20: senza argomento, se il database non ha nessun
              --   operatore (CI, installazione nuova) il mondo si COSTRUISCE
              --   invece di lasciare il contesto vuoto.
              DECLARE
                  v_user_id integer;
              BEGIN
                  IF p_auth_user_id IS NOT NULL THEN
                      -- Un test che ha bisogno di un operatore PRECISO (perche'
                      -- verifica proprio il perimetro di quell'utente) lo passa.
                      v_user_id := p_auth_user_id;
                  ELSE
                      -- ⚠️ SI SCEGLIE UN OPERATORE NORMALE, cioe' con il suo
                      -- emittente assegnato — e' la regola di dominio: un
                      -- operatore, un emittente; multiemittente e' solo il
                      -- super admin.
                      --
                      -- Provata anche l'alternativa: scegliere un operatore
                      -- SENZA assegnazione, che script.fn_check_user_emittente_scope
                      -- tratta come «nessuna restrizione». Sembrava la mossa
                      -- furba e MISURATA E' PEGGIO — 99 file rossi contro 88,
                      -- 55 peggioramenti contro 51. Ed e' anche meno fedele:
                      -- un operatore senza emittente non e' un operatore
                      -- permissivo, e' una configurazione incompleta.
                      --
                      -- Si escludono i super admin: per loro la funzione esce
                      -- subito con true e il percorso operatore non viene
                      -- attraversato affatto, cioe' si tornerebbe a non provare
                      -- la RLS come fa oggi l'owner.
                      SELECT uef.auth_user_id
                        INTO v_user_id
                        FROM config.user_emittenti_fiscali uef
                       WHERE script.fn_has_identita_attiva(
                                 uef.auth_user_id, 'OPERATORE'::config.ruolo_applicativo)
                         AND NOT script.fn_is_super_admin(uef.auth_user_id)
                       -- Ordine stabile: un contesto che cambia da solo
                       -- produrrebbe test che passano a giorni alterni.
                       ORDER BY uef.auth_user_id
                       LIMIT 1;

                      -- ⭐ Nessun operatore: il database e' ricostruito dai
                      --   changelog (CI, installazione nuova) e le anagrafiche
                      --   sono a zero. Un contesto vuoto non e' un errore
                      --   «parlante»: e' un file che muore venti righe dopo su
                      --   «Nessun emittente fiscale attivo». Il mondo si
                      --   costruisce, non si cerca — e si costruisce PRIMA di
                      --   aprire il contesto (guida pgTAP, §«Il mondo si
                      --   costruisce»). L'operatore e' un utente tecnico, cioe'
                      --   l'unico percorso di produzione che lega un utente a
                      --   un emittente: per RLS e guard e' un operatore.
                      --   Sul database di sviluppo questo ramo non si percorre.
                      IF v_user_id IS NULL THEN
                          SELECT ceo.auth_user_id
                            INTO v_user_id
                            FROM dbops.fn_pgtap_crea_emittente_operatore() ceo;
                      END IF;
                  END IF;

                  -- Le due GUC che le policy leggono davvero. Verificato sui 175
                  -- test di vendite: `app.current_identita_id`, pure citata dalle
                  -- policy, non serve a nessuno di essi.
                  -- Terzo argomento false = vale per la SESSIONE: i file pgTAP
                  -- fanno BEGIN/ROLLBACK e un contesto transazionale sparirebbe
                  -- al primo rollback.
                  PERFORM set_config('app.ruolo_applicativo', 'OPERATORE', false);
                  PERFORM set_config('app.current_user_id', v_user_id::text, false);

                  RETURN v_user_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_pgtap_set_contesto_operatore(p_auth_user_id integer)
              IS 'Imposta nella sessione le GUC che le policy RLS leggono (app.ruolo_applicativo, app.current_user_id), scegliendo da se'' un operatore con almeno un emittente fiscale in whitelist — o quello passato come argomento. Dal 2026-09-20, se nessun operatore esiste (database ricostruito dai changelog: CI, installazione nuova) costruisce azienda+operatore con dbops.fn_pgtap_crea_emittente_operatore() e apre il contesto su quello, invece di lasciare le GUC vuote e far morire il file a valle; con argomento o dove un operatore c''e'' il comportamento e'' invariato. Serve ai test pgTAP per girare come l''applicazione invece che come owner: con FORCE ROW LEVEL SECURITY disattivo l''owner salta la RLS, quindi una suite lanciata da lui non esercita nessuna policy. Ritorna l''auth_user_id usato. Brief: brief-db-pgtap-runner-rls-baseline §8; migliorie-generali-da-test-valutazione D7.';
