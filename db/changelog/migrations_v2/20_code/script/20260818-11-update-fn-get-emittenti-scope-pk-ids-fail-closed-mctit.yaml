# Passo 2 (P-2a) del cantiere «perimetro emittente»: fail-closed nella
# catena canonica dello scope.
#
# ⛔ PREREQUISITO GIA' SODDISFATTO: DL-A. Prima di questo changeSet ogni
#    operatore con identita' OPERATORE attiva e non super admin DEVE avere la
#    sua riga in config.user_emittenti_fiscali — altrimenti da qui in poi non
#    vede piu' NULLA, e non e' un guard che si annuncia: e' una schermata
#    vuota senza spiegazione. Misurato e sanato il 2026-08-18 (erano due).
#
# COSA CAMBIA, in una riga: un operatore SENZA riga passa da «vede TUTTI gli
# emittenti» a «non ne vede nessuno». Non e' un cambio di postura, e' allineare
# la lettura alla scrittura: fn_check_user_can_create_ba gia' oggi risponde
# `false` allo stesso utente. Le due letture non potevano essere entrambe
# intenzionali (brief §2.5).
#
# ⭐ E c'e' un precedente esatto nella stessa catena: fn_get_emittenti_scope_sr_ids
#    ha ricevuto la stessa correzione il 2026-08-04 («mappatura a vuoto -> '{}'
#    e non NULL, fail-closed»). Qui era rimasta indietro.
#
# I due adapter fn_scope_ef_whitelist_via_* NON si toccano: ereditano, perche'
# trattano gia' cardinality = 0 come «nessun accesso».
#
# brief-db-perimetro-emittente-liste-e-gerarchia-ba.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260818-11-update-fn-get-emittenti-scope-pk-ids-fail-closed-mctit.yaml

  - changeSet:
      id: 20260818-11-update-fn-get-emittenti-scope-pk-ids-fail-closed
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        P-2a: nella funzione canonica dello scope, l'operatore non super admin
        SENZA riga in config.user_emittenti_fiscali passa da NULL (= tutti gli
        emittenti) a '{}' (= nessuno). Il ramo super admin non e' toccato.
        Stessa correzione gia' applicata a fn_get_emittenti_scope_sr_ids il
        2026-08-04. Prerequisito DL-A soddisfatto. Brief §2.5, P-2a.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_has_identita_attiva';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_emittenti_scope_pk_ids(
                  p_auth_user_id integer
              )
              RETURNS bigint[]
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_ids    bigint[];
                  v_attivo bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scope emittenti per i filtri su colonne PK.
                  --   Semantica: NULL = tutto, '{}' = nessuno, array = whitelist.
                  --
                  -- Struttura (rev 2026-08-04): USCITA UNICA. Prima si calcola
                  -- lo scope "di diritto" (super admin / whitelist), poi lo si
                  -- interseca con l'emittente attivo in un solo punto. I RETURN
                  -- anticipati di prima rendevano impossibile intersecare il
                  -- ramo super admin, che e' proprio quello da restringere.
                  --
                  -- Rev 2026-08-18 (P-2a): l'operatore SENZA riga non vede piu'
                  -- tutto. Vedi il ramo OPERATIVO.
                  -- =========================================================

                  v_attivo := NULLIF(
                                  current_setting('app.current_emittente_id', true),
                                  ''
                              )::bigint;

                  -- 1. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  --    '{}' e' gia' il valore piu' restrittivo: nessuna
                  --    intersezione potrebbe cambiarlo, esce subito.
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN '{}'::bigint[];
                  END IF;

                  -- 2. Scope di diritto.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      -- Nessuna restrizione: NULL = universo.
                      -- ⭐ E' l'UNICO attore legittimamente multi-emittente
                      --    (decisione Tid 2026-08-17). Non toccato da P-2a.
                      v_ids := NULL;
                  ELSE
                      -- OPERATIVO: whitelist PK reale. Lettura diretta da
                      -- user_emittenti_fiscali (la colonna e' gia' la PK).
                      --
                      -- ⚠️ Rev 2026-08-18 (P-2a): `coalesce(..., '{}')`.
                      --   PRIMA: array_agg su zero righe torna NULL, e NULL in
                      --   questa convenzione significa «nessuna restrizione» —
                      --   quindi un operatore senza riga vedeva TUTTI gli
                      --   emittenti, ed era indistinguibile da un super admin.
                      --   Non era uno stato del modello: era un errore di
                      --   configurazione che il sistema non rilevava.
                      --   ORA: '{}' = nessun accesso. La riga mancante e' un
                      --   difetto che si annuncia, invece di aprire in silenzio.
                      --   Stessa identica correzione fatta il 2026-08-04 su
                      --   fn_get_emittenti_scope_sr_ids, nello stesso punto
                      --   logico: qui era rimasta indietro (brief §2.5).
                      SELECT coalesce(array_agg(uef.emittente_fiscale_id), '{}'::bigint[])
                        INTO v_ids
                        FROM config.user_emittenti_fiscali uef
                       WHERE uef.auth_user_id = p_auth_user_id;
                  END IF;

                  -- 3. Intersezione con l'emittente attivo (uscita unica).
                  IF v_attivo IS NULL THEN
                      RETURN v_ids;                      -- nessuna impersonazione
                  END IF;

                  IF v_ids IS NULL THEN
                      RETURN ARRAY[v_attivo];            -- universo ∩ {X} = {X}
                  END IF;

                  IF v_attivo = ANY(v_ids) THEN
                      RETURN ARRAY[v_attivo];            -- {A,B} ∩ {X}, X presente
                  END IF;

                  RETURN '{}'::bigint[];                 -- X fuori scope: nessuno
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_emittenti_scope_pk_ids(integer) IS
                  'Scope emittenti per filtri su colonne PK (emittenti_fiscali.id). Semantica: '
                  'NULL=tutto, ''{}''=nessuno, array=whitelist. Identita OPERATORE mancante -> '
                  '[]; SUPER_ADMIN -> NULL; altrimenti whitelist PK. Post 2026-08-04: uscita '
                  'unica e intersezione con la GUC app.current_emittente_id (universo ∩ {X} = '
                  '{X}; whitelist senza X -> []). Post 2026-08-18 (P-2a): operatore non super '
                  'admin SENZA riga in config.user_emittenti_fiscali -> ''{}'' e non piu'' NULL. '
                  'Prima vedeva TUTTI gli emittenti ed era indistinguibile da un super admin: '
                  'non uno stato del modello, un errore di configurazione non rilevato. Allinea '
                  'la lettura alla scrittura, che gia'' rispondeva false '
                  '(fn_check_user_can_create_ba). Gemella di fn_get_emittenti_scope_sr_ids (che '
                  'e'' un wrapper su questa e aveva gia'' ricevuto la correzione). Vedi guida '
                  'soggetti-e-ruoli §5b e brief perimetro-emittente §2.5.';
      rollback:
        - sql:
            sql: |
              -- Nessun rollback automatico: tornare alla revisione precedente
              -- (20260804-14) riaprirebbe il fail-open sullo scope mancante.
              SELECT 1;
