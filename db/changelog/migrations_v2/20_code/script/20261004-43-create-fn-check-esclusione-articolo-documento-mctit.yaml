# ------------------------------------------------------------
# NASCE script.fn_check_esclusione_articolo_documento: i motivi per cui un
# articolo non si puo' escludere da un contratto O da un'offerta.
#
# -- PERCHE' ------------------------------------------------------------
#   La regola «il bundle si vende come unita': si esclude il padre, mai il
#   figlio» oggi vale solo sul contratto (script.fn_check_esclusione_
#   articolo_contratto, letta dal guard e dalla lista). L'offerta non la ha,
#   e fn_push_offerta_a_contratto copia le righe 1:1: un'offerta che esclude
#   un figlio di bundle passa, e il contratto nato dal suo push viene
#   rifiutato (brief-db-righe-esclusione-solo-non-si-vende, R5c).
#   ⭐ Non una seconda check per l'offerta: la stessa, con il documento come
#   selettore (regola del 2). La check del contratto esce nello stesso giro
#   (20261004-73), dopo che guard e lista sono passati a questa.
#
# -- COSA CAMBIA RISPETTO ALLA CHECK DEL CONTRATTO -----------------------
#   · la versione si chiede a vendite.fn_documento_listino_operativo
#     (20261004-42): stessa regola dei rami 2 e 3 di prima (versione fissata,
#     o in vigore oggi; nessun listino = nessun motivo);
#   · il motivo e' lo stesso, con lo stesso codice
#     (E_CONTRATTO_ESCLUSIONE_FIGLIO_BUNDLE_VIETATA: il nome dice
#     «contratto», il messaggio non nomina il documento, e R8 chiede di
#     riusare i codici in servizio), lo stesso reason e la stessa reason_key
#     (il frontend la traduce gia'); il dettaglio dice documento e id al
#     posto di contratto_id (nessun lettore della chiave: censito il
#     2026-10-04 su pgTAP, backend e frontend).
#
# -- TIPI ---------------------------------------------------------------
#   p_articolo_id ancorato a catalogo.articoli.id; le variabili alle loro
#   colonne. p_documento e p_documento_id nudi DICHIARATI: selettore senza
#   vocabolario e id polimorfo (vedi 20261004-42).
#
# Brief: brief-db-righe-esclusione-solo-non-si-vende (R4, R5c).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-43-create-fn-check-esclusione-articolo-documento-mctit.yaml

  - changeSet:
      id: 20261004-43-create-fn-check-esclusione-articolo-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_esclusione_articolo_documento(documento, id, articolo): i motivi per cui
        un articolo non si esclude da un contratto o da un'offerta (figlio di un bundle della
        versione operativa). Prende il posto di fn_check_esclusione_articolo_contratto. Brief:
        brief-db-righe-esclusione-solo-non-si-vende (R4, R5c).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "0"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_esclusione_articolo_documento';
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'vendite' AND p.proname = 'fn_documento_listino_operativo';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_check_esclusione_articolo_documento(
                  p_documento    text,
                  p_documento_id bigint,
                  p_articolo_id  catalogo.articoli.id%TYPE)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: elencare i motivi per cui un articolo NON si puo' escludere
              --   da un contratto o da un'offerta (p_documento = CONTRATTO |
              --   OFFERTA). Funzione PURA (fn_check_*): nessun raise di dominio,
              --   nessuna scrittura.
              -- Consumatori: il guard script.trgfn_righe_guard_esclusione_figlio_bundle
              --   (solleva il PRIMO motivo) e vendite.fn_documento_righe_preview
              --   (spegne «Escludi» sulla riga e dice perche').
              -- Ritorna: [] se ammesso; altrimenti array ORDINATO di
              --   {codice, reason, reason_key, dettaglio, valori}.
              -- ⚠️ p_documento e p_documento_id nudi DICHIARATI: un selettore
              --   senza colonna-vocabolario e un id polimorfo (due testate).
              DECLARE
                  v_motivi              jsonb := '[]'::jsonb;
                  v_listino_id          vendite.listini.id%TYPE;
                  v_listino_versione_id vendite.listini_versioni.id%TYPE;
                  v_e_figlio_bundle     boolean := false;
              BEGIN
                  SELECT lo.listino_id, lo.listino_versione_id
                    INTO v_listino_id, v_listino_versione_id
                    FROM vendite.fn_documento_listino_operativo(p_documento, p_documento_id) lo;

                  -- Nessuna versione operativa (nessun listino, documento che non
                  -- c'e' o non si vede): nessun bundle da cui escludere. Chi
                  -- scrive passa comunque dalla policy e dalle FK.
                  IF v_listino_versione_id IS NULL THEN
                      RETURN v_motivi;
                  END IF;

                  SELECT EXISTS (
                      SELECT 1
                        FROM vendite.listini_righe_componenti lrc
                       WHERE lrc.listino_versione_id = v_listino_versione_id
                         AND lrc.articolo_figlio_id  = p_articolo_id
                         AND lrc.attivo              = TRUE
                         AND lrc.validita           @> CURRENT_DATE
                  ) INTO v_e_figlio_bundle;

                  -- ---- MOTIVO 1 — e' un componente di un bundle ------------------
                  -- Il bundle si vende come unita': si esclude il padre, mai il
                  -- singolo figlio. `valori` = l'articolo, il VARIADIC del messaggio.
                  IF v_e_figlio_bundle THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_CONTRATTO_ESCLUSIONE_FIGLIO_BUNDLE_VIETATA',
                          'reason',     'FIGLIO_DI_BUNDLE',
                          'reason_key', 'vendite.contratti.escludi_blocco.figlio_di_bundle',
                          'dettaglio',  jsonb_build_object(
                                            'documento',           p_documento,
                                            'documento_id',        p_documento_id,
                                            'articolo_id',         p_articolo_id,
                                            'listino_id',          v_listino_id,
                                            'listino_versione_id', v_listino_versione_id),
                          'valori',     jsonb_build_array(p_articolo_id::text));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_esclusione_articolo_documento(text, bigint, catalogo.articoli.id%TYPE)
              IS 'Check pura (fn_check_*): i motivi per cui un articolo NON si puo'' escludere da un contratto o da un''offerta (p_documento = CONTRATTO | OFFERTA). Oggi un motivo: l''articolo e'' componente (articolo_figlio_id) di un bundle della versione operativa del listino del documento (vendite.fn_documento_listino_operativo) — il bundle si vende come unita'', si esclude il padre (E_CONTRATTO_ESCLUSIONE_FIGLIO_BUNDLE_VIETATA, reason FIGLIO_DI_BUNDLE). [] = ammesso; nessuna versione operativa = []. Consumatori: il guard script.trgfn_righe_guard_esclusione_figlio_bundle (solleva il primo motivo) e vendite.fn_documento_righe_preview (escludi_blocco_codice): pulsante ed errore non divergono. Prende il posto di script.fn_check_esclusione_articolo_contratto (ritirata nello stesso giro), che valeva per il solo contratto: fn_push_offerta_a_contratto copia le righe 1:1 e la regola deve valere ai due capi. Nasce il 2026-10-04, brief-db-righe-esclusione-solo-non-si-vende (R4, R5c).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_esclusione_articolo_documento(text, bigint, catalogo.articoli.id%TYPE);
