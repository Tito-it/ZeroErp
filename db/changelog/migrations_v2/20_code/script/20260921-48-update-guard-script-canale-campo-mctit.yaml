# brief-be-presidio-ui-action-e-canale-campi §4 — SANATURA DEL CANALE `campo`
# nei guard di `script` (la strada A del §4-bis, codice per codice).
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   Questi codici promettono a catalogo `ui_action = highlight_form_fields`
#   («evidenzia il campo del form»), ma il campo lo accende un ALTRO canale:
#   la COLUMN che script.fn_log_and_raise_error legge dal context — chiave
#   `campo`, ripiego `parametro`. Qui il context non la portava: il nome
#   della colonna c'era, ma come CHIAVE (`'quantita', NEW.quantita`), nel
#   posto che l'helper non legge (dbops.vw_punti_canale_campo:
#   CHIAVE_NON_LETTA / NESSUNO). A video: un toast e nessun campo rosso.
#   La promessa era vuota, e nessun test lo vedeva.
#
# ── ⭐ LA CORREZIONE: una coppia in piu', NIENTE ALTRO ─────────────
#   `'campo', '<colonna>'` come prima coppia del jsonb_build_object della
#   chiamata che nomina il codice. Firma, guard, messaggio, VARIADIC,
#   tx_id: intatti. Il nome e' quello dell'INPUT che l'operatore ha davanti
#   (regola di api.md §Envelope: un id dall'URL o un parametro di firma NON
#   lo e' — quelli restano senza campo e sono la strada B, l'override esce
#   dal lato BE).
#
# ── I CODICI, E IL CAMPO SCELTO (strada A) ──────────────────────────
#   script.trgfn_qta_from_operativa e' il guard GENERICO delle righe con
#   quantita' operativa (montato su piu' tabelle):
#   E_QTA_MISSING              -> qta_operativa (mancante)
#   E_QTA_OPERATIVA_NON_INTERA -> qta_operativa (l'UoM pretende interi)
#   E_QTA_OPER_STEP_INVALIDO   -> qta_operativa (non multiplo dello step)
#   E_UOM_MISSING              -> uom_operativa_id (mancante)
#   ⚠️ Il VARIADIC di E_QTA_MISSING passa gia' 'column', 'qta_operativa'
#     come VALORI del messaggio: quello e' testo per la persona, non il
#     canale. Resta com'e'.
#
# ── ORIGINE DEL CORPO, E IL CANCELLO SUL CORPO STANTIO ─────────────
#   Corpo VIVO (pg_get_functiondef, 21-09) per ogni funzione; il diff e' la
#   sola inserzione (verificato per riga dal generatore). La preCondition
#   ancora l'md5 di prosrc a quello letto: se qualcun altro tocca la stessa
#   funzione prima dell'apply, il migrate si FERMA invece di disfargli il
#   lavoro in silenzio (memoria: due changeSet dello stesso giorno sulla
#   stessa funzione, 2026-09-09). dbdev e zeroerp_ci portano lo stesso md5
#   (verificato 21-09), quindi la CI da zero passa.
#   Il ripristino torna al corpo vivo di prima.
#
# Presidio: db/pgtap/dbops/test-punti-canale-campo-v1.sql (t.1: i codici di
#   questa lista non sono piu' CHIAVE_NON_LETTA/NESSUNO) + i pgTAP dei guard
#   (invariati: il context in piu' non cambia nessun throws_ok).
# Dipendenze: nessuna (la vista -42 li LEGGE, non serve all'apply).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260921-48-update-guard-script-canale-campo-mctit.yaml

  - changeSet:
      id: 20260921-48-update-guard-script-canale-campo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Canale campo nei guard di script:
        script.trgfn_qta_from_operativa — 'campo', '<colonna>' nel
        context delle chiamate che nominano E_QTA_MISSING,
        E_QTA_OPERATIVA_NON_INTERA, E_QTA_OPER_STEP_INVALIDO,
        E_UOM_MISSING. Solo la coppia in piu'; corpo vivo, md5 ancorato
        in preCondition.
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            script: il corpo di una funzione da sanare non e' quello letto il
            21-09 (md5 diverso): qualcuno l'ha toccata dopo. Rileggere il
            vivo e rigenerare questo changeSet, non applicarlo.
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'trgfn_qta_from_operativa'
                     AND md5(p.prosrc) = '13e8fbc15da259f3805f7d667965724c'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_qta_from_operativa()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- Parametri
                v_fill_factor_to_base boolean := false;
                v_fonte_col           text    := NULL;
                v_fonte_val           text    := NULL;

                -- Mapping/policy
                v_factor_map   numeric;
                v_qty_step     numeric;
                v_max_dec      int;
                v_forbid_frac  boolean;

                -- Fattore effettivo usato per i calcoli (rispetta snapshot se presente)
                v_factor_used  numeric := 1;

                BEGIN

                -- ------------------------------------------------------------
                -- script.trgfn_qta_from_operativa()
                -- Sorgente unica: UoM/quantità OPERATIVA.
                -- Su INSERT: calcola sempre quantita da qta_operativa.
                -- Su UPDATE: short-circuit se nessun input operativo è cambiato.
                --
                -- TG_ARGV (opzionali):
                --   [0] fill_factor_to_base :: boolean  (default FALSE)
                --       Se TRUE e NEW.factor_to_base è NULL, salva lo snapshot del fattore usato.
                --   [1] fonte_nullability_col :: text   (default NULL)
                --       Nome colonna che governa la nullabilita' di qta_operativa.
                --       Se valorizzato e qta_operativa IS NULL: legge il valore di quella colonna
                --       via to_jsonb(NEW). Se != 'FISSA' (e non NULL) -> RETURN NEW senza raise.
                --       Usare per tabelle con fonte_quantita_attesa (es. contratti_righe).
                --
                -- rev 2026-08-04 (bonifica riferimenti morti, F5) — tolti due rami morti
                --   e i due parametri che li governavano:
                --     · [1] fill_uom_id_base -> scriveva NEW.uom_id. Nessuna delle sei
                --       tabelle agganciate ha una colonna `uom_id`, e tutti e sei i
                --       trigger passavano 'false': il ramo non era raggiungibile, e se
                --       lo si fosse acceso avrebbe fatto fallire ogni riga.
                --     · [2] target_col = 'quantita_fissa' -> `quantita_fissa` non
                --       esiste in **nessuna** tabella del database, e tutti e sei i
                --       trigger passavano 'quantita'. Un parametro con un solo valore
                --       lecito e' una bugia nella firma.
                --   Gli argomenti scalano: fonte_nullability_col era [3], ora e' [1].
                --   Precedente: 20260804-29 (stesso ragionamento su p_scope).
                -- ------------------------------------------------------------

                --------------------------------------------------------------------
                -- short-circuit: solo su UPDATE dove nessun input operativo è cambiato.
                -- Su INSERT: calcola sempre (qta_operativa + uom → quantita).
                --------------------------------------------------------------------
                IF TG_OP = 'UPDATE'
                   AND NEW.qta_operativa    IS NOT DISTINCT FROM OLD.qta_operativa
                   AND NEW.uom_operativa_id IS NOT DISTINCT FROM OLD.uom_operativa_id
                   AND NEW.factor_to_base   IS NOT DISTINCT FROM OLD.factor_to_base THEN
                  RETURN NEW;
                END IF;

                -- 0) Parametri
                IF TG_NARGS >= 1 THEN
                  v_fill_factor_to_base := lower(coalesce(TG_ARGV[0],'')) IN ('1','t','true','y','yes');
                END IF;
                IF TG_NARGS >= 2 AND TG_ARGV[1] IS NOT NULL AND TG_ARGV[1] <> '' THEN
                  v_fonte_col := TG_ARGV[1];
                END IF;

                -- Verifica qta_operativa: NULL consentito se la fonte non e' 'FISSA'
                IF NEW.qta_operativa IS NULL THEN
                  IF v_fonte_col IS NOT NULL THEN
                    v_fonte_val := to_jsonb(NEW) ->> v_fonte_col;
                    IF v_fonte_val IS NOT NULL AND v_fonte_val <> 'FISSA' THEN
                      RETURN NEW;
                    END IF;
                  END IF;
                  PERFORM script.fn_log_and_raise_error(
                    'application',
                    'script.trgfn_qta_from_operativa',
                    'E_QTA_MISSING',
                    jsonb_build_object(
                      'campo', 'qta_operativa',
                      'schema', TG_TABLE_SCHEMA,
                      'table',  TG_TABLE_NAME,
                      'qualified_table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      'articolo_id', NEW.articolo_id,
                      'uom_operativa_id', NEW.uom_operativa_id
                    ),
                    NULL::uuid,
                    'table',  TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                    'column', 'qta_operativa'
                  );
                END IF;

                --------------------------------------------------------------------
                -- 1) UoM operativa: se manca, fallback a UoM base articolo
                --------------------------------------------------------------------
                IF NEW.uom_operativa_id IS NULL THEN
                  SELECT a.uom_id
                    INTO NEW.uom_operativa_id
                  FROM catalogo.articoli a
                  WHERE a.id = NEW.articolo_id;
                END IF;

                IF NEW.uom_operativa_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'application','script.trgfn_qta_from_operativa',
                    'E_UOM_MISSING',
                    jsonb_build_object('campo', 'uom_operativa_id', 'articolo_id', NEW.articolo_id),
                    NULL::uuid,
                    'articolo_id', COALESCE(NEW.articolo_id::text, 'NULL')
                  );
                END IF;

                --------------------------------------------------------------------
                -- 2) Mapping factor/policy
                --------------------------------------------------------------------
                SELECT aum.factor_to_base,
                      aum.qty_step,
                      COALESCE(aum.max_decimals,6),
                      aum.forbid_fraction
                  INTO v_factor_map, v_qty_step, v_max_dec, v_forbid_frac
                FROM catalogo.articoli_uom_operativa aum
                WHERE aum.articolo_id = NEW.articolo_id
                  AND aum.uom_id      = NEW.uom_operativa_id
                  AND aum.attivo      = TRUE
                  AND (aum.valido_dal IS NULL OR aum.valido_dal <= CURRENT_DATE)
                  AND (aum.valido_al  IS NULL OR aum.valido_al  >= CURRENT_DATE)
                LIMIT 1;

                v_factor_map := COALESCE(v_factor_map, 1);

                v_factor_used := COALESCE(NEW.factor_to_base, v_factor_map, 1);

                IF v_fill_factor_to_base THEN
                  IF NEW.factor_to_base IS NULL THEN
                    NEW.factor_to_base := v_factor_used;
                  END IF;
                END IF;

                --------------------------------------------------------------------
                -- 3) Policy su quantità operativa
                --------------------------------------------------------------------
                IF v_forbid_frac IS TRUE AND NEW.qta_operativa <> TRUNC(NEW.qta_operativa) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database','script.trgfn_qta_from_operativa',
                    'E_QTA_OPERATIVA_NON_INTERA',
                    jsonb_build_object(
                      'campo', 'qta_operativa',
                      'articolo_id', NEW.articolo_id,
                      'uom_operativa_id', NEW.uom_operativa_id,
                      'qta_operativa', NEW.qta_operativa
                    ),
                    NULL::uuid,
                    'articolo_id', NEW.articolo_id::text,
                    'uom_operativa_id', NEW.uom_operativa_id::text
                  );
                END IF;

                IF v_qty_step IS NOT NULL AND v_qty_step > 0 THEN
                  IF abs(NEW.qta_operativa / v_qty_step - ROUND(NEW.qta_operativa / v_qty_step)) > 1e-9 THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database','script.trgfn_qta_from_operativa',
                      'E_QTA_OPER_STEP_INVALIDO',
                      jsonb_build_object(
                        'campo', 'qta_operativa',
                        'articolo_id', NEW.articolo_id,
                        'uom_operativa_id', NEW.uom_operativa_id,
                        'qta_operativa', NEW.qta_operativa,
                        'qty_step', v_qty_step
                      ),
                      NULL::uuid,
                      'articolo_id',NEW.articolo_id::text,
                      'uom_operativa_id',NEW.uom_operativa_id::text
                    );
                  END IF;
                END IF;

                --------------------------------------------------------------------
                -- 4) Calcolo finale della quantita' base
                --------------------------------------------------------------------
                NEW.quantita := ROUND(NEW.qta_operativa * v_factor_used, 6);

                RETURN NEW;
              END;
              $function$
              ;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
