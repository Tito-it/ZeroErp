# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — lotto 3 (le note): lo smistatore del cliente shop
#   sul padre vendite.note parla i codici nuovi.
#   Brief: brief-db-grammatica-unica-documenti §14 (Tid, 2026-10-25: ok alle proposte, via).
#
#   Dopo il 20261025-54 la partizione degli ordini e' ORDINE_VENDITA. Corpo vivo (dbdev,
#   2026-10-25, ultima revisione 20261021-38): cambia solo il codice del ramo; il modo del
#   risolutore ('ordine_shop') resta (L3-6). Firma %TYPE dal padre nuovo, SECURITY INVOKER,
#   STABLE, COST 5000 come prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-64-update-fn-scope-note-shop-perimetro-codici-grammatica-mctit.yaml

  - changeSet:
      id: 20261025-64-update-fn-scope-note-shop-perimetro-codici-grammatica
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_scope_note_shop_perimetro: il ramo dell'ordine sul codice ORDINE_VENDITA.
        Grammatica unica, lotto 3.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_note_shop_perimetro(
                  p_perimetro   anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  p_target_tipo vendite.note.target_tipo%TYPE,
                  p_target_id   vendite.note.target_id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE SECURITY INVOKER COST 5000
              AS $function$
                  -- Scopo: la nota e' del cliente shop che guarda? Smista su target_tipo
                  --   per il PADRE partizionato vendite.note, veste SHOP_CUSTOMER: solo
                  --   gli ordini, e solo quelli nati dallo shop (modo ordine_shop).
                  -- Il perimetro lo passa la policy, come in
                  --   script.fn_scope_note_cliente_perimetro.
                  -- ⛔ L'ELSE false e' la riga che conta: lo shop non vede le note di
                  --   fatture, offerte, bolle.
                  SELECT CASE p_target_tipo
                      WHEN 'ORDINE_VENDITA' THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('ordine_shop', p_target_id))
                      ELSE false
                  END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_note_shop_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE) IS
              'Smistatore di scope per il PADRE partizionato vendite.note, veste SHOP_CUSTOMER: la nota e'' del cliente shop che guarda? Solo le note di ORDINE_VENDITA, e solo di ordini nati dallo shop: script.fn_resolve_controparte_sr_id modo ordine_shop, confrontato col perimetro che la policy calcola una volta per istruzione (script.fn_get_identita_sr_perimetro). ⛔ ELSE false. Rev 2026-10-21 (20261021-38, giro 4 di brief-db-perimetro-una-volta-famiglie-residue): prende il posto di fn_scope_note_shop, che calcolava il perimetro per riga. Rev 2026-10-25 (20261025-64, brief-db-grammatica-unica-documenti lotto 3): il ramo parla ORDINE_VENDITA.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Torna il corpo del 20261021-38, testo e COMMENT compresi (il codice corto).
              CREATE OR REPLACE FUNCTION script.fn_scope_note_shop_perimetro(
                  p_perimetro   anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  p_target_tipo vendite.note.target_tipo%TYPE,
                  p_target_id   vendite.note.target_id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE SECURITY INVOKER COST 5000
              AS $function$
                  -- Scopo: la nota e' del cliente shop che guarda? Smista su target_tipo
                  --   per il PADRE partizionato vendite.note, veste SHOP_CUSTOMER: solo
                  --   gli ordini, e solo quelli nati dallo shop (modo ordine_shop).
                  -- Il perimetro lo passa la policy, come in
                  --   script.fn_scope_note_cliente_perimetro.
                  -- ⛔ L'ELSE false e' la riga che conta: lo shop non vede le note di
                  --   fatture, offerte, bolle.
                  SELECT CASE p_target_tipo
                      WHEN 'ORDINE' THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('ordine_shop', p_target_id))
                      ELSE false
                  END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_note_shop_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE) IS
              'Smistatore di scope per il PADRE partizionato vendite.note, veste SHOP_CUSTOMER: la nota e'' del cliente shop che guarda? Solo le note di ORDINE, e solo di ordini nati dallo shop: script.fn_resolve_controparte_sr_id modo ordine_shop, confrontato col perimetro che la policy calcola una volta per istruzione (script.fn_get_identita_sr_perimetro). ⛔ ELSE false. Rev 2026-10-21 (20261021-38, giro 4 di brief-db-perimetro-una-volta-famiglie-residue): prende il posto di fn_scope_note_shop, che calcolava il perimetro per riga.';
