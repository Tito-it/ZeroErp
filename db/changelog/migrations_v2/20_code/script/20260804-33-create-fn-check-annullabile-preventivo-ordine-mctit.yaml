# Le vie d'uscita dell'operatore: quando un preventivo e un ordine si possono
#   annullare (brief-db-vie-uscita-operatore.md §3).
#
# PERCHE'. Il presidio test-transizioni-uscita-manuale-v1.sql ha trovato sei
#   stati da cui nessuna persona puo' muovere il documento. Su preventivo
#   (EMESSO, ACCETTATO) e ordine (CONFERMATO) le transizioni verso ANNULLATO
#   esistono, complete di etichetta e icona, ma erano SPENTE — e da nessuna
#   parte era scritto perche'. Decisione di Tid (2026-08-04): si riattivano,
#   ma con tutti i controlli che devono impedirle. Queste sono quei controlli.
#
# ⚠️ DUE CONVENZIONI DI CHIAVE, NELLA STESSA FUNZIONE. Il progetto lega i
#   documenti in due modi, e scambiarli produce join che non tornano niente
#   SENZA errore — cioe' un documento che risulta annullabile quando non lo e':
#     - colonne dirette (ordini.sorgente_uid, ddt.sorgente_uid): tipizzate
#       `uuid`, si legano all'`uid` del padre, MAI all'id;
#     - tabella polimorfa (commesse_sorgenti.sorgente_uid): `text`, secondo
#       config.sorgenti.key_selector — PREVENTIVO usa l'uid, ORDINE_VENDITA
#       usa l'id.
#   Quindi il preventivo si cerca per uid nella catena diretta e per uid::text
#   in commessa; l'ordine per uid nella catena diretta e per id::text in
#   commessa. E' la convenzione documentata, non un difetto da sanare.
#
# ⚠️ I tipi sorgente NON sono numeri scritti a mano: si risolvono per
#   codice_interno su config.sorgenti. Un id hardcodato qui diventerebbe una
#   bomba a orologeria al primo riordino del vocabolario.
#
# ⚠️ NON RIUSARE fn_preventivo_ha_residuo_ordine / _commessa /
#   fn_ordine_ha_residuo_evasione, benche' i nomi sembrino fatti apposta.
#   Rispondono a «resta ancora qualcosa da convertire?», che non e' la domanda
#   dell'annullamento: un documento convertito A META' ha residuo *e* ha gia' un
#   figlio a valle. Riusarle renderebbe annullabile proprio cio' che e' gia'
#   stato lavorato in parte.
#
# ℹ️ DUE DOCUMENTI IN UN SOLO changeSet perche' e' la stessa regola applicata
#   due volte — «non annullare cio' che ha gia' prodotto qualcosa a valle» — e
#   separarle inviterebbe a correggerne una e dimenticare l'altra.
#
# ℹ️ Contratto identico alle tre sorelle gia' in casa
#   (fn_check_commessa_chiudibile / _annullabile / _pronta_fatturazione):
#   jsonb, [] = lecito, altrimenti array di {codice, reason, reason_key,
#   dettaglio}. Consumatori: il guard di transizione (solleva il PRIMO motivo) e
#   fn_available_actions_* (espone enabled + reasons).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-33-create-fn-check-annullabile-preventivo-ordine-mctit.yaml

  - changeSet:
      id: 20260804-33-create-fn-check-annullabile-preventivo-ordine
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_check_preventivo_annullabile e fn_check_ordine_annullabile: funzioni
        pure che elencano i motivi per cui un documento non si puo' annullare
        (figli gia' generati a valle). Sede unica per guard e capability, come
        le sorelle della commessa.
      # ⚠️ NESSUNA preCondition sul CONTENUTO di config.sorgenti, e non e' una
      #   dimenticanza. Le righe PREVENTIVO e ORDINE_VENDITA arrivano dal seed
      #   80_data (20251002-21-upsert-config-sorgenti-table.yaml), fase che il
      #   master processa DOPO 20_code: su un database costruito da zero — cioe'
      #   la CI — qui il vocabolario e' ancora vuoto e una sqlCheck fallisce
      #   sempre («Expected 2 got 0»), fermando l'intera migrazione. Sul DB di
      #   sviluppo passa solo perche' quel seed e' gia' dentro da mesi: e' la
      #   trappola classica, verde in locale e rossa in CI. Provato il
      #   2026-08-04. La dipendenza dal vocabolario e' comunque solo di RUNTIME:
      #   le due funzioni risolvono l'id per codice_interno quando vengono
      #   chiamate, e per allora 80_data e' passata da un pezzo.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: commesse_sorgenti
            - tableExists:
                schemaName: config
                tableName: sorgenti
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_preventivo_annullabile(
                  p_preventivo_id vendite.preventivi.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono l'ANNULLAMENTO di un
              --   preventivo. Funzione PURA (fn_check_*): nessun raise di
              --   dominio, nessuna scrittura. Consumatori: il guard di
              --   transizione e script.fn_available_actions_preventivo.
              --   Brief: brief-db-vie-uscita-operatore §3.1.
              -- Ritorna: [] se annullabile; altrimenti array ordinato di
              --   {codice, reason, reason_key, dettaglio}.
              DECLARE
                v_motivi  jsonb := '[]'::jsonb;
                v_uid     vendite.preventivi.uid%TYPE;
                v_ordini  integer := 0;
                v_commesse integer := 0;
              BEGIN
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_preventivo_annullabile','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','preventivo_id','valore',p_preventivo_id),
                    NULL::uuid, 'preventivo_id obbligatorio (>0)');
                END IF;

                SELECT p.uid INTO v_uid
                  FROM vendite.preventivi p
                 WHERE p.id = p_preventivo_id;

                IF v_uid IS NULL THEN
                  RETURN v_motivi;   -- preventivo inesistente: decide il chiamante
                END IF;

                -- MOTIVO 1 — un ordine e' gia' nato da questo preventivo.
                -- Catena diretta: ordini.sorgente_uid e' uuid e punta all'uid.
                SELECT count(*)
                  INTO v_ordini
                  FROM vendite.ordini o
                 WHERE o.sorgente_uid = v_uid
                   AND o.sorgente_tipo_id = (SELECT s.id FROM config.sorgenti s
                                              WHERE s.codice_interno = 'PREVENTIVO');

                IF v_ordini > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_ORDINE_GIA_GENERATO',
                    'reason',     'ORDINE_GIA_GENERATO',
                    'reason_key', 'vendite.preventivi.azione_reason.ordine_gia_generato',
                    'dettaglio',  v_ordini);
                END IF;

                -- MOTIVO 2 — il preventivo e' gia' entrato in una commessa.
                -- Tabella polimorfa: la chiave e' testo, e per PREVENTIVO
                -- config.sorgenti.key_selector dice 'uid'.
                SELECT count(*)
                  INTO v_commesse
                  FROM vendite.commesse_sorgenti cs
                 WHERE cs.sorgente_uid = v_uid::text
                   AND cs.sorgente_tipo_id = (SELECT s.id FROM config.sorgenti s
                                               WHERE s.codice_interno = 'PREVENTIVO');

                IF v_commesse > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_GIA_IN_COMMESSA',
                    'reason',     'GIA_IN_COMMESSA',
                    'reason_key', 'vendite.preventivi.azione_reason.gia_in_commessa',
                    'dettaglio',  v_commesse);
                END IF;

                RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_preventivo_annullabile(bigint)
              IS 'Pure check: motivi che impediscono l''annullamento di un preventivo. [] = lecito. Blocca quando esiste gia'' un figlio a valle: un ordine generato (vendite.ordini.sorgente_uid = preventivi.uid) o una riga in vendite.commesse_sorgenti (chiave uid::text, per key_selector di config.sorgenti). Sede unica condivisa dal guard di transizione e da script.fn_available_actions_preventivo. Brief: brief-db-vie-uscita-operatore.';

              CREATE OR REPLACE FUNCTION script.fn_check_ordine_annullabile(
                  p_ordine_id vendite.ordini.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono l'ANNULLAMENTO di un
              --   ordine. Funzione PURA (fn_check_*). Consumatori: il guard di
              --   transizione e script.fn_available_actions_ordine.
              --   Brief: brief-db-vie-uscita-operatore §3.2.
              DECLARE
                v_motivi   jsonb := '[]'::jsonb;
                v_uid      vendite.ordini.uid%TYPE;
                v_ddt      integer := 0;
                v_commesse integer := 0;
              BEGIN
                IF p_ordine_id IS NULL OR p_ordine_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_ordine_annullabile','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','ordine_id','valore',p_ordine_id),
                    NULL::uuid, 'ordine_id obbligatorio (>0)');
                END IF;

                SELECT o.uid INTO v_uid
                  FROM vendite.ordini o
                 WHERE o.id = p_ordine_id;

                IF v_uid IS NULL THEN
                  RETURN v_motivi;   -- ordine inesistente: decide il chiamante
                END IF;

                -- MOTIVO 1 — merce gia' uscita: esiste un DDT figlio.
                -- Catena diretta: ddt.sorgente_uid e' uuid e punta all'uid.
                SELECT count(*)
                  INTO v_ddt
                  FROM vendite.ddt d
                 WHERE d.sorgente_uid = v_uid
                   AND d.sorgente_tipo_id = (SELECT s.id FROM config.sorgenti s
                                              WHERE s.codice_interno = 'ORDINE_VENDITA');

                IF v_ddt > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_ORD_ANNULLA_CON_DDT',
                    'reason',     'DDT_COLLEGATI',
                    'reason_key', 'vendite.ordini.azione_reason.ddt_collegati',
                    'dettaglio',  v_ddt);
                END IF;

                -- MOTIVO 2 — l'ordine e' gia' entrato in una commessa.
                -- Tabella polimorfa: per ORDINE_VENDITA key_selector dice 'id'.
                SELECT count(*)
                  INTO v_commesse
                  FROM vendite.commesse_sorgenti cs
                 WHERE cs.sorgente_uid = p_ordine_id::text
                   AND cs.sorgente_tipo_id = (SELECT s.id FROM config.sorgenti s
                                               WHERE s.codice_interno = 'ORDINE_VENDITA');

                IF v_commesse > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_ORD_ANNULLA_IN_COMMESSA',
                    'reason',     'GIA_IN_COMMESSA',
                    'reason_key', 'vendite.ordini.azione_reason.gia_in_commessa',
                    'dettaglio',  v_commesse);
                END IF;

                RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_ordine_annullabile(bigint)
              IS 'Pure check: motivi che impediscono l''annullamento di un ordine. [] = lecito. Blocca quando esiste gia'' un figlio a valle: un DDT (vendite.ddt.sorgente_uid = ordini.uid, chiave uuid) o una riga in vendite.commesse_sorgenti (chiave id::text, per key_selector di config.sorgenti — diversa da quella del preventivo, che usa l''uid). Sede unica condivisa dal guard di transizione e da script.fn_available_actions_ordine. Brief: brief-db-vie-uscita-operatore.';
