# P-1 — IL CAMBIO PASSWORD OBBLIGATORIO SI SCRIVE QUI: script.fn_imposta_deve_cambiare_password
#   Brief: brief-db-blocco-login-per-credenziale, sezione 3.4 (D-7)
#
# ── ⭐ PERCHE' UN VERBO E NON UN UPDATE DEL BACKEND ───────────────────
#   La riga nasce alla prima scrittura: scrivere e' un upsert, e l'upsert deve
#   sapere che l'assenza vale false. Se lo facesse il backend, la regola
#   dell'assenza vivrebbe in due livelli. E l'app su config.credenziali ha solo
#   SELECT (la porta): scrive questa funzione, SECURITY DEFINER del
#   PROPRIETARIO, non di un superuser.
#
# ── ⚠️ NESSUN GUARD DI PERMESSO — DICHIARATO ────────────────────────
#   La chiamano l'invito operatore (un admin), ma anche il cambio password, il
#   reset e l'attivazione, che girano come l'utente stesso o prima del login:
#   non c'e' un'azione unica da chiedere. Protegge da un backend che sbaglia la
#   forma della scrittura, non da un backend compromesso (limite §4.4 del brief
#   sul permesso nel verbo).
#
# ── ⚠️ L'ESISTENZA DELLA CREDENZIALE SI CONTROLLA QUI ───────────────
#   La FK verso django.auth_user in CI non esiste (90_end, MARK_RAN): senza
#   questo controllo lo stesso errore sarebbe un 23503 su dev e un'inserzione
#   orfana in CI. Il proprietario della funzione possiede anche django.auth_user
#   (verificato su dbdev e sullo scratch, 2026-09-25).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260925-08-create-fn-imposta-deve-cambiare-password-mctit.yaml

  - changeSet:
      id: 20260925-08-create-fn-imposta-deve-cambiare-password
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_imposta_deve_cambiare_password(p_auth_user_id, p_valore): scrive il cambio password
        obbligatorio della credenziale (D-7) con un upsert (la riga nasce alla prima scrittura).
        SECURITY DEFINER del proprietario, search_path bloccato: l'app su config.credenziali ha solo
        SELECT. Nessun guard di permesso, dichiarato. Credenziale inesistente ->
        E_CREDENZIALE_NON_TROVATA. Brief: brief-db-blocco-login-per-credenziale §3.4.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: config, tableName: credenziali }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_imposta_deve_cambiare_password(
                  p_auth_user_id integer,
                  p_valore       config.credenziali.deve_cambiare_password%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: impostare il cambio password obbligatorio della credenziale.
              --   Upsert: la riga nasce qui se non c'e'.
              BEGIN
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 OR p_valore IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_imposta_deve_cambiare_password', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id, 'p_valore', p_valore),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_imposta_deve_cambiare_password',
                                         'credenziale e valore obbligatori']);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM django.auth_user au WHERE au.id = p_auth_user_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_imposta_deve_cambiare_password', 'E_CREDENZIALE_NON_TROVATA',
                          jsonb_build_object('auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  INSERT INTO config.credenziali AS c (auth_user_id, deve_cambiare_password)
                  VALUES (p_auth_user_id, p_valore)
                  ON CONFLICT (auth_user_id) DO UPDATE
                     SET deve_cambiare_password = EXCLUDED.deve_cambiare_password
                   WHERE c.deve_cambiare_password IS DISTINCT FROM EXCLUDED.deve_cambiare_password;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_imposta_deve_cambiare_password(integer, boolean) IS
                  'Scrive il cambio password obbligatorio della CREDENZIALE (D-7): upsert su config.credenziali, dove la riga nasce alla prima scrittura. La chiamano invito operatore, cambio password, reset e attivazione (backend). SECURITY DEFINER del PROPRIETARIO, non di un superuser, search_path bloccato: l''app su config.credenziali ha solo SELECT. Nessun guard di permesso, dichiarato: i chiamanti girano come admin, come l''utente stesso o prima del login. Credenziale inesistente -> E_CREDENZIALE_NON_TROVATA (la FK verso django.auth_user in CI non esiste). Brief: brief-db-blocco-login-per-credenziale §3.4.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_imposta_deve_cambiare_password(integer, boolean);
