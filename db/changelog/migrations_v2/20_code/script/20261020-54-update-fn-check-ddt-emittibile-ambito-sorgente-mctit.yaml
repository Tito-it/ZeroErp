# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2d (G-6): la check di emissione della bolla: l'ambito DDT diventa DDT_VENDITA
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-6, §10.4.
#
#   L'ambito degli indirizzi e' il codice della sorgente (20261020-47): DDT -> DDT_VENDITA.
#   Nessun parametro da ancorare.
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. %TYPE in firma, DECLARE e RETURNS TABLE dove c'e' una colonna; nudi, col
#   motivo accanto, i valori che una colonna non ha (conteggi, jsonb di lavoro, array).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261020-54-update-fn-check-ddt-emittibile-ambito-sorgente-mctit.yaml

  - changeSet:
      id: 20261020-54-update-fn-check-ddt-emittibile-ambito-sorgente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_ddt_emittibile: l'ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della sorgente. Grammatica unica, 2d (G-6).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_ddt_emittibile(p_ddt vendite.ddt)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- rev 2026-10-20 (20261020-54, brief-db-grammatica-unica-documenti, 2d G-6):
              --   l'ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della
              --   sorgente.


              -- Scopo: elencare i motivi che impediscono l'emissione (EMESSO) di
              --   un DDT. Funzione PURA (fn_check_*): non solleva, non scrive.
              --   Consumatori: i 4 guard trigger di emissione (sollevano il
              --   proprio codice) e script.fn_available_actions_ddt (espone
              --   l'azione disabled + reason). Brief:
              --   brief-db-guard-righe-avanzamento-stato §1a-bis (Rev 2).
              --   rev 2026-09-24: il punto 5 (prezzo in attesa) passa al building
              --   block script.fn_check_prezzi_autorizzati — PENDING E REJECTED, solo
              --   componenti attivi (brief-db-preventivi-congelamento-pricing, D-6).
              -- Ritorna: [] se emittibile; altrimenti array ordinato di
              --   {codice, reason, reason_key, dettaglio}.
              DECLARE
                  v_motivi      jsonb := '[]'::jsonb;
                  v_fatturabile boolean;
                  v_richiede_cliente config.causali_trasporto.richiede_cliente%TYPE;
                  v_causale_codice   config.causali_trasporto.codice%TYPE;
                  v_riga_senza  vendite.ddt_righe.id%TYPE;
                  v_riga_no_iva vendite.ddt_righe.id%TYPE;
                  v_riga_no_iva_nr vendite.ddt_righe.riga_nr%TYPE;
                  v_presenti    integer[];
                  v_mancanti    text[];
              BEGIN
                  -- 1. STRUTTURA — zero righe attive = niente da trasportare (543).
                  --    Il "DDT di solo trasporto" resta legittimo: quello e' righe
                  --    SENZA PREZZO, non zero righe.
                  IF NOT EXISTS (
                      SELECT 1 FROM vendite.ddt_righe dr
                       WHERE dr.ddt_id = p_ddt.id
                         AND dr.attivo IS TRUE
                  ) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_DDT_EMISSIONE_SENZA_RIGHE',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  NULL);
                  END IF;

                  -- 2. INTENTO — la causale dichiara se la merce che viaggia e'
                  --    una vendita da fatturare o solo un trasporto (544, DL-28).
                  --    In bozza il NULL resta legittimo: il vincolo e' qui, non
                  --    sul salvataggio.
                  IF p_ddt.causale_trasporto_id IS NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_DDT_CAUSALE_OBBLIGATORIA',
                          'reason',     'CAUSALE_MANCANTE',
                          'reason_key', 'vendite.ddt.azione_reason.causale_mancante',
                          'dettaglio',  NULL);
                  ELSE
                      -- 2-bis. CONTROPARTE — rev 2026-10-09 (brief-db-esecutivi-ba-coppia,
                      --    D-2 e D-2-bis di Tid): una bolla che manda merce A UN CLIENTE
                      --    porta il suo billing account, cioe' il cliente a grana fine
                      --    (la fornitura). Lo dice la causale, per colonna di vocabolario
                      --    (config.causali_trasporto.richiede_cliente), non per codice:
                      --    si' vendita, omaggio, campionatura, conto visione; no
                      --    trasferimento, conto lavoro, riparazione, reso a fornitore.
                      -- ⚠️ Non e' un NOT NULL ne' un guard su INSERT: la causale, che
                      --    decide, in bozza puo' non esserci ancora. Come per la causale
                      --    (punto 2), il vincolo sta all'emissione.
                      -- ⚠️ Prima del punto 3: la capability legge il PRIMO motivo, e
                      --    una bolla senza cliente deve dire quello prima dei prezzi.
                      -- La causale si legge UNA volta: serve al 2-bis e al 3.
                      SELECT ct.fatturabile, ct.richiede_cliente, ct.codice
                        INTO v_fatturabile, v_richiede_cliente, v_causale_codice
                        FROM config.causali_trasporto ct
                       WHERE ct.id = p_ddt.causale_trasporto_id;

                      IF v_richiede_cliente AND p_ddt.billing_account_id IS NULL THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     'E_DDT_CLIENTE_OBBLIGATORIO',
                              'reason',     'CLIENTE_MANCANTE',
                              'reason_key', 'vendite.ddt.azione_reason.cliente_mancante',
                              'dettaglio',  jsonb_build_object('causale', v_causale_codice));
                      END IF;

                      -- 3. DATI RIGA — causale fatturabile => ogni riga attiva deve
                      --    avere prezzo RISOLVIBILE: proprio o ereditato dalla riga
                      --    d'ordine via fulfillment (545). Stessa COALESCE del
                      --    lister. NB: vw_ddt_righe_iva_base NON e' riusabile qui
                      --    (filtra prezzo_unitario IS NOT NULL, perderebbe proprio
                      --    le righe da esaminare).
                      IF COALESCE(v_fatturabile, false) THEN
                          SELECT dr.id INTO v_riga_senza
                            FROM vendite.ddt_righe dr
                            LEFT JOIN LATERAL (
                                SELECT or_r.prezzo_unitario
                                  FROM vendite.ordini_righe_fulfillment ful
                                  JOIN vendite.ordini_righe or_r ON or_r.id = ful.ordine_riga_id
                                 WHERE ful.ddt_riga_id = dr.id
                                 ORDER BY ful.id LIMIT 1
                            ) src ON TRUE
                           WHERE dr.ddt_id = p_ddt.id
                             AND dr.attivo IS TRUE
                             AND COALESCE(dr.prezzo_unitario, src.prezzo_unitario) IS NULL
                           ORDER BY dr.id
                           LIMIT 1;

                          IF v_riga_senza IS NOT NULL THEN
                              v_motivi := v_motivi || jsonb_build_object(
                                  'codice',     'E_DDT_PREZZO_NON_RISOLVIBILE',
                                  'reason',     'PREZZO_NON_RISOLVIBILE',
                                  'reason_key', 'vendite.ddt.azione_reason.prezzo_non_risolvibile',
                                  'dettaglio',  jsonb_build_object('riga_id', v_riga_senza));
                          END IF;
                      END IF;
                  END IF;

                  -- 3-bis. VALORE DELLA RIGA — una riga che porta un PREZZO porta
                  --   anche l'ALIQUOTA. Decisione di Tid del 2026-08-28 (R4-ter del
                  --   brief-db-ddt-riconsegna-eredita-testata): una riga di DDT senza
                  --   iva_id e' «impossibile», e «impossibile» si traduce in NON
                  --   EMITTIBILE — in bozza il NULL resta legittimo, come gia' per la
                  --   causale al punto 2.
                  --
                  -- ⭐ IL DISCRIMINE E' IL PREZZO, NON LA CAUSALE, e per questo il
                  --   controllo sta FUORI dal ramo `v_fatturabile`. Il punto 3 si
                  --   condiziona sulla causale perche' un documento che non vende non
                  --   deve avere un prezzo risolvibile; ma se un prezzo C'E' — e su un
                  --   conto visione puo' esserci — la riga entra comunque in
                  --   vendite.vw_ddt_righe_iva_base, che la causale non la guarda
                  --   affatto. Il vincolo deve avere lo STESSO PERIMETRO del
                  --   consumatore che protegge.
                  --
                  -- ⛔ COSA SUCCEDEVA SENZA, ed era silenzioso: vw_ddt_righe_iva_base
                  --   filtra `prezzo_unitario IS NOT NULL` e NON filtra `iva_id`;
                  --   vw_ddt_riepilogo_iva_dettaglio aggrega per (iva_id,
                  --   aliquota_effettiva) e calcola con COALESCE(aliquota, 0). La riga
                  --   produceva quindi un imponibile pieno con codice IVA vuoto e
                  --   imposta zero, su un documento emesso e stampato.
                  --
                  -- ⚠️ Si guarda `dr.prezzo_unitario`, NON il COALESCE col
                  --   fulfillment del punto 3, e non e' una svista: una riga dal
                  --   prezzo solo DERIVATO non entra nella vista del riepilogo,
                  --   quindi non ha il difetto — pretendere li' l'aliquota
                  --   bloccherebbe un documento sano.
                  --
                  -- ⛔ Non si riusa vendite.fn_check_ddt_riga_richiede_prezzo:
                  --   risponde a un'altra domanda («la riga appartiene a un documento
                  --   che VENDE?»), che qui non si pone.
                  --
                  -- ⚠️ Nel dettaglio va l'id (per chi diagnostica) E il numero di riga
                  --   (per la frase che legge una persona): sono due destinatari
                  --   diversi.
                  SELECT dr.id, dr.riga_nr INTO v_riga_no_iva, v_riga_no_iva_nr
                    FROM vendite.ddt_righe dr
                   WHERE dr.ddt_id = p_ddt.id
                     AND dr.attivo IS TRUE
                     AND dr.prezzo_unitario IS NOT NULL
                     AND dr.iva_id IS NULL
                   ORDER BY dr.riga_nr, dr.id
                   LIMIT 1;

                  IF v_riga_no_iva IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_DDT_RIGA_IVA_MANCANTE',
                          'reason',     'RIGA_SENZA_ALIQUOTA',
                          'reason_key', 'vendite.ddt.azione_reason.iva_mancante',
                          'dettaglio',  jsonb_build_object('riga_id', v_riga_no_iva,
                                                           'riga_nr', v_riga_no_iva_nr));
                  END IF;

                  -- 4. TESTATA — indirizzi marcati obbligatori per l'ambito DDT.
                  SELECT array_agg(di.tipo_indirizzo_id) INTO v_presenti
                    FROM vendite.ddt_indirizzi di
                   WHERE di.ddt_id = p_ddt.id;

                  v_mancanti := script.fn_indirizzi_obbligatori_mancanti('DDT_VENDITA', v_presenti);

                  IF array_length(v_mancanti, 1) IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_INDIRIZZO_DOC_OBBLIGATORIO',
                          'reason',     'INDIRIZZI_MANCANTI',
                          'reason_key', 'common.azione_reason.indirizzi_mancanti',
                          'dettaglio',  jsonb_build_object('mancanti', to_jsonb(v_mancanti)));
                  END IF;

                  -- 4-bis. TESTATA — gli indirizzi d'anagrafica sono del cliente della
                  --   bolla (rev 2026-10-11, brief-db-indirizzi-documento-seguono-il-
                  --   cliente, D-3 di Tid). Il cliente si cambia in bozza: il trigger
                  --   del cambio toglie le righe del cliente di prima e il guard di
                  --   scrittura rifiuta quelle d'altri, ma l'emissione lo ricontrolla
                  --   per chi ha scritto prima del guard o a guard spento, e per
                  --   l'indirizzo che in anagrafica e' passato a un'altra fornitura.
                  -- ⭐ Il predicato non sta qui: script.fn_check_indirizzi_documento_cliente
                  --   (lo stesso del guard). Dopo gli indirizzi mancanti: prima si
                  --   chiede che ci siano, poi che siano giusti.
                  v_motivi := v_motivi
                           || script.fn_check_indirizzi_documento_cliente('DDT_VENDITA', p_ddt.id);

                  -- 5. COMPONENTI BoM CASO A — ma solo se il documento VENDE.
                  --
                  -- ⛔ La condizione e' nuova (2026-08-19, slice C del brief righe DDT senza
                  --   prezzo) e senza di essa il kit in conto visione resterebbe bloccato
                  --   proprio adesso che il resto della slice lo ha reso possibile:
                  --   vendite.ddt_righe_componenti.prezzo_unitario e' diventato facoltativo
                  --   (20260819-13), quindi il secondo controllo qui sotto — che fino a ieri
                  --   era IRRAGGIUNGIBILE, perche' la colonna era NOT NULL su tutte e quattro
                  --   le tabelle gemelle — da oggi scatta davvero. Se non lo si condiziona,
                  --   ferma all'emissione ogni DDT con un kit non valorizzato, compresi
                  --   quelli che non si fatturano.
                  --
                  -- ⭐ E' la stessa regola del punto 3, applicata un livello piu' sotto:
                  --   padre e figli obbediscono alla stessa dichiarazione, la causale. Un
                  --   prezzo in attesa di approvazione o non ancora messo non ha nulla da
                  --   dire su un documento che non produce valore.
                  --
                  -- ⚠️ v_fatturabile e' valorizzato dal punto 2 e resta NULL quando la
                  --   causale manca: in quel caso l'emissione e' gia' bloccata da
                  --   E_DDT_CAUSALE_OBBLIGATORIA e questi due controlli non aggiungono nulla.
                  IF COALESCE(v_fatturabile, false) THEN
                      -- 5. COMPONENTI BoM CASO A — prezzo non autorizzato: in attesa di
                      --   approvazione (PENDING) o rifiutato (REJECTED).
                      -- ⭐ rev 2026-09-24: il predicato e' il building block
                      --   script.fn_check_prezzi_autorizzati, comune ai cinque documenti
                      --   di vendita. Qui resta la POLITICA: lo si chiede solo se il
                      --   documento vende. Fino a questa revisione il controllo era
                      --   scritto qui, guardava il solo PENDING e anche i componenti
                      --   spenti, e sollevava E_COMPONENTE_PREZZO_PENDENTE — il codice
                      --   del guard PER RIGA dei componenti, che resta suo.
                      v_motivi := v_motivi
                               || script.fn_check_prezzi_autorizzati('vendite.ddt'::regclass, p_ddt.id);

                      -- ...oppure non ancora valorizzato.
                      IF EXISTS (
                          SELECT 1 FROM vendite.ddt_righe dr
                            JOIN vendite.ddt_righe_componenti drc ON drc.riga_ddt_id = dr.id
                           WHERE dr.ddt_id = p_ddt.id
                             AND drc.attivo = TRUE
                             AND drc.prezzo_unitario IS NULL
                      ) THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     'E_DOC_COMPONENTI_PENDING_VALORIZZAZIONE',
                              'reason',     'COMPONENTI_NON_VALORIZZATI',
                              'reason_key', 'vendite.ddt.azione_reason.componenti_non_valorizzati',
                              'dettaglio',  NULL);
                      END IF;
                  END IF;

                  -- 6. LA MERCE — rev 2026-09-28 (brief-db-magazzino-lotto-3-scarico-da-ddt,
                  --   P-6): se la bolla muove merce, i motivi FISICI — magazzino, prelievi,
                  --   posizione, disponibilita' — da script.fn_check_ddt_merce, accodati.
                  --   Stanno in una check a se' perche' portano i `valori` della frase (li
                  --   solleva il verbo vendite.fn_cambia_stato_ddt col primo motivo), mentre
                  --   quelli sopra la frase la lasciano comporre ai guard. Ultimi:
                  --   fn_available_actions_ddt legge il PRIMO motivo, e un documento a cui
                  --   manca la causale o il prezzo deve dire quello prima di parlare di scaffali.
                  v_motivi := v_motivi || script.fn_check_ddt_merce(p_ddt);

                  RETURN v_motivi;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_check_ddt_emittibile(vendite.ddt) IS
                'Single source dei motivi che impediscono l''emissione (EMESSO) di un DDT: righe attive (543), causale (544), prezzo risolvibile se causale fatturabile (545), aliquota sulle righe che portano un prezzo, indirizzi obbligatori, componenti BoM CASO A pendenti/non valorizzati. Ritorna [] se emittibile, altrimenti array ORDINATO di {codice, reason, reason_key, dettaglio}. PURA: non solleva. rev 2026-08-19: i due motivi sui COMPONENTI si valutano solo se la causale e'' fatturabile, come gia'' faceva il motivo sulle righe. ⭐ rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter, decisione di Tid): sesto motivo E_DDT_RIGA_IVA_MANCANTE — una riga attiva CON PREZZO e senza iva_id non si emette. Chiudeva un difetto silenzioso: vw_ddt_righe_iva_base filtra prezzo_unitario e NON iva_id, quindi quella riga entrava nel riepilogo con imponibile pieno, codice IVA vuoto e imposta zero, su un documento stampato. ⭐ Il discrimine e'' il PREZZO e non la causale, e per questo il controllo sta FUORI dal ramo fatturabile: la vista del riepilogo la causale non la guarda, e il vincolo deve avere lo stesso perimetro del consumatore che protegge. ⚠️ Si guarda dr.prezzo_unitario e NON il COALESCE col fulfillment del punto 3: una riga dal prezzo solo derivato non entra nella vista, quindi non ha il difetto. ⛔ Non e'' un NOT NULL di colonna, e non poteva esserlo: ordini_righe.iva_id e'' nullable e fn_genera_ddt_da_ordine la copia, quindi il vincolo avrebbe fatto fallire l''evasione ordine con un 23502 muto. ⚠️ Il punto nuovo sta fra il prezzo e gli indirizzi: fn_available_actions_ddt legge il PRIMO motivo, quindi l''ordine e'' il contratto. rev 2026-09-24: il punto 5 dei componenti BoM (prezzo in attesa) passa al building block script.fn_check_prezzi_autorizzati — PENDING E REJECTED, solo componenti attivi di righe attive, codici E_DOC_PREZZO_PENDENTE / E_DOC_PREZZO_RIFIUTATO (prima E_COMPONENTE_PREZZO_PENDENTE, reason COMPONENTI_PREZZO_PENDENTE). La politica resta qui: si chiede solo se la causale vende. Il guard trgfn_ddt_guard_transizione_approvazione solleva i due codici nuovi. Brief: brief-db-preventivi-congelamento-pricing (D-1, D-5, D-6). rev 2026-09-28 (brief-db-magazzino-lotto-3-scarico-da-ddt, P-6): settimo punto, i motivi FISICI di una bolla che muove merce, accodati da script.fn_check_ddt_merce (magazzino di partenza/arrivo, prelievi incompleti, posizione che la primitiva rifiuterebbe, merce non disponibile). In coda, perche'' la capability legge il primo motivo; in una check a se'' perche'' portano i valori della frase (li solleva il verbo vendite.fn_cambia_stato_ddt). rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2/D-2-bis): motivo 2-bis E_DDT_CLIENTE_OBBLIGATORIO (reason CLIENTE_MANCANTE, reason_key vendite.ddt.azione_reason.cliente_mancante, dettaglio {causale}): la causale vuole un cliente (config.causali_trasporto.richiede_cliente) e la bolla non ha il billing account. Fra la causale e il prezzo: la capability legge il primo motivo. La causale si legge una volta per il 2-bis e il 3. rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente, D-3 di Tid): punto 4-bis E_INDIRIZZO_DOC_NON_DEL_CLIENTE (reason INDIRIZZO_NON_DEL_CLIENTE, reason_key common.azione_reason.indirizzo_non_del_cliente) da script.fn_check_indirizzi_documento_cliente(''DDT'', id): un indirizzo d''anagrafica che non e'' del cliente della bolla (altro ruolo, o fornitura diversa) ferma l''emissione. Dopo gli indirizzi mancanti; lo solleva vendite.trgfn_ddt_guard_indirizzi_obbligatori. ⭐ rev 2026-10-19 (20261019-55, brief-db-grammatica-unica-documenti lotto 2a, G-1 di Tid): la grammatica delle testate passa ai codici delle sorgenti (DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL; PREVENTIVO, CONTRATTO, COMMESSA, FATTURA invariati); dove sopra si legge un codice corto come selettore, oggi vale il codice della sorgente. Rev 2026-10-20 (20261020-54, brief-db-grammatica-unica-documenti 2d, G-6): l''ambito degli indirizzi DDT diventa DDT_VENDITA, il codice della sorgente.';

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_ddt_emittibile(p_ddt vendite.ddt)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$


              -- Scopo: elencare i motivi che impediscono l'emissione (EMESSO) di
              --   un DDT. Funzione PURA (fn_check_*): non solleva, non scrive.
              --   Consumatori: i 4 guard trigger di emissione (sollevano il
              --   proprio codice) e script.fn_available_actions_ddt (espone
              --   l'azione disabled + reason). Brief:
              --   brief-db-guard-righe-avanzamento-stato §1a-bis (Rev 2).
              --   rev 2026-09-24: il punto 5 (prezzo in attesa) passa al building
              --   block script.fn_check_prezzi_autorizzati — PENDING E REJECTED, solo
              --   componenti attivi (brief-db-preventivi-congelamento-pricing, D-6).
              -- Ritorna: [] se emittibile; altrimenti array ordinato di
              --   {codice, reason, reason_key, dettaglio}.
              DECLARE
                  v_motivi      jsonb := '[]'::jsonb;
                  v_fatturabile boolean;
                  v_richiede_cliente config.causali_trasporto.richiede_cliente%TYPE;
                  v_causale_codice   config.causali_trasporto.codice%TYPE;
                  v_riga_senza  vendite.ddt_righe.id%TYPE;
                  v_riga_no_iva vendite.ddt_righe.id%TYPE;
                  v_riga_no_iva_nr vendite.ddt_righe.riga_nr%TYPE;
                  v_presenti    integer[];
                  v_mancanti    text[];
              BEGIN
                  -- 1. STRUTTURA — zero righe attive = niente da trasportare (543).
                  --    Il "DDT di solo trasporto" resta legittimo: quello e' righe
                  --    SENZA PREZZO, non zero righe.
                  IF NOT EXISTS (
                      SELECT 1 FROM vendite.ddt_righe dr
                       WHERE dr.ddt_id = p_ddt.id
                         AND dr.attivo IS TRUE
                  ) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_DDT_EMISSIONE_SENZA_RIGHE',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  NULL);
                  END IF;

                  -- 2. INTENTO — la causale dichiara se la merce che viaggia e'
                  --    una vendita da fatturare o solo un trasporto (544, DL-28).
                  --    In bozza il NULL resta legittimo: il vincolo e' qui, non
                  --    sul salvataggio.
                  IF p_ddt.causale_trasporto_id IS NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_DDT_CAUSALE_OBBLIGATORIA',
                          'reason',     'CAUSALE_MANCANTE',
                          'reason_key', 'vendite.ddt.azione_reason.causale_mancante',
                          'dettaglio',  NULL);
                  ELSE
                      -- 2-bis. CONTROPARTE — rev 2026-10-09 (brief-db-esecutivi-ba-coppia,
                      --    D-2 e D-2-bis di Tid): una bolla che manda merce A UN CLIENTE
                      --    porta il suo billing account, cioe' il cliente a grana fine
                      --    (la fornitura). Lo dice la causale, per colonna di vocabolario
                      --    (config.causali_trasporto.richiede_cliente), non per codice:
                      --    si' vendita, omaggio, campionatura, conto visione; no
                      --    trasferimento, conto lavoro, riparazione, reso a fornitore.
                      -- ⚠️ Non e' un NOT NULL ne' un guard su INSERT: la causale, che
                      --    decide, in bozza puo' non esserci ancora. Come per la causale
                      --    (punto 2), il vincolo sta all'emissione.
                      -- ⚠️ Prima del punto 3: la capability legge il PRIMO motivo, e
                      --    una bolla senza cliente deve dire quello prima dei prezzi.
                      -- La causale si legge UNA volta: serve al 2-bis e al 3.
                      SELECT ct.fatturabile, ct.richiede_cliente, ct.codice
                        INTO v_fatturabile, v_richiede_cliente, v_causale_codice
                        FROM config.causali_trasporto ct
                       WHERE ct.id = p_ddt.causale_trasporto_id;

                      IF v_richiede_cliente AND p_ddt.billing_account_id IS NULL THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     'E_DDT_CLIENTE_OBBLIGATORIO',
                              'reason',     'CLIENTE_MANCANTE',
                              'reason_key', 'vendite.ddt.azione_reason.cliente_mancante',
                              'dettaglio',  jsonb_build_object('causale', v_causale_codice));
                      END IF;

                      -- 3. DATI RIGA — causale fatturabile => ogni riga attiva deve
                      --    avere prezzo RISOLVIBILE: proprio o ereditato dalla riga
                      --    d'ordine via fulfillment (545). Stessa COALESCE del
                      --    lister. NB: vw_ddt_righe_iva_base NON e' riusabile qui
                      --    (filtra prezzo_unitario IS NOT NULL, perderebbe proprio
                      --    le righe da esaminare).
                      IF COALESCE(v_fatturabile, false) THEN
                          SELECT dr.id INTO v_riga_senza
                            FROM vendite.ddt_righe dr
                            LEFT JOIN LATERAL (
                                SELECT or_r.prezzo_unitario
                                  FROM vendite.ordini_righe_fulfillment ful
                                  JOIN vendite.ordini_righe or_r ON or_r.id = ful.ordine_riga_id
                                 WHERE ful.ddt_riga_id = dr.id
                                 ORDER BY ful.id LIMIT 1
                            ) src ON TRUE
                           WHERE dr.ddt_id = p_ddt.id
                             AND dr.attivo IS TRUE
                             AND COALESCE(dr.prezzo_unitario, src.prezzo_unitario) IS NULL
                           ORDER BY dr.id
                           LIMIT 1;

                          IF v_riga_senza IS NOT NULL THEN
                              v_motivi := v_motivi || jsonb_build_object(
                                  'codice',     'E_DDT_PREZZO_NON_RISOLVIBILE',
                                  'reason',     'PREZZO_NON_RISOLVIBILE',
                                  'reason_key', 'vendite.ddt.azione_reason.prezzo_non_risolvibile',
                                  'dettaglio',  jsonb_build_object('riga_id', v_riga_senza));
                          END IF;
                      END IF;
                  END IF;

                  -- 3-bis. VALORE DELLA RIGA — una riga che porta un PREZZO porta
                  --   anche l'ALIQUOTA. Decisione di Tid del 2026-08-28 (R4-ter del
                  --   brief-db-ddt-riconsegna-eredita-testata): una riga di DDT senza
                  --   iva_id e' «impossibile», e «impossibile» si traduce in NON
                  --   EMITTIBILE — in bozza il NULL resta legittimo, come gia' per la
                  --   causale al punto 2.
                  --
                  -- ⭐ IL DISCRIMINE E' IL PREZZO, NON LA CAUSALE, e per questo il
                  --   controllo sta FUORI dal ramo `v_fatturabile`. Il punto 3 si
                  --   condiziona sulla causale perche' un documento che non vende non
                  --   deve avere un prezzo risolvibile; ma se un prezzo C'E' — e su un
                  --   conto visione puo' esserci — la riga entra comunque in
                  --   vendite.vw_ddt_righe_iva_base, che la causale non la guarda
                  --   affatto. Il vincolo deve avere lo STESSO PERIMETRO del
                  --   consumatore che protegge.
                  --
                  -- ⛔ COSA SUCCEDEVA SENZA, ed era silenzioso: vw_ddt_righe_iva_base
                  --   filtra `prezzo_unitario IS NOT NULL` e NON filtra `iva_id`;
                  --   vw_ddt_riepilogo_iva_dettaglio aggrega per (iva_id,
                  --   aliquota_effettiva) e calcola con COALESCE(aliquota, 0). La riga
                  --   produceva quindi un imponibile pieno con codice IVA vuoto e
                  --   imposta zero, su un documento emesso e stampato.
                  --
                  -- ⚠️ Si guarda `dr.prezzo_unitario`, NON il COALESCE col
                  --   fulfillment del punto 3, e non e' una svista: una riga dal
                  --   prezzo solo DERIVATO non entra nella vista del riepilogo,
                  --   quindi non ha il difetto — pretendere li' l'aliquota
                  --   bloccherebbe un documento sano.
                  --
                  -- ⛔ Non si riusa vendite.fn_check_ddt_riga_richiede_prezzo:
                  --   risponde a un'altra domanda («la riga appartiene a un documento
                  --   che VENDE?»), che qui non si pone.
                  --
                  -- ⚠️ Nel dettaglio va l'id (per chi diagnostica) E il numero di riga
                  --   (per la frase che legge una persona): sono due destinatari
                  --   diversi.
                  SELECT dr.id, dr.riga_nr INTO v_riga_no_iva, v_riga_no_iva_nr
                    FROM vendite.ddt_righe dr
                   WHERE dr.ddt_id = p_ddt.id
                     AND dr.attivo IS TRUE
                     AND dr.prezzo_unitario IS NOT NULL
                     AND dr.iva_id IS NULL
                   ORDER BY dr.riga_nr, dr.id
                   LIMIT 1;

                  IF v_riga_no_iva IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_DDT_RIGA_IVA_MANCANTE',
                          'reason',     'RIGA_SENZA_ALIQUOTA',
                          'reason_key', 'vendite.ddt.azione_reason.iva_mancante',
                          'dettaglio',  jsonb_build_object('riga_id', v_riga_no_iva,
                                                           'riga_nr', v_riga_no_iva_nr));
                  END IF;

                  -- 4. TESTATA — indirizzi marcati obbligatori per l'ambito DDT.
                  SELECT array_agg(di.tipo_indirizzo_id) INTO v_presenti
                    FROM vendite.ddt_indirizzi di
                   WHERE di.ddt_id = p_ddt.id;

                  v_mancanti := script.fn_indirizzi_obbligatori_mancanti('DDT', v_presenti);

                  IF array_length(v_mancanti, 1) IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_INDIRIZZO_DOC_OBBLIGATORIO',
                          'reason',     'INDIRIZZI_MANCANTI',
                          'reason_key', 'common.azione_reason.indirizzi_mancanti',
                          'dettaglio',  jsonb_build_object('mancanti', to_jsonb(v_mancanti)));
                  END IF;

                  -- 4-bis. TESTATA — gli indirizzi d'anagrafica sono del cliente della
                  --   bolla (rev 2026-10-11, brief-db-indirizzi-documento-seguono-il-
                  --   cliente, D-3 di Tid). Il cliente si cambia in bozza: il trigger
                  --   del cambio toglie le righe del cliente di prima e il guard di
                  --   scrittura rifiuta quelle d'altri, ma l'emissione lo ricontrolla
                  --   per chi ha scritto prima del guard o a guard spento, e per
                  --   l'indirizzo che in anagrafica e' passato a un'altra fornitura.
                  -- ⭐ Il predicato non sta qui: script.fn_check_indirizzi_documento_cliente
                  --   (lo stesso del guard). Dopo gli indirizzi mancanti: prima si
                  --   chiede che ci siano, poi che siano giusti.
                  v_motivi := v_motivi
                           || script.fn_check_indirizzi_documento_cliente('DDT_VENDITA', p_ddt.id);

                  -- 5. COMPONENTI BoM CASO A — ma solo se il documento VENDE.
                  --
                  -- ⛔ La condizione e' nuova (2026-08-19, slice C del brief righe DDT senza
                  --   prezzo) e senza di essa il kit in conto visione resterebbe bloccato
                  --   proprio adesso che il resto della slice lo ha reso possibile:
                  --   vendite.ddt_righe_componenti.prezzo_unitario e' diventato facoltativo
                  --   (20260819-13), quindi il secondo controllo qui sotto — che fino a ieri
                  --   era IRRAGGIUNGIBILE, perche' la colonna era NOT NULL su tutte e quattro
                  --   le tabelle gemelle — da oggi scatta davvero. Se non lo si condiziona,
                  --   ferma all'emissione ogni DDT con un kit non valorizzato, compresi
                  --   quelli che non si fatturano.
                  --
                  -- ⭐ E' la stessa regola del punto 3, applicata un livello piu' sotto:
                  --   padre e figli obbediscono alla stessa dichiarazione, la causale. Un
                  --   prezzo in attesa di approvazione o non ancora messo non ha nulla da
                  --   dire su un documento che non produce valore.
                  --
                  -- ⚠️ v_fatturabile e' valorizzato dal punto 2 e resta NULL quando la
                  --   causale manca: in quel caso l'emissione e' gia' bloccata da
                  --   E_DDT_CAUSALE_OBBLIGATORIA e questi due controlli non aggiungono nulla.
                  IF COALESCE(v_fatturabile, false) THEN
                      -- 5. COMPONENTI BoM CASO A — prezzo non autorizzato: in attesa di
                      --   approvazione (PENDING) o rifiutato (REJECTED).
                      -- ⭐ rev 2026-09-24: il predicato e' il building block
                      --   script.fn_check_prezzi_autorizzati, comune ai cinque documenti
                      --   di vendita. Qui resta la POLITICA: lo si chiede solo se il
                      --   documento vende. Fino a questa revisione il controllo era
                      --   scritto qui, guardava il solo PENDING e anche i componenti
                      --   spenti, e sollevava E_COMPONENTE_PREZZO_PENDENTE — il codice
                      --   del guard PER RIGA dei componenti, che resta suo.
                      v_motivi := v_motivi
                               || script.fn_check_prezzi_autorizzati('vendite.ddt'::regclass, p_ddt.id);

                      -- ...oppure non ancora valorizzato.
                      IF EXISTS (
                          SELECT 1 FROM vendite.ddt_righe dr
                            JOIN vendite.ddt_righe_componenti drc ON drc.riga_ddt_id = dr.id
                           WHERE dr.ddt_id = p_ddt.id
                             AND drc.attivo = TRUE
                             AND drc.prezzo_unitario IS NULL
                      ) THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     'E_DOC_COMPONENTI_PENDING_VALORIZZAZIONE',
                              'reason',     'COMPONENTI_NON_VALORIZZATI',
                              'reason_key', 'vendite.ddt.azione_reason.componenti_non_valorizzati',
                              'dettaglio',  NULL);
                      END IF;
                  END IF;

                  -- 6. LA MERCE — rev 2026-09-28 (brief-db-magazzino-lotto-3-scarico-da-ddt,
                  --   P-6): se la bolla muove merce, i motivi FISICI — magazzino, prelievi,
                  --   posizione, disponibilita' — da script.fn_check_ddt_merce, accodati.
                  --   Stanno in una check a se' perche' portano i `valori` della frase (li
                  --   solleva il verbo vendite.fn_cambia_stato_ddt col primo motivo), mentre
                  --   quelli sopra la frase la lasciano comporre ai guard. Ultimi:
                  --   fn_available_actions_ddt legge il PRIMO motivo, e un documento a cui
                  --   manca la causale o il prezzo deve dire quello prima di parlare di scaffali.
                  v_motivi := v_motivi || script.fn_check_ddt_merce(p_ddt);

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_ddt_emittibile(vendite.ddt) IS
                'Single source dei motivi che impediscono l''emissione (EMESSO) di un DDT: righe attive (543), causale (544), prezzo risolvibile se causale fatturabile (545), aliquota sulle righe che portano un prezzo, indirizzi obbligatori, componenti BoM CASO A pendenti/non valorizzati. Ritorna [] se emittibile, altrimenti array ORDINATO di {codice, reason, reason_key, dettaglio}. PURA: non solleva. rev 2026-08-19: i due motivi sui COMPONENTI si valutano solo se la causale e'' fatturabile, come gia'' faceva il motivo sulle righe. ⭐ rev 2026-08-28 (brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter, decisione di Tid): sesto motivo E_DDT_RIGA_IVA_MANCANTE — una riga attiva CON PREZZO e senza iva_id non si emette. Chiudeva un difetto silenzioso: vw_ddt_righe_iva_base filtra prezzo_unitario e NON iva_id, quindi quella riga entrava nel riepilogo con imponibile pieno, codice IVA vuoto e imposta zero, su un documento stampato. ⭐ Il discrimine e'' il PREZZO e non la causale, e per questo il controllo sta FUORI dal ramo fatturabile: la vista del riepilogo la causale non la guarda, e il vincolo deve avere lo stesso perimetro del consumatore che protegge. ⚠️ Si guarda dr.prezzo_unitario e NON il COALESCE col fulfillment del punto 3: una riga dal prezzo solo derivato non entra nella vista, quindi non ha il difetto. ⛔ Non e'' un NOT NULL di colonna, e non poteva esserlo: ordini_righe.iva_id e'' nullable e fn_genera_ddt_da_ordine la copia, quindi il vincolo avrebbe fatto fallire l''evasione ordine con un 23502 muto. ⚠️ Il punto nuovo sta fra il prezzo e gli indirizzi: fn_available_actions_ddt legge il PRIMO motivo, quindi l''ordine e'' il contratto. rev 2026-09-24: il punto 5 dei componenti BoM (prezzo in attesa) passa al building block script.fn_check_prezzi_autorizzati — PENDING E REJECTED, solo componenti attivi di righe attive, codici E_DOC_PREZZO_PENDENTE / E_DOC_PREZZO_RIFIUTATO (prima E_COMPONENTE_PREZZO_PENDENTE, reason COMPONENTI_PREZZO_PENDENTE). La politica resta qui: si chiede solo se la causale vende. Il guard trgfn_ddt_guard_transizione_approvazione solleva i due codici nuovi. Brief: brief-db-preventivi-congelamento-pricing (D-1, D-5, D-6). rev 2026-09-28 (brief-db-magazzino-lotto-3-scarico-da-ddt, P-6): settimo punto, i motivi FISICI di una bolla che muove merce, accodati da script.fn_check_ddt_merce (magazzino di partenza/arrivo, prelievi incompleti, posizione che la primitiva rifiuterebbe, merce non disponibile). In coda, perche'' la capability legge il primo motivo; in una check a se'' perche'' portano i valori della frase (li solleva il verbo vendite.fn_cambia_stato_ddt). rev 2026-10-09 (brief-db-esecutivi-ba-coppia, D-2/D-2-bis): motivo 2-bis E_DDT_CLIENTE_OBBLIGATORIO (reason CLIENTE_MANCANTE, reason_key vendite.ddt.azione_reason.cliente_mancante, dettaglio {causale}): la causale vuole un cliente (config.causali_trasporto.richiede_cliente) e la bolla non ha il billing account. Fra la causale e il prezzo: la capability legge il primo motivo. La causale si legge una volta per il 2-bis e il 3. rev 2026-10-11 (brief-db-indirizzi-documento-seguono-il-cliente, D-3 di Tid): punto 4-bis E_INDIRIZZO_DOC_NON_DEL_CLIENTE (reason INDIRIZZO_NON_DEL_CLIENTE, reason_key common.azione_reason.indirizzo_non_del_cliente) da script.fn_check_indirizzi_documento_cliente(''DDT'', id): un indirizzo d''anagrafica che non e'' del cliente della bolla (altro ruolo, o fornitura diversa) ferma l''emissione. Dopo gli indirizzi mancanti; lo solleva vendite.trgfn_ddt_guard_indirizzi_obbligatori. ⭐ rev 2026-10-19 (20261019-55, brief-db-grammatica-unica-documenti lotto 2a, G-1 di Tid): la grammatica delle testate passa ai codici delle sorgenti (DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL; PREVENTIVO, CONTRATTO, COMMESSA, FATTURA invariati); dove sopra si legge un codice corto come selettore, oggi vale il codice della sorgente.';
