# AGGIORNA: script.fn_doc_lock_regola(p_building_block, p_argomenti)
#   Brief: brief-db-indirizzi-documento-seguono-il-cliente (§8.7)
#
# -- COSA CAMBIA --------------------------------------------------------
#   La grammatica della TESTATA impara una colonna «ferma sempre»: il terzo
#   elemento della terna vale '-' e la colonna non si cambia in nessuno
#   stato, bozza compresa. Ogni colonna della regola porta la chiave nuova
#   ferma_sempre; con '-' gli stati_ammessi sono vuoti. Un '-' insieme a
#   degli stati e' un montaggio sbagliato.
#   ⭐ Perche' qui e non nel registro dei lock di colonna
#   (dbops.automation_lock_columns): il montaggio del lock di testata e'
#   gia' la sorgente da cui la capability legge non_editable_fields
#   (script.fn_doc_testata_in_stato). Una colonna ferma sempre dichiarata
#   li' arriva al form senza una seconda lista, e il lock _a05_ parla prima
#   dei guard sul valore nuovo (emittente/BA, scope, coppia).
#   I montaggi di oggi non hanno '-': la regola che leggono cambia solo per
#   la chiave in piu' (false). La decisione e' nel -66, i montaggi nel -67.
#   Corpo di partenza: pg_get_functiondef su dbdev il 2026-10-18, uguale
#   alla doc auto-generata (rev 20261011-21). COMMENT vivo con la rev in coda.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261018-65-update-fn-doc-lock-regola-colonna-ferma-sempre-mctit.yaml

  - changeSet:
      id: 20261018-65-update-fn-doc-lock-regola-colonna-ferma-sempre
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_doc_lock_regola: TESTATA, '-' come terzo elemento della terna = colonna ferma sempre,
        anche in bozza (ferma_sempre). Brief: brief-db-indirizzi-documento-seguono-il-cliente (§8.7).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_doc_lock_regola(p_building_block text, p_argomenti text[])
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE PARALLEL SAFE
              AS $function$
              -- ⚠️ Tipi nudi DICHIARATI: p_building_block e' un selettore
              --   (RIGHE | TESTATA) senza colonna di vocabolario; p_argomenti
              --   sono gli argomenti di un trigger, text per costruzione.
              DECLARE
                -- Gli argomenti contati da 1, qualunque sia il primo indice
                -- dell'array ricevuto (TG_ARGV parte da 0).
                a          text[];
                n          integer;
                v_ammesse  text[];
                v_stati    text[];
                v_colonne  jsonb := '[]'::jsonb;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Dagli argomenti di un montaggio alla regola che dicono.
                --   E' la grammatica dei due building block «si tocca solo
                --   in bozza»: la leggono il trigger (da TG_ARGV) e il
                --   lettore del montaggio (da pg_trigger.tgargs), cosi' i due
                --   non possono capire gli argomenti in due modi.
                --   La decisione («questa colonna, in questo stato?») sta in
                --   script.fn_doc_lock_colonna_bloccata.
                -- =========================================================
                a := ARRAY(SELECT x
                             FROM unnest(p_argomenti) WITH ORDINALITY AS u(x, k)
                            ORDER BY k);
                n := COALESCE(cardinality(a), 0);

                IF p_building_block = 'RIGHE' THEN
                  -- [0] tipo documento, [1] colonna FK verso il padre,
                  -- [2] (opz.) stato bozza, [3] (opz.) livello TESTATA | RIGA,
                  -- [4] (opz.) colonne che un UPDATE cambia fuori bozza,
                  -- [5] (opz., con [4]) gli stati in cui le cambia,
                  -- [6] (opz.) il codice errore da sollevare, default
                  --     E_RIGA_DOC_NON_BOZZA (rev 2026-10-11: i satelliti
                  --     del documento, indirizzi e fornitura, montano il loro,
                  --     D-12 di brief-db-testata-dopo-emissione).
                  v_ammesse := ARRAY(SELECT btrim(x)
                                       FROM unnest(string_to_array(COALESCE(a[5], ''), ',')) AS x
                                      WHERE btrim(x) <> '');
                  v_stati   := ARRAY(SELECT btrim(x)
                                       FROM unnest(string_to_array(COALESCE(a[6], ''), ',')) AS x
                                      WHERE btrim(x) <> '');

                  RETURN jsonb_build_object(
                    'building_block',   'RIGHE',
                    'documento',        NULLIF(a[1], ''),
                    'colonna_fk',       NULLIF(a[2], ''),
                    'stato_bozza',      COALESCE(NULLIF(a[3], ''), 'DRAFT'),
                    'livello',          COALESCE(NULLIF(a[4], ''), 'TESTATA'),
                    'colonne_ammesse',  to_jsonb(v_ammesse),
                    'stati_ammessi',    to_jsonb(v_stati),
                    'codice',           COALESCE(NULLIF(btrim(a[7]), ''), 'E_RIGA_DOC_NON_BOZZA'),
                    -- Le scrive l'audit, non chi modifica la riga: fuori dal
                    -- confronto dell'eccezione.
                    'colonne_tecniche', jsonb_build_array('data_update', 'user_update', 'tx_id'),
                    'errore',
                      CASE WHEN n < 2
                             OR n > 7
                             OR NULLIF(a[1], '') IS NULL
                             OR NULLIF(a[2], '') IS NULL
                             OR COALESCE(NULLIF(a[4], ''), 'TESTATA') NOT IN ('TESTATA', 'RIGA')
                             -- [4] e [5] vanno insieme: colonne senza stati, o
                             -- stati senza colonne, sono un montaggio a meta'.
                             OR (cardinality(v_ammesse) = 0) <> (cardinality(v_stati) = 0)
                           THEN 'attesi: tipo documento, colonna FK della riga [, codice stato bozza [, livello TESTATA | RIGA [, colonne ammesse fuori bozza, stati in cui sono ammesse [, codice errore]]]]'
                      END);
                END IF;

                IF p_building_block = 'TESTATA' THEN
                  -- [0] tipo documento, [1] stato bozza, [2..] terne (colonna,
                  -- codice errore, stati in cui resta aperta fuori bozza). Stati
                  -- vuoti: bloccata fuori bozza. Una lista (codice_interno separati
                  -- da virgola): aperta solo in quegli stati, chiusa negli altri
                  -- (D-8 e D-10, rev 2026-10-10). Le colonne che il montaggio non
                  -- nomina sono libere: le scrive il database (totali, istantanee,
                  -- date dei cambi di stato, lo stato stesso).
                  -- rev 2026-10-18: '-' al posto degli stati = la colonna e' ferma
                  -- sempre, anche in bozza (ferma_sempre): si sceglie alla nascita
                  -- e non si cambia piu'. Il '-' sta da solo: mescolato a degli
                  -- stati e' un montaggio sbagliato.
                  IF n < 5
                     OR (n - 2) % 3 <> 0
                     OR NULLIF(a[1], '') IS NULL
                     OR NULLIF(a[2], '') IS NULL
                     OR EXISTS (SELECT 1
                                  FROM generate_series(3, n, 3) AS g(k)
                                 WHERE NULLIF(btrim(a[k]), '') IS NULL
                                    OR NULLIF(btrim(a[k + 1]), '') IS NULL
                                    OR (SELECT bool_or(btrim(x) = '-') AND count(*) > 1
                                          FROM unnest(string_to_array(COALESCE(a[k + 2], ''), ',')) AS x
                                         WHERE btrim(x) <> '')) THEN
                    RETURN jsonb_build_object(
                      'building_block', 'TESTATA',
                      'documento',      NULLIF(a[1], ''),
                      'stato_bozza',    NULLIF(a[2], ''),
                      'colonne',        '[]'::jsonb,
                      'errore',         'attesi: tipo documento, codice dello stato bozza, e terne (colonna, codice errore, stati in cui resta aperta fuori bozza, vuoto, o - se e'' ferma anche in bozza)');
                  END IF;

                  FOR i IN 3 .. n BY 3 LOOP
                    v_stati := ARRAY(SELECT btrim(x)
                                       FROM unnest(string_to_array(COALESCE(a[i + 2], ''), ',')) AS x
                                      WHERE btrim(x) <> '');
                    v_colonne := v_colonne || jsonb_build_array(jsonb_build_object(
                      'colonna',       btrim(a[i]),
                      'codice',        btrim(a[i + 1]),
                      'ferma_sempre',  v_stati = ARRAY['-'],
                      'stati_ammessi', CASE WHEN v_stati = ARRAY['-'] THEN '[]'::jsonb
                                            ELSE to_jsonb(v_stati) END));
                  END LOOP;

                  RETURN jsonb_build_object(
                    'building_block', 'TESTATA',
                    'documento',      a[1],
                    'stato_bozza',    a[2],
                    'colonne',        v_colonne,
                    'errore',         NULL);
                END IF;

                -- Un building block che la grammatica non conosce: nessuna
                -- regola da leggere, e chi la usa deve fermarsi.
                RETURN jsonb_build_object(
                  'building_block', p_building_block,
                  'errore',         format('building block sconosciuto: %s', COALESCE(p_building_block, 'NULL')));
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_doc_lock_regola(p_building_block text, p_argomenti text[])
              IS 'Building block (2026-10-10, brief-db-testata-dopo-emissione fase 1, R-1): la GRAMMATICA dei montaggi dei due building block «si tocca solo in bozza». Dagli argomenti di un trigger (TG_ARGV, o pg_trigger.tgargs letto da dbops.fn_trigger_argomenti; qualunque primo indice) alla regola che dicono, in jsonb. p_building_block = RIGHE (vendite.trgfn_doc_righe_lock_fuori_bozza): documento, colonna_fk, stato_bozza (default DRAFT), livello (default TESTATA), colonne_ammesse e stati_ammessi (argomenti [4] e [5], liste separate da virgola), codice (argomento [6], default E_RIGA_DOC_NON_BOZZA), colonne_tecniche. TESTATA (vendite.trgfn_doc_testata_lock_fuori_bozza): documento, stato_bozza, colonne = [{colonna, codice, stati_ammessi}] nell''ordine degli argomenti: dal 2026-10-10 (fase 2) gli argomenti sono terne (colonna, codice, stati in cui resta aperta fuori bozza; vuoto = bloccata fuori bozza), D-8 e D-10. errore: NULL, o la frase di un montaggio sbagliato, che il chiamante solleva con E_DOC_RIGHE_LOCK_MONTAGGIO. La chiamano i due building block e il lettore script.fn_doc_lock_montaggi: trigger e capability non possono capire gli argomenti in due modi. La decisione per colonna e stato e'' script.fn_doc_lock_colonna_bloccata. STABLE. rev 2026-10-10 (fase 2, §5-bis.7 del brief, accettato da Tid): la testata a terne; una terna con colonna o codice vuoti e'' un montaggio sbagliato. rev 2026-10-11 (§11, R-DB-3 e D-12 di Tid): RIGHE legge un settimo argomento, il codice da sollevare, perche'' i satelliti del documento (indirizzi, fornitura) montano lo stesso building block con un codice la cui frase non parla di righe; oltre sette argomenti e'' un montaggio sbagliato. Gli adottanti di prima non lo passano e restano su E_RIGA_DOC_NON_BOZZA. rev 2026-10-18 (brief-db-indirizzi-documento-seguono-il-cliente §8.7): TESTATA, il terzo elemento della terna puo'' essere ''-'': la colonna e'' ferma sempre, anche in bozza (ferma_sempre = true, stati_ammessi vuoto). Ogni colonna della regola porta ferma_sempre. Un ''-'' mescolato a degli stati e'' un montaggio sbagliato. Primi adottanti: emittente_fiscale_id e utility_id di preventivo, offerta e contratto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo di prima e' in 20261011-21. Un montaggio con '-' (20261018-67)
              --   letto dalla grammatica vecchia diventerebbe uno stato che non esiste:
              --   si torna indietro insieme al -66 e al -67, a mano.
              SELECT 1;
