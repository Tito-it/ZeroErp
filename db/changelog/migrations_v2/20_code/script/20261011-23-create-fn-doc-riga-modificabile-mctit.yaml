# NUOVO: script.fn_doc_riga_modificabile(p_tabella, p_stato)
#   «Con il documento in questo stato, una riga intera di questa tabella si
#   aggiunge, si modifica e si toglie?»
#   Brief: brief-db-testata-dopo-emissione (§11, R-DB-3)
#
# -- PERCHE' ------------------------------------------------------------
#   Indirizzi e fornitura del documento si scrivono solo in bozza: lo dice
#   il lock montato sui satelliti (20261011-24). La capability che spegne
#   il loro verbo deve leggerlo dallo stesso montaggio, non scrivere uno
#   stato: e' la sorella di script.fn_doc_colonna_modificabile, che
#   risponde per una colonna sola, e chiede la riga intera (colonne NULL,
#   come un INSERT o un DELETE).
#
#   Tipi: p_stato nudo e dichiarato (codice_interno di sei vocabolari,
#   polimorfo).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261011-23-create-fn-doc-riga-modificabile-mctit.yaml

  - changeSet:
      id: 20261011-23-create-fn-doc-riga-modificabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuova check generica script.fn_doc_riga_modificabile: una riga intera, in uno stato, passa i lock
        «solo in bozza» della tabella? Dal montaggio, con la decisione del trigger. Brief: brief-db-testata-dopo-emissione (R-DB-3).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_doc_riga_modificabile(
                  p_tabella regclass,
                  p_stato   text
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- Scopo: con il documento in p_stato (codice_interno), una riga
                  --   intera di p_tabella si aggiunge, si modifica e si toglie,
                  --   oppure i lock «si tocca solo in bozza» la fermano? Dal
                  --   montaggio (script.fn_doc_lock_montaggi), con la decisione
                  --   del trigger (script.fn_doc_lock_colonna_bloccata) sulla
                  --   riga intera (colonne NULL: INSERT e DELETE).
                  -- ⚠️ p_stato nudo: e' il codice_interno di sei vocabolari
                  --   di stato diversi (polimorfo).
                  -- Nessun lock sulla tabella: true, come il database.
                  SELECT NOT EXISTS (
                           SELECT 1
                             FROM script.fn_doc_lock_montaggi(p_tabella) AS m
                            WHERE script.fn_doc_lock_colonna_bloccata(
                                    m.regola, p_stato, NULL::text[]) IS NOT NULL);
              $function$;

              COMMENT ON FUNCTION script.fn_doc_riga_modificabile(regclass, text)
              IS 'Check generica (2026-10-11, brief-db-testata-dopo-emissione §11, R-DB-3): con il documento in p_stato (codice_interno), una riga intera di p_tabella si aggiunge, si modifica e si toglie, o i lock «si tocca solo in bozza» la fermano? Legge il montaggio (script.fn_doc_lock_montaggi) e decide con la funzione del trigger (script.fn_doc_lock_colonna_bloccata, colonne NULL = la riga intera, come INSERT e DELETE): nessuna regola scritta qui, la capability specchia il lock. true se nessun lock ferma la riga; una tabella senza lock risponde true, come il database. Sorella di script.fn_doc_colonna_modificabile (la sola colonna). La usano le capability per i satelliti del documento: can_edit_indirizzi di ordine, DDT, preventivo, offerta e contratto, can_edit_utility dell''offerta.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_doc_riga_modificabile(regclass, text);
