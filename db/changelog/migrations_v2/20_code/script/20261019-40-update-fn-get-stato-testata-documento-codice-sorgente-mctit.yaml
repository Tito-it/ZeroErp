                  SELECT o.stato::text,
                         concat('La mail «', left(o.oggetto, 80), '»'),
                         o.data_insert = transaction_timestamp()
                    FROM config.email_outbox o
                   WHERE o.id = p_testata_id;

                ELSIF p_documento = 'RESO' THEN
                  -- rev 2026-09-28: il reso di vendita, per il guard dei suoi
                  -- rientri (vendite.trgfn_resi_righe_rientri_guard): stesso
                  -- rifiuto delle righe di documento, stessa etichetta.
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Reso ', COALESCE(r.numero, '#' || r.id::text)),
                         r.data_insert = transaction_timestamp()
                    FROM vendite.resi r
                    JOIN config.stati_doc_reso s ON s.id = r.stato_doc_reso_id
                   WHERE r.id = p_testata_id;

                ELSIF p_documento = 'COMMESSA' THEN
                  -- rev 2026-10-12 (brief-db-annullo-a-valle-riapre-a-monte, D-2):
                  -- la commessa, per l'avviso e la conferma dell'annullo con legami
                  -- (vendite.trgfn_doc_guard_annullo_con_legami,
                  -- vendite.fn_documento_ritira_legami): senza, la frase diceva
                  -- «COMMESSA #id». Lo stato e' quello di vendite.stati_commessa;
                  -- l'etichetta e' il codice, NOT NULL.
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Commessa ', COALESCE(c.codice, '#' || c.id::text)),
                         c.data_insert = transaction_timestamp()
                    FROM vendite.commesse c
                    JOIN vendite.stati_commessa s ON s.id = c.stato_commessa_id
                   WHERE c.id = p_testata_id;

                ELSE
                  -- Errore di CHIAMANTE, non di dato: nessuna persona sceglie
                  -- questo valore. Classe TECNICO, messaggio che nomina il
                  -- valore ricevuto (fratello di E_RUOLO_APPLICATIVO_NON_GESTITO).
                  PERFORM script.fn_log_and_raise_error(
                    'script',
                    'fn_get_stato_testata_documento',
                    'E_DOC_TIPO_NON_GESTITO',
                    jsonb_build_object('documento', p_documento,
                                       'testata_id', p_testata_id),
                    NULL::uuid,
                    COALESCE(p_documento, '<null>'));
                END IF;

                RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_stato_testata_documento(text, bigint) IS
                'Lettore SECURITY DEFINER dello stato e dell''etichetta di una testata di documento. Nasce il 2026-08-26 per vendite.trgfn_dlt_block_ordrig_ddtrig, che deve distinguere «la testata non c''e'' piu''» (CASCADE partito dalla testata) da «la testata non la vedo» (RLS). ⛔ SECURITY DEFINER perche'' quella distinzione e'' il perno della decisione: le testate hanno RLS — e dal 22-09 anche le righe (ddt_righe, ordini_righe, contratti_righe: letto dal catalogo) — e un guard che leggesse sotto RLS diventerebbe fail-open proprio per chi sta fuori perimetro. ⭐ CONTRATTO: zero righe = testata assente; una riga = stato (codice_interno) piu'' etichetta per l''operatore. Lo stato e'' NOT NULL su tutte le testate e la FK garantisce la riga di stato, quindi l''assenza di riga e'' un segnale non ambiguo. ⚠️ L''etichetta ripiega sull''id quando `numero` e'' NULL, che sui documenti in bozza e'' il caso normale, non un residuo. PERIMETRO: legge due colonne, non scrive, non espone dati riservati. Tipi ammessi: DDT | ORDINE | CONTRATTO | OFFERTA | EMAIL_BOZZA | RESO | PREVENTIVO | COMMESSA; qualunque altro valore e'' un errore di chiamante (E_DOC_TIPO_NON_GESTITO, TECNICO). Chiamanti: vendite.trgfn_doc_righe_lock_fuori_bozza, vendite.trgfn_dlt_block_ordrig_ddtrig, config.trgfn_email_allegato_guard_solo_bozza, vendite.trgfn_ddt_righe_prelievi_guard, vendite.trgfn_resi_righe_rientri_guard, script.trgfn_righe_guard_aggiunta_fuori_listino. rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso): + RESO (vendite.resi, stato da config.stati_doc_reso, etichetta «Reso <numero>»). rev 2026-10-04 (brief-db-righe-esclusione-solo-non-si-vende, R5a): + OFFERTA (vendite.offerte_commerciali, stato da config.stati_doc_offerte, etichetta «Offerta <codice>»), per il lock delle righe dell''offerta fuori bozza. rev 2026-10-08 (brief-db-righe-e-componenti-le-altre-famiglie §2.2): + PREVENTIVO (vendite.preventivi, stato da config.stati_doc_preventivi, etichetta «Preventivo <numero> rev. <rev>»: le revisioni condividono il numero), per il lock dei componenti del preventivo fuori bozza. rev 2026-10-11 (brief-db-testata-dopo-emissione §11, D-13 di Tid): + nata_in_transazione, vero se la testata e'' stata creata nella transazione corrente (data_insert = transaction_timestamp(): il default la scrive all''INSERT e nessun UPDATE la tocca, mentre xmin lo cambia anche un cambio di stato). La legge vendite.trgfn_doc_righe_lock_fuori_bozza per lasciar passare cio'' che un TRIGGER scrive alla nascita di un documento nato gia'' fuori bozza. rev 2026-10-12 (brief-db-annullo-a-valle-riapre-a-monte, D-2): + COMMESSA (vendite.commesse, stato da vendite.stati_commessa, etichetta «Commessa <codice>»), per l''avviso e la conferma dell''annullo con legami della commessa (vendite.trgfn_doc_guard_annullo_con_legami, vendite.fn_documento_ritira_legami), che senza dicevano «COMMESSA #id». Li leggono gia'', per gli altri documenti, anche vendite.fn_documento_ritira_legami e vendite.trgfn_doc_guard_annullo_con_legami (dal 2026-10-11).';
