# timestamp-senza-fuso: ammesso — `p_giorno::timestamp AT TIME ZONE <fuso>` e' il modo di avere la mezzanotte del giorno D NEL fuso dell'azienda; il timestamp e' un passaggio dell'espressione, la funzione restituisce timestamptz.
# script.fn_inizio_giorno_operativo — QUANDO COMINCIA IL GIORNO D, PER L'AZIENDA
#   brief-be-db-fe-un-solo-fuso-aziendale §5.1 D-2.
#
# ── IL DIFETTO CHE CHIUDE ───────────────────────────────────────────
#   Un filtro «dal giorno X al giorno Y» su una colonna timestamptz si
#   scriveva `col >= X::date AND col < Y::date + interval '1 day'`. Il cast
#   date -> timestamptz da' la mezzanotte nel fuso della SESSIONE: dal backend
#   (UTC) il giorno D andava dalle 02:00 alle 02:00 di Roma, e cio' che
#   succedeva fra mezzanotte e le 2 finiva nel giorno prima. Non dipende dai
#   dati: e' la struttura del predicato, e vale per ogni fuso diverso da
#   quello della sessione.
#
# ── LA FORMA ────────────────────────────────────────────────────────
#   `p_giorno::timestamp AT TIME ZONE <fuso>`: il cast date -> timestamp
#   (senza fuso) non dipende dalla sessione, e AT TIME ZONE lo legge come ora
#   locale del fuso dell'azienda. Ai cambi d'ora il giorno ha 23 o 25 ore, e
#   il confine li segue da se'.
#   Il predicato di un filtro diventa
#     col >= fn_inizio_giorno_operativo(da)
#     AND col < fn_inizio_giorno_operativo(a + 1)
#   con la funzione sui CONFINI, non sulla colonna: STABLE, valutata una volta
#   per scansione, il predicato resta servito dall'indice sulla colonna.
#   NULL -> NULL: i filtri sono opzionali (`%s IS NULL OR …`), e un confine
#   assente non e' un errore.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261009-42-create-fn-inizio-giorno-operativo-mctit.yaml

  - changeSet:
      id: 20261009-42-create-fn-inizio-giorno-operativo
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        script.fn_inizio_giorno_operativo(date): l'istante in cui comincia il giorno D nel
        fuso dell'azienda (fn_fuso_operativo). Confine dei filtri per giorno su colonne
        timestamptz, al posto del cast nel fuso della sessione.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT (count(*) FILTER (WHERE p.proname = 'fn_inizio_giorno_operativo') = 0
                      AND count(*) FILTER (WHERE p.proname = 'fn_fuso_operativo') = 1)::int
                FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname IN ('fn_inizio_giorno_operativo', 'fn_fuso_operativo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Tipi espliciti in firma e risultato: un giorno qualunque del
              -- calendario e l'istante in cui comincia. Servono filtri su
              -- colonne diverse, quindi non sono il riflesso di nessuna.
              CREATE OR REPLACE FUNCTION script.fn_inizio_giorno_operativo(p_giorno date)
               RETURNS timestamptz
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   L'ISTANTE in cui comincia il giorno p_giorno nel fuso
                  --   dell'azienda. Confine dei filtri per giorno su colonne
                  --   timestamptz: [inizio(D), inizio(D + 1)).
                  --
                  -- Regole:
                  --   - p_giorno::timestamp non dipende dalla sessione; AT TIME
                  --     ZONE lo legge come ora locale del fuso dell'azienda;
                  --   - il fuso lo legge e lo valida fn_fuso_operativo (sede
                  --     unica, fail-loud): qui non si rilegge il parametro;
                  --   - NULL -> NULL: un confine assente non e' un errore, i
                  --     filtri sono opzionali. Il fuso non si legge nemmeno.
                  -- =========================================================
                  IF p_giorno IS NULL THEN
                      RETURN NULL;
                  END IF;

                  RETURN p_giorno::timestamp AT TIME ZONE script.fn_fuso_operativo();
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_inizio_giorno_operativo(p_giorno date)
                IS 'L''ISTANTE in cui comincia il giorno p_giorno nel fuso dell''azienda (script.fn_fuso_operativo). ⭐ Confine dei filtri per giorno su colonne timestamptz: col >= fn_inizio_giorno_operativo(da) AND col < fn_inizio_giorno_operativo(a + 1), con la funzione sui confini e non sulla colonna, cosi'' il predicato resta servito dall''indice. ⛔ Sostituisce `%s::date` confrontato con un timestamptz, che da'' la mezzanotte nel fuso della SESSIONE (dal backend: UTC) e mette nel giorno sbagliato cio'' che succede fra la mezzanotte dell''azienda e quella della sessione. Ai cambi d''ora il giorno ha 23 o 25 ore e il confine li segue. NULL -> NULL (filtri opzionali). Fail-loud sul fuso ereditato da fn_fuso_operativo. Brief: brief-be-db-fe-un-solo-fuso-aziendale D-2 (20261009-42).';

              -- ⚠️ I GRANT di una funzione NUOVA non esistono finche' non si
              --    scrivono: il ciclo che li ridistribuisce gira in ci_apply.
              --    Il ruolo batch e' coperto dal provisioning (linee-guida-sql.md §11.6).
              GRANT EXECUTE ON FUNCTION script.fn_inizio_giorno_operativo(date) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_inizio_giorno_operativo(date);
