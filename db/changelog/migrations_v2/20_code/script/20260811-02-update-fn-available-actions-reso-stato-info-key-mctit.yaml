# I domini muti: la nota di stato arriva anche qui — reso.
#   Uno di quattro changeSet gemelli (20260811-01, 20260811-02, 20260811-03, 20260811-04):
#   contratto, reso, offerta, commessa. Slice §3 di
#   attivita-urgenti-del-10-08.md, aperta dalla
#   verifica del BE e decisa da Tid.
#
# 🔴 IL DIFETTO, e perche' e' peggiorato ieri. Questo dominio non emetteva
#   AFFATTO `stato_info_key`: la sua fn_available_actions_* non lo esponeva,
#   mentre il drawer del frontend lo legge gia' — il cablaggio c'era ed era
#   inerte. Fino a ieri la cosa si confondeva col comportamento generale
#   («la nota risponde alla barra vuota, e qui non compare mai»); da quando
#   la nota **spiega lo stato** e compare sempre (decisione §5 di Tid,
#   20260810-04/-05/-06), questi domini sono rimasti gli unici in cui uno
#   stato chiuso non dice niente. Verificato nel codice dal BE, non dedotto.
#
# ℹ️ COSA CAMBIA — gli stessi tre punti dei changeSet di ieri: una variabile,
#   una colonna nella SELECT di testata, un campo nel jsonb_build_object. La
#   funzione **raggiungeva gia'** la propria tabella di stato con un JOIN,
#   quindi non c'e' nessun JOIN nuovo da aggiungere.
#
# 🔴 LA PROPRIETA' NEL `meta` SI CHIAMA `nessuna_azione_key`, IL CAMPO DEL
#   BLOB `stato_info_key`. L'asimmetria e' voluta e va conosciuta:
#   `scripts/check_i18n_keys.py` trova le chiavi seminate **per quel nome**
#   (`RE_SEED_KEY` sui CSV, elenco `_PROP_KEY`), e rinominarla senza toccare
#   il guard nello stesso commit lo renderebbe **verde per cecita'** — non
#   rosso, verde. Rinominare anche la proprieta' e' una slice a se'.
#
# ⚠️ Il campo e' **sempre presente** nel blob, col valore a `null` quando non
#   si applica: filtrare con l'operatore di presenza risponde vero per TUTTI
#   i documenti. Va guardato il valore.
#
# 🟢 EFFETTO MISURATO: **9 documenti** — ANNULLATO (4) e CONFERMATO (5).
#   ⚠️ Nota che CONFERMATO e' una chiusura POSITIVA (fase CHIUSO, non
#   abortito): il testo non deve suonare come un fallimento.
#
# ⚠️ IL `lotto` NON E' IN QUESTA SLICE, ed e' una decisione: non ha una
#   tabella di stato propria, usa `config.stati_doc_fiscale` CONDIVISA con
#   `vendite.fatture` (8 FK). Il testo dovrebbe essere vero sia per un lotto
#   sia per una fattura, e `fn_available_actions_fattura` non esiste: meta'
#   dei consumatori non e' scritta. Restano dichiarati aperti.
#
# 🔴 CHIAVI i18n PER IL FE (dal seed di config/stati_doc_reso.csv), da tradurre: senza,
#   il guard `check_i18n_keys.py` resta rosso — ed e' voluto.
#
# Nessun'altra modifica al corpo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260811-02-update-fn-available-actions-reso-stato-info-key-mctit.yaml

  - changeSet:
      id: 20260811-02-update-fn-available-actions-reso-stato-info-key
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_reso: espone stato_info_key dal meta dello
        stato corrente, emesso sempre che lo stato lo dichiari. Il dominio
        era fra i cinque muti mentre il drawer leggeva gia' il campo.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: config
                tableName: stati_doc_reso
                columnName: meta
            - columnExists:
                schemaName: config
                tableName: stati_doc_reso
                columnName: fase
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'script'
                    AND p.proname = 'fn_available_actions_reso'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_reso(p_reso_id vendite.resi.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: capability reso per il detail API (data-driven,
              --   config.transizioni_stati_reso). Mirror ridotto di
              --   fn_available_actions_ddt (no push_commessa, no pdf).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-08-06: + target_state_descrizione, la forma leggibile
              --   dello stato di destinazione. Serve alla frase di conferma
              --   «portare il documento nello stato X»: il codice_interno non e'
              --   quella forma (DRAFT -> Bozza) e tradurlo nel FE sarebbe una
              --   seconda copia del vocabolario degli stati.
              --   rev 2026-08-11: + stato_info_key, la nota che spiega cosa sta
              --   succedendo quando il documento e' in uno stato chiuso. Arriva dal
              --   `meta` dello stato, e viene emessa SEMPRE che lo stato la dichiari —
              --   anche accanto a un'azione ancora abilitata: la nota spiega lo STATO,
              --   non risponde a una barra vuota (decisione §5 di Tid, gia' applicata a
              --   preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era
              --   fra i cinque che non emettevano affatto il campo, mentre il drawer lo
              --   legge gia': il cablaggio c'era ed era inerte.
              --   ⚠️ La PROPRIETA' nel meta si chiama `nessuna_azione_key` mentre il
              --   campo del blob si chiama `stato_info_key`. L'asimmetria e' voluta:
              --   scripts/check_i18n_keys.py trova le chiavi seminate per QUEL nome
              --   (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e rinominarla senza toccare
              --   il guard lo renderebbe verde per cecita'.
              --   ⚠️ Il campo e' SEMPRE presente nel blob, col valore a null quando non
              --   si applica: filtrare per presenza risponde vero per tutti i documenti,
              --   va guardato il valore.
              --   brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3.
              DECLARE
                  v_stato_id   vendite.resi.stato_doc_reso_id%TYPE;
                  v_stato_cod  config.stati_doc_reso.codice_interno%TYPE;
                  v_stato_info_key text;
                  v_actions    jsonb;
                  v_can_change boolean := false;
                  v_ha_righe   boolean := false;
                  c_non_edit_draft CONSTANT jsonb :=
                      '["numero","sorgente_tipo_id","sorgente_uid","billing_account_id","emittente_fiscale_id"]'::jsonb;
                  c_non_edit_tutti CONSTANT jsonb :=
                      '["numero","sorgente_tipo_id","sorgente_uid","billing_account_id","emittente_fiscale_id",'
                      '"destinatario_soggetto_ruolo_id","valuta_id","utility_id","data","meta"]'::jsonb;
              BEGIN
                  SELECT r.stato_doc_reso_id, sdr.codice_interno,
                         sdr.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_stato_info_key
                    FROM vendite.resi r
                    JOIN config.stati_doc_reso sdr ON sdr.id = r.stato_doc_reso_id
                   WHERE r.id = p_reso_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard di fn_conferma_reso
                  -- (E_RESO_SENZA_RIGHE): riga attiva.
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.resi_righe rr
                       WHERE rr.reso_id = p_reso_id
                         AND rr.attivo IS TRUE
                  );

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              'enabled',          NOT (COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                       AND NOT v_ha_righe),
                              'reason',           CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                            AND NOT v_ha_righe
                                                       THEN 'DOCUMENTO_SENZA_RIGHE' END,
                              'reason_key',       CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                            AND NOT v_ha_righe
                                                       THEN 'common.azione_reason.senza_righe' END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.transizioni_stati_reso t
                  JOIN config.stati_doc_reso sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Conta anche le azioni disabilitate: la barra azioni deve
                  -- comparire proprio per mostrare il pulsante grigio + tooltip.
                  v_can_change := jsonb_array_length(v_actions) > 0;

                  RETURN jsonb_build_object(
                      'available_actions',   v_actions,
                      'can_change_state',    v_can_change,
                      'can_edit_testata',    (v_stato_cod = 'DRAFT'),
                      'can_edit_righe',      (v_stato_cod = 'DRAFT'),
                      'non_editable_fields', CASE WHEN v_stato_cod = 'DRAFT'
                                                  THEN c_non_edit_draft
                                                  ELSE c_non_edit_tutti END,
                      'stato_info_key',      v_stato_info_key,
                      'stato_codice',        v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_reso(p_reso_id bigint)
              IS 'Capability reso per detail API: available_actions (matrice transizioni_stati_reso, filtro manuale) + can_change_state + can_edit_* + non_editable_fields + stato_codice. Mirror ridotto di fn_available_actions_ddt (no push/pdf). rev 2026-07-16: ogni azione espone enabled/reason/reason_key; se la transizione ha meta.requires_righe e il reso non ha righe attive -> enabled=false + reason DOCUMENTO_SENZA_RIGHE (predicato specchiato dal guard E_RESO_SENZA_RIGHE). rev 2026-08-06: + target_state_descrizione accanto a target_state (config.stati_doc_reso.descrizione della destinazione). Serve alla frase di conferma «portare il documento nello stato X»: il codice_interno non e'' la forma leggibile (DRAFT -> Bozza) e derivarla nel FE sarebbe una seconda copia del vocabolario degli stati. rev 2026-08-11: + stato_info_key, la nota di stato letta dal meta dello stato corrente ed emessa SEMPRE che lo stato la dichiari, anche accanto a un''azione ancora abilitata: la nota spiega lo STATO e non risponde a una barra vuota (decisione §5 di Tid, gia'' applicata a preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era fra i cinque che non emettevano affatto il campo mentre il drawer lo legge gia'': il cablaggio c''era ed era inerte. ⚠️ La PROPRIETA'' nel meta resta nessuna_azione_key mentre il campo del blob si chiama stato_info_key: scripts/check_i18n_keys.py trova le chiavi seminate per quel nome, e rinominarla senza toccare il guard lo renderebbe verde per cecita''. ⚠️ Il campo e'' SEMPRE presente nel blob, col valore a null quando non si applica: filtrare per presenza risponde vero per tutti i documenti, va guardato il valore. brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3.';
