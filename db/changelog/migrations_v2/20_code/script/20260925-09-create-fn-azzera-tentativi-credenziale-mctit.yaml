# ------------------------------------------------------------
# P-1 — L'AZZERAMENTO DEI TENTATIVI:
#   script.fn_azzera_tentativi_credenziale(p_auth_user_id, p_provenienza DEFAULT NULL)
#   Brief: brief-db-blocco-login-per-credenziale, sezione 3.2 (D-2)
#
# ── ⭐ UNA REGOLA, DUE CHIAMANTI, DUE PERIMETRI ──────────────────────
#   · ACCESSO RIUSCITO da una provenienza (ramo «successo» di
#     fn_registra_tentativo_login, con p_provenienza): azzera i fallimenti
#     consecutivi della credenziale e cancella la SOLA coppia (credenziale,
#     quella provenienza). ⛔ Non le altre: il freno sulla macchina di chi
#     attacca e' un fatto di QUELLA macchina, e se un accesso del titolare lo
#     cancellasse l'attaccante ripartirebbe con N tentativi nuovi a ogni login
#     riuscito. (Trovato scrivendo il pgTAP, 2026-09-25: la prima stesura del
#     brief diceva «un successo cancella le righe di provenienza».)
#   · RESET PASSWORD riuscito (backend, D-2, p_provenienza NULL): azzera i
#     fallimenti e cancella TUTTE le righe di provenienza. La password e'
#     cambiata: i tentativi fatti sulla vecchia, da chiunque, non contano piu'.
#   ⚠️ Qui NULL non e' un valore di chiave ma un perimetro dichiarato: «tutte le
#   provenienze». E' il solo punto in cui la provenienza puo' mancare.
#   ⚠️ Non si riusa fn_registra_tentativo_login(uid, …, true) dal reset: un
#   reset non e' un tentativo di login, e il nome mentirebbe nel giornale.
#
# ── ⛔ COSA NON TOCCA ────────────────────────────────────────────────
#   · il BLOCCO DELL'ADMIN (D-B3): il reset dimostra il possesso dell'email,
#     non annulla la decisione di chi ha bloccato. Lo toglie solo
#     script.fn_sblocca_credenziale;
#   · deve_cambiare_password: e' un'altra regola, con il suo verbo.
#
# ── ⚠️ NOME ─────────────────────────────────────────────────────────
#   Nella prima stesura del brief era «sblocco». «Sblocca» e' ora il verbo
#   dell'admin: questo si chiama con il suo nome.
#
# Senza riga non c'e' niente da azzerare: nessun errore. SECURITY DEFINER del
# PROPRIETARIO (l'app su queste tabelle ha solo SELECT), search_path bloccato.
# Nessun guard di permesso, dichiarato: lo chiamano il login (prima che esista
# un utente) e il reset (per token).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260925-09-create-fn-azzera-tentativi-credenziale-mctit.yaml

  - changeSet:
      id: 20260925-09-create-fn-azzera-tentativi-credenziale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_azzera_tentativi_credenziale(p_auth_user_id, p_provenienza DEFAULT NULL): azzera i
        fallimenti consecutivi della credenziale e cancella le righe di provenienza — la sola coppia
        con p_provenienza (accesso riuscito: il freno di un'altra macchina resta), tutte con NULL
        (reset password, D-2: la password e' cambiata). Non tocca il blocco dell'admin (D-B3) ne'
        deve_cambiare_password. SECURITY DEFINER del proprietario. Brief:
        brief-db-blocco-login-per-credenziale §3.2.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: config, tableName: credenziali_provenienze }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_azzera_tentativi_credenziale(
                  p_auth_user_id integer,
                  p_provenienza  config.credenziali_provenienze.provenienza%TYPE DEFAULT NULL
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: azzerare i tentativi falliti di una credenziale. Sempre i
              --   fallimenti consecutivi (attesa crescente); le righe di provenienza
              --   (freno): la sola coppia con p_provenienza, tutte con NULL.
              --   Non tocca il blocco dell'admin ne' il cambio password obbligatorio.
              DECLARE
                  v_credenziale_id config.credenziali.id%TYPE;
              BEGIN
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_azzera_tentativi_credenziale', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_auth_user_id', 'valore', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_azzera_tentativi_credenziale',
                                         'credenziale assente o non valida']);
                  END IF;

                  UPDATE config.credenziali c
                     SET fallimenti_consecutivi = 0,
                         ultimo_fallimento_at   = NULL
                   WHERE c.auth_user_id = p_auth_user_id
                  RETURNING c.id INTO v_credenziale_id;

                  -- Nessuna riga: niente da azzerare.
                  IF v_credenziale_id IS NULL THEN
                      RETURN;
                  END IF;

                  IF p_provenienza IS NULL THEN
                      -- Reset password: la password e' cambiata, nessun tentativo conta piu'.
                      DELETE FROM config.credenziali_provenienze p
                       WHERE p.credenziale_id = v_credenziale_id;
                  ELSE
                      -- Accesso riuscito: solo la coppia da cui si e' entrati.
                      DELETE FROM config.credenziali_provenienze p
                       WHERE p.credenziale_id = v_credenziale_id
                         AND p.provenienza    = p_provenienza;
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_azzera_tentativi_credenziale(integer, inet) IS
                  'Azzera i tentativi falliti di una credenziale. Sempre i fallimenti consecutivi (attesa crescente); le righe di provenienza (freno): con p_provenienza la sola coppia da cui si e'' entrati (accesso riuscito, ramo successo di fn_registra_tentativo_login — il freno sulla macchina di chi attacca resta), con NULL tutte (reset password riuscito, D-2: la password e'' cambiata e i tentativi sulla vecchia non contano piu''). Non tocca il blocco dell''admin (D-B3: lo toglie solo fn_sblocca_credenziale) ne'' deve_cambiare_password. Senza riga non c''e'' niente da azzerare. SECURITY DEFINER del PROPRIETARIO, non di un superuser, search_path bloccato; nessun guard di permesso, dichiarato (login e reset girano prima che esista un utente). Brief: brief-db-blocco-login-per-credenziale §3.2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_azzera_tentativi_credenziale(integer, inet);
