#   script.fn_check_fattura_eliminabile_da_lotto
#   Brief: brief-db-bom-flag-quantita-e-kit-in-fattura §14 (strada A di Tid, 2026-10-04).
#
#   Motivo 6 nuovo, in coda: script.fn_check_fatture_con_plafond_consumato
#   (20261004-07). Il consumo avviene PRIMA della numerazione, quindi il motivo
#   sul numero non lo copre: senza, il reset passerebbe il gate e poi
#   esploderebbe con un 23503 grezzo dentro fn_cleanup_fatture_by_ids.
#   Firma e risultato invariati: CREATE OR REPLACE. Il pulsante si spegne col
#   motivo perche' fn_available_actions_lotto legge questa stessa funzione.
#
#   Origine del corpo: doc auto-gen (corpo vivo), con un solo inserimento prima
#   del RETURN.
# ------------------------------------------------------------

