# GLI SMISTATORI DELLE NOTE DI CLIENTE E SHOP CHE RICEVONO IL PERIMETRO
#   script.fn_scope_note_cliente_perimetro(bigint, varchar, bigint)
#   script.fn_scope_note_shop_perimetro(bigint, varchar, bigint)
#   Brief: brief-db-perimetro-una-volta-famiglie-residue §8 (giro 4).
#
# Il PADRE partizionato vendite.note non eredita le policy delle partizioni:
# per le vesti di controparte smista su target_tipo. Gli smistatori di prima
# (fn_scope_note_cliente, fn_scope_note_shop) chiamavano per ogni nota una
# funzione di scope che ricalcolava il perimetro dell'identita'. Questi lo
# ricevono dalla policy (-39), calcolato una volta per istruzione da
# script.fn_get_identita_sr_perimetro, e per riga risolvono solo il cliente,
# con lo stesso modo delle policy delle partizioni (note_fatture: 'fattura',
# 20261021-32; note_ordini: 'ordine' e 'ordine_shop', -35 e -39). Come
# fn_scope_note_ef_perimetro per l'operatore (20261021-25).
# ⛔ L'ELSE false resta: un target_tipo senza ramo rende quelle note
#   invisibili alla controparte, non visibili.
# ⚠️ Il perimetro compare in ogni ramo: la funzione non si incorpora e resta
#   una chiamata per riga, col perimetro gia' valutato in InitPlan. COST 5000:
#   il risolutore che chiama legge tabelle.
# Firme %TYPE, INVOKER. Le copie di prima si ritirano nello stesso giro (-40).

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261021-38-create-fn-scope-note-controparte-perimetro-mctit.yaml

  - changeSet:
      id: 20261021-38-create-fn-scope-note-controparte-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Gli smistatori di scope del padre vendite.note per le vesti CLIENTE_PORTALE e SHOP_CUSTOMER ricevono il perimetro dalla policy e per riga risolvono solo il cliente. Giro 4 di brief-db-perimetro-una-volta-famiglie-residue.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE pronamespace = 'script'::regnamespace
                 AND proname IN ('fn_scope_note_cliente_perimetro', 'fn_scope_note_shop_perimetro')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('script.fn_resolve_controparte_sr_id(text,bigint)')
                 AND prosrc ~ 'ordine_shop'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_note_cliente_perimetro(
                  p_perimetro   anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  p_target_tipo vendite.note.target_tipo%TYPE,
                  p_target_id   vendite.note.target_id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE SECURITY INVOKER COST 5000
              AS $function$
                  -- Scopo: la nota e' del cliente che guarda? Smista su target_tipo per
                  --   il PADRE partizionato vendite.note, veste CLIENTE_PORTALE.
                  -- Il perimetro (il soggetto dell'identita') NON lo calcola lei: glielo
                  --   passa la policy in UNA sottoquery su
                  --   script.fn_get_identita_sr_perimetro, valutata una volta per
                  --   istruzione. Per riga resta il cliente della testata, dal
                  --   risolutore DEFINER con lo stesso modo della partizione.
                  -- ⛔ L'ELSE false e' la riga che conta: un target_tipo senza ramo
                  --   rende quelle note INVISIBILI al cliente, non visibili.
                  SELECT CASE p_target_tipo
                      WHEN 'FATTURA' THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('fattura', p_target_id))
                      WHEN 'ORDINE'  THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('ordine', p_target_id))
                      ELSE false
                  END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_note_cliente_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE) IS
              'Smistatore di scope per il PADRE partizionato vendite.note, veste CLIENTE_PORTALE: la nota e'' del cliente che guarda? Il perimetro (il soggetto dell''identita'') lo passa la policy, calcolato UNA volta per istruzione da script.fn_get_identita_sr_perimetro; per riga resta il cliente della testata, da script.fn_resolve_controparte_sr_id (FATTURA: modo fattura; ORDINE: modo ordine, gli stessi delle partizioni), confrontato da script.fn_scope_sr_perimetro (linee-guida-sql §10.3). ⛔ ELSE false: un target_tipo senza ramo rende quelle note invisibili al cliente. Rev 2026-10-21 (20261021-38, giro 4 di brief-db-perimetro-una-volta-famiglie-residue): prende il posto di fn_scope_note_cliente, che calcolava il perimetro per riga.';

              CREATE OR REPLACE FUNCTION script.fn_scope_note_shop_perimetro(
                  p_perimetro   anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  p_target_tipo vendite.note.target_tipo%TYPE,
                  p_target_id   vendite.note.target_id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE SECURITY INVOKER COST 5000
              AS $function$
                  -- Scopo: la nota e' del cliente shop che guarda? Smista su target_tipo
                  --   per il PADRE partizionato vendite.note, veste SHOP_CUSTOMER: solo
                  --   gli ordini, e solo quelli nati dallo shop (modo ordine_shop).
                  -- Il perimetro lo passa la policy, come in
                  --   script.fn_scope_note_cliente_perimetro.
                  -- ⛔ L'ELSE false e' la riga che conta: lo shop non vede le note di
                  --   fatture, offerte, bolle.
                  SELECT CASE p_target_tipo
                      WHEN 'ORDINE' THEN script.fn_scope_sr_perimetro(p_perimetro, script.fn_resolve_controparte_sr_id('ordine_shop', p_target_id))
                      ELSE false
                  END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_note_shop_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE) IS
              'Smistatore di scope per il PADRE partizionato vendite.note, veste SHOP_CUSTOMER: la nota e'' del cliente shop che guarda? Solo le note di ORDINE, e solo di ordini nati dallo shop: script.fn_resolve_controparte_sr_id modo ordine_shop, confrontato col perimetro che la policy calcola una volta per istruzione (script.fn_get_identita_sr_perimetro). ⛔ ELSE false. Rev 2026-10-21 (20261021-38, giro 4 di brief-db-perimetro-una-volta-famiglie-residue): prende il posto di fn_scope_note_shop, che calcolava il perimetro per riga.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION script.fn_scope_note_shop_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE);
              DROP FUNCTION script.fn_scope_note_cliente_perimetro(
                  anagrafiche.identita_digitali.soggetto_ruolo_id%TYPE,
                  vendite.note.target_tipo%TYPE,
                  vendite.note.target_id%TYPE);
