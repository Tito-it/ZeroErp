# Passo 2 (P-2a) — la gemella puntuale di 20260818-11.
#
# Stessa correzione, altro punto della catena: qui il fail-open era il ramo 5,
# «whitelist vuota -> true (nessuna restrizione)». Dopo P-2a un operatore senza
# riga non ha accesso a NESSUN emittente specifico.
#
# ⚠️ ATTENZIONE all'ordine dei rami, che NON cambia e non va toccato:
#    il ramo «job batch» (p_auth_user_id NULL -> true) resta il primo, e il ramo
#    dell'emittente attivo resta PRIMA del bypass super admin. Quest'ultimo e'
#    l'unico punto in cui la selezione puo' restringere chi vede tutto: e'
#    l'invariante «solo restringente, mai allargante» (rev 2026-08-04).
#
# brief-db-perimetro-emittente-liste-e-gerarchia-ba.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260818-12-update-fn-check-user-emittente-scope-fail-closed-mctit.yaml

  - changeSet:
      id: 20260818-12-update-fn-check-user-emittente-scope-fail-closed
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        P-2a, secondo punto: whitelist vuota passa da true (nessuna restrizione)
        a false (nessun accesso). Ordine dei rami invariato: batch prima,
        emittente attivo prima del bypass super admin. Brief §2.5, P-2a.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_has_identita_attiva';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_user_emittente_scope(
                  p_auth_user_id         integer,
                  p_emittente_fiscale_id bigint
              )
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_cnt    integer;
                  v_attivo bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica se un utente ha accesso a uno specifico
                  --   emittente fiscale. Sede unica read+write: la usano gli
                  --   adapter RLS e i trigger di guardia.
                  --
                  -- Regole (refactor §4.6.B.5, + emittente attivo 2026-08-04,
                  --         + P-2a 2026-08-18):
                  --   1. p_auth_user_id NULL -> true (job batch)
                  --   2. Emittente attivo diverso da quello richiesto -> false
                  --      (restringe CHIUNQUE, anche il super admin)
                  --   3. fn_is_super_admin -> true (vede tutto)
                  --   4. Assenza identita OPERATORE attiva -> false
                  --      (defensive: utente disabilitato non accede)
                  --   5. Whitelist vuota -> FALSE  ⬅ cambiato da P-2a
                  --   6. Whitelist popolata -> EXISTS match
                  -- =========================================================

                  -- 1. Job batch (nessun utente)
                  IF p_auth_user_id IS NULL THEN
                      RETURN true;
                  END IF;

                  -- 2. Emittente attivo (impersonazione di scope).
                  --    Deve precedere il ramo super admin: e' l'unico punto in
                  --    cui la selezione puo' restringere chi vede tutto.
                  --    IS DISTINCT FROM: con p_emittente_fiscale_id NULL
                  --    (riferimento non risolto dagli adapter) resta fail-closed.
                  v_attivo := NULLIF(
                                  current_setting('app.current_emittente_id', true),
                                  ''
                              )::bigint;

                  IF v_attivo IS NOT NULL
                     AND p_emittente_fiscale_id IS DISTINCT FROM v_attivo THEN
                      RETURN false;
                  END IF;

                  -- 3. Super admin? Bypass totale.
                  --    ⭐ L'unico attore legittimamente multi-emittente
                  --       (decisione Tid 2026-08-17). Non toccato da P-2a.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN true;
                  END IF;

                  -- 4. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN false;
                  END IF;

                  -- 5. Conta righe whitelist
                  SELECT count(*)
                    INTO v_cnt
                    FROM config.user_emittenti_fiscali uef
                   WHERE uef.auth_user_id = p_auth_user_id;

                  -- ⚠️ Rev 2026-08-18 (P-2a): era `RETURN true` con il commento
                  --   «nessuna restrizione». Un operatore senza riga aveva cosi'
                  --   accesso a QUALUNQUE emittente — mentre lo stesso utente,
                  --   sul lato scrittura, non poteva nemmeno creare un billing
                  --   account (fn_check_user_can_create_ba). Le due letture non
                  --   potevano essere entrambe intenzionali: la riga mancante e'
                  --   un errore di configurazione, non un permesso.
                  --   Brief perimetro-emittente §2.5.
                  IF v_cnt = 0 THEN
                      RETURN false;  -- nessun accesso: la riga manca
                  END IF;

                  -- 6. Verifica match specifico
                  RETURN EXISTS (
                      SELECT 1
                        FROM config.user_emittenti_fiscali uef
                       WHERE uef.auth_user_id         = p_auth_user_id
                         AND uef.emittente_fiscale_id = p_emittente_fiscale_id
                  );
              END
              $function$;

              COMMENT ON FUNCTION script.fn_check_user_emittente_scope(integer, bigint) IS
                  'Verifica accesso utente a emittente fiscale. Refactor §4.6.B.5: NULL '
                  'user/SUPER_ADMIN -> true; identita OPERATORE mancante -> false; altrimenti '
                  'match EXISTS. Post 2026-08-04: se la GUC app.current_emittente_id e'' '
                  'valorizzata e diversa dall''emittente richiesto -> false, PRIMA del bypass '
                  'super admin (impersonazione di scope: solo restringente, mai allargante). '
                  'Post 2026-08-18 (P-2a): whitelist VUOTA -> false e non piu'' true. Un '
                  'operatore senza riga in config.user_emittenti_fiscali non ha accesso a nessun '
                  'emittente: la riga mancante e'' un errore di configurazione, non un permesso. '
                  'Allinea la lettura alla scrittura, che gia'' rifiutava lo stesso utente. '
                  'Brief perimetro-emittente §2.5.';
      rollback:
        - sql:
            sql: |
              -- Nessun rollback automatico: tornare alla revisione precedente
              -- (20260804-13) riaprirebbe il fail-open sulla whitelist vuota.
              SELECT 1;
