# Liquibase changelog per Zero ERP
# UPDATE script.fn_get_user_actions_map
# Refactor set-based: elimina il loop per azione e risolve
# le abilitazioni in una sola query.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260410-15-update-fn-get-user-actions-map-set-based-mctit.yaml

  - changeSet:
      id: 20260410-15-update-fn-get-user-actions-map-set-based
      author: mctit
      comment: >
        Refactor set-based di fn_get_user_actions_map.
        Elimina il loop su config.azioni_processo e calcola la mappa
        JSONB in una sola query, leggendo una sola volta ruolo_sistema
        e unita_organizzativa_id.
      runOnChange: false
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: azioni_processo
        - tableExists:
            schemaName: config
            tableName: user_override_azioni
        - tableExists:
            schemaName: config
            tableName: profili_reparto_azioni
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION script.fn_get_user_actions_map(
                  p_auth_user_id  anagrafiche.risorse_umane_auth_user.auth_user_id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              DECLARE
                  v_ruolo  anagrafiche.risorse_umane_auth_user.ruolo_sistema%TYPE;
                  v_uo_id  anagrafiche.risorse_umane.unita_organizzativa_id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Ritorna la mappa completa delle azioni di processo
                  --   abilitate/disabilitate per l'utente.
                  --
                  -- Parametri:
                  --   p_auth_user_id: ID utente Django (auth_user.id)
                  --
                  -- Ritorna:
                  --   JSONB tipo {"genera_fatture_lotti": true,
                  --              "reset_lotto_draft": false, ...}
                  --
                  -- Catena:
                  --   1. ruolo_sistema (NULL/DISABILITATO -> false, ADMIN -> true)
                  --   2. Override utente azione (se presente e valido)
                  --   3. Profilo reparto azione (ereditato dalla UO)
                  --   4. Default -> false
                  --
                  -- Ottimizzazione:
                  --   Nessun loop PL/pgSQL per azione. Ruolo e UO vengono
                  --   letti una sola volta, poi la mappa viene costruita in
                  --   forma set-based con LEFT JOIN su override e profilo.
                  -- =========================================================

                  -- Guard: parametro obbligatorio e valido
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_user_actions_map',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'p_auth_user_id obbligatorio e > 0.'
                      );
                  END IF;

                  -- Lettura contesto utente una sola volta
                  SELECT rau.ruolo_sistema,
                         ru.unita_organizzativa_id
                    INTO v_ruolo,
                         v_uo_id
                    FROM anagrafiche.risorse_umane_auth_user rau
                    LEFT JOIN anagrafiche.risorse_umane ru
                      ON ru.id = rau.risorsa_umana_id
                   WHERE rau.auth_user_id = p_auth_user_id;

                  RETURN (
                      SELECT COALESCE(
                          jsonb_object_agg(
                              ap.permission_codename,
                              CASE
                                  WHEN v_ruolo IS NULL OR v_ruolo = 'DISABILITATO'
                                      THEN false
                                  WHEN v_ruolo = 'ADMIN'
                                      THEN true
                                  ELSE COALESCE(
                                      uoa.abilitata,
                                      pra.abilitata,
                                      false
                                  )
                              END
                          ),
                          '{}'::jsonb
                      )
                        FROM config.azioni_processo ap
                        LEFT JOIN config.user_override_azioni uoa
                          ON uoa.auth_user_id = p_auth_user_id
                         AND uoa.azione_id = ap.id
                         AND (uoa.valido_dal IS NULL OR uoa.valido_dal <= CURRENT_DATE)
                         AND (uoa.valido_al  IS NULL OR uoa.valido_al  >= CURRENT_DATE)
                        LEFT JOIN config.profili_reparto_azioni pra
                          ON pra.unita_organizzativa_id = v_uo_id
                         AND pra.azione_id = ap.id
                       WHERE ap.attivo = TRUE
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_user_actions_map(integer)
                IS 'Mappa azioni_processo abilitate per utente. Refactor set-based: JSONB {codename: boolean} senza loop PL/pgSQL, legge ruolo_sistema e UO una sola volta.';
