#
# Refactor script.fn_get_emittenti_scope_sr_ids come wrapper su
# fn_get_emittenti_scope_pk_ids (single source of truth, zero drift).
#
# Origine: brief preventivi rev2 §9 + analisi pattern SR vs PK 2026-05-02
# (vedi refactor-emittente-id-canonico.md §5.2).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260502-02-update-fn-get-emittenti-scope-sr-ids-as-wrapper-mctit.yaml

  - changeSet:
      id: 20260502-02-update-fn-get-emittenti-scope-sr-ids-as-wrapper
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      comment: >
        Refactor di fn_get_emittenti_scope_sr_ids come wrapper thin su
        fn_get_emittenti_scope_pk_ids. Mantiene firma e semantica identiche
        (no breaking change per i caller esistenti). Single source of truth
        dei guard nella fn _pk_ids canonica.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_get_emittenti_scope_pk_ids';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- ==========================================================
              -- script.fn_get_emittenti_scope_sr_ids — wrapper su _pk_ids
              --
              -- Refactor 2026-05-02: la fn e' diventata un wrapper thin su
              -- fn_get_emittenti_scope_pk_ids (canonica). Tutti i guard
              -- (no identita OPERATORE -> '{}', super admin -> NULL) sono
              -- gestiti dalla fn canonica. Questa fn fa solo la mappatura
              -- finale PK -> SR id per i caller che filtrano su colonne
              -- <ruolo>_soggetto_ruolo_id (fatture, ordini, commesse,
              -- listini, BA scope, search universale, ecc.).
              --
              -- Semantica (invariata):
              --   NULL             = nessuna restrizione
              --   '{}'::bigint[]   = nessun accesso
              --   array di SR id   = whitelist
              --
              -- Pass-through dei sentinel NULL e '{}': preservati senza
              -- toccare emittenti_fiscali (no orphan lookup).
              --
              -- Vedi guida soggetti-e-ruoli §5b per la decisione "quando
              -- usare _sr_ids vs _pk_ids".
              -- ==========================================================
              CREATE OR REPLACE FUNCTION script.fn_get_emittenti_scope_sr_ids(
                  p_auth_user_id integer
              )
              RETURNS bigint[]
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_pk_ids bigint[];
                  v_sr_ids bigint[];
              BEGIN
                  -- 1. Delega tutti i guard alla fn canonica _pk_ids.
                  v_pk_ids := script.fn_get_emittenti_scope_pk_ids(p_auth_user_id);

                  -- 2. Pass-through dei sentinel.
                  IF v_pk_ids IS NULL THEN
                      -- Super admin: nessuna restrizione.
                      RETURN NULL;
                  END IF;

                  IF cardinality(v_pk_ids) = 0 THEN
                      -- No identita OPERATORE attiva: nessun accesso.
                      RETURN '{}'::bigint[];
                  END IF;

                  -- 3. Mappatura PK -> SR id via JOIN su emittenti_fiscali.
                  SELECT array_agg(ef.soggetto_ruolo_id)
                    INTO v_sr_ids
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = ANY(v_pk_ids);

                  RETURN v_sr_ids;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_emittenti_scope_sr_ids(integer) IS
                  'Wrapper su fn_get_emittenti_scope_pk_ids (refactor 2026-05-02). '
                  'Mappa PK reali -> soggetto_ruolo_id per query su colonne '
                  '<ruolo>_soggetto_ruolo_id (fatture, ordini, commesse, listini, '
                  'BA scope, search universale). Semantica: NULL=tutto, ''{}''=nessuno, '
                  'array=whitelist. Single source of truth dei guard nella fn _pk_ids. '
                  'Vedi guida soggetti-e-ruoli §5b per quando usare _sr_ids vs _pk_ids.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS script.fn_get_emittenti_scope_sr_ids(integer);
