# ------------------------------------------------------------
# script.trgfn_seed_primo_impianto: la riga modificata dall'installazione non si
#   riscrive.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.1, §15.2, §16.2, D1-D10, Q10, Q18)
#
# -- IL CASO --------------------------------------------------------------
#   Un mirror loadUpdateData in runOnChange ricarica ogni colonna di ogni riga
#   del CSV appena il file cambia. Su una tabella che l'installazione configura
#   dall'interfaccia (config.email_account: host, porta, password SMTP) il
#   ritocco del CSV cancella la configurazione del cliente.
#
# -- CHI SCRIVE -----------------------------------------------------------
#   Il SOFTWARE e' la sessione del migratore (dbops.fn_sessione_del_migratore,
#   session_user). Tutto il resto e' l'INSTALLAZIONE: l'app, con o senza
#   app.jwt_user, un verbo DEFINER chiamato dall'app, un job.
#
# -- CHE COSA FA ----------------------------------------------------------
#   INSERT del software        → la riga entra in dbops.seed_righe («nata dal seed»)
#   INSERT dell'installazione  → passa: la riga e' dell'installazione
#   UPDATE del software:
#     riga di seed intatta     → passa (segue il CSV); in SOLO_INSERIMENTO no
#     riga personalizzata, o riga dell'installazione, o SOLO_INSERIMENTO
#                              → le colonne dell'installazione tornano da OLD;
#                                quelle del software passano. Su una riga
#                                personalizzata i valori scartati vanno nel
#                                registro e parte un WARNING; in
#                                SOLO_INSERIMENTO il salto e' muto (Q18)
#     porta di manutenzione aperta → passa tutto; la riga resta personalizzata (D6)
#   UPDATE dell'installazione:
#     riga di seed, cambia una colonna del software → E_SEED_COLONNA_DEL_SOFTWARE
#     riga di seed, cambia una colonna dell'installazione → passa e la riga
#                                diventa personalizzata (Q10: meta e audit non contano)
#     riga dell'installazione  → passa
#   DELETE di una riga di seed → E_SEED_RIGA_NON_CANCELLABILE, salvo la porta
#                                del migratore (il DELETE forward-only, §11.2),
#                                che toglie anche la riga dal registro
#   DELETE di una riga dell'installazione → passa
#
# -- PERCHE' RESTITUISCE NEW, NON NULL ------------------------------------
#   loadUpdateData su PostgreSQL scrive `UPDATE …; IF not found THEN INSERT`.
#   Con RETURN NULL l'UPDATE non tocca righe, parte l'INSERT e il migrate muore
#   in chiave duplicata. Con NEW rimesso a posto l'UPDATE riesce.
#
# -- PERCHE' PER PRIMO (a00) ----------------------------------------------
#   I guard che vengono dopo vedono i valori rimessi: un valore scartato non
#   puo' fermare il migrate. L'audit timbra data_update/user_update anche su una
#   riga che non cambia: su queste tabelle user_update dice «l'ultimo che ci e'
#   passato sopra» (D4); chi l'ha personalizzata lo dice il registro.
#
# -- SECURITY DEFINER -----------------------------------------------------
#   Scrive dbops.seed_righe, che l'app legge soltanto. Una funzione trigger non
#   si chiama direttamente, quindi l'app non puo' falsificare il registro. Chi
#   scrive si riconosce da session_user, che dentro la DEFINER resta il ruolo di
#   login. search_path stretto: i nomi sono tutti qualificati.
#
# -- LIMITI DICHIARATI ----------------------------------------------------
#   * TRUNCATE non passa da qui (trigger di riga).
#   * Il migratore che con la porta del lucchetto
#     (zeroerp.allow_lock_columns_override) cambia codice_interno su una riga in
#     SOLO_INSERIMENTO lo vede rimesso da OLD: apre anche la porta del seed.
#   * Un superuser o il migratore che scrive a mano (psql) e' il software: la
#     riga che inserisce e' «nata dal seed».
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261117-13-create-trgfn-seed-primo-impianto-mctit.yaml

  - changeSet:
      id: 20261117-13-create-trgfn-seed-primo-impianto
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.trgfn_seed_primo_impianto: sulle tabelle del seed di primo impianto il CSV crea la riga, e
        dopo che l'installazione l'ha modificata non la riscrive piu'; una riga di seed non si cancella.
        Brief: brief-db-seed-primo-impianto-non-si-riscrive.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'trgfn_seed_primo_impianto'
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc
               WHERE oid = to_regprocedure('dbops.fn_seed_primo_impianto_argomenti(text[])')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_class
               WHERE oid = to_regclass('dbops.seed_righe')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.trgfn_seed_primo_impianto()
               RETURNS trigger
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path = pg_catalog, pg_temp
              AS $function$
              DECLARE
                  v_arg       record;   -- riga di dbops.fn_seed_primo_impianto_argomenti
                  -- boolean nudo: la risposta di dbops.fn_sessione_del_migratore
                  v_software  boolean;
                  v_seed_id   dbops.seed_righe.id%TYPE;
                  v_pers      dbops.seed_righe.personalizzata_il%TYPE;
                  v_riga_id   dbops.seed_righe.riga_id%TYPE;
                  v_scartati  dbops.seed_righe.scartati%TYPE;
                  v_inst      dbops.automazione_seed_primo_impianto.colonne_installazione%TYPE;
                  v_sw        dbops.automazione_seed_primo_impianto.colonne_software%TYPE;
                  -- jsonb nudi: la riga intera, vecchia e nuova, e la toppa che
                  -- rimette le colonne; non il riflesso di una colonna
                  v_old       jsonb;
                  v_new       jsonb;
                  v_patch     jsonb;
                  -- text[] nudi: le colonne cambiate in questa scrittura, un
                  -- sottoinsieme degli elenchi calcolato qui
                  v_cambiate_inst text[];
                  v_cambiate_sw   text[];
              BEGIN
                  SELECT * INTO v_arg FROM dbops.fn_seed_primo_impianto_argomenti(TG_ARGV);

                  IF NOT v_arg.valido OR TG_LEVEL <> 'ROW' OR TG_WHEN <> 'BEFORE' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text, 'E_TRIGGER_ARGOMENTI_INVALIDI',
                          jsonb_build_object(
                              'table',     TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'tgargs',    to_jsonb(TG_ARGV),
                              'dettaglio', COALESCE(v_arg.dettaglio, 'atteso BEFORE … FOR EACH ROW')),
                          NULL::uuid,
                          format('%s: %s', TG_NAME, COALESCE(v_arg.dettaglio, 'atteso BEFORE … FOR EACH ROW')));
                  END IF;

                  v_software := dbops.fn_sessione_del_migratore();

                  -- ── INSERT ─────────────────────────────────────────────
                  IF TG_OP = 'INSERT' THEN
                      IF v_software THEN
                          v_riga_id := to_jsonb(NEW) ->> 'id';
                          IF v_riga_id IS NULL THEN
                              PERFORM script.fn_log_and_raise_error(
                                  'database', TG_NAME::text, 'E_TRIGGER_ARGOMENTI_INVALIDI',
                                  jsonb_build_object(
                                      'table',     TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                      'dettaglio', 'la tabella non ha una colonna id valorizzata'),
                                  NULL::uuid,
                                  format('%s: la tabella %s.%s non ha una colonna id valorizzata',
                                         TG_NAME, TG_TABLE_SCHEMA, TG_TABLE_NAME));
                          END IF;

                          INSERT INTO dbops.seed_righe (schema_name, table_name, riga_id, segnata_da)
                          VALUES (TG_TABLE_SCHEMA, TG_TABLE_NAME, v_riga_id, 'INSERT')
                          ON CONFLICT ON CONSTRAINT uq_seed_righe_tabella_riga DO NOTHING;
                      END IF;
                      RETURN NEW;
                  END IF;

                  -- ── UPDATE e DELETE: la riga e' nata dal seed? ─────────
                  v_old     := to_jsonb(OLD);
                  v_riga_id := v_old ->> 'id';

                  SELECT s.id, s.personalizzata_il
                    INTO v_seed_id, v_pers
                    FROM dbops.seed_righe s
                   WHERE s.schema_name = TG_TABLE_SCHEMA
                     AND s.table_name  = TG_TABLE_NAME
                     AND s.riga_id     = v_riga_id;

                  -- ── DELETE ─────────────────────────────────────────────
                  IF TG_OP = 'DELETE' THEN
                      IF v_seed_id IS NULL THEN
                          RETURN OLD;   -- riga dell'installazione
                      END IF;

                      IF script.fn_porta_manutenzione_aperta(
                             'zeroerp.allow_seed_primo_impianto_override', TG_RELID, TG_OP, v_riga_id) THEN
                          DELETE FROM dbops.seed_righe WHERE id = v_seed_id;
                          RETURN OLD;
                      END IF;

                      PERFORM script.fn_log_and_raise_error(
                          TG_TABLE_SCHEMA::text, TG_NAME::text, 'E_SEED_RIGA_NON_CANCELLABILE',
                          jsonb_build_object(
                              'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'id',    v_riga_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                      RETURN OLD;
                  END IF;

                  -- ── UPDATE: quali colonne sono cambiate ────────────────
                  v_new := to_jsonb(NEW);

                  IF v_arg.forma = 'COLONNA' THEN
                      v_inst := v_arg.colonne_installazione;
                      v_sw   := v_arg.colonne_software;
                  ELSE
                      -- Per riga: dell'installazione tutte le colonne non libere.
                      SELECT COALESCE(array_agg(a.attname::text ORDER BY a.attnum), ARRAY[]::text[])
                        INTO v_inst
                        FROM pg_catalog.pg_attribute a
                       WHERE a.attrelid = TG_RELID
                         AND a.attnum > 0
                         AND NOT a.attisdropped
                         AND a.attgenerated = ''
                         AND NOT (a.attname::text = ANY (v_arg.colonne_libere));
                      v_sw := ARRAY[]::text[];
                  END IF;

                  SELECT COALESCE(array_agg(k ORDER BY k), ARRAY[]::text[])
                    INTO v_cambiate_inst
                    FROM unnest(v_inst) AS k
                   WHERE (v_new -> k) IS DISTINCT FROM (v_old -> k);

                  SELECT COALESCE(array_agg(k ORDER BY k), ARRAY[]::text[])
                    INTO v_cambiate_sw
                    FROM unnest(v_sw) AS k
                   WHERE (v_new -> k) IS DISTINCT FROM (v_old -> k);

                  -- ── UPDATE dell'installazione ──────────────────────────
                  IF NOT v_software THEN
                      IF v_seed_id IS NULL THEN
                          RETURN NEW;   -- riga dell'installazione
                      END IF;

                      IF cardinality(v_cambiate_sw) > 0 THEN
                          PERFORM script.fn_log_and_raise_error(
                              TG_TABLE_SCHEMA::text, TG_NAME::text, 'E_SEED_COLONNA_DEL_SOFTWARE',
                              jsonb_build_object(
                                  'campo', v_cambiate_sw[1],
                                  'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                                  'id',    v_riga_id,
                                  'colonne', to_jsonb(v_cambiate_sw)),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]);
                      END IF;

                      IF cardinality(v_cambiate_inst) > 0 AND v_pers IS NULL THEN
                          UPDATE dbops.seed_righe
                             SET personalizzata_il = now(),
                                 personalizzata_da = COALESCE(NULLIF(current_setting('app.jwt_user', true), ''),
                                                              session_user::text)
                           WHERE id = v_seed_id;
                      END IF;
                      RETURN NEW;
                  END IF;

                  -- ── UPDATE del software ────────────────────────────────
                  IF v_seed_id IS NOT NULL AND v_riga_id IS DISTINCT FROM (v_new ->> 'id') THEN
                      -- La chiave della riga cambia: il registro la segue.
                      UPDATE dbops.seed_righe SET riga_id = v_new ->> 'id' WHERE id = v_seed_id;
                  END IF;

                  IF v_seed_id IS NOT NULL AND v_pers IS NULL AND v_arg.forma <> 'SOLO_INSERIMENTO' THEN
                      RETURN NEW;   -- riga di seed intatta: segue il CSV
                  END IF;

                  IF cardinality(v_cambiate_inst) = 0 THEN
                      RETURN NEW;   -- niente dell'installazione da scartare
                  END IF;

                  IF script.fn_porta_manutenzione_aperta(
                         'zeroerp.allow_seed_primo_impianto_override', TG_RELID, TG_OP, v_riga_id) THEN
                      RETURN NEW;   -- bonifica voluta: la riga resta personalizzata (D6)
                  END IF;

                  SELECT jsonb_object_agg(k, v_old -> k), jsonb_object_agg(k, v_new -> k)
                    INTO v_patch, v_scartati
                    FROM unnest(v_cambiate_inst) AS k;

                  NEW := jsonb_populate_record(NEW, v_patch);

                  IF v_seed_id IS NOT NULL AND v_arg.forma = 'SOLO_INSERIMENTO' THEN
                      RETURN NEW;   -- il salto atteso: muto (Q18)
                  END IF;

                  IF v_seed_id IS NOT NULL THEN
                      UPDATE dbops.seed_righe
                         SET scartati = v_scartati, scartati_il = now()
                       WHERE id = v_seed_id;
                      RAISE WARNING '%.% id %: riga personalizzata dall''installazione, non riscritte le colonne %',
                          TG_TABLE_SCHEMA, TG_TABLE_NAME, v_riga_id, array_to_string(v_cambiate_inst, ', ');
                  ELSE
                      RAISE WARNING '%.% id %: riga creata dall''installazione, non riscritte le colonne %',
                          TG_TABLE_SCHEMA, TG_TABLE_NAME, v_riga_id, array_to_string(v_cambiate_inst, ', ');
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_seed_primo_impianto() IS
                  'Sulle tabelle del seed di primo impianto (dbops.automazione_seed_primo_impianto) il CSV crea la riga, e dopo che l''installazione l''ha modificata non la riscrive piu''. BEFORE INSERT OR UPDATE OR DELETE FOR EACH ROW, in fase a00 (scatta per primo), montato dal runner dbops.fn_run_automations_seed_primo_impianto; argomenti secondo dbops.fn_seed_primo_impianto_argomenti (forma RIGA, COLONNA o SOLO_INSERIMENTO). Chi scrive: il software e'' la sessione del migratore (dbops.fn_sessione_del_migratore), tutto il resto e'' l''installazione. INSERT del software: la riga entra in dbops.seed_righe, nata dal seed. UPDATE del software: su una riga di seed intatta passa; su una riga personalizzata, su una riga dell''installazione o in SOLO_INSERIMENTO rimette da OLD le colonne dell''installazione e lascia passare quelle del software; su una riga personalizzata salva i valori scartati nel registro e alza un WARNING, in SOLO_INSERIMENTO tace. UPDATE dell''installazione su una riga di seed: una colonna del software cambiata e'' E_SEED_COLONNA_DEL_SOFTWARE (campo = la colonna); una colonna dell''installazione cambiata fa la riga personalizzata (meta, colonne d''audit e tx_id non contano). DELETE di una riga di seed: E_SEED_RIGA_NON_CANCELLABILE (la riga si spegne, attivo = false). Le righe dell''installazione si scrivono e si cancellano liberamente. Porta di manutenzione zeroerp.allow_seed_primo_impianto_override, solo per la sessione del migratore (script.fn_porta_manutenzione_aperta): lascia passare la bonifica e il DELETE forward-only, la riga resta personalizzata. Montaggio sbagliato: E_TRIGGER_ARGOMENTI_INVALIDI. Restituisce sempre la riga, mai NULL: il blocco UPDATE … IF not found THEN INSERT del mirror non va in chiave duplicata. SECURITY DEFINER, search_path pg_catalog: scrive il registro, che l''app legge soltanto.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ I trigger li monta il runner (20261117-15): toglierli prima.
              DROP FUNCTION IF EXISTS script.trgfn_seed_primo_impianto();
