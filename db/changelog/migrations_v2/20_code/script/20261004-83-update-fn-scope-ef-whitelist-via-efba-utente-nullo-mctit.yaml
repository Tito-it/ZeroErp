# script.fn_scope_ef_whitelist_via_efba: con l'utente NULL risponde FALSE.
#
#   E' l'adapter della policy rls_billing_account_ef_whitelist e aveva il suo
#   ramo «attore nullo = nessun filtro», dichiarato «coerente con la
#   canonica». La canonica cambia nello stesso giro (-82): la coerenza resta,
#   rovesciata. Corretto anche il commento interno, che diceva «whitelist
#   vuota = nessuna restrizione»: dal P-2a (2026-08-18)
#   fn_get_emittenti_scope_pk_ids restituisce '{}' per la whitelist vuota,
#   quindi questa funzione rispondeva gia' false — il commento era rimasto
#   indietro, e con lui il COMMENT ON.
#
#   ⚠️ Effetto sui pgTAP: un INSERT … RETURNING su billing_account con la
#   veste OPERATORE e l'utente vuoto ora e' rifiutato (il RETURNING passa
#   dalla policy di lettura). Riscritto il test 1 di
#   anagrafiche/test-billing-account-auto-link-ef.
#
# Brief: brief-db-esclusioni-implicite (Q-1).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-83-update-fn-scope-ef-whitelist-via-efba-utente-nullo-mctit.yaml

  - changeSet:
      id: 20261004-83-update-fn-scope-ef-whitelist-via-efba-utente-nullo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_scope_ef_whitelist_via_efba: utente NULL -> false (era true); commento sulla whitelist
        vuota allineato al P-2a. Brief: brief-db-esclusioni-implicite (Q-1).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_scope_ef_whitelist_via_efba'
                 AND pg_get_function_identity_arguments(p.oid) = 'p_auth_user_id integer, p_billing_account_id bigint';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_efba(p_auth_user_id integer, p_billing_account_id bigint)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_scope bigint[];
              BEGIN
                  -- Attore nullo: nessun accesso, come la canonica
                  -- fn_check_user_emittente_scope.
                  -- ⚠️ Rev 2026-10-04 (Q-1, brief-db-esclusioni-implicite): era
                  --    `RETURN true` («batch/sistema: nessun filtro»), cioe' una
                  --    sessione con la veste OPERATORE e l'utente vuoto vedeva ogni
                  --    billing account. Owner, superuser e BYPASSRLS non passano
                  --    dalle policy: non hanno bisogno di questo ramo.
                  IF p_auth_user_id IS NULL THEN
                      RETURN false;
                  END IF;

                  -- Scope emittenti dell'operatore (SR id), canonico:
                  --   NULL  = nessuna restrizione (solo super_admin)
                  --   '{}'  = nessun accesso (no identita OPERATORE attiva,
                  --           whitelist vuota dal P-2a, emittente attivo fuori scope)
                  --   array = whitelist SR
                  v_scope := script.fn_get_emittenti_scope_sr_ids(p_auth_user_id);

                  IF v_scope IS NULL THEN
                      RETURN true;                      -- accesso globale
                  END IF;

                  IF cardinality(v_scope) = 0 THEN
                      RETURN false;                     -- fail-closed
                  END IF;

                  -- Whitelist: il BA deve essere visibile (efba specifico o
                  -- default) per almeno uno degli emittenti in scope.
                  RETURN script.fn_check_ba_visible_for_emittenti(
                      p_billing_account_id, v_scope);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_efba(p_auth_user_id integer, p_billing_account_id bigint)
              IS 'Adapter via_efba dello scope EF_WHITELIST per billing_account: true se il BA e'' raggiungibile (mapping efba specifico-o-default) da almeno uno degli emittenti nello scope dell''operatore. Riusa fn_get_emittenti_scope_sr_ids ∩ fn_check_ba_visible_for_emittenti. Utente NULL -> false (rev 2026-10-04, Q-1: era true, come la canonica); super admin -> true; nessuna identita'' OPERATORE, whitelist vuota (P-2a) o emittente attivo fuori scope -> false. Nota perf: lo scope e'' query-constant (valutato una volta per auth_user_id); il costo per-riga e'' il lookup efba. Brief: brief-db-esclusioni-implicite Q-1.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_efba(p_auth_user_id integer, p_billing_account_id bigint)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_scope bigint[];
              BEGIN
                  -- Attore nullo (batch/sistema): nessun filtro (coerente con
                  -- la canonica fn_check_user_emittente_scope).
                  IF p_auth_user_id IS NULL THEN
                      RETURN true;
                  END IF;

                  -- Scope emittenti dell'operatore (SR id), canonico:
                  --   NULL  = nessuna restrizione (super_admin / whitelist vuota)
                  --   '{}'  = nessun accesso (no identita OPERATORE attiva)
                  --   array = whitelist SR
                  v_scope := script.fn_get_emittenti_scope_sr_ids(p_auth_user_id);

                  IF v_scope IS NULL THEN
                      RETURN true;                      -- accesso globale
                  END IF;

                  IF cardinality(v_scope) = 0 THEN
                      RETURN false;                     -- fail-closed
                  END IF;

                  -- Whitelist: il BA deve essere visibile (efba specifico o
                  -- default) per almeno uno degli emittenti in scope.
                  RETURN script.fn_check_ba_visible_for_emittenti(
                      p_billing_account_id, v_scope);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_efba(p_auth_user_id integer, p_billing_account_id bigint)
              IS 'Adapter via_efba dello scope EF_WHITELIST per billing_account: true se il BA e'' raggiungibile (mapping efba specifico-o-default) da almeno uno degli emittenti nello scope dell''operatore. Riusa fn_get_emittenti_scope_sr_ids ∩ fn_check_ba_visible_for_emittenti. NULL user/super_admin/whitelist vuota -> true; no identita -> false. Nota perf: lo scope e'' query-constant (valutato una volta per auth_user_id); il costo per-riga e'' il lookup efba.';
