# ------------------------------------------------------------
# script.fn_get_contatto_default: fra i predefiniti dei tipi vince il contesto
#   piu' specifico, non l'id piu' basso.
#   Correzione senza scelta, brief-db-revisione-anagrafiche §22 (S8).
#
# -- IL DIFETTO -------------------------------------------------------------------
#   fn_get_contatti da' un contatto per tipo; fra quelli predefiniti possono
#   esserci contesti diversi (il predefinito del soggetto per un tipo, quello del
#   ruolo per un altro). Vinceva l'id piu' basso, cioe' l'ordine di nascita: il
#   predefinito del soggetto, nato col soggetto, batteva quello del ruolo.
#
# -- LA REGOLA ----------------------------------------------------------------------
#   Vince il piu' specifico, istanza, poi ruolo, poi soggetto: la stessa regola
#   della cascata. A parita', l'id. Firma e colonne non cambiano; il corpo resta
#   una funzione SQL a stringa, come prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261125-39-update-fn-get-contatto-default-contesto-piu-specifico-mctit.yaml

  - changeSet:
      id: 20261125-39-update-fn-get-contatto-default-contesto-piu-specifico
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_contatto_default: fra i predefiniti vince il contesto piu' specifico (istanza,
        ruolo, soggetto), poi l'id. S8, brief-db-revisione-anagrafiche §22.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_contatto_default(
                  p_soggetto_id            uuid,
                  p_soggetto_ruolo_id      bigint  DEFAULT NULL::bigint,
                  p_istanza_utility_id     bigint  DEFAULT NULL::bigint,
                  p_tipo_contatto_id       integer DEFAULT NULL::integer,
                  p_unita_organizzativa_id integer DEFAULT NULL::integer)
              RETURNS TABLE(id bigint, tipo_contatto_id integer, soggetto_id uuid, soggetto_ruolo_id bigint,
                            istanza_utility_id bigint, nominativo character varying, email character varying,
                            telefono character varying, cellulare character varying, pec character varying,
                            note text, is_default boolean, default_context character varying)
              LANGUAGE sql
              AS $function$
              /*
              fn_get_contatto_default

              Il contatto predefinito per un soggetto (e opzionalmente ruolo,
              istanza, tipo di contatto, reparto), fra i candidati di
              fn_get_contatti: fra i predefiniti vince il contesto piu'
              specifico (istanza, poi ruolo, poi soggetto), poi l'id.
              Ritorna 0 o 1 record.
              */
              WITH all_candidates AS (
                  SELECT *
                  FROM script.fn_get_contatti(
                      p_soggetto_id,
                      p_soggetto_ruolo_id,
                      p_istanza_utility_id,
                      p_tipo_contatto_id,
                      p_unita_organizzativa_id
                  )
              ),
              only_default AS (
                  SELECT a.*,
                      ROW_NUMBER() OVER (
                          ORDER BY
                              CASE
                                  WHEN a.istanza_utility_id IS NOT NULL THEN 1
                                  WHEN a.soggetto_ruolo_id  IS NOT NULL THEN 2
                                  ELSE 3
                              END,
                              a.id
                      ) AS rn
                  FROM all_candidates a
                  WHERE a.is_default
              )
              SELECT
                  d.id,
                  d.tipo_contatto_id,
                  d.soggetto_id,
                  d.soggetto_ruolo_id,
                  d.istanza_utility_id,
                  d.nominativo,
                  d.email,
                  d.telefono,
                  d.cellulare,
                  d.pec,
                  d.note,
                  d.is_default,
                  d.default_context
              FROM only_default d
              WHERE d.rn = 1;
              $function$;

              COMMENT ON FUNCTION script.fn_get_contatto_default(uuid, bigint, bigint, integer, integer)
                  IS 'Il contatto predefinito per un soggetto (opz. ruolo, istanza, tipo, reparto), fra i candidati di script.fn_get_contatti: fra i predefiniti vince il contesto piu'' specifico (istanza, poi ruolo, poi soggetto), poi l''id. 0 o 1 record.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Forward-only: l'ordine per id era il difetto.
              SELECT 1;
