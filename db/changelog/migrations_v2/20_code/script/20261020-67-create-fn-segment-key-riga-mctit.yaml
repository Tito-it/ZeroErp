# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2e (G-8, L2e-2 = (a)): script.fn_segment_key_riga, chi legge la riga della chiave.
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-8, §13.3 (L2e-2 decisa da Tid il 2026-10-20).
#
#   La chiave d'idempotenza del push verso la commessa (vendite.commesse_attivita.segment_key) ha la
#   forma <SORGENTE>:<uid>[:R:<riga>][:M:<AAAA-MM>][#CMP:<componente>|#RET:<...>]. G-8: il prefisso
#   e' il codice della sorgente (ORDINE_VENDITA, non ORD), la costruisce un solo BB, e chi la legge
#   non ricopia split_part a mano. L2e-2 = (a): le rettifiche da reso non hanno sorgente
#   (chk_commesse_attivita_senza_sorgente_onere_rettifica), quindi «di che documento e'?» si legge
#   dalla chiave, con questi BB.
#   ⭐ LANGUAGE sql, senza SET: il planner li espande in linea (le funzioni veloci della merce
#   li usano dentro join e intervalli d'indice). I suffissi #CMP:/#RET: restano a chi li scrive.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261020-67-create-fn-segment-key-riga-mctit.yaml

  - changeSet:
      id: 20261020-67-create-fn-segment-key-riga
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_segment_key_riga: la riga del documento letta dalla chiave del push. Grammatica unica, 2e (G-8, L2e-2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_segment_key_riga(
                  p_segment_key vendite.commesse_attivita.segment_key%TYPE)
              -- l'id della riga del documento: polimorfo (righe di tabelle diverse)
              RETURNS bigint
              LANGUAGE sql
              IMMUTABLE
              SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: la riga del documento da cui viene una riga di
              --   commessa, letta dalla chiave (:R:<riga>); NULL se la chiave
              --   non ne ha (consumi, righe a mano).
              -- Nessun SET: si espande in linea.
              -- Brief: brief-db-grammatica-unica-documenti §13.3 (2e).
              -- =========================================================
              SELECT substring(p_segment_key FROM ':R:([0-9]+)')::bigint;
              $function$;

              COMMENT ON FUNCTION script.fn_segment_key_riga(vendite.commesse_attivita.segment_key%TYPE) IS
                'La riga del documento da cui viene una riga di commessa, letta dalla chiave (:R:<riga>); NULL se la chiave non ne ha. LANGUAGE sql IMMUTABLE senza SET: si espande in linea. Brief: brief-db-grammatica-unica-documenti §13.3.';

              GRANT EXECUTE ON FUNCTION script.fn_segment_key_riga(vendite.commesse_attivita.segment_key%TYPE) TO zeroerp_app;

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION script.fn_segment_key_riga(vendite.commesse_attivita.segment_key%TYPE);
