# LA CREAZIONE DI UN UTENTE TECNICO DIVENTA UN VERBO DEFINER COL SUO PERMESSO
#   script.fn_crea_utente_tecnico
#   Brief: brief-db-porte-aperte-dalla-sola-guc §14 (giro 10-bis; D-AC a, D-AD b, D-AE a, D-AF a di Tid, 2026-11-26).
#
#   1. SECURITY DEFINER, search_path pg_catalog, public, pg_temp: lo scope e i
#      legami sono in sola lettura per l'app (90_end/20261126-24).
#   2. Il permesso in prima riga: script.fn_guard_super_admin, lo stesso
#      controllo dell'endpoint (ProcessiIdentitaView, AdminAPIView), salvo la
#      SESSIONE DEL MIGRATORE: i seed 80_data 20260904-27 e -39 creano gli utenti
#      tecnici senza utente in sessione, e su un database da zero girano dopo
#      questo changeSet (dbops.fn_sessione_del_migratore, come la pubblicazione
#      dei template). Dentro un verbo DEFINER il proprietario e' chiunque lo
#      chiami: l'eccezione si riconosce dalla sessione, non dal proprietario.
#   3. Il corpo passa alla primitiva script.fn_applica_crea_utente_tecnico
#      (20261126-13). Firma ancorata come nella revisione precedente
#      (20261123-71); RETURNS ancorato (integer, come al vivo).
#   Corpo di prima dal catalogo di dbdev. L'EXECUTE all'app resta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261126-14-update-fn-crea-utente-tecnico-definer-guard-mctit.yaml

  - changeSet:
      id: 20261126-14-update-fn-crea-utente-tecnico-definer-guard
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_crea_utente_tecnico: SECURITY DEFINER col guard del SUPER_ADMIN (non per la sessione del migratore), il corpo nella primitiva script.fn_applica_crea_utente_tecnico. brief-db-porte-aperte-dalla-sola-guc §14.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_crea_utente_tecnico(
                  p_processo_codice   dbops.processi.codice%TYPE,
                  p_emittente_codice  anagrafiche.emittenti_fiscali.codice%TYPE,
                  p_profilo_codice    config.profili_accesso.codice%TYPE DEFAULT NULL)
               RETURNS anagrafiche.identita_digitali.auth_user_id%TYPE
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- Scopo:
              --   Il verbo con cui il SUPER_ADMIN crea l'utente tecnico di un processo
              --   automatico per un emittente. E' la strada dell'endpoint dei processi.
              --
              -- Regole:
              --   - SECURITY DEFINER: il permesso e' qui, in prima riga, e chiede lo stesso
              --     controllo dell'endpoint, il SUPER_ADMIN (script.fn_guard_super_admin:
              --     E_PERMESSO_NEGATO, anche senza utente);
              --   - la sessione del migratore (dbops.fn_sessione_del_migratore) crea gli
              --     utenti tecnici di seed senza utente e non passa dal guard: e' il software;
              --   - la creazione la fa la primitiva script.fn_applica_crea_utente_tecnico,
              --     che l'app non esegue.
              DECLARE
                  v_utente config.user_emittenti_fiscali.auth_user_id%TYPE;
              BEGIN
                  -- Il permesso, prima di ogni altra cosa.
                  IF NOT dbops.fn_sessione_del_migratore() THEN
                      v_utente := script.fn_utente_di_sessione('script.fn_crea_utente_tecnico');
                      PERFORM script.fn_guard_super_admin(v_utente);
                  END IF;

                  RETURN script.fn_applica_crea_utente_tecnico(p_processo_codice, p_emittente_codice, p_profilo_codice);
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_crea_utente_tecnico(p_processo_codice text, p_emittente_codice character varying, p_profilo_codice character varying)
              IS 'Il verbo con cui il SUPER_ADMIN crea l''utente tecnico di un processo automatico per un emittente: utente Django con password inutilizzabile e username processo@emittente, soggetto dedicato col suo contatto, ruolo PROC_AUTO, identità OPERATORE col flag tecnica, la riga di perimetro in config.user_emittenti_fiscali e il legame in dbops.processi_identita; ritorna l''auth_user_id. SECURITY DEFINER: in prima riga chiede il SUPER_ADMIN all''utente di sessione (script.fn_guard_super_admin: E_PERMESSO_NEGATO, anche senza utente), lo stesso controllo dell''endpoint; la sessione del migratore (dbops.fn_sessione_del_migratore) crea gli utenti tecnici di seed senza utente e non passa dal guard. La creazione la fa la primitiva script.fn_applica_crea_utente_tecnico, che l''applicazione non esegue: l''emittente è obbligatorio e costitutivo (un processo che serve N emittenti ha N utenti tecnici), il profilo è facoltativo e solo AD_HOC, mai SUPER_ADMIN; processo inesistente E_PROCESSO_NON_TROVATO, non eleggibile E_PROCESSO_NON_ELEGGIBILE_UTENTE_TECNICO, già presente E_UTENTE_TECNICO_GIA_ESISTE, username già usato E_UTENTE_TECNICO_DA_RIATTIVARE (il verbo giusto è script.fn_riattiva_utente_tecnico).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_crea_utente_tecnico(p_processo_codice text, p_emittente_codice character varying, p_profilo_codice character varying DEFAULT NULL::character varying)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- ⚠️ Niente %TYPE su django.*.
                  v_auth_user_id     integer;
                  v_processo         dbops.processi%ROWTYPE;
                  v_emittente        anagrafiche.emittenti_fiscali%ROWTYPE;
                  v_profilo          config.profili_accesso%ROWTYPE;
                  v_tipo_ruolo_id    config.tipi_ruoli.id%TYPE;
                  v_tipo_contatto_id anagrafiche.contatti.tipo_contatto_id%TYPE;
                  v_stato_id         anagrafiche.soggetti.stato_id%TYPE;
                  v_soggetto_id      anagrafiche.soggetti.id%TYPE;
                  v_sog_ruolo_id     anagrafiche.soggetti_ruoli.id%TYPE;
                  v_identita_id      anagrafiche.identita_digitali.id%TYPE;
                  v_username         text;
              BEGIN
                  -- Guard 1: il processo vuole davvero un utente tecnico.
                  --   ⛔ I processi su canale CODA no: girano con lo scope
                  --   dell'operatore che li accoda.
                  SELECT * INTO v_processo
                    FROM dbops.processi
                   WHERE codice = p_processo_codice;

                  -- ⭐ Rev 2026-09-05: «non esiste» e «esiste ma non e' eleggibile» erano lo
                  --   STESSO errore, e mandano a cercare in due posti diversi: il primo nel
                  --   seed del catalogo, il secondo nella riga che c'e' gia'.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_PROCESSO_NON_TROVATO',
                          jsonb_build_object('processo_codice', p_processo_codice),
                          NULL::uuid, p_processo_codice);
                  END IF;

                  IF script.fn_e_obsoleto(v_processo.obsoleto_dal)
                     OR v_processo.classe <> 'DOMINIO'
                     OR v_processo.canale NOT IN ('PGAGENT', 'COMMAND', 'CODA_AUTOMATICA') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_PROCESSO_NON_ELEGGIBILE_UTENTE_TECNICO',
                          jsonb_build_object('processo_codice', p_processo_codice),
                          NULL::uuid, p_processo_codice);
                  END IF;

                  -- Guard 2: l'emittente, OBBLIGATORIO e costitutivo.
                  SELECT * INTO v_emittente
                    FROM anagrafiche.emittenti_fiscali
                   WHERE codice = script.fn_codice_normalizzato(p_emittente_codice);

                  IF NOT FOUND OR NOT v_emittente.attivo THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_UTENTE_TECNICO_EMITTENTE_NON_VALIDO',
                          jsonb_build_object('emittente_codice', p_emittente_codice),
                          NULL::uuid, p_emittente_codice);
                  END IF;

                  -- Guard 3: il profilo, SE indicato — di norma non lo e'.
                  IF p_profilo_codice IS NOT NULL THEN
                      SELECT * INTO v_profilo
                        FROM config.profili_accesso
                       WHERE codice = script.fn_codice_normalizzato(p_profilo_codice);

                      IF NOT FOUND
                         OR NOT v_profilo.attivo
                         OR v_profilo.tipo <> 'AD_HOC'::config.tipo_profilo_accesso THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'script.fn_crea_utente_tecnico',
                              'E_UTENTE_TECNICO_PROFILO_VIETATO',
                              jsonb_build_object('profilo_codice', p_profilo_codice),
                              NULL::uuid, p_profilo_codice);
                      END IF;
                  END IF;

                  -- Guard 4: uno per processo PER EMITTENTE. Ci si ferma prima
                  --   dell'unique: un 23505 nudo non direbbe quale regola.
                  IF EXISTS (
                      SELECT 1
                        FROM dbops.processi_identita pi
                        JOIN config.user_emittenti_fiscali uef
                          ON uef.auth_user_id = pi.auth_user_id
                       WHERE pi.processo_id = v_processo.id
                         AND pi.attivo
                         AND uef.emittente_fiscale_id = v_emittente.id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_UTENTE_TECNICO_GIA_ESISTE',
                          jsonb_build_object('processo_codice', p_processo_codice,
                                             'emittente_codice', p_emittente_codice),
                          NULL::uuid, p_processo_codice);
                  END IF;

                  SELECT id INTO v_tipo_ruolo_id
                    FROM config.tipi_ruoli WHERE codice_interno = 'PROC_AUTO';
                  -- D-T5-6 b: il tipo proposto, non 'PRINCIPALE' scritto nel corpo.
                  v_tipo_contatto_id := script.fn_tipo_contatto_proposto_id('script.fn_crea_utente_tecnico');
                  -- Rev 2026-10-18 (D-1 di Tid): lo stato proposto, non 'IT' nel codice.
                  v_stato_id := script.fn_stato_proposto_id('script.fn_crea_utente_tecnico');

                  -- ⭐ Lo username porta ENTRAMBI: e' un badge per posto di
                  --   lavoro, e il posto di lavoro qui e' (processo, emittente).
                  --   Cosi' resta unico e leggibile quando gli emittenti sono N.
                  -- ⛔ Col codice SALVATO dell'emittente, non con quello ricevuto
                  --   (rev 2026-11-04): 'P@deva' accanto a 'P@DEVA' sarebbe un secondo
                  --   utente per lo stesso posto di lavoro.
                  v_username := p_processo_codice || '@' || v_emittente.codice;

                  -- ⚠️ NON confondere questo guard col guard 4 qui sopra, e i due codici
                  --   NON sono intercambiabili perche' i loro messaggi hanno un numero
                  --   DIVERSO di segnaposto:
                  --     guard 4  E_UTENTE_TECNICO_GIA_ESISTE     1 %s  «esiste ed e' ATTIVO»
                  --     qui      E_UTENTE_TECNICO_DA_RIATTIVARE  2 %s  «esiste ed e' SPENTO»
                  --   ⛔ Rinominarne uno «per uniformita'» fa crashare format(). E' successo:
                  --     una sostituzione globale del nome ha toccato anche il guard 4, e a
                  --     prenderlo e' stato il presidio
                  --     db/pgtap/script/test-catalogo-messaggi-errore-completo.sql.
                  -- ⛔ IL MURO CHE NON PARLAVA. Il guard sul duplicato piu' sopra guarda
                  --   dbops.processi_identita.attivo; lo username NO, e il suo UNIQUE su
                  --   django.auth_user non ha condizioni. ⇒ Disattivare il legame — che e' la
                  --   via documentata per sostituire l'utente di un processo — liberava il
                  --   guard e lasciava in piedi `auth_user_username_key`: un 23505 NUDO, che
                  --   non dice quale regola sia stata toccata.
                  --   ⭐ Qui ci si ferma prima, e si indica il verbo giusto: l'utente non va
                  --     rifatto, va RIATTIVATO (script.fn_riattiva_utente_tecnico).
                  IF EXISTS (SELECT 1 FROM django.auth_user au WHERE au.username = v_username) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_UTENTE_TECNICO_DA_RIATTIVARE',
                          jsonb_build_object('processo_codice',  p_processo_codice,
                                             'emittente_codice', p_emittente_codice,
                                             'username',         v_username),
                          NULL::uuid, p_processo_codice, p_emittente_codice);
                  END IF;

                  -- 1. L'utente Django, con password INUTILIZZABILE ('!' e' la
                  --    convenzione Django per «non puo' autenticarsi»).
                  INSERT INTO django.auth_user
                      (password, is_superuser, username, first_name, last_name,
                       email, is_staff, is_active, date_joined)
                  VALUES ('!' || md5(random()::text || clock_timestamp()::text),
                          false, v_username, '', '', '', false, true, now())
                  RETURNING id INTO v_auth_user_id;

                  -- 2. Il soggetto, uno per (processo, emittente).
                  --    `codice` NULL -> lo genera trgfn_soggetti_gen_codice;
                  --    `tipo_soggetto_dettaglio_id` NULL -> i guard differiti su
                  --    indirizzi e dati societari escono da soli.
                  INSERT INTO anagrafiche.soggetti
                      (ragione_sociale, stato_id)
                  VALUES ('Processo automatico: ' || v_username, v_stato_id)
                  RETURNING id INTO v_soggetto_id;

                  -- 3. Il contatto di riferimento: il guard differito sui
                  --    contatti ammette esplicitamente `is_default` coi canali
                  --    vuoti, ed e' la verita' — un processo canali non ne ha.
                  --    (BB anagrafiche.fn_crea_contatto, rev 2026-10-17)
                  PERFORM anagrafiche.fn_crea_contatto(
                      v_soggetto_id, NULL,
                      jsonb_build_object('tipo_contatto_id', v_tipo_contatto_id,
                                         'nominativo',       'Processo automatico: ' || v_username,
                                         'is_default',       true));

                  -- Padre e figlio in ISTRUZIONI SEPARATE: una CTE unica
                  -- condividerebbe la stessa snapshot.
                  INSERT INTO anagrafiche.soggetti_ruoli
                      (soggetto_id, tipo_ruolo_id)
                  VALUES (v_soggetto_id, v_tipo_ruolo_id)
                  RETURNING id INTO v_sog_ruolo_id;

                  -- 4. L'identita': OPERATORE (ogni policy RLS lo pretende in
                  --    AND) + flag tecnica, che sceglie il ramo PROC_AUTO del
                  --    guard di coerenza.
                  INSERT INTO anagrafiche.identita_digitali
                      (soggetto_ruolo_id, auth_user_id, ruolo_applicativo, tecnica)
                  VALUES (v_sog_ruolo_id, v_auth_user_id,
                          'OPERATORE'::config.ruolo_applicativo, true)
                  RETURNING id INTO v_identita_id;

                  -- 5. ⭐ IL PERIMETRO. Una riga sola, perche' la tabella e'
                  --    1-a-1 sull'utente. Non e' il sistema che si concede un
                  --    permesso: l'emittente e' arrivato come parametro, deciso
                  --    da chi ha scritto la chiamata (D-9).
                  INSERT INTO config.user_emittenti_fiscali
                      (auth_user_id, emittente_fiscale_id)
                  VALUES (v_auth_user_id, v_emittente.id);

                  -- 6. Il binding SOLO se un profilo e' stato chiesto.
                  IF p_profilo_codice IS NOT NULL THEN
                      -- rev 2026-10-18: il BB del binding (regola del 2).
                      PERFORM config.fn_lega_profilo_identita(v_profilo.id, v_identita_id);
                  END IF;

                  -- 7. Il legame processo -> utente.
                  INSERT INTO dbops.processi_identita
                      (processo_id, auth_user_id)
                  VALUES (v_processo.id, v_auth_user_id);

                  RETURN v_auth_user_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_crea_utente_tecnico(p_processo_codice text, p_emittente_codice character varying, p_profilo_codice character varying)
              IS 'Crea l''utente tecnico di un processo automatico PER UN EMITTENTE: utente Django con password inutilizzabile e username processo@emittente, soggetto dedicato col suo contatto, soggetto_ruolo PROC_AUTO, identita'' OPERATORE col flag tecnica, la riga di perimetro in config.user_emittenti_fiscali e il legame in dbops.processi_identita. Ritorna l''auth_user_id. ⭐ L''emittente e'' OBBLIGATORIO e costitutivo: config.user_emittenti_fiscali e'' 1-a-1 sull''utente, quindi un processo che serve N emittenti ha N utenti tecnici. ⚠️ La funzione non SCEGLIE l''emittente (D-9), lo riceve da chi scrive la chiamata; lo cerca, come il profilo, con script.fn_codice_normalizzato, e compone lo username col codice SALVATO dell''emittente. Il codice del processo resta com''e'' (dbops.processi e'' in eccezione a CODICE_MAIUSCOLO). Il profilo e'' facoltativo e di norma non si passa; se indicato dev''essere AD_HOC, e il binding lo scrive config.fn_lega_profilo_identita. ⛔ Mai SUPER_ADMIN. Accetta i canali eleggibili all''identita'' tecnica, CODA_AUTOMATICA compresa; il canale CODA «umano» si rifiuta, perche'' li'' l''identita'' la porta l''operatore che accoda. Processo inesistente: E_PROCESSO_NON_TROVATO; username gia'' presente: E_UTENTE_TECNICO_DA_RIATTIVARE, che indica il verbo giusto, script.fn_riattiva_utente_tecnico. Il contatto lo scrive anagrafiche.fn_crea_contatto, col tipo proposto (script.fn_tipo_contatto_proposto_id); lo stato del soggetto e'' lo stato proposto (script.fn_stato_proposto_id). Tutti e due li chiede col proprio nome, il livello «function» della cascata degli override.';
