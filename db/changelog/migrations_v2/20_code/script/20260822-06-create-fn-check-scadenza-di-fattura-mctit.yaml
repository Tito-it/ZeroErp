# ------------------------------------------------------------
# «QUESTA RATA E' DI QUESTA FATTURA?» — la domanda che la RLS non lascia fare
#   script.fn_check_scadenza_di_fattura — passo S2-3 (lotto 5)
#   Piano: brief-db-posting-e-abbinamento-rata.md
#          §2.2 S2-3 · Decisione: brief madre D14-b
#
# ── 🔴 PERCHE' NON PUO' FARLA IL GUARD DA SOLO ────────────────────────
#   Il guard di coerenza deve rispondere a una domanda **di fatto**: la rata
#   citata appartiene alla fattura di quella riga? Ma `vendite.fatture_scadenze`
#   ha la **RLS attiva**, e un guard che legge sotto RLS **non distingue «non
#   appartiene» da «non la vedo»**.
#
#   Le due cose portano allo stesso `EXISTS` falso e a due verità opposte:
#   la prima e' un'incoerenza da rifiutare, la seconda e' una riga legittima
#   che l'operatore non ha il diritto di guardare. Rifiutarle con lo stesso
#   messaggio significa **dire una cosa falsa** in uno dei due casi.
#
#   ⇒ La domanda di fatto si fa **fuori dalla row security**, e la risposta e'
#   un booleano su una coppia che il chiamante ha gia' nominato: nessuna riga
#   esce, nessun elenco si allarga.
#
#   ℹ️ Diverso e' il caso della FK: i controlli di integrita' referenziale
#   PostgreSQL li esegue **gia'** fuori dalla row security. La FK sa che la
#   rata esiste; questa funzione sa **di chi e'**.
#
# ── ⚠️ `fn_check_*`, quindi NON solleva ───────────────────────────────
#   Convenzione del progetto: `fn_check_*` verifica e risponde, `fn_guard_*`
#   blocca. Qui si risponde e basta — a decidere che farne e' il guard che la
#   chiama, che e' anche l'unico che sa quale messaggio dare all'operatore.
#   Su un parametro nullo risponde **NULL**: «la domanda non si pone» non e'
#   ne' vero ne' falso, e il chiamante non la fa mai con un nullo.
#
# ── ⚠️ SECURITY DEFINER: tre cose da sapere ───────────────────────────
#   1. `SET search_path TO 'pg_catalog', 'pg_temp'` — obbligatorio su una
#      SECURITY DEFINER, ed e' la forma delle quattro che il progetto ha gia'
#      (verificato: **zero** senza search_path). Da cui gli identificatori
#      qualificati per intero nel corpo;
#   2. l'**owner** lo riallinea `dbops.fn_sync_functions_owner` in `90_end`
#      (`runAlways`): e' quello che rende la funzione davvero definer;
#   3. e' **STABLE**, non VOLATILE: legge e basta, dentro lo stesso statement
#      la risposta non cambia.
#
# Verifica: db/pgtap/pagamenti/test-abbinamento-rata.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260822-06-create-fn-check-scadenza-di-fattura-mctit.yaml

  - changeSet:
      id: 20260822-06-create-fn-check-scadenza-di-fattura
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        La domanda di fatto «questa rata appartiene a questa fattura?», fatta fuori dalla
        row security. Serve perche' vendite.fatture_scadenze ha la RLS e un guard che legge
        sotto RLS non distingue «non appartiene» da «non la vedo»: sono due verita' opposte
        che producono lo stesso EXISTS falso, e rifiutarle con lo stesso messaggio
        significa dirne una falsa. Risponde un booleano su una coppia che il chiamante ha
        gia' nominato: nessuna riga esce. fn_check_* per convenzione, quindi non solleva —
        a decidere che farne e' il guard che la chiama.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: fatture_scadenze
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_scadenza_di_fattura(
                  p_scadenza_id vendite.fatture_scadenze.id%TYPE,
                  p_fattura_id  vendite.fatture.id%TYPE
              )
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pg_temp'
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Rispondere a UNA domanda di fatto — «la rata indicata
                  --   appartiene alla fattura indicata?» — senza che la row
                  --   security la trasformi in «...e riesco a vederla?».
                  --
                  -- ⚠️ NON solleva mai: e' una fn_check_*. Chi la chiama sa
                  --    quale messaggio dare, questa sa solo il fatto.
                  --
                  -- ℹ️ Su un parametro nullo risponde NULL: «la domanda non si
                  --    pone» non e' ne' vero ne' falso, e chi chiama non la fa
                  --    mai con un nullo.
                  -- =========================================================
                  IF p_scadenza_id IS NULL OR p_fattura_id IS NULL THEN
                      RETURN NULL;
                  END IF;

                  RETURN EXISTS (
                      SELECT 1
                        FROM vendite.fatture_scadenze s
                       WHERE s.id = p_scadenza_id
                         AND s.fattura_id = p_fattura_id
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_scadenza_di_fattura(vendite.fatture_scadenze.id%TYPE, vendite.fatture.id%TYPE)
              IS 'Risponde «questa rata appartiene a questa fattura?» FUORI dalla row security. 🔴 Esiste perche'' vendite.fatture_scadenze ha la RLS attiva e un guard che legge sotto RLS NON DISTINGUE «non appartiene» da «non la vedo»: due verita'' opposte che producono lo stesso EXISTS falso — la prima e'' un''incoerenza da rifiutare, la seconda e'' una riga legittima che l''operatore non ha il diritto di guardare. Rifiutarle con lo stesso messaggio vorrebbe dire dirne una falsa. ℹ️ Diverso il caso della FK: i controlli di integrita'' referenziale PostgreSQL li esegue gia'' fuori dalla row security, quindi la FK sa che la rata ESISTE — questa sa DI CHI E''. ⚠️ Non allarga nessun perimetro: risponde un booleano su una coppia che il chiamante ha gia'' nominato, nessuna riga esce e nessun elenco si popola. ⚠️ fn_check_* per convenzione: verifica e risponde, non solleva — a decidere che farne e'' il guard che la chiama (pagamenti.trgfn_vendite_contabili_righe_guard_rata), che e'' anche l''unico che sa quale messaggio dare all''operatore. Su un parametro nullo risponde NULL: «la domanda non si pone» non e'' ne'' vero ne'' falso. ⚠️ SECURITY DEFINER con search_path fissato, come le altre del progetto; l''owner lo riallinea dbops.fn_sync_functions_owner in 90_end, ed e'' quello che la rende davvero definer. S2-3 del cantiere incassi, decisione D14-b del brief madre.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_scadenza_di_fattura(bigint, bigint);
