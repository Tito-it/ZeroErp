# ------------------------------------------------------------
# LO STATO DI EMISSIONE DAL LETTORE COMUNE
#   Brief: brief-modello-documento-vendita §17 (regola del 2, Tid 2026-10-31).
#
#   Il corpo di 20261025-40 (la mappa, la colonna che puo' mancare, l'id
#   dello stato marcato) e' ora script.fn_stato_per_colonna_id (20261031-06),
#   la logica comune ai quattro lettori con il nome. Qui resta la porta:
#   firma, contratto e consumatori invariati. Unica differenza di
#   comportamento: una colonna emissione che non fosse boolean ora e'
#   E_SCRIPT_CHIAMATA_NON_VALIDA invece di un errore SQL grezzo (oggi non
#   esiste, e il modello non la ammette).
#   Il COMMENT riallinea l'elenco dei consumatori a quelli che la chiamano.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261031-07-update-fn-stato-emissione-id-dalla-colonna-mctit.yaml

  - changeSet:
      id: 20261031-07-update-fn-stato-emissione-id-dalla-colonna
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_stato_emissione_id(regclass) chiama il lettore comune
        script.fn_stato_per_colonna_id(p_testata, 'emissione', il suo nome); firma e contratto invariati.
        Brief: brief-modello-documento-vendita §17.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_stato_per_colonna_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_stato_emissione_id(p_testata regclass)
               -- bigint: l'id di uno stato di un vocabolario qualunque della
               -- mappa; nessuna colonna comune a cui ancorarlo.
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato di emissione della testata, dal
                  --   suo vocabolario (colonna emissione = true). La logica
                  --   e' del lettore comune (rev 2026-10-31, 20261031-07):
                  --   - testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - vocabolario senza la colonna emissione: il documento
                  --     non si emette, NULL;
                  --   - nessuno stato dichiarato: NULL.
                  -- =========================================================
                  RETURN script.fn_stato_per_colonna_id(p_testata, 'emissione', 'script.fn_stato_emissione_id');
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_stato_emissione_id(p_testata regclass)
              IS 'BB del modello del documento: l''id dello stato di EMISSIONE di una testata, letto dal suo vocabolario degli stati (colonna emissione = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''EMESSO'' per dire «lo stato a cui si arriva solo da Emetti» (M-2). NULL se il documento non si emette (vocabolario senza la colonna: reso, commessa, fattura) o se il vocabolario non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. La logica e'' di script.fn_stato_per_colonna_id (dal 2026-10-31), comune ai lettori gemelli: script.fn_stato_abortito_id, script.fn_stato_cessazione_id, script.fn_stato_accettazione_id; il codice si legge con script.fn_doc_stato_codice. Consumatori: il backend (il cambio stato generico rifiuta l''emissione; «Emetti» ne legge il codice), script.fn_doc_azione_passaggio, vendite.fn_cambia_stato_ddt, vendite.fn_cessa_contratti_scaduti, vendite.fn_offerta_proietta_stato_revisione, vendite.trgfn_preventivi_guard_transizione (le righe all''emissione). Brief: brief-modello-documento-vendita §8, §8.11 (Tid 2026-10-25) e §17.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_stato_emissione_id(p_testata regclass)
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  -- Il vocabolario e l'id di uno stato di una qualunque testata
                  -- della mappa: bigint in tutti, nessuna colonna comune a cui
                  -- ancorarli.
                  v_vocabolario regclass;
                  v_id          bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato di emissione della testata, dal
                  --   suo vocabolario (colonna emissione = true).
                  -- Regole:
                  --   - testata fuori mappa: il chiamante e' rotto,
                  --     E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - vocabolario senza la colonna emissione: il documento
                  --     non si emette, NULL;
                  --   - nessuno stato dichiarato: NULL (al massimo uno lo
                  --     garantisce l'indice unico parziale).
                  -- =========================================================
                  SELECT m.vocabolario
                    INTO v_vocabolario
                    FROM script.fn_doc_stato_modello(p_testata) m;

                  IF v_vocabolario IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_stato_emissione_id', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('testata', p_testata::text),
                          NULL::uuid,
                          'script.fn_stato_emissione_id',
                          'p_testata: una testata della mappa del modello (script.fn_doc_stato_modello)');
                  END IF;

                  IF NOT EXISTS (SELECT 1
                                   FROM pg_catalog.pg_attribute a
                                  WHERE a.attrelid = v_vocabolario
                                    AND a.attname  = 'emissione'
                                    AND a.attnum   > 0
                                    AND NOT a.attisdropped) THEN
                      RETURN NULL;
                  END IF;

                  EXECUTE format('SELECT s.id FROM %s s WHERE s.emissione', v_vocabolario)
                     INTO v_id;

                  RETURN v_id;
              END;
              $function$;
