# Liquibase changelog per Zero ERP
# fn_get_user_object_permissions_map
# Restituisce la mappa completa degli override oggetto attivi
# per un utente in un solo roundtrip DB.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260410-12-create-fn-get-user-object-permissions-map-mctit.yaml

  - changeSet:
      id: 20260410-12-create-fn-get-user-object-permissions-map
      author: mctit
      comment: >
        Mappa override oggetto attivi per utente.
        Legge config.user_override_oggetti filtrando la validita'
        temporale e ritorna JSONB {app_label.model_name: livello}.
      runOnChange: false
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: user_override_oggetti
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION script.fn_get_user_object_permissions_map(
                  p_auth_user_id  anagrafiche.risorse_umane_auth_user.auth_user_id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Restituisce la mappa completa degli override oggetto
                  --   attivi per un utente, in un solo roundtrip DB.
                  --
                  -- Parametri:
                  --   p_auth_user_id: ID utente Django (auth_user.id)
                  --
                  -- Ritorna:
                  --   JSONB { "anagrafiche.conto_bancario": "BLOCCATO",
                  --           "vendite.fattura": "LETTURA", ... }
                  --
                  -- Regole:
                  --   - considera solo override attivi alla data corrente
                  --   - nessun override attivo -> {}::jsonb
                  --   - funzione gemella delle mappe area / azioni
                  -- =========================================================

                  -- Guard: parametro obbligatorio e valido
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_user_object_permissions_map',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'p_auth_user_id obbligatorio e > 0.'
                      );
                  END IF;

                  RETURN (
                      SELECT COALESCE(
                          jsonb_object_agg(
                              uo.app_label || '.' || uo.model_name,
                              uo.livello::text
                          ),
                          '{}'::jsonb
                      )
                        FROM config.user_override_oggetti uo
                       WHERE uo.auth_user_id = p_auth_user_id
                         AND (uo.valido_dal IS NULL OR uo.valido_dal <= CURRENT_DATE)
                         AND (uo.valido_al  IS NULL OR uo.valido_al  >= CURRENT_DATE)
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_user_object_permissions_map(integer)
                IS 'Mappa override oggetto attivi per utente: JSONB {app_label.model_name: livello_accesso}. Filtra valido_dal/valido_al. STABLE, cacheable.';
