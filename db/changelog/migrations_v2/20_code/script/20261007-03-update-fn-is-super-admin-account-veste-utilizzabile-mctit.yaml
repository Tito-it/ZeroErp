# ------------------------------------------------------------
# script.fn_is_super_admin_account: LA VESTE CONTA SE E' UTILIZZABILE OGGI
#   Brief: brief-db-veste-utilizzabile (building block: 20261007-01)
#
#   «Identita' OPERATORE attiva e valida oggi» era attivo + finestra ricopiati:
#   ora e' il building block (con il rapporto dell'operatore, D-2).
#
#   Corpo vivo = pg_get_functiondef su dbdev il 2026-10-07 (uguale alla doc
#   auto-gen); sostituzioni contate. Firma, RETURNS, DECLARE e firma del
#   COMMENT ancorati a %TYPE dove c'e' una colonna dietro; dove non c'e', il
#   tipo esplicito porta il perche' accanto. I %TYPE si risolvono negli STESSI
#   tipi di oggi (provato: nessun overload), quindi i chiamanti (comprese le
#   BEGIN ATOMIC) restano validi. Il rollback e' il corpo vivo di prima, con la
#   stessa firma ancorata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-03-update-fn-is-super-admin-account-veste-utilizzabile-mctit.yaml

  - changeSet:
      id: 20261007-03-update-fn-is-super-admin-account-veste-utilizzabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_is_super_admin_account: la veste OPERATORE conta se utilizzabile oggi (script.fn_veste_utilizzabile). Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_is_super_admin_account';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_is_super_admin_account(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE)
               RETURNS boolean  -- una risposta si/no: nessuna colonna dietro
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: la CREDENZIALE ha un binding SUPER_ADMIN attivo? Senza
                  --   il cancello della veste di script.fn_is_super_admin, che
                  --   chiede questa funzione nel suo ramo ELSE.
                  -- Il SUPER_ADMIN si lega solo a un'identita' OPERATORE (binding
                  -- per identita', privilegio personale).
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN config.profili_accesso_bindings pab
                          ON pab.identita_digitale_id = id.id
                        JOIN config.profili_accesso pa
                          ON pa.id = pab.profilo_accesso_id
                       WHERE id.auth_user_id      = p_auth_user_id
                         AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                         -- Rev 2026-10-07: «valida oggi» la decide il building block.
                         AND script.fn_veste_utilizzabile(id.id)
                         AND pab.attivo = true
                         AND pa.attivo  = true
                         AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                  );
              $function$
              ;

              COMMENT ON FUNCTION script.fn_is_super_admin_account(anagrafiche.identita_digitali.auth_user_id%TYPE) IS 'La CREDENZIALE (django.auth_user.id) ha un binding SUPER_ADMIN attivo: identita'' OPERATORE attiva e valida oggi, binding e profilo attivi. Senza il cancello della veste: e'' la seconda delle due domande di script.fn_is_super_admin, che la chiede nel suo ramo ELSE (estratta il 2026-09-29, regola del 2). La usa da sola script.fn_totp_obbligatorio: l''obbligo del secondo fattore vale su tutte le porte, anche dove il bypass dei permessi non si accende. Non e'' la domanda dell''anti-lockout (fn_check_almeno_un_super_admin_attivo), che conta tutti gli amministratori raggiungibili. LANGUAGE sql, STABLE, INVOKER, inlineabile. Brief: brief-db-secondo-fattore-totp §2. Rev 2026-10-07 (brief-db-veste-utilizzabile): «identita'''' OPERATORE attiva e valida oggi» si legge da script.fn_veste_utilizzabile, non da una copia di attivo + finestra.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_is_super_admin_account(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE)
               RETURNS boolean  -- una risposta si/no: nessuna colonna dietro
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: la CREDENZIALE ha un binding SUPER_ADMIN attivo? Senza
                  --   il cancello della veste di script.fn_is_super_admin, che
                  --   chiede questa funzione nel suo ramo ELSE.
                  -- Il SUPER_ADMIN si lega solo a un'identita' OPERATORE (binding
                  -- per identita', privilegio personale).
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN config.profili_accesso_bindings pab
                          ON pab.identita_digitale_id = id.id
                        JOIN config.profili_accesso pa
                          ON pa.id = pab.profilo_accesso_id
                       WHERE id.auth_user_id      = p_auth_user_id
                         AND id.attivo            = true
                         AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                         AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                         AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                         AND pab.attivo = true
                         AND pa.attivo  = true
                         AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                  );
              $function$
              ;

              COMMENT ON FUNCTION script.fn_is_super_admin_account(anagrafiche.identita_digitali.auth_user_id%TYPE) IS 'La CREDENZIALE (django.auth_user.id) ha un binding SUPER_ADMIN attivo: identita'' OPERATORE attiva e valida oggi, binding e profilo attivi. Senza il cancello della veste: e'' la seconda delle due domande di script.fn_is_super_admin, che la chiede nel suo ramo ELSE (estratta il 2026-09-29, regola del 2). La usa da sola script.fn_totp_obbligatorio: l''obbligo del secondo fattore vale su tutte le porte, anche dove il bypass dei permessi non si accende. Non e'' la domanda dell''anti-lockout (fn_check_almeno_un_super_admin_attivo), che conta tutti gli amministratori raggiungibili. LANGUAGE sql, STABLE, INVOKER, inlineabile. Brief: brief-db-secondo-fattore-totp §2.';
