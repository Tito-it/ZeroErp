# R-7 — LA REGISTRAZIONE CONTA ANCHE UN NOME INESISTENTE:
#   script.fn_registra_tentativo_login(p_auth_user_id, p_nome_digest, p_provenienza, p_successo)
#   Brief: brief-db-blocco-login-per-credenziale, sezione 13
#
# ── ⛔ IL DIFETTO CHE CHIUDE ─────────────────────────────────────────
#   Un fallimento su un nome inesistente non contava niente (il backend non
#   chiamava nemmeno, `if user:`), e il nome restava a 401 per sempre: la
#   differenza con un nome esistente diceva se l'utente c'e'.
#
# ── ⭐ LE DUE CHIAVI, UNA REGOLA ─────────────────────────────────────
#   - p_auth_user_id valorizzato -> la CREDENZIALE, come prima;
#   - p_auth_user_id NULL        -> il NOME TENTATO (config.nomi_tentati +
#     config.nomi_tentati_provenienze, per digest).
#   Nei due rami cambiano solo le tabelle: il passo del freno e' uno
#   (script.fn_login_freno_passo, 20260925-59, regola del 2), l'attesa pure
#   (fn_login_attesa_secondi), i parametri pure (fn_login_parametri). Il
#   ritorno ha la stessa forma.
#
# ── ⚠️ UN NOME INESISTENTE NON ENTRA MAI ────────────────────────────
#   p_successo = true senza credenziale e' una chiamata incoerente:
#   E_AUTH_CHIAMATA_NON_VALIDA. E_CREDENZIALE_NON_TROVATA resta per un
#   p_auth_user_id VALORIZZATO che non esiste (mai per un nome inesistente,
#   che ora ha la sua strada).
#
# ── ⚠️ RETENTION ─────────────────────────────────────────────────────
#   Le righe del nome scadono (regole CLEANUP_AT di config.nomi_tentati e
#   config.nomi_tentati_provenienze): cleanup_at nasce col trigger alla nascita e
#   si ricalcola qui a ogni fallimento, leggendo il ttl dalla regola, come per
#   la coppia della credenziale.
#
# ── ⛔ LA FIRMA CAMBIA ───────────────────────────────────────────────
#   DROP della (integer, inet, boolean). Chiamanti: nel DB nessuno; il backend
#   (AuthRepository.registra_tentativo_login) si allinea NELLA STESSA PR (B-9,
#   B-10). pgTAP: i file del login, adeguati.
#
# SECURITY DEFINER del PROPRIETARIO, search_path bloccato; nessun guard di
# permesso, dichiarato. Corpo di partenza: la doc auto-generata (definizione di
# 20260925-11).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260925-61-update-fn-registra-tentativo-login-nome-tentato-mctit.yaml

  - changeSet:
      id: 20260925-61-update-fn-registra-tentativo-login-nome-tentato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_registra_tentativo_login(p_auth_user_id, p_nome_digest, p_provenienza, p_successo):
        un fallimento conta sulla credenziale quando c'e', sul nome tentato (per digest) quando
        p_auth_user_id e' NULL; passo del freno da fn_login_freno_passo per le due coppie. Firma
        nuova: DROP della (integer, inet, boolean). Brief: brief-db-blocco-login-per-credenziale
        §13 (R-7).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: nomi_tentati_provenienze }
            - sqlCheck:
                expectedResult: "3"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname IN ('fn_login_parametri', 'fn_login_attesa_secondi',
                                       'fn_login_freno_passo');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_registra_tentativo_login(integer, inet, boolean);

              CREATE OR REPLACE FUNCTION script.fn_registra_tentativo_login(
                  p_auth_user_id integer,   -- django.auth_user.id: niente %TYPE su Django
                  p_nome_digest  config.nomi_tentati.nome_digest%TYPE,
                  p_provenienza  config.credenziali_provenienze.provenienza%TYPE,
                  p_successo     boolean   -- l'esito del chiamante: nessuna colonna
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              VOLATILE
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: registrare l'esito di un tentativo di login. Successo: azzera.
              --   Fallimento: conta sulla chiave (credenziale se c'e', nome tentato se
              --   no) per l'attesa crescente, e sulla coppia chiave + provenienza per
              --   il freno alla soglia.
              DECLARE
                  -- Esplicito: e' config.credenziali.id OPPURE config.nomi_tentati.id,
                  -- secondo la chiave (entrambi bigint), non una colonna sola.
                  v_chiave_id       bigint;
                  v_fallimenti      config.credenziali.fallimenti_consecutivi%TYPE;
                  v_tentativi       config.credenziali_provenienze.tentativi_falliti%TYPE;
                  v_bloccato_fino_a config.credenziali_provenienze.bloccato_fino_a%TYPE;
                  -- Espliciti: parametri da script.fn_login_parametri (testo in
                  -- config.parameters), ttl letti dal jsonb della regola CLEANUP_AT, e
                  -- un flag calcolato.
                  v_max_tentativi   integer;
                  v_blocco_minuti   integer;
                  v_tetto           integer;
                  v_attesa_base     integer;
                  v_attesa_max      integer;
                  v_ttl_coppia      integer;
                  v_ttl_nome        integer;
                  v_bloccato        boolean;
              BEGIN
                  IF p_auth_user_id <= 0 OR p_provenienza IS NULL OR p_successo IS NULL
                     OR p_nome_digest IS NULL OR octet_length(p_nome_digest) <> 32
                     OR (p_successo AND p_auth_user_id IS NULL) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_registra_tentativo_login', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_auth_user_id',        p_auth_user_id,
                                             'p_provenienza',         p_provenienza::text,
                                             'p_successo',            p_successo,
                                             'nome_digest_lunghezza', octet_length(p_nome_digest)),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_registra_tentativo_login',
                                         'provenienza, esito e digest del nome (32 byte) obbligatori; un successo vuole la credenziale']);
                  END IF;

                  IF p_successo THEN
                      PERFORM script.fn_azzera_tentativi_credenziale(p_auth_user_id, p_provenienza);
                      RETURN jsonb_build_object('bloccato', false, 'minuti_rimanenti', 0,
                                                'tentativi', 0, 'attesa_secondi', 0);
                  END IF;

                  SELECT lp.max_tentativi, lp.blocco_minuti, lp.tetto_credenziale,
                         lp.attesa_base_secondi, lp.attesa_max_secondi
                    INTO v_max_tentativi, v_blocco_minuti, v_tetto, v_attesa_base, v_attesa_max
                    FROM script.fn_login_parametri() lp;

                  IF p_auth_user_id IS NOT NULL THEN
                      -- La FK verso django.auth_user in CI non esiste: l'esistenza si
                      -- controlla qui, o un id sbagliato aprirebbe una riga orfana.
                      IF NOT EXISTS (SELECT 1 FROM django.auth_user au WHERE au.id = p_auth_user_id) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'script.fn_registra_tentativo_login', 'E_CREDENZIALE_NON_TROVATA',
                              jsonb_build_object('auth_user_id', p_auth_user_id),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]);
                      END IF;

                      -- 1. La credenziale: base dell'attesa crescente.
                      INSERT INTO config.credenziali AS c
                             (auth_user_id, fallimenti_consecutivi, ultimo_fallimento_at)
                      VALUES (p_auth_user_id, 1, now())
                      ON CONFLICT (auth_user_id) DO UPDATE
                         SET fallimenti_consecutivi = c.fallimenti_consecutivi + 1,
                             ultimo_fallimento_at   = now()
                      RETURNING c.id, c.fallimenti_consecutivi
                           INTO v_chiave_id, v_fallimenti;

                      -- 2. La coppia credenziale + provenienza: il freno.
                      v_ttl_coppia := (dbops.fn_cleanup_at_params('config', 'credenziali_provenienze')
                                       ->> 'ttl_days')::integer;

                      INSERT INTO config.credenziali_provenienze AS p
                             (credenziale_id, provenienza, tentativi_falliti,
                              bloccato_fino_a, ultimo_fallimento_at)
                      SELECT v_chiave_id, p_provenienza, f.tentativi, f.bloccato_fino_a, now()
                        FROM script.fn_login_freno_passo(0, NULL, now(),
                                                         v_max_tentativi, v_blocco_minuti) f
                      ON CONFLICT (credenziale_id, provenienza) DO UPDATE
                         SET (tentativi_falliti, bloccato_fino_a) =
                                 (SELECT f.tentativi, f.bloccato_fino_a
                                    FROM script.fn_login_freno_passo(p.tentativi_falliti, p.bloccato_fino_a,
                                                                     now(), v_max_tentativi,
                                                                     v_blocco_minuti) f),
                             ultimo_fallimento_at = now(),
                             cleanup_at = CASE WHEN v_ttl_coppia IS NOT NULL
                                               THEN now() + make_interval(days => v_ttl_coppia) END
                      RETURNING p.tentativi_falliti, p.bloccato_fino_a
                           INTO v_tentativi, v_bloccato_fino_a;
                  ELSE
                      -- 1. Il nome tentato: base dell'attesa crescente. Scade.
                      v_ttl_nome := (dbops.fn_cleanup_at_params('config', 'nomi_tentati')
                                     ->> 'ttl_days')::integer;

                      INSERT INTO config.nomi_tentati AS nt
                             (nome_digest, fallimenti_consecutivi, ultimo_fallimento_at)
                      VALUES (p_nome_digest, 1, now())
                      ON CONFLICT (nome_digest) DO UPDATE
                         SET fallimenti_consecutivi = nt.fallimenti_consecutivi + 1,
                             ultimo_fallimento_at   = now(),
                             cleanup_at = CASE WHEN v_ttl_nome IS NOT NULL
                                               THEN now() + make_interval(days => v_ttl_nome) END
                      RETURNING nt.id, nt.fallimenti_consecutivi
                           INTO v_chiave_id, v_fallimenti;

                      -- 2. La coppia nome tentato + provenienza: il freno, stessa regola.
                      v_ttl_coppia := (dbops.fn_cleanup_at_params('config', 'nomi_tentati_provenienze')
                                       ->> 'ttl_days')::integer;

                      INSERT INTO config.nomi_tentati_provenienze AS p
                             (nome_tentato_id, provenienza, tentativi_falliti,
                              bloccato_fino_a, ultimo_fallimento_at)
                      SELECT v_chiave_id, p_provenienza, f.tentativi, f.bloccato_fino_a, now()
                        FROM script.fn_login_freno_passo(0, NULL, now(),
                                                         v_max_tentativi, v_blocco_minuti) f
                      ON CONFLICT (nome_tentato_id, provenienza) DO UPDATE
                         SET (tentativi_falliti, bloccato_fino_a) =
                                 (SELECT f.tentativi, f.bloccato_fino_a
                                    FROM script.fn_login_freno_passo(p.tentativi_falliti, p.bloccato_fino_a,
                                                                     now(), v_max_tentativi,
                                                                     v_blocco_minuti) f),
                             ultimo_fallimento_at = now(),
                             cleanup_at = CASE WHEN v_ttl_coppia IS NOT NULL
                                               THEN now() + make_interval(days => v_ttl_coppia) END
                      RETURNING p.tentativi_falliti, p.bloccato_fino_a
                           INTO v_tentativi, v_bloccato_fino_a;
                  END IF;

                  v_bloccato := v_bloccato_fino_a IS NOT NULL AND v_bloccato_fino_a > now();

                  RETURN jsonb_build_object(
                      'bloccato',         v_bloccato,
                      'minuti_rimanenti', CASE WHEN v_bloccato THEN v_blocco_minuti ELSE 0 END,
                      'tentativi',        v_tentativi,
                      'attesa_secondi',   script.fn_login_attesa_secondi(
                                              v_fallimenti, v_tetto, v_attesa_base, v_attesa_max));
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_registra_tentativo_login(integer, bytea, inet, boolean) IS
                  'Registra l''esito di un tentativo di login per NOME TENTATO e PROVENIENZA (R-7). La chiave e'' la credenziale quando p_auth_user_id e'' valorizzato (M-4: ogni credenziale conta, nessun filtro su veste), il nome tentato (config.nomi_tentati, per digest) quando e'' NULL: stessa regola e stesso ritorno per le due, cosi'' la risposta non dice se il nome esiste. Successo (solo con la credenziale) -> script.fn_azzera_tentativi_credenziale(uid, provenienza). Fallimento, in upsert e in ordine fisso: (1) fallimenti consecutivi della chiave + ultimo_fallimento_at, base dell''attesa crescente; (2) la coppia chiave + provenienza col passo di script.fn_login_freno_passo (regola del 2): freno fino a now() + login_blocco_minuti alla soglia login_max_tentativi_falliti, un freno scaduto riparte da 1. cleanup_at delle righe che scadono ricalcolato dalle regole CLEANUP_AT (dbops.fn_cleanup_at_params). Ritorna jsonb {bloccato, minuti_rimanenti, tentativi (della coppia), attesa_secondi (del prossimo tentativo)}. Credenziale data e inesistente -> E_CREDENZIALE_NON_TROVATA; provenienza, esito o digest (32 byte) mancanti, credenziale <= 0, successo senza credenziale -> E_AUTH_CHIAMATA_NON_VALIDA. SECURITY DEFINER del PROPRIETARIO, search_path bloccato; nessun guard di permesso, dichiarato. Brief: brief-db-blocco-login-per-credenziale §2.4-2.5, §3.1, §13.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_registra_tentativo_login(integer, bytea, inet, boolean);
