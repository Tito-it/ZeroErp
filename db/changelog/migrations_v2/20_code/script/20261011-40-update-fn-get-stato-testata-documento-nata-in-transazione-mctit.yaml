# ------------------------------------------------------------
# AGGIORNA: script.fn_get_stato_testata_documento — + la colonna
#   nata_in_transazione.
#   Brief: brief-db-testata-dopo-emissione (§11.6, D-13 di Tid)
#
# -- PERCHE' ------------------------------------------------------------
#   Dopo l'apply di 20261011-24 sono caduti sette pgTAP: un contratto
#   inserito direttamente ATTIVO o ANNULLATO (lecito per seed e import,
#   linee-guida-sql §7c punto 6) fa scrivere al trigger
#   trgfn_contratti_snapshot_precontrattuali (AFTER INSERT) la sua
#   fornitura, e il lock dei satelliti la rifiutava. D-13 di Tid: cio' che
#   un trigger scrive alla nascita del documento ne fa parte, e passa.
#   Il lock deve quindi sapere se la testata e' nata nella transazione
#   corrente: lo dice il lettore DEFINER che gia' legge stato ed etichetta.
#
# -- LA FORMA ------------------------------------------------------------
#   nata_in_transazione = (data_insert = transaction_timestamp()).
#   data_insert la scrive il default now() all'INSERT e nessun UPDATE la
#   tocca: dice «creata adesso». xmin no: lo cambia anche l'emissione.
#   ⚠️ RETURNS TABLE cambia: DROP e CREATE nello stesso changeSet, poi il
#   GRANT all'app (il loop di ci_apply lo rifa' uguale; i ruoli batch lo
#   ricevono dal provisioning). I nove chiamanti leggono le colonne per nome.
#   Corpo di partenza: doc auto-generata (rev 2026-10-08).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261011-40-update-fn-get-stato-testata-documento-nata-in-transazione-mctit.yaml

  - changeSet:
      id: 20261011-40-update-fn-get-stato-testata-documento-nata-in-transazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_stato_testata_documento: + nata_in_transazione (la testata e' stata creata nella
        transazione corrente). Brief: brief-db-testata-dopo-emissione (D-13).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- RETURNS TABLE cambia: si ricrea. I chiamanti leggono le colonne per
              -- nome (SELECT t.stato, t.etichetta): una colonna in piu' non li tocca.
              DROP FUNCTION script.fn_get_stato_testata_documento(text, bigint);

              CREATE OR REPLACE FUNCTION script.fn_get_stato_testata_documento(p_documento text, p_testata_id bigint)
               RETURNS TABLE(stato text, etichetta text, nata_in_transazione boolean)
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- ⚠️ Tipi nudi DICHIARATI (rev 2026-09-28): p_documento e' un selettore senza
              --   colonna-vocabolario; p_testata_id e lo stato in uscita sono POLIMORFI —
              --   l'id di sette testate diverse (sei documenti e una mail), il
              --   codice_interno di sei vocabolari diversi (e lo stato di una mail) — quindi non c'e' UNA colonna da ancorare.
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Rispondere a «la testata esiste ancora, e in che stato e'?»
                --   SENZA passare dalla RLS delle testate.
                --
                -- Contratto:
                --   - zero righe  -> la testata NON esiste (cancellata, o mai
                --     esistita). Il chiamante deve trattarlo come CASCADE.
                --   - una riga    -> stato = codice_interno, etichetta = frase
                --     per l'operatore, nata_in_transazione = la testata e' stata
                --     creata nella transazione corrente (rev 2026-10-11).
                --
                -- ⭐ nata_in_transazione (rev 2026-10-11, brief-db-testata-dopo-
                --    emissione §11, D-13 di Tid): data_insert = transaction_timestamp().
                --    data_insert la scrive il default now() all'INSERT e nessun
                --    UPDATE la tocca, quindi dice «creata adesso», non «toccata
                --    adesso» (xmin, invece, lo cambia anche l'emissione). La usa il
                --    lock delle righe per lasciar passare cio' che un trigger scrive
                --    alla nascita di un documento nato gia' fuori bozza (lo snapshot
                --    della fornitura di un contratto inserito ATTIVO).
                --
                -- ⚠️ Lo stato e' NOT NULL su tutte le testate e la FK verso
                --    config.stati_doc_* garantisce la riga di stato: se la
                --    testata c'e', `stato` non e' mai NULL. Il chiamante puo'
                --    quindi usare l'assenza di riga come segnale, e non deve
                --    distinguere un NULL da un vuoto.
                --    (EMAIL_BOZZA: `stato` e' NOT NULL sulla tabella stessa,
                --    ed e' gia' il codice — il contratto regge uguale.)
                --
                -- Chi lo chiama (2026-10-04):
                --   - vendite.trgfn_doc_righe_lock_fuori_bozza (il guard
                --     generico: righe di documento solo in bozza);
                --   - vendite.trgfn_dlt_block_ordrig_ddtrig (l'etichetta per i
                --     messaggi sui legami a valle);
                --   - config.trgfn_email_allegato_guard_solo_bozza (gli
                --     allegati di una mail si toccano solo in bozza);
                --   - vendite.trgfn_ddt_righe_prelievi_guard (i prelievi di una
                --     bolla, 2026-09-28);
                --   - vendite.trgfn_resi_righe_rientri_guard (i rientri di un
                --     reso, 2026-09-28);
                --   - script.trgfn_righe_guard_aggiunta_fuori_listino (il nome
                --     del documento nel messaggio, contratto o offerta,
                --     2026-10-04).
                -- =========================================================
                IF p_testata_id IS NULL OR p_testata_id <= 0 THEN
                  RETURN;   -- nessuna riga: il chiamante lo legge come «assente»
                END IF;

                IF p_documento = 'DDT' THEN
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('DDT ', COALESCE(d.numero, '#' || d.id::text)),
                         d.data_insert = transaction_timestamp()
                    FROM vendite.ddt d
                    JOIN config.stati_doc_ddt s ON s.id = d.stato_doc_ddt_id
                   WHERE d.id = p_testata_id;

                ELSIF p_documento = 'PREVENTIVO' THEN
                  -- rev 2026-10-08 (brief-db-righe-e-componenti-le-altre-famiglie
                  -- §2.2): il preventivo, per il lock dei suoi componenti fuori
                  -- bozza. ⚠️ L'etichetta porta la REVISIONE: le revisioni hanno
                  -- lo stesso numero, e senza la revisione la frase non dice quale
                  -- documento e' fermo. numero e rev sono NOT NULL: il ripiego
                  -- sull'id resta per simmetria con gli altri rami.
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Preventivo ', COALESCE(p.numero, '#' || p.id::text),
                                ' rev. ', p.rev::text),
                         p.data_insert = transaction_timestamp()
                    FROM vendite.preventivi p
                    JOIN config.stati_doc_preventivi s ON s.id = p.stato_doc_preventivo_id
                   WHERE p.id = p_testata_id;

                ELSIF p_documento = 'ORDINE' THEN
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Ordine ', COALESCE(o.numero, '#' || o.id::text)),
                         o.data_insert = transaction_timestamp()
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini s ON s.id = o.stato_doc_ordine_id
                   WHERE o.id = p_testata_id;

                ELSIF p_documento = 'CONTRATTO' THEN
                  -- rev 2026-09-22: terzo adottante del guard generico delle righe.
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Contratto ', COALESCE(c.numero, '#' || c.id::text)),
                         c.data_insert = transaction_timestamp()
                    FROM vendite.contratti c
                    JOIN config.stati_doc_contratti s ON s.id = c.stato_doc_contratto_id
                   WHERE c.id = p_testata_id;

                ELSIF p_documento = 'OFFERTA' THEN
                  -- rev 2026-10-04 (brief-db-righe-esclusione-solo-non-si-vende,
                  -- R5a): l'offerta commerciale, per il guard generico delle
                  -- righe. Lo stato di bozza qui si chiama BOZZA (lo dice il
                  -- trigger). Il codice e' NOT NULL: il ripiego sull'id resta
                  -- per simmetria con gli altri rami, non per un caso reale.
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Offerta ', COALESCE(o.codice, '#' || o.id::text)),
                         o.data_insert = transaction_timestamp()
                    FROM vendite.offerte_commerciali o
                    JOIN config.stati_doc_offerte s ON s.id = o.stato_doc_offerta_id
                   WHERE o.id = p_testata_id;

                ELSIF p_documento = 'EMAIL_BOZZA' THEN
                  -- rev 2026-09-25: la bozza di una mail. Lo stato e' gia' il
                  -- codice; l'etichetta e' l'oggetto, che una persona riconosce.
                  RETURN QUERY
                  SELECT o.stato::text,
                         concat('La mail «', left(o.oggetto, 80), '»'),
                         o.data_insert = transaction_timestamp()
                    FROM config.email_outbox o
                   WHERE o.id = p_testata_id;

                ELSIF p_documento = 'RESO' THEN
                  -- rev 2026-09-28: il reso di vendita, per il guard dei suoi
                  -- rientri (vendite.trgfn_resi_righe_rientri_guard): stesso
                  -- rifiuto delle righe di documento, stessa etichetta.
                  RETURN QUERY
                  SELECT s.codice_interno::text,
                         concat('Reso ', COALESCE(r.numero, '#' || r.id::text)),
                         r.data_insert = transaction_timestamp()
                    FROM vendite.resi r
                    JOIN config.stati_doc_reso s ON s.id = r.stato_doc_reso_id
                   WHERE r.id = p_testata_id;

                ELSE
                  -- Errore di CHIAMANTE, non di dato: nessuna persona sceglie
                  -- questo valore. Classe TECNICO, messaggio che nomina il
                  -- valore ricevuto (fratello di E_RUOLO_APPLICATIVO_NON_GESTITO).
                  PERFORM script.fn_log_and_raise_error(
                    'script',
                    'fn_get_stato_testata_documento',
                    'E_DOC_TIPO_NON_GESTITO',
                    jsonb_build_object('documento', p_documento,
                                       'testata_id', p_testata_id),
                    NULL::uuid,
                    COALESCE(p_documento, '<null>'));
                END IF;

                RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_stato_testata_documento(p_documento text, p_testata_id bigint)
              IS 'Lettore SECURITY DEFINER dello stato e dell''etichetta di una testata di documento. Nasce il 2026-08-26 per vendite.trgfn_dlt_block_ordrig_ddtrig, che deve distinguere «la testata non c''e'' piu''» (CASCADE partito dalla testata) da «la testata non la vedo» (RLS). ⛔ SECURITY DEFINER perche'' quella distinzione e'' il perno della decisione: le testate hanno RLS — e dal 22-09 anche le righe (ddt_righe, ordini_righe, contratti_righe: letto dal catalogo) — e un guard che leggesse sotto RLS diventerebbe fail-open proprio per chi sta fuori perimetro. ⭐ CONTRATTO: zero righe = testata assente; una riga = stato (codice_interno) piu'' etichetta per l''operatore. Lo stato e'' NOT NULL su tutte le testate e la FK garantisce la riga di stato, quindi l''assenza di riga e'' un segnale non ambiguo. ⚠️ L''etichetta ripiega sull''id quando `numero` e'' NULL, che sui documenti in bozza e'' il caso normale, non un residuo. PERIMETRO: legge due colonne, non scrive, non espone dati riservati. Tipi ammessi: DDT | ORDINE | CONTRATTO | OFFERTA | EMAIL_BOZZA | RESO | PREVENTIVO; qualunque altro valore e'' un errore di chiamante (E_DOC_TIPO_NON_GESTITO, TECNICO). Chiamanti: vendite.trgfn_doc_righe_lock_fuori_bozza, vendite.trgfn_dlt_block_ordrig_ddtrig, config.trgfn_email_allegato_guard_solo_bozza, vendite.trgfn_ddt_righe_prelievi_guard, vendite.trgfn_resi_righe_rientri_guard, script.trgfn_righe_guard_aggiunta_fuori_listino. rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso): + RESO (vendite.resi, stato da config.stati_doc_reso, etichetta «Reso <numero>»). rev 2026-10-04 (brief-db-righe-esclusione-solo-non-si-vende, R5a): + OFFERTA (vendite.offerte_commerciali, stato da config.stati_doc_offerte, etichetta «Offerta <codice>»), per il lock delle righe dell''offerta fuori bozza. rev 2026-10-08 (brief-db-righe-e-componenti-le-altre-famiglie §2.2): + PREVENTIVO (vendite.preventivi, stato da config.stati_doc_preventivi, etichetta «Preventivo <numero> rev. <rev>»: le revisioni condividono il numero), per il lock dei componenti del preventivo fuori bozza. rev 2026-10-11 (brief-db-testata-dopo-emissione §11, D-13 di Tid): + nata_in_transazione, vero se la testata e'' stata creata nella transazione corrente (data_insert = transaction_timestamp(): il default la scrive all''INSERT e nessun UPDATE la tocca, mentre xmin lo cambia anche un cambio di stato). La legge vendite.trgfn_doc_righe_lock_fuori_bozza per lasciar passare cio'' che un TRIGGER scrive alla nascita di un documento nato gia'' fuori bozza.';

              GRANT EXECUTE ON FUNCTION script.fn_get_stato_testata_documento(text, bigint) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo precedente e' nella doc auto-generata (rev 2026-10-08).
              SELECT 1;
