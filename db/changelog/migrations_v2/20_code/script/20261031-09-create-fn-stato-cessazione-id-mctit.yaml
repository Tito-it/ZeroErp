# ------------------------------------------------------------
# BB: LO STATO DI CESSAZIONE DI UNA TESTATA
#   Brief: brief-modello-documento-vendita §17 (ok di Tid 2026-10-31).
#   Gemello di script.fn_stato_emissione_id e script.fn_stato_abortito_id:
#   la logica e' del lettore comune script.fn_stato_per_colonna_id
#   (20261031-06), qui la porta con il nome.
#
# ── CHE COSA DICE ───────────────────────────────────────────────────
#   L'id dello stato di cessazione (cessazione = true) nel vocabolario della
#   testata. Oggi e' CESSATO del contratto.
#   NULL per gli altri documenti, che non cessano: il loro vocabolario non ha la colonna.
#   Al massimo uno, ed e' attivo: indice unico parziale e CHECK in
#   20261031-05.
#
# ── LE COPIE CHE SI RITIRANO ────────────────────────────────────────
#   Il letterale 'CESSATO' per dire «lo stato di cessazione»: i consumatori
#   riscritti nello stesso giro (§17), elencati nel COMMENT.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261031-09-create-fn-stato-cessazione-id-mctit.yaml

  - changeSet:
      id: 20261031-09-create-fn-stato-cessazione-id
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB script.fn_stato_cessazione_id(regclass): l'id dello stato di cessazione (cessazione) nel
        vocabolario di una testata della mappa, NULL se il vocabolario non ha la colonna o non ne
        dichiara. Gemello di script.fn_stato_emissione_id, dal lettore comune
        script.fn_stato_per_colonna_id. Brief: brief-modello-documento-vendita §17.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_stato_per_colonna_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_stato_cessazione_id(p_testata regclass)
               -- bigint: l'id di uno stato di un vocabolario qualunque della
               -- mappa; nessuna colonna comune a cui ancorarlo.
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato di cessazione della testata, dal suo
                  --   vocabolario (colonna cessazione = true). La logica e' del
                  --   lettore comune:
                  --   - testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - vocabolario senza la colonna cessazione: il documento
                  --     non ha quello stato, NULL;
                  --   - nessuno stato dichiarato: NULL.
                  -- =========================================================
                  RETURN script.fn_stato_per_colonna_id(p_testata, 'cessazione', 'script.fn_stato_cessazione_id');
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_stato_cessazione_id(p_testata regclass)
              IS 'BB del modello del documento: l''id dello stato di CESSAZIONE di una testata, letto dal suo vocabolario degli stati (colonna cessazione = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''CESSATO'' per dire «lo stato di cessazione». Al massimo uno per vocabolario, ed e'' attivo (uq_<vocabolario>_cessazione, chk_<vocabolario>_cessazione_attivo). NULL se il vocabolario non ha la colonna (i documenti che non cessano: tutti tranne il contratto) o non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. La logica e'' di script.fn_stato_per_colonna_id, comune ai gemelli script.fn_stato_emissione_id, script.fn_stato_abortito_id, script.fn_stato_accettazione_id; il codice si legge con script.fn_doc_stato_codice. Consumatori: vendite.fn_cessa_contratto, vendite.fn_cessa_contratti_scaduti, vendite.fn_contratti_addebiti_maturati; il backend al posto di contratti_repository.STATO_CESSATO. Brief: brief-modello-documento-vendita §17 (Tid, 2026-10-31).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_stato_cessazione_id(regclass);
