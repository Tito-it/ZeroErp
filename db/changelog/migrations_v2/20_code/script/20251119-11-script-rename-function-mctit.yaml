databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20251119-11-script-rename-function-mctit.yaml

  - changeSet:
      id: 20251119-11-script-rename-function
      author: mctit
      comment: "Rinomina trigger function schema script secondo convenzione trgfn_<tabella>_<descrizione>"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              -- 
                  ALTER FUNCTION script.trgfn_upd_audit_data_user_generic()
                      RENAME TO trgfn_audit_data_user_generic;

                  ALTER FUNCTION script.trgfn_upd_dlt_storico_generic()
                    RENAME TO trgfn_storico_generic;
