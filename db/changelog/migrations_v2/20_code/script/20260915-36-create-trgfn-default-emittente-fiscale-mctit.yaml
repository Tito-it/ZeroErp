# ------------------------------------------------------------
# P-1 — L'EMITTENTE DI DEFAULT: UN BUILDING BLOCK SOLO
#   script.trgfn_default_emittente_fiscale()   BEFORE INSERT, FOR EACH ROW
#   Brief: brief-db-emittente-di-default-un-bb-solo, sezione 4 (D1, D4, D5)
#
# -- LA REGOLA, UNA VOLTA -----------------------------------------------------------
#   «Se la riga non dice l'emittente, e' quello di chi la scrive; se non c'e'
#   nessuno da cui dedurlo, la riga non entra.» Fino a oggi era scritta
#   QUATTRO volte in vendite (trgfn_ordini/preventivi/contratti/ddt_default_
#   emittente: tre copie esatte e una variante) e mancava del tutto sulle
#   altre tabelle ancorate su emittente_fiscale_id NOT NULL — fra cui
#   magazzino.magazzini e magazzino.assets, appena messe in forma dal Lotto 1,
#   dove un INSERT dal pannello senza emittente muore con 23502.
#   Decisione di Tid (2026-09-15): la funzione generica E il ritiro delle
#   copie nello stesso giro — «ora non c'e' produzione, che aspettiamo?».
#
# -- DUE ARGOMENTI, E BASTANO --------------------------------------------------------
#   TG_ARGV[0]  modo     'SOLLEVA'     : niente da cui dedurre -> E_EMITTENTE_NON_RISOLTO
#                        'LASCIA_NULL' : niente da cui dedurre -> RETURN NEW, decide chi
#                                        viene dopo (un normalize, o il NOT NULL)
#   TG_ARGV[1]  opzione  'SALTA_CON_SORGENTE' (facoltativa): se la riga porta
#                        sorgente_tipo_id + sorgente_uid non si tocca niente —
#                        un documento nato da un altro documento eredita
#                        l'emittente di QUELLO, a valle (regola di ddt: il suo
#                        normalize fa COALESCE(NEW, sorgente), e NEW vince).
#   ⛔ Colonna FISSA emittente_fiscale_id: e' il nome su cui poggia il perimetro
#   (vw_rls_perimetro_scoperto, fn_scope_ef_whitelist_*), e tutte le tabelle
#   montate la chiamano cosi'. commesse (emittente_soggetto_ruolo_id, derivato
#   dal billing account) NON e' una copia e resta con la sua funzione.
#   Le colonne facoltative (sorgente_*, tx_id) si leggono da to_jsonb(NEW), in
#   sola lettura: e' la forma di script.trgfn_guard_emittente_scope.
#
# -- UN CODICE SOLO ----------------------------------------------------------------
#   E_EMITTENTE_NON_RISOLTO (DATO_ERRATO, campo emittente_fiscale_id): chi puo'
#   rimediare e' una persona — scegliere l'emittente in alto, o dichiararlo.
#   Il messaggio non ha segnaposto: la diagnostica (GUC vuota / operatore senza
#   assegnazione) sta nel context, dove la legge dbops.error_log — le tre copie
#   incollavano «GUC vuota, numero=...» al %s della frase per l'operatore.
#   I tre codici di dominio (E_ORDINE_/E_PREV_/E_CONTRATTO_EMITTENTE_NON_RISOLTO)
#   prendono obsoleto_dal nel CSV: mai un DELETE, il diario resta leggibile.
#   Un argomento di montaggio sbagliato -> E_TRIGGER_ARGOMENTI_INVALIDI (TECNICO,
#   gia' a catalogo): muore al primo INSERT, non tace.
#
# -- L'ORDINE E' IL NOME (D5) ------------------------------------------------------
#   I BEFORE ROW scattano in ordine alfabetico: trg_<t>_a10_default_emittente_ins
#   viene prima di trg_<t>_a10_guard_emittente_ba_*, _guard_emittente_scope_* e
#   di trg_<t>_normalize_*. Il pgTAP di P-6 lo asserisce per ogni tabella.
#
# -- AREA DEL LOG = SCHEMA DELLA TABELLA ------------------------------------------
#   Come trgfn_guard_emittente_scope: TG_TABLE_SCHEMA, cosi' in error_log il
#   rifiuto sta nel dominio della riga (vendite, magazzino, ...), non in script.
#
# -- %TYPE nel DECLARE (regola di Tid) ----------------------------------------------
#   auth_user_id e emittente_fiscale_id sono riflessi di colonne.
#
# Dipendenze: script.fn_resolve_emittente_for_user (20_code, esiste dal 2026);
#   il codice E_EMITTENTE_NON_RISOLTO e' in 80_data (si risolve a runtime, nessuna
#   preCondition sul seed: guardrail_precondition_seed).
# Verifica: db/pgtap/script/test-trgfn-default-emittente-fiscale-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260915-36-create-trgfn-default-emittente-fiscale-mctit.yaml

  - changeSet:
      id: 20260915-36-create-trgfn-default-emittente-fiscale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.trgfn_default_emittente_fiscale: il default dell'emittente fiscale in un
        building block solo (BEFORE INSERT). TG_ARGV[0] = SOLLEVA | LASCIA_NULL;
        TG_ARGV[1] = SALTA_CON_SORGENTE (facoltativo). Sostituisce le quattro copie di
        vendite (ritirate nei changeSet successivi) e si monta sulle tabelle ancorate su
        emittente_fiscale_id NOT NULL che oggi non hanno default. Codice
        E_EMITTENTE_NON_RISOLTO (DATO_ERRATO). Brief: brief-db-emittente-di-default-un-bb-solo,
        sezione 4 (P-1).
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_resolve_emittente_for_user';
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT count(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_default_emittente_fiscale()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                v_modo          text := TG_ARGV[0];   -- NULL se non passato (indice fuori da TG_NARGS)
                v_opzione       text := TG_ARGV[1];
                v_row           jsonb;
                v_tx_id         uuid;
                v_auth_user_id  anagrafiche.identita_digitali.auth_user_id%TYPE;
                v_ef_id         anagrafiche.emittenti_fiscali.id%TYPE;
              BEGIN
                -- Scopo: riempire emittente_fiscale_id quando la riga arriva senza,
                --   con l'emittente di lavoro di chi scrive (attivo di sessione se in
                --   scope, altrimenti quello assegnato). Building block unico: sostituisce
                --   le copie per documento di vendite. Brief: brief-db-emittente-di-default-un-bb-solo.
                -- Regole:
                --   0. argomenti di montaggio non ammessi -> E_TRIGGER_ARGOMENTI_INVALIDI
                --      (difetto di chi installa: muore al primo INSERT, non tace);
                --   1. valore esplicito -> non si sovrascrive mai una scelta dichiarata;
                --   2. SALTA_CON_SORGENTE e riga con sorgente_tipo_id + sorgente_uid ->
                --      l'emittente e' del documento padre, lo mette il normalize a valle;
                --   3. GUC app.current_user_id vuota -> LASCIA_NULL: RETURN NEW;
                --      SOLLEVA: E_EMITTENTE_NON_RISOLTO;
                --   4. resolver NULL (admin globale senza assegnazione) -> idem;
                --   5. altrimenti NEW.emittente_fiscale_id := emittente di lavoro.

                -- 0) Argomenti di montaggio.
                IF TG_OP <> 'INSERT'
                   OR TG_NARGS < 1 OR TG_NARGS > 2
                   OR v_modo NOT IN ('SOLLEVA', 'LASCIA_NULL')
                   OR (TG_NARGS = 2 AND v_opzione IS DISTINCT FROM 'SALTA_CON_SORGENTE') THEN
                  PERFORM script.fn_log_and_raise_error(
                    TG_TABLE_SCHEMA::text,
                    'script.trgfn_default_emittente_fiscale',
                    'E_TRIGGER_ARGOMENTI_INVALIDI',
                    jsonb_build_object(
                      'detail',    'atteso BEFORE INSERT con TG_ARGV[0] in (SOLLEVA, LASCIA_NULL) e TG_ARGV[1] facoltativo = SALTA_CON_SORGENTE',
                      'tabella',   TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      'trigger',   TG_NAME,
                      'tg_op',     TG_OP,
                      'argomenti', to_jsonb(TG_ARGV)
                    ),
                    NULL::uuid,
                    concat_ws(' ', TG_OP, coalesce(NULLIF(array_to_string(TG_ARGV, ', '), ''), '(nessun argomento)'))
                  );
                END IF;

                -- 1) Valore esplicito: non si tocca.
                IF NEW.emittente_fiscale_id IS NOT NULL THEN
                  RETURN NEW;
                END IF;

                -- Le colonne facoltative (sorgente_*, tx_id) si leggono in sola lettura da
                -- to_jsonb(NEW): esistono su alcune tabelle montate, non su tutte.
                v_row   := to_jsonb(NEW);
                v_tx_id := NULLIF(v_row ->> 'tx_id', '')::uuid;

                -- 2) Riga nata da un documento sorgente: l'emittente e' quello del padre.
                IF v_opzione = 'SALTA_CON_SORGENTE'
                   AND (v_row ->> 'sorgente_tipo_id') IS NOT NULL
                   AND (v_row ->> 'sorgente_uid') IS NOT NULL THEN
                  RETURN NEW;
                END IF;

                -- 3) Chi scrive. GUC vuota = nessuno da cui dedurre.
                v_auth_user_id := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                IF v_auth_user_id IS NULL THEN
                  IF v_modo = 'LASCIA_NULL' THEN
                    RETURN NEW;
                  END IF;
                  PERFORM script.fn_log_and_raise_error(
                    TG_TABLE_SCHEMA::text,
                    'script.trgfn_default_emittente_fiscale',
                    'E_EMITTENTE_NON_RISOLTO',
                    jsonb_build_object(
                      'detail',  'GUC app.current_user_id vuota e riga senza emittente_fiscale_id: fuori da una sessione utente non c'' e'' nulla da cui dedurlo',
                      'campo',   'emittente_fiscale_id',
                      'tabella', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME
                    ),
                    v_tx_id,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                -- 4) Emittente di lavoro: attivo di sessione se in scope, altrimenti quello
                --    assegnato in config.user_emittenti_fiscali; NULL per un admin globale
                --    senza assegnazione (modalita' «tutti gli emittenti», di sola lettura).
                v_ef_id := script.fn_resolve_emittente_for_user(v_auth_user_id);
                IF v_ef_id IS NULL THEN
                  IF v_modo = 'LASCIA_NULL' THEN
                    RETURN NEW;
                  END IF;
                  PERFORM script.fn_log_and_raise_error(
                    TG_TABLE_SCHEMA::text,
                    'script.trgfn_default_emittente_fiscale',
                    'E_EMITTENTE_NON_RISOLTO',
                    jsonb_build_object(
                      'detail',       'operatore senza emittente assegnato (admin globale in modalita'' tutti gli emittenti): la riga deve dichiararlo',
                      'campo',        'emittente_fiscale_id',
                      'tabella',      TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                      'auth_user_id', v_auth_user_id
                    ),
                    v_tx_id,
                    VARIADIC ARRAY[]::text[]
                  );
                END IF;

                -- 5) Il default.
                NEW.emittente_fiscale_id := v_ef_id;
                RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_default_emittente_fiscale() IS
                  'BEFORE INSERT generico: riempie emittente_fiscale_id, se NULL, con l''emittente '
                  'di lavoro di chi scrive (script.fn_resolve_emittente_for_user dalla GUC '
                  'app.current_user_id). TG_ARGV[0] = SOLLEVA (niente da cui dedurre -> '
                  'E_EMITTENTE_NON_RISOLTO, DATO_ERRATO, campo emittente_fiscale_id) oppure '
                  'LASCIA_NULL (RETURN NEW: decide un normalize a valle o il NOT NULL). '
                  'TG_ARGV[1] facoltativo = SALTA_CON_SORGENTE: se la riga porta sorgente_tipo_id '
                  'e sorgente_uid non si tocca, l''emittente e'' quello del documento padre. '
                  'Un valore esplicito non si sovrascrive mai. Argomenti non ammessi -> '
                  'E_TRIGGER_ARGOMENTI_INVALIDI. Colonna fissa emittente_fiscale_id (l''ancora del '
                  'perimetro). Sostituisce dal 2026-09-15 le quattro copie vendite.trgfn_ordini/'
                  'preventivi/contratti/ddt_default_emittente. Brief: '
                  'brief-db-emittente-di-default-un-bb-solo, sezione 4.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.trgfn_default_emittente_fiscale();
