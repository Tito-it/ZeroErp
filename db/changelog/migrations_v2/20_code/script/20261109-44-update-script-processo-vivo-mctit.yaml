                  --    convenzione Django per «non puo' autenticarsi»).
                  INSERT INTO django.auth_user
                      (password, is_superuser, username, first_name, last_name,
                       email, is_staff, is_active, date_joined)
                  VALUES ('!' || md5(random()::text || clock_timestamp()::text),
                          false, v_username, '', '', '', false, true, now())
                  RETURNING id INTO v_auth_user_id;

                  -- 2. Il soggetto, uno per (processo, emittente).
                  --    `codice` NULL -> lo genera trgfn_soggetti_gen_codice;
                  --    `tipo_soggetto_dettaglio_id` NULL -> i guard differiti su
                  --    indirizzi e dati societari escono da soli.
                  INSERT INTO anagrafiche.soggetti
                      (ragione_sociale, stato_id)
                  VALUES ('Processo automatico: ' || v_username, v_stato_id)
                  RETURNING id INTO v_soggetto_id;

                  -- 3. Il contatto di riferimento: il guard differito sui
                  --    contatti ammette esplicitamente `is_default` coi canali
                  --    vuoti, ed e' la verita' — un processo canali non ne ha.
                  --    (BB anagrafiche.fn_crea_contatto, rev 2026-10-17)
                  PERFORM anagrafiche.fn_crea_contatto(
                      v_soggetto_id, NULL,
                      jsonb_build_object('tipo_contatto_id', v_tipo_contatto_id,
                                         'nominativo',       'Processo automatico: ' || v_username,
                                         'is_default',       true));

                  -- Padre e figlio in ISTRUZIONI SEPARATE: una CTE unica
                  -- condividerebbe la stessa snapshot.
                  INSERT INTO anagrafiche.soggetti_ruoli
                      (soggetto_id, tipo_ruolo_id)
                  VALUES (v_soggetto_id, v_tipo_ruolo_id)
                  RETURNING id INTO v_sog_ruolo_id;

                  -- 4. L'identita': OPERATORE (ogni policy RLS lo pretende in
                  --    AND) + flag tecnica, che sceglie il ramo PROC_AUTO del
                  --    guard di coerenza.
                  INSERT INTO anagrafiche.identita_digitali
                      (soggetto_ruolo_id, auth_user_id, ruolo_applicativo, tecnica)
                  VALUES (v_sog_ruolo_id, v_auth_user_id,
                          'OPERATORE'::config.ruolo_applicativo, true)
                  RETURNING id INTO v_identita_id;

                  -- 5. ⭐ IL PERIMETRO. Una riga sola, perche' la tabella e'
                  --    1-a-1 sull'utente. Non e' il sistema che si concede un
                  --    permesso: l'emittente e' arrivato come parametro, deciso
                  --    da chi ha scritto la chiamata (D-9).
                  INSERT INTO config.user_emittenti_fiscali
                      (auth_user_id, emittente_fiscale_id)
                  VALUES (v_auth_user_id, v_emittente.id);

                  -- 6. Il binding SOLO se un profilo e' stato chiesto.
                  IF p_profilo_codice IS NOT NULL THEN
                      -- rev 2026-10-18: il BB del binding (regola del 2).
                      PERFORM config.fn_lega_profilo_identita(v_profilo.id, v_identita_id);
                  END IF;

                  -- 7. Il legame processo -> utente.
                  INSERT INTO dbops.processi_identita
                      (processo_id, auth_user_id)
                  VALUES (v_processo.id, v_auth_user_id);

                  RETURN v_auth_user_id;
              END;
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_identita_processo(p_auth_user_id integer, p_processo_codice text)
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- =====================================================
                  -- Scopo:
                  --   «Questa sessione e' l'identita' tecnica VIVA del
                  --   processo indicato?» Una domanda sola, scritta una
                  --   volta sola, usata da chi deve decidere se una
                  --   macchina puo' leggere.
                  --
                  -- ⭐ Cinque livelli, non uno. Il legame attivo da solo
                  --   lascerebbe leggere un'identita' REVOCATA: basta che
                  --   nessuno abbia toccato anche `processi_identita`.
                  -- ⚠️ L'emittente NON entra: qui si chiede «chi sei», non
                  --   «su quale azienda lavori» — quello lo dice
                  --   dbops.vw_processi_roster.
                  -- =====================================================
                  SELECT EXISTS (
                      SELECT 1
                        FROM dbops.processi_identita pi
                        JOIN dbops.processi pr
                          ON pr.id = pi.processo_id
                         AND pr.attivo
                         AND pr.obsoleto_dal IS NULL
                        JOIN anagrafiche.identita_digitali idg
                          ON idg.auth_user_id = pi.auth_user_id
                         -- Rev 2026-10-07: utilizzabile oggi (accesa, nelle sue
                         --   date, soggetto attivo), non solo accesa.
                         AND script.fn_veste_utilizzabile(idg.id)
                         AND idg.ruolo_applicativo
                             = 'OPERATORE'::config.ruolo_applicativo
                        -- ⚠️ django.* si attraversa da una funzione, mai da
                        --   una vista: zero righe se l'utente non c'e' piu',
                        --   che in un join fa sparire la riga (fail-closed).
                        JOIN LATERAL script.fn_get_auth_user_stato(pi.auth_user_id) au
                          ON au.is_active
                       WHERE pi.attivo
                         AND pi.auth_user_id    = p_auth_user_id
                         AND pr.codice          = p_processo_codice
                  );
              $function$
              ;

              COMMENT ON FUNCTION script.fn_scope_identita_processo(integer, text) IS
                  'Dice se p_auth_user_id e'' l''identita'' tecnica VIVA del processo p_processo_codice. ⭐ Nasce il 2026-09-05 per togliere due copie dello stesso EXISTS dalla policy rls_email_outbox_ambito (USING e WITH CHECK): la famiglia duplica anche altrove, ma li'' e'' UNA CHIAMATA, e due chiamate identiche non possono divergere — dieci righe si''. ⭐ E la regola e'' piu'' stretta di quella che sostituisce: guarda CINQUE livelli (legame attivo, processo vivo, identita'' attiva, ruolo OPERATORE, utente Django attivo) invece del solo legame, perche'' un''identita'' revocata a un livello solo avrebbe continuato a leggere. ⚠️ L''emittente non entra: qui si chiede «chi sei», non «su quale azienda lavori» — quello e'' dbops.vw_processi_roster, e legarli toglierebbe la lettura delle email di SISTEMA, che di azienda non ne hanno. ⚠️ LANGUAGE sql STABLE perche'' una policy si valuta per riga e il pianificatore la puo'' incorporare. ⛔ Niente STRICT: con un parametro NULL l''EXISTS non trova niente e la funzione torna false — fail-closed per costruzione, non per coincidenza. ⚠️ django.* si attraversa da script.fn_get_auth_user_stato (plpgsql, late-bound), mai da una vista: regola presa col changeSet 20260905-30. Rev 2026-10-07 (brief-db-veste-utilizzabile): il livello «identita'' attiva» e'' diventato «identita'' utilizzabile oggi» (script.fn_veste_utilizzabile: accesa, nelle sue date, soggetto attivo; l''identita'' tecnica non pretende un rapporto).';
