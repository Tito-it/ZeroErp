                  --   NON sono intercambiabili perche' i loro messaggi hanno un numero
                  --   DIVERSO di segnaposto:
                  --     guard 4  E_UTENTE_TECNICO_GIA_ESISTE     1 %s  «esiste ed e' ATTIVO»
                  --     qui      E_UTENTE_TECNICO_DA_RIATTIVARE  2 %s  «esiste ed e' SPENTO»
