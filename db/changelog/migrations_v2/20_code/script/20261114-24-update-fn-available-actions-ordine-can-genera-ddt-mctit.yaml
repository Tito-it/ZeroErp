# LA CAPABILITY DELL'ORDINE: can_genera_ddt
#   Brief: brief-db-stati-documento-dal-vocabolario §6.17, giro 6b-bis
#   (D-EVAD (a), Tid 2026-11-14).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   Il drawer dell'ordine accende «Genera bolla» con STATI_ORDINE_EVADIBILI
#   (frontend/src/vendite/ordini/constants.js: CONFERMATO e PARZIALMENTE_EVASO
#   col codice), una copia della regola di vendite.fn_genera_ddt_da_ordine
#   (S-10). La capability non aveva una chiave da leggere al suo posto.
#
# ── LA CORREZIONE ───────────────────────────────────────────────────
#   La terna can_genera_ddt · _reason · _reason_key (famiglia 1, come
#   can_push_commessa e can_edit_data_consegna_confermata), dal primo motivo di
#   script.fn_check_ordine_evadibile (-22), la stessa check da cui la bolla
#   rifiuta (-23). Il flag discende dal motivo. Chiavi in piu' nel blob, nessuna
#   chiave cambia: il contratto si allarga. reason_key nuova:
#   vendite.ordini.genera_ddt_reason.stato_non_evadibile (debito FE).
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma, STABLE, INVOKER, nessun SET (pg_proc su
#   dbdev, 2026-11-14). Il COMMENT aggiunge la frase sulla terna.
#
# ── DA DOVE VIENE IL CORPO ──────────────────────────────────────────
#   pg_get_functiondef su dbdev, 2026-11-14; la firma, coi suoi %TYPE, dal
#   changeSet che l'ha scritta per ultimo (il catalogo li scioglie). Il
#   rollback porta il corpo e il COMMENT di prima, letti dal catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261114-24-update-fn-available-actions-ordine-can-genera-ddt-mctit.yaml

  - changeSet:
      id: 20261114-24-update-fn-available-actions-ordine-can-genera-ddt
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_available_actions_ordine: + can_genera_ddt, can_genera_ddt_reason,
        can_genera_ddt_reason_key da script.fn_check_ordine_evadibile. Brief:
        brief-db-stati-documento-dal-vocabolario, giro 6b-bis.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_ordine(
                  p_ordine_id vendite.ordini.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6b-bis):
              --   + can_genera_ddt · _reason · _reason_key dal primo motivo di
              --   script.fn_check_ordine_evadibile, la stessa check da cui la bolla
              --   dall'ordine rifiuta.
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6b):
              --   la bozza e l'annullo dalle colonne iniziale e is_abortito del
              --   vocabolario, non dai codici; can_edit_righe dal lock delle righe
              --   (script.fn_doc_riga_modificabile). COMMENT riscritto al presente.
              -- rev 2026-10-20 (20261020-95, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave della riga d'ordine la compone script.fn_segment_key
              --   (ORDINE_VENDITA). Firma e RETURNS ancorati.
              -- Scopo: capability ordine di vendita per detail API (data-driven).
              --   push_commessa: decoupling fatturazione/spedizione (rev 2026-07-10,
              --   fn_list_ordini_da_pushare fonte unica; reason ORDINE_NON_CONFERMATO /
              --   ORDINE_FATTURA_DA_DDT / ORDINE_GIA_INVIATO / ORDINE_GIA_FATTURATO /
              --   ORDINE_NESSUNA_RIGA_PUSHABILE).
              --   rev 2026-07-19: ramo reason via fn_get_stato_push_segment
              --   (brief-db-push-commessa-gia-inviato §4b).
              --   rev 2026-07-19 (bis): reason_key nel namespace i18n
              --   `vendite.ordini.*` (era `ordini.*`, non risolvibile nel FE)
              --   — brief-db-i18n-namespace-reason-ordini.
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_ordini (bottone PDF data-driven via capabilities).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-08-04: + reasons sull'annullamento, da
              --   script.fn_check_ordine_annullabile — la STESSA funzione che
              --   vendite.trgfn_ordini_guard_transizione usa per sollevare. I motivi
              --   si SOMMANO a quello di requires_righe in un array solo, da cui
              --   discendono enabled/reason/reason_key. + nessuna_azione_key dal
              --   meta dello stato, esposta quando nessuna azione e' abilitata
              --   (brief-db-vie-uscita-operatore §4 regola R3 e §6).
              --   rev 2026-08-06: + target_state_descrizione, la forma leggibile
              --   dello stato di destinazione. Serve alla frase di conferma
              --   «portare il documento nello stato X»: il codice_interno non e'
              --   quella forma (DRAFT -> Bozza, ALLOCATO -> Allocato a magazzino)
              --   e tradurlo nel FE sarebbe una seconda copia del vocabolario
              --   degli stati. NULL sulle azioni che non cambiano stato.
              --   rev 2026-08-29: + reasons sulla CONFERMA, da
              --   script.fn_check_ordine_confermabile — la STESSA funzione che
              --   il guard usa per sollevare (Regola 4). Oggi un motivo:
              --   una riga attiva che porta un prezzo senza aliquota IVA.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I9.
              --   rev 2026-08-10: ANNULLATO esce dal ramo di DRAFT. Il motivo
              --   ORDINE_NON_CONFERMATO («disponibile dopo la conferma») e'
              --   un'istruzione corretta su DRAFT e una promessa falsa su
              --   ANNULLATO, da cui la matrice non ha uscite. NON si usa
              --   fase = 'CHIUSO' come sul preventivo: fra i CHIUSI c'e'
              --   EVASO, che puo' ancora avere il push abilitato (5 ordini
              --   misurati), e un ramo su fase lo intercetterebbe prima di
              --   v_push_ok. Gemello del 20260810-01, brief-db-vie-uscita-
              --   operatore §12.
              --   rev 2026-08-10 (2): la nota di stato non e' piu' subordinata alla
              --   lista vuota, e cambia nome. Decisione §5 di Tid: «la nota spiega lo
              --   stato chiuso, e compare sempre» — anche accanto a un'azione ancora
              --   viva, dove l'operatore legge cos'e' successo E ha il suo bottone.
              --   Cade quindi il presupposto che la faceva sparire: via
              --   v_nessuna_azione e il suo NOT EXISTS, che erano diventati codice
              --   morto, e via il commento che spiegava perche' non si appoggiavano a
              --   v_can_change — era la motivazione di una regola che non esiste piu'.
              --   Il campo si chiama ora `stato_info_key`: `nessuna_azione_key`
              --   diventava falso proprio nel momento in cui inizia a mostrarsi
              --   quando le azioni ci sono, e il vocabolario giusto era gia' dall'altra
              --   parte (le chiavi i18n stanno sotto vendite.<dominio>.stato_info.*).
              --   ⚠️ La PROPRIETA' nel meta dello stato resta `nessuna_azione_key`, ed
              --   e' voluto: il presidio scripts/check_i18n_keys.py trova quelle chiavi
              --   proprio per quel nome (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e
              --   rinominarla senza toccare il guard lo renderebbe verde per cecita' —
              --   il caso peggiore, gia' denunciato nel §8.3 del brief. Rinomina della
              --   proprieta' proposta come slice a se'.
              --   brief-db-vie-uscita-operatore §4; attivita-urgenti-del-10-08 §2.
              --   rev 2026-09-24: dalla bozza, l'azione verso CONFERMATO espone anche i
              --   motivi dei prezzi non autorizzati (building block
              --   script.fn_check_prezzi_autorizzati, lo stesso della Regola 5 del
              --   guard di transizione). brief-db-preventivi-congelamento-pricing.
              --   rev 2026-10-10: + la terna can_edit_data_consegna_confermata
              --   (_reason, _reason_key): la promessa di consegna che il verbo
              --   dedicato cambia dopo la conferma. Gli stati li dice il montaggio
              --   del lock delle righe, letto da
              --   script.fn_check_ordine_data_consegna_confermata; in DRAFT la data
              --   si scrive dalla riga. brief-db-testata-dopo-emissione (R-2).
              --   rev 2026-10-25 (20261025-81, brief-modello-documento-vendita §9,
              --   M-3): un passaggio con un'azione sulla sua riga della matrice
              --   (emetti_ordine sulla conferma e sull'annullo del confermato, letta
              --   da script.fn_doc_passaggio) si NASCONDE a chi non ha l'azione:
              --   permesso => nascondi, stato => disabilita col motivo. I motivi si
              --   legano alle colonne del vocabolario (emissione, is_abortito), non ai
              --   codici scritti.
              DECLARE
                  -- Tipi nudi solo per valori CALCOLATI (azioni e motivi jsonb, flag,
                  -- motivi e chiavi i18n composti): nessuna colonna di cui siano il riflesso.
                  v_stato_id   vendite.ordini.stato_doc_ordine_id%TYPE;
                  v_stato_cod  config.stati_doc_ordini.codice_interno%TYPE;
                  v_uid        vendite.ordini.uid%TYPE;
                  v_fatt_trg   vendite.ordini.fatturazione_trigger%TYPE;
                  v_pdf_mode   config.stati_doc_ordini.pdf_mode%TYPE;
                  v_pdf_allow  config.stati_doc_ordini.pdf_allow_allegati%TYPE;
                  v_stato_info_key    text;
                  -- Il significato dello stato corrente, dal vocabolario.
                  v_iniziale   config.stati_doc_ordini.iniziale%TYPE;
                  v_abortito   config.stati_doc_ordini.is_abortito%TYPE;
                  -- I motivi per cui dall'ordine non si genera una bolla (rev 2026-11-14,
                  -- giro 6b-bis): l'array della check, nessuna colonna.
                  v_mot_evad   jsonb := '[]'::jsonb;
                  v_actions    jsonb;
                  v_can_change boolean := false;
                  v_ha_righe   boolean := false;
                  v_mot_annulla jsonb := '[]'::jsonb;
                  v_mot_conferma jsonb := '[]'::jsonb;
                  v_mot_prezzi   jsonb := '[]'::jsonb;
                  v_push_ok    boolean := false;
                  v_push_reason     text := NULL;
                  v_push_reason_key text := NULL;
                  -- La promessa di consegna (data_consegna_confermata): motivi
                  -- della check, e il primo motivo in chiaro.
                  v_mot_dcc         jsonb := '[]'::jsonb;
                  v_dcc_reason      text := NULL;
                  v_dcc_reason_key  text := NULL;
                  c_non_edit_cliente CONSTANT jsonb :=
                      '["billing_account_id","soggetto_ruolo_id"]'::jsonb;
                  -- Motivo "documento vuoto" nella forma dei motivi delle fn_check_*,
                  -- cosi' i due mondi si concatenano. `codice` e' quello che il guard
                  -- solleva davvero (trgfn_ordini_guard_transizione, Regola 2).
                  c_motivo_senza_righe CONSTANT jsonb := jsonb_build_array(
                      jsonb_build_object(
                          'codice',     'E_ORDINE_CONFERMA_SENZA_RIGHE',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  0));
                  -- La testata nello stato, dal montaggio del lock (rev 2026-10-10):
                  -- {modificabile, non_modificabili}.
                  v_testata jsonb;
              BEGIN
                  -- Stato corrente + trigger + uid + capability PDF + la chiave
                  -- "nessuna azione" dello stato (dato, non codice).
                  SELECT o.stato_doc_ordine_id, sdo.codice_interno,
                         o.uid, o.fatturazione_trigger,
                         sdo.pdf_mode, sdo.pdf_allow_allegati,
                         -- ⚠️ La PROPRIETA' nel meta resta `nessuna_azione_key` mentre il
                         -- campo del blob si chiama ora `stato_info_key`. L'asimmetria e'
                         -- voluta e la spiega la rev 2026-08-10 (2) in testa: il presidio
                         -- i18n si aggancia a QUESTO nome.
                         sdo.meta->>'nessuna_azione_key',
                         sdo.iniziale, sdo.is_abortito
                    INTO v_stato_id, v_stato_cod, v_uid, v_fatt_trg,
                         v_pdf_mode, v_pdf_allow, v_stato_info_key,
                         v_iniziale, v_abortito
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini sdo ON sdo.id = o.stato_doc_ordine_id
                   WHERE o.id = p_ordine_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard (trgfn_ordini_guard_transizione
                  -- Regola 2, rev 2026-07-16): riga attiva, nessun vincolo su
                  -- quantita/prezzo (un ordine a totale zero deve poter avanzare).
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.ordini_righe r
                       WHERE r.ordine_id = p_ordine_id
                         AND r.attivo IS TRUE
                  );

                  -- Motivi ostativi all'ANNULLAMENTO, calcolati UNA VOLTA SOLA.
                  -- Fn pura: [] quando e' lecito. E' la stessa che solleva nel guard.
                  v_mot_annulla := script.fn_check_ordine_annullabile(p_ordine_id);

                  -- Motivi ostativi alla CONFERMA, anch'essi calcolati UNA VOLTA SOLA.
                  -- Stessa forma e stessa ragione: e' la funzione che il guard di
                  -- transizione usa per sollevare (Regola 4), quindi bottone e guard
                  -- non possono divergere. rev 2026-08-29, brief IVA I9.
                  v_mot_conferma := script.fn_check_ordine_confermabile(p_ordine_id);

                  -- Motivi dei prezzi non autorizzati: SOLO dalla bozza, come la
                  -- Regola 5 del guard di transizione che li solleva con lo stesso
                  -- building block (il rientro in CONFERMATO da EVASO non e' una
                  -- conferma, ed e' comunque automatico). rev 2026-09-24,
                  -- brief-db-preventivi-congelamento-pricing (D-6).
                  IF v_iniziale THEN
                      v_mot_prezzi := script.fn_check_prezzi_autorizzati('vendite.ordini'::regclass,
                                                                         p_ordine_id);
                  END IF;

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              -- Tutto discende dall'array dei motivi: nessuna
                              -- regola puo' mascherarne un'altra.
                              'enabled',          jsonb_array_length(m.motivi) = 0,
                              'reason',           m.motivi -> 0 ->> 'reason',
                              'reason_key',       m.motivi -> 0 ->> 'reason_key',
                              'reasons',          m.motivi
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  -- I passaggi manuali che l'utente puo' fare, dal BB comune (rev
                  -- 2026-10-27, 20261027-44, §15.14): matrice viva, manuale, permesso.
                  FROM script.fn_doc_azioni_permesse('vendite.ordini'::regclass, v_stato_id) t
                  JOIN config.stati_doc_ordini sa ON sa.id = t.stato_a_id
                  -- I motivi della destinazione, sommati in un array solo: prima
                  -- quelli specifici, poi il generico "documento vuoto".
                  CROSS JOIN LATERAL (
                      -- rev 2026-10-25 (20261025-81): l'annullo e l'emissione li dice il
                      -- vocabolario (is_abortito, emissione), non il codice.
                      SELECT CASE WHEN sa.is_abortito
                                  THEN v_mot_annulla ELSE '[]'::jsonb END
                          || CASE WHEN sa.emissione
                                  THEN v_mot_conferma || v_mot_prezzi ELSE '[]'::jsonb END
                          || CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                       AND NOT v_ha_righe
                                  THEN c_motivo_senza_righe ELSE '[]'::jsonb END AS motivi
                  ) m
                  WHERE t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Conta anche le azioni disabilitate: la barra azioni deve
                  -- comparire proprio per mostrare il pulsante grigio + tooltip.
                  v_can_change := jsonb_array_length(v_actions) > 0;

                  -- push_commessa: fonte unica fn_list_ordini_da_pushare (decoupling).
                  -- Namespace i18n: `vendite.ordini.*` — coerente con la label_key
                  -- dell'azione push qui sotto e con le reason DDT. Il codice reason
                  -- (ORDINE_*) NON e' una chiave i18n e non segue questa convenzione.
                  --
                  -- ⚠️ DRAFT e ANNULLATO erano nello stesso ramo, e sono
                  -- l'opposto: su DRAFT «disponibile dopo la conferma»
                  -- istruisce, su ANNULLATO promette un passo che non
                  -- arrivera' mai (nessuna transizione in uscita dalla
                  -- matrice). Il predicato e' sul significato dello stato
                  -- (iniziale, is_abortito, dal vocabolario) e non su
                  -- fase = 'CHIUSO': fra i CHIUSI dell'ordine c'e' anche
                  -- EVASO, che puo' avere il push ancora ABILITATO, e un
                  -- ramo su fase in testa alla catena lo spegnerebbe prima
                  -- che v_push_ok venga calcolato — un difetto di
                  -- comportamento al posto di uno di testo.
                  IF v_iniziale THEN
                      v_push_reason     := 'ORDINE_NON_CONFERMATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.non_confermato';
                  ELSIF v_abortito THEN
                      v_push_reason     := 'ORDINE_ANNULLATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.annullato';
                  ELSIF v_fatt_trg IS DISTINCT FROM 'CONFERMATO' THEN
                      v_push_reason     := 'ORDINE_FATTURA_DA_DDT';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.fattura_da_ddt';
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.fn_list_ordini_da_pushare(p_ordine_id := p_ordine_id)) THEN
                      v_push_ok := true;
                  -- Nessuna riga pushabile: distinguere il PERCHE'
                  -- via classificatore condiviso (stesso predicato
                  -- delle push-list, vede anche i componenti #CMP).
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.ordini_righe r
                                 WHERE r.ordine_id = p_ordine_id
                                   AND script.fn_get_stato_push_segment(
                                         script.fn_segment_key('ORDINE_VENDITA', v_uid::text, r.id)) = 'ALLOCATA') THEN
                      -- pushato, in attesa di fatturazione
                      v_push_reason     := 'ORDINE_GIA_INVIATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.gia_inviato';
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.ordini_righe r
                                 WHERE r.ordine_id = p_ordine_id
                                   AND script.fn_get_stato_push_segment(
                                         script.fn_segment_key('ORDINE_VENDITA', v_uid::text, r.id)) = 'EMESSA') THEN
                      v_push_reason     := 'ORDINE_GIA_FATTURATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.gia_fatturato';
                  ELSE
                      v_push_reason     := 'ORDINE_NESSUNA_RIGA_PUSHABILE';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.nessuna_riga_pushabile';
                  END IF;

                  IF v_push_ok THEN
                      v_actions := v_actions || jsonb_build_array(
                          jsonb_build_object(
                              'key',              'push_commessa',
                              'target_state',     NULL,
                              -- Non e' un cambio di stato: nessuna destinazione
                              -- da nominare.
                              'target_state_descrizione', NULL,
                              'label_key',        'vendite.ordini.azione_push_commessa',
                              'requires_confirm', true,
                              'outlined',         false,
                              'enabled',          true,
                              'reason',           NULL,
                              'reason_key',       NULL
                          )
                      );
                  END IF;

                  -- La promessa di consegna dopo la conferma (rev 2026-10-10).
                  -- In DRAFT la data si scrive modificando la riga
                  -- (can_edit_righe): il verbo dedicato e' per dopo, e lo dice
                  -- il motivo. Negli altri stati decide il montaggio del lock
                  -- delle righe, letto dalla check: nessuno stato scritto qui.
                  IF v_iniziale THEN
                      v_dcc_reason     := 'ORDINE_IN_BOZZA';
                      v_dcc_reason_key := 'vendite.ordini.data_consegna_confermata_reason.in_bozza';
                  ELSE
                      v_mot_dcc        := script.fn_check_ordine_data_consegna_confermata(p_ordine_id);
                      v_dcc_reason     := v_mot_dcc -> 0 ->> 'reason';
                      v_dcc_reason_key := v_mot_dcc -> 0 ->> 'reason_key';
                  END IF;

                  -- La testata nello stato, letta dal montaggio del lock di testata
                  -- (rev 2026-10-10): le colonne «sempre» della capability, poi quelle
                  -- che il lock blocca in questo stato. Nessuno stato scritto qui.
                  v_testata := script.fn_doc_testata_in_stato('vendite.ordini'::regclass, v_stato_cod, c_non_edit_cliente);

                  -- La bolla di evasione (rev 2026-11-14, giro 6b-bis): la stessa check da
                  -- cui vendite.fn_genera_ddt_da_ordine rifiuta. Il flag discende dal motivo.
                  v_mot_evad := script.fn_check_ordine_evadibile(p_ordine_id);

                  RETURN jsonb_build_object(
                      'available_actions',           v_actions,
                      'can_change_state',            v_can_change,
                      'can_edit_testata',  (v_testata ->> 'modificabile')::boolean,
                      -- Dal lock delle righe (rev 2026-11-14): la stessa risposta del
                      -- trigger vendite.trgfn_doc_righe_lock_fuori_bozza.
                      'can_edit_righe',              script.fn_doc_riga_modificabile('vendite.ordini_righe'::regclass, v_stato_cod),
                      -- Dal montaggio del lock dei satelliti (rev 2026-10-11, R-DB-3).
                      'can_edit_indirizzi',  script.fn_doc_riga_modificabile('vendite.ordini_indirizzi'::regclass, v_stato_cod),
                      -- Il flag discende dal motivo: il backend trasporta.
                      'can_edit_data_consegna_confermata',            (v_dcc_reason IS NULL),
                      'can_edit_data_consegna_confermata_reason',     v_dcc_reason,
                      'can_edit_data_consegna_confermata_reason_key', v_dcc_reason_key,
                      'can_push_commessa',           v_push_ok,
                      'can_push_commessa_reason',    v_push_reason,
                      'can_push_commessa_reason_key', v_push_reason_key,
                      'can_genera_ddt',              jsonb_array_length(v_mot_evad) = 0,
                      'can_genera_ddt_reason',       v_mot_evad -> 0 ->> 'reason',
                      'can_genera_ddt_reason_key',   v_mot_evad -> 0 ->> 'reason_key',
                      'stato_info_key',          v_stato_info_key,
                      'non_editable_fields', v_testata -> 'non_modificabili',
                      'pdf',                         jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_codice',                v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_ordine(p_ordine_id vendite.ordini.id%TYPE)
              IS 'Capability dell''ordine di vendita per il dettaglio (NULL se l''ordine non c''e''). available_actions: i passaggi manuali permessi da script.fn_doc_azioni_permesse (matrice viva, manuale; un passaggio con un''azione di processo si nasconde a chi non ce l''ha), ognuno con enabled, reason e reason_key dal primo motivo e reasons, l''array intero; target_state e target_state_descrizione (la forma leggibile) dalla destinazione; label_key, requires_confirm, outlined dal meta del passaggio. I motivi, sul significato della destinazione: verso lo stato di annullo (is_abortito) script.fn_check_ordine_annullabile; verso lo stato di emissione script.fn_check_ordine_confermabile e, dallo stato iniziale, i prezzi non autorizzati di script.fn_check_prezzi_autorizzati; poi DOCUMENTO_SENZA_RIGHE dove il meta del passaggio chiede requires_righe e l''ordine non ha righe attive. Sono gli stessi predicati di vendite.trgfn_ordini_guard_transizione. can_change_state: vero se c''e'' almeno un''azione, anche disabilitata. push_commessa c''e'' quando vendite.fn_list_ordini_da_pushare ha righe per l''ordine; can_push_commessa e i suoi reason e reason_key: ORDINE_NON_CONFERMATO nello stato iniziale, ORDINE_ANNULLATO nello stato di annullo, ORDINE_FATTURA_DA_DDT con fatturazione_trigger diverso da CONFERMATO, poi ORDINE_GIA_INVIATO o ORDINE_GIA_FATTURATO da script.fn_get_stato_push_segment (vede anche i componenti #CMP), altrimenti ORDINE_NESSUNA_RIGA_PUSHABILE. can_genera_ddt, can_genera_ddt_reason e can_genera_ddt_reason_key: dal primo motivo di script.fn_check_ordine_evadibile, la stessa check da cui vendite.fn_genera_ddt_da_ordine rifiuta (la bolla si genera dallo stato di emissione e da PARZIALMENTE_EVASO); il flag discende dal motivo. Cosa si modifica: can_edit_testata e non_editable_fields dal montaggio del lock di testata (script.fn_doc_testata_in_stato; billing_account_id e soggetto_ruolo_id sempre bloccati), can_edit_righe e can_edit_indirizzi dal lock delle righe e degli indirizzi (script.fn_doc_riga_modificabile), lo stesso che i trigger fanno rispettare; can_edit_data_consegna_confermata e il suo motivo: nello stato iniziale ORDINE_IN_BOZZA (la data si scrive modificando la riga), negli altri il primo motivo di script.fn_check_ordine_data_consegna_confermata. pdf {mode, allow_allegati} dal vocabolario. stato_info_key: la nota dello stato dal suo meta (proprieta'' nessuna_azione_key), sempre presente, null quando lo stato non la dichiara. stato_codice: il codice_interno dello stato corrente. Le reason_key sono chiavi i18n del frontend.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_ordine(
                  p_ordine_id vendite.ordini.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- rev 2026-11-14 (brief-db-stati-documento-dal-vocabolario, giro 6b):
              --   la bozza e l'annullo dalle colonne iniziale e is_abortito del
              --   vocabolario, non dai codici; can_edit_righe dal lock delle righe
              --   (script.fn_doc_riga_modificabile). COMMENT riscritto al presente.
              -- rev 2026-10-20 (20261020-95, brief-db-grammatica-unica-documenti, 2e G-8):
              --   la chiave della riga d'ordine la compone script.fn_segment_key
              --   (ORDINE_VENDITA). Firma e RETURNS ancorati.
              -- Scopo: capability ordine di vendita per detail API (data-driven).
              --   push_commessa: decoupling fatturazione/spedizione (rev 2026-07-10,
              --   fn_list_ordini_da_pushare fonte unica; reason ORDINE_NON_CONFERMATO /
              --   ORDINE_FATTURA_DA_DDT / ORDINE_GIA_INVIATO / ORDINE_GIA_FATTURATO /
              --   ORDINE_NESSUNA_RIGA_PUSHABILE).
              --   rev 2026-07-19: ramo reason via fn_get_stato_push_segment
              --   (brief-db-push-commessa-gia-inviato §4b).
              --   rev 2026-07-19 (bis): reason_key nel namespace i18n
              --   `vendite.ordini.*` (era `ordini.*`, non risolvibile nel FE)
              --   — brief-db-i18n-namespace-reason-ordini.
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_ordini (bottone PDF data-driven via capabilities).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-08-04: + reasons sull'annullamento, da
              --   script.fn_check_ordine_annullabile — la STESSA funzione che
              --   vendite.trgfn_ordini_guard_transizione usa per sollevare. I motivi
              --   si SOMMANO a quello di requires_righe in un array solo, da cui
              --   discendono enabled/reason/reason_key. + nessuna_azione_key dal
              --   meta dello stato, esposta quando nessuna azione e' abilitata
              --   (brief-db-vie-uscita-operatore §4 regola R3 e §6).
              --   rev 2026-08-06: + target_state_descrizione, la forma leggibile
              --   dello stato di destinazione. Serve alla frase di conferma
              --   «portare il documento nello stato X»: il codice_interno non e'
              --   quella forma (DRAFT -> Bozza, ALLOCATO -> Allocato a magazzino)
              --   e tradurlo nel FE sarebbe una seconda copia del vocabolario
              --   degli stati. NULL sulle azioni che non cambiano stato.
              --   rev 2026-08-29: + reasons sulla CONFERMA, da
              --   script.fn_check_ordine_confermabile — la STESSA funzione che
              --   il guard usa per sollevare (Regola 4). Oggi un motivo:
              --   una riga attiva che porta un prezzo senza aliquota IVA.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I9.
              --   rev 2026-08-10: ANNULLATO esce dal ramo di DRAFT. Il motivo
              --   ORDINE_NON_CONFERMATO («disponibile dopo la conferma») e'
              --   un'istruzione corretta su DRAFT e una promessa falsa su
              --   ANNULLATO, da cui la matrice non ha uscite. NON si usa
              --   fase = 'CHIUSO' come sul preventivo: fra i CHIUSI c'e'
              --   EVASO, che puo' ancora avere il push abilitato (5 ordini
              --   misurati), e un ramo su fase lo intercetterebbe prima di
              --   v_push_ok. Gemello del 20260810-01, brief-db-vie-uscita-
              --   operatore §12.
              --   rev 2026-08-10 (2): la nota di stato non e' piu' subordinata alla
              --   lista vuota, e cambia nome. Decisione §5 di Tid: «la nota spiega lo
              --   stato chiuso, e compare sempre» — anche accanto a un'azione ancora
              --   viva, dove l'operatore legge cos'e' successo E ha il suo bottone.
              --   Cade quindi il presupposto che la faceva sparire: via
              --   v_nessuna_azione e il suo NOT EXISTS, che erano diventati codice
              --   morto, e via il commento che spiegava perche' non si appoggiavano a
              --   v_can_change — era la motivazione di una regola che non esiste piu'.
              --   Il campo si chiama ora `stato_info_key`: `nessuna_azione_key`
              --   diventava falso proprio nel momento in cui inizia a mostrarsi
              --   quando le azioni ci sono, e il vocabolario giusto era gia' dall'altra
              --   parte (le chiavi i18n stanno sotto vendite.<dominio>.stato_info.*).
              --   ⚠️ La PROPRIETA' nel meta dello stato resta `nessuna_azione_key`, ed
              --   e' voluto: il presidio scripts/check_i18n_keys.py trova quelle chiavi
              --   proprio per quel nome (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e
              --   rinominarla senza toccare il guard lo renderebbe verde per cecita' —
              --   il caso peggiore, gia' denunciato nel §8.3 del brief. Rinomina della
              --   proprieta' proposta come slice a se'.
              --   brief-db-vie-uscita-operatore §4; attivita-urgenti-del-10-08 §2.
              --   rev 2026-09-24: dalla bozza, l'azione verso CONFERMATO espone anche i
              --   motivi dei prezzi non autorizzati (building block
              --   script.fn_check_prezzi_autorizzati, lo stesso della Regola 5 del
              --   guard di transizione). brief-db-preventivi-congelamento-pricing.
              --   rev 2026-10-10: + la terna can_edit_data_consegna_confermata
              --   (_reason, _reason_key): la promessa di consegna che il verbo
              --   dedicato cambia dopo la conferma. Gli stati li dice il montaggio
              --   del lock delle righe, letto da
              --   script.fn_check_ordine_data_consegna_confermata; in DRAFT la data
              --   si scrive dalla riga. brief-db-testata-dopo-emissione (R-2).
              --   rev 2026-10-25 (20261025-81, brief-modello-documento-vendita §9,
              --   M-3): un passaggio con un'azione sulla sua riga della matrice
              --   (emetti_ordine sulla conferma e sull'annullo del confermato, letta
              --   da script.fn_doc_passaggio) si NASCONDE a chi non ha l'azione:
              --   permesso => nascondi, stato => disabilita col motivo. I motivi si
              --   legano alle colonne del vocabolario (emissione, is_abortito), non ai
              --   codici scritti.
              DECLARE
                  -- Tipi nudi solo per valori CALCOLATI (azioni e motivi jsonb, flag,
                  -- motivi e chiavi i18n composti): nessuna colonna di cui siano il riflesso.
                  v_stato_id   vendite.ordini.stato_doc_ordine_id%TYPE;
                  v_stato_cod  config.stati_doc_ordini.codice_interno%TYPE;
                  v_uid        vendite.ordini.uid%TYPE;
                  v_fatt_trg   vendite.ordini.fatturazione_trigger%TYPE;
                  v_pdf_mode   config.stati_doc_ordini.pdf_mode%TYPE;
                  v_pdf_allow  config.stati_doc_ordini.pdf_allow_allegati%TYPE;
                  v_stato_info_key    text;
                  -- Il significato dello stato corrente, dal vocabolario.
                  v_iniziale   config.stati_doc_ordini.iniziale%TYPE;
                  v_abortito   config.stati_doc_ordini.is_abortito%TYPE;
                  v_actions    jsonb;
                  v_can_change boolean := false;
                  v_ha_righe   boolean := false;
                  v_mot_annulla jsonb := '[]'::jsonb;
                  v_mot_conferma jsonb := '[]'::jsonb;
                  v_mot_prezzi   jsonb := '[]'::jsonb;
                  v_push_ok    boolean := false;
                  v_push_reason     text := NULL;
                  v_push_reason_key text := NULL;
                  -- La promessa di consegna (data_consegna_confermata): motivi
                  -- della check, e il primo motivo in chiaro.
                  v_mot_dcc         jsonb := '[]'::jsonb;
                  v_dcc_reason      text := NULL;
                  v_dcc_reason_key  text := NULL;
                  c_non_edit_cliente CONSTANT jsonb :=
                      '["billing_account_id","soggetto_ruolo_id"]'::jsonb;
                  -- Motivo "documento vuoto" nella forma dei motivi delle fn_check_*,
                  -- cosi' i due mondi si concatenano. `codice` e' quello che il guard
                  -- solleva davvero (trgfn_ordini_guard_transizione, Regola 2).
                  c_motivo_senza_righe CONSTANT jsonb := jsonb_build_array(
                      jsonb_build_object(
                          'codice',     'E_ORDINE_CONFERMA_SENZA_RIGHE',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  0));
                  -- La testata nello stato, dal montaggio del lock (rev 2026-10-10):
                  -- {modificabile, non_modificabili}.
                  v_testata jsonb;
              BEGIN
                  -- Stato corrente + trigger + uid + capability PDF + la chiave
                  -- "nessuna azione" dello stato (dato, non codice).
                  SELECT o.stato_doc_ordine_id, sdo.codice_interno,
                         o.uid, o.fatturazione_trigger,
                         sdo.pdf_mode, sdo.pdf_allow_allegati,
                         -- ⚠️ La PROPRIETA' nel meta resta `nessuna_azione_key` mentre il
                         -- campo del blob si chiama ora `stato_info_key`. L'asimmetria e'
                         -- voluta e la spiega la rev 2026-08-10 (2) in testa: il presidio
                         -- i18n si aggancia a QUESTO nome.
                         sdo.meta->>'nessuna_azione_key',
                         sdo.iniziale, sdo.is_abortito
                    INTO v_stato_id, v_stato_cod, v_uid, v_fatt_trg,
                         v_pdf_mode, v_pdf_allow, v_stato_info_key,
                         v_iniziale, v_abortito
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini sdo ON sdo.id = o.stato_doc_ordine_id
                   WHERE o.id = p_ordine_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard (trgfn_ordini_guard_transizione
                  -- Regola 2, rev 2026-07-16): riga attiva, nessun vincolo su
                  -- quantita/prezzo (un ordine a totale zero deve poter avanzare).
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.ordini_righe r
                       WHERE r.ordine_id = p_ordine_id
                         AND r.attivo IS TRUE
                  );

                  -- Motivi ostativi all'ANNULLAMENTO, calcolati UNA VOLTA SOLA.
                  -- Fn pura: [] quando e' lecito. E' la stessa che solleva nel guard.
                  v_mot_annulla := script.fn_check_ordine_annullabile(p_ordine_id);

                  -- Motivi ostativi alla CONFERMA, anch'essi calcolati UNA VOLTA SOLA.
                  -- Stessa forma e stessa ragione: e' la funzione che il guard di
                  -- transizione usa per sollevare (Regola 4), quindi bottone e guard
                  -- non possono divergere. rev 2026-08-29, brief IVA I9.
                  v_mot_conferma := script.fn_check_ordine_confermabile(p_ordine_id);

                  -- Motivi dei prezzi non autorizzati: SOLO dalla bozza, come la
                  -- Regola 5 del guard di transizione che li solleva con lo stesso
                  -- building block (il rientro in CONFERMATO da EVASO non e' una
                  -- conferma, ed e' comunque automatico). rev 2026-09-24,
                  -- brief-db-preventivi-congelamento-pricing (D-6).
                  IF v_iniziale THEN
                      v_mot_prezzi := script.fn_check_prezzi_autorizzati('vendite.ordini'::regclass,
                                                                         p_ordine_id);
                  END IF;

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN. Il FE non puo'
                              -- derivarla dal codice.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',        t.meta->>'label_key',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              -- Tutto discende dall'array dei motivi: nessuna
                              -- regola puo' mascherarne un'altra.
                              'enabled',          jsonb_array_length(m.motivi) = 0,
                              'reason',           m.motivi -> 0 ->> 'reason',
                              'reason_key',       m.motivi -> 0 ->> 'reason_key',
                              'reasons',          m.motivi
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  -- I passaggi manuali che l'utente puo' fare, dal BB comune (rev
                  -- 2026-10-27, 20261027-44, §15.14): matrice viva, manuale, permesso.
                  FROM script.fn_doc_azioni_permesse('vendite.ordini'::regclass, v_stato_id) t
                  JOIN config.stati_doc_ordini sa ON sa.id = t.stato_a_id
                  -- I motivi della destinazione, sommati in un array solo: prima
                  -- quelli specifici, poi il generico "documento vuoto".
                  CROSS JOIN LATERAL (
                      -- rev 2026-10-25 (20261025-81): l'annullo e l'emissione li dice il
                      -- vocabolario (is_abortito, emissione), non il codice.
                      SELECT CASE WHEN sa.is_abortito
                                  THEN v_mot_annulla ELSE '[]'::jsonb END
                          || CASE WHEN sa.emissione
                                  THEN v_mot_conferma || v_mot_prezzi ELSE '[]'::jsonb END
                          || CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                       AND NOT v_ha_righe
                                  THEN c_motivo_senza_righe ELSE '[]'::jsonb END AS motivi
                  ) m
                  WHERE t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Conta anche le azioni disabilitate: la barra azioni deve
                  -- comparire proprio per mostrare il pulsante grigio + tooltip.
                  v_can_change := jsonb_array_length(v_actions) > 0;

                  -- push_commessa: fonte unica fn_list_ordini_da_pushare (decoupling).
                  -- Namespace i18n: `vendite.ordini.*` — coerente con la label_key
                  -- dell'azione push qui sotto e con le reason DDT. Il codice reason
                  -- (ORDINE_*) NON e' una chiave i18n e non segue questa convenzione.
                  --
                  -- ⚠️ DRAFT e ANNULLATO erano nello stesso ramo, e sono
                  -- l'opposto: su DRAFT «disponibile dopo la conferma»
                  -- istruisce, su ANNULLATO promette un passo che non
                  -- arrivera' mai (nessuna transizione in uscita dalla
                  -- matrice). Il predicato e' sul significato dello stato
                  -- (iniziale, is_abortito, dal vocabolario) e non su
                  -- fase = 'CHIUSO': fra i CHIUSI dell'ordine c'e' anche
                  -- EVASO, che puo' avere il push ancora ABILITATO, e un
                  -- ramo su fase in testa alla catena lo spegnerebbe prima
                  -- che v_push_ok venga calcolato — un difetto di
                  -- comportamento al posto di uno di testo.
                  IF v_iniziale THEN
                      v_push_reason     := 'ORDINE_NON_CONFERMATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.non_confermato';
                  ELSIF v_abortito THEN
                      v_push_reason     := 'ORDINE_ANNULLATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.annullato';
                  ELSIF v_fatt_trg IS DISTINCT FROM 'CONFERMATO' THEN
                      v_push_reason     := 'ORDINE_FATTURA_DA_DDT';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.fattura_da_ddt';
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.fn_list_ordini_da_pushare(p_ordine_id := p_ordine_id)) THEN
                      v_push_ok := true;
                  -- Nessuna riga pushabile: distinguere il PERCHE'
                  -- via classificatore condiviso (stesso predicato
                  -- delle push-list, vede anche i componenti #CMP).
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.ordini_righe r
                                 WHERE r.ordine_id = p_ordine_id
                                   AND script.fn_get_stato_push_segment(
                                         script.fn_segment_key('ORDINE_VENDITA', v_uid::text, r.id)) = 'ALLOCATA') THEN
                      -- pushato, in attesa di fatturazione
                      v_push_reason     := 'ORDINE_GIA_INVIATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.gia_inviato';
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.ordini_righe r
                                 WHERE r.ordine_id = p_ordine_id
                                   AND script.fn_get_stato_push_segment(
                                         script.fn_segment_key('ORDINE_VENDITA', v_uid::text, r.id)) = 'EMESSA') THEN
                      v_push_reason     := 'ORDINE_GIA_FATTURATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.gia_fatturato';
                  ELSE
                      v_push_reason     := 'ORDINE_NESSUNA_RIGA_PUSHABILE';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.nessuna_riga_pushabile';
                  END IF;

                  IF v_push_ok THEN
                      v_actions := v_actions || jsonb_build_array(
                          jsonb_build_object(
                              'key',              'push_commessa',
                              'target_state',     NULL,
                              -- Non e' un cambio di stato: nessuna destinazione
                              -- da nominare.
                              'target_state_descrizione', NULL,
                              'label_key',        'vendite.ordini.azione_push_commessa',
                              'requires_confirm', true,
                              'outlined',         false,
                              'enabled',          true,
                              'reason',           NULL,
                              'reason_key',       NULL
                          )
                      );
                  END IF;

                  -- La promessa di consegna dopo la conferma (rev 2026-10-10).
                  -- In DRAFT la data si scrive modificando la riga
                  -- (can_edit_righe): il verbo dedicato e' per dopo, e lo dice
                  -- il motivo. Negli altri stati decide il montaggio del lock
                  -- delle righe, letto dalla check: nessuno stato scritto qui.
                  IF v_iniziale THEN
                      v_dcc_reason     := 'ORDINE_IN_BOZZA';
                      v_dcc_reason_key := 'vendite.ordini.data_consegna_confermata_reason.in_bozza';
                  ELSE
                      v_mot_dcc        := script.fn_check_ordine_data_consegna_confermata(p_ordine_id);
                      v_dcc_reason     := v_mot_dcc -> 0 ->> 'reason';
                      v_dcc_reason_key := v_mot_dcc -> 0 ->> 'reason_key';
                  END IF;

                  -- La testata nello stato, letta dal montaggio del lock di testata
                  -- (rev 2026-10-10): le colonne «sempre» della capability, poi quelle
                  -- che il lock blocca in questo stato. Nessuno stato scritto qui.
                  v_testata := script.fn_doc_testata_in_stato('vendite.ordini'::regclass, v_stato_cod, c_non_edit_cliente);

                  RETURN jsonb_build_object(
                      'available_actions',           v_actions,
                      'can_change_state',            v_can_change,
                      'can_edit_testata',  (v_testata ->> 'modificabile')::boolean,
                      -- Dal lock delle righe (rev 2026-11-14): la stessa risposta del
                      -- trigger vendite.trgfn_doc_righe_lock_fuori_bozza.
                      'can_edit_righe',              script.fn_doc_riga_modificabile('vendite.ordini_righe'::regclass, v_stato_cod),
                      -- Dal montaggio del lock dei satelliti (rev 2026-10-11, R-DB-3).
                      'can_edit_indirizzi',  script.fn_doc_riga_modificabile('vendite.ordini_indirizzi'::regclass, v_stato_cod),
                      -- Il flag discende dal motivo: il backend trasporta.
                      'can_edit_data_consegna_confermata',            (v_dcc_reason IS NULL),
                      'can_edit_data_consegna_confermata_reason',     v_dcc_reason,
                      'can_edit_data_consegna_confermata_reason_key', v_dcc_reason_key,
                      'can_push_commessa',           v_push_ok,
                      'can_push_commessa_reason',    v_push_reason,
                      'can_push_commessa_reason_key', v_push_reason_key,
                      'stato_info_key',          v_stato_info_key,
                      'non_editable_fields', v_testata -> 'non_modificabili',
                      'pdf',                         jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_codice',                v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_ordine(p_ordine_id vendite.ordini.id%TYPE)
              IS 'Capability dell''ordine di vendita per il dettaglio (NULL se l''ordine non c''e''). available_actions: i passaggi manuali permessi da script.fn_doc_azioni_permesse (matrice viva, manuale; un passaggio con un''azione di processo si nasconde a chi non ce l''ha), ognuno con enabled, reason e reason_key dal primo motivo e reasons, l''array intero; target_state e target_state_descrizione (la forma leggibile) dalla destinazione; label_key, requires_confirm, outlined dal meta del passaggio. I motivi, sul significato della destinazione: verso lo stato di annullo (is_abortito) script.fn_check_ordine_annullabile; verso lo stato di emissione script.fn_check_ordine_confermabile e, dallo stato iniziale, i prezzi non autorizzati di script.fn_check_prezzi_autorizzati; poi DOCUMENTO_SENZA_RIGHE dove il meta del passaggio chiede requires_righe e l''ordine non ha righe attive. Sono gli stessi predicati di vendite.trgfn_ordini_guard_transizione. can_change_state: vero se c''e'' almeno un''azione, anche disabilitata. push_commessa c''e'' quando vendite.fn_list_ordini_da_pushare ha righe per l''ordine; can_push_commessa e i suoi reason e reason_key: ORDINE_NON_CONFERMATO nello stato iniziale, ORDINE_ANNULLATO nello stato di annullo, ORDINE_FATTURA_DA_DDT con fatturazione_trigger diverso da CONFERMATO, poi ORDINE_GIA_INVIATO o ORDINE_GIA_FATTURATO da script.fn_get_stato_push_segment (vede anche i componenti #CMP), altrimenti ORDINE_NESSUNA_RIGA_PUSHABILE. Cosa si modifica: can_edit_testata e non_editable_fields dal montaggio del lock di testata (script.fn_doc_testata_in_stato; billing_account_id e soggetto_ruolo_id sempre bloccati), can_edit_righe e can_edit_indirizzi dal lock delle righe e degli indirizzi (script.fn_doc_riga_modificabile), lo stesso che i trigger fanno rispettare; can_edit_data_consegna_confermata e il suo motivo: nello stato iniziale ORDINE_IN_BOZZA (la data si scrive modificando la riga), negli altri il primo motivo di script.fn_check_ordine_data_consegna_confermata. pdf {mode, allow_allegati} dal vocabolario. stato_info_key: la nota dello stato dal suo meta (proprieta'' nessuna_azione_key), sempre presente, null quando lo stato non la dichiara. stato_codice: il codice_interno dello stato corrente. Le reason_key sono chiavi i18n del frontend.';
