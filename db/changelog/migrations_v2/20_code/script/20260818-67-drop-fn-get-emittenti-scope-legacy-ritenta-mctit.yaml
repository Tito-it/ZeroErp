# Ritenta il drop di script.fn_get_emittenti_scope, che 20260818-66 ha
# dichiarato di aver fatto senza farlo.
#
# ⛔ COSA E' SUCCESSO, perche' e' una lezione e non un incidente.
#
#    Il changeSet -66 aveva una preCondition `onFail: MARK_RAN` con uno sqlCheck
#    «la funzione esiste». L'intenzione era renderlo ripetibile. L'effetto reale
#    e' l'opposto, ed e' peggiore di qualunque errore:
#
#      MARK_RAN significa «non eseguire, ma segna come eseguito».
#
#    Se lo sqlCheck non trova quello che cerca — per qualunque ragione: una
#    formattazione diversa di pg_get_function_identity_arguments, un
#    search_path, una corsa su un database dove l'oggetto non c'e' — Liquibase
#    registra l'id in DATABASECHANGELOG **senza aver droppato niente**. E da
#    quel momento non ci torna piu': `runOnChange: false` + id presente = mai
#    piu' eseguito.
#
#    Il risultato e' un changeSet che GIURA di aver tolto una funzione ancora
#    viva. Si e' scoperto solo perche' tre pgTAP asserivano che non ci fosse:
#    senza quei test sarebbe rimasto vero sulla carta per sempre.
#
# ⚠️ PERCHE' UN FILE NUOVO E NON UNA CORREZIONE DI -66. Perche' -66 e' gia'
#    APPLICATO sul database di sviluppo. Correggerlo non lo fa rieseguire: il
#    suo id e' registrato. La regola del progetto e' la stessa — un changeSet
#    applicato non si modifica, si corregge in avanti. (Il file -66 e' stato
#    comunque ripulito della preCondition, perche' su un database ricostruito
#    da zero — la CI — deve essere giusto anche lui.)
#
# ⚠️ ESEGUIRLO DUE VOLTE NON FA DANNO, e stavolta senza preCondition:
#    `DROP FUNCTION IF EXISTS` non ha bisogno di nessuno che gli dica se
#    l'oggetto c'e'. L'idempotenza la da' il comando, non un guardiano che puo'
#    sbagliarsi.
#
# Il PERCHE' della dismissione sta nel changeSet -66 e non si ripete qui.
# In una riga: rispondeva NULL (= «tutti gli emittenti») per un utente senza
# whitelist — il fail-open che P-2a ha chiuso ovunque il 2026-08-18 — e non la
# chiamava piu' nessuno.
#
# brief-db-perimetro-emittente-liste-e-gerarchia-ba.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260818-67-drop-fn-get-emittenti-scope-legacy-ritenta-mctit.yaml

  - changeSet:
      id: 20260818-67-drop-fn-get-emittenti-scope-legacy-ritenta
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Ritenta il DROP della legacy script.fn_get_emittenti_scope(integer). Il
        changeSet -66 aveva una preCondition onFail:MARK_RAN che, non trovando
        quel che cercava, lo ha registrato come ESEGUITO senza droppare nulla —
        e con runOnChange:false non ci torna piu'. Corretto in avanti con un id
        nuovo, come da regola. Nessuna preCondition: l'idempotenza la da'
        DROP FUNCTION IF EXISTS. Presidiato da tre pgTAP (sono loro che hanno
        scoperto il buco).
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Niente CASCADE: se qualcosa dipendesse da questa funzione il
              -- DROP deve FALLIRE e dirlo. Un CASCADE porterebbe via l'oggetto
              -- dipendente in silenzio.
              DROP FUNCTION IF EXISTS script.fn_get_emittenti_scope(integer);
      rollback:
        - sql:
            sql: |
              -- ⛔ Nessun rollback: ricrearla rimetterebbe in servizio il
              -- fail-open. Se un giorno servisse una funzione che risponde a
              -- quella domanda, si scrive nuova, guarded e fail-closed.
              SELECT 1;
