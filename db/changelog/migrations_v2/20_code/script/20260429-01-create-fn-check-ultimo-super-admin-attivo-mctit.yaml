databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260429-01-create-fn-check-ultimo-super-admin-attivo-mctit.yaml

  - changeSet:
      id: 20260429-01-create-fn-check-ultimo-super-admin-attivo
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Helper boolean parametrico per il drawer Operatore (P1
        2026-04-29). Dato un auth_user_id, ritorna true sse questo
        utente e' l'unico SUPER_ADMIN attivo: rimuoverlo (disable
        identita o demote del binding) porterebbe il sistema a 0
        super-admin attivi (lockout). Allinea la primitiva alla
        semantica del guard 384 (E_PROFILO_ULTIMO_SUPER_ADMIN) ma
        con perimetro per-utente, utile per le capability
        can_disable / can_demote_super_admin del dettaglio
        operatore. fn_check pura (boolean), nessun raise:
        l'enforcement resta nei trigger guard esistenti.
        Nessun riferimento a tabelle django.* -> LANGUAGE sql
        consentito (inlineable, cache-friendly).
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: config,      tableName: profili_accesso }
          - tableExists: { schemaName: config,      tableName: profili_accesso_bindings }
          - tableExists: { schemaName: anagrafiche, tableName: identita_digitali }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_ultimo_super_admin_attivo(
                  p_auth_user_id integer  -- representa django.auth_user.id (regola anti-pattern: niente %TYPE su colonne django.*)
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  -- =========================================================
                  -- Scopo:
                  --   Predicato per-utente: true sse rimuovere il privilegio
                  --   SUPER_ADMIN da p_auth_user_id porterebbe il sistema a
                  --   0 super-admin attivi (lockout).
                  --
                  -- Algoritmo (single-pass, due EXISTS short-circuit):
                  --   1) p_auth_user_id IS NOT NULL.
                  --   2) Target e' SA attivo (EXISTS si ferma alla prima riga).
                  --   3) NESSUN altro auth_user e' SA attivo (NOT EXISTS si
                  --      ferma alla prima riga "altra").
                  --
                  -- Filtri SA coerenti con script.fn_is_super_admin (single
                  -- source of truth concettuale):
                  --   identita attiva, ruolo OPERATORE, in finestra,
                  --   binding attivo, profilo attivo, tipo SUPER_ADMIN.
                  --
                  -- NB: la duplicazione del blocco filtri e' voluta. Una CTE
                  -- referenziata 2 volte verrebbe materializzata da PG e
                  -- valutata interamente; con EXISTS+NOT EXISTS l'optimizer
                  -- usa indici partial (uq_identita_digitali_*_attivo) e
                  -- short-circuita.
                  -- =========================================================
                  SELECT
                          p_auth_user_id IS NOT NULL
                      AND EXISTS (
                          SELECT 1
                            FROM anagrafiche.identita_digitali       id
                            JOIN config.profili_accesso_bindings     pab
                              ON pab.identita_digitale_id = id.id
                            JOIN config.profili_accesso              pa
                              ON pa.id = pab.profilo_accesso_id
                           WHERE id.auth_user_id      = p_auth_user_id
                             AND id.attivo            = true
                             AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                             AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                             AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                             AND pab.attivo = true
                             AND pa.attivo  = true
                             AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                      )
                      AND NOT EXISTS (
                          SELECT 1
                            FROM anagrafiche.identita_digitali       id
                            JOIN config.profili_accesso_bindings     pab
                              ON pab.identita_digitale_id = id.id
                            JOIN config.profili_accesso              pa
                              ON pa.id = pab.profilo_accesso_id
                           WHERE id.auth_user_id     <> p_auth_user_id
                             AND id.attivo            = true
                             AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                             AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                             AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                             AND pab.attivo = true
                             AND pa.attivo  = true
                             AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                      );
              $function$;

              COMMENT ON FUNCTION script.fn_check_ultimo_super_admin_attivo(integer) IS
                  'Predicato per-utente: true sse questo auth_user e'' l''unico SUPER_ADMIN attivo del sistema (rimuovergli il privilegio causerebbe lockout). Allineato alla semantica del guard 384 ma con perimetro per-utente. Usato per le capability can_disable / can_demote_super_admin del drawer Operatore (P1 2026-04-29). LANGUAGE sql STABLE, pure check, nessun raise. Param INTEGER esplicito (rappresenta django.auth_user.id; niente %TYPE su colonne django.*).';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS script.fn_check_ultimo_super_admin_attivo(integer);
