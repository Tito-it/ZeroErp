# P-4 — L'OBBLIGO SULLA CREDENZIALE SI SCRIVE QUI: script.fn_imposta_totp_obbligatorio
#   Brief: brief-db-secondo-fattore-totp, sezione 2.1.
#
# ── ⭐ PRIMA RIGA: SUPER_ADMIN ───────────────────────────────────────
#   Imporre il secondo fattore a una credenziale e' gestione accessi
#   (amm_software, porta per soli SUPER_ADMIN), come bloccarla:
#   script.fn_guard_super_admin(chi agisce), chi agisce da app.current_user_id.
#
# ── ⭐ UPSERT: LA RIGA NASCE ALLA PRIMA SCRITTURA ────────────────────
#   Stessa forma di fn_imposta_deve_cambiare_password: l'assenza vale false e
#   la sa solo il DB. Spegnere un obbligo che non c'era non crea niente di
#   diverso da una riga con i default.
#
# ── ⚠️ TOGLIERE L'OBBLIGO NON TOGLIE IL DEVICE ──────────────────────
#   Chi ha gia' un device lo tiene: spegnere l'obbligo dice «non e' piu'
#   obbligatorio», non «disattivalo». La disabilitazione e' un altro verbo
#   (script.fn_totp_disabilita_device). E l'obbligo che viene da un PROFILO
#   resta: la risposta unica e' script.fn_totp_obbligatorio.
#
# SECURITY DEFINER del PROPRIETARIO (l'app ha solo SELECT su
# config.credenziali), search_path bloccato. L'esistenza della credenziale si
# controlla qui: la FK verso django.auth_user in CI non esiste.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260929-12-create-fn-imposta-totp-obbligatorio-mctit.yaml

  - changeSet:
      id: 20260929-12-create-fn-imposta-totp-obbligatorio
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_imposta_totp_obbligatorio(p_auth_user_id, p_valore): accende o spegne l'obbligo
        del secondo fattore sulla CREDENZIALE. Prima riga fn_guard_super_admin; upsert su
        config.credenziali (la riga nasce alla prima scrittura). SECURITY DEFINER del proprietario,
        search_path bloccato. Brief: brief-db-secondo-fattore-totp §2.1.
      preConditions:
        - onFail: HALT
        - columnExists:
            { schemaName: config, tableName: credenziali, columnName: totp_obbligatorio }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_imposta_totp_obbligatorio(
                  p_auth_user_id integer,
                  p_valore       config.credenziali.totp_obbligatorio%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: imporre (o togliere) il secondo fattore a una credenziale,
              --   per decisione di un SUPER_ADMIN. Upsert: la riga nasce qui.
              BEGIN
                  -- Prima riga: chi agisce dev'essere SUPER_ADMIN.
                  PERFORM script.fn_guard_super_admin(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer);

                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 OR p_valore IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_imposta_totp_obbligatorio', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id, 'p_valore', p_valore),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_imposta_totp_obbligatorio',
                                         'credenziale e valore obbligatori']);
                  END IF;

                  IF NOT EXISTS (SELECT 1 FROM django.auth_user au WHERE au.id = p_auth_user_id) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_imposta_totp_obbligatorio', 'E_CREDENZIALE_NON_TROVATA',
                          jsonb_build_object('auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  INSERT INTO config.credenziali AS c (auth_user_id, totp_obbligatorio)
                  VALUES (p_auth_user_id, p_valore)
                  ON CONFLICT (auth_user_id) DO UPDATE
                     SET totp_obbligatorio = EXCLUDED.totp_obbligatorio
                   WHERE c.totp_obbligatorio IS DISTINCT FROM EXCLUDED.totp_obbligatorio;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_imposta_totp_obbligatorio(integer, boolean) IS
                  'Accende o spegne l''obbligo del secondo fattore (TOTP) sulla CREDENZIALE (brief-db-secondo-fattore-totp §2.1): upsert su config.credenziali.totp_obbligatorio, dove la riga nasce alla prima scrittura. Prima riga script.fn_guard_super_admin(app.current_user_id): e'' gestione accessi, come il blocco. Credenziale inesistente -> E_CREDENZIALE_NON_TROVATA (la FK verso django.auth_user in CI non esiste). Spegnere l''obbligo non toglie il device, e non toglie l''obbligo che viene da un profilo: la risposta unica e'' script.fn_totp_obbligatorio. SECURITY DEFINER del PROPRIETARIO, search_path bloccato: l''app su config.credenziali ha solo SELECT.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_imposta_totp_obbligatorio(integer, boolean);
