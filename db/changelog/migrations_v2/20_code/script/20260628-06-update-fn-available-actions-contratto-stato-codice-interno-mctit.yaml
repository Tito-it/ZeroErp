#
# Bonifica naming stato (brief-naming-stato-codice-interno.md, dominio contratti — capability).
#
# PRIMA: il jsonb di capability esponeva 'stato_codice' => v_stato_cod
#        (= codice_interno): mislabel (immutabile col nome del mutabile).
# DOPO (alias fedele 1:1, linee-guida-sql §6c):
#   'stato_codice_interno' => v_stato_cod      (codice_interno, logica)
#   'stato_codice'         => v_stato_codice   (codice, display)
#
# Nuova variabile v_stato_codice (config.stati_doc_contratti.codice%TYPE) + fetch
# di sdc.codice nella SELECT esistente. La logica interna (can_edit_*) resta su
# v_stato_cod = codice_interno (corretto). CREATE OR REPLACE (ritorna jsonb, no DROP).
# BE/FE leggono stato_codice_interno per la logica (handoff backend agent).
# Storico 20260528-05 non toccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260628-06-update-fn-available-actions-contratto-stato-codice-interno-mctit.yaml

  - changeSet:
      id: 20260628-06-update-fn-available-actions-contratto-stato-codice-interno
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_contratto: capability espone stato_codice_interno
        (codice_interno, logica) + stato_codice (codice, display). Bonifica mislabel.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_contratto(p_contratto_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: capability del contratto per il detail API (pattern data-driven,
              --   come fn_available_actions_preventivo/offerta). Vedi storico 20260528-05.
              DECLARE
                  v_stato_id     vendite.contratti.stato_doc_contratto_id%TYPE;
                  v_stato_cod    config.stati_doc_contratti.codice_interno%TYPE;
                  v_stato_codice config.stati_doc_contratti.codice%TYPE;
                  v_valido_dal   vendite.contratti.valido_dal%TYPE;
                  v_actions      jsonb;
                  v_can_edit     boolean;
                  v_can_righe    boolean;
                  v_non_edit     jsonb;
                  c_non_edit_attivo CONSTANT jsonb :=
                      '["billing_account_id","istanza_utility_id","utility_id","ambito",'
                      '"valido_dal","parent_contratto_id","data","listino_id",'
                      '"tipo_variazione_globale","valore_variazione_globale",'
                      '"categoria_cliente_id_snapshot"]'::jsonb;
                  c_non_edit_tutti CONSTANT jsonb :=
                      '["billing_account_id","istanza_utility_id","utility_id","ambito",'
                      '"valido_dal","valido_al","parent_contratto_id","data","listino_id",'
                      '"tipo_variazione_globale","valore_variazione_globale",'
                      '"categoria_cliente_id_snapshot","meta"]'::jsonb;
              BEGIN
                  -- Stato corrente: codice_interno (logica) + codice (display) + valido_dal.
                  SELECT c.stato_doc_contratto_id, sdc.codice_interno, sdc.codice, c.valido_dal
                    INTO v_stato_id, v_stato_cod, v_stato_codice, v_valido_dal
                    FROM vendite.contratti c
                    JOIN config.stati_doc_contratti sdc ON sdc.id = c.stato_doc_contratto_id
                   WHERE c.id = p_contratto_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',             t.meta->>'action_key',
                              'target_state',    sa.codice_interno,
                              'label_key',       t.meta->>'label_key',
                              'severity',        t.meta->>'severity',
                              'icon',            t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'requires_date',   COALESCE((t.meta->>'requires_date')::boolean, false),
                              'outlined',        COALESCE((t.meta->>'outlined')::boolean, false)
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.transizioni_stati_contratti t
                  JOIN config.stati_doc_contratti sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  IF jsonb_array_length(v_actions) > 0 THEN
                      SELECT jsonb_agg(
                          CASE WHEN (elem->>'requires_date')::boolean IS TRUE
                               THEN elem || jsonb_build_object(
                                        'default_date', CURRENT_DATE::text,
                                        'min_date',     v_valido_dal::text
                                    )
                               ELSE elem
                          END
                      )
                      INTO v_actions
                      FROM jsonb_array_elements(v_actions) AS elem;
                  END IF;

                  -- Editabilita': la logica usa v_stato_cod = codice_interno (immutabile).
                  v_can_edit  := (v_stato_cod IN ('DRAFT', 'ATTIVO'));
                  v_can_righe := (v_stato_cod = 'DRAFT');
                  v_non_edit  := CASE v_stato_cod
                                     WHEN 'DRAFT'  THEN '[]'::jsonb
                                     WHEN 'ATTIVO' THEN c_non_edit_attivo
                                     ELSE               c_non_edit_tutti
                                 END;

                  RETURN jsonb_build_object(
                      'available_actions',   v_actions,
                      'can_change_state',    jsonb_array_length(v_actions) > 0,
                      'can_edit_testata',    v_can_edit,
                      'can_edit_righe',      v_can_righe,
                      'non_editable_fields', v_non_edit,
                      'stato_codice_interno', v_stato_cod,
                      'stato_codice',         v_stato_codice
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_contratto(p_contratto_id bigint)
              IS 'Capability contratto per detail API: available_actions (da config.transizioni_stati_contratti), can_change_state, can_edit_testata/righe, non_editable_fields. Espone stato_codice_interno (codice_interno, logica) e stato_codice (codice, display). DRAFT espone attiva+annulla; arricchimento date per requires_date (cessa). rev 2026-06-28 (naming stato).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: vedere storico 20260528-05 per la versione con il solo
              -- 'stato_codice' (= codice_interno). Non ricreata qui per brevita';
              -- in caso di rollback ri-applicare 20260528-05.
              SELECT 1;
