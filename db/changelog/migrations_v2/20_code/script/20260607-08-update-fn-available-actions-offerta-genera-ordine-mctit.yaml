# UPDATE script.fn_available_actions_offerta — azione speciale `genera_ordine`.
# Brief: brief-db-univocita-offerta-ordine.md §2.2
#
# Aggiunge a available_actions[] l'azione speciale non-cambio-stato `genera_ordine`
# (mirror di push_contratto), visibile SOLO in ACCETTATA quando nessun ordine e'
# gia' nato da questa offerta. Check cross-dominio su
# vendite.ordini.documento_origine_* (idempotenza 1:1, specchio dell'UNIQUE
# parziale uq_ordini_v_documento_origine_offerta — migration 20260607-07).
#
# Estende il RETURN con i tre flag can_genera_ordine / _reason / _reason_key.
# push_contratto e genera_ordine sono INDIPENDENTI: un'offerta ACCETTATA puo'
# esporre entrambe, ognuna con la propria idempotenza.
#
# Stessa firma e RETURNS jsonb: CREATE OR REPLACE senza DROP.
# Dipendenze invariate rispetto a 20260526-01.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260607-08-update-fn-available-actions-offerta-genera-ordine-mctit.yaml

  - changeSet:
      id: 20260607-08-update-fn-available-actions-offerta-genera-ordine
      runOnChange: false
      validCheckSums:
        - ANY
      author: mctit
      comment: >
        Aggiunge l'azione speciale `genera_ordine` a
        script.fn_available_actions_offerta + i flag can_genera_ordine /
        can_genera_ordine_reason / can_genera_ordine_reason_key. Visibile solo in
        ACCETTATA senza ordine gia' generato (check su
        vendite.ordini.documento_origine_*). Mirror di push_contratto.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: offerte_commerciali
            - tableExists:
                schemaName: config
                tableName: stati_doc_offerte
            - tableExists:
                schemaName: config
                tableName: stati_doc_offerte_transizioni
            - tableExists:
                schemaName: vendite
                tableName: contratti
            - tableExists:
                schemaName: vendite
                tableName: ordini
            - columnExists:
                schemaName: vendite
                tableName: ordini
                columnName: documento_origine_tipo
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_offerta(
                  p_offerta_id vendite.offerte_commerciali.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo:
              --   Capability dell'offerta commerciale per il detail API (pattern
              --   data-driven capability layer, specchio di fn_available_actions_preventivo).
              --   Calcola le transizioni manuali disponibili leggendo la matrice
              --   config.stati_doc_offerte_transizioni (campo meta) e aggiunge hardcoded
              --   le azioni speciali non-cambio-stato:
              --     - crea_revisione (solo EMESSA): produce rev.N+1 in BOZZA.
              --     - push_contratto (solo ACCETTATA senza contratto generato):
              --       genera un contratto DRAFT.
              --     - genera_ordine (solo ACCETTATA senza ordine generato):
              --       genera un ordine da questa offerta (1:1, brief univocita
              --       offerta->ordine). Check cross-dominio su
              --       vendite.ordini.documento_origine_* (specchio UNIQUE parziale
              --       uq_ordini_v_documento_origine_offerta).
              --   push_contratto e genera_ordine sono indipendenti.
              --   Fallback sicuro: NULL se l'offerta non esiste (gestito BE come 404).
              DECLARE
                  v_stato_id    vendite.offerte_commerciali.stato_doc_offerta_id%TYPE;
                  v_stato_cod   config.stati_doc_offerte.codice_interno%TYPE;
                  v_actions     jsonb;
                  v_can_edit    boolean;
                  v_can_push    boolean;
                  v_push_reason     text;
                  v_push_reason_key text;
                  v_can_rev     boolean;
                  -- genera_ordine: capability + reason machine-readable + chiave i18n.
                  v_can_ordine        boolean;
                  v_ordine_reason     text;
                  v_ordine_reason_key text;

                  -- Campi sempre immutabili: gestiti dal trigger di transizione stato.
                  -- Includono i timestamp valorizzati automaticamente e i campi identita'.
                  c_sempre_non_edit CONSTANT jsonb :=
                      '["codice","uid","revisione_numero","revisione_padre_id",'
                      '"stato_doc_offerta_id","data_emissione","data_accettazione",'
                      '"data_rifiuto","data_annullamento","motivazione_rifiuto"]'::jsonb;

                  -- Campi bloccati fuori BOZZA (whitelist testata editabile solo in BOZZA).
                  c_non_edit_extra CONSTANT jsonb :=
                      '["emittente_fiscale_id","billing_account_id","istanza_utility_id",'
                      '"utility_id","listino_id","listino_versione_id",'
                      '"valore_variazione_globale","tipo_variazione_globale",'
                      '"validita_dal","validita_al","meta"]'::jsonb;

                  -- Azione speciale hardcoded: crea_revisione (EMESSA).
                  -- Non e' una transizione di stato: produce rev.N+1 in BOZZA
                  -- e marca la rev.N corrente SUPERATA via trigger z90.
                  c_action_crea_revisione CONSTANT jsonb := jsonb_build_object(
                      'key',                'crea_revisione',
                      'target_state',       NULL,
                      'label_key',          'vendite.offerte.azione_crea_revisione',
                      'severity',           'info',
                      'icon',               'pi pi-clone',
                      'requires_confirm',   true,
                      'requires_motivazione', false
                  );

                  -- Azione speciale hardcoded: push_contratto (ACCETTATA senza contratto).
                  -- Non e' una transizione di stato: genera un contratto DRAFT
                  -- tramite vendite.fn_push_offerta_a_contratto (1:1 eccezioni + utility).
                  c_action_push_contratto CONSTANT jsonb := jsonb_build_object(
                      'key',                'push_contratto',
                      'target_state',       NULL,
                      'label_key',          'vendite.offerte.azione_push_contratto',
                      'severity',           'success',
                      'icon',               'pi pi-arrow-right',
                      'requires_confirm',   true,
                      'requires_motivazione', false
                  );

                  -- Azione speciale hardcoded: genera_ordine (ACCETTATA senza ordine).
                  -- Non e' una transizione di stato: genera un ordine da questa offerta
                  -- (1:1, brief univocita offerta->ordine). L'offerta resta ACCETTATA.
                  c_action_genera_ordine CONSTANT jsonb := jsonb_build_object(
                      'key',                'genera_ordine',
                      'target_state',       NULL,
                      'label_key',          'vendite.offerte.azione_genera_ordine',
                      'severity',           'info',
                      'icon',               'pi pi-shopping-cart',
                      'requires_confirm',   true,
                      'requires_motivazione', false
                  );

              BEGIN
                  -- Recupera stato corrente dell'offerta.
                  SELECT o.stato_doc_offerta_id, sdo.codice_interno
                    INTO v_stato_id, v_stato_cod
                    FROM vendite.offerte_commerciali o
                    JOIN config.stati_doc_offerte sdo ON sdo.id = o.stato_doc_offerta_id
                   WHERE o.id = p_offerta_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Transizioni manuali disponibili per lo stato corrente.
                  -- COALESCE su meta.manuale: se assente si assume manuale = true.
                  -- COALESCE su requires_confirm / requires_motivazione: default false.
                  -- Filtro defense-in-depth: esclude righe con action_key o label_key
                  --   mancanti.
                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',                t.meta->>'action_key',
                              'target_state',       sa.codice_interno,
                              'label_key',          t.meta->>'label_key',
                              'severity',           t.meta->>'severity',
                              'icon',               t.meta->>'icon',
                              'requires_confirm',   COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'requires_motivazione', COALESCE((t.meta->>'requires_motivazione')::boolean, false)
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.stati_doc_offerte_transizioni t
                  JOIN config.stati_doc_offerte sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Aggiunge crea_revisione hardcoded: solo in EMESSA (addendum A2).
                  v_can_rev := (v_stato_cod = 'EMESSA');
                  IF v_can_rev THEN
                      v_actions := v_actions || jsonb_build_array(c_action_crea_revisione);
                  END IF;

                  -- can_push_contratto: ACCETTATA + nessun contratto gia' generato.
                  -- Check cross-dominio su vendite.contratti.offerta_id (UNIQUE idempotenza
                  -- pattern A).
                  IF v_stato_cod = 'ACCETTATA' THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM vendite.contratti WHERE offerta_id = p_offerta_id
                      ) THEN
                          v_can_push        := true;
                          v_push_reason     := NULL;
                          v_push_reason_key := NULL;
                          -- push_contratto appare in available_actions solo quando abilitato.
                          v_actions := v_actions || jsonb_build_array(c_action_push_contratto);
                      ELSE
                          v_can_push        := false;
                          v_push_reason     := 'OFFERTA_CONTRATTO_GIA_GENERATO';
                          v_push_reason_key := 'offerte.push_reason.gia_generato';
                      END IF;
                  ELSE
                      v_can_push        := false;
                      v_push_reason     := 'OFFERTA_NON_ACCETTATA';
                      v_push_reason_key := 'offerte.push_reason.non_accettata';
                  END IF;

                  -- can_genera_ordine: ACCETTATA + nessun ordine gia' generato.
                  -- Check cross-dominio su vendite.ordini.documento_origine_* (1:1
                  -- idempotenza, specchio dell'UNIQUE parziale §2.1). Indipendente da
                  -- push_contratto: un'offerta ACCETTATA puo' esporre entrambe.
                  IF v_stato_cod = 'ACCETTATA' THEN
                      IF NOT EXISTS (
                          SELECT 1 FROM vendite.ordini
                           WHERE documento_origine_tipo = 'OFFERTA'
                             AND documento_origine_id   = p_offerta_id
                      ) THEN
                          v_can_ordine        := true;
                          v_ordine_reason     := NULL;
                          v_ordine_reason_key := NULL;
                          v_actions := v_actions || jsonb_build_array(c_action_genera_ordine);
                      ELSE
                          v_can_ordine        := false;
                          v_ordine_reason     := 'OFFERTA_ORDINE_GIA_GENERATO';
                          v_ordine_reason_key := 'offerte.push_reason.ordine_gia_generato';
                      END IF;
                  ELSE
                      v_can_ordine        := false;
                      v_ordine_reason     := 'OFFERTA_NON_ACCETTATA';
                      v_ordine_reason_key := 'offerte.push_reason.non_accettata';
                  END IF;

                  -- Editabilita': solo in BOZZA.
                  v_can_edit := (v_stato_cod = 'BOZZA');

                  RETURN jsonb_build_object(
                      'available_actions',             v_actions,
                      'can_change_state',              jsonb_array_length(v_actions) > 0,
                      'can_edit_testata',              v_can_edit,
                      'can_edit_eccezioni',            v_can_edit,
                      'can_edit_utility',              v_can_edit,
                      'can_create_revisione',          v_can_rev,
                      'can_push_contratto',            v_can_push,
                      'can_push_contratto_reason',     v_push_reason,
                      'can_push_contratto_reason_key', v_push_reason_key,
                      'can_genera_ordine',             v_can_ordine,
                      'can_genera_ordine_reason',      v_ordine_reason,
                      'can_genera_ordine_reason_key',  v_ordine_reason_key,
                      'non_editable_fields',           CASE WHEN v_can_edit
                                                           THEN c_sempre_non_edit
                                                           ELSE c_sempre_non_edit || c_non_edit_extra END,
                      'stato_codice',                  v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_offerta(bigint)
              IS 'Capability offerta commerciale per detail API: available_actions (da matrice transizioni + azioni speciali hardcoded crea_revisione/push_contratto/genera_ordine), can_edit_*, can_push_contratto, can_genera_ordine, can_create_revisione, non_editable_fields. Pattern data-driven capability layer (specchio fn_available_actions_preventivo). rev 2026-06-07 (genera_ordine).';
