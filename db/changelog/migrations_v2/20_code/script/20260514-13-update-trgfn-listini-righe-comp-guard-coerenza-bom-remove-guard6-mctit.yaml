databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260514-13-update-trgfn-listini-righe-comp-guard-coerenza-bom-remove-guard6-mctit.yaml

  # ---------------------------------------------------------------------------
  # Rimozione guard 6 da trgfn_listini_righe_comp_guard_coerenza_bom.
  #
  # Guard 6 verificava: validita riga listino ⊆ validita BoM.
  # Questa semantica e' ora garantita in modo dichiarativo dalla temporal FK
  # fk_listrighe_comp_articoli_comp_temporal (20260514-12).
  # In pre-produzione non serve difesa in profondita': il constraint e'
  # piu' robusto del trigger (non bypassabile, errore standard SQL).
  #
  # Rimossa anche la variabile v_ac_validita (usata solo in guard 6)
  # e la corrispondente colonna ac.validita nel SELECT iniziale.
  # v_new_validita cambiato a %TYPE (catalogo uniforme con le altre var).
  #
  # Guard 7 (riga ⊆ versione listino) rimane invariato: la temporal FK
  # verso listini_versioni non e' applicabile (listini_versioni ha EXCLUDE
  # con WHERE, non candidabile a temporal UNIQUE).
  #
  # Versione precedente: 20260514-05.
  # ---------------------------------------------------------------------------

  - changeSet:
      id: 20260514-13-update-trgfn-listini-righe-comp-guard-coerenza-bom-remove-guard6
      author: mctit
      runOnChange: true
      comment: >
        Rimuove guard 6 (validita riga ⊆ BoM) da
        trgfn_listini_righe_comp_guard_coerenza_bom: ora gestito dalla
        temporal FK fk_listrighe_comp_articoli_comp_temporal (20260514-12).
        Guard 7 (riga ⊆ versione listino) invariato.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists:
              schemaName: vendite
              tableName: listini_righe_componenti
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*)
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'trgfn_listini_righe_comp_guard_coerenza_bom'
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_listini_righe_comp_guard_coerenza_bom()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE INS/UPD su listini_righe_componenti — 6 guard coerenza BoM.
              --   Guards 1-5: validano struttura BoM (esistenza, attivita', coerenza ID, composito, IVA).
              --   Guard 6: RIMOSSO — ora gestito da temporal FK fk_listrighe_comp_articoli_comp_temporal.
              --   Guard 7 (ora guard 6 logico): periodo riga ⊆ validita versione listino.
              --   v_new_validita usato per guard 7: daterange(NEW.valido_dal, NEW.valido_al, '[]')
              --   perche' validita e' STORED generated, non disponibile nei BEFORE trigger (D-OPEN-1).
              DECLARE
                  v_ac_prodotto_id   catalogo.articoli_componenti.prodotto_id%TYPE;
                  v_ac_componente_id catalogo.articoli_componenti.componente_id%TYPE;
                  v_ac_attivo        catalogo.articoli_componenti.attivo%TYPE;
                  v_padre_is_comp    catalogo.articoli.is_composito%TYPE;
                  v_padre_iva_id     catalogo.articoli.iva_id%TYPE;
                  v_figlio_iva_id    catalogo.articoli.iva_id%TYPE;
                  v_lv_validita      vendite.listini_versioni.validita%TYPE;
                  v_new_validita     vendite.listini_righe_componenti.validita%TYPE;
              BEGIN
                  -- Calcola periodo riga: non usare NEW.validita (STORED generated,
                  -- non disponibile in BEFORE trigger su PG 18)
                  v_new_validita := daterange(
                      NEW.valido_dal,
                      NEW.valido_al,
                      '[]'
                  );

                  -- Lettura BoM in unica query (ac.validita rimossa: non piu' necessaria)
                  SELECT ac.prodotto_id, ac.componente_id, ac.attivo,
                         a_padre.is_composito, a_padre.iva_id,
                         a_figlio.iva_id
                    INTO v_ac_prodotto_id, v_ac_componente_id, v_ac_attivo,
                         v_padre_is_comp, v_padre_iva_id,
                         v_figlio_iva_id
                    FROM catalogo.articoli_componenti ac
                    JOIN catalogo.articoli a_padre ON a_padre.id = ac.prodotto_id
                    JOIN catalogo.articoli a_figlio ON a_figlio.id = ac.componente_id
                   WHERE ac.id = NEW.articolo_componente_id;

                  -- Guard 1: articolo_componente_id deve esistere e essere attivo
                  IF NOT FOUND OR NOT COALESCE(v_ac_attivo, TRUE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_LISTINO_COMPONENTE_COERENZA_BOM',
                          jsonb_build_object(
                              'causa', 'articolo_componente_id non trovato o non attivo',
                              'articolo_componente_id', NEW.articolo_componente_id
                          ),
                          NULL::uuid,
                          format('articolo_componente_id=%s non trovato o non attivo',
                                 NEW.articolo_componente_id)
                      );
                  END IF;

                  -- Guard 2: articolo_padre_id deve coincidere con ac.prodotto_id
                  IF NEW.articolo_padre_id IS DISTINCT FROM v_ac_prodotto_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_LISTINO_COMPONENTE_COERENZA_BOM',
                          jsonb_build_object(
                              'causa', 'articolo_padre_id non coincide con BoM.prodotto_id',
                              'articolo_padre_id_ricevuto', NEW.articolo_padre_id,
                              'prodotto_id_atteso',          v_ac_prodotto_id
                          ),
                          NULL::uuid,
                          format('articolo_padre_id=%s atteso=%s',
                                 NEW.articolo_padre_id, v_ac_prodotto_id)
                      );
                  END IF;

                  -- Guard 3: articolo_figlio_id deve coincidere con ac.componente_id
                  IF NEW.articolo_figlio_id IS DISTINCT FROM v_ac_componente_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_LISTINO_COMPONENTE_COERENZA_BOM',
                          jsonb_build_object(
                              'causa', 'articolo_figlio_id non coincide con BoM.componente_id',
                              'articolo_figlio_id_ricevuto', NEW.articolo_figlio_id,
                              'componente_id_atteso',         v_ac_componente_id
                          ),
                          NULL::uuid,
                          format('articolo_figlio_id=%s atteso=%s',
                                 NEW.articolo_figlio_id, v_ac_componente_id)
                      );
                  END IF;

                  -- Guard 4: padre deve essere composito
                  IF NOT COALESCE(v_padre_is_comp, FALSE) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_LISTINO_COMPONENTE_COERENZA_BOM',
                          jsonb_build_object(
                              'causa', 'articolo padre non e'' composito',
                              'articolo_padre_id', NEW.articolo_padre_id
                          ),
                          NULL::uuid,
                          format('articolo_padre_id=%s non e'' composito',
                                 NEW.articolo_padre_id)
                      );
                  END IF;

                  -- Guard 5: IVA figlio = IVA padre
                  IF v_padre_iva_id IS DISTINCT FROM v_figlio_iva_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_LISTINO_COMPONENTE_COERENZA_BOM',
                          jsonb_build_object(
                              'causa', 'IVA padre != IVA figlio',
                              'iva_padre', v_padre_iva_id,
                              'iva_figlio', v_figlio_iva_id
                          ),
                          NULL::uuid,
                          format('IVA padre=%s != figlio=%s',
                                 v_padre_iva_id, v_figlio_iva_id)
                      );
                  END IF;

                  -- Guard 6 RIMOSSO: containment riga ⊆ BoM ora garantito dalla
                  -- temporal FK fk_listrighe_comp_articoli_comp_temporal (20260514-12).

                  -- Guard 7: periodo riga ⊆ validita versione listino.
                  -- Usa v_new_validita (daterange calcolato da valido_dal/valido_al):
                  -- NEW.validita non disponibile in BEFORE trigger (STORED generated).
                  SELECT lv.validita INTO v_lv_validita
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = NEW.listino_versione_id;

                  IF v_lv_validita IS NULL OR NOT (v_lv_validita @> v_new_validita) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_LISTINO_COMPONENTE_COERENZA_BOM',
                          jsonb_build_object(
                              'causa', 'validita riga listino comp non contenuta in validita versione listino',
                              'validita_listino_comp', v_new_validita::text,
                              'validita_versione',     v_lv_validita::text
                          ),
                          NULL::uuid,
                          format('validita=%s non contenuta in versione=%s',
                                 v_new_validita, v_lv_validita)
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_listini_righe_comp_guard_coerenza_bom() IS
                  'Trigger BEFORE INS/UPD su listini_righe_componenti: guards 1-5 + 7 coerenza BoM. '
                  '(1) ac esiste+attivo, (2) padre_id coerente, (3) figlio_id coerente, '
                  '(4) padre composito, (5) IVA padre=figlio, '
                  '(6) RIMOSSO: temporal FK fk_listrighe_comp_articoli_comp_temporal, '
                  '(7) daterange(valido_dal,valido_al) ⊆ versione listino. '
                  'validita e'' STORED generated: usare valido_dal/al nei BEFORE trigger. '
                  'Raise E_LISTINO_COMPONENTE_COERENZA_BOM (447). rev 2026-05-14.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS
                  script.trgfn_listini_righe_comp_guard_coerenza_bom();
