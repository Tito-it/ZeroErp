# LA CANONICA DEL PERIMETRO EMITTENTE CHIEDE AL PERIMETRO
#   script.fn_check_user_emittente_scope(integer,bigint)
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5quinquies, D-3b-2 (ondata 1a).
#
# ── IL DOPPIONE ─────────────────────────────────────────────────────
#   Le sei regole del perimetro erano scritte DUE volte: qui (la domanda su
#   un emittente) e in script.fn_get_emittenti_scope_pk_ids (l'insieme, per
#   il backend), che le guardava in un ordine diverso (veste prima del super
#   admin: stesso esito, perche' il super admin richiede gia' una veste
#   OPERATORE utilizzabile). Due copie della stessa regola divergono senza
#   che nessun test se ne accorga (regola del 2).
# ── LA CURA ─────────────────────────────────────────────────────────
#   La canonica chiede l'insieme a _pk_ids e lo interroga con la stessa
#   funzione di scope delle policy (script.fn_scope_ef_perimetro, -16).
# Firma, tipo, volatilita' (STABLE), COST 5000, INVOKER, GRANT: invariati.
# Stesse risposte: provato con i pgTAP della canonica
# (script/test-fn-scope-ef-whitelist, script/test-emittente-attivo-
# impersonazione-scope, script/test-fn-get-emittenti-scope-pk-ids-and-parity)
# prima e dopo.
# Corpo di partenza: il vivo (pg_get_functiondef su dbdev, 2026-10-18).
# Il perche' delle regole 1 (Q-1) e 5 (P-2a) resta nel COMMENT, che si
# conserva con la revisione davanti.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261018-18-update-fn-check-user-emittente-scope-su-perimetro-mctit.yaml

  - changeSet:
      id: 20261018-18-update-fn-check-user-emittente-scope-su-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_user_emittente_scope si appoggia a script.fn_get_emittenti_scope_pk_ids e script.fn_scope_ef_perimetro: una regola, due forme. Stesse risposte. D-3b-2 di brief-db-plancache-funzioni-con-query-incorporate.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_check_user_emittente_scope(integer,bigint)')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_get_emittenti_scope_pk_ids(integer)')
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_scope_ef_perimetro(boolean,bigint[],bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_user_emittente_scope(
                  p_auth_user_id         config.user_emittenti_fiscali.auth_user_id%TYPE,
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE COST 5000
              AS $function$
              DECLARE
                  -- ⚠️ `bigint[]` esplicito: `colonna%TYPE[]` non esiste in PostgreSQL.
                  v_perimetro bigint[];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica se un utente ha accesso a uno specifico
                  --   emittente fiscale. Sede unica read+write: la usano gli
                  --   adapter RLS, i verbi DEFINER e i trigger di guardia.
                  --
                  -- ⭐ Rev 2026-10-18 (D-3b-2, brief-db-plancache-funzioni-
                  --   con-query-incorporate §5quinquies): le regole stanno in
                  --   script.fn_get_emittenti_scope_pk_ids, che le scrive come
                  --   INSIEME (gli emittenti visibili) ed e' gia' la sede del
                  --   perimetro per il backend. Fino a oggi la stessa regola era
                  --   scritta DUE volte, qui e li': ora una. Qui resta la domanda
                  --   su UN emittente, fatta con la stessa funzione di scope delle
                  --   policy (script.fn_scope_ef_perimetro), e le policy dirette
                  --   calcolano il perimetro una volta per istruzione invece che
                  --   una volta per riga.
                  --
                  -- Regole (ora in fn_get_emittenti_scope_pk_ids):
                  --   1. p_auth_user_id NULL -> FALSE  (2026-10-04, Q-1)
                  --   2. Emittente attivo diverso da quello richiesto -> false
                  --      (restringe CHIUNQUE, anche il super admin)
                  --   3. fn_is_super_admin -> true (vede tutto)
                  --   4. Assenza identita OPERATORE utilizzabile -> false
                  --   5. Whitelist vuota -> FALSE  (P-2a, 2026-08-18)
                  --   6. Whitelist popolata -> l'emittente ci sta dentro
                  --   ⚠️ La 4 la _pk_ids la guarda PRIMA della 3: l'esito non
                  --   cambia, perche' il super admin richiede gia' una veste
                  --   OPERATORE utilizzabile (fn_is_super_admin_account).
                  --   Il perche' di 1 (Q-1) e di 5 (P-2a) e' nel COMMENT di
                  --   questa funzione.
                  -- =========================================================
                  v_perimetro := script.fn_get_emittenti_scope_pk_ids(p_auth_user_id);

                  -- NULL = tutti. Emittente NULL (riferimento non risolto dagli
                  -- adapter) -> false se il perimetro non e' «tutti».
                  RETURN script.fn_scope_ef_perimetro(v_perimetro IS NULL, v_perimetro,
                                                      p_emittente_fiscale_id);
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $c$
              BEGIN
                  EXECUTE format('COMMENT ON FUNCTION script.fn_check_user_emittente_scope(integer,bigint) IS %L',
                      '⭐ rev 2026-10-18 (20261018-18, D-3b-2): le regole stanno in una sede sola, script.fn_get_emittenti_scope_pk_ids (il perimetro come insieme); qui la domanda su un emittente la fa script.fn_scope_ef_perimetro, la stessa funzione delle policy. Stesse risposte. '
                      || coalesce(obj_description('script.fn_check_user_emittente_scope(integer,bigint)'::regprocedure, 'pg_proc'), ''));
              END
              $c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- Il corpo vivo di prima, per intero.
              CREATE OR REPLACE FUNCTION script.fn_check_user_emittente_scope(p_auth_user_id integer, p_emittente_fiscale_id bigint)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE COST 5000
              AS $function$
              DECLARE
                  v_cnt    integer;
                  v_attivo bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica se un utente ha accesso a uno specifico
                  --   emittente fiscale. Sede unica read+write: la usano gli
                  --   adapter RLS e i trigger di guardia.
                  --
                  -- Regole (refactor §4.6.B.5, + emittente attivo 2026-08-04,
                  --         + P-2a 2026-08-18):
                  --   1. p_auth_user_id NULL -> FALSE  ⬅ cambiato il 2026-10-04 (Q-1)
                  --   2. Emittente attivo diverso da quello richiesto -> false
                  --      (restringe CHIUNQUE, anche il super admin)
                  --   3. fn_is_super_admin -> true (vede tutto)
                  --   4. Assenza identita OPERATORE attiva -> false
                  --      (defensive: utente disabilitato non accede)
                  --   5. Whitelist vuota -> FALSE  ⬅ cambiato da P-2a
                  --   6. Whitelist popolata -> EXISTS match
                  -- =========================================================

                  -- 1. Nessun utente -> nessun accesso.
                  --    ⚠️ Rev 2026-10-04 (Q-1, brief-db-esclusioni-implicite): era
                  --    `RETURN true` («job batch»). Le policy restavano chiuse solo
                  --    perche' chiedono ANCHE la veste OPERATORE: una sessione con la
                  --    veste impostata e l'utente vuoto vedeva TUTTE le aziende. Il
                  --    guard di scrittura (trgfn_guard_emittente_scope) aveva gia'
                  --    tolto lo stesso ramo il 2026-09-04: senza utente passa solo chi
                  --    bypassa comunque la RLS (row_security_active), e quella
                  --    decisione la prende lui, prima di chiamare qui. Un processo
                  --    legittimo dice chi e' (brief processi automatici).
                  IF p_auth_user_id IS NULL THEN
                      RETURN false;
                  END IF;

                  -- 2. Emittente attivo (impersonazione di scope).
                  --    Deve precedere il ramo super admin: e' l'unico punto in
                  --    cui la selezione puo' restringere chi vede tutto.
                  --    IS DISTINCT FROM: con p_emittente_fiscale_id NULL
                  --    (riferimento non risolto dagli adapter) resta fail-closed.
                  v_attivo := NULLIF(
                                  current_setting('app.current_emittente_id', true),
                                  ''
                              )::bigint;

                  IF v_attivo IS NOT NULL
                     AND p_emittente_fiscale_id IS DISTINCT FROM v_attivo THEN
                      RETURN false;
                  END IF;

                  -- 3. Super admin? Bypass totale.
                  --    ⭐ L'unico attore legittimamente multi-emittente
                  --       (decisione Tid 2026-08-17). Non toccato da P-2a.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN true;
                  END IF;

                  -- 4. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN false;
                  END IF;

                  -- 5. Conta righe whitelist
                  SELECT count(*)
                    INTO v_cnt
                    FROM config.user_emittenti_fiscali uef
                   WHERE uef.auth_user_id = p_auth_user_id;

                  -- ⚠️ Rev 2026-08-18 (P-2a): era `RETURN true` con il commento
                  --   «nessuna restrizione». Un operatore senza riga aveva cosi'
                  --   accesso a QUALUNQUE emittente — mentre lo stesso utente,
                  --   sul lato scrittura, non poteva nemmeno creare un billing
                  --   account (fn_check_user_can_create_ba). Le due letture non
                  --   potevano essere entrambe intenzionali: la riga mancante e'
                  --   un errore di configurazione, non un permesso.
                  --   Brief perimetro-emittente §2.5.
                  IF v_cnt = 0 THEN
                      RETURN false;  -- nessun accesso: la riga manca
                  END IF;

                  -- 6. Verifica match specifico
                  RETURN EXISTS (
                      SELECT 1
                        FROM config.user_emittenti_fiscali uef
                       WHERE uef.auth_user_id         = p_auth_user_id
                         AND uef.emittente_fiscale_id = p_emittente_fiscale_id
                  );
              END
              $function$;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $c$
              BEGIN
                  EXECUTE format('COMMENT ON FUNCTION script.fn_check_user_emittente_scope(integer,bigint) IS %L',
                      replace(coalesce(obj_description('script.fn_check_user_emittente_scope(integer,bigint)'::regprocedure, 'pg_proc'), ''),
                              '⭐ rev 2026-10-18 (20261018-18, D-3b-2): le regole stanno in una sede sola, script.fn_get_emittenti_scope_pk_ids (il perimetro come insieme); qui la domanda su un emittente la fa script.fn_scope_ef_perimetro, la stessa funzione delle policy. Stesse risposte. ', ''));
              END
              $c$;
