# IL BB CHE RISOLVE LA PROVENIENZA: script.fn_sorgente_documento (+ il ponte per chiave testuale)
#   Brief: brief-db-sorgente-documento-e-riga §7.2 lotto 0 («BB che risolve», «ponte di
#   transizione, dichiarato»), scheda pratiche-documenti-BB §B.
#
# ── ⭐ CHE COSA FA ──────────────────────────────────────────────────
#   script.fn_sorgente_documento(tipo, sorgente_id, sorgente_uid) -> (documento_id,
#   documento_uid, documento_numero): da tipo + chiave, le due chiavi e il numero
#   leggibile del documento, in UNA lettura della sua tabella. Nasce da
#   vendite.fn_get_sorgente_documento_ref, che restituiva id e numero da una chiave
#   testuale: la regola resta quella, la sede passa in script.
#   · UNA riga SEMPRE, anche tutta NULL (una RETURNS TABLE che a volte torna zero
#     righe cancella la riga chiamante sotto un CROSS JOIN LATERAL).
#   · NON solleva: una provenienza che non si risolve fa sparire l'azione «apri»,
#     non rompe la lista. Chi deve fallire (il BB che scrive, il guard) solleva lui.
#   · INVOKER: sotto la RLS delle tabelle dei documenti NULL vuol dire «non
#     risolvibile O non visibile a chi chiede».
#   · Legge la chiave che riceve, l'id o l'uid, qualunque sia il key_selector del
#     tipo: la coerenza chiave/tipo la fa valere il guard. Con tutte e due, le
#     vuole coerenti. Una chiave che la tabella non ha (l'uid di una commessa) non
#     si risolve.
#   · L'etichetta si DICHIARA (label_selector): se il catalogo nomina una colonna
#     che non c'e', cade tutto, id compreso, come prima: un refuso di catalogo deve
#     vedersi. Ora lo si sa da config.fn_sorgente_livelli senza un blocco
#     EXCEPTION (una sottotransazione per riga di lista).
#
# ── ⭐ IL PONTE (dichiarato, si svuota lotto per lotto) ──────────────
#   script.fn_sorgente_documento_da_chiave(tipo, chiave text): le grammatiche
#   vecchie scrivono la chiave come testo (id::text o uuid::text, §3.1 G3/G4/G6/G7)
#   o l'uid dove il tipo dice id (G1). Il ponte riconosce la forma canonica coi BB
#   script.fn_sorgente_chiave_id / _uuid e chiama la funzione sopra. Il lotto Z
#   verifica che non lo chiami piu' nessuno.
#   ⚠️ Un id su un tipo a chiave uid (il preventivo in ordini.documento_origine_id,
#   G8) ora si risolve: e' una delle grammatiche che il ponte deve leggere.
#   Prima vendite.fn_get_sorgente_documento_ref lo lasciava a NULL.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261106-11-create-fn-sorgente-documento-mctit.yaml

  - changeSet:
      id: 20261106-11-create-fn-sorgente-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_sorgente_documento(tipo, sorgente_id, sorgente_uid) e il ponte
        script.fn_sorgente_documento_da_chiave(tipo, chiave text): il BB che risolve la provenienza.
        brief-db-sorgente-documento-e-riga §7.2 lotto 0.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'config' AND p.proname = 'fn_sorgente_livelli';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_sorgente_documento(
                  p_sorgente_tipo_id config.sorgenti.id%TYPE,
                  p_sorgente_id      bigint,
                  p_sorgente_uid     uuid)
              RETURNS TABLE(documento_id bigint, documento_uid uuid, documento_numero text)
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              ROWS 1
              AS $function$
              DECLARE
                  v_schema    pg_catalog.pg_namespace.nspname%TYPE;
                  v_tabella   pg_catalog.pg_class.relname%TYPE;
                  v_ha_uid    boolean;
                  v_label     config.sorgenti.label_selector%TYPE;
                  v_ha_label  boolean;
                  -- Frammenti della SELECT: colonne costruite con %I, mai testo
                  -- del chiamante dentro il format.
                  v_uid_expr   text;
                  v_label_expr text;
              BEGIN
                  -- =========================================================
                  -- Scopo: da tipo + chiave (id o uid), l'id, l'uid e il numero
                  --   leggibile del documento di origine, in una lettura.
                  -- Ritorna: UNA riga sempre; tutta NULL se la provenienza non
                  --   si risolve (tipo assente, nessuna chiave, documento che
                  --   non c'e' o non e' visibile, catalogo incoerente).
                  -- ⚠️ Non solleva: e' la domanda di una lista. Chi scrive e il
                  --   guard sollevano loro.
                  -- =========================================================
                  documento_id     := NULL;
                  documento_uid    := NULL;
                  documento_numero := NULL;

                  IF p_sorgente_tipo_id IS NULL OR p_sorgente_tipo_id <= 0
                     OR (p_sorgente_id IS NULL AND p_sorgente_uid IS NULL) THEN
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  SELECT l.documento_schema, l.documento_tabella, l.documento_ha_uid,
                         l.label_selector, l.documento_ha_label
                    INTO v_schema, v_tabella, v_ha_uid, v_label, v_ha_label
                    FROM config.fn_sorgente_livelli(p_sorgente_tipo_id) l;

                  -- Tipo assente o senza tabella del documento.
                  IF v_tabella IS NULL THEN
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  -- L'etichetta e' dichiarata ma la colonna non c'e': un difetto
                  -- di CATALOGO. Cade tutto, id compreso, perche' si veda.
                  IF v_label IS NOT NULL AND NOT v_ha_label THEN
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  -- Una chiave che la tabella non ha non si risolve.
                  IF p_sorgente_uid IS NOT NULL AND NOT v_ha_uid THEN
                      RETURN NEXT;
                      RETURN;
                  END IF;

                  v_uid_expr := CASE WHEN v_ha_uid THEN 't.uid' ELSE 'NULL::uuid' END;
                  v_label_expr := CASE
                      WHEN v_label IS NULL THEN 'NULL::text'
                      ELSE format('t.%I::text', v_label)
                  END;

                  IF p_sorgente_id IS NOT NULL THEN
                      -- Con tutte e due le chiavi, devono indicare lo stesso documento.
                      EXECUTE format(
                          'SELECT t.id::bigint, %s, %s FROM %I.%I t WHERE t.id = $1%s',
                          v_uid_expr, v_label_expr, v_schema, v_tabella,
                          CASE WHEN p_sorgente_uid IS NOT NULL THEN ' AND t.uid = $2' ELSE '' END)
                        INTO documento_id, documento_uid, documento_numero
                        USING p_sorgente_id, p_sorgente_uid;
                  ELSE
                      EXECUTE format(
                          'SELECT t.id::bigint, t.uid, %s FROM %I.%I t WHERE t.uid = $1',
                          v_label_expr, v_schema, v_tabella)
                        INTO documento_id, documento_uid, documento_numero
                        USING p_sorgente_uid;
                  END IF;

                  RETURN NEXT;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_sorgente_documento(config.sorgenti.id%TYPE, bigint, uuid) IS
                'Il BB che risolve la provenienza: da tipo (config.sorgenti) e chiave del documento, l''id, l''uid e il numero leggibile del documento, in una lettura della sua tabella (config.fn_sorgente_livelli). Legge la chiave che riceve, sorgente_id o sorgente_uid, qualunque sia il key_selector del tipo; con tutte e due le vuole coerenti; una chiave che la tabella non ha (l''uid di una commessa) non si risolve. Il numero viene dalla colonna che il catalogo dichiara (label_selector); NULL se non la dichiara. Se la dichiara e la colonna non esiste cade tutta la riga, id compreso: un refuso di catalogo deve vedersi. Restituisce SEMPRE una riga, anche tutta NULL, e non solleva: una provenienza che non si risolve fa sparire l''azione, non rompe la lista. INVOKER: sotto la RLS dei documenti NULL vuol dire anche «non visibile a chi chiede». Per una chiave in forma di testo c''e'' script.fn_sorgente_documento_da_chiave.';

              REVOKE EXECUTE ON FUNCTION script.fn_sorgente_documento(config.sorgenti.id%TYPE, bigint, uuid) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION script.fn_sorgente_documento(config.sorgenti.id%TYPE, bigint, uuid) TO zeroerp_app;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_sorgente_documento_da_chiave(
                  p_sorgente_tipo_id config.sorgenti.id%TYPE,
                  p_chiave           text)
              RETURNS TABLE(documento_id bigint, documento_uid uuid, documento_numero text)
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              ROWS 1
              BEGIN ATOMIC
                  SELECT d.documento_id, d.documento_uid, d.documento_numero
                    FROM script.fn_sorgente_documento(
                             p_sorgente_tipo_id,
                             script.fn_sorgente_chiave_id(p_chiave),
                             script.fn_sorgente_chiave_uuid(p_chiave)) d;
              END;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_sorgente_documento_da_chiave(config.sorgenti.id%TYPE, text) IS
                'Il ponte del BB che risolve la provenienza, per le tabelle che scrivono ancora la chiave del documento come testo (id::text o uuid::text) o l''uid dove il tipo dice id. Riconosce la forma CANONICA con script.fn_sorgente_chiave_id / _uuid e risolve con script.fn_sorgente_documento: stesso risultato, una riga sempre, mai un errore. Una chiave che non e'' in forma canonica (zeri davanti, spazi, maiuscole) non si risolve. Si svuota lotto per lotto, man mano che le tabelle passano alle colonne sorgente_id / sorgente_uid.';

              REVOKE EXECUTE ON FUNCTION script.fn_sorgente_documento_da_chiave(config.sorgenti.id%TYPE, text) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION script.fn_sorgente_documento_da_chiave(config.sorgenti.id%TYPE, text) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_sorgente_documento_da_chiave(config.sorgenti.id%TYPE, text);
              DROP FUNCTION IF EXISTS script.fn_sorgente_documento(config.sorgenti.id%TYPE, bigint, uuid);
