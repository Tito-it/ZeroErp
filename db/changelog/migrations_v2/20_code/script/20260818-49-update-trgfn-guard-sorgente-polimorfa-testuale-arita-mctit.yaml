# Arita' dei valori — `E_SORG_KEY_MISSING` passava 1 valore su 2 segnaposto
#   Brief: docs/it/dev/work-done/brief-db-segnaposti-messaggi-errore.md §7
#   Lotto: 20260818-47 .. -54, uno per funzione. Decisione Tid, 2026-08-18.
#
# ── IL DIFETTO, IN UNA RIGA ────────────────────────────────────────────
#   `script.fn_log_and_raise_error` compone il testo con
#   `format(messaggio, VARIADIC valori)`. Con MENO valori dei segnaposto,
#   `format()` non degrada: **alza `22023`**. E alza da DENTRO la funzione,
#   quindi il `RAISE` di dominio due righe sotto non viene mai eseguito —
#   niente `P0001`, niente codice nel canale `CONSTRAINT`, niente campo nel
#   canale `COLUMN`. Il guard blocca lo stesso (il dato resta integro, ed e'
#   il motivo per cui non se n'era accorto nessuno), ma il backend perde il
#   codice su cui decide 409/404/403 e l'operatore legge un errore interno al
#   posto della frase scritta per lui.
#
# ── ⚠️ LA FORMA: DUE MESSAGGI SCRITTI DUE VOLTE ────────────────────────
#   Qui non manca un valore per distrazione: il chiamante passava una **frase
#   gia' composta** come valore unico, mentre a catalogo il messaggio ha i suoi
#   segnaposto. Sono due testi che dicono la stessa cosa e non si compongono.
#   ⭐ Ed e' un difetto anche quando non alza: una frase composta dentro al
#   plpgsql **non e' traducibile**, perche' non passa da
#   `config.messaggi_errore`. I valori vanno passati sciolti; il testo lo
#   compone il catalogo, che e' l'unico posto da cui si puo' tradurre.
#
# ── NOTE DI CASA ────────────────────────────────────────────────────────
#   · ⚠️ **PERMESSI — nessun prestito di proprieta', nessun `GRANT`.** Misurato
#     il 2026-08-18, non dedotto: questa funzione e' di **`titodb`** (che e' chi
#     migra), **non** e' `SECURITY DEFINER` e **non** e' nel registro
#     `dbops.sec_functions_owner`. Il precedente e' il `20260808-04` su
#     `script.fn_log_and_raise_error`, che documenta anche il perche' l'ACL
#     esplicita (`=X/titodb`, `zeroerp_app=X`, `zeroerp_batch_fatturazione=X`)
#     **sopravvive** a un `CREATE OR REPLACE` — sarebbe diverso con
#     `DROP` + `CREATE`, dove i privilegi si perdono e il loop di grant
#     `20260205-41` li rimetterebbe solo alla corsa `ci_apply` successiva.
#     ⚠️ Da non confondere con `script.fn_log_error_only`, che invece e' di
#     `postgres`, **e'** `SECURITY DEFINER` ed **e'** nel registro: quella,
#     riscriverla, il prestito lo richiede.
#   · Corpo dalla doc auto-gen `docs/it/dbzero/`, col `;` dopo `$function$`
#     aggiunto a mano: l'auto-gen non ce l'ha e senza quello il `COMMENT`
#     sotto da' «errore di sintassi a o presso COMMENT».
#   · Firma e `RETURNS` invariati: cambia solo la lista dei valori.
#   · Presidio: `db/pgtap/script/test-catalogo-messaggi-errore-completo.sql`
#     test 5. Rientra quando l'ultimo degli 8 changeSet e' applicato — e a
#     quel punto va tolta la riga di questo file da `baseline-rossi.tsv`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260818-49-update-trgfn-guard-sorgente-polimorfa-testuale-arita-mctit.yaml

  - changeSet:
      id: 20260818-49-update-trgfn-guard-sorgente-polimorfa-testuale-arita
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il ramo «chiave testuale mancante» passava un concat() come valore unico a
        E_SORG_KEY_MISSING, che di segnaposto ne ha due: format() alzava 22023 e
        l'errore di dominio spariva. Ora passa tipo sorgente e key_selector sciolti.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'trgfn_guard_sorgente_polimorfa_testuale'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_guard_sorgente_polimorfa_testuale()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                -- =========================================================
                -- Scopo:
                --   Validare la sorgente polimorfa delle tabelle di
                --   collegamento a chiave unica TESTUALE (MODELLO B:
                --   pratiche_sorgenti, commesse_sorgenti): NEW.sorgente_uid
                --   TEXT deve rispettare il formato dettato da
                --   config.sorgenti.key_selector (id::text per 'id', uuid
                --   testuale per 'uid') ed esistere nella target_table.
                --   NEW.sorgente_riga qui NON e' una chiave documento e non
                --   viene validata (grana di riga del link; D4 fase 2).
                -- =========================================================
                c_uuid_re  CONSTANT text := '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$';
                v_tbl      regclass;
                v_selector text;
                v_uid      text;
                v_exists   boolean;
              BEGIN
                -- Se non e' valorizzata la sorgente, nessuna verifica
                IF NEW.sorgente_tipo_id IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Recupero configurazione sorgente attiva
                SELECT s.target_table, s.key_selector
                  INTO v_tbl, v_selector
                  FROM config.sorgenti s
                 WHERE s.id = NEW.sorgente_tipo_id
                   AND s.attivo = true;

                IF v_tbl IS NULL OR v_selector IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.trgfn_guard_sorgente_polimorfa_testuale',
                    'E_SORG_CONF',
                    jsonb_build_object(
                      'detail','Configurazione sorgente mancante/errata',
                      'sorgente_tipo_id', NEW.sorgente_tipo_id,
                      'target_table', COALESCE(v_tbl::text,'<NULL>'),
                      'key_selector', COALESCE(v_selector,'<NULL>')
                    ),
                    NULL::uuid,
                    concat(NEW.sorgente_tipo_id::text,
                      ' target_table:', COALESCE(v_tbl::text,'<NULL>'),
                      ' key_selector:', COALESCE(v_selector,'<NULL>'))
                  );
                END IF;

                -- Chiave testuale obbligatoria
                v_uid := btrim(NEW.sorgente_uid);
                IF v_uid IS NULL OR v_uid = '' THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.trgfn_guard_sorgente_polimorfa_testuale',
                    'E_SORG_KEY_MISSING',
                    jsonb_build_object(
                      'detail','Chiave sorgente mancante: atteso sorgente_uid (text)',
                      'sorgente_tipo_id', NEW.sorgente_tipo_id,
                      'key_selector', v_selector
                    ),
                    NULL::uuid,
                    -- ⚠️ ARITA' (2026-08-18): il concat() componeva UN valore solo, ma
                    --   E_SORG_KEY_MISSING ha due segnaposto -> format() alzava 22023.
                    --   Gli altri tre punti di questa funzione passano un valore a messaggi
                    --   con un segnaposto e stanno bene: era solo questo.
                    NEW.sorgente_tipo_id::text, v_selector
                  );
                END IF;

                -- Formato + esistenza secondo key_selector
                IF v_selector = 'id' THEN
                  IF v_uid !~ '^[0-9]+$' THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'script.trgfn_guard_sorgente_polimorfa_testuale',
                      'E_SORG_FORMATO',
                      jsonb_build_object(
                        'detail','Atteso id numerico in testo (convenzione id::text)',
                        'sorgente_tipo_id', NEW.sorgente_tipo_id,
                        'key_selector', v_selector,
                        'sorgente_uid', v_uid
                      ),
                      NULL::uuid,
                      concat('atteso id::text, ricevuto ', v_uid)
                    );
                  END IF;

                  EXECUTE format('SELECT true FROM %s WHERE id = $1', v_tbl::text)
                    INTO v_exists
                    USING v_uid::bigint;

                ELSIF v_selector = 'uid' THEN
                  IF v_uid !~ c_uuid_re THEN
                    PERFORM script.fn_log_and_raise_error(
                      'database',
                      'script.trgfn_guard_sorgente_polimorfa_testuale',
                      'E_SORG_FORMATO',
                      jsonb_build_object(
                        'detail','Atteso uuid testuale',
                        'sorgente_tipo_id', NEW.sorgente_tipo_id,
                        'key_selector', v_selector,
                        'sorgente_uid', v_uid
                      ),
                      NULL::uuid,
                      concat('atteso uuid, ricevuto ', v_uid)
                    );
                  END IF;

                  EXECUTE format('SELECT true FROM %s WHERE uid = $1', v_tbl::text)
                    INTO v_exists
                    USING v_uid::uuid;

                ELSE
                  -- Valore non consentito: config.sorgenti dovrebbe impedirlo con CHECK
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.trgfn_guard_sorgente_polimorfa_testuale',
                    'E_SORG_KEYSEL',
                    jsonb_build_object(
                      'detail','key_selector non supportato',
                      'sorgente_tipo_id', NEW.sorgente_tipo_id,
                      'key_selector', v_selector
                    ),
                    NULL::uuid,
                    concat(NEW.sorgente_tipo_id::text, ' key_selector:', v_selector)
                  );
                END IF;

                IF NOT COALESCE(v_exists, false) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.trgfn_guard_sorgente_polimorfa_testuale',
                    'E_SORG_NOT_FOUND',
                    jsonb_build_object(
                      'detail','Riferimento sorgente non trovato nella tabella target',
                      'sorgente_tipo_id', NEW.sorgente_tipo_id,
                      'target_table', v_tbl::text,
                      'key_selector', v_selector,
                      'sorgente_uid', v_uid
                    ),
                    NULL::uuid,
                    concat(NEW.sorgente_tipo_id::text,
                      ' target_table ', v_tbl::text,
                      ' key_selector ', v_selector,
                      ' sorgente_uid ', v_uid)
                  );
                END IF;

                RETURN NEW;
              END
              $function$;

              COMMENT ON FUNCTION script.trgfn_guard_sorgente_polimorfa_testuale()
              IS 'Guard polimorfo MODELLO B (tabelle di collegamento a chiave unica testuale: pratiche.pratiche_sorgenti, vendite.commesse_sorgenti): valida che NEW.sorgente_uid TEXT rispetti il formato dettato da config.sorgenti.key_selector (id::text per i tipi id, uuid testuale per i tipi uid — E_SORG_FORMATO) e che la riga esista nella target_table (E_SORG_NOT_FOUND). NON valida sorgente_riga (grana di riga del link, non chiave documento; D4 rinviata). Sorella di trgfn_guard_sorgente_polimorfa_tipizzata (modello A). Brief-db-guard-sorgente-polimorfa, 2026-07-18.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Vuoto di proposito: il ripristino della versione precedente
              -- rimetterebbe in servizio la chiamata che alza 22023. Se serve
              -- tornare indietro, si scrive un changeSet in avanti.
              SELECT 1;
