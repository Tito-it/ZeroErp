# LA VERSIONE DI LISTINO ENTRA NELLA MAPPA DELLE TESTATE
#   Brief: brief-modello-documento-vendita §16 (giro 12, L-1 di Tid,
#   2026-10-28). Corpo di partenza: il vivo (20261025-07), uguale alla doc
#   auto-generata; cambia solo la riga nuova.
#
#   vendite.listini_versioni: colonna stato_doc_listino_versione_id
#   (20261028-04), vocabolario config.stati_doc_listino_versioni e matrice
#   config.transizioni_stati_listino_versioni (20261028-03). Da qui la
#   versione usa i pezzi comuni: script.fn_doc_stato_id, il verbo comune
#   (script.fn_doc_passaggio, script.fn_guard_passaggio,
#   script.fn_doc_scrivi_stato), la porta (20261028-26),
#   script.fn_doc_azioni_permesse e la fixture dbops.fn_pgtap_porta_a_stato.
#   Stessa firma e stesso tipo di ritorno: CREATE OR REPLACE.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261028-06-update-fn-doc-stato-modello-listino-versione-mctit.yaml

  - changeSet:
      id: 20261028-06-update-fn-doc-stato-modello-listino-versione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_doc_stato_modello: la versione di listino (vendite.listini_versioni) entra nella
        mappa delle testate. Brief: brief-modello-documento-vendita §16 (L-1).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists: { schemaName: config, tableName: stati_doc_listino_versioni }
            - tableExists: { schemaName: config, tableName: transizioni_stati_listino_versioni }
            - columnExists:
                schemaName: vendite
                tableName: listini_versioni
                columnName: stato_doc_listino_versione_id
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_doc_stato_modello(p_testata regclass)
               RETURNS TABLE(colonna_stato text, vocabolario regclass, matrice regclass,
                             colonna_da text, colonna_a text, colonna_vivo text, filtro text)
               LANGUAGE sql
               STABLE
               SECURITY INVOKER
              AS $function$
                  -- Scopo: dove sta lo stato di una testata e quale matrice ne
                  --   dice i passaggi. Tipi nudi: nomi di colonna e tabelle,
                  --   nessuna colonna di cui siano il riflesso.
                  -- Nessuna riga: la testata non ha (ancora) una matrice.
                  SELECT m.col, m.voc, m.mat, m.da, m.a, m.vivo, m.filtro
                    FROM (VALUES
                      ('vendite.preventivi'::regclass,          'stato_doc_preventivo_id', 'config.stati_doc_preventivi'::regclass, 'config.transizioni_stati_preventivi'::regclass,  'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.offerte_commerciali'::regclass, 'stato_doc_offerta_id',    'config.stati_doc_offerte'::regclass,    'config.stati_doc_offerte_transizioni'::regclass, 'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.contratti'::regclass,           'stato_doc_contratto_id',  'config.stati_doc_contratti'::regclass,  'config.transizioni_stati_contratti'::regclass,   'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.ordini'::regclass,              'stato_doc_ordine_id',     'config.stati_doc_ordini'::regclass,     'config.transizioni_stati_ordini'::regclass,      'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.ddt'::regclass,                 'stato_doc_ddt_id',        'config.stati_doc_ddt'::regclass,        'config.transizioni_stati_ddt'::regclass,         'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.resi'::regclass,                'stato_doc_reso_id',       'config.stati_doc_reso'::regclass,       'config.transizioni_stati_reso'::regclass,        'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.commesse'::regclass,            'stato_commessa_id',       'vendite.stati_commessa'::regclass,      'vendite.transizioni_stati_commessa'::regclass,   'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.fatture'::regclass,             'stato_doc_fiscale_id',    'config.stati_doc_fiscale'::regclass,    'config.stati_doc_fiscale_transizioni'::regclass, 'stato_from_id', 'stato_to_id', 'ammesso', 'AND t.solo_lotto IS FALSE'),
                      ('vendite.fatturazione_lotti'::regclass,  'stato_doc_fiscale_id',    'config.stati_doc_fiscale'::regclass,    'config.stati_doc_fiscale_transizioni'::regclass, 'stato_from_id', 'stato_to_id', 'ammesso', 'AND t.solo_fattura IS FALSE'),
                      ('vendite.listini_versioni'::regclass,    'stato_doc_listino_versione_id', 'config.stati_doc_listino_versioni'::regclass, 'config.transizioni_stati_listino_versioni'::regclass, 'stato_da_id', 'stato_a_id', 'attivo', '')
                    ) AS m(tab, col, voc, mat, da, a, vivo, filtro)
                   WHERE m.tab = p_testata;
              $function$;

              COMMENT ON FUNCTION script.fn_doc_stato_modello(p_testata regclass)
                IS 'BB del modello del documento: per una testata, dove sta il suo stato (colonna_stato, vocabolario) e quale matrice ne dice i passaggi (matrice, con i nomi delle sue colonne da / a / passaggio vivo, e il filtro in piu'' della fattura e del lotto, che condividono config.stati_doc_fiscale_transizioni). Nessuna riga: la testata non ha una matrice. E'' codice, non configurazione: una testata nuova entra riscrivendo la funzione. Consumatori: il verbo comune (script.fn_doc_passaggio, script.fn_doc_scrivi_stato), la porta script.trgfn_doc_stato_solo_dal_verbo, la fixture dbops.fn_pgtap_porta_a_stato. Testate: le otto di vendita col lotto di fatturazione, e dal 2026-10-28 la versione di listino (20261028-06, §16). Brief: brief-modello-documento-vendita §7 (S-2, Tid 2026-10-25).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il corpo del 20261025-07, senza la versione di listino.
              CREATE OR REPLACE FUNCTION script.fn_doc_stato_modello(p_testata regclass)
               RETURNS TABLE(colonna_stato text, vocabolario regclass, matrice regclass,
                             colonna_da text, colonna_a text, colonna_vivo text, filtro text)
               LANGUAGE sql
               STABLE
               SECURITY INVOKER
              AS $function$
                  SELECT m.col, m.voc, m.mat, m.da, m.a, m.vivo, m.filtro
                    FROM (VALUES
                      ('vendite.preventivi'::regclass,          'stato_doc_preventivo_id', 'config.stati_doc_preventivi'::regclass, 'config.transizioni_stati_preventivi'::regclass,  'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.offerte_commerciali'::regclass, 'stato_doc_offerta_id',    'config.stati_doc_offerte'::regclass,    'config.stati_doc_offerte_transizioni'::regclass, 'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.contratti'::regclass,           'stato_doc_contratto_id',  'config.stati_doc_contratti'::regclass,  'config.transizioni_stati_contratti'::regclass,   'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.ordini'::regclass,              'stato_doc_ordine_id',     'config.stati_doc_ordini'::regclass,     'config.transizioni_stati_ordini'::regclass,      'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.ddt'::regclass,                 'stato_doc_ddt_id',        'config.stati_doc_ddt'::regclass,        'config.transizioni_stati_ddt'::regclass,         'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.resi'::regclass,                'stato_doc_reso_id',       'config.stati_doc_reso'::regclass,       'config.transizioni_stati_reso'::regclass,        'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.commesse'::regclass,            'stato_commessa_id',       'vendite.stati_commessa'::regclass,      'vendite.transizioni_stati_commessa'::regclass,   'stato_da_id',   'stato_a_id',  'attivo',  ''),
                      ('vendite.fatture'::regclass,             'stato_doc_fiscale_id',    'config.stati_doc_fiscale'::regclass,    'config.stati_doc_fiscale_transizioni'::regclass, 'stato_from_id', 'stato_to_id', 'ammesso', 'AND t.solo_lotto IS FALSE'),
                      ('vendite.fatturazione_lotti'::regclass,  'stato_doc_fiscale_id',    'config.stati_doc_fiscale'::regclass,    'config.stati_doc_fiscale_transizioni'::regclass, 'stato_from_id', 'stato_to_id', 'ammesso', 'AND t.solo_fattura IS FALSE')
                    ) AS m(tab, col, voc, mat, da, a, vivo, filtro)
                   WHERE m.tab = p_testata;
              $function$;
