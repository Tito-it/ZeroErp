# ------------------------------------------------------------
# P-1 — IL CHECK DEL LOGIN PER CREDENZIALE E PROVENIENZA:
#   script.fn_check_blocco_login(p_auth_user_id, p_provenienza)
#   Brief: brief-db-blocco-login-per-credenziale, sezioni 2.4 e 3.1
#   Origine: difetto M-4 di analisi-be-difetti-emersi-verifica-doc-api-core
#
# ── ⛔ IL DIFETTO CHE CHIUDE ─────────────────────────────────────────
#   La versione di prima leggeva il blocco dalla riga identita_digitali con
#   ruolo_applicativo = 'OPERATORE': chi non aveva quella riga (portale, shop)
#   non era MAI bloccato, e chi l'aveva era bloccato come operatore sbagliando
#   sul portale. Il filtro era un residuo dell'hotfix 20260419-93/-94, non una
#   scelta. Qui nessun filtro su veste o ruolo: lo stato e' della credenziale.
#
# ── ⭐ TRE VERIFICHE, IN QUEST'ORDINE (il primo che scatta vince) ─────
#   1. BLOCCO DELL'ADMIN -> E_CREDENZIALE_BLOCCATA (non scade: «rivolgersi
#      all'amministratore»);
#   2. FRENO SULLA PROVENIENZA -> E_UTENTE_BLOCCATO, invariato, con i minuti
#      rimanenti nel contesto. Un freno SCADUTO fa ripartire la coppia: la riga
#      si cancella (una riga di provenienza esiste solo per ricordare fallimenti);
#   3. ATTESA CRESCENTE -> E_LOGIN_ATTESA con i secondi rimanenti.
#   Il check gira PRIMA della verifica della password (core/api/auth_views.py):
#   un tentativo rifiutato qui non verifica la password e non conta.
#
# ── ⛔ LA FIRMA CAMBIA ───────────────────────────────────────────────
#   Serve la provenienza (l'IP del chiamante): e' una funzione nuova per
#   PostgreSQL, quindi la vecchia a un argomento si fa DROP, non si lascia come
#   overload. Chiamanti: nel DB nessuno (censito pg_proc.prosrc, 2026-09-25);
#   fuori, AuthRepository.check_blocco_login del backend; pgTAP nessuno.
#   ⚠️ Il backend a un argomento si rompe all'apply: questo changeSet va
#   applicato insieme alla PR del backend (brief §6).
#
# ── ⚠️ ASSENZA DELLA RIGA ────────────────────────────────────────────
#   Nessuna riga in config.credenziali = nessun tentativo, non bloccata: il
#   check passa senza leggere i parametri.
#
# SECURITY DEFINER del PROPRIETARIO (cancella la riga di un freno scaduto, e
# l'app su config.credenziali_provenienze ha solo SELECT), search_path bloccato.
# Nessun guard di permesso, dichiarato: gira prima che esista un utente.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260925-10-update-fn-check-blocco-login-per-credenziale-mctit.yaml

  - changeSet:
      id: 20260925-10-update-fn-check-blocco-login-per-credenziale
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_blocco_login(p_auth_user_id, p_provenienza): il check del login per
        credenziale e provenienza, senza filtro su veste (M-4). Nell'ordine: blocco dell'admin
        (E_CREDENZIALE_BLOCCATA), freno sulla coppia (E_UTENTE_BLOCCATO; scaduto -> la coppia
        riparte), attesa crescente (E_LOGIN_ATTESA). Firma nuova: DROP della versione a un
        argomento. SECURITY DEFINER del proprietario. Brief: brief-db-blocco-login-per-credenziale
        §2.4, §3.1.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: config, tableName: credenziali_provenienze }
            - sqlCheck:
                expectedResult: "2"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname IN ('fn_login_parametri', 'fn_login_attesa_secondi');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_blocco_login(integer);

              CREATE OR REPLACE FUNCTION script.fn_check_blocco_login(
                  p_auth_user_id integer,
                  p_provenienza  config.credenziali_provenienze.provenienza%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: prima della verifica della password, dire se questa credenziale
              --   puo' provare da questa provenienza. Tre verifiche, il primo che
              --   scatta vince: blocco dell'admin, freno sulla coppia, attesa crescente.
              DECLARE
                  v_credenziale_id    config.credenziali.id%TYPE;
                  v_bloccata_at       config.credenziali.bloccata_at%TYPE;
                  v_fallimenti        config.credenziali.fallimenti_consecutivi%TYPE;
                  v_ultimo_fallimento config.credenziali.ultimo_fallimento_at%TYPE;
                  v_bloccato_fino_a   config.credenziali_provenienze.bloccato_fino_a%TYPE;
                  v_tetto             integer;
                  v_attesa_base       integer;
                  v_attesa_max        integer;
                  v_attesa            integer;
                  v_riprova_da        timestamptz;
                  v_rimanenti         integer;
              BEGIN
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 OR p_provenienza IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_check_blocco_login', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id,
                                             'p_provenienza',  p_provenienza::text),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_check_blocco_login',
                                         'credenziale e provenienza obbligatorie']);
                  END IF;

                  SELECT c.id, c.bloccata_at, c.fallimenti_consecutivi, c.ultimo_fallimento_at
                    INTO v_credenziale_id, v_bloccata_at, v_fallimenti, v_ultimo_fallimento
                    FROM config.credenziali c
                   WHERE c.auth_user_id = p_auth_user_id;

                  -- Nessuna riga: nessun tentativo, non bloccata.
                  IF v_credenziale_id IS NULL THEN
                      RETURN;
                  END IF;

                  -- 1. Blocco dell'admin: non scade.
                  IF v_bloccata_at IS NOT NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_check_blocco_login', 'E_CREDENZIALE_BLOCCATA',
                          jsonb_build_object('auth_user_id', p_auth_user_id,
                                             'bloccata_at',  v_bloccata_at),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  -- 2. Freno sulla coppia credenziale + provenienza.
                  SELECT p.bloccato_fino_a
                    INTO v_bloccato_fino_a
                    FROM config.credenziali_provenienze p
                   WHERE p.credenziale_id = v_credenziale_id
                     AND p.provenienza    = p_provenienza;

                  IF v_bloccato_fino_a IS NOT NULL THEN
                      IF v_bloccato_fino_a <= now() THEN
                          -- Freno scaduto: la coppia riparte da zero.
                          DELETE FROM config.credenziali_provenienze p
                           WHERE p.credenziale_id = v_credenziale_id
                             AND p.provenienza    = p_provenienza;
                      ELSE
                          v_rimanenti := GREATEST(1,
                              CEIL(EXTRACT(EPOCH FROM (v_bloccato_fino_a - now())) / 60)::integer);
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'script.fn_check_blocco_login', 'E_UTENTE_BLOCCATO',
                              jsonb_build_object('auth_user_id',     p_auth_user_id,
                                                 'provenienza',      p_provenienza::text,
                                                 'bloccato_fino_a',  v_bloccato_fino_a,
                                                 'minuti_rimanenti', v_rimanenti),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]);
                      END IF;
                  END IF;

                  -- 3. Attesa crescente sulla credenziale (da qualunque provenienza).
                  IF v_fallimenti > 0 THEN
                      SELECT lp.tetto_credenziale, lp.attesa_base_secondi, lp.attesa_max_secondi
                        INTO v_tetto, v_attesa_base, v_attesa_max
                        FROM script.fn_login_parametri() lp;

                      v_attesa := script.fn_login_attesa_secondi(
                          v_fallimenti, v_tetto, v_attesa_base, v_attesa_max);

                      IF v_attesa > 0 THEN
                          v_riprova_da := v_ultimo_fallimento + make_interval(secs => v_attesa);
                          IF v_riprova_da > now() THEN
                              v_rimanenti := GREATEST(1,
                                  CEIL(EXTRACT(EPOCH FROM (v_riprova_da - now())))::integer);
                              PERFORM script.fn_log_and_raise_error(
                                  'database', 'script.fn_check_blocco_login', 'E_LOGIN_ATTESA',
                                  jsonb_build_object('auth_user_id',      p_auth_user_id,
                                                     'fallimenti',        v_fallimenti,
                                                     'attesa_secondi',    v_attesa,
                                                     'secondi_rimanenti', v_rimanenti),
                                  NULL::uuid,
                                  VARIADIC ARRAY[v_rimanenti::text]);
                          END IF;
                      END IF;
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_blocco_login(integer, inet) IS
                  'Check del login, PRIMA della verifica della password, per CREDENZIALE e PROVENIENZA (M-4: nessun filtro su veste o ruolo). Nell''ordine, il primo che scatta vince: (1) blocco dell''admin -> E_CREDENZIALE_BLOCCATA, non scade; (2) freno sulla coppia credenziale + provenienza -> E_UTENTE_BLOCCATO con i minuti rimanenti nel contesto, e un freno scaduto fa ripartire la coppia (riga cancellata); (3) attesa crescente sulla credenziale (fn_login_attesa_secondi) -> E_LOGIN_ATTESA con i secondi rimanenti. Nessuna riga in config.credenziali = passa. Credenziale NULL/<= 0 o provenienza NULL -> E_AUTH_CHIAMATA_NON_VALIDA. SECURITY DEFINER del PROPRIETARIO, non di un superuser, search_path bloccato; nessun guard di permesso, dichiarato (gira prima del login). Brief: brief-db-blocco-login-per-credenziale §2.4, §3.1.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_blocco_login(integer, inet);
