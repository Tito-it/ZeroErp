databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260418-61-create-fn-scope-ba-ownership-mctit.yaml

  - changeSet:
      id: 20260418-61-create-fn-scope-ba-ownership
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Scope policy BA_OWNERSHIP: un'identita cliente (CLIENTE_PORTALE o
        SHOP_CUSTOMER) puo vedere solo i billing_account il cui soggetto_ruolo
        coincide con il soggetto_ruolo della propria identita_digitale.
        anagrafiche.billing_account ha FK diretta a soggetti_ruoli (colonna
        soggetto_ruolo_id), quindi il matching e' un singolo join. LANGUAGE
        sql STABLE per favorire l'inlining nelle RLS future.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: anagrafiche, tableName: identita_digitali }
          - tableExists: { schemaName: anagrafiche, tableName: billing_account }
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Firma con %TYPE sui parametri:
              --   p_identita_id        = anagrafiche.identita_digitali.id
              --   p_billing_account_id = anagrafiche.billing_account.id
              CREATE OR REPLACE FUNCTION script.fn_scope_ba_ownership(
                  p_identita_id        anagrafiche.identita_digitali.id%TYPE,
                  p_billing_account_id anagrafiche.billing_account.id%TYPE
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  -- Il BA appartiene all'identita se condividono il
                  -- soggetto_ruolo (cliente). EXISTS -> short-circuit.
                  -- Defense-in-depth: id.attivo = true, coerente con le
                  -- altre fn_scope_*; un'identita inattiva non deve mai
                  -- passare il filtro scope (fail-closed).
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN anagrafiche.billing_account  ba
                          ON ba.soggetto_ruolo_id = id.soggetto_ruolo_id
                       WHERE id.id     = p_identita_id
                         AND id.attivo = true
                         AND ba.id     = p_billing_account_id
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ba_ownership(
                  anagrafiche.identita_digitali.id%TYPE,
                  anagrafiche.billing_account.id%TYPE
              ) IS
                  'Scope policy BA_OWNERSHIP: ritorna true se il billing_account '
                  'appartiene all''identita (via soggetto_ruolo comune). Usata sia '
                  'da CLIENTE_PORTALE sia da SHOP_CUSTOMER (stesso ruolo anagrafico CL). '
                  'STABLE, inlineable.';
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS script.fn_scope_ba_ownership(bigint, bigint);
