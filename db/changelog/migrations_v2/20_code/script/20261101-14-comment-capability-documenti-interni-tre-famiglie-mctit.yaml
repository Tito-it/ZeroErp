# script.fn_available_actions_documento_interno,
# script.fn_check_documento_interno_registrabile e i due involucri per entita'
# (fn_available_actions_inventario, _rettifica) — solo i COMMENT. I corpi non
# cambiano (20260928-77, 20260928-78, 20260922-22).
#
# -- PERCHE' ---------------------------------------------------------------------
#   I COMMENT dicevano ancora «p_famiglia = INVENTARIO | RETTIFICA» e «le due
#   famiglie», mentre dal 20260928-77/-78 le famiglie sono tre (TRASFERIMENTO); la
#   check nominava come chiamanti le due capability per entita' invece della
#   capability comune, e non nominava fn_posta_trasferimento. La storia delle
#   revisioni esce dal COMMENT, che descrive l'oggetto com'e' oggi.
#
#   Firme a tipi espliciti: p_famiglia e p_documento_id sono una chiave
#   POLIMORFA (tre testate diverse), non il riflesso di una colonna. Gli
#   involucri hanno la firma del loro CREATE (20260922-22).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261101-14-comment-capability-documenti-interni-tre-famiglie-mctit.yaml

  - changeSet:
      id: 20261101-14-comment-capability-documenti-interni-tre-famiglie
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Capability e check dei documenti interni: COMMENT con le tre famiglie e i chiamanti di oggi.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_available_actions_documento_interno(text, bigint) IS
                  'Capability di un documento interno di magazzino (p_famiglia = INVENTARIO | RETTIFICA | TRASFERIMENTO) per il detail API: stessa matrice e stesse chiavi i18n per le tre famiglie. Chiavi: stato_codice, available_actions[] (key conferma/riapri/annulla, target_state, label_key, requires_confirm, enabled, reason, reason_key, manuale), can_change_state, can_edit_testata, can_edit_righe, can_delete (tutti = stato DRAFT, lo stesso predicato dei guard), can_registra + _reason + _reason_key, stato_info_key. ⭐ Non contiene nessuna regola propria: le azioni vengono dalla matrice magazzino.fn_documento_interno_transizioni (quella che il guard fa rispettare) e la terna di registra dal primo motivo di script.fn_check_documento_interno_registrabile (quella che le madri del posting sollevano) — linee-guida-sql §12.1/§12.2. ⚠️ POSTED e'' nella matrice ma non e'' un''azione richiedibile (la porta la apre solo l''operazione con la GUC): esce dalle azioni ed e'' la terna can_registra. Le azioni non portano icona ne'' colore: il DB manda il SIGNIFICATO (key) e il frontend ricava segno e aspetto dal verbo con le sue mappe in core/, cosi'' lo stesso verbo appare uguale in tutti i domini; label_key e outlined restano dati. INVOKER: documento fuori perimetro o inesistente -> NULL, il 404 lo da'' il BE sulla testata. Chiavi i18n emesse: magazzino.documenti_interni.azione.{conferma,riapri,annulla}, ....registra_reason.{non_confermato,gia_registrato,annullato,senza_righe,righe_non_postabili}, ....stato_info.{posted,cancel}.';

              COMMENT ON FUNCTION script.fn_check_documento_interno_registrabile(text, bigint) IS
                  'I motivi che impediscono di REGISTRARE un documento interno di magazzino (p_famiglia = INVENTARIO | RETTIFICA | TRASFERIMENTO). Funzione PURA: torna [] se si puo'' registrare, altrimenti un array ORDINATO di {codice, reason, reason_key, dettaglio, valori}. I motivi sono i TRE rifiuti delle madri del posting, in quest''ordine (precedenza dichiarata, si esce al primo): stato diverso da CONFIRM (E_MAG_DOCUMENTO_TRANSIZIONE_NON_AMMESSA, con reason DOCUMENTO_NON_CONFERMATO | DOCUMENTO_GIA_REGISTRATO | DOCUMENTO_ANNULLATO secondo lo stato: un codice, tre tooltip), nessuna riga (E_MAG_DOCUMENTO_SENZA_RIGHE), una riga che la primitiva rifiuterebbe — li'' il `codice` e i `valori` sono quelli del PRIMO motivo di script.fn_check_riga_magazzino (la stessa funzione che magazzino.fn_scrivi_movimento chiama), mentre `reason` e `reason_key` sono del documento (RIGHE_NON_POSTABILI). Per il trasferimento lo stato e'' stato_trasferimento e le righe trasferimenti_righe, e al terzo motivo le domande per riga sono tre: nello stesso magazzino servono due ubicazioni (E_MAG_TRASFERIMENTO_STESSA_POSIZIONE), poi la partenza (magazzino di origine, ubicazione_id_da) e l''arrivo (magazzino di destinazione, ubicazione_id_a) con script.fn_check_riga_magazzino. ⭐ La chiamano le tre madri del posting (magazzino.fn_posta_inventario, fn_posta_rettifica, fn_posta_trasferimento) e la capability script.fn_available_actions_documento_interno: una sede sola, perche'' un pulsante non puo'' promettere cio'' che la madre rifiutera'' (linee-guida-sql §12.1, §12.5.2). INVOKER e STABLE: sotto RLS un documento fuori perimetro NON C''E'' e si solleva E_MAG_DOCUMENTO_NON_TROVATO, mai [] (sarebbe un fail-open).';

              COMMENT ON FUNCTION script.fn_available_actions_inventario(bigint) IS
                  'Capability di un inventario di magazzino per il detail API: involucro di script.fn_available_actions_documento_interno(''INVENTARIO'', id), dove sta la regola — una sola per le tre famiglie di documenti interni. Esiste perche'' il backend chiama la capability per entita''. NULL se l''inventario non si legge.';

              COMMENT ON FUNCTION script.fn_available_actions_rettifica(bigint) IS
                  'Capability di una rettifica di magazzino per il detail API: involucro di script.fn_available_actions_documento_interno(''RETTIFICA'', id), dove sta la regola — una sola per le tre famiglie di documenti interni. Esiste perche'' il backend chiama la capability per entita''. NULL se la rettifica non si legge.';
      rollback:
        - sql:
            sql: >
              SELECT 1; -- i COMMENT precedenti sono in 20260928-77, 20260928-78 e 20260922-22
