# I CONSUMATORI DI script.fn_stato_emissione_id
#   Brief: brief-modello-documento-vendita §8 (giro 6).
#
#   Solo il COMMENT. 20261025-40 (gia' applicato) nominava come consumatore il
#   verbo del preventivo; la regola delle righe all'emissione e' passata al
#   guard di transizione (20261025-49, -50), e il lettore lo leggono anche il
#   verbo della bolla (20261025-44) e la capability del preventivo, attraverso
#   la colonna (20261025-47). Corpo invariato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-51-update-fn-stato-emissione-id-commento-consumatori-mctit.yaml

  - changeSet:
      id: 20261025-51-update-fn-stato-emissione-id-commento-consumatori
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di script.fn_stato_emissione_id: i consumatori dopo il giro 6 (guard di
        transizione del preventivo, verbo della bolla). Brief: brief-modello-documento-vendita §8.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_stato_emissione_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_stato_emissione_id(p_testata regclass)
                IS 'BB del modello del documento: l''id dello stato di EMISSIONE di una testata, letto dal suo vocabolario degli stati (colonna emissione = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''EMESSO'' per dire «lo stato a cui si arriva solo da Emetti» (M-2). NULL se il documento non si emette (vocabolario senza la colonna: reso, commessa, fattura) o se il vocabolario non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. Gemello di script.fn_stato_iniziale_id, ma riceve la testata. Consumatori: il backend (il cambio stato generico rifiuta l''emissione), script.fn_doc_azione_passaggio, vendite.fn_cambia_stato_ddt, vendite.trgfn_preventivi_guard_transizione (le righe all''emissione). Brief: brief-modello-documento-vendita §8 (Tid 2026-10-25).';
