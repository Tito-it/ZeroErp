# C-1 — I MOTIVI DELL'INGRESSO IN PRONTA_FATTURAZIONE PORTANO I `valori`
#
# ── ⭐ PERCHE' LA CHECK DEVE EMETTERE `valori` ─────────────────────
#   Nel pattern §12.5 la check sa QUALE codice ha scelto; la frase la componeva
#   il CHIAMANTE, con un numero FISSO di valori presi dai propri dati. Le due
#   cose non erano legate da niente: un motivo nuovo con un'altra forma di
#   frase non fa fallire nulla, esce solo una frase sbagliata.
#   ⇒ Chi sceglie il codice sceglie anche cosa ci va dentro. E' la stessa
#   ragione di §12.5.2 per il predicato, applicata al messaggio.
#
# ── ⚠️ L'ORDINE DEI `valori` E' IL CONTRATTO DELLA FRASE ──────────
#   Non si verifica contando i segnaposto: si verifica LEGGENDO la frase resa.
#   Il precedente e' del 2026-09-01 su E_REGISTRO_SERIE_NON_AMMESSA — arita'
#   giusta, valori invertiti, «Registro X1» a video con la serie al posto della
#   famiglia. Nessun cancello lo vide.
#
#
# ── ⚠️ NON ERA FRA LE OTTO, e ci entra per forza ──────────────────
#   vendite.trgfn_commesse_guard_transizione sceglie fra TRE check con un CASE e
#   solleva da UN punto solo. Il rubinetto calcola il perimetro in modo
#   PESSIMISTA (`bool_or`): basta che UNA delle tre emetta `valori` perche' il
#   sito debba passare all'helper — e allora anche questa deve emetterli, o il
#   suo ramo perde la frase.
#   ⭐ Il `c.codice` viaggia sulla SELECT che c'era gia': nessuna lettura in
#   piu'. Ragione e caveat del trigger BEFORE: changeSet -05.
#
# ⛔ Nessun codice errore nuovo, nessun `reason` toccato, nessun motivo
#   riordinato: si AGGIUNGE una chiave.
# ⚠️ Questo changeSet da solo NON basta: fa entrare il suo sito nel perimetro
#   del rubinetto (test 2 di test-rubinetto-primo-motivo-v1.sql), che pretende
#   zero code scritte a mano. Va nella STESSA consegna dei changeSet C-2.
#
# ⭐ Il corpo e' quello VIVO (pg_get_functiondef), non ricostruito da uno YAML.
# Brief: brief-db-i-motivi-si-fermano-dentro-la-check.md (C-1)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260909-07-update-fn-check-commessa-pronta-fatturazione-emette-valori-mctit.yaml

  - changeSet:
      id: 20260909-07-update-fn-check-commessa-pronta-fatturazione-emette-valori
      author: mctit
      failOnError: true
      comment: >
        script.fn_check_commessa_pronta_fatturazione: i due motivi emettono `valori`. Entra nel cantiere perche' condivide il punto di sollevamento con le altre due check della commessa.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_commessa_pronta_fatturazione'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_commessa_pronta_fatturazione(p_commessa_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono a una commessa di
              --   dichiararsi PRONTA_FATTURAZIONE. Funzione PURA (fn_check_*):
              --   nessun raise di dominio, nessuna scrittura. Consumatori: il
              --   guard di transizione (che solleva il codice del primo motivo)
              --   e fn_available_actions_commessa (che espone l'azione
              --   disabled + reasons).
              --   Brief: brief-db-emittibilita-visibile-e-sbloccabile §3.3.
              -- Ritorna: [] se la commessa puo' passare; altrimenti array
              --   ordinato di {codice, reason, reason_key, dettaglio}.
              DECLARE
                v_motivi    jsonb := '[]'::jsonb;
                v_pronte    integer := 0;   -- conteggio, non specchio di colonna
                v_emittente vendite.commesse.emittente_soggetto_ruolo_id%TYPE;
                v_trovata   boolean := false;
                v_codice    vendite.commesse.codice%TYPE;
              BEGIN
                -- Guard parametro (AGENTS.md): id assente o non valido e' un
                -- errore di programmazione, non una condizione di dominio.
                IF p_commessa_id IS NULL OR p_commessa_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_commessa_pronta_fatturazione','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','commessa_id','valore',p_commessa_id),
                    NULL::uuid, 'commessa_id obbligatorio (>0)');
                END IF;

                -- ⭐ `c.codice` viaggia sulla SELECT che c'era gia': serve a COMPORRE la
                --   frase («Commessa %s: ...»), non a decidere. Vedi la nota gemella in
                --   fn_check_commessa_annullabile per il caso del trigger BEFORE.
                SELECT c.emittente_soggetto_ruolo_id, true, c.codice
                  INTO v_emittente, v_trovata, v_codice
                  FROM vendite.commesse c
                 WHERE c.id = p_commessa_id;

                -- MOTIVO 1 — nessuna riga che il motore raccoglierebbe.
                -- Le tre condizioni sono quelle di fn_list_emittibili_lane:
                -- dichiarare pronta una commessa che la lane non vedrebbe
                -- significa promettere un lavoro che non partira'.
                -- Indice: ix_commesse_attivita_commessa_stati.
                SELECT count(*)
                  INTO v_pronte
                  FROM vendite.commesse_attivita ca
                 WHERE ca.commessa_id       = p_commessa_id
                   AND ca.stato_approvazione = 'APPROVATA'
                   AND ca.stato_emissione    = 'NON_EMESSA'
                   AND ca.tipo_doc_fiscale_id IS NOT NULL;

                IF v_pronte = 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_COMMESSA_NESSUNA_RIGA_APPROVATA',
                    'reason',     'NESSUNA_RIGA_PRONTA',
                    'reason_key', 'vendite.commesse.azione_reason.nessuna_riga_pronta',
                    'dettaglio',  0,
                    'valori',     jsonb_build_array(COALESCE(v_codice, p_commessa_id::text)));
                END IF;

                -- MOTIVO 2 — emittente fiscale assente sulla testata.
                -- E' parte della chiave di raggruppamento della lane: senza,
                -- il raggruppamento non diventa nessuna fattura.
                IF v_trovata AND v_emittente IS NULL THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_COMMESSA_EMITTENTE_MANCANTE',
                    'reason',     'EMITTENTE_MANCANTE',
                    'reason_key', 'vendite.commesse.azione_reason.emittente_mancante',
                    'dettaglio',  0,
                    'valori',     jsonb_build_array(COALESCE(v_codice, p_commessa_id::text)));
                END IF;

                RETURN v_motivi;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
