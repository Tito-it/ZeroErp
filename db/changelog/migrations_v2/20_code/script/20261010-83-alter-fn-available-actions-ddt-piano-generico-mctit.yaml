# LA CAPABILITY DEL DDT SI PIANIFICA UNA VOLTA: plan_cache_mode = force_generic_plan
#   script.fn_available_actions_ddt(bigint)
#   Brief: brief-db-segment-base-commesse-attivita §6 (decisione di Tid: strada 1).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   La capability chiama vendite.fn_ddt_push_diagnosi(p_ddt_id), che e' SQL
#   e si incorpora insieme a fn_partite_merce e fn_af_merce_per_riga: una
#   query enorme, con un parametro. In modo `auto` la plancache confronta i
#   costi STIMATI: il piano generico, col parametro sconosciuto, le sembra
#   piu' caro, e lei continua a ripianificare a ogni chiamata — ~13-15 ms di
#   sola pianificazione, con piani personalizzati qui anche piu' lenti da
#   eseguire.
#   Fatti datati 2026-10-10, dbdev come app, 56 DDT, dopo 20261010-80…-82:
#     diagnosi in ciclo plpgsql: generico 0,42 s, auto 1,25 s, personalizzato 3,7 s;
#     capability:                generico 0,61 s, auto 1,42 s.
#
# ── LA CURA ─────────────────────────────────────────────────────────
#   Si dichiara sulla funzione che le sue query si pianificano una volta:
#   ALTER FUNCTION … SET plan_cache_mode = force_generic_plan. Vale per le
#   query della funzione e di quelle che chiama durante la chiamata. Le altre
#   query della capability sono letture per chiave: il generico e' giusto
#   anche per loro.
#   ⭐ ALTER, non CREATE OR REPLACE: corpo, firma e %TYPE restano quelli
#   applicati.
#
# ── ⛔ PROPRIETA' INVISIBILE NEL CORPO ───────────────────────────────
#   Come ROWS e COST: un CREATE OR REPLACE FUNCTION senza la clausola
#   `SET plan_cache_mode = force_generic_plan` la perde, senza errore e con
#   risultati identici. Chi riscrive la capability la ripete. Presidio:
#   db/pgtap/script/test-fn-available-actions-ddt-piano-generico-v1.sql.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261010-83-alter-fn-available-actions-ddt-piano-generico-mctit.yaml

  - changeSet:
      id: 20261010-83-alter-fn-available-actions-ddt-piano-generico
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        script.fn_available_actions_ddt: SET plan_cache_mode = force_generic_plan. In modo auto la
        plancache ripianificava a ogni chiamata la diagnosi incorporata (~13-15 ms di sola
        pianificazione): generico 0,61 s contro 1,42 s su 56 DDT. ALTER: corpo e %TYPE restano.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_available_actions_ddt';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- ⛔ Si perde a ogni CREATE OR REPLACE che non ripete la clausola SET:
              --    presidio in script/test-fn-available-actions-ddt-piano-generico-v1.sql.
              ALTER FUNCTION script.fn_available_actions_ddt(bigint)
                SET plan_cache_mode = force_generic_plan;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              ALTER FUNCTION script.fn_available_actions_ddt(bigint) RESET plan_cache_mode;
