# ------------------------------------------------------------
# script.fn_get_setup_status: LA VESTE CONTA SE E' UTILIZZABILE OGGI
#   Brief: brief-db-veste-utilizzabile (building block: 20261007-01)
#
#   Il banner di setup conta gli operatori: attivo + finestra ricopiati diventano
#   il building block.
#
#   Corpo vivo = pg_get_functiondef su dbdev il 2026-10-07 (uguale alla doc
#   auto-gen); sostituzioni contate. Firma, RETURNS, DECLARE e firma del
#   COMMENT ancorati a %TYPE dove c'e' una colonna dietro; dove non c'e', il
#   tipo esplicito porta il perche' accanto. I %TYPE si risolvono negli STESSI
#   tipi di oggi (provato: nessun overload), quindi i chiamanti (comprese le
#   BEGIN ATOMIC) restano validi. Il rollback e' il corpo vivo di prima, con la
#   stessa firma ancorata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-07-update-fn-get-setup-status-veste-utilizzabile-mctit.yaml

  - changeSet:
      id: 20261007-07-update-fn-get-setup-status-veste-utilizzabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_get_setup_status: un operatore conta se la sua veste e' utilizzabile oggi (script.fn_veste_utilizzabile). Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_setup_status';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_setup_status()
               RETURNS jsonb  -- oggetto composto qui: nessuna colonna dietro
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_result jsonb;  -- oggetto composto qui: nessuna colonna dietro
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Stato di setup operatore-emittente per il banner di
                  --   amministrazione (pattern advise, don't enforce).
                  --
                  -- Refactor §4.6.B.10:
                  --   Source of truth operatori = identita_digitali
                  --   (ruolo_applicativo=OPERATORE, utilizzabile oggi:
                  --   script.fn_veste_utilizzabile, rev 2026-10-07).
                  --   Admin = fn_is_super_admin anziche' ruolo_sistema='ADMIN'.
                  -- =========================================================

                  WITH sub_emittenti AS (
                      SELECT COUNT(*)::bigint AS emittenti_attivi
                        FROM anagrafiche.emittenti_fiscali
                       WHERE attivo = true
                  ),
                  sub_op AS (
                      SELECT
                          COUNT(*)::bigint AS operatori_totali,
                          COUNT(*) FILTER (WHERE uef.auth_user_id IS NOT NULL)::bigint
                              AS operatori_assegnati,
                          COUNT(*) FILTER (
                              WHERE uef.auth_user_id IS NULL
                                AND script.fn_is_super_admin(id.auth_user_id)
                          )::bigint AS operatori_admin_globali
                        FROM anagrafiche.identita_digitali id
                        JOIN django.auth_user au
                          ON au.id = id.auth_user_id
                        LEFT JOIN config.user_emittenti_fiscali uef
                          ON uef.auth_user_id = id.auth_user_id
                       WHERE id.ruolo_applicativo = 'OPERATORE'
                         AND script.fn_veste_utilizzabile(id.id)
                         AND au.is_active = true
                  )
                  SELECT jsonb_build_object(
                      'emittenti_attivi',         sub_emittenti.emittenti_attivi,
                      'operatori_totali',         sub_op.operatori_totali,
                      'operatori_assegnati',      sub_op.operatori_assegnati,
                      'operatori_admin_globali',  sub_op.operatori_admin_globali,
                      'operatori_non_assegnati',  greatest(
                          sub_op.operatori_totali - sub_op.operatori_assegnati, 0
                      )
                  )
                    INTO v_result
                    FROM sub_emittenti, sub_op;

                  RETURN v_result;
              END
              $function$
              ;

              COMMENT ON FUNCTION script.fn_get_setup_status() IS 'Stato di setup operatore-emittente in un singolo jsonb. Refactor §4.6.B.10: source of truth operatori = identita_digitali (OPERATORE attiva); admin = fn_is_super_admin. Rev 2026-10-07 (brief-db-veste-utilizzabile): un operatore conta se la sua veste e'''' utilizzabile oggi (script.fn_veste_utilizzabile), non piu'''' attivo + finestra ricopiati.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_setup_status()
               RETURNS jsonb  -- oggetto composto qui: nessuna colonna dietro
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_result jsonb;  -- oggetto composto qui: nessuna colonna dietro
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Stato di setup operatore-emittente per il banner di
                  --   amministrazione (pattern advise, don't enforce).
                  --
                  -- Refactor §4.6.B.10:
                  --   Source of truth operatori = identita_digitali
                  --   (ruolo_applicativo=OPERATORE, attivo, in finestra).
                  --   Admin = fn_is_super_admin anziche' ruolo_sistema='ADMIN'.
                  -- =========================================================

                  WITH sub_emittenti AS (
                      SELECT COUNT(*)::bigint AS emittenti_attivi
                        FROM anagrafiche.emittenti_fiscali
                       WHERE attivo = true
                  ),
                  sub_op AS (
                      SELECT
                          COUNT(*)::bigint AS operatori_totali,
                          COUNT(*) FILTER (WHERE uef.auth_user_id IS NOT NULL)::bigint
                              AS operatori_assegnati,
                          COUNT(*) FILTER (
                              WHERE uef.auth_user_id IS NULL
                                AND script.fn_is_super_admin(id.auth_user_id)
                          )::bigint AS operatori_admin_globali
                        FROM anagrafiche.identita_digitali id
                        JOIN django.auth_user au
                          ON au.id = id.auth_user_id
                        LEFT JOIN config.user_emittenti_fiscali uef
                          ON uef.auth_user_id = id.auth_user_id
                       WHERE id.ruolo_applicativo = 'OPERATORE'
                         AND id.attivo = true
                         AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                         AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                         AND au.is_active = true
                  )
                  SELECT jsonb_build_object(
                      'emittenti_attivi',         sub_emittenti.emittenti_attivi,
                      'operatori_totali',         sub_op.operatori_totali,
                      'operatori_assegnati',      sub_op.operatori_assegnati,
                      'operatori_admin_globali',  sub_op.operatori_admin_globali,
                      'operatori_non_assegnati',  greatest(
                          sub_op.operatori_totali - sub_op.operatori_assegnati, 0
                      )
                  )
                    INTO v_result
                    FROM sub_emittenti, sub_op;

                  RETURN v_result;
              END
              $function$
              ;

              COMMENT ON FUNCTION script.fn_get_setup_status() IS 'Stato di setup operatore-emittente in un singolo jsonb. Refactor §4.6.B.10: source of truth operatori = identita_digitali (OPERATORE attiva); admin = fn_is_super_admin.';
