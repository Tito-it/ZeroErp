#
# Funzione dettaglio per row expansion della ricerca universale (livello 2).
# Ritorna JSONB con tutte le righe specifiche del soggetto per il tipo ruolo.
# Ampliabile: aggiungere sezioni (contratti, saldi, PDR/POD) senza modificare il livello 1.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260310-02-create-fn-get-search-detail-mctit.yaml

  - changeSet:
      id: 20260310-02-create-fn-get-search-detail
      author: mctit
      comment: "Dettaglio soggetto per tipo ruolo (livello 2 ricerca universale). JSONB con sezioni per CLIENTE (istanza, utility, stato, indirizzo), FORNITORE (codice, attivo), generico (meta). Ampliabile."
      runOnChange: false
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION script.fn_get_search_detail(
                p_soggetto_id    anagrafiche.soggetti.id%TYPE,
                p_tipo_ruolo_id  config.tipi_ruoli.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              PARALLEL SAFE
              AS $function$
              DECLARE
                v_tipo_ruolo_codice  config.tipi_ruoli.codice_interno%TYPE;
                v_result             jsonb;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Dettaglio soggetto per tipo ruolo (livello 2 ricerca
                --   universale). Ritorna JSONB con tutte le righe
                --   specifiche del soggetto per il tipo ruolo.
                --
                --   CLIENTE: istanza, utility, indirizzo, stato_cliente.
                --   FORNITORE: codice, attivo/inattivo, stato_operativo.
                --   ALTRI: dati base soggetto_ruolo (meta, data_insert).
                --
                --   Ampliabile: aggiungere sezioni (contratti, saldi,
                --   PDR/POD) senza modificare il livello 1.
                --
                -- Parametri:
                --   p_soggetto_id:   UUID del soggetto (obbligatorio)
                --   p_tipo_ruolo_id: ID tipo ruolo (obbligatorio, > 0)
                --
                -- Restituisce:
                --   JSONB con chiavi: tipo_ruolo (codice), righe (array).
                -- =========================================================

                -- Guard: soggetto obbligatorio
                IF p_soggetto_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.fn_get_search_detail',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object(
                      'parametro', 'p_soggetto_id',
                      'valore', NULL
                    ),
                    NULL::uuid,
                    'p_soggetto_id obbligatorio'
                  );
                END IF;

                -- Guard: tipo ruolo obbligatorio e valido
                IF p_tipo_ruolo_id IS NULL OR p_tipo_ruolo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.fn_get_search_detail',
                    'E_PARAMETRO_INVALIDO',
                    jsonb_build_object(
                      'parametro', 'p_tipo_ruolo_id',
                      'valore', p_tipo_ruolo_id
                    ),
                    NULL::uuid,
                    'p_tipo_ruolo_id obbligatorio e > 0'
                  );
                END IF;

                -- Recupera codice interno del tipo ruolo
                SELECT tr.codice_interno INTO v_tipo_ruolo_codice
                FROM config.tipi_ruoli tr
                WHERE tr.id = p_tipo_ruolo_id;

                IF v_tipo_ruolo_codice IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    'script.fn_get_search_detail',
                    'E_GENERICO',
                    jsonb_build_object(
                      'detail', 'tipo_ruolo_id non trovato in config.tipi_ruoli',
                      'p_tipo_ruolo_id', p_tipo_ruolo_id
                    ),
                    NULL::uuid,
                    concat('tipo_ruolo_id=', p_tipo_ruolo_id, ' non trovato')
                  );
                END IF;

                -- Costruisci dettaglio in base al tipo ruolo
                CASE v_tipo_ruolo_codice

                WHEN 'CLIENTE' THEN
                  -- Tutte le righe cliente del soggetto con istanza, utility, indirizzo, stato
                  SELECT jsonb_build_object(
                    'tipo_ruolo', v_tipo_ruolo_codice,
                    'righe', COALESCE(jsonb_agg(row_detail ORDER BY row_detail->>'utility_codice', row_detail->>'stato_descrizione'), '[]'::jsonb)
                  ) INTO v_result
                  FROM (
                    SELECT jsonb_build_object(
                      'cliente_id',          cl.id,
                      'soggetto_ruolo_id',   cl.soggetto_ruolo_id,
                      'istanza_codice',      iu.codice,
                      'istanza_id',          iu.id,
                      'utility_id',          u.id,
                      'utility_codice',      u.codice_interno,
                      'stato_cliente_id',    sc.id,
                      'stato_codice',        sc.codice_interno,
                      'stato_descrizione',   sc.descrizione_breve,
                      'stato_macro',         sc.codice,
                      'indirizzo',           COALESCE(idv.indirizzo_normalizzato, ''),
                      'comune',              COALESCE(idv.descrizione_comune, ''),
                      'data_attivazione',    cl.data_attivazione,
                      'data_chiusura',       cl.data_chiusura
                    ) AS row_detail
                    FROM anagrafiche.soggetti_ruoli sr
                      JOIN anagrafiche.clienti cl
                        ON cl.soggetto_ruolo_id = sr.id
                      JOIN config.stati_cliente sc
                        ON sc.id = cl.stato_cliente_id
                      LEFT JOIN anagrafiche.istanze_utilities iu
                        ON iu.id = cl.istanza_utility_id
                      LEFT JOIN config.utilities u
                        ON u.id = cl.utility_id
                      LEFT JOIN anagrafiche.vw_indirizzi_dettaglio idv
                        ON idv.indirizzo_dettaglio_id = iu.indirizzo_dettaglio_id
                    WHERE sr.soggetto_id = p_soggetto_id
                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                  ) sub;

                WHEN 'FORNITORE' THEN
                  -- Righe fornitore del soggetto
                  SELECT jsonb_build_object(
                    'tipo_ruolo', v_tipo_ruolo_codice,
                    'righe', COALESCE(jsonb_agg(row_detail), '[]'::jsonb)
                  ) INTO v_result
                  FROM (
                    SELECT jsonb_build_object(
                      'fornitore_id',        f.id,
                      'soggetto_ruolo_id',   f.soggetto_ruolo_id,
                      'codice',              f.codice,
                      'attivo',              f.attivo,
                      'stato_operativo',     COALESCE(f.stato_operativo, ''),
                      'stato_descrizione',   CASE WHEN f.attivo THEN 'ATTIVO' ELSE 'INATTIVO' END
                    ) AS row_detail
                    FROM anagrafiche.soggetti_ruoli sr
                      JOIN anagrafiche.fornitori f
                        ON f.soggetto_ruolo_id = sr.id
                    WHERE sr.soggetto_id = p_soggetto_id
                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                  ) sub;

                ELSE
                  -- Dettaglio generico per qualsiasi altro tipo ruolo
                  SELECT jsonb_build_object(
                    'tipo_ruolo', v_tipo_ruolo_codice,
                    'righe', COALESCE(jsonb_agg(row_detail), '[]'::jsonb)
                  ) INTO v_result
                  FROM (
                    SELECT jsonb_build_object(
                      'soggetto_ruolo_id',  sr.id,
                      'soggetto_id',        sr.soggetto_id,
                      'meta',               COALESCE(sr.meta, '{}'::jsonb),
                      'data_insert',        sr.data_insert
                    ) AS row_detail
                    FROM anagrafiche.soggetti_ruoli sr
                    WHERE sr.soggetto_id = p_soggetto_id
                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                  ) sub;

                END CASE;

                RETURN COALESCE(v_result, jsonb_build_object('tipo_ruolo', v_tipo_ruolo_codice, 'righe', '[]'::jsonb));
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_search_detail(uuid, integer)
                IS 'Dettaglio soggetto per tipo ruolo (livello 2 ricerca universale). Ritorna JSONB con sezione per tipo ruolo e tutte le righe specifiche. CLIENTE: istanza, utility, indirizzo, stato_cliente. FORNITORE: codice, attivo/inattivo, stato_operativo. ALTRI: dati base soggetto_ruolo (meta, data_insert). Ampliabile.';
