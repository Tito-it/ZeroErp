# ------------------------------------------------------------
# LO STATO DEL CLIENTE NON E' DELL'ISTANZA: SI RITIRANO VISTA E FUNZIONE
#   DROP script.view_clienti_istanza_states
#   DROP script.fn_get_stato_cliente_by_istanza(bigint)
#   Brief: brief-db-istanza-nasce-col-ba (R-8, D-8 di Tid del 2026-10-08)
#
# -- PERCHE' --------------------------------------------------------
#   «Lo stato del cliente dell'istanza» con ORDER BY id DESC LIMIT 1: con un
#   cliente per BA e piu' BA per istanza (D-5/D-6) la domanda non ha una
#   risposta. Nessun consumatore applicativo (censimento del 2026-10-08:
#   backend, frontend, funzioni e viste DB, pgTAP — solo la documentazione).
#   Lo stato e' del cliente, cioe' del BA: si legge da anagrafiche.clienti.
#   La vista si cancella prima della funzione da cui dipende.
#   Le pagine manual/ si cancellano nello stesso giro.
#
# Ritorno indietro: funzione e vista come erano (i GRANT li rimette il loop
# di ci_apply).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261008-72-drop-view-clienti-istanza-states-mctit.yaml

  - changeSet:
      id: 20261008-72-drop-view-clienti-istanza-states
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Ritirate script.view_clienti_istanza_states e script.fn_get_stato_cliente_by_istanza: lo
        stato del cliente e' del BA, non dell'istanza (D-8). Brief: brief-db-istanza-nasce-col-ba
        (R-8).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP VIEW script.view_clienti_istanza_states;
              DROP FUNCTION script.fn_get_stato_cliente_by_istanza(bigint);
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_stato_cliente_by_istanza(p_istanza_id bigint)
               RETURNS integer
               LANGUAGE plpgsql
               STABLE
              AS $function$
              BEGIN
              -- 1. Funzione di recupero stato_cliente per un'istanza
              --
              -- rev 2026-08-04 (bonifica riferimenti morti, F6): la SELECT era nuda —
              --   senza INTO e senza RETURN. In plpgsql una query senza destinazione e'
              --   un errore (42601), e anche superandolo la funzione sarebbe uscita
              --   senza valore (2F005). Non ha mai potuto restituire niente.
              RETURN COALESCE(
                  (SELECT c.stato_cliente_id
                  FROM anagrafiche.clienti c
                  WHERE c.istanza_utility_id = p_istanza_id 
                  ORDER BY c.id DESC
                  LIMIT 1),
                  (SELECT id
                  FROM config.stati_cliente
                  WHERE codice_interno = 'IS'
                  LIMIT 1)
              );
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_stato_cliente_by_istanza(bigint)
              IS ' Restituisce lo stato di un cliente in base alla istanza. ';

              CREATE VIEW script.view_clienti_istanza_states AS
               SELECT i.id AS istanza_id,
                  sc.id AS stato_id,
                  sc.codice_interno AS cod_int_stato_cliente,
                  sc.descrizione AS desc_stato_cliente,
                  sc.descrizione_breve AS desc_breve_stato,
                  sc.check_lettura,
                  sc.abilita_fattura,
                  sc.codice AS stato_cliente,
                  sc.stato_cliente_ia,
                  sc.data_insert AS stato_data_insert,
                  sc.user_insert AS stato_user_insert,
                  sc.data_update AS stato_data_update,
                  sc.user_update AS stato_user_update
                 FROM anagrafiche.istanze_utilities i
                   JOIN config.stati_cliente sc ON sc.id = script.fn_get_stato_cliente_by_istanza(i.id);

              COMMENT ON VIEW script.view_clienti_istanza_states
              IS 'Stato cliente corrente per istanza utility, risolto tramite fn_get_stato_cliente_by_istanza.';
