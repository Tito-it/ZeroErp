# IL GEMELLO E I CONSUMATORI NUOVI DEI LETTORI DELLO STATO
#   Brief: brief-modello-documento-vendita §8.11 (V-1 di Tid, 2026-10-25).
#
#   Solo i COMMENT. script.fn_doc_stato_id (20261025-39) ha ora il gemello
#   inverso script.fn_doc_stato_codice (20261025-70); script.fn_stato_emissione_id
#   (ultimo COMMENT in 20261025-51) lo legge anche «Emetti» del backend,
#   composto col gemello. Corpi invariati.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-71-update-fn-doc-stato-id-emissione-commento-gemello-mctit.yaml

  - changeSet:
      id: 20261025-71-update-fn-doc-stato-id-emissione-commento-gemello
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di script.fn_doc_stato_id e script.fn_stato_emissione_id: il gemello inverso
        script.fn_doc_stato_codice e «Emetti» del backend fra i consumatori. Brief:
        brief-modello-documento-vendita §8.11.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "3"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname IN ('fn_doc_stato_id', 'fn_stato_emissione_id', 'fn_doc_stato_codice');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_doc_stato_id(p_testata regclass, p_codice text)
                IS 'BB del modello del documento: l''id dello stato ATTIVO con quel codice_interno (la chiave stabile del vocabolario) nel vocabolario degli stati di una testata, letto dalla mappa script.fn_doc_stato_modello. NULL se nessuno stato attivo ha quel codice: uno stato spento non e'' una destinazione (U-3), e l''errore lo decide il chiamante. Testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. Sede unica della traduzione codice -> id: la leggono i verbi di stato (vendite.fn_cambia_stato_preventivo, vendite.fn_cambia_stato_ddt), la domanda intera script.fn_doc_azione_passaggio, la fixture dbops.fn_pgtap_porta_a_stato e il backend. Gemello inverso (id -> codice): script.fn_doc_stato_codice. Brief: brief-modello-documento-vendita §8 e §8.11 (Tid 2026-10-25).';

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_stato_emissione_id(p_testata regclass)
                IS 'BB del modello del documento: l''id dello stato di EMISSIONE di una testata, letto dal suo vocabolario degli stati (colonna emissione = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''EMESSO'' per dire «lo stato a cui si arriva solo da Emetti» (M-2). NULL se il documento non si emette (vocabolario senza la colonna: reso, commessa, fattura) o se il vocabolario non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. Gemello di script.fn_stato_iniziale_id, ma riceve la testata. Consumatori: il backend (il cambio stato generico rifiuta l''emissione; «Emetti» ne legge il codice con script.fn_doc_stato_codice), script.fn_doc_azione_passaggio, vendite.fn_cambia_stato_ddt, vendite.trgfn_preventivi_guard_transizione (le righe all''emissione). Brief: brief-modello-documento-vendita §8 e §8.11 (Tid 2026-10-25).';
