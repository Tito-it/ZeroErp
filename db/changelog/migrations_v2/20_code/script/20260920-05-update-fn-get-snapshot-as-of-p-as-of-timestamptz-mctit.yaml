# V-3 (4 di 6) — script.fn_get_snapshot_as_of: `p_as_of` da `timestamp` a
#   `timestamptz`. Documento: valutazione-modello-di-dominio-db, voce V-3.
#
# -- IL FATTO -------------------------------------------------------------------
#   La funzione confronta `p_as_of` con `valid_from`/`valid_to` delle shadow,
#   che sono timestamptz (le crea cosi' fn_ensure_storico_table). Il parametro
#   era senza fuso e il corpo lo convertiva con `p_as_of::timestamptz`, cioe'
#   col TimeZone della SESSIONE che chiama: la stessa domanda, fatta dal
#   backend (UTC) e da psql (Europe/Rome), leggeva due istanti diversi a
#   distanza di un'ora o due. Con il parametro timestamptz l'istante arriva
#   gia' assoluto e il cast sparisce; un chiamante che passa ancora un
#   `timestamp` entra col cast implicito di PostgreSQL, che e' lo stesso di
#   prima — non peggiora nessuno, e chi passa un istante vero smette di
#   dipendere dalla sessione.
#
# -- DROP + CREATE, E PERCHE' ---------------------------------------------------
#   Cambia il tipo di un parametro, cioe' l'IDENTITA' della funzione:
#   CREATE OR REPLACE ne farebbe nascere una seconda accanto alla vecchia, e
#   una chiamata con now() (timestamptz) resterebbe ambigua o sceglierebbe
#   quella sbagliata. Si lascia la firma vecchia con DROP IF EXISTS e si crea
#   la nuova. Nessuna funzione, vista o trigger la chiama (pg_proc / pg_depend,
#   20-09); il solo chiamante e' il pgTAP
#   config/test-stradario-riclassificazione-unico (test 7), aggiornato nello
#   stesso giro: passa `ts_pre` (now(), timestamptz) senza piu' il cast.
#   Il privilegio EXECUTE a zeroerp_app e zeroerp_batch_fatturazione torna
#   dai DEFAULT PRIVILEGES dello schema script (pg_default_acl, 20-09): non
#   serve un GRANT.
#
# -- CHE COSA NON CAMBIA -------------------------------------------------------
#   Il corpo e' quello vivo (docs/it/dbzero/script/funzioni/fn_get_snapshot_as_of.md)
#   meno la riga di conversione e la variabile che la reggeva. Stessi
#   errori, stesso fallback sulla riga corrente, stesso COMMENT.
#
# -- ⚠️ PERCHE' QUI NON C'E' %TYPE, NE' IN FIRMA NE' IN DECLARE -----------------
#   La regola del progetto e' «%TYPE in firma, RETURNS e DECLARE dove ESISTE
#   una colonna di cui il valore e' il riflesso». Questa funzione e' generica
#   per costruzione: p_schema/p_table/p_fk_col sono NOMI di catalogo,
#   p_id e' la PK di una tabella qualsiasi passata come testo, p_as_of si
#   confronta con `valid_from` di TUTTE le shadow (117 tabelle, una famiglia,
#   non una colonna), v_snapshot e' `snapshot` della shadow scelta a runtime.
#   Ancorare a una shadow «rappresentativa» direbbe una provenienza falsa:
#   i tipi restano nudi, e sono quelli che il generatore
#   (fn_ensure_storico_table) scrive per ogni shadow.
#
# -- I FRATELLI DELLO STESSO GIRO ----------------------------------------------
#   -02 ui, -03 storico, -04 config.parameters, -06 fn_get_record_id_as_of
#   (gemella), -07 ritiro di fn_get_iva_override.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260920-05-update-fn-get-snapshot-as-of-p-as-of-timestamptz-mctit.yaml

  - changeSet:
      id: 20260920-05-update-fn-get-snapshot-as-of-p-as-of-timestamptz
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_snapshot_as_of: p_as_of da timestamp a timestamptz. Confronta con
        valid_from/valid_to timestamptz delle shadow, e il cast ::timestamptz nel corpo
        leggeva il TimeZone della sessione chiamante (UTC dal backend, Europe/Rome da
        psql). DROP della firma vecchia + CREATE: cambia l'identita'. Corpo invariato.
        Documento: valutazione-modello-di-dominio-db, voce V-3 (4 di 6).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_snapshot_as_of(text, text, text, text, timestamp without time zone);

              CREATE OR REPLACE FUNCTION script.fn_get_snapshot_as_of(
                  p_schema text,
                  p_table  text,
                  p_id     text,
                  p_fk_col text,
                  p_as_of  timestamptz
              )
               RETURNS jsonb
               LANGUAGE plpgsql
              AS $function$
               DECLARE
                 v_snapshot    JSONB;
                 v_pk_type     TEXT;
                 v_id_col      TEXT := 'id';                   -- colonna PK originaria
                 v_hist_schema TEXT := 'storico';
                 v_hist_table  TEXT := p_table;
                 v_full_table  TEXT := format('%I.%I', v_hist_schema, v_hist_table);
               BEGIN
                 -- -----------------------------------------------------
                 -- Input
                 -- p_schema: schema della tabella originaria
                 -- p_table: nome della tabella originaria (e storica)
                 -- p_id: PK del record originario, passato come TEXT
                 -- p_fk_col: nome della colonna FK in storico (es. 'soggetto_id')
                 -- p_as_of: istante di validita' desiderato (timestamptz, rev 20260920-05:
                 --          prima era timestamp e il corpo lo castava col fuso di sessione)
                 -- Output
                 -- v_snapshot: JSONB del record al momento p_as_of
                 -- Se non esiste, restituisce NULL
                 -- Se non trova il record, solleva un'eccezione
                 -- Altrimenti viene restituito il JSONB del record o dalla tabella originaria
                 -- o dalla tabella storica, se esiste.
                 -- -----------------------------------------------------

                 -- Verifica che esista la tabella di storico
                  SELECT format_type(a.atttypid, a.atttypmod)
                   INTO v_pk_type
                   FROM pg_attribute a
                   JOIN pg_class c ON a.attrelid = c.oid
                   JOIN pg_namespace n ON c.relnamespace = n.oid
                   WHERE n.nspname = v_hist_schema
                     AND c.relname = v_hist_table
                     AND a.attname = p_fk_col
                     AND a.attnum > 0
                     AND NOT a.attisdropped;

                   -- se la tabella non esiste o non trovo colonne → sollevo errore
                 IF v_pk_type IS NULL THEN
                   PERFORM script.fn_log_and_raise_error(
                     'database',
                     'fn_get_snapshot_as_of',
                     'E_QUERY_FAILED_SCHEMA_TABLE',
                     jsonb_build_object('table', v_full_table),
                     NULL::uuid,
                     p_schema, p_table
                   );
                 END IF;


                 -------------------------------
                 -- 1) Prova a leggere dallo storico
                 -------------------------------
                 BEGIN
                   EXECUTE format(
                     'SELECT snapshot
                       FROM  %I.%I
                       WHERE %I = $1::%s
                         AND valid_from <= $2
                         AND (valid_to > $2 OR valid_to IS NULL)
                       ORDER BY valid_from DESC
                       LIMIT 1',
                    v_hist_schema, v_hist_table, p_fk_col, v_pk_type
                   )
                   INTO v_snapshot
                   USING p_id, p_as_of;
                 EXCEPTION WHEN OTHERS THEN
                   PERFORM script.fn_log_and_raise_error(
                     'database',
                     'fn_get_snapshot_as_of',
                     'E_QUERY_FAILED',
                     jsonb_build_object(
                       'table',       v_full_table,
                       'fk_column',   p_fk_col,
                       'id',          p_id,
                       'as_of',       p_as_of,
                       'error',       SQLERRM,
                       'SQLSTATE', SQLSTATE
                     ),
                     NULL::uuid,
                      p_schema, p_table, SQLSTATE
                   );
                 END;

                 IF v_snapshot IS NOT NULL THEN
                   RETURN v_snapshot;
                 END IF;

                 -------------------------------
                 -- 2) Fallback: serializzo la riga corrente
                 -------------------------------
                 BEGIN
                   EXECUTE format(
                     'SELECT to_jsonb(t) - %L
                       FROM %I.%I AS t
                       WHERE %I = $1::%s',
                     v_id_col,
                     p_schema, p_table,
                     v_id_col,
                     v_pk_type            -- tipo dinamico
                   )
                   INTO v_snapshot
                   USING p_id;
                 EXCEPTION WHEN OTHERS THEN
                   PERFORM script.fn_log_and_raise_error(
                     'database',
                     'fn_get_snapshot_as_of',
                     'E_QUERY_FAILED',
                     jsonb_build_object(
                       'schema',     p_schema,
                       'table',      p_table,
                       'id_column',  v_id_col,
                       'id',         p_id,
                       'error',      SQLERRM,
                       'SQLSTATE', SQLSTATE
                     ),
                     NULL::uuid,
                     p_schema, p_table, SQLSTATE
                   );
                 END;

                 RETURN v_snapshot;
               END;
               $function$;

              COMMENT ON FUNCTION script.fn_get_snapshot_as_of(text, text, text, text, timestamptz)
              IS 'Restituisce il JSONB di un record al momento p_as_of: 1) dallo storico se esiste,
                  2) altrimenti serializza la riga corrente. In caso di errore nelle query, chiama
                  fn_log_and_raise_error con dettagli contestuali. ⭐ rev 2026-09-20 (20260920-05):
                  p_as_of e'' timestamptz — prima era timestamp e il corpo lo castava col TimeZone
                  della sessione chiamante, cosi'' la stessa domanda fatta dal backend (UTC) e da
                  psql (Europe/Rome) leggeva due istanti diversi. Documento
                  valutazione-modello-di-dominio-db, V-3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_snapshot_as_of(text, text, text, text, timestamptz);
              -- La firma precedente si ricrea dal corpo vivo di
              -- docs/it/dbzero/script/funzioni/fn_get_snapshot_as_of.md (rev pre 20260920-05).
