# script.fn_snapshot_indirizzo(p_indirizzo_id): compone lo snapshot
# JSONB canonico di un indirizzo anagrafico (D-5). UNICA fonte dello
# shape server-side: la usa l'endpoint BE upsert (flusso picker); i push
# NON la usano (copiano lo snapshot 1:1 gia' congelato).
#
# Shape (Q1): etichette umane del manuale + 'display'; parte geografica
# e display dal resolver anagrafiche.vw_indirizzi_resolved_ruolo;
# 'intestazione' = ragione_sociale_completa del soggetto. I campi di
# contatto (email/telefono/note) NON sono prodotti qui: li aggiunge il BE
# / il form una-tantum (D-4).
#
# Ritorna anche origine_soggetto_ruolo_id (Q2) cosi' l'endpoint valorizza
# origine_* senza una seconda query.
#
# STABLE: lettura pura. Errore E_INDIRIZZO_SNAPSHOT_NOT_FOUND su id
# inesistente/non risolvibile.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260711-24-create-fn-snapshot-indirizzo-mctit.yaml

  - changeSet:
      id: 20260711-24-create-fn-snapshot-indirizzo
      author: mctit
      # ⚠️ Era `true`: definisce script.fn_snapshot_indirizzo, che un changeSet PIU' RECENTE
      #   ridefinisce. Rigirando riportava indietro quella revisione. Non rimetterlo a true (2026-08-06).
      runOnChange: false
      validCheckSums:
        - ANY
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_snapshot_indirizzo(bigint);

              CREATE OR REPLACE FUNCTION script.fn_snapshot_indirizzo(
                  p_indirizzo_id bigint
              )
              RETURNS TABLE (
                  snapshot                   jsonb,
                  origine_soggetto_ruolo_id  bigint
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_r        record;
                  v_via      text;
              BEGIN
                  -- Guard input (ID: errore se NULL o <= 0).
                  IF p_indirizzo_id IS NULL OR p_indirizzo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_snapshot_indirizzo', 'E_VALIDAZIONE',
                          jsonb_build_object('p_indirizzo_id', p_indirizzo_id),
                          NULL::uuid, 'p_indirizzo_id deve essere > 0');
                  END IF;

                  -- Risoluzione dell'indirizzo di ruolo + intestazione soggetto.
                  SELECT r.soggetto_ruolo_id,
                         r.soggetto_id,
                         r.is_normalizzato,
                         r.via_norm,
                         r.civico,
                         r.cap,
                         r.comune_descrizione,
                         r.provincia_sigla,
                         r.stato_iso2,
                         r.indirizzo_display,
                         r.indirizzo_libero,
                         s.ragione_sociale_completa
                    INTO v_r
                    FROM anagrafiche.vw_indirizzi_resolved_ruolo r
                    LEFT JOIN anagrafiche.soggetti s ON s.id = r.soggetto_id
                   WHERE r.indirizzo_id = p_indirizzo_id;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_snapshot_indirizzo',
                          'E_INDIRIZZO_SNAPSHOT_NOT_FOUND',
                          jsonb_build_object('indirizzo_id', p_indirizzo_id),
                          NULL::uuid, p_indirizzo_id::text);
                  END IF;

                  -- Componente "via": normalizzato -> via_norm + civico;
                  -- libero -> indirizzo_libero.
                  v_via := CASE
                             WHEN v_r.is_normalizzato
                               THEN NULLIF(trim(both ' ' FROM
                                      COALESCE(v_r.via_norm::text, '') || ' ' ||
                                      COALESCE(v_r.civico::text, '')), '')
                             ELSE v_r.indirizzo_libero
                           END;

                  -- Shape canonico (Q1): etichette umane + display.
                  -- jsonb_strip_nulls: le chiavi nulle non compaiono.
                  snapshot := jsonb_strip_nulls(jsonb_build_object(
                      'intestazione', v_r.ragione_sociale_completa,
                      'via',          v_via,
                      'cap',          v_r.cap,
                      'citta',        v_r.comune_descrizione,
                      'prov',         v_r.provincia_sigla,
                      'stato',        v_r.stato_iso2,
                      'display',      v_r.indirizzo_display
                  ));

                  origine_soggetto_ruolo_id := v_r.soggetto_ruolo_id;

                  RETURN NEXT;
              END;
              $function$;
