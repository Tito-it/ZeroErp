# R2 — fn_check_azione_processo: IL TETTO D'AREA, DALLA SEDE COMUNE
#   Brief: brief-db-permessi-tetto-area, sezioni 1, 3 (D-1, D-2, D-4) e 4 (R2, R3)
#
#   Fino a ieri la catena (gate, identita', super admin, override, profilo, negata) era
#   scritta qui e, una seconda volta, in fn_get_user_actions_map; l'area non era
#   consultata: area Vendite BLOCCATO + override che abilita genera_fatture_lotti => l'azione
#   si eseguiva. Ora la catena — col tetto — sta in script.fn_get_permessi_effettivi_azioni
#   (-53) e qui si LEGGE: una riga, anche per un codename fuori catalogo (negata, e per il
#   super admin abilitata: come prima).
#   ⚠️ Cambio di semantica voluto (D-1, D-2): un'azione abilitata dall'override O dal profilo
#   sotto un'area piu' restrittiva del suo livello_minimo_area e' negata. Lo eredita
#   script.fn_guard_azione (la chiama), quindi i verbi di scrittura, senza modifiche (R7).
#   ⚠️ Codename NULL -> false anche per il super admin (prima true): una chiamata rotta,
#   fn_guard_azione la ferma comunque prima (E_CONFIG_MANCANTE).
#   Firma invariata (identita' integer, character varying), CREATE OR REPLACE. RETURNS
#   ancorato: la risposta e' il riflesso di user_override_azioni.abilitata (boolean).
#   Rollback: il corpo vivo (20260925-84) dalla doc auto-gen.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-55-update-fn-check-azione-processo-tetto-area-mctit.yaml

  - changeSet:
      id: 20261004-55-update-fn-check-azione-processo-tetto-area
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_azione_processo: IL TETTO D'AREA, DALLA SEDE COMUNE. Brief: brief-db-
        permessi-tetto-area.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname IN ('fn_get_permessi_effettivi_azioni');
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_azione_processo(
                  p_auth_user_id         anagrafiche.identita_digitali.auth_user_id%TYPE,
                  p_permission_codename  config.azioni_processo.permission_codename%TYPE
              )
              RETURNS config.user_override_azioni.abilitata%TYPE
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              DECLARE
                  v_abilitata config.user_override_azioni.abilitata%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica azione di processo abilitata per l'utente.
                  --
                  -- Catena (rev 20261004-55, brief-db-permessi-tetto-area):
                  --   la legge da script.fn_get_permessi_effettivi_azioni, sede
                  --   unica: gate di contesto, identita' OPERATORE attiva, super
                  --   admin (prima del tetto), override -> profilo -> negata, poi
                  --   il TETTO D'AREA: l'area dell'azione deve arrivare al suo
                  --   livello_minimo_area (script.fn_area_consente_azione).
                  -- =========================================================

                  -- Un codename NULL non e' un'azione: negata. Senza questa riga la
                  -- sede comune lo leggerebbe come «tutto il catalogo».
                  IF p_permission_codename IS NULL THEN
                      RETURN false;
                  END IF;

                  -- Una riga sempre, anche per un codename fuori catalogo (negata).
                  SELECT e.abilitata
                    INTO v_abilitata
                    FROM script.fn_get_permessi_effettivi_azioni(
                             p_auth_user_id, p_permission_codename) e;

                  RETURN COALESCE(v_abilitata, false);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_check_azione_processo(anagrafiche.identita_digitali.auth_user_id%TYPE, config.azioni_processo.permission_codename%TYPE) IS
                  'Verifica se un''azione di processo e'' abilitata per un utente. Legge la catena da script.fn_get_permessi_effettivi_azioni (sede unica, con fn_get_user_actions_map e il pannello permessi): gate di contesto (app.ruolo_applicativo valorizzata e diversa da OPERATORE -> false), identita'' OPERATORE attiva, super admin -> true (prima del tetto), override utente valido, ereditato dal profilo, default negata; poi il TETTO D''AREA: l''azione vale solo se il livello dell''area dell''azione arriva al suo livello_minimo_area (script.fn_area_consente_azione). Codename NULL -> false. Rev 20261004-55 (brief-db-permessi-tetto-area R2): l''area e'' un tetto, anche sul profilo (D-2).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_azione_processo(p_auth_user_id integer, p_permission_codename character varying)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_abilitata   config.user_override_azioni.abilitata%TYPE;
                  v_ctx_ruolo   anagrafiche.identita_digitali.ruolo_applicativo%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica azione di processo abilitata per l'utente.
                  --
                  -- Catena (context-aware dal 21-04-2026):
                  --   0. Gate GUC: se app.ruolo_applicativo popolata e
                  --      != OPERATORE -> false (fail-closed).
                  --   1. Assenza identita OPERATORE attiva -> false
                  --   2. fn_is_super_admin -> true
                  --   3. Override utente azione (se valido)
                  --   4. Ereditato dal profilo: fn_get_permessi_ereditati_azioni
                  --      (sola veste OPERATORE; AD_HOC 1 > REPARTO 2 > PORTALE 3)
                  --   5. Default -> false (negata)
                  -- Rev 20260925-84: il passo 4 non riscrive lo spareggio, lo
                  -- legge dal building block (sede unica, D-2) — e con esso la
                  -- veste OPERATORE (D-1).
                  -- =========================================================

                  -- 0. Gate contesto GUC (fail-closed su non-OPERATORE).
                  v_ctx_ruolo := NULLIF(
                      current_setting('app.ruolo_applicativo', true), ''
                  )::config.ruolo_applicativo;

                  IF v_ctx_ruolo IS NOT NULL
                     AND v_ctx_ruolo <> 'OPERATORE'::config.ruolo_applicativo THEN
                      RETURN false;
                  END IF;

                  -- 1. Identita OPERATORE attiva.
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN false;
                  END IF;

                  -- 2. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN true;
                  END IF;

                  -- 3. Override utente azione (invariato).
                  SELECT uoa.abilitata
                    INTO v_abilitata
                    FROM config.user_override_azioni uoa
                    JOIN config.azioni_processo ap ON ap.id = uoa.azione_id
                   WHERE uoa.auth_user_id = p_auth_user_id
                     AND ap.permission_codename = p_permission_codename
                     AND (uoa.valido_dal IS NULL OR uoa.valido_dal <= CURRENT_DATE)
                     AND (uoa.valido_al  IS NULL OR uoa.valido_al  >= CURRENT_DATE);

                  IF FOUND THEN
                      RETURN v_abilitata;
                  END IF;

                  -- 4. Ereditato dal profilo: una riga al massimo per azione
                  --    (DISTINCT ON nel building block, permission_codename unico).
                  SELECT e.abilitata
                    INTO v_abilitata
                    FROM script.fn_get_permessi_ereditati_azioni(p_auth_user_id) e
                    JOIN config.azioni_processo ap
                      ON ap.id = e.azione_id
                   WHERE ap.permission_codename = p_permission_codename;

                  IF FOUND THEN
                      RETURN v_abilitata;
                  END IF;

                  -- 5. Default sicuro.
                  RETURN false;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_check_azione_processo(p_auth_user_id integer, p_permission_codename character varying)
              IS 'Verifica se un''azione di processo e'' abilitata per un utente. Catena: gate di contesto (app.ruolo_applicativo valorizzata e diversa da OPERATORE -> false), identita'' OPERATORE attiva, super admin -> true, override utente valido, ereditato dal profilo (script.fn_get_permessi_ereditati_azioni: sola veste OPERATORE, AD_HOC > REPARTO > PORTALE), default negata. Rev 20260925-84 (brief-db-pgtap-permessi-ereditati, D-1 e D-2): il passo 4 non riscrive lo spareggio e non conta piu'' i profili delle altre vesti dell''utente.';
