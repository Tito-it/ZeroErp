# script.fn_get_search_detail: DICE «NON C'E'», E IL PERIMETRO LO FA LA RLS
#   Brief: brief-db-codici-non-trovato-email-e-permessi §5 (R-4, E-10)
#
# ── IL DIFETTO ───────────────────────────────────────────────────
#   La funzione non restituiva mai NULL: i rami CL e FO aggregano con
#   jsonb_agg senza GROUP BY (sempre una riga, anche da zero righe), e la
#   COALESCE finale trasformava in lista vuota il NULL del ramo ELSE. Quindi
#   {"righe": []} copriva quattro situazioni diverse:
#     1. il soggetto non esiste;
#     2. il soggetto esiste ma non ha quel ruolo;
#     3. (solo CL) il ruolo c'e', ma nessuno dei suoi clienti e' nel
#        perimetro di chi guarda;
#     4. ci sono righe visibili, ma il filtro p_utility_id non ne trova.
#   Il backend traduce gia' NULL in 404 E_SEARCH_NOT_FOUND, e non lo vedeva
#   mai.
#
# ── LA DECISIONE (Tid, 2026-10-08) ───────────────────────────────
#   1, 2 e 3 sono «non trovato»: una persona chiede una cosa che per lei non
#   c'e'. Il 4 e' un risultato vero: la cosa c'e', e il filtro restringe a
#   zero.
#
# ── COSA CAMBIA ──────────────────────────────────────────────────
#   (a) Il perimetro dei clienti lo fa la RLS di anagrafiche.clienti, come nel
#       resto del progetto. Cade il filtro a mano del ramo CL
#       (fn_get_emittenti_scope_sr_effettivo + fn_check_ba_visible_for_emittenti,
#       rev 2026-08-18, quando clienti non aveva RLS): era una seconda copia
#       della regola della policy rls_clienti_ef_whitelist. La funzione e'
#       INVOKER, quindi la RLS valeva gia' dentro di lei.
#   (b) Prima del CASE, la verifica d'esistenza con
#       script.fn_check_soggetto_ruolo_visibile (-01): stesso perimetro delle
#       righe, SENZA il filtro utility. Se nessun soggetto-ruolo risulta,
#       RETURN NULL. La COALESCE finale cade: arrivati in fondo, il soggetto
#       c'e'.
#   ⭐ NULL e non un raise: il backend traduce gia' NULL in 404 col codice
#     giusto, e una lettura non scrive nel diario errori a ogni id sbagliato.
#   ⚠️ Inesistente e fuori perimetro escono uguali, di proposito: il 404 non
#     rivela che esiste un cliente di un altro emittente.
#
# ── LA VERIFICA CHIESTA DAL BRIEF: la RLS da' lo stesso perimetro? ─────
#   Letta sul corpo delle funzioni, non su un conteggio.
#   * OPERATORE (whitelist, super admin, emittente attivo): stesso perimetro.
#     Il filtro a mano era fn_check_ba_visible_for_emittenti(ba,
#     fn_get_emittenti_scope_sr_ids(utente) ∩ p_emittente_ids); la policy e'
#     fn_scope_ef_whitelist_via_efba(utente, ba), che e' la stessa
#     fn_check_ba_visible_for_emittenti sullo stesso fn_get_emittenti_scope_sr_ids
#     (NULL -> tutto, '{}' -> niente). L'emittente attivo restringe dentro
#     fn_get_emittenti_scope_pk_ids, per tutte e due. E il backend passava come
#     p_emittente_ids proprio fn_get_emittenti_scope_sr_ids(utente)
#     (PermissionResolver.get_emittenti_sr_ids): l'intersezione non toglieva
#     niente.
#   * Sessione senza utente con veste OPERATORE: niente in tutti e due i casi.
#   * Differenze, entrambe dalla parte del modello:
#     - CLIENTE_PORTALE e SHOP_CUSTOMER: il filtro a mano dava niente (nessuna
#       identita' OPERATORE -> '{}'), la RLS da' i clienti del proprio billing
#       account. L'endpoint della ricerca e' dell'operatore, quindi oggi non
#       si vede;
#     - proprietario e BYPASSRLS: il filtro a mano dava niente (utente
#       vuoto), ora vedono tutto, come su ogni tabella protetta.
#
# ⚠️ p_emittente_ids RESTA IN FIRMA e non e' piu' letto. La regola di casa:
#   un parametro che non serve piu' non si toglie facendo cambiare la firma,
#   si dichiara superato e il ritiro lo decide Tid insieme al backend, che
#   oggi lo passa per nome (core/db/search_repository.py). Nessun chiamante
#   lo usava per restringere: passava il diritto pieno.
#
# ⚠️ FIRMA dall'ultimo YAML che la aveva ancorata (20260818-03), DECLARE
#   ricontrollato; il CORPO dalla doc auto-gen. pg_get_function_identity_arguments
#   resta byte-identico: CREATE OR REPLACE, nessun overload.
#
# ⛔ Effetto collaterale dichiarato: un soggetto-ruolo CL senza NESSUN cliente
#   prima dava {"righe": []} al super admin, ora NULL (404) per tutti. E' la
#   regola di (b) applicata senza eccezioni, la stessa della lista (-03).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261008-02-update-fn-get-search-detail-non-trovato-mctit.yaml

  - changeSet:
      id: 20261008-02-update-fn-get-search-detail-non-trovato
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il dettaglio della ricerca universale restituisce NULL quando il
        soggetto, con quel ruolo, non risulta a chi guarda (inesistente, senza
        quel ruolo, o per CL senza clienti visibili), e la struttura con righe
        (anche vuota) solo quando il soggetto c'e'. Il perimetro dei clienti lo
        fa la RLS: cade il filtro a mano del ramo CL. p_emittente_ids resta in
        firma, superato.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_check_soggetto_ruolo_visibile'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_search_detail(
                p_soggetto_id    anagrafiche.soggetti.id%TYPE,
                p_tipo_ruolo_id  config.tipi_ruoli.id%TYPE,
                p_utility_id     config.utilities.id%TYPE  DEFAULT NULL,
                -- ⚠️ SUPERATO dal 2026-10-08, non letto: il perimetro lo fa la
                --   RLS. Resta in firma finche' Tid non ne decide il ritiro
                --   col backend. bigint[]: un array non si ancora con %TYPE.
                p_emittente_ids  bigint[]                  DEFAULT NULL
              )
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                v_tipo_ruolo_codice  config.tipi_ruoli.codice_interno%TYPE;
                -- Il dettaglio composto: nessuna colonna di cui sia il riflesso.
                v_result             jsonb;
              BEGIN
                IF p_soggetto_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'script.fn_get_search_detail', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_soggetto_id', 'valore', NULL),
                    NULL::uuid, 'p_soggetto_id obbligatorio'
                  );
                END IF;

                IF p_tipo_ruolo_id IS NULL OR p_tipo_ruolo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'script.fn_get_search_detail', 'E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro', 'p_tipo_ruolo_id', 'valore', p_tipo_ruolo_id),
                    NULL::uuid, 'p_tipo_ruolo_id obbligatorio e > 0'
                  );
                END IF;

                SELECT tr.codice_interno INTO v_tipo_ruolo_codice
                FROM config.tipi_ruoli tr
                WHERE tr.id = p_tipo_ruolo_id;

                IF v_tipo_ruolo_codice IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database', 'script.fn_get_search_detail', 'E_TIPO_RUOLO_NON_TROVATO',
                    jsonb_build_object('detail', 'tipo_ruolo_id non trovato in config.tipi_ruoli', 'p_tipo_ruolo_id', p_tipo_ruolo_id),
                    NULL::uuid, p_tipo_ruolo_id::text
                  );
                END IF;

                -- =========================================================
                -- «Non c'e'» (rev 2026-10-08, R-4).
                --
                -- Il soggetto, con quel ruolo, risulta a chi guarda? Stesso
                -- perimetro delle righe ma SENZA il filtro utility, con la
                -- stessa check della lista (fn_search_soggetti_universale):
                --   * il soggetto-ruolo esiste;
                --   * per CL, almeno un suo cliente e' restituito dalla RLS.
                -- Altrimenti NULL: il backend risponde 404 E_SEARCH_NOT_FOUND.
                -- ⚠️ Inesistente e fuori perimetro escono uguali, di
                --   proposito: il 404 non rivela un cliente di un altro
                --   emittente.
                -- ⚠️ Il filtro utility resta FUORI: «c'e', ma l'utility non
                --   ne trova» e' un risultato vero, righe = [].
                -- =========================================================
                IF NOT EXISTS (
                  SELECT 1
                    FROM anagrafiche.soggetti_ruoli sr
                   WHERE sr.soggetto_id = p_soggetto_id
                     AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                     AND script.fn_check_soggetto_ruolo_visibile(sr.id)
                ) THEN
                  RETURN NULL;
                END IF;

                -- Dettaglio per codice_interno del tipo ruolo (immutabile).
                CASE v_tipo_ruolo_codice

                WHEN 'CL' THEN
                  -- ⚠️ Il perimetro dei clienti lo applica la RLS di
                  --   anagrafiche.clienti (rev 2026-10-08): fino a quel giorno
                  --   qui c'era un filtro a mano che ne era una seconda copia.
                  SELECT jsonb_build_object(
                    'tipo_ruolo', v_tipo_ruolo_codice,
                    'righe', COALESCE(jsonb_agg(row_detail ORDER BY row_detail->>'utility_codice_interno', row_detail->>'stato_descrizione'), '[]'::jsonb)
                  ) INTO v_result
                  FROM (
                    SELECT jsonb_build_object(
                      'cliente_id',             cl.id,
                      'soggetto_ruolo_id',      cl.soggetto_ruolo_id,
                      'codice',                 ba.codice,
                      'istanza_codice',         iu.codice,
                      'istanza_id',             iu.id,
                      'utility_id',             u.id,
                      'utility_codice_interno', u.codice_interno,
                      'utility_codice',         u.codice,
                      'utility_descrizione',    u.descrizione,
                      'stato_cliente_id',       sc.id,
                      'stato_codice_interno',   sc.codice_interno,
                      'stato_descrizione',      sc.descrizione_breve,
                      'stato_macro',            sc.codice,
                      'indirizzo',              COALESCE(idv.indirizzo_normalizzato, fb_ind.indirizzo_completo, ''),
                      'comune',                 COALESCE(idv.descrizione_comune, fb_ind.comune_descrizione, ''),
                      'data_attivazione',       cl.data_attivazione,
                      'data_sospensione',       cl.data_sospensione,
                      'data_riattivazione',     cl.data_riattivazione,
                      'data_chiusura',          cl.data_chiusura
                    ) AS row_detail
                    FROM anagrafiche.soggetti_ruoli sr
                      JOIN anagrafiche.clienti cl ON cl.soggetto_ruolo_id = sr.id
                      JOIN config.stati_cliente sc ON sc.id = cl.stato_cliente_id
                      LEFT JOIN anagrafiche.billing_account ba ON ba.id = cl.billing_account_id
                      LEFT JOIN anagrafiche.istanze_utilities iu ON iu.id = cl.istanza_utility_id
                      LEFT JOIN config.utilities u ON u.id = cl.utility_id
                      LEFT JOIN anagrafiche.vw_indirizzi_dettaglio idv ON idv.indirizzo_dettaglio_id = iu.indirizzo_dettaglio_id
                      LEFT JOIN LATERAL (
                        SELECT gi.indirizzo_completo, gi.comune_descrizione
                        FROM script.fn_get_indirizzo(sr.id, 'RES') gi
                        LIMIT 1
                      ) fb_ind ON iu.indirizzo_dettaglio_id IS NULL
                    WHERE sr.soggetto_id = p_soggetto_id
                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                      AND (p_utility_id IS NULL OR cl.utility_id = p_utility_id)
                  ) sub;

                WHEN 'FO' THEN
                  SELECT jsonb_build_object(
                    'tipo_ruolo', v_tipo_ruolo_codice,
                    'righe', COALESCE(jsonb_agg(row_detail), '[]'::jsonb)
                  ) INTO v_result
                  FROM (
                    SELECT jsonb_build_object(
                      'fornitore_id',        f.id,
                      'soggetto_ruolo_id',   f.soggetto_ruolo_id,
                      'codice',              f.codice,
                      'attivo',              f.attivo,
                      'stato_descrizione',   CASE WHEN f.attivo THEN 'ATTIVO' ELSE 'INATTIVO' END,
                      'indirizzo',           COALESCE(fb_ind.indirizzo_completo, ''),
                      'comune',              COALESCE(fb_ind.comune_descrizione, '')
                    ) AS row_detail
                    FROM anagrafiche.soggetti_ruoli sr
                      JOIN anagrafiche.fornitori f ON f.soggetto_ruolo_id = sr.id
                      LEFT JOIN LATERAL (
                        SELECT gi.indirizzo_completo, gi.comune_descrizione
                        FROM script.fn_get_indirizzo(sr.id, 'SEDEOP') gi
                        LIMIT 1
                      ) fb_ind ON true
                    WHERE sr.soggetto_id = p_soggetto_id
                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                  ) sub;

                ELSE
                  SELECT jsonb_build_object(
                    'tipo_ruolo', v_tipo_ruolo_codice,
                    'entita_detail', script.fn_get_entita_ruolo_detail(sr.id, p_utility_id),
                    'righe', jsonb_build_array(
                      jsonb_build_object(
                        'soggetto_ruolo_id', sr.id,
                        'soggetto_id',       sr.soggetto_id,
                        'indirizzo',         COALESCE(fb_ind.indirizzo_completo, ''),
                        'comune',            COALESCE(fb_ind.comune_descrizione, '')
                      )
                    )
                  ) INTO v_result
                  FROM anagrafiche.soggetti_ruoli sr
                    LEFT JOIN LATERAL (
                      SELECT gi.indirizzo_completo, gi.comune_descrizione
                      FROM script.fn_get_indirizzo(sr.id, 'RES') gi
                      LIMIT 1
                    ) fb_ind ON true
                  WHERE sr.soggetto_id = p_soggetto_id
                    AND sr.tipo_ruolo_id = p_tipo_ruolo_id;

                END CASE;

                -- Arrivati qui il soggetto-ruolo c'e' (verifica sopra): niente
                -- COALESCE, v_result e' sempre valorizzato.
                RETURN v_result;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_search_detail(anagrafiche.soggetti.id%TYPE, config.tipi_ruoli.id%TYPE, config.utilities.id%TYPE, bigint[])
              IS 'Dettaglio della ricerca universale per tipo_ruolo (CASE su codice_interno). ⭐ NULL = «non c''e''» (rev 2026-10-08, brief-db-codici-non-trovato-email-e-permessi R-4, decisione di Tid): il soggetto non esiste, non ha quel ruolo, o per CL nessuno dei suoi clienti e'' visibile a chi guarda — la verifica e'' script.fn_check_soggetto_ruolo_visibile, la stessa della lista, sullo stesso perimetro delle righe ma senza il filtro utility. Il backend risponde 404 E_SEARCH_NOT_FOUND. Inesistente e fuori perimetro escono uguali, di proposito. NULL e non un raise: una lettura non scrive nel diario errori a ogni id sbagliato. La struttura {tipo_ruolo, righe} (righe anche vuota) solo quando il soggetto c''e'': righe = [] vuol dire che il filtro p_utility_id non ne trova. Perimetro: per CL lo fa la RLS di anagrafiche.clienti (dal 2026-10-08; prima un filtro a mano che ne era una seconda copia); FO e altri ruoli non portano un emittente nel modello, quindi non si filtrano per emittente (scelta di modello). ⚠️ p_emittente_ids SUPERATO dal 2026-10-08: resta in firma e non e'' letto, il ritiro lo decide Tid col backend. Ramo CL: utility_codice_interno (logica) + utility_codice (display), stato_codice_interno; stato_macro = stati_cliente.codice. SECURITY INVOKER: la RLS vale con l''identita'' di chi chiama.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Nessun rollback automatico: tornare indietro vuol dire rimettere
              -- il filtro a mano e la COALESCE finale, cioe' il corpo di
              -- 20260818-03. Se serve, un changeSet nuovo con la ragione scritta.
              SELECT 1;
