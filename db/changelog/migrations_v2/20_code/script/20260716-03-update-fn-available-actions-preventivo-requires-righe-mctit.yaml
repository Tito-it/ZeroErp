# ------------------------------------------------------------
# Documento vuoto non avanza di stato — §1a (capability righe-aware).
# Vedi 20260716-02 (ordine) per il razionale completo della forma scelta.
#
# Questo e' il caso che ha ORIGINATO il brief: preventivo VUOTO con il
# pulsante "Emetti" visibile e cliccabile; il guard DB
# (PREV_NESSUNA_RIGA_ATTIVA) rifiutava correttamente al click.
#
# MIRROR DEL GUARD: il predicato specchia ESATTAMENTE
# fn_cambia_stato_preventivo (guard DRAFT->EMESSO, rev 2026-07-16):
#   almeno una riga con attivo IS TRUE. SOLO presenza.
#
# Nessun vincolo su quantita/prezzo/totale: decisione Tid 2026-07-16 —
# un documento a totale zero deve poter essere emesso (regola valida per
# tutti i domini). Il guard preventivo era l'unico a violarla e viene
# allineato da 20260716-07, che rimuove PREV_TOTALE_NON_POSITIVO e il
# filtro quantita > 0. Guard e capability restano cosi' sullo stesso
# predicato.
#
# Base: doc auto-gen script/funzioni/fn_available_actions_preventivo.md
# (rev 2026-07-11) + blocco requires_righe.
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/script/20260716-03-update-fn-available-actions-preventivo-requires-righe-mctit.yaml

    - changeSet:
          id: 20260716-03-update-fn-available-actions-preventivo-requires-righe
          author: mctit
          runOnChange: false
          validCheckSum:
              - ANY
          failOnError: true
          comment: >
              fn_available_actions_preventivo: azioni con enabled/reason/reason_key da
              meta.requires_righe (documento vuoto non avanza). Predicato specchiato dal
              guard PREV_NESSUNA_RIGA_ATTIVA: SOLO presenza di riga attiva.
          preConditions:
              - onFail: HALT
              - tableExists:
                    schemaName: vendite
                    tableName: preventivi_righe
          changes:
              - sql:
                    dbms: postgresql
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION script.fn_available_actions_preventivo(p_preventivo_id bigint)
                         RETURNS jsonb
                         LANGUAGE plpgsql
                         STABLE
                        AS $function$
                        -- Scopo: capability preventivo per detail API (pattern data-driven).
                        --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
                        --   config.stati_doc_preventivi (bottone PDF data-driven via capabilities).
                        --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
                        --   (documento vuoto non avanza di stato).
                        DECLARE
                            v_stato_id          vendite.preventivi.stato_doc_preventivo_id%TYPE;
                            v_stato_cod         config.stati_doc_preventivi.codice_interno%TYPE;
                            v_ba_id             vendite.preventivi.billing_account_id%TYPE;
                            v_utility_id        vendite.preventivi.utility_id%TYPE;
                            v_pdf_mode          config.stati_doc_preventivi.pdf_mode%TYPE;
                            v_pdf_allow         config.stati_doc_preventivi.pdf_allow_allegati%TYPE;
                            v_actions           jsonb;
                            v_ha_righe          boolean := false;
                            v_can_edit          boolean;
                            v_can_push          boolean;
                            v_can_rev           boolean;
                            v_push_reason       text;
                            v_push_reason_key   text;
                            v_can_ordine        boolean;
                            v_ordine_reason     text;
                            v_ordine_reason_key text;
                            c_sempre_non_edit CONSTANT jsonb := '["utility_id"]'::jsonb;
                            c_non_edit_extra  CONSTANT jsonb := '["billing_account_id","istanza_utility_id","valuta_id","termine_pagamento_id","validita_dal","validita_al","competenza_mese","fatturazione_immediata","meta"]'::jsonb;
                            c_action_crea_revisione CONSTANT jsonb := jsonb_build_object(
                                'key',                  'crea_revisione',
                                'target_state',         NULL,
                                'label_key',            'preventivi.azione_crea_revisione',
                                'severity',             'info',
                                'icon',                 'pi pi-clone',
                                'requires_confirm',     true,
                                'requires_motivazione', false,
                                'enabled',              true,
                                'reason',               NULL,
                                'reason_key',           NULL
                            );
                            c_action_push_commessa CONSTANT jsonb := jsonb_build_object(
                                'key',                  'push_commessa',
                                'target_state',         NULL,
                                'label_key',            'preventivi.azione_push_commessa',
                                'severity',             'info',
                                'icon',                 'pi pi-arrow-right',
                                'requires_motivazione', false,
                                'requires_confirm',     true,
                                'enabled',              true,
                                'reason',               NULL,
                                'reason_key',           NULL
                            );
                            c_action_genera_ordine CONSTANT jsonb := jsonb_build_object(
                                'key',                  'genera_ordine',
                                'target_state',         NULL,
                                'label_key',            'preventivi.azione_genera_ordine',
                                'severity',             'info',
                                'icon',                 'pi pi-shopping-cart',
                                'requires_confirm',     true,
                                'requires_motivazione', false,
                                'enabled',              true,
                                'reason',               NULL,
                                'reason_key',           NULL
                            );
                        BEGIN
                            -- Stato corrente + testata + capability PDF (pdf_mode/allow_allegati).
                            SELECT p.stato_doc_preventivo_id, sdp.codice_interno,
                                   p.billing_account_id, p.utility_id,
                                   sdp.pdf_mode, sdp.pdf_allow_allegati
                              INTO v_stato_id, v_stato_cod, v_ba_id, v_utility_id,
                                   v_pdf_mode, v_pdf_allow
                              FROM vendite.preventivi p
                              JOIN config.stati_doc_preventivi sdp ON sdp.id = p.stato_doc_preventivo_id
                             WHERE p.id = p_preventivo_id;

                            IF NOT FOUND THEN
                                RETURN NULL;
                            END IF;

                            -- Precondizione "documento non vuoto" per le transizioni che la
                            -- esigono (meta.requires_righe). La fn sa solo COME contare le
                            -- proprie righe: specchia il guard di fn_cambia_stato_preventivo
                            -- (PREV_NESSUNA_RIGA_ATTIVA, rev 2026-07-16): SOLO presenza di
                            -- riga attiva, nessun vincolo su quantita/prezzo/totale.
                            v_ha_righe := EXISTS (
                                SELECT 1 FROM vendite.preventivi_righe pr
                                 WHERE pr.preventivo_id = p_preventivo_id
                                   AND pr.attivo IS TRUE
                            );

                            SELECT COALESCE(
                                jsonb_agg(
                                    jsonb_build_object(
                                        'key',              t.meta->>'action_key',
                                        'target_state',     sa.codice_interno,
                                        'label_key',        t.meta->>'label_key',
                                        'severity',         t.meta->>'severity',
                                        'icon',             t.meta->>'icon',
                                        'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                                        'enabled',          NOT (COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                                 AND NOT v_ha_righe),
                                        'reason',           CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                                      AND NOT v_ha_righe
                                                                 THEN 'DOCUMENTO_SENZA_RIGHE' END,
                                        'reason_key',       CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                                                      AND NOT v_ha_righe
                                                                 THEN 'common.azione_reason.senza_righe' END
                                    )
                                    ORDER BY sa.ordine
                                ),
                                '[]'::jsonb
                            )
                            INTO v_actions
                            FROM config.transizioni_stati_preventivi t
                            JOIN config.stati_doc_preventivi sa ON sa.id = t.stato_a_id
                            WHERE t.stato_da_id = v_stato_id
                              AND t.attivo IS TRUE
                              AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                              AND t.meta ? 'action_key'
                              AND t.meta ? 'label_key';

                            v_can_edit := (v_stato_cod = 'DRAFT');
                            v_can_rev  := (v_stato_cod = 'EMESSO');

                            v_can_push := (v_stato_cod = 'ACCETTATO')
                                AND vendite.fn_preventivo_ha_residuo_commessa(p_preventivo_id);

                            v_can_ordine := (v_stato_cod = 'ACCETTATO')
                                AND vendite.fn_preventivo_ha_residuo_ordine(p_preventivo_id);

                            IF v_can_rev THEN
                                v_actions := v_actions || jsonb_build_array(c_action_crea_revisione);
                            END IF;

                            IF v_can_push THEN
                                v_actions := v_actions || jsonb_build_array(c_action_push_commessa);
                            END IF;

                            IF v_can_ordine THEN
                                v_actions := v_actions || jsonb_build_array(c_action_genera_ordine);
                            END IF;

                            IF v_can_push THEN
                                v_push_reason     := NULL;
                                v_push_reason_key := NULL;
                            ELSIF v_stato_cod <> 'ACCETTATO' THEN
                                v_push_reason     := 'PREVENTIVO_NON_ACCETTATO';
                                v_push_reason_key := 'preventivi.push_commessa_reason.non_accettato';
                            ELSIF v_ba_id IS NULL OR v_utility_id IS NULL THEN
                                v_push_reason     := 'PREVENTIVO_SENZA_BILLING_ACCOUNT';
                                v_push_reason_key := 'preventivi.push_commessa_reason.senza_billing_account';
                            ELSE
                                v_push_reason     := 'PREVENTIVO_NESSUNA_RIGA_COMMESSA';
                                v_push_reason_key := 'preventivi.push_commessa_reason.nessuna_riga';
                            END IF;

                            IF v_can_ordine THEN
                                v_ordine_reason     := NULL;
                                v_ordine_reason_key := NULL;
                            ELSIF v_stato_cod <> 'ACCETTATO' THEN
                                v_ordine_reason     := 'PREVENTIVO_NON_ACCETTATO';
                                v_ordine_reason_key := 'preventivi.genera_ordine_reason.non_accettato';
                            ELSE
                                v_ordine_reason     := 'PREVENTIVO_NESSUNA_RIGA_ORDINE';
                                v_ordine_reason_key := 'preventivi.genera_ordine_reason.nessuna_riga';
                            END IF;

                            RETURN jsonb_build_object(
                                'available_actions',            v_actions,
                                'can_edit_testata',             v_can_edit,
                                'can_edit_righe',               v_can_edit,
                                'can_push_commessa',            v_can_push,
                                'can_push_commessa_reason',     v_push_reason,
                                'can_push_commessa_reason_key', v_push_reason_key,
                                'can_genera_ordine',            v_can_ordine,
                                'can_genera_ordine_reason',     v_ordine_reason,
                                'can_genera_ordine_reason_key', v_ordine_reason_key,
                                'can_create_revisione',         v_can_rev,
                                'non_editable_fields',          CASE WHEN v_can_edit
                                                                    THEN c_sempre_non_edit
                                                                    ELSE c_sempre_non_edit || c_non_edit_extra END,
                                'pdf',                          jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                                'stato_codice',                 v_stato_cod
                            );
                        END;
                        $function$;

                        COMMENT ON FUNCTION script.fn_available_actions_preventivo(p_preventivo_id bigint)
                        IS 'Capability preventivo per detail API: available_actions + can_edit_* + push_commessa + genera_ordine + create_revisione + non_editable_fields + stato_codice. rev 2026-07-11: + blocco pdf {mode, allow_allegati} da config.stati_doc_preventivi (bottone PDF data-driven via capabilities). rev 2026-07-16: ogni azione espone enabled/reason/reason_key; se la transizione ha meta.requires_righe e il preventivo non ha righe attive -> enabled=false + reason DOCUMENTO_SENZA_RIGHE (predicato specchiato dal guard PREV_NESSUNA_RIGA_ATTIVA: SOLO presenza, nessun vincolo su quantita/prezzo/totale).';
