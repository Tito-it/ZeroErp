databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260308-11-update-trg-vendite-movimenti-guard-emittente-scope-mctit.yaml

  - changeSet:
      id: 20260308-11-update-trg-vendite-movimenti-guard-emittente-scope
      author: mctit
      comment: "Rebind trigger vendite_movimenti guard emittente: config.trgfn → script.trgfn"
      runOnChange: false
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DROP TRIGGER IF EXISTS trg_vendite_movimenti_a10_guard_emittente_scope_ins_upd
                ON pagamenti.vendite_movimenti;

              CREATE TRIGGER trg_vendite_movimenti_a10_guard_emittente_scope_ins_upd
                BEFORE INSERT OR UPDATE ON pagamenti.vendite_movimenti
                FOR EACH ROW
                EXECUTE FUNCTION script.trgfn_guard_emittente_scope(
                  'fattura', 'fattura_id'
                );
