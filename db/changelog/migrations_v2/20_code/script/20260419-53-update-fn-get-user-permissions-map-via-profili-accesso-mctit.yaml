databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260419-53-update-fn-get-user-permissions-map-via-profili-accesso-mctit.yaml

  - changeSet:
      id: 20260419-53-update-fn-get-user-permissions-map-via-profili-accesso
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Aggiornamento successivo di script.fn_get_user_permissions_map
        (§4.8.5 WIP multi-face-auth). Refactor set-based:
        sostituisce il LEFT JOIN a config.profili_reparto_aree su
        unita_organizzativa_id con una CTE "best_per_area" basata su
        script.fn_get_profili_accesso_applicabili.

        Cambiamenti:
          - Rimossa la variabile v_uo_id (non piu' necessaria: l'helper
            incapsula il lookup UO via risorse_umane).
          - CTE livelli_user: UNION ALL dei profili applicabili con
            priorita (AD_HOC 1, REPARTO/PORTALE 2).
          - CTE best_per_area: DISTINCT ON (area_id) ORDER BY priorita
            -> un solo livello per area, preferendo AD_HOC.
          - LEFT JOIN best_per_area sostituisce il JOIN a profili_reparto_aree.

        Coerenza col legacy: per operatori il risultato e' identico
        grazie al backfill §4.3.5 (che popola profili_accesso REPARTO
        equivalenti). Per portali/shop/fornitori la mappa ora e'
        coerente con fn_resolve_livello_area.

        File successivo a 20260419-17 sullo stesso branch non-mergiato:
        Liquibase esegue runOnChange in ordine alfabetico, -53 produce
        la versione finale della funzione.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_is_super_admin';
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_get_profili_accesso_applicabili';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_user_permissions_map(
                  p_auth_user_id integer
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_has_identita boolean;
                  v_is_super     boolean;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Mappa livello accesso per tutte le aree funzionali
                  --   attive, in un singolo roundtrip DB.
                  --
                  -- Ritorna:
                  --   JSONB { "anagrafiche": "TUTTO", "vendite": "LETTURA", ... }
                  --
                  -- Catena (refactor §4.6.B.8 + §4.8.5):
                  --   1. Guard parametro obbligatorio
                  --   2. Pre-calcolo v_has_identita (helper DRY §4.6.B.0)
                  --   3. Pre-calcolo v_is_super
                  --   4. CTE best_per_area su profili_accesso via helper
                  --   5. jsonb_object_agg con CASE su (has_identita, super,
                  --      user_override_area, best_per_area, default BLOCCATO)
                  -- =========================================================

                  -- 1. Guard parametro obbligatorio
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_user_permissions_map',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'p_auth_user_id obbligatorio e > 0.'
                      );
                  END IF;

                  -- 2-3. Pre-calcolo flag identita + super (usati nel CASE)
                  v_has_identita := script.fn_has_identita_attiva(
                                        p_auth_user_id,
                                        'OPERATORE'::config.ruolo_applicativo);
                  v_is_super := script.fn_is_super_admin(p_auth_user_id);

                  -- 4-5. CTE best_per_area + aggregazione jsonb
                  RETURN (
                      WITH livelli_user AS (
                          SELECT paa.area_id,
                                 paa.livello,
                                 h.priorita
                            FROM script.fn_get_profili_accesso_applicabili(p_auth_user_id) h
                            JOIN config.profili_accesso_aree paa
                              ON paa.profilo_accesso_id = h.profilo_accesso_id
                      ),
                      best_per_area AS (
                          -- DISTINCT ON prende la prima riga per area_id
                          -- ordinata per priorita: AD_HOC (1) vince su
                          -- REPARTO/PORTALE (2).
                          SELECT DISTINCT ON (area_id)
                                 area_id,
                                 livello
                            FROM livelli_user
                           ORDER BY area_id, priorita
                      )
                      SELECT COALESCE(
                          jsonb_object_agg(
                              af.schema_db,
                              CASE
                                  WHEN NOT v_has_identita
                                      THEN 'BLOCCATO'
                                  WHEN v_is_super
                                      THEN 'TUTTO'
                                  ELSE COALESCE(
                                      uoa.livello,
                                      bpa.livello,
                                      'BLOCCATO'::config.livello_accesso
                                  )::text
                              END
                          ),
                          '{}'::jsonb
                      )
                        FROM config.aree_funzionali af
                        LEFT JOIN config.user_override_aree uoa
                          ON uoa.auth_user_id = p_auth_user_id
                         AND uoa.area_id = af.id
                         AND uoa.validita @> CURRENT_DATE
                        LEFT JOIN best_per_area bpa
                          ON bpa.area_id = af.id
                       WHERE af.attivo = TRUE
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_user_permissions_map(integer) IS
                  'Mappa permessi aree set-based. Refactor §4.6.B.8 + §4.8.5: '
                  'gate identita OPERATORE, bypass fn_is_super_admin, catena '
                  'profili via helper fn_get_profili_accesso_applicabili '
                  '(AD_HOC > REPARTO/PORTALE). Override utente area invariato.';
      rollback:
        - sql:
            sql: |
              -- Rollback: Liquibase riesegue 20260419-17 (runOnChange)
              -- al prossimo apply, ripristinando la versione precedente.
              SELECT 1;
