# IL BILLING ACCOUNT DI UNA COPPIA (istanza, utility), SENZA RIESEGUIRE LA SUA POLICY
#   script.fn_get_ba_id_da_coppia(bigint, integer)
#   Brief: brief-db-perimetro-una-volta-famiglie-residue §4, P-3 (Tid, 2026-10-21).
#
# anagrafiche.istanze_dati_precontrattuali nomina il suo BA con la COPPIA
# (istanza_utility_id, utility_id), NOT NULL, con la FK
# fk_idp_billing_account_coppia verso la UNIQUE uq_billing_instance_utility:
# ogni riga ha esattamente un BA. La sua policy lo cercava leggendo
# anagrafiche.billing_account sotto RLS, cioe' rieseguendo per ogni riga la
# policy del BA (e con essa il perimetro dell'operatore). Questa funzione
# risponde alla domanda di FATTO («quale BA e' questa coppia»), DEFINER come
# script.fn_resolve_emittente_fiscale_id: il permesso resta alla policy
# (-26), che lo chiede a fn_scope_ef_perimetro col perimetro calcolato una
# volta per istruzione.
# Firma e RETURNS %TYPE, COST 5000 (linee-guida-sql §10.3), search_path bloccato.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261021-24-create-fn-get-ba-id-da-coppia-mctit.yaml

  - changeSet:
      id: 20261021-24-create-fn-get-ba-id-da-coppia
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_ba_id_da_coppia: il billing account della coppia (istanza, utility), letto per chiave e senza la policy del BA (DEFINER). Per la policy di istanze_dati_precontrattuali. P-3 di brief-db-perimetro-una-volta-famiglie-residue.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE pronamespace = 'script'::regnamespace AND proname = 'fn_get_ba_id_da_coppia'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_ba_id_da_coppia(
                  p_istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE,
                  p_utility_id         anagrafiche.billing_account.utility_id%TYPE)
               RETURNS anagrafiche.billing_account.id%TYPE
               LANGUAGE sql
               STABLE SECURITY DEFINER COST 5000
               SET search_path TO 'pg_catalog', 'pg_temp'
              AS $function$
                  -- Scopo: dire QUALE billing account e' la coppia (istanza, utility),
                  --   e nient'altro. NULL se la coppia non porta a nessun BA.
                  -- ⭐ Perche' SECURITY DEFINER: anagrafiche.billing_account ha la RLS
                  --   accesa. Letta dall'operatore, ogni lettura rieseguirebbe la policy
                  --   del BA, e chiamata da una policy lo farebbe per ogni riga. La
                  --   domanda di FATTO («quale BA») e quella di PERMESSO («lo vedo»)
                  --   restano separate: la seconda e' della policy che chiama, come per
                  --   script.fn_resolve_emittente_fiscale_id.
                  -- ⚠️ Dipende dalla RLS ABILITATA ma NON FORZATA: il proprietario la
                  --   salta (linee-guida-sql §10.5). Con FORCE andrebbe rivista.
                  -- ⚠️ Una riga al massimo: uq_billing_instance_utility.
                  SELECT ba.id
                    FROM anagrafiche.billing_account ba
                   WHERE ba.istanza_utility_id = p_istanza_utility_id
                     AND ba.utility_id         = p_utility_id
              $function$;

              COMMENT ON FUNCTION script.fn_get_ba_id_da_coppia(
                  anagrafiche.billing_account.istanza_utility_id%TYPE,
                  anagrafiche.billing_account.utility_id%TYPE) IS
              'Il billing account della coppia (istanza_utility_id, utility_id): al massimo uno (uq_billing_instance_utility), NULL se la coppia non porta a nessun BA. Domanda di FATTO, non di permesso: SECURITY DEFINER del PROPRIETARIO, non di un superuser, perche'' billing_account e'' sotto RLS e una lettura dalla policy di un figlio rieseguirebbe per ogni riga la policy del BA. Il permesso resta a chi chiama: la policy rls_istanze_dati_precontrattuali_ef_whitelist lo chiede a script.fn_scope_ef_perimetro col perimetro calcolato una volta per istruzione (linee-guida-sql §10.3). Dipende dalla RLS non forzata. search_path bloccato. Rev 2026-10-21 (20261021-24, P-3 di brief-db-perimetro-una-volta-famiglie-residue).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION script.fn_get_ba_id_da_coppia(
                  anagrafiche.billing_account.istanza_utility_id%TYPE,
                  anagrafiche.billing_account.utility_id%TYPE);
