# script.trgfn_seed_primo_impianto: la forma FIGLIA.
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§16.15, QU2 decisa (a)
#   da Tid il 2026-11-20).
#
# Che cosa cambia: un ramo per la forma FIGLIA (20261119-02), prima di ogni
#   altro. Una tabella di composizione senza colonna id (ui.lista_preset_colonna)
#   segue il suo padre: l'installazione la scrive sempre, il software solo sotto
#   un padre che e' una riga di seed intatta (dbops.fn_seed_riga del padre).
#   Altrimenti WARNING, OLD all'UPDATE (il blocco del mirror trova la riga e non
#   tenta l'INSERT) e NULL all'INSERT di una riga che manca (nessun conflitto:
#   la riga non c'e'). Il DELETE del software passa. Il resto del corpo e'
#   identico.
# Corpo vivo: quello di 20261117-25 (doc auto-generata del 2026-11-20, dopo il
#   -25). Attributi vivi: SECURITY DEFINER, VOLATILE, SET search_path =
#   pg_catalog, pg_temp; CREATE OR REPLACE li riscrive uguali e tiene owner e
#   ACL. Il rollback e' il corpo e il COMMENT del -25.
# ------------------------------------------------------------

