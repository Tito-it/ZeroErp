                         'zeroerp.allow_seed_primo_impianto_override', TG_RELID, TG_OP, v_riga_id) THEN
                      RETURN NEW;   -- bonifica voluta: la riga resta personalizzata (D6)
                  END IF;

                  SELECT jsonb_object_agg(k, v_old -> k), jsonb_object_agg(k, v_new -> k)
                    INTO v_patch, v_scartati
                    FROM unnest(v_cambiate_inst) AS k;

                  NEW := jsonb_populate_record(NEW, v_patch);

                  IF v_seed_id IS NOT NULL AND v_arg.forma = 'SOLO_INSERIMENTO' THEN
                      -- Il salto atteso, ma non muto (Q22): chi scrive a mano con
                      -- l'utente del migratore deve sapere che la scrittura non e'
                      -- entrata. Nel registro non va niente: la riga non e'
                      -- personalizzata, e' dell'installazione per costruzione.
                      RAISE WARNING '%.% id %: riga in solo inserimento, e'' dell''installazione: non riscritte le colonne %',
                          TG_TABLE_SCHEMA, TG_TABLE_NAME, v_riga_id, array_to_string(v_cambiate_inst, ', ');
                      RETURN NEW;
                  END IF;

                  IF v_seed_id IS NOT NULL THEN
                      UPDATE dbops.seed_righe
                         SET scartati = v_scartati, scartati_il = now()
                       WHERE id = v_seed_id;
                      RAISE WARNING '%.% id %: riga personalizzata dall''installazione, non riscritte le colonne %',
                          TG_TABLE_SCHEMA, TG_TABLE_NAME, v_riga_id, array_to_string(v_cambiate_inst, ', ');
                  ELSE
                      RAISE WARNING '%.% id %: riga creata dall''installazione, non riscritte le colonne %',
                          TG_TABLE_SCHEMA, TG_TABLE_NAME, v_riga_id, array_to_string(v_cambiate_inst, ', ');
                  END IF;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_seed_primo_impianto() IS
                  'Sulle tabelle del seed di primo impianto (dbops.automazione_seed_primo_impianto) il CSV crea la riga, e dopo che l''installazione l''ha modificata non la riscrive piu''. BEFORE INSERT OR UPDATE OR DELETE FOR EACH ROW, in fase a00 (scatta per primo), montato dal runner dbops.fn_run_automations_seed_primo_impianto; argomenti secondo dbops.fn_seed_primo_impianto_argomenti (forma RIGA, COLONNA o SOLO_INSERIMENTO). Chi scrive: il software e'' la sessione del migratore (dbops.fn_sessione_del_migratore), tutto il resto e'' l''installazione. INSERT del software: la riga entra in dbops.seed_righe, nata dal seed. UPDATE del software: su una riga di seed intatta passa; su una riga personalizzata, su una riga dell''installazione o in SOLO_INSERIMENTO rimette da OLD le colonne dell''installazione e lascia passare quelle del software; su una riga personalizzata salva i valori scartati nel registro e alza un WARNING; in SOLO_INSERIMENTO alza il WARNING e non scrive il registro. UPDATE dell''installazione su una riga di seed: una colonna del software cambiata e'' E_SEED_COLONNA_DEL_SOFTWARE (campo = la colonna); una colonna dell''installazione cambiata fa la riga personalizzata (meta, colonne d''audit e tx_id non contano). DELETE di una riga di seed: E_SEED_RIGA_NON_CANCELLABILE (la riga si spegne, attivo = false). La domanda «nata dal seed» la fa dbops.fn_seed_riga, la stessa che leggono le superfici dei campi spenti. Le righe dell''installazione si scrivono e si cancellano liberamente. Porta di manutenzione zeroerp.allow_seed_primo_impianto_override, solo per la sessione del migratore (script.fn_porta_manutenzione_aperta): lascia passare la bonifica e il DELETE forward-only, la riga resta personalizzata. Montaggio sbagliato: E_TRIGGER_ARGOMENTI_INVALIDI. Restituisce sempre la riga, mai NULL: il blocco UPDATE … IF not found THEN INSERT del mirror non va in chiave duplicata. SECURITY DEFINER, search_path pg_catalog: scrive il registro, che l''app legge soltanto.';
