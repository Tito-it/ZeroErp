# script.fn_get_parameter_full: rimozione dell'overload a 6 argomenti, che
#   rendeva AMBIGUA ogni chiamata
#   (difetto rilevato dal censimento pgTAP del 2026-07-27,
#    brief-db-bonifica-pgtap-sorgente-polimorfa §7.3-A (work-done))
#
# ⚠️ NON E' DEBITO DI TEST: E' UN DIFETTO DI PRODOTTO.
#   In DB convivevano due firme:
#     (text, bigint, integer, integer[], text, text)             <- 20260403-15
#     (text, bigint, integer, integer[], text, text, smallint)   <- 20260515-08
#   Entrambe con DEFAULT su tutti i parametri tranne il primo. Il risultato e'
#   che PostgreSQL non riesce a scegliere: QUALUNQUE chiamata con meno di 7
#   argomenti e' ambigua, e il cast esplicito NON la risolve.
#
#   Verificato per arieta' sul DB vivo il 2026-07-27:
#     1 arg -> ERRORE "non e' unica"
#     2 arg -> ERRORE "non e' unica"
#     6 arg -> ERRORE "non e' unica"     <- anche questa!
#     7 arg -> OK
#
# ⚠️ IL COMMENTO DELLA 7-ARG PROMETTEVA IL CONTRARIO:
#   "Backward compatible: caller con 6 arg usano il vecchio overload a 6 param."
#   E' FALSO. Con i default su entrambe, la chiamata a 6 argomenti matcha
#   entrambe le candidate e PostgreSQL la respinge. L'intenzione era giusta,
#   il meccanismo non funziona: due overload sono distinguibili solo se
#   l'arieta' minima li separa, e qui non lo fa.
#
# CHI ERA ROTTO (2 chiamanti su 3):
#   - backend/apps/ai_assistant/services/tool_registry.py:140 — chiama con
#     UN argomento: SELECT script.fn_get_parameter_full('AI_DISABLED_TOOLS').
#     Percorso rotto a runtime, non solo nei test;
#   - script.fn_get_default_by_param — chiama con SEI argomenti;
#   - backend/apps/core/db/parameter_repository.py passa 7 argomenti con cast
#     espliciti: e' l'unico che funzionava, ed e' il motivo per cui il difetto
#     e' passato inosservato (il percorso principale dei parametri va bene).
#   Lo segnalavano 6 pgTAP rossi, illeggibili nel rumore di una suite con 131
#   rossi (censimento §7.1).
#
# PERCHE' SI DROPPA LA 6-ARG E NON L'ALTRA:
#   la 7-arg e' un SOVRAINSIEME STRETTO — stessi 6 parametri, piu' uno
#   opzionale in coda (p_categoria_cliente_id) che aggiunge un livello alla
#   cascata. Con quel parametro a NULL il livello categoria si salta da solo
#   (NULL-equality nella subquery), quindi il comportamento per i vecchi
#   chiamanti e' identico. E' anche la piu' recente (20260515-08 vs 20260403-15).
#
#   Unica differenza di corpo rilevata nel diff, ed e' un MIGLIORAMENTO: la
#   6-arg conteneva un `RAISE EXCEPTION` dopo `PERFORM fn_log_and_raise_error`,
#   codice morto (la fn di log solleva gia') e anti-pattern esplicitamente
#   vietato dalle regole di progetto. La 7-arg non ce l'ha.
#
# EFFETTO: dopo il DROP tutte le arieta' 1..7 risolvono sull'unica firma
#   rimasta. Nessun chiamante va modificato — e' il DB che torna a rispondere.
#
# ⚠️ NON e' un CREATE OR REPLACE: si rimuove una firma, non si ridefinisce.
#   Entrambe le migration di origine sono runOnChange=false, quindi la firma
#   droppata non viene ricreata da un replay.
#
# Dipendenze: script.fn_get_parameter_full a 7 argomenti (20260515-08).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260727-25-drop-fn-get-parameter-full-overload-ambiguo-mctit.yaml

  - changeSet:
      id: 20260727-25-drop-fn-get-parameter-full-overload-ambiguo
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Rimuove l'overload a 6 argomenti di script.fn_get_parameter_full: con i
        default su entrambe le firme ogni chiamata con meno di 7 argomenti era
        ambigua, incluso il percorso backend tool_registry.py e la fn DB
        fn_get_default_by_param.
      preConditions:
        # Precondizione forte: la firma a 7 argomenti DEVE esistere prima di
        # togliere l'altra, altrimenti si resta senza funzione.
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_get_parameter_full'
                 AND pg_get_function_identity_arguments(p.oid) =
                     'p_code text, p_emittente_fiscale_id bigint, p_django_user_id integer, p_group_ids integer[], p_session_key text, p_function_name text, p_categoria_cliente_id smallint'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_parameter_full(
                  text, bigint, integer, integer[], text, text);

              -- Traccia del perche' nella firma sopravvissuta: senza questa nota
              -- il prossimo che vuole aggiungere un livello alla cascata rifara'
              -- lo stesso errore, cioe' un nuovo overload "backward compatible".
              COMMENT ON FUNCTION script.fn_get_parameter_full(text, bigint, integer, integer[], text, text, smallint)
              IS 'Cascata 7 livelli: user -> categoria_cliente -> group -> emittente -> session -> function -> default. p_categoria_cliente_id (smallint, ultimo param) abilita il livello categoria cliente; a NULL il livello si salta da solo (NULL-equality). p_group_ids integer[] esplicito (%%TYPE[] non valido in PG). Usa config.parameter_overrides filtrato su attivo=TRUE. ⚠️ FIRMA UNICA, e deve restare tale: fino al 2026-07-27 conviveva un overload a 6 argomenti e, avendo entrambe i DEFAULT su tutti i parametri tranne il primo, OGNI chiamata con meno di 7 argomenti era ambigua — cast compreso. Due chiamanti erano rotti a runtime (ai_assistant/tool_registry.py con 1 arg, script.fn_get_default_by_param con 6). Per aggiungere un livello alla cascata NON creare un nuovo overload "backward compatible": si ricade nello stesso difetto. Estendere questa firma con un parametro opzionale in coda e aggiornare i chiamanti. rev 2026-07-27.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: ricreare l'overload a 6 argomenti riporterebbe
              -- l'ambiguita'. Se serve davvero, ri-applicare 20260403-15 —
              -- ma prima rileggere il perche' nell'header di questo changeSet.
              SELECT 1;
