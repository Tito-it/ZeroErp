# UPDATE script.fn_available_actions_ordine — reason preciso per stato EVASO.
#
# Contesto: introdotto lo stato terminale EVASO (config.stati_doc_ordini id=8,
#   ordine=25) e la transizione automatica CONFERMATO -> EVASO
#   (config.transizioni_stati_ordini id=4, meta {"manuale": false}), invocata
#   dal BE dopo il push commessa. EVASO = ordine gia' propagato a commessa,
#   parallelo a EVASO dei preventivi (brief-db-stato-preventivo-evaso.md).
#
# Modifica unica: il calcolo di can_push_commessa_reason. Prima un ordine
#   EVASO cadeva nel ramo ELSE e riceveva reason='ORDINE_NON_CONFERMATO',
#   semanticamente falso (l'ordine E' stato confermato, anzi e' gia' evaso).
#   Ora un ramo dedicato restituisce reason='ORDINE_GIA_EVASO'
#   (i18n key 'ordini.push_commessa_reason.gia_evaso', lato FE).
#   Il bottone resta comunque nascosto (can_push_commessa=false) perche'
#   l'eleggibilita' push e' ammessa solo da CONFERMATO: nessun cambio di
#   comportamento, solo reason piu' preciso per tooltip/diagnostica.
#
# Nessuna modifica a available_actions: la transizione CONFERMATO -> EVASO ha
#   manuale=false e nessuna action_key, quindi e' esclusa dal filtro azioni
#   manuali (non diventa bottone) — e' un effetto automatico lato BE.
#
# CREATE OR REPLACE, STABLE. runOnChange (aggiorna 20260605-09).
# Dipendenze: config.transizioni_stati_ordini, config.stati_doc_ordini (EVASO),
#   vendite.fn_list_ordini_da_pushare (20260510-02).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260608-47-update-fn-available-actions-ordine-reason-evaso-mctit.yaml

  - changeSet:
      id: 20260608-47-update-fn-available-actions-ordine-reason-evaso
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        Aggiorna script.fn_available_actions_ordine: reason dedicato
        'ORDINE_GIA_EVASO' quando lo stato e' EVASO (prima cadeva nel
        generico 'ORDINE_NON_CONFERMATO'). Nessun cambio di comportamento
        (bottone push gia' nascosto fuori da CONFERMATO), solo reason piu'
        preciso per tooltip/diagnostica FE.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: ordini
            - tableExists:
                schemaName: config
                tableName: transizioni_stati_ordini
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_ordine(
                  p_ordine_id vendite.ordini.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo:
              --   Capability dell'ordine di vendita per il detail API. Allineato
              --   al pattern data-driven di fn_available_actions_preventivo /
              --   _offerta / _contratto: legge le transizioni manuali disponibili
              --   da config.transizioni_stati_ordini (matrice 20260605-08).
              --
              --   Grafo transizioni (enforcement: trgfn_ordini_guard_transizione):
              --     DRAFT      -> CONFERMATO (conferma, manuale)   attivo=true
              --     DRAFT      -> ANNULLATO  (annulla,  manuale)   attivo=true
              --     CONFERMATO -> ANNULLATO  (annulla,  manuale)   attivo=FALSE (non esposta)
              --     CONFERMATO -> EVASO      (automatica, manuale=false) attivo=true
              --       -> NON esposta in available_actions (filtro manuale + action_key):
              --          e' un effetto automatico invocato dal BE dopo il push commessa.
              --     EVASO: stato terminale (nessuna transizione in uscita).
              --     Stati a valle (ALLOCATO/SPEDITO/...) fuori matrice (no driver).
              --
              --   push_commessa: azione applicativa (NON transizione di stato:
              --     l'ordine resta CONFERMATO). Appesa a mano come push_commessa
              --     dei preventivi. Eleggibile se stato=CONFERMATO e almeno una
              --     riga risulta pushabile (riuso fn_list_ordini_da_pushare).
              --     Quando off, valorizza can_push_commessa_reason/_reason_key:
              --       CONFERMATO senza righe -> ORDINE_NESSUNA_RIGA_PUSHABILE
              --       EVASO (gia' pushato)   -> ORDINE_GIA_EVASO
              --       altri stati            -> ORDINE_NON_CONFERMATO
              --
              --   Editabilita':
              --     DRAFT: testata + righe (can_edit_*=true). non_editable solo
              --            cliente (billing_account_id, soggetto_ruolo_id: lock
              --            columns, immutabili anche in bozza).
              --     CONFERMATO/terminali: nulla (can_edit_*=false), tutta la
              --            testata bloccata.
              --
              --   Fallback sicuro: NULL se l'ordine non esiste.
              DECLARE
                  v_stato_id   vendite.ordini.stato_doc_ordine_id%TYPE;
                  v_stato_cod  config.stati_doc_ordini.codice_interno%TYPE;
                  v_actions    jsonb;
                  v_can_change boolean := false;
                  v_push_ok    boolean := false;
                  v_push_reason     text := NULL;
                  v_push_reason_key text := NULL;
                  -- Cliente immutabile anche in DRAFT (script.trgfn_lock_columns,
                  -- E_ORD_CLIENTE_IMMUTABILE). Allineato a _CREATE/_UPDATE_KEYS_ORDINE.
                  c_non_edit_cliente CONSTANT jsonb :=
                      '["billing_account_id","soggetto_ruolo_id"]'::jsonb;
                  -- Tutti i campi testata aggiornabili (oltre al cliente) bloccati
                  -- fuori da DRAFT. Allineato a _UPDATE_KEYS_ORDINE (ordini_service.py).
                  c_non_edit_tutti CONSTANT jsonb :=
                      '["billing_account_id","soggetto_ruolo_id","utility_id",'
                      '"valuta_id","modalita_pagamento_id","termine_pagamento_id",'
                      '"fatturazione_trigger","agente_soggetto_ruolo_id","data","meta"]'::jsonb;
              BEGIN
                  -- Stato corrente.
                  SELECT o.stato_doc_ordine_id, sdo.codice_interno
                    INTO v_stato_id, v_stato_cod
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini sdo ON sdo.id = o.stato_doc_ordine_id
                   WHERE o.id = p_ordine_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Transizioni manuali disponibili per lo stato corrente.
                  -- Pattern identico a fn_available_actions_preventivo/offerta/contratto.
                  -- Filtri: attivo, manuale (default true se assente), guard meta keys.
                  -- La transizione automatica CONFERMATO->EVASO (manuale=false, senza
                  -- action_key) e' esclusa da questi filtri: non diventa bottone.
                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false)
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.transizioni_stati_ordini t
                  JOIN config.stati_doc_ordini sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- can_change_state riflette le SOLE transizioni di stato
                  -- (calcolato prima di appendere push_commessa, che non e' una
                  -- transizione: l'ordine resta CONFERMATO).
                  v_can_change := jsonb_array_length(v_actions) > 0;

                  -- push_commessa: azione applicativa (non transizione).
                  -- Eleggibile solo da CONFERMATO con almeno una riga pushabile.
                  -- Riuso della fn canonica per non duplicare la logica pushable.
                  IF v_stato_cod = 'CONFERMATO' THEN
                      IF EXISTS (SELECT 1
                                   FROM vendite.fn_list_ordini_da_pushare(p_ordine_id := p_ordine_id)) THEN
                          v_push_ok := true;
                      ELSE
                          v_push_reason     := 'ORDINE_NESSUNA_RIGA_PUSHABILE';
                          v_push_reason_key := 'ordini.push_commessa_reason.nessuna_riga_pushabile';
                      END IF;
                  ELSIF v_stato_cod = 'EVASO' THEN
                      -- Ordine gia' propagato a commessa (stato terminale): il push
                      -- non si ripete. Reason dedicato (piu' preciso del generico
                      -- ORDINE_NON_CONFERMATO) per tooltip/diagnostica FE.
                      v_push_reason     := 'ORDINE_GIA_EVASO';
                      v_push_reason_key := 'ordini.push_commessa_reason.gia_evaso';
                  ELSE
                      v_push_reason     := 'ORDINE_NON_CONFERMATO';
                      v_push_reason_key := 'ordini.push_commessa_reason.non_confermato';
                  END IF;

                  IF v_push_ok THEN
                      v_actions := v_actions || jsonb_build_array(
                          jsonb_build_object(
                              'key',              'push_commessa',
                              'target_state',     NULL,
                              'label_key',        'vendite.ordini.azione_push_commessa',
                              'severity',         'success',
                              'icon',             'pi pi-arrow-right',
                              'requires_confirm', true,
                              'outlined',         false
                          )
                      );
                  END IF;

                  RETURN jsonb_build_object(
                      'available_actions',           v_actions,
                      'can_change_state',            v_can_change,
                      'can_edit_testata',            (v_stato_cod = 'DRAFT'),
                      'can_edit_righe',              (v_stato_cod = 'DRAFT'),
                      'can_push_commessa',           v_push_ok,
                      'can_push_commessa_reason',    v_push_reason,
                      'can_push_commessa_reason_key', v_push_reason_key,
                      'non_editable_fields',         CASE WHEN v_stato_cod = 'DRAFT'
                                                          THEN c_non_edit_cliente
                                                          ELSE c_non_edit_tutti END,
                      'stato_codice',                v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_ordine(bigint)
              IS 'Capability ordine di vendita per detail API: available_actions '
                 '(da config.transizioni_stati_ordini, pattern data-driven) + '
                 'push_commessa (azione applicativa hardcoded, riuso '
                 'fn_list_ordini_da_pushare), can_change_state, can_edit_testata/righe, '
                 'can_push_commessa(+reason/_reason_key: ORDINE_NESSUNA_RIGA_PUSHABILE / '
                 'ORDINE_GIA_EVASO / ORDINE_NON_CONFERMATO), non_editable_fields, '
                 'stato_codice. Sostituisce il calcolo hardcoded in ordini_service.py. '
                 'rev 2026-06-08 (reason EVASO).';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS script.fn_available_actions_ordine(bigint);
