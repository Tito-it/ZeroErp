# Arita' dei valori — `E_DEFAULT_ERRATO` passava 2 valori su 3 segnaposto (primo dei due rami)
#   Brief: docs/it/dev/work-done/brief-db-segnaposti-messaggi-errore.md §7
#   Lotto: 20260818-47 .. -54, uno per funzione. Decisione Tid, 2026-08-18.
#
# ── IL DIFETTO, IN UNA RIGA ────────────────────────────────────────────
#   `script.fn_log_and_raise_error` compone il testo con
#   `format(messaggio, VARIADIC valori)`. Con MENO valori dei segnaposto,
#   `format()` non degrada: **alza `22023`**. E alza da DENTRO la funzione,
#   quindi il `RAISE` di dominio due righe sotto non viene mai eseguito —
#   niente `P0001`, niente codice nel canale `CONSTRAINT`, niente campo nel
#   canale `COLUMN`. Il guard blocca lo stesso (il dato resta integro, ed e'
#   il motivo per cui non se n'era accorto nessuno), ma il backend perde il
#   codice su cui decide 409/404/403 e l'operatore legge un errore interno al
#   posto della frase scritta per lui.
#
# ── ⚠️ DUE RAMI, LO STESSO CODICE, DUE ARITA' DIVERSE ──────────────────
#   Questa funzione solleva `E_DEFAULT_ERRATO` in due punti. Il secondo passa i
#   tre valori giusti; il primo ne passava due. Il messaggio, quindi,
#   funzionava da un ramo e faceva sparire l'errore dall'altro — che e' il modo
#   piu' efficace di non farsi notare.
#
# ── NOTE DI CASA ────────────────────────────────────────────────────────
#   · ⚠️ **PERMESSI — nessun prestito di proprieta', nessun `GRANT`.** Misurato
#     il 2026-08-18, non dedotto: questa funzione e' di **`titodb`** (che e' chi
#     migra), **non** e' `SECURITY DEFINER` e **non** e' nel registro
#     `dbops.sec_functions_owner`. Il precedente e' il `20260808-04` su
#     `script.fn_log_and_raise_error`, che documenta anche il perche' l'ACL
#     esplicita (`=X/titodb`, `zeroerp_app=X`, `zeroerp_batch_fatturazione=X`)
#     **sopravvive** a un `CREATE OR REPLACE` — sarebbe diverso con
#     `DROP` + `CREATE`, dove i privilegi si perdono e il loop di grant
#     `20260205-41` li rimetterebbe solo alla corsa `ci_apply` successiva.
#     ⚠️ Da non confondere con `script.fn_log_error_only`, che invece e' di
#     `postgres`, **e'** `SECURITY DEFINER` ed **e'** nel registro: quella,
#     riscriverla, il prestito lo richiede.
#   · Corpo dalla doc auto-gen `docs/it/dbzero/`, col `;` dopo `$function$`
#     aggiunto a mano: l'auto-gen non ce l'ha e senza quello il `COMMENT`
#     sotto da' «errore di sintassi a o presso COMMENT».
#   · Firma e `RETURNS` invariati: cambia solo la lista dei valori.
#   · Presidio: `db/pgtap/script/test-catalogo-messaggi-errore-completo.sql`
#     test 5. Rientra quando l'ultimo degli 8 changeSet e' applicato — e a
#     quel punto va tolta la riga di questo file da `baseline-rossi.tsv`.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260818-48-update-fn-get-default-by-param-arita-mctit.yaml

  - changeSet:
      id: 20260818-48-update-fn-get-default-by-param-arita
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il primo dei due punti di sollevamento di E_DEFAULT_ERRATO passava 2 valori a
        un messaggio con 3 segnaposto: format() alzava 22023 e il P0001 di dominio non
        arrivava. Allineato al secondo punto, che era gia' corretto.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_default_by_param'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_default_by_param(p_table_schema text, p_table_name text, p_filter_column text, p_param_code text, p_function_name text)
               RETURNS text
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_param_val  text;
                v_lookup_id  text;
                v_pk_col     text;
              BEGIN

                  -- -----------------------------------------------------
                  -- Input
                  -- p_table_schema: schema della tabella da cui recuperare il valore
                  -- p_table_name: nome della tabella da cui recuperare il valore
                  -- p_filter_column: colonna della tabella da usare come filtro (presumibilmente una PK o indice univoco esempio: codice_iso3)
                  -- p_param_code: codice del parametro da cui recuperare il valore di filtro (esempio: 'state_code_iso3')
                  -- Output
                  -- v_lookup_id: valore trovato nella tabella, sempre come TEXT (caller deve castare in seguito) rappresenta id del record trovato.
                  -- -----------------------------------------------------

                -- 1) Valore del parametro (session_key letta da GUC impostata dal middleware)
                v_param_val := script.fn_get_parameter_full(
                  p_param_code,
                  NULL,                                     -- tenant_id
                  NULL,                                     -- user_id (se usi django_user_id, passalo qui)
                  NULL::integer[],                          -- group id
                  current_setting('app.session_key', true), -- session_key
                  p_function_name
                );

                -- 1.1) Recupero della vera PK dalla catalog table
                SELECT a.attname
                  INTO v_pk_col
                FROM pg_index i
                JOIN pg_class c      ON c.oid = i.indrelid
                JOIN pg_namespace n  ON n.oid = c.relnamespace
                JOIN pg_attribute a  ON a.attrelid = c.oid AND a.attnum = ANY(i.indkey)
                WHERE n.nspname = p_table_schema
                  AND c.relname  = p_table_name
                  AND i.indisprimary
                LIMIT 1;

                IF v_pk_col IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    p_function_name,
                    'E_DEFAULT_ERRATO',
                    jsonb_build_object(
                      'tabella',   p_table_schema||'.'||p_table_name,
                      'parametro', p_param_code,
                      'valore',    v_param_val
                    ),
                    NULL::uuid,
                    -- ⚠️ ARITA' (2026-08-18): passava 2 valori a un messaggio che ne chiede 3
                    --   («la tabella %s parametro %s non ha valori per %s»), e format() alzava
                    --   22023 al posto del P0001. Allineato al SECONDO punto di sollevamento
                    --   di questa stessa funzione (piu' sotto), che era gia' corretto: due
                    --   rami che sollevano lo stesso codice devono passare gli stessi valori,
                    --   o il messaggio funziona da uno solo dei due.
                    --   ⚠️ Resta un difetto di MERITO, non toccato qui: questo ramo scatta
                    --   quando la tabella non ha CHIAVE PRIMARIA, mentre il messaggio dice
                    --   «non ha valori per». E' materia del quarto lato
                    --   (scripts/sql/check_messaggio_vs_condizione.sql), non dell'arita'.
                    p_table_schema||'.'||p_table_name,
                    p_param_code,
                    v_param_val
                  );
                END IF;

                -- 2) Lookup con cast a text sul filtro
                EXECUTE format(
                  'SELECT %I::text FROM %I.%I WHERE %I::text = $1 LIMIT 1',
                  v_pk_col, p_table_schema, p_table_name, p_filter_column
                )
                INTO v_lookup_id
                USING v_param_val;

                -- 3) Se non trovato: log + raise (se la funzione di log non alza da sola)
                IF v_lookup_id IS NULL THEN
                  PERFORM script.fn_log_and_raise_error(
                    'database',
                    p_function_name,
                    'E_DEFAULT_ERRATO',
                    jsonb_build_object(
                      'tabella',   p_table_schema||'.'||p_table_name,
                      'parametro', p_param_code,
                      'valore',    v_param_val
                    ),
                    NULL::uuid,
                      p_table_schema||'.'||p_table_name,
                      p_param_code,
                      v_param_val    
                  );

                END IF;

                RETURN v_lookup_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_default_by_param(p_table_schema text, p_table_name text, p_filter_column text, p_param_code text, p_function_name text)
              IS 'Lookup dinamico di un ID (come TEXT) dato un parametro di configurazione. 
                    1) Ricava il valore del filtro con script.fn_get_parameter_full().
                    2) SELECT pk FROM schema.tabella WHERE filter_column::text = param_value.
                    Se non trova, logga e solleva E_DEFAULT_ERRATO.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Vuoto di proposito: il ripristino della versione precedente
              -- rimetterebbe in servizio la chiamata che alza 22023. Se serve
              -- tornare indietro, si scrive un changeSet in avanti.
              SELECT 1;
