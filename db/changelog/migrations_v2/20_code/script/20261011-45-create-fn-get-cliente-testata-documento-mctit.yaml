# NUOVO: script.fn_get_cliente_testata_documento(p_documento, p_testata_id)
#   Il cliente di un documento, come coppia (soggetto_ruolo, istanza).
#   Brief: brief-db-indirizzi-documento-seguono-il-cliente (§7.2 c)
#
# -- PERCHE' ------------------------------------------------------------
#   E' l'ancora degli indirizzi: un indirizzo d'anagrafica e' del cliente se
#   e' del suo ruolo e, quando e' legato a una fornitura, della sua istanza.
#   Fino a oggi la leggeva solo il backend (get_ancora_indirizzi_documento
#   del mixin dei repository): la colonna nativa se c'e', altrimenti il BA.
#   Qui la stessa ancora, per documento:
#     DDT         destinatario_soggetto_ruolo_id; istanza dal BA (NULL senza BA)
#     ORDINE      soggetto_ruolo_id;              istanza dal BA
#     PREVENTIVO, OFFERTA, CONTRATTO
#                 ruolo dal BA;                   istanza_utility_id nativa
#     FATTURA     ruolo e istanza dal BA (come fn_snapshot_indirizzi_fattura)
#   Col BA, la colonna nativa e il BA coincidono per costruzione (FK composte
#   fk_*_ba_cliente, fk_*_ba_coppia).
#
# -- LA FORMA ------------------------------------------------------------
#   SECURITY DEFINER come script.fn_get_stato_testata_documento, e per la
#   stessa ragione: testate e billing_account hanno la RLS, e un guard che
#   leggesse sotto RLS non distinguerebbe «non c'e'» da «non la vedo».
#   Legge due colonne, non scrive. Zero righe = la testata non c'e'.
#   Selettore ignoto: E_DOC_TIPO_NON_GESTITO (TECNICO), come il gemello.
#   GRANT all'app (il loop di ci_apply lo rifa' uguale).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261011-45-create-fn-get-cliente-testata-documento-mctit.yaml

  - changeSet:
      id: 20261011-45-create-fn-get-cliente-testata-documento
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuovo lettore SECURITY DEFINER script.fn_get_cliente_testata_documento: il cliente di un
        documento come (soggetto_ruolo_id, istanza_utility_id), l'ancora degli indirizzi. Brief:
        brief-db-indirizzi-documento-seguono-il-cliente (§7.2 c).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_cliente_testata_documento(
                  p_documento  text,
                  p_testata_id bigint
              )
              RETURNS TABLE (
                  soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE,
                  istanza_utility_id anagrafiche.billing_account.istanza_utility_id%TYPE
              )
              LANGUAGE plpgsql
              STABLE SECURITY DEFINER
              SET search_path TO 'pg_catalog', 'public', 'pg_temp'
              AS $function$
              -- ⚠️ Tipi nudi DICHIARATI: p_documento e' un selettore senza colonna
              --   di vocabolario; p_testata_id e' POLIMORFO, l'id di sei testate
              --   diverse (lo stesso contratto di script.fn_get_stato_testata_documento).
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Il cliente del documento, SENZA passare dalla RLS di
                --   testate e billing account.
                -- Contratto:
                --   - zero righe -> la testata non esiste;
                --   - una riga   -> soggetto_ruolo_id (NOT NULL sul modello:
                --     nativo NOT NULL su DDT e ordine, BA NOT NULL sugli
                --     altri) e istanza_utility_id (NULL sul DDT senza BA).
                -- =========================================================
                IF p_testata_id IS NULL OR p_testata_id <= 0 THEN
                  RETURN;   -- nessuna riga: il chiamante lo legge come «assente»
                END IF;

                IF p_documento = 'DDT' THEN
                  -- Il destinatario c'e' sempre; col BA ne e' la copia (fk_ddt_ba_cliente).
                  -- Senza BA (causale che non manda merce a un cliente) non c'e'
                  -- una fornitura.
                  RETURN QUERY
                  SELECT d.destinatario_soggetto_ruolo_id, ba.istanza_utility_id
                    FROM vendite.ddt d
                    LEFT JOIN anagrafiche.billing_account ba ON ba.id = d.billing_account_id
                   WHERE d.id = p_testata_id;

                ELSIF p_documento = 'ORDINE' THEN
                  RETURN QUERY
                  SELECT o.soggetto_ruolo_id, ba.istanza_utility_id
                    FROM vendite.ordini o
                    LEFT JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                   WHERE o.id = p_testata_id;

                ELSIF p_documento = 'PREVENTIVO' THEN
                  RETURN QUERY
                  SELECT ba.soggetto_ruolo_id, p.istanza_utility_id
                    FROM vendite.preventivi p
                    LEFT JOIN anagrafiche.billing_account ba ON ba.id = p.billing_account_id
                   WHERE p.id = p_testata_id;

                ELSIF p_documento = 'OFFERTA' THEN
                  RETURN QUERY
                  SELECT ba.soggetto_ruolo_id, o.istanza_utility_id
                    FROM vendite.offerte_commerciali o
                    LEFT JOIN anagrafiche.billing_account ba ON ba.id = o.billing_account_id
                   WHERE o.id = p_testata_id;

                ELSIF p_documento = 'CONTRATTO' THEN
                  RETURN QUERY
                  SELECT ba.soggetto_ruolo_id, c.istanza_utility_id
                    FROM vendite.contratti c
                    LEFT JOIN anagrafiche.billing_account ba ON ba.id = c.billing_account_id
                   WHERE c.id = p_testata_id;

                ELSIF p_documento = 'FATTURA' THEN
                  -- Lo stesso BA da cui fn_snapshot_indirizzi_fattura risolve.
                  RETURN QUERY
                  SELECT ba.soggetto_ruolo_id, ba.istanza_utility_id
                    FROM vendite.fatture f
                    LEFT JOIN anagrafiche.billing_account ba ON ba.id = f.billing_account_id
                   WHERE f.id = p_testata_id;

                ELSE
                  -- Errore di CHIAMANTE, non di dato: come il gemello dello stato.
                  PERFORM script.fn_log_and_raise_error(
                    'script',
                    'fn_get_cliente_testata_documento',
                    'E_DOC_TIPO_NON_GESTITO',
                    jsonb_build_object('documento',  p_documento,
                                       'testata_id', p_testata_id),
                    NULL::uuid,
                    COALESCE(p_documento, '<null>'));
                END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_cliente_testata_documento(text, bigint)
              IS 'Lettore SECURITY DEFINER del cliente di un documento, l''ancora dei suoi indirizzi: (soggetto_ruolo_id, istanza_utility_id). DDT: destinatario e istanza del BA (NULL senza BA). ORDINE: soggetto_ruolo_id e istanza del BA. PREVENTIVO, OFFERTA, CONTRATTO: ruolo del BA e istanza nativa. FATTURA: ruolo e istanza del BA, come vendite.fn_snapshot_indirizzi_fattura. Col BA colonna nativa e BA coincidono per costruzione (fk_*_ba_cliente, fk_*_ba_coppia). E'' la stessa ancora che il backend leggeva da solo (get_ancora_indirizzi_documento). ⛔ SECURITY DEFINER come script.fn_get_stato_testata_documento: testate e billing_account hanno la RLS, e un guard che leggesse sotto RLS non distinguerebbe «non c''e''» da «non la vedo». Zero righe = testata assente. Selettore ignoto: E_DOC_TIPO_NON_GESTITO (TECNICO). Chiamanti: vendite.trgfn_doc_indirizzi_guard_cliente, vendite.fn_doc_indirizzo_default, vendite.trgfn_doc_indirizzi_seguono_cliente, script.fn_check_indirizzi_documento_cliente. Brief: brief-db-indirizzi-documento-seguono-il-cliente (§7.2 c).';

              GRANT EXECUTE ON FUNCTION script.fn_get_cliente_testata_documento(text, bigint) TO zeroerp_app;
