# R-1 (3 di 4) — «SI PUO' REGISTRARE?» IN UNA FUNZIONE PURA, CHE MADRE E PULSANTE CONDIVIDONO
#   script.fn_check_documento_interno_registrabile(p_famiglia, p_documento_id) RETURNS jsonb
#   Brief: brief-db-magazzino-lotto-2-bis-be-fe, R-1 punto 2 (terna can_registra)
#
# -- LA DOMANDA CHE VIENE PRIMA (AGENTS.md) ------------------------------------------------------
#   «Questa regola deve anche accendere o spegnere un pulsante nel frontend?»
#   Si': il drawer dei documenti interni ha il pulsante «Registra», e quando e'
#   spento deve dire PERCHE' (linee-guida-sql §12.1). Allora il predicato va in
#   una fn_check_* e la madre la CHIAMA (§12.5.2) — non il contrario, e non due
#   copie. Il brief del BE lo proponeva come alternativa («se preferite... e' la
#   forma di casa»): e' la forma di casa, e la scelgo per questo.
#
# -- I TRE MOTIVI SONO ESATTAMENTE I TRE RIFIUTI DELLA MADRE --------------------------------------
#   1) lo stato non e' CONFIRM      -> E_MAG_DOCUMENTO_TRANSIZIONE_NON_AMMESSA
#      ⚠️ un codice, ma TRE motivi: da confermare (DRAFT), gia' registrato
#      (POSTED), annullato (CANCEL). Il codice sceglie la frase dell'errore, il
#      `reason` sceglie il tooltip del pulsante — e «non e' confermato» detto di
#      un documento gia' registrato sarebbe falso (§12.1: un motivo sbagliato e'
#      peggio di nessun motivo). Trovato provando la funzione, non scrivendola.
#   2) nessuna riga                 -> E_MAG_DOCUMENTO_SENZA_RIGHE
#   3) una riga che la primitiva rifiuterebbe -> il codice del PRIMO motivo di
#      script.fn_check_riga_magazzino, cioe' la stessa funzione che
#      magazzino.fn_scrivi_movimento chiama al passo 5-8.
#   ⭐ Il `codice` e i `valori` del terzo motivo sono quelli della RIGA: cosi' la
#   frase che l'operatore legge resta identica a quella di prima (i pgTAP del
#   Lotto 2 la pinnano con throws_like). Cambia solo il vestito che serve al
#   pulsante — `reason` e `reason_key` sono quelli del documento, perche' il
#   tooltip dice «ci sono righe che non si possono registrare», non il dettaglio
#   della singola riga, che sta nel dettaglio e nella lista delle righe.
#
# -- PRECEDENZA DICHIARATA, E USCITA ANTICIPATA (linee-guida-sql §12.2 punto 3) -------------------
#   stato > righe > postabilita'. Non si accumulano: su un documento in DRAFT
#   contare le righe e interrogare il piano sarebbe lavoro speso per un motivo
#   che nessuno leggera' — e il primo motivo e' quello che la madre solleva.
#
# -- PARAMETRICA SU DUE FAMIGLIE, COME IL GUARD ---------------------------------------------------
#   p_famiglia INVENTARIO | RETTIFICA: una regola sola per le due famiglie
#   (D-L2-h), due tabelle diverse. Per questo p_documento_id e' `bigint` e non
#   un %TYPE: non e' la colonna di UNA tabella. Una famiglia sconosciuta non e'
#   un dato di una persona, e' un chiamante rotto: E_MAG_CHIAMATA_NON_VALIDA.
#
# -- SOTTO RLS, E NON SI RISPONDE «SI PUO'» SU CIO' CHE NON SI VEDE -------------------------------
#   INVOKER: un documento fuori perimetro NON C'E'. Rispondere [] sarebbe un
#   fail-open silenzioso; si solleva E_MAG_DOCUMENTO_NON_TROVATO, lo stesso
#   codice e la stessa frase della madre (stampo: fn_check_contabile_validabile).
#   La capability, che non deve sollevare, guarda PRIMA la testata e torna NULL.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260922-20-create-fn-check-documento-interno-registrabile-mctit.yaml

  - changeSet:
      id: 20260922-20-create-fn-check-documento-interno-registrabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_documento_interno_registrabile(p_famiglia, p_documento_id): i motivi che
        impediscono di registrare un inventario o una rettifica (stato non CONFIRM, nessuna riga,
        una riga non postabile), come array ordinato {codice, reason, reason_key, dettaglio,
        valori}. Pura, STABLE, INVOKER: la chiamano le due madri del posting e le due capability.
        Brief: brief-db-magazzino-lotto-2-bis-be-fe, R-1.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_riga_magazzino';
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'magazzino' AND p.proname = 'fn_inventario_piano';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_documento_interno_registrabile(
                  p_famiglia     text,
                  p_documento_id bigint
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: elencare i motivi che impediscono di REGISTRARE un documento
              --        interno di magazzino — un inventario o una rettifica. Funzione
              --        PURA (fn_check_*): nessuna scrittura, nessun raise di dominio
              --        salvo i due guard di chiamata (parametro, documento non letto).
              -- Consumatori: magazzino.fn_posta_inventario e magazzino.fn_posta_rettifica,
              --        che sollevano il codice del PRIMO motivo, e
              --        script.fn_available_actions_inventario / _rettifica, che dallo
              --        stesso primo motivo accendono o spengono «Registra» con la sua
              --        reason_key. Una sede sola: il pulsante non puo' promettere cio'
              --        che la madre rifiutera' (linee-guida-sql §12.1, §12.5.2).
              -- Ritorna: [] se si puo' registrare, altrimenti array ORDINATO di
              --        {codice, reason, reason_key, dettaglio, valori}.
              -- Precedenza DICHIARATA (§12.2 punto 3): stato > righe > postabilita'.
              --        Si esce al primo motivo: gli altri parlerebbero di un documento
              --        che comunque non si registra, e il lavoro (il piano) non e'
              --        gratis.
              -- ⚠️ p_documento_id e' `bigint` e non un %TYPE, ed e' voluto: la funzione
              --        e' PARAMETRICA su due tabelle (inventari, rettifiche), come il
              --        guard di famiglia. Il %TYPE di una delle due direbbe una cosa
              --        falsa dell'altra.
              -- Brief: brief-db-magazzino-lotto-2-bis-be-fe R-1;
              --        brief-db-magazzino-lotto-2-motore sezione 4.5 (le due madri).
              DECLARE
                  v_motivi       jsonb := '[]'::jsonb;
                  v_magazzino_id magazzino.inventari.magazzino_id%TYPE;
                  v_stato        text;
                  v_n_righe      bigint;
                  v_riga_id      magazzino.inventari_righe.id%TYPE;
                  v_articolo_id  magazzino.inventari_righe.articolo_id%TYPE;
                  v_lotto_id     magazzino.inventari_righe.lotto_id%TYPE;
                  v_asset_id     magazzino.inventari_righe.asset_id%TYPE;
                  v_ubicazione   magazzino.inventari_righe.ubicazione_id%TYPE;
                  v_motivi_riga  jsonb;
                  v_primo        jsonb;
              BEGIN
                  -- ⛔ Guard di PARAMETRO: forme che nessuna interfaccia produce. TECNICO,
                  --    e non E_PARAMETRO_INVALIDO, che e' un debito e non una sede.
                  IF p_famiglia IS NULL
                     OR p_famiglia NOT IN ('INVENTARIO', 'RETTIFICA')
                     OR p_documento_id IS NULL OR p_documento_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_check_documento_interno_registrabile',
                          'E_MAG_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('detail', 'famiglia INVENTARIO o RETTIFICA, documento maggiore di zero',
                                             'p_famiglia', p_famiglia,
                                             'p_documento_id', p_documento_id),
                          NULL::uuid,
                          'script.fn_check_documento_interno_registrabile',
                          'p_famiglia (INVENTARIO | RETTIFICA), p_documento_id (obbligatorio, maggiore di zero)');
                  END IF;

                  -- La testata, sotto RLS. ⚠️ «Non trovata» vuol dire «non esiste» oppure
                  -- «non e' nel tuo perimetro», e le due risposte restano indistinguibili
                  -- (convenzione no-leak).
                  IF p_famiglia = 'INVENTARIO' THEN
                      SELECT i.magazzino_id, i.stato_mag_inventario
                        INTO v_magazzino_id, v_stato
                        FROM magazzino.inventari i
                       WHERE i.id = p_documento_id;
                  ELSE
                      SELECT t.magazzino_id, t.stato_mag_rettifiche
                        INTO v_magazzino_id, v_stato
                        FROM magazzino.rettifiche t
                       WHERE t.id = p_documento_id;
                  END IF;

                  -- ⛔ Non si risponde [] su un documento che non si legge: sarebbe «si
                  --    puo' registrare» detto di una cosa che non si vede. Stesso codice
                  --    e stessa frase della madre. (Lo stato e' NOT NULL: NULL qui vuol
                  --    dire che la riga non c'e'.)
                  IF v_stato IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_check_documento_interno_registrabile',
                          'E_MAG_DOCUMENTO_NON_TROVATO',
                          jsonb_build_object('famiglia', p_famiglia, 'documento_id', p_documento_id),
                          NULL::uuid,
                          p_documento_id::text);
                  END IF;

                  -- ============================================================
                  -- MOTIVO 1 — lo stato: si registra da CONFIRM, e solo da li'.
                  -- ============================================================
                  IF v_stato <> 'CONFIRM' THEN
                      -- ⚠️ Il CODICE e' uno solo — e' quello che la madre solleva, e la
                      --    frase per l'operatore e' la sua. Ma il `reason` che accende il
                      --    tooltip del pulsante NO: «il documento non e' confermato»
                      --    detto di un documento GIA' REGISTRATO e' una frase falsa, e un
                      --    motivo sbagliato e' peggio di nessun motivo (§12.1). Tre stati,
                      --    tre motivi: da fare (DRAFT), gia' fatto (POSTED), non si fa piu'
                      --    (CANCEL).
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_MAG_DOCUMENTO_TRANSIZIONE_NON_AMMESSA',
                          'reason',     CASE v_stato
                                            WHEN 'POSTED' THEN 'DOCUMENTO_GIA_REGISTRATO'
                                            WHEN 'CANCEL' THEN 'DOCUMENTO_ANNULLATO'
                                            ELSE 'DOCUMENTO_NON_CONFERMATO'
                                        END,
                          'reason_key', CASE v_stato
                                            WHEN 'POSTED' THEN 'magazzino.documenti_interni.registra_reason.gia_registrato'
                                            WHEN 'CANCEL' THEN 'magazzino.documenti_interni.registra_reason.annullato'
                                            ELSE 'magazzino.documenti_interni.registra_reason.non_confermato'
                                        END,
                          'dettaglio',  jsonb_build_object('detail', 'il posting parte da CONFIRM',
                                                           'famiglia', p_famiglia,
                                                           'documento_id', p_documento_id,
                                                           'stato', v_stato),
                          -- «Il documento e' in stato %s: il passaggio a %s non e' ammesso.»
                          'valori',     jsonb_build_array(v_stato, 'POSTED'));
                      RETURN v_motivi;
                  END IF;

                  -- ============================================================
                  -- MOTIVO 2 — almeno una riga: un documento vuoto non registra niente.
                  -- ============================================================
                  IF p_famiglia = 'INVENTARIO' THEN
                      SELECT count(*) INTO v_n_righe
                        FROM magazzino.inventari_righe r
                       WHERE r.inventario_id = p_documento_id;
                  ELSE
                      SELECT count(*) INTO v_n_righe
                        FROM magazzino.rettifiche_righe r
                       WHERE r.rettifica_id = p_documento_id;
                  END IF;

                  IF v_n_righe = 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_MAG_DOCUMENTO_SENZA_RIGHE',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'magazzino.documenti_interni.registra_reason.senza_righe',
                          'dettaglio',  jsonb_build_object('famiglia', p_famiglia,
                                                           'documento_id', p_documento_id),
                          -- «Il documento %s non ha righe: niente da registrare.»
                          'valori',     jsonb_build_array(p_documento_id::text));
                      RETURN v_motivi;
                  END IF;

                  -- ============================================================
                  -- MOTIVO 3 — la prima riga che la primitiva rifiuterebbe.
                  --   Inventario: dal PIANO (fn_inventario_piano), che e' la sede che
                  --   fn_posta_inventario legge — l'esito NON_POSTABILE lo calcola gia'
                  --   con script.fn_check_riga_magazzino.
                  --   Rettifica: non ha un piano (i delta sono dati), quindi la stessa
                  --   check riga per riga, in ordine di id: la prima che parla vince.
                  -- ============================================================
                  IF p_famiglia = 'INVENTARIO' THEN
                      SELECT pi.riga_id, pi.articolo_id, pi.lotto_id, pi.asset_id, pi.ubicazione_id
                        INTO v_riga_id, v_articolo_id, v_lotto_id, v_asset_id, v_ubicazione
                        FROM magazzino.fn_inventario_piano(p_documento_id) pi
                       WHERE pi.esito = 'NON_POSTABILE'
                         AND pi.riga_id IS NOT NULL
                       ORDER BY pi.riga_id
                       LIMIT 1;
                  ELSE
                      SELECT r.id, r.articolo_id, r.lotto_id, r.asset_id, r.ubicazione_id
                        INTO v_riga_id, v_articolo_id, v_lotto_id, v_asset_id, v_ubicazione
                        FROM magazzino.rettifiche_righe r
                       WHERE r.rettifica_id = p_documento_id
                         AND jsonb_array_length(
                                 script.fn_check_riga_magazzino(v_magazzino_id, r.articolo_id,
                                                                r.lotto_id, r.asset_id, r.ubicazione_id)) > 0
                       ORDER BY r.id
                       LIMIT 1;
                  END IF;

                  IF v_riga_id IS NOT NULL THEN
                      -- Il motivo della riga, dalla STESSA funzione che la primitiva
                      -- chiama: il codice e i valori restano i suoi, cosi' la frase che
                      -- l'operatore legge e' quella di sempre.
                      v_motivi_riga := script.fn_check_riga_magazzino(
                                           v_magazzino_id, v_articolo_id,
                                           v_lotto_id, v_asset_id, v_ubicazione);
                      v_primo := v_motivi_riga -> 0;

                      IF v_primo IS NOT NULL THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     v_primo ->> 'codice',
                              -- reason e reason_key sono del DOCUMENTO: il tooltip del
                              -- pulsante dice che ci sono righe da sistemare, il dettaglio
                              -- della singola riga sta nella lista delle righe (e qui sotto).
                              'reason',     'RIGHE_NON_POSTABILI',
                              'reason_key', 'magazzino.documenti_interni.registra_reason.righe_non_postabili',
                              'dettaglio',  COALESCE(v_primo -> 'dettaglio', '{}'::jsonb)
                                            || jsonb_build_object('famiglia', p_famiglia,
                                                                  'documento_id', p_documento_id,
                                                                  'riga_id', v_riga_id,
                                                                  'riga_reason', v_primo ->> 'reason',
                                                                  'riga_reason_key', v_primo ->> 'reason_key'),
                              'valori',     COALESCE(v_primo -> 'valori', '[]'::jsonb));
                      END IF;
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_documento_interno_registrabile(text, bigint) IS
                  'I motivi che impediscono di REGISTRARE un documento interno di magazzino '
                  '(p_famiglia = INVENTARIO | RETTIFICA). Funzione PURA: torna [] se si puo'' '
                  'registrare, altrimenti un array ORDINATO di {codice, reason, reason_key, '
                  'dettaglio, valori}. I motivi sono i TRE rifiuti delle madri del posting, in '
                  'quest''ordine (precedenza dichiarata, si esce al primo): stato diverso da '
                  'CONFIRM (E_MAG_DOCUMENTO_TRANSIZIONE_NON_AMMESSA, con reason '
                  'DOCUMENTO_NON_CONFERMATO | DOCUMENTO_GIA_REGISTRATO | '
                  'DOCUMENTO_ANNULLATO secondo lo stato: un codice, tre tooltip), nessuna riga '
                  '(E_MAG_DOCUMENTO_SENZA_RIGHE), una riga che la primitiva rifiuterebbe — li'' '
                  'il `codice` e i `valori` sono quelli del PRIMO motivo di '
                  'script.fn_check_riga_magazzino (la stessa funzione che '
                  'magazzino.fn_scrivi_movimento chiama), mentre `reason` e `reason_key` sono '
                  'del documento (RIGHE_NON_POSTABILI). ⭐ La chiamano le due madri '
                  '(fn_posta_inventario, fn_posta_rettifica) e le due capability '
                  '(script.fn_available_actions_inventario / _rettifica): una sede sola, perche'' '
                  'un pulsante non puo'' promettere cio'' che la madre rifiutera'' '
                  '(linee-guida-sql §12.1, §12.5.2). INVOKER e STABLE: sotto RLS un documento '
                  'fuori perimetro NON C''E'' e si solleva E_MAG_DOCUMENTO_NON_TROVATO, mai [] '
                  '(sarebbe un fail-open). Brief: brief-db-magazzino-lotto-2-bis-be-fe R-1.';

              GRANT EXECUTE ON FUNCTION script.fn_check_documento_interno_registrabile(text, bigint) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_documento_interno_registrabile(text, bigint);
