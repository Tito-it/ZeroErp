# ------------------------------------------------------------
# Le due gemelle dello scope-array: intersezione con l'emittente attivo e
#   chiusura di un fail-open
#   (brief-db-impersonazione-scope-emittente.md §4.2, §8.4, §8.5).
#
# ⚠️ SI CORREGGONO INSIEME, IN UN SOLO changeSet: _sr_ids e' un wrapper di
#   _pk_ids e la loro semantica dei sentinel (NULL = tutto, '{}' = niente) deve
#   restare identica. Separarle inviterebbe a sistemarne una e dimenticare
#   l'altra — che e' esattamente il difetto che questo changeSet chiude.
#
# --- fn_get_emittenti_scope_pk_ids: intersezione, a uscita unica -------------
#
# Il brief chiede l'intersezione «in coda, dopo i rami esistenti». Non e'
#   implementabile alla lettera: i rami esistenti fanno RETURN anticipato e il
#   super admin esce con NULL al secondo, senza mai raggiungere la coda — cioe'
#   proprio il caso che deve cambiare. La funzione passa quindi a USCITA UNICA:
#   si calcola lo scope come oggi, poi si interseca in un punto solo.
#
#   Con emittente attivo = X:
#     no identita OPERATORE  -> '{}'   invariato (la selezione non allarga)
#     super admin (NULL)     -> '{X}'  NULL e' l'universo: universo ∩ {X} = {X}
#     whitelist {A,B}        -> '{X}' se X ∈ {A,B}, altrimenti '{}'
#     whitelist vuota (NULL) -> '{X}'  stesso ragionamento del super admin
#
#   Il ramo «no identita OPERATORE» resta un RETURN anticipato: '{}' e' gia' il
#   valore piu' restrittivo possibile, intersecarlo non lo cambierebbe.
#
# --- fn_get_emittenti_scope_sr_ids: il fail-open --------------------------
#
# ⚠️ Il brief da' per scontato che il wrapper «erediti gratis». Eredita anche un
#   fail-OPEN: la mappatura PK -> soggetto_ruolo_id usa array_agg, e array_agg
#   su ZERO righe ritorna NULL — che per contratto significa «nessuna
#   restrizione», cioe' vede tutto. Verificato: con ef.id = ANY('{999999}') il
#   ritorno e' NULL.
#
#   Oggi e' irraggiungibile perche' i PK vengono da user_emittenti_fiscali, che
#   ha la FK verso emittenti_fiscali. Con l'emittente attivo il PK diventa un
#   numero che arriva da fuori (claim JWT): un id inesistente — token stale, bug
#   lato BE — farebbe ALLARGARE invece di restringere, violando l'invariante del
#   §2 su cui poggia la decisione di non validare la GUC nel database.
#
#   Il rimedio e' un coalesce: zero righe mappate -> '{}' (fail-closed). La
#   regola generale, che vale oltre questo caso: una funzione di sicurezza non
#   deve dipendere da una FK altrove per restare chiusa. Se domani il valore
#   arriva da un'altra strada, il buco si riapre da solo e in silenzio.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-14-update-fn-get-emittenti-scope-ids-attivo-mctit.yaml

  - changeSet:
      id: 20260804-14-update-fn-get-emittenti-scope-ids-attivo
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_get_emittenti_scope_pk_ids passa a uscita unica e interseca con
        l'emittente attivo (GUC app.current_emittente_id); il wrapper
        fn_get_emittenti_scope_sr_ids diventa fail-closed quando la mappatura
        PK -> soggetto_ruolo_id non trova righe (prima ritornava NULL = tutto).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'script'
                AND p.proname IN ('fn_get_emittenti_scope_pk_ids',
                                  'fn_get_emittenti_scope_sr_ids')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_emittenti_scope_pk_ids(
                  p_auth_user_id integer
              )
              RETURNS bigint[]
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_ids    bigint[];
                  v_attivo bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scope emittenti per i filtri su colonne PK.
                  --   Semantica: NULL = tutto, '{}' = nessuno, array = whitelist.
                  --
                  -- Struttura (rev 2026-08-04): USCITA UNICA. Prima si calcola
                  -- lo scope "di diritto" (super admin / whitelist), poi lo si
                  -- interseca con l'emittente attivo in un solo punto. I RETURN
                  -- anticipati di prima rendevano impossibile intersecare il
                  -- ramo super admin, che e' proprio quello da restringere.
                  -- =========================================================

                  v_attivo := NULLIF(
                                  current_setting('app.current_emittente_id', true),
                                  ''
                              )::bigint;

                  -- 1. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  --    '{}' e' gia' il valore piu' restrittivo: nessuna
                  --    intersezione potrebbe cambiarlo, esce subito.
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN '{}'::bigint[];
                  END IF;

                  -- 2. Scope di diritto.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      -- Nessuna restrizione: NULL = universo.
                      v_ids := NULL;
                  ELSE
                      -- OPERATIVO: whitelist PK reale. Lettura diretta da
                      -- user_emittenti_fiscali (la colonna e' gia' la PK).
                      -- NULL (whitelist vuota) = nessuna restrizione
                      -- (parita' con _sr_ids).
                      SELECT array_agg(uef.emittente_fiscale_id)
                        INTO v_ids
                        FROM config.user_emittenti_fiscali uef
                       WHERE uef.auth_user_id = p_auth_user_id;
                  END IF;

                  -- 3. Intersezione con l'emittente attivo (uscita unica).
                  IF v_attivo IS NULL THEN
                      RETURN v_ids;                      -- nessuna impersonazione
                  END IF;

                  IF v_ids IS NULL THEN
                      RETURN ARRAY[v_attivo];            -- universo ∩ {X} = {X}
                  END IF;

                  IF v_attivo = ANY(v_ids) THEN
                      RETURN ARRAY[v_attivo];            -- {A,B} ∩ {X}, X presente
                  END IF;

                  RETURN '{}'::bigint[];                 -- X fuori scope: nessuno
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_emittenti_scope_pk_ids(p_auth_user_id integer)
              IS 'Scope emittenti per filtri su colonne PK (emittenti_fiscali.id). Semantica: NULL=tutto, ''{}''=nessuno, array=whitelist. Identita OPERATORE mancante -> []; SUPER_ADMIN -> NULL; altrimenti whitelist PK. Post 2026-08-04: uscita unica e intersezione con la GUC app.current_emittente_id (universo ∩ {X} = {X}; whitelist senza X -> []). Gemella di fn_get_emittenti_scope_sr_ids (che e'' un wrapper su questa). Vedi guida soggetti-e-ruoli §5b.';

              CREATE OR REPLACE FUNCTION script.fn_get_emittenti_scope_sr_ids(
                  p_auth_user_id integer
              )
              RETURNS bigint[]
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_pk_ids bigint[];
                  v_sr_ids bigint[];
              BEGIN
                  -- 1. Delega tutti i guard alla fn canonica _pk_ids
                  --    (compresa l'intersezione con l'emittente attivo).
                  v_pk_ids := script.fn_get_emittenti_scope_pk_ids(p_auth_user_id);

                  -- 2. Pass-through dei sentinel.
                  IF v_pk_ids IS NULL THEN
                      -- Nessuna restrizione.
                      RETURN NULL;
                  END IF;

                  IF cardinality(v_pk_ids) = 0 THEN
                      -- No identita OPERATORE attiva, oppure emittente attivo
                      -- fuori dalla whitelist: nessun accesso.
                      RETURN '{}'::bigint[];
                  END IF;

                  -- 3. Mappatura PK -> SR id via JOIN su emittenti_fiscali.
                  --    coalesce OBBLIGATORIO: array_agg su zero righe ritorna
                  --    NULL, che qui significherebbe "vede tutto". Prima dei PK
                  --    provenienti dalla GUC il caso era irraggiungibile (FK su
                  --    user_emittenti_fiscali); ora un id inesistente
                  --    allargherebbe invece di restringere. Fail-closed.
                  SELECT coalesce(array_agg(ef.soggetto_ruolo_id), '{}'::bigint[])
                    INTO v_sr_ids
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.id = ANY(v_pk_ids);

                  RETURN v_sr_ids;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_emittenti_scope_sr_ids(p_auth_user_id integer)
              IS 'Wrapper su fn_get_emittenti_scope_pk_ids (refactor 2026-05-02). Mappa PK reali -> soggetto_ruolo_id per query su colonne <ruolo>_soggetto_ruolo_id (fatture, ordini, commesse, listini, BA scope, search universale). Semantica: NULL=tutto, ''{}''=nessuno, array=whitelist. Single source of truth dei guard nella fn _pk_ids. Post 2026-08-04: mappatura a vuoto -> ''{}'' e non NULL (fail-closed su emittente attivo inesistente). Vedi guida soggetti-e-ruoli §5b per quando usare _sr_ids vs _pk_ids.';
