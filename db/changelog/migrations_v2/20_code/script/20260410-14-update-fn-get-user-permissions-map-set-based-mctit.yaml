# Liquibase changelog per Zero ERP
# UPDATE script.fn_get_user_permissions_map
# Refactor set-based: elimina il loop per area e risolve
# i livelli in una sola query.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260410-14-update-fn-get-user-permissions-map-set-based-mctit.yaml

  - changeSet:
      id: 20260410-14-update-fn-get-user-permissions-map-set-based
      author: mctit
      comment: >
        Refactor set-based di fn_get_user_permissions_map.
        Elimina il loop su config.aree_funzionali e calcola la mappa
        JSONB in una sola query, leggendo una sola volta ruolo_sistema
        e unita_organizzativa_id.
      runOnChange: false
      preConditions:
        - onFail: HALT
        - tableExists:
            schemaName: config
            tableName: aree_funzionali
        - tableExists:
            schemaName: config
            tableName: user_override_aree
        - tableExists:
            schemaName: config
            tableName: profili_reparto_aree
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              CREATE OR REPLACE FUNCTION script.fn_get_user_permissions_map(
                  p_auth_user_id  anagrafiche.risorse_umane_auth_user.auth_user_id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              DECLARE
                  v_ruolo  anagrafiche.risorse_umane_auth_user.ruolo_sistema%TYPE;
                  v_uo_id  anagrafiche.risorse_umane.unita_organizzativa_id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Restituisce la mappa livello accesso per tutte le aree
                  --   funzionali attive, in un solo roundtrip DB.
                  --
                  -- Parametri:
                  --   p_auth_user_id: ID utente Django (auth_user.id)
                  --
                  -- Ritorna:
                  --   JSONB { "anagrafiche": "TUTTO", "vendite": "LETTURA", ... }
                  --
                  -- Catena:
                  --   1. ruolo_sistema (NULL/DISABILITATO -> BLOCCATO, ADMIN -> TUTTO)
                  --   2. Override utente area (se presente e valido)
                  --   3. Profilo reparto (ereditato dalla UO)
                  --   4. Default -> BLOCCATO
                  --
                  -- Ottimizzazione:
                  --   Nessun loop PL/pgSQL per area. Ruolo e UO vengono letti
                  --   una sola volta, poi la mappa viene costruita in forma
                  --   set-based con LEFT JOIN su override e profilo reparto.
                  -- =========================================================

                  -- Guard: parametro obbligatorio
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_user_permissions_map',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          'p_auth_user_id obbligatorio e > 0.'
                      );
                  END IF;

                  -- Lettura contesto utente una sola volta
                  SELECT rau.ruolo_sistema,
                         ru.unita_organizzativa_id
                    INTO v_ruolo,
                         v_uo_id
                    FROM anagrafiche.risorse_umane_auth_user rau
                    LEFT JOIN anagrafiche.risorse_umane ru
                      ON ru.id = rau.risorsa_umana_id
                   WHERE rau.auth_user_id = p_auth_user_id;

                  RETURN (
                      SELECT COALESCE(
                          jsonb_object_agg(
                              af.schema_db,
                              CASE
                                  WHEN v_ruolo IS NULL OR v_ruolo = 'DISABILITATO'
                                      THEN 'BLOCCATO'
                                  WHEN v_ruolo = 'ADMIN'
                                      THEN 'TUTTO'
                                  ELSE COALESCE(
                                      uoa.livello,
                                      pra.livello,
                                      'BLOCCATO'::config.livello_accesso
                                  )::text
                              END
                          ),
                          '{}'::jsonb
                      )
                        FROM config.aree_funzionali af
                        LEFT JOIN config.user_override_aree uoa
                          ON uoa.auth_user_id = p_auth_user_id
                         AND uoa.area_id = af.id
                         AND (uoa.valido_dal IS NULL OR uoa.valido_dal <= CURRENT_DATE)
                         AND (uoa.valido_al  IS NULL OR uoa.valido_al  >= CURRENT_DATE)
                        LEFT JOIN config.profili_reparto_aree pra
                          ON pra.unita_organizzativa_id = v_uo_id
                         AND pra.area_id = af.id
                       WHERE af.attivo = TRUE
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_user_permissions_map(integer)
                IS 'Mappa permessi utente: JSONB {schema_db: livello_accesso} per tutte le aree funzionali attive. Refactor set-based: nessun loop PL/pgSQL, legge ruolo_sistema e UO una sola volta.';
