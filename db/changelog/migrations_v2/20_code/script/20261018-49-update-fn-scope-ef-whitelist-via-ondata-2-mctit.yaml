# GLI ADATTATORI DI MAGAZZINO, PRATICHE, DOCUMENTI E BILLING ACCOUNT
#   script.fn_scope_ef_whitelist_via_{asset, documento_generato, efba,
#   evento_asset, flusso, inventario, magazzino, movimento, pratica,
#   rettifica, trasferimento}
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5quinquies, D-3b-2 ondata 2.
#
# Dieci a emittente singolo: canonica(utente, fn_resolve_emittente_fiscale_id
# ('<modo>', chiave)), come i 21 di vendite (20261018-32).
# via_efba: un BA ha un emittente, ma quale lo dice
# script.fn_get_ba_emittente_sr_id (legame, altrimenti l'emittente
# dell'utente in sessione, altrimenti il default): non e' un fatto della
# riga, quindi non un modo del risolutore. Diventa la composizione delle sue
# policy (20261018-50): fn_scope_ef_perimetro(fn_get_emittenti_scope_sr_ids,
# fn_get_ba_emittente_sr_id), in convenzione soggetto_ruolo — da plpgsql a
# sql, stessa logica (NULL = tutti, '{}' = nessuno, BA senza emittente =
# false). via_coppia resta com'e' (chiama via_efba).
# Firme %TYPE, COST 5000, STABLE, INVOKER. Rollback: i corpi vivi.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261018-49-update-fn-scope-ef-whitelist-via-ondata-2-mctit.yaml

  - changeSet:
      id: 20261018-49-update-fn-scope-ef-whitelist-via-ondata-2
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Gli 11 adattatori di magazzino, pratiche, documenti e billing account: l'emittente dal risolutore (via_efba: la composizione delle sue policy). Stesse risposte. D-3b-2 ondata 2.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 11
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.pronamespace = 'script'::regnamespace
                 AND p.proname ~ '^fn_scope_ef_whitelist_via_(asset|documento_generato|efba|evento_asset|flusso|inventario|magazzino|movimento|pratica|rettifica|trasferimento)$'
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_resolve_emittente_fiscale_id(text,bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_asset(
                  p_auth_user_id config.user_emittenti_fiscali.auth_user_id%TYPE,
                  p_asset_id magazzino.assets.id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: l'utente vede l'emittente della chiave (asset)? La
                  --   domanda su UN emittente, per chi non sta in una policy (verbi, guard,
                  --   backend): la regola e' della canonica, l'emittente del risolutore.
                  -- ⭐ Rev 2026-10-18 (20261018-49, D-3b-2 ondata 2): l'emittente si chiede a
                  --   script.fn_resolve_emittente_fiscale_id('asset', ...), DEFINER, invece di
                  --   leggerlo sotto la RLS del padre: una strada sola, e nessuna policy del
                  --   padre rieseguita a ogni chiamata. Stesse risposte. Le policy non passano
                  --   piu' di qui (20261018-50).
                  SELECT script.fn_check_user_emittente_scope(
                      p_auth_user_id,
                      script.fn_resolve_emittente_fiscale_id('asset', p_asset_id))
              $function$;

