            sql: |
              DO $c$
              DECLARE
                  f regprocedure;
              BEGIN
                  FOR f IN
                      SELECT p.oid::regprocedure FROM pg_catalog.pg_proc p
                       WHERE p.pronamespace = 'script'::regnamespace
                         AND p.proname ~ '^fn_scope_ef_whitelist_via_(asset|documento_generato|efba|evento_asset|flusso|inventario|magazzino|movimento|pratica|rettifica|trasferimento)$'
                  LOOP
                      EXECUTE format('COMMENT ON FUNCTION %s IS %L', f,
                          '⭐ rev 2026-10-18 (20261018-49, D-3b-2 ondata 2): l''emittente dal risolutore DEFINER (via_efba: dalla composizione delle policy, in convenzione soggetto_ruolo); una strada sola, nessuna policy del padre per chiamata. Stesse risposte. ' || coalesce(obj_description(f, 'pg_proc'), ''));
                  END LOOP;
              END
              $c$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_asset(p_auth_user_id integer, p_asset_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro emittente di un asset, che porta l'emittente in
                  --   proprio (un asset presso un cliente non e' in nessun magazzino).
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT a.emittente_fiscale_id
                         FROM magazzino.assets a
                        WHERE a.id = p_asset_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_documento_generato(p_auth_user_id integer, p_documento_generato_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro
                  --   l'emittente del documento generato a cui la riga
                  --   appartiene.
                  -- ⭐ Delega alla CANONICA, non a un altro adattatore: la
                  --   testata porta `emittente_fiscale_id` NOT NULL, quindi la
                  --   risalita e' di un anello solo — ed e' esattamente cio'
                  --   che fa rls_documenti_generati_ef_whitelist, cosi' il
                  --   satellite e la testata non possono divergere.
                  -- ⚠️ Documento inesistente -> emittente NULL -> la canonica
                  --   risponde false quando la whitelist e' valorizzata:
                  --   fail-closed, come tutta la famiglia.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT dg.emittente_fiscale_id
                         FROM documenti.documenti_generati dg
                        WHERE dg.id = p_documento_generato_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_efba(p_auth_user_id integer, p_billing_account_id bigint)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE COST 5000
              AS $function$
              DECLARE
                  v_scope bigint[];
              BEGIN
                  -- Attore nullo: nessun accesso, come la canonica
                  -- fn_check_user_emittente_scope.
                  -- ⚠️ Rev 2026-10-04 (Q-1, brief-db-esclusioni-implicite): era
                  --    `RETURN true` («batch/sistema: nessun filtro»), cioe' una
                  --    sessione con la veste OPERATORE e l'utente vuoto vedeva ogni
                  --    billing account. Owner, superuser e BYPASSRLS non passano
                  --    dalle policy: non hanno bisogno di questo ramo.
                  IF p_auth_user_id IS NULL THEN
                      RETURN false;
                  END IF;

                  -- Scope emittenti dell'operatore (SR id), canonico:
                  --   NULL  = nessuna restrizione (solo super_admin)
                  --   '{}'  = nessun accesso (no identita OPERATORE attiva,
                  --           whitelist vuota dal P-2a, emittente attivo fuori scope)
                  --   array = whitelist SR
                  v_scope := script.fn_get_emittenti_scope_sr_ids(p_auth_user_id);

                  IF v_scope IS NULL THEN
                      RETURN true;                      -- accesso globale
                  END IF;

                  IF cardinality(v_scope) = 0 THEN
                      RETURN false;                     -- fail-closed
                  END IF;

                  -- Whitelist: il BA deve essere visibile (efba specifico o
                  -- default) per almeno uno degli emittenti in scope.
                  RETURN script.fn_check_ba_visible_for_emittenti(
                      p_billing_account_id, v_scope);
              END
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_evento_asset(p_auth_user_id integer, p_evento_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro di un evento asset via l'ASSET (non un magazzino:
                  --   l'evento puo' non averne). Chiave di note_evento_asset.
                  SELECT script.fn_scope_ef_whitelist_via_asset(
                      p_auth_user_id,
                      (SELECT e.asset_id
                         FROM magazzino.eventi_assets e
                        WHERE e.id = p_evento_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_flusso(p_auth_user_id integer, p_flusso_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: come sopra, ma partendo da un FLUSSO — e' la chiave
                  --   che portano pratiche.allegati_flussi e pratiche.note_flussi.
                  -- ⭐ Delega alla sorella invece di ripetere la risalita: se un
                  --   giorno cambia il modo in cui una pratica nomina il proprio
                  --   emittente, si corregge in un posto solo.
                  SELECT script.fn_scope_ef_whitelist_via_pratica(
                      p_auth_user_id,
                      (SELECT f.pratica_id
                         FROM pratiche.flussi f
                        WHERE f.id = p_flusso_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_inventario(p_auth_user_id integer, p_inventario_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro di un inventario via il suo magazzino. E' la chiave
                  --   che portano inventari_righe (inventario_id) e le note
                  --   note_inventario / note_inventario_riga (target_id = la testata).
                  SELECT script.fn_scope_ef_whitelist_via_magazzino(
                      p_auth_user_id,
                      (SELECT i.magazzino_id
                         FROM magazzino.inventari i
                        WHERE i.id = p_inventario_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_magazzino(p_auth_user_id integer, p_magazzino_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro l'emittente
                  --   del magazzino indicato. E' la risalita che tutto il dominio usa.
                  -- ⚠️ Magazzino inesistente o fuori perimetro (sotto RLS non si
                  --   vede) -> emittente NULL -> la canonica risponde false a
                  --   whitelist valorizzata: fail-closed.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT m.emittente_fiscale_id
                         FROM magazzino.magazzini m
                        WHERE m.id = p_magazzino_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_movimento(p_auth_user_id integer, p_movimento_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro di un movimento del registro, via il suo magazzino.
                  --   E' la chiave che porta magazzino.note_movimento.
                  SELECT script.fn_scope_ef_whitelist_via_magazzino(
                      p_auth_user_id,
                      (SELECT mv.magazzino_id
                         FROM magazzino.movimenti mv
                        WHERE mv.id = p_movimento_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_pratica(p_auth_user_id integer, p_pratica_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro
                  --   l'emittente della pratica indicata.
                  -- ⚠️ Pratica inesistente -> emittente NULL -> la canonica
                  --   risponde false quando la whitelist e' valorizzata:
                  --   fail-closed, come per le sei famiglie di documento.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT p.emittente_fiscale_id
                         FROM pratiche.pratiche p
                        WHERE p.id = p_pratica_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_rettifica(p_auth_user_id integer, p_rettifica_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro di una rettifica via il suo magazzino. Chiave di
                  --   rettifiche_righe e delle note note_rettifica / note_rettifica_riga.
                  SELECT script.fn_scope_ef_whitelist_via_magazzino(
                      p_auth_user_id,
                      (SELECT r.magazzino_id
                         FROM magazzino.rettifiche r
                        WHERE r.id = p_rettifica_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_trasferimento(p_auth_user_id integer, p_trasferimento_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro di un trasferimento via il magazzino di ORIGINE.
                  -- ⭐ Una sola risalita basta: il guard
                  --   magazzino.trgfn_trasferimenti_guard_stesso_emittente garantisce
                  --   che la destinazione sia dello stesso emittente (M-6).
                  SELECT script.fn_scope_ef_whitelist_via_magazzino(
                      p_auth_user_id,
                      (SELECT t.magazzino_id_from
                         FROM magazzino.trasferimenti t
                        WHERE t.id = p_trasferimento_id)
                  );
              $function$
              ;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $c$
              DECLARE
                  f regprocedure;
              BEGIN
                  FOR f IN
                      SELECT p.oid::regprocedure FROM pg_catalog.pg_proc p
                       WHERE p.pronamespace = 'script'::regnamespace
                         AND p.proname ~ '^fn_scope_ef_whitelist_via_(asset|documento_generato|efba|evento_asset|flusso|inventario|magazzino|movimento|pratica|rettifica|trasferimento)$'
                  LOOP
                      EXECUTE format('COMMENT ON FUNCTION %s IS %L', f,
                          replace(coalesce(obj_description(f, 'pg_proc'), ''), '⭐ rev 2026-10-18 (20261018-49, D-3b-2 ondata 2): l''emittente dal risolutore DEFINER (via_efba: dalla composizione delle policy, in convenzione soggetto_ruolo); una strada sola, nessuna policy del padre per chiamata. Stesse risposte. ', ''));
                  END LOOP;
              END
              $c$;
