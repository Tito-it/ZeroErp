# ------------------------------------------------------------
# LO STATO D'ANNULLO DAL LETTORE COMUNE
#   Brief: brief-modello-documento-vendita §17 (regola del 2, Tid 2026-10-31).
#
#   Il corpo di 20261025-74 e' ora script.fn_stato_per_colonna_id
#   (20261031-06), la logica comune ai quattro lettori con il nome. Qui resta
#   la porta: firma, contratto e consumatori invariati. Ogni vocabolario
#   della mappa ha la colonna is_abortito, quindi il ramo «colonna che
#   manca» (NULL) non cambia nessuna risposta di oggi; prima sarebbe stato
#   un errore SQL grezzo.
#   Il COMMENT riallinea l'elenco dei consumatori a quelli che la chiamano.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261031-08-update-fn-stato-abortito-id-dalla-colonna-mctit.yaml

  - changeSet:
      id: 20261031-08-update-fn-stato-abortito-id-dalla-colonna
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_stato_abortito_id(regclass) chiama il lettore comune
        script.fn_stato_per_colonna_id(p_testata, 'is_abortito', il suo nome); firma e contratto invariati.
        Brief: brief-modello-documento-vendita §17.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_stato_per_colonna_id';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_stato_abortito_id(p_testata regclass)
               -- bigint: l'id di uno stato di un vocabolario qualunque della
               -- mappa; nessuna colonna comune a cui ancorarlo.
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato d'annullo della testata, dal suo
                  --   vocabolario (is_abortito = true). La logica e' del
                  --   lettore comune (rev 2026-10-31, 20261031-08):
                  --   - testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - nessuno stato dichiarato: NULL.
                  -- =========================================================
                  RETURN script.fn_stato_per_colonna_id(p_testata, 'is_abortito', 'script.fn_stato_abortito_id');
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_stato_abortito_id(p_testata regclass)
              IS 'BB del modello del documento: l''id dello stato d''ANNULLO di una testata, letto dal suo vocabolario degli stati (is_abortito = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''ANNULLATO'' per dire «lo stato d''annullo» (guida del modello §8). Al massimo uno per vocabolario, ed e'' attivo (uq_<vocabolario>_abortito, chk_<vocabolario>_abortito_attivo). NULL se il vocabolario non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. La logica e'' di script.fn_stato_per_colonna_id (dal 2026-10-31), comune ai lettori gemelli: script.fn_stato_emissione_id, script.fn_stato_cessazione_id, script.fn_stato_accettazione_id; il codice per i verbi che lo prendono si legge con script.fn_doc_stato_codice. Consumatori: il backend (l''annullo chiesto dal cambio di stato va al verbo d''annullo), vendite.fn_annulla_commessa, vendite.fn_annulla_contratto, vendite.fn_annulla_lotto_da_draft, vendite.fn_annulla_offerta, vendite.fn_annulla_ordine, vendite.fn_annulla_preventivo, vendite.fn_cambia_stato_ddt (l''annullo della bolla emessa). Brief: brief-modello-documento-vendita §9 (Z-3 di Tid, 2026-10-25) e §17.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_stato_abortito_id(p_testata regclass)
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  -- Il vocabolario e l'id di uno stato di una qualunque testata
                  -- della mappa: bigint in tutti, nessuna colonna comune a cui
                  -- ancorarli.
                  v_vocabolario regclass;
                  v_id          bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato d'annullo della testata, dal suo
                  --   vocabolario (is_abortito = true).
                  -- Regole:
                  --   - testata fuori mappa: il chiamante e' rotto,
                  --     E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - nessuno stato dichiarato: NULL (al massimo uno lo
                  --     garantisce l'indice unico parziale, ed e' attivo).
                  -- =========================================================
                  SELECT m.vocabolario
                    INTO v_vocabolario
                    FROM script.fn_doc_stato_modello(p_testata) m;

                  IF v_vocabolario IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_stato_abortito_id', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('testata', p_testata::text),
                          NULL::uuid,
                          'script.fn_stato_abortito_id',
                          'p_testata: una testata della mappa del modello (script.fn_doc_stato_modello)');
                  END IF;

                  EXECUTE format('SELECT s.id FROM %s s WHERE s.is_abortito', v_vocabolario)
                     INTO v_id;

                  RETURN v_id;
              END;
              $function$;
