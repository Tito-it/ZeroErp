# script.fn_check_user_emittente_scope — l'AND restringente dell'emittente
#   attivo (brief-db-impersonazione-scope-emittente.md §4.1).
#
# PERCHE' QUI E BASTA. Questa e' la sede unica read+write dello scope emittente:
#   le cinque funzioni adapter (fn_scope_ef_whitelist e le varianti _via_sr,
#   _via_fattura, _via_commessa, _via_efba) le delegano senza duplicare la
#   regola, e da li' scendono TUTTE le policy RLS con ruolo OPERATORE. Una
#   modifica qui si propaga a lettura e scrittura insieme: nessuna policy va
#   toccata.
#
# ⚠️ L'ORDINE E' LA MODIFICA. Il nuovo ramo deve stare PRIMA del bypass super
#   admin, altrimenti non serve a niente: oggi il super admin esce con `true` al
#   secondo controllo, e un ramo aggiunto dopo non verrebbe mai raggiunto.
#
# ⚠️ IS DISTINCT FROM, non <>. p_emittente_fiscale_id arriva NULL dagli adapter
#   quando il riferimento non risolve (_via_sr con soggetto_ruolo non mappato,
#   _via_fattura con fattura inesistente). Con `<>` il confronto con NULL
#   darebbe NULL, l'IF non scatterebbe e la riga passerebbe al ramo successivo:
#   con l'emittente attivo quel caso deve restare FAIL-CLOSED.
#
# ⚠️ SI APPLICA A CHIUNQUE, non solo al super admin. Un operatore con emittente
#   attivo sul proprio emittente passa comunque dalla whitelist; con l'emittente
#   attivo su un altro si auto-esclude. E' l'invariante del §2 del brief: la
#   selezione e' solo restringente, mai allargante. Chi forzasse il valore non
#   guadagna visibilita': al massimo se ne toglie.
#
# ℹ️ NESSUN EXCEPTION HANDLER sul cast della GUC, di proposito. Se il valore non
#   e' un intero significa che il BE ha un difetto: l'errore deve emergere
#   subito, ed e' comunque fail-closed (la query si ferma, non mostra righe in
#   piu'). Assorbirlo con un NULL sarebbe l'unico modo di trasformare un bug in
#   un allargamento silenzioso di visibilita'.
#
# ℹ️ Il ramo 1 (p_auth_user_id NULL = job batch) resta intoccato e resta PRIMO:
#   i lavori in background non hanno GUC e non devono auto-bloccarsi.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-13-update-fn-check-user-emittente-scope-attivo-mctit.yaml

  - changeSet:
      id: 20260804-13-update-fn-check-user-emittente-scope-attivo
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Aggiunge alla canonica read+write dello scope emittente il ramo
        restringente sull'emittente attivo (GUC app.current_emittente_id),
        prima del bypass super admin. Si propaga a tutte le policy RLS
        OPERATORE e al write-guard tramite i cinque adapter.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'script'
                AND p.proname = 'fn_check_user_emittente_scope'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_user_emittente_scope(
                  p_auth_user_id         integer,
                  p_emittente_fiscale_id bigint
              )
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_cnt    integer;
                  v_attivo bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica se un utente ha accesso a uno specifico
                  --   emittente fiscale. Sede unica read+write: la usano gli
                  --   adapter RLS e i trigger di guardia.
                  --
                  -- Regole (refactor §4.6.B.5, + emittente attivo 2026-08-04):
                  --   1. p_auth_user_id NULL -> true (job batch)
                  --   2. Emittente attivo diverso da quello richiesto -> false
                  --      (restringe CHIUNQUE, anche il super admin)
                  --   3. fn_is_super_admin -> true (vede tutto)
                  --   4. Assenza identita OPERATORE attiva -> false
                  --      (defensive: utente disabilitato non accede)
                  --   5. Whitelist vuota -> true (nessuna restrizione)
                  --   6. Whitelist popolata -> EXISTS match
                  -- =========================================================

                  -- 1. Job batch (nessun utente)
                  IF p_auth_user_id IS NULL THEN
                      RETURN true;
                  END IF;

                  -- 2. Emittente attivo (impersonazione di scope).
                  --    Deve precedere il ramo super admin: e' l'unico punto in
                  --    cui la selezione puo' restringere chi vede tutto.
                  --    IS DISTINCT FROM: con p_emittente_fiscale_id NULL
                  --    (riferimento non risolto dagli adapter) resta fail-closed.
                  v_attivo := NULLIF(
                                  current_setting('app.current_emittente_id', true),
                                  ''
                              )::bigint;

                  IF v_attivo IS NOT NULL
                     AND p_emittente_fiscale_id IS DISTINCT FROM v_attivo THEN
                      RETURN false;
                  END IF;

                  -- 3. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN true;
                  END IF;

                  -- 4. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN false;
                  END IF;

                  -- 5. Conta righe whitelist
                  SELECT count(*)
                    INTO v_cnt
                    FROM config.user_emittenti_fiscali uef
                   WHERE uef.auth_user_id = p_auth_user_id;

                  IF v_cnt = 0 THEN
                      RETURN true;  -- nessuna restrizione
                  END IF;

                  -- 6. Verifica match specifico
                  RETURN EXISTS (
                      SELECT 1
                        FROM config.user_emittenti_fiscali uef
                       WHERE uef.auth_user_id         = p_auth_user_id
                         AND uef.emittente_fiscale_id = p_emittente_fiscale_id
                  );
              END
              $function$;

              COMMENT ON FUNCTION script.fn_check_user_emittente_scope(p_auth_user_id integer, p_emittente_fiscale_id bigint)
              IS 'Verifica accesso utente a emittente fiscale. Refactor §4.6.B.5: NULL user/SUPER_ADMIN -> true; identita OPERATORE mancante -> false; whitelist vuota -> true; altrimenti match EXISTS. Post 2026-08-04: se la GUC app.current_emittente_id e'' valorizzata e diversa dall''emittente richiesto -> false, PRIMA del bypass super admin (impersonazione di scope: solo restringente, mai allargante).';
