# SI PUO' SPEGNERE QUESTA FAMIGLIA? — la pure check
#   script.fn_check_famiglia_documento_disattivabile
#   Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.4 (DB-2)
#
# ── ⛔ PERCHE' SPEGNERE UNA FAMIGLIA E' PERICOLOSO ───────────────
#   anagrafiche.fn_ba_ha_storia_emittente e la sua gemella
#   fn_get_storia_emittente_ba iterano `WHERE fd.attivo`: una famiglia spenta
#   ESCE dal presidio sul cambio emittente del billing account. Cioe' spegnere
#   una riga di catalogo non nasconde una voce — SPEGNE UN CONTROLLO, e i
#   documenti di quella famiglia smettono di trattenere il billing account
#   dove sono stati numerati.
#   ⚠️ Finora non era un rischio perche' in quella tabella scriveva solo un
#   seed. Col CRUD e' un clic, e non fallisce niente.
#
# ── ⭐ DUE MOTIVI, ED E' L'ORDINE A CONTARE ──────────────────────
#   1) HA_REGISTRI_ATTIVI — c'e' ancora un sezionale acceso su questa famiglia;
#   2) HA_DOCUMENTI_NUMERATI — esistono documenti che portano un numero.
#   Il primo si rimedia (si spengono i registri), il secondo no: quei numeri
#   sono usciti e non si disfano. La madre solleva il PRIMO motivo, quindi va
#   per primo quello su cui l'operatore puo' fare qualcosa.
#
# ── ⛔ I CODICI SI RIUSANO, NON SI CONIANO ───────────────────────
#   E_ATTIVO_BLOCK_CHILDREN_ACTIVE e E_ATTIVO_BLOCK_CHILDREN_EXIST esistono e
#   dicono esattamente questo, con l'arita' giusta (tabella padre, colonna
#   chiave, valore, tabella figlia). Coniare due codici nuovi avrebbe aggiunto
#   due righe a un registro che deve calare, per una frase identica.
#
# ── ⚠️ SECURITY DEFINER, E QUI E' OBBLIGATORIO ──────────────────
#   Le cinque tabelle dei documenti hanno la RLS ATTIVA (fatture, ddt, ordini,
#   commesse, resi: verificato 2026-09-01). Un conteggio SECURITY INVOKER
#   tornerebbe zero all'operatore che non vede quei documenti — e zero qui
#   significa «si puo' spegnere». Sarebbe un fail-OPEN che non fallisce mai:
#   ⭐ uno zero sotto RLS non e' un dato, e' una risposta troncata.
#   E' la stessa scelta gia' fatta da anagrafiche.fn_get_storia_emittente_ba,
#   che conta gli stessi documenti per lo stesso genere di presidio.
#
# ── ⭐ NESSUN ELENCO DI TABELLE ──────────────────────────────────
#   Le cinque tabelle non sono scritte qui: si leggono dalla famiglia stessa
#   (schema_tabella, nome_tabella, colonna_numero) e si compongono in SQL
#   dinamico. Una famiglia nuova entra nel controllo il giorno che nasce.
#   ⚠️ to_regclass e non un cast: una famiglia spenta puo' nominare una tabella
#   che non c'e' piu' — e' storia — e la check deve rispondere, non esplodere.
#
# ⚠️ La reason_key e' un DEBITO VERSO IL FE (§12.3).
# ⛔ Il `reason` non porta il prefisso E_, riservato ai codici a catalogo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260901-14-create-fn-check-famiglia-disattivabile-mctit.yaml

  - changeSet:
      id: 20260901-14-create-fn-check-famiglia-disattivabile
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        La pure check (§12.5.1) che dice se una famiglia di documento si puo'' spegnere: `[]` se si'',
        altrimenti i motivi ORDINATI — prima HA_REGISTRI_ATTIVI (rimediabile), poi
        HA_DOCUMENTI_NUMERATI (no). ⛔ Serve perche'' spegnere una famiglia la fa USCIRE dal presidio
        sul cambio emittente del billing account, che itera `WHERE fd.attivo`: non nasconde una voce,
        spegne un controllo. ⚠️ SECURITY DEFINER obbligatorio: le cinque tabelle dei documenti hanno la
        RLS attiva e un conteggio invoker tornerebbe zero — cioe'' «si puo'' spegnere» — a chi quei
        documenti non li vede. ⭐ Nessun elenco di tabelle: si compone dalla famiglia stessa.
        Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.4 (DB-2).
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                schemaName: vendite
                tableName: famiglie_documento
            - tableExists:
                schemaName: vendite
                tableName: registri_fatturazione
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_famiglia_documento_disattivabile(
                      p_famiglia_id vendite.famiglie_documento.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'public'
              AS $function$
              DECLARE
                  v_motivi   jsonb := '[]'::jsonb;
                  v_fam      record;
                  v_relid    oid;
                  v_registri bigint;
                  v_docs     bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Elencare i motivi che impediscono di SPEGNERE una
                  --   famiglia di documento. Funzione PURA (fn_check_*):
                  --   nessuna scrittura, nessun raise di dominio.
                  --   Consumatori: il guard che rifiuta l'UPDATE, e la lista
                  --   del CRUD, che tiene il cestino spento e dice PERCHE'.
                  --
                  -- Ritorna: [] se si puo' spegnere; altrimenti array ORDINATO
                  --   di {codice, reason, reason_key, dettaglio, valori}
                  --   (§12.5.1).
                  --
                  -- ⛔ PERCHE' ESISTE: anagrafiche.fn_ba_ha_storia_emittente
                  --   itera `WHERE fd.attivo`. Spegnere una famiglia la toglie
                  --   dal presidio sul cambio emittente del billing account: i
                  --   suoi documenti smettono di trattenere il BA dove sono
                  --   stati numerati, e nessuno se ne accorge.
                  --
                  -- ⚠️ SECURITY DEFINER: le cinque tabelle dei documenti hanno
                  --   la RLS attiva. Un conteggio invoker tornerebbe zero a chi
                  --   non le vede, e zero qui vuol dire «spegnila pure» —
                  --   fail-open che non fallisce mai.
                  -- =========================================================

                  -- Guard di parametro: un id assente o non positivo non esce
                  -- da nessuna interfaccia, lo produce un chiamante rotto.
                  IF p_famiglia_id IS NULL OR p_famiglia_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_famiglia_documento_disattivabile',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_famiglia_id',
                                             'valore', p_famiglia_id),
                          NULL::uuid,
                          'script.fn_check_famiglia_documento_disattivabile',
                          'identificativo della famiglia non valido');
                  END IF;

                  SELECT f.codice_interno, f.descrizione, f.schema_tabella,
                         f.nome_tabella, f.colonna_numero
                    INTO v_fam
                    FROM vendite.famiglie_documento f
                   WHERE f.id = p_famiglia_id;

                  -- ⭐ E non si risponde []: sarebbe «si puo' spegnere», che su
                  --   una riga inesistente e' una frase senza senso. Stesso
                  --   ramo delle gemelle sui registri.
                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_famiglia_documento_disattivabile',
                          'E_VENDITE_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('famiglia_id', p_famiglia_id),
                          NULL::uuid,
                          'script.fn_check_famiglia_documento_disattivabile',
                          concat('famiglia di documento ', p_famiglia_id, ' inesistente'));
                  END IF;

                  -- ---- MOTIVO 1 — registri ancora accesi ------------------
                  -- ⭐ Va per PRIMO perche' e' quello RIMEDIABILE: la madre
                  --   solleva il primo motivo, e all'operatore va detta la cosa
                  --   che puo' fare, non quella che non puo' fare.
                  -- ⚠️ `attivo` e non l'esistenza: un registro spento non
                  --   numera piu' niente, e tenerlo in conto vieterebbe per
                  --   sempre lo spegnimento di una famiglia gia' ritirata.
                  SELECT count(*)
                    INTO v_registri
                    FROM vendite.registri_fatturazione r
                   WHERE r.famiglia_documento = v_fam.codice_interno
                     AND r.attivo;

                  IF v_registri > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_ATTIVO_BLOCK_CHILDREN_ACTIVE',
                          'reason',     'HA_REGISTRI_ATTIVI',
                          'reason_key', 'amministrazione.famiglie_documento.disattiva_blocco.ha_registri_attivi',
                          'dettaglio',  jsonb_build_object('famiglia_id',    p_famiglia_id,
                                                           'codice_interno', v_fam.codice_interno,
                                                           'registri',       v_registri),
                          -- ⭐ I quattro valori riempiono i quattro %s del
                          --   messaggio a catalogo, nell'ordine: tabella padre,
                          --   colonna chiave, valore, tabella figlia.
                          'valori',     jsonb_build_array('vendite.famiglie_documento',
                                                          'codice_interno',
                                                          v_fam.codice_interno,
                                                          'vendite.registri_fatturazione'));
                  END IF;

                  -- ---- MOTIVO 2 — documenti gia' numerati ----------------
                  -- ⚠️ to_regclass: una famiglia puo' nominare una tabella che
                  --   non c'e' piu' (e' storia). La check risponde, non esplode.
                  v_relid := to_regclass(format('%I.%I', v_fam.schema_tabella, v_fam.nome_tabella));

                  IF v_relid IS NOT NULL THEN
                      -- ⭐ Il predicato e' «porta un numero», lo stesso di
                      --   anagrafiche.fn_get_storia_emittente_ba: non basta che
                      --   la riga esista, deve avere consumato il contatore.
                      EXECUTE format(
                          'SELECT count(*) FROM %I.%I d'
                          || ' WHERE d.%I IS NOT NULL'
                          || '   AND btrim(d.%I::text) <> $1',
                          v_fam.schema_tabella, v_fam.nome_tabella,
                          v_fam.colonna_numero, v_fam.colonna_numero)
                        INTO v_docs
                       USING ''::text;

                      IF v_docs > 0 THEN
                          v_motivi := v_motivi || jsonb_build_object(
                              'codice',     'E_ATTIVO_BLOCK_CHILDREN_EXIST',
                              'reason',     'HA_DOCUMENTI_NUMERATI',
                              'reason_key', 'amministrazione.famiglie_documento.disattiva_blocco.ha_documenti_numerati',
                              'dettaglio',  jsonb_build_object('famiglia_id',    p_famiglia_id,
                                                               'codice_interno', v_fam.codice_interno,
                                                               'documenti',      v_docs,
                                                               'tabella',        v_fam.schema_tabella
                                                                                 || '.' || v_fam.nome_tabella),
                              'valori',     jsonb_build_array('vendite.famiglie_documento',
                                                              'codice_interno',
                                                              v_fam.codice_interno,
                                                              v_fam.schema_tabella || '.' || v_fam.nome_tabella));
                      END IF;
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_famiglia_documento_disattivabile(
                      vendite.famiglie_documento.id%TYPE)
              IS 'Pure check (§12.5.1): i motivi che impediscono di SPEGNERE una famiglia di documento. Torna [] se si puo'', altrimenti l''array ORDINATO dei motivi — prima HA_REGISTRI_ATTIVI (E_ATTIVO_BLOCK_CHILDREN_ACTIVE), poi HA_DOCUMENTI_NUMERATI (E_ATTIVO_BLOCK_CHILDREN_EXIST). ⛔ PERCHE'' ESISTE: anagrafiche.fn_ba_ha_storia_emittente e fn_get_storia_emittente_ba iterano `WHERE fd.attivo`, quindi spegnere una famiglia non nasconde una voce di catalogo — la fa USCIRE dal presidio sul cambio emittente del billing account, e i suoi documenti smettono di trattenere il BA dove sono stati numerati. ⭐ L''ORDINE E'' IL CONTRATTO: la madre solleva il PRIMO motivo, e per primo va quello RIMEDIABILE (spegnere i registri); i numeri gia'' usciti non si disfano. ⚠️ SECURITY DEFINER e non INVOKER: le cinque tabelle dei documenti hanno la RLS attiva (verificato 2026-09-01) e un conteggio invoker tornerebbe ZERO a chi non le vede — cioe'' «si puo'' spegnere». Uno zero sotto RLS non e'' un dato, e'' una risposta troncata: stessa scelta di anagrafiche.fn_get_storia_emittente_ba. ⭐ Le tabelle dei documenti NON sono elencate qui: si compongono dalla famiglia stessa in SQL dinamico, cosi'' una famiglia nuova entra nel controllo il giorno che nasce; to_regclass e non un cast, perche'' una famiglia ritirata puo'' nominare una tabella che non esiste piu''. ⚠️ La reason_key e'' un debito verso il FE (§12.3). Piano: brief-be-fe-crud-registri-di-numerazione, sezione 11.4 (DB-2).';

              -- ⚠️ La check la legge anche l'applicazione, per il cestino
              --   spento col motivo: senza GRANT il pulsante resterebbe acceso
              --   e la promessa la manterrebbe il guard, con un 409.
              GRANT EXECUTE ON FUNCTION script.fn_check_famiglia_documento_disattivabile(
                      vendite.famiglie_documento.id%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_famiglia_documento_disattivabile(integer);
