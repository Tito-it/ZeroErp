# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — LOTTO 1: il ponte di script.fn_articolo_riga_contesto si restringe
#   Brief: brief-db-grammatica-unica-documenti §9 (G-1, G-4 di Tid, 2026-10-18).
#
#   Il ponte A-8 traduceva OFFERTA_COMMERCIALE in OFFERTA per tre lettori:
#   vendite.fn_documento_listino_operativo, script.fn_get_stato_testata_documento
#   e, attraverso la chiave doc_listino del contesto, le due check di
#   script.fn_check_articolo_riga_su_contesto. Col lotto 1 il listino operativo
#   e le due check parlano il codice della sorgente: la chiave doc_listino
#   diventa una copia di documento ed esce (regola del 2; il lettore si
#   adegua nel -32). Resta una traduzione, verso
#   fn_get_stato_testata_documento (l'etichetta): la toglie il lotto 2.
#
#   CREATE OR REPLACE: la firma non cambia. Corpo dalla definizione viva
#   (dbdev, 2026-10-19), firma e RETURNS dall'ultimo YAML che li ha ancorati
#   (20261014-01). COMMENT vivo con la nota di revisione in coda.
#
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261019-31-update-fn-articolo-riga-contesto-ponte-solo-testata-mctit.yaml

  - changeSet:
      id: 20261019-31-update-fn-articolo-riga-contesto-ponte-solo-testata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_articolo_riga_contesto: il ponte A-8 traduce solo verso fn_get_stato_testata_documento;
        la chiave doc_listino esce dal contesto. Grammatica unica, lotto 1.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_articolo_riga_contesto(
                  p_documento         config.tipi_entita.codice%TYPE,
                  p_documento_id      bigint,
                  p_tipo_eccezione    vendite.tipo_eccezione_contratto DEFAULT NULL,
                  p_articolo_padre_id catalogo.articoli.id%TYPE DEFAULT NULL)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$

              DECLARE
                  v_contesto     jsonb;
                  -- ⚠️ v_doc_testata nudo: la grammatica delle testate (OFFERTA |
                  --   CONTRATTO) di script.fn_get_stato_testata_documento. E' quel che
                  --   resta del ponte A-8: lo ritira il lotto 2 della grammatica unica.
                  v_doc_testata  text;
                  v_listino_id   vendite.listini.id%TYPE;
                  v_versione_id  vendite.listini_versioni.id%TYPE;
                  v_etichetta    text;
                  v_tip_listino  vendite.listini.tipologia_id%TYPE;
                  v_padre_codice catalogo.articoli.codice%TYPE;
                  v_padre_iva    catalogo.articoli.iva_id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Il lato DOCUMENTO di script.fn_check_articolo_riga: cio'
                  --   che i motivi leggono e che non dipende dall'articolo,
                  --   letto una volta. Valida i parametri.
                  -- Ritorna: il contesto (jsonb) che riceve
                  --   script.fn_check_articolo_riga_su_contesto.
                  -- =========================================================
                  IF p_documento IS NULL
                     OR p_documento NOT IN ('PREVENTIVO', 'ORDINE_VENDITA', 'DDT_VENDITA',
                                            'OFFERTA_COMMERCIALE', 'CONTRATTO',
                                            'LISTINO_VERSIONE', 'ARTICOLO',
                                            'PROMO_ARTICOLO') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'script.fn_articolo_riga_contesto',
                          'E_DOC_TIPO_NON_GESTITO',
                          jsonb_build_object('documento', p_documento),
                          NULL::uuid,
                          COALESCE(p_documento, '<null>'));
                  END IF;

                  -- Offerta e contratto: la riga e' un'eccezione al listino, e il
                  -- tipo d'eccezione decide le regole.
                  IF p_tipo_eccezione IS NULL
                     AND p_documento IN ('OFFERTA_COMMERCIALE', 'CONTRATTO') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'script.fn_articolo_riga_contesto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_tipo_eccezione', 'documento', p_documento),
                          NULL::uuid,
                          'p_tipo_eccezione obbligatorio per ' || p_documento);
                  END IF;

                  -- La distinta: la «testata» e' l'articolo padre (uuid), non un id di documento.
                  IF p_articolo_padre_id IS NULL AND p_documento = 'ARTICOLO' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo',
                          'script.fn_articolo_riga_contesto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_articolo_padre_id', 'documento', p_documento),
                          NULL::uuid,
                          'p_articolo_padre_id obbligatorio per ARTICOLO (la distinta)');
                  END IF;

                  v_contesto := jsonb_build_object(
                      'documento',         p_documento,
                      'documento_id',      p_documento_id,
                      'tipo_eccezione',    p_tipo_eccezione,
                      'articolo_padre_id', p_articolo_padre_id);

                  -- Versione di listino: la tipologia del suo listino.
                  IF p_documento = 'LISTINO_VERSIONE' THEN
                      SELECT l.tipologia_id INTO v_tip_listino
                        FROM vendite.listini_versioni lv
                        JOIN vendite.listini l ON l.id = lv.listino_id
                       WHERE lv.id = p_documento_id;

                      RETURN v_contesto || jsonb_build_object('listino_tipologia_id', v_tip_listino);
                  END IF;

                  -- Distinta: il padre.
                  IF p_documento = 'ARTICOLO' THEN
                      SELECT a.codice, a.iva_id INTO v_padre_codice, v_padre_iva
                        FROM catalogo.articoli a
                       WHERE a.id = p_articolo_padre_id;

                      RETURN v_contesto || jsonb_build_object(
                          'padre_codice',   v_padre_codice,
                          'padre_iva_id',   v_padre_iva,
                          'padre_aliquota', (SELECT i.aliquota_iva::text FROM config.iva i
                                              WHERE i.id = v_padre_iva));
                  END IF;

                  -- Offerta e contratto: il listino operativo e la sua versione
                  -- ESPANSA, una volta.
                  IF p_documento IN ('OFFERTA_COMMERCIALE', 'CONTRATTO') THEN
                      v_doc_testata := CASE p_documento
                                           WHEN 'OFFERTA_COMMERCIALE' THEN 'OFFERTA'
                                           ELSE 'CONTRATTO' END;

                      SELECT lo.listino_id, lo.listino_versione_id
                        INTO v_listino_id, v_versione_id
                        FROM vendite.fn_documento_listino_operativo(p_documento, p_documento_id) lo;

                      SELECT t.etichetta INTO v_etichetta
                        FROM script.fn_get_stato_testata_documento(v_doc_testata, p_documento_id) t;
                      v_etichetta := COALESCE(v_etichetta, initcap(v_doc_testata) || ' #' || p_documento_id::text);

                      -- «Nel listino» = una riga della versione espansa: standalone
                      -- E bundle (il bundle sta nel listino coi suoi componenti, non
                      -- in listini_righe). La stessa base su cui il drawer applica
                      -- OVERRIDE ed ESCLUSIONE (vendite.fn_documento_righe_preview).
                      RETURN v_contesto || jsonb_build_object(
                          'listino_id',          v_listino_id,
                          'listino_versione_id', v_versione_id,
                          'etichetta',           v_etichetta,
                          'articoli_listino',    COALESCE(
                              (SELECT jsonb_agg(DISTINCT b.articolo_id)
                                 FROM vendite.fn_espandi_listino_versione(v_versione_id, NULL, NULL) b),
                              jsonb_build_array()));
                  END IF;

                  -- Preventivo, ordine, bolla, promo: i motivi non leggono il documento.
                  RETURN v_contesto;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_articolo_riga_contesto(config.tipi_entita.codice%TYPE, bigint, vendite.tipo_eccezione_contratto, catalogo.articoli.id%TYPE) IS
                'Il lato DOCUMENTO di script.fn_check_articolo_riga, letto una volta: valida i parametri (p_documento fra PREVENTIVO | ORDINE_VENDITA | DDT_VENDITA | OFFERTA_COMMERCIALE | CONTRATTO | LISTINO_VERSIONE | ARTICOLO | PROMO_ARTICOLO, altrimenti E_DOC_TIPO_NON_GESTITO; p_tipo_eccezione obbligatorio per offerta e contratto e p_articolo_padre_id per ARTICOLO, altrimenti E_PARAMETRO_INVALIDO) e restituisce il contesto jsonb che riceve script.fn_check_articolo_riga_su_contesto. Sempre: documento, documento_id, tipo_eccezione, articolo_padre_id. LISTINO_VERSIONE: listino_tipologia_id. ARTICOLO (la distinta): padre_codice, padre_iva_id, padre_aliquota. OFFERTA_COMMERCIALE e CONTRATTO: listino_id, listino_versione_id, etichetta, articoli_listino (gli articolo_id di vendite.fn_espandi_listino_versione, standalone e bundle; [] senza versione). documento_id non e'' obbligatorio: preventivo, ordine, bolla e promo non leggono il documento (l''obbligo di A-1 e'' del picker catalogo.fn_articoli_ammessi). Nasce per R-5: il picker valuta molti articoli sullo stesso documento, e rileggere il listino espanso per ognuno costava piu'' del giudizio. Sotto RLS (SECURITY INVOKER): un documento che l''operatore non vede da'' un contesto senza listino. Nasce il 2026-10-14, brief-db-articoli-ammessi-per-documento (Lotto 4, §9.4). ⭐ rev 2026-10-19 (20261019-31, brief-db-grammatica-unica-documenti lotto 1, G-1 di Tid): il documento si nomina col codice della sorgente, CONTRATTO | OFFERTA_COMMERCIALE (era OFFERTA); dove sopra si legge OFFERTA come selettore, oggi e'' OFFERTA_COMMERCIALE. Il ponte A-8 si restringe: il listino operativo riceve il codice com''e'' (OFFERTA_COMMERCIALE), e la chiave doc_listino esce dal contesto (era una copia di documento). Traduce ancora, in un punto solo, verso script.fn_get_stato_testata_documento (l''etichetta): grammatica delle testate, lotto 2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
