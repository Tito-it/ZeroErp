# IL COMMENT DELLA SCRIVIBILE DELLE RIGHE DI LISTINO: CHI LA CHIAMA
#   Brief: brief-db-stati-documento-dal-vocabolario, dopo il giro 6f-ter
#   (richiesta del BE del 2026-11-15; via di Tid lo stesso giorno).
#
#   Il verbo della variazione percentuale (20261115-79) chiama la check
#   della versione senza riga: il COMMENT lo elenca fra chi la chiama. Il
#   corpo non cambia. Il rollback porta il COMMENT del 20261115-78, letto
#   dalla doc auto-generata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261115-80-comment-fn-check-listino-riga-scrivibile-verbo-variazione-mctit.yaml

  - changeSet:
      id: 20261115-80-comment-fn-check-listino-riga-scrivibile-verbo-variazione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        COMMENT di script.fn_check_listino_riga_scrivibile: la chiama anche il verbo della variazione percentuale.
        Brief: brief-db-stati-documento-dal-vocabolario, dopo il giro 6f-ter.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_check_listino_riga_scrivibile(vendite.listini_righe.listino_versione_id%TYPE, vendite.listini_righe.id%TYPE, text)
              IS 'Perche'' non si scrive nelle righe di una versione di listino (le righe vendite.listini_righe, i prezzi dei componenti vendite.listini_righe_componenti, la periodicita'' dei kit vendite.listini_kit): jsonb array di motivi (codice, reason, reason_key, dettaglio, valori), il primo e'' quello che si solleva; ''[]'' = si scrive. Si scrive solo in bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni. p_listino_riga_id e'' la riga che c''e'' (NULL = una riga nuova), della tabella del guard che chiama, e p_operazione l''operazione (default: INSERT senza riga, UPDATE con): entrano nel dettaglio e nei valori, non nella regola. Una versione che non si legge non si giudica (''[]'': parlano la FK e la policy). Motivi, in ordine: 1. E_RIGA_LISTINO_VERSIONE_CHIUSA (VERSIONE_CHIUSA, reason_key vendite.listini.azione_reason.versione_chiusa: la versione e'' CHIUSA, la storia dei prezzi); 2. E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA (VERSIONE_NON_IN_BOZZA, reason_key vendite.listini.azione_reason.righe_non_in_bozza: la versione e'' il listino in uso, o lo sara''). Il prezzo di una riga della versione in vigore si corregge con la rettifica, il verbo vendite.fn_rettifica_riga_listino (script.fn_check_listino_riga_rettificabile). Non solleva. La chiamano i guard vendite.trgfn_listini_righe_guard_stato, vendite.trgfn_listini_righe_comp_guard_immutabilita_v5 e vendite.trgfn_listini_kit_guard, il verbo vendite.fn_varia_prezzi_versione_listino (senza riga: la variazione percentuale e'' un gesto della versione, e la giudica anche a righe zero), e le superfici vendite.vw_listini_versioni_azioni (aggiunta_riga_blocco_*, variazione_blocco_*, prezzi_bundle_blocco_*, periodicita_kit_blocco_*) e vendite.vw_listini_righe_azioni (modifica_blocco_*), registro config.azioni_riga. SECURITY INVOKER, STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_check_listino_riga_scrivibile(vendite.listini_righe.listino_versione_id%TYPE, vendite.listini_righe.id%TYPE, text)
              IS 'Perche'' non si scrive nelle righe di una versione di listino (le righe vendite.listini_righe, i prezzi dei componenti vendite.listini_righe_componenti, la periodicita'' dei kit vendite.listini_kit): jsonb array di motivi (codice, reason, reason_key, dettaglio, valori), il primo e'' quello che si solleva; ''[]'' = si scrive. Si scrive solo in bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni. p_listino_riga_id e'' la riga che c''e'' (NULL = una riga nuova), della tabella del guard che chiama, e p_operazione l''operazione (default: INSERT senza riga, UPDATE con): entrano nel dettaglio e nei valori, non nella regola. Una versione che non si legge non si giudica (''[]'': parlano la FK e la policy). Motivi, in ordine: 1. E_RIGA_LISTINO_VERSIONE_CHIUSA (VERSIONE_CHIUSA, reason_key vendite.listini.azione_reason.versione_chiusa: la versione e'' CHIUSA, la storia dei prezzi); 2. E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA (VERSIONE_NON_IN_BOZZA, reason_key vendite.listini.azione_reason.righe_non_in_bozza: la versione e'' il listino in uso, o lo sara''). Il prezzo di una riga della versione in vigore si corregge con la rettifica, il verbo vendite.fn_rettifica_riga_listino (script.fn_check_listino_riga_rettificabile). Non solleva. La chiamano i guard vendite.trgfn_listini_righe_guard_stato, vendite.trgfn_listini_righe_comp_guard_immutabilita_v5 e vendite.trgfn_listini_kit_guard, e le superfici vendite.vw_listini_versioni_azioni (aggiunta_riga_blocco_*, variazione_blocco_*, prezzi_bundle_blocco_*, periodicita_kit_blocco_*) e vendite.vw_listini_righe_azioni (modifica_blocco_*), registro config.azioni_riga. SECURITY INVOKER, STABLE.';
