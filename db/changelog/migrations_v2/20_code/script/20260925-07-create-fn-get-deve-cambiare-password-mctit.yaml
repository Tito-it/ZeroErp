# ------------------------------------------------------------
# P-1 — IL CAMBIO PASSWORD OBBLIGATORIO SI LEGGE QUI: script.fn_get_deve_cambiare_password
#   Brief: brief-db-blocco-login-per-credenziale, sezione 3.4 (D-7)
#
# ── ⭐ IL DEFAULT DELL'ASSENZA VIVE SOLO QUI (regola del 2) ──────────
#   La riga di config.credenziali nasce alla prima scrittura: la sua assenza
#   vale false. I lettori sono tre — script.fn_get_user_profile,
#   script.fn_get_operatore_detail e il backend (login, middleware) — e tutti
#   chiedono qui. Se ciascuno scrivesse il suo COALESCE, la regola «assente =
#   false» avrebbe tre sedi.
#
# ── ⚠️ DELLA CREDENZIALE, NON DELLA VESTE ────────────────────────────
#   Il parametro e' il solo auth_user_id: il backend passava un identita_id
#   (il flag era per veste). Con D-7 non serve piu', e non va passato.
#
# INVOKER e STABLE: la tabella e' leggibile dall'app (la porta chiude solo le
# scritture). Parametro integer esplicito: e' django.auth_user.id.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260925-07-create-fn-get-deve-cambiare-password-mctit.yaml

  - changeSet:
      id: 20260925-07-create-fn-get-deve-cambiare-password
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_deve_cambiare_password(p_auth_user_id): il cambio password obbligatorio della
        credenziale (D-7), con il default dell'assenza (false) in un posto solo; lo leggono
        fn_get_user_profile, fn_get_operatore_detail e il backend. INVOKER, STABLE. Brief:
        brief-db-blocco-login-per-credenziale §3.4.
      preConditions:
        - onFail: HALT
        - tableExists:
            { schemaName: config, tableName: credenziali }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_deve_cambiare_password(
                  p_auth_user_id integer
              )
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: il cambio password obbligatorio della credenziale. La riga nasce
              --   alla prima scrittura: la sua ASSENZA vale false, e questa e' la sola
              --   sede di quel default.
              DECLARE
                  v_valore config.credenziali.deve_cambiare_password%TYPE;
              BEGIN
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_deve_cambiare_password', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_auth_user_id', 'valore', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_get_deve_cambiare_password',
                                         'credenziale assente o non valida']);
                  END IF;

                  SELECT c.deve_cambiare_password
                    INTO v_valore
                    FROM config.credenziali c
                   WHERE c.auth_user_id = p_auth_user_id;

                  RETURN COALESCE(v_valore, false);
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_deve_cambiare_password(integer) IS
                  'Cambio password obbligatorio della CREDENZIALE (D-7: la password e'' una). La riga di config.credenziali nasce alla prima scrittura e la sua assenza vale false: questa e'' la sola sede di quel default (regola del 2), e la chiamano script.fn_get_user_profile, script.fn_get_operatore_detail e il backend. Parametro: django.auth_user.id (integer esplicito, niente %TYPE su Django); NULL o <= 0 -> E_AUTH_CHIAMATA_NON_VALIDA. INVOKER, STABLE. Brief: brief-db-blocco-login-per-credenziale §3.4.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_deve_cambiare_password(integer);
