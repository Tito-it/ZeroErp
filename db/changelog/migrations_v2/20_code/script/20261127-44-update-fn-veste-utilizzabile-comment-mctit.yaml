# ------------------------------------------------------------
# script.fn_veste_utilizzabile: il COMMENT torna a dire che cosa fa il corpo.
#
#   Il COMMENT diceva «CURRENT_DATE sta nella sua finestra», ma dal 20261009-49
#   il corpo confronta le date con script.fn_data_operativa(), la data di oggi
#   nel fuso dell'azienda. Il COMMENT era rimasto indietro (trovato nel giro 3
#   del brief degli accessi, 2026-11-27).
#
#   Si riscrive al presente (linee-guida-sql §5d): via il nome del brief, e
#   l'elenco dei lettori riletto sul catalogo (doc auto-generata del
#   2026-11-27), con anagrafiche.vw_accessi_altri che la legge dal 20261127-43.
#   Solo COMMENT ON: corpo, firma e attributi non cambiano. Nessuna fase
#   tardiva scrive questo COMMENT (cercato in 70_dati_sistema … 90_end).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261127-44-update-fn-veste-utilizzabile-comment-mctit.yaml

  - changeSet:
      id: 20261127-44-update-fn-veste-utilizzabile-comment
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_veste_utilizzabile: il COMMENT dice la data operativa (script.fn_data_operativa) e non
        CURRENT_DATE, come il corpo; lettori riletti sul catalogo. Solo COMMENT ON.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_veste_utilizzabile(p_identita_id bigint) IS
                  'Una veste vale oggi? true se e'' accesa, la data operativa (script.fn_data_operativa: oggi nel fuso dell''azienda, non in quello della sessione) sta nella sua finestra, estremi compresi, e il suo soggetto e'' attivo; per l''operatore UMANO (OPERATORE, tecnica = false) anche il rapporto, cioe'' la risorsa umana dello stesso soggetto_ruolo, e'' attivo e nella sua finestra (senza risorsa umana: false). L''identita'' tecnica di un processo non ha risorsa umana e non la pretende. false per un id assente o NULL. Building block unico della regola: la leggono le sedi DB che decidono accesso, visibilita'' e sincronizzazione della credenziale (fn_has_identita_attiva, fn_is_super_admin_account, fn_identita_super_admin_senza_scadenza, fn_get_profili_accesso_applicabili, fn_get_setup_status, fn_get_user_profile, fn_get_identita_sr_perimetro, fn_scope_identita_processo, ui.fn_lista_colonne_livello, anagrafiche.fn_sync_auth_user_is_active e fn_sync_auth_user_expired), la vista anagrafiche.vw_accessi_altri, che la mostra accanto allo stato di script.fn_stato_veste, e il backend al login, a ogni richiesta, al refresh, al secondo passo e al cambio password. L''appartenenza della veste alla credenziale resta al chiamante.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              SELECT 1;  -- forward-only: il testo precedente e' nel 20261007-01
