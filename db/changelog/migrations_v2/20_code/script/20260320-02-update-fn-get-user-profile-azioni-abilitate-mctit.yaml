#
# Aggiorna fn_get_user_profile: aggiunge chiave 'azioni_abilitate'
# al JSONB di ritorno, chiamando fn_get_user_actions_map.
# Retrocompatibile: aggiunge una chiave, non ne rimuove.
# Dipende da: 20260320-01 (fn_get_user_actions_map)
