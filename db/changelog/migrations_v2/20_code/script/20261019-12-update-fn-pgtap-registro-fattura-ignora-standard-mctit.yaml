# IL BUILDER PGTAP DEL REGISTRO FATTURA IGNORA IL REGISTRO STANDARD
#   script.fn_pgtap_registro_fattura: nella ricerca del registro esistente
#   salta il registro delle fatture STANDARD (codice
#   vendite.fn_codice_registro_provisionato('FATTURA', emittente)).
#   R-BE-14 del BE, decisioni D-14a … D-14d di Tid (2026-10-18),
#   brief-db-processi-accensione-per-ambiente §6.14, «Da censire».
#
# -- PERCHE' ---------------------------------------------------------------------
#   Dal 20261019-08 ogni emittente che nasce ha il registro delle fatture
#   standard. Il builder restituiva il PRIMO registro FATTURA dell'emittente:
#   su un emittente costruito da una fixture avrebbe trovato lo standard, col
#   limite di emissione di DEFAULT (limite_emissione_giorni NULL = vale il
#   default, non «nessun limite»), invece di creare il suo con 9999. Le
#   fixture datano i documenti nel passato: sarebbero cadute sul presidio del
#   limite, che non stanno provando — 56 file usano il builder.
#
# -- COSA RESTA IDENTICO -----------------------------------------------------------
#   * su un emittente che aveva gia' un registro delle fatture, il builder
#     restituisce lo stesso di prima: e' il primo per id, piu' vecchio dello
#     standard che il 20261019-11 gli aggiunge;
#   * su un emittente nuovo crea, come prima, il suo registro di fixture.
#   Chi vuole provare il registro STANDARD lo legge da
#   vendite.fn_get_registro_id, cioe' dal percorso vero.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261019-12-update-fn-pgtap-registro-fattura-ignora-standard-mctit.yaml

  - changeSet:
      id: 20261019-12-update-fn-pgtap-registro-fattura-ignora-standard
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Il builder pgTAP script.fn_pgtap_registro_fattura salta il registro delle fatture
        standard: le fixture continuano ad avere il loro registro col limite di emissione
        aperto. R-BE-14, D-14a … D-14d di Tid, brief-db-processi-accensione-per-ambiente §6.14.
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_pgtap_registro_fattura(
                  p_emittente_sr_id vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE DEFAULT NULL)
               RETURNS vendite.registri_fatturazione.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_emittente vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE;
                  v_registro  vendite.registri_fatturazione.id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dare a una fixture pgTAP un registro di fatturazione
                  --   COERENTE con l'emittente della fattura che sta per
                  --   scrivere — e crearlo se quell'emittente non ne ha.
                  --
                  -- Uso, al posto di «un registro qualunque»:
                  --   registro_id = script.fn_pgtap_registro_fattura()
                  --   registro_id = script.fn_pgtap_registro_fattura(<sr_id>)
                  --
                  -- ⛔ Non aggira vendite.trgfn_fatture_guard_registro_emittente:
                  --   il registro e' dell'emittente. Chi vuole il caso
                  --   INCOERENTE se lo costruisce apposta — lo fa
                  --   db/pgtap/vendite/test-fatture-guard-registro-emittente.sql.
                  --
                  -- ⚠️ Salta il registro STANDARD (dal 2026-10-18, R-BE-14):
                  --   ha il limite di emissione di default, e le fixture
                  --   datano i documenti nel passato. Chi prova lo standard
                  --   lo legge da vendite.fn_get_registro_id.
                  -- =========================================================

                  -- Senza argomento: l'emittente dell'operatore di contesto,
                  -- cioe' lo stesso che le fixture mettono sulla fattura.
                  v_emittente := COALESCE(p_emittente_sr_id,
                                          script.fn_pgtap_emittente_sr_operatore());

                  IF v_emittente IS NULL THEN
                      RAISE EXCEPTION
                          'script.fn_pgtap_registro_fattura: nessun emittente — la fixture deve passarlo o impostare il contesto operatore';
                  END IF;

                  -- ⚠️ ORDER BY esplicito: un LIMIT 1 senza ordine non sceglie,
                  --   scommette — e due corse darebbero registri diversi.
                  SELECT r.id INTO v_registro
                    FROM vendite.registri_fatturazione r
                   WHERE r.emittente_soggetto_ruolo_id = v_emittente
                     AND r.famiglia_documento = 'FATTURA'
                     AND r.attivo IS TRUE
                     AND r.codice <> vendite.fn_codice_registro_provisionato('FATTURA', v_emittente)
                   ORDER BY r.id
                   LIMIT 1;

                  IF v_registro IS NOT NULL THEN
                      RETURN v_registro;
                  END IF;

                  -- ⚠️ limite_emissione_giorni = 9999: le fixture datano i
                  --   documenti nel passato, e un limite attivo le farebbe
                  --   cadere su un presidio che non stanno provando. Chi il
                  --   limite lo prova davvero si costruisce il registro da se'.
                  INSERT INTO vendite.registri_fatturazione (
                      codice, descrizione, reset_policy, attivo,
                      emittente_soggetto_ruolo_id, limite_emissione_giorni, meta)
                  VALUES (
                      left('PGTAPREG_' || v_emittente::text, 32),
                      'Registro di fixture pgTAP',
                      'ANNUALE', TRUE,
                      v_emittente, 9999,
                      jsonb_build_object('test_scope', 'pgtap_registro_fattura'))
                  RETURNING id INTO v_registro;

                  RETURN v_registro;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_pgtap_registro_fattura(vendite.registri_fatturazione.emittente_soggetto_ruolo_id%TYPE)
              IS 'Helper pgTAP: il registro di fatturazione COERENTE con l''emittente indicato — quello dell''operatore di contesto se non si passa niente — creandolo se quell''emittente non ne ha ancora uno. ⛔ Nasce il 2026-08-30 perche'' vendite.trgfn_fatture_guard_registro_emittente ha reso visibile un difetto diffuso nelle fixture: 44 file pgTAP sceglievano il registro con una pescata INDIPENDENTE da quella dell''emittente, e che i due coincidessero era un caso. ⚠️ CREA il registro se manca, con limite_emissione_giorni = 9999: le fixture datano i documenti nel passato, e un limite attivo le farebbe cadere su un presidio che non stanno provando; chi il limite lo prova davvero (test-limite-emissione-v1) si costruisce il registro da se''. ⭐ Rev 2026-10-18 (20261019-12, R-BE-14): SALTA il registro delle fatture STANDARD (codice vendite.fn_codice_registro_provisionato(''FATTURA'', emittente)), che dal 20261019-08 nasce con ogni emittente col limite di emissione di DEFAULT. Su un emittente che aveva gia'' un registro restituisce lo stesso di prima (il primo per id, piu'' vecchio dello standard); su uno nuovo crea come prima il suo. Chi prova lo standard lo legge da vendite.fn_get_registro_id, il percorso vero. Compagna di script.fn_pgtap_emittente_sr_operatore. Piano: brief-db-registri-di-numerazione-emittente-e-trasloco, C1-3; brief-db-processi-accensione-per-ambiente §6.14.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Rollback: il corpo di 20260830-18 restituirebbe il registro
              -- standard alle fixture (R-BE-14). Se serve, ri-applicare 20260830-18.
              SELECT 1;
