# FASE B-b — I MOTIVI PER CUI UN ANNULLO NON SI PUO' FARE
#   script.fn_check_annullo_movimento_titolo_iva
#   Piano: brief-db-titoli-iva-movimenti-annullo, §6.3 B-b — decisione B-3
#
# ── ⭐ PERCHE' UNA FUNZIONE A SE', E NON IL PREDICATO DENTRO LA MADRE ─
#   Decisione B-3 di Tid (2026-08-30): quando l'annullo non si puo' fare,
#   l'operatore deve trovare il pulsante GIA' SPENTO, col motivo — non scoprirlo
#   premendo e prendendo un errore. Servono quindi DUE lettori della stessa
#   regola: la superficie che spegne il pulsante e la madre che rifiuta.
#   ⭐ E la madre CHIAMA questa, non riscrive il predicato: cosi' i due non
#   «coincidono oggi», NON POSSONO DIVERGERE. Il presidio da scrivere non e'
#   «gli esiti coincidono», e' «la madre non contiene piu' il predicato».
#
# ── ⛔ SECURITY DEFINER, ed e' la ragione per cui questo file esiste ──
#   anagrafiche.soggetti_titoli_iva_movimenti ha la RLS ATTIVA
#   (rls_soggetti_titoli_iva_movimenti_ef_whitelist, che pretende
#   ruolo OPERATORE + whitelist emittente). Questa funzione deve leggere il
#   movimento indicato per sapere che tipo e' — cioe' legge una riga di una
#   tabella con RLS.
#
#   Da SECURITY INVOKER non distinguerebbe «la riga non esiste» da «non la
#   vedo», e dovrebbe scegliere fra rifiutare con un messaggio fuorviante e
#   passare su una premessa non verificata.
#   ⛔ E la FK non ha lo stesso problema: in PostgreSQL i controlli di integrita'
#   referenziale SCAVALCANO SEMPRE la RLS. Quindi la FK accetterebbe un
#   riferimento a una riga che il chiamante non vede, mentre una check invoker la
#   tratterebbe come inesistente: i due divergerebbero IN SILENZIO.
#
#   ⚠️ `search_path` fissato: una funzione SECURITY DEFINER senza search_path
#   esplicito esegue con quello del chiamante, che puo' anteporre uno schema.
#
#   ⚠️ Il perimetro non si perde: la MADRE resta SECURITY INVOKER, quindi
#   l'INSERT della riga di annullo passa comunque dalla policy. Qui si scavalca
#   la RLS per una LETTURA di coerenza, non per una scrittura.
#
# ── ⚠️ L'ORDINE DELL'ARRAY E' IL CONTRATTO ──────────────────────────
#   La superficie mostra il PRIMO motivo e la madre solleva il codice del PRIMO.
#   Se l'ordine cambiasse, il tooltip direbbe una cosa e l'errore un'altra —
#   cioe' il difetto di partenza spostato di un passo.
#
# ── ⚠️ `valori` viaggia con il motivo ───────────────────────────────
#   E' il VARIADIC che la madre passa a fn_log_and_raise_error. Sta qui, accanto
#   al motivo, perche' la frase che l'operatore legge non si ricomponga in due
#   posti diversi — stessa forma di script.fn_check_accredito_annullabile.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260830-23-create-fn-check-annullo-movimento-titolo-iva-mctit.yaml

  - changeSet:
      id: 20260830-23-create-fn-check-annullo-movimento-titolo-iva
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Fase B-b del brief-db-titoli-iva-movimenti-annullo (decisione B-3 di Tid): la funzione
        PURA che elenca i motivi per cui l'annullo di un movimento di plafond non si puo' fare.
        Quattro motivi ordinati — non e' una forzatura, e' esso stesso un annullo, e' gia'
        annullato, porterebbe l'usato sotto zero — ognuno con reason, reason_key e i valori
        della frase. ⭐ Due lettori della stessa regola: la superficie che spegne il pulsante e
        la madre che rifiuta, che la CHIAMA invece di riscrivere il predicato — cosi' non
        possono divergere. ⛔ SECURITY DEFINER, ed e' la ragione per cui esiste: la tabella ha
        la RLS attiva e una lettura invoker non distinguerebbe «non esiste» da «non la vedo»,
        mentre la FK la RLS la scavalca sempre — i due divergerebbero in silenzio. La madre
        resta INVOKER, quindi il perimetro sulla scrittura non si perde.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: anagrafiche
                tableName: soggetti_titoli_iva_movimenti
                columnName: annulla_movimento_id
            - sqlCheck:
                expectedResult: 1
                sql: |
                  SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_log_and_raise_error';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_annullo_movimento_titolo_iva(
                  p_movimento_id anagrafiche.soggetti_titoli_iva_movimenti.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
               SECURITY DEFINER
               SET search_path = pg_catalog, anagrafiche, config, script
              AS $function$
              -- Scopo: elencare i motivi che impediscono di ANNULLARE un
              --   movimento del registro plafond IVA. Funzione PURA
              --   (fn_check_*): nessun raise di dominio, nessuna scrittura.
              -- Consumatori: anagrafiche.fn_annulla_movimento_titolo_iva
              --   (solleva il codice del PRIMO motivo) e il read-side
              --   vw_stiva_movimenti_dettaglio, che spegne il pulsante e dice
              --   perche' invece di far scoprire il vincolo sbagliando.
              -- Ritorna: [] se l'annullo si puo' fare; altrimenti array
              --   ORDINATO di {codice, reason, reason_key, dettaglio, valori}.
              --   `valori` e' il VARIADIC che la madre passa a
              --   fn_log_and_raise_error: sta qui perche' la frase che
              --   l'operatore legge non si ricomponga in due posti diversi.
              --   Piano: brief-db-titoli-iva-movimenti-annullo, decisione B-3.
              --
              -- ⛔ SECURITY DEFINER: legge una riga di
              --   anagrafiche.soggetti_titoli_iva_movimenti, che ha la RLS
              --   attiva. Da INVOKER non distinguerebbe «non esiste» da «non la
              --   vedo» — mentre la FK, che la RLS la scavalca sempre,
              --   accetterebbe lo stesso riferimento: i due divergerebbero in
              --   silenzio. Il perimetro non si perde, perche' la MADRE resta
              --   INVOKER e l'INSERT passa comunque dalla policy.
              DECLARE
                  v_motivi     jsonb := '[]'::jsonb;
                  v_mov        RECORD;
                  v_n_annulli  integer;
                  v_somma_post anagrafiche.soggetti_titoli_iva.imponibile_utilizzato%TYPE;
                  v_tipo_descr config.tipi_titolo_iva.descrizione%TYPE;
              BEGIN
                  -- Guard di parametro: un id assente o non positivo non esce da
                  -- nessuna interfaccia, lo produce un chiamante rotto — quindi
                  -- e' TECNICO, e la frase nomina il parametro perche' il
                  -- lettore e' chi ha scritto la chiamata.
                  IF p_movimento_id IS NULL OR p_movimento_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script','fn_check_annullo_movimento_titolo_iva',
                          'E_TITOLO_IVA_ANNULLO_INCOERENTE',
                          jsonb_build_object('parametro','p_movimento_id',
                                             'valore', p_movimento_id),
                          NULL::uuid,
                          COALESCE(p_movimento_id::text, 'assente'),
                          'identificativo del movimento non valido');
                  END IF;

                  SELECT m.id, m.titolo_iva_id, m.tipo_movimento, m.imponibile,
                         m.data_movimento, m.annulla_movimento_id
                    INTO v_mov
                    FROM anagrafiche.soggetti_titoli_iva_movimenti m
                   WHERE m.id = p_movimento_id;

                  -- ---- MOTIVO 0 — non c'e' niente da annullare ---------------
                  -- ⚠️ Qui «non esiste» e' davvero «non esiste»: la funzione e'
                  --   DEFINER, quindi non c'e' il caso «non lo vedo» che
                  --   renderebbe ambiguo questo ramo.
                  IF NOT FOUND THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TITOLO_IVA_ANNULLO_NON_AMMESSO',
                          'reason',     'MOVIMENTO_NON_TROVATO',
                          'reason_key', 'anagrafiche.titoli_iva.annullo_blocco.non_trovato',
                          'dettaglio',  jsonb_build_object('movimento_id', p_movimento_id),
                          'valori',     jsonb_build_array('', ''));
                      -- I motivi successivi leggono il movimento: senza, non
                      -- hanno niente da dire e aggiungerli direbbe il falso.
                      RETURN v_motivi;
                  END IF;

                  SELECT tt.descrizione
                    INTO v_tipo_descr
                    FROM anagrafiche.soggetti_titoli_iva t
                    JOIN config.tipi_titolo_iva tt ON tt.id = t.tipo_titolo_iva_id
                   WHERE t.id = v_mov.titolo_iva_id;

                  -- ---- MOTIVO 1 — non e' una forzatura ----------------------
                  -- Un movimento FATTURA o NOTA_CREDITO e' il riflesso di un
                  -- documento: si corregge DAL DOCUMENTO, con una nota di
                  -- credito, ed e' materia di I4. Annullarlo qui scollegherebbe
                  -- il plafond dal documento che lo ha consumato.
                  IF v_mov.tipo_movimento IS DISTINCT FROM 'FORZATURA' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TITOLO_IVA_ANNULLO_NON_AMMESSO',
                          'reason',     'NON_FORZATURA',
                          'reason_key', 'anagrafiche.titoli_iva.annullo_blocco.non_forzatura',
                          'dettaglio',  jsonb_build_object('movimento_id', v_mov.id,
                                                           'tipo_movimento', v_mov.tipo_movimento),
                          'valori',     jsonb_build_array(
                                            COALESCE(v_tipo_descr, ''),
                                            to_char(v_mov.data_movimento, 'DD/MM/YYYY')));
                      -- I due motivi che seguono valgono solo sulle forzature.
                      RETURN v_motivi;
                  END IF;

                  -- ---- MOTIVO 2 — e' esso stesso un annullo -----------------
                  -- Decisione B-2 di Tid (2026-08-30): un annullo non si
                  -- annulla. Se la forzatura serve ancora, se ne scrive una
                  -- NUOVA col suo motivo — il registro si legge come un racconto
                  -- dritto invece che come una catena da risalire.
                  IF v_mov.annulla_movimento_id IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TITOLO_IVA_ANNULLO_NON_AMMESSO',
                          'reason',     'E_UN_ANNULLO',
                          'reason_key', 'anagrafiche.titoli_iva.annullo_blocco.e_un_annullo',
                          'dettaglio',  jsonb_build_object('movimento_id', v_mov.id,
                                                           'annulla_movimento_id', v_mov.annulla_movimento_id),
                          'valori',     jsonb_build_array(
                                            COALESCE(v_tipo_descr, ''),
                                            to_char(v_mov.data_movimento, 'DD/MM/YYYY')));
                  END IF;

                  -- ---- MOTIVO 3 — e' gia' annullato ------------------------
                  -- L'indice unique parziale lo impedirebbe comunque, ma con un
                  -- errore di vincolo: qui si dice PERCHE', e prima del clic.
                  SELECT count(*)::integer
                    INTO v_n_annulli
                    FROM anagrafiche.soggetti_titoli_iva_movimenti a
                   WHERE a.annulla_movimento_id = v_mov.id;

                  IF COALESCE(v_n_annulli, 0) > 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TITOLO_IVA_ANNULLO_NON_AMMESSO',
                          'reason',     'GIA_ANNULLATO',
                          'reason_key', 'anagrafiche.titoli_iva.annullo_blocco.gia_annullato',
                          'dettaglio',  jsonb_build_object('movimento_id', v_mov.id),
                          'valori',     jsonb_build_array(
                                            COALESCE(v_tipo_descr, ''),
                                            to_char(v_mov.data_movimento, 'DD/MM/YYYY')));
                  END IF;

                  -- ---- MOTIVO 4 — porterebbe l'usato sotto zero ------------
                  -- ⚠️ Non e' un caso di scuola: basta che nel frattempo le note
                  --   di credito superino le fatture su quel titolo. Senza
                  --   questo motivo l'operatore prenderebbe
                  --   E_TITOLO_IVA_UTILIZZATO_NEGATIVO dall'accumulatore — vero,
                  --   ma che in quel momento non spiega ne' cosa e' successo ne'
                  --   cosa puo' fare.
                  -- ⭐ Si calcola la somma SENZA questo movimento, che e'
                  --   esattamente cio' che l'accumulatore troverebbe dopo aver
                  --   sommato il contro-movimento: -x annulla +x.
                  SELECT COALESCE(SUM(m.imponibile), 0)
                    INTO v_somma_post
                    FROM anagrafiche.soggetti_titoli_iva_movimenti m
                   WHERE m.titolo_iva_id = v_mov.titolo_iva_id
                     AND m.id <> v_mov.id;

                  IF v_somma_post < 0 THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_TITOLO_IVA_ANNULLO_NON_AMMESSO',
                          'reason',     'PLAFOND_NEGATIVO',
                          'reason_key', 'anagrafiche.titoli_iva.annullo_blocco.plafond_negativo',
                          'dettaglio',  jsonb_build_object('movimento_id', v_mov.id,
                                                           'titolo_iva_id', v_mov.titolo_iva_id,
                                                           'somma_post', v_somma_post),
                          'valori',     jsonb_build_array(
                                            COALESCE(v_tipo_descr, ''),
                                            to_char(v_mov.data_movimento, 'DD/MM/YYYY')));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$
              ;

              COMMENT ON FUNCTION script.fn_check_annullo_movimento_titolo_iva(bigint)
              IS 'Funzione PURA (fn_check_*): i motivi che impediscono di ANNULLARE un movimento del registro plafond IVA. Ritorna [] se ammesso, altrimenti array ORDINATO di {codice, reason, reason_key, dettaglio, valori}. Motivi, in ordine: movimento non trovato · non e'' una FORZATURA (un FATTURA si corregge dal documento, con una nota di credito - I4) · e'' esso stesso un annullo (decisione B-2: un annullo non si annulla, se la forzatura serve ancora se ne scrive una nuova) · e'' gia'' annullato · l''annullo porterebbe l''usato del titolo sotto zero. ⭐ Due lettori della stessa regola: vw_stiva_movimenti_dettaglio spegne il pulsante col motivo, e anagrafiche.fn_annulla_movimento_titolo_iva la CHIAMA invece di riscrivere il predicato — cosi'' non possono divergere. ⚠️ L''ordine dell''array e'' il contratto: la superficie mostra il primo motivo e la madre solleva il primo codice. ⛔ SECURITY DEFINER, e non e'' pigrizia: la tabella ha la RLS attiva e da INVOKER la lettura non distinguerebbe «non esiste» da «non la vedo», mentre la FK la RLS la scavalca sempre — i due divergerebbero in silenzio. La MADRE resta INVOKER, quindi il perimetro sulla scrittura non si perde. `valori` e'' il VARIADIC della madre e sta qui perche'' la frase non si ricomponga in due posti. Piano: brief-db-titoli-iva-movimenti-annullo, B-b.';

              REVOKE ALL ON FUNCTION script.fn_check_annullo_movimento_titolo_iva(bigint) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION script.fn_check_annullo_movimento_titolo_iva(bigint) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_annullo_movimento_titolo_iva(bigint);
