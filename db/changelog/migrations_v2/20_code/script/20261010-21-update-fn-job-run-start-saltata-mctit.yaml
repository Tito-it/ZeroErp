# ------------------------------------------------------------
# ⭐ LA SKIP SI DICHIARA: `saltata = TRUE`, esito vuoto.
#   Brief: brief-db-corsa-saltata-non-e-una-corsa §8.3 punto 2 (D2 di Tid)
#
#   Sul ramo del lock occupato la riga nasceva con `ok = TRUE`: per ogni
#   lettore era una corsa riuscita. Ora nasce `saltata`, chiusa, con `ok` NULL
#   (CHECK chk_job_run_log_saltata, 20261010-20). Il `message` resta come testo
#   per chi legge il giornale: non e' piu' il marcatore.
#   ⚠️ Il valore di ritorno non cambia: `acquired = false` resta il segnale al
#   chiamante (JobRunHandle del backend), che salta il corpo e non chiama
#   fn_job_run_end — e dal 20261010-23 fn_job_run_end lo rifiuta.
#
# ⚠️ Firma, RETURNS TABLE e ACL invariati: corpo dal 20260904-17, identico al
#   vivo (prosrc confrontato su zeroerp_ci, 2026-10-10). `SET search_path` e
#   SECURITY DEFINER ripetuti: un CREATE OR REPLACE senza li azzererebbe.
#
# Verifica: db/pgtap/maintenance/test-job-run-saltata-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261010-21-update-fn-job-run-start-saltata-mctit.yaml

  - changeSet:
      id: 20261010-21-update-fn-job-run-start-saltata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_job_run_start: sul lock occupato la riga di skip nasce
        saltata = TRUE, chiusa, ok NULL (prima ok = TRUE).
        brief-db-corsa-saltata-non-e-una-corsa §8.3.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: maintenance, tableName: job_run_log, columnName: saltata }
            - sqlCheck:
                expectedResult: "1"
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_job_run_start';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_job_run_start(
                  p_jobname         maintenance.job_run_log.jobname%TYPE,
                  p_origine         maintenance.job_run_log.origine%TYPE
                                        DEFAULT 'CRON',
                  p_stepname        maintenance.job_run_log.stepname%TYPE
                                        DEFAULT NULL,
                  -- `text` esplicito: e' il nome della corsia del lock, che
                  -- nessuna colonna conserva (si scrive solo hashtext()).
                  p_lock_key        text DEFAULT NULL,
                  p_agent_host      maintenance.job_run_log.agent_host%TYPE
                                        DEFAULT NULL,
                  p_processo_codice maintenance.job_run_log.processo_codice%TYPE
                                        DEFAULT NULL,
                  p_auth_user_id    maintenance.job_run_log.auth_user_id%TYPE
                                        DEFAULT NULL)
               RETURNS TABLE(id       maintenance.job_run_log.id%TYPE,
                             run_uuid maintenance.job_run_log.run_uuid%TYPE,
                             -- `boolean` esplicito: e' l'esito del lock, che
                             -- non e' una colonna (sulla riga c'e' `saltata`,
                             -- il suo contrario, ma il contratto e' questo).
                             acquired boolean)
               LANGUAGE plpgsql
               SECURITY DEFINER
               SET search_path TO 'pg_catalog', 'pg_temp'
              AS $function$
              DECLARE
                c_lock_class constant int := hashtext('zeroerp:job_run_log');  -- namespace lock headless
                v_acquired boolean := true;
                v_id   maintenance.job_run_log.id%TYPE;
                v_uuid maintenance.job_run_log.run_uuid%TYPE;
              BEGIN
                -- origine e' validata dal CHECK colonna (chk_job_run_log_origine) all'INSERT.
                -- p_processo_codice e' validato dalla FK fk_job_run_log_processi: un
                -- codice non registrato in dbops.processi fa fallire l'INSERT (fail-loud
                -- voluto). ⚠️ NULL resta ammesso finche' dura la transizione dei chiamanti.
                IF p_lock_key IS NOT NULL THEN
                  v_acquired := pg_try_advisory_lock(c_lock_class, hashtext(p_lock_key));
                  IF NOT v_acquired THEN
                    -- ⚠️ L'attore va scritto ANCHE sulla riga di skip: senza, ogni
                    --   sovrapposizione lascerebbe un run senza attore e terrebbe
                    --   accesa la vista di presidio per un caso che non e' un difetto.
                    -- ⭐ Rev 2026-10-10: la riga si dichiara SALTATA, chiusa e
                    --   senza esito (ok NULL). Con ok = TRUE ogni lettore la
                    --   contava come una corsa riuscita: brief-db-corsa-saltata-
                    --   non-e-una-corsa. Il message resta, ma e' solo testo.
                    INSERT INTO maintenance.job_run_log
                        (jobname, stepname, origine, saltata, ended_at, message, agent_host,
                         processo_codice, auth_user_id)
                    VALUES (p_jobname, p_stepname, p_origine, TRUE, clock_timestamp(),
                            'skip: another run in progress',
                            COALESCE(p_agent_host, inet_client_addr()::text),
                            p_processo_codice, p_auth_user_id)
                    RETURNING job_run_log.id, job_run_log.run_uuid INTO v_id, v_uuid;
                    RETURN QUERY SELECT v_id, v_uuid, FALSE;
                    RETURN;
                  END IF;
                END IF;

                INSERT INTO maintenance.job_run_log
                    (jobname, stepname, origine, agent_host,
                     processo_codice, auth_user_id)
                VALUES (p_jobname, p_stepname, p_origine,
                        COALESCE(p_agent_host, inet_client_addr()::text),
                        p_processo_codice, p_auth_user_id)
                RETURNING job_run_log.id, job_run_log.run_uuid INTO v_id, v_uuid;
                RETURN QUERY SELECT v_id, v_uuid, TRUE;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_job_run_start(
                  maintenance.job_run_log.jobname%TYPE,
                  maintenance.job_run_log.origine%TYPE,
                  maintenance.job_run_log.stepname%TYPE,
                  text,
                  maintenance.job_run_log.agent_host%TYPE,
                  maintenance.job_run_log.processo_codice%TYPE,
                  maintenance.job_run_log.auth_user_id%TYPE)
              IS 'Apre una riga su maintenance.job_run_log per un processo HEADLESS (management command / cron / systemd), con advisory lock anti-overlap opzionale. Rev 2026-09-04: prende p_processo_codice (l''ATTORE, hard FK verso dbops.processi) e p_auth_user_id (utente tecnico dei soli processi DOMINIO), e li scrive su ENTRAMBI i rami — anche sulla riga di «skip», altrimenti ogni sovrapposizione lascerebbe un run senza attore. Brief: brief-db-processi-automatici-identita-e-perimetro §3.2. ⭐ Rev 2026-10-10: col lock occupato la riga nasce SALTATA (saltata = TRUE), chiusa e con ok NULL, e la funzione torna acquired = false. Prima nasceva con ok = TRUE, e ogni lettore la contava come una corsa riuscita: una sveglia calendariale saltava il periodo, una corsa appesa spariva dal presidio. Il chiamante che riceve acquired = false salta il lavoro e NON chiude la corsa (script.fn_job_run_end la rifiuta). Brief: brief-db-corsa-saltata-non-e-una-corsa §8.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ Tornare al corpo del 20260904-17 rimetterebbe ok = TRUE sulla
              --   skip, e il CHECK chk_job_run_log_saltata non lo vieta solo
              --   perche' quel corpo non scrive `saltata`: rifarebbe il difetto.
              --   Il verso di ritiro e' un changeSet nuovo.
              SELECT 1;
