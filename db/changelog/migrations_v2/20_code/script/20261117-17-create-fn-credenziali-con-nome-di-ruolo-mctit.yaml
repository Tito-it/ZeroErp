# ------------------------------------------------------------
# script.fn_credenziali_con_nome_di_ruolo: le credenziali dell'applicazione che
#   si chiamano come un ruolo del database, o SEED, senza distinguere maiuscole e
#   minuscole. E' l'accessore del terzo motivo di dbops.vw_credenziali_da_sanare
#   (NOME_DI_RUOLO_DB, 20261117-18).
#   Brief: brief-db-seed-primo-impianto-non-si-riscrive (§15.6, Q17)
#
# Perche' conta: quando il runner del seed di primo impianto iscrive una tabella,
#   riconosce le righe di seed che ci sono gia' da user_insert ('SEED' o un ruolo
#   del migratore). Una credenziale con quel nome fa sembrare «di seed» una riga
#   dell'installazione (non si cancella piu': l'errore va dalla parte sicura).
#   Q17: niente divieto alla nascita, il presidio basta.
#
# ⛔ plpgsql e niente %TYPE su django.*: lo schema django non ha tabelle quando
#   Liquibase gira; una vista non lo nomina, passa da un accessore late-bound
#   (stampo: script.fn_get_auth_user_stato).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261117-17-create-fn-credenziali-con-nome-di-ruolo-mctit.yaml

  - changeSet:
      id: 20261117-17-create-fn-credenziali-con-nome-di-ruolo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_credenziali_con_nome_di_ruolo: le credenziali che si chiamano come un ruolo del database
        o SEED. Brief: brief-db-seed-primo-impianto-non-si-riscrive.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_credenziali_con_nome_di_ruolo'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_credenziali_con_nome_di_ruolo()
              -- integer e text espliciti: colonne di django.auth_user, che al
              -- CREATE puo' non esistere (niente %TYPE su django.*)
              RETURNS TABLE (auth_user_id integer, username text)
              LANGUAGE plpgsql
              STABLE
              AS $function$
              BEGIN
                  -- Scopo: le credenziali il cui username e' SEED o il nome di un
                  --   ruolo del database (pg_roles), senza distinguere maiuscole e
                  --   minuscole.
                  RETURN QUERY
                  SELECT au.id, au.username::text
                    FROM django.auth_user au
                   WHERE upper(au.username) = 'SEED'
                      OR EXISTS (SELECT 1
                                   FROM pg_catalog.pg_roles r
                                  WHERE lower(r.rolname) = lower(au.username))
                   ORDER BY au.id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_credenziali_con_nome_di_ruolo() IS
                  'Le credenziali dell''applicazione (django.auth_user) il cui username e'' SEED o il nome di un ruolo del database (pg_roles), senza distinguere maiuscole e minuscole. Accessore del motivo NOME_DI_RUOLO_DB di dbops.vw_credenziali_da_sanare: una credenziale cosi'', quando il runner del seed di primo impianto iscrive una tabella, fa sembrare nata dal seed una riga scritta da lei. plpgsql, cosi'' la vista non dipende dallo schema django alla creazione. INVOKER, STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ La vista la chiama da 20261117-18: rollback di quello prima.
              DROP FUNCTION IF EXISTS script.fn_credenziali_con_nome_di_ruolo();
