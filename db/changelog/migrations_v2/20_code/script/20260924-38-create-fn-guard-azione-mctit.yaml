# P-1 — IL DB APPLICA IL PERMESSO: script.fn_guard_azione(p_auth_user_id, p_permission_codename)
#   Brief: brief-db-magazzino-verbi-con-permesso, sezione 2.1
#   Modello: brief-db-permesso-nel-verbo-di-scrittura (D-1, D-2)
#
# -- PERCHE' (D-1) --------------------------------------------------------------------------------
#   Il DB CALCOLA i permessi (fn_check_azione_processo, fn_resolve_livello_*) ma
#   non li APPLICA: lo fa solo il backend. Un verbo di scrittura che chiama
#   questo guard nella prima riga rende il permesso un fatto del DB, non una
#   disciplina del backend.
#
# -- UNA REGOLA, DUE PUNTI DI APPLICAZIONE --------------------------------------------------------
#   Il guard NON riscrive la regola: chiede a script.fn_check_azione_processo,
#   la stessa funzione che chiama il backend (PermissionResolver.check_azione).
#   Gate di contesto (ruolo applicativo diverso da OPERATORE), identita' attiva,
#   super admin, override utente, profili: tutto li' dentro, una sede sola.
#
# -- GUARD, NON CHECK (linee-guida-sql §5) --------------------------------------------------------
#   Blocca sollevando, non ritorna un boolean da guardare: fn_guard_*.
#   Il predicato puro esiste gia' ed e' fn_check_azione_processo.
#
# -- L'UTENTE ARRIVA COME PARAMETRO (linee-guida-sql §10.4) ---------------------------------------
#   Il chiamante legge app.current_user_id con la stessa espressione delle
#   policy e lo passa: il guard resta provabile con input espliciti.
#   ⛔ Utente NULL (sessione che non dichiara chi agisce) = permesso negato,
#   fail-closed, con 'senza_utente' nel contesto per chi diagnostica. Nessuna
#   eccezione per il proprietario o per i job: quando un job dovra' agire, avra'
#   una sua identita'.
#
# -- UN'AZIONE CHE NON ESISTE E' UN CHIAMANTE ROTTO, NON UN RIFIUTO --------------------------------
#   Con un codename sbagliato fn_check_azione_processo risponderebbe false per
#   sempre: il verbo direbbe «non hai i permessi» a tutti, e si cercherebbe nei
#   profili un difetto che sta nel codice. Si solleva E_CONFIG_MANCANTE
#   (TECNICO), stampo delle sorgenti in fn_posta_inventario. ⚠️ Si controlla
#   l'ESISTENZA, non `attivo`: fn_check_azione_processo non guarda `attivo`, e
#   il guard non deve rispondere diversamente dal backend.
#
# -- I CODICI: RIUSATI, NESSUNO NUOVO -------------------------------------------------------------
#   E_PERMESSO_NEGATO (NON_PERMESSO, «Non hai i permessi per questa
#   operazione.», nessun segnaposto -> VARIADIC vuoto esplicito) e' lo stesso
#   codice che il backend da' per lo stesso rifiuto. E_CONFIG_MANCANTE
#   («Configurazione mancante: %s») per il codename sconosciuto.
#
# -- %TYPE ----------------------------------------------------------------------------------------
#   Parametri e variabili ancorati alle colonne (regola di Tid: firma, DECLARE,
#   RETURNS). COMMENT e GRANT usano la firma SCIOLTA (integer, character
#   varying): e' quella che PostgreSQL registra.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260924-38-create-fn-guard-azione-mctit.yaml

  - changeSet:
      id: 20260924-38-create-fn-guard-azione
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_guard_azione(p_auth_user_id, p_permission_codename): il guard con cui un verbo di
        scrittura applica un'azione di processo. Chiede a script.fn_check_azione_processo (la
        stessa funzione del backend) e solleva E_PERMESSO_NEGATO se la risposta e' no, anche a
        utente NULL (fail-closed); E_CONFIG_MANCANTE se l'azione non esiste. INVOKER.
        Brief: brief-db-magazzino-verbi-con-permesso, sezione 2.1.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_azione_processo';
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'config' AND c.relname = 'azioni_processo';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_guard_azione(
                  p_auth_user_id        config.user_override_azioni.auth_user_id%TYPE,
                  p_permission_codename config.azioni_processo.permission_codename%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: applicare un'azione di processo nella prima riga di un verbo di
              --   scrittura. La regola la decide script.fn_check_azione_processo (la stessa
              --   del backend); qui si solleva quando la risposta e' no.
              -- Uso: PERFORM script.fn_guard_azione(
              --          NULLIF(current_setting('app.current_user_id', true), '')::integer,
              --          'registra_magazzino');
              DECLARE
                  v_azione_id config.azioni_processo.id%TYPE;
              BEGIN
                  -- 1. L'azione esiste? Un codename sbagliato e' un chiamante rotto, e
                  --    diventerebbe un «non hai i permessi» per tutti.
                  SELECT ap.id
                    INTO v_azione_id
                    FROM config.azioni_processo ap
                   WHERE ap.permission_codename = p_permission_codename;

                  IF v_azione_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_guard_azione', 'E_CONFIG_MANCANTE',
                          jsonb_build_object('config', 'config.azioni_processo',
                                             'azione', p_permission_codename),
                          NULL::uuid,
                          VARIADIC ARRAY[format('azione di processo %s',
                                                COALESCE(p_permission_codename, '(nessuna)'))]);
                  END IF;

                  -- 2. La risposta della regola. NULL (utente NULL) vale no: fail-closed.
                  IF NOT COALESCE(script.fn_check_azione_processo(p_auth_user_id, p_permission_codename), false) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_guard_azione', 'E_PERMESSO_NEGATO',
                          jsonb_build_object('azione',       p_permission_codename,
                                             'auth_user_id', p_auth_user_id,
                                             'senza_utente', p_auth_user_id IS NULL),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_guard_azione(integer, character varying) IS
                  'Guard dei verbi di scrittura (modello «una scrittura = un verbo», D-1/D-2 di '
                  'brief-db-permesso-nel-verbo-di-scrittura): applica un''azione di processo '
                  'nella prima riga del verbo. La regola NON e'' qui: la decide '
                  'script.fn_check_azione_processo, la stessa funzione che usa il backend (gate di '
                  'contesto, identita'' OPERATORE attiva, super admin, override utente, profili). '
                  'Risposta no -> E_PERMESSO_NEGATO (NON_PERMESSO, lo stesso codice del backend), '
                  'anche a utente NULL: fail-closed, con senza_utente nel contesto. Azione '
                  'inesistente -> E_CONFIG_MANCANTE: e'' un chiamante rotto, non un rifiuto (si '
                  'controlla l''esistenza, non attivo, come fa la regola). L''utente arriva come '
                  'parametro: il chiamante legge app.current_user_id con l''espressione delle policy '
                  '(linee-guida-sql §10.4). INVOKER. Brief: brief-db-magazzino-verbi-con-permesso §2.1.';

              GRANT EXECUTE ON FUNCTION script.fn_guard_azione(integer, character varying) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_guard_azione(integer, character varying);
