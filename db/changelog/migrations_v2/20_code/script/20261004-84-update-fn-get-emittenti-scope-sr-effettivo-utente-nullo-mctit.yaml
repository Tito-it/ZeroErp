# script.fn_get_emittenti_scope_sr_effettivo: con l'utente NULL restituisce
# '{}' (nessun accesso), non piu' la sola restrizione del chiamante.
#
#   Il ramo «attore nullo» restituiva p_richiesti, e con p_richiesti NULL
#   significava «nessuna restrizione». I due chiamanti
#   (fn_search_soggetti_universale, fn_get_search_detail) sono INVOKER e
#   leggono app.current_user_id da soli: una sessione senza utente cercava
#   soggetti su tutte le aziende. Nessun job li chiama (censiti il
#   2026-10-04): sono la ricerca dell'interfaccia.
#   Terzo membro della famiglia «utente NULL = tutto», chiuso con la
#   canonica (-82) e via_efba (-83). ⚠️ Effetto sui pgTAP: i test 6 e 7 di
#   script/test-search-scope-interno-v1 pinnavano la vecchia convenzione.
#
# Brief: brief-db-esclusioni-implicite (Q-1).
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261004-84-update-fn-get-emittenti-scope-sr-effettivo-utente-nullo-mctit.yaml

  - changeSet:
      id: 20261004-84-update-fn-get-emittenti-scope-sr-effettivo-utente-nullo
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_emittenti_scope_sr_effettivo: utente NULL -> '{}' (era la restrizione del
        chiamante, NULL = tutto). Brief: brief-db-esclusioni-implicite (Q-1).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_emittenti_scope_sr_effettivo'
                 AND pg_get_function_identity_arguments(p.oid) = 'p_auth_user_id integer, p_richiesti bigint[]';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_emittenti_scope_sr_effettivo(p_auth_user_id integer, p_richiesti bigint[] DEFAULT NULL::bigint[])
               RETURNS bigint[]
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                  v_diritto bigint[];
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Scope emittenti EFFETTIVO (SR id) per un lettore che
                  --   accetta anche una restrizione dal chiamante.
                  --   Semantica invariata dalla famiglia:
                  --     NULL  = nessuna restrizione
                  --     '{}'  = nessun accesso
                  --     array = whitelist SR
                  --
                  -- Regola unica: IL CHIAMANTE PUO' SOLO RESTRINGERE.
                  --   effettivo = diritto ∩ richiesto, con NULL = universo su
                  --   entrambi i lati. E' lo stesso invariante «solo
                  --   restringente, mai allargante» con cui l'emittente attivo
                  --   si combina con lo scope di diritto (rev 2026-08-04): qui
                  --   si applica a un parametro invece che a una GUC. Non e'
                  --   una regola nuova, e' la stessa in un altro punto.
                  --
                  -- Perche' esiste (brief §11.6, decisione Q2/C):
                  --   fn_search_soggetti_universale e fn_get_search_detail
                  --   erano le UNICHE due funzioni di scope a fidarsi
                  --   interamente di un array calcolato dal chiamante. Lo scope
                  --   usciva dal database con TRE significati e rientrava da
                  --   Python con DUE: in Python la lista vuota e il NULL sono
                  --   entrambi falsi, e ogni idioma naturale del linguaggio
                  --   (`if ids:`, `ids or []`) li fonde. Non era una svista di
                  --   chi scrisse quella riga: era un canale che perdeva per
                  --   costruzione, e infatti la fusione era gia' avvenuta in
                  --   due punti indipendenti. Qui la risposta non esce piu'.
                  --
                  -- ⚠️ PARALLEL: non e' marcata SAFE perche' chiama
                  --   fn_get_emittenti_scope_sr_ids, che e' STABLE e basta.
                  --   Dichiararla SAFE sarebbe una bugia al planner.
                  -- =========================================================

                  -- Attore nullo: nessun accesso.
                  -- ⚠️ Rev 2026-10-04 (Q-1, brief-db-esclusioni-implicite): era
                  --    `RETURN p_richiesti`, cioe' «nessuno scope di diritto da
                  --    opporre», per la convenzione della famiglia. Con la
                  --    restrizione NULL voleva dire «vede tutto»: le due ricerche che
                  --    la chiamano (fn_search_soggetti_universale,
                  --    fn_get_search_detail) sono INVOKER e leggono l'utente dalla
                  --    GUC, quindi una sessione senza utente cercava su tutte le
                  --    aziende. La famiglia cambia nello stesso giro (canonica e
                  --    via_efba): l'utente NULL non vede niente.
                  IF p_auth_user_id IS NULL THEN
                      RETURN '{}'::bigint[];
                  END IF;

                  v_diritto := script.fn_get_emittenti_scope_sr_ids(p_auth_user_id);

                  -- Universo di diritto (super admin): decide il chiamante, che
                  -- puo' solo restringere. NULL richiesto = nessuna restrizione.
                  IF v_diritto IS NULL THEN
                      RETURN p_richiesti;
                  END IF;

                  -- Nessun accesso di diritto: '{}' e NON NULL.
                  -- ⚠️ E' il punto per cui questa funzione esiste: restituire
                  -- NULL qui vorrebbe dire «vede tutto», cioe' ricreare in SQL
                  -- lo stesso appiattimento che si voleva togliere a Python.
                  IF cardinality(v_diritto) = 0 THEN
                      RETURN '{}'::bigint[];
                  END IF;

                  -- Nessuna restrizione dal chiamante: vale lo scope di diritto.
                  IF p_richiesti IS NULL THEN
                      RETURN v_diritto;
                  END IF;

                  -- Intersezione.
                  -- ⚠️ coalesce OBBLIGATORIO: array_agg su zero righe ritorna
                  -- NULL, che qui significherebbe «vede tutto». E' la stessa
                  -- trappola gia' corretta in fn_get_emittenti_scope_sr_ids il
                  -- 2026-08-04, nello stesso identico punto logico.
                  RETURN (
                      SELECT coalesce(array_agg(t.x ORDER BY t.x), '{}'::bigint[])
                        FROM unnest(v_diritto) AS t(x)
                       WHERE t.x = ANY(p_richiesti)
                  );
              END
              $function$;

              COMMENT ON FUNCTION script.fn_get_emittenti_scope_sr_effettivo(p_auth_user_id integer, p_richiesti bigint[])
              IS 'Scope emittenti EFFETTIVO (soggetto_ruolo_id) = scope di diritto (fn_get_emittenti_scope_sr_ids) ∩ restrizione del chiamante, con NULL = universo su entrambi i lati. Semantica: NULL=tutto, ''{}''=nessuno, array=whitelist. Invariante: IL CHIAMANTE PUO'' SOLO RESTRINGERE, mai allargare — stesso principio dell''emittente attivo (rev 2026-08-04) applicato a un parametro. Attore nullo -> ''{}'', nessun accesso (rev 2026-10-04, Q-1: prima valeva la sola restrizione del chiamante, cioe'' NULL = tutto per le due ricerche). Esiste perche'' fn_search_soggetti_universale e fn_get_search_detail erano le uniche due funzioni di scope a fidarsi di un array calcolato fuori dal database: la convenzione a tre stati non sopravvive al viaggio attraverso Python, dove [] e None sono entrambi falsi. Brief perimetro-emittente §11.6 (Q2/C). Brief: brief-db-esclusioni-implicite Q-1.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
