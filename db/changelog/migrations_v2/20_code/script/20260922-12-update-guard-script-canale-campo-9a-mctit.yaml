        - onFailMessage: >-
            script: il corpo di una funzione da sanare non e' quello letto il
            22-09 (md5 diverso): qualcuno l'ha toccata dopo. Rileggere il
            vivo e rigenerare questo changeSet, non applicarlo.
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_disdetta_cliente'
                     AND md5(p.prosrc) = '3b21b259ace0090e5ae317e3904d11ef'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_guard_soggetto_pf_pura'
                     AND md5(p.prosrc) = '2f10fd9849c1e28924d13b8dfbce641d'
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'trgfn_componenti_check_prezzo_obbligatorio'
                     AND md5(p.prosrc) = 'd36deb9c0e8d217395d917416cf06fd8'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_disdetta_cliente(
                  p_cliente_id      anagrafiche.clienti.id%TYPE,
                  p_data_cessazione anagrafiche.clienti.data_chiusura%TYPE
              )
               RETURNS anagrafiche.clienti.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_attivo_id   config.stati_cliente.id%TYPE;
                  v_stato_chiuso_id   config.stati_cliente.id%TYPE;
                  v_codice_attivo     config.stati_cliente.codice_interno%TYPE := 'AT';
                  v_codice_chiuso     config.stati_cliente.codice_interno%TYPE := 'CH';
                  v_data_attivazione  anagrafiche.clienti.data_attivazione%TYPE;
                  v_stato_corrente_id anagrafiche.clienti.stato_cliente_id%TYPE;
              BEGIN
              -- ------------------------------------------------------------
              -- Funzione: script.fn_disdetta_cliente
              --
              -- Scopo:
              --   Cessazione di un cliente senza subentro (disdetta).
              --   Chiude il cliente impostando data_chiusura e stato CH.
              --   I trigger cascata gestiscono:
              --     - trgfn_clienti_set_periodo -> aggiorna periodo
              --     - trgfn_clienti_sync_stato_pdp -> PDP torna DISPONIBILE
              --     - trgfn_storico_generic -> storicizzazione
              --     - trgfn_audit_data_user_generic -> audit
              --
              -- Policy BA:
              --   Il billing_account NON viene toccato dalla disdetta.
              --   Resta attivo per fatture finali, conguagli e riconciliazioni.
              --   La chiusura del BA e' un'operazione separata.
              --
              -- Parametri:
              --   p_cliente_id      -> ID del cliente da cessare (NOT NULL, > 0)
              --   p_data_cessazione -> Data di cessazione (NOT NULL, >= data_attivazione)
              --
              -- Ritorna:
              --   ID del cliente cessato
              -- ------------------------------------------------------------

                  ----------------------------------------------------------------
                  -- 1) Guard: parametri non nulli e validi
                  ----------------------------------------------------------------
                  IF p_cliente_id IS NULL OR p_cliente_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_disdetta_cliente',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object(
                              'parametro', 'p_cliente_id',
                              'valore', p_cliente_id
                          ),
                          NULL::uuid,
                          'p_cliente_id deve essere NOT NULL e > 0'
                      );
                  END IF;

                  IF p_data_cessazione IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_disdetta_cliente',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object(
                              'parametro', 'p_data_cessazione'
                          ),
                          NULL::uuid,
                          'p_data_cessazione deve essere NOT NULL'
                      );
                  END IF;

                  ----------------------------------------------------------------
                  -- 2) Recupero ID stati cliente AT e CH
                  ----------------------------------------------------------------
                  SELECT sc.id INTO v_stato_attivo_id
                    FROM config.stati_cliente sc
                   WHERE sc.codice_interno = v_codice_attivo;

                  SELECT sc.id INTO v_stato_chiuso_id
                    FROM config.stati_cliente sc
                   WHERE sc.codice_interno = v_codice_chiuso;

                  IF v_stato_attivo_id IS NULL OR v_stato_chiuso_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_disdetta_cliente',
                          'E_CONFIG_MANCANTE',
                          jsonb_build_object(
                              'detail', 'Stati cliente AT e/o CH non trovati in config.stati_cliente'
                          ),
                          NULL::uuid,
                          'AT/CH'
                      );
                  END IF;

                  ----------------------------------------------------------------
                  -- 3) Leggo il cliente con lock (evita race condition)
                  ----------------------------------------------------------------
                  SELECT c.stato_cliente_id, c.data_attivazione
                    INTO v_stato_corrente_id, v_data_attivazione
                    FROM anagrafiche.clienti c
                   WHERE c.id = p_cliente_id
                     FOR UPDATE;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_disdetta_cliente',
                          'E_CLIENTE_NON_TROVATO',
                          jsonb_build_object('p_cliente_id', p_cliente_id),
                          NULL::uuid,
                          p_cliente_id::text
                      );
                  END IF;

                  ----------------------------------------------------------------
                  -- 4) Guard: il cliente deve essere in stato ATTIVO (AT)
                  ----------------------------------------------------------------
                  IF v_stato_corrente_id <> v_stato_attivo_id THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_disdetta_cliente',
                          'E_CLIENTE_NON_ATTIVO',
                          jsonb_build_object(
                              'p_cliente_id', p_cliente_id,
                              'stato_corrente_id', v_stato_corrente_id,
                              'stato_atteso', 'AT'
                          ),
                          NULL::uuid,
                          p_cliente_id::text, v_stato_corrente_id::text
                      );
                  END IF;

                  ----------------------------------------------------------------
                  -- 5) Guard: data cessazione >= data attivazione
                  ----------------------------------------------------------------
                  IF v_data_attivazione IS NOT NULL
                     AND p_data_cessazione < v_data_attivazione
                  THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'script.fn_disdetta_cliente',
                          'E_DATA_CESSAZIONE_INVALIDA',
                          jsonb_build_object(
                              'campo', 'data_cessazione',
                              'p_cliente_id', p_cliente_id,
                              'p_data_cessazione', p_data_cessazione,
                              'data_attivazione', v_data_attivazione
                          ),
                          NULL::uuid,
                          p_data_cessazione::text, v_data_attivazione::text
                      );
                  END IF;

                  ----------------------------------------------------------------
                  -- 6) Eseguo disdetta: data_chiusura + stato CH
                  --    I trigger cascata sulla tabella clienti gestiscono:
                  --      - trgfn_clienti_set_periodo -> [data_attivazione, data_chiusura)
                  --      - trgfn_clienti_sync_stato_pdp -> PDP torna DISPONIBILE
                  --      - trgfn_storico_generic -> storicizzazione
                  --      - trgfn_audit_data_user_generic -> audit
                  ----------------------------------------------------------------
                  UPDATE anagrafiche.clienti c
                     SET data_chiusura    = p_data_cessazione,
                         stato_cliente_id = v_stato_chiuso_id
                   WHERE c.id = p_cliente_id;

                  RETURN p_cliente_id;
              END;
              $function$
              ;
              CREATE OR REPLACE FUNCTION script.fn_guard_soggetto_pf_pura(
                  p_soggetto_id anagrafiche.soggetti.id%TYPE
              )
               RETURNS anagrafiche.soggetti.id%TYPE
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- Variabili locali tipizzate sulle colonne sorgente (policy %TYPE)
                  v_partita_iva    anagrafiche.soggetti.partita_iva%TYPE;
                  v_codice_fiscale anagrafiche.soggetti.codice_fiscale%TYPE;
              BEGIN
                  -- ------------------------------------------------------------
                  -- Funzione: script.fn_guard_soggetto_pf_pura
                  --
                  -- Scopo:
                  --   Guard fail-fast che verifica che un soggetto sia persona
                  --   fisica "pura" (idoneo a essere collegato a un auth_user
                  --   nella veste OPERATORE).
                  --
                  -- Regole di dominio:
                  --   1. codice_fiscale deve essere valorizzato (identificazione)
                  --   2. partita_iva deve essere NULL (no professionisti/ditte
                  --      individuali: appartengono ad altre vesti)
                  --
                  -- Parametri:
                  --   p_soggetto_id -> id del soggetto da verificare
                  --
                  -- Ritorna:
                  --   p_soggetto_id (se valido); altrimenti solleva eccezione
                  --   via script.fn_log_and_raise_error.
                  -- ------------------------------------------------------------

                  -- 1) Validazione parametro: rifiuta NULL (non si puo' guardare
                  --    un soggetto inesistente).
                  IF p_soggetto_id IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_guard_soggetto_pf_pura',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_soggetto_id'),
                          NULL::uuid,
                          'NULL'
                      );
                  END IF;

                  -- 2) Recupero dati fiscali del soggetto in un unico round-trip.
                  --    Uso la variabile built-in FOUND di PL/pgSQL (pattern idiomatico)
                  --    per distinguere "soggetto non trovato" da "colonne NULL".
                  SELECT s.partita_iva, s.codice_fiscale
                    INTO v_partita_iva, v_codice_fiscale
                    FROM anagrafiche.soggetti s
                   WHERE s.id = p_soggetto_id;

                  IF NOT FOUND THEN
                      -- Soggetto inesistente: violazione di integrita' (il chiamante
                      -- avrebbe gia' dovuto garantire la FK). Fail-fast.
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_guard_soggetto_pf_pura',
                          'E_SOGGETTO_NOT_FOUND',
                          jsonb_build_object('soggetto_id', p_soggetto_id),
                          NULL::uuid,
                          p_soggetto_id::text
                      );
                  END IF;

                  -- 3) Guard PF pura: catena IF/ELSIF (fail-fast al primo problema).
                  --    Ordine voluto: prima no-PIVA (regola piu' specifica del dominio
                  --    aziendale), poi CF obbligatorio (vincolo identificativo).
                  IF v_partita_iva IS NOT NULL THEN
                      -- Soggetto con P.IVA: professionista o ditta individuale,
                      -- non ammissibile come OPERATORE (accede in altra veste,
                      -- es. FORNITORE_PORTALE).
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_guard_soggetto_pf_pura',
                          'E_AUTH_USER_SOGGETTO_CON_PIVA',
                          jsonb_build_object(
                              'campo', 'soggetto_id',
                              'soggetto_id', p_soggetto_id,
                              'nota', 'Solo persone fisiche pure (senza P.IVA) possono essere collegate ad auth_user come OPERATORE'
                          ),
                          NULL::uuid,
                          p_soggetto_id::text
                      );
                  ELSIF v_codice_fiscale IS NULL THEN
                      -- CF obbligatorio: serve per identificare la persona fisica
                      -- in modo univoco (obblighi anagrafici / normativi).
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_guard_soggetto_pf_pura',
                          'E_AUTH_USER_SOGGETTO_SENZA_CF',
                          jsonb_build_object(
                              'soggetto_id', p_soggetto_id,
                              'nota', 'Il soggetto deve avere un codice fiscale per essere identificato come persona fisica'
                          ),
                          NULL::uuid,
                          p_soggetto_id::text
                      );
                  END IF;

                  -- 4) Tutti i guard superati: restituisco l'id (pattern "pass-through"
                  --    che consente chain come: SELECT script.fn_guard_soggetto_pf_pura(:id)).
                  RETURN p_soggetto_id;
              END;
              $function$
              ;
              CREATE OR REPLACE FUNCTION script.trgfn_componenti_check_prezzo_obbligatorio()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: BEFORE INSERT OR UPDATE su *_righe_componenti — blocca
              --   prezzo_unitario=0 solo per componenti obbligatori. Componenti
              --   opzionali ammettono prezzo=0 (incluso a costo zero). Negativi
              --   ammessi per entrambi (sconti, abbuoni).
              DECLARE
                  v_obbligatorio  catalogo.articoli_componenti.obbligatorio%TYPE;
                  v_codice_comp   catalogo.articoli.codice%TYPE;
              BEGIN
                  -- Legge obbligatorio e codice componente in unica query
                  SELECT ac.obbligatorio, a.codice
                    INTO v_obbligatorio, v_codice_comp
                    FROM catalogo.articoli_componenti ac
                    JOIN catalogo.articoli a ON a.id = ac.componente_id
                   WHERE ac.id = NEW.articolo_componente_id;

                  -- Obbligatorio + prezzo zero: bloccato
                  IF COALESCE(v_obbligatorio, TRUE) AND NEW.prezzo_unitario = 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', TG_NAME, 'E_DOC_COMPONENTE_OBBLIGATORIO_PREZZO_ZERO',
                          jsonb_build_object(
                              'campo',                  'prezzo_unitario',
                              'articolo_componente_id', NEW.articolo_componente_id,
                              'componente_id',          NEW.componente_id,
                              'prezzo_unitario',        NEW.prezzo_unitario
                          ),
                          NULL::uuid,
                          COALESCE(v_codice_comp, NEW.componente_id::text)
                      );
                  END IF;

                  RETURN NEW;
              END;
              $function$
              ;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_disdetta_cliente(p_cliente_id bigint, p_data_cessazione date)
               RETURNS bigint
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  v_stato_attivo_id   config.stati_cliente.id%TYPE;
                  v_stato_chiuso_id   config.stati_cliente.id%TYPE;
                  v_codice_attivo     config.stati_cliente.codice_interno%TYPE := 'AT';
                  v_codice_chiuso     config.stati_cliente.codice_interno%TYPE := 'CH';
                  v_data_attivazione  anagrafiche.clienti.data_attivazione%TYPE;
                  v_stato_corrente_id anagrafiche.clienti.stato_cliente_id%TYPE;
              BEGIN
              -- ------------------------------------------------------------
              -- Funzione: script.fn_disdetta_cliente
              --
              -- Scopo:
