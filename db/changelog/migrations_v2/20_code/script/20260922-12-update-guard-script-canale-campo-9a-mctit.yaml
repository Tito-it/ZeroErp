# brief-be-presidio-ui-action-e-canale-campi §4-ter.2 — I 9 A: SANATURA DEL
# CANALE `campo` in `script` (giro 2, dopo i 30 A di 20260921-43…-49).
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   Questi codici promettono a catalogo `ui_action = highlight_form_fields`
#   («evidenzia il campo del form»), ma il campo lo accende un ALTRO canale:
#   la COLUMN che script.fn_log_and_raise_error legge dal context — chiave
#   `campo`, ripiego `parametro`. Qui il context non la portava (o portava il
#   nome della colonna come CHIAVE, nel posto che l'helper non legge):
#   dbops.vw_punti_canale_campo li dava NESSUNO / CHIAVE_NON_LETTA. A video:
#   un toast e nessun campo rosso. Il test del brief
#   (apps/core/tests/test_ui_action_e_canale_campi.py, verso 1) e' ROSSO su
#   questi codici di proposito — niente _DEBITO, niente esenzioni di comodo —
#   e questo changeSet lo fa tornare verde.
#
#   ⭐ Perche' non erano nei 37 del 21-09: la misura del §3-bis li aveva
#   messi nel bucket «forse» (un 'campo' in UN'ALTRA chiamata dello stesso
#   corpo, non attribuibile). La vista attribuisce, e il test li ha trovati
#   la sera stessa. La lista a mano era corta di 12: 9 A qui, 3 B al BE.
#
# ── ⭐ LA CORREZIONE: una coppia in piu', NIENTE ALTRO ─────────────
#   `'campo', '<colonna>'` come prima coppia del jsonb_build_object della
#   chiamata che nomina il codice. Guard, messaggio, VARIADIC, tx_id:
#   intatti. Il nome e' quello dell'INPUT che l'operatore ha davanti — una
#   CHIAVE DEL PAYLOAD nel Python che chiama (api.md §Envelope): un id
#   dall'URL o un parametro di firma NON lo e' (strada B, l'override esce
#   dal lato BE).
#
# ── I CODICI, E IL CAMPO SCELTO (tabella A/B del §4-ter.2, ok di Tid) ──
#   script.fn_disdetta_cliente
#     E_DATA_CESSAZIONE_INVALIDA -> data_cessazione (la soluzione a catalogo
#       dice «indicare una data cessazione valida»). ⚠️ Nessun chiamante oggi,
#       ne' Python ne' PL/pgSQL: Tid, 21-09, la funzione si TIENE (zero
#       chiamanti non e' un ritiro, regola zero) e il campo e' quello del
#       dialog di disdetta quando nascera'.
#   script.fn_guard_soggetto_pf_pura (da trgfn_identita_digitali_guard_coerenza)
#     E_AUTH_USER_SOGGETTO_CON_PIVA -> soggetto_id (il soggetto scelto nel form
#       dell'identita' digitale; amm_software_service manda gia' field:
#       soggetto_id sul suo guard).
#   script.trgfn_componenti_check_prezzo_obbligatorio
#     E_DOC_COMPONENTE_OBBLIGATORIO_PREZZO_ZERO -> prezzo_unitario
#       (NEW.prezzo_unitario sulla riga componente; era CHIAVE_NON_LETTA su
#       articolo_componente_id). ⚠️ vendite.fn_contratto_riga_componenti_init e
#       fn_offerta_eccezione_componenti_init sollevano lo stesso codice e
#       restano SENZA: iterano la BoM del catalogo, non un input della pagina.
#
# ── %TYPE (feedback_type_anche_in_firma_e_returns_table) ───────────
#   fn_guard_soggetto_pf_pura: firma e RETURNS erano GIA' ancorati in
#   20260418-20 e il corpo vivo li aveva sciolti — ripristinati identici.
#   fn_disdetta_cliente: era a tipi nudi dal 20260301-17 — si ancora in questo
#   giro (clienti.id, clienti.data_chiusura). Firme byte-identiche al vivo
#   (regtype verificato): nessun overload.
#
# ── ORIGINE DEL CORPO, E IL CANCELLO SUL CORPO STANTIO ─────────────
#   Corpo VIVO (pg_get_functiondef, 22-09) per ogni funzione; il diff e' la
#   sola inserzione + l'ancoraggio %TYPE (generatore a sostituzioni
#   dichiarate, una occorrenza ciascuna). La preCondition ancora l'md5 di
#   prosrc a quello letto: se qualcun altro tocca la stessa funzione prima
#   dell'apply il migrate si FERMA invece di disfargli il lavoro (memoria
#   2026-09-09). Il ripristino torna al corpo vivo di prima.
#
# Presidio: db/pgtap/dbops/test-punti-canale-campo-v1.sql (t.1: la lista
#   pinnata cresce dei 9) + backend apps/core/tests/test_ui_action_e_canale_campi.py
#   (il CANCELLO; la sua riga in dbops.presidi entra con questo giro).
# Dipendenze: nessuna (la vista -42 li LEGGE, non serve all'apply).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260922-12-update-guard-script-canale-campo-9a-mctit.yaml

  - changeSet:
      id: 20260922-12-update-guard-script-canale-campo-9a
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Canale campo, i 9 A del §4-ter.2 in script: script.fn_disdetta_cliente, script.fn_guard_soggetto_pf_pura, script.trgfn_componenti_check_prezzo_obbligatorio —
        'campo', '<colonna>' nel context delle chiamate che nominano i
        codici highlight_form_fields ancora vuoti. Solo la coppia in piu'
        (+ %TYPE in firma/DECLARE); corpo vivo, md5 ancorato in preCondition.
