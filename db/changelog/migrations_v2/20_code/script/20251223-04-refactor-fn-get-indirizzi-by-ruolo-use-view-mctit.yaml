databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/script/20251223-04-refactor-fn-get-indirizzi-by-ruolo-use-view-mctit.yaml

  - changeSet:
      id: 20251223-04-refactor-fn-get-indirizzi-by-ruolo-use-view
      author: mctit
      comment: >
        Refactor di script.fn_get_indirizzi_by_ruolo per usare la view resolved
        e mantenere l'output completo senza duplicare la logica di composizione.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_indirizzi_by_ruolo(
                p_soggetto_ruolo_id bigint
              )
              RETURNS TABLE(
                tipo_indirizzo character varying,
                indirizzo_completo text,
                geoloc geometry,
                indirizzo_id bigint,
                soggetto_ruolo_id bigint,
                tipo_indirizzo_id integer,
                indirizzo_dettaglio_id bigint,
                indirizzo_libero text,
                is_normalizzato boolean,
                stato_id integer,
                stato_descrizione character varying,
                stato_iso2 character,
                regione_id integer,
                regione_descrizione character varying,
                provincia_id integer,
                provincia_sigla character varying,
                provincia_descrizione character varying,
                comune_id integer,
                comune_descrizione character varying,
                codice_postale_id integer,
                cap_codice character,
                locality character varying,
                administrative_area character varying,
                sublocality character varying,
                postal_box character varying
              )
              LANGUAGE sql
              STABLE
              PARALLEL UNSAFE
              AS $function$
                SELECT
                  r.tipo_indirizzo_codice AS tipo_indirizzo,
                  r.indirizzo_display     AS indirizzo_completo,
                  r.geoloc,
                  r.indirizzo_id,
                  r.soggetto_ruolo_id,
                  r.tipo_indirizzo_id,
                  r.indirizzo_dettaglio_id,
                  r.indirizzo_libero,
                  r.is_normalizzato,
                  r.stato_id,
                  r.stato_descrizione,
                  r.stato_iso2,
                  r.regione_id,
                  r.regione_descrizione,
                  r.provincia_id,
                  r.provincia_sigla,
                  r.provincia_descrizione,
                  r.comune_id,
                  r.comune_descrizione,
                  r.codice_postale_id,
                  r.cap_codice,
                  r.locality,
                  r.administrative_area,
                  r.sublocality,
                  r.postal_box
                FROM anagrafiche.vw_indirizzi_resolved_ruolo r
                WHERE r.soggetto_ruolo_id = p_soggetto_ruolo_id
                ORDER BY r.tipo_indirizzo_codice;
              $function$;
