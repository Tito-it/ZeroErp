# NUOVO BB: script.trgfn_righe_natura_vendita()
#   La natura di vendita di una riga di documento: si scrive alla nascita e
#   quando cambia l'articolo, poi resta quella.
#   Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-4, §9.2)
#
# -- PERCHE' UN BB ----------------------------------------------------------
#   Tre tabelle portano la natura (preventivi_righe, e dal 20261013-07
#   ordini_righe e ddt_righe) con la stessa regola: alla terza copia si estrae
#   (AGENTS.md, regola del 2). Il preventivo la scriveva in
#   vendite.trgfn_preventivi_righe_set_natura_vendita (BEFORE INSERT OR UPDATE
#   OF articolo_id: alla nascita e al cambio di articolo), insieme al guard
#   della ricorrenza. Da 20261013-10 quella funzione e' solo il guard: la
#   scrittura sta qui, una volta per le tre tabelle.
#
# -- LA REGOLA -----------------------------------------------------------
#   INSERT: la natura dell'articolo; in modo CHIAMANTE quella portata da chi
#     scrive, se la porta (i verbi che copiano una riga da un documento
#     d'origine: la natura venduta e' quella dell'origine).
#   UPDATE con articolo cambiato: la natura del NUOVO articolo, qualunque cosa
#     porti chi scrive. La riga e' diventata un'altra vendita.
#   UPDATE con lo stesso articolo: resta quella di prima. Scriverla a mano lo
#     rifiuta il lock di colonna (dbops.automation_lock_columns, trigger
#     generato _a10_lock_columns_upd), che viene PRIMA di questo nell'ordine
#     dei nomi e giudica il valore di chi scrive; qui la si rimette a OLD
#     solo come difesa, per il tempo in cui il lock non e' ancora generato.
#   TG_ARGV[0]: ARTICOLO (preventivo: la natura viene sempre dall'articolo)
#     | CHIAMANTE (ordine, bolla: la porta il verbo che copia la riga).
#   ⚠️ CHIAMANTE e' una fiducia nel chiamante che scrive la colonna: oggi la
#     scrivono solo tre verbi DB (20261013-11/-12/-13). Il backend non la
#     conosce, quindi una sua riga prende la natura dell'articolo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261013-08-create-trgfn-righe-natura-vendita-mctit.yaml

  - changeSet:
      id: 20261013-08-create-trgfn-righe-natura-vendita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuovo BB script.trgfn_righe_natura_vendita: la natura di vendita di una riga si scrive alla
        nascita (dall'articolo, o dal chiamante in modo CHIAMANTE) e quando cambia l'articolo, poi
        resta. Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-4).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_righe_natura_vendita()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- ⚠️ v_modo nudo: e' il selettore del montaggio (TG_ARGV), con
                  --   due valori dichiarati qui sotto.
                  v_modo     text := TG_ARGV[0];
                  v_natura   catalogo.articoli.natura_vendita_id%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   La natura di vendita di una riga di documento: alla
                  --   nascita e al cambio di articolo, poi congelata.
                  --   BEFORE INSERT OR UPDATE OF articolo_id, natura_vendita_id.
                  -- =========================================================
                  IF v_modo IS NULL OR v_modo NOT IN ('ARTICOLO', 'CHIAMANTE') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', TG_NAME::text, 'E_TRIGGER_ARGOMENTI_INVALIDI',
                          jsonb_build_object(
                              'table',  TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME,
                              'tgargs', to_jsonb(TG_ARGV)),
                          NULL::uuid,
                          TG_NAME || ': TG_ARGV[0] deve essere ARTICOLO o CHIAMANTE');
                  END IF;

                  IF TG_OP = 'UPDATE'
                     AND NEW.articolo_id IS NOT DISTINCT FROM OLD.articolo_id THEN
                      -- Stesso articolo: la riga resta la vendita di prima.
                      NEW.natura_vendita_id := OLD.natura_vendita_id;
                      RETURN NEW;
                  END IF;

                  IF TG_OP = 'INSERT' AND v_modo = 'CHIAMANTE'
                     AND NEW.natura_vendita_id IS NOT NULL THEN
                      -- La porta il verbo che copia la riga dall'origine.
                      RETURN NEW;
                  END IF;

                  SELECT a.natura_vendita_id
                    INTO v_natura
                    FROM catalogo.articoli a
                   WHERE a.id = NEW.articolo_id;

                  -- Articolo assente: parla la FK della riga.
                  NEW.natura_vendita_id := v_natura;
                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_righe_natura_vendita()
              IS 'BB trigger BEFORE INSERT OR UPDATE OF articolo_id, natura_vendita_id sulle righe di documento che portano la natura di vendita (vendite.preventivi_righe, vendite.ordini_righe, vendite.ddt_righe). La natura e'' quella con cui la riga e'' stata venduta: si scrive alla nascita (dall''articolo; in modo CHIAMANTE quella portata dal verbo che copia la riga dal documento d''origine, se la porta) e quando cambia l''articolo (dal nuovo articolo), poi resta, anche se l''articolo cambia natura in anagrafica. TG_ARGV[0]: ARTICOLO | CHIAMANTE (altrimenti E_TRIGGER_ARGOMENTI_INVALIDI). Scriverla a mano lo rifiuta il lock di colonna (dbops.automation_lock_columns, E_RIGA_NATURA_VENDITA_IMMUTABILE), che parla prima di questo trigger nell''ordine dei nomi; qui un UPDATE con lo stesso articolo la rimette a OLD solo come difesa. Estratto alla terza copia: prima la scriveva vendite.trgfn_preventivi_righe_set_natura_vendita, che da 20261013-10 e'' solo il guard della ricorrenza. Brief: brief-db-articoli-ammessi-per-documento (§8.6 A-4).';
