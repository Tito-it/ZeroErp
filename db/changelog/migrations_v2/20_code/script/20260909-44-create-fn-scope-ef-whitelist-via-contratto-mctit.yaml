# ------------------------------------------------------------
# C-1 — Gli adattatori di scope per la famiglia CONTRATTI.
#   Brief: brief-db-perimetro-emittente-righe-documento.md §4 e §7 (passo 5)
#   Slice 20260909-44..46 (helper -> policy inerti -> armamento).
#   Precedenti: PREVENTIVI (27..30), ORDINI (33..35), DDT (36..38), RESI (40..42).
#
# ── ⛔ IL DIFETTO, DETTO SUL MODELLO ──────────────────────────────────
#   Una riga di documento appartiene all'emittente della sua testata.
#   `vendite.contratti` e' protetta (`rls_contratti_ef_whitelist`); i suoi cinque
#   satelliti non hanno nessuna policy e `zeroerp_app` ha su tutti SELECT,
#   INSERT, UPDATE e DELETE.
#
# ── UNA VESTE, come DDT e RESI ───────────────────────────────────────
#   `vendite.contratti` porta la sola veste `OPERATORE`, `FOR ALL`.
#
# ── Le due funzioni, e da quale chiave risalgono ──────────────────────
#     * `contratti_righe`, `contratti_indirizzi`, `contratti_utilities`,
#       `note_contratto`               contratto_id / target_id -> `_via_contratto`
#     * `contratti_righe_componenti`   riga_contratto_id        -> `_via_contratto_riga`
#   ⚠️ Tutte `NOT NULL` (verificato 2026-09-09).
#
# ── ⛔ DUE TABELLE CHE SEMBRANO DI QUESTA FAMIGLIA E NON LO SONO ──────
#   * `vendite.fatture_atti` ha `contratto_id` NOT NULL, ma e' figlia anche di
#     `vendite.fatture`, che e' protetta e ha gia'
#     `fn_scope_ef_whitelist_via_fattura`: si aggancia li' (brief §6.3).
#   * `vendite.attivita_fatturabili` ha `contratto_id` **nullable**. La sua rotta
#     portante e' `commessa_id`, che e' `NOT NULL`, e `vendite.commesse` e' gia'
#     protetta con `fn_scope_ef_whitelist_via_commessa` (brief §6.1). Una policy
#     costruita su una chiave nullable avrebbe un buco esatto dove il NULL passa.
#   ⇒ Nessuna delle due entra in questa slice, e nessuna delle due e' coperta da
#   un'altra: restano il residuo dichiarato del brief, insieme a `note_fatture`
#   e `note_attivita_fatturabili`.
#
# ── ⚠️ LA POSTURA ────────────────────────────────────────────────────
#   `STABLE`, `LANGUAGE sql`, e NON `SECURITY DEFINER` — come gli altri
#   `script.fn_scope_*`. Una funzione `SECURITY DEFINER` dentro una policy
#   guarderebbe con gli occhi dell'owner, che la RLS non vede: il filtro
#   passerebbe sempre, e in silenzio.
#
# Permessi: funzioni di titodb, nessun GRANT esplicito (l'ALTER DEFAULT
# PRIVILEGES di provision_db_roles copre EXECUTE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260909-44-create-fn-scope-ef-whitelist-via-contratto-mctit.yaml

  - changeSet:
      id: 20260909-44-create-fn-scope-ef-whitelist-via-contratto
      author: mctit
      runOnChange: false
      comment: >
        Adattatori di scope per la famiglia contratti:
        script.fn_scope_ef_whitelist_via_contratto(auth_user_id, contratto_id) e
        script.fn_scope_ef_whitelist_via_contratto_riga(auth_user_id, riga_id),
        che risalgono alla testata e delegano alla canonica
        fn_scope_ef_whitelist. Nessuna policy li usa ancora: le crea 20260909-45.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_contratto(
                  p_auth_user_id  integer,
                  p_contratto_id  vendite.contratti.id%TYPE
              )
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro
                  --   l'emittente del contratto indicato.
                  -- ⚠️ Contratto inesistente -> emittente NULL -> la canonica
                  --   risponde false a whitelist valorizzata: fail-closed.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT k.emittente_fiscale_id
                         FROM vendite.contratti k
                        WHERE k.id = p_contratto_id)
                  );
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_contratto_riga(
                  p_auth_user_id integer,
                  p_riga_id      vendite.contratti_righe.id%TYPE
              )
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: come sopra, ma partendo da una RIGA di contratto —
                  --   e' la chiave che porta vendite.contratti_righe_componenti.
                  -- ⭐ Delega alla sorella invece di ripetere la risalita: la
                  --   regola «come un contratto nomina il proprio emittente»
                  --   resta scritta in un posto solo.
                  SELECT script.fn_scope_ef_whitelist_via_contratto(
                      p_auth_user_id,
                      (SELECT r.contratto_id
                         FROM vendite.contratti_righe r
                        WHERE r.id = p_riga_id)
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_contratto(integer, bigint)
              IS 'Adattatore di scope per i satelliti di vendite.contratti: risale dalla chiave della testata a `emittente_fiscale_id` e delega a script.fn_scope_ef_whitelist. STABLE e NON security definer, come gli altri fn_scope_*. Contratto inesistente -> emittente NULL -> false a whitelist valorizzata (fail-closed). ⚠️ Non copre vendite.fatture_atti (si aggancia a fatture) ne'' vendite.attivita_fatturabili (rotta portante commessa_id, non contratto_id che e'' nullable). Brief: brief-db-perimetro-emittente-righe-documento.md';

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_contratto_riga(integer, bigint)
              IS 'Come fn_scope_ef_whitelist_via_contratto ma a partire da una riga di contratto: e'' la chiave che porta vendite.contratti_righe_componenti. Delega alla sorella invece di ripetere la risalita alla testata.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_scope_ef_whitelist_via_contratto_riga(integer, bigint);
              DROP FUNCTION IF EXISTS script.fn_scope_ef_whitelist_via_contratto(integer, bigint);
