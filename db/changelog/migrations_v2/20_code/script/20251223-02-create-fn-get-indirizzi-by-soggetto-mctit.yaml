databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/script/20251223-02-create-fn-get-indirizzi-by-soggetto-mctit.yaml

  - changeSet:
      id: 20251223-02-create-fn-get-indirizzi-by-soggetto
      author: mctit
      # runAlways: true
      comment: >
        Crea la funzione script.fn_get_indirizzi_by_soggetto basata sulla vista
        anagrafiche.vw_indirizzi_resolved_soggetto.

      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_indirizzi_by_soggetto(
                p_soggetto_id uuid
              )
              RETURNS SETOF anagrafiche.vw_indirizzi_resolved_soggetto
              LANGUAGE sql
              STABLE
              PARALLEL UNSAFE
              AS $function$
                SELECT *
                FROM anagrafiche.vw_indirizzi_resolved_soggetto
                WHERE soggetto_id = p_soggetto_id
                ORDER BY tipo_indirizzo_codice;
              $function$;
