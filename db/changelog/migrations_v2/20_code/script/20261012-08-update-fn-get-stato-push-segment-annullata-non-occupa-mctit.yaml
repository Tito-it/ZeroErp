# UNA RIGA DI COMMESSA ANNULLATA NON OCCUPA IL SEGMENTO
#   script.fn_get_stato_push_segment(character varying)
#   Brief: brief-db-annullo-a-valle-riapre-a-monte (D-5 di Tid, R-7)
#
# ── COSA CAMBIA ─────────────────────────────────────────────────────
#   Una sola clausola: le righe ANNULLATA non entrano nel conteggio.
#   Prima «ANNULLATA conta come allocata» (scritto nel commento di testa):
#   un segmento con la sola riga ritirata restava ALLOCATA e il documento
#   non tornava spingibile.
#
# ── PERCHE' E' SICURO, SUL MODELLO ──────────────────────────────────
#   Una riga ANNULLATA con sorgente nasce da due strade sole: il ritiro
#   all'annullo del documento a monte (morto: i lister lo escludono per
#   stato) e, da questo brief, l'annullo della commessa (dove il documento
#   a monte e' vivo e deve tornare spingibile: D-1). Le sourceless (ONERE,
#   RETTIFICA) non hanno un segmento di sorgente. Il ritiro e' irreversibile
#   (nessun ripristino da ANNULLATA), quindi una riga ritirata non torna mai
#   a occupare.
#   ⭐ Il predicato e' scritto «<> 'ANNULLATA'» e non «IN (NON_EMESSA,
#   EMESSA)», di proposito: se domani il CHECK ammettesse un quarto stato, il
#   default resta l'OCCUPARE (il documento non si rispinge due volte). Solo
#   il ritiro dichiarato libera.
#   ⚠️ Effetto da sapere (N11): su un accredito annullato (#RET: ANNULLATA)
#   nella corsia ORD il segmento della bolla torna LIBERA, cioe' com'era
#   prima dell'accredito; contro la ri-spinta resta la cintura XOR sullo
#   stato dell'ordine, come prima dell'accredito.
#   ⭐ La colonna e' NOT NULL: «<>» non perde NULL.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   Corpo di partenza: 20261010-82 (identico al vivo su zeroerp_ci,
#   2026-10-12). Firma invariata, segment_key%TYPE compreso. La clausola
#   nuova non e' un Index Cond: si applica alle poche righe del segmento
#   che l'uguaglianza su segment_base ha gia' trovato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261012-08-update-fn-get-stato-push-segment-annullata-non-occupa-mctit.yaml

  - changeSet:
      id: 20261012-08-update-fn-get-stato-push-segment-annullata-non-occupa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_stato_push_segment: una riga di commessa ANNULLATA non occupa piu' il
        segmento (D-5). Il documento a monte di una riga ritirata torna spingibile.
        Brief: brief-db-annullo-a-valle-riapre-a-monte (R-7).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE proname = 'fn_get_stato_push_segment'
                 AND pronamespace = 'script'::regnamespace
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_stato_push_segment(
                  p_segment_key vendite.commesse_attivita.segment_key%TYPE)
              RETURNS text   -- vocabolario calcolato: LIBERA / ALLOCATA / EMESSA
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              BEGIN ATOMIC
              -- Scopo: classificare lo stato-push della segment_key di una riga
              --   documento rispetto a vendite.commesse_attivita, vedendo anche
              --   le attivita' dei componenti BoM (suffisso '#CMP:<id>') e le
              --   RETTIFICHE (suffisso '#RET:<n>', dal 2026-08-18):
              --     LIBERA   = nessuna attivita' VIVA (riga mai instradata, o
              --                instradata e ritirata)
              --     ALLOCATA = attivita' vive presenti, non tutte EMESSE (in
              --                attesa di fatturazione)
              --     EMESSA   = attivita' vive presenti e tutte fatturate
              --   Single source del predicato "gia' inviato": consumata dalle
              --   fn_list_*_da_pushare (eleggibile <=> LIBERA), dalla diagnosi
              --   del DDT (colonna `segment`), dai rami reason delle capability
              --   e, dal 2026-10-12, dalle viste del preventivo
              --   (vw_preventivi_righe_smistabili_commessa,
              --   vw_preventivi_smistamento_righe) e dal lister dei consumi.
              -- rev 2026-08-18 (brief nota di credito, N11): il suffisso
              --   '#RET:%' copre sia la rettifica semplice sia quella per
              --   componente, perche' '#CMP:' viene DOPO '#RET:<n>'.
              --   ⚠️ Su una partita fatturata dalla corsia ORD il segmento DDT
              --   non ha attivita' NORMALE e resterebbe LIBERA anche a nota di
              --   credito emessa: a impedire la ri-spinta ci sarebbe SOLO la
              --   cintura XOR sullo stato dell'ordine. Due cinture sono una;
              --   una e' zero.
              -- rev 2026-09-21 (D14 giro 4, D8): il predicato e' un RANGE sugli
              --   operatori del pattern, non piu' due LIKE. commesse_attivita e'
              --   sotto RLS e sotto una policy un LIKE non diventa MAI Index Cond
              --   (textlike non e' leakproof); `~>=~`/`~<~` si' — sono a byte e
              --   leakproof — con l'indice varchar_pattern_ops sulla colonna.
              --   [k#CMP:, k#CMP;) e' esattamente «comincia per k#CMP:» (';' e'
              --   il byte dopo ':'). ⛔ Niente LIKE qui: e' pinnato dal pgTAP.
              -- rev 2026-10-10 (20261010-82): si entra dall'uguaglianza su
              --   ca.segment_base (colonna generata, 20261010-80). Chiamata con un
              --   PARAMETRO (piano generico delle fn_list_*_da_pushare e della
              --   diagnosi) il range da solo era stimato al default — ~11 % della
              --   tabella per ramo — e perdeva contro la scansione intera.
              -- rev 2026-10-12 (20261012-08, brief-db-annullo-a-valle-riapre-a-
              --   monte D-5): una riga ANNULLATA non occupa piu' il segmento. Prima
              --   contava come allocata, e una riga ritirata (annullo della
              --   commessa) lasciava il documento a monte consumato per sempre.
              --   Scritto «<> 'ANNULLATA'»: uno stato nuovo occupa, solo il ritiro
              --   libera.
              SELECT CASE
                       WHEN count(*) = 0 THEN 'LIBERA'
                       WHEN bool_and(ca.stato_emissione = 'EMESSA') THEN 'EMESSA'
                       ELSE 'ALLOCATA'
                     END
                FROM vendite.commesse_attivita ca
               -- ⭐ rev 2026-10-10 (20261010-82): si entra dall'UGUAGLIANZA sulla
               --   base (indice ix_commesse_attivita_segment_base); i tre rami di
               --   prima restano come filtro residuo e la implicano — una chiave che
               --   vale p o comincia per p#CMP:/p#RET: ha la base di p — quindi i
               --   risultati sono identici per costruzione. split_part si applica al
               --   PARAMETRO, non alla colonna: la clausola resta leakproof per la
               --   tabella e sale in Index Cond sotto la policy.
               WHERE ca.segment_base = split_part(p_segment_key, '#', 1)
                 AND (   ca.segment_key = p_segment_key
                      OR (    ca.segment_key ~>=~ (p_segment_key || '#CMP:')
                          AND ca.segment_key ~<~  (p_segment_key || '#CMP;'))
                      OR (    ca.segment_key ~>=~ (p_segment_key || '#RET:')
                          AND ca.segment_key ~<~  (p_segment_key || '#RET;')))
                 -- ⭐ rev 2026-10-12 (D-5): la riga ritirata non occupa.
                 AND ca.stato_emissione <> 'ANNULLATA';
              END;
        # ⛔ Il COMMENT sta in un change SUO: pgjdbc esegue un `BEGIN ATOMIC … END;`
        #    solo se sta da solo nel testo.
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_get_stato_push_segment(vendite.commesse_attivita.segment_key%TYPE)
              IS 'Classifica lo stato-push di una segment_key rispetto a vendite.commesse_attivita: LIBERA (nessuna attivita'' viva: mai instradata, o instradata e ritirata) / ALLOCATA (attivita'' vive presenti, non tutte emesse) / EMESSA (attivita'' vive tutte fatturate). Fonte UNICA del predicato «gia'' inviato», consumata dalle fn_list_*_da_pushare (eleggibile <=> LIBERA), dalla diagnosi del DDT (colonna `segment`, da cui il lister deriva), dai rami reason delle capability e, dal 2026-10-12, da vendite.vw_preventivi_righe_smistabili_commessa, vendite.vw_preventivi_smistamento_righe e vendite.fn_list_consumi_da_pushare, che prima avevano un predicato proprio. Vede i suffissi dei componenti BoM (#CMP:) e, dal 2026-08-18, quelli delle RETTIFICHE (#RET:<n>, con o senza #CMP a seguire). ⚠️ Il suffisso di rettifica non e'' cosmesi: su una partita fatturata dalla corsia ORD il segmento DDT non ha attivita'' NORMALE e resterebbe LIBERA anche a nota di credito emessa — a impedire la ri-spinta ci sarebbe SOLO la cintura XOR sullo stato dell''ordine, e due cinture sono una mentre una e'' zero. brief-design-note-credito-resi N11. ⭐ rev 2026-09-21 (D14 giro 4, D8): il predicato e'' un RANGE sugli operatori del pattern (`~>=~`/`~<~`, a byte, leakproof) al posto dei due LIKE: commesse_attivita e'' sotto RLS e sotto una policy un LIKE non diventa mai Index Cond (textlike non e'' leakproof). Con l''indice varchar_pattern_ops (90_end/20260921-50) e'' un BitmapOr di tre Index Cond sopra la policy. BEGIN ATOMIC: dipendenze in pg_depend. ⛔ Niente LIKE nel corpo: pinnato da script/test-fn-get-stato-push-segment-v1. ⭐ rev 2026-10-10 (20261010-82): si entra in commesse_attivita dall''UGUAGLIANZA su segment_base = split_part(p_segment_key, ''#'', 1) (colonna generata di 20261010-80, indicizzata): texteq e'' leakproof e la stima viene dalle statistiche. brief-db-segment-base-commesse-attivita. ⭐ rev 2026-10-12 (20261012-08, brief-db-annullo-a-valle-riapre-a-monte D-5 di Tid): una riga ANNULLATA non occupa piu'' il segmento. Prima contava come allocata, e il ritiro delle righe all''annullo della commessa lasciava il documento a monte consumato per sempre. Sicuro sul modello: una riga ANNULLATA con sorgente nasce dal ritiro all''annullo del documento a monte (morto, escluso dai lister per stato) o della commessa (il documento a monte deve tornare spingibile); ANNULLATA e'' irreversibile. Scritto «<> ''ANNULLATA''» e non come elenco degli stati vivi: uno stato nuovo OCCUPA, solo il ritiro libera. Effetto (N11): un accredito annullato nella corsia ORD riporta il segmento della bolla a LIBERA, com''era prima dell''accredito.';
      rollback:
        # Il corpo di 20261010-82, per intero.
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_stato_push_segment(
                  p_segment_key vendite.commesse_attivita.segment_key%TYPE)
              RETURNS text
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              BEGIN ATOMIC
              SELECT CASE
                       WHEN count(*) = 0 THEN 'LIBERA'
                       WHEN bool_and(ca.stato_emissione = 'EMESSA') THEN 'EMESSA'
                       ELSE 'ALLOCATA'
                     END
                FROM vendite.commesse_attivita ca
               WHERE ca.segment_base = split_part(p_segment_key, '#', 1)
                 AND (   ca.segment_key = p_segment_key
                      OR (    ca.segment_key ~>=~ (p_segment_key || '#CMP:')
                          AND ca.segment_key ~<~  (p_segment_key || '#CMP;'))
                      OR (    ca.segment_key ~>=~ (p_segment_key || '#RET:')
                          AND ca.segment_key ~<~  (p_segment_key || '#RET;')));
              END;
