# Gemello di `20260804-68` sull'ordine di vendita: `reasons` sull'annullamento
#   + `nessuna_azione_key` (brief-db-vie-uscita-operatore §6, ultima riga).
#
# PERCHE'. Stessa storia del preventivo, con una voce in piu': l'ordine e'
#   l'unico dei due dominii che ha gia' le quattro chiavi «cosa fare invece»
#   seminate nel meta degli stati (EVASO, PARZIALMENTE_EVASO — le altre due
#   stanno sul DDT, changeSet `-70`). Oggi il BE misura su un ordine EVASO
#   reale (#5388) «zero azioni e nessuna_azione_key assente dal blob»: il dato
#   c'e' da ieri, ma nessuno lo legge, e l'operatore vede una barra vuota e
#   muta. Questo changeSet lo tira fuori.
#
# ⚠️ DUE COSE DI QUESTA FUNZIONE NON VANNO TOCCATE, E SEMBRANO SBAGLIATE.
#   1. `v_can_change := jsonb_array_length(v_actions) > 0` conta ANCHE le azioni
#      disabilitate — al contrario di fn_available_actions_commessa, che conta
#      solo le abilitate. Non e' una svista: qui la barra deve comparire proprio
#      per mostrare il pulsante grigio col tooltip (commento originale del
#      2026-07-16). Cambiarlo farebbe sparire il bottone spento, cioe' l'opposto
#      di quello che questo cantiere sta facendo.
#   2. `nessuna_azione_key` NON si appoggia a `v_can_change` per lo stesso
#      motivo: userebbe un conteggio che include i disabilitati e la nota non
#      comparirebbe mai. Si valuta a parte, sulle sole azioni ABILITATE.
#
# ℹ️ Per il contratto FE (`reasons` che vince sul singolare `reason`, nessun
#   lavoro lato frontend) e per la scelta di sommare i motivi invece di
#   sostituirli, vedere la testata di `20260804-68`: le due funzioni sono lo
#   stesso schema applicato due volte, e vanno lette insieme.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-69-update-fn-available-actions-ordine-reasons-annullamento-mctit.yaml

  - changeSet:
      id: 20260804-69-update-fn-available-actions-ordine-reasons-annullamento
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_ordine espone i motivi ostativi dell'annullamento
        (da script.fn_check_ordine_annullabile, la stessa letta dal guard) e la
        nessuna_azione_key dello stato corrente — che sugli stati EVASO e
        PARZIALMENTE_EVASO e' gia' a dato e finora non usciva dalle capability.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'script'
                AND p.proname = 'fn_check_ordine_annullabile'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_ordine(p_ordine_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: capability ordine di vendita per detail API (data-driven).
              --   push_commessa: decoupling fatturazione/spedizione (rev 2026-07-10,
              --   fn_list_ordini_da_pushare fonte unica; reason ORDINE_NON_CONFERMATO /
              --   ORDINE_FATTURA_DA_DDT / ORDINE_GIA_INVIATO / ORDINE_GIA_FATTURATO /
              --   ORDINE_NESSUNA_RIGA_PUSHABILE).
              --   rev 2026-07-19: ramo reason via fn_get_stato_push_segment
              --   (brief-db-push-commessa-gia-inviato §4b).
              --   rev 2026-07-19 (bis): reason_key nel namespace i18n
              --   `vendite.ordini.*` (era `ordini.*`, non risolvibile nel FE)
              --   — brief-db-i18n-namespace-reason-ordini.
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_ordini (bottone PDF data-driven via capabilities).
              --   rev 2026-07-16: + enabled/reason/reason_key da meta.requires_righe
              --   (documento vuoto non avanza di stato).
              --   rev 2026-08-04: + reasons sull'annullamento, da
              --   script.fn_check_ordine_annullabile — la STESSA funzione che
              --   vendite.trgfn_ordini_guard_transizione usa per sollevare. I motivi
              --   si SOMMANO a quello di requires_righe in un array solo, da cui
              --   discendono enabled/reason/reason_key. + nessuna_azione_key dal
              --   meta dello stato, esposta quando nessuna azione e' abilitata
              --   (brief-db-vie-uscita-operatore §4 regola R3 e §6).
              DECLARE
                  v_stato_id   vendite.ordini.stato_doc_ordine_id%TYPE;
                  v_stato_cod  config.stati_doc_ordini.codice_interno%TYPE;
                  v_uid        vendite.ordini.uid%TYPE;
                  v_fatt_trg   vendite.ordini.fatturazione_trigger%TYPE;
                  v_pdf_mode   config.stati_doc_ordini.pdf_mode%TYPE;
                  v_pdf_allow  config.stati_doc_ordini.pdf_allow_allegati%TYPE;
                  v_nessuna_key    text;
                  v_nessuna_azione boolean := false;
                  v_actions    jsonb;
                  v_can_change boolean := false;
                  v_ha_righe   boolean := false;
                  v_mot_annulla jsonb := '[]'::jsonb;
                  v_push_ok    boolean := false;
                  v_push_reason     text := NULL;
                  v_push_reason_key text := NULL;
                  c_non_edit_cliente CONSTANT jsonb :=
                      '["billing_account_id","soggetto_ruolo_id"]'::jsonb;
                  c_non_edit_tutti CONSTANT jsonb :=
                      '["billing_account_id","soggetto_ruolo_id","utility_id",'
                      '"valuta_id","modalita_pagamento_id","termine_pagamento_id",'
                      '"fatturazione_trigger","agente_soggetto_ruolo_id","data","meta"]'::jsonb;
                  -- Motivo "documento vuoto" nella forma dei motivi delle fn_check_*,
                  -- cosi' i due mondi si concatenano. `codice` e' quello che il guard
                  -- solleva davvero (trgfn_ordini_guard_transizione, Regola 2).
                  c_motivo_senza_righe CONSTANT jsonb := jsonb_build_array(
                      jsonb_build_object(
                          'codice',     'E_ORDINE_CONFERMA_SENZA_RIGHE',
                          'reason',     'DOCUMENTO_SENZA_RIGHE',
                          'reason_key', 'common.azione_reason.senza_righe',
                          'dettaglio',  0));
              BEGIN
                  -- Stato corrente + trigger + uid + capability PDF + la chiave
                  -- "nessuna azione" dello stato (dato, non codice).
                  SELECT o.stato_doc_ordine_id, sdo.codice_interno,
                         o.uid, o.fatturazione_trigger,
                         sdo.pdf_mode, sdo.pdf_allow_allegati,
                         sdo.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_uid, v_fatt_trg,
                         v_pdf_mode, v_pdf_allow, v_nessuna_key
                    FROM vendite.ordini o
                    JOIN config.stati_doc_ordini sdo ON sdo.id = o.stato_doc_ordine_id
                   WHERE o.id = p_ordine_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione "documento non vuoto" per le transizioni che la
                  -- esigono (meta.requires_righe). La fn sa solo COME contare le
                  -- proprie righe: specchia il guard (trgfn_ordini_guard_transizione
                  -- Regola 2, rev 2026-07-16): riga attiva, nessun vincolo su
                  -- quantita/prezzo (un ordine a totale zero deve poter avanzare).
                  v_ha_righe := EXISTS (
                      SELECT 1 FROM vendite.ordini_righe r
                       WHERE r.ordine_id = p_ordine_id
                         AND r.attivo IS TRUE
                  );

                  -- Motivi ostativi all'ANNULLAMENTO, calcolati UNA VOLTA SOLA.
                  -- Fn pura: [] quando e' lecito. E' la stessa che solleva nel guard.
                  v_mot_annulla := script.fn_check_ordine_annullabile(p_ordine_id);

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              -- Tutto discende dall'array dei motivi: nessuna
                              -- regola puo' mascherarne un'altra.
                              'enabled',          jsonb_array_length(m.motivi) = 0,
                              'reason',           m.motivi -> 0 ->> 'reason',
                              'reason_key',       m.motivi -> 0 ->> 'reason_key',
                              'reasons',          m.motivi
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.transizioni_stati_ordini t
                  JOIN config.stati_doc_ordini sa ON sa.id = t.stato_a_id
                  -- I motivi della destinazione, sommati in un array solo: prima
                  -- quelli specifici, poi il generico "documento vuoto".
                  CROSS JOIN LATERAL (
                      SELECT CASE WHEN sa.codice_interno = 'ANNULLATO'
                                  THEN v_mot_annulla ELSE '[]'::jsonb END
                          || CASE WHEN COALESCE((t.meta->>'requires_righe')::boolean, false)
                                       AND NOT v_ha_righe
                                  THEN c_motivo_senza_righe ELSE '[]'::jsonb END AS motivi
                  ) m
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  -- Conta anche le azioni disabilitate: la barra azioni deve
                  -- comparire proprio per mostrare il pulsante grigio + tooltip.
                  v_can_change := jsonb_array_length(v_actions) > 0;

                  -- push_commessa: fonte unica fn_list_ordini_da_pushare (decoupling).
                  -- Namespace i18n: `vendite.ordini.*` — coerente con la label_key
                  -- dell'azione push qui sotto e con le reason DDT. Il codice reason
                  -- (ORDINE_*) NON e' una chiave i18n e non segue questa convenzione.
                  IF v_stato_cod IN ('DRAFT', 'ANNULLATO') THEN
                      v_push_reason     := 'ORDINE_NON_CONFERMATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.non_confermato';
                  ELSIF v_fatt_trg IS DISTINCT FROM 'CONFERMATO' THEN
                      v_push_reason     := 'ORDINE_FATTURA_DA_DDT';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.fattura_da_ddt';
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.fn_list_ordini_da_pushare(p_ordine_id := p_ordine_id)) THEN
                      v_push_ok := true;
                  -- Nessuna riga pushabile: distinguere il PERCHE'
                  -- via classificatore condiviso (stesso predicato
                  -- delle push-list, vede anche i componenti #CMP).
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.ordini_righe r
                                 WHERE r.ordine_id = p_ordine_id
                                   AND script.fn_get_stato_push_segment(
                                         'ORD:' || v_uid::text || ':R:' || r.id::text) = 'ALLOCATA') THEN
                      -- pushato, in attesa di fatturazione
                      v_push_reason     := 'ORDINE_GIA_INVIATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.gia_inviato';
                  ELSIF EXISTS (SELECT 1
                                  FROM vendite.ordini_righe r
                                 WHERE r.ordine_id = p_ordine_id
                                   AND script.fn_get_stato_push_segment(
                                         'ORD:' || v_uid::text || ':R:' || r.id::text) = 'EMESSA') THEN
                      v_push_reason     := 'ORDINE_GIA_FATTURATO';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.gia_fatturato';
                  ELSE
                      v_push_reason     := 'ORDINE_NESSUNA_RIGA_PUSHABILE';
                      v_push_reason_key := 'vendite.ordini.push_commessa_reason.nessuna_riga_pushabile';
                  END IF;

                  IF v_push_ok THEN
                      v_actions := v_actions || jsonb_build_array(
                          jsonb_build_object(
                              'key',              'push_commessa',
                              'target_state',     NULL,
                              'label_key',        'vendite.ordini.azione_push_commessa',
                              'severity',         'success',
                              'icon',             'pi pi-arrow-right',
                              'requires_confirm', true,
                              'outlined',         false,
                              'enabled',          true,
                              'reason',           NULL,
                              'reason_key',       NULL
                          )
                      );
                  END IF;

                  -- La nota "cosa fare invece" si mostra SOLO quando non resta
                  -- nessun bottone vivo. NON si appoggia a v_can_change, che qui
                  -- conta anche i disabilitati (vedi sopra): userebbe un conteggio
                  -- pensato per l'opposto e la nota non comparirebbe mai.
                  SELECT NOT EXISTS (
                      SELECT 1
                        FROM jsonb_array_elements(v_actions) AS a
                       WHERE COALESCE((a->>'enabled')::boolean, true) IS TRUE
                  ) INTO v_nessuna_azione;

                  RETURN jsonb_build_object(
                      'available_actions',           v_actions,
                      'can_change_state',            v_can_change,
                      'can_edit_testata',            (v_stato_cod = 'DRAFT'),
                      'can_edit_righe',              (v_stato_cod = 'DRAFT'),
                      'can_push_commessa',           v_push_ok,
                      'can_push_commessa_reason',    v_push_reason,
                      'can_push_commessa_reason_key', v_push_reason_key,
                      'nessuna_azione_key',          CASE WHEN v_nessuna_azione THEN v_nessuna_key END,
                      'non_editable_fields',         CASE WHEN v_stato_cod = 'DRAFT'
                                                          THEN c_non_edit_cliente
                                                          ELSE c_non_edit_tutti END,
                      'pdf',                         jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_codice',                v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_ordine(p_ordine_id bigint)
              IS 'Capability ordine di vendita per detail API: available_actions + push_commessa (decoupling fatturazione/spedizione, fn_list_ordini_da_pushare fonte unica; reason ORDINE_NON_CONFERMATO/ORDINE_FATTURA_DA_DDT/ORDINE_GIA_FATTURATO/ORDINE_NESSUNA_RIGA_PUSHABILE) + can_change_state + can_edit_* + nessuna_azione_key + non_editable_fields + stato_codice. rev 2026-07-11: + blocco pdf {mode, allow_allegati} da config.stati_doc_ordini. rev 2026-07-16: ogni azione espone enabled/reason/reason_key; se la transizione ha meta.requires_righe e l''ordine non ha righe -> enabled=false + reason DOCUMENTO_SENZA_RIGHE (predicato specchiato dal guard Regola 2, che non filtra su attivo). rev 2026-07-19: reason ORDINE_GIA_INVIATO (allocato, in attesa fatturazione) distinta da ORDINE_GIA_FATTURATO, entrambe via script.fn_get_stato_push_segment (vede anche componenti #CMP) — brief-db-push-commessa-gia-inviato §4b. rev 2026-07-19 (bis): le 5 reason_key del push passano al namespace i18n vendite.ordini.* (era ordini.*, radice inesistente nei locales FE) — brief-db-i18n-namespace-reason-ordini; convenzione in docs/it/dev/frontend/i18n-namespace-radici.md. rev 2026-08-04: le azioni verso ANNULLATO espongono reasons da script.fn_check_ordine_annullabile (stessa fn del guard di transizione); i motivi si sommano a quello di requires_righe in un array unico da cui discendono enabled/reason/reason_key. + nessuna_azione_key dal meta dello stato corrente (EVASO / PARZIALMENTE_EVASO), esposta solo quando nessuna azione risulta abilitata — valutata a parte da can_change_state, che qui conta apposta anche le disabilitate (brief-db-vie-uscita-operatore §4 regola R3, §6).';
