        scrivono jsonb_build_array() invece del letterale '[]'::jsonb, che il presidio dei
        segnaposto contava come un valore. Nessun cambio di comportamento. Brief: brief-db-
        magazzino-lotto-3-bis-carico-da-reso.
      preConditions:
