# Correzione — i valori vuoti del motivo 1 di script.fn_check_reso_merce
#   Brief: brief-db-magazzino-lotto-3-bis-carico-da-reso, sezione 4-ter
#
# -- PERCHE' ------------------------------------------------------------------------------------------
#   Il runner di Tid (2026-09-29): script/test-catalogo-messaggi-errore-completo,
#   test 7, «E_RESO_MAGAZZINO_OBBLIGATORIO <- script.fn_check_reso_merce (emette
#   1, il messaggio ne chiede 0)». Il motivo emette ZERO valori, ma li scriveva
#   come letterale '[]'::jsonb. Il presidio conta i valori dal jsonb_build_array(
#   che segue 'valori', dentro il motivo: col letterale non ne trova uno e prende
#   quello ESTERNO del motivo 2 (un argomento). E' la forma, non il contenuto:
#   la frase non ha segnaposto e la funzione non ne passava.
#   ⇒ jsonb_build_array(), la forma che il presidio sa leggere (e che la check
#   gemella della bolla usa per ogni motivo).
#   ⚠️ La prova pre-apply (§4-ter) non lo vedeva: questo presidio non era nella
#   regressione. Aggiunto alla lista dei presidi trasversali da provare.
#
#   Corpo di partenza: la doc auto-generata (rev 2026-09-28, 20260928-91). Cambia
#   solo la riga dei valori del motivo 1, e il COMMENT.
# ------------------------------------------------------------

