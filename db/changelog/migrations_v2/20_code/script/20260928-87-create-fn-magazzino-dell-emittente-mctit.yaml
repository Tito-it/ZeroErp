# P-3 — Regola del 2: «il magazzino e' dell'emittente del documento» in una sede sola
#   script.fn_magazzino_dell_emittente(bigint, bigint)   — BB nuovo
#   vendite.trgfn_ddt_guard_magazzino()                  — passo 3 dal BB (primo consumatore)
#   Brief: brief-db-magazzino-lotto-3-bis-carico-da-reso, sezione 3 (D-3b-a)
#
# -- PERCHE' UN BB -----------------------------------------------------------------------------------
#   La regola era scritta sul posto nel guard della bolla (Lotto 3, 20260928-69,
#   passo 3). Il reso e' la SECONDA occorrenza (vendite.trgfn_resi_guard_magazzino,
#   20260928-89): si estrae qui e il guard della bolla la chiama nello STESSO
#   giro. Il significato che non deve divergere e' la lettura sotto RLS: un
#   magazzino fuori perimetro risponde come uno inesistente.
#
# -- CHE COSA RESTA SCRITTO SUL POSTO, E PERCHE' -----------------------------------------------------
#   L'immutabilita' fuori bozza (passo 1) legge lo stato VECCHIO da due
#   vocabolari diversi (stati_doc_ddt, stati_doc_reso) e solleva due codici: il
#   pezzo comune e' «OLD.stato <> 'DRAFT'», e un BB costerebbe piu' di quello
#   che toglie. Resta nei due guard.
#   ⚠️ magazzino.trgfn_trasferimenti_guard_stesso_emittente fa un'altra domanda
#   («due magazzini dello stesso emittente», fail-closed se uno non risolve):
#   non e' un consumatore di questo BB.
#
#   Corpo del guard dalla doc auto-generata (rev 2026-09-28): cambiano il passo
#   3 (il BB al posto della SELECT), la variabile v_ef che esce dal DECLARE e il
#   COMMENT. Codice e frase del rifiuto identici.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260928-87-create-fn-magazzino-dell-emittente-mctit.yaml

  - changeSet:
      id: 20260928-87-create-fn-magazzino-dell-emittente
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB script.fn_magazzino_dell_emittente (true se il magazzino e' visibile ed e' dell'emittente
        passato, letto sotto RLS) e vendite.trgfn_ddt_guard_magazzino che lo chiama al passo 3,
        stesso codice e stessa frase. Regola del 2: il reso e' la seconda occorrenza. Brief: brief-
        db-magazzino-lotto-3-bis-carico-da-reso, sezione 3 (D-3b-a).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'vendite' AND p.proname = 'trgfn_ddt_guard_magazzino';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_magazzino_dell_emittente(
                  p_magazzino_id         magazzino.magazzini.id%TYPE,
                  p_emittente_fiscale_id magazzino.magazzini.emittente_fiscale_id%TYPE)
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: «questo magazzino appartiene a questo emittente?» — la regola M-6
              --   di un documento che nomina un magazzino (nessuna operazione attraversa
              --   due emittenti), in una sede sola.
              -- ⛔ INVOKER, di proposito: si legge SOTTO RLS. Un magazzino di un altro
              --   emittente non si vede, e deve rispondere come uno inesistente (false):
              --   il chiamante dice la stessa frase, e non rivela che cosa c'e' fuori dal
              --   perimetro. Una DEFINER qui darebbe al rifiuto un'informazione in piu'.
              -- Contratto: magazzino NULL -> NULL (non c'e' niente da giudicare: la
              --   scelta e' del chiamante, di solito «salta»); altrimenti true solo se il
              --   magazzino e' visibile ed e' dell'emittente passato.
              -- Consumatori (2026-09-28): vendite.trgfn_ddt_guard_magazzino (partenza e
              --   arrivo della bolla), vendite.trgfn_resi_guard_magazzino (rientro del reso).
              DECLARE
                  v_ef magazzino.magazzini.emittente_fiscale_id%TYPE;
              BEGIN
                  IF p_magazzino_id IS NULL THEN
                      RETURN NULL;
                  END IF;
                  SELECT m.emittente_fiscale_id INTO v_ef
                    FROM magazzino.magazzini m
                   WHERE m.id = p_magazzino_id;
                  RETURN v_ef IS NOT NULL AND v_ef IS NOT DISTINCT FROM p_emittente_fiscale_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_magazzino_dell_emittente(magazzino.magazzini.id%TYPE,
                                                                  magazzino.magazzini.emittente_fiscale_id%TYPE) IS
                  'Building block (regola del 2, 2026-09-28): true se il magazzino e'' visibile ed '
                  'e'' dell''emittente passato — la regola M-6 di un documento che nomina un '
                  'magazzino. INVOKER: letto sotto RLS, un magazzino di un altro emittente risponde '
                  'come uno inesistente (false), cosi'' il rifiuto non rivela niente fuori dal '
                  'perimetro. Magazzino NULL -> NULL (il chiamante salta). Consumatori: '
                  'vendite.trgfn_ddt_guard_magazzino, vendite.trgfn_resi_guard_magazzino. Brief: '
                  'brief-db-magazzino-lotto-3-bis-carico-da-reso (D-3b-a).';

              CREATE OR REPLACE FUNCTION vendite.trgfn_ddt_guard_magazzino()
               RETURNS trigger
               LANGUAGE plpgsql
              AS $function$
              -- Scopo: le regole del magazzino della bolla che un CHECK non vede
              --   (D-L3-a): immutabile fuori bozza, arrivo solo per la bolla di
              --   trasferimento e diverso dalla partenza, magazzini dell'emittente
              --   della bolla. Un solo codice per le regole di coerenza: la frase la
              --   compone il VARIADIC, che dice quale.
              DECLARE
                  v_stato_old config.stati_doc_ddt.codice_interno%TYPE;
                  v_causale   config.causali_trasporto.causale_magazzino%TYPE;
                  v_mag_id    magazzino.magazzini.id%TYPE;
              BEGIN
                  -- 1. Immutabili fuori bozza: lo stato VECCHIO decide.
                  IF TG_OP = 'UPDATE'
                     AND (NEW.magazzino_id        IS DISTINCT FROM OLD.magazzino_id
                          OR NEW.magazzino_arrivo_id IS DISTINCT FROM OLD.magazzino_arrivo_id) THEN
                      SELECT s.codice_interno INTO v_stato_old
                        FROM config.stati_doc_ddt s
                       WHERE s.id = OLD.stato_doc_ddt_id;
                      IF v_stato_old IS DISTINCT FROM 'DRAFT' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_IMMUTABILE',
                              jsonb_build_object('ddt_id', NEW.id, 'stato', v_stato_old,
                                                 'magazzino_da', OLD.magazzino_id, 'magazzino_a', NEW.magazzino_id,
                                                 'arrivo_da', OLD.magazzino_arrivo_id, 'arrivo_a', NEW.magazzino_arrivo_id),
                              -- Niente bersaglio: DDT non e' (ancora) un tipo di
                              -- config.tipi_entita, e l'operatore e' gia' sulla bolla.
                              NEW.tx_id,
                              COALESCE(v_stato_old, 'NULL'));
                      END IF;
                  END IF;

                  -- 2. L'arrivo: solo la bolla di trasferimento, e un ALTRO magazzino.
                  IF NEW.magazzino_arrivo_id IS NOT NULL THEN
                      v_causale := vendite.fn_ddt_causale_magazzino(NEW);
                      IF v_causale IS DISTINCT FROM 'TRASF_OUT' THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_INCOERENTE',
                              jsonb_build_object('ddt_id', NEW.id, 'regola', 'ARRIVO_SOLO_TRASFERIMENTO',
                                                 'causale_magazzino', v_causale),
                              NEW.tx_id,
                              'il magazzino di arrivo lo indica solo una bolla di trasferimento fra depositi');
                      END IF;
                      IF NEW.magazzino_arrivo_id = NEW.magazzino_id THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_INCOERENTE',
                              jsonb_build_object('ddt_id', NEW.id, 'regola', 'ARRIVO_UGUALE_PARTENZA',
                                                 'magazzino_id', NEW.magazzino_id),
                              NEW.tx_id,
                              'il magazzino di arrivo coincide con quello di partenza');
                      END IF;
                  END IF;

                  -- 3. Dell'emittente della bolla (M-6). La regola sta nel BB
                  --    script.fn_magazzino_dell_emittente (rev 2026-09-28, regola del 2:
                  --    il reso e' la seconda occorrenza): letta sotto RLS, un magazzino di
                  --    un altro emittente non si vede, e la frase e' la stessa.
                  FOREACH v_mag_id IN ARRAY ARRAY[NEW.magazzino_id, NEW.magazzino_arrivo_id] LOOP
                      CONTINUE WHEN v_mag_id IS NULL;
                      IF NOT script.fn_magazzino_dell_emittente(v_mag_id, NEW.emittente_fiscale_id) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'vendite', 'vendite.trgfn_ddt_guard_magazzino',
                              'E_DDT_MAGAZZINO_INCOERENTE',
                              jsonb_build_object('ddt_id', NEW.id, 'regola', 'EMITTENTE',
                                                 'magazzino_id', v_mag_id,
                                                 'emittente_ddt', NEW.emittente_fiscale_id),
                              NEW.tx_id,
                              'il magazzino indicato non appartiene all''azienda che emette la bolla');
                      END IF;
                  END LOOP;

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION vendite.trgfn_ddt_guard_magazzino()
              IS 'Guard BEFORE INSERT OR UPDATE OF magazzino_id, magazzino_arrivo_id, causale_trasporto_id, emittente_fiscale_id su vendite.ddt (D-L3-a). E_DDT_MAGAZZINO_IMMUTABILE: il magazzino (o l''arrivo) cambia su una bolla che non era in bozza — stato VECCHIO, come la causale. E_DDT_MAGAZZINO_INCOERENTE, con la regola nel VARIADIC: arrivo su una bolla che non e'' di trasferimento (causale di magazzino diversa da TRASF_OUT), arrivo uguale alla partenza, magazzino di un altro emittente (letto sotto RLS: invisibile e inesistente rispondono uguale). L''arrivo mancante NON e'' qui: e'' un motivo dell''emissione (script.fn_check_ddt_merce). Brief: brief-db-magazzino-lotto-3-scarico-da-ddt. rev 2026-09-28 (brief-db-magazzino-lotto-3-bis-carico-da-reso, regola del 2): la regola «magazzino dell''emittente» passa al BB script.fn_magazzino_dell_emittente, che il guard del reso (vendite.trgfn_resi_guard_magazzino) usa uguale.';
