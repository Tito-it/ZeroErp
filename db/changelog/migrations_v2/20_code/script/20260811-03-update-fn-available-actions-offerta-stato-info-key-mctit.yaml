# I domini muti: la nota di stato arriva anche qui — offerta.
#   Uno di quattro changeSet gemelli (20260811-01, 20260811-02, 20260811-03, 20260811-04):
#   contratto, reso, offerta, commessa. Slice §3 di
#   attivita-urgenti-del-10-08.md, aperta dalla
#   verifica del BE e decisa da Tid.
#
# 🔴 IL DIFETTO, e perche' e' peggiorato ieri. Questo dominio non emetteva
#   AFFATTO `stato_info_key`: la sua fn_available_actions_* non lo esponeva,
#   mentre il drawer del frontend lo legge gia' — il cablaggio c'era ed era
#   inerte. Fino a ieri la cosa si confondeva col comportamento generale
#   («la nota risponde alla barra vuota, e qui non compare mai»); da quando
#   la nota **spiega lo stato** e compare sempre (decisione §5 di Tid,
#   20260810-04/-05/-06), questi domini sono rimasti gli unici in cui uno
#   stato chiuso non dice niente. Verificato nel codice dal BE, non dedotto.
#
# ℹ️ COSA CAMBIA — gli stessi tre punti dei changeSet di ieri: una variabile,
#   una colonna nella SELECT di testata, un campo nel jsonb_build_object. La
#   funzione **raggiungeva gia'** la propria tabella di stato con un JOIN,
#   quindi non c'e' nessun JOIN nuovo da aggiungere.
#
# 🔴 LA PROPRIETA' NEL `meta` SI CHIAMA `nessuna_azione_key`, IL CAMPO DEL
#   BLOB `stato_info_key`. L'asimmetria e' voluta e va conosciuta:
#   `scripts/check_i18n_keys.py` trova le chiavi seminate **per quel nome**
#   (`RE_SEED_KEY` sui CSV, elenco `_PROP_KEY`), e rinominarla senza toccare
#   il guard nello stesso commit lo renderebbe **verde per cecita'** — non
#   rosso, verde. Rinominare anche la proprieta' e' una slice a se'.
#
# ⚠️ Il campo e' **sempre presente** nel blob, col valore a `null` quando non
#   si applica: filtrare con l'operatore di presenza risponde vero per TUTTI
#   i documenti. Va guardato il valore.
#
# 🟢 EFFETTO MISURATO: **6 documenti** — ANNULLATA (3) e SUPERATA (3).
#   RIFIUTATA e' seminata ma oggi non ha soggetti: la cella e' corretta e
#   serve alla regola del presidio, ma non aspettarsi di vederla a video.
#
# ⚠️ IL `lotto` NON E' IN QUESTA SLICE, ed e' una decisione: non ha una
#   tabella di stato propria, usa `config.stati_doc_fiscale` CONDIVISA con
#   `vendite.fatture` (8 FK). Il testo dovrebbe essere vero sia per un lotto
#   sia per una fattura, e `fn_available_actions_fattura` non esiste: meta'
#   dei consumatori non e' scritta. Restano dichiarati aperti.
#
# 🔴 CHIAVI i18n PER IL FE (dal seed di config/stati_doc_offerte.csv), da tradurre: senza,
#   il guard `check_i18n_keys.py` resta rosso — ed e' voluto.
#
# Nessun'altra modifica al corpo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260811-03-update-fn-available-actions-offerta-stato-info-key-mctit.yaml

  - changeSet:
      id: 20260811-03-update-fn-available-actions-offerta-stato-info-key
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_offerta: espone stato_info_key dal meta dello
        stato corrente, emesso sempre che lo stato lo dichiari. Il dominio
        era fra i cinque muti mentre il drawer leggeva gia' il campo.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: config
                tableName: stati_doc_offerte
                columnName: meta
            - columnExists:
                schemaName: config
                tableName: stati_doc_offerte
                columnName: fase
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'script'
                    AND p.proname = 'fn_available_actions_offerta'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_offerta(p_offerta_id vendite.offerte_commerciali.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: capability offerta commerciale per detail API (data-driven,
              --   specchio di fn_available_actions_preventivo). push_contratto e
              --   genera_ordine mutuamente esclusive (ACCETTATA).
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_offerte (bottone PDF data-driven via capabilities).
              --   rev 2026-07-19: + enabled/reason/reason_key su ogni azione
              --   (uniformita' 6 domini): verso EMESSA disabled se la versione
              --   listino manca o non e' ATTIVA — specchio del guard
              --   BOZZA->EMESSA (brief-db-guard-righe-avanzamento-stato §1a).
              --   rev 2026-07-19 (bis): le 3 push_reason passano al namespace
              --   i18n vendite.offerte.* (era offerte.*, radice inesistente nei
              --   locales FE) — brief-db-i18n-reason-mancanti-offerte-preventivi.
              --   rev 2026-08-06: + outlined dal meta della transizione (era
              --   l'unica insieme al preventivo a non emetterlo: il dato del
              --   seed non arrivava al pulsante) e + target_state_descrizione,
              --   la forma leggibile dello stato di destinazione, che il
              --   codice_interno non permette di derivare (BOZZA -> Bozza vale
              --   per caso, ALLOCATO -> «Allocato a magazzino» no). NULL sulle
              --   azioni che non cambiano stato.
              --   rev 2026-08-11: + stato_info_key, la nota che spiega cosa sta
              --   succedendo quando il documento e' in uno stato chiuso. Arriva dal
              --   `meta` dello stato, e viene emessa SEMPRE che lo stato la dichiari —
              --   anche accanto a un'azione ancora abilitata: la nota spiega lo STATO,
              --   non risponde a una barra vuota (decisione §5 di Tid, gia' applicata a
              --   preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era
              --   fra i cinque che non emettevano affatto il campo, mentre il drawer lo
              --   legge gia': il cablaggio c'era ed era inerte.
              --   ⚠️ La PROPRIETA' nel meta si chiama `nessuna_azione_key` mentre il
              --   campo del blob si chiama `stato_info_key`. L'asimmetria e' voluta:
              --   scripts/check_i18n_keys.py trova le chiavi seminate per QUEL nome
              --   (RE_SEED_KEY sui CSV, elenco _PROP_KEY), e rinominarla senza toccare
              --   il guard lo renderebbe verde per cecita'.
              --   ⚠️ Il campo e' SEMPRE presente nel blob, col valore a null quando non
              --   si applica: filtrare per presenza risponde vero per tutti i documenti,
              --   va guardato il valore.
              --   brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3.
              DECLARE
                  v_stato_id    vendite.offerte_commerciali.stato_doc_offerta_id%TYPE;
                  v_stato_cod   config.stati_doc_offerte.codice_interno%TYPE;
                  v_stato_info_key      text;
                  v_pdf_mode    config.stati_doc_offerte.pdf_mode%TYPE;
                  v_pdf_allow   config.stati_doc_offerte.pdf_allow_allegati%TYPE;
                  v_listino_versione_id vendite.offerte_commerciali.listino_versione_id%TYPE;
                  v_stato_versione      vendite.listini_versioni.stato%TYPE;
                  v_emit_ok             boolean := true;
                  v_emit_reason         text := NULL;
                  v_emit_reason_key     text := NULL;
                  v_actions     jsonb;
                  v_can_edit    boolean;
                  v_can_rev     boolean;
                  v_has_contratto boolean;
                  v_has_ordine    boolean;
                  v_enabled       boolean;
                  v_can_push    boolean;
                  v_push_reason     text;
                  v_push_reason_key text;
                  v_can_ordine        boolean;
                  v_ordine_reason     text;
                  v_ordine_reason_key text;
                  c_sempre_non_edit CONSTANT jsonb :=
                      '["codice","uid","revisione_numero","revisione_padre_id",'
                      '"stato_doc_offerta_id","data_emissione","data_accettazione",'
                      '"data_rifiuto","data_annullamento","motivazione_rifiuto"]'::jsonb;
                  c_non_edit_extra CONSTANT jsonb :=
                      '["emittente_fiscale_id","billing_account_id","istanza_utility_id",'
                      '"utility_id","listino_id","listino_versione_id",'
                      '"valore_variazione_globale","tipo_variazione_globale",'
                      '"validita_dal","validita_al","meta"]'::jsonb;
                  -- Azioni applicative: non sono transizioni, quindi
                  -- target_state e target_state_descrizione restano NULL.
                  c_action_crea_revisione CONSTANT jsonb := jsonb_build_object(
                      'key',                      'crea_revisione',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.offerte.azione_crea_revisione',
                      'severity',                 'info',
                      'icon',                     'pi pi-clone',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  c_action_push_contratto CONSTANT jsonb := jsonb_build_object(
                      'key',                      'push_contratto',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.offerte.azione_push_contratto',
                      'severity',                 'success',
                      'icon',                     'pi pi-arrow-right',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
                  c_action_genera_ordine CONSTANT jsonb := jsonb_build_object(
                      'key',                      'genera_ordine',
                      'target_state',             NULL,
                      'target_state_descrizione', NULL,
                      'label_key',                'vendite.offerte.azione_genera_ordine',
                      'severity',                 'info',
                      'icon',                     'pi pi-shopping-cart',
                      'requires_confirm',         true,
                      'requires_motivazione',     false,
                      'outlined',                 false,
                      'enabled',                  true,
                      'reason',                   NULL,
                      'reason_key',               NULL
                  );
              BEGIN
                  -- Stato corrente + versione listino + capability PDF.
                  SELECT o.stato_doc_offerta_id, sdo.codice_interno,
                         sdo.pdf_mode, sdo.pdf_allow_allegati,
                         o.listino_versione_id,
                         sdo.meta->>'nessuna_azione_key'
                    INTO v_stato_id, v_stato_cod, v_pdf_mode, v_pdf_allow,
                         v_listino_versione_id, v_stato_info_key
                    FROM vendite.offerte_commerciali o
                    JOIN config.stati_doc_offerte sdo ON sdo.id = o.stato_doc_offerta_id
                   WHERE o.id = p_offerta_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione di emissione (specchio del guard BOZZA->EMESSA):
                  -- versione listino valorizzata e in stato ATTIVA. Le righe non
                  -- c'entrano: nelle offerte sono espanse dal listino.
                  IF v_listino_versione_id IS NULL THEN
                      v_emit_ok         := false;
                      v_emit_reason     := 'LISTINO_VERSIONE_MANCANTE';
                      v_emit_reason_key := 'vendite.offerte.azione_reason.listino_versione_mancante';
                  ELSE
                      SELECT lv.stato INTO v_stato_versione
                        FROM vendite.listini_versioni lv
                       WHERE lv.id = v_listino_versione_id;

                      IF v_stato_versione IS DISTINCT FROM 'ATTIVA' THEN
                          v_emit_ok         := false;
                          v_emit_reason     := 'LISTINO_VERSIONE_NON_ATTIVA';
                          v_emit_reason_key := 'vendite.offerte.azione_reason.listino_versione_non_attiva';
                      END IF;
                  END IF;

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',                t.meta->>'action_key',
                              'target_state',       sa.codice_interno,
                              -- Forma leggibile della destinazione: la colonna
                              -- accanto, nello stesso JOIN.
                              'target_state_descrizione', sa.descrizione,
                              'label_key',          t.meta->>'label_key',
                              'severity',           t.meta->>'severity',
                              'icon',               t.meta->>'icon',
                              'requires_confirm',   COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'requires_motivazione', COALESCE((t.meta->>'requires_motivazione')::boolean, false),
                              'outlined',           COALESCE((t.meta->>'outlined')::boolean, false),
                              'enabled',            CASE WHEN sa.codice_interno = 'EMESSA'
                                                         THEN v_emit_ok ELSE true END,
                              'reason',             CASE WHEN sa.codice_interno = 'EMESSA'
                                                         THEN v_emit_reason END,
                              'reason_key',         CASE WHEN sa.codice_interno = 'EMESSA'
                                                         THEN v_emit_reason_key END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.stati_doc_offerte_transizioni t
                  JOIN config.stati_doc_offerte sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  v_can_rev := (v_stato_cod = 'EMESSA');
                  IF v_can_rev THEN
                      v_actions := v_actions || jsonb_build_array(c_action_crea_revisione);
                  END IF;

                  SELECT EXISTS (
                      SELECT 1 FROM vendite.contratti WHERE offerta_id = p_offerta_id
                  ) INTO v_has_contratto;

                  SELECT EXISTS (
                      SELECT 1 FROM vendite.ordini
                       WHERE documento_origine_tipo = 'OFFERTA'
                         AND documento_origine_id   = p_offerta_id
                  ) INTO v_has_ordine;

                  v_enabled := (v_stato_cod = 'ACCETTATA'
                                AND NOT v_has_contratto
                                AND NOT v_has_ordine);

                  v_can_push := v_enabled;
                  IF v_enabled THEN
                      v_push_reason     := NULL;
                      v_push_reason_key := NULL;
                      v_actions := v_actions || jsonb_build_array(c_action_push_contratto);
                  ELSIF v_has_contratto THEN
                      v_push_reason     := 'OFFERTA_CONTRATTO_GIA_GENERATO';
                      v_push_reason_key := 'vendite.offerte.push_reason.gia_generato';
                  ELSIF v_has_ordine THEN
                      v_push_reason     := 'OFFERTA_ORDINE_GIA_GENERATO';
                      v_push_reason_key := 'vendite.offerte.push_reason.ordine_gia_generato';
                  ELSE
                      v_push_reason     := 'OFFERTA_NON_ACCETTATA';
                      v_push_reason_key := 'vendite.offerte.push_reason.non_accettata';
                  END IF;

                  v_can_ordine := v_enabled;
                  IF v_enabled THEN
                      v_ordine_reason     := NULL;
                      v_ordine_reason_key := NULL;
                      v_actions := v_actions || jsonb_build_array(c_action_genera_ordine);
                  ELSIF v_has_ordine THEN
                      v_ordine_reason     := 'OFFERTA_ORDINE_GIA_GENERATO';
                      v_ordine_reason_key := 'vendite.offerte.push_reason.ordine_gia_generato';
                  ELSIF v_has_contratto THEN
                      v_ordine_reason     := 'OFFERTA_CONTRATTO_GIA_GENERATO';
                      v_ordine_reason_key := 'vendite.offerte.push_reason.gia_generato';
                  ELSE
                      v_ordine_reason     := 'OFFERTA_NON_ACCETTATA';
                      v_ordine_reason_key := 'vendite.offerte.push_reason.non_accettata';
                  END IF;

                  v_can_edit := (v_stato_cod = 'BOZZA');

                  RETURN jsonb_build_object(
                      'available_actions',             v_actions,
                      'can_change_state',              jsonb_array_length(v_actions) > 0,
                      'can_edit_testata',              v_can_edit,
                      'can_edit_eccezioni',            v_can_edit,
                      'can_edit_utility',              v_can_edit,
                      'can_create_revisione',          v_can_rev,
                      'can_push_contratto',            v_can_push,
                      'can_push_contratto_reason',     v_push_reason,
                      'can_push_contratto_reason_key', v_push_reason_key,
                      'can_genera_ordine',             v_can_ordine,
                      'can_genera_ordine_reason',      v_ordine_reason,
                      'can_genera_ordine_reason_key',  v_ordine_reason_key,
                      'non_editable_fields',           CASE WHEN v_can_edit
                                                           THEN c_sempre_non_edit
                                                           ELSE c_sempre_non_edit || c_non_edit_extra END,
                      'pdf',                           jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_info_key',                v_stato_info_key,
                      'stato_codice',                  v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_offerta(p_offerta_id bigint)
              IS 'Capability offerta commerciale per detail API: available_actions + can_edit_* + push_contratto/genera_ordine (mutuamente esclusive) + create_revisione + non_editable_fields. rev 2026-07-11: + blocco pdf {mode, allow_allegati}. rev 2026-07-19: + enabled/reason/reason_key su ogni azione (uniformita'' 6 domini, brief-db-guard-righe-avanzamento-stato §1a) — la transizione verso EMESSA e'' disabled con reason LISTINO_VERSIONE_MANCANTE / LISTINO_VERSIONE_NON_ATTIVA, specchio del guard BOZZA->EMESSA (per le offerte il "vuoto" e'' la versione listino, non le righe: sono espanse dal listino). rev 2026-07-19 (bis): le 3 push_reason (gia_generato / ordine_gia_generato / non_accettata, usate sia da can_push_contratto_reason_key sia da can_genera_ordine_reason_key) passano al namespace i18n vendite.offerte.* — erano sotto offerte.*, radice inesistente nei locales, quindi il motivo non compariva mai in interfaccia; brief-db-i18n-reason-mancanti-offerte-preventivi. rev 2026-08-06: ogni azione espone outlined (dal meta della transizione, COALESCE a false) e target_state_descrizione (config.stati_doc_offerte.descrizione della destinazione). outlined mancava qui e sul preventivo: il seed lo portava ma la funzione non lo emetteva, quindi il pulsante distruttivo restava rosso pieno mentre negli altri sei domini era outlined. target_state_descrizione serve alla frase di conferma «portare il documento nello stato X»: il codice_interno non e'' la forma leggibile e derivarla nel FE sarebbe una seconda copia del vocabolario degli stati; NULL sulle azioni applicative (crea_revisione / push_contratto / genera_ordine), che non cambiano stato. rev 2026-08-11: + stato_info_key, la nota di stato letta dal meta dello stato corrente ed emessa SEMPRE che lo stato la dichiari, anche accanto a un''azione ancora abilitata: la nota spiega lo STATO e non risponde a una barra vuota (decisione §5 di Tid, gia'' applicata a preventivo/ordine/DDT con 20260810-04/-05/-06). Questo dominio era fra i cinque che non emettevano affatto il campo mentre il drawer lo legge gia'': il cablaggio c''era ed era inerte. ⚠️ La PROPRIETA'' nel meta resta nessuna_azione_key mentre il campo del blob si chiama stato_info_key: scripts/check_i18n_keys.py trova le chiavi seminate per quel nome, e rinominarla senza toccare il guard lo renderebbe verde per cecita''. ⚠️ Il campo e'' SEMPRE presente nel blob, col valore a null quando non si applica: filtrare per presenza risponde vero per tutti i documenti, va guardato il valore. brief-db-vie-uscita-operatore §12.6; attivita-urgenti-del-10-08 §3.';
