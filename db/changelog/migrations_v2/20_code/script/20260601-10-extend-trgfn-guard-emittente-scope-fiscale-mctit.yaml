databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260601-10-extend-trgfn-guard-emittente-scope-fiscale-mctit.yaml

  - changeSet:
      id: 20260601-10-extend-trgfn-guard-emittente-scope-fiscale
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Estende script.trgfn_guard_emittente_scope con la modalita' 'fiscale'
        (convenzione PK): la colonna contiene direttamente emittente_fiscale_id,
        nessuna risoluzione necessaria (brief RLS §7 - simmetria scrittura per
        le tabelle PK preventivi/contratti/offerte_commerciali/documenti_generati/
        pratiche/ordini). Modalita' esistenti invariate ('soggetto_ruolo', via
        emittenti_fiscali; 'fattura', via vendite.fatture). Il guard continua a
        leggere app.current_user_id e a delegare alla canonica
        script.fn_check_user_emittente_scope (read+write unificati). Firma e
        comportamento per le modalita' esistenti invariati.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_check_user_emittente_scope';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.trgfn_guard_emittente_scope()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_auth_user_id         anagrafiche.risorse_umane_auth_user.auth_user_id%TYPE;
                v_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE;
                v_col_value            bigint;
                v_mode                 text := TG_ARGV[0];
                v_col_name             text := TG_ARGV[1];
              BEGIN
                -- =========================================================
                -- Defense-in-depth: verifica che l'utente corrente abbia
                -- scope sull'emittente fiscale della riga.
                --
                -- Modalita' (TG_ARGV[0]):
                --   'soggetto_ruolo' = la colonna contiene soggetto_ruolo_id,
                --       si risolve via anagrafiche.emittenti_fiscali
                --   'fattura' = la colonna contiene fattura_id,
                --       si risolve via vendite.fatture -> emittenti_fiscali
                --   'fiscale' = la colonna contiene gia' emittente_fiscale_id
                --       (convenzione PK), nessuna risoluzione
                --
                -- Se app.current_user_id non e' settato (batch job) -> skip.
                -- Se emittente non risolvibile -> skip (dati non ancora linkati).
                -- =========================================================

                -- 1. Leggi user_id dalla sessione PG
                v_auth_user_id := NULLIF(
                  current_setting('app.current_user_id', true), ''
                )::integer;

                IF v_auth_user_id IS NULL THEN
                  RETURN NEW;  -- batch job, nessun filtro
                END IF;

                -- 2. Leggi valore colonna da NEW
                v_col_value := (to_jsonb(NEW) ->> v_col_name)::bigint;

                IF v_col_value IS NULL THEN
                  RETURN NEW;
                END IF;

                -- Su UPDATE, skip se la colonna non e' cambiata
                IF TG_OP = 'UPDATE' AND
                   v_col_value = (to_jsonb(OLD) ->> v_col_name)::bigint THEN
                  RETURN NEW;
                END IF;

                -- 3. Risolvi emittente_fiscale_id in base alla modalita'
                IF v_mode = 'soggetto_ruolo' THEN
                  SELECT ef.id
                    INTO v_emittente_fiscale_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.soggetto_ruolo_id = v_col_value;

                ELSIF v_mode = 'fattura' THEN
                  SELECT ef.id
                    INTO v_emittente_fiscale_id
                    FROM vendite.fatture f
                    JOIN anagrafiche.emittenti_fiscali ef
                      ON ef.soggetto_ruolo_id = f.emittente_soggetto_ruolo_id
                   WHERE f.id = v_col_value;

                ELSIF v_mode = 'fiscale' THEN
                  -- Convenzione PK: la colonna E' gia' emittente_fiscale_id.
                  v_emittente_fiscale_id := v_col_value;
                END IF;

                IF v_emittente_fiscale_id IS NULL THEN
                  RETURN NEW;  -- emittente non risolvibile
                END IF;

                -- 4. Verifica scope (canonica auth_user_id, bypass SUPER_ADMIN)
                IF NOT script.fn_check_user_emittente_scope(
                         v_auth_user_id, v_emittente_fiscale_id) THEN
                  PERFORM script.fn_log_and_raise_error(
                    TG_TABLE_SCHEMA::text,
                    'trgfn_guard_emittente_scope',
                    'E_SCOPE_EMITTENTE',
                    jsonb_build_object(
                      'detail', 'Utente non autorizzato per emittente fiscale',
                      'auth_user_id', v_auth_user_id,
                      'emittente_fiscale_id', v_emittente_fiscale_id,
                      'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME
                    ),
                    NULL::uuid,
                    format(
                      'Utente %s non autorizzato per emittente fiscale %s su %s.%s',
                      v_auth_user_id, v_emittente_fiscale_id,
                      TG_TABLE_SCHEMA, TG_TABLE_NAME
                    )
                  );
                END IF;

                RETURN NEW;
              END
              $$;

              COMMENT ON FUNCTION script.trgfn_guard_emittente_scope()
                IS 'Defense-in-depth: blocca INSERT/UPDATE se utente non ha scope su emittente fiscale. Modalita TG_ARGV[0]: soggetto_ruolo | fattura | fiscale (PK diretta).';
      rollback:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Rollback alla versione pre-'fiscale' (20260308-09): solo
              -- modalita' soggetto_ruolo e fattura.
              CREATE OR REPLACE FUNCTION script.trgfn_guard_emittente_scope()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_auth_user_id         anagrafiche.risorse_umane_auth_user.auth_user_id%TYPE;
                v_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE;
                v_col_value            bigint;
                v_mode                 text := TG_ARGV[0];
                v_col_name             text := TG_ARGV[1];
              BEGIN
                v_auth_user_id := NULLIF(current_setting('app.current_user_id', true), '')::integer;
                IF v_auth_user_id IS NULL THEN
                  RETURN NEW;
                END IF;
                v_col_value := (to_jsonb(NEW) ->> v_col_name)::bigint;
                IF v_col_value IS NULL THEN
                  RETURN NEW;
                END IF;
                IF TG_OP = 'UPDATE' AND
                   v_col_value = (to_jsonb(OLD) ->> v_col_name)::bigint THEN
                  RETURN NEW;
                END IF;
                IF v_mode = 'soggetto_ruolo' THEN
                  SELECT ef.id INTO v_emittente_fiscale_id
                    FROM anagrafiche.emittenti_fiscali ef
                   WHERE ef.soggetto_ruolo_id = v_col_value;
                ELSIF v_mode = 'fattura' THEN
                  SELECT ef.id INTO v_emittente_fiscale_id
                    FROM vendite.fatture f
                    JOIN anagrafiche.emittenti_fiscali ef
                      ON ef.soggetto_ruolo_id = f.emittente_soggetto_ruolo_id
                   WHERE f.id = v_col_value;
                END IF;
                IF v_emittente_fiscale_id IS NULL THEN
                  RETURN NEW;
                END IF;
                IF NOT script.fn_check_user_emittente_scope(
                         v_auth_user_id, v_emittente_fiscale_id) THEN
                  PERFORM script.fn_log_and_raise_error(
                    TG_TABLE_SCHEMA::text,
                    'trgfn_guard_emittente_scope',
                    'E_SCOPE_EMITTENTE',
                    jsonb_build_object(
                      'detail', 'Utente non autorizzato per emittente fiscale',
                      'auth_user_id', v_auth_user_id,
                      'emittente_fiscale_id', v_emittente_fiscale_id,
                      'table', TG_TABLE_SCHEMA || '.' || TG_TABLE_NAME
                    ),
                    NULL::uuid,
                    format(
                      'Utente %s non autorizzato per emittente fiscale %s su %s.%s',
                      v_auth_user_id, v_emittente_fiscale_id,
                      TG_TABLE_SCHEMA, TG_TABLE_NAME
                    )
                  );
                END IF;
                RETURN NEW;
              END
              $$;
