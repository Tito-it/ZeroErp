# script.fn_valore_parametro_non_conforme — LA REGOLA DI OGNI FORMA, IN UN POSTO
#   Brief: brief-db-liste-datatable-grezze-secondo-giro §4.6.1 (D-5, Tid 2026-10-31)
#
# ── COSA DICE ────────────────────────────────────────────────────
#   Dato il tipo di un parametro (config.parameters.tipo_valore) e un valore,
#   rende NULL se il valore ha la forma del tipo, altrimenti la forma attesa
#   in parole («un numero intero da 1 a 999999»), che i guard mettono nel
#   messaggio d'errore. Una funzione sola per la regola e per la frase: le due
#   non possono dissentire.
#
# ── CHI LA LEGGE ─────────────────────────────────────────────────
#   · i guard a07 di config.parameters (20261031-56) e di
#     config.parameter_overrides (20261031-57): la regola in scrittura;
#   · script.fn_intero_positivo_da_testo (20261031-55): il lettore fail-loud,
#     che prima teneva la stessa regex per conto suo (regola del 2).
#
# ── LE SCELTE ────────────────────────────────────────────────────
#   · le forme sono canoniche, niente btrim e niente varianti: BOOLEANO e'
#     «true» o «false» minuscolo (la forma del seed), un numero non ha segno,
#     spazi ne' zeri iniziali, il separatore decimale e' il punto;
#   · i tetti (999999 per un intero, 12 cifre intere e 6 decimali per un
#     decimale) sono quelli di una configurazione, non di una colonna: il
#     confine del dominio (un giorno del mese, una percentuale) lo controlla
#     chi legge il parametro;
#   · un valore NULL non e' conforme a nessun tipo: le due colonne sono NOT
#     NULL, e il lettore fail-loud tratta NULL come «manca»;
#   · un tipo che non esiste e' un errore del chiamante
#     (E_SCRIPT_CHIAMATA_NON_VALIDA), non un valore sbagliato: il CHECK
#     chk_parameters_tipo_valore non lo lascia scrivere.
#   · nei rami a due passi (DECIMALE_POSITIVO, DATA) il secondo controllo e' in
#     un IF annidato: un AND in SQL non garantisce l'ordine, e il cast di un
#     testo non numerico solleverebbe.
#
# ⚠️ Il vocabolario sta in due posti per costruzione (il CHECK e questo CASE):
#   il pgTAP config/test-parameters-tipo-valore-v1 li confronta.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261031-54-create-fn-valore-parametro-non-conforme-mctit.yaml

  - changeSet:
      id: 20261031-54-create-fn-valore-parametro-non-conforme
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_valore_parametro_non_conforme(tipo, valore): NULL se il valore ha la forma del
        tipo del parametro, altrimenti la forma attesa in parole. La regola delle forme di
        config.parameters.tipo_valore in un posto solo, per i guard in scrittura e per il lettore
        fail-loud. Brief: brief-db-liste-datatable-grezze-secondo-giro §4.6.1 (D-5).
      preConditions:
        - onFail: HALT
        - columnExists:
            schemaName: config
            tableName: parameters
            columnName: tipo_valore
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_valore_parametro_non_conforme(
                  p_tipo_valore config.parameters.tipo_valore%TYPE,
                  p_valore      config.parameters.default_value%TYPE
              )
               RETURNS text
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              -- =========================================================
              -- Scopo: la forma del valore di un parametro. NULL = il valore
              --   ha la forma di p_tipo_valore; altrimenti la forma attesa in
              --   parole, per il messaggio d'errore.
              -- STABLE e non IMMUTABLE: pg_input_is_valid lo e'.
              -- Brief: brief-db-liste-datatable-grezze-secondo-giro §4.6.1.
              -- =========================================================
              DECLARE
                  -- La forma attesa in parole: testo di lavoro, nessuna colonna.
                  v_forma text;
              BEGIN
                  v_forma := CASE p_tipo_valore
                      WHEN 'BOOLEANO'                      THEN 'true oppure false'
                      WHEN 'INTERO_POSITIVO'               THEN 'un numero intero da 1 a 999999'
                      WHEN 'INTERO_NON_NEGATIVO'           THEN 'un numero intero da 0 a 999999'
                      WHEN 'DECIMALE_POSITIVO'             THEN 'un numero maggiore di zero, col punto per i decimali (al massimo 6)'
                      WHEN 'DECIMALE_NON_NEGATIVO'         THEN 'un numero da zero in su, col punto per i decimali (al massimo 6)'
                      WHEN 'DECIMALE_NON_NEGATIVO_O_VUOTO' THEN 'un numero da zero in su, col punto per i decimali (al massimo 6), oppure vuoto'
                      WHEN 'DATA'                          THEN 'una data nella forma AAAA-MM-GG'
                      WHEN 'TESTO'                         THEN 'un valore'
                  END;

                  IF v_forma IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_valore_parametro_non_conforme',
                          'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('tipo_valore', p_tipo_valore),
                          NULL::uuid,
                          'script.fn_valore_parametro_non_conforme',
                          format('tipo del valore sconosciuto: %s', COALESCE(p_tipo_valore, 'NULL')));
                  END IF;

                  -- Nessun valore: non e' conforme a nessun tipo.
                  IF p_valore IS NULL THEN
                      RETURN v_forma;
                  END IF;

                  CASE p_tipo_valore
                      WHEN 'BOOLEANO' THEN
                          IF p_valore IN ('true', 'false') THEN
                              RETURN NULL;
                          END IF;
                      WHEN 'INTERO_POSITIVO' THEN
                          IF p_valore ~ '^[1-9][0-9]{0,5}$' THEN
                              RETURN NULL;
                          END IF;
                      WHEN 'INTERO_NON_NEGATIVO' THEN
                          IF p_valore ~ '^(0|[1-9][0-9]{0,5})$' THEN
                              RETURN NULL;
                          END IF;
                      WHEN 'DECIMALE_POSITIVO' THEN
                          IF p_valore ~ '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$' THEN
                              -- Il cast solo dopo la forma: un IF annidato.
                              IF p_valore::numeric > 0 THEN
                                  RETURN NULL;
                              END IF;
                          END IF;
                      WHEN 'DECIMALE_NON_NEGATIVO' THEN
                          IF p_valore ~ '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$' THEN
                              RETURN NULL;
                          END IF;
                      WHEN 'DECIMALE_NON_NEGATIVO_O_VUOTO' THEN
                          IF p_valore = '' OR p_valore ~ '^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$' THEN
                              RETURN NULL;
                          END IF;
                      WHEN 'DATA' THEN
                          IF p_valore ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' THEN
                              -- La forma non basta (2026-02-30): la data deve esistere.
                              IF pg_input_is_valid(p_valore, 'date') THEN
                                  RETURN NULL;
                              END IF;
                          END IF;
                      WHEN 'TESTO' THEN
                          RETURN NULL;
                  END CASE;

                  RETURN v_forma;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_valore_parametro_non_conforme(config.parameters.tipo_valore%TYPE, config.parameters.default_value%TYPE) IS
                  'La forma del valore di un parametro (config.parameters.tipo_valore), in un posto solo: NULL se p_valore ha la forma di p_tipo_valore, altrimenti la forma attesa in parole, per il messaggio d''errore. Forme canoniche, niente btrim: BOOLEANO true/false minuscolo; INTERO_POSITIVO 1..999999 e INTERO_NON_NEGATIVO 0..999999, senza segno ne'' zeri iniziali; DECIMALE_POSITIVO (> 0), DECIMALE_NON_NEGATIVO (>= 0) e DECIMALE_NON_NEGATIVO_O_VUOTO (anche la stringa vuota): fino a 12 cifre intere e 6 decimali, col punto; DATA AAAA-MM-GG e data esistente; TESTO qualunque valore. NULL non e'' conforme a nessun tipo. Tipo sconosciuto: E_SCRIPT_CHIAMATA_NON_VALIDA. Il confine del dominio (un giorno del mese, una percentuale) lo controlla chi legge il parametro. Lettori: i guard a07 di config.parameters e config.parameter_overrides, script.fn_intero_positivo_da_testo. Brief: brief-db-liste-datatable-grezze-secondo-giro (D-5).';

              GRANT EXECUTE ON FUNCTION script.fn_valore_parametro_non_conforme(config.parameters.tipo_valore%TYPE, config.parameters.default_value%TYPE) TO zeroerp_app;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_valore_parametro_non_conforme(text, text);
