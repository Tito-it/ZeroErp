databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/script/20251202-02-fn-get-contatti-default-mctit.yaml

    - changeSet:
          id: 20251202-02-fn-get-contatti-default
          author: mctit
          comment: >
              Restituisce il contatto marcato come DEFAULT per un soggetto
              (e opzionalmente per ruolo, utility, tipo_contatto).
                    - Riutilizza fn_get_contatti per costruire i candidati.
                    - Filtra is_default = TRUE.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        CREATE OR REPLACE FUNCTION script.fn_get_contatto_default(
                            p_soggetto_id        uuid,
                            p_soggetto_ruolo_id  bigint   DEFAULT NULL::bigint,
                            p_utility_id         integer  DEFAULT NULL::integer,
                            p_tipo_contatto_id   integer  DEFAULT NULL::integer
                        )
                        RETURNS TABLE (
                            id                bigint,
                            tipo_contatto_id  integer,
                            soggetto_id       uuid,
                            soggetto_ruolo_id bigint,
                            utility_id        integer,
                            nominativo        varchar,
                            email             varchar,
                            telefono          varchar,
                            cellulare         varchar,
                            pec               varchar,
                            note              text,
                            is_default        boolean,
                            default_context   varchar
                        )
                        LANGUAGE sql
                        AS $function$

                        /*
                        fn_get_contatto_default

                        Restituisce il contatto marcato come DEFAULT per un soggetto
                        (e opzionalmente per ruolo, utility, tipo_contatto).

                        - Riutilizza fn_get_contatti per costruire i candidati.
                        - Filtra is_default = TRUE.
                        - Ritorna 0 o 1 record.
                        */

                        WITH all_candidates AS (
                            SELECT *
                            FROM script.fn_get_contatti(
                                p_soggetto_id,
                                p_soggetto_ruolo_id,
                                p_utility_id,
                                p_tipo_contatto_id
                            )
                        ),
                        only_default AS (
                            SELECT *,
                                ROW_NUMBER() OVER (
                                        ORDER BY
                                            -- priorità implicita già gestita in fn_get_contatti
                                            CASE WHEN is_default THEN 0 ELSE 1 END,
                                            id
                                ) AS rn
                            FROM all_candidates
                            WHERE is_default = TRUE
                        )

                        SELECT
                            id,
                            tipo_contatto_id,
                            soggetto_id,
                            soggetto_ruolo_id,
                            utility_id,
                            nominativo,
                            email,
                            telefono,
                            cellulare,
                            pec,
                            note,
                            is_default,
                            default_context
                        FROM only_default
                        WHERE rn = 1;

                        $function$;


                        COMMENT ON FUNCTION script.fn_get_contatto_default(
                            uuid,
                            bigint,
                            integer,
                            integer
                        )
                            IS 'Restituisce il contatto marcato come DEFAULT per un soggetto
                            (e opzionalmente per ruolo, utility, tipo_contatto). 
                            Riutilizza fn_get_contatti per costruire i candidati. 
                            Filtra is_default = TRUE. Ritorna 0 o 1 record.';
