# ------------------------------------------------------------
# SPDX-License-Identifier: AGPL-3.0-or-later
# Liquibase changelog per Zero ERP
#
# Fix: trgfn_guard_utility_tipo_ruolo_by_cols e fn_get_search_detail
# Sostituisce E_GENERICO con E_CODICE per lookup falliti:
#   - soggetto_ruolo_id non trovato in anagrafiche.soggetti_ruoli
#   - tipo_ruolo_id non trovato in config.tipi_ruoli
# ------------------------------------------------------------

databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/script/20260331-03-fix-script-fn-e-generico-mctit.yaml

    - changeSet:
          id: 20260331-03-fix-trgfn-guard-utility-tipo-ruolo-by-cols
          author: mctit
          runOnChange: false
          comment: >
              Fix trgfn_guard_utility_tipo_ruolo_by_cols: E_GENERICO → E_CODICE
              per lookup soggetto_ruolo_id fallito.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- trgfn_guard_utility_tipo_ruolo_by_cols
                        --
                        -- Scopo: trigger guard generico utility→tipo_ruolo.
                        --        Legge utility_id e soggetto_ruolo_id dai nomi colonna
                        --        passati come TG_ARGV, recupera tipo_ruolo_id dal
                        --        soggetto_ruolo, e delega la validazione a
                        --        fn_guard_utility_tipo_ruolo.
                        --
                        -- Argomenti trigger:
                        --   TG_ARGV[0] = nome colonna utility_id
                        --   TG_ARGV[1] = nome colonna soggetto_ruolo_id
                        --
                        -- Fix 20260331: E_GENERICO → E_CODICE per lookup fallito
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols()
                        RETURNS trigger
                        LANGUAGE plpgsql
                        AS $function$
                        DECLARE
                            v_utility_col        TEXT;
                            v_soggetto_ruolo_col TEXT;
                            v_utility_txt        TEXT;
                            v_soggetto_ruolo_txt TEXT;
                            v_utility_id         config.utilities.id%TYPE;
                            v_soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE;
                            v_tipo_ruolo_id      config.tipi_ruoli.id%TYPE;
                        BEGIN
                            -- Guard: argomenti trigger
                            IF TG_NARGS <> 2 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                                    'ERRORE_PARAMETRI',
                                    jsonb_build_object(
                                        'detail', 'Sono richiesti 2 argomenti trigger: utility_col, soggetto_ruolo_col',
                                        'tg_nargs', TG_NARGS,
                                        'trigger', TG_NAME
                                    ),
                                    NULL::uuid,
                                    concat('Argomenti trigger non validi per ', TG_NAME, ': TG_NARGS=', TG_NARGS::text)
                                );
                            END IF;

                            v_utility_col := TG_ARGV[0];
                            v_soggetto_ruolo_col := TG_ARGV[1];

                            -- Estrai valori dal record NEW via jsonb
                            v_utility_txt := to_jsonb(NEW) ->> v_utility_col;
                            v_soggetto_ruolo_txt := to_jsonb(NEW) ->> v_soggetto_ruolo_col;

                            -- Se i valori non sono presenti non forziamo il controllo
                            IF v_utility_txt IS NULL OR v_soggetto_ruolo_txt IS NULL THEN
                                RETURN NEW;
                            END IF;

                            -- Cast a tipi numerici
                            BEGIN
                                v_utility_id := v_utility_txt::integer;
                                v_soggetto_ruolo_id := v_soggetto_ruolo_txt::bigint;
                            EXCEPTION
                                WHEN OTHERS THEN
                                    PERFORM script.fn_log_and_raise_error(
                                        'database',
                                        'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                                        'ERRORE_PARAMETRI',
                                        jsonb_build_object(
                                            'detail', 'Valori colonna non castabili a ID',
                                            'utility_col', v_utility_col,
                                            'utility_value', v_utility_txt,
                                            'soggetto_ruolo_col', v_soggetto_ruolo_col,
                                            'soggetto_ruolo_value', v_soggetto_ruolo_txt
                                        ),
                                        NULL::uuid,
                                        concat(
                                            'Valori non validi per guard utility/tipo_ruolo: ',
                                            v_utility_col, '=', coalesce(v_utility_txt, 'NULL'),
                                            ', ',
                                            v_soggetto_ruolo_col, '=', coalesce(v_soggetto_ruolo_txt, 'NULL')
                                        )
                                    );
                            END;

                            -- Recupera tipo_ruolo_id dal soggetto_ruolo
                            SELECT sr.tipo_ruolo_id
                              INTO v_tipo_ruolo_id
                              FROM anagrafiche.soggetti_ruoli sr
                             WHERE sr.id = v_soggetto_ruolo_id;

                            IF v_tipo_ruolo_id IS NULL THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'script.trgfn_guard_utility_tipo_ruolo_by_cols',
                                    'E_CODICE',
                                    jsonb_build_object(
                                        'soggetto_ruolo_id', v_soggetto_ruolo_id,
                                        'table', concat(TG_TABLE_SCHEMA, '.', TG_TABLE_NAME)
                                    ),
                                    NULL::uuid,
                                    v_soggetto_ruolo_id::text, 'anagrafiche.soggetti_ruoli'
                                );
                            END IF;

                            -- Delega validazione utility ↔ tipo_ruolo
                            PERFORM script.fn_guard_utility_tipo_ruolo(
                                p_utility_id    => v_utility_id,
                                p_tipo_ruolo_id => v_tipo_ruolo_id,
                                p_context       => concat(TG_TABLE_SCHEMA, '.', TG_TABLE_NAME, ' ', TG_OP)
                            );

                            RETURN NEW;
                        END;
                        $function$;

                        COMMENT ON FUNCTION script.trgfn_guard_utility_tipo_ruolo_by_cols()
                          IS 'Trigger guard generico utility→tipo_ruolo: legge utility/soggetto_ruolo da TG_ARGV e valida con fn_guard_utility_tipo_ruolo.';

    - changeSet:
          id: 20260331-03-fix-fn-get-search-detail
          author: mctit
          runOnChange: false
          comment: >
              Fix fn_get_search_detail: E_GENERICO → E_CODICE
              per lookup tipo_ruolo_id fallito su config.tipi_ruoli.
          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |
                        -- ==========================================================
                        -- fn_get_search_detail
                        --
                        -- Scopo: dettaglio soggetto per tipo ruolo (livello 2
                        --        ricerca universale). Ritorna JSONB con righe
                        --        specifiche per tipo ruolo (CL, FO, altri).
                        --
                        -- Regole:
                        --   - p_soggetto_id, p_tipo_ruolo_id obbligatori
                        --   - CL: istanza+utility+billing+stato+indirizzo+date+filtro emittente
                        --   - FO: codice+stato_fornitore+indirizzo SEDEOP (JOIN config.stati_fornitore)
                        --   - ELSE: entita_detail via fn_get_entita_ruolo_detail + indirizzo RES
                        --
                        -- Fix 20260331: E_GENERICO → E_CODICE per lookup tipo_ruolo fallito
                        -- ==========================================================
                        CREATE OR REPLACE FUNCTION script.fn_get_search_detail(
                            p_soggetto_id   anagrafiche.soggetti.id%TYPE,
                            p_tipo_ruolo_id config.tipi_ruoli.id%TYPE,
                            p_utility_id    config.utilities.id%TYPE       DEFAULT NULL,
                            p_emittente_ids BIGINT[]                       DEFAULT NULL
                        )
                        RETURNS jsonb
                        LANGUAGE plpgsql
                        STABLE PARALLEL SAFE
                        AS $function$
                        DECLARE
                            v_tipo_ruolo_codice  config.tipi_ruoli.codice_interno%TYPE;
                            v_result             jsonb;
                        BEGIN
                            -- Guard: soggetto obbligatorio
                            IF p_soggetto_id IS NULL THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'script.fn_get_search_detail',
                                    'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object(
                                        'parametro', 'p_soggetto_id',
                                        'valore', NULL
                                    ),
                                    NULL::uuid,
                                    'p_soggetto_id obbligatorio'
                                );
                            END IF;

                            -- Guard: tipo ruolo obbligatorio e valido
                            IF p_tipo_ruolo_id IS NULL OR p_tipo_ruolo_id <= 0 THEN
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'script.fn_get_search_detail',
                                    'E_PARAMETRO_INVALIDO',
                                    jsonb_build_object(
                                        'parametro', 'p_tipo_ruolo_id',
                                        'valore', p_tipo_ruolo_id
                                    ),
                                    NULL::uuid,
                                    'p_tipo_ruolo_id obbligatorio e > 0'
                                );
                            END IF;

                            -- Recupera codice_interno del tipo ruolo
                            SELECT tr.codice_interno INTO v_tipo_ruolo_codice
                              FROM config.tipi_ruoli tr
                             WHERE tr.id = p_tipo_ruolo_id;

                            IF v_tipo_ruolo_codice IS NULL THEN
                                -- Fix: E_GENERICO → E_CODICE
                                PERFORM script.fn_log_and_raise_error(
                                    'database',
                                    'script.fn_get_search_detail',
                                    'E_CODICE',
                                    jsonb_build_object('p_tipo_ruolo_id', p_tipo_ruolo_id),
                                    NULL::uuid,
                                    p_tipo_ruolo_id::text, 'config.tipi_ruoli'
                                );
                            END IF;

                            -- Costruisci dettaglio in base al codice_interno del tipo ruolo
                            -- (codice_interno e' immutabile, protetto da trgfn_lock_columns)
                            CASE v_tipo_ruolo_codice

                            WHEN 'CL' THEN
                                -- Righe cliente: per ogni cliente del soggetto_ruolo,
                                -- istanza_utility + indirizzo + dati entita'.
                                -- Indirizzo: da istanza_utility se presente, fallback fn_get_indirizzo RES.
                                -- Filtro scope emittente: se p_emittente_ids IS NOT NULL,
                                -- mostra solo clienti il cui billing_account e' collegato
                                -- a un emittente autorizzato via emittenti_fiscali_billing_account.
                                SELECT jsonb_build_object(
                                    'tipo_ruolo', v_tipo_ruolo_codice,
                                    'righe', COALESCE(jsonb_agg(row_detail ORDER BY row_detail->>'utility_codice', row_detail->>'stato_descrizione'), '[]'::jsonb)
                                ) INTO v_result
                                FROM (
                                    SELECT jsonb_build_object(
                                        'cliente_id',          cl.id,
                                        'soggetto_ruolo_id',   cl.soggetto_ruolo_id,
                                        'codice',              ba.codice,
                                        'istanza_codice',      iu.codice,
                                        'istanza_id',          iu.id,
                                        'utility_id',          u.id,
                                        'utility_codice',      u.codice_interno,
                                        'utility_descrizione', u.descrizione,
                                        'stato_cliente_id',    sc.id,
                                        'stato_codice',        sc.codice_interno,
                                        'stato_descrizione',   sc.descrizione_breve,
                                        'stato_macro',         sc.codice,
                                        'indirizzo',           COALESCE(
                                                                 idv.indirizzo_normalizzato,
                                                                 fb_ind.indirizzo_completo,
                                                                 ''
                                                               ),
                                        'comune',              COALESCE(
                                                                 idv.descrizione_comune,
                                                                 fb_ind.comune_descrizione,
                                                                 ''
                                                               ),
                                        'data_attivazione',    cl.data_attivazione,
                                        'data_sospensione',    cl.data_sospensione,
                                        'data_riattivazione',  cl.data_riattivazione,
                                        'data_chiusura',       cl.data_chiusura
                                    ) AS row_detail
                                    FROM anagrafiche.soggetti_ruoli sr
                                        JOIN anagrafiche.clienti cl
                                          ON cl.soggetto_ruolo_id = sr.id
                                        JOIN config.stati_cliente sc
                                          ON sc.id = cl.stato_cliente_id
                                        LEFT JOIN anagrafiche.billing_account ba
                                          ON ba.id = cl.billing_account_id
                                        LEFT JOIN anagrafiche.istanze_utilities iu
                                          ON iu.id = cl.istanza_utility_id
                                        LEFT JOIN config.utilities u
                                          ON u.id = cl.utility_id
                                        LEFT JOIN anagrafiche.vw_indirizzi_dettaglio idv
                                          ON idv.indirizzo_dettaglio_id = iu.indirizzo_dettaglio_id
                                        -- Fallback indirizzo: fn_get_indirizzo(RES) con policy master/fallback
                                        LEFT JOIN LATERAL (
                                            SELECT gi.indirizzo_completo, gi.comune_descrizione
                                              FROM script.fn_get_indirizzo(sr.id, 'RES') gi
                                             LIMIT 1
                                        ) fb_ind ON iu.indirizzo_dettaglio_id IS NULL
                                    WHERE sr.soggetto_id = p_soggetto_id
                                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                                      AND (p_utility_id IS NULL OR cl.utility_id = p_utility_id)
                                      -- Filtro scope emittente
                                      AND (p_emittente_ids IS NULL OR EXISTS (
                                          SELECT 1
                                            FROM anagrafiche.emittenti_fiscali_billing_account efba
                                           WHERE efba.billing_account_id = cl.billing_account_id
                                             AND efba.emittente_soggetto_ruolo_id = ANY(p_emittente_ids)
                                      ))
                                ) sub;

                            WHEN 'FO' THEN
                                -- Righe fornitore: stato da config.stati_fornitore + indirizzo sede operativa.
                                SELECT jsonb_build_object(
                                    'tipo_ruolo', v_tipo_ruolo_codice,
                                    'righe', COALESCE(jsonb_agg(row_detail), '[]'::jsonb)
                                ) INTO v_result
                                FROM (
                                    SELECT jsonb_build_object(
                                        'fornitore_id',        f.id,
                                        'soggetto_ruolo_id',   f.soggetto_ruolo_id,
                                        'codice',              f.codice,
                                        'attivo',              f.attivo,
                                        'stato_fornitore_id',  sf.id,
                                        'stato_codice',        sf.codice_interno,
                                        'stato_descrizione',   sf.descrizione_breve,
                                        'stato_macro',         sf.codice,
                                        'blocca_ordini',       sf.blocca_ordini,
                                        'indirizzo',           COALESCE(fb_ind.indirizzo_completo, ''),
                                        'comune',              COALESCE(fb_ind.comune_descrizione, '')
                                    ) AS row_detail
                                    FROM anagrafiche.soggetti_ruoli sr
                                        JOIN anagrafiche.fornitori f
                                          ON f.soggetto_ruolo_id = sr.id
                                        JOIN config.stati_fornitore sf
                                          ON sf.id = f.stato_fornitore_id
                                        LEFT JOIN LATERAL (
                                            SELECT gi.indirizzo_completo, gi.comune_descrizione
                                              FROM script.fn_get_indirizzo(sr.id, 'SEDEOP') gi
                                             LIMIT 1
                                        ) fb_ind ON true
                                    WHERE sr.soggetto_id = p_soggetto_id
                                      AND sr.tipo_ruolo_id = p_tipo_ruolo_id
                                ) sub;

                            ELSE
                                -- Qualsiasi altro tipo ruolo: entita_detail + indirizzo residenza.
                                SELECT jsonb_build_object(
                                    'tipo_ruolo', v_tipo_ruolo_codice,
                                    'entita_detail', script.fn_get_entita_ruolo_detail(sr.id, p_utility_id),
                                    'righe', jsonb_build_array(
                                        jsonb_build_object(
                                            'soggetto_ruolo_id', sr.id,
                                            'soggetto_id',       sr.soggetto_id,
                                            'indirizzo',         COALESCE(fb_ind.indirizzo_completo, ''),
                                            'comune',            COALESCE(fb_ind.comune_descrizione, '')
                                        )
                                    )
                                ) INTO v_result
                                FROM anagrafiche.soggetti_ruoli sr
                                    LEFT JOIN LATERAL (
                                        SELECT gi.indirizzo_completo, gi.comune_descrizione
                                          FROM script.fn_get_indirizzo(sr.id, 'RES') gi
                                         LIMIT 1
                                    ) fb_ind ON true
                                WHERE sr.soggetto_id = p_soggetto_id
                                  AND sr.tipo_ruolo_id = p_tipo_ruolo_id;

                            END CASE;

                            RETURN COALESCE(v_result, jsonb_build_object('tipo_ruolo', v_tipo_ruolo_codice, 'righe', '[]'::jsonb));
                        END;
                        $function$;

                        COMMENT ON FUNCTION script.fn_get_search_detail(uuid, integer, integer, bigint[])
                          IS 'Dettaglio soggetto per tipo ruolo (livello 2 ricerca universale). CL: istanza+utility+billing+stato+indirizzo+date+filtro emittente. FO: codice+stato_fornitore(config.stati_fornitore)+indirizzo SEDEOP. ELSE: entita_detail+indirizzo RES.';