databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260308-07-create-fn-get-emittenti-scope-sr-ids-mctit.yaml

  - changeSet:
      id: 20260308-07-create-fn-get-emittenti-scope-sr-ids
      author: mctit
      comment: "Sposta fn_get_emittenti_scope_sr_ids da config a script (schema corretto per funzioni riusabili cross-dominio)"
      runOnChange: false
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_emittenti_scope_sr_ids(
                p_auth_user_id anagrafiche.risorse_umane_auth_user.auth_user_id%TYPE
              )
              RETURNS bigint[]
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                v_ruolo anagrafiche.risorse_umane_auth_user.ruolo_sistema%TYPE;
                v_ids   bigint[];
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Restituisce i soggetto_ruolo_id degli emittenti fiscali
                --   autorizzati per un utente. Le tabelle vendite usano
                --   emittente_soggetto_ruolo_id (FK a soggetti_ruoli),
                --   non emittente_fiscale_id, quindi serve questa mappatura.
                --
                -- Semantica:
                --   NULL             = nessuna restrizione (vede tutto)
                --   '{}'::bigint[]   = nessun accesso (0 righe match)
                --   array di ID      = limitato a quegli emittenti
                -- =========================================================

                -- 1. Ruolo sistema
                v_ruolo := script.fn_get_ruolo_sistema(p_auth_user_id);

                IF v_ruolo IS NULL OR v_ruolo = 'DISABILITATO' THEN
                  RETURN '{}'::bigint[];  -- nessun accesso
                END IF;

                IF v_ruolo = 'ADMIN' THEN
                  RETURN NULL;  -- nessuna restrizione
                END IF;

                -- 2. OPERATIVO: mappa whitelist a soggetto_ruolo_id
                SELECT array_agg(ef.soggetto_ruolo_id)
                  INTO v_ids
                  FROM config.user_emittenti_fiscali uef
                  JOIN anagrafiche.emittenti_fiscali ef
                    ON ef.id = uef.emittente_fiscale_id
                 WHERE uef.auth_user_id = p_auth_user_id;

                -- NULL (whitelist vuota) = nessuna restrizione
                -- array = limitato
                RETURN v_ids;
              END
              $$;

              COMMENT ON FUNCTION script.fn_get_emittenti_scope_sr_ids(integer)
                IS 'Mappa emittenti autorizzati a soggetto_ruolo_id per query vendite (NULL = nessuna restrizione).';
