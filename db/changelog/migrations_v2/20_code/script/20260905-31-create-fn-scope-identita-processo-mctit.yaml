# ⭐ «QUESTA SESSIONE E' L'IDENTITA' TECNICA DI QUEL PROCESSO?» — una scrittura
#   sola. Serve alla policy che dara' a una macchina il diritto di leggere le
#   email di sistema.
#
# ── ⚠️ IL CONSUMATORE E' CAMBIATO LO STESSO GIORNO ─────────────────
#   Nasce per `rls_email_outbox_ambito` (`20260905-32`), da cui il ramo e' stato
#   RITIRATO poche ore dopo (`20260905-33`): era sulla tabella sbagliata —
#   `send_pending_emails` legge `config.email_log`, e l'outbox non la apre mai.
#   ⇒ La funzione **resta**, e non e' codice morto: e' il predicato che la policy
#   di `config.email_log` usera', ed e' collaudata direttamente da
#   `db/pgtap/script/test-fn-scope-identita-processo.sql`.
#   ⭐ La differenza che conta: cio' che non si poteva collaudare era il RAMO
#   dentro una policy che nessun codice raggiunge — non questa funzione, che un
#   test esercita per davvero, livello per livello.
#
# ── ⛔ PERCHE' NASCE: DUE COPIE DELLA STESSA REGOLA ─────────────────
#   La prima stesura della policy portava lo stesso `EXISTS` di dieci righe due
#   volte, in `USING` e in `WITH CHECK`. ⚠️ La famiglia duplica anche altrove —
#   ma li' e' **una chiamata**, e due chiamate identiche non possono divergere.
#   Dieci righe si'.
#   ⇒ Il giorno in cui si aggiunge una condizione a una sola delle due, la
#     lettura e la scrittura rispondono in modo diverso alla stessa domanda, e
#     nessun errore lo dice: si scopre da un permesso che c'era e non c'e' piu'.
#
# ── ⭐ E LA REGOLA E' PIU' STRETTA DI QUELLA CHE SOSTITUISCE ────────
#   L'`EXISTS` guardava **un solo livello**: `dbops.processi_identita.attivo`.
#   ⛔ Non basta, ed e' la lezione gia' pagata dal roster: un'identita' puo'
#   essere spenta a un livello e viva a un altro.
#     pi.attivo          il legame processo-utente non e' stato spento
#     pr.attivo          il processo e' vivo e non obsoleto
#     idg.attivo         l'identita' applicativa e' viva
#     ruolo OPERATORE    e' la veste che le policy riconoscono
#     au.is_active       l'utente Django non e' stato revocato
#   ⇒ Un'identita' **revocata** avrebbe continuato a leggere i reset password
#     finche' qualcuno non toccava anche il legame. Adesso no.
#   ⚠️ **Non c'e' l'emittente**, e non e' una dimenticanza: qui si chiede *«chi
#   sei»*, non *«su quale azienda lavori». Il perimetro emittente lo dice
#   `dbops.vw_processi_roster`, che e' un'altra domanda — e legarli qui
#   toglierebbe la lettura delle email di SISTEMA, che di azienda non ne hanno.
#
# ── ⚠️ `LANGUAGE sql` E NON plpgsql ────────────────────────────────
#   Una policy si valuta **per riga**. Una funzione `sql` `STABLE` il
#   pianificatore la puo' incorporare; una plpgsql no. Stessa forma di
#   `script.fn_scope_ef_whitelist_via_listino`.
#
# ── ⛔ NIENTE `STRICT` ──────────────────────────────────────────────
#   Con un parametro NULL l'`EXISTS` non trova niente e la funzione torna
#   **false**: fail-closed per costruzione. `STRICT` tornerebbe NULL, che in una
#   `USING` si comporta come false ma per un'altra ragione — e sarebbe una
#   coincidenza, non una difesa.
#
# ── ⚠️ `django.*` SI ATTRAVERSA DA UNA FUNZIONE, MAI DA UNA VISTA ──
#   L'utente Django si legge da `script.fn_get_auth_user_stato` (plpgsql, quindi
#   late-bound): e' la regola presa il 2026-09-05 col `20260905-30`, dopo che un
#   `JOIN django.auth_user` dentro una vista ha fermato il migrate da zero.
#
# Verifica: db/pgtap/rls/test-rls-email-outbox-ambito.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260905-31-create-fn-scope-identita-processo-mctit.yaml

  - changeSet:
      id: 20260905-31-create-fn-scope-identita-processo
      author: mctit
      failOnError: true
      comment: >
        script.fn_scope_identita_processo(auth_user_id, processo_codice): dice se
        la sessione corrente e' l'identita' tecnica VIVA di quel processo,
        guardando tutti e cinque i livelli invece del solo legame. Nasce per
        togliere le due copie dello stesso EXISTS dalla policy
        rls_email_outbox_ambito, e per stringerne la regola.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: dbops, tableName: processi_identita }
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                   JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_get_auth_user_stato'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_identita_processo(
                  p_auth_user_id    integer,
                  p_processo_codice dbops.processi.codice%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- =====================================================
                  -- Scopo:
                  --   «Questa sessione e' l'identita' tecnica VIVA del
                  --   processo indicato?» Una domanda sola, scritta una
                  --   volta sola, usata da chi deve decidere se una
                  --   macchina puo' leggere.
                  --
                  -- ⭐ Cinque livelli, non uno. Il legame attivo da solo
                  --   lascerebbe leggere un'identita' REVOCATA: basta che
                  --   nessuno abbia toccato anche `processi_identita`.
                  -- ⚠️ L'emittente NON entra: qui si chiede «chi sei», non
                  --   «su quale azienda lavori» — quello lo dice
                  --   dbops.vw_processi_roster.
                  -- =====================================================
                  SELECT EXISTS (
                      SELECT 1
                        FROM dbops.processi_identita pi
                        JOIN dbops.processi pr
                          ON pr.id = pi.processo_id
                         AND pr.attivo
                         AND pr.obsoleto_dal IS NULL
                        JOIN anagrafiche.identita_digitali idg
                          ON idg.auth_user_id = pi.auth_user_id
                         AND idg.attivo
                         AND idg.ruolo_applicativo
                             = 'OPERATORE'::config.ruolo_applicativo
                        -- ⚠️ django.* si attraversa da una funzione, mai da
                        --   una vista: zero righe se l'utente non c'e' piu',
                        --   che in un join fa sparire la riga (fail-closed).
                        JOIN LATERAL script.fn_get_auth_user_stato(pi.auth_user_id) au
                          ON au.is_active
                       WHERE pi.attivo
                         AND pi.auth_user_id    = p_auth_user_id
                         AND pr.codice          = p_processo_codice
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_identita_processo(integer, text)
              IS 'Dice se p_auth_user_id e'' l''identita'' tecnica VIVA del processo p_processo_codice. ⭐ Nasce il 2026-09-05 per togliere due copie dello stesso EXISTS dalla policy rls_email_outbox_ambito (USING e WITH CHECK): la famiglia duplica anche altrove, ma li'' e'' UNA CHIAMATA, e due chiamate identiche non possono divergere — dieci righe si''. ⭐ E la regola e'' piu'' stretta di quella che sostituisce: guarda CINQUE livelli (legame attivo, processo vivo, identita'' attiva, ruolo OPERATORE, utente Django attivo) invece del solo legame, perche'' un''identita'' revocata a un livello solo avrebbe continuato a leggere. ⚠️ L''emittente non entra: qui si chiede «chi sei», non «su quale azienda lavori» — quello e'' dbops.vw_processi_roster, e legarli toglierebbe la lettura delle email di SISTEMA, che di azienda non ne hanno. ⚠️ LANGUAGE sql STABLE perche'' una policy si valuta per riga e il pianificatore la puo'' incorporare. ⛔ Niente STRICT: con un parametro NULL l''EXISTS non trova niente e la funzione torna false — fail-closed per costruzione, non per coincidenza. ⚠️ django.* si attraversa da script.fn_get_auth_user_stato (plpgsql, late-bound), mai da una vista: regola presa col changeSet 20260905-30.';

              DO $grant$
              BEGIN
                  IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles
                              WHERE rolname = 'zeroerp_app') THEN
                      GRANT EXECUTE ON FUNCTION
                          script.fn_scope_identita_processo(integer, text)
                          TO zeroerp_app;
                  ELSE
                      RAISE NOTICE 'ruolo zeroerp_app assente: GRANT saltato';
                  END IF;
              END
              $grant$;
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_scope_identita_processo(integer, text);
