# script.fn_articolo_riga_contesto: per la distinta (ARTICOLO) il padre deve essere
#   composito, altrimenti E_ARTICOLO_NON_COMPOSITO (Q5).
#   Brief: brief-db-revisione-catalogo, giro 1.
#
#   Prima lo diceva solo catalogo.trgfn_articoli_componenti_guard_is_composito,
#   montato su INSERT e su UPDATE OF prodotto_id: la riattivazione di un legame, o
#   la sua riapertura, non ripassavano dal controllo. Ora la regola sta nel lato
#   documento della check condivisa, che il guard del legame
#   (catalogo.trgfn_articoli_componenti_guard_componente, -65) chiama a ogni
#   composizione nuova; il guard di prima si ritira in -67. La testata della
#   distinta e' l'articolo padre: un padre che non e' composito non ha una distinta,
#   e il controllo e' del documento, non del singolo componente (come
#   E_PARAMETRO_INVALIDO per il padre mancante). Il picker
#   catalogo.fn_articoli_ammessi su un padre non composito solleva lo stesso
#   codice invece di proporre una lista vuota.
#   Il padre «solo componente» non e' un caso a parte: con il CHECK di 90_end -71
#   un solo componente non e' composito.
#   COMMENT riscritto secondo linee-guida-sql §5d.
#   Corpo di partenza da pg_get_functiondef su dbdev (2026-11-09); rollback = corpo
#   e COMMENT di prima.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261110-64-update-fn-articolo-riga-contesto-padre-composito-mctit.yaml

  - changeSet:
      id: 20261110-64-update-fn-articolo-riga-contesto-padre-composito
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_articolo_riga_contesto: la testata della distinta e' un composito, sede unica di E_ARTICOLO_NON_COMPOSITO. Brief: brief-db-revisione-catalogo, giro 1.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc
               WHERE oid = to_regprocedure('script.fn_articolo_riga_contesto(text, bigint, vendite.tipo_eccezione_contratto, uuid)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_articolo_riga_contesto(
                  p_documento         config.tipi_entita.codice%TYPE,
                  p_documento_id      bigint,
                  p_tipo_eccezione    vendite.tipo_eccezione_contratto DEFAULT NULL,
                  p_articolo_padre_id catalogo.articoli.id%TYPE DEFAULT NULL)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$


              DECLARE
                  v_contesto     jsonb;
                  v_listino_id   vendite.listini.id%TYPE;
                  v_versione_id  vendite.listini_versioni.id%TYPE;
                  v_etichetta    text;
                  v_tip_listino  vendite.listini.tipologia_id%TYPE;
                  v_padre_codice catalogo.articoli.codice%TYPE;
                  v_padre_iva    catalogo.articoli.iva_id%TYPE;
                  v_padre_comp   catalogo.articoli.is_composito%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Il lato DOCUMENTO di script.fn_check_articolo_riga: cio'
                  --   che i motivi leggono e che non dipende dall'articolo,
                  --   letto una volta. Valida i parametri e, per la distinta,
                  --   che il padre sia composito.
                  -- Ritorna: il contesto (jsonb) che riceve
                  --   script.fn_check_articolo_riga_su_contesto.
                  -- =========================================================
                  IF p_documento IS NULL
                     OR p_documento NOT IN ('PREVENTIVO', 'ORDINE_VENDITA', 'DDT_VENDITA',
                                            'OFFERTA_COMMERCIALE', 'CONTRATTO',
                                            'LISTINO_VERSIONE', 'ARTICOLO',
                                            'PROMO_ARTICOLO') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'script.fn_articolo_riga_contesto',
                          'E_DOC_TIPO_NON_GESTITO',
                          jsonb_build_object('documento', p_documento),
                          NULL::uuid,
                          COALESCE(p_documento, '<null>'));
                  END IF;

                  -- Offerta e contratto: la riga e' un'eccezione al listino, e il
                  -- tipo d'eccezione decide le regole.
                  IF p_tipo_eccezione IS NULL
                     AND p_documento IN ('OFFERTA_COMMERCIALE', 'CONTRATTO') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'vendite',
                          'script.fn_articolo_riga_contesto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_tipo_eccezione', 'documento', p_documento),
                          NULL::uuid,
                          'p_tipo_eccezione obbligatorio per ' || p_documento);
                  END IF;

                  -- La distinta: la «testata» e' l'articolo padre (uuid), non un id di documento.
                  IF p_articolo_padre_id IS NULL AND p_documento = 'ARTICOLO' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'catalogo',
                          'script.fn_articolo_riga_contesto',
                          'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_articolo_padre_id', 'documento', p_documento),
                          NULL::uuid,
                          'p_articolo_padre_id obbligatorio per ARTICOLO (la distinta)');
                  END IF;

                  v_contesto := jsonb_build_object(
                      'documento',         p_documento,
                      'documento_id',      p_documento_id,
                      'tipo_eccezione',    p_tipo_eccezione,
                      'articolo_padre_id', p_articolo_padre_id);

                  -- Versione di listino: la tipologia del suo listino.
                  IF p_documento = 'LISTINO_VERSIONE' THEN
                      SELECT l.tipologia_id INTO v_tip_listino
                        FROM vendite.listini_versioni lv
                        JOIN vendite.listini l ON l.id = lv.listino_id
                       WHERE lv.id = p_documento_id;

                      RETURN v_contesto || jsonb_build_object('listino_tipologia_id', v_tip_listino);
                  END IF;

                  -- Distinta: il padre. La «testata» della distinta e' un articolo
                  -- composito: un padre che non lo e' (o che non esiste) non ha una
                  -- distinta, e nessun componente ci puo' stare.
                  IF p_documento = 'ARTICOLO' THEN
                      SELECT a.codice, a.iva_id, a.is_composito
                        INTO v_padre_codice, v_padre_iva, v_padre_comp
                        FROM catalogo.articoli a
                       WHERE a.id = p_articolo_padre_id;

                      IF v_padre_comp IS NOT TRUE THEN
                          PERFORM script.fn_log_and_raise_error(
                              'catalogo',
                              'script.fn_articolo_riga_contesto',
                              'E_ARTICOLO_NON_COMPOSITO',
                              jsonb_build_object(
                                  'campo',       'prodotto_id',
                                  'prodotto_id', p_articolo_padre_id,
                                  'bersaglio',   jsonb_build_array(
                                      jsonb_build_object('tipo', 'ARTICOLO', 'id', p_articolo_padre_id::text))),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]);
                      END IF;

                      RETURN v_contesto || jsonb_build_object(
                          'padre_codice',   v_padre_codice,
                          'padre_iva_id',   v_padre_iva,
                          'padre_aliquota', (SELECT i.aliquota_iva::text FROM config.iva i
                                              WHERE i.id = v_padre_iva));
                  END IF;

                  -- Offerta e contratto: il listino operativo e la sua versione
                  -- ESPANSA, una volta.
                  IF p_documento IN ('OFFERTA_COMMERCIALE', 'CONTRATTO') THEN
                      SELECT lo.listino_id, lo.listino_versione_id
                        INTO v_listino_id, v_versione_id
                        FROM vendite.fn_documento_listino_operativo(p_documento, p_documento_id) lo;

                      SELECT t.etichetta INTO v_etichetta
                        FROM script.fn_get_stato_testata_documento(p_documento, p_documento_id) t;
                      v_etichetta := COALESCE(v_etichetta, initcap(replace(lower(p_documento), '_', ' ')) || ' #' || p_documento_id::text);

                      -- «Nel listino» = una riga della versione espansa: standalone
                      -- E bundle (il bundle sta nel listino coi suoi componenti, non
                      -- in listini_righe). La stessa base su cui il drawer applica
                      -- OVERRIDE ed ESCLUSIONE (vendite.fn_documento_righe_preview).
                      RETURN v_contesto || jsonb_build_object(
                          'listino_id',          v_listino_id,
                          'listino_versione_id', v_versione_id,
                          'etichetta',           v_etichetta,
                          'articoli_listino',    COALESCE(
                              (SELECT jsonb_agg(DISTINCT b.articolo_id)
                                 FROM vendite.fn_espandi_listino_versione(v_versione_id, NULL, NULL) b),
                              jsonb_build_array()));
                  END IF;

                  -- Preventivo, ordine, bolla, promo: i motivi non leggono il documento.
                  RETURN v_contesto;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_articolo_riga_contesto(config.tipi_entita.codice%TYPE, bigint, vendite.tipo_eccezione_contratto, catalogo.articoli.id%TYPE) IS
                  'Il lato DOCUMENTO di script.fn_check_articolo_riga, letto una volta: valida i parametri e restituisce il contesto jsonb che riceve script.fn_check_articolo_riga_su_contesto (mai costruito a mano). p_documento e'' uno fra PREVENTIVO | ORDINE_VENDITA | DDT_VENDITA | OFFERTA_COMMERCIALE | CONTRATTO | LISTINO_VERSIONE | ARTICOLO | PROMO_ARTICOLO, altrimenti E_DOC_TIPO_NON_GESTITO; p_tipo_eccezione e'' obbligatorio per offerta e contratto, p_articolo_padre_id per ARTICOLO, altrimenti E_PARAMETRO_INVALIDO. ARTICOLO e'' la distinta: la sua testata e'' il padre, che deve esistere ed essere composito, altrimenti E_ARTICOLO_NON_COMPOSITO (campo prodotto_id, bersaglio l''articolo padre): e'' la sede unica della regola «solo un composito ha una distinta». Il contesto porta sempre documento, documento_id, tipo_eccezione, articolo_padre_id; in piu'' LISTINO_VERSIONE: listino_tipologia_id; ARTICOLO: padre_codice, padre_iva_id, padre_aliquota; OFFERTA_COMMERCIALE e CONTRATTO: listino_id, listino_versione_id, etichetta, articoli_listino (gli articolo_id della versione espansa da vendite.fn_espandi_listino_versione, standalone e bundle; [] senza versione). documento_id non e'' obbligatorio: preventivo, ordine, bolla e promo non leggono il documento. Esiste perche'' il picker catalogo.fn_articoli_ammessi giudica molti articoli sullo stesso documento e legge il documento una volta. SECURITY INVOKER, sotto RLS: un documento che l''operatore non vede da'' un contesto senza listino.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
