# Building block: i soli prezzi IN ATTESA di un documento — la domanda che
#   decide se se ne puo' creare una REVISIONE.
#
# ── ⛔ IL DIFETTO ────────────────────────────────────────────────────
#   fn_crea_revisione_preventivo e fn_crea_revisione_offerta ricopiano sulla
#   revisione nuova stato e pratica di approvazione, 1:1 (20260914-14,
#   20260601-05: «prezzo fuori policy sempre marcato»). Una riga IN ATTESA
#   ricopiata resta legata alla pratica della revisione vecchia: l'esito arriva
#   sulla riga vecchia, e sulla nuova l'attesa non finisce piu'. Il guard per
#   riga ne vieta la modifica, e dal 20260924-21 il documento non si emette
#   nemmeno: resta solo l'annullamento.
#
# ── ⭐ LA DECISIONE (Tid, 2026-09-24, brief §10) ─────────────────────
#   1. Non si crea una revisione se il documento ha righe o componenti
#      attivi IN ATTESA. Il caso sopra non puo' piu' nascere.
#   2. La copia dello stato RESTA per approvato e rifiutato: azzerarla farebbe
#      nascere la revisione con lo stesso prezzo e senza marca, e un prezzo
#      rifiutato passerebbe (contro D-1).
#
# ── ⭐ LA FORMA ──────────────────────────────────────────────────────
#   Un filtro sul building block script.fn_check_prezzi_autorizzati
#   (20260924-20): il predicato resta la', qui si sceglie il SOLO motivo
#   E_DOC_PREZZO_PENDENTE. Quattro consumatori (le due madri della revisione e
#   le due capability): scritto una volta, non quattro.
#   ⚠️ Il rifiutato NON blocca la revisione, ed e' voluto: si ricopia, e sulla
#   revisione l'operatore lo corregge.
#
# Brief: brief-db-preventivi-congelamento-pricing.md (§10)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260924-33-create-fn-check-prezzi-in-attesa-mctit.yaml

  - changeSet:
      id: 20260924-33-create-fn-check-prezzi-in-attesa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_prezzi_in_attesa(regclass, bigint): il solo motivo dei
        prezzi IN ATTESA (E_DOC_PREZZO_PENDENTE) dal building block
        fn_check_prezzi_autorizzati. Decide se si puo' creare una revisione.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_prezzi_in_attesa(
                  -- ⚠️ Tipi ESPLICITI, come nel building block di cui e' un
                  --   filtro: la testata e' un nome di tabella (regclass), e
                  --   l'id e' la chiave di tabelle diverse.
                  p_testata      regclass,
                  p_documento_id bigint
              )
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              -- Scopo: dei motivi di script.fn_check_prezzi_autorizzati, il SOLO
              --   prezzo in attesa di approvazione. Chi lo chiede: la creazione di
              --   una revisione (preventivo e offerta), nella madre che la crea e nel
              --   pulsante che la propone.
              -- ⚠️ plpgsql e non un corpo SQL `RETURN`: e' la forma di tutti gli altri
              --   changeSet, quella che dbops/test-riferimenti-morti-v1 compila, e il
              --   driver la spezza senza sorprese (vedi 20260921-21, BEGIN ATOMIC).
              BEGIN
                  -- ⚠️ `[]` e non NULL quando non c'e' niente: i consumatori sommano
                  --   array e leggono jsonb_array_length.
                  RETURN (
                      SELECT COALESCE(jsonb_agg(m.motivo ORDER BY m.pos), '[]'::jsonb)
                        FROM jsonb_array_elements(
                                 script.fn_check_prezzi_autorizzati(p_testata, p_documento_id))
                             WITH ORDINALITY AS m(motivo, pos)
                       WHERE m.motivo ->> 'codice' = 'E_DOC_PREZZO_PENDENTE');
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_prezzi_in_attesa(regclass, bigint)
              IS 'Building block: dei motivi di script.fn_check_prezzi_autorizzati, il SOLO prezzo in attesa di approvazione (E_DOC_PREZZO_PENDENTE) — [] se non ce ne sono. Decide se di un documento si puo'' creare una REVISIONE: la usano le madri vendite.fn_crea_revisione_preventivo / fn_crea_revisione_offerta (che sollevano il primo motivo) e le capability fn_available_actions_preventivo / fn_available_actions_offerta (che spengono «Crea revisione» col motivo). ⭐ Perche'': le revisioni ricopiano stato e pratica di approvazione 1:1, e una riga in attesa ricopiata restava legata alla pratica della revisione vecchia — in attesa per sempre. Decisione di Tid del 2026-09-24: la revisione non si crea finche'' c''e'' un prezzo in attesa; approvato e rifiutato si ricopiano come prima (azzerarli farebbe passare un prezzo rifiutato). ⚠️ Il rifiutato qui NON conta, ed e'' voluto. Brief: brief-db-preventivi-congelamento-pricing §10.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_prezzi_in_attesa(regclass, bigint);
