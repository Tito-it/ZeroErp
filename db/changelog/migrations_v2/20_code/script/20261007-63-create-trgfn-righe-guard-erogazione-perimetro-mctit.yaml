# script.trgfn_righe_guard_erogazione_perimetro: FUORI PERIMETRO SI RIFIUTA
#   Brief: brief-db-offerta-emissione-ed-erogazione §B.2 (B-R3), §C.5.1, §C.7 (giro B3)
#
#   Solleva il primo motivo di script.fn_check_riga_erogazione (-61), col campo.
#   ⚠️ Sito NUOVO di fn_raise_primo_motivo_se_presente: test-rubinetto-primo-motivo
#   test 5 da 33 a 34 (stesso giro).
#   Ritorno indietro: DROP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-63-create-trgfn-righe-guard-erogazione-perimetro-mctit.yaml

  - changeSet:
      id: 20261007-63-create-trgfn-righe-guard-erogazione-perimetro
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce script.trgfn_righe_guard_erogazione_perimetro: rifiuta una riga di contratto o offerta
        fuori dal perimetro dell'articolo col primo motivo della check.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >-
              SELECT count(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_check_riga_erogazione'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.trgfn_righe_guard_erogazione_perimetro()
              RETURNS trigger
              LANGUAGE plpgsql
              SECURITY INVOKER
              AS $function$
              -- Scopo: rifiutare una riga di contratto o di offerta fuori dal perimetro
              --   dell'articolo (B-R3, B-D4 di Tid del 2026-10-07): solleva il primo
              --   motivo di script.fn_check_riga_erogazione, col suo campo. Il predicato sta
              --   nella check: qui si solleva soltanto (linee-guida-sql §12.5.2).
              -- TG_ARGV[0]: documento (CONTRATTO | OFFERTA); TG_ARGV[1]: colonna del
              --   documento padre (contratto_id | offerta_id).
              -- Montato BEFORE INSERT e BEFORE UPDATE (solo quando cambiano articolo,
              --   erogazione o fonte: le righe gia' scritte restano come sono, B-D6),
              --   WHEN tipo_eccezione <> 'ESCLUSIONE', con un nome che viene DOPO
              --   default_erogazione_da_articolo e default_fonte_qta: giudica la riga
              --   gia' completata.
              DECLARE
                  v_documento   text   := TG_ARGV[0];
                  v_col_padre   text   := TG_ARGV[1];
                  v_documento_id bigint := (to_jsonb(NEW) ->> v_col_padre)::bigint;
                  v_motivi      jsonb;
              BEGIN
                  v_motivi := script.fn_check_riga_erogazione(
                      v_documento, v_documento_id, NEW.articolo_id, NEW.tipo_eccezione,
                      NEW.tipo_erogazione, NEW.fonte_quantita_attesa);

                  PERFORM script.fn_raise_primo_motivo_se_presente(
                      'vendite', TG_NAME::text,
                      v_motivi,
                      v_motivi -> 0 -> 'dettaglio' ->> 'campo',
                      NEW.tx_id,
                      jsonb_build_object('riga_id', NEW.id, v_col_padre, v_documento_id));

                  RETURN NEW;
              END;
              $function$;

              COMMENT ON FUNCTION script.trgfn_righe_guard_erogazione_perimetro()
              IS 'Guard generico (vendite.contratti_righe, vendite.offerte_commerciali_eccezioni): solleva il primo motivo di script.fn_check_riga_erogazione — E_RIGA_TIPOLOGIA_FUORI_UTILITY o E_RIGA_EROGAZIONE_FUORI_PERIMETRO — col campo che il motivo indica (dettaglio.campo). TG_ARGV[0] = documento (CONTRATTO | OFFERTA), TG_ARGV[1] = colonna del padre. Montato BEFORE INSERT e BEFORE UPDATE quando cambiano articolo, erogazione o fonte (le righe già scritte restano come sono, decisione B-D6 di Tid), WHEN tipo_eccezione <> ESCLUSIONE, dopo l''eredità e la fonte di default. Parla prima della FK sul vocabolario, che resta la rete. Nasce il 2026-10-07, brief-db-offerta-emissione-ed-erogazione §C.7 (B3).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.trgfn_righe_guard_erogazione_perimetro();
