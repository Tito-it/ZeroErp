# RICREA LE VISTE DROPPATE DA 20261010-26 (script)
#   Brief: brief-db-character-n-spazi-di-riempimento.md §4 punto 2
#
#   Le due viste di script che leggono sigla e descrizione della provincia, identiche: cambia solo il tipo delle colonne (varchar al posto di character(n)).
#
#   Corpo vivo dal catalogo (pg_get_viewdef con nomi qualificati, letto il
#   2026-10-10), non dagli YAML del 2026-04-02: la catena e' stata riscritta
#   piu' volte da allora. Opzioni (security_invoker) e COMMENT riprodotti dal
#   vivo; GRANT all'applicazione esplicito come nei changeSet sorelle (i
#   privilegi del ruolo batch li da' il provisioning, §11.6).
#   Ordine: le radici prima delle foglie. Gira nella stessa corsa del -26.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261010-28-recreate-vw-indirizzo-completo-e-ita-province-mctit.yaml

  - changeSet:
      id: 20261010-28-recreate-vw-indirizzo-completo-e-ita-province
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Ricrea script.vw_indirizzo_completo, script.vw_ita_province_regioni dopo la conversione character(n) -> varchar
        di 20261010-26. Brief: brief-db-character-n-spazi-di-riempimento.md §4.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              -- script.vw_indirizzo_completo
              CREATE VIEW script.vw_indirizzo_completo AS
               SELECT s.id AS id_stradario,
                  c.id AS id_comune,
                  c.descrizione AS comune,
                  p.sigla AS provincia,
                  cp.codice AS codice_postale,
                  ve.indirizzo_generale,
                  s.geoloc,
                  s.meta,
                  ve.id_via,
                  ve.tipo_toponimo,
                  ve.nome_strada
                 FROM config.stradario s
                   JOIN config.comuni c ON s.comune_id = c.id
                   JOIN config.province p ON c.provincia_id = p.id
                   JOIN config.codici_postali cp ON s.codice_postale_id = cp.id
                   JOIN script.vw_stradario_esteso ve ON s.stradario_generale_id = ve.id_via;

              COMMENT ON VIEW script.vw_indirizzo_completo IS
                'Indirizzo completo: stradario + comune + provincia + CAP + via estesa.';

              GRANT SELECT ON script.vw_indirizzo_completo TO zeroerp_app;

              -- script.vw_ita_province_regioni
              CREATE VIEW script.vw_ita_province_regioni AS
               SELECT p.id AS id_provincia,
                  lpad(p.extra_country ->> 'codice_istat'::text, 3, '0'::text) AS ita_codice_istat_provincia,
                  p.descrizione AS ita_nome_provincia,
                  p.sigla AS ita_sigla_provincia,
                  acc.id AS id_provincia_accisa,
                  acc.descrizione AS ita_provincia_accisa,
                  acc.sigla AS ita_sigla_accisa,
                  r.id AS id_regione,
                  lpad(r.extra_country ->> 'codice_istat'::text, 2, '0'::text) AS ita_codice_istat_regione,
                  r.descrizione AS ita_nome_regione,
                  ((r.extra_country ->> 'mezzogiorno'::text))::character(1) AS ita_mezzogiorno,
                  s.id AS id_stato,
                  s.sigla_stato AS ita_sigla_stato,
                  s.descrizione AS ita_nome_stato,
                  s.extra_country ->> 'codice_istat'::text AS ita_codice_istat_stato,
                  s.extra_country ->> 'codice_catastale'::text AS ita_codice_catastale_stato
                 FROM config.province p
                   LEFT JOIN config.province acc ON acc.id = ((p.extra_country ->> 'provincia_accisa_id'::text)::integer)
                   JOIN config.regioni r ON p.regione_id = r.id
                   JOIN config.stati s ON r.stato_id = s.id;

              COMMENT ON VIEW script.vw_ita_province_regioni IS
                'Estensione Italia: province con accisa, regioni e codici ISTAT/catastali via jsonb.';

              GRANT SELECT ON script.vw_ita_province_regioni TO zeroerp_app;
