databaseChangeLog:
  - logicalFilePath: /migrations_v2/20_code/script/20260420-09-update-fn-scope-ba-ownership-ruolo-aware-mctit.yaml

  - changeSet:
      id: 20260420-09-update-fn-scope-ba-ownership-ruolo-aware
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Update di script.fn_scope_ba_ownership con filtro esplicito su
        ruolo_applicativo. Motivazione: difesa-in-profondita §V
        sviluppo-concentrico ("metti le regole dove non possono essere
        aggirate"). Prima della modifica la fn era ruolo-agnostica e
        demandava il gate alle policy RLS (livello piu' alto): una policy
        mal scritta poteva far passare anche identita OPERATORE o
        FORNITORE_PORTALE con SR-CL coincidente.
        Post-modifica: la fn verifica internamente che l'identita sia in
        veste cliente (CLIENTE_PORTALE o SHOP_CUSTOMER) — il filtro ruolo
        diventa parte del contratto della scope function, non responsabilita'
        della policy. Rimane STABLE, inlineable, fail-closed.
        Safe: tutte le policy RLS che oggi invocano la fn gia' gate su
        CLIENTE_PORTALE o SHOP_CUSTOMER → il filtro aggiunto e' idempotente
        (non esclude alcun caso valido).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*)
                FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_scope_ba_ownership';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ba_ownership(
                  p_identita_id bigint,
                  p_billing_account_id bigint
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  -- =========================================================
                  -- Scope policy BA_OWNERSHIP, versione ruolo-aware.
                  -- Ritorna true se:
                  --   1. l'identita (p_identita_id) e' attiva
                  --   2. l'identita e' in veste cliente (CLIENTE_PORTALE o
                  --      SHOP_CUSTOMER) — filtro interno alla fn
                  --   3. il billing_account ha lo stesso soggetto_ruolo
                  --      dell'identita
                  -- Fail-closed: NULL o identita inesistente/inattiva -> false.
                  -- STABLE, inlineable dal planner. Usata sia dal portale
                  -- B2B (policy senza filtro canale) sia dallo shop (policy
                  -- con filtro canale_origine='SHOP' aggiuntivo).
                  -- =========================================================
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN anagrafiche.billing_account  ba
                          ON ba.soggetto_ruolo_id = id.soggetto_ruolo_id
                       WHERE id.id                = p_identita_id
                         AND id.attivo            = true
                         AND id.ruolo_applicativo IN ('CLIENTE_PORTALE', 'SHOP_CUSTOMER')
                         AND ba.id                = p_billing_account_id
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ba_ownership(bigint, bigint) IS
                  'Scope policy BA_OWNERSHIP ruolo-aware (post 20-04-2026): '
                  'true se l''identita e'' in veste cliente (CLIENTE_PORTALE o '
                  'SHOP_CUSTOMER) attiva e condivide il soggetto_ruolo col BA. '
                  'Il filtro canale_origine e'' demandato alle policy RLS '
                  '(portale B2B senza filtro, shop con canale=SHOP). STABLE, '
                  'inlineable, fail-closed.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Rollback alla versione ruolo-agnostica pre 20-04-2026
              CREATE OR REPLACE FUNCTION script.fn_scope_ba_ownership(
                  p_identita_id bigint,
                  p_billing_account_id bigint
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN anagrafiche.billing_account  ba
                          ON ba.soggetto_ruolo_id = id.soggetto_ruolo_id
                       WHERE id.id     = p_identita_id
                         AND id.attivo = true
                         AND ba.id     = p_billing_account_id
                  );
              $function$;
