# ------------------------------------------------------------
# BB: DAL CODICE ALL'ID DELLO STATO DI UNA TESTATA
#   Brief: brief-modello-documento-vendita §7.9 e §8 (giro 6; richiesta del
#   team BE, U-3 di Tid, 2026-10-25).
#
# ── CHE COSA DICE ───────────────────────────────────────────────────
#   L'id dello stato ATTIVO con quel codice_interno nel vocabolario della
#   testata (dalla mappa, script.fn_doc_stato_modello). NULL se non c'e', o se
#   e' spento: uno stato spento non e' una destinazione (U-3), e il chiamante
#   decide l'errore. Il codice_interno e' la chiave stabile del vocabolario
#   (UNIQUE negli otto); il codice si puo' cambiare.
#
# ── LE COPIE CHE SI RITIRANO ────────────────────────────────────────
#   La traduzione era scritta in quattro posti (censimento del 2026-10-25):
#   vendite.fn_cambia_stato_preventivo (20261025-42), vendite.fn_cambia_stato_ddt
#   (20261025-44), dbops.fn_pgtap_porta_a_stato (20261025-48) e il repository
#   del backend (DocumentoModelloRepository, richiesta del §8). Le tre del
#   database si ritirano in questo giro.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-39-create-fn-doc-stato-id-mctit.yaml

  - changeSet:
      id: 20261025-39-create-fn-doc-stato-id
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB script.fn_doc_stato_id(regclass, text): l'id dello stato attivo con quel
        codice_interno nel vocabolario di una testata della mappa, NULL se non c'e'. Lettore
        unico per verbi, fixture e backend. Brief: brief-modello-documento-vendita §8 (U-3).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_doc_stato_modello';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_doc_stato_id(
                  p_testata regclass,
                  p_codice  text)
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  -- Il vocabolario e l'id di uno stato di una qualunque testata
                  -- della mappa: bigint in tutti, nessuna colonna comune a cui
                  -- ancorarli.
                  v_vocabolario regclass;
                  v_id          bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato attivo con quel codice_interno nel
                  --   vocabolario della testata. NULL: nessuno stato attivo con
                  --   quel codice (decide il chiamante).
                  -- =========================================================
                  SELECT m.vocabolario
                    INTO v_vocabolario
                    FROM script.fn_doc_stato_modello(p_testata) m;

                  IF v_vocabolario IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_doc_stato_id', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('testata', p_testata::text),
                          NULL::uuid,
                          'script.fn_doc_stato_id',
                          'p_testata: una testata della mappa del modello (script.fn_doc_stato_modello)');
                  END IF;

                  EXECUTE format(
                      'SELECT s.id FROM %s s WHERE s.codice_interno = $1 AND s.attivo IS TRUE',
                      v_vocabolario)
                     INTO v_id
                    USING p_codice;

                  RETURN v_id;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_doc_stato_id(p_testata regclass, p_codice text)
                IS 'BB del modello del documento: l''id dello stato ATTIVO con quel codice_interno (la chiave stabile del vocabolario) nel vocabolario degli stati di una testata, letto dalla mappa script.fn_doc_stato_modello. NULL se nessuno stato attivo ha quel codice: uno stato spento non e'' una destinazione (U-3), e l''errore lo decide il chiamante. Testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. Sede unica della traduzione codice -> id: la leggono i verbi di stato (vendite.fn_cambia_stato_preventivo, vendite.fn_cambia_stato_ddt), la domanda intera script.fn_doc_azione_passaggio, la fixture dbops.fn_pgtap_porta_a_stato e il backend. Brief: brief-modello-documento-vendita §8 (richiesta del team BE, Tid 2026-10-25).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_doc_stato_id(regclass, text);
