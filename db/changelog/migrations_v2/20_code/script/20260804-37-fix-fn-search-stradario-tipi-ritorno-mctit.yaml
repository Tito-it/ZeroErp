# Bonifica riferimenti morti — F2, il difetto piu' grave del giro
#   Brief: docs/it/dev/work-done/brief-db-bonifica-riferimenti-morti.md
#
# ── COSA NON FUNZIONA ────────────────────────────────────────────────────
#   `script.fn_search_stradario` **non gira**. Verificato chiamandola:
#
#     ERRORE:  structure of query does not match function result type
#     DETTAGLI: Returned type character varying(50) does not match
#               expected type bpchar in column "cap" (position 9).
#
#   Non e' una funzione dormiente: e' l'autocomplete delle vie del
#   backend (`apps/core/db/lookup_repository.py`, `search_stradario`,
#   esposto da `apps/core/api/views_lookup.py`). Ogni ricerca via
#   dell'operatore finisce li'.
#
# ── 🔴 PERCHE' NESSUNO SE N'ERA ACCORTO ──────────────────────────────────
#   Il suo pgTAP `db/pgtap/script/test-fn-search-stradario.sql` e' rosso, ed
#   e' registrato in `db/pgtap/baseline-rossi.tsv` con causa **ERRORE_FIXTURE**.
#   La causa e' sbagliata: non e' la fixture che non regge, e' la funzione
#   che non parte (`plan(8)`, ne esegue 1). Un difetto vivo si e' nascosto
#   dietro un'etichetta del registro di debito — che e' esattamente il modo
#   in cui un registro smette di essere un registro.
#   La riga della baseline va corretta insieme a questo changeSet.
#
# ── LA CAUSA RADICE, CHE VALE OLTRE QUESTA FUNZIONE ──────────────────────
#   `%TYPE` in **firma** (non nel DECLARE) si risolve **una volta sola, al
#   CREATE**, e non si riaggancia mai piu'. Sembra un link vivo alla
#   colonna; e' una fotografia.
#
#     2026-03-13  `20260313-11` crea la funzione dichiarando
#                 `cap config.codici_postali.codice%TYPE` e
#                 `provincia_sigla config.province.sigla%TYPE`.
#                 Allora quelle colonne erano `character(n)`: la firma
#                 si congela su `bpchar`.
#     2026-04-02  `20260402-01-alter-config-codice-char-to-varchar` porta
#                 `codici_postali.codice` a `varchar`.
#                 La firma resta `bpchar`. Nessuno protesta.
#     da allora   ogni chiamata fallisce.
#
#   ⚠️ E' la stessa meccanica che nel cantiere *ritorno del lotto a DRAFT*
#   (misura M4-quater) ci ha **salvati**: li' il `%TYPE` in firma si
#   risolse al CREATE e fece fallire il migrate a voce alta. Qui, con la
#   ALTER arrivata **dopo** il CREATE, la stessa meccanica ha fatto il
#   danno in silenzio. Stesso meccanismo, esito opposto, decide l'ordine.
#
#   Censimento (2026-08-04): cinque funzioni dichiarano colonne di ritorno
#   `character` nudo — oltre alle due dello stradario ci sono
#   `fn_get_indirizzo`, `fn_get_note`, `fn_get_soggetto_dati_by_ruolo`.
#   Le altre tre oggi funzionano perche' le loro colonne sorgente sono
#   ancora `char(n)`: sono esposte, non rotte. Le rompera' la prossima
#   ALTER TYPE, e a quel punto il presidio le prende **subito** invece che
#   quattro mesi dopo. E' l'argomento principale per portarlo in CI.
#
# ── IL RIMEDIO ───────────────────────────────────────────────────────────
#   Le due colonne malate diventano `text` esplicito, con `::text` nella
#   query: tipo e query non possono piu' divergere, e il vettore di
#   marcescenza sparisce (nessun `%TYPE` da riagganciare).
#   Effetto collaterale voluto: `provincia_sigla` non torna piu' riempita
#   di spazi fino a 10 caratteri ma 'RM'.
#   Le altre colonne restano con `%TYPE`: non sono rotte, e allargare il
#   diff qui vorrebbe dire toccare cio' che oggi regge.
#
#   `RETURNS TABLE` non si cambia con `CREATE OR REPLACE`: serve il DROP.
#   Nessuna vista dipende dalla funzione (verificato su pg_depend), il BE
#   la chiama con `SELECT *` e mappa **per nome** (`rows_to_list`), quindi
#   i nomi di colonna restano quelli e il contratto BE non si muove.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-37-fix-fn-search-stradario-tipi-ritorno-mctit.yaml

  - changeSet:
      id: 20260804-37-fix-fn-search-stradario-tipi-ritorno
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        F2 — script.fn_search_stradario non gira: provincia_sigla e cap erano
        dichiarate con %TYPE risolto a bpchar al CREATE (2026-03-13) e la ALTER
        char->varchar del 2026-04-02 non le ha riagganciate. Diventano text
        esplicito con cast in query. Autocomplete vie del BE, percorso vivo.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_search_stradario(integer, text, integer);

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_search_stradario(
                  p_comune_id    config.comuni.id%TYPE       DEFAULT NULL,
                  p_search       text                        DEFAULT NULL,
                  p_limit        integer                     DEFAULT 30
              )
              RETURNS TABLE (
                  stradario_id           config.stradario.id%TYPE,
                  toponimo               config.toponomastica.descrizione%TYPE,
                  denominazione          config.stradario_generale.descrizione%TYPE,
                  indirizzo_normalizzato config.stradario_generale.indirizzo_normalizzato%TYPE,
                  comune_id              config.comuni.id%TYPE,
                  comune_descrizione     config.comuni.descrizione%TYPE,
                  -- ⚠️ text ESPLICITO, non %TYPE: queste due colonne sono
                  --    quelle che si erano scollegate dalla sorgente
                  --    (bpchar congelato al CREATE vs varchar della ALTER).
                  --    Con text + cast in query non c'e' piu' niente da
                  --    riagganciare.
                  provincia_sigla        text,
                  codice_postale_id      config.codici_postali.id%TYPE,
                  cap                    text
              )
              LANGUAGE plpgsql
              STABLE
              PARALLEL SAFE
              AS $function$
              DECLARE
                  v_search  text;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Ricerca vie (stradario) per autocomplete.
                  --   L'utente seleziona un comune, poi cerca una via
                  --   nel comune selezionato.
                  --
                  -- Parametri:
                  --   p_comune_id: filtra per comune (caso principale)
                  --   p_search:    testo ILIKE su indirizzo_normalizzato
                  --   p_limit:     max righe (default 30)
                  --
                  -- Almeno uno tra p_comune_id e p_search obbligatorio.
                  --
                  -- JOIN:
                  --   stradario -> stradario_generale -> toponomastica
                  --   stradario -> comuni -> province
                  --   stradario -> codici_postali
                  --
                  -- Performance:
                  --   stradario_generale.indirizzo_normalizzato ha indice
                  --   GIN trigram (ix_stradario_generale_norm_trgm).
                  --   stradario.comune_id ha indice btree.
                  -- =========================================================

                  -- =============================================================
                  -- Normalizzazione parametro ricerca
                  -- =============================================================

                  v_search := NULLIF(BTRIM(p_search), '');

                  -- =============================================================
                  -- Guard: almeno un criterio
                  -- =============================================================

                  IF p_comune_id IS NULL AND v_search IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_search_stradario',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('p_comune_id', p_comune_id,
                                            'p_search', p_search),
                          NULL::uuid,
                          'Valorizzare almeno p_comune_id o p_search (non vuoto).'
                      );
                  END IF;

                  -- =============================================================
                  -- Guard: p_comune_id valido se fornito
                  -- =============================================================

                  IF p_comune_id IS NOT NULL AND p_comune_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_search_stradario',
                          'E_ADMIN_VALIDAZIONE',
                          jsonb_build_object('parametro', 'p_comune_id',
                                            'valore', p_comune_id),
                          NULL::uuid,
                          'p_comune_id deve essere > 0.'
                      );
                  END IF;

                  -- =============================================================
                  -- Query principale
                  -- Filtro toponomastica.attivo = true per escludere
                  -- toponimi disattivati.
                  --
                  -- ⚠️ I due ::text non sono cosmetici: allineano il tipo
                  --    della query a quello dichiarato in RETURNS TABLE.
                  --    RETURN QUERY pretende corrispondenza esatta, non
                  --    accetta la conversione implicita.
                  -- =============================================================

                  RETURN QUERY
                  SELECT
                      s.id                    AS stradario_id,
                      t.descrizione           AS toponimo,
                      sg.descrizione          AS denominazione,
                      sg.indirizzo_normalizzato AS indirizzo_normalizzato,
                      c.id                    AS comune_id,
                      c.descrizione           AS comune_descrizione,
                      p.sigla::text           AS provincia_sigla,
                      cp.id                   AS codice_postale_id,
                      cp.codice::text         AS cap
                  FROM config.stradario s
                  JOIN config.stradario_generale sg ON sg.id = s.stradario_generale_id
                  JOIN config.toponomastica t       ON t.id  = sg.toponomastica_id
                  JOIN config.comuni c              ON c.id  = s.comune_id
                  LEFT JOIN config.province p       ON p.id  = c.provincia_id
                  JOIN config.codici_postali cp     ON cp.id = s.codice_postale_id
                  WHERE t.attivo = TRUE
                    AND (p_comune_id IS NULL OR s.comune_id = p_comune_id)
                    AND (v_search IS NULL
                         OR sg.indirizzo_normalizzato ILIKE '%' || v_search || '%')
                  ORDER BY sg.indirizzo_normalizzato, s.id
                  LIMIT p_limit;

              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_search_stradario(integer, text, integer) IS
              'Ricerca vie (stradario) per autocomplete. provincia_sigla e cap sono text esplicito: con %TYPE la firma si congelava al CREATE e la ALTER TYPE del 2026-04-02 la lasciava indietro (brief-db-bonifica-riferimenti-morti F2).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_search_stradario(integer, text, integer);
