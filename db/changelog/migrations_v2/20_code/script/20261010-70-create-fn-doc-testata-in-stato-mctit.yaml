# NUOVO: script.fn_doc_testata_in_stato(p_tabella, p_stato, p_sempre)
#   La testata di un documento in uno stato, letta dal montaggio del lock:
#   quali colonne non si cambiano, e se ce n'e' almeno una che si cambia.
#   Brief: brief-db-testata-dopo-emissione (fase 2, §5 «la terza copia»,
#   §9.3 punto 4)
#
# -- PERCHE' ------------------------------------------------------------
#   Le capability di ordine, DDT, contratto, offerta, preventivo e reso
#   portano liste scritte a mano dei campi bloccati fuori bozza
#   (non_editable_fields: c_non_edit_tutti, c_non_edit_attivo,
#   c_non_edit_extra) e un can_edit_testata con gli stati scritti
#   (= DRAFT, IN ('DRAFT','ATTIVO')). Sono la terza copia della regola
#   «che cosa si cambia ancora fuori bozza», accanto al lock e al backend:
#   con D-8/D-10 avrebbero detto il falso (le note di un ordine confermato
#   si cambiano, quelle di un ordine annullato no). Il lock la dice nel
#   montaggio; questa funzione la legge da li', con la decisione del
#   trigger.
#
# -- LA RISPOSTA -------------------------------------------------------
#   jsonb {modificabile, non_modificabili}:
#   * non_modificabili: p_sempre (le colonne che la capability dichiara non
#     modificabili in ogni stato: campi di sistema, lock assoluti, scelte
#     del form) seguite dalle colonne che il lock di testata nomina e che
#     in p_stato non si cambiano, nell'ordine del montaggio, senza doppioni;
#   * modificabile: in p_stato almeno una colonna nominata si cambia. In
#     bozza tutte; fuori bozza quelle aperte negli stati del montaggio.
#     Senza lock di testata: false (nessuna colonna da dire).
#   Le colonne che il montaggio non nomina restano fuori dalla lista: le
#   scrive il database, o il form non le espone.
#   STABLE, SECURITY INVOKER (legge pg_trigger). Tipi nudi dichiarati:
#   p_stato polimorfo (codice_interno di sei vocabolari), p_sempre e il
#   risultato sono il jsonb delle capability.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261010-70-create-fn-doc-testata-in-stato-mctit.yaml

  - changeSet:
      id: 20261010-70-create-fn-doc-testata-in-stato
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuovo BB script.fn_doc_testata_in_stato: colonne di testata non modificabili e can_edit_testata letti dal
        montaggio del lock, per le capability. Brief: brief-db-testata-dopo-emissione (fase 2).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_doc_testata_in_stato(
                  p_tabella regclass,
                  p_stato   text,
                  p_sempre  jsonb DEFAULT '[]'::jsonb
              )
              RETURNS jsonb
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- Scopo: la testata in p_stato, dal montaggio del lock:
                  --   {modificabile, non_modificabili}. non_modificabili =
                  --   p_sempre seguite dalle colonne nominate che in p_stato
                  --   non si cambiano (ordine del montaggio, senza doppioni);
                  --   modificabile = almeno una colonna nominata si cambia.
                  -- ⚠️ p_stato nudo: codice_interno di sei vocabolari (polimorfo).
                  WITH nominate AS (
                      SELECT e ->> 'colonna' AS colonna,
                             script.fn_doc_lock_colonna_bloccata(m.regola, p_stato,
                                                                 ARRAY[e ->> 'colonna']) IS NULL AS aperta,
                             row_number() OVER (ORDER BY m.trigger_nome, x.k) AS ordine
                        FROM script.fn_doc_lock_montaggi(p_tabella) AS m
                        CROSS JOIN LATERAL jsonb_array_elements(m.regola -> 'colonne')
                             WITH ORDINALITY AS x(e, k)
                       WHERE m.regola ->> 'building_block' = 'TESTATA'
                  )
                  SELECT jsonb_build_object(
                           'modificabile',     COALESCE(bool_or(n.aperta), false),
                           'non_modificabili', COALESCE(p_sempre, '[]'::jsonb)
                                               || COALESCE(jsonb_agg(n.colonna ORDER BY n.ordine)
                                                             FILTER (WHERE NOT n.aperta
                                                                       AND NOT COALESCE(p_sempre, '[]'::jsonb)
                                                                               @> jsonb_build_array(n.colonna))
                                                           , '[]'::jsonb))
                    FROM nominate AS n;
              $function$;

              COMMENT ON FUNCTION script.fn_doc_testata_in_stato(regclass, text, jsonb)
              IS 'Building block (2026-10-10, brief-db-testata-dopo-emissione fase 2): la testata di un documento in p_stato (codice_interno), letta dal montaggio del lock di testata (script.fn_doc_lock_montaggi, decisione di script.fn_doc_lock_colonna_bloccata). jsonb {modificabile, non_modificabili}: non_modificabili = p_sempre (le colonne che la capability dichiara non modificabili in ogni stato) seguite dalle colonne nominate dal lock che in p_stato non si cambiano, nell''ordine del montaggio e senza doppioni; modificabile = almeno una colonna nominata si cambia in p_stato (in bozza tutte; senza lock di testata false). Sostituisce nelle capability di ordine, DDT, contratto, offerta, preventivo e reso le liste scritte a mano dei campi bloccati fuori bozza e gli stati scritti di can_edit_testata: la terza copia della regola, accanto a lock e backend.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_doc_testata_in_stato(regclass, text, jsonb);
