              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_attivita_fatturabile(p_auth_user_id integer, p_attivita_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: perimetro emittente di un'attivita' fatturabile,
                  --   risalendo alla COMMESSA.
                  -- ⛔ `commessa_id` e non `billing_account_id`: la prima e'
                  --   NOT NULL, la seconda no, e una policy costruita su una
                  --   chiave nullable ha un buco esatto dove il NULL passa.
                  --   Brief §6.1.
                  SELECT script.fn_scope_ef_whitelist_via_commessa(
                      p_auth_user_id,
                      (SELECT af.commessa_id
                         FROM vendite.attivita_fatturabili af
                        WHERE af.id = p_attivita_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_commessa(p_auth_user_id integer, p_commessa_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Risolve commessa -> emittente_soggetto_ruolo_id e delega
                  -- all'adapter SR. Commessa inesistente / emittente NULL -> SR
                  -- NULL -> false (fail-closed se whitelist valorizzata).
                  SELECT script.fn_scope_ef_whitelist_via_sr(
                      p_auth_user_id,
                      (SELECT c.emittente_soggetto_ruolo_id
                         FROM vendite.commesse c
                        WHERE c.id = p_commessa_id)
                  );
              $function$
              ;

