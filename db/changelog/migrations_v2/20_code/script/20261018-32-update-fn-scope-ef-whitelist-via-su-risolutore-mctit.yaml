# GLI ADATTATORI DI VENDITA CHIEDONO L'EMITTENTE AL RISOLUTORE
#   script.fn_scope_ef_whitelist_via_* — i 21 che toccano vendite
#   (attivita_fatturabile, commessa, commessa_attivita, contratto,
#   contratto_riga, ddt, ddt_riga, fattura, fattura_sdi, listino,
#   listino_versione, lotto, offerta, offerta_eccezione, ordine, ordine_riga,
#   preventivo, preventivo_riga, reso, reso_riga, sr)
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5quinquies, D-3b-2 giro 1b (D-3b-2d).
#
# Restano: li chiamano i verbi di vendite (fn_annulla_*, fn_cambia_stato_ddt,
# fn_conferma_reso, ...), fn_scope_note_ef_whitelist, il backend e i pgTAP.
# Ognuno diventa canonica(utente, fn_resolve_emittente_fiscale_id('<modo>',
# chiave)): la strada documento -> emittente vive nel modo del risolutore
# (-31), non piu' qui (regola del 2), e una chiamata non riesegue la policy
# del padre. Stesse risposte: per l'operatore il padre e' invisibile
# esattamente quando il suo emittente e' fuori perimetro.
# Firme ancorate %TYPE (stessi tipi), COST 5000, INVOKER, STABLE: invariati.
# Senza sottoquery nel corpo, ora il pianificatore li incorpora.
# Rollback: i corpi vivi (dbdev, 2026-10-18).

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261018-32-update-fn-scope-ef-whitelist-via-su-risolutore-mctit.yaml

  - changeSet:
      id: 20261018-32-update-fn-scope-ef-whitelist-via-su-risolutore
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        I 21 adattatori fn_scope_ef_whitelist_via_* di vendite chiedono l'emittente a fn_resolve_emittente_fiscale_id (-31): una strada sola, nessuna policy del padre per chiamata. Stesse risposte. D-3b-2 giro 1b.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 21
            sql: >
              SELECT count(*) FROM pg_proc p
               WHERE p.pronamespace = 'script'::regnamespace
                 AND p.proname ~ '^fn_scope_ef_whitelist_via_(attivita_fatturabile|commessa|commessa_attivita|contratto|contratto_riga|ddt|ddt_riga|fattura|fattura_sdi|listino|listino_versione|lotto|offerta|offerta_eccezione|ordine|ordine_riga|preventivo|preventivo_riga|reso|reso_riga|sr)$'
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_resolve_emittente_fiscale_id(text,bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_attivita_fatturabile(
                  p_auth_user_id config.user_emittenti_fiscali.auth_user_id%TYPE,
                  p_attivita_id vendite.attivita_fatturabili.id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: l'utente vede l'emittente della chiave (attivita fatturabile)? La domanda
                  --   su UN emittente, per chi non sta in una policy (verbi, guard,
                  --   backend): la regola e' della canonica, l'emittente del risolutore.
                  -- ⭐ Rev 2026-10-18 (20261018-32, D-3b-2 giro 1b): l'emittente si chiede a
                  --   script.fn_resolve_emittente_fiscale_id('attivita_fatturabile', ...), DEFINER, invece
                  --   di leggerlo qui sotto la RLS del padre: la strada documento ->
                  --   emittente e' scritta UNA volta (il modo del risolutore), e una
                  --   chiamata non riesegue piu' la policy del padre. Stesse risposte: per
                  --   l'operatore il padre e' invisibile esattamente quando il suo
                  --   emittente e' fuori perimetro, e la canonica lo dice comunque.
                  --   Le policy non passano piu' di qui (20261018-33): calcolano il
                  --   perimetro una volta per istruzione.
                  SELECT script.fn_check_user_emittente_scope(
                      p_auth_user_id,
                      script.fn_resolve_emittente_fiscale_id('attivita_fatturabile', p_attivita_id))
              $function$;

