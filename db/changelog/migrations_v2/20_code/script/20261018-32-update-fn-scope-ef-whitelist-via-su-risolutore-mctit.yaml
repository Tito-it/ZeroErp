                      p_auth_user_id,
                      (SELECT o.emittente_fiscale_id
                         FROM vendite.ordini o WHERE o.id = p_ordine_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_ordine_riga(p_auth_user_id integer, p_riga_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  SELECT script.fn_scope_ef_whitelist_via_ordine(
                      p_auth_user_id,
                      (SELECT r.ordine_id
                         FROM vendite.ordini_righe r WHERE r.id = p_riga_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_preventivo(p_auth_user_id integer, p_preventivo_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro
                  --   l'emittente del preventivo indicato.
                  -- ⚠️ Preventivo inesistente -> emittente NULL -> la canonica
                  --   risponde false quando la whitelist e' valorizzata:
                  --   fail-closed, come per le fatture.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT p.emittente_fiscale_id
                         FROM vendite.preventivi p
                        WHERE p.id = p_preventivo_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_preventivo_riga(p_auth_user_id integer, p_riga_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: come sopra, ma partendo da una RIGA di preventivo —
                  --   e' la chiave che portano i componenti.
                  -- ⭐ Delega alla sorella invece di ripetere la risalita: la
                  --   regola «come un preventivo nomina il suo emittente» resta
                  --   scritta in un posto solo.
                  SELECT script.fn_scope_ef_whitelist_via_preventivo(
                      p_auth_user_id,
                      (SELECT r.preventivo_id
                         FROM vendite.preventivi_righe r
                        WHERE r.id = p_riga_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_reso(p_auth_user_id integer, p_reso_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro
                  --   l'emittente del reso indicato.
                  -- ⚠️ Reso inesistente -> emittente NULL -> la canonica
                  --   risponde false a whitelist valorizzata: fail-closed.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT r.emittente_fiscale_id
                         FROM vendite.resi r
                        WHERE r.id = p_reso_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_reso_riga(p_auth_user_id integer, p_riga_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Scopo: come sopra, ma partendo da una RIGA di reso — e' la
                  --   chiave che portano accrediti, riconsegne e rinunce.
                  -- ⛔ Si risale dal RESO, non dal DDT: la riga appartiene al
                  --   documento di reso. `resi_righe` ha due genitori
                  --   `NOT NULL` e questa e' la scelta, non una svista.
                  SELECT script.fn_scope_ef_whitelist_via_reso(
                      p_auth_user_id,
                      (SELECT rr.reso_id
                         FROM vendite.resi_righe rr
                        WHERE rr.id = p_riga_id)
                  );
              $function$
              ;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_sr(p_auth_user_id integer, p_emittente_sr_id bigint)
               RETURNS boolean
               LANGUAGE sql
               STABLE COST 5000
              AS $function$
                  -- Risolve SR -> emittente_fiscale_id (1:1 via soggetto_ruolo_id)
                  -- e delega alla canonica. SR non mappato / emittente NULL ->
                  -- la canonica con emittente_fiscale_id NULL ritorna false se la
                  -- whitelist e' valorizzata (fail-closed), true se vuota/super_admin.
                  SELECT script.fn_check_user_emittente_scope(
                      p_auth_user_id,
                      (SELECT ef.id
                         FROM anagrafiche.emittenti_fiscali ef
                        WHERE ef.soggetto_ruolo_id = p_emittente_sr_id)
                  );
              $function$
              ;
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $c$
              DECLARE
                  f regprocedure;
              BEGIN
                  FOR f IN
                      SELECT p.oid::regprocedure FROM pg_catalog.pg_proc p
                       WHERE p.pronamespace = 'script'::regnamespace
                         AND p.proname ~ '^fn_scope_ef_whitelist_via_(attivita_fatturabile|commessa|commessa_attivita|contratto|contratto_riga|ddt|ddt_riga|fattura|fattura_sdi|listino|listino_versione|lotto|offerta|offerta_eccezione|ordine|ordine_riga|preventivo|preventivo_riga|reso|reso_riga|sr)$'
                  LOOP
                      EXECUTE format('COMMENT ON FUNCTION %s IS %L', f,
                          replace(coalesce(obj_description(f, 'pg_proc'), ''), '⭐ rev 2026-10-18 (20261018-32, D-3b-2 giro 1b): l''emittente lo chiede a script.fn_resolve_emittente_fiscale_id (DEFINER), non lo legge sotto la RLS del padre: una strada sola, e nessuna policy del padre rieseguita a ogni chiamata. Stesse risposte. ', ''));
                  END LOOP;
              END
              $c$;
