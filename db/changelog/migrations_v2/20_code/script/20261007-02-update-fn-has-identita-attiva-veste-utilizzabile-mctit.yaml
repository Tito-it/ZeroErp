# script.fn_has_identita_attiva: LA VESTE CONTA SE E' UTILIZZABILE OGGI
#   Brief: brief-db-veste-utilizzabile (building block: 20261007-01)
#
#   La credenziale ha una veste di quel tipo utilizzabile oggi? Era attivo + finestra
#   ricopiati qui, senza soggetto e senza rapporto: ora legge il building block.
#   La firma per credenziale + tipo resta: la usano le funzioni dei permessi
#   (fn_get_user_permissions_map, fn_get_permessi_effettivi_azioni) e
#   fn_get_operatore_detail, ed e' un'altra domanda (per credenziale, non per veste).
#
#   Corpo vivo = pg_get_functiondef su dbdev il 2026-10-07 (uguale alla doc
#   auto-gen); sostituzioni contate. Firma, RETURNS, DECLARE e firma del
#   COMMENT ancorati a %TYPE dove c'e' una colonna dietro; dove non c'e', il
#   tipo esplicito porta il perche' accanto. I %TYPE si risolvono negli STESSI
#   tipi di oggi (provato: nessun overload), quindi i chiamanti (comprese le
#   BEGIN ATOMIC) restano validi. Il rollback e' il corpo vivo di prima, con la
#   stessa firma ancorata.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261007-02-update-fn-has-identita-attiva-veste-utilizzabile-mctit.yaml

  - changeSet:
      id: 20261007-02-update-fn-has-identita-attiva-veste-utilizzabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        fn_has_identita_attiva legge script.fn_veste_utilizzabile invece di ricopiare attivo + finestra. Brief: brief-db-veste-utilizzabile.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_has_identita_attiva';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_has_identita_attiva(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, p_ruolo_applicativo anagrafiche.identita_digitali.ruolo_applicativo%TYPE)
               RETURNS boolean  -- una risposta si/no: nessuna colonna dietro
               LANGUAGE sql
               STABLE
              AS $function$
                  -- La CREDENZIALE ha una veste di quel tipo UTILIZZABILE oggi? Fail-closed
                  -- su NULL auth_user_id (EXISTS restituisce false).
                  -- ⭐ Rev 2026-10-07 (brief-db-veste-utilizzabile): «utilizzabile» lo
                  --   decide script.fn_veste_utilizzabile, non piu' una copia qui di
                  --   attivo + finestra (che non guardava soggetto e rapporto).
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                       WHERE id.auth_user_id = p_auth_user_id
                         AND id.ruolo_applicativo = p_ruolo_applicativo
                         AND script.fn_veste_utilizzabile(id.id)
                  );
              $function$
              ;

              COMMENT ON FUNCTION script.fn_has_identita_attiva(anagrafiche.identita_digitali.auth_user_id%TYPE, anagrafiche.identita_digitali.ruolo_applicativo%TYPE) IS 'Verifica se la credenziale (auth_user_id) ha una veste del ruolo_applicativo dato utilizzabile oggi, secondo script.fn_veste_utilizzabile. Helper DRY per le funzioni di risoluzione permessi/scope (§4.6.B.0 WIP multi-face-auth). LANGUAGE sql STABLE, fail-closed su NULL. Rev 2026-10-07 (brief-db-veste-utilizzabile): la regola non e'''' piu'''' ricopiata qui, la legge da script.fn_veste_utilizzabile (soggetto attivo e, per l''''operatore umano, rapporto attivo e nelle sue date compresi).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_has_identita_attiva(p_auth_user_id anagrafiche.identita_digitali.auth_user_id%TYPE, p_ruolo_applicativo anagrafiche.identita_digitali.ruolo_applicativo%TYPE)
               RETURNS boolean  -- una risposta si/no: nessuna colonna dietro
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Verifica esistenza identita_digitali attiva, nella finestra
                  -- temporale, con ruolo_applicativo dato. Fail-closed su NULL
                  -- auth_user_id (EXISTS restituisce false).
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                       WHERE id.auth_user_id = p_auth_user_id
                         AND id.ruolo_applicativo = p_ruolo_applicativo
                         AND id.attivo = true
                         AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                         AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                  );
              $function$
              ;

              COMMENT ON FUNCTION script.fn_has_identita_attiva(anagrafiche.identita_digitali.auth_user_id%TYPE, anagrafiche.identita_digitali.ruolo_applicativo%TYPE) IS 'Verifica se esiste un''identita attiva nella finestra temporale per un auth_user_id e ruolo_applicativo dati. Helper DRY per le funzioni di risoluzione permessi/scope (§4.6.B.0 WIP multi-face-auth). LANGUAGE sql STABLE: inlineable, fail-closed su NULL.';
