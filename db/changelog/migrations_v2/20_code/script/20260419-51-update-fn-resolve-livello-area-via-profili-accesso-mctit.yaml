databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260419-51-update-fn-resolve-livello-area-via-profili-accesso-mctit.yaml

  - changeSet:
      id: 20260419-51-update-fn-resolve-livello-area-via-profili-accesso
      author: mctit
      runOnChange: true
      validCheckSum: [ANY]
      comment: >
        Aggiornamento successivo di script.fn_resolve_livello_area (§4.8
        WIP multi-face-auth). Sostituisce la catena legacy
        "profili_reparto_aree JOIN UO/RUA" con lookup generalizzato via
        script.fn_get_profili_accesso_applicabili su profili_accesso_aree.

        Passaggi del cambio:
          - I rami §4.6.B.2 (identita OPERATORE attiva + super admin +
            override utente area) restano invariati.
          - Il ramo 4 "profilo reparto" cambia sorgente:
              PRIMA: JOIN profili_reparto_aree via rau.risorsa_umana_id
                     -> ru.unita_organizzativa_id.
              DOPO:  JOIN profili_accesso_aree via
                     fn_get_profili_accesso_applicabili, con ORDER BY
                     priorita LIMIT 1 (AD_HOC prio 1 > REPARTO/PORTALE prio 2).

        Coerenza con il legacy: il backfill §4.3.5 (runOnChange) popola
        profili_accesso REPARTO equivalenti ai profili_reparto legacy;
        per operatori il risultato e' identico al pre-refactor. Per
        portali/shop/fornitori il resolver ora risponde coerentemente
        (prima sempre BLOCCATO per assenza di dati REPARTO).

        Nota di coordinamento: il backend attuale scrive ancora su
        profili_reparto_aree; il backfill runOnChange mantiene allineamento
        al deploy (accettabile in dev, non in prod). PR2 backend spostera'
        i writer sul nuovo modello.

        Questo file NON sostituisce 20260419-11 (che resta "prima versione"):
        entrambi usano runOnChange e CREATE OR REPLACE FUNCTION; Liquibase
        li esegue in ordine alfabetico, quindi -51 produce la versione
        finale della funzione.
      preConditions:
        - onFail: HALT
        - and:
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_is_super_admin';
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_get_profili_accesso_applicabili';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_area(
                  p_auth_user_id     integer,
                  p_area_schema_db   character varying
              )
              RETURNS config.livello_accesso
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_livello config.user_override_aree.livello%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Risolve il livello di accesso effettivo di un utente
                  --   per un'area funzionale identificata da schema_db.
                  --
                  -- Catena (refactor §4.6.B.2 + §4.8 WIP multi-face-auth):
                  --   1. Assenza di identita OPERATORE attiva -> BLOCCATO
                  --   2. fn_is_super_admin -> TUTTO
                  --   3. Override utente area (se valido temporalmente)
                  --   4. Profilo via fn_get_profili_accesso_applicabili
                  --      (AD_HOC prio 1 > REPARTO/PORTALE prio 2)
                  --   5. Default -> BLOCCATO
                  -- =========================================================

                  -- 1. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN 'BLOCCATO'::config.livello_accesso;
                  END IF;

                  -- 2. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN 'TUTTO'::config.livello_accesso;
                  END IF;

                  -- 3. Override utente area (invariato)
                  SELECT uoa.livello
                    INTO v_livello
                    FROM config.user_override_aree uoa
                    JOIN config.aree_funzionali af ON af.id = uoa.area_id
                   WHERE uoa.auth_user_id = p_auth_user_id
                     AND af.schema_db = p_area_schema_db
                     AND uoa.validita @> CURRENT_DATE;

                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;

                  -- 4. Profilo via bindings (§4.8 nuovo modello).
                  --    Helper ritorna i profili applicabili con priorita;
                  --    JOIN a profili_accesso_aree per il livello sull'area
                  --    richiesta; ORDER BY priorita LIMIT 1 per scegliere
                  --    il piu' specifico (AD_HOC > REPARTO/PORTALE).
                  SELECT paa.livello
                    INTO v_livello
                    FROM script.fn_get_profili_accesso_applicabili(p_auth_user_id) h
                    JOIN config.profili_accesso_aree paa
                      ON paa.profilo_accesso_id = h.profilo_accesso_id
                    JOIN config.aree_funzionali af
                      ON af.id = paa.area_id
                   WHERE af.schema_db = p_area_schema_db
                   ORDER BY h.priorita
                   LIMIT 1;

                  IF FOUND THEN
                      RETURN v_livello;
                  END IF;

                  -- 5. Default sicuro
                  RETURN 'BLOCCATO'::config.livello_accesso;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_resolve_livello_area(integer, character varying) IS
                  'Risolve livello accesso area per utente. Refactor §4.6.B.2 + §4.8: '
                  'ramo ADMIN -> fn_is_super_admin; ramo DISABILITATO -> check '
                  'identita OPERATORE attiva; profilo via bindings generalizzato '
                  '(fn_get_profili_accesso_applicabili, AD_HOC > REPARTO/PORTALE).';
      rollback:
        - sql:
            sql: |
              -- Rollback: Liquibase riesegue il file 20260419-11 (runOnChange)
              -- al prossimo apply, ripristinando la catena legacy.
              SELECT 1;
