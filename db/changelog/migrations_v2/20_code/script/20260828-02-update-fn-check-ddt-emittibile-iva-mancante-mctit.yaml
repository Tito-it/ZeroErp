        dr.prezzo_unitario e non il COALESCE col fulfillment: una riga dal prezzo solo derivato
        non entra nella vista, quindi non ha il difetto. ⛔ Non e' un NOT NULL di colonna:
        ordini_righe.iva_id e' nullable e fn_genera_ddt_da_ordine la copia, quindi il vincolo
        farebbe fallire l'evasione ordine con un 23502 muto. Decisione di Tid 2026-08-28
        (R4-ter): «impossibile» si traduce in «non emittibile», e in bozza il NULL resta
        legittimo come gia' per la causale.
      preConditions:
