# FASE C (C-1) — UNA RIGA CON PREZZO PORTA ANCHE L'ALIQUOTA
#   script.fn_check_ddt_emittibile
#   Piano: brief-db-ddt-riconsegna-eredita-testata, Fase C / R4-ter
#   Decisione di Tid, 2026-08-28: «una riga di DDT senza iva_id e' impossibile»,
#   precisata subito dopo come «impossibile si traduce in NON EMITTIBILE».
#
# ── ⭐ IL DIFETTO CHE CHIUDE, ED E' SILENZIOSO ─────────────────────────
#   vendite.vw_ddt_righe_iva_base filtra `prezzo_unitario IS NOT NULL` e NON
#   filtra `iva_id`; espone anzi `aliquota_effettiva` a NULL quando l'aliquota
#   manca. vendite.vw_ddt_riepilogo_iva_dettaglio aggrega per (iva_id,
#   aliquota_effettiva) e calcola l'imposta con COALESCE(aliquota, 0).
#   Conseguenza: una riga con prezzo e senza aliquota produce una riga di
#   riepilogo con IMPONIBILE PIENO, codice IVA VUOTO e IMPOSTA ZERO — su un
#   documento che si emette e si STAMPA. Nessun guard lo fermava: nessuno dei
#   cinque punti di questa funzione guardava iva_id, e su vendite.ddt_righe non
#   c'e' nessun trigger di default (l'unico che nomina la colonna e'
#   trgfn_child_requires_active_parent, che verifica solo che l'aliquota citata
#   sia ATTIVA — non che ci sia).
#
# ── ⛔ PERCHE' NON UN `NOT NULL` SULLA COLONNA ────────────────────────
#   Sarebbe la forma letterale, e non e' disponibile in un passo:
#   vendite.ordini_righe.iva_id e' NULLABLE, e fn_genera_ddt_da_ordine copia
#   `orr.iva_id` tale e quale. Un NOT NULL su vendite.ddt_righe.iva_id farebbe
#   FALLIRE L'EVASIONE DI UN ORDINE ogni volta che la riga d'ordine non ha
#   l'aliquota — con un 23502, cioe' un errore tecnico muto, su un percorso che
#   oggi funziona. Il NULL e' ammesso lungo TUTTA la catena (ordini_righe,
#   ddt_righe_componenti, ddt_righe): chiudere l'ultimo anello senza chiudere i
#   primi non rende il dato obbligatorio, sposta il punto di rottura su chi non
#   c'entra. ⭐ Un vincolo si mette dove il dato SI PUO' FORNIRE, non dove il
#   difetto si vede.
#
# ── ⭐ IL DISCRIMINE E' IL PREZZO, NON LA CAUSALE ─────────────────────
#   Il punto nuovo NON e' dentro `IF COALESCE(v_fatturabile, false)`, e la
#   differenza e' portante. Il punto 3 si condiziona sulla causale perche' un
#   documento che non vende non deve avere un prezzo RISOLVIBILE. Ma se un
#   prezzo c'e' — e su un conto visione puo' esserci — la riga entra comunque
#   in vw_ddt_righe_iva_base, che la causale non la guarda affatto. Il vincolo
#   deve avere lo stesso perimetro del CONSUMATORE che protegge.
#   In una riga: c'e' un prezzo, quindi c'e' un valore, quindi serve
#   un'aliquota. E' lo stesso discrimine del punto 1 — «il DDT di solo
#   trasporto resta legittimo: quello e' righe SENZA PREZZO».
#
# ── ⚠️ SI GUARDA `dr.prezzo_unitario`, NON IL COALESCE COL FULFILLMENT ─
#   Il punto 3 risale il prezzo alla riga d'ordine; qui NO, di proposito. Una
#   riga il cui prezzo e' solo DERIVATO non entra in vw_ddt_righe_iva_base
#   (che legge la sola colonna) e quindi non produce il riepilogo anonimo:
#   pretendere li' l'aliquota bloccherebbe un documento che non ha il difetto.
#   ⚠️ Che poi la vista NON conosca il fulfillment e' un'asimmetria vera —
#   un DDT da evasione ordine stampa un riepilogo IVA vuoto — ma e' un'altra
#   voce, di un altro perimetro (§8.3 del brief), e va curata insegnando il
#   COALESCE alla vista, non allargando questo punto.
#
# ── ⛔ NON SI RIUSA fn_check_ddt_riga_richiede_prezzo ─────────────────
#   Risponde a un'altra domanda — «questa riga appartiene a un documento che
#   VENDE?» — ed e' proprio la domanda che qui NON si pone. Riusarla
#   condizionerebbe il controllo alla causale, cioe' il difetto descritto sopra.
#
# ── ⚠️ L'ORDINE DELL'ARRAY E' IL CONTRATTO ───────────────────────────
#   script.fn_available_actions_ddt legge `v_motivi -> 0`, cioe' il PRIMO
#   motivo, e ne fa reason/reason_key del pulsante «Emetti» disabilitato. Il
#   punto nuovo va DOPO il prezzo e PRIMA degli indirizzi: struttura, intento,
#   valore della riga, testata, componenti. Un ordine non scritto e' un ordine
#   che il prossimo cambia senza accorgersene.
#
# ── ⚠️ LA reason_key E' UN DEBITO VERSO IL FRONTEND ──────────────────
#   `vendite.ddt.azione_reason.iva_mancante` — quinta della famiglia che questa
#   funzione gia' emette (causale_mancante, prezzo_non_risolvibile,
#   componenti_prezzo_pendente, componenti_non_valorizzati). Il testo (it + en)
#   lo mette il FE in frontend/src/locales, NELLO STESSO GIRO: una reason_key
#   emessa e assente dai locales e' un pulsante grigio col tooltip VUOTO, e
#   scripts/check_i18n_keys.py (controllo 4) fa fallire la CI.
#
# ⚠️ Corpo ripreso dalla doc auto-gen (l'oggetto VIVO), non da uno YAML.
#   Firma invariata, quindi CREATE OR REPLACE senza DROP.
# ------------------------------------------------------------

