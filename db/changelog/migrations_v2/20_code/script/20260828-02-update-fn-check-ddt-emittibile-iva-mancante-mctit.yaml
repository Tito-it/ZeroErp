      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Fase C (C-1) del brief-db-ddt-riconsegna-eredita-testata: sesto motivo di non
        emittibilita' — una riga attiva CON PREZZO e senza iva_id blocca l'emissione
        (E_DDT_RIGA_IVA_MANCANTE). Chiude un difetto silenzioso: vw_ddt_righe_iva_base filtra
        il prezzo e NON l'aliquota, quindi quella riga entrava nel riepilogo con imponibile
        pieno, codice IVA vuoto e imposta zero, su un documento stampato. ⭐ Il discrimine e'
