# ------------------------------------------------------------
# SPDX-License-Identifier: AGPL-3.0-or-later
# Liquibase changelog per Zero ERP
#
# Repair: ricrea le funzioni indirizzo perse durante la
# migrazione 20260311-01 (ALTER config.regioni.descrizione).
# Il CASCADE ha droppato funzioni che pg_depend non ha
# ripristinato correttamente.
#
# Ordine di creazione rispetta le dipendenze:
#   1. fn_get_indirizzi_by_ruolo    (vw_indirizzi_resolved_base)
#   2. fn_get_indirizzi_by_soggetto (vw_indirizzi_resolved_base, SETOF vw_..._soggetto)
#   3. fn_get_indirizzo_by_soggetto (vw_indirizzi_resolved_soggetto)
#   4. fn_get_indirizzo             (fn_get_indirizzi_by_ruolo + fn_get_indirizzo_by_soggetto)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260311-02-repair-recreate-fn-indirizzo-chain-mctit.yaml

  - changeSet:
      id: 20260311-02-repair-recreate-fn-indirizzo-chain
      author: mctit
      comment: "Repair: ricrea catena funzioni indirizzo perse dal CASCADE di 20260311-01"
      runOnChange: false
      failOnError: true
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |

              -- ==========================================================
              -- 1. fn_get_indirizzi_by_ruolo
              --    Restituisce indirizzi layer RUOLO da vw_indirizzi_resolved_base.
              --    Non applica fallback su soggetto.
              -- ==========================================================
              DROP FUNCTION if exists script.fn_get_indirizzi_by_ruolo(bigint);

              CREATE OR REPLACE FUNCTION script.fn_get_indirizzi_by_ruolo(
                p_soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE
              )
               RETURNS TABLE(
                 tipo_indirizzo       config.tipi_indirizzi.codice_interno%TYPE,
                 indirizzo_completo   text,
                 geoloc               geometry,
                 indirizzo_id         anagrafiche.indirizzi.id%TYPE,
                 soggetto_ruolo_id    anagrafiche.indirizzi.soggetto_ruolo_id%TYPE,
                 tipo_indirizzo_id    anagrafiche.indirizzi.tipo_indirizzo_id%TYPE,
                 indirizzo_dettaglio_id anagrafiche.indirizzi.indirizzo_dettaglio_id%TYPE,
                 indirizzo_libero     anagrafiche.indirizzi.indirizzo_libero%TYPE,
                 is_normalizzato      boolean,
                 stato_id             config.stati.id%TYPE,
                 stato_descrizione    config.stati.descrizione%TYPE,
                 stato_iso2           config.stati.codice_iso2%TYPE,
                 regione_id           config.regioni.id%TYPE,
                 regione_descrizione  config.regioni.descrizione%TYPE,
                 provincia_id         config.province.id%TYPE,
                 provincia_sigla      config.province.sigla%TYPE,
                 provincia_descrizione config.province.descrizione%TYPE,
                 comune_id            config.comuni.id%TYPE,
                 comune_descrizione   config.comuni.descrizione%TYPE,
                 codice_postale_id    config.codici_postali.id%TYPE,
                 cap_codice           config.codici_postali.codice%TYPE,
                 locality             anagrafiche.indirizzi.locality%TYPE,
                 administrative_area  anagrafiche.indirizzi.administrative_area%TYPE,
                 sublocality          anagrafiche.indirizzi.sublocality%TYPE,
                 postal_box           anagrafiche.indirizzi.postal_box%TYPE
               )
               LANGUAGE sql
               STABLE
              AS $function$
                -- Proiezione diretta dalla vista base, filtrata per scope RUOLO.
                -- Nessun fallback applicato: delegato a fn_get_indirizzo.
                SELECT
                  r.tipo_indirizzo_codice AS tipo_indirizzo,
                  r.indirizzo_display     AS indirizzo_completo,
                  r.geoloc,
                  r.indirizzo_id,
                  r.soggetto_ruolo_id,
                  r.tipo_indirizzo_id,
                  r.indirizzo_dettaglio_id,
                  r.indirizzo_libero,
                  r.is_normalizzato,
                  r.stato_id,
                  r.stato_descrizione,
                  r.stato_iso2,
                  r.regione_id,
                  r.regione_descrizione,
                  r.provincia_id,
                  r.provincia_sigla,
                  r.provincia_descrizione,
                  r.comune_id,
                  r.comune_descrizione,
                  r.codice_postale_id,
                  r.cap_codice,
                  r.locality,
                  r.administrative_area,
                  r.sublocality,
                  r.postal_box
                FROM anagrafiche.vw_indirizzi_resolved_base r
                WHERE r.scope = 'RUOLO'
                  AND r.soggetto_ruolo_id = p_soggetto_ruolo_id
                ORDER BY r.tipo_indirizzo_codice, r.indirizzo_id;
              $function$;

              COMMENT ON FUNCTION script.fn_get_indirizzi_by_ruolo(bigint) IS
                'Restituisce indirizzi del layer RUOLO (master) da vw_indirizzi_resolved_base; non applica fallback su soggetto.';

              -- ==========================================================
              -- 2. fn_get_indirizzi_by_soggetto
              --    Restituisce indirizzi layer SOGGETTO (identitario)
              --    da vw_indirizzi_resolved_base.
              --    RETURNS SETOF: tipi ereditati dalla vista.
              -- ==========================================================
              DROP FUNCTION if exists script.fn_get_indirizzi_by_soggetto(bigint);

              CREATE OR REPLACE FUNCTION script.fn_get_indirizzi_by_soggetto(
                p_soggetto_id  anagrafiche.soggetti.id%TYPE
              )
               RETURNS SETOF anagrafiche.vw_indirizzi_resolved_soggetto
               LANGUAGE sql
               STABLE
              AS $function$
                -- Proiezione diretta dalla vista base, filtrata per scope SOGGETTO.
                -- Ritorna SETOF vw_indirizzi_resolved_soggetto per compatibilità
                -- con fn_get_indirizzo_by_soggetto che applica fallback.
                SELECT r.*
                FROM anagrafiche.vw_indirizzi_resolved_base r
                WHERE r.scope = 'SOGGETTO'
                  AND r.soggetto_id = p_soggetto_id
                ORDER BY r.tipo_indirizzo_codice, r.indirizzo_id;
              $function$;

              COMMENT ON FUNCTION script.fn_get_indirizzi_by_soggetto(uuid) IS
                'Restituisce indirizzi del layer SOGGETTO (identitario) da vw_indirizzi_resolved_base.';

              -- ==========================================================
              -- 3. fn_get_indirizzo_by_soggetto
              --    Restituisce il miglior indirizzo per un soggetto,
              --    con fallback su matrice tipo_soggetto_dettaglio/tipo_indirizzo.
              --    RETURNS SETOF: tipi ereditati dalla vista.
              -- ==========================================================
              DROP FUNCTION if exists script.fn_get_indirizzo_by_soggetto(bigint, character varying);
              CREATE OR REPLACE FUNCTION script.fn_get_indirizzo_by_soggetto(
                p_soggetto_id   anagrafiche.soggetti.id%TYPE,
                p_tipo_codice   config.tipi_indirizzi.codice_interno%TYPE
              )
               RETURNS SETOF anagrafiche.vw_indirizzi_resolved_soggetto
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_tipo_soggetto_dettaglio_id anagrafiche.soggetti.tipo_soggetto_dettaglio_id%TYPE;
                v_current_codice config.tipi_indirizzi.codice_interno%TYPE := p_tipo_codice;
                v_current_tipo_id config.tipi_indirizzi.id%TYPE;
                v_fallback_tipo_id config.tipi_soggetto_dettaglio_tipi_indirizzo.fallback_tipo_indirizzo_id%TYPE;
                v_rows_found integer;
                v_visited_tipo_ids config.tipi_indirizzi.id%TYPE[] := '{}'::integer[];
              BEGIN
                -- Recupera tipo_soggetto_dettaglio per risolvere la matrice fallback
                SELECT s.tipo_soggetto_dettaglio_id
                INTO v_tipo_soggetto_dettaglio_id
                FROM anagrafiche.soggetti s
                WHERE s.id = p_soggetto_id;

                IF v_tipo_soggetto_dettaglio_id IS NULL THEN
                  RETURN;
                END IF;

                -- Loop con fallback: cerca indirizzo per tipo richiesto,
                -- se non trovato segue la catena fallback su
                -- config.tipi_soggetto_dettaglio_tipi_indirizzo
                LOOP
                  RETURN QUERY
                  SELECT *
                  FROM anagrafiche.vw_indirizzi_resolved_soggetto r
                  WHERE r.soggetto_id = p_soggetto_id
                    AND r.tipo_indirizzo_codice = v_current_codice;

                  GET DIAGNOSTICS v_rows_found = ROW_COUNT;
                  IF v_rows_found > 0 THEN
                    RETURN;
                  END IF;

                  -- Risolvi ID tipo indirizzo corrente
                  SELECT ti.id
                  INTO v_current_tipo_id
                  FROM config.tipi_indirizzi ti
                  WHERE ti.codice_interno = v_current_codice;

                  IF v_current_tipo_id IS NULL THEN
                    RETURN;
                  END IF;

                  -- Protezione anti-loop circolare
                  IF v_current_tipo_id = ANY (v_visited_tipo_ids) THEN
                    RETURN;
                  END IF;

                  v_visited_tipo_ids := array_append(v_visited_tipo_ids, v_current_tipo_id);

                  -- Cerca fallback nella matrice tipo_soggetto_dettaglio/tipo_indirizzo
                  SELECT m.fallback_tipo_indirizzo_id
                  INTO v_fallback_tipo_id
                  FROM config.tipi_soggetto_dettaglio_tipi_indirizzo m
                  WHERE m.tipo_soggetto_dettaglio_id = v_tipo_soggetto_dettaglio_id
                    AND m.tipo_indirizzo_id = v_current_tipo_id
                    AND m.attivo = TRUE
                    AND (m.valido_dal IS NULL OR m.valido_dal <= current_date)
                    AND (m.valido_al IS NULL OR m.valido_al >= current_date)
                  LIMIT 1;

                  IF v_fallback_tipo_id IS NULL THEN
                    RETURN;
                  END IF;

                  -- Passa al codice del tipo fallback per il prossimo ciclo
                  SELECT ti.codice_interno
                  INTO v_current_codice
                  FROM config.tipi_indirizzi ti
                  WHERE ti.id = v_fallback_tipo_id;

                  IF v_current_codice IS NULL THEN
                    RETURN;
                  END IF;
                END LOOP;
              END;
              $function$;

              -- ==========================================================
              -- 4. fn_get_indirizzo
              --    Policy indirizzi: master da RUOLO (con fallback tipo
              --    su matrice ruolo), fallback su SOGGETTO.
              --    Due livelli:
              --      1) RUOLO + catena fallback config.tipi_ruolo_tipi_indirizzo
              --      2) SOGGETTO via fn_get_indirizzo_by_soggetto
              -- ==========================================================

              DROP FUNCTION if exists script.fn_get_indirizzo(bigint, character varying);
              CREATE OR REPLACE FUNCTION script.fn_get_indirizzo(
                p_soggetto_ruolo_id  anagrafiche.soggetti_ruoli.id%TYPE,
                p_tipo_codice        config.tipi_indirizzi.codice_interno%TYPE
              )
               RETURNS TABLE(
                 tipo_indirizzo       config.tipi_indirizzi.codice_interno%TYPE,
                 indirizzo_completo   text,
                 geoloc               geometry,
                 indirizzo_id         anagrafiche.indirizzi.id%TYPE,
                 soggetto_ruolo_id    anagrafiche.indirizzi.soggetto_ruolo_id%TYPE,
                 tipo_indirizzo_id    anagrafiche.indirizzi.tipo_indirizzo_id%TYPE,
                 indirizzo_dettaglio_id anagrafiche.indirizzi.indirizzo_dettaglio_id%TYPE,
                 indirizzo_libero     anagrafiche.indirizzi.indirizzo_libero%TYPE,
                 is_normalizzato      boolean,
                 stato_id             config.stati.id%TYPE,
                 stato_descrizione    config.stati.descrizione%TYPE,
                 stato_iso2           config.stati.codice_iso2%TYPE,
                 regione_id           config.regioni.id%TYPE,
                 regione_descrizione  config.regioni.descrizione%TYPE,
                 provincia_id         config.province.id%TYPE,
                 provincia_sigla      config.province.sigla%TYPE,
                 provincia_descrizione config.province.descrizione%TYPE,
                 comune_id            config.comuni.id%TYPE,
                 comune_descrizione   config.comuni.descrizione%TYPE,
                 codice_postale_id    config.codici_postali.id%TYPE,
                 cap_codice           config.codici_postali.codice%TYPE,
                 locality             anagrafiche.indirizzi.locality%TYPE,
                 administrative_area  anagrafiche.indirizzi.administrative_area%TYPE,
                 sublocality          anagrafiche.indirizzi.sublocality%TYPE,
                 postal_box           anagrafiche.indirizzi.postal_box%TYPE
               )
               LANGUAGE plpgsql
               STABLE ROWS 10
              AS $function$
              DECLARE
                  v_tipo_ruolo_id      anagrafiche.soggetti_ruoli.tipo_ruolo_id%TYPE;
                  v_soggetto_id        anagrafiche.soggetti_ruoli.soggetto_id%TYPE;
                  v_current_codice     config.tipi_indirizzi.codice_interno%TYPE := p_tipo_codice;
                  v_current_tipo_id    config.tipi_indirizzi.id%TYPE;
                  v_fallback_tipo_id   config.tipi_ruolo_tipi_indirizzo.fallback_tipo_indirizzo_id%TYPE;
                  v_rows_found         integer;
                  v_visited_tipo_ids   config.tipi_indirizzi.id%TYPE[] := '{}'::integer[];
              BEGIN
                  -- Recupera soggetto e tipo ruolo dal soggetto_ruolo richiesto
                  SELECT sr.tipo_ruolo_id, sr.soggetto_id
                    INTO v_tipo_ruolo_id, v_soggetto_id
                  FROM anagrafiche.soggetti_ruoli sr
                  WHERE sr.id = p_soggetto_ruolo_id;

                  IF v_tipo_ruolo_id IS NULL THEN
                      RETURN;
                  END IF;

                  -- 1) MASTER: cerca indirizzi RUOLO per il tipo richiesto,
                  --    con fallback su matrice config.tipi_ruolo_tipi_indirizzo
                  LOOP
                      RETURN QUERY
                      SELECT
                          f.tipo_indirizzo,
                          f.indirizzo_completo,
                          f.geoloc,
                          f.indirizzo_id,
                          f.soggetto_ruolo_id,
                          f.tipo_indirizzo_id,
                          f.indirizzo_dettaglio_id,
                          f.indirizzo_libero,
                          f.is_normalizzato,
                          f.stato_id,
                          f.stato_descrizione,
                          f.stato_iso2,
                          f.regione_id,
                          f.regione_descrizione,
                          f.provincia_id,
                          f.provincia_sigla,
                          f.provincia_descrizione,
                          f.comune_id,
                          f.comune_descrizione,
                          f.codice_postale_id,
                          f.cap_codice,
                          f.locality,
                          f.administrative_area,
                          f.sublocality,
                          f.postal_box
                      FROM script.fn_get_indirizzi_by_ruolo(p_soggetto_ruolo_id) f
                      WHERE f.tipo_indirizzo = v_current_codice;

                      -- Se trovato, ritorna direttamente
                      GET DIAGNOSTICS v_rows_found = ROW_COUNT;
                      IF v_rows_found > 0 THEN
                          RETURN;
                      END IF;

                      -- Risolvi ID tipo indirizzo corrente
                      SELECT ti.id
                        INTO v_current_tipo_id
                      FROM config.tipi_indirizzi ti
                      WHERE ti.codice_interno = v_current_codice;

                      IF v_current_tipo_id IS NULL THEN
                          EXIT;
                      END IF;

                      -- Protezione anti-loop circolare
                      IF v_current_tipo_id = ANY (v_visited_tipo_ids) THEN
                          EXIT;
                      END IF;

                      v_visited_tipo_ids := array_append(v_visited_tipo_ids, v_current_tipo_id);

                      -- Cerca fallback nella matrice ruolo/tipo_indirizzo
                      SELECT m.fallback_tipo_indirizzo_id
                        INTO v_fallback_tipo_id
                      FROM config.tipi_ruolo_tipi_indirizzo m
                      WHERE m.tipo_ruolo_id = v_tipo_ruolo_id
                        AND m.tipo_indirizzo_id = v_current_tipo_id
                        AND m.attivo = TRUE
                        AND (m.valido_dal IS NULL OR m.valido_dal <= current_date)
                        AND (m.valido_al IS NULL OR m.valido_al >= current_date)
                      LIMIT 1;

                      IF v_fallback_tipo_id IS NULL THEN
                          EXIT;
                      END IF;

                      -- Passa al codice del tipo fallback per il prossimo ciclo
                      SELECT ti.codice_interno
                        INTO v_current_codice
                      FROM config.tipi_indirizzi ti
                      WHERE ti.id = v_fallback_tipo_id;

                      IF v_current_codice IS NULL THEN
                          EXIT;
                      END IF;
                  END LOOP;

                  -- 2) FALLBACK: se RUOLO non ha risultati, cerca su layer SOGGETTO
                  --    tramite fn_get_indirizzo_by_soggetto (con propria catena fallback)
                  RETURN QUERY
                  SELECT
                      r.tipo_indirizzo_codice         AS tipo_indirizzo,
                      r.indirizzo_display             AS indirizzo_completo,
                      r.geoloc,
                      r.indirizzo_id,
                      p_soggetto_ruolo_id             AS soggetto_ruolo_id,
                      r.tipo_indirizzo_id,
                      r.indirizzo_dettaglio_id,
                      r.indirizzo_libero,
                      r.is_normalizzato,
                      r.stato_id,
                      r.stato_descrizione,
                      r.stato_iso2,
                      r.regione_id,
                      r.regione_descrizione,
                      r.provincia_id,
                      r.provincia_sigla,
                      r.provincia_descrizione,
                      r.comune_id,
                      r.comune_descrizione,
                      r.codice_postale_id,
                      r.cap_codice,
                      r.locality,
                      r.administrative_area,
                      r.sublocality,
                      r.postal_box
                  FROM script.fn_get_indirizzo_by_soggetto(v_soggetto_id, p_tipo_codice) r;

                  RETURN;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_indirizzo(bigint, character varying) IS
                'Policy indirizzi: usa indirizzi RUOLO come master (con fallback tipo su matrice ruolo) e, se assenti, fallback su indirizzi SOGGETTO.';
