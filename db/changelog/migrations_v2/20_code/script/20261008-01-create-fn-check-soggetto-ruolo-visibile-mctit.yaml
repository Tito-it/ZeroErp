# script.fn_check_soggetto_ruolo_visibile: IL SOGGETTO-RUOLO C'E', PER CHI GUARDA?
#   Brief: brief-db-codici-non-trovato-email-e-permessi §5 (R-4, E-10)
#
# ── IL DIFETTO ───────────────────────────────────────────────────
#   La ricerca universale ha due livelli: la lista
#   (fn_search_soggetti_universale) e il dettaglio (fn_get_search_detail).
#   Il dettaglio non diceva mai «non c'e'», e tutte e due filtravano i clienti
#   a mano (fn_get_emittenti_scope_sr_effettivo + fn_check_ba_visible_for_emittenti)
#   quando anagrafiche.clienti ha la sua RLS armata dal 20260910-41: una
#   seconda copia della regola della policy, scritta in un altro modo.
#
# ── COSA FA ──────────────────────────────────────────────────────
#   La domanda che lista e dettaglio devono fare UGUALE: un soggetto-ruolo
#   si mostra a chi guarda?
#     * ruolo CL: se ha almeno un cliente che la RLS gli restituisce. Il
#       cliente e' una faccia del billing account e ne eredita il perimetro
#       dell'emittente: la regola sta nella policy, qui non si ripete.
#     * gli altri ruoli: se il soggetto-ruolo esiste. soggetti, soggetti_ruoli
#       e fornitori non portano un emittente nel modello: non c'e' un
#       perimetro da applicare.
#   ⭐ Regola del 2: la usano la lista (filtro di riga) e il dettaglio
#     (verifica d'esistenza, -02). Una sede sola, quindi lista e dettaglio
#     non possono dissentire su chi si vede.
#
# ⚠️ SECURITY INVOKER e LANGUAGE sql, di proposito: la RLS di clienti deve
#   valere con l'identita' di chi chiama (una DEFINER del migratore leggerebbe
#   oltre la policy), e una sql semplice il planner la puo' espandere nella
#   query della lista.
#
# Ritorno indietro: DROP (dopo aver riportato -02 e -03 alla revisione
# precedente, che non la chiamano).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261008-01-create-fn-check-soggetto-ruolo-visibile-mctit.yaml

  - changeSet:
      id: 20261008-01-create-fn-check-soggetto-ruolo-visibile
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        Nasce script.fn_check_soggetto_ruolo_visibile: un soggetto-ruolo si mostra
        nella ricerca universale se esiste e, per il ruolo CL, se ha almeno un
        cliente che la RLS restituisce a chi guarda. La leggono la lista e il
        dettaglio della ricerca.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_check_soggetto_ruolo_visibile(
                  p_soggetto_ruolo_id anagrafiche.soggetti_ruoli.id%TYPE)
              RETURNS boolean
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- Convenzione fn_check_*: pura, boolean, nessun raise.
                  -- ⚠️ Il perimetro dei clienti NON e' scritto qui: lo applica la
                  --   RLS di anagrafiche.clienti (rls_clienti_ef_whitelist per
                  --   l'operatore, le due vesti cliente per portale e shop).
                  --   Questa funzione chiede solo «ne resta almeno uno?».
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.soggetti_ruoli sr
                        JOIN config.tipi_ruoli tr ON tr.id = sr.tipo_ruolo_id
                       WHERE sr.id = p_soggetto_ruolo_id
                         AND (tr.codice_interno <> 'CL'
                              OR EXISTS (SELECT 1
                                           FROM anagrafiche.clienti cl
                                          WHERE cl.soggetto_ruolo_id = sr.id)))
              $function$;

              COMMENT ON FUNCTION script.fn_check_soggetto_ruolo_visibile(anagrafiche.soggetti_ruoli.id%TYPE)
              IS 'Check pura (boolean, nessun raise): il soggetto-ruolo si mostra a chi guarda nella ricerca universale? Ruolo CL: si'' se ha almeno un cliente che la RLS di anagrafiche.clienti gli restituisce — il perimetro dell''emittente sta nella policy, qui non si ripete. Altri ruoli: si'' se il soggetto-ruolo esiste — soggetti, soggetti_ruoli e fornitori non portano un emittente nel modello, quindi non c''e'' un perimetro da applicare (scelta di modello, non residuo). Soggetto-ruolo inesistente o NULL: false. SECURITY INVOKER: la RLS vale con l''identita'' di chi chiama. Lettori: script.fn_search_soggetti_universale (filtro di riga) e script.fn_get_search_detail (verifica d''esistenza): lista e dettaglio non possono dissentire su chi si vede. ⚠️ Effetto voluto: un soggetto-ruolo CL senza nessun cliente non compare per nessuno, nemmeno per il super admin. Nasce il 2026-10-08, brief-db-codici-non-trovato-email-e-permessi §5 (R-4, decisione di Tid).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_soggetto_ruolo_visibile(anagrafiche.soggetti_ruoli.id%TYPE);
