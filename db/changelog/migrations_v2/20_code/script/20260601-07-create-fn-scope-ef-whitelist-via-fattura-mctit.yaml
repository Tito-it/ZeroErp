databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260601-07-create-fn-scope-ef-whitelist-via-fattura-mctit.yaml

  - changeSet:
      id: 20260601-07-create-fn-scope-ef-whitelist-via-fattura
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Adapter "via fattura" per lo scope EF_WHITELIST (brief RLS §2/§4):
        per tabelle figlie di vendite.fatture senza colonna emittente propria
        (es. vendite.fatture_scadenze) risolve l'emittente attraverso la
        fattura collegata e delega all'adapter SR. Speculare a
        fn_scope_ba_ownership_via_fattura. Evita subquery inline nelle policy
        (§10.3 linee-guida-sql). LANGUAGE sql STABLE per inlining.
      preConditions:
        - onFail: HALT
        - and:
          - tableExists: { schemaName: vendite, tableName: fatture }
          - sqlCheck:
              expectedResult: 1
              sql: |
                SELECT COUNT(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                 WHERE n.nspname = 'script'
                   AND p.proname = 'fn_scope_ef_whitelist_via_sr';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Firma con %TYPE sul parametro fattura:
              --   p_auth_user_id = django.auth_user.id (GUC app.current_user_id)
              --   p_fattura_id   = vendite.fatture.id
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_fattura(
                  p_auth_user_id integer,
                  p_fattura_id   vendite.fatture.id%TYPE
              )
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  -- Risolve fattura -> emittente_soggetto_ruolo_id e delega
                  -- all'adapter SR. Fattura inesistente -> SR NULL -> false
                  -- (fail-closed se whitelist valorizzata).
                  SELECT script.fn_scope_ef_whitelist_via_sr(
                      p_auth_user_id,
                      (SELECT f.emittente_soggetto_ruolo_id
                         FROM vendite.fatture f
                        WHERE f.id = p_fattura_id)
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_fattura(
                  integer,
                  vendite.fatture.id%TYPE
              ) IS
                  'Adapter via-fattura dello scope EF_WHITELIST: risolve '
                  'l''emittente attraverso vendite.fatture e delega a '
                  'fn_scope_ef_whitelist_via_sr (-> canonica). Per tabelle figlie '
                  'senza colonna emittente propria (es. vendite.fatture_scadenze). '
                  'STABLE, inlineable.';
      rollback:
        - sql:
            sql: |
              DROP FUNCTION IF EXISTS script.fn_scope_ef_whitelist_via_fattura(integer, bigint);
