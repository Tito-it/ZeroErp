# D-1 — Gli adattatori di scope per la famiglia DDT.
#   Brief: brief-db-perimetro-emittente-righe-documento.md §4
#   Slice 20260909-36..38 (helper -> policy inerti -> armamento).
#   Precedenti: PREVENTIVI (20260909-27..30), ORDINI (20260909-33..35).
#
# ── ⛔ IL DIFETTO, DETTO SUL MODELLO ──────────────────────────────────
#   Una riga di documento appartiene all'emittente della sua testata.
#   `vendite.ddt` e' protetta dal 2026-07-09 (`rls_ddt_ef_whitelist`); i suoi
#   quattro satelliti non hanno nessuna policy e `zeroerp_app` ha su tutti
#   SELECT, INSERT, UPDATE e DELETE. Il perimetro si ferma alla testata.
#
# ── ⭐ UNA VESTE SOLA, E VA DETTO PERCHE' ─────────────────────────────
#   `vendite.ddt` porta UNA policy — `OPERATORE`, `FOR ALL`, perimetro
#   emittente. Non tre come `vendite.ordini`. ⇒ Qui i satelliti rispecchiano
#   una veste, e non e' una semplificazione: e' la stessa regola della slice
#   ordini applicata a una testata che di vesti ne ha una. La regola resta
#   «il satellite rispecchia TUTTE le vesti della propria testata».
#   ⚠️ Il giorno in cui `vendite.ddt` ricevesse una veste cliente — il portale
#   che mostra i propri DDT — questa slice andrebbe estesa nello stesso gesto,
#   o i satelliti resterebbero indietro rispetto al documento.
#
# ── Le due funzioni, e perche' sono due ───────────────────────────────
#   I satelliti stanno su due livelli e portano chiavi diverse:
#     * `ddt_righe`, `ddt_indirizzi`, `note_ddt` puntano alla TESTATA
#       (`ddt_id`, `target_id`)                       -> `_via_ddt`
#     * `ddt_righe_componenti` punta alla RIGA (`riga_ddt_id`) -> `_via_ddt_riga`
#   La seconda delega alla prima invece di ripetere la risalita: la regola
#   «come un DDT nomina il proprio emittente» resta scritta in un posto solo.
#   ⚠️ Tutte quelle FK sono `NOT NULL` (verificato 2026-09-09): nessun ramo con
#   la chiave nulla, quindi nessun buco esatto dove il NULL passa.
#
# ── ⚠️ LA POSTURA ────────────────────────────────────────────────────
#   `STABLE`, `LANGUAGE sql`, e NON `SECURITY DEFINER` — la stessa dei
#   `script.fn_scope_*` gia' in servizio. Una policy che chiamasse una funzione
#   `SECURITY DEFINER` guarderebbe con gli occhi dell'owner, che la RLS non
#   vede: il filtro passerebbe sempre, e in silenzio.
#
# ⭐ La risalita e' corta: `vendite.ddt` porta `emittente_fiscale_id`, che e'
#   esattamente cio' che `script.fn_scope_ef_whitelist` accetta. E' `fatture`
#   il caso lungo, perche' porta `emittente_soggetto_ruolo_id` e deve passare
#   dall'adattatore `_via_sr`.
#
# Permessi: funzioni di titodb, non in dbops.sec_functions_owner, nessun GRANT
# esplicito (l'ALTER DEFAULT PRIVILEGES di provision_db_roles copre EXECUTE).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260909-36-create-fn-scope-ef-whitelist-via-ddt-mctit.yaml

  - changeSet:
      id: 20260909-36-create-fn-scope-ef-whitelist-via-ddt
      author: mctit
      runOnChange: false
      comment: >
        Adattatori di scope per la famiglia ddt:
        script.fn_scope_ef_whitelist_via_ddt(auth_user_id, ddt_id) e
        script.fn_scope_ef_whitelist_via_ddt_riga(auth_user_id, riga_id), che
        risalgono alla testata e delegano alla canonica fn_scope_ef_whitelist.
        Nessuna policy li usa ancora: le crea 20260909-37.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_ddt(
                  p_auth_user_id integer,
                  p_ddt_id       vendite.ddt.id%TYPE
              )
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: dire se l'operatore ha nel proprio perimetro
                  --   l'emittente del DDT indicato.
                  -- ⚠️ DDT inesistente -> emittente NULL -> la canonica
                  --   risponde false quando la whitelist e' valorizzata:
                  --   fail-closed, come per preventivi e ordini.
                  SELECT script.fn_scope_ef_whitelist(
                      p_auth_user_id,
                      (SELECT d.emittente_fiscale_id
                         FROM vendite.ddt d
                        WHERE d.id = p_ddt_id)
                  );
              $function$;

              CREATE OR REPLACE FUNCTION script.fn_scope_ef_whitelist_via_ddt_riga(
                  p_auth_user_id integer,
                  p_riga_id      vendite.ddt_righe.id%TYPE
              )
               RETURNS boolean
               LANGUAGE sql
               STABLE
              AS $function$
                  -- Scopo: come sopra, ma partendo da una RIGA di DDT — e' la
                  --   chiave che porta vendite.ddt_righe_componenti.
                  -- ⭐ Delega alla sorella invece di ripetere la risalita: se un
                  --   giorno cambia il modo in cui un DDT nomina il proprio
                  --   emittente, si corregge in un posto solo.
                  SELECT script.fn_scope_ef_whitelist_via_ddt(
                      p_auth_user_id,
                      (SELECT r.ddt_id
                         FROM vendite.ddt_righe r
                        WHERE r.id = p_riga_id)
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_ddt(integer, bigint)
              IS 'Adattatore di scope per i satelliti di vendite.ddt: risale dalla chiave della testata a `emittente_fiscale_id` e delega a script.fn_scope_ef_whitelist. STABLE e NON security definer, come gli altri fn_scope_*: una funzione security definer dentro una policy guarderebbe con gli occhi dell''owner, che la RLS non vede. DDT inesistente -> emittente NULL -> false a whitelist valorizzata (fail-closed). Brief: brief-db-perimetro-emittente-righe-documento.md';

              COMMENT ON FUNCTION script.fn_scope_ef_whitelist_via_ddt_riga(integer, bigint)
              IS 'Come fn_scope_ef_whitelist_via_ddt ma a partire da una riga di DDT: e'' la chiave che porta vendite.ddt_righe_componenti. Delega alla sorella invece di ripetere la risalita alla testata.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_scope_ef_whitelist_via_ddt_riga(integer, bigint);
              DROP FUNCTION IF EXISTS script.fn_scope_ef_whitelist_via_ddt(integer, bigint);
