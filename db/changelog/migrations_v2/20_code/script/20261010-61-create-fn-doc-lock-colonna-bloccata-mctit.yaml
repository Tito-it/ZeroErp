# NUOVO: script.fn_doc_lock_colonna_bloccata(p_regola, p_stato, p_colonne)
#   La DECISIONE dei due building block «si tocca solo in bozza»: con il
#   documento in questo stato, quale di queste colonne il montaggio non
#   lascia cambiare?
#   Brief: brief-db-testata-dopo-emissione (fase 1, §5-bis, R-1 e D-F2)
#
# -- PERCHE' ------------------------------------------------------------
#   La regola («in bozza tutto; fuori, le colonne ammesse negli stati
#   ammessi») la applicano il trigger, a ogni scrittura, e la capability,
#   per spegnere il verbo prima dell'errore. Scritta due volte, al primo
#   stato o alla prima colonna nuova risponderebbe in due modi. Qui sta una
#   volta: la chiamano i due building block (20261010-64, -65) e la check
#   generica script.fn_doc_colonna_modificabile (20261010-63).
#
# -- LA DECISIONE ------------------------------------------------------
#   Restituisce NULL se il montaggio lascia passare, altrimenti la PRIMA
#   colonna che ferma ('*' = la riga intera).
#   * montaggio sbagliato (errore nella regola): '*', non passa niente;
#   * stato = stato bozza: NULL, tutto si tocca;
#   * p_stato NULL vale «fuori bozza, in nessuno stato ammesso»: ferma ogni
#     colonna che il montaggio nomina. Il trigger della testata lo usa per
#     sapere, senza leggere lo stato, se una colonna nominata cambia;
#   * RIGHE (allowlist, una colonna nuova nasce chiusa):
#       p_colonne NULL = INSERT o DELETE, la riga intera: '*';
#       stato fuori da stati_ammessi: la prima colonna non tecnica, o '*'
#       se non ne cambia nessuna (un UPDATE fuori bozza e fuori
#       dall'eccezione si rifiuta anche se non cambia niente: e' la forma
#       di prima, 20261008-89);
#       stato in stati_ammessi: la prima colonna che non e' ammessa ne'
#       tecnica, o NULL;
#   * TESTATA (le colonne nominate, nell'ordine del montaggio): la prima che
#     cambia e il cui stati_ammessi non contiene lo stato; le altre colonne
#     sono libere. p_colonne NULL = tutte.
#
#   Tipi nudi dichiarati: p_regola e' l'uscita di script.fn_doc_lock_regola;
#   p_stato e' il codice_interno di sei vocabolari diversi (polimorfo, come
#   in script.fn_get_stato_testata_documento); p_colonne sono nomi di
#   colonna di tabelle diverse. jsonb_exists al posto dell'operatore `?`:
#   la stessa forma vale in Liquibase e nei pgTAP.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261010-61-create-fn-doc-lock-colonna-bloccata-mctit.yaml

  - changeSet:
      id: 20261010-61-create-fn-doc-lock-colonna-bloccata
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Nuovo BB script.fn_doc_lock_colonna_bloccata: la decisione dei due building block «solo in
        bozza» per stato e colonne, letta da trigger e capability. Brief: brief-db-testata-dopo-emissione (R-1).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_doc_lock_colonna_bloccata(
                  p_regola  jsonb,
                  p_stato   text,
                  p_colonne text[]
              )
              RETURNS text
              LANGUAGE plpgsql
              IMMUTABLE PARALLEL SAFE
              SECURITY INVOKER
              AS $function$
              -- ⚠️ Tipi nudi DICHIARATI: p_regola e' l'uscita di
              --   script.fn_doc_lock_regola; p_stato e' il codice_interno di
              --   sei vocabolari di stato diversi (polimorfo); p_colonne e il
              --   risultato sono nomi di colonna di tabelle diverse.
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Con il documento in p_stato, quale delle colonne
                --   p_colonne il montaggio non lascia cambiare? NULL = passa;
                --   altrimenti la prima che ferma, '*' = la riga intera.
                --   E' la decisione dei due building block «si tocca solo
                --   in bozza»: la usano il trigger e la capability, che
                --   cosi' non possono rispondere in due modi.
                -- =========================================================

                -- Un montaggio sbagliato non lascia passare niente.
                IF p_regola IS NULL OR p_regola ->> 'errore' IS NOT NULL THEN
                  RETURN '*';
                END IF;

                -- In bozza tutto si tocca. Uno stato NULL non e' la bozza.
                IF p_stato = p_regola ->> 'stato_bozza' THEN
                  RETURN NULL;
                END IF;

                IF p_regola ->> 'building_block' = 'RIGHE' THEN
                  -- La riga intera (INSERT, DELETE): nessuna eccezione.
                  IF p_colonne IS NULL THEN
                    RETURN '*';
                  END IF;

                  -- Fuori dagli stati dell'eccezione non cambia niente,
                  -- nemmeno un UPDATE che non tocca colonne.
                  IF p_stato IS NULL
                     OR NOT jsonb_exists(p_regola -> 'stati_ammessi', p_stato) THEN
                    RETURN COALESCE(
                      (SELECT c
                         FROM unnest(p_colonne) WITH ORDINALITY AS u(c, k)
                        WHERE NOT jsonb_exists(p_regola -> 'colonne_tecniche', c)
                        ORDER BY k
                        LIMIT 1),
                      '*');
                  END IF;

                  -- Nello stato dell'eccezione: solo le colonne ammesse (e
                  -- quelle tecniche, che scrive l'audit).
                  RETURN (SELECT c
                            FROM unnest(p_colonne) WITH ORDINALITY AS u(c, k)
                           WHERE NOT jsonb_exists(p_regola -> 'colonne_ammesse', c)
                             AND NOT jsonb_exists(p_regola -> 'colonne_tecniche', c)
                           ORDER BY k
                           LIMIT 1);
                END IF;

                IF p_regola ->> 'building_block' = 'TESTATA' THEN
                  -- Le colonne nominate, nell'ordine del montaggio: la prima
                  -- che cambia e che in questo stato non e' aperta. Le altre
                  -- colonne della testata sono libere.
                  RETURN (SELECT e ->> 'colonna'
                            FROM jsonb_array_elements(p_regola -> 'colonne') WITH ORDINALITY AS x(e, k)
                           WHERE (p_colonne IS NULL OR (e ->> 'colonna') = ANY (p_colonne))
                             AND (p_stato IS NULL
                                  OR NOT jsonb_exists(e -> 'stati_ammessi', p_stato))
                           ORDER BY k
                           LIMIT 1);
                END IF;

                -- Una regola che non sa leggere: non passa niente.
                RETURN '*';
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_doc_lock_colonna_bloccata(jsonb, text, text[])
              IS 'Building block (2026-10-10, brief-db-testata-dopo-emissione fase 1, R-1): la DECISIONE dei due building block «si tocca solo in bozza». Con il documento in p_stato (codice_interno), quale delle colonne p_colonne il montaggio p_regola (uscita di script.fn_doc_lock_regola) non lascia cambiare? NULL = passa; altrimenti la prima che ferma, ''*'' = la riga intera. Montaggio sbagliato: ''*''. Stato bozza: NULL. p_stato NULL = fuori bozza in nessuno stato ammesso. RIGHE: p_colonne NULL (INSERT, DELETE) = ''*''; fuori dagli stati ammessi la prima colonna non tecnica, o ''*'' anche se non ne cambia nessuna; negli stati ammessi la prima colonna che non e'' ammessa ne'' tecnica (data_update, user_update, tx_id). TESTATA: la prima colonna nominata dal montaggio (nel suo ordine) che cambia e che nello stato non e'' aperta; le colonne non nominate sono libere; p_colonne NULL = tutte. La chiamano vendite.trgfn_doc_righe_lock_fuori_bozza, vendite.trgfn_doc_testata_lock_fuori_bozza e script.fn_doc_colonna_modificabile: trigger e capability decidono con la stessa funzione. IMMUTABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_doc_lock_colonna_bloccata(jsonb, text, text[]);
