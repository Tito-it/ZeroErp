# C-1 — I MOTIVI DELL'USCITA DAL GIRO PORTANO I LORO `valori`
#
# ── ⭐ PERCHE' LA CHECK DEVE EMETTERE `valori` ─────────────────────
#   Nel pattern §12.5 la check sa QUALE codice ha scelto; la frase la componeva
#   il CHIAMANTE, con un numero FISSO di valori presi dai propri dati. Le due
#   cose non erano legate da niente: un motivo nuovo con un'altra forma di
#   frase non fa fallire nulla, esce solo una frase sbagliata.
#   ⇒ Chi sceglie il codice sceglie anche cosa ci va dentro. E' la stessa
#   ragione di §12.5.2 per il predicato, applicata al messaggio.
#
# ── ⚠️ L'ORDINE DEI `valori` E' IL CONTRATTO DELLA FRASE ──────────
#   Non si verifica contando i segnaposto: si verifica LEGGENDO la frase resa.
#   Il precedente e' del 2026-09-01 su E_REGISTRO_SERIE_NON_AMMESSA — arita'
#   giusta, valori invertiti, «Registro X1» a video con la serie al posto della
#   famiglia. Nessun cancello lo vide.
#
#
# ── 🔴 E QUI C'ERA UN DIFETTO VIVO, non un rischio ─────────────────
#   vendite.fn_escludi_documento_da_giro passava `p_gruppo_key` come PRIMO
#   valore — giusto per i motivi 2, 3 e 4, che cominciano tutti con «Il
#   documento %s». Ma il MOTIVO 1 e' E_LOTTO_NON_PRE_FISCALE, «Il lotto e'
#   oltre lo stato pre-fiscale (stato attuale: %s)»: a video usciva il gruppo
#   del documento al posto dello stato del lotto.
#   ⚠️ Ed e' il motivo che sta PRIMO nell'array, cioe' quello che la madre
#   solleva sul percorso piu' comune. Arita' giusta, frase falsa, nessun rosso:
#   il pgTAP del sito asserisce `throws_ok(..., 'P0001', NULL, ...)`, che la
#   frase non la guarda.
#
# ⛔ Nessun codice errore nuovo, nessun `reason` toccato, nessun motivo
#   riordinato: si AGGIUNGE una chiave.
# ⚠️ Questo changeSet da solo NON basta: fa entrare il suo sito nel perimetro
#   del rubinetto (test 2 di test-rubinetto-primo-motivo-v1.sql), che pretende
#   zero code scritte a mano. Va nella STESSA consegna dei changeSet C-2.
#
# ⭐ Il corpo e' quello VIVO (pg_get_functiondef), non ricostruito da uno YAML.
# Brief: brief-db-i-motivi-si-fermano-dentro-la-check.md (C-1)
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260909-02-update-fn-check-documento-escludibile-da-giro-emette-valori-mctit.yaml

  - changeSet:
      id: 20260909-02-update-fn-check-documento-escludibile-da-giro-emette-valori
      author: mctit
      failOnError: true
      comment: >
        script.fn_check_documento_escludibile_da_giro: i quattro motivi emettono `valori`. Ripara la frase di E_LOTTO_NON_PRE_FISCALE, che riceveva il gruppo del documento al posto dello stato del lotto.
      preConditions:
        - onFail: HALT
        - and:
            - sqlCheck:
                expectedResult: 1
                sql: >-
                  SELECT count(*) FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_documento_escludibile_da_giro'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_documento_escludibile_da_giro(p_lotto_id bigint, p_gruppo_key text)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono di togliere UN documento
              --        dal giro di fatturazione. Funzione PURA (fn_check_*):
              --        nessun raise di dominio, nessuna scrittura.
              -- Consumatori: vendite.fn_escludi_documento_da_giro (solleva il
              --        codice del PRIMO motivo) e il frontend, per spiegare
              --        invece di far fallire.
              -- Ritorna: [] se il documento si puo' togliere; altrimenti array
              --        ORDINATO di {codice, reason, reason_key, dettaglio}.
              DECLARE
                  v_motivi        jsonb := '[]'::jsonb;
                  v_lotto_trovato boolean;
                  v_lotto_stato   config.stati_doc_fiscale.codice_interno%TYPE;
                  v_lotto_congela config.stati_doc_fiscale.congela_fiscale%TYPE;
                  v_esito         vendite.fatturazione_lotti_esiti.stato_esecuzione%TYPE;
              BEGIN
                  -- Guard parametri: id assenti o non validi sono errori di
                  -- programmazione, non condizioni di dominio.
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_documento_escludibile_da_giro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio (> 0)');
                  END IF;

                  IF COALESCE(btrim(p_gruppo_key), '') = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_documento_escludibile_da_giro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_gruppo_key', 'valore', p_gruppo_key),
                          NULL::uuid, 'p_gruppo_key obbligatorio');
                  END IF;

                  -- Stato del LOTTO per codice_interno: la chiave stabile e' quella,
                  -- l'id no. LEFT JOIN perche' un lotto senza stato deve arrivare al
                  -- confronto e fallirlo, non sparire.
                  SELECT true, sdf.codice_interno, sdf.congela_fiscale
                    INTO v_lotto_trovato, v_lotto_stato, v_lotto_congela
                    FROM vendite.fatturazione_lotti fl
                    LEFT JOIN config.stati_doc_fiscale sdf ON sdf.id = fl.stato_doc_fiscale_id
                   WHERE fl.id = p_lotto_id;

                  IF NOT COALESCE(v_lotto_trovato, false) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_documento_escludibile_da_giro', 'E_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::text);
                  END IF;

                  -- MOTIVO 1 — il LOTTO e' oltre il pre-fiscale.
                  -- ⚠️ Fail-closed: con lo stato non risolvibile si blocca, come
                  --    fa la sorella. Non sapere in che stato e' il giro non e'
                  --    un buon motivo per lasciarci mettere le mani.
                  IF COALESCE(v_lotto_congela, true) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_NON_PRE_FISCALE',
                          'reason',     'STATO_LOTTO_NON_PRE_FISCALE',
                          'reason_key', 'vendite.lotti.azione_reason.lotto_non_pre_fiscale',
                          'dettaglio',  COALESCE(v_lotto_stato, '-'),
                          -- ⭐ «Il lotto e' oltre lo stato pre-fiscale (stato attuale: %s)»:
                          --   ci va lo STATO. Fino al 2026-09-09 la madre passava per primo
                          --   p_gruppo_key — giusto per i motivi 2-4, che cominciano con «Il
                          --   documento %s», e a video usciva il gruppo al posto dello stato.
                          --   Arita' giusta, frase falsa: nessun cancello lo vedeva.
                          'valori',     jsonb_build_array(COALESCE(v_lotto_stato, '-')));
                  END IF;

                  SELECT e.stato_esecuzione
                    INTO v_esito
                    FROM vendite.fatturazione_lotti_esiti e
                   WHERE e.lotto_id = p_lotto_id
                     AND e.gruppo_key = p_gruppo_key;

                  -- MOTIVO 2 — il documento non e' fra gli esiti di questo lotto.
                  -- ⚠️ Precede i due seguenti per costruzione: senza la riga non
                  --    si puo' parlare del suo stato.
                  IF v_esito IS NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_DOC_SENZA_ESITO',
                          'reason',     'SENZA_ESITO',
                          'reason_key', 'vendite.lotti.azione_reason.documento_senza_esito',
                          'dettaglio',  p_gruppo_key,
                          'valori',     jsonb_build_array(p_gruppo_key));

                  -- MOTIVO 3 — e' gia' uscito.
                  -- ⚠️ PRECEDE il motivo 4, e la precedenza e' portante: un
                  --    documento ESCLUSO e' ANCHE «non in errore», quindi senza
                  --    questo ramo scatterebbero tutti e due e la madre
                  --    solleverebbe quello sbagliato.
                  ELSIF v_esito = 'ESCLUSO' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_DOC_GIA_USCITO',
                          'reason',     'GIA_USCITO',
                          'reason_key', 'vendite.lotti.azione_reason.documento_gia_uscito',
                          'dettaglio',  p_gruppo_key,
                          'valori',     jsonb_build_array(p_gruppo_key));

                  -- MOTIVO 4 — non e' in errore (D-4): dal giro si tolgono solo i
                  -- documenti che hanno fallito.
                  ELSIF v_esito <> 'ERRORE' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_DOC_NON_IN_ERRORE',
                          'reason',     'DOCUMENTO_NON_IN_ERRORE',
                          'reason_key', 'vendite.lotti.azione_reason.documento_non_in_errore',
                          'dettaglio',  v_esito,
                          'valori',     jsonb_build_array(p_gruppo_key, v_esito));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
