# script.fn_available_actions_commessa — la terza destinazione porta il proprio
#   verdetto (brief-db-emittibilita-visibile-e-sbloccabile.md §3.3).
#
# COSA CAMBIA. Il CASE che assegna enabled/reasons conosceva due destinazioni
#   (CHIUSA, ANNULLATA); adesso ne conosce tre. Con la transizione verso
#   PRONTA_FATTURAZIONE dichiarata manuale (changeSet 20260804-28) il bottone
#   «Rendi pronta» compare, e deve nascere gia' spento quando la commessa non
#   e' pronta — con scritto il perche', non solo il fatto.
#
# ⚠️ NESSUNA REGOLA NUOVA QUI DENTRO. Il verdetto arriva da
#   fn_check_commessa_pronta_fatturazione, la stessa che
#   vendite.trgfn_commesse_guard_transizione usa per sollevare. E' l'invariante
#   del §3.4 caso 4 del brief: bottone e guard devono dire la stessa cosa sullo
#   stesso documento, e l'unico modo per garantirlo e' che leggano la stessa
#   funzione — non due implementazioni «uguali».
#
# ℹ️ can_change_state continua a contare solo le azioni ABILITATE, quindi una
#   commessa bloccata non dichiara di poter cambiare stato solo perche' il
#   bottone e' in lista. Invariato.
#
# ℹ️ Le tre funzioni pure vengono chiamate una volta sola all'inizio, anche
#   quando la destinazione non e' fra quelle disponibili: sono STABLE e
#   leggono poche righe indicizzate, e il codice resta leggibile.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260804-27-update-fn-available-actions-commessa-rendi-pronta-mctit.yaml

  - changeSet:
      id: 20260804-27-update-fn-available-actions-commessa-rendi-pronta
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_commessa espone enabled/reasons anche per
        l'azione verso PRONTA_FATTURAZIONE, leggendo la stessa funzione pura
        del guard di transizione. Nessuna regola duplicata.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 2
            sql: >
              SELECT count(*) FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'script'
                AND p.proname IN ('fn_check_commessa_pronta_fatturazione',
                                  'fn_available_actions_commessa')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_commessa(
                  p_commessa_id vendite.commesse.id%TYPE
              )
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo:
              --   Capability della commessa per il detail/stato API. Mirror
              --   data-driven di fn_available_actions_ordine, senza azioni
              --   applicative (solo stato). Le transizioni utente
              --   (meta.manuale=true + action_key/label_key) sono esposte come
              --   bottoni; le automatiche no.
              --   rev 2026-07-24: + enabled/reasons su chiudi/annulla, dalle
              --   funzioni pure script.fn_check_commessa_chiudibile /
              --   _annullabile — le STESSE che
              --   vendite.trgfn_commesse_guard_transizione usa per sollevare
              --   (sorgente unica: la UI non puo' divergere dal guard).
              --   rev 2026-08-04: stessa cosa per l'ingresso in
              --   PRONTA_FATTURAZIONE, che da oggi e' un'azione manuale
              --   (brief-db-emittibilita-visibile-e-sbloccabile §3.3).
              DECLARE
                  v_stato_id      vendite.commesse.stato_commessa_id%TYPE;
                  v_stato_cod     vendite.stati_commessa.codice_interno%TYPE;
                  v_modificabile  vendite.stati_commessa.modificabile%TYPE;
                  v_emittibile    vendite.stati_commessa.emittibile%TYPE;
                  v_actions       jsonb;
                  v_can_change    boolean := false;
                  v_mot_pronta    jsonb;
                  v_mot_chiudi    jsonb;
                  v_mot_annulla   jsonb;
              BEGIN
                  -- Stato corrente + flag governance (data-driven).
                  SELECT c.stato_commessa_id, sc.codice_interno, sc.modificabile, sc.emittibile
                    INTO v_stato_id, v_stato_cod, v_modificabile, v_emittibile
                    FROM vendite.commesse c
                    JOIN vendite.stati_commessa sc ON sc.id = c.stato_commessa_id
                   WHERE c.id = p_commessa_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Motivi ostativi alle destinazioni con regola di dominio,
                  -- calcolati UNA VOLTA SOLA e riusati sotto per enabled e
                  -- reasons. Le fn sono pure: ritornano [] quando e' lecito.
                  v_mot_pronta  := script.fn_check_commessa_pronta_fatturazione(p_commessa_id);
                  v_mot_chiudi  := script.fn_check_commessa_chiudibile(p_commessa_id);
                  v_mot_annulla := script.fn_check_commessa_annullabile(p_commessa_id);

                  -- Transizioni manuali (utente) disponibili dallo stato corrente.
                  -- Filtri: attivo, manuale=true, presenza action_key/label_key.
                  -- Le automatiche (manuale=false, senza action_key) sono escluse.
                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',              t.meta->>'action_key',
                              'target_state',     sa.codice_interno,
                              'label_key',        t.meta->>'label_key',
                              'severity',         t.meta->>'severity',
                              'icon',             t.meta->>'icon',
                              'requires_confirm', COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'outlined',         COALESCE((t.meta->>'outlined')::boolean, false),
                              'enabled',          CASE sa.codice_interno
                                                    WHEN 'PRONTA_FATTURAZIONE' THEN jsonb_array_length(v_mot_pronta)  = 0
                                                    WHEN 'CHIUSA'              THEN jsonb_array_length(v_mot_chiudi)  = 0
                                                    WHEN 'ANNULLATA'           THEN jsonb_array_length(v_mot_annulla) = 0
                                                    ELSE true
                                                  END,
                              'reasons',          CASE sa.codice_interno
                                                    WHEN 'PRONTA_FATTURAZIONE' THEN v_mot_pronta
                                                    WHEN 'CHIUSA'              THEN v_mot_chiudi
                                                    WHEN 'ANNULLATA'           THEN v_mot_annulla
                                                    ELSE '[]'::jsonb
                                                  END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM vendite.transizioni_stati_commessa t
                  JOIN vendite.stati_commessa sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, false) IS TRUE
                    AND (t.meta->>'action_key') IS NOT NULL
                    AND (t.meta->>'label_key') IS NOT NULL;

                  -- can_change_state sulle sole azioni ABILITATE: con le azioni
                  -- disabilitate presenti in lista, jsonb_array_length(v_actions) > 0
                  -- sarebbe sempre true.
                  SELECT EXISTS (
                      SELECT 1
                        FROM jsonb_array_elements(v_actions) AS a
                       WHERE COALESCE((a->>'enabled')::boolean, true) IS TRUE
                  ) INTO v_can_change;

                  RETURN jsonb_build_object(
                      'available_actions', v_actions,
                      'can_change_state',  v_can_change,
                      'can_edit_righe',    v_modificabile,
                      'is_emittibile',     v_emittibile,
                      'stato_codice',      v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_commessa(bigint)
              IS 'Capability della commessa per il detail/stato API: azioni manuali disponibili dallo stato corrente, con enabled/reasons dalle funzioni pure fn_check_commessa_pronta_fatturazione / _chiudibile / _annullabile — le stesse usate dal guard di transizione, cosi'' la UI non puo'' divergere. rev 2026-08-04: aggiunta la destinazione PRONTA_FATTURAZIONE, diventata azione manuale.';
