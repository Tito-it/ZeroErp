# RITIRO DI DERIVATA_COMPONENTI — script.fn_fonte_porta_quantita
#   Brief: brief-db-offerta-emissione-ed-erogazione §I.1, decisione I-D1 di Tid
#   (2026-10-21).
#
#   L'elenco delle fonti che portano la quantita' sulla riga si riduce a FISSA,
#   lo stesso dei due CHECK di 20261021-44. La funzione resta: e' la sede unica
#   dell'elenco per il guard (trgfn_righe_guard_quantita_per_fonte) e per il
#   calcolo (trgfn_qta_from_operativa).
#
#   CREATE OR REPLACE: firma e RETURNS invariati (dall'unico YAML, 20261008-10,
#   ancorati). La firma del COMMENT passa da `character varying` all'ancora.
#
# Ritorno indietro: il corpo e il COMMENT di 20261008-10.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261021-45-update-fn-fonte-porta-quantita-solo-fissa-mctit.yaml

  - changeSet:
      id: 20261021-45-update-fn-fonte-porta-quantita-solo-fissa
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_fonte_porta_quantita: solo FISSA porta la quantita' (ritiro di DERIVATA_COMPONENTI, brief §I.1).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_fonte_porta_quantita(
                  p_fonte vendite.contratti_righe.fonte_quantita_attesa%TYPE)
              RETURNS boolean
              LANGUAGE sql
              IMMUTABLE
              SECURITY INVOKER
              AS $function$
                  -- FISSA: la quantita' e' quella della riga (qta_operativa -> quantita).
                  -- Ogni altra fonte (MANUALE, LETTURE, TIMESHEET) la porta a valle.
                  -- Rev 2026-10-21: DERIVATA_COMPONENTI ritirata (brief-db-offerta-
                  -- emissione-ed-erogazione §I.1): i componenti seguono la quantita' del
                  -- padre, mai il contrario.
                  SELECT p_fonte = 'FISSA';
              $function$;

              COMMENT ON FUNCTION script.fn_fonte_porta_quantita(vendite.contratti_righe.fonte_quantita_attesa%TYPE) IS
                  'Building block: true se la fonte (fonte_quantita_attesa) porta la quantita'' sulla '
                  'riga (FISSA), false se la quantita'' arriva a valle (MANUALE, LETTURE, TIMESHEET, e '
                  'ogni fonte nuova finche'' non la si aggiunge qui), NULL su fonte NULL. Lettori: '
                  'script.trgfn_righe_guard_quantita_per_fonte (rifiuta qta_operativa con una fonte a '
                  'valle) e script.trgfn_qta_from_operativa (con una fonte a valle porta quantita a NULL). '
                  'I CHECK chk_contrighe_quantita_per_fonte e chk_offerte_eccezioni_quantita_per_fonte (la '
                  'rete) tengono lo stesso elenco: un pgTAP li confronta (test-righe-quantita-per-fonte-v1). '
                  'Nasce il 2026-10-08, brief-db-offerta-emissione-ed-erogazione §F.1 (F-1.3). Rev '
                  '2026-10-21 (20261021-45, §I.1, I-D1 di Tid): DERIVATA_COMPONENTI ritirata, la porta '
                  'solo FISSA.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_fonte_porta_quantita(
                  p_fonte vendite.contratti_righe.fonte_quantita_attesa%TYPE)
              RETURNS boolean
              LANGUAGE sql
              IMMUTABLE
              SECURITY INVOKER
              AS $function$
                  -- FISSA: la quantita' e' quella della riga (qta_operativa -> quantita).
                  -- DERIVATA_COMPONENTI: la riga composita la porta.
                  -- Ogni altra fonte (MANUALE, LETTURE, TIMESHEET) la porta a valle.
                  SELECT p_fonte IN ('FISSA', 'DERIVATA_COMPONENTI');
              $function$;

              COMMENT ON FUNCTION script.fn_fonte_porta_quantita(vendite.contratti_righe.fonte_quantita_attesa%TYPE) IS
                  'Building block: true se la fonte (fonte_quantita_attesa) porta la quantita'' sulla '
                  'riga (FISSA, DERIVATA_COMPONENTI), false se la quantita'' arriva a valle (MANUALE, '
                  'LETTURE, TIMESHEET, e ogni fonte nuova finche'' non la si aggiunge qui), NULL su fonte '
                  'NULL. Lettori: script.trgfn_righe_guard_quantita_per_fonte (rifiuta qta_operativa con '
                  'una fonte a valle) e script.trgfn_qta_from_operativa (con una fonte a valle porta '
                  'quantita a NULL). I CHECK chk_contrighe_quantita_per_fonte e '
                  'chk_offerte_eccezioni_quantita_per_fonte (la rete) tengono lo stesso elenco: un pgTAP '
                  'li confronta (test-righe-quantita-per-fonte-v1). Nasce il 2026-10-08, '
                  'brief-db-offerta-emissione-ed-erogazione §F.1 (F-1.3).';
