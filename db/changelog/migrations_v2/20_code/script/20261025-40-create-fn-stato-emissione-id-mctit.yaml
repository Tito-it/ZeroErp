# ------------------------------------------------------------
# BB: LO STATO DI EMISSIONE DI UNA TESTATA
#   Brief: brief-modello-documento-vendita §7.9 e §8 (giro 6; colonna decisa
#   da Tid il 2026-10-25).
#
# ── CHE COSA DICE ───────────────────────────────────────────────────
#   L'id dello stato che il vocabolario della testata dichiara di emissione
#   (colonna emissione, 20261025-37). Il gemello di script.fn_stato_iniziale_id,
#   ma riceve la TESTATA (dalla mappa) e non il vocabolario: chi lo chiede
#   (backend, verbi) conosce il documento, non la tabella dei suoi stati.
#   NULL: il documento non si emette (il vocabolario non ha la colonna: reso,
#   commessa, fattura) o non ne dichiara nessuno.
#
# ── CHI LO LEGGE ────────────────────────────────────────────────────
#   Il backend: il cambio stato generico rifiuta lo stato di emissione di
#   qualunque documento (M-2, «solo da Emetti»), senza un letterale per
#   documento. Nel database: la domanda intera script.fn_doc_azione_passaggio
#   e il verbo del preventivo (la condizione delle righe e' dell'emissione).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-40-create-fn-stato-emissione-id-mctit.yaml

  - changeSet:
      id: 20261025-40-create-fn-stato-emissione-id
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB script.fn_stato_emissione_id(regclass): l'id dello stato di emissione del
        vocabolario di una testata della mappa (colonna emissione), NULL se il documento non si
        emette. Brief: brief-modello-documento-vendita §8.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_doc_stato_modello';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_stato_emissione_id(p_testata regclass)
               RETURNS bigint
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  -- Il vocabolario e l'id di uno stato di una qualunque testata
                  -- della mappa: bigint in tutti, nessuna colonna comune a cui
                  -- ancorarli.
                  v_vocabolario regclass;
                  v_id          bigint;
              BEGIN
                  -- =========================================================
                  -- Scopo: l'id dello stato di emissione della testata, dal
                  --   suo vocabolario (colonna emissione = true).
                  -- Regole:
                  --   - testata fuori mappa: il chiamante e' rotto,
                  --     E_SCRIPT_CHIAMATA_NON_VALIDA;
                  --   - vocabolario senza la colonna emissione: il documento
                  --     non si emette, NULL;
                  --   - nessuno stato dichiarato: NULL (al massimo uno lo
                  --     garantisce l'indice unico parziale).
                  -- =========================================================
                  SELECT m.vocabolario
                    INTO v_vocabolario
                    FROM script.fn_doc_stato_modello(p_testata) m;

                  IF v_vocabolario IS NULL THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_stato_emissione_id', 'E_SCRIPT_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('testata', p_testata::text),
                          NULL::uuid,
                          'script.fn_stato_emissione_id',
                          'p_testata: una testata della mappa del modello (script.fn_doc_stato_modello)');
                  END IF;

                  IF NOT EXISTS (SELECT 1
                                   FROM pg_catalog.pg_attribute a
                                  WHERE a.attrelid = v_vocabolario
                                    AND a.attname  = 'emissione'
                                    AND a.attnum   > 0
                                    AND NOT a.attisdropped) THEN
                      RETURN NULL;
                  END IF;

                  EXECUTE format('SELECT s.id FROM %s s WHERE s.emissione', v_vocabolario)
                     INTO v_id;

                  RETURN v_id;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_stato_emissione_id(p_testata regclass)
                IS 'BB del modello del documento: l''id dello stato di EMISSIONE di una testata, letto dal suo vocabolario degli stati (colonna emissione = true; la mappa e'' script.fn_doc_stato_modello). Unica sede da cui leggerlo: nessuno scrive ''EMESSO'' per dire «lo stato a cui si arriva solo da Emetti» (M-2). NULL se il documento non si emette (vocabolario senza la colonna: reso, commessa, fattura) o se il vocabolario non ne dichiara; testata fuori mappa: E_SCRIPT_CHIAMATA_NON_VALIDA. Gemello di script.fn_stato_iniziale_id, ma riceve la testata. Consumatori: il backend (il cambio stato generico rifiuta l''emissione), script.fn_doc_azione_passaggio, vendite.fn_cambia_stato_preventivo. Brief: brief-modello-documento-vendita §8 (Tid 2026-10-25).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_stato_emissione_id(regclass);
