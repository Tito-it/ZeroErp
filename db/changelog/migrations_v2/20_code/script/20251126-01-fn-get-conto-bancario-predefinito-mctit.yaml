databaseChangeLog:
    - logicalFilePath: migrations_v2/20_code/script/20251126-01-fn-get-conto-bancario-predefinito-mctit.yaml

    - changeSet:
          id: 20251126-01-fn-get-conto-bancario-predefinito
          author: mctit
          comment:
              "Restituisce il conto bancario predefinito per (soggetto_ruolo_id, uso) usando la vista anagrafiche.vw_conti_bancari_per_ruolo.
              Priorità: uso richiesto, poi fallback a uso=GENERICO. Restituisce al massimo una riga (o NULL)."

          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        CREATE OR REPLACE FUNCTION script.fn_get_conto_bancario_predefinito(
                            p_soggetto_ruolo_id bigint,
                            p_uso               character varying
                        )
                        RETURNS anagrafiche.vw_conti_bancari_per_ruolo
                        LANGUAGE plpgsql
                        STABLE
                        AS $$
                        DECLARE
                            v_res anagrafiche.vw_conti_bancari_per_ruolo%ROWTYPE;
                        BEGIN
                            -- 1) Tentativo diretto sull'uso richiesto
                            SELECT *
                            INTO v_res
                            FROM anagrafiche.vw_conti_bancari_per_ruolo v
                            WHERE v.soggetto_ruolo_id = p_soggetto_ruolo_id
                            AND v.uso               = p_uso
                            LIMIT 1;

                            IF v_res.soggetto_ruolo_id IS NOT NULL THEN
                                RETURN v_res;
                            END IF;

                            -- 2) Fallback su GENERICO (solo se uso diverso)
                            IF p_uso IS DISTINCT FROM 'GENERICO' THEN
                                SELECT *
                                INTO v_res
                                FROM anagrafiche.vw_conti_bancari_per_ruolo v
                                WHERE v.soggetto_ruolo_id = p_soggetto_ruolo_id
                                AND v.uso               = 'GENERICO'
                                LIMIT 1;

                                IF v_res.soggetto_ruolo_id IS NOT NULL THEN
                                    RETURN v_res;
                                END IF;
                            END IF;

                            -- 3) Nessun conto trovato
                            RETURN NULL;
                        END;
                        $$;

                        COMMENT ON FUNCTION script.fn_get_conto_bancario_predefinito(bigint, character varying)
                        IS 'Restituisce il conto bancario predefinito per (soggetto_ruolo_id, uso) usando la vista anagrafiche.vw_conti_bancari_per_ruolo. Priorità: uso richiesto, poi fallback a uso=GENERICO. Restituisce al massimo una riga (o NULL).';

    # Apportate una piccola modifica per normalizzare l'input 'uso' (trim + uppercase)

    - changeSet:
          id: 20251126-01-1-fn-get-conto-bancario-predefinito
          author: mctit
          comment:
              "Restituisce il conto bancario predefinito per (soggetto_ruolo_id, uso) usando la vista anagrafiche.vw_conti_bancari_per_ruolo.
              Priorità: uso richiesto, poi fallback a uso=GENERICO. Restituisce al massimo una riga (o NULL)."

          changes:
              - sql:
                    splitStatements: false
                    stripComments: false
                    sql: |

                        CREATE OR REPLACE FUNCTION script.fn_get_conto_bancario_predefinito(
                            p_soggetto_ruolo_id bigint,
                            p_uso               varchar
                        )
                        RETURNS anagrafiche.vw_conti_bancari_per_ruolo
                        LANGUAGE plpgsql
                        STABLE
                        AS $function$
                        DECLARE
                            v_res anagrafiche.vw_conti_bancari_per_ruolo%ROWTYPE;
                            v_uso varchar := UPPER(TRIM(COALESCE(p_uso, 'GENERICO')));
                        BEGIN
                            -- 1) Tentativo diretto sull'uso richiesto (normalizzato)
                            SELECT *
                            INTO v_res
                            FROM anagrafiche.vw_conti_bancari_per_ruolo v
                            WHERE v.soggetto_ruolo_id = p_soggetto_ruolo_id
                            AND v.uso               = v_uso
                            LIMIT 1;

                            IF v_res.soggetto_ruolo_id IS NOT NULL THEN
                                RETURN v_res;
                            END IF;

                            -- 2) Fallback su GENERICO (solo se uso diverso)
                            IF v_uso <> 'GENERICO' THEN
                                SELECT *
                                INTO v_res
                                FROM anagrafiche.vw_conti_bancari_per_ruolo v
                                WHERE v.soggetto_ruolo_id = p_soggetto_ruolo_id
                                AND v.uso               = 'GENERICO'
                                LIMIT 1;

                                IF v_res.soggetto_ruolo_id IS NOT NULL THEN
                                    RETURN v_res;
                                END IF;
                            END IF;

                            -- 3) Nessun conto trovato
                            RETURN NULL;
                        END;
                        $function$;


                        COMMENT ON FUNCTION script.fn_get_conto_bancario_predefinito(bigint, character varying)
                        IS 'Restituisce il conto bancario predefinito per (soggetto_ruolo_id, uso) usando la vista anagrafiche.vw_conti_bancari_per_ruolo. Priorità: uso richiesto, poi fallback a uso=GENERICO. Restituisce al massimo una riga (o NULL).';
