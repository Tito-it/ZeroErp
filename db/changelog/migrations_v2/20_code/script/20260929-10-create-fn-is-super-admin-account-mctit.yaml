# BB — SUPER_ADMIN DELLA CREDENZIALE, SENZA IL CANCELLO DELLA VESTE:
#   script.fn_is_super_admin_account(p_auth_user_id)
#   Brief: brief-db-secondo-fattore-totp, sezioni 2.2-2.3.
#
# ── ⭐ PERCHE' UN BB E NON script.fn_is_super_admin ───────────────────
#   fn_is_super_admin fa DUE domande in AND: «la sessione e' in veste
#   OPERATORE (o senza veste)?» e «la credenziale ha un binding SUPER_ADMIN
#   attivo?». Per i permessi e' giusto: in portale il bypass non si accende.
#   Per l'obbligo del secondo fattore no: la credenziale e' una e vale per
#   tutte le porte, e il super admin che entra dal portale con la stessa
#   password deve usare il secondo fattore lo stesso. Serve la SECONDA domanda
#   da sola.
#
# ── ⭐ REGOLA DEL 2 ──────────────────────────────────────────────────
#   La seconda domanda era scritta sul posto nel ramo ELSE di
#   fn_is_super_admin (20260421-03). La seconda occorrenza e'
#   script.fn_totp_obbligatorio (20260929-13): si estrae qui e fn_is_super_admin
#   la chiede qui (20260929-11), nello stesso giro. Il corpo e' quel ramo,
#   parola per parola, dalla doc auto-gen.
#
# ── ⚠️ COSA NON E' ──────────────────────────────────────────────────
#   Non e' la domanda dell'anti-lockout (fn_check_almeno_un_super_admin_attivo):
#   quella conta TUTTI gli amministratori raggiungibili, guarda il blocco della
#   credenziale e non guarda la veste ne' le date. Due domande diverse, non una
#   copia.
#
# LANGUAGE sql, STABLE, INVOKER, niente SET: resta inlineabile dentro
# fn_is_super_admin, come il ramo che sostituisce.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260929-10-create-fn-is-super-admin-account-mctit.yaml

  - changeSet:
      id: 20260929-10-create-fn-is-super-admin-account
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_is_super_admin_account(p_auth_user_id): la credenziale ha un binding SUPER_ADMIN
        attivo (identita' OPERATORE attiva e valida oggi, binding e profilo attivi), senza il
        cancello della veste di fn_is_super_admin. Estratta dal ramo ELSE di fn_is_super_admin alla
        seconda occorrenza (fn_totp_obbligatorio). Brief: brief-db-secondo-fattore-totp §2.
      preConditions:
        - onFail: HALT
        - not:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_is_super_admin_account';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_is_super_admin_account(p_auth_user_id integer)
              RETURNS boolean
              LANGUAGE sql
              STABLE
              AS $function$
                  -- Scopo: la CREDENZIALE ha un binding SUPER_ADMIN attivo? Senza
                  --   il cancello della veste di script.fn_is_super_admin, che
                  --   chiede questa funzione nel suo ramo ELSE.
                  -- Il SUPER_ADMIN si lega solo a un'identita' OPERATORE (binding
                  -- per identita', privilegio personale).
                  SELECT EXISTS (
                      SELECT 1
                        FROM anagrafiche.identita_digitali id
                        JOIN config.profili_accesso_bindings pab
                          ON pab.identita_digitale_id = id.id
                        JOIN config.profili_accesso pa
                          ON pa.id = pab.profilo_accesso_id
                       WHERE id.auth_user_id      = p_auth_user_id
                         AND id.attivo            = true
                         AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                         AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                         AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                         AND pab.attivo = true
                         AND pa.attivo  = true
                         AND pa.tipo    = 'SUPER_ADMIN'::config.tipo_profilo_accesso
                  );
              $function$;

              COMMENT ON FUNCTION script.fn_is_super_admin_account(integer) IS
                  'La CREDENZIALE (django.auth_user.id) ha un binding SUPER_ADMIN attivo: identita'' OPERATORE attiva e valida oggi, binding e profilo attivi. Senza il cancello della veste: e'' la seconda delle due domande di script.fn_is_super_admin, che la chiede nel suo ramo ELSE (estratta il 2026-09-29, regola del 2). La usa da sola script.fn_totp_obbligatorio: l''obbligo del secondo fattore vale su tutte le porte, anche dove il bypass dei permessi non si accende. Non e'' la domanda dell''anti-lockout (fn_check_almeno_un_super_admin_attivo), che conta tutti gli amministratori raggiungibili. LANGUAGE sql, STABLE, INVOKER, inlineabile. Brief: brief-db-secondo-fattore-totp §2.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- ⚠️ fn_is_super_admin la chiama da 20260929-11: rollback di quello prima.
              DROP FUNCTION IF EXISTS script.fn_is_super_admin_account(integer);
