# P-6 — LA LETTURA DEL DEVICE: script.fn_get_totp_device(p_auth_user_id)
#   Brief: brief-db-secondo-fattore-totp, sezione 3 (ultima riga della tabella).
#
# ── ⭐ CONOSCE IL SIGNIFICATO DELLA RIGA ASSENTE ─────────────────────
#   Una riga sempre, con uno STATO a tre valori:
#     ASSENTE        nessun device (mai registrato, o disabilitato);
#     DA_CONFERMARE  registrato, setup in corso: il segreto c'e', perche' il
#                    backend ci verifica il primo codice;
#     ATTIVO         confermato, in uso.
#   ⚠️ Il brief chiedeva un booleano `attivo`: non distingue «nessun device» da
#   «setup a meta'», e il backend ne ha bisogno (il setup riprende, non
#   ricomincia; il login a due passi vale solo su ATTIVO). Uno stato, non due
#   booleani da incrociare.
#
# ── ⚠️ IL SEGRETO ESCE CIFRATO ──────────────────────────────────────
#   Lo decifra il backend, che verifica il codice: il DB non lo vede mai in
#   chiaro. L'app ha comunque SELECT sulla tabella (90_end/20260929-24): la
#   funzione non nasconde niente, da' una lettura sola invece di una query per
#   chiamante.
#
# INVOKER, STABLE: si legge anche prima del login.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260929-15-create-fn-get-totp-device-mctit.yaml

  - changeSet:
      id: 20260929-15-create-fn-get-totp-device
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_totp_device(p_auth_user_id) -> (stato, secret_encrypted, ultimo_passo_usato,
        recovery_rimasti): una riga sempre; stato ASSENTE / DA_CONFERMARE / ATTIVO. Conosce il
        significato della riga assente. INVOKER, STABLE. Brief: brief-db-secondo-fattore-totp §3.
      preConditions:
        - onFail: HALT
        - columnExists:
            { schemaName: config, tableName: auth_totp_device, columnName: ultimo_passo_usato }
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_totp_device(p_auth_user_id integer)
              RETURNS TABLE (
                  stato              text,
                  secret_encrypted   config.auth_totp_device.secret_encrypted%TYPE,
                  ultimo_passo_usato config.auth_totp_device.ultimo_passo_usato%TYPE,
                  recovery_rimasti   integer
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo: lo stato del device del secondo fattore di una credenziale,
              --   in una riga sola anche quando il device non c'e'.
              BEGIN
                  IF p_auth_user_id IS NULL OR p_auth_user_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_get_totp_device', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('parametro', 'p_auth_user_id', 'valore', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_get_totp_device',
                                         'credenziale assente o non valida']);
                  END IF;

                  RETURN QUERY
                  SELECT CASE WHEN d.id IS NULL  THEN 'ASSENTE'
                              WHEN d.confermato  THEN 'ATTIVO'
                              ELSE 'DA_CONFERMARE' END,
                         d.secret_encrypted,
                         d.ultimo_passo_usato,
                         COALESCE(jsonb_array_length(d.recovery_codes_hash), 0)
                    FROM (SELECT 1) uno
                    LEFT JOIN config.auth_totp_device d
                      ON d.auth_user_id = p_auth_user_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_totp_device(integer) IS
                  'Lo stato del device del secondo fattore (TOTP) di una credenziale, in UNA riga anche quando il device non c''e'': stato ASSENTE (mai registrato o disabilitato), DA_CONFERMARE (registrato, setup in corso: il segreto c''e'' perche'' il backend ci verifica il primo codice), ATTIVO (confermato, in uso); secret_encrypted (cifrato: lo decifra il backend), ultimo_passo_usato (anti-replay), recovery_rimasti (codici di recupero non ancora usati). E'' la sola sede del significato della riga assente. id NULL o <= 0 -> E_AUTH_CHIAMATA_NON_VALIDA. INVOKER, STABLE: si legge anche prima del login. Brief: brief-db-secondo-fattore-totp §3.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_totp_device(integer);
