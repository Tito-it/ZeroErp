# brief-db-guard-righe-avanzamento-stato §1a (Rev 2) — ultimo dominio dei sei.
#
# Il censimento 2026-07-19 ha mostrato che il pattern enabled/reason/reason_key
# sulle azioni da matrice (rev 2026-07-16) copre preventivi/resi/ordini/
# contratti/ddt ma NON le offerte: fn_available_actions_offerta emetteva le
# azioni di transizione SENZA i tre campi. Il FE (mapAvailableActionsToDrawer
# Actions) tratta l'assenza come enabled=true, quindi «Emetti» su un'offerta
# senza versione listino era cliccabile e falliva al guard
# (E_OFFERTA_EMISSIONE_SENZA_VERSIONE_LISTINO / _NON_ATTIVA) — lo stesso
# difetto del rilievo DDT, sull'ultimo dominio scoperto.
#
# Per le offerte «vuoto» non significa righe (le righe sono ESPANSE dal
# listino): la precondizione di emissione e' la VERSIONE LISTINO — valorizzata
# e in stato ATTIVA. E' esattamente cio' che valida il guard
# trgfn_offerte_commerciali_guard_transizione su BOZZA->EMESSA: la capability
# ne specchia le due condizioni (qui inline: due predicati banali su una
# colonna — non serve una fn_check dedicata come per il DDT, dove le
# condizioni erano cinque in quattro trigger).
#
# Le azioni fuori matrice (crea_revisione/push_contratto/genera_ordine) hanno
# gia' la loro logica can_*/reason invariata; ai tre blocchi costanti si
# aggiungono i campi enabled=true espliciti per uniformita' di contratto.
#
# Nuove reason_key da tradurre lato FE (§3 del brief):
#   vendite.offerte.azione_reason.listino_versione_mancante
#   vendite.offerte.azione_reason.listino_versione_non_attiva
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260719-04-update-fn-available-actions-offerta-enabled-listino-mctit.yaml

  - changeSet:
      id: 20260719-04-update-fn-available-actions-offerta-enabled-listino
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      failOnError: true
      comment: >
        fn_available_actions_offerta espone enabled/reason/reason_key su ogni
        azione (uniformita' coi 5 domini gemelli): la transizione verso EMESSA
        e' disabled se listino_versione_id manca o la versione non e' ATTIVA
        (specchio del guard BOZZA->EMESSA).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_available_actions_offerta(p_offerta_id bigint)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: capability offerta commerciale per detail API (data-driven,
              --   specchio di fn_available_actions_preventivo). push_contratto e
              --   genera_ordine mutuamente esclusive (ACCETTATA).
              --   rev 2026-07-11: + blocco pdf {mode, allow_allegati} da
              --   config.stati_doc_offerte (bottone PDF data-driven via capabilities).
              --   rev 2026-07-19: + enabled/reason/reason_key su ogni azione
              --   (uniformita' 6 domini): verso EMESSA disabled se la versione
              --   listino manca o non e' ATTIVA — specchio del guard
              --   BOZZA->EMESSA (brief-db-guard-righe-avanzamento-stato §1a).
              DECLARE
                  v_stato_id    vendite.offerte_commerciali.stato_doc_offerta_id%TYPE;
                  v_stato_cod   config.stati_doc_offerte.codice_interno%TYPE;
                  v_pdf_mode    config.stati_doc_offerte.pdf_mode%TYPE;
                  v_pdf_allow   config.stati_doc_offerte.pdf_allow_allegati%TYPE;
                  v_listino_versione_id vendite.offerte_commerciali.listino_versione_id%TYPE;
                  v_stato_versione      vendite.listini_versioni.stato%TYPE;
                  v_emit_ok             boolean := true;
                  v_emit_reason         text := NULL;
                  v_emit_reason_key     text := NULL;
                  v_actions     jsonb;
                  v_can_edit    boolean;
                  v_can_rev     boolean;
                  v_has_contratto boolean;
                  v_has_ordine    boolean;
                  v_enabled       boolean;
                  v_can_push    boolean;
                  v_push_reason     text;
                  v_push_reason_key text;
                  v_can_ordine        boolean;
                  v_ordine_reason     text;
                  v_ordine_reason_key text;
                  c_sempre_non_edit CONSTANT jsonb :=
                      '["codice","uid","revisione_numero","revisione_padre_id",'
                      '"stato_doc_offerta_id","data_emissione","data_accettazione",'
                      '"data_rifiuto","data_annullamento","motivazione_rifiuto"]'::jsonb;
                  c_non_edit_extra CONSTANT jsonb :=
                      '["emittente_fiscale_id","billing_account_id","istanza_utility_id",'
                      '"utility_id","listino_id","listino_versione_id",'
                      '"valore_variazione_globale","tipo_variazione_globale",'
                      '"validita_dal","validita_al","meta"]'::jsonb;
                  c_action_crea_revisione CONSTANT jsonb := jsonb_build_object(
                      'key',                'crea_revisione',
                      'target_state',       NULL,
                      'label_key',          'vendite.offerte.azione_crea_revisione',
                      'severity',           'info',
                      'icon',               'pi pi-clone',
                      'requires_confirm',   true,
                      'requires_motivazione', false,
                      'enabled',            true,
                      'reason',             NULL,
                      'reason_key',         NULL
                  );
                  c_action_push_contratto CONSTANT jsonb := jsonb_build_object(
                      'key',                'push_contratto',
                      'target_state',       NULL,
                      'label_key',          'vendite.offerte.azione_push_contratto',
                      'severity',           'success',
                      'icon',               'pi pi-arrow-right',
                      'requires_confirm',   true,
                      'requires_motivazione', false,
                      'enabled',            true,
                      'reason',             NULL,
                      'reason_key',         NULL
                  );
                  c_action_genera_ordine CONSTANT jsonb := jsonb_build_object(
                      'key',                'genera_ordine',
                      'target_state',       NULL,
                      'label_key',          'vendite.offerte.azione_genera_ordine',
                      'severity',           'info',
                      'icon',               'pi pi-shopping-cart',
                      'requires_confirm',   true,
                      'requires_motivazione', false,
                      'enabled',            true,
                      'reason',             NULL,
                      'reason_key',         NULL
                  );
              BEGIN
                  -- Stato corrente + versione listino + capability PDF.
                  SELECT o.stato_doc_offerta_id, sdo.codice_interno,
                         sdo.pdf_mode, sdo.pdf_allow_allegati,
                         o.listino_versione_id
                    INTO v_stato_id, v_stato_cod, v_pdf_mode, v_pdf_allow,
                         v_listino_versione_id
                    FROM vendite.offerte_commerciali o
                    JOIN config.stati_doc_offerte sdo ON sdo.id = o.stato_doc_offerta_id
                   WHERE o.id = p_offerta_id;

                  IF NOT FOUND THEN
                      RETURN NULL;
                  END IF;

                  -- Precondizione di emissione (specchio del guard BOZZA->EMESSA):
                  -- versione listino valorizzata e in stato ATTIVA. Le righe non
                  -- c'entrano: nelle offerte sono espanse dal listino.
                  IF v_listino_versione_id IS NULL THEN
                      v_emit_ok         := false;
                      v_emit_reason     := 'LISTINO_VERSIONE_MANCANTE';
                      v_emit_reason_key := 'vendite.offerte.azione_reason.listino_versione_mancante';
                  ELSE
                      SELECT lv.stato INTO v_stato_versione
                        FROM vendite.listini_versioni lv
                       WHERE lv.id = v_listino_versione_id;

                      IF v_stato_versione IS DISTINCT FROM 'ATTIVA' THEN
                          v_emit_ok         := false;
                          v_emit_reason     := 'LISTINO_VERSIONE_NON_ATTIVA';
                          v_emit_reason_key := 'vendite.offerte.azione_reason.listino_versione_non_attiva';
                      END IF;
                  END IF;

                  SELECT COALESCE(
                      jsonb_agg(
                          jsonb_build_object(
                              'key',                t.meta->>'action_key',
                              'target_state',       sa.codice_interno,
                              'label_key',          t.meta->>'label_key',
                              'severity',           t.meta->>'severity',
                              'icon',               t.meta->>'icon',
                              'requires_confirm',   COALESCE((t.meta->>'requires_confirm')::boolean, false),
                              'requires_motivazione', COALESCE((t.meta->>'requires_motivazione')::boolean, false),
                              'enabled',            CASE WHEN sa.codice_interno = 'EMESSA'
                                                         THEN v_emit_ok ELSE true END,
                              'reason',             CASE WHEN sa.codice_interno = 'EMESSA'
                                                         THEN v_emit_reason END,
                              'reason_key',         CASE WHEN sa.codice_interno = 'EMESSA'
                                                         THEN v_emit_reason_key END
                          )
                          ORDER BY sa.ordine
                      ),
                      '[]'::jsonb
                  )
                  INTO v_actions
                  FROM config.stati_doc_offerte_transizioni t
                  JOIN config.stati_doc_offerte sa ON sa.id = t.stato_a_id
                  WHERE t.stato_da_id = v_stato_id
                    AND t.attivo IS TRUE
                    AND COALESCE((t.meta->>'manuale')::boolean, true) IS TRUE
                    AND t.meta ? 'action_key'
                    AND t.meta ? 'label_key';

                  v_can_rev := (v_stato_cod = 'EMESSA');
                  IF v_can_rev THEN
                      v_actions := v_actions || jsonb_build_array(c_action_crea_revisione);
                  END IF;

                  SELECT EXISTS (
                      SELECT 1 FROM vendite.contratti WHERE offerta_id = p_offerta_id
                  ) INTO v_has_contratto;

                  SELECT EXISTS (
                      SELECT 1 FROM vendite.ordini
                       WHERE documento_origine_tipo = 'OFFERTA'
                         AND documento_origine_id   = p_offerta_id
                  ) INTO v_has_ordine;

                  v_enabled := (v_stato_cod = 'ACCETTATA'
                                AND NOT v_has_contratto
                                AND NOT v_has_ordine);

                  v_can_push := v_enabled;
                  IF v_enabled THEN
                      v_push_reason     := NULL;
                      v_push_reason_key := NULL;
                      v_actions := v_actions || jsonb_build_array(c_action_push_contratto);
                  ELSIF v_has_contratto THEN
                      v_push_reason     := 'OFFERTA_CONTRATTO_GIA_GENERATO';
                      v_push_reason_key := 'offerte.push_reason.gia_generato';
                  ELSIF v_has_ordine THEN
                      v_push_reason     := 'OFFERTA_ORDINE_GIA_GENERATO';
                      v_push_reason_key := 'offerte.push_reason.ordine_gia_generato';
                  ELSE
                      v_push_reason     := 'OFFERTA_NON_ACCETTATA';
                      v_push_reason_key := 'offerte.push_reason.non_accettata';
                  END IF;

                  v_can_ordine := v_enabled;
                  IF v_enabled THEN
                      v_ordine_reason     := NULL;
                      v_ordine_reason_key := NULL;
                      v_actions := v_actions || jsonb_build_array(c_action_genera_ordine);
                  ELSIF v_has_ordine THEN
                      v_ordine_reason     := 'OFFERTA_ORDINE_GIA_GENERATO';
                      v_ordine_reason_key := 'offerte.push_reason.ordine_gia_generato';
                  ELSIF v_has_contratto THEN
                      v_ordine_reason     := 'OFFERTA_CONTRATTO_GIA_GENERATO';
                      v_ordine_reason_key := 'offerte.push_reason.gia_generato';
                  ELSE
                      v_ordine_reason     := 'OFFERTA_NON_ACCETTATA';
                      v_ordine_reason_key := 'offerte.push_reason.non_accettata';
                  END IF;

                  v_can_edit := (v_stato_cod = 'BOZZA');

                  RETURN jsonb_build_object(
                      'available_actions',             v_actions,
                      'can_change_state',              jsonb_array_length(v_actions) > 0,
                      'can_edit_testata',              v_can_edit,
                      'can_edit_eccezioni',            v_can_edit,
                      'can_edit_utility',              v_can_edit,
                      'can_create_revisione',          v_can_rev,
                      'can_push_contratto',            v_can_push,
                      'can_push_contratto_reason',     v_push_reason,
                      'can_push_contratto_reason_key', v_push_reason_key,
                      'can_genera_ordine',             v_can_ordine,
                      'can_genera_ordine_reason',      v_ordine_reason,
                      'can_genera_ordine_reason_key',  v_ordine_reason_key,
                      'non_editable_fields',           CASE WHEN v_can_edit
                                                           THEN c_sempre_non_edit
                                                           ELSE c_sempre_non_edit || c_non_edit_extra END,
                      'pdf',                           jsonb_build_object('mode', v_pdf_mode, 'allow_allegati', v_pdf_allow),
                      'stato_codice',                  v_stato_cod
                  );
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_available_actions_offerta(p_offerta_id bigint)
              IS 'Capability offerta commerciale per detail API: available_actions + can_edit_* + push_contratto/genera_ordine (mutuamente esclusive) + create_revisione + non_editable_fields. rev 2026-07-11: + blocco pdf {mode, allow_allegati}. rev 2026-07-19: + enabled/reason/reason_key su ogni azione (uniformita'' 6 domini, brief-db-guard-righe-avanzamento-stato §1a) — la transizione verso EMESSA e'' disabled con reason LISTINO_VERSIONE_MANCANTE / LISTINO_VERSIONE_NON_ATTIVA, specchio del guard BOZZA->EMESSA (per le offerte il "vuoto" e'' la versione listino, non le righe: sono espanse dal listino).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Rollback: rigenerare la revisione precedente (rev 2026-07-11)
              -- dalla doc auto-gen. Nessun DROP: la fn deve continuare a esistere.
              SELECT 1;
