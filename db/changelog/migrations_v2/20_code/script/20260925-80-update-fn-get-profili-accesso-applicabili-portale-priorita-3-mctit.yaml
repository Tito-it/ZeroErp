# ------------------------------------------------------------
# D-3 — IL REPARTO VINCE SUL PROFILO DI VESTE: PORTALE passa a priorita' 3
#   Brief: brief-db-pgtap-permessi-ereditati, sezioni 3-bis e 4 (D-3, Tid 2026-09-25)
#
# -- IL DIFETTO ----------------------------------------------------------------------------------
#   L'helper dava priorita' 2 sia al binding PORTALE (sulla veste) sia al binding REPARTO
#   (sull'unita' organizzativa). Sotto la sola veste OPERATORE il modello ammette tutti e
#   due: il guard di coerenza accetta un PORTALE legato alla veste OPERATORE, e il REPARTO
#   arriva dalla risorsa umana. Sulla stessa area, allora, `ORDER BY priorita LIMIT 1`
#   sceglieva a caso — lo decideva il piano di esecuzione. Non e' un caso dei dati: gli
#   indici unici dei binding (uno per identita', uno per veste, uno per UO) lasciano
#   esattamente questa coppia a pari merito.
#
# -- LA REGOLA -----------------------------------------------------------------------------------
#   Guida architettura-permessi-e-autorizzazioni §3: «il livello piu' specifico prevale
#   sempre su quello piu' generale». L'unita' organizzativa e' piu' specifica della veste
#   (tutti gli operatori): AD_HOC 1, REPARTO 2, PORTALE 3.
#   ⭐ Con D-1 (i resolver chiedono la sola veste OPERATORE) ogni priorita' ha al massimo UN
#   profilo, per gli indici unici: lo spareggio e' determinato senza chiavi di ripiego.
#
# -- CHI LO SENTE --------------------------------------------------------------------------------
#   Tutti i chiamanti dell'helper, ed e' voluto: i resolver dei permessi (dal -81 via il
#   building block dell'ereditato), ui.fn_lista_colonne_livello, i preset di liste e
#   dashboard (ui.fn_resolve_lista_config, ui.fn_resolve_dashboard_config, il repository
#   BE dei preset), che ordinano tutti per priorita'. Cambia qualcosa solo dove la parita'
#   esisteva: sulle vesti di portale e shop non c'e' un reparto, il PORTALE resta l'unico
#   profilo di gruppo e il suo numero non conta.
#   ⚠️ Chi fissa la priorita' 2 del PORTALE: db/pgtap/script/test-fn-get-profili-accesso-applicabili.sql
#   (test 3), adeguato nello stesso giro.
#
# -- FORMA ---------------------------------------------------------------------------------------
#   Corpo vivo dalla doc auto-gen, cambiata la sola costante del ramo PORTALE e il commento.
#   Firma e RETURNS TABLE ancorate (%TYPE, identita' della firma invariata: integer,
#   config.ruolo_applicativo). `priorita` resta smallint esplicito: e' calcolata, non ha
#   una colonna dietro. Resta LANGUAGE sql a stringa, come il vivo.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260925-80-update-fn-get-profili-accesso-applicabili-portale-priorita-3-mctit.yaml

  - changeSet:
      id: 20260925-80-update-fn-get-profili-accesso-applicabili-portale-priorita-3
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        D-3 (Tid, 2026-09-25): script.fn_get_profili_accesso_applicabili da' priorita' 3 al
        binding PORTALE (era 2, a pari merito col REPARTO). Il piu' specifico vince: AD_HOC
        1, REPARTO 2, PORTALE 3. Firma ancorata, identita' invariata. Brief:
        brief-db-pgtap-permessi-ereditati.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_profili_accesso_applicabili';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_profili_accesso_applicabili(
                  p_auth_user_id       anagrafiche.identita_digitali.auth_user_id%TYPE,
                  p_ruolo_applicativo  anagrafiche.identita_digitali.ruolo_applicativo%TYPE DEFAULT NULL
              )
              RETURNS TABLE(
                  profilo_accesso_id  config.profili_accesso_bindings.profilo_accesso_id%TYPE,
                  priorita            smallint   -- calcolata dal tipo di binding: nessuna colonna dietro
              )
              LANGUAGE sql
              STABLE
              SECURITY INVOKER
              AS $function$
                  -- =========================================================
                  -- Risolve i profili di accesso applicabili a un utente
                  -- via bindings, dal piu' specifico al piu' generale:
                  --   AD_HOC  prio 1 (sull'identita')
                  --   REPARTO prio 2 (sull'unita' organizzativa)
                  --   PORTALE prio 3 (sulla veste, cioe' tutti)
                  -- Rev 20260925-80 (D-3): PORTALE era 2, a pari merito col
                  -- REPARTO; sotto la veste OPERATORE i due coesistono e
                  -- LIMIT 1 sceglieva a caso.
                  --
                  -- p_ruolo_applicativo:
                  --   NULL -> tutti i profili applicabili all'user
                  --           (comportamento legacy, tutte le vesti)
                  --   non NULL -> solo le identita dell'user con quel
                  --               ruolo_applicativo (veste corrente)
                  -- ⚠️ Con una veste sola ogni priorita' ha al massimo UN
                  --   profilo (indici unici dei binding e di risorse_umane):
                  --   chi ordina per priorita' ha uno spareggio determinato.
                  --   Con NULL no: due vesti di portale danno due PORTALE.
                  -- =========================================================

                  -- 1) AD_HOC: binding diretto sull'identita
                  SELECT DISTINCT
                         pab.profilo_accesso_id,
                         1::smallint AS priorita
                    FROM anagrafiche.identita_digitali id
                    JOIN config.profili_accesso_bindings pab
                      ON pab.identita_digitale_id = id.id
                    JOIN config.profili_accesso pa
                      ON pa.id = pab.profilo_accesso_id
                   WHERE id.auth_user_id      = p_auth_user_id
                     AND id.attivo            = true
                     AND id.ruolo_applicativo <> 'DISABILITATO'
                     AND (p_ruolo_applicativo IS NULL
                          OR id.ruolo_applicativo = p_ruolo_applicativo)
                     AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                     AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                     AND pab.attivo = true
                     AND pa.attivo  = true
                     AND pa.tipo    = 'AD_HOC'::config.tipo_profilo_accesso

                  UNION ALL

                  -- 2) REPARTO: binding per UO (solo identita OPERATORE)
                  SELECT DISTINCT
                         pab.profilo_accesso_id,
                         2::smallint AS priorita
                    FROM anagrafiche.identita_digitali id
                    JOIN anagrafiche.risorse_umane ru
                      ON ru.soggetto_ruolo_id = id.soggetto_ruolo_id
                    JOIN config.profili_accesso_bindings pab
                      ON pab.unita_organizzativa_id = ru.unita_organizzativa_id
                    JOIN config.profili_accesso pa
                      ON pa.id = pab.profilo_accesso_id
                   WHERE id.auth_user_id      = p_auth_user_id
                     AND id.attivo            = true
                     AND id.ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo
                     AND (p_ruolo_applicativo IS NULL
                          OR p_ruolo_applicativo = 'OPERATORE'::config.ruolo_applicativo)
                     AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                     AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                     AND ru.attivo  = true
                     AND pab.attivo = true
                     AND pa.attivo  = true
                     AND pa.tipo    = 'REPARTO'::config.tipo_profilo_accesso

                  UNION ALL

                  -- 3) PORTALE: binding per ruolo_applicativo dell'identita
                  SELECT DISTINCT
                         pab.profilo_accesso_id,
                         3::smallint AS priorita
                    FROM anagrafiche.identita_digitali id
                    JOIN config.profili_accesso_bindings pab
                      ON pab.ruolo_applicativo = id.ruolo_applicativo
                    JOIN config.profili_accesso pa
                      ON pa.id = pab.profilo_accesso_id
                   WHERE id.auth_user_id      = p_auth_user_id
                     AND id.attivo            = true
                     AND id.ruolo_applicativo <> 'DISABILITATO'
                     AND (p_ruolo_applicativo IS NULL
                          OR id.ruolo_applicativo = p_ruolo_applicativo)
                     AND (id.valido_dal IS NULL OR id.valido_dal <= CURRENT_DATE)
                     AND (id.valido_al  IS NULL OR id.valido_al  >= CURRENT_DATE)
                     AND pab.attivo = true
                     AND pa.attivo  = true
                     AND pa.tipo    = 'PORTALE'::config.tipo_profilo_accesso;
              $function$;

              COMMENT ON FUNCTION script.fn_get_profili_accesso_applicabili(integer, config.ruolo_applicativo) IS
                  'Profili applicabili a un auth_user, dal piu'' specifico al piu'' generale: AD_HOC '
                  'priorita'' 1 (sull''identita''), REPARTO 2 (sull''unita'' organizzativa), PORTALE 3 '
                  '(sulla veste). Rev 20260925-80 (D-3 di brief-db-pgtap-permessi-ereditati): PORTALE '
                  'era 2, a pari merito col REPARTO, e sotto la veste OPERATORE lo spareggio per '
                  'priorita'' sceglieva a caso. p_ruolo_applicativo NULL = tutte le vesti (legacy), '
                  'valorizzato = solo quella veste; con una veste sola ogni priorita'' ha al massimo un '
                  'profilo (indici unici dei binding e di risorse_umane). I resolver dei permessi da '
                  'operatore passano ''OPERATORE'' tramite script.fn_get_permessi_ereditati_aree / '
                  '_azioni (D-1).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              -- Il rollback non ripristina il pari merito: sarebbe riportare lo spareggio a caso.
              SELECT 1;
