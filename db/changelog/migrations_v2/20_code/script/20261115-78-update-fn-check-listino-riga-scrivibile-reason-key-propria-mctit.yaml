# LA SCRIVIBILE DELLE RIGHE DI LISTINO: UNA REASON_KEY SUA
#   Brief: brief-db-stati-documento-dal-vocabolario §6.29, giro 6f-quater
#   (richiesta BE/FE del 2026-11-15 su FE-L1; via di Tid lo stesso giorno).
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   Il 20261115-65 ha dato al motivo VERSIONE_NON_IN_BOZZA la reason_key
#   vendite.listini.azione_reason.versione_non_in_bozza, che e' gia' di
#   script.fn_check_versione_listino_eliminabile e dice un'altra cosa: non
#   si elimina una versione usata per i prezzi. Sul pulsante «Aggiungi
#   riga» o «Modifica» spento il FE mostrerebbe la frase dell'eliminazione.
#
# ── LA CORREZIONE ──────────────────────────────────────────────────
#   Il motivo 2 prende vendite.listini.azione_reason.righe_non_in_bozza.
#   Restano il motivo, il codice E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA e la
#   chiave dell'eliminabile. Le superfici vendite.vw_listini_versioni_azioni
#   e vendite.vw_listini_righe_azioni leggono la chiave dalla check: non si
#   toccano.
#
# ── FORMA ───────────────────────────────────────────────────────────
#   CREATE OR REPLACE, stessa firma (coi %TYPE), STABLE, INVOKER; il corpo
#   e' quello del catalogo (doc auto-generata dopo il 20261115-65), con la
#   sola chiave cambiata. Il rollback porta il corpo e il COMMENT del -65.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261115-78-update-fn-check-listino-riga-scrivibile-reason-key-propria-mctit.yaml

  - changeSet:
      id: 20261115-78-update-fn-check-listino-riga-scrivibile-reason-key-propria
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_listino_riga_scrivibile: il motivo VERSIONE_NON_IN_BOZZA prende la reason_key
        righe_non_in_bozza, distinta da quella dell'eliminabile. Brief: brief-db-stati-documento-dal-vocabolario, giro 6f-quater.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_listino_riga_scrivibile(
                  p_listino_versione_id vendite.listini_righe.listino_versione_id%TYPE,
                  p_listino_riga_id     vendite.listini_righe.id%TYPE DEFAULT NULL,
                  -- Tipo esplicito: l'operazione del chiamante (INSERT, UPDATE, DELETE),
                  --   non il riflesso di una colonna.
                  p_operazione          text DEFAULT NULL)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_stato      config.stati_doc_listino_versioni.codice_interno%TYPE;
                  v_iniziale   config.stati_doc_listino_versioni.iniziale%TYPE;
                  v_codice     vendite.listini_versioni.codice_versione%TYPE;
                  -- Tipo esplicito: l'operazione, nessuna colonna di cui sia il riflesso.
                  v_operazione text := COALESCE(p_operazione,
                                                CASE WHEN p_listino_riga_id IS NULL THEN 'INSERT' ELSE 'UPDATE' END);
              BEGIN
                  -- =========================================================
                  -- Scopo: dire perche' NON si scrive nelle righe di una versione di
                  --   listino: le righe (vendite.listini_righe), i prezzi dei
                  --   componenti (vendite.listini_righe_componenti) e la periodicita'
                  --   dei kit (vendite.listini_kit). Si scrive solo in bozza.
                  --   p_listino_riga_id e' la riga che c'e' (NULL = una riga nuova),
                  --   della tabella del guard che chiama: entra nel dettaglio e nei
                  --   valori, non nella regola. '[]' = si scrive. Non solleva: lo
                  --   fanno i tre guard, che la chiamano, come le superfici
                  --   (linee-guida-sql §12.5.2). L'ordine dei motivi e' il contratto.
                  --   Il prezzo di una riga della versione in vigore si corregge da
                  --   un'altra porta, la rettifica (script.fn_check_listino_riga_rettificabile).
                  -- =========================================================
                  SELECT s.codice_interno, s.iniziale, lv.codice_versione
                    INTO v_stato, v_iniziale, v_codice
                    FROM vendite.listini_versioni lv
                    JOIN config.stati_doc_listino_versioni s ON s.id = lv.stato_doc_listino_versione_id
                   WHERE lv.id = p_listino_versione_id;

                  -- 0. Una versione che non si legge non si giudica: parlano la FK
                  --    e la policy della tabella che si scrive.
                  IF NOT FOUND THEN
                      RETURN jsonb_build_array();
                  END IF;

                  -- 1. In bozza (lo stato iniziale del vocabolario) si scrive tutto.
                  IF v_iniziale THEN
                      RETURN jsonb_build_array();
                  END IF;

                  -- 2. Una versione CHIUSA e' la storia dei prezzi. CHIUSA e' la
                  --    destinazione della chiusura, e si nomina col codice.
                  IF v_stato = 'CHIUSA' THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_RIGA_LISTINO_VERSIONE_CHIUSA',
                          'reason',     'VERSIONE_CHIUSA',
                          'reason_key', 'vendite.listini.azione_reason.versione_chiusa',
                          'dettaglio',  jsonb_build_object('listino_versione_id', p_listino_versione_id,
                                                           'listino_riga_id', p_listino_riga_id,
                                                           'stato', v_stato,
                                                           'operazione', v_operazione),
                          'valori',     jsonb_build_array(v_operazione,
                                                          COALESCE(p_listino_riga_id::text, 'nuova'),
                                                          v_stato)));
                  END IF;

                  -- 3. Fuori dalla bozza non si aggiunge, non si modifica e non si
                  --    elimina niente: la versione e' il listino in uso, o lo sara'.
                  --    La reason_key e' sua: versione_non_in_bozza e' dell'eliminazione
                  --    della versione (script.fn_check_versione_listino_eliminabile).
                  RETURN jsonb_build_array(jsonb_build_object(
                      'codice',     'E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA',
                      'reason',     'VERSIONE_NON_IN_BOZZA',
                      'reason_key', 'vendite.listini.azione_reason.righe_non_in_bozza',
                      'dettaglio',  jsonb_build_object('listino_versione_id', p_listino_versione_id,
                                                       'listino_riga_id', p_listino_riga_id,
                                                       'stato', v_stato,
                                                       'operazione', v_operazione),
                      'valori',     jsonb_build_array(v_codice::text)));
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_listino_riga_scrivibile(vendite.listini_righe.listino_versione_id%TYPE, vendite.listini_righe.id%TYPE, text)
              IS 'Perche'' non si scrive nelle righe di una versione di listino (le righe vendite.listini_righe, i prezzi dei componenti vendite.listini_righe_componenti, la periodicita'' dei kit vendite.listini_kit): jsonb array di motivi (codice, reason, reason_key, dettaglio, valori), il primo e'' quello che si solleva; ''[]'' = si scrive. Si scrive solo in bozza, lo stato iniziale del vocabolario config.stati_doc_listino_versioni. p_listino_riga_id e'' la riga che c''e'' (NULL = una riga nuova), della tabella del guard che chiama, e p_operazione l''operazione (default: INSERT senza riga, UPDATE con): entrano nel dettaglio e nei valori, non nella regola. Una versione che non si legge non si giudica (''[]'': parlano la FK e la policy). Motivi, in ordine: 1. E_RIGA_LISTINO_VERSIONE_CHIUSA (VERSIONE_CHIUSA, reason_key vendite.listini.azione_reason.versione_chiusa: la versione e'' CHIUSA, la storia dei prezzi); 2. E_RIGA_LISTINO_VERSIONE_NON_IN_BOZZA (VERSIONE_NON_IN_BOZZA, reason_key vendite.listini.azione_reason.righe_non_in_bozza: la versione e'' il listino in uso, o lo sara''). Il prezzo di una riga della versione in vigore si corregge con la rettifica, il verbo vendite.fn_rettifica_riga_listino (script.fn_check_listino_riga_rettificabile). Non solleva. La chiamano i guard vendite.trgfn_listini_righe_guard_stato, vendite.trgfn_listini_righe_comp_guard_immutabilita_v5 e vendite.trgfn_listini_kit_guard, e le superfici vendite.vw_listini_versioni_azioni (aggiunta_riga_blocco_*, variazione_blocco_*, prezzi_bundle_blocco_*, periodicita_kit_blocco_*) e vendite.vw_listini_righe_azioni (modifica_blocco_*), registro config.azioni_riga. SECURITY INVOKER, STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
