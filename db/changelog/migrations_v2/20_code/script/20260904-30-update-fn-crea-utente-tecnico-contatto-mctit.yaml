# ------------------------------------------------------------
# ⛔ CORRETTIVA di 20260904-29 — la fabbrica crea anche il CONTATTO di
# riferimento del soggetto di processo.
#
# ⛔ IL TERZO MURO. `anagrafiche.trgfn_soggetti_guard_soggetto_contatti` (trigger
# differito, verifica al commit) pretende che ogni soggetto abbia almeno un
# contatto. Un processo non ha email ne' telefono.
#
# ⭐ MA NON SERVE MODIFICARE NIENTE, e questo e' il punto: il guard ammette
# ESPLICITAMENTE un contatto marcato `is_default` anche con tutti i canali
# vuoti —
#     WHERE c.is_default OR c.email IS NOT NULL OR c.telefono IS NOT NULL ...
# Non e' una scappatoia trovata di sponda: e' un ramo che l'autore del guard ha
# lasciato aperto apposta. ⇒ Si crea un contatto «Processo automatico»,
# `is_default = true`, senza canali. Dice una cosa vera: il riferimento di
# questo soggetto e' il processo stesso, e canali non ne ha.
#
# ⚠️ LE DUE STRADE SCARTATE, e perche' — vale la pena scriverle, perche'
# sembravano piu' pulite:
#   ⛔ armonizzare il guard con i suoi due fratelli (uscire presto quando
#      `tipo_soggetto_dettaglio_id IS NULL`, come gia' fanno
#      trgfn_soggetti_guard_indirizzi_required e ..._dati_societari_required):
#      sarebbe coerente, ma allenterebbe un invariante anagrafico per TUTTI i
#      soggetti senza natura dichiarata, non solo per i processi. Un cantiere
#      sull'identita' dei job non e' la sede per rilassare l'anagrafica;
#   ⛔ esentare il guard quando il soggetto porta il ruolo PROC_AUTO: chirurgico,
#      ma ha un difetto serio — il trigger e' DIFFERITO, e sotto
#      `SET CONSTRAINTS ALL IMMEDIATE` (cioe' in ogni pgTAP) scatterebbe PRIMA
#      che il ruolo esista. Un guard che si comporta diversamente nei test e in
#      esercizio e' peggio di uno rigido.
#
# ⇒ Nessun guard modificato, nessun invariante allentato per nessun altro.
#
# ⚠️ E' il TERZO rifiuto della stessa natura (RIS_UMANA + persona fisica, tipo
# del binding, contatti). Dicono tutti la stessa cosa, e va scritta:
# **in questo database un'identita' operatore e', per costruzione, una persona
# reale raggiungibile.** I processi ci entrano solo dichiarandosi tali a ogni
# passo — non aggirando i controlli.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260904-30-update-fn-crea-utente-tecnico-contatto-mctit.yaml

  - changeSet:
      id: 20260904-30-update-fn-crea-utente-tecnico-contatto
      author: mctit
      failOnError: true
      comment: >
        script.fn_crea_utente_tecnico crea anche il contatto di riferimento del
        soggetto di processo (tipo PRINCIPALE, is_default, senza canali), che e'
        la strada che il guard differito sui contatti ammette esplicitamente.
        Nessun guard anagrafico modificato.
      preConditions:
        - onFail: HALT
        - and:
            - tableExists:
                { schemaName: anagrafiche, tableName: contatti }
            - sqlCheck:
                expectedResult: "1"
                sql: |
                  SELECT COUNT(*)
                    FROM pg_proc p
                    JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script'
                     AND p.proname = 'fn_crea_utente_tecnico';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_crea_utente_tecnico(
                  p_processo_codice dbops.processi.codice%TYPE,
                  p_profilo_codice  config.profili_accesso.codice%TYPE DEFAULT NULL)
               RETURNS integer
               LANGUAGE plpgsql
              AS $function$
              DECLARE
                  -- ⚠️ Niente %TYPE su django.*.
                  v_auth_user_id    integer;
                  v_processo        dbops.processi%ROWTYPE;
                  v_profilo         config.profili_accesso%ROWTYPE;
                  v_tipo_ruolo_id   config.tipi_ruoli.id%TYPE;
                  v_tipo_contatto_id anagrafiche.contatti.tipo_contatto_id%TYPE;
                  v_stato_id        anagrafiche.soggetti.stato_id%TYPE;
                  v_soggetto_id     anagrafiche.soggetti.id%TYPE;
                  v_sog_ruolo_id    anagrafiche.soggetti_ruoli.id%TYPE;
                  v_identita_id     anagrafiche.identita_digitali.id%TYPE;
              BEGIN
                  -- =====================================================
                  -- Guard 1: il processo vuole davvero un utente tecnico.
                  --   Eleggibili i soli DOMINIO headless. ⛔ I processi su
                  --   canale CODA no: girano con lo scope dell'operatore che
                  --   li accoda, e hanno gia' un nome — quello di una persona.
                  -- =====================================================
                  SELECT * INTO v_processo
                    FROM dbops.processi
                   WHERE codice = p_processo_codice;

                  IF NOT FOUND
                     OR NOT v_processo.attivo
                     OR v_processo.obsoleto_dal IS NOT NULL
                     OR v_processo.classe <> 'DOMINIO'
                     OR v_processo.canale NOT IN ('PGAGENT', 'COMMAND') THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_PROCESSO_NON_ELEGGIBILE_UTENTE_TECNICO',
                          jsonb_build_object('processo_codice', p_processo_codice),
                          NULL::uuid, p_processo_codice);
                  END IF;

                  -- =====================================================
                  -- Guard 2: il profilo, SE indicato — di norma non lo e'.
                  --   Un processo headless non passa da percorsi
                  --   capability-gated: zero capability e' minimo privilegio.
                  --   ⛔ Se c'e', dev'essere AD_HOC (l'unico tipo legabile a
                  --   un'identita') e quindi mai SUPER_ADMIN.
                  -- =====================================================
                  IF p_profilo_codice IS NOT NULL THEN
                      SELECT * INTO v_profilo
                        FROM config.profili_accesso
                       WHERE codice = p_profilo_codice;

                      IF NOT FOUND
                         OR NOT v_profilo.attivo
                         OR v_profilo.tipo <> 'AD_HOC'::config.tipo_profilo_accesso THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'script.fn_crea_utente_tecnico',
                              'E_UTENTE_TECNICO_PROFILO_VIETATO',
                              jsonb_build_object('profilo_codice', p_profilo_codice),
                              NULL::uuid, p_profilo_codice);
                      END IF;
                  END IF;

                  -- Guard 3: uno per processo. Ci si ferma prima dell'unique.
                  IF EXISTS (SELECT 1 FROM dbops.processi_identita
                              WHERE processo_id = v_processo.id AND attivo) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_crea_utente_tecnico',
                          'E_UTENTE_TECNICO_GIA_ESISTE',
                          jsonb_build_object('processo_codice', p_processo_codice),
                          NULL::uuid, p_processo_codice);
                  END IF;

                  SELECT id INTO v_tipo_ruolo_id
                    FROM config.tipi_ruoli
                   WHERE codice_interno = 'PROC_AUTO';

                  SELECT id INTO v_tipo_contatto_id
                    FROM config.tipi_contatti
                   WHERE codice_interno = 'PRINCIPALE';

                  -- Lo stato e' un NOT NULL da riempire, ma per un processo non
                  -- significa niente: si usa quello dell'installazione.
                  SELECT id INTO v_stato_id
                    FROM config.stati
                   WHERE codice_iso2 = 'IT';

                  -- =====================================================
                  -- 1. L'utente Django, con password INUTILIZZABILE: il
                  --   prefisso '!' e' la convenzione Django per «non puo'
                  --   autenticarsi». Un processo non fa login, e nessuno deve
                  --   poterlo fare al posto suo.
                  -- =====================================================
                  INSERT INTO django.auth_user
                      (password, is_superuser, username, first_name, last_name,
                       email, is_staff, is_active, date_joined)
                  VALUES ('!' || md5(random()::text || clock_timestamp()::text),
                          false, p_processo_codice, '', '',
                          '', false, true, now())
                  RETURNING id INTO v_auth_user_id;

                  -- =====================================================
                  -- 2. Il soggetto: UNO PER PROCESSO (uq_soggetto_ruolo non
                  --   ammette N processi sullo stesso soggetto). `codice` resta
                  --   NULL: lo genera trgfn_soggetti_gen_codice.
                  --   `tipo_soggetto_dettaglio_id` resta NULL, e cosi' i guard
                  --   differiti su indirizzi e dati societari escono da soli:
                  --   entrambi dicono «senza natura dichiarata non impongo
                  --   niente».
                  -- =====================================================
                  INSERT INTO anagrafiche.soggetti
                      (ragione_sociale, stato_id)
                  VALUES ('Processo automatico: ' || p_processo_codice, v_stato_id)
                  RETURNING id INTO v_soggetto_id;

                  -- =====================================================
                  -- 3. Il CONTATTO di riferimento.
                  --   ⭐ Il guard differito sui contatti pretende almeno una
                  --   riga, e ammette esplicitamente `is_default` con tutti i
                  --   canali vuoti. Non e' una scappatoia: e' un ramo lasciato
                  --   aperto apposta, e qui dice una cosa vera — il riferimento
                  --   di questo soggetto e' il processo stesso, e canali non ne
                  --   ha. ⛔ Niente email inventate in un'anagrafica vera.
                  -- =====================================================
                  INSERT INTO anagrafiche.contatti
                      (soggetto_id, tipo_contatto_id, nominativo, is_default)
                  VALUES (v_soggetto_id, v_tipo_contatto_id,
                          'Processo automatico: ' || p_processo_codice, true);

                  -- Padre e figlio in ISTRUZIONI SEPARATE: una CTE unica
                  -- condividerebbe la stessa snapshot e i guard che risolvono
                  -- dal padre non lo troverebbero.
                  INSERT INTO anagrafiche.soggetti_ruoli
                      (soggetto_id, tipo_ruolo_id)
                  VALUES (v_soggetto_id, v_tipo_ruolo_id)
                  RETURNING id INTO v_sog_ruolo_id;

                  -- =====================================================
                  -- 4. L'identita': OPERATORE obbligatorio (ogni policy RLS lo
                  --   pretende in AND) + flag tecnica, che sceglie il ramo
                  --   PROC_AUTO del guard di coerenza (20260904-28).
                  -- =====================================================
                  INSERT INTO anagrafiche.identita_digitali
                      (soggetto_ruolo_id, auth_user_id, ruolo_applicativo, tecnica)
                  VALUES (v_sog_ruolo_id, v_auth_user_id,
                          'OPERATORE'::config.ruolo_applicativo, true)
                  RETURNING id INTO v_identita_id;

                  -- 5. Il binding SOLO se un profilo e' stato chiesto.
                  IF p_profilo_codice IS NOT NULL THEN
                      INSERT INTO config.profili_accesso_bindings
                          (profilo_accesso_id, identita_digitale_id)
                      VALUES (v_profilo.id, v_identita_id);
                  END IF;

                  -- 6. Il legame processo -> utente.
                  INSERT INTO dbops.processi_identita
                      (processo_id, auth_user_id)
                  VALUES (v_processo.id, v_auth_user_id);

                  -- ⛔ NON si scrive config.user_emittenti_fiscali: il perimetro
                  --   lo aggiunge una PERSONA (D-9), e
                  --   dbops.vw_emittenti_non_serviti dice che cosa manca.
                  RETURN v_auth_user_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_crea_utente_tecnico(text, character varying)
              IS 'Crea l''utente tecnico di un processo automatico: utente Django con password inutilizzabile, soggetto dedicato (UNO per processo) col suo contatto di riferimento, soggetto_ruolo PROC_AUTO, identita'' OPERATORE con flag tecnica, riga in dbops.processi_identita. Ritorna l''auth_user_id. ⭐ Rev 2026-09-04: crea anche il CONTATTO — il guard differito anagrafiche.trgfn_soggetti_guard_soggetto_contatti pretende almeno una riga e ammette esplicitamente is_default coi canali vuoti, che per un processo e'' la verita'': il riferimento e'' il processo stesso e canali non ne ha. Nessun guard anagrafico e'' stato modificato. Il profilo e'' FACOLTATIVO e di norma non si passa (zero capability = minimo privilegio); se indicato dev''essere AD_HOC. ⛔ Mai SUPER_ADMIN. ⛔ NON scrive config.user_emittenti_fiscali (D-9). Brief: brief-db-processi-automatici-identita-e-perimetro §4.';
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Si torna alla forma di 20260904-29 rilanciando quel changeSet.
              DROP FUNCTION IF EXISTS
                script.fn_crea_utente_tecnico(text, character varying);
