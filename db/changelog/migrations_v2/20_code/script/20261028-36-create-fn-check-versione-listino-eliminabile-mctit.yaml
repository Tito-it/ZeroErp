# CHE COSA VIETA DI ELIMINARE UNA VERSIONE DI LISTINO
#   Brief: brief-modello-documento-vendita §16.11 (E-1, E-2, E-3 di Tid,
#   2026-10-28). Gemella di script.fn_check_versione_listino_attivabile
#   (20261028-07).
#
# ── PERCHE' ─────────────────────────────────────────────────────────
#   «Si elimina solo una BOZZA» stava nel ramo DELETE del guard per stato
#   (20261028-09), che solleva e basta: il pulsante «Elimina» non poteva
#   leggerne il motivo, e il frontend lo decideva dallo stato. Una regola,
#   tre lettori: il guard per stato (ramo DELETE), il verbo
#   vendite.fn_elimina_versione_listino (prima di cancellare componenti e
#   righe) e la superficie vendite.vw_listini_versioni_azioni (il motivo del
#   pulsante spento, registro config.azioni_riga).
#
# ── I MOTIVI (il primo e' quello che si solleva) ────────────────────
#   1. NON_IN_BOZZA — la versione e' ATTIVA o CHIUSA: e' stata visibile ai
#      prezzi (decisione O2 di sviluppo-listini-v2). Codice di prima,
#      E_LISTINO_VERSIONE_NON_ELIMINABILE, coi suoi stessi valori.
#   2. CITATA — una BOZZA che un documento tiene con una FK (un contratto,
#      un'offerta, un'attivita' di commessa: la versione o una sua riga).
#      Prima cadeva sulla FK con un errore tecnico (E-3). Le tabelle si
#      derivano da pg_constraint (script.fn_tabelle_che_trattengono): la
#      prossima FK entra da sola. Righe e componenti della versione non
#      trattengono: il verbo li cancella con lei.
#   Con il motivo 1 si esce: una versione uscita dalla bozza non si elimina
#   comunque, e la ricerca costa una lettura per FK.
#   Versione inesistente o fuori perimetro: nessun motivo (come la gemella;
#   il verbo la cerca prima).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261028-36-create-fn-check-versione-listino-eliminabile-mctit.yaml

  - changeSet:
      id: 20261028-36-create-fn-check-versione-listino-eliminabile
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_versione_listino_eliminabile: perche' una versione di listino non si elimina
        (non in bozza; citata da un documento). Brief: brief-modello-documento-vendita §16.11.
      preConditions:
        - onFail: HALT
        - not:
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_check_versione_listino_eliminabile';
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_tabelle_che_trattengono';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_check_versione_listino_eliminabile(
                  p_versione_id vendite.listini_versioni.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              DECLARE
                  v_versione vendite.listini_versioni%ROWTYPE;
                  v_stato    config.stati_doc_listino_versioni.codice_interno%TYPE;
                  -- Righe e componenti della versione: il verbo li cancella
                  -- con lei, non trattengono.
                  v_proprie  regclass[] := ARRAY['vendite.listini_righe'::regclass,
                                                 'vendite.listini_righe_componenti'::regclass];
                  -- Le tabelle che trattengono, `schema.tabella`.
                  v_dove     text[];
              BEGIN
                  -- =========================================================
                  -- Scopo: dire perche' una versione di listino NON si
                  --   elimina. '[]' = si elimina. Non solleva: sollevare e'
                  --   del guard per stato e del verbo, che la chiamano, come
                  --   la superficie della lista (linee-guida-sql §12.5.2).
                  --   Vedi l'intestazione del changeSet 20261028-36.
                  -- =========================================================
                  SELECT lv.* INTO v_versione
                    FROM vendite.listini_versioni lv
                   WHERE lv.id = p_versione_id;
                  IF NOT FOUND THEN
                      RETURN jsonb_build_array();
                  END IF;

                  SELECT s.codice_interno INTO v_stato
                    FROM config.stati_doc_listino_versioni s
                   WHERE s.id = v_versione.stato_doc_listino_versione_id;

                  -- 1. Fuori dalla bozza: e' stata visibile ai prezzi.
                  IF v_stato IS DISTINCT FROM 'BOZZA' THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_LISTINO_VERSIONE_NON_ELIMINABILE',
                          'reason',     'VERSIONE_NON_IN_BOZZA',
                          'reason_key', 'vendite.listini.azione_reason.versione_non_in_bozza',
                          'dettaglio',  jsonb_build_object('listino_versione_id', v_versione.id,
                                                           'listino_id', v_versione.listino_id,
                                                           'stato', v_stato),
                          'valori',     jsonb_build_array(v_versione.codice_versione,
                                                          COALESCE(v_stato, 'NULL'))));
                  END IF;

                  -- 2. Un documento la tiene: la versione, o una sua riga o
                  --    un suo componente.
                  SELECT array_agg(DISTINCT d.tabella ORDER BY d.tabella) INTO v_dove
                    FROM (
                      SELECT unnest(script.fn_tabelle_che_trattengono(
                                 'vendite.listini_versioni'::regclass,
                                 ARRAY[v_versione.id]::bigint[], v_proprie))
                      UNION ALL
                      SELECT unnest(script.fn_tabelle_che_trattengono(
                                 'vendite.listini_righe'::regclass,
                                 ARRAY(SELECT r.id FROM vendite.listini_righe r
                                        WHERE r.listino_versione_id = v_versione.id)::bigint[],
                                 v_proprie))
                      UNION ALL
                      SELECT unnest(script.fn_tabelle_che_trattengono(
                                 'vendite.listini_righe_componenti'::regclass,
                                 ARRAY(SELECT c.id FROM vendite.listini_righe_componenti c
                                        WHERE c.listino_versione_id = v_versione.id)::bigint[],
                                 v_proprie))
                    ) AS d(tabella);

                  IF cardinality(v_dove) > 0 THEN
                      RETURN jsonb_build_array(jsonb_build_object(
                          'codice',     'E_LISTINO_VERSIONE_CITATA',
                          'reason',     'VERSIONE_CITATA',
                          'reason_key', 'vendite.listini.azione_reason.versione_citata',
                          'dettaglio',  jsonb_build_object('listino_versione_id', v_versione.id,
                                                           'listino_id', v_versione.listino_id,
                                                           'dove', to_jsonb(v_dove)),
                          'valori',     jsonb_build_array(v_versione.codice_versione,
                                                          array_to_string(v_dove, ', '))));
                  END IF;

                  RETURN jsonb_build_array();
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_versione_listino_eliminabile(bigint) IS
                  'Perche'' una versione di listino NON si elimina: jsonb array di motivi (codice, reason, reason_key, dettaglio, valori), il primo e'' quello che si solleva; ''[]'' = si elimina. Motivi: 1. E_LISTINO_VERSIONE_NON_ELIMINABILE (VERSIONE_NON_IN_BOZZA: ATTIVA o CHIUSA, e'' stata visibile ai prezzi; decisione O2 di sviluppo-listini-v2); 2. E_LISTINO_VERSIONE_CITATA (VERSIONE_CITATA: una BOZZA che un documento tiene con una FK RESTRICT o NO ACTION, la versione o una sua riga o un suo componente; le tabelle da script.fn_tabelle_che_trattengono, dettaglio.dove; righe e componenti della versione non contano, il verbo li cancella con lei). Con il motivo 1 esce. Versione inesistente o fuori perimetro: ''[]''. Non solleva. La chiamano il guard vendite.trgfn_listini_versioni_guard_per_stato (ramo DELETE), il verbo vendite.fn_elimina_versione_listino (prima di cancellare) e la superficie vendite.vw_listini_versioni_azioni (registro config.azioni_riga, ELIMINA_VERSIONE_LISTINO). SECURITY INVOKER, STABLE. Brief: brief-modello-documento-vendita §16.11 (E-1, E-2, E-3, Tid 2026-10-28).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_versione_listino_eliminabile(bigint);
