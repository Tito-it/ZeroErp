                  INTO v_trovato, v_fatt_stato, v_fatt_numero, v_fatt_congela
                  FROM vendite.fatture f
                  LEFT JOIN config.stati_doc_fiscale sdf
                    ON sdf.id = f.stato_doc_fiscale_id
                 WHERE f.id = p_fattura_id;

                IF NOT COALESCE(v_trovato, false) THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_fattura_eliminabile_da_lotto','E_FATTURA_NON_TROVATA',
                    jsonb_build_object('fattura_id',p_fattura_id),
