                    'reason_key', 'vendite.lotti.azione_reason.fattura_non_pre_fiscale',
                    'dettaglio',  COALESCE(v_fatt_stato, '-'));
                END IF;

                -- MOTIVO 4 — la fattura ha gia' un numero.
                -- ⚠️ Ridondante per costruzione rispetto al 3 (a EMESSA la
                -- fattura non e' numerata, C-19) e va tenuto lo stesso: il
