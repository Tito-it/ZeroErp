databaseChangeLog:
  - logicalFilePath: /migrations_v2/30_code/script/20250926-07-fn-get-parameter-full-mctit.yaml
  
  - changeSet:
      id: 20250926-06-update-fn-get-parameter-full
      author: mctit
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: parameters }
        - tableExists: { schemaName: config, tableName: parameter_overrides }

      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_parameter_full(
                  p_code          text,
                  p_tenant_id     integer DEFAULT NULL,
                  p_django_user_id integer  DEFAULT NULL,   -- nuovo: utente Django
                  p_group_ids     integer[] DEFAULT NULL,   -- nuovo: gruppi Django
                  p_session_key   text    DEFAULT NULL,
                  p_function_name text    DEFAULT NULL
              )
              RETURNS text
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_param_id  BIGINT;
                  v_default   TEXT;
                  v_override  TEXT;
              BEGIN
                  -- 1) Recupera parametro
                  SELECT id, default_value
                    INTO v_param_id, v_default
                  FROM config.parameters
                  WHERE code = p_code;

                  IF NOT FOUND THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database',
                          'fn_get_parameter_full',
                          'ERRORE_PARAMETRI_TABELLA',
                          jsonb_build_object(
                              'codice_parametro', p_code,
                              'nome_tabella',      'config.parameters'
                          ),
                          NULL::uuid,
                          'config.parameters',
                          p_code::text
                      );
                      RAISE EXCEPTION 'Parametro % non trovato in config.parameters', p_code
                        USING ERRCODE = '22023';
                  END IF;

                  -- 2) Trova override secondo precedenza:
                  --    user → group → tenant → session → function
                  SELECT po.overridden_value
                    INTO v_override
                  FROM config.parameter_overrides po
                  WHERE po.parameter_id = v_param_id
                    AND (
                      (p_django_user_id IS NOT NULL AND po.django_user_id = p_django_user_id) OR
                      (p_group_ids     IS NOT NULL AND po.django_group_id = ANY(p_group_ids)) OR
                      (p_tenant_id     IS NOT NULL AND po.tenant_id       = p_tenant_id) OR
                      (p_session_key   IS NOT NULL AND po.session_key     = p_session_key) OR
                      (p_function_name IS NOT NULL AND po.function_name   = p_function_name)
                    )
                  ORDER BY
                    CASE
                      WHEN po.django_user_id = p_django_user_id THEN 1
                      WHEN (p_group_ids IS NOT NULL AND po.django_group_id = ANY(p_group_ids)) THEN 2
                      WHEN po.tenant_id   = p_tenant_id   THEN 3
                      WHEN po.session_key = p_session_key THEN 4
                      WHEN po.function_name = p_function_name THEN 5
                      ELSE 6
                    END,
                    po.id
                  LIMIT 1;

                  -- 3) Ritorna override o default
                  IF FOUND THEN
                      RETURN v_override;
                  ELSE
                      RETURN v_default;
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_parameter_full(text, integer, integer, integer[], text, text)
                IS 'Risoluzione parametro con precedenza: user → group → tenant → session → function → default. Usa config.parameter_overrides (django_user_id/django_group_id).';


# Elimmina vecchia funzione
  - changeSet:
      id: 20250927-02-update-fn-get-parameter-full
      author: mctit
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |

                DROP FUNCTION IF EXISTS script.fn_get_parameter_full(text, integer, integer, text, text);