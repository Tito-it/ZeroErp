# R-5 — seconda meta' dell'estrazione iniziata in 20260818-58.
#
# ⭐ COSA CAMBIA: niente, per chi la chiama. Il check risponde esattamente come
#    prima; cambia da dove prende la risposta. La regola a due livelli non e'
#    piu' scritta qui: si chiede a script.fn_get_ba_emittente_sr_id.
#
# ⚠️ PERCHE' FARLO ADESSO E NON «UN GIORNO». Il changeSet -58 ha estratto la
#    regola per poterla MOSTRARE (R-5 ha bisogno del nome, non del si'/no). Se
#    ci si fermasse li', la stessa regola vivrebbe in DUE posti — qui in forma
#    di EXISTS e la' in forma di COALESCE. Due copie non restano uguali: la
#    prossima modifica ne tocca una, e il filtro e l'etichetta a video
#    inizierebbero a raccontare cose diverse sullo stesso billing account. E'
#    il difetto peggiore possibile per una funzione di perimetro, perche' e'
#    silenzioso.
#
# ⚠️ L'EQUIVALENZA E' ESATTA, e vale la pena scriverla perche' non e' ovvia a
#    colpo d'occhio:
#      - vecchio livello 1 = «esiste una riga efba su questo BA verso uno degli
#        emittenti autorizzati». Poiche' uq_emittenti_fiscali_ba rende la riga
#        per BA al massimo UNA, «esiste una riga verso uno di essi» equivale a
#        «l'unica riga punta a uno di essi»;
#      - vecchio livello 2 = «il BA non ha nessun mapping E uno degli emittenti
#        autorizzati e' is_default». Poiche' uq_emittenti_fiscali_ba_default
#        rende il default al massimo UNO, equivale a «il default esiste ed e'
#        fra gli autorizzati».
#    In entrambi i casi: «l'emittente risolto del BA sta fra gli autorizzati».
#    Che e' la riga sola qui sotto.
#
# ⚠️ I DUE GUARD DI TESTA RESTANO, e non sono ridondanti col NULL della
#    delegata: `p_emittente_ids` vuoto o NULL significa «nessun emittente
#    autorizzato», e la risposta e' false PRIMA di qualunque risoluzione. Senza
#    quel ramo si arriverebbe a `x = ANY(NULL)` che vale NULL, non false — e un
#    NULL in un WHERE non filtra: non nega, sparisce.
#
# brief-db-perimetro-emittente-fase-e-e-ricerca.md
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260818-59-update-fn-check-ba-visible-delega-mctit.yaml

  - changeSet:
      id: 20260818-59-update-fn-check-ba-visible-delega
      author: mctit
      runOnChange: false
      validCheckSums:
        - ANY
      comment: >
        fn_check_ba_visible_for_emittenti delega la regola a due livelli alla
        nuova script.fn_get_ba_emittente_sr_id (20260818-58). Risposta identica
        — l'equivalenza e' garantita dai due indici univoci uq_emittenti_fiscali_ba
        e uq_emittenti_fiscali_ba_default — ma la regola smette di esistere in
        due copie destinate a divergere: il filtro (questa) e l'etichetta a
        video (R-5) leggono lo stesso verbo. Brief Fase E, R-5.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_get_ba_emittente_sr_id';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_ba_visible_for_emittenti(
                p_billing_account_id anagrafiche.billing_account.id%TYPE,
                p_emittente_ids      bigint[]
              )
               RETURNS boolean
               LANGUAGE plpgsql
               STABLE PARALLEL SAFE
              AS $function$
              DECLARE
                  v_emittente_sr_id bigint;
              BEGIN
                  -- Convenzione fn_check_*: pure boolean, nessun raise.

                  -- ⚠️ Questo ramo NON e' assorbito dalla delegata. «Nessun
                  --   emittente autorizzato» e' una risposta secca, e va data
                  --   prima di risolvere alcunche': senza, si finirebbe su
                  --   `x = ANY(NULL)` che vale NULL — e un NULL in un WHERE
                  --   non nega, sparisce.
                  IF p_emittente_ids IS NULL OR array_length(p_emittente_ids, 1) IS NULL THEN
                      RETURN false;
                  END IF;

                  -- La regola a due livelli (mapping specifico -> fallback
                  -- default) vive in UN posto solo: 20260818-58. Qui resta
                  -- solo la domanda di questa funzione — «e' fra i miei?».
                  -- Il BA NULL lo gestisce la delegata, che risponde NULL.
                  v_emittente_sr_id := script.fn_get_ba_emittente_sr_id(p_billing_account_id);

                  IF v_emittente_sr_id IS NULL THEN
                      RETURN false;
                  END IF;

                  RETURN v_emittente_sr_id = ANY(p_emittente_ids);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_check_ba_visible_for_emittenti(bigint, bigint[]) IS
                  'Pure check (fn_check_*, boolean, no raise): un billing_account e'' visibile '
                  'per un set di emittenti autorizzati? '
                  'Rev 2026-08-18 (R-5, brief perimetro-emittente Fase E): la regola a due '
                  'livelli — mapping specifico BA->emittente, altrimenti fallback '
                  'sull''emittente is_default — NON e'' piu'' scritta qui. Vive in '
                  'script.fn_get_ba_emittente_sr_id, e questa funzione si limita a chiedere '
                  '«l''emittente risolto sta fra quelli autorizzati?». Risposta identica alla '
                  'versione precedente: l''equivalenza e'' garantita dai due indici UNIVOCI '
                  '(uq_emittenti_fiscali_ba, uq_emittenti_fiscali_ba_default), che rendono '
                  'sia il mapping sia il default al massimo uno. '
                  '⭐ Il motivo dell''estrazione: R-5 deve MOSTRARE il nome dell''emittente '
                  'nella riga di ricerca, non filtrarci sopra. Senza estrarre, la stessa '
                  'regola sarebbe finita in due copie — il filtro e l''etichetta — che alla '
                  'prima modifica avrebbero iniziato a raccontare cose diverse sullo stesso '
                  'billing account, in silenzio. '
                  '⚠️ p_emittente_ids NULL o vuoto = «nessun emittente autorizzato» = false, '
                  'e la risposta arriva prima di risolvere: e'' il ramo fail-closed. '
                  'Usata da fn_search_soggetti_universale e fn_get_search_detail (ramo CL).';
      rollback:
        - sql:
            sql: |
              -- Nessun rollback automatico: la versione precedente conteneva la
              -- SECONDA copia della regola a due livelli. Ripristinarla
              -- rimetterebbe in piedi proprio la divergenza che questo changeSet
              -- chiude. Se serve tornare indietro si scrive un changeSet nuovo,
              -- con numerazione successiva e la ragione esplicita.
              SELECT 1;
