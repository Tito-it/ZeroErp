databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260419-13-update-fn-check-azione-processo-mctit.yaml

  - changeSet:
      id: 20260419-13-update-fn-check-azione-processo
      author: mctit
      runOnChange: false
      validCheckSum: [ANY]
      comment: >
        Refactor script.fn_check_azione_processo per usare il nuovo modello
        multi-face auth (§4.6.B.4 WIP). Simmetrico agli altri fn_resolve_*:
        ramo ADMIN -> fn_is_super_admin, ramo DISABILITATO -> check identita
        OPERATORE attiva. Mantiene firma e semantica boolean.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 1
            sql: |
              SELECT COUNT(*) FROM pg_proc p
                JOIN pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script'
                 AND p.proname = 'fn_is_super_admin';
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_azione_processo(
                  p_auth_user_id         integer,
                  p_permission_codename  character varying
              )
              RETURNS boolean
              LANGUAGE plpgsql
              STABLE
              AS $function$
              DECLARE
                  v_abilitata config.user_override_azioni.abilitata%TYPE;
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Verifica se un'azione di processo e' abilitata per
                  --   un utente. Funzione fn_check_*: puro boolean, no raise.
                  --
                  -- Catena (refactor §4.6.B.4):
                  --   1. Assenza identita OPERATORE attiva -> false
                  --   2. fn_is_super_admin -> true
                  --   3. Override utente azione (se valido)
                  --   4. Profilo reparto azione (via UO/RUA legacy)
                  --   5. Default -> false (negata)
                  -- =========================================================

                  -- 1. Identita OPERATORE attiva (helper DRY §4.6.B.0).
                  IF NOT script.fn_has_identita_attiva(
                             p_auth_user_id,
                             'OPERATORE'::config.ruolo_applicativo) THEN
                      RETURN false;
                  END IF;

                  -- 2. Super admin? Bypass totale.
                  IF script.fn_is_super_admin(p_auth_user_id) THEN
                      RETURN true;
                  END IF;

                  -- 3. Override utente azione (OPERATIVO)
                  SELECT uoa.abilitata
                    INTO v_abilitata
                    FROM config.user_override_azioni uoa
                    JOIN config.azioni_processo ap ON ap.id = uoa.azione_id
                   WHERE uoa.auth_user_id = p_auth_user_id
                     AND ap.permission_codename = p_permission_codename
                     AND (uoa.valido_dal IS NULL OR uoa.valido_dal <= CURRENT_DATE)
                     AND (uoa.valido_al  IS NULL OR uoa.valido_al  >= CURRENT_DATE);

                  IF FOUND THEN
                      RETURN v_abilitata;
                  END IF;

                  -- 4. Profilo reparto azione (catena legacy via RUA)
                  SELECT pra.abilitata
                    INTO v_abilitata
                    FROM config.profili_reparto_azioni pra
                    JOIN config.azioni_processo ap ON ap.id = pra.azione_id
                    JOIN anagrafiche.risorse_umane_auth_user rau
                      ON rau.auth_user_id = p_auth_user_id
                    JOIN anagrafiche.risorse_umane ru
                      ON ru.id = rau.risorsa_umana_id
                   WHERE ru.unita_organizzativa_id = pra.unita_organizzativa_id
                     AND ap.permission_codename = p_permission_codename;

                  IF FOUND THEN
                      RETURN v_abilitata;
                  END IF;

                  -- 5. Default sicuro
                  RETURN false;
              END
              $function$;

              COMMENT ON FUNCTION script.fn_check_azione_processo(integer, character varying) IS
                  'Verifica se azione e'' abilitata per l''utente. Refactor §4.6.B.4: '
                  'ramo ADMIN -> fn_is_super_admin; ramo DISABILITATO -> check '
                  'identita OPERATORE attiva. Catena override+reparto invariata.';
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS script.fn_check_azione_processo(integer, character varying);
