# Il MOTIVO 1 di fn_check_preventivo_annullabile non e' mai scattato.
#   Rilievo del team DB del 2026-08-10, chiudendo il giro «vie d'uscita
#   per l'operatore». Attivita' §1 di
#   attivita-urgenti-del-10-08.md.
#
# 🔴 IL FATTO, MISURATO. Il motivo deve rifiutare l'annullamento di un
#   preventivo da cui e' gia' nato un ordine, e solleva
#   E_PREV_ORDINE_GIA_GENERATO. Cercava l'ordine cosi':
#
#     WHERE o.sorgente_uid = v_uid
#       AND o.sorgente_tipo_id = (SELECT id FROM config.sorgenti
#                                  WHERE codice_interno = 'PREVENTIVO')
#
#   Su **90 ordini, ZERO** hanno `sorgente_uid` valorizzato. Il legame
#   al documento a monte vive su `documento_origine_tipo` +
#   `documento_origine_id`, e li' e' valorizzato su 66 ordini su 90. Il
#   conteggio del motivo valeva quindi sempre zero: non «raramente»,
#   **mai**, su tutta la popolazione. Un codice errore a catalogo che
#   nessun percorso vivo poteva produrre.
#
# ℹ️ LA DIAGNOSI E' PIU' INTERESSANTE DI «COLONNA SBAGLIATA», e vale
#   scriverla perche' e' la ragione per cui l'errore era invisibile.
#   Il motivo e' stato scritto **per simmetria col gemello**
#   script.fn_check_ordine_annullabile, che ha la forma IDENTICA
#   (`d.sorgente_uid = v_uid AND d.sorgente_tipo_id = …`) e **funziona**:
#   9 ordini con DDT figlio, 9 con motivi ostativi. La simmetria si
#   rompe perche' `vendite.ddt.sorgente_uid` E' il legame al padre ed e'
#   popolata (15/29), mentre `vendite.ordini.sorgente_uid` non lo e' —
#   il suo commento dice «Origine **import** (uid)», e
#   `sorgente_tipo_id` «tipo sorgente **import**». La funzione leggeva
#   la provenienza di un import per rispondere a una domanda
#   commerciale.
#
#   E' esattamente la trappola §4a della guida
#   docs/it/guide/sorgente-polimorfa.md: «esistono colonne chiamate
#   sorgente_tipo_id / sorgente_uid FUORI da questo meccanismo, che
#   quindi non sono normalizzate». `vendite.ordini` non ha il guard
#   polimorfo (ce l'hanno solo pratiche_sorgenti e commesse_sorgenti,
#   verificato con la Query 1 della guida), quindi non e' consumatrice
#   del meccanismo e il pattern non le si applica.
#
# ⚠️ IL BACKFILL DI `sorgente_uid` **NON** ERA L'ALTERNATIVA, e va detto
#   perche' e' la prima idea che viene. Riempirla col preventivo
#   creerebbe una SECONDA convenzione per lo stesso legame, cioe' il
#   difetto contro cui e' nata la R2 del brief. La polimorfa non ha
#   nulla di rotto: il §6 della guida nomina come colonne dirette
#   «ddt.sorgente_uid / resi.sorgente_uid uuid, **ordini.documento_origine_id**,
#   contratti.offerta_id», e vw_documento_lineage_archi lega
#   preventivo -> ordine proprio con `p.id = o.documento_origine_id`.
#   Tre fonti indipendenti, stessa risposta.
#
# ℹ️ LA DECISIONE DI DOMINIO (Tid, 2026-08-10). La misura ha reso la
#   domanda concreta: **tutti e 20 gli ordini figli sono in DRAFT**,
#   cioe' bozze. Deciso che **qualunque ordine figlio NON ANNULLATO
#   blocca**, bozza compresa: la via d'uscita esiste e il messaggio la
#   nomina (si abbandona/annulla prima la bozza dell'ordine, poi il
#   preventivo). Effetto: 13 preventivi ACCETTATO passano da
#   annullabili a bloccati col motivo.
#
#   L'esclusione del figlio annullato e' l'unico punto in cui questa
#   regola NON copia il gemello, ed e' voluta: senza, un ordine figlio
#   annullato bloccherebbe il padre per sempre e senza uscita — cioe'
#   il difetto che il cantiere «vie d'uscita» e' nato per chiudere.
#   Il predicato usa `is_abortito` e non `codice_interno = 'ANNULLATO'`:
#   e' l'asse uniforme cross-catalogo («true = stato di annullamento»),
#   gia' usato da fn_list_ddt_da_pushare e fn_documento_lineage.
#
# ⚠️ RESTA APERTO, DICHIARATO: il gemello sui DDT ha la stessa lacuna
#   speculare — un DDT figlio ANNULLATO blocca ancora l'annullamento
#   dell'ordine. Oggi non morde (nessuno dei 9 DDT bloccanti e'
#   annullato, misurato) e non e' stato infilato qui: e' un'altra
#   decisione, sulla stessa forma.
#
# Nessun'altra modifica: cambiano il predicato del MOTIVO 1 e il
# COMMENT, che descriveva il legame sbagliato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260810-03-update-fn-check-preventivo-annullabile-motivo1-documento-origine-mctit.yaml

  - changeSet:
      id: 20260810-03-update-fn-check-preventivo-annullabile-motivo1-documento-origine
      author: mctit

      runOnChange: false
      validCheckSums:
        - ANY
      failOnError: true
      comment: >
        fn_check_preventivo_annullabile: il MOTIVO 1 cerca l'ordine
        generato su documento_origine_tipo/id (il legame vero) invece di
        ordini.sorgente_uid, che e' l'origine import e non e' mai
        valorizzata: il motivo non poteva scattare. Esclusi gli ordini
        figli annullati (is_abortito).
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: ordini
                columnName: documento_origine_tipo
            - columnExists:
                schemaName: vendite
                tableName: ordini
                columnName: documento_origine_id
            - columnExists:
                schemaName: config
                tableName: stati_doc_ordini
                columnName: is_abortito
            - sqlCheck:
                expectedResult: 1
                sql: >
                  SELECT count(*) FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = 'script'
                    AND p.proname = 'fn_check_preventivo_annullabile'
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_preventivo_annullabile(p_preventivo_id vendite.preventivi.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono l'ANNULLAMENTO di un
              --   preventivo. Funzione PURA (fn_check_*): nessun raise di
              --   dominio, nessuna scrittura. Consumatori: il guard di
              --   transizione, la porta vendite.fn_cambia_stato_preventivo e
              --   script.fn_available_actions_preventivo.
              --   Brief: brief-db-vie-uscita-operatore §3.1 e §7.3.
              -- Ritorna: [] se annullabile; altrimenti array ordinato di
              --   {codice, reason, reason_key, dettaglio}. L'ordine e' quello
              --   di gravita': chi consuma solleva il PRIMO.
              -- rev 2026-08-04 (§7.3): assorbito il criterio che viveva dentro
              --   la porta (righe gia' EMESSA in commessa) -> MOTIVO 2. Da qui
              --   la porta non ha piu' una regola propria: chiama questa.
              -- rev 2026-08-10: il MOTIVO 1 non era mai scattato. Cercava
              --   l'ordine figlio su ordini.sorgente_uid, che e' l'origine
              --   IMPORT (0 righe valorizzate su 90) e non il legame al
              --   documento a monte; quello vive su documento_origine_tipo/id
              --   (66 su 90). Scritto per simmetria col gemello sui DDT, dove
              --   la colonna omonima E' il legame ed E' popolata: la trappola
              --   §4a di docs/it/guide/sorgente-polimorfa.md, colonne che
              --   sembrano polimorfe e non lo sono (vendite.ordini non ha il
              --   guard, quindi non e' consumatrice del meccanismo).
              --   + esclusi gli ordini figli ANNULLATI via is_abortito:
              --   altrimenti un figlio morto bloccherebbe il padre per
              --   sempre. Decisione di Tid 2026-08-10: qualunque altro stato
              --   blocca, bozza compresa (la via d'uscita e' abbandonare
              --   prima la bozza dell'ordine).
              DECLARE
                v_motivi  jsonb := '[]'::jsonb;
                v_uid     vendite.preventivi.uid%TYPE;
                v_ordini  integer := 0;
                v_emesse  integer := 0;
                v_commesse integer := 0;
              BEGIN
                IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                  PERFORM script.fn_log_and_raise_error(
                    'script','fn_check_preventivo_annullabile','E_PARAMETRO_INVALIDO',
                    jsonb_build_object('parametro','preventivo_id','valore',p_preventivo_id),
                    NULL::uuid, 'preventivo_id obbligatorio (>0)');
                END IF;

                SELECT p.uid INTO v_uid
                  FROM vendite.preventivi p
                 WHERE p.id = p_preventivo_id;

                IF v_uid IS NULL THEN
                  RETURN v_motivi;   -- preventivo inesistente: decide il chiamante
                END IF;

                -- MOTIVO 1 — un ordine e' gia' nato da questo preventivo.
                -- ⚠️ Il legame preventivo -> ordine e' la coppia
                -- (documento_origine_tipo, documento_origine_id), non
                -- ordini.sorgente_uid: quella e' l'ORIGINE IMPORT
                -- (commento della colonna) e nessuno la valorizza per
                -- questa catena. Fonti: guida sorgente-polimorfa §6, che
                -- elenca ordini.documento_origine_id fra le colonne
                -- dirette, e vw_documento_lineage_archi, che lega
                -- preventivo e ordine con lo stesso predicato.
                -- ⚠️ NON copiare qui la forma del gemello sui DDT
                -- (ddt.sorgente_uid): la' la colonna omonima E' il legame
                -- al padre ed E' popolata. E' la stessa parola per due
                -- cose diverse, e la simmetria apparente e' cio' che ha
                -- tenuto questo motivo spento senza che nessuno lo vedesse.
                -- Gli ordini figli ANNULLATI non contano: un documento
                -- morto non deve bloccare il padre per sempre.
                SELECT count(*)
                  INTO v_ordini
                  FROM vendite.ordini o
                  JOIN config.stati_doc_ordini so ON so.id = o.stato_doc_ordine_id
                 WHERE o.documento_origine_tipo = 'PREVENTIVO'
                   AND o.documento_origine_id   = p_preventivo_id
                   AND so.is_abortito IS NOT TRUE;

                IF v_ordini > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_ORDINE_GIA_GENERATO',
                    'reason',     'ORDINE_GIA_GENERATO',
                    'reason_key', 'vendite.preventivi.azione_reason.ordine_gia_generato',
                    'dettaglio',  v_ordini);
                END IF;

                -- MOTIVO 2 — righe gia' EMESSE in commessa: a valle esiste un
                -- documento fiscale. E' il criterio che stava dentro la porta
                -- (§7.3) e legge l'EFFETTO (le attivita' di commessa, scritte
                -- dalle funzioni di dominio), non la registrazione della
                -- sorgente letta dal MOTIVO 3, che la scrive il backend con una
                -- chiamata separata. Sono due fatti diversi: oggi coincidono,
                -- per costruzione non devono.
                -- starts_with() (PG 18, index-friendly) come nella porta.
                SELECT count(*)
                  INTO v_emesse
                  FROM vendite.commesse_attivita ca
                 WHERE starts_with(ca.segment_key, 'PREV:' || v_uid::text || ':R:')
                   AND ca.stato_emissione = 'EMESSA';

                IF v_emesse > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_ANNULLA_COMMESSA_EMESSA',
                    'reason',     'COMMESSA_GIA_EMESSA',
                    'reason_key', 'vendite.preventivi.azione_reason.commessa_gia_emessa',
                    'dettaglio',  v_emesse);
                END IF;

                -- MOTIVO 3 — il preventivo e' gia' entrato in una commessa,
                -- anche se nulla e' ancora uscito. Tabella polimorfa: la chiave
                -- e' testo, e per PREVENTIVO config.sorgenti.key_selector dice
                -- 'uid'.
                SELECT count(*)
                  INTO v_commesse
                  FROM vendite.commesse_sorgenti cs
                 WHERE cs.sorgente_uid = v_uid::text
                   AND cs.sorgente_tipo_id = (SELECT s.id FROM config.sorgenti s
                                               WHERE s.codice_interno = 'PREVENTIVO');

                IF v_commesse > 0 THEN
                  v_motivi := v_motivi || jsonb_build_object(
                    'codice',     'E_PREV_GIA_IN_COMMESSA',
                    'reason',     'GIA_IN_COMMESSA',
                    'reason_key', 'vendite.preventivi.azione_reason.gia_in_commessa',
                    'dettaglio',  v_commesse);
                END IF;

                RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_preventivo_annullabile(p_preventivo_id bigint)
              IS 'Pure check: motivi che impediscono l''annullamento di un preventivo. [] = lecito. Sede UNICA della regola, condivisa da vendite.trgfn_preventivi_guard_annullamento, dalla porta vendite.fn_cambia_stato_preventivo e da script.fn_available_actions_preventivo. Motivi in ordine di gravita'' (chi consuma solleva il primo): 1) un ordine generato e non annullato (vendite.ordini.documento_origine_tipo = ''PREVENTIVO'' AND documento_origine_id = preventivo, con config.stati_doc_ordini.is_abortito NOT TRUE); 2) righe gia'' EMESSA in commessa (vendite.commesse_attivita, segment_key PREV:<uid>:R:) — a valle esiste una fattura; 3) una riga in vendite.commesse_sorgenti (chiave uid::text, per key_selector di config.sorgenti). Il 2 e il 3 NON sono ridondanti: il primo legge l''effetto scritto dalle funzioni di dominio, il secondo la registrazione scritta dal backend. rev 2026-08-04: assorbito il criterio della porta, che non ha piu'' regola propria (brief-db-vie-uscita-operatore §7.3). rev 2026-08-10: il MOTIVO 1 non era MAI scattato. Cercava l''ordine su vendite.ordini.sorgente_uid, che e'' l''origine IMPORT (commento della colonna) e non il legame al documento a monte: zero righe valorizzate su 90, mentre documento_origine_tipo/id lo e'' su 66. Era scritto per simmetria col gemello script.fn_check_ordine_annullabile, dove ddt.sorgente_uid E'' il legame al padre ed E'' popolata — la trappola §4a di docs/it/guide/sorgente-polimorfa.md: colonne omonime FUORI dal meccanismo polimorfo (vendite.ordini non ha il guard, quindi non ne e'' consumatrice). NESSUN backfill di sorgente_uid: sarebbe una seconda convenzione per lo stesso legame. + gli ordini figli annullati sono esclusi (is_abortito), unico punto in cui questa regola non copia il gemello: senza, un figlio morto bloccherebbe il padre per sempre e senza uscita. Decisione di dominio (Tid, 2026-08-10): qualunque altro stato del figlio blocca, bozza compresa — la via d''uscita e'' abbandonare prima la bozza dell''ordine. Effetto misurato: 13 preventivi ACCETTATO passano da annullabili a bloccati col motivo.';
