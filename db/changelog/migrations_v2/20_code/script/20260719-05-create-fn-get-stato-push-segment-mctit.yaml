# brief-db-push-commessa-gia-inviato §4b (Rev 1) — il CLASSIFICATORE condiviso.
#
# IL PROBLEMA (rilievo ORD0000227): il predicato "gia' inviato" viveva in DUE
# forme divergenti — nelle fn_list_*_da_pushare (uguaglianza su segment_key +
# stato_emissione='EMESSA') e nella query inline del ramo reason della
# capability ordine. Entrambe con due difetti: ancorate alla FATTURAZIONE
# (una riga pushata ma non ancora fatturata risultava ri-pushabile) e cieche
# sui componenti BoM (suffisso '#CMP:<componente>' mai matchato).
#
# LA SOLUZIONE: un classificatore unico dello stato-push di una segment_key:
#   'LIBERA'   -> nessuna attivita' (riga mai instradata)
#   'ALLOCATA' -> attivita' presenti, non tutte fatturate (in attesa billing;
#                 include ANNULLATA: decisione preventivi 2026-06-28 —
#                 instradata = esclusa, il ri-push e' un flusso da progettare)
#   'EMESSA'   -> attivita' presenti e TUTTE fatturate
# Consumatori: le push-list (eleggibile <=> 'LIBERA') e i rami reason delle
# capability ('ALLOCATA' -> GIA_INVIATO, 'EMESSA' -> GIA_FATTURATO).
#
# 🔑 IL PARAMETRO E' LA SEGMENT_KEY EMESSA DALLA LISTA (non prefisso+uid+riga):
#   il BE appende '#CMP:<componente_id>' esattamente a quella
#   (commesse_source_handlers.py:251), quindi il match uguaglianza-o-prefisso
#   funziona per TUTTI i tipi documento senza casi speciali — compresi i
#   contratti, la cui chiave include gia' ':M:<YYYY-MM>' (push ricorrente
#   mensile per design: il mese successivo ha chiave diversa e resta libero).
#
# Nota performance (dal brief): il ramo LIKE '...#CMP:%' non usa il btree
# standard su segment_key (collazione non-C). Costo gia' accettato dal
# precedente preventivi (vw_preventivi_righe_smistabili_commessa usa la stessa
# forma); se il batch rallentera', la cura e' un indice varchar_pattern_ops.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260719-05-create-fn-get-stato-push-segment-mctit.yaml

  - changeSet:
      id: 20260719-05-create-fn-get-stato-push-segment
      author: mctit
      runOnChange: false
      validCheckSum:
        - ANY
      failOnError: true
      comment: >
        Classificatore condiviso dello stato-push di una segment_key
        (LIBERA/ALLOCATA/EMESSA), match uguaglianza o componenti '#CMP:%'.
        Single source per push-list e rami reason delle capability
        (brief-db-push-commessa-gia-inviato §4b).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_stato_push_segment(p_segment_key character varying)
               RETURNS text
               LANGUAGE sql
               STABLE
              AS $function$
              -- Scopo: classificare lo stato-push della segment_key di una riga
              --   documento rispetto a vendite.commesse_attivita, vedendo anche
              --   le attivita' dei componenti BoM (suffisso '#CMP:<id>'):
              --     LIBERA   = nessuna attivita' (riga mai instradata)
              --     ALLOCATA = attivita' presenti, non tutte EMESSE (in attesa
              --                di fatturazione; ANNULLATA conta come allocata)
              --     EMESSA   = attivita' presenti e tutte fatturate
              --   Single source del predicato "gia' inviato": consumata dalle
              --   fn_list_*_da_pushare (eleggibile <=> LIBERA) e dai rami
              --   reason delle capability (brief-db-push-commessa-gia-inviato).
              SELECT CASE
                       WHEN count(*) = 0 THEN 'LIBERA'
                       WHEN bool_and(ca.stato_emissione = 'EMESSA') THEN 'EMESSA'
                       ELSE 'ALLOCATA'
                     END
                FROM vendite.commesse_attivita ca
               WHERE ca.segment_key = p_segment_key
                  OR ca.segment_key LIKE p_segment_key || '#CMP:%';
              $function$;

              COMMENT ON FUNCTION script.fn_get_stato_push_segment(p_segment_key character varying)
              IS 'Classificatore condiviso dello stato-push di una segment_key riga-documento su vendite.commesse_attivita, inclusi i componenti BoM (match uguaglianza O prefisso #CMP:%): LIBERA = mai instradata; ALLOCATA = attivita'' presenti non tutte fatturate (ANNULLATA inclusa: instradata = esclusa, decisione preventivi 2026-06-28); EMESSA = tutte fatturate. Il parametro e'' la segment_key EMESSA dalla push-list (per i contratti include :M:<mese> — push ricorrente mensile by design). Consumatori: fn_list_{ordini,ddt,contratti}_da_pushare (eleggibile <=> LIBERA) e rami reason di fn_available_actions_{ordine,ddt} (ALLOCATA -> GIA_INVIATO, EMESSA -> GIA_FATTURATO). Brief: brief-db-push-commessa-gia-inviato §4b Rev 1, rilievo ORD0000227.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_stato_push_segment(character varying);
