# UN PREVENTIVO CON LA VALIDITA' GIA' FINITA NON SI EMETTE
#   script.fn_check_preventivo_emettibile: motivo 4
#   E_PREV_EMISSIONE_VALIDITA_SCADUTA.
#   Brief: brief-db-scadenza-preventivi §8.7 (E-4 di Tid, 2026-10-31).
#
#   Dopo E-2 un preventivo con la validita' finita non si accetta, e il job
#   lo porta a SCADUTO. Emetterlo cosi' manderebbe al cliente un'offerta
#   che non puo' piu' accettare. Il guard di transizione solleva il primo
#   motivo di questa check e la capability la legge per spegnere «Emetti»:
#   il motivo nuovo arriva a tutti e due senza toccarli. Ultimo: e' un
#   motivo della testata, dopo righe, prezzi e indirizzi.
#   ⚠️ Firma invariata, e la data letta per id: vedi il commento del motivo
#   (la porta del modello). La check dell'accettazione (20261031-62) la
#   riceve invece come parametro: e' nuova, e non costa niente a nessuno.
#
# Corpo: l'ultimo changeSet (20261011-55, = doc auto-gen), con il motivo 4.
# ------------------------------------------------------------
databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261031-67-update-fn-check-preventivo-emettibile-validita-mctit.yaml

  - changeSet:
      id: 20261031-67-update-fn-check-preventivo-emettibile-validita
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_check_preventivo_emettibile: motivo 4 E_PREV_EMISSIONE_VALIDITA_SCADUTA — un
        preventivo con la validita' gia' finita non si emette. Brief: brief-db-scadenza-preventivi
        §8.7 (E-4 di Tid, 2026-10-31).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_check_preventivo_emettibile';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_preventivo_emettibile(p_preventivo_id vendite.preventivi.id%TYPE)
               RETURNS jsonb
               LANGUAGE plpgsql
               STABLE
               SECURITY INVOKER
              AS $function$
              -- Scopo: elencare i motivi che impediscono l'EMISSIONE di un
              --   preventivo. Funzione PURA (fn_check_*): non solleva, non
              --   scrive. Consumatori: vendite.trgfn_preventivi_guard_transizione
              --   (che solleva il codice del primo motivo) e
              --   script.fn_available_actions_preventivo (che spegne il bottone).
              --   Gemella di fn_check_preventivo_annullabile.
              --   Brief: brief-db-be-iva-risolutore-e-regime-cliente, I9 / §R-3.
              --   rev 2026-09-24: + MOTIVO 2, i prezzi non autorizzati, dal building
              --   block script.fn_check_prezzi_autorizzati
              --   (brief-db-preventivi-congelamento-pricing, D-1/D-2).
              --   rev 2026-10-31: + MOTIVO 4, la validita' gia' finita
              --   (brief-db-scadenza-preventivi, E-4).
              -- Ritorna: [] se emettibile; altrimenti array ORDINATO di
              --   {codice, reason, reason_key, dettaglio}.
              DECLARE
                  v_motivi   jsonb := '[]'::jsonb;
                  v_uid      vendite.preventivi.uid%TYPE;
                  v_numero   vendite.preventivi.numero%TYPE;
                  -- L'ultimo giorno valido (motivo 4, rev 2026-10-31).
                  v_validita_al vendite.preventivi.validita_al%TYPE;
                  v_riga_id  vendite.preventivi_righe.id%TYPE;
                  v_riga_des vendite.preventivi_righe.descrizione%TYPE;
              BEGIN
                  IF p_preventivo_id IS NULL OR p_preventivo_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_preventivo_emettibile', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'preventivo_id', 'valore', p_preventivo_id),
                          NULL::uuid, 'preventivo_id obbligatorio (>0)');
                  END IF;

                  -- ⭐ `p.numero` sulla SELECT che c'era gia': serve a COMPORRE la frase
                  --   («Preventivo %s: la riga «%s» ...»), non a decidere.
                  SELECT p.uid, p.numero, p.validita_al INTO v_uid, v_numero, v_validita_al
                    FROM vendite.preventivi p
                   WHERE p.id = p_preventivo_id;

                  IF v_uid IS NULL THEN
                      RETURN v_motivi;   -- preventivo inesistente: decide il chiamante
                  END IF;

                  -- MOTIVO 1 — VALORE DELLA RIGA: una riga che entra nel
                  --   riepilogo IVA deve portare un'aliquota.
                  --
                  -- ⭐ IL PREDICATO E' QUELLO DEL CONSUMATORE, copiato da
                  --   vendite.fn_ricalcola_riepilogo_iva_preventivo:
                  --   attivo IS TRUE AND quantita > 0. Quella funzione calcola
                  --   l'imposta con COALESCE(fn_get_aliquota_iva(iva_id,...), 0),
                  --   quindi una riga senza aliquota finisce in
                  --   vendite.preventivi_riepiloghi_iva con imponibile pieno e
                  --   imposta zero.
                  --
                  -- ⚠️ `quantita > 0` NON e' ridondante come lo sarebbe sugli
                  --   ordini: preventivi_righe.quantita e' NULLABILE e non ha
                  --   CHECK di positivita' (ordini_righe ha
                  --   chk_ordini_v_r_qta_pos). Senza, si bloccherebbe un
                  --   preventivo per una riga che nel riepilogo non entra mai.
                  --
                  -- ⚠️ `attivo IS TRUE` e non `attivo`: la colonna e' NULLABILE
                  --   qui (su ordini_righe e' NOT NULL), e il NULL va escluso
                  --   esattamente come lo esclude il consumatore.
                  --
                  -- ⚠️ `prezzo_unitario IS NOT NULL` e' oggi sempre vero (colonna
                  --   NOT NULL): si scrive perche' e' la forma vera della regola
                  --   — dove c'e' un prezzo serve l'aliquota — ed e' gia'
                  --   successo che una colonna prezzo diventasse facoltativa
                  --   (20260819-13 su vendite.ddt_righe_componenti).
                  --
                  -- ⛔ Nel dettaglio va la DESCRIZIONE e non un numero di riga:
                  --   preventivi_righe NON HA riga_nr, e `ordine` e' una chiave
                  --   di ordinamento con default 0 — un messaggio che dicesse
                  --   «la riga 0» non aiuterebbe nessuno. L'id resta per chi
                  --   diagnostica.
                  --
                  -- ⚠️ ORDER BY prima del LIMIT: senza, quale riga esca dipende
                  --   dal piano del planner e il messaggio nominerebbe una riga
                  --   diversa a ogni corsa.
                  SELECT pr.id, pr.descrizione
                    INTO v_riga_id, v_riga_des
                    FROM vendite.preventivi_righe pr
                   WHERE pr.preventivo_id = p_preventivo_id
                     AND pr.attivo IS TRUE
                     AND pr.quantita > 0
                     AND pr.prezzo_unitario IS NOT NULL
                     AND pr.iva_id IS NULL
                   ORDER BY pr.ordine NULLS LAST, pr.id
                   LIMIT 1;

                  IF v_riga_id IS NOT NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_PREV_RIGA_IVA_MANCANTE',
                          'reason',     'RIGA_SENZA_ALIQUOTA',
                          'reason_key', 'vendite.preventivi.azione_reason.iva_mancante',
                          'dettaglio',  jsonb_build_object(
                                            'riga_id',     v_riga_id,
                                            'descrizione', v_riga_des),
                          -- ⚠️ preventivi_righe non ha riga_nr e `ordine` ha default 0: nella
                          --   frase va la DESCRIZIONE, ed e' la stessa scelta gia' dichiarata
                          --   nel commento di trgfn_preventivi_guard_transizione.
                          'valori',     jsonb_build_array(COALESCE(v_numero, p_preventivo_id::text),
                                                          COALESCE(v_riga_des, 'senza descrizione')));
                  END IF;

                  -- MOTIVO 2 (rev 2026-09-24) — PREZZI NON AUTORIZZATI: un preventivo
                  --   con un prezzo in attesa di approvazione o rifiutato dal
                  --   responsabile non si emette (D-1, D-2).
                  -- ⭐ Il predicato NON sta qui: sta nel building block comune ai cinque
                  --   documenti di vendita. Questa funzione decide solo che l'EMISSIONE
                  --   lo chiede. Dopo l'aliquota: quel motivo si corregge sulla riga,
                  --   questo spesso si aspetta.
                  v_motivi := v_motivi
                           || script.fn_check_prezzi_autorizzati('vendite.preventivi'::regclass,
                                                                 p_preventivo_id);

                  -- MOTIVO 3 (rev 2026-10-11, brief-db-indirizzi-documento-seguono-il-
                  --   cliente, D-3 di Tid) — INDIRIZZI DEL CLIENTE: il cliente del
                  --   preventivo (la coppia BA/istanza) si cambia in bozza, e un
                  --   indirizzo d'anagrafica del cliente di prima, o di una fornitura
                  --   che il preventivo non ha piu', non va al cliente.
                  -- ⭐ Il predicato sta in script.fn_check_indirizzi_documento_cliente,
                  --   lo stesso del guard di scrittura. Dopo i prezzi: quei motivi
                  --   riguardano le righe, questo la testata.
                  v_motivi := v_motivi
                           || script.fn_check_indirizzi_documento_cliente('PREVENTIVO', p_preventivo_id);

                  -- MOTIVO 4 (rev 2026-10-31, brief-db-scadenza-preventivi, E-4 di Tid) —
                  --   LA VALIDITA' E' GIA' FINITA: un preventivo che arriva al cliente gia'
                  --   scaduto non si potrebbe accettare (E-2), e il job delle scadenze lo
                  --   chiuderebbe la notte dopo. Si emette solo con una validita' viva.
                  -- ⭐ Lo stesso confronto dell'accettazione e del job: validita_al e'
                  --   l'ultimo giorno valido (< script.fn_data_operativa()); NULL non scade.
                  -- ⭐ DATO_ERRATO, con il campo: in bozza «Valido al» si corregge sullo
                  --   stesso documento, e il frontend accende quel campo.
                  -- ⚠️ La data si legge per id, come gli altri motivi della testata, anche
                  --   se il guard e' BEFORE ROW: sotto la porta del modello il passaggio a
                  --   EMESSO lo scrive solo script.fn_doc_scrivi_stato, con un UPDATE della
                  --   SOLA colonna di stato. In quella istruzione validita_al non cambia, e
                  --   la riga in tabella ha gia' la data che conta.
                  IF v_validita_al IS NOT NULL
                     AND v_validita_al < (SELECT script.fn_data_operativa()) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_PREV_EMISSIONE_VALIDITA_SCADUTA',
                          'reason',     'VALIDITA_SCADUTA',
                          'reason_key', 'vendite.preventivi.azione_reason.validita_scaduta',
                          'dettaglio',  jsonb_build_object('campo', 'validita_al',
                                                           'validita_al', v_validita_al),
                          'valori',     jsonb_build_array(COALESCE(v_numero, p_preventivo_id::text),
                                                          to_char(v_validita_al, 'DD/MM/YYYY')));
                  END IF;

                  RETURN v_motivi;
              END;
              $function$
              ;

              COMMENT ON FUNCTION script.fn_check_preventivo_emettibile(vendite.preventivi.id%TYPE)
              IS 'Single source dei motivi che impediscono l''EMISSIONE di un preventivo. Ritorna [] se emettibile, altrimenti array ORDINATO di {codice, reason, reason_key, dettaglio}. PURA: non solleva e non scrive. Consumatori: vendite.trgfn_preventivi_guard_transizione (solleva il codice del primo motivo) e script.fn_available_actions_preventivo (spegne il bottone ed espone la reason). ⭐ Oggi UN motivo: E_PREV_RIGA_IVA_MANCANTE, una riga attiva con quantita e prezzo ma senza aliquota. Chiude un difetto silenzioso gemello di quelli sanati sul DDT (2026-08-28) e sull''ordine (2026-08-29): fn_ricalcola_riepilogo_iva_preventivo aggrega le righe attive con quantita > 0 e calcola l''imposta con COALESCE(fn_get_aliquota_iva(iva_id, stato), 0), quindi una riga senza aliquota finisce in vendite.preventivi_riepiloghi_iva con imponibile pieno e imposta zero. ⭐ IL PREDICATO E'' COPIATO DAL CONSUMATORE (attivo IS TRUE AND quantita > 0): il vincolo deve avere lo stesso perimetro di cio'' che protegge. ⚠️ E NON e'' una copia della gemella sugli ordini, perche'' i due documenti divergono su tre punti strutturali: preventivi_righe non ha riga_nr (nel messaggio va la DESCRIZIONE, non «la riga 0» che darebbe la colonna `ordine`), quantita e'' nullable e senza CHECK di positivita'' (sugli ordini c''e'' chk_ordini_v_r_qta_pos, quindi li'' il filtro sarebbe ridondante), attivo e'' nullable (su ordini_righe e'' NOT NULL). ⛔ NON contiene il motivo «documento senza righe»: quello vive nella porta vendite.fn_cambia_stato_preventivo ed e'' un''asimmetria gia'' dichiarata, non una regola dell''emissione. Piano: brief-db-be-iva-risolutore-e-regime-cliente, I9. ⭐ rev 2026-09-24: + MOTIVO 2, i prezzi non autorizzati (E_DOC_PREZZO_PENDENTE, E_DOC_PREZZO_RIFIUTATO) su righe e componenti BoM attivi, dal building block script.fn_check_prezzi_autorizzati: il predicato sta li'''', qui si decide solo che l''''emissione lo chiede. Sommati dopo il motivo dell''''aliquota. Brief: brief-db-preventivi-congelamento-pricing (D-1, D-2). rev 2026-10-11: + MOTIVO 3, E_INDIRIZZO_DOC_NON_DEL_CLIENTE (reason INDIRIZZO_NON_DEL_CLIENTE, reason_key common.azione_reason.indirizzo_non_del_cliente) da script.fn_check_indirizzi_documento_cliente(''PREVENTIVO'', id): un indirizzo d''anagrafica del cliente di prima, o di un''altra fornitura, ferma l''emissione. Dopo i prezzi. Brief: brief-db-indirizzi-documento-seguono-il-cliente (D-3). ⭐ rev 2026-10-31 (20261031-67, brief-db-scadenza-preventivi §8.7, E-4 di Tid): + MOTIVO 4, E_PREV_EMISSIONE_VALIDITA_SCADUTA (reason VALIDITA_SCADUTA, reason_key vendite.preventivi.azione_reason.validita_scaduta, dettaglio {campo validita_al, validita_al}, valori numero e data): la validita'' e'' gia'' finita (validita_al < script.fn_data_operativa(), lo stesso confronto dell''accettazione e del job delle scadenze; NULL non scade). DATO_ERRATO: in bozza la data si corregge. La data si legge per id anche dal guard BEFORE ROW: sotto la porta il passaggio a EMESSO e'' un UPDATE della sola colonna di stato (script.fn_doc_scrivi_stato).';
