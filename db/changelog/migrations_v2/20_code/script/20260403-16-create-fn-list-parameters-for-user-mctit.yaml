# Liquibase changelog per Zero ERP
# CREATE script.fn_list_parameters_for_user — lista parametri con override risolti
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260403-16-create-fn-list-parameters-for-user-mctit.yaml

  - changeSet:
      id: 20260403-16-create-fn-list-parameters-for-user
      author: mctit
      comment: >
        Restituisce tutti i parametri con i valori override per ciascun livello
        di scope (emittente, gruppo, utente) e il valore risolto finale.
        Usata dal backend per la UI gestione parametri utente.
      preConditions:
        - onFail: HALT
        - tableExists: { schemaName: config, tableName: parameters }
        - tableExists: { schemaName: config, tableName: parameter_overrides }
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_list_parameters_for_user(
                  p_django_user_id        integer,
                  p_group_ids             integer[]  DEFAULT NULL,
                  p_emittente_fiscale_id  bigint     DEFAULT NULL
              )
              RETURNS TABLE (
                  code              character varying,
                  description       text,
                  default_value     text,
                  emittente_value   text,
                  group_value       text,
                  user_value        text,
                  user_override_id  bigint,
                  resolved_value    text
              )
              LANGUAGE plpgsql
              STABLE
              AS $function$
              BEGIN
                  -- Restituisce per ogni parametro il valore a ciascun livello di scope
                  -- e il valore risolto con priorita': user > group > emittente > default
                  RETURN QUERY
                  SELECT
                      p.code,
                      p.description,
                      p.default_value,
                      po_em.overridden_value   AS emittente_value,
                      po_gr.overridden_value   AS group_value,
                      po_us.overridden_value   AS user_value,
                      po_us.id                 AS user_override_id,
                      COALESCE(
                          po_us.overridden_value,
                          po_gr.overridden_value,
                          po_em.overridden_value,
                          p.default_value
                      )                        AS resolved_value
                  FROM config.parameters p

                  -- Override a livello emittente (no user, no group)
                  LEFT JOIN config.parameter_overrides po_em
                    ON  po_em.parameter_id          = p.id
                    AND po_em.emittente_fiscale_id   = p_emittente_fiscale_id
                    AND po_em.django_user_id         IS NULL
                    AND po_em.django_group_id        IS NULL
                    AND po_em.attivo                 = true

                  -- Override a livello gruppo (no user)
                  -- Se l'utente appartiene a piu' gruppi, prende il primo override trovato
                  LEFT JOIN LATERAL (
                      SELECT o.overridden_value
                      FROM config.parameter_overrides o
                      WHERE o.parameter_id    = p.id
                        AND o.django_group_id = ANY(p_group_ids)
                        AND o.django_user_id  IS NULL
                        AND o.attivo          = true
                      ORDER BY o.id
                      LIMIT 1
                  ) po_gr ON p_group_ids IS NOT NULL

                  -- Override a livello utente
                  LEFT JOIN config.parameter_overrides po_us
                    ON  po_us.parameter_id    = p.id
                    AND po_us.django_user_id  = p_django_user_id
                    AND po_us.attivo          = true

                  ORDER BY p.code;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_list_parameters_for_user(integer, integer[], bigint)
                IS 'Lista tutti i parametri con override per emittente, gruppo e utente. Restituisce il valore risolto con priorita: user > group > emittente > default.';
