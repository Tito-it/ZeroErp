# BB: LA PRIMA RIGA DEL VERBO DI STATO — il permesso del passaggio
#   Brief: brief-modello-documento-vendita §7 (M-1, M-3, M-4, S-2).
#
# ── IL VERBO COMUNE, IN DUE META' ───────────────────────────────────
#   Ogni cambio di stato di un documento sul modello passa da un verbo. Il
#   verbo comune ha due meta', perche' i verbi del documento lavorano FRA le
#   due (la bolla scrive i prelievi dopo il permesso e prima dello stato, i
#   movimenti dopo; il reso i rientri, la proiezione dell'ordine, i carichi):
#   1. questa, la prima riga: il permesso del passaggio, prima di scrivere
#      qualunque cosa;
#   2. script.fn_doc_scrivi_stato (20261025-11): la scrittura dello stato
#      attraverso la porta.
#
# ── LA REGOLA ───────────────────────────────────────────────────────
#   Dalla riga del passaggio (script.fn_doc_passaggio, il lettore unico):
#   - nessuna riga: tace. Il passaggio non e' nella matrice, e lo rifiuta il
#     guard di transizione del documento all'UPDATE col suo codice: la matrice
#     ha un giudice solo;
#   - riga di processo (manuale = false): E_DOC_PASSAGGIO_DI_PROCESSO. Non si
#     chiede a mano: la scrive il verbo che ne e' la causa, con la sola
#     scrittura (meta' 2);
#   - riga con l'azione: script.fn_guard_azione (E_PERMESSO_NEGATO);
#   - riga senza azione: passa. Basta il permesso sul documento, che controlla
#     il backend (M-3). ⛔ Niente fn_guard_livello qui: l'operatore dei pgTAP e'
#     BLOCCATO su diverse aree, e la regola di Tid per i verbi del dominio e'
#     che il livello lo controlla l'endpoint (brief-db-dati-fiscali-e-societari
#     del soggetto, B-5).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261025-10-create-fn-guard-passaggio-mctit.yaml

  - changeSet:
      id: 20261025-10-create-fn-guard-passaggio
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        BB script.fn_guard_passaggio: la prima riga del verbo di stato. Dalla riga del passaggio
        (script.fn_doc_passaggio): di processo -> E_DOC_PASSAGGIO_DI_PROCESSO; con l'azione ->
        script.fn_guard_azione; senza azione o senza riga -> passa (giudica il backend o il guard
        di transizione). Brief: brief-modello-documento-vendita §7 (M-3, S-2).
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: "1"
            sql: >
              SELECT count(*) FROM pg_catalog.pg_proc p
                JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
               WHERE n.nspname = 'script' AND p.proname = 'fn_doc_passaggio';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE FUNCTION script.fn_guard_passaggio(
                  p_auth_user_id config.user_override_azioni.auth_user_id%TYPE,
                  p_testata      regclass,
                  p_stato_da_id  bigint,
                  p_stato_a_id   bigint)
               RETURNS void
               LANGUAGE plpgsql
               SECURITY INVOKER
              AS $function$
              -- Uso, nella prima riga del verbo, dopo aver preso la testata FOR UPDATE:
              --   PERFORM script.fn_guard_passaggio(v_utente, 'vendite.ddt',
              --                                     v_ddt.stato_doc_ddt_id, v_stato_a_id);
              DECLARE
                  v_manuale boolean;
                  v_azione  config.azioni_processo.permission_codename%TYPE;
              BEGIN
                  -- Gli stati: bigint di uno dei vocabolari della mappa.
                  SELECT p.manuale, p.azione_processo_codename
                    INTO v_manuale, v_azione
                    FROM script.fn_doc_passaggio(p_testata, p_stato_da_id, p_stato_a_id) p;

                  -- Nessuna riga: la matrice ha un giudice solo, il guard di
                  -- transizione del documento, all'UPDATE.
                  IF NOT FOUND THEN
                      RETURN;
                  END IF;

                  IF NOT v_manuale THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_guard_passaggio', 'E_DOC_PASSAGGIO_DI_PROCESSO',
                          jsonb_build_object('testata',     p_testata::text,
                                             'stato_da_id', p_stato_da_id,
                                             'stato_a_id',  p_stato_a_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;

                  IF v_azione IS NOT NULL THEN
                      PERFORM script.fn_guard_azione(p_auth_user_id, v_azione);
                  END IF;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_guard_passaggio(p_auth_user_id config.user_override_azioni.auth_user_id%TYPE, p_testata regclass, p_stato_da_id bigint, p_stato_a_id bigint)
                IS 'BB del modello del documento, prima meta'' del verbo di stato: il permesso del passaggio, nella prima riga del verbo, prima di scrivere qualunque cosa. Legge la riga da script.fn_doc_passaggio: riga di processo (manuale = false) -> E_DOC_PASSAGGIO_DI_PROCESSO (la scrive solo il verbo che ne e'' la causa); riga con l''azione -> script.fn_guard_azione (E_PERMESSO_NEGATO); riga senza azione -> passa (il permesso sul documento lo controlla il backend, M-3); nessuna riga -> passa, e il passaggio lo rifiuta il guard di transizione del documento all''UPDATE (la matrice ha un giudice solo). La seconda meta'' e'' script.fn_doc_scrivi_stato. Brief: brief-modello-documento-vendita §7 (M-1, M-3, M-4, S-2, Tid 2026-10-24/25).';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_guard_passaggio(integer, regclass, bigint, bigint);
