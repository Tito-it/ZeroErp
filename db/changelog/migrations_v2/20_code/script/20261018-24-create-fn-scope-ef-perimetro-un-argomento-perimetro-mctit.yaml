# LA FUNZIONE DI SCOPE RICEVE IL PERIMETRO IN UN ARGOMENTO SOLO
#   script.fn_scope_ef_perimetro(bigint[],bigint)
#   Brief: brief-db-plancache-funzioni-con-query-incorporate §5quinquies, D-3b-2c.
#
# ── IL DIFETTO ──────────────────────────────────────────────────────
#   La firma a tre argomenti (script.fn_scope_ef_perimetro(boolean,bigint[],bigint), -16) voleva il perimetro «tutti» a
#   parte, per farsi incorporare: le policy lo calcolavano in DUE sottoquery,
#   cioe' due volte per istruzione. Una lettura per chiave sotto policy
#   costava 0,125 ms (2 x 0,058), contro ~0,06 della canonica per riga di
#   prima; il verbo dell'accredito 60-64 -> 68-77 ms. Fatti datati
#   2026-10-18, dbdev come app.
#
# ── LA CURA ─────────────────────────────────────────────────────────
#   Il perimetro in UN argomento, con la convenzione di _pk_ids (NULL =
#   tutti): una sottoquery, un calcolo per istruzione. La funzione non si
#   incorpora (il perimetro le serve due volte) e costa ~1,5 µs a riga
#   (20.000 righe di prova: 26-32 ms, contro 1,8-2,9 incorporata). Pari a
#   ~40 righe per istruzione; prima di oggi la riga costava 0,02-0,08 ms.
#   Decisione di Tid, D-3b-2c. La firma a tre argomenti si ritira in -29.

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261018-24-create-fn-scope-ef-perimetro-un-argomento-perimetro-mctit.yaml

  - changeSet:
      id: 20261018-24-create-fn-scope-ef-perimetro-un-argomento-perimetro
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_scope_ef_perimetro(perimetro, emittente): il perimetro in un argomento solo (NULL = tutti), una sottoquery e un calcolo per istruzione. D-3b-2c di brief-db-plancache-funzioni-con-query-incorporate.
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT count(*) FROM pg_proc WHERE oid = to_regprocedure('script.fn_scope_ef_perimetro(bigint[],bigint)')
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_scope_ef_perimetro(
                  -- ⚠️ `bigint[]` esplicito: `colonna%TYPE[]` non esiste. Elementi =
                  --    anagrafiche.emittenti_fiscali.id; NULL = tutti, '{}' = nessuno
                  --    (la convenzione di script.fn_get_emittenti_scope_pk_ids).
                  p_perimetro            bigint[],
                  p_emittente_fiscale_id anagrafiche.emittenti_fiscali.id%TYPE)
               RETURNS boolean
               LANGUAGE sql
               IMMUTABLE
               -- ⚠️ COST di default, ed e' quello giusto: pura, ~1,5 µs a chiamata (elencata
               --    fra le economiche misurate di script/test-policy-funzioni-cost-v1).
              AS $function$
                  -- Scopo: l'emittente della riga sta nel perimetro dell'operatore?
                  --   La funzione di scope delle policy ef_whitelist (linee-guida-sql
                  --   §10.3). Il perimetro NON lo calcola lei: glielo passa la policy in
                  --   UNA sottoquery scalare non correlata su
                  --   script.fn_get_emittenti_scope_pk_ids, che PostgreSQL valuta una
                  --   volta per istruzione (InitPlan):
                  --     script.fn_scope_ef_perimetro(
                  --         (SELECT script.fn_get_emittenti_scope_pk_ids(<utente>)),
                  --         <emittente della riga>)
                  -- ⭐ Rev 2026-10-18 (D-3b-2c): era a tre argomenti (perimetro «tutti»
                  --    a parte, due sottoquery) per farsi incorporare dal pianificatore.
                  --    Ma due sottoquery calcolano il perimetro DUE volte per istruzione,
                  --    e le letture di una riga sola (la maggior parte, nei verbi e nei
                  --    trigger) pagavano il doppio. Qui il perimetro serve due volte,
                  --    quindi la funzione non si incorpora: resta una chiamata per riga
                  --    da ~1,5 µs, contro 0,02-0,08 ms della canonica per riga di prima.
                  -- Emittente NULL -> false (COALESCE), salvo perimetro «tutti».
                  SELECT p_perimetro IS NULL
                      OR coalesce(p_emittente_fiscale_id = ANY (p_perimetro), false)
              $function$;

              COMMENT ON FUNCTION script.fn_scope_ef_perimetro(bigint[],bigint) IS
              'Funzione di scope delle policy ef_whitelist (linee-guida-sql §10.3): l''emittente della riga sta nel perimetro dell''operatore? Il perimetro (script.fn_get_emittenti_scope_pk_ids: NULL = tutti, ''{}'' = nessuno) lo passa la policy in UNA sottoquery scalare non correlata, valutata una volta per istruzione (InitPlan); per riga resta questa chiamata pura (~1,5 µs). Emittente NULL -> false salvo perimetro tutti. Rev 2026-10-18 (20261018-24, D-3b-2c): sostituisce la firma a tre argomenti, che calcolava il perimetro due volte per istruzione.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION script.fn_scope_ef_perimetro(bigint[],bigint);
