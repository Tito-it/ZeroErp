# UNA GRAMMATICA SOLA PER I TIPI DI DOCUMENTO — sotto-giro 2d (G-6): fn_doc_indirizzi_sede perde la colonna dell'ambito
#   Brief: brief-db-grammatica-unica-documenti §7.9 G-6, §10.4.
#
#   La quinta colonna (ambito) traduceva il documento nel plurale degli indirizzi (DDT_VENDITA
#   -> DDT, ORDINE_VENDITA -> ORDINI...): era il traduttore V3 -> V5 del censimento (§7.4).
#   Dal 20261020-47 l'ambito E' il codice del documento: la colonna ripeterebbe il parametro
#   d'ingresso, e si ritira (regola del 2). L'unico lettore, vendite.fn_doc_indirizzo_default,
#   usa p_documento (20261020-50). Cambia il RETURNS TABLE: DROP + CREATE, EXECUTE ridato.
#
#   Corpo e COMMENT dal catalogo vivo di dbdev (2026-10-20), non da uno YAML; sostituzioni
#   contate. %TYPE in firma, DECLARE e RETURNS TABLE dove c'e' una colonna; nudi, col
#   motivo accanto, i valori che una colonna non ha (conteggi, jsonb di lavoro, array).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261020-49-update-fn-doc-indirizzi-sede-senza-ambito-mctit.yaml

  - changeSet:
      id: 20261020-49-update-fn-doc-indirizzi-sede-senza-ambito
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_doc_indirizzi_sede: ritirata la colonna ambito (l'ambito e' il codice del documento); firma e RETURNS TABLE ancorati (DROP + CREATE). Grammatica unica, 2d (G-6).
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION script.fn_doc_indirizzi_sede(character varying);

              CREATE FUNCTION script.fn_doc_indirizzi_sede(p_documento config.sorgenti.codice_interno%TYPE)
               RETURNS TABLE(
                  schema_tabella pg_catalog.pg_namespace.nspname%TYPE,
                  tabella        pg_catalog.pg_class.relname%TYPE,
                  colonna_fk     pg_catalog.pg_attribute.attname%TYPE)
               LANGUAGE plpgsql
               IMMUTABLE
              AS $function$
              -- rev 2026-10-20 (20261020-49, brief-db-grammatica-unica-documenti, 2d G-6):
              --   ritirata la colonna ambito: era la traduzione del documento nel
              --   plurale degli indirizzi, e dal 20261020-47 l'ambito e' il codice
              --   del documento stesso; firma e RETURNS TABLE ancorati.

              -- ⚠️ Tipo nudo DICHIARATO: p_documento e' un selettore senza colonna
              --   di vocabolario (lo stesso di script.fn_get_stato_testata_documento).
              --   Schema, tabella e colonna sono nomi del catalogo: ancorati li'.
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dove stanno gli indirizzi di un documento. Zero righe =
                  --   selettore ignoto: decide il chiamante.
                  -- ⭐ IMMUTABLE: e' una mappa scritta qui, non legge tabelle.
                  -- =========================================================
                  RETURN QUERY
                  SELECT v.s::name, v.t::name, v.fk::name
                    FROM (VALUES
                        ('DDT_VENDITA', 'vendite', 'ddt_indirizzi',                 'ddt_id'),
                        ('ORDINE_VENDITA', 'vendite', 'ordini_indirizzi',              'ordine_id'),
                        ('PREVENTIVO', 'vendite', 'preventivi_indirizzi',          'preventivo_id'),
                        ('OFFERTA_COMMERCIALE', 'vendite', 'offerte_commerciali_indirizzi', 'offerta_id'),
                        ('CONTRATTO',  'vendite', 'contratti_indirizzi',           'contratto_id'),
                        ('FATTURA',    'vendite', 'fatture_indirizzi',             'fattura_id')
                    ) AS v(doc, s, t, fk)
                   WHERE v.doc = p_documento;
              END;
              $function$;

        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              COMMENT ON FUNCTION script.fn_doc_indirizzi_sede(config.sorgenti.codice_interno%TYPE) IS
                'Dove stanno gli indirizzi di un documento: schema e tabella dei suoi *_indirizzi, la colonna verso la testata, l''ambito di config.tipi_indirizzi_allowed. Selettore: DDT, ORDINE, PREVENTIVO, OFFERTA, CONTRATTO (il vocabolario di script.fn_get_stato_testata_documento) e FATTURA. Zero righe = selettore ignoto, decide il chiamante. Schema e nome separati, non regclass: il testo di un regclass dipende dal search_path, e qui finisce in un format(%I). La usano il guard degli indirizzi del cliente, il riempimento dello slot di default e il motivo d''emissione. Brief: brief-db-indirizzi-documento-seguono-il-cliente (§7.2 c). ⭐ rev 2026-10-19 (20261019-43, brief-db-grammatica-unica-documenti lotto 2a, G-1 di Tid): la grammatica delle testate passa ai codici delle sorgenti (DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL; PREVENTIVO, CONTRATTO, COMMESSA, FATTURA invariati); dove sopra si legge un codice corto come selettore, oggi vale il codice della sorgente. p_documento ancorato a config.sorgenti.codice_interno%TYPE: la firma passa da text a character varying (DROP + CREATE, nessun dipendente registrato). L''ambito (quinta colonna) resta al plurale fino al 2d (G-6). Rev 2026-10-20 (20261020-49, brief-db-grammatica-unica-documenti 2d, G-6): ritirata la colonna ambito (era la traduzione del documento nel plurale degli indirizzi: l''ambito ora e'' il codice del documento). Firma e RETURNS TABLE con %TYPE.';

              GRANT EXECUTE ON FUNCTION script.fn_doc_indirizzi_sede(config.sorgenti.codice_interno%TYPE) TO zeroerp_app;

      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION script.fn_doc_indirizzi_sede(config.sorgenti.codice_interno%TYPE);

              CREATE FUNCTION script.fn_doc_indirizzi_sede(p_documento character varying)
               RETURNS TABLE(schema_tabella name, tabella name, colonna_fk name, ambito text)
               LANGUAGE plpgsql
               IMMUTABLE
              AS $function$

              -- ⚠️ Tipo nudo DICHIARATO: p_documento e' un selettore senza colonna
              --   di vocabolario (lo stesso di script.fn_get_stato_testata_documento).
              --   Schema, tabella e colonna sono nomi del catalogo: ancorati li'.
              BEGIN
                  -- =========================================================
                  -- Scopo:
                  --   Dove stanno gli indirizzi di un documento. Zero righe =
                  --   selettore ignoto: decide il chiamante.
                  -- ⭐ IMMUTABLE: e' una mappa scritta qui, non legge tabelle.
                  -- =========================================================
                  RETURN QUERY
                  SELECT v.s::name, v.t::name, v.fk::name, v.amb
                    FROM (VALUES
                        ('DDT_VENDITA', 'vendite', 'ddt_indirizzi',                 'ddt_id',        'DDT'),
                        ('ORDINE_VENDITA', 'vendite', 'ordini_indirizzi',              'ordine_id',     'ORDINI'),
                        ('PREVENTIVO', 'vendite', 'preventivi_indirizzi',          'preventivo_id', 'PREVENTIVI'),
                        ('OFFERTA_COMMERCIALE', 'vendite', 'offerte_commerciali_indirizzi', 'offerta_id',    'OFFERTE'),
                        ('CONTRATTO',  'vendite', 'contratti_indirizzi',           'contratto_id',  'CONTRATTI'),
                        ('FATTURA',    'vendite', 'fatture_indirizzi',             'fattura_id',    'FATTURE')
                    ) AS v(doc, s, t, fk, amb)
                   WHERE v.doc = p_documento;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_doc_indirizzi_sede(character varying) IS
                'Dove stanno gli indirizzi di un documento: schema e tabella dei suoi *_indirizzi, la colonna verso la testata, l''ambito di config.tipi_indirizzi_allowed. Selettore: DDT, ORDINE, PREVENTIVO, OFFERTA, CONTRATTO (il vocabolario di script.fn_get_stato_testata_documento) e FATTURA. Zero righe = selettore ignoto, decide il chiamante. Schema e nome separati, non regclass: il testo di un regclass dipende dal search_path, e qui finisce in un format(%I). La usano il guard degli indirizzi del cliente, il riempimento dello slot di default e il motivo d''emissione. Brief: brief-db-indirizzi-documento-seguono-il-cliente (§7.2 c). ⭐ rev 2026-10-19 (20261019-43, brief-db-grammatica-unica-documenti lotto 2a, G-1 di Tid): la grammatica delle testate passa ai codici delle sorgenti (DDT -> DDT_VENDITA, ORDINE -> ORDINE_VENDITA, OFFERTA -> OFFERTA_COMMERCIALE, RESO -> RESO_VENDITA, EMAIL_BOZZA -> EMAIL; PREVENTIVO, CONTRATTO, COMMESSA, FATTURA invariati); dove sopra si legge un codice corto come selettore, oggi vale il codice della sorgente. p_documento ancorato a config.sorgenti.codice_interno%TYPE: la firma passa da text a character varying (DROP + CREATE, nessun dipendente registrato). L''ambito (quinta colonna) resta al plurale fino al 2d (G-6).';

              GRANT EXECUTE ON FUNCTION script.fn_doc_indirizzi_sede(character varying) TO zeroerp_app;
