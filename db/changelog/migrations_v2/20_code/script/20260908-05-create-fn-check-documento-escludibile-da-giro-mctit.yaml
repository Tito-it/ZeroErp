# ------------------------------------------------------------
# Perche' questo documento non si puo' togliere dal giro.
#   brief-db-uscita-documento-dal-giro §5.4.
#
# ── ⭐ LA REGOLA STA QUI, IN UN POSTO SOLO ────────────────────────
#   La madre `fn_escludi_documento_da_giro` non riscrive il predicato: CHIAMA
#   questa funzione e solleva il codice del PRIMO motivo. Cosi' il tooltip del
#   pulsante spento e il rifiuto non «coincidono oggi»: non possono divergere.
#   Il presidio da scrivere non e' «gli esiti coincidono», e' «la madre non
#   contiene piu' il predicato» (linee-guida-sql §12.5.2).
#
# ── ⚠️ L'ORDINE DELL'ARRAY E' IL CONTRATTO ───────────────────────
#   La madre solleva il PRIMO. Se l'ordine cambiasse, il tooltip direbbe una
#   cosa e l'errore un'altra — cioe' il difetto di partenza spostato di un passo.
#   Precedenza dichiarata, e non implicita:
#     1. il LOTTO — se il giro e' andato oltre il pre-fiscale non c'e' niente da
#        fare su nessun documento, e dirlo per primo evita di far leggere un
#        motivo di dettaglio quando il problema e' il contenitore;
#     2. SENZA ESITO — senza la riga non si puo' nemmeno parlare del suo stato;
#     3. GIA' USCITO — piu' specifico del 4: un documento escluso e' ANCHE «non
#        in errore», e senza questa precedenza scatterebbero tutti e due;
#     4. NON IN ERRORE — il generico.
#
# ── ⭐ TRE RIUSI, NESSUN CONIO INUTILE ────────────────────────────
#   `E_LOTTO_NON_PRE_FISCALE` + `STATO_LOTTO_NON_PRE_FISCALE` + la sua chiave
#   i18n esistono gia' sulla sorella `fn_check_fattura_eliminabile_da_lotto`,
#   con la STESSA condizione e la stessa via d'uscita. Coniare un gemello
#   sarebbe un secondo nome per la stessa cosa.
#   ⭐ E il confine «pre-fiscale» non e' un elenco di stati scritto a mano: e'
#   il flag `config.stati_doc_fiscale.congela_fiscale`, letto FAIL-CLOSED
#   (`COALESCE(..., true)`) come fa la sorella. Un elenco sarebbe una seconda
#   sede della stessa regola, e invecchierebbe al primo stato nuovo.
#
# ── ⛔ LA BOZZA CONDIVISA NON E' UN MOTIVO ───────────────────────
#   Che l'uscita trascini altri documenti e' una CONSEGUENZA, non un divieto
#   (D-2b): rifiutare li'  lascerebbe bloccati anche i documenti di un'altra
#   bozza. Il numero lo dice `script.fn_gruppi_trascinati_da_uscita` e la
#   conferma lo nomina — le conseguenze stanno nella conferma, non in un rifiuto.
#
# ── ⛔ NESSUN `reason` COL PREFISSO `E_` ─────────────────────────
#   Quello e' riservato ai codici a catalogo: un `reason` che comincia per `E_`
#   arriva al guardrail dei codici errore come «codice senza policy».
#
# Verifica: db/pgtap/vendite/test-uscita-documento-dal-giro-v1.sql
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260908-05-create-fn-check-documento-escludibile-da-giro-mctit.yaml

  - changeSet:
      id: 20260908-05-create-fn-check-documento-escludibile-da-giro
      author: mctit
      failOnError: true
      comment: >
        script.fn_check_documento_escludibile_da_giro: i motivi che impediscono
        di togliere un documento dal giro. [] = si puo'. Sede unica del
        predicato: la madre la chiama e solleva il primo motivo, il frontend
        legge lo stesso elenco per spegnere il pulsante col perche'.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                schemaName: vendite
                tableName: fatturazione_lotti_esiti
                columnName: uscita_motivo
            - columnExists:
                schemaName: config
                tableName: stati_doc_fiscale
                columnName: congela_fiscale
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_check_documento_escludibile_da_giro(
                  p_lotto_id   bigint,
                  p_gruppo_key text)
              RETURNS jsonb
              LANGUAGE plpgsql
              STABLE
              AS $function$
              -- Scopo: elencare i motivi che impediscono di togliere UN documento
              --        dal giro di fatturazione. Funzione PURA (fn_check_*):
              --        nessun raise di dominio, nessuna scrittura.
              -- Consumatori: vendite.fn_escludi_documento_da_giro (solleva il
              --        codice del PRIMO motivo) e il frontend, per spiegare
              --        invece di far fallire.
              -- Ritorna: [] se il documento si puo' togliere; altrimenti array
              --        ORDINATO di {codice, reason, reason_key, dettaglio}.
              DECLARE
                  v_motivi        jsonb := '[]'::jsonb;
                  v_lotto_trovato boolean;
                  v_lotto_stato   config.stati_doc_fiscale.codice_interno%TYPE;
                  v_lotto_congela config.stati_doc_fiscale.congela_fiscale%TYPE;
                  v_esito         vendite.fatturazione_lotti_esiti.stato_esecuzione%TYPE;
              BEGIN
                  -- Guard parametri: id assenti o non validi sono errori di
                  -- programmazione, non condizioni di dominio.
                  IF p_lotto_id IS NULL OR p_lotto_id <= 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_documento_escludibile_da_giro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_lotto_id', 'valore', p_lotto_id),
                          NULL::uuid, 'p_lotto_id obbligatorio (> 0)');
                  END IF;

                  IF COALESCE(btrim(p_gruppo_key), '') = '' THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_documento_escludibile_da_giro', 'E_PARAMETRO_INVALIDO',
                          jsonb_build_object('parametro', 'p_gruppo_key', 'valore', p_gruppo_key),
                          NULL::uuid, 'p_gruppo_key obbligatorio');
                  END IF;

                  -- Stato del LOTTO per codice_interno: la chiave stabile e' quella,
                  -- l'id no. LEFT JOIN perche' un lotto senza stato deve arrivare al
                  -- confronto e fallirlo, non sparire.
                  SELECT true, sdf.codice_interno, sdf.congela_fiscale
                    INTO v_lotto_trovato, v_lotto_stato, v_lotto_congela
                    FROM vendite.fatturazione_lotti fl
                    LEFT JOIN config.stati_doc_fiscale sdf ON sdf.id = fl.stato_doc_fiscale_id
                   WHERE fl.id = p_lotto_id;

                  IF NOT COALESCE(v_lotto_trovato, false) THEN
                      PERFORM script.fn_log_and_raise_error(
                          'script', 'fn_check_documento_escludibile_da_giro', 'E_LOTTO_NON_TROVATO',
                          jsonb_build_object('lotto_id', p_lotto_id),
                          NULL::uuid, p_lotto_id::text);
                  END IF;

                  -- MOTIVO 1 — il LOTTO e' oltre il pre-fiscale.
                  -- ⚠️ Fail-closed: con lo stato non risolvibile si blocca, come
                  --    fa la sorella. Non sapere in che stato e' il giro non e'
                  --    un buon motivo per lasciarci mettere le mani.
                  IF COALESCE(v_lotto_congela, true) THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_NON_PRE_FISCALE',
                          'reason',     'STATO_LOTTO_NON_PRE_FISCALE',
                          'reason_key', 'vendite.lotti.azione_reason.lotto_non_pre_fiscale',
                          'dettaglio',  COALESCE(v_lotto_stato, '-'));
                  END IF;

                  SELECT e.stato_esecuzione
                    INTO v_esito
                    FROM vendite.fatturazione_lotti_esiti e
                   WHERE e.lotto_id = p_lotto_id
                     AND e.gruppo_key = p_gruppo_key;

                  -- MOTIVO 2 — il documento non e' fra gli esiti di questo lotto.
                  -- ⚠️ Precede i due seguenti per costruzione: senza la riga non
                  --    si puo' parlare del suo stato.
                  IF v_esito IS NULL THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_DOC_SENZA_ESITO',
                          'reason',     'SENZA_ESITO',
                          'reason_key', 'vendite.lotti.azione_reason.documento_senza_esito',
                          'dettaglio',  p_gruppo_key);

                  -- MOTIVO 3 — e' gia' uscito.
                  -- ⚠️ PRECEDE il motivo 4, e la precedenza e' portante: un
                  --    documento ESCLUSO e' ANCHE «non in errore», quindi senza
                  --    questo ramo scatterebbero tutti e due e la madre
                  --    solleverebbe quello sbagliato.
                  ELSIF v_esito = 'ESCLUSO' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_DOC_GIA_USCITO',
                          'reason',     'GIA_USCITO',
                          'reason_key', 'vendite.lotti.azione_reason.documento_gia_uscito',
                          'dettaglio',  p_gruppo_key);

                  -- MOTIVO 4 — non e' in errore (D-4): dal giro si tolgono solo i
                  -- documenti che hanno fallito.
                  ELSIF v_esito <> 'ERRORE' THEN
                      v_motivi := v_motivi || jsonb_build_object(
                          'codice',     'E_LOTTO_DOC_NON_IN_ERRORE',
                          'reason',     'DOCUMENTO_NON_IN_ERRORE',
                          'reason_key', 'vendite.lotti.azione_reason.documento_non_in_errore',
                          'dettaglio',  v_esito);
                  END IF;

                  RETURN v_motivi;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_check_documento_escludibile_da_giro(bigint, text)
              IS 'I motivi che impediscono di togliere UN documento dal giro di '
                 'fatturazione: [] se si puo'', altrimenti array ORDINATO di '
                 '{codice, reason, reason_key, dettaglio}. ⭐ SEDE UNICA del predicato: '
                 'vendite.fn_escludi_documento_da_giro la CHIAMA e solleva il codice del '
                 'primo motivo, il frontend legge lo stesso elenco per spegnere il '
                 'pulsante col perche'' — cosi'' tooltip e rifiuto non possono divergere. '
                 '⚠️ L''ORDINE e'' il contratto (la madre solleva il primo): lotto, poi '
                 'assenza di esito, poi «gia'' uscito», poi «non in errore». La terza '
                 'precede la quarta perche'' un documento ESCLUSO e'' ANCHE non-in-errore, '
                 'e senza precedenza scatterebbero entrambe. ⭐ Riusa '
                 'E_LOTTO_NON_PRE_FISCALE e la sua chiave i18n dalla sorella '
                 'fn_check_fattura_eliminabile_da_lotto: stessa condizione, stesso '
                 'rimedio, un codice solo. Il confine pre-fiscale e'' il flag '
                 'config.stati_doc_fiscale.congela_fiscale letto fail-closed, mai un '
                 'elenco di stati scritto a mano. ⛔ La bozza CONDIVISA non e'' un motivo: '
                 'e'' una conseguenza (D-2b), la dichiara '
                 'script.fn_gruppi_trascinati_da_uscita e la nomina la conferma. '
                 'Brief: brief-db-uscita-documento-dal-giro §5.4.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_check_documento_escludibile_da_giro(bigint, text);
