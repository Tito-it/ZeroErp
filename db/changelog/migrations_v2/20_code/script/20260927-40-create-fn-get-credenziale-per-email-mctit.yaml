# LA CREDENZIALE DI UN'EMAIL, CON LE SUE VESTI: script.fn_get_credenziale_per_email(p_email)
#   Brief: brief-db-blocco-login-per-credenziale, sezione 17 (richiesta del
#   backend del 2026-09-27, B-6 / B-20 / F-4)
#
# ── IL DIFETTO ───────────────────────────────────────────────────────
#   Il 20260925-51 mette auth_user_id, username e vesti della credenziale
#   trovata nel CONTESTO di E_CREDENZIALE_DA_CONFERMARE, «per il dialog». Ma il
#   contesto non e' un canale verso il client: fn_log_and_raise_error lo scrive
#   in dbops.error_log, e l'eccezione porta solo messaggio, DETAIL, HINT e i
#   canali CONSTRAINT / COLUMN / DATATYPE. Al backend non arrivano ne' l'id da
#   dichiarare ne' le vesti da mostrare: il dialog di conferma non si puo' fare.
#
# ── ⭐ PERCHE' UN BUILDING BLOCK (regola del 2) ──────────────────────
#   «La credenziale di questa email, con username e vesti» la chiedono in DUE:
#     - la madre anagrafiche.fn_crea_operatore_v2, al passo 2-bis, per il
#       rifiuto E_CREDENZIALE_DA_CONFERMARE (fino a oggi con una sua lettura);
#     - il backend, per il dialog di conferma (endpoint AdminAPIView, B-20).
#   Dialog e rifiuto leggono cosi' la STESSA cosa, e non possono divergere: la
#   madre passa a questa funzione nello stesso cantiere (20260927-41).
#   La credenziale la trova script.fn_get_auth_user_id_for_email (sede della
#   regola «quale credenziale ha questa email»): senza maiuscole, email vuota =
#   nessuna, due credenziali = E_CREDENZIALE_EMAIL_AMBIGUA.
#
# ── LA FORMA ─────────────────────────────────────────────────────────
#   - zero righe se l'email non ha credenziale (anche NULL o vuota);
#   - una riga se ce l'ha, ANCHE senza vesti: vesti = '[]' (la credenziale
#     esiste, ed e' proprio quello che l'admin deve vedere);
#   - vesti: la forma che la madre costruiva gia' (ruolo_applicativo, attivo,
#     soggetto = ragione_sociale_completa), in ordine di id.
#
# ── ⛔ NESSUN GUARD DI PERMESSO (decisione di Tid, 2026-09-27) ─────────
#   Dice se un'email ha un accesso e con quali vesti: informazione da
#   amministratore. Il cancello resta la porta del backend (AdminAPIView,
#   SUPER_ADMIN). Un fn_guard_super_admin qui:
#     - romperebbe la madre, che la chiama nel ramo del rifiuto: chi non e'
#       SUPER_ADMIN leggerebbe E_PERMESSO_NEGATO invece di
#       E_CREDENZIALE_DA_CONFERMARE, un permesso nato dentro un ramo d'errore;
#     - non chiuderebbe niente: l'app legge gia' django.auth_user e
#       anagrafiche.identita_digitali (il modello del verbo chiude le
#       scritture, non le letture — D-B1 riguardava due verbi di scrittura).
#
# ⚠️ plpgsql e tipi espliciti: nomina django.auth_user, che in CI non esiste
#   quando gira Liquibase (niente LANGUAGE sql, niente %TYPE su Django).
# INVOKER, STABLE: le vesti si leggono sotto la RLS di chi chiama, come la madre
#   le leggeva.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260927-40-create-fn-get-credenziale-per-email-mctit.yaml

  - changeSet:
      id: 20260927-40-create-fn-get-credenziale-per-email
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_get_credenziale_per_email(p_email): la credenziale di un'email con username e
        vesti (ruolo_applicativo, attivo, soggetto, in ordine di id). Zero righe se l'email non ha
        credenziale; vesti = [] se non ne ha. Building block (regola del 2): il rifiuto
        E_CREDENZIALE_DA_CONFERMARE della madre e il dialog di conferma del backend.
        Brief: brief-db-blocco-login-per-credenziale §17.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_get_credenziale_per_email(
                  -- ⚠️ text e non %TYPE: e' django.auth_user.email (schema django
                  --    assente in CI quando gira Liquibase).
                  p_email text
              )
              -- ⚠️ integer e text espliciti: sono colonne di django.auth_user.
              --    vesti e' composta qui: nessuna colonna da ancorare.
              RETURNS TABLE (
                  auth_user_id integer,
                  username     text,
                  vesti        jsonb
              )
              LANGUAGE plpgsql
              STABLE
              SECURITY INVOKER
              AS $function$
              -- Scopo: la credenziale che porta questa email, con il suo username e
              --   le sue vesti, per chi deve decidere se riusarla.
              -- Uso: SELECT * FROM script.fn_get_credenziale_per_email(p_email);
              DECLARE
                  -- integer esplicito: e' django.auth_user.id (niente %TYPE su Django).
                  v_id integer;
              BEGIN
                  -- La regola «quale credenziale ha questa email» sta in un posto solo:
                  --   senza maiuscole, email vuota = nessuna, due = errore.
                  v_id := script.fn_get_auth_user_id_for_email(p_email);

                  IF v_id IS NULL THEN
                      RETURN;
                  END IF;

                  -- ⭐ Una riga anche senza vesti: la credenziale c'e', ed e' proprio
                  --   cio' che l'admin deve vedere prima di riusarla.
                  RETURN QUERY
                  SELECT au.id,
                         au.username::text,
                         COALESCE((
                             SELECT jsonb_agg(jsonb_build_object(
                                        'ruolo_applicativo', idg.ruolo_applicativo,
                                        'attivo',            idg.attivo,
                                        'soggetto',          s.ragione_sociale_completa)
                                      ORDER BY idg.id)
                               FROM anagrafiche.identita_digitali idg
                               JOIN anagrafiche.soggetti_ruoli sr ON sr.id = idg.soggetto_ruolo_id
                               JOIN anagrafiche.soggetti s        ON s.id  = sr.soggetto_id
                              WHERE idg.auth_user_id = au.id), '[]'::jsonb)
                    FROM django.auth_user au
                   WHERE au.id = v_id;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_get_credenziale_per_email(text) IS
                  'Building block: la credenziale che porta questa email (la trova script.fn_get_auth_user_id_for_email: senza maiuscole, email vuota = nessuna, due credenziali = E_CREDENZIALE_EMAIL_AMBIGUA), con username e vesti. Ritorna TABLE(auth_user_id, username, vesti jsonb): zero righe se l''email non ha credenziale; una riga anche senza vesti (vesti = []). vesti = array di {ruolo_applicativo, attivo, soggetto (ragione_sociale_completa)} in ordine di id. Regola del 2 (brief-db-blocco-login-per-credenziale §17): la leggono la madre anagrafiche.fn_crea_operatore_v2 per il rifiuto E_CREDENZIALE_DA_CONFERMARE e il backend per il dialog di conferma, che cosi'' mostrano la stessa cosa. Nessun guard di permesso (Tid, 2026-09-27): il cancello e'' la porta AdminAPIView, e un guard qui cambierebbe il rifiuto della madre in E_PERMESSO_NEGATO. plpgsql e tipi espliciti perche'' nomina django.*. INVOKER, STABLE.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_get_credenziale_per_email(text);
