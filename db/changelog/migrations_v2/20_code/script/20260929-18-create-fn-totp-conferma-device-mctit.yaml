# P-8 — IL SETUP FINISCE QUI: script.fn_totp_conferma_device(p_auth_user_id, p_passo)
#   Brief: brief-db-secondo-fattore-totp, sezioni 3 e 4.
#
# ── ⭐ COSA FA ───────────────────────────────────────────────────────
#   Il backend ha verificato il primo codice col segreto: il device diventa
#   confermato (in uso) e il PASSO di quel codice e' il primo registrato — da
#   li' parte l'anti-replay (chk_auth_totp_device_confermato_passo).
#
# ── ⚠️ NESSUN PASSO «GIA' USATO» QUI ────────────────────────────────
#   Il brief lo elencava anche per la conferma: ma un device non confermato
#   non ha un passo (la registrazione lo azzera), quindi non c'e' niente con
#   cui confrontarlo. Il replay del codice di conferma lo ferma il passo
#   registrato qui, al primo uso successivo.
#
# ── ⭐ UNA ISTRUZIONE ────────────────────────────────────────────────
#   UPDATE … WHERE NOT confermato: due conferme simultanee, una passa; la
#   seconda trova il device gia' confermato -> E_TOTP_DEVICE_GIA_ATTIVO.
#   Nessun device -> E_TOTP_DEVICE_ASSENTE.
#
# Chi agisce: l'utente stesso (script.fn_guard_utente_stesso). SECURITY
# DEFINER del PROPRIETARIO, search_path bloccato.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260929-18-create-fn-totp-conferma-device-mctit.yaml

  - changeSet:
      id: 20260929-18-create-fn-totp-conferma-device
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        script.fn_totp_conferma_device(p_auth_user_id, p_passo): il backend ha verificato il primo
        codice; il device diventa confermato e registra il passo (da li' l'anti-replay). Gia'
        confermato -> E_TOTP_DEVICE_GIA_ATTIVO, nessun device -> E_TOTP_DEVICE_ASSENTE. Chi agisce:
        l'utente stesso. SECURITY DEFINER del proprietario. Brief: brief-db-secondo-fattore-totp §3-4.
      preConditions:
        - onFail: HALT
        - and:
            - columnExists:
                { schemaName: config, tableName: auth_totp_device, columnName: ultimo_passo_usato }
            - sqlCheck:
                expectedResult: "1"
                sql: >
                  SELECT count(*) FROM pg_catalog.pg_proc p
                    JOIN pg_catalog.pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'script' AND p.proname = 'fn_guard_utente_stesso';
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_totp_conferma_device(
                  p_auth_user_id integer,
                  p_passo        config.auth_totp_device.ultimo_passo_usato%TYPE
              )
              RETURNS void
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public, pg_temp
              AS $function$
              -- Scopo: confermare il device dopo il primo codice verificato dal
              --   backend, registrandone il passo.
              DECLARE
                  v_device_id config.auth_totp_device.id%TYPE;
              BEGIN
                  -- Prima riga: chi agisce e' la credenziale stessa.
                  PERFORM script.fn_guard_utente_stesso(
                      NULLIF(current_setting('app.current_user_id', true), '')::integer,
                      p_auth_user_id);

                  IF p_auth_user_id <= 0 OR p_passo IS NULL OR p_passo < 0 THEN
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_totp_conferma_device', 'E_AUTH_CHIAMATA_NON_VALIDA',
                          jsonb_build_object('p_auth_user_id', p_auth_user_id, 'p_passo', p_passo),
                          NULL::uuid,
                          VARIADIC ARRAY['script.fn_totp_conferma_device',
                                         'credenziale e passo (>= 0) obbligatori']);
                  END IF;

                  UPDATE config.auth_totp_device d
                     SET confermato         = true,
                         ultimo_passo_usato = p_passo,
                         ultimo_uso_at      = now()
                   WHERE d.auth_user_id = p_auth_user_id
                     AND NOT d.confermato
                  RETURNING d.id INTO v_device_id;

                  IF v_device_id IS NULL THEN
                      IF EXISTS (SELECT 1 FROM config.auth_totp_device d
                                  WHERE d.auth_user_id = p_auth_user_id) THEN
                          PERFORM script.fn_log_and_raise_error(
                              'database', 'script.fn_totp_conferma_device', 'E_TOTP_DEVICE_GIA_ATTIVO',
                              jsonb_build_object('auth_user_id', p_auth_user_id),
                              NULL::uuid,
                              VARIADIC ARRAY[]::text[]);
                      END IF;
                      PERFORM script.fn_log_and_raise_error(
                          'database', 'script.fn_totp_conferma_device', 'E_TOTP_DEVICE_ASSENTE',
                          jsonb_build_object('auth_user_id', p_auth_user_id),
                          NULL::uuid,
                          VARIADIC ARRAY[]::text[]);
                  END IF;
              END;
              $function$;

              COMMENT ON FUNCTION script.fn_totp_conferma_device(integer, bigint) IS
                  'Conferma il device del secondo fattore (TOTP) dopo che il backend ha verificato il primo codice: confermato = true e il PASSO di quel codice diventa il primo registrato (da li'' l''anti-replay di script.fn_totp_registra_uso). Una istruzione (UPDATE … WHERE NOT confermato). Gia'' confermato -> E_TOTP_DEVICE_GIA_ATTIVO; nessun device -> E_TOTP_DEVICE_ASSENTE; passo NULL o < 0 -> E_AUTH_CHIAMATA_NON_VALIDA. Nessun controllo di passo gia'' usato: un device non confermato non ne ha. Chi agisce: la credenziale stessa (script.fn_guard_utente_stesso). SECURITY DEFINER del PROPRIETARIO, search_path bloccato. Brief: brief-db-secondo-fattore-totp §3-4.';
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DROP FUNCTION IF EXISTS script.fn_totp_conferma_device(integer, bigint);
