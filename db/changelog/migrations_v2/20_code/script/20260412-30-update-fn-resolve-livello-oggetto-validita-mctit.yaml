# Liquibase changelog per Zero ERP
# ------------------------------------------------------------
# Migrazione daterange: aggiorna fn_resolve_livello_oggetto.
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20260412-30-update-fn-resolve-livello-oggetto-validita-mctit.yaml

  - changeSet:
      id: 20260412-30-update-fn-resolve-livello-oggetto-validita
      author: mctit
      runOnChange: false
      comment: >
        Filtro temporale override oggetti: da doppio confronto
        valido_dal/valido_al a validita @> CURRENT_DATE.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              CREATE OR REPLACE FUNCTION script.fn_resolve_livello_oggetto(
                  p_auth_user_id integer,
                  p_app_label character varying,
                  p_model_name character varying,
                  p_area_schema_db character varying
              )
               RETURNS config.livello_accesso
               LANGUAGE plpgsql
               STABLE
              AS $function$
              DECLARE
                v_ruolo   anagrafiche.risorse_umane_auth_user.ruolo_sistema%TYPE;
                v_livello config.user_override_oggetti.livello%TYPE;
              BEGIN
                -- =========================================================
                -- Scopo:
                --   Risolve il livello di accesso per un singolo model
                --   Django (app_label + model_name).
                --   Se esiste un override oggetto lo usa, altrimenti
                --   risale alla catena area via fn_resolve_livello_area.
                --
                -- Catena:
                --   1. ruolo_sistema (NULL/DISABILITATO -> BLOCCATO, ADMIN -> TUTTO)
                --   2. Override utente oggetto (se presente e valido)
                --   3. Fallback -> fn_resolve_livello_area
                -- =========================================================

                -- 1. Ruolo sistema
                v_ruolo := script.fn_get_ruolo_sistema(p_auth_user_id);

                IF v_ruolo IS NULL OR v_ruolo = 'DISABILITATO' THEN
                  RETURN 'BLOCCATO'::config.livello_accesso;
                END IF;

                IF v_ruolo = 'ADMIN' THEN
                  RETURN 'TUTTO'::config.livello_accesso;
                END IF;

                -- 2. Override utente oggetto (OPERATIVO)
                -- Filtro temporale via colonna validita nativa
                SELECT uoo.livello
                  INTO v_livello
                  FROM config.user_override_oggetti uoo
                 WHERE uoo.auth_user_id = p_auth_user_id
                   AND uoo.app_label    = p_app_label
                   AND uoo.model_name   = p_model_name
                   AND uoo.validita @> CURRENT_DATE;

                IF FOUND THEN
                  RETURN v_livello;
                END IF;

                -- 3. Fallback alla catena area
                RETURN script.fn_resolve_livello_area(p_auth_user_id, p_area_schema_db);
              END
              $function$;

              COMMENT ON FUNCTION script.fn_resolve_livello_oggetto(integer, character varying, character varying, character varying)
              IS 'Risolve livello accesso oggetto per utente. Migrazione daterange: filtro temporale via validita @>.';
