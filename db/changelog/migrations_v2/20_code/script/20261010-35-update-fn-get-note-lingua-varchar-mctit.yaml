# CHARACTER(N) -> VARCHAR: LE FUNZIONI CHE NE DIPENDONO (20261010-35-update-fn-get-note-lingua-varchar)
#   Brief: brief-db-character-n-spazi-di-riempimento.md §4 punto 2
#
#   script.fn_get_note castava la lingua a char(5) (l.codice_iso::char(5)): gli spazi li fabbricava lei, da un
#   config.lingue.codice_iso varchar(5). Ora la lingua esce com'e', ancorata a config.lingue.codice_iso.
#   I tre wrapper (vendite, acquisti, magazzino) dichiaravano lingua char(5): una SELECT finale che
#   restituisce varchar non combacia piu'. magazzino.fn_get_magazzino_note legge magazzino.note, la cui
#   lingua e' varchar(5) dal -26. DROP + CREATE di tutte e quattro (cambia il risultato); il RETURNS si
#   ancora dove c'e' una colonna di cui e' il riflesso (magazzino.note; stile e lingua dai vocabolari),
#   resta esplicito dove la tabella e' polimorfa (fn_get_note via regclass), con la ragione scritta.
#
#   Firma, RETURNS e COMMENT con %TYPE dove esiste una colonna di cui il valore e' il riflesso;
#   dove non c'e', il tipo e' esplicito e la ragione e' scritta accanto. GRANT all'applicazione
#   esplicito (il ruolo batch lo copre il provisioning, linee-guida-sql §11.6).
#   Gira nella stessa corsa di 20261010-26 (conversione) e -27 ... -30 (viste).
# ------------------------------------------------------------

databaseChangeLog:
  - logicalFilePath: migrations_v2/20_code/script/20261010-35-update-fn-get-note-lingua-varchar-mctit.yaml

  - changeSet:
      id: 20261010-35-update-fn-get-note-lingua-varchar
      author: mctit
      runOnChange: false
      failOnError: true
      comment: >
        Dopo la conversione character(n) -> varchar di 20261010-26: update fn get note lingua varchar.
        Brief: brief-db-character-n-spazi-di-riempimento.md §4.
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DROP FUNCTION vendite.fn_get_vendite_note(text, bigint, bigint, boolean, boolean, boolean);
              DROP FUNCTION acquisti.fn_get_acquisti_note(text, bigint, bigint, boolean, boolean, boolean);
              DROP FUNCTION magazzino.fn_get_magazzino_note(text, bigint, bigint, boolean, boolean, boolean);
              DROP FUNCTION script.fn_get_note(regclass, text, bigint, bigint, boolean, boolean, boolean);

              CREATE OR REPLACE FUNCTION script.fn_get_note(
                -- Tipi espliciti: la tabella e' polimorfa (regclass), nessuna colonna sola
                -- di cui i parametri siano il riflesso; i booleani sono interruttori.
                p_note_table     regclass,  -- es. 'vendite.note'::regclass o 'acquisti.note'::regclass
                _target_tipo     text,
                _target_id       bigint,
                _target_riga_id  bigint DEFAULT NULL,
                _include_doc     boolean DEFAULT true,
                _include_righe   boolean DEFAULT true,
                _only_visible    boolean DEFAULT true
              )
              RETURNS TABLE (
                -- Tipi espliciti: la tabella delle note e' polimorfa (regclass), nessuna
                -- colonna sola di cui questi siano il riflesso. Si ancorano i due valori
                -- che arrivano da un vocabolario: stile e lingua.
                target_tipo     text,
                target_id       bigint,
                target_riga_id  bigint,
                anchor_tipo     text,
                posizione       text,
                seq             integer,
                testo           text,
                testo_md        text,
                stile           config.note_stili.codice%TYPE,
                lingua          config.lingue.codice_iso%TYPE,
                visibile        boolean,
                solo_stampa     boolean,
                meta            jsonb,
                data_insert     timestamptz,
                user_insert     text,
                data_update     timestamptz,
                user_update     text
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                sql text;
              BEGIN
                /*
                  Funzione generica per estrarre note normalizzate da una tabella *.note:
                  - p_note_table: regclass della tabella (es. 'vendite.note'::regclass)
                  - lingua  da config.lingue (l.codice_iso) via id_lingua
                  - stile   da config.note_stili (s.codice) via id_stile
                */
                sql := $q$
                  SELECT
                    n.target_tipo,
                    n.target_id,
                    n.target_riga_id,
                    n.anchor_tipo,
                    n.posizione,
                    n.seq,
                    n.testo,
                    n.testo_md,
                    s.codice                      AS stile,
                    l.codice_iso                  AS lingua,
                    n.visibile,
                    n.solo_stampa,
                    n.meta,
                    n.data_insert,
                    n.user_insert,
                    n.data_update,
                    n.user_update
                  FROM %s AS n
                  JOIN config.note_stili AS s
                    ON s.id = n.id_stile
                  LEFT JOIN config.lingue AS l
                    ON l.id = n.id_lingua
                  WHERE n.target_tipo = UPPER($1)
                    AND n.target_id   = $2
                    AND ($3 IS NULL OR n.target_riga_id = $3)
                    AND (
                          ($4 AND n.anchor_tipo = 'DOCUMENTO')
                       OR ($5 AND n.anchor_tipo = 'RIGA')
                    )
                    AND (NOT $6 OR n.visibile IS TRUE)
                  ORDER BY
                    CASE n.anchor_tipo WHEN 'DOCUMENTO' THEN 1 ELSE 2 END,
                    n.posizione,
                    n.seq,
                    n.id
                $q$;

                RETURN QUERY
                EXECUTE format(sql, p_note_table::text)
                USING _target_tipo, _target_id, _target_riga_id, _include_doc, _include_righe, _only_visible;
              END;
              $$;

              COMMENT ON FUNCTION script.fn_get_note(regclass, text, bigint, bigint, boolean, boolean, boolean) IS
                'Funzione generica: legge note normalizzate da una tabella *.note (passata come regclass); stile/lingua da domini. La lingua esce com''e'' (varchar), senza il cast a char(5) che la riempiva di spazi (20261010-35).';
              GRANT EXECUTE ON FUNCTION script.fn_get_note(regclass, text, bigint, bigint, boolean, boolean, boolean) TO zeroerp_app;

              CREATE OR REPLACE FUNCTION vendite.fn_get_vendite_note(
                -- text e non %TYPE: target_tipo e' varchar nelle tabelle, e ancorarlo
                -- cambierebbe l'identita' della funzione (overload). I tre booleani sono
                -- interruttori del chiamante, senza colonna.
                _target_tipo      text,
                _target_id        vendite.note.target_id%TYPE,
                _target_riga_id   vendite.note.target_riga_id%TYPE DEFAULT NULL,
                _include_doc      boolean DEFAULT true,
                _include_righe    boolean DEFAULT true,
                _only_visible     boolean DEFAULT true
              )
              RETURNS TABLE (
                -- Tipi espliciti: la tabella delle note e' polimorfa (regclass), nessuna
                -- colonna sola di cui questi siano il riflesso. Si ancorano i due valori
                -- che arrivano da un vocabolario: stile e lingua.
                target_tipo     text,
                target_id       bigint,
                target_riga_id  bigint,
                anchor_tipo     text,
                posizione       text,
                seq             integer,
                testo           text,
                testo_md        text,
                stile           config.note_stili.codice%TYPE,
                lingua          config.lingue.codice_iso%TYPE,
                visibile        boolean,
                solo_stampa     boolean,
                meta            jsonb,
                data_insert     timestamptz,
                user_insert     text,
                data_update     timestamptz,
                user_update     text
              )
              LANGUAGE sql
              STABLE
              AS $$
                SELECT * FROM script.fn_get_note('vendite.note'::regclass,
                                                 _target_tipo, _target_id, _target_riga_id,
                                                 _include_doc, _include_righe, _only_visible);
              $$;

              COMMENT ON FUNCTION vendite.fn_get_vendite_note(text, vendite.note.target_id%TYPE, vendite.note.target_riga_id%TYPE, boolean, boolean, boolean) IS
                'Wrapper su script.fn_get_note per la tabella vendite.note.';
              GRANT EXECUTE ON FUNCTION vendite.fn_get_vendite_note(text, vendite.note.target_id%TYPE, vendite.note.target_riga_id%TYPE, boolean, boolean, boolean) TO zeroerp_app;

              CREATE OR REPLACE FUNCTION acquisti.fn_get_acquisti_note(
                -- text e non %TYPE: target_tipo e' varchar nelle tabelle, e ancorarlo
                -- cambierebbe l'identita' della funzione (overload). I tre booleani sono
                -- interruttori del chiamante, senza colonna.
                _target_tipo      text,
                _target_id        acquisti.note.target_id%TYPE,
                _target_riga_id   acquisti.note.target_riga_id%TYPE DEFAULT NULL,
                _include_doc      boolean DEFAULT true,
                _include_righe    boolean DEFAULT true,
                _only_visible     boolean DEFAULT true
              )
              RETURNS TABLE (
                -- Tipi espliciti: la tabella delle note e' polimorfa (regclass), nessuna
                -- colonna sola di cui questi siano il riflesso. Si ancorano i due valori
                -- che arrivano da un vocabolario: stile e lingua.
                target_tipo     text,
                target_id       bigint,
                target_riga_id  bigint,
                anchor_tipo     text,
                posizione       text,
                seq             integer,
                testo           text,
                testo_md        text,
                stile           config.note_stili.codice%TYPE,
                lingua          config.lingue.codice_iso%TYPE,
                visibile        boolean,
                solo_stampa     boolean,
                meta            jsonb,
                data_insert     timestamptz,
                user_insert     text,
                data_update     timestamptz,
                user_update     text
              )
              LANGUAGE sql
              STABLE
              AS $$
                SELECT * FROM script.fn_get_note('acquisti.note'::regclass,
                                                 _target_tipo, _target_id, _target_riga_id,
                                                 _include_doc, _include_righe, _only_visible);
              $$;

              COMMENT ON FUNCTION acquisti.fn_get_acquisti_note(text, acquisti.note.target_id%TYPE, acquisti.note.target_riga_id%TYPE, boolean, boolean, boolean) IS
                'Wrapper su script.fn_get_note per la tabella acquisti.note.';
              GRANT EXECUTE ON FUNCTION acquisti.fn_get_acquisti_note(text, acquisti.note.target_id%TYPE, acquisti.note.target_riga_id%TYPE, boolean, boolean, boolean) TO zeroerp_app;

              CREATE OR REPLACE FUNCTION magazzino.fn_get_magazzino_note(
                -- text e non %TYPE: target_tipo e' varchar(32), e ancorarlo cambierebbe
                -- l'identita' della funzione (overload). I tre booleani sono interruttori.
                _target_tipo      text,     --(es. 'ASSET', 'TRASFERIMENTO', ...)
                _target_id        magazzino.note.target_id%TYPE,   -- id della testata (o del movimento/asset)
                _target_riga_id   magazzino.note.target_riga_id%TYPE DEFAULT NULL,    -- se valorizzato, filtra le note di *quella* riga
                _include_doc      boolean DEFAULT true,   -- include le note DOCUMENTO (default true)
                _include_righe    boolean DEFAULT true,   -- include le note RIGA      (default true)
                _only_visible     boolean DEFAULT true    -- filtra su visibile=true (default true
              )
              RETURNS TABLE (
                target_tipo     magazzino.note.target_tipo%TYPE,
                target_id       magazzino.note.target_id%TYPE,
                target_riga_id  magazzino.note.target_riga_id%TYPE,
                anchor_tipo     magazzino.note.anchor_tipo%TYPE,
                posizione       magazzino.note.posizione%TYPE,
                seq             magazzino.note.seq%TYPE,
                testo           magazzino.note.testo%TYPE,
                testo_md        magazzino.note.testo_md%TYPE,
                stile           magazzino.note.stile%TYPE,
                lingua          magazzino.note.lingua%TYPE,
                visibile        magazzino.note.visibile%TYPE,
                solo_stampa     magazzino.note.solo_stampa%TYPE,
                meta            magazzino.note.meta%TYPE,
                data_insert     magazzino.note.data_insert%TYPE,
                user_insert     magazzino.note.user_insert%TYPE,
                data_update     magazzino.note.data_update%TYPE,
                user_update     magazzino.note.user_update%TYPE
              )
              LANGUAGE sql
              STABLE
              AS $$
               ------------------------------------------------------
               -- Funzione generica per estrarre note per target_tipo/target_id
               ------------------------------------------------------
                SELECT
                  n.target_tipo,
                  n.target_id,
                  n.target_riga_id,
                  n.anchor_tipo,
                  n.posizione,
                  n.seq,
                  n.testo,
                  n.testo_md,
                  n.stile,
                  n.lingua,
                  n.visibile,
                  n.solo_stampa,
                  n.meta,
                  n.data_insert,
                  n.user_insert,
                  n.data_update,
                  n.user_update
                FROM magazzino.note AS n
                WHERE n.target_tipo = upper(_target_tipo)
                  AND n.target_id   = _target_id
                  AND (_target_riga_id IS NULL OR n.target_riga_id = _target_riga_id)
                  AND (
                        (_include_doc   AND n.anchor_tipo = 'DOCUMENTO')
                     OR (_include_righe AND n.anchor_tipo = 'RIGA')
                  )
                  AND (_only_visible IS FALSE OR n.visibile IS TRUE)
                ORDER BY
                  -- ordina prima DOCUMENTO poi RIGA, mantenendo il rendering naturale
                  CASE n.anchor_tipo WHEN 'DOCUMENTO' THEN 1 ELSE 2 END,
                  n.posizione,
                  n.seq,
                  n.id;  -- id come tie-breaker
              $$;

              COMMENT ON FUNCTION magazzino.fn_get_magazzino_note(text, magazzino.note.target_id%TYPE, magazzino.note.target_riga_id%TYPE, boolean, boolean, boolean) IS
                'Estrae note per target_tipo/target_id (opz. riga), con filtri per DOCUMENTO/RIGA e visibilità.';
              GRANT EXECUTE ON FUNCTION magazzino.fn_get_magazzino_note(text, magazzino.note.target_id%TYPE, magazzino.note.target_riga_id%TYPE, boolean, boolean, boolean) TO zeroerp_app;
